---
layout: null
---
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Language Student Desk</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f4f1ea; color: #1a1a1a; font: 14px/1.4 Tahoma, Arial, sans-serif; }
    header, main { max-width: 820px; margin: 0 auto; padding: 16px; }
    .back a { color: #000080; font-size: 13px; text-decoration: none; }
    .back a:hover { text-decoration: underline; }
    h1 { font-size: 22px; margin: 8px 0 4px; }
    .build { float: right; color: #666; font-size: 11px; letter-spacing: 0.12em; }
    .lead { color: #444; margin: 0 0 16px; }
    .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 0 0 12px; }
    select, button { font: inherit; padding: 6px 10px; }
    button { border: 2px solid; border-color: #fff #404040 #404040 #fff; background: #d4d4d4; cursor: pointer; }
    button:active { border-color: #404040 #fff #fff #404040; }
    button.on { background: #000080; color: #fff; }
    .tools { border: 2px solid; border-color: #808080 #fff #fff #808080; background: #fff; }
    .tool { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid #eee; background: transparent; padding: 10px 12px; cursor: pointer; }
    .tool:hover, .tool.sel { background: #000080; color: #fff; }
    .tool strong { display: block; }
    .tool span { font-size: 12px; color: #555; }
    .tool.sel span { color: #cce; }
    #status { margin-top: 12px; padding: 6px 8px; background: #e8e8e8; border: 1px solid #ccc; font-size: 12px; }
  </style>
</head>
<body>
<header>
  <p class="back"><a href="../">Back to the desktop</a> <span class="build">17.001</span></p>
  <h1>Language Student Desk</h1>
  <p class="lead">Scan and launch language tools. Select a tool, optionally scope a language, then open.</p>
  <div class="bar">
    <label>Scope to language
      <select id="lang">
        <option value="">(none)</option>
        <option value="klingon">klingon</option>
        <option value="japanese">japanese</option>
        <option value="arabic">arabic</option>
        <option value="chinese">chinese</option>
        <option value="cyrillic">cyrillic</option>
        <option value="hangul">hangul</option>
        <option value="hindi">hindi</option>
        <option value="latin">latin</option>
        <option value="english">english</option>
        <option value="python">python</option>
        <option value="quickbasic">quickbasic</option>
        <option value="brainfood">brainfood</option>
        <option value="delphi">delphi</option>
        <option value="intercal">intercal</option>
        <option value="lolcode">lolcode</option>
        <option value="malbolge">malbolge</option>
        <option value="piet">piet</option>
        <option value="whitespace">whitespace</option>
        <option value="win16">win16</option>
        <option value="z80">z80</option>
      </select>
    </label>
    <button type="button" id="open">Open</button>
  </div>
</header>
<main>
  <div class="tools" id="tools"></div>
  <div id="status">Ready.</div>
</main>
<script>
var BASE = "https://cdn.jsdelivr.net/gh/squirelworks/LanguageStudentDesk@main/";
var TOOLS = [
  { id: "klingon", name: "Klingon", about: "pIqaD script, lessons, quizzes, reader." },
  { id: "resource-learner", name: "Resource Learner", about: "General resources and language lists." },
  { id: "reference-learner", name: "Reference Learner", about: "Quick lookup for language facts." },
  { id: "translation-learner", name: "Translation Learner", about: "Squirrelator-style translation practice." },
  { id: "programming-learner", name: "Programming Learner", about: "Syntax, concepts, practice." },
  { id: "language-learner", name: "Language Learner", about: "Language overview." },
  { id: "grammar-learner", name: "Grammar Learner", about: "Grammar notes." },
  { id: "vocabulary-learner", name: "Vocabulary Learner", about: "Vocabulary." },
  { id: "character-learner", name: "Character Learner", about: "Scripts: hiragana, katakana, kanji, arabic, hangul, and more." }
];
var SCOPED = ["character-learner", "programming-learner", "resource-learner", "translation-learner", "reference-learner"];
var selected = null;
var box = document.getElementById("tools");
var status = document.getElementById("status");

TOOLS.forEach(function (tool) {
  var b = document.createElement("button");
  b.type = "button";
  b.className = "tool";
  b.innerHTML = "<strong>" + tool.name + "</strong><span>" + tool.about + "</span>";
  b.addEventListener("click", function () {
    document.querySelectorAll(".tool").forEach(function (n) { n.classList.remove("sel"); });
    b.classList.add("sel");
    selected = tool;
    status.textContent = "Selected " + tool.name + ".";
  });
  b.addEventListener("dblclick", openTool);
  box.appendChild(b);
});

function openTool() {
  if (!selected) {
    status.textContent = "Select a tool first.";
    return;
  }
  var url = BASE + selected.id + "/index.html";
  var lang = document.getElementById("lang").value;
  if (lang && SCOPED.indexOf(selected.id) >= 0) url += "?lang=" + encodeURIComponent(lang);
  status.textContent = "Opened " + selected.name + (lang && SCOPED.indexOf(selected.id) >= 0 ? " (lang=" + lang + ")" : "") + ".";
  window.open(url, "_blank");
}

document.getElementById("open").addEventListener("click", openTool);
status.textContent = "Found " + TOOLS.length + " tool(s). Select one, then Open.";
</script>
</body>
</html>
