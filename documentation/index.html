---
layout: null
---
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documentation</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f4f1ea; color: #1a1a1a; font: 15px/1.5 Georgia, serif; }
    #app { display: flex; height: 100%; }
    #tree { width: 240px; min-width: 180px; overflow: auto; border-right: 2px solid #808080; background: #fff; padding: 10px; box-sizing: border-box; font: 13px/1.4 Tahoma, sans-serif; }
    #view { flex: 1; overflow: auto; padding: 20px 28px; background: #fff; }
    h1 { font: 18px/1.3 Tahoma, sans-serif; margin: 0 0 8px; }
    .build { float: right; color: #888; font: 11px/1.2 Tahoma, sans-serif; letter-spacing: 0.1em; }
    .back { margin: 0 0 10px; }
    .back a { color: #000080; font-size: 12px; text-decoration: none; }
    .back a:hover { text-decoration: underline; }
    button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 3px 4px; cursor: pointer; font: inherit; }
    button:hover, button.on { background: #000080; color: #fff; }
    .sec { font-weight: bold; margin: 10px 0 2px; color: #333; }
    .md h1 { font: 22px/1.3 Georgia, serif; margin: 0 0 14px; }
    .md h2 { font: 18px/1.3 Georgia, serif; margin: 20px 0 8px; }
    .md p { margin: 0 0 12px; }
    .md code { background: #f0eee8; padding: 1px 4px; font: 13px Consolas, monospace; }
    .md pre { white-space: pre-wrap; font: 13px/1.4 Consolas, monospace; background: #f8f6f2; padding: 12px; }
    .md table { border-collapse: collapse; margin: 8px 0 16px; font: 13px Tahoma, sans-serif; }
    .md th, .md td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; }
    .bar { display: flex; gap: 8px; align-items: center; margin: 0 0 14px; font: 13px Tahoma, sans-serif; }
    .bar button { width: auto; padding: 4px 12px; border: 1px solid #000080; background: #000080; color: #fff; }
    .bar button:disabled { opacity: 0.4; }
    .note { color: #555; font: 13px Tahoma, sans-serif; }
    iframe { border: 0; width: 100%; height: calc(100vh - 80px); }
  </style>
</head>
<body>
<div id="app">
  <div id="tree">
    <p class="back"><a href="../">Back to the desktop</a></p>
    <h1>Documentation <span class="build">15.005</span></h1>
    <div class="sec">Books</div>
    <button type="button" onclick="openBook('gserver', 0)">GServerStory</button>
    <button type="button" onclick="openBook('glstory', 0)">GraalLStory</button>
    <button type="button" onclick="openBook('glstory2', 0)">GraalLStory 2</button>
    <div class="sec">Notes</div>
    <button type="button" onclick="openSet('ash')">39ster Ash / Phoenix</button>
    <button type="button" onclick="openSet('npc')">Classic NPC Ash</button>
    <button type="button" onclick="openSet('ember')">Ember</button>
    <button type="button" onclick="openSet('linux')">LinuxMan2 / Seihai</button>
  </div>
  <div id="view">
    <h1>Documentation <span class="build">15.005</span></h1>
    <p class="note">Pick a book or a notes set on the left.</p>
  </div>
</div>
<script>
var B = "15.005";

function range(a, b) {
  var o = [];
  for (var i = a; i <= b; i++) o.push(i);
  return o;
}
function pad(n) { return (n < 10 ? "0" : "") + n; }
function ch(n) { return "chapter-" + pad(n) + ".md"; }

var BOOKS = {
  gserver: {
    title: "GServerStory",
    base: "Graal/graal-gservers/gserverstory/",
    chapters: ["00-series.md"].concat(range(1, 39).map(ch)).concat(["command-index.md"]),
    labels: ["Series"].concat(range(1, 39).map(function (n) { return "Chapter " + n; })).concat(["Command index"])
  },
  glstory: {
    title: "GraalLStory",
    base: "Graal/graal-linuxman2-seihai/graallstory/",
    chapters: ["README.md", "chapter-01-the-first-line.md"],
    labels: ["Readme", "Chapter 1"]
  },
  glstory2: {
    title: "GraalLStory 2",
    base: "Graal/graallstory2/",
    chapters: ["README.md", "compilers-note.md"].concat(range(1, 18).map(function (n) { return "chapter-" + pad(n) + ".md"; })),
    labels: ["Readme", "Compiler's note"].concat(range(1, 18).map(function (n) { return "Chapter " + n; }))
  }
};

var SETS = {
  ash: {
    title: "39ster Ash / Phoenix",
    files: [
      ["Graal/39ster-ash-phoenix/INDEX.md", "Index"],
      ["Graal/39ster-ash-phoenix/README.md", "Readme"],
      ["Graal/39ster-ash-phoenix/ARCHITECTURE.md", "Architecture"],
      ["Graal/39ster-ash-phoenix/PHOENIX-ARCHITECTURE.md", "Phoenix architecture"],
      ["Graal/39ster-ash-phoenix/diagrams.html", "Diagrams"]
    ]
  },
  npc: {
    title: "Classic NPC Ash",
    files: [
      ["Graal/graal-classic-npc-ash/INDEX.md", "Index"],
      ["Graal/graal-classic-npc-ash/README.md", "Readme"],
      ["Graal/graal-classic-npc-ash/PACKAGE-README.md", "Package"],
      ["Graal/graal-classic-npc-ash/00-runtime/architecture.md", "Runtime - architecture"],
      ["Graal/graal-classic-npc-ash/00-runtime/event-model.md", "Runtime - events"],
      ["Graal/graal-classic-npc-ash/00-runtime/state-and-ids.md", "Runtime - state and IDs"],
      ["Graal/graal-classic-npc-ash/00-runtime/algorithm-index.md", "Runtime - algorithms"],
      ["Graal/graal-classic-npc-ash/01-larency/architecture.md", "Larency"],
      ["Graal/graal-classic-npc-ash/02-phoenix/architecture.md", "Phoenix"],
      ["Graal/graal-classic-npc-ash/03-meh/architecture.md", "Meh"],
      ["Graal/graal-classic-npc-ash/04-unp/architecture.md", "Unp"],
      ["Graal/graal-classic-npc-ash/05-standalone/architecture.md", "Standalone"]
    ]
  },
  ember: {
    title: "Ember",
    files: [
      ["Graal/graal-gservers/README.md", "GServers readme"],
      ["Graal/graal-gservers/ember/00-index.md", "Index"],
      ["Graal/graal-gservers/ember/01-lineage.md", "Lineage"],
      ["Graal/graal-gservers/ember/02-architecture.md", "Architecture"],
      ["Graal/graal-gservers/ember/03-protocol.md", "Protocol"],
      ["Graal/graal-gservers/ember/04-algorithms.md", "Algorithms"],
      ["Graal/graal-gservers/ember/05-blueprints.md", "Blueprints"],
      ["Graal/graal-gservers/ember/ATLAS.html", "Atlas"]
    ]
  },
  linux: {
    title: "LinuxMan2 / Seihai",
    files: [
      ["Graal/graal-linuxman2-seihai/README.md", "Readme"],
      ["Graal/graal-linuxman2-seihai/LinuxMan2-README.md", "LinuxMan2"],
      ["Graal/graal-linuxman2-seihai/Seihai-README.md", "Seihai"],
      ["Graal/graal-linuxman2-seihai/GraalEditor-README.md", "GraalEditor"],
      ["Graal/graal-linuxman2-seihai/GraalShop-README.md", "GraalShop"],
      ["Graal/graal-linuxman2-seihai/GraalShop/Documentation/architecture.md", "GraalShop - architecture"],
      ["Graal/graal-linuxman2-seihai/GraalShop/Documentation/domain.md", "GraalShop - domain"],
      ["Graal/graal-linuxman2-seihai/GraalShop/Documentation/sprites.md", "GraalShop - sprites"],
      ["Graal/graal-linuxman2-seihai/GraalShop/Documentation/animation.md", "GraalShop - animation"]
    ]
  }
};

var view = document.getElementById("view");

function openBook(id, idx) {
  var book = BOOKS[id];
  var path = book.base + book.chapters[idx];
  var label = book.labels[idx];
  view.innerHTML = "<h1>" + book.title + " <span class=\"build\">" + B + "</span></h1><p class=\"note\">Loading...</p>";
  fetch(path).then(function (res) {
    if (!res.ok) throw new Error(res.status);
    return res.text();
  }).then(function (text) {
    var prev = idx > 0 ? "<button type=\"button\" onclick=\"openBook('" + id + "', " + (idx - 1) + ")\">Prev</button>" : "<button type=\"button\" disabled>Prev</button>";
    var next = idx < book.chapters.length - 1 ? "<button type=\"button\" onclick=\"openBook('" + id + "', " + (idx + 1) + ")\">Next</button>" : "<button type=\"button\" disabled>Next</button>";
    var sel = "<select onchange=\"openBook('" + id + "', Number(this.value))\">";
    book.labels.forEach(function (lab, i) {
      sel += "<option value=\"" + i + "\"" + (i === idx ? " selected" : "") + ">" + lab + "</option>";
    });
    sel += "</select>";
    view.innerHTML = "<h1>" + book.title + " <span class=\"build\">" + B + "</span></h1>" +
      "<div class=\"bar\">" + prev + sel + next + "</div>" +
      "<div class=\"md\">" + md(text) + "</div>";
  }).catch(function (err) {
    view.innerHTML = "<h1>" + label + "</h1><p class=\"note\">Could not open " + path + ". " + err.message + "</p>";
  });
}

function openSet(id) {
  var set = SETS[id];
  var html = "<h1>" + set.title + " <span class=\"build\">" + B + "</span></h1>";
  set.files.forEach(function (pair) {
    html += "<button type=\"button\" onclick=\"openFile('" + pair[0] + "', '" + pair[1].replace(/'/g, "") + "')\">" + pair[1] + "</button>";
  });
  view.innerHTML = html;
}

function openFile(path, label) {
  view.innerHTML = "<h1>" + label + " <span class=\"build\">" + B + "</span></h1><p class=\"note\">Loading...</p>";
  fetch(path).then(function (res) {
    if (!res.ok) throw new Error(res.status);
    return res.text();
  }).then(function (text) {
    if (path.endsWith(".html")) {
      view.innerHTML = "<h1>" + label + " <span class=\"build\">" + B + "</span></h1><iframe src=\"" + path + "\"></iframe>";
      return;
    }
    view.innerHTML = "<h1>" + label + " <span class=\"build\">" + B + "</span></h1><div class=\"md\">" + md(text) + "</div>";
  }).catch(function (err) {
    view.innerHTML = "<h1>" + label + "</h1><p class=\"note\">Could not open " + path + ". " + err.message + "</p>";
  });
}

function md(src) {
  var out = src.split("&").join("&").split("<").join("<").split(">").join(">");
  var lines = out.split("\n");
  var html = [];
  var para = [];
  function flush() {
    if (para.length) {
      html.push("<p>" + para.join(" ") + "</p>");
      para = [];
    }
  }
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (line.indexOf("### ") === 0) { flush(); html.push("<h3>" + line.slice(4) + "</h3>"); continue; }
    if (line.indexOf("## ") === 0) { flush(); html.push("<h2>" + line.slice(3) + "</h2>"); continue; }
    if (line.indexOf("# ") === 0) { flush(); html.push("<h1>" + line.slice(2) + "</h1>"); continue; }
    if (line.trim() === "") { flush(); continue; }
    line = line.replace(/`([^`]+)`/g, "<code>$1</code>");
    line = line.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    para.push(line);
  }
  flush();
  return html.join("");
}
</script>
</body>
</html>
