---
layout: null
---
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documentation</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f4f1ea; color: #1a1a1a; font: 14px/1.45 Tahoma, Arial, sans-serif; }
    #app { display: flex; height: 100%; }
    #tree { width: 260px; min-width: 180px; overflow: auto; border-right: 2px solid #808080; background: #fff; padding: 8px; box-sizing: border-box; }
    #view { flex: 1; overflow: auto; padding: 16px 20px; background: #fff; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    .build { float: right; color: #666; font: 11px/1.2 Tahoma, sans-serif; letter-spacing: 0.12em; }
    .back { margin: 0 0 8px; }
    .back a { color: #000080; font-size: 13px; text-decoration: none; }
    .back a:hover { text-decoration: underline; }
    button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 4px; cursor: pointer; font: inherit; }
    button:hover, button.on { background: #000080; color: #fff; }
    .folder { font-weight: bold; }
    .sub { padding-left: 12px; }
    .md h1 { font-size: 20px; margin: 0 0 12px; }
    .md h2 { font-size: 16px; margin: 18px 0 8px; }
    .md p { margin: 0 0 10px; }
    .md code { background: #f0eee8; padding: 1px 4px; }
    .note { color: #555; font-size: 12px; margin: 4px 0 12px; }
    iframe { border: 0; width: 100%; height: 100%; min-height: 480px; }
  </style>
</head>
<body>
<div id="app">
  <div id="tree">
    <p class="back"><a href="../">Back to the desktop</a></p>
    <h1>Documentation <span class="build">15.002</span></h1>
    <button class="folder" data-folder="Graal">Graal</button>
    <div id="graal-sets" class="sub" hidden>
      <button data-set="ash">39ster Ash / Phoenix</button>
      <button data-set="npc">Classic NPC Ash</button>
      <button data-set="gservers">GServers</button>
      <button data-set="linux">LinuxMan2 / Seihai</button>
    </div>
  </div>
  <div id="view">
    <h1>Documentation <span class="build">15.002</span></h1>
    <p class="note">Pick Graal, then a set, then a file.</p>
  </div>
</div>
<script>
"use strict";

var SETS = {
  ash: {
    title: "39ster Ash / Phoenix",
    path: "Graal/39ster-ash-phoenix/",
    files: [
      ["INDEX.md", "Index"],
      ["README.md", "Readme"],
      ["ARCHITECTURE.md", "Architecture"],
      ["PHOENIX-ARCHITECTURE.md", "Phoenix architecture"],
      ["diagrams.html", "Diagrams"]
    ]
  },
  npc: {
    title: "Classic NPC Ash",
    path: "Graal/graal-classic-npc-ash/",
    files: [
      ["INDEX.md", "Index"],
      ["README.md", "Readme"],
      ["PACKAGE-README.md", "Package"],
      ["00-runtime/architecture.md", "Runtime - architecture"],
      ["00-runtime/event-model.md", "Runtime - events"],
      ["00-runtime/state-and-ids.md", "Runtime - state and IDs"],
      ["00-runtime/algorithm-index.md", "Runtime - algorithms"],
      ["01-larency/architecture.md", "Larency"],
      ["02-phoenix/architecture.md", "Phoenix"],
      ["03-meh/architecture.md", "Meh"],
      ["04-unp/architecture.md", "Unp"],
      ["05-standalone/architecture.md", "Standalone"]
    ]
  },
  gservers: {
    title: "GServers",
    path: "Graal/graal-gservers/",
    files: [
      ["README.md", "Readme"],
      ["ember/00-index.md", "Ember - index"],
      ["ember/01-lineage.md", "Ember - lineage"],
      ["ember/02-architecture.md", "Ember - architecture"],
      ["ember/03-protocol.md", "Ember - protocol"],
      ["ember/04-algorithms.md", "Ember - algorithms"],
      ["ember/05-blueprints.md", "Ember - blueprints"],
      ["ember/ATLAS.html", "Ember - atlas"],
      ["gserverstory/00-series.md", "Story - series"],
      ["gserverstory/chapter-01.md", "Story - chapter 1"],
      ["gserverstory/chapter-02.md", "Story - chapter 2"],
      ["gserverstory/chapter-03.md", "Story - chapter 3"],
      ["gserverstory/command-index.md", "Story - command index"]
    ]
  },
  linux: {
    title: "LinuxMan2 / Seihai",
    path: "Graal/graal-linuxman2-seihai/",
    files: [
      ["README.md", "Readme"],
      ["LinuxMan2-README.md", "LinuxMan2"],
      ["GraalEditor-README.md", "GraalEditor"],
      ["GraalShop-README.md", "GraalShop"],
      ["GraalShop/Documentation/architecture.md", "GraalShop - architecture"],
      ["GraalShop/Documentation/domain.md", "GraalShop - domain"],
      ["GraalShop/Documentation/sprites.md", "GraalShop - sprites"],
      ["GraalShop/Documentation/animation.md", "GraalShop - animation"]
    ]
  }
};

var view = document.getElementById("view");

document.querySelector("[data-folder]").addEventListener("click", function () {
  var box = document.getElementById("graal-sets");
  box.hidden = !box.hidden;
  view.innerHTML = "<h1>Graal <span class=\"build\">15.002</span></h1><p class=\"note\">Pick a set.</p>";
});

document.querySelectorAll("[data-set]").forEach(function (btn) {
  btn.addEventListener("click", function () {
    var set = SETS[btn.getAttribute("data-set")];
    var html = "<h1>" + set.title + " <span class=\"build\">15.002</span></h1>";
    set.files.forEach(function (pair) {
      html += "<button data-file=\"" + set.path + pair[0] + "\" data-label=\"" + pair[1] + "\">" + pair[1] + "</button>";
    });
    view.innerHTML = html;
    view.querySelectorAll("[data-file]").forEach(function (b) {
      b.addEventListener("click", function () {
        openFile(b.getAttribute("data-file"), b.getAttribute("data-label"));
      });
    });
  });
});

function openFile(path, label) {
  view.innerHTML = "<h1>" + label + " <span class=\"build\">15.002</span></h1><p class=\"note\">Loading...</p>";
  fetch(path).then(function (res) {
    if (!res.ok) throw new Error(res.status);
    return res.text();
  }).then(function (text) {
    if (path.endsWith(".html")) {
      view.innerHTML = "<h1>" + label + " <span class=\"build\">15.002</span></h1><iframe src=\"" + path + "\"></iframe>";
      return;
    }
    view.innerHTML = "<h1>" + label + " <span class=\"build\">15.002</span></h1><div class=\"md\">" + md(text) + "</div>";
  }).catch(function (err) {
    view.innerHTML = "<h1>" + label + "</h1><p class=\"note\">Could not open " + path + ". " + err.message + "</p>";
  });
}

function md(src) {
  var out = src.replace(/&/g, "&").replace(/</g, "<").replace(/>/g, ">");
  out = out.replace(/^### (.*)$/gm, "<h3>$1</h3>");
  out = out.replace(/^## (.*)$/gm, "<h2>$1</h2>");
  out = out.replace(/^# (.*)$/gm, "<h1>$1</h1>");
  out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
  out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  out = out.replace(/\n\n/g, "</p><p>");
  out = "<p>" + out + "</p>";
  out = out.replace(/<p>(<h[123]>)/g, "$1").replace(/(<\/h[123]>)</p>/g, "$1");
  return out;
}
</script>
</body>
</html>
