<script>
const book = {"title": "93958105", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: WAVEGUIDE THEORYdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe a waveguide and explain the advantages and disadvantages of waveguides over other means of transferring RF energy. w Explain how waveguides are developed from parallel to wire transmission lines. w Describe waveguide plumbing.uide plumbing...."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about the component that is a microwave conductor."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Conventional methods of transferring RF energy from one point to another produce losses that make them impractical at microwave frequencies."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Waveguides must be used to efficiently transfer microwave RF energy."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["This lesson gives you the basic theory of waveguide operation."], "jumps": ["P450", "P420"]}, {"id": "P450", "text": ["Let's begin the lesson on WAVEGUIDE THEORY................................"], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["A waveguide is defined as a system of material boundaries, capable of guiding electromagnetic energy."], "jumps": ["P1030", "P1001"]}, {"id": "P1025", "text": ["ELECTROMAGNETIC ENERGY - Electromagnetic energy is the energy associated with electric or magnetic fields. Common examples include radio or television transmissions, which consist of periodic fluctuations, or waves, in electromagnetic fields..."], "jumps": []}, {"id": "P1030", "text": ["Electromagnetic energy is the field that is produced by current flowing through a conductor."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["In other words, a waveguide is a hollow metal tube or pipe used as a transmission line for electromagnetic fields."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["Waveguides are manufactured from conductive materials and may be rectangular, circular or elliptical in shape."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["In this course, you will learn about and use the rectangular waveguide."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["eguides are the most efonly type of transmission devices that may be used to transfer microwave RF energy from one point to another.", "Due to the high frequency of microwaves, waveguides are the most effective, and therefore the preferred medium used to transfer microwave RF energy from one point to another."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["The two-wire transmission line used for lower frequencies has a high electromagnetic energy loss at microwave frequencies.  As frequencies increase, the expanding and collapsing magnetic fields cannot fully return to the conductor, which causes the radiation loss.", "The two-wire transmission line used for lower frequencies has a high electromagnetic energy loss at microwave frequencies. As frequencies increase, the expanding and collapsing magnetic fields cannot fully return to the conductor, which causes the radiation loss.", "End view of two-wire transmission linee"], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["The electromagnetic field is not confined.  It radiates in all directions which decreases the power available at the antenna.", "The electromagnetic field is not confined. It radiates in all directions which decreases the power available at the antenna."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["The coaxial cable has one conductor in the center of the second conductor.  This confines the electromagnetic energy between the conductors making coaxial cables more efficient.", "The coaxial cable has one conductor in the center of the second conductor. This confines the electromagnetic energy between the conductors making coaxial cables more efficient."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["However, other losses affect coaxial cables at microwave frequencies.  These losses also affect two-wire transmission lines.", "However, other losses affect coaxial cables at microwave frequencies. These losses also affect two-wire transmission lines."], "jumps": ["P1120", "P1080"]}, {"id": "P1120", "text": ["Copper losses depend on the conducting area of the transmission line.  The more area, the less loss.", "Copper losses depend on the conducting area of the transmission line. The more area, the less loss."], "jumps": ["P1130", "P1080"]}, {"id": "P1130", "text": ["At microwave frequencies, the current tends to flow only on the outer surfaces of the conductor, reducing the area of the conductor."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["Waveguides have a much larger surface area than two wire lines and coaxial cables, therefore, less copper losses."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["Dielectric losses are due to the heating of the insulator between the conductors."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["The higher the frequency, the more heating and the more losses."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["Waveguides do not have a center conductor.  This results in less dielectric loss.", "Waveguides do not have a center conductor. This results in less dielectric loss...ses."], "jumps": ["P1180", "P1150"]}, {"id": "P1180", "text": ["Also, the power handling capability of a waveguide is greater than that of a two-wire line or coaxial cable.", "Also, the power handling capability of a waveguide is greater than that of a two-wire line or coaxial cable.."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["The power handling capabilities of a transmission medium are directly related to the distance between the conductors. In a coaxial cable, the distance is slightly less than half the diameter of the cable, while in a waveguide it is equal to the full width of the opening..Power is a function of E2/Zo and E is limited by the distance between conductors."], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["A waveguide with the same dimensions as a coaxial cable can handle more than twice the power."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["In view of the advantages of waveguide transmission lines, it would appear that the waveguide should be the only type of transmission line used."], "jumps": ["P1220", "P1190"]}, {"id": "P1220", "text": ["However, for proper operation of a waveguide, its width must be approximately half a wavelength."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["A waveguide used at 1 MHz would have to be about 490 feet wide. At 200 MHz its width would be 2 1/2 feet and at 10 GHz the width would be less than 1 inch wide.", "Waveguide Width = l/2 (wavelength/2) Wavelength = V/", "(velocity/frequency) Velocity = 186,000 miles/sec or 983,196,000 ft/sec", "(velocity/frequency) Velocity = 186,000 miles/sec or 983,196,000 ft/secccccccccccc,000 miles/sec or 983,196,000 ft/sec", "Velocity = 186,000 miles/sec or 983,196,000 ft/sec cccccccccccccccccccity/frequency) Velocity = 186,000 miles/sec or 983,196,000 ft/sec"], "jumps": ["P1240", "P1210"]}, {"id": "P1240", "text": ["The physical dimensions required of a waveguide make the use of this type of transmission line impractical below approximately 1 GHz."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["Which of the below is not an advantage of a waveguide?", "Which of the below is not an advantage of a waveguide?....."], "jumps": ["P1230"]}, {"id": "P1251", "text": [], "jumps": []}, {"id": "P1252", "text": ["Copper losses are due to the small surface area of the conductor at high frequencies.  Waveguides have large surface areas.", "Copper losses are due to the small surface area of the conductor at high frequencies. Waveguides have large surface areas."], "jumps": []}, {"id": "P1253", "text": ["Dielectric losses are due to heating of the insulator between conductors.  Waveguides do not have a center conductor.", "Dielectric losses are due to heating of the insulator between conductors. Waveguides do not have a center conductor."], "jumps": []}, {"id": "P1260", "text": ["Waveguides allow what type of energy to be transferred from one point to another?"], "jumps": ["P1250"]}, {"id": "P1261", "text": [], "jumps": []}, {"id": "P1262", "text": ["Current does produce electromagnetic fields; however, the waveguide transfers electromagnetic energy or waves."], "jumps": []}, {"id": "P1270", "text": ["The way that a waveguide works can be better understood by comparison with the way that a two wire transmission line works."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["This two-wire transmission line is supported on two insulators (plastic, porcelain or similar material)."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["From the view point of the line, the insulators must present a very high impedance to ground."], "jumps": ["P1300", "P1270"]}, {"id": "P1300", "text": ["Low impedance insulators would ground the signals on the transmission lines."], "jumps": ["P1310", "P1270"]}, {"id": "P1310", "text": ["At microwave frequencies, the transmission line, insulator and ground act as a capacitor with low impedance.  Remember, as frequency increases, Xc decreases.", "At microwave frequencies, the transmission line, insulator and ground act as a capacitor with low impedance. Remember, as frequency increases, Xc decreases."], "jumps": ["P1320", "P1270"]}, {"id": "P1320", "text": ["A better transmission system uses metallic insulators.  A metallic insulator is a pair of sections of conductor that are     / 4 (one quarter wavelength) long, connected directly to the transmission line on one end and shorted to each other on the other end.", "A better transmission system uses metallic insulators. A metallic insulator is a pair of sections of conductor that are / 4 (one quarter wavelength) long, connected directly to the transmission line on one end and shorted to each other on the other end.", "IMPEDANCE OF A SHORTED TRANSMISSION LINE"], "jumps": ["P1330", "P1270", "P1325"]}, {"id": "P1330", "text": ["The impedance of a shorted quarter wave section is very high at the open end junction, points A and B."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["At microwave frequencies, the quarter wave section makes a good insulator.", "At microwave frequencies, the quarter wave section makes a good insulator..as long as the length of the insulator is 1/4 wavelength."], "jumps": ["P1350", "P1320"]}, {"id": "P1350", "text": ["Metallic insulators may be placed anywhere along the two wire line, even on both sides of the same points."], "jumps": ["P1360", "P1320"]}, {"id": "P1360", "text": ["The only disadvantage is that the quarter wave section is only an insulator at one specific frequency.  It also has losses as described before.", "The only disadvantage is that the quarter wave section is only an insulator at one specific frequency. It also has losses as described before."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["This limits the bandwidth, efficiency and application of this type of transmission line."], "jumps": ["P1375", "P1350"]}, {"id": "P1375", "text": ["insulators placed so closely that they are in contact, forming a continuous pi [", "A waveguide is like a two-wire transmission line with metallic insulators placed so closely that they are in contact, forming a continuous piece of metal."], "jumps": ["P1380", "P1350"]}, {"id": "P1380", "text": ["During the change from a two wire line to a waveguide, some of the characteristics of transmission are changed."], "jumps": ["P1385", "P1375"]}, {"id": "P1385", "text": ["The transmission line can pass more than just one frequency, reducing radiation, copper and dielectric losses."], "jumps": ["P1390", "P1375"]}, {"id": "P1390", "text": ["A waveguide has a bandwidth.  Let's see how.", "A waveguide has a bandwidth. Let's see how."], "jumps": ["P1400", "P1375"]}, {"id": "P1400", "text": ["Part of the waveguide width is used as two metallic insulators that are one quarter wavelength."], "jumps": ["P1410", "P1375"]}, {"id": "P1410", "text": ["Between the two metallic insulators is a section called the BUS BAR (similar to a conducting wire)."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["As the frequency increases,    /4 decreases.  Since the waveguide has a fixed width, this effectively means that the bus bar becomes wider.", "As the frequency increases, /4 decreases. Since the waveguide has a fixed width, this effectively means that the bus bar becomes wider."], "jumps": ["P1430", "P1400"]}, {"id": "P1430", "text": ["The higher frequency is passed down the waveguide."], "jumps": ["P1435", "P1400"]}, {"id": "P1435", "text": ["Theoretically, waveguides do not have an upper frequency limit. However, in practice, theoretical maximums cannot be achieved and there is an upper frequency limit.", "Theoretically, waveguides do not have an upper frequency limit. However, in practice, theoretical maximums cannot be achieved and there is an upper frequency limit.."], "jumps": ["P1440", "P1400"]}, {"id": "P1440", "text": ["When the frequency decreases, the metallic insulators become larger.  The bus bar becomes smaller.", "When the frequency decreases, the metallic insulators become larger. The bus bar becomes smaller."], "jumps": ["P1450", "P1400"]}, {"id": "P1450", "text": ["The lower frequency is passed down the waveguide."], "jumps": ["P1455", "P1400"]}, {"id": "P1455", "text": ["Too low a frequency causes the bus bar to vanish and the RF energy is not passed down the waveguide.  This is called the cutoff frequency.", "Too low a frequency causes the bus bar to vanish and the RF energy is not passed down the waveguide. This is called the cutoff frequency."], "jumps": ["P1460", "P1400"]}, {"id": "P1460", "text": ["As you have seen, the width of the waveguide is important.  It determines the range of operating frequencies.", "As you have seen, the width of the waveguide is important. It determines the range of operating frequencies."], "jumps": ["P1470", "P1400"]}, {"id": "P1470", "text": ["The width is called the \"a\" dimension.  This dimension contains the conductors.", "The width is called the \"a\" dimension. This dimension contains the conductors."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["Waveguide 1 has a higher frequency range than waveguide 2. Remember, the higher the frequency, the smaller the wavelength and the \"a\" dimension."], "jumps": ["P1490", "P1460"]}, {"id": "P1490", "text": ["The other dimension determines the power handling capability of the waveguide.  It is called the \"b\" dimension.", "The other dimension determines the power handling capability of the waveguide. It is called the \"b\" dimension."], "jumps": ["P1500", "P1460"]}, {"id": "P1500", "text": ["Recall that the distance between the conductors determines the power handling capability.  The \"b\" dimension is the distance between the conductors (bus bars) that are located in the \"a\" dimension.", "Recall that the distance between the conductors determines the power handling capability. The \"b\" dimension is the distance between the conductors (bus bars) that are located in the \"a\" dimension."], "jumps": ["P1510", "P1460"]}, {"id": "P1510", "text": ["Why are coaxial lines more efficient than two-wire lines?", "Why are coaxial lines more efficient than two-wire lines?.."], "jumps": ["P1460"]}, {"id": "P1511", "text": [], "jumps": []}, {"id": "P1512", "text": ["The main difference between two-wire lines and coaxial lines is that the coaxial line has the second conductor surrounding the first conductor.  This does not reduce copper losses.", "The main difference between two-wire lines and coaxial lines is that the coaxial line has the second conductor surrounding the first conductor. This does not reduce copper losses.."], "jumps": []}, {"id": "P1513", "text": ["The main difference between two-wire lines and coaxial lines is that the coaxial line has the second conductor surrounding the first conductor.  This does not reduce dielectric losses.", "The main difference between two-wire lines and coaxial lines is that the coaxial line has the second conductor surrounding the first conductor. This does not reduce dielectric losses.."], "jumps": []}, {"id": "P1520", "text": ["Which dimension determines the frequency range in waveguides?"], "jumps": ["P1510"]}, {"id": "P1521", "text": [], "jumps": []}, {"id": "P1522", "text": ["The \"b\" dimension determines the power handling capability."], "jumps": []}, {"id": "P1530", "text": ["The physical handling and installation of waveguides have many similarities to ordinary plumbing."], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["Consequently, the bending, twisting, joining and installation of waveguides is commonly called waveguide plumbing."], "jumps": ["P1550", "P1530"]}, {"id": "P1550", "text": ["It is unlikely that a single piece of straight waveguide can be used to connect electronic circuits to the antenna."], "jumps": ["P1560", "P1530"]}, {"id": "P1560", "text": ["Waveguides must be connected together and must go around objects."], "jumps": ["P1570", "P1530"]}, {"id": "P1570", "text": ["Waveguide sections come in a variety of shapes to fit most needs.  Bends, twists and flexible waveguide sections are the most common.", "Waveguide sections come in a variety of shapes to fit most needs. Bends, twists and flexible waveguide sections are the most common."], "jumps": ["P1580", "P1530"]}, {"id": "P1580", "text": ["\"b\" dimension, as long as they are at leas 2", "Bends may be in either the \"a\" dimension or the \"b\" dimension, as long as they are at least 2 in length."], "jumps": ["P1590", "P1530"]}, {"id": "P1590", "text": ["If a sharp bend is required, it should be in two 45 degree bends, one quarter wavelength apart."], "jumps": ["P1600", "P1580"]}, {"id": "P1600", "text": ["d is cancelled out in the second 45 degree bend.", "Reflections caused in the first 45 degree bend are cancelled out by reflections caused in the second. The net effect is the same as if no reflection had occurred at all."], "jumps": ["P1610", "P1590"]}, {"id": "P1610", "text": ["Twists should be at least 2 wavelengths long to prevent reflections.", "Twists should be at least 2 wavelengths long to prevent reflections.."], "jumps": ["P1620", "P1590"]}, {"id": "P1620", "text": ["Flexible waveguides allow special bends which may be required in some cases."], "jumps": ["P1630", "P1610"]}, {"id": "P1630", "text": ["They consist of a wound ribbon of conductive material.  Power losses are high because the inner surfaces are not perfectly smooth.", "They consist of a wound ribbon of conductive material. Power losses are high because the inner surfaces are not perfectly smooth."], "jumps": ["P1640", "P1620"]}, {"id": "P1640", "text": ["These sections of waveguides, along with straight sections, are joined together into one piece."], "jumps": ["P1650", "P1620"]}, {"id": "P1650", "text": ["They may be permanently joined by welding or semi-permanently joined by using nut and bolt sets."], "jumps": ["P1660", "P1640"]}, {"id": "P1660", "text": ["The joining of waveguide sections is important.  Improper joints, or obstructions in the waveguide, cause standing waves.", "The joining of waveguide sections is important. Improper joints, or obstructions in the waveguide, cause standing waves."], "jumps": ["P1670", "P1650"]}, {"id": "P1661", "text": ["The joining of waveguide sections is important. Improper joints, or obstructions in the waveguide, cause standing waves."], "jumps": ["P1670", "P1650"]}, {"id": "P1662", "text": ["STANDING WAVES - Standing waves are produced by impedance mismatches between sections, obstructions in a waveguide, and misaligned waveguide sections."], "jumps": []}, {"id": "P1663", "text": ["Standing waves reduce the output power that is delivered to the antenna and are measured in ratios. VSWR is voltage standing wave ratio, ISWR is current standing wave ratio, SWR is expressed as a ratio of the maximum value of the current or voltage in the standing wave. A ratio of 1 indicates no standing wave.o standing wave.............."], "jumps": []}, {"id": "P1664", "text": ["Standing waves are produced when part of the signal in the waveguide is reflected back to the source."], "jumps": []}, {"id": "P1665", "text": ["The two signals (the incident wave (or original wave) and the reflected wave) combine to produce a wave that does not move, a standing wave.  Standing waves can never be completely eliminated.  However, low standing wave ratios can be achieved.", "The two signals (the incident wave (or original wave) and the reflected wave) combine to produce a wave that does not move, a standing wave. Standing waves can never be completely eliminated. However, low standing wave ratios can be achieved."], "jumps": []}, {"id": "P1670", "text": ["Once waveguides are installed, maintaining them is easy."], "jumps": ["P1680", "P1661"]}, {"id": "P1680", "text": ["Keep the inner surfaces clean and free from nicks, scratches and foreign objects.  Also, keep the inner surfaces dry.  Moisture can cause shorts.", "Keep the inner surfaces clean and free from nicks, scratches and foreign objects. Also, keep the inner surfaces dry. Moisture can cause shorts."], "jumps": ["P1690", "P1661"]}, {"id": "P1690", "text": ["The outer surfaces require even less maintenance.  Just insure that the joints remain tight and that the waveguides are not damaged.", "The outer surfaces require even less maintenance. Just insure that the joints remain tight and that the waveguides are not damaged."], "jumps": ["P1910", "P1661"]}, {"id": "P1910", "text": ["This completes the information on WAVEGUIDE THEORY.", "This completes the information on WAVEGUIDE THEORY........."], "jumps": ["P1650"]}, {"id": "P1920", "text": ["1.  A waveguide is defined as a system of material boundaries,           capable of guiding electromagnetic energy.", "1. A waveguide is defined as a system of material boundaries, capable of guiding electromagnetic energy."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Waveguides are manufactured from conductive materials and        may be rectangular, circular or elliptical in shape.", "2. Waveguides are manufactured from conductive materials and may be rectangular, circular or elliptical in shape."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Waveguides have the least amount of radiation, copper and           dielectric losses which makes them well suited for conducting      microwave frequencies.", "3. Waveguides have the least amount of radiation, copper and dielectric losses which makes them well s let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
