const book = {"title": "93951107", "pages": [{"id": "PQINFO", "text": ["Page # Test# Question# HelpPage # 10210 1 110 1080 10211 1 111 1070 10212 1 112 1270 10213 1 113 1390 10214 1 114 1350 10215 1 115 1050 10216 1 116 1380 10217 1 117 1370 10218 1 118 1400 10219 1 119 1290 10220 2 120 1350 10221 2 121 1530 10222 2 122 1090 10223 2 123 1310 10224 2 124 1500 10225 2 125 30000 10226 2 126 30000 10227 2 127 30000 10228 2 128 30000 10229 2 129 30000 10230 3 130 30000 10231 3 131 30000 10232 3 132 30000 10233 3 133 30000 10234 3 134 30000 10235 3 135 30000 10236 3 136 30000 10237 3 137 30000 10238 3 138 30000 10239 3 139 30000 10240 10241 10242 10243 10244 10245 10246 10247 10248 10249 9", "Page # Test# Question# HelpPage # 10210 1 110 1080 10211 1 111 1070 10212 1 112 1270 10213 1 113 1390 10214 1 114 1350 10215 1 115 1050 10216 1 116 1380 10217 1 117 1370 10218 1 118 1400 10219 1 119 1290 10220 2 120 1350 10221 2 121 1530 10222 2 122 1090 10223 2 123 1310 10224 2 124 1500"], "jumps": []}, {"id": "PINFO", "text": ["10-14-03 Converted from sty to tbk. frieda 10-24-03 Graphics -", "10-14-03 Converted from sty to tbk. frieda 10-24-03 Graphics - James 02-24-04 P1940, removed apostrophe from \"it's\". Changed \"preforming\" to \"performing\". P10210, decapped first letter of each distractor. P10213, Added a comma after \"For large soldering jobs\". -Penny"], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10224", "text": ["can be used for all soldering applications.", "heats by flowing current through the tip.", "is useful for lighting cigarettes and heating coffee."], "jumps": []}, {"id": "P10223", "text": ["Telephone and computer network cable is made using _______"], "jumps": []}, {"id": "P10222", "text": ["Using too small a screwdriver blade can cause _______"], "jumps": []}, {"id": "P10221", "text": ["Which of the following is considered to be maintenance-free?"], "jumps": []}, {"id": "P10220", "text": [], "jumps": []}, {"id": "P10219", "text": [], "jumps": []}, {"id": "P10218", "text": [], "jumps": []}, {"id": "P10217", "text": ["Which of the following can be used as a heat sink when soldering?"], "jumps": []}, {"id": "P10216", "text": [], "jumps": []}, {"id": "P10215", "text": [], "jumps": []}, {"id": "P10214", "text": ["The benefit of the soldering station over the soldering iron is _______"], "jumps": []}, {"id": "P10213", "text": ["For large soldering jobs use the _______", "For large soldering jobs, use the _______"], "jumps": []}, {"id": "P10212", "text": ["Which of the following is NOT a type of plier?"], "jumps": []}, {"id": "P10211", "text": [], "jumps": []}, {"id": "P10210", "text": ["For increased security, some applications use _______", "tamper-proof Torx or Robertson screw heads."], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1940"]}, {"id": "P1940", "text": ["3. Never use a tool for anything other than its intended purpose. Specialized tools should be purchased and used when available if performing repetitive tasks to save time and effort.."], "jumps": ["P1999", "P1930"]}, {"id": "P1930", "text": ["2. Always use the right tool for the job. Never use tools in an unsafe manner."], "jumps": ["P1940", "P1920"]}, {"id": "P1920", "text": ["1. Most electronics related jobs can be done with a few basic hand tools. There are many specialized tools for electronic troubleshooting and maintenance."], "jumps": ["P1930", "P1001"]}, {"id": "P1910", "text": ["You have completed the information on TOOLS FOR ELECTRONIC TROUBLESHOOTING."], "jumps": ["P1001", "P1510"]}, {"id": "P1550", "text": ["While we've covered the most common tools used there are several specialized tools for different applications. As a technician you'll find these tools easy to use. All are based on the principals covered in today's lesson and are variations of common tools..."], "jumps": []}, {"id": "P1540", "text": ["The de-soldering vacuum requires no additional heat except that to melt the solder holding the device. However, it also requires periodical cleaning."], "jumps": []}, {"id": "P1530", "text": ["De-soldering stations are available for extensive de-soldering but most technicians use the de-soldering braid or the de-soldering vacuum. The de-soldering braid can cause more damage to a circuit board as it must be heated in addition to the device being de-soldered. But, the braid is maintenance-free as it is slowly discarded during use......"], "jumps": []}, {"id": "P1520", "text": ["De-soldering tools are very popular today since the circuit board is the accepted low-cost method for producing electronic circuits. Once troubleshot, the defective component must be removed from the circuit board without damaging the components around the defective device or without causing damage to the circuit board....."], "jumps": []}, {"id": "P1510", "text": ["Maintenance of soldering guns is minimal. Low voltage with high current flows through the tip which heats in just a few seconds so that it's hot enough to solder. Due to the electrical connections at the tip, the nuts must be kept tight at all times. Also, prolonged use of the soldering gun on small applications will allow the tip to overheat, ruining the tinning....."], "jumps": []}, {"id": "P1500", "text": ["Soldering guns are used for soldering applications with larger surface areas or greater heat requirements. Most soldering guns have built-in lights to illuminate the area being soldered and dual heat ranges, selectable at the trigger. Pressing the trigger part way provides the lower heat range while fully pulling the trigger gives the higher heat range....."], "jumps": ["P1480"]}, {"id": "P1492", "text": ["Soldering irons' tip temperature is usually not regulated and is dependent upon the supply voltage, ambient temperature, and the size of the solder joint.h devices are rated in WATTS output but most soldering stations include circuitry to keep the tip at a pre-determined temperature. Soldering irons' tip temperature is usually not regulated and is dependent upon the supply voltage, ambient temperature, and the size of the solder joint....."], "jumps": []}, {"id": "P1490", "text": ["Soldering irons perform an effective job for most circuit board repair applications. For heavy use or bench-top work the soldering station is preferred. Both devices are rated in WATTS output but most soldering stations include circuitry to keep the tip at a pre-determined temperature. Soldering irons' tip temperature is usually not regulated and is dependent upon the supply voltage, ambient temperature, and the size of the solder joint....."], "jumps": []}, {"id": "P1480", "text": ["The soldering iron and the soldering station perform equally well and their maintenance is usually the same. Each contains a replaceable soldering tip that must be kept tinned but they must also have a secure mechanical connection to the heating element. Loose connections result in poor heat transfer to the tip causing poor solder joints and rapid tip wear....."], "jumps": []}, {"id": "P1470", "text": ["The final set of tools in today's discussion is those tools dedicated to soldering and de-soldering."], "jumps": ["P1420"]}, {"id": "P1462", "text": ["You have chosen the wrong meaning for the acronym.........."], "jumps": []}, {"id": "P1461", "text": [], "jumps": []}, {"id": "P1460", "text": ["\"ESD\" is an acronym for _______ed.........................."], "jumps": ["P1410"]}, {"id": "P1452", "text": ["The flashlight should have a rubber or plastic outer case, not metal, to help prevent shock hazards and prevent damage in case the flashlight is dropped into the equipment."], "jumps": []}, {"id": "P1451", "text": [], "jumps": []}, {"id": "P1450", "text": ["The technician's flashlight should be _______.............."], "jumps": ["P1400"]}, {"id": "P1440", "text": ["Both the IC inserter and extractor have attachment points for adding ESD cables."], "jumps": []}, {"id": "P1430", "text": ["Equally useful for handling ICs is the IC insertion tool. ICs are supplied from the manufacturer with the pins bent slightly outward to assist in manufacturing. Once inserted onto the circuit board, the outward tension holds the IC in place until the IC is soldered onto the board. The insertion tool securely grips the IC but also applies inward tension on the pins to assist with insertion....."], "jumps": []}, {"id": "P1420", "text": ["The IC extractor is used for removing ICs from circuit cards after de-soldering the IC. ICs are usually difficult to handle with just the bare hand or needle nose pliers due to their size, fragility, and ESD susceptibility..."], "jumps": []}, {"id": "P1410", "text": ["The best way to determine if the device or circuit is susceptible to ESD is to look at its packaging. Components with their leads inserted into black or pink plastic foam, or packaged in pink or black plastic bags, or items with ESD labels should be treated as ESD devices. When in doubt, treat the component as an ESD device....."], "jumps": []}, {"id": "P1400", "text": ["If you'll routinely work with electronics which could be damaged by ESD the minimum you should do to prevent ESD is ensure your workbench is grounded to a good earth ground and wear an anti-static wrist strap attached to the workbench..."], "jumps": []}, {"id": "P1390", "text": ["Many components and circuitry used in electronics are susceptible to electro-static discharge and can be damaged should static electricity be encountered. There are several anti-static devices available to assist with preventing device and circuit damage..."], "jumps": []}, {"id": "P1380", "text": ["Alignment in the RF, IF, and other analog circuits require special tools. Most RF transformers have an iron core and the position of the iron core, or slug, is adjustable. The slug screws in the transformer center, and because the slug is iron, a non-metallic or non-magnetic tool is required to perform the adjustment. Most slugs accept a hex or flat adjustment tool....."], "jumps": []}, {"id": "P1370", "text": ["Other tools handy to use in conjunction with the magnifying glass are the dental probe and hemostats. They are useful when soldering and installing belts, springs, and other mechanical devices. Hemostats are also placed between a component and the lead, used as a heat sink when soldering to protect the component....."], "jumps": []}, {"id": "P1360", "text": ["For workbench use, the clamp-on task light is recommended. Occasionally you'll have the need to look closer at your work, viewing a circuit board or a solder connection. Available as part of the bench light, or hand-held, the magnifying glass is always a part of the technician's toolkit..."], "jumps": []}, {"id": "P1350", "text": ["Lighting can be a problem for the technician also. In field applications the standard flashlight is usually helpful. If used near energized electrical equipment, the flashlight should have a rubber or plastic outer case, not metal, to help prevent shock hazards and prevent damage in case the flashlight is dropped into the equipment....."], "jumps": ["P1300"]}, {"id": "P1342", "text": ["The standard wire crimp tool used for crimping butt splices and wire ends is a relatively inexpensive device that should be included in every tool box. Most wire crimping tools include wire strippers handling wire sizes from 22 to 10 gauge. Most also include serrated pliers and screw cutters."], "jumps": []}, {"id": "P1341", "text": [], "jumps": []}, {"id": "P1340", "text": ["Which of the following is NOT a function of the standard wire crimping tool?", "Crimping connectors on the end of wires."], "jumps": ["P1290"]}, {"id": "P1334", "text": ["If you need to dress coaxial cable, the cable dressing tool is the most used."], "jumps": []}, {"id": "P1333", "text": ["If you rarely need to dress coaxial cable, the razor knife will suffice."], "jumps": []}, {"id": "P1332", "text": ["If you rarely need to dress coaxial cable, the pocket knife will suffice."], "jumps": []}, {"id": "P1331", "text": [], "jumps": []}, {"id": "P1330", "text": ["Which of the following should NOT be used for dressing cable?"], "jumps": ["P1280"]}, {"id": "P1320", "text": ["Another specialized tool available for coaxial cable work is the cable dressing tool. This tool trims the outer insulation, the braid, and the inner insulation all to the proper length every time, making cable assembly much easier. If you rarely need to dress coaxial cable, the pocket knife or the razor knife will also suffice...."], "jumps": ["P1300"]}, {"id": "P1310", "text": ["Depending upon your job or specialty you may also use specialized crimping tools. Crimping tools are available to handle very small gauge connectors, RJ11, RJ13, and RJ45 crimp tools for telephone and computer network cables, coaxial cable F-connector ends, and other applications where a standard crimp tool or pliers will not suffice....."], "jumps": []}, {"id": "P1300", "text": ["Use of the wire crimping tool is relatively simple. The wire is stripped using the proper sized stripper and then the butt slice, ring connector, spade lug, or other wire end is crimped onto the bare wire end..."], "jumps": []}, {"id": "P1290", "text": ["Another form of pliers available is the crimp tool. The standard wire crimp tool used for crimping butt splices and wire ends is a relatively inexpensive device that should be included in every tool box. Most wire crimping tools include wire strippers handling wire sizes from 22 to 10 gauge. Most also include serrated pliers and screw cutters....."], "jumps": ["P1270"]}, {"id": "P1280", "text": ["Available in several sizes, it's recommended both a large and a small pair of diagonal cutters be in your toolbox, tool pouch, or workbench. The small pair allows delicate work while the large pair provides the leverage needed for cutting larger wires and coaxial cables..."], "jumps": ["P1270"]}, {"id": "P1270", "text": ["Diagonal cutters are used for cutting and trimming wires and component leads. They can be used for stripping insulation with practice but you should always use the proper equipment, in this case, a wire stripper, when available. Many diagonal cutters are available with spring-loaded handles for ease of use. lose-up of spring-load in the handles..."], "jumps": []}, {"id": "P1260", "text": ["Like the needle nose pliers, the diagonal cutters will have rubber or plastic coated grips. But, also like needle nose pliers, they should never be used with energized electrical equipment."], "jumps": ["P1250"]}, {"id": "P1252", "text": ["Needle nose pliers are the standard tool used for gripping, bending, and shaping wires and component leads."], "jumps": []}, {"id": "P1251", "text": [], "jumps": []}, {"id": "P1250", "text": ["When should needle nose pliers NOT be used?................", "When working on energized electrical equipment."], "jumps": ["P1240"]}, {"id": "P1240", "text": ["It's recommended a small pair of needle nose pliers and the medium sizes of needle nose pliers be kept in the toolbox or on the workbench. Other versions may be needed for specific applications but most requirements can be satisfied with just these two pair of needle nose pliers..."], "jumps": []}, {"id": "P1232", "text": ["Curved jaws allow work in very confined areas. Many versions of jaws include wire cutting edges, crimping serrations, and wire stripping enhancements. pair allows delicate work while the large pair provides the leverage needed for cutting larger wires and coaxial cables."], "jumps": ["P1270"]}, {"id": "P1230", "text": ["The jaws of the needle nose pliers are available in different sizes and options. Most have serrated jaws to improve the grip but some of the smaller and thinner needle nose pliers are available with non-serrated jaws to prevent damage to delicate wire and insulation. rved jaws allow work in very confined areas. Many versions of jaws include wire cutting edges, crimping serrations, and wire stripping enhancements....."], "jumps": []}, {"id": "P1220", "text": ["Practically all needle nose pliers have rubber or plastic coated grips to improve handling of the tool and soften the grip. The grip may also reduce shock hazards. However, it's not recommended they be used with energized electrical equipment. Many needle nose pliers have spring-loaded handles that keep a mild \"hold open\" force on the jaws......."], "jumps": []}, {"id": "P1210", "text": ["The two most popular types of pliers used by technicians are the common needle nose pliers and the diagonal cutter. Needle nose pliers are the standard tool used for gripping, bending, and shaping wires and component leads.."], "jumps": ["P1190"]}, {"id": "P1200", "text": ["Available in open-end, box-end, and combination configurations, wrenches vary is size from 13/64\", or 4mm, up to several inches and centimeters in size. As an electronic technician you'll rarely use wrenches except in specialized job fields.."], "jumps": ["P1190"]}, {"id": "P1190", "text": ["Some times a nut driver cannot handle the job due to the location of the nut, screw, or bolt, or the torque requirements of the job. In those instances, wrenches are the best solution. When working with cables, doing outside installations, and field work, wrenches provide additional torque capabilities as needed..."], "jumps": []}, {"id": "P1180", "text": ["A variation of the screwdriver is the nut driver, a hollow-shafted tool with the ability to drive nuts and bolt heads. Available in standard and metric sizes, they are handy when working on electronic equipment. The most popular sizes used in electronic equipment are listed below:::"], "jumps": ["P1170"]}, {"id": "P1172", "text": ["The Torx, and the Robertson type screws are just one of the latest versions of screw heads invented for improved security."], "jumps": []}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1170", "text": ["What is the purpose of the tamper-proof Torx and the Robertson type screws?", "To keep unauthorized hands out of the equipment."], "jumps": ["P1160"]}, {"id": "P1162", "text": ["Screwdrivers should only be used for driving screws. They should never be used for prying or treated as a chisel."], "jumps": []}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1160", "text": ["When should a screwdriver be used for prying?.............."], "jumps": ["P1150"]}, {"id": "P1150", "text": ["Screwdrivers should only be used for driving screws. They should never be used for prying or treated as a chisel."], "jumps": []}, {"id": "P1140", "text": ["For tight locations a short screwdriver or an offset screwdriver may be required."], "jumps": []}, {"id": "P1130", "text": ["The shaft of the screwdriver is usually a proportional length to the screwdriver head and handle although long-shafted screwdrivers are available for special applications and hard-to-reach locations..."], "jumps": []}, {"id": "P1120", "text": ["Rarely made of wood, most handles are now made of molded plastic, a non-conductor of electricity. Some manufacturers of screwdrivers further enhance the dielectric functionality by adding a rubber sheath over the handle..."], "jumps": []}, {"id": "P1100", "text": ["The handle of the screwdriver usually varies in size depending upon the amount of torque required by the size of the screwdriver blade. Smaller screw heads require less torque and the screwdriver blade and handle are usually smaller..."], "jumps": []}, {"id": "P1090", "text": ["Regardless of the type of screwdriver required, always choose the right size of screwdriver to prevent damage to the screw and the screwdriver, and the surrounding area and user should the screwdriver slip out of the slot on the screw head..."], "jumps": []}, {"id": "P1080", "text": ["Other screw heads you may encounter include the Robertson, or square head, the Hex, or Allen, head, the patented Pozidriv, a slip-proof improvement to the Phillips head, the Torx, and the tamper-proof Torx are just one of the latest versions of screw heads invented for improved security..."], "jumps": []}, {"id": "P1070", "text": ["In the 1930's a new type of screw was developed for automated use in car manufacturing. This new screw, called the Phillips screw, was designed so that the bit would jump out of the slots should too much torque be applied by the automated equipment once the screw bottomed out..."], "jumps": []}, {"id": "P1060", "text": ["Metal screws appeared in the 15th century but the slotted or flat-headed screw and screwdriver did not appear until the late 17th century."], "jumps": []}, {"id": "P1050", "text": ["Going back in history to the 5th century BC, the screw has been used in several applications throughout history. Early screws were made of wood and used in leverage-type devices such as wine presses, olive presses, and printing presses. They were not used as fastening devices..."], "jumps": []}, {"id": "P1040", "text": ["The first tool to discuss is probably the tool you'll use the most, the screwdriver."], "jumps": []}, {"id": "P1030", "text": ["Man's technology has progressed over the years and his hand tools have become much more versatile and specialized. With this lesson we'll discuss most of the hand tools you'll use in electronic troubleshooting, repair, and maintenance.e.", "Hand tools go back to the Stone Age where it was discovered a club or a rock could be used to enhance the human muscles to help perform specific tasks."], "jumps": ["P1030", "P1001"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": ["P430"]}, {"id": "P410", "text": ["Let's begin the lesson on TOOLS FOR ELECTRONIC TROUBLESHOOTING.............."], "jumps": ["P400"]}, {"id": "P400", "text": ["This lesson covers the use, care, and safe operation of the basic hand tools used by technicians for troubleshooting and repairs."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P100", "text": ["1. Tools For Electronic Troubleshooting1 line item 2 here. item 2 here.e.e.", "w Identify the basic hand tools used for troubleshooting and repair. w Describe the types of tasks performed with each tool. w Describe the safe and proper use of hand tools."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: TOOLS FOR ELECTRONIC TROUBLESHOOTINGdf asdf sadf"], "jumps": []}, {"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ..........", "Nida Corporation - Tools for Electronic Troubleshooting", "\"You have successfully passed the assessment", "Are you sure you want to Bookmark the Lesson?", "Are you sure you want to Exit the Lesson?", "You skipped X question(s). Do you want to _________", "The test is complete and your score is XX%. Do you want to _________", "You have successfully passed the assessment test!", "N Z NNN NN N N N NNZNNNNNNNNNa", "l N ZZZZ ZZZZ NZZNNNNNNNNNNNNaa", "NfZfZZZZZZZZZZZZZ NZfZZZZ ZfZZZfNNNNNNNaa", "NNNaNNNJaNNNNffffffffffNNNNNNNNNNNNNNN NNNa"], "jumps": ["Pyn", "PPfP", "PPE", "PP", "P", "P1", "P3", "PB", "PN", "P5"]}]};
let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
