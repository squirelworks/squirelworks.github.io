erator card provides the four analog                    information signals that are multiplexed in the FDM                            transmitter.", "4. Insert PC130-322 into the PC1 connectors on the test console. The quad tone generator card provides the four analog information signals that are multiplexed in the FDM transmitter."], "jumps": ["P1230"]}, {"id": "P1260", "text": ["5.  On PC130-322, set all controls to mid position.", "5. On PC130-322, set all controls to mid position.PC1 DC switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON.........................................", "MEASUREMENT SETUP - Set all controls to mid position."], "jumps": ["P1250", "P1265"]}, {"id": "P1270", "text": ["6.  Insert PC130-324 into the PC2 connectors on the test console.", "6. Insert PC130-324 into the PC2 connectors on the test console."], "jumps": ["P1282", "P1280", "P1260"]}, {"id": "P1280", "text": ["7.  On PC130-324, set all variable resistors to mid position.  DO           NOT adjust C21.", "7. On PC130-324, set all variable resistors to mid position. DO NOT adjust C21."], "jumps": ["P1290", "P1270", "P1265"]}, {"id": "P1282", "text": ["7. On PC130-324, set all variable resistors to mid position. DO NOT adjust C20.", "MEASUREMENT SETUP - Set all variable resistors to mid position. Do not adjust C21.", "MEASUREMENT SETUP - Set all variable resistors to mid position. Do not adjust C20."], "jumps": ["P1290", "P1270", "P1286", "P"]}, {"id": "P1290", "text": ["8.  Set PC1 DC Power switch to ON.  You will first set up the quad       tone generator card, the information sources.", "8. Set PC1 DC Power switch to ON. You will first set up the quad tone generator card, the information sources."], "jumps": ["P1282", "P1280"]}, {"id": "P1300", "text": ["1.  Using the oscilloscope, measure the 500 Hz TP on PC130-322       and adjust the controls as follows:", "1. Using the oscilloscope, measure the 500 Hz TP on PC130-322 and adjust the controls as follows:", "a. Adjust DIST for a sine wave output at 2 Vpp. b. Adjust GAIN for a 0.5 Vpp signal.", "MEASUREMENT SETUP - Measure the 500 Hz TP and adjust the Dist. for a 2 Vpp sine wave output and the Gain for 0.5 Vpp"], "jumps": ["P1310", "P1290", "P1305"]}, {"id": "P1310", "text": ["2.  Using the oscilloscope, measure the 1000 Hz TP on\n     PC130-322 and adjust the controls as follows:", "2. Using the oscilloscope, measure the 1000 Hz TP on PC130-322 and adjust the controls as follows:", "a. Adjust DIST for a sine wave output at 2 Vpp. b. Adjust GAIN for a 0.5 Vpp signal.", "MEASUREMENT SETUP - Measure the 1000Hz TP and adjust the Dist. for a 2 Vpp sine wave output and the Gain for 0.5 Vpp signal."], "jumps": ["P1320", "P1300", "P1315"]}, {"id": "P1320", "text": ["3.  Using the oscilloscope, measure the 1500 Hz TP on\n     PC130-322 and adjust the controls as follows:", "3. Using the oscilloscope, measure the 1500 Hz TP on PC130-322 and adjust the controls as follows:", "a. Adjust DIST for a sine wave output at 2 Vpp. b. Adjust GAIN for a 0.5 Vpp signal.", "MEASUREMENT SETUP - Measure the 1500Hz TP and adjust the Dist. for a 2 Vpp sine wave output and the Gain for 0.5 Vpp signal."], "jumps": ["P1330", "P1310", "P1325"]}, {"id": "P1330", "text": ["4.  Using the oscilloscope, measure the 2000 Hz TP on\n     PC130-322 and adjust the controls as follows:", "4. Using the oscilloscope, measure the 2000 Hz TP on PC130-322 and adjust the controls as follows:", "a. Adjust DIST for a sine wave output at 2 Vpp. b. Adjust GAIN for a 0.5 Vpp signal.", "MEASUREMENT SETUP - Measure the 2000Hz TP and adjust the Dist. for a 2 Vpp sine wave output and the Gain for 0.5 Vpp signal."], "jumps": ["P1340", "P1320", "P1335"]}, {"id": "P1340", "text": ["5.  Using an alligator to alligator jumper, connect the 2000 Hz TP        on PC130-322 to the CH4 TP on PC130-324.  This connects            the CH4 output of the generator card to the CH4 input of the           multiplexer.  The test console s able, follow these steps:", "a. Measure the frequency. b. Use a metal screwdriver to adjust C21. c. Remove the screwdriver. d. Check frequency. e. Repeat steps until frequency is set to 3 MHz.z. available."], "jumps": []}, {"id": "P1426", "text": ["PLASTIC SCREWDRIVER - If available, use a plastic screwdriver to adjust C20. A metal screw-driver, when inserted in the slot of the capacitor, will change the capacitance of the circuit. This will give you inaccurate readings. If a plastic screwdriver is not available, follow these steps:", "a. Measure the frequency. b. Use a metal screwdriver to adjust C20. c. Remove the screwdriver. d. Check frequency. e. Repeat steps until frequency is set to 3 MHz.ot available."], "jumps": []}, {"id": "P1430", "text": ["9.  Adjust PC130-324 R33 for a 3 MHz \u00b1 5 kHz signal if necessary.      The MAIN carrier FM modulator is aligned.  Now let's align the        four subcarrier FM modulators.", "5 kHz signal if necessary. The MAIN carrier FM modulator is aligned. Now let's align the four subcarrier FM modulators."], "jumps": ["P1440", "P1420", "P1442", "P1422"]}, {"id": "P1440", "text": ["1.  Using the internal frequency counter of the function generator      or a separate frequency counter if available (an oscilloscope          can be used if a frequency counter is not available), adjust the       f1adj control for a 250 kHz \u00b15 kHz signal on PC130-324 TP5.", "1. Using the internal frequency counter of the function generator or a separate frequency counter if available (an oscilloscope can be used if a frequency counter is not available), adjust the f1adj control for a 250 kHz", "carrier FM modulator is aligned. Now let's align the four subcarrier FM modulators."], "jumps": ["P1450", "P1420", "P1452", "P1432"]}, {"id": "P1450", "text": ["2.  Using the internal frequency counter of the function generator      or a separate frequency counter if available (an oscilloscope          can be used if a frequency counter is not available), adjust the       f2adj control for a 300 kHz \u00b15 kHz signal on PC130-324 TP6.", "2. Using the internal frequency counter of the function generator or a separate frequency counter if available (an oscilloscope can be used if a frequency counter is not available), adjust the f2adj control for a 300 kHz"], "jumps": ["P1460", "P1420", "P1462", "P1442"]}, {"id": "P1460", "text": ["3.  Using the internal frequency counter of the function generator      or a separate frequency counter if available (an oscilloscope          can be used if a frequency counter is not available), adjust the       f3adj control for a 350 kHz \u00b15 kHz signal on PC130-324 TP7.", "3. Using the internal frequency counter of the function generator or a separate frequency counter if available (an oscilloscope can be used if a frequency counter is not available), adjust the f3adj control for a 350 kHz"], "jumps": ["P1470", "P1420", "P1472", "P1452"]}, {"id": "P1470", "text": ["4.  Using the internal frequency counter of the function generator      or a separate frequency counter if available (an oscilloscope          can be used if a frequency counter is not available), adjust the       f4adj control for a 400 kHz \u00b15 kHz signal on PC130-324 TP8.", "4. Using the internal frequency counter of the function generator or a separate frequency counter if available (an oscilloscope can be used if a frequency counter is not available), adjust the f4adj control for a 400 kHz"], "jumps": ["P1480", "P1420", "P1462"]}, {"id": "P1480", "text": ["The FDM multiplexer is now completely aligned and receiving four analog signals and frequency division multiplexing them.  The modulating signals are 500, 1000, 1500 and 2000 Hz.  The subcarrier frequencies are 250, 300, 350 and 400 kHz.  The main carrier frequency is 3 MHz.", "The FDM multiplexer is now completely aligned and receiving four analog signals and frequency division multiplexing them. The modulating signals are 500, 1000, 1500 and 2000 Hz. The subcarrier frequencies are 250, 300, 350 and 400 kHz. The main carrier frequency is 3 MHz.", "The modulating signals are 500, 1000, 1500 and 2000 Hz. The Subcarrier frequencies are 250, 300, 350 and 400 kHz. The main carrier frequency is 3 MHz.ncy is set to 3 MHz.ot available."], "jumps": ["P1490", "P1420"]}, {"id": "P1490", "text": ["What is the approximate bandwidth of the system?", "What is the approximate bandwidth of the system?..........."], "jumps": ["P1480", "P1495"]}, {"id": "P1491", "text": [], "jumps": []}, {"id": "P1492", "text": ["400 kHz is the highest subcarrier frequency.  Remember, all the subcarriers are used to modulate the MAIN carrier.  The bandwidth has to be higher than the MAIN carrier.", "400 kHz is the highest subcarrier frequency. Remember, all the subcarriers are used to modulate the MAIN carrier. The bandwidth has to be higher than the MAIN carrier."], "jumps": []}, {"id": "P1493", "text": ["3 MHz is the MAIN carrier frequency.  The bandwidth must take into account the modulation.", "3 MHz is the MAIN carrier frequency. The bandwidth must take into account the modulation."], "jumps": []}, {"id": "P1495", "text": ["1.  Set S1 on PC130-324 to NORM.\n2.  Using the oscilloscope, observe the signal on PC130-324               TP15.  This is the FDM output of the transmitter.  Notice that it        is FM modulated, place S1 to TEST and back to NORM and             observe the difference (leave S1 in NORM).", "BANDWIDTH - The bandwidth is the the highest frequency in the main carrier signal plus the modulation frequencies. In this case, the modulation is FM and produces complex sidebands which will add to the bandwidth. For simplicity, just calculate the bandwidth using AM modulation.", "The modulating signals are 500, 1000, 1500 and 2000 Hz. The Subcarrier frequencies are 250, 300, 350 and 400 kHz. The main carrier frequency is 3 MHz.ncy is set to 3 MHz.ot available.", "1. Set S1 on PC130-324 to NORM. 2. Using the oscilloscope, observe the signal on PC130-324 TP15. This is the FDM output of the transmitter. Notice that it is FM modulated, place S1 to TEST and back to NORM and observe the difference (leave S1 in NORM).", "1. Set S1 on PC130-324 to NORM. 2. Using the oscilloscope, observe the signal on PC130-324 TP11. This is the FDM output of the transmitter. Notice that it is FM modulated, place S1 to TEST and back to NORM and observe the difference (leave S1 in NORM)."], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["3.  Using the oscilloscope, measure the signals on PC130-324            CH1 through CH4 TPs.  What type of signals are on the CH1 to      CH4 TPs?", "3. Using the oscilloscope, measure the signals on PC130-324 CH1 through CH4 TPs. What type of signals are on the CH1 to CH4 TPs?"], "jumps": ["P1500"]}, {"id": "P1511", "text": ["The signals on the CH1 to CH2 TPs are the inputs to the circuit. In other words, the output of the signal sources.", "The signals on the CH1 to CH2 TPs are the inputs to the circuit. In other words, the output of the signal sources.his is the FDM output of the transmitter. Notice that it is FM modulated, place S1 to TEST and back to NORM and observe the difference (leave S1 in NORM).", "MEASUREMENT SETUP - Using oscilloscope, measure the signals on PC130-324 CH1 through CH4 TPs."], "jumps": []}, {"id": "P1520", "text": ["4.  Using the oscilloscope, measure the signals on PC130-324            TPs 9 to12.  What type of signals are on TPs 9 to 12?", "4. Using the oscilloscope, measure the signals on PC130-324 TPs 9 to12. What type of signals are on TPs 9 to 12?"], "jumps": ["P1510", "P1525"]}, {"id": "P1521", "text": [], "jumps": []}, {"id": "P1522", "text": ["The signals on TPs 9 to 12 are after the NE566 circuits and before the NE564 circuit.  The FM modulation may be hard to see because of the low modulating frequencies.", "The signals on TPs 9 to 12 are after the NE566 circuits and before the NE564 circuit. The FM modulation may be hard to see because of the low modulating frequencies."], "jumps": []}, {"id": "P1523", "text": ["4. Using the oscilloscope, measure the signals on PC130-324 TPs 9 to11. What type of signals are on TPs 9 to 11?"], "jumps": ["P1510", "P1526"]}, {"id": "P1524", "text": ["The signals on TPs 9 to 11 are after the NE566 circuits and before the NE564 circuit. The FM modulation may be hard to see because of the low modulating frequencies.", "MEASUREMENT SETUP - Using oscilloscope, measure the signals on PC130-324 Tps 9 to 12.", "MEASUREMENT SETUP - Using oscilloscope, measure the signals on PC130-324 Tps 9 to 11..H4 TPs."], "jumps": ["P"]}, {"id": "P1530", "text": ["5.  Using the oscilloscope, measure the signal on PC130-324              TP15.  What type of signal is on TP15?", "5. Using the oscilloscope, measure the signal on PC130-324 TP15. What type of signal is on TP15?"], "jumps": ["P1535"]}, {"id": "P1531", "text": [], "jumps": []}, {"id": "P1532", "text": ["The signal on TP15 is after the NE564 circuit.", "The signal on TP15 is after the NE564 circuit.............."], "jumps": []}, {"id": "P1533", "text": ["5. Using the oscilloscope, measure the signal on PC130-324 TP11. What type of signal is on TP11?"], "jumps": ["P1536"]}, {"id": "P1534", "text": ["The signal on TP11 is after the NE564 circuit..............", "MEASUREMENT SETUP - Measure the signal on TP15.", "MEASUREMENT SETUP - Measure the signal on TP11.he signals on PC130-324 Tps 9 to 11..H4 TPs."], "jumps": []}, {"id": "P1540", "text": ["6.  Using the oscilloscope, measure the remaining test points on       PC130-324.", "6. Using the oscilloscope, measure the remaining test points on PC130-324."], "jumps": ["P1550"]}, {"id": "P1550", "text": ["You have aligned and measured signals in the FDM multiplexer circuit.  The type of signals on the test points will be important when troubleshooting.", "You have aligned and measured signals in the FDM multiplexer circuit. The type of signals on the test points will be important when troubleshooting."], "jumps": ["P1560", "P1540"]}, {"id": "P1560", "text": ["1.  Disconnect test equipment from the circuit.\n2.  Return the test console to the Initial Control settings.", "1. Disconnect test equipment from the circuit. 2. Return the test console to the Initial Control settings."], "jumps": ["P1550"]}, {"id": "P1570", "text": ["3.  Set the Test Console Power to OFF.", "3. Set the Test Console Power to OFF.F...................."], "jumps": ["P1560"]}, {"id": "P1580", "text": ["4.  Remove all PC cards from the test console.\n5.  Return all equipment to the designated storage areas.", "4. Remove all PC cards from the test console. 5. Return all equipment to the designated storage areas."], "jumps": ["P1910", "P1570"]}, {"id": "P1910", "text": ["This completes the experiment on FDM TRANSMITTERS.", "This completes the experiment on FDM TRANSMITTERS.E........"], "jumps": ["P1580"]}, {"id": "P2001", "text": ["In this experiment, you will observe the operation and measure signals in a typical FDM receiver circuit.", ". The experiment in this lesson is not setup to use the selected trainer."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["The receiver circuit is contained on PC130-325 and consists of the components necessary to support the five PLL FM demodulators."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["The FDM signal is applied to pin 6 of the MAIN FM demodulator, IC1, through R1, a level control."], "jumps": ["P2060", "P2020"]}, {"id": "P2060", "text": ["The center frequency is set by C3 and the loop gain is controlled by R4."], "jumps": ["P2070", "P2020"]}, {"id": "P2070", "text": ["Note that the TTL output of the VCO is connected to the phase comparator, pins 9 to 3.", "Note that the TTL output of the VCO is connected to the phase comparator, pins 9 to 3."], "jumps": ["P2080", "P2020", "P2075"]}, {"id": "P2075", "text": ["MEASUREMENT SETUP - Input to the Phase Comparator (IC1 pins 3 to 9) are from the VCO."], "jumps": []}, {"id": "P2080", "text": ["Even though digital signals are not used, the FDM signal input is not really a sine wave.  Remember, the square wave output was used in the multiplexer.", "Even though digital signals are not used, the FDM signal input is not really a sine wave. Remember, the square wave output was used in the multiplexer."], "jumps": ["P2090", "P2072"]}, {"id": "P2090", "text": ["The output of the MAIN demodulator is taken from pin 14, analog out, and applied to a buffer amplifier.", "The output of the MAIN demodulator is taken from pin 14, analog out, and applied to a buffer amplifier."], "jumps": ["P2100", "P2072", "P2095"]}, {"id": "P2095", "text": ["MEASUREMENT SETUP - The signal is outputted on IC1 pin 14 as the demodulated analog signal."], "jumps": []}, {"id": "P2100", "text": ["The buffer amplifier is used to boost the signal for suppling four different subcarrier demodulators.", "Each of the four subcarrier demodulators are identical.  Let's discuss CH1, or IC3 only.", "Each of the four subcarrier demodulators are identical. Let's discuss CH1, or IC3 only."], "jumps": ["P2110", "P2092", "P2120"]}, {"id": "P2120", "text": ["The demodulated MAIN carrier is applied to pins 2 and 3, through a RC network, to the subcarrier demodulator."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["Pins 4 and 5 are connected making the PLL circuit a FM demodulator."], "jumps": ["P2140", "P2110"]}, {"id": "P2140", "text": ["R18 is used to set the center frequency."], "jumps": ["P2150", "P2110"]}, {"id": "P2150", "text": ["The output from pin 7 is then amplified and filtered."], "jumps": ["P2160", "P2110"]}, {"id": "P2160", "text": ["Each of the four outputs are on the CH1 to CH4 test points.", "Now, pick up the PC130-325 card and compare to the schematic."], "jumps": ["P2170", "P2110", "P2180"]}, {"id": "P2180", "text": ["R1, R4 and C3 are the adjustments for the MAIN carrier demodulator."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["R18, R23, R26 and R31 adjust the subcarrier demodulators."], "jumps": ["P2200", "P2170"]}, {"id": "P2200", "text": ["Match up the other components on the card to the schematic."], "jumps": ["P2210", "P2170"]}, {"id": "P2210", "text": ["Let's start the experiment.", "Let's start the experiment.e...............................", "The FDM Transmitter circuit cards must be aligned as per the FDM Transmitter experiment before entering the FDM Receiver Experiment. If you have not aligned these circuit cards or are unsure whether they are aligned return to the Lesson Menu select FDM Transmitter Operation and align the circuit cards.", "NOTE Nida Model 440 Function Generator has a built in frequency counter. The next step has you adjust frequency and only use an oscilloscope if a frequency counter is not available."], "jumps": ["P2220", "P2170"]}, {"id": "P2220", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2210"]}, {"id": "P2230", "text": ["4.  Set the Positive Supply Voltage to 15. \n5.  Set the Negative Supply Voltage to 15.  The Test Console's             voltage meter should indicate 15 volts.", "4. Set the Positive Supply Voltage to 15. 5. Set the Negative Supply Voltage to 15. The Test Console's voltage meter should indicate 15 volts."], "jumps": ["P2420"]}, {"id": "P2410", "text": ["2.  Install PC130-325 into the PC3 position.", "2. Install PC130-325 into the PC3 position. the PC1 DC switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2220"]}, {"id": "P2420", "text": ["3.  On PC130-325, set all variable resistors to mid position.  DO           NOT adjust C3.", "3. On PC130-325, set all variable resistors to mid position. DO NOT adjust C3..", "MEASUREMENT SETUP - PC130-325 set all variable resistors to mid position. Do not adjust C3."], "jumps": ["P2230", "P2410", "P2425"]}, {"id": "P2430", "text": ["6.  Place PC3 DC Power switch to ON.", "7.  Using the internal frequency counter in the function generator      or a separate frequency counter (an oscilloscope can be                 used), adjust C3 on PC130-325 for a 3 MHz \u00b1 20 kHz signal in         IC1 pin 3.  Use a 4.7 kohm resistor on the counter's probe to           prevent loading and use a plastic screwdriver if available.", "6. Place PC3 DC Power switch to ON.l to 12. 130A - Set the PC1 DC Switch to ON....", "7. Using the internal frequency counter in the function generator or a separate frequency counter (an oscilloscope can be used), adjust C3 on PC130-325 for a 3 MHz", "20 kHz signal in IC1 pin 3. Use a 4.7 kohm resistor on the counter's probe to prevent loading and use a plastic screwdriver if available."], "jumps": ["P2230", "P2450", "P2430", "P2445"]}, {"id": "P2445", "text": ["PLASTIC SCREWDRIVER - If available, use a plastic screwdriver to adjust C3. A metal screw-driver, when inserted in the slot of the capacitor, will change the capacitance of the circuit. This will give you inaccurate readings. If a plastic screwdriver is not available, follow these steps:", "a. Measure the frequency. b. Use a metal screwdriver to adjust C3. c. Remove the screwdriver. d. Check frequency. e. Repeat steps until frequency is set to 3 MHz..ot available."], "jumps": []}, {"id": "P2450", "text": ["8.  Adjust PC130-325 R4, if necessary, for a 3 MHz + 5 kHz                    measurement on IC1 pin 3.  The MAIN carrier demodulator is          setup and aligned.  Now, let's align the subcarrier                              demodulators.", "8. Adjust PC130-325 R4, if necessary, for a 3 MHz + 5 kHz measurement on IC1 pin 3. The MAIN carrier demodulator is setup and aligned. Now, let's align the subcarrier demodulators."], "jumps": ["P2460", "P2440"]}, {"id": "P2460", "text": ["1.  Using the internal frequency counter of the function generator      or a separate frequency counter if available (an oscilloscope          can be used if a frequency counter is not available), adjust              R18 for a 250 kHz \u00b15 kHz signal on PC130-325 IC3 pin 5.", "1. Using the internal frequency counter of the function generator or a separate frequency counter if available (an oscilloscope can be used if a frequency counter is not available), adjust R18 for a 250 kHz"], "jumps": ["P2470", "P2440"]}, {"id": "P2470", "text": ["2.  Using the internal frequency counter of the function generator      or a separate frequency counter if available (an oscilloscope          can be used if a frequency counter is not available), adjust              R23 for a 300 kHz \u00b15 kHz signal on PC130-325 IC4 pin 5.", "2. Using the internal frequency counter of the function generator or a separate frequency counter if available (an oscilloscope can be used if a frequency counter is not available), adjust R23 for a 300 kHz"], "jumps": ["P2480", "P2440"]}, {"id": "P2480", "text": ["3.  Using the internal frequency counter of the function generator      or a separate frequency counter if available (an oscilloscope          can be used if a frequency counter is not available), adjust              R26 for a 350 kHz \u00b15 kHz signal on PC130-325 IC5 pin 5.", "3. Using the internal frequency counter of the function generator or a separate frequency counter if available (an oscilloscope can be used if a frequency counter is not available), adjust R26 for a 350 kHz"], "jumps": ["P2490", "P2440"]}, {"id": "P2490", "text": ["4.  Using the internal frequency counter of the function generator      or a separate frequency counter if available (an oscilloscope          can be used if a frequency counter is not available), adjust              R31 for a 400 kHz \u00b15 kHz signal on PC130-325 IC6 pin 5.", "4. Using the internal frequency counter of the function generator or a separate frequency counter if available (an oscilloscope can be used if a frequency counter is not available), adjust R31 for a 400 kHz"], "jumps": ["P2500", "P2440"]}, {"id": "P2500", "text": ["The four subcarrier demodulators are set up and aligned.  Now, lets see the FDM system in operation.  Note that small adjustments may have to be made in the demultiplexer circuit to fine align the demodulators to the frequencies used in the multiplexer.", "The four subcarrier demodulators are set up and aligned. Now, lets see the FDM system in operation. Note that small adjustments may have to be made in the demultiplexer circuit to fine align the demodulators to the frequencies used in the multiplexer."], "jumps": ["P2510", "P2440"]}, {"id": "P2510", "text": ["In fact, the MAIN demodulator may need slight adjustments to C3 and R4.  However, before making any adjustments to the MAIN demodulator, see your instructor.", "1.  Place PC1 and PC2 DC Power switches to ON.\n2.  Ensure that PC130-324 S1 is set to NORM.", "3.  Using the dual display mode on the oscilloscope, connect              CH1 to PC130-324 TP15 and CH2 to PC130-325 TP1.  Use X10       probes.  Compare the two traces.  They should be the same.          CH1 of the oscilloscope is the output of the multiplexer and            CH2 of the oscilloscope is the input of the demultiplexer.", "In fact, the MAIN demodulator may need slight adjustments to C3 and R4. However, before making any adjustments to the MAIN demodulator, see your instructor.", "1. Place PC1 and PC2 DC Power switches to ON. 2. Ensure that PC130-324 S1 is set to NORM.", "3. Using the dual display mode on the oscilloscope, connect CH1 to PC130-324 TP15 and CH2 to PC130-325 TP1. Use X10 probes. Compare the two traces. They should be the same. CH1 of the oscilloscope is the output of the multiplexer and CH2 of the oscilloscope is the input of the demultiplexer."], "jumps": ["P2520", "P2500", "P2510", "P2540"]}, {"id": "P2540", "text": ["4.  Connect the CH1 probe to PC130-324 CH1 TP.  This is the              CH1 analog input signal to the multiplexer.\n5.  Connect the CH2 probe to PC130-325 CH1 TP.  This is the              CH1 analog output signal from the demultiplexer.", "4. Connect the CH1 probe to PC130-324 CH1 TP. This is the CH1 analog input signal to the multiplexer. 5. Connect the CH2 probe to PC130-325 CH1 TP. This is the CH1 analog output signal from the demultiplexer.", "6. Adjust PC130-325 R18, if necessary, for a 500 Hz output signal on the CH2 trace of the oscilloscope. The output signal will be inverted and a little noisy but, it should be the same frequency as shown on the CH1 trace of the oscilloscope. Note that you can adjust R18 for the CH2, CH3 or CH4 frequencies! Be careful."], "jumps": ["P2550", "P2530", "P2560", "P2540"]}, {"id": "P2560", "text": ["7.  Move the CH1 and CH2 probes to the CH2 test points on                 PC130-324 and PC130-325.", "7. Move the CH1 and CH2 probes to the CH2 test points on PC130-324 and PC130-325. 23, if necessary, for a 1000 Hz output signal on the CH2 trace of the oscilloscope. The output signal will be inverted and a little noisy but, it should be the same frequency as shown on the CH1 trace of the oscilloscope. Note that you can adjust R23 for the CH1, CH3 or CH4 frequencies."], "jumps": ["P2565", "P2550"]}, {"id": "P2565", "text": ["8. Adjust PC130-325 R23, if necessary, for a 1000 Hz output signal on the CH2 trace of the oscilloscope. The output signal will be inverted and a little noisy but, it should be the same frequency as shown on the CH1 trace of the oscilloscope. Note that you can adjust R23 for the CH1, CH3 or CH4 frequencies."], "jumps": ["P2570", "P2550"]}, {"id": "P2570", "text": ["9.  Move the CH1 and CH2 probes to the CH3 test points on                 PC130-324 and PC130-325.", "9. Move the CH1 and CH2 probes to the CH3 test points on PC130-324 and PC130-325. R26, if necessary, for a 1500 Hz output signal on the CH2 trace of the oscilloscope. The output signal will be inverted and a little noisy but, it should be the same frequency as shown on the CH1 trace of the oscilloscope. Note that you can adjust R26 for the CH1, CH2 or CH4 frequencies."], "jumps": ["P2575", "P2550"]}, {"id": "P2575", "text": ["10. Adjust PC130-325 R26, if necessary, for a 1500 Hz output signal on the CH2 trace of the oscilloscope. The output signal will be inverted and a little noisy but, it should be the same frequency as shown on the CH1 trace of the oscilloscope. Note that you can adjust R26 for the CH1, CH2 or CH4 frequencies."], "jumps": ["P2580", "P2550"]}, {"id": "P2580", "text": ["11.  Move the CH1 and CH2 probes to the CH4 test points on                  PC130-324 and PC130-325.", "11. Move the CH1 and CH2 probes to the CH4 test points on PC130-324 and PC130-325. R31, if necessary, for a 2000 Hz output signal on the CH2 trace of the oscilloscope. The output signal will be inverted and a little noisy but, it should be the same frequency as shown on the CH1 trace of the oscilloscope. Note that you can adjust R31 for the CH1, CH2 or CH3 frequencies."], "jumps": ["P2585", "P2550"]}, {"id": "P2585", "text": ["12. Adjust PC130-325 R31, if necessary, for a 2000 Hz output signal on the CH2 trace of the oscilloscope. The output signal will be inverted and a little noisy but, it should be the same frequency as shown on the CH1 trace of the oscilloscope. Note that you can adjust R31 for the CH1, CH2 or CH3 frequencies."], "jumps": ["P2590", "P2550"]}, {"id": "P2590", "text": ["The demultiplexer is operating correctly.  The FDM signal if first demodulated and sent to four subcarrier demodulators.  The outputs are the four analog information signals applied to the multiplexer, PC130-324.", "The demultiplexer is operating correctly. The FDM signal if first demodulated and sent to four subcarrier demodulators. The outputs are the four analog information signals applied to the multiplexer, PC130-324."], "jumps": ["P2600", "P2550"]}, {"id": "P2600", "text": ["1.  Using the oscilloscope, measure the signal on PC130-325               TP1.  What type of signal is on TP1? let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
