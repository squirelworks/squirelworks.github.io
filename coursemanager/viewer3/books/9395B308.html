const book = {"title": "9395B308", "pages": [{"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 11-29-99 Converted from storyboard to toolbook. frieda 12-22-99 Text & Branching - lisa 02-24-00 Graphics. doan 03-16-00 CAI Lesson Checklist by Chris 07-14-00 Converted to ToolBook 7.1 format. jay 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-08-02 Checked for convertion errors. John Ayala 05-02-02 Review - lisa 11-05-03 P1300, P13300, chg from \"R6, R8, and R16 adjust the DC voltages that are applied to the VCO for fc, fmin and fmax.\" to \"R6, R8, and the CARRIER potentiometer (R16) adjust the DC voltages that are applied to the VCO for fc, fmin and fmax. P1410, P13410, placed a +/- between 1500hz and 100 hz P1480, P13480, placed a +/- between 1200hz and 100 hz P1540, P13540, placed a +/- between 1800hz and 100 hz P1640,P13640, placed/replaced 2 microseconds with 2 milliseconds -Dean"], "jumps": []}, {"id": "P14910", "text": ["This completes the experiment on FSK RECEIVER CIRCUITS.", "This completes the experiment on FSK RECEIVER CIRCUITS....."], "jumps": ["P14780"]}, {"id": "P14780", "text": ["3.  Disconnect all test equipment.    \n4.  Carefully remove experiment card.    \n5.  Return all equipment to designated storage areas.", "3. Disconnect all test equipment. 4. Carefully remove experiment card. 5. Return all equipment to designated storage areas."], "jumps": ["P14910", "P14770"]}, {"id": "P14770", "text": ["2.  Set the Console Power Switch to OFF.", "2. Set the Console Power Switch to OFF.FF................................."], "jumps": []}, {"id": "P14760", "text": ["1.  Disconnect the oscilloscope and function generator from the        circuit and test console.", "1. Disconnect the oscilloscope and function generator from the circuit and test console."], "jumps": ["P14750"]}, {"id": "P14750", "text": ["You have aligned and measured signals in the FSK demodulator circuit.  The circuit takes a FSK FM modulated signal and demodulates it to HIGHs and LOW.  The type of signals on the test points will be important when troubleshooting the circuit.", "You have aligned and measured signals in the FSK demodulator circuit. The circuit takes a FSK FM modulated signal and demodulates it to HIGHs and LOW. The type of signals on the test points will be important when troubleshooting the circuit."], "jumps": ["P14760", "P14720"]}, {"id": "P14740", "text": ["f.  TP6 - Digital output of demodulator.   \ng. TP7 - Reference frequency, fc, for fc detector PLL chip.    \nh. TP8 - Output of VCO and input to phase comparator in the PLL     circuit for the FM demodulator.", "f. TP6 - Digital output of demodulator. g. TP7 - Reference frequency, fc, for fc detector PLL chip. h. TP8 - Output of VCO and input to phase comparator in the PLL circuit for the FM demodulator."], "jumps": ["P14750", "P14720"]}, {"id": "P14730", "text": ["c. TP3 - Reference output of FM demodulator chip to the op amp amplifier. d. TP4 - Output of fc detector circuit. HIGH when fmin and fmax are transmitted, S1 on PC130-328 set to CONTINUOUS. LOW when fc is transmitted, S1 on PC130-328 set to CONTROL. e. TP5 - +10 volts to circuits.", "5. Measure the signals on the following test points using the CH2 probe of the oscilloscope (change oscilloscope settings as required): a. TP1 - Input to demodulator, FSK signal (FM signal). b. TP2 - Information output of FM demodulator chip (filtering not complete) to the op amp amplifier.", "Frequency Shift Keying (FSK) Demodulator"], "jumps": ["P14740", "P14720", "P14730", "P14710"]}, {"id": "P14710", "text": ["4.  Return the output amplitude of the function generator to 10            Vpp.  Now that you know the system is operating correctly,            let's measure the signals in the demodulator circuit.", "4. Return the output amplitude of the function generator to 10 Vpp. Now that you know the system is operating correctly, let's measure the signals in the demodulator circuit. i"], "jumps": ["P14720", "P14700"]}, {"id": "P14700", "text": ["Remember, amplitude variations do not effect a FSK system unless the system can not recognize a HIGH from a LOW."], "jumps": ["P14710", "P14690"]}, {"id": "P14690", "text": ["2.  Return the frequency output of the function generator to \n     100 Hz.\n3.  Increase and decrease the output amplitude of the function            generator.  Observe that the output signal remains the same          until the input amplitude drops below a certain level.", "2. Return the frequency output of the function generator to 100 Hz. 3. Increase and decrease the output amplitude of the function generator. Observe that the output signal remains the same until the input amplitude drops below a certain level."], "jumps": ["P14700", "P14680"]}, {"id": "P14680", "text": ["Remember that fc is 1500 Hz and should be five times greater than the highest input frequency.  This puts the frequency limit of the digital information signal to around 300 Hz.  Digital information signals above 300 Hz causes the system to operate incorrectly.", "Remember that fc is 1500 Hz and should be five times greater than the highest input frequency. This puts the frequency limit of the digital information signal to around 300 Hz. Digital information signals above 300 Hz causes the system to operate incorrectly."], "jumps": ["P14690", "P14670"]}, {"id": "P14670", "text": ["1.  Increase and decrease the frequency output of the function           generator.  Observe that the output signal follows the inputs          signal except for frequencies above 300 Hz.", "1. Increase and decrease the frequency output of the function generator. Observe that the output signal follows the inputs signal except for frequencies above 300 Hz."], "jumps": ["P14680", "P14660"]}, {"id": "P14660", "text": ["Now, let's observe the operation of the system.  Keep the oscilloscope connected to the input of the modulator and output of the demodulator.", "Now, let's observe the operation of the system. Keep the oscilloscope connected to the input of the modulator and output of the demodulator."], "jumps": ["P14670", "P14650"]}, {"id": "P14650", "text": ["The FSK modulator is now aligned.  The digital input to PC130-328 is changed to an analog FSK FM modulated signal and sent to the demodulator.  The demodulator changed the FSK signal back into a digital output.", "The FSK modulator is now aligned. The digital input to PC130-328 is changed to an analog FSK FM modulated signal and sent to the demodulator. The demodulator changed the FSK signal back into a digital output."], "jumps": ["P14660", "P14590"]}, {"id": "P14590", "text": ["The LED on PC130-329 should be completely extinguished.  The FSK signal received by the demodulator contains fmin and fmax, fc is not in the FSK signal.", "The LED on PC130-329 should be completely extinguished. The FSK signal received by the demodulator contains fmin and fmax, fc is not in the FSK signal."], "jumps": ["P14650", "P14580"]}, {"id": "P14583", "text": ["With S1 on PC130-328 set to CONTINUOUS, the modulator card takes the digital input and uses it to frequency modulate the FSK signal.  The carrier signal, fc, is not transmitted.", "With S1 on PC130-328 set to CONTINUOUS, the modulator card takes the digital input and uses it to frequency modulate the FSK signal. The carrier signal, fc, is not transmitted."], "jumps": []}, {"id": "P14582", "text": ["With S1 on PC130-328 set to CONTINUOUS, the modulator card takes the digital input and uses it to frequency modulate the FSK signal.  fc is not transmitted.", "With S1 on PC130-328 set to CONTINUOUS, the modulator card takes the digital input and uses it to frequency modulate the FSK signal. fc is not transmitted.-"], "jumps": []}, {"id": "P14581", "text": [], "jumps": []}, {"id": "P14580", "text": ["With S1 on PC130-328 set to CONTINUOUS, data is transmitted, what type of FSK signal is received by PC130-329?", "6.  Place PC130-328 S1 to CONTINUOUS and observe the LED           on PC130-329.\n7.  Ensure that the function generator is ON and out putting a 100       Hz, 10 Vpp square wave signal.", "5. Set S1 to the continuous position. This applies the data signal       to the modulator. The LED on PC130-329 should extinguish.          This is because the carrier frequency will no longer be present      on the output of the modulator.", "6. Place PC130-328 S1 to CONTINUOUS and observe the LED on PC130-329. 7. Ensure that the function generator is ON and out putting a 100 Hz, 10 Vpp square wave signal.", "5. Set S1 to the continuous position. This applies the data signal to the modulator. The LED on PC130-329 should extinguish. This is because the carrier frequency will no longer be present on the output of the modulator.", "Frequency Shift Keying (FSK) Demodulator"], "jumps": ["P14570", "P14580", "P14560", "P14550"]}, {"id": "P14550", "text": ["4.  Connect a frequency counter to PC130-329 TP7.  Verify that           the signal on TP7 is 1500 Hz + 100 Hz.  This signal is being             generated by the demodulator circuit to detect the presence          of the carrier signal.", "3.  Adjust PC130-329 Carrier Adjust potentiometer (R16) until the        green LED illuminates.  Move in small increments because it          lights quickly and only in one location.", "4. Connect a frequency counter to PC130-329 TP7. Verify that the signal on TP7 is 1500 Hz + 100 Hz. This signal is being generated by the demodulator circuit to detect the presence of the carrier signal.", "3. Adjust PC130-329 Carrier Adjust potentiometer (R16) until the green LED illuminates. Move in small increments because it lights quickly and only in one location.", "Frequency Shift Keying (FSK) Demodulator"], "jumps": ["P14560", "P14540", "P14550", "P14530"]}, {"id": "P14530", "text": ["2.  Set PC130-328 S1 to control, this transmits the carrier signal          to the demodulator.", "2. Set PC130-328 S1 to control, this transmits the carrier signal to the demodulator..."], "jumps": ["P14540", "P14520"]}, {"id": "P14523", "text": ["With S1 on PC130-328 set to the CONTROL position, no data is transmitted.  The FSK signal will be fmax.", "With S1 on PC130-328 set to the CONTROL position, no data is transmitted. The FSK signal will be fmax."], "jumps": []}, {"id": "P14522", "text": ["With S1 on PC130-328 set to the CONTROL position, no data is transmitted.  The FSK signal will not be fmin.", "With S1 on PC130-328 set to the CONTROL position, no data is transmitted. The FSK signal will not be fmin."], "jumps": []}, {"id": "P14521", "text": [], "jumps": []}, {"id": "P14520", "text": ["What type of FM signal is transmitted in PC130-328 to PC130-329 with S1 set to CONTROL?"], "jumps": ["P14510"]}, {"id": "P14518", "text": ["The signal should be a constant 1500 Hz sine wave signal.  If not, there is a problem in your modulator, PC130-328, or in the test console.", "The signal should be a constant 1500 Hz sine wave signal. If not, there is a problem in your modulator, PC130-328, or in the test console.", "MEASUREMENT SETUP - Measure the frequency and waveform on PC130-329", "Frequency Shift Keying (FSK) Demodulator", "MEASUREMENT SETUP - Place PC130-328 S1 to the CONTROL position. Adjust PC130-328 R14."], "jumps": ["P14520", "P14510", "P14515", "P14516"]}, {"id": "P14510", "text": ["1.  Connect the oscilloscope to the IN test point.  Adjust the                 PC130-328 modulator output level R14 for a 1 Vpp modulated        signal at this test point.", "1. Connect the oscilloscope to the IN test point. Adjust the PC130-328 modulator output level R14 for a 1 Vpp modulated signal at this test point."], "jumps": ["P14518", "P14500", "P14515"]}, {"id": "P14500", "text": ["The FSK modulator is aligned and transmitting FSK data to the demodulator.  The demodulator, however, is not aligned yet.  Let's align the FSK demodulator.", "The FSK modulator is aligned and transmitting FSK data to the demodulator. The demodulator, however, is not aligned yet. Let's align the FSK demodulator."], "jumps": ["P14510"]}, {"id": "P14490", "text": ["5.  Press Enter to Set: PC2 and PC3 DC Power Switches - ON", "5. Press Enter to Set: PC2 and PC3 DC Power Switches - ON................."], "jumps": []}, {"id": "P14480", "text": ["4.  Press Enter to Set: Positive Supply Control - 15", "3.  Set all potentiometers to their mid-position.", "4. Press Enter to Set: Positive Supply Control - 15.......................", "3. Set all potentiometers to their mid-position...........", "Frequency Shift Keying (FSK) Demodulator"], "jumps": ["P14470", "P14480", "P14330"]}, {"id": "P14330", "text": ["2.  Carefully plug PC130-329 into the Test Console PC3 position.", "2. Carefully plug PC130-329 into the Test Console PC3 position."], "jumps": ["P14470"]}, {"id": "P14320", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P14310"]}, {"id": "P14310", "text": ["Let's start the experiment.", "Let's start the experiment.e...............................", "The FSK Transmitter circuit cards must be aligned as per the FSK Transmitter experiment before entering the FSK Receiver Experiment. If you have not aligned these circuit cards or are unsure whether they are aligned return to the Lesson Menu, select FSK Transmitter Operation and align the circuit cards.", "NOTE FSK Transmitter circuit cards must be aligned as per the FSK Transmitter experiment before entering the FSK Receiver Experiment. If you have not aligned these circuit cards or are unsure whether they are aligned return to the Lesson Menu, select FSK Transmitter Operation and align the circuit cards."], "jumps": ["P14320", "P14260"]}, {"id": "P14300", "text": ["Match up the other components on the card to the schematic."], "jumps": ["P14310", "P14260"]}, {"id": "P14290", "text": ["R16 is used to adjust the center frequency of the fc detector circuit."], "jumps": ["P14300", "P14260"]}, {"id": "P14280", "text": ["R6 is used to adjust the center frequency of the PLL FM demodulator circuit."], "jumps": ["P14290", "P14260"]}, {"id": "P14270", "text": ["R1 is the level adjust for the FSK input signal.", "Now, pick up the PC130-329 card and compare to the schematic."], "jumps": ["P14280", "P14260", "P14270", "P14140"]}, {"id": "P14250", "text": ["Q1 has collector bias allowing the digital data out."], "jumps": ["P14260", "P14140"]}, {"id": "P14240", "text": ["The +10 volts is no longer dropped across the resistor placing the collector of Q1 to +10 volts."], "jumps": ["P14250", "P14140"]}, {"id": "P14230", "text": ["When the output of IC3 is HIGH, meaning fmin or fmax is received, DS1 is reverse biased and extinguishes."], "jumps": ["P14240", "P14140"]}, {"id": "P14220", "text": ["Q1 is turned off preventing digital data from the output of the circuit."], "jumps": ["P14230", "P14140"]}, {"id": "P14210", "text": ["The +10 volts is dropped across the resistor placing the collector of Q1 to 0 volts."], "jumps": ["P14220", "P14140"]}, {"id": "P14200", "text": ["When the output of IC3 is LOW, meaning fc is received, DS1 is forward biased and illuminates."], "jumps": ["P14210", "P14140"]}, {"id": "P14190", "text": ["The output on pin 8, LOW when fc is received and HIGH when fmin and fmax are received, is applied to the DS1 and D1 circuit."], "jumps": ["P14200", "P14140"]}, {"id": "P14180", "text": ["Pins 1 and 2 form a filter."], "jumps": ["P14190", "P14140"]}, {"id": "P14170", "text": ["Pins 5 and 6 set the center frequency.  R16 is adjustable for alignment to fc in the modulator circuit.", "Pins 5 and 6 set the center frequency. R16 is adjustable for alignment to fc in the modulator circuit."], "jumps": ["P14180", "P14140"]}, {"id": "P14160", "text": ["The FSK signal is applied to pin 3."], "jumps": ["P14170", "P14140"]}, {"id": "P14150", "text": ["Pin 4 is the power source and pin 7 is ground."], "jumps": ["P14160", "P14140"]}, {"id": "P14145", "text": ["-V Input Input VCO Output Comparator Input Reference Output Information Output", "Not Used Not Used Not Used Not Used +V C R"], "jumps": []}, {"id": "P14140", "text": ["The fc detector circuit consists of the NE567 chip as shown in the simplified schematic."], "jumps": ["P14150", "P14050", "P14145"]}, {"id": "P14130", "text": ["Q1 is a common emitter switch and only allows the digital data out when the input from the fc detector is HIGH, meaning data is being transmitted."], "jumps": ["P14140", "P14050"]}, {"id": "P14120", "text": ["The output of the amplifier is fed to Q1."], "jumps": ["P14130", "P14050"]}, {"id": "P14110", "text": ["The information output on pin 7 and the reference output on pin 6 are applied to an op amp amplifier, IC2."], "jumps": ["P14120", "P14050"]}, {"id": "P14100", "text": ["The capacitors and resistors connected to the demodulated output on pin 7 are a filter and used to ensure only HIGHs and LOWs are produced."], "jumps": ["P14110", "P14050"]}, {"id": "P14090", "text": ["Pins 6 and 7 are the outputs.  Pin 7 is the information output and pin 6 is the reference output.", "Pins 6 and 7 are the outputs. Pin 7 is the information output and pin 6 is the reference output."], "jumps": ["P14100", "P14050"]}, {"id": "P14080", "text": ["Pins 8 and 9 set up the center frequency of the FM demodulator, fc (R and C inputs).  R6 allows making adjustments.", "Pins 8 and 9 set up the center frequency of the FM demodulator, fc (R and C inputs). R6 allows making adjustments."], "jumps": ["P14090", "P14050"]}, {"id": "P14070", "text": ["The FSK signal is applied through R1, level control, to pins 2 and 3 of IC1.  FSK is also applied to the fc detector circuit.", "The FSK signal is applied through R1, level control, to pins 2 and 3 of IC1. FSK is also applied to the fc detector circuit."], "jumps": ["P14080", "P14050"]}, {"id": "P14060", "text": ["For the PLL demodulator, IC1, pin 10 is the power source and pin 1 is ground."], "jumps": ["P14070", "P14050"]}, {"id": "P14055", "text": ["-V Input Input VCO Output Comparator Input Reference Output Information Output", "Not Used Not Used Not Used Not Used +V C R"], "jumps": []}, {"id": "P14050", "text": ["The FM demodulator circuit consists of the NE565 PLL FM demodulator, filter, IC2 amplifier and Q1 switch as shown in the simplified schematic."], "jumps": ["P14060", "P14040", "P14055"]}, {"id": "P14040", "text": ["The receiver circuit is contained on PC130-329 and consists of the components necessary to support the NE565 and NE567 PLL chips."], "jumps": ["P14050", "P14020"]}, {"id": "P14020", "text": ["In this experiment, you will observe the operation and measure signals in a typical FSK receiver circuit."], "jumps": ["P14040", "P2001"]}, {"id": "P13910", "text": ["This completes the experiment on FSK TRANSMITTER CIRCUITS.", "This completes the experiment on FSK TRANSMITTER CIRCUITS...."], "jumps": ["P13770"]}, {"id": "P13770", "text": ["2.  Disconnect all test equipment.     \n3.  Carefully remove experiment card. \n4.  Return all equipment to designated storage areas.", "2. Disconnect all test equipment. 3. Carefully remove experiment card. 4. Return all equipment to designated storage areas."], "jumps": ["P13910", "P13760"]}, {"id": "P13760", "text": ["1.  Set the Console Power Switch to OFF.", "1. Set the Console Power Switch to OFF.FF................................."], "jumps": []}, {"id": "P13740", "text": ["You have aligned and measured signals in the FSK modulator circuit.  The circuit takes a digital information input and uses it to frequency modulate an analog signal.  The type of signals on the test points will be important when troubleshooting lesson.", "You have aligned and measured signals in the FSK modulator circuit. The circuit takes a digital information input and uses it to frequency modulate an analog signal. The type of signals on the test points will be important when troubleshooting lesson."], "jumps": ["P13710"]}, {"id": "P13730", "text": ["TP5 - DC output voltage of switching circuit to VCO.\nTP6 - Analog output.", "TP5 - DC output voltage of switching circuit to VCO. TP6 - Analog output......"], "jumps": ["P13740", "P13710"]}, {"id": "P13720", "text": ["TP3 - Digital data input to switching circuit after op amp.  Vary                  R2, the signal is there, HIGH or LOW.  Place R2 to mid                       position.\nTP4 - +10 volts to IC3, VCO.", "TP3 - Digital data input to switching circuit after op amp. Vary R2, the signal is there, HIGH or LOW. Place R2 to mid position. TP4 - +10 volts to IC3, VCO.", "26. Using the CH2 probe, measure the following test points. (Change oscilloscope controls as necessary): TP1 - Digital data input. TP2 - Ground input to switching circuit. This TP could be connected to another circuit that would generate ground and HIGH inputs to control the FSK modulator."], "jumps": ["P13730", "P13710", "P13720", "P13700"]}, {"id": "P13700", "text": ["Notice that the modulator circuit follows the frequency of the input signal.  You may see at the higher input frequencies that the modulator circuit can not keep up.  This is due to the bandwidth of the system.", "Notice that the modulator circuit follows the frequency of the input signal. You may see at the higher input frequencies that the modulator circuit can not keep up. This is due to the bandwidth of the system."], "jumps": ["P13710", "P13680"]}, {"id": "P13690", "text": ["24.  Place PC130-328 S1 back to CONTINUOUS.\n25.  Vary the frequency output of the function generator and                  observe the resultant FSK signal.", "23.  Place PC130-328 S1 to CONTROL.  Notice that the FSK                    signal is constant, fc.  With no information data transmitted,            fc is sent even though digital data is being applied to the                 circuit.", "24. Place PC130-328 S1 back to CONTINUOUS. 25. Vary the frequency output of the function generator and observe the resultant FSK signal.", "23. Place PC130-328 S1 to CONTROL. Notice that the FSK signal is constant, fc. With no information data transmitted, fc is sent even though digital data is being applied to the circuit."], "jumps": ["P13700", "P13680", "P13690", "P13670"]}, {"id": "P13670", "text": ["The FSK circuit is operating correctly for digital data inputs."], "jumps": ["P13680", "P13660"]}, {"id": "P13660", "text": ["Notice that when the CH1 digital trace is HIGH, the FSK frequency seen on CH2 is HIGH.  When the CH1 digital trace is LOW, the FSK frequency seen on CH2 is LOW.", "22.  Adjust R2, the input level adjust, until a distinct change can             be seen in the frequency during the high and low conditions.         Adjust the oscilloscope trigger hold off and level as                           necessary.", "Notice that when the CH1 digital trace is HIGH, the FSK frequency seen on CH2 is HIGH. When the CH1 digital trace is LOW, the FSK frequency seen on CH2 is LOW.", "22. Adjust R2, the input level adjust, until a distinct change can be seen in the frequency during the high and low conditions. Adjust the oscilloscope trigger hold off and level as necessary."], "jumps": ["P13670", "P13650", "P13660", "P13640"]}, {"id": "P13640", "text": ["21.  Set the oscilloscope trigger to EXT (external), connect CH1             to TP1 (input) and CH2 to TP6 (output).  Make sure the                      oscilloscope is set to dual, AC, 2 ms Time/Div setting.", "20.  Connect the SYNC OUT connector of your function                           generator to the TRIGGER IN connector of your                                  oscilloscope.  This will make it easier to view the modulated           waveform.", "21. Set the oscilloscope trigger to EXT (external), connect CH1 to TP1 (input) and CH2 to TP6 (output). Make sure the oscilloscope is set to dual, AC, 2 ms Time/Div setting.", "20. Connect the SYNC OUT connector of your function generator to the TRIGGER IN connector of your oscilloscope. This will make it easier to view the modulated waveform."], "jumps": ["P13650", "P13630", "P13640", "P13620"]}, {"id": "P13625", "text": ["OSCILLOSCOPE - CH1 Volts/Div - 5, DC CH2 Volts/Div - 0.5, AC Triggering - CH1, AC, + Display - Dual"], "jumps": []}, {"id": "P13620", "text": ["19.  Connect the oscilloscope to TP1 data in of the modulator                card.  Be certain that the signal at this point is 100Hz 10 Vpp          squarewave.  If not, adjust the function generator until the               signal is correct.", "19. Connect the oscilloscope to TP1 data in of the modulator card. Be certain that the signal at this point is 100Hz 10 Vpp squarewave. If not, adjust the function generator until the signal is correct.", "a. CH1 Volts/Div - 5, DC b. CH2 Volts/Div - 0.5, AC c. Triggering - CH1, AC, + d. Display - Dual", "MEASUREMENT SETUP - Measurement the voltage on PC130-328 TP1."], "jumps": ["P13630", "P13610", "P13625"]}, {"id": "P13615", "text": ["BNC CONNECTION - Connect the Function Generator's main Output BNC to the Test Console's PC1 Output BNC."], "jumps": []}, {"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 11-29-99 Converted from storyboard to toolbook. frieda 12-22-99 Text & Branching - lisa 02-24-00 Graphics. doan 03-16-00 CAI Lesson Checklist by Chris 07-14-00 Converted to ToolBook 7.1 format. jay 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-08-02 Checked for conversion errors. John Ayala 05-02-02 Review - lisa 11-05-03 P1300, P13300, chg from \"R6, R8, and R16 adjust the DC voltages that are applied to the VCO for fc, fmin and fmax.\" to \"R6, R8, and the CARRIER potentiometer (R16) adjust the DC voltages that are applied to the VCO for fc, fmin and fmax. P1410, P13410, placed a +/- between 1500hz and 100 hz P1480, P13480, placed a +/- between 1200hz and 100 hz P1540, P13540, placed a +/- between 1800hz and 100 hz P1640,P13640, placed/replaced 2 microseconds with 2 milliseconds -Dean 03-04-04 P1615, P13615, deleted function generator, label, cable and centered test console on page.- Dean", "BNC CONNECTION - Connect the Function Generator's main Output BNC to the Test Console's PC1 Output BNC."], "jumps": []}, {"id": "P13610", "text": ["17.  Set the function generator to a 100 Hz square wave, at 10Vpp         using the oscilloscope. \n18.  Using a BNC-to-BNC connector, connect the output of the              function generator to the OUTPUT connector of PC1.  This             connects to the data in of the modulator circuitry.", "16.  Disconnect the alligator to alligator jumper from the circuit.", "17. Set the function generator to a 100 Hz square wave, at 10Vpp using the oscilloscope. 18. Using a BNC-to-BNC connector, connect the output of the function generator to the OUTPUT connector of PC1. This connects to the data in of the modulator circuitry.", "16. Disconnect the alligator to alligator jumper from the circuit."], "jumps": ["P13620", "P13600", "P13615", "P13610", "P13590"]}, {"id": "P13590", "text": ["You have aligned the FSK modulator using constant inputs, a static alignment.  Now, let's look at the transmitter with dynamic inputs, that is, using the square wave output of the function generator.", "You have aligned the FSK modulator using constant inputs, a static alignment. Now, let's look at the transmitter with dynamic inputs, that is, using the square wave output of the function generator."], "jumps": ["P13600", "P13570"]}, {"id": "P13580", "text": ["Also note that small changes in the VCO's input voltage produce significant changes in the VCO's output frequency."], "jumps": ["P13590", "P13570"]}, {"id": "P13570", "text": ["Notice that the voltage to the VCO decreased and produced a higher frequency output.", "TP5(fc, 1500 Hz) = TP5(fmin, 1200 Hz) = TP5(fmax, 1800 Hz) ="], "jumps": ["P13580", "P13560"]}, {"id": "P13567", "text": ["You still have not measured the correct voltage.  You should have measured approximately 9.40 volts.", "You still have not measured the correct voltage. You should have measured approximately 9.40 volts.", "TEST LEAD PLACEMENT - Measure the voltage input on PC130-328 TP5."], "jumps": ["P13560"]}, {"id": "P13562", "text": ["You did not measure the correct voltage, ensure that the output frequency measured on TP6 is 1800 Hz."], "jumps": []}, {"id": "P13561", "text": [], "jumps": []}, {"id": "P13560", "text": ["15.  Using the multimeter, measure the DC voltage input to the              VCO on PC130-328 TP5 to two decimal places.  What is the             measured voltage on TP5?", "15. Using the multimeter, measure the DC voltage input to the VCO on PC130-328 TP5 to two decimal places. What is the measured voltage on TP5?"], "jumps": ["P13550", "P13565", "P13562"]}, {"id": "P13550", "text": ["You have set the output of the FSK modulator for 1800 Hz when a HIGH information signal is transmitted, fmax.", "14.  Using a frequency counter or an oscilloscope, set the                       frequency on TP6 to 1800 Hz (+/- 100 Hz) by adjusting the Hi          (R8) potentiometer.  Be as close as possible.", "14. Using a frequency counter or an oscilloscope, set the frequency on TP6 to 1800 Hz (+/- 100 Hz) by adjusting the Hi (R8) potentiometer. Be as close as possible."], "jumps": ["P13560", "P13540", "P13550", "P13530"]}, {"id": "P13533", "text": ["fc is generated when no information signal is applied.  With S1 set to CONTINUOUS and +V volts on TP1, the circuit transmits a frequency that represents a HIGH input.", "fc is generated when no information signal is applied. With S1 set to CONTINUOUS and +V volts on TP1, the circuit transmits a frequency that represents a HIGH input."], "jumps": []}, {"id": "P13532", "text": ["fmin is generated when LOW data is applied to the circuit.  With S1 set to CONTINUOUS and TP1 set to +V volts, a LOW is not applied to the circuit.", "fmin is generated when LOW data is applied to the circuit. With S1 set to CONTINUOUS and TP1 set to +V volts, a LOW is not applied to the circuit."], "jumps": []}, {"id": "P13531", "text": [], "jumps": []}, {"id": "P13530", "text": ["What frequency is generated in the FSK modulator when S1 is in the CONTINUOUS position and with a HIGH input?", "13.  Using the alligator to alligator jumper, connect TP1 to the +V           test point.  This ensures that a high condition is present on            the input.  This allows us to set the high frequency of the                 modulator.", "13. Using the alligator to alligator jumper, connect TP1 to the +V test point. This ensures that a high condition is present on the input. This allows us to set the high frequency of the modulator."], "jumps": ["P13520", "P13530", "P13510"]}, {"id": "P13510", "text": ["Notice that the voltage to the VCO increased and produced a lower frequency output.  The ICL8038 chip operates opposite from expected but, it still operates as a VCO!", "Notice that the voltage to the VCO increased and produced a lower frequency output. The ICL8038 chip operates opposite from expected but, it still operates as a VCO!", "TP5(fc, 1500 Hz) = TP5(fmin, 1200 Hz) ="], "jumps": ["P13520", "P13500"]}, {"id": "P13507", "text": ["You still have not measured the correct voltage.  You should have measured approximately 9.60 volts.", "You still have not measured the correct voltage. You should have measured approximately 9.60 volts.", "TEST LEAD PLACEMENT - Measure the voltage input on PC130-328 TP5."], "jumps": ["P13500"]}, {"id": "P13502", "text": ["You did not measure the correct voltage, ensure that the output frequency measured on TP6 is 1200 Hz."], "jumps": []}, {"id": "P13501", "text": [], "jumps": []}, {"id": "P13500", "text": ["12.  Using the multimeter, measure the DC voltage input to the               VCO on PC130-328 TP5 to two decimal places.  What is the             measured voltage on TP5?", "12. Using the multimeter, measure the DC voltage input to the VCO on PC130-328 TP5 to two decimal places. What is the measured voltage on TP5?"], "jumps": ["P13490", "P13505", "P13502"]}, {"id": "P13490", "text": ["You have set the output of the FSK modulator for 1200 Hz when a LOW information signal is transmitted, fmin.", "11.  Using a frequency counter or an oscilloscope, set the                       frequency on TP6 to 1200 Hz (+/- 100 Hz) by adjusting the               (R6) potentiometer.  Be as close as possible.", "11. Using a frequency counter or an oscilloscope, set the frequency on TP6 to 1200 Hz (+/- 100 Hz) by adjusting the (R6) potentiometer. Be as close as possible."], "jumps": ["P13500", "P13480", "P13490", "P13470"]}, {"id": "P13473", "text": ["fmax is generated when HIGH data is applied to the circuit.  With S1 set to CONTINUOUS and TP1 grounded, a HIGH is not applied to the circuit.", "fmax is generated when HIGH data is applied to the circuit. With S1 set to CONTINUOUS and TP1 grounded, a HIGH is not applied to the circuit."], "jumps": []}, {"id": "P13472", "text": ["fc is generated when no information signal is applied.  With S1 set to CONTINUOUS and a ground on TP1, the circuit transmits a frequency that represents a LOW input.", "fc is generated when no information signal is applied. With S1 set to CONTINUOUS and a ground on TP1, the circuit transmits a frequency that represents a LOW input."], "jumps": []}, {"id": "P13471", "text": [], "jumps": []}, {"id": "P13470", "text": ["What frequency is generated in the FSK modulator when S1 is in the CONTINUOUS position and with a LOW input?", "10.  Using an alligator to alligator jumper, connect TP1 to the                 GND test point.  This ensures that a LOW condition is present        on the input.  This allows us to set the low frequency of the            modulator.", "9.  Place S1 to CONTINUOUS, UP.", "10. Using an alligator to alligator jumper, connect TP1 to the GND test point. This ensures that a LOW condition is present on the input. This allows us to set the low frequency of the modulator.", "9. Place S1 to CONTINUOUS, UP............................."], "jumps": ["P13460", "P13470", "P13450", "P13440"]}, {"id": "P13440", "text": ["With the modulator set up for the center frequency of 1500 Hz output, fc (no information signal), the voltage input to the VCO is:"], "jumps": ["P13450", "P13430"]}, {"id": "P13437", "text": ["You still have not measured the correct voltage.  You should have measured approximately 9.50 volts.", "You still have not measured the correct voltage. You should have measured approximately 9.50 volts.", "TEST LEAD PLACEMENT - Measure the voltage input on PC130-328 TP5."], "jumps": ["P13430"]}, {"id": "P13432", "text": ["You did not measure the correct voltage, ensure that the output frequency measured on TP6 is 1500 Hz."], "jumps": []}, {"id": "P13431", "text": [], "jumps": []}, {"id": "P13430", "text": ["8.  Using the multimeter, measure the DC voltage input to the              VCO on PC130-328 TP5 to two decimal places.  What is the             measured voltage on TP5?", "8. Using the multimeter, measure the DC voltage input to the VCO on PC130-328 TP5 to two decimal places. What is the measured voltage on TP5??"], "jumps": ["P13420", "P13435", "P13432"]}, {"id": "P13420", "text": ["You have set the output of the FSK modulator for 1500 Hz when no information is transmitted, fc.", "1500 Hz +/- 100 Hz, by adjusting the carrier potentiometer. Be as close as possible. i", "7. Using a frequency counter or an oscilloscope, set the frequency on TP6 to 1500 Hz (+/- 100 Hz), by adjusting the carrier potentiometer. Be as close as possible."], "jumps": ["P13430", "P13410", "P13420", "P13400"]}, {"id": "P13403", "text": ["fmax is generated when digital data is applied (HIGH) to the circuit.  With S1 set to CONTROL, the digital input is not activated.", "fmax is generated when digital data is applied (HIGH) to the circuit. With S1 set to CONTROL, the digital input is not activated."], "jumps": []}, {"id": "P13402", "text": ["fmin is generated when digital data is applied (LOW) to the circuit.  With S1 set to CONTROL, the digital input is not activated.", "fmin is generated when digital data is applied (LOW) to the circuit. With S1 set to CONTROL, the digital input is not activated."], "jumps": []}, {"id": "P13401", "text": [], "jumps": []}, {"id": "P13400", "text": ["6.  Place S1 to the CONTROL position.  What frequency is                    generated in the FSK modulator when S1 is in the CONTROL         position?", "6. Place S1 to the CONTROL position. What frequency is generated in the FSK modulator when S1 is in the CONTROL position?"], "jumps": ["P13390"]}, {"id": "P13390", "text": ["The FSK modulator circuit is now set up and operating without an information signal input.  Let's align the modulator.  The alignment is called a static alignment because no information signal from an external source is going to be applied.", "The FSK modulator circuit is now set up and operating without an information signal input. Let's align the modulator. The alignment is called a static alignment because no information signal from an external source is going to be applied."], "jumps": ["P13400"]}, {"id": "P13380", "text": ["5.  Press Enter to Set: PC2 DC Power Switch - ON", "5. Press Enter to Set: PC2 DC Power Switch - ON..........................."], "jumps": []}, {"id": "P13370", "text": ["4.  Press Enter to Set: Positive Supply Control - 15", "3.  On PC130-328, set all potentiometers to mid position.", "4. Press Enter to Set: Positive Supply Control - 15.......................", "3. On PC130-328, set all potentiometers to mid position..."], "jumps": ["P13360", "P13370", "P13350"]}, {"id": "P13350", "text": ["2.  Carefully plug PC130-328 into the Test Console PC2 position.", "2. Carefully plug PC130-328 into the Test Console PC2 position."], "jumps": []}, {"id": "P13340", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13270"]}, {"id": "P13330", "text": ["Let's start the experiment."], "jumps": ["P13340", "P13270"]}, {"id": "P13320", "text": ["Match up the other components on the card to the schematic."], "jumps": ["P13330", "P13270"]}, {"id": "P13310", "text": ["R12 and R13 adjust the FM output symmetry."], "jumps": ["P13320", "P13270"]}, {"id": "P13300", "text": ["R6, R8, and the CARRIER potentiometer (R16) adjust the DC voltages that are applied to the VCO for fc, fmin and fmax.........."], "jumps": ["P13310", "P13270"]}, {"id": "P13290", "text": ["R2 and R14 adjust the levels, R2 the digital input and R14 the FM output."], "jumps": ["P13300", "P13270"]}, {"id": "P13280", "text": ["S1 is the manual control for transmitting data.  In the CONTROL position, down, no data is transmitted.", "Now, pick up the PC130-328 card and compare to the schematic.", "S1 is the manual control for transmitting data. In the CONTROL position, down, no data is transmitted."], "jumps": ["P13290", "P13270", "P13280", "P13220"]}, {"id": "P13260", "text": ["The output is taken from pin 2, sine wave output, through C7 and R14, level control."], "jumps": ["P13270", "P13220"]}, {"id": "P13250", "text": ["Pin 12 is used through R13 for symmetry adjustment.  Pin 1 is not used.", "Pin 12 is used through R13 for symmetry adjustment. Pin 1 is not used."], "jumps": ["P13260", "P13220"]}, {"id": "P13240", "text": ["Pins 4 and 5 are connected through R10, R11 and R12 for duty cycle adjustment, part of the symmetry control of the circuit."], "jumps": ["P13250", "P13220"]}, {"id": "P13230", "text": ["The voltage from the switching circuit is applied to pin 8."], "jumps": ["P13240", "P13220"]}, {"id": "P13225", "text": [], "jumps": []}, {"id": "P13220", "text": ["The FM modulator circuit consists of the ICL8038 VCO modulator chip as shown in the simplified schematic.", "Duty Cycle IC3 ICL8038 Input GND Timing Sym"], "jumps": ["P13230", "P13210", "P13225"]}, {"id": "P13215", "text": [], "jumps": []}, {"id": "P13210", "text": ["The switching circuit produces three DC voltages according to the information digital data and if data is to be transmitted."], "jumps": ["P13220", "P13160", "P13215"]}, {"id": "P13200", "text": ["Switch a closes, allowing Efmax to change the Efc voltage.  The output of the VCO is fmax, the third frequency.", "Switch a closes, allowing Efmax to change the Efc voltage. The output of the VCO is fmax, the third frequency."], "jumps": ["P13210", "P13160"]}, {"id": "P13190", "text": ["Switch b opens, Efmin does not effect the Efc voltage."], "jumps": ["P13200", "P13160"]}, {"id": "P13180", "text": ["Switch d outputs +10 volts to switch a CONTROL input and switch c outputs 0 volts to switch b (R3 drops the +10 volts)."], "jumps": ["P13190", "P13160"]}, {"id": "P13170", "text": ["Switch c closing places a ground in the S1, R3, switch c circuit."], "jumps": ["P13180", "P13160"]}, {"id": "P13165", "text": [], "jumps": []}, {"id": "P13160", "text": ["With a HIGH input from IC1, both switches c and d will close."], "jumps": ["P13170", "P13100", "P13165"]}, {"id": "P13150", "text": ["The 0 volt output of switch d keeps switch a open.  The Efmax voltage does not effect the Efc voltage.  The output voltage produces fmin in VCO.", "The 0 volt output of switch d keeps switch a open. The Efmax voltage does not effect the Efc voltage. The output voltage produces fmin in VCO."], "jumps": ["P13160", "P13100"]}, {"id": "P13140", "text": ["Switch b closes and allows Efmin to change to Efc voltage.", "Switch b closes and allows Efmin to change to Efc voltage.q"], "jumps": ["P13150", "P13100"]}, {"id": "P13130", "text": ["With switch c open, the +10 volts is routed to the control input of switch b."], "jumps": ["P13140", "P13100"]}, {"id": "P13120", "text": ["With a LOW data input, the CONTROL inputs to switches c and d are zero.  Switches c and d are open.", "With a LOW data input, the CONTROL inputs to switches c and d are zero. Switches c and d are open."], "jumps": ["P13130", "P13100"]}, {"id": "P13110", "text": ["The digital data input through the op amp, IC1, changes the voltage to the VCO."], "jumps": ["P13120", "P13100"]}, {"id": "P13105", "text": [], "jumps": []}, {"id": "P13100", "text": ["Now, when S1 is in the CONTINUOUS position, information is transmitted.  The +10 volts from S1 is routed to the INPUT pins of switches c and d.", "Now, when S1 is in the CONTINUOUS position, information is transmitted. The +10 volts from S1 is routed to the INPUT pins of switches c and d."], "jumps": ["P13110", "P13050", "P13105"]}, {"id": "P13090", "text": ["Only Efc reaches the VCO.  This produces a frequency of fc, as it should be with no information signal applied (S1 in CONTROL position).", "Only Efc reaches the VCO. This produces a frequency of fc, as it should be with no information signal applied (S1 in CONTROL position)."], "jumps": ["P13100", "P13050"]}, {"id": "P13080", "text": ["With zero volts on the CONTROL inputs, switches a and b are open.  Efmax and Efmin are NOT routed to the VCO.", "With zero volts on the CONTROL inputs, switches a and b are open. Efmax and Efmin are NOT routed to the VCO."], "jumps": ["P13090", "P13050"]}, {"id": "P13070", "text": ["In this state, the voltages applied to switches a and b CONTROL inputs are 0 no matter if switches c and d are opened or closed, the DATA IN is disabled."], "jumps": ["P13080", "P13050"]}, {"id": "P13060", "text": ["When S1 is in the CONTROL position, no information is to be transmitted, 0 volts is applied to the INPUT pins of switches c and d."], "jumps": ["P13070", "P13050"]}, {"id": "P13055", "text": [], "jumps": []}, {"id": "P13050", "text": ["The switching circuit consists of four switches (a, b, c and d in IC2) as shown in the simplified schematic."], "jumps": ["P13060", "P13020", "P13055"]}, {"id": "P13040", "text": ["The transmitter circuit is contained on PC130-328 and consists of the components necessary to support the MC14066 analog gate and ICL8038 VCO chips."], "jumps": ["P13050", "P13020"]}, {"id": "P13020", "text": ["In this experiment, you will observe the operation and measure signals in a typical FSK transmitter circuit."], "jumps": ["P13040", "P1001"]}, {"id": "P2910", "text": ["This completes the experiment on FSK RECEIVER CIRCUITS.", "This completes the experiment on FSK RECEIVER CIRCUITS....."], "jumps": ["P2780"]}, {"id": "P2780", "text": ["4.  Disconnect all test equipment.   \n5.  Carefully remove experiment card.    \n6.  Return all equipment to designated storage areas.", "4. Disconnect all test equipment. 5. Carefully remove experiment card. 6. Return all equipment to designated storage areas."], "jumps": ["P2910", "P2770"]}, {"id": "P2770", "text": ["3.  Set the Console Power Switch to OFF.", "3. Set the Console Power Switch to OFF...................."], "jumps": ["P2760"]}, {"id": "P2760", "text": ["1.  Disconnect the oscilloscope and function generator from the        circuit and test console. \n2.  Return the Test Console to the initial control settings.", "1. Disconnect the oscilloscope and function generator from the circuit and test console. 2. Return the Test Console to the initial control settings."], "jumps": ["P2750"]}, {"id": "P2750", "text": ["You have aligned and measured signals in the FSK demodulator circuit.  The circuit takes a FSK FM modulated signal and demodulates it to HIGHs and LOW.  The type of signals on the test points will be important when troubleshooting the circuit.", "You have aligned and measured signals in the FSK demodulator circuit. The circuit takes a FSK FM modulated signal and demodulates it to HIGHs and LOW. The type of signals on the test points will be important when troubleshooting the circuit."], "jumps": ["P2760", "P2720"]}, {"id": "P2740", "text": ["f.  TP6 - Digital output of demodulator.    \ng. TP7 - Reference frequency, fc, for fc detector PLL chip.\nh. TP8 - Output of VCO and input to phase comparator in the PLL      circuit for the FM demodulator.", "f. TP6 - Digital output of demodulator. g. TP7 - Reference frequency, fc, for fc detector PLL chip. h. TP8 - Output of VCO and input to phase comparator in the PLL circuit for the FM demodulator."], "jumps": ["P2750", "P2720"]}, {"id": "P2730", "text": ["c. TP3 - Reference output of FM demodulator chip to the op amp amplifier. d. TP4 - Output of fc detector circuit. HIGH when fmin and fmax are transmitted, S1 on PC130-328 set to CONTINUOUS. LOW when fc is transmitted, S1 on PC130-328 set to CONTROL. e. TP5 - +10 volts to circuits.", "5. Measure the signals on the following test points using the CH2 probe of the oscilloscope (change oscilloscope settings as required): a. TP1 - Input to demodulator, FSK signal (FM signal). b. TP2 - Information output of FM demodulator chip (filtering not complete) to the op amp amplifier.", "Frequency Shift Keying (FSK) Demodulator"], "jumps": ["P2740", "P2720", "P2730", "P2710"]}, {"id": "P2710", "text": ["4.  Return the output amplitude of the function generator to 10            Vpp.  Now that you know the system is operating correctly,            let's measure the signals in the demodulator circuit.", "4. Return the output amplitude of the function generator to 10 Vpp. Now that you know the system is operating correctly, let's measure the signals in the demodulator circuit."], "jumps": ["P2720", "P2700"]}, {"id": "P2700", "text": ["Remember, amplitude variations do not effect a FSK system unless the system can not recognize a HIGH from a LOW."], "jumps": ["P2710", "P2690"]}, {"id": "P2690", "text": ["2.  Return the frequency output of the function generator to\n     100 Hz.  \n3.  Increase and decrease the output amplitude of the function            generator.  Observe that the output signal remains the same          until the input amplitude drops below a certain level.", "2. Return the frequency output of the function generator to 100 Hz. 3. Increase and decrease the output amplitude of the function generator. Observe that the output signal remains the same until the input amplitude drops below a certain level........."], "jumps": ["P2700", "P2680"]}, {"id": "P2680", "text": ["Remember that fc is 1500 Hz and should be five times greater than the highest input frequency.  This puts the frequency limit of the digital information signal to around 300 Hz.  Digital information signals above 300 Hz causes the system to operate incorrectly.", "Remember that fc is 1500 Hz and should be five times greater than the highest input frequency. This puts the frequency limit of the digital information signal to around 300 Hz. Digital information signals above 300 Hz causes the system to operate incorrectly."], "jumps": ["P2690", "P2670"]}, {"id": "P2670", "text": ["1.  Increase and decrease the frequency output of the function           generator.  Observe that the output signal follows the inputs          signal except for frequencies above 300 Hz.", "1. Increase and decrease the frequency output of the function generator. Observe that the output signal follows the inputs signal except for frequencies above 300 Hz."], "jumps": ["P2680", "P2660"]}, {"id": "P2660", "text": ["Now, let's observe the operation of the system.  Keep the oscilloscope connected to the input of the modulator and output of the demodulator.", "Now, let's observe the operation of the system. Keep the oscilloscope connected to the input of the modulator and output of the demodulator."], "jumps": ["P2670", "P2650"]}, {"id": "P2650", "text": ["The FSK modulator is now aligned.  The digital input to PC130-328 is changed to an analog FSK FM modulated signal and sent to the demodulator.  The demodulator changed the FSK signal back into a digital output.", "The FSK modulator is now aligned. The digital input to PC130-328 is changed to an analog FSK FM modulated signal and sent to the demodulator. The demodulator changed the FSK signal back into a digital output."], "jumps": ["P2660", "P2590"]}, {"id": "P2590", "text": ["The LED on PC130-329 should be completely extinguished.  The FSK signal received by the demodulator contains fmin and fmax, fc is not in the FSK signal.", "The LED on PC130-329 should be completely extinguished. The FSK signal received by the demodulator contains fmin and fmax, fc is not in the FSK signal."], "jumps": ["P2650", "P2580"]}, {"id": "P2583", "text": ["With S1 on PC130-328 set to CONTINUOUS, the modulator card takes the digital input and uses it to frequency modulate the FSK signal.  The carrier signal, fc, is not transmitted.", "With S1 on PC130-328 set to CONTINUOUS, the modulator card takes the digital input and uses it to frequency modulate the FSK signal. The carrier signal, fc, is not transmitted."], "jumps": []}, {"id": "P2582", "text": ["With S1 on PC130-328 set to CONTINUOUS, the modulator card takes the digital input and uses it to frequency modulate the FSK signal.  fc is not transmitted.", "With S1 on PC130-328 set to CONTINUOUS, the modulator card takes the digital input and uses it to frequency modulate the FSK signal. fc is not transmitted.-"], "jumps": []}, {"id": "P2581", "text": [], "jumps": []}, {"id": "P2580", "text": ["With S1 on PC130-328 set to CONTINUOUS, data is transmitted, what type of FSK signal is received by PC130-329?", "6.  Place PC130-328 S1 to CONTINUOUS and observe the LED           on PC130-329. \n7.  Ensure that the function generator is ON and out putting a \n     100  Hz, 10 Vpp square wave signal.", "5.  Set S1 to the continuous position.  This applies the data                  signal to the modulator.  The LED on PC130-329 should                   extinguish.  This is because the carrier frequency will no                 longer be present on the output of the modulator.", "6. Place PC130-328 S1 to CONTINUOUS and observe the LED on PC130-329. 7. Ensure that the function generator is ON and out putting a 100 Hz, 10 Vpp square wave signal.", "! ! !! !! !! !! !! ! !! !! ! ! ! !! !! ! !! !! !! ! ! !! ! ! ! ! ! !!! !!!! ! !!! r", "5. Set S1 to the continuous position. This applies the data signal to the modulator. The LED on PC130-329 should extinguish. This is because the carrier frequency will no longer be present on the output of the modulator.", "Frequency Shift Keying (FSK) Demodulator"], "jumps": ["P2570", "P2580", "P2560", "P2550"]}, {"id": "P2550", "text": ["4.  Connect a frequency counter to PC130-329 TP7.  Verify that           the signal on TP7 is 1500 Hz 100 Hz.  This signal is being                generated by the demodulator circuit to detect the presence of      the carrier signal.", "3.  Adjust PC130-329 Carrier Adjust potentiometer (R16) until the        green LED illuminates.  Move in small increments because it          lights quickly and only in one location.", "4. Connect a frequency counter to PC130-329 TP7. Verify that the signal on TP7 is 1500 Hz 100 Hz. This signal is being generated by the demodulator circuit to detect the presence of the carrier signal.", "3. Adjust PC130-329 Carrier Adjust potentiometer (R16) until the green LED illuminates. Move in small increments because it lights quickly and only in one location.", "Frequency Shift Keying (FSK) Demodulator"], "jumps": ["P2560", "P2540", "P2550", "P2530"]}, {"id": "P2530", "text": ["2.  Set PC130-328 S1 to control, this transmits the carrier signal           to the demodulator.", "2. Set PC130-328 S1 to control, this transmits the carrier signal to the demodulator.."], "jumps": ["P2540", "P2520"]}, {"id": "P2523", "text": ["With S1 on PC130-328 set to the CONTROL position, no data is transmitted.  The FSK signal will be fmax.", "With S1 on PC130-328 set to the CONTROL position, no data is transmitted. The FSK signal will be fmax."], "jumps": []}, {"id": "P2522", "text": ["With S1 on PC130-328 set to the CONTROL position, no data is transmitted.  The FSK signal will not be fmin.", "With S1 on PC130-328 set to the CONTROL position, no data is transmitted. The FSK signal will not be fmin."], "jumps": []}, {"id": "P2521", "text": [], "jumps": []}, {"id": "P2520", "text": ["What type of FM signal is transmitted in PC130-328 to PC130-329 with S1 set to CONTROL?"], "jumps": ["P2510"]}, {"id": "P2518", "text": ["The signal should be a constant 1500 Hz sine wave signal.  If not, there is a problem in your modulator, PC130-328, or in the test console.", "The signal should be a constant 1500 Hz sine wave signal. If not, there is a problem in your modulator, PC130-328, or in the test console.", "MEASUREMENT SETUP - Measure the frequency and waveform on PC130-329", "Frequency Shift Keying (FSK) Demodulator", "MEASUREMENT SETUP - Place PC130-328 S1 to the CONTROL position. Adjust PC130-328 R14."], "jumps": ["P2520", "P2510"]}, {"id": "P2510", "text": ["1.  Connect the oscilloscope to the IN test point.  Adjust the                 PC130-328 modulator output level R14 for a 1 Vpp modulated        signal at this test point.", "1. Connect the oscilloscope to the IN test point. Adjust the PC130-328 modulator output level R14 for a 1 Vpp modulated signal at this test point."], "jumps": ["P2518", "P2500", "P2515"]}, {"id": "P2500", "text": ["The FSK modulator is aligned and transmitting FSK data to the demodulator.  The demodulator, however, is not aligned yet. Let's align the FSK demodulator.", "The FSK modulator is aligned and transmitting FSK data to the demodulator. The demodulator, however, is not aligned yet. Let's align the FSK demodulator."], "jumps": ["P2510", "P2490"]}, {"id": "P2490", "text": ["5.  Place PC2 and PC3 DC Power switches to ON.", "5. Place PC2 and PC3 DC Power switches to ON. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2480"]}, {"id": "P2480", "text": ["4.  Set the Positive Supply Control to 15.  The Voltmeter on the           130A should indicate 15 Volts.", "3.  Set all potentiometers to their mid-position.", "4. Set the Positive Supply Control to 15. The Voltmeter on the 130A should indicate 15 Volts.", "3. Set all potentiometers to their mid-position...........", "Frequency Shift Keying (FSK) Demodulator"], "jumps": ["P2470", "P2480", "P2330"]}, {"id": "P2330", "text": ["2.  Carefully plug PC130-329 into the Test Console PC3 position.", "2. Carefully plug PC130-329 into the Test Console PC3 position."], "jumps": ["P2470", "P2320"]}, {"id": "P2320", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2310"]}, {"id": "P2310", "text": ["Let's start the experiment.", "Let's start the experiment.e...............................", "The FSK Transmitter circuit cards must be aligned as per the FSK Transmitter experiment before entering the FSK Receiver Experiment. If you have not aligned these circuit cards or are unsure whether they are aligned return to the Lesson Menu, select FSK Transmitter Operation and align the circuit cards.", "NOTE FSK Transmitter circuit cards must be aligned as per the FSK Transmitter experiment before entering the FSK Receiver Experiment. If you have not aligned these circuit cards or are unsure whether they are aligned return to the Lesson Menu, select FSK Transmitter Operation and align the circuit cards."], "jumps": ["P2320", "P2260"]}, {"id": "P2300", "text": ["Match up the other components on the card to the schematic."], "jumps": ["P2310", "P2260"]}, {"id": "P2290", "text": ["R16 is used to adjust the center frequency of the fc detector circuit."], "jumps": ["P2300", "P2260"]}, {"id": "P2280", "text": ["R6 is used to adjust the center frequency of the PLL FM demodulator circuit."], "jumps": ["P2290", "P2260"]}, {"id": "P2270", "text": ["R1 is the level adjust for the FSK input signal.", "Now, pick up the PC130-329 card and compare to the schematic."], "jumps": ["P2280", "P2260", "P"]}, {"id": "P2250", "text": ["Q1 has collector bias allowing the digital data out."], "jumps": ["P2260", "P2140"]}, {"id": "P2240", "text": ["The +10 volts is no longer dropped across the resistor placing the collector of Q1 to +10 volts."], "jumps": ["P2250", "P2140"]}, {"id": "P2230", "text": ["When the output of IC3 is HIGH, meaning fmin or fmax is received, DS1 is reverse biased and extinguishes."], "jumps": ["P2240", "P2140"]}, {"id": "P2220", "text": ["Q1 is turned off preventing digital data from the output of the circuit."], "jumps": ["P2230", "P2140"]}, {"id": "P2210", "text": ["The +10 volts is dropped across the resistor placing the collector of Q1 to 0 volts."], "jumps": ["P2220", "P2140"]}, {"id": "P2200", "text": ["When the output of IC3 is LOW, meaning fc is received, DS1 is forward biased and illuminates."], "jumps": ["P2210", "P2140"]}, {"id": "P2190", "text": ["The output on pin 8, LOW when fc is received and HIGH when fmin and fmax are received, is applied to the DS1 and D1 circuit."], "jumps": ["P2200", "P2140"]}, {"id": "P2180", "text": ["Pins 1 and 2 form a filter."], "jumps": ["P2190", "P2140"]}, {"id": "P2170", "text": ["Pins 5 and 6 set the center frequency.  R16 is adjustable for alignment to fc in the modulator circuit.", "Pins 5 and 6 set the center frequency. R16 is adjustable for alignment to fc in the modulator circuit."], "jumps": ["P2180", "P2140"]}, {"id": "P2160", "text": ["The FSK signal is applied to pin 3."], "jumps": ["P2170", "P2140"]}, {"id": "P2150", "text": ["Pin 4 is the power source and pin 7 is ground."], "jumps": ["P2160", "P2140"]}, {"id": "P2145", "text": ["-V Input Input VCO Output Comparator Input Reference Output Information Output", "Not Used Not Used Not Used Not Used +V C R"], "jumps": []}, {"id": "P2140", "text": ["The fc detector circuit consists of the NE567 chip as shown in the simplified schematic."], "jumps": ["P2150", "P2050", "P2145"]}, {"id": "P2130", "text": ["Q1 is a common emitter switch and only allows the digital data out when the input from the fc detector is HIGH, meaning data is being transmitted."], "jumps": ["P2140", "P2050"]}, {"id": "P2120", "text": ["The output of the amplifier is fed to Q1."], "jumps": ["P2130", "P2050"]}, {"id": "P2110", "text": ["The information output on pin 7 and the reference output on pin 6 are applied to an op amp amplifier, IC2."], "jumps": ["P2120", "P2050"]}, {"id": "P2100", "text": ["The capacitors and resistors connected to the demodulated output on pin 7 are a filter and used to ensure only HIGHs and LOWs are produced."], "jumps": ["P2110", "P2050"]}, {"id": "P2090", "text": ["Pins 6 and 7 are the outputs.  Pin 7 is the information output and pin 6 is the reference output.", "Pins 6 and 7 are the outputs. Pin 7 is the information output and pin 6 is the reference output."], "jumps": ["P2100", "P2050"]}, {"id": "P2080", "text": ["Pins 8 and 9 set up the center frequency of the FM demodulator, fc (R and C inputs).  R6 allows making adjustments.", "Pins 8 and 9 set up the center frequency of the FM demodulator, fc (R and C inputs). R6 allows making adjustments."], "jumps": ["P2090", "P2050"]}, {"id": "P2070", "text": ["The FSK signal is applied through R1, level control, to pins 2 and 3 of IC1.  FSK is also applied to the fc detector circuit.", "The FSK signal is applied through R1, level control, to pins 2 and 3 of IC1. FSK is also applied to the fc detector circuit."], "jumps": ["P2080", "P2050"]}, {"id": "P2060", "text": ["For the PLL demodulator, IC1, pin 10 is the power source and pin 1 is ground."], "jumps": ["P2070", "P2050"]}, {"id": "P2055", "text": ["-V Input Input VCO Output Comparator Input Reference Output Information Output", "Not Used Not Used Not Used Not Used +V C R"], "jumps": []}, {"id": "P2050", "text": ["The FM demodulator circuit consists of the NE565 PLL FM demodulator, filter, IC2 amplifier and Q1 switch as shown in the simplified schematic."], "jumps": ["P2060", "P2020", "P2055"]}, {"id": "P2040", "text": ["The receiver circuit is contained on PC130-329 and consists of the components necessary to support the NE565 and NE567 PLL chips."], "jumps": ["P2050", "P2020"]}, {"id": "P2020", "text": ["In this experiment, you will observe the operation and measure signals in a typical FSK receiver circuit."], "jumps": ["P2040", "P2001"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1910", "text": ["This completes the experiment on FSK TRANSMITTER CIRCUITS.", "This completes the experiment on FSK TRANSMITTER CIRCUITS...."], "jumps": ["P1770"]}, {"id": "P1770", "text": ["3.  Disconnect all test equipment.    \n4.  Carefully remove experiment card.    \n5.  Return all equipment to designated storage areas.", "3. Disconnect all test equipment. 4. Carefully remove experiment card. 5. Return all equipment to designated storage areas."], "jumps": ["P1910", "P1760"]}, {"id": "P1760", "text": ["2.  Set the Console Power Switch to OFF.", "2. Set the Console Power Switch to OFF...................."], "jumps": ["P1750"]}, {"id": "P1750", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": ["P1740"]}, {"id": "P1740", "text": ["You have aligned and measured signals in the FSK modulator circuit.  The circuit takes a digital information input and uses it to frequency modulate an analog signal.  The type of signals on the test points will be important when troubleshooting lesson.", "You have aligned and measured signals in the FSK modulator circuit. The circuit takes a digital information input and uses it to frequency modulate an analog signal. The type of signals on the test points will be important when troubleshooting lesson."], "jumps": ["P1750", "P1710"]}, {"id": "P1730", "text": ["TP5 - DC output voltage of switching circuit to VCO.\nTP6 - Analog output.", "TP5 - DC output voltage of switching circuit to VCO. TP6 - Analog output..."], "jumps": ["P1740", "P1710"]}, {"id": "P1720", "text": ["TP3 - Digital data input to switching circuit after op amp.  Vary                  R2, the signal is there, HIGH or LOW.  Place R2 to mid                       position.", "26.  Using the CH2 probe, measure the following test points.                 (Change oscilloscope controls as necessary):", "TP3 - Digital data input to switching circuit after op amp. Vary R2, the signal is there, HIGH or LOW. Place R2 to mid position.", "26. Using the CH2 probe, measure the following test points. (Change oscilloscope controls as necessary):"], "jumps": ["P1730", "P1710", "P1720", "P1700"]}, {"id": "P1700", "text": ["Notice that the modulator circuit follows the frequency of the input signal.  You may see at the higher input frequencies that the modulator circuit can not keep up.  This is due to the bandwidth of the system.", "Notice that the modulator circuit follows the frequency of the input signal. You may see at the higher input frequencies that the modulator circuit can not keep up. This is due to the bandwidth of the system."], "jumps": ["P1710", "P1680"]}, {"id": "P1690", "text": ["24.  Place PC130-328 S1 back to CONTINUOUS.   \n25.  Vary the frequency output of the function generator and                  observe the resultant FSK signal.", "23.  Place PC130-328 S1 to CONTROL.  Notice that the FSK                    signal is constant, fc.  With no information data transmitted,            fc is sent even though digital data is being applied to the                 circuit.", "24. Place PC130-328 S1 back to CONTINUOUS. 25. Vary the frequency output of the function generator and observe the resultant FSK signal.", "23. Place PC130-328 S1 to CONTROL. Notice that the FSK signal is constant, fc. With no information data transmitted, fc is sent even though digital data is being applied to the circuit. #"], "jumps": ["P1700", "P1680", "P1690", "P1670"]}, {"id": "P1670", "text": ["The FSK circuit is operating correctly for digital data inputs."], "jumps": ["P1680", "P1660"]}, {"id": "P1660", "text": ["Notice that when the CH1 digital trace is HIGH, the FSK frequency seen on CH2 is HIGH.  When the CH1 digital trace is LOW, the FSK frequency seen on CH2 is LOW.", "22.  Adjust R2, the input level adjust, until a distinct change can            be seen in the frequency during the high and low conditions.         Adjust the oscilloscope trigger hold off and level as                           necessary.", "Notice that when the CH1 digital trace is HIGH, the FSK frequency seen on CH2 is HIGH. When the CH1 digital trace is LOW, the FSK frequency seen on CH2 is LOW.", "22. Adjust R2, the input level adjust, until a distinct change can be seen in the frequency during the high and low conditions. Adjust the oscilloscope trigger hold off and level as necessary."], "jumps": ["P1670", "P1650", "P1660", "P1630"]}, {"id": "P1640", "text": ["21.  Set the oscilloscope trigger to EXT (external), connect CH1             to TP1 (input) and CH2 to TP6 (output).  Make sure the                      oscilloscope is set to dual, AC, 2 ms Time/Div setting.", "20.  Connect the SYNC OUT connector of your function                           generator to the TRIGGER IN connector of your                                  oscilloscope. This will make it easier to view the modulated            waveform.", "21. Set the oscilloscope trigger to EXT (external), connect CH1 to TP1 (input) and CH2 to TP6 (output). Make sure the oscilloscope is set to dual, AC, 2 ms Time/Div setting.", "20. Connect the SYNC OUT connector of your function generator to the TRIGGER IN connector of your oscilloscope. This will make it easier to view the modulated waveform."], "jumps": ["P1650", "P1630", "P1640", "P1620"]}, {"id": "P1625", "text": ["OSCILLOSCOPE - CH1 Volts/Div - 5, DC CH2 Volts/Div - 0.5, AC Triggering - CH1, AC, + Display - Dual"], "jumps": []}, {"id": "P1620", "text": ["19.  Connect the oscilloscope to TP1 data in of the modulator                card.  Be certain that the signal at this point is 100Hz 10 Vpp          squarewave.  If not, adjust the function generator until the               signal is correct.", "19. Connect the oscilloscope to TP1 data in of the modulator card. Be certain that the signal at this point is 100Hz 10 Vpp squarewave. If not, adjust the function generator until the signal is correct.", "a. CH1 Volts/Div - 5, DC b. CH2 Volts/Div - 0.5, AC c. Triggering - CH1, AC, + d. Display - Dual", "MEASUREMENT SETUP - Measurement the voltage on PC130-328 TP1."], "jumps": ["P1630", "P1610", "P1625"]}, {"id": "P1615", "text": ["BNC CONNECTION - Connect the Function Generator's main Output BNC to the Test Console's PC1 Output BNC."], "jumps": []}, {"id": "P1610", "text": ["17.  Set the function generator to a 100 Hz square wave, at  \n       10 Vpp using the oscilloscope. \n18.  Using a BNC-to-BNC connector, connect the output of the              function generator to the OUTPUT connector of PC1.  This             connects to the data in of the modulator circuitry.", "16.  Disconnect the alligator to alligator jumper from the circuit.", "17. Set the function generator to a 100 Hz square wave, at 10 Vpp using the oscilloscope. 18. Using a BNC-to-BNC connector, connect the output of the function generator to the OUTPUT connector of PC1. This connects to the data in of the modulator circuitry.", "16. Disconnect the alligator to alligator jumper from the circuit."], "jumps": ["P1620", "P1600", "P1615", "P1610", "P1590"]}, {"id": "P1590", "text": ["You have aligned the FSK modulator using constant inputs, a static alignment.  Now, let's look at the transmitter with dynamic inputs, that is, using the square wave output of the function generator.", "You have aligned the FSK modulator using constant inputs, a static alignment. Now, let's look at the transmitter with dynamic inputs, that is, using the square wave output of the function generator."], "jumps": ["P1600", "P1570"]}, {"id": "P1580", "text": ["Also note that small changes in the VCO's input voltage produce significant changes in the VCO's output frequency."], "jumps": ["P1590", "P1570"]}, {"id": "P1570", "text": ["Notice that the voltage to the VCO decreased and produced a higher frequency output.", "TP5(fc, 1500 Hz) = TP5(fmin, 1200 Hz) = TP5(fmax, 1800 Hz) ="], "jumps": ["P1580", "P1560"]}, {"id": "P1567", "text": ["You still have not measured the correct voltage.  You should have measured approximately 9.40 volts.", "You still have not measured the correct voltage. You should have measured approximately 9.40 volts.", "TEST LEAD PLACEMENT - Measure the voltage input on PC130-328 TP5."], "jumps": ["P1560"]}, {"id": "P1562", "text": ["You did not measure the correct voltage, ensure that the output frequency measured on TP6 is 1800 Hz."], "jumps": []}, {"id": "P1561", "text": [], "jumps": []}, {"id": "P1560", "text": ["15.  Using the multimeter, measure the DC voltage input to the              VCO on PC130-328 TP5 to two decimal places.  What is the             measured voltage on TP5?", "15. Using the multimeter, measure the DC voltage input to the VCO on PC130-328 TP5 to two decimal places. What is the measured voltage on TP5?"], "jumps": ["P1550", "P1565", "P1562"]}, {"id": "P1550", "text": ["You have set the output of the FSK modulator for 1800 Hz when a HIGH information signal is transmitted, fmax.", "14.  Using a frequency counter or an oscilloscope, set the                       frequency on TP6 to 1800 Hz (+/- 100 Hz) by adjusting the Hi          (R8) potentiometer.  Be as close as possible.", "14. Using a frequency counter or an oscilloscope, set the frequency on TP6 to 1800 Hz (+/- 100 Hz) by adjusting the Hi (R8) potentiometer. Be as close as possible."], "jumps": ["P1560", "P1540", "P1550", "P1530"]}, {"id": "P1533", "text": ["fc is generated when no information signal is applied.  With S1 set to CONTINUOUS and +V volts on TP1, the circuit transmits a frequency that represents a HIGH input.", "fc is generated when no information signal is applied. With S1 set to CONTINUOUS and +V volts on TP1, the circuit transmits a frequency that represents a HIGH input."], "jumps": []}, {"id": "P1532", "text": ["fmin is generated when LOW data is applied to the circuit.  With S1 set to CONTINUOUS and TP1 set to +V volts, a LOW is not applied to the circuit.", "fmin is generated when LOW data is applied to the circuit. With S1 set to CONTINUOUS and TP1 set to +V volts, a LOW is not applied to the circuit."], "jumps": []}, {"id": "P1531", "text": [], "jumps": []}, {"id": "P1530", "text": ["What frequency is generated in the FSK modulator when S1 is in the CONTINUOUS position and with a HIGH input?", "13.  Using the alligator to alligator jumper, connect TP1 to the +V           test point.  This ensures that a high condition is present on            the input.  This allows us to set the high frequency of the                 modulator.", "13. Using the alligator to alligator jumper, connect TP1 to the +V test point. This ensures that a high condition is present on the input. This allows us to set the high frequency of the modulator."], "jumps": ["P1460", "P1530", "P1510"]}, {"id": "P1510", "text": ["Notice that the voltage to the VCO increased and produced a lower frequency output.  The ICL8038 chip operates opposite from expected but, it still operates as a VCO!", "Notice that the voltage to the VCO increased and produced a lower frequency output. The ICL8038 chip operates opposite from expected but, it still operates as a VCO!", "TP5(fc, 1500 Hz) = TP5(fmin, 1200 Hz) ="], "jumps": ["P1520", "P1500"]}, {"id": "P1507", "text": ["You still have not measured the correct voltage.  You should have measured approximately 9.60 volts.", "You still have not measured the corr let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
