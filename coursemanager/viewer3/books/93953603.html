 the next trigger pulse.", "During the C10 charge process, note that at +.6V Q6 turns ON. The CH2 trace at TP23 should be slightly above the zero reference line at .6 VDC during the Q6 ON time. This action turns Q5 OFF until the next trigger pulse is received at the circuit input.."], "jumps": ["P13450", "P13430"]}, {"id": "P2080", "text": ["2. Carefully plug PC130-46 into the Test Console PC3 position."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["3.  Rotate R23 on PC130-46 fully CW (MAX).", "3. Rotate R23 on PC130-46 fully CW (MAX).External program = SCAN FCC 0 External program = SCAN PWR 0 123 the PC3 Speaker switch to ON........................................."], "jumps": ["P2080", "P2095"]}, {"id": "P2095", "text": ["MEASUREMENT SETUP -  Adjust R23 fully clockwise", "MEASUREMENT SETUP - Adjust R23 fully clockwise"], "jumps": []}, {"id": "P2100", "text": ["4.  Set the Voltmeter switch to Positive.\n     Set the Positive Supply Voltage to 12.\n     The Test Console's voltage meter should indicate 12 volts.", "4. Set the Voltmeter switch to Positive. Set the Positive Supply Voltage to 12. The Test Console's voltage meter should indicate 12 volts......................."], "jumps": ["P2090"]}, {"id": "P2110", "text": ["5.  Turn PC3 DC Power switch to ON.", "5. Turn PC3 DC Power switch to ON.ol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2100"]}, {"id": "P2120", "text": ["6.  Connect an oscilloscope to PC130-46 TP22 (output of Q5). Set      the oscilloscope coupling to DC.", "6. Connect an oscilloscope to PC130-46 TP22 (output of Q5). Set the oscilloscope coupling to DC.."], "jumps": ["P2130", "P2110", "P2125"]}, {"id": "P2125", "text": ["OSCILLOSCOPE LEAD PLACEMENT - Connect oscilloscope to PC130-46 TP22. Set Oscilloscope coupling to DC."], "jumps": []}, {"id": "P2130", "text": ["What is the state of Q5?", "What is the state of Q5? is typed.........................."], "jumps": ["P2120"]}, {"id": "P2131", "text": [], "jumps": []}, {"id": "P2132", "text": ["You should have measured +12 V. This means that Q5 is not ON. Check your oscilloscope setup and ensure you are measuring PC130-46 TP22."], "jumps": []}, {"id": "P13420", "text": ["6.  Connect the CH1 probe back to PC130-46 TP26.\n7.  Disconnect the CH2 probe and zero the trace.", "6. Connect the CH1 probe back to PC130-46 TP26. 7. Disconnect the CH2 probe and zero the trace."], "jumps": ["P13430", "P13400"]}, {"id": "P10004", "text": ["You should have measured a steady +12 V. Check your oscilloscope setup. It's not making a squarewave because the trigger pulse has not been applied.", "You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P2140", "text": ["7.  Connect oscilloscope to PC130-46 TP26 (output of Q6). Set             the oscilloscope coupling to DC.", "7. Connect oscilloscope to PC130-46 TP26 (output of Q6). Set the oscilloscope coupling to DC........"], "jumps": ["P2150", "P2130", "P2145"]}, {"id": "P2145", "text": ["OSCILLOSCOPE LEAD PLACEMENT - Connect oscilloscope to PC130-46 TP26. Set Oscilloscope coupling to DC."], "jumps": []}, {"id": "P2150", "text": ["What is the state of Q6?", "What is the state of Q6? is typed.........................."], "jumps": ["P2140"]}, {"id": "P2151", "text": [], "jumps": []}, {"id": "P2152", "text": ["You should have measured 0 V. This means that Q6 is not OFF. Check your oscilloscope setup and ensure you are measuring PC130-46 TP26."], "jumps": []}, {"id": "P2153", "text": ["You should have measured a steady +0 V. Check your oscilloscope setup. It's not making a square wave because the trigger pulse has not been applied."], "jumps": []}, {"id": "P2160", "text": ["The stable state of this monostable multivibrator is Q5 OFF, Q6 ON.  Now, let's check for normal operation.", "The stable state of this monostable multivibrator is Q5 OFF, Q6 ON. Now, let's check for normal operation."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["1. let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
