is the third type of DC motor under investigation."], "jumps": ["P410", "P300", "P420", "P400"]}, {"id": "P420", "text": ["You will verify the characteristics of the DC compound motor by performing an experiment."], "jumps": ["P410", "P430"]}, {"id": "P430", "text": ["Let's begin the lesson on DC COMPOUND MOTORS.............................."], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["A DC Compound motor consists of a Shunt Field coil and a Series Field coil."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["The combination of the Series and Shunt field coils provides the magnetic field for the armature."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The compound motor represents a compromise between the characteristics of Series and Shunt motors."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["The Series motor exhibits a higher starting torque than the Shunt motor."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["On the other hand, the Shunt motor exhibits higher torque at higher RPM."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["The Compound Motor's start and run torque is between the high and low torque of the Series and Shunt Motors.", "Start Low RPM Moderate Torque", "Run High RPM Moderate Torque"], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["The Compound Motor has lower starting torque but higher running torque than the Series Motor."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["The Compound Motor has higher starting and lower running torque than the Shunt Motor."], "jumps": ["P1120", "P1070"]}, {"id": "P1120", "text": ["The best way to visualize the compromise is to examine the formula for output power.", "Power out = RPM x Torque x (0.1047) = Ft"], "jumps": ["P1130", "P1070"]}, {"id": "P1130", "text": ["A Compound motor's torque and RPM make its power output characteristic more constant."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["The basic characteristics of the Compound DC motor remain the same."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["A Compound Motor incorporates the characteristics of _______"], "jumps": ["P1120"]}, {"id": "P1151", "text": [], "jumps": []}, {"id": "P1152", "text": ["The Compound motor incorporates the characteristics of both the Series and Shunt motors.", "Start Low RPM Moderate Torque", "Run High RPM Moderate Torque"], "jumps": []}, {"id": "P1160", "text": ["The Compound motors starting torque is _______............."], "jumps": ["P1150"]}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1162", "text": ["The Compound Motor has less running torque than a Shunt motor. Compound Motor Shunt Motor Start Low RPM Moderate Torque Start Low RPM Low Torque Run High RPM Moderate RPM Run High RPM High Torque"], "jumps": []}, {"id": "P1170", "text": ["The Compound motor incorporates simultaneous Shunt and Series field connections."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["There are two possible ways to configure a DC Compound motor."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["The Long Shunt Compound motor has the shunt coil connected across the series coil and armature."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["In this type of Compound motor, the Armature Current (I ) and the Series Field current (I ) are the same."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["The shunt coil voltage is the same as the sum of the armature voltage and the series coil voltage, or the applied voltage."], "jumps": ["P1220", "P1190"]}, {"id": "P1220", "text": ["The Short Shunt Compound motor has a coil in series with the Armature (series coil) and a coil connected in parallel with the armature only (Shunt coil)."], "jumps": ["P1230", "P1190"]}, {"id": "P1230", "text": ["In this type of Compound motor, the Series Coil Current (I ) is the sum of the Shunt Coil Current (I ) and the Armature Current (I )."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["The shunt coil voltage (V ) is the same as the armature coil voltage (V )."], "jumps": ["P1250", "P1220"]}, {"id": "P1250", "text": ["As with all DC motors, locked rotor torque is the product of the armature current, field current and the constant."], "jumps": ["P1260", "P1220"]}, {"id": "P1260", "text": ["In a Compound motor, I is a function of both the Series (SER) and Shunt (SH) fields."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["Because a Compound motor utilizes both field coils, each coil contributes to flux generation in the armature."], "jumps": ["P1310", "P1260"]}, {"id": "P1280", "text": ["Maximum motor performance occurs when the coil fields are additive."], "jumps": ["P1290", "P1430"]}, {"id": "P1290", "text": ["Additive fields are similar to two magnets aligned in a N-N or S-S position. A magnetic field is developed around the magnetic pair."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["Subtractive fields are similar to two magnets aligned in a N-S position. A magnetic field is developed between the magnets."], "jumps": ["P1440", "P1280"]}, {"id": "P1310", "text": ["Which formula best describes how torque is calculated in a Compound Field motor?"], "jumps": ["P1260"]}, {"id": "P1311", "text": [], "jumps": []}, {"id": "P1312", "text": ["I x I x K is used to calculate torque of Series and Shunt motors. A Compound motor uses Series and Shunt field coils. They must be accounted for when solving for torque."], "jumps": []}, {"id": "P1313", "text": ["I x I x K does not take into consideration the series field."], "jumps": []}, {"id": "P1320", "text": ["Circuit analysis of the DC Shunt motor is no more complicated than the Shunt or Series motor."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["Let's look at the locked rotor conditions:", "The circuit values are as shown. lect a circuit to see calculations."], "jumps": ["P1340", "P1320 2222 = I3 = I3 - I2- I2I3 - I2", "Multiply Equation #1 by 21 21 (5I1 + 25I2) = 21 (15) 105I1 + 525I2 = 315 (Eq #5) I2- I222222222222222222222222222222222222 = I3 = I3 - I22222 I22222222222222222222222222222222222222 = I3 = I3 - I2- I2I3 - I2", "Substitute Equation #3 into Equation #2 5I1 + 100( I1 - I2) = 25 5I1 + 100I1 - 100I2 = 25 105I1 - 100I2 = 25 (Eq #5)on2222222 = I3 = I3 - I22222 I22222222222222222222222222222222222222 = I3 = I3 - I2- I2I3 - I2", "Subtract Equation #4 from Equation #5 105I1 + 525I2 = 315 (Eq #5) - 105I1 + 100I2 = -(25) (Eq #4) fI1 + 625I2 = 290 (Eq #6)5)22 = I3 = I3 - I22222 I22222222222222222222222222222222222222 = I3 = I3 - I2- I2I3 - I2"], "jumps": ["P1408", "P1406"]}, {"id": "P1408", "text": ["Solve for I2 in Equation #6 625I2 = 290V I2 = .464 (Eq. #7)- I2 = I3 - I2- I222222222222222222222222222222222222 = I3 = I3 - I22222 I22222222222222222222222222222222222222 = I3 = I3 - I2- I2I3 - I2", "Substitute Equation #7 into Eq. #1 625I1 + 25 (.464) = 15 5I1 + 11.6 = 15 5I1 = 3.4 = 1522222222222222222222222222222222222 = I3 = I3 - I22222 I22222222222222222222222222222222222222 = I3 = I3 - I2- I2I3 - I2", "Substitute Equation #7 and Equation #8 into Eq. #3 I3 + .68 - .464 I3 = .216 I3 = I3 - I22222 I22222222222222222222222222222222222222 = I3 = I3 - I2- I2I3 - I2"], "jumps": ["P1409", "P1407"]}, {"id": "P1409", "text": ["Therefore: I1 or I = .68A I2 or I = .464A I3 or I = .216A So: E = I x R = .68 x 5 = 3.4V E = I x R = .464 x 25 = 11.6V E = I x R = .216 x 100 = 21.6V And to show what values are correct: E + CEMF = E , 11.6 + 10 = 21.6 21.6 = 21.6", "Again, since DC power is applied, the inductive reactance is zero."], "jumps": ["P1400", "P1408", "P1420"]}, {"id": "P1420", "text": ["Notice that torque is about the same in both the Long and Short Shunt motors."], "jumps": ["P1430", "P1400"]}, {"id": "P1430", "text": ["Last, let's look at phasing between Shunt and Series Field coils."], "jumps": ["P1280", "P1400"]}, {"id": "P1440", "text": ["If the field coils are connected as subtractive, the motor will exhibit poor torque output and may fail to start."], "jumps": ["P1450", "P1300"]}, {"id": "P1450", "text": ["In a Compound DC motor, if the load increases, what happens to armature current?"], "jumps": ["P1300"]}, {"id": "P1451", "text": [], "jumps": []}, {"id": "P1452", "text": ["If the load increases, RPM decreases. This decreases CEMF which causes more voltage to be felt over the armature. This is why armature current does not decrease."], "jumps": []}, {"id": "P1453", "text": ["If the load increases, RPM decreases. This decreases CEMF which causes more voltage to be felt over the armature. This is why armature current does not stay the same."], "jumps": []}, {"id": "P1460", "text": ["What would occur if a DC Compound motor has the Series & Shunt Fields connected in a subtractive manner?"], "jumps": ["P1450"]}, {"id": "P1461", "text": [], "jumps": []}, {"id": "P1462", "text": ["Connecting the fields subtractive is not configuring the motor in the most effective manner. You would see a difference in motor performance."], "jumps": []}, {"id": "P1463", "text": ["Subtractive fields will reduce the magnetic field that the armature is in. The motor would not run faster."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on THEORY OF OPERATION......"], "jumps": ["P1001", "P1460"]}, {"id": "P1920", "text": ["1. A Compound motor has many of the characteristics of a Series and Shunt motor. C Compound Motor Series Shunt"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. A Compound motor has a higher starting torque than a Shunt motor but a lower starting torque than a Series motor. Motor Start Low RPM Moderate Torque Run High RPM Moderate Torque Series Motor Shunt Motor Start Low RPM High Torque Start Low RPM Low Torque", "Start Low RPM Moderate Torque", "Run High RPM Moderate Torque"], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["3. There are two types of DC Compound motors. Compound Motor Configuration Long Short Shunt Shunt"], "jumps": ["P1960", "P1930"]}, {"id": "P1960", "text": ["4. The Short Shunt Compound motor has the shunt coil in parallel to the armature only. Ish IA"], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["5. The Long Shunt Compound motor has the shunt coil placed across the series coil and armature. t + Iser VT Ish A"], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["6. Maximum Compound motor performance is achieved with the field coils connected additively."], "jumps": ["P1999", "P1970"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["In this experiment, you will configure the 280 Rotating Machinery Trainer as a DC Compound motor."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["You will first verify compound motor characteristics by measuring and calculating currents I , I and I ."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["You will also compare the results to the Shunt and Series DC motor characteristics."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["Finally, you will observe the effects of aiding and opposing fields in a Compound DC motor."], "jumps": ["P2060", "P2020"]}, {"id": "P2060", "text": ["1. Set the Test Console controls to their initial control settings........"], "jumps": ["P2020"]}, {"id": "P2070", "text": ["2. Set the 280 trainer to it's initial control settings..."], "jumps": ["P2080", "P22000"]}, {"id": "P2080", "text": ["3. Insert PC130-280 into the PC3 position on the 130 Test Console.PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2070", "P2090"]}, {"id": "PINFO", "text": ["02-15-01 Converted from SAM to tbk. frieda 02-20-01 Text and Branching. frieda 02-20-01 Graphics Jeff Hatcher 06-13-01 Corrections. Alexis 07-19- let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
