f available a frequency counter to PC130-83 TP6.."], "jumps": ["P13670", "P13630", "P13665", "PTP", "P"]}, {"id": "P13660", "text": ["1. Connect an oscilloscope and if available a frequency counter to PC130-83 TP6..."], "jumps": ["P13665", "P13630", "P13670"]}, {"id": "P13650", "text": ["Test points 7 and 8 have been added to the circuit for troubleshooting purposes."], "jumps": ["P13630", "P13660"]}, {"id": "P13640", "text": ["Notice that TP7, TP8 and TP9 are the same point.", "The last signals to measure are the ones in the R3, L1, C1, I3, and R4 circuit.."], "jumps": ["P13630", "P13650"]}, {"id": "P13620", "text": ["TP5 is an AC voltage, which is the same as PC130-82 TP7, and using an oscilloscope is probably the best test instrument to use."], "jumps": ["P13592", "P13630"]}, {"id": "P13610", "text": ["TP4 is a DC voltage, which is the same as PC130-82 TP5, and using a multimeter is probably the best test instrument."], "jumps": ["P13592", "P13620"]}, {"id": "P13600", "text": ["TP4 and TP5 are the two inputs to the upper contacts of K1."], "jumps": ["P13592", "P13610"]}, {"id": "P13595", "text": ["MEASUREMENT SETUP - Using the multimeter measure the voltage at TP4 and TP5..", "9. Measure the voltage at PC130-83 TPs 4 and 5. Use the correct test instrument for the signal present on TPs 4 and 5."], "jumps": ["P13600", "P13580", "P13595", "PTP", "P"]}, {"id": "P13590", "text": ["9. Measure the voltage at PC130-83 TPs 4 and 5. Use the correct test instrument for the signal present on TPs 4 and 5. d 5."], "jumps": ["P13595", "P13580", "P13600"]}, {"id": "P13585", "text": ["MEASUREMENT SETUP - Using the multimeter measure the voltage at TP3..", "8. Measure the voltage at PC130-83 TP3. This is the voltage to I2 and is only present when K1 is de-energized..", "You should have noticed that there is 0 V on TP2 when K1 is de-energized and a DC value on TP2 when K1 is energized. The voltage level is determined by the setting of PC130-82 R4."], "jumps": ["P13590", "P13570", "P13585", "P13550", "P13580"]}, {"id": "P13560", "text": ["7. Press and release PC130-83 S1, then press and release S2 several times and observe the voltage measurement."], "jumps": ["P13550", "P13570"]}, {"id": "P13555", "text": ["MEASUREMENT SETUP - Using the multimeter measure the voltage at TP2..", "6. Measure the voltage at PC130-83 TP2. This is the voltage after S1 that is applied to K1's magnetic coil."], "jumps": ["P13560", "P13540", "P13555", "PTP", "P"]}, {"id": "P13540", "text": ["4. Adjust PC130-82 R4 fully CW. 5. Energize and de-energize K1 to ensure it is operating correctly. Leave it in the de-energized state.."], "jumps": ["P13530", "P13550"]}, {"id": "P13532", "text": ["R4 controls the amount of voltage applied to K1's magnetic coil, even when energized by the latching voltage. If the voltage is reduced to far K1 will de-energize.."], "jumps": []}, {"id": "P13531", "text": ["Did the relay stay energized?yped.........................."], "jumps": ["P13510"]}, {"id": "P13520", "text": ["2. Press and release S1 on PC130-83. 3. Rotate PC130-82 R4 CCW.............."], "jumps": ["P13510", "P13530"]}, {"id": "P13515", "text": ["MEASUREMENT SETUP - Using the multimeter measure the voltage at TP1..", "1. Measure the voltage at PC130-83 TP1. This is the energizing voltage to K1.."], "jumps": ["P13520", "P13472", "P13515", "PTP", "P"]}, {"id": "P13500", "text": ["You have measured the voltages at all the test points on PC130-82. Now let's measure the voltages on PC130-83.."], "jumps": ["P13472", "P13510"]}, {"id": "P13490", "text": ["8. Vary PC130-82 R6 and observe the results. This is the AC voltage applied to the upper normally closed contacts of K1."], "jumps": ["P13472", "P13500"]}, {"id": "P13480", "text": ["You should have measured an AC voltage. The level depends on the setting of R6."], "jumps": ["P13472", "P13490"]}, {"id": "P13475", "text": ["MEASUREMENT SETUP - Using the multimeter measure the voltage at TP7..", "7. Measure the voltage at PC130-82 TP7...................."], "jumps": ["P13480", "P13450", "P13475", "PTP", "P"]}, {"id": "P13470", "text": ["7. Measure the voltage at PC130-82 TP7."], "jumps": ["P13475", "P13450", "P13480"]}, {"id": "P13460", "text": ["You should have measured approximately 13 VDC. This is the voltage that is sent to the upper normally open contacts of K1."], "jumps": ["P13450", "P13470"]}, {"id": "P13455", "text": ["MEASUREMENT SETUP - Using the multimeter measure the voltage at TP5..", "6. Using a multimeter measure the voltage at PC130-82 TP5.."], "jumps": ["P13460", "P13440", "P13455", "PTP", "P"]}, {"id": "P13442", "text": ["Recall that filtering changes the pulsating DC into pure DC. You should have measured approximately 17 VDC and 0.1 VAC at TP6."], "jumps": []}, {"id": "P13441", "text": [], "jumps": []}, {"id": "P13440", "text": ["The DC voltage is lower and the ripple voltage is higher.", "What is the relationship between the voltages at TP4 and TP6?"], "jumps": ["P13422"]}, {"id": "P13430", "text": ["This voltage is the filtered pulsating DC from TP4."], "jumps": ["P13422", "P13440"]}, {"id": "P13425", "text": ["MEASUREMENT SETUP - Using the oscilloscope measure the DC and AC voltage at TP6..", "5. Using the oscilloscope measure the DC and AC voltage at PC130-82 TP6.."], "jumps": ["P13430", "P13390", "P13425", "PTP", "P"]}, {"id": "P13420", "text": ["5. Using the oscilloscope measure the DC and AC voltage at PC130-82 TP6.."], "jumps": ["P13425", "P13390", "P13430"]}, {"id": "P13410", "text": ["The oscilloscope was used to show the AC ripple voltage as most multimeters cannot measure 0.28 VAC accurately.t measure 0.28 VAC accurately..", "4. Set the oscilloscope to measure AC at PC130-82 TP4. This will measure the ripple voltage. You should measure approximately 0.28 volts..pproximately .28 volts.lts."], "jumps": ["P13390", "P13420", "P13400", "P13380"]}, {"id": "P13383", "text": ["You should have measured bewtween 18 and 26 VDC (22 VDC ideally) at TP4. Ensure that you are reading the test equipment correctly."], "jumps": ["P13390", "P13380"]}, {"id": "P13382", "text": ["Ensure that the multimeter is set to measure DC voltages and that you are measuring TP4.4."], "jumps": []}, {"id": "P13381", "text": ["What is the measured voltage at TP4?ion with 3 tries...................) in a variable.able.le."], "jumps": ["P13370", "P13382"]}, {"id": "P13375", "text": ["MEASUREMENT SETUP - Using an oscilloscope measure the voltage at TP4. Set the oscilloscope to measure DC..", "3. Using a multimeter measure the DC voltage at TP4. oscilloscope to measure DC...", "Also note that the secondary voltage is approximately 50 Vpp at TP2 and TP3. T1 is a step-up transformer."], "jumps": ["P13380", "P13360", "P13375", "P13370", "P13350"]}, {"id": "P13352", "text": ["Ensure that you are using the oscilloscope correctly in the dual trace mode. Compare the phase between CH1 and CH2. If CH1 + peak occurs at the same time as CH2 - peak, then the signals are 180"], "jumps": []}, {"id": "P13351", "text": ["Are the signals at TP2 and TP3 180 degrees out of phase?..."], "jumps": ["P13340"]}, {"id": "P13345", "text": ["MEASUREMENT SETUP - Measure the voltages at TP2 and TP3 using oscilloscope in dual trace mode. NOTE: Use a 10 to 1 probe.", "2. Using an oscilloscope in the dual trace mode measure the voltages at TP2 and TP3. NOTE: Use a 10 to 1 probe.", "You should have measured approximately 40 Vpp using the oscilloscope or 14 VAC using a multimeter."], "jumps": ["P13350", "P13330", "P13345", "P13320", "P13340"]}, {"id": "P13325", "text": ["MEASUREMENT SETUP - Measure the signal at TP1. NOTE: Since it is an AC signal, use a multimeter or an oscilloscope.", "1. Measure the signal at PC130-82 TP1. Since it is an AC signal, use a multimeter set to AC volts or an oscilloscope..."], "jumps": ["P13330", "P13270", "P13325", "PTP", "P"]}, {"id": "P13310", "text": ["But, you will not stop here. To fully learn circuit operation let's trace the signals through the entire circuit."], "jumps": ["P13270", "P13320"]}, {"id": "P13300", "text": ["Comparing the outputs of the circuit using the schematic to the measured outputs demonstrated that the circuit is operating correctly."], "jumps": ["P13270", "P13310"]}, {"id": "P13290", "text": ["There is no need to measure the AC input. The outputs were correct, the inputs must be correct."], "jumps": ["P13300", "P13270"]}, {"id": "P13280", "text": ["Notice that you did not measure the input 60 Hz or any voltages in PC130-82.", "At this point, you should have determined that the circuit is operating correctly."], "jumps": ["P13270", "P13290", "P13280", "P13260"]}, {"id": "P13263", "text": ["You still did not measure the correct frequency. You should have measured between 25.4 and 38.2 kHz. The calculated resonant frequency is 31.8 kHz."], "jumps": ["P13260", "P13270"]}, {"id": "P13262", "text": ["20% of the calculated resonant frequency for your measurement. Check that you are using your test equipment correctly."], "jumps": []}, {"id": "P13261", "text": [], "jumps": []}, {"id": "P13260", "text": ["What is the frequency that illuminates L3 the brightest?...............) in a variable.able.le."], "jumps": ["P13250", "P13262"]}, {"id": "P13255", "text": ["MEASUREMENT SETUP - Vary the frequency of the function generator until I3 illuminates the brightest. Measure the frequency at TP9."], "jumps": []}, {"id": "P13250", "text": ["6. Vary the frequency of the function generator until I3 illuminates the brightest. 7. Measure the frequency using an oscilloscope or frequency counter at PC130-83 TP9...."], "jumps": ["P13255", "P13240", "P13260"]}, {"id": "P13245", "text": ["VOLTAGE ON TP10 - Pressing S2 de-energizes K1. This connects the AC voltage through K1 to TP10. Also, the bottom contacts change which connects a voltage to I2."], "jumps": []}, {"id": "P13242", "text": ["You should have measured an AC voltage on TP10 and I2 should have been illuminated. Check that you are using your test equipment correctly. For example, multimeter set to measure AC volts..."], "jumps": []}, {"id": "P13241", "text": [], "jumps": []}, {"id": "P13240", "text": ["Is the voltage on TP10 correct and is the correct LED illuminated for K1 being de-energized?3"], "jumps": ["P13245", "P13230"]}, {"id": "P13235", "text": ["MEASUREMENT SETUP - Press and release S2. Measure the voltage at TP10.", "4. Press and release S2 on PC130-83. 5. Measure the voltage at PC130-83 TP10. NOTE: The I1 and I2 LEDs indicate the type of voltage, AC or DC, to be measured."], "jumps": ["P13240", "P13220", "P13235", "PTP", "P"]}, {"id": "P13225", "text": ["VOLTAGE ON TP10 - Pressing S1 energizes K1. This connects the DC voltage through K1 to TP10. Also, the bottom contacts change which connects a voltage to I1."], "jumps": []}, {"id": "P13222", "text": ["You should have measured a DC voltage on TP10 and I1 should have been illuminated. Check that you are using your test equipment correctly. For example, multimeter set to measure DC volts."], "jumps": []}, {"id": "P13221", "text": [], "jumps": []}, {"id": "P13220", "text": ["Is the voltage on TP10 correct and is the correct LED illuminated for K1 being energized?"], "jumps": ["P13225", "P13210"]}, {"id": "P13215", "text": ["MEASUREMENT SETUP - Press and release S1. Measure the voltage at TP10.", "2. Press and release S1 on PC130-83. 3. Measure the DC voltage at PC130-83 TP10 using the multimeter...", "VOLTAGE AT TP10 - With K1 de-energized an AC voltage is applied through K1 to TP10.."], "jumps": ["P13220", "P13200", "P13215", "PTP", "P"]}, {"id": "P13202", "text": ["You should have measured an AC voltage on TP10. Check that you are using your test equipment correctly. For example, multimeter set to measure AC volts."], "jumps": []}, {"id": "P13201", "text": [], "jumps": []}, {"id": "P13200", "text": ["With K1 de-energized is your measured voltage correct on TP10?"], "jumps": ["P13205", "P13190"]}, {"id": "P13195", "text": ["Using a multimeter, measure the AC voltage at PC130-83 TP10.P10.ope or multimeter.", "1. Using a multimeter, measure the AC voltage at PC130-83 TP10........C130-83 TP10..."], "jumps": ["P13200", "P13180", "P13195", "PTP", "P"]}, {"id": "P13180", "text": ["The circuit is setup. Now let's check to see if it is operating correctly.."], "jumps": ["P13170", "P13190"]}, {"id": "P13175", "text": ["MEASUREMENT SETUP - If none of the three LEDs are illuminated, there is a problem in your setup. Check that the PC1 AC switch is ON. If your setup is correct, check with your instructor.o"], "jumps": []}, {"id": "P13173", "text": ["I3 only illuminates around the resonant frequency of L1 and C1. 1 kHz is not the resonant frequency of L1 and C1.."], "jumps": []}, {"id": "P13172", "text": ["I1 only illuminates when K1 is energized indicating a DC output. On PC130-83, ensure that S1 is not depressed, press and release S2. K1 should not be energized."], "jumps": []}, {"id": "P13171", "text": [], "jumps": []}, {"id": "P13170", "text": ["Which LED is illuminated?is typed.........................."], "jumps": ["P13175"]}, {"id": "P13160", "text": ["8. Press Enter to Set: PC1 AC Power Switch - ON.........................."], "jumps": ["P13150"]}, {"id": "P13157", "text": ["FUNCTION GENERATOR SETUP - Range - 1 k Function Switch - Frequency Dial - 1.0"], "jumps": []}, {"id": "P13155", "text": ["MEASUREMENT SETUP - Connect function generator to the test console PC2 OUTPUT BNC."], "jumps": []}, {"id": "P13150", "text": ["6. Connect the output of the function generator to PC2 OUTPUT BNC. 7. Connect the oscilloscope CH1 probe to TP6 on PC130-83 and set the function generator to produce a 1 kHz, 8 to 10 Vpp sine wave at TP6."], "jumps": []}, {"id": "P13145", "text": ["MEASUREMENT SETUP - S1 to IND (up) R4 fully CW R6 to Mid Range"], "jumps": []}, {"id": "P13140", "text": ["A. Set switch S1 to inductive IND (up). B. Adjust R4 fully CW. C. Adjust R6 to mid range.", "5. On PC130-82:ting..................................................... let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
