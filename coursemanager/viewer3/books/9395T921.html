<script>
const book = {"title": "9395T921", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: WAVE PROPAGATIONdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["1. Wave Propagationle Enter objective 1 line item 2 here. item 2 here.e.e.", "w Define Wave Propagation. w Define Wave Propagation terms. w Describe wave characteristics and their propagation paths."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["This lesson will help you understand Wave Propagation."], "jumps": []}, {"id": "P410", "text": ["Knowledge of wave propagation is essential to understanding how communications and radio navigation systems work."], "jumps": []}, {"id": "P420", "text": ["Operators and technicians must be aware of the atmospheric conditions that affect communications and radio navigation systems. Many reported system malfunctions are not hardware faults but environmental condition issues...."], "jumps": []}, {"id": "P430", "text": ["Ionospheric conditions can greatly affect radio wave propagation."], "jumps": []}, {"id": "P440", "text": ["Let's begin the lesson on WAVE PROPAGATION................................"], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Propagation means movement through a medium (air, water, vacuum). Wave propagation is the movement of electromagnetic waves through a medium. Different mediums will affect the speed and direction of the propagated waves.."], "jumps": []}, {"id": "P1030", "text": ["The two common wave classifications are longitudinal and transverse."], "jumps": []}, {"id": "P1035", "text": ["LONGITUDINAL - Longitudinal waves undergo displacements parallel to the direction of wave motion. Sound waves are an example of longitudinal waves."], "jumps": []}, {"id": "P1036", "text": ["TRANSVERSE - Transverse waves have an up and down movement, which is perpendicular to wave motion. For example, radio waves, light waves, and heat waves are transverse waves."], "jumps": []}, {"id": "P1040", "text": ["A vibrating tuning fork produces a longitudinal wave. As the tine of the fork moves outward, the air in front is compressed and its momentary pressure is raised above the other points in the surrounding medium (air)..."], "jumps": []}, {"id": "P1050", "text": ["When the tine returns and moves inward, the air in front of the tine is rarefied so the pressure is lowered below the other points in the surrounding air. The rarefied wave is propagated from the tuning fork and follows the compressed wave..."], "jumps": []}, {"id": "P1055", "text": ["RAREFIED - To make less dense and expand without the addition of matter.Start second line here.e."], "jumps": []}, {"id": "P1060", "text": ["Dropping an object into the water produces transverse waves. As the falling stone strikes the water, a surface disturbance is created, resulting in expanding waves. As the stone falls deeper, the water closes violently over it, pushing the water upward and outward..."], "jumps": []}, {"id": "P1070", "text": ["Radio and light waves are transverse waves, which are further classified as electromagnetic waves. Oscillating electric and magnetic fields produce electromagnetic waves. The difference between light and radio waves is the frequency of these oscillations.s."], "jumps": []}, {"id": "P1080", "text": ["Many factors can affect atmospheric conditions, either positively or negatively. Three of these are variations in geographic height, geographic location, and changes in time (day, night, season, year).)"], "jumps": []}, {"id": "P1090", "text": ["The earth's atmosphere is divided into three separate regions or layers. They are the troposphere, stratosphere and ionosphere."], "jumps": []}, {"id": "P1100", "text": ["Almost all weather phenomena take place in the troposphere. The temperature in this region decreases rapidly with altitude. Variations in temperature, pressure and density cause clouds and turbulence, which can effect the propagation of radio waves..."], "jumps": []}, {"id": "P1110", "text": ["The stratosphere is located between the troposphere and the ionosphere. Because the temperature throughout the layer is almost constant and very little water vapor is present, the stratosphere has almost no effect on radio waves..."], "jumps": []}, {"id": "P1120", "text": ["The ionosphere is the most important region of the earth's atmosphere for long distance, point-to-point communications. The size and makeup of the ionosphere is directly related to radiation emitted from the sun, such as solar flares and sunspot activity..."], "jumps": []}, {"id": "P1125", "text": ["SOLAR FLARES - Sudden violent outbursts of energy from a small area on the sun's surface..e. here."], "jumps": []}, {"id": "P1130", "text": ["There are two types of sun activity that will vary the ionosphere: Activity that occur in predictable cycles, such as day and night, 27 day, seasonal or the eleven-year sunspot cycle, and Irregular variations that cannot be predicted. Let's concentrate on the predictable activity...ty..."], "jumps": []}, {"id": "P1140", "text": ["Daily variations in the ionosphere produce four cloud-like layers of electrically-charged gas atoms called ions, which enhances radio wave propagation. Ions are formed by a process called ionization..."], "jumps": []}, {"id": "P1145", "text": ["IONIZATION - Process of atoms or groups of atoms that carry a positive or negative electric charge as a result of having lost or gained one or more electrons."], "jumps": []}, {"id": "P1150", "text": ["In ionization, high-energy ultraviolet light waves from the sun periodically enter the ionosphere, strike neutral gas atoms, and knock one or more electrons free causing the atom to become positively charged (positive ions)..."], "jumps": []}, {"id": "P1160", "text": ["The negatively charged free electrons absorb some of the ultraviolet energy that initially set them free and form ionized layers. Penetrating ultraviolet waves of differing frequencies cause several ionized layers to develop..."], "jumps": []}, {"id": "P1170", "text": ["Higher frequency ultraviolet waves penetrate the most and form the lowest layer. Conversely, lower frequency ultraviolet waves penetrate the least and form the upper layers."], "jumps": []}, {"id": "P1180", "text": ["An important factor in determining the density of the ionized layers is the elevation angle of the sun. Since this angle changes frequently, the height and thickness of the ionized layers vary with the time of day and the season of the year..."], "jumps": []}, {"id": "P1190", "text": ["Recombination is the reverse process of ionization. It occurs when free electrons and positive ions collide, combine, and return the positive ions to their original neutral state."], "jumps": []}, {"id": "P1200", "text": ["Like ionization, the recombination process depends on the time of day. Between early morning and late afternoon, the rate of ionization exceeds the rate of recombination. During this period the ionized layers reach their greatest density and exert maximum influence on wave propagation..."], "jumps": []}, {"id": "P1210", "text": ["During late afternoon and early evening, the rate of recombination exceeds the rate of ionization, causing the densities of the ionized layers to decrease. Throughout the night, density continues to decrease, reaching its lowest point just before sunrise..."], "jumps": []}, {"id": "P1220", "text": ["The ionosphere is composed of three distinct layers, designated from lowest to highest level (D, E, and F). During the day, the F layer is divided into two layers, designated F1 (the lower level) and F2 (the higher level)..."], "jumps": []}, {"id": "P1230", "text": ["The D-layer ranges from about 30 to 55 miles above the earth. Ionization in the D-layer is low because less ultraviolet light penetrates to this level E4."], "jumps": []}, {"id": "P1240", "text": ["At very low frequencies, the D-layer and the ground act as a huge waveguide, making communication possible only with large antennas and high-power transmitters."], "jumps": []}, {"id": "P1250", "text": ["At low and medium frequencies, the D-layer becomes highly absorptive, which limits the effective daytime communication range to about 200 miles. Rule of thumb to remember, is the higher the sun, the higher the frequency..."], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["At frequencies above 3 MHz, the D-layer begins to lose its absorptive qualities. Long-distance communications is possible at frequencies as high as 30 MHz. Waves at frequencies above this range pass through the D-layer but are attenuated..."], "jumps": []}, {"id": "P1270", "text": ["After sunset, the D-layer disappears because of the rapid recombination of ions. Low and medium frequency long-distance communications becomes possible."], "jumps": []}, {"id": "P1280", "text": ["The E-layer ranges from approximately 55 to 90 miles above the earth. The rate of ionospheric recombination in this layer is rapid after sunset, causing it to nearly disappear by midnight."], "jumps": []}, {"id": "P1290", "text": ["The E-layer permits medium-range communications on the low frequency through very-high frequency bands. At frequencies above about 150 MHz, radio waves pass through the E-layer. During increased sunspot activity, a Sporadic-E layer is formed and can extend radio waves to 1000 miles..."], "jumps": []}, {"id": "P1295", "text": ["SPORADIC - E layer- During increased sunspot activity, irregular non-predictable cloud-like patches of unusually high ionization form at heights near the E-layer of the ionosphere."], "jumps": []}, {"id": "P1300", "text": ["The F-layer exists from about 90 to 240 miles above the earth. During daylight hours, maximum ionization occurs and the F-layer separates into two layers, F1 and F2. Atoms in the F-layers stay ionized for a longer time after sunset."], "jumps": []}, {"id": "P1310", "text": ["Since, the F-layer is the highest of the ionospheric layers, it also has the longest propagation capability. For horizontal waves, the single-hop F2 distance can reach 3000 miles. Multiple hops are required for greater distances..."], "jumps": []}, {"id": "P1320", "text": ["The F-layer is responsible for most high frequency, long-distance communications. The maximum usable frequency in the F-layer depends on the degree of sunspot activity. high as 100 MHz, As low as 10 MHz."], "jumps": []}, {"id": "P1330", "text": ["Within the atmosphere, radio waves can be refracted, reflected, and diffracted. A radio wave transmitted into ionized layers is always refracted, or bent."], "jumps": []}, {"id": "P1340", "text": ["A radio wave travels through the atmosphere at a constant speed. As the wave enters the denser layer of charged ions, its upper portion moves faster than its lower portion. The abrupt speed increase of the waves upper portion causes it to bend back toward the earth..."], "jumps": []}, {"id": "P1350", "text": ["This bending is always toward the propagation medium where the radio wave's velocity is the least. The amount of refraction depends on: Ionization layer density, Radio wave frequency and Radio wave layer penetration angle.le..e..."], "jumps": []}, {"id": "P1360", "text": ["Each ionized layer has a middle region of relatively dense ionization with less intensity above and below. As a radio wave enters a region of increasing ionization, a velocity increase causes it to bend back toward the earth..."], "jumps": []}, {"id": "P1370", "text": ["In the highly dense middle region, refraction occurs more slowly because the ionization density is uniform. As the wave enters the upper less dense region, the velocity of the upper part of the wave decreases and the wave is bent away from the earth..."], "jumps": []}, {"id": "P1380", "text": ["Radio and light waves are _______ waves, which are further classified as _______ waves."], "jumps": ["P1360"]}, {"id": "P1381", "text": [], "jumps": []}, {"id": "P1382", "text": ["Radio and light waves are perpendicular to wave motion....."], "jumps": []}, {"id": "P1383", "text": ["Sound waves are longitudinal..............................."], "jumps": []}, {"id": "P1384", "text": ["Radio and light waves have electrical and magnetic properties."], "jumps": []}, {"id": "P1390", "text": ["Which layer of the ionosphere has the longest propagation capability?"], "jumps": ["P1380"]}, {"id": "P1391", "text": [], "jumps": []}, {"id": "P1392", "text": ["The E-layer has moderate propagation capability............"], "jumps": []}, {"id": "P1393", "text": ["The Sporadic-E layer is only present during increased sunspot activity and only increases the propagation distance to about 1000 miles."], "jumps": []}, {"id": "P1394", "text": ["The D-layer is the lowest ionospheric layer and disappears during the day light hours."], "jumps": []}, {"id": "P1400", "text": ["The lower the frequency of a radio wave, the more rapidly the wave is refracted by a given degree of ionization. Three separate waves of differing frequencies entering the ionosphere at the same angle are pictured below..."], "jumps": []}, {"id": "P1410", "text": ["The 5-MHz wave is refracted quite sharply, while the 20-MHz wave is refracted less sharply and returns to earth at a greater distance. Notice that the 100-MHz wave is lost into space."], "jumps": []}, {"id": "P1420", "text": ["For any given ionized layer, there is a frequency, called the escape point, at which energy transmitted directly upward will escape into space. The maximum frequency just below the escape point is called the critical frequency..."], "jumps": ["P1425", "P1400"]}, {"id": "P1425", "text": ["Remember, every ionized layer has a maximum frequency that can be refracted called the critical frequency. Waves that pass through the escape point of one layer can be refracted by higher ionized layers..."], "jumps": ["P1430", "P1400"]}, {"id": "P1430", "text": ["The 100-MHz wave's frequency is greater than the critical frequency for that ionized layer. However, if a wave passes through a particular layer, it may still be refracted by higher layer if its frequency is lower than that layer's critical frequency..."], "jumps": []}, {"id": "P1440", "text": ["When a radio wave encounters a layer of the ionosphere, that wave is returned to earth at the same angle (roughly) as its angle of incidence."], "jumps": []}, {"id": "P1445", "text": ["ANGLE OF INCIDENCE - The angle between a wave and beam striking a surface and a line perpendicular to that surface."], "jumps": []}, {"id": "P1450", "text": ["In the figure below, three radio waves of the same frequency enter a layer at different incidence angles. Wave A strikes the layer too vertical to be refracted, while wave B is refracted to earth. The angle between wave B and the earth is called the critical angle..."], "jumps": []}, {"id": "P1460", "text": ["Wave C leaves the antenna at the smallest angle that will allow it to be refracted and still return to earth. The critical angle for radio waves depends on the layer density and the wavelength of the signal..."], "jumps": []}, {"id": "P1470", "text": ["As the frequency of a radio wave is increased, the critical angle must be reduced for refraction to occur. Notice that the 2-MHz wave strikes the ionosphere at the critical angle for that frequency and is refracted..."], "jumps": []}, {"id": "P1480", "text": ["Although the 5-MHz line (broken line) strikes the ionosphere at a less critical angle, it still penetrates the layer and is lost. As the angle is lowered, a critical angle is finally reached for the 5-MHz wave..."], "jumps": []}, {"id": "P1490", "text": ["For any given ionized layer, there is a frequency, called the _______ _______, at which energy transmitted directly upward will be lost into space. The maximum frequency just below this is called the _______ _________"], "jumps": ["P1470"]}, {"id": "P1491", "text": [], "jumps": []}, {"id": "P1492", "text": ["Remember, each ionized layer has a frequency that will not be refracted and will be lost into space."], "jumps": []}, {"id": "P1493", "text": ["Any given layer has a point where the energy will be lost into space. Frequencies below that point are critical."], "jumps": []}, {"id": "P1494", "text": ["You are partly correct, the critical frequency we're looking for is where the signal escapes into space."], "jumps": []}, {"id": "P1500", "text": ["Electromagnetic waves travel from the transmitting to the receiving antennas by ground waves and sky waves. Ground waves consist of surface waves and direct path waves. Surface waves hug the earth's surface, and direct waves travel over the earth's surface.."], "jumps": ["P1490"]}, {"id": "P1510", "text": ["Sky waves or ionospheric waves radiate upward and refract (bend) off the ionosphere returning to earth."], "jumps": []}, {"id": "P1520", "text": ["Let's look at the relationship between the sky wave, skip distance, skip zone and ground wave coverage. The skip distance is the distance from the transmitter to the point where the sky wave first returns to the earth..."], "jumps": ["P1500"]}, {"id": "P1530", "text": ["The skip distance depends on the wave's frequency, angle of incidence, and the degree of ionization."], "jumps": []}, {"id": "P1540", "text": ["The Skip Zone is the area of silence between the point where the ground waves become too weak for reception and the point where the sky wave first returns to earth. As the layers change in height the size of the Skip Zone changes..."], "jumps": ["P1520"]}, {"id": "P1550", "text": ["The outer limit of the skip zone varies with operating frequency, time of day, season of the year, sunspot activity, and the direction of transmission."], "jumps": []}, {"id": "P1560", "text": ["There are three Skip Zone Stages. The first stage, are radio waves that are too high a frequency or strike the ionosphere at too great an angle and escape the ionosphere."], "jumps": []}, {"id": "P1570", "text": ["Second stage radio waves extend up and outward to the ionosphere.", "H [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [", "[ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ 3H", "H[ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [", "[ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ [ H"], "jumps": []}, {"id": "P1580", "text": ["Third stage radio waves are refracted so much they return to earth creating an area of Sky Wave Coverage. The transmitted signal is again available for reception in this coverage area."], "jumps": ["P1560"]}, {"id": "P1590", "text": ["The change in ionospheric refraction changes the size of the Skip Zone for any given HF frequency. The ionosphere is higher at night, lengthening the zone and increasing the range of connectivity and shorter during the day, decreasing the range of connectivity..."], "jumps": ["P1560"]}, {"id": "P1600", "text": ["If the transmission frequency remains constant, connectivity will be lost during the transition from day to night as the receiving station moves into the expanding Skip Zone."], "jumps": []}, {"id": "P1610", "text": ["What layer of the ionosphere disappears at night?.........."], "jumps": ["P1600"]}, {"id": "P1611", "text": [], "jumps": []}, {"id": "P1612", "text": ["Recombination will occur in the E-layer, but it will not disappear."], "jumps": []}, {"id": "P1613", "text": ["Increased sunspot activity creates the Sporadic-E layer, which can appear during the day or night."], "jumps": []}, {"id": "P1614", "text": ["The F-layer exists throughout the night and separates into the (F1 and F2) layers during the day."], "jumps": []}, {"id": "P1620", "text": ["In the simplest terms reflected waves are neither transmitted nor absorbed, but are reflected from the surface of the medium they encounter. The law of reflection states that the angle of incidence is equal to the angle of reflection..."], "jumps": ["P1610"]}, {"id": "P1630", "text": ["Remember, the angle of incidence is the angle between a wave and beam striking a surface and a line perpendicular to that surface. 's look at an example of a light wave's interaction with a mirror. Click on each number (1 to 5) sequentially...", "An imaginary line perpendicular to the reflecting surface at the point where the incident wave strikes the surface", "The angle between the incident wave and the normal", "The wave traveling away from the reflecting surface", "The wave traveling toward the reflecting service", "The angle between the reflection wave and the normal"], "jumps": []}, {"id": "P1640", "text": ["Reflection of radio waves occurs when the waves strike an object or substance while traveling from the transmitting station to the receiving station. The amount of reflection depends on the conductivity of the reflecting surface and the angle of incidence..."], "jumps": []}, {"id": "P1650", "text": ["Radio waves reflect from an area of the reflecting surface, not from a single point. If you look at the phase relationship of the two waves you will notice that a 180", "phase shift is induced when the waves reflect from the surface.urface..."], "jumps": []}, {"id": "P1660", "text": ["If you write something on a piece of paper and look at the reflection in a mirror, you will notice the letters are reversed or 180"], "jumps": []}, {"id": "P1670", "text": ["When the reflected wave and the direct path wave are 180", "out of phase, they are attenuated and tend to cancel each other out. Conversely, when in phase they continue to propagate.agate.."], "jumps": []}, {"id": "P1680", "text": ["The degree of attenuation will vary for waves with phase relationships between zero and 180", "out of phase. Fading is the common name given to the attenuation of radio waves.ves..."], "jumps": []}, {"id": "P1690", "text": ["Fading also results from absorption of the radio frequency (rf) energy in the ionosphere. As the radio wave passes into ionized layers, it loses some of its energy to the free electrons and ions."], "jumps": []}, {"id": "P1700", "text": ["Multipath is a term used to describe the multiple paths a radio wave may follow between transmitter and receiver. Such propagation paths include the ground wave, ionospheric refraction, diffraction and reflection off the earth's surface..."], "jumps": []}, {"id": "P1710", "text": ["Multipath fading exists due to the varying signal strength and phase relationships of the received radio waves. Radio waves that are received in phase reinforce each other, while those that are out of phase produce weak or fading signals..."], "jumps": []}, {"id": "P1720", "text": ["Diffraction is the ability of radio waves to turn sharp corners and bend around obstacles. The amount of diffraction depends on the wavelength of the wave. Higher frequency (light) waves are rarely diffracted, while very low frequency waves can be made to encircle the earth..."], "jumps": []}, {"id": "P1730", "text": ["As the frequency is increased, the ability to diffract the wave around objects decreases, and a shadow zone, an area of no reception will exist."], "jumps": []}, {"id": "P1740", "text": ["Wind, air temperature, and water content of the atmosphere can combine either to extend or attenuate wave propagation. Raindrops cause greater attenuation by scattering the radio wave into multiple paths...", "???????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????? ???", "? ? ?????????????????????? ????????????????????????????????????????????????????????????????????????????????????????????????\\_??r", "? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ???7", "? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ? ?\\_??r", "=\\? \\_??r"], "jumps": []}, {"id": "P1750", "text": ["When layers of warm air form above layers of cold air, a temperature inversion duct or channel is formed. The sudden change in densities or ducting, allows the radio wave to repeatedly refract off the warm air and reflect off the earth's surface..."], "jumps": []}, {"id": "P1760", "text": ["Wave propagation losses are produced by ionospheric absorption, ground reflections and freespace loss. The spreading out of the wavefront as it travels from the transmitter causes freespace energy loss..."], "jumps": []}, {"id": "P1770", "text": ["By the time the energy arrives at the receiving antenna, the wavefront is so spread out that the antenna only extends into a small portion of the wavefront."], "jumps": []}, {"id": "P1780", "text": ["At any given time of day, there is a maximum, lowest and optimum frequency that will enhance wave propagation.", "__ ____________________________________w$", "__ $*w", "_ *b", "2 6", "< 2", "< -", "2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2", "\" 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2=", "< 2 2 2 2 2 2 2 2 2 2 2 2 2 2j", "2 2 2 2 2 2 2 2 2 2 2 2 2 22<", "2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2"], "jumps": []}, {"id": "P1790", "text": ["For a given angle of incidence and time of day, there is a Maximum Usable Frequency (muf) that can be used for communications between two given locations. Waves above the muf are either refracted to slowly and return beyond the desired location or lost into space..."], "jumps": []}, {"id": "P1800", "text": ["Likewise, the minimum frequency of a radio wave that can be used between two locations is the Lowest Usable Frequency (luf). Waves below the luf are refracted back to earth at a shorter distance than desired...", "4 44 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 44"], "jumps": []}, {"id": "P1810", "text": ["The Optimum Working Frequency (fot), is one that you can rely on to have the least number of problems. It should be high enough to avoid multipath fading, absorption, and noise encountered at low frequencies; but not so high as to be affected by adverse ionospheric conditions..."], "jumps": []}, {"id": "P1820", "text": ["This is where the question is typed..........................", "The Skip Zone is known as the area of _______between the end of the Ground Wave Coverage and the beginning of the Sky Wave Coverage."], "jumps": ["P1810"]}, {"id": "P1821", "text": [], "jumps": []}, {"id": "P1822", "text": ["Refraction occurs in the ionized layers...................."], "jumps": []}, {"id": "P1823", "text": ["Reflection occurs after the skip zone......................"], "jumps": []}, {"id": "P1824", "text": ["The density level of the ionized layers will increase or decrease the refraction of radio waves."], "jumps": []}, {"id": "P1830", "text": ["As the wavelength decreases and the frequency of a radio wave increases the diffraction ability increases."], "jumps": ["P1820"]}, {"id": "P1831", "text": [], "jumps": []}, {"id": "P1832", "text": ["Diffraction is the ability of a radio wave to go around sharp objects and mountains."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on WAVE PROPAGATION........."], "jumps": ["P1830"]}, {"id": "P1920", "text": ["1. Propagation means movement through a medium (air, water, vacuum). Wave propagation is the movement of electromagnetic waves through a medium. Different mediums will affect the speed and direction of the propagated waves."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. The ionosphere is the most important region of the earth's atmosphere for long distance, point-to-point communications. The size and makeup of the ionosphere is directly related to radiation emitted from the sun, such as solar flares and sunspot activity."], "jumps": []}, {"id": "P1940", "text": ["3. Since the F-layer is the highest of the ionospheric layers, it also has the longest propagation capability. For horizontal waves, the single-hop F2 distance can reach 3000 miles. Multiple hops are required for greater distances."], "jumps": []}, {"id": "P1950", "text": ["4. The lower the frequency of a radio wave, the more rapidly the wave is refracted by a given degree of ionization. Three separate waves of differing frequencies entering the ionosphere at the same angle are pictured below."], "jumps": []}, {"id": "P1960", "text": ["5. For any given ionized layer, there is a frequency, called the escape point, at which energy transmitted directly upward will escape into space. The maximum frequency just below the escape point is called the critical frequency."], "jumps": []}, {"id": "P1970", "text": ["6. Electromagnetic waves travel from the transmitting to the receiving antennas by ground waves and sky waves. Ground waves consist of surface waves and direct waves. Surface waves hug the earth's surface and direct waves travel over the earth's surface."], "jumps": []}, {"id": "P1980", "text": ["7. Diffraction is the ability of radio waves to turn sharp corners and bend around obstacles. The amount of diffraction depends on the wavelength of the wave. Higher frequency (light) waves are rarely diffracted, while very low frequency waves can be made to encircle the earth."], "jumps": []}, {"id": "P1990", "text": ["8. The Optimum Working Frequency (fot) is one that you can rely on to have the least number of problems. It should be high enough to avoid multipath fading, absorption, and noise encountered at low frequencies; but not so high as to be affected by adverse ionospheric conditions."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1990"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["Wave propagation is the transfer of electric energy through space.", "What is the definition of wave propagation?", "Wave propagation is the movement of electromagnetic waves through a medium.", "Wave propagation is the movement of electric current through a medium.", "Wave propagation is the transfer of electromagnetic energy through space."], "jumps": [] let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
