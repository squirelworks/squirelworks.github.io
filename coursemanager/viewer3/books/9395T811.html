ystems. ....", "w Perform successful troubleshooting with the 68000 microprocessor trainer.", "w Define the techniques required to troubleshoot a defective microprocessor system. w Describe preventive maintenance."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Experiment Card PC130 - 468 XXXXXXnt"], "jumps": []}, {"id": "P410", "text": ["Most people would not throw away an expensive piece of equipment.  They would rather give it to a technician to fix.  The technician would take the faulty equipment and find the problem.", "Most people would not throw away an expensive piece of equipment. They would rather give it to a technician to fix. The technician would take the faulty equipment and find the problem."], "jumps": ["P420", "P400"]}, {"id": "P3030", "text": ["In each case you will check the system to see if anything isn't working.  If a fault is discovered, certain steps may be performed to isolate the fault to a particular region of the microprocessor       system.", "In each case you will check the system to see if anything isn't working. If a fault is discovered, certain steps may be performed to isolate the fault to a particular region of the microprocessor system."], "jumps": ["P3020"]}, {"id": "P1050", "text": ["It is equally important for a technician to be methodical when troubleshooting.  The technician must always keep sight of the overall troubleshooting task and yet, at the same time, be attentive to detail.", "It is equally important for a technician to be methodical when troubleshooting. The technician must always keep sight of the overall troubleshooting task and yet, at the same time, be attentive to detail."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["Much time can be wasted if the technician jumps to conclusions without sufficient evidence.  Commonly, the technicians must repair equipment with only the vaguest prior knowledge of the equipments symptoms." ticed an error in the system operation. or in the system operation."], "jumps": ["P3250", "P3230"]}, {"id": "P3220", "text": ["In this case there is an open transmit line.  Let's fix the fault and see if the problem is removed.", "In this case there is an open transmit line. Let's fix the fault and see if the problem is removed..............."], "jumps": ["P3230", "P3200"]}, {"id": "P3230", "text": ["14.  The computer will now remove the fault.", "14. The computer will now remove the fault.........C1 DC switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P3200"]}, {"id": "P3250", "text": ["Errors like this possibly can go undetected for some time if that function of the microprocessor isn't utilized."], "jumps": ["P3260", "P3240"]}, {"id": "P3260", "text": ["Had this problem been caused by any of the other previously mentioned reasons, you would go through the list, one by one, selecting the easiest ones first."], "jumps": ["P3270", "P3240"]}, {"id": "P1001", "text": ["A technician must have an adequate understanding of both the equipment under test and the test equipment being used. However, this alone does not make a good technician."], "jumps": ["P1050", "P1001"]}, {"id": "P1070", "text": ["If the user does supply a description of the symptoms, without adequate electronics knowledge, the described symptoms may be misleading."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["You must check the symptoms for yourself before probing into the microprocessor for the cause.  Occasionally the fault may allow most of the microprocessor to work properly.", "You must check the symptoms for yourself before probing into the microprocessor for the cause. Occasionally the fault may allow most of the microprocessor to work properly."], "jumps": ["P1090", "P1040"]}, {"id": "P1100", "text": ["When the fault is easily recognized, the technician may choose to skip a total system check and proceed directly to the suspected area."], "jumps": ["P1110", "P1040"]}, {"id": "P1110", "text": ["As an inexperienced technician, you should be as thorough as possible in your observation of the essential functions.  A fault in an essential function may be minor enough not to effect the basic system operations, yet be responsible for a less noticeable fault.", "As an inexperienced technician, you should be as thorough as possible in your observation of the essential functions. A fault in an essential function may be minor enough not to effect the basic system operations, yet be responsible for a less noticeable fault."], "jumps": ["P1120", "P1040"]}, {"id": "P1120", "text": ["Before beginning an investigation, you should know how the sections of the microprocessor system work and what role they each play in system operation."], "jumps": ["P1130", "P1040"]}, {"id": "P1140", "text": ["In this case you can deduce that the fault is one of the disconnected devices or the interfacing signals."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["2.  How can you check that the system is starting correctly when       power is applied?  Know which components are essential in          starting the system.", "2. How can you check that the system is starting correctly when power is applied? Know which components are essential in starting the system."], "jumps": ["P1190", "P1130"]}, {"id": "P3240", "text": ["The LEDs on port J3 should now be illuminated.  If not, press reset, 0 and 1.  This will rerun the parallel test.  As you can see, if you hadn't checked the parallel portion of the circuit you may have never noticed an error in the system operation.", "The LEDs on port J3 should now be illuminated. If not, press reset, 0 and 1. This will rerun the parallel test. As you can see, if you hadn't checked the parallel portion of the circuit you may have never noticed an error in the system operation."], "jumps": ["P3250", "P3230"]}, {"id": "P1130", "text": ["1.  Determine which components are not necessary for                         successful execution of and interaction with the monitor                 program.  Disconnecting all non-essential assemblies may             make the machine operational again.", "1. Determine which components are not necessary for successful execution of and interaction with the monitor program. Disconnecting all non-essential assemblies may make the machine operational again."], "jumps": ["P1140", "P1040"]}, {"id": "P1190", "text": ["3.  Know how to test the keypad and display for proper operation.", "3. Know how to test the keypad and display for proper operation."], "jumps": ["P1200", "P1130"]}, {"id": "P1200", "text": ["4.  Know how to test other peripheral devices for proper                       operation.", "4. Know how to test other peripheral devices for proper operation."], "jumps": ["P1210", "P1130"]}, {"id": "P1210", "text": ["Once you are sure that you know about the microprocessor you are working on, then, and only then, should you begin troubleshooting the piece of equipment."], "jumps": ["P1220", "P1130"]}, {"id": "P1220", "text": ["There are many troubleshooting techniques that you may use to locate faults in microprocessor systems.  The technique given here is a four step process.", "There are many troubleshooting techniques that you may use to locate faults in microprocessor systems. The technique given here is a four step process...", "Analyze the system Recheck the setup Measure and test the system Double check your results", "Troubleshooting Steps Recheck the setup Measure and test the system Double check your results"], "jumps": ["P1230", "P1130"]}, {"id": "P1230", "text": ["You may use this technique later on or use another.  The point is to follow a logical sequence when troubleshooting.  This four step technique is one that will help you to be an observant, methodical technician.", "You may use this technique later on or use another. The point is to follow a logical sequence when troubleshooting. This four step technique is one that will help you to be an observant, methodical technician."], "jumps": ["P1240", "P1130"]}, {"id": "P3140", "text": ["Let's see if the experiment is still working properly.", "Let's see if the experiment is still working properly......"], "jumps": ["P3150", "P3130"]}, {"id": "P1250", "text": ["You should try to duplicate the symptoms described to you and look for symptoms that have not been observed or relayed to you."], "jumps": ["P1260", "P1240"]}, {"id": "P1240", "text": ["Step 1.  Analyze The System\n               In this step, the technician compares the operation of a                    malfunctioning system to normal system operation.", "Step 1. Analyze The System In this step, the technician compares the operation of a malfunctioning system to normal system operation.", "Analyze the system Recheck the setup Measure and test the system Double check your results", "Troubleshooting Steps Recheck the setup Measure and test the system Double check your results"], "jumps": ["P1130", "P1250"]}, {"id": "P1260", "text": ["An important point in this step is that you ARE NOT trying to fix the fault.  You are only determining the symptoms.", "An important point in this step is that you ARE NOT trying to fix the fault. You are only determining the symptoms."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["For example, if the display is always blank, you would waste a lot of time if you troubleshoot the display only to find that there is a problem in the power supply for the entire system.  Once you have listed all the symptoms, go to Step 2.", "For example, if the display is always blank, you would waste a lot of time if you troubleshoot the display only to find that there is a problem in the power supply for the entire system. Once you have listed all the symptoms, go to Step 2."], "jumps": ["P1280", "P1240"]}, {"id": "P3280", "text": ["1.  Press Reset on the 68000 microprocessor trainer.", "1. Press Reset check your results"], "jumps": ["P1330", "P1280"]}, {"id": "P1330", "text": ["Then use test equipment to measure and test the circuits.  Once you think you have found the fault, go to Step 4.", "Then use test equipment to measure and test the circuits. Once you think you have found the fault, go to Step 4."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["Step 4.  Double Check Your Results\n               Once you have determined the possible fault, double                        check your work.", "Step 4. Double Check Your Results Once you have determined the possible fault, double check your work.", "Analyze the system Recheck the setup Measure and test the system Double check your results", "Troubleshooting Steps Recheck the setup Measure and test the system Double check your results", "Double check your resultsem ck the setup Measure and test the system Double check your results"], "jumps": []}, {"id": "P1360", "text": ["If the fault could cause the symptoms or part of the symptoms (you could have more than one fault), you can be reasonably assured that  you have verified the problem.   You would then replace or repair the fault and repeat Step 1 to ensure that the equipment is 100% operational.", "If the fault could cause the symptoms or part of the symptoms (you could have more than one fault), you can be reasonably assured that you have verified the problem. You would then replace or repair the fault and repeat Step 1 to ensure that the equipment is 100% operational."], "jumps": ["P1380", "P1340"]}, {"id": "P1380", "text": ["If the fault could not cause the symptoms, go back to Step 1 to ensure that you observed the correct symptoms and then go to Step 3 for more measurements and tests."], "jumps": ["P1400", "P1340"]}, {"id": "P3300", "text": ["3.  Press 0 and 0.", "When troubleshooting, it is important to understand the sensitivity of the devices which you are handling.", "3. Press 0 and 0. text here..............................."], "jumps": ["P3310", "P3290", "P1410", "P1340"]}, {"id": "P1440", "text": ["For instance, a resistor may be hand-carried or dropped yet, it will still operate."], "jumps": ["P1450", "P1430"]}, {"id": "P1420", "text": ["There are certain limitations on the environment in which a microprocessor system can be stored and operated.  Operating the system in a proper environment will help prevent future repairs.", "Different precautions must be taken when handling various components of the microprocessor circuits.", "There are certain limitations on the environment in which a microprocessor system can be stored and operated. Operating the system in a proper environment will help prevent future repairs.", "1. System should not be stored or operated in a dusty enviroment. 2. The system should only be operated within the manufacturers specified temperature limitations. 3. The system should always be plugged into a grounded outlet. 4. The system must not be operated near an unshielded power supply of other equipment. Strong emissions from power supplies can force crystals to vibrate at the wrong frequency. 5. The system should always be turned off before attaching or detaching hardware from the system."], "jumps": ["P1430", "P1400", "P1440", "P1420"]}, {"id": "P1450", "text": ["However, you cannot treat CMOS ICS the same way.  Handling CMOS ICS may destroy them by static discharges from the body.", "However, you cannot treat CMOS ICS the same way. Handling CMOS ICS may destroy them by static discharges from the body."], "jumps": ["P1460", "P1430"]}, {"id": "P1460", "text": ["Dropping it may crack the chip, destroying it.  The ICs legs can also be bent so when inserted into the PC board the legs do not line up with the board or socket.", "Dropping it may crack the chip, destroying it. The ICs legs can also be bent so when inserted into the PC board the legs do not line up with the board or socket."], "jumps": ["P1470", "P1430"]}, {"id": "P1470", "text": ["There are two types of ICs used in the 68000 microprocessor system: CMOS and TTL.  CMOS stands for Complimentary Metal Oxide Semiconductor and TTL stands for Transistor-Transistor Logic.", "There are two types of ICs used in the 68000 microprocessor system: CMOS and TTL. CMOS stands for Complimentary Metal Oxide Semiconductor and TTL stands for Transistor-Transistor Logic."], "jumps": ["P1480", "P1430"]}, {"id": "P1480", "text": ["These are two of the most common technologies used in the construction of ICs.  TTL chips can work at a higher speed but have high power consumption.  The CMOS is slower but uses less power than TTL.  CMOS is very susceptible to static electricity.", "These are two of the most common technologies used in the construction of ICs. TTL chips can work at a higher speed but have high power consumption. The CMOS is slower but uses less power than TTL. CMOS is very susceptible to static electricity."], "jumps": ["P1490", "P1430"]}, {"id": "P1490", "text": ["Have you ever walked across a carpet in the middle of winter while shuffling your feet, touched something metal and got an electric shock?  That electric shock you received was approximately 50,000 volts.", "Have you ever walked across a carpet in the middle of winter while shuffling your feet, touched something metal and got an electric shock? That electric shock you received was approximately 50,000 volts."], "jumps": ["P1430", "P1500"]}, {"id": "P1540", "text": ["It is important for a technician to know how to identify the pin numbers and how to insert an IC into a socket."], "jumps": ["P1550", "P1530"]}, {"id": "P1510", "text": ["Static voltages as small as 250 volts can destroy or damage a CMOS chip.  Some measures for the prevention of static discharge are:", "Static voltages as small as 250 volts can destroy or damage a CMOS chip. Some measures for the prevention of static discharge are:", "- Raise the humidity of the room by using a humidifier plants or an aquarium. - Use a static free carpet. - Wear a ground strap on your wrist that is clipped to ground. - Don't touch more chips then you have to. - Don't touch the chip's pins when picking them up, try to only touch the body.body..re from the system.rce crystals to vibrate at the wrong frequency. 5. The system should always be turned off before attaching or detaching hardware from the system.rned off before attaching or detaching hardware from the system."], "jumps": ["P1520", "P1430"]}, {"id": "P1520", "text": ["The following is a short summary of precautions for handling other components:", "CAPACITORS: Ceramic, Mica and Tantalum capacitors are not polarized, but Electrolytic capacitors are. If capacitors are cracked, replace them, and if they are electrolytic, BE SURE not to put them in backwards. CRYSTALS: Crystal cases should be grounded. Crystals may be upset by strong emissions from the power supply of other instruments and may vibrate at a different frequency because of this. DIODES: Must be put in the circuit with the correct polarity. FUSES: Don't rely on only visual check. Check fuses with an ohmmeter. CONNECTORS: Ensure connector's pins are straight before plugging a cable into them. LEDS: Leds are really damaged by soldering heat or by applying too much voltage or current to them. RESISTORS: Value and tolerance can be determined from their color bands. Replace cracked or discolored resistors. While they are very rugged components, putting more power through them than what they are designed can destroy them. Resistors have a power rating in watts. Most resistors on the 68000 circuits are 1/4 watt. SOCKETS: Check that ICs are seated in their sockets properly, not tilted. When soldering sockets in place, solder diagonally opposite pins from the farthest corners first and check to see that the socket is flat against the circuit board. Then the remaining pins can be soldered into place. SWITCHES: Contact cleaner should be used to clean switches not, pencil erasers or abrasive materials.................................."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["Microprocessor systems use a lot of integrated circuits.  A lot of these ICs look identical, except for the number of pins and the labeling on the cases.", "Microprocessor systems use a lot of integrated circuits. A lot of these ICs look identical, except for the number of pins and the labeling on the cases."], "jumps": ["P1540", "P1520"]}, {"id": "P1550", "text": ["Let's see how different types of ICs are marked and labeled."], "jumps": ["P1560", "P1530"]}, {"id": "P1560", "text": ["In general, there are two markings on the upper face of an IC: the manufacturer's identification mark and a circuit identification code."], "jumps": ["P1570", "P1530"]}, {"id": "P1570", "text": ["The codes identifying ICS vary depending on the manufacturer so it is important to distinguish one IC from another."], "jumps": ["P1580", "P1530"]}, {"id": "P13200", "text": ["13.  Press Enter.  The display indicates that the serial port test              failed.  If  a fault was not present the display would have                  indicated \"TEST PASS\".", "13. Press Enter. The display indicates that the serial port test failed. If a fault was not present the display would have indicated \"TEST PASS\"."], "jumps": ["P13210", "P13190"]}, {"id": "P1580", "text": ["The following list describes some of the identifying marks by which you can recognize the manufacturer of the ICs used in the Nida Model 68000 microprocessor.", "Motorola Letter M in a circle National Semiconductor Two parallel wavy lines. Texas Instruments Outline of the State of Texas..s when picking them up, try to only touch the body.ouch the chip's pins when picking them up, try to only touch the body.body..re from the system.rce crystals to vibrate at the wrong frequency. 5. The system should always be turned off before attaching or detaching hardware from the system.rned off before attaching or detaching hardware from the system."], "jumps": ["P1590", "P1530"]}, {"id": "P1600", "text": ["Once the manufacturer has been determined, chip specifications can be looked up in the manufacturer's data books."], "jumps": ["P1610", "P1580"]}, {"id": "P1610", "text": ["This information is very important when replacing an IC with one from a different manufacturer.  The only way you can be sure that the replacement IC is the same is to check the specifications for both chips.  This requires identification of the manufacturer.", "This information is very important when replacing an IC with one from a different manufacturer. The only way you can be sure that the replacement IC is the same is to check the specifications for both chips. This requires identification of the manufacturer."], "jumps": ["P1620", "P1580"]}, {"id": "P1620", "text": ["Identification codes usually consist of three parts; a prefix number, a device number, and a suffix.  However, each manufacturer uses a different type of code.", "Identification codes usually consist of three parts; a prefix number, a device number, and a suffix. However, each manufacturer uses a different type of code."], "jumps": ["P1630", "P1580"]}, {"id": "P1630", "text": ["The only sure method to determine the type of IC is to use the manufacturer's data books."], "jumps": ["P1640", "P1580"]}, {"id": "P1640", "text": ["Most manufacturer's include a date mark on the chip.  This date indicates the month and year that the chip was made.", "Most manufacturer's include a date mark on the chip. This date indicates the month and year that the chip was made."], "jumps": ["P1650", "P1580"]}, {"id": "P3150", "text": ["11.  On the keyboard of the 68000 microprocessor system, enter           0 and 0.", "11. On the keyboard of the 68000 microprocessor system, enter 0 and 0."], "jumps": ["P3160", "P3140"]}, {"id": "P1650", "text": ["This date will help to identify the chip, especially, if the manufacturer changed the method used to identify the chip. Other types of markings may include:", "- Manufacturer's part number - Inspection Markings - Source of Supply - Manufacturing locationallel wavy lines. Texas Instruments Outline of the State of Texas..s when picking them up, try to only touch the body.ouch the chip's pins when picking them up, try to only touch the body.body..re from the system.rce crystals to vibrate at the wrong frequency. 5. The system should always be turned off before attaching or detaching hardware from the system.rned off before attaching or detaching hardware from the system."], "jumps": ["P1660", "P1580"]}, {"id": "P1660", "text": ["Placing an IC into a circuit requires special attention and sometimes special equipment."], "jumps": ["P1670", "P1650"]}, {"id": "P1670", "text": ["Soldering an IC, especially a CMOS chip, can destroy the device no matter how careful you are.  Because of this, most ICs are now inserted into sockets.  The sockets are soldered to the PC board before the IC is inserted.", "Soldering an IC, especially a CMOS chip, can destroy the device no matter how careful you are. Because of this, most ICs are now inserted into sockets. The sockets are soldered to the PC board before the IC is inserted."], "jumps": ["P1680", "P1660"]}, {"id": "P1690", "text": ["Before trying to insert an IC, you should check that its legs are straight and evenly spaced."], "jumps": ["P1700", "P1670"]}, {"id": "P1700", "text": ["On a IC, pin 1 is identified by a dot or notch located on the upper surface of the IC.  Pin numbers run sequentially from the dot or notch in a counterclockwise direction.", "On a IC, pin 1 is identified by a dot or notch located on the upper surface of the IC. Pin numbers run sequentially from the dot or notch in a counterclockwise direction."], "jumps": ["P1710", "P1670"]}, {"id": "P1710", "text": ["Inserting a chip backwards can destroy the chip.  To insert the IC, line up all its legs with the socket connectors then press it down gently.", "Inserting a chip backwards can destroy the chip. To insert the IC, line up all its legs with the socket connectors then press it down gently."], "jumps": ["P1720", "P1670"]}, {"id": "P3160", "text": ["At this point you should see address values being displayed on the screen.  The microprocessor is checking all of the memory locations.  So far it seems as though the keyboard and the display are working properly.", "At this point you should see address values being displayed on the screen. The microprocessor is checking all of the memory locations. So far it seems as though the keyboard and the display are working properly."], "jumps": ["P3170", "P3150"]}, {"id": "P1720", "text": ["Check visually, that all legs have begun to slide into their appropriate socket locations before pushing the IC in the rest of  the way.", "Check visually, that all legs have begun to slide into their appropriate socket locations before pushing the IC in the rest of the way."], "jumps": ["P1730", "P1670"]}, {"id": "P1730", "text": ["Use a chip extractor to remove an IC.  When this tool is not available use a small flat tip screwdriver, carefully prying at either end of the chip until it can be removed in a straight upward    fashion.", "Use a chip extractor to remove an IC. When this tool is not available use a small flat tip screwdriver, carefully prying at either end of the chip until it can be removed in a straight upward fashion."], "jumps": ["P1750", "P1720"]}, {"id": "P1750", "text": ["There are IC insertion and removal tools available that make insertion and removal simple.", "Thus far, we have discussed troubleshooting and corrective maintenance."], "jumps": ["P1760", "P1730", "P1770", "P1750"]}, {"id": "P1780", "text": ["As the name implies, this maintenance is accomplished before the system has a chance to fail.  For example, suppose that your microprocessor is operating correctly, there are no signs of system failure.", "As the name implies, this maintenance is accomplished before the system has a chance to fail. For example, suppose that your microprocessor is operating correctly, there are no signs of system failure."], "jumps": ["P1790", "P1760"]}, {"id": "P1790", "text": ["However, you decide to measure the output voltages of the power supply once a month.  One month you find the measurements show that the usual +5V to each chip is now measuring +8V.", "However, you decide to measure the output voltages of the power supply once a month. One month you find the measurements show that the usual +5V to each chip is now measuring +8V."], "jumps": ["P1800", "P1760"]}, {"id": "P1800", "text": ["Even though the system operates correctly, the output voltage may eventually damage some of the chips in the microprocessor system."], "jumps": ["P1810", "P1760"]}, {"id": "P1810", "text": ["To eliminate this possible problem you decide to adjust the power supply.  This process is known as preventative maintenance.", "To eliminate this possible problem you decide to adjust the power supply. This process is known as preventative maintenance."], "jumps": ["P1820", "P1760"]}, {"id": "P1830", "text": ["When a printed circuit board becomes coated by a layer of dust, the particles act as an insulator and traps heat close to the components."], "jumps": ["P1840", "P1820"]}, {"id": "P1852", "text": ["Preventative maintenance is performed on a regular time schedule before something breaks."], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P3270", "text": ["Now that you have seen a fault that can go potentially undetected, let's see one that definitely cannot."], "jumps": ["P3280", "P3240"]}, {"id": "P3290", "text": ["2.  The computer may now insert a fault.", "2. The computer may now insert a fault.ult. the PC1 DC switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P3280"]}, {"id": "P3310", "text": ["On this display of the 68000 microprocessor system, you should see all kinds of things that are not what you should be seeing."], "jumps": ["P3320", "P3300"]}, {"id": "P3320", "text": ["Basically, something is causing garbage to be displayed on the screen of the system.  Think for a second of what could do this?", "Basically, something is causing garbage to be displayed on the screen of the system. Think for a second of what could do this?"], "jumps": ["P3330", "P3310"]}, {"id": "P3330", "text": ["In this situation, an important signal has an open to the display circuitry.  The A1 line from the microprocessor has an open just before it reached the display circuitry.", "In this situation, an important signal has an open to the display circuitry. The A1 line from the microprocessor has an open just before it reached the display circuitry."], "jumps": ["P3340", "P3310"]}, {"id": "P3340", "text": ["This causes the address values to the display circuitry to be incorrect."], "jumps": ["P3350", "P3330"]}, {"id": "P3350", "text": ["4.  Connect a jumper from the A1 test point on the PC130-403 to         the A1 connector on the PC130-404 Display and Keypad.  The       connection is the third one down from the top on the bank of         test points to the right of the actual display.", "To eliminate this possible problem you decide to adjust the power supply.  This process is known as preventative maintenance.", "4. Connect a jumper from the A1 test point on the PC130-403 to the A1 connector on the PC130-404 Display and Keypad. The connection is the third one down from the top on the bank of test points to the right of the actual display.", "To eliminate this possible problem you decide to adjust the power supply. This process is known as preventative maintenance."], "jumps": ["P3360", "P3330"]}, {"id": "P1820", "text": ["Another preventative maintenance action is routine cleaning. Dust adheres to printed circuit boards."], "jumps": ["P1830", "P1760"]}, {"id": "P1851", "text": ["Scheduled preventative maintenance has been proven to reduce equipment failure."], "jumps": ["P1850", "P1820"]}, {"id": "P1850", "text": ["Which type of maintenance is performed when something breaks?"], "jumps": ["P1840"]}, {"id": "P3040", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P3020"]}, {"id": "P1853", "text": ["When something breaks corrective maintenance is performed to evaluate and to eliminate bad components."], "jumps": []}, {"id": "P1860", "text": ["This lesson is not going to teach you how to use all of the most common troubleshooting tools, but will introduce them to you.", "Logic Clip Multimeter IC Inserter Logic Probe IC Extractor Logic Pulser Oscilloscope Current Tracer Logic Analyzer Soldering Iron Signature Analyzertline of the State of Texas..s when picking them up, try to only touch the body.ouch the chip's pins when picking them up, try to only touch the body.body..re from the system.rce crystals to vibrate at the wrong frequency. 5. The system should always be turned off before attaching or detaching hardware from the system.rned off before attaching or detaching hardware from the system."], "jumps": ["P1910", "P1850"]}, {"id": "P1910", "text": ["This completes the information on TROUBLESHOOTING.", "This completes the information on TROUBLESHOOTING.E........"], "jumps": ["P1860"]}, {"id": "P1920", "text": ["1.  The four step troubleshooting process is:", "1. The four step troubleshooting process is: line here....", "Analyze the system Recheck the setup Measure and test the system Double check your results", "Troubleshooting Steps Recheck the setup Measure and test the system Double check your results"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Preventative maintenance is regularly checking an equipment       to avoid problems in the future.", "2. Preventative maintenance is regularly checking an equipment to avoid problems in the future."], "jumps": ["P1999", "P1920"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": []}, {"id": "P2001", "text": ["A computer repair technician must select tools to use which are appropriate to the troubleshooting task."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["Often you will choose tools that you are familiar with.  However, knowing how to use other tools can speed up the troubleshooting process.", "Often you will choose tools that you are familiar with. However, knowing how to use other tools can speed up the troubleshooting process."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["In your studies of electronics, you have learned that multimeters and oscilloscopes are valuable in determining correct circuit operation and for troubleshooting faulted circuits."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["In each area of electronics, different types of test equipment provide the best means for circuit measurements.  Digital or microprocessor electronics are not exceptions.", "In each area of electronics, different types of test equipment provide the best means for circuit measurements. Digital or microprocessor electronics are not exceptions."], "jumps": ["P2060", "P2020"]}, {"id": "P2060", "text": ["In DC circuits, the multimeter is the best choice for measuring circuit values of voltage, current and resistance.  In AC circuits, the oscilloscope is most valuable for determining the characteristics of various waveforms.", "In DC circuits, the multimeter is the best choice for measuring circuit values of voltage, current and resistance. In AC circuits, the oscilloscope is most valuable for determining the characteristics of various waveforms."], "jumps": ["P2070", "P2020"]}, {"id": "P2070", "text": ["In digital electronics, the oscilloscope and multimeter are used, along with several other types of test instruments.  In this course, the multimeter, oscilloscope and logic probe have been used.", "In digital electronics, the oscilloscope and multimeter are used, along with several other types of test instruments. In this course, the multimeter, oscilloscope and logic probe have been used."], "jumps": ["P2080", "P2020"]}, {"id": "P2080", "text": ["Other types of test equipment are available.  The testing of digital circuitry is different from analog circuitry in several ways.", "Other types of test equipment are available. The testing of digital circuitry is different from analog circuitry in several ways."], "jumps": ["P2090", "P2020"]}, {"id": "P2090", "text": ["Digital circuits use low DC voltages; 0, 5 and 12 VDC are most common.  Digital circuits normally do not have AC voltages present.  Digital circuits do not require resistance checks due to the design of the ICs.", "Digital circuits use low DC voltages; 0, 5 and 12 VDC are most common. Digital circuits normally do not have AC voltages present. Digital circuits do not require resistance checks due to the design of the ICs."], "jumps": ["P2100", "P2020"]}, {"id": "P2100", "text": ["Digital circuits often rely on timing.  Since ICs can not be repaired, measuring input and output signals is the troubleshooting method used.", "Digital circuits often rely on timing. Since ICs can not be repaired, measuring input and output signals is the troubleshooting method used."], "jumps": ["P2110", "P2020"]}, {"id": "P2110", "text": ["Because of these differences, several special types of digital test instruments have been developed.  Before discussing the specialized test instruments let's first examine the multimeter and the oscilloscope.", "Because of these differences, several special types of digital test instruments have been developed. Before discussing the specialized test instruments let's first examine the multimeter and the oscilloscope."], "jumps": ["P2120", "P2020"]}, {"id": "P2120", "text": ["The multimeter is the most commonly used test instrument in DC and AC circuits.  However, it is not the most commonly used test instrument in digital circuits.", "The multimeter is the most commonly used test instrument in DC and AC circuits. However, it is not the most commonly used test instrument in digital circuits."], "jumps": ["P2130", "P2020"]}, {"id": "P2130", "text": ["Multimeters measure DC and AC voltage, DC and AC current and resistances.  Some even test transistors, diodes and capacitors.", "Multimeters measure DC and AC voltage, DC and AC current and resistances. Some even test transistors, diodes and capacitors."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["In digital electronics, multimeters are used primarily to measure operating power, that is Vcc, and check for open or shorted wires on PC cards.  Vcc is normally a DC voltage between 5 and 12 volts.", "In digital electronics, multimeters are used primarily to measure operating power, that is Vcc, and check for open or shorted wires on PC cards. Vcc is normally a DC voltage between 5 and 12 volts."], "jumps": ["P2150", "P2120"]}, {"id": "P2150", "text": ["The trend in digital electronics is to use the lowest Vcc values that the chips can run on.  Many circuits today are being designed to run on 1 volt, which represents a high condition.", "The trend in digital electronics is to use the lowest Vcc values that the chips can run on. Many circuits today are being designed to run on 1 volt, which represents a high condition."], "jumps": ["P2160", "P2120"]}, {"id": "P2160", "text": ["PC card wires are checked by measuring continuity between points on the card.  Continuity indicates a good connection, no continuity indicates an open wire.", "PC card wires are checked by measuring continuity between points on the card. Continuity indicates a good connection, no continuity indicates an open wire."], "jumps": ["P2170", "P2120"]}, {"id": "P2170", "text": ["The logic highs and lows may also be measured using a multimeter.  A high is normally between 2 and 12 VDC and a low is between 0 and 2 VDC.  Remember, you must have knowledge about the IC technology you are troubleshooting.", "The logic highs and lows may also be measured using a multimeter. A high is normally between 2 and 12 VDC and a low is between 0 and 2 VDC. Remember, you must have knowledge about the IC technology you are troubleshooting."], "jumps": ["P2180", "P2120"]}, {"id": "P2180", "text": ["Many have different ranges of values that represent high and low conditions.  As long as the logic levels are constant, a multimeter will give an accurate reading of HIGH or LOW.", "Many have different ranges of values that represent high and low conditions. As long as the logic levels are constant, a multimeter will give an accurate reading of HIGH or LOW."], "jumps": ["P2190", "P2120"]}, {"id": "P2190", "text": ["If the levels are changing (pulse inputs and outputs) the multimeter is of little use.  Since there are other means to measure operating voltages and logic levels, the multimeter is not used very often, only for continuity checks.", "If the levels are changing (pulse inputs and outputs) the multimeter is of little use. Since there are other means to measure operating voltages and logic levels, the multimeter is not used very often, only for continuity checks."], "jumps": ["P2200", "P2120"]}, {"id": "P2200", "text": ["The oscilloscope is a lot more expensive than the multimeter, however, there are not many electronic shops that do not have at least one."], "jumps": ["P2210", "P2120"]}, {"id": "P2210", "text": ["The oscilloscope gives a visual display of a voltage waveform and measures AC and DC voltages, periods and phase.  In digital circuits, the oscilloscope is one of the most versatile instruments.", "The oscilloscope gives a visual display of a voltage waveform and measures AC and DC voltages, periods and phase. In digital circuits, the oscilloscope is one of the most versatile instruments."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["The oscilloscope can detect abnormalities in waveforms that other instruments cannot detect.  Characteristics such as amplitude, rise and fall times, pulse width, period and frequency can be quickly determined from oscilloscope measurements.", "The oscilloscope can detect abnormalities in waveforms that other instruments cannot detect. Characteristics such as amplitude, rise and fall times, pulse width, period and frequency can be quickly determined from oscilloscope measurements."], "jumps": ["P2230", "P2200"]}, {"id": "P2230", "text": ["An oscilloscope can also be used to measure the logic highs and lows which are DC values.  In addition, pulse and square waves can be measured.", "An oscilloscope can also be used to measure the logic highs and lows which are DC values. In addition, pulse and square waves can be measured."], "jumps": ["P2240", "P2200"]}, {"id": "P2240", "text": ["One of the big advantages of using a dual trace oscilloscope is that two waveforms can be measured at the same time.  In this way, time relationships can be analyzed.", "One of the big advantages of using a dual trace oscilloscope is that two waveforms can be measured at the same time. In this way, time relationships can be analyzed."], "jumps": ["P2250", "P2200"]}, {"id": "P2250", "text": ["However, the oscilloscope has one disadvantage when used in microprocessor systems.  Only one or two waveforms can usually be displayed at one time.  This disadvantage is overcome by using an oscilloscope multiplexer.", "However, the oscilloscope has one disadvantage when used in microprocessor systems. Only one or two waveforms can usually be displayed at one time. This disadvantage is overcome by using an oscilloscope multiplexer."], "jumps": ["P2260", "P2200"]}, {"id": "P2260", "text": ["The multiplexer allows up to 16 signals to be viewed on the oscilloscope at the same time.  If you were trying to check the output of the data bus, you can see where being able to look at all the lines can be important.", "The multiplexer allows up to 16 signals to be viewed on the oscilloscope at the same time. If you were trying to check the output of the data bus, you can see where being able to look at all the lines can be important."], "jumps": ["P2270", "P2200"]}, {"id": "P2270", "text": ["The logic probe is the least expensive of all digital test  instruments.  It is especially designed to be used with digital circuits.", "The logic probe is the least expensive of all digital test instruments. It is especially designed to be used with digital circuits."], "jumps": ["P2271", "P2200"]}, {"id": "P2271", "text": ["This is due to the inherent inability of the human eye to see changes in the LEDs at high clock rates."], "jumps": ["P2272", "P2270"]}, {"id": "P2272", "text": ["Consider the common incandescent light bulb in a home or office.  When the light is switched on, a voltage is applied to the bulb at a 60 Hz rate.  The bulb is actually turning on and off 60 times a second; too fast for the human eye to recognize.", "Consider the common incandescent light bulb in a home or office. When the light is switched on, a voltage is applied to the bulb at a 60 Hz rate. The bulb is actually turning on and off 60 times a second; too fast for the human eye to recognize."], "jumps": ["P2280", "P2270"]}, {"id": "P2280", "text": ["Logic probes only measure logic levels, not DC voltage levels. The probe provides a simple means of measuring highs, lows and pulses."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["The probe is nothing more than one or more LED indicators that illuminate for certain types of signals.  A logic probe can indicate a high signal, a low signal, single pulse, multiple pulses or an open or bad level.", "The probe is nothing more than one or more LED indicators that illuminate for certain types of signals. A logic probe can indicate a high signal, a low signal, single pulse, multiple pulses or an open or bad level."], "jumps": ["P2300", "P2270"]}, {"id": "P2300", "text": ["Although logic probes can be useful when troubleshooting digital circuits, they are most effective when troubleshooting individual logic gates at slow clock speeds.", "The logic analyzer is basically a special type of multichannel oscilloscope that has the ability to display logic levels, pulse trains of highs and lows, in several formats."], "jumps": ["P2310", "P2270", "P2320"]}, {"id": "P2320", "text": ["Logic analyzers are expensive and only used in complex digital circuits.  One type of format is the TIMING DIAGRAM.  Several pulse waveforms are displayed in the correct time relationship.", "Logic analyzers are expensive and only used in complex digital circuits. One type of format is the TIMING DIAGRAM. Several pulse waveforms are displayed in the correct time relationship."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["Dual channel oscilloscopes, in most cases, can only display two waveforms.  The second type of format is the BIT or BIT PATTERN.", "Dual channel oscilloscopes, in most cases, can only display two waveforms. The second type of format is the BIT or BIT PATTERN."], "jumps": ["P2340", "P2310"]}, {"id": "P2340", "text": ["The sequence of 1s and 0s from a functional circuit can be compared to the pattern of a faulty circuit to detect errors. Oscilloscopes and logic probes cannot do this."], "jumps": ["P2350", "P2310"]}, {"id": "P2350", "text": ["Another type of format that may be included on some logic analyzers is the CODED format.  The coded format changes the ones and zeros to either octal or hexadecimal code.", "Another type of format that may be included on some logic analyzers is the CODED format. The coded format changes the ones and zeros to either octal or hexadecimal code."], "jumps": ["P2360", "P2310"]}, {"id": "P2360", "text": ["The code for a particular point in a circuit can then be compared to a given code in a technical manual or to the code present in a functional circuit.  Any differences between the measured code and the reference code indicates a fault.", "The code for a particular point in a circuit can then be compared to a given code in a technical manual or to the code present in a functional circuit. Any differences between the measured code and the reference code indicates a fault."], "jumps": ["P2370", "P2310"]}, {"id": "P2370", "text": ["The signature analyzer is somewhat like the logic analyzer without the waveform display.  It uses the coded format by measuring pulse trains of highs and lows.", "The signature analyzer is somewhat like the logic analyzer without the waveform display. It uses the coded format by measuring pulse trains of highs and lows."], "jumps": ["P2380", "P2310"]}, {"id": "P2380", "text": ["Signature analyzers are used to locate faults to the component level in microprocessor based systems.  The instrument converts a series of ones and zeros at a given test point to a hexadecimal code.", "Signature analyzers are used to locate faults to the component level in microprocessor based systems. The instrument converts a series of ones and zeros at a given test point to a hexadecimal code."], "jumps": ["P2390", "P2370"]}, {"id": "P2390", "text": ["The code is called the signature for that particular test point.  Then, by comparing the signature to the known signature, you can identify faults.", "The code is called the signature for that particular test point. Then, by comparing the signature to the known signature, you can identify faults."], "jumps": ["P2400", "P2370"]}, {"id": "P2400", "text": ["Again, the signature analyzer is only used in very complex circuits where the cost of the instrument can be justified."], "jumps": ["P2410", "P2370"]}, {"id": "P2410", "text": ["The current tracer and logic pulser are very simple test instruments that measure pulsating current at a particular point in a circuit.  Their appearance is very similar to the logic probe depending on the manufacturer.", "The current tracer and logic pulser are very simple test instruments that measure pulsating current at a particular point in a circuit. Their appearance is very similar to the logic probe depending on the manufacturer."], "jumps": ["P2420", "P2370"]}, {"id": "P2420", "text": ["The current tracer and logic pulser are used to find points in a digital circuit that are stuck, that is, the point remains at a logic 1 or 0 all the time."], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["It is particularly difficult to isolate a bad IC component when several components are connected together.  The current tracer and logic pulser make the job easier.", "It is particularly difficult to isolate a bad IC component when several components are connected together. The current tracer and logic pulser make the job easier."], "jumps": ["P2440", "P2410"]}, {"id": "P2440", "text": ["The logic pulser is used to inject a pulsating signal into the circuit if normal signal levels remain at a high, low or floating state.  The current tracer is used to trace the current paths through the circuit.", "The logic pulser is used to inject a pulsating signal into the circuit if normal signal levels remain at a high, low or floating state. The current tracer is used to trace the current paths through the circuit."], "jumps": ["P2450", "P2410"]}, {"id": "P2450", "text": ["An LED on the current tracer illuminates when the signal at a particular point is pulsating.  No LED indication indicates a fault and by signal tracing, the bad component can be located.", "An LED on the current tracer illuminates when the signal at a particular point is pulsating. No LED indication indicates a fault and by signal tracing, the bad component can be located."], "jumps": ["P2460", "P2410"]}, {"id": "P2460", "text": ["The logic clip is also a very simple tool used to determine logic levels on an IC.  The clip attaches to an IC where it makes contact with each pin.", "The logic clip is also a very simple tool used to determine logic levels on an IC. The clip attaches to an IC where it makes contact with each pin."], "jumps": ["P2470", "P2410"]}, {"id": "P2470", "text": ["On the logic clip are LEDs or lamps or just pins, one for each pin connection to the IC.  The LED or lamp illuminates brightly for a high and is off for a low.  A pulsing signal is identified by either a  dimly illuminated LED or one that is rapidly blinking.", "On the logic clip are LEDs or lamps or just pins, one for each pin connection to the IC. The LED or lamp illuminates brightly for a high and is off for a low. A pulsing signal is identified by either a dimly illuminated LED or one that is rapidly blinking."], "jumps": ["P2480", "P2460"]}, {"id": "P2480", "text": ["Even though test instruments provide vital information on the operation of a microprocessor, there are other tools a technician can use to make their job easier."], "jumps": ["P2490", "P2460"]}, {"id": "P2490", "text": ["Visual inspections must be performed carefully before, during, and after troubleshooting.  Visual inspections identify mechanical damage, heat damage, misuse, etc.", "Visual inspections must be performed carefully before, during, and after troubleshooting. Visual inspections identify mechanical damage, heat damage, misuse, etc."], "jumps": ["P2500", "P2480"]}, {"id": "P2500", "text": ["Before you even test a circuit using the test instruments, you should look for damaged components.  A burnt resistor is a sure sign of a problem, and not necessarily a bad resistor!", "Before you even test a circuit using the test instruments, you should look for damaged components. A burnt resistor is a sure sign of a problem, and not necessarily a bad resistor!"], "jumps": ["P2520", "P2480"]}, {"id": "P2520", "text": ["After troubleshooting and repair you should do another visual inspection to ensure that the repair process did not cause any damage to the system."], "jumps": ["P2530", "P2480"]}, {"id": "P2530", "text": ["Diagnostic routines are programs used in the microprocessor to test out the system.  These programs are normally supplied by the system manufacturer.  If not, and you know how to program a microprocessor, your own diagnostic routines can be written.", "Diagnostic routines are programs used in the microprocessor to test out the system. These programs are normally supplied by the system manufacturer. If not, and you know how to program a microprocessor, your own diagnostic routines can be written."], "jumps": ["P2540", "P2480"]}, {"id": "P2540", "text": ["The only disadvantage of diagnostic programs is that the microprocessor system must operate well enough to load and execute a program."], "jumps": ["P2550", "P2480"]}, {"id": "P2550", "text": ["The advantage of diagnostic routines is time saving.  Most diagnostic programs will, at a minimum, identify what section is faulted.", "The advantage of diagnostic routines is time saving. Most diagnostic programs will, at a minimum, identify what section is faulted."], "jumps": ["P2560", "P2480"]}, {"id": "P2560", "text": ["Some diagnostic routines even identify which component is faulted!  No troubleshooting is required.", "Some diagnostic routines even identify which component is faulted! No troubleshooting is required."], "jumps": ["P2570", "P2480"]}, {"id": "P2570", "text": ["If you need to measure a pulsating signal to see if it is oscillating at the proper frequency, which piece of equipment would be most effective in attaining this information?"], "jumps": ["P2480"]}, {"id": "P2571", "text": [], "jumps": []}, {"id": "P2572", "text": ["The multimeter could indicate a voltage level, however, we are looking for a frequency.  The multimeter cannot be used to determine frequency.", "The multimeter could indicate a voltage level, however, we are looking for a frequency. The multimeter cannot be used to determine frequency."], "jumps": []}, {"id": "P2573", "text": ["Some logic probes can indicate if a signal is pulsating or not.  However they cannot measure frequencies.", "Some logic probes can indicate if a signal is pulsating or not. However they cannot ave completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2940"]}, {"id": "P3001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1290", "text": ["Also, if calculations had to be performed in Step 1, double check them.  You are looking for any obvious mistakes.", "Also, if calculations had to be performed in Step 1, double check them. You are looking for any obvious mistakes. test equipment.", "Did you plug the system into a power source? Is there power to the wall outlet? Are you operating the system correctly? Are you using the test equipment correctly?"], "jumps": ["P1300", "P1240"]}, {"id": "P1410", "text": ["You must be extremely careful to avoid introducing any additional faults into the system when mishandling sensitive devices."], "jumps": ["P1420", "P1400"]}, {"id": "P1500", "text": ["The reason that you don't get seriously injured from this shock is because there is very little current associated with it.  Current kills, not voltage.", "The reason that you don't get seriously injured from this shock is because there is very little current associated with it. Current kills, not voltage."], "jumps": ["P1510", "P1430"]}, {"id": "P1590", "text": ["Other manufacturer's may put their name on the ICS, like; NEC, Intel or Toshiba."], "jumps": ["P1600", "P1580"]}, {"id": "P1680", "text": ["In this way, chips can be inserted and removed without soldering.", "Another type of maintenance is called Preventative Maintenance."], "jumps": ["P1690", "P1670", "P1780", "P1760"]}, {"id": "P3360", "text": ["5.  Press reset, 0 and 0.", "5. Press reset, 0 and 0.ere..............................."], "jumps": ["P3370", "P3350"]}, {"id": "P3370", "text": ["6.  This display should now be working properly.  Remove the            wire.", "6. This display should now be working properly. Remove the wire."], "jumps": ["P3380", "P3360"]}, {"id": "P3380", "text": ["The display should stop working. umps": ["P3210", "P3190"]}, {"id": "P3210", "text": ["There could be many reasons why the LEDs are not illuminated, this part of the I/O chip could be bad, all the LEDs could have burned out for some reason, someone could have put all the LEDs in backwards, or there may be a ground problem."], "jumps": ["P3220", "P3200"]}, {"id": "P3220", "text": ["In this case there is a faulty ground.  Let's fix the fault and see if the problem is removed.", "In this case there is a faulty ground. Let's fix the fault and see if the problem is removed."], "jumps": ["P3230", "P3200"]}, {"id": "P3230", "text": ["13.  The computer may now insert or remove a fault.", "13. The computer may now insert or remove a fault.PC1 DC switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P3200"]}, {"id": "P3240", "text": ["The LEDs on port J3 should now be illuminated.  If not, press reset, 0 and 1.  This will rerun the parallel test.  As you can see, if you hadn't checked the parallel portion of the circuit you may have never noticed an error in the system operation.", "The LEDs on port J3 should now be illuminated. If not, press reset, 0 and 1. This will rerun the parallel test. As you can see, if you hadn't checked the parallel portion of the circuit you may have never noticed an error in the system operation."], "jumps": ["P3250", "P3230"]}, {"id": "P3250", "text": ["Errors like this possibly can go undetected for some time if that function of the microprocessor isn't utilized."], "jumps": ["P3260", "P3240"]}, {"id": "P3260", "text": ["Had this problem been caused by any of the other previously mentioned reasons, you would go through the list, one by one, selecting the easiest ones first."], "jumps": ["P3270", "P3240"]}, {"id": "P3270", "text": ["Now that you have seen a fault that can go potentially undetected, let's see one that definitely cannot."], "jumps": ["P3280", "P3240"]}, {"id": "P3280", "text": ["1.  Press Reset on the 68000 microprocessor trainer.", "1. Press Reset on the 68000 microprocessor trainer........"], "jumps": ["P3290", "P3240"]}, {"id": "P3290", "text": ["2.  The computer may now insert a fault.", "2. The computer may now insert a fault.ult. the PC1 DC switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P3280"]}, {"id": "P3300", "text": ["3.  Press 0 and 0.", "3. Press 0 and 0. text here..............................."], "jumps": ["P3310", "P3290"]}, {"id": "P3310", "text": ["On this display of the 68000 microprocessor system, you should see all kinds of things that are not what you should be seeing."], "jumps": ["P3320", "P3300"]}, {"id": "P3320", "text": ["Basically, something is causing garbage to be displayed on the screen of the system.  Think for a second of what could do this?", "Basically, something is causing garbage to be displayed on the screen of the system. Think for a second of what could do this?"], "jumps": ["P3330", "P3310"]}, {"id": "P3330", "text": ["In this situation, an important signal has an open to the display circuitry.  The A1 line from the microprocessor has an open just before it reached the display circuitry.", "In this situation, an important signal has an open to the display circuitry. The A1 line from the microprocessor has an open just before it reached the display circuitry."], "jumps": ["P3340", "P3310"]}, {"id": "P3340", "text": ["This causes the address values to the display circuitry to be incorrect."], "jumps": ["P3350", "P3330"]}, {"id": "P3350", "text": ["4.  Connect a jumper from the A1 test point on the PC130-403 to         the A1 connector on the PC130-404 Display and Keypad.  The       connection is the third one down from the top on the bank of         test points to the right of the actual display.", "4. Connect a jumper from the A1 test point on the PC130-403 to the A1 connector on the PC130-404 Display and Keypad. The let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
