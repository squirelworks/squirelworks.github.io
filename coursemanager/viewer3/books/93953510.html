or diode tester.........."], "jumps": ["P1100", "P1070", "P1310", "P1270"]}, {"id": "P1340", "text": ["was used, the base to collector junction could cause a low resistance reading if polarity wasn't observed. In the event a low mea1", "Notice that if an analog meter was used the base to collector junction could cause a low resistance reading if polarity wasn't observed. In the event a low resistance is measured between TP3 and ground, reversing the ohmmeter leads would reverse bias the transistor junction for a more accurate reading."], "jumps": ["P1350", "P1310"]}, {"id": "P1130", "text": ["The same test holds true for the Base-to-Collector junction.  Low resistance or current flow one way.", "The same test holds true for the Base-to-Collector junction. Low resistance or current flow one way."], "jumps": ["P1140", "P1100"]}, {"id": "P14050", "text": ["Compare the card with the schematic shown.", "If the transistor checks good, the next step is to check circuit  resistances.", "If the transistor checks good, the next step is to check circuit resistances."], "jumps": ["P14060", "P14040", "P1160", "P1100"]}, {"id": "P13300", "text": ["2. Disconnect all test equipment.  \n3. Carefully remove PC130-42. \n4. Return all equipment to its proper storage area.", "2. Disconnect all test equipment. 3. Carefully remove PC130-42. 4. Return all equipment to its proper storage area."], "jumps": ["P13910", "P13290"]}, {"id": "P1170", "text": ["The resistance of R1 is between 0 and 100 kohms, depending on the setting of R1. R1's resistance is measured between TP3 and TP4."], "jumps": ["P1180", "P1150"]}, {"id": "P1180", "text": ["TP4 to TP7 should indicate the resistance of R2, or 12 kW."], "jumps": ["P1190", "P1150"]}, {"id": "P1190", "text": ["R4 can be measured from TP2  to TP1 (ground).  Note, the capacitor doesn't effect the reading because it has almost infinite DC resistance.", "R4 can be measured from TP2 to TP1 (ground). Note, the capacitor doesn't effect the reading because it has almost infinite DC resistance."], "jumps": ["P1200", "P1150"]}, {"id": "P1200", "text": ["Collector resistance is measured from TP6 to TP7.  S1 should be set to OUT to perform this measurement.", "Collector resistance is measured from TP6 to TP7. S1 should be set to OUT to perform this measurement."], "jumps": ["P1210", "P1150"]}, {"id": "P1210", "text": ["The reading should be low and reflect the DC resistance of the coil (half the primary of T1). This measurement should be about 20 W."], "jumps": ["P1220", "P1150"]}, {"id": "P1220", "text": ["Similarly, the secondary can be checked. The resistance from TP5 to TP1 (ground) should also be low, about 25 W.  Exact coil resistances may vary.", "Similarly, the secondary can be checked. The resistance from TP5 to TP1 (ground) should also be low, about 25 W. Exact coil resistances may vary."], "jumps": ["P1230", "P1150"]}, {"id": "P1230", "text": ["Notice R3 has a parallel resistance path, but the effect of 1 kW  in parallel with 25 W  is negligible here.", "Notice R3 has a parallel resistance path, but the effect of 1 kW in parallel with 25 W is negligible here."], "jumps": ["P1240", "P1150"]}, {"id": "P1240", "text": ["These procedures will allow you to locate many of the common faults associated with blocking oscillators.", "What resistance reading should you get from TP6 to TP7?", "What resistance reading should you get from TP6 to TP7?...."], "jumps": ["P1250", "P1150"]}, {"id": "P1251", "text": ["The resistance measurement from TP6 to TP7 should indicate the DC resistance of the coil.", "The resistance measurement from TP6 to TP7 should indicate the DC resistance of the coil.."], "jumps": []}, {"id": "P1260", "text": ["Let's look now at some troubleshooting techniques for a sawtooth generator."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["The sawtooth generator is somewhat easier to troubleshoot than the blocking oscillator. If for no other reason, the fewer components make it easier.", "'}:5 }, {"id": "P1310", "text": ["If the transistor checks good, the next step is to check circuit resistances."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["The same precautions as before should be observed; use a multimeter and watch for parallel resistance paths.", "The same precautions as before should be observed; use a multimeter and watch for parallel resistance paths....."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["R1 can be checked by measuring from TP3 to TP1 (ground)."], "jumps": ["P1340", "P1310"]}, {"id": "P13060", "text": ["S1 provides the option of an inductive kickback diode."], "jumps": ["P13070", "P13040"]}, {"id": "P1350", "text": ["Measuring from TP5 to TP4 indicates the resistance of R2."], "jumps": ["P1360", "P1310"]}, {"id": "P1360", "text": ["In this sawtooth generator, the output waveform is generated by the charging and rapid discharging of C2 or C3, selected by S1."], "jumps": ["P1370", "P1310"]}, {"id": "P1370", "text": ["If the capacitor shorts, the output is grounded and the signal drops to zero. This fault can be verified by measuring from TP4 to TP1 (ground)."], "jumps": ["P1380", "P1310"]}, {"id": "P1380", "text": ["If the capacitor opens, no charge or discharge occurs. The output is a square wave, just like the input.  With C2 open, the circuit is a simple amplifier.", "If the capacitor opens, no charge or discharge occurs. The output is a square wave, just like the input. With C2 open, the circuit is a simple amplifier."], "jumps": ["P1390", "P1310"]}, {"id": "P1390", "text": ["An open capacitor is impossible to detect with an ohmmeter. If the output is ever a square wave, replace the capacitor, and recheck the circuit."], "jumps": ["P1400", "P1310"]}, {"id": "P1400", "text": ["When repaired, always verify correct operation. These procedures will allow you to locate many of the common faults associated with sawtooth generators."], "jumps": ["P1410", "P1310"]}, {"id": "P1410", "text": ["What type of input does this sawtooth generator require?", "What type of input does this sawtooth generator require?..."], "jumps": ["P1310"]}, {"id": "P1411", "text": [], "jumps": []}, {"id": "P1412", "text": ["A sawtooth generator does not require a sine wave input.", "A sawtooth generator does not require a sine wave input...."], "jumps": []}, {"id": "P1413", "text": ["A sawtooth generator does not require a sawtooth input.", "A sawtooth generator does not require a sawtooth input....."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on NON-SINE WAVE OSCILLATOR FAULTS."], "jumps": ["P1001", "P1410"]}, {"id": "P1920", "text": ["1. To determine correct operation of blocking oscillators or                  sawtooth generators, measure the output.", "1. To determine correct operation of blocking oscillators or sawtooth generators, measure the output."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  If the circuit is faulted, check the inputs to the circuits.", "3. Then with power off, check the transistor.", "2. If the circuit is faulted, check the inputs to the circuits.", "3. Then with power off, check the transistor......................"], "jumps": ["P1940", "P1920", "P1950"]}, {"id": "P13235", "text": ["TRANSISTOR CHECK - Normal Base-to-Emitter junction of Q1 should read high resistance or no current flow with the leads connected and the opposite, low resistance or current flow, when the leads are reversed."], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is 100%. Do you want to _________"], "jumps": []}, {"id": "P1960", "text": ["5.  After the fault is repaired, verify normal operation.", "5. After the fault is repaired, verify normal operation."], "jumps": ["P1999", "P1950"]}, {"id": "P1999", "text": ["You have completed the Summary.  \nYou are about to return to the Objective Menu. "id": "P3211", "text": [], "jumps": []}, {"id": "P3212", "text": ["The fault inserted by the computer does not affect the Vcc supply voltage. Ensure your equipment is set to measure DC voltage.", "The fault inserted by the computer does not affect the Vcc supply voltage. Ensure your equipment is set to measure DC voltage............."], "jumps": []}, {"id": "P3220", "text": ["Since Vcc is correct, let's check the input signal.", "Since Vcc is correct, let's check the input signal........."], "jumps": ["P3230", "P3210"]}, {"id": "P3230", "text": ["4. Measure the signal at TP2 with your oscilloscope. \n     Is it a 1 kHz, 5 Vpp square wave?", "4. Measure the signal at TP2 with your oscilloscope. Is it a 1 kHz, 5 Vpp square wave?"], "jumps": ["P3220", "P3235"]}, {"id": "P3231", "text": [], "jumps": []}, {"id": "P3232", "text": ["You should measure a correct signal at TP2. Ensure that your function generator is set up correctly."], "jumps": []}, {"id": "P3235", "text": ["OSCILLOSCOPE LEAD PLACEMENT - Carefully measure the signal at TP2."], "jumps": []}, {"id": "P3240", "text": ["Since the inputs are correct, let's check the transistor.  \n5. Turn PC2 DC Power to OFF. \n6. Disconnect the function generator.", "Since the inputs are correct, let's check the transistor. 5. Turn PC2 DC Power to OFF. 6. Disconnect the function generator."], "jumps": ["P3230"]}, {"id": "P3250", "text": ["7.  Check the Base-to-Emitter junction of Q1 at TP3 and TP4.  Use\n      an analog ohmmeter or a digital meter with a diode test \n      function.  Reverse the leads and check it again. \n\n      Did the Base-to-Emitter junction test OK?", "7. Check the Base-to-Emitter junction of Q1 at TP3 and TP4. Use an analog ohmmeter or a digital meter with a diode test function. Reverse the leads and check it again. Did the Base-to-Emitter junction test OK? igh resistance for one lead polarity and low resistance for the other polarity????"], "jumps": ["P3240", "P2235"]}, {"id": "P3251", "text": [], "jumps": []}, {"id": "P3252", "text": ["Check your equipment and perform the measurements across the Base-to-Emitter junction of Q1 (TP3 to TP4) again.  The Base-to-Emitter junction is not the fault.", "Check your equipment and perform the measurements across the Base-to-Emitter junction of Q1 (TP3 to TP4) again. The Base-to-Emitter junction is not the fault.ance for the other."], "jumps": []}, {"id": "P3260", "text": ["8. Check the Base-to-Collector junction of Q1 at TP3 and TP1.  \n    Use an analog ohmmeter or a digital meter with a diode test \n    function.  Reverse the leads and check it again. \n\n    Did the Base-to-Collector junction test OK?", "8. Check the Base-to-Collector junction of Q1 at TP3 and TP1. Use an analog ohmmeter or a digital meter with a diode test function. Reverse the leads and check it again. Did the Base-to-Collector junction test OK? ??????????????????????????????????????????????????????????????????????????????????????????"], "jumps": ["P3250", "P3265"]}, {"id": "P3261", "text": [], "jumps": []}, {"id": "P3262", "text": ["Check your equipment and perform the measurements across the Base-to-Collector junction of Q1 (TP3 to TP1) again.  The Base-to-Emitter junction is not the fault.", "Check your equipment and perform the measurements across the Base-to-Collector junction of Q1 (TP3 to TP1) again. The Base-to-Emitter junction is not the fault...................."], "jumps": []}, {"id": "P3265", "text": ["TRANSISTOR CHECK - Normal Base-to-Collector junction of Q1 should read high resistance for one lead polarity and low for the other."], "jumps": []}, {"id": "P3270", "text": ["Your measurements indicate transistor Q1 is functioning correctly. Let's make circuit resistance measurements to determine the fault.", "Your measurements indicate transistor Q1 is functioning correctly. Let's make circuit resistance measurements to determine the fault............"], "jumps": ["P3275", "P3260"]}, {"id": "P3275", "text": ["Because R1 is a very high resistance, the computer will isolate it so that absolutely no parallel paths exist.", "Because R1 is a very high resistance, the computer will isolate it so that absolutely no parallel paths exist. External program = SCAN FTR 0 F2 05"], "jumps": ["P3270"]}, {"id": "P3277", "text": ["Because R1 is a very high resistance, the computer will isolate it so that absolutely no parallel paths exist.", "Because R1 is a very high resistance, the computer will isolate it so that absolutely no parallel paths exist. External program = SCAN FTR 0 F2 05"], "jumps": ["P3270"]}, {"id": "P3280", "text": ["9. Using a multimeter, measure the resistance of R1 from TP3       \n     to TP1.  \n     Is R1 faulted?", "9. Using a multimeter, measure the resistance of R1 from TP3 to TP1. Is R1 faulted?????"], "jumps": ["P3270", "P3285"]}, {"id": "P3281", "text": [], "jumps": []}, {"id": "P3282", "text": ["You should measure about 1 MW.  Ensure you are measuring R1 from TP3 to TP1.", "You should measure about 1 MW. Ensure you are measuring R1 from TP3 to TP1......................"], "jumps": []}, {"id": "P3285", "text": ["MEASUREMENT SETUP - Using a multimeter, measure the resistance of R1 from TP3 to TP1........."], "jumps": []}, {"id": "P3290", "text": ["10. Using a multimeter, measure the resistance of R2 from TP5          to TP4.   \n       Is R2 faulted?", "10. Using a multimeter, measure the resistance of R2 from TP5 to TP4. Is R2 faulted?????????"], "jumps": ["P3280", "P3295"]}, {"id": "P3291", "text": [], "jumps": []}, {"id": "P3292", "text": ["You should measure about 15 kW. Ensure you are measuring R2 from TP5 to TP4.", "You should measure about 15 kW. Ensure you are measuring R2 from TP5 to TP4......................"], "jumps": []}, {"id": "P3295", "text": ["MEASUREMENT SETUP - Using a multimeter, measure the resistance of R2 from TP5 to TP4........."], "jumps": []}, {"id": "P3300", "text": ["11. Using an ohmmeter, measure the resistance of C3 from TP4\n      to TP1.  \n      Is C3 faulted?", "11. Using an ohmmeter, measure the resistance of C3 from TP4 to TP1. Is C3 faulted?????????????"], "jumps": ["P3290", "P3305"]}, {"id": "P3301", "text": [], "jumps": []}, {"id": "P3302", "text": ["You should measure zero ohms across C3 because of the fault inserted by the computer. Normally, a capacitor measures infinite resistance."], "jumps": []}, {"id": "P3305", "text": ["MEASUREMENT SETUP - Using an ohmmeter, measure the resistance of C3 from TP4 to TP1..............."], "jumps": []}, {"id": "P3310", "text": ["Your resistance measurement indicates that C3 is shorted. Normally,  C3 would measure infinite resistance.", "Your resistance measurement indicates that C3 is shorted. Normally, C3 would measure infinite resistance."], "jumps": ["P3320", "P3300"]}, {"id": "P3320", "text": ["The computer will now replace C3.  \n1.Turn PC2 DC Power switch to ON.   \n2. Reconnect the function generator.", "The computer will now replace C3. 1.Turn PC2 DC Power switch to ON. 2. Reconnect the function generator."], "jumps": ["P3310"]}, {"id": "P3330", "text": ["11. Measure the output of the sawtooth generator at TP4 on                  PC130-43A.   \n       Is the sawtooth generator functioning correctly?", "11. Measure the output of the sawtooth generator at TP4 on PC130-43A. Is the sawtooth generator functioning correctly??"], "jumps": ["P3320", "P3195"]}, {"id": "P3331", "text": [], "jumps": []}, {"id": "P3332", "text": ["Ensure you are measuring TP4. The computer replaced C3. You should measure a sawtooth output signal with a frequency of 1 kHz."], "jumps": []}, {"id": "P3340", "text": ["Congratulations, you correctly determined C3 was shorted. Troubleshooting becomes easier with experience. Practice makes perfect!"], "jumps": ["P3350", "P3330"]}, {"id": "P3350", "text": ["1. Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................."], "jumps": ["P3340"]}, {"id": "P3360", "text": ["2. Turn t let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
