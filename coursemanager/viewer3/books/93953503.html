xt": ["The operation of a Colpitts oscillator is similar to a Hartley oscillator."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Only the components in the feedback circuit are different.", "Only the components in the feedback circuit are different.i"], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on COLPITTS OSCILLATOR OPERATION..................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": ["P440"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["This is a typical Colpitts oscillator.", "This is a typical Colpitts oscillator......................"], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["The components in the feedback circuit produce an LC oscillator."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The split capacitors identify the oscillator to be a Colpitts."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["To analyze circuit operation, divide the oscillator into its two circuits."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["The amplifier circuit consists of Q1 and its associated components."], "jumps": ["P1065", "P1020"]}, {"id": "P1065", "text": ["A common emitter amplifier is used.  Notice that the transistor is an NPN.", "A common emitter amplifier is used. Notice that the transistor is an NPN."], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["R1 and R2 develop fixed bias on the base of Q1.  R3 is the collector load resistor.", "R1 and R2 develop fixed bias on the base of Q1. R3 is the collector load resistor."], "jumps": ["P1090", "P1020"]}, {"id": "P1090", "text": ["R4 and C4 provide self biasing."], "jumps": ["P1100", "P1020"]}, {"id": "P1100", "text": ["C3 is a coupling capacitor."], "jumps": ["P1110", "P1020"]}, {"id": "P1110", "text": ["Q1output is routed through the feedback circuit to its input."], "jumps": ["P1120", "P1020"]}, {"id": "P1120", "text": ["The feedback circuit consists of L1, C1 and C2.", "The feedback let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
</body>
</html>
