const book = {"title": "9E954D09", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1020", "text": ["You know that some flip-flops are controlled by the clock input. The clock triggers the desired output."], "jumps": ["P1030", "P1001"]}, {"id": "P1221", "text": [], "jumps": []}, {"id": "PQINFO", "text": ["Page # Test# Question# HelpPage # 10210 1 110 30000 10211 1 111 30000 10212 1 112 30000 10213 1 113 30000 10214 1 114 30000 10215 1 115 30000 10216 1 116 30000 10217 1 117 30000 10218 1 118 30000 10219 1 119 30000 10220 2 120 30000 10221 2 121 30000 10222 2 122 30000 10223 2 123 30000 10224 2 124 30000 10225 2 125 30000 10226 2 126 30000 10227 2 127 30000 10228 2 128 30000 10229 2 129 30000 10230 3 130 30000 10231 3 131 30000 10232 3 132 30000 10233 3 133 30000 10234 3 134 30000 10235 3 135 30000 10236 3 136 30000 10237 3 137 30000 10238 3 138 30000 10239 3 139 30000 10240 10241 10242 10243 10244 10245 10246 10247 10248 10249", "Page # Test# Question# HelpPage # 10210 1 110 30000 10211 1 111 30000 10212 1 112 30000 10213 1 113 30000 10214 1 114 30000 10215 1 115 30000 10216 1 116 30000 10217 1 117 30000 10218 1 118 30000 10219 1 119 30000 10220 2 120 30000 10221 2 121 30000 10222 2 122 30000 10223 2 123 30000 10224 2 124 30000 10225 2 125 30000 10226 2 126 30000 10227 2 127 30000 10228 2 128 30000 10229 2 129 30000 10230 3 130 30000 10231 3 131 30000 10232 3 132 30000 10233 3 133 30000 10234 3 134 30000 10235 3 135 30000 10236 3 136 30000 10237 3 137 30000 10238 3 138 30000 10239 3 139 30000", "\"You have successfully passed the assessment", "You skipped X question(s). Do you want to _________", "The test is complete and your score is XX%. Do you want to _________", "You have successfully passed the assessment test!", "Are you sure you want to Bookmark the Lesson?", "Are you sure you want to Exit the Lesson?"], "jumps": ["P3030"]}, {"id": "P300", "text": [], "jumps": []}, {"id": "PINFO", "text": ["04-19-01 Converted from SAM to tbk. frieda 04-19-01 Text and Branching. frieda 04-23-01 graphics by Chris 07-19-01 Converted to ToolBook 8.1 format. jay 08-13-01 review - lisa 01-14-02 Converted to Phase II format. jay", "You have successfully passed the assessment test!"], "jumps": []}, {"id": "P1097", "text": ["The inputs are enabled when the clock is low. Note the bubble on the clock input."], "jumps": ["P1100", "P1095"]}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: FLIP-FLOP TIMING AND SYNCHRONIZATIONdf asdf sadf"], "jumps": []}, {"id": "P1001", "text": ["Nida Corporation - Flip-Flop Timing and Synchronization", "protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P440", "text": ["Let's begin the lesson on FLIP-FLOP TIMING AND SYNCHRONIZATION.............."], "jumps": ["P400"]}, {"id": "P420", "text": ["The most interesting feature of the Master Slave flip-flop is the time delay between the input and output."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["In this lesson you will learn how the Master Slave uses the clock input to control the output."], "jumps": ["P440", "P400"]}, {"id": "P1102", "text": ["The output state will change according to the inputs on J and K as long as the clock stays high. The last high input is held when the clock goes low..."], "jumps": []}, {"id": "P1110", "text": ["Next, let's discuss edge triggering........................"], "jumps": ["P1120", "P1100"]}, {"id": "P410", "text": ["The first flip-flop is called the Master. The second flip-flop is called the Slave."], "jumps": ["P420", "P400"]}, {"id": "P1120", "text": ["Edge triggering uses only the leading or trailing edge of the waveform to gate the inputs to the flip-flop."], "jumps": ["P1130", "P1110"]}, {"id": "P1330", "text": ["Master Slave flip-flops use pulse triggering. The next objective describes their operation in detail."], "jumps": ["P1340", "P1320"]}, {"id": "P1180", "text": ["The clock remains high for T2 but R does not change the output. The output only changes on the leading edge."], "jumps": ["P1190", "P1120"]}, {"id": "P1026", "text": ["Digital circuits are designed to trigger or operate from the leading edge, trailing edge or the width of the input wave form."], "jumps": ["P1020", "P1025"]}, {"id": "P1030", "text": ["The point that a flip-flop recognizes the input clock signal is very important to the final output of the circuit."], "jumps": ["P1040", "P1020"]}, {"id": "P1050", "text": ["Level triggering uses the entire pulse width to gate the inputs to the flip-flop."], "jumps": ["P1060", "P1040"]}, {"id": "P1080", "text": [], "jumps": ["P1082", "P1050"]}, {"id": "P400", "text": ["The Master Slave flip-flop is actually constructed from two flip-flops."], "jumps": ["P410", "P100"]}, {"id": "P1060", "text": ["At T1 the clock is low, disabling inputs S and R. The initial state is Q."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["At T2 the clock goes high enabling the inputs on S and R. The inputs are enabled for the entire pulse width of T2."], "jumps": ["P1080", "P1050"]}, {"id": "P1082", "text": [], "jumps": ["P1084", "P1050"]}, {"id": "P1084", "text": ["The flip-flopping continues for the entire pulse width of T2."], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["At T3 the clock goes low disabling the inputs on S and R. The flip-flop stays in the state recognized just before the clock goes low."], "jumps": ["P1095", "P1050"]}, {"id": "P1095", "text": ["Level triggering can also use the low portion of the clock pulse."], "jumps": ["P1097", "P1050"]}, {"id": "P1100", "text": ["What is the final output state of this level triggered flip-flop?", "<<*)('&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&$ ;", "' #", ";! :::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::", ";!! :"], "jumps": ["P1095"]}, {"id": "P1103", "text": ["In the toggle state, the flip-flop changes state on each different clock pulse, not during a clock pulse."], "jumps": []}, {"id": "P1130", "text": ["Notice the symbol on the clock input. This identifies a leading edge triggered flip-flop."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["Adding a bubble to the clock input identifies a trailing edge triggered flip-flop."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["At T1 the clock is low disabling inputs S and R. The flip-flop stays in a Q state."], "jumps": ["P1160", "P1120"]}, {"id": "P1160", "text": ["At T2 the clock goes high producing a leading edge spike. Any input high at the time of the leading edge is gated through."], "jumps": ["P1170", "P1120"]}, {"id": "P1190", "text": ["At T3 the clock goes low disabling inputs S and R."], "jumps": ["P1200", "P1120"]}, {"id": "P1200", "text": ["If this flip-flop were designed to trigger on the trailing edge of the clock pulse, the output state would be Q."], "jumps": ["P1210", "P1120"]}, {"id": "P1210", "text": ["At T2 the clock goes high and remains high. However, inputs are only gated through on the trailing edge of the pulse."], "jumps": ["P1215", "P1200"]}, {"id": "P1215", "text": ["At T3 the clock goes low producing a trailing edge spike. Any input high at the time of the trailing edge is gated through."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["What is the final output of this edge triggered flip-flop?."], "jumps": ["P1200"]}, {"id": "P1222", "text": ["Even though the clock pulse is high, the flip-flop will not change states after the spike pulse from the leading edge."], "jumps": []}, {"id": "P1230", "text": ["What is the final output state of this edge triggered flip-flop?"], "jumps": ["P1220"]}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1232", "text": ["The flip-flop triggers on the trailing edge. The output state is determined when the clock goes low."], "jumps": []}, {"id": "P1240", "text": ["Last, let's discuss pulse trigger.........................."], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["Notice the symbol on the Q and Q outputs. This identifies a pulse triggered flip-flop."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["The inputs are gated in at the leading edge (edge triggered) or when the clock pulse is high (level triggered)."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["The output is gated out at the trailing edge (edge triggered) or when the clock pulse is low (level triggered)."], "jumps": ["P1284", "P1260"]}, {"id": "P1284", "text": ["The pulse width determines the time delay. Let's look at an edge triggered flip-flop using pulse triggering."], "jumps": ["P1286", "P1260"]}, {"id": "P1286", "text": ["At T1 the clock is low disabling inputs S and R. The output of each flip-flop stays the same."], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["At T2 the clock goes high enabling inputs S and R of flip-flop 1. The output of flip-flop 1 is Set."], "jumps": ["P1295", "P1286"]}, {"id": "P1295", "text": ["Notice, the output of Flip-Flop 2 does not change state. S and R are enabled on the trailing edge of the pulse."], "jumps": ["P1300", "P1286"]}, {"id": "P1300", "text": ["The pulse width of T2 determines the time delay between the leading and trailing edge of the clock pulse."], "jumps": ["P1310", "P1286"]}, {"id": "P1310", "text": ["At T3 the clock goes low. The inputs to flip-flop 2 are enabled. The flip-flop changes state."], "jumps": ["P1320", "P1286"]}, {"id": "P1320", "text": ["What is the final output state of this pulse triggered flip-flop?"], "jumps": ["P1286"]}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1322", "text": ["The input is gated on the leading edge of the clock which is low. The output is gated on the trailing edge of the clock which resets the flip-flop...."], "jumps": []}, {"id": "P1340", "text": ["Before discussing the Master Slave flip-flop, let's look at a common use for the edge triggered JK flip-flop. This circuit detects the sequence in which signals go to a high state."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["Using the edge triggered JK flip-flop one of these is used as the clock input and the other is used as the J inputs."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["If the A input goes high before the B input goes high the Q output will be high."], "jumps": ["P1370", "P1340"]}, {"id": "P1370", "text": ["If the B input goes high before the A input goes high the Q output will be low."], "jumps": ["P1910", "P1360"]}, {"id": "P1910", "text": ["This completes the information on FLIP-FLOP TRIGGERING....."], "jumps": ["P1001", "P1370"]}, {"id": "P1920", "text": ["1. The three types of clock triggering are:d line here...."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. Level triggering uses the entire pulse width to gate the inputs in."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. Edge triggering uses only the leading or trailing edge of the clock pulse to gate the inputs in."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. Pulse triggering uses the leading edge of the clock pulse to gate the input in and the trailing edge of the clock pulse to gate the output out."], "jumps": ["P1999", "P1940"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1950"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["The Master Slave flip-flop is designed to store an input condition until the clock pulse enables an output."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["A Master Slave flip-flop is pulse triggered, using the leading edge or the high level to gate through inputs and the trailing edge or low level to gate through outputs."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["The name Master Slave indicates that the flip-flop has two parts. The first part, Master and the second part, Slave."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["J and K inputs are applied to the Master. The Slave flip-flop only reacts to the Master."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["Let's take a closer look at the actual operation of a Clocked RS Master Slave flip-flop using a level trigger."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["Inputs S and R are applied to the master. The final outputs Q and Q are taken from the slave."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["Inputs S and R to the slave are the Q and Q outputs from the master. The clock input is applied to the master, and inverted and applied to the slave."], "jumps": ["P2090", "P2060"]}, {"id": "P2090", "text": ["When the clock goes high the master inputs are enabled. The output of the master changes based on the inputs applied."], "jumps": ["P2100", "P2060"]}, {"id": "P2110", "text": ["When the clock input goes low the master is disabled. The output of the master can no longer change."], "jumps": ["P2120", "P2060"]}, {"id": "P2120", "text": ["The low clock is inverted and applied to the slave as a high. The slave's inputs are now enabled."], "jumps": ["P2130", "P2060"]}, {"id": "P2130", "text": ["The operation of the edge triggered Clocked RS Master Slave flip-flop is the same as the level triggered Clocked RS Master Slave flip-flop."], "jumps": ["P2140", "P2060"]}, {"id": "P2150", "text": ["The operation of a Type D Master Slave flip-flop is the same as a Clocked RS Master Slave flip-flop."], "jumps": ["P2160", "P2130"]}, {"id": "P2160", "text": ["The Q output of the master is not required since Type D flip-flops only use one input."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["The operation of a JK Master Slave flip-flop is the same as a Clocked RS Master Slave flip-flop."], "jumps": ["P2180", "P2150"]}, {"id": "P2180", "text": ["The master inputs are enabled only when the clock goes high. The slave inputs are enabled only when the clock goes low."], "jumps": ["P2190", "P2170"]}, {"id": "P2200", "text": ["If the flip-flop is set, what are the output states of the master and slave when a high is applied to R and C?"], "jumps": ["P2170"]}, {"id": "P2201", "text": [], "jumps": []}, {"id": "P2202", "text": ["A high clock resets the master. The slave will not change states until the clock goes low."], "jumps": []}, {"id": "P2210", "text": ["What is the output state of the master and slave when the clock goes low?"], "jumps": ["P2200"]}, {"id": "P2211", "text": [], "jumps": []}, {"id": "P2212", "text": ["When the clock goes low, the master inputs are disabled. The slave inputs are enabled."], "jumps": []}, {"id": "P2220", "text": ["What is the output state of this flip-flop when J is low, K is high, C is pulsed, and PRE is low?"], "jumps": ["P2210"]}, {"id": "P2222", "text": ["The PRE and CLR inputs override any input condition........"], "jumps": []}, {"id": "P2230", "text": ["What is the output state of this flip-flop when D is low and C is pulsed?"], "jumps": ["P2220"]}, {"id": "P2231", "text": [], "jumps": []}, {"id": "P2910", "text": ["This completes the information on MASTER SLAVE FLIP-FLOP..."], "jumps": ["P2001", "P2230"]}, {"id": "P2920", "text": ["1. The Master Slave flip-flop is designed to store an input condition until the clock pulse enables an output."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2. Master Slave flip-flops are constructed from two Clocked RS, Type D, or JK flip-flops."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3. When the clock is high the master inputs are enabled and the slave inputs are disabled."], "jumps": ["P2950", "P2930"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.", "Once the general operation of a flip-flop is understood the technician must then look at the ramifications of flip-flop timing. Ignoring flip-flop timing considerations can result in serious data collisions and erratic operation."], "jumps": ["P2001", "P2940", "P3001"]}, {"id": "P3030", "text": ["Two important timing considerations when dealing with flip-flops are the setup and hold times."], "jumps": ["P3020"]}, {"id": "P3040", "text": ["The setup time refers to the length of time that an input must be stable for before it can be clocked through a circuit to guarantee proper operation."], "jumps": ["P3030"]}, {"id": "P3050", "text": ["The hold time refers to the length of time that an input must be stable for after it is clocked through a circuit to guarantee proper operation."], "jumps": ["P3040"]}, {"id": "P3060", "text": ["The typical setup and hold times are shown in the table below:", "Setup Time Hold Time 5 to 50 ns 0 to 10ns"], "jumps": ["P3050"]}, {"id": "P3120", "text": ["The typical transition times for the TTL and CMOS flip-flop are shown below:", "Logic Family Transition Times TTL < 50 ns CMOS < 200 ns"], "jumps": ["P3110"]}, {"id": "P3080", "text": ["The maximum clocking frequency of a flip-flop is the highest frequency that can be used as a clock input and still have the flip-flop trigger reliably."], "jumps": ["P3070"]}, {"id": "P3090", "text": ["Another clock specification is the Clock Pulse High and Low Times. This refers to the minimum time duration that a clock signal must remain in its high and low state.", "<t ><t > w(H) w(L)"], "jumps": ["P3080"]}, {"id": "P3100", "text": ["The manufacture will also specify the length of time that the asynchronous signals must remain in their active state to reliably SET or RESET the flip-flop. This is referred to as the Asynchronous Active Pulse Width."], "jumps": ["P3090"]}, {"id": "P3110", "text": ["The next input timing consideration is the Clock Transition Time or how quickly the clock signal rises and falls. This is important because if the clock input rises too slowly the flip-flop may trigger erratically or not at all."], "jumps": ["P3100"]}, {"id": "P3130", "text": ["The last timing consideration is Propagation Delay. This refers to the maximum time it takes for the output to go to its active state after the proper input is applied. Propagation delay from clock to Q going high. B. Propagation delay from clock to Q going low. C. Propagation delay from set to Q going highhh", "A. Propagation delay from clock to Q going high. B. Propagation delay from clock to Q going low. C. Propagation delay from set to Q going high."], "jumps": ["P3120"]}, {"id": "P3140", "text": ["Note that propagation delays exist when dealing with both the synchronous and asynchronous inputs."], "jumps": ["P3910", "P3130"]}, {"id": "P3699", "text": ["The following 5 questions deal with flip-flop timing considerations."], "jumps": ["P3700", "P3001"]}, {"id": "P3700", "text": ["1. What is the best description for setup time?...........", "Setup time is the time that a signal must be in its active state before being used.", "Setup time is the time required to power the flip-flop.", "Setup time is the time required for the clock to go from a low to a high state."], "jumps": ["P3699"]}, {"id": "P3701", "text": [], "jumps": []}, {"id": "P3702", "text": ["Setup time is the time that a signal must be in its active state before being used."], "jumps": []}, {"id": "P3710", "text": ["2. What is the best description for hold time?............", "Hold time is the time a signal must remain in its active state after being triggered.", "Hold time is the time that a signal must be stable after being triggered.", "Hold time is the time that a signal must remain in its active state to SET or RESET a flip-flop."], "jumps": ["P3700"]}, {"id": "P3711", "text": [], "jumps": []}, {"id": "P3712", "text": ["Hold time is the time a signal must remain in its active state after being triggered."], "jumps": []}, {"id": "P3720", "text": ["3. What is the best description for propagation delay?....", "Is the time it takes for the output to go to its active state after being triggered.", "Is the time it takes for the clock signal to get to the output.", "Is the time it takes for the input of a flip-flop to get to the output."], "jumps": ["P3710"]}, {"id": "P3721", "text": [], "jumps": []}, {"id": "P3722", "text": ["Is the time it takes for the output to go to its active state after being triggered."], "jumps": []}, {"id": "P3730", "text": ["4. What is the best description for maximum clocking frequency?", "The highest frequency that can be applied on the clock input.", "The lowest frequency that can be used on the clock input.", "The maximum frequency that can be output by a flip-flop."], "jumps": ["P3720"]}, {"id": "P3731", "text": [], "jumps": []}, {"id": "P3732", "text": ["The highest frequency that can be applied on the clock input."], "jumps": []}, {"id": "P3740", "text": ["5. What is the best description for Asynchronous Active Pulse Width?", "The time that an asynchronous signal must remain high to set the Q output.", "The time that a synchronous signal must remain in its Low state in order to reliably reset the flip-flop.", "The time that an asynchronous signal must remain in its active state in order to reliably set or reset a flip-flop."], "jumps": ["P3730"]}, {"id": "P3741", "text": [], "jumps": []}, {"id": "P3742", "text": ["The time that an asynchronous signal must remain in its active state in order to reliably set or reset a flip-flop."], "jumps": []}, {"id": "P3799", "text": ["You have completed the Exercise. You are about to return to the Objective Menu......."], "jumps": ["P3001", "P3740"]}, {"id": "P3910", "text": ["This completes the information on FLIP-FLOP TIMING CONSIDERATIONS."], "jumps": ["P3001", "P3130"]}, {"id": "P3920", "text": ["1. The setup and hold times refer to the length of time that an input must be stable before and after the clock input to guarantee proper operation."], "jumps": ["P3930", "P3001"]}, {"id": "P3930", "text": ["2. The maximum clocking frequency of a flip-flop is the highest frequency that can be used as a clock input and still have the flip-flop trigger reliably."], "jumps": ["P3940", "P3920"]}, {"id": "P3940", "text": ["3. The Asynchronous Active Pulse Width refers to the time that the asynchronous signals must remain in their active state to reliably SET or RESET the flip-flop."], "jumps": ["P3950", "P3930"]}, {"id": "P3950", "text": ["4. The Clock Transition Time is how quickly the clock signal rises and falls."], "jumps": ["P3960", "P3940"]}, let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
