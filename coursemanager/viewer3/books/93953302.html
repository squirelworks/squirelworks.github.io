s": []}, {"id": "P410", "text": ["Half and full wave rectifiers convert AC power into pulsating DC power. ............"], "jumps": []}, {"id": "P420", "text": ["The operation of both rectifiers is based on the diode. Diodes conduct when forward biased................"], "jumps": []}, {"id": "P430", "text": ["Let's begin the lesson on FULL AND HALF WAVE RECTIFIER OPERATION. ......"], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The rectifier section of a power supply is where AC power is first converted to DC power. ..........", "Rectifier Input", "Filter Input", "Input Input", "Regulator Input", "Protection Input"], "jumps": []}, {"id": "P1030", "text": ["The rectifier output is pulsating DC that has a ripple frequency..."], "jumps": []}, {"id": "P1031", "text": ["The rectifier output is pulsating DC that has a ripple frequency...", "Rectifier Input", "Filter Input", "Input Input", "Regulator Input", "Protection Input"], "jumps": []}, {"id": "P1035", "text": ["PULSATING DC - Is a current that varies in amplitude but does not reverse polarity. It is not a steady direct current because its' value fluctuates. However, it is not alternating current because the polarity remains the same, either positive or negative........................................................................................................."], "jumps": []}, {"id": "P1040", "text": ["The ripple frequency and the efficiency of the rectifier depend on the type of rectifier circuit used. .........."], "jumps": []}, {"id": "P1050", "text": ["Let's look at half wave rectifier circuits first. Half Wave Full Wave"], "jumps": []}, {"id": "P1060", "text": ["This is a typical half wave rectifier circuit.............."], "jumps": []}, {"id": "P1070", "text": ["The transformer is in the input section and steps up or steps down the AC voltage. .........."], "jumps": []}, {"id": "P1080", "text": [], "jumps": []}, {"id": "P1090", "text": ["RL is the load resistor that develops the output signal."], "jumps": []}, {"id": "P1100", "text": ["Applying AC to the primary of T1 produces AC on the secondary."], "jumps": []}, {"id": "P1110", "text": ["When the AC input voltage is positive, D1 is forward biased and conducts. ............."], "jumps": []}, {"id": "P1120", "text": ["The current flow develops a signal across RL producing an output."], "jumps": []}, {"id": "P1130", "text": ["When the AC input voltage is negative, D1 is reversed biased and does not conduct. ............"], "jumps": []}, {"id": "P1140", "text": [], "jumps": []}, {"id": "P1150", "text": ["A continuous input produces a series of pulses with a frequency that is the same as the input frequency. ............"], "jumps": []}, {"id": "P1160", "text": ["Reversing the diode does not change circuit operation. The diode conducts on the negative alternations producing a negative output. .........."], "jumps": []}, {"id": "P1170", "text": ["To check for normal operation, measure the DC output voltage with a multimeter and compare to the calculated DC output voltage. eeeeeee"], "jumps": []}, {"id": "P1175", "text": ["Since transformers can step up or step down voltage, the DC output voltage is calculated using the voltage on the secondary coil. ........."], "jumps": []}, {"id": "P1180", "text": ["For example, this half wave rectifier produces 19 VDC."], "jumps": []}, {"id": "P1185", "text": ["A 2:1 transformer with the same input voltage produces 9.54 VDC."], "jumps": []}, {"id": "P1187", "text": ["If the input voltage is given as an RMS value, you must convert the voltage to peak using this formula: Vrms Vp = .707"], "jumps": []}, {"id": "P1190", "text": ["The half wave rectifier's efficiency is low because only half of the input signal is used. ........"], "jumps": []}, {"id": "P1200", "text": ["Touch the output signal for this rectifier circuit........."], "jumps": []}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1202", "text": [" let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
