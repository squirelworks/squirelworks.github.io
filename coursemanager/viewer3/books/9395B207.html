he        signals on PC130-90 TP10 and TP11.  These signals are the           information signal in the audio amplifier section of the receiver.", "The signal on PC130-90 TP8 is the output of the demodulator circuit.  It is not a frequency modulated signal.", "The signal on PC130-90 TP8 is the output of the demodulator circuit.  It is not the carrier signal at the center frequency.", "The discriminator demodulator receiver operates as you have learned..........", "4. Using the oscilloscope in the single trace mode, measure the signals on PC130-90 TP10 and TP11. These signals are the information signal in the audio amplifier section of the receiver.", "The signal on PC130-90 TP8 is the output of the demodulator circuit. It is not a frequency modulated signal.", "The signal on PC130-90 TP8 is the output of the demodulator circuit. It is not the carrier signal at the center frequency."], "jumps": ["P15440"]}, {"id": "P15431", "text": ["3.  Using the oscilloscope in the single trace mode, measure the        signal on PC130-90 TP8.  What type of signal is present?", "The signals you are measuring are taken after the diodes.  Since the diodes only allow current flow in one direction and the diodes are in series, the signal would not be out of phase.", "3. Using the oscilloscope in the single trace mode, measure the signal on PC130-90 TP8. What type of signal is present?", "The signals you are measuring are taken after the diodes. Since the diodes only allow current flow in one direction and the diodes are in series, the signal would not be out of phase."], "jumps": ["P15420"]}, {"id": "P15421", "text": ["2.  Using the oscilloscope in the dual trace mode, measure the           signals on PC130-90 TP4 and TP5, note where the test points        are located.  Time/Div set to .2 mS.  What is the phase                       relationship between the two signals?", "2. Using the oscilloscope in the dual trace mode, measure the signals on PC130-90 TP4 and TP5, note where the test points are located. Time/Div set to .2 mS. What is the phase relationship between the two signals?"], "jumps": ["P15410"]}, {"id": "P15413", "text": ["The signal on PC130-90 TP1 and TP3 could be the carrier signal at the center frequency but, the output of the transmitter is modulated."], "jumps": []}, {"id": "P15412", "text": ["The signal on PC130-90 TP1 and TP3 is the input to the receiver. It is not the information signal."], "jumps": []}, {"id": "P15411", "text": ["1.  Using the oscilloscope in the single trace mode, measure the        signal on PC130-90 TP1 and TP3.  Time/Div set at 2 mS.  What         type of signal is present?", "1. Using the oscilloscope in the single trace mode, measure the signal on PC130-90 TP1 and TP3. Time/Div set at 2 mS. What type of signal is present?"], "jumps": ["P15400"]}, {"id": "P15400", "text": ["Note that the adjustments you have made tuned the FM receiver to the FM transmitter.  These types of adjustments are normal procedures in any FM communication system.  Now let's view the signals in the FM receiver.", "Note that the adjustments you have made tuned the FM receiver to the FM transmitter. These types of adjustments are normal procedures in any FM communication system. Now let's view the signals in the FM receiver."], "jumps": ["P15410", "P15390"]}, {"id": "P15390", "text": ["The demodulator or receiver circuits are operating correctly."], "jumps": ["P15400", "P15380"]}, {"id": "P15382", "text": ["Check your adjustments of PC130-86 and PC130-90.  Also check that the function generator is producing a 1 kHz signal, note that there may be some distortion in the output signal.  If you still do not have a 1 kHz output signal, check with your instructor.", "Check your adjustments of PC130-86 and PC130-90. Also check that the function generator is producing a 1 kHz signal, note that there may be some distortion in the output signal. If you still do not have a 1 kHz output signal, check with your instructor."], "jumps": []}, {"id": "P15381", "text": [], "jumps": []}, {"id": "P15380", "text": ["Do you have a 1 kHz output signal from the demodulator which is like the 1 kHz input signal to the modulator?"], "jumps": ["P15370"]}, {"id": "P15370", "text": ["8.  Make slight adjustments to PC130-86 R1 and PC130-90 R8             until no further improvements can be seen.", "8. Make slight adjustments to PC130-86 R1 and PC130-90 R8 until no further improvements can be seen."], "jumps": ["P15380", "P15350"]}, {"id": "P15360", "text": ["7.  On PC130-90, adjust the pink slug of T1 for a maximum                    undistorted output signal on Pin T.  Ensure the signals are in         phase.", "6.  On PC130-90, adjust the blue slug of T1 for a maximum                    undistorted output signal on Pin T.  Ensure the signals are in         phase.", "7. On PC130-90, adjust the pink slug of T1 for a maximum undistorted output signal on Pin T. Ensure the signals are in phase.", "6. On PC130-90, adjust the blue slug of T1 for a maximum undistorted output signal on Pin T. Ensure the signals are in phase."], "jumps": ["P15370", "P15350", "P15360", "P15340"]}, {"id": "P15340", "text": ["5.  Repeat adjusting R1 on PC130-86 and R8 on PC130-90 until           no further improvement can be made.", "5. Repeat adjusting R1 on PC130-86 and R8 on PC130-90 until no further improvement can be made.", "If you do not have an output signal from the demodulator T1 could be misaligned. Continue to the next page, we are going to align T1. ly. We will adjust T1 further on in the lesson...", "NOTE If no signal is present on the output of the demodulator, T1 may be misadjusted to the point where the circuit will not operate correctly. We will adjust T1 further on in the lesson.", "MEASUREMENT SETUP - Adjust R1 for the lowest amount of distortion."], "jumps": ["P15350", "P15330"]}, {"id": "P15330", "text": ["4.  Adjust PC130-86 R1 for the lowest amount of distortion as              viewed on CH2.", "4. Adjust PC130-86 R1 for the lowest amount of distortion as viewed on CH2.", "If no signal is present on the output of the demodulator, T1 may be misadjusted to the point where the circuit will not operate correctly. We will adjust T1 further on in the lesson...", "NOTE If no signal is present on the output of the demodulator, T1 may be misadjusted to the point where the circuit will not operate correctly. We will adjust T1 further on in the lesson.", "MEASUREMENT SETUP - Adjust R8 for the lowest amount of distortion."], "jumps": ["P15340", "P15320", "P15335"]}, {"id": "P15320", "text": ["3.  Adjust PC130-90 R8 for the lowest amount of distortion as              viewed on CH2.", "3. Adjust PC130-90 R8 for the lowest amount of distortion as viewed on CH2.", "If no signal is present on the output of the demodulator, T1 may be misadjusted to the point where the circuit will not operate correctly. We will adjust T1 further on in the lesson...", "NOTE If no signal is present on the output of the demodulator, T1 may be misadjusted to the point where the circuit will not operate correctly. We will adjust T1 further on in the lesson."], "jumps": ["P15330", "P15310", "P15325"]}, {"id": "P15310", "text": ["2. Using the oscilloscope in the dual display mode, connect CH1 to PC130-86 Pin E. Connect CH2 to PC130-90 Pin T. Time/Div set to .2 mS. CH1 is measuring the information signal input to the transmitter, 1 kHz. CH2 is measuring the information signal output of the demodulator. The output signal may be distorted or not present at this time."], "jumps": ["P15320", "P15300"]}, {"id": "P15300", "text": ["1.  Adjust R1 on PC130-86 for the minimum amount of                            modulation on the output signal, check signal on PC130-90 at       pin E.", "1. Adjust R1 on PC130-86 for the minimum amount of modulation on the output signal, check signal on PC130-90 at pin E."], "jumps": ["P15310", "P15290"]}, {"id": "P15290", "text": ["The receiver circuit is receiving the frequency modulated signal from the transmitter.  Now let's check and align the receiver.", "The receiver circuit is receiving the frequency modulated signal from the transmitter. Now let's check and align the receiver."], "jumps": ["P15300", "P15280"]}, {"id": "P15282", "text": ["Ensure you are using the oscilloscope correctly and it is connected to PC130-90 Pin E.  If the signal is still not present, see your instructor.", "Ensure you are using the oscilloscope correctly and it is connected to PC130-90 Pin E. If the signal is still not present, see your instructor."], "jumps": []}, {"id": "P15281", "text": ["6.  Using the oscilloscope (with a X10 probe) measure the signal        on PC130-90 Pin E.  Is the signal a 450 kHz frequency                       modulated signal?", "6. Using the oscilloscope (with a X10 probe) measure the signal on PC130-90 Pin E. Is the signal a 450 kHz frequency modulated signal?"], "jumps": []}, {"id": "P15270", "text": ["5.  Press Enter to Set: PC2 and PC3 DC Power Switches - ON             The FM transmitter and receiver are now energized.", "5. Press Enter to Set: PC2 and PC3 DC Power Switches - ON The FM transmitter and receiver are now energized."], "jumps": ["P15260"]}, {"id": "P15265", "text": ["EXPERIMENT CARD PLACEMENT - PC130 - 90 shown in PC3 position."], "jumps": []}, {"id": "P15260", "text": ["4.  Insert PC130-90 into the Test Console PC3 position.", "4. Insert PC130-90 into the Test Console PC3 position....."], "jumps": ["P15270", "P15265"]}, {"id": "P15250", "text": ["9.  Press Enter to Set: PC2 DC Power Switch - OFF", "9. Press Enter to Set: PC2 DC Power Switch - OFF.........................."], "jumps": ["P15240"]}, {"id": "P15246", "text": ["FUNCTION GENERATOR - Frequency - 1 Amplitude - 2 Vpp Range - 1 k Modulation Controls - OFF", "MEASUREMENT SETUP - Connect Function Generator to the Test Console PC2 OUTPUT BNC."], "jumps": ["P15240", "P15245", "P15246"]}, {"id": "P15240", "text": ["7. Connect the main output of the function generator to the PC1 OUTPUT BNC. 8. Using the oscilloscope connected to PC130-86 Pin E, adjust the output of the function generator for a 1 kHz, 2 Vpp sine wave output. Ensure that all modulation controls are disengaged."], "jumps": ["P15250", "P15230", "P15245"]}, {"id": "P15236", "text": ["If using a frequency counter, use a high impedance probe. Adjusting R4 will help however, after making the frequency measurement, return R4 for a 5 Vpp output on Pin T using the oscilloscope.", "If using a frequency counter, use a high impedance probe. Adjusting R4 will help however, after making the frequency measurement, return R4 for a 5 Vpp output on Pin T using the oscilloscope...", "USING FREQUENCY COUNTER - Your frequency counter may load the oscillator circuit in the transmitter to a point that it will not operate."], "jumps": []}, {"id": "P15230", "text": ["5.  Using the oscilloscope (with a X10 probe) measure the signal        on PC130-86 Pin T. \n6.  Adjust PC130-86 R2 and R4 for a 5 Vpp 450 kHz signal.  A               frequency counter can be used to set the frequency.", "5. Using the oscilloscope (with a X10 probe) measure the signal on PC130-86 Pin T. 6. Adjust PC130-86 R2 and R4 for a 5 Vpp 450 kHz signal. A frequency counter can be used to set the frequency."], "jumps": ["P15240", "P15235"]}, {"id": "P15220", "text": ["4.  Press Enter to Set: PC2 DC Power Switch - ON", "4. Press Enter to Set: PC2 DC Power Switch - ON...........................", "MEASUREMENT SETUP - Adjust R1, R2, and R4 to the mid positions. Place S1 to DC and S2 to VCO."], "jumps": ["P15210"]}, {"id": "P15210", "text": ["2.  On PC130-86 adjust R1, R2 and R4 to mid-position. \n3.  On PC130-86 place S1 to DC and S2 to VCO.", "2. On PC130-86 adjust R1, R2 and R4 to mid-position. 3. On PC130-86 place S1 to DC and S2 to VCO."], "jumps": ["P15220", "P15200", "P15215"]}, {"id": "P15205", "text": ["EXPERIMENT CARD PLACEMENT - PC130 - 86 shown in PC2 position."], "jumps": []}, {"id": "P15200", "text": ["1.  Insert PC130-86 into ude variations.  You learned the circuit with R4 through R7 as one resistor.", "R4 through R7 act as a voltage divider across C6 to help reduce amplitude variations. You learned the circuit with R4 through R7 as one resistor."], "jumps": ["P15110", "P15030", "P15100"]}, {"id": "P15080", "text": ["L4 still receives a 90 degree phase shift by the action of C1."], "jumps": ["P15090", "P15030"]}, {"id": "P15070", "text": ["The only difference in this circuit from the one you learned is that L4 is inductor coupled from L1A and L1B."], "jumps": ["P15080", "P15030"]}, {"id": "P15060", "text": ["The output of the RF amplifier is applied to the inductors in the demodulator circuit."], "jumps": ["P15070", "P15030"]}, {"id": "P15050", "text": ["The FM signal is applied to Pin E on the receiver card through the test console.  Q1 and the associated circuitry is the RF amplifier.", "The FM signal is applied to Pin E on the receiver card through the test console. Q1 and the associated circuitry is the RF amplifier."], "jumps": ["P15060", "P15030"]}, {"id": "P15040", "text": ["The received FM signal is generated from the PC130-86 card (FM transmitter).", "The circuit is contained on PC130-90 and consists of a RF (radio frequency) amplifier, ratio demodulator and an AF (audio frequency) amplifier.", "In this experiment, you will observe the operation of and measure signals in a typical FM ratio demodulator receiver."], "jumps": ["P15050", "P15030", "P15040", "P15020", "P3001"]}, {"id": "P14910", "text": ["This completes the experiment on FM RECEIVERS (DISCRIMINATOR)."], "jumps": ["P14480"]}, {"id": "P14480", "text": ["If you are proceeding directly to the ratio demodulator                      experiments, skip steps 5, 6 and 7. \n4.  Disconnect the function generator from the test console.        \n5.  Remove PC130-86 from the test console.                          \n6.  Return all equipment to the designated storage areas.", "If you are proceeding directly to the ratio demodulator  be some distortion in the output signal.  If you still do not have a 1 kHz output signal, check with your instructor.", "Check your adjustments of PC130-86 and PC130-89. Also check that the function generator is producing a 1 kHz signal, note that there may be some distortion in the output signal. If you still do not have a 1 kHz output signal, check with your instructor."], "jumps": []}, {"id": "P14381", "text": [], "jumps": []}, {"id": "P14380", "text": ["Do you have a 1 kHz output signal from the demodulator which is like the 1 kHz input signal to the modulator?"], "jumps": ["P14370"]}, {"id": "P14370", "text": ["8.  Make slight adjustments to PC130-86 R1 and PC130-89 R6             until no further improvements can be seen.", "8. Make slight adjustments to PC130-86 R1 and PC130-89 R6 until no further improvements can be seen."], "jumps": ["P14380", "P14350"]}, {"id": "P14360", "text": ["7.  On PC130-89, adjust the pink slug of T1 for a maximum                    undistorted output signal on Pin T.  Ensure the signals are in         phase.", "6.  On PC130-89, adjust the blue slug of T1 for a maximum                    undistorted output signal on Pin T.  Ensure the signals are in         phase.", "7. On PC130-89, adjust the pink slug of T1 for a maximum undistorted output signal on Pin T. Ensure the signals are in phase.", "6. On PC130-89, adjust the blue slug of T1 for a maximum undistorted output signal on Pin T. Ensure the signals are in phase."], "jumps": ["P14370", "P14350", "P14360", "P14340"]}, {"id": "P14340", "text": ["5.  Repeat adjusting R1 on PC130-86 and R6 on PC130-89 until           no further improvement can be made.", "5. Repeat adjusting R1 on PC130-86 and R6 on PC130-89 until no further improvement can be made.", "If you do not have an output signal from the demodulator T1 could be misaligned. Continue to the next page, we are going to align T1. ly. We will adjust T1 further on in the lesson...", "NOTE If no signal is present on the output of
