 on PC130-86 for the minimum amount of                            modulation on the output signal, check signal on PC130-89 at       pin E.", "1. Adjust R1 on PC130-86 for the minimum amount of modulation on the output signal, check signal on PC130-89 at pin E."], "jumps": ["P14310", "P14290"]}, {"id": "P14290", "text": ["The receiver circuit is receiving the frequency modulated signal from the transmitter.  Now let's check and align the receiver.", "The receiver circuit is receiving the frequency modulated signal from the transmitter. Now let's check and align the receiver."], "jumps": ["P14300", "P14280"]}, {"id": "P14282", "text": ["Ensure you are using the oscilloscope correctly and it is connected to PC130-89 Pin E.  If the signal is still not present, see your instructor.", "Ensure you are using the oscilloscope correctly and it is connected to PC130-89 Pin E. If the signal is still not present, see your instructor."], "jumps": []}, {"id": "P14281", "text": ["6.  Using the oscilloscope (with a X10 probe) measure the signal        on PC130-89 Pin E.  Is the signal a 450 kHz frequency                       modulated signal?", "6. Using the oscilloscope (with a X10 probe) measure the signal on PC130-89 Pin E. Is the signal a 450 kHz frequency modulated signal?"], "jumps": []}, {"id": "P14270", "text": ["5.  Press Enter to Set: PC2 and PC3 DC Power Switches - ON             The FM transmitter and receiver are now energized.", "5. Press Enter to Set: PC2 and PC3 DC Power Switches - ON The FM transmitter and receiver are now energized."], "jumps": ["P14260"]}, {"id": "P14265", "text": ["EXPERIMENT CARD PLACEMENT - PC130 - 89 shown in PC3 position."], "jumps": []}, {"id": "P14260", "text": ["4.  Insert PC130-89 into the Test Console PC3 position.", "4. Insert PC130-89 into the Test Console PC3 position....."], "jumps": ["P14270", "P14265"]}, {"id": "P14250", "text": ["9.  Press Enter to Set: PC2 DC Power Switch - OFF", "9. Press Enter to Set: PC2 DC Power Switch - OFF.........................."], "jumps": ["P14240"]}, {"id": "P15245", "text": ["MEASUREMENT SETUP - Connect Function Generator to the Test Console PC2 OUTPUT BNC."], "jumps": ["P15246"]}, {"id": "P14245", "text": ["MEASUREMENT SETUP - Connect Function Generator to the Test Console PC2 OUTPUT BNC."], "jumps": ["P14246"]}, {"id": "P14240", "text": ["7. Connect the main output of the function generator to the PC1 OUTPUT BNC. 8. Using the oscilloscope connected to PC130-86 Pin E, adjust the output of the function generator for a 1 kHz, 2 Vpp sine wave output. Ensure that all modulation controls are disengaged."], "jumps": ["P14250", "P14230", "P14245"]}, {"id": "P14236", "text": ["If using a frequency counter, use a high impedance probe. Adjusting R4 will help however, after making the frequency measurement, return R4 for a 5 Vpp output on Pin T using the oscilloscope.", "USING FREQUENCY COUNTER - Your frequency counter may load the oscillator circuit in the transmitter to a point that it will not operate."], "jumps": ["P14230", "P14235", "P14236"]}, {"id": "P14230", "text": ["5.  Using the oscilloscope (with a X10 probe) measure the signal        on PC130-86 Pin T. \n6.  Adjust PC130-86 R2 and R4 for a 5 Vpp 450 kHz signal. A                frequency counter can be used to set the frequency.", "5. Using the oscilloscope (with a X10 probe) measure the signal on PC130-86 Pin T. 6. Adjust PC130-86 R2 and R4 for a 5 Vpp 450 kHz signal. A frequency counter can be used to set the frequency."], "jumps": ["P14240", "P14235"]}, {"id": "P14220", "text": ["4.  Press Enter to Set: PC2 DC Power Switch - ON", "4. Press Enter to Set: PC2 DC Power Switch - ON...........................", "MEASUREMENT SETUP - Adjust R1, R2, and R4 to mid position. Place S1 to DC and S2 to VCO."], "jumps": ["P14210"]}, {"id": "P14210", "text": ["2.  On PC130-86 adjust R1, R2 and R4 to mid-position. \n3.  On PC130-86 place S1 to DC and S2 to VCO.", "2. On PC130-86 adjust R1, R2 and R4 to mid-position. 3. On PC130-86 place S1 to DC and S2 to VCO."], "jumps": ["P14220", "P14200", "P14215"]}, {"id": "P14205", "text": ["EXPERIMENT CARD PLACEMENT - PC130 - 86 shown in PC2 position."], "jumps": []}, {"id": "P14200", "text": ["1.  Insert PC130-86 into the Test Console PC2 position.", "1. Insert PC130-86 into the Test Console PC2 position....."], "jumps": ["P14210", "P14190", "P14205"]}, {"id": "P14190", "text": ["If you are continuing directly from another experiment in this lesson and the PC130-86 transmitter card is setup and aligned (including the output of the function generator at 1 kHz, 2 Vpp to  the PC1 OUTPUT BNC), select NEXT.  If the PC130-86 card is not setup, select HELP.", "If you are continuing directly from another experiment in this lesson and the PC130-86 transmitter card is setup and aligned (including the output of the function generator at 1 kHz, 2 Vpp to the PC1 OUTPUT BNC), select NEXT. If the PC130-86 card is not setup, select HELP."], "jumps": ["P14260", "P14200"]}, {"id": "P14180", "text": ["2.  Press Enter to Set: Positive Supply Voltage - 12", "2. Press Enter to Set: Positive Supply Voltage - 12......................."], "jumps": []}, {"id": "P14170", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P14110"]}, {"id": "P14160", "text": ["Let's start the experiment."], "jumps": ["P14170", "P14110"]}, {"id": "P14140", "text": ["The transformer is tunable to set up correct demodulator action."], "jumps": ["P14160", "P14110"]}, {"id": "P14130", "text": ["Using a FM demodulator transformer instead of individual transformers is common practice."], "jumps": ["P14140", "P14110"]}, {"id": "P14120", "text": ["Look at T1 on the upper left of the card.", "Now, pick up the PC130-89 card and compare it to the schematic."], "jumps": ["P14130", "P14110", "P14120", "P14030"]}, {"id": "P14100", "text": ["The output of the demodulator, TP6, is routed to a common emitter AF amplifier.", "Circuits C2 through C4; R4 and R5 operate the same as you learned earlier."], "jumps": ["P14110", "P14030", "P14100"]}, {"id": "P14080", "text": ["L4 still receives a 90 degree phase shift by the action of C1."], "jumps": ["P14090", "P14030"]}, {"id": "P14070", "text": ["The only difference in this circuit from the one you learned is that L4 is inductor coupled from L1A and L1B."], "jumps": ["P14080", "P14030"]}, {"id": "P14060", "text": ["The output of the RF amplifier is applied to the inductors in the demodulator circuit."], "jumps": ["P14070", "P14030"]}, {"id": "P14050", "text": ["The FM signal is applied to Pin E on the receiver card through the test console.  Q1 and the associated circuitry is the RF amplifier.", "The FM signal is applied to Pin E on the receiver card through the test console. Q1 and the associated circuitry is the RF amplifier."], "jumps": ["P14060", "P14030"]}, {"id": "P14040", "text": ["The received FM signal is generated from the PC130-86 card, FM transmitter.", "The circuit is contained on PC130-89 and consists of a RF (radio frequency) amplifier, discriminator demodulator, and an AF (audio frequency) amplifier.", "In this experiment, you will observe the operation of and measure signals in a typical FM discriminator demodulator."], "jumps": ["P14050", "P14030", "P14040", "P14020", "P2001"]}, {"id": "P13910", "text": ["This completes the experiment on FM TRANSMITTERS.", "This completes the experiment on FM TRANSMITTERS.LE........"], "jumps": ["P13460"]}, {"id": "P13460", "text": ["If you are proceeding directly to the discriminator or ratio               demodulator experiments, skip steps 4, 5 and 6.                   \n3.  Disconnect the function generator from the test console.          4.  Remove PC130-86 from the PC2 position.                            \n5.  Return all equipment to the designated storage areas.", "If you are proceeding directly to the discriminator or ratio demodulator experiments, skip steps 4, 5 and 6. 3. Disconnect the function generator from the test console. 4. Remove PC130-86 from the PC2 position. 5. Return all equipment to the designated storage areas."], "jumps": ["P13910", "P13450"]}, {"id": "P13450", "text": ["1.  Set the Test Console Power OFF.\n2.  Disconnect the oscilloscope from the varactor modulator               circuit.", "3.  Observe the signal on TP3 while varying the function                       generator amplitude output.  You can see the varactor                      demodulator functions as we have discussed.", "The signal on TP3 is amplified and inverted from TP2.", "You are partially correct, the carrier signal is seen on TP2 and TP3.  However, fc is present only when the information signal\n is 0.", "The information signal changes the capacitance of D1 which changes the resonant frequency of the tank circuit.  It is not seen on TP2 or TP3.", "1. Set the Test Console Power OFF. 2. Disconnect the oscilloscope from the varactor modulator circuit. .", "3. Observe the signal on TP3 while varying the function generator amplitude output. You can see the varactor demodulator functions as we have discussed.", "The signal on TP3 is amplified and inverted from TP2.......", "You are partially correct, the carrier signal is seen on TP2 and TP3. However, fc is present only when the information signal is 0.", "The information signal changes the capacitance of D1 which changes the resonant frequency of the tank circuit. It is not seen on TP2 or TP3."], "jumps": ["P13420", "P13430", "P13410"]}, {"id": "P13411", "text": ["What type of signal is on TP2 and TP3?", "2.  Using the oscilloscope, measure the signals on PC130-86 TP2      and TP3.  Use an oscilloscope Time/Div setting of 2 mS.", "The modulated signal is generated in the oscillator circuit by D1 changing capacitance.  L1 blocks the FM signal from the varactor diode and information input circuit.", "The carrier signal is generated in the oscillator circuit.  L1 blocks the carrier signal from the varactor diode and information input circuit.", "What type of signal is on TP2 and TP3?.....................", "2. Using the oscilloscope, measure the signals on PC130-86 TP2 and TP3. Use an oscilloscope Time/Div setting of 2 mS.", "The modulated signal is generated in the oscillator circuit by D1 changing capacitance. L1 blocks the FM signal from the varactor diode and information input circuit.", "The carrier signal is generated in the oscillator circuit. L1 blocks the carrier signal from the varactor diode and information input circuit."], "jumps": ["P13400", "P13410", "P13390"]}, {"id": "P13391", "text": ["What type of signal is on TP1?", "1.  Using the oscilloscope, measure the signal on PC130-86 TP1.       Use a Time/Div setting of .2 mS.", "What type of signal is on TP1?ped..........................", "1. Using the oscilloscope, measure the signal on PC130-86 TP1. Use a Time/Div setting of .2 mS."], "jumps": ["P13320", "P13390"]}, {"id": "P13370", "text": ["Now, let's view the signals in the entire varactor modulator transmitter circuit."], "jumps": ["P13380", "P13320"]}, {"id": "P13360", "text": ["6.  Set R1 on PC130-86 so that you can see the frequency                    deviation.", "6. Set R1 on PC130-86 so that you can see the frequency deviation."], "jumps": ["P13370", "P13320"]}, {"id": "P13350", "text": ["As the reverse bias of D1 is changed, in proportion to the amplitude of the information signal, the circuit varies the output frequency FM modulation."], "jumps": ["P13360", "P13320"]}, {"id": "P13340", "text": ["Adjusting R1 changes the modulation level.  The information input signal is changing the reverse bias of D1.", "Adjusting R1 changes the modulation level. The information input signal is changing the reverse bias of D1."], "jumps": ["P13350", "P13320"]}, {"id": "P13330", "text": ["You are viewing the modulated carrier signal.", "4.  Connect the oscilloscope to the FM output signal at Pin T.  Set       the oscilloscope Time/Div to 2 mS. \n5.  Vary R1 while observing the FM output signal.", "4. Connect the oscilloscope to the FM output signal at Pin T. Set the oscilloscope Time/Div to 2 mS. 5. Vary R1 while observing the FM output signal."], "jumps": ["P13340", "P13320", "P13330", "P13310"]}, {"id": "P13315", "text": ["FUNCTION GENERATOR - Frequency - 1 kHz Amplitude - 2 Vpp Modulation Controls - OFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFControls - OFF"], "jumps": []}, {"id": "P14246", "text": ["FUNCTION GENERATOR - Frequency - 1 kHz Amplitude - 2 Vpp Modulation Controls - OFF Modulation Controls - OFF"], "jumps": ["P14240", "P14245"]}, {"id": "P15246", "text": ["FUNCTION GENERATOR - Frequency - 1 kHz Amplitude - 2 Vpp Modulation Controls - OFF Modulation Controls - OFF"], "jumps": ["P15240", "P15245"]}, {"id": "P1315", "text": ["FUNCTION GENERATOR - Frequency - 1 kHz Amplitude - 2 Vpp Modulation Controls - OFF Modulation Controls - OFFFFFFFFFFFFF"], "jumps": []}, {"id": "P2246", "text": ["FUNCTION GENERATOR - Frequency - 1 kHz Amplitude - 2 Vpp Modulation Controls - OFF Modulation Controls - OFFFFFFFFFFFF"], "jumps": []}, {"id": "P13310", "text": ["3.  Using the oscilloscope connected to PC130-86 Pin E, adjust          the output of the function generator for a 1 kHz, 2 Vpp sine             wave output.  Time/Div set to .2 mS and ensure that all                      modulation controls on the function generator are                             disengaged.", "3. Using the oscilloscope connected to PC130-86 Pin E, adjust the output of the function generator for a 1 kHz, 2 Vpp sine wave output. Time/Div set to .2 mS and ensure that all modulation controls on the function generator are disengaged."], "jumps": ["P13320", "P13300", "P13315"]}, {"id": "P13305", "text": ["MEASUREMENT SETUP - Connect Function Generator to the Test Console PC2 OUTPUT BNC."], "jumps": []}, {"id": "P14245", "text": ["MEASUREMENT SETUP - Connect Function Generator to the Test Console PC2 OUTPUT BNC."], "jumps": ["P14246"]}, {"id": "P13300", "text": ["2.  Connect the main output of the function generator to the PC1        OUTPUT BNC.", "2. Connect the main output of the function generator to the PC1 OUTPUT BNC."], "jumps": ["P13310", "P13290", "P13305"]}, {"id": "P13295", "text": ["1.  Adjust R2 and R4 on PC130-86 for a 5 Vpp 450 kHz output              signal on Pin T.", "USING FREQUENCY COUNTER - Your frequency counter may load the oscillator circuit to a point that it will not operate. If using a frequency counter, use a high impedance probe. Adjust R4, however, after making the frequency measurement, return R4 for a 5 Vpp output on Pin T using the oscilloscope.", "1. Adjust R2 and R4 on PC130-86 for a 5 Vpp 450 kHz output signal on Pin T."], "jumps": ["P13300", "P13280", "P13295"]}, {"id": "P13280", "text": ["You have seen how the varactor diode changes the oscillator's output frequency.  Now let's apply an information signal.", "You have seen how the varactor diode changes the oscillator's output frequency. Now let's apply an information signal."], "jumps": ["P13290", "P13250"]}, {"id": "P13270", "text": ["Changing the reverse bias of D1 causes its capacitance to change.  This changes the resonant frequency of the tank circuit which changes the output frequency of the transmitter circuit.", "Changing the reverse bias of D1 causes its capacitance to change. This changes the resonant frequency of the tank circuit which changes the output frequency of the transmitter circuit."], "jumps": ["P13280", "P13250"]}, {"id": "P13260", "text": ["Notice that the frequency output changes (the amplitude changes also but, this is not a concern for FM).  Varying R2 changes the reverse bias level on the varactor diode D1.", "3.  Vary PC130-86 R2 and observe the output signal with the               oscilloscope on PC130-86 Pin T.", "Notice that the frequency output changes (the amplitude changes also but, this is not a concern for FM). Varying R2 changes the reverse bias level on the varactor diode D1.", "3. Vary PC130-86 R2 and observe the output signal with the oscilloscope on PC130-86 Pin T."], "jumps": ["P13270", "P13250", "P13260", "P13240"]}, {"id": "P13247", "text": ["You still have not entered the correct carrier frequency.  You should have measured approximately 700 kHz.", "You still have not entered the correct carrier frequency. You should have measured approximately 700 kHz."], "jumps": ["P13250", "P13240"]}, {"id": "P13245", "text": ["USING FREQUENCY COUNTER - Your frequency counter may load the oscillator circuit to a point that it will not operate. If using a frequency counter, use a high impedance probe. Adjust R4, however, after making the frequency measurement, return R4 for a 5 Vpp output on Pin T using the oscilloscope."], "jumps": []}, {"id": "P13242", "text": ["You did not measure the correct carrier frequency.  Check that:", "You did not measure the correct carrier frequency. Check that:", "- You set R2 to mid position. - You are measuring the frequency correctly. If using an oscilloscope, be sure you are reading the period of a cycle accurately...rately.y.."], "jumps": []}, {"id": "P13241", "text": [], "jumps": []}, {"id": "P13240", "text": ["Using the oscilloscope, or frequency counter, measure and type in the output frequency of the FM modulator on Pin T."], "jumps": ["P13210", "P13245", "P13242"]}, {"id": "P13230", "text": ["Notice that adjusting R4 changed the amplitude of the carrier signal.  R4 adjusts the voltage level on the base of amplifier Q1.", "Notice that adjusting R4 changed the amplitude of the carrier signal. R4 adjusts the voltage level on the base of amplifier Q1."], "jumps": ["P13240", "P13210"]}, {"id": "P13220", "text": ["2.  Adjust R4 for a 5 Vpp output signal.  This is the unmodulated         carrier signal.", "1.  Using an oscilloscope (with a X10 probe) measure the signal         on PC130-86 Pin T.  Use a Time/Div setting of 2 mS.", "2. Adjust R4 for a 5 Vpp output signal. This is the unmodulated carrier signal.", "1. Using an oscilloscope (with a X10 probe) measure the signal on PC130-86 Pin T. Use a Time/Div setting of 2 mS."], "jumps": ["P13230", "P13210", "P13220", "P13200"]}, {"id": "P13200", "text": ["The FM transmitter card is now setup and operating without an information signal input.  Let's align the circuit first.", "The FM transmitter card is now setup and operating without an information signal input. Let's align the circuit first."], "jumps": ["P13210"]}, {"id": "P13190", "text": ["6.  Press Enter to Set: PC2 DC Power Switch - ON", "6. Press Enter to Set: PC2 DC Power Switch - ON..........................."], "jumps": []}, {"id": "P13180", "text": ["5.  Press Enter to Set: Positive Supply Voltage - 12", "3.  On PC130-86, adjust R4 fully CW, and R2 and R1 to                           midposition. \n4.  On PC130-86, place S1 to DC and S2 to VCO.", "5. Press Enter to Set: Positive Supply Voltage - 12.......................", "3. On PC130-86, adjust R4 fully CW, and R2 and R1 to midposition. 4. On PC130-86, place S1 to DC and S2 to VCO."], "jumps": ["P13170", "P13180", "P13160"]}, {"id": "P13160", "text": ["2.  Insert PC130-86 into the Test Console PC2 position.", "2. Insert PC130-86 into the Test Console PC2 position....."], "jumps": []}, {"id": "P13150", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13110"]}, {"id": "P13140", "text": ["Let's start the experiment.", "Now, pick up the PC130-86 card and compare to the schematic."], "jumps": ["P13150", "P13110", "P13140", "P13030"]}, {"id": "P13100", "text": ["The information signal from a function generator is applied to \nPin E.", "The information signal from a function generator is applied to Pin E."], "jumps": ["P13110", "P13030"]}, {"id": "P13090", "text": ["S1 and S2 are used to configure the circuit for different types of operation."], "jumps": ["P13100", "P13030"]}, {"id": "P13080", "text": ["R4 varies the input to Q1 and acts as a level control preventing Q1 from reaching saturation.", "R1 varies the amplitude of the information signal and acts as a modulation control."], "jumps": ["P13090", "P13030", "P13080"]}, {"id": "P13060", "text": ["R2 is a variable resistor and is used to change the center frequency."], "jumps": ["P13070", "P13030"]}, {"id": "P13050", "text": ["D1 is a varactor diode and is in parallel with C3.  R2 and R8 supply reverse biasing to D1.", "D1 is a varactor diode and is in parallel with C3. R2 and R8 supply reverse biasing to D1."], "jumps": ["P13060", "P13030"]}, {"id": "P13040", "text": ["Q1 is the oscillator; C3, L2, and C4 form the tank circuit.", "The circuit is contained on PC130-86 and consists of an oscillator for the carrier signal and a varactor diode to change the oscillator frequency."], "jumps": ["P13050", "P13030", "P13040", "P13020"]}, {"id": "P13020", "text": ["In this experiment you will observe the operation of and measure signals in a typical FM varactor transmitter circuit."], "jumps": ["P13030", "P1001"]}, {"id": "P3910", "text": ["This completes the experiment on FM RECEIVERS (RATIO).", "This completes the experiment on FM RECEIVERS (RATIO)......"], "jumps": ["P3480"]}, {"id": "P3480", "text": ["If you are proceeding directly to the discriminator                               demodulator experiment, skip steps 5, 6 and 7.                               \n5.  Disconnect the function generator from the test console.           6.  Remove PC130-86 from the test console.                             \n7.  Return all equipment to the designated storage areas.", "If you are proceeding directly to the discriminator demodulator experiment, skip steps 5, 6 and 7. 5. Disconnect the function generator from the test console. 6. Remove PC130-86 from the test console. 7. Return all equipment to the designated storage areas."], "jumps": ["P3910", "P3470"]}, {"id": "P3470", "text": ["2.  Set the Test Console Power to OFF.\n3.  Disconnect the oscilloscope from PC cards.               \n4.  Remove PC130-90 from the test console.", "2. Set the Test Console Power to OFF. 3. Disconnect the oscilloscope from PC cards. 4. Remove PC130-90 from the test console."], "jumps": ["P3460"]}, {"id": "P3460", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": ["P3440"]}, {"id": "P3450", "text": ["The discriminator demodulator receiver operates as you have learned.", "4.  Using the oscilloscope in the single trace mode, measure the        signals on PC130-90 TP10 and TP11.  These signals are the           information signal in the audio amplifier section of the                      receiver.", "The signal on PC130-90 TP8 is the output of the demodulator circuit.  It is not a frequency modulated signal.", "The signal on PC130-90 TP8 is the output of the demodulator circuit.  It is not the carrier signal at the center frequency.", "4. Using the oscilloscope in the single trace mode, measure the signals on PC130-90 TP10 and TP11. These signals are the information signal in the audio amplifier section of the receiver.", "The signal on PC130-90 TP8 is the output of the demodulator circuit. It is not a frequency modulated signal.", "The signal on PC130-90 TP8 is the output of the demodulator circuit. It is not the carrier signal at the center frequency."], "jumps": ["P3460", "P3440", "P3450", "P3430"]}, {"id": "P3431", "text": ["3.  Using the oscilloscope in the single trace mode, measure the        signal on PC130-90 TP8.  What type of signal is present?", "The signals you are measuring are taken after the diodes.  Since the diodes only allow current flow in one direction and the diodes are in series, the signal would not be out of phase.", "3. Using the oscilloscope in the single trace mode, measure the signal on PC130-90 TP8. What type of signal is present?", "The signals you are measuring are taken after the diodes. Since the diodes only allow current flow in one direction and the diodes are in series, the signal would not be out of phase."], "jumps": ["P3420"]}, {"id": "P3421", "text": ["2.  Using the oscilloscope in the dual trace mode, measure the           signals on PC130-90 TP4 and TP5, note where the test points        are located.  Time/Div set to .2 mS.  What is the phase                       relationship between the two signals?", "2. Using the oscilloscope in the dual trace mode, measure the signals on PC130-90 TP4 and TP5, note where the test points are located. Time/Div set to .2 mS. What is the phase relationship between the two signals?"], "jumps": ["P3410"]}, {"id": "P3413", "text": ["The signal on PC130-90 TP1 and TP3 could be the carrier signal at the center frequency but, the output of the transmitter is modulated."], "jumps": []}, {"id": "P3412", "text": ["The signal on PC130-90 TP1 and TP3 is the input to the receiver. It is not the information signal."], "jumps": []}, {"id": "P3411", "text": ["1.  Using the oscilloscope in the single trace mode, measure the        signal on PC130-90 TP1 and TP3. Time/Div set at 2   S.  What          type of signal is present?", "1. Using the oscilloscope in the single trace mode, measure the signal on PC130-90 TP1 and TP3. Time/Div set at 2 S. What type of signal is present?"], "jumps": ["P3400"]}, {"id": "P3400", "text": ["Note that the adjustments you have made tuned the FM receiver to the FM transmitter.  These types of adjustments are normal procedures in any FM communication system.  Now let's view the signals in the FM receiver.", "Note that the adjustments you have made tuned the FM receiver to the FM transmitter. These types of adjustments are normal procedures in any FM communication system. Now let's view the signals in the FM receiver."], "jumps": ["P3410", "P3390"]}, {"id": "P3390", "text": ["The demodulator or receiver circuits are operating correctly."], "jumps": ["P3400", "P3380"]}, {"id": "P3382", "text": ["Check your adjustments of PC130-86 and PC130-90.  Also check that the function generator is producing a 1 kHz signal, note that there may be some distortion in the output signal.  If you still do not have a 1 kHz output signal, check with your instructor.", "Check your adjustments of PC130-86 and PC130-90. Also check that the function generator is producing a 1 kHz signal, note that there may be some distortion in the output signal. If you still do not have a 1 kHz output signal, check with your instructor."], "jumps": []}, {"id": "P3381", "text": [], "jumps": []}, {"id": "P3380", "text": ["Do you have a 1 kHz output signal from the demodulator which is like the 1 kHz input signal to the modulator?"], "jumps": ["P3370"]}, {"id": "P3370", "text": ["8.  Make slight adjustments to PC130-86 R1 and PC130-90 R8             until no further improvements can be seen.", "8. Make slight adjustments to PC130-86 R1 and PC130-90 R8 until no further improvements can be seen."], "jumps": ["P3380", "P3350"]}, {"id": "P3360", "text": ["7.  On PC130-90, adjust the pink slug of T1 for a maximum                    undistorted output signal on Pin T.  Ensure the signals are in         phase.", "6.  On PC130-90, adjust the blue slug of T1 for a maximum                    undistorted output signal on Pin T.  Ensure the signals are in         phase.", "7. On PC130-90, adjust the pink slug of T1 for a maximum undistorted output signal on Pin T. Ensure the signals are in phase.", "6. On PC130-90, adjust the blue slug of T1 for a maximum undistorted output signal on Pin T. Ensure the signals are in phase."], "jumps": ["P3370", "P3350", "P3360", "P3340"]}, {"id": "P3340", "text": ["5.  Repeat adjusting R1 on PC130-86 and R8 on PC130-90 until           no further improvement can be made.", "5. Repeat adjusting R1 on PC130-86 and R8 on PC130-90 until no further improvement can be made.", "If you do not have an output signal from the demodulator T1 could be misaligned. Continue to the next page, we are going to align T1. ly. We will adjust T1 further on in the lesson...", "NOTE If no signal is present on the output of the demodulator, T1 may be misadjusted to the point where the circuit will not operate correctly. We will adjust T1 further on in the lesson.", "MEASUREMENT SETUP - Adjust R1 for the lowest amount of distortion."], "jumps": ["P3350", "P3330"]}, {"id": "P3330", "text": ["4.  Adjust PC130-86 R1 for the lowest amount of distortion as              viewed on CH2.", "4. Adjust PC130-86 R1 for the lowest amount of distortion as viewed on CH2.", "If no signal is present on the output of the demodulator, T1 may be misadjusted to the point where the circuit will not operate correctly. We will adjust T1 further on in the lesson...", "NOTE If no signal is present on the output of the demodulator, T1 may be misadjusted to the point where the circuit will not operate correctly. We will adjust T1 further on in the lesson.", "MEASUREMENT SETUP - Adjust R8 for the lowest amount of distortion."], "jumps": ["P3340", "P3320", "P3335"]}, {"id": "P3320", "text": ["3.  Adjust PC130-90 R8 for the lowest amount of distortion as              viewed on CH2.", "3. Adjust PC130-90 R8 for the lowest amount of distortion as viewed on CH2.", "If no signal is present on the output of the demodulator, T1 may be misadjusted to the point where the circuit will not operate correctly. We will adjust T1 further on in the lesson...", "NOTE If no signal is present on the output of the demodulator, T1 may be misadjusted to the point where the circuit will not operate correctly. We will adjust T1 further on in the lesson."], "jumps": ["P3330", "P3310", "P3325"]}, {"id": "P3310", "text": ["2. Using the oscilloscope in the dual display mode, connect CH1 to PC130-86 Pin E. Connect CH2 to PC130-90 Pin T. Time/Div set to .2 mS. CH1 is measuring the information signal input to the transmitter, 1 kHz. CH2 is measuring the information signal output of the demodulator. The output signal may be distorted or not present at this time."], "jumps": ["P3320", "P3300"]}, {"id": "P3300", "text": ["1.  Adjust R1 on PC130-86 for the minimum amount of                            modulation on the output signal, check signal on PC130-90 at       pin E.", "1. Adjust R1 on PC130-86 for the minimum amount of modulation on the output signal, check signal on PC130-90 at pin E."], "jumps": ["P3310", "P3290"]}, {"id": "P3290", "text": ["The receiver circuit is receiving the frequency modulated signal from the transmitter.  Now let's check and align the receiver.", "The receiver circuit is receiving the frequency modulated signal from the transmitter. Now let's check and align the receiver."], "jumps": ["P3300", "P3280"]}, {"id": "P3282", "text": ["Ensure you are using the oscilloscope correctly and it is connected to PC130-90 Pin E.  If the signal is still not present, see your instructor.", "Ensure you are using the oscilloscope correctly and it is connected to PC130-90 Pin E. If the signal is still not present, see your instructor."], "jumps": []}, {"id": "P3281", "text": ["6.  Using the oscilloscope (with a X10 probe) measure the signal        on PC130-90 Pin E.  Is the signal a 450 kHz frequency                       modulated signal?", "6. Using the oscilloscope (with a X10 probe) measure the signal on PC130-90 Pin E. Is the signal a 450 kHz frequency modulated signal?"], "jumps": ["P3270"]}, {"id": "P3270", "text": ["5.  Place the PC2 and PC3 Power switches to ON.  The FM                    transmitter and receiver are now energized.", "5. Place the PC2 and PC3 Power switches to ON. The FM transmitter and receiver are now energized."], "jumps": ["P3260"]}, {"id": "P3265", "text": ["EXPERIMENT CARD PLACEMENT - PC130 - 90 shown in PC3 position."], "jumps": []}, {"id": "P3260", "text": ["4.  Insert PC130-90 into the Test Console PC3 position.", "4. Insert PC130-90 into the Test Console PC3 position....."], "jumps": ["P3270", "P3190", "P3265"]}, {"id": "P3250", "text": ["9.  Place PC2 DC Power switch to OFF.", "9. Place PC2 DC Power switch to OFF. to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P3240"]}, {"id": "P3246", "text": ["FUNCTION GENERATOR - Frequency - 1 kHz Amplitude - 2 Vpp Modulation Controls - OFF Modulation Controls - OFF"], "jumps": ["P3240", "P3245", "P3246"]}, {"id": "P3240", "text": ["7. Connect the main output of the function generator to the PC1 OUTPUT BNC. 8. Using the oscilloscope connected to PC130-86 Pin E, adjust the output of the function generator for a 1 kHz, 2 Vpp sine wave output. Ensure that all modulation controls are disengaged."], "jumps": ["P3250", "P3230", "P3245"]}, {"id": "P3236", "text": ["If using a frequency counter, use a high impedance probe. Adjusting R4 will help however, after making the frequency measurement, return R4 for a 5 Vpp output on Pin T using the oscilloscope.", "USING FREQUENCY COUNTER - Your frequency counter may load the oscillator circuit in the transmitter to a point that it will not operate."], "jumps": ["P3230", "P3235", "P3236"]}, {"id": "P3230", "text": ["5.  Using the oscilloscope (with a X10 probe) measure the signal        on PC130-86 Pin T. \n6.  Adjust PC130-86 R2 and R4 for a 5 Vpp 450 kHz signal.  A                frequency counter can be used to set the frequency.", "5. Using the oscilloscope (with a X10 probe) measure the signal on PC130-86 Pin T. 6. Adjust PC130-86 R2 and R4 for a 5 Vpp 450 kHz signal. A frequency counter can be used to set the frequency."], "jumps": ["P3240", "P3220", "P3235"]}, {"id": "P3220", "text": ["4.  Place the PC2 DC Power switch to ON.", "4. Place the PC2 DC Power switch to ON.o 12. 130A - Set the PC1 DC Switch to ON....", "MEASUREMENT SETUP - Adjust R1, R2, and R4 to the mid positions. Place S1 to DC and S2 to VCO."], "jumps": ["P3210"]}, {"id": "P3210", "text": ["2.  On PC130-86 adjust R1, R2 and R4 to mid-position. \n3.  On PC130-86 place S1 to DC and S2 to VCO.", "2. On PC130-86 adjust R1, R2 and R4 to mid-position. 3. On PC130-86 place S1 to DC and S2 to VCO."], "jumps": ["P3220", "P3200", "P3215"]}, {"id": "P3205", "text": ["EXPERIMENT CARD PLACEMENT - PC130 - 86 shown in PC2 position."], "jumps": []}, {"id": "P3200", "text": ["1.  Insert PC130-86 into the Test Console PC2 position.", "1. Insert PC130-86 into the Test Console PC2 position....."], "jumps": ["P3190", "P3205"]}, {"id": "P3190", "text": ["If you are continuing directly from another experiment in this lesson and the PC130-86 transmitter card is setup and aligned (including the output of the function generator at 1 kHz, 2 Vpp to  the PC1 OUTPUT BNC), select NEXT.  If the PC130-86 card is not setup, select HELP.", "If you are continuing directly from another experiment in this lesson and the PC130-86 transmitter card is setup and aligned (including the output of the function generator at 1 kHz, 2 Vpp to the PC1 OUTPUT BNC), select NEXT. If the PC130-86 card is not setup, select HELP."], "jumps": ["P3180", "P3200"]}, {"id": "P3180", "text": ["2.  Set the Voltmeter switch to Positive. \n3.  Set the Positive Supply Voltage to 12. The voltage meter                  should indicate 12 volts.", "2. Set the Voltmeter switch to Positive. 3. Set the Positive Supply Voltage to 12. The voltage meter should indicate 12 volts."], "jumps": ["P3170"]}, {"id": "P3170", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P3110"]}, {"id": "P3160", "text": ["Let's start the experiment."], "jumps": ["P3170", "P3110"]}, {"id": "P3150", "text": ["Match up the other components on the card to the schematic."], "jumps": ["P3160", "P3110"]}, {"id": "P3140", "text": ["Correct demodulator action is achieved by tuning the transformer."], "jumps": ["P3150", "P3110"]}, {"id": "P3130", "text": ["Instead of using individual inductors for demodulation, a FM demodulator transformer is commonly used."], "jumps": ["P3110"]}, {"id": "P3120", "text": ["Look at T1 on the upper left of the card.", "Now pick up the PC130-90 card and compare it to the schematic."], "jumps": ["P3110", "P3030"]}, {"id": "P3100", "text": ["The output of the demodulator, TP8, is routed to a common emitter AF amplifier.", "R4 through R7 act as a voltage divider across C6 to help reduce amplitude variations.  You learned the circuit with R4 through R7 as one resistor.", "R4 through R7 act as a voltage divider across C6 to help reduce amplitude variations. You learned the circuit with R4 through R7 as one resistor."], "jumps": ["P3030"]}, {"id": "P3080", "text": ["L4 still receives a 90 degree phase shift by the action of C1."], "jumps": ["P3030"]}, {"id": "P3070", "text": ["The only difference in this circuit from the one you learned is that L4 is inductor coupled from L1A and L1B."], "jumps": ["P3030"]}, {"id": "P3060", "text": ["The output of the RF amplifier is applied to the inductors in the demodulator circuit."], "jumps": ["P3030"]}, {"id": "P3050", "text": ["The FM signal is applied to Pin E on the receiver card through the test console.  Q1 and the associated circuitry is the RF amplifier.", "The FM signal is applied to Pin E on the receiver card through the test console. Q1 and the associated circuitry is the RF amplifier."], "jumps": ["P3030"]}, {"id": "P3040", "text": ["The received FM signal is generated from the PC130-86 card (FM transmitter).", "The circuit is contained on PC130-90 and consists of a RF (radio frequency) amplifier, ratio demodulator and an AF (audio frequency) amplifier.", "In this experiment, you will observe the operation of and measure signals in a typical FM ratio demodulator receiver."], "jumps": ["P3030", "P3020", "P3001"]}, {"id": "P3001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2910", "text": ["This completes the experiment on FM RECEIVERS (DISCRIMINATOR)."], "jumps": ["P2480"]}, {"id": "P2480", "text": ["If you are proceeding directly to the ratio demodulator                      experiments, skip steps 5, 6 and 7. \n5.  Disconnect the function generator from the test console.        \n6.  Remove PC130-86 from the test console.                          \n7.  Return all equipment to the designated storage areas.", "If you are proceeding directly to the ratio demodulator experiments, skip steps 5, 6 and 7. 5. Disconnect the function generator from the test console. 6. Remove PC130-86 from the test console. 7. Return all equipment to the designated storage areas."], "jumps": ["P2910", "P2470"]}, {"id": "P2470", "text": ["2.  Set the Test Console Power to OFF.\n3.  Disconnect the oscilloscope from PC cards.     \n4.  Remove PC130-89 from the test console.", "2. Set the Test Console Power to OFF. 3. Disconnect the oscilloscope from PC cards. 4. Remove PC130-89 from the test console."], "jumps": ["P2460"]}, {"id": "P2460", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": ["P2440"]}, {"id": "P2450", "text": ["The discriminator demodulator receiver operates as you have learned.", "4.  Using the oscilloscope in the single trace mode, measure the        signals on PC130-89 TP8 and TP10.  These signals are the              information signal in the audio amplifier section of the                      receiver.", "The basic diode demodulator circuit is used in most AM and CB radio receivers.", "The signal on PC130-89 TP6 is the output of the demodulator circuit.  It is not a frequency modulated signal.", "The signal on PC130-89 TP6 is the output of the demodulator circuit.  It is not the carrier signal at the center frequency.", "4. Using the oscilloscope in the single trace mode, measure the signals on PC130-89 TP8 and TP10. These signals are the information signal in the audio amplifier section of the receiver.", "The signal on PC130-89 TP6 is the output of the demodulator circuit. It is not a frequency modulated signal.", "The signal on PC130-89 TP6 is the output of the demodulator circuit. It is not the carrier signal at the center frequency."], "jumps": ["P2460", "P2440", "P2450", "P2430"]}, {"id": "P2431", "text": ["3.  Using the oscilloscope in the single trace mode, measure the        signal on PC130-89 TP6.  What type of signal is present?", "The signals you are measuring are taken from opposite sides of a center tapped transformer, they should be out of phase.", "3. Using the oscilloscope in the single trace mode, measure the signal on PC130-89 TP6. What type of signal is present?"], "jumps": ["P2420"]}, {"id": "P2421", "text": ["2.  Using the oscilloscope in the dual trace mode, measure the           signals on PC130-89 TP4 and TP5, note where the test points        are located.  What is the phase relationship between the two          signals?", "2. Using the oscilloscope in the dual trace mode, measure the signals on PC130-89 TP4 and TP5, note where the test points are located. What is the phase relationship between the two signals?"], "jumps": ["P2410"]}, {"id": "P2413", "text": ["The signal on PC130-89 TP1 and TP3 could be the carrier signal at the center frequency but, the output of the transmitter is modulated."], "jumps": []}, {"id": "P2412", "text": ["The signal on PC130-89 TP1 and TP3 is the input to the receiver. It is not the information signal."], "jumps": []}, {"id": "P2411", "text": ["1.  Using the oscilloscope in the single trace mode, measure the        signal on PC130-89 TP1 and TP3. What type of signal is                   present?", "1. Using the oscilloscope in the single trace mode, measure the signal on PC130-89 TP1 and TP3. What type of signal is present?"], "jumps": ["P2400"]}, {"id": "P2400", "text": ["Note that the adjustments you have made tuned the FM receiver to the FM transmitter.  These types of adjustments are normal procedures in any FM communication system.  Now let's view the signals in the FM receiver.", "Note that the adjustments you have made tuned the FM receiver to the FM transmitter. These types of adjustments are normal procedures in any FM communication system. Now let's view the signals in the FM receiver."], "jumps": ["P2410", "P2390"]}, {"id": "P2390", "text": ["The demodulator or receiver circuits are operating correctly."], "jumps": ["P2400", "P2380"]}, {"id": "P2382", "text": ["Check your adjustments of PC130-86 and PC130-89.  Also check that the function generator is producing a 1 kHz signal, note that there may be some distortion in the output signal.  If you still do not have a 1 kHz output signal, check with your instructor.", "Check your adjustments of PC130-86 and PC130-89. Also check that the function generator is producing a 1 kHz signal, note that there may be some distortion in the output signal. If you still do not have a 1 kHz output signal, check with your instructor."], "jumps": []}, {"id": "P2381", "text": [], "jumps": []}, {"id": "P2380", "text": ["Do you have a 1 kHz output signal from the demodulator which is like the 1 kHz input signal to the modulator?"], "jumps": ["P2370"]}, {"id": "P2370", "text": ["8.  Make slight adjustments to PC130-86 R1 and PC130-89 R6             until no further improvements can be seen.", "8. Make slight adjustments to PC130-86 R1 and PC130-89 R6 until no further improvements can be seen."], "jumps": ["P2380", "P2350"]}, {"id": "P2360", "text": ["7.  On PC130-89, adjust the pink slug of T1 for a maximum                    undistorted output signal on Pin T.  Ensure the signals are in         phase.", "6.  On PC130-89, adjust the blue slug of T1 for a maximum                    undistorted output signal on Pin T.  Ensure the signals are in         phase.", "7. On PC130-89, adjust the pink slug of T1 for a maximum undistorted output signal on Pin T. Ensure the signals are in phase.", "6. On PC130-89, adjust the blue slug of T1 for a maximum undistorted output signal on Pin T. Ensure the signals are in phase."], "jumps": ["P2370", "P2350", "P2360", "P2340"]}, {"id": "P2340", "text": ["5.  Repeat adjusting R1 on PC130-86 and R6 on PC130-89 until           no further improvement can be made.", "5. Repeat adjusting R1 on PC130-86 and R6 on PC130-89 until no further improvement can be made.", "If you do not have an output signal from the demodulator T1 could be misaligned. Continue to the next page, we are going to align T1. ly. We will adjust T1 further on in the lesson...", "NOTE If no signal is present on the output of the demodulator, T1 may be misadjusted to the point where the circuit will not operate correctly. We will adjust T1 further on in the lesson.", "MEASUREMENT SETUP - Adjust R1 for the lowest amount of distortion."], "jumps": ["P2350", "P2330"]}, {"id": "P2330", "text": ["4.  Adjust PC130-86 R1 for the lowest amount of distortion as              viewed on CH2.", "4. Adjust PC130-86 R1 for the lowest amount of distortion as viewed on CH2.", "If no signal is present on the output of the demodulator, T1 may be misadjusted to the point where the circuit will not operate correctly. We will adjust T1 further on in the lesson...", "NOTE If no signal is present on the output of the demodulator, T1 may be misadjusted to the point where the circuit will not operate correctly. We will adjust T1 further on in the lesson.", "MEASUREMENT SETUP - Adjust R6 for the lowest amount of distortion."], "jumps": ["P2340", "P2320", "P2335"]}, {"id": "P2320", "text": ["3.  Adjust PC130-89 R6 for the lowest amount of distortion as              viewed on CH2.", "3. Adjust PC130-89 R6 for the lowest amount of distortion as viewed on CH2.", "If no signal is present on the output of the demodulator, T1 may be misadjusted to the point where the circuit will not operate correctly. We will adjust T1 further on in the lesson...", "NOTE If no signal is present on the output of the demodulator, T1 may be misadjusted to the point where the circuit will not operate correctly. We will adjust T1 further on in the lesson."], "jumps": ["P2330", "P2310", "P2325"]}, {"id": "P2310", "text": ["2. Using the oscilloscope in the dual display mode, connect CH1 to PC130-86 Pin E. Connect CH2 to PC130-89 Pin T. Time/Div set to .2 mS. CH1 is measuring the information signal input to the transmitter, 1 kHz. CH2 is measuring the information signal output of the demodulator. The output signal may be distorted or not present at this time."], "jumps": ["P2320", "P2300"]}, {"id": "P2300", "text": ["1.  Adjust R1 on PC130-86 for the minimum amount of                            modulation on the output signal, check signal on PC130-89 at       pin E.", "1. Adjust R1 on PC130-86 for the minimum amount of modulation on the output signal, check signal on PC130-89 at pin E."], "jumps": ["P2310", "P2290"]}, {"id": "P2290", "text": ["The receiver circuit is receiving the frequency modulated signal from the transmitter.  Now let's check and align the receiver.", "The receiver circuit is receiving the frequency modulated signal from the transmitter. Now let's check and align the receiver."], "jumps": ["P2300", "P2280"]}, {"id": "P2282", "text": ["Ensure you are using the oscilloscope correctly and it is connected to PC130-89 Pin E.  If the signal is still not present, see your instructor.", "Ensure you are using the oscilloscope correctly and it is connected to PC130-89 Pin E. If the signal is still not present, see your instructor."], "jumps": []}, {"id": "P2281", "text": ["6.  Using the oscilloscope (with a X10 probe) measure the signal        on PC130-89 Pin E.  Is the signal a 450 kHz frequency                       modulated signal?", "6. Using the oscilloscope (with a X10 probe) measure the signal on PC130-89 Pin E. Is the signal a 450 kHz frequency modulated signal?"], "jumps": ["P2270"]}, {"id": "P2270", "text": ["5.  Place the PC2 and PC3 Power switches to ON.  The FM                     transmitter and receiver are now energized.", "5. Place the PC2 and PC3 Power switches to ON. The FM transmitter and receiver are now energized."], "jumps": ["P2260"]}, {"id": "P2265", "text": ["EXPERIMENT CARD PLACEMENT - PC130 - 89 shown in PC3 position."], "jumps": []}, {"id": "P2260", "text": ["4.  Insert PC130-89 into the Test Console PC3 position.", "4. Insert PC130-89 into the Test Console PC3 position....."], "jumps": ["P2270", "P2190", "P2265"]}, {"id": "P2250", "text": ["9.  Place PC2 DC Power switch to OFF.", "9. Place PC2 DC Power switch to OFF. to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2240"]}, {"id": "P2246", "text": ["FUNCTION GENERATOR - Frequency - 1 Amplitude - 2 Vpp Range - 1k Modulation Controls - OFF"], "jumps": []}, {"id": "P2240", "text": ["7. Connect the main output of the function generator to the PC1 OUTPUT BNC. 8. Using the oscilloscope connected to PC130-86 Pin E, adjust the output of the function generator for a 1 kHz, 2 Vpp sine wave output. Ensure that all modulation controls are disengaged."], "jumps": ["P2250", "P2230", "P2245"]}, {"id": "P2236", "text": ["If using a frequency counter, use a high impedance probe. Adjusting R4 will help however, after making the frequency measurement, return R4 for a 5 Vpp output on Pin T using the oscilloscope.", "USING FREQUENCY COUNTER - Your frequency counter may load the oscillator circuit in the transmitter to a point that it will not operate."], "jumps": ["P2230", "P2235", "P2236"]}, {"id": "P2230", "text": ["5.  Using the oscilloscope (with a X10 probe) measure the signal        on PC130-86 Pin T. \n6.  Adjust PC130-86 R2 and R4 for a 5 Vpp 450 kHz signal.  A               frequency counter can be used to set the frequency.", "5. Using the oscilloscope (with a X10 probe) measure the signal on PC130-86 Pin T. 6. Adjust PC130-86 R2 and R4 for a 5 Vpp 450 kHz signal. A frequency counter can be used to set the frequency."], "jumps": ["P2240", "P2220", "P2235"]}, {"id": "P2220", "text": ["4.  Place the PC2 DC Power switch to ON.", "4. Place the PC2 DC Power switch to ON.o 12. 130A - Set the PC1 DC Switch to ON....", "MEASUREMENT SETUP - Adjust R1, R2, and R4 to mid position. Place S1 to DC and S2 to VCO."], "jumps": ["P2210"]}, {"id": "P2210", "text": ["2.  On PC130-86 adjust R1, R2 and R4 to mid-position. \n3.  On PC130-86 place S1 to DC and S2 to VCO.", "2. On PC130-86 adjust R1, R2 and R4 to mid-position. 3. On PC130-86 place S1 to DC and S2 to VCO."], "jumps": ["P2220", "P2200", "P2215"]}, {"id": "P2205", "text": ["EXPERIMENT CARD PLACEMENT - PC130 - 86 shown in PC2 position."], "jumps": []}, {"id": "P2200", "text": ["1.  Insert PC130-86 into the Test Console PC2 position.", "1. Insert PC130-86 into the Test Console PC2 position....."], "jumps": ["P2190", "P2205"]}, {"id": "P2190", "text": ["If you are continuing directly from another experiment in this lesson and the PC130-86 transmitter card is setup and aligned (including the output of the function generator at 1 kHz, 2 Vpp to  the PC1 OUTPUT BNC), select NEXT.  If the PC130-86 card is not setup, select HELP.", "If you are continuing directly from another experiment in this lesson and the PC130-86 transmitter card is setup and aligned (including the output of the function generator at 1 kHz, 2 Vpp to the PC1 OUTPUT BNC), select NEXT. If the PC130-86 card is not setup, select HELP."], "jumps": ["P2180", "P2200"]}, {"id": "P2180", "text": ["2.  Set the Voltmeter switch to Positive. \n3.  Set the Positive Supply Voltage to 12. The voltage meter                  should indicate 12 volts.", "2. Set the Voltmeter switch to Positive. 3. Set the Positive Supply Voltage to 12. The voltage meter should indicate 12 volts."], "jumps": ["P2170"]}, {"id": "P2170", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2110"]}, {"id": "P2160", "text": ["Let's start the experiment."], "jumps": ["P2170", "P2110"]}, {"id": "P2140", "text": ["The transformer is tunable to set up correct demodulator action."], "jumps": ["P2160", "P2110"]}, {"id": "P2130", "text": ["Using a FM demodulator transformer instead of individual transformers is common practice."], "jumps": ["P2140", "P2110"]}, {"id": "P2120", "text": ["Look at T1 on the upper left of the card.", "Now, pick up the PC130-89 card and compare it to the schematic."], "jumps": ["P2130", "P2110", "P2120", "P2030"]}, {"id": "P2100", "text": ["The output of the demodulator, TP6, is routed to a common emitter AF amplifier.", "Circuits C2 through C4; R4 and R5 operate the same as you learned earlier."], "jumps": ["P2110", "P2030", "P2100"]}, {"id": "P2080", "text": ["L4 still receives a 90 degree phase shift by the action of C1."], "jumps": ["P2090", "P2030"]}, {"id": "P2070", "text": ["The only difference in this circuit from the one you learned is that L4 is inductor coupled from L1A and L1B."], "jumps": ["P2080", "P2030"]}, {"id": "P2060", "text": ["The output of the RF amplifier is applied to the inductors in the demodulator circuit.", "The FM signal is applied to Pin E on the receiver card through the test console.  Q1 and the associated circuitry is the RF amplifier.", "The FM signal is applied to Pin E on the receiver card through the test console. Q1 and the associated circuitry is the RF amplifier."], "jumps": ["P2070", "P2030", "P2060"]}, {"id": "P2040", "text": ["The received FM signal is generated from the PC130-86 card, FM transmitter.", "The circuit is contained on PC130-89 and consists of a RF (radio frequency) amplifier, discriminator demodulator, and an AF (audio frequency) amplifier.", "In this experiment, you will observe the operation of and measure signals in a typical FM discriminator demodulator."], "jumps": ["P2050", "P2030", "P2040", "P2020", "P2001"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1910", "text": ["This completes the experiment on FM TRANSMITTERS.", "This completes the experiment on FM TRANSMITTERS.LE........"], "jumps": ["P1460"]}, {"id": "P1460", "text": ["If you are proceeding directly to the discriminator or ratio               demodulator experiments, skip steps 4, 5 and 6.                  \n4.  Disconnect the function generator from the test console.          5.  Remove PC130-86 from the PC2 position.                           \n6.  Return all equipment to the designated storage areas.", "If you are proceeding directly to the discriminator or ratio demodulator experiments, skip steps 4, 5 and 6. 4. Disconnect the function generator from the test console. 5. Remove PC130-86 from the PC2 position. 6. Return all equipment to the designated storage areas."], "jumps": ["P1910", "P1450"]}, {"id": "P1450", "text": ["2.  Set the Test Console Power to OFF.\n3.  Disconnect the oscilloscope from the varactor modulator               circuit.", "2. Set the Test Console Power to OFF. 3. Disconnect the oscilloscope from the varactor modulator circuit."], "jumps": ["P1440"]}, {"id": "P1440", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": ["P1420"]}, {"id": "P1430", "text": ["3.  Observe the signal on TP3 while varying the function                       generator amplitude output.  You can see the varactor                      demodulator functions as we have discussed.", "The signal on TP3 is amplified and inverted from TP2.", "You are partially correct, the carrier signal is seen on TP2 and TP3.  However, fc is present only when the information signal\n is 0.", "The information signal changes the capacitance of D1 which changes the resonant frequency of the tank circuit.  It is not seen on TP2 or TP3.", "3. Observe the signal on TP3 while varying the function generator amplitude output. You can see the varactor demodulator functions as we have discussed.", "The signal on TP3 is amplified and inverted from TP2.......", "You are partially correct, the carrier signal is seen on TP2 and TP3. However, fc is present only when the information signal is 0.", "The information signal changes the capacitance of D1 which changes the resonant frequency of the tank circuit. It is not seen on TP2 or TP3."], "jumps": ["P1440", "P1420", "P1430", "P1410"]}, {"id": "P1411", "text": ["What type of signal is on TP2 and TP3?", "2.  Using the oscilloscope, measure the signals on PC130-86 TP2      and TP3.  Use an oscilloscope Time/Div setting of 2 mS.", "The modulated signal is generated in the oscillator circuit by D1 changing capacitance.  L1 blocks the FM signal from the varactor diode and information input circuit.", "The carrier signal is generated in the oscillator circuit.  L1 blocks the carrier signal from the varactor diode and information input circuit.", "What type of signal is on TP2 and TP3?.....................", "2. Using the oscilloscope, measure the signals on PC130-86 TP2 and TP3. Use an oscilloscope Time/Div setting of 2 mS.", "The modulated signal is generated in the oscillator circuit by D1 changing capacitance. L1 blocks the FM signal from the varactor diode and information input circuit.", "The carrier signal is generated in the oscillator circuit. L1 blocks the carrier signal from the varactor diode and information input circuit."], "jumps": ["P1400", "P1410", "P1390"]}, {"id": "P1391", "text": ["What type of signal is on TP1?", "1.  Using the oscilloscope, measure the signal on PC130-86 TP1.       Use a Time/Div setting of .2mS.", "What type of signal is on TP1?ped..........................", "1. Using the oscilloscope, measure the signal on PC130-86 TP1. Use a Time/Div setting of .2mS."], "jumps": ["P1320", "P1390"]}, {"id": "P1370", "text": ["Now, let's view the signals in the entire varactor modulator transmitter circuit."], "jumps": ["P1380", "P1320"]}, {"id": "P1360", "text": ["6.  Set R1 on PC130-86 so that you can see the frequency                    deviation.", "6. Set R1 on PC130-86 so that you can see the frequency deviation."], "jumps": ["P1370", "P1320"]}, {"id": "P1350", "text": ["As the reverse bias of D1 is changed, in proportion to the amplitude of the information signal, the circuit varies the output frequency FM modulation."], "jumps": ["P1360", "P1320"]}, {"id": "P1340", "text": ["Adjusting R1 changes the modulation level.  The information input signal is changing the reverse bias of D1.", "Adjusting R1 changes the modulation level. The information input signal is changing the reverse bias of D1."], "jumps": ["P1350", "P1320"]}, {"id": "P1330", "text": ["You are viewing the modulated carrier signal.", "4.  Connect the oscilloscope to the FM output signal at Pin T.  Set      the oscilloscope Time/Div to 2 mS.     \n5.  Vary R1 while observing the FM output signal.", "4. Connect the oscilloscope to the FM output signal at Pin T. Set the oscilloscope Time/Div to 2 mS. 5. Vary R1 while observing the FM output signal."], "jumps": ["P1340", "P1320", "P1330", "P1310"]}, {"id": "P1305", "text": [], "jumps": []}, {"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 10-28-99 Converted from storyboard to toolbook. frieda 12-17-99 Text & Branching - lisa 02-09-00 Graphics-jon 02-10-00 Completed Graphics. doan 07-14-00 Converted to ToolBook 7.1 format. jay 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-06-02 Checked for convertion errors John Ayala 05-01-02 Review - lisa 03-03-04 P1305, P1315,", "07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 10-28-99 Converted from storyboard to toolbook. frieda 12-17-99 Text & Branching - lisa 02-09-00 Graphics-jon 02-10-00 Completed Graphics. doan 07-14-00 Converted to ToolBook 7.1 format. jay 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-06-02 Checked for convertion errors John Ayala 05-01-02 Review - lisa 03-03-04 P1305, P2245, P3245, P13305, P14245, P15245 - deleted function generator, labeling, cable and centered console on page. P1315, P2246, P3246, P13315, P1424, P15246 - generalized function generator text and deleted function generator graphics. - Deand console on page............"], "jumps": []}, {"id": "P1310", "text": ["3.  Using the oscilloscope connected to PC130-86 Pin E, adjust          the output of the function generator for a 1 kHz, 2 Vpp sine             wave output.  Time/Div set to .2 mS and ensure that all                      modulation controls on the function generator are                             disengaged.", "3. Using the oscilloscope connected to PC130-86 Pin E, adjust the output of the function generator for a 1 kHz, 2 Vpp sine wave output. Time/Div set to .2 mS and ensure that all modulation controls on the function generator are disengaged."], "jumps": ["P1320", "P1300", "P1315"]}, {"id": "P2245", "text": [], "jumps": []}, {"id": "P3245", "text": [], "jumps": ["P3246"]}, {"id": "P3246", "text": ["FUNCTION GENERATOR - Frequency - 1 kHz Amplitude - 2 Vpp Modulation Controls - OFF Modulation Controls - OFF"], "jumps": ["P3240", "P3245"]}, {"id": "P1300", "text": ["2.  Connect the main output of the function generator to the PC1        OUTPUT BNC.", "2. Connect the main output of the function generator to the PC1 OUTPUT BNC."], "jumps": ["P1310", "P1290", "P1305"]}, {"id": "P1295", "text": ["1.  Adjust R2 and R4 on PC130-86 for a 5 Vpp 450 kHz output              signal on Pin T.", "USING FREQUENCY COUNTER - Your frequency counter may load the oscillator circuit to a point that it will not operate. If using a frequency counter, use a high impedance probe. Adjust R4, however, after making the frequency measurement, return R4 for a 5 Vpp output on Pin T using the oscilloscope.", "1. Adjust R2 and R4 on PC130-86 for a 5 Vpp 450 kHz output signal on Pin T."], "jumps": ["P1300", "P1280", "P1295"]}, {"id": "P1280", "text": ["You have seen how the varactor diode changes the oscillator's output frequency.  Now let's apply an information signal.", "You have seen how the varactor diode changes the oscillator's output frequency. Now let's apply an information signal."], "jumps": ["P1290", "P1250"]}, {"id": "P1270", "text": ["Changing the reverse bias of D1 causes its capacitance to change.  This changes the resonant frequency of the tank circuit which changes the output frequency of the transmitter circuit.", "Changing the reverse bias of D1 causes its capacitance to change. This changes the resonant frequency of the tank circuit which changes the output frequency of the transmitter circuit."], "jumps": ["P1280", "P1250"]}, {"id": "P1260", "text": ["Notice that the frequency output changes (the amplitude changes also but, this is not a concern for FM).  Varying R2 changes the reverse bias level on the varactor diode D1.", "3.  Vary PC130-86 R2 and observe the output signal with the               oscilloscope on PC130-86 Pin T.", "Notice that the frequency output changes (the amplitude changes also but, this is not a concern for FM). Varying R2 changes the reverse bias level on the varactor diode D1.", "3. Vary PC130-86 R2 and observe the output signal with the oscilloscope on PC130-86 Pin T."], "jumps": ["P1270", "P1250", "P1260", "P1240"]}, {"id": "P1247", "text": ["You still have not entered the correct carrier frequency.  You should have measured approximately 700 kHz.", "You still have not entered the correct carrier frequency. You should have measured approximately 700 kHz."], "jumps": ["P1250", "P1240"]}, {"id": "P1245", "text": ["USING FREQUENCY COUNTER - Your frequency counter may load the oscillator circuit to a point that it will not operate. If using a frequency counter, use a high impedance probe. Adjust R4, however, after making the frequency measurement, return R4 for a 5 Vpp output on Pin T using the oscilloscope."], "jumps": []}, {"id": "P1242", "text": ["You did not measure the correct carrier frequency.  Check that:", "You did not measure the correct carrier frequency. Check that:", "- You set R2 to mid position. - You are measuring the frequency correctly. If using an oscilloscope, be sure you are reading the period of a cycle accurately...rately.y.."], "jumps": []}, {"id": "P1241", "text": [], "jumps": []}, {"id": "P1240", "text": ["Using the oscilloscope, or frequency counter, measure and type in the output frequency of the FM modulator on Pin T."], "jumps": ["P1210", "P1242", "P1245"]}, {"id": "P1230", "text": ["Notice that adjusting R4 changed the amplitude of the carrier signal.  R4 adjusts the voltage level on the base of amplifier Q1.", "Notice that adjusting R4 changed the amplitude of the carrier signal. R4 adjusts the voltage level on the base of amplifier Q1."], "jumps": ["P1240", "P1210"]}, {"id": "P1220", "text": ["2.  Adjust R4 for a 5 Vpp output signal.  This is the unmodulated         carrier signal.", "1.  Using an oscilloscope (with a X10 probe) measure the signal         on PC130-86 Pin T.  Use a Time/Div setting of 2 mS.", "2. Adjust R4 for a 5 Vpp output signal. This is the unmodulated carrier signal.", "1. Using an oscilloscope (with a X10 probe) measure the signal on PC130-86 Pin T. Use a Time/Div setting of 2 mS."], "jumps": ["P1230", "P1210", "P1220", "P1200"]}, {"id": "P1200", "text": ["The FM transmitter card is now setup and operating without an information signal input.  Let's align the circuit first.", "The FM transmitter card is now setup and operating without an information signal input. Let's align the circuit first."], "jumps": ["P1210", "P1190"]}, {"id": "P1190", "text": ["7.  Place the PC2 DC Power switch to ON.", "7. Place the PC2 DC Power switch to ON.o 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P1180"]}, {"id": "P1180", "text": ["5.  Set the Voltmeter switch to Positive. \n6.  Set the Positive Supply Voltage to 12. The voltage meter                  should indicate 12 volts.", "3.  On PC130-86, adjust R4 fully CW, and R2 and R1 to                           midposition. \n4.  On PC130-86, place S1 to DC and S2 to VCO.", "5. Set the Voltmeter switch to Positive. 6. Set the Positive Supply Voltage to 12. The voltage meter should indicate 12 volts.", "3. On PC130-86, adjust R4 fully CW, and R2 and R1 to midposition. 4. On PC130-86, place S1 to DC and S2 to VCO."], "jumps": ["P1170", "P1160"]}, {"id": "P1160", "text": ["2.  Insert PC130-86 into the Test Console PC2 position.", "2. Insert PC130-86 into the Test Console PC2 position....."], "jumps": ["P1150"]}, {"id": "P1150", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P1110"]}, {"id": "P1140", "text": ["Let's start the experiment.", "Now, pick up the PC130-86 card and compare to the schematic."], "jumps": ["P1150", "P1110", "P1030", "P1140"]}, {"id": "P1100", "text": ["The information signal from a function generator is applied to\nPin E.", "The information signal from a function generator is applied to Pin E.."], "jumps": ["P1110", "P1030"]}, {"id": "P1090", "text": ["S1 and S2 are used to configure the circuit for different types of  operation.", "S1 and S2 are used to configure the circuit for different types of operation."], "jumps": ["P1100", "P1030"]}, {"id": "P1080", "text": ["R4 varies the input to Q1 and acts as a level control preventing Q1 from reaching saturation.", "R1 varies the amplitude of the information signal and acts as a modulation control."], "jumps": ["P1090", "P1030", "P1080"]}, {"id": "P1060", "text": ["R2 is a variable resistor and is used to change the center frequency."], "jumps": ["P1070", "P1030"]}, {"id": "P1050", "text": ["D1 is a varactor diode and is in parallel with C3.  R2 and R8 supply reverse biasing to D1.", "D1 is a varactor diode and is in parallel with C3. R2 and R8 supply reverse biasing to D1."], "jumps": ["P1060", "P1030"]}, {"id": "P1040", "text": ["Q1 is the oscillator; C3, L2, and C4 form the tank circuit.", "The circuit is contained on PC130-86 and consists of an oscillator for the carrier signal and a varactor diode to change the oscillator frequency."], "jumps": ["P1050", "P1030", "P1040", "P1020"]}, {"id": "P1020", "text": ["In this experiment you will observe the operation of and measure signals in a typical FM varactor transmitter circuit."], "jumps": ["P1030", "P1001"]}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P470", "text": ["Let's begin the lesson on FM CIRCUIT OPERATION............................"], "jumps": ["P400"]}, {"id": "P460", "text": ["Remember, the circuits you will use in this experiment produce low power outputs and do not have many additional circuits."], "jumps": ["P470", "P400"]}, {"id": "P450", "text": ["However, a home FM receiver does not need many stages of RF amplification.  Unless you are extremely far away from the FM transmitting antenna, you may need additional RF amplifiers.", "However, a home FM receiver does not need many stages of RF amplification. Unless you are extremely far away from the FM transmitting antenna, you may need additional RF amplifiers."], "jumps": ["P460", "P400"]}, {"id": "P440", "text": ["For example, an FM broadcasting station needs to transmit a lot of  power so, several high powered RF amplifier circuits are needed.", "For example, an FM broadcasting station needs to transmit a lot of power so, several high powered RF amplifier circuits are needed."], "jumps": ["P450", "P400"]}, {"id": "P430", "text": ["The type and number of additional circuits in FM transmitters and receivers depends on the way the system is used."], "jumps": ["P440", "P400"]}, {"id": "P420", "text": ["Just like AM transmitters and receivers, FM transmitters and receivers use oscillator, amplifier, and filter circuits."], "jumps": ["P430", "P400"]}, {"id": "P410", "text": ["FM transmitters and receivers contain more than just a modulator and demodulator."], "jumps": ["P420", "P400"]}, {"id": "P400", "text": ["In this lesson, you will observe the operation of a FM transmitter and receiver circuit.", "This item is optional. If it is not available, you will not be able to perform the experiment."], "jumps": ["P410", "P301"]}, {"id": "P301", "text": [], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "Items marked with an asterisks are optional.", "6. Nida Model 440 Function Generator XXXXXnt"], "jumps": []}, {"id": "P100", "text": ["w Observe the operation of a varactor (VCO) modulator transmitter. w Measure signals in a varactor (VCO) modulator transmitter.", "w Observe the operation of a discriminator demodulator receiver. w Measure signals in a discriminator demodulator receiver.", "2. FM Receiver Circuits (Discrminator) Optional", "w Observe the operation of a ratio demodulator receiver. w Measure signals in a ratio demodulator receiver................", "3. FM Receiver Circuits Ratio (Ratio) Optional"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This coursewa let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
