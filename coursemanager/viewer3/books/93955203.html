const book = {"title": "93955203", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: DC SERIES FIELD MOTORSf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["1. DC Series Field Motor. * Compare the characteristics of the DC Series Field Motor to the characteristics of the DC Shunt Field Motor. * Describe the techniques used to control the speed of a Series Field DC Motor. * Describe starting current as it relates to Motors. t as it relates to Motors.", "w Describe the characteristics of a DC Series Field Motor. w Compare the characteristics of the DC Series Field Motor to the characteristics of the DC Shunt Field Motor. w Describe the techniques used to control the speed of a Series Field DC Motor. w Describe starting current as it relates to Motors.", "w Observe the starting currents in a DC Series Field Motor. w Measure and calculate the characteristics of a DC Series Field Motor. w Compare the characteristics of a DC Series Field Motor to the characteristics of a DC Shunt Field Motor. w Measure CEMF in a Series Field Motor..."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "3. Nida Model 280 Rotating Machinery Trainer", "6. (2) Nida Model 488/480 Multimeter XXXXnt"], "jumps": []}, {"id": "P330", "text": ["Nida Model 280 Rotating Machinery Trainer"], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P350", "text": [], "jumps": []}, {"id": "P400", "text": ["This lesson teaches you about the DC Series Field Motor."], "jumps": ["P420", "P300"]}, {"id": "P420", "text": ["The basic characteristics of a DC Series Field Motor are the same as the DC Shunt Field Motor."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Some of the Series Field motor values are calculated differently than Shunt Field motor values. This is due to the field coil being in series with the armature coil."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on DC SERIES FIELD MOTOR..........................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The DC Series Field Motor has the field coil in series with the armature coil."], "jumps": ["P1025", "P1001"]}, {"id": "P1025", "text": ["The parts of the Series Field Motor are the same as the Shunt Field Motor."], "jumps": ["P1030", "P1020"]}, {"id": "P1030", "text": ["Remember, all motors have these same operating characteristics."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Loads applied to the motors decrease RPM."], "jumps": ["P1060", "P1030"]}, {"id": "P1060", "text": [], "jumps": ["P1070", "P1030"]}, {"id": "P1070", "text": ["As CEMF decreases, armature current (I ) increases. This is because more applied voltage is felt across the armature."], "jumps": ["P1080", "P1030"]}, {"id": "P1080", "text": [], "jumps": ["P1090", "P1030"]}, {"id": "P1090", "text": ["In a DC Series Field Motor, input power (P ) still equals the applied voltage times total current."], "jumps": ["P1100", "P1030", "P"]}, {"id": "P1100", "text": ["P = Speed x Torque x (0.1047) = Ft Lbs/Sec", "Output power equals speed (RPM) times torque (Ft", "P ( Watts ) = P ( Ft Lbs/Sec ) x 0.737 = Wattsss"], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["The differences between Shunt and Series DC Motors are their construction and how CEMF effects torque and armature current."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["Select the DC Series Field Motor..........................."], "jumps": ["P1110"]}, {"id": "P1121", "text": [], "jumps": []}, {"id": "P1122", "text": ["You selected the Shunt Field Motor. Notice that the field coil is in parallel to the armature."], "jumps": []}, {"id": "P1123", "text": ["You selected the Compound Field DC Motor. It has both a Series and Shunt Field."], "jumps": []}, {"id": "P1130", "text": ["In a DC Series Field motor, as load decreases, what happens to CEMF?"], "jumps": ["P1120"]}, {"id": "P1131", "text": [], "jumps": []}, {"id": "P1132", "text": ["For CEMF to decrease motor RPM must stay the same. A decreasing load causes RPM to change."], "jumps": []}, {"id": "P1133", "text": ["For CEMF to stay the same motor RPM must stay the same. A decreasing load causes RPM to change."], "jumps": []}, {"id": "P1140", "text": ["The construction of a DC Series motor is different from the DC Shunt motor."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["In the Shunt Motor, the field coil has many turns of fine wire designed to produce a high resistance."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["High resistance is needed to prevent a very large field current that could damage the field coil."], "jumps": ["P1170", "P1140"]}, {"id": "P1170", "text": ["In the Series Motor, the field coil has few turns of heavy wire designed to produce a low resistance."], "jumps": ["P1180", "P1140"]}, {"id": "P1180", "text": ["The low resistance is needed to allow most of E to be felt across the armature. This ensures the armature will rotate."], "jumps": ["P1190", "P1140"]}, {"id": "P1190", "text": ["What type of field coil is used in a DC Series Field motor?"], "jumps": ["P1140"]}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1192", "text": ["If a high resistance field coil is used in a DC Series Motor, most of E is dropped across the field coil leaving very little voltage across the armature. The rotor would not rotate.."], "jumps": []}, {"id": "P1200", "text": ["To compare Series and Shunt Motors, the below values were chosen to produce identical magnetic fields."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["The armature produces the same magnetic field. MMF = (Number of turns on Armature) x (Armature Current) N x I Series = N x I Shunt = N x I = 200 x 1A = 200 x 1A = 200 MMF = 200 MMF A"], "jumps": ["P1220", "P1200", "P1215"]}, {"id": "P1212", "text": ["The armature produces the same magnetic field. MMF = (Number of turns on Armature) x (Armature Current) N x I Series = N x I Shunt = N x I = 200 x 1A = 200 x 1A = 200 MMF = 200 MMF"], "jumps": ["P1220", "P1200", "P1215"]}, {"id": "P1215", "text": ["MAGNETOMOTIVE FORCE (MMF) - The force of a magnetic field (MMF) depends on the current in the coil and the number of turns in the coil."], "jumps": []}, {"id": "P1220", "text": ["The field coils also produce the same magnetic fields. MMF = (Number of turns on Field Coil) x (Field Current) N x I Series = N x I Shunt = N x I = 10 x 1A = 100 x .1A = 10 MMF = 10 MMF F"], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["The characteristics between identical Series and Shunt Motors can be compared."], "jumps": ["P1240", "P1200"]}, {"id": "P1240", "text": ["First assume that CEMF is 0 and the motors have locked rotors or 0 RPM."], "jumps": ["P1250", "P1200"]}, {"id": "P1250", "text": ["The circuit values for both motors are shown...............", "10 turns 1W I - 1A E - 1V 200 turns 24W I - 1A E - 24VVVVVV", "100 turns 250W I - .1A E - 25V 200 turns 24W I - 1A E - 25VVVVV"], "jumps": ["P1260", "P1200"]}, {"id": "P1255", "text": ["Given R = 1W R = 24W R = 25W R = 25V I = 1AA", "n R = 1W R = 24W R = 25W R = 25V I = 1AA"], "jumps": []}, {"id": "P1257", "text": ["Given R = 1W R = 24W R = 25W R = 25V I = 1AA", "n R = 1W R = 24W R = 25W R = 25V I = 1AA"], "jumps": []}, {"id": "P1260", "text": ["10 turns 1W I - 1A E - 1V 200 turns 24W I - 1A E - 24V", "100 turns 250W I - .1A E - 25V 200 turns 24W I - 1A E - 25V5VV", "Lbs. Shunt Motor Torque = I x I x K = 1 x .1 x 1 = .1 Ft"], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["Lbs. Series Motor Shunt Motor Torque = I x I x K Torque = I x I x K = 1A x 1A x 1 = 1 x .1 x 1 = 1 Ft", "Lbs = .1 Ft"], "jumps": ["P1290", "P1250"]}, {"id": "P1290", "text": ["Notice that the Series Motor has more torque Series Motor Shunt Motor Torque = I x I x K Torque = I x I x K = 1A x 1A x 1 = 1 x .1 x 1 = 1 Ft", "Lbs = .1 Ft", "Lbs. Series Motor Shunt Motor Torque = I x I x K Torque = I x I x K = 1A x 1A x 1 = 1 x .1 x 1 = 1 Ft"], "jumps": ["P1300", "P1250"]}, {"id": "P1300", "text": ["Higher torque at lower speeds is a DC Series Motor characteristic."], "jumps": ["P1310", "P1250"]}, {"id": "P1310", "text": ["Let's see what happens when CEMF increases. turns 1 EA = 25V 100 turns EA - 25V IF - .1A 250 EF - .1V IF - .1A EF - 25V A 200 turns A 200", "100 turns 250 W I - .1A E - 25V CEMF - 22.5V I - .1A E - 25V E - 25V", "10 turns 1 W I - 01A E - 01V 200 turns 24W CEMF - 22.5V I - .1A E - 2.4V E - 24.9V"], "jumps": ["P1320", "P1250"]}, {"id": "P1320", "text": ["The circuit values are shown below. .ect a circuit to see calculations.", "10 turns 1W I - .1A E - .1V 200 turns CEMF - 22.5V 24W I - .1A E - 2.4V E - 24.9V", "200 turns 24W IF - .1A EF - 25V CEMF - 22.5V IA - .1A Ecoil - 25V Earm - 25V5V Earm - 25V", "100 turns 250W I - .1A E - 25V CEMF - 22.5V I - .1A E - 25V E - 25Vrm - 25V"], "jumps": ["P1330", "P1310"]}, {"id": "P1322", "text": ["The circuit values are shown below. lect a circuit to see calculations. 10 turns 1 E 100 turns E IF - .1A A = 25V 250 A - 25V EF - .1V IF - .1A EF - 25V", "100 turns 250W I - .1A E - 25V CEMF - 22.5V I - .1A E - 25V E - 25Vrm - 25V", "10 turns 1W I - .1A E - .1V 200 turns CEMF - 22.5V 24W I - .1A E - 2.4V E - 24.9V", "200 turns 24W IF - .1A EF - 25V CEMF - 22.5V IA - .1A Ecoil - 25V Earm - 25V5V Earm - 25V"], "jumps": ["P1330", "P1310"]}, {"id": "P1325", "text": ["Given R = 1W R = 24W R = 25W R = 25V I = 1AA", "n R = 1W R = 24W R = 25W R = 25V I = 1AA"], "jumps": []}, {"id": "P1327", "text": ["Given R = 1W R = 24W R = 25W R = 25V I = 1AA", "n R = 1W R = 24W R = 25W R = 25V I = 1AA"], "jumps": []}, {"id": "P1330", "text": ["After CEMF has been applied, both the Series and Shunt Motors have a torque of .01 Ft", "Lbs. Series Torque = .1A x .1A x 1 Shunt Torque = .1A x .1A x 1 = .01 Ft", "Lbs = .01 Ft"], "jumps": ["P1340", "P1310"]}, {"id": "P1340", "text": ["Lbs, a .99 difference. The Shunt Motor decreased from .1 Ft"], "jumps": ["P1350", "P1310"]}, {"id": "P1350", "text": ["This illustrates that torque drops quicker (.99 Ft", "Lbs) in a Series Motor than in a Shunt Motor."], "jumps": ["P1360", "P1310"]}, {"id": "P1360", "text": ["In other words, a Series Motor has less high speed torque than a Shunt Motor."], "jumps": ["P1370", "P1310"]}, {"id": "P1370", "text": ["Which type of DC motor would a power screwdriver that requires low RPM and high torque use? S"], "jumps": ["P1310"]}, {"id": "P1371", "text": [], "jumps": []}, {"id": "P1372", "text": ["Remember, a Shunt Motor has high torque at high RPM. A screwdriver needs high torque at low RPM."], "jumps": []}, {"id": "P1380", "text": ["The next motor characteristic we will discuss is speed control."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["The DC Shunt Field Motor uses 2 types of speed control, Armature and Shunt field resistance.A"], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["The armature speed control varies the applied voltage."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["The Shunt Field resistance speed control varies the value of a resistor in series with the Field Coil."], "jumps": ["P1420", "P1390"]}, {"id": "P1420", "text": ["Let's examine why these two methods of speed control work in a Shunt Field DC Motor."], "jumps": ["P1430", "P1390"]}, {"id": "P1430", "text": ["First, recall how CEMF is produced. The armature is a conductor rotating in a magnetic field, much like a generator. Note there is always a constant (K) that represents the characteristics of the magnetic fields."], "jumps": ["P1440", "P1390"]}, {"id": "P1440", "text": ["Second, torque is the product of armature current, field current and the constant."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["Third, I can be shown by using the values of torque armature current and the constant.."], "jumps": ["P1460", "P1430"]}, {"id": "P1460", "text": ["Fourth, substituting I in the CEMF formula with I in the torque formula results in:", "SPEED x TORQUE I x KK"], "jumps": ["P1470", "P1430"]}, {"id": "P1470", "text": ["Notice that in the CEMF formula, the K's cancel out.", "SPEED x TORQUE I x K"], "jumps": ["P1480", "P1430"]}, {"id": "P1480", "text": ["Last, rearranging the new CEMF formula shows what affects motor speed.", "SPEED x TORQUE I KK", "CEMF x I TORQUE IA IA KK"], "jumps": ["P1490", "P1430"]}, {"id": "P1490", "text": ["The formulas show how a change in applied voltage changes motor speed.", "CEMF x I TORQUE IA IA KK"], "jumps": ["P1500", "P1480"]}, {"id": "P1500", "text": ["Changing Field current also changes torque, which inversely changes speed."], "jumps": ["P1510", "P1480"]}, {"id": "P1510", "text": ["The same two methods of speed control can also be used by DC Series Field Motors."], "jumps": ["P1520", "P1490"]}, {"id": "P1520", "text": ["Changing the applied voltage affects I , I and I . This will vary motor speed."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": [], "jumps": ["P1540", "P1510"]}, {"id": "P1540", "text": ["The resistor is a current divider that changes I , which varies motor speed."], "jumps": ["P1560", "P1510"]}, {"id": "P1560", "text": ["What method/methods are used for speed control of DC Series Field Motor?"], "jumps": ["P1510"]}, {"id": "P1561", "text": [], "jumps": []}, {"id": "P1562", "text": ["There are two ways to vary the speed of a DC Series Motor.."], "jumps": []}, {"id": "P1570", "text": ["Now let's investigate motor start currents................."], "jumps": ["P1580", "P1560"]}, {"id": "P1580", "text": ["When a motor is first turned on, there is 0 RPM and 0 CEMF."], "jumps": ["P1600", "P1570"]}, {"id": "P1600", "text": ["Since CEMF is 0, the entire applied voltage is felt across the armature coils. Armature current is maximum."], "jumps": ["P1610", "P1570"]}, {"id": "P1610", "text": ["As the motor begins to spin, armature current as well as total current drawn from the power source, will decrease due to CEMF.", "I decreases CEMF - Increasing I decreases", "RPM - 0 ses CMF - Increasing IT decreases"], "jumps": ["P1630", "P1570"]}, {"id": "P1630", "text": ["Even if the running current for a motor is small, the armature coil, field coil, and other connecting wires must be able to handle larger current at 0 RPM."], "jumps": ["P1640", "P1570"]}, {"id": "P1640", "text": ["In fact, some large motors have two sets of coils and wires that are controlled by a centrifugal switch."], "jumps": ["P1650", "P1570"]}, {"id": "P1650", "text": ["A heavy duty set of coils is used for starting the motor. This rates the motor for higher starting current."], "jumps": ["P1660", "P1640"]}, {"id": "P1660", "text": ["A normal set of coils is used when the motor is running. This rates the motor for lower running current."], "jumps": ["P1910", "P1640"]}, {"id": "P1910", "text": ["This completes the information on CHARACTERISTICS.E........"], "jumps": ["P1001", "P1640"]}, {"id": "P1920", "text": ["1. The DC Series Field Motor has the same basic characteristics as any motor."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. The Series Field Motor has the field coil in series to the armature."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. The Series Field Motor has more torque at lower RPM than the Shunt Field Motor.", "10 turns 1 W I - 1A E - 1V 200 turns 24W I - .1A E - 2.4V E - 24.9V- 24.9V9V", "100 turns 250 W I - .1A E - 25V I - .1A E - 25V E - 25V"], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. The Series Field Motor has less torque at higher RPM than the Shunt Field Motor.", "10 turns 1 W I - 01A E - 01V 200 turns 24W CEMF - 22.5V I - .1A E - 2.4V E - 24.9V", "100 turns 250 W I - .1A E - 25V CEMF - 22.5V I - .1A E - 25V E - 25V"], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. The speed of a motor is expressed as:..................", "Power out = Speed x Torque x (0.1047) = Ft Lbs/Secccccc", "Power out ( Watts ) = P ( Ft Lbs/Sec ) x 0.737 = Watts"], "jumps": ["P1970", "P1940"]}, {"id": "P1970", "text": ["6. DC Series Field Motors have 2 different types of speed control."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7. Starting current in a motor is always greater than running current."], "jumps": ["P1999", "P1970"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1980"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["In this experiment you will configure the 280 rotating machinery trainer as a DC Series Field Motor."], "jumps": ["P2025", "P2001"]}, {"id": "P2025", "text": ["You will first verify, by measurement, that the starting current, or locked rotator current, is greater than running current."], "jumps": ["P2030", "P2020"]}, {"id": "P2030", "text": ["You will measure motor current to determine torque. Then you will compare this v let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
