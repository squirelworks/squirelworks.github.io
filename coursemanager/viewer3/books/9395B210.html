<script>
const book = {"title": "9395B210", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: ANALOG PULSE MODULATION asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Define analog pulse modulation. w Describe pulse amplitude modulation. w Describe pulse width modulation. w Describe pulse position modulation."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you are taught the concept of analog pulse modulation."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["You have learned about AM and FM where a carrier signal is continuously varied by an information signal."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["In pulse modulation, a particular characteristic of a pulse is varied by the information signal."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["The difference is that in pulse modulation, there is no continuously varied signal."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["At times, the output is 0 which makes pulse modulation more efficient."], "jumps": ["P450", "P420"]}, {"id": "P450", "text": ["Let's begin the lesson on ANALOG PULSE MODULATION........................."], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1015", "text": ["Analog pulse modulation is a signal processing technique that varies a characteristic of a string of pulses according to an information signal."], "jumps": ["P1020", "P1001"]}, {"id": "P1020", "text": ["Analog pulse modulation is very similar to AM and FM, only the carrier signal is not a continuous sine wave."], "jumps": ["P1030", "P1015"]}, {"id": "P1030", "text": ["The carrier signal is a string of pulses and is called \"sampling pulses\"."], "jumps": ["P1040", "P1015"]}, {"id": "P1040", "text": ["In other words, pulse modulation is a technique that samples the information signal at a rate determined by the frequency of pulses."], "jumps": ["P1050", "P1015"]}, {"id": "P1050", "text": ["A characteristic of the sampling pulse is changed according to the information signal."], "jumps": ["P1060", "P1015"]}, {"id": "P1060", "text": ["In pulse modulation, what signals are used to produce the modulated signal?"], "jumps": ["P1015"]}, {"id": "P1061", "text": [], "jumps": []}, {"id": "P1062", "text": ["Pulse modulation uses an information signal but does not use a carrier signal.  A carrier signal is continuous and continuous       carrier signals are not used in pulse modulation.", "Pulse modulation uses an information signal but does not use a carrier signal. A carrier signal is continuous and continuous carrier signals are not used in pulse modulation."], "jumps": []}, {"id": "P1063", "text": ["Pulse modulation uses sampling pulses but does not use a carrier signal.  The sampling pulses replace the continuous carrier signal.", "Pulse modulation uses sampling pulses but does not use a carrier signal. The sampling pulses replace the continuous carrier signal."], "jumps": []}, {"id": "P1070", "text": ["The characteristics of a pulse that can be changed according to the information signal are:", "The characteristics of a pulse that can be changed according to the information signal are: (GRAPHICS TEXT) Amplitude Width Position M", "Amplitude Width Positionoltages and resistances. Using component leads to make measurements will result in incorrect readings and may damage components...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["Let's first discuss changes in the amplitude of the sampling pulses, or pulse amplitude modulation.", "Pulse Amplitude Modulation Pulse Width Modulation Pulse Position Modulationake measurements will result in incorrect readings and may damage components...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["Pulse Amplitude Modulation, or PAM for short, is very similar to AM and is the simplest pulse modulation technique to understand."], "jumps": ["P1100", "P1070"]}, {"id": "P1100", "text": ["The information signal amplitude changes the amplitude of the sampling pulses."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["And as in AM, PAM is susceptible to noise interference since noise represents changes in amplitude."], "jumps": ["P1120", "P1090"]}, {"id": "P1120", "text": ["Notice that there are two types of PAM signals, single polarity and dual polarity."], "jumps": ["P1130", "P1090"]}, {"id": "P1130", "text": ["In the modulator, which can be as simple as a relay or electronic switch, the information signal passes to the output when the         sampling pulse is high.", "In the modulator, which can be as simple as a relay or electronic switch, the information signal passes to the output when the sampling pulse is high."], "jumps": ["P1140", "P1090"]}, {"id": "P1140", "text": ["When the sampling pulse is low, the output of the modulator is zero, the information signal is blocked."], "jumps": ["P1150", "P1090"]}, {"id": "P1150", "text": ["In other words, the sampling pulses are used to gate the information signal on and off producing pulse amplitude modulation."], "jumps": ["P1160", "P1090"]}, {"id": "P1160", "text": ["Single polarity waveforms are formed by adding a bias to the naturally formed dual polarity waveform."], "jumps": ["P1170", "P1090"]}, {"id": "P1170", "text": ["By adding a positive bias, the dual polarity waveform is changed to a entirely positive single polarity waveform as shown."], "jumps": ["P1180", "P1090"]}, {"id": "P1180", "text": ["By adding a negative bias, the waveform becomes a negative single polarity waveform."], "jumps": ["P1190", "P1090"]}, {"id": "P1190", "text": ["In the demodulator, which is normally just a low pass filter the information signal is recovered."], "jumps": ["P1200", "P1090"]}, {"id": "P1200", "text": ["The low pass filter passes the low frequency information signal while blocking the high frequency sampling pulses."], "jumps": ["P1210", "P1090"]}, {"id": "P1210", "text": ["In PAM, what characteristic of the sampling pulses are changed according to the amplitude of the information signal?"], "jumps": ["P1090"]}, {"id": "P1211", "text": [], "jumps": []}, {"id": "P1212", "text": ["PAM stands for pulse amplitude modulation, the width of the sampling pulses is not changed."], "jumps": []}, {"id": "P1213", "text": ["PAM stands for pulse amplitude modulation, the position of the sampling pulses is not changed."], "jumps": []}, {"id": "P1220", "text": ["Which type of PAM signal is shown?", "Which type of PAM signal is shown?........................."], "jumps": ["P1210"]}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1222", "text": ["Notice that the PAM waveform is entirely negative.  It is not a positive single polarity waveform.", "Notice that the PAM waveform is entirely negative. It is not a positive single polarity waveform."], "jumps": []}, {"id": "P1223", "text": ["Notice that the PAM waveform is entirely negative.  It is not a dual polarity waveform.", "Notice that the PAM waveform is entirely negative. It is not a dual polarity waveform."], "jumps": []}, {"id": "P1230", "text": ["An important aspect of the sampling pulses is its frequency compared to the frequency of the information signal."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["In this example, there are 12 sampling pulses for each one cycle of the information signal."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["As you can see, the amplitude variations of the pulses produces a readily apparent information signal."], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["In the demodulator, a low pass filter would not have a difficult time passing the low frequency information signal and blocking the high frequency pulses."], "jumps": ["P1270", "P1230"]}, {"id": "P1270", "text": ["However, if the frequency of the information signal increased to the point where only one sampling pulse occurs for each cycle trouble arises."], "jumps": ["P1280", "P1230"]}, {"id": "P1280", "text": ["As you can see, the PAM signal is just one pulse and you would have a hard time visualizing the entire information signal waveform."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["And in the demodulator circuit, there is no telling how the low pass filter would react."], "jumps": ["P1300", "P1270"]}, {"id": "P1300", "text": ["In other words, the sampling pulses can not have the same frequency as the information signal."], "jumps": ["P1310", "P1270"]}, {"id": "P1310", "text": ["If the sampling pulses are twice the frequency, the pulses start to form the correct shape of the information signal."], "jumps": ["P1320", "P1270"]}, {"id": "P1320", "text": ["At four times the frequency, the shape of the information signal is better defined."], "jumps": ["P1330", "P1270"]}, {"id": "P1330", "text": ["The more pulse occurring during one cycle of the information signal results in a better representation of the original information."], "jumps": ["P1350", "P1270"]}, {"id": "P1350", "text": ["The minimum frequency of the sampling pulses is defined as the Nyquist rate, or fs for sampling.  The name Nyquist is from the      French mathematician that developed the relationship.", "The minimum frequency of the sampling pulses is defined as the Nyquist rate, or fs for sampling. The name Nyquist is from the French mathematician that developed the relationship.", "fs = 2(fmmax) Pulse Width Modulation Pulse Position Modulationon Modulationake measurements will result in incorrect readings and may damage components...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor."], "jumps": ["P1360", "P1270"]}, {"id": "P1360", "text": ["The Nyquist rate equals the highest frequency in the information signal times two.", "fs = 2(fmmax) Pulse Width Modulation Pulse Position Modulationon Modulationake measurements will result in incorrect readings and may damage components...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["For example, if your voice is to be pulse modulated the minimum sampling rate would have to be 8 kHz.  Your voice ranges from about 40 Hz to 4 kHz.", "For example, if your voice is to be pulse modulated the minimum sampling rate would have to be 8 kHz. Your voice ranges from about 40 Hz to 4 kHz.", "40 Hz 4 KHz Frequency Range"], "jumps": ["P1380", "P1350"]}, {"id": "P1380", "text": ["If an information signal that ranges from 10 kHz to 80 kHz is used in pulse modulation, what is the minimum sampling pulse frequency?"], "jumps": ["P1350", "P1385"]}, {"id": "P1381", "text": [], "jumps": []}, {"id": "P1382", "text": ["You used 10 kHz and multiplied by 2.  10 kHz is not the highest frequency in the information signal.", "You used 10 kHz and multiplied by 2. 10 kHz is not the highest frequency in the information signal."], "jumps": []}, {"id": "P1383", "text": ["You used the range of frequencies in the information signal multiplied by 2. 70 kHz is not the highest frequency in the        information signal.", "You used the range of frequencies in the information signal multiplied by 2. 70 kHz is not the highest frequency in the information signal."], "jumps": []}, {"id": "P1385", "text": ["MINIMUM SAMPLE RATE OR NYQUIST RATE - Where fs is the sample rate or sample frequency and fmmax is the maximum frequency in the modulating or information signal."], "jumps": []}, {"id": "P1390", "text": ["Note that the Nyquist rate applies to all types of pulse modulation, not just to PAM.", "fs = 2(fmmax) Pulse Width Modulation Pulse Position Modulationon Modulationake measurements will result in incorrect readings and may damage components...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor."], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["Now, let's look at pulse width modulation.", "Now, let's look at pulse width modulation..................", "Pulse Amplitude Modulation Pulse Width Modulation Pulse Position Modulationake measurements will result in incorrect readings and may damage components...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["Pulse Width Modulation, or PWM for short, is another method of pulse modulation."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["The information signal amplitude changes the pulse width of the sampling pulses."], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["Since the amplitude of the pulses is not changed, PWM is not susceptible to noise interference."], "jumps": ["P1440", "P1410"]}, {"id": "P1440", "text": ["Notice that there are three types of PWM signals, symmetrical, leading edge, and trailing edge."], "jumps": ["P1450", "P1410"]}, {"id": "P1450", "text": ["The symmetrical PWM waveform has both the leading and trailing edges of the pulse varied."], "jumps": ["P1460", "P1410"]}, {"id": "P1460", "text": ["The center of the pulses remain constant and equally spaced."], "jumps": ["P1470", "P1410"]}, {"id": "P1470", "text": ["When the information signal is at its positive peak the pulse width is at its maximum."], "jumps": ["P1480", "P1410"]}, {"id": "P1480", "text": ["When the information signal is at its negative peak the pulse width is at its minimum."], "jumps": ["P1490", "P1410"]}, {"id": "P1490", "text": ["Symmetrical PWM is not normally used because in the demodulator the center of a pulse is difficult to obtain."], "jumps": ["P1500", "P1410"]}, {"id": "P1500", "text": ["Leading edge PWM is used.  In this case only the leading edge of the pulse is varied according to the information.", "Leading edge PWM is used. In this case only the leading edge of the pulse is varied according to the information."], "jumps": ["P1510", "P1410"]}, {"id": "P1510", "text": ["The trailing edge of the pulse remains constant and equally spaced."], "jumps": ["P1520", "P1410"]}, {"id": "P1520", "text": ["Trailing edge PWM is also used.  In this case only the trailing edge of the pulse is varied according to the information signal.", "Trailing edge PWM is also used. In this case only the trailing edge of the pulse is varied according to the information signal."], "jumps": ["P1530", "P1410"]}, {"id": "P1530", "text": ["The leading edge of the pulse remains constant and equally spaced."], "jumps": ["P1540", "P1410"]}, {"id": "P1540", "text": ["In PWM, what characteristic of the sampling pulses are changed according to the amplitude of the information signal?"], "jumps": ["P1410"]}, {"id": "P1541", "text": [], "jumps": []}, {"id": "P1542", "text": ["PWM stands for pulse width modulation, the amplitude of the sampling pulses is not changed."], "jumps": []}, {"id": "P1543", "text": ["PWM stands for pulse width modulation, the position of the sampling pulses is not changed."], "jumps": []}, {"id": "P1550", "text": ["Which type of PWM signal is shown?", "Which type of PWM signal is shown?........................."], "jumps": ["P1540"]}, {"id": "P1551", "text": [], "jumps": []}, {"id": "P1552", "text": ["Notice that the leading edge is the only constant characteristic of the pulse.  The waveform is not symmetrical PWM.", "Notice that the leading edge is the only constant characteristic of the pulse. The waveform is not symmetrical PWM."], "jumps": []}, {"id": "P1553", "text": ["Notice that the leading edge is the only constant characteristic of the pulse.  The waveform is not leading edge PWM.", "Notice that the leading edge is the only constant characteristic of the pulse. The waveform is not leading edge PWM."], "jumps": []}, {"id": "P1560", "text": ["Even though PWM changed the pulse width of sampling pulses, an example PWM modulator circuit uses a triangular wave input as the sampling pulse input."], "jumps": ["P1570", "P1550"]}, {"id": "P1570", "text": ["By using simple summing, clipper and shaping circuit, the output that is produced is PWM."], "jumps": ["P1580", "P1560"]}, {"id": "P1580", "text": ["The summing circuit adds the information signal and triangular signal producing a triangular waveform riding on a sine wave."], "jumps": ["P1590", "P1560"]}, {"id": "P1590", "text": ["The clipping circuit eliminates the negative alternations producing different amplitude spikes."], "jumps": ["P1600", "P1560"]}, {"id": "P1600", "text": ["The shaping circuit, such as a schmitt trigger, changes the spikes into squares waves that have different pulse widths."], "jumps": ["P1610", "P1560"]}, {"id": "P1610", "text": ["Demodulator circuits use RC and filter circuits.", "Demodulator circuits use RC and filter circuits............"], "jumps": ["P1620", "P1560"]}, {"id": "P1620", "text": ["The RC circuit charges up a capacitor to different levels according to the width of the pulse."], "jumps": ["P1630", "P1610"]}, {"id": "P1630", "text": ["This changes the PWM signal into a PAM signal."], "jumps": ["P1640", "P1610"]}, {"id": "P1640", "text": ["Then the PAM signal is demodulated in the usual manner using a low pass filter."], "jumps": ["P1650", "P1610"]}, {"id": "P1650", "text": ["The frequency of the sampling pulses (or triangular wave) must be at least the Nyquist rate, or twice the highest frequency of the information signal."], "jumps": ["P1660", "P1610"]}, {"id": "P1660", "text": ["The final method of pulse modulation is pulse position modulation.", "Pulse Amplitude Modulation Pulse Width Modulation Pulse Position Modulationake measurements will result in incorrect readings and may damage components...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor."], "jumps": ["P1670", "P1650"]}, {"id": "P1670", "text": ["Pulse Position Modulation, or PPM for short, is the third type of pulse modulation."], "jumps": ["P1680", "P1660"]}, {"id": "P1680", "text": ["The information signal amplitude changes the position of the sampling pulses."], "jumps": ["P1690", "P1670"]}, {"id": "P1690", "text": ["The pulse amplitude and width remain constant."], "jumps": ["P1700", "P1670"]}, {"id": "P1700", "text": ["Again, as in PWM, noise does not interfere with PWM system."], "jumps": ["P1710", "P1670"]}, {"id": "P1710", "text": ["PPM is similar to FM where the frequency changes."], "jumps": ["P1720", "P1670"]}, {"id": "P1720", "text": ["When the information signal is at its positive peak, the output pulse lags the input sampling pulse -- frequency increases."], "jumps": ["P1730", "P1670"]}, {"id": "P1730", "text": ["When the information signal is at its negative peak, the output pulse lags the input sampling pulse -- frequency decreases."], "jumps": ["P1740", "P1670"]}, {"id": "P1740", "text": ["In PPM, what characteristic of the sampling pulses are changed according to the amplitude of the information signal?"], "jumps": ["P1670"]}, {"id": "P1741", "text": [], "jumps": []}, {"id": "P1742", "text": ["PPM stands for pulse position modulation, the amplitude of the sampling pulses is not changed."], "jumps": []}, {"id": "P1743", "text": ["PPM stands for pulse position modulation, the width of the sampling pulses is not changed."], "jumps": []}, {"id": "P1750", "text": ["PAM and PPM are similar to what type of modulation techniques?"], "jumps": ["P1740"]}, {"id": "P1751", "text": [], "jumps": []}, {"id": "P1752", "text": ["PAM is pulse amplitude modulation, it does not deal with frequency changes. PPM is pulse position modulation, it does not deal with amplitude changes.", "PAM is pulse amplitude modulation, it does not deal with frequency changes. PPM is pulse position modulation, it does not deal with amplitude changes......"], "jumps": []}, {"id": "P1753", "text": ["PAM is pulse amplitude modulation and is similar to AM. However, PPM is pulse position modulation and does not deal with amplitude changes."], "jumps": []}, {"id": "P1760", "text": ["A PPM modulator circuit normally uses a pulse width modulator, differentiator, clipper, and multivibrator circuits."], "jumps": ["P1770", "P1750"]}, {"id": "P1770", "text": ["The modulator produces different size pulses according to the information input signal."], "jumps": ["P1780", "P1760"]}, {"id": "P1780", "text": ["The differentiator produces unequally spaced spikes."], "jumps": ["P1790", "P1760"]}, {"id": "P1790", "text": ["The clipper removes the positive or negative spikes."], "jumps": ["P1800", "P1760"]}, {"id": "P1800", "text": ["And finally, the monostable multivibrator produces equal amplitude and width pulses at different positions."], "jumps": ["P1810", "P1760"]}, {"id": "P1810", "text": ["Demdoulator circuits normally contain a flip-flop, RC circuit, and a filter."], "jumps": ["P1820", "P1760"]}, {"id": "P1820", "text": ["The flip-flop changes the PPM waveform into a PWM waveform."], "jumps": ["P1830", "P1810"]}, {"id": "P1830", "text": ["The RC circuit changes the PWM waveform into a PAM waveform."], "jumps": ["P1840", "P1810"]}, {"id": "P1840", "text": ["The filter recovers the original information signal."], "jumps": ["P1850", "P1810"]}, {"id": "P1850", "text": ["Finally, PPM also requires the Nyquist rule as the sampling pulse frequency."], "jumps": ["P1860", "P1810"]}, {"id": "P1860", "text": ["As you have seen, PAM, PWM, and PPM are similar to AM and FM but use pulses instead of a carrier signal."], "jumps": ["P1910", "P1850"]}, {"id": "P1910", "text": ["This completes the information on ANALOG PULSE MODULATION.", "This completes the information on ANALOG PULSE MODULATION...."], "jumps": ["P1001", "P1860"]}, {"id": "P1920", "text": ["1.  Analog pulse modulation is a signal processing technique             that varies a characteristic of a string of pulses according to          an information signal.", "1. Analog pulse modulation is a signal processing technique that varies a characteristic of a string of pulses according to an information signal."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  The characteristics of the sampling pulses that may be                    ch let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
