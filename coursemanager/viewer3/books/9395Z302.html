const book = {"title": "9395Z302", "pages": [{"id": "P1060", "text": ["The EFIS is normally used for flight operations and displays flight data. Most large aircraft use an EFIS with either an Engine Indicating and Crew Alerting System EICAS, or an Electronic Centralized Aircraft Monitoring System ECAM. gine Indicating and Crew Alerting System (EICAS) Electronic Centralized Aircraft Monitoring (ECAM)", "Engine Indicating and Crew Alerting System(EICAS) Electronic Centralized Aircraft Monitoring (ECAM) nic Centralized Aircraft Monitoring (ECAM)", "How the aircraft monitoring and alerting systems collect data and deliver recommended corrective actions will be explained in this lesson."], "jumps": ["P1070", "P1050"]}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10229", "text": ["Multipurpose Control Display Unit (MCDU)", "Which BITE system may indicate a class 2 fault only when the aircraft is on the ground and the engines off?", "Central Maintenance Computer System (CMCS)"], "jumps": []}, {"id": "P10228", "text": ["Multipurpose Control Display Unit (MCDU)", "Which BITE system provides the ability to make a printed copy and transfer the information on a floppy diskette?", "Central Maintenance Computer System (CMCS)"], "jumps": []}, {"id": "P10227", "text": ["What CFDS fault category allows only the technician to view or retract the data?"], "jumps": []}, {"id": "P10226", "text": ["What does it mean when the CFDS places a fault in category 3?", "Required action before the next scheduled maintenance.", "Required action at the next scheduled maintenance."], "jumps": []}, {"id": "P10225", "text": ["What type of information does the BITE system provide?"], "jumps": []}, {"id": "P10224", "text": ["How many past flights may the technician review from the BITE system?"], "jumps": []}, {"id": "P10223", "text": ["Multipurpose Control Display Unit (MCDU)", "Which of the following is a type of a BITE system?", "Central Maintenance Computer System (CMCS)"], "jumps": []}, {"id": "P10222", "text": ["Some BITE systems have the ability to radio the information to the repair facility during the flight. This allows the repair facility to have the parts and equipment ready when the aircraft lands."], "jumps": []}, {"id": "P10221", "text": ["Engine Indicating and Crew Alerting System (EICAS)", "Which system monitors and stores the information during the flight so the repair facility may have a record of the condition?", "Electronic Flight Instrument System (EFIS)", "Electronic Centralized Aircraft Monitoring (ECAM)"], "jumps": []}, {"id": "P10220", "text": ["Engine Indicating and Crew Alerting System (EICAS)", "What has been installed to aid the pilot and repair facility to correctly identify the faulty components?", "Electronic Flight Instrument System (EFIS)", "Electronic Centralized Aircraft Monitoring (ECAM)"], "jumps": []}, {"id": "P10219", "text": ["Engine Indicating and Crew Alerting System (EICAS)", "What type of monitoring system uses the SDAC and FWC to collect data from the aircraft systems?", "Electronic Centralized Aircraft Monitoring (ECAM)", "Electronic Flight Instrument System (EFIS)"], "jumps": []}, {"id": "P10218", "text": ["What type of information is displayed on the main display monitor?", "Engine Rotor Speed and System Status Memos"], "jumps": []}, {"id": "P10217", "text": ["The two monitors for the EICAS and ECAM are called the _______ and the _______ monitors."], "jumps": []}, {"id": "P10216", "text": ["Engine Indicating and Crew Alerting System (EICAS)", "What system monitors system parameters such as engine pressure ratio, engine RPM, hydraulic system pressure, and electrical systems?", "Electronic Centralized Aircraft Monitoring (ECAM)", "Electronic Flight Instrument System (EFIS)"], "jumps": []}, {"id": "P10215", "text": ["Engine Indicating and Crew Alerting System (EICAS)", "What is used to monitor aircraft system parameters?", "Electronic Centralized Aircraft Monitoring (ECAM)", "Electronic Flight Instrument System (EFIS)"], "jumps": []}, {"id": "P10214", "text": ["What components of the EFIS collect data from the aircraft system computers and determine which display is used to display the information?", "Electronic Centralized Aircraft Monitoring"], "jumps": []}, {"id": "P10213", "text": ["Name the three main sections of the Electronic Flight Instrument System (EFIS).", "Pilot's Display, Copilot's Display and Navigation Display", "Pilot's Display, Copilot's Display and Multifunction Display", "Pilot's Display, Copilot's Display and Weather/Radar Display."], "jumps": []}, {"id": "P10212", "text": ["Engine Indicating and Crew Alerting System (EICAS)", "What system is used for normal flight operation and displays flight data?", "Electronic Centralized Aircraft Monitoring (ECAM)", "Electronic Flight Instrument System (EFIS)"], "jumps": []}, {"id": "P10211", "text": ["Why do the Line Replaceable Units (LRU) meet the airline industry requirements for service?", "Are easy to repair on board the aircraft."], "jumps": []}, {"id": "P10210", "text": ["What components are referred to as black boxes?", "Electronic Flight Instrument System (EFIS)", "Engine Indicating and Crew Alerting System (EICAS)", "Electronic Centralized Aircraft Monitoring (ECAM)"], "jumps": []}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P100", "text": ["w Describe the systems and components of the aircraft monitoring and alerting system.", "1. Aircraft Monitoring and Alerting System", "w Describe the different types of aircraft built-in fault and maintenance test equipment.", "2. Aircraft Built-In Fault and Test Equipment"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P440", "text": ["How the aircraft monitoring and alerting systems collect data and deliver recommended corrective actions will be explained in this lesson."], "jumps": ["P450", "P410"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10", "text": ["ENGINE MONITORING AND CREW ALERTING SYSTEMS", "6. The Multipurpose Control Display Unit (MCDU) and Central Maintenance Computer System (CMCS) are connected to the EICAS."], "jumps": ["P2980", "P2960"]}, {"id": "P430", "text": ["Monitoring systems give the pilot quick and accurate information about malfunctions and corrective actions that should be taken."], "jumps": ["P440", "P410"]}, {"id": "P2950", "text": ["3. There are three 3 types of BITE systems used in today's aircraft.", "Multipurpose Control Display Unit (MCDU) Central Maintenance Computer System (CMCS) Centralized Fault Display System (CFDS)"], "jumps": ["P2960", "P2930"]}, {"id": "P2960", "text": ["5. All BITE systems hold information of the last 10 flights to be reviewed for equipment trends.."], "jumps": ["P2970", "P2950"]}, {"id": "P2920", "text": ["1. In-flight information is monitored and stored by Built-In Test Equipment (BITE).", "This completes the information on BUILT-IN FAULT AND TEST EQUIPMENT.", "7. The Centralized Fault Display System (CFDS) is connected to the ECAM system."], "jumps": ["P2930", "P2001", "P2999", "P2970"]}, {"id": "P1030", "text": ["Black boxes are Line Replaceable Units (LRUs) designed for quick field removal and replacement. The faulty unit is removed and a good unit is installed immediately. Then the faulty unit is usually sent to a shop for repair..."], "jumps": ["P1040", "P1020"]}, {"id": "P2341", "text": [], "jumps": []}, {"id": "P2910", "text": ["This completes the information on BUILT-IN FAULT AND TEST EQUIPMENT."], "jumps": ["P2001", "P2350"]}, {"id": "P2340", "text": ["Which BITE system is connected to the ECAM system?.........", "Multipurpose Control Display Unit (MCDU)", "Central Maintenance Computer System (CMCS)"], "jumps": ["P2330"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2980"]}, {"id": "P1050", "text": ["The EFIS was developed to reduce instrument panel confusion. Conventional gauges were replaced with display monitors called CRTs (cathode-ray tubes).", "EFIS CRT (Electronic Flight Instrument System)System)"], "jumps": ["P1060", "P1040"]}, {"id": "P2331", "text": ["The Multipurpose Control Display Unit (MCDU) and Central Maintenance Computer System (CMCS) do not classify the information.", "Class 1 and 2 are reported to the crew through the ECAM system. The crew may then select the specific information from the CFDS display located between the pilots.", "The Multipurpose Control Display Unit (MCDU) and Central Maintenance Computer System (CMCS) are connected to the EICAS system."], "jumps": []}, {"id": "P2350", "text": ["All three BITE systems provide accurate and time saving troubleshooting information. In addition, the BITE systems are used to test the aircraft systems after repairs are made.", "ddition, the BITE systems are used to test the aircraft systems after repairs are made."], "jumps": ["P2910", "P2340"]}, {"id": "P2930", "text": ["2. Technicians accesses BITE records and the pilot's log to isolate faulty system components.", "The Centralized Fault Display System (CFDS) is used with the Electronic Centralized Aircraft Monitoring (ECAM) instead of the EICAS.", "Class 1 and 2 are reported to the crew through the ECAM system. The crew may then select the specific information from the CFDS display located between the pilots."], "jumps": ["P2950", "P2920", "P2280", "P2260", "P2295"]}, {"id": "P2295", "text": ["Pilots can select specific system information using the Centralized Fault Display System display."], "jumps": ["P2300", "P2290"]}, {"id": "P2300", "text": ["All class 3 and some of class 2 conditions are considered to affect flight operation. These are displayed on the ECAM and activate the Master Warning system."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["Class 2 faults that are not critical to current flight are displayed to the pilot when the aircraft is on the ground and the engines are off."], "jumps": ["P2320", "P2290"]}, {"id": "P2241", "text": ["The BITE helps the pilot and repair facility to identify faulty systems and components. It also records in flight information for future action."], "jumps": []}, {"id": "P2250", "text": ["The Multipurpose Control Display Unit stores information about in flight conditions. How many of the last flights will the MCDU allow the technician to access information about?"], "jumps": ["P2240"]}, {"id": "P2252", "text": ["The Multipurpose Control Display Unit allows information of the last 10 flights to be reviewed for equipment trends."], "jumps": []}, {"id": "P2260", "text": ["Which system provides the crew with a printout of a fault condition?", "Multipurpose Control Display Unit (MCDU)", "Central Maintenance Computer System (CMCS)"], "jumps": ["P2250"]}, {"id": "P2310", "text": ["Class 2 faults that are not critical to current flight are displayed to the pilot when the aircraft is on the ground and the engines are off."], "jumps": ["P2320", "P2290"]}, {"id": "P2262", "text": ["The MCDU does not provide a printout of the flight information. It only displays information."], "jumps": []}, {"id": "P2300", "text": ["All class 3 and some of class 2 conditions are considered to affect flight operation. These are displayed on the ECAM and activate the Master Warning system."], "jumps": ["P2310", "P2290"]}, {"id": "P2320", "text": ["Class 3 information is normally accessed by the technician only and not provided to the crew during flight. The equipment or system error does not affect the flight and can be corrected at a later date..."], "jumps": ["P2330", "P2290"]}, {"id": "P2330", "text": ["Which BITE system places the faults into one of three categories?", "Multipurpose Control Display Unit (MCDU)", "Central Maintenance Computer System (CMCS)"], "jumps": ["P2320"]}, {"id": "P2230", "text": ["When a system fails, the EICAS alerts the pilots and displays the affected systems. The pilots can display the affected systems on the CMCS and make a printout for the log book.", "If more than one error occurred, the malfunctions are listed in the order they occurred. This is important because the first error may have caused the others."], "jumps": ["P2240", "P2220", "P2150"]}, {"id": "P2180", "text": ["When no fault is present, the system indicates the systems name and the word \"OK\".", "If more than one error occurred, the malfunctions are listed in the order they occurred. This is important because the first error may have caused the others."], "jumps": ["P2190", "P2150"]}, {"id": "P2140", "text": ["The information normally passes through the MCDU for recording before it is sent to the EICAS. However, the information can come from the EICAS. Both computers are able to communicate with each other to verify the information...", "The Multipurpose Control Display Unit (MCDU) is normally accessed from the equipment bay or the flight deck."], "jumps": ["P2150", "P2120", "P2130", "P2110"]}, {"id": "P2200", "text": ["The Central Maintenance Computer System (CMCS) performs the same functions as the MCDU except it gives a more descriptive report and it is accessible by the crew. It is located in the center console of the flight deck..."], "jumps": ["P2210", "P2190"]}, {"id": "P2090", "text": ["When the aircraft returns, the technician accesses the BITE records to find the indicated fault. The pilot's log book along with the BITE information enable the technician to isolate the problem...", "BITE systems are tied into the aircraft Engine Indicating and Crew Alerting System (EICAS) and Electronic Centralized Aircraft Monitoring (ECAM)."], "jumps": ["P2100", "P2070", "P2080", "P2050"]}, {"id": "P2100", "text": ["Some BITE systems can radio in-flight information ahead to the repair facility. This allows the repair facility to have parts and equipment ready when the aircraft lands."], "jumps": ["P2110", "P2090"]}, {"id": "P2150", "text": ["The MCDU allows information of the last 10 flights to be reviewed for equipment trends."], "jumps": ["P2160", "P2120"]}, {"id": "P2160", "text": ["The display of the MCDU indicates the flight number, system that had the error, and the error code. The technician then defines the code and the fault is identified."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["If more than one error occurred, the malfunctions are listed in the order they occurred. This is important because the first error may have caused the others.", "The display of the MCDU indicates the flight number, system that had the error, and the error code. The technician then defines the code and the fault is identified."], "jumps": ["P2180", "P2150"]}, {"id": "P2020", "text": ["Up to now, you have seen that the pilot and crew have many systems to monitor. The pilot is also responsible for reporting all malfunctioning systems to the repair facility."], "jumps": ["P2030", "P2001"]}, {"id": "P2040", "text": ["A supporting system may cause a main system error message. These types of faults normally cannot be found by the pilot; they usually require troubleshooting by a technician."], "jumps": ["P2050", "P2030"]}, {"id": "P2220", "text": ["The CMCS has its own display monitor and control panel located between the pilots. The Central Maintenance Computer system (CMAS) has the ability to transfer the information to a floppy diskette..."], "jumps": ["P2230", "P2210"]}, {"id": "P2261", "text": [], "jumps": []}, {"id": "P2285", "text": ["The information is given a class according to the urgency of repair."], "jumps": ["P2290", "P2280"]}, {"id": "P1960", "text": ["5. The EICAS computers send the data to the main and auxiliary display monitor via the EFIS display processor unit and the display control panel.", "4. When a fault has occurred, both systems (EICAS and ECAM) activate the master annunciator and if severe enough, an audible alarm is sounded."], "jumps": ["P1970", "P1940"]}, {"id": "P1940", "text": ["3. In conjunction with the EFIS system, the EICAS displays parameters such as: engine pressure ratio, engine RPM, hydraulic system pressure, and electrical systems.", "2. The Electronic Flight Instrument System (EFIS) is normally used for flight operations and displays flight data. Most large aircraft use an EFIS with either an EICAS or an ECAM system.", "Electronic Flight Instrument System (EFIS) Engine Indicating and Crew Alerting System(EICAS) Electronic Centralized Aircraft Monitoring (ECAM)"], "jumps": ["P1950", "P1930", "P1940", "P1920"]}, {"id": "P1920", "text": ["1. Black boxes are Line Replaceable Units (LRUs) designed for quick field removal and replacement. A new unit is quickly installed and the faulty unit is sent to the shop for repairs.", "This completes the information on MONITORING AND ALERTING SYSTEM."], "jumps": ["P1930", "P1001"]}, {"id": "P2110", "text": ["This lesson discusses three types of BITE systems used in today's aircraft.", "Multipurpose Control Display Unit (MCDU) Central Maintenance Computer System (CMCS) Centralized Fault Display System (CFDS)"], "jumps": ["P2120", "P2100"]}, {"id": "P1930", "text": ["2. The Electronic Flight Instrument System (EFIS) is normally used for flight operations and displays flight data. Most large aircraft use an EFIS with either an EICAS or an ECAM system.", "Electronic Flight Instrument System (EFIS) Engine Indicating and Crew Alerting System(EICAS) Electronic Centralized Aircraft Monitoring (ECAM)"], "jumps": ["P1940", "P1920"]}, {"id": "P1950", "text": ["4. When a fault has occurred, both systems (EICAS and ECAM) activate the master annunciator and if severe enough, an audible alarm is sounded."], "jumps": ["P1960", "P1940"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2080", "text": ["The BITE system records the information and sends it to the EICAS or the ECAM system."], "jumps": ["P2090", "P2070"]}, {"id": "P450", "text": ["Let's begin the lesson on ENGINE MONITORING & CREW ALERTING SYSTEM.........."], "jumps": ["P410"]}, {"id": "P2295", "text": ["Pilots can select specific system information using the Centralized Fault Display System display."], "jumps": ["P2300", "P2290"]}, {"id": "P1410", "text": ["The auxiliary monitor displays system information as needed by the pilots. It also acts as a backup to the main monitor.", "The main monitor displays: flap positions, fuel quantity, engine pressure ratio, thrust limit, engine rotor speed, system status memos, system warnings, and the affected systems."], "jumps": ["P1420", "P1390"]}, {"id": "P1440", "text": ["The systems covered will also alert the crew of vital indications when they arise."], "jumps": ["P1910", "P1390"]}, {"id": "P900", "text": [], "jumps": ["P450"]}, {"id": "P1970", "text": ["6. The operation of the ECAM is the same as the EICAS. However, the ECAM has four computers for collecting system data."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7. Two System Data Acquisition Concentrator (SDAC) computers collect system data and determine if a red warning condition exists. At the same time, two Flight Warning Computers (FWC) check the same data and determine if a yellow warning condition exists."], "jumps": ["P1999", "P1970"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1970"]}, {"id": "P1332", "text": ["The lower auxiliary display monitor displays the system information as needed by the pilots and is normally blank."], "jumps": []}, {"id": "P1360", "text": ["At the same time, two Flight Warning computers (FWC) check the same data and determine if a yellow warning condition exists.", "Two System Data Acquisition Concentrator (SDAC) computers collect system data and determine if a red warning condition exists."], "jumps": ["P1370", "P1340"]}, {"id": "P1331", "text": [], "jumps": []}, {"id": "P1350", "text": ["Two System Data Acquisition Concentrator (SDAC) computers collect system data and determine if a red warning condition exists."], "jumps": ["P1360", "P1340"]}, {"id": "P1310", "text": ["The lower auxiliary display monitor displays the system information as needed by the pilots.", "F. USED 1530 15600", "C 75 7555555555556060 15600", "C G.W.60300 KG SAT + 18", "C 23 H 56 C.G.28%%%%%%%%%%%%"], "jumps": ["P1320", "P1300"]}, {"id": "P1330", "text": ["What does the EICAS main display monitor display?.........."], "jumps": ["P1320"]}, {"id": "P1370", "text": ["Both sets of computers (SDAC and FWC) activate the Master Warning, audible alarm, and Master Caution lights on the annunciator panel."], "jumps": ["P1380", "P1340"]}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1320", "text": ["The Electronic Flight Instrument System (EFIS) displays flight information, while the Engine Indicating and Crew Alerting System (EICAS) displays system parameters."], "jumps": ["P1310"]}, {"id": "P1260", "text": ["The Engine Indicating and Crew Alerting System computers are normal split, meaning the right side computer handles the right side of the aircraft and the left computer handles the left side of the aircraft..."], "jumps": ["P1270", "P1220"]}, {"id": "P1240", "text": ["The auxiliary monitor displays fault information and is used as a backup for the main display. The auxiliary display is blank unless information is available."], "jumps": ["P1250", "P1220"]}, {"id": "P1220", "text": ["The information is displayed on two vertically stacked CRT monitors located between the pilot and copilot. These monitors are not part of the 5 EFIS monitors; they are additional."], "jumps": ["P1230", "P1180"]}, {"id": "P1200", "text": ["C G.W. XX XG SAT + 18", "Normally, the EICAS system displays a minimum of engine data. The pilot can obtain additional information at his discretion."], "jumps": ["P1210", "P1180"]}, {"id": "P1180", "text": ["The Engine Indicating and Crew Alerting System EICAS uses a digitally controlled CRT to display various system parameters.", "EICAS (Engine Indicating and Crew Alerting System)"], "jumps": ["P1170", "P1190"]}, {"id": "P1190", "text": ["When the EICAS is used in conjunction with the Electronic Flight Instrument System (EFIS) the EICAS displays such parameters as: engine pressure ratio, RPM, hydraulic pressure, and electrical system information..."], "jumps": ["P1200", "P1180"]}, {"id": "P1290", "text": ["The EICAS computers send the data to the main and auxiliary display monitor via the Electronic Flight Instrument System (EFIS) display processor unit.", "When the EICAS is used in conjunction with the Electronic Flight Instrument System (EFIS) the EICAS displays such parameters as: engine pressure ratio, RPM, hydraulic pressure, and electrical system information..."], "jumps": ["P1300", "P1220"]}, {"id": "P1162", "text": ["The system consists of 5 CRT monitors. There are 4 primary monitors and 1 multifunction monitor."], "jumps": []}, {"id": "P1170", "text": ["What type of information does the EFIS provide?............"], "jumps": ["P1160"]}, {"id": "P1380", "text": ["The data collected from the system by the SDAC and FWC is sent to the Electronic Flight Instrument System (EFIS) processor units. The display processor units determine which monitor displays the information..."], "jumps": ["P1390", "P1340"]}, {"id": "P1420", "text": ["If a system failure occurs, the auxiliary monitor displays the system page and the main monitor lists the status of the affected system."], "jumps": ["P1430", "P1390"]}, {"id": "P1430", "text": ["You can see how important proper operation of the systems is to achieve safe and comfortable flight for the crew and passengers."], "jumps": ["P1440", "P1390"]}, {"id": "P1150", "text": ["What is the purpose of the Line Replaceable Units (LRU)? .", "allow for repair of the computer in a shop.", "quick replacement of the computer units."], "jumps": ["P1080"]}, {"id": "P1140", "text": ["The multifunction processor is able to input data to the right or left side display processor in the event of a sensory data failure to the display processor."], "jumps": ["P1150", "P1080"]}, {"id": "P1151", "text": [], "jumps": []}, {"id": "P1340", "text": ["Operation of the Electronic Centralized Aircraft Monitoring system (ECAM) is the same as the Engine Indicating and Crew Alerting systems (EICAS). However, the ECAM uses four computers to collect system data..."], "jumps": ["P1350", "P1330"]}, {"id": "P1390", "text": ["Like the Engine Indicating and Crew Alerting System, the ECAM also uses two monitors, main and auxiliary. ECAM monitors can be placed either side by side or stacked one over the other."], "jumps": ["P1400", "P1340"]}, {"id": "P1405", "text": ["The main monitor displays: flap positions, fuel quantity, engine pressure ratio, thrust limit, engine rotor speed, system status memos, system warnings, and the affected systems."], "jumps": ["P1410", "P1390"]}, {"id": "P1090", "text": ["The EFIS uses five CRT monitors. There are four primary monitors and one multifunction monitor.", "Black boxes are Line Replaceable Units (LRUs) designed for quick field removal and replacement. The faulty unit is removed and a good unit is installed immediately. Then the faulty unit is usually sent to a shop for repair..."], "jumps": ["P1100", "P1080"]}, {"id": "P1300", "text": ["The EICAS main display indicates: flap positions, fuel quantity, engine pressure ratio, thrust limit, engine rotor speed, system status memos, and any system warnings along with the affected system..."], "jumps": ["P1310", "P1220"]}, {"id": "PINFO", "text": ["07-30-00 Converted from SAM to toolbook. pat 08-09-00 Text and Branching. frieda 09-21-00 Most graphics. doan 09-22-00 Some graphics Chris 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-12-02 review - rs", "22-00 Some graphics Chris 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay"], "jumps": []}, {"id": "P300", "text": ["How the aircraft monitoring and alerting systems collect data and deliver recommended corrective actions will be explained in this lesson."], "jumps": ["P450", "P410"]}, {"id": "P1800", "text": ["Regulations concerning flight safety when transporting passengers has caused the commercial airlines to install protective systems and backup systems."], "jumps": ["P430", "P400"]}, {"id": "P1152", "text": ["A faulty LRU can be unplugged, pulled out, and sent to a shop for repair. When a faulty LRU has been removed, a working LRU is immediately plugged in its place."], "jumps": []}, {"id": "P2060", "text": ["During flight the BITE monitors and stores information."], "jumps": ["P2070", "P2050"]}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P2060", "text": ["During flight the BITE monitors and stores information."], "jumps": ["P2070", "P2050"]}, {"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its suppo "P1001"]}, {"id": "P2050", "text": ["Technician troubleshooting is assisted by Built-In Test Equipment known as BITE and the pilot's log."], "jumps": ["P2060", "P2030"]}, {"id": "P2210", "text": ["This system is most commonly found in state-of-the-art four engine transport category aircraft."], "jumps": ["P2220", "P2200"]}, {"id": "P2251", "text": [], "jumps": []}, {"id": "P400", "text": ["Today's large commercial aircraft are required to use more than one type of monitoring system to check aircraft functions."], "jumps": ["P410", "P300"]}, {"id": "P1080", "text": ["The EFIS can be divided into three sections: pilot's display, copilot's display, and the weather/radar display."], "jumps": ["P1090", "P1060"]}, {"id": "P1160", "text": ["How many CRT display monitors does the Electronic Flight Instrument System (EFIS) have?"], "jumps": ["P1150"]}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1210", "text": ["When a system malfunctions, information is automatically displayed and the Master Annunciator is illuminated. If the fault is critical, an audible alarm is also present."], "jumps": ["P1220", "P1180"]}, {"id": "P1230", "text": ["The main display is the top monitor and the bottom monitor is the auxiliary display. The main display shows minimum engine data."], "jumps": ["P1240", "P1220"]}, {"id": "P1250", "text": ["Two EICAS computers receive information from the system computers. There are over 400 system data inputs sent to the EICAS computers."], "jumps": ["P1260", "P1220"]}, {"id": "P1270", "text": ["In the event one of the EICAS computers fails, the remaining computer takes over for the failing unit."], "jumps": ["P1280", "P1220"]}, {"id": "P1280", "text": ["A maintenance panel, normally located in the cargo bay, is provided for collecting performance information of the aircraft during flight. This aids the technician in scheduling preventive maintenance and troubleshooting..."], "jumps": ["P1290", "P1220"]}, {"id": "P1400", "text": ["The ECAM displays the same information as the Engine Indicating and Crew Alerting System.", "C G.W. XX XG SAT + 18"], "jumps": ["P1405", "P1390"]}, {"id": "P1910", "text": ["This completes the information on MONITORING AND ALERTING SYSTEM."], "jumps": ["P1001", "P1440"]}, {"id": "P2130", "text": ["In-flight information is collected from the system or the Engine Indicating and Crew Alerting System (EICAS) and sent to the MCDU for recording.", "If a system failure occurs, the auxiliary monitor displays the system page and the main monitor lists the status of the affected system."], "jumps": ["P2140", "P2120"]}, {"id": "P1070", "text": ["Each manufacturer names components differently and has a slightly different design. These differences do not change the basic principle of component operation."], "jumps": ["P1080", "P1060"]}, {"id": "P1100", "text": ["The four primary monitors normally display the horizontal situation indicators and the attitude director indicators. One of each is placed at the pilot and copilot station."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["The two display processor units collect data from the aircraft system computers and determine which display is used to display the information."], "jumps": ["P1120", "P1080"]}, {"id": "P1120", "text": ["A multifunction processor unit is used to collect data from the weather, navigation, and radar systems. This information is then sent to the multifunction display."], "jumps": ["P1130", "P1080"]}, {"id": "P1130", "text": ["The multifunction display and processor are used to display diagnostic information. They also provide display and processor backup.", "\"You have successfully passed the assessment"], "jumps": ["P1140", "P1080"]}, {"id": "P2030", "text": ["Any faults indicated by the onboard computers or any visible faults are reported by the pilot to the repair facility.", "If the MCDU is located on the flight deck, the EICAS is used to read the MCDU, and the crew has the let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
