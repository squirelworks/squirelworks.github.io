const book = {"title": "9395B206", "pages": [{"id": "P0", "text": ["Nida Corporation 2003-2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003-2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . I .", "Title: BASIC FM CIRCUIT CONSTRUCTIONasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Construct a FM slope demodulator circuit. w Measure signals in a FM slope demodulator circuit...............", "w Construct a FM reactance modulator circuit. w Measure signals in a FM reactance modulator circuit."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 410 Multifunction Counter XXnt"], "jumps": []}, {"id": "P341", "text": [], "jumps": []}, {"id": "P342", "text": [], "jumps": []}, {"id": "P343", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will construct a basic FM modulator and demodulator circuit."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["After constructing the circuits, you will measure signals to verify circuit operation."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["The circuits constructed are the basic reactance modulator and slope demodulator."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["These basic circuits are found in many different types of equipment because of their simplicity and proven reliability."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Once you fully understand these circuits, more complex circuits are not so difficult."], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["Let's begin the lesson on BASIC FM CIRCUIT CONSTRUCTION..................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": ["In this experiment, you will construct and check out a FM reactance modulator circuit.", ". The experiment in this lesson is not setup to use the selected trainer.", "FET Pin Out Transistor Pin Out"], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["This modulator has an additional oscillator circuit that provides a carrier signal to modulate."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Q2 is a Hartley oscillator.  The tank circuit consists of L2, L3 and C7.", "Q2 is a Hartley oscillator. The tank circuit consists of L2, L3 and C7."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Q1 is the reactance circuit.  It changes capacitance in proportion to the amplitude of the information input signal.", "Q1 is the reactance circuit. It changes capacitance in proportion to the amplitude of the information input signal."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["The information input signal is supplied by the function generator.", "The circuit is constructed on the PC130-130X Model 130 Experimenter card."], "jumps": ["P1070", "P1020", "P1080"]}, {"id": "P1080", "text": ["The 130X card is a standard breadboarding card that provides connection to the test console power supplies and connectors."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["If you are unfamiliar with the card or breadboarding procedures, see your instructor."], "jumps": ["P1100", "P1070"]}, {"id": "P1100", "text": [], "jumps": ["P1110", "P1070"]}, {"id": "P1110", "text": ["1.  Set the Test Console controls to the initial control settings.", "2.  Construct the circuit shown on the PC130-130X card.  The              next  few pages will provide some hints.", "1. Set the Test Console controls to the initial control settings..........", "2. Construct the circuit shown on the PC130-130X card. The next few pages will provide some hints..", "FET Pin Out Transistor Pin Out"], "jumps": ["P1070", "P1130", "P1110"]}, {"id": "P1130", "text": ["A.  The upper and lower parts of the card can be used to                        construct the circuit. \nB.  C2 must be connected to the vertical column of Pin E as                  indicated on the card.  This is the information input signal to          the circuit.", "A. The upper and lower parts of the card can be used to construct the circuit. B. C2 must be connected to the vertical column of Pin E as indicated on the card. This is the information input signal to the circuit."], "jumps": ["P1131", "P1120"]}, {"id": "P1131", "text": ["C.  Use a wire connected to the junction of C7, L2 and C8 for the         output line of the circuit. \nD.  The rows of the breadboarding card are connected vertically.", "2.  Construct the circuit shown on the PC130-130X card.  The              next  few pages will provide some hints.", "C. Use a wire connected to the junction of C7, L2 and C8 for the output line of the circuit. D. The rows of the breadboarding card are connected vertically.", "2. Construct the circuit shown on the PC130-130X card. The next few pages will provide some hints..", "FET Pin Out Transistor Pin Out", "FM MODULATOR CIRCUIT - The example below illustrates one of many ways to construct the FM modulator circuit."], "jumps": ["P1140", "P1120", "P1135", "P1130", "P1110"]}, {"id": "P1140", "text": ["3.  Set the Positive Supply Control to 12. \n     The voltmeter on the 130A should indicate 12 Volts.", "3. Set the Positive Supply Control to 12. The voltmeter on the 130A should indicate 12 Volts."], "jumps": ["P1132"]}, {"id": "P1150", "text": ["4.  Insert PC130-130X in the PC1 position on the test console.", "4. Insert PC130-130X in the PC1 position on the test console."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["5.  Set PC1 DC Power Switch ON.", "5. Set PC1 DC Power Switch ON.ontrol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P1150"]}, {"id": "P1170", "text": ["If you constructed the circuit correctly, the modulator will be generating an output at the center frequency (no information signal) is being applied).  Let's check.", "If you constructed the circuit correctly, the modulator will be generating an output at the center frequency (no information signal) is being applied). Let's check."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["6.  Using the oscilloscope, measure the output of the circuit at             the junction of C7, C8 and L2.  Notice the waveform shape              and frequency.", "6. Using the oscilloscope, measure the output of the circuit at the junction of C7, C8 and L2. Notice the waveform shape and frequency."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["Are you viewing a sine wave signal?", "Are you viewing a sine wave signal?........................"], "jumps": ["P1180"]}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1192", "text": ["Something is wrong, check the following:", "Something is wrong, check the following:...................", "A. Ensure you are using the oscilloscope correctly. B. Check that you are measuring the output of the circuit. C. Check your circuit construction. D. Turn PC1 power OFF and ON to ensure oscillator begins to oscillate. E. Last, see your instructor."], "jumps": []}, {"id": "P1200", "text": ["You constructed the modulator circuit correctly.", "You constructed the modulator circuit correctly............"], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["The center frequency of the FM signal should be around 43 kHz. The frequency indicated on the oscilloscope could be different due to component tolerances."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["In the next step, you will disconnect the Q1 circuit and observe the results.  Remember, the Q1 circuit is capacitive and in parallel to the oscillator's tank circuit.", "In the next step, you will disconnect the Q1 circuit and observe the results. Remember, the Q1 circuit is capacitive and in parallel to the oscillator's tank circuit."], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["7.  While viewing the output of the modulator circuit with the                oscilloscope, disconnect C6.", "7. While viewing the output of the modulator circuit with the oscilloscope, disconnect C6.."], "jumps": ["P1240", "P1200"]}, {"id": "P1240", "text": ["What happened to the frequency of the output signal?", "What happened to the frequency of the output signal?......."], "jumps": ["P1200"]}, {"id": "P1241", "text": [], "jumps": []}, {"id": "P1242", "text": ["Removing the Q1 circuit removes the parallel capacitance to the oscillator's tank circuit. The output frequency will not remain the same."], "jumps": []}, {"id": "P1243", "text": ["Removing the Q1 circuit removes the parallel capacitance to the oscillator's tank circuit.  Since the capacitance in the tank circuit decreased, the output frequency will not decrease.", "Removing the Q1 circuit removes the parallel capacitance to the oscillator's tank circuit. Since the capacitance in the tank circuit decreased, the output frequency will not decrease."], "jumps": []}, {"id": "P1250", "text": ["You have seen how the capacitance of the reactance circuit (Q1, R2, C3) effects the resonant frequency of the oscillator circuit."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["Let's apply an information input signal to change the conduction of Q1 (changing the internal resistance) and observe the results."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["8.  Place C6 back into the modulator circuit.", "8. Place C6 back into the modulator circuit."], "jumps": ["P1280", "P1250"]}, {"id": "P1280", "text": ["9.  Set up the function generator main output for a 1 kHz sine              wave signal at 6 Vpp.  Ensure that all modulation controls are        disengaged.  This is the information signal.", "9. Set up the function generator main output for a 1 kHz sine wave signal at 6 Vpp. Ensure that all modulation controls are disengaged. This is the information signal."], "jumps": ["P1290", "P1250", "P1285"]}, {"id": "P1285", "text": ["FUNCTION GENERATOR - Set the main output for 1 kHz sine wave at 6 Vpp. Disengage all modulation controls."], "jumps": []}, {"id": "P1290", "text": ["10.  Connect the main output of the function generator to the                 PC1 INPUT BNC on the test console.", "10. Connect the main output of the function generator to the PC1 INPUT BNC on the test console."], "jumps": ["P1300", "P1280", "P1295"]}, {"id": "P1295", "text": ["BNC CONNECTION - Connect the Function Generator's Main Output BNC to the Test Console's Input BNC."], "jumps": []}, {"id": "P1300", "text": ["11.  Using the oscilloscope, observe the signal on the output of            the modulator.", "11. Using the oscilloscope, observe the signal on the output of the modulator."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["Notice that the frequency of the observed signal is changing. The information signal is changing the conduction of Q1 which changes the oscillators resonant frequency.  The output signal is a FM signal.", "Notice that the frequency of the observed signal is changing. The information signal is changing the conduction of Q1 which changes the oscillators resonant frequency. The output signal is a FM signal."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["12.  Vary the output amplitude of the function generator and                  observe the output of the modulator circuit.  The frequency            deviation changes.", "12. Vary the output amplitude of the function generator and observe the output of the modulator circuit. The frequency deviation changes."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["Remember, the amplitude variations of the information signal are contained in the frequency deviations of the FM signal. Increasing and decreasing the amplitude of the information signal increases and decreases the amount of frequency change in the FM signal. You may see some amplitude variations but, they can be ignored."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["13.  Vary the output frequency of the function generator and                 observe the output of the modulator.  The amount of                         deviation remained the same but the rate of deviation                       changes.", "13. Vary the output frequency of the function generator and observe the output of the modulator. The amount of deviation remained the same but the rate of deviation changes."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["The constructed modulator circuit operates as learned.", "The constructed modulator circuit operates as learned......"], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["1.  Turn OFF the function generator and disconnect it from the             test console. \n2.   Disconnect the oscilloscope from the modulator circuit.", "1. Turn OFF the function generator and disconnect it from the test console. 2. Disconnect the oscilloscope from the modulator circuit."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["3.  Return the Test Console to the initial control settings.", "3. Return the Test Console to the initial control settings................"], "jumps": ["P1360"]}, {"id": "P1380", "text": ["4.  Set the Console Power Switch to OFF.", "4. Set the Console Power Switch to OFF...................."], "jumps": ["P1370"]}, {"id": "P1390", "text": ["5.  Remove the PC130-130X card and disassemble the circuit.             The circuit is not used in the demodulator experiment. \n6.  Return all equipment and parts to the designated storage               areas.", "5. Remove the PC130-130X card and disassemble the circuit. The circuit is not used in the demodulator experiment. 6. Return all equipment and parts to the designated storage areas."], "jumps": ["P1910", "P1380"]}, {"id": "P1910", "text": ["This completes the experiment on FM MODULATOR CIRCUIT.", "This completes the experiment on FM MODULATOR CIRCUIT......"], "jumps": ["P1390"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["In this lesson you will construct and check the operation of an FM slope demodulator circuit."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["The circuit is like the one studied except the tuning circuit uses a transformer, T1."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["T1 changes the FM signal to AM and is a 455 kHz AM transformer.  It is used because they are inexpensive and readily available.", "T1 changes the FM signal to AM and is a 455 kHz AM transformer. It is used because they are inexpensive and readily available."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["Normally, the circuit would demodulate FM signals that have a higher frequency than 455 kHz but we will use 455 kHz."], "jumps": ["P2060", "P2020"]}, {"id": "P2060", "text": ["D1, C2 and R3 are the AM demodulator circuit that recovers the information signal."], "jumps": ["P2070", "P2020"]}, {"id": "P2070", "text": ["The function generator is used to supply the FM signal."], "jumps": ["P2080", "P2020"]}, {"id": "P2080", "text": ["Ensure that the function generator you are using can produce FM waveforms.", "The circuit is constructed on the PC130-130X Experimenter card."], "jumps": ["P2090", "P2020", "P2100"]}, {"id": "P2100", "text": ["If you are unfamiliar with the card or circuit breadboarding, see your instructor."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": [], "jumps": ["P2120", "P2090"]}, {"id": "P2120", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2090"]}, {"id": "P2130", "text": ["2.  Construct the circuit shown on the PC130-130X card.  Follow         the hints given in the next frame.", "2. Construct the circuit shown on the PC130-130X card. Follow the hints given in the next frame."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["A. Place T1 between the upper and lower sections of the breadboard card. The upper section allows connecting the inputs to T1. The lower section allows connecting the outputs to T1. B. Ensure that R1 connects to the vertical column for Pin E as indicated on the card. The FM input signal is applied to Pin E."], "jumps": ["P2141", "P2130"]}, {"id": "P2141", "text": ["C.  Place a connecting wire between the output of T1 and the               input of D1.  The wire is used to disconnect the AM                            demodulator circuit.", "C. Place a connecting wire between the output of T1 and the input of D1. The wire is used to disconnect the AM demodulator circuit."], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["3.  Insert PC130-130X into the PC1 connectors on the test                    console.", "3. Insert PC130-130X into the PC1 connectors on the test console."], "jumps": ["P2160", "P2130"]}, {"id": "P2160", "text": ["In the next steps, you will tune the demodulator circuit to place fc at the mid point of the response curve of T1.  You will also verify that the tuning circuit was constructed correctly.", "In the next steps, you will tune the demodulator circuit to place fc at the mid point of the response curve of T1. You will also verify that the tuning circuit was constructed correctly."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["4.  Disconnect the output of T1 from the AM demodulator circuit,         input to D1.", "4. Disconnect the output of T1 from the AM demodulator circuit, input to D1."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["5.  Set up the function generator main output for a 455 kHz sine          wave signal at 6 Vpp.  Ensure that all modulation controls are        disengaged.", "5. Set up the function generator main output for a 455 kHz sine wave signal at 6 Vpp. Ensure that all modulation controls are disengaged."], "jumps": ["P2190", "P2160", "P2185"]}, {"id": "P2185", "text": ["FUNCTION GENERATOR - Set the main output for 455 kHz sine wave at 6 Vpp. Disengage all modulation controls."], "jumps": []}, {"id": "P2190", "text": ["6.  Connect the main output of the function generator to the PC1         INPUT BNC on the test console.", "C.  Use a wire connected to the junction of C7, L2 and C8 for the         output line of the circuit. \nD.  The rows of the breadboarding card are connected vertically.", "6. Connect the main output of the function generator to the PC1 INPUT BNC on the test console.", "C. Use a wire connected to the junction of C7, L2 and C8 for the output line of the circuit. D. The rows of the breadboarding card are connected vertically.", "FET Pin Out Transistor Pin Out"], "jumps": ["P2200", "P2180", "P2195", "P1120", "P1135", "P1140"]}, {"id": "P2200", "text": ["7.  Connect the oscilloscope to the output of T1.", "7. Connect the oscilloscope to the output of T1..........."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["Are you viewing a 455 kHz signal?", "Are you viewing a 455 kHz signal?.........................."], "jumps": ["P2200"]}, {"id": "P2211", "text": [], "jumps": []}, {"id": "P2212", "text": ["Something is wrong, check the following:", "Something is wrong, check the following:...................", "A. That you are using the oscilloscope correctly and that it is connected to the output of T1. B. That the function generator is set up correctly. C. That you constructed the demodulator circuit correctly. D. Last, see your instructor. uctor. ructor.ins to oscillate. E. Last, see your instructor."], "jumps": []}, {"id": "P2220", "text": ["The tuned circuit of the demodulator is constructed correctly. Now, let's adjust the circuit."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["The demodulator circuit is used to demodulate a 390 kHz FM signal."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["By applying a constant 455 kHz signal, T1 can be tuned for a maximum amplitude output.  This places the center frequency of the FM signal, 390 kHz, at the mid point of the response curve.", "By applying a constant 455 kHz signal, T1 can be tuned for a maximum amplitude output. This places the center frequency of the FM signal, 390 kHz, at the mid point of the response curve."], "jumps": ["P2250", "P2220"]}, {"id": "P2250", "text": ["8.  Adjust the tuning control of T1 for the maximum output                    amplitude of the 455 kHz signal.", "8. Adjust the tuning control of T1 for the maximum output amplitude of the 455 kHz signal."], "jumps": ["P2260", "P2220"]}, {"id": "P2260", "text": ["You will see that once the peak amplitude is obtained, rotating the tuning control of T1 both CW and CCW causes a decrease in amplitude."], "jumps": ["P2270", "P2220"]}, {"id": "P2270", "text": ["9.  Set the output frequency of the function generator to 390 kHz.      The output of T1 is less than peak but not 0. Take note of the         amplitude.", "9. Set the output frequency of the function generator to 390 kHz. The output of T1 is less than peak but not 0. Take note of the amplitude."], "jumps": ["P2280", "P2220"]}, {"id": "P2280", "text": ["10.  Increase the frequency of the function generator slightly                 above 390 kHz.  The output of T1 increases from the mid                 level.", "10. Increase the frequency of the function generator slightly above 390 kHz. The output of T1 increases from the mid level."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["11.  Decrease the frequency of the function generator slightly                below 390 kHz.  The output of T1 decreases from the mid                level.", "11. Decrease the frequency of the function generator slightly below 390 kHz. The output of T1 decreases from the mid level."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["The tuned circuit of the demodulator operates as you have learned, changing a FM signal into an AM signal."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["Now, let's add the AM detector back into the circuit and see if the circuit will demodulate a FM signal."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["12.  Reconnect the output of T1 to the AM demodulator circuit,               D1.\n13.  Adjust the output of the function generator to 390 kHz.", "12. Reconnect the output of T1 to the AM demodulator circuit, D1. 13. Adjust the output of the function generator to 390 kHz."], "jumps": ["P2330", "P2300"]}, {"id": "P2330", "text": ["14.  Frequency modulate the function generator's output with a             0.7 kHz signal.  On the Nida Model 440, set modulation                     controls as follows:", "14. Frequency modulate the function generator's output with a 0.7 kHz signal. On the Nida Model 440, set modulation controls as follows:", "A. Range, 10 k B. MOD, mid position C. Frequency, mid position D. Modulation, FM sine wave"], "jumps": ["P2340", "P2300", "P2335"]}, {"id": "P2195", "text": ["BNC CONNECTION - Connect the Function Generator's Main Output BNC to the Test Console's Input BNC."], "jumps": []}, {"id": "P2185", "text": ["FUNCTION GENERATOR - Set the main output for 455 kHz sine wave at 6 Vpp. Disengage all modulation controls."], "jumps": []}, {"id": "P2340", "text": ["15.  Connect the oscilloscope to the output of the demodulator.", "15. Connect the oscilloscope to the output of the demodulator."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["Are you viewing a low frequency signal of around 1.0 kHz?", "Are you viewing a low frequency signal of around 1.0 kHz??."], "jumps": ["P2340"]}, {"id": "P2351", "text": [], "jumps": []}, {"id": "P2352", "text": ["Something is wrong, check the following:", "Something is wrong, check the following:...................", "A. That the function generator is producing a 390 kHz frequency modulated signal at 1.0 kHz. B. That the oscilloscope is connected to the output of the demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.to ensure oscillator begins to oscillate. E. Last, see your instructor."], "jumps": []}, {"id": "P2360", "text": ["The AM demodulator was constructed correctly and is recovering the information signal for the function generator."], "jumps": ["P2370", "P2350"]}, {"id": "P2370", "text": ["16.  Vary the MOD and frequency controls in the modulation                   section of  the function generator.", "16. Vary the MOD and frequency controls in the modulation section of the function generator."], "jumps": ["P2380", "P2360"]}, {"id": "P2380", "text": ["You should see that the MOD control increased and decreased the amplitude of the information signal and that the frequency control increased and decreased the frequency of the information signal."], "jumps": ["P2390", "P2370"]}, {"id": "P2390", "text": ["The MOD control controlled the amount of frequency deviation which produces amplitude variations in the recovered signal. The frequency control controlled the deviation rate which produces frequency variations in the recovered signal."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["The constructed demodulator circuit operates as learned.", "The constructed demodulator circuit operates as learned...."], "jumps": ["P2410", "P2390"]}, {"id": "P2410", "text": ["1.  Turn OFF the function generator and disconnect it from the             test console. \n2.   Disconnect the oscilloscope from the demodulator circuit.", "1. Turn OFF the function generator and disconnect it from the test console. 2. Disconnect the oscilloscope from the demodulator circuit."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["3.   Return the Test Console to the initial control settings.", "3. Return the Test Console to the initial control settings..............."], "jumps": ["P2410"]}, {"id": "P2430", "text": ["4.  Set the Console Power Switch to OFF.", "4. Set the Console Power Switch to OFF...................."], "jumps": ["P2420"]}, {"id": "P2440", "text": ["5.  Remove the PC130-130X card and disassemble the circuit. \n6.  Return all equipment and parts to the designated storage               areas.", "5. Remove the PC130-130X card and disassemble the circuit. 6. Return all equipment and parts to the designated storage areas."], "jumps": ["P2910", "P2430"]}, {"id": "P2910", "text": ["This completes the experiment on FM DEMODULATOR CIRCUIT.", "In this experiment, you will construct and check out a FM reactance modulator circuit.", "This completes the experiment on FM DEMODULATOR CIRCUIT....", "FET Pin Out Transistor Pin Out"], "jumps": ["P2440", "P13030", "P1001"]}, {"id": "P13030", "text": ["This modulator has an additional oscillator circuit that provides a carrier signal to modulate."], "jumps": ["P13040", "P13020"]}, {"id": "P13040", "text": ["Q2 is a Hartley oscillator.  The tank circuit consists of L2, L3 and C7.", "Q2 is a Hartley oscillator. The tank circuit consists of L2, L3 and C7."], "jumps": ["P13050", "P13020"]}, {"id": "P13050", "text": ["Q1 is the reactance circuit.  It changes capacitance in proportion to the amplitude of the information input signal.", "Q1 is the reactance circuit. It changes capacitance in proportion to the amplitude of the information input signal."], "jumps": ["P13060", "P13020"]}, {"id": "P13060", "text": ["The information input signal is supplied by the function generator.", "The circuit is constructed on the PC130-130X Model 130 Experimenter card."], "jumps": ["P13070", "P13020", "P13080"]}, {"id": "P13080", "text": ["The 130X card is a standard breadboarding card that provides connection to the test console power supplies and connectors."], "jumps": ["P13090", "P13070"]}, {"id": "P13090", "text": ["If you are unfamiliar with the card or breadboarding procedures, see your instructor."], "jumps": ["P13100", "P13070"]}, {"id": "P13100", "text": [], "jumps": ["P13110", "P13070"]}, {"id": "P13110", "text": ["1.  Set the Test Console controls to the initial control settings.", "C.  Use a wire connected to the junction of C7, L2 and C8 for the         output line of the circuit. \nD.  The rows of the breadboarding card are connected vertically.", "1. Set the Test Console controls to the initial control settings..........", "C. Use a wire connected to the junction of C7, L2 and C8 for the output line of the circuit. D. The rows of the breadboarding card are connected vertically.", "FET Pin Out Transistor Pin Out"], "jumps": ["P13070", "P13140", "P13120", "P13135"]}, {"id": "P13130", "text": ["A.  The upper and lower parts of the card can be used to                        construct the circuit. \nB.  C2 must be connected to the vertical column of Pin E as                  indicated on the card.  This is the information input signal to          the circuit.", "A. The upper and lower parts of the card can be used to construct the circuit. B. C2 must be connected to the vertical column of Pin E as indicated on the card. This is the information input signal to the circuit."], "jumps": ["P13131", "P13120"]}, {"id": "P13131", "text": ["C.  Use a wire connected to the junction of C7, L2 and C8 for the         output line of the circuit. \nD.  The rows of the breadboarding card are connected vertically.", "2.  Construct the circuit shown on the PC130-130X card.  The              next  few pages will provide some hints.", "C. Use a wire connected to the junction of C7, L2 and C8 for the output line of the circuit. D. The rows of the breadboarding card are connected vertically.", "2. Construct the circuit shown on the PC130-130X card. The next few pages will provide some hints..", "FET Pin Out Transistor Pin Out", "FM MODULATOR CIRCUIT - The example below illustrates one of many ways to construct the FM modulator circuit."], "jumps": ["P13140", "P13120", "P13135", "P1130", "P1110"]}, {"id": "P13140", "text": ["3.  Press Enter to Set: Positive Supply Voltage - 12", "3. Press Enter to Set: Positive Supply Voltage - 12......................."], "jumps": ["P13132"]}, {"id": "P13150", "text": ["4.  Insert PC130-130X in the PC1 position on the test console.", "4. Insert PC130-130X in the PC1 position on the test console."], "jumps": ["P13160"]}, {"id": "P13160", "text": ["5.  Press Enter to Set: PC1 DC Power Switch - ON", "5. Press Enter to Set: PC1 DC Power Switch - ON..........................."], "jumps": ["P13150"]}, {"id": "P13170", "text": ["If you constructed the circuit correctly, the modulator will be generating an output at the center frequency (no information signal) is being applied).  Let's check.", "If you constructed the circuit correctly, the modulator will be generating an output at the center frequency (no information signal) is being applied). Let's check."], "jumps": ["P13180"]}, {"id": "P13180", "text": ["6.  Using the oscilloscope, measure the output of the circuit at             the junction of C7, C8 and L2.  Notice the waveform shape              and frequency.", "6. Using the oscilloscope, measure the output of the circuit at the junction of C7, C8 and L2. Notice the waveform shape and frequency."], "jumps": ["P13190", "P13170"]}, {"id": "P13190", "text": ["Are you viewing a sine wave signal?", "Are you viewing a sine wave signal?........................"], "jumps": ["P13180"]}, {"id": "P13191", "text": [], "jumps": []}, {"id": "P13192", "text": ["Something is wrong, check the following:", "Something is wrong, check the following:...................", "A. Ensure you are using the oscilloscope correctly. B. Check that you are measuring the output of the circuit. C. Check your circuit construction. D. Turn PC1 power OFF and ON to ensure oscillator begins to oscillate. E. Last, see your instructor."], "jumps": []}, {"id": "P13200", "text": ["You constructed the modulator circuit correctly.", "You constructed the modulator circuit correctly............"], "jumps": ["P13210", "P13190"]}, {"id": "P13210", "text": ["The center frequency of the FM signal should be around 43 kHz. The frequency indicated on the oscilloscope could be different due to component tolerances."], "jumps": ["P13220", "P13200"]}, {"id": "P13220", "text": ["In the next step, you will disconnect the Q1 circuit and observe the results.  Remember, the Q1 circuit is capacitive and in parallel to the oscillator's tank circuit.", "In the next step, you will disconnect the Q1 circuit and observe the results. Remember, the Q1 circuit is capacitive and in parallel to the oscillator's tank circuit."], "jumps": ["P13230", "P13200"]}, {"id": "P13230", "text": ["7.  While viewing the output of the modulator circuit with the                oscilloscope, disconnect C6.", "7. While viewing the output of the modulator circuit with the oscilloscope, disconnect C6."], "jumps": ["P13240", "P13200"]}, {"id": "P13240", "text": ["What happened to the frequency of the output signal?", "What happened to the frequency of the output signal?......."], "jumps": ["P13200"]}, {"id": "P13241", "text": [], "jumps": []}, {"id": "P13242", "text": ["Removing the Q1 circuit removes the parallel capacitance to the oscillator's tank circuit. The output frequency will not remain the same."], "jumps": []}, {"id": "P13243", "text": ["Removing the Q1 circuit removes the parallel capacitance to the oscillator's tank circuit.  Since the capacitance in the tank circuit decreased, the output frequency will not decrease.", "Removing the Q1 circuit removes the parallel capacitance to the oscillator's tank circuit. Since the capacitance in the tank circuit decreased, the output frequency will not decrease."], "jumps": []}, {"id": "P13250", "text": ["You have seen how the capacitance of the reactance circuit (Q1, R2, C3) effects the resonant frequency of the oscillator circuit."], "jumps": ["P13260", "P13240"]}, {"id": "P13260", "text": ["Let's apply an information input signal to change the conduction of Q1 (changing the internal resistance) and observe the results."], "jumps": ["P13270", "P13250"]}, {"id": "P13270", "text": ["8.  Place C6 back into the modulator circuit.", "8. Place C6 back into the modulator circuit."], "jumps": ["P13280", "P13250"]}, {"id": "P13280", "text": ["9.  Set up the function generator main output for a 1 kHz sine \n      wave signal at 6 Vpp.  Ensure that all modulation controls are        disengaged.  This is the information signal.", "9. Set up the function generator main output for a 1 kHz sine wave signal at 6 Vpp. Ensure that all modulation controls are disengaged. This is the information signal."], "jumps": ["P13290", "P13250", "P13285"]}, {"id": "P13285", "text": ["FUNCTION GENERATOR - Set the main output for 1 kHz sine wave at 6 Vpp. Disengage all modulation controls."], "jumps": []}, {"id": "P13290", "text": ["10.  Connect the main output of the function generator to the                 PC1INPUT BNC on the test console.", "10. Connect the main output of the function generator to the PC1INPUT BNC on the test console."], "jumps": ["P13300", "P13280", "P13295"]}, {"id": "P13295", "text": ["BNC CONNECTION - Connect the Function Generator's Main Output BNC to the Test Console's Input Signal BNC."], "jumps": []}, {"id": "P13300", "text": ["11.  Using the oscilloscope, observe the signal on the output of            the modulator.", "11. Using the oscilloscope, observe the signal on the output of the modulator."], "jumps": ["P13310", "P13290"]}, {"id": "P13310", "text": ["Notice that the frequency of the observed signal is changing. The information signal is changing the conduction of Q1 which changes the oscillators resonant frequency.  The output signal is a FM signal.", "Notice that the frequency of the observed signal is changing. The information signal is changing the conduction of Q1 which changes the oscillators resonant frequency. The output signal is a FM signal."], "jumps": ["P13320", "P13300"]}, {"id": "P13320", "text": ["12.  Vary the output amplitude of the function generator and                   observe the output of the modulator circuit.  The frequency            deviation changes.", "12. Vary the output amplitude of the function generator and observe the output of the modulator circuit. The frequency deviation changes."], "jumps": ["P13330", "P13310"]}, {"id": "P13330", "text": ["Remember, the amplitude variations of the information signal are contained in the frequency deviations of the FM signal. Increasing and decreasing the amplitude of the information signal increases and decreases the amount of frequency change in the FM signal. You may see some amplitude variations but, they can be ignored."], "jumps": ["P13340", "P13320"]}, {"id": "P13340", "text": ["13.  Vary the output frequency of the function generator and                  observe the output of the modulator. The amount of                          deviation remained the same but the rate of deviation                       changes.", "13. Vary the output frequency of the function generator and observe the output of the modulator. The amount of deviation remained the same but the rate of deviation changes."], "jumps": ["P13350", "P13330"]}, {"id": "P13350", "text": ["The constructed modulator circuit operates as learned.", "The constructed modulator circuit operates as learned......"], "jumps": ["P13360", "P13340"]}, {"id": "P13360", "text": ["1.  Turn OFF the function generator and disconnect it from the             test console. \n2.   Disconnect the oscilloscope from the modulator circuit.", "1. Turn OFF the function generator and disconnect it from the test console. 2. Disconnect the oscilloscope from the modulator circuit."], "jumps": ["P13350"]}, {"id": "P13380", "text": ["3.  Set the Console Power Switch to OFF.", "3. Set the Console Power Switch to OFF.FF................................."], "jumps": []}, {"id": "P13390", "text": ["4.  Remove the PC130-130X card and disassemble the circuit.             The circuit is not used in the demodulator experiment.                 5.  Return all equipment and parts to the designated storage               areas.", "4. Remove the PC130-130X card and disassemble the circuit. The circuit is not used in the demodulator experiment. 5. Return all equipment and parts to the designated storage areas."], "jumps": ["P13910", "P13380"]}, {"id": "P13910", "text": ["This completes the experiment on FM MODULATOR CIRCUIT.", "This completes the experiment on FM MODULATOR CIRCUIT......"], "jumps": ["P13390"]}, {"id": "P14020", "text": ["In this lesson you will construct and check the operation of an FM slope demodulator circuit."], "jumps": ["P14030", "P2001"]}, {"id": "P14030", "text": ["The circuit is like the one studied except the tuning circuit uses a transformer, T1."], "jumps": ["P14040", "P14020"]}, {"id": "P14040", "text": ["T1 changes the FM signal to AM and is a 455 kHz AM transformer.  It is used because they are inexpensive and readily available.", "T1 changes the FM signal to AM and is a 455 kHz AM transformer. It is used because they are inexpensive and readily available."], "jumps": ["P14050", "P14020"]}, {"id": "P14050", "text": ["Normally, the circuit would demodulate FM signals that have a higher frequency than 455 kHz but we will use 455 kHz."], "jumps": ["P14060", "P14020"]}, {"id": "P14060", "text": ["D1, C2 and R3 are the AM demodulator circuit that recovers the information signal."], "jumps": ["P14070", "P14020"]}, {"id": "P14070", "text": ["The function generator is used to supply the FM signal."], "jumps": ["P14080", "P14020"]}, {"id": "P14080", "text": ["Ensure that the function generator you are using can produce FM waveforms.", "The circuit is constructed on the PC130-130X Experimenter card."], "jumps": ["P14090", "P14020", "P14100"]}, {"id": "P14100", "text": ["If you are unfamiliar with the card or circuit breadboarding, see your instructor."], "jumps": ["P14110", "P14090"]}, {"id": "P14110", "text": [], "jumps": ["P14120", "P14090"]}, {"id": "P14120", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P14090"]}, {"id": "P14130", "text": ["2.  Construct the circuit shown on the PC130-130X card.  Follow         the hints given in the next frame.", "2. Construct the circuit shown on the PC130-130X card. Follow the hints given in the next frame."], "jumps": ["P14140"]}, {"id": "P14140", "text": ["A. Place T1 between the upper and lower sections of the breadboard card. The upper section allows connecting the inputs to T1. The lower section allows connecting the outputs to T1. B. Ensure that R1 connects to the vertical column for Pin E as indicated on the card. The FM input signal is applied to Pin E."], "jumps": ["P14141", "P14130"]}, {"id": "P14141", "text": ["C.  Place a connecting wire between the output of T1 and the               input of D1. The wire is used to disconnect the AM                             demodulator circuit.", "C. Place a connecting wire between the output of T1 and the input of D1. The wire is used to disconnect the AM demodulator circuit."], "jumps": ["P14150", "P14130"]}, {"id": "P14150", "text": ["3.  Insert PC130-130X into the PC1 connectors on the test                    console.", "3. Insert PC130-130X into the PC1 connectors on the test console."], "jumps": ["P14160", "P14130"]}, {"id": "P14160", "text": ["In the next steps, you will tune the demodulator circuit to place fc at the mid point of the response curve of T1. You will also verify that the tuning circuit was constructed correctly."], "jumps": ["P14170", "P14150"]}, {"id": "P14170", "text": ["4.  Disconnect the output of T1 from the AM demodulator circuit,        input to D1.", "4. Disconnect the output of T1 from the AM demodulator circuit, input to D1."], "jumps": ["P14180", "P14160"]}, {"id": "P14180", "text": ["5.  Set up the function generator main output for a 455 kHz sine         wave signal at 6 Vpp.  Ensure that all modulation controls are        disengaged.", "5. Set up the function generator main output for a 455 kHz sine wave signal at 6 Vpp. Ensure that all modulation controls are disengaged."], "jumps": ["P14190", "P14160", "P14185"]}, {"id": "P14185", "text": ["FUNCTION GENERATOR - Set the main output for 455 kHz sine wave at 6 Vpp. Disengage all modulation controls."], "jumps": []}, {"id": "P14190", "text": ["6.  Connect the main output of the function generator to the PC1         INPUT BNC on the test console.", "6. Connect the main output of the function generator to the PC1 INPUT BNC on the test console."], "jumps": ["P14200", "P14180", "P14195"]}, {"id": "P2335", "text": ["FUNCTION GENERATOR Frequency - 390 kHz Modulation - FM, sine wave, inserted MOD % - mid position odulation - FM, sinewave"], "jumps": []}, {"id": "P14200", "text": ["7.  Connect the oscilloscope to the output of T1.", "7. Connect the oscilloscope to the output of T1..........."], "jumps": ["P14210", "P14190"]}, {"id": "P14210", "text": ["Are you viewing a 455 kHz signal?", "Are you viewing a 455 kHz signal?.........................."], "jumps": ["P14200"]}, {"id": "P14211", "text": [], "jumps": []}, {"id": "P14212", "text": ["Something is wrong, check the following:", "Something is wrong, check the following:...................", "A. That you are using the oscilloscope correctly and that it is connected to the output of T1. B. That the function generator is set up correctly. C. That you constructed the demodulator circuit correctly. D. Last, see your instructor. ructor.ins to oscillate. E. Last, see your instructor."], "jumps": []}, {"id": "P14220", "text": ["The tuned circuit of the demodulator is constructed correctly. Now, let's adjust the circuit."], "jumps": ["P14230", "P14210"]}, {"id": "P14230", "text": ["The demodulator circuit is used to demodulate a 390 kHz FM signal."], "jumps": ["P14240", "P14220"]}, {"id": "P14240", "text": ["By applying a constant 455 kHz signal, T1 can be tuned for a maximum amplitude output. This places the center frequency of the FM signal, 390 kHz, at the mid point of the response curve."], "jumps": ["P14250", "P14220"]}, {"id": "P14250", "text": ["8.  Adjust the tuning control of T1 for the maximum output                    amplitude of the 455 kHz signal.", "8. Adjust the tuning control of T1 for the maximum output amplitude of the 455 kHz signal."], "jumps": ["P14260", "P14220"]}, {"id": "P14260", "text": ["You will see that once the peak amplitude is obtained, rotating the tuning control of T1 both CW and CCW causes a decrease in amplitude."], "jumps": ["P14270", "P14220"]}, {"id": "P14270", "text": ["9.  Set the output frequency of the function generator to 390 kHz.      The output of T1 is less than peak but not 0.  Take note of the        amplitude.", "9. Set the output frequency of the function generator to 390 kHz. The output of T1 is less than peak but not 0. Take note of the amplitude."], "jumps": ["P14280", "P14220"]}, {"id": "P14280", "text": ["10.  Increase the frequency of the function generator slightly                 above 390 kHz.  The output of T1 increases from the mid                 level.", "10. Increase the frequency of the function generator slightly above 390 kHz. The output of T1 increases from the mid level."], "jumps": ["P14290", "P14270"]}, {"id": "P14290", "text": ["11.  Decrease the frequency of the function generator slightly                below 390 kHz.  The output of T1 decreases from the mid                level.", "11. Decrease the frequency of the function generator slightly below 390 kHz. The output of T1 decreases from the mid level."], "jumps": ["P14300", "P14280"]}, {"id": "P14300", "text": ["The tuned circuit of the demodulator operates as you have learned, changing a FM signal into an AM signal."], "jumps": ["P14310", "P14290"]}, {"id": "P14310", "text": ["Now, let's add the AM detector back into the circuit and see if the circuit will demodulate a FM signal."], "jumps": ["P14320", "P14300"]}, {"id": "P14320", "text": ["12.   Reconnect the output of T1 to the AM demodulator circuit,              D1.  \n13.  Adjust the output of the function generator to 390 kHz.", "12. Reconnect the output of T1 to the AM demodulator circuit, D1. 13. Adjust the output of the function generator to 390 kHz."], "jumps": ["P14330", "P14300"]}, {"id": "P14330", "text": ["14.  Frequency modulate the function generator's output.", "14. Frequency modulate the function generator's output. with a 1.0 kHz signal. n the Nida Model 440, set modulation controls as follows:"], "jumps": ["P14340", "P14300", "P14335"]}, {"id": "P14335", "text": ["FUNCTION GENERATOR \nFrequency - 390 kHz   \nModulation - FM, sine wave, inserted\nMOD %  - mid position", "FUNCTION GENERATOR Frequency - 390 kHz Modulation - FM, sine wave, inserted MOD % - mid position"], "jumps": []}, {"id": "P14340", "text": ["15.  Connect the oscilloscope to the output of the demodulator.", "15. Connect the oscilloscope to the output of the demodulator."], "jumps": ["P14350", "P14330"]}, {"id": "P14350", "text": ["Are you viewing a low frequency signal of around 1.0 kHz?", "Are you viewing a low frequency signal of around 1.0 kHz?.."], "jumps": ["P14340"]}, {"id": "P14351", "text": [], "jumps": []}, {"id": "P14352", "text": ["Something is wrong, check the following:", "Something is wrong, check the following:...................", "A. That the function generator is producing a 390 kHz frequency modulated signal at 1.0 kHz. B. That the oscilloscope is connected to the output of the demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.to ensure oscillator begins to oscillate. E. Last, see your instructor."], "jumps": []}, {"id": "P14360", "text": ["The AM demodulator was constructed correctly and is recovering the information signal for the function generator."], "jumps": ["P14370", "P14350"]}, {"id": "P14370", "text": ["16.  Vary the MOD and frequency controls in the modulation                   section of the function generator.", "16. Vary the MOD and frequency controls in the modulation section of the function generator."], "jumps": ["P14380", "P14360"]}, {"id": "P14380", "text": ["You should see that the MOD control increased and decreased the amplitude of the information signal and that the frequency control increased and decreased the frequency of the information signal."], "jumps": ["P14390", "P14370"]}, {"id": "P14390", "text": ["The MOD control controlled the amount of frequency deviation which produces amplitude variations in the recovered signal. The frequency control controlled the deviation rate which produces frequency variations in the recovered signal."], "jumps": ["P14400", "P14380"]}, {"id": "P14400", "text": ["The constructed demodulator circuit operates as learned.", "The constructed demodulator circuit operates as learned...."], "jumps": ["P14410", "P14390"]}, {"id": "P14410", "text": ["1.  Turn OFF the function generator and disconnect it from the             test console. \n2.   Disconnect the oscilloscope from the demodulator circuit.", "1. Turn OFF the function generator and disconnect it from the test console. 2. Disconnect the oscilloscope from the demodulator circuit."], "jumps": ["P14400"]}, {"id": "P14430", "text": ["3.  Set the Console Power Switch to OFF.", "3. Set the Console Power Switch to OFF.FF................................."], "jumps": []}, {"id": "P14440", "text": ["4.  Remove the PC130-130X card and disassemble the circuit. \n5.  Return all equipment and parts to the designated storage               areas.", "4. Remove the PC130-130X card and disassemble the circuit. 5. Return all equipment and parts to the designated storage areas."], "jumps": ["P14910", "P14430"]}, {"id": "P14910", "text": ["This completes the experiment on FM DEMODULATOR CIRCUIT.", "This completes the experiment on FM DEMODULATOR CIRCUIT...."], "jumps": ["P14440"]}, {"id": "PINFO", "text": ["In this experiment, you will construct and check out a FM reactance modulator circuit.", "07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 10-28-99 Converted from storyboard to toolbook. frieda 03-17-00 Text and Branching. frieda 03-22-00 inserted graphics,tested lesson-John Ayala 03-23-00 inserted graphics for 130E experiment. frieda 03-23-00 Reviewed. frieda 07-14-00 Converted to ToolBook 7.1 format. jay 07-19-01 Converted to ToolBook 8.1 format. jay 10-17-01 P1120, 1132, 13120, 13132 put FM Output label on graphic. -Penny 01-14-02 Converted to Phase II format. jay 02-06-02 Checked for convertion errors John Ayala 05-01-02 Review - lisa 02-27-04 changed modulatin signal to 1 khz, FET labeling needs to be changed for replacement part. Generalized function generator instructions. -DAC 03-01-04 Changed graphic pin outs for P13020-13060, P13120, P13130, P13131and for the 130A pages. -Sarah.", "FET Pin Out Transistor Pin Out"], "jumps": ["P1030", "P1001", "P1120", "P1135", "P1140"]}, {"id": "P14195", "text": ["2.  Construct the circuit shown on the PC130-130X card. The                next  few pages will provide some hints.", "In this experiment, you will construct and check out a FM reactance modulator circuit.", "BNC CONNECTION - Connect the Function Generator's Main Output BNC to the Test Console's Input Signal BNC.", "2. Construct the circuit shown on the PC130-130X card. The next few pages will provide some hints.", "FET Pin Out Transistor Pin Out"], "jumps": ["P13130", "P13030", "P1001"]}, {"id": "P14390", "text": ["The MOD control controlled the amount of frequency deviation which produces amplitude variations in the recovered signal. The frequency control controlled the deviation rate which produces frequency variations in the recovered signal."], "jumps": ["P14400", "P14380"]}, {"id": "P14380", "text": ["You should see that the MOD control increased and decreased the amplitude of the information signal and that the frequency control increased and decreased the frequency of the information signal."], "jumps": ["P14390", "P14370"]}, {"id": "P14370", "text": ["16.  Vary the MOD and frequency controls in the modulation                   section of the function generator.", "16. Vary the MOD and frequency controls in the modulation section of the function generator."], "jumps": ["P14380", "P14360"]}, {"id": "P14360", "text": ["C.  Use a wire connected to the junction of C7, L2 and C8 for the         output line of the circuit. \nD.  The rows of the breadboarding card are connected vertically.", "C. Use a wire connected to the junction of C7, L2 and C8 for the output line of the circuit. D. The rows of the breadboarding card are connected vertically.", "FET Pin Out Transistor Pin Out"], "jumps": ["P14370", "P14350", "P13140", "P13120", "P13135"]}, {"id": "P14335", "text": ["FUNCTION GENERATOR Range - 10 k Frequency - mid position MOD - mid position Modulation - FM, sinewave"], "jumps": []}, {"id": "P14330", "text": ["14.  Frequency modulate the function generator's output with a             0.7 kHz signal.  On the Nida Model 440, set modulation                     controls as follows:", "14. Frequency modulate the function generator let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
