 where space is a factor, the IC Regulator is ideal."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["Let's begin the lesson on IC REGULATOR OPERATION.........................."], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The purpose of this lesson is to show the operation of an IC Regulator, and how it may be put in place of a Multi-component Regulator."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["The IC Regulator has many special features which make it extremely safe and durable."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Most IC Regulators have thermal overload protection and internal short-circuit current limiting protection so that there is virtually no risk of overload."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The following is a block diagram of the power supply that we will be working with."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["The whole circuit is actually a 12 VDC power supply, but we will mainly be directing our attention to the regulator."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["The first block is simply the AC input to the rectifier."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["Next we have a bridge rectifier, it changes the applied AC to a full wave pulsating DC. The DC voltage has half the applied voltage value."], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["This pulsating DC is then sent through a filter capacitor and smoothed to an almost constant DC."], "jumps": ["P1100", "P1050"]}, {"id": "P1100", "text": ["The filtered DC is sent through the regulator and kept at a constant 12 VDC level. This voltage is then applied to the load.", "The filtered DC is sent through the regulator and kept at a constant 12 VDC level. This voltage is then applied to the load.'"], "jumps": ["P1110", "P1050"]}, {"id": "P1110", "text": ["There are many different kinds  ["P1140", "P1110", "P1135"]}, {"id": "P1135", "text": ["OUTPUT CURRENT - The 7812 voltage regulator produces a constant 12 VDC output at 1.5 Amps with an 8 ohm load connected to its output. Anything under 8 ohms would draw more than 1.5 amps. The IC regulator would become very hot and the thermal protection would engage."], "jumps": ["P1132"]}, {"id": "P1140", "text": ["When dealing with a limited area or many parts, an IC regulator can be very useful in conserving space."], "jumps": ["P1150", "P1132"]}, {"id": "P1150", "text": ["When in the field, troubleshooting an IC regulator is easy."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["If the IC regulator is thought to be bad, all that is required is that it be removed and replaced with a new one."], "jumps": ["P1170", "P1140", "P"]}, {"id": "P1170", "text": ["A faulted multi-component regulator requires much more troubleshooting to identify the bad component."], "jumps": ["P1180", "P1150"]}, {"id": "P1180", "text": ["Which of the following is a disadvantage of using an IC regulator?"], "jumps": ["P1170"]}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1182", "text": ["Your answer is incorrect. This is one of the many advantages of using an IC Regulator."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on IC REGULATOR OPERATION.", "This completes the information on IC REGULATOR OPERATION..."], "jumps": ["P1001", "P1180"]}, {"id": "P1920", "text": ["1.  Most IC regulators have thermal overload and internal short-          circuit current limiting protection.", "1. Most IC regulators have thermal overload and internal short- circuit current limiting protection."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["y regulate input voltages between 14.5 V and 30 V.", "2. The 7812 regulator can regulate a 12 VDC output only when the input voltage is between 14.5 V and 30 V.......", "'}:5 t0H( 9E}A9As5/GA}A;aEAA}EAKE;AAaAE;A}AEAU;aA};aEAEA;EAAAEA;E;AaA", "EUaa 555G7EEEa::Ts1 eriment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["In this experiment, you will trace an AC signal through a simple power supply circuit and observe the IC regulator at work."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["Ensure the two jumpers are placed vertically between the top and middle jumpers located in the upper left hand corner of the PC130-74 card. Jumpers on the PC130-74 card may not be available, if so, disregard graphic and caution below.", "Ensure the two jumpers are placed vertically between the top and middle jumpers located in the upper left hand corner of the PC130-74 card. Jumpers on the PC130-74 card may not be available, if so, disregard graphic and caution below...", "Jumpers that have not been installed correctly on the PC130-74 card may cause damage to the board circuitry. Do not connect the oscilloscope ground to pins G or H......................."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["Pick up the PC130-74 card. The purpose of this card is to demonstrate the operation of IC Regulators."], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["Compare the components on PC130-74 to the schematic shown.", "Compare the components on PC130-74 to the schematic shown.m"], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["Notice the small number of components that make up this power supply board when using an IC Regulator."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["There are two different power supplies on this one board. The top half is a positive regulated power supply."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["The bottom half is a negative regulated power supply."], "jumps": ["P2090", "P2040"]}, {"id": "P2090", "text": ["Let's start the experiment."], "jumps": ["P2100", "P2040"]}, {"id": "P2100", "text": ["1.  Set the test console controls to their initial control settings.", "1. Set the test console controls to their let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
