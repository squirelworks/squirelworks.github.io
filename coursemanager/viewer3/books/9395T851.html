const book = {"title": "9395T851", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: 8051 MICROCONTROLLER CIRCUITfasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": ["# #\" #& \"\"# &\"###2' &2#&.22&# 25--283-.#285255232/238882-.-5:38832222882282-213:22::82-22225:8-33-22282232.22258558.5822385:235:222283538::2585582::2:", "&&#&# #/2.#.& -8 \"#.-&23..22'/.#212&-2258\"588:52", "### ## /# #/&# \" \"/##\"#/&//..#/..&/28.&...&824/&.88-8588..2222858852.28:582228588358282228258.888:825:583.8828::8228828588828583:35558.555.85::88::85588:88:5555::38::85:::5:5:52::85::88::", ":85:855::83:5:5.5:55:855:52.5:5283822242348522...252...2..82/.4..22//2./..##/.8.#&./#&/..##// ##\",##/## #. / /& # ## ## ## ## ## \" #/# ## /# ## #.\" ./ #//###,//.&/#.\"#/.##/./#&/2.&/.../&//....//&2222.2/252.&28.8522582.824828828::255:::5:", "/,,,,,,,,,,,,,/, ,, ,,,,,,6, ,,,6,,, ,,,,,//6//6,,,,/6/,,,/,4/,,/6/4494,,494/6846446/4884664;44;889448489888<8648<<8;44;88988<88948;98<44<;:<44<<8;44<48<<8;48<48<88;48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Observe signals from the 8051 microcontroller circuit. w Enter a simple program to observe system operation....................", "w Describe the internal structure of the 8051 microcontroller. w Describe the timed operations of the 8051 microcontroller."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P301", "text": ["XXXX XXXX YYYK EKCK +1111111111111"], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P400", "text": ["In the previous lessons on microprocessors, you learned about basic microprocessor operation and the three basic elements found in microprocessors: the registers, the ALU, and the control section.", "In the previous lessons on microprocessors, you learned about basic microprocessor operation and the three basic elements found in microprocessors: the registers, the ALU, and the control section. ction."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["In this lesson, you will study the 8051 microcontroller in detail. You will learn about the internal structure of the 8051 including the registers, ALU, and the control sections."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["It is important to realize that both microcontrollers and microprocessors work the same internally. Microcontrollers are used in applications such as automobile control systems, medical instrumentation and appliances, where the tasks and programming remain equipment specific. Microprocessors are used in more versatile applications such as home PCs...................................."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["You will learn about the input and output signals of the 8051 integrated circuit.  These signals are used to control the external  microcontroller system elements and to transfer data between the microcontroller and the rest of the system.", "You will learn about the input and output signals of the 8051 integrated circuit. These signals are used to control the external microcontroller system elements and to transfer data between the microcontroller and the rest of the system."], "jumps": ["P435", "P400"]}, {"id": "P435", "text": ["After completing this lesson, you will be able to describe the structure and features unique to the 8051.  For more details on the advanced features of the 8051, or any microcontroller, refer to the manufacturer's data book on that product.", "After completing this lesson, you will be able to describe the structure and features unique to the 8051. For more details on the advanced features of the 8051, or any microcontroller, refer to the manufacturer's data book on that product."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on 8051 MICROCONTROLLER CIRCUIT...................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1040", "text": ["The 8051 is an 8-bit microcontroller.  The internal registers are 8 and 16 bits wide.  The external data bus of an 8051 microcontroller is also 8 bits wide.", "The 8051 is an 8-bit microcontroller. The internal registers are 8 and 16 bits wide. The external data bus of an 8051 microcontroller is also 8 bits wide."], "jumps": ["P1050", "P1001"]}, {"id": "P1050", "text": ["The 8051 has a 16-bit address bus and thus the 8051 can address up to 2     or 65 Kbytes of memory.", "The 8051 has a 16-bit address bus and thus the 8051 can address up to 2 or 65 Kbytes of memory."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["The functional diagram of the 8051 is shown below."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["You can see from the diagram that the sections of the 8051 microcontroller are connected by internal busses as you learned in earlier lessons.  All communications within the microcontroller are performed by the combined effort of the data and control bus.", "You can see from the diagram that the sections of the 8051 microcontroller are connected by internal busses as you learned in earlier lessons. All communications within the microcontroller are performed by the combined effort of the data and control bus."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["The address bus is primarily for addressing locations or devices external to the internal system.  The data bus of the 8051 is 8-bits  wide.  This is why the 8051 is known as an 8 bit microcontroller.", "The address bus is primarily for addressing locations or devices external to the internal system. The data bus of the 8051 is 8-bits wide. This is why the 8051 is known as an 8 bit microcontroller."], "jumps": ["P1090", "P1040"]}, {"id": "P1090", "text": ["Before we examine the sections of the 8051 in detail, let's look at a simple microcontroller instruction.  The instruction is:", "Before we examine the sections of the 8051 in detail, let's look at a simple microcontroller instruction. The instruction is:", "Opcode Mnemonic 29 Add A, R1111"], "jumps": ["P1100", "P1040"]}, {"id": "P1100", "text": ["This instruction adds the 8 bit value in register R1 to the 8 bit value in the accumulator (register A) and places the result in the   accumulator.  This one operation causes many things to happen within the microcontroller.", "This instruction adds the 8 bit value in register R1 to the 8 bit value in the accumulator (register A) and places the result in the accumulator. This one operation causes many things to happen within the microcontroller."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["A simplified list of the actions is given below.", "A simplified list of the actions is given below............", "1. Fetch the instruction a. Put the value of the Program Counter (PC) into the address buffer. b. Drive the Address Latch Enable signal high and low. c. The /Read signal goes low to indicate a read. d. Read the 8-bit instruction from the data bus. e. Increment the Program Counter. 2. Decode instruction a. Move the instruction to the Instruction Register. b. Decode the instruction. c. Increment the Program Counter. 3. Perform the addition a. Move the 8-bit value of the accumulator register to the ALU. b. Move the 8-bit value of the R1 register to the ALU. c. Add the two values together. d. Place the result into the accumulator register."], "jumps": ["P1120", "P1090", "PC"]}, {"id": "P1120", "text": ["From this example, you can see that registers, buffers, control sections, the ALU, and the internal data bus are all used to add     these two numbers.", "From this example, you can see that registers, buffers, control sections, the ALU, and the internal data bus are all used to add these two numbers."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["The operation of these elements must be controlled or coordinated by the control section of the microcontroller.  The microcontroller performs many operations for each instruction that is executed.", "The operation of these elements must be controlled or coordinated by the control section of the microcontroller. The microcontroller performs many operations for each instruction that is executed."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["In addition to the actions listed, the microcontroller must also check the status of the interrupt and reset signals while executing the instruction."], "jumps": ["P1150", "P1110"]}, {"id": "P1150", "text": ["Now that you have an idea of what steps the microcontroller must perform for a basic instruction, let's look at the sections of   the 8051 microcontroller in detail.", "Now that you have an idea of what steps the microcontroller must perform for a basic instruction, let's look at the sections of the 8051 microcontroller in detail."], "jumps": ["P1160", "P1110"]}, {"id": "P1160", "text": ["It is here that you will see a breakdown of each element in the 8051 block diagram and how they correspond to one another."], "jumps": ["P1170", "P1110"]}, {"id": "P1170", "text": ["REGISTERS\nThe internal registers are where data and addresses are stored    temporarily inside the microcontroller.  The data in the registers    can be accessed and changed much faster than data in external   memory.  Let's look at a brief summary of each register.", "REGISTERS The internal registers are where data and addresses are stored temporarily inside the microcontroller. The data in the registers can be accessed and changed much faster than data in external memory. Let's look at a brief summary of each register."], "jumps": ["P1180", "P1110"]}, {"id": "P1180", "text": ["The accumulator (A register) is used for arithmetic, logic, load, and store operations.  The accumulator is normally used with the B register for certain arithmetic operation.", "The accumulator (A register) is used for arithmetic, logic, load, and store operations. The accumulator is normally used with the B register for certain arithmetic operation."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["The B register is used, along with the A register, for multiplication and division.  When a number in A is multiplied with a number in B, a 16-bit result is formed and contained within A and B.  In division, B will contain the remainder of the division.", "The B register is used, along with the A register, for multiplication and division. When a number in A is multiplied with a number in B, a 16-bit result is formed and contained within A and B. In division, B will contain the remainder of the division."], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["The stack pointer (SP) is a special address register that always points to the current location in memory that is the top of the        stack.  A stack is a block of consecutive memory locations where data is stored like a stack of papers.  You must take papers off the stack to see what is below them.", "The stack pointer (SP) is a special address register that always points to the current location in memory that is the top of the stack. A stack is a block of consecutive memory locations where data is stored like a stack of papers. You must take papers off the stack to see what is below them."], "jumps": ["P1210", "P1170"]}, {"id": "P1210", "text": ["The Program Counter (PC) always points to the memory location of the next instruction to be executed.  The registers always contains a 16-bit address.", "The Program Counter (PC) always points to the memory location of the next instruction to be executed. The registers always contains a 16-bit address."], "jumps": ["P1220", "P1170", "PC"]}, {"id": "P1220", "text": ["The Program Status Word (PSW) register is an 8-bit register that uses each of the 8 bits to indicate certain conditions within         the system.", "The Program Status Word (PSW) register is an 8-bit register that uses each of the 8 bits to indicate certain conditions within the system."], "jumps": ["P1230", "P1170", "PSW"]}, {"id": "P1230", "text": ["P0, P1, P2, and P3 are used to control the ports of the 8051 microcontroller.  The microcontroller can be programmed not to have address and data lines or control signals.  With these registers the operation of the system can be changed.", "P0, P1, P2, and P3 are used to control the ports of the 8051 microcontroller. The microcontroller can be programmed not to have address and data lines or control signals. With these registers the operation of the system can be changed."], "jumps": ["P1240", "P1170"]}, {"id": "P1240", "text": ["We will look at the standard uses of these ports.  Port 0 is used for the multiplexed address and data lines AD0 - AD7.  Port 1 is used as a parallel communications port.  Port 2 is used as the high 8 bits of the address bus.  P3 is used for the control signals and a serial communications port.", "We will look at the standard uses of these ports. Port 0 is used for the multiplexed address and data lines AD0 - AD7. Port 1 is used as a parallel communications port. Port 2 is used as the high 8 bits of the address bus. P3 is used for the control signals and a serial communications port."], "jumps": ["P1250", "P1170"]}, {"id": "P1250", "text": ["R0 through R7 are general purpose registers which are used by many different instructions of the 8051 microcontroller.  Each of these registers are 8 bits wide.  In other microcontroller systems, these types of registers are referred to as data registers.", "R0 through R7 are general purpose registers which are used by many different instructions of the 8051 microcontroller. Each of these registers are 8 bits wide. In other microcontroller systems, these types of registers are referred to as data registers."], "jumps": ["P1260", "P1170"]}, {"id": "P1260", "text": ["The DPH and DPL form the DPTR or Data Pointer Register. This register is used to access external memory. In other words, this register is effectively an address register as compared to other microprocessor systems."], "jumps": ["P1270", "P1170"]}, {"id": "P1270", "text": ["When accessing external locations, it is the address in this register, DPTR, that will be used to retrieve data."], "jumps": ["P1280", "P1170"]}, {"id": "P1280", "text": ["TH1, TL1, TH0, TL0, TMOD, and TCON registers are used to control and manipulate the internal timers built into the 8051 system. These timers are controlled through register settings and certain instructions. TH0 and TL0 along with TH1 and TL1 form two 16-bit registers known as T0 and T1. These are referred to as the timer registers."], "jumps": ["P1290", "P1170"]}, {"id": "P1290", "text": ["The IP and IE registers are used for interrupt control.  IP is the Interrupt Priority Register.  This allows you to prioritize the         interrupts being sent to the microcontroller.  The IE register is the interrupt enable register.  This register allows you to enable or      disable interrupts in the system.", "The IP and IE registers are used for interrupt control. IP is the Interrupt Priority Register. This allows you to prioritize the interrupts being sent to the microcontroller. The IE register is the interrupt enable register. This register allows you to enable or disable interrupts in the system."], "jumps": ["P1300", "P1170"]}, {"id": "P1300", "text": ["The PCON or Power Control Register is used to control a variety of different functions within the system.  Some of these functions include serial port speed, general purpose flags, idle mode bit, and a power down bit.", "The PCON or Power Control Register is used to control a variety of different functions within the system. Some of these functions include serial port speed, general purpose flags, idle mode bit, and a power down bit."], "jumps": ["P1310", "P1170"]}, {"id": "P1310", "text": ["SBUF and SCON are used by the built in serial port of the 8051 system.  Data being transmitted or received can be obtained or    sent to the SBUF register, otherwise known as the serial buffer     register.  The SCON or serial control register is used to program   the operation of the serial port.", "SBUF and SCON are used by the built in serial port of the 8051 system. Data being transmitted or received can be obtained or sent to the SBUF register, otherwise known as the serial buffer register. The SCON or serial control register is used to program the operation of the serial port."], "jumps": ["P1320", "P1170"]}, {"id": "P1320", "text": ["Also, not shown are internal buffers which are used to temporarily hold data or addresses that are exchanged within the address and data busses, and the instruction register. Remember, the instruction register holds instruction that is currently being executed.", "Data is transferred between registers or between a register and another section of the microcontroller on the internal data bus.     The control blocks control the flow of the data within the microcontroller.", "Data is transferred between registers or between a register and another section of the microcontroller on the internal data bus. The control blocks control the flow of the data within the microcontroller."], "jumps": ["P1330", "P1170", "P1340"]}, {"id": "P1340", "text": ["Unlike many other microprocessor systems, the 8051 microcontroller has many special internal registers.  The 8051 also contains internal RAM on most models.", "Unlike many other microprocessor systems, the 8051 microcontroller has many special internal registers. The 8051 also contains internal RAM on most models."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["The 8051 was designed to minimize circuitry in embedded control operations.  This makes circuits used in devices like microwaves or televisions smaller, more reliable, and less expensive.", "The 8051 was designed to minimize circuitry in embedded control operations. This makes circuits used in devices like microwaves or televisions smaller, more reliable, and less expensive."], "jumps": ["P1360", "P1330"]}, {"id": "P1360", "text": ["There are many different versions of the 51 family microcontroller.  The version used on the Nida 8051 trainer is the 8031.  The 8031 microcontroller differs from the 8051 in that it contains no ROM built into the microcontroller.", "There are many different versions of the 51 family microcontroller. The version used on the Nida 8051 trainer is the 8031. The 8031 microcontroller differs from the 8051 in that it contains no ROM built into the microcontroller."], "jumps": ["P1365", "P1330"]}, {"id": "P1365", "text": ["The Nida 8051 trainer uses a separate IC for EEPROM memory. This allows us to look at certain signals that would otherwise be hidden within the 8051 IC."], "jumps": ["P1370", "P1330"]}, {"id": "P1370", "text": ["Further, many of the registers within the 8051 can be accessed at the bit level.  There are many bit instructions that allow you to      manipulate certain bits within the registers.", "Further, many of the registers within the 8051 can be accessed at the bit level. There are many bit instructions that allow you to manipulate certain bits within the registers."], "jumps": ["P1380", "P1330"]}, {"id": "P1380", "text": ["Bit level register access will not be covered in these lessons.   For more information, refer to the 8051 data book.", "Bit level register access will not be covered in these lessons. For more information, refer to the 8051 data book."], "jumps": ["P1390", "P1330"]}, {"id": "P1390", "text": ["ALU\nThe arithmetic/logic unit (ALU) of the 8051 microcontroller performs all the arithmetic and logic operations for the system. The ALU can add, subtract, increment, decrement, AND, OR, XOR, compare, rotate, and complement.", "ALU The arithmetic/logic unit (ALU) of the 8051 microcontroller performs all the arithmetic and logic operations for the system. The ALU can add, subtract, increment, decrement, AND, OR, XOR, compare, rotate, and complement."], "jumps": ["P1400", "P1330"]}, {"id": "P1400", "text": ["Depending on the conditions of the results, certain flags will be set in the program status word register.  These can indicate           problems or conditions with the last generated result from the ALU.", "Depending on the conditions of the results, certain flags will be set in the program status word register. These can indicate problems or conditions with the last generated result from the ALU."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["If the values you add result in a number larger than 8-bits can show, a carry flag is generated.  This indicates that the number     actually has an additional bit in the 9th slot.", "If the values you add result in a number larger than 8-bits can show, a carry flag is generated. This indicates that the number actually has an additional bit in the 9th slot."], "jumps": ["P1420", "P1390"]}, {"id": "P1420", "text": ["When using an 8-bit addition to add 16-bits, the second addition of the upper 8-bits has to include the addition of the carry if it        occurred.  Without this, the addition would be incorrect.", "When using an 8-bit addition to add 16-bits, the second addition of the upper 8-bits has to include the addition of the carry if it occurred. Without this, the addition would be incorrect."], "jumps": ["P1430", "P1390"]}, {"id": "P1430", "text": ["The graphic below is an example of an addition.  The instruction decoder has told the ALU, via the control section, that the operation to perform is an addition.", "The graphic below is an example of an addition. The instruction decoder has told the ALU, via the control section, that the operation to perform is an addition."], "jumps": ["P1440", "P1390"]}, {"id": "P1440", "text": ["After all the data has been moved into place the control register tells the ALU to execute the instruction.  The result of the           operation is placed in a location dictated by the instruction and     the control section.  The FLAGS of the program status word register are set or reset according to the result.", "After all the data has been moved into place the control register tells the ALU to execute the instruction. The result of the operation is placed in a location dictated by the instruction and the control section. The FLAGS of the program status word register are set or reset according to the result."], "jumps": ["P1450", "P1390"]}, {"id": "P1450", "text": ["For a complete list of the arithmetic and logic operations that the 8051 is capable of performing, you should consult an 8051             microcontroller data book.", "For a complete list of the arithmetic and logic operations that the 8051 is capable of performing, you should consult an 8051 microcontroller data book."], "jumps": ["P1460", "P1390"]}, {"id": "P1460", "text": ["TIMING AND CONTROL\nThe timing and control block includes the circuitry for the internal clock and timer signals, the RESET signal, and for generating the external memory control signals.", "TIMING AND CONTROL The timing and control block includes the circuitry for the internal clock and timer signals, the RESET signal, and for generating the external memory control signals."], "jumps": ["P1470", "P1390"]}, {"id": "P1470", "text": ["In the next lesson, you will see how important the timing and control signals are for the proper transfer of information from      external devices to the microcontroller, and vice versus.", "In the next lesson, you will see how important the timing and control signals are for the proper transfer of information from external devices to the microcontroller, and vice versus."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["If the timing is not correct, the device will begin conflicting with others and/or incorrect data will result."], "jumps": ["P1490", "P1460"]}, {"id": "P1490", "text": ["INTERRUPT CONTROL\nThis block allows the microcontroller to stop whatever operation is being performed and service an external device such as a keyboard.", "INTERRUPT CONTROL This block allows the microcontroller to stop whatever operation is being performed and service an external device such as a keyboard."], "jumps": ["P1500", "P1460"]}, {"id": "P1500", "text": ["Without interrupts, the currently executing program would have to repeatedly check or poll each external device to see if the device was ready to transfer data between itself and the microcontroller."], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["For example, when you press a key on the keyboard of an IBM personal computer, an interrupt is generated and the computer stops executing the current program and stores the keystroke in a buffer.  The computer then continues execution of the program.", "For example, when you press a key on the keyboard of an IBM personal computer, an interrupt is generated and the computer stops executing the current program and stores the keystroke in a buffer. The computer then continues execution of the program."], "jumps": ["P1520", "P1490"]}, {"id": "P1520", "text": ["The NIDA 8051 microcontroller card set does not use an interrupt for the keyboard.  Instead the keyboard circuits are repeatedly polled to see if a key has been pressed.  There are advantages and disadvantages to both methods.", "The NIDA 8051 microcontroller card set does not use an interrupt for the keyboard. Instead the keyboard circuits are repeatedly polled to see if a key has been pressed. There are advantages and disadvantages to both methods."], "jumps": ["P1530", "P1490"]}, {"id": "P1530", "text": ["When the microcontroller receives an interrupt, it stops executing the current program and executes another program to specifically deal with that interrupt."], "jumps": ["P1540", "P1490"]}, {"id": "P1540", "text": ["Once the interrupt is processed, the microcontroller returns to the program it was executing when the interrupt occurred."], "jumps": ["P1550", "P1490"]}, {"id": "P1550", "text": ["When an interrupt is called, the interrupt program must do several things so the original program register settings are correct when execution begins again.  The list below indicates the minimum number of steps that must be performed by the interrupt program:", "When an interrupt is called, the interrupt program must do several things so the original program register settings are correct when execution begins again. The list below indicates the minimum number of steps that must be performed by the interrupt program: Save the contents of any general purpose register that will be changed during the interrupt routine. 2. Service the cause of the interrupt. 3. Restore the contents of the registers. 4. Issue a RETURN instruction.", "1. Save the contents of any general purpose register that will be changed during the interrupt routine. 2. Service the cause of the interrupt. 3. Restore the contents of the registers. 4. Issue a RETURN instruction."], "jumps": ["P1560", "P1490"]}, {"id": "P1560", "text": ["These steps provide for correct interrupt recovery in the original program.  If you modified registers and didn't restore them to their proper values, errors could exist in the main program data when execution resumes.", "These steps provide for correct interrupt recovery in the original program. If you modified registers and didn't restore them to their proper values, errors could exist in the main program data when execution resumes."], "jumps": ["P1570", "P1550"]}, {"id": "P1570", "text": ["Now that we have looked at the different blocks of the 8051 microcontroller, let's look at the pin configuration (pin-out) for    the microcontroller.", "Now that we have looked at the different blocks of the 8051 microcontroller, let's look at the pin configuration (pin-out) for the microcontroller."], "jumps": ["P1580", "P1550"]}, {"id": "P1580", "text": ["The pin configuration of the 8051 is shown below.  Note that address pins 0 through 7 are also the data pins.  Special circuitry will take the correct information from these pins at the proper time during operation.  Having two signals on one line is known as multiplexing.", "The pin configuration of the 8051 is shown below. Note that address pins 0 through 7 are also the data pins. Special circuitry will take the correct information from these pins at the proper time during operation. Having two signals on one line is known as multiplexing."], "jumps": ["P1590", "P1550"]}, {"id": "P1590", "text": ["Pin 20 is the Ground or reference connection.  Pins 32 - 39 are the A/D0 - A/D7 Multiplexed Address/Data Bus lines.  In the beginning of a machine cycle this bus is the address bus, which becomes the data bus for the remainder of the cycle.", "Pin 20 is the Ground or reference connection. Pins 32 - 39 are the A/D0 - A/D7 Multiplexed Address/Data Bus lines. In the beginning of a machine cycle this bus is the address bus, which becomes the data bus for the remainder of the cycle."], "jumps": ["P1600", "P1580"]}, {"id": "P1600", "text": ["Pins 1 - 8 are P1.0 - P1.7 known as the Parallel Port.  These are the pins of the built in parallel port.  The parallel port has 8-bits      and is controlled by certain internal registers.", "Pins 1 - 8 are P1.0 - P1.7 known as the Parallel Port. These are the pins of the built in parallel port. The parallel port has 8-bits and is controlled by certain internal registers."], "jumps": ["P1610", "P1580"]}, {"id": "P1610", "text": ["Pins 21 - 28 are the A8 - A15 signals of the Address Bus.  These are the high 8 bits of the address bus.  There are no multiplexed data signals on these pins.", "Pins 21 - 28 are the A8 - A15 signals of the Address Bus. These are the high 8 bits of the address bus. There are no multiplexed data signals on these pins."], "jumps": ["P1620", "P1580"]}, {"id": "P1620", "text": ["Pins 19 - 18 are the XTAL1 and XTAL2 signals which are used to connect an external crystal to the microcontroller.  The 8051 has a built in timing circuit which requires an external crystal.", "Pins 19 - 18 are the XTAL1 and XTAL2 signals which are used to connect an external crystal to the microcontroller. The 8051 has a built in timing circuit which requires an external crystal."], "jumps": ["P1630", "P1580"]}, {"id": "P1630", "text": ["Pin 9 is the RESET Input.  When this signal is set high, the microcontroller is reset and the instruction pointer is set  to zero.", "Pin 9 is the RESET Input. When this signal is set high, the microcontroller is reset and the instruction pointer is set to zero."], "jumps": ["P1640", "P1580"]}, {"id": "P1640", "text": ["Pin 31 EA is the External Access signal.  This pin indicates where to begin program execution.  If high, the internal memory is used  and when low then external memory is used.", "Pin 31 EA is the External Access signal. This pin indicates where to begin program execution. If high, the internal memory is used and when low then external memory is used."], "jumps": ["P1650", "P1580"]}, {"id": "P1650", "text": ["Pin 29 PSEN is the Program Store Enable signal.  This signal is used with external memory to indicate that an instruction is to be read.", "Pin 29 PSEN is the Program Store Enable signal. This signal is used with external memory to indicate that an instruction is to be read."], "jumps": ["P1660", "P1580"]}, {"id": "P1660", "text": ["Pins 12 and 13 are the INT1 and INT2 External Interrupt connections.  The combination of signals on these two lines indicate one of three possible interrupts.  A high on both lines indicates no interrupts to the microcontroller.", "Pins 12 and 13 are the INT1 and INT2 External Interrupt connections. The combination of signals on these two lines indicate one of three possible interrupts. A high on both lines indicates no interrupts to the microcontroller."], "jumps": ["P1670", "P1580"]}, {"id": "P1670", "text": ["Pin 30 ALE is the Address Latch Enable signal.  A latch is a bank of flip-flops used to store the last input value.  The address latch   stores the address from the multiplexed lines so it will be            available for the rest of the cycle.  The address latch enable tells   the address latch it can take the information on the A/D pins.", "Pin 30 ALE is the Address Latch Enable signal. A latch is a bank of flip-flops used to store the last input value. The address latch stores the address from the multiplexed lines so it will be available for the rest of the cycle. The address latch enable tells the address latch it can take the information on the A/D pins."], "jumps": ["P1680", "P1580"]}, {"id": "P1680", "text": ["Pin 10 and 11, TXD and RXD, are the Transmit and Receive signals.  These two signals are used by the serial port of the 8051.  These signals connect between the same two signals of another device to communicate.  However, TXD of one is connected to RXD of another and vise versa.", "Pin 10 and 11, TXD and RXD, are the Transmit and Receive signals. These two signals are used by the serial port of the 8051. These signals connect between the same two signals of another device to communicate. However, TXD of one is connected to RXD of another and vise versa."], "jumps": ["P1690", "P1580"]}, {"id": "P1690", "text": ["Pins 14 and 15, T0 and T1, are the Timer External Inputs. These two pins provide an external input for the T0 and T1 internal timers."], "jumps": ["P1700", "P1580"]}, {"id": "P1700", "text": ["Pin 16, WR, is the Write Control signal.  A low level indicates the data on the data bus is to be written to the selected memory          address or I/O location.", "Pin 16, WR, is the Write Control signal. A low level indicates the data on the data bus is to be written to the selected memory address or I/O location."], "jumps": ["P1710", "P1580"]}, {"id": "P1710", "text": ["Pin 17, RD, is the Read Control signal.  A low level indicates the selected memory or I/O device is to be read and that the data bus is available for data transfer.", "Pin 17, RD, is the Read Control signal. A low level indicates the selected memory or I/O device is to be read and that the data bus is available for data transfer."], "jumps": ["P1720", "P1580"]}, {"id": "P1720", "text": ["Pin 40 is the Vcc or Power signal to the 8051 microcontroller.  It is this signal that is used to apply +5 volts to the system.", "Pin 40 is the Vcc or Power signal to the 8051 microcontroller. It is this signal that is used to apply +5 volts to the system."], "jumps": ["P1730", "P1580"]}, {"id": "P1730", "text": ["As you learn more about the interface between the microcontroller and external circuitry, the purpose for these signals will become more apparent.  In the experiment you will be able to look at any of these signals and compare them with other signals in the system.", "As you learn more about the interface between the microcontroller and external circuitry, the purpose for these signals will become more apparent. In the experiment you will be able to look at any of these signals and compare them with other signals in the system."], "jumps": ["P1740", "P1580"]}, {"id": "P1740", "text": ["In this lesson you have learned about the 8051 microcontroller, its internal functions and connections available outside the microcontroller."], "jumps": ["P1750", "P1580"]}, {"id": "P1750", "text": ["Which is a 16-bit register of the 8051?", "Which is a 16-bit register of the 8051?...................."], "jumps": ["P1580"]}, {"id": "P1751", "text": [], "jumps": []}, {"id": "P1752", "text": ["The R0 register is a general purpose 8-bit register.", "The R0 register is a general purpose 8-bit register........"], "jumps": []}, {"id": "P1753", "text": ["The B register is an 8-bit register used for multiplication and division instructions."], "jumps": []}, {"id": "P1760", "text": ["How many Data Lines does the 8051 system have?", "How many Data Lines does the 8051 system have?............."], "jumps": ["P1750"]}, {"id": "P1761", "text": [], "jumps": []}, {"id": "P1762", "text": ["The 8051 only has 8 data lines and sixteen address lines.", "The 8051 only has 8 data lines and sixteen address lines..."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on 8051 MICROCONTROLLER CIRCUITRY."], "jumps": ["P1001", "P1760"]}, {"id": "P1920", "text": ["1.   The features of the 8051 include:", "1. The features of the 8051 include: raphic Text)16-bit address length (65 kbytes) Multiplexed address and data lines 8-bit data bus RESET input Interrupt Handling Many arithmetic and logic instructions", "Many arithmetic and logic instructions Issue a RETURN instruction."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  The actions that the microcontroller performs must be                      executed at specific times to ensure proper operation of the           microcontroller.", "2. The actions that the microcontroller performs must be executed at specific times to ensure proper operation of the microcontroller."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Instructions are decoded by the 8051 microcontroller into one       or more machine cycles that are executed sequentially.", "3. Instructions are decoded by the 8051 microcontroller into one or more machine cycles that are executed sequentially."], "jumps": ["P1999", "P1920"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1920"]}, {"id": "P2001", "text": ["Using the Nida 8051 Card set you will be able to observe some of these signals which are used externally to the microcontroller. The main Nida PC card of interest is the PC130-405 51 Family        Microcontroller.", ". The experiment in this lesson is not setup to use the selected trainer.", "Using the Nida 8051 Card set you will be able to observe some of these signals which are used externally to the microcontroller. The main Nida PC card of interest is the PC130-405 51 Family Microcontroller."], "jumps": ["P2050", "P2001"]}, {"id": "P2050", "text": ["The PC130-405 card contains an 8051 microcontroller, address latches, serial buffers, serial port, EPROM, RAM, chip select       decoding circuitry, and timing circuitry.", "The PC130-405 card contains an 8051 microcontroller, address latches, serial buffers, serial port, EPROM, RAM, chip select decoding circuitry, and timing circuitry."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["The rest of the components are resistors, capacitors, and a switch.  There are also numerous test points for testing the signals in the system.  The 34 pin connector is used to apply signals to the other devices of the system.", "The rest of the components are resistors, capacitors, and a switch. There are also numerous test points for testing the signals in the system. The 34 pin connector is used to apply signals to the other devices of the system."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["Since the keyboard is required for the basic operation of the 8051 microcontroller system, let's look at how the keyboard works."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["The keyboard contains 24 keys.  Each of the keys has its function(s) screened on the key surface.  Some keys are used for more than one function.  The keys that will be used in the experiment are described below.", "The purpose of this experiment is to investigate various microcontroller signals in the circuits on the PC130-405 experiment card.", "The keyboard contains 24 keys. Each of the keys has its function(s) screened on the key surface. Some keys are used for more than one function. The keys that will be used in the experiment are described below.", "0 - F These keys are used for entering hexadecimal numbers. Data and addresses are entered using these keys. Edit This key is used to edit data in RAM. When you press this key, the LCD will show \"EDIT ADD:_ \" The system is now waiting for you to enter a segment and offset. An example would be \"553:53\". The segment is 0553 and the offset is 0053. Run This key is used to run a program in RAM or ROM. When you press this key, the LCD will show \"RUN ADD : \". The system is now waiting for you to enter a SEGMENT:OFFSET to the program. Enter This key is used to indicate a current program, that you have finished entering information for a particular task. Stop This key is used when you finish entering data into RAM or want to exit a program. After pressing stop, the display will return to the \"NIDA CORPORATION INTEL 8051 VX.X\" message. Used in the editing to move backwards through the memory. Used in the editing to move forwards through the memory. Used to erase the last character entered..............."], "jumps": ["P2090", "P2040", "P2100", "P2080"]}, {"id": "P2100", "text": ["By looking at each of the signals used in the 8051 circuitry, you can begin to understand the importance of timing in the system."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["The schematic to the PC130-405 card will be available using the F5 key when needed.  Schematics provide a graphical representation of component interconnections in a circuit.", "The schematic to the PC130-405 card will be available using the F5 key when needed. Schematics provide a graphical representation of component interconnections in a circuit."], "jumps": ["P2120", "P2090"]}, {"id": "P2120", "text": ["If you didn't have the schematic, you would have to follow the connections and metal on the printed circuit board the 8051 is      attached to.  This is a very tedious process and prone to errors.", "If you didn't have the schematic, you would have to follow the connections and metal on the printed circuit board the 8051 is attached to. This is a very tedious process and prone to errors."], "jumps": ["P2140", "P2110"]}, {"id": "P2140", "text": ["Let's begin the experiment.", "Let's begin the experiment.e..............................."], "jumps": ["P2150", "P2110"]}, {"id": "P2150", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2140"]}, {"id": "P2160", "text": ["2. Insert the following 130 experiment cards on the test console. a. Insert PC130-405 51 Family Microcontroller card in the PC1 position. b. Insert PC130-406 Keyboard and Display card in the PC2 position. c. Insert PC130-407 Microcontroller I/O and Interface card in the PC3 position."], "jumps": ["P2150"]}, {"id": "P2170", "text": ["3. Connect the three experiment cards with the ribbon cables as follows: a. Using the first 34 pin ribbon cable, connect PC130-405 J1 to PC130-406 J1. b. Using the second 34 pin ribbon cable, connect PC130-406 J2 to PC130- 407 J1."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["4.  Set the Negative DC Power Supply to -15V.  The Voltmeter on         the 130A should indicate 15 Volts.", "4. Set the Negative DC Power Supply to -15V. The Voltmeter on the 130A should indicate 15 Volts."], "jumps": ["P2170"]}, {"id": "P2190", "text": ["5.  Set the Positive DC Power Supply to +15V.  The Voltmeter on        the 130A should indicate 15 Volts.", "5. Set the Positive DC Power Supply to +15V. The Voltmeter on the 130A should indicate 15 Volts."], "jumps": ["P2180"]}, {"id": "P2200", "text": ["6.  Press the PC3 DC Power switch to ON.", "6. Press the PC3 DC Power switch to ON....2. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2190"]}, {"id": "P2205", "text": ["7.  Press the PC2 DC Power switch to ON.", "7. Press the PC2 DC Power switch to ON....2. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2200"]}, {"id": "P2210", "text": ["8.  Press the PC1 DC Power switch to ON.", "8. Press the PC1 DC Power switch to ON.o 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2205"]}, {"id": "P2220", "text": ["9. The microcontroller system is now assembled and operating. You should see the message \"NIDA 51:\" in the LCD display on the PC130-406 card. If the message is dim or blank, try adjusting the Display Intensity potentiometer R4 on the PC130-406 card using a small screwdriver. If you still cannot see the message, see your instructor for assistance. E If, at any time during the experiment, you short some of the IC pins together while observing the signals, press the reset button. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run it again before proceeding with your measurements.", "If, at any time during the experiment, you short some of the IC pins together while observing the signals, press the reset button. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run it again before proceeding with your measurements.on. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run the program before proceeding with your measurements.nts."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["First, you will measure some of the basic signals present at the pins of the 8051 microcontroller IC and observe the operation of   the RESET function.", "First, you will measure some of the basic signals present at the pins of the 8051 microcontroller IC and observe the operation of the RESET function. fore trying to measure a signal from the actual IC pin, look at the test point banks on the PC card. Almost all of the pins have test points.", "Before trying to measure a signal from the actual IC pin, look at the test point banks on the PC card. Almost all of the pins have test points.that the program you were running is still in memory. If not, you must reenter the program and then run it again before proceeding with your measurements.on. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run the program before proceeding with your measurements.nts."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["10.  Press the reset button. Using the oscilloscope, measure the          voltage levels present at the following pins and enter either            HIGH or LOW.", "10. Press the reset button. Using the oscilloscope, measure the voltage levels present at the following pins and enter either HIGH or LOW.:"], "jumps": ["P2230"]}, {"id": "P2243", "text": ["Your answers are still incorrect.  The answers are HIGH, LOW, LOW, HIGH, LOW, and LOW.", "Your answers are still incorrect. The answers are HIGH, LOW, LOW, HIGH, LOW, and LOW."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["11.  Next, let's look at the clock signals.  Using the oscilloscope,          measure the frequency at the clock input of 8051, XTL1\n       pin 19. \n       Frequency = 1/period", "11. Next, let's look at the clock signals. Using the oscilloscope, measure the frequency at the clock input of 8051, XTL1 pin 19. Frequency = 1/periodddddd"], "jumps": ["P2240", "P2262"]}, {"id": "P2261", "text": [], "jumps": []}, {"id": "P2262", "text": ["Ensure you have your oscilloscope lead on the correct test point.", "Ensure you have your oscilloscope lead on the correct test point........."], "jumps": []}, {"id": "P2263", "text": ["The correct answer should of been 6.0 to 8.0 MHz.", "The correct answer should of been 6.0 to 8.0 MHz.measured 5.0mA."], "jumps": ["P2270", "P2260"]}, {"id": "P2270", "text": ["12.  Now let's see what happens when the RESET button is                    pressed on the PC130-405 experiment card.  Using your                  logic probe, measure the RESET pin of the 8051                                 microcontroller according to the following chart and fill in               your answers (HIGH, LOW).", "12. Now let's see what happens when the RESET button is pressed on the PC130-405 experiment card. Using your logic probe, measure the RESET pin of the 8051 microcontroller according to the following chart and fill in your answers (HIGH, LOW).:::"], "jumps": ["P2260", "PIN"]}, {"id": "P2273", "text": ["Your answers are still incorrect.  The answers are LOW, HIGH, LOW.", "Your answers are still incorrect. The answers are LOW, HIGH, LOW.A."], "jumps": ["P2280", "P2270"]}, {"id": "P2280", "text": ["Remember, when the RESET signal is applied to the microcontroller, it instructs the internal instruction register to start back at the beginning.  It then receives a jump command that leads the instruction pointer to the Nida monitor program.", "Remember, when the RESET signal is applied to the microcontroller, it instructs the internal instruction register to start back at the beginning. It then receives a jump command that leads the instruction pointer to the Nida monitor program."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["In this portion of the experiment, you will use the microcontroller to add two numbers as an illustration of the arithmetic capabilities of the 8051 microcontroller."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["13.  Press RESET on the PC130-405 Card.  You will be entering a         program into memory for execution by the 8051                                  microcontroller.", "Entering programs into memory of the 8051 uses the EDIT function of the 8051 Monitor Program.  Once you have pressed EDIT, you will be cued to enter an address to edit.  The typical address we will use is 8000.", "13. Press RESET on the PC130-405 Card. You will be entering a program into memory for execution by the 8051 microcontroller.....", "Entering programs into memory of the 8051 uses the EDIT function of the 8051 Monitor Program. Once you have pressed EDIT, you will be cued to enter an address to edit. The typical address we will use is 8000.", "XXXX XXXX YYYK EKCK +1111111111111"], "jumps": ["P2310", "P2290", "P2320", "P2300"]}, {"id": "P2320", "text": ["On the screen is the current address and the current value stored in that location.  There are three things you can do at any address.  Type a new value and press enter, press the down arrow to move to the next address or use the up arrow to move to the previous address.", "On the screen is the current address and the current value stored at that location.  There are three things you can do at any address: type a new value and press enter, press the down arrow to move to the next address, or use the up arrow to move to the previous address.", "On the screen is the current address and the current value stored in that location. There are three things you can do at any address. Type a new value and press enter, press the down arrow to move to the next address or use the up arrow to move to the previous address.", "On the screen is the current address and the current value stored at that location. There are three things you can do at any address: type a new value and press enter, press the down arrow to move to the next address, or use the up arrow to move to the previous address. you type a value and press enter, you will automatically move to the next address. If you press enter without entering data, zeros will be stored at that memory location."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["Every time you type a value and press enter, you will automatically move to the next address.  If you press enter without entering data, zeros will be stored at that memory location.", "Every time you type a value and press enter, you will automatically move to the next address. If you press enter without entering data, zeros will be stored at that memory location."], "jumps": ["P2340", "P2310"]}, {"id": "P2340", "text": ["Always remember to use the up and down arrows for movement through your code.  When a program is shown to you, it will include an address, Opcodes, Mnemonics, and a description. Start at the first address given and enter each opcode consecutively until you are finished entering the program.", "Always remember to use the up and down arrows for movement through your code. When a program is shown to you, it will include an address, Opcodes, Mnemonics, and a description. Start at the first address given and enter each opcode consecutively until you are finished entering the program."], "jumps": ["P2350", "P2310"]}, {"id": "P2350", "text": ["A Mnemonic is what an assembler program would use to generate the opcodes for a program.  Once you are finished editing your program you can press STOP.  To verify that the program is there, press the DISPLAY (ENTER) key and type the starting address where the program begins.", "A Mnemonic is what an assembler program would use to generate the opcodes for a program. Once you are finished editing your program you can press STOP. To verify that the program is there, press the DISPLAY (ENTER) key and type the starting address where the program begins."], "jumps": ["P2360", "P2310"]}, {"id": "P2360", "text": ["This is an instance where the ENTER key has more than one function.  After you press ENTER, all the opcodes for a location and the next few locations will be shown.  Again, use the up and down arrows to move through memory.  Pressing stop will bring you back to a main screen.", "This is an instance where the ENTER key has more than one function. After you press ENTER, all the opcodes for a location and the next few locations will be shown. Again, use the up and down arrows to move through memory. Pressing stop will bring you back to a main screen."], "jumps": ["P2370", "P2310"]}, {"id": "P2370", "text": ["14.   Enter the following program into memory starting at \"8000\".          (EDIT, 8000, enter values with an ENTER after each on,                    STOP).", "15.   Run the program you just entered.  This is done by pressing          the RUN key and entering the starting address of the                        program, \"8000\".", "14. Enter the following program into memory starting at \"8000\". (EDIT, 8000, enter values with an ENTER after each on, STOP). nemonic Description 8000 74 MOV A, #0Ah Moves the value 0Ah into a register 8001 0A 8002 78 MOV R0, #05h Moves the value 05h into the R0 8003 05 register 8004 28 ADD A, R0 Adds A+R0 and stores the sum in A 8005 90 MOV DPTR,#8100h Moves the external memory address 8006 81 8100h into the data pointer register 8007 00 (DPTR) 8008 F0 MOVX [DPTR], A Writes contents of A to the external memory pointed to by the DPTR 8009 22 RET Returns to the 8051 monitor program.", "Address Opcode Mnemonic Description 8000 74 MOV A, #0Ah Moves the value 0Ah into a register. 8001 0A 8002 78 MOV R0, #05h Moves the value 05h into the R0 register. 8003 05 8004 28 ADD A, R0 Adds A+R0 and stores the sum in A. 8005 90 MOV DPTR,#8100h Moves the external memory address 8100h into the data pointer register (DPTR. 8006 81 8007 00 8008 F0 MOVX [DPTR], A Writes contents of A to the external memory pointed to by the DPTR. 8009 22 RET Returns to the 8051 monitor program......................................", "15. Run the program you just entered. This is done by pressing the RUN key and entering the starting address of the program, \"8000\".", "XXXX XXXX YYYK EKCK +1111111111111"], "jumps": ["P2380", "P2310", "P2390", "P2370"]}, {"id": "P2390", "text": ["You should see the message \"Terminate OK\" displayed on the LCD display.  Press the STOP key.  This indicates that the program ran with no problem and returned to the monitor program.", "You should see the message \"Terminate OK\" displayed on the LCD display. Press the STOP key. This indicates that the program ran with no problem and returned to the monitor program."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["If you did not get the terminate OK message, then go back and check your program.  Only continue when your program is operating properly.", "If you did not get the terminate OK message, then go back and check your program. Only continue when your program is operating properly."], "jumps": ["P2410", "P2380"]}, {"id": "P2410", "text": ["16.  From the \"NIDA 51:\" monitor program screen press the                   enter key (DISPLAY function).  Enter the address 8100 and              press enter.", "16. From the \"NIDA 51:\" monitor program screen press the enter key (DISPLAY function). Enter the address 8100 and press enter."], "jumps": ["P2420", "P2380"]}, {"id": "P2420", "text": ["Remember, the values A and 5 were placed into A and R0 registers.  Then, the microcontroller added them together and stored the result in A.  This replaced the value previously stored there.", "Remember, the values A and 5 were placed into A and R0 registers. Then, the microcontroller added them together and stored the result in A. This replaced the value previously stored there.", "Address Opcode Mnemonic Description 8000 74 MOV A, #0Ah Moves the value 0Ah into a register. 8001 0A 8002 78 MOV R0, #05h Moves the value 05h into the R0 register. 8003 05 8004 28 ADD A, R0 Adds A+R0 and stores the sum in A. 8005 90 MOV DPTR,#8100h Moves the external memory address 8100h into the data pointer register (DPTR. 8006 81 8007 00 8008 F0 MOVX [DPTR], A Writes contents of A to the external memory pointed to by the DPTR. 8009 22 RET Returns to the 8051 monitor program......................................"], "jumps": ["P2430", "P2380"]}, {"id": "P2430", "text": ["The microcontroller loaded the external memory address 8100h into the data pointer.  The next instruction sent that data to memory location 8100h which is what you are viewing in the display.", "The microcontroller loaded the external memory address 8100h into the data pointer. The next instruction sent that data to memory location 8100h which is what you are viewing in the display."], "jumps": ["P2440", "P2420"]}, {"id": "P2440", "text": ["The first location should show OF.  If you do not see this, press STOP and check your program.  If you need assistance, ask your instructor for help.", "The first location should show OF. If you do not see this, press STOP and check your program. If you need assistance, ask your instructor for help."], "jumps": ["P2450", "P2420"]}, {"id": "P2450", "text": ["The steps for data transfer in the 8051 microcontroller system are straight forward.  Simple instructions and simplistic implementation makes the 8051 family of microcontroller ideally suited as a training vehicle.", "The steps for data transfer in the 8051 microcontroller system are straight forward. Simple instructions and simplistic implementation makes the 8051 family of microcontroller ideally suited as a training vehicle."], "jumps": ["P2460", "P2420"]}, {"id": "P2460", "text": ["In the next lesson we will look at circuits external to the 8051 microcontroller.  It is here that we will observe the control and      status signals of the 8051 since they dictate the operation of the   external circuits.", "In the next lesson we will look at circuits external to the 8051 microcontroller. It is here that we will observe the control and status signals of the 8051 since they dictate the operation of the external circuits."], "jumps": ntroller, address latches, serial buffers, serial port, EPROM, RAM, chip select       decoding circuitry, and timing circuitry.", "The PC130-405 card contains an 8051 microcontroller, address latches, serial buffers, serial port, EPROM, RAM, chip select decoding circuitry, and timing circuitry."], "jumps": ["P13060", "P13040"]}, {"id": "P13060", "text": ["The rest of the components are resistors, capacitors, and a switch.  There are also numerous test points for testing the signals in the system.  The 34 pin connector is used to apply signals to the other devices of the system.", "The rest of the components are resistors, capacitors, and a switch. There are also numerous test points for testing the signals in the system. The 34 pin connector is used to apply signals to the other devices of the system."], "jumps": ["P13070", "P13040"]}, {"id": "P13070", "text": ["Since the keyboard is required for the basic operation of the 8051 microcontroller system, let's look at how the keyboard works."], "jumps": ["P13080", "P13040"]}, {"id": "P13080", "text": ["The keyboard contains 24 keys.  Each of the keys has its function(s) screened on the key surface.  Some keys are used for more than one function.  The keys that will be used in the experiment are described below.", "The purpose of this experiment is to investigate various microcontroller signals in the circuits on the PC130-405 experiment card.", "The keyboard contains 24 keys. Each of the keys has its function(s) screened on the key surface. Some keys are used for more than one function. The keys that will be used in the experiment are described below.", "0 - F These keys are used for entering hexadecimal numbers. Data and addresses are entered using these keys. Edit This key is used to edit data in RAM. When you press this key, the LCD will show \"EDIT ADD:_ \" The system is now waiting for you to enter a segment and offset. An example would be \"553:53\". The segment is 0553 and the offset is 0053. Run This key is used to run a program in RAM or ROM. When you press this key, the LCD will show \"RUN ADD : \". The system is now waiting for you to enter a SEGMENT:OFFSET to the program. Enter This key is used to indicate a current program, that you have finished entering information for a particular task. Stop This key is used when you finish entering data into RAM or want to exit a program. After pressing stop, the display will return to the \"NIDA CORPORATION INTEL 8051 VX.X\" message. Used in the editing to move backwards through the memory. Used in the editing to move forwards through the memory. Used to erase the last character entered..............."], "jumps": ["P13090", "P13040", "P13100", "P13080"]}, {"id": "P13100", "text": ["By looking at each of the signals used in the 8051 circuitry, you can begin to understand the importance of timing in the system."], "jumps": ["P13110", "P13090"]}, {"id": "P13110", "text": ["The schematic to the PC130-405 card will be available using the F5 key when needed.  Schematics provide a graphical representation of component interconnections in a circuit.", "The schematic to the PC130-405 card will be available using the F5 key when needed. Schematics provide a graphical representation of component interconnections in a circuit."], "jumps": ["P13120", "P13090"]}, {"id": "P13120", "text": ["If you didn't have the schematic, you would have to follow the connections and metal on the printed circuit board the 8051 is      attached to.  This is a very tedious process and prone to errors.", "If you didn't have the schematic, you would have to follow the connections and metal on the printed circuit board the 8051 is attached to. This is a very tedious process and prone to errors."], "jumps": ["P13140", "P13110"]}, {"id": "P13140", "text": ["Let's begin the experiment.", "Let's begin the experiment.e..............................."], "jumps": ["P13150", "P13110"]}, {"id": "P13150", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13140"]}, {"id": "P13160", "text": ["2.  Insert the following 130 experiment cards on the test console.               a.  Insert PC130-405 51 Family Microcontroller card in the PC1 position. \n     b.  Insert PC130-406 Keyboard and Display card in the PC2 position. \n     c.  Insert PC130-407 Microcontroller I/O and Interface card in the PC3                    position.", "2. Insert the following 130 experiment cards on the test console. a. Insert PC130-405 51 Family Microcontroller card in the PC1 position. b. Insert PC130-406 Keyboard and Display card in the PC2 position. c. Insert PC130-407 Microcontroller I/O and Interface card in the PC3 position."], "jumps": ["P13170"]}, {"id": "P13170", "text": ["3. Connect the three experiment cards with the ribbon cables as follows: a. Using the first 34 pin ribbon cable, connect PC130-405 J1 to PC130-406 J1. b. Using the second 34 pin ribbon cable, connect PC130-406 J2 to PC130- 407 J1."], "jumps": ["P13180", "P13160"]}, {"id": "P13180", "text": ["4.   Press enter to set: Negative DC Power Supply Voltage - 15", "4. Press enter to set: Negative DC Power Supply Voltage - 15............."], "jumps": ["P13170"]}, {"id": "P13190", "text": ["5.   Press enter to set: Positive DC Power Supply Voltage - 15", "5. Press enter to set: Positive DC Power Supply Voltage - 15............."], "jumps": []}, {"id": "P13200", "text": ["6.   Press enter to set: PC3 DC Power Switch - ON", "6. Press enter to set: PC3 DC Power Switch - ON.........................."], "jumps": []}, {"id": "P13205", "text": ["7.   Press enter to set: PC2 DC Power Switch - ON", "7. Press enter to set: PC2 DC Power Switch - ON.........................."], "jumps": []}, {"id": "P13210", "text": ["8.   Press enter to set: PC1 DC Power Switch - ON", "8. Press enter to set: PC1 DC Power Switch - ON.........................."], "jumps": []}, {"id": "P13220", "text": ["9. T let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
