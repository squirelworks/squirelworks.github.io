const book = {"title": "93953309", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: VOLTAGE REGULATOR OPERATION fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["ge regulator components. w Describe voltage regulator operating characteristics.", "w Measure the input and output voltages of a voltage regulator. w Recognize normal operation of a voltage regulator......", "w Identify voltage regulator circuits. w Identify the purpose of individual voltage regulator components. w Describe voltage regulator operating characteristics......."], "jumps": ["P300", "P10"]}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 480/488 or Equivalent XXXXXXnt"], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P335", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about the operation of a typical voltage regulator circuit that is adjustable."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Regulator circuits provide a constant output voltage even when the input voltage or the output current varies."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Circuit operation is based on changing the effective resistance of the circuit when input and output conditions vary."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Let's begin the lesson on VOLTAGE REGULATOR OPERATION....................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["This is a typical variable series voltage regulator circuit."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Q1 is the component that automatically changes resistance to maintain a constant Vout."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The output voltage of a rectifier filter is applied to the collector of Q1."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The load is connected to the emitter of Q1."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["Current flow is from ground, through RL and Q1, to the rectifier filter.", "Current flow is from the rectifier filter to Q1, RL and then to ground."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["Since RL and Q1 are in series, this circuit is a series voltage regulator."], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["R1, Q2 and D1 form a voltage divider that applies base bias to Q1. Collector bias is obtained directly from the rectifier filter output voltage.", "R1, Q2 and D1 form a voltage divider that applies base bias to Q1. Collector bias is obtained directly from the rectifier filter output voltage..."], "jumps": ["P1090", "P1020"]}, {"id": "P1090", "text": ["The emitter voltage for Q1 is developed by the action of the transistor."], "jumps": ["P1100", "P1020"]}, {"id": "P1100", "text": ["R2 is used to vary the conduction of Q2 which changes Q2's collector to emitter voltage drop."], "jumps": ["P1110", "P1020"]}, {"id": "P1110", "text": ["The operation of this variable series voltage regulator is based on two principles.  \n                                        * Operation of D1 and Q2  \n                                        *  Voltage drop across Q1", "The operation of this variable series voltage regulator is based on two principles. * Operation of D1 and Q2 * Voltage drop across Q111'"], "jumps": ["P1120", "P1020"]}, {"id": "P1120", "text": ["Let's investigate the operation of D1 and Q2 first.  \n                                     *  Operation of D1 and Q2  \n                                     *  Voltage drop across Q1", "Let's investigate the operation of D1 and Q2 first. * Operation of D1 and Q2 * Voltage drop across Q111"], "jumps": ["P1130", "P1020"]}, {"id": "P1130", "text": ["The voltage applied to the base of Q1 is determined by the voltage drop of D1 and Q2."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["D1's voltage drop is established by the Vz of the zener diode."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["Recall that a zener diode maintains a constant voltage drop as long as it is operating in the breakdown region."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["For example, if the zener voltage for D1 is 6V, the voltage between the cathode and ground of D1 is 6V."], "jumps": ["P1170", "P1130"]}, {"id": "P1170", "text": ["The voltage drop across Q2 is established by the level of voltage applied to the base."], "jumps": ["P1180"]}, {"id": "P1180", "text": ["Recall that in a transistor, if the forward bias increases, collector current increases, decreasing the voltage on the collector."], "jumps": ["P1190", "P1130", "P1185"]}, {"id": "P1182", "text": ["Recall that in a transistor, if the forward bias increases, collector current increases, decreasing the voltage on the collector."], "jumps": ["P1190", "P1130", "P1185"]}, {"id": "P1185", "text": ["r to collector current to increase. When I", "VOLTAGE ON COLLECTOR OF Q2 - Increasing the forward bias causes emitter to collector current to increase. When Ic increases, the voltage drop across R1 increases. This reduces the voltage on the collector which reduces Ece."], "jumps": []}, {"id": "P1190", "text": ["For example, the base voltage on Q2 establishes a collector to emitter voltage of 3 V."], "jumps": ["P1200", "P1182"]}, {"id": "P1200", "text": ["The voltage drop of D1 and Q2 place 9 V on the base of Q1.  The current flow set by D1 and Q2 causes R1 to drop 6 V.", "The voltage drop of D1 and Q2 place 9 V on the base of Q1. The current flow set by D1 and Q2 causes R1 to drop 6 V."], "jumps": ["P1210", "P1182"]}, {"id": "P1210", "text": ["If the input voltage increases to 18 V, D1 and Q2 currents change so that R1 drops 9 V, leaving 9 V on the base of Q1.  Remember, Ee remains at 6V and Eb remains at 6.6 V.", "If the input voltage increases to 18 V, D1 and Q2 currents change so that R1 drops 9 V, leaving 9 V on the base of Q1. Remember, Ee remains at 6V and Eb remains at 6.6 V."], "jumps": ["P1220", "P1182"]}, {"id": "P1220", "text": ["If the input voltage decreases to 12 V, D1 and Q2 currents change so that R1 drops 3 V, leaving 9 V on the base of Q1."], "jumps": ["P1230", "P1182"]}, {"id": "P1230", "text": ["In other words, the base voltage for Q1 is always 9 V as long as the DC input voltage is 9 V or greater."], "jumps": ["P1240", "P1182"]}, {"id": "P1240", "text": ["Only when the voltage across Q2 is changed is the base voltage on Q1 changed."], "jumps": ["P1250"]}, {"id": "P1250", "text": ["Now, let's investigate the action of Q1.  \n                                     *  Operation of D1 and Q2  \n                                     *  Voltage drop across Q1", "Now, let's investigate the action of Q1. * Operation of D1 and Q2 * Voltage drop across Q11111"], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["With a base voltage of +9 V, the emitter is placed at +8.4 V."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["If the input voltage is +18 V, the action of Q1 drops 9.6 V from the collector to emitter."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["If the input voltage increases to 19 V, Q1 must drop 10.6 V.  In effect, Q1 collector to emitter resistance is increased.", "If the input voltage increases to 19 V, Q1 must drop 10.6 V. In effect, Q1 collector to emitter resistance is increased."], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["If the input voltage decreases to 17 V, Q1 must drop 8.6 V.  In effect, Q1 collector to emitter resistance is decreased.", "If the input voltage decreases to 17 V, Q1 must drop 8.6 V. In effect, Q1 collector to emitter resistance is decreased."], "jumps": ["P1300", "P1260"]}, {"id": "P1300", "text": ["The result is that the output voltage, voltage on the emitter, is held constant even if the input voltage varies."], "jumps": ["P1310", "P1260"]}, {"id": "P1310", "text": ["Also, if the load current varies, the output voltage is held constant by the action of Q1."], "jumps": ["P1320", "P1260"]}, {"id": "P1320", "text": ["Again, the voltage on the emitter, which is the output voltage, is established by the action of Q1."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["If the load current increased (due to RL decreasing), the emitter voltage would try to decrease because the load drops less voltage.", "If the load current increased (due to RL decreasing), the emitter voltage would try to decrease because the load drops less voltage......................."], "jumps": ["P1340", "P1310"]}, {"id": "P1340", "text": ["When Ee tries to decrease, the forward bias of the base-emitter PN junction increases, decreasing transistor resistance........................"], "jumps": ["P1350", "P1310"]}, {"id": "P1350", "text": ["With the transistor having less resistance, it drops less voltage. Which means that RL drops more voltage, keeping the emitter at 8.4 V. 8.4 V......................."], "jumps": ["P1360", "P1310"]}, {"id": "P1360", "text": ["If the load current decreased (due to RL increasing), the emitter voltage would try to increase because the load drops more voltage.ease because the load drops less voltage."], "jumps": ["P1370", "P1310"]}, {"id": "P1370", "text": ["When Ee tries to increase, the forward bias of the base-emitter PN junction decreases, increasing transistor resistance......................"], "jumps": ["P1380", "P1310"]}, {"id": "P1380", "text": ["With the transistor having more resistance, it drops more voltage. Which means that RL drops less voltage. Keeping the emitter at 8.4 V. 8.4 V. 8.4 V."], "jumps": ["P1390", "P1310"]}, {"id": "P1390", "text": ["The result is that the output voltage, on the emitter, is held constant even if the output current varies."], "jumps": ["P1400", "P1310"]}, {"id": "P1400", "text": ["Putting the circuit together, D1 and Q2 set the voltage of the regulator.  Notice the voltage across Q2 is variable.", "Putting the circuit together, D1 and Q2 set the voltage of the regulator. Notice the voltage across Q2 is variable."], "jumps": ["P1410", "P1310"]}, {"id": "P1410", "text": ["Q1 maintains the output voltage to .6 V less than the voltage on its base under varying input and output conditions.", "Q1 maintains the output voltage to .6 V less than the voltage on its base under varying input and output conditions.."], "jumps": ["P1420", "P1400", "P"]}, {"id": "P1420", "text": ["There is one additional point to bring out about the circuit.  The voltage on the base of Q2 is always the same, .6 V above the emitter voltage!  Let's see why.", "There is one additional point to bring out about the circuit. The voltage on the base of Q2 is always the same, .6 V above the emitter voltage! Let's see why."], "jumps": ["P1430", "P1400"]}, {"id": "P1430", "text": ["The circuit is set up as shown.  The output voltage is 8.4 V.", "The circuit is set up as shown. The output voltage is 8.4 V."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["Increasing the resistance of R2 raises the voltage on the base of Q2."], "jumps": ["P1450", "P1420"]}, {"id": "P1450", "text": ["With 7.6 V on the base, the base to emitter forward bias is increased, increasing emitter to collector current.", "With 7.6 V on the base, the base to emitter forward bias is increased, increasing collector to emitter current."], "jumps": ["P1460", "P1420"]}, {"id": "P1460", "text": ["An increase in collector current increases the voltage drop across R1, lowering Q2's collector voltage - Ece decreases."], "jumps": ["P1470", "P1420"]}, {"id": "P1470", "text": ["The voltage on the base of Q1 is lowered to 8V."], "jumps": ["P1480", "P1420"]}, {"id": "P1480", "text": ["The 8 V on the base of Q1 produces a 7.4 V output voltage.  The regulated output voltage is lowered.", "The 8 V on the base of Q1 produces a 7.4 V output voltage. The regulated output voltage is lowered."], "jumps": ["P1490", "P1420"]}, {"id": "P1490", "text": ["The lower output voltage lowers the voltage across R2, which lowers the base voltage of Q2 back to 6.6V."], "jumps": ["P1500", "P1420"]}, {"id": "P1500", "text": ["The overall effect is that Eb is held to .6V above the emitter voltage (which is held to a constant level by D1) no matter what the value of R2 is."], "jumps": ["P1510", "P1420"]}, {"id": "P1510", "text": ["Since R2 is changed and the voltage is held constant, the base current increases and decreases as R2 is increased and decreased."], "jumps": ["P1520", "P1420"]}, {"id": "P1520", "text": ["Reversing the diode and the type of transistor does not change circuit operation."], "jumps": ["P1530", "P1420"]}, {"id": "P1530", "text": ["The only difference is the circuit is now a negative voltage regulator."], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["Which component effectively changes resistance to maintain a constant Vout in a voltage regulator?"], "jumps": ["P1520"]}, {"id": "P1541", "text": [], "jumps": []}, {"id": "P1542", "text": ["Q2 is part of the voltage divider that sets the output voltage.  It is not used to maintain a constant Vout.", "Q2 is part of the voltage divider that sets the output voltage. It is not used to maintain a constant Vout."], "jumps": []}, {"id": "P1543", "text": ["D1 does effectively change resistance; however, its action sets the output voltage along with Q2.  D1 does not maintain Vout.", "D1 does effectively change resistance; however, its action sets the output voltage along with Q2. D1 does not maintain Vout."], "jumps": []}, {"id": "P1550", "text": ["Which component(s) set the output voltage in a voltage regulator?"], "jumps": ["P1540"]}, {"id": "P1551", "text": [], "jumps": []}, {"id": "P1552", "text": ["Q1 maintains the output voltage by effectively changing the emitter to collector resistance.  It does not set the output voltage.", "Q1 maintains the output voltage by effectively changing the emitter to collector resistance. It does not set the output voltage.", "Q1 maintains the output voltage by effectively changing the collector to emitter resistance. It does not set the output voltage."], "jumps": []}, {"id": "P1553", "text": ["Q2 sets part of the output voltage.  There is another component that also is used to set the output voltage.", "Q2 sets part of the output voltage. There is another component that also is used to set the output voltage."], "jumps": []}, {"id": "P1554", "text": ["D1 sets part of the output voltage.  There is another component that also is used to set the output voltage.", "D1 sets part of the output voltage. There is another component that also is used to set the output voltage."], "jumps": []}, {"id": "P1560", "text": ["In this regulator, if the input voltage decreases, the voltage across Q1 _______"], "jumps": ["P1550"]}, {"id": "P1561", "text": [], "jumps": []}, {"id": "P1562", "text": ["If the voltage across the emitter and collector of Q1 increased and the applied voltage decreases, Eout would not remain constant.", "If the voltage across the collector to emitter of Q1 increased and the applied voltage decreases, Eout would not remain constant."], "jumps": []}, {"id": "P1563", "text": ["If the voltage across the emitter and collector of Q1 stayed the same and the applied voltage decreases, Eout would not remain constant.", "If the voltage across the collector to emitter of Q1 stayed the same and the applied voltage decreases, Eout would not remain constant."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on the VOLTAGE REGULATOR CIRCUITS."], "jumps": ["P1001", "P1560"]}, {"id": "P1920", "text": ["1.  This is a variable voltage regulator.", "1. This is a variable voltage regulator.cond line here...."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Q2 and D1 set the output voltage."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Q1 maintains the output voltage."], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["4.  Q1 effectively changes resistance between its emitter and collector to maintain the emitter voltage at a constant level.", "4. Q1 effectively changes resistance between its collector to emitter to maintain the emitter voltage at a constant level.", "4. Q1 effectively changes resistance between its emitter and collector to maintain the emitter voltage at a constant level.", "4. Q1 effectively changes resistance between its emitter and collector to maintain the emitter voltage at a constant level.t level...evel."], "jumps": ["P1960", "P1920"]}, {"id": "P1960", "text": ["5.  Voltage changes in the output of the rectifier filter and current        changes drawn by the load do not affect Vout.", "5. Voltage changes in the output of the rectifier filter and current changes drawn by the load do not affect Vout."], "jumps": ["P1999", "P1920"]}, {"id": "P1999", "text": ["You have completed the Summary.  \nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1960"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["The purpose of this experiment is to demonstrate the normal operation of a variable voltage regulator."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["In this experiment, you will use two PC cards.  One is a rectifier and the other is the variable voltage regulator.", "In this experiment, you will use two PC cards. One is a rectifier and the other is the variable voltage regulator."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["Pick up the PC130-23 card and compare it to the schematic shown.  This card is used as the rectifier and is placed in the PC1 position.", "Pick up the PC130-23 card and compare it to the schematic shown. This card is used as the rectifier and is placed in the PC1 position."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["Pick up the PC130-26 card.  This card is used to demonstrate variable voltage regulator circuits and is placed in the PC2 position.", "Pick up the PC130-26 card. This card is used to demonstrate variable voltage regulator circuits and is placed in the PC2 position."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["Compare the card with the schematic shown."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["Notice Q1 on the card and schematic.  Q1 is a power transistor.", "Notice Q1 on the card and schematic. Q1 is a power transistor."], "jumps": ["P2090", "P2060"]}, {"id": "P2090", "text": ["Since the transistor is in series to the load, total current flows through Q1."], "jumps": ["P2100"]}, {"id": "P2100", "text": ["Q1 is large so that more heat can be dissipated.  Power transistors handle more current than regular transistors.", "Q1 is large so that more heat can be dissipated. Power transistors handle more current than regular transistors."], "jumps": ["P2110", "P2060"]}, {"id": "P2110", "text": ["D1 and Q2 set the output voltage.  Vz for the diode on the card is 4.7 V.", "D1 and Q2 set the output voltage. Vz for the diode on the card is 4.7 V."], "jumps": ["P2120", "P2060"]}, {"id": "P2120", "text": ["Notice that D1 and Q2 are small.  Remember, they are in the base circuit of Q1 where current flow is usually in the micro amps.", "Notice that D1 and Q2 are small. Remember, they are in the base circuit of Q1 where current flow is usually in the micro amps."], "jumps": ["P2130", "P2060"]}, {"id": "P2130", "text": ["Resistors R6, R7 and R8 along with switches S1 and S2 select the value of the load that is connected to the emitter of Q1."], "jumps": ["P2140", "P2060"]}, {"id": "P2140", "text": ["R3, R4 and R5 form a voltage divider that applies the base voltage  to Q2.", "R3, R4 and R5 form a voltage divider that applies the base voltage to Q2."], "jumps": ["P2150", "P2060"]}, {"id": "P2150", "text": ["R2 feedbacks some of Vout to the cathode of D1.  This ensures that D1 is always operating in the breakdown region or above Vz.", "R2 feedbacks some of Vout to the cathode of D1. This ensures that D1 is always operating in the breakdown region or above Vz."], "jumps": ["P2160", "P2060"]}, {"id": "P2160", "text": ["C1 and C2 ensure that any small voltage variations from R4 and D1 are not felt on the output; they act as a filter.  Let's start the experiment.", "C1 and C2 ensure that any small voltage variations from R4 and D1 are not felt on the output; they act as a filter. Let's start the experiment."], "jumps": ["P2170", "P2060"]}, {"id": "P2170", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2060"]}, {"id": "P2180", "text": ["2.  Carefully plug PC130-23 into the Test Console PC1 position.", "2. Carefully plug PC130-23 into the Test Console PC1 position. Carefully plug PC130-25 into the Test Console PC2 position."], "jumps": ["P2170"]}, {"id": "P2182", "text": ["Ensure the two jumpers are placed vertically between the top and middle jumpers located in the upper left hand corner of the PC130-23 card. Jumpers on the PC130-23 card may not be available, if so, disregard graphic and caution below.", "Ensure the two jumpers are placed vertically between the top and middle jumpers located in the upper left hand corner of the PC130-23 card. Jumpers on the PC130-23 card may not be available, if so, disregard graphic and caution below...", "Jumpers that have not been installed correctly on the PC130-23 card may cause damage to the board circuitry. Do not connect the oscilloscope ground to pins G or H......................."], "jumps": ["P2180"]}, {"id": "P2184", "text": ["3.  Carefully plug PC130-26 into the Test Console PC2 position.", "3. Carefully plug PC130-26 into the Test Console PC2 position. Carefully plug PC130-25 into the Test Console PC2 position."], "jumps": ["P2182"]}, {"id": "P2190", "text": ["4.  On PC130-23:  a.  Place S1 and S2 to IN.  \n                                  b.  Place S3 to the right.  \n                                  c.  Place S4, S5, and S6 to OUT.  \n     This sets up the rectifier for full wave and allows the output to       be connected to the PC130-26 card.", "4. On PC130-23: a. Place S1 and S2 to IN. b. Place S3 to the right. c. Place S4, S5, and S6 to OUT. This sets up the rectifier for full wave and allows the output to be connected to the PC130-26 card.."], "jumps": ["P2200", "P2184", "P2195"]}, {"id": "P2195", "text": ["MEASUREMENT SETUP Carefully place S1 and S2 to IN. Carefully place S3 to RIGHT. Carefully place S4, S5 and S6 to OUT."], "jumps": []}, {"id": "P2200", "text": ["5.  On PC130-26 place S1 and S2 to OUT.  S1 and S2 OUT                      disconnect the load from the emitter of Q1.", "5. On PC130-26 place S1 and S2 to OUT. S1 and S2 OUT disconnect the load from the emitter of Q1."], "jumps": ["P2220", "P2190", "P2205"]}, {"id": "P2205", "text": ["MEASUREMENT SETUP - Carefully place S1 and S2 to OUT."], "jumps": []}, {"id": "P2220", "text": ["6.  Turn PC1 AC power switch to ON.", "6. Turn PC1 AC power switch to ON........................................."], "jumps": ["P2200"]}, {"id": "P2230", "text": ["7.  Using a multimeter, measure the DC voltage at PC130-26 TP2        with respect to ground (input to regulator card from the                   rectifier card).  \n     What is the measured voltage?", "7. Using a multimeter, measure the DC voltage at PC130-26 TP2 with respect to ground (input to regulator card from the rectifier card). What is the measured voltage?"], "jumps": ["P2220", "P2232", "P2235"]}, {"id": "P2231", "text": [], "jumps": []}, {"id": "P2232", "text": ["Your voltage measurement is incorrect.  Ensure that you are using the multimeter correctly and that you are measuring TP2 on PC130-26.  Also, check that on PC130-23 switches S1 and S2 are IN, S3 is to the right, and S4, S5 and S6 are OUT.", "Your voltage measurement is incorrect. Ensure that you are using the multimeter correctly and that you are measuring TP2 on PC130-26. Also, check that on PC130-23 switches S1 and S2 are IN, S3 is to the right, and S4, S5 and S6 are OUT..."], "jumps": []}, {"id": "P2233", "text": ["Your measurement is still incorrect.  You should have measured approximately 20 VDC.  Make sure your set up is correct and you are measuring PC130-26 TP2.", "Your measurement is still incorrect. You should have measured approximately 20 VDC. Make sure your set up is correct and you are measuring PC130-26 TP2."], "jumps": ["PutVar"]}, {"id": "P2235", "text": ["MEASUREMENT SETUP - Place multimeter test lead on TP2."], "jumps": []}, {"id": "P2240", "text": ["The experiment is now set up.  Let's verify normal operation of a variable regulator circuit with an input voltage of 20 VDC.", "The experiment is now set up. Let's verify normal operation of a variable regulator circuit with an input voltage of 20 VDC."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["1.  Connect a multimeter across PC130-26 Q2, emitter to                         collector, TP3 and TP5. \n2.  Set the voltage to 3.3 V by adjusting PC130-26 R4.", "1. Connect a multimeter across PC130-26 Q2, emitter to collector, TP3 and TP5. 2. Set the voltage to 3.3 V by adjusting PC130-26 R4."], "jumps": ["P2260", "P2240", "P2255"]}, {"id": "P2255", "text": ["MEASUREMENT SETUP - Place multimeter test leads on TP3 and TP5. Adjust R4 to 3.3 V."], "jumps": []}, {"id": "P2260", "text": ["With Q2's Ece at 3.3 V and D1's Vz at 4.7 V, what is the expected voltage on the base of Q1?"], "jumps": ["P2250"]}, {"id": "P2261", "text": [], "jumps": []}, {"id": "P2262", "text": ["20 V is the applied voltage to the regulator.", "20 V is the applied voltage to the regulator..............."], "jumps": []}, {"id": "P2263", "text": ["The action of Q2 and D1 does not apply 0 V base bias.", "The action of Q2 and D1 does not apply 0 V base bias......."], "jumps": []}, {"id": "P2270", "text": ["3.  Using a multimeter, measure the base voltage of Q1, PC130-26      TP3, with respect to ground.  \n      What is the measured voltage?", "3. Using a multimeter, measure the base voltage of Q1, PC130-26 TP3, with respect to ground. What is the measured voltage??"], "jumps": ["P2260", "P2272", "P2275"]}, {"id": "P2271", "text": [], "jumps": []}, {"id": "P2272", "text": ["Your voltage measurement is incorrect.  Ensure that you are measuring PC130-26 TP3 and that your multimeter is set to measure DC voltages.", "Your voltage measurement is incorrect. Ensure that you are measuring PC130-26 TP3 and that your multimeter is set to measure DC voltages."], "jumps": []}, {"id": "P2273", "text": ["Your voltage measurement is still incorrect.  You should have measured approximately 8 V.", "Your voltage measurement is still incorrect. You should have measured approximately 8 V."], "jumps": ["PutVar"]}, {"id": "P2275", "text": ["MEASUREMENT SETUP - Place multimeter test lead on TP3."], "jumps": []}, {"id": "P2280", "text": ["With approximately 8 V on the base of Q1, the output voltage (Ee) should be approximately 7.4 V."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["4.  Using a multimeter, measure the output voltage of Q1 at                  PC130-26 TP6 with respect to ground.  \n     What is the measured voltage?", "4. Using a multimeter, measure the output voltage of Q1 at PC130-26 TP6 with respect to ground. What is the measured voltage?"], "jumps": ["P2280", "P2292", "P2295"]}, {"id": "P2291", "text": [], "jumps": []}, {"id": "P2292", "text": ["Your voltage measurement is incorrect.  Ensure that you are measuring PC130-26 TP6 and that your multimeter is set to measure DC voltage.", "Your voltage measurement is incorrect. Ensure that you are measuring PC130-26 TP6 and that your multimeter is set to measure DC voltage."], "jumps": []}, {"id": "P2293", "text": ["Your voltage measurement is still incorrect.  You should have measured approximately 7.4 V \u00b110%.", "Your voltage measurement is still incorrect. You should have measured approximately 7.4 V"], "jumps": ["PutVar"]}, {"id": "P2295", "text": ["MEASUREMENT SETUP - Place multimeter test lead on TP6."], "jumps": []}, {"id": "P2300", "text": ["The voltage regulator is operating normally when the input voltage or the output current is not changing.  Now, let's vary the input and output levels and see if the regulator is operating normally under changing conditions.", "The voltage regulator is operating normally when the input voltage or the output current is not changing. Now, let's vary the input and output levels and see if the regulator is operating normally under changing conditions..."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["First we will vary the input voltage.  This is accomplished by actually turning the power OFF to the rectifier.", "First we will vary the input voltage. This is accomplished by actually turning the power OFF to the rectifier."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["Due to the large value of C3, the DC output voltage will not drop to 0 V immediately after turning power OFF."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["The DC output voltage gradually decreases from 20 V.  This allows you to observe the action of the regulator card.", "The DC output voltage gradually decreases from 20 V. This allows you to observe the action of the regulator card."], "jumps": ["P2340", "P2310"]}, {"id": "P2340", "text": ["1.  Set up the oscilloscope for dual display of DC signals.", "1. Set up the oscilloscope for dual display of DC signals.", "Trigger Coupling - DC Trigger Source - CH1 Trigger Slope - + DC/GND/AC - DC Volt/Div - 5 Display - DUAL"], "jumps": ["P2350", "P2310", "P2345"]}, {"id": "P2345", "text": ["MEASUREMENT SETUP Trigger Slope - + CH1,CH2 Volts/Div - 5 Trigger Coupling - DC CH1,CH2 AC/GND/DC - DC Trigger Source - CH1 Display Mode - Dual", "K, HK_,,_K,_K'',EK,,,,,'_,KEKZ;;XK98JO9[N=9N@N99U,,K,,EK", "'_K_'K'',K' QUK_,''KK}0;KK,KK__',K'K_K''KK'K_", "'_K_'KK',K_,,'_'',K,K', F;__KK,K, TK,,__,''KKK'", ",KK,,E:9 POOHPPP=70=07PUHP^UOOU=YOVP=PPPPOOPXOOOOXH9UO95P0P===TXZOOU1NIIPPPHPVGH5PSOPZXXOK;E", "a5T 55:s5 m5 ts55Tt T--|57s- Fss y 5 -VVFs5m--FFFmm5FFs---t-t t-| -s-ymV sGFt--ss5-", "7mty-5m--F-s- mVs t --FFy5V-|-F smst Vm--5sVt T-", ",,K;A:'K,57VGO;EEEOa>2OK9)1UE; VPKEE,'KK__K'KK'KKKKK'K_',_", "K';;_KE,KKKKE,KEEK,EKEEE OKKK-RL0;;E,;A ?PU;a", ";U;U;;UU;;;;;KEUW>< E__,K,K,',;_KKK,EKKK", "(O;KKK;;K,'EUEE;90H7Q55H5m5=V0T0HT5T=QHP=H5 TT=U;,,E__,_,K,'", ",KK,,,K',,KK,KKK,K,'',K',EE;T:559aUT99U 0P0X;"], "jumps": ["PK", "PU77OK", "PO", "P", "PKKKKKK", "PEEE", "PA"]}, {"id": "P2350", "text": ["2.  Place the CH1 trace on the second horizontal line from the              top.  \n3.  Place the CH2 trace on the bottom horizontal line.", "2. Place the CH1 trace on the second horizontal line from the top. 3. Place the CH2 e decreasing while the output voltage remains constant.", "Once the Voltage on the cathode of D1 falls below Vz, the output voltage will decrease. This is because the zener diode is no longer operating in its breakdown region................... on. reakdown region. region."], "jumps": ["P2390", "P2370"]}, {"id": "P2390", "text": ["6.  Turn PC1 AC power switch to OFF.  Observe the input and             output voltages on the oscilloscope.", "6. Turn PC1 AC power switch to OFF. Observe the input and output voltages on the oscilloscope."], "jumps": ["P2380"]}, {"id": "P2400", "text": ["Notice that the output voltage stayed constant when the input voltage decreased.  Only after the voltage on the cathode of D1 fell below 4.7 V did the output voltage decrease.", "Notice that the output voltage stayed constant when the input voltage decreased. Only after the voltage on the cathode of D1 fell below 4.7 V did the output voltage decrease."], "jumps": ["P2410", "P2390"]}, {"id": "P2410", "text": ["Also notice that even a long time after power has been turned off, there is still voltage applied to TP2 from the rectifier card."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["This is due to the size of C3 on PC130-23.  It takes a long time for C3 to discharge.", "This is due to the size of C3 on PC130-23. It takes a long time for C3 to discharge."], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["Power supply filter capacitors may retain a charge long after power is removed from the circuit, especially high voltage power supplies.  The power supply for a TV picture tube is a good example.", "Power supply filter capacitors may retain a charge long after power is removed from the circuit, especially high voltage power supplies. The power supply for a TV picture tube is a good example.d example."], "jumps": ["P2440", "P2420"]}, {"id": "P2440", "text": ["7.  Turn PC1 AC power switch to ON.  Now, let's vary the output         current.  This is accomplished by switching in different size           load resistors on PC130-26.", "7. Turn PC1 AC power switch to ON. Now, let's vary the output current. This is accomplished by switching in different size load resistors on PC130-26.."], "jumps": ["P2430"]}, {"id": "P2450", "text": ["1.  Set up the oscilloscope for CH1 display of DC signals.", "1. Set up the oscilloscope for CH1 display of DC signals..", "Trigger Coupling - DC Trigger Source - CH1 Trigger Slope - + DC/GND/AC - DC Volt/Div - 5 Display - CH1 Zero the trace"], "jumps": ["P2460", "P2440", "P2455"]}, {"id": "P2455", "text": ["MEASUREMENT SETUP Trigger Slope - + CH1 Volts/Div - 5 Trigger Coupling - DC CH1 AC/GND/DC - DC Trigger Source - CH1 Display Mode - CH1", "K, HK_,,_K,_K'',EK,,,,,'_,KEKZ;;XK98JO9[N=9N@N99U,,K,,EK", "'_K_'K'',K' QUK_,''KK}0;KK,KK__',K'K_K''KK'K_", "'_K_'KK',K_,,'_'',K,K', F;__KK,K, TK,,__,''KKK'", ",KK,,E:9 POOHPPP=70=07PUHP^UOOU=YOVP=PPPPOOPXOOOOXH9UO95P0P===TXZOOU1NIIPPPHPVGH5PSOPZXXOK;E", "a5T 55:s5 m5 ts55Tt T--|57s- Fss y 5 -VVFs5m--FFFmm5FFs---t-t t-| -s-ymV sGFt--ss5-", "7mty-5m--F-s- mVs t --FFy5V-|-F smst Vm--5sVt T-", ",,K;A:'K,57VGO;EEEOa>2OK9)1UE; VPKEE,'KK__K'KK'KKKKK'K_',_", "K';;_KE,KKKKE,KEEK,EKEEE OKKK-RL0;;E,;A ?PU;a", ";U;U;;UU;;;;;KEUW>< E__,K,K,',;_KKK,EKKK", "(O;KKK;;K,'EUEE;90H7Q55H5m5=V0T0HT5T=QHP=H5 TT=U;,,E__,_,K,'", ",KK,,,K',,KK,KKK,K,'',K',EE;T:559aUT99U 0P0X;"], "jumps": ["PK", "PU77OK", "PO", "P", "PKKKKKK", "PEEE", "PA"]}, {"id": "P2460", "text": ["2.  Connect CH1 probe to PC130-26 TP6.  This measures the                output voltage of the regulator.", "2. Connect CH1 probe to PC130-26 TP6. This measures the output voltage of the regulator."], "jumps": ["P2470", "P2450", "P2465"]}, {"id": "P2465", "text": ["OSCILLOSCOPE LEAD PLACEMENT - Place CH1 probe on TP6."], "jumps": []}, {"id": "P2470", "text": ["Notice that you are measuring approximately 7.4 V.  This is the unloaded output voltage.", "Notice that you are measuring approximately 7.4 V. This is the unloaded output voltage."], "jumps": ["P2480", "P2460"]}, {"id": "P2480", "text": ["3.  Place S1 on PC130-26 to IN.  The value of the load is now 200 W.        Notice the output voltage is still about 7.4 V.", "3. Place S1 on PC130-26 to IN. The value of the load is now 200 W. Notice the output voltage is still about 7.4 V.", "3. Place S1 on PC130-26 to IN. The value of the load is now 200 W. Notice the output voltage is still about 7.4 V......."], "jumps": ["P2490", "P2470", "P2485"]}, {"id": "P2482", "text": ["3.  Place S1 on PC130-26 to IN.  The value of the load is now 200 W.        Notice the output voltage is still about 7.4 V.", "3. Place S1 on PC130-26 to IN. The value of the load is now 200 W. Notice the output voltage is still about 7.4 V.", "3. Place S1 on PC130-26 to IN. The value of the load is now 200 W. Notice the output voltage is still about 7.4 V........"], "jumps": ["P2490", "P2470", "P2485"]}, {"id": "P2485", "text": ["MEASUREMENT SETUP - Place S1 IN (closed)."], "jumps": []}, {"id": "P2490", "text": ["4.  Place S1 to OUT and S2 to IN on PC130-26.  The value of the          load is now 300 W.  Notice that output hardly changed.", "4. Place S1 to OUT and S2 to IN on PC130-26. The value of the load is now 300 W. Notice that output hardly changed."], "jumps": ["P2500", "P2482", "P2495"]}, {"id": "P2492", "text": ["4.  Place S1 to OUT and S2 to IN on PC130-26.  The value of the          load is now 300 W.  Notice that output hardly changed.", "4. Place S1 to OUT and S2 to IN on PC130-26. The value of the load is now 300 W. Notice that output hardly changed."], "jumps": ["P2500", "P2482", "P2495"]}, {"id": "P2495", "text": ["MEASUREMENT SETUP - Place S1 out (open) and S2 IN (closed)."], "jumps": []}, {"id": "P2500", "text": ["5.  Place S1 to IN on PC130-26.  The value of the load is now                166.7 W.  Notice that the output voltage hardly changed.", "5. Place S1 to IN on PC130-26. The value of the load is now 166.7 W. Notice that the output voltage hardly changed."], "jumps": ["P2510", "P2492", "P2505"]}, {"id": "P2502", "text": ["5.  Place S1 to IN on PC130-26.  The value of the load is now                166.7 W.  Notice that the output voltage hardly changed.", "5. Place S1 to IN on PC130-26. The value of the load is now 166.7 W. Notice that the output voltage hardly changed."], "jumps": ["P2510", "P2492", "P2505"]}, {"id": "P2505", "text": ["MEASUREMENT SETUP - Place S1 IN (closed)."], "jumps": []}, {"id": "P2510", "text": ["6.  Remove the oscilloscope probes.  You have just verified the          normal operation of a voltage regulator under changing input        and output conditions.", "6. Remove the oscilloscope probes. You have just verified the normal operation of a voltage regulator under changing input and output conditions.."], "jumps": ["P2520", "P2502"]}, {"id": "P2520", "text": ["The last check for normal operation is to vary the regulated output voltage."], "jumps": ["P2530", "P2510"]}, {"id": "P2530", "text": ["1.  Connect a multimeter set to measure DC voltage to the output        test point on PC130-26 (TP6 to TP1).  \n2.  Vary PC130-26 R4 CW and CCW.  Notice that the output                   voltage varies from about 5.4 V to 11.4 V.", "1. Connect a multimeter set to measure DC voltage to the output test point on PC130-26 (TP6 to TP1). 2. Vary PC130-26 R4 CW and CCW. Notice that the output voltage varies from about 5.4 V to 11.4 V.."], "jumps": ["P2540", "P2520", "P2535"]}, {"id": "P2535", "text": ["MEASUREMENT SETUP - Place multimeter test leads on TP6 and TP1. Vary R4 CW and CCW."], "jumps": []}, {"id": "P2540", "text": ["3.  Move the multimeter test leads to measure the voltage on the          base of PC130-26 Q2 (TP4 to TP1)  \n4.  Vary PC130-26 R4 CW and CCW.  Notice that Q2's base                    voltage remains around 5.3 V, .6 V above Vz at 4.7 V.", "3. Move the multimeter test leads to measure the voltage on the base of PC130-26 Q2 (TP4 to TP1) 4. Vary PC130-26 R4 CW and CCW. Notice tha 40", "P2001"]}, {"id": "P13040", "text": ["In this experiment, you will use two PC cards.  One is a rectifier and the other is the variable voltage regulator.", "In this experiment, you will use two PC cards. One is a rectifier and the other is the variable voltage regulator."], "jumps": ["P13050", "P13020"]}, {"id": "P13050", "text": ["Pick up the PC130-23 card and compare it to the schematic shown.  This card is used as the rectifier and is placed in the PC1 position.", "Pick up the PC130-23 card and compare it to the schematic shown. This card is used as the rectifier and is placed in the PC1 position."], "jumps": ["P13060", "P13040"]}, {"id": "P13060", "text": ["Pick up the PC130-26 card. This card is used to demonstrate variable voltage regulator circuits and is placed in the PC2 position."], "jumps": ["P13070", "P13050"]}, {"id": "P13070", "text": ["Compare the card with the schematic shown."], "jumps": ["P13080", "P13060"]}, {"id": "P13080", "text": ["Notice Q1 on the card and schematic.  Q1 is a power transistor.", "Notice Q1 on the card and schematic. Q1 is a power transistor."], "jumps": ["P13090", "P13060"]}, {"id": "P13090", "text": ["Since the transistor is in series to the load, total current flows through Q1."], "jumps": ["P13100"]}, {"id": "P13100", "text": ["Q1 is large so that more heat can be dissipated.  Power transistors handle more current than regular transistors.", "Q1 is large so that more heat can be dissipated. Power transistors handle more current than regular transistors."], "jumps": ["P13110", "P13060"]}, {"id": "P13110", "text": ["D1 and Q2 set the output voltage.  Vz for the diode on the card is 4.7 V.", "D1 and Q2 set the output voltage. Vz for the diode on the card is 4.7 V."], "jumps": ["P13120", "P13060"]}, {"id": "P13120", "text": ["Notice that D1 and Q2 are small.  Remember, they are in the base circuit of Q1 where current flow is usually in the microamps.", "Notice that D1 and Q2 are small. Remember, they are in the base circuit of Q1 where current flow is usually in the microamps."], "jumps": ["P13130", "P13060"]}, {"id": "P13130", "text": ["Resistors R6, R7 and R8 along with switches S1 and S2 select the value of the load that is connected to the emitter of Q1."], "jumps": ["P13140", "P13060"]}, {"id": "P13140", "text": ["R3, R4 and R5 form a voltage divider that applies the base voltage to Q2."], "jumps": ["P13150", "P13060"]}, {"id": "P13150", "text": ["R2 feedbacks some of Vout to the cathode of D1.  This ensures that D1 is always operating in the breakdown region or above Vz.", "R2 feedbacks some of Vout to the cathode of D1. This ensures that D1 is always operating in the breakdown region or above Vz."], "jumps": ["P13160", "P13060"]}, {"id": "P13160", "text": ["C1 and C2 ensure that any small voltage variations from R4 and D1 are not felt on the output; they act as a filter.  Let's start the experiment.", "C1 and C2 ensure that any small voltage variations from R4 and D1 are not felt on the output; they act as a filter. Let's start the experiment."], "jumps": ["P13170", "P13060"]}, {"id": "P13170", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13060"]}, {"id": "P13180", "text": ["2.  Carefully plug PC130-23 into the Test Console PC1 position.", "2. Carefully plug PC130-23 into the Test Console PC1 position. Carefully plug PC130-25 into the Test Console PC2 position."], "jumps": []}, {"id": "P13182", "text": ["Ensure the two jumpers are placed vertically between the middle and bottom jumpers located in the upper left hand corner of the PC130-23 card. Jumpers on the PC130-23 card may not be available, if so, contact your instructor.", "Ensure the two jumpers are placed vertically between the middle and bottom jumpers located in the upper left hand corner of the PC130-23 card. Jumpers on the PC130-23 card may not be available, if so, contact your instructor.......................................", "Jumpers that have not been installed correctly on the PC130-23 card may cause damage to the board circuitry. Do not connect the oscilloscope ground to pins G or H......................."], "jumps": []}, {"id": "P13184", "text": ["3.  Carefully plug PC130-26 into the Test Console PC2 position.", "3. Carefully plug PC130-26 into the Test Console PC2 position.3. Carefully plug PC130-25 into the Test Console PC2 position."], "jumps": ["P13190"]}, {"id": "P13190", "text": ["4.  On PC130-23:  a.  Place S1 and S2 to IN.  \n                                  b.  Place S3 to the right.  \n                                  c.  Place S4, S5, and S6 to OUT.  \n     This sets up the rectifier for full wave and allows the output to       be connected to the PC130-26 card.", "4. On PC130-23: a. Place S1 and S2 to IN. b. Place S3 to the right. c. Place S4, S5, and S6 to OUT. This sets up the rectifier for full wave and allows the output to be connected to the PC130-26 card."], "jumps": ["P13200", "P13184", "P13195"]}, {"id": "P13195", "text": ["MEASUREMENT SETUP Carefully place S1 and S2 to IN. Carefully place S3 to RIGHT. Carefully place S4, S5 and S6 to OUT."], "jumps": []}, {"id": "P13200", "text": ["5.  On PC130-26 place S1 and S2 to OUT.  S1 and S2 OUT                      disconnect the load from the emitter of Q1.", "5. On PC130-26 place S1 and S2 to OUT. S1 and S2 OUT disconnect the load from the emitter of Q1."], "jumps": ["P13220", "P13190", "P13205"]}, {"id": "P13205", "text": ["MEASUREMENT SETUP - Carefully place S1 and S2 to OUT."], "jumps": []}, {"id": "P13220", "text": ["6.  Press Enter to Set: PC1 AC Power Switch - ON", "6. Press Enter to Set: PC1 AC Power Switch - ON..........................."], "jumps": []}, {"id": "P13230", "text": ["7. Using a multimeter, measure the DC voltage at PC130-26 TP2        with respect to ground (input to regulator card from the                   rectifier card).  \n    What is the measured voltage?", "7. Using a multimeter, measure the DC voltage at PC130-26 TP2 with respect to ground (input to regulator card from the rectifier card). What is the measured voltage???"], "jumps": ["P13232", "P13235"]}, {"id": "P13231", "text": [], "jumps": []}, {"id": "P13232", "text": ["Your voltage measurement is incorrect.  Ensure that you are using the multimeter correctly and that you are measuring TP2 on PC130-26.  Also, check that on PC130-23 switches S1 and S2 are IN, S3 is to the right, and S4, S5 and S6 are OUT.", "Your voltage measurement is incorrect. Ensure that you are using the multimeter correctly and that you are measuring TP2 on PC130-26. Also, check that on PC130-23 switches S1 and S2 are IN, S3 is to the right, and S4, S5 and S6 are OUT..."], "jumps": []}, {"id": "P13233", "text": ["Your measurement is still incorrect.  You should have measured approximately 20 VDC.  Make sure your set up is correct and you are measuring PC130-26 TP2.", "Your measurement is still incorrect. You should have measured approximately 20 VDC. Make sure your set up is correct and you are measuring PC130-26 TP2."], "jumps": ["PutVar"]}, {"id": "P13235", "text": ["MEASUREMENT SETUP - Place multimeter test lead on TP2."], "jumps": []}, {"id": "P13240", "text": ["The experiment is now set up.  Let's verify normal operation of a variable regulator circuit with an input voltage of 20 VDC.", "The experiment is now set up. Let's verify normal operation of a variable regulator circuit with an input voltage of 20 VDC."], "jumps": ["P13250", "P13230"]}, {"id": "P13250", "text": ["1.  Connect a multimeter across PC130-26 Q2, emitter to                         collector, TP3 and TP5. \n2.  Set the voltage to 3.3 V by adjusting PC130-26 R4.", "1. Connect a multimeter across PC130-26 Q2, emitter to collector, TP3 and TP5. 2. Set the voltage to 3.3 V by adjusting PC130-26 R4."], "jumps": ["P13260", "P13240", "P13255"]}, {"id": "P13255", "text": ["MEASUREMENT SETUP - Place multimeter test leads on TP3 and TP5. Adjust R4 to 3.3 V."], "jumps": []}, {"id": "P13260", "text": ["With Q2's Ece at 3.3 V and D1's Vz at 4.7 V, what is the expected voltage on the base of Q1?"], "jumps": ["P13250"]}, {"id": "P13261", "text": [], "jumps": []}, {"id": "P13262", "text": ["20 V is the applied voltage to the regulator.", "20 V is the applied voltage to the regulator..............."], "jumps": []}, {"id": "P13263", "text": ["The action of Q2 and D1 does not apply 0 V base bias.", "The action of Q2 and D1 does not apply 0 V base bias......."], "jumps": []}, {"id": "P13270", "text": ["3.  Using a multimeter, measure the base voltage of Q1, PC130-26      TP3, with respect to ground.  \n     What is the measured voltage?", "3. Using a multimeter, measure the base voltage of Q1, PC130-26 TP3, with respect to ground. What is the measured voltage?"], "jumps": ["P13260", "P13272", "P13275"]}, {"id": "P13271", "text": [], "jumps": []}, {"id": "P13272", "text": ["Your voltage measurement is incorrect.  Ensure that you are measuring PC130-26 TP3 and that your multimeter is set to measure DC voltages.", "Your voltage measurement is incorrect. Ensure that you are measuring PC130-26 TP3 and that your multimeter is set to measure DC voltages."], "jumps": []}, {"id": "P13273", "text": ["Your voltage measurement is still incorrect.  You should have measured approximately 8 V.", "Your voltage measurement is still incorrect. You should have measured approximately 8 V."], "jumps": ["PutVar"]}, {"id": "P13275", "text": ["MEASUREMENT SETUP - Place multimeter test lead on TP3."], "jumps": []}, {"id": "P13280", "text": ["With approximately 8 V on the base of Q1, the output voltage (Ee) should be approximately 7.4 V."], "jumps": ["P13290", "P13270"]}, {"id": "P13290", "text": ["4.  Using a multimeter, measure the output voltage of Q1 at\n      PC130-26 TP6 with respect to ground.  \n      What is the measured voltage?", "4. Using a multimeter, measure the output voltage of Q1 at PC130-26 TP6 with respect to ground. What is the measured voltage???"], "jumps": ["P13280", "P13292", "P13295"]}, {"id": "P13291", "text": [], "jumps": []}, {"id": "P13292", "text": ["Your voltage measurement is incorrect.  Ensure that you are measuring PC130-26 TP6 and that your multimeter is set to measure DC voltage.", "Your voltage measurement is incorrect. Ensure that you are measuring PC130-26 TP6 and that your multimeter is set to measure DC voltage."], "jumps": []}, {"id": "P13293", "text": ["Your voltage measurement is still incorrect. You should have measured approximately 7.4 V \u00b110%.", "Your voltage measurement is still incorrect. You should have measured approximately 7.4 V"], "jumps": ["PutVar"]}, {"id": "P13295", "text": ["MEASUREMENT SETUP - Place multimeter test lead on TP6."], "jumps": []}, {"id": "P13300", "text": ["The voltage regulator is operating normally when the input voltage or the output current is not changing.  Now, let's vary the input and output levels and see if the regulator is operating normally under changing conditions.", "The voltage regulator is operating normally when the input voltage or the output current is not changing. Now, let's vary the input and output levels and see if the regulator is operating normally under changing conditions..."], "jumps": ["P13310", "P13290"]}, {"id": "P13310", "text": ["First we will vary the input voltage.  This is accomplished by actually turning the power OFF to the rectifier.", "First we will vary the input voltage. This is accomplished by actually turning the power OFF to the rectifier."], "jumps": ["P13320", "P13300"]}, {"id": "P13320", "text": ["Due to the large value of C3, the DC output voltage will not drop to 0 V immediately after turning power OFF."], "jumps": ["P13330", "P13310"]}, {"id": "P13330", "text": ["The DC output voltage gradually decreases from 20 V.  This allows you to observe the action of the regulator card.", "The DC output voltage gradually decreases from 20 V. This allows you to observe the action of the regulator card."], "jumps": ["P13340", "P13310"]}, {"id": "P13340", "text": ["1.  Set up the oscilloscope for dual display of DC signals.", "1. Set up the oscilloscope for dual display of DC signals.", "Trigger Coupling - DC Trigger Source - CH1 Trigger Slope - + DC/GND/AC - DC Volt/DIV - 5 Display - DUAL"], "jumps": ["P13350", "P13310", "P13345"]}, {"id": "P13345", "text": ["MEASUREMENT SETUP Trigger Slope - + CH1,CH2 Volts/Div - 5 Trigger Coupling - DC CH1,CH2 AC/GND/DC - DC Trigger Source - CH1 Display Mode - Dual", "K, HK_,,_K,_K'',EK,,,,,'_,KEKZ;;XK98JO9[N=9N@N99U,,K,,EK", "'_K_'K'',K' QUK_,''KK}0;KK,KK__',K'K_K''KK'K_", "'_K_'KK',K_,,'_'',K,K', F;__KK,K, TK,,__,''KKK'", ",KK,,E:9 POOHPPP=70=07PUHP^UOOU=YOVP=PPPPOOPXOOOOXH9UO95P0P===TXZOOU1NIIPPPHPVGH5PSOPZXXOK;E", "a5T 55:s5 m5 ts55Tt T--|57s- Fss y 5 -VVFs5m--FFFmm5FFs---t-t t-| -s-ymV sGFt--ss5-", "7mty-5m--F-s- mVs t --FFy5V-|-F smst Vm--5sVt T-", ",,K;A:'K,57VGO;EEEOa>2OK9)1UE; VPKEE,'KK__K'KK'KKKKK'K_',_", "K';;_KE,KKKKE,KEEK,EKEEE OKKK-RL0;;E,;A ?PU;a", ";U;U;;UU;;;;;KEUW>< E__,K,K,',;_KKK,EKKK", "(O;KKK;;K,'EUEE;90H7Q55H5m5=V0T0HT5T=QHP=H5 TT=U;,,E__,_,K,'", ",KK,,,K',,KK,KKK,K,'',K',EE;T:559aUT99U 0P0X;"], "jumps": ["PK", "PU77OK", "PO", "P", "PKKKKKK", "PEEE", "PA"]}, {"id": "P13350", "text": ["2.  Place the CH1 trace on the second horizontal line from the              top.  \n3.  Place the CH2 trace on the bottom horizontal line.", "2. Place the CH1 trace on the second horizontal line from the top. 3. Place the CH2 trace on the bottom horizontal line.", "'}:5 t0H( 9E}A9As5/GA}A;aEAA}EAKE;AAaAE;A}AEAU;aA};aEAEA;EAAAEA;E;AaA", "EUaa 555G7EEEa::Ts1TA;;AA;EEA;AAa9:AAE;E;;;UaAA;AEEA;aA};AA9aAA}}};E;AA9E}9AA;}AAEaaA;AEAEaAAEEaAAA9EEAAA}EAE;aEEEAU;EE;Ea;}", "EK,,L17;UT9;EK;,=17=9EK;AaTs a7(aEAEas5:9<5", "mzF(tt-FsFF-cmzssttst|t--yTmVstys|tytts sm t syst", ";EaTTy55F }Aaas= yjm;AEEAA T_}zc(GGFGVVVccVcVVlllGLVs-FFccclFm--jz5(-VFzmmm(ctmmlmzzzFFFFFzmmmctmFmsmmtcVmt5mzzl-zFmmFmtz", "KT[Qa ess Enter to Set: PC1 AC Power Switch - OFF Observe the input and output voltages on the oscilloscope."], "jumps": ["P13380"]}, {"id": "P13400", "text": ["Notice that the output voltage stayed constant when the input voltage decreased.  Only after the voltage on the cathode of D1 fell below 4.7 V did the output voltage decrease.", "Notice that the output voltage stayed constant when the input voltage decreased. Only after the voltage on the cathode of D1 fell below 4.7 V did the output voltage decrease."], "jumps": ["P13410"]}, {"id": "P13410", "text": ["Also notice that even a long time after power has been turned off, there is still voltage applied to TP2 from the rectifier card."], "jumps": ["P13420", "P13400"]}, {"id": "P13420", "text": ["This is due to the size of C3 on PC130-23.  It takes a long time for C3 to discharge.", "This is due to the size of C3 on PC130-23. It takes a long time for C3 to discharge."], "jumps": ["P13430", "P13410"]}, {"id": "P13430", "text": ["Power supply filter capacitors may retain a charge long after power is removed from the circuit, especially high voltage power supplies.  The power supply for a TV picture tube is a good example.", "Power supply filter capacitors may retain a charge long after power is removed from the circuit, especially high voltage power supplies. The power supply for a TV picture tube is a good example..example."], "jumps": ["P13440", "P13420"]}, {"id": "P13440", "text": ["7.  Press Enter to Set: PC1 AC Power Switch - ON  \n     Now, let's vary the output current.  This is accomplished by            switching in different size load resistors on PC130-26.", "7. Press Enter to Set: PC1 AC Power Switch - ON Now, let's vary the output current. This is accomplished by switching in different size load resistors on PC130-26."], "jumps": ["P13430"]}, {"id": "P13450", "text": ["1.  Set up the oscilloscope for CH1 display of DC signals.", "1. Set up the oscilloscope for CH1 display of DC signals..", "Trigger Coupling - DC Trigger Source - CH1 Trigger Slope - + DC/GND/AC - DC Volt/Div - 5 Display - CH1 Zero the trace"], "jumps": ["P13460", "P13455"]}, {"id": "P13455", "text": ["MEASUREMENT SETUP Trigger Slope - + CH1 Volts/Div - 5 Trigger Coupling - DC CH1 AC/GND/DC - DC Trigger Source - CH1 Display Mode - CH1", "K, HK_,,_K,_K'',EK,,,,,'_,KEKZ;;XK98JO9[N=9N@N99U,,K,,EK", "'_K_'K'',K' QUK_,''KK}0;KK,KK__',K'K_K''KK'K_", "'_K_'KK',K_,,'_'',K,K', F;__KK,K, TK,,__,''KKK'", ",KK,,E:9 POOHPPP=70=07PUHP^UOOU=YOVP=PPPPOOPXOOOOXH9UO95P0P===TXZOOU1NIIPPPHPVGH5PSOPZXXOK;E", "a5T 55:s5 m5 ts55Tt T--|57s- Fss y 5 -VVFs5m--FFFmm5FFs---t-t t-| -s-ymV sGFt--ss5-", "7mty-5m--F-s- mVs t --FFy5V-|-F smst Vm--5sVt T-", ",,K;A:'K,57VGO;EEEOa>2OK9)1UE; VPKEE,'KK__K'KK'KKKKK'K_',_", "K';;_KE,KKKKE,KEEK,EKEEE OKKK-RL0;;E,;A ?PU;a", ";U;U;;UU;;;;;KEUW>< E__,K,K,',;_KKK,EKKK", "(O;KKK;;K,'EUEE;90H7Q55H5m5=V0T0HT5T=QHP=H5 TT=U;,,E__,_,K,'", ",KK,,,K',,KK,KKK,K,'',K',EE;T:559aUT99U 0P0X;"], "jumps": ["PK", "PU77OK", "PO", "P", "PKKKKKK", "PEEE", "PA"]}, {"id": "P13460", "text": ["2.  Connect CH1 probe to PC130-26 TP6.  This measures the                output voltage of the regulator.", "2. Connect CH1 probe to PC130-26 TP6. This measures the output voltage of the regulator."], "jumps": ["P13470", "P13450", "P13465"]}, {"id": "P13465", "text": ["OSCILLOSCOPE LEAD PLACEMENT - Place CH1 probe on TP6."], "jumps": []}, {"id": "P13470", "text": ["Notice that you are measuring approximately 7.4 V.  This is the unloaded output voltage.", "Notice that you are measuring approximately 7.4 V. This is the unloaded output voltage."], "jumps": ["P13480", "P13460"]}, {"id": "P13480", "text": ["3. Place S1 on PC130-26 to IN. The value of the load is now 200 W. Notice the output voltage is still about 7.4 V.V..4 V."], "jumps": ["P13490", "P13470", "P13485"]}, {"id": "P13482", "text": ["3. Place S1 on PC130-26 to IN. The value of the load is now 200 W. Notice the output voltage is still about 7.4 V..7.4 V..."], "jumps": ["P13490", "P13470", "P13485"]}, {"id": "P13485", "text": ["MEASUREMENT SETUP - Place S1 IN (closed)."], "jumps": []}, {"id": "P13490", "text": ["4.  Place S1 to OUT and S2 to IN on PC130-26.  The value of the           load is now 300 W.  Notice that output hardly changed.", "4. Place S1 to OUT and S2 to IN on PC130-26. The value of the load is now 300 W. Notice that output hardly changed."], "jumps": ["P13500", "P13482", "P13495"]}, {"id": "P13492", "text": ["4.  Place S1 to OUT and S2 to IN on PC130-26.  The value of the           load is now 300 W.  Notice that output hardly changed.", "4. Place S1 to OUT and S2 to IN on PC130-26. The value of the load is now 300 W. Notice that output hardly changed."], "jumps": ["P13500", "P13482", "P13495"]}, {"id": "P13495", "text": ["MEASUREMENT SETUP - Place S1 out (open) and S2 IN (closed)."], "jumps": []}, {"id": "P13500", "text": ["5.  Place S1 to IN on PC130-26.  The value of the load is now                166.7 W.  Notice that the output voltage hardly changed.", "5. Place S1 to IN on PC130-26. The value of the load is now 166.7 W. Notice that the output voltage hardly changed."], "jumps": ["P13510", "P13492", "P13505"]}, {"id": "P13502", "text": ["5.  Place S1 to IN on PC130-26.  The value of the load is now                166.7 W.  Notice that the output voltage hardly changed.", "5. Place S1 to IN on PC130-26. The value of the load is now 166.7 W. Notice that the output voltage hardly changed.."], "jumps": ["P13510", "P13492", "P13505"]}, {"id": "P13505", "text": ["MEASUREMENT SETUP - Place S1 IN (closed)."], "jumps": []}, {"id": "P13510", "text": ["6.  Remove the oscilloscope probes. You have just verified the           normal operation of a voltage regulator under changing input        and output conditions.", "6. Remove the oscilloscope probes. You have just verified the normal operation of a voltage regulator under changing input and output conditions.."], "jumps": ["P13520", "P13502"]}, {"id": "P13520", "text": ["The last check for normal operation is to vary the regulated output voltage."], "jumps": ["P13530", "P13510"]}, {"id": "P13530", "text": ["1.  Connect a multimeter set to measure DC voltage to the output        test point on PC130-26 (TP6 to TP1).  \n2.  Vary PC130-26 R4 CW and CCW.  Notice that the output                   voltage varies from about 5.4 V to 11.4 V.", "1. Connect a multimeter set to measure DC voltage to the output test point on PC130-26 (TP6 to TP1). 2. Vary PC130-26 R4 CW and CCW. Notice that the output voltage varies from about 5.4 V to 11.4 V..."], "jumps": ["P13540", "P13520", "P13535"]}, {"id": "P13535", "text": ["MEASUREMENT SETUP - Place multimeter test leads on TP6 and TP1. Vary R4 CW and CCW."], "jumps": []}, {"id": "P13540", "text": ["3.  Move the multimeter test leads to measure the voltage on the          base of PC130-26 Q2 (TP4 to TP1)  \n4.  Vary PC130-26 R4 CW and CCW.  Notice that Q2's base                    voltage remains around 5.3 V, .6 V above Vz at 4.7 V.", "3. Move the multimeter test leads to measure the voltage on the base of PC130-26 Q2 (TP4 to TP1) 4. Vary PC130-26 R4 CW and CCW. Notice that Q2's base voltage remains around 5.3 V, .6 V above Vz at 4.7 V..."], "jumps": ["P13550", "P13530", "P13545"]}, {"id": "P13545", "text": ["MEASUREMENT SETUP - Place multimeter test leads on TP4 and TP1. Vary R4 CW and CCW."], "jumps": []}, {"id": "P13550", "text": ["The action of the circuit keeps Q2's base voltage at 5.3 V, but changes the base current when R4 is varied."], "jumps": ["P13560", "P13540"]}, {"id": "P13560", "text": ["5.  Move the multimeter test leads to measure across the                        collector and emitter of PC130-26 Q2 (TP3 to TP5).  \n6.  Vary PC130-26 R4 CW and CCW.  Notice that the voltage                  across Q2 varies from about 1.7 V to 7.3 V.", "5. Move the multimeter test leads to measure across the collector and emitter of PC130-26 Q2 (TP3 to TP5). 6. Vary PC130-26 R4 CW and CCW. Notice that the let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
