<script>
const book = {"title": "9395T314", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: TROUBLESHOOTING AC MOTORSsd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": ["# #\" #& \"\"# &\"###2' &2#&.22&# 25--283-.#285255232/238882-.-5:38832222882282-213:22::82-22225:8-33-22282232.22258558.5822385:235:222283538::2585582::2:", "&&#&# #/2.#.& -8 \"#.-&23..22'/.#212&-2258\"588:52", "### ## /# #/&# \" \"/##\"#/&//..#/..&/28.&...&824/&.88-8588..2222858852.28:582228588358282228258.888:825:583.8828::8228828588828583:35558.555.85::88::85588:88:5555::38::85:::5:5:52::85::88::", ":85:855::83:5:5.5:55:855:52.5:5283822242348522...252...2..82/.4..22//2./..##/.8.#&./#&/..##// ##\",##/## #. / /& # ## ## ## ## ## \" #/# ## /# ## #.\" ./ #//###,//.&/#.\"#/.##/./#&/2.&/.../&//....//&2222.2/252.&28.8522582.824828828::255:::5:", "/,,,,,,,,,,,,,/, ,, ,,,,,,6, ,,,6,,, ,,,,,//6//6,,,,/6/,,,/,4/,,/6/4494,,494/6846446/4884664;44;889448489888<8648<<8;44;88988<88948;98<44<;:<44<<8;44<48<<8;48<48<88;48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["1. Troubleshooting AC Motorsr objective 1 line item 2 here. item 2 here.e.e.", "w Describe safety issues related to motor troubleshooting. w Describe routine maintenance on motors. w Describe a visual check of a motor. w Describe an operational check and a performance test."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["The purpose of this lesson is to examine the troubleshooting processes of AC motors. This lesson presents a logical method for determining the common problems that occur in AC motors."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Troubleshooting the AC motor is a relatively simple task to perform. AC motors are the most popular motor in household and industrial use."], "jumps": []}, {"id": "P420", "text": ["AC motors are much more popular than DC motors due to their simplicity and ready availability of AC power."], "jumps": []}, {"id": "P430", "text": ["AC motors are also more reliable than DC motors. The costly commutator, armature, and brush assembly in the DC motor are replaced with the simple squirrel cage rotor in the AC motor."], "jumps": []}, {"id": "P440", "text": ["Let s begin the lesson on TROUBLESHOOTING AC MOTORS......................."], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": ["P440"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Prior to troubleshooting, all available information regarding the motor should be reviewed. This information is an aid to troubleshooting any AC motor."], "jumps": ["P1001"]}, {"id": "P1030", "text": ["The best location for information is the equipment history record. This is a record of all maintenance (preventive and repair) performed on a device and aids in quickly troubleshooting reoccurring problems...."], "jumps": []}, {"id": "P1040", "text": ["Another location for information regarding a specific motor is the nameplate that is mounted to the motor. The National Electric Code (NEC) requires that all motors contain a nameplate."], "jumps": []}, {"id": "P1050", "text": ["In this lesson, an explanation on safety and routine maintenance are presented followed by the troubleshooting procedures. Safety precautions must always be observed when working around electrical equipment to avoid personnel injury and equipment damage...", "========================================= %======================================================", ">>> ========================================", "@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@9==== >>>", "@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@9==== >>>", "@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@9==== >>>", "@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@9==== >>>"], "jumps": []}, {"id": "P1060", "text": ["Always de-energize and tag out the circuit prior to performing any maintenance on electrical wiring, motors or loads. When multiple circuits are used, all circuits need to be de-energized and tagged..."], "jumps": []}, {"id": "P1070", "text": ["This is normally accomplished by setting a circuit breaker or fuse panel to the OFF position. Tagging out a circuit is the placing of a locking device and/or tag to the circuit breaker or fuse panel to prevent the accidental energizing of the circuit..."], "jumps": []}, {"id": "P1080", "text": ["Additional precautions are required when working around or near rotating machinery. When working on motors, several distinctive safety concerns require attention. Loose clothing needs to be taped or removed to prevent the inadvertent wrapping of the clothing around the motor shaft or load..."], "jumps": []}, {"id": "P1090", "text": ["Gloves should be worn when disassembling motors because there are many sharp corners, jagged edges, and heavy parts that will cause injury to the hands. To reduce this type of injury a heavy glove such as canvas gloves are recommended..."], "jumps": []}, {"id": "P1110", "text": ["If the motor uses a capacitor, it needs to be discharged (short the leads) prior to testing or removal."], "jumps": []}, {"id": "P1120", "text": ["What should be done to ensure safety when troubleshooting AC motors?"], "jumps": ["P1110"]}, {"id": "P1121", "text": [], "jumps": []}, {"id": "P1122", "text": ["De-energizing and tagging the circuit(s) is only one of the safety measures that should be taken when troubleshooting AC motors......"], "jumps": []}, {"id": "P1123", "text": ["Preventing loose clothing and wearing gloves is only one of the the safety measures that should be taken when troubleshooting AC motors.."], "jumps": []}, {"id": "P1130", "text": ["Routine maintenance is based on a schedule such as weekly, monthly, yearly, etc. This type of maintenance includes inspections and specific tasks to perform."], "jumps": ["P1120"]}, {"id": "P1140", "text": ["The frequency and thoroughness of routine maintenance on each motor may be different. This difference is based on:e production scheme (impact of production if the motor fails), daily operating requirements, nature of service, and environment...", "w Production scheme (impact of production if the motor fails). w Daily operating requirements. w Nature of service and environment. Clean exposed shaft from grease and oil. w Check that motor obtains operating speed in normal time. eed in normal time."], "jumps": []}, {"id": "P1150", "text": ["The environment plays an important role in the maintenance and operation of a motor. A motor placed in a hot and humid environment will require more inspections and maintenance than a similar motor placed in a cool dry area.a.", "<<<<((((((( ( 0000000000202000000 (((<", "<<<<<((((((((( 00000022J2=J=J=J=J=JJ22000 (", "<<<<(((((( ( 00000002022JJ=J=====>>>>>", "( 00020222222222222222J22J22J22222222222222222222JJJJJJ=JJJ2=JJ=JJ=J=J=J==J==J=J=J=J==J=J=JJJ22222", "0 0000000000000000000000000000000000000000000000", "((( ( ((((((((((( ( ( (((( (((((((((((<<<<"], "jumps": []}, {"id": "P1160", "text": ["A simple maintenance schedule is shown for Weekly..........", "w Check bearing oil levels. w Examine starter switch, fuses, and other controls. w Inspect and tighten connections. w Clean exposed shaft of grease and oil. w Check that motor obtains operating speed in normal time."], "jumps": []}, {"id": "P1170", "text": ["A simple maintenance schedule is shown for Semi-Annually...", "w Clean motor thoroughly. w Drain, wash out, and replace oil in sleeve bearings. w Check grease in ball or roller bearings. w Check operating speed(s). w Check shaft endplay. w Check input current and compare with normal values. w Check covers, bolts, pulleys, gears, screws, and keys for security. w If the motor has brushes, blow dirt from windings, clean and inspect the commutator and brushes."], "jumps": []}, {"id": "P1180", "text": ["A simple maintenance schedule is shown for Yearly..........", "w Clean ball of roller bearing housings and renew grease. w Test insulation using a megohmmeter (Megger). w Check air gap. Check operating speed(s). w Check shaft endplay. w Check input current and compare with normal values. w Check covers, bolts, pulleys, gears, screws, and keys for security. w If the motor has brushes, blow dirt from windings, clean and inspect the commutator and brushes."], "jumps": []}, {"id": "P1200", "text": ["What factor plays an important part of scheduling AC motor maintenance?"], "jumps": ["P1180"]}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1202", "text": ["This is not an important factor in scheduling maintenance.."], "jumps": []}, {"id": "P1210", "text": ["Troubleshooting AC motors is a relatively simple process. The process is broken down into three stages:", "(1) Visual Inspection (2) Operational Check (3) Performance Test tion using a megohmmeter (Megger). w Check air gap. Check operating speed(s). w Check shaft endplay. w Check input current and compare with normal values. w Check covers, bolts, pulleys, gears, screws, and keys for security. w If the motor has brushes, blow dirt from windings, clean and inspect the commutator and brushes."], "jumps": []}, {"id": "P1220", "text": ["The visual inspection is used to locate the most obvious discrepancies such as a broken or disconnected wire."], "jumps": []}, {"id": "P1230", "text": ["The operational check goes one stage further and allows the technician to verify the proper operation and to detect possible malfunctions."], "jumps": []}, {"id": "P1240", "text": ["The performance test is the final stage and allows the technician to locate the most difficult and hidden problems with the motor."], "jumps": []}, {"id": "P1250", "text": ["What should be done first before troubleshooting an AC motor?"], "jumps": ["P1240"]}, {"id": "P1251", "text": [], "jumps": []}, {"id": "P1252", "text": ["This is not the first step................................."], "jumps": []}, {"id": "P1260", "text": ["When an AC motor fails to perform properly, the first troubleshooting action to take is a visual inspection. This inspection will reveal many of the problems attributing to the failure. The visual inspection is used to notice obvious physical damage..."], "jumps": []}, {"id": "P1270", "text": ["Cleaning is the next step in the visual inspection process. Dirt, grease, oil and other contaminants are removed from the motor's surfaces. At this point, check for proper ventilation of the motor and surrounding areas..."], "jumps": ["Pu", "P"]}, {"id": "P1280", "text": ["Clean all ventilation ports on the motor and verify that the motor is provided adequate ambient ventilation."], "jumps": []}, {"id": "P1290", "text": ["Check for burned, cracked, or unserviceable insulation on wiring. Inspect for cracks or warping on both of the end bells (shields) and that they are mated properly to the frame."], "jumps": []}, {"id": "P1300", "text": ["If the motor has any external capacitors such as a starting capacitor or run capacitors, they need to be checked. Defective capacitors are a leading cause of malfunctions in capacitor start motors..."], "jumps": []}, {"id": "P1310", "text": ["The capacitors may be opened or shorted. A \"shorted\" capacitor results in a lower starting torque, blown input fuses, or burns out the start winding."], "jumps": []}, {"id": "P1320", "text": ["An \"opened\" capacitor results in the start windings to be opened, resulting in the failure of the motor to start. Remember, it needs to be discharged (short the leads) prior to testing or removal..."], "jumps": []}, {"id": "P1330", "text": ["Remove the load from the motor and turn the rotor by hand. Ensure the rotor turns freely and there is no endplay of the rotor or any other looseness of the bearings. Excessive endplay will wear the bearings and may cause damage to the rotor...", "J&&&&J JZZZ&Z&&&&&&ZZZZZZZZ&&&&&&&&&&&&&&&", "ZJyJJ&&&&& ZZZ&&&&&Z&&&ZZZZZZZZ&&&&&&&&&&&&&&&", "&JJJJJJJJZZZ&ZJJZZ&&JJJ Z Z &&&&&&&&&&&&", "&JJJJJEJJJJJZJJJZJJ J JJJZZZZZ &&&&&&&&&& &", "yCC&JJJEEEE EEJZJJJJJJ EEJ JEJJJZ ZZZZZ&&& J&ZZZZZ J E &E", "M&&&&M M]]]&]&&&&&&]]]]]]]]&&&&&&&&&&&&&&&", "&MMMMMMMM]]]&]]M]]]]]]]]]]] ]&&&&&&&&&&&", "&MMMMMEMMMMM]M]]MMM M MM]]]]]] &&&&&&&&&& &"], "jumps": []}, {"id": "P1340", "text": ["If the rotor is binding, the motor usually requires disassembly. Prior to disassembly and if possible, check for obstructions around the rotor that can easily be removed. Remember that the windings are easily damaged, so do not force any objects near the windings..."], "jumps": []}, {"id": "P1350", "text": ["If the motor requires disassembly, check for seizing bearings, bent rotor shaft, end bell alignment, loose pole pieces, broken cooling fin pieces, or any foreign objects inside the motor during disassembly..."], "jumps": []}, {"id": "P1360", "text": ["The air gap between the stator and rotor should be checked if accessible with the end caps and bearings in place. The air gap can show binding between the stator and rotor, bearing wear, or misalignment..."], "jumps": []}, {"id": "P1370", "text": ["The air gap measurements should be taken at four equally spaced points around the rotor and should be within 5% of each other.."], "jumps": []}, {"id": "P1380", "text": ["If the capacitor is good and there is no noticeable physical motor damage, excessive endplay, or binding, an operational check needs to be performed."], "jumps": []}, {"id": "P1390", "text": ["While visually inspecting an AC motor, what safety procedure should be performed?"], "jumps": ["P1380"]}, {"id": "P1391", "text": [], "jumps": []}, {"id": "P1392", "text": ["This is not really a safety concern........................"], "jumps": []}, {"id": "P1400", "text": ["During disassembly, which part of the motor is most fragile and easily damaged?"], "jumps": []}, {"id": "P1401", "text": [], "jumps": []}, {"id": "P1403", "text": ["AC motor rotor windings, if they are part of the motor, are less susceptible to damage than stator windings..."], "jumps": []}, {"id": "P1404", "text": ["Care should be taken when handling bearings, but this is not the most fragile part of the motor."], "jumps": []}, {"id": "P1410", "text": ["When the visual inspection does not reveal a specific malfunction, an operational check is performed. An operational check is used to verify whether the device is operating properly and to detect possible malfunctions..."], "jumps": ["P1400"]}, {"id": "P1420", "text": ["The motor needs to be loaded properly prior to performing any operational check."], "jumps": []}, {"id": "P1430", "text": ["Information on the specific motor is needed for the checkout procedure. The nameplate is a good source for this information. The nameplate data should always be verified against the operational characteristics of the motor such as voltage, current, and frequency..."], "jumps": []}, {"id": "P1440", "text": ["Operating a motor beyond the rated nameplate values are often found to cause poor performance. The National Electric Code requires all motors: to display specific nameplate data."], "jumps": []}, {"id": "P1450", "text": ["Since the motor is often positioned so that it is difficult to refer to the nameplate when performing maintenance on the motor, the technician should record the information."], "jumps": []}, {"id": "P1460", "text": ["Prior to applying power to the motor, make sure that the motor is connected to a proper load. Ensure the motor switches are off. Remove any locks or tags on the fuse panels or circuit breakers if used and energize the circuit..."], "jumps": []}, {"id": "P1470", "text": ["Review the safety precautions and operating procedures for the motor and load before starting the motor."], "jumps": []}, {"id": "P1480", "text": ["Start the motor and observe the indications. Common indications consist of the following:", "(1) Failure to Start (2) Runs Slowly (3) Vibrates (4) Overheatss on using a megohmmeter (Megger). w Check air gap. Check operating speed(s). w Check shaft endplay. w Check input current and compare with normal values. w Check covers, bolts, pulleys, gears, screws, and keys for security. w If the motor has brushes, blow dirt from windings, clean and inspect the commutator and brushes."], "jumps": []}, {"id": "P1490", "text": ["If the motor fails to start or runs slowly, check the load for binding or if it exceeds the rated load or horsepower of the motor. If the load is appropriate for the motor rating and not binding, then check the input voltages..."], "jumps": []}, {"id": "P1500", "text": ["The mechanical problems of the motor have already been ruled out, such as frozen bearings, damaged shaft or binding load therefore, the problem must be electrical."], "jumps": []}, {"id": "P1510", "text": ["If the input voltages are not present, low or otherwise incorrect, the problem is with the motor controller, fuses, or circuit breakers."], "jumps": []}, {"id": "P1520", "text": ["If the input voltages are correct, then the problem is within the motor and diagnostic tests are required. The most likely cause is an open or shorted winding."], "jumps": []}, {"id": "P1530", "text": ["Which of the following can cause a failure to start problem?"], "jumps": ["P1520"]}, {"id": "P1531", "text": [], "jumps": []}, {"id": "P1532", "text": ["This is only one of the potential causes listed. --......."], "jumps": []}, {"id": "P1540", "text": ["If vibration is noticed, check the load for intermittent binding."], "jumps": ["P1530"]}, {"id": "P1550", "text": ["If the load does not show any signs of intermittent binding, then make sure that the bearings are properly lubricated."], "jumps": []}, {"id": "P1560", "text": ["If the bearings are lubricated, the problem is within the motor and diagnostic tests need to be performed. The most likely causes include an open or shorted winding, or a worn out bearing."], "jumps": []}, {"id": "P1570", "text": ["When a motor overheats, severe damage to the windings can result. An overheating motor has many possible causes."], "jumps": []}, {"id": "P1580", "text": ["The major causes of overheating include inadequate ventilation, binding, low input voltage, or an excessive load."], "jumps": []}, {"id": "P1590", "text": ["If inadequate ventilation, binding, or low input voltage problems are not found, and the load cannot be decreased, a more powerful motor is required."], "jumps": []}, {"id": "P1600", "text": ["Another cause of overheating is the loss of a phase in a three-phase system. If the input voltages have been verified as being good, then the phase loss is internal and diagnostic tests need to be performed..."], "jumps": []}, {"id": "P1610", "text": ["An overloaded motor will most likely display which symptom?"], "jumps": []}, {"id": "P1611", "text": [], "jumps": []}, {"id": "P1612", "text": ["Slow running could be a symptom of overload but is not the most likely symptom. ---"], "jumps": []}, {"id": "P1613", "text": ["Vibration is usually not a symptom of an overloaded motor. --"], "jumps": []}, {"id": "P1614", "text": ["Failure to start could be a symptom of overload but is not the most likely symptom. --"], "jumps": []}, {"id": "P1620", "text": ["The performance tests are explained next. These tests include the stator windings test, rotor windings test, insulation resistance test, balance test, and bearings.ings."], "jumps": []}, {"id": "P1630", "text": ["Stator winding failures are a common problem in AC motors. They can be opened, shorted, or grounded. The stator windings can be easily tested using an ohmmeter and normally do not require the motor to be disassembled..."], "jumps": []}, {"id": "P1640", "text": ["A grounded stator is found by performing a resistance check between the stator coils and ground. A multimeter set to measure resistance is used to perform this measurement."], "jumps": []}, {"id": "P1650", "text": ["A shorted stator is found by performing a resistance comparison check between the sets of coils. Use the lowest resistance setting since the normal resistance of the stator windings is normally a low value..."], "jumps": []}, {"id": "P1660", "text": ["Ideally, each stator winding test will result in identical readings. But, in normal use the resistance of the stator windings will vary slightly."], "jumps": []}, {"id": "P1670", "text": ["This resistance test will show if any of the stator windings are shorted due to damaged insulation. Damaged insulation is normally caused by a foreign object striking the stator windings or overheating..."], "jumps": []}, {"id": "P1680", "text": ["An open stator winding is usually caused by vibration, severe overheating, or a foreign object striking the winding. It is very difficult for an AC motor to start with an open stator winding."], "jumps": []}, {"id": "P1690", "text": ["Normally when an AC motor fails to start and the load is not a factor, an open stator winding is found. If a winding opens while the motor is running, the other windings must compensate and the motor will normally overheat and destroy itself..."], "jumps": []}, {"id": "P1700", "text": ["If the stator winding is good, then perform the insulation resistance test. If the motor contains a wound rotor, perform the rotor windings test first."], "jumps": []}, {"id": "P1710", "text": ["For motors that have windings on the rotor, similar resistance tests for the stator windings are performed. Resistance checks for grounded rotor windings should be performed using the rotor shaft as ground..."], "jumps": []}, {"id": "P1720", "text": ["An open stator winding will usually cause which of the following symptoms?"], "jumps": ["P1710"]}, {"id": "P1721", "text": [], "jumps": []}, {"id": "P1722", "text": ["Slow running could be a symptom of an open stator winding possibly if the motor were unloaded but it is not the most likely symptom under normal circumstances. ---"], "jumps": []}, {"id": "P1723", "text": ["Vibration is not a symptom of an open stator winding. -...."], "jumps": []}, {"id": "P1724", "text": ["Overheating is not a symptom of an open stator winding. --"], "jumps": []}, {"id": "P1730", "text": ["Deterioration of insulation is caused by heat, moisture, dirt, chemical fumes and iron particles. Severe deterioration can be detected by sight or smell, but it is sometimes necessary to use a more accurate form of measurement...", "^ ^ ? ???? ??????????%?%????%%%%%%%%%%%%%%%%%%%%%", "<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<?? ??????????????????????????????????????????%?%?%?%%%%", "< < < <^<^ ?????????%%%%%%%%%"], "jumps": ["P1720"]}, {"id": "P1740", "text": ["This test is extremely important when the motor has overheated because of the possibility of thermal breakdown of the stator insulation. The indication of insulation efficiency is measured in megohms..."], "jumps": []}, {"id": "P1750", "text": ["A device known as a Megger (megohmmeter) is used to perform this measurement. This instrument produces a very high voltage that is applied to the insulation path. Most Meggers use a hand-crank generator to produce the high voltage..."], "jumps": []}, {"id": "P1760", "text": ["The ground lead of the instrument is connected to the frame of the motor and the line lead is connected to a winding lead. The winding must be isolated from all parts of the motor."], "jumps": []}, {"id": "P1770", "text": ["The high voltage developed by the Megger tests for breakdowns of the insulation. Normal readings are usually much greater than 1 Megohm. Low resistance readings are a sign of defective insulation..."], "jumps": []}, {"id": "P1780", "text": ["In three-phase motors, the current must be equal in all phases. Unequal current causes vibration and premature motor failure. High current measurements on all phases will also show an overloaded motor..."], "jumps": []}, {"id": "P1790", "text": ["The use of a clamp-on ammeter aids in the current measurements for the balance test. The ammeter is \"clamped\" around each wire to the motor one at a time. These readings are compared to each other to determine the status of the motor..."], "jumps": []}, {"id": "P1800", "text": ["A single phase having a high current reading indicates shorted turns on that stator coil. If two phases show a low current reading, that would indicate a possible open in the common stator coil...", "DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD P"], "jumps": []}, {"id": "P1810", "text": ["stator current, insulation deterioration.", "The Megger is used for testing _______ and the Clamp-on meter can be used to measure _______.", "insulation deterioration, stator current."], "jumps": ["P1800"]}, {"id": "P1811", "text": [], "jumps": []}, {"id": "P1812", "text": ["Meggers are used for high voltage resistance measurements, Clamp-on meters are used to measure current."], "jumps": []}, {"id": "P1820", "text": ["When evaluating motor operation, the technician needs to remember that every motor, industrial application and situation is different."], "jumps": ["P1810"]}, {"id": "P1830", "text": ["Variations in temperature, environment, loads, and power availability contribute operational differences. The technician should be aware that deviations exist in any prime mover analysis."], "jumps": []}, {"id": "P1840", "text": ["No two motors will result in exactly the same values. A comparison of values internally to a single motor results in a more accurate evaluation."], "jumps": []}, {"id": "P1910", "text": ["You have completed the information on TROUBLESHOOTING AC MOTORS."], "jumps": ["P1001", "P1840"]}, {"id": "P1920", "text": ["1. Always de-energize and tag out the circuit prior to performing any maintenance on electrical wiring, motors or loads..."], "jumps": []}, {"id": "P1930", "text": ["2. The AC motor troubleshooting process is broken down into three stages:", "(1) Visual Inspection (2) Operational Check (3) Performance Test tion using a megohmmeter (Megger). w Check air gap. Check operating speed(s). w Check shaft endplay. w Check input current and compare with normal values. w Check covers, bolts, pulleys, gears, screws, and keys for security. w If the motor has brushes, blow dirt from windings, clean and inspect the commutator and brushes."], "jumps": []}, {"id": "P1940", "text": ["3. Damaged windings and insulation are the most difficult problems to locate.."], "jumps": []}, {"id": "P1950", "text": ["4. In three-phase motors, the current must be equal in all phases. Unequal current causes vibration and premature motor failure.."], "jumps": []}, {"id": "P1960", "text": ["5. No two motors will result in exactly the same values. A comparison of values internally to a single motor results in a more accurate evaluation.."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1960"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
