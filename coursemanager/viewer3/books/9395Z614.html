fferences between the extreme allowable dimensions of a part."], "jumps": ["P2090", "P2120"]}, {"id": "P2100", "text": ["Dimensions are the measurements used to describe the ideal or perfect size of an object."], "jumps": ["P2090", "P2110"]}, {"id": "P2090", "text": ["Blueprints contain details on dimensions, allowances, and tolerances..."], "jumps": ["P2080", "P2100"]}, {"id": "P2080", "text": ["The Legend or Symbols Block is used to explain or define a symbol or special mark that is used on the particular blueprint.", "UNLESS OTHERWISE NOTED, 3/4\"CONDUIT IN FLOOR", "OUTLET BOX, FIXTURE NO. 11 TO BE INSTALLED"], "jumps": ["P2090", "P2070"]}, {"id": "P2070", "text": ["The Application Block lets you know if there are larger units of which the drawn detail part is a subassembly."], "jumps": ["P2060", "P2080"]}, {"id": "P2060", "text": ["Also available on the drawing blueprint is a \"Bill of Material\" which lists all of the components and material required for assembly.", "3-4 BOX, RECEPTACLE W/CLAMP FOR NONMET. SHTH. WR EA 5325 - 102 - 604 5 52222222222222222222222222111111133333", "3-2 POWER BUS, 100A -- NAVPAC DWG NO. 504131 EA. 3047 1 133333", "3-1 LIGHTING CIRCUIT-NAVPAC DWG NO. 263414 EA. 3010 3 3", "3-3 RECEPTACLE CKT -- NAVPAC DWG. NO. 305460 EA. 3019 2 21111133333", "3-5 LAMP ELECTRIC, MED. BASE, INSIDE FROSTED, 200W EA 6240 - 100 - 316 80 80022222222222222222111111133333", "3-7 PLATE: BRASS, DUPLEX RECEPTACLE EA 5325 - 100 - 102 5 5 1111133333", "3-6 PLUG : ATTACHMENT, 3 WIRE, 15 AMP, 125V EA 5936 - 600 - 309 10 10000111111133333"], "jumps": ["P2050", "P2070"]}, {"id": "P2050", "text": ["The title block contains the following information:........", "No. 1 ADF \"T\" ANTENNA LOCATION & DETAILS"], "jumps": ["P2040", "P2060"]}, {"id": "P2190", "text": ["Which symbol represents wood????????????????????????????????????????ought together on the aircraft?", "lock\"... the one located at the bottom right of each \"blueprint\" drawing. It is called the \"Title Block\"..", "No. 1 ADF \"T\" ANTENNA LOCATION & DETAILS"], "jumps": []}, {"id": "P2030", "text": ["Blueprints represent the standard by which drawing and diagram informatioin is presented. Although the name blueprint reflects the developing process of early engineering and mechanical drawings, today's blueprints are primarily created and developed on computer systems."], "jumps": ["P2034", "P2020"]}, {"id": "P2020", "text": ["In the previous section you learned about the types of sketches, drawings, and diagrams available to you and the information that you can harvest from them. In this section we will learn the parts of a blueprint drawing and understand drawing style conventions..."], "jumps": ["P2030", "P2001"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1970", "P1001"]}, {"id": "P1970", "text": ["6. Aircraft diagrams can be broken into one of three main types: Installation Diagrams, Block Diagrams, and Schematic Diagrams...................................................."], "jumps": ["P1999"]}, {"id": "P1960", "text": ["Pictorial-like a photograph Orthographic-has up to six views Detail-shows in detail a part of a major assembly Section or Sectional-cut a component in half and displays the profile Exploded-depicts the assembly of a major component Half Section-only 1/2 of a section or sectional. One half of the major component is still displayed. Revolved Section-shows the cross section of 1/2 of the item Removed Section-same as revolved except that it depicts more than one profile Isometric-a drawing depicted as 3-D at a 45 degree angleeee", "5. Types of drawing projections: ctorial-like a photograph Orthographic-has up to six views Detail-shows in detail a part of a major assembly Section or Sectional-cut a component in half and displays the profile Exploded-depicts the assembly of a major component Half Section-only 1/2 of a section or sectional. One half of the major component is still displayed. Revolved Section-shows the cross section of 1/2 of the item Removed Section-same as revolved except that it depicts more than one profile Isometric-a drawing depicted as 3-D at a 45 degree angle"], "jumps": ["P1970", "P1950"]}, {"id": "P1950", "text": ["4. Working Drawings are classified as Detail, Assembly, and Installation Drawings...................................................................................."], "jumps": ["P1960"]}, {"id": "P1940", "text": ["3. Sketches are usually drawn in free-hand on graph paper to quickly convey information............."], "jumps": ["P1950", "P1920"]}, {"id": "P1930", "text": ["2. Drawings can be categorized as:................................................rams........."], "jumps": ["P1940", "P1920"]}, {"id": "P1920", "text": ["1. Drawings are the means to transmit technical information to the maintenance technician.. are the means to transmit technical drawings and their information to the maintenance technician."], "jumps": ["P1001", "P1930"]}, {"id": "P1910", "text": ["This completes the information on TYPES OF AIRCRAFT DRAWINGS."], "jumps": ["P1450", "P1001"]}, {"id": "P1452", "text": ["Block Diagrams and Schematic diagrams show relationships between components in a system without regard to physical location.K"], "jumps": []}, {"id": "P1451", "text": [], "jumps": []}, {"id": "P1450", "text": ["Which type of diagram is used to identify the physical location of components in an aircraft or aircraft system?em?"], "jumps": []}, {"id": "P1443", "text": ["Installation Diagrams normally do not show wire numbers..documents...", "Block Diagrams show general relationships of components in a system and do not show individual wire numbers.cation."], "jumps": []}, {"id": "P1441", "text": [], "jumps": []}, {"id": "P2950", "text": ["4. The Application Block will let you know if the drawing is part of a major component."], "jumps": ["P2940", "P2960"]}, {"id": "P1430", "text": ["Remember, unlike installation diagrams, block diagrams and schematic diagrams do not indicate the actual location of individual components in the aircraft. Instead, they illustrate components with respect to each other within the system."], "jumps": ["P1440", "P1420"]}, {"id": "P1420", "text": ["Schematics take a little practice to understand, but once you learn to interpret them, they will be instrumental in your troubleshooting of electrical systems.................."], "jumps": ["P1400", "P1430"]}, {"id": "P1410", "text": ["A schematic is used primarily for troubleshooting. Each component is identified by name. Its location within the system can be ascertained by noting the lines that lead into and out of the unit. Schematics show wire numbers on the diagram that match the physical number stamped on an aircraft wire.", "Like a block diagram, schematic diagrams, or wiring diagrams as they are sometimes called, show component and system relationships with respect to signal flow. Schematics, however, show exactly how components in system are individually connected by wires, tubing, or cabling...."], "jumps": ["P1420", "P1400", "P1410", "P1380"]}, {"id": "P1390", "text": ["Notice that block diagrams do not show details like individual wiring or plumbing but they do show general relationships between systems or individual system components..."], "jumps": ["P1400", "P1380"]}, {"id": "P1380", "text": ["Block diagrams show the relationship of functions in an aircraft system. Block diagrams are used in operation and troubleshooting manuals to illustrate signal or process flow........"], "jumps": ["P1390", "P1360"]}, {"id": "P1370", "text": ["You can very easily identify in the installation diagram that the gust-lock bellcranks are located in the belly of the aircraft, slightly aft of the wing leading edge."], "jumps": ["P1360", "P1380"]}, {"id": "P1001", "text": ["The relationship of components in an aircraft system is depicted on a DIAGRAM. There are many types of diagrams, however, we will discuss only those that are important to aircraft technicians."], "jumps": []}, {"id": "P1340", "text": ["What about an electrical, hydraulic, fuel, lubrication, or pneumatic system where there are numerous components involved?"], "jumps": ["P1350", "P1330"]}, {"id": "P1333", "text": ["This is the Bottom view.view.show six sides of an object.documents..."], "jumps": []}, {"id": "P1350", "text": ["The relationship of components in an aircraft system is depicted on a DIAGRAM. There are many types of diagrams, however, we will discuss only those that are important to aircraft technicians.", "In the drawing identify the top view.ew drawing? Orthographic Projection drawing shows? aircraft?"], "jumps": ["P1360", "P1340"]}, {"id": "P1323", "text": ["Revolved, Removed, and Isometric drawings show dimensions of an object..."], "jumps": []}, {"id": "P1302", "text": ["Revolved section views are primarily used in manufacturing documents..."], "jumps": []}, {"id": "P1320", "text": ["What is the purpose of a Sectional View drawing? Orthographic Projection drawing shows? aircraft?", "Shows hidden or interior features of an object."], "jumps": []}, {"id": "P1312", "text": ["An orthographic Projections can show up to six sides.ing documents..."], "jumps": []}, {"id": "P1311", "text": [], "jumps": []}, {"id": "P1310", "text": ["What is the maximum number of object sides that an Orthographic Projection drawing shows? aircraft?"], "jumps": []}, {"id": "P1303", "text": ["Isometric views are not used to show complex parts or assemblies...."], "jumps": []}, {"id": "P1301", "text": [], "jumps": []}, {"id": "P1300", "text": ["What type of drawing is used primarily in Illustrated Parts manuals?ought together on the aircraft?"], "jumps": []}, {"id": "P1290", "text": ["Orthographic Projection Drawings allows the technician to view all sides of an object. This is possible because all objects have six sides - front, top, bottom, rear, right and left. Normally, all six views are not necessary; one, two and three view drawings are the most popular.pular...."], "jumps": ["P1280", "P1300"]}, {"id": "P1360", "text": ["More complex than installation drawings, Installation Diagrams are used extensively in aircraft maintenance and repair manuals. They are invaluable in identifying and locating components for understanding the operation of various systems..."], "jumps": ["P1350", "P1370"]}, {"id": "P1270", "text": ["The \"Removed Sections\" drawing is very similar to the revolved section drawing with the exception that there will be more than one cross-section involved. Usually the profile pictures will be displayed on one side of the main drawing instead of within the object."], "jumps": ["P1260", "P1280"]}, {"id": "P1260", "text": ["A Revolved Section Drawing basically cuts an object in half and then displays what the cross-section looks like. The view helps the technician visualize the third dimension in a two-dimensional drawing.."], "jumps": ["P1270", "P1250"]}, {"id": "P1250", "text": ["The Exploded View drawing is used primarily in the illustrated parts breakdown/catalog manual and throughout most maintenance manuals. It helps the technician correlate how all of the parts are assembled and in what order..."], "jumps": ["P1240", "P1260"]}, {"id": "P1240", "text": ["In a Half Section Drawing, the slice extends only halfway across the object, leaving the other half of the object as an exterior view. Half section drawings are used especially with symmetrical (same shape on both sides) objects to show both the interior and exterior.xterior..."], "jumps": ["P1230", "P1250"]}, {"id": "P1230", "text": ["A Section or Sectional View is obtained by slicing away part of an object to show the shape and construction of the interior of the object at the slice. Sectional Views are used when the interior or hidden features of an object cannot be shown clearly by using only exterior views."], "jumps": ["P1240", "P1220"]}, {"id": "P1220", "text": ["Detail View Drawings show only a part of the object but in greater detail and to a larger scale than the Principle View. These drawings are normally a part of another drawing and are identified by a heavy line encircling the object..."], "jumps": ["P1210", "P1230"]}, {"id": "P1210", "text": ["A complete view of an object is called the Principle View. Drawings usually do not show more than one Principle View on the same drawing. Instead the drawing will show one Principle View and one or more Detail or Sectional Views.."], "jumps": ["P1220", "P1200"]}, {"id": "P1200", "text": ["A Pictorial Drawing most resembles a photograph. It shows an object as it appears to the eye. Pictorial Drawings are excellent for use in maintenance, overhaul and part number publications, however, they do not show dimension or intricate shapes very well."], "jumps": ["P1210", "P1190"]}, {"id": "P2920", "text": ["1. Blueprints represent the standard by which Working Drawings and Diagrams are drawn.ret the drawing information.", "assemble, disassemble, and troubleshoot components and systems..."], "jumps": ["P2930", "P2001"]}, {"id": "P1183", "text": ["Sub Assembly Drawing is not correct name of a drawing depicting a single part."], "jumps": []}, {"id": "P1182", "text": ["Sketches and blue prints are not classified as Working Drawings."], "jumps": []}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1180", "text": ["What are the three main classes of Working Drawings?es or parts brought together on the aircraft?", "Detail Drawings, Assembly Drawings and Installation Drawings", "Assembly Drawings, Sketches, and Blue Prints", "Installation Drawings, Assembly Drawings, and Sub Assembly Drawings"], "jumps": []}, {"id": "P1173", "text": ["Assembly drawings describe an object made up of two or more parts.."], "jumps": []}, {"id": "P1172", "text": ["Detail drawings describe individual part specifications...."], "jumps": []}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1170", "text": ["Which type of drawing is used to show the sub assemblies or parts brought together on the aircraft?"], "jumps": []}, {"id": "P1160", "text": ["An \"Installation Drawing\" is one which includes all necessary information for placing a part or an assembly of parts in its final position in the aircraft."], "jumps": ["P1170", "P1150"]}, {"id": "P2034", "text": ["Blueprints provide manufacturers, engineers and technicians with the information that they need to identify, inspect or manufacture a part.g process of early engineering and mechanical drawings, today's blueprints are primarily created and developed on computer systems."], "jumps": ["P2035", "P2030"]}, {"id": "P1140", "text": ["The \"Detail Drawing\" is a description of a single part, given in such a manner as to describe by lines, notes, and symbols the specifications of size, shape, material, and methods of manufacture..."], "jumps": ["P1150", "P1130"]}, {"id": "P1130", "text": ["Working drawings are categorized into three main classes: Detail, Assembly, and Installation."], "jumps": ["P1140", "P1120"]}, {"id": "P1120", "text": ["Working Drawings provide information on size, shape, materials required, method of finishing, and assembly process.................assembly process."], "jumps": ["P1130", "P1110"]}, {"id": "P1312", "text": ["An orthographic Projections can show up to six sides.ing documents..."], "jumps": []}, {"id": "P1100", "text": ["A simple sketch will not always be enough to relay the information necessary. A more complex aircraft drawing is the Working Drawing. It is critical for the maintenance technician to be able to interpret what the drawing is attempting to relay."], "jumps": ["P1090", "P1110"]}, {"id": "P1090", "text": ["We use sketches to \"lay out\" a metal repair patch, show areas of corrosion on an airframe and effectively help us remember components or wiring removed from an engine or airframe.."], "jumps": ["P1100", "P1080"]}, {"id": "P1080", "text": ["Using graph paper allows you to draw a sketch that is easier to interpret.."], "jumps": ["P1070"]}, {"id": "P1070", "text": ["For sketching purposes, almost all objects are composed of one or a a combination of six basic shapes: triangle, circle, cube, cylinder, cone, and sphere."], "jumps": ["P1075", "P1060"]}, {"id": "P1060", "text": ["Technical sketches are used to quickly relay information from one person to another and are normally drawn free-hand. They must, however, show all the information needed to manufacture the part..."], "jumps": ["P1050", "P1070"]}, {"id": "P1050", "text": ["The simplest form of drawing is a sketch. Depending on the artist's talent, this could be anything from an elaborate piece of art to a stick-figure line-diagram that only the creator could interpret..."], "jumps": ["P1040", "P1060"]}, {"id": "P1040", "text": ["Well, as simple as that may sound, the different types of drawings that a technician must be able to interpret in order to perform maintenance safely can require some basic knowledge. Aircraft drawings can be categorized into three main categories..."], "jumps": ["P1050", "P1030"]}, {"id": "P1172", "text": ["Detail drawings describe individual part specifications...."], "jumps": []}, {"id": "P1020", "text": ["Aircraft drawings come in many designs and formats, but their purpose is all the same: to provide you, the Aircraft Maintenance Technician, with valuable information for troubleshooting and repair.."], "jumps": ["P1001", "P1030"]}, {"id": "P1440", "text": ["Which type of diagram would you use to identify a wire number in a circuit?nents in an aircraft or aircraft system?"], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P430", "text": ["Let's begin our lesson on AIRCRAFT DRAWINGS..............................."], "jumps": ["P400"]}, {"id": "P420", "text": ["Your ability to interpret these drawings will allow you to troubleshoot and maintain your aircraft proficiently."], "jumps": ["P430", "P400"]}, {"id": "P410", "text": ["In this lesson we will go over some of the most prevalent drawings, diagrams, lines, and symbols that a technician may encounter when using the aircraft publications for maintenance."], "jumps": ["P420", "P400"]}, {"id": "P400", "text": ["Some say that a picture is worth a thousand words. The problem is that unless we have a standardized method of how a picture is drawn, everyone may interpret it differently."], "jumps": ["P410", "P300"]}, {"id": "P300", "text": [], "jumps": []}, {"id": "P100", "text": ["w Prepare drawing in accordance with instructor provided specifications. .............................................", "3. Drawing Exercisecraft Drawingsective 1 line item 2 here. item 2 here.e.e.", "2. Interpreting Aircraft Drawingssngsve 1 line item 2 here. item 2 here.e.e.", "1. Types of Aircraft Drawings objective 1 line item 2 here. item 2 here.e.e.", "w Understand symbols, markings, and lines on aircraft drawings. w Describe the ways information is presented in an aircraft drawing........"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P1", "text": ["Title: AIRCRAFT DRAWINGSf asdf asd fasfd asdf asdf sadf", "Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used i let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
