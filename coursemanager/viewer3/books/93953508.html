const book = {"title": "93953508", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: SAWTOOTH GENERATOR OPERATIONfasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe purpose of a Sawtooth Generator. w Identify and describe input and output waveforms of a Sawtooth Generator.", "w Measure the input and output waveforms of a Sawtooth Generator. w Recognize normal operation of a Sawtooth Generator................."], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P13152", "text": ["You should notice the waveform has a curve that was not present at 1 kHz. The amplitude should also increase."], "jumps": []}, {"id": "P13172", "text": ["A shorter time constant does not cause the amplitude to decrease or the linearity to increase."], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about the operation of a sawtooth generator."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["The sawtooth generator changes a squarewave input to a sawtooth output.", "The sawtooth generator changes a squarewave input to a sawtooth output.."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Unlike an oscillator, the sawtooth generator requires an input signal and does not use feedback."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["For this reason, the sawtooth generator can be thought of as a wave-shaper."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on SAWTOOTH GENERATOR OPERATION......................"], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P13150", "text": ["1.  Decrease the frequency of the function generator to 100 Hz.  2.  Adjust the Volt/Div and Time/Div controls on the oscilloscope        as necessary. \n     Did the amplitude increase and the linearity decrease?", "1. Decrease the frequency of the function generator to 100 Hz. 2. Adjust the Volt/Div and Time/Div controls on the oscilloscope as necessary. Did the amplitude increase and the linearity decrease??????????????"], "jumps": ["P13140"]}, {"id": "P13173", "text": ["A shorter time constant does cause the linearity to decrease, however the amplitude does not."], "jumps": []}, {"id": "P1020", "text": ["Sawtooth generators change square waves to sawtooth waves.", "Sawtooth generators change square waves to sawtooth waves.."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["The square wave input is clamped or held at a DC level by C1, R1 and the base-to-collector junction of Q1."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The AC square wave input becomes a DC square wave."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["When this DC square wave goes positive, Q1 is reverse biased and does not conduct."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["Vcc begins to charge C2 through R2."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["When the DC square wave drops to zero, Q1 is forward biased and conducts."], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["When Q1 conducts, C2 discharges through it very quickly."], "jumps": ["P1090", "P1020"]}, {"id": "P1090", "text": ["The frequency of the output is determined solely by the frequency of the input."], "jumps": ["P1100", "P1020"]}, {"id": "P1100", "text": ["The linearity (how straight) of the output is also determined by the input frequency."], "jumps": ["P1110", "P1020"]}, {"id": "P1110", "text": ["A low input frequency allows the capacitor to charge for a longer period of time. The output shows more of the charge curve.   It is not linear.", "A low input frequency allows the capacitor to charge for a longer period of time. The output shows more of the charge curve. It is not linear."], "jumps": ["P1120", "P1020"]}, {"id": "P1115", "text": ["CHARGE CURVE - Capacitors do not charge at a constant rate. The chart below illustrates the action."], "jumps": []}, {"id": "P1120", "text": ["Because the capacitor charges longer, the output amplitude is greater."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["A high input frequency only allows the capacitor to charge for a short period of  time. The amplitude is reduced.", "A high input frequency only allows the capacitor to charge for a short period of time. The amplitude is reduced."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["The output shows only the first part of the charge curve.  The output is very linear or straight.", "The output shows only the first part of the charge curve. The output is very linear or straight."], "jumps": ["P1150", "P1110"]}, {"id": "P1150", "text": ["The DC supply voltage (Vcc) only effects the output amplitude. A high Vcc has a higher output amplitude than a low Vcc."], "jumps": ["P1155", "P1110"]}, {"id": "P1155", "text": ["The output  linearity and frequency are unaffected by the amount of Vcc.", "The output linearity and frequency are unaffected by the amount of Vcc."], "jumps": ["P1160", "P1150"]}, {"id": "P1160", "text": ["A low frequency input produces a  non-linear output when 20 VDC or 5VDC is applied.", "A low frequency input produces a non-linear output when 20 VDC or 5VDC is applied."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["A high frequency input produces a linear output when 20 VDC or 5 VDC is applied."], "jumps": ["P1175", "P1150"]}, {"id": "P1175", "text": ["The amount of Vcc affects the output amplitude and has no effect on the linearity."], "jumps": ["P1180", "P1150"]}, {"id": "P1180", "text": ["The RC time constant (TC) of R2 and C2 will effect  the output.", "The RC time constant (TC) of R2 and C2 will effect the output."], "jumps": ["P1185", "P1150"]}, {"id": "P1185", "text": ["A long TC produces a linear output having low amplitude. This effects the circuit in the same way as a high frequency input does."], "jumps": ["P1190", "P1180"]}, {"id": "P1190", "text": ["A short TC produces a non-linear output having high amplitude. This effects the circuit in the same way as a low frequency input does."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["What three factors reduce the output of a sawtooth generator?"], "jumps": ["P1180"]}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1202", "text": ["Low Vcc reduces the output, but a low input frequency or a short RC time constant increases the output amplitude."], "jumps": []}, {"id": "P1203", "text": ["High Vcc, low input frequency and a short RC time constant all increase the output amplitude."], "jumps": []}, {"id": "P1210", "text": ["This chart shows the effects on the output for many circuit variables.", "Low Input Frequency Increases amplitude and decreases linearity. High Input Frequency Decreases amplitude and increases linearity. Low Vcc Decreases amplitude. No effect on frequency or linearity. High Vcc Increases amplitude. No effect on frequency or linearity. Long Time Constant Decreases amplitude and increases linearity. Short Time Constant Increases amplitude and decreases linearity..."], "jumps": ["P1910", "P1200"]}, {"id": "P1910", "text": ["This completes the information on SAWTOOTH GENERATOR.", "This completes the information on SAWTOOTH GENERATOR......."], "jumps": ["P1001", "P1210"]}, {"id": "P1920", "text": ["1.  Sawtooth generators change square waves to sawtooth                  waves to determine frequency.", "1. Sawtooth generators change square waves to sawtooth waves to determine frequency. When this DC square wave goes positive, Q1 is reverse biased and does not conduct."], "jumps": ["P1922", "P1001"]}, {"id": "P1922", "text": ["2. When this DC square wave goes positive, Q1 is reverse biased and does not conduct."], "jumps": ["P1930", "P1920"]}, {"id": "P1930", "text": ["3.  The frequency of the output is determined by the frequency\n      of the input.", "3. The frequency of the output is determined by the frequency of the input.t.nput."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["4.  This chart shows the effect on the output from many circuit            variables.", "4. This chart shows the effect on the output from many circuit variables..", "Low Input Frequency Increases amplitude and decreases linearity. High Input Frequency Decreases amplitude and increases linearity. Low Vcc Decreases amplitude. No effect on frequency or linearity. High Vcc Increases amplitude. No effect on frequency or linearity. Long Time Constant Decreases amplitude and increases linearity. Short Time Constant Increases amplitude and decreases linearity..."], "jumps": ["P1999", "P1920"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.nu."], "jumps": ["P1001", "P1940"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["In this experiment, you will measure input and output waveforms of a sawtooth generator. You will vary the input frequency and Vcc voltage and observe the effect on the output to verify normal operation.", "In this experiment, you will measure input and output waveforms of a sawtooth generator. You will vary the input frequency and Vcc voltage and observe the effect on the output to verify normal operation.."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["Pick up the PC130-43A card. The purpose of this card is to demonstrate the operation of sawtooth generators."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["Compare the components on PC130-43A to the schematic shown."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["The transistor functions as a switch. When OFF, Vcc charges C2 or C3 through R2. When ON, C2 or C3 is discharged from ground through Q1."], "jumps": ["P2065", "P2040"]}, {"id": "P2065", "text": ["S1 selects between C2 and C3 to alter the RC time constant of the circuit."], "jumps": ["P2070"]}, {"id": "P2070", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2040"]}, {"id": "P2080", "text": ["2.  Carefully plug PC130-43A into the Test Console PC1 position.", "2. Carefully plug PC130-43A into the Test Console PC1 position."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["3.  Set S1 on PC130-43A to the C3 position. \n4.  Set the Voltmeter switch to Positive. Set the Positive Supply           Voltage to 12. The Test Console's voltage meter should                   indicate 12 volts.", "3. Set S1 on PC130-43A to the C3 position. 4. Set the Voltmeter switch to Positive. Set the Positive Supply Voltage to 12. The Test Console's voltage meter should indicate 12 volts..."], "jumps": ["P2080", "P2095"]}, {"id": "P2095", "text": ["MEASUREMENT SETUP - Carefully set S1 to the C3 position."], "jumps": []}, {"id": "P2100", "text": ["5.  Connect a function generator to the Input BNC Connector.\n6.  Set the Function Generator for a 1 kHz 5 Vpp square wave as        measured on PC130-43A TP2 with your oscilloscope.", "5. Connect a function generator to the Input BNC Connector. 6. Set the Function Generator for a 1 kHz 5 Vpp square wave as measured on PC130-43A TP2 with your oscilloscope. External program = SCAN FTR 0 C1 00k"], "jumps": ["P2090", "P2105"]}, {"id": "P2105", "text": ["BNC CONNECTION - Connect the Function Generator's Main Output BNC to the Test Console's Input BNC."], "jumps": ["P2107"]}, {"id": "P2107", "text": ["MEASUREMENT SETUP - Carefully connect the oscilloscope to TP2."], "jumps": ["P2100", "P2105"]}, {"id": "P2110", "text": ["7.  Turn PC1 DC Power switch to ON.\n8.  Measure the output waveform on PC130-43A TP4.", "7. Turn PC1 DC Power switch to ON. 8. Measure the output waveform on PC130-43A TP4.."], "jumps": ["P2100", "P2115"]}, {"id": "P2115", "text": ["MEASUREMENT SETUP - Carefully measure the waveform on TP4."], "jumps": []}, {"id": "P2120", "text": ["9.  Adjust the output level of the function generator until the                 waveform shown below is obtained.", "9. Adjust the output level of the function generator until the waveform shown below is obtained..", "'}:5 t0H( 9E}A9As5/GA}A;aEAA}EAKE;AAaAE;A}AEAU;aA};aEAEA;EAAAEA;E;AaA", "EUaa 555G7EEEa::Ts1TA;;AA;EEA;AAa9:AAE;E;;;UaAA;AEEA;aA};AA9aAA}}};E;AA9E}9AA;}AAEaaA;AEAEaAAEEaAAA9EEAAA}EAE;aEEEAU;EE;Ea;}", "EK,,L17;UT9;EK;,=17=9EK;AaTs a7(aEAEas5:9<5", "mzF(tt-FsFF-cmzssttst|t--yTmVstys|tytts sm t syst", ";EaTTy55F }Aaas= yjm;AEEAA T_}zc(GGFGVVVccVcVVlllGLVs-FFccclFm--jz5(-VFzmmm(ctmmlmzzzFFFFFzmmmctmFmsmmtcVmt5mzzl-zFmmFmtz", "KT[Qa9mFKKaa 5TL:EAa95 |9/:}EAEAALA_l>lz(lllFmV-V/czzFzFz/cVmcc--F(GlzFVllWmzzm(mzm(FzmpcF(zmFlzFmmlz-llplcmV-z-mcjsFV`zltmlzFVz-tVczFFtcmVmzlFz(mmzFmzFzmFl/VtmtVFmzmVcmmsVccFtsmmmmFFysGsV", "}9}AAK,,KKK/>V;U9a;EE;KTfV=:lFE;AaTTssc AA :: :9W5EAEEA-Es.>i?fodfi..r.l`(zlVclmlFzljlm itor."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["What do you predict will happen to the output if the .1 mfd capacitor is replaced with a smaller value capacitor (shorter time constant)?", "Amplitude decreases, linearity decreases", "Amplitude decreases, linearity increases", "Amplitude increases, linearity decreases"], "jumps": ["P2160"]}, {"id": "P2171", "text": [], "jumps": []}, {"id": "P2172", "text": ["A shorter time constant does not cause the amplitude to decrease or the linearity to increase."], "jumps": []}, {"id": "P2173", "text": ["A shorter time constant does cause the linearity to decrease, however the amplitude does not."], "jumps": []}, {"id": "P2180", "text": ["4.  While observing the oscilloscope display, set S1 on PC130-           43A to the C2 position. This replaces the .1 mfd capacitor with       a .05 mfd capacitor.\n     Did the amplitude increase and the linearity decrease?", "4. While observing the oscilloscope display, set S1 on PC130- 43A to the C2 position. This replaces the .1 mfd capacitor with a .05 mfd capacitor. Did the amplitude increase and the linearity decrease????????????????????"], "jumps": ["P2170"]}, {"id": "P2181", "text": [], "jumps": []}, {"id": "P2182", "text": ["You should notice the waveform has a curve that was not present with the .1 mfd capacitor. The amplitude should also increase slightly."], "jumps": []}, {"id": "P2190", "text": ["5.  Return S1 on PC130-43A to the C3 position. Notice the supply       voltage (Vcc) is +12 VDC.", "5. Return S1 on PC130-43A to the C3 position. Notice the supply voltage (Vcc) is +12 VDC.."], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["What do you predict will happen to the output if Vcc decreases?", "Amplitude decreases, frequency decreases", "Amplitude decreases, linearity decreases"], "jumps": ["P2190"]}, {"id": "P2201", "text": [], "jumps": []}, {"id": "P2202", "text": ["If Vcc decreases, the amplitude decreases, but the linearity is not affected."], "ju       box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
