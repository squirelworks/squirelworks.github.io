:<44<<8;44<48<<8;48<48<88;48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Describe a typical analog and digital start/speed control circuit for small DC motors. w Describe a digital start/speed control circuit."], "jumps": []}, {"id": "P300", "text": ["In this lesson, you will learn about amplitude control of a DC motor."], "jumps": ["P410", "P302"]}, {"id": "P410", "text": ["There are two fundamental types of DC motor control: time control and amplitude control."], "jumps": ["P400", "P420", "PWM"]}, {"id": "P420", "text": ["You are already familiar with time control of a DC motor."], "jumps": ["P410", "P430"]}, {"id": "P430", "text": ["In this lesson you will explore the second type of DC motor control, amplitude control."], "jumps": ["P410", "P440"]}, {"id": "P440", "text": ["Let's begin the lesson on AMPLITUDE CONTROL OF DC MOTORS...................."], "jumps": ["P410"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Large starting torque in a DC motor requires large starting current. High Torque Large Current"], "jumps": ["P1001", "P1030"]}, {"id": "P1030", "text": ["In most instances, large currents are undesirable and must be controlled."], "jumps": ["P1020", "P1032"]}, {"id": "P1032", "text": ["Changing the applied voltage (amplitude control) to a motor, controls current."], "jumps": ["P1020", "P1036"]}, {"id": "P1036", "text": ["Let's look at some electronic circuits that vary amplitude of the applied voltage."], "jumps": ["P1020", "P1040"]}, {"id": "P1040", "text": ["There are a large variety of manual starters that limit starting current in a DC motor."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Notice that both starter circuits reduce the values of resistors."], "jumps": ["P1052", "P1040"]}, {"id": "P1052", "text": ["Moving both switches from OFF to 1 places 175 ohms in series with the motor's resistance, reducing the voltage applied to the motor."], "jumps": ["P1054", "P1040"]}, {"id": "P1054", "text": ["The high starting current in the DC motor is reduced. As a result, RPM is also limited."], "jumps": ["P1056", "P1040"]}, {"id": "P1056", "text": ["Once the motor starts to rotate, the current reduces (CEMF increases) and the switch can be moved to position 2."], "jumps": ["P1058", "P1040"]}, {"id": "P1058", "text": ["Now the resistance is only 75 ohms. More voltage is felt across the motor and the motor speeds up."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["As the motor continues to increase in speed, the current draw reduces more. You can switch to position 3."], "jumps": ["P1062", "P1040"]}, {"id": "P1062", "text": ["Now the series resistance is only 25 ohms. More of the applied voltage is across the motor and the motor speeds up, reducing current flow even more."], "jumps": ["P1064", "P1040"]}, {"id": "P1064", "text": ["Finally, the switch is placed in the RUN position (no series resistance)."], "jumps": ["P1066", "P1040"]}, {"id": "P1066", "text": ["As the entire voltage is felt across the motor, the motor increases to maximum speed."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["By changing the amplitude of the applied voltage, large starting currents are reduced in steps."], "jumps": ["P1040", "P1073"]}, {"id": "P1073", "text": ["A disadvantage of this type of controller is that motor current flows through the manually operated switch."], "jumps": ["P1040", "P1075"]}, {"id": "P1075", "text": ["Large current flow is common in large industrial machinery."], "jumps": ["P1077", "P1040"]}, {"id": "P1077", "text": ["This poses a safety hazard when the switch is operated."], "jumps": ["P1040", "P1079"]}, {"id": "P1079", "text": ["Normally the controller is located a long distance away from the motor. This increases the cost of wiring. Large wiring is needed due to high currents."], "jumps": ["P1040", "P1080"]}, {"id": "P1080", "text": ["Relay controllers overcome the safety and cost disadvantages. lay Control"], "jumps": []}, {"id": "P1082", "text": ["First, motor current does not flow through the switch. Low current in the mAmp range will operate a relay."], "jumps": ["P1084", "P1080"]}, {"id": "P1084", "text": ["Second, the wiring between the remote controller and the motor can be smaller, reducing cost."], "jumps": ["P1090", "P1080"]}, {"id": "P1090", "text": ["Remote relay controllers work the same as a manual controller."], "jumps": ["P1092", "P1080"]}, {"id": "P1092", "text": ["With latching relay (K1) energized, R1, R2 and R3 are in the circuit. K1 remains in the latched state until power is removed by moving the switch to the \"OFF\" position.", "DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD# DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD", "DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDCCDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD \"\"'-DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD", "+ DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD", "+ DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD", "+ DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD", "DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD DD&", "DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD (", "% DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD"], "jumps": ["P1094", "P1080"]}, {"id": "P1094", "text": ["With latching relay (K2) energized, R1 is shorted out. K1 remains in the latched state until power is removed by moving the switch to the \"OFF\" position...", "CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC %"], "jumps": ["P1096", "P1080"]}, {"id": "P1096", "text": ["With latching relay (K3) energized, R1 and R2 are shorted out. K2 is now latched in addition to K1...", "IIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIII# IIIIIIIIIIIIIIII", "IIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIII &&('IIIIIIIIIIII", ", IIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIII", ", IIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIII", "\" IIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIII", "IIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIII \"", "% IIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIIII"], "jumps": ["P1098", "P1080"]}, {"id": "P1098", "text": ["With latching relay (K4) energized, R1, R2 and R3 are shorted out. There is no resistance in series with the motor.", "CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC# C", "CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCAACCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC $$+(", ") CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC", ") CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC", ") CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC", "\" CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC", "CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC \"", "& CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC"], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["In smaller DC motors where circuit currents are not large, solid state controllers are used.a"], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["Notice that the motor controller is really a simple emitter follower circuit where the motor is the emitter resistor."], "jumps": ["P1100", "P1120"]}, {"id": "P1120", "text": ["By varying R2, the voltage divider network consisting of R1 and R2 controls the base circuit of Q2."], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["This in turn controls the conduction of Q1 which controls the voltage across the motor."], "jumps": ["P1132", "P1100"]}, {"id": "P1132", "text": ["If Q1 is off, Vcc is across the collector and emitter of Q1, leaving 0 volts across the motor."], "jumps": ["P1134", "P1100"]}, {"id": "P1134", "text": ["If Q1 is saturated, very little Vcc travels across Q1's collector to the emitter. This leaves almost all of Vcc across the motor."], "jumps": ["P1136", "P1100"]}, {"id": "P1136", "text": ["The values of Q1's base voltage, between cutoff and saturation, allow varying Vcc across the motor."], "jumps": ["P1140", "P1100"]}, {"id": "P1140", "text": ["Many controllers must also maintain motor speed, regardless of motor load. Speed Control"], "jumps": ["P1100", "P1150"]}, {"id": "P1150", "text": ["These types of controllers utilize a feedback network to maintain motor speed. Feedback Loop"], "jumps": ["P1140", "P1160"]}, {"id": "P1160", "text": ["A magnetic pickup senses motor RPM and sends this information to a control module."], "jumps": ["P1150", "P1170"]}, {"id": "P1170", "text": ["The control module then generates a speed drive signal to feed the base."], "jumps": ["P1150", "P1180"]}, {"id": "P1180", "text": ["low current relay to control high current motorr", "high current relay to control low current motorr", "Why is a relay controller desirable?......................."], "jumps": ["P1150"]}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1182", "text": ["A relay is used to couple a low current relay to a high current motor."], "jumps": []}, {"id": "P1190", "text": ["Modern motor controllers, like everything else, have even progressed to a digital format."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["A digital start/speed controller incorporates a digital to analog converter (D/A) and a comparator array."], "jumps": ["P1190", "P1210"]}, {"id": "P1210", "text": ["The D/A converter takes a digital input signal and converts it into an analog equivalent."], "jumps": ["P1190", "P1220"]}, {"id": "P1220", "text": ["This analog signal is sent to a comparator array where it is compared against a set threshold level."], "jumps": ["P1190", "P1230"]}, {"id": "P1230", "text": ["ur re which provides one or speed control vol!", "The comparator array then triggers one of four relays which provides one or four speed control voltages to the motor..."], "jumps": ["P1190", "P1240"]}, {"id": "P1240", "text": ["Which component of a digital controller converts a digital input to an analog equivalent?"], "jumps": ["P1190"]}, {"id": "P1241", "text": [], "jumps": []}, {"id": "P1242", "text": ["A microprocessor utilizes digital signals in normal operation but has no converting capabilities in itself."], "jumps": []}, {"id": "P1243", "text": ["The comparator array compares an input analog signal to a preset threshold."], "jumps": []}, {"id": "P1250", "text": ["This digital speed controller is an open loop controller..."], "jumps": ["P1240", "P1260"]}, {"id": "P1260", "text": ["The controller has no way of knowing if the motor is responding to the applied signals."], "jumps": ["P1250", "P1270"]}, {"id": "P1270", "text": ["It is up to the operator to know if the motor is responding."], "jumps": ["P1250", "P1280"]}, {"id": "P1280", "text": ["In this circuit, feedback is used to control the motor once it is up to speed."], "jumps": ["P1250", "P1290"]}, {"id": "P1290", "text": ["The START input energizes K1 and the motor begins to rotate (R1 reduces starting current)."], "jumps": ["P1280", "P1300"]}, {"id": "P1300", "text": ["With the motor spinning, the RPM sensor applies a signal to the D/A converter."], "jumps": ["P1280", "P1310"]}, {"id": "P1310", "text": ["The D/A converts the pulse train from the sensor to an analog voltage.e."], "jumps": ["P1280", "P1320"]}, {"id": "P1320", "text": ["The analog voltage is inputted to the comparator array where the speed control output selects which relay to energize controlling speed."], "jumps": ["P1280", "P1330"]}, {"id": "P1330", "text": ["The system is a closed loop system due to the output of the motor controlling the input to the motor."], "jumps": ["P1280", "P1910"]}, {"id": "P1910", "text": ["This completes the information on AMPLITUDE CONTROL OF DC MOTORS."], "jumps": ["P1280", "P1001"]}, {"id": "P1920", "text": ["1. Large starting torque in a DC motor requires large starting current. rge Current"], "jumps": ["P1001", "P1930"]}, {"id": "P1930", "text": ["2. Manual starter controllers regulate the amount of voltage that reaches the DC motor..."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["K2 K3 K43", "R1 R2 R3", "3. Relay motor controllers use low voltage relays to control large current motors. Control"], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. Solid state motor controllers utilize analog circuits and feedback networks for proper motor control."], "jumps": ["P1940", "P1960"]}, {"id": "P1960", "text": ["5. A digital start/speed controller incorporates a digital to analog converter (D/A) and a comparator array."], "jumps": ["P1950", "P1970"]}, {"id": "P1970", "text": ["6. The D/A converter takes a digital input signal and converts it into an analog equivalent."], "jumps": ["P1960", "P1980"]}, {"id": "P1980", "text": ["7. The comparator array compares an analog signal to a preset value and then triggers one of four possible speed controls."], "jumps": ["P1960", "P1990"]}, {"id": "P1990", "text": ["8. A digital closed loop system uses the output of the motor as an input to the motor through the speed control circuits."], "jumps": ["P1960", "P1999"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1990", "P1001"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["Which of the following represent the two types of DC motor control?"], "jumps": []}
