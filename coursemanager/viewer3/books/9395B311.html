nts a 1 along with the \n      0 degree phase signals.", "2. Set the Time/Div Variable to calibrated. Adjust the triggering level to stabilize the display if needed. The signals you see are a SYNC cycle and 0 degree phase signals. This is because HIGH data has not been applied. Adjust the oscilloscope as necessary to see at least 2 SYNC cycles.", "3. Close the number 1 switch on PC130-323 S5 (depress the rocker toward the number 1). Notice that the SYNC cycle is no longer present. HIGH data is being applied. You should see a phase shifted signal that represents a 1 along with the 0 degree phase signals."], "jumps": ["P13740", "P13720", "P13750", "P13730"]}, {"id": "P13750", "text": ["4.  Change the Time/Div control to 50 ms and adjust the triggering       level if needed.  You should see about 4 cycles of \u0083  on CH1.          Also notice the 180\u00ba phase shift for the 1 data bit.", "4. Change the Time/Div control to 50 ms and adjust the triggering level if needed. You should see about 4 cycles of"], "jumps": ["P13760", "P13740"]}, {"id": "P13760", "text": ["5.  Change the Time/Div control to 0.2 ms and adjust the Time/Div       Variable control to display 16 complete cycles of \u0083c on CH1.          The CH2 trace shows two 180 degree phase shifts.  With 16            cycles shown on the oscilloscope and the data source card           sending 8 bits, you are seeing two complete sets of data.", "5. Change the Time/Div control to 0.2 ms and adjust the Time/Div Variable control to display 16 complete cycles of", "c on CH1. The CH2 trace shows two 180 degree phase shifts. With 16 cycles shown on the oscilloscope and the data source card sending 8 bits, you are seeing two complete sets of data.", "6. Close the number 2 switch on PC130-323 S5. Leave number 1 closed. Now there is two cycles next to each other on the CH2 trace that are 180 degrees phase shifted. You are sending 11000000.", "6. Close the number 2 switch on PC130-323 S5, leaving the number 1 switch closed. You are now sending 11000000. Observe that there are two cycles next to each other on the CH2 trace and that they are 180"], "jumps": ["P13770", "P13750", "P13780", "P13760"]}, {"id": "P13780", "text": ["7.  Apply various combinations of data to the PSK modulator              using S5 on PC130-323.  You should be able to recognize the        phase shifts as compared to the reference signal, \u0083c.", "7. Apply various combinations of data to the PSK modulator using S5 on PC130-323. You should be able to recognize the phase shifts as compared to the reference signal,"], "jumps": ["P13790", "P13770"]}, {"id": "P13790", "text": ["Now, let's look at QPSK operation.", "1.  Place all switches on PC130-323 S5 to OPEN.\n2.  Place switch numbers 4, 5 and 6 to closed.", "Now, let's look at QPSK operation..........................", "1. Place all switches on PC130-323 S5 to OPEN. 2. Place switch numbers 4, 5 and 6 to closed.", "Q ms. DO NOT CHANGE the Time/Div Variable control. 4. y Range on PC130-323 to f8, (one place counterclockwise).", "3. Change the Time/Div control to 0.1 ms. DO NOT CHANGE the Time/Div Variable control. 4. Place S1, Frequency Range on PC130-323, place Frequency Range switch S1 to f8 (one step counterclockwise)."], "jumps": ["P13800", "P13780", "P13810", "P13790", "P13820"]}, {"id": "P13820", "text": ["5.  Ensure CH1 is connected to PC130-330 TP7, CH2 is                          connected to PC130-330 \u0083  Out TP, and the external trigger is         connected to PC130-323 TP3.  Look closely at CH2 (QPSK              data), and compare it to CH1.", "5. Ensure CH1 is connected to PC130-330 TP7, CH2 is connected to PC130-330", "Out TP, and the external trigger is connected to PC130-323 TP3. Look closely at CH2 (QPSK data), and compare it to CH1."], "jumps": ["P13830", "P13810"]}, {"id": "P13830", "text": ["You will be able to see two or three different phase shifts.  Remember, a 00 generates 0 degrees, a 11 generates 180 degrees, a 01 generates 90 degrees and a 10 generates 270 degrees.", "You will be able to see two or three different phase shifts. Remember, a 00 generates 0 degrees, a 11 generates 180 degrees, a 01 generates 90 degrees and a 10 generates 270 degrees.", "It may be necessary to adjust the trigger to stabilize the waveforms.", "NOTEEEEEnment is critical for proper system operation."], "jumps": ["P13840", "P13820"]}, {"id": "P13840", "text": ["6.  Change the digital information applied to the QPSK modulator       by using S5 on PC130-323.  Be sure that you can pick out the        four different phase shift signals.", "6. Change the digital information applied to the QPSK modulator by using S5 on PC130-323. Be sure that you can pick out the four different phase shift signals."], "jumps": ["P13850", "P13830", "P13845"]}, {"id": "P13845", "text": ["PHASE SHIFTED SIGNALS - The four phase shift system is called quadrature phase shift keying, QPSK for short."], "jumps": []}, {"id": "P13850", "text": ["You have seen how the PSK/QPSK modulator operates.  Last, you will measure the rest of the signals in the circuit.", "You have seen how the PSK/QPSK modulator operates. Last, you will measure the rest of the signals in the circuit."], "jumps": ["P13860", "P13840"]}, {"id": "P13860", "text": ["1.  Using the CH2 probe, measure the signals at test points 1                through 17 and compare them to CH1.", "1. Using the CH2 probe, measure the signals at test points 1 through 17 and compare them to CH1."], "jumps": ["P13870", "P13850"]}, {"id": "P13870", "text": ["You have aligned and measured signals in the PSK modulator circuit.  The circuit takes a digital information input and uses it to phase modulate an analog signal.  The types of signals on the test points will be important when troubleshooting.", "You have aligned and measured signals in the PSK modulator circuit. The circuit takes a digital information input and uses it to phase modulate an analog signal. The types of signals on the test points will be important when troubleshooting."], "jumps": ["P13860"]}, {"id": "P13890", "text": ["2.  Set the Console Power Switch to OFF.", "2. Set the Console Power Switch to OFF.FF................................."], "jumps": []}, {"id": "P13900", "text": ["3.  Disconnect all Test Equipment.\n4.  Carefully remove experiment cards.\n5.  Return all equipment to designated storage areas.", "3. Disconnect all Test Equipment. 4. Carefully remove experiment cards. 5. Return all equipment to designated storage areas."], "jumps": ["P13910", "P13890"]}, {"id": "P13910", "text": ["This completes the experiment on PSK TRANSMITTERS.", "This completes the experiment on PSK TRANSMITTERS.E........"], "jumps": ["P13900"]}, {"id": "P14020", "text": ["The receiver of a PSK/QPSK system demodulates the transmitted data received from the modulator.", "The receiver circuit is contained on PC130-331 and consists of the components necessary to demodulate PSK/QPSK signals."], "jumps": ["P14040", "P2001", "P14050", "P14020"]}, {"id": "P14050", "text": ["The PSK/QPSK signal is applied to op-amp IC1b where it is amplified and shaped."], "jumps": ["P14060", "P14040"]}, {"id": "P14060", "text": ["The output level is controlled by SYNC control R4 and is applied to the full wave rectifier."], "jumps": ["P14070", "P14050"]}, {"id": "P14070", "text": ["IC1a, IC1d and D1 through D4 make up the full wave rectifier."], "jumps": ["P14080", "P14050"]}, {"id": "P14080", "text": ["The ripple output of the rectifier controls the PLL circuit (IC2), producing a frequency of 32     .  This is adjusted by R20, the  Adjust.", "The ripple output of the rectifier controls the PLL circuit (IC2), producing a frequency of 32 . This is adjusted by R20, the Adjust."], "jumps": ["P14090", "P14050"]}, {"id": "P14090", "text": ["The 32\u0083c frequency is amplified by Q1 and applied to IC3a, the counter.  This action develops 2\u0083c and 4\u0083c.", "c frequency is amplified by Q1 and applied to IC3a, the counter. This action develops 2"], "jumps": ["P14100", "P14050"]}, {"id": "P14100", "text": ["Timing for the entire circuit is dependent on outputs Q2 (4\u0083c) and Q3 (2\u0083c) of IC3a.", "Timing for the entire circuit is dependent on outputs Q2 (4"], "jumps": ["P14110", "P14050"]}, {"id": "P14110", "text": ["IC1c receives its input from IC1b."], "jumps": ["P14120", "P14050"]}, {"id": "P14120", "text": ["IC1c is set by R11 the OFFSET control.  IC1c changes the analog signal to digital by operating in cutoff or saturation.", "IC1c is set by R11 the OFFSET control. IC1c changes the analog signal to digital by operating in cutoff or saturation."], "jumps": ["P14130", "P14050"]}, {"id": "P14130", "text": ["The digital data passes through IC5a and IC5c for buffering, and then to the SYNC detector and register."], "jumps": ["P14140", "P14120"]}, {"id": "P14140", "text": ["First, let's look at the SYNC detector."], "jumps": ["P14150", "P14120"]}, {"id": "P14150", "text": ["The RC circuit connected to the RESET input, resets the SYNC detector if the digital data has a 0 degree phase shift, or is 1100."], "jumps": ["P14160", "P14120"]}, {"id": "P14160", "text": ["If the digital data is 0011, 0110 or 1001 the circuit is not reset and the output of IC6a remains HIGH."], "jumps": ["P14170", "P14150"]}, {"id": "P14170", "text": ["This means no SYNC cycle is present.  The HIGH output of IC6a is used in the rest of the circuit to indicate that the SYNC cycle was not received.", "This means no SYNC cycle is present. The HIGH output of IC6a is used in the rest of the circuit to indicate that the SYNC cycle was not received."], "jumps": ["P14180", "P14150"]}, {"id": "P14180", "text": ["If the digital input is 0111, a SYNC cycle, the output of IC6a is LOW.", "If the digital input is 0111, a SYNC cycle, the output of IC6a is LOW..."], "jumps": ["P14190", "P14150"]}, {"id": "P14190", "text": ["The LOW output of IC6a is used in the rest of the circuit to indicate that a SYNC cycle was received."], "jumps": ["P14210", "P14150"]}, {"id": "P14210", "text": ["Remember that in the process of converting the QPSK analog signal to digital data, only the last two bits of the four are used to indicate the wave's phase. Therefore only the Q2 and Q3 outputs of IC7 are used."], "jumps": ["P14220", "P14190"]}, {"id": "P14210", "text": ["Because the last two bits are data the outputs are taken from Q2 and Q3 of IC7.", "Remember that in the process of converting the QPSK analog signal to digital data, only the last two bits of the four are used to indicate the wave's phase. Therefore only the Q2 and Q3 outputs of IC7 are used..."], "jumps": ["P14220", "P14190"]}, {"id": "P14220", "text": ["The Q2 and Q3 outputs are routed to IC8, which converts the data to serial form by alternately reading first one bit and then the other."], "jumps": ["P14230", "P14210"]}, {"id": "P14230", "text": ["The Q2 and Q3 outputs of the register are applied to NAND gates that are enabled at opposite times by the inverter."], "jumps": ["P14240", "P14220"]}, {"id": "P14240", "text": ["This serial data is then set to IC8c.", "This serial data is then set to IC8c.al and is applied to IC8c."], "jumps": ["P14250", "P14220"]}, {"id": "P14250", "text": ["IC8c is enabled only when a HIGH is applied from the SYNC detector (no SYNC cycle).   If LOW, the data out of IC8c is always a HIGH.", "IC8c is enabled only when a HIGH is applied from the SYNC detector (no SYNC cycle). If LOW, the data out of IC8c is always a HIGH."], "jumps": ["P14260", "P14220"]}, {"id": "P14260", "text": ["IC9 inverts the data to the original polarity.  The output is the digital information that was applied to the PSK/QPSK modulator.", "IC9 inverts the data to the original polarity. The output is the digital information that was applied to the PSK/QPSK modulator."], "jumps": ["P14270", "P14220"]}, {"id": "P14270", "text": ["Finally, IC3b is the counter that develops the LOAD signal to the register."], "jumps": ["P14280", "P14220"]}, {"id": "P14280", "text": ["The Q1 output is \u0083c and applied to the register's LOAD input.", "c and applied to the register's LOAD input...."], "jumps": ["P14290", "P14270"]}, {"id": "P14290", "text": ["The signal is also used to set the timing for IC8 (changing the parallel output to serial)."], "jumps": ["P14300", "P14280"]}, {"id": "P14300", "text": ["The reset input to the counter is from either its own count four pulse or if a SYNC cycle is being generated."], "jumps": ["P14310", "P14280"]}, {"id": "P14310", "text": ["Remember, when the incoming QPSK signal was converted to a digital signal, it was divided into four bits.  Even though only two bits are used as data, all four must be counted.", "Remember, when the incoming QPSK signal was converted to a digital signal, it was divided into four bits. Even though only two bits are used as data, all four must be counted."], "jumps": ["P14320", "P14280", "P14315"]}, {"id": "P14312", "text": ["Remember, when the incoming QPSK signal was converted to a digital signal, it was divided into four bits.  Even though only two bits are used as data, all four must be counted.", "Remember, when the incoming QPSK signal was converted to a digital signal, it was divided into four bits. Even though only two bits are used as data, all four must be counted."], "jumps": ["P14320", "P14280", "P14315"]}, {"id": "P14315", "text": ["Now, examine the PC130-331 card. Notice that it has three controls: R4 (Sync), R11 (Offset), and R20 (      Adjust).", "FOUR PARTS OF DIGITAL DATA - Remember, the conversion from analog to digital makes four parts to each phase of the PSK/QPSK signal.", "Now, examine the PC130-331 card. Notice that it has three controls: R4 (Sync), R11 (Offset), and R20 ( Adjust).", "R11 adjusts the cutoff and saturation points of IC1c. The amplifier is used to change the analog signal to digital.", "R4 controls the ripple frequency to the PLL circuit, SYNC. change the analog signal to digital.", "R20 is used to adjust the PLL circuit for a 32", "c output. change the analog signal to digital."], "jumps": ["P14330", "P14312", "P14340", "P14320", "P14350", "P14370"]}, {"id": "P14370", "text": ["Let's start the experiment.", "Let's start the experiment.e...............................", "The PSK Transmitter circuit cards must be aligned as per the PSK Transmitter experiment before entering the PSK Receiver Experiment. If you have not aligned these circuit cards or are unsure whether they are aligned return to the Lesson Menu, select PSK Transmitter Operation and align the circuit cards.", "NOTEEEEEnment is critical for proper system operation."], "jumps": ["P14380", "P14320"]}, {"id": "P14380", "text": ["1.  Set the Test Console controls to the Initial Control Settings.", "1. Set the Test Console controls to the Initial Control Settings.........."], "jumps": ["P14370"]}, {"id": "P14390", "text": ["2.  Install PC130-323 in the PC1 position, PC130-330 in the PC2           position and PC130-331 in the PC3 position.", "3.  On PC130-331, set potentiometers R4, R11 and R20 to mid-             position.", "2. Install PC130-323 in the PC1 position, PC130-330 in the PC2 position and PC130-331 in the PC3 position.", "3. On PC130-331, set potentiometers R4, R11 and R20 to mid- position.."], "jumps": ["P14400", "P14410", "P14390"]}, {"id": "P14410", "text": ["4.  Press Enter to Set: Positive Supply Control - 12\n5.  Press Enter to Set: Negative Supply Control - 12", "6.  Set S1 on PC130-323 to f9 and S5 to 00000000.\n7.  Press Enter to Set: PC1, PC2 and PC3 DC Power - ON", "4. Press Enter to Set: Positive Supply Control - 12 5. Press Enter to Set: Negative Supply Control - 12", "6. Set S1 on PC130-323 to f9 and S5 to 00000000. 7. Press Enter to Set: PC1, PC2 and PC3 DC Power - ON ON"], "jumps": []}, {"id": "P14580", "text": ["The PSK modulator is aligned and transmitting PSK data to the demodulator.  The demodulator is not aligned yet.  Let's align the PSK demodulator.", "The PSK modulator is aligned a let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
