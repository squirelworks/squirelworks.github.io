const book = {"title": "9395B311", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: PHASE SHIFT KEYING CIRCUIT OPERATIONdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Observe the operation of a typical PSK modulator. w Measure signals in a typical PSK modulator.", "w Observe the operation of a typical PSK demodulator. w Measure signals in a typical PSK demodulator........................."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P301", "text": [], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P341", "text": [], "jumps": []}, {"id": "P400", "text": ["An operational Phase Shift Keying system requires a Modulator (Transmitter), Demodulator (Receiver) and transmission medium."], "jumps": ["P410", "P301"]}, {"id": "P410", "text": ["In the first part of the experiment, you will set up, align and observe the signals in the transmitter or modulator."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["In the second part of the experiment, you will set up, align and observe the signals in the receiver or demodulator."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Transmission media used in PSK systems are air, wires, cables and optical fibers.  The Test Console provides the transmission medium by making internal wire connections.", "Transmission media used in PSK systems are air, wires, cables and optical fibers. The Test Console provides the transmission medium by making internal wire connections."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["The circuits used contain ICs.  The ICs are made of familiar digital components.", "The circuits used contain ICs. The ICs are made of familiar digital components..."], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["The full schematic shows how the circuits are put together to make a basic PSK/QPSK system."], "jumps": ["P460", "P400"]}, {"id": "P460", "text": ["Let's begin the lesson on PSK CIRCUIT OPERATION..........................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1020", "text": ["The incoming digital input signal of a PSK Modulator causes the carrier to phase-shift by some pre-defined amount.  In the QPSK (Quadrature Phase Shift Keying) modulator below, the signal is  phase shifted in increments of 90\u00ba.", "The incoming digital input signal of a PSK Modulator causes the carrier to phase-shift by some pre-defined amount. In the QPSK (Quadrature Phase Shift Keying) modulator below, the signal is phase shifted in increments of 90"], "jumps": ["P1040", "P1001"]}, {"id": "P1040", "text": ["The modulator circuit is on PC130-330 and consists of the components necessary to transmit PSK/QPSK data."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The carrier signal is generated by IC1, an ICL8038 voltage controlled oscillator (VCO).  Two capacitors, C1 and C2 are used to set the carrier frequency (\u0083c) to 8 kHz.", "The carrier signal is generated by IC1, an ICL8038 voltage controlled oscillator (VCO). Two capacitors, C1 and C2 are used to set the carrier frequency ("], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["There are three outputs from IC1: a sine wave (used by the switching network), a square wave (used by the timing circuits), and a triangular wave (not used in this experiment).", "There are three outputs from IC1: a sine wave (used by the switching network), a square wave (used by the timing circuits), and a triangular wave (not used in this experiment)..."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["The switching network consists of inverting and non-inverting op-amps as seen in this simplified schematic."], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["IC2a provides a 0\u00ba phase shift signal and IC2d provides a 180\u00ba signal.  An RC circuit is used to shift the carrier 90\u00ba, then IC2b produces a 90\u00ba signal and IC2c provides a 270\u00ba signal.", "phase shift signal and IC2d provides a 180", "signal. An RC circuit is used to shift the carrier 90"], "jumps": ["P1090", "P1080"]}, {"id": "P1090", "text": ["The four different phase signals are then applied to the data selector circuit."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["The A and B inputs determine the output of the data selector, or modulator.  The output is amplified by an op-amp and then transmitted.", "The A and B inputs determine the output of the data selector, or modulator. The output is amplified by an op-amp and then transmitted."], "jumps": ["P1110", "P1100"]}, {"id": "P1110", "text": ["A simple binary count at the A and B inputs selects the X input as follows:en in the simplified schematic.", "AB X 00 X0 01 X1 10 X2 11 X3333333333333333333333"], "jumps": ["P1120", "P1090"]}, {"id": "P1120", "text": ["The A and B data selector inputs are controlled by the timing circuit, control register, SYNC cycle generator and digital information signal."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["When digital information other than all zeroes is present at the Control Register, no SYNC cycle is generated.  Let's examine circuit operation under these conditions first.", "When digital information other than all zeroes is present at the Control Register, no SYNC cycle is generated. Let's examine circuit operation under these conditions first. tions first."], "jumps": ["P1140", "P1100"]}, {"id": "P1140", "text": ["The square wave from the carrier signal generator (\u0083c) passes through TP3 and is inverted by IC5a.  Inverting the carrier signal delays timing by 1/2 cycle.", "The square wave from the carrier signal generator (", "c) passes through TP3 and is inverted by IC5a. Inverting the carrier signal delays timing by 1/2 cycle."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["The timing circuit produces a frequency that is 2 times the carrier frequency.  The doubled carrier frequency (2\u0083c) is transferred through TP6 to the Clock input of the register.", "The timing circuit produces a frequency that is 2 times the carrier frequency. The doubled carrier frequency (2", "c) is transferred through TP6 to the Clock input of the register."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["The 2\u0083c signal on TP6 is also applied to a counter's clock input.  The Q0 output of the counter is 2\u0083c \u00f7 2 or \u0083c.  \u0083c is routed through TP13 to the register Load input (L).", "c signal on TP6 is also applied to a counter's clock input. The Q0 output of the counter is 2", "c is routed through TP13 to the register Load input (L)."], "jumps": ["P1170", "P1130"]}, {"id": "P1170", "text": ["The control register now has the 2 necessary signals for PSK and QPSK timing, \u0083c and 2\u0083c.", "The control register now has the 2 necessary signals for PSK and QPSK timing,"], "jumps": ["P1180", "P1130"]}, {"id": "P1180", "text": ["Register output signals Q0 and Q1 pass through XOR gates IC6d and IC6c.  Because there is no SYNC pulse, each XOR gate has a constant LOW applied to 1 input so the data on t.", "Register output signals Q0 and Q1 pass through XOR gates IC6d and IC6c. Because there is no SYNC pulse, each XOR gate has a constant LOW applied to 1 input so the data on t.", "Register output signals Q0 and Q1 pass through XOR gates IC6d and IC6c. Because there is no SYNC pulse, each XOR gate has a constant LOW applied to 1 input so the data on the other input are simply passed on to the Data Selector chip."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["The data selector (IC3) output is a phase shifted signal determined by the Information Input."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["The SYNC cycle generator causes a unique pattern to appear at the circuit card's output.  Let's examine circuit conditions when a SYNC cycle occurs.", "The SYNC cycle generator causes a unique pattern to appear at the circuit card's output. Let's examine circuit conditions when a SYNC cycle occurs."], "jumps": ["P1210", "P1180"]}, {"id": "P1210", "text": ["The SYNC output of IC7(b) Q3 is normally LOW, causing a low at TP14 and XOR gates IC6(c) and (d).", "The SYNC output of IC7(b) Q3 is normally LOW, causing a low at TP14 and XOR gates IC6(c) and (d). e data selector."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["When the SYNC cycle occurs, a HIGH is sent from IC7(b) Q3 to TP14 and the XOR gates at IC6(c) and (d)."], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["If the A and B inputs to IC3 are anything except 00, the Y1, Y2 or Y3 input to IC3 connects to the Y output.  Since they're all tied together, it doesn't matter which one is selected; the output of Y is still a high.", "If the A and B inputs to IC3 are anything except 00, the Y1, Y2 or Y3 input to IC3 connects to the Y output. Since they're all tied together, it doesn't matter which one is selected; the output of Y is still a high..."], "jumps": ["P1240", "P1200"]}, {"id": "P1240", "text": ["A SYNC cycle is not generated when HIGH data is being transmitted because IC7(b) keeps getting reset.", "A SYNC cycle is not generated when HIGH data is being transmitted because IC7(b) keeps getting reset.tor will reset the counter."], "jumps": ["P1250", "P1200"]}, {"id": "P1250", "text": ["On the other hand, if the A and B inputs are both low, the ground (LOW) on Y0 is connected to the Y output.  With the Y output low, IC7(b) is not reset.  It continues to count.", "On the other hand, if the A and B inputs are both low, the ground (LOW) on Y0 is connected to the Y output. With the Y output low, IC7(b) is not reset. It continues to count."], "jumps": ["P1260", "P1200"]}, {"id": "P1260", "text": ["After 16 consecutive zero data cycles, IC7(b) Q3 becomes HIGH.  A SYNC cycle will now be generated.", "After 16 consecutive zero data cycles, IC7(b) Q3 becomes HIGH. A SYNC cycle will now be generated."], "jumps": ["P1270", "P1200"]}, {"id": "P1270", "text": ["phase shift which lasts for only one-half cycle."], "jumps": ["P1280", "P1200"]}, {"id": "P1280", "text": ["During the 15th zero data cycle, a 0\u00ba phase signal is produced, as is normal with a 0 data input.", "phase signal is produced, as is normal with a 0 data input.3 becomes HIGH and the counter stops. A SYNC cycle will now be generated."], "jumps": ["P1290", "P1200"]}, {"id": "P1290", "text": ["On the 16th data bit, a 0\u00ba phase signal is still produced because the Q3 output of IC7(b) is delayed 1/2 cycle.  The delay is created when the carrier frequency is inverted by IC5a.", "phase signal is still produced because the Q3 output of IC7(b) is delayed 1/2 cycle. The delay is created when the carrier frequency is inverted by IC5a.."], "jumps": ["P1300", "P1200"]}, {"id": "P1300", "text": ["On the second half of the 16th cycle IC7(b) Q3 goes HIGH. The HIGH is input at IC6(c) and (d), which are only receiving zeroes from the control register (IC8) Q0 and Q1. IC6 (c) and (d) then pass the highs on to IC3 at the A and B inputs."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["The HIGH on data selector inputs A and B connects Y3 input to Y output and X3 input to X output.  This is the 1/2 cycle delay caused by signal inverting.  It results in two things happening.", "The HIGH on data selector inputs A and B connects Y3 input to Y output and X3 input to X output. This is the 1/2 cycle delay caused by signal inverting. It results in two things happening."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["First, it causes only the second half of the sixteenth data bit to be inverted.  This means that the first half of the cycle, the positive-going part of the sine wave, is normal.  Then the second half, which would be going negative, is inverted so that it also goes positive.", "First, it causes only the second half of the sixteenth data bit to be inverted. This means that the first half of the cycle, the positive-going part of the sine wave, is normal. Then the second half, which would be going negative, is inverted so that it also goes positive..."], "jumps": ["P1330", "P1300", "P1325"]}, {"id": "P1322", "text": ["First, it causes only the second half of the sixteenth data bit to be inverted.  This means that the first half of the cycle, the positive-going part of the sine wave, is normal.  Then the second half, which would be going negative, is inverted so that it also goes positive.", "First, it causes only the second half of the sixteenth data bit to be inverted. This means that the first half of the cycle, the positive-going part of the sine wave, is normal. Then the second half, which would be going negative, is inverted so that it also goes positive..."], "jumps": ["P1330", "P1300", "P1325"]}, {"id": "P1325", "text": ["XOR GATES - With a HIGH on one input of a XOR gate, the other input is inverted on the output."], "jumps": ["P1322"]}, {"id": "P1330", "text": ["Second, the high output from IC3 Y resets the IC7(b) counter and stops the sync cycle from continuing into a 17th cycle, so that the next cycle is again a normal sine wave, starting with a positive-going half.", "Second, the high output from IC3 Y resets the IC7(b) counter and stops the sync cycle from continuing into a 17th cycle, so that the next cycle is again a normal sine wave, starting with a positive-going half.f."], "jumps": ["P1340", "P1322"]}, {"id": "P1340", "text": ["This means that there have now been three consecutive positive-going halves of sine waves.  This very distinctive pattern of three positive half waves is the sync cycle.", "This means that there have now been three consecutive positive-going halves of sine waves. This very distinctive pattern of three positive half waves is the sync cycle.."], "jumps": ["P1350", "P1322"]}, {"id": "P1350", "text": ["When the HIGH Y output of IC3 resets the counter, TP14 becomes LOW and DATA input from IC8 again feeds into IC6d and IC6c."], "jumps": ["P1360", "P1322"]}, {"id": "P1360", "text": ["The circuit has returned to normal operation.", "Examine the PC130-330 card and notice that the only control is the OUTPUT level control, R21.", "The circuit has returned to normal operation. ich allows data transfer to the data selector inputs A and B.", "Examine the PC130-330 card and notice that the only control is the OUTPUT level control, R21. rol, R21."], "jumps": ["P1370", "P1322", "P1400"]}, {"id": "P1400", "text": ["Let's start the experiment."], "jumps": ["P1410", "P1370"]}, {"id": "P1410", "text": ["1.  Set the Test Console controls to the Initial Control Settings.", "1. Set the Test Console controls to the Initial Control Settings.........."], "jumps": ["P1370"]}, {"id": "P1440", "text": ["2.  Insert PC130-323 into the PC1 connectors on the test console.      This card supplies the digital data to the PSK/QPSK                          modulator.", "2. Insert PC130-323 into the PC1 connectors on the test console. This card supplies the digital data to the PSK/QPSK modulator. ......................."], "jumps": ["P1410"]}, {"id": "P1450", "text": ["3.  On PC130-323, set the controls as follows:", "3. On PC130-323, set the controls as follows: the PC1 DC switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON.........................................", "a. R2, R17, R29 to mid-position b. S1, FREQUENCY RANGE, to f9 c. S2, FREQ, to LO d. S3, DATA, to SET e. S4, OUTPUT, to CMOS f. S5, DATA SET, to 00000000", "Q S2 - LO S5 - 00000000 S3 - SET R2 - Mid-Position", "MEASUREMENT SETUP - S1 - f9 S4 - CMOS S2 - LO S5 - 00000000 S3 - SET R2 - Mid-Position R17 - Mid-Position R29 - Mid-Position"], "jumps": ["P1440", "P1455", "P"]}, {"id": "P1458", "text": ["DATA SET SWITCH - Switch S5 is an eight section DIP switch. When the rocker for any one of the eight sections is depressed in towards the word \"OPEN\", the switch is producing a 0 data bit. If the rocker for any one of the eight switches is depressed in towards the NUMBER (1 through 8), the switch is closed producing a 1 data bit. To enter a 00000000, all rockers are pressed in towards the word \"OPEN\"."], "jumps": []}, {"id": "P1460", "text": ["4.  Insert PC130-330 into the PC2 connectors on the Test                      Console.", "5.  On PC130-330, set the OUTPUT potentiometer fully counter            clockwise.", "4. Insert PC130-330 into the PC2 connectors on the Test Console.", "5. On PC130-330, set the OUTPUT potentiometer fully counter clockwise.."], "jumps": ["P1470", "P1450", "P1472", "P1460"]}, {"id": "P1472", "text": ["6.  Set the Positive Supply Control to 12.  The Voltmeter on the           130A should indicate 12 Volts. \n7.  Set the Negative Supply Control to 12.  The Voltmeter on the          130A should indicate 12 Volts.", "6. Set the Positive Supply Control to 12. The Voltmeter on the 130A should indicate 12 Volts. 7. Set the Negative Supply Control to 12. The Voltmeter on the 130A should indicate 12 Volts.", "Alignment is critical for proper system operation.", "NOTEEEEEnment is critical for proper system operation."], "jumps": ["P1470"]}, {"id": "P1480", "text": ["8.  Set the PC1 DC switch to ON.  You will first set up the data              source card to 8 kHz, the design frequency of the PSK/QPSK        demodulator.", "9.  Using the internal frequency counter in the function generator      or a separate frequency counter (an oscilloscope can be                 used), adjust PC130-323 C4 for a 8 kHz, \u00b1.5 kHz signal as                measured on TP6.", "8. Set the PC1 DC switch to ON. You will first set up the data source card to 8 kHz, the design frequency of the PSK/QPSK demodulator.", "9. Using the internal frequency counter in the function generator or a separate frequency counter (an oscilloscope can be used), adjust PC130-323 C4 for a 8 kHz,", ".5 kHz signal as measured on TP6."], "jumps": ["P1472", "P1500", "P1480"]}, {"id": "P1500", "text": ["10.  Set the PC2 DC switch to ON.  You will now do a fine                         adjustment of the PC130-323 card to match the frequency               used in the PSK/QPSK modulator.  The modulator is                         designed for 8 kHz but, due to component tolerances, \u0083c                may not be exactly 8 kHz.", "10. Set the PC2 DC switch to ON. You will now do a fine adjustment of the PC130-323 card to match the frequency used in the PSK/QPSK modulator. The modulator is designed for 8 kHz but, due to component tolerances,", "c may not be exactly 8 kHz."], "jumps": ["P1490"]}, {"id": "P1510", "text": ["11.  Set the oscilloscope up as follows:", "11. Set the oscilloscope up as follows:...................", "a. Volts/Div - CH1 & CH2 - 5 b. Time/Div - 20 ms c. Triggering - CH1, AC, + d. Display - Dual, DC S4, OUTPUT, to CMOS f. S5, DATA SET, to 00000000"], "jumps": ["P1520", "P1500", "P1515"]}, {"id": "P1515", "text": ["12.  Connect CH1 to PC130-330 TP3.  This is the square wave                output of the carrier signal generator.", "13.  Connect CH2 to PC130-323 TP2.", "14.  Adjust PC130-323 R29 to synchronize the CH2 trace if                     needed.\n15.  Disconnect the oscilloscope probes and frequency counter           from the circuit.", "OSCILLOSCOPE - Volts/Div - CH1 - 5 Triggering - CH1, AC, + Volts/Div - CH2 - 5 Display - Dual, DC Time/Div - 20 ms", "12. Connect CH1 to PC130-330 TP3. This is the square wave output of the carrier signal generator.", "13. Connect CH2 to PC130-323 TP2..........................", "14. Adjust PC130-323 R29 to synchronize the CH2 trace if needed. 15. Disconnect the oscilloscope probes and frequency counter from the circuit."], "jumps": ["P1530", "P1510", "P1520", "P1550", "P"]}, {"id": "P1550", "text": ["The data source card is now producing the correct data frequency for the PSK/QPSK Modulator circuit.  Let's check the timing signals in the PSK/QPSK Modulator.", "The data source card is now producing the correct data frequency for the PSK/QPSK Modulator circuit. Let's check the timing signals in the PSK/QPSK Modulator."], "jumps": ["P1560", "P1540"]}, {"id": "P1560", "text": ["1.  Using the internal frequency counter in the function generator      or a separate frequency counter (an oscilloscope can be                 used), measure the frequency on PC130-330 TP2 (CLOCK).            Type in the frequency measured on PC130-330 TP2.", "1. Using the internal frequency counter in the function generator or a separate frequency counter (an oscilloscope can be used), measure the frequency on PC130-330 TP2 (CLOCK). Type in the frequency measured on PC130-330 TP2."], "jumps": ["P1550", "P1562", "P1565"]}, {"id": "P1561", "text": [], "jumps": []}, {"id": "P1562", "text": ["Your measurement is not correct.  Ensure you are measuring PC130-330 TP2.", "Your measurement is not correct. Ensure you are measuring PC130-330 TP2.", "MEASUREMENT SETUP - Measure the frequency on PC130-330 TP2 (CLOCK)."], "jumps": []}, {"id": "P1567", "text": ["You still have not entered the correct frequency.  It should be approximately 8 kHz.", "You still have not entered the correct frequency. It should be approximately 8 kHz."], "jumps": ["P1560"]}, {"id": "P1570", "text": ["2.  Using the internal frequency counter in the function generator      or a separate frequency counter (an oscilloscope can be                 used), measure the frequency on PC130-330 TP6 (CLOCK).            Type the frequency measured.", "2. Using the internal frequency counter in the function generator or a separate frequency counter (an oscilloscope can be used), measure the frequency on PC130-330 TP6 (CLOCK). Type the frequency measured."], "jumps": ["P1560", "P1575", "P1572"]}, {"id": "P1571", "text": [], "jumps": []}, {"id": "P1572", "text": ["Your measurement is not correct.  Ensure you are measuring PC130-330 TP6.", "Your measurement is not correct. Ensure you are measuring PC130-330 TP6.", "MEASUREMENT SETUP - Measure the frequency on PC130-330 TP6."], "jumps": []}, {"id": "P1577", "text": ["You still have not entered the correct frequency.  It should be approximately 16 kHz.", "You still have not entered the correct frequency. It should be approximately 16 kHz."], "jumps": ["P1570"]}, {"id": "P1580", "text": ["Notice that the 2\u0083c frequency is twice the \u0083c frequency.  The timing signals in the PSK/QPSK circuit are correct for 8 kHz data and 16kHz data.", "c frequency. The timing signals in the PSK/QPSK circuit are correct for 8 kHz data and 16kHz data.", "c = CH1 & CH2 - 5 b. Time/Div - 20 ms c. Triggering - CH1, AC, + d. Display - Dual, DC S4, OUTPUT, to CMOS f. S5, DATA SET, to 00000000"], "jumps": ["P1590", "P1570"]}, {"id": "P1590", "text": ["Now let's look at the outputs of the phase shifting network.  Connect oscillowcope CH1 to", "Now let's look at the outputs of the phase shifting network. Connect oscillowcope CH1 to", "Now let's look at the outputs of the phase shifting network. Connect oscilloscope CH1 to TP7 and CH2 to TP8..."], "jumps": ["P1610", "P1580"]}, {"id": "P1610", "text": ["4.  Compare the CH1 trace to the CH2 trace.  What is the phase           relationship between the TP7 and TP8 signals?", "4. Compare the CH1 trace to the CH2 trace. What is the phase relationship between the TP7 and TP8 signals?"], "jumps": ["P1590"]}, {"id": "P1611", "text": [], "jumps": []}, {"id": "P1612", "text": ["Use the position controls of the oscilloscope and overlap the CH1 and CH2 traces.  Notice that there is not a phase difference.", "Use the position controls of the oscilloscope and overlap the CH1 and CH2 traces. Notice that there is not a phase difference."], "jumps": []}, {"id": "P1620", "text": ["5.  Move the CH2 probe to PC130-330 TP9 and compare the CH1        trace to the CH2 trace.  What is the phase relationship                      between the TP7 and TP9 signals?", "5. Move the CH2 probe to PC130-330 TP9 and compare the CH1 trace to the CH2 trace. What is the phase relationship between the TP7 and TP9 signals?"], "jumps": ["P1610"]}, {"id": "P1621", "text": [], "jumps": []}, {"id": "P1622", "text": ["Use the position controls of the oscilloscope and overlap the CH1 and CH2 traces.  Notice the phase difference is 1/4 of a cycle.", "Use the position controls of the oscilloscope and overlap the CH1 and CH2 traces. Notice the phase difference is 1/4 of a cycle."], "jumps": []}, {"id": "P1630", "text": ["6.  Move the CH2 probe to PC130-330 TP10 and compare the               CH1 trace to the CH2 trace.  What is the phase relationship             between the TP7 and TP10 signals?", "6. Move the CH2 probe to PC130-330 TP10 and compare the CH1 trace to the CH2 trace. What is the phase relationship between the TP7 and TP10 signals?"], "jumps": ["P1620"]}, {"id": "P1631", "text": [], "jumps": []}, {"id": "P1632", "text": ["Use the position controls of the oscilloscope and overlap the CH1 and CH2 traces.  Notice the difference is 1/2 of a cycle.", "Use the position controls of the oscilloscope and overlap the CH1 and CH2 traces. Notice the difference is 1/2 of a cycle."], "jumps": []}, {"id": "P1640", "text": ["7.  Move the CH2 probe to PC130-330 TP11 and compare the               CH1 trace to the CH2 trace.  What is the phase relationship             between the TP7 and TP11 signals?", "7. Move the CH2 probe to PC130-330 TP11 and compare the CH1 trace to the CH2 trace. What is the phase relationship between the TP7 and TP11 signals?"], "jumps": ["P1630"]}, {"id": "P1641", "text": [], "jumps": []}, {"id": "P1642", "text": ["Use the position controls of the oscilloscope and overlap the CH1 and CH2 traces.  Notice the phase difference is 3/4 of a cycle.", "Use the position controls of the oscilloscope and overlap the CH1 and CH2 traces. Notice the phase difference is 3/4 of a cycle."], "jumps": []}, {"id": "P1650", "text": ["The four phases viewed were developed by the phase switching network.  Now let's view the SYNC cycle.", "1.  Ensure that PC130-323 S5 switches are all open, se00000000.            This ensures that 0 data is applied to the PSK/QPSK                         modulator.  After 16 0 data bits, a SYNC cycle will be                          generated.", "The four phases viewed were developed by the phase switching network. Now let's view the SYNC cycle. efore data was applied.", "1. Ensure that PC130-323 S5 switches are all open, se00000000. This ensures that 0 data is applied to the PSK/QPSK modulator. After 16 0 data bits, a SYNC cycle will be generated.", "1. Ensure that PC130-323 S5 switches are all open, sending a data stream of 00000000. This ensures that 0 data is applied to the PSK/QPSK modulator. After 16 0 data bits, a SYNC cycle will be generated."], "jumps": ["P1660", "P1640", "P1670", "P1650"]}, {"id": "P1670", "text": ["2.  Set the oscilloscope as follows:", "2. Set the oscilloscope as follows:.......................", "a. Volts/Div - As required b. Time/Div - 0.5 ms c. Triggering - EXT, AC, - d. Display - Dual, AC S4, OUTPUT, to CMOS f. S5, DATA SET, to 00000000"], "jumps": ["P1680", "P1660", "P1675"]}, {"id": "P1675", "text": ["3.  Connect the external trigger of the oscilloscope to PC130-330        TP14. \n4.  Move the CH2 probe to the \u0083  Out TP on PC130-330.  Keep              CH1 on TP7.", "OSCILLOSCOPE - Volts/Div - As Required Time/Div - 0.5 ms Triggering - EXT, AC, - Display - Dual, AC", "3. Connect the external trigger of the oscilloscope to PC130-330 TP14. 4. Move the CH2 probe to the", "Out TP on PC130-330. Keep CH1 on TP7."], "jumps": ["P1690", "P1670"]}, {"id": "P1690", "text": ["Look at the CH2 trace.  You should see at least one SYNC cycle. Notice how the SYNC cycle stands out.  Adjust the trigger hold off and the trigger level as necessary to stabilize the signal.  Adjust the oscilloscope as necessary to see the SYNC cycle.  If the cycle appears inverted, turn PC2 DC POWER OFF and back ON.", "Look at the CH2 trace. You should see at least one SYNC cycle. Notice how the SYNC cycle stands out. Adjust the trigger hold off and the trigger level as necessary to stabilize the signal. Adjust the oscilloscope as necessary to see the SYNC cycle. If the cycle appears inverted, turn PC2 DC POWER OFF and back ON.C2 Power OFF and ON while observing the oscilloscope and the output."], "jumps": ["P1700", "P1680"]}, {"id": "P1700", "text": ["5.  Change the Time/Div control on the oscilloscope to 0.2 ms             and use the Time/Div Variable control to view one SYNC cycle.      Notice the three positive half cycles.", "Now, let's look at the output when data is applied to the modulator in the PSK mode.", "1.  Change the external trigger source of the oscilloscope to                PC130-323 TP3.  CH1 should still be connected to PC130-330        TP7 and CH2 to PC130-330 TP \u0083  Out.", "5. Change the Time/Div control on the oscilloscope to 0.2 ms and use the Time/Div Variable control to view one SYNC cycle. Notice the three positive half cycles.", "1. Change the external trigger source of the oscilloscope to PC130-323 TP3. CH1 should still be connected to PC130-330 TP7 and CH2 to PC130-330 TP"], "jumps": ["P1710", "P1690", "P1720", "P1730"]}, {"id": "P1730", "text": ["2.  Set the Time/Div Variable to calibrated.  Adjust the triggering           level to stabilize the display if needed.  The signals you see            are a SYNC cycle and 0 degree phase signals.  This is                      because HIGH data has not been applied.  Adjust the                        oscilloscope as necessary to see at least 2 SYNC cycles.", "3.  Close the number 1 switch on PC130-323 S5 (depress the                rocker toward the number 1).  Notice that the SYNC cycle is            no longer present.  HIGH data is being applied.  You should            see a phase shifted signal that represents a 1 along with the \n      0 degree phase signals.", "2. Set the Time/Div Variable to calibrated. Adjust the triggering level to stabilize the display if needed. The signals you see are a SYNC cycle and 0 degree phase signals. This is because HIGH data has not been applied. Adjust the oscilloscope as necessary to see at least 2 SYNC cycles.", "3. Close the number 1 switch on PC130-323 S5 (depress the rocker toward the number 1). Notice that the SYNC cycle is no longer present. HIGH data is being applied. You should see a phase shifted signal that represents a 1 along with the 0 degree phase signals."], "jumps": ["P1740", "P1720", "P1750", "P1730"]}, {"id": "P1750", "text": ["4.  Change the Time/Div control to 50 ms and adjust the triggering       level if needed.  You should see about 4 cycles of \u0083  on CH1.          Also notice the 180\u00ba phase shift for the 1 data bit.", "4. Change the Time/Div control to 50 ms and adjust the triggering level if needed. You should see about 4 cycles of"], "jumps": ["P1760", "P1740"]}, {"id": "P1760", "text": ["5.  Change the Time/Div control to 0.2 ms and adjust the Time/Div       Variable control to display 16 complete cycles of \u0083c on CH1.          The CH2 trace shows two 180 degree phase shifts.  With 16            cycles shown on the oscilloscope and the data source card           sending 8 bits, you are seeing two complete sets of data.", "6.  Close the number 2 switch on PC130-323 S5, leaving the                 number 1 switch closed.  You are now sending 11000000.               Observe that there are two cycles next to each other on the    CH2 trace and that they are 180\u00ba phase shifted.", "5. Change the Time/Div control to 0.2 ms and adjust the Time/Div Variable control to display 16 complete cycles of", "c on CH1. The CH2 trace shows two 180 degree phase shifts. With 16 cycles shown on the oscilloscope and the data source card sending 8 bits, you are seeing two complete sets of data.", "6. Close the number 2 switch on PC130-323 S5, leaving the number 1 switch closed. You are now sending 11000000. Observe that there are two cycles next to each other on the CH2 trace and that they are 180"], "jumps": ["P1770", "P1750", "P1780", "P1760"]}, {"id": "P1780", "text": ["7.  Apply various combinations of data to the PSK modulator              using S5 on PC130-323.  You should be able to recognize the        phase shifts as compared to the reference signal, \u0083c.", "7. Apply various combinations of data to the PSK modulator using S5 on PC130-323. You should be able to recognize the phase shifts as compared to the reference signal,"], "jumps": ["P1790", "P1770"]}, {"id": "P1790", "text": ["Now, let's look at QPSK operation.", "1.  Place all switches on PC130-323 S5 to OPEN.\n2.  Place switch numbers 4, 5 and 6 to closed.", "3.  Change the Time/Div control to 0.1 ms.  DO NOT CHANGE the       Time/Div Variable control. \n4.  On PPlace S1, Frequency Range on PC130-323, place Frequency           Range switch S1 to f8 (one step counterclockwise).", "Now, let's look at QPSK operation..........................", "1. Place all switches on PC130-323 S5 to OPEN. 2. Place switch numbers 4, 5 and 6 to closed.", "3. Change the Time/Div control to 0.1 ms. DO NOT CHANGE the Time/Div Variable control. 4. On PPlace S1, Frequency Range on PC130-323, place Frequency Range switch S1 to f8 (one step counterclockwise). i", "3. Change the Time/Div control to 0.1 ms. DO NOT CHANGE the Time/Div Variable control. 4. On PC130-323, place Frequency Range switch S1 to f8 (one step counterclockwise). rclockwise)."], "jumps": ["P1800", "P1780", "P1810", "P1790", "P1820"]}, {"id": "P1820", "text": ["5.  Ensure CH1 is connected to PC130-330 TP7, CH2 is                          connected to PC130-330 \u0083  Out TP, and the external trigger is         connected to PC130-323 TP3.  Look closely at CH2 (QPSK              data), and compare it to CH1.", "5. Ensure CH1 is connected to PC130-330 TP7, CH2 is connected to PC130-330", "Out TP, and the external trigger is connected to PC130-323 TP3. Look closely at CH2 (QPSK data), and compare it to CH1."], "jumps": ["P1830", "P1810"]}, {"id": "P1830", "text": ["You will be able to see two or three different phase shifts.  Remember, a 00 generates 0 degrees, a 11 generates 180 degrees, a 01 generates 90 degrees and a 10 generates 270 degrees.", "You will be able to see two or three different phase shifts. Remember, a 00 generates 0 degrees, a 11 generates 180 degrees, a 01 generates 90 degrees and a 10 generates 270 degrees.", "It may be necessary to adjust the trigger to stabilize the waveforms.", "NOTEEEEEnment is critical for proper system operation."], "jumps": ["P1840", "P1820"]}, {"id": "P1840", "text": ["6.  Change the digital information applied to the QPSK modulator       by using S5 on PC130-323.  Be sure that you can pick out the        four different phase shift signals.", "6. Change the digital information applied to the QPSK modulator by using S5 on PC130-323. Be sure that you can pick out the four different phase shift signals."], "jumps": ["P1850", "P1830", "P1845"]}, {"id": "P1845", "text": ["PHASE SHIFTED SIGNALS - The four phase shift system is called quadrature phase shift keying, QPSK for short."], "jumps": []}, {"id": "P1850", "text": ["You have seen how the PSK/QPSK modulator operates.  Last, you will measure the rest of the signals in the circuit.", "You have seen how the PSK/QPSK modulator operates. Last, you will measure the rest of the signals in the circuit."], "jumps": ["P1860", "P1840"]}, {"id": "P1860", "text": ["1.  Using the CH2 probe, measure the signals at test points 1                through 17 and compare them to CH1.", "1. Using the CH2 probe, measure the signals at test points 1 through 17 and compare them to CH1."], "jumps": ["P1870", "P1850"]}, {"id": "P1870", "text": ["You have aligned and measured signals in the PSK modulator circuit.  The circuit takes a digital information input and uses it to phase modulate an analog signal.  The types of signals on the test points will be important when troubleshooting.", "You have aligned and measured signals in the PSK modulator circuit. The circuit takes a digital information input and uses it to phase modulate an analog signal. The types of signals on the test points will be important when troubleshooting."], "jumps": ["P1880", "P1860"]}, {"id": "P1880", "text": ["1.  Return the Test Console to the Initial Control Settings.", "1. Return the Test Console to the Initial Control Settings................"], "jumps": ["P1870"]}, {"id": "P1890", "text": ["2.  Set the Console Power Switch to OFF.", "2. Set the Console Power Switch to OFF...................."], "jumps": ["P1880"]}, {"id": "P1900", "text": ["3.  Disconnect all Test Equipment.\n4.  Carefully remove experiment cards.\n5.  Return all equipment to designated storage areas.", "3. Disconnect all Test Equipment. 4. Carefully remove experiment cards. 5. Return all equipment to designated storage areas."], "jumps": ["P1910", "P1890"]}, {"id": "P1910", "text": ["This completes the experiment on PSK TRANSMITTERS.", "This completes the experiment on PSK TRANSMITTERS.E........"], "jumps": ["P1900"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["The receiver of a PSK/QPSK system demodulates the transmitted data received from the modulator.", "The receiver circuit is contained on PC130-331 and consists of the components necessary to demodulate PSK/QPSK signals."], "jumps": ["P2040", "P2001", "P2050", "P2020"]}, {"id": "P2040", "text": ["The receiver circuit is contained on PC130-331 and consists of the components necessary to demodulate PSK/QPSK signals."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["The PSK/QPSK signal is applied to op-amp IC1b where it is amplified and shaped."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["The output level is controlled by SYNC control R4 and is applied to the full wave rectifier."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["IC1a, IC1d and D1 through D4 make up the full wave rectifier."], "jumps": ["P2080", "P2050"]}, {"id": "P2080", "text": ["The ripple output of the rectifier controls the PLL circuit (IC2), producing a frequency of 32     .  This is adjusted by R20 the Adjust.", "The ripple output of the rectifier controls the PLL circuit (IC2), producing a frequency of 32 . This is adjusted by R20 the Adjust."], "jumps": ["P2090", "P2050"]}, {"id": "P2090", "text": ["The 32\u0083c frequency is amplified by Q1 and applied to IC3a, the counter.  This action develops 2\u0083c and 4\u0083c.", "c frequency is amplified by Q1 and applied to IC3a, the counter. This action develops 2"], "jumps": ["P2100", "P2050"]}, {"id": "P2100", "text": ["Timing for the entire circuit is dependent on outputs Q2 (4\u0083c) and Q3 (2\u0083c) of IC3a.", "Timing for the entire circuit is dependent on outputs Q2 (4"], "jumps": ["P2110", "P2050"]}, {"id": "P2110", "text": ["IC1c receives its input from IC1b."], "jumps": ["P2120", "P2050"]}, {"id": "P2120", "text": ["IC1c is set by R11, the OFFSET control.  IC1c changes the analog signal to digital by operating in cutoff or saturation.", "IC1c is set by R11, the OFFSET control. IC1c changes the analog signal to digital by operating in cutoff or saturation."], "jumps": ["P2130", "P2050"]}, {"id": "P2130", "text": ["The digital data passes through IC5a and IC5c for buffering, and then to the SYNC detector and register.", "The digital data passes through IC5a and IC5c for buffering, and then to the SYNC detector and register..."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["First, let's look at the SYNC detector."], "jumps": ["P2150", "P2120"]}, {"id": "P2150", "text": ["The RC circuit connected to the RESET input resets the SYNC detector if the digital data has a 0 degree phase shift, or is 1100."], "jumps": ["P2160", "P2120"]}, {"id": "P2160", "text": ["If the digital data is 0011, 0110 or 1001 the circuit is not reset and the output of IC6a remains HIGH."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["This means no SYNC cycle is present.  The HIGH output of IC6a is used in the rest of the circuit to indicate that the SYNC cycle was not received.", "This means no SYNC cycle is present. The HIGH output of IC6a is used in the rest of the circuit to indicate that the SYNC cycle was not received."], "jumps": ["P2180", "P2150"]}, {"id": "P2180", "text": ["If the digital input is 0111, a SYNC cycle, the output of IC6a is LOW.", "If the digital input is 0111, a SYNC cycle, the output of IC6a is LOW..."], "jumps": ["P2190", "P2150"]}, {"id": "P2190", "text": ["The LOW output of IC6a is used in the rest of the circuit to indicate that a SYNC cycle was received."], "jumps": ["P2210", "P2150"]}, {"id": "P2210", "text": ["s the analog signal to digital by operating in cutoff or saturation.", "Remember that in the process of converting the QPSK analog signal to digital data, only the last two bits of the four are used to indicate the wave's phase. Therefore only the Q2 and Q3 outputs of IC7 are used."], "jumps": ["P2190", "P2220"]}, {"id": "P2220", "text": ["The Q2 and Q3 outputs are routed to IC8, which converts the data to serial form by alternately reading first one bit and then the other."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["The Q2 and Q3 outputs of the register are applied to NAND gates that are enabled at opposite times by the inverter."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["This serial data is then set to IC8c.", "This serial data is then set to IC8c.8c..nd is applied to IC8c."], "jumps": ["P2250", "P2220"]}, {"id": "P2250", "text": ["IC8c is enabled only when a HIGH is applied from the SYNC detector (no SYNC cycle).   If LOW, the data out of IC8c is always a HIGH.", "IC8c is enabled only when a HIGH is applied from the SYNC detector (no SYNC cycle). If LOW, the data out of IC8c is always a HIGH."], "jumps": ["P2260", "P2220"]}, {"id": "P2260", "text": ["IC9 inverts the data to the original polarity.  The output is the digital information that was applied to the PSK/QPSK modulator.", "IC9 inverts the data to the original polarity. The output is the digital information that was applied to the PSK/QPSK modulator."], "jumps": ["P2270", "P2220"]}, {"id": "P2270", "text": ["Finally, IC3b is the counter that develops the LOAD signal to the register."], "jumps": ["P2280", "P2220"]}, {"id": "P2280", "text": ["The Q1 output, \u0083c is applied to the register's LOAD input.", "c is applied to the register's LOAD input."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["The signal is also used to set the timing for IC8 (changing the parallel output to serial)."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["The reset input to the counter is from either its own Q2 output when the count reaches four, or from the SYNC cycle detector."], "jumps": ["P2310", "P2280"]}, {"id": "P2310", "text": ["Remember, when the incoming QPSK signal was converted to a digital signal, it was divided into four bits.  Even though only two bits are used as data, all four must be counted.", "Remember, when the incoming QPSK signal was converted to a digital signal, it was divided into four bits. Even though only two bits are used as data, all four must be counted."], "jumps": ["P2320", "P2280", "P2315"]}, {"id": "P2312", "text": ["Remember, when the incoming QPSK signal was converted to a digital signal, it was divided into four bits.  Even though only two bits are used as data, all four must be counted.", "Remember, when the incoming QPSK signal was converted to a digital signal, it was divided into four bits. Even though only two bits are used as data, all four must be counted."], "jumps": ["P2320", "P2280", "P2315"]}, {"id": "P2315", "text": ["Now, examine the PC130-331 card. Notice that it has three controls: R4 (Sync), R11 (Offset), and R20 (      Adjust).", "FOUR PARTS OF DIGITAL DATA - Remember, the conversion from analog to digital makes four parts to each phase of the PSK/QPSK signal.", "Now, examine the PC130-331 card. Notice that it has three controls: R4 (Sync), R11 (Offset), and R20 ( Adjust).", "R11 adjusts the cutoff and saturation points of IC1c. The amplifier is used to change the analog signal to digital.", "R4 controls the ripple frequency to the PLL circuit, SYNC. change the analog signal to digital.", "R20 is used to adjust the PLL circuit for a 32", "c output. change the analog signal to digital."], "jumps": ["P2330", "P2310", "P2320", "P2340", "P2350", "P2370"]}, {"id": "P2370", "text": ["Let's start the experiment.", "Let's start the experiment.e...............................", "The PSK Transmitter circuit cards must be aligned as per the PSK Transmitter experiment before entering the PSK Receiver Experiment. If you have not aligned these circuit cards or are unsure whether they are aligned, return to the Lesson Menu, select PSK Transmitter Operation and align the circuit cards.", "NOTEEEEEnment is critical for proper system operation."], "jumps": ["P2380", "P2320"]}, {"id": "P2380", "text": ["1.  Set the Test Console controls to the Initial Control Settings.", "1. Set the Test Console controls to the Initial Control Settings.........."], "jumps": ["P2370"]}, {"id": "P2390", "text": ["2.  Install PC130-323 in the PC1 position, PC130-330 in the PC2           position and PC130-331 in the PC3 position.", "3.  On PC130-331, set potentiometers R4, R11 and R20 to mid-             position.", "2. Install PC130-323 in the PC1 position, PC130-330 in the PC2 position and PC130-331 in the PC3 position. to ON.........................................", "3. On PC130-331, set potentiometers R4, R11 and R20 to mid- position.."], "jumps": ["P2380", "P2410", "P2390", "P"]}, {"id": "P2410", "text": ["4.  Set the Positive Supply Control to 12.  The Voltmeter on the           130A should indicate 12 Volts. \n5.  Set the Negative Supply Control to 12.  The Voltmeter on the          130A should indicate 12 Volts.", "6.  Set S1 on PC130-323 to f 9 and S5 to 00000000.\n7.  Set the PC1, PC2 and PC3 DC switches to ON.", "4. Set the Positive Supply Control to 12. The Voltmeter on the 130A should indicate 12 Volts. 5. Set the Negative Supply Control to 12. The Voltmeter on the 130A should indicate 12 Volts.", "6. Set S1 on PC130-323 to f 9 and S5 to 00000000. 7. Set the PC1, PC2 and PC3 DC switches to ON."], "jumps": ["P2400", "P2410"]}, {"id": "P2580", "text": ["The PSK modulator is aligned and transmitting PSK data to the demodulator.  The demodulator is not aligned yet.  Let's align the PSK demodulator.", "The PSK modulator is aligned and transmitting PSK data to the demodulator. The demodulator is not aligned yet. Let's align the PSK demodulator."], "jumps": ["P2590", "P2420"]}, {"id": "P2590", "text": ["1.  Set the oscilloscope as follows:", "1. Set the oscilloscope as follows:........  PC130-331 R20 for approximately the value of 4", "c = = CH1 & CH2 - 5 b. Time/Div - 20 ms c. Triggering - CH1, AC, + d. Display - Dual, DC S4, OUTPUT, to CMOS f. S5, DATA SET, to 00000000", "MEASUREMENT SETUP - Connect the frequency counter through a 4.7 kohm resistor to PC130-331 TP7."], "jumps": ["P2710", "P2690", "P2705"]}, {"id": "P2708", "text": ["4.7 kohm RESISTOR - The 4.7 kohm resistor is used to attenuate the signal on TP7 to get an accurate measurement."], "jumps": []}, {"id": "P2710", "text": ["5.  Disconnect the frequency counter.\n6.  Place PC2 DC Power switch to ON.  The PLL circuit is now             aligned.", "5. Disconnect the frequency counter. 6. Place PC2 DC Power switch to ON. The PLL circuit is now aligned."], "jumps": ["P2700"]}, {"id": "P2720", "text": ["The last alignment is the amplifier that changes the analog PSK/QPSK signal to digital pulses."], "jumps": ["P2730", "P2710"]}, {"id": "P2730", "text": ["1.  Set the oscilloscope for an external trigger from PC130-323            TP3.  Triggering EXT, AC, Negative.\n2.  Connect the CH1 probe to PC130-330 TP7, \u0083c.\n3.  Connect the CH2 probe to PC130-331 TP2.  This is IC1c's                output.", "1. Set the oscilloscope for an external trigger from PC130-323 TP3. Triggering EXT, AC, Negative. 2. Connect the CH1 probe to PC130-330 TP7,", "c. 3. Connect the CH2 probe to PC130-331 TP2. This is IC1c's output.", "MEASUREMENT SETUP - Connect the CH1 probe to PC130-330 TP7.", "MEASUREMENT SETUP - Connect the CH2 probe to PC130-331 TP1."], "jumps": ["P2740", "P2720", "P2735", "P2736", "P2730"]}, {"id": "P2740", "text": ["4.  Adjust the oscilloscope Time/Div and Time/Div Variable                    controls to display two cycles of \u0083c on channel 1 (about 20 ms).", "4. Adjust the oscilloscope Time/Div and Time/Div Variable controls to display two cycles of"], "jumps": ["P2750", "P2730"]}, {"id": "P2750", "text": ["wavas seen on CH2 is about 40% of the positive alternation as seen on CH1.", "5. Adjust PC130-331 R11 so that the HIGH level of the square wave on CH2 is about 80% of the width of the positive half of the sine wave seen on CH1."], "jumps": ["P2760", "P2740", "P2755"]}, {"id": "P2752", "text": ["5.  Adjust PC130-331 R11 so that the HIGH level of the square             wave on CH2 is about 80% of the width of the positive half of         the sine wave seen on CH1.", "5. Adjust PC130-331 R11 so that the HIGH level of the square wave on CH2 is about 80% of the width of the positive half of the sine wave seen on CH1.", "MEASUREMENT SETUP - Adjust PC130-331 R11."], "jumps": ["P2760", "P2740", "P2755"]}, {"id": "P2760", "text": ["Remember, the analog signal (as seen on channel 1) drives an amplifier into either cutoff or saturation (as seen on channel 2).  You have adjusted the amplifier to produce a HIGH during the positive half of the sine wave.", "Remember, the analog signal (as seen on channel 1) drives an amplifier into either cutoff or saturation (as seen on channel 2). You have adjusted the amplifier to produce a HIGH during the positive half of the sine wave.in a phase shifted signal like what is seen on CH1, drives an amplifier into cutoff or saturation as seen on CH2. You have adjusted the amplifier to produce a HIGH during the positive alternation."], "jumps": ["P2770", "P2752"]}, {"id": "P2770", "text": ["The demodulator is set up and aligned.  However, you may have to make slight adjustments to R11, OFFSET control, to fully adjust the circuit when data is applied.", "The demodulator is set up and aligned. However, you may have to make slight adjustments to R11, OFFSET control, to fully adjust the circuit when data is applied."], "jumps": ["P2780", "P2752"]}, {"id": "P2780", "text": ["1. Ensure that S5 on PC130-323 is set to 00000000 and S1 is set to f9. 2. Connect the CH1 probe to PC130-330 TP1, DATA IN and set the channel to DC coupling. 3. Connect the CH2 probe to PC130-331 TP10, DATA, and set the channel to DC coupling.", "MEASUREMENT SETUP - Set S1 to f9. Ensure that S5 is set to 00000000.", "MEASUREMENT SETUP - Connect the CH1 probe to PC130-330 TP1.", "MEASUREMENT SETUP - Connect the CH2 probe to PC130-331 TP10."], "jumps": ["P2790", "P2770", "P2785", "P2786", "P2787", "P2780"]}, {"id": "P2790", "text": ["4.  Change the Time/Div control to 50 ms calibrated.  The CH2 trace       (output of demodulator) should match the CH1 trace (the CH1          trace is the applied digital data to the modulator).  If not, then            continue.  You will make an adjustment next.  Be sure that                 the traces are not a steady DC voltage greater than 0 volts.", "5.  If the CH2 trace is not 0 VDC, or if pulses appear, slightly                 adjust PC130-331 R11 so that there are no pulses visible.  The       demodulator circuit is changing PSK into digital information,         all zeroes at this point.", "4. Change the Time/Div control to 50 ms calibrated. The CH2 trace (output of demodulator) should match the CH1 trace (the CH1 trace is the applied digital data to the modulator). If not, then continue. You will make an adjustment next. Be sure that the traces are not a steady DC voltage greater than 0 volts.", "5. If the CH2 trace is not 0 VDC, or if pulses appear, slightly adjust PC130-331 R11 so that there are no pulses visible. The demodulator circuit is changing PSK into digital information, all zeroes at this point."], "jumps": ["P2800", "P2780"]}, {"id": "P2810", "text": ["6.  Close the number 1 switch on PC130-323 S5.\n7.  Using the Time/Div Variable control, adjust the oscilloscope           sweep so that one complete cycle is shown on the CH1 trace        (leading edge of HIGH pulse to leading edge of next HIGH               pulse).", "6. Close the number 1 switch on PC130-323 S5. 7. Using the Time/Div Variable control, adjust the oscilloscope sweep so that one complete cycle is shown on the CH1 trace (leading edge of HIGH pulse to leading edge of next HIGH pulse).", "If synchronization is lost, return S5 PC130-323 switches to 00000000 to generate a SYNC cycle.entering the PSK Receiver Experiment. If you have not aligned these circuit cards or are unsure whether they are aligned return to the Lesson Menu, select PSK Transmitter Operation and align the circuit cards.", "NOTEEEEEnment is critical for proper system operation."], "jumps": ["P2820", "P2800"]}, {"id": "P2820", "text": ["You should be viewing one pulse on channel 2, the output of the demodulator. If not touch HELP. The output signal HIGH is shorter than the input HIGH and is not at the same time. This is due to the circuits in the PSK/QPSK system and the triggering of the oscilloscope. The PSK system is receiving one HIGH bit and seven LOW bits. The output is one HIGH bit and seven LOW bits."], "jumps": ["P2830", "P2810", "P2825"]}, {"id": "P2825", "text": ["8.  Close the switches on S5 of PC130-323 and view the output of       the demodulator.  Compare the input digital signal to the                 output digital signal.  The system operates correctly in PSK.", "a. Slightly adjust PC130-331 R11 to bring in one HIGH pulse on CH2. b. Change the switch setting in S5 on PC130-323 to 00000000. c. Verify that the channel 2 trace is all zeroes. If not, slightly adjust PC130-331 R11 so no pulses are visible. d. Change the switch setting in S5 on PC130-323 to 100000000. If a HIGH pulse is not present on CH2, repeat steps. e. You may need slight adjustments of R20 also to get the correct m", "c signal. Adjust all potentiometers slowly while using the oscilloscope.cilloscope.oscope.cope.pe.", "NO PULSE ON CHANNEL 2 - The circuit still needs fine adjustment.", "8. Close the switches on S5 of PC130-323 and view the output of the demodulator. Compare the input digital signal to the output digital signal. The system operates correctly in PSK."], "jumps": ["P2840", "P2820", "P"]}, {"id": "P2840", "text": ["9.  On PC130-323, set S1 to the f8 position, one position CCW.    10.  Vary the data input to the modulator using different switch              setting on S5 of PC130-323.  The system is now in QPSK.", "9. On PC130-323, set S1 to the f8 position, one position CCW. 10. Vary the data input to the modulator using different switch setting on S5 of PC130-323. The system is now in QPSK.", "If synchronization is lost, return S5 PC130-323 switches to 00000000 to generate a SYNC cycle.entering the PSK Receiver Experiment. If you have not aligned these circuit cards or are unsure whether they are aligned return to the Lesson Menu, select PSK Transmitter Operation and align the circuit cards.", "NOTEEEEEnment is critical for proper system operation.", "MEASUREMENT SETUP - Set S1 to the f8 position. Vary S5."], "jumps": ["P2850", "P2830", "P2845"]}, {"id": "P2850", "text": ["Notice that two frames of data now appear.  The frequency of the data is at 2\u0083c.  Also, the output data is different.  Remember, the data inputs are now either 00, 01, 10 or 11.  Depending on the        triggering of the oscilloscope, an input of 11 may produce a 11, 01 10 or 10 01 data output.", "11.  Return S1 to the f9 position on PC130-323.  The PSK/QPSK            system is back to PSK.", "Notice that two frames of data now appear. The frequency of the data is at 2", "c. Also, the output data is different. Remember, the data inputs are now either 00, 01, 10 or 11. Depending on the triggering of the oscilloscope, an input of 11 may produce a 11, 01 10 or 10 01 data output.", "11. Return S1 to the f9 position on PC130-323. The PSK/QPSK system is back to PSK.."], "jumps": ["P2860", "P2840", "P2870", "P2850"]}, {"id": "P2870", "text": ["You have seen how the PSK/QPSK demodulator operates.  Last, you will measure the rest of the signals in the circuit.", "1.  Connect the CH1 probe to PC130-331 TP1, PSK signal input.  2.  Using the CH2 probe and comparing to the CH1 trace,                     measure the signals on test points 2 through 10.", "You have seen how the PSK/QPSK demodulator operates. Last, you will measure the rest of the signals in the circuit.", "1. Connect the CH1 probe to PC130-331 TP1, PSK signal input. 2. Using the CH2 probe and comparing to the CH1 trace, measure the signals on test points 2 through 10."], "jumps": ["P2880", "P2860", "P2890", "P2870"]}, {"id": "P2890", "text": ["You have aligned and measured signals in the PSK demodulator circuit.  The circuit takes a PSK/QPSK signal and produces the original digital information signal.  The type of signals on the test  points will be important when troubleshooting.", "You have aligned and measured signals in the PSK demodulator circuit. The circuit takes a PSK/QPSK signal and produces the original digital information signal. The type of signals on the test points will be important when troubleshooting."], "jumps": ["P2892", "P2880"]}, {"id": "P2892", "text": ["1.  Return the Test Console to the Initial Control Settings.", "1. Return the Test Console to the Initial Control Settings................"], "jumps": ["P2890"]}, {"id": "P2893", "text": ["2.  Set the Console Power Switch to OFF.", "2. Set the Console Power Switch to OFF...................."], "jumps": ["P2892"]}, {"id": "P2894", "text": ["3.  Disconnect all Test Equipment.\n4.  Carefully remove experiment card.\n5.  Return all equipment to designated storage areas.", "3. Disconnect all Test Equipment. 4. Carefully remove experiment card. 5. Return all equipment to designated storage areas."], "jumps": ["P2910", "P2893"]}, {"id": "P2910", "text": ["This completes the experiment on PSK RECEIVERS.", "This completes the experiment on PSK RECEIVERS.ITLE........"], "jumps": ["P2001", "P2894"]}, {"id": "P13020", "text": ["The incoming digital input signal of a PSK Modulator causes the carrier to phase-shift by some pre-defined amount.  In the QPSK (Quadrature Phase Shift Keying) modulator below, the signal is  phase shifted in increments of 90\u00ba.", "The incoming digital input signal of a PSK Modulator causes the carrier to phase-shift by some pre-defined amount. In the QPSK (Quadrature Phase Shift Keying) modulator below, the signal is phase shifted in increments of 90"], "jumps": ["P13040", "P1001"]}, {"id": "P13040", "text": ["The modulator circuit is on PC130-330 and consists of the components necessary to transmit PSK/QPSK data."], "jumps": ["P13050", "P13020"]}, {"id": "P13050", "text": ["The carrier signal is generated by IC1, an ICL8038 voltage controlled oscillator (VCO).  Two capacitors, C1 and C2 are used to set the carrier frequency (\u0083c) to 8 kHz.", "The carrier signal is generated by IC1, an ICL8038 voltage controlled oscillator (VCO). Two capacitors, C1 and C2 are used to set the carrier frequency ("], "jumps": ["P13060", "P13020"]}, {"id": "P13060", "text": ["There are three outputs from IC1: a sine wave (used by the switching network), a square wave (used by the timing circuits), and a triangular wave (not used in this experiment).", "There are three outputs from IC1: a sine wave (used by the switching network), a square wave (used by the timing circuits), and a triangular wave (not used in this experiment)....."], "jumps": ["P13070", "P13020"]}, {"id": "P13070", "text": ["The switching network consists of inverting and non-inverting op-amps as seen in the simplified schematic."], "jumps": ["P13080", "P13020"]}, {"id": "P13080", "text": ["IC2a provides 0\u00ba phase shift signal and IC2d provides a 180\u00ba signal.  An RC circuit is used to shift the carrier 90\u00ba then IC2b produces a 90\u00ba signal and IC2c provides a 270\u00ba signal.", "phase shift signal and IC2d provides a 180", "signal. An RC circuit is used to shift the carrier 90"], "jumps": ["P13090", "P13070"]}, {"id": "P13090", "text": ["The four different phase signals are then applied to the data selector circuit."], "jumps": ["P13100", "P13070"]}, {"id": "P13100", "text": ["The A and B inputs determine the output of the data selector, or modulator.  The output is amplified by an op-amp and then transmitted.", "The A and B inputs determine the output of the data selector, or modulator. The output is amplified by an op-amp and then transmitted."], "jumps": ["P13110", "P13090"]}, {"id": "P13110", "text": ["A simple binary count at the A and B inputs selects the X input as follows:en in the simplified schematic.", "AB X 00 X0 01 X1 10 X2 11 X33333333333333333333333"], "jumps": ["P13120", "P13100"]}, {"id": "P13120", "text": ["The A and B data selector inputs are controlled by the timing circuit, control register, SYNC cycle generator and Digital information signal."], "jumps": ["P13130", "P13110"]}, {"id": "P13130", "text": ["When digital information other than all zeroes is present at the Control Register, no SYNC cycle is generated.  Let's examine circuit operation under these conditions first.", "When digital information other than all zeroes is present at the Control Register, no SYNC cycle is generated. Let's examine circuit operation under these conditions first. r these conditions first."], "jumps": ["P13140", "P13100"]}, {"id": "P13140", "text": ["The square wave from the carrier signal generator (\u0083c) passes through TP3 and is inverted by IC5a.  Inverting the carrier signal delays timing by 1/2 cycle.", "The square wave from the carrier signal generator (", "c) passes through TP3 and is inverted by IC5a. Inverting the carrier signal delays timing by 1/2 cycle."], "jumps": ["P13150", "P13130"]}, {"id": "P13150", "text": ["The timing circuit produces a frequency that is 2 times the carrier frequency.  The doubled carrier frequency (2\u0083c) is transferred through TP6 to the Clock input of the register.", "The timing circuit produces a frequency that is 2 times the carrier frequency. The doubled carrier frequency (2", "c) is transferred through TP6 to the Clock input of the register."], "jumps": ["P13160", "P13130"]}, {"id": "P13160", "text": ["The 2\u0083c signal on TP6 is also applied to a counter's clock input.  The Q0 output of the counter is 2\u0083c \u00f7  2 or \u0083c.  \u0083c is routed through TP13 to the register Load input (L).", "c signal on TP6 is also applied to a counter's clock input. The Q0 output of the counter is 2", "c is routed through TP13 to the register Load input (L)."], "jumps": ["P13170", "P13130"]}, {"id": "P13170", "text": ["The control register now has the 2 necessary signals for PSK and QPSK timing, \u0083c and 2\u0083c.", "The control register now has the 2 necessary signals for PSK and QPSK timing,"], "jumps": ["P13180", "P13130"]}, {"id": "P13180", "text": ["Register output signals Q0 and Q1 pass through XOR gates IC6d and IC6c. Because there is no SYNC pulse, each XOR gate has a constant LOW applied to 1 input.", "Register output signals Q0 and Q1 pass through XOR gates IC6d and IC6c. Because there is no SYNC pulse, each XOR gate has a constant LOW applied to 1 input so the data on the other input are simply passed on to the Data Selector chip."], "jumps": ["P13190", "P13170"]}, {"id": "P13190", "text": ["The data selector (IC3) output is a phase shifted signal determined by the information input."], "jumps": []}, {"id": "P13200", "text": ["The SYNC cycle generator causes a unique pattern to appear at the circuit card's output (TP17).  Let's examine circuit conditions when a SYNC cycle occurs.", "The SYNC cycle generator causes a unique pattern to appear at the circuit card's output (TP17). Let's examine circuit conditions when a SYNC cycle occurs."], "jumps": ["P13210", "P13180"]}, {"id": "P13210", "text": ["The SYNC output of IC7(b) Q3 is normally LOW, causing a low at TP14 and XOR gates IC6(c) and (d)."], "jumps": ["P13220", "P13200"]}, {"id": "P13220", "text": ["When the SYNC cycle occurs, a HIGH is sent from IC7(b) Q3 to TP14 and the XOR gates at IC6(c) and (d)."], "jumps": ["P13230", "P13200"]}, {"id": "P13230", "text": ["If the A and B inputs to IC3 are anything except 00, the Y1, Y2 or Y3 input to IC3 connects to the Y output.  Since they're all tied together, it doesn't matter which one is selected; the output of Y is still a high.", "If the A and B inputs to IC3 are anything except 00, the Y1, Y2 or Y3 input to IC3 connects to the Y output. Since they're all tied together, it doesn't matter which one is selected; the output of Y is still a high..."], "jumps": ["P13240", "P13200"]}, {"id": "P13240", "text": ["A SYNC cycle is not generated when HIGH data is being transmitted because IC7(b) keeps geeting reset.", "A SYNC cycle is not generated when HIGH data is being transmitted because IC7(b) keeps geeting reset. reset the counter."], "jumps": ["P13250", "P13200"]}, {"id": "P13250", "text": ["On the other hand, if the A and B inputs are both low, the ground (LOW) on Y0 is connected to the Y output.  With the Y output low, IC7(b) is not reset.  It continues to count.", "On the other hand, if the A and B inputs are both low, the ground (LOW) on Y0 is connected to the Y output. With the Y output low, IC7(b) is not reset. It continues to count."], "jumps": ["P13260", "P13200"]}, {"id": "P13260", "text": ["After 16 consecutive zero data cycles, IC7(b) Q3 becomes HIGH.  A SYNC cycle will now be generated.", "After 16 consecutive zero data cycles, IC7(b) Q3 becomes HIGH. A SYNC cycle will now be generated."], "jumps": ["P13270", "P13200"]}, {"id": "P13270", "text": ["phase shift which lasts for only one-half cycle..."], "jumps": ["P13280", "P13200"]}, {"id": "P13280", "text": ["During the 15th zero data cycle, a 0\u00ba phase signal is produced, as is normal with a 0 data input.", "phase signal is produced, as is normal with a 0 data input. he counter stops. A SYNC cycle will now be generated."], "jumps": ["P13290", "P13200"]}, {"id": "P13290", "text": ["On the 16th data bit, a 0\u00ba phase signal is still produced because the Q3 output of IC7(b) is delayed 1/2 cycle.  The delay is created when the carrier frequency is inverted by IC5a.", "phase signal is still produced because the Q3 output of IC7(b) is delayed 1/2 cycle. The delay is created when the carrier frequency is inverted by IC5a.."], "jumps": ["P13300", "P13200"]}, {"id": "P13300", "text": ["On the second half of the 16th cycle IC7(b) Q3 goes HIGH. The HIGH is input at IC6(c) and (d), which are only receiving zeroes from the control register (IC8) Q0 and Q1. IC6 (c) and (d) then pass the highs on to IC3 at the A and B inputs."], "jumps": ["P13310", "P13290"]}, {"id": "P13310", "text": ["The HIGH on data selector inputs A and B connects Y3 input to Y output and X3 input to X output.  This is the 1/2 cycle delay caused by signal inverting.  It results in two things happening.", "The HIGH on data selector inputs A and B connects Y3 input to Y output and X3 input to X output. This is the 1/2 cycle delay caused by signal inverting. It results in two things happening."], "jumps": ["P13320", "P13300"]}, {"id": "P13320", "text": ["First, it causes only the second half of the sixteenth data bit to be inverted. This means that the first half of the cycle, the positive-going part of the sine wave, is normal. Then the second half, which would be going negative, is inverted so that it also goes positive..."], "jumps": ["P13330", "P13300", "P13325"]}, {"id": "P13322", "text": ["First, it causes only the second half of the sixteenth data bit to be inverted.  This means that the first half of the cycle, the positive-going part of the sine wave, is normal.  Then the second half, which would be going negative, is inverted so that it also goes positive.", "First, it causes only the second half of the sixteenth data bit to be inverted. This means that the first half of the cycle, the positive-going part of the sine wave, is normal. Then the second half, which would be going negative, is inverted so that it also goes positive..."], "jumps": ["P13330", "P13300", "P13325"]}, {"id": "P13325", "text": ["XOR GATES - With a HIGH on one input of a XOR gate, the other input is inverted on the output."], "jumps": []}, {"id": "P13330", "text": ["Second, the high output from IC3 Y resets the IC7(b) counter and stops the sync cycle from continuing into a 17th cycle, so that the next cycle is again a normal sine wave, starting with a positive-going half.", "Second, the high output from IC3 Y resets the IC7(b) counter and stops the sync cycle from continuing into a 17th cycle, so that the next cycle is again a normal sine wave, starting with a positive-going half..."], "jumps": ["P13340", "P13322"]}, {"id": "P13340", "text": ["This means that there have now been three consecutive positive-going halves of sine waves.  This very distinctive pattern of three positive half waves is the sync cycle.", "This means that there have now been three consecutive positive-going halves of sine waves. This very distinctive pattern of three positive half waves is the sync cycle."], "jumps": ["P13350", "P13322"]}, {"id": "P13350", "text": ["When the HIGH Y output of IC3 resets the counter, TP14 becomes LOW and DATA input from IC8 again feeds into IC6d and IC6c."], "jumps": ["P13360", "P13322"]}, {"id": "P13360", "text": ["The circuit has returned to normal operation.", "Examine the PC130-330 card and notice that the only control is the OUTPUT level control, R21.", "The circuit has returned to normal operation. sfer to the data selector inputs A and B."], "jumps": ["P13370", "P13322", "P13400"]}, {"id": "P13400", "text": ["Let's start the experiment."], "jumps": ["P13410", "P13370"]}, {"id": "P13410", "text": ["1.  Set the Test Console controls to the Initial Control Settings.", "1. Set the Test Console controls to the Initial Control Settings.........."], "jumps": ["P13370"]}, {"id": "P13440", "text": ["2.  Insert PC130-323 into the PC1 connectors on the test console.      This card supplies the digital data to the PSK/QPSK                          modulator.", "2. Insert PC130-323 into the PC1 connectors on the test console. This card supplies the digital data to the PSK/QPSK modulator."], "jumps": ["P13450"]}, {"id": "P13450", "text": ["3.  On PC130-323, set the controls as follows:", "3. On PC130-323, set the controls as follows:.............", "a. R2, R17, R29 to mid-position b. S1, FREQUENCY RANGE, to f9 c. S2, FREQ, to LO d. S3, DATA, to SET e. S4, OUTPUT, to CMOS f. S5, DATA SET, to 00000000", "MEASUREMENT SETUP - S1 - f9 R17 - Mid-Position S2 - LO R29 - Mid-Position S3 - SET R2 - Mid-Position S4 - CMOS S5 - 00000000"], "jumps": ["P13460", "P13440", "P13455", "P"]}, {"id": "P13458", "text": ["DATA SET SWITCH - Switch S5 is an eight section DIP switch. When the rocker for any one of the eight sections is depressed in towards the word \"OPEN\", the switch is producing a 0 data bit. If the rocker for any one of the eight switches is depressed in towards the NUMBER (1 through 8), the switch is closed producing a 1 data bit. To enter a 00000000, all rockers are pressed in towards the word \"OPEN\"."], "jumps": []}, {"id": "P13460", "text": ["4.  Insert PC130-330 into the PC2 connectors on the Test                      Console.", "5.  On PC130-330, set the OUTPUT potentiometer fully counter            clockwise.", "4. Insert PC130-330 into the PC2 connectors on the Test Console.", "5. On PC130-330, set the OUTPUT potentiometer fully counter clockwise.."], "jumps": ["P13470", "P13450", "P13472", "P13460"]}, {"id": "P13472", "text": ["6.  Press Enter to Set: Positive Supply Control - 12\n7.  Press Enter to Set: Negative Supply Control - 12", "6. Press Enter to Set: Positive Supply Control - 12 7. Press Enter to Set: Negative Supply Control - 12", "Alignment is critical for proper system operation.", "NOTEEEEEnment is critical for proper system operation."], "jumps": []}, {"id": "P13480", "text": ["8.  Press Enter to Set: PC1 DC Power Switch - ON\n     You will first set up the data source card to 8 kHz, the design         frequency of the PSK/QPSK demodulator.", "9.  Using the internal frequency counter in the function generator      or a separate frequency counter (an oscilloscope can be                 used), adju
