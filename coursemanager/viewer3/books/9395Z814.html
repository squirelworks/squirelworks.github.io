nu button. -Penny 02-02-01 P30000, \"accumlated\" to \"accumulated\". P0, changed copyright to 1997 - 2001. -Penny 07-19-01 Converted to ToolBook 8.1. Jay 01-08-02 Changed to Phase II Format. -Penny 09-17-04 Text and Branching completed and checked lesson with trainer. frieda 11-03-04 Graphics. mary 11-12-04 Reviewed branching and graphics text also checked with trainer. frieda 11-16-04 Final graphic and text changes per ray. frieda"], "jumps": []}, {"id": "P10410", "text": ["1. Pressure Sensing and Chip Detection Instr.ments."], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is 30%. Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10223", "text": ["Remove and replace the PC130-241 card with two hands.", "What caution must be taken to prevent damaging the solid-state transducer on the PC130-241 card?", "Completely squeeze the bulb before connecting it to the transducer.", "Partially squeeze the bulb before connecting it to the transducer."], "jumps": []}, {"id": "P10222", "text": ["What aircraft instruments depend on information from the Pitot Static system?"], "jumps": []}, {"id": "P10221", "text": ["What is the barometric pressure at sea level on an average day?"], "jumps": []}, {"id": "P10220", "text": ["What types of pressure measurements can solid-state transducers provide?", "Barometric, Atmoshperic and Differential"], "jumps": []}, {"id": "P10219", "text": ["What does the Red Radial line on the Fuel Pressure gauge indicate?", "Maximum and/or minimum permissible fuel pressure"], "jumps": []}, {"id": "P10218", "text": ["How often should the chip detection system be checked?", "Daily during pre-flight or as directed in published regulations"], "jumps": []}, {"id": "P10217", "text": ["Most hydraulic pressure gauges utilize the _______ operating mechanism.", "evacuated bellows with attached gears, levers and indicator needle"], "jumps": []}, {"id": "P10216", "text": ["What barometric scale setting allows a barometric altimeter to indicate pressure altitude?"], "jumps": []}, {"id": "P10215", "text": ["What pressure is dialed into the Kollsman window of an aneroid altimeter?"], "jumps": []}, {"id": "P10214", "text": ["What is the atmospheric pressure at sea level in pounds per square inch?"], "jumps": []}, {"id": "P10213", "text": ["The type of instruments that provide readings of low or negative pressure, such as manifold pressure gauges, are _______"], "jumps": []}, {"id": "P10212", "text": ["The type of Instruments that measure relatively high fluid pressures, such as oil pressure gauges, are usually _______"], "jumps": []}, {"id": "P10211", "text": ["A Bourdon tube instrument may be used to indicate _______ and _______"], "jumps": []}, {"id": "P10210", "text": ["What instrument is connected to the aircraft's Pitot-static system?"], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P5000", "text": [], "jumps": []}, {"id": "P2910", "text": ["This completes the experiment on PRESSURE TRANSDUCER OPERATION."], "jumps": []}, {"id": "P2800", "text": ["Return all equipment to its designated storage area........"], "jumps": []}, {"id": "P2790", "text": ["Set the test console power switch to OFF.F................................."], "jumps": []}, {"id": "P2780", "text": ["Carefully remove PC130-241 and PC130-242 cards from test console."], "jumps": []}, {"id": "P2770", "text": ["Disconnect the test equipment from the circuit............."], "jumps": []}, {"id": "P2760", "text": ["Press Enter to return Test Console to Initial Control Settings............."], "jumps": []}, {"id": "P2750", "text": ["Press Enter to allow the computer to remove the fault from the pressure indicating system. This concludes the experiment and troubleshooting of the pressure indicating system."], "jumps": []}, {"id": "P2740", "text": ["Notice all the PC130-241: Test Point voltages are correct. A possible fault in the pressure indicating display has occurred. Your required action would be to remove and replace the display PC130-242..."], "jumps": []}, {"id": "P2737", "text": ["Your measurements are still incorrect. The answers should have been as follows:", "PC130-241 Voltage Reading TP1 TP2 TP3 TP7 TP8 PC130-242 Barometric Pressure Reading"], "jumps": []}, {"id": "P2732", "text": ["Check your setup and redo your measurements.a negative sign.............."], "jumps": []}, {"id": "P2731", "text": [], "jumps": []}, {"id": "P2730", "text": ["The computer has placed another fault in the pressure indicating system. What faulted indications are present in the pressure indicating system? PC130-241 Voltage Reading TP1 +X.X VDC (+2.2 to +2.6 VDC) TP2 +XX.X VDC (+9.5 to +10.5 VDC TP3 +X.X VDC (+2 to +5 VDC) TP7 +X.X VDC (+4 to +6 VDC) TP8 +X.X VDC (+4 to +6 VDC) PC130-242 Barometric Pressure Reading XXXX (---0)", "PC130-241 Voltage Reading TP1 VDC TP2 VDC TP3 VDC TP7 VDC TP8 VDC PC130-242 Barometric Pressure Reading"], "jumps": ["P2720"]}, {"id": "P2727", "text": ["Your measurements are still incorrect. The answers should have been as follows:", "PC130-241 Voltage Reading TP1 TP2 TP3 TP7 TP8 PC130-242 Barometric Pressure Reading"], "jumps": []}, {"id": "P2722", "text": ["Check your setup and redo your measurements.a negative sign.............."], "jumps": []}, {"id": "P2721", "text": [], "jumps": []}, {"id": "P2720", "text": ["PC130-241 Voltage Reading TP1 VDC TP2 VDC TP3 VDC TP7 VDC TP8 VDC PC130-242 Barometric Pressure Reading", "Again, perform an initial assessment. Check for proper digital display. If necessary, adjust PC130-241, R8, to local barometric pressure. Measure and record the voltages at PC130-241 TP1, TP2, TP3, TP7 and TP8. )))))-241 Voltage Reading TP1 +X.X VDC (+2.2 to +2.6 VDC) TP2 +XX.X VDC (+9.5 to +10.5 VDC TP3 +X.X VDC (+2 to +5 VDC) TP7 +X.X VDC (+4 to +6 VDC) TP8 +X.X VDC (+4 to +6 VDC) PC130-242 Barometric Pressure Reading XXXX (2990 to 3300)"], "jumps": []}, {"id": "P2710", "text": ["Notice the 10 VDC sensor regulator voltage at TP7 and TP8 is 0 VDC indicating an open circuit. Your required action would be to remove and replace the pressure-sensing unit (PC130-241)."], "jumps": ["P2700", "PC130"]}, {"id": "P2707", "text": ["Your measurements are still incorrect. The answers should have been as follows:", "PC130-241 Voltage Reading TP1 TP2 TP3 TP7 TP8 PC130-242 Barometric Pressure Reading"], "jumps": []}, {"id": "P2702", "text": ["Check your setup and redo your measurements.ing abnormal conditions......"], "jumps": []}, {"id": "P2701", "text": [], "jumps": []}, {"id": "P2700", "text": ["What faulted indications are present in the pressure indicating system? PC130-241 Voltage Reading TP1 +X.X VDC (+2.2 to +2.6 VDC) TP2 +XX.X VDC (+9.5 to +10.5 VDC TP3 +X.X VDC (+2 to +5 VDC) TP7 +X.X VDC (+0 VDC) TP8 +X.X VDC (+0 VDC) PC130-242 Barometric Pressure Reading XXXX (2000-2800)", "PC130-241 Voltage Reading TP1 VDC TP2 VDC TP3 VDC TP7 VDC TP8 VDC PC130-242 Barometric Pressure Reading"], "jumps": []}, {"id": "P2690", "text": ["Press Enter to allow the computer to place another fault in the pressure indicating system."], "jumps": ["P2680"]}, {"id": "P2687", "text": ["Your measurements are still incorrect. The answers should have been as follows:", "PC130-241 Voltage Reading TP1 TP2 TP3 TP7 TP8 PC130-242 Barometric Pressure Reading"], "jumps": []}, {"id": "P2682", "text": ["Check your setup, the system should be displaying abnormal conditions......"], "jumps": []}, {"id": "P2681", "text": [], "jumps": []}, {"id": "P2680", "text": ["PC130-241 Voltage Reading TP1 VDC TP2 VDC TP3 VDC TP7 VDC TP8 VDC PC130-242 Barometric Pressure Reading", "Again, perform an initial assessment. Check for proper digital display. If necessary, adjust PC130-241, R8, to local barometric pressure. Measure and record the voltages at PC130-241 TP1, TP2, TP3, TP7 and TP8. PC130-241 Voltage Reading TP1 +X.X VDC (+2.2 to +2.6 VDC) TP2 +XX.X VDC (+9.5 to +10.5 VDC TP3 +X.X VDC (+2 to +5 VDC) TP7 +X.X VDC (+4 to +6 VDC) TP8 +X.X VDC (+4 to +6 VDC) PC130-242 Barometric Pressure Reading XXXX (2990 to 3300)))"], "jumps": []}, {"id": "P2670", "text": ["Press Enter to allow the computer to remove the fault from the system........"], "jumps": []}, {"id": "P2660", "text": ["Notice the voltage at TP3 is 0 VDC. Also note, adjusting PC130-241 R8 fully CCW and then fully CW, has no affect on the output at TP3. Your required action would be to remove and replace the pressure-sensing unit (PC130-241).."], "jumps": ["P2650", "PC130"]}, {"id": "P2657", "text": ["You measurements are still incorrect. The answers should have been as follows:", "PC130-241 Voltage Reading TP1 TP2 TP3 TP7 TP8 PC130-242 Barometric Pressure Reading"], "jumps": []}, {"id": "P2652", "text": ["Check your setup, the system should be displaying abnormal conditions......"], "jumps": []}, {"id": "P2651", "text": [], "jumps": []}, {"id": "P2650", "text": ["Measure and record the voltages at PC130-241 TP1, TP2, TP3, TP7 and TP8. PC130-241 Voltage Reading TP1 +X.X VDC (+2.2 to +2.6 VDC) TP2 +XX.X VDC (+9.5 to +10.5 VDC TP3 +X.X VDC (+0 VDC) TP7 +X.X VDC (+4 to +6 VDC) TP8 +X.X VDC (+4 to +6 VDC) PC130-242 Barometric Pressure Reading XXXX (---0)", "PC130-241 Voltage Reading TP1 VDC TP2 VDC TP3 VDC TP7 VDC TP8 VDC PC130-242 Barometric Pressure Reading"], "jumps": ["P2640"]}, {"id": "P2640", "text": ["Notice that the PC130-190 display changed and now reads _ _ _ 0."], "jumps": []}, {"id": "P2630", "text": ["Press ENTER to allow the computer to insert a fault into the pressure transducer indicating system. he PC1 and PC2 DC Power Switches cannot be turned off manually to measure resistance. Make sure to not adjust R3 during the troubleshooting phase.ase.", "The PC1 and PC2 DC Power Switches cannot be turned off manually to measure resistance. Make sure to not adjust R3 during the troubleshooting phase."], "jumps": []}, {"id": "P2620", "text": ["Press Enter to Set the PC1 and PC2 DC Power Switches - ON.................."], "jumps": []}, {"id": "P2610", "text": ["Verify the span error is corrected and calibrated for inches of mercury, by measuring a resistance of 517 W between PC130-241 TP7 and TP8. If necessary, adjust R3 for a reading of 517 W..."], "jumps": []}, {"id": "P2600", "text": ["Press Enter to Set the PC1 and PC2 DC Power Switches - OFF................."], "jumps": []}, {"id": "P2590", "text": ["Verify +10 VDC at PC130-241 TP2. Verify +2.5 VDC at PC130-241 TP1."], "jumps": []}, {"id": "P2580", "text": ["Adjust the offset potentiometer, PC130-241 R8, until the PC130-242 display shows the actual barometric pressure provided by the weather service or airport."], "jumps": []}, {"id": "P2570", "text": ["Let's look at some troubleshooting problems associated with the pressure transducer indicating system. First, verify the local barometric pressure by calling the airport, or by looking online."], "jumps": []}, {"id": "P2560", "text": ["Remember, aircraft instruments can only be calibrated by the manufacturer or by an FAA approved repair site certified for the actual instrument."], "jumps": []}, {"id": "P2550", "text": ["The Pitot Static system flight instruments, altimeter, airspeed, angle of attack etc. will be discussed in more detail in the Flight Instruments lessons."], "jumps": []}, {"id": "P2540", "text": ["The reverse phrase, Low to High Plenty of Sky, indicates the plane is lower than the actual altitude. If the crew failed to raise the Kollsman setting to 3010, the altimeter would indicate an altitude lower than the actual altitude..."], "jumps": []}, {"id": "P2530", "text": ["If the flight crew failed to lower the Kollsman setting to 2995, the altimeter would indicate an altitude higher than the actual altitude of the aircraft, which could cause the aircraft to fly into a mountain..."], "jumps": []}, {"id": "P2520", "text": ["When an aircraft flies from one location with a higher pressure (3010) to a lower pressure (2995), the phrase, High to Low Look Out Below is used to warn the flight crew of a potential altitude error..."], "jumps": []}, {"id": "P2510", "text": ["Setting the wrong barometric pressure in the Kollsman window of an aircraft altimeter will cause the altimeter to indicate the wrong altitude and could be a fatal mistake."], "jumps": []}, {"id": "P2500", "text": ["Open your hand to release the pressure on the squeeze bulb. Notice the displayed barometric pressure decreases back to normal with a corresponding decrease in the measured voltage at PC130-241 TP6........"], "jumps": []}, {"id": "P2490", "text": ["Notice the displayed barometric pressure increases consistent with an increase in the voltage at PC130-241 TP6. As the aircraft descends, the pressure normally increases."], "jumps": []}, {"id": "P2480", "text": ["Close the relief cap and ensure the bulb is attached to the A probe of U2. Caution, gently squeeze the bulb to increase the pressure on the diaphragm in the pressure transducer. ulb to increase the pressure on the diaphragm in the pressure transducer. ARD WILL PERMANENTLY DAMAGE THE SENSOR.", "Over-Pressurizing the pressure transducer (U2) on the PC130-241 Card will permanently damage the sensor..........................ANENTLY DAMAGE THE SENSOR."], "jumps": []}, {"id": "P2470", "text": ["Open the relief cap to release the pressure in the squeeze bulb. As the suction is released, the displayed barometric pressure should return to the local setting with a corresponding increase in the voltage at PC130-241 TP6.241 TP6."], "jumps": []}, {"id": "P2460", "text": ["While observing the VDC at PC130-241 TP6, slowly open your hand to release the Pressure squeeze bulb to produce a pressure differential on the pressure transducer U2. Notice the displayed barometric pressure decreases consistent with a decrease in the voltage at PC130-241 TP6..."], "jumps": []}, {"id": "P2450", "text": ["Close the pressure bleed-off valve, and squeeze the air out of the pressure bulb. Carefully connect the suction side of the Pressure Squeeze bulb tubing on the A probe of the pressure transducer. UTION: OVER-PRESSURIZING THE PRESSURE TRANSDUCER (U2) ON THE PC130-241 CARD WILL PERMANENTLY DAMAGE THE SENSOR...", "Over-Pressurizing the pressure transducer (U2) on the PC130-241 Card will permanently damage the sensor..........................ANENTLY DAMAGE THE SENSOR."], "jumps": []}, {"id": "P2440", "text": ["Using a multimeter with alligator leads; connect the Black lead to PC130-241 TP6 (ground) and the Red lead to PC130-241 TP1 (Output). The voltage should read between 2.90 and 3.5 VDC."], "jumps": []}, {"id": "P2430", "text": ["Ideally, if our barometer was portable you could take it up in an aircraft or even an elevator to observe the barometric pressure changes. The SCX15ANC Altitude - Pressure - Temperature chart displays the anticipated values to changes in altitude.itude............."], "jumps": []}, {"id": "P2420", "text": ["Call the local airport or weather station, or go online and establish the local barometric pressure setting. Adjust PC130-241, R8; offset error potentiometer, until the PC130-242 display shows the current barometric pressure setting..."], "jumps": []}, {"id": "P2410", "text": ["Adjust PC130-242 Input potentiometer R1 to Maximum clockwise (CW) position."], "jumps": []}, {"id": "P2400", "text": ["Press Enter to Set the PC1 and PC2 DC Power switches - ON.................."], "jumps": []}, {"id": "P2390", "text": ["Using the multimeter set to the 2 kW range, measure RT (R2 + R3) span error control adjustment between TP7 and TP8. Adjust R3 to 517 W to correspond with the recommended adjustment in inches of mercury to alleviate the sensor span error..."], "jumps": []}, {"id": "P2380", "text": ["Press Enter to Set the PC1 and PC2 DC Power switches - OFF................."], "jumps": ["P2370"]}, {"id": "P2370", "text": ["Verify the voltage output of V1 is +2.5 VDC ( 0.05 VDC) with the multimeter at TP1 on PC130-241."], "jumps": []}, {"id": "P2360", "text": ["With the multimeter at PC130-241, TP2, adjust R1 on PC130-241 to read +10 VDC. The R1 adjustment provides the regulated +10 VDC for the pressure sensor U2."], "jumps": []}, {"id": "P2350", "text": ["Press Enter to Set the PC1 and PC2 DC power switches - ON.................."], "jumps": []}, {"id": "P2340", "text": ["Over-Pressurizing the pressure transducer (U2) on the PC130-241 Card will permanently damage the sensor. PRESSURE TRANSDUCER (U2) ON THE PC130-241 CARD WILL PERMANENTLY DAMAGE THE SENSOR."], "jumps": []}, {"id": "P2330", "text": ["On the PC130-242 card, set the S1 switch to C/I............"], "jumps": []}, {"id": "P2320", "text": ["Press Enter to set : Positive Power Supply - 12 Negative Power Supply - 12"], "jumps": []}, {"id": "P2310", "text": ["Carefully plug the PC130-241 into the PC1 position and the PC130-242 into the PC2 position of test console."], "jumps": []}, {"id": "P2300", "text": ["Set Test Console controls to their Initial Control Settings.ttings........."], "jumps": []}, {"id": "P2290", "text": ["The exact barometric pressure in inches of mercury can be obtained from your local airport or weather station. However, the barometer is calibrated in millibars. Use the 1 inHg = 33.865 mbar conversion to establish the required setting. Let's begin the experiment."], "jumps": []}, {"id": "P2280", "text": ["Since the sensitivity (S) does not change as a function of applied pressure, we can calculate the offset voltage required from our original equation. Once the offset voltage is determined, offset potentiometer, R8 can be adjusted to alleviate the offset error..."], "jumps": []}, {"id": "P2270", "text": ["The sensitivity can be determined by using two known pressures since it results in two equations and two unknowns (V , S) as follows: at atmospheric pressure, V = (S x (P ) + V 2 = Then: V02 - V01 = S = V02 - V01 volt/psi 2 2 2 2", "psig)] + V V - V Then: V - V = S X 2 psi or S = 2", "V = [S x (P + 2 psig)] + V V - V Then: V - V = S x 2 psi or S = volt/psi 22"], "jumps": ["P"]}, {"id": "P2260", "text": ["To better understand the adjustment procedure, let's look at the mathematical explanation of the output voltage of the sensor, at a given supply voltage. ere: VOUT is the output voltage in mV S is the sensitivity of the sensor in mV/psi P is the applied pressure VOS is the offset voltage of the sensor in mVVV", "Vout = (S x P) + Vos Where: Vout is the output voltage in mV S is the sensitivity of the sensor in mV/psi P is the applied pressure Vos is the offset voltage of the sensor in mV"], "jumps": []}, {"id": "P2250", "text": ["There are two methods to calibrate the barometer. One procedure assumes that you do not have a pressure source other than atmospheric pressure, and the other adjustment procedure assumes that you do have a second pressure source..."], "jumps": []}, {"id": "P2240", "text": ["Notice in the Unit column for inHg, that the Nominal resistor value is 517 W. R2 equals 470 W and the 100 W variable resistor R3 would be adjusted to 47 W. To allow for circuit tolerances, R2 is a fixed 470 W and R3 is a variable 100 W potentiometer for RT..."], "jumps": []}, {"id": "P2230", "text": ["From the pressure transducer SCX15ANC data sheet, the output span for 15 psi is equal to 90 mV when operating from a 12 V supply. This equates to 0.5 mV per volt per psi. The table below lists the Nominal resistor values (RT) for the combination (R2+R3)..."], "jumps": []}, {"id": "P2220", "text": ["The output voltage can be scaled to correspond directly to barometric pressure in mbar (1 psi = 68.947 mbar). Using the gain equation we can calculate the gain resistor, RT, where RT = (R2 + R3). Vin", "V = A = 2 (1 + R4 / RT) V mV 12.0 V 90 mV 12.0 VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV"], "jumps": []}, {"id": "P2210", "text": ["The gain equation for the instrumentation amplifier is listed below. Vin)", "V = A = 2 (1 + R4 / RT) V mV 12.0 V 90 mV 12.0 VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV"], "jumps": []}, {"id": "P2200", "text": ["Altitude correction (or offset adjustment) is provided by amplifier U1B, in conjunction with variable potentiometer R8. Amplifiers U1C and U1D are connected as an instrumentation amplifier to provide gain to the output of the sensor..."], "jumps": []}, {"id": "P2190", "text": ["The basic circuit of a semiconductor pressure sensor barometer has an output voltage directly proportional to the barometric pressure. Amplifier U1A is used to provide a 10 V regulated power supply voltage for the sensor. To view schematic of the Barometer Circuit I use Ctrl+S on your keyboard."], "jumps": []}, {"id": "P2180", "text": ["Using the pressure values in psi, the sensor output voltages for the extreme limits can be determined. These values are offset and scaled so that the output of the final barometric pressure interface is 0 V at 26.00 \" Hg and 5 V at 32.00 \" Hg. 90 mV 12.0 V 15.7 psi/15.0 psi x 10.0 V = 0.785 V Vout = 90 mV 12.0 V Given: P/Pmax x Vsupply Vout = 90mv 12.0V", "12.7 psi / 15.0 psi 10.0 V V = x = 0.635 V 90 mV 12.0 V", "15.7 psi / 15.0 psi 10.0 V V = x = 0.785 V 90 mV 12.0 V", "P / P V Given: V = x 90 mV 12.0 VVVVVVVVVVVVVVVVVVVVVVVVV 12.0 V 12.0 V"], "jumps": []}, {"id": "P2170", "text": ["The output voltage of the absolute pressure transducer can be scaled such that this voltage will correspond directly to barometric pressure in mbar (1psi = 68.947 mB (millibar) and 1.0 \" Hg equals 33.865 mB. Hg x 68.947 mB 32.00 Hg x 33.865 mB x 1.0 psi = 15.7 psi 1.0 Hg x 68.947 mB", "26.00\" Hg x 33.865 mB x 1.0 psi = 12.7 psi 1.0\" Hg x 68.947 mB 12.0 VVVVVVVVVVV0 V", "32.00\" Hg x 33.865 mB x 1.0 psi = 15.7 psi 1.0\" Hg x 68.947 mB 12.0 VVVVVVVVVVV0 V"], "jumps": []}, {"id": "P2160", "text": ["The barometric pressure can climb to over 31.00 \" Hg during extremely fair weather and fall below 27.00 \" Hg during severe storm conditions. The Nida Barometer Circuit interface operates in the range of 26.00 to 32.00 \" Hg."], "jumps": []}, {"id": "P2150", "text": ["The barometric pressure at sea level on an average day is about 29.92 \" Hg (14.7 psi) and is called standard pressure. Barometric pressure will fluctuate with the varying changes in the weather."], "jumps": []}, {"id": "P2140", "text": ["Common applications for differential pressure measurement transducers include airflow measurement and filter-flow measurements."], "jumps": []}, {"id": "P2130", "text": ["Differential pressure gives pressure measurements referenced to second-reference pressure. A second pressure port is added to the sensor to connect the reference pressure to the cavity behind the sensor diaphragm..."], "jumps": []}, {"id": "P2120", "text": ["This type of sensor is capable of measuring positive and negative pressure in relation to the barometric pressure. Common applications for gauge pressure sensors include blood pressure and engine vacuum sensors..."], "jumps": []}, {"id": "P2110", "text": ["Common applications for absolute pressure sensors include barometers and aircraft altimeters. Gauge pressure provides pressure referenced to barometric pressure. In this case, the reference cavity of the sensor is vented to the atmosphere..."], "jumps": []}, {"id": "P2100", "text": ["Absolute pressure offers pressure measurements referenced to a fixed reference pressure (usually a hard vacuum). In this case, a vacuum exists in the cavity under the sensor diaphragm."], "jumps": []}, {"id": "P2090", "text": ["There are three common types of pressure measurements. The mechanical construction of solid-state pressure determines what type of pressure measure is possible."], "jumps": []}, {"id": "P2080", "text": ["The ratio (V /12.0 V) scales the output span for sensor excitation voltages other than 12.0 Volts. The sensor output was temperature compensated. The effect of temperature is only 0.2% of the full-scale output. = 90mv 12.0VVV"], "jumps": []}, {"id": "P2070", "text": ["The output voltage at a given pressure is determined using the following equation, where V is the sensor output voltage, P is the applied pressure, P is the sensor maximum pressure, and 90 mV is the sensor output span with a 12 V excitation. V = 90 mV 12.0V"], "jumps": []}, {"id": "P2060", "text": ["The output voltage of the sensor is proportional to the pressure applied at the input port of the sensor. The output voltage of the bridge is ratiometric with the applied excitation supply voltage."], "jumps": []}, {"id": "P2050", "text": ["The differential output voltage of the sensor has often been, calibrated by laser trimming the bridge resistors and temperature compensated to negate thermal effects on the sensor."], "jumps": []}, {"id": "P2040", "text": ["When pressure is applied to the diaphragm, the resistors are strained, causing an imbalance in the Wheatstone bridge proportional to the applied pressure."], "jumps": []}, {"id": "P2030", "text": ["After the wafer is fabricated, a diaphragm is created by chemically etching the silicon from the backside of the wafer. The diaphragm thickness controls the pressure range or sensitivity of the sensor..."], "jumps": []}, {"id": "P2025", "text": ["Solid-state transducers are fabricated using silicon-processing techniques similar to the semiconductor industry. Usually, four strain-sensitive resistors are ion implanted on a silicon wafer in a Wheatstone-bridge configuration..."], "jumps": []}, {"id": "P2020", "text": ["This experiment introduces the operation of pressure indicating system transducers."], "jumps": ["P2030", "P2001"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P1980", "text": ["7. Critical systems lubricants such as engine oil, fuel and hydraulic fluid are sometimes equipped with chip detectors as well as screens and filters to notify maintenance and flight crews of metal contamination.."], "jumps": []}, {"id": "P1970", "text": ["6. An altimeter is an aneroid barometer which converts a barometric pressure reading measured in inches of mercury into an altitude measured in feet. It measures the altitude of the aircraft above sea level when set to the current barometric pressure setting..."], "jumps": []}, {"id": "P1960", "text": ["5. Bourdon tube type instruments are used primarily in high- pressure systems, such as hydraulics systems and lubricating systems. Lower pressure systems instruments are normally of the bellows mechanism or capsule types."], "jumps": []}, {"id": "P1950", "text": ["4. Daniel Bernoulli's equation of the forces present in a moving fluid states that the static pressure (ps) in the flow plus one half of the density (r) times the velocity (V) squared is equal to the total pressure (pt) in the flow...."], "jumps": []}, {"id": "P1940", "text": ["3. At sea level, with standard-day weather conditions, atmospheric pressure is 14.7 psi and the height of the mercury in a barometer will be 29.92 inches/Hg."], "jumps": []}, {"id": "P1930", "text": ["2. Most aircraft fluid systems use filters that remove contaminants to prevent system damage. Differential pressure sensors, transducers and warning indicators are installed across the filters to notify the flight crew of potential failures..."], "jumps": []}, {"id": "P1920", "text": ["1. Pressure measuring instruments provide three types of pressure to the flight crew and maintenance personnel. The three types of pressure are: absolute pressure, gauge pressure and differential pressure..."], "jumps": ["P1930", "P1001"]}, {"id": "P1910", "text": ["You have completed the information on PRESSURE SENSING AND CHIP DETECTION INSTRUMENTS."], "jumps": ["P1830"]}, {"id": "P1833", "text": ["The fuel quantity gauge is used in calculating fuel remaining."], "jumps": []}, {"id": "P1832", "text": ["A Yellow Arc indicates the precautionary range............."], "jumps": []}, {"id": "P1831", "text": [], "jumps": []}, {"id": "P1830", "text": ["What does the red radial line on the fuel pressure gauge indicate?", "Maximum and/or minimum permissible fuel pressure"], "jumps": ["P1820"]}, {"id": "P1820", "text": ["Remember only FAA certified repair facilities or the manufacturer might alter or repair aircraft instruments."], "jumps": []}, {"id": "P1810", "text": ["The technician installing aircraft instruments in an instrument panel is responsible to ensure the instruments are secure in their mounting and that all attached hoses and wires are in good condition and do not interfere with any of the flight controls..."], "jumps": []}, {"id": "P1800", "text": ["The technician installing an instrument is responsible for ensuring the instruments are properly installed and marked for that particular aircraft. The range marking for pressure indicators of reciprocating and turbine engines are defined below. Instrument Range Marking Manifold Pressure gauge Green Arc Normal operating range Yellow Arc Precautionary range Red radial line Maximum permissible manifold absolute pressure. Fuel Pressure gauge Green Arc Normal operating range Yellow Arc Precautionary range Red radial line Maximum and/or minimum permissible fuel pressure Oil Pressure gauge Green Arc Normal operating range Yellow Arc Precautionary range Red radial line Maximum and/or minimum permissible oil pressureee"], "jumps": []}, {"id": "P1790", "text": ["Preventative maintenance procedures must be accomplished on schedule to ensure the aircraft systems operate safely and within specified limits. Always use manufacturers equipment or Federal Regulations publications when maintaining aircraft instruments..."], "jumps": []}, {"id": "P1782", "text": ["Engine fuel and lubricants should be checked for contamination during preflight."], "jumps": []}, {"id": "P1781", "text": [], "jumps": []}, {"id": "P1780", "text": ["How often should engine lubricants be checked for contamination?"], "jumps": []}, {"id": "P1770", "text": ["Some chip detectors are part of an electrical warning system. As metallic chips collect on the detector, the metal completes the circuit allowing current to flow and illuminate a warning light in the cockpit..."], "jumps": []}, {"id": "P1760", "text": ["Most chip detectors are simply threaded tank plugs with magnets that collect metal contaminants in the fluid. During preventative maintenance and daily inspections, these detectors are checked for signs of metal wear..."], "jumps": []}, {"id": "P1750", "text": ["Critical systems lubricants such as engine oil, fuel and hydraulic fluid are sometimes equipped with chip detectors as well as screens and filters to notify maintenance and flight crews of metal contamination..."], "jumps": []}, {"id": "P1740", "text": ["Pressure changes are converted into electrical impulses by the solid-state sensor and sent to either an analog electrical measurements circuit or a digital flight director, or auto flight computers..."], "jumps": []}, {"id": "P1730", "text": ["As atmospheric pressure falls, the higher internal pressure expands the diaphragm, causing the strain gauge to indicate a lower relative pressure."], "jumps": []}, {"id": "P1720", "text": ["As atmospheric pressure rises above the reference pressure sealed in the sensor, the higher external pressure contracts the diaphragm, causing the strain gauge to indicate a higher relative pressure..."], "jumps": []}, {"id": "P1710", "text": ["One side of the diaphragm is exposed to the atmospheric pressure, while the other side is held at a fixed reference pressure (sealed vessel)."], "jumps": []}, {"id": "P1700", "text": ["The solid-state barometer converts atmospheric pressure into an electrical impulse. An attached strain gauge measures the deflection of the diaphragm in response to changing pressure."], "jumps": []}, {"id": "P1690", "text": ["Another type of aircraft indicating method is solid-state systems. The solid-state barometer utilizes a pressure transducer to measure aircraft altitude. Digital, Flight Management Computers and Automatic Flight systems require input in digital form..."], "jumps": []}, {"id": "P1680", "text": ["The manufacturer or certificated instrument repair facility would calibrate and zero adjust the airspeed indicator to ensure accurate measurements are indicated to the flight crew."], "jumps": []}, {"id": "P1670", "text": ["As the aircraft increases in speed, the pitot pressure increases and expands the diaphragm in the indicator. The linkage connected to the diaphragm rotates to indicate speed on the dial."], "jumps": []}, {"id": "P1660", "text": ["An airspeed indicator uses the aircraft Pitot static air pressure system to measure the difference pressure. Pitot pressure is fed into a diaphragm, while the static pressure is fed into the case of the instrument..."], "jumps": []}, {"id": "P1650", "text": ["Differential pressure instruments utilize a differential bellows mechanism to measure absolute pressure, differential pressure and gauge pressure. Manifold pressure gauges, fuel pressure gauges and airspeed indicators use this type of mechanism..."], "jumps": []}, {"id": "P1640", "text": ["The mechanical mechanism in the altimeter uses a formula to indicate altitude. The formula is helpful in our efforts to understand the operating principles of an altimeter."], "jumps": ["P1630"]}, {"id": "P1632", "text": ["The aneroid altimeter uses the difference between absolute and sea level pressure to determine altitude."], "jumps": []}, {"id": "P1631", "text": [], "jumps": []}, {"id": "P1630", "text": ["What pressure is dialed into the Kollsman window of an aneroid altimeter?"], "jumps": []}, {"id": "P1620", "text": ["If the elevation of an airport is 720 feet above sea level, when the barometric pressure set in the Kollsman window is correct, the altimeter should read 720 feet while the airplane is still on the ground..."], "jumps": []}, {"id": "P1610", "text": ["An adjustment knob on the bottom left side of the altimeter allows the pilot to set the current sea-level pressure in the Kollsman window. The altimeter subtracts the actual barometric pressure from the sea-level setting and displays the difference as an altitude..."], "jumps": []}, {"id": "P1600", "text": ["The altimeter is an aneroid barometer which converts a barometric pressure reading measured in inches of mercury into an altitude measured in feet. It measures the altitude of the aircraft above sea level when set to the current barometric pressure setting..."], "jumps": []}, {"id": "P1590", "text": ["An increase in pressure on the outside slightly collapses the wall of the canister. Likewise, a decrease in atmospheric pressure allows the pressure on the inside to expand the canister."], "jumps": []}, {"id": "P1580", "text": ["Measuring the air pressure by an aneroid barometer entails balancing the weight of the atmosphere against a known spring force exerted on the walls of the chamber."], "jumps": []}, {"id": "P1570", "text": ["One end of the flexible canister is fixed, while the other end, responds to changes in atmospheric pressure and moves the coupling mechanism. A rocking shaft, sector gear, and pinion linkage magnifies the movement and drives the indicator arm and pointer..."], "jumps": []}, {"id": "P1560", "text": ["The aneroid barometer mechanism is essentially a spring balance, utilizing a partially evacuated sealed bellows type canister with flexible walls. The corrugated metal walls act as a spring to prevent the canister chamber from fully collapsing..."], "jumps": []}, {"id": "P1550", "text": ["Although a mercury barometer is very accurate in measuring absolute pressure, a 34 inch glass barometer is not a practical instrument to be used in an aircraft. Aneroid (fluid less) barometer mechanisms are utilized to measure absolute pressure in aircraft..."], "jumps": []}, {"id": "P1542", "text": ["For accurate measurement of fuel pressure, atmospheric pressure is compared to pump pressure."], "jumps": []}, {"id": "P1541", "text": [], "jumps": []}, {"id": "P1540", "text": ["Why is the fuel pressure transmitter vented to the atmosphere?", "To prevent over-pressurizing of the indicator", "To allow accurate measurement of differential pressure"], "jumps": []}, {"id": "P1530", "text": ["The fuel pressure transmitter is vented to the atmosphere to allow the transmitter to accurately measure the differential between pump pressure and atmospheric pressure."], "jumps": []}, {"id": "P1520", "text": ["The signal moves the receiver rotor with its attached indicator pointer a distance proportional to the amount of pressure exerted by the fuel."], "jumps": []}, {"id": "P1510", "text": ["The automatic synchro system (Autosyn) uses electromagnetic rotors vice permanent magnet rotors. A change in fuel pressure introduced into the synchro transmitter causes an electrical signal to go through the wiring harness to the synchro receiver in the indicator.."], "jumps": []}, {"id": "P1500", "text": ["The Autosyn (synchro system) fuel pressure gauge provides a check on the operation of the fuel pump and fuel pressure relief valve. When the fuel pressure is correct, the engines have a full range of power at all altitudes..."], "jumps": []}, {"id": "P1490", "text": ["The indicator magnet connects to the indicator pointer by a shaft to provide a visual indication of the oil pressure. A wiring harness connects the transmitter to the indicator."], "jumps": []}, {"id": "P1480", "text": ["Because of this imbalance, current flows between the two units. This circulating current sets up additional magnetic lines of force between the stator and the magnet of each unit. The indicator magnet moves until its position is in correspondence with the magnet in the transmitter..."], "jumps": []}, {"id": "P1470", "text": ["The signal voltages remain equal and balanced as long as the magnets are in the same relative positions. However, if the transmitter magnet moves to a new position, the voltages in the three sections of the transmitter are unbalanced..."], "jumps": []}, {"id": "P1460", "text": ["The Magnesyn synchro system transmitter and indicator connect in parallel. When excited by the same fundamental source, the signal voltages in corresponding sections of the two stators are equal and balanced..."], "jumps": []}, {"id": "P1450", "text": ["Taps divide the winding into three sections. Voltages in each of the sections vary with the position of the permanent magnet. As the magnet moves, the ratio between the three signal voltages varies accordingly..."], "jumps": []}, {"id": "P1440", "text": ["The Magnesyn synchro system consists of a synchro indicator and transmitter. The synchro transmitter consists of a permanent magnet moving within a stator. The stator is a circular core of magnetic material wrapped with a single, continuous torodial winding..."], "jumps": []}, {"id": "P1430", "text": ["The Magnesyn and Autosyn (synchro systems) are indirect reading systems. They are used to measure fluid under pressure, however, they eliminate the need for direct pressure lines from the engine to the instrument panel..."], "jumps": []}, {"id": "P1420", "text": ["Bourdon tube type instruments are used primarily in direct reading high-pressure systems, such as hydraulics systems and lubricating systems. Lower pressure direct reading systems instruments are normally of the bellows mechanism or capsule types..."], "jumps": []}, {"id": "P1410", "text": ["The gauge dial is calibrated so that the needle points to a number that corresponds to the exact pressure that is applied. When the pressure is removed, the Bourdon tube acts as a spring, and returns to it normal position..."], "jumps": []}, {"id": "P1400", "text": ["As the movable end of the tube tries to turn outward, it turns the pivot segment gear. This gear meshes with a smaller rotary gear to which a pointer is attached, and its movement causes a reading on the pressure gauge..."], "jumps": []}, {"id": "P1390", "text": ["Because the area on the outside radius of the tube is greater than that of its inside, the force will also be greater on the outside radius, which tends to straighten the tube."], "jumps": []}, {"id": "P1380", "text": ["The fitting end of the Bourdon tube instrument is fastened to the gauge frame; while the other end is free to move so it can operate the mechanical linkage. As the fluid enters the tube, it is transmitted equally in all directions..."], "jumps": []}, {"id": "P1370", "text": ["The Bourdon tube mechanism is used in direct reading gauges. The Bourdon tube is a curved metal tube that is oval in cross-sectional shape. One end of the tube is closed, while the other end connects into a pressure source..."], "jumps": []}, {"id": "P1360", "text": ["The type of oil pressure gauge is normally a Bourdon tube mechanism for measuring fluid under high pressure. Bourdon tubes are used in oil pressure and temperature indicators."], "jumps": []}, {"id": "P1350", "text": ["Oil pressure instruments show that oil is or is not circulating under proper pressure. An oil pressure drop warns of impending engine failure due to lack of oil, pump failure, or broken lines..."], "jumps": []}, {"id": "P1343", "text": ["Exhaust temperatures are normally measured by temperature transducers."], "jumps": []}, {"id": "P1342", "text": ["Directional gyros are used to provide aircraft altitude information."], "jumps": []}, {"id": "P1341", "text": [], "jumps": []}, {"id": "P1340", "text": ["An aircraft Pitot system uses Bernoulli's equation to solve for the aircraft _______"], "jumps": []}, {"id": "P1330", "text": ["The center tube is pointed in the direction of travel and is pressurized by both random and directed air velocity. The pressure in this tube is the total pressure (pt). Using the values of (ps) and (pt), speed or velocity of the aircraft can be solved using Bernoulli's equation..."], "jumps": []}, {"id": "P1320", "text": ["Since the outside holes are perpendicular to the direction of travel, they are pressurized by the random component of the air velocity. The pressure in these tubes is the static pressure (ps)."], "jumps": []}, {"id": "P1310", "text": ["The outside holes are plumbed to one side of a pressure transducer and the center hole is plumbed to the other side. The transducer measures the difference in pressure between the tubes..."], "jumps": []}, {"id": "P1300", "text": ["A tube is attached to the fuselage of the aircraft facing forward. Several small holes are drilled around the outside of tube and a center hole is drilled down the axis of the tube."], "jumps": []}, {"id": "P1290", "text": ["Total pressure (pt) is the sum of dynamic pressure (q) and static pressure (pt). An aircraft Pitot system uses Bernoulli's equation to solve for the aircraft velocity (speedometer)."], "jumps": []}, {"id": "P1280", "text": ["The associated pressure with the momentum of the directed motion of the fluid is called dynamic pressure (q). The remaining random motion of the molecules produces a pressure called static pressure (ps)..."], "jumps": []}, {"id": "P1270", "text": ["If a fluid is at rest, all motion of its molecules is random and the detected pressure is the total pressure (pt) of the fluid. If the fluid is set in motion or flows, some of random components of velocity are changed to directed motion..."], "jumps": []}, {"id": "P1260", "text": ["Daniel Bernoulli's equation of the forces present in a moving fluid states that the static pressure (ps) in the flow plus one half of the density (r) times the velocity (V) squared is equal to the total pressure (pt) in the flow..."], "jumps": []}, {"id": "P1250", "text": ["Looking at a gas enclosed within a container, we will detect a pressure in the gas from the molecules colliding with the walls of the container. We could shrink the size of our container to an infinitely small point and the pressure would have a single value at that point..."], "jumps": []}, {"id": "P1240", "text": ["Pressure is a scalar quantity having magnitude with no direction. Pressure is also a measure of the linear momentum of the gas molecules and pressure force acts perpendicular to the enclosing surfaces...."], "jumps": ["P1230"]}, {"id": "P1233", "text": ["The pressure in inches of mercury would be 29.92 in/Hg....."], "jumps": []}, {"id": "P1232", "text": ["Remember atmospheric pressure doubles every 33 feet as you descend in water."], "jumps": []}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1230", "text": ["What is the atmospheric pressure at sea level in pounds per square inch?"], "jumps": []}, {"id": "P1220", "text": ["Just as a diver experiences a decrease in pressure ascending to the surface, a pilot will experience a decrease in pressure as the aircraft climbs to higher altitudes. The following table shows the relationship between altitude and atmospheric pressure..."], "jumps": []}, {"id": "P1210", "text": ["Scuba divers know that as you go down to greater depths, the water pressure increases. In fact, the increase in pressure is 14.7 psi for every 33 feet of additional depth."], "jumps": []}, {"id": "P1200", "text": ["At sea level, with standard-day weather conditions, atmospheric pressure is 14.7 psi and the height of the mercury in a barometer will be 29.92 inches/Hg. If water were used in the barometer, the tube would have to be 33.9 feet high..."], "jumps": []}, {"id": "P1190", "text": ["A simple barometer is nothing more than a graduated tube in a reservoir of mercury. The height of the mercury in the tube is proportional to the atmospheric pressure."], "jumps": []}, {"id": "P1180", "text": ["The liquid in the U-tube will continue to rise toward the pump until the atmospheric pressure cannot push it up any further. For mercury, the liquid will rise until the upper level is about 30 inches above the lower level."], "jumps": []}, {"id": "P1170", "text": ["As we use a vacuum pump to remove the air from one side of the U-tube, the liquid shifts away from the open tube and toward the pump. Atmospheric pressure in the open tube pushes down on the liquid on that side forcing it upward on the other..."], "jumps": []}, {"id": "P1160", "text": ["Pressures obtained with one arm of the U-tube evacuated and sealed off are absolute pressures (psia). The relationship between gauge and absolute pressure is: absolute pressure equals gauge pressure plus atmospheric pressure..."], "jumps": []}, {"id": "P1150", "text": ["If we connect a vacuum pump to the open arm of the U-tube, pump out the air, and then seal off one end of the tube, a vacuum will be created and no pressure will exist above the liquid in that side of the tube..."], "jumps": []}, {"id": "P1140", "text": ["Differential pressure is normally expressed as pounds per square inch differential, (psid). Differential pressure sensors are used to control the valve that allows bleed air to flow to the air-fuel heat exchanger to remove ice crystals blocking the filter."], "jumps": []}, {"id": "P1130", "text": ["Differential pressure, (DP), is the difference in pressure measured on either side of a filter or system component. Differential pressure sensors warn the flight crews of possible pump failures or clogged filters in fluid and bleed air systems..."], "jumps": []}, {"id": "P1120", "text": ["Most aircraft fluid systems use filters that remove contaminants to prevent system damage. Differential pressure sensors, transducers and warning indicators are installed across the filters to notify the flight crew of potential failures..."], "jumps": []}, {"id": "P1110", "text": ["As the pump is energized, the gauge will indicate only the pressure added to the oil by the pump."], "jumps": []}, {"id": "P1100", "text": ["Pressure added to a fluid by a pump or other device is an example of gauge pressure. Statically, atmospheric pressure acts on the oil at both the inlet and outlet of the pump and the gauge reads zero..."], "jumps": []}, {"id": "P1090", "text": ["Leaving one side of the U-tube open results in the pressure being measured relative to atmospheric pressure. A pressure measured relative to atmospheric pressure is called gauge pressure or pounds per square inch gauge, (psig)..."], "jumps": []}, {"id": "P1080", "text": ["The size of the U-tube will vary with the density of the liquid. Accordingly, mercury (Hg) is the liquid of choice because the density of mercury is almost 14 times greater than the density of water..."], "jumps": []}, {"id": "P1070", "text": ["Simply measuring the distance between the two liquid levels specifies the pressure. If water is used as the liquid, the pressure is given as so many inches of water."], "jumps": []}, {"id": "P1060", "text": ["The pressure displaces the liquid by pushing down on the pressure side, forcing the liquid level to rise on the other side. The difference in heights of the liquid levels is proportional to the pressure being measured..."], "jumps": []}, {"id": "P1050", "text": ["One of the first methods used to measure pressure utilized a partially filled liquid U-shaped glass tube, known as a U-tube manometer. One arm is left open to the atmosphere, while the pressure to be measured is connected to the second arm..."], "jumps": []}, {"id": "P1040", "text": ["A familiar example is the air pressure in a bicycle tire, which is typically around 40 psi. This means that a force of 40 pounds is exerted on each and every square inch of surface area on the inside of the tire..."], "jumps": []}, {"id": "P1030", "text": ["The physics definition of pressure is force per unit area. In the USA, the units typically used for measuring pressure are pounds per square inch (psi). In the metric system, the units are in kilopascals (kPa) with one kPa equal to 0.14503 psi..."], "jumps": []}, {"id": "P1020", "text": ["Pressure measuring instruments provide three types of pressure to the flight crew and maintenance personnel. The three types of pressure are: absolute pressure, gauge pressure and differential pressure."], "jumps": []}, {"id": "P1001", "text": ["PRESSURE SENSING & CHIP DETECTIONSSSSSSSSSSSSTS"], "jumps": []}, {"id": "P900", "text": ["1. Pressure Sensing and Chip Detection Instr.ments."], "jumps": []}, {"id": "P440", "text": ["Let's begin the lesson on PRESSURE SENSING and CHIP DETECTION INSTRUMENTS..."], "jumps": []}, {"id": "P430", "text": ["Pressure instruments are used to indicate the aircraft altitude, airspeed, and fuel flow rate. Chip detection systems indicate whether the engine oil is being contaminated by metal chips from a failing engine part..."], "jumps": []}, {"id": "P420", "text": ["Flight crews need to continuously monitor the engine, lubricants and pitot static system pressures for proper system operation."], "jumps": []}, {"id": "P410", "text": ["Aircraft Instrumentation provides the technician and flight crew with an indication of how the vital aircraft systems are performing."], "jumps": []}, {"id": "P400", "text": ["This lesson introduces the principles and concepts of aircraft pressure sensing and chip detection indicating systems instruments."], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P331", "text": [], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Pressure Squeeze Bulb MultimeterXXXXXXXXXXnt", "7. Nida Model 488 Multimeter or equivalentXXXnt"], "jumps": []}, {"id": "P100", "text": ["1. Pressure Sensing and Chip Detection Instruments...", "2. Pressure Transducer Operationective 1 line item 2 here. item 2 here.e.e.", "w Identify the types and describe the function of pressure sensing and chip detection indicating systems instruments..", "w Identify the principles of pressure transducers. w Analyze the operation of solid-state pressure transducers.."], "jumps": []}, {"id": "P10", "text": ["PRESSURE SENSING AND CHIP DETECTION INSTRUMENTS"], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ..", "Title: PRESSURE SENSING AND CHIP DETECTION INSTRUMENTSf"], "jumps": []}, {"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was cre let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
