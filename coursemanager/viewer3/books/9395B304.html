<script>
const book = {"title": "9395B304", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: DELTA MODULATION (DM)df asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe Delta Modulation. w Describe the characteristics of DM signals.", "w Describe a typical DM modulator circuit. w Describe the MC3418 DM modulator integrated circuit.", "w Describe a typical DM demodulator circuit. w Describe the MC3418 DM demodulator integrated circuit...."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you are taught another method of digital signal processing and the circuits that modulate and demodulate."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["The method is called delta modulation, DM for short, after the Greek word delta meaning change."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Delta modulation is similar to pulse code modulation (PCM)."], "jumps": ["P430", "P400", "PCM"]}, {"id": "P430", "text": ["An information signal is changed to digital pulses and transmitted."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["The digital pulses are received and changed back into the original information signal."], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["The difference, and an advantage over PCM, is that DM does not require a synchronization pulse and does not use A/D and D/A converters."], "jumps": ["P460", "P400"]}, {"id": "P460", "text": ["The disadvantage of DM is that it is not as accurate as PCM."], "jumps": ["P470", "P400"]}, {"id": "P470", "text": ["Consequently, DM is used mainly in voice communication systems where a perfect reproduction of the analog signal is not necessary."], "jumps": ["P480", "P400"]}, {"id": "P480", "text": ["Let's begin the lesson on DELTA MODULATION (DM)..........................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1015", "text": ["Delta modulation is a signal processing technique that produces a string of digital pulses according to how an information signal amplitude is changing."], "jumps": ["P1020", "P1001"]}, {"id": "P1020", "text": ["In fact, the word DELTA is from the Greek word or letter (D) meaning a change.", "In fact, the word DELTA is from the Greek word or letter (D) meaning a change.."], "jumps": ["P1030", "P1015"]}, {"id": "P1030", "text": ["The string of digital pulses represent increases and decreases in amplitude of an analog information signal, not a binary number."], "jumps": ["P1040", "P1015"]}, {"id": "P1040", "text": ["What does the digital pulses in DM signal processing represent?"], "jumps": ["P1030"]}, {"id": "P1041", "text": [], "jumps": []}, {"id": "P1042", "text": ["A signal that represents amplitude level is AM. The digital signal in DM does not represent amplitude levels."], "jumps": []}, {"id": "P1043", "text": ["A signal that represents frequency changes is FM. The digital signal in DM does not represent frequency changes."], "jumps": []}, {"id": "P1050", "text": ["One type of DM signal is called a POLARITY signal.", "One type of DM signal is called a POLARITY signal.........."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["When the information signal is increasing, positive pulses are generated.  Times T1 and T3.", "When the information signal is increasing, positive pulses are generated. Times T1 and T3."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["When the information signal is decreasing, negative pulses are generated.  Time T2.", "When the information signal is decreasing, negative pulses are generated. Time T2."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["When the information signal is not changing, positive and negative pulses changing, positive and negative pulses are generated.  Time  T4.", "When the information signal is not changing, positive and negative pulses changing, positive and negative pulses are generated. Time T4."], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["The toggling action is due to an absence of a pulse for an information signal that does not change."], "jumps": ["P1100", "P1050"]}, {"id": "P1100", "text": ["The 0 level of the DM signal only represents spacing between pulses."], "jumps": ["P1110", "P1050"]}, {"id": "P1110", "text": ["The other type of DM signal is called a LEVEL signal.", "The other type of DM signal is called a LEVEL signal......."], "jumps": ["P1120", "P1050"]}, {"id": "P1120", "text": ["When the information signal is increasing, the DM signal is HIGH.\nTimes T1 and T3.", "When the information signal is increasing, the DM signal is HIGH. Times T1 and T3."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["When the information signal is decreasing, the DM signal is LOW.\nTime T2.", "When the information signal is decreasing, the DM signal is LOW. Time T2."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["When the information signal is not changing, HIGH and LOW signals are generated.  Time T4.", "When the information signal is not changing, HIGH and LOW signals are generated. Time T4."], "jumps": ["P1150", "P1110"]}, {"id": "P1150", "text": ["Like in the polarity DM signal, there is no signal for a constant information signal."], "jumps": ["P1160", "P1110"]}, {"id": "P1160", "text": ["The DM signal toggles between the HIGH and LOW levels."], "jumps": ["P1170", "P1110"]}, {"id": "P1170", "text": ["What characteristic of a pulse train is changed for DM signal processing?"], "jumps": ["P1110"]}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1172", "text": ["The position of pulses may appear to change but, that's not what DM changes.  DM is delta modulation and delta means change.", "The position of pulses may appear to change but, that's not what DM changes. DM is delta modulation and delta means change."], "jumps": []}, {"id": "P1173", "text": ["The amplitude of the pulse train does not change in DM.  DM is delta modulation and delta means change.", "The amplitude of the pulse train does not change in DM. DM is delta modulation and delta means change."], "jumps": []}, {"id": "P1180", "text": ["During T3, what type of a polarity DM signal is generated?", "During T3, what type of a polarity DM signal is generated?."], "jumps": ["P1170"]}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1182", "text": ["A positive pulse DM signal indicates that the analog information signal is increasing in amplitude.  At T3, the information signal is not increasing.", "A positive pulse DM signal indicates that the analog information signal is increasing in amplitude. At T3, the information signal is not increasing."], "jumps": []}, {"id": "P1183", "text": ["A high DM signal is generated in level DM systems.", "A high DM signal is generated in level DM systems.........."], "jumps": []}, {"id": "P1184", "text": ["A low DM signal is generated in level DM systems.", "A low DM signal is generated in level DM systems..........."], "jumps": []}, {"id": "P1190", "text": ["During T2, what type of level DM signal is generated?", "During T2, what type of level DM signal is generated?......"], "jumps": ["P1180"]}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1192", "text": ["A positive pulse DM signal is generated in polarity DM systems."], "jumps": []}, {"id": "P1193", "text": ["A negative pulse DM signal is generated in polarity DM systems."], "jumps": []}, {"id": "P1194", "text": ["A LOW DM signal indicates that the information signal amplitude is decreasing. At T2, the information signal is not decreasing."], "jumps": []}, {"id": "P1200", "text": ["To better understand DM signals, let's study the four basic characteristics starting with sampling."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["As in any system that converts analog signals to digital, sampling  must be used.", "As in any system that converts analog signals to digital, sampling must be used."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["In the polarity method of DM, the sampling times are obvious."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["Each pulse, positive or negative, represents a sample time."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["In the Level Method of DM, the sampling times are not obvious."], "jumps": ["P1250", "P1220"]}, {"id": "P1250", "text": ["As long as the information signal is increasing or decreasing, the DM signal remains HIGH or LOW, no pulses."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["Only when the information signal changes between increasing or decreasing is the level of the pulse changed, at the sample time."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["However, no matter the method of DM, the analog information signal must be sampled to determine if the information signal is increasing or decreasing in amplitude."], "jumps": ["P1280", "P1240"]}, {"id": "P1280", "text": ["The minimum sample rate is the Nyquist rate or twice the highest information signal frequency.", "fs = 2fmmax Where fs is the sample rate and fmmax is the highest information signal frequency.y"], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["If the sample rate is below the Nyquist rate, the demodulator circuit will not recover the information."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["In a DM system using information signals that range from 10 kHz to 40 kHz, what is the minimum sample frequency that can be used?"], "jumps": ["P1290", "P1305"]}, {"id": "P1301", "text": [], "jumps": []}, {"id": "P1302", "text": ["20 kHz is twice the lowest frequency in the information signal. The minimum the information signal. The minimum frequency for sampling is twice the highest frequency in the information signal."], "jumps": []}, {"id": "P1303", "text": ["40 kHz is the highest frequency in the information signal. The minimum frequency for sampling is twice the highest in the information signal."], "jumps": []}, {"id": "P1305", "text": ["MINIMUM SAMPLING FREQUENCY - The minimum sampling frequency that can be used is the Nyquist rate. The Nyquist rate is defined as twice the highest information signal frequency."], "jumps": []}, {"id": "P1310", "text": ["The second characteristic of DM signals is Quantization.", "The second characteristic of DM signals is Quantization...."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["DM systems do not have a quantization level as defined in PCM systems (no formula).  DM systems do not use A/D and D/A converters.", "DM systems do not have a quantization level as defined in PCM systems (no formula). DM systems do not use A/D and D/A converters."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["Recall that in PCM systems, the quantization level was discrete voltage levels that were converted to digital."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["In DM systems, the digital signals only represent changes, not discrete voltage levels."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["However, the analog information signal is broken down into levels in the modulator depending on the sample rate and frequency of the information signal."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["The levels are still called quantization levels but are not the same PCM quantization levels."], "jumps": ["P1370", "P1340"]}, {"id": "P1370", "text": ["For example, the frequency of the left hand analog signal allows six levels at a given sample rate."], "jumps": ["P1380", "P1340"]}, {"id": "P1380", "text": ["If the information signal increased, keeping the same shape and sample rate, the levels would be 3 as in the right hand signal."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["There is actually no difference between the two DM signals, each one represents an increasing information signal."], "jumps": ["P1400", "P1370"]}, {"id": "P1400", "text": ["The demodulator would produce the same output.", "The demodulator would produce the same output.............."], "jumps": ["P1410", "P1370"]}, {"id": "P1410", "text": ["And any differences in amplitude would be made up by using amplifier circuits."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["Remember, the pulses only represent changes in the information signal, not discrete voltage levels."], "jumps": ["P1430", "P1400"]}, {"id": "P1430", "text": ["The only important aspect of the levels, or q, is the quantization noise that is produced."], "jumps": ["P1440", "P1400"]}, {"id": "P1440", "text": ["Recall in PCM systems, the quantization noise is the error caused by the discrete levels."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["Analog signals have an infinite number of discrete levels, digital signals do not."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["In DM systems, the quantization noise is also due to the levels, q, which as you know, depend on the frequency of the information signal and sample rate."], "jumps": ["P1470", "P1440"]}, {"id": "P1470", "text": ["The more samples that are taken, more levels or q, the better the information signal is described."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["Which produces less noise in the demodulator."], "jumps": ["P1490", "P1460"]}, {"id": "P1490", "text": ["Of course, since the number of samples per cycle of the information signal depend on the information signal frequency, the noise or SNRq, varies."], "jumps": ["P1500", "P1460"]}, {"id": "P1500", "text": ["There is no set formula for noise as there was in PCM."], "jumps": ["P1510", "P1460"]}, {"id": "P1510", "text": ["The last characteristic is bandwidth and bandwidth is important in any type of communication system."], "jumps": ["P1520", "P1460"]}, {"id": "P1520", "text": ["Bandwidth in DM systems is less than the bandwidth in PCM systems."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["This can be critical in systems that have bandwidth restrictions."], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["Recall that the bandwidth in a PCM system is the sampling frequency times the number of bits in each frame."], "jumps": ["P1550", "P1520"]}, {"id": "P1550", "text": ["Also note that it takes numerous frames to describe the simplest analog information signal."], "jumps": ["P1560", "P1520"]}, {"id": "P1560", "text": ["However, in DM systems, there are no frames, the pulse train just represents changes in the analog signal."], "jumps": ["P1570", "P1520"]}, {"id": "P1570", "text": ["Consequently, the bandwidth equals the sampling frequency."], "jumps": ["P1580", "P1520"]}, {"id": "P1580", "text": ["What is the minimum bandwidth of a DM system that uses an information signal that varies between 5 kHz and 7 kHz?"], "jumps": ["P1520", "P1585"]}, {"id": "P1581", "text": [], "jumps": []}, {"id": "P1", "text": [], "jumps": []}, {"id": "P1582", "text": ["The bandwidth of a DM system equals the sample rate.  A sample rate of 4 kHz for a 5 to 7 kHz information signal is not correct.", "The bandwidth of a DM system equals the sample rate. A sample rate of 4 kHz for a 5 to 7 kHz information signal is not correct."], "jumps": []}, {"id": "P1583", "text": ["The bandwidth of a DM system equals the sample rate.  A sample rate of 2 kHz for a 5 to 7 kHz information signal is not correct.", "The bandwidth of a DM system equals the sample rate. A sample rate of 2 kHz for a 5 to 7 kHz information signal is not correct."], "jumps": []}, {"id": "P1585", "text": ["BANDWIDTH - The bandwidth of a DM system equals the sample rate. The minimum sample rate of a DM system is twice the highest frequency of the information signal."], "jumps": []}, {"id": "P1590", "text": ["As you have seen, Delta modulation is a simpler method of signal processing than PCM.  However, it is not as accurate.", "As you have seen, Delta modulation is a simpler method of signal processing than PCM. However, it is not as accurate."], "jumps": ["P1910", "P1580"]}, {"id": "P1910", "text": ["This completes the information on DELTA MODULATION SIGNALS.", "This completes the information on DELTA MODULATION SIGNALS..."], "jumps": ["P1590"]}, {"id": "P1920", "text": ["1.  Delta modulation is a signal processing technique that uses          digital signals.", "1. Delta modulation is a signal processing technique that uses digital signals."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  The DM signal is a string of digital pulses that represent                   changes in the amplitude of an analog information signal.", "2. The DM signal is a string of digital pulses that represent changes in the amplitude of an analog information signal."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Polarity DM signals use positive and negative pulses.", "3. Polarity DM signals use positive and negative pulses..."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  Level DM signals use High and Low levels.", "4. Level DM signals use High and Low levels..............."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  Sampling is used to determine the DM signal at each sample          time and the minimum rate is the Nyquist rate.", "5. Sampling is used to determine the DM signal at each sample time and the minimum rate is the Nyquist rate."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  Quantization is not used in DM except for determining noise.", "6. Quantization is not used in DM except for determining noise."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7.  Noise is built into a DM system and is based on the frequency       of  the information signal and the sample rate.", "7. Noise is built into a DM system and is based on the frequency of the information signal and the sample rate."], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["8.  Bandwidth equals the sampling frequency in DM systems.", "8. Bandwidth equals the sampling frequency in DM systems.."], "jumps": ["P1999", "P1980"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1990"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2015", "text": ["DM modulators normally use integrated circuits.", "DM modulators normally use integrated circuits............."], "jumps": ["P2020", "P2001"]}, {"id": "P2020", "text": ["In fact, a DM modulator uses one chip with only a few extra external components."], "jumps": ["P2030", "P2015"]}, {"id": "P2030", "text": ["There are many types of DM chips. The one most often used is called a Continuous Variable Slope modulator, (CVSD, the D meaning Delta)."], "jumps": ["P2040", "P2015"]}, {"id": "P2040", "text": ["The CVSD chip develops a Level DM signal (highs and lows) and contains three major circuits."], "jumps": ["P2050", "P2015"]}, {"id": "P2050", "text": ["The operation of the modulator is simple even though the circuits used inside the chip are complex."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["The heart of the DM CVSD modulator is the integrator.  Let's look at its operation.", "The heart of the DM CVSD modulator is the integrator. Let's look at its operation."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["An example of an integrator is a series RC circuit.", "An example of an integrator is a series RC circuit........."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["With a high input, the capacitor charges according to the RC time constant."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["The longer the high is applied, the greater the output voltage."], "jumps": ["P2100", "P2070"]}, {"id": "P2100", "text": ["With a low input, the capacitor discharges according to the RC time constant."], "jumps": ["P2110", "P2070"]}, {"id": "P2110", "text": ["The longer the low is applied, the less the output voltage."], "jumps": ["P2120", "P2070"]}, {"id": "P2120", "text": ["The integrator circuit changes high and low inputs to an analog output signal."], "jumps": ["P2130", "P2070"]}, {"id": "P2130", "text": ["And, the length of time that a high or low is applied determines the level of the analog output signal."], "jumps": ["P2140", "P2070"]}, {"id": "P2140", "text": ["Returning to the CVSD circuit, the integrator output is applied to the negative input of the comparator."], "jumps": ["P2150", "P2070"]}, {"id": "P2150", "text": ["The analog information signal is applied to the positive input of  the comparator.  The two inputs are then compared.", "The analog information signal is applied to the positive input of the comparator. The two inputs are then compared."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["The comparator produces a high output if the analog input signal is greater than the integrator output signal."], "jumps": ["P2170", "P2140"]}, {"id": "P2170", "text": ["The comparator produces a low output if the analog input signal is less than the integrator output signal."], "jumps": ["P2180", "P2140"]}, {"id": "P2180", "text": ["The high or low output of the comparator is applied to the input of the integrator, making a closed loop."], "jumps": ["P2190", "P2140"]}, {"id": "P2190", "text": ["The closed loop causes the analog output voltage of the integrator to follow the level of the analog information input signal."], "jumps": ["P2200", "P2140"]}, {"id": "P2200", "text": ["In other words, the comparator compares the analog voltage from the integrator, which is delayed by circuit action, to the present analog input voltage."], "jumps": ["P2210", "P2140"]}, {"id": "P2210", "text": ["When the present analog voltage is greater than the output of the integrator, it indicates that the input signal is increasing."], "jumps": ["P2220", "P2140"]}, {"id": "P2220", "text": ["The output of the comparator is a high level as long as the analog information input signal is increasing."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["When the present analog voltage is less than the output of the integrator, it indicates that the input signal is decreasing."], "jumps": ["P2240", "P2210"]}, {"id": "P2240", "text": ["The output of the comparator is a low level as long as the analog information input signal is decreasing."], "jumps": ["P2250", "P2210"]}, {"id": "P2250", "text": ["The output of the comparator are digital levels that indicate changes in the analog information input signal.  DM modulation.", "The output of the comparator are digital levels that indicate changes in the analog information input signal. DM modulation."], "jumps": ["P2260", "P2210"]}, {"id": "P2260", "text": ["Note that if the the analog input signal is constant, the output of  the comparator will toggle between high and low.", "Note that if the the analog input signal is constant, the output of the comparator will toggle between high and low."], "jumps": ["P2270", "P2210"]}, {"id": "P2270", "text": ["If the output of the integrator is greater than the analog input voltage, a low is produced."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["The low output of the comparator decreases the integrator output voltage."], "jumps": ["P2290", "P2260"]}, {"id": "P2290", "text": ["This will place the output of the integrator less than the input voltage producing a high comparator output."], "jumps": ["P2300", "P2260"]}, {"id": "P2300", "text": ["The high output of the comparator increases the integrator output voltage."], "jumps": ["P2310", "P2260"]}, {"id": "P2310", "text": ["This will place the output of the integrator greater than the input voltage producing a low comparator output."], "jumps": ["P2320", "P2260"]}, {"id": "P2320", "text": ["The process continues producing a toggle output of the comparator."], "jumps": ["P2330", "P2260"]}, {"id": "P2330", "text": ["Finally, the high or low output of the comparator is applied to a D type flip-flop."], "jumps": ["P2340", "P2260"]}, {"id": "P2340", "text": ["On each clock pulse, which is the sample rate, the level on the D input sets or resets the flip-flop."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["The output of the flip-flop is the Level DM signal."], "jumps": ["P2360", "P2330"]}, {"id": "P2360", "text": ["Which circuit in the DM modulator chip produces a time delayed information signal?"], "jumps": ["P2330"]}, {"id": "P2361", "text": [], "jumps": []}, {"id": "P2362", "text": ["The output of the comparator is a high or low signal depending on if the analog input signal is increasing or decreasing, it is not an analog signal."], "jumps": []}, {"id": "P2363", "text": ["The output of the flip-flop is the level DM signal, it is not an analog signal."], "jumps": []}, {"id": "P2370", "text": ["Which circuit in the DM modulator chip continually indicates if the analog input signal is increasing or decreasing?"], "jumps": ["P2360"]}, {"id": "P2371", "text": [], "jumps": []}, {"id": "P2372", "text": ["The output of the flip-flop is the sampled DM signal. Yes, it does indicated that the input signal is increasing or decreasing but only when sampled and not continuously."], "jumps": []}, {"id": "P2373", "text": ["The output of the integrator is a time delayed analog information signal."], "jumps": []}, {"id": "P2380", "text": ["What is the output of the comparator if the analog input signal is larger than the output of the integrator?"], "jumps": ["P2370"]}, {"id": "P2381", "text": [], "jumps": []}, {"id": "P2382", "text": ["When the analog input signal is larger than the output of the integrator, the comparator's output is not low."], "jumps": []}, {"id": "P2383", "text": ["A positive pulse output is generated in polarity DM modulators. The circuit illustrated is a Level DM modulator."], "jumps": []}, {"id": "P2384", "text": ["A negative pulse output is generated in polarity DM modulators. The circuit illustrated is a Level DM modulator."], "jumps": []}, {"id": "P2390", "text": ["A popular IC that performs DM modulation is the MC3418.", "A popular IC that performs DM modulation is the MC3418....."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["The chip can be used in other types of circuits, including a DM demodulator, which accounts for the numerous pins."], "jumps": ["P2410", "P2390"]}, {"id": "P2410", "text": ["The basic DM modulator requires using only a few pins.", "The basic DM modulator requires using only a few pins......"], "jumps": ["P2420", "P2390"]}, {"id": "P2420", "text": ["First, the Encode/Decode(N) signal is set high.  This enables the chip to operate using analog input signals.", "First, the Encode/Decode(N) signal is set high. This enables the chip to operate using analog input signals."], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["Then the analog information signal is applied to one input of the comparator, pin 1."], "jumps": ["P2440", "P2410"]}, {"id": "P2440", "text": ["And the output of the integrator, from pin 7, is applied to the other input of the comparator, pin 2."], "jumps": ["P2450", "P2410"]}, {"id": "P2450", "text": ["The reason why the connection is not made internally is because the chip can also be used as a DM demodulator as you will see."], "jumps": ["P2460", "P2410"]}, {"id": "P2460", "text": ["Also, a RC circuit is connected between pins 6 and 7 that sets up the integrators time constant."], "jumps": ["P2470", "P2410"]}, {"id": "P2470", "text": ["The clock signal for the D type flip-flop, which is the sample rate, is connected to pin 14."], "jumps": ["P2480", "P2410"]}, {"id": "P2480", "text": ["Finally, the DM output signal is taken from pin 9."], "jumps": ["P2490", "P2410"]}, {"id": "P2490", "text": ["The basic DM modulator uses pins 1, 2, 6, 7, 9, 14 and 15.", "The basic DM modulator uses pins 1, 2, 6, 7, 9, 14 and 15.m"], "jumps": ["P2500", "P2410"]}, {"id": "P2500", "text": ["Of course, other pins must be used to ensure correct operation of  the modulator.", "Of course, other pins must be used to ensure correct operation of the modulator."], "jumps": ["P2510", "P2410"]}, {"id": "P2510", "text": ["Power to the chip is applied to pins 8 and 16."], "jumps": ["P2520", "P2500"]}, {"id": "P2520", "text": ["Pin 8 is for dual power sources and is always the lowest voltage. It is grounded when one power source is used."], "jumps": ["P2530", "P2500"]}, {"id": "P2530", "text": ["Pins 3, 4 and 5 are used to set the operation of the chip.", "Pins 3, 4 and 5 are used to set the operation of the chip.m"], "jumps": ["P2540", "P2500"]}, {"id": "P2540", "text": ["Pin 10 is used for a reference to other circuits if needed, and pin 11 is a four bit algorithm used in commercial telephone systems."], "jumps": ["P2550", "P2500"]}, {"id": "P2550", "text": ["Pins 9, 12, 13 and 15 are used if the information input signal is digital."], "jumps": ["P2560", "P2500"]}, {"id": "P2560", "text": ["First, pin 15 is set low. This enables the digital comparator and disables the analog comparator."], "jumps": ["P2570", "P2500"]}, {"id": "P2570", "text": ["The digital comparator circuit operates without the integrator."], "jumps": ["P2580", "P2500"]}, {"id": "P2580", "text": ["Pin 13 is the digital input and pin 9 is still the DM signal output."], "jumps": ["P2590", "P2570"]}, {"id": "P2590", "text": ["Since digital signals are either high or low, the integrator is not used.  A threshold input is used.", "Since digital signals are either high or low, the integrator is not used. A threshold input is used."], "jumps": ["P2600", "P2570"]}, {"id": "P2600", "text": ["If the digital input is above the threshold, the output level is high. If the digital input is below the threshold, the output level is low."], "jumps": ["P2610", "P2570"]}, {"id": "P2610", "text": ["As you have seen, the MC3418 is very versatile and can be used in many applications."], "jumps": ["P2570", "P2620"]}, {"id": "P2620", "text": ["In the MC3418 CVSD chip, which pin selects the use of analog or digital information inputs?"], "jumps": ["P2610"]}, {"id": "P2621", "text": [], "jumps": []}, {"id": "P2622", "text": ["Pin 12 is used as a reference to the comparator in the DM modulator when digital inputs are used."], "jumps": []}, {"id": "P2623", "text": ["Pin 13 is used as the digital information input when digital signals are used."], "jumps": []}, {"id": "P2630", "text": ["To configure the MC3418 chip as an analog DM modulator, which pins must be externally connected?"], "jumps": ["P2620"]}, {"id": "P2631", "text": [], "jumps": []}, {"id": "P2632", "text": ["Pin 1 is the analog information input.  Pin 2 is the input from the integrators output. They should not be connected externally.", "Pin 1 is the analog information input. Pin 2 is the input from the integrators output. They should not be connected externally."], "jumps": []}, {"id": "P2633", "text": ["Pin 7 is the output of the integrator.  Pin 9 is the DM output of the circuit. They should not be connected externally.", "Pin 7 is the output of the integrator. Pin 9 is the DM output of the circuit. They should not be connected externally."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on DELTA MODULATION CIRCUITS.", "This completes the information on DELTA MODULATION CIRCUITS.."], "jumps": ["P2630"]}, {"id": "P2920", "text": ["1.  DM CVSD Level modulators contain three circuits.", "1. DM CVSD Level modulators contain three circuits.ere...."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2.  The comparator compares the analog information signal to             the analog output of an integrator.", "2. The comparator compares the analog information signal to the analog output of an integrator."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3.  The integrator is basically a RC series circuit that changes              highs and lows to an analog signal.", "3. The integrator is basically a RC series circuit that changes highs and lows to an analog signal."], "jumps": ["P2950", "P2920"]}, {"id": "P2950", "text": ["4.  If the analog input signal is greater than the output of the                integrator, the analog input signal is increasing and the                   comparator generates a high output.", "4. If the analog input signal is greater than the output of the integrator, the analog input signal is increasing and the comparator generates a high output."], "jumps": ["P2960", "P2920"]}, {"id": "P2960", "text": ["5.  If the analog input signal is less than the output of the                      integrator, the analog input signal is decreasing and the                  comparator generates a low output.", "5. If the analog input signal is less than the output of the integrator, the analog input signal is decreasing and the comparator generates a low output."], "jumps": ["P2970", "P2920"]}, {"id": "P2970", "text": ["6.  The high or low output is applied to a D type flip-flop which is        clocked at the sample rate.", "6. The high or low output is applied to a D type flip-flop which is clocked at the sample rate."], "jumps": ["P2980", "P2920"]}, {"id": "P2980", "text": ["7.  The output of the circuit is high or low levels, a DM signal.", "7. The output of the circuit is high or low levels, a DM signal."], "jumps": ["P2990", "P2920"]}, {"id": "P2990", "text": ["8.  The MC3418 chip is a popular DM CVSD modulator.", "8. The MC3418 chip is a popular DM CVSD modulator........."], "jumps": ["P2999", "P2920"]}, {"id": "P2999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2990"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3015", "text": ["DM demodulators normally use integrated circuits.", "DM demodulators normally use integrated circuits..........."], "jumps": ["P3020", "P3001"]}, {"id": "P3020", "text": ["In fact, a DM demodulator can use the same type of chip used as a DM modulator."], "jumps": ["P3030", "P3015"]}, {"id": "P3030", "text": ["Since level DM modulators are the most often used, a level demodulator will be studied."], "jumps": ["P3015"]}, {"id": "P3040", "text": ["The level DM demodulator changes highs and lows to analog and only consists of one major circuit."], "jumps": ["P3015"]}, {"id": "P3050", "text": ["The integrator circuit operates just like the integrator in DM modulators."], "jumps": ["P3040"]}, {"id": "P3060", "text": ["With a high input, the capacitor charges according to the RC time constant."], "jumps": ["P3040"]}, {"id": "P3070", "text": ["The longer the high is applied, the greater the output voltage."], "jumps": ["P3060"]}, {"id": "P3080", "text": ["With a low input, the capacitor discharges according to the RC time constant."], "jumps": ["P3060"]}, {"id": "P3090", "text": ["The longer the low is applied, the less the output voltage."], "jumps": ["P3060"]}, {"id": "P3100", "text": ["The integrator circuit changes high and low inputs, a level DM signal, to an analog output signal."], "jumps": ["P3060"]}, {"id": "P3110", "text": ["And the length of time that a high or low is applied determines the level of the analog output signal."], "jumps": ["P3060"]}, {"id": "P3120", "text": ["What type of circuit is used to demodulate a level DM signal?"], "jumps": ["P3060"]}, {"id": "P3121", "text": [], "jumps": []}, {"id": "P3122", "text": ["A level DM demodulator circuit does not require a comparator."], "jumps": []}, {"id": "P3123", "text": ["A level DM demodulator circuit does not require a flip-flop.", "A level DM demodulator circuit does not require a flip-flop.."], "jumps": []}, {"id": "P3130", "text": ["What happens to the output signal of a level DM modulator if the input signal is low?"], "jumps": ["P3120"]}, {"id": "P3131", "text": [], "jumps": []}, {"id": "P3132", "text": ["With a low input, the capacitor discharges in the integrator circuit lowering the output voltage."], "jumps": []}, {"id": "P3133", "text": ["The analog output of a level DM modulator will never stay the same.  It will be increasing or decreasing according to the level of the input signal.", "The analog output of a level DM modulator will never stay the same. It will be increasing or decreasing according to the level of the input signal."], "jumps": []}, {"id": "P3140", "text": ["A popular IC that performs DM demodulation is the MC3418.", "A popular IC that performs DM demodulation is the MC3418..."], "jumps": ["P3150", "P3130"]}, {"id": "P3150", "text": ["The same chip can be used for either a modulator or demodulator (not both at the same time though)."], "jumps": ["P3160", "P3140"]}, {"id": "P3160", "text": ["First, the Encode/Decode(N) signal is set low.  This enables the chip to operate using digital signals.", "First, the Encode/Decode(N) signal is set low. This enables the chip to operate using digital signals."], "jumps": ["P3170", "P3140"]}, {"id": "P3170", "text": ["Then the level DM signal is applied to pin 13, digital data input."], "jumps": ["P3180", "P3160"]}, {"id": "P3180", "text": ["The analog output is taken from pin 7."], "jumps": ["P3190", "P3160"]}, {"id": "P3190", "text": ["This is why the output of the integrator is not internally connected to pin 2, so the chip can be used as a modulator or a demodulator."], "jumps": ["P3200", "P3160"]}, {"id": "P3200", "text": ["The clock input is applied to pin 14 and is set to the same frequency used in the modulator."], "jumps": ["P3210", "P3160"]}, {"id": "P3210", "text": ["Pins 6 and 7 connect to a RC circuit that sets the time constant as was used in the modulator."], "jumps": ["P3220", "P3160"]}, {"id": "P3220", "text": ["The basic DM demodulator uses pins 6, 7, 13, 14 and 15."], "jumps": ["P3230", "P3160"]}, {"id": "P3230", "text": ["Of course, other pins must be used to ensure correct operation of  the demodulator.", "Of course, other pins must be used to ensure correct operation of the demodulator."], "jumps": ["P3240", "P3160"]}, {"id": "P3240", "text": ["Power to the chip is applied to pins 8 and 16."], "jumps": ["P3250", "P3230"]}, {"id": "P3250", "text": ["Pin 8 is for dual power sources and is always the lowest voltage. It is grounded when one power source is used."], "jumps": ["P3260", "P3230"]}, {"id": "P3260", "text": ["Pins 3, 4 and 5 are used to set the operation of the chip."], "jumps": ["P3270", "P3230"]}, {"id": "P3270", "text": ["Pin 10 is used for a reference to other circuits, if needed, and pin11 is a four bit algorithm used in commercial telephone systems."], "jumps": ["P3280", "P3230"]}, {"id": "P3280", "text": ["As you have seen, the MC3418 is very versatile and can be used in many applications."], "jumps": ["P3290", "P3230"]}, {"id": "P3290", "text": ["In the MC3418 CVSD chip, which pin is used to input the DM signal?"], "jumps": ["P3230"]}, {"id": "P3291", "text": [], "jumps": []}, {"id": "P3292", "text": ["Pin 1 is the analog information input signal and is used when the chip is set for an analog DM modulator."], "jumps": []}, {"id": "P3293", "text": ["Pin 12 is the digital threshold input and is used when the chip is set for a digital DM modulator."], "jumps": []}, {"id": "P3300", "text": ["In the MC3418 CVSD chip, from which pin is the recovered analog information taken?"], "jumps": ["P3290"]}, {"id": "P3301", "text": [], "jumps": []}, {"id": "P3302", "text": ["Pin 1 is the analog information input signal used when the chip is set for an analog modulator."], "jumps": []}, {"id": "P3303", "text": ["Pin 9 is the digital output signal and is used when the chip is set for a DM analog or digital modulator."], "jumps": []}, {"id": "P3910", "text": ["This completes the information on DELTA DEMODULATION CIRCUITS."], "jumps": ["P3300"]}, {"id": "P3920", "text": ["1.  DM level demodulators contain one major circuit.", "1. DM level demodulators contain one major circuit. here...."], "jumps": ["P3930", "P3001"]}, {"id": "P3930", "text": ["2.  The integrator changes highs and lows to an analog output            signal.", "2. The integrator changes highs and lows to an analog output signal."], "jumps": ["P3940", "P3920"]}, {"id": "P3940", "text": ["3.  When the DM input is high, the analog output voltage                        increases.", "3. When the DM input is high, the analog output voltage increases."], "jumps": ["P3950", "P3920"]}, {"id": "P3950", "text": ["4.  When the DM input is low, the analog output voltage                          decreases.", "4. When the DM input is low, the analog output voltage decreases."], "jumps": ["P3960", "P3920"]}, {"id": "P3960", "text": ["5.  The MC3418 chip is a popular DM level demodulator.", "5. The MC3418 chip is a popular DM level demodulator......"], "jumps": ["P3999", "P3920"]}, {"id": "P3999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": [" let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
