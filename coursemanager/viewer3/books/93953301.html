 from point A through D1, the load, D4 and back to point B.", "Nida Corporation - Introduction to Diode Rectifiers", "Nida Corporation - Introduction to Power Supplies and Diode Rectifiers"], "jumps": ["P2250"]}, {"id": "P2247", "text": ["During the negative half cycle of the input waveform, point B is positive with respect to point A. During this cycle, current is from point B through D4, the load, D1 and back to point A...t A.rough D2, the load, D3 and back to point B..t B.", "The diodes only conduct when forward biased. During the positive half cycle of the input waveform, point A is positive with respect to point B. During this cycle, current is from point B through D3, the load, D2 and back to point A...t A..."], "jumps": ["P2250"]}, {"id": "P2240", "text": ["The diodes only conduct when forward biased. During the positive half cycle of the input waveform, point A is positive with respect to point B.  During this cycle, current is from point B through D3, the load, D2 and back to point A.", "The diodes only conduct when forward biased. During the positive half cycle of the input waveform, point A is positive with respect to point B. During this cycle, current is from point B through D3, the load, D2 and back to point A."], "jumps": []}, {"id": "P2230", "text": ["The bridge rectifier eliminates the need for a center tap transformer, therefore the output voltage of the bridge rectifier is twice that of the full wave rectifier.", "The bridge rectifier eliminates the need for a center tap transformer, therefore the output voltage of the bridge rectifier is twice that of the full wave rectifier......................................................"], "jumps": []}, {"id": "P2220", "text": ["Bridge rectifiers also use the entire input waveform. Two input signals, 180 degrees out of phase, are required from the input circuit."], "jumps": []}, {"id": "P2210", "text": ["The bridge rectifier uses four diodes. Half Wave Rectifier - one diode Full Wave Rectifier - two diodes Bridge Rectifier - four diodes"], "jumps": []}, {"id": "P2200", "text": ["Full wave rectifiers are more efficient than half wave rectifiers because they use the entire input signal."], "jumps": []}, {"id": "P2190", "text": ["Placing the cathode of each diode toward the input circuit produces negative pulsating DC."], "jumps": []}, {"id": "P2180", "text": ["Placing the anode of each diode toward the input circuit produces positive pulsating DC."], "jumps": []}, {"id": "P2170", "text": ["The diodes only conduct when forward biased."], "jumps": []}, {"id": "P2160", "text": ["Two signals, 180 degrees out of phase, are generated. Because the secondary is center tapped, we effectively half the secondary voltage. Each diode receives a voltage equal to half the amplitude of the secondary voltage..................................................................................."], "jumps": ["P2170", "P2150"]}, {"id": "P2150", "text": ["The full wave rectifier is made up of two half wave rectifiers. Full wave rectifiers use the entire input waveform."], "jumps": []}, {"id": "P2140", "text": ["The full wave rectifier uses two diodes. Half Wave Rectifier - one diode Full Wave Rectifier - two diodes Bridge Rectifier - four diodes"], "jumps": []}, {"id": "P2130", "text": ["However, the circuit is simple and inexpensive."], "jumps": []}, {"id": "P2120", "text": ["Half wave rectifiers are not efficient, only half of the input signal is used."], "jumps": []}, {"id": "P2110", "text": ["Placing the cathode towards the input produces negative pulsating DC."], "jumps": []}, {"id": "P2100", "text": ["Placing the anode towards the input produces positive pulsating DC."], "jumps": []}, {"id": "P2090", "text": ["The diode only conducts when forward biased."], "jumps": []}, {"id": "P2080", "text": ["The half wave rectifier is nothing more than a diode series limiter."], "jumps": []}, {"id": "P2070", "text": ["Let's look at the half wave rectifier first. Half Wave Rectifier - one diode Full Wave Rectifier - two diodes Bridge Rectifier - four diodes four diodes - four diodes"], "jumps": []}, {"id": "P2060", "text": ["Identifying the different rectifier circuits is easy. Count the number of diodes. Half Wave Rectifier - one diode Full Wave Rectifier - two diodes Bridge Rectifier - four diodes s"], "jumps": []}, {"id": "P2050", "text": ["These circuits are called: Half Wave Rectifier - one diode Full Wave Rectifier - two diodes Bridge Rectifier - four diodes s"], "jumps": []}, {"id": "P2040", "text": ["One of three different diode rectifier circuits is used to perform the conversion."], "jumps": []}, {"id": "P2030", "text": ["The rectifier changes AC power to DC power."], "jumps": []}, {"id": "P2020", "text": ["The rectifier section is the heart of the power supply. .."], "jumps": []}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": []}, {"id": "P1970", "text": ["7. The protection section limits or disables excess current flow so the power supply is not damaged."], "jumps": []}, {"id": "P1960", "text": ["6. The regulator section maintains the output DC at a constant level."], "jumps": []}, {"id": "P1950", "text": ["5. The filter section changes pulsating DC into smooth DC."], "jumps": []}, {"id": "P1940", "text": ["4. The rectifier section changes the AC into pulsating DC."], "jumps": []}, {"id": "P1930", "text": ["2. Power supplies use five sections. 3. The input section steps up or steps down the AC voltage."], "jumps": []}, {"id": "P1920", "text": ["1. Power supplies convert AC power to DC power. ere...."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on POWER SUPPLIES. E........"], "jumps": []}, {"id": "P1273", "text": ["The filter changes pulsating DC to smooth DC. ........", "Filter Input"], "jumps": []}, {"id": "P1272", "text": ["The rectifier converts AC to pulsating DC. ..........", "Rectifier Input"], "jumps": []}, {"id": "P1271", "text": [], "jumps": []}, {"id": "P1270", "text": ["Which section of a power supply maintains a constant output voltage?"], "jumps": []}, {"id": "P1263", "text": ["The regulator maintains the output voltage at a constant level.", "Regulator Input"], "jumps": []}, {"id": "P1262", "text": ["The filter changes pulsating DC to smooth DC. ...........", "Filter Input"], "jumps": []}, {"id": "P1261", "text": [], "jumps": []}, {"id": "P1260", "text": ["Which section of a power supply changes AC to pulsating DC?"], "jumps": []}, {"id": "P1253", "text": ["The regulator maintains the output voltage at a constant level.", "+11 VDC +10 VDC Input from Output of Filter Power Supply ly", "Regulator Input"], "jumps": []}, {"id": "P1252", "text": ["The rectifier converts AC to pulsating DC. ..........", "Rectifier Input"], "jumps": []}, {"id": "P1251", "text": [], "jumps": []}, {"id": "P1250", "text": ["Which section of a power supply changes pulsating DC to smooth DC?"], "jumps": []}, {"id": "P1240", "text": ["Remember, the regulator and protection sections are optional and only used when required by the type of load."], "jumps": []}, {"id": "P1230", "text": ["Protection circuits consist of either a Silicon Controlled Rectifier (SCR) or a transistor."], "jumps": []}, {"id": "P1220", "text": ["It samples the output current and then either limits or disables the power supply output."], "jumps": []}, {"id": "P1210", "text": ["The protection section prevents damage to the power supply if the load shorts or becomes faulted."], "jumps": []}, {"id": "P1200", "text": ["The output of the regulator is applied to the output of the power supply and to the optional protection section."], "jumps": []}, {"id": "P1190", "text": ["Regulator circuits contain a special type of diode (Zener diode), that maintains a specified output voltage."], "jumps": []}, {"id": "P1180", "text": ["The regulator section maintains the output voltage at a constant level despite changes in load current."], "jumps": []}, {"id": "P1170", "text": ["The smooth DC output of the filter is applied to the optional regulator section."], "jumps": []}, {"id": "P1160", "text": ["There are many types of filter circuits. They all operate on the characteristics of reactive components to changing voltage levels."], "jumps": []}, {"id": "P1156", "text": ["The output of a filter will have a small amount of ripple voltage.  In most cases the amount of ripple is so small that it is sufficient to call this smoothed DC or an almost constant DC level.", "The output of a filter will have a small amount of ripple voltage. In most cases the amount of ripple is so small that it is sufficient to call this smoothed DC or an almost constant DC level."], "jumps": []}, {"id": "P1155", "text": ["RIPPLE VOLTAGE - Ripple voltage is produced by the charging and discharging of the capacitor."], "jumps": []}, {"id": "P1150", "text": ["Filter circuits consist of reactive components. The RC time constant of the capacitor and resistor eliminate the variations, called ripple, from the input."], "jumps": []}, {"id": "P1140", "text": ["The filter section changes the pulsating DC to smooth DC. ."], "jumps": []}, {"id": "P1130", "text": ["The output of the rectifier is applied to the filter section."], "jumps": []}, {"id": "P1120", "text": ["Rectifier circuits contain diodes. One, two or four diodes are used to convert the AC into pulsating DC."], "jumps": []}, {"id": "P1115", "text": ["PULSATING DC - Pulsating DC is a current that varies in Amplitude but does not reverse polarity. It is not a steady direct current because the value fluctuates. However, it is not alternating current because the polarity remains the same, either positive or negative."], "jumps": []}, {"id": "P1110", "text": ["The rectifier section converts the AC into pulsating DC."], "jumps": []}, {"id": "P1100", "text": ["The output of the transformer is applied to the rectifier section."], "jumps": []}, {"id": "P1090", "text": ["Input circuits consist of a power transformer. Power transformers perform the transfer of energy without any change in frequency."], "jumps": []}, {"id": "P1080", "text": ["When the line voltage is not connected directly to the rectifier, the input section is used to step UP or step DOWN the AC input voltage to a level required for the power supply output."], "jumps": []}, {"id": "P1070", "text": ["Let's discuss each section separately starting with the input section."], "jumps": []}, {"id": "P1060", "text": ["The regulator and protection sections are optional."], "jumps": []}, {"id": "P1050", "text": ["The input, rectifier and filter sections are required for basic power supply operation."], "jumps": []}, {"id": "P1040", "text": ["Power supplies contain five separate sections or circuits."], "jumps": []}, {"id": "P1030", "text": ["They change the AC voltage from utility companies into the DC voltage required to operate electronic equipment."], "jumps": []}, {"id": "P1020", "text": ["Power supplies are used to convert AC power into smooth DC power."], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P460", "text": ["Let's begin the lesson on INTRODUCTION TO POWER SUPPLIES...................."], "jumps": []}, {"id": "P450", "text": ["It is the power supply and diode rectifier that change AC power to DC power."], "jumps": []}, {"id": "P440", "text": ["However, others are plugged into a wall outlet (AC power), but require DC power to operate.", "Television Toaster TV Drill", "Toaster Toaster TV Drill"], "jumps": []}, {"id": "P430", "text": ["Some products use AC power and are plugged into a wall outlet.", "Toaster Toaster TV Drill", "Radio Toaster TV Drill"], "jumps": []}, {"id": "P420", "text": ["Some products use DC power supplied by batteries.", "Radio Toaster TV Drill", "Toaster Toaster TV Drill"], "jumps": []}, {"id": "P410", "text": ["Every electrical product needs power to operate. ......", "Radio Toaster TV Drill let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
