const book = {"title": "93953704", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . .", "Title: SCR POWER CONTROL OPERATION fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": ["Hello, this lesson is about:s about: about:"], "jumps": []}, {"id": "P100", "text": ["w Describe the purpose of SCR power control circuits. w Describe the operation of a SCR power control circuit.", "w Recognize normal operation of a SCR power control circuit. w Measure the waveforms in an operating SCR power control circuit...................."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Alligator to Alligator Cable XXXXXXXXXnt"], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P400", "text": ["SCR's are used in DC and AC circuits. In this lesson, you will learn about the operation of a SCR in an AC circuit."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["AC SCR circuits are called power control circuits.", "AC SCR circuits are called power control circuits.........."], "jumps": ["P420", "P400"]}, {"id": "P13050", "text": ["Compare the components on PC130-52B to the schematic shown."], "jumps": ["P13060", "P13040"]}, {"id": "P430", "text": ["Let's begin the lesson on SCR POWER CONTROL OPERATION....................."], "jumps": ["P410"]}, {"id": "P2200", "text": ["The waveform from 0 degrees to 180 degrees, the left half of the wavefo shows that the SCR is ON for the entire alternation.", "The part of the waveform from 0 degrees to 180 degrees, the left half, shows that the SCR is ON for the entire alternation................."], "jumps": ["P2210", "P2170"]}, {"id": "P2210", "text": ["The waveform from 180 degrees to 360 degrees, the shows that the SCR is OFF for the entire alternation.  Remember, when the SCR is reverse biased it is OFF.", "The waveform from 180 degrees to 360 degrees, the shows that the SCR is OFF for the entire alternation. Remember, when the SCR is reverse biased it is OFF.W", "The waveform from 180 degrees to 360 degrees, the right side of the waveform, shows that the SCR is OFF for the entire alternation. Remember, when the SCR is reverse biased it is OFF."], "jumps": ["P2220", "P2170"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P13020", "text": ["The purpose of this experiment is to check the normal operation of a SCR power control circuit."], "jumps": ["P13040", "P2001"]}, {"id": "P13060", "text": ["Notice that I1 is the load.  It is an incandescent lamp.", "Notice that I1 is the load. It is an incandescent lamp."], "jumps": ["P13070", "P13040"]}, {"id": "P1020", "text": ["This is a typical SCR power control circuit.", "This is a typical SCR power control circuit................"], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["The purpose of this circuit is to rectify and control the amount of power applied to the load."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The SCR Power Control Circuit has an input circuit to apply gate current (Ig) to turn ON the SCR.  A separate voltage source maybe used.", "The SCR Power Control Circuit has an input circuit to apply gate current (Ig) to turn ON the SCR. A separate voltage source maybe used."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["R1 is used for cathode bias. C1 and C2 are DC blocking capacitors."], "jumps": ["P1055", "P1020"]}, {"id": "P1055", "text": ["Note that it does not have a reset circuit."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["Since an AC signal is applied, once the SCR is reverse biased, Ia (Anode current) stops. This action turns OFF the SCR."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["Only when the SCR is forward biased will the action of the gate turn ON the SCR."], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["In this power control circuit, which component comprises the input circuit?"], "jumps": ["P1020"]}, {"id": "P1081", "text": [], "jumps": []}, {"id": "P1082", "text": ["R1 is connected to the cathode of SCR1. It is not in the gate (or input) circuit."], "jumps": []}, {"id": "P1083", "text": ["C1 is connected to the cathode of SCR1. It is not in the gate (or input) circuit."], "jumps": []}, {"id": "P1090", "text": ["In this power control circuit, which component comprises the reset circuit?"], "jumps": ["P1080"]}, {"id": "P1091", "text": [], "jumps": []}, {"id": "P1092", "text": ["The SCR power control circuit is an AC circuit. When the SCR is reverse biased, it resets automatically."], "jumps": []}, {"id": "P1100", "text": ["The operation of a power control circuit is based on controlling the amount of TIME that AC voltage is sent to the load."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["If the full 360 degrees of the AC  input voltage is applied to the load, a certain maximum amount of power is used.", "If the full 360 degrees of the AC input voltage is applied to the load, a certain maximum amount of power is used."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["However, the SCR is a diode. This reduces the amount of AC applied to the load by half (180 degrees). The power is 50% of maximum."], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["In addition, the gate on the SCR controls when the SCR turns ON during the time that the SCR is forward biased."], "jumps": ["P1140", "P1100"]}, {"id": "P1140", "text": ["If the gate voltage turns ON the SCR only for half of the forward biased alternation, the power is reduced to 25% of maximum."], "jumps": ["P1150", "P1100"]}, {"id": "P1150", "text": ["By controlling the gate voltage (gate current), the time that the load receives voltage is controlled, which controls the amount of power."], "jumps": ["P1160", "P1100"]}, {"id": "P1160", "text": ["How is power to a load controlled in a SCR power controlled circuit?", "The amount of time that voltage is applied to the load."], "jumps": ["P1100"]}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1162", "text": ["The SCR does rectify the AC input voltage. However, this places the power used at 50% of maximum with no control."], "jumps": []}, {"id": "P1163", "text": ["The amplitude of the input signal determines the maximum amount of  power that could be used. It does not control the power used.", "The amplitude of the input signal determines the maximum amount of power that could be used. It does not control the power used."], "jumps": []}, {"id": "P1170", "text": ["Now, let's take a look at the waveforms in a SCR power control circuit."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["At 0 degrees of the input signal, the signals across the load resistor and SCR are as shown."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["From 0 to 90 degrees of the input signal, the SCR is forward biased. Assume that the SCR has not turned ON so current does not flow through the load."], "jumps": ["P1195", "P1170"]}, {"id": "P1195", "text": ["The SCR acts as an open component."], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["At 90 degrees assume the action of R1, R2 and C2 develop enough voltage that produces an Ig large enough to turn ON the SCR."], "jumps": ["P1210", "P1170"]}, {"id": "P1210", "text": ["The time between 0 and 90 degrees is called the FIRE ANGLE. In this case the fire angle is 90 degrees."], "jumps": ["P1220", "P1170"]}, {"id": "P1220", "text": ["During the time from 90 degrees to 180 degrees, the SCR is conducting.  The SCR is a short circuit.", "During the time from 90 degrees to 180 degrees, the SCR is conducting. The SCR is a short circuit."], "jumps": ["P1230", "P1170"]}, {"id": "P1230", "text": ["The time between 90 and 180 degrees is called the CONDUCTION ANGLE. In this case the conduction angle is also 90 degrees.", "The time between 90 and 180 degrees is called the CONDUCTION ANGLE. In this case the conduction angle is also 90 degrees..es."], "jumps": ["P1240", "P1170"]}, {"id": "P1240", "text": ["NOTE \nThe sum of the fire angle and conduction is always equal to180 degrees.  \n                             Fire angle + conduction angle = 180", "NOTE The sum of the fire angle and conduction is always equal to180 degrees. Fire angle + conduction angle = 180"], "jumps": ["P1250", "P1170"]}, {"id": "P1250", "text": ["During the time from 180 to 360 degrees the SCR is reverse biased and current does not flow. The SCR is reset automatically."], "jumps": ["P1260", "P1170"]}, {"id": "P1260", "text": ["Note the voltage is developed across the load for only 90 degrees of the input signal. Remember, Power equals the voltage squared divided by the resistance.", "Note the voltage is developed across the load for only 90 degrees of the input signal. Remember, Power equals the voltage squared divided by the resistance.O"], "jumps": ["P1270", "P1170"]}, {"id": "P1270", "text": ["If R2 is changed so that the gate current will not turn ON the SCR until after 90 degrees, the power to the load is less."], "jumps": ["P1280", "P1170"]}, {"id": "P1280", "text": ["Note that if the fire angle is 135degrees, the conduction angle is 45 degrees.   \n                                                 135 + 45 = 180", "Note that if the fire angle is 135degrees, the conduction angle is 45 degrees. 135 + 45 = 180"], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["If R2 is changed so that the gate current will turn ON the SCR between 0 and 90 degrees, the power to the load is greater."], "jumps": ["P1300", "P1270"]}, {"id": "P1300", "text": ["Note that if the fire angle is 45 degrees, the conduction angle is 135 degrees.\n                                                 45 + 135 = 180", "Note that if the fire angle is 45 degrees, the conduction angle is 135 degrees. 45 + 135 = 180"], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["By varying R2, the fire angle is changed between 0 and 180 degrees which controls the amount of power to the load."], "jumps": ["P1320", "P1290"]}, {"id": "P1320", "text": ["Which part of the SCR waveform is the fire angle?", "Which part of the SCR waveform is the fire angle?.........."], "jumps": ["P1310"]}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1322", "text": ["Part B of the waveform is the conduction angle, when the SCR is ON."], "jumps": []}, {"id": "P1323", "text": ["Part C of the waveform is when the SCR is reverse biased.", "Part C of the waveform is when the SCR is reverse biased..."], "jumps": []}, {"id": "P1330", "text": ["Which part of the SCR waveform is the conduction angle?", "Which part of the SCR waveform is the conduction angle?...."], "jumps": ["P1320"]}, {"id": "P1331", "text": [], "jumps": []}, {"id": "P1332", "text": ["Part A of the waveform is the fire angle, the SCR is OFF or open."], "jumps": []}, {"id": "P1333", "text": ["Part C of the waveform is when the SCR is reverse biased.", "Part C of the waveform is when the SCR is reverse biased..."], "jumps": []}, {"id": "P1340", "text": ["The SCR's ultimate effect is controlling the time that the average voltage of the source is applied to the load."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["The approximate average voltage is calculated by multiplying the RMS value of the input sine wave by the number of degrees of the sine wave that the SCR controls, divided by 360.", "The approximate average voltage is calculated by multiplying the RMS value of the input sine wave by the number of degrees of the sine wave that the SCR controls, divided by 360. 60.", "C Eave = Erms x 360 Where Erms = .707 times Epeak"], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["For example, if an SCR conducts (conduction angle) for 120 degrees of a 60 Hz, 120 V peak sine wave, the average voltage applied to the load is 28 VDC.", "C Eave = Erms x 360 Erms = 120 x .707 = 84.8 120 Eave = 84.8 x 360 = 84.8 x .33 = 28 VDCCCC"], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["If the load has a resistance of 30 W, the power to the load is 26 watts. To calculate power of the load, use the following formula:", "E P = R 28 = 30 = 26 wattsss33 = 28 VDCCCCCCCCCCCCCCCCCCCCCCCCCCCC = 84.4 x .33 = 28 VDCCCCCCCCCCCCCCCCCCCCDCCCCCCCCCCCCCCCCCCCCCC28 VDC= 84.4 x .33 = 28 VDCVDCCC"], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["If the conduction angle is decreased to 90 degrees, the power to the load is 14.7 watts, a decrease from 26 watts. To calculate power of the load, use the following formula:", "If the conduction angle is decreased to 90 degrees, the power to the load is 14.7 watts, a decrease from 26 watts. To calculate power of the load, use the following formula::", "C E Eave = Erms x P = 360 R 90 21 = 84.8 x = 360 30 = 84.8 x .25 = 21 VDC = 14.7 Wattsss"], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["If the conduction angle is increased to 150 degrees, the power to the load is 42 watts. An increase from 26 watts. To calculate power of the load, use the following formula:", "C E Eave = Erms x P = 360 R 150 35.2 = 84.8 x = 360 30 = 84.8 x .42 = 35.2 VDC = 42 Wattssssss"], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["What is the approximate voltage supplied to the load for a 12 Vrms input sine wave if a SCR conducts for 90 degrees?"], "jumps": ["P1390", "P1405"]}, {"id": "P1401", "text": [], "jumps": []}, {"id": "P1402", "text": ["You divided 12 by 2 to get peak and multiplied by .707 to get Erms.  However, the 12 V was given in RMS.", "You divided 12 by 2 to get peak and multiplied by .707 to get Erms. However, the 12 V was given in RMS."], "jumps": []}, {"id": "P1403", "text": ["You converted the 12 volts to RMS. However, the 12 volts was given in RMS."], "jumps": []}, {"id": "P1405", "text": ["AVERAGE VOLTAGE - To calculate the power load, use the following formula:", "C Eave = Erms x 360 282 = 30 = 26 wattsx .33 = 28 VDCCCCCCCCCCCCCCCCCCCCDCCCCCCCCCCCCCCCCCCCCCC28 VDC= 84.4 x .33 = 28 VDCVDCCC"], "jumps": []}, {"id": "P1410", "text": ["With a load resistance of 2 kW and an average voltage across the load for 3 VDC, what is the power used?"], "jumps": ["P1400", "P1415"]}, {"id": "P1411", "text": [], "jumps": []}, {"id": "P1412", "text": ["Remember, the load resistance is in kW.", "Remember, the load resistance is in kW....................."], "jumps": []}, {"id": "P1413", "text": ["You do not square the voltage. Remember, power equals the voltage square divided by the resistance."], "jumps": []}, {"id": "P1415", "text": ["POWER - To calculate power, use the following formula:", "E P = R 282 = 30 = 26 watts33 = 28 VDCCCCCCCCCCCCCCCCCCCCCCCCCCCC = 84.4 x .33 = 28 VDCCCCCCCCCCCCCCCCCCCCDCCCCCCCCCCCCCCCCCCCCCC28 VDC= 84.4 x .33 = 28 VDCVDCCC"], "jumps": []}, {"id": "P1910", "text": ["This completes the information on SCR POWER CONTROL CIRCUIT.", "This completes the information on SCR POWER CONTROL CIRCUIT.."], "jumps": ["P1001", "P1410"]}, {"id": "P1920", "text": ["1.  The purpose of a SCR power control circuit is to rectify and           control the amount of power applied to the load.", "1. The purpose of a SCR power control circuit is to rectify and control the amount of power applied to the load."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  The voltage applied to the gate turns ON the SCR for a portion      of  the forward bias alternation of the input waveform. During         the reverse biased alternation the SCR is turned OFF.", "2. The voltage applied to the gate turns ON the SCR for a portion of the forward bias alternation of the input waveform. During the reverse biased alternation the SCR is turned OFF.."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The amount of time that the SCR is ON determines the amount      of voltage, and consequently the amount of power, to the load.", "3. The amount of time that the SCR is ON determines the amount of voltage, and consequently the amount of power, to the load."], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["4.  The number of degrees before the SCR turns ON is the firing         angle. The number of degrees after the SCR turns ON is the           conduction angle. Their total is always 180 degrees.", "4. The number of degrees before the SCR turns ON is the firing angle. The number of degrees after the SCR turns ON is the conduction angle. Their total is always 180 degrees.."], "jumps": ["P1960", "P1920"]}, {"id": "P1960", "text": ["5.  The average voltage applied to the load equals the RMS value       of the input sine wave times the conduction angle divided by         360 degrees.", "5. The average voltage applied to the load equals the RMS value of the input sine wave times the conduction angle divided by 360 degrees.", "C Eave = Erms x 360 282 = 30 = 26 wattsx .33 = 28 VDCCCCCCCCCCCCCCCCCCCCDCCCCCCCCCCCCCCCCCCCCCC28 VDC= 84.4 x .33 = 28 VDCVDCCC"], "jumps": ["P1999", "P1950"]}, {"id": "P1999", "text": ["You have completed the Summary. \nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1960"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["The purpose of this experiment is to check the normal operation of a SCR power control circuit."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["Pick up the PC130-52B card. The purpose of this card is to demonstrate the operation of a SCR power control circuit."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["Compare the components on PC130-52B to the schematic shown."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["Notice that I1 is the load.  It is an incandescent lamp.", "Notice that I1 is the load. It is an incandescent lamp."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["R2, R3 and C2 form the input circuit. R3 is variable and is used to control the trigger point of the SCR."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["R1 is used for biasing the SCR.  Let's start the experiment.", "R1 is used for biasing the SCR. Let's start the experiment."], "jumps": ["P2090", "P2040"]}, {"id": "P2090", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P2040"]}, {"id": "P2100", "text": ["2.  Carefully plug PC130-52B into the Test Console PC1 position.", "2. Carefully plug PC130-52B into the Test Console PC1 position. to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2090"]}, {"id": "P2120", "text": ["3.  Adjust R3 on PC130-52B fully CW.  \n4.  Turn PC1 AC power switch ON.", "3. Adjust R3 on PC130-52B fully CW. 4. Turn PC1 AC power switch ON.witch to ON...."], "jumps": ["P2100", "P2125"]}, {"id": "P2125", "text": ["MEASUREMENT SETUP - Carefully adjust R3 fully clockwise."], "jumps": []}, {"id": "P2130", "text": ["Is the la let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
