const book = {"title": "93955603", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Title: DC SERIES FIELD MOTORSf asd fasfd asdf asdf sadf", "Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe the characteristics of a DC Series Field Motor. w Compare the characteristics of the DC Series Field Motor to the characteristics of the DC Shunt Field Motor. w Describe the techniques used to control the speed of a Series Field DC Motor. w Describe starting current as it relates to Motors.", "1. DC Series Field Motor. * Compare the characteristics of the DC Series Field Motor to the characteristics of the DC Shunt Field Motor. * Describe the techniques used to control the speed of a Series Field DC Motor. * Describe starting current as it relates to Motors. t as it relates to Motors."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["This lesson teaches you about the DC Series Field Motor."], "jumps": ["P300", "P420"]}, {"id": "P420", "text": ["The basic characteristics of a DC Series Field Motor are the same as the DC Shunt Field Motor."], "jumps": ["P400", "P430"]}, {"id": "P430", "text": ["Some of the Series Field motor values are calculated differently than Shunt Field motor values. This is due to the field coil being in series with the armature coil."], "jumps": ["P400", "P440"]}, {"id": "P440", "text": ["Let's begin the lesson on DC SERIES FIELD MOTOR..........................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The DC Series Field Motor has the field coil in series with the armature coil."], "jumps": ["P1001", "P1025"]}, {"id": "P1025", "text": ["The parts of the Series Field Motor are the same as the Shunt Field Motor."], "jumps": ["P1020", "P1030"]}, {"id": "P1030", "text": ["Remember, all motors have these same operating characteristics."], "jumps": ["P1020", "P1050"]}, {"id": "P1050", "text": ["Loads applied to the motors decrease RPM."], "jumps": ["P1030", "P1060"]}, {"id": "P1060", "text": [], "jumps": ["P1030", "P1070"]}, {"id": "P1070", "text": ["As CEMF decreases, armature current (I ) increases. This is because more applied voltage is felt across the armature."], "jumps": ["P1030", "P1080"]}, {"id": "P1080", "text": [], "jumps": ["P1030", "P1090"]}, {"id": "P1090", "text": ["In a DC Series Field Motor, input power (P ) still equals the applied voltage times total current."], "jumps": ["P1030", "P1100", "P"]}, {"id": "P1100", "text": ["P = Speed x Torque x (0.1047) = Ft Lbs/Sec", "P ( Watts ) = P ( Ft Lbs/Sec ) x 0.737 = Wattsss", "Output power equals speed (RPM) times torque (Ft"], "jumps": ["P1090", "P1110"]}, {"id": "P1110", "text": ["The differences between Shunt and Series DC Motors are their construction and how CEMF effects torque and armature current. y"], "jumps": ["P1100", "P1120"]}, {"id": "P1120", "text": ["Select the DC Series Field Motor..........................."], "jumps": ["P1110"]}, {"id": "P1121", "text": [], "jumps": []}, {"id": "P1122", "text": ["You selected the Shunt Field Motor. Notice that the field coil is in parallel to the armature."], "jumps": []}, {"id": "P1123", "text": ["You selected the Compound Field DC Motor. It has both a Series and Shunt Field."], "jumps": []}, {"id": "P1130", "text": ["In a DC Series Field motor, as load decreases, what happens to CEMF?"], "jumps": ["P1120"]}, {"id": "P1131", "text": [], "jumps": []}, {"id": "P1132", "text": ["For CEMF to decrease motor RPM must stay the same. A decreasing load causes RPM to change."], "jumps": []}, {"id": "P1133", "text": ["For CEMF to stay the same motor RPM must stay the same. A decreasing load causes RPM to change."], "jumps": []}, {"id": "P1140", "text": ["The construction of a DC Series motor is different from the DC Shunt motor."], "jumps": ["P1130", "P1150"]}, {"id": "P1150", "text": ["In the Shunt Motor, the field coil has many turns of fine wire designed to produce a high resistance."], "jumps": ["P1140", "P1160"]}, {"id": "P1160", "text": ["High resistance is needed to prevent a very large field current that could damage the field coil."], "jumps": ["P1140", "P1170"]}, {"id": "P1170", "text": ["In the Series Motor, the field coil has few turns of heavy wire designed to produce a low resistance."], "jumps": ["P1140", "P1180"]}, {"id": "P1180", "text": ["The low resistance is needed to allow most of E to be felt across the armature. This ensures the armature will rotate."], "jumps": ["P1140", "P1190"]}, {"id": "P1190", "text": ["\u0000\u0000\u0000incorrect1\u0000\u0000/\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000Y\u0001\u000f\u0000\u0000\u0000 \u0000\u000f\u0000High Resistance\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000o\u0001\u0010\u0000\u0000\u0000\u0001\u0000\u0001\u0000\u0000\u0000,\u0004\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000x\u0001\u0000\u0000\u00fa\u0000\u00ba\u0004\u0012\u0002\u0085\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u00af\u0001\u0012\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0014\u0000\u0013\u0000x\u001e\u0000\u0000\u0019\u0000\u001a\u0000\u00e5c\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00c7\u0001\u0013\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00d9\u0001\u0014\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000\u00f3\u0001\u0015\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0017\u0002\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00ba\u0004\u0002\u0000\u0000\u0000V\u0006\u0003\u0000\u0000\u0000t\u0007\u0000\u0000\u0000\u0000\u0000\u00001\u0002\u0017", "What type of field coil is used in a DC Series Field motor?"], "jumps": ["P1140"]}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1192", "text": ["If a high resistance field coil is used in a DC Series Motor, most of E is dropped across the field coil leaving very little voltage across the armature. The rotor would not rotate.."], "jumps": []}, {"id": "P1200", "text": ["To compare Series and Shunt Motors, the below values were chosen to produce identical magnetic fields."], "jumps": ["P1190", "P1210"]}, {"id": "P1210", "text": ["The armature produces the same magnetic field. MMF = (Number of turns on Armature) x (Armature Current) N x I Series = N x I Shunt = N x I = 200 x 1A = 200 x 1A = 200 MMF = 200 MMF A"], "jumps": ["P1220", "P1200"]}, {"id": "P1212", "text": ["The armature produces the same magnetic field. MMF = (Number of turns on Armature) x (Armature Current) N x I Series = N x I Shunt = N x I = 200 x 1A = 200 x 1A = 200 MMF = 200 MMF"], "jumps": ["P1220", "P1200"]}, {"id": "P1215", "text": ["MAGNETOMOTIVE FORCE (MMF) - The force of a magnetic field (MMF) depends on the current in the coil and the number of turns in the coil."], "jumps": []}, {"id": "P1220", "text": ["The field coils also produce the same magnetic fields. MMF = (Number of turns on Field Coil) x (Field Current) N x I Series = N x I Shunt = N x I = 10 x 1A = 100 x .1A = 10 MMF = 10 MMF F"], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["The characteristics between identical Series and Shunt Motors can be compared."], "jumps": ["P1200", "P1240"]}, {"id": "P1240", "text": ["First assume that CEMF is 0 and the motors have locked rotors or 0 RPM."], "jumps": ["P1200", "P1250"]}, {"id": "P1250", "text": ["10 turns 1W I - 1A E - 1V 200 turns 24W I - 1A E - 24VVVVVV", "100 turns 250W I - .1A E - 25V 200 turns 24W I - 1A E - 25VVVVV", "The circuit values for both motors are shown..............."], "jumps": ["P1260", "P1200"]}, {"id": "P1255", "text": ["n R = 1W R = 24W R = 25W R = 25V I = 1AA", "Given R = 1W R = 24W R = 25W R = 25V I = 1AA"], "jumps": []}, {"id": "P1257", "text": ["n R = 1W R = 24W R = 25W R = 25V I = 1AA", "Given R = 1W R = 24W R = 25W R = 25V I = 1AA"], "jumps": []}, {"id": "P1260", "text": ["100 turns 250W I - .1A E - 25V 200 turns 24W I - 1A E - 25V5VV", "10 turns 1W I - 1A E - 1V 200 turns 24W I - 1A E - 24V", "Lbs. Shunt Motor Torque = I x I x K = 1 x .1 x 1 = .1 Ft"], "jumps": ["P1250", "P1270"]}, {"id": "P1262", "text": ["Lbs. Shunt Motor Torque = I x I x K = 1 x .1 x 1 = .1 Ft", "10 turns 1W I - 1A E - 1V 200 turns 24W I - 1A E - 24V", "100 turns 250W I - .1A E - 25V 200 turns 24W I - 1A E - 25V5VV"], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["Torque in the Series Motor equals 1 Ft\u0095Lbs. \n         Series Motor                                    Shunt Motor\nTorque = I   x I   x K                         Torque = I   x I   x K\n               = 1A x 1A x 1                                     = 1 x .1 x 1 \n               = 1 Ft\u0095Lbs                                          = .1 Ft\u0095Lbs", "Lbs. Series Motor Shunt Motor Torque = I x I x K Torque = I x I x K = 1A x 1A x 1 = 1 x .1 x 1 = 1 Ft", "Lbs = .1 Ft", "10 turns 1W I - 1A E - 1V 200 turns 24W I - 1A E - 24V", "100 turns 250W I - .1A E - 25V 200 turns 24W I - 1A E - 25V5VV"], "jumps": ["P1262", "P1290"]}, {"id": "P1272", "text": ["10 turns 1W I - 1A E - 1V 200 turns 24W I - 1A E - 24V", "100 turns 250W I - .1A E - 25V 200 turns 24W I - 1A E - 25V5VV", "Lbs. Series Motor Shunt Motor Torque = I x I x K Torque = I x I x K = 1A x 1A x 1 = 1 x .1 x 1 = 1 Ft", "Lbs = .1 Ft"], "jumps": ["P1290", "P1262"]}, {"id": "P1290", "text": ["Lbs. Series Motor Shunt Motor Torque = I x I x K Torque = I x I x K = 1A x 1A x 1 = 1 x .1 x 1 = 1 Ft", "Lbs = .1 Ft", "Notice that the Series Motor has more torque Series Motor Shunt Motor Torque = I x I x K Torque = I x I x K = 1A x 1A x 1 = 1 x .1 x 1 = 1 Ft", "10 turns 1W I - 1A E - 1V 200 turns 24W I - 1A E - 24V", "100 turns 250W I - .1A E - 25V 200 turns 24W I - 1A E - 25V5VV"], "jumps": ["P1272", "P1300"]}, {"id": "P1292", "text": ["Lbs. Series Motor Shunt Motor Torque = I x I x K Torque = I x I x K = 1A x 1A x 1 = 1 x .1 x 1 = 1 Ft", "Lbs = .1 Ft", "10 turns 1W I - 1A E - 1V 200 turns 24W I - 1A E - 24V", "100 turns 250W I - .1A E - 25V 200 turns 24W I - 1A E - 25V5VV"], "jumps": ["P1300", "P1250"]}, {"id": "P1300", "text": ["Higher torque at lower speeds is a DC Series Motor characteristic.", "10 turns 1W I - 1A E - 1V 200 turns 24W I - 1A E - 24V", "100 turns 250W I - .1A E - 25V 200 turns 24W I - 1A E - 25V5VV"], "jumps": ["P1292", "P1310"]}, {"id": "P1302", "text": ["Higher torque at lower speeds is a DC Series Motor characteristic.", "10 turns 1W I - 1A E - 1V 200 turns 24W I - 1A E - 24V", "100 turns 250W I - .1A E - 25V 200 turns 24W I - 1A E - 25V5VV"], "jumps": ["P1310", "P1292"]}, {"id": "P1310", "text": ["10 turns 1 W I - 01A E - 01V 200 turns 24W CEMF - 22.5V I - .1A E - 2.4V E - 24.9V", "100 turns 250 W I - .1A E - 25V CEMF - 22.5V I - .1A E - 25V E - In other words, a Series Motor has less high speed torque than a Shunt Motor."], "jumps": ["P1310", "P1370"]}, {"id": "P1370", "text": ["\u0000\u0000\u0000incorrect1\u0000\u0000/\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000Y\u0001\u000f\u0000\u0000\u0000 \u0000\u0005\u0000Shunt Choiceett\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000o\u0001\u0010\u0000\u0000\u0000\u0001\u0000\u0001\u0000\u0000\u0000,\u0004\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000x\u0001\u0000\u0000\u00fa\u0000\u00ba\u0004\u0012\u0002\u0085\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u00af\u0001\u0012\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0014\u0000\u0013\u0000x\u001e\u0000\u0000\u0019\u0000\u001a\u0000\u00e5c\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00c7\u0001\u0013\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00d9\u0001\u0014\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000\u00f3\u0001\u0015\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0017\u0002\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00ba\u0004\u0002\u0000\u0000\u0000V\u0006\u0003\u0000\u0000\u0000t\u0007\u0000\u0000\u0000\u0000\u0000\u00001\u0002\u0017", "Which type of DC motor would a power screwdriver that requires low RPM and high torque use?"], "jumps": ["P1310"]}, {"id": "P1371", "text": [], "jumps": []}, {"id": "P1372", "text": ["Remember, a Shunt Motor has high torque at high RPM. A screwdriver needs high torque at low RPM."], "jumps": []}, {"id": "P1380", "text": ["The next motor characteristic we will discuss is speed control."], "jumps": ["P1370", "P1390"]}, {"id": "P1390", "text": ["The DC Shunt Field Motor uses 2 types of speed control, Armature and Shunt field resistance."], "jumps": ["P1380", "P1400"]}, {"id": "P1400", "text": ["The armature speed control varies the applied voltage."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["The Shunt Field resistance speed control varies the value of a resistor in series with the Field Coil."], "jumps": ["P1390", "P1420"]}, {"id": "P1420", "text": ["Let's examine why these two methods of speed control work in a Shunt Field DC Motor."], "jumps": ["P1390", "P1430"]}, {"id": "P1430", "text": ["First, recall how CEMF is produced. The armature is a conductor rotating in a magnetic field, much like a generator. Note there is always a constant (K) that represents the characteristics of the magnetic fields."], "jumps": ["P1390", "P1440"]}, {"id": "P1440", "text": ["Second, torque is the product of armature current, field current and the constant."], "jumps": ["P1430", "P1450"]}, {"id": "P1450", "text": ["Third, I can be shown by using the values of torque armature current and the constant.."], "jumps": ["P1430", "P1460"]}, {"id": "P1460", "text": ["SPEED x TORQUE I x KK", "Fourth, substituting I in the CEMF formula with I in the torque formula results in:"], "jumps": ["P1430", "P1470"]}, {"id": "P1470", "text": ["SPEED x TORQUE I x K", "Notice that in the CEMF formula, the K's cancel out."], "jumps": ["P1430", "P1480"]}, {"id": "P1480", "text": ["SPEED x TORQUE I KK", "CEMF x I TORQUE IA IA KK", "Last, rearranging the new CEMF formula shows what affects motor speed."], "jumps": ["P1430", "P1490"]}, {"id": "P1490", "text": ["CEMF x I TORQUE IA IA KK", "The formulas show how a change in applied voltage changes motor speed."], "jumps": ["P1480", "P1500"]}, {"id": "P1500", "text": ["Changing Field current also changes torque, which inversely changes speed."], "jumps": ["P1480", "P1510"]}, {"id": "P1510", "text": ["The same two methods of speed control can also be used by DC Series Field Motors."], "jumps": ["P1490", "P1520"]}, {"id": "P1520", "text": ["Changing the applied voltage affects I , I and I . This will vary motor speed."], "jumps": ["P1510", "P1530"]}, {"id": "P1530", "text": [], "jumps": ["P1510", "P1540"]}, {"id": "P1540", "text": ["The resistor is a current divider that changes I , which varies motor speed."], "jumps": ["P1510", "P1560"]}, {"id": "P1560", "text": ["What method/methods are used for speed control of DC Series Field Motor?"], "jumps": ["P1510"]}, {"id": "P1561", "text": [], "jumps": []}, {"id": "P1562", "text": ["There are two ways to vary the speed of a DC Series Motor.."], "jumps": []}, {"id": "P1570", "text": ["Now let's investigate motor start currents................."], "jumps": ["P1580", "P1560"]}, {"id": "P1580", "text": ["When a motor is first turned on, there is 0 RPM and 0 CEMF."], "jumps": ["P1570", "P1600"]}, {"id": "P1600", "text": ["Since CEMF is 0, the entire applied voltage is felt across the armature coils. Armature current is maximum."], "jumps": ["P1570", "P1610"]}, {"id": "P1610", "text": ["RPM - 0 ses CMF - Increasing IT decreases", "I decreases CEMF - Increasing I decreases", "As the motor begins to spin, armature current as well as total current drawn from the power source, will decrease due to CEMF."], "jumps": ["P1570", "P1630"]}, {"id": "P1630", "text": ["Even if the running current for a motor is small, the armature coil, field coil, and other connecting wires must be able to handle larger current at 0 RPM."], "jumps": ["P1570", "P1640"]}, {"id": "P1640", "text": ["In fact, some large motors have two sets of coils and wires that are controlled by a centrifugal switch."], "jumps": ["P1570", "P1650"]}, {"id": "P1650", "text": ["A heavy duty set of coils is used for starting the motor. This rates the motor for higher starting current."], "jumps": ["P1640", "P1660"]}, {"id": "P1660", "text": ["A normal set of coils is used when the motor is running. This rates the motor for lower running current."], "jumps": ["P1640", "P1910"]}, {"id": "P1910", "text": ["This completes the information on CHARACTERISTICS.E........"], "jumps": ["P1640", "P1001"]}, {"id": "P1920", "text": ["1. The DC Series Field Motor has the same basic characteristics as any motor."], "jumps": ["P1001", "P1930"]}, {"id": "P1930", "text": ["2. The Series Field Motor has the field coil in series to the armature."], "jumps": ["P1920", "P1940"]}, {"id": "P1940", "text": ["100 turns 250 W I - .1A E - 25V I - .1A E - 25V E - 25V", "10 turns 1 W I - 1A E - 1V 200 turns 24W I - .1A E - 2.4V E - 24.9V- 24.9V9V", "3. The Series Field Motor has more torque at lower RPM than the Shunt Field Motor."], "jumps": ["P1930", "P1950"]}, {"id": "P1950", "text": ["10 turns 1 W I - 01A E - 01V 200 turns 24W CEMF - 22.5V I - .1A E - 2.4V E - 24.9V", "100 turns 250 W I - .1A E - 25V CEMF - 22.5V I - .1A E - 25V E - 25V", "4. The Series Field Motor has less torque at higher RPM than the Shunt Field Motor."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["Power out = Speed x Torque x (0.1047) = Ft Lbs/Secccccc", "Power out ( Watts ) = P ( Ft Lbs/Sec ) x 0.737 = Watts", "5. The speed of a motor is expressed as:.................."], "jumps": ["P1940", "P1970"]}, {"id": "P1970", "text": ["6. DC Series Field Motors have 2 different types of speed control."], "jumps": ["P1960", "P1980"]}, {"id": "P1980", "text": ["7. Starting current in a motor is always greater than running current."], "jumps": ["P1999", "P1970"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1980", "P1001"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You hav let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
