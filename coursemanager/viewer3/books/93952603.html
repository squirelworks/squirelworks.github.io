 flow in the circuit. Now, let's verify that L1 is open."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["2.  Place PC130-18A S1 to the left to disconnect power to circuit         A. \n3.  Using a multimeter set to measure resistance, measure the              resistance of L1 (TP3 to TP4).", "2. Place PC130-18A S1 to the left to disconnect power to circuit A. 3. Using a multimeter set to measure resistance, measure the resistance of L1 (TP3 to TP4)..."], "jumps": ["P2200", "P2170", "P2195"]}, {"id": "P2195", "text": ["MEASUREMENT SETUP - Measure resistance of L1 (TP3 to TP4)."], "jumps": []}, {"id": "P2200", "text": ["Notice that L1 measures infinity.  A good inductor would have measured a low DC resistance (L1 resistance is approximately 35 ohms).", "Notice that L1 measures infinity. A good inductor would have measured a low DC resistance (L1 resistance is approximately 35 ohms)."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["An open L1 is the fault.  The computer will now replace L1 for you.", "An open L1 is the fault. The computer will now replace L1 for you. xternal program = SCAN FTR 0 C1 00o ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2200"]}, {"id": "P2220", "text": ["4.  Place PC130-18A S1 to the right. \n5.  Measure the voltage drops in circuit A.  Notice that the                     voltage drops returned to normal.  Circuit A is operating                  normally again, it has been repaired.", "4. Place PC130-18A S1 to the right. 5. Measure the voltage drops in circuit A. Notice that the voltage drops returned to normal. Circuit A is operating normally again, it has been repaired....."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["The computer will now fault circuit A again.", "The computer will now fault circuit A again. ternal program = SCAN FTR 0 F1 10t the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": [ let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
