<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["1. Understand the 8085 Microprocessor Circuits", "w Describe the internal structure of the 8085 microprocessor. w Describe the timed operations of the 8085 microprocessor........", "w Observe signals from the 8085 microprocessor circuit. w Enter a simple program to observe system operation..........."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P301", "text": [], "jumps": []}, {"id": "P335", "text": [], "jumps": []}, {"id": "P336", "text": [], "jumps": []}, {"id": "P337", "text": [], "jumps": []}, {"id": "P338", "text": [], "jumps": []}, {"id": "P339", "text": [], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P400", "text": ["In the previous lessons on microprocessors, you learned about basic microprocessor operation and the three basic elements found in microprocessors, the registers, the ALU, and the control section."], "jumps": ["P410", "P301"]}, {"id": "P410", "text": ["In this lesson, you will study the 8085 microprocessor in detail.  You will learn about the internal structure of the 8085 microprocessor, including the registers, ALU, and control section.", "In this lesson, you will study the 8085 microprocessor in detail. You will learn about the internal structure of the 8085 microprocessor, including the registers, ALU, and control section..."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Each of these sections will be described in detail.  By understanding each of these sections, your overall understanding of the 8085 will be much greater.", "Each of these sections will be described in detail. By understanding each of these sections, your overall understanding of the 8085 will be much greater."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["You will also learn about the input/output signals present at each pin of the 8085 IC package.  These signals are used to control the external microprocessor system elements and to transfer data between the microprocessor and the rest of the system.", "You will also learn about the input/output signals present at each pin of the 8085 IC package. These signals are used to control the external microprocessor system elements and to transfer data between the microprocessor and the rest of the system..."], "jumps": ["P435", "P400"]}, {"id": "P435", "text": ["After completing this lesson, you will be able to describe the structure of the 8085 and the features unique to the 8085.  For more details on the advanced features of a microprocessor, a manufacturer's data book should be obtained for the 8085.", "After completing this lesson, you will be able to describe the structure of the 8085 and the features unique to the 8085. For more details on the advanced features of a microprocessor, a manufacturer's data book should be obtained for the 8085..."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on 8085 MICROPROCESSOR CIRCUIT....................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": ["The 8085 is a 8 bit microprocessor.  The internal registers are 8 and 16 bits wide. The external data bus 8085 microprocessor is also 8 bits wide.", "The 8085 is a 8 bit microprocessor. The internal registers are 8 and 16 bits wide. The external data bus 8085 microprocessor is also 8 bits wide."], "jumps": ["P1050", "P1001"]}, {"id": "P1050", "text": ["The 8085 has a 16 bit address bus and thus the 8085 can address up to 2     or 64K bytes of memory.", "The 8085 has a 16 bit address bus and thus the 8085 can address up to 2 or 64K bytes of memory."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["The functional diagram of the 8085 is shown below.", "The functional diagram of the 8085 is shown below..........", "Instruction Register (8)", "Flag Register (8-5 bits used))))) (8)", "Accumulator Latch (8))(8)", "Address Bus HIGHER A8 - A15 LOWER : AD0 - AD7"], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["You can see from the diagram that the sections of the 8085 microprocessor are connected by internal busses.  All communications within the microprocessor are performed by the combined effort of the data and control bus.", "You can see from the diagram that the sections of the 8085 microprocessor are connected by internal busses. All communications within the microprocessor are performed by the combined effort of the data and control bus..."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["The address bus is primarily for addressing locations or devices external to the internal system.  The data bus of the 8085 is 8 bit wide.  This is why the 8085 is known as a 8 bit microprocessor.", "The address bus is primarily for addressing locations or devices external to the internal system. The data bus of the 8085 is 8 bit wide. This is why the 8085 is known as a 8 bit microprocessor."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["Before we examine the sections of the 8085 in detail, let's look at a simple microprocessor instruction.  The instruction is:", "Before we examine the sections of the 8085 in detail, let's look at a simple microprocessor instruction. The instruction is:", "Opcode Mnemonic 88 ADD B"], "jumps": ["P1100", "P1060"]}, {"id": "P1100", "text": ["This instruction adds the 8 bit value in register B to the 8 bit value in the accumulator (register A) and places the result in the accumulator.  This one operation causes many things to happen within the microprocessor.", "This instruction adds the 8 bit value in register B to the 8 bit value in the accumulator (register A) and places the result in the accumulator. This one operation causes many things to happen within the microprocessor..."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["A simplified list of the actions is given below.", "A simplified list of the actions is given below............", "1. Fetch the Instruction a. Put the value of the Program Counter (PC) into the address buffers. b. Drive Address Latch Enable signal high or low. c. The /Read signal goes low to indicate a read. d. Read the 8 bit intruction from the data bus. e. Increment the Program Counter. 2. Decode Instruction a. Move the instruction to the Instruction Register. b. Decode the instruction. c. Generate timing signals for the registers and ALU. 3. Perform the Addition a. Move the 8 bit value of the A register into the ALU. b. Move the 8 bit value of the B register into the ALU. c. Cause the ALU to add the A to the B register. d. Move the result back to the A register....."], "jumps": ["P1120", "P1090", "PC"]}, {"id": "P1120", "text": ["From this example, you can see that the registers, buffers, control section, ALU, and the internal data bus are all used to add these two numbers."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["The operation of these elements must be controlled or coordinated by the control sections of the microprocessor.  The microprocessor performs many operations for each instruction that is executed.", "The operation of these elements must be controlled or coordinated by the control sections of the microprocessor. The microprocessor performs many operations for each instruction that is executed..."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["In addition to the actions listed, the microprocessor must also check the status of the interrupts and reset while executing the instruction."], "jumps": ["P1150", "P1110"]}, {"id": "P1150", "text": ["Now that you have an idea of what steps the microprocessor must perform for a basic instruction, let's look at the sections of the 8085 microprocessor in detail.", "Instruction Register (8)", "Flag Register (8-5 bits used))))) (8)", "Accumulator Latch (8))(8)", "Address Bus HIGHER A8 - A15 LOWER : AD0 - AD7"], "jumps": ["P1160", "P1110"]}, {"id": "P1160", "text": ["It is here that you will see a breakdown of each element in the 8085 block diagram and how they correspond to one another."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["REGISTERS As we saw in the previous example, the registers are where data and addresses are temporarily stored within the microprocessor. The data in the registers can be accessed and changed much faster than data in external memory. Let's look at a brief summary of each register......#"], "jumps": ["P1180", "P1150"]}, {"id": "P1180", "text": ["The accumulator (A register) is used for arithmetic, logic, load and store operations. This is one of the registers used in the previous instruction example."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["There are three 16 bit or six 8 bit general purpose registers depending on how you use them.  The BC register can be 16 bit, known as BC, or 8 bit as in B or C.  B was used in the instruction example provided in this lesson.", "There are three 16 bit or six 8 bit general purpose registers depending on how you use them. The BC register can be 16 bit, known as BC, or 8 bit as in B or C. B was used in the instruction example provided in this lesson. he registers DE (D & E) and HL (H & L) also work in this manner. When the registers are used in tandem they are called register pairs."], "jumps": ["P1192", "P1170"]}, {"id": "P1192", "text": ["Further, the DE and HL registers also work in this manner. When the registers work in tandem they are called register pairs."], "jumps": ["P1194", "P1170"]}, {"id": "P1194", "text": ["When a 2 or 3 byte instruction is used, you cannot send (for example) the low order 8 bits to the C register and the high order 8 bits the D register. ster."], "jumps": ["P1196", "P1170"]}, {"id": "P1196", "text": ["The full 16 bits must be sent to either the BC register pair or the DE register pair. The same holds true for the HL register pair.its the D register. ster."], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["There are certain microprocessor instructions that use 16 bit values.  Remember,  if you write 8 bits into D and you use a 16 bit DE instruction, the contents of E are unknown and will cause incorrect values.", "There are certain microprocessor instructions that use 16 bit values. Remember, if you write 8 bits into D and you use a 16 bit DE instruction, the contents of E are unknown and will cause incorrect values.ues..."], "jumps": ["P1210", "P1170"]}, {"id": "P1210", "text": ["The stack pointer (SP) is a special address register that always points to the top of the stack.  A stack is a location in memory where data is stored like a stack of papers.  You must take papers off the stack to see what is below them.", "The stack pointer (SP) is a special address register that always points to the top of the stack. A stack is a location in memory where data is stored like a stack of papers. You must take papers off the stack to see what is below them. rther, the BC, DE and HL registers are considered register pairs, and cannot be separated for the same instruction....."], "jumps": ["P1220", "P1170"]}, {"id": "P1220", "text": ["The Program Counter (PC) always points to the memory location of  the next instruction to be executed.  The register always contains a 16 bit address.", "The Program Counter (PC) always points to the memory location of the next instruction to be executed. The register always contains a 16 bit address. at is, when a 2 or 3 byte instruction is used, you cannot send (for example) the low order 8 bits to the C register and the high order 8 bits the D register."], "jumps": ["P1230", "P1170", "PC"]}, {"id": "P1230", "text": ["The Flag register contains 8 bits which indicate certain conditions within the system.  These conditions are the carry flag (C), the auxiliary flag (AC), the sign flag (S), the zero flag (Z) and the parity flag (P).", "The Flag register contains 8 bits which indicate certain conditions within the system. These conditions are the carry flag (C), the auxiliary flag (AC), the sign flag (S), the zero flag (Z) and the parity flag (P)..."], "jumps": ["P1240", "P1170", "P"]}, {"id": "P1240", "text": ["The carry flag (C) is controlled by the certain arithmetic operations of the microprocessor. If this flag is set (a logic high) it indicates that either a carry (from addition) or borrow (from subtraction) has occurred. The condition of this bit can be tested to determine if an added or subtracted number has borrowed or carried....."], "jumps": ["P1250", "P1170"]}, {"id": "P1250", "text": ["The auxiliary carry flag (AC), also known as the overflow bit, indicates overflow when performing Binary Coded Decimal (BCD) functions.  Unlike the carry which indicates overflow in the 8th bit, this indicates overflow from the 4th bit.", "The auxiliary carry flag (AC), also known as the overflow bit, indicates overflow when performing Binary Coded Decimal (BCD) functions. Unlike the carry which indicates overflow in the 8th bit, this indicates overflow from the 4th bit..."], "jumps": ["P1253", "P1170"]}, {"id": "P1253", "text": ["In microprocessors, register bits are labeled 0 through 7, or 0 through 15, however big the system allows. This means that the 4th bit (for example) is really bit 3.  The graphic below illustrates this.", "In microprocessors, register bits are labeled 0 through 7, or 0 through 15, however big the system allows. This means that the 4th bit (for example) is really bit 3. The graphic below illustrates this.."], "jumps": ["P1260", "P1170"]}, {"id": "P1260", "text": ["The sign bit (S), is set according to the 8th bit in the accumulator (A) after an arithmetic or logic operation.  The 8th bit can be used to represent the sign of a number.", "The sign bit (S), is set according to the 8th bit in the accumulator (A) after an arithmetic or logic operation. The 8th bit can be used to represent the sign of a number."], "jumps": ["P1270", "P1253"]}, {"id": "P1270", "text": ["The zero flag (Z), is set to 1 when the result of an operation generates zero for a result.  In other words, zero in each bit location of the result.  This flag is set even if a carry is generated but all bits of the register are zero.", "The zero flag (Z), is set to 1 when the result of an operation generates zero for a result. In other words, zero in each bit location of the result. This flag is set even if a carry is generated but all bits of the register are zero."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["The parity bit (P) is set to 1 if the number of 1 bits in the accumulator (A) is even, and 0 if the number is odd.  This makes sure that the information is correct in the system.  Parity is a method for error detection.", "The parity bit (P) is set to 1 if the number of 1 bits in the accumulator (A) is even, and 0 if the number is odd. This makes sure that the information is correct in the system. Parity is a method for error detection..."], "jumps": ["P1290", "P1260", "P"]}, {"id": "P1290", "text": ["As you can see, these five flags provide valuable information about the operation of the system after many of the instructions are performed."], "jumps": ["P1300", "P1260"]}, {"id": "P1300", "text": ["Without the flag information, the results of an operation would be known, but any of the conditions or problems with the operation wouldn't."], "jumps": ["P1310", "P1260"]}, {"id": "P1310", "text": ["Without knowing the information regarding that operation, incorrect results could be used by the system, compounding errors in the operations that follow."], "jumps": ["P1320", "P1260"]}, {"id": "P1320", "text": ["Also, not shown, are internal buffers which are used to temporarily hold data or addresses.  These buffers hold information the microprocessor needs to process.  By storing the information internally processing speed is increased.", "Also, not shown, are internal buffers which are used to temporarily hold data or addresses. These buffers hold information the microprocessor needs to process. By storing the information internally processing speed is increased..."], "jumps": ["P1330", "P1260"]}, {"id": "P1330", "text": ["Data is transferred between registers or between a registers and another section of the microprocessor on the internal data bus.  The control blocks manage the flow of the data within the microprocessor.", "Data is transferred between registers or between a registers and another section of the microprocessor on the internal data bus. The control blocks manage the flow of the data within the microprocessor..."], "jumps": ["P1340", "P1260"]}, {"id": "P1340", "text": ["ALU  The arithmetic/logic unit (ALU) of the 8085 microprocessor performs the arithmetic and logic operations for the system.  The ALU can add, subtract, increment, decrement, AND, OR, XOR, comparison, rotation and complement.", "ALU The arithmetic/logic unit (ALU) of the 8085 microprocessor performs the arithmetic and logic operations for the system. The ALU can add, subtract, increment, decrement, AND, OR, XOR, comparison, rotation and complement..."], "jumps": ["P1350", "P1260"]}, {"id": "P1350", "text": ["Based upon the result of an operation, certain bits will be set or reset within the flag registers.  This provides the microprocessor with a way of knowing what occurred during the previous instruction.", "Based upon the result of an operation, certain bits will be set or reset within the flag registers. This provides the microprocessor with a way of knowing what occurred during the previous instruction..."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["After all data has been moved into place the control register allows the ALU to process the data.  The result of the operation is placed in a location dictated by the instruction and the control section.  The bits of the flag register are set or reset according to the result.", "After all data has been moved into place the control register allows the ALU to process the data. The result of the operation is placed in a location dictated by the instruction and the control section. The bits of the flag register are set or reset according to the result..."], "jumps": ["P1370", "P1340"]}, {"id": "P1370", "text": ["For a complete list of the 8085 arithmetic and logic operations, you should consult an 8085 microprocessor data book."], "jumps": ["P1380", "P1340"]}, {"id": "P1380", "text": ["TIMING AND CONTROL\nThe timing and control block includes the circuitry to apply the internal clock signals, process the RESET signal, the READY signal and generate the memory control signals.  Each of these signals will be covered in greater detail later in this lesson.", "TIMING AND CONTROL The timing and control block includes the circuitry to apply the internal clock signals, process the RESET signal, the READY signal and generate the memory control signals. Each of these signals will be covered in greater detail later in this lesson..."], "jumps": ["P1390", "P1340"]}, {"id": "P1390", "text": ["In the next lesson you will see how important the signals of this section are to the proper movement of information from external devices to the microprocessor and vice versa."], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["If the timing is not correct, devices will conflict and incorrect data will result."], "jumps": ["P1410", "P1380"]}, {"id": "P1410", "text": ["INTERRUPT CONTROL\nThis block allows the microprocessor to stop what it is doing and service an external device such as a keyboard.", "INTERRUPT CONTROL This block allows the microprocessor to stop what it is doing and service an external device such as a keyboard....."], "jumps": ["P1420", "P1380"]}, {"id": "P1420", "text": ["Without interrupts, the currently executing program would have to repeatedly check or poll each external device to see if a device was ready to transfer data between itself and the microprocessor."], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["For example, when you press a key on the keyboard of an IBM personal computer, an interrupt is generated and the computer stops executing the current program and stores the keystroke in a buffer.  The computer then continues execution of the program.", "For example, when you press a key on the keyboard of an IBM personal computer, an interrupt is generated and the computer stops executing the current program and stores the keystroke in a buffer. The computer then continues execution of the program..."], "jumps": ["P1440", "P1410"]}, {"id": "P1440", "text": ["The NIDA 8085 microprocessor card set does not use an interrupt for the keyboard. Rather, the keyboard circuits are repeatedly polled to see if a key has been pressed.  There are advantages and disadvantages to both methods.", "The NIDA 8085 microprocessor card set does not use an interrupt for the keyboard. Rather, the keyboard circuits are repeatedly polled to see if a key has been pressed. There are advantages and disadvantages to both methods..."], "jumps": ["P1450", "P1410"]}, {"id": "P1450", "text": ["When the microprocessor receives an interrupt, it stops executing the current program and executes another program to specifically deal with that interrupt."], "jumps": ["P1460", "P1410"]}, {"id": "P1460", "text": ["After processing the interrupt the microprocessor returns to the original program."], "jumps": ["P1470", "P1410"]}, {"id": "P1470", "text": ["When an interrupt is called, the interrupt program must do several things so the original program register settings are correct when execution begins again.  The list below indicates the minimum number of steps that must be performed by the interrupt program:", "When an interrupt is called, the interrupt program must do several things so the original program register settings are correct when execution begins again. The list below indicates the minimum number of steps that must be performed by the interrupt program: Save the contents of any general purpose register that will be changed during the interrupt routine. 2. Service the cause of the interrupt. 3. Restore the contents of the registers. 4. Issue a RETURN instruction.....", "1. Save the contents of any general purpose register that will be changed during the interrupt routine. 2. Service the cause of the interrupt. 3. Restore the contents of the registers. 4. Issue a RETURN instruction.struction........"], "jumps": ["P1480", "P1410"]}, {"id": "P1480", "text": ["These steps provide correct interrupt recovery in the original program.  If you modified registers and didn't restore them to their proper values, errors could exist in the main program data once it resumes.", "Now that we have looked at the different blocks of the 8085 microprocessor, let's look at the pin configuration (pin out) for the microprocessor.", "These steps provide correct interrupt recovery in the original program. If you modified registers and didn't restore them to their proper values, errors could exist in the main program data once it resumes...", "Now that we have looked at the different blocks of the 8085 microprocessor, let's look at the pin configuration (pin out) for the microprocessor.."], "jumps": ["P1490", "P1470", "P1500"]}, {"id": "P1500", "text": ["The pin configuration of the 8085 is shown below.  Note that address pins 12 through 19 are also data pins.  Special circuitry will take the correct information from these pins at the proper time during operation.  Having two or more signals on one line is known as multiplexing.", "The pin configuration of the 8085 is shown below. Note that address pins 12 through 19 are also data pins. Special circuitry will take the correct information from these pins at the proper time during operation. Having two or more signals on one line is known as multiplexing..."], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["Pin 20 is the Ground or reference connection.  Pins 12-19 are the A/D0 - A/D7 Multiplexed Address/Data Bus lines.  In a machine cycle this bus is the address bus; then it becomes the data bus for the remainder of the cycle.", "Pin 20 is the Ground or reference connection. Pins 12-19 are the A/D0 - A/D7 Multiplexed Address/Data Bus lines. In a machine cycle this bus is the address bus; then it becomes the data bus for the remainder of the cycle..."], "jumps": ["P1520", "P1490"]}, {"id": "P1520", "text": ["Pins 21-28 are the A8-A15 signals of the Address Bus.  These are the high 8 bits of the address bus.  There are no multiplexed data signals on these pins.", "Pins 21-28 are the A8-A15 signals of the Address Bus. These are the high 8 bits of the address bus. There are no multiplexed data signals on these pins."], "jumps": ["P1530", "P1490"]}, {"id": "P1530", "text": ["Pins 1 and 2 are the XTAL1 and XTAL2 signals which are used to connect an external crystal to the microprocessor.  The 8085 has a built in timing circuit which requires an external crystal.", "Pins 1 and 2 are the XTAL1 and XTAL2 signals which are used to connect an external crystal to the microprocessor. The 8085 has a built in timing circuit which requires an external crystal."], "jumps": ["P1540", "P1490"]}, {"id": "P1540", "text": ["Pin 36 is the RESET IN signal.  When this line is set low, the microprocessor resets and the instruction pointer is set to zero.", "Pin 36 is the RESET IN signal. When this line is set low, the microprocessor resets and the instruction pointer is set to zero."], "jumps": ["P1550", "P1490"]}, {"id": "P1550", "text": ["Pin 3 is the RESET OUT signal.  This signal indicates high when the processor is being reset and can be used to reset other devices in the system.", "Pin 3 is the RESET OUT signal. This signal indicates high when the processor is being reset and can be used to reset other devices in the system."], "jumps": ["P1560", "P1490"]}, {"id": "P1560", "text": ["Pin 4 and 5 are the SOD and SID signals.  The SOD or Serial Output Data line is used to send serial data from the microprocessor using the SIM instruction.  The SID or Serial Input Data line is used to receive serial data using the RIM instruction.", "Pin 4 and 5 are the SOD and SID signals. The SOD or Serial Output Data line is used to send serial data from the microprocessor using the SIM instruction. The SID or Serial Input Data line is used to receive serial data using the RIM instruction..."], "jumps": ["P1570", "P1490"]}, {"id": "P1570", "text": ["Pin 7, 8 and 9 are the RST 7.5 RST 6.5 and RST 5.5 External Restart Interrupt connections.  A high on these lines indicates a reset to the microprocessor.  These interrupts have predefined memory locations where they will execute from.  These interrupts can also be turned off using a process called masking.", "Pin 7, 8 and 9 are the RST 7.5 RST 6.5 and RST 5.5 External Restart Interrupt connections. A high on these lines indicates a reset to the microprocessor. These interrupts have predefined memory locations where they will execute from. These interrupts can also be turned off using a process called masking..."], "jumps": ["P1580", "P1490"]}, {"id": "P1580", "text": ["Pin 6 is the TRAP interrupt.  This interrupt cannot be turned off and takes precedence over all other interrupts.  This interrupt also has a predefined location where the microprocessor will begin execution of code when the interrupt occurs.", "Pin 6 is the TRAP interrupt. This interrupt cannot be turned off and takes precedence over all other interrupts. This interrupt also has a predefined location where the microprocessor will begin execution of code when the interrupt occurs..."], "jumps": ["P1590", "P1490"]}, {"id": "P1590", "text": ["Pin 10 and 11 are the INTR and INTA signals.  The INTR is the interrupt request signal.  A high on this line indicates a reset is requested from an external device.  When the INTA or interrupt acknowledge signal is low, it indicates that the microprocessor acknowledges the request.", "Pin 10 and 11 are the INTR and INTA signals. The INTR is the interrupt request signal. A high on this line indicates a reset is requested from an external device. When the INTA or interrupt acknowledge signal is low, it indicates that the microprocessor acknowledges the request..."], "jumps": ["P1600", "P1490"]}, {"id": "P1600", "text": ["Normally, the RST 5.5, 6.5 and 7.5 interrupts are enough for applications requiring the microprocessor.  If more are required an interrupt controller is used which connects to the INTR and INTA signal lines.  This device must generate the location of where the programs will initiate.", "Normally, the RST 5.5, 6.5 and 7.5 interrupts are enough for applications requiring the microprocessor. If more are required an interrupt controller is used which connects to the INTR and INTA signal lines. This device must generate the location of where the programs will initiate."], "jumps": ["P1610", "P1490"]}, {"id": "P1610", "text": ["The table below shows the priorities of the interrupt pins.  If the microprocessor is servicing an interrupt and then receives a request from one with a higher priority, it will pause its present operation to process the request with the higher priority.  After that, the microprocessor will return to its previous operation.", "The table below shows the priorities of the interrupt pins. If the microprocessor is servicing an interrupt and then receives a request from one with a higher priority, it will pause its present operation to process the request with the higher priority. After that, the microprocessor will return to its previous operation...", "TRAP RST 7.5 RST 6.5 RST 5.5 INTRRRRRRRRRRRRRRRR7.5", "Pin 30 ALE is the Address Latch Enable signal. The address latch IC is a bank of flip-flops used to store the last input value. The address latch stores the address from the multiplexed lines so it will be available for the rest of the cycle. The address latch enable tells the address latch it can take the information from the A/D pins..."], "jumps": ["P1620", "P1490", "P1630", "P1610"]}, {"id": "P1630", "text": ["Pin 31, WR, is the Write Control signal.  A low level indicates the data on the data bus is to be written to the selected memory address or I/O location.", "Pin 31, WR, is the Write Control signal. A low level indicates the data on the data bus is to be written to the selected memory address or I/O location."], "jumps": ["P1640", "P1620"]}, {"id": "P1640", "text": ["Pin 32, RD, is the Read Control signal.  A low level indicates the selected memory or I/O device is to be read and that the data bus is available for data transfer.", "Pin 32, RD, is the Read Control signal. A low level indicates the selected memory or I/O device is to be read and that the data bus is available for data transfer."], "jumps": ["P1650", "P1620"]}, {"id": "P1650", "text": ["Pin 39 and 38 are the HOLD and HLDA signals.  When high, the HOLD signal indicates that another device wants to take control of the address and data bus.  This is known as DMA or direct memory access.", "Pin 39 and 38 are the HOLD and HLDA signals. When high, the HOLD signal indicates that another device wants to take control of the address and data bus. This is known as DMA or direct memory access..."], "jumps": ["P1660", "P1620"]}, {"id": "P1660", "text": ["The HLDA or Hold Acknowledge signal is used to tell the device that it may take control of the address and data bus as soon the current instruction cycle ends.  The microprocessor will not take control again until the HOLD signal is removed.", "The HLDA or Hold Acknowledge signal is used to tell the device that it may take control of the address and data bus as soon the current instruction cycle ends. The microprocessor will not take control again until the HOLD signal is removed..."], "jumps": ["P1670", "P1620"]}, {"id": "P1670", "text": ["Pin 37 is the CLK or Clock signal.  This signal provides a system clock to other devices in the system.  The frequency of this clock is half as much as the crystal frequency.  The microprocessor runs at half the speed of the crystal attached to it.", "Pin 37 is the CLK or Clock signal. This signal provides a system clock to other devices in the system. The frequency of this clock is half as much as the crystal frequency. The microprocessor runs at half the speed of the crystal attached to it..."], "jumps": ["P1680", "P1620"]}, {"id": "P1680", "text": ["Pin 35 is the READY signal.  This signal is used for external memory or devices that are slower than the microprocessor.  A low on this line indicates that the device being used is not finished reading or writing and the microprocessor must wait.", "Pin 35 is the READY signal. This signal is used for external memory or devices that are slower than the microprocessor. A low on this line indicates that the device being used is not finished reading or writing and the microprocessor must wait..."], "jumps": ["P1690", "P1620"]}, {"id": "P1690", "text": ["When this signal goes high, it indicates to the microprocessor that it may continue with its next operation.", "When this signal goes high, it indicates to the microprocessor that it may continue with its next operation. is is known as asychnronous communication. In other words, both devices are not synchronized..."], "jumps": ["P1700", "P1620"]}, {"id": "P1700", "text": ["Pin 34 is the IO/M signal.  When high indicates this pin an IO device is being accessed.  When the signal is low, memory is being accessed.  This pin is very important for selecting the correct external devices in the system.", "Pin 34 is the IO/M signal. When high indicates this pin an IO device is being accessed. When the signal is low, memory is being accessed. This pin is very important for selecting the correct external devices in the system..."], "jumps": ["P1710", "P1620"]}, {"id": "P1710", "text": ["Pin 29 and 33 are the S0 and S1 signals.  The signals are known as the machine status signals and are used with the IO/M signal in certain situations for proper external circuit operation.", "Pin 29 and 33 are the S0 and S1 signals. The signals are known as the machine status signals and are used with the IO/M signal in certain situations for proper external circuit operation./"], "jumps": ["P1720", "P1620"]}, {"id": "P1720", "text": ["Pin 40 is Vcc for the 8085 microprocessor.  This pin delivers +5 volts VDC to the system.", "Pin 40 is Vcc for the 8085 microprocessor. This pin delivers +5 volts VDC to the system."], "jumps": ["P1730", "P1620"]}, {"id": "P1730", "text": ["As you learn more about the interface between the microprocessor and external circuitry, the purpose for those signals will be more apparent.  In the experiment you will be able to look at any of these signals and compare them with other signals in the system.", "As you learn more about the interface between the microprocessor and external circuitry, the purpose for those signals will be more apparent. In the experiment you will be able to look at any of these signals and compare them with other signals in the system..."], "jumps": ["P1740", "P1620"]}, {"id": "P1740", "text": ["In this lesson you have learned about the 8085 microprocessor, its internal functions and connections available outside the microprocessor."], "jumps": ["P1750", "P1620"]}, {"id": "P1750", "text": ["Which is a 16 bit register of the 8085?", "Which is a 16 bit register of the 8085?...................."], "jumps": ["P1620"]}, {"id": "P1751", "text": [], "jumps": []}, {"id": "P1752", "text": ["The D register is a general purpose 8 bit register, which combined with E becomes 16 bit if needed."], "jumps": []}, {"id": "P1753", "text": ["The B register is a general purpose 8 bit register, which combined with C becomes 16 bit if needed."], "jumps": []}, {"id": "P1760", "text": ["How many Data Lines does the 8085 system have?", "How many Data Lines does the 8085 system have?............."], "jumps": ["P1750"]}, {"id": "P1761", "text": [], "jumps": ["P1760"]}, {"id": "P1762", "text": ["The 8085 only has 8 data lines and sixteen address lines.", "The 8085 only has 8 data lines and sixteen address lines..."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on 8085 MICROPROCESSOR CIRCUITRY."], "jumps": ["P1001", "P1760"]}, {"id": "P1920", "text": ["1.  The features of the 8085 microprocessor include:", "1. The features of the 8085 microprocessor include: 16 bit address length (65k memory)", "Many arithmetic and logic instructions Restore the contents of the registers. 4. Issue a RETURN instruction.struction........"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  The actions that the microprocessor performs must be                    executed at specific times to ensure proper operation of the           microprocessor.", "2. The actions that the microprocessor performs must be executed at specific times to ensure proper operation of the microprocessor."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Instructions are decoded by the 8085 microprocessor into              one or more machine cycles that are executed sequentially.", "3. Instructions are decoded by the 8085 microprocessor into one or more machine cycles that are executed sequentially."], "jumps": ["P1999", "P1930"]}, {"id": "P1999", "text": ["You have completed the Summary.  You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1930"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2040", "text": ["Using the Nida 8085 card set you will be able to observe some of the signals used externally to the microprocessor.  The main Nida PC card of interest is the PC130-485 microprocessor.", "Using the Nida 8085 card set you will be able to observe some of the signals used externally to the microprocessor. The main Nida PC card of interest is the PC130-485 microprocessor."], "jumps": ["P2050", "P2001"]}, {"id": "P2050", "text": ["The PC130-485 card contains an 8085 microprocessor, address latches and timing circuitry."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["The rest of the components are resistors, capacitors, a crystal and a switch.  There are also many test points to measure the signals in the system.  The 34 pin connector is used to apply signals to the other devices of the system.", "Since the keyboard is required for the basic operation of the 8085 Microprocessor system, let's look at how the keyboard works.", "The rest of the components are resistors, capacitors, a crystal and a switch. There are also many test points to measure the signals in the system. The 34 pin connector is used to apply signals to the other devices of the system..."], "jumps": ["P2070", "P2040", "P2080"]}, {"id": "P2080", "text": ["The keyboard contains 32 keys.  Each of the keys has its function(s) screened on the key surface.  Some keys are used for more than one function.  The keys that will be used in the experiment are described below.", "The keyboard contains 32 keys. Each of the keys has its function(s) screened on the key surface. Some keys are used for more than one function. The keys that will be used in the experiment are described below...", "0 - F THESE KEYS ARE USED FOR ENTERING HEXADECIMAL NUMBERS. DATA AND ADDRESSES ARE ENTERED USING THESE KEYS. EDIT THIS KEY IS USED TO EDIT DATA IN RAM. WHEN YOU PRESS THIS KEY, THE LCD WILL SHOW \"EDIT ADD:_\". THE SYSTEM IS NOW WAITING FOR YOU TO ADD A SEGMENT AND OFFSET. AN EXAMPLE WOULD BE \"553:53\". THE SEGMENT IS 0553 AND THE OFFSET IS 0053. RUN THIS KEY IS USED TO EDIT DATA IN RAM. WHEN YOU PRESS THIS KEY, THE LCD WILL SHOW \"RUN ADD: \". THE SYSTEM IS NOW WAITING FOR YOU TO ENTER A SEGMENT : OFFSET TO TO THE PROGRAM. ENTER THIS KEY IS USED TO INDICATE A CURRENT PROGRAM, THAT YOU HAVE FINISHED ENTERING INFORMATION FOR A PARTICULAR TASK. STOP THIS KEY IS USED WHEN YOU FINISH ENTERING DATA INTO RAM OR WANT TO EXIT A PROGRAM. AFTER PRESSING STOP, THE DISPLAY WILL RETURN TO THE \"NIDA CORPORATION INTEL 8086 VX.X\" MESSAGE. USED IN THE EDITING TO MOVE BACKWARDS THROUGH THE MEMORY. USED IN THE EDITING TO MOVE FORWARDS THROUGH THE MEMORY. USED TO ERASE THE LAST CHARACTER ENTERED. DISPLAY WHEN PRESSED ONCE, THIS KEY WILL DISPLAY LOCATIONS IN MEMORY. WHEN PRESSED A R.M. SECOND TIME, IT DISPLAYS THE CURRENT REGISTER VALUES STORED WITHIN THE MICROPROCESSOR."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["The purpose of this experiment is to examine various signals in the circuits on the PC130-485 experiment card.", "The purpose of this experiment is to examine various signals in the circuits on the PC130-485 experiment card.ard."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["By looking at these signals, you can begin to understand the importance of timing and the purpose of each signal.", "You will have the schematic for the PC130-485 Microprocessor shown below to help you in the lesson.  Having the schematic is like having the road map to a city.", "You will have the schematic for the PC130-485 Microprocessor shown below to help you in the lesson. Having the schematic is like having the road map to a city."], "jumps": ["P2110", "P2090", "P2120"]}, {"id": "P2120", "text": ["Without it, you cannot easily trace the connections between the test points, the pins of the microprocessor, and external circuitry."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["This could cause you to waste valuable time and money if you are troubleshooting a faulty system."], "jumps": ["P2140", "P2110"]}, {"id": "P2140", "text": ["Let's begin the experiment.", "Let's begin the experiment.e..............................."], "jumps": ["P2150", "P2110"]}, {"id": "P2150", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2140"]}, {"id": "P2160", "text": ["2. Insert the following 130 experiment cards on the test console. a. Insert PC130-485 8085 Microprocessor card in the PC1 position. b. Insert PC130-402 8085 Decoder/Memory card in the PC2 position. c. Insert PC130-401 I/O card in the PC3 position. External program = SCAN PWR 0 123 External program = SCAN FCC 0"], "jumps": ["P2150"]}, {"id": "P2170", "text": ["3.  Place the PC130-400 Keyboard and Display card in front of            the test console between the PC2 and PC3 positions.", "3. Place the PC130-400 Keyboard and Display card in front of the test console between the PC2 and PC3 positions. ogram = SCAN FRT 0 C1 00...................................."], "jumps": ["P2160"]}, {"id": "P2180", "text": ["4. Connect the four experiment cards with the ribbon cables as follows: A. Using the 30 pin Ribbon Cable, Connect PC130-485 J1 to PC130-402 J1. B. Using the Short 20 pin Ribbon Cable, Connect PC130-402 J2 to PC130-401 J1. C. Using the Long 20 pin Ribbon Cable, Connect PC130-401 J2 to PC130-400 J1.C130-400 J1. to PC130-400 J1. to PC130-400 J1.....................................2 J1.."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["5.  Set the Positive Supply Control to 5.  \n     The Voltmeter on the 130A should indicate 5 Volts.", "5. Set the Positive Supply Control to 5. The Voltmeter on the 130A should indicate 5 Volts."], "jumps": ["P2180"]}, {"id": "P2200", "text": ["6.  Set the PC3 DC Switch to ON.", "6. Set the PC3 DC Switch to ON.ntrol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2190"]}, {"id": "P2205", "text": ["7.  Press the PC2 DC Power switch to ON.", "7. Press the PC2 DC Power switch to ON. 12. 130A - Set the PC1 DC switch to ON. 130A - Set the PC2 AC switch to ON. 130A - Set the PC3 Speaker switch to ON.."], "jumps": ["P2200"]}, {"id": "P2210", "text": ["9. The microprocessor system is now assembled and operating. You should see the message \"NIDA 485 Vx.x:\" in the LCD display on the PC130-400 card. If the message is dim or blank, try adjusting the Display Intensity potentiometer (R1) on the PC130-400 card using a small screwdriver. If you still cannot see the message, see your instructor for assistance.", "The \"Vx.x\" in the display of the LCD indicates the version of the monitor program you are using. The experiment is written for all versions of the monitor program. If, at any time during the experiment, you short some of the IC pins together while observing signals, press the reset button. Then verify that the program you were running is still in memory. If not, you must re-enter and run the program before proceeding with your measurements.", "NOTE NOTE\" in the display of the LCD indicates the version of th monitor program you are using. The experiment is written for all versions of the monitor program. If, at any time during the experiment, you short some of the IC pins together while observing signals, press the reset button. Then veriy that the program you were running is still in memory. If not, you must re-enter and run the program before proceeding with your measurements."], "jumps": ["P2220", "P2215"]}, {"id": "P2215", "text": ["8.  Press the PC1 DC Power switch to ON.", "8. Press the PC1 DC Power switch to ON. 12. 130A - Set the PC1 DC switch to ON. 130A - Set the PC2 AC switch to ON. 130A - Set the PC3 Speaker switch to ON.."], "jumps": ["P2205"]}, {"id": "P2220", "text": ["First, you will measure some of the basic signals present at the pins of the 8085 microprocessor IC and observe the operation of the RESET and HOLD functions."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["10.  Press the reset button.  Using the oscilloscope, measure the         voltage levels present at the following pins and enter them in         the provided spaces (HIGH, LOW):", "10. Press the reset button. Using the oscilloscope, measure the voltage levels present at the following pins and enter them in the provided spaces (HIGH, LOW):", "Pin Name 40 Vcc 20 GND 36 RESET IN 9 RST 5.5 8 RST 6.5 7 RST 7.5 RST 7.5"], "jumps": ["P2220"]}, {"id": "P2231", "text": [], "jumps": []}, {"id": "P2232", "text": ["Your 3 tries are finished.  The answers were HIGH, LOW, HIGH, LOW, LOW, and LOW.", "Your 3 tries are finished. The answers were HIGH, LOW, HIGH, LOW, LOW, and LOW...\" with \"OK\" with \"OK\""], "jumps": []}, {"id": "P2260", "text": ["11.  Next, let's look at the clock signals.  Using the oscilloscope,          measure the frequency of the clock signal of U1 pin 37.                    Remember, this signal is half of the crystal frequency.", "11. Next, let's look at the clock signals. Using the oscilloscope, measure the frequency of the clock signal of U1 pin 37. Remember, this signal is half of the crystal frequency."], "jumps": ["P2230", "P2262"]}, {"id": "P2261", "text": [], "jumps": []}, {"id": "P2262", "text": ["Ensure you have your oscilloscope lead on the correct test point.", "Ensure you have your oscilloscope lead on the correct test point........."], "jumps": []}, {"id": "P2267", "text": ["The correct answer should have been 1.0 MHz.", "The correct answer should have been 1.0 MHz.have measured 5.0mA."], "jumps": ["PutVar"]}, {"id": "P2270", "text": ["12.  Now let's see what happens when the RESET button is                   pressed on the PC130-485 experiment card.  Using your                  oscilloscope, measure the RESET IN pin of the 8085                         microprocessor according to the following chart and fill in              your answers (HIGH or LOW):", "12. Now let's see what happens when the RESET button is pressed on the PC130-485 experiment card. Using your oscilloscope, measure the RESET IN pin of the 8085 microprocessor according to the following chart and fill in your answers (HIGH or LOW):", "Signal Before Pressing While Holding After Releasing RESET RESET RESET RESET (PIN 36) RESET IN 9 RST 5.5 8 RST 6.5 7 RST 7.5 RST 7.5"], "jumps": ["P2260", "PIN"]}, {"id": "P2271", "text": [], "jumps": []}, {"id": "P2277", "text": ["Your 3 tries are finished.  The answers were HIGH, LOW, and HIGH.", "Your 3 tries are finished. The answers were HIGH, LOW, and HIGH...\" with \"OK\" with \"OK\""], "jumps": []}, {"id": "P2280", "text": ["Remember, when the RESET signal is applied to the 8085 microprocessor, it instructs the internal instruction register to go back to the beginning.  This then has a jump command that leads the instruction pointer to the Nida monitor program.", "Remember, when the RESET signal is applied to the 8085 microprocessor, it instructs the internal instruction register to go back to the beginning. This then has a jump command that leads the instruction pointer to the Nida monitor program..."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["In this portion of the experiment, you will use the microprocessor to add two numbers as an illustration of the 8085's arithmetic capabilities."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["13.  Press RESET on the PC130-485 Card.  You will be entering a         program in to memory for execution by the 8085                                 microprocessor.", "13. Press RESET on the PC130-485 Card. You will be entering a program in to memory for execution by the 8085 microprocessor."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["Entering programs into memory of the 8085 uses the EDIT function of the monitor Program.  Once you have pressed EDIT, you will be asked to enter an address to edit.  Typically, the address will be 1000.", "Entering programs into memory of the 8085 uses the EDIT function of the monitor Program. Once you have pressed EDIT, you will be asked to enter an address to edit. Typically, the address will be 1000..."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["On the screen is the current address that you are looking at and the current value stored in that location.  There are three things you can do at any address.  Enter a new value and press enter, press the down arrow to move to the next address or use the up arrow to move to the previous address.", "On the screen is the current address that you are looking at and the current value stored in that location. There are three things you can do at any address. Enter a new value and press enter, press the down arrow to move to the next address or use the up arrow to move to the previous address..."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["Every time you enter a value and press enter, you will automatically move to the next address.  If at anytime you just press enter without entering data, this will put zeros for that memory location.", "Every time you enter a value and press enter, you will automatically move to the next address. If at anytime you just press enter without entering data, this will put zeros for that memory location..."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["Always remember to use the up and down arrows for movements through your code.  When a program is shown to you, you will be given an address, opcodes, mnemonics and a description.  Start at the first address given and enter each opcode consecutively until you are finished.", "Always remember to use the up and down arrows for movements through your code. When a program is shown to you, you will be given an address, opcodes, mnemonics and a description. Start at the first address given and enter each opcode consecutively until you are finished..."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["A mnemonic is what an assembler program uses to generate the opcodes for a program.  Once you are finished editing your program you can press STOP.", "A mnemonic is what an assembler program uses to generate the opcodes for a program. Once you are finished editing your program you can press STOP."], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["14.  Enter the following program into memory starting at \"1000\"           (EDIT, 1000, enter values with an ENTER after each one,                  press STOP when finished).", "14. Enter the following program into memory starting at \"1000\" (EDIT, 1000, enter values with an ENTER after each one, press STOP when finished).", "1000 3E MVI A, #0Ah Moves the value 0Ah into the A register. 1001 0A 1002 06 MVI B, #05h Moves the value 05h into the B register. 1003 05 1004 80 ADD B Adds A+B and stores in A. 1005 4F MVI C, A Moves value in A into C. 1006 C9 RET Return to the monitor program.", "ADDRESS TEEEEEEEn the display of the LCD indicates the version of th monitor program you are using. The experiment is written for all versions of the monitor program. If, at any time during the experiment, you short some of the IC pins together while observing signals, press the reset button. Then veriy that the program you were running is still in memory. If not, you must re-enter and run the program before proceeding with your measurements."], "jumps": ["P2370", "P2350"]}, {"id": "P2370", "text": ["15.  Run program.  This is done by pressing the RUN key and               entering the starting address of the program, \"1000\".", "15. Run program. This is done by pressing the RUN key and entering the starting address of the program, \"1000\".."], "jumps": ["P2380", "P2360"]}, {"id": "P2380", "text": ["16.  Press the DISPLAY REG key and press the \"A\" key.", "16. Press the DISPLAY REG key and press the \"A\" key......."], "jumps": ["P2390", "P2370"]}, {"id": "P2390", "text": ["Remember, the values of 0Ah and 05h were placed into the A and B registers. Then the microprocessor added them together and stored the result in the accumulator and also copied it to the C register.  This replaced the value previously stored there.", "Remember, the values of 0Ah and 05h were placed into the A and B registers. Then the microprocessor added them together and stored the result in the accumulator and also copied it to the C register. This replaced the value previously stored there..."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["The program yo works.", "The rest of the components are resistors, capacitors, a crystal and a switch. There are also many test points to measure the signals in the system. The 34 pin connector is used to apply signals to the other devices of the system..."], "jumps": ["P13070", "P13040", "P13080"]}, {"id": "P13080", "text": ["The keyboard contains 32 keys.  Each of the keys has its function(s) screened on the key surface.  Some keys are used for more than one function.  The keys that will be used in the experiment are described below.", "The keyboard contains 32 keys. Each of the keys has its function(s) screened on the key surface. Some keys are used for more than one function. The keys that will be used in the experiment are described below...", "0 - F THESE KEYS ARE USED FOR ENTERING HEXADECIMAL NUMBERS. DATA AND ADDRESSES ARE ENTERED USING THESE KEYS. EDIT THIS KEY IS USED TO EDIT DATA IN RAM. WHEN YOU PRESS THIS KEY, THE LCD WILL SHOW \"EDIT ADD:_\". THE SYSTEM IS NOW WAITING FOR YOU TO ADD A SEGMENT AND OFFSET. AN EXAMPLE WOULD BE \"553:53\". THE SEGMENT IS 0553 AND THE OFFSET IS 0053. RUN THIS KEY IS USED TO EDIT DATA IN RAM. WHEN YOU PRESS THIS KEY, THE LCD WILL SHOW \"RUN ADD: \". THE SYSTEM IS NOW WAITING FOR YOU TO ENTER A SEGMENT : OFFSET TO TO THE PROGRAM. ENTER THIS KEY IS USED TO INDICATE A CURRENT PROGRAM, THAT YOU HAVE FINISHED ENTERING INFORMATION FOR A PARTICULAR TASK. STOP THIS KEY IS USED WHEN YOU FINISH ENTERING DATA INTO RAM OR WANT TO EXIT A PROGRAM. AFTER PRESSING STOP, THE DISPLAY WILL RETURN TO THE \"NIDA CORPORATION INTEL 8086 VX.X\" MESSAGE. USED IN THE EDITING TO MOVE BACKWARDS THROUGH THE MEMORY. USED IN THE EDITING TO MOVE FORWARDS THROUGH THE MEMORY. USED TO ERASE THE LAST CHARACTER ENTERED. DISPLAY WHEN PRESSED ONCE, THIS KEY WILL DISPLAY LOCATIONS IN MEMORY. WHEN PRESSED A R.M. SECOND TIME, IT DISPLAYS THE CURRENT REGISTER VALUES STORED WITHIN THE MICROPROCESSOR."], "jumps": ["P13090", "P13070"]}, {"id": "P13090", "text": ["The purpose of this experiment is to examine various signals in the circuits on the PC130-485 experiment card.", "The purpose of this experiment is to examine various signals in the circuits on the PC130-485 experiment card........"], "jumps": ["P13100", "P13080"]}, {"id": "P13100", "text": ["By looking at these signals, you can begin to understand the importance of timing and the purpose of each signal.", "You will have the schematic for the PC130-485 Microprocessor shown below to help you in the lesson.  Having the schematic is like having the road map to a city.", "You will have the schematic for the PC130-485 Microprocessor shown below to help you in the lesson. Having the schematic is like having the road map to a city."], "jumps": ["P13110", "P13090", "P13120", "P13100"]}, {"id": "P13120", "text": ["Without it, you cannot easily trace the connections between the test points, the pins of the microprocessor, and external circuitry."], "jumps": ["P13130", "P13110"]}, {"id": "P13130", "text": ["This could cause you to waste valuable time and money if you are troubleshooting a faulty system."], "jumps": ["P13140", "P13110"]}, {"id": "P13140", "text": ["Let's begin the experiment.", "Let's begin the experiment.e..............................."], "jumps": ["P13150", "P13110"]}, {"id": "P13150", "text": ["1. Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.s........."], "jumps": ["P13140"]}, {"id": "P13160", "text": ["2. Insert the following 130 experiment cards on the test console. a. Insert PC130-485 8085 Microprocessor card in the PC1 position. b. Insert PC130-402 8085 Decoder/Memory card in the PC2 position. c. Insert PC130-401 I/O card in the PC3 position."], "jumps": ["P13170"]}, {"id": "P13170", "text": ["3.  Place the PC130-400 Keyboard and Display card in front of             the test console between the PC2 and PC3 positions.", "3. Place the PC130-400 Keyboard and Display card in front of the test console between the PC2 and PC3 positions."], "jumps": ["P13180", "P13160"]}, {"id": "P13180", "text": ["4. Connect the four experiment cards with the ribbon cables as follows: A. Using the 30 pin Ribbon Cable, Connect PC130-485 J1 to PC130-402 J1. B. Using the Short 20 pin Ribbon Cable, Connect PC130-402 J2 to PC130-401 J1. C. Using the Long 20 pin Ribbon Cable, Connect PC130-401 J2 to PC130-400 J1.C130-400 J1. to PC130-400 J1. to PC130-400 J1.....................................2 J1.."], "jumps": ["P13190", "P13170"]}, {"id": "P13190", "text": ["5.  Press enter to set: Positive Supply Voltage - 5", "5. Press enter to set: Positive Supply Voltage - 5........................"], "jumps": ["P13180"]}, {"id": "P13200", "text": ["6.  Press enter to set: PC3 DC Power Switch - ON", "6. Press enter to set: PC3 DC Power Switch - ON..........................."], "jumps": []}, {"id": "P13205", "text": ["7.  Press enter to set: PC2 DC Power Switch - ON", "7. Press enter to set: PC2 DC Power Switch - ON..........................."], "jumps": []}, {"id": "P13210", "text": ["9. The microprocessor system is now assembled and operating. You should see the message \"NIDA 485 Vx.x:\" in the LCD display on the PC130-400 card. If the message is dim or blank, try adjusting the Display Intensity potentiometer (R1) on the PC130-400 card using a small screwdriver. If you still cannot see the message, see your instructor for assistance.", "The \"Vx.x\" in the display of the LCD indicates the version of the monitor program you are using. The experiment is written for all versions of the monitor program. If, at any time during the experiment, you short some of the IC pins together while observing signals, press the reset button. Then verify that the program you were running is still in memory. If not, you must re-enter and run the program before proceeding with your measurements.", "NOTE NOTE\" in the display of the LCD indicates the version of th monitor program you are using. The experiment is written for all versions of the monitor program. If, at any time during the experiment, you short some of the IC pins together while observing signals, press the reset button. Then veriy that the program you were running is still in memory. If not, you must re-enter and run the program before proceeding with your measurements."], "jumps": ["P13220"]}, {"id": "P13215", "text": ["8.  Press enter to set: PC1 DC Power Switch - ON", "8. Press enter to set: PC1 DC Power Switch - ON..........................."], "jumps": ["P13205"]}, {"id": "P13220", "text": ["First, you will measure some of the basic signals present at the pins of the 8085 microprocessor IC and observe the operation of the RESET and HOLD functions."], "jumps": ["P13230"]}, {"id": "P13230", "text": ["10.  Press the reset button.  Using the oscilloscope, measure the         voltage levels present at the following pins and enter them in         the provided spaces (HIGH, LOW):", "10. Press the reset button. Using the oscilloscope, measure the voltage levels present at the following pins and enter them in the provided spaces (HIGH, LOW):", "Pin Name 40 Vcc 20 GND 36 RESET IN 9 RST 5.5 8 RST 6.5 7 RST 7.5 RST 7.5"], "jumps": ["P13220"]}, {"id": "P13231", "text": [], "jumps": []}, {"id": "P13232", "text": ["Your 3 tries are finished.  The answers were HIGH, LOW, HIGH, LOW, LOW, and LOW.", "Your 3 tries are finished. The answers were HIGH, LOW, HIGH, LOW, LOW, and LOW...\" with \"OK\" with \"OK\""], "jumps": []}, {"id": "P13260", "text": ["11.  Next, let's look at the clock signals.  Using the oscilloscope,           measure the frequency of the clock signal of U1 pin 37.                    Remember, this signal is half of the crystal frequency.", "11. Next, let's look at the clock signals. Using the oscilloscope, measure the frequency of the clock signal of U1 pin 37. Remember, this signal is half of the crystal frequency."], "jumps": ["P13230", "P13262"]}, {"id": "P13261", "text": [], "jumps": []}, {"id": "P13262", "text": ["Ensure you have your oscilloscope lead on the correct test point.", "Ensure you have your oscilloscope lead on the correct test point........."], "jumps": []}, {"id": "P13267", "text": ["The correct answer should of been 1.0 MHz.", "The correct answer should of been 1.0 MHz.d have measured 5.0mA."], "jumps": ["PutVar"]}, {"id": "P13270", "text": ["12.  Now let's see what happens when the RESET button is                   pressed on the PC130-485 experiment card.  Using your                  oscilloscope, measure the RESET IN pin of the 8085                         microprocessor according to the following chart and fill in              your answers (HIGH or LOW):", "12. Now let's see what happens when the RESET button is pressed on the PC130-485 experiment card. Using your oscilloscope, measure the RESET IN pin of the 8085 microprocessor according to the following chart and fill in your answers (HIGH or LOW):", "Signal Before Pressing While Holding After Releasing RESET RESET RESET RESET (PIN 36) RESET IN 9 RST 5.5 8 RST 6.5 7 RST 7.5 RST 7.5"], "jumps": ["P13260", "PIN"]}, {"id": "P13271", "text": [], "jumps": []}, {"id": "P13277", "text": ["Your 3 tries are finished.  The answers were HIGH, LOW, and HIGH.", "Your 3 tries are finished. The answers were HIGH, LOW, and HIGH...\" with \"OK\" with \"OK\""], "jumps": []}, {"id": "P13280", "text": ["Remember, when the RESET signal is applied to the 8085 microprocessor, it instructs the internal instruction register to go back to the beginning.  This then has a jump command that leads the instruction pointer to the Nida monitor program.", "Remember, when the RESET signal is applied to the 8085 microprocessor, it instructs the internal instruction register to go back to the beginning. This then has a jump command that leads the instruction pointer to the Nida monitor program..."], "jumps": ["P13290", "P13270"]}, {"id": "P13290", "text": ["In this portion of the experiment, you will use the microprocessor to add two numbers as an illustration of the 8085's arithmetic capabilities."], "jumps": ["P13300", "P13280"]}, {"id": "P13300", "text": ["13.  Press RESET on the PC130-485 Card.  You will be entering a         program into memory for execution by the 8085                                  microprocessor.", "13. Press RESET on the PC130-485 Card. You will be entering a program into memory for execution by the 8085 microprocessor."], "jumps": ["P13310", "P13290"]}, {"id": "P13310", "text": ["Entering programs into memory of the 8085 uses the EDIT function of the monitor Program.  Once you have pressed EDIT, you will be asked to enter an address to edit.  Typically, the address will be 1000.", "Entering programs into memory of the 8085 uses the EDIT function of the monitor Program. Once you have pressed EDIT, you will be asked to enter an address to edit. Typically, the address will be 1000..."], "jumps": ["P13320", "P13300"]}, {"id": "P13320", "text": ["On the screen is the current address that you are looking at and the current value stored in that location.  There are three things you can do at any address.  Enter a new value and press enter, press the down arrow to move to the next address or use the up arrow to move to the previous address.", "On the screen is the current address that you are looking at and the current value stored in that location. There are three things you can do at any address. Enter a new value and press enter, press the down arrow to move to the next address or use the up arrow to move to the previous address..."], "jumps": ["P13330", "P13310"]}, {"id": "P13330", "text": ["Every time you enter a value and press enter, you will automatically move to the next address.  If you just press enter without entering data, this will put zeros for that memory location.", "Every time you enter a value and press enter, you will automatically move to the next address. If you just press enter without entering data, this will put zeros for that memory location.I"], "jumps": ["P13340", "P13320"]}, {"id": "P13340", "text": ["Always remember to use the up and down arrows for movements through your code.  When a program is shown to you, you will be given an address, opcodes, mnemonics and a description.  Start at the first address given and enter each opcode consecutively until you are finished.", "Always remember to use the up and down arrows for movements through your code. When a program is shown to you, you will be given an address, opcodes, mnemonics and a description. Start at the first address given and enter each opcode consecutively until you are finished..."], "jumps": ["P13350", "P13330"]}, {"id": "P13350", "text": ["A mnemonic is what an assembler program uses to generate the opcodes for a program.  Once you are finished editing your program you can press STOP.", "A mnemonic is what an assembler program uses to generate the opcodes for a program. Once you are finished editing your program you can press STOP."], "jumps": ["P13360", "P13340"]}, {"id": "P13360", "text": ["14.  Enter the following program into memory starting at \"1000\"           (EDIT, 1000, enter values with an ENTER after each one,                  pressd STOP when finished).", "14. Enter the following program into memory starting at \"1000\" (EDIT, 1000, enter values with an ENTER after each one, pressd STOP when finished).", "1000 3E MVI A, #0Ah Moves the value 0Ah into the A register. 1001 0A 1002 06 MVI B, #05h Moves the value 05h into the B register. 1003 05 1004 80 ADD B Adds A+B and stores in A. 1005 4F MVI C, A Moves value in A into C. 1006 C9 RET Return to the monitor program.", "ADDRESS TEEEEEEEn the display of the LCD indicates the version of th monitor program you are using. The experiment is written for all versions of the monitor program. If, at any time during the experiment, you short some of the IC pins together while observing signals, press the reset button. Then veriy that the program you were running is still in memory. If not, you must re-enter and run the program before proceeding with your measurements."], "jumps": ["P13370", "P13350"]}, {"id": "P13370", "text": ["15.  Run program.  This is done by pressing the RUN key and               entering the starting address of the program, \"1000\".", "15. Run program. This is done by pressing the RUN key and entering the starting address of the program, \"1000\"."], "jumps": ["P13380", "P13360"]}, {"id": "P13380", "text": ["16.  Press the DISPLAY REG key and press the \"A\" key.", "16. Press the DISPLAY REG key and press the \"A\" key......."], "jumps": ["P13390", "P13370"]}, {"id": "P13390", "text": ["Remember, the values of 0Ah and 05h were placed into the A and B registers. Then the microprocessor added them together and stored the result in the accumulator and also copied it to the C register.  This replaced the value previously stored there.", "Remember, the values of 0Ah and 05h were placed into the A and B registers. Then the microprocessor added them together and stored the result in the accumulator and also copied it to the C register. This replaced the value previously stored there..."], "jumps": ["P13400", "P13380"]}, {"id": "P13400", "text": ["The program you are using shows you the values in the A, F (Flag), B and C registers.  The value in B is 0Ah and the value in C is the result 0Fh.  The accumulator changed because the result of all arithmetic operations is placed there.", "The program you are using shows you the values in the A, F (Flag), B and C registers. The value in B is 0Ah and the value in C is the result 0Fh. The accumulator changed because the result of all arithmetic operations is placed there..."], "jumps": ["P13410", "P13390"]}, {"id": "P13410", "text": ["You can go back and change the values stored at 1001 and 1003. These are the memory locations of the data to be added.  By changing these, you can observe different additions in the system.", "You can go back and change the values stored at 1001 and 1003. These are the memory locations of the data to be added. By changing these, you can observe different additions in the system...."], "jumps": ["P13430", "P13400"]}, {"id": "P13430", "text": ["In the next lesson we will look at the circuits external to the 8085 microprocessor. It is here that we will observe the control and status signals of the 8085 since they dictate the operation of the external circuits.", "In the next lesson we will look at the circuits external to the 8085 microprocessor. It is here that we will observe the control and status signals of the 8085 since they dictate the operation of the external circuits..."], "jumps": ["P13440", "P13410"]}, {"id": "P13440", "text": ["17.  Disconnect the oscilloscope and logic probe from the                      experiment cards.", "17. Disconnect the oscilloscope and logic probe from the experiment cards."], "jumps": ["P13430"]}, {"id": "P13560", "text": ["1.  Set the Console Power Switch to OFF.", "1. Set the Console Power Switch to OFF.FF................................."], "jumps": []}, {"id": "P13570", "text": ["2.  Disconnect the equipment and return to the designated area.", "2. Disconnect the equipment and return to the designated area."], "jumps": ["P13910", "P13560"]}, {"id": "P13910", "text": ["This completes the experiment on 8085 EXPERIMENT.", "This completes the experiment on 8085 EXPERIMENT.LE........"], "jumps": ["P2001", "P13570"]}, {"id": "PINFO", "text": ["@ 9 07-29-99 Converted to new question format. jay 08-03-99 Conversion cleanup steps 1 thru 9 - lisa 08-13-99 Conversion cleanup steps 10 thru 17 - lisa 08-13-99 Made changes Step 3 - lisa 12-07-99 Changed p1920 \"64k\" not \"65k\" & P1253 \"D7 - D0\" not \"D7 - D7\". debbie 01-10-00 P1253 text change: \"...bits are labeled 0 through 7... however big the system.\" changed the following: \"labeled\" not \"labled\", \"through\" not \"however\", & \"however\" not \"through\". debbie 01-26-00 Fixed the following question stem: 10215, 10216, 10221, let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
