riginal carrier frequency. b. The sum of the carrier and modulating signals (fm + fc). c. The difference of the carrier and modulating signals (fm - fc).", "1. In AM signals, the carrier amplitude is varied in direct response to changes in the intelligence being transmitted."], "jumps": ["P1940", "P1920", "P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on AMPLITUDE MODULATION RECEIVERS."], "jumps": ["P1001", "P1820"]}, {"id": "P1820", "text": ["Much of the phase-lock loop components shown in the block diagram are contained in the IC chip, U2 on the PC130-438 card. U2 is a nearly self-contained PLL that is directly governed by the  microprocessor.", "Much of the phase-lock loop components shown in the block diagram are contained in the IC chip, U2 on the PC130-438 card. U2 is a nearly self-contained PLL that is directly governed by the microprocessor. y their VCO which is U2 on the PC130-439 card."], "jumps": ["P1910", "P1780"]}, {"id": "P1810", "text": ["The filter's primary goal is to remove any harmonic components of the reference frequency as well as any noise elements that are present."], "jumps": ["P1820", "P1780"]}, {"id": "P1800", "text": ["The last major component to the phase-lock loop is the loop filter.  It is usually a simple low-pass filter but is very important to the overall operation of the PLL.", "The last major component to the phase-lock loop is the loop filter. It is usually a simple low-pass filter but is very important to the overall operation of the PLL."], "jumps": ["P1810", "P1780"]}, {"id": "P1790", "text": ["Most counters, however, are best suited for operation in the\n100 MHz range or lower.", "Most counters, however, are best suited for operation in the 100 MHz range or lower. ed in the FM radio lessons."], "jumps": ["P1800", "P1780"]}, {"id": "P1780", "text": ["Programmable Counters/Dividers are commonly used in a phase-lock loop because they are easily controlled by microprocessors and because they can be programmed to operate in different frequency ranges."], "jumps": ["P1790", "P1760"]}, {"id": "P1770", "text": ["When the VCO's output (fv) is greater than reference frequency (fr) the phase detector outputs negative pulses.  When fv is smaller than fr, the phase detector outputs positive pulses.", "When the VCO's output (fv) is greater than reference frequency (fr) the phase detector outputs negative pulses. When fv is smaller than fr, the phase detector outputs positive pulses."], "jumps": ["P1780", "P1760"]}, {"id": "P1760", "text": ["When the frequency and phase of the two signals are equal, PDout is in a high impedance state."], "jumps": ["P1770", "P1750"]}, {"id": "P1750", "text": ["The phase detector used on the PC130-438 circuit card is a\ntri-state, sequential device.  Its job is to compare the reference     frequency against the incoming frequency of the VCO.", "The phase detector used on the PC130-438 circuit card is a tri-state, sequential device. Its job is to compare the reference frequency against the incoming frequency of the VCO."], "jumps": ["P1760", "P1740"]}, {"id": "P1740", "text": ["The output voltage generated by sequential phase detectors is the result of the time interval between the zero crossing of the two frequencies.  With the memory capability of sequential detectors, they can provide phase detection characteristics not normally obtainable when multiplier circuits are used.", "The output voltage generated by sequential phase detectors is the result of the time interval between the zero crossing of the two frequencies. With the memory capability of sequential detectors, they can provide phase detection characteristics not normally obtainable when multiplier circuits are used."], "jumps": ["P1750", "P1690"]}, {"id": "P1730", "text": ["Sequential phase detectors are normally designed using digital circuits and, in effect, have memory.  This is not true with         multipliers which are zero-memory devices.", "Sequential phase detectors are normally designed using digital circuits and, in effect, have memory. This is not true with multipliers which are zero-memory devices."], "jumps": ["P1740", "P1690"]}, {"id": "P1720", "text": ["A well designed multiplier is capable of phase-lock on signals in noisy environments."], "jumps": ["P1730", "P1690"]}, {"id": "P1710", "text": ["Phase Detectors may be categorized into two broad groups: multiplier and sequential circuits.  Multiplier phase detectors provide a DC error voltage as the product of the reference frequency times the input frequency.", "Phase Detectors may be categorized into two broad groups: multiplier and sequential circuits. Multiplier phase detectors provide a DC error voltage as the product of the reference frequency times the input frequency."], "jumps": ["P1720", "P1690"]}, {"id": "P1700", "text": ["Unlike normal crystal oscillators which operate at a set frequency, the frequency of the oscillator in a VCO is          variable based on the voltage applied to its tuning capacitor (or    varactor) at the input of the VCO.", "Unlike normal crystal oscillators which operate at a set frequency, the frequency of the oscillator in a VCO is variable based on the voltage applied to its tuning capacitor (or varactor) at the input of the VCO. citor (or varactor) at the input of the VCO."], "jumps": ["P1710", "P1690"]}, {"id": "P1690", "text": ["Since there are several different formulas for phase-lock loop construction, we will use the one employed in the radio trainers. A simplified block diagram is illustrated below."], "jumps": ["P1700", "P1670"]}, {"id": "P1680", "text": ["Examining the components of a phase-lock loop is the first step in understanding what they do and exactly how they do it."], "jumps": ["P1690", "P1670"]}, {"id": "P1670", "text": ["Simply stated, a phase-lock loop system compares the output of a voltage controlled oscillator with a reference frequency.  If the    output is different, a DC controlling voltage is generated to steer   the VCO to its correct output.", "Simply stated, a phase-lock loop system compares the output of a voltage controlled oscillator with a reference frequency. If the output is different, a DC controlling voltage is generated to steer the VCO to its correct output."], "jumps": ["P1680", "P1661"]}, {"id": "P1665", "text": ["SYNTHESIS - The term \"synthesis\" refers to any process in which separate elements are combined to form a coherent whole. Frequency synthesis generates a large number of stable frequencies (within a pre-established range) using only a few oscillators. In most cases, only one oscillator is required."], "jumps": []}, {"id": "P1661", "text": ["Indirect synthesis incorporates phase-lock loops (PLL) and voltage controlled oscillators to produce a desired frequency. Indirect synthesis is the method of synthesized tuning employed by the Nida AM, FM, CB, SSB and NBFM radio circuit cards."], "jumps": ["P1670", "P1640", "PLL"]}, {"id": "P1660", "text": ["Indirect synthesis incorporates phase-lock loops (PLL) and voltage controlled oscillators to produce a desired frequency. Indirect synthesis is the method of synthesized tuning employed by the Nida AM, FM, CB, SSB and NBFM radio circuit cards."], "jumps": ["P1670", "P1640", "PLL"]}, {"id": "P1650", "text": ["Direct synthesis uses filtering, mixing and multiplication to produce a specific frequency."], "jumps": ["P1660", "P1640"]}, {"id": "P1640", "text": ["The different methods of synthesized tuning can be broken down into two groups:  Direct and Indirect.", "The different methods of synthesized tuning can be broken down into two groups: Direct and Indirect."], "jumps": ["P1650", "P1630"]}, {"id": "P1630", "text": ["Synthesized Tuning or Frequency Synthesis has become a popular tuning technique, not just in radio, by television, radar and many other applications.  Some of the benefits include:", "Synthesized Tuning or Frequency Synthesis has become a popular tuning technique, not just in radio, by television, radar and many other applications. Some of the benefits include: hics Text)1. Greater frequency stability 2. Frequency can be changed electronically which allows for control by P 3. Reduced costs through the elimination", "1. Greater frequency stability. 2. Frequency can be changed electronically which allows for control by mP. 3. Reduced costs through the elimination of more expensive electromagnetic and mechanical devices. 4. Much smaller size."], "jumps": ["P1640", "P1610"]}, {"id": "P1620", "text": ["Station drift, atmospheric interference, and internally generated noise can cause poor reception.  Use of a synthesized tuning loop reduces these problems.", "A receiver's ability to faithfully reproduce a desired signal is based on its sensitivity and selectivity of the incoming RF signal. The quality of those two characteristics may be affected by any    number of both internal and external factors.", "Station drift, atmospheric interference, and internally generated noise can cause poor reception. Use of a synthesized tuning loop reduces these problems.....", "A receiver's ability to faithfully reproduce a desired signal is based on its sensitivity and selectivity of the incoming RF signal. The quality of those two characteristics may be affected by any number of both internal and external factors."], "jumps": ["P1630", "P1610", "P1620", "P1570"]}, {"id": "P1600", "text": ["While exact tuning between the RF and the local oscillator is desired, achieving it is not possible.  There will always be some    measurable degree of error.  However, in minute proportions,        measurable error is mostly insignificant.", "While exact tuning between the RF and the local oscillator is desired, achieving it is not possible. There will always be some measurable degree of error. However, in minute proportions, measurable error is mostly insignificant."], "jumps": ["P1610", "P1570"]}, {"id": "P1590", "text": ["The filter and the tank circuitry must work together.  Any deviation in frequency between them will cause tracking errors. The LO must be exactly 455 kHz above the tuned RF, otherwise stations will appear on the dial where they should not be.", "The filter and the tank circuitry must work together. Any deviation in frequency between them will cause tracking errors. The LO must be exactly 455 kHz above the tuned RF, otherwise stations will appear on the dial where they should not be."], "jumps": ["P1600", "P1570"]}, {"id": "P1580", "text": ["The tank circuit is also controlled by the voltage from R10.  This means that the filter network and the tank simultaneously tune to the same frequency.", "The tank circuit; D2, C7 and L2, provides a reference frequency for the voltage controlled oscillator.", "The tank circuit is also controlled by the voltage from R10. This means that the filter network and the tank simultaneously tune to the same frequency.", "The tank circuit; D2, C7 and L2, provides a reference frequency for the voltage controlled oscillator.. controlled oscillator. voltage controlled oscillator..or.or.r....rolled oscillator..I"], "jumps": ["P1590", "P1570", "P1580", "P1560"]}, {"id": "P1560", "text": ["Remember that all ambient radio frequencies are interfacing with the antenna at any given moment of time.  It is the job of the filter to tune to the desired frequency and reject all others.", "Remember that all ambient radio frequencies are interfacing with the antenna at any given moment of time. It is the job of the filter to tune to the desired frequency and reject all others."], "jumps": ["P1570", "P1520"]}, {"id": "P1550", "text": ["As the voltage level increases across D1, its capacitance decreases, which, in turn, increases the frequency.  This means that as you tune from one station to another you are altering the capacitance of D1.", "As the voltage level increases across D1, its capacitance decreases, which, in turn, increases the frequency. This means that as you tune from one station to another you are altering the capacitance of D1."], "jumps": ["P1560", "P1520"]}, {"id": "P1540", "text": ["D1 is a varactor, a specialized diode primarily used for its voltage controlled capacitance.  Varactors have replaced mechanically tuned capacitors, which were used in older receivers.", "D1 is a varactor, a specialized diode primarily used for its voltage controlled capacitance. Varactors have replaced mechanically tuned capacitors, which were used in older receivers."], "jumps": ["P1550", "P1520"]}, {"id": "P1530", "text": ["As the tuning knob (R10) is rotated clockwise, voltage increases. This voltage crosses S1 (set for manual operation) and feeds to the filter, D1.", "This is an example of an RF section in an AM Receiver. The variable resistor R10 is the actual tuning control used for frequency selection."], "jumps": ["P1540", "P1520", "P1530", "P1510"]}, {"id": "P1510", "text": ["The tuning operation in a radio receiver takes place in the RF section of the receiver.  All receivers have an RF section, although not all receivers have an RF amplifier.", "Receivers are tuned in one of two ways, manual or synthesized.", "The tuning operation in a radio receiver takes place in the RF section of the receiver. All receivers have an RF section, although not all receivers have an RF amplifier.s is the case with the receiver."], "jumps": ["P1520", "P1500", "P1510", "P1490"]}, {"id": "P1493", "text": ["455 MHz would make the IF frequency too high the frequency band.", "455 MHz would make the IF frequency too high the frequency band........................"], "jumps": []}, {"id": "P1492", "text": ["This is not the industry standard.", "This is not the industry standard.........................."], "jumps": []}, {"id": "P1491", "text": [], "jumps": []}, {"id": "P1490", "text": ["What is the IF frequency of most AM receivers?", "What is the IF frequency of most AM receivers?????........."], "jumps": ["P1410"]}, {"id": "P1480", "text": ["Finally, the detected audio frequency is fed into the audio amplifier(s).  Again, depending on the design, there may be more than one AF amplifier stage to increase signal strength.", "Finally, the detected audio frequency is fed into the audio amplifier(s). Again, depending on the design, there may be more than one AF amplifier stage to increase signal strength."], "jumps": ["P1490", "P1410"]}, {"id": "P1472", "text": ["The station detector can be adjusted to provide a visual indication when a station of sufficient strength is available. ignal."], "jumps": ["P1480", "P1410"]}, {"id": "P1470", "text": ["Automatic gain control (AGC) provides a stable output signal level from the IF amplifier circuit regardless of variations in the RF input."], "jumps": ["P1472", "P1410"]}, {"id": "P1460", "text": ["From the IF section, the signal passes into the AM Detector circuitry.  The detector (a diode) filters out the IF leaving only the audio component (the intelligence).", "From the IF section, the signal passes into the AM Detector circuitry. The detector (a diode) filters out the IF leaving only the audio component (the intelligence)."], "jumps": ["P1470", "P1410"]}, {"id": "P1450", "text": ["Some receivers have more than one IF amplifier stage.  This not only improves signal to noise ratio, but it also increases gain and bandwidth.", "Some receivers have more than one IF amplifier stage. This not only improves signal to noise ratio, but it also increases gain and bandwidth."], "jumps": ["P1460", "P1410"]}, {"id": "P1440", "text": ["Regardless of the frequency that the receiver is tuned to, the IF frequency will always be the same.  Intelligence changes, IF does not.", "Regardless of the frequency that the receiver is tuned to, the IF frequency will always be the same. Intelligence changes, IF does not."], "jumps": ["P1450", "P1410"]}, {"id": "P1430", "text": ["The RF and the frequency from the local oscillator are mixed together to modulate a portion of the product of the mixer with the intelligence from the original RF signal.  The resulting product is called the Intermediate Frequency (IF).", "The RF and the frequency from the local oscillator are mixed together to modulate a portion of the product of the mixer with the intelligence from the original RF signal. The resulting product is called the Intermediate Frequency (IF)."], "jumps": ["P1440", "P1410"]}, {"id": "P1420", "text": ["The RF amplifier makes the incoming frequency large enough to be usable. Notice that in this block diagram the mixer and RF amplifier are in the same section. In some receivers they are in separate sections..."], "jumps": ["P1430", "P1410"]}, {"id": "P1412", "text": ["The phase-locked loop (PLL) system compares the output of the VCO with a reference signal. If the output of the VCO and the reference oscillator are different, a DC controlling voltage steers the VCO to its correct output. eers the VCO to its correct output. *"], "jumps": ["P1420", "P1410", "PLL"]}, {"id": "P1410", "text": ["This is a block diagram of an AM receiver.  Notice in this receiver the local oscillator is voltage controlled (VCO).", "This is a block diagram of an AM receiver. Notice in this receiver the local oscillator is voltage controlled (VCO). ocal oscillator is voltage controlled."], "jumps": ["P1412", "P1400"]}, {"id": "P1403", "text": ["The local oscillator will output a frequency of 1235 kHz.", "The local oscillator will output a frequency of 1235 kHz. 5.0mA."], "jumps": ["P1410", "P1400"]}, {"id": "P1402", "text": ["1. The original RF signal. 2. The original LO signal. 3. The sum of the RF and LO signals. 4. The difference of RF and LO signals.", "The incoming RF is heterodyned together with a frequency from the oscillator that is always 455 kHz above the RF signal. When the two signals mix, four frequencies are produced:oduced:::"], "jumps": []}, {"id": "P1401", "text": [], "jumps": []}, {"id": "P1400", "text": ["If a receiver is tuned to 780 kHz, what frequency will the local oscillator output?", "If a receiver is tuned to 780 kHz, what frequency will the local oscillator output?iable.able.le."], "jumps": ["P1402"]}, {"id": "P1392", "text": ["1. The original RF signal. 2. The original LO signal. 3. The sum of the RF and LO signals. 4. The difference of RF and LO signals.", "The incoming RF is heterodyned with a frequency from the oscillator. When the two signals mix, four frequencies are present:::ignals mix, four frequencies are produced::roduced:produced:"], "jumps": []}, {"id": "P1391", "text": [], "jumps": []}, {"id": "P1390", "text": ["The four products from the heterodyning process include the original _______", "The four products from the heterodyning process include the original ________", "RF, the original AF, RF + LO, RF - LO. LO, RF - LO.", "IF, the original AF, AF + IF, AF - IF. IF, AF - IF.", "RF, the original LO, RF + LO, RF - LO. LO, RF - LO.", "IF, the original RF, RF + IF, RF - IF. IF, RF - IF."], "jumps": ["P1340"]}, {"id": "P1380", "text": ["Because the IF amplifier(s) are tuned to a center frequency of \n455 kHz, all other heterodyned products are rejected.  This process allows any tuned radio frequency to be converted to the 455 kHz signal.", "Because the IF amplifier(s) are tuned to a center frequency of 455 kHz, all other heterodyned products are rejected. This process allows any tuned radio frequency to be converted to the 455 kHz signal."], "jumps": ["P1390", "P1340"]}, {"id": "P1370", "text": ["The 455 kHz difference frequency is called the IF (intermediate frequency) and contains the modulation from the original RF signal.", "4. The difference of RF and LO signals....................................."], "jumps": ["P1380", "P1340"]}, {"id": "P1360", "text": ["The mixer receives the 1560 kHz and the 2015 kHz signals and creates two additional signals, for example, 3575 kHz and\n455 kHz.", "The mixer receives the 1560 kHz and the 2015 kHz signals and creates two additional signals, for example, 3575 kHz and 455 kHz.", "3. The sum of the RF and LO signals. 4. The difference of RF and LO signals."], "jumps": ["P1370", "P1340"]}, {"id": "P1350", "text": ["Assume that a receiver is tuned to 1560 kHz.  At the same time that the RF amplifier(s) tuned to that frequency, the ganged tuning adjusts the oscillator to 2015 kHz.", "Assume that a receiver is tuned to 1560 kHz. At the same time that the RF amplifier(s) tuned to that frequency, the ganged tuning adjusts the oscillator to 2015 kHz.", "1. The original RF signal. 2. The original LO signal."], "jumps": ["P1360", "P1340"]}, {"id": "P1340", "text": ["The incoming RF is mixed or heterodyned together with a frequency from the oscillator that is always 455 kHz above the RF signal.  When the two signals mix, four frequencies are produced:", "The incoming RF is mixed or heterodyned together with a frequency from the oscillator that is always 455 kHz above the RF signal. When the two signals mix, four frequencies are produced: (Graphic Text) 1. The original RF signal. 2. The original LO signal. 3. The sum of the RF and LO signals. 4. The difference of RF and LO signals.", "1. The original RF signal. 2. The original LO signal. 3. The sum of the RF and LO signals. 4. The difference of RF and LO signals."], "jumps": ["P1350", "P1330"]}, {"id": "P1330", "text": ["The block diagram below shows the front end of a typical superheterodyne receiver.  The RF Amplifier, Local Oscillator and Mixer are ganged tuned.  This allows the Local Oscillator and Mixer to adapt to whatever frequency the amplifier is tuned to.", "The block diagram below shows the front end of a typical superheterodyne receiver. The RF Amplifier, Local Oscillator and Mixer are ganged tuned. This allows the Local Oscillator and Mixer to adapt to whatever frequency the amplifier is tuned to. RF Section of Superheterodyne Receiver Block Diagrammmmmmmmmmmmmmm", "RF Section of Superheterodyne Receiver Block Diagram"], "jumps": ["P1340", "P1280"]}, {"id": "P1320", "text": ["Radios of this type were called Tuned Radio-Frequency (TRF) Receivers. Additionally, the TRF receiver, by virtue of design, posed several other problems: poor adjacent frequency rejection, bandwidth variations and instability. All of these down-falls were solved with the introduction of the superheterodyne receiver."], "jumps": ["P1330", "P1280"]}, {"id": "P1310", "text": ["Preliminary tuning design efforts evolved from manual tuning controls for all stages to complex methods of mechanically ganging the stages together so tuning could be accomplished by adjusting one control."], "jumps": ["P1320", "P1280"]}, {"id": "P1300", "text": ["The amplification process required two or three stages, each of which had to be tuned to the incoming frequency."], "jumps": ["P1310", "P1280"]}, {"id": "P1290", "text": ["When a receiver's antenna intercepts a transmission, it might be in any number of frequencies; for AM, between 535 and\n1650 kHz.", "When a receiver's antenna intercepts a transmission, it might be in any number of frequencies; for AM, between 535 and 1650 kHz."], "jumps": ["P1300", "P1280"]}, {"id": "P1280", "text": ["Major shortcomings in receiver design were revealed in early radio."], "jumps": ["P1290", "P1270"]}, {"id": "P1270", "text": ["Heterodyning is also a process of manipulating two frequencies, but with another goal in mind.  Heterodyning allows us to convert a signal from one frequency to another, without altering the intelligence in the original frequency.  This process is also called  \"mixing\".", "During the modulation process, the audio signal was used to alter the amplitude of the radio frequency (RF) signal so that it carried the intelligence in its upper and lower sidebands.", "Heterodyning is also a process of manipulating two frequencies, but with another goal in mind. Heterodyning allows us to convert a signal from one frequency to another, without altering the intelligence in the original frequency. This process is also called \"mixing\"."], "jumps": ["P1280", "P1260", "P1270", "P1250"]}, {"id": "P1250", "text": ["An AM signal from a broadcast station carrying voice or music is much more complicated.  The AM waveform in that case is more complex as it must, by design, display the many varied frequencies and amplitudes of the audio signal.", "An AM signal from a broadcast station carrying voice or music is much more complicated. The AM waveform in that case is more complex as it must, by design, display the many varied frequencies and amplitudes of the audio signal."], "jumps": ["P1260", "P1240"]}, {"id": "P1240", "text": ["The illustration below shows a portion of an amplitude modulated signal made up of carrier frequency modulated by a single sinusoidal wave.  Maximum and minimum amplitudes (Emax and Emin) are easily defined in this example.", "The illustration below shows a portion of an amplitude modulated signal made up of carrier frequency modulated by a single sinusoidal wave. Maximum and minimum amplitudes (Emax and Emin) are easily defined in this example."], "jumps": ["P1250", "P1230"]}, {"id": "P1230", "text": ["The percent of modulation or \"modulation index\" may be calculated by dividing the modulating voltage by the carrier voltage with the formula shown in the equation below.  The result will be some number between 0 and 1, represented as a percentage.", "The percent of modulation or \"modulation index\" may be calculated by dividing the modulating voltage by the carrier voltage with the formula shown in the equation below. The result will be some number between 0 and 1, represented as a percentage.", "Emax Emin %Mod = x 100 Emax + Emin"], "jumps": ["P1240", "P1210"]}, {"id": "P1220", "text": ["When the sidebands cross themselves, a great deal of distortion occurs and can cause the signal to be completely unintelligible."], "jumps": ["P1230", "P1210"]}, {"id": "P1210", "text": ["The amplitude of an AM waveform may never be allowed to exceed half the carrier amplitude.  If this happens, the two sidebands (USB & LSB) cross themselves at Emin.", "The amplitude of an AM waveform may never be allowed to exceed half the carrier amplitude. If this happens, the two sidebands (USB & LSB) cross themselves at Emin."], "jumps": ["P1220", "P1190"]}, {"id": "P1200", "text": ["This AM bouncing phenomena compels the Federal Communications Commission (FCC) to limit many AM broadcast stations to operation only during hours of daylight."], "jumps": ["P1210", "P1190"]}, {"id": "P1190", "text": ["Because of this, the normal operating range (during daylight) for an AM broadcast station transmitting at 50 kwatts is up to \n200 miles because the transmission is limited to ground-wave coverage.", "Because of this, the normal operating range (during daylight) for an AM broadcast station transmitting at 50 kwatts is up to 200 miles because the transmission is limited to ground-wave coverage."], "jumps": ["P1200", "P1140"]}, {"id": "P1180", "text": ["FM transmissions are a much higher frequency which allows the transmitted waves to penetrate the atmosphere and enter outer space.  Consequently, FM signals never stray from their assigned coverage area.", "FM transmissions are a much higher frequency which allows the transmitted waves to penetrate the atmosphere and enter outer space. Consequently, FM signals never stray from their assigned coverage area."], "jumps": ["P1190", "P1140"]}, {"id": "P1170", "text": ["A listener in that coverage area would now tune to two stations on one frequency.  Depending on the signal strength, sensitivity, selectivity and position of the receiver, one or the other or both of the stations will be heard.", "A listener in that coverage area would now tune to two stations on one frequency. Depending on the signal strength, sensitivity, selectivity and position of the receiver, one or the other or both of the stations will be heard."], "jumps": ["P1180", "P1140"]}, {"id": "P1160", "text": ["For AM radio this is a problem because rogue signals entering a neighboring coverage area may be at the same frequency of another transmitter."], "jumps": ["P1170", "P1140"]}, {"id": "P1150", "text": ["This propagation characteristic of sky waves is extremely useful for short-wave radio which uses the atmospheric bouncing to an advantage."], "jumps": ["P1160", "P1140"]}, {"id": "P1140", "text": ["This allows AM signals to bounce off the F1 layer which permits the signals to randomly bounce thousands of miles out of their assigned coverage area."], "jumps": ["P1150", "P1130"]}, {"id": "P1130", "text": ["The earth's ionosphere is made up of several layers.  The inner-most layers (D & E) dissipate during hours of darkness.", "The earth's ionosphere is made up of several layers. The inner-most layers (D & E) dissipate during hours of darkness.", "D Layer E Layer F1 Layer F2 Layer"], "jumps": ["P1140", "P1110"]}, {"id": "P1120", "text": ["This characteristic of radio waves can sometimes be a problem for AM signals."], "jumps": ["P1130", "P1110"]}, {"id": "P1110", "text": ["Radio frequencies have a tendency to bounce off the ionosphere and earth.  This is predictable and, in most instances, desirable.", "Radio frequencies have a tendency to bounce off the ionosphere and earth. This is predictable and, in most instances, desirable."], "jumps": ["P1120", "P1100"]}, {"id": "P1100", "text": ["A more realistic view of an AM signal sampled by a spectrum analyzer displays all the frequencies associated with the intelligence being transmitted."], "jumps": ["P1110", "P1090"]}, {"id": "P1090", "text": ["The illustration below shows a simplified view of an AM signal modulated by a single sine wave, where c = carrier frequency and m = modulating frequency."], "jumps": ["P1100", "P1070"]}, {"id": "P1080", "text": ["The amplitude of the sidebands in an AM signal should never exceed half the carrier amplitude.  This causes a great deal of distortion and can cause the signal to be completely unintelligible at the receiver.", "The amplitude of the sidebands in an AM signal should never exceed half the carrier amplitude. This causes a great deal of distortion and can cause the signal to be completely unintelligible at the receiver. telligible."], "jumps": ["P1090", "P1070"]}, {"id": "P1070", "text": ["The amplitude of the two sidebands are equal in every way and are, in fact, mirror images of one another."], "jumps": ["P1080", "P1050"]}, {"id": "P1060", "text": ["This is because the intelligence superimposed on the carrier frequency seems to close both the positive and negative peaks of the waveform.  This provides a distinctive visual identification.", "Modulated carrier AM waveforms viewed with an oscilloscope appear as an \"envelope\".", "Once the carrier signal has been modulated, the information is now located on the upper and lower sidebands of the composite signal which contains: the original carrier, the sum of the carrier and modulator, and the difference of the carrier and modulator.", "With amplitude modulation, information is \"encoded\" into the carrier wave by varying the RF carrier's amplitude with the variations of  the audio wave which contains the information, while maintaining constant frequency.", "This is because the intelligence superimposed on the carrier frequency seems to close both the positive and negative peaks of the waveform. This provides a distinctive visual identification.", "With amplitude modulation, information is \"encoded\" into the carrier wave by varying the RF carrier's amplitude with the variations of the audio wave which contains the information, while maintaining constant frequency."], "jumps": ["P1070", "P1050", "P1060", "P1040", "P1030", "P1020"]}, {"id": "P1020", "text": ["AM radio refers to its mode or method of modulation, in this case, Amplitude Modulation.", "AM radio refers to its mode or method of modulation, in this case, Amplitude Modulation. ation is. AM radio refers to its mode or method of modulation, in this case, Amplitude Modulation."], "jumps": ["P1030", "P1001"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P440", "text": ["Let's begin the lesson on AMPLITUDE MODULATION (AM) RECEIVERS...............", "It wasn't until the 1st World War that the true benefits of wireless communications became evident. Commanders were able to monitor distant elements of their commands and provide instructions to subordinate commanders without leaving the command post. From here, radio soon grew to the giant it is today."], "jumps": ["P430", "P440", "P420"]}, {"id": "P420", "text": ["In the early part of this century, the telegraph reigned.  It is likely that the time, money and effort that went into providing       telegraph service nation-wide was the major factor that inhibited  the acceptance of wireless communications.", "In the early part of this century, the telegraph reigned. It is likely that the time, money and effort that went into providing telegraph service nation-wide was the major factor that inhibited the acceptance of wireless communications."], "jumps": ["P430", "P400"]}, {"id": "P410", "text": ["Voice transmissions were achieved through the use of modulating radio frequencies with the information to be transmitted.  Not only did modulating carrier frequencies allow for voice transmissions by radio, but also paved the way for telephone, which also uses modulation.", "Voice transmissions were achieved through the use of modulating radio frequencies with the information to be transmitted. Not only did modulating carrier frequencies allow for voice transmissions by radio, but also paved the way for telephone, which also uses modulation."], "jumps": ["P420", "P400"]}, {"id": "P400", "text": ["Between the late 1800's and the early 1900's, \"wireless\" communication technology moved rapidly.  It was logical for radio to move from the realm of transmitted code to actual voice transmissions.", "Between the late 1800's and the early 1900's, \"wireless\" communication technology moved rapidly. It was logical for radio to move from the realm of transmitted code to actual voice transmissions."], "jumps": ["P410", "P300"]}, {"id": "P336", "text": [], "jumps": []}, {"id": "P335", "text": [], "jumps": []}, {"id": "P334", "text": [], "jumps": []}, {"id": "P332", "text": [], "jumps": []}, {"id": "P331", "text": [], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P301", "text": ["9. BNC to BNC Cableescilloscope XXXXXXXXXXnt"], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 470 Oscilloscope rXXXXXXXXXXnt"], "jumps": []}, {"id": "P100", "text": ["w Define and understand Amplitude Modulation and Heterodyning. w Identify the major components of a typical AM receiver. w Explain the major methods of tuning.", "w Identify a modulated AM signal. w Observe the affects of over modulation. w Measure the IF of an AM receiver. w Compare IF to a tuned RF signal."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: AMPLITUDE MODULATION (AM) RECEIVERSsdf asdf sadf"], "jumps": []}, {"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnishe let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
