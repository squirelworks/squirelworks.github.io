n the common alarm section.", "9 9"], "jumps": ["P"]}, {"id": "P1230", "text": ["Ground detection indicator lights provide an indication, when a Positive ground or Negative ground condition exists in the wiring of the switchboard or the sensor circuit."], "jumps": []}, {"id": "P1240", "text": ["The POS indicator illuminates when the +DC bus becomes grounded.", "/ / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / /", "/ / / // // // /// /// /// ///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////// // // / / / / / / / / / / / / / /", "/ ///////////////////////////////////////////////////////////", "//////////////////////////////////////////////////////////////////////////////// // // / / / / / / /", "/////////////////////////////////////////////////// /", "/ //////////////////////////////////////////", "//////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////// /// //// / / /", "/ / / / / / / / / / / / /// ///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////// /// ///////////////////// / / / / / / / / / / / / / / / / / / / / / /", "/ / / /////////////////////// / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / / /"], "jumps": []}, {"id": "P1250", "text": ["The NEG indicator illuminates when the -DC bus becomes grounded."], "jumps": []}, {"id": "P1260", "text": ["The alarm lamp will illuminate when the visual-audible switch is in the VISUAL position and the equipment senses a supervisory or alarm signal.", ", , , , , , , , , , , , , , , , , , , , , , , , , , , , , , , , , , , , , , , , , , , , , , , , , , , ,", ", , , , ,, ,, ,, ,, ,,, ,,, ,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,, arm sensors used in the Navy today are:"], "jumps": []}, {"id": "P1590", "text": ["The door mounted switch activates an alarm when a door is opened or closed, and is used for brig door alarms, secure communication space alarms, and any other space that may require an intrusion alarm."], "jumps": []}, {"id": "P1600", "text": ["Door mounted switches utilizes a roller armature assembly and a door strike plate to operate a set of internal micro-switches. When the door is opened or closed, the strike plate causes the roller armature to rise, operating the internal switches and closing the contacts...", "%ddd%%ddzdzdd//ddzdzz///dddddddddddK%dddddddz///////z//// //// //////<// h hh", "%ddd%%ddxxddd/dxdxd/x///dddddddddddK%dddddddx/d/d/dx///// //// /////< // g gg", "dddK%dddddddydd//d//d//// //// /////< // / g gg", ">>%ccc%cccycycc//cccc/y///cccccccccccL%cccccccyc/c////y///// / / /////<// / g gg{{?x", "$ccc$cccxccc.c.cccc.c...cccccccccccK$cccccccxc.c.......... ... ....; .. . g gg", ":U:j: :::: :!!::!!!!!!:!:::!!:j jq---jzi", "q Uq jjj : jj::jjj:::: ::] j -"], "jumps": ["P"]}, {"id": "P1610", "text": ["An additional set of internal switches are utilized as an anti-tamper device for the door switch cover. If the cover is loosened or removed the internal switches activate a tamper alarm."], "jumps": []}, {"id": "P1620", "text": ["The liquid level float switch activates an alarm when a liquid reaches a predetermined level. The switch can be used as either a low, normal, or high-level alarm."], "jumps": []}, {"id": "P1630", "text": ["The float switch utilizes a doughnut-shaped, floatable magnetic core operating over an encapsulated reed switch. Some models use a reversible float to change the switch configuration from N.O. contacts to N.C. contacts..."], "jumps": []}, {"id": "P1640", "text": ["When the liquid rises to the predetermined level, the float rises. The magnetic core of the float causes the encapsulated reed switch to close, activating the level alarm.", "fffffffffffff f f f f f ffffffffffffff"], "jumps": ["PP"]}, {"id": "P1650", "text": ["Liquid level float switches can be found in main engine room bilges, auxiliary machinery room bilges, steering gear rooms, tanks, voids, weapons magazines, and any other spaces that may have high volumes of water flowing through them..."], "jumps": ["P", "Pb8L8", "PaP", "PbOO", "PPbObY", "Pb", "Ph8PahOb8", "PP", "PLp", "Pa"]}, {"id": "P1660", "text": ["Detroit switch is the common name for Navy pressure and temperature switches. They are used to monitor ships equipment. (i.e. ships service turbine generators, ships service diesel generators, ships main engines, refrigeration units, etc.)))"], "jumps": []}, {"id": "P1670", "text": ["The pressure switch is used to monitor the pressure of lube oil, water, air, or any other pressurized medium related to the safe operation of ships equipment. Normal operating ranges are, 0-15 PSI, 15-50 PSI, and 50-100 PSI. Pressure switches can be either cut in low pressure or cut in high pressure."], "jumps": []}, {"id": "P1680", "text": ["The temperature switch is used to monitor lube oil temperature, water temperature, bearing temperature and many other equipment temperature parameters. There are two types of temperature switch either cut in low temperature or cut in high temperature..."], "jumps": []}, {"id": "P1690", "text": ["Both pressure and temperature switches operate utilizing a bellows working against an adjustable spring to activate a single pole/ single throw (SPST) switch. The closing of the (SPST) switch in the Detroit switch activates the alarm..."], "jumps": []}, {"id": "P1700", "text": ["The temperature switch utilizes an expanding liquid, sealed within a capillary to sense the temperature. As the temperature raises the liquid in the capillary expands, exerting pressure on the bellows...", "g8- 6 66", "H&H&8S 66 6 6", "`8- 6 66", "H&H&8T 6 6 6", "I&I&8T 6 6 6", "O6 6O", "a8- 6 66", "a9- 6 66", "I&I&9T 6 6 6", "a9- 7 77", "I&I&9T 7 7 7"], "jumps": []}, {"id": "P1710", "text": ["The pressure switch utilizes the actual pressure of the sensed medium to apply pressure to the bellows.", "nnnnnnnnn n n nnnnnnn", "nnnnnnn n = = n nnnnnn", "nnnnnn n = = = = = = = = n nnnnnn", "nnnnn n = ============= = = n nnnnnn", "nnnnn n = ====================== = n nnnnn", "nnnnnnn = ==================U========= = n nnnn", "nnnn = ===========U=UU=UU=U=========== = nnnnnn", "nnnn n = ========U=UUUUUUUUUUUUUUUU========= = nnnnn", "nnnnn n = =======U=UUUUUUUUUUUUUUUUUUUUU==U===== = nnnnnnn", "6 %%%% \"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"", "nnnnnnn n > > n nnnnnn"], "jumps": ["P"]}, {"id": "P1720", "text": ["The mercury thermostatic switch is used to detect the presence of fires or overheated conditions in important compartments or spaces.", "Note: NEVER paint a mercury thermostatic switch."], "jumps": []}, {"id": "P1730", "text": ["Mercury switches are available in three temperature ranges and each space can have as many switches as needed for coverage. They can be identified by colored bands on the bottom of the protective shield surrounding the glass tube..."], "jumps": []}, {"id": "P1740", "text": ["The mercury thermostatic switch operates like a thermometer, utilizing a column of mercury to short across a set of three electrical contacts, all within a sealed glass tube."], "jumps": []}, {"id": "P1750", "text": ["During a normal temperature condition the mercury is low in the glass tube shorting the two lowest contacts. Current flows through the switch supporting the supervisory function of the alarm system."], "jumps": []}, {"id": "P1760", "text": ["During a high temperature condition the column of mercury will rise reaching the top contact. Current now flows from the bottom contact through the mercury to the top contact activating the high temperature alarm..."], "jumps": []}, {"id": "P1770", "text": ["If the glass tube breaks, the mercury will drain from the switch. The loss of mercury in the switch will open the bottom two contacts, preventing the flow of current in the circuit and activating the trouble (supervisory) alarm. ..arm..."], "jumps": []}, {"id": "P1780", "text": ["Water switches activate an alarm during operation of the magazine sprinkling system. The switch contains two button contacts. When the saltwater fills the switch casting it shorts the two contacts activating the alarm....", "qqqqqnnnnnn3333333333333333333nnnnnqqqqq q", ",333qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq q", ",,333nnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnqnqqqq q", ",333qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq q", "q qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqn3,,w", "q qqqqnqnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn333,", "q qqqqqnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnqqqqqq", "q qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq q q", "....((((((((((((((((((((((((((((((((((((((((((ss -:", "======= /=== j== =j ???? ===========================", "????????????????????????? H7Bv,"], "jumps": ["P"]}, {"id": "P1790", "text": ["After each use the drain plug must be removed, water drained, and the plug replaced! Maintenance is required after each use due to saltwater corrosion of the internal switch parts."], "jumps": []}, {"id": "P1800", "text": ["The ionization detector activates an alarm in the presence of smoke or combustible gases. Charged electrons provide the current increase for the alarm"], "jumps": []}, {"id": "P1810", "text": ["Relay switches are used in critical circuits to sense power failure. Power failure causes the relay contacts to close initiating the alarm.", "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx 6W"], "jumps": ["P1910", "P1800"]}, {"id": "P1910", "text": ["You have completed the information on BASIC ALARM, SAFETY AND WARNING SYSTEMS."], "jumps": ["P1001", "P1810"]}, {"id": "P1920", "text": ["1. The basic alarm system consists of a sensing device, an alarm panel or switchboard, and audible or visual indicating devices.."], "jumps": ["P1925", "P1001"]}, {"id": "P1925", "text": ["2. Sensing devices are used with alarm, safety, and warning systems to initiate alarms when there is a deviation in normal operation..", "/@!1@'8D+<E(:E'=I)?K(>M,?M,@N(FV*ET.AO/HV/FU,@N*=K-AO-CQ.?L)>M)>M-@N+<J,>L+>M,?M(:K 1A", "0?#4A):C'=L(<K(<K)=J*>L*?M*>K,?K.ER*DS#@R!<M%;J'<I%<L%;K#8I 9L%:J\"8I", "+4 -:)08+7?(4?\"2>*8C-<H,=J-=I(=M.=J-<G(=I(;I&;H*?M(>N", "Z`\\2<E5BI?KL<KTBOODQMFRVHMVBRQDUWGPTESRJRTHOXCQQAMO8EK+6<\",1 ,2", "9N#7H 3A&:I&<L(>N,?N'>L';G';H)<K(=L)=J,>L4BP:EP7FS6GT8FR7FU0GW1ER8EP0BS.AN,CO5GQ9EP4BL8CH8BI3=G6BL.@N5FQ", "->!3?%6A%5?&9F'8D&7@&7B&6A'9F$8H%7D(<I :N&=M+AO)AN*@K+BP1GV1GU,DQ/BO+@N(?J*<G%:H+?N0?N0=I0@K1>H0?J1BN1BO*>L0AO/?M7CK;FL8FQ:EO6DN/DO.@K-:F+<H\"6D8HO", "xsj0:E=NQBONAKL>JQAPPBPP<LQ<HQFKRGMK@LM>JTCORCLOALLBLMAJO;GM-9A (3&)6)-5&/4", "=S >\\%DV-JY>QcASoEVrFUqBTmDTe>M`/AN*=H2?H0>H/=G6@I5CN2CR0FW.BR&@Q", "__Z:EH<IRBHNAKN=IKBLKDLSDKSCILBIMCKPDILELLALLALLBML?KN>KP?JL2<E(/:$.3$,+**+ (0", ",8 .9\"-8(2<*7C/9B/8B19D2<F7DI5@G4>F8EM7CM<GN>IP;FN6BJ,?G+?G$5A", "&0!*6#,9),5(28,7>2:F09E3>G5>H4>H5@I5=G1=D&6B />"], "jumps": []}, {"id": "P1930", "text": ["3. Audible and visual signals are used with the alarm, safety, and warning systems to alert personnel that an alarm condition exists.."], "jumps": []}, {"id": "P1935", "text": ["4. The three alarm conditions are normal, alarm, and trouble.", "Monitored parameter is within normal limits.", "Monitored parameter is outside of normal limits.", "Indicates a fault with the alarm circuit."], "jumps": []}, {"id": "P1940", "text": ["5. The IC/SM alarm panel/switchboard enables one watch stander to monitor remote equipment and spaces, by providing a distinct audible and visual indication of each alarm condition..."], "jumps": []}, {"id": "P1945", "text": ["6. Door mounted switches are used to sense the opening and closing of secure spaces..."], "jumps": []}, {"id": "P1950", "text": ["7. The liquid level float switch is used to monitor for low, normal, and high levels in tanks, voids, bilges, or any other spaces that may be at risk of flooding."], "jumps": []}, {"id": "P1955", "text": ["8. A pressure switch uses a bellows that works against an adjustable spring, to operate a set of contacts. The pressure of the monitored medium operates the bellows."], "jumps": []}, {"id": "P1960", "text": ["9. A temperature switch uses a bellows that works against an adjustable spring, to operate a set of contacts. The bellows motion is produced by a sealed-in liquid that expands with rising temperature..."], "jumps": []}, {"id": "P1965", "text": ["10. Mercury thermostatic switches make use of the encapsulated mercury to short the contacts of the switch."], "jumps": []}, {"id": "P1970", "text": ["11. A water switch is used primarily in magazine sprinkling alarm systems, and utilizes the water in the system to short the contacts."], "jumps": []}, {"id": "P1975", "text": ["12. Ionization detectors are used to detect the presence of combustible gases and smoke."], "jumps": []}, {"id": "P1980", "text": ["13. Relay switches are used to sense a loss of power in critical circuits."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["Yo let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
