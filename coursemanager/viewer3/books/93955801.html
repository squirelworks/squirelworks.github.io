<script>
const book = {"title": "93955801", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .."], "jumps": []}, {"id": "P1", "text": ["Title: STEPPER MOTORS sdf asdf asd fasfd asdf asdf sadf", "Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Discuss theory of operation. w Discuss construction. w Describe Stepper Motor types."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson you will learn about the Stepper Motor."], "jumps": ["P300", "P410"]}, {"id": "P410", "text": ["Stepper Motors are used for a variety of applications......"], "jumps": ["P400", "P420"]}, {"id": "P420", "text": ["These motors share some characteristics with both DC and AC motors."], "jumps": ["P410", "P430"]}, {"id": "P430", "text": ["However, Stepper Motors differ from DC and AC Motors because they are truly digital motors."], "jumps": ["P410", "P440"]}, {"id": "P440", "text": ["Let's begin the lesson on STEPPER MOTORS.................................."], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Stepper Motors, unlike DC and AC Motors, are not Continuous Motors."], "jumps": ["P1001", "P1030"]}, {"id": "P1030", "text": ["Stepper Motors and Synchro/Servos are classified as Incremental rotating machines."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Stepper motors move in small steps or increments..........."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["AC and Stepper Motors RPMMMMMMMMMM", "The Stepper Motor is similar to the AC Motor because the input signal frequency controls the motor shaft RPM."], "jumps": ["P1040", "P1060"]}, {"id": "P1060", "text": ["The Stepper Motor operates on a digital input signal......."], "jumps": ["P1050"]}, {"id": "P1070", "text": ["A higher frequency digital input signal causes a Stepper Motor to run faster."], "jumps": ["P1060"]}, {"id": "P1080", "text": ["An AC Motor requires a continuous application of input cycles to establish rotor movement."], "jumps": ["P1090"]}, {"id": "P1090", "text": ["A Stepper Motor can have rotor movement with only one digital pulse applied."], "jumps": ["P1080", "P1100"]}, {"id": "P1100", "text": ["If a continuous pulse train is applied, a Stepper Motor will rotate continuously at a rate determined by the input pulse frequency."], "jumps": ["P1090", "P1110"]}, {"id": "P1110", "text": ["A Stepper Motor is classified as _______..................."], "jumps": ["P1090"]}, {"id": "P1111", "text": [], "jumps": []}, {"id": "P1112", "text": ["A Continuous Motor requires an input cycle to generate motor action. One pulse can cause an output on a Stepper Motor....."], "jumps": []}, {"id": "P1113", "text": ["A Stepper Motor is a digital motor requiring pulsed inputs, not an analog signal......."], "jumps": []}, {"id": "P1120", "text": ["A Stepper Motor has a permanent magnet (P.M.) rotor assembly stator windings."], "jumps": ["P1130", "P1110", "P"]}, {"id": "P1130", "text": ["Most Stepper Motors have 4 separate stator windings."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["These windings must be energized in a specific order to cause rotation of the rotor shaft."], "jumps": ["P1120", "P1150"]}, {"id": "P1150", "text": ["The rotor has raised nodes on its surface which are magnetized in an alternate N - S arrangement."], "jumps": ["P1160", "P1120"]}, {"id": "P1160", "text": ["When applying DC current to the stator windings, an electromagnetic field is generated, which interacts with the P.M. nodes."], "jumps": ["P1150", "P1170"]}, {"id": "P1170", "text": ["Similar to DC motor action, the rotor moves a specific distance.", "Similar to DC motor action, the rotor moves a specific distance.."], "jumps": ["P1150", "P1180"]}, {"id": "P1180", "text": ["Correlation between Increment (step) and rotor/stator nodes", "The correlation between rotor nodes and stator coils is the distance of shaft movement per input pulse (energized stator coil)."], "jumps": ["P1150", "P1190"]}, {"id": "P1190", "text": ["For a 50 node rotor with 4 stator windings, a single step equals:"], "jumps": ["P1180", "P1200"]}, {"id": "P1200", "text": ["Activation of one stator field (one pulse) will displace the motor one quarter the distance between nodes in a 4 winding motor."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["After the rotor has moved due to the activated coil, the stator and rotor magnetic fields are in alignment."], "jumps": ["P1200", "P1220"]}, {"id": "P1220", "text": ["Once the rotor aligns to the magnetic field of a single stator field, further energization of that same field coil will have no effect on the rotor."], "jumps": ["P1210", "P1230"]}, {"id": "P1230", "text": ["To cause continuous or incremental rotation of the rotor, the stator fields must be sequentially activated from A through D."], "jumps": ["P1240", "P1210"]}, {"id": "P1240", "text": ["Each activated coil corresponds to one quarter distance between rotor nodes."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["If the sequence of coil activation (A-D) is maintained, rotor motion will continue."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["To accomplish clockwise rotation, sequential activation of coils A, B, C, D is required."], "jumps": ["P1240", "P1270"]}, {"id": "P1270", "text": ["The rotor follows the direction of field activation........"], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["To accomplish counter clockwise rotation, sequential activation of coils A, D, C, B is required."], "jumps": ["P1270", "P1290"]}, {"id": "P1290", "text": ["The rotor again follows the stator field activation........"], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["The rotor follows the stator field, much like an induction AC motor."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["A complete cycle of coil activation (pulses) corresponds to 4 steps or 22.5"], "jumps": ["P1320", "P1290"]}, {"id": "P1320", "text": ["= 4 complete stator cycles for one complete revolution", "Since a complete revolution corresponds to 360"], "jumps": ["P1310", "P1330"]}, {"id": "P1330", "text": ["Since there are 4 steps per stator cycle, 16 pulses are required for 1 complete revolution."], "jumps": ["P1320", "P1340", "PPR"]}, {"id": "P1340", "text": ["The most important part of Stepper Motor action is the sequence in which the coils are activated."], "jumps": ["P1330", "P1350"]}, {"id": "P1350", "text": ["If a stator cycle is not completed, motor action will cease until pulses are resumed at the same place they ended."], "jumps": ["P1340", "P1360"]}, {"id": "P1360", "text": ["As an example, suppose 5 pulses are sent to the Stepper for CW rotation in the sequence A, B, C, D, A."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["The next sequence of pulses needed to continue rotation would be B, C, D, A, B."], "jumps": ["P1360", "P1380"]}, {"id": "P1380", "text": ["If a step was missed in the sequence, motor action would not continue until the sequence was resumed, starting at the pulse that was missed or the pulse that corresponds to CCW rotation."], "jumps": ["P1360", "P1390"]}, {"id": "P1390", "text": ["Assume B, D, A, B, C, was received rather than B, C, D, A, B."], "jumps": ["P1380", "P1400"]}, {"id": "P1400", "text": ["At B the rotor would continue its CW rotation.............."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["At the next pulse, D, no rotor action would occur since pulse C was missed."], "jumps": ["P1400", "P1420"]}, {"id": "P1420", "text": ["At the next pulse, A, CCW rotation would occur since the last correctly received pulse was B."], "jumps": ["P1400", "P1430"]}, {"id": "P1430", "text": ["At the next pulse, B, CW rotation begins since the previous pulse was A."], "jumps": ["P1400", "P1440"]}, {"id": "P1440", "text": ["The final pulse C continues the original CW rotation."], "jumps": ["P1400", "P1450"]}, {"id": "P1450", "text": ["As you can see, two steps were missed by the pulses........"], "jumps": ["P1400", "P1460"]}, {"id": "P1460", "text": ["If a Stepper Motor has 100 rotor nodes and 5 stator pole windings, how many degrees is each step?"], "jumps": ["P1465", "P1450"]}, {"id": "P1461", "text": [], "jumps": []}, {"id": "P1462", "text": ["Remember: Try Again page..................................."], "jumps": []}, {"id": "P1465", "text": ["DEGREES PER STEP - To find the degrees per step use the formula below. N is the number of rotor poles and P is the number of stator poles."], "jumps": []}, {"id": "P1470", "text": ["If a Stepper Motor has 100 rotor nodes and 5 stator poles what is the PPR (Pulse per Revolution) of the motor?"], "jumps": ["P1475", "P1460", "Pulse"]}, {"id": "P1471", "text": [], "jumps": []}, {"id": "P1472", "text": ["Remember: Try Again page..................................."], "jumps": []}, {"id": "P1475", "text": ["PULSES PER REVOLUTION - To find the pulse per revolution use the following formula."], "jumps": []}, {"id": "P1480", "text": ["If a Stepper Motor has 100 rotor nodes and 5 stator poles, how many degrees apart are each stator poles for one revolution (360)?"], "jumps": ["P1485", "P1470"]}, {"id": "P1481", "text": [], "jumps": []}, {"id": "P1482", "text": ["1 stator cycle = # of poles ( in degrees )", "Remember: Try Again page..................................."], "jumps": []}, {"id": "P1485", "text": ["STATOR CYCLES - To find the number of degrees between stator poles use the formula below. P is the number of stator poles."], "jumps": []}, {"id": "P1490", "text": ["The stator pulse patterns discussed this far are called one phase energized since only one coil is activated at any instant of time."], "jumps": ["P1480", "P1500"]}, {"id": "P1500", "text": ["One phase step patterns cause the the Stepper Motor to jerk due to time delays between pulses."], "jumps": ["P1490", "P1510"]}, {"id": "P1510", "text": ["One phase step patterns are used when a minimum of current is required from the power supply."], "jumps": ["P1500", "P1520"]}, {"id": "P1520", "text": ["When smooth motor operation is required, two phase energized step patterns are employed."], "jumps": ["P1510", "P1530"]}, {"id": "P1530", "text": ["In two phase step patterns, the next energized coil is turned on during the current step pulse."], "jumps": ["P1520", "P1540"]}, {"id": "P1540", "text": ["In two phase step patterns, there is no time delay between pulses, resulting in jerk free operation."], "jumps": ["P1520", "P1550"]}, {"id": "P1550", "text": ["In two phase step patterns, the power supply must generate more current since two pulses are used in one time period."], "jumps": ["P1520", "P1560"]}, {"id": "P1560", "text": ["Both the one phase and two phase step patterns are defined as full step patterns where each energized coil corresponds to one full step."], "jumps": ["P1550", "P1570"]}, {"id": "P1570", "text": ["Another type of step pattern is called a half step pattern."], "jumps": ["P1560", "P1580"]}, {"id": "P1580", "text": ["In a half step pattern, 2 coils must be energized to establish one complete step."], "jumps": ["P1582", "P1570"]}, {"id": "P1582", "text": ["If only coil A is energized, rotor distance is 1/2 the distance traveled than if coils A and B were energized."], "jumps": ["P1590", "P1580"]}, {"id": "P1590", "text": ["In a Stepper Motor with 50 rotor nodes and 4 stator windings, each half step causes 0.9 of rotor rotation."], "jumps": ["P1600", "P1580"]}, {"id": "P1600", "text": ["PPR for the half step is 400. 100 stator cycles are required for one complete revolution of the rotor."], "jumps": ["P1610", "P1580"]}, {"id": "P1610", "text": ["As you may have guessed, all values are twice that of a full step pattern."], "jumps": ["P1580", "P1620"]}, {"id": "P1620", "text": ["Which type of step pattern generates the smoothest motor action?"], "jumps": ["P1580"]}, {"id": "P1621", "text": [], "jumps": []}, {"id": "P1622", "text": ["One phase step patterns have small time delays between pulses causing the Stepper Motor to jerk......"], "jumps": []}, {"id": "P1623", "text": ["Half step patterns do have overlapping pulses and are not the best for smooth motor operation......"], "jumps": []}, {"id": "P1630", "text": ["Which type of step pattern draws the most current from a power supply?"], "jumps": ["P1620"]}, {"id": "P1631", "text": [], "jumps": []}, {"id": "P1632", "text": ["A Half Step pattern has shorter pulse periods, which result in less current drawn from the power supply."], "jumps": []}, {"id": "P1633", "text": ["A One Phase step pattern has only one pulse activated at any one time period. This equates to less current draw."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on STEPPER MOTORS.LE........"], "jumps": ["P1630", "P1001"]}, {"id": "P1920", "text": ["1. Stepper Motors are classified as incremental motors and there are two distinct types."], "jumps": ["P1001", "P1930"]}, {"id": "P1930", "text": ["2. Stepper Motors, like AC Motors, are frequency sensitive where motor RPM is concerned."], "jumps": ["P1920"]}, {"id": "P1940", "text": ["3. A typical Stepper Motor has four independent stator poles and a rotor with nodes."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["N = # of Rotor Nodes P = # of Stator Poles", "4. Each energized coil corresponds to a particular rotary distance traveled. PPR is the number of pulses required for 360"], "jumps": ["P1940", "P1960"]}, {"id": "P1960", "text": ["5. Coils must be energized in a particular sequence to generate either clockwise or counterclockwise rotor rotation."], "jumps": ["P1950", "P1970"]}, {"id": "P1970", "text": ["6. One phase step patterns have a small time delay between pulses. Two phase step patterns have overlapping pulses. Both are full step patterns."], "jumps": ["P1960", "P1980"]}, {"id": "P1980", "text": ["7. Half wave step patterns require twice as many pulses or stator cycles to complete 1 revolution since two pulses are required for one step."], "jumps": ["P1970", "P1999"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1980", "P1001"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["Phase of input waveform determines speed of motor.", "Amplitude of input waveform determines speed of motor. u", "Frequency of input waveform determines speed of motor.", "How is a stepper motor and AC motor similar?"], "jumps": []}, {"id": "P10211", "text": [], "jumps": []}, {"id": "P10212", "text": [], "jumps": []}, {"id": "P10213", "text": ["A typical stepper motor has how many stator poles?"], "jumps": []}, {"id": "P10214", "text": ["If a stepper motor has 4 stator poles, how many windings does it have?"], "jumps": []}, {"id": "P10215", "text": ["What type of rotor does a stepper motor use? )"], "jumps": []}, {"id": "P10216", "text": ["If a stepper motor has 6 stator poles and 100 rotor nodes, what is the value of one step (in degrees)? 3"], "jumps": []}, {"id": "P10217", "text": ["If a stepper motor has 6 stator poles and 100 rotor nodes, what is the PPR of the motor? )"], "jumps": []}, {"id": "P10218", "text": ["If a stepper motor has 6 stator poles and 50 rotor nodes, what is the value of 1 stator cycle (in degrees)?"], "jumps": []}, {"id": "P10219", "text": ["less current drawn from the power supply", "What is a valid reason for using 2 phase energized step patterns?"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to _________"], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "PINFO", "text": ["03-14-01 Converted from SAM to tbk. frieda 03-14-01 Text and Branching. frieda 04-18-01 Graphics John Ayala 05-06-01 Checked and updated experiment graphics. Jeff 07-10-01 Made corrections to lesson as recommended by Gene. Jeff 07-19-01 Converted to To let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
