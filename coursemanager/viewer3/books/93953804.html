ircuits:", "Non-Inverting, Inverting, Difference and Summing"], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["For simplicity, only DC voltage inputs will be used. Remember, operational amplifiers can use AC inputs, however, the only difference in troubleshooting is the type of test equipment used.", "Non-Inverting, Inverting, Difference and Summing"], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["In each troubleshooting practice problem, you will be asked to:", "In each troubleshooting practice problem, you will be asked to: Identify the type of operational amplifier circuit. 2. Calculate the voltage gain. 3. Determine if the circuit is operating correctly. 4. Identify the probable fault.", "1. Identify the type of operational amplifier circuit. 2. Calculate the voltage gain. 3. Determine if the circuit is operating correctly. 4. Identify the probable fault."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on OPERATIONAL AMPLIFIER TS PRACTICE................."], "jumps": ["P430"]}, {"id": "P900", "text": ["1. Op AmpTroubleshooting Practice ice ctice"], "jumps": []}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1020", "text": ["The purpose of this experiment is to give you practice in troubleshooting various operational amplifier circuits. If the circuit is faulted, you will determine the faulty component and verify correct operation when the computer repairs the circuit.", "The purpose of this experiment is to give you practice in troubleshooting various operational amplifier circuits. If the circuit is faulted, you will determine the faulty component and verify correct operation when the computer repairs the circuit..."], "jumps": ["P1050", "P1001"]}, {"id": "P1050", "text": ["Pick up the PC130-54 card. Compare the card with the schematic shown."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["This card is used to give you practice in troubleshooting various operational amplifier circuits."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["IC1 is an operational amplifier that can be configured for a non-inverting, inverting, difference or summing amplifier."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["Switch S5 is used to configure the Op Amp.  In the SUM (UP) position the Op Amp is a summing amplifier or inverting amp (R4 fully CCW).", "Switch S5 is used to configure the Op Amp. In the SUM (UP) position the Op Amp is a summing amplifier or inverting amp (R4 fully CCW)."], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["S5 in the DIFF (DOWN) position configures the Op Amp a difference amp or non-inverting amplifier with R1 fully CCW."], "jumps": ["P1100", "P1050"]}, {"id": "P1100", "text": ["S1 and S2 select the type of input signal used, AC, +DC, -DC."], "jumps": ["P1110", "P1050"]}, {"id": "P1110", "text": ["S3 and S4 select different values of input resistors that effect the gain of the Op Amp. Let's start the experiment."], "jumps": ["P1120", "P1050"]}, {"id": "P1120", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P1050"]}, {"id": "P1130", "text": ["2.  Carefully place PC130-54 into the Test Console PC2 position.  3.  Set switches S1 UP and S2 through S5 DOWN on PC130-54.", "2. Carefully place PC130-54 into the Test Console PC2 position. 3. Set switches S1 UP and S2 through S5 DOWN on PC130-54.Speaker switch to ON........................................."], "jumps": ["P1120"]}, {"id": "P1140", "text": ["With S1 UP and S2 through S5 DOWN, the Op Amp is configured as a difference amplifier with a gain of 1.", "With S1 UP and S2 through S5 DOWN, the Op Amp is configured as a difference amplifier with a gain of 1. ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P1130", "P1145"]}, {"id": "P1145", "text": ["DIFFERENCE AMPLIFIER - S5 is in the DIFF position which allows an input to both the + and - inputs of the Op Amp. S3 in the DOWN position sets up a gain of 1 (RF1/R3 = 1)."], "jumps": []}, {"id": "P1150", "text": ["4.  Set the Voltmeter Switch to Positive. \n5.  Set the Positive Supply Voltage to 15. The Test Console's                Voltage Meter should indicate 15 volts.", "4. Set the Voltmeter Switch to Positive. 5. Set the Positive Supply Voltage to 15. The Test Console's Voltage Meter should indicate 15 volts."], "jumps": ["P1140"]}, {"id": "P1155", "text": ["6.  Set the Voltmeter Switch to Negative.\n7.  Set the Negative Supply Voltage to 15. The Test Console's              Voltage Meter should indicate 15 volts.", "6. Set the Voltmeter Switch to Negative. 7. Set the Negative Supply Voltage to 15. The Test Console's Voltage Meter should indicate 15 volts........"], "jumps": ["P1150"]}, {"id": "P1160", "text": ["8.  Place PC2 DC Power switch to ON. The experiment card is             now set up. Let's verify normal operation before beginning the      troubleshooting practice.", "8. Place PC2 DC Power switch to ON. The experiment card is now set up. Let's verify normal operation before beginning the troubleshooting practice."], "jumps": ["P1155"]}, {"id": "P1170", "text": ["9.  Adjust R4 for +5 volts as measured at TP4. Use a multimeter           or oscilloscope. \n10.  Adjust R1 for +3 volts as measured at TP3. Use a multimeter          or oscilloscope.  \n11.  Verify that TP4 still measures +5 volts.", "9. Adjust R4 for +5 volts as measured at TP4. Use a multimeter or oscilloscope. 10. Adjust R1 for +3 volts as measured at TP3. Use a multimeter or oscilloscope. 11. Verify that TP4 still measures +5 volts.."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["12.  Measure the output voltage at TP9. \n       Is the voltage measured +2 volts \u00b110%?", "12. Measure the output voltage at TP9. Is the voltage measured +2 volts"], "jumps": ["P1170"]}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1182", "text": ["You should have measured +2 volts. The Op Amp is configured for a difference amplifier."], "jumps": []}, {"id": "P1190", "text": ["The Op Amp circuit is operating correctly. The computer may now insert a fault into the circuit. You must determine if the circuit is faulted and if so, what the fault is.", "The Op Amp circuit is operating correctly. The computer may now insert a fault into the circuit. You must determine if the circuit is faulted and if so, what the fault is..............."], "jumps": ["P1180"]}, {"id": "P2000", "text": ["The schematic is as shown. \n1.  Set PC130-54 switches S1 UP and S2 - S5 DOWN.\n2.  Adjust PC130-54 resistors R1 and R4 to mid range.", "The schematic is as shown. 1. Set PC130-54 switches S1 UP and S2 - S5 DOWN. 2. Adjust PC130-54 resistors R1 and R4 to mid range."], "jumps": ["P2010"]}, {"id": "P2010", "text": ["What is the configuration of this amplifier?", "What is the configuration of this amplifier?..............."], "jumps": ["P2000", "P2015"]}, {"id": "P2011", "text": [], "jumps": []}, {"id": "P2012", "text": ["The configuration could be non-inverting if R1 was adjusted to place a ground on R3."], "jumps": []}, {"id": "P2013", "text": ["Notice the position of S5, in the DOWN position. The configuration can only be non-inverting or difference."], "jumps": []}, {"id": "P2015", "text": ["CONFIGURATION - Notice the position of S5 and if one of the input resistors, R1 or R4, is adjusted to ground."], "jumps": []}, {"id": "P2020", "text": ["What is the gain of the difference amplifier configuration?"], "jumps": ["P2010", "P2025"]}, {"id": "P2021", "text": [], "jumps": []}, {"id": "P2022", "text": ["The gain is not 2. S3 is DOWN which puts R3 in the circuit. RF1 divided by R3 does not equal 2."], "jumps": []}, {"id": "P2023", "text": ["The gain is not 3. S3 is DOWN which puts R3 in the circuit. RF1 divided by R3 does not equal 3."], "jumps": []}, {"id": "P2025", "text": ["GAIN - Remember, the gain of a summing or difference amplifier is normally 1."], "jumps": []}, {"id": "P2030", "text": ["3.  Adjust R4 for a 5 volt measurement at TP4. \n4.  Adjust R1 for a 3 volt measurement at TP3.  \n5.  Verify that TP4 still measures 5 volts.", "3. Adjust R4 for a 5 volt measurement at TP4. 4. Adjust R1 for a 3 volt measurement at TP3. 5. Verify that TP4 still measures 5 volts. External program = SCAN FTR 0 F2 03......."], "jumps": ["P2020"]}, {"id": "P2040", "text": ["6.  Measure the output voltage at TP9. Is the difference amplifier         operating correctly within \u00b110%?", "6. Measure the output voltage at TP9. Is the difference amplifier operating correctly within"], "jumps": ["P2030"]}, {"id": "P2041", "text": [], "jumps": []}, {"id": "P2042", "text": ["If the difference amplifier was operating correctly, you would have measured + 2V (5 V - 3 V)."], "jumps": []}, {"id": "P2050", "text": ["The difference amplifier is faulted. To start your troubleshooting process, first check to ensure the Op Amp is receiving the correct power input."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["7.  Measure the voltage at TP10 and TP11. \n     Are the input power voltages correct? \n     TP10: -15 V; TP11: +15 V", "7. Measure the voltage at TP10 and TP11. Are the input power voltages correct? TP10: -15 V; TP11: +15 V"], "jumps": ["P2050", "P2065"]}, {"id": "P2061", "text": [], "jumps": []}, {"id": "P2062", "text": ["The fault inserted does not effect the applied voltage, check your measurements."], "jumps": []}, {"id": "P2065", "text": ["MEASUREMENT SETUP - Carefully measure the output voltage at TP10 and TP11."], "jumps": []}, {"id": "P2070", "text": ["Since the operating voltages are correct, check to see if the inputs to the Op Amp are correct. You know that the output is incorrect."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["8.  Measure the voltages at TP5 and TP6. You should measure            approximately +2.5 V. Remember, R6 and RF2 act as a voltage       divider.", "8. Measure the voltages at TP5 and TP6. You should measure approximately +2.5 V. Remember, R6 and RF2 act as a voltage divider."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["Are the voltages at TP5 and TP6 correct?", "Are the voltages at TP5 and TP6 correct?..................."], "jumps": ["P2080"]}, {"id": "P2091", "text": [], "jumps": []}, {"id": "P2092", "text": ["The +input of the Op Amp is not effected, check your measurements."], "jumps": []}, {"id": "P2100", "text": ["Now that you know that the Op Amp has the correct +input, check the -input."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["9.  Measure the voltage at TP8. For this circuit configuration, the        voltage at TP8 should be approximately 2.5 V.", "9. Measure the voltage at TP8. For this circuit configuration, the voltage at TP8 should be approximately 2.5 V.."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["Is the voltage at TP8 correct?", "Is the voltage at TP8 correct?ped.........................."], "jumps": ["P2110"]}, {"id": "P2121", "text": [], "jumps": []}, {"id": "P2122", "text": ["The fault in the circuit effects the voltage at TP8, check your measurement."], "jumps": []}, {"id": "P2130", "text": ["You have discovered that the input voltage to the -input of IC1 is incorrect. Let's check to see where the fault is."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["10.  Measure the voltage at TP3. If you measure 0V, then the fault          is probably in R1 or the input voltage.", "10. Measure the voltage at TP3. If you measure 0V, then the fault is probably in R1 or the input voltage."], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["Is R1 or the input voltage the fault?", "Is R1 or the input voltage the fault?......................"], "jumps": ["P2130"]}, {"id": "P2151", "text": [], "jumps": []}, {"id": "P2152", "text": ["You should have measured approximately 2.7 V. Voltage is  Ensure that TP3 and TP4 measure +3 V and +5 V                                 respectively. Adjust R1 and R4 if needed.", "14. Place S3 DOWN to return the circuit to a difference amplifier. 15. Place PC2 DC Power switch to ON. 16. Ensure that TP3 and TP4 measure +3 V and +5 V respectively. Adjust R1 and R4 if needed..."], "jumps": ["P2200"]}, {"id": "P2220", "text": ["17.  Measure the output voltage at TP9. Is the difference amplifier          circuit operating correctly within \u00b110%?", "17. Measure the output voltage at TP9. Is the difference amplifier circuit operating correctly within"], "jumps": ["P2210"]}, {"id": "P2221", "text": [], "jumps": []}, {"id": "P2222", "text": ["You should have measured +2 V. This indicates that the difference amplifier is operating correctly (5 V - 3 V = +2 V)."], "jumps": []}, {"id": "P2230", "text": ["Congratulations! You correctly identified the fault in the Op Amp difference amplifier and verified normal operation."], "jumps": ["P2220"]}, {"id": "P3000", "text": ["The schematic is as shown. \n1.  Set PC130-54 switches S1 UP and S2 - S5 DOWN. \n2.  Adjust PC130-54 resistors R1 and R4 to mid range.", "The schematic is as shown. 1. Set PC130-54 switches S1 UP and S2 - S5 DOWN. 2. Adjust PC130-54 resistors R1 and R4 to mid range."], "jumps": ["P3010"]}, {"id": "P3010", "text": ["What type of operational amplifier circuit was configured?", "What type of operational amplifier circuit was configured?."], "jumps": ["P3000", "P3015"]}, {"id": "P3011", "text": [], "jumps": []}, {"id": "P3012", "text": ["The configuration could be non-inverting if R1 was adjusted to place a ground on R3."], "jumps": []}, {"id": "P3013", "text": ["Notice the position of S5, in the DOWN position. The configuration can only be non-inverting or difference."], "jumps": []}, {"id": "P3015", "text": ["CONFIGURATION - Notice the position of S5 and if one of the input resistors, R1 or R4, is adjusted to ground."], "jumps": []}, {"id": "P3020", "text": ["What i asurement indicates that RF2 is shorted. The computer will now replace RF2. Remember, there could be fault between R6 and IC1 in the wiring no matter how unlikely it may seem.)).. External program = SCAN FTR 0 C1 00"], "jumps": ["P3170"]}, {"id": "P3190", "text": ["15.  Place S4 to DOWN to return the circuit to a difference                       amplifier.  \n16.  Place PC2 DC Power switch to ON. \n17.  Ensure that TP3 and TP4 measure +3 V and +5 V                                respectively.  Adjust R1 and R4 if  needed.", "15. Place S4 to DOWN to return the circuit to a difference amplifier. 16. Place PC2 DC Power switch to ON. 17. Ensure that TP3 and TP4 measure +3 V and +5 V respectively. Adjust R1 and R4 if needed........"], "jumps": ["P3180"]}, {"id": "P3200", "text": ["18.  Measure the output voltage at TP9. Is the difference amplifier         circuit operating correctly within \u00b110%?", "18. Measure the output voltage at TP9. Is the difference amplifier circuit operating correctly within"], "jumps": ["P3190"]}, {"id": "P3201", "text": [], "jumps": []}, {"id": "P3202", "text": ["You should have measured +2 V. This indicates that the difference amplifier is operating correctly (5 V - 3 V = +2 V)."], "jumps": []}, {"id": "P3210", "text": ["Congratulations! You correctly identified the fault in the Op Amp difference amplifier and verified normal operation."], "jumps": ["P3200"]}, {"id": "P4000", "text": ["The schematic is as shown. \n1.  Set PC130-54 switches S1 and S5 UP and S2 - S4 DOWN. \n2.  Adjust PC130-54 resistors R1 and R4 to mid range.", "The schematic is as shown. 1. Set PC130-54 switches S1 and S5 UP and S2 - S4 DOWN. 2. Adjust PC130-54 resistors R1 and R4 to mid range.."], "jumps": ["P4010"]}, {"id": "P4010", "text": ["What type of operational amplifier circuit was configured?", "What type of operational amplifier circuit was configured?."], "jumps": ["P4000", "P4015"]}, {"id": "P4011", "text": [], "jumps": []}, {"id": "P4012", "text": ["Notice the position of S5, in the UP position. The configuration can only be inverting or summing."], "jumps": []}, {"id": "P4013", "text": ["The configuration could be inverting if R4 was adjusted to place a ground on R6."], "jumps": []}, {"id": "P4015", "text": ["CONFIGURATION - Notice the position of S5 and if one of the input resistors, R1 or R4, is adjusted to ground."], "jumps": []}, {"id": "P4020", "text": ["What is the gain of the summing amplifier configuration?", "What is the gain of the summing amplifier configuration?..."], "jumps": ["P4010", "P4025"]}, {"id": "P4021", "text": [], "jumps": []}, {"id": "P4022", "text": ["The gain is not 2. S3 is DOWN which puts R3 in the circuit. RF1 divided by R3 does not equal 2."], "jumps": []}, {"id": "P4023", "text": ["The gain is not 3. S3 is DOWN which puts R3 in the circuit. RF1 divided by R3 does not equal 3."], "jumps": []}, {"id": "P4025", "text": ["GAIN - Remember, the gain of a summing or difference amplifier is normally 1."], "jumps": []}, {"id": "P4030", "text": ["3.  Adjust R4 for a 5 volt measurement at TP4. \n4.  Adjust R1 for a 3 volt measurement at TP3. \n5.  Verify that TP4 still measures 5 volts.", "3. Adjust R4 for a 5 volt measurement at TP4. 4. Adjust R1 for a 3 volt measurement at TP3. 5. Verify that TP4 still measures 5 volts. External program = SCAN FTR 0 F2 01........"], "jumps": ["P4020"]}, {"id": "P4040", "text": ["6.  Measure the output voltage at TP9. Is the summing amplifier          operating correctly within \u00b110%?", "6. Measure the output voltage at TP9. Is the summing amplifier operating correctly within"], "jumps": ["P4030"]}, {"id": "P4041", "text": [], "jumps": []}, {"id": "P4042", "text": ["If the summing amplifier was operating correctly, you would have measured -8 V (5 V + 3 V, inverted)."], "jumps": []}, {"id": "P4050", "text": ["The summing amplifier is faulted. To start your troubleshooting process, first check that the Op Amp is receiving the correct power input."], "jumps": ["P4040"]}, {"id": "P4060", "text": ["7.  Measure the voltage at TP10 and TP11. \n     Are the input power voltages correct? \n     TP10: -15 V; TP11: +15 V", "7. Measure the voltage at TP10 and TP11. Are the input power voltages correct? TP10: -15 V; TP11: +15 VV"], "jumps": ["P4050", "P4065"]}, {"id": "P4061", "text": [], "jumps": []}, {"id": "P4062", "text": ["The fault inserted does not effect the applied voltage, check your measurements."], "jumps": []}, {"id": "P4065", "text": ["MEASUREMENT SETUP - Carefully measure the voltage at TP10 and TP11."], "jumps": []}, {"id": "P4070", "text": ["Since the operating voltages are correct, check to see if the input to the Op Amp is correct. You know that the output is incorrect."], "jumps": ["P4060"]}, {"id": "P4080", "text": ["8.  Measure the voltage at TP8. You should measure                               approximately 0 V. The input voltage to the -input is very low.", "8. Measure the voltage at TP8. You should measure approximately 0 V. The input voltage to the -input is very low."], "jumps": ["P4070"]}, {"id": "P4090", "text": ["Is the voltage correct at TP8?", "Is the voltage correct at TP8?ped.........................."], "jumps": ["P4080"]}, {"id": "P4091", "text": [], "jumps": []}, {"id": "P4092", "text": ["You should have measured approximately 0 V. Check your measurement at TP8."], "jumps": []}, {"id": "P4100", "text": ["You have discovered that the voltage to the inverting input of IC1 is correct, but a fault must still be in the circuit.", "You have discovered that the voltage to the inverting input of IC1 is correct, but a fault must still be in the circuit......................................................................."], "jumps": ["P4090"]}, {"id": "P4110", "text": ["Since the inputs on TP3 and TP4 are correct but the output  of IC1 on TP9 is higher and not inverted, let's check the feedback resistor, RF1.", "Since the inputs on TP3 and TP4 are correct but the output of IC1 on TP9 is higher and not inverted, let's check the feedback resistor, RF1........................................................................................................................................................."], "jumps": ["P4100"]}, {"id": "P4120", "text": ["9.  Place PC2 DC Power switch to OFF. This removes power for a      resistance check.", "9. Place PC2 DC Power switch to OFF. This removes power for a resistance check. nal program = SCAN FTR 0 C1 00"], "jumps": ["P4110"]}, {"id": "P4130", "text": ["10.  Place an ohmmeter across RF1 (TP8 and TP9). You are                    looking for an open that prevents the feedback voltage from          reaching the -input.", "10. Place an ohmmeter across RF1 (TP8 and TP9). You are looking for an open that prevents the feedback voltage from reaching the -input."], "jumps": ["P4120"]}, {"id": "P4150", "text": ["11.  Also, measure the resistance of TP9 to ground. You are                   looking for a short that would ground the output and                        feedback signal.", "11. Also, measure the resistance of TP9 to ground. You are looking for a short that would ground the output and feedback signal.."], "jumps": ["P4130"]}, {"id": "P4160", "text": ["12. Measure the resistance of TP8 to ground. You are looking for         a short that would ground the inverted input.", "12. Measure the resistance of TP8 to ground. You are looking for a short that would ground the inverted input....................................................................................................."], "jumps": ["P4130"]}, {"id": "P4170", "text": ["What does your measurement indicate?", "What does your measurement indicate??????????????????????????????????????????????????????????????????????????????????????????????????????????????"], "jumps": ["P4130"]}, {"id": "P4171", "text": [], "jumps": []}, {"id": "P4172", "text": ["Make sure you are measuring between TP8 and TP1.", "Make sure you are measuring between TP8 and TP1............................... t is the configuration of this operation amplifier?", "What is the configuration of this operation amplifier?....."], "jumps": ["P5000", "P5015"]}, {"id": "P5011", "text": [], "jumps": []}, {"id": "P5012", "text": ["Notice the position of S5, in the DOWN position. The configuration can only be non-inverting or difference."], "jumps": []}, {"id": "P5013", "text": ["The configuration could be difference if R1 was not placed to ground."], "jumps": []}, {"id": "P5015", "text": ["CONFIGURATION - Notice the position of S5 and if one of the input resistors, R1 or R4, is adjusted to ground."], "jumps": []}, {"id": "P5020", "text": ["What is the gain of the non-inverting amplifier configuration?"], "jumps": ["P5010", "P5025"]}, {"id": "P5021", "text": [], "jumps": []}, {"id": "P5022", "text": ["The gain is not 1. S3 is UP which puts R2 in the circuit. RF1 divided by R2 plus 1 does not equal 1."], "jumps": []}, {"id": "P5023", "text": ["The gain is not 2. S3 is UP which puts R2 in the circuit. RF1 divided by R2 plus 1 does not equal 2."], "jumps": []}, {"id": "P5025", "text": ["GAIN - Remember, the gain of a non-inverting amplifier is RF/R + 1."], "jumps": []}, {"id": "P5030", "text": ["3.  Adjust R4 for a 4 volt measurement at TP6. R4 is adjusted to a       specific voltage input at TP6 because R6 and RF2 act as a              voltage divider which are used for other circuit configurations.", "3. Adjust R4 for a 4 volt measurement at TP6. R4 is adjusted to a specific voltage input at TP6 because R6 and RF2 act as a voltage divider which are used for other circuit configurations."], "jumps": ["P5040", "P5020"]}, {"id": "P5040", "text": ["4.  Measure the output voltage at TP9. Is the non-inverting                    amplifier operating correctly within \u00b110%?", "4. Measure the output voltage at TP9. Is the non-inverting amplifier operating correctly within"], "jumps": ["P5030"]}, {"id": "P5041", "text": [], "jumps": []}, {"id": "P5042", "text": ["Check your measurement at 5090"]}, {"id": "P5110", "text": ["7.  Measure the voltage at TP4. Note that since R6 and RF2 are           equal, the voltage at TP4 should be above +7.0V. If you                    measure 0 V, then the fault is probably in R4 or the input                  voltage.", "7. Measure the voltage at TP4. Note that since R6 and RF2 are equal, the voltage at TP4 should be above +7.0V. If you measure 0 V, then the fault is probably in R4 or the input voltage...."], "jumps": ["P5120", "P5100"]}, {"id": "P5120", "text": ["Is R4 or the input voltage the fault?", "Is R4 or the input voltage the fault?......................"], "jumps": ["P5110"]}, {"id": "P5121", "text": [], "jumps": []}, {"id": "P5122", "text": ["You should have measured approximately 7.4 V. Even though you adjusted R4 for +8 V, voltage is present at TP4."], "jumps": []}, {"id": "P5130", "text": ["Since there is a voltage at TP4, the fault could be R6, RF2 or IC1."], "jumps": ["P5140", "P5120"]}, {"id": "P5140", "text": ["8.  Place PC2 DC Power switch to OFF.  \n9.  Place S4 to UP. This removes power for a resistance check            and isolates R6 and RF2.", "8. Place PC2 DC Power switch to OFF. 9. Place S4 to UP. This removes power for a resistance check and isolates R6 and RF2."], "jumps": ["P5130"]}, {"id": "P5150", "text": ["10.  Place an ohmmeter across R6, use the leads to the                           component.  You are looking for an open that would prevent          the voltage from reaching the +input of the Op Amp.", "10. Place an ohmmeter across R6, use the leads to the component. You are looking for an open that would prevent the voltage from reaching the +input of the Op Amp. program = SCAN FTR 0 F2 02"], "jumps": ["P5140"]}, {"id": "P5160", "text": ["11.  Place an ohmmeter across RF2 (TP6 and TP7). You are                    looking for a short that would ground the input signal.", "11. Place an ohmmeter across RF2 (TP6 and TP7). You are looking for a short that would ground the input signal."  R6 and the +input to the Op Amp."], "jumps": ["P5220", "P5200"]}, {"id": "P5220", "text": ["The computer will now repair the wiring.", "The computer will now repair the wiring. ternal program = SCAN FTR 0 C1 00. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P5210"]}, {"id": "P5230", "text": ["15.  Ensure that S4 is DOWN and the PC2 POWER switch is ON.", "15. Ensure that S4 is DOWN and the PC2 POWER switch is ON.he PC1 DC Switch to ON...."], "jumps": ["P5220"]}, {"id": "P5240", "text": ["16.  Measure the output voltage at TP9. Is the non-inverting                    amplifier circuit operating correctly within \u00b110%?", "16. Measure the output voltage at TP9. Is the non-inverting amplifier circuit operating correctly within"], "jumps": ["P5230"]}, {"id": "P5241", "text": [], "jumps": []}, {"id": "P5242", "text": ["You should have measured +12 V, the non-inverting amplifier is operating correctly."], "jumps": []}, {"id": "P5250", "text": ["Congratulations! You correctly identified the fault in the Op Amp non-inverting amplifier and verified normal operation."], "jumps": ["P5240"]}, {"id": "P6000", "text": ["The schematic is as shown. 1. Set PC130-54 switches S1, S3 and S5 UP and S2 and S4 DOWN. 2. Adjust PC130-54 resistors R1 to mid range and R4 fully CCW."], "jumps": ["P6010"]}, {"id": "P6010", "text": ["What type of operational amplifier circuit was configured?", "What type of operational amplifier circuit was configured?."], "jumps": ["P6000", "P6015"]}, {"id": "P6011", "text": [], "jumps": []}, {"id": "P6012", "text": ["Notice the position of S5, in the UP position. The configuration can only be summing or inverting."], "jumps": []}, {"id": "P6013", "text": ["The configuration could be summing if R4 was not placed at ground."], "jumps": []}, {"id": "P6015", "text": ["CONFIGURATION - Notice the position of S5 and if one of the input resistors, R1 or R4, is adjusted to ground."], "jumps": []}, {"id": "P6020", "text": ["What is the gain of the inverting amplifier configuration?", "What is the gain of the inverting amplifier configuration?."], "jumps": ["P6010", "P6025"]}, {"id": "P6021", "text": [], "jumps": []}, {"id": "P6022", "text": ["The gain is not 1. S3 is UP which puts R2 in the circuit. RF1 divided by R2 does not equal 1."], "jumps": []}, {"id": "P6023", "text": ["The gain is not 3. S3 is UP which puts R2 in the circuit. RF1 divided by R2 does not equal 3."], "jumps": []}, {"id": "P6025", "text": ["GAIN - Remember, the gain of an inverting amplifier is RF/R."], "jumps": []}, {"id": "P6030", "text": ["3.  Adjust R1 for a 4 volt measurement at TP3.", "3. Adjust R1 for a 4 volt measurement at TP3.............."], "jumps": ["P6020"]}, {"id": "P6040", "text": ["4.  Measure the output voltage at TP9. Is the inverting amplifier           operating correctly within \u00b110%?", "4. Measure the output voltage at TP9. Is the inverting amplifier operating correctly within"], "jumps": ["P6030"]}, {"id": "P6041", "text": [], "jumps": []}, {"id": "P6042", "text": ["You should have measured -8 V. The 4 V input is amplified by 2 and inverted."], "jumps": []}, {"id": "P6050", "text": ["Congratulations! You correctly determined that the inverting amplifier is functioning correctly. It is important to be able to determine whether equipment is functioning properly."], "jumps": ["P6040"]}, {"id": "P7000", "text": ["Would you like to try another troubleshooting experiment?", "Would you like to try another troubleshooting experiment? No"], "jumps": []}, {"id": "P7010", "text": ["You have completed all of the troubleshooting experiments. If you wish to perform any of the experiments again, you may select \"Op Amp Troubleshooting Practice\" from the Lesson Menu.", "You have completed all of the troubleshooting experiments. If you wish to perform any of the experiments again, you may select \"Op Amp Troubleshooting Practice\" from the Lesson Menu..."], "jumps": []}, {"id": "P7020", "text": ["1. Return the Test Console to the initial control settings. nter the discussion text here."], "jumps": []}, {"id": "P7030", "text": ["Disconnect test equipment. \n     Carefully remove PC130-54.                                \n     Return all equipment to its proper storage area.", "Disconnect test equipment. Carefully remove PC130-54. Return all equipment to its proper storage area.."], "jumps": []}, {"id": "P7040", "text": [], "jumps": []}, {"id": "P7910", "text": ["This completes the experiment on OP AMP TROUBLESHOOTING PRACTICE."], "jumps": ["P1001", "P7040"]}, {"id": "P9020", "text": ["The purpose of this experiment is to give you practice in troubleshooting various operational amplifier circuits. If the circuit is faulted, you will determine the faulty component and verify correct operation when the computer repairs the circuit."], "jumps": ["P9050", "P1001"]}, {"id": "P9050", "text": ["Pick up the PC130-54 card. Compare the card with the schematic shown."], "jumps": ["P9060", "P9020"]}, {"id": "P9060", "text": ["This card is used to give you practice in troubleshooting various operational amplifier circuits."], "jumps": ["P9070", "P9050"]}, {"id": "P9070", "text": ["IC1 is an operational amplifier that can be configured for a non-inverting, inverting, difference or summing amplifier."], "jumps": ["P9080", "P9050"]}, {"id": "P9080", "text": ["Switch S5 is used to configure the Op Amp. In the SUM (UP) position the Op Amp is a summing amplifier or inverting amp \n(R4 fully CCW).", "Switch S5 is used to configure the Op Amp. In the SUM (UP) position the Op Amp is a summing amplifier or inverting amp (R4 fully CCW)."], "jumps": ["P9090", "P9050"]}, {"id": "P9090", "text": ["S5 in the DIFF (DOWN) position configures the Op Amp a difference amp or non-inverting amplifier with R1 fully CCW."], "jumps": ["P9100", "P9050"]}, {"id": "P9100", "text": ["S1 and S2 select the type of input signal used, AC, +DC, -DC."], "jumps": ["P9110", "P9050"]}, {"id": "P9110", "text": ["S3 and S4 select different values of input resistors that effect the gain of the Op Amp.  Let's start the experiment.", "S3 and S4 select different values of input resistors that effect the gain of the Op Amp. Let's start the experiment."], "jumps": ["P9120", "P9050"]}, {"id": "P9120", "text": ["1.  Set the Test Console controls to the initial control settings.", "2. Carefully place PC130-54 into the Test Console PC2 position.", "3. Set switches S1 UP and S2 through S5 DOWN on PC130-54.", "2. Carefully place PC130-54 into the Test Console PC position.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P9050"]}, {"id": "P9130", "text": ["2. Carefully place PC130-54 into the Test Console PC2 position. 3. Set switches S1 UP and S2 through S5 DOWN on PC130-54..onsole."], "jumps": ["P9140"]}, {"id": "P9140", "text": ["With S1 UP and S2 through S5 DOWN, the Op Amp is configured as a difference amplifier with a gain of 1.", "4. Press Enter to set: Positive Supply Voltage to 15", "4. Press Enter to set: Voltage Select to 15 volts.", "With S1 UP and S2 through S5 DOWN, the Op Amp is configured as a difference amplifier with a gain of 1.tch - ON"], "jumps": ["P9130", "P9145"]}, {"id": "P9145", "text": ["DIFFERENCE AMPLIFIER - S5 is in the DIFF position which allows an input to both the + and - inputs of the Op Amp. S3 in the DOWN position sets up a gain of 1 (RF1/R3 = 1)."], "jumps": []}, {"id": "P9150", "text": ["4.  Press Enter to set: Positive Supply Voltage to 15\n                                          Negative Supply Voltage to 15", "5. Press Enter to set: PC DC Power Switch - ON", "5. Press Enter to set: PC2 DC Power Switch - ON", "4. Press Enter to set: Positive Supply Voltage to 15 Negative Supply Voltage to 15"], "jumps": ["P9140"]}, {"id": "P9160", "text": ["5.  Press Enter to set: PC2 DC Power Switch - ON \n     The experiment card is now set up. Let's verify normal                     operation before beginning the troubleshooting practice.", "5. Press Enter to set: PC2 DC Power Switch - ON The experiment card is now set up. Let's verify normal operation before beginning the troubleshooting practice..............."], "jumps": []}, {"id": "P9170", "text": ["6.  Adjust R4 for +5 volts as measured at TP4. Use a multimeter or      oscilloscope.  \n7.  Adjust R1 for +3 volts as measured at TP3. Use a multimeter or      oscilloscope.  \n8.  Verify that TP4 still measures +5 volts.", "6. Adjust R4 for +5 volts as measured at TP4. Use a multimeter or oscilloscope. 7. Adjust R1 for +3 volts as measured at TP3. Use a multimeter or oscilloscope. 8. Verify that TP4 still measures +5 volts...."], "jumps": ["P9180"]}, {"id": "P9180", "text": ["9.  Measure the output voltage at TP9.\n      Is the voltage measured +2 volts \u00b110%?", "9. Measure the output voltage at TP9. Is the voltage measured +2 volts"], "jumps": ["P9170"]}, {"id": "P9181", "text": [], "jumps": []}, {"id": "P9182", "text": ["You should have measured +2 volts. The Op Amp is configured for a difference amplifier."], "jumps": []}, {"id": "P9190", "text": ["The Op Amp circuit is operating correctly.  The computer may now insert a fault into the circuit.  You must determine if the circuit is faulted and if so, what the fault is.", "The Op Amp circuit is operating correctly. The computer may now insert a fault into the circuit. You must determine if the circuit is faulted and if so, what the fault is."], "jumps": ["P9180"]}, {"id": "P11000", "text": ["The schematic is as shown. \n1.  Set PC130-54 switches S1 UP and S2 - S5 DOWN. \n2.  Adjust PC130-54 resistors R1 and R4 to mid range.", "The schematic is as shown. 1. Set PC130-54 switches S1 UP and S2 - S5 DOWN. 2. Adjust PC130-54 resistors R1 and R4 to mid range."], "jumps": ["P11010"]}, {"id": "P11010", "text": ["What is the configuration of this amplifier?", "What is the configuration of this amplifier?..............."], "jumps": ["P11000", "P11015"]}, {"id": "P11011", "text": [], "jumps": []}, {"id": "P11012", "text": ["The configuration could be non-inverting if R1 was adjusted to place a ground on R3."], "jumps": []}, {"id": "P11013", "text": ["Notice the position of S5, in the DOWN position. The configuration can only be non-inverting or difference."], "jumps": []}, {"id": "P11015", "text": ["CONFIGURATION - Notice the position of S5 and if one of the input resistors, R1 or R4, is adjusted to ground."], "jumps": []}, {"id": "P11020", "text": ["What is the gain of the difference amplifier configuration?"], "jumps": ["P11010", "P11025"]}, {"id": "P11021", "text": [], "jumps": []}, {"id": "P11022", "text": ["The gain is not 2. S3 is DOWN which puts R3 in the circuit. RF1 divided by R3 does not equal 2."], "jumps": []}, {"id": "P11023", "text": ["The gain is not 3. S3 is DOWN which puts R3 in the circuit. RF1 divided by R3 does not equal 3."], "jumps": []}, {"id": "P11025", "text": ["GAIN - Remember, the gain of a summing or difference amplifier is normally 1."], "jumps": ["P16040"]}, {"id": "P11030", "text": ["3.  Adjust R4 for a 5 volt measurement at TP4. \n4.  Adjust R1 for a 3 volt measurement at TP3.   \n5.  Verify that TP4 still measures 5 volts.", "3. Adjust R4 for a 5 volt measurement at TP4. 4. Adjust R1 for a 3 volt measurement at TP3. 5. Verify that TP4 still measures 5 volts. ternal program = 130E FLT 0 F2 03 S"], "jumps": ["P11020"]}, {"id": "P11040", "text": ["6.  Measure the output voltage at TP9. Is the difference amplifier         operating correctly within \u00b110%?", "6. Measure the output voltage at TP9. Is the difference amplifier operating correctly within"], "jumps": []}, {"id": "P11041", "text": [], "jumps": []}, {"id": "P11042", "text": ["If the difference amplifier was operating correctly, you would have measured +2V (5 V - 3 V)."], "jumps": []}, {"id": "P11050", "text": ["The difference amplifier is faulted. To start your troubleshooting process, first check to ensure the Op Amp is receiving the correct power input."], "jumps": ["P11060", "P11040"]}, {"id": "P11060", "text": ["7.  Measure the voltage at TP10 and TP11.\n     Are the input power voltages correct? \n     TP10: -15 V; TP11: +15 V", "7. Measure the voltage at TP10 and TP11. Are the input power voltages correct? TP10: -15 V; TP11: +15 V"], "jumps": ["P11050", "P11065"]}, {"id": "P11061", "text": [], "jumps": []}, {"id": "P11062", "text": ["The fault inserted does not effect the applied voltage, check your measurements."], "jumps": []}, {"id": "P11065", "text": ["MEASUREMENT SETUP - Carefully measure the output voltage at TP10 and TP11."], "jumps": []}, {"id": "P11070", "text": ["Since the operating voltages are correct, check to see if the inputs to the Op Amp are correct. You know that the output is incorrect."], "jumps": ["P11080", "P11060"]}, {"id": "P11080", "text": ["8.  Measure the voltages at TP5 and TP6.  You should measure           approximately +2.5 V. Remember, R6 and RF2 act as a voltage       divider.", "8. Measure the voltages at TP5 and TP6. You should measure approximately +2.5 V. Remember, R6 and RF2 act as a voltage divider."], "jumps": ["P11090", "P11070"]}, {"id": "P11090", "text": ["Are the voltages at TP5 and TP6 correct?", "Are the voltages at TP5 and TP6 correct?..................."], "jumps": ["P11080"]}, {"id": "P11091", "text": [], "jumps": []}, {"id": "P11092", "text": ["The +input of the Op Amp is not effected, check your measurements."], "jumps": []}, {"id": "P11100", "text": ["Now that you know that the Op Amp has the correct +input, check the -input."], "jumps": ["P11110", "P11090"]}, {"id": "P11110", "text": ["9.  Measure the voltage at TP8. For this circuit configuration, the        voltage at TP8 should be approximately 2.5 V.", "9. Measure the voltage at TP8. For this circuit configuration, the voltage at TP8 should be approximately 2.5 V."], "jumps": ["P11120", "P11100"]}, {"id": "P11120", "text": ["Is the voltage at TP8 correct?", "Is the voltage at TP8 correct?ped.........................."], "jumps": ["P11110"]}, {"id": "P11121", "text": [], "jumps": []}, {"id": "P11122", "text": ["The fault in the circuit effects the voltage at TP8, check your measurement."], "jumps": []}, {"id": "P11130", "text": ["You have discovered that the input voltage to the -input of IC1 is incorrect. Let's check to see where the fault is."], "jumps": ["P11140", "P11120"]}, {"id": "P11140", "text": ["10.  Measure the voltage at TP3. If you measure 0V, then the fault          is probably in R1 or the input voltage.", "10. Measure the voltage at TP3. If you measure 0V, then the fault is probably in R1 or the input voltage."], "jumps": ["P11150", "P11130"]}, {"id": "P11150", "text": ["Is R1 or the input voltage the fault?", "Is R1 or the input voltage the fault?......................"], "jumps": ["P11130"]}, {"id": "P11151", "text": [], "jumps": []}, {"id": "P11152", "text": ["You should have measured approximately 2.7 V. Voltage is present at TP3.  R1 or the input voltage is not the fault.", "You should have measured approximately 2.7 V. Voltage is present at TP3. R1 or the input voltage is not the fault."], "jumps": []}, {"id": "P11160", "text": ["Since there is a voltage at TP3, check R3.", "11. Press Enter to set: PC DC Power Switch - OFF", "11. Press Enter to set: PC2 DC Power Switch - OFF", "Since there is a voltage at TP3, check R3.................."], "jumps": ["P11150"]}, {"id": "P11170", "text": ["11.  Press Enter to set: PC2 DC Power Switch - OFF\n12.  Place S3 to UP.  This removes power for a resistance check.", "11. Press Enter to set: PC2 DC Power Switch - OFF 12. Place S3 to UP. This removes power for a resistance check..."], "jumps": ["P11160"]}, {"id": "P11180", "text": ["13.  Place an ohmmeter across R3, use the leads to the                           component. You are looking for an open that prevents                     voltage from reaching the -input of the Op Amp.  If R3 is not            open, then the fault is either IC1 or in the circuit between R3           and IC1.", "13. Place an ohmmeter across R3, use the leads to the component. You are looking for an open that prevents voltage from reaching the -input of the Op Amp. If R3 is not open, then the fault is either IC1 or in the circuit between R3 and IC1.."], "jumps": ["P11190"]}, {"id": "P11190", "text": ["What is the probable fault?", "What is the probable fault? typed.........................."], "jumps": ["P11180"]}, {"id": "P11191", "text": [], "jumps": []}, {"id": "P11192", "text": ["You should have measured 10 kW across R3. This does not indicate that R3 is open."], "jumps": []}, {"id": "P11200", "text": ["Your resistance measurement indicates that R3 is good.  The computer will now replace IC1. Remember, there could be a fault between R3 and IC1 in the wiring no matter how unlikely it may    seem.", "Your resistance measurement indicates that R3 is good. The computer will now replace IC1. Remember, there could be a fault between R3 and IC1 in the wiring no matter how unlikely it may seem......"], "jumps": ["P11190"]}, {"id": "P11210", "text": ["14.  Place S3 DOWN to return the circuit to a difference amplifier. \n15.  Press Enter to set: PC2 DC Power Switch - ON.\n16.  Ensure that TP3 and TP4 measure +3 V and +5 V                                 respectively. Adjust R1 and R4 if needed.", "14. Place S3 DOWN to return the circuit to a difference amplifier. 15. Press Enter to set: PC2 DC Power Switch - ON. 16. Ensure that TP3 and TP4 measure +3 V and +5 V respectively. Adjust R1 and R4 if needed. respectively. Adjust R1 and R4 if needed."], "jumps": []}, {"id": "P11220", "text": ["17.  Measure the output voltage at TP9. Is the difference amplifier         circuit operating correctly within \u00b110%?", "17. Measure the output voltage at TP9. Is the difference amplifier circuit operating correctly within"], "jumps": []}, {"id": "P11221", "text": [], "jumps": []}, {"id": "P11222", "text": ["You should have measured +2 V. This indicates that the difference amplifier is operating correctly (5 V - 3 V = +2 V)."], "jumps": []}, {"id": "P11230", "text": ["Congratulations! You correctly identified the fault in the Op Amp difference amplifier and verified normal operation."], "jumps": ["P11220"]}, {"id": "P13000", "text": ["The schematic is as shown. \n1.  Set PC130-54 switches S1 UP and S2 - S5 DOWN.\n2.  Adjust PC130-54 resistors R1 and R4 to mid range.", "The schematic is as shown. 1. Set PC130-54 switches S1 UP and S2 - S5 DOWN. 2. Adjust PC130-54 resistors R1 and R4 to mid range."], "jumps": ["P13010"]}, {"id": "P13010", "text": ["What type of operational amplifier circuit was configured?", "What type of operational amplifier circuit was configured?."], "jumps": ["P13000", "P13015"]}, {"id": "P13011", "text": [], "jumps": []}, {"id": "P13012", "text": ["The configuration could be non-inverting if R1 was adjusted to place a ground on R3."], "jumps": []}, {"id": "P13013", "text": ["Notice the position of S5, in the DOWN position. The configuration can only be non-inverting or difference."], "jumps": []}, {"id": "P13015", "text": ["CONFIGURATION - Notice the position of S5 and if one of the input resistors, R1 or R4, is adjusted to ground."], "jumps": []}, {"id": "P13020", "text": ["What is the gain of the difference amplifier configuration?"], "jumps": ["P13010", "P13025"]}, {"id": "P13021", "text": [], "jumps": []}, {"id": "P13022", "text": ["The gain is not 2. S3 is DOWN which puts R3 in the circuit. RF1 divided by R3 does not equal 2."], "jumps": []}, {"id": "P13023", "text": ["The gain is not 3. S3 is DOWN which puts R3 in the circuit. RF1 divided by R3 does not equal 3."], "jumps": []}, {"id": "P13025", "text": ["GAIN - Remember, the gain of a summing or difference amplifier is normally 1."], "jumps": []}, {"id": "P13030", "text": ["3.  Adjust R4 for a 5 volt measurement at TP4. \n4.  Adjust R1 for a 3 volt measurement at TP3. \n5.  Verify that TP4 still measures 5 volts.", "3. Adjust R4 for a 5 volt measurement at TP4. 4. Adjust R1 for a 3 volt measurement at TP3. 5. Verify that TP4 still measures 5 volts. External program = 130E FLT 0 F2 01 S"], "jumps": ["P13020"]}, {"id": "P13040", "text": ["6.  Measure the output voltage at TP9. Is the difference amplifier         operating correctly within \u00b110%?", "6. Measure the output voltage at TP9. Is the difference amplifier operating correctly within"], "jumps": []}, {"id": "P13041", "text": [], "jumps": []}, {"id": "P13042", "text": ["If the difference amplifier was operating correctly, you would have measured +2 V (5 V - 3 V)."], "jumps": []}, {"id": "P13050", "text": ["The difference amplifier is faulted. To start your troubleshooting process, first check that the Op Amp is receiving the correct power input."], "jumps": ["P13060", "P13040"]}, {"id": "P13060", "text": ["7.  Measure the voltage at TP10 and TP11.\n     Are the input power voltages correct?\n     TP10: -15 V; TP11: +15 V", "7. Measure the voltage at TP10 and TP11. Are the input power voltages correct? TP10: -15 V; TP11: +15 V"], "jumps": ["P13050", "P13065"]}, {"id": "P13061", "text": [], "jumps": []}, {"id": "P13062", "text": ["The fault inserted does not effect the applied voltage, check your measurements."], "jumps": []}, {"id": "P13065", "text": ["MEASUREMENT SETUP - Carefully measure the output voltage at TP10 and TP11."], "jumps": []}, {"id": "P13070", "text": ["Since the operating voltages are correct, check to see if the inputs to the Op Amp are correct. You know that the output is incorrect."], "jumps": ["P13080", "P13060"]}, {"id": "P13080", "text": ["8.  Measure the voltages at TP5 and TP6. You should measure            approximately +2.5 V. Remember, R6 and RF2 act as a\n     voltage divider that reduces the +input the same amount that         the -input was reduced.", "8. Measure the voltages at TP5 and TP6. You should measure approximately +2.5 V. Remember, R6 and RF2 act as a voltage divider that reduces the +input the same amount that the -input was reduced................"], "jumps": ["P13090", "P13070"]}, {"id": "P13090", "text": ["Are the voltages at TP5 and TP6 correct?", "Are the voltages at TP5 and TP6 correct?..................."], "jumps": ["P13080"]}, {"id": "P13091", "text": [], "jumps": []}, {"id": "P13092", "text": ["You should have measured 0V. Check your measurements at TP5 and TP6."], "jumps": []}, {"id": "P13100", "text": ["You have discovered that the input voltage to the +input of IC1 is incorrect. Let's check to see where the fault is."], "jumps": ["P13110", "P13090"]}, {"id": "P13110", "text": ["9.  Measure the voltage at TP4. If you measure 0 V, then the fault        is probably in R4 or the input voltage.", "9. Measure the voltage at TP4. If you measure 0 V, then the fault is probably in R4 or the input voltage."], "jumps": ["P13120", "P13100"]}, {"id": "P13120", "text": ["Is R4 or the input voltage the fault?", "Is R4 or the input voltage the fault?......................"], "jumps": ["P13110"]}, {"id": "P13121", "text": [], "jumps": []}, {"id": "P13122", "text": ["You should have measured approximately 4.5 V. Even though you adjusted R4 for +5 V, voltage is present at TP4. R4 or the input voltage is not the fault."], "jumps": []}, {"id": "P13130", "text": ["Since there is a voltage at TP4. The fault could be R6, RF2 or IC1.", "12. Press Enter to set: PC DC Power Switch - OFF", "12. Press Enter to set: PC2 DC Power Switch - OFF"], "jumps": ["P13120"]}, {"id": "P13140", "text": ["11.  Place S4 to UP. \n12.  Press Enter to set: PC2 DC Power Switch - OFF\n       This removes power for a resistance check and isolates R6            and RF2.", "11. Place S4 to UP. 12. Press Enter to set: PC2 DC Power Switch - OFF This removes power for a resistance check and isolates R6 and RF2............................"], "jumps": ["P13130"]}, {"id": "P13150", "text": ["13.  Place an ohmmeter across R6, use the leads to the                           component. You are looking for an open that would prevent           the voltage from reaching the +input of the Op Amp.", "13. Place an ohmmeter across R6, use the leads to the component. You are looking for an open that would prevent the voltage from reaching the +input of the Op Amp."], "jumps": ["P13160"]}, {"id": "P13160", "text": ["14.  Place an ohmmeter across RF2 (TP6 and TP7).  You are                   looking for a short that would ground the input.", "14. Place an ohmmeter across RF2 (TP6 and TP7). You are looking for a short that would ground the input."], "jumps": ["P13170", "P13150"]}, {"id": "P13170", "text": ["If R6 and RF2 are good, then the fault is in IC1. \nWhat is the probable fault?", "If R6 and RF2 are good, then the fault is in IC1. What is the probable fault??"], "jumps": ["P13150"]}, {"id": "P13171", "text": [], "jumps": []}, {"id": "P13172", "text": ["If R6 was open, it would measure infinity. You should have measured 10 kW."], "jumps": []}, {"id": "P13173", "text": ["Check the resistance measurements of R6 and RF2. R6 should measure 10 kW and RF2 should measure 0 W."], "jumps": []}, {"id": "P13180", "text": ["Your resistance measurement indicates that RF2 is shorted. The computer will now replace RF2. Remember, there could be fault between R6 and IC1 in the wiring no matter how unlikely it may seem.", "16. Press Enter to set: PC DC Power Switch - ON", "16. Press Enter to set: PC2 DC Power Switch - ON", "Your resistance measurement indicates that RF2 is shorted. The computer will now replace RF2. Remember, there could be fault between R6 and IC1 in the wiring no matter how unlikely it may seem..."], "jumps": ["P13170"]}, {"id": "P13190", "text": ["15.  Place S4 to DOWN to return the circuit to a difference                       amplifier. \n16.  Press Enter to set: PC2 DC Power Switch - ON", "15. Place S4 to DOWN to return the circuit to a difference amplifier. 16. Press Enter to set: PC2 DC Power Switch - ON"], "jumps": []}, {"id": "P13195", "text": ["17.  Ensure that TP3 and TP4 measure +3 V and +5 V                                 respectively. Adjust R1 and R4 if needed.", "17. Ensure that TP3 and TP4 measure +3 V and +5 V respectively. Adjust R1 and R4 if needed."], "jumps": []}, {"id": "P13200", "text": ["18.  Measure the output voltage at TP9. Is the difference amplifier          circuit operating correctly within \u00b110%?", "18. Measure the output voltage at TP9. Is the difference amplifier circuit operating correctly within"], "jumps": ["P13195"]}, {"id": "P13201", "text": [], "jumps": []}, {"id": "P13202", "text": ["You should have measured +2 V. This indicates that the difference amplifier is operating correctly (5 V - 3 V = +2 V)."], "jumps": []}, {"id": "P13210", "text": ["Congratulations! You correctly identified the fault in the Op Amp difference amplifier and verified normal operation."], "jumps": ["P13200"]}, {"id": "P14000", "text": ["The schematic is as shown.  \n1.  Set PC130-54 switches S1 and S5 UP and S2 - S4 DOWN.\n2.  Adjust PC130-54 resistors R1 and R4 to mid range.", "The schematic is as shown. 1. Set PC130-54 switches S1 and S5 UP and S2 - S4 DOWN. 2. Adjust PC130-54 resistors R1 and R4 to mid range."], "jumps": ["P14010"]}, {"id": "P14010", "text": ["What type of operational amplifier circuit was configured?", "What type of operational amplifier circuit was configured?."], "jumps": ["P14000", "P14015"]}, {"id": "P14011", "text": [], "jumps": []}, {"id": "P14012", "text": ["Notice the position of S5, in the UP position. The configuration can only be inverting or summing."], "jumps": []}, {"id": "P14013", "text": ["The configuration could be inverting if R4 was adjusted to place a ground on R6."], "jumps": []}, {"id": "P14015", "text": ["CONFIGURATION - Notice the position of S5 and if one of the input resistors, R1 or R4, is adjusted to ground."], "jumps": []}, {"id": "P14020", "text": ["What is the gain of the summing amplifier configuration?", "What is the gain of the summing amplifier configuration?..."], "jumps": ["P14010", "P14025"]}, {"id": "P14021", "text": [], "jumps": []}, {"id": "P14022", "text": ["The gain is not 2. S3 is DOWN which puts R3 in the circuit. RF1 divided by R3 does not equal 2."], "jumps": ["P13060"]}, {"id": "P14023", "text": ["The gain is not 3. S3 is DOWN which puts R3 in the circuit. RF1 divided by R3 does not equal 3."], "jumps": []}, {"id": "P14025", "text": ["GAIN - Remember, the gain of a summing or difference amplifier is normally 1."], "jumps": []}, {"id": "P14030", "text": ["3.  Adjust R4 for a 5 volt measurement at TP4. \n4.  Adjust R1 for a 3 volt measurement at TP3.  \n5.  Verify that TP4 still measures 5 volts.", "3. Adjust R4 for a 5 volt measurement at TP4. 4. Adjust R1 for a 3 volt measurement at TP3. 5. Verify that TP4 still measures 5 volts. External program = 130E FLT 0 F2 01 S"], "jumps": ["P14020"]}, {"id": "P14040", "text": ["6.  Measure the output voltage at TP9.  Is the summing amplifier         operating correctly within \u00b110%?", "6. Measure the output voltage at TP9. Is the summing amplifier operating correctly within"], "jumps": []}, {"id": "P14041", "text": [], "jumps": []}, {"id": "P14042", "text": ["If the summing amplifier was operating correctly, you would have measured -8 V (5 V + 3 V, inverted)."], "jumps": []}, {"id": "P14050", "text": ["The summing amplifier is faulted. To start your troubleshooting process, first check that the Op Amp is receiving the correct power input."], "jumps": ["P14060", "P14040"]}, {"id": "P14060", "text": ["7.  Measure the voltage at TP10 and TP11.\n     Are the input power voltages correct?\n     TP10: -15 V; TP11: +15 V", "7. Measure the voltage at TP10 and TP11. Are the input power voltages correct? TP10: -15 V; TP11: +15 V"], "jumps": ["P14050", "P14065"]}, {"id": "P14061", "text": [], "jumps": []}, {"id": "P14062", "text": ["The fault inserted does not effect the applied voltage, check your measurements."], "jumps": []}, {"id": "P14065", "text": [ C Power Switch - OFF.\n     This removes power for a resistance check.", "9. Press Enter to set: PC2 DC Power Switch - OFF. This removes power for a resistance check.."], "jumps": ["P14110"]}, {"id": "P14130", "text": ["10.  Place an ohmmeter across RF1 (TP8 and TP9). You are                     looking for an open that prevents the feedback voltage from          reaching the -input.", "10. Place an ohmmeter across RF1 (TP8 and TP9). You are looking for an open that prevents the feedback voltage from reaching the -input."], "jumps": ["P14150"]}, {"id": "P14150", "text": ["11.  Also, measure the resistance of TP9 to ground. You are                   looking for a short that would ground the output and                         feedback signal.", "11. Also, measure the resistance of TP9 to ground. You are looking for a short that would ground the output and feedback signal."], "jumps": ["P14130"]}, {"id": "P14160", "text": ["12.  Measure the resistance of TP8 to ground. You are looking for         a short that would ground the inverted input.", "12. Measure the resistance of TP8 to ground. You are looking for a short that would ground the inverted input...................................................................................................."], "jumps": ["P14130"]}, {"id": "P14170", "text": ["What does your measurement indicate?", "What does your measurement indicate??????????????????????????????????????????????????????????????????????????????????????????????????????????????"], "jumps": ["P14130"]}, {"id": "P14171", "text": [], "jumps": []}, {"id": "P14172", "text": ["Make sure you are measuring between TP8 and TP1.", "Make sure you are measuring between TP8 and TP1..............................................."], "jumps": []}, {"id": "P14173", "text": ["This measurement would be correct if measuring between TP8 and TP9.", "This measurement would be correct if measuring between TP8 and TP9..................................................................................................."], "jumps": []}, {"id": "P14176", "text": ["Your resistance measurement indicates that TP8 is shorted to ground. Since TP8 and the inverting input of IC1 are connected together either may be shorted to ground. The computer will now repair the fault.", "13. Press Enter to set: PC2 DC Power Switch - ON.", "13. Press Enter to set: PC DC Power Switch - ON."], "jumps": ["P14170"]}, {"id": "P14180", "text": ["13.  Press Enter to set: PC2 DC Power Switch - ON.\n14.  Ensure that TP3 and TP4 measure +3 V and +5 V                                 respectively.  Adjust R1 and R4 if needed.", "13. Press Enter to set: PC2 DC Power Switch - ON. 14. Ensure that TP3 and TP4 measure +3 V and +5 V respectively. Adjust R1 and R4 if needed.."], "jumps": []}, {"id": "P14190", "text": ["15.  Measure the output voltage at TP9. Is the summing amplifier          circuit operating correctly within \u00b110%?", "15. Measure the output voltage at TP9. Is the summing amplifier circuit operating correctly within"], "jumps": []}, {"id": "P14191", "text": [], "jumps": []}, {"id": "P14192", "text": ["You should have measured -8 V. This indicates that the summing amplifier is operating correctly (5 V + 3 V = -8 V, remember, the output is inverted)."], "jumps": []}, {"id": "P14200", "text": ["Congratulations! You correctly identified the fault in the Op Amp summing amplifier and verified normal operation."], "jumps": ["P14190"]}, {"id": "P15000", "text": ["The schematic is as shown. \n1.  Set PC130-54 switches S1 and S3 UP and S2, S4, and S5                DOWN. \n2.  Adjust PC130-54 resistors R1 fully CCW and R4 to mid range.", "The schematic is as shown. 1. Set PC130-54 switches S1 and S3 UP and S2, S4, and S5 DOWN. 2. Adjust PC130-54 resistors R1 fully CCW and R4 to mid range."], "jumps": ["P15010"]}, {"id": "P15010", "text": ["What is the configuration of this operation amplifier?", "What is the configuration of this operation amplifier?....."], "jumps": ["P15000", "P15015"]}, {"id": "P15011", "text": [], "jumps": []}, {"id": "P15012", "text": ["Notice the position of S5, in the DOWN position. The configuration can only be non-inverting or difference."], "jumps": []}, {"id": "P15013", "text": ["The configuration could be difference if R1 was not placed to ground."], "jumps": []}, {"id": "P15015", "text": ["CONFIGURATION - Notice the position of S5 and if one of the input resistors, R1 or R4, is adjusted to ground."], "jumps": []}, {"id": "P15020", "text": ["What is the gain of the non-inverting amplifier configuration?"], "jumps": ["P15010", "P15025"]}, {"id": "P15021", "text": [], "jumps": []}, {"id": "P15022", "text": ["The gain is not 1. S3 is UP which puts R2 in the circuit. RF1 divided by R2 plus 1 does not equal 1."], "jumps": []}, {"id": "P15023", "text": ["The gain is not 2. S3 is UP which puts R2 in the circuit. RF1 divided by R2 plus 1 does not equal 2."], "jumps": []}, {"id": "P15025", "text": ["GAIN - Remember, the gain of a non-inverting amplifier is RF/R + 1."], "jumps": []}, {"id": "P15030", "text": ["3.  Adjust R4 for a 4 volt measurement at TP6.  R4 is adjusted to a      specific voltage input at TP6 because R6 and RF2 act as a              voltage divider which are used for other circuit configurations.", "3. Adjust R4 for a 4 volt measurement at TP6. R4 is adjusted to a specific voltage input at TP6 because R6 and RF2 act as a voltage divider which are used for other circuit configurations.."], "jumps": ["P15040", "P15020"]}, {"id": "P15040", "text": ["4.  Measure the output voltage at TP9. Is the non-inverting                    amplifier operating correctly within \u00b110%?", "4. Measure the output voltage at TP9. Is the non-inverting amplifier operating correctly within"], "jumps": ["P15030"]}, {"id": "P15041", "text": [], "jumps": []}, {"id": "P15042", "text": ["Check your measurement at TP9 again, it is not +12 V.", "Check your measurement at TP9 again, it is not +12 V......."], "jumps": []}, {"id": "P15050", "text": ["The non-inverting amplifier is faulted. To start your troubleshooting process, first check that the Op Amp is receiving the correct power input."], "jumps": ["P15060"]}, {"id": "P15060", "text": ["5.  Measure the voltage at TP10 and TP11.  \n     Are the input power voltages correct? \n     TP10: -15 V; TP11: +15 V", "5. Measure the voltage at TP10 and TP11. Are the input power voltages correct? TP10: -15 V; TP11: +15 V"], "jumps": ["P15050", "P15065"]}, {"id": "P15061", "text": [], "jumps": []}, {"id": "P15062", "text": ["The fault inserted does not effect the applied voltage, check your measurements."], "jumps": []}, {"id": "P15065", "text": ["MEASUREMENT SETUP - Carefully measure the voltage at TP10 and TP11."], "jumps": []}, {"id": "P15070", "text": ["Since the operating voltages are correct, check to see if the input to the Op Amp is correct. You know that the output is incorrect."], "jumps": ["P15080", "P15060"]}, {"id": "P15080", "text": ["6.  Measure the voltages at TP5 and TP6. You should measure            approximately 4 V. Remember, you adjusted R4 for a                        measurement of 4 V at TP6, and TP5 is connected directly to          TP6.", "6. Measure the voltages at TP5 and TP6. You should measure approximately 4 V. Remember, you adjusted R4 for a measurement of 4 V at TP6, and TP5 is connected directly to TP6..."], "jumps": ["P15090", "P15070"]}, {"id": "P15090", "text": ["Are the voltages at TP5 and TP6 correct?", "Are the voltages at TP5 and TP6 correct?..................."], "jumps": ["P15080"]}, {"id": "P15091", "text": [], "jumps": []}, {"id": "P15092", "text": ["You should have measured 0 V.  Check your measurements at TP5 and TP6.", "You should have measured 0 V. Check your measurements at TP5 and TP6."], "jumps": []}, {"id": "P15100", "text": ["You have discovered that the input voltage to the +input of IC1 is incorrect.  Let's check to see where the fault is.", "You have discovered that the input voltage to the +inpu let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
