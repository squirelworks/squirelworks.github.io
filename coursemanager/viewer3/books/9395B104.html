<script>
const book = {"title": "9395B104", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: SINGLE SIDEBAND AND TRANSMISSION LINES asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Identify Single Sideband operating principle. w Identify the operation of a Single Sideband transmitter and receiver. .", "w Identify transmission line operating characteristics. w Identify the different types of transmission lines.............................."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["A highly efficient long range mode of voice communication is required by radio amateurs and commercial users."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Single sideband systems are more efficient than AM systems because a carrier signal is not transmitted."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["In this lesson you will see how the SSB is a more efficient means of signal processing.  Also, you will have an understanding of the different transmission lines available for transferring the signal from component to component.", "In this lesson you will see how the SSB is a more efficient means of signal processing. Also, you will have an understanding of the different transmission lines available for transferring the signal from component to component."], "jumps": ["P440", "P410"]}, {"id": "P440", "text": ["Let's begin the lesson on SINGLE SIDEBAND TRANSMISSION LINES................"], "jumps": ["P410"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Remember from previous lessons, the Amplitude Modulated signal contains the upper sideband, carrier and lower sideband."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Suppressing one sideband and the carrier before transmission of an Amplitude Modulated signal results in using half the spectrum space.  This process is called Single Sideband transmission.", "Suppressing one sideband and the carrier before transmission of an Amplitude Modulated signal results in using half the spectrum space. This process is called Single Sideband transmission."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["A Single Sideband system is very similar to an AM Modulated system.  However, Single Sideband offers the advantage of power efficiency, bandwidth efficiency and eliminates harmonic distortion.", "A Single Sideband system is very similar to an AM Modulated system. However, Single Sideband offers the advantage of power efficiency, bandwidth efficiency and eliminates harmonic distortion."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["As you know, a carrier signal must be present in the transmitter to produce the sidebands and the receiver needs the carrier to reproduce the original signal."], "jumps": ["P1060", "P1030"]}, {"id": "P1060", "text": ["However, the carrier signals for the transmitter and receiver do not have to be exactly the same carrier.  This allows the carrier to be suppressed at the transmitter.", "However, the carrier signals for the transmitter and receiver do not have to be exactly the same carrier. This allows the carrier to be suppressed at the transmitter."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["The receiver generates a replacement carrier signal so that the sideband and information may be heterodyned with the carrier."], "jumps": ["P1080", "P1060"]}, {"id": "P1072", "text": ["The receiver generates a replacement carrier signal so that the sideband and information may be heterodyned with the carrier."], "jumps": ["P1080", "P1060"]}, {"id": "P1075", "text": ["HETERODYNE - Having two different frequencies combined to generate a signal that has sum and difference frequencies.", "Audio signal 415 kHz Carrier signal +410 kHz Sum of the two 825 kHz 825 kHz", "Audio signal 415 kHz Carrier signal - 410 kHz Difference of the two 5 kHz"], "jumps": []}, {"id": "P1080", "text": ["In the transmitter, the input audio signal is amplified to the proper level by the audio amplifier and is directed to the Balanced    Modulator.", "In the transmitter, the input audio signal is amplified to the proper level by the audio amplifier and is directed to the Balanced Modulator."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["The balanced modulator uses non-linear circuits to suppress the carrier signal.  The Carrier signal is suppressed through what is   called phase cancellation.", "The balanced modulator uses non-linear circuits to suppress the carrier signal. The Carrier signal is suppressed through what is called phase cancellation."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["This means when the secondary voltage at T2 becomes positive, the four diodes become reversed biased."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["Current flows from audio input (T1) through T3 for the duration of the positive alternation of the carrier signal.  This results in an   audio signal output during the positive alternation.", "Current flows from audio input (T1) through T3 for the duration of the positive alternation of the carrier signal. This results in an audio signal output during the positive alternation."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["When the carrier signal shifts to the negative alteration, the diodes become forward biased and place a short across the primary of T3.  This results in a zero output or phase cancellation during the negative alternation.", "When the carrier signal shifts to the negative alteration, the diodes become forward biased and place a short across the primary of T3. This results in a zero output or phase cancellation during the negative alternation."], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["One complete cycle of the carrier signal has just been explained. However, the audio signal has not completed its full cycle."], "jumps": ["P1140", "P1100"]}, {"id": "P1140", "text": ["This sequence is continued until the audio signal has been fully processed.  When no audio signal is present, the output will always be a zero signal.", "This sequence is continued until the audio signal has been fully processed. When no audio signal is present, the output will always be a zero signal."], "jumps": ["P1150", "P1100"]}, {"id": "P1150", "text": ["The carrier signal is never allowed to flow through the primary of T3 and is suppressed in the Balanced Modulator."], "jumps": ["P1160", "P1100"]}, {"id": "P1160", "text": ["Now the upper and lower sidebands are the only output of the balance modulator to the systems bandpass filter."], "jumps": ["P1170", "P1100"]}, {"id": "P1170", "text": ["The bandpass filter will pass the selected band of frequencies (either the high sideband or the low sideband).  The unused sideband is then attenuated.", "The bandpass filter will pass the selected band of frequencies (either the high sideband or the low sideband). The unused sideband is then attenuated."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["Our example is passing the high sideband.   But the low sideband could have been passed with the high sideband attenuated.", "Our example is passing the high sideband. But the low sideband could have been passed with the high sideband attenuated."], "jumps": ["P1190", "P1160"]}, {"id": "P1190", "text": ["What component raises the upper and lower sidebands and suppresses the carrier?"], "jumps": ["P1180"]}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1192", "text": ["The Carrier Oscillator produces the RF carrier signal.", "The Carrier Oscillator produces the RF carrier signal........"], "jumps": []}, {"id": "P1193", "text": ["The Balance Modulator raises the upper and lower sidebands and suppresses the carrier signal."], "jumps": []}, {"id": "P1200", "text": ["The signal is now a single sideband. However, the signal is at a low frequency and needs to be at a higher frequency for transmission."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["A selected frequency is generated by the oscillator and mixed with the information signal in the mixer."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["Operation of the mixer is very similar to the modulator.  But the mixer has a completely different purpose than the modulator.", "Operation of the mixer is very similar to the modulator. But the mixer has a completely different purpose than the modulator."], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["The balance modulator intermodulates frequencies to carry information and the mixer is used to change the frequency of the information being carried.", "Modulator Carries Frequency Mixer Increases Frequencyyy - 410 kHz Difference of the two 5 kHz"], "jumps": ["P1240", "P1200"]}, {"id": "P1240", "text": ["Both the driver and the power amplifier are tuned linear amplifiers used to increase the transmission power level of the information signal."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["This ensures that the information is radiated by the system to produce the required electromagnetic wave for the receiver to detect."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["At what point is the single sideband present in the transmitter section?", "At what point is the single sideband present in the transmitter section? $Incorrect1: Balanced Modulator Output"], "jumps": ["P1240"]}, {"id": "P1261", "text": [], "jumps": []}, {"id": "P1262", "text": ["The Balance Modulator raises the upper and lower sidebands and suppresses the carrier signal.  The input is the original information signal amplified.", "The Balance Modulator raises the upper and lower sidebands and suppresses the carrier signal. The input is the original information signal amplified."], "jumps": ["P1260"]}, {"id": "P1270", "text": ["An AM transmitter uses 1/3 of the total power for both sidebands. Or 1/6 of the total power per sideband.  This means the other 2/3 of the total power is used for the carrier.", "An AM transmitter uses 1/3 of the total power for both sidebands. Or 1/6 of the total power per sideband. This means the other 2/3 of the total power is used for the carrier.", "100 watts Carrier 25 watts Sideband + 25 watts Sideband 150 watts Total Power"], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["Because the single sideband system supresses the carrier and one sideband.  The transmitter uses only 1/6 of the total power of the AM transmitter for the same information signal.", "Because the single sideband system supresses the carrier and one sideband. The transmitter uses only 1/6 of the total power of the AM transmitter for the same information signal.", "150 watts Total Power 100 watts Carrier - 25 watts Sideband 25 watts Single Sidebandd"], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["Since the Single Sideband signal is narrow compared to an AM signal, the Single Sideband receiver uses an RF Amplifier to amplify the received signal."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["The RF Amplifier also sets the receivers sensitivity and keeps the frequency converter from radiating signals back through the receiving antenna."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["Since the signal's frequency was increased for transmission, the frequency converter lowers the signal to an intermediate frequency (IF)."], "jumps": ["P1320", "P1290"]}, {"id": "P1320", "text": ["The IF Amplifier provides most of the receiver's gain and maintains the optimum bandwidth.  This helps preserve the original modulated information.", "The IF Amplifier provides most of the receiver's gain and maintains the optimum bandwidth. This helps preserve the original modulated information."], "jumps": ["P1330", "P1290"]}, {"id": "P1330", "text": ["Unlike the RF Amplifier, the IF Amplifier operates at a lower fixed frequency."], "jumps": ["P1340", "P1290"]}, {"id": "P1340", "text": ["At this point the information is still located on the one sideband. In the AM receiver a demodulator was used to recreate the orignal audio signal from the two sidebands and carrier."], "jumps": ["P1350", "P1290"]}, {"id": "P1350", "text": ["Our signal is only on one sideband minus the carrier.  So a Product Demodulator is used to recreate the original audio signal from the single sideband.", "Our signal is only on one sideband minus the carrier. So a Product Demodulator is used to recreate the original audio signal from the single sideband."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["The Product Demodulator heterodyned the oscillator's carrier signal to the information signal from the IF amplifier."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["When these two signals are heterodyned together the product demodulator produces four signals.", "When these two signals are heterodyned together the product demodulator produces four signals. (Graphics Text)1. Original Transmitted Signal 2. Oscillator's Generated Carrier Signal 3. Sum of the Two Signals 4. Difference of the Two Signals (Origianl Audio)", "1. Original Transmitted Signal 2. Oscillator's Generated Carrier Signal 3. Sum of the Two Signals 4. Difference of the Two Signals (Original Audio)"], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["The sidebands and carrier are filtered out leaving the audio to be amplified and delivered to a speaker."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["What part of the receiver converts the received frequency to a lower IF?"], "jumps": ["P1380"]}, {"id": "P1391", "text": [], "jumps": []}, {"id": "P1392", "text": ["The IF Amplifier provides most of the receiver's gain and does not convert frequency to a lower IF."], "jumps": []}, {"id": "P1393", "text": ["The Product Demodulator recovers the information signal and does not convert the frequency to a lower IF."], "jumps": []}, {"id": "P1400", "text": ["Which part of the receiver produces the carrier signal so that it can be heterodyned with the single sideband?"], "jumps": ["P1390"]}, {"id": "P1401", "text": [], "jumps": []}, {"id": "P1402", "text": ["The IF Amplifier provides most of the receiver's gain and does not produce the carrier signal."], "jumps": []}, {"id": "P1403", "text": ["The Product Demodulator recovers the information signal and does not produce the carrier signal."], "jumps": []}, {"id": "P1410", "text": ["As you can see the single sideband occupies only half the bandwidth of the AM system.  That means the system has only half of the interference of an AM system.", "As you can see the single sideband occupies only half the bandwidth of the AM system. That means the system has only half of the interference of an AM system."], "jumps": ["P1910", "P1400"]}, {"id": "P1910", "text": ["This completes the information on SINGLE SIDEBAND TRANSMISSION."], "jumps": ["P1001", "P1410"]}, {"id": "P1920", "text": ["1.  Suppressing one sideband and the carrier before                              transmission of an Amplitude Modulated signal results in                using half the spectrum space.  This process is called Single         Sideband transmission.", "1. Suppressing one sideband and the carrier before transmission of an Amplitude Modulated signal results in using half the spectrum space. This process is called Single Sideband transmission."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  The balanced modulator uses non-linear circuits to suppress         the carrier signal.  The Carrier signal is suppressed through           what is called phase cancellation.", "2. The balanced modulator uses non-linear circuits to suppress the carrier signal. The Carrier signal is suppressed through what is called phase cancellation."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The balance modulator intermodulates frequencies to carry           information.  While, the mixer is used to change the                           frequency of  the information being carried.", "3. The balance modulator intermodulates frequencies to carry information. While, the mixer is used to change the frequency of the information being carried.", "Modulator Carries Frequency Mixer Increases Frequency rated Carrier Signal 3. Sum of the Two Signals 4. Difference of the Two Signals (Origianal Audio)"], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  When suppressing the carrier and one sideband, the                         transmitter uses only 1/6 of the total power of the AM                        transmitter for the same information signal.", "4. When suppressing the carrier and one sideband, the transmitter uses only 1/6 of the total power of the AM transmitter for the same information signal.", "150 watts Total Power 100 watts Carrier - 25 watts Sideband 25 watts Single Sidebandd"], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  The IF Amplifier provides most of the receiver's gain and                  maintains the optimum bandwidth.  This helps preserve the            original modulated information.", "5. The IF Amplifier provides most of the receiver's gain and maintains the optimum bandwidth. This helps preserve the original modulated information."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  The Product Demodulator is used to recreate the original                audio signal from the single sideband.  The product                          Demodulator heterodynes the oscillator carrier signal to the           information signal received from the IF amplifier.", "6. The Product Demodulator is used to recreate the original audio signal from the single sideband. The product Demodulator heterodynes the oscillator carrier signal to the information signal received from the IF amplifier."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7.  The single sideband occupies only half the bandwidth of the         AM system.  That means the system has only half the                        interference an AM system has.", "7. The single sideband occupies only half the bandwidth of the AM system. That means the system has only half the interference an AM system has."], "jumps": ["P1999", "P1960"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["AM, FM or SSB signal processing systems send electrical pulses or signals from component to component."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["The physical structure that will guide the signal (electromagnetic waves) from place to place is defined as a  transmission line.", "The physical structure that will guide the signal (electromagnetic waves) from place to place is defined as a transmission line."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["Transmission lines are conductors or a series of conductors used to form a continuous path from component to component."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["Lines used to connect your television set to an antenna or a cable service are transmission lines."], "jumps": ["P2060", "P2020"]}, {"id": "P2060", "text": ["The optimum transmission line is one that provides maximum transfer with minimum loss due to the properties of the line.", "The optimum transmission line is one that provides maximum transfer with minimum loss due to the properties of the line. raphics Text)Line Properties Resistive Loss Induction Loss Radiation Loss Capacitive Loss", "Resistive Loss Induction Loss Radiation Loss Capacitive Loss gnal 3. Sum of the Two Signals 4. Difference of the Two Signals (Origianal Audio)", "Line Properties tion Loss Radiation Loss Capacitive Loss gnal 3. Sum of the Two Signals 4. Difference of the Two Signals (Origianal Audio)"], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["Whenever a conductor transfers energy, the natural resistance of the conductor causes a power loss."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["If the line is of any considerable length, this could be a large amount of power loss.  This type of loss is referred to as copper loss.", "If the line is of any considerable length, this could be a large amount of power loss. This type of loss is referred to as copper loss."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["High frequency current has a tendency to flow to the outside of the conductor.  This is called skin effect.", "High frequency current has a tendency to flow to the outside of the conductor. This is called skin effect."], "jumps": ["P2100", "P2070"]}, {"id": "P2100", "text": ["As frequency increases the depth of penetration into the conductive surface decreases.  The magnetic flux surrounding each moving electron encounters more resistances towards the center of the conductor.", "As frequency increases the depth of penetration into the conductive surface decreases. The magnetic flux surrounding each moving electron encounters more resistances towards the center of the conductor."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["This reduces the effective cross section of the conductor. Meaning the size of the useful part of the conductor is reduced."], "jumps": ["P2120", "P2090"]}, {"id": "P2120", "text": ["Depth of penetration of the current is defined as skin depth.   Skin depth is the distance into the conducting medium for which current is reduced.", "Depth of penetration of the current is defined as skin depth. Skin depth is the distance into the conducting medium for which current is reduced."], "jumps": ["P2130", "P2090"]}, {"id": "P2130", "text": ["One way to reduce the loss is to increase the surface area of the conductor.", "One way to reduce the loss is to increase the surface area of the conductor. he conductor."], "jumps": ["P2140", "P2090"]}, {"id": "P2140", "text": ["This is why in higher frequency applications a waveguide (hollow conductor) is more effective than a standard wire or cable type conductors for transmission lines."], "jumps": ["P2150", "P2090"]}, {"id": "P2150", "text": ["The second property of transmission lines is induction loss."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["Electromagnetic waves are made of electric fields associated with voltage and magnetic fields associated with current flow."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["When the magnetic field expands and collapses it induces voltage and current into conducting material near the transmission lines; resulting in a power loss to nearby items. This type of loss is called induction."], "jumps": ["P2180", "P2150"]}, {"id": "P2180", "text": ["One method used to reduce the induction loss is to use standoff insulators between the transmission line and other surfaces.         Standoff insulators are used on common television antenna wires.", "One method used to reduce the induction loss is to use standoff insulators between the transmission line and other surfaces. Standoff insulators are used on common television antenna wires."], "jumps": ["P2190", "P2150"]}, {"id": "P2190", "text": ["Radiation loss is similar to induction loss.  However, the loss is to the atmosphere and not to a nearby object.  This type of loss is desirable in an antenna, but undesirable in a transmission line.", "Radiation loss is similar to induction loss. However, the loss is to the atmosphere and not to a nearby object. This type of loss is desirable in an antenna, but undesirable in a transmission line."], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["In both induction and radiation, expanding and collapsing the flux field at even faster rates tends to increase the number of flux lines which never return to the inductor."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["Placing a shield around the conductor of the transmission line prevents interaction with other circuits.  This type of shielding     reduces the radiation and induction losses.", "Placing a shield around the conductor of the transmission line prevents interaction with other circuits. This type of shielding reduces the radiation and induction losses."], "jumps": ["P2220", "P2190"]}, {"id": "P2220", "text": ["On a two wire transmission line, the insulation is the dielectric for the capacitance of the line.   Charged and discharged, the          electrons of the dielectric (insulation) continuously change.", "On a two wire transmission line, the insulation is the dielectric for the capacitance of the line. Charged and discharged, the electrons of the dielectric (insulation) continuously change."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["This type of energy loss is called capacitive loss and is normally in the form of heat dissipation."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["The loss is held to a minimum with the use of high resistance dielectric (insulation)."], "jumps": ["P2250", "P2220"]}, {"id": "P2250", "text": ["Capacitive loss appears as a resistive loss to the power source and increases as the frequency is increased."], "jumps": ["P2260", "P2220"]}, {"id": "P2260", "text": ["What type of power loss is caused by expanding and collapsing magnetic fields inducing a voltage and current into surfaces near the transmission line?"], "jumps": ["P2220"]}, {"id": "P2261", "text": [], "jumps": []}, {"id": "P2262", "text": ["Skin effect is a power loss caused by high frequency currents that flow away from the center of the conductor."], "jumps": []}, {"id": "P2263", "text": ["Copper loss is a decrease in power due to the conductors resistance, especially noticed in long lines."], "jumps": []}, {"id": "P2270", "text": ["What type of power loss is due to high frequency currents flowing near the outer surface of the conductor?"], "jumps": ["P2260"]}, {"id": "P2271", "text": [], "jumps": []}, {"id": "P2272", "text": ["Induction loss is a decrease in power caused by expanding and collapsing magnetic fields which induce voltage and current in other nearby surfaces.", "Induction loss is a decrease in power caused by expanding and collapsing magnetic fields which induce voltage and current in other nearby surfaces..."], "jumps": []}, {"id": "P2273", "text": ["Copper loss is a decrease in power due to the conductors resistance, especially noticed in long lines."], "jumps": []}, {"id": "P2280", "text": ["There are several factors to consider when selecting a transmission line.  For example; the breakdown voltage, power loss at the required frequency, stability of dielectric, flexibility and cost.", "There are several factors to consider when selecting a transmission line. For example; the breakdown voltage, power loss at the required frequency, stability of dielectric, flexibility and cost."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["There are many different types of transmission lines used today. In this lesson will discuss four of the most used types."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["Anyone who has had cable television service has used a flexible coaxial cable.  This type of transmission line is most commonly used in radio, television, microwave and radar services.", "Anyone who has had cable television service has used a flexible coaxial cable. This type of transmission line is most commonly used in radio, television, microwave and radar services."], "jumps": ["P2310", "P2280"]}, {"id": "P2310", "text": ["The center wire is the conductor and is usually solid.  The outer conductor is braided.", "The center wire is the conductor and is usually solid. The outer conductor is braided."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["The two conductors are separated by a polyethylene plastic."], "jumps": ["P2330", "P2300"]}, {"id": "P2330", "text": ["This type of transmission line has very little radiation loss because the inner conductor is shielded by the outer conductor."], "jumps": ["P2340", "P2300"]}, {"id": "P2340", "text": ["This cable is capable of transferring large amounts of power at high frequencies with only small amounts of skin effect and dielectric loss."], "jumps": ["P2350", "P2300"]}, {"id": "P2350", "text": ["Another type of coaxial cable is the rigid coaxial.  Just like the flexible coaxial cable, there is a center and an outer conductor.", "Another type of coaxial cable is the rigid coaxial. Just like the flexible coaxial cable, there is a center and an outer conductor."], "jumps": ["P2360", "P2300"]}, {"id": "P2360", "text": ["However, the outer conductor is a rigid metal tube and has insulating disks to separate the center from the outer conductor."], "jumps": ["P2370", "P2350"]}, {"id": "P2370", "text": ["Similar to the flexible coaxial cable, the rigid coaxial has little radiation loss and is used for large power and frequencies up to 3 GHz."], "jumps": ["P2380", "P2350"]}, {"id": "P2380", "text": ["Another commonly used cable is the twin lead line.  This cable is used widely for television reception.", "Another commonly used cable is the twin lead line. This cable is used widely for television reception."], "jumps": ["P2390", "P2350"]}, {"id": "P2390", "text": ["The twin lead line consists of two conductors molded into the edges of a polyethylene strip or ribbon.  The polyethylene is solid enough to keep the conductors separated.", "The twin lead line consists of two conductors molded into the edges of a polyethylene strip or ribbon. The polyethylene is solid enough to keep the conductors separated."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["This line is still flexible enough to bend around corners.", "This line is still flexible enough to bend around corners.."], "jumps": ["P2410", "P2380"]}, {"id": "P2410", "text": ["Because of the small size and distance between the two conductors, the twin lead is used for transmission of low power frequencies up to 200 MHz."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["Another type of line can be used for low power transmissions besides the twin lead.  It is the Open Two Wire line.  It has two bare conductors spaced by insulators.  The insulators maintain an even space between the wires.", "Another type of line can be used for low power transmissions besides the twin lead. It is the Open Two Wire line. It has two bare conductors spaced by insulators. The insulators maintain an even space between the wires."], "jumps": ["P2430", "P2400"]}, {"id": "P2430", "text": ["There are three factors that determine the distance between the two conductors of a open two wire line.", "Diameter of the conductor Frequency transmitted Characteristic impedance required"], "jumps": ["P2440", "P2420"]}, {"id": "P2440", "text": ["Due to the fact that the conductors are bare with no shielding, the major power loss is due to radiation loss."], "jumps": ["P2450", "P2430"]}, {"id": "P2450", "text": ["The simplest and less expensive transmission line is the twisted pair.  Most commonly used for telephone circuits, household appliance and other low frequency purposes.", "The simplest and less expensive transmission line is the twisted pair. Most commonly used for telephone circuits, household appliance and other low frequency purposes."], "jumps": ["P2460", "P2430"]}, {"id": "P2460", "text": ["The twisting of the two wires equalizes the effect of stray fields on both conductors.  This type of cable is also used for low voltage and low frequency transmission.", "The twisting of the two wires equalizes the effect of stray fields on both conductors. This type of cable is also used for low voltage and low frequency transmission."], "jumps": ["P2470", "P2450"]}, {"id": "P2470", "text": ["What type of transmission line has two conductors molded into the edges of a polyethylene strip or ribbon and is used for frequencies up to 200 MHz?"], "jumps": ["P2450"]}, {"id": "P2471", "text": [], "jumps": []}, {"id": "P2472", "text": ["Flexible Coaxial has a solid center conductor and a braided outer conductor.  This type of line is used for large power and high frequency.", "Flexible Coaxial has a solid center conductor and a braided outer conductor. This type of line is used for large power and high frequency."], "jumps": []}, {"id": "P2473", "text": ["Open two-wire has two bare wire conductors with spacers to maintain an even space between the two."], "jumps": []}, {"id": "P2480", "text": ["The amount of capacitance is determined by the size of the conductor (s), type of dielectric material (e) and the distance between the conductors (d).", "Log = mF/1000 ft. C = 19.43 x e", "Log = mF/mile e of the Two Signals (Origianal Audio)"], "jumps": ["P2490", "P2470"]}, {"id": "P2490", "text": ["The opposition to alternating current due to the capacitance of the line is called characteristic impedance.", "Log = mF / 1000 ft. C = 3.68 x e", "Log = mF / mile ft. e of the Two Signals (Origianal Audio)"], "jumps": ["P2500", "P2480"]}, {"id": "P2500", "text": ["Characteristic impedance (Zo) can be calculated using the values for inductance (L) and capacitance (C).", "Log = mF / 1000 ft. C = 3.68 x e", "Log = mF / mile ft. e of the Two Signals (Origianal Audio)"], "jumps": ["P2510", "P2490"]}, {"id": "P2510", "text": ["A transmission line can be measured in length electrically and physically."], "jumps": ["P2520", "P2490"]}, {"id": "P2520", "text": ["Electrical length is a comparison of physical length and wavelength.  Wavelength is the distance the energy travels down the line during one cycle.", "Electrical length is a comparison of physical length and wavelength. Wavelength is the distance the energy travels down the line during one cycle."], "jumps": ["P2530", "P2510"]}, {"id": "P2530", "text": ["To determine electrical length you must understand frequency wavelength.  RF (radio frequency) signals travel at the speed of   light, 186,000 miles per second.", "To determine electrical length you must understand frequency wavelength. RF (radio frequency) signals travel at the speed of light, 186,000 miles per second."], "jumps": ["P2540", "P2520"]}, {"id": "P2540", "text": ["However, the transmission line has inductance and shunt capacitance.  This slows the RF signal down.", "However, the transmission line has inductance and shunt capacitance. This slows the RF signal down."], "jumps": ["P2550", "P2520"]}, {"id": "P2550", "text": ["Because different types of lines have different characteristics the effect they have on RF signal speed (velocity) is different."], "jumps": ["P2560", "P2520"]}, {"id": "P2560", "text": ["To determine the frequency wavelength of a 60 MHz signal through a twisted pair line that is rated at 60% speed of light, divide the velocity by the frequency.", "Wavelength ( l) = = 3 meters (180 million = 60% of speed of light)"], "jumps": ["P2570", "P2550"]}, {"id": "P2570", "text": ["Now that we have the frequency length, the electrical length can be determined.  Divide the physical length by the frequency length will result in the electrical length.", "Now that we have the frequency length, the electrical length can be determined. Divide the physical length by the frequency length will result in the electrical length.", "Electrical Length = 5 Wavelengths = 3 Meters (180 million = 60% of speed of light)"], "jumps": ["P2580", "P2560"]}, {"id": "P2580", "text": ["As you can see the type of transmission line used plays an important role in signal transmission and reception.  Remember that all line characteristics need to be considered for good communication.", "As you can see the type of transmission line used plays an important role in signal transmission and reception. Remember that all line characteristics need to be considered for good communication."], "jumps": ["P2910", "P2570"]}, {"id": "P2910", "text": ["This completes the information on TRANSMISSION LINES.", "This completes the information on TRANSMISSION LINES......."], "jumps": ["P2001", "P2580"]}, {"id": "P2920", "text": ["1.  The optimum transmission line is one that provides maximum        transfer with minimum loss due to the properties of the line.", "1. The optimum transmission line is one that provides maximum transfer with minimum loss due to the properties of the line.", "Resistive Loss Induction Loss Radiation Loss Capacitive Loss = 3 Meters (180 million = 60% of speed of light)", "Transmission Line Properties (180 million = 60% of speed of light)"], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2.  There are several factors to consider when selecting a                      transmission line.  For example; the breakdown voltage,                  power loss at the required frequency, stability of dielectric,             flexibility and cost.", "2. There are several factors to consider when selecting a transmission line. For example; the breakdown voltage, power loss at the required frequency, stability of dielectric, flexibility and cost."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3.  Since all lines are not the same in characteristic values, the            velocity of the signal is different for the different types of                 lines.", "3. Since all lines are not the same in characteristic values, the velocity of the signal is different for the different types of lines."], "jumps": ["P2950", "P2930"]}, {"id": "P2950", "text": ["4.  To determine the frequency wavelength of a 60 MHz signal              through a twisted pair line that is rated at 60% speed of light,         divide the velocity by the frequency.", "4. To determine the frequency wavelength of a 60 MHz signal through a twisted pair line that is rated at 60% speed of light, divide the velocity by the frequency.", "Wavelength ( l) = = 3 meters (180 million = 60% of speed of light)"], "jumps": ["P2999", "P2940"]}, {"id": "P2999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2950"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
