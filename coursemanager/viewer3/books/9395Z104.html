the carburetor float chamber and float valve?", "Throttles the fuel and controls engine speed.", "Controls fuel to air mixture in the carburetor.", "Supply fuel to the engine during idle speed. W"], "jumps": []}, {"id": "P10234", "text": ["What are the three main types of selector valves used?"], "jumps": []}, {"id": "P10233", "text": ["What type of pump has two reverse acting chambers?"], "jumps": []}, {"id": "P10232", "text": ["What type of pump is the auxiliary pump (booster pump)?"], "jumps": []}, {"id": "P10231", "text": ["What prevents the fuel from splashing around and rapid shifting from side to side in the fuel tanks?"], "jumps": []}, {"id": "P10230", "text": ["Where in the fuel system, would moisture be expected to be trapped?"], "jumps": []}, {"id": "P10229", "text": ["What is the purpose of the relief valve located in the fuel pump casing?"], "jumps": []}, {"id": "P10228", "text": ["What pump is classified as positive displacement pump?"], "jumps": []}, {"id": "P10227", "text": ["What will mix the gasoline with the right amount of air and atomize the mixture?"], "jumps": []}, {"id": "P10226", "text": ["What will supply fuel pressure if the fuel pump failures on a pump type system?"], "jumps": []}, {"id": "P10225", "text": ["What component will provide the pump type fuel system with a constant supply pressure during operation?"], "jumps": []}, {"id": "P10224", "text": ["What will mix the gasoline with the right amount of air and atomize the mixture?"], "jumps": []}, {"id": "P10223", "text": ["The fuel primer pump feeds fuel to how many primer nozzles?"], "jumps": []}, {"id": "P10222", "text": ["What does the pilot use to select which fuel tank is on service?"], "jumps": []}, {"id": "P10221", "text": ["A pump type fuel system is normally used on what type of aircraft?"], "jumps": []}, {"id": "P10220", "text": ["A gravity type fuel system is normally used on what type of aircraft?"], "jumps": []}, {"id": "P10219", "text": ["What is indicated when a cloudy fuel sample is allowed to settle and the cloudiness starts to clear at the top of the sample?"], "jumps": []}, {"id": "P10218", "text": ["What is the difference between the fuels JET A and JET A-1?", "JET A-1 operates at a lower temperature."], "jumps": []}, {"id": "P10217", "text": ["What type of fuel is a blend of aviation gasoline and aviation kerosene?"], "jumps": []}, {"id": "P10216", "text": ["What is the purpose of color coding aviation gasoline?"], "jumps": []}, {"id": "P10215", "text": ["What is in the fuel sample, if a black or red powder like substance is viable?"], "jumps": []}, {"id": "P10214", "text": ["Why is the octane additive Tetraethly Lead (TEL) limited to 6 ml per gallon of gasoline?"], "jumps": []}, {"id": "P10213", "text": ["The ability of the fuel to withstand compression in the engine cylinder before detonating is known as the _______"], "jumps": []}, {"id": "P10212", "text": [], "jumps": []}, {"id": "P10211", "text": ["ne are not used in aircraft engine, because they will form excessive", "Lower grades of gasoline are not used in aircraft engine, because they will form excessive _______"], "jumps": []}, {"id": "P10210", "text": ["Volatile is the classification of which of the following fuels?"], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P100", "text": ["w Describe the Gravity Type Fuel System. * Describe the Pump Type Fuel System.", "w Describe the characteristics and properties of aviation fuels. w Identify the effects of fuel contamination.", "w Describe the operational characteristics of the fuel system components. w Describe the operation of a carburetor. w Describe the operation of fuel injection."], "jumps": []}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P1180", "text": ["The color of AVGAS can assist in determining the quality of fuel. Color changes generally indicate a chemical reaction with another substance.  For example, a new rubber fuel hose may be treated with a preservative and will cause the gas to change color.", "The color of AVGAS can assist in determining the quality of fuel. Color changes generally indicate a chemical reaction with another substance. For example, a new rubber fuel hose may be treated with a preservative and will cause the gas to change color."], "jumps": ["P1190", "P1170"]}, {"id": "P1230", "text": ["Rust appears as red or black powder, sand as glass or crystal, aluminum compounds as white/gray powder or paste, brass as gold colored dust, and rubber as irregular dark bits."], "jumps": ["P1240", "P1220"]}, {"id": "P3970", "text": ["6.  Today's aircraft use poppet and disk type selector valves to            control fuel flow.", "7.  The pilot can control engine speed with the throttle valve                 located in the carburetor's venturi.  The throttle valve is a                plate that is used to block or restrict air flow.", "The float valve controls the fuel to the carburetor, to prevent flooding the engine with fuel.", "The fuel mixture valve will control the air to fuel ratio for the optimum engine performance.", "6. Today's aircraft use poppet and disk type selector valves to control fuel flow.", "7. The pilot can control engine speed with the throttle valve located in the carburetor's venturi. The throttle valve is a plate that is used to block or restrict air flow."], "jumps": ["P3980", "P3960", "P3990", "P3970", "Pl", "P", "Pp"]}, {"id": "P410", "text": ["The fuel system ensures positive and reliable fuel flows throughout altitude changes, quick maneuvers and sudden acceleration and deceleration.  Also, fuel systems must operate during changes in ground and in-flight climate conditions.", "The fuel system ensures positive and reliable fuel flows throughout altitude changes, quick maneuvers and sudden acceleration and deceleration. Also, fuel systems must operate during changes in ground and in-flight climate conditions."], "jumps": ["P420", "P400"]}, {"id": "P3690", "text": ["As soon as the manifold valve opens the fuel line pressure drops causing the valve to close and stop the flow to the cylinder         injector nozzles.", "As soon as the manifold valve opens the fuel line pressure drops causing the valve to close and stop the flow to the cylinder injector nozzles."], "jumps": ["P3700", "P3630"]}, {"id": "P3700", "text": ["The injector nozzles are located at each cylinder of the engine. They spray a fine mist of fuel as air is simultaneously drawn into    the cylinder.  The air atomizes the fuel to enable combustion.", "The injector nozzles are located at each cylinder of the engine. They spray a fine mist of fuel as air is simultaneously drawn into the cylinder. The air atomizes the fuel to enable combustion."], "jumps": ["P3910", "P3630"]}, {"id": "P3910", "text": ["This completes the information on FUEL SYSTEM OPERATIONS.", "This completes the information on FUEL SYSTEM OPERATIONS..."], "jumps": ["P3001", "P3630"]}, {"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 02-21-00 Changed copyright date on page Q0 to 1999-2000. Penny 03-09-00 Changed the red mat on the main window viewer to blue. Changed the high yellow word in text field of definition page to blue, Q1055. Added a 4 distractor touch area question page, Q1240. - Penny 03-28-00 Converted from SAM to toolbook. frieda 04-04-00 Text and Branching. frieda 04-12-00 Graphics. doan 07-14-00 Converted to ToolBook 7.1 format. jay 09-26-00 Reviewed - lisa 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-12-02 review - rs"], "jumps": []}, {"id": "P3920", "text": ["1.  The bottom of the tank slopes into a small chamber called the       sump.  This design allows sediments and moisture to settle at       one central point.", "1. The bottom of the tank slopes into a small chamber called the sump. This design allows sediments and moisture to settle at one central point."], "jumps": ["P3930", "P3001"]}, {"id": "P3930", "text": ["2.  Because the filter is at a low point of the system, it traps small       amounts of water in the system that can be removed when             cleaning the Screen basket.", "2. Because the filter is at a low point of the system, it traps small amounts of water in the system that can be removed when cleaning the Screen basket."], "jumps": ["P3940", "P3920"]}, {"id": "P3940", "text": ["3.  The main fuel pump is a rotary vane positive displacement             pump.  The shaft rotates inside the oval housing.  The vanes          extend outward towards the housing and scoops the fuel               from the inlet side and pushes it towards the discharge.", "3. The main fuel pump is a rotary vane positive displacement pump. The shaft rotates inside the oval housing. The vanes extend outward towards the housing and scoops the fuel from the inlet side and pushes it towards the discharge."], "jumps": ["P3950", "P3930"]}, {"id": "P3950", "text": ["4.  The auxiliary pump (booster pump) is a centrifugal fuel pump         that supplies a positive pressure to the main pump.", "4. The auxiliary pump (booster pump) is a centrifugal fuel pump that supplies a positive pressure to the main pump."], "jumps": ["P3960", "P3940"]}, {"id": "P3960", "text": ["5.  The hand pump is a wobble type pump.  As the operator                 moves the handle of the pump up and down, the fuel is                    continuously drawn in and pushed out of the pump.", "5. The hand pump is a wobble type pump. As the operator moves the handle of the pump up and down, the fuel is continuously drawn in and pushed out of the pump."], "jumps": ["P3970", "P3950"]}, {"id": "P3990", "text": ["8.  The main components of a fuel injector system are the fuel              injector pump, control unit, manifold valve, and cylinder                   injector nozzles.", "8. The main components of a fuel injector system are the fuel injector pump, control unit, manifold valve, and cylinder injector nozzles."], "jumps": ["P3999", "P3980"]}, {"id": "P3999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "The fuel mixture valve will control the air to fuel ratio for the optimum engine performance.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": []}, {"id": "P1050", "text": ["Volatility is a measure of the temperature where liquid fuel vaporizes under given conditions.  Vapor pressure measurements are taken at the point of vaporization from fuel samples immersed in a constant temperature bath.", "What carburetor component allows the pilot to control engine speed?", "The float valve controls the fuel to the carburetor, to prevent flooding the engine with fuel.", "Volatility is a measure of the temperature where liquid fuel vaporizes under given conditions. Vapor pressure measurements are taken at the point of vaporization from fuel samples immersed in a constant temperature bath."], "jumps": ["P1060", "P1030"]}, {"id": "P420", "text": ["Fuel indicators enable the pilot to monitor the fuel system during flight operations.  Fuel systems are designed to provide quality     fuel at a controlled rate for peak engine performance.", "Fuel indicators enable the pilot to monitor the fuel system during flight operations. Fuel systems are designed to provide quality fuel at a controlled rate for peak engine performance."], "jumps": ["P430", "P400"]}, {"id": "P3620", "text": ["When the throttle valve is fully closed, what will allow the engine to continue to run at idle speed?"], "jumps": ["P3610"]}, {"id": "P3621", "text": [], "jumps": []}, {"id": "P3530", "text": ["The vent line will also help atomize the fuel.  The action is similar to sucking water out of a glass with a straw that has a pin hole      near the waters surface that creates air bubbles.", "The vent line will also help atomize the fuel. The action is similar to sucking water out of a glass with a straw that has a pin hole near the waters surface that creates air bubbles."], "jumps": ["P3540", "P3460"]}, {"id": "P3560", "text": ["The pilot controls the air flow through the carburetor by moving the throttle valve located at the top of the venturi above the nozzle."], "jumps": ["P3570", "P3540"]}, {"id": "P3500", "text": ["Air needed to support engine combustion enters through the venturi of the carburetor.  The venturi forces a volume of air through a reduced diameter passage which increases its speed.", "Air needed to support engine combustion enters through the venturi of the carburetor. The venturi forces a volume of air through a reduced diameter passage which increases its speed."], "jumps": ["P3510", "P3460"]}, {"id": "P3510", "text": ["This functions similar to water flowing through a nozzle of a garden hose.  When the air flows through the venturi it creates a low pressure just at the opening of the venturi.", "This functions similar to water flowing through a nozzle of a garden hose. When the air flows through the venturi it creates a low pressure just at the opening of the venturi."], "jumps": ["P3520", "P3460"]}, {"id": "P3611", "text": ["CARBURETOR \nThe carburetor is the final component in the fuel system.", "CARBURETOR The carburetor is the final component in the fuel system."], "jumps": ["P3470", "P3440"]}, {"id": "P3600", "text": ["When the throttle is completely closed, the engine must still get air and fuel to continue to run at idle speed.  The idle fuel/air      mixture port will bypass the fully closed throttle valve.", "When the throttle is completely closed, the engine must still get air and fuel to continue to run at idle speed. The idle fuel/air mixture port will bypass the fully closed throttle valve."], "jumps": ["P3610", "P3540"]}, {"id": "P3621", "text": ["When the throttle is completely closed, the engine must still get air and fuel to continue to run at idle speed.  The idle fuel/air      mixture port will bypass the fully closed throttle valve.", "When the throttle is completely closed, the engine must still get air and fuel to continue to run at idle speed. The idle fuel/air mixture port will bypass the fully closed throttle valve."], "jumps": []}, {"id": "P3610", "text": ["What carburetor component allows the pilot to control engine speed?"], "jumps": ["P3540"]}, {"id": "P3670", "text": ["Fuel is sent to the manifold valve to be distributed to the cylinder injector nozzles.  The control unit sends the unused fuel back to the injector pump, to prevent flooding the engine.", "Fuel is sent to the manifold valve to be distributed to the cylinder injector nozzles. The control unit sends the unused fuel back to the injector pump, to prevent flooding the engine."], "jumps": ["P3680", "P3630"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 02-21-00 Changed copyright date on page Q0 to 1999-2000. Penny 03-09-00 Changed the red mat on the main window viewer to blue. Changed the high yellow word in text field of definition page to blue, Q1055. Added a 4 distractor touch area question page, Q1240. - Penny 03-28-00 Converted from SAM to toolbook. frieda 04-04-00 Text and Branching. frieda 04-12-00 Graphics. doan 07-14-00 Converted to ToolBook 7.1 format. jay 09-26-00 Reviewed - lisa 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay", "07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 02-21-00 Changed copyright date on page Q0 to 1999-2000. Penny 03-09-00 Changed the red mat on the main window viewer to blue. Changed the high yellow word in text field of definition page to blue, Q1055. Added a 4 distractor touch area question page, Q1240. - Penny 03-28-00 Converted from SAM to toolbook. frieda 04-04-00 Text and Branching. frieda 04-12-00 Graphics. doan 07-14-00 Converted to ToolBook 7.1 format. jay 09-26-00 Reviewed - lisa 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-12-02 review - rs"], "jumps": []}, {"id": "P3410", "text": ["POPPET TYPE SELECTOR VALVE\nThe poppet type selector valve's cam is the internal part of the     valve stem that operates the valve.", "POPPET TYPE SELECTOR VALVE The poppet type selector valve's cam is the internal part of the valve stem that operates the valve."], "jumps": ["P3420", "P3390"]}, {"id": "P3390", "text": ["SELECTOR VALVES\nSelector valves are installed to, shut off fuel flow for tank and     engine selection, for crossfeed and fuel transfer.  The size and      number of parts or openings varies with the types of aircraft.", "SELECTOR VALVES Selector valves are installed to, shut off fuel flow for tank and engine selection, for crossfeed and fuel transfer. The size and number of parts or openings varies with the types of aircraft."], "jumps": ["P3400", "P3380"]}, {"id": "P3520", "text": ["The fuel is then drawn out of the float chamber through the discharge nozzle, located at the outlet of the venturi.  A vent line   from the nozzle to the float chamber will keep the chamber from   creating a vacuum.", "The fuel is then drawn out of the float chamber through the discharge nozzle, located at the outlet of the venturi. A vent line from the nozzle to the float chamber will keep the chamber from creating a vacuum."], "jumps": ["P3530", "P3460"]}, {"id": "P3550", "text": ["Saturated vapor means the fuel has only partially flashed to vapor.  Mixed with air, the fuel will burn in the engine combustion chamber more efficiently and deliver the maximum power to the engine.", "Saturated vapor means the fuel has only partially flashed to vapor. Mixed with air, the fuel will burn in the engine combustion chamber more efficiently and deliver the maximum power to the engine."], "jumps": ["P3560", "P3540"]}, {"id": "P3570", "text": ["The throttle valve is a plate that is used to block or restrict air flow.  When the throttle valve is fully closed, air flow to the         engine is blocked and fuel is not drawn out of the float chamber.", "The throttle valve is a plate that is used to block or restrict air flow. When the throttle valve is fully closed, air flow to the engine is blocked and fuel is not drawn out of the float chamber."], "jumps": ["P3580", "P3540"]}, {"id": "P3580", "text": ["Engine speed is controlled by opening/closing the throttle valve which allows more or less air/fuel mixture to reach the combustion chamber of the engine."], "jumps": ["P3590", "P3540"]}, {"id": "P3590", "text": ["The pilot can also control the air to fuel mixture with the mixture needle valve. This valve is not normally fully closed.  It is used      only to throttle the fuel out of the float chamber.", "The pilot can also control the air to fuel mixture with the mixture needle valve. This valve is not normally fully closed. It is used only to throttle the fuel out of the float chamber."], "jumps": ["P3600", "P3540"]}, {"id": "P3382", "text": ["The rotary vain pump has a rotating shaft with sliding vanes encased in an oval housing."], "jumps": []}, {"id": "P3373", "text": ["The hand pump is a wobble type pump.", "The hand pump is a wobble type pump........................"], "jumps": []}, {"id": "P3380", "text": ["What type of pump has two reverse acting chambers?", "What type of pump has two reverse acting chambers?........."], "jumps": ["P3370"]}, {"id": "P3440", "text": ["DISK TYPE SELECTOR VALVE\nThe rotor of the disk type valve fits into a cylindrical opening in    the valve body.", "DISK TYPE SELECTOR VALVE The rotor of the disk type valve fits into a cylindrical opening in the valve body."], "jumps": ["P3450", "P3410"]}, {"id": "P3490", "text": ["As fuel is used up, the level decreases and the float lowers the needle valve, which causes fuel to flow into the chamber."], "jumps": ["P3500", "P3460"]}, {"id": "P3370", "text": ["What type of pump is the auxiliary pump (booster pump)?", "What type of pump is the auxiliary pump (booster pump)?...."], "jumps": ["P3310"]}, {"id": "P3350", "text": ["When the handle is moving upward, the blades move in the reverse direction forcing the fuel towards the outlet side of the chamber, which pushes the outlet valve off its seat."], "jumps": ["P3360", "P3310"]}, {"id": "P3420", "text": ["Each position has a poppet assembly to allow or stop the flow through the valve.  When the cam is rotated towards the desired   poppet, the rod from the poppet is pushed in against the spring.", "Each position has a poppet assembly to allow or stop the flow through the valve. When the cam is rotated towards the desired poppet, the rod from the poppet is pushed in against the spring."], "jumps": ["P3430", "P3410"]}, {"id": "P3450", "text": ["Fuel flow is selected by rotating the valve disk towards the desired opening.  If a opening is not selected the fluid only travel as far as the valve disk.", "Fuel flow is selected by rotating the valve disk towards the desired opening. If a opening is not selected the fluid only travel as far as the valve disk."], "jumps": ["P3460", "P3440"]}, {"id": "P3640", "text": ["The main components of a fuel injector system are the fuel injector pump, control unit, manifold valve, and cylinder injector nozzles."], "jumps": ["P3650", "P3630"]}, {"id": "P3650", "text": ["The injector pump increases the fuel pressure to ensure the fuel reaches the cylinder injector nozzle.  The control unit directs the  fuel from the pump to the manifold valve.", "The injector pump increases the fuel pressure to ensure the fuel reaches the cylinder injector nozzle. The control unit directs the fuel from the pump to the manifold valve."], "jumps": ["P3660", "P3630"]}, {"id": "P3660", "text": ["The control unit is attached by an arm to the throttle valve.  As the throttle valve moves, the control unit follows setting the correct ratio of fuel to air mixture.", "The control unit is attached by an arm to the throttle valve. As the throttle valve moves, the control unit follows setting the correct ratio of fuel to air mixture."], "jumps": ["P3670", "P3630"]}, {"id": "P3680", "text": ["The manifold valve will ensure the cylinders get a shot of fuel at the proper time.  As pressure increases in the supply line to the    manifold valve, it opens the valve and allows flow.", "The manifold valve will ensure the cylinders get a shot of fuel at the proper time. As pressure increases in the supply line to the manifold valve, it opens the valve and allows flow..."], "jumps": ["P3690", "P3630"]}, {"id": "P3270", "text": ["AUXILIARY PUMP\nThe most commonly used auxiliary pump is the centrifugal pump.  This is an electrically driven pump that supplies fuel under pressure to the inlet of the main fuel pump.", "AUXILIARY PUMP The most commonly used auxiliary pump is the centrifugal pump. This is an electrically driven pump that supplies fuel under pressure to the inlet of the main fuel pump."], "jumps": ["P3280", "P3260"]}, {"id": "P3340", "text": ["Notice the pump's intake chamber, the outlet valve is shut.  The low pressure in the chamber caused the valve to be drawn to its seat.", "Notice the pump's intake chamber, the outlet valve is shut. The low pressure in the chamber caused the valve to be drawn to its seat."], "jumps": ["P3350", "P3310"]}, {"id": "P3360", "text": ["This type of pump will discharge and draw a suction with each stroke of the pump.  Because, it contains two chambers that are reverse acting from each other.", "This type of pump will discharge and draw a suction with each stroke of the pump. Because, it contains two chambers that are reverse acting from each other."], "jumps": ["P3370", "P3310"]}, {"id": "P3371", "text": [], "jumps": []}, {"id": "P3381", "text": [], "jumps": []}, {"id": "P3372", "text": ["The main fuel pump is a rotary vane type pump.", "The main fuel pump is a rotary vane type pump.............."], "jumps": []}, {"id": "P3264", "text": ["The tanks have baffle plates inside to prevent the fuel from rapidly shifting from side to side.  The baffles plates have predrilled holes to allow fuel to flow throughout the tank.", "The tanks have baffle plates inside to prevent the fuel from rapidly shifting from side to side. The baffles plates have predrilled holes to allow fuel to flow throughout the tank..."], "jumps": []}, {"id": "P3300", "text": ["Unlike the rotary vane pump the centrifugal pump is not a positive displacement pump.  It pushes the fuel until it reaches the maximum pressure of the pump and maintains that pressure without damaging the system.", "Unlike the rotary vane pump the centrifugal pump is not a positive displacement pump. It pushes the fuel until it reaches the maximum pressure of the pump and maintains that pressure without damaging the system."], "jumps": ["P3310", "P3270"]}, {"id": "P3330", "text": ["When the handle is moving downward the blades move away from the inlet valve and fuel enters the chamber."], "jumps": ["P3340", "P3310"]}, {"id": "P3262", "text": ["The fuel tanks sump will hold any sediment and water that settles in the tanks."], "jumps": []}, {"id": "P3260", "text": ["Where is moisture or water normally trapped in a fuel system?"], "jumps": ["P3250"]}, {"id": "P3261", "text": [], "jumps": []}, {"id": "P3290", "text": ["The fuel is then forced through the outer casing and directed by the outward motion into the fuel lines."], "jumps": ["P3300", "P3270"]}, {"id": "P3252", "text": ["The fuel tank vents allow air to enter so the tank can equalize to the atmospheric pressure.  This prevents expanding and collapsing tanks during altitude change.", "The fuel tank vents allow air to enter so the tank can equalize to the atmospheric pressure. This prevents expanding and collapsing tanks during altitude change......."], "jumps": []}, {"id": "P3253", "text": ["Fuel strainers are used to remove large sediment from the system."], "jumps": []}, {"id": "P3230", "text": ["During main fuel pump failure, the auxiliary fuel pump supplies fuel to the engine through the idle main fuel pump."], "jumps": ["P3240", "P3150"]}, {"id": "P3250", "text": ["What prevents the fuel system from over pressurizing and causing damage to other components?"], "jumps": ["P3150"]}, {"id": "P3251", "text": [], "jumps": []}, {"id": "P3280", "text": ["A centrifugal pump moves fuel much like a fan blade moves air. The impeller draws the fuel into the center of the eye and slings or propels the fuel towards the outer casing."], "jumps": ["P3290", "P3270"]}, {"id": "P3400", "text": ["The value must accommodate full flow capacity to the fuel line, must not leak and must operate freely with a definite \"feel\" or \"click\" when in the correct position.", "Positive displacement means that the pump will discharge to the system continuously.  If the system did not use all of fuel being     pumped, the pressure would increase until a leak or pump failure occurred.", "Positive displacement means that the pump will discharge to the system continuously. If the system did not use all of fuel being pumped, the pressure would increase until a leak or pump failure occurred."], "jumps": ["P3410", "P3390"]}, {"id": "P3200", "text": ["A relief system is used to allow excessive pressure to be relieved back to the suction side of the pump."], "jumps": ["P3210", "P3150"]}, {"id": "P3220", "text": ["When system pressure falls below the set limits, the spring overcomes system pressure and pushes the upper disk back down to block off the flow back to the inlet side of the pump."], "jumps": ["P3230", "P3150"]}, {"id": "P3160", "text": ["The pumps rotor has sliding vanes and is driven by the crankshaft through the accessory gearing.  As the shaft rotates inside the housing the vanes extend outward towards the housing and scoops the fuel from the inlet side and pushes it towards the discharge.", "The pumps rotor has sliding vanes and is driven by the crankshaft through the accessory gearing. As the shaft rotates inside the housing the vanes extend outward towards the housing and scoops the fuel from the inlet side and pushes it towards the discharge."], "jumps": ["P3170", "P3150"]}, {"id": "P3170", "text": ["Notice the distance from the rotating shaft and the oval housing is increasing until the next vane is at the inlet opening.  This draws the fuel in, much like syringe draws in liquid.", "Notice the distance from the rotating shaft and the oval housing is increasing until the next vane is at the inlet opening. This draws the fuel in, much like syringe draws in liquid.", "inlet opening. This draws the fuel in, much like syringe draws in liquid."], "jumps": ["P3180", "P3150"]}, {"id": "P3140", "text": ["Most strainers have a glass bowl that houses the screen.  To remove the sediment, turn the thumb nut located at the bottom of the strainer and remove the glass bowl and screen.", "Most strainers have a glass bowl that houses the screen.  To remove the sediment, turn the thumb nut located at the bottom of the strainer and remove the glass bowl and screen.", "Most strainers have a glass bowl that houses the screen. To remove the sediment, turn the thumb nut located at the bottom of the strainer and remove the glass bowl and screen."], "jumps": ["P3150", "P3120"]}, {"id": "P3120", "text": ["FUEL STRAINER\nFuel strainers are used to remove large sediment from the system.  The strainers contain a screen basket which traps the sediment as fuel flows through.", "FUEL STRAINER Fuel strainers are used to remove large sediment from the system. The strainers contain a screen basket which traps the sediment as fuel flows through."], "jumps": ["P3100"]}, {"id": "P3130", "text": ["Because the filter is at a low point of the system, it also traps small amounts of water in the system and can be removed during periodic maintenance or pre-flight."], "jumps": ["P3120"]}, {"id": "P3180", "text": ["When the vanes rotate towards the discharge side, the distance between the shaft and housing is decreasing, which squeezes the fluid out of the pumps discharge chamber."], "jumps": ["P3190", "P3150"]}, {"id": "P3090", "text": ["The standpipe is another component that prevents sediment or moisture from entering the engine.  The pipe extends above the sump and allows fuel to be drawn above the sediment level.", "The standpipe is another component that prevents sediment or moisture from entering the engine.  The pipe extends above the sump and allows fuel to be drawn above the sediment level.", "The standpipe is another component that prevents sediment or moisture from entering the engine. The pipe extends above the sump and allows fuel to be drawn above the sediment level."], "jumps": ["P3030"]}, {"id": "P3070", "text": ["The bottom of the tank slopes into a small chamber area called the sump.  This design allows sediments and moisture to settle at one central point.", "The bottom of the tank slopes into a small chamber area called the sump.  This design allows sediments and moisture to settle at one central point.", "The bottom of the tank slopes into a small chamber area called the sump. This design allows sediments and moisture to settle at one central point."], "jumps": ["P3030"]}, {"id": "P3050", "text": ["The tanks use vents at the top to allow outside air to enter and maintain atmospheric pressure to prevent the tanks from expanding or collapsing during changes in altitude."], "jumps": ["P3030"]}, {"id": "P3060", "text": ["The tanks use baffle plates to prevent the fuel from rapidly shifting from side to side during aircraft maneuvers.  The baffle     plates have holes to allow the fuel to slowly flow throughout the   tank.", "The tanks use baffle plates to prevent the fuel from rapidly shifting from side to side during aircraft maneuvers. The baffle plates have holes to allow the fuel to slowly flow throughout the tank....."], "jumps": ["P3030"]}, {"id": "P3080", "text": ["During pre-flight the pilot removes any sediment or moisture from the tanks by taking a fuel sample from the drain valve located at the bottom of the sump of each tank."], "jumps": ["P3030"]}, {"id": "P3190", "text": ["Positive displacement means that the pump will discharge to the system continuously.  If the system did not use all of fuel being     pumped, the pressure would increase until a leak or pump failure occurred.", "Most of the fuel lines are made of light weight aluminum alloy. Reinforced rubber or teflon fuel hoses are used in places where   flexibility is needed.", "Positive displacement means that the pump will discharge to the system continuously. If the system did not use all of fuel being pumped, the pressure would increase until a leak or pump failure occurred.", "Most of the fuel lines are made of light weight aluminum alloy. Reinforced rubber or teflon fuel hoses are used in places where flexibility is needed."], "jumps": ["P3200", "P3150", "P3100"]}, {"id": "P3020", "text": ["The basic components of a fuel system include tanks, lines, valves, pumps, filtering vents, gages, warning signal and primer."], "jumps": ["P3025", "P3001"]}, {"id": "P3040", "text": ["FUEL TANKS\nThe tanks are constructed of aluminum alloy to reduce aircraft      weight and still provide the strength required to safely transport   fuel.  The aluminum alloy is used because it does not chemically  react with the fuel.", "FUEL TANKS The tanks are constructed of aluminum alloy to reduce aircraft weight and still provide the strength required to safely transport fuel. The aluminum alloy is used because it does not chemically react with the fuel."], "jumps": ["P3030"]}, {"id": "P3110", "text": ["Most of the fuel lines are made of light weight aluminum alloy. Reinforced rubber or teflon fuel hoses are used in places where   flexibility is needed.", "Most of the fuel lines are made of light weight aluminum alloy. Reinforced rubber or teflon fuel hoses are used in places where flexibility is needed.", "mary. You are about to return to the Objective Menu."], "jumps": ["P3100"]}, {"id": "P2960", "text": ["5.  Fuel injectors may be used instead of a carburetor.  The                  purpose of the fuel injectors are the same as a carburetor, but       they operate more efficiently and have a lower failure rate.", "5. Fuel injectors may be used instead of a carburetor. The purpose of the fuel injectors are the same as a carburetor, but they operate more efficiently and have a lower failure rate. S"], "jumps": ["P2999", "P2940"]}, {"id": "P2940", "text": ["3.  The fuel-pump system is similar to the gravity type system,             except the fuel tanks are positioned lower than the engine              and require a pump to transfer fuel up to the carburetor.", "3. The fuel-pump system is similar to the gravity type system, except the fuel tanks are positioned lower than the engine and require a pump to transfer fuel up to the carburetor."], "jumps": ["P2950", "P2920"]}, {"id": "P2999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": []}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3025", "text": ["Some systems will include central refueling provisions, fuel dump valves and a means for transferring fuel."], "jumps": ["P3030", "P3020"]}, {"id": "P2260", "text": ["Smaller airplanes with gravity or pump systems normally have a fuel hand pump to enable the pilot to manually transfer fuel from tank to tank or from tank to engine."], "jumps": ["P2910", "P2250"]}, {"id": "P2920", "text": ["1.  The simplest type of fuel system is the gravity feed.  The fuel          tanks are located in the wings and the force of gravity causes        the fuel to flow towards the engine.", "1. The simplest type of fuel system is the gravity feed. The fuel tanks are located in the wings and the force of gravity causes the fuel to flow towards the engine..."], "jumps": ["P2930", "P2001"]}, {"id": "P2251", "text": [], "jumps": []}, {"id": "P2910", "text": ["This completes the information on FUEL SYSTEMS.", "This completes the information on FUEL SYSTEMS.", "This completes the information on FUEL SYSTEMS.ITLE........"], "jumps": ["P2001", "P2260"]}, {"id": "P2242", "text": ["Large sediments and small amounts of moisture will collect in the fuel strainer."], "jumps": []}, {"id": "P3025", "text": ["Some systems will include central refueling provisions, fuel dump valves and a means for transferring fuel."], "jumps": ["P3030", "P3020"]}, {"id": "P2230", "text": ["The pump system can also use fuel injectors instead of a carburetor to efficiently atomize the fuel and air mixture."], "jumps": ["P2240", "P2120"]}, {"id": "P2240", "text": ["What ensures that any large sediments are filtered from the fuel before fuel enters the engine?", "What ensures that any large sediments are filtered from the fuel before fuel enters the engine?"], "jumps": ["P2120"]}, {"id": "P2190", "text": ["The fuel booster pump is used to constantly supply fuel to the main fuel pump, to reduce the risk at high altitudes of the fuel flashing to a vapor."], "jumps": ["P2130", "P2120"]}, {"id": "P2180", "text": ["A series of relief valves are located in the main fuel pump to maintain the fuel at a constant operating pressure."], "jumps": ["P2190", "P2120"]}, {"id": "P2160", "text": ["Fuel is supplied to engine from the fuel tanks by the main fuel pump.  The booster pump supplies fuel and fuel pressure for         starting the engine and is used as an emergency pump.", "Fuel is supplied to engine from the fuel tanks by the main fuel pump. The booster pump supplies fuel and fuel pressure for starting the engine and is used as an emergency pump."], "jumps": ["P2170", "P2120"]}, {"id": "P2130", "text": ["Like the gravity system, the pilot controls the fuel tanks with the fuel selector valve.  The fuel selector valve may be manually or      electrically operated from the cockpit.", "Like the gravity system, the pilot controls the fuel tanks with the fuel selector valve. The fuel selector valve may be manually or electrically operated from the cockpit."], "jumps": ["P2140", "P2120"]}, {"id": "P2250", "text": ["What is the auxiliary pump used for?", "What is the auxiliary pump used for?", "What is the auxiliary pump used for?.......................", "Supply fuel when the main fuel pump fails. The main fuel pump.", "Prevent the fuel from flashing into vapor prior to reaching the main fuel pump."], "jumps": ["P2240"]}, {"id": "P2930", "text": ["2.  The Carburetor mixes gasoline with the right amount of air             and atomizes the mixture before it enters the engine                         combustion chambers.", "2. The Carburetor mixes gasoline with the right amount of air and atomizes the mixture before it enters the engine combustion chambers."], "jumps": ["P2940", "P2920"]}, {"id": "P2950", "text": ["4.  The main fuel pump is driven by the aircraft's engine and is a         positive displacement pump.", "4. The main fuel pump is driven by the aircraft's engine and is a positive displacement pump."], "jumps": ["P2960", "P2940"]}, {"id": "P2112", "text": ["Each engine cylinder has a primer nozzle to aid in engine start up."], "jumps": []}, {"id": "P2110", "text": ["How many fuel primer nozzles are there per system?", "How many fuel primer nozzles are there per system?........."], "jumps": ["P2100"]}, {"id": "P2111", "text": [], "jumps": []}, {"id": "P2210", "text": ["The pump system also uses a primer hand pump and primer nozzles for each engine cylinder to ensure fuel is present for easier engine start up."], "jumps": ["P2220", "P2120"]}, {"id": "P2220", "text": ["Like the gravity system, the pump systems carburetor mixes the gasoline with the right amount of air and atomizes the mixture      before it enters the engine combustion chambers.", "Like the gravity system, the pump systems carburetor mixes the gasoline with the right amount of air and atomizes the mixture      before it enters the engine combustion chambers.", "Like the gravity system, the pump systems carburetor mixes the gasoline with the right amount of air and atomizes the mixture before it enters the engine combustion chambers."], "jumps": ["P2230", "P2120"]}, {"id": "P2252", "text": ["The auxiliary pump (booster pump) assists the main fuel pump, transfers fuel from tank to tank, and supplies fuel to the engine     during a main fuel pump failure.", "The auxiliary pump (booster pump) assists the main fuel pump, transfers fuel from tank to tank, and supplies fuel to the engine during a main fuel pump failure."], "jumps": []}, {"id": "P3030", "text": ["The fuel tanks are normally positioned in the wings, but some aircraft also use center fuselage tanks to increase range."], "jumps": ["P3020"]}, {"id": "P3100", "text": ["FUEL LINES\nFuel lines are used to connect the system components together and provide a path for the fuel to flow.  These lines must be strong and flexible to withstand constant vibration and G-forces associated with flight.", "FUEL LINES Fuel lines are used to connect the system components together and provide a path for the fuel to flow. These lines must be strong and flexible to withstand constant vibration and G-forces associated with flight."], "jumps": ["P3030"]}, {"id": "P3150", "text": ["FUEL PUMP\nThe main fuel pump is a rotary vane positive displacement pump, driven by the aircraft's engine.  The pump is usually mounted on the accessory section of the engine.", "FUEL PUMP The main fuel pump is a rotary vane positive displacement pump, driven by the aircraft's engine. The pump is usually mounted on the accessory section of the engine."], "jumps": ["P3160", "P3120"]}, {"id": "P3210", "text": ["When the discharge side pressure approaches its upper limit, it pushes up on the spring loaded upper disk and allows fuel to flow back to the suction side."], "jumps": ["P3220", "P3150"]}, {"id": "P3240", "text": ["As the auxiliary pump's discharge pressure increases on the suction side of the idle main pump, it pushes the spring loaded lower disk off its seat, allowing fuel to flow through the upper disk."], "jumps": ["P3250", "P3150"]}, {"id": "P3263", "text": ["The fuel strainer is used to remove large sediment and moisture from the system."], "jumps": []}, {"id": "P3310", "text": ["HAND FUEL PUMP\nThe hand pump or wobble pump is installed on light aircrafts.  It is usually placed near other fuel system components and operated from the cockpit.", "HAND FUEL PUMP The hand pump or wobble pump is installed on light aircrafts. It is usually placed near other fuel system components and operated from the cockpit."], "jumps": ["P3320", "P3270"]}, {"id": "P3320", "text": ["The hand pump is a wobble type pump.  As the operator moves the handle of the pump up and down, the fuel is drawn in and out of the pump.", "The hand pump is a wobble type pump. As the operator moves the handle of the pump up and down, the fuel is drawn in and out of the pump."], "jumps": ["P3330", "P3310"]}, {"id": "P3383", "text": ["A centrifugal pump has a rotating impeller incased in a shell like casing."], "jumps": []}, {"id": "P3470", "text": ["Fuel enters the carburetor through the float chamber.  The float chamber controls the flow of fuel and prevents the carburetor from being flooded.", "Fuel enters the carburetor through the float chamber. The float chamber controls the flow of fuel and prevents the carburetor from being flooded."], "jumps": ["P3480", "P3460"]}, {"id": "P3480", "text": ["The chamber contains a float with an attached needle valve.  The float rises as the fuel level increases until the level gets high     enough for the needle valve to block the fuel inlet.", "The chamber contains a float with an attached needle valve. The float rises as the fuel level increases until the level gets high enough for the needle valve to block the fuel inlet."], "jumps": ["P3490", "P3460"]}, {"id": "P3630", "text": ["FUEL INJECTION \nThe fuel injection system has the same purpose as the carburetor, but uses a different method to atomize the air to fuel mixture.", "FUEL INJECTION The fuel injection system has the same purpose as the carburetor, but uses a different method to atomize the air to fuel mixture. E"], "jumps": ["P3640", "P3620"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P1950", "text": ["4.  There are three types of jet fuels in use today.  Two are high            grade aviation kerosene called Jet A (JP-5) and Jet A-1.  The           third Jet B (JP- 4), is a blend of high grade aviation gasoline           and kerosene.", "4. There are three types of jet fuels in use today. Two are high grade aviation kerosene called Jet A (JP-5) and Jet A-1. The third Jet B (JP- 4), is a blend of high grade aviation gasoline and kerosene."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  Jet fuel is not color coded for identification like aviation                   gasoline.  However, the containers and hoses are marked with      a color coding.  Jet A (JP- 5) is black, Jet A-1 is gray, and Jet B       (JP- 4) is yellow or gold.", "5. Jet fuel is not color coded for identification like aviation gasoline. However, the containers and hoses are marked with a color coding. Jet A (JP- 5) is black, Jet A-1 is gray, and Jet B (JP- 4) is yellow or gold."], "jumps": ["P1970", "P1950"]}, {"id": "P1930", "text": ["2.  Octane and performance ratings are the ability of fuel to                  withstand compression in the engine cylinder before                        detonating.  Higher octane fuels, increase the engine                        compression, which increases the engines horsepower.", "2. Octane and performance ratings are the ability of fuel to withstand compression in the engine cylinder before detonating. Higher octane fuels, increase the engine compression, which increases the engines horsepower."], "jumps": ["P1940", "P1920"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1970"]}, {"id": "P2050", "text": ["A strainer (sump) ensures large sediments are filtered out of the fuel before entering the engine.  The drain located at a low point   in the strainer allows the trapped sediment and water to be removed.", "A strainer (sump) ensures large sediments are filtered out of the fuel before entering the engine. The drain located at a low point in the strainer allows the trapped sediment and water to be removed."], "jumps": ["P2060", "P2030"]}, {"id": "P2101", "text": ["Excessive sediment (contaminants) can cause fuel system components to fail or stop fuel flow completely.  Contaminants include rust, sand, dust, aluminum compounds, brass, or rubber.", "Excessive sediment (contaminants) can cause fuel system components to fail or stop fuel flow completely. Contaminants include rust, sand, dust, aluminum compounds, brass, or rubber."], "jumps": ["P1210", "P1230"]}, {"id": "P1920", "text": ["1.  Liquid fuels are classified as either nonvolatile or volatile.               Nonvolatile fuels are the thick oils such as diesel and the                volatile fuels are the thin translucent type fuels like gasoline.", "1. Liquid fuels are classified as either nonvolatile or volatile. Nonvolatile fuels are the thick oils such as diesel and the volatile fuels are the thin translucent type fuels like gasoline."], "jumps": ["P1930", "P1001"]}, {"id": "P2040", "text": ["The pilot controls which fuel tank will be in operation by the use of the fuel selector valve.  The fuel selector valve may be manually or electrically operated from the cockpit.", "The pilot controls which fuel tank will be in operation by the use of the fuel selector valve. The fuel selector valve may be manually or electrically operated from the cockpit."], "jumps": ["P2050", "P2030"]}, {"id": "P2180", "text": ["A series of relief valves are located in the main fuel pump to maintain the fuel at a constant operating pressure."], "jumps": ["P2190", "P2120"]}, {"id": "P1200", "text": ["Periodic maintenance and preflight procedures will filter out any sediments and remove small amounts of moisture.  Excessive water contamination can cause the fuel lines to freeze or system  indicators to fail or become erratic.", "Periodic maintenance and preflight procedures will filter out any sediments and remove small amounts of moisture. Excessive water contamination can cause the fuel lines to freeze or system indicators to fail or become erratic."], "jumps": ["P1210", "P1190"]}, {"id": "P2060", "text": ["The fuel system has a primer hand pump located on the pilots panel to ensure the engine has fuel on start up."], "jumps": ["P2070", "P2030"]}, {"id": "P430", "text": ["Let's begin the lesson on FUEL SYSTEMS...................................."], "jumps": ["P400"]}, {"id": "P1910", "text": ["This completes the information on AVIATION FUELS.", "This completes the information on AVIATION FUELS.LE........"], "jumps": ["P1001", "P1220"]}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1172", "text": ["(AVGAS 80) is red, (AVGAS 100 high lead) is green, (AVGAS 100 low lead) is blue, and (AVGAS 115) is purple."], "jumps": []}, {"id": "P2102", "text": ["The pilot uses the selection valve to determine which tank supplies the system with fuel."], "jumps": []}, {"id": "P2100", "text": ["What is the first component the fuel will flow through after leaving the fuel tanks?"], "jumps": ["P2030"]}, {"id": "P2150", "text": ["The pump system uses a main pump and an auxiliary pump, commonly referred to as a booster pump, to transfer fuel to the engine."], "jumps": ["P2160", "P2120"]}, {"id": "P2082", "text": ["The Carburetor mixes gasoline with the right amount of air and atomizes the mixture before it enters the engine combustion chambers."], "jumps": ["P2090", "P2030"]}, {"id": "P2085", "text": ["ATOMIZE - To reduce a liquid into a spray.  Fuel and air mixture atomized to a vapor.", "ATOMIZE - To reduce a liquid into a spray. Fuel and air mixture atomized to a vapor."], "jumps": []}, {"id": "P2120", "text": ["FUEL PUMP SYSTEM\nThe fuel-pump system is similar to the gravity feed system.            Airplanes equipped with a high output engine or low winged aircraft that can not use the gravity feed system require the fuel pump system.", "FUEL PUMP SYSTEM The fuel-pump system is similar to the gravity feed system. Airplanes equipped with a high output engine or low winged aircraft that can not use the gravity feed system require the fuel pump system."], "jumps": ["P2150", "P2110"]}, {"id": "P2140", "text": ["A fuel strainer is also used in the pump system to trap any large sediments and moisture in the system."], "jumps": ["P2210", "P2120"]}, {"id": "P2241", "text": [], "jumps": []}, {"id": "P2252", "text": ["The auxiliary pump (booster pump) assists the main fuel pump, transfers fuel from tank to tank, and supplies fuel to the engine     during a main fuel pump failure.", "A fuel strainer is also used in the pump system to trap any large sediments and moisture in the system.", "The auxiliary pump (booster pump) assists the main fuel pump, transfers fuel from tank to tank, and supplies fuel to the engine during a main fuel pump failure."], "jumps": ["P2210", "P2120"]}, {"id": "P2170", "text": ["The main fuel pump is engine driven.  Since the engine driven fuel pump normally discharges more fuel than the engine requires, excessive fuel and fuel pressures are relieved by a spring loaded valve.", "The main fuel pump is engine driven. Since the engine driven fuel pump normally discharges more fuel than the engine requires, excessive fuel and fuel pressures are relieved by a spring loaded valve."], "jumps": ["P2180", "P2120"]}, {"id": "P1190", "text": ["Aviation fuels must be free from impurities that would interfere with the operation of aircraft engine.  Normally a small amount of  water from tank condensation and sediment will be in the fuel.", "Aviation fuels must be free from impurities that would interfere with the operation of aircraft engine. Normally a small amount of water from tank condensation and sediment will be in the fuel."], "jumps": ["P1200", "P1180"]}, {"id": "P1070", "text": ["Gasoline is classified as what type of liquid fuel?", "Gasoline is classified as what type of liquid fuel?........"], "jumps": ["P1050"]}, {"id": "P1020", "text": ["Fuel is a substance that, will burn and produce heat when combined with oxygen.  All fuels are classified according to their physical state; solid, liquid, or gas.", "Fuel is a substance that, will burn and produce heat when combined with oxygen. All fuels are classified according to their physical state; solid, liquid, or gas."], "jumps": ["P1030", "P1001"]}, {"id": "P1040", "text": ["Liquid fuels are classified as either nonvolatile or volatile. Nonvolatile fuels are thick oils such as diesel fuel oil and        volatile fuels are thin translucent type fuels like gasoline.", "Liquid fuels are classified as either nonvolatile or volatile. Nonvolatile fuels are thick oils such as diesel fuel oil and volatile fuels are thin translucent type fuels like gasoline."], "jumps": ["P1050", "P1030"]}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P1090", "text": ["The effects of fuel vaporization can cause the air in a carburetor to rapidly condense and freeze."], "jumps": ["P1100", "P1080"]}, {"id": "P1072", "text": ["Nonvolatile fuels are the thick oils and the volatile fuels are the thin translucent type fuels."], "jumps": []}, {"id": "P400", "text": ["The purpose of the fuel system is to store and deliver a continuous flow of clean fuel under positive pressure to meet the engines demands for operation."], "jumps": ["P410", "P300"]}, {"id": "P1071", "text": [], "jumps": []}, {"id": "P1110", "text": ["Octane and performance ratings are the ability of fuel to withstand compression in the engine cylinder before detonating. Higher octane fuels, increase the engine compression, which increases the engines horsepower."], "jumps": ["P1120", "P1100"]}, {"id": "P1060", "text": ["If the fuel turned to a vapor in the fuel lines at high altitudes, the engine would become vapor locked and stall.  This makes            volatility an important safety factor when selecting the best         aviation fuels.", "If the fuel turned to a vapor in the fuel lines at high altitudes, the engine would become vapor locked and stall. This makes volatility an important safety factor when selecting the best aviation fuels.", "ograms are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": ["P1070", "P1050"]}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: FUEL SYSTEMSdf sdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P1120", "text": ["The most convenient way to increase the octane of a fuel is to add an inhibitor called Tetraethyl Lead (TEL).  However, due to its corrosive effects on internal engine parts, the use of TEL is       limited to 6 ml. per gallon.", "The most convenient way to increase the octane of a fuel is to add an inhibitor called Tetraethyl Lead (TEL). However, due to its corrosive effects on internal engine parts, the use of TEL is limited to 6 ml. per gallon."], "jumps": ["P1130", "P1100"]}, {"id": "P1240", "text": ["Aviation fuels require high quality control measures to ensure the safe operation of the aircraft using it.  The storage tanks must be properly maintained with sediments and moisture controls enforced.", "The fuel system ensures positive and reliable fuel flows throughout altitude changes, quick maneuvers and sudden acceleration and deceleration.  Also, fuel systems must operate during changes in ground and in-flight climate conditions.", "Aviation fuels require high quality control measures to ensure the safe operation of the aircraft using it. The storage tanks must be properly maintained with sediments and moisture controls enforced.", "The fuel system ensures positive and reliable fuel flows throughout altitude changes, quick maneuvers and sudden acceleration and deceleration. Also, fuel systems must operate during changes in ground and in-flight climate conditions.", "You have successfully passed the assessment test!"], "jumps": ["P1910", "P1220", "P400"]}, {"id": "P1001", "text": ["Are you sure you want to Bookmark the Lesson?", "Are you sure you want to Exit the Lesson?", "You skipped X question(s). Do you want to  to each nozzle.  The nozzles spray fuel into each cylinder of the engine.", "A fuel primer nozzle is located at each of the engine cylinders and fuel from the primer hand pump is fed to each nozzle. The nozzles spray fuel into each cylinder of the engine."], "jumps": ["P2080", "P2030"]}, {"id": "P2080", "text": ["The Carburetor mixes gasoline with the right amount of air and atomizes the mixture before it enters the engine combustion chambers."], "jumps": ["P2090", "P2030"]}, {"id": "P2090", "text": ["Fuel injectors may be used instead of a carburetor.  The purpose of the fuel injectors are the same as a carburetor, but they operate more efficiently and have a lower failure rate.", "Fuel injectors may be used instead of a carburetor. The purpose of the fuel injectors are the same as a carburetor, but they operate more efficiently and have a lower failure rate.", "\"You have successfully passed the assessment"], "jumps": ["P2100", "P2030"]}, {"id": "P1940", "text": ["3.  Aviation fuels are color coded for purpose of octane rating,            use, and contamination indication.", "6.  Excessive sediment could cause fuel system components to         fail or stop fuel flow completely.  Sediments include rust, sand,      dust, aluminum compounds, brass, or rubber.", "3. Aviation fuels are color coded for purpose of octane rating, use, and contamination indication.", "6. Excessive sediment could cause fuel system components to fail or stop fuel flow completely. Sediments include rust, sand, dust, aluminum compounds, brass, or rubber."], "jumps": ["P1950", "P1930", "P1999", "P1960"]}, {"id": "P2020", "text": ["There are two types of fuel systems in use today.  High winged low horsepower aircraft use the gravity feed fuel system, while low winged high horsepower engines use the fuel pump system.", "There are two types of fuel systems in use today. High winged low horsepower aircraft use the gravity feed fuel system, while low winged high horsepower engines use the fuel pump system."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["GRAVITY FEED FUEL SYSTEM\nThe simplest type of fuel system is the gravity feed.  The fuel tanks are located in the wings, placing them higher than the carburetor.  Gravity causes the fuel to flow to the carburetor.", "GRAVITY FEED FUEL SYSTEM The simplest type of fuel system is the gravity feed. The fuel tanks are located in the wings, placing them higher than the carburetor. Gravity causes the fuel to flow to the carburetor."], "jumps": ["P2040", "P2020"]}, {"id": "P1140", "text": ["Jets require fuels with different chemical mixtures than aviation gasoline.  There are three types of jet fuels in use today;             Jet A (JP- 5), Jet A-1, and Jet B (JP- 4).", "Jets require fuels with different chemical mixtures than aviation gasoline. There are three types of jet fuels in use today; Jet A (JP- 5), Jet A-1, and Jet B (JP- 4)."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["Jet A (JP-5) and Jet A-1 are aviation grade kerosene fuels.  Jet \nA-1 is commonly used by the military and is ideal for use at extremely low temperatures.  Jet B (JP-4), is a blend of aviation grade gasoline and kerosene and is also used by the military.", "Jet A (JP-5) and Jet A-1 are aviation grade kerosene fuels. Jet A-1 is commonly used by the military and is ideal for use at extremely low temperatures. Jet B (JP-4), is a blend of aviation grade gasoline and kerosene and is also used by the military."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["Jet fuel is not color coded for identification like AVGAS. However, the containers and hoses may be marked with a color code.  Jet A (JP- 5) is black, Jet A-1 is gray, and Jet B (JP- 4) is yellow or gold.", "Jet fuel is not color coded for identification like AVGAS. However, the containers and hoses may be marked with a color code. Jet A (JP- 5) is black, Jet A-1 is gray, and Jet B (JP- 4) is yellow or gold."], "jumps": ["P1170", "P1140"]}, {"id": "P1170", " let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
