0"]}, {"id": "P412", "text": ["Think of the RS flip-flop as a switch that changes when a signal is applied to the S or R inputs."], "jumps": []}, {"id": "P420", "text": ["Let's begin the lesson on RS FLIP-FLOPS..................................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The Reset-Set (RS) flip-flop is designed to store the last input condition until the next input condition is applied."], "jumps": ["P1050", "P1001"]}, {"id": "P1050", "text": ["The RS flip-flop has two inputs and two outputs."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["A high applied to the SET (S) input sets the output Q high and output Q low."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["A high applied to the RESET (R) input sets output Q low and the output Q high."], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["If a high is applied to inputs S and R at the same time an illegal state exists. The outputs Q and Q cannot be determined. v"], "jumps": ["P1090", "P1020"]}, {"id": "P1090", "text": ["An application for the RS flip-flop is as a replacement for the mechanical switch."], "jumps": ["P1100", "P1020"]}, {"id": "P1100", "text": ["Mechanical switches physically vibrate or bounce several times before a solid contact is made."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["Bouncing of the switch causes voltage spikes that can effect digital circuit operation."], "jumps": ["P1120", "P1090"]}, {"id": "P1120", "text": ["The RS flip-flop acts as an electrical switch. There is no mechanical bounce produced by the flip-flop."], "jumps": ["P1130", "P1090"]}, {"id": "P1130", "text": ["When does this RS flip-flop produce a high output on Q?...."], "jumps": ["P1090"]}, {"id": "P1131", "text": [], "jumps": []}, {"id": "P1132", "text": ["When a high is applied to the R or reset input of a flip-flop the Q output goes low and the Q output goes high."], "jumps const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {

    p.className = "empty";

    stage.appendChild(p);
  }
  for (const line of page.text) {

    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";

      const b = document.createElement("button");

      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}

  const n = book.pages.findIndex(p => p.id === id);
