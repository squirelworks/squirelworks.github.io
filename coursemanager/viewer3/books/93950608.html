const book = {"title": "93950608", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: WORK AND POWER MEASUREMENTS fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Define power and be able to solve problems using the standard measure of power, the Joule (J).......", "w Define work and be able to solve problems using the standard measure of work, the Newton (N)."], "jumps": []}, {"id": "P400", "text": ["Introduction The concept of energy appears in several scientific applications, and there are many different methods to measure energy."], "jumps": []}, {"id": "P410", "text": ["In an attempt to define energy, scientists formulated the conservation of energy theory."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["The conservation of energy theory says that the total energy of a system remains constant regardless of the changes which occur within the system."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["Two important aspects of this theory, work and power, are concerned with two special types of energy, potential and kinetic energy."], "jumps": ["P440", "P410"]}, {"id": "P440", "text": ["Work and power involve the transfer of potential energy, which is the energy an object has due to its position, to kinetic energy, which is potential energy set into motion."], "jumps": ["P450", "P410"]}, {"id": "P450", "text": ["Even though the energy transferred from potential to kinetic energy, the total energy of the system (the football) is still\n6 Newtons.", "Even though the energy transferred from potential to kinetic energy, the total energy of the system (the football) is still 6 Newtons."], "jumps": ["P460", "P440"]}, {"id": "P460", "text": ["Let's examine work and power and see how they affect our everyday lives.", "Work Energyyyrest stays at rest unless a force is applied to it. 2. For every force, there is an equal and opposite force. 3. Two forces acting on the same body cause the body's acceleration to equal zero."], "jumps": ["P470", "P440"]}, {"id": "P470", "text": ["Let's Begin the Lesson on WORK AND POWER MEASUREMENTS.FINITY................"], "jumps": ["P440"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1010", "text": ["When a force affects the motion of an object moving in the direction of an applied force, we can say that work is done."], "jumps": ["P1020", "P1001"]}, {"id": "P1020", "text": ["The most important element of force is motion: for work to actually be done, the object must move from one place to another."], "jumps": ["P1030", "P1010"]}, {"id": "P1030", "text": ["For example, no matter how long you hold a heavy load on your shoulders, you are not doing any work on the load."], "jumps": ["P1040", "P1010"]}, {"id": "P1040", "text": ["In reality, you are only exerting an upward force in an attempt to counteract the downward force of gravity on the load."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["To get any work done, the load must move. If you raise the load over your head you have done work."], "jumps": ["P1060", "P1030"]}, {"id": "P1060", "text": ["In this example, a force has been exerted which has a component in the direction in which the object moves."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["Two factors must be considered when measuring values of work: the displacement of the object and the magnitude of the force applied in the displacement's direction.", "(Magnitude) Force = 22 Newtonssssssssssss"], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["The amount of work (W) is a product of the applied force (F) times how far the object travels (s) and can be expressed by the following equation:", "F = 22 Newtons s = x 4 Meters W = 88 Joulessforce is applied to it. 2. For every force, there is an equal and opposite force. 3. Two forces acting on the same body cause the body's acceleration to equal zero."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["When the force is measured in newtons and the distance through which it acts is measured in meters, the work is measured in  joules.", "When the force is measured in newtons and the distance through which it acts is measured in meters, the work is measured in joules.", "F = 22 Newtons s = x 4 Meters W = 88 Joulessforce is applied to it. 2. For every force, there is an equal and opposite force. 3. Two forces acting on the same body cause the body's acceleration to equal zero."], "jumps": ["P1100", "P1070"]}, {"id": "P1100", "text": ["This unit of work was named for the English physicist, James Prescott Joule, who studied the relationship of electrical, thermal and mechanical work.", "F = 22 Newtons s = x 4 Meters W = 88 Joulessforce is applied to it. 2. For every force, there is an equal and opposite force. 3. Two forces acting on the same body cause the body's acceleration to equal zero."], "jumps": ["P1110", "P1070"]}, {"id": "P1110", "text": ["A force of one newton, acting through a distance of 1 meter, does one joule of work."], "jumps": ["P1120", "P1070"]}, {"id": "P1120", "text": ["The joule is still occasionally called a newton meter.  You can see how these two units combine to make up the joule.", "The joule is still occasionally called a newton meter. You can see how these two units combine to make up the joule."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["Let's look at an example of work.  Let's calculate how much work is required to lift a 2 kg weight to a height of 4 meters.", "Let's look at an example of work. Let's calculate how much work is required to lift a 2 kg weight to a height of 4 meters."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["First we need to calculate the total weight of the object."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["The weight of any body on earth is the object's mass times the force of gravity, which is 9.8 newtons, for every 1 kg of an object's mass."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["Further examination of the force of gravity in newtons shows us that the kilograms cancel each other out and it leaves us with only m/sec  , which gravity is supposed to be measured in.", "Further examination of the force of gravity in newtons shows us that the kilograms cancel each other out and it leaves us with only m/sec , which gravity is supposed to be measured in."], "jumps": ["P1170", "P1130"]}, {"id": "P1170", "text": ["When lifting an object vertically, we must apply a force that is equal to the weight of the object.  Since the object has a mass of 2 kilogram, we get:", "When lifting an object vertically, we must apply a force that is equal to the weight of the object. Since the object has a mass of 2 kilogram, we get:", "1. W = (mass x gravity)(distance)W = 88 Joulessforce is applied to it. 2. For every force, there is an equal and opposite force. 3. Two forces acting on the same body cause the body's acceleration to equal zero."], "jumps": ["P1180", "P1130"]}, {"id": "P1180", "text": ["Since gravity is 9.8 N/kg:", "1. W = (mass x gravity)(distance)W = 88 Joulessforce is applied to it. 2. For every force, there is an equal and opposite force. 3. Two forces acting on the same body cause the body's acceleration to equal zero."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["What is the amount of work done if a man picks up a rock with a mass of 62 kg and 2 meters off the ground?"], "jumps": ["P1170", "P1195"]}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1192", "text": ["You forgot to multiply by gravity.", "You forgot to multiply by gravity..........................", "Gravity = 9.8 N/kgavity)(distance)W = 88 Joulessforce is applied to it. 2. For every force, there is an equal and opposite force. 3. Two forces acting on the same body cause the body's acceleration to equal zero."], "jumps": []}, {"id": "P1193", "text": ["Use this equation to calculate the amount of work done.", "Use this equation to calculate the amount of work done....."], "jumps": []}, {"id": "P1195", "text": ["FINDING WORK - The first step in determining the work performed is to find the object's weight. Next, use the formula for work."], "jumps": []}, {"id": "P1200", "text": ["If we slide the same 2 kg mass a distance of 4 meters along a horizontal instead of vertical surface, the amount of work done will be different."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["First of all, the object's sliding coefficient of fricition must be taken into account."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["The sliding coefficient ( m) is the constant amount of resistance between two surfaces."], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["The lower the friction coefficient is, the less friction the surface possesses. Below are some common friction coefficients."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["Since a completely frictionless surface exists in theory only, this constant approaches, but never actually reaches zero."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["A 2 kilogram mass is moved across a surface having a .30 coefficient of sliding friction.  If the mass is moved a distance of \n4 meters, then the work equals 23.52 joules.", "A 2 kilogram mass is moved across a surface having a .30 coefficient of sliding friction. If the mass is moved a distance of 4 meters, then the work equals 23.52 joules.", "1. W = (mass x gravity)(distance)W = 88 Joulessforce is applied to it. 2. For every force, there is an equal and opposite force. 3. Two forces acting on the same body cause the body's acceleration to equal zero."], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["Notice how much more work is required to lift the same mass vertically as compared to sliding it horizontally."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["What is the amount of work required to slide a 55 kg refrigerator 17.5 meters across a floor with a friction coefficient of .45?"], "jumps": ["P1260"]}, {"id": "P1271", "text": [], "jumps": []}, {"id": "P1272", "text": ["Use this equation to calculate the amount of work done.", "Use this equation to calculate the amount of work done....."], "jumps": []}, {"id": "P1280", "text": ["In the examples we've looked at so far, the forces and distances involved did not vary, they remained constant and uniform."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["However, forces may vary either in direction or in magnitude (or both) during the time they are acting on an object."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["For example, when a force is used to stretch a spring, the magnitude of the force increases as the spring gets longer."], "jumps": ["P1310", "P1280"]}, {"id": "P1310", "text": ["One way to find the amount of work done by a varying force is by a graph having displacement (s) as the x-axis coordinates and force (F) as the y-axis coordinates."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["If the force of a spring is uniformly increasing in the direction of the stretching, we can determine the total amount of work that has been exerted."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["The force required to stretch a spring depends upon how stiff it is, but the force is always directly proportional to the amount of stretching."], "jumps": ["P1340", "P1310"]}, {"id": "P1340", "text": ["By plotting the values for force and distance on the graph, we can find the total amount of work done by finding the area of the triangle created by the inserted values."], "jumps": ["P1350", "P1310"]}, {"id": "P1350", "text": ["To find the area of the triangle, multiply one half times the product of the base and altitude."], "jumps": ["P1360", "P1310"]}, {"id": "P1360", "text": ["The base of this base is 2.5 meters.  The altitude of the triangle is 11 Newtons.  Taking one half of this product gives us the total work done, 13.75 Joules.", "The base of this base is 2.5 meters. The altitude of the triangle is 11 Newtons. Taking one half of this product gives us the total work done, 13.75 Joules.", "A = 1/2(2.5 m x 11 N) A = 1/2(27.5) A = 13.75 Joules applied to it. 2. For every force, there is an equal and opposite force. 3. Two forces acting on the same body cause the body's acceleration to equal zero."], "jumps": ["P1370", "P1310"]}, {"id": "P1370", "text": ["What is the work performed by the spring in the graph below?"], "jumps": ["P1310"]}, {"id": "P1371", "text": [], "jumps": []}, {"id": "P1372", "text": ["Use this equation to calculate the amount of work done.", "Use this equation to calculate the amount of work done....."], "jumps": []}, {"id": "P1380", "text": ["Beside constant and uniformly increasing units of work, there are also methods to calculate work done in rotary motion and work done by varying forces."], "jumps": ["P1910", "P1370", "P"]}, {"id": "P1910", "text": ["You have completed the information on WORK.", "You have completed the information on WORK. 1 TITLE........"], "jumps": ["P1001", "P1380"]}, {"id": "P1920", "text": ["1.  There are many different methods to measure energy.", "1. There are many different methods to measure energy.....", "Newtons Joules WattssssA = 1/2(27.5) A = 13.75 Joules applied to it. 2. For every force, there is an equal and opposite force. 3. Two forces acting on the same body cause the body's acceleration to equal zero."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Motion is the most important element of force.", "2. Motion is the most important element of force.........."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The displacement of the object and the magnitude of the force       (applied in the displacement's direction) are two factors                   which have to be considered.", "3. The displacement of the object and the magnitude of the force (applied in the displacement's direction) are two factors which have to be considered......", "(Magnitude) Force = 22 Newtonssssssssssss"], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.   A force of one newton, acting through a distance of 1 meter,          does one joule of work.", "4. A force of one newton, acting through a distance of 1 meter, does one joule of work."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  The lower the friction coefficient is, the less friction the                     surface possesses.", "5. The lower the friction coefficient is, the less friction the surface possesses...."], "jumps": ["P1999", "P1950"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1960"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2010", "text": ["Like the term \"work'', the term \"power'' has a scientific meaning much different than its everyday meaning."], "jumps": ["P2020", "P2001"]}, {"id": "P2020", "text": ["When we say a person has great power, we usually mean he/she has great strength, or he/she wields great authority."], "jumps": ["P2030", "P2010"]}, {"id": "P2030", "text": ["In science, the term \"power'' is much different. Power is defined as the time rate of doing work."], "jumps": ["P2020", "P2040"]}, {"id": "P2040", "text": ["Time considerations are normally not involved in the definition of work."], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["If you lift a barbell weighing 400 Newtons a distance of 3 meters at constant velocity, you do 1200 Joules of work if it takes you\n1 second, 1 hour or 1 year.", "If you lift a barbell weighing 400 Newtons a distance of 3 meters at constant velocity, you do 1200 Joules of work if it takes you 1 second, 1 hour or 1 year.."], "jumps": ["P2060", "P2030"]}, {"id": "P2060", "text": ["Also, the same amount of work is done whether you climb a flight of stairs in one minute or five minutes.", "6 Newtons = 6 Newtonsssssssssssssssssssssssss"], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["Often, we need to know how quickly or slowly work is done. Measurements of power are most commonly used in mechanics and electronics."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["To accurately define power, three factors must be taken into consideration."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["The displacement of the object, the force in the direction of the displacement, and the time required all combine to describe an object's power.", "Displacement = 20 meters Force = 7 Newtons Time = 4 secondsss"], "jumps": ["P2100", "P2070"]}, {"id": "P2100", "text": ["Since power is the time rate of doing work, we can define it using the following equation: P = W/t where P represents power, W represents work and t is time.", "P represents power W represents work t dis timeeons Time = 4 secondsss"], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["When work equals the product of the force (F) of the object and the object's displacement (s), this equation can also be stated like this:", "Power = in WattsW represents work t is timeeNewtons Time = 4 secondsss"], "jumps": ["P2120", "P2090"]}, {"id": "P2120", "text": ["When work is measured in Joules and time is measured in seconds, power is expressed in Watts (W)."], "jumps": ["P2130", "P2090"]}, {"id": "P2130", "text": ["The watt, which is named in honor of the physicist James Watt, is defined as one joule per second.", "The watt, which is named in honor of the physicist James Watt, is defined as one joule per second. Work", "1 Watt = n Watts W represents work t is timeeNewtons Time = 4 secondsss"], "jumps": ["P2140", "P2090"]}, {"id": "P2140", "text": ["When work is measured in the British system's foot pounds, the unit of power is the foot pounds per second.", "A larger unit, known as horsepower (hp), is also used to measure power:", "Watt = n Watts W represents work t is timeeNewtons Time = 4 secondsss", "1 hp = 550 ft - lbs/sec = 33,000 ft - lbs/min eeNewtons Time = 4 secondsss"], "jumps": ["P2150", "P2130", "P2160"]}, {"id": "P2160", "text": ["This means that a 1 horsepower motor running at full load does 33,000 foot  pounds of work every minute.", "This means that a 1 horsepower motor running at full load does 33,000 foot pounds of work every minute."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["Since the metric watt is much more common, let's look at some examples of power using the watt."], "jumps": ["P2180", "P2150"]}, {"id": "P2180", "text": ["Since the standard watt is an inconveniently small unit, power is more commonly measured in units of 1000 watts, called kilowatts (kw)."], "jumps": ["P2150", "P2190"]}, {"id": "P2190", "text": ["A machine does 500 joules of work.   If we want to determine how much power the machine does in a span of 30 seconds, we use the formula for power.", "A machine does 500 joules of work. If we want to determine how much power the machine does in a span of 30 seconds, we use the formula for power.", "= 5 lbs/sec = 33,000 ft lbs/min s timeeNewtons Time = 4 secondsss"], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["What is the amount of power output of an engine that does 35,000 joules of work in two minutes?"], "jumps": ["P2190", "P2205"]}, {"id": "P2201", "text": [], "jumps": []}, {"id": "P2202", "text": ["You multiplied Joules times two minutes.  Use this formula to find the power output.", "You multiplied Joules times two minutes. Use this formula to find the power output.", "= 5 lbs/sec = 33,000 ft lbs/min s timeeNewtons Time = 4 secondsss"], "jumps": []}, {"id": "P2203", "text": ["You divided joules by two minutes You need to divide joules by a specified number of  seconds.", "You divided joules by two minutes You need to divide joules by a specified number of seconds."], "jumps": []}, {"id": "P2205", "text": ["= 5 lbs/sec = 33,000 ft lbs/min s timeeNewtons Time = 4 secondsss", "FINDING WORK - Remember, since watts are defined in joules per second, the time interval must be converted to seconds. Then, the formula for power can be used:"], "jumps": []}, {"id": "P2210", "text": ["Watts are derived from several different units of measurement. Meters, kilograms, seconds, newtons, and joules all combine together to make up the watt."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["Because of this, we don't necessarily have to know the amount of work that is done to calculate power."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["For example, as part of a charity fund-raising drive, a Chicago marathon runner with a mass of 50 kg runs up the stairs to the top of the Sears Tower, which is 443 meters tall, in 15 minutes. Let's find his average power output in watts.", "For example, as part of a charity fund-raising drive, a Chicago marathon runner with a mass of 50 kg runs up the stairs to the top of the Sears Tower, which is 443 meters tall, in 15 minutes. Let's find his average power output in watts..."], "jumps": ["P2240", "P2210"]}, {"id": "P2240", "text": ["First, the runner's total work is his weight (remember, mass times gravity) multiplied by the height he climbs.", "First, the runner's total work is his weight (remember, mass times gravity) multiplied by the height he climbs. = mgh 1. W = (50 kg)(9.8 N)(443 m) 2. W = (490)(443) 3. W = 217,070 Newtons per second 4. W = 217,070 joules", "1. W = (50 kg)(9.8 N/kg)(443 m) 2. W = (490 N)(443 m) 3. W = 217,070 newton meters 4. W = 217,070 joules"], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["Now that we have calculated the amount of work that has been done, we now have to account for the time interval to get the power."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["The time is 15 minutes. Since power is defined in terms of seconds, we have to convert 15 minutes to seconds."], "jumps": ["P2270", "P2240"]}, {"id": "P2270", "text": ["Since there are 60 seconds in a minute, this means that there are 900 seconds in 15 minutes.  We now have our time interval and we're ready to figure the average power output.", "Since there are 60 seconds in a minute, this means that there are 900 seconds in 15 minutes. We now have our time interval and we're ready to figure the average power output."], "jumps": ["P2280", "P2240"]}, {"id": "P2280", "text": ["Dividing the time interval into the total amount of work done gives us the average power for the athlete.", "1. W = (50 kg)(9.8 N)(443 m) 2. W = (490)(443) 3. W = 217,070 Newtons per second 4. W = 217,070 joules 1"], "jumps": ["P2290", "P2240"]}, {"id": "P2290", "text": ["It takes a crane 9.2 seconds to lift a 1620 kilogram truck from the ground to the top of a scrap heap, which is 130 meters high. What is the amount of power exerted by the crane?"], "jumps": ["P2240", "P2295"]}, {"id": "P2291", "text": [], "jumps": []}, {"id": "P2292", "text": ["Use this formula to find the power output.", "Use this formula to find the power output..................", "1. W = (50 kg)(9.8 N)(443 m) 2. W = (490)(443) 3. W = 217,070 Newtons per second 4. W = 217,070 joules"], "jumps": []}, {"id": "P2295", "text": ["FINDING POWER - The best way to approach this problem is by a three step process.", "Steps 1. Calculate the force exerted by the truck: (Force = mass times gravity) 2. Calculate the amount of work done by the crane: (Work = force times the distance 3. Calculate the total power used by the crane: (Power = work divided by time)", "Example 1. F = (77 kg)(9.8 m/sec) 2. W = (754.6 N)(32 meters) W = 24147.2 Joules 3. 24147.2 Joules P = 12 seconds Total Power = 2012.27 Watts Total Power = 2012.27 Wattsme) Total Power = 2012.27 WattsWattssss= work divided by time) Total Power = 2012.27 Wattsr = 2012.27 Wattser = 2012.27 Wattsssssssssssssssssssssssane: (Power = work divided by time) Total Power = 2012.27 Wattsssssssssssssss27 Watts"], "jumps": ["Power"]}, {"id": "P2300", "text": ["The watt is a familiar unit of electrical power; a 100 watt light bulb converts 100 joules of electrical energy into light and heat per second."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["The watt does not have to be an electrical unit, though; a light bulb could be rated in horsepower."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["Also, some automobile makers rate their engines in kilowatts rather than the standard horsepower."], "jumps": ["P2330", "P2300"]}, {"id": "P2330", "text": ["Power units can be used to define new units of work or energy. For example, the kilowatt-hour (kWh) is the standard unit for measuring the electricity in our homes."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["A kilowatt-hour is the total work done in 1 hour (3600 sec) when the power is 1 kw.  This means:", "A kilowatt-hour is the total work done in 1 hour (3600 sec) when the power is 1 kw. This means:", "1. W = (50 kg)(9.8 N)(443 m) 2. W = (490)(443) 3. W = 217,070 Newtons per second 4. W = 217,070 joules", "1 kWh = (1000 J/sec)(3,600 sec) = 3,600,000 J"], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["It is very important to remember that the kilowatt-hour is a unit of work or energy, not power.  You can see this by the way the units cancel each other out.", "It is very important to remember that the kilowatt-hour is a unit of work or energy, not power. You can see this by the way the units cancel each other out.", "1. W = (50 kg)(9.8 N)(443 m) 2. W = (490)(443) 3. W = 217,070 Newtons per second 4. W = 217,070 joules", "1 kWh = 1000 watts x 3600 seconds 1 kWh = 1000 j/sec x 3600 seconds 1 kWh = (j/sec)(sec/1) 1 kWh = joules", "1 Kilowatt-Hour 9.8 N)(443 m) 2. W = (490)(443) 3. W = 217,070 Newtons per second 4. W = 217,070 joules y"], "jumps": ["P2360", "P2330"]}, {"id": "P2360", "text": ["Although energy, work, and power are abstract physical quantities, they still can be bought and sold."], "jumps": ["P2370", "P2350"]}, {"id": "P2370", "text": ["Although we can't buy a newton of force or a meter per second of velocity, a kilowatt-hour of energy usually costs from two to ten cents, depending on the location and the amount purchased."], "jumps": ["P2380", "P2350"]}, {"id": "P2380", "text": ["For example, if a house consumes 325 kilowatt hours of power (actually, energy) in a week, and the rate is 8 cents per kilowatt, we can determine what the month's power bill will be."], "jumps": ["P2390", "P2370"]}, {"id": "P2390", "text": ["By multiplying the rate times the total number of kilowatt hours used in a week, we have the total cost of electricity for a week.", ".08 (rate) x 325 kilowatt hours (energy used per week) = $26 per week", ".08 (rate) x 325 kilowatt hours (energy used per week) = $26 per weekkkkkkkkkkkkkkkkkkkkkkkkkkk"], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["Since there are four weeks in a month, we multiply this figure by four to figure out the month's power bill.", "$26 per week x 4 weeks let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
