const book = {"title": "9395Z812", "pages": [{"id": "PINFO", "text": ["08-24-04 Converted sty to tbk. frieda 08-27-04 Reviewed tbk f", "08-24-04 Converted sty to tbk. frieda 08-27-04 Reviewed tbk file for function. frieda 11-22-04 Graphics. mary & sarah. 11-22-04 Review of text and branching. frieda 11-22-04 Made graphic change as per Ray. -Sarah.", "u u", "5 g", "<<*)('&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&$ ;", "' #", ";! :::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::", ";!! :", "%%S&%Z%%Z&%Z%%Z%%[&%[&%['&[&&['&]'']((]((^))_*)^)(]((]((_**^))]((])(])(\\''\\'']((])(])(^))]((\\''\\''\\''Z&&Z%%Z%%Y%$X$$X$#X##W\"\"W\"\"W\"\"W\"\"U!!U U!!U!!U!!U T", "U V\"\"U!!V\"\"W\"\"V\"\"W\"\"X##X%$Y%$X##X##Y$$Y%%Z%%\\''['&Z%%['&\\''])(^))])(Z))", "x))M&&W%%W%%V%%W&%W&%W'&W&&W'&Y''Z((Z)(Z*)[*)Z((Z((Z))Z*)Z((Z)(Z)(X''X''Z)(Z)(Z))Z))Y''X''X''W&&W%%V%%U%$T$$T$#T##S\"\"S\"\"S\"\"R\"\"Q Q!!Q!!Q!!Q!!P", "Q R\"\"Q!!S\"\"R\"\"R\"\"T##T$$U%%T##T##U$$U%%W%%X''W&&W%%X''Y('Z))Z)(S++u"], "jumps": ["P", "PP", "P8S", "P7"]}, {"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ..", "Title: TACHOMETER, TORQUE AND POSITION INDICATING SYSTEMS"], "jumps": []}, {"id": "P10", "text": ["TACHOMETER, TORQUE AND POSITION INDICATING SYSTEMS"], "jumps": []}, {"id": "P100", "text": ["1. Tachometer, and Position Indicating Systemsitem 2 here. item 2 here.e.e.", "2. Torque and Basic Instrument Maintenance.ne item 2 here. item 2 here.e.e.", "w Recognize the operating principles and characteristics of tachometer, and position indicating systems.", "w Recognize the operating principles and characteristics of torque systems. w Identify the basic procedures used in maintaining aircraft instruments.."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["This lesson introduces the principles and concepts of aircraft tachometer, torquemeter and position indicating systems instruments."], "jumps": []}, {"id": "P410", "text": ["The engine, like the human heart is the vital component of any aircraft. The engine provides the means to pump the fluids and drive the auxiliary systems of the aircraft.", "b44b4hb4444444444444444446 )}N644464444b) 6664", "4444b{4b444b{4444444444444444444)NN}}64b44{4bbd 66bg", "4)644444b4{4h44444444444b446))N}64b44bb444) 6)", "b44b4b44446b44444644b444b4646bb466464b444464b4464644646446446b464b4464464444444464664444464b44644646464)4664444bbbb N}N644b", "!t44bb4b4b46bb4b4b444b4b44b4444444446b446b444646444b46446464644646464646446464664644444644446b46446444444444646664644))}}}4bb4bb4 NNNN", "4b44b4446b4b4bbb4bbb4b44b44bb4b4b6b446b46446444b4646444644b4646646464646444464444b4b4444444b644444444444)4644444464)))N}}444b44) NNN5S"], "jumps": []}, {"id": "P420", "text": ["Like the heart, the engine must perform under varying degrees of stress and environmental conditions for long durations without a failure.", "y3[T tNNZ$^((___&&&&&jjbY 9 9|| | | |"], "jumps": []}, {"id": "P430", "text": ["Instrumentation allows the aircrew to continuously monitor the performance of the engine and its auxiliary systems, the position of flight controls and the landing gear."], "jumps": []}, {"id": "P440", "text": ["Let's begin the lesson on TACHOMETER, TORQUE AND POSITION INDICATING SYSTEMS."], "jumps": []}, {"id": "P900", "text": ["1. Tachometer, and Position Indicating Systems.", "2. Torque and Basic Instrument Maintenance."], "jumps": []}, {"id": "P1001", "text": ["TACH, TORQUE & POS INDICATING SYSNG SYSSSSSSSSSSSSSSSSSSSS", "TACH, TORQUE & POS INDICATING SYSNG SYSTEMSMSSTEMS"], "jumps": []}, {"id": "P1020", "text": ["Aircraft position systems instruments provide indications of the mechanical movement of position indicating and the remote indicating of SELSYN (Synchro) systems, such as tachometers, torquemeters and synchroscopes."], "jumps": ["P1001"]}, {"id": "P1025", "text": ["SELSYN - is a contraction of the term Self-Synchronous and is a registered trade name for a DC synchro system. About 1943, synchro, became the general term, replacing the word, Selsyn.."], "jumps": []}, {"id": "P1030", "text": ["The needles of remote-indicating Selsyn (synchro) systems indicators, such as flaps, tachometers and torquemeters move in synchronization with the device being monitored."], "jumps": ["P1020"]}, {"id": "P1040", "text": ["There are three types of aircraft remote-indicating Selsyn synchro systems: the DC Selsyn, the AC Magnesyn system, and the AC Autosyn system."], "jumps": []}, {"id": "P1050", "text": ["The DC Selsyn is a circular wound resistance element with two wipers that are driven by the movement of the monitored device inside. The DC Selsyn System is used to measure the movements of the engine cowl flap position or stabilizer position..."], "jumps": []}, {"id": "P1060", "text": ["A DC potential is applied to one wiper, and ground potential to the second wiper. As the monitored device moves, current flows through the wipers into the circular wound resistance element and into three coils spaced 120"], "jumps": []}, {"id": "P1070", "text": ["Current from the wipers flows into the indicator coils spaced 120", "apart, creating a moving magnetic field. A permanent magnet with an attached needle senses the field and rotates in synchronization as the field changes..."], "jumps": []}, {"id": "P1080", "text": ["As the permanent magnet moves, the attached needle moves across a calibrated indicator dial to display the position of the monitored device."], "jumps": []}, {"id": "P1090", "text": ["The AC Magnesyn is a magnetic Selsyn remote indicating system. The Magnesyn uses permanent magnets for the rotors and wire wound permeable ring cores for the fixed elements (stators)..."], "jumps": []}, {"id": "P1100", "text": ["The wire wound permeable ring type cores are also known as toroidal coils.."], "jumps": []}, {"id": "P1105", "text": ["TOROIDAL - a doughnut shaped permeable core wound with a resistance wire to create a magnetic field.."], "jumps": []}, {"id": "P1110", "text": ["The toroidal coils on the transmitter and indicator are normally tapped and tied together at 120", "apart and the two leads are excited with 26 volt, 400Hz AC.."], "jumps": ["P1100"]}, {"id": "P1120", "text": ["The shaft of the monitored device is attached to the permanent magnet (rotor) and freely moves within the toroidal coil of the transmitter. The permanent magnet with the attached needle in the indicator moves in synchronous to the transmitter..."], "jumps": []}, {"id": "P1130", "text": ["When the monitored device is stationary, no current flows in the coils, and the flux from the permanent magnet flows through the permeable cores. Device movement causes current to flow, allowing the flux from the permanent magnet to magnetically saturate the permeable cores..."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["The coils excited with the 26-VAC, 400-Hz signal cause the cores to become saturated and then demagnetized at twice the rate. When the 400-Hz signal voltage is at zero, the reluctance of the core is low..."], "jumps": []}, {"id": "P1145", "text": ["RELUCTANCE - magnetic resistance, being equal to the ratio of magneto motive force to magnetic flux."], "jumps": []}, {"id": "P1150", "text": ["As the magnetic flux lines cut across the windings they induce a voltage (emf) in the transmitter and indicator windings. The movement of the flux lines increases until point Y on the 400-Hz sine wave, then tapers off and stops at point Z..."], "jumps": ["P1140"]}, {"id": "P1160", "text": ["At point Z, no voltage is induced into the windings. As the 400 Hz sine wave drops toward point X1, the reluctance of the core decreases. The core now attracts more flux lines from the permanent magnet inducing a voltage into the windings....."], "jumps": []}, {"id": "P1170", "text": ["As the 400 Hz sine wave reaches X1, the core becomes saturated and the voltage in the windings again drops to zero. The same action takes place during the negative half of the 400 Hz excitation sine wave."], "jumps": []}, {"id": "P1180", "text": ["The current flow in the windings will vary with the position of the permanent magnets. The induced voltage from the transmitter causes the magnet with its attached needle in the indicator to follow its movement..."], "jumps": []}, {"id": "P1190", "text": ["The Compass system sensors and indicators in the aircraft are Magnesyn systems. The compass transmitter, called a flux valve, detects the direction of flux lines of the magnetic field of the earth..."], "jumps": []}, {"id": "P1200", "text": ["The flux valve is usually mounted within the wing or tail of the aircraft far away from any equipment generating a magnetic disturbance. It consists of a hermetically sealed bowl containing a pendulous element in a damping fluid..."], "jumps": []}, {"id": "P1210", "text": ["As the aircraft turns, the permanent magnet inside the flux valve points to the earth's magnetic field. Current flows into the toroidal windings causing the permanent magnet in the indicator to follow the magnet in the transmitter...", "000000000000000000000000000000000000000000 N"], "jumps": []}, {"id": "P1220", "text": ["The Autosyn is an automatic synchro system. The Autosyn, like the Magnesyn is used for the same purposes, but electromagnets vice permanent magnets are used for the rotors."], "jumps": []}, {"id": "P1230", "text": ["The Autosyn consists of a transmitter and at least one receiver. The synchro transmitter consists of a three phase rotary transformer. The single-phase rotor is driven from a 400-Hz AC source..."], "jumps": []}, {"id": "P1240", "text": ["Three sensing windings physically spaced 120", "around the stator, output three sinewaves whose values are related to the shaft (rotor) angle. The receiver is connected backwards across the three outputs and its shaft (rotor) automatically follows the transmit rotor..."], "jumps": []}, {"id": "P1250", "text": ["The Autosyn system, is open loop. The input rotor is somewhat loaded, as it has to do enough work to overcome all friction, electrical losses, and output shaft load inertia."], "jumps": []}, {"id": "P1260", "text": ["When an Autosyn is powering more than just a indicator needle, such as flaps, rudder or elevator, a feedback loop is provided to dampen out any flight control surface oscillations."], "jumps": []}, {"id": "P1270", "text": ["Combinations of DC Selsyn, Magnesyn and Autosyn remote indicating synchro systems are found on private, commercial and military aircraft."], "jumps": []}, {"id": "P1280", "text": ["What Selsyn synchro system uses electromagnets for rotors??"], "jumps": ["P1270"]}, {"id": "P1281", "text": [], "jumps": []}, {"id": "P1282", "text": ["Magnesyn synchro systems use permanent magnets for rotors.."], "jumps": []}, {"id": "P1283", "text": ["The DC Selsyn uses permanent magnets......................."], "jumps": []}, {"id": "P1290", "text": ["Tachometer sensors and indicators are used to ensure aircraft engines operate within published specified limits. Running an engine beyond safe limits can be catastrophic."], "jumps": ["P1280"]}, {"id": "P1300", "text": ["The tachometer indicator is an instrument that shows the speed of a gas turbine engine's (jet) main rotor assembly. Tachometer indicators are normally either radial or vertical scale."], "jumps": []}, {"id": "P1310", "text": ["The dials of tachometer indicators used with jet engines are shown in percentage of revolutions per minute (RPM), based on takeoff RPM."], "jumps": []}, {"id": "P1320", "text": ["Aircraft utilize either Mechanical, Electric or Synchroscope tachometers. The most widely used mechanical tachometer is the magnetic drag type. A cable similar to one used in an automotive speedometer, drives a small permanent magnet at one half the crankshaft speed..."], "jumps": []}, {"id": "P1330", "text": ["An aluminum cup rides over the magnet. A steel shaft with a spring-restrained pointer is connected to the center of the cup. As the magnet spins, its lines of flux induce an eddy current into the cup..."], "jumps": ["P"]}, {"id": "P1335", "text": ["EDDY CURRENT - current induced into a conductor because of a moving or non-uniform magnetic field.."], "jumps": []}, {"id": "P1340", "text": ["The eddy current sets up a magnetic field that counters the magnetic field of the magnet and locks the cup. The restraining spring prevents the cup from fully rotating 360", "and the attached pointer indicates RPM..."], "jumps": ["P1330", "P"]}, {"id": "P1350", "text": ["Magnetic drag tachometers are normally checked with a stroboscope or laser tachometer to verify the accuracy of the instrument."], "jumps": []}, {"id": "P1355", "text": ["STROBOSCOPE - A Stroboscopic tachometer is used to measure rotational speed by use of a brilliant pulsing light calibrated in terms of revolutions per minute (RPM)."], "jumps": []}, {"id": "P1370", "text": ["A Laser tachometer is used to measure rotational speed of a rotating element by bouncing a laser beam from a reflective contrasting mark."], "jumps": ["P1350"]}, {"id": "P1380", "text": ["The electric tachometer system is an AC Autosyn (Automatic Synchro) system that consists of an AC generator coupled to the aircraft engine and an indicator consisting of a magnetic-drag element on the instrument panel..."], "jumps": []}, {"id": "P1390", "text": ["The generator transmits electric power to a synchronous motor in the indicator. The frequency of the power is proportional to the engine speed. The magnetic-drag principle is applied to the pointer to indicate speed."], "jumps": []}, {"id": "P1400", "text": ["Multiengine aircraft tachometers typically have built in synchroscopes. Small disks are cut into the instrument dial, one segment's color lighter than the other. When the two engines are turning at exactly the same speed, the output torque from the two AC tachometer generators cancel out and the segments don't move.."], "jumps": []}, {"id": "P1410", "text": ["When one engine turns faster than the other, the torque is greater on one of the engines and the disk segment turns in the direction of the faster engine."], "jumps": []}, {"id": "P1420", "text": ["The tachometer generator consists of a permanent-magnet two-or four-pole rotor and a stator that develops three-phase AC power as the rotor turns. The armature of the generator consists of a magnetized rotor cast directly onto the generator shaft..."], "jumps": []}, {"id": "P1430", "text": ["The stator consists of a steel ring with a laminated core of ferromagnetic material. A three-phase winding goes around the core and is insulated from it. The winding is attached to the receptacle connector..."], "jumps": []}, {"id": "P1440", "text": ["A wire harness connects the tachometer generator from the engine compartment to the cockpit instrument panel and into the tachometer indicator. Tachometer indicator types vary with the number of engines on an aircraft...", "LL!!!!!! MMMMMMMMMMMMMMM !!!!!!L", "L!!!!!!! MMMMMMMMMMMMM !!!!!!LL", "L!!!!!! MMMMMMM((((((MMMMMM !!!!!!L", "L!!!!!! MMMMM((((((((((((((((MMMM !!!!!L", "(MM !!!!!!!!LLLLL!!!!!!!!!! MMM(((", "(MMM !!!!!!!!!!!!!!!!!!!!! MMM(((", "!!!!!!!!!!!LLL!!!!!!!!!!!!!!! MMM(((", "LL!!!!!!!! MMMMMMMMM((((((MMMMMMMM !!!!!L", "LL!!!!!!!!! !!!!!!LL"], "jumps": []}, {"id": "P1450", "text": ["Multiengine type tachometer indicators are dual element, while single engine types are single element. The operating principles of the two types are basically the same."], "jumps": []}, {"id": "P1460", "text": ["The single element tachometer (radial) indicator consists of a synchronous motor and an indicating element. The motor runs in synchronism with the tachometer generator and drives the indicating element through the magnetic-drag coupling process..."], "jumps": []}, {"id": "P1470", "text": ["A pointer attached to the indicating element indicates the speed of the (synchronous motor), therefore, the speed of the aircraft engine."], "jumps": []}, {"id": "P1480", "text": ["The synchronous motor consists of a three-phase stator winding that goes in, and is insulated from, a laminated circular core. Within the core is a shaft with its corresponding rotating components..."], "jumps": []}, {"id": "P1490", "text": ["A hysteresis disk at one shaft end and a spring at the other restrain longitudinal motion of the permanent magnet rotor. The spring is secured to the shaft to transmit torque from the rotor to the shaft..."], "jumps": []}, {"id": "P1495", "text": ["HYSTERESIS - A condition in which a physical action lags behind its cause. A spring is often slow to return to its original length when the load is removed due to friction."], "jumps": ["P", "P6", "PS"]}, {"id": "P1500", "text": ["The armature of the synchronous motor consists mainly of the permanent magnet and the hysteresis disk. The permanent magnets material provides starting and running torque at low speeds, while the hysteresis disk provides starting torque at high speeds..."], "jumps": ["P1490"]}, {"id": "P1510", "text": ["One end of the motor shaft extends through the front-end shield and supports the drag-magnet assembly. The drag-magnet assembly consists of two plates with attached small permanent magnets..."], "jumps": []}, {"id": "P1520", "text": ["The permanent magnets are positioned to concentrate the flux near the outside edges of the drag disk. This arrangement obtains maximum torque with minimum weight."], "jumps": []}, {"id": "P1530", "text": ["A low-temperature coefficient alloy disk is placed between the plates and magnets to reduce the chance of temperature changing the material's resistance. The magnets spinning around the disk of conducting material produces torque to the disk..."], "jumps": []}, {"id": "P1540", "text": ["The drag disk connects to the lower end of the indicator assembly shaft. As the disk rotates, the indicator pointer moves to show the speed of the aircraft engine. The scale plate is calibrated either in RPM or percentage and shows engine speed..."], "jumps": []}, {"id": "P1550", "text": ["Multiengine aircraft utilize a dual element tachometer for each pair of engines. The dual tachometer consists of two synchronous-motor magnetic-drag elements housed in one indicator. The indicator shows the speed of both engines simultaneously..."], "jumps": []}, {"id": "P1560", "text": ["What increments are aircraft turbine engine tachometers calibrated?"], "jumps": ["P1540"]}, {"id": "P1561", "text": [], "jumps": []}, {"id": "P1562", "text": ["Aircraft turbine engine tachometers are calibrated to a percentage of rated RPM."], "jumps": []}, {"id": "P1570", "text": ["Tachometer system indicators respond to changes in _______."], "jumps": ["P1560"]}, {"id": "P1571", "text": [], "jumps": []}, {"id": "P1572", "text": ["Tachometers use a three-phase AC generator that produces a variable frequency alternating current that drives a synchronous motor in the indicator."], "jumps": []}, {"id": "P1580", "text": ["What type of motor is normally used in electric tachometers???"], "jumps": ["P1570"]}, {"id": "P1581", "text": [], "jumps": []}, {"id": "P1582", "text": ["Aircraft turbine engines use a three-phase AC generator...."], "jumps": []}, {"id": "P1583", "text": ["Electric tachometers use a three-phase permanent magnet generator, that produce a three-phase alternating current to a synchronous motor in the indicator."], "jumps": []}, {"id": "P1910", "text": ["You have completed the information on TACHOMETER, TORQUE AND POSITION INDICATING SYSTEMS."], "jumps": ["P1001", "P1580"]}, {"id": "P1920", "text": ["1. Aircraft position systems instruments provide indications of the mechanical movement of position indicating and the remote indicating of synchro systems, such as tachometers, torquemeters and synchroscopes..."], "jumps": ["P1001"]}, {"id": "P1930", "text": ["2. Aircraft instruments can only be calibrated and repaired by the manufacturer or an FAA certificated repair station. A certificated mechanic with airframe and power plant ratings may not repair or alter any aircraft instrument..."], "jumps": []}, {"id": "P1940", "text": ["3. Position indicating lights normally controlled by a micro switch are used to indicate the mechanical movement of the landing gear and cabin doors.."], "jumps": []}, {"id": "P1950", "text": ["4. The DC Desyn System is used to measure the movements of engine cowl flap position or stabilizer position."], "jumps": []}, {"id": "P1960", "text": ["5. A Magnesyn remote indicating system is used by the magnetic compass system. The Magnesyn uses permanent magnets for the rotors and wire wound permeable ring cores for the fixed elements (stators)."], "jumps": []}, {"id": "P1970", "text": ["6. The Autosyn is used to measure engine RPM and aircraft flight control surface position and uses electromagnets for the rotors."], "jumps": []}, {"id": "P1980", "text": ["7. The single element tachometer (radial) indicator consists of a synchronous motor and an indicating element. The motor runs in synchronism with the tachometer generator and drives the indicating element through the magnetic-drag coupling process."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["It is essential that the flight crew know the power the engines are developing in flight. There are no mechanical instruments to provide this information directly, but power can be computed by knowing the RPM, manifold pressure, pressure altitude and outside air temperature..."], "jumps": []}, {"id": "P2030", "text": ["Aircraft Handbooks charts enable the flight crew to calculate Indicated Horsepower (IHP), Brake Horsepower (BHP) and Friction Horsepower (FHP) for a given engine and aircraft altitude..."], "jumps": []}, {"id": "P2040", "text": ["A torquemeter measures the power level an engine develops on the ground and in flight. Most systems use torquemeter oil pressure to actuate a torque- indicating instrument in the cockpit."], "jumps": []}, {"id": "P2050", "text": ["Brake horsepower (BHP) is the horsepower actually delivered to the output shaft of an engine. By knowing the BMEP and RPM, the flight crew can determine the brake horsepower the engine is developing. ,0000 BHP - Brake Horsepower L - Length of the stroke in feet A - Area of the piston head in square inches. (0.7854 x bore2) N - Number of power strokes per minute per cylinder. (RPM ( 2) K - Number of cylinders 33,000 - A constant, which is the number of foot-pounds per minute of work in one horsepower.r.", "BHP = (BMEP) LANK 33,0000 BHP - Brake Horsepower L - Length of the stroke in feet A - Area of the piston head in square inches. (0.7854 x bore2) N - Number of power strokes per minute per cylinder. (RPM", "2) K - Number of cylinders 33,000 - A constant, which is the number of foot-pounds per minute of work in one horsepower.."], "jumps": []}, {"id": "P2060", "text": ["Monitoring torque is important because most modern aircraft engines are capable of producing significantly more power than the supporting airframe can handle. For this reason, aircraft manufacturers establish engine flat rate torque limits..."], "jumps": []}, {"id": "P2070", "text": ["The electric torquemeter system in turboprop aircraft measures the torque (horsepower) produced by the engine at the extension shaft."], "jumps": []}, {"id": "P2080", "text": ["The system measures the torsional deflection (twist) of the extension shaft as it sends power from the engine to the propeller."], "jumps": []}, {"id": "P2090", "text": ["The torquemeter indicator registers the amount of deflection in shaft horsepower."], "jumps": []}, {"id": "P2100", "text": ["The extension shaft of the engine consists of two concentric shafts. The inner shaft is the power-transmitting shaft and the outer shaft attaches to the inner shaft at the rear end. Toothed flanges on the front end of each shaft rotate in the field of magnetic pickups..."], "jumps": []}, {"id": "P2110", "text": ["When the engine is running, the teeth on the flange of the driving (inner) shaft move in relation to the teeth on the flange of the outer reference shaft. The displacement between the shafts is proportional to the torque load on the driving shaft..."], "jumps": []}, {"id": "P2120", "text": ["This displacement causes a phase displacement between the pickup signals. The phase angle of the resultant signal is linearly proportional to the shaft deflection. The phase detector and amplifier in the indicator converts the signal to current.."], "jumps": []}, {"id": "P2130", "text": ["The current goes to a servomotor, which drives the rotor of a synchro control transformer in the indicator. The synchro control transformer balances the synchro system when the pointer registers the measured torque..."], "jumps": []}, {"id": "P2140", "text": ["Monitoring torque produced by modern turboprop engines is extremely important, because these engines can produce more power than the airframes are designed to handle."], "jumps": []}, {"id": "P2150", "text": ["Aircraft manufacturers establish a flat-rate limit for the torque and engine is allowed to produce. The flat-rate limit holds until the aircraft reaches a pressure altitude where power is limited by the exhaust gas temperature (EGT).."], "jumps": []}, {"id": "P2160", "text": ["Normally, at low altitude or cold temperatures, the engine is torque limited because the density altitude is low. At higher altitudes or hot temperatures, the engine is temperature limited because the density altitude is high..."], "jumps": []}, {"id": "P2170", "text": ["Most torquemeters on turboprop engines, are modified oil pressure gages with dials graduated in foot-pounds or horsepower. The engine's developed horsepower is determined by the relationship between RPM and the engine's torque..."], "jumps": []}, {"id": "P2180", "text": ["Power generated by the stages of the turbine engine are delivered to the reduction gears via a long, thin torsion shaft splined at both ends."], "jumps": []}, {"id": "P2190", "text": ["For a given horsepower, RPM and Torque are inversely proportional. K Factor is a constant for a particular engine, normally around (0.0001)", "Horsepower (HP) = K (factor) x RPM x Torque (foot-pounds) K Factor is a constant for a particular engine, normally around (0.0001)"], "jumps": []}, {"id": "P2200", "text": ["If the turbine and compressor are turning at 100%, (approximately 40,000 RPM), the torque applied to the torsion shaft is around 100 foot-pounds and is easily supported by the shaft..."], "jumps": []}, {"id": "P2210", "text": ["However, a 26:1 propeller reduction gear ratio would reduce the turbine speed to 1,500 RPM and place approximately 2,500 foot-pounds of torque or 375 horsepower on the propeller shaft. 0.0001 x 1500 x 2500 = 375 horsepowerrr", "Horsepower (HP) = K (factor) x RPM x Torque (foot-pounds) = 0.0001 x 1500 x 2500 = 375 horsepower"], "jumps": []}, {"id": "P2220", "text": ["Negative torque can be caused by a slowing or stopping of the power section (engine flame out), air gust on the propeller, or a steep and rapid descent. Negative torque can cause aircraft directional (yaw) control problems..."], "jumps": []}, {"id": "P2230", "text": ["When the reduction gearbox senses negative torque the Negative Torque System actuator drives the propeller to increase blade angle, thus slowing the propeller and relieving the negative torque condition..."], "jumps": []}, {"id": "P2240", "text": ["If the Negative Torque System fails, the Safety coupling will disengage the Torquemeter assembly from the reduction gear. When this occurs, the propeller is allowed to turn freely, thus greatly reducing drag."], "jumps": []}, {"id": "P2250", "text": ["What protects the engine during a Negative Torque system failure?on mechanic?"], "jumps": ["P2240"]}, {"id": "P2251", "text": [], "jumps": []}, {"id": "P2252", "text": ["The Torquemeter assembly senses the torque generated by the propeller."], "jumps": []}, {"id": "P2253", "text": ["The Propeller brake holds the propeller from rotating if the engine was shut down during flight and decreases the time the propeller rotates after engine shutdown on the ground."], "jumps": []}, {"id": "P2260", "text": ["Technicians shall follow published FAA regulations, manufacturers operating and maintenance procedures, when working on aircraft instruments."], "jumps": ["P2240"]}, {"id": "P2270", "text": ["Aircraft instruments can only be calibrated and repaired by the manufacturer or an FAA certificated repair station. A certificated mechanic with airframe and power plant ratings may NOT repair or alter any aircraft instrument..."], "jumps": []}, {"id": "P2280", "text": ["Certificated mechanics perform 100-hour inspections on instruments. Published inspection and preventative maintenance procedures help technicians identify minor problems such as loose screws, loose grounding straps and chipped paint on aircraft instruments..."], "jumps": []}, {"id": "P2290", "text": ["Minor problems to aircraft instruments such as loose screws, loose grounding straps, and chipped paint are not considered repairs, and can be fixed by a certificated mechanic."], "jumps": []}, {"id": "P2300", "text": ["Many aircraft instruments have colored marks to identify safe, optimum and unsafe operating ranges or conditions to the maintenance technicians and flight crews. Mark Color Definition Green Arc Normal operating range Yellow Arc Caution Range White Arc Special operations range Red Arc Prohibited Range Red radial line Do not exceed indication Blue radial line Special operating condition"], "jumps": []}, {"id": "P2310", "text": ["The technician installing an instrument is responsible for ensuring the instruments are properly installed and marked for that particular aircraft. Improperly installed instruments could cause flight crew injuries or an aircraft accident..."], "jumps": []}, {"id": "P2320", "text": ["The range marking for tachometer and torque meter indicators of reciprocating, turbine and helicopter engines are defined below."], "jumps": []}, {"id": "P2330", "text": ["Aircraft instruments are mounted in steel or iron cases to reduce electromagnetic interference to adjoining instruments. Iron and steel, traps magnetic lines of flux generated by current flowing through the internal windings of the instrument.t"], "jumps": []}, {"id": "P2340", "text": ["What type of maintenance procedures can a certificated mechanic with an airframe and power plant ratings perform?", "make minor repairs to aircraft instruments", "perform 100-hour inspections of aircraft instruments"], "jumps": ["P2330"]}, {"id": "P2341", "text": [], "jumps": []}, {"id": "P2342", "text": ["Only a certificated repair station or the manufacturer can repair or alter aircraft instruments."], "jumps": []}, {"id": "P2350", "text": ["What instrument problem can be corrected by a certificated aviation mechanic?"], "jumps": ["P2340"]}, {"id": "P2351", "text": [], "jumps": []}, {"id": "P2352", "text": ["Only certificated repair stations can repair or alter aircraft instruments."], "jumps": []}, {"id": "P2910", "text": ["You have completed the information on TORQUE AND BASIC INSTRUMENT MAINTENANCE."], "jumps": ["P2001", "P2350"]}, {"id": "P2920", "text": ["1. It is essential that the flight crew know the power the engines are developing in flight. There are no mechanical instruments to provide this information directly, but power can be computed by knowing the RPM, manifold pressure, pressure altitude and outside air temperature."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2. Most torquemeters on turboprop engines, are modified oil pressure gages with dials graduated in foot-pounds or horsepower. The engine's developed horsepower is determined by the relationship between RPM and the engine's torque...."], "jumps": []}, {"id": "P2940", "text": ["3. If the Negative Torque System fails, the Safety coupling will disengage the Torquemeter assembly from the reduction gear. When this occurs, the propeller is allowed to turn freely, thus greatly reducing drag.."], "jumps": []}, {"id": "P2950", "text": ["4. Aircraft instruments can only be calibrated and repaired by the manufacturer or an FAA certificated repair station. A certificated mechanic with airframe and power plant ratings may NOT repair or alter any aircraft instrument.."], "jumps": []}, {"id": "P2960", "text": ["5. Certificated mechanics perform 100-hour inspections on instruments. Published inspection and preventative maintenance procedures help technicians identify minor problems such as loose screws, loose grounding straps and chipped paint on aircraft instruments.."], "jumps": []}, {"id": "P2970", "text": ["6. The technician installing an instrument is responsible for ensuring the instruments are properly installed and marked for that particular aircraft. Improperly installed instruments could cause flight crew injuries or an aircraft accident."], "jumps": []}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2970"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["What type of Selsyn system utilizes permanent magnets for rotors?"], "jumps": []}, {"id": "P10211", "text": ["To dampen any flight surface oscillations.", "Why is a feedback loop added to an Autosyn system?", "To allow for reduced flight surface area."], "jumps": []}, {"id": "P10212", "text": ["An aircraft turbine engine tachometer is calibrated in _______"], "jumps": []}, {"id": "P10213", "text": ["The indicator of a tachometer system is responsive to a change in _______"], "jumps": []}, {"id": "P10214", "text": ["What type of motor is used in aircraft electric tachometers?"], "jumps": []}, {"id": "P1021 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
