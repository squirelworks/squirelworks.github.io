const book = {"title": "9395T616", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: INFORMATION SYSTEMSasdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe LAN, WAN, and MAN computer networks. w Identify the topologies and common components of the various types of networks. w Define the term network and associated terminology. w Understand the RF and IR wireless networks and explain the benefits they provide. w Describe the use of spread spectrum in wireless networks..........................................."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["Computers of the past were large and complex mainframes that needed a lot of space and specialized maintenance. It was necessary to have a computer expert to execute batch jobs. Immediate results were not available. The programmer had to wait on the computer specialist running the machine...", "Since advancements have been made in computer technology, it is now feasible for educational institutes, industry, and the private sector to own and interactively operate computers from individual workstations. This enables corporations the use of a mainframe computer's speed and sophistication without investing $100,000's of dollars.....", "Careful design and organization of transmission networks is necessary to connect the vast numbers of data facilities in today's data-hungry society. Since data systems have grown in number and complexity, it is imperative to implement orderly interconnection...", "The technology now exists to allow many users and remote facilities to interconnect efficiently; there is no longer a need to have a single telephone line dedicated to each user.", "Five dedicated lines connecting six locationss", "Data flow within networks is controlled through system protocols to ensure minimum interference between users and maximum efficiency. For effective data transmission, careful consideration is given to network switching systems, line types, and network protocols. The end result is the shared use of information and resources....."], "jumps": ["P410", "P300", "P420", "P400", "P430", "P440", "P450"]}, {"id": "P450", "text": ["Let's begin the lesson on INFORMATION SYSTEMS............................."], "jumps": ["P440"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": ["The term network in telecommunications is a broad term that could be referencing any of a number of communication activities such as cellular telephone networks, ISDN (integrated services digital network), LANs (local area network), WANs (wide area network), satellite networks, and so on...", "Mobile telephone switching office (MTSO)", "Mobile unit or pocket cellular telephone", "Networks are most simply defined as an arrangement of electronic devices designed to communicate with one another. Not long ago, nearly all networks were connected to one another through a specialized system of cables, which were often complex and expensive...", "Many networks employ a variety of mediums, typically fiber optics and radio frequency (RF). More recently, wireless networks have taken center stage in the world of telecommunication networks...", "Point-To-Multi-Point Wireless Link With Antenna On Each Roof"], "jumps": ["P1030", "P1001", "P1040", "P1020", "P1050"]}, {"id": "P1050", "text": ["Most all computer networks fall into one of three categories: LANs, WANs or MANs. The two most common are LANs and WANs. LAN is an acronym for Local Area Network and a WAN is Wide Area Network. Other ways of categorizing networks are whether they are public or private, broadcast or switched..."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["There was a time when a LAN or a WAN was easily defined and their differences easily distinguished. Presently, this is not the case, because the defining factors have evolved. During the 1980s, a LAN was normally restricted to a single structure or cluster of buildings where the LAN elements were not more than a hundred to a thousand feet apart....."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["Since then, some LANs have come to encompass areas tens of miles wide. This would normally suggest a WAN, but other characteristics come into play. WANs are normally provided by a third party and are considered public networks (even though some of them aren't). That is, the service is provided to anyone willing to pay for it.....", "A telephone network is a good example of a WAN. The Internet is also a WAN, although it has many characteristics that are unique. In contrast, LANs are normally privately owned, as those found in businesses, government offices, police departments, college campuses, and even some private residences. These LANs are for the use of specific individuals and not the public.....", "Mobile telephone switching office (MTSO)"], "jumps": ["P1080", "P1060", "P1090", "P1070"]}, {"id": "P1090", "text": ["Operational speeds and error rates can also be a defining characteristic. LANs normally operate in the kilobyte range with a very small error rate. WANs are normally operating in the megabyte range but have a considerably higher rate of errors..."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["This is because WANs are often required to operate in environments that are not necessarily conducive to error-free transmissions and must perform through multiple mediums in a variety of weather conditions..."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["While LANs and WANs may be the most common network types, there is yet another form called a MAN (Metropolitan Area Network). It would be far too easy to say that a MAN is a network that serves a metropolitan area; however, it would not necessarily be correct..."], "jumps": ["P1120", "P1080"]}, {"id": "P1120", "text": ["Which computer network is the least common?................"], "jumps": ["P1110"]}, {"id": "P1121", "text": [], "jumps": []}, {"id": "P1122", "text": ["A LAN is one of the two most common computer networks......"], "jumps": []}, {"id": "P1123", "text": ["A WAN is one of the two most common computer networks......"], "jumps": []}, {"id": "P1130", "text": ["Suppose in Gotham City, USA, Wayne Corporation has three separate buildings in different parts of the city: engineering, production, and publications. All three departments have their own LAN. The Director of Operations decides that it would be advantageous for the people in production to have direct access to engineering, engineering to publications, etc..........................."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["Solution: connect the LANs together to make a MAN. After another brainstorming session, it is decided that the marketing department, located on the other side of the country, should have their LAN connected to the newly formed MAN, which results in a WAN. A MAN, then, can be thought of as two or more LANs connected together in a geographically restricted area..............."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["While enough confusion is generated in just defining the differences between LANs, MANs and WANs, pinning down the components that make up a network is harder still. This results primarily from the numerous possibilities for the configuration of the network...", "In its simplest form, a network requires two computers with the hardware (in this case, two LAN interface cards and appropriate cables) and software necessary to communicate with each other. Once you stray a few steps off that path, the complexity begins...."], "jumps": ["P1160", "P1130", "P1170"]}, {"id": "P1170", "text": ["Regardless of the type or size of a network, every computer tied to it must have a network interface card (NIC) installed and the software to operate it. The graphic illustrates a PCI Network Interface Card. There must also be a transmission path (a medium) for data...", "Many networks utilize a Client-Server configuration, where a personal computer (PC) or mainframe computer remains on at all times, operates at high speeds, and has a very large storage capacity. These servers can be either Application Servers, File Servers, or a combination of the two..."], "jumps": ["P1180", "P1160", "P1190", "PC"]}, {"id": "P1190", "text": ["Servers act as central access points for client workstations. They validate user logons and may hold software programs or files such as computer-assisted drawing (CAD) programs, databases, etc. When the user workstation consists of a simple terminal and not a PC, file servers are necessary..."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["Terminals are nothing more than a keyboard and monitor (sometimes a printer); they have no storage capacity for programs or data. Many, however, have extensive random access memory (RAM) and read only memory (ROM) as well as microprocessors...", "One other network configuration that exists in many locations is known as a peer-to-peer network. In this configuration, there is no central access point; instead, all user workstations contain their own application programs. Data, such as that contained in a database, may be shared..."], "jumps": ["P1210", "P1180", "P1220", "P1200", "P"]}, {"id": "P1220", "text": ["In this case, the workstation on which the data is stored assigns share-level access to the other workstations on the network. This configuration works quite well for low-volume networking, where each user workstation is capable of performing some of the functions of a server...", "In general terms, the cabling between computers on a network is known as the network's topology. While this is from a strictly physical point of view, it is the most commonly held viewpoint today. Topology can, however, be viewed from a physical and a logical vantage point..."], "jumps": ["P1230", "P1210", "P1240"]}, {"id": "P1240", "text": ["While there are variations on theme, LANs normally conform to one of the following physical topologies: Star, Linear Bus, Tree, Ring, or Star-wired Ring. physical refers to the configurations listed which consist of the cables, connectors and other hardware that are required to create one of the configurations. The logical aspect is the software protocol required to make it all operate.....", "* Star * Linear Bus * Tree * Ring * Star - wired Ring low signal-to-noise ratios (better noise rejection) 2) Resistance to multipath interference and 3) Resistance to jamming."], "jumps": ["P1245", "P1230"]}, {"id": "P1245", "text": ["The physical refers to the configurations listed which consist of the cables, connectors and other hardware that are required to create one of the configurations. The logical aspect is the software protocol required to make it all operate.and other hardware that are required to create one of the configurations. The logical aspect is the software protocol required to make it all operate.....", "* Star * Linear Bus * Tree * Ring * Star - wired Ring low signal-to-noise ratios (better noise rejection) 2) Resistance to multipath interference and 3) Resistance to jamming.", "The Star Topology is one of the oldest of the topologies used in networking. The telephone system was its first use. In recent years, it has become the most popular topology for all networks. Each node is directly attached to a center hub..."], "jumps": ["P1250", "P1240", "P1260"]}, {"id": "P1260", "text": ["Any data moving through the network is channeled through the hub before going to its destination. All operations performed on the network are controlled by the hub. In this topology, the hub is often called a concentrator. Star networks normally use Ethernet or Local Talk protocol.", "ETHERNET - Ethernet is a LAN used for connecting computers, printers, workstations, terminals, servers, etc. within the same building or campus. It operates at 10 Mbps over coaxial cable and twisted wire.", "Top: Ethernet LAN with a hub to link devices with twisted pair wiring. Bottom: Ethernet LAN without a hub with coaxial cable.", "For LAN interconnection, Ethernet is a physical link and data link protocol reflecting the two lowest layers of the Open System Interconnection (OSI) model, which will be discussed later in the lesson."], "jumps": ["P1290", "P1250"]}, {"id": "P1267", "text": ["LOCAL TALK - Local Talk is Apple Computer's LAN for linking Macintosh computers and peripherals. LAN hardware is called Local Talk. It is slower than Ethernet and Token Ring. Appletalk is incompatible with any other LAN.", "The linear bus topology consists of a backbone (trunk) cable with terminators at each end. The file server, PCs (workstations), printers, or other peripherals are connected directly to the trunk. When data is transmitted from one node on the bus to another node, the transmitting station listens to the current activity on the bus....."], "jumps": ["P1300", "P1262"]}, {"id": "P1300", "text": ["If no other stations are transmitting data, that is, if the channel is clear, then it begins its transmission of data. All nodes connected to the bus are receivers of that transmission, typically a data packet. Each receiver then determines if the received data packet corresponds to its own address..."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["If it does, then the data is acted on; if it does not, then the data is simply discarded. No routing or switching is involved, nor is there any transference of messages from one node to another. The overhead and time required to perform these tasks are eliminated with the bus LAN, hence one of its major attractions..."], "jumps": ["P1320", "P1290"]}, {"id": "P1320", "text": ["With heavy volumes of traffic on the bus, the likelihood of more than one station transmitting on the channel at the same time increases. A collision of data occurs between stations transmitting. A priority contention scheme is used to handle this problem. Ethernet has collision detection and if detected, it alerts other nodes by jamming the network.....", "1. Two stations transmit at exactly the sane time...........", "Typically, the stations attempting to gain access to the channel at the same time will back off for a random interval of time before attempting to access the channel again. This allows one of the stations to transmit its data while the others listen. Eventually, the traffic on the network subsides, and fewer collisions occur..."], "jumps": ["P1330", "P1290", "P1340", "P1320"]}, {"id": "P1340", "text": ["The cabling may be coaxial, twisted pair or fiber optic but will have direct influence on which protocol is used. Several different software protocols can be applied to the linear bus, including Ethernet, Fast Ethernet, and Local Talk...", "Fast Ethernet is in the form of an Ethernet hub with an internal bus that runs at 100 Mbps which is ten times faster than the original Ethernet. Now, there's an even faster Ethernet called Gigabit Ethernet...", "Gigabit Ethernet switch with 10/100 uplink ports"], "jumps": ["P1350", "P1330", "P1360", "P1340"]}, {"id": "P1360", "text": ["The tree configuration is a modified version of a linear bus. There is still a main trunk, but extending from the trunk there are branches. Each branch has one or more components (PC, printer, etc) attached. The graphic illustrates one possible physical topography for a tree configuration. Tree topographies normally use Ethernet and Fast Ethernet.....", "The ring topology, as the name implies, interconnects nodes point-to-point in a closed-loop configuration. A message is transmitted in simplex mode (one direction only) from node to node around the ring until it is received by the original source node..."], "jumps": ["P1370", "P1350", "P1380", "P1360"]}, {"id": "P1380", "text": ["Each node acts as a repeater, re-transmitting the message to the next node. Each node also shares the responsibility of identifying if the circulating message is addressed to itself or to another node. In either case, the message is eventually received by the destination station and returned to the original source node....."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["The source node then verifies that the message circulated around the ring is identical to the message that was originally transmitted. Acknowledgement bits within the message block are typically set by the destination node so that the source node has a way of verifying that the message was in fact received...", "IBM's Token Ring architecture has a physical resemblance to a star. Stations are linked together to a central connection point called a MAU (multistation access unit). The MAU acts as the hub of the network and connects up to eight nodes or computers..."], "jumps": ["P1400", "P1380", "P1410"]}, {"id": "P1410", "text": ["They can also be linked together to extend the number of nodes on the network. The interface cable between the computer station and the MAU is called a lobe, and patch cables are used to interconnect MAUs together..."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["Although the network topology here appears to be a star, a closer look at the internal connections of the MAU reveal that the electrical ring is preserved; data is allowed to pass directly from one node to another without going through the MAU. For these reasons, IBM's Token Ring topology is referred to as a star-wired ring....."], "jumps": ["P1430", "P1400"]}, {"id": "P1430", "text": ["A token or supervisory frame must be received by an attached terminal or workstation before that terminal or workstation can start transmitting. The workstation with the token then transmits and uses the entire bandwidth of whatever communication media the token ring network is using. Operating speeds are 4 Mbps or 16 Mbps.....", "Wireless networks provide all the benefits of wired systems but also provide the users with mobility. The graphic illustrates a simple wireless LAN. If this were the only benefit, it alone would justify the use of wireless. Wireless LANs, however, actually offer many benefits: 1) mobility, 2) flexibility, 3) fast installation, 4) reduced costs, 5) scalability, and 6) security....."], "jumps": ["P1440", "P1420", "P1450", "P1430"]}, {"id": "P1450", "text": ["1) Mobility - LAN users are not tethered to their desks to access information, giving a real boost to productivity. 2) Flexibility - The wireless LAN can be moved about, augmented, or reduced rapidly with a minimum amount of effort.", "1. Mobility - LAN users not tethered to their desk.", "2. Flexability - LAN can be moved easily. ier desk"], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["3) Fast Installation - Conventional networks require extensive cabling which may require installation through walls or beneath floors, etc. Wireless systems avoid this problem entirely. Reduced Costs - With the elimination of cables, connectors, and intrusive installation, costs for wireless networks are ultimately cheaper than their wired predecessors.", "3. Fast Installation - No extensive cables to run through walls, etc.", "4. Reduced costs - Eliminates cables, connections, etc.", "1. Mobility - LAN users not tethered to their desk.", "2. Flexability - LAN can be moved easily. ier desk"], "jumps": ["P1470", "P1450"]}, {"id": "P1465", "text": ["4) Reduced Costs - With the elimination of cables, connectors, and intrusive installation, costs for wireless networks are ultimately cheaper than their wired predecessors.oblem entirely. 4) Reduced Costs - With the elimination of cables, connectors, and intrusive installation, costs for wireless networks are ultimately cheaper than their wired predecessors.", "3. Fast Installation - No extensive cables to run through walls, etc.", "4. Reduced costs - Eliminates cables, connections, etc.", "1. Mobility - LAN users not tethered to their desk.", "2. Flexability - LAN can be moved easily. ier desk"], "jumps": ["P1470", "P1450"]}, {"id": "P1470", "text": ["5) Scalability - Wireless LANs can be configured in a number of different topologies and can easily be changed when system usage requires. ity measures are regularly a part of wireless systems, resulting in a higher level of security than most wired networks...", "5. Scalability - Topogy can be changed easily.rough walls, etc. etc.", "6. Security - Provides higher level of security than most wired networks.", "3. Fast Installation - No extensive cables to run through walls, etc.", "4. Reduced costs - Eliminates cables, connections, etc.", "1. Mobility - LAN users not tethered to their desk.", "2. Flexability - LAN can be moved easily. ier desk"], "jumps": ["P1480", "P1460"]}, {"id": "P1475", "text": ["6) Security - Security measures are regularly a part of wireless systems, resulting in a higher level of security than most wired networks.urity measures are regularly a part of wireless systems, resulting in a higher level of security than most wired networks...", "5. Scalability - Topogy can be changed easily.rough walls, etc. etc.", "6. Security - Provides higher level of security than most wired networks.", "3. Fast Installation - No extensive cables to run through walls, etc.", "4. Reduced costs - Eliminates cables, connections, etc.", "1. Mobility - LAN users not tethered to their desk.", "2. Flexability - LAN can be moved easily. ier desk", "From one perspective, the term wireless LAN is somewhat of a misnomer. Most wireless LANs are, at some point, connected to a wired system. Normally, only the user end is actually wireless, although LANs that span from one building to another commonly have a wireless link between buildings...", "Point-To-Multi-Point Wireless Link With Antenna On Each Roof"], "jumps": ["P1480", "P1460", "P1490", "P1470"]}, {"id": "P1490", "text": ["LANs provide the workplace with a tremendously efficient means of sending and receiving information from point-to-point or from point-to-multi-point. Most wired LANs conform to standards defined by the Institute of Electrical and Electronic Engineers (IEEE) under the specifications identified as IEEE 802.3, 802.4 and 802.5....."], "jumps": ["P1500", "P1480"]}, {"id": "P1500", "text": ["Wireless LANs use standards established under IEEE 802.11. IEEE 802.11 provides the operational guidelines and specifications (throughput, frequency range, speed, distance, etc.) to which wireless systems should conform...", "I EEE 802.11 Wireless LANS - RF & IR Systems Through put, Frequency range, speed, distance, etc."], "jumps": ["P1510", "P1480"]}, {"id": "P1510", "text": ["The standard also provides a contention mechanism that allows nodes to share a common channel and a collision avoidance mechanism to keep transmitted packets from trying to access the system at the same time. IEEE 802.11 defines not only the recommended operating parameters for RF-based systems but also for infrared (IR) systems.....", "Channel is free. Begin transmission of packet to node E.", "Channel is free. Begin transmission of packet to node A."], "jumps": ["P1520", "P1500"]}, {"id": "P1520", "text": ["Telecommunication protocols are a complex assortment of hardware and software rules, requirements, and responsibility assignments. The IEEE standards are based on a protocol stack divided into seven layers with each layer assigned a specific task or set of tasks that must be performed at a specified time during any communication activity.....", "LAYER NAME FUNCTIONNNNNNNN", "Application Presentation Session Transport Networks Data Link Physical", "Provides for program-to-program communications. Manages data representation conversions (code conversions). Establishes and maintains communications channel. Controls end-to-end integrity of data transmission. Routes data from one node to another. Physically passes data from one node to another. Manage the placement and removal of data to or from the network."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["The seven-layer stack, based on a proposal by the International Standards Organization (ISO) is called the Open System Interconnection (OSI) Reference Model. The graphic illustrates the seven-layer system..."], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["Which is not one of the Open System Interconnection (OSI) layers?"], "jumps": ["P1520"]}, {"id": "P1541", "text": [], "jumps": []}, {"id": "P1542", "text": ["Transport is one of the seven layers of the Open System Interconnection Reference Model.", "LAYER NAME FUNCTIONNNNNNNN", "Application Presentation Session Transport Networks Data Link Physical", "Provides for program-to-program communications. Manages data representation conversions (code conversions). Establishes and maintains communications channel. Controls end-to-end integrity of data transmission. Routes data from one node to another. Physically passes data from one node to another. Manage the placement and removal of data to or from the network."], "jumps": []}, {"id": "P1543", "text": ["Presentation is one of the seven layers of the Open System Interconnection Reference Model.", "LAYER NAME FUNCTIONNNNNNNN", "Application Presentation Session Transport Networks Data Link Physical", "Provides for program-to-program communications. Manages data representation conversions (code conversions). Establishes and maintains communications channel. Controls end-to-end integrity of data transmission. Routes data from one node to another. Physically passes data from one node to another. Manage the placement and removal of data to or from the network."], "jumps": []}, {"id": "P1550", "text": ["The principles that ISO applied to arrive at the seven layers were: 1) A layer should be created where a different level of abstraction is needed. 2) Each layer should perform a well-defined function. 3) The function of each layer should be chosen with an eye toward defining internationally standardized protocols.", "LAYER NAME FUNCTIONNNNNNNN", "Application Presentation Session Transport Networks Data Link Physical", "Provides for program-to-program communications. Manages data representation conversions (code conversions). Establishes and maintains communications channel. Controls end-to-end integrity of data transmission. Routes data from one node to another. Physically passes data from one node to another. Manage the placement and removal of data to or from the network."], "jumps": ["P1560", "P1540"]}, {"id": "P1560", "text": ["4) The layer boundaries should be chosen to minimize the information flow across the interfaces. 5) The number of layers should be large enough that distinct functions need not be thrown together in the same layer out of necessity, and small enough that the architecture does not become unwieldy."], "jumps": ["P1570", "P1550"]}, {"id": "P1570", "text": ["The goal of the layered system is to have each layer with independent standards so that a change in one layer would not affect the others. Due to the variety of IEEE 802.x standards, some variations to the OSI model may occur. They will, nonetheless, closely resemble the seven-layer model..."], "jumps": ["P1580", "P1550"]}, {"id": "P1580", "text": ["When LANs are connected together to form a WAN or a MAN, the network requires specialized devices. Aside from providing a physical link between two LANs, they allow for an association of OSI layers between the LANs based upon the make-up of the LANs being connected..."], "jumps": ["P1590", "P1550"]}, {"id": "P1590", "text": ["The function of repeaters is to transmit signals from one segment to another without altering the integrity of the signal. Segments cannot be separated by more than 100m: two 50m-transceiver cables separated by the repeater. The network can then be extended beyond 500m by joining segments together...", "Transceiver and Coaxial Cable Tap (100 nodes per segment)"], "jumps": ["P1600", "P1580"]}, {"id": "P1600", "text": ["There are two types of repeaters: the local repeater and the remote repeater. Both types of repeaters serve the function of joining segments. The remote repeater, however, allows the network to be extended to a maximum of 1000m via a fiber-optic link. The repeater performs physical layer operations only...", "Fiber optic Point-to-point link (1000 n max)", "Bridges are not commonly used in new installations any more but are still found in existing LANs. They normally connect LANs that have identical protocols at the Data Link and Physical layers of the OSI Model (two IEEE 802.3 Ethernet LANs, for example)..."], "jumps": ["P1610", "P1590", "P1620", "P1600"]}, {"id": "P1620", "text": ["When a bridge receives a packet, it stores the entire packet in memory, checks it for errors, and then transmits it through the correct port. In this way, the ports are isolated. This accommodates connecting similar LANs, such as variations of Ethernet, together. More sophisticated bridges can connect dissimilar LANs....."], "jumps": ["P1630", "P1610"]}, {"id": "P1630", "text": ["Routers are used to interconnect LANs at the network level. When a router receives a packet, it determines if the packet is destined for a network directly connected to it or if it needs to go to a distant network via one or more additional routers..."], "jumps": ["P1640", "P1610"]}, {"id": "P1640", "text": ["For directly connected routers, the packet is sent to the appropriate port and transmitted. For distant networks, the packet is transmitted to the appropriate router. Routers utilize the first three layers of the OSI Model..."], "jumps": ["P1650", "P1630"]}, {"id": "P1650", "text": ["Gateways are the most sophisticated devices. They operate to interface all seven layers of the OSI Model and provide complete hardware and software translations between entirely different networks. They can also connect a LAN to a host using an entirely different protocol family. This makes them the most useful and flexible interconnection devices available........................."], "jumps": ["P1660", "P1640"]}, {"id": "P1660", "text": ["There are two transmission formats for wireless networks: RF (radio frequency) and IR (infrared). Both systems have their advantages and disadvantages, but presently RF systems are more popular..."], "jumps": ["P1670", "P1650"]}, {"id": "P1670", "text": ["Which is not a transmission format used for wireless networks?"], "jumps": ["P1660"]}, {"id": "P1671", "text": [], "jumps": []}, {"id": "P1672", "text": ["Radio frequency (RF) is one of the transmission formats used for wireless networks."], "jumps": []}, {"id": "P1673", "text": ["Infrared (IR) is one of the transmission formats used for wireless networks"], "jumps": []}, {"id": "P1680", "text": ["RF systems use two different transmission techniques: either conventional narrowband microwave or spread spectrum. Spread spectrum is the most commonly used. The narrowband microwave is almost exclusively used for transmissions between LANs from one building to another. This is done with a conventional line-of-site dish antenna....."], "jumps": ["P1690", "P1670"]}, {"id": "P1690", "text": ["The LANs themselves normally use spread spectrum. The spread spectrum technique is either frequency hopping or direct sequence. ll in frequency hopping the signal is sent to many different channels over a broad range. The signal only remains at any given channel for a few milliseconds before being redirected to another channel. The channel sequence is based on a binary code....."], "jumps": ["P1695", "P1680"]}, {"id": "P1695", "text": ["Recall in frequency hopping the signal is sent to many different channels over a broad range. The signal only remains at any given channel for a few milliseconds before being redirected to another channel. The channel sequence is based on a binary code.iven channel for a few milliseconds before being redirected to another channel. The channel sequence is based on a binary code....."], "jumps": ["P1700", "P1690"]}, {"id": "P1700", "text": ["Direct sequence systems use a spreading code (a pseudo-random sequence of ones and zeros) to disperse the signal over a large band of frequencies at very low amplitudes. The receiver must be set to use the same sequence in order to decode the signal. Any other spread spectrum signals not using the same code are summarily dismissed by the receiver as noise....."], "jumps": ["P1710", "P1690"]}, {"id": "P1710", "text": ["Which is not a spread spectrum technique used in RF-transmission systems for computer networks?"], "jumps": ["P1700"]}, {"id": "P1711", "text": [], "jumps": []}, {"id": "P1712", "text": ["Direct sequence is a spread spectrum technique used in RF-transmission systems for computer networks."], "jumps": []}, {"id": "P1713", "text": ["Frequency hopping is a spread spectrum technique used in RF-transmission systems for computer networks."], "jumps": []}, {"id": "P1720", "text": ["The primary benefits of an RF-based LAN are that line-of-sight is not necessary between the hub or backbone and the node. RF will generally pass through walls, people, and other objects without any signal degradation. At the same time, the use of spread spectrum provides a high degree of security due to the code processes and very low signal levels....."], "jumps": ["P1730", "P1710"]}, {"id": "P1730", "text": ["Infrared systems transmit signals using frequencies in the infrared region of the spectrum. This is the same technology used in the remotes for televisions and VCRs. While the systems work well, the individual nodes must have line-of-sight with the transmitter..."], "jumps": ["P1740", "P1720"]}, {"id": "P1740", "text": ["Any objects in the path of the transmitter and receiver (including non-solid objects such as smoke, smog and moisture) will degrade or block the transmission. The line-of-sight characteristic of IR-based systems also makes it difficult for administrators to move workstations...", "In some cases, when a LAN is in an enclosed area, a method called sun & moon configuration can be established. In this form, the enclosed area must be able to reflect the infrared light off walls and ceilings. This is also known as diffusion, which allows operation of IR transmissions without line-of-sight..."], "jumps": ["P1750", "P1730", "P1760", "P1740"]}, {"id": "P1760", "text": ["Because infrared transmissions are unable to penetrate walls, ceilings, floors, etc., they have an inherent security benefit, but their primary advantage is that they have the ability to carry a high bandwidth..."], "jumps": ["P1770", "P1750"]}, {"id": "P1770", "text": ["One further benefit of an infrared system is that because the intelligence is being transmitted in the form of light, it will not interfere with other radio signals and, therefore, does not require licensing from the Federal Communications Commission (FCC)..."], "jumps": ["P1780", "P1750"]}, {"id": "P1780", "text": ["Wireless communications has soared due to technological advances in communications coupled with the demands for personal mobility. Personal communications services (PCS) are the most recent wireless technology to explode. Wireless communications includes more than pagers and cell phones...", "It also includes wireless speakers and intercoms, cordless telephones capable of being used up to a mile away from the base station, two-way radio systems, palmtop computers and fax machines linked to wireless modems, the global positioning system (GPS), and wireless medical instruments..."], "jumps": ["P1790", "P1750", "P1800", "P1780"]}, {"id": "P1800", "text": ["The broad range of PCS services include digital cellular telephony with voice mail, caller ID, e-mail, and alphanumeric two-way paging systems. Competition among service providers and equipment manufacturers will fuel the demand for PCS services along with personal communications satellite services (PCSS). nces in satellite systems and wireless technology will put the cellular phone system in the sky....."], "jumps": ["P1910", "P1790", "PCSS"]}, {"id": "P1910", "text": ["This completes the information on DESCRIBE LAN, WAN, AND MAN COMPUTER NETWORKS.", "1. Networks are defined as an arrangement of electronic devices designed to communicate with one another. A simple network consists of two computers with network interface cards, appropriate cables, and the software necessary to communicate with each other."], "jumps": ["P1001", "P1800", "P1930"]}, {"id": "P1930", "text": ["2. LAN stands for Local Area Network and can encompass areas tens of miles wide. LANs are generally privately owned and they operate in the kilobyte range with a very small error rate. LANs normally conform to one of the following physical topologies: star, linear bus, tree, ring, or star-wired ring..", "* Star * Linear Bus * Tree * Ring * Star - wired Ring low signal-to-noise ratios (better noise rejection) 2) Resistance to multipath interference and 3) Resistance to jamming."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. WAN is a Wide Area Network and, as the name implies, covers a larger geographical area than LANs. They are usually considered public networks and are a service that the user pays for like the Internet. WANS operate in the megabyte range but have a considerably high rate of errors."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. MAN stands for Metropolitan Area Network and can be thought of as two or more LANS connected together in a geographically restricted area."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. Open System Interconnection Model is a telecommunications protocol containing seven layers. Each layer is assigned a specific task(s) that must be performed at a specific time during any communications activity.", "LAYER NAME FUNCTIONNNNNNNN", "Application Presentation Session Transport Networks Data Link Physical", "Provides for program-to-program communications. Manages data representation conversions (code conversions). Establishes and maintains communications channel. Controls end-to-end integrity of data transmission. Routes data from one node to another. Physically passes data from one node to another. Manage the placement and removal of data to or from the network."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6. The Institute of Electrical and Electronic Engineers (IEEE) defined standards that both wired and wireless networks use to operate. They provide operational guidelines and specifications such as throughput, frequency range, speed, distance, etc.", "I EEE 802.11 Wireless LANS - RF & IR Systems Through put, Frequency range, speed, distance, etc."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7. There are two transmission formats for wireless networks: radio frequency (RF) and infrared (IR). Most infrared LANs require line-of-sight alignment while RF systems do not.", "8. Wireless LANs normally use spread spectrum modulation for data transmission. The two methods of spread spectrum used are direct sequence and frequency hopping."], "jumps": ["P1990", "P1970", "P1999", "P1980"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1990"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["The servers can be either Application Servers, File Servers, or a combination of the two.", "Which is not true about a network using a PC or mainframe computer in a Client-Server configuration?", "User logons can be validated by the server.", "There is no central access point in this configuration.", "The PC or mainframe stays on at all times, operates at high speeds, and has a large storage capacity."], "jumps": []}, {"id": "P10211", "text": ["a collection of independent data processors.", "A computer network can best be described as _______", "an arrangement of electronic devices designed to communicate with one another.", "a means of providing feedback to a central processor.", "a central access point for client workstations."], "jumps": []}, {"id": "P10212", "text": [], "jumps": []}, {"id": "P10213", "text": ["Two computers with two Network Interface Cards (NIC), appropriate cables, and network software can be described as a _______"], "jumps": []}, {"id": "P10214", "text": ["Which is not one of the Open System Interconnection (OSI) layers?"], "jumps": []}, {"id": "P10215", "text": ["Tree configurations are a variation of a _______"], "jumps": []}, {"id": "P10216", "text": ["Neither system requires licensing from the Federal Communications Commission (FCC).", "Which is not a benefit of RF and IR wireless computer networks?", "Both systems can be configured in a number of different topologies.", "A wireless LAN provides a higher level of security than a wired system.", "Wireless LAN users are not tethered to their desk to access information."], "jumps": []}, {"id": "P10217", "text": [], "jumps": []}, {"id": "P10218", "text": ["RF signals will generally pass through walls, people, and other objects.", "Which is not true concerning RF- based LAN computer networks?", "RF systems require licensing from the Federal Communications Commission (FCC).", "RF systems use the same technology that is used in remotes for television and VCRs.", "An RF- based LAN does not require line-of-sight between the hub or backbone and the node."], "jumps": []}, {"id": "P10219", "text": ["What are the two most commonly used methods of spread spectrum for RF wireless networks?"], "jumps": []}, {"id": "P10220", "text": ["IR systems have the ability to carry a high bandwidth.", "Which is not a benefit associated with IR wireless computer networks?", "Signal degradation can occur from smoke, smog, and moisture.", "IR systems have an inherent security benefit because the transmissions are unable to penetrate walls, etc.", "Licensing by the Federal Communications Commission (FCC) is not required since the transmitted signal is light."], "jumps": []}, {"id": "P10221", "text": ["The Institute of Electrical and Electronic Engineers (IEEE) standards provide operational guidelines and specifications about _______ for wireless systems."], "jumps": []}, {"id": "P10222", "text": ["WANs normally operate in the megabyte range.", "WANs operate in environments that are free from the effects of weather.", "WANs let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
