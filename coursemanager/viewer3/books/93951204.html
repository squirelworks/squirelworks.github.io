easure voltage. Begin entering the Introduction."], "jumps": []}, {"id": "P410", "text": ["Voltage measurements tell a lot about the operation of a circuit. This is an overlay page."], "jumps": ["P400"]}, {"id": "P420", "text": ["For example, if the voltage measurement in this circuit is zero, you can be sure it is not working properly. This is an overlay page."], "jumps": ["P400"]}, {"id": "P430", "text": ["Throughout this course you will use voltage measurements to determine the operating condition of circuits. This is an overlay page."], "jumps": ["P400"]}, {"id": "P440", "text": ["Let's begin the lesson on VOLTAGE MEASUREMENTS. .................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": ["Your meter must be set-up correctly before you measure voltage. Enter the discussion text here."], "jumps": []}, {"id": "P1050", "text": ["A meter that is incorrectly set up, can cause personal injury or equipment damage. page."], "jumps": []}, {"id": "P1060", "text": ["Use this simple checklist the first few times you use the meter. After a while, you should have it memorized. Enter the discussion text here."], "jumps": []}, {"id": "P1070", "text": ["Let's start by checking to see if the meter's needle is zeroed. is is an overlay page."], "jumps": []}, {"id": "P1080", "text": ["Look at this display. The needle is pointing at 2 but no voltage is being measured. Enter the discussion text here.", "22222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222' ))))))-64", "745..............................................................................................................................0' ***)))-64", "............................................................................................................................./ \"", "&%#\"\"\"\"!!!!! !!!!!\"\"\"\"#", "! !!!!\"\"\"\" $$&#$$$$%%%%%%%%,4444444444444#", "#44444444444444444444444444444444444444444444444444448 &44444444444444444444444444444444444444444444444444#", "%-------------34444444444444444444444444444444444444448 )4444444444444444444444444444444444443-------------", "!!! ######################%&&&&&&&&&&&&&&&&&&&&&&&&&&&###################!!!", "???????????444444=8.( '),/26980-..../$##\"! #"], "jumps": []}, {"id": "P1090", "text": ["If you measure 15 volts in a circuit, the display will indicate 17 volts! This is an overlay page."], "jumps": []}, {"id": "P1100", "text": ["With no voltage applied, turn the zero adjust until the needle points at 0. This is an overlay page."], "jumps": []}, {"id": "P1120", "text": ["The digital multimeter does not have a zero adjust. The meter is automatically adjusted to zero. Enter the discussion text here."], "jumps": []}, {"id": "P1125", "text": ["With the function switch set to voltage, touching the leads together will display the zero calibration. This is an overlay page."], "jumps": []}, {"id": "P1126", "text": ["CALIBRATION - Calibrate is the act of adjusting electronic components or devices to a reference (usually a voltage or frequency). In the case of a multimeter, you are adjusting it to a zero volt reference. second line here."], "jumps": []}, {"id": "P1127", "text": ["With the function switch set to voltage, touching the leads together will display the zero calibration. Enter the discussion text here."], "jumps": []}, {"id": "P1160", "text": ["Which meter needle is zeroed properly? e the question is typed."], "jumps": []}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1162", "text": ["This meter is not set properly. The needle is set lower than zero. The display will indicate a voltage less than the actual voltage measured. Enter the discussion text here."], "jumps": []}, {"id": "P1163", "text": ["This meter is not set properly. The needle is set higher than zero. The display will indicate a voltage more than the actual voltage measured. Enter the discussion text here."], "jumps": []}, {"id": "P1170", "text": ["Remember, for the displayed value to be accurate the needle must be set to zero before making a measurement. Enter the discussion text here."], "jumps": []}, {"id": "P1180", "text": ["Next check the function switch. Enter the discussion text here."], "jumps": []}, {"id": "P1190", "text": ["The function switch must be set to voltage. Pay close attention to set your range switch for either a DC voltage or an AC voltage."], "jumps": []}, {"id": "P1200", "text": ["If the analog meter you are using does not have separate range settings for DC and AC voltages look for a switch that will allow you to select the type and polarity of the voltage being measured. to select the type and polarity of the voltage being measured."], "jumps": []}, {"id": "P1202", "text": ["As with the analog multimeter this digital multimeter also requires you to select the correct range and type (AC or DC) of voltage to be measured. d."], "jumps": []}, {"id": "P1204", "text": ["This digital multimeter has separate positions for VDC ( V ) and VAC ( V )."], "jumps": []}, {"id": "P1210", "text": ["Notice that this meter does not have a selection of ranges to choose from. It is auto ranging. You may also find that some digital multimeters automatically select DC when the function switch is placed to V. aced to V."], "jumps": []}, {"id": "P1220", "text": ["This requires you to manually make a selection, DC or AC.If the voltage is AC the selection must be made manually."], "jumps": []}, {"id": "P1230", "text": ["Which meter is set to measure DC voltage? This is where the question is typed."], "jumps": []}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1232", "text": ["This meter's function switch is set to a resistance position. To measure DC voltage the meter must be set to a V or voltage position. Enter the discussion text here."], "jumps": []}, {"id": "P1233", "text": ["This meter's function switch is set in an ampere position. To measure DC voltage the meter must be set to a V or voltage position. Enter the discussion text here."], "jumps": []}, {"id": "P1240", "text": ["Remember, set the function switch to: - V or voltage - select DC or AC voltage Enter the discussion text here.I"], "jumps": []}, {"id": "P1250", "text": ["Next check the range setting. nter the discussion text here."], "jumps": []}, {"id": "P1260", "text": ["If you know the approximate value of voltage you will measure, set the range switch to a setting just higher than that value. Enter the discussion text here."], "jumps": []}, {"id": "P1270", "text": ["For example, if the measured voltage is expected to be 50 volts, set the range switch to 60. This setting lets you measure any value between 0 and 60 volts. This is an overlay page."], "jumps": []}, {"id": "P1280", "text": ["If the voltage value is unknown, set the range switch to the highest possible setting. Doing this will ensure that you do not cause the meter needle to deflect full scale or off the scale. This is commonly referred to as \"pegging the meter\"."], "jumps": []}, {"id": "P1290", "text": ["Selecting a range that is too low for the measured value can cause: Personal injury Meter damage Equipment damage red value. is too low for the measured value."], "jumps": []}, {"id": "P1300", "text": ["Using a range that is too high for the expected value is also a problem. It can be the cause of inaccurate measurements..............e meter."], "jumps": []}, {"id": "P1310", "text": ["You can see that it is important to select the correct range for the value to be measured. For example, to measure 100 volts set the range to 300. The reading is accurate and the meter is not damaged."], "jumps": []}, {"id": "P1320", "text": ["When setting up a digital multimeter to make voltage measurements use the same precautions as those used for the analog meter. Look at the meter you are using and take note of the available ranges. Also look to see if auto ranging is available or not."], "jumps": []}, {"id": "P1330", "text": ["Which function switch is set correctly if the value measured is 200 volts? This is where the question is typed."], "jumps": []}, {"id": "P1331", "text": [], "jumps": []}, {"id": "P1332", "text": ["This meter's range switch is set too low to measure 200 volts. The needle will deflect full scale. The reading is inaccurate and may damage the meter. Enter the discussion text here."], "jumps": []}, {"id": "P1333", "text": ["This meter's range switch is set too low to measure 200 volts. Always set the range to a higher voltage than the voltage to be measured. Enter the discussion text here."], "jumps": []}, {"id": "P1340", "text": ["Last, check that the test leads are connected properly. Enter the discussion text here."], "jumps": []}, {"id": "P1350", "text": ["The red test lead must be connected to the voltage input jack. ter the discussion text here."], "jumps": []}, {"id": "P1360", "text": ["The black test lead must be connected to the common input jack. his is an overlay page."], "jumps": []}, {"id": "P1370", "text": ["Connecting either test lead to the wrong input jack will provide readings that are not accurate. This is an overlay page."], "jumps": []}, {"id": "P1380", "text": ["Which meter is setup to measure a DC voltage? he question is typed."], "jumps": []}, {"id": "P1381", "text": [], "jumps": []}, {"id": "P1382", "text": ["The function switch on this meter is set OFF. To measure voltage the function switch must be set to voltage. Enter the discussion text here."], "jumps": []}, {"id": "P1383", "text": ["All the switches are in the right position on this meter but, the black test lead is not connected to the meter. Enter the discussion text here."], "jumps": []}, {"id": "P1390", "text": ["Select the meter that is NOT set-up correctly to measure voltage. his is where the question is typed."], "jumps": []}, {"id": "P1391", "text": [], "jumps": []}, {"id": "P1392", "text": ["This meter is set to measure AC voltages less than 12 V. ter the discussion text here."], "jumps": []}, {"id": "P1393", "text": ["This meter is setup to measure DC voltages less than 3 volts. r the discussion text here."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on METER SET-UP. OBJECTIVE 1 TITLE."], "jumps": []}, {"id": "P1920", "text": ["1. Follow this checklist when you set-up your meter. . First Objective summary. Start second line here."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": []}, {"id": "P2001", "text": ["To measure voltage in a circuit you must know the precautions and procedures for making measurements. Enter the discussion text here."], "jumps": []}, {"id": "P2050", "text": ["Let's look at the cautions that must be observed when measuring voltage. This is an overlay page.", "It is most important to know that voltage is dangerous when not used properly. Always use caution. This is an overlay page."], "jumps": []}, {"id": "P2070", "text": ["Following these simple rules can keep you safe from harm. Enter the discussion text here."], "jumps": ["P2080", "P2075", "P2076", "P2077"]}, {"id": "P2075", "text": ["REMOVE ALL JEWELRY - Jewelry makes a good conductor. Allowing metal jewelry to come in contact with a circuit can KILL. cond line here."], "jumps": []}, {"id": "P2076", "text": ["TOUCH CIRCUITS WITH TEST LEADS ONLY - Touching a circuit with your finger can be dangerous. Use the test leads, they are insulated to prevent shock. shock. shock. hock. shock. ock."], "jumps": []}, {"id": "P2077", "text": ["What was the applied voltage? 15 or 150V?", "KNOW THE CIRCUIT'S VOLTAGE LEVEL - Know the approximate voltage level of the circuit you measure. If you don't know, don't measure the circuit."], "jumps": []}, {"id": "P2080", "text": ["Next, let's see how to make a voltage measurement. ter the discussion text here.A /"], "jumps": []}, {"id": "P2090", "text": ["Your meter has two test leads, one black and one red. The black lead is called the gro let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
