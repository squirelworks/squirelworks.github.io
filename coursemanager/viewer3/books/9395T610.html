<script>
const book = {"title": "9395T610", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ..........", "Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe the mission of the Federal Communications Commission (FCC). w Identify the types of telecommunications systems.", "w Define telecommunications. w Identify a basic telecommunications system. w Recognize the difference between wired and wireless. w Describe basic electromagnetic wave principles. w Understand the anatomy of the frequency spectrum.", "2. Telecommunications Industryobjective 1 line item 2 here. item 2 here.e.e.", "1. Telecommunications Science objective 1 line item 2 here. item 2 here.e.e."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Telecommunication is the interactive exchange of information over a distance using electromagnetic methods. The exchange of information back and forth (two-way) from sender to receiver is what sets a telecommunication system aside from a broadcast communication system.........", "Telecommunication Modell Modellllllllllll"], "jumps": ["P1030", "P1001"]}, {"id": "P1025", "text": ["ELECTROMAGNETIC METHODS - include electricity, magnetism, and light (optics). . e. Start second line here.."], "jumps": []}, {"id": "P1030", "text": ["A broadcast communication system is a one-way system where information is sent by one device and then received by another.", "These are examples of telecommunications devices. Notice that each one of these devices is capable of sending and receiving information."], "jumps": ["P1032", "P1020", "P1040", "P1030"]}, {"id": "P1040", "text": ["The interactive exchange of information over a distance is called _______"], "jumps": ["P1032"]}, {"id": "P1041", "text": [], "jumps": []}, {"id": "P1042", "text": ["Broadcast communications is one-way. The sender transmits and the receiver receives. There is no interactive exchange."], "jumps": []}, {"id": "P1043", "text": ["rm of communications. A television is a receiver. It does not allow you to exchange information.", "Television is a popular form of broadcast communications. A television is a receiver. It does not allow you to exchange information.", "The term \"telecommunications\" means \"communications over long distances\". The term is derived from the Greek word \"tele\" which means \"far off\" or \"distant\", and the Latin word \"communicare\" which means \"to impart or share\"...one lines\"...", "Community (People sharing land and resources)"], "jumps": ["P1060", "P1040", "People"]}, {"id": "P1055", "text": ["TELECOMMUNICATIONS- The interactive exchange of information over a distance using electromagnetic methods. e. Start second line here.."], "jumps": ["P"]}, {"id": "P1060", "text": ["In order to exchange information over distance a system must have at least two ELEMENTS and a LINK. These create a telecommunications system."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["The elements are electrical devices called transceivers that transmit and receive information."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["The link is a pathway that information uses to travel."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["The transceiver that is sending information in a given reference frame is also known as the source, sender, originator, and base unit. This element initiates the telecom process by placing information on the link. The following devices are examples of telecommunications transceivers: Voice Telephone * Computer Terminal * Cellular Phone * Satellite Radiooooo", "* Voice Telephone * Computer Terminal * Cellular Phone * Satellite Radio"], "jumps": ["P1100", "P1080"]}, {"id": "P1095", "text": ["REFERENCE FRAME - a period of time, range of frequencies, or channel in which the particular event is occurring. e. Start second line here.."], "jumps": []}, {"id": "P1100", "text": ["The Link is an end-to-end transport medium. It delivers information from one element to another. Sometimes the link is further described by its physical characteristics. Examples include shot, circuit, line, and wire, among others. The following are examples of telecom links: * Point-to-point microwave * Straight copper wire * Fiber Optics * Wireless (over-the-air)", "* Point-to-point microwave * Straight copper wire * Fiber Optics * Wireless (over-the-air)", "SHOT - A point-to-point microwave link.here. Start second line here.", "CIRCUIT - A series of telephone system components that make a link. Start second line here.", "The transceiver that receives the transmitted information is at the far end of the link. This element is also called a target, destination device, sink, remote, or end user."], "jumps": ["P1110", "P1090", "P1120", "P1100"]}, {"id": "P1115", "text": ["SINK - The device at the far end of a telephone circuit. Start second line here."], "jumps": []}, {"id": "P1116", "text": ["REMOTE - A user site in the multipoint microwave system. Start second line here."], "jumps": []}, {"id": "P1120", "text": ["What are the minimum requirements of any telecommunication system?", "The system must have more than two links.", "Must have at least two elements connected by a link."], "jumps": ["P1110"]}, {"id": "P1121", "text": [], "jumps": []}, {"id": "P1122", "text": ["Wired telecom systems are the most common of all. Wireless is not a system requirement."], "jumps": []}, {"id": "P1123", "text": ["The number of links is less of a factor than the number of elements."], "jumps": []}, {"id": "P1130", "text": ["When a number of elements are connected together, the system is called a network. The difference between a telecommunication network and a broadcast network is that the telecom network provides the exchange of information where broadcast networks provide entertainment and education.n.ion....."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["An example of a basic telecom network is the local telephone system."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["The elements consist of telephone sets (telsets) and various offices. The telsets are the transceivers and the offices route information over the links. CIRCUITS are a series of elements and links that complete an information exchange. TRUNKS are shared links..."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["Telecommunications networks may be classified by the type of link used to connect the elements. The two major categories are WIRED and WIRELESS."], "jumps": ["P1170", "P1140"]}, {"id": "P1170", "text": ["Wired systems use copper wire of various thickness, insulation type, and cable/connector type. Fiber optic cable, which is actually glass, is considered wired also."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["Copper is naturally plentiful, recyclable, relatively inexpensive, and easy to manipulate.ype. Fiber optic cable, which is actually glass, is considered wired also."], "jumps": ["P1160", "P1182"]}, {"id": "P1182", "text": ["Fiber is used because it can carry more information at one time than copper. It is however, delicate and expensive."], "jumps": ["P1190", "P1180"]}, {"id": "P1190", "text": ["Wireless systems are highly specialized. Wireless is either directional (must be pointed toward the target) or omni-directional (target can be anywhere within a 360", "circle of the transmitter). Microwave radio is an example of a directional wireless system..."], "jumps": ["P1200", "P1182"]}, {"id": "P1200", "text": ["Satellite is generally thought of as directional because the satellites move with the earth and stay in relatively the same location in space."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["Other wireless systems include infrared and laser systems. Here, light beams are used and, as you can guess, are certainly directional. These are popularly known as line-of-sight links."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["Wired links obviously existed before wireless links (about 60 years before). The main advantage to wired systems is reliability. A wired link will last for centuries. Wired links are the strongest and most reliable parts of a telecom network...."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["The wireless link is more flexible, mobile and easier to install than the wired link. It does however, have a higher susceptibility to weather and cosmic interference than the wired link."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["The copper wired link uses a piece of metal as a transport path for the intelligence signal; the transmitter and receiver are essentially wired together. The only factor that changes is the molecular structure of the metal and the protective quality of the insulated outer covering..."], "jumps": ["P1250", "P1220"]}, {"id": "P1250", "text": ["The wireless link is affected by the changing characteristics of the air. Rain, smoke, solar interference, atmospheric layer anomalies, and/or blockage can obstruct the link. Blockage can be caused by nature, such as trees, or man-made structures..."], "jumps": ["P1260", "P1220"]}, {"id": "P1260", "text": ["Which word or term best describes the characteristics of a fiber link?"], "jumps": ["P1220"]}, {"id": "P1261", "text": [], "jumps": []}, {"id": "P1262", "text": ["Copper is a metal wire. A fiber link uses glass wire......"], "jumps": []}, {"id": "P1263", "text": ["Even though fiber is glass, it is considered a wired link. It provides a physical connection between the elements."], "jumps": []}, {"id": "P1264", "text": ["Fiber is delicate. The glass fibers can be easily damaged if mishandled.", "In a wired system, the link physically connects the elements together. A good example of this is in front of you. Imagine that the keyboard is an element that is linked to the computer. As you press keys, the information is sent to the computer over a wired link..."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["The wireless system link is an air-link. The transmitter must convert the signal intelligence into a radio signal and the receiver must convert the radio signal back into intelligence. The transmitted signal may be a momentary burst or a continuous stream...", "A Transmitted burst of signal intelligence"], "jumps": ["P1282", "P1270"]}, {"id": "P1282", "text": ["So far you have explored the basic components of a telecommunications system but to understand how a telecommunications system works you must first learn the principles of electricity..."], "jumps": ["P1290", "P1280"]}, {"id": "P1290", "text": ["Once you understand the principles of electricity you will be able to explain, describe and discuss such things as direct current, alternating current, ohms law, magnetism, electromagnetic waves, propagation, modulation, and much more..."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["These are all things that any telecommunications technician must know in order to maintain and repair telecommunication systems."], "jumps": ["P1910", "P1280"]}, {"id": "P1910", "text": ["This completes the information on TELECOMMUNICATIONS SCIENCE.", "1. Telecommunications is defined as the interactive exchange of information over a distance using electrical methods. This includes communications radio and fiber optics."], "jumps": ["P1001", "P1280", "P1930"]}, {"id": "P1930", "text": ["2. The basic telecommunications system consists of a transmitter, link, and receiver."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. Wired links use copper or fiber to transport intelligence."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. Wireless links use directional and omni-directional radio, satellite, and light to transport intelligence.."], "jumps": ["P1999", "P1940"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1950"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["The telecom industry consists of radio frequency hardware manufacturers, software developers, local exchange carriers, internet service providers, schools, network installers, special interest groups, and regulatory bodies..."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["The telecom industry is international and assets must be shared across national boundaries. A large population equates to large demand for telecommunications equipment and services."], "jumps": ["P2020", "P2031"]}, {"id": "P2031", "text": ["Peoples Republic of China, for example, is the biggest cellular telephone market in the world because of the country's huge consumer base.", "Population: 1,273,111,300 (2001 estimate)"], "jumps": ["P2040", "P2030", "PJY"]}, {"id": "P2040", "text": ["Industry consortiums, forums, and trade organizations establish configuration standards and promote research & development. The International Telecommunications Union (ITU), headquartered in Switzerland, is the world's leading telecom industry organization. However, the ITU does not control or monitor compliance with government laws or codes...."], "jumps": ["P2031", "P2050"]}, {"id": "P2050", "text": ["In the United States, the Federal Communications Commission (FCC) is the regulatory body for all states, districts and territories. The US Federal Government is regulated by the National Telecommunications and Information Administration (NTIA), a branch of the US Commerce Department..."], "jumps": ["P2040", "P2060"]}, {"id": "P2060", "text": ["The FCC and NTIA work together in several areas, mainly to ensure the US consumer has access to affordable telecommunications services. The FCC and NTIA also share in the handling of international issues. The US is also a member of the ITU..."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["The FCC was chartered by the US Congress in 1934 to act as an independent agency. Law requires that the FCC be administered by 5 commissioners, each appointed by the President and confirmed by the Senate. One individual is designated as Chairman..."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["The FCC is organized into 7 bureaus. Each Bureau Chief reports to the Chairman."], "jumps": ["P2070", "P2090"]}, {"id": "P2090", "text": ["The Cable Services Bureau (CSB) is in charge of all cable related issues. Consumers, officials, and industry representatives interface with this bureau."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["The Common Carrier Bureau (CCB) is responsible for wired telephone networks. Federal jurisdiction is required because common carriers are interstate (cross state boundaries). This bureau handles all wired, corded, and cordless telephone issues within federal authority..."], "jumps": ["P2080", "P2110"]}, {"id": "P2110", "text": ["The Consumer & Government Affairs Bureau (CGB) is the commission's programs and policies group. This bureau oversees public disability mandates to ensure citizens with special needs are afforded access to telecommunications services.hone issues within federal authority..."], "jumps": ["P2080", "P2120"]}, {"id": "P2120", "text": ["The Enforcement Bureau (EB) enforces the provisions of the Telecommunications Act of 1996, the latest and most significant change in policy in over 60 years. The bureau also enforces rules, regulations, mandates, orders, authorizations, and other official policies.rity..."], "jumps": ["P2130", "P2080"]}, {"id": "P2122", "text": ["The Enforcement Bureau (EB) enforces the provisions of the Telecommunications Act of 1996, the latest and most significant change in policy in over 60 years. The bureau also enforces rules, regulations, mandates, orders, authorizations, and other official policies..."], "jumps": ["P2080", "P2130"]}, {"id": "P2125", "text": ["TELECOMMUNICATIONS ACT OF 1996 - A law that was designed to promote competition and reduce regulation of the telecom industry. The act was signed into law on February 8, 1996..."], "jumps": []}, {"id": "P2130", "text": ["The International Bureau (IB) is the diplomatic arm of the FCC. This bureau also administers satellite communications matters, like the Global Positioning System (GPS).lso enforces rules, regulations, mandates, orders, authorizations, and other official policies.rity..."], "jumps": ["P2140", "P2122"]}, {"id": "P2140", "text": ["The Mass Media Bureau (MMB) of the FCC is probably the most recognized unit of the organization. Mass Media includes TV, AM/FM Broadcast Radio, cable and satellite broadcast distribution systems. The bureau regulates and oversees mass media communications, not telecom...."], "jumps": ["P2122", "P2150"]}, {"id": "P2150", "text": ["The Wireless Telecommunications Bureau (WTB) is the authority on cellular & PCS phones, pagers, two-way radios, and wireless distribution services. Wireless telecom is a large piece of the FCC pie, considering the spectrum needed by public safety, local governments, aircraft, maritime, amateur radio operators, and the average citizen..."], "jumps": ["P2160", "P2122"]}, {"id": "P2152", "text": ["The Wireless Telecommunications Bureau (WTB) is the authority on cellular & PCS phones, pagers, two-way radios, and wireless distribution services. Wireless telecom is a large piece of the FCC pie, considering the spectrum needed by public safety, local governments, aircraft, maritime, amateur radio operators, and the average citizen..."], "jumps": ["P2122", "P2160"]}, {"id": "P2155", "text": ["PCS- stands for Personal Communications Service, an improved form of cellular telephone. A cellular phone is a radio, but PCS is a digital radio network. PCS supports more subscribers in a service area because frequency channels are shared by consumers....", "The FCC also has an extensive staff of personnel including judges, lawyers, inspectors, officials, and other bureaucrats. Each person contributes to the overall mission of the FCC. All citizens may participate in FCC rulemaking processes..."], "jumps": ["P2170", "P2152"]}, {"id": "P2170", "text": ["Wireless Telecommunications Bureau (WTB)", "What FCC bureau would handle a communications satellite regulatory issue?"], "jumps": ["P2160"]}, {"id": "P2171", "text": [], "jumps": []}, {"id": "P2172", "text": ["No such bureau.gain page..................................."], "jumps": []}, {"id": "P2173", "text": ["The WTB is responsible for all wireless except satellite and cordless phone."], "jumps": []}, {"id": "P2174", "text": ["The CCB is only involved in wired telephone, cordless telephone being a slight exception to the basic definition.", "The FCC governs civilian telecommunications systems. Telecom systems, for our purposes, are systems that provide telecom solutions to information exchange problems.that provide telecom solutions to information exchange problems.ion exchange problems...G"], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["A country is often rated according to its telecom capabilities. The so-called Third World is a world in need of telecom solutions. The developing world needs telecom system improvements. Less than 30% of the world's population has access to a telephone...", "The civilized world, also called the developed world, is a world that exchanges information. The alternatives to telecom are propaganda based broadcast systems and face-to-face contact.", "There are 3 types of telecom systems: 1. Wired 2. Wireless 3. Combined Networks"], "jumps": ["P2200", "P2180", "P2210", "P2190", "P2220", "P"]}, {"id": "P2220", "text": ["Wired and wireless systems are less common as separate systems because of network convergence. Convergence occurs when two or more independent networks are interconnected; eventually the networks become dependent and become part of a larger network....", "Let's study a scenario. A-1 Properties, a local real estate company, has a main office in the center of town and a field office in a mobile trailer. The president of the company wants to link all of the company's computers into the existing LAN (Local Area Network)...."], "jumps": ["P2230", "P2210", "P2240", "P2220"]}, {"id": "P2240", "text": ["and a GPS (Global Positioning System) receiver which is computerized.", "The main office has 5 desktop computers, 1 laptop, 1 scanner, and 2 printers. The trailer has 2 computers, 1 printer, and a GPS (Global Positioning System) receiver which is computerized....."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["The main office computers and peripheral devices are connected together via a LAN. The Internet connection comes into the LAN through the telephone system (plain old telephone service - POTS). The trailer computers do not have LAN interconnections..."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["What type of telecom system would provide the best solution? Due to the mobility of the trailer, wireless is undoubtedly the best solution."], "jumps": ["P2240", "P2270"]}, {"id": "P2270", "text": ["Depending on cost and data flow requirements, a satellite link may be employed. Mobility usually requires a wireless solution. If the data rate is low and/or a few outages would not cause problems, the wireless system could be rather inexpensive..."], "jumps": ["P2240", "P2280"]}, {"id": "P2280", "text": ["If the trailer's computers are to be connected together forming a small LAN, a wired system is also needed. Now a combined network is the solution."], "jumps": ["P2290", "P2240"]}, {"id": "P2290", "text": ["Wired telecom systems range from desktop intercoms to Public Switched Telephone Networks (PSTN). Remembering the basic telecom model, a system does not have to be complicated to be a reasonable solution........", "Examples of common wired telecom systems include local loop telephone, peer-to-peer local area data networks, digital subscriber line cable (DSL), and amateur telegraph."], "jumps": ["P2280", "P2300", "P2290", "P2310"]}, {"id": "P2310", "text": ["Wireless systems come in many different forms. Cellular/PCS telephones are the most recognizable wireless system components. However, think of all the antennas that can be seen in a metropolitan area. Most of these are components of a wireless telecom system. telecom system...", "Examples of wireless systems include local multipoint distribution service (LMDS), switch mobile radio (SMR), terrestrial paging network, satellite paging network, wireless LAN, wireless local loop, maritime distress radio, and amateur (ham) radio...", "Mobile telephone switching office (MTSO)", "Combined networks can be very large systems. The Public Switched Telephone Network (PSTN) is a very large combined network. The Internet is the largest combined network of all time; practically every personal computer in the world is part of the Internet..."], "jumps": ["P2320", "P2300", "P2310", "P2330", "P2340", "PSTN"]}, {"id": "P2340", "text": ["In digital telecommunications, system type is based on data rate and switching capabilities. 3 bandwidth categories are used: arrowband: Single channel of 64 kbps (kilobits per second), or fractionalized channels equaling but not exceeding 64 kbps. 2. Wideband: Multiple channels up to 45 Mbps (Mega bits per second) 3. Broadband: Greater than 45 Mbps in the US, and 34 Mbps by European standards", "1. Narrowband: Single channel of 64 kbps (kilobits per second), or fractionalized channels equaling but not exceeding 64 kbps. 2. Wideband: Multiple channels up to 45 Mbps (Mega bits per second). 3. Broadband: Greater than 45 Mbps in the US, and 34 Mbps by European standards."], "jumps": ["P2330", "P2350"]}, {"id": "P2350", "text": ["Referring back to the scenario, A-1 Properties may have needed a narrowband network solution. Bandwidth is expressed in bits per second for digital service and hertz for analog service. System design is based on bandwidth requirements...", "Dial-up network (56Kbs) (Narrowband solution)", "Telecom systems may be categorized in numerous ways, but the primary difference between the types revolves around the configuration of the links because this describes how the system will be installed and maintained..."], "jumps": ["P2360", "P2340", "P2350", "P2370", "P"]}, {"id": "P2370", "text": ["When a wired system is conceived, digging, conduits, and outdoor work come to mind. Wireless designs stimulate a person to think about the weather and radio licensing requirements. The combined network is the sum of all telecom design and labor...", "CAUTION! UndergroundFiberoptics Cable"], "jumps": ["P2360", "P2910"]}, {"id": "P2910", "text": ["This completes the information on the TELECOMMUNICATIONS INDUSTRY."], "jumps": ["P2370", "P2001"]}, {"id": "P2920", "text": ["1. The International Telecommunications Union (ITU) is the world's leading telecom organization. The ITU establishes standards and promotes research & development."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2. The Federal Communications Commission (FCC) is the regulatory body that exercises control over the telecommunications industry in the US."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3. The National Telecommunications and Information Administration (NTIA) regulates the US government's use of the frequency spectrum."], "jumps": ["P2950", "P2930"]}, {"id": "P2950", "text": ["4. The FCC is organized into 7 bureaus...................."], "jumps": ["P2940", "P2960"]}, {"id": "P2960", "text": ["5. Telecommunications systems are categorized according to various design characteristics. Link type is the preferred overall categorization. ber 2. Wireless - microwave, satellite, short wave, cellular 3. Combined Network - components from wired and wireless systems", "1. Wired - copper and fiber 2. Wireless - microwave, satellite, short wave, cellular. 3. Combined Network - components from wired and wireless systems. stems."], "jumps": ["P2950", "P2970"]}, {"id": "P2970", "text": ["6. Digital telecommunications uses an additional categorization for its systems based on capability (bandwidth). band - Up to 64 kbps 2. Wideband - 64 kbps to 45 Mbps 3. Broadband - Over 45 Mbps", "1. Narrowband - Up to 64 kbps 2. Wideband - 64 kbps to 45 Mbps 3. Broadband - Over 45 Mbps"], "jumps": ["P2960", "P2999"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2970", "P2001"]}, {"id": "P10001", "text": ["You have already attempted the quiz the ma let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
