const book = {"title": "9395T916", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: COMMUNICATIONS TROUBLESHOOTINGsfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Perform an assessment of an FM Receiver. w Localize a faulty receiver stage. w Isolate faulty components. w Reassess a receiver after repair."], "jumps": []}, {"id": "P300", "text": ["Troubleshooting is a diverse and intricate process that involves theoretical knowledge, test equipment competency, and an understanding of the equipment operation, all blended together with a little bit of intuition.", "Because electronics is based on mathematics, using the logical side of the brain for troubleshooting is imperative.  At the same time, a particular symptom may be caused by any number of reasons, many of which will not seem logical at all.", "It is for this reason that the artful, creative side of the brain must also be heavily engaged.  The best troubleshooters are those that are able to exercise both modes of thought.", "The seasoned troubleshooter knows these factors come into play when trying to solve a problem.  It will not come as a shock to him or her that a suspect component is not the culprit at all.", "There is no comprehensive recipe for troubleshooting, only guidelines that will be configured to your way of thinking, through time and practice.", "Whether it's industry or the military or the small Ma & Pa repair shop, maintenance is fundamentally conducted in the same fashion.  As with any service related work, customer satisfaction is the goal.  Quality work and quick equipment servicing turn-around time are the keys to that goal.", "Because electronics is based on mathematics, using the logical side of the brain for troubleshooting is imperative. At the same time, a particular symptom may be caused by any number of reasons, many of which will not seem logical at all.", "It is for this reason that the artful, creative side of the brain must also be heavily engaged. The best troubleshooters are those that are able to exercise both modes of thought.", "The seasoned troubleshooter knows these factors come into play when trying to solve a problem. It will not come as a shock to him or her that a suspect component is not the culprit at all.", "Whether it's industry or the military or the small Ma & Pa repair shop, maintenance is fundamentally conducted in the same fashion. As with any service related work, customer satisfaction is the goal. Quality work and quick equipment servicing turn-around time are the keys to that goal."], "jumps": ["P410", "P300", "P420", "P400", "P430", "P440", "P450", "P460"]}, {"id": "P460", "text": ["If a customer has to wait too long, or return a piece of equipment because the repair work was poorly done, it's unlikely that the servicing agent will enjoy that customer's business for very long."], "jumps": ["P470", "P450"]}, {"id": "P470", "text": ["Let's begin the lesson on COMMUNICATIONS TROUBLESHOOTING...................."], "jumps": ["P450"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": ["BASIC TROUBLESHOOTING FUNDAMENTALSSSSSSSSS"], "jumps": []}, {"id": "P1020", "text": ["The total troubleshooting process consists of four basic phases:", "Novice troubleshooters have a tendency to dive right into an equipment failure without fully analyzing all the symptoms.  This can sometimes be a double-edged sword.", "1. The assessment phase 2. The troubleshooting phase * Location * Isolation 3. The repair phase 4. The re-assessment phase", "Novice troubleshooters have a tendency to dive right into an equipment failure without fully analyzing all the symptoms. This can sometimes be a double-edged sword."], "jumps": ["P1030", "P1001", "P1040", "P1020"]}, {"id": "P1040", "text": ["Not only will they be going around in circles, but the problem may be something as simple as not having the power turned on, or a burned out light bulb.", "There isn't anything much more frustrating and embarrassing for a technician than to spend several hours troubleshooting a perfectly good piece of equipment.  Here are some guidelines to follow:", "There isn't anything much more frustrating and embarrassing for a technician than to spend several hours troubleshooting a perfectly good piece of equipment. Here are some guidelines to follow:"], "jumps": ["P1050", "P1030", "P1060"]}, {"id": "P1060", "text": ["1.  Make an assessment of the problem.  What is the equipment          doing or not doing?  In many instances, when an initial                    assessment has been done properly, the area of the problem         (if not the component) can be identified without in-depth                  troubleshooting.", "1. Make an assessment of the problem. What is the equipment doing or not doing? In many instances, when an initial assessment has been done properly, the area of the problem (if not the component) can be identified without in-depth troubleshooting."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["2.  Use the \"kiss\" principle. (Keep it simple) Always check the             easy things first.  Look for:", "3.  After opening the equipment, give it a good visual inspection.        Look for burned or loose components, loose connectors, cold      solder joints, and basically anything that might be amiss.", "2. Use the \"kiss\" principle. (Keep it simple) Always check the easy things first. Look for:", "a. unplugged power cords b. disconnected cables c. burned out light bulbs d. controls in wrong position e. blown fusessessment phaseeehase", "3. After opening the equipment, give it a good visual inspection. Look for burned or loose components, loose connectors, cold solder joints, and basically anything that might be amiss."], "jumps": ["P1080", "P1050", "P1090", "P1070"]}, {"id": "P1090", "text": ["4.  As a general rule, passive devices, like resistors will not                  ordinarily go bad on their own.  A burned-up resistor(s) is a            strong indication of a power supply problem, transistor                   problem, or some other active component gone bad.", "4. As a general rule, passive devices, like resistors will not ordinarily go bad on their own. A burned-up resistor(s) is a strong indication of a power supply problem, transistor problem, or some other active component gone bad."], "jumps": ["P1100", "P1080", "P1030"]}, {"id": "P1100", "text": ["5.  Localize the problem.  This refers to the process of narrowing        the problem down to a particular section or stage.                              Localization actually begins during assessment phase.", "For example:  Suppose a receiver is brought in for servicing; the customer has no idea what's wrong.  The technician plugs in the receiver and turns on the power.  A known local station is tuned-in and the first thing the technician notices is that the station detector light is illuminated but there is no sound.", "5. Localize the problem. This refers to the process of narrowing the problem down to a particular section or stage. Localization actually begins during assessment phase.", "1. The assessment phase 2. The troubleshooting phase * Location * Isolation 3. The repair phase 4. The re-assessment phase", "For example: Suppose a receiver is brought in for servicing; the customer has no idea what's wrong. The technician plugs in the receiver and turns on the power. A known local station is tuned-in and the first thing the technician notices is that the station detector light is illuminated but there is no sound."], "jumps": ["P1110", "P1090", "P1120", "P1100"]}, {"id": "P1120", "text": ["Most station detectors are inserted into the receiver's circuitry after either the AM or FM detector.  If the station detector light is illuminated then almost all of the receiver can be eliminated as the source of the problem.", "Most station detectors are inserted into the receiver's circuitry after either the AM or FM detector. If the station detector light is illuminated then almost all of the receiver can be eliminated as the source of the problem."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["In fact, other than the station detector's threshold being out of adjustment, the only remaining stage is the AF amplifier(s). Obviously, not all problems may be localized quite so simply. Still, initial observations during the assessment phase can be a powerful troubleshooting tool."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["In most cases, localization will require either signal injection or signal tracing, and in some instances, both.  These troubleshooting methods will be discussed later.", "In most cases, localization will require either signal injection or signal tracing, and in some instances, both. These troubleshooting methods will be discussed later.", "1. The assessment phase 2. The troubleshooting phase * Location * Isolation 3. The repair phase 4. The re-assessment phase"], "jumps": ["P1150", "P1110"]}, {"id": "P1150", "text": ["6.  The isolation process begins once a problem has been                    identified as being a part of a particular stage of the receiver.          This is normally the most difficult part of troubleshooting.", "While individual transistor stages, as well as other analog components are still in use, much is now encapsulated in Integrated Circuits.  IC's have reduced the amount of troubleshooting that a technician must perform many fold.", "This saves a great amount of time with regard to troubleshooting, but replacing a three legged transistor is a lot quicker than having to de-solder and resolder a 20 pin IC. Fortunately, many of the larger IC's are manually seated in a socket.", "As surface mount technology becomes the prevailing wind, technicians will find themselves replacing boards rather than components.  In many cases, that is already the status quo.", "6. The isolation process begins once a problem has been identified as being a part of a particular stage of the receiver. This is normally the most difficult part of troubleshooting.", "1. The assessment phase 2. The troubleshooting phase * Localization * Isolation 3. The repair phase 4. The re-assessment phase", "While individual transistor stages, as well as other analog components are still in use, much is now encapsulated in Integrated Circuits. IC's have reduced the amount of troubleshooting that a technician must perform many fold.", "As surface mount technology becomes the prevailing wind, technicians will find themselves replacing boards rather than components. In many cases, that is already the status quo."], "jumps": ["P1160", "P1140", "P1170", "P1180", "P1190"]}, {"id": "P1190", "text": ["For the most part, component isolation is still required.  Armed with Ohm's Law, common sense and a little patience, finding a bad component is not too demanding a task.", "7.  When troubleshooting a circuit, finding and replacing                       malfunctioning components is only part of the process.  More       often than not, a component goes bad as a result of some               other underlying problem which may or may not be apparent.", "For the most part, component isolation is still required. Armed with Ohm's Law, common sense and a little patience, finding a bad component is not too demanding a task.", "7. When troubleshooting a circuit, finding and replacing malfunctioning components is only part of the process. More often than not, a component goes bad as a result of some other underlying problem which may or may not be apparent."], "jumps": ["P1200", "P1180", "P1210", "P1190"]}, {"id": "P1210", "text": ["This is not to say that a component will not go bad by itself. Remember, for an electronic circuit to operate correctly, currents, voltages and resistances must be well balanced."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["When a component malfunctions, it disrupts that balance. Normally, when the deficiency remains unattended, it creates other problems within the circuit. Shorts are notorious for causing opens due to large current surges inherent with shorts."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["It is not the intention of this lesson to teach Ohm's Law; nor is it to teach series, parallel, or series-parallel circuits. Still, a refresher on some of the laws that govern those circuits might be in order.", "SERIES sistances in Series are accumulative for total circuit resistance. 2. Current is constant in a series circuit. 3. Voltage drops across resistance are accumulative for total applied voltage. 4. A voltage check across an open in a series circuit will read voltage applied. 5. A resistance check across an open in a series circuit will read i. 6. Shorts will normally indicate 0 Volts across the short and elevated voltages elsewhere. 7. A resistance check across a short will indicate 0 Ohms.", "1. Resistances in Series are accumulative for total circuit resistance. 2. Current is constant in a series circuit. 3. Voltage drops across resistance are accumulative for total applied voltage. 4. A voltage check across an open in a series circuit will read voltage applied. 5. A resistance check across an open in a series circuit will read i. 6. Shorts will normally indicate 0 Volts across the short and elevated voltages elsewhere. 7. A resistance check across a short will indicate 0 Ohms.0 Ohms."], "jumps": ["P1240", "P1210"]}, {"id": "P1240", "text": ["Parallel circuits are very different than series as the chart below illustrates.", "1. The total resistance in a parallel circuit will always be less than or roughly equal to the lowest resistive branch. 2. Voltage is constant in a parallel circuit. 3. Individual branch currents will equal the total circuit current. 4. a resistance check across an open in a parallel circuit will read a resistance greater than the lowest resistive branch. 5. A voltage check across an open in a parallel circuit will give a normal indication. 6. A short across any branch in a parallel circuit will drop the resistance to zero and draw maximum current. The high current flow will ultimately cause an open somewhere in the circuit or burn up the power supply.", "PARALLEL istances in Series are accumulative for total circuit resistance. 2. Current is constant in a series circuit. 3. Voltage drops across resistance are accumulative for total applied voltage. 4. A voltage check across an open in a series circuit will read voltage applied. 5. A resistance check across an open in a series circuit will read i. 6. Shorts will normally indicate 0 Volts across the short and elevated voltages elsewhere. 7. A resistance check across a short will indicate 0 Ohms."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["Diode behavior is similar to that of a switch.  That is, the diode turns on with forward biasing and off with reverse biasing.", "Diode behavior is similar to that of a switch. That is, the diode turns on with forward biasing and off with reverse biasing."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["However, the efficiency of a diode used as a switch is not 100%. This results from the fact that when a diode is forward biased (conducting) there is some resistance and, conversely, when reverse biased (not conducting), some leakage current is evident.", "Reversed Biased (Extremely Small Current Flow)"], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["While diodes are predominantly designed to operate in the forward bias region, there are some diodes designed to operate in the reverse bias region, more specifically, in the breakdown region of the characteristic curve. These are called Zener diodes. The figure below, shows a typical diode characteristic curve."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["There are quite a few special purpose diodes on the market that are used in very limited applications.  The LED (light-emitting diode) is used exclusively as a visual indicator.  Varactors are used for their variable capacitive ability.", "There are quite a few special purpose diodes on the market that are used in very limited applications. The LED (light-emitting diode) is used exclusively as a visual indicator. Varactors are used for their variable capacitive ability."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["Effective troubleshooting requires the technician to be aware of all the various diodes and how to recognize them."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["Diodes are very susceptible to heat which can alter their operating characteristics dramatically.  When temperature increases, the diode's internal resistance decreases leaving the diode at risk of failing.  Improperly ventilated, rack-mounted equipment is particularly at risk for diode failures.", "Diodes are very susceptible to heat which can alter their operating characteristics dramatically. When temperature increases, the diode's internal resistance decreases leaving the diode at risk of failing. Improperly ventilated, rack-mounted equipment is particularly at risk for diode failures."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["A diode that's suspected of having a heat problem can be tested by giving it a short burst of any aerosol contact cleaner.  This temporarily cools the diode.  If the component suddenly begins to conduct, than that's the problem.", "The technician may be faced with the difficult task of intermittent heat related problems. That is, problems that exist when the equipment is running for awhile, but don't exist when the equipment is first powered up, or operating in a cooler environment. This makes for some very difficult troubleshooting.", "A diode that's suspected of having a heat problem can be tested by giving it a short burst of any aerosol contact cleaner. This temporarily cools the diode. If the component suddenly begins to conduct, than that's the problem."], "jumps": ["P1320", "P1290", "P1330", "P1310"]}, {"id": "P1330", "text": ["Remember to always power down the equipment before spraying.  This will preclude the possibility of shorting out one or more components.  This same \"freeze\" test also works well with transistors which suffer from the same problem.", "Heat is also a concern during installation and removal of diodes from a circuit board.  Using a heat sink attached to the lead between the diode and the solder junction will limit the possibility of causing any damage.", "Remember to always power down the equipment before spraying. This will preclude the possibility of shorting out one or more components. This same \"freeze\" test also works well with transistors which suffer from the same problem.", "Heat is also a concern during installation and removal of diodes from a circuit board. Using a heat sink attached to the lead between the diode and the solder junction will limit the possibility of causing any damage."], "jumps": ["P1340", "P1320", "P1350"]}, {"id": "P1350", "text": ["Remember, when replacing a diode or just removing it from a circuit for testing, to take note of its direction so that the cathode and anode are properly aligned in the circuit.", "The easiest way to test a diode is by making a resistance check. Set your ohm or Multimeter to R X 100.  Connect one side of the diode to the negative lead of the meter and the other side to the positive lead.", "The easiest way to test a diode is by making a resistance check. Set your ohm or Multimeter to R X 100. Connect one side of the diode to the negative lead of the meter and the other side to the positive lead."], "jumps": ["P1360", "P1340", "P1370", "P1350", "P1365"]}, {"id": "P1365", "text": ["Meters without the R X 100 option should be kept in the low to medium range or set for automatic. If in doubt, consult the operations manual for the meter you are using."], "jumps": []}, {"id": "P1370", "text": ["If the negative lead is connected to the anode and the positive lead to the cathode, the diode is reverse-biased and should measure high resistance.  When the meter leads are reversed, the diode is forward-biased and should measure low resistance.", "If the negative lead is connected to the anode and the positive lead to the cathode, the diode is reverse-biased and should measure high resistance. When the meter leads are reversed, the diode is forward-biased and should measure low resistance."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["If the diode reads high resistance both directions, it is open.  If the diode reads low resistance both ways, it is shorted.", "If the diode reads high resistance both directions, it is open. If the diode reads low resistance both ways, it is shorted."], "jumps": ["P1385", "P1360"]}, {"id": "P1385", "text": ["Recall that the diode has some resistance when it is conducting and some leakage current when it is not conducting.  This is why a short doesn't read zero ohms and an open doesn't read infinity.", "Recall that the diode has some resistance when it is conducting and some leakage current when it is not conducting. This is why a short doesn't read zero ohms and an open doesn't read infinity."], "jumps": ["P1390", "P1360"]}, {"id": "P1390", "text": ["Because diode resistances vary, it is the ratio between the two resistances that's important.  This ratio is known as the FB (Forward to Back) ratio and is calculated by dividing the reverse resistance by the forward resistance.", "Because diode resistances vary, it is the ratio between the two resistances that's important. This ratio is known as the FB (Forward to Back) ratio and is calculated by dividing the reverse resistance by the forward resistance.", "Reverse Resistance FB Ratio = Forward Resistancease 4. The re-assessment phasere-assessment phase phase"], "jumps": ["P1400", "P1385"]}, {"id": "P1400", "text": ["For most small diodes (those not used is high current applications), the FB ratio should be somewhere in the realm \nof 1000:1.", "For most small diodes (those not used is high current applications), the FB ratio should be somewhere in the realm of 1000:1."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["A diode showing high resistance in both the forward and reverse biasing configuration is likely _______"], "jumps": ["P1390"]}, {"id": "P1411", "text": ["Shorts don't have resistance.", "A good diode has high resistance one way and low the other.", "Resistances should be opposite from one biasing to the other.", "Shorts don't have resistance..............................."], "jumps": []}, {"id": "P1420", "text": ["Diodes are _______", "Diodes are _______estion is typed.........................."], "jumps": ["P1410"]}, {"id": "P1421", "text": [], "jumps": []}, {"id": "P1422", "text": ["Diodes are no more susceptible to cold than any other component."], "jumps": []}, {"id": "P1423", "text": ["Diodes are no more susceptible to vibration than any other components."], "jumps": []}, {"id": "P1424", "text": ["Diodes are no more susceptible to high humidity than any other component."], "jumps": []}, {"id": "P1430", "text": ["Transistors are (in a sense) two diodes in one. That is, they have two PN junctions. These junctions may be tested exactly the same way that the diode was tested.", "+ + + + + + + + + + + + - - - - - - - - - - - -"], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["The resistance checks described in this lesson are based on using an NPN transistor and an analog meter.  Polarity with analog meters is the reverse of most digital meters.  Therefore, if you are measuring resistances with a digital meter, they will likely have the opposite values from the values shown here.", "PNP transistors will respond the same way except they will have completely opposite results from NPN transistors.", "The resistance checks described in this lesson are based on using an NPN transistor and an analog meter. Polarity with analog meters is the reverse of most digital meters. Therefore, if you are measuring resistances with a digital meter, they will likely have the opposite values from the values shown here."], "jumps": ["P1450", "P1430", "P1460", "P1440"]}, {"id": "P1460", "text": ["For example, with the negative lead on the emitter and the positive lead on the base of an NPN transistor the meter will read high resistance; on PNP types, it will read low resistance.", "As with the diode, a resistance check on a junction that reads high resistance with the meter leads in one configuration and low in the other is good."], "jumps": ["P1470", "P1450", "P1471"]}, {"id": "P1471", "text": ["The results will also be opposite when checking the Base/Collector junctions."], "jumps": ["P1480", "P1470"]}, {"id": "P1480", "text": ["DC voltage checks on transistors provide a good in-circuit analysis of their operational status."], "jumps": ["P1490", "P1470"]}, {"id": "P1490", "text": ["While transistor theory, with all the equations and exacting calculations, will provide specific voltage levels for any part of  the transistor or its biasing stage, \"number crunching\" of that order is not necessary for troubleshooting.", "While transistor theory, with all the equations and exacting calculations, will provide specific voltage levels for any part of the transistor or its biasing stage, \"number crunching\" of that order is not necessary for troubleshooting."], "jumps": ["P1500", "P1480"]}, {"id": "P1500", "text": ["Rather, a strong understanding of the relationships between the transistor's three sections as well as how they interface with the biasing network is the real issue.", "Most troubleshooting doesn't require interest in subtle variations of voltage or current levels.  In fact, most technicians ignore changes that are seen in tenths of a volt.", "Most troubleshooting doesn't require interest in subtle variations of voltage or current levels. In fact, most technicians ignore changes that are seen in tenths of a volt."], "jumps": ["P1510", "P1490", "P1520", "P1500"]}, {"id": "P1520", "text": ["Ordinarily, when a transistor or biasing component goes bad, there are dramatic changes in the circuit's normal DC biasing."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["While other sources may suggest different initial checks, measuring the collector (Vc) and emitter (Ve) voltages is usually an informative, quick check for the troubleshooter."], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["Having acquired those DC levels, subtract the emitter voltage from the collector voltage. The difference should be greater than 1 volt, but less than the applied voltage on the collector (Vcc).", "Vc - Ve Should result in more than 1 volt, but less than Vcc......ent phasehe re-assessment phase"], "jumps": ["P1550", "P1520"]}, {"id": "P1550", "text": ["If the result is a difference of less than one volt, the transistor may be shorted.  If the result is a difference that equals Vcc, the transistor may be open.", "If the result is a difference of less than one volt, the transistor may be shorted. If the result is a difference that equals Vcc, the transistor may be open."], "jumps": ["P1560", "P1540"]}, {"id": "P1560", "text": ["Next, measure the voltage drop across the base-emitter junction. There should be a drop of approximately .7 volts.  This .7 volts drop is typical for small signal amplifiers.", "Next, measure the voltage drop across the base-emitter junction. There should be a drop of approximately .7 volts. This .7 volts drop is typical for small signal amplifiers."], "jumps": ["P1570", "P1540"]}, {"id": "P1570", "text": ["For high current power transistors, the drop may be as much as 1 volt or more. A large deviation from this .7 volts is indicative of either a bad transistor or a problem in the emitter or base         biasing.", "For high current power transistors, the drop may be as much as 1 volt or more. A large deviation from this .7 volts is indicative of either a bad transistor or a problem in the emitter or base biasing."], "jumps": ["P1580", "P1560"]}, {"id": "P1580", "text": ["Troubleshooting the transistor circuit (biasing network) is as critical as the transistor itself.  Any defective component will cause incorrect DC levels at the transistor.  This will cause the transistor to operate outside the desired parameters or, commonly, shut it down.", "Troubleshooting the transistor circuit (biasing network) is as critical as the transistor itself. Any defective component will cause incorrect DC levels at the transistor. This will cause the transistor to operate outside the desired parameters or, commonly, shut it down."], "jumps": ["P1590", "P1560"]}, {"id": "P1590", "text": ["Transistors are configured and biased based upon their established function in the circuit.  Consequently, the component make-up of the biasing network will vary from circuit to circuit.", "Transistors are configured and biased based upon their established function in the circuit. Consequently, the component make-up of the biasing network will vary from circuit to circuit."], "jumps": ["P1600", "P1580"]}, {"id": "P1600", "text": ["For example, a transistor may have its emitter grounded, yet in another circuit the emitter may be biased with a resistor and capacitor.  This discussion on circuit troubleshooting will be based upon the transistor circuit shown below.", "For example, a transistor may have its emitter grounded, yet in another circuit the emitter may be biased with a resistor and capacitor. This discussion on circuit troubleshooting will be based upon the transistor circuit shown below."], "jumps": ["P1610", "P1580"]}, {"id": "P1610", "text": ["Open Emitter Resistor - If the emitter resistor is open, there will be no current in the emitter, base or collector circuits.  However, a voltmeter connected in the emitter circuit will complete a path from ground through the transistor to the voltage source.", "Open Emitter Resistor - If the emitter resistor is open, there will be no current in the emitter, base or collector circuits. However, a voltmeter connected in the emitter circuit will complete a path from ground through the transistor to the voltage source."], "jumps": ["P1620", "P1600"]}, {"id": "P1620", "text": ["Since a voltmeter resistance is commonly more than 10M ohm, it will drop most of the applied voltage.  Since there is no current in the base circuit, there is no voltage drop across the base resistor.  This will result in measuring nearly all the applied voltage on the meter.", "Since a voltmeter resistance is commonly more than 10M ohm, it will drop most of the applied voltage. Since there is no current in the base circuit, there is no voltage drop across the base resistor. This will result in measuring nearly all the applied voltage on the meter."], "jumps": ["P1630", "P1610"]}, {"id": "P1630", "text": ["Shorted Emitter Capacitor - If the capacitor across the emitter resistor shorts, the forward-bias voltage rises slightly.  This rise causes more current through the transistor and thus lowers the   collector voltage.  No voltage is developed across the shorted emitter circuit.", "Shorted Emitter Capacitor - If the capacitor across the emitter resistor shorts, the forward-bias voltage rises slightly. This rise causes more current through the transistor and thus lowers the collector voltage. No voltage is developed across the shorted emitter circuit."], "jumps": ["P1640", "P1610"]}, {"id": "P1640", "text": ["Open Base Resistor - An open base resistor prevents forward bias which turns off the transistor.  There is no current in the collector and emitter circuits, and no voltage drop across the emitter or collector resistors.", "Open Base Resistor - An open base resistor prevents forward bias which turns off the transistor. There is no current in the collector and emitter circuits, and no voltage drop across the emitter or collector resistors."], "jumps": ["P1650", "P1610"]}, {"id": "P1650", "text": ["Shorted Base Resistor - A shorted base resistor will ruin the transistor because of the excessively high forward-bias voltage."], "jumps": ["P1660", "P1610"]}, {"id": "P1660", "text": ["The transistor will become shorted from base to emitter, become shorted completely from emitter to collector, or open completely. In a shorted transistor, you'll measure the same voltage at the base, emitter and collector."], "jumps": ["P1670", "P1610"]}, {"id": "P1670", "text": ["Open Collector Resistor - An open collector resistor lowers the current through the emitter resistor, which, in turn, lowers the emitter and base voltages.  Forward bias current and voltage remain the same.", "Open Collector Resistor - An open collector resistor lowers the current through the emitter resistor, which, in turn, lowers the emitter and base voltages. Forward bias current and voltage remain the same."], "jumps": ["P1680", "P1610"]}, {"id": "P1680", "text": ["Shorted Collector Resistor - This short does not change the collector current, the forward-bias current, or the emitter and base voltages.  You still measure 4.5 volts from the collector to ground because the collector is tied directly to the applied voltage.", "Shorted Collector Resistor - This short does not change the collector current, the forward-bias current, or the emitter and base voltages. You still measure 4.5 volts from the collector to ground because the collector is tied directly to the applied voltage."], "jumps": ["P1690", "P1610"]}, {"id": "P1690", "text": ["Obviously, these are not the only faults that might be seen in a transistor circuit.  The important fact here is that the relationships between the biasing and the base, emitter and collector, remain fairly constant.", "Obviously, these are not the only faults that might be seen in a transistor circuit. The important fact here is that the relationships between the biasing and the base, emitter and collector, remain fairly constant."], "jumps": ["P1700", "P1610"]}, {"id": "P1700", "text": ["Capacitors are not nearly as mysterious as transistors and diodes, and are relatively simple components to understand and troubleshoot.  Most capacitors have high value capacitance but low breakdown voltage, normally in the range of 6 volts.", "When testing capacitors with an ohmmeter, make sure you use an ohmmeter that applies a voltage lower than the rated breakdown value of the capacitors.  Further, when checking electrolytic capacitors, maintaining correct polarity is a must. Also, use a resistance range of R X 10K or higher.", "Capacitors are not nearly as mysterious as transistors and diodes, and are relatively simple components to understand and troubleshoot. Most capacitors have high value capacitance but low breakdown voltage, normally in the range of 6 volts.", "When testing capacitors with an ohmmeter, make sure you use an ohmmeter that applies a voltage lower than the rated breakdown value of the capacitors. Further, when checking electrolytic capacitors, maintaining correct polarity is a must. Also, use a resistance range of R X 10K or higher."], "jumps": ["P1710", "P1690", "P1720", "P1700"]}, {"id": "P1720", "text": ["Just two things can happen to a capacitor:", "You may check a capacitor suspected of being open by disconnecting it from the circuit and checking it with a capacitor analyzer.  You can check a capacitor suspected of being leaky with an ohmmeter; if  it reads more than 500 kohms, it is more than likely bad.", "Just two things can happen to a capacitor: t may open up, effectively removing it completely from the circuit. 2. It may develop an internal short. This means that it begins to pass current as though it were a resistor or a direct short.", "1. It may open up, effectively removing it completely from the circuit. 2. It may develop an internal short. This means that it begins to pass current as though it were a resistor or a direct short.", "You may check a capacitor suspected of being open by disconnecting it from the circuit and checking it with a capacitor analyzer. You can check a capacitor suspected of being leaky with an ohmmeter; if it reads more than 500 kohms, it is more than likely bad."], "jumps": ["P1730", "P1710", "P1740", "P1720", "P1700"]}, {"id": "P1740", "text": ["However, capacitor troubles may be hard to find since they may appear intermittently or only under operating voltages. Therefore, the best check for a capacitor is to replace it with one known to be good.  If this restores proper operation, the fault was in the capacitor.", "However, capacitor troubles may be hard to find since they may appear intermittently or only under operating voltages. Therefore, the best check for a capacitor is to replace it with one known to be good. If this restores proper operation, the fault was in the capacitor."], "jumps": ["P1750", "P1730"]}, {"id": "P1750", "text": ["In many cases it will be necessary to check the power supply of  whatever equipment you are troubleshooting.  In fact, depending on the results of the front panel inspection, it may be the first place you choose to begin your troubleshooting.", "In many cases it will be necessary to check the power supply of whatever equipment you are troubleshooting. In fact, depending on the results of the front panel inspection, it may be the first place you choose to begin your troubleshooting."], "jumps": ["P1760", "P1740"]}, {"id": "P1760", "text": ["While safety should always be foremost whenever you are troubleshooting, working in and around power supplies creates a potential for severe electrical shock.", "One area that is sometimes overlooked and is a hazard is the method in which equipment is grounded.  By grounding the return side of the power transformer to the metal chassis, the load being supplied by the power supply can be wired directly to the metal chassis.", "CAUTIONNNUS AREA - Under no circumstance is this case to be opened. This machine is not user serviceable and dangerous high voltages are inside this case. In the event of difficulty, please notify your dealer for prompt service.t.", "HAZARDOUS AREA - Under no circumstance is this case to be opened. This machine is not user serviceable and dangerous high voltages are inside this case. In the event of difficulty, please notify your dealer for prompt service....", "One area that is sometimes overlooked and is a hazard is the method in which equipment is grounded. By grounding the return side of the power transformer to the metal chassis, the load being supplied by the power supply can be wired directly to the metal chassis."], "jumps": ["P1770", "P1750", "P1760", "P1780"]}, {"id": "P1780", "text": ["This negates the necessity of wiring directly to the return side of the transformer.  This method saves wire and reduces the cost of building the equipment.  While it solves one of the problems of the manufacturer, it creates a problem for the technician.", "Always ensure that the equipment and any test equipment you are using is properly grounded.  If possible, work standing on a rubber mat and try to keep only one hand on the equipment.", "This negates the necessity of wiring directly to the return side of the transformer. This method saves wire and reduces the cost of building the equipment. While it solves one of the problems of the manufacturer, it creates a problem for the technician.", "Always ensure that the equipment and any test equipment you are using is properly grounded. If possible, work standing on a rubber mat and try to keep only one hand on the equipment."], "jumps": ["P1790", "P1770", "P1800"]}, {"id": "P1800", "text": ["Almost all power supplies are composed of four sections:  transformer, rectifier, filter, and regulator.", "Almost all power supplies are composed of four sections: transformer, rectifier, filter, and regulator."], "jumps": ["P1810", "P1770"]}, {"id": "P1810", "text": ["High quality power supplies may also have a line conditioner (filter) that precedes the transformer.  Line filters are often made using high power Varistors.", "High quality power supplies may also have a line conditioner (filter) that precedes the transformer. Line filters are often made using high power Varistors."], "jumps": ["P1820", "P1800"]}, {"id": "P1820", "text": ["If a line filter goes bad, it will normally generate quite a lot of smoke and foul odor.  Line filters protect the power supply from spikes and varying voltage levels.  They are normally very easily  replaced.", "If a line filter goes bad, it will normally generate quite a lot of smoke and foul odor. Line filters protect the power supply from spikes and varying voltage levels. They are normally very easily replaced."], "jumps": ["P1830", "P1810"]}, {"id": "P1830", "text": ["The source of most power supply problems is most often located in the transformer.  The down side of this is that faulty transformers often cause problems in other parts of the power supply.", "The source of most power supply problems is most often located in the transformer. The down side of this is that faulty transformers often cause problems in other parts of the power supply."], "jumps": ["P1840", "P1810"]}, {"id": "P1840", "text": ["Because the rectifier, filter and regulator are composed of resistors, capacitors, diodes and transistors, which have already been discussed, focus will be on transformers.  The major problems that may develop in a transformer are:", "Because the rectifier, filter and regulator are composed of resistors, capacitors, diodes and transistors, which have already been discussed, focus will be on transformers. The major problems that may develop in a transformer are:", "1. A winding can open. 2. Two or more turns of one winding may short together. 3. A winding can short to the casing which is usually grounded. 4. The primary and secondary windings may short together..........................."], "jumps": ["P1850", "P1830"]}, {"id": "P1850", "text": ["Once it's known which of the four possible troubles could be causing the symptoms, there are definitive steps to take.  If you surmise that there is an open winding, or windings shorted together or to ground, a continuity check will locate and verify the problem.", "Once it's known which of the four possible troubles could be causing the symptoms, there are definitive steps to take. If you surmise that there is an open winding, or windings shorted together or to ground, a continuity check will locate and verify the problem."], "jumps": ["P1860", "P1840"]}, {"id": "P1860", "text": ["If the turns of a winding are shorted together, you may not be able to detect a difference in winding resistance. Therefore, you need to connect a good transformer in place of the old one and see if the symptoms are eliminated."], "jumps": ["P1870", "P1840"]}, {"id": "P1870", "text": ["Keep in mind that replacing transformers is commonly an involved task.  Make sure that the trouble is not elsewhere in the circuit before changing the transformer.", "Occasionally, the shorts will only appear when the operating voltages are applied to the transformer.  In this case you might find the trouble with a megger (megohmmeter), which applies a high voltage as it reads resistance.", "The process of signal tracing through a receiver is fairly simple and straight forward. It involves systematically observing a tuned frequency along its designed signal path. This frequency may be derived from a live broadcast or generated by test equipment.", "Keep in mind that replacing transformers is commonly an involved task. Make sure that the trouble is not elsewhere in the circuit before changing the transformer.", "Occasionally, the shorts will only appear when the operating voltages are applied to the transformer. In this case you might find the trouble with a megger (megohmmeter), which applies a high voltage as it reads resistance."], "jumps": ["P1880", "P1860", "P1890", "P3010", "PLL"]}, {"id": "P1910", "text": ["This completes the information on BASIC TROUBLESHOOTING FUNDAMENTALS."], "jumps": ["P1890"]}, {"id": "P1920", "text": ["1.  The troubleshooting process consists of four basic phases:", "1. The troubleshooting process consists of four basic phases:", "1. The assessment phase 2. The troubleshooting phase 3. The repair phase 4. The re-assessment phaseeeeeeeehase 4. The re-assessment phase"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Keep it simple.  Always check the easy things first.  Look for:", "3.  Localization is the process of narrowing a problem's location        down to a particular stage or section of receiver or other                 equipment.", "4.  Isolation is the process of identifying the bad component                within the localized stage or section.", "2. Keep it simple. Always check the easy things first. Look for:", "a. unplugged power cords b. disconnected cables c. burned out light bulbs d. controls in wrong position e. blown fusessessment phaseeehase", "3. Localization is the process of narrowing a problem's location down to a particular stage or section of receiver or other equipment.", "4. Isolation is the process of identifying the bad component within the localized stage or section."], "jumps": ["P1940", "P1920", "P1950", "P1930", "P1960"]}, {"id": "P1960", "text": ["5.  A diode's FB (Forward to Back) ratio is calculated by dividing        the reverse resistance by the forward resistance.", "5. A diode's FB (Forward to Back) ratio is calculated by dividing the reverse resistance by the forward resistance.", "Reverse Resistance FB Ratio = Forward Resistancease 4. The re-assessment phasere-assessment phase phase"], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  When making resistance checks on diodes and transistors,            the meter should be set to a medium resistance range.", "6. When making resistance checks on diodes and transistors, the meter should be set to a medium resistance range."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7.  A good start point for voltage checks on a transistor is the              emitter and collector.", "7. A good start point for voltage checks on a transistor is the emitter and collector."], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["8.  Two problems may occur in a capacitor:", "9.  Always use a resistance range of 10 k or higher when                      checking capacitors.", "8. Two problems may occur in a capacitor:.................", "1. It may open. 2. It may short. Forward Resistance Forward Resistancease 4. The re-assessment phasere-assessment phase phase", "9. Always use a resistance range of 10 k or higher when checking capacitors."], "jumps": ["P1991", "P1980", "P1992", "P1990", "P1700"]}, {"id": "P1992", "text": ["10.  The major problems that may develop in a transformer are:", "10. The major problems that may develop in a transformer are:", "1. A winding can open. 2. Two or more turns of one winding may short together. 3. A winding can short to the casing which is usually grounded. 4. The primary and secondary windings may short together..........................."], "jumps": ["P1993", "P1991"]}, {"id": "P1993", "text": ["11.  Signal tracing is systematically observing a tuned frequency         along its designed signal path.", "11. Signal tracing is systematically observing a tuned frequency along its designed signal path."], "jumps": ["P1994", "P1992"]}, {"id": "P1994", "text": ["12.  The \"divide and conquer\" method of signal tracing involves           picking a point somewhere in the middle of the signal path             and checking there first.  If the signal is present, work                       towards the receiver's output.  If the signal was not present,           work towards the receiver's front end.", "12. The \"divide and conquer\" method of signal tracing involves picking a point somewhere in the middle of the signal path and checking there first. If the signal is present, work towards the receiver's output. If the signal was not present, work towards the receiver's front end."], "jumps": ["P1995", "P1993"]}, {"id": "P1995", "text": ["13.  Signal Injection is the process of applying a generated signal        of some appropriate frequency either to the receiver's                      antenna input or to some other point along the signal path.", "13. Signal Injection is the process of applying a generated signal of some appropriate frequency either to the receiver's antenna input or to some other point along the signal path."], "jumps": ["P1999", "P1994", "P3070"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "If the primary symptom is no audio output and the receiver lacks a signal strength meter or some other visual form of signal detection, the best overall tracing approach is a back to front progression.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1995", "P3020", "P1890"]}, {"id": "P3020", "text": ["This involves checking for the signal beginning at the receivers output (speaker) and working backwards to the input (antenna). While this is a comprehensive approach, it does have a downside."], "jumps": ["P3030", "P3010"]}, {"id": "P3030", "text": ["If the fault resides in the receiver's front end, you will have traced all the way through the receiver before you locate the problem."], "jumps": ["P3020"]}, {"id": "P3040", "text": ["An alternative approach is the \"divide and conquer\" method. This involves picking a point somewhere in the middle of the signal path and checking there first."], "jumps": ["P3020"]}, {"id": "P3050", "text": ["If the signal is present, work towards the receiver's output.  If the signal is not present, work towards the front end.", "If the signal is present, work towards the receiver's output. If the signal is not present, work towards the front end."], "jumps": ["P3060", "P3030"]}, {"id": "P3060", "text": ["In either case, continued division of the remaining circuitry will localize the problem area more rapidly than if you were to trace through the entire signal path.  Always go first to the output of      whatever stage you are checking.  If the signal is good at the output, the input must be good!", "More than likely, a live broadcast RF signal coming into the antenna will be way too small for detection by the oscilloscope.", "In either case, continued division of the remaining circuitry will localize the problem area more rapidly than if you were to trace through the entire signal path. Always go first to the output of whatever stage you are checking. If the signal is good at the output, the input must be good!"], "jumps": ["P3040", "PLL"]}, {"id": "P3080", "text": ["If your signal tracing efforts have brought you into the front end (prior to the RF amp) you will need to use a Function or Signal Generator in order to continue signal tracing."], "jumps": ["P3070"]}, {"id": "P3090", "text": ["Signal Injection is the process of applying a generated signal of some appropriate frequency either to the receiver's antenna input or some other place along the signal path."], "jumps": ["P3070"]}, {"id": "P3100", "text": ["Signal injection is normally performed in conjunction with signal tracing.  This is so the injected signal can be viewed and\\or measured as it's being injected.", "Signal injection is normally performed in conjunction with signal tracing. This is so the injected signal can be viewed and\\or measured as it's being injected."], "jumps": ["P3070"]}, {"id": "P3110", "text": ["During localization, injection is normally done at the antenna input.  However, if (for example) the audio amplifier stage is known to be faulty, you may wish to inject a 1 kHz tone directly to the input of the audio amplifier stage.", "During localization, injection is normally done at the antenna input. However, if (for example) the audio amplifier stage is known to be faulty, you may wish to inject a 1 kHz tone directly to the input of the audio amplifier stage."], "jumps": ["P3100"]}, {"id": "P3120", "text": ["This precludes having to tune the receiver to the frequency generated by your test equipment and also may be quicker than doing a DC analysis of the circuit."], "jumps": ["P3100"]}, {"id": "P3130", "text": ["Whenever you are injecting into a receiver's signal path, be it at the antenna input or the AF amplifier, keep the injected signal's amplitude at minimum and slowly raise it until signal can be seen and/or heard."], "jumps": ["P3100"]}, {"id": "P3140", "text": ["Portions of the receiver are designed to work with microvolts and can be destroyed if too large a signal is introduced.  Also, an overly strong signal may produce false readings during your         troubleshooting endeavor.", "Portions of the receiver are designed to work with microvolts and can be destroyed if too large a signal is introduced. Also, an overly strong signal may produce false readings during your troubleshooting endeavor."], "jumps": ["P1910"]}, {"id": "P10001 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
