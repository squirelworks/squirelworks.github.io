umps": []}, {"id": "P1092", "text": ["120 and 121 are not combined in an AND logic sequence. Both inputs do not need to be true for the output to be true."], "jumps": []}, {"id": "P1093", "text": ["Inputs 121 and 122 are combined in an AND logic sequence. Both inputs must be true for the output to be true even though 122 is normally closed."], "jumps": []}, {"id": "P1100", "text": ["We are familiar with the normally open and normally closed types of input instructions. These are identified as relay logic instructions because they operate using a single bit of data.", "Equal Not Equal Less Than or Equal Greater Than Greater Than or Equal Masked Comparisonnn"], "jumps": ["P1110", "P1090", "P1105"]}, {"id": "P1105", "text": ["NORMALLY OPENED - A normally opened contact is true (closed) when the applied condition is 1 (ON), and false (opened) when the applied condition is 0 (OFF). Also called Examine if Closed (XIC). NORMALLY CLOSED - A normally closed contact is false (opened) when the applied condition is 1 (ON), and true (closed) when the applied condition is 0 (OFF). Also called Examine if Opened (XIO).good communication skills, dexterity, visual acuity and good hearing.t required but most body repairers do belong to a union..ematics, Electronics for some.aws up orders and checks automobile prior to delivery. Advertising and telephone marketing may be required at slow times. Environment - Clean well lighted showroom or outside on a lot. Evenings, days and weekends. Requirements - Must be able to maintain a pleasant attitude with people under stressful conditions. Good personal appearance and manners are important.SALES Duties - Sells automobiles, automobile parts, and automobile maintenance. Draws up orders and checks automobile prior to delivery. Advertising and telephone marketing may be required at slow times. Environment - Clean well lighted showroom or outside on a lot. Evenings, days and weekends. Requirements - Must be able to maintain a pleasant attitude wit nation of written descriptions and operational diagrams often work best.", "Start and stop push buttons control a motor. The motor starts when the start button is closed. The motor stops when the stop button is closed."], "jumps": ["P2080", "P2050"]}, {"id": "P2080", "text": ["Step 2. Identify the Input and Output Connections Our inputs are the two push button switches and the motor is the output. A more complex system may require a separate listing of the inputs and outputs."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["Step 3. Refinement Describe the process in more specific terms. We want the motor to stay on when the start push button is released but our current diagram does not reflect this."], "jumps": ["P2100", "P2070"]}, {"id": "P2100", "text": ["The current diagram indicates that the motor turns only as long as the start button is depressed since the current path is broken once the button is released."], "jumps": ["P2110", "P2070"]}, {"id": "P2110", "text": ["The diagram needs to be altered in order to obtain the desired results."], "jumps": ["P2120", "P2070"]}, {"id": "P2120", "text": ["Step 4. Program Development Notice how our operational diagram already looks very similar to a ladder logic program."], "jumps": ["P2130", "P2070"]}, {"id": "P2130", "text": ["Write the ladder logic program and then recheck the program to be sure that it will perform the process as expected."], "jumps": ["P2140", "P2070"]}, {"id": "P2140", "text": ["When the start button is closed, BO is latched and the motor turns."], "jumps": ["P2150", "P2070"]}, {"id": "P2150", "text": ["The motor stays on when the start button is released because of the LATCH instruction in the first rung."], "jumps": ["P2160", "P2070"]}, {"id": "P2160", "text": ["The motor stops when the stop button is depressed because of the UNLATCH instruction in the second rung."], "jumps": ["P2170", "P2070"]}, {"id": "P2170", "text": ["Additional refinement is often required after observing how the PL let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
