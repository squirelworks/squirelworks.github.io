 rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: CAVITY RESONATORS AND TUBE MICROWAVE DEVICESsadf"], "jumps": []}, {"id": "P10", "text": ["CAVITY RESONATORS AND TUBE MICROWAVE DEVICES"], "jumps": []}, {"id": "P100", "text": ["w Describe the basic principle of microwave tubes and their limitations. w Describe the basic theory and operation of Klystrons and Magnetrons.", "w Describe the purpose of cavity resonators. w Describe the basic theory and operation of cavity resonators."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["You have learned that microwave frequencies are very high and they have very short wave lengths."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["High frequency and short wavelengths present special problems in the components used to generate and amplify microwave frequencies."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Conventional vacuum tubes and LC tank circuits cannot be used."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["Special types of vacuum tubes and special components are used at microwave frequencies.", "Backward Wave Oscillator Cavity Resonators Magnetron Klystron TWT TWT TWT TWT TWTTWTTTen in HELP frames.. Red test Lead ............... V input jack Black test Lead ............ COMM input jackput jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk"], "jumps": ["P440", "P410"]}, {"id": "P440", "text": ["Let's begin the lesson on CAVITY RESONATORS AND TUBE MICROWAVE DEVICES......"], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Cavity resonators are microwave devices that perform the function of a parallel LC circuit."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["They are used in place of a capacitor and inductor in microwave circuits."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["For example, a cavity resonator can be used as the tank circuit in an oscillator to determine frequency."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Conventional components are not used because they cannot be manufactured with small enough values to produce the high microwave frequencies."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["For example, to produce a resonant frequency of 10 GHz, the value of L times C must be 2.536 x 10    .", "For example, to produce a resonant frequency of 10 GHz, the value of L times C must be 2.536 x 10 ."], "jumps": ["P1070", "P1020", "P1065"]}, {"id": "P1062", "text": ["For example, to produce a resonant frequency of 10 GHz, the value of L times C must be 2.536 x 10    .", "For example, to produce a resonant frequency of 10 GHz, the value of L times C must be 2.536 x 10 ."], "jumps": ["P1070", "P1020", "P1065"]}, {"id": "P1065", "text": ["using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "o = 2p SLC 1 = 6.28 S 2.536 x 10 1 = 6.28 (1.5925 x 10 ) 1 = 10.00 x 10 = .1 x 10 or 10 GHz .............. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk", "For Example: L = 1 x 10 Henrys C = 2.536 x 10 Farads"], "jumps": []}, {"id": "P1070", "text": ["A cavity resonator has extremely small values of capacitance and inductance that can resonate in the microwave frequency range."], "jumps": ["P1080", "P1062", "P1075"]}, {"id": "P1073", "text": ["A cavity resonator has extremely small values of capacitance and inductance that can resonate in the microwave frequency range."], "jumps": ["P1080", "P1062", "P1075"]}, {"id": "P1075", "text": [], "jumps": []}, {"id": "P1080", "text": ["A cavity resonator is defined as any space completely enclosed by conducting walls that can", "A cavity resonator is defined as any space completely enclosed by conducting walls that can contain oscillating electromagnetic fields and possess resonant properties."], "jumps": ["P1090", "P1073"]}, {"id": "P1090", "text": ["For example, sealing the open ends of a waveguide section makes a cavity resonator."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["How cavity resonators operate is best described as placing an infinite number of shorted quarter wave transmission lines together.  Let's see why.", "How cavity resonators operate is best described as placing an infinite number of shorted quarter wave transmission lines together. Let's see why."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["By shorting a transmission line, the line becomes a parallel LC circuit."], "jumps": ["P1120", "P1090"]}, {"id": "P1120", "text": ["The values of L and C are extremely small making the resonant frequency extremely high."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["The frequency at which the circuit becomes resonant is determined by where the shorting bar is placed."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["Placing the shorting bar at a distance that equals one quarter wave length of the desired frequency produces a resonant circuit."], "jumps": ["P1150", "P1110"]}, {"id": "P1150", "text": ["The shorted transmission line could be used by itself to produce a resonant circuit; however the power handling capability and the Q value are low."], "jumps": ["P1160", "P1110"]}, {"id": "P1152", "text": ["The shorted transmission line could be used by itself to produce a resonant circuit; however the power handling capability and the Q value are low."], "jumps": ["P1160", "P1110"]}, {"id": "P1155", "text": ["\"Q VALUE\" - The letter Q represents the quality of a reactive circuit, based on the comparison of reactance to resistance.", "For example: The higher the Q the narrower the bandwidth, the higher the circuit gain and the sharper the frequency response curve."], "jumps": []}, {"id": "P1160", "text": ["Placing two shorted transmission lines together increases the power handling capability.", "Placing two shorted transmission lines together increases the power handling capability. The resonant frequency is not changed."], "jumps": ["P1170", "P1152"]}, {"id": "P1170", "text": ["As total capacitance increases, total inductance decreases in proportion so resonant frequency is not changed.", "As total capacitance increases, total inductance decreases in proportion so resonant frequency is not changed. changed."], "jumps": ["P1180", "P1160", "P1175"]}, {"id": "P1172", "text": ["As total capacitance increases, total inductance decreases in proportion so resonant frequency is not changed.", "As total capacitance increases, total inductance decreases in proportion so resonant frequency is not changed. reases in proportion."], "jumps": ["P1180", "P1160", "P1175"]}, {"id": "P1175", "text": ["using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "L1 + L2 (decreases) Ct = C1 + C2 (increases)hroughout this course. ainer are given in HELP frames.. Red test Lead ............... V input jack Black test Lead ............ COMM input jackput jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk", "RESONANT FREQUENCY - The values of L and C change when a second shorted quarter wave transmission line is added, but they change in proportion so that L x C does not change."], "jumps": []}, {"id": "P1180", "text": ["The progression from a shorted quarter wave transmission line to a cavity resonator is simple."], "jumps": ["P1190", "P1172"]}, {"id": "P1190", "text": ["Join several two section shorted quarter wave transmission lines together and enclose the ends."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["The advantages of using a cavity resonator are:", "The advantages of using a cavity resonator are:............", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "1) High Q (small resistance) 2) High Power 3) Small Size 4) Ruggedness throughout this course. ainer are given in HELP frames.. Red test Lead ............... V input jack Black test Lead ............ COMM input jackput jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk"], "jumps": ["P1210", "P1180"]}, {"id": "P1210", "text": ["A common method of constructing a cavity resonator is in the cylindrical form."], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["Whatever the shape, a cavity resonator is an enclosed space surrounded by conductors that have a resonant frequency. The  frequency is determined by the cavity dimensions.", "Whatever the shape, a cavity resonator is an enclosed space surrounded by conductors that have a resonant frequency. The frequency is determined by the cavity dimensions."], "jumps": ["P1240", "P1210"]}, {"id": "P1240", "text": ["A cavity resonator acts like an _______", "A cavity resonator acts like an _______.?ircuit?_____?__?____?"], "jumps": ["P1210"]}, {"id": "P1241", "text": [], "jumps": []}, {"id": "P1242", "text": ["A cavity resonator is used as a resonant circuit, not a resistive inductive circuit.", "A cavity resonator is used as a resonant circuit, not a resistive inductive circuit.."], "jumps": []}, {"id": "P1243", "text": ["A cavity resonator is used as a resonant circuit, not a resistive capacitive circuit.", "A cavity resonator is used as a resonant circuit, not a resistive capacitive circuit.."], "jumps": []}, {"id": "P1250", "text": ["How can a cavity resonator be best described?", "How can a cavity resonator be best described?..............", "Two shorted quarter wavelength sections..", "One shorted quarter wavelength section..", "Any number of shorted quarter wave length sections that enclose a space."], "jumps": ["P1240"]}, {"id": "P1251", "text": [], "jumps": []}, {"id": "P1252", "text": ["Two quarter wave length sections produce a resonant circuit not a cavity resonator.", "Two quarter wave length sections produce a resonant circuit not a cavity resonator. resonator."], "jumps": []}, {"id": "P1253", "text": ["One quarter wave length section produces a resonant circuit not a cavity resonator.", "One quarter wave length section produces a resonant circuit not a cavity resonator. resonator."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on CAVITY RESONATORS.", "This completes the information on CAVITY RESONATORS........"], "jumps": ["P1250"]}, {"id": "P1920", "text": ["1.  A cavity resonator is an LC circuit and that is used as a\n     resonant circuit.", "1. A cavity resonator is an LC circuit and that is used as a resonant circuit.. circuit."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.", "2. A cavity resonator is an enclosed space surrounded by a conductor.", "2. A cavity resonator is defined as any space completely enclosed by conducting walls that can contain oscillating electromagnetic fields and possess resonant properties..."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The operation of a cavity resonator is based on the operation        of a shorted transmission line.", "3. The operation of a cavity resonator is based on the operation of a shorted transmission line."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  Joining an infinite number of shorted transmission lines                  together forms a cavity resonator.", "4. Joining an infinite number of shorted transmission lines together forms a cavity resonator..."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  Cavity resonators come in various shapes.", "5. Cavity resonators come in various shapes..............."], "jumps": ["P1999", "P1950"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1960"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["Vacuum tubes are used in microwave circuits for the same purpose that tubes are used in conventional circuits.", "Vacuum tubes are used in microwave circuits for the same purpose that tubes are used in conventional circuits. .U=2248", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "Amplifiers Oscillators Mixers ay remain assembled and configured throughout this course. ainer are given in HELP frames.. Red test Lead ............... V input jack Black test Lead ............ COMM input jackput jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk"], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["However, there are characteristics in vacuum tubes that decrease the efficiency of the tube as frequency increases."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["Since microwaves are high frequency signals, these characteristics become increasingly important."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["The characteristics that limit a vacuum tube's efficiency at microwave frequencies are:", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "Interelectrode Capacitance Lead Inductance Electron Transit Timeconfigured throughout this course. ainer are given in HELP frames.. Red test Lead ............... V input jack Black test Lead ............ COMM input jackput jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk"], "jumps": ["P2060", "P2020"]}, {"id": "P2060", "text": ["Let's discuss interelectrode capacitance first.", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "Interelectrode Capacitance Lead Inductance Electron Transit Timeconfigured throughout this course. ainer are given in HELP frames.. Red test Lead ............... V input jack Black test Lead ............ COMM input jackput jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk"], "jumps": ["P2070", "P2020"]}, {"id": "P2070", "text": ["Interelectrode capacitance is caused by the elements in the vacuum tube acting as the plates of a capacitor."], "jumps": ["P2080", "P2020"]}, {"id": "P2080", "text": ["This capacitance is very small; however, it can ground signals (Cpk and Cgk) and cause feedback (Cpg)."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["For example, a 3.2 pF plate to cathode capacitance at 1 kHz has an Xc of 50 MW.", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "venience, the microwave trainer may remain assembled and configured throughout this course. ainer are given in HELP frames.. Red test Lead ............... V input jack Black test Lead ............ COMM input jackput jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk"], "jumps": ["P2100", "P2070"]}, {"id": "P2100", "text": ["The high reactance, at an audio frequency, has no effect in the circuit."], "jumps": ["P2110", "P2070"]}, {"id": "P2110", "text": ["At 1 MHz, the plate to cathode reactance changes to 50 kW."], "jumps": ["P2120", "P2070"]}, {"id": "P2120", "text": ["The reactance, at a radio frequency, will short some of the output signal to ground.  The circuit will operate at a reduced efficiency.", "The reactance, at a radio frequency, will short some of the output signal to ground. The circuit will operate at a reduced efficiency."], "jumps": ["P2130", "P2070"]}, {"id": "P2130", "text": ["However, at 1 GHz, the plate to cathode reactance changes to\n50 W.", "However, at 1 GHz, the plate to cathode reactance changes to 50 W.."], "jumps": ["P2140", "P2070"]}, {"id": "P2140", "text": ["The low reactance, at a microwave frequency, grounds the output signal and the tube no longer operates."], "jumps": ["P2150", "P2070"]}, {"id": "P2150", "text": ["The effects of interelectrode capacitance are reduced by placing the tube elements farther apart and by decreasing the size of the elements."], "jumps": ["P2160", "P2070"]}, {"id": "P2160", "text": ["The second limiting characteristic is lead inductance.", "The second limiting characteristic is lead inductance......", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "Interelectrode Capacitance Lead Inductance Electron Transit Timeimeimeeeeeeeeeeeured throughout this course. ainer are given in HELP frames.. Red test Lead ............... V input jack Black test Lead ............ COMM input jackput jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk"], "jumps": ["P2170", "P2070"]}, {"id": "P2170", "text": ["Lead inductance is caused by the conductors (leads) in the vacuum tube acting as inductors due to the skin effect at high frequencies."], "jumps": ["P2175", "P2180", "P2160"]}, {"id": "P2175", "text": ["SKIN EFFECT - At high frequencies, current flows on the outer surfaces of a conductor only, not thru the wire."], "jumps": []}, {"id": "P2178", "text": ["The current flow actually circles the conductor, just like current flow through a coil.  This produces inductance.", "The current flow actually circles the conductor, just like current flow through a coil. This produces inductance.............."], "jumps": []}, {"id": "P2180", "text": ["This inductance is very small; however, it can attenuate input and output signals."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["For example, a 3.2 mH grid inductance at 1 kHz has an XL of\n.02 W.", "For example, a 3.2 mH grid inductance at 1 kHz has an XL of .02 W..", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "venience, the microwave trainer may remain assembled and configured throughout this course. ainer are given in HELP frames.. Red test Lead ............... V input jack Black test Lead ............ COMM input jackput jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk"], "jumps": ["P2200", "P2170"]}, {"id": "P2200", "text": ["The low reactance, at an audio frequency, has no effect in the circuit."], "jumps": ["P2210", "P2170"]}, {"id": "P2210", "text": ["At 1 MHz, the grid reactance changes to 20 W."], "jumps": ["P2220", "P2170"]}, {"id": "P2220", "text": ["The reactance, at a radio frequency, will attenuate some of the input signal.  The circuit will operate at a reduced efficiency.", "The reactance, at a radio frequency, will attenuate some of the input signal. The circuit will operate at a reduced efficiency."], "jumps": ["P2230", "P2170"]}, {"id": "P2230", "text": ["However, at 1 GHz, the grid reactance changes to 20 kW."], "jumps": ["P2240", "P2170"]}, {"id": "P2240", "text": ["The high reactance, at a microwave frequency, attenuates most of the input signal.  The tube no longer operates.", "The high reactance, at a microwave frequency, attenuates most of the input signal. The tube no longer operates."], "jumps": ["P2250", "P2170"]}, {"id": "P2250", "text": ["The effects of lead inductance are reduced by making the leads as short as possible."], "jumps": ["P2260", "P2170"]}, {"id": "P2260", "text": ["The last limiting characteristic is electron transit time.", "The last limiting characteristic is electron transit time..", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "Interelectrode Capacitance Lead Inductance Electron Transit Timeimeimeimeconfigured throughout this course. ainer are given in HELP frames.. Red test Lead ............... V input jack Black test Lead ............ COMM input jackput jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk"], "jumps": ["P2270", "P2170"]}, {"id": "P2270", "text": ["Electron transit time is the time for electrons to travel from the cathode to the plate."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["Transit time causes phase shifts between grid voltage and plate current.  Power losses can be high.", "Transit time causes phase shifts between grid voltage and plate current. Power losses can be high."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["For efficient vacuum tube operation, the grid voltage and plate current must be in phase and the power losses have to be low."], "jumps": ["P2300", "P2270"]}, {"id": "P2300", "text": ["For example, a transit time of .5 nanoseconds between the grid and plate is only .0000005 cycles at 1 kHz."], "jumps": ["P2310", "P2270", "P2305"]}, {"id": "P2302", "text": ["For example, a transit time of .5 nanoseconds between the grid and plate is only .0000005 cycles at 1 kHz."], "jumps": ["P2310", "P2270", "P2305"]}, {"id": "P2305", "text": ["using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "main assembled and configured throughout this course. ainer are given in HELP frames.. Red test Lead ............... V input jack Black test Lead ............ COMM input jackput jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk", "TRANSIT TIME CYCLES - A signal that is 1 kHz has a period of 1millisecond. A transit time of .5 nanoseconds is only 2/1,000,000 of the time for one cycle or .0000005 cycles."], "jumps": []}, {"id": "P2310", "text": ["There is effectively no phase shift between the grid and plate or power loss through the grid."], "jumps": ["P2320", "P2302"]}, {"id": "P2320", "text": ["At 1 MHz, a .5 nanosecond transit time is .0005 cycles.  Again, there is no phase shift or power loss.", "At 1 MHz, a .5 nanosecond transit time is .0005 cycles. Again, there is no phase shift or power loss."], "jumps": ["P2330", "P2302"]}, {"id": "P2330", "text": ["However, at 1 GHz, a .5 nanosecond transit time is .5 cycles or one half cycle."], "jumps": ["P2340", "P2302"]}, {"id": "P2340", "text": ["This is a 180 degree phase shift between the grid voltage and plate current.  Also, because of the phase shift there is a power loss through the grid.", "This is a 180 degree phase shift between the grid voltage and plate current. Also, because of the phase shift there is a power loss through the grid."], "jumps": ["P2350", "P2302"]}, {"id": "P2350", "text": ["The efficiency of the vacuum tube is greatly reduced."], "jumps": ["P2360", "P2302"]}, {"id": "P2360", "text": ["Transit time is reduced in vacuum tubes by decreasing the spacing between the elements."], "jumps": ["P2370", "P2302"]}, {"id": "P2370", "text": ["Which characteristic of a vacuum tube can attenuate an input signal at high frequencies?"], "jumps": ["P2302"]}, {"id": "P2371", "text": [], "jumps": []}, {"id": "P2372", "text": ["Interelectrode capacitance is in parallel to the output signal (to ground).  At high frequencies, the reactance is low which grounds the output signal.", "Interelectrode capacitance is in parallel to the output signal (to ground). At high frequencies, the reactance is low which grounds the output signal."], "jumps": []}, {"id": "P2373", "text": ["Transit time at high frequencies causes a phase shift between the grid voltage and plate current which reduces the efficiency of the tube."], "jumps": []}, {"id": "P2380", "text": ["Which characteristic of a vacuum tube can attenuate an output signal at high frequencies?"], "jumps": ["P2370"]}, {"id": "P2381", "text": [], "jumps": []}, {"id": "P2382", "text": ["Lead inductance is in series with the input signal.  At high frequencies, the reactance is high which attenuates the input signal.", "Lead inductance is in series with the input signal. At high frequencies, the reactance is high which attenuates the input signal.ds the output signal."], "jumps": []}, {"id": "P2383", "text": ["Transit time at high frequencies causes a phase shift between the grid voltage and plate current which reduces the efficiency of the tube."], "jumps": []}, {"id": "P2390", "text": ["As you have seen, normal vacuum tubes are not efficient at microwave frequencies."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["If you try to decrease interelectrode capacitance by increasing the spacing between the elements, you increase the transit time."], "jumps": ["P2410", "P2390"]}, {"id": "P2410", "text": ["If you decrease the size of the tube to decrease interelectrode capacitance and lead inductance, you lower the power handling capabilities."], "jumps": ["P2420", "P2390"]}, {"id": "P2420", "text": ["For these reasons, special microwave tubes were developed.\n\n                                   Klystrons             Magnetrons", "For these reasons, special microwave tubes were developed. Klystrons Magnetronss"], "jumps": ["P2430", "P2390"]}, {"id": "P2430", "text": ["Let's discuss klystrons first.\n\n                                   Klystrons             Magnetrons", "A Klystron tube is capable of operating as an amplifier, oscillator or mixer.", "Let's discuss klystrons first. Klystrons Magnetrons"], "jumps": ["P2440", "P2390", "P2445"]}, {"id": "P2445", "text": ["The frequency range is between 800 MHz and 30 GHz.  The basic operation is as follows.", "A filament, cathode and accelerating grid produce a stream of electrons that travel along the tube toward a collector plate.  Along the way they pass a cavity called the buncher cavity, which is connected to a pair of grids.", "The frequency range is between 800 MHz and 30 GHz. The basic operation is as follows.", "A filament, cathode and accelerating grid produce a stream of electrons that travel along the tube toward a collector plate. Along the way they pass a cavity called the buncher cavity, which is connected to a pair of grids...", "The buncher cavity is constructed in such a way as to act as a tuned circuit, with the AC (RF) input signal coming in and being applied to the pair of grids, which are connected to the cavity.", "As the first grid becomes positive and the second becomes negative, the electrons approaching the cavity are accelerated forward by the first grid. signal.", "The electrons are first accelerated into the grid space by the positive first grid and are then slowed by the negatively charged second grid. grid. signal.", "As the input changes polarity, the grids also change polarity. Now the electrons that are between the grids are accelerated forward by the (now positive) second grid, while the electrons approaching the (now negative) first grid are slowed by its charge..", "Then the signal's polarity again reverses, and the process repeats. The result is that the electron stream has been turned into a series of clusters (or bunches) of electrons. The distance which separates the bunches corresponds to the frequency of the original input signal....", "Keep in mind that the amount of acceleration or deceleration that the electrons experience is dependent on two things: their relative distances from the charged grids and the varying amount of charge on the grids.", "This means that the electrons within the bunches will have differing velocities. This process is called velocity modulation.ard by the first grid. signal.", "This means that the electrons within the bunches will have differing velocities. This process is called velocity modulation.ng applied to the pair of grids, which are connected to the cavity."], "jumps": ["P2450", "P2440", "P2460", "P2490", "P2500", "P2510", "P2520", "P2530", "P2540"]}, {"id": "P2525", "text": ["VELOCITY MODULATION - Modification of an electron stream by an alternate acceleration and deceleration of the electrons with a period comparable to that of the transit time in the space concerned...", "After leaving the buncher grids, the bunched electrons enter an area called the drift space. In this area, the differences in velocity of the electrons within the bunch continue to accumulate, so the bunch becomes even more densely packed..."], "jumps": ["P2560", "P2522"]}, {"id": "P2540", "text": ["After the catcher cavity they continue on to the collector plate.", "Interelectrode capacitance is reduced by the spacing of the elements.", "Lead inductance is reduced by keeping the lengths of internal leads to minimum.", "Transit time does not affect the operation since the output is taken from a cavity.  Phase between the input and output is not important.", "For the klystron to operate as an oscillator, the catcher cavity is connected back to the buncher cavity through a feedback loop.", "Left to themselves, the faster electrons would overtake and pass the slower ones and the clustering effect would be nearly nullified.he first grid. signal.", "However, the length of the drift space is carefully planned in such a way that, as the bunching effect reaches its peak, the bunch encounters the pair of grids at the catcher cavity.", "As the electrons pass through these grids, they give up much of their energy through inductance. This energy is then passed from the catcher grids to the catcher cavity which, like the buncher cavity, is a tuned cavity...", "At the buncher cavity, some electrons were speeded up (gained energy) and others were slowed down (lost energy).elerated forward by the first grid. signal.", "The net result was that, although there was a modulating effect on the electrons' velocities, there was no significant change in the overall energy of the electron stream.", "As the first grid becomes positive and the second becomes negative, the electrons approaching the cavity are accelerated forward by the first grid. signal.", "After the catcher cavity they continue on to the collector plate.d then out of the tube..lectron beam as it moves past the buncher grids."], "jumps": ["P2570", "P2522", "P2580", "P2590", "P2600", "P2610", "P2500", "P2480", "P2620", "P2630", "P2640", "P2650", "P2660", "P"]}, {"id": "P2660", "text": ["Coarse tuning is accomplished by using the drift space transit time.  Changing the distance changes the frequency.", "Coarse tuning is accomplished by using the drift space transit time. Changing the distance changes the frequency."], "jumps": ["P2670", "P2480"]}, {"id": "P2670", "text": ["Fine tuning is accomplished by varying the voltage on the collector plate, which speeds up or slows down the beam."], "jumps": ["P2680", "P2480"]}, {"id": "P2680", "text": ["As a mixer, the oscillator configuration is changed by adding an AC signal to the collector plate.  This produces FM modulation.", "As a mixer, the oscillator configuration is changed by adding an AC signal to the collector plate. This produces FM modulation."], "jumps": ["P2690", "P2480"]}, {"id": "P2690", "text": ["Now, let's discuss the magnetron.", "A magnetron tube is primarily used as a high power microwave oscillator in the frequency range of 1 to 5 GHz.", "Now, let's discuss the magnetron...........................", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "Klystrons Magnetronsrowave trainer may remain assembled and configured throughout this course. ainer are given in HELP frames.. Red test Lead ............... V input jack Black test Lead ............ COMM input jackput jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk"], "jumps": ["P2700", "P2650", "P2710", "P2690"]}, {"id": "P2710", "text": ["It is basically a diode that operates using both electric and magnetic fields.  The basic operation is as follows.", "It is basically a diode that operates using both electric and magnetic fields. The basic operation is as follows."], "jumps": ["P2720", "P2700"]}, {"id": "P2720", "text": ["The cathode, directly or indirectly heated, emits electrons that are attracted to the anode, which has a very high positive potential."], "jumps": ["P2730", "P2700"]}, {"id": "P2730", "text": ["The anode is a solid piece of metal that has a large hole drilled in the middle for the cathode."], "jumps": ["P2740", "P2700"]}, {"id": "P2740", "text": ["Smaller holes drilled around the outer edges are used as cavity resonators.", "Smaller holes drilled around the outer edges are used as cavity resonators...ors."], "jumps": ["P2750", "P2700"]}, {"id": "P2750", "text": ["At this time, the electrons leave the cathode and flow to the anode.  No oscillations are developed.", "At this time, the electrons leave the cathode and flow to the anode. No oscillations are developed."], "jumps": ["P2760", "P2700"]}, {"id": "P2760", "text": ["By adding a strong magnet around the tube, the path of the electrons from the cathode to the anode is changed."], "jumps": ["P2770", "P2700"]}, {"id": "P2770", "text": ["Due to the interaction of the electron's electric field and the magnet's magnetic field, the electrons take a curved path from the cathode to anode."], "jumps": ["P2780", "P2760"]}, {"id": "P2780", "text": ["With the application of the correct magnetic force from the magnet and the correct voltage on the anode, the electrons actually do not reach the anode."], "jumps": ["P2790", "P2770"]}, {"id": "P2790", "text": ["The electrons take a curved path back to the cathode where they are re-emitted.", "Due to placement and positioning, the energy of the electrons is coupled to the cavity resonators."], "jumps": ["P2800", "P2770", "P2810"]}, {"id": "P2810", "text": ["The energy excites the cavity resonators, and oscillations result."], "jumps": ["P2820", "P2800"]}, {"id": "P2820", "text": ["The magnetron can be tuned by varying  the size of the cavity resonators with tuning slugs.", "The magnetron can be tuned by varying the size of the cavity resonators with tuning slugs."], "jumps": ["P2830", "P2800"]}, {"id": "P2830", "text": ["As in the klystron, interelectrode capacitance is reduced by the spacing between the cathode and anode."], "jumps": ["P2840", "P2800"]}, {"id": "P2840", "text": ["Lead inductance is reduced by keeping the lengths of internal leads to minimum."], "jumps": ["P2850", "P2800"]}, {"id": "P2850", "text": ["Transit time is of no importance since the output is taken from a cavity resonator.", "devices such as the Traveling Wave Tube and the Backward Wave Oscillator. A traveling wave t u", "A traveling wave tube (TWT) is a high gain, low noise and wide bandwidth amplification device. A TWT may also be constructed to serve as a microwave oscillator, called a Backward wave oscillator. tion device. A TWT may also be constructed to serve as a microwave oscillator, called a Backward wave oscillator."], "jumps": ["P2860", "P2800", "P2870"]}, {"id": "P2870", "text": ["Physically, a TWT amplifier and a TWT oscillator differ in three major ways.  The helix of the oscillator is longer than that of the amplifier, there is no input connection to the oscillator and the attenuator is removed.", "Physically, a TWT amplifier and a TWT oscillator differ in three major ways. The helix of the oscillator is longer than that of the amplifier, there is no input connection to the oscillator and the attenuator is removed."], "jumps": ["P2880", "P2860"]}, {"id": "P2880", "text": ["Which type of microwave generating device uses a magnet to produce oscillations?"], "jumps": ["P2860"]}, {"id": "P2881", "text": ["The klystron bunches electrons to produce oscillations in the catcher cavity."], "jumps": []}, {"id": "P2890", "text": ["Which type of microwave generating device uses a buncher and catcher cavity to produce oscillations?"], "jumps": ["P2880"]}, {"id": "P2891", "text": [], "jumps": []}, {"id": "P2892", "text": ["The Magnetron uses a magnet to curve the path of electrons to produce oscillations in cavity resonators."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on TUBE MICROWAVE DEVICES.", "This completes the information on TUBE MICROWAVE DEVICES..."], "jumps": ["P2890"]}, {"id": "P2920", "text": ["1.  Vacuum tubes are used in microwave circuits for the same             purpose that tubes are used in conventional circuits.                        However, there are characteristics that lower the efficiency.", "1. Vacuum tubes are used in microwave circuits for the same purpose that tubes are used in conventional circuits. However, there are characteristics that lower the efficiency."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2.  Interelectrode capacitance is caused by the elements in the           tube.  At high frequencies the reactance can ground signals           and cause feedback.", "2. Interelectrode capacitance is caused by the elements in the tube. At high frequencies the reactance can ground signals and cause feedback."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3.  Lead inductance is caused by the conductors in the tube                acting as inductors.  At high frequencies, the reactances                 attenuate input and output signals.", "3. Lead inductance is caused by the conductors in the tube acting as inductors. At high frequencies, the reactances attenuate input and output signals."], "jumps": ["P2950", "P2930"]}, {"id": "P2950", "text": ["4.  Transit time is the time for electrons to travel from the cathode       to the plate.  At high frequencies, the time causes phase shifts       and power losses.", "5.  Combining the effects of high frequencies in conventional               tubes makes the tubes inefficient for microwave use.", "4. Transit time is the time for electrons to travel from the cathode to the plate. At high frequencies, the time causes phase shifts and power losses.", "5. Combining the effects of high frequencies in conventional tubes makes the tubes inefficient for microwave use."], "jumps": ["P2960", "P2940", "P2970", "P2950"]}, {"id": "P2970", "text": ["6.  Special types of vacuum tubes overcome the problems of \n     conventional tubes at microwave frequencies.", "7.  The klystron uses a buncher cavity and grid to modulate the          electron flow.  This produces amplified oscillations.", "6. Special types of vacuum tubes overcome the problems of conventional tubes at microwave frequencies.", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "Klystrons Magnetronsrowave trainer may remain assembled and configured throughout this course. ainer are given in HELP frames.. Red test Lead ............... V input jack Black test Lead ............ COMM input jackput jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk", "7. The klystron uses a buncher cavity and grid to modulate the electron flow. This produces amplified oscillations."], "jumps": ["P2980", "P2960", "P2990", "P2970"]}, {"id": "P2990", "text": ["8.  The magnetron uses resonant cavities to produce                             oscillations.  The magnet causes emitted electrons to flow in a      curved path.", "8. The magnetron uses resonant cavities to produce oscillations. The magnet causes emitted electrons to flow in a curved path."], "jumps": ["P2999", "P2980"]}, {"id": "P2999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2990"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["What type of circuit is a cavity resonator?"], "jumps": []}, {"id": "P10211", "text": ["Why can't a conventional capacitor and inductor be used to produce a resonant circuit at microwave frequencies?", "The size of the components would be too large.", "The size of the components would be too small.", "The components cannot be manufactured with small enough values.", "The components cannot be manufactured with large enough values."], "jumps": []}, {"id": "P10212", "text": ["A space completely enclosed by conducting walls is called a _______"], "jumps": []}, {"id": "P10213", "text": ["A waveguide can be changed into a cavity resonator by _______", "making the waveguide 1/4 wavelength long.", "making the waveguide 1/4 wavelength wide.", "sealing the open ends of a waveguide section.", "opening the closed ends of a waveguide section."], "jumps": []}, {"id": "P10214", "text": ["A cavity resonator is best described as connecting _______", "an infinite number of shorted quarter wave transmission lines.", "one shorted quarter wave transmission line to the output.", "two shorted quarter wave transmission lines."], "jumps": []}, {"id": "P10215", "text": ["The resonant frequency of a shorted quarter wave transmission line is set by the _______ _. ]", "type of material used for the shorting bar. r", "distance between the transmission line."], "jumps": []}, {"id": "P10216", "text": ["Why is the shorted transmission line not normally used by itself to produce a resonant circuit?", "high power handling capability and high Q value", "low power handling capability and low Q value", "low power handling capability and high Q value", "high power handling capability and low Q value"], "jumps": []}, {"id": "P10217", "text": ["The power handling capability of a shorted transmission line is increased by _______", "placing two shorted transmission lines together.", "placing two shorting bars on one transmission line.", "placing one shorting bar between two transmission lines.", "lowering the Q value by insulating the transmission line."], "jumps": []}, {"id": "P10218", "text": ["What are the advantages of a cavity resonator?", "low Q, low power, large size and ruggedness", "low Q, low power, small size and ruggedness", "low Q,
