rticular section........"], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["After the fault has been isolated to the section (transmitter or receiver) the faulty circuit should be identified.  Then you can make resistance, voltage and current measurements to find the bad component.", "After the fault has been isolated to the section (transmitter or receiver) the faulty circuit should be identified. Then you can make resistance, voltage and current measurements to find the bad component."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["Let's begin the lesson on AM CIRCUIT TROUBLESHOOTING......................"], "jumps": ["P430"]}, {"id": "P9305", "text": ["FUNCTION GENERATOR SETUP - Frequency - 1 kHz Function Switch - ial - 1.0"], "jumps": ["P9306", "P9300"]}, {"id": "P9330", "text": ["12.  Press Enter to Set: PC3 DC Power Switch - ON", "12. Press Enter to Set: PC3 DC Power Switch - ON.........................."], "jumps": ["P9320"]}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1020", "text": ["In this experiment you will locate the failed circuit in an AM transmitter and receiver system.", "The transmitter is located on the PC130-91 card.", "The transmitter is located on the PC130-91 card............"], "jumps": ["P1030", "P1001", "P1040", "P1020"]}, {"id": "P1040", "text": ["It contains an oscillator circuit and a modulator circuit.", "The receiver is located on the PC130-92 card.", "It contains an oscillator circuit and a modulator circuit.m", "The receiver is located on the PC130-92 card..............."], "jumps": ["P1050", "P1030", "P1060", "P1040"]}, {"id": "P1060", "text": ["It contains a RF amplifier circuit, demodulator circuit and two AF amplifier circuits."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["To locate a faulted circuit you must first determine if the AM system is operating correctly."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["This is done by using the oscilloscope to measure the receiver output.", "If you have a good signal on PC130-92 Pin T, the transmitter and receiver must be operating correctly."], "jumps": ["P1090", "P1070", "P1100"]}, {"id": "P1100", "text": ["If you do not have a good signal on PC130-92 Pin T the AM system is faulted."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["Once you have determined that the AM system is not operating correctly you must then isolate the fault to either the transmitter, transmission medium or receiver."], "jumps": ["P1120", "P1090"]}, {"id": "P1120", "text": ["This is accomplished by making two simple oscilloscope measurements."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["First, measure the output of the transmitter.", "If an AM signal is present on TP3 the transmitter circuit must be operating correctly."], "jumps": ["P1140", "P1110", "P1150"]}, {"id": "P1150", "text": ["If the AM signal is not present the transmitter is faulted."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["Second, measure the receiver input.  The receiver output was checked in the beginning to determine whether the system was operating, so this does not need to be rechecked.", "If an attenuated AM signal is not present on Pin E, the fault is in the transmission medium.", "Second, measure the receiver input. The receiver output was checked in the beginning to determine whether the system was operating, so this does not need to be rechecked."], "jumps": ["P1170", "P1140", "P1180", "P1160"]}, {"id": "P1180", "text": ["If an attenuated AM signal is present on Pin E, the fault is in the receiver."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["If the fault is in the transmission medium, checking out the antenna or transmission cables will normally locate the failure.", "If the fault is in the transmitter, oscilloscope measurements on TP1, TP2 and TP3 will isolate the fault to the oscillator or         modulator circuit.", "If mitter and receiver."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["1.  Set PC2 DC Power switch to ON.", "1. Set PC2 DC Power switch to ON. RAPHICS TEXT) NOTE Let the crystal warm up for approximately 5 minutes before continuing.", "Let the crystal warm up for approximately 5 minutes before continuing., disconnecting the main and modulation generators."], "jumps": ["P1260"]}, {"id": "P1280", "text": ["2.  Using the oscilloscope (with a X10 probe) measure the signal        on the emitter of PC130-91 Q2 (bottom lead).\n3.  Adjust PC130-91 T1 for the best possible signal.", "2. Using the oscilloscope (with a X10 probe) measure the signal on the emitter of PC130-91 Q2 (bottom lead). 3. Adjust PC130-91 T1 for the best possible signal.", "MEASUREMENT SETUP - Measure the signal on Q2. Adjust T1 for the best possible signal."], "jumps": ["P1290", "P1270", "P1285"]}, {"id": "P1290", "text": ["4.  Using the oscilloscope (with a X10 probe), measure the signal       on PC130-91 TP3. \n5.  Adjust PC130-91 C6 for the maximum amplitude signal.", "4. Using the oscilloscope (with a X10 probe), measure the signal on PC130-91 TP3. 5. Adjust PC130-91 C6 for the maximum amplitude signal................................................", "MEASUREMENT SETUP - Measure the signal on TP3. Adjust C6 for the maximum amplitude signal."], "jumps": ["P1300", "P1280", "P1295"]}, {"id": "P1300", "text": ["6.  Set the main output of the function generator to 1 kHz sine              wave. \n7.  Connect the main output of the function generator to the PC1        OUTPUT BNC.", "6. Set the main output of the function generator to 1 kHz sine wave. 7. Connect the main output of the function generator to the PC1 OUTPUT BNC."], "jumps": ["P1310", "P1290", "P1305"]}, {"id": "P9306", "text": [], "jumps": ["P9300", "P9305"]}, {"id": "P1306", "text": [], "jumps": ["P1300", "P1305"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1310", "text": ["8.  Connect the oscilloscope to PC130-91 TP3, outpu let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
