const book = {"title": "9395B302", "pages": [{"id": "P0", "text": ["Nida Corporation 2002 - 2003 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: PCM CIRCUIT OPERATIONdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Observe the operation of a typical PCM modulator. w Measure signals in a typical PCM modulator.", "w Observe the operation of a typical PCM demodulator. w Measure signals in a typical PCM demodulator........................"], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 440 Function Generator XXXXXnt"], "jumps": []}, {"id": "P301", "text": ["12. Nida Model 410 Frequency Counter XXXXXnt"], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P341", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will observe the operation of a typical PCM transmitter and receiver circuit."], "jumps": ["P410", "P301"]}, {"id": "P410", "text": ["In the first part of the experiment, you will set up, align and observe the signals in the transmitter or modulator circuit."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["In the second part of the experiment, you will set up, align and observe the signals in the receiver or demodulator circuit."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["The circuits are typical, that is you may not find the exact circuits in commercial equipment."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["However, the circuits operate as any PCM modulator and demodulator."], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["Once learned, you will have the knowledge and skill to operate and maintain any PCM system."], "jumps": ["P460", "P400"]}, {"id": "P460", "text": ["In this lesson you will observe the operation of PCM transmitters and receivers."], "jumps": ["P470", "P400"]}, {"id": "P470", "text": ["Let's begin the lesson on PCM CIRCUIT OPERATION..........................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1020", "text": ["In this experiment, you will observe the operation and measure signals in a typical PCM transmitter circuit."], "jumps": ["P1040", "P1001"]}, {"id": "P1040", "text": ["The transmitter circuit is contained on PC130-326 and consists of five major sections."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The amplifier circuit is used to scale the analog input voltage."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["The Analog to Digital Converter converts the analog information to digital."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["The output of the A/D is also used to drive a display card, \nPC130-284.", "The output of the A/D is also used to drive a display card, PC130-284."], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["The display card is used to give you a visual indication of the output of the A/D converter."], "jumps": ["P1090", "P1020"]}, {"id": "P1090", "text": ["The Parallel to Serial Converter changes the parallel output of the A/D converter to serial."], "jumps": ["P1100", "P1020"]}, {"id": "P1100", "text": ["The Output Multiplexer adds the sync pulse to the serial data. Then the entire frame is transmitted out."], "jumps": ["P1110", "P1020"]}, {"id": "P1110", "text": ["The Timer/Sync Bit Generator generates the sync pulse and controls the operation of the A/D and P/S converters.", "Now, pick up the PC130-326 card and compare to the schematic."], "jumps": ["P1120", "P1020", "P1130"]}, {"id": "P1130", "text": ["Notice R7, R10 and R14.  These variable resistors are used to align the PCM modulator.", "Notice R7, R10 and R14. These variable resistors are used to align the PCM modulator."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["Also notice J1 on the card.  This is the parallel output to the display card.", "Also notice J1 on the card. This is the parallel output to the display card."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["Now, pick up the PC130-284 digital readouts card.", "Match up the other components on the card to the schematic.", "Now, pick up the PC130-284 digital readouts card..........."], "jumps": ["P1160", "P1120", "P1170"]}, {"id": "P1170", "text": ["The eight LEDs are used to indicate an eight bit digital number in binary.  The LSB is A0.", "The eight LEDs are used to indicate an eight bit digital number in binary. The LSB is A0."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["The two seven segment displays are used to indicate two four bit binary numbers."], "jumps": ["P1190", "P1160"]}, {"id": "P1190", "text": ["The decoders used in the circuit do not decode the binary numbers from 1010 to 1111 into hexadecimal letters, A through F."], "jumps": ["P1200", "P1160"]}, {"id": "P1200", "text": ["Therefore, the seven segment displays will not be used in this experiment; however, they will show the numbers 0 through 9."], "jumps": ["P1210", "P1160"]}, {"id": "P1210", "text": ["An 8 pin ribbon cable (twisted) connects PC130-326 to\nPC130-284.", "An 8 pin ribbon cable (twisted) connects PC130-326 to PC130-284.."], "jumps": ["P1230", "P1160"]}, {"id": "P1230", "text": ["Let's start the experiment.", "Let's start the experiment.e..............................."], "jumps": ["P1240", "P1210"]}, {"id": "P1240", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P1230"]}, {"id": "P1250", "text": ["2.  Carefully plug PC130-326 into the Test Console PC2 position. 3.  Carefully plug PC130-284 into the Test Console PC3 position.", "2. Carefully plug PC130-326 into the Test Console PC2 position. 3. Carefully plug PC130-284 into the Test Console PC3 position."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["4.  Set the Positive Supply Control to 15. \n5.  Set the Negative Supply Control to 15.  The Voltmeter on the          130A should indicate 15 Volts.", "6.  On PC130-326, set switches S1 to DC and S2 to READOUT.", "7.  On PC130-284, set switch S1 to 15. This allows operation of            the card using +15 volts. The 5 position allows operation of            the card using +5 volts.", "4. Set the Positive Supply Control to 15. 5. Set the Negative Supply Control to 15. The Voltmeter on the 130A should indicate 15 Volts.", "6. On PC130-326, set switches S1 to DC and S2 to READOUT..", "7. On PC130-284, set switch S1 to 15. This allows operation of the card using +15 volts. The 5 position allows operation of the card using +5 volts."], "jumps": ["P1250", "P1290", "P1260", "P1300", "P1280"]}, {"id": "P1300", "text": ["8.  Connect the 8 pin ribbon cable from J1 on PC130-326 to J1 on       PC130-284.  Ensure that the top wire from PC130-326                        connects to the bottom connector on PC130-284.", "8. Connect the 8 pin ribbon cable from J1 on PC130-326 to J1 on PC130-284. Ensure that the top wire from PC130-326 connects to the bottom connector on PC130-284.", "MEASUREMENT SETUP - 8 pin ribbon cable (twisted) connected from J1PC130-326 to J1 PC130-284."], "jumps": ["P1310", "P1290", "P1305"]}, {"id": "P1310", "text": ["9.  Connect the MAIN output of the function generator to the                PC1 OUTPUT BNC. The function generator is used as the               analog information source.", "9. Connect the MAIN output of the function generator to the PC1 OUTPUT BNC. The function generator is used as the analog information source.", "BNC CONNECTION - Connect the Function Generator's Main Output BNC to the Test Console's PC1 OUTPUT BNC."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["10.  On the function generator, set the controls as follows:", "10. On the function generator, set the controls as follows:", "Modulation: Off Frequency: 1 kHz Output level: Minimum DC offset: On DC offset level: Minimum Function Square wave"], "jumps": ["P1325", "P1310"]}, {"id": "P1325", "text": ["10. On the function generator, set the controls as follows:", "Time/Div 0.5 msec Volts/Div 5 Input DC Triggering Auto Trigger source Channel 1"], "jumps": ["P1330", "P1320"]}, {"id": "P1330", "text": ["11.  Place PC2 and PC3 Power DC switches to ON.", "11. Place PC2 and PC3 Power DC switches to ON.130A - Set the PC1 DC Switch to ON...."], "jumps": ["P1325"]}, {"id": "P1340", "text": ["The PCM modulator circuit is now setup.", "The PCM modulator circuit is now setup. e function generator is setup to output a DC voltage used for aligning the PCM modulator."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["In this PCM modulator circuit, the information signal is limited to 10 Vpp at 10 kHz. Calculate and type in the minimum sample frequency that can be used."], "jumps": ["P1340", "P1352", "P1355"]}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1352", "text": ["The minimum sample frequency is the Nyquist rate which is twice the highest information signal frequency, or twice 10 kHz. Recalculate the sample rate."], "jumps": []}, {"id": "P1355", "text": ["SAMPLE RATE - The minimum sample rate is the Nyquist rate which is two times the highest information signal frequency."], "jumps": []}, {"id": "P1357", "text": ["You still have not calculated the correct sample rate.  You should have calculated 20 kHz, or 2 times 10 kHz.", "You still have not calculated the correct sample rate. You should have calculated 20 kHz, or 2 times 10 kHz."], "jumps": ["P1360", "P1350"]}, {"id": "P1360", "text": ["Using a sample rate of 20 kHz and considering the number of bits that are to be transmitted is 9 (eight data and one sync), calculate and type in the bandwidth of the system."], "jumps": ["P1350", "P1362", "P1365"]}, {"id": "P1361", "text": [], "jumps": []}, {"id": "P1362", "text": ["The bandwidth is the number of bits used times the minimum sample rate of 20 kHz.  Recalculate the sample rate.", "The bandwidth is the number of bits used times the minimum sample rate of 20 kHz. Recalculate the sample rate."], "jumps": []}, {"id": "P1365", "text": ["BANDWIDTH - The bandwidth of a system is equal to the number of bits used times the sample rate."], "jumps": []}, {"id": "P1367", "text": ["You still have not calculated the bandwidth.  You should have calculated 180 kHz, or 9 times 20 kHz.", "You still have not calculated the bandwidth. You should have calculated 180 kHz, or 9 times 20 kHz."], "jumps": ["P1370", "P1360"]}, {"id": "P1370", "text": ["Now, knowing the minimum sample rate, 20 kHz, maximum voltage input, 10 Vpp, and the bandwidth, 180 kHz, the PCM modulator can be aligned for the parameters given.", "1.  Using a frequency counter if available (use an oscilloscope if        not), adjust R7 on PC130-326 for a 180 kHz +1 kHz signal \n     at  the Frame Clock TP.", "2.  Connect the oscilloscope Channel 1 probe to the Input test             point on the PC130-326 card.", "1. Using a frequency counter if available (use an oscilloscope if not), adjust R7 on PC130-326 for a 180 kHz +1 kHz signal at the Frame Clock TP. generator has a built in frequency counter.", "2. Connect the oscilloscope Channel 1 probe to the Input test point on the PC130-326 card.", "10.00 volt measurement on PC130-326 Input TP."], "jumps": ["P1380", "P1360", "P1390", "P1370", "P1395"]}, {"id": "P1395", "text": ["3. Using the DC Offset and the Output Level controls on the function generator, apply a 10 Volt p-p square wave. The most-negative part of the waveform must be a zero volts as shown...", "4. Set the function generator for the minimum frequency output possible. The output should change from positive to negative about every 3 seconds. Adjust R10 on the PC130- 326 card fully CCW."], "jumps": ["P1400", "P1390", "P1410"]}, {"id": "P1410", "text": ["5.  Set the function generator for the minimum frequency output         possible.  The output should change from positive to                        negative about every 3 seconds.  Adjust R10 on the PC130-            326 card fully CCW.", "5. Set the function generator for the minimum frequency output possible. The output should change from positive to negative about every 3 seconds. Adjust R10 on the PC130- 326 card fully CCW. output."], "jumps": ["P1415", "P1400"]}, {"id": "P1415", "text": ["Ensure the adjustment of R10 is accurate and CW rotation is halted JUST as 11111111 is displayed during the positive portion of the waveform. negative about every 3 seconds. Adjust R10 on the PC130- 326 card fully CCW. output."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["The PCM modulator circuit is now set up and aligned for analog information signals from 0 Hz to 10 kHz at levels up to 10 Vpp."], "jumps": ["P1430", "P1400"]}, {"id": "P1430", "text": ["Now, let's measure signals in the PCM modulator circuit and verify that the A/D and P/S converters are operating correctly.", "We'll next vary the input voltage at the Input test point while monitoring the LED display.", "We'll next vary the input voltage at the Input test point while monitoring the LED display. the Input TP. 2. Vary the DC Offset control on the function generator."], "jumps": ["P1440", "P1420", "P1450", "P1430"]}, {"id": "P1450", "text": ["Vary the DC Offset control on the function generator while viewing the LEDs and the oscilloscope.  Do not adjust past 00000000 on the negative side or 11111111 on the positive side.", "1.  Connect CH1 of the oscilloscope to the IN TP. \n2.  Vary the DC Offset control on the function generator.", "Vary the DC Offset control on the function generator while viewing the LEDs and the oscilloscope. Do not adjust past 00000000 on the negative side or 11111111 on the positive side.", "1. Connect CH1 of the oscilloscope to the IN TP. 2. Vary the DC Offset control on the function generator."], "jumps": ["P1460", "P1440", "P1470"]}, {"id": "P1470", "text": ["You should observe the DC input voltage change just like you did on the Input TP.  The only difference in this TP is that in the AC mode, a DC bias will be added.", "You should observe the DC input voltage change just like you did on the Input TP. The only difference in this TP is that in the AC mode, a DC bias will be added."], "jumps": ["P1480", "P1440"]}, {"id": "P1480", "text": ["To determine if the A/D and S/P converters are operating correctly,  you must calculate the binary output of the modulator for a given analog voltage input.  This is where the quantization level and quantization level voltage spacing comes into play.", "To determine if the A/D and S/P converters are operating correctly, you must calculate the binary output of the modulator for a given analog voltage input. This is where the quantization level and quantization level voltage spacing comes into play."], "jumps": ["P1490", "P1440"]}, {"id": "P1490", "text": ["Knowing that the A/D converter produces an 8 bit output (ignore sync pulse for right now), calculate and type in the quantization level."], "jumps": ["P1480", "P1492", "P1495"]}, {"id": "P1491", "text": [], "jumps": []}, {"id": "P1492", "text": ["Remember, the quantization level equals two to the     power and  is 8 in this circuit.", "Remember, the quantization level equals two to the power and is 8 in this circuit."], "jumps": []}, {"id": "P1495", "text": ["QUANTIZATION LEVEL - The quantization level of an A/D converter is equal to two to the power where equals the number of bits in the converter."], "jumps": []}, {"id": "P1497", "text": ["You still have not calculated the correct quantization level.  You should have calculated 256 because    equals 8.", "You still have not calculated the correct quantization level. You should have calculated 256 because equals 8."], "jumps": ["P1500", "P1490"]}, {"id": "P1500", "text": ["Knowing that q is 256, calculate and type in, rounded to three decimal places, the voltage between levels (remember, the maximum Vpp is 10)."], "jumps": ["P1490", "P1502", "P1505"]}, {"id": "P1501", "text": [], "jumps": []}, {"id": "P1502", "text": ["Remember, the voltage spacing is the maximum input voltage divided by the quantization level minus 1.  Recalculate the voltage spacing.", "Remember, the voltage spacing is the maximum input voltage divided by the quantization level minus 1. Recalculate the voltage spacing."], "jumps": []}, {"id": "P1505", "text": ["Vmax Voltage spacing = q - 11", "VOLTAGE SPACING - The voltage between levels in an A/D converter is equal to the maximum voltage input divided by the quantization level minus 1."], "jumps": []}, {"id": "P1507", "text": ["You still have not calculated the correct voltage spacing between quantization levels. You should have calculated 0.039 which is 10 divided by 255 and rounded off to three places."], "jumps": ["P1510", "P1500"]}, {"id": "P1510", "text": ["Now, to determine the binary output of the A/D converter, you must determine the number of levels for a particular input voltage.  Let's use a voltage of 7.5 volts.", "Now, to determine the binary output of the A/D converter, you must determine the number of levels for a particular input voltage. Let's use a voltage of 7.5 volts."], "jumps": ["P1520", "P1500"]}, {"id": "P1520", "text": ["Dividing 7.5 volts by the voltage level spacing produces 192.30. Since the quantization levels are always a whole number, the output level for a 7.5 volt input is 192 out of 256."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["Changing the level of 191 into binary produces 10111111. 1011111 should be the output of the A/D converter for an input of 7.5 volts.  Let's check.", "Changing the level of 191 into binary produces 10111111. 1011111 should be the output of the A/D converter for an input of 7.5 volts. Let's check."], "jumps": ["P1535", "P1520"]}, {"id": "P1535", "text": ["Set the function generator to any frequency above 100 Hz so that a square wave is displayed on the oscilloscope. Using the DC Offset and the Output Level controls, adjust for a 7.5 V p-p output with the zero volts reference as shown.", "the LEDs while the input waveform cycles. Input TP.", "Reduce the function generator frequency to minimum and view the LEDs while the input waveform cycles."], "jumps": ["P1540", "P1530", "P1550", "P1535"]}, {"id": "P1550", "text": ["Look at the LEDs on the PC130-284 card and enter the binary        number displayed during the positive portion of the input                waveform.", "Look at the LEDs on the PC130-284 card and enter the binary number displayed during the positive portion of the input waveform."], "jumps": ["P1540", "P1552"]}, {"id": "P1551", "text": [], "jumps": []}, {"id": "P1552", "text": ["Be sure that you are entering the eight bit binary number correctly.  The MSB is A7 and is entered first.", "Be sure that you are entering the eight bit binary number correctly. The MSB is A7 and is entered first."], "jumps": []}, {"id": "P1557", "text": ["You still have not entered the correct binary number.  You should have entered a number between 10100010 and 11011100.", "You still have not entered the correct binary number. You should have entered a number between 10100010 and 11011100."], "jumps": ["P1560", "P1550"]}, {"id": "P1560", "text": ["The binary number displayed on PC130-284 is between 10100010 and 11011100. This represents decimal numbers between 162 and 220, or about 15% of 191."], "jumps": ["P1570", "P1550"]}, {"id": "P1570", "text": ["The A/D converter is converting analog information signals correctly."], "jumps": ["P1580", "P1560"]}, {"id": "P1580", "text": ["Check the binary output for the following voltages.  In each instance you'll need to adjust the DC Offset and the Output Level using a frequency greater than 100 Hz to set the zero reference and then drop the frequency back to minimum.", "Check the binary output for the following voltages. In each instance you'll need to adjust the DC Offset and the Output Level using a frequency greater than 100 Hz to set the zero reference and then drop the frequency back to minimum...", "+5.00 - 01110000 to 10100000 +2.50 - 00111000 to 01100000 +1.25 - 00011000 to 00110000000"], "jumps": ["P1590", "P1570", "P1585"]}, {"id": "P1585", "text": ["a. Divide the analog voltage by the quantization level spacing, 0.039. b. Convert the number to binary...", "BINARY OUTPUT VALUES - To determine the binary output number for an analog input voltage, you:"], "jumps": []}, {"id": "P1590", "text": ["Now let's check out the Parallel to Serial converter.", "Connect CH1 of the oscilloscope to PC130-326 Data TP. \n  Connect the external trigger of the oscilloscope to PC130-326       SYNC TP.", "Now let's check out the Parallel to Serial converter.......", "Connect CH1 of the oscilloscope to PC130-326 Data TP. Connect the external trigger of the oscilloscope to PC130-326 SYNC TP."], "jumps": ["P1610", "P1580", "P1620", "P1590"]}, {"id": "P1620", "text": ["Set up the oscilloscope as follows. \n  Center the trace on the screen ensuring that the start of the            trace is on the first vertical line.", "Set up the oscilloscope as follows. Center the trace on the screen ensuring that the start of the trace is on the first vertical line.", "Volts/Div 5 Time/Div 10 msec Triggering External, AC, - Slope AC, GND, DC DC Display Mode Channel 1 Function Square wave"], "jumps": ["P1630", "P1610", "P1625"]}, {"id": "P1625", "text": ["OSCILLOSCOPE - Volts/Div - 5; AC, GND, DC - DC; Time/Div - 10 sec; Display Mode - CH1; Triggering - External, AC, - Slope."], "jumps": []}, {"id": "P1630", "text": ["Temporarily remove the BNC cable from the PC1 Output jack on    the 130 Trainer.  Adjust R10 on the PC130-326 card for a                  00000000 output as displayed by the LEDs.", "Temporarily remove the BNC cable from the PC1 Output jack on the 130 Trainer. Adjust R10 on the PC130-326 card for a 00000000 output as displayed by the LEDs.."], "jumps": ["P1640", "P1620", "P1645"]}, {"id": "P1640", "text": ["The waveform on the oscilloscope is the SYNC pulse.  Notice that it is centered in the ninth block from the left.", "The waveform on the oscilloscope is the SYNC pulse. Notice that it is centered in the ninth block from the left."], "jumps": ["P1650", "P1630", "P13645"]}, {"id": "P1642", "text": ["The waveform on the oscilloscope is the SYNC pulse. Notice that it is centered in the ninth block from the left. 00000000 output as displayed by the LEDs.."], "jumps": ["P1650", "P1630", "P1645"]}, {"id": "P1645", "text": ["Make sure the function generator is disconnected from the PC1 jack.Display Mode - CH1; Triggering - External, AC, - Slope.", "CH1 PC130-326 Data test point Time/Div 10 msec Volt/Div 5 Input DC Triggering External Coupling AC Slope - (negative) Function Square wave"], "jumps": []}, {"id": "P1650", "text": ["Three sync pulses are shown allowing the view of two pulse trains. Remember, the sync pulses are 1/2 the size of the data pulses and centered in the sync area of the pulse train."], "jumps": ["P1660", "P1630"]}, {"id": "P1660", "text": [", etc. Bit 8 is the first block on the left.", "The pulse train places the data between the sync pulse; 8 pulses each, with the Most Significant Bit (MSB) at the beginning of the train proceeding down to the Least Significant Bit (LSB) at the end just before the next sync pulse."], "jumps": ["P1670", "P1630"]}, {"id": "P1670", "text": ["Set the DC Offset control on the function generator for a                   00000001 reading on the display card, PC130-284.", "Set the DC Offset control on the function generator for a 00000001 reading on the display card, PC130-284."], "jumps": ["P1680", "P1630"]}, {"id": "P1680", "text": ["Viewing the oscilloscope will reveal the pulse train equaling the LED display of 00000001.", "Viewing the oscilloscope will reveal the pulse train equaling the LED display of 00000001.ync pulse."], "jumps": ["P1690", "P1670"]}, {"id": "P1690", "text": ["Compare the oscilloscope display to the LED display on the PC130-284 card while adjusting R10, the Offset control CW from 00000001 to 11111111.", "Compare the oscilloscope display to the LED display on the PC130-284 card while adjusting R10, the Offset control CW from 00000001 to 11111111. PC130-284, to the serial data shown on the oscilloscope for various analog input voltages."], "jumps": ["P1700", "P1680"]}, {"id": "P1700", "text": ["Note that the sync pulse is different from the HIGH data pulses.  Remember, the demodulator circuit must be able to distinguish between a sync pulse and a HIGH data pulse.", "Note that the sync pulse is different from the HIGH data pulses. Remember, the demodulator circuit must be able to distinguish between a sync pulse and a HIGH data pulse."], "jumps": ["P1740", "P1690"]}, {"id": "P1740", "text": ["As you have seen, the PCM modulator changes analog to digital and serially outputs digital data along with a sync pulse."], "jumps": ["P1750", "P1700"]}, {"id": "P1750", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": ["P1740"]}, {"id": "P1760", "text": ["2.  Set the Console Power Switch to OFF.", "2. Set the Console Power Switch to OFF...................."], "jumps": ["P1750"]}, {"id": "P1770", "text": ["3.  Disconnect all test equipment. \n4.  Carefully remove experiment card.\n5.  Return all equipment to designated storage areas.", "3. Disconnect all test equipment. 4. Carefully remove experiment card. 5. Return all equipment to designated storage areas."], "jumps": ["P1910", "P1760"]}, {"id": "P1910", "text": ["This completes the experiment on PCM TRANSMITTER CIRCUITS.", "This completes the experiment on PCM TRANSMITTER CIRCUITS...."], "jumps": ["P1770"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["In this experiment, you will observe the operation and measure signals in a typical PCM receiver circuit."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["The receiver circuit is contained on PC130-327 and consists of six major sections."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["The input amplifier circuit is used to compensate for attenuation and distortion caused by the transmission medium."], "jumps": ["P2060", "P2020"]}, {"id": "P2060", "text": ["The serial to parallel converter changes the serial input PCM data to parallel."], "jumps": ["P2070", "P2020"]}, {"id": "P2070", "text": ["The digital to analog converter converts the parallel digital data to analog."], "jumps": ["P2080", "P2020"]}, {"id": "P2080", "text": ["The Output Amplifier is used to filter and amplify the analog output signal."], "jumps": ["P2090", "P2020"]}, {"id": "P2090", "text": ["The SYNC Bit Detector locates the SYNC pulse and initializes the timing circuit."], "jumps": ["P2100", "P2020"]}, {"id": "P2100", "text": ["The timing section controls the serial to parallel conversion.  The conversion only takes place after the eight data bits have been loaded.", "Now, pick up the PC130-327 card and compare to the schematic.", "The timing section controls the serial to parallel conversion. The conversion only takes place after the eight data bits have been loaded."], "jumps": ["P2110", "P2020", "P2120"]}, {"id": "P2120", "text": ["Notice the five variable resistor, R4, R5, R6, R7 and R9."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["R4, R5 and R6 set the SYNC bit detector, R7 sets the bandwidth and R9 calibrates the D/A converter."], "jumps": ["P2140", "P2110"]}, {"id": "P2140", "text": ["Also, the output of the serial to parallel converter, IC2, connects to J1.   J1 is used to connect a display.", "Also, the output of the serial to parallel converter, IC2, connects to J1. J1 is used to connect a display."], "jumps": ["P2150", "P2110"]}, {"id": "P2150", "text": ["Match up the other components on the card to the schematic."], "jumps": ["P2160", "P2110"]}, {"id": "P2160", "text": ["Let's start the experiment!", "Let's start the experiment!e...............................", "The PCM Transmitter circuit cards must be aligned as per the PCM Transmitter experiment before entering the PCM Receiver Experiment. If you have not aligned these circuit cards or are unsure whether they are aligned, return to the Lesson Menu, select PCM transmitter and align the circuit cards."], "jumps": ["P2170", "P2110"]}, {"id": "P2170", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2160"]}, {"id": "P2180", "text": ["2.  Carefully plug PC130-326 into the Test Console PC2 position. 3.  Carefully plug PC130-327 into the Test Console PC3 position.", "2. Carefully plug PC130-326 into the Test Console PC2 position. 3. Carefully plug PC130-327 into the Test Console PC3 position."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["4.  Set the Positive Supply Control to 15. \n5.  Set the Negative Supply Control to 15. The Voltmeter on the           130A should indicate 15 Volts.", "6.  On PC130-326, set switches S2 to Output and adjust R14 to            mid position. This action supplies the PCM signal to the                   receiver card.", "7.  On PC130-327, set switch S1 to DC/AC.  This action sets up             the receiver card to output the demodulated analog signal.", "4. Set the Positive Supply Control to 15. 5. Set the Negative Supply Control to 15. The Voltmeter on the 130A should indicate 15 Volts.", "6. On PC130-326, set switches S2 to Output and adjust R14 to mid position. This action supplies the PCM signal to the receiver card.", "7. On PC130-327, set switch S1 to DC/AC. This action sets up the receiver card to output the demodulated analog signal."], "jumps": ["P2180", "P2220", "P2190", "P2230", "P2210"]}, {"id": "P2230", "text": ["8.  Turn PC2 and PC3 DC Power switches to ON.", "8. Turn PC2 and PC3 DC Power switches to ON. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2220"]}, {"id": "P2240", "text": ["The receiver must be aligned for the same bandwidth as the transmitter, what is that bandwidth?"], "jumps": ["P2230", "P2245"]}, {"id": "P2241", "text": [], "jumps": []}, {"id": "P2242", "text": ["The bandwidth of a PCM transmitter and receiver must be at least the minimum sample rate times the number of digits used in the system."], "jumps": []}, {"id": "P2245", "text": ["1.  Using a frequency counter adjust R7 on PC130-327 for a\n     180 kHz signal at the RxCLOCK TP.  The Nida 440 Function             Generator has a built in frequency counter that can be used           for this alignment.", "s) The bandwidth of a PCM system is the sample rate times the number of bits transmitted...", "mmax The number of transmitted data bits is 8 and 1 SYNC pulse which produces 9 bits.", "BANDWIDTH - Use the formulas below to calculate the bandwidth", "1. Using a frequency counter adjust R7 on PC130-327 for a 180 kHz signal at the RxCLOCK TP. The Nida 440 Function Generator has a built in frequency counter that can be used for this alignment."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["Now, the bandwidth of the PCM receiver is setup. The next process is to check that the demodulator on PC130-327 is receiving the PCM signal that consists of SYNC pulses and data pulses."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["On the oscilloscope set the controls as follows:", "On the oscilloscope set the controls as follows:ows:.......", "Volt/Div CH1 & CH2 - As needed Time/Div - 2 ms Triggering - EXT, AC, - (Negative) Display - Dual - enabled, pulled out"], "jumps": ["P2280", "P2260", "P2275"]}, {"id": "P2275", "text": ["Connect the external trigger of the oscilloscope to the SYNC          TP on PC130-326.  The Modulator card is in the PC2 position.         The sync pulse generated in the modulator circuit is used as         triggering for the oscilloscope to align the SYNC detector                circuit in the demodulator.", "Connect CH1 to the input TP on the PC130-327, the PCM input to the modulator. \nOn the PC130-326 card rotate R10, the Offset adjustment, fully CCW.", "OSCILLOSCOPE - CH1 Volts/Div - As needed; Time/Div - 2 ms CH2 Volts/Div - As needed; Display - Dual Triggering - EXT, AC, -", "Connect the external trigger of the oscilloscope to the SYNC TP on PC130-326. The Modulator card is in the PC2 position. The sync pulse generated in the modulator circuit is used as triggering for the oscilloscope to align the SYNC detector circuit in the demodulator.", "Connect CH1 to the input TP on the PC130-327, the PCM input to the modulator. On the PC130-326 card rotate R10, the Offset adjustment, fully CCW...CCW."], "jumps": ["P2290", "P2270", "P2300", "P2280"]}, {"id": "P2300", "text": ["Adjust the Time/Div Variable control to display one complete         frame from the transmitter card.", "Adjust the Time/Div Variable control to display one complete frame from the transmitter card. C2 POWER OFF and ON again if the frame is not present."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["The oscilloscope is displaying two SYNC pulses that are transmitted by the modulator card.  Since there is no input to the PCM Modulator the output is all LOWs.  Also notice that the SYNC pulses are small and not sharp.  Set slope to -  on oscilloscope if only one sync pulse is seen.", "The oscilloscope is displaying two SYNC pulses that are transmitted by the modulator card. Since there is no input to the PCM Modulator the output is all LOWs. Also notice that the SYNC pulses are small and not sharp. Set slope to - on oscilloscope if only one sync pulse is seen. e is seen."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["Connect the CH1 probe to PC130-327 TP2.  This is the output        of the Input Amplifier. The SYNC pulses are larger and                      sharper.", "Connect the CH1 probe to PC130-327 TP2. This is the output of the Input Amplifier. The SYNC pulses are larger and sharper."], "jumps": ["P2330", "P2300", "P2325"]}, {"id": "P2322", "text": ["6.  Connect the CH1 probe to PC130-327 TP2. This is the output         of the Input Amplifier. The SYNC pulses are larger and                      sharper.", "6. Connect the CH1 probe to PC130-327 TP2. This is the output of the Input Amplifier. The SYNC pulses are larger and sharper.", "MEASUREMENT SETUP - Connect the CH1 probe to PC130-327 TP2."], "jumps": ["P2330", "P2300", "P2325"]}, {"id": "P2330", "text": ["While viewing the oscilloscope display, rotate R10, the Offset control on the PC130-326 card from minimum to maximum and back.  Do you view data pulses between the sync pulses?", "While viewing the oscilloscope display, rotate R10, the Offset control on the PC130-326 card from minimum to maximum and back. Do you view data pulses between the sync pulses?"], "jumps": ["P2320"]}, {"id": "P2331", "text": [], "jumps": []}, {"id": "P2332", "text": ["Ensure S2 is in the Output position and R14 is at mid-point on the PC130-326 card.  If you are having difficulties see your instructor.", "Ensure S2 is in the Output position and R14 is at mid-point on the PC130-326 card. If you are having difficulties see your instructor.t to mid position on PC130-326. If you are having difficulties see your instructor."], "jumps": []}, {"id": "P2340", "text": ["The demodulator is receiving sync pulses and PCM data, now let's align the SYNC pulse detector."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["Ensure that CH1 is connected to PC130-327 TP2 and that you       are viewing the sync pulses.", "Ensure that CH1 is connected to PC130-327 TP2 and that you are viewing the sync pulses.s."], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["Adjust the DC offset control on the PC130-326 card so there is one HIGH pulse in the center of the oscilloscope display with a LOW pulse followed by a HIGH pulse on each side.", "Connect the CH2 probe to TP5 on PC130-327.  The signal on         TP5 is the clock input to the first flip-flop in the SYNC detector       circuit, the output of IC3c.", "Adjust the DC offset control on the PC130-326 card so there is one HIGH pulse in the center of the oscilloscope display with a LOW pulse followed by a HIGH pulse on each side.lowed by a HIGH pulse on each side.", "Connect the CH2 probe to TP5 on PC130-327. The signal on TP5 is the clock input to the first flip-flop in the SYNC detector circuit, the output of IC3c."], "jumps": ["P2370", "P2350", "P2380", "P2360"]}, {"id": "P2380", "text": ["When will the CLOCK signal to IC5a be HIGH?", "When will the CLOCK signal to IC5a be HIGH?................"], "jumps": ["P2370"]}, {"id": "P2381", "text": [], "jumps": []}, {"id": "P2382", "text": ["The RC time constant of C2 and R4 is such that, short duration noise pulses will not allow C2 to discharge enough to cause a HIGH output from IC3c."], "jumps": []}, {"id": "P2383", "text": ["The RC time constant of C2 and R4 is such that the SYNC pulse and 1 data pulse will allow C2 to discharge enough to chase a HIGH output of IC3c."], "jumps": []}, {"id": "P2390", "text": ["While viewing the CH2 waveform, adjust PC130-327 R4 for a          +5 volt narrow pulse on the trailing edge of the SYNC pulse            (CH1) as shown.", "While viewing the CH2 waveform, adjust PC130-327 R4 for a +5 volt narrow pulse on the trailing edge of the SYNC pulse (CH1) as shown.", "MEASUREMENT SETUP - Adjust PC130-327 R4."], "jumps": ["P2400", "P2380", "P2395"]}, {"id": "P2400", "text": ["The other HIGH pulses on CH2 should be close to the HIGH data pulses on CH1.", "The other HIGH pulses on CH2 should be close to the HIGH data pulses on CH1. different in your display depending on how you set the DC output voltage of the function generator."], "jumps": ["P2410", "P2390"]}, {"id": "P2410", "text": ["You have adjusted the clock input to IC5a so that the flip-flop is only set on SYNC and 1 data inputs to the demodulator."], "jumps": ["P2420", "P2390"]}, {"id": "P2420", "text": ["Connect the CH2 probe to TP4 on PC130-327.  The signal on         TP4 is the reset input to the first flip-flop in the sync detector          circuit, output of IC3b.", "Connect the CH2 probe to TP4 on PC130-327. The signal on TP4 is the reset input to the first flip-flop in the sync detector circuit, output of IC3b.", "MEASUREMENT SETUP - Connect the probe to TP4."], "jumps": ["P2430", "P2390", "P2425"]}, {"id": "P2430", "text": ["When will the RESET input to IC5a be HIGH?", "When will the RESET input to IC5a be HIGH?................."], "jumps": ["P2420"]}, {"id": "P2431", "text": [], "jumps": []}, {"id": "P2432", "text": ["The RC time constant of C1 and R5 is such that, short duration noise pulses and the little longer SYNC pulse will not allow C1 to discharge enough to cause a HIGH output from IC3b."], "jumps": []}, {"id": "P2433", "text": ["The RC time constant of C1 and R5 is such that, the SYNC pulse will not allow C1 to discharge enough to chase a HIGH output from IC3d.", "Using the alligator to alligator jumper, short the +5V TP to TP3       (TEST) on PC130-327. This prevents IC5a from becoming                reset during the next adjustment.", "Using the alligator to alligator jumper, short the +5V TP to TP3 (TEST) on PC130-327. This prevents IC5a from becoming reset during the next adjustment. nt."], "jumps": ["P2450", "P2430"]}, {"id": "P2450", "text": ["While viewing the CH2 waveform, adjust PC130-327 R5 so no         pulse is present on the trailing edge of the SYNC pulse (CH1)         as shown.", "While viewing the CH2 waveform, adjust PC130-327 R5 so no pulse is present on the trailing edge of the SYNC pulse (CH1) as shown.", "MEASUREMENT SETUP - Adjust PC130-327 R5."], "jumps": ["P2460", "P2440", "P2455"]}, {"id": "P2460", "text": ["There should only be HIGH pulses, CH2 waveform, near the data pulses, CH1 waveform. The HIGH data pulses on CH1 may be different on your display.", "There should only be HIGH pulses, CH2 waveform, near the data pulses, CH1 waveform. The HIGH data pulses on CH1 may be different on your display. on how you set the DC output voltage of the function generator."], "jumps": ["P2470", "P2450"]}, {"id": "P2470", "text": ["You have adjusted the reset input to IC5a so that the flip-flop is only reset on 1 data inputs to the demodulator."], "jumps": ["P2480", "P2450"]}, {"id": "P2480", "text": ["Remove the jumper between the +5V TP and TP3 on\nPC130-327.  The sync pulse should return when the jumper is       removed.  If not, go back to the R5 adjustment.  The last                   adjustment is to set the delay for the flip- flop latch, IC5b.", "Connect the CH2 probe to TP6 (SYNC) on PC130-327.  The             signal on TP6 is the reset input to the counter IC6.", "Remove the jumper between the +5V TP and TP3 on PC130-327. The sync pulse should return when the jumper is removed. If not, go back to the R5 adjustment. The last adjustment is to set the delay for the flip- flop latch, IC5b.", "Connect the CH2 probe to TP6 (SYNC) on PC130-327. The signal on TP6 is the reset input to the counter IC6."], "jumps": ["P2490", "P2450", "P2500", "P2480"]}, {"id": "P2500", "text": ["When will the RESET input to IC6 be HIGH?", "When will the RESET input to IC6 be HIGH?.................."], "jumps": ["P2490"]}, {"id": "P2501", "text": [], "jumps": []}, {"id": "P2502", "text": ["The counter IC6 should not be reset on data pulses.", "The counter IC6 should not be reset on data pulses........."], "jumps": []}, {"id": "P2510", "text": ["While viewing the CH2 waveform, adjust PC130-327 R6 so              there is only one pulse as close as possible to the trailing edge     of the SYNC pulse (CH1) as shown.", "While viewing the CH2 waveform, adjust PC130-327 R6 so there is only one pulse as close as possible to the trailing edge of the SYNC pulse (CH1) as shown.", "CH2 Sync Pulse to Binary Counter IC5 (a)", "MEASUREMENT SETUP - Adjust PC130-327 R6.", "MEASUREMENT SETUP - Adjust PC130-327 R6. Ensure the oscilloscope probes are grounded..."], "jumps": ["P2520", "P2500", "P2515"]}, {"id": "P2520", "text": ["You have now aligned the SYNC bit or SYNC pulse detector.  To ensure the detector operates for any data input, you must vary the PCM input and make sure the sync pulse is still present.", "You have now aligned the SYNC bit or SYNC pulse detector. To ensure the detector operates for any data input, you must vary the PCM input and make sure the sync pulse is still present."], "jumps": ["P2530", "P2510"]}, {"id": "P2530", "text": ["While observing the CH2 trace on the oscilloscope, vary the           DC Offset (R10) on the PC130-326 card to produce data sets          from  00000000 to 11111111.", "While observing the CH2 trace on the oscilloscope, vary the DC Offset (R10) on the PC130-326 card to produce data sets from 00000000 to 11111111."], "jumps": ["P2540", "P2510"]}, {"id": "P2540", "text": ["Did one and only one SYNC bit remain in the correct position for each different data set?"], "jumps": ["P2510"]}, {"id": "P2541", "text": [], "jumps": []}, {"id": "P2542", "text": ["The SYNC bit detector is not aligned properly. To get accurate measurements you must repeat the alignment procedures.  If you have difficulties see your instructor.", "The SYNC bit detector is not aligned properly. To get accurate measurements you must repeat the alignment procedures. If you have difficulties see your instructor."], "jumps": []}, {"id": "P2550", "text": ["The SYNC bit detector circuit is aligned and operating correctly.  Now you can observe the operation of the reset of the PCM demodulator circuit.", "The SYNC bit detector circuit is aligned and operating correctly. Now you can observe the operation of the reset of the PCM demodulator circuit."], "jumps": ["P2580", "P2540"]}, {"id": "P2580", "text": ["Disconnect the CH2 probe from the circuit. \nSet the DC Offset control on the PC130-326 card fully CCW.            You should be viewing the waveform shown below.", "Using the CH2 probe, measure the digital output, D0 through         D7 from the serial to a parallel converter.  Use the J1 pins for          measuring the signals, the top pin is D0.  Also, remember that        the SYNC pulse will not be part of the parallel output data.", "Disconnect the CH2 probe from the circuit. Set the DC Offset control on the PC130-326 card fully CCW. You should be viewing the waveform shown below. I", "Using the CH2 probe, measure the digital output, D0 through D7 from the serial to a parallel converter. Use the J1 pins for measuring the signals, the top pin is D0. Also, remember that the SYNC pulse will not be part of the parallel output data."], "jumps": ["P2590", "P2550", "P2600", "P2580"]}, {"id": "P2600", "text": ["Type in the parallel output of the Serial/Parallel converter as 0's for lows and 1's for highs.", "Type in the parallel output of the Serial/Parallel converter as 0's for lows and 1's for highs. ?arallel Output ?"], "jumps": ["P2590", "P2602"]}, {"id": "P2601", "text": [], "jumps": []}, {"id": "P2602", "text": ["Be sure you are measuring the signals on J1, pin D0.  The function generator DC Offset control should be fully CCW, there should not be any HIGH data pulses on the CH1 waveform.", "Be sure you are measuring the signals on J1, pin D0. The function generator DC Offset control should be fully CCW, there should not be any HIGH data pulses on the CH1 waveform."], "jumps": []}, {"id": "P2607", "text": ["You still have not entered the correct value for the parallel data.  With the DC Offset control of the function generator fully CCW the correct value for the PCM is 00000000.  The parallel output data should also be 00000000.", "You still have not entered the correct value for the parallel data. With the DC Offset control of the function generator fully CCW the correct value for the PCM is 00000000. The parallel output data should also be 00000000."], "jumps": ["P2610", "P2600"]}, {"id": "P2610", "text": ["Vary the DC Offset control on the PC130-326 card. \n Using CH2, measure the parallel output of the Serial/Parallel           converter for each different setting of the pulse train using the       DC Offset control.", "Vary the DC Offset control on the PC130-326 card. Using CH2, measure the parallel output of the Serial/Parallel converter for each different setting of the pulse train using the DC Offset control."], "jumps": ["P2620", "P2600"]}, {"id": "P2620", "text": ["The serial data shown on CH1 of the oscilloscope should match the parallel data as measured on CH2 for each DC setting of the\nOffset control.", "The serial data shown on CH1 of the oscilloscope should match the parallel data as measured on CH2 for each DC setting of the Offset control."], "jumps": ["P2650", "P2610"]}, {"id": "P2630", "text": ["Now that the PCM demodulator is setup, it is time to apply an anal modulator.  Channel 2 is the same signal reproduced by the demodulator.  Adjust R9 on the PC130-327 card for a 10 Vp-p signal.", "Channel 1 is the original 10 Vp-p analog sine wave input to the modulator. Channel 2 is the same signal reproduced by the demodulator. Adjust R9 on the PC130-327 card for a 10 Vp-p signal.odulator on CH2. The signals should be changing together."], "jumps": ["P2700", "P2680"]}, {"id": "P2700", "text": ["The PCM system is operating correctly, changing analog to digital, changing parallel to serial, transmitting PCM, receiving PCM, changing serial to parallel, and changing digital to analog."], "jumps": ["P2710", "P2690"]}, {"id": "P2710", "text": ["Last, let's see what happens to the system when other waveforms are applied.", "Last, let's see what happens to the system when other waveforms are applied. ied."], "jumps": ["P2720", "P2700"]}, {"id": "P2720", "text": ["Vary the frequency output of the function generator.  Notice the resolution of the output signal deteriorates with higher input frequencies due to the reduced ratio of the frequency to frame count.", "Vary the frequency output of the function generator. Notice the resolution of the output signal deteriorates with higher input frequencies due to the reduced ratio of the frequency to frame count."], "jumps": ["P2730", "P2710"]}, {"id": "P2730", "text": ["Next, try varying the input voltage by changing the function generator output voltage.  Note the output waveform exactly follows the voltage changes of the input but clipping will occur if over driven.", "Next, try varying the input voltage by changing the function generator output voltage. Note the output waveform exactly follows the voltage changes of the input but clipping will occur if over driven.by changing the function generator output voltage. Note the output waveform exactly follows the voltage changes of the input but clipping will occur if over driven."], "jumps": ["P2740", "P2720"]}, {"id": "P2740", "text": ["Change the function generator output to produce a 1 kHz triangle wave. Vary the function generator output voltage. Note the output waveform exactly follows the voltage changes of the input but clipping will occur if over driven....................................................."], "jumps": ["P2770", "P2730"]}, {"id": "P2770", "text": ["Change the function generator output to produce a 1 kHz square wave signal. Notice the data sampling causes ripples on the leading and trailing edges of the square wave."], "jumps": ["P2780", "P2740"]}, {"id": "P2775", "text": ["This concludes the experiment on pulse code modulation. Experiment with different voltage and frequency combinations to further your understanding. Press Enter to finish the experiment. riment on pulse code modulation. Experiment with different voltage and frequency combinations to further your understanding. Press Enter to finish the experiment."], "jumps": ["P2780", "P2770"]}, {"id": "P2780", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": ["P2770"]}, {"id": "P2790", "text": ["2.  Set the Console Power Switch to OFF.", "2. Set the Console Power Switch to OFF...................."], "jumps": ["P2780"]}, {"id": "P2800", "text": ["3.  Disconnect all test equipment. \n4.  Carefully remove experiment card.  \n5.  Return all equipment to designated storage areas.", "3. Disconnect all test equipment. 4. Carefully remove experiment card. 5. Return all equipment to designated storage areas."], "jumps": ["P2910", "P2790"]}, {"id": "P2910", "text": ["This completes the experiment on PCM RECEIVER CIRCUITS.", "This completes the experiment on PCM RECEIVER CIRCUITS....."], "jumps": ["P2800"]}, {"id": "P13020", "text": ["In this experiment, you will observe the operation and measure signals in a typical PCM transmitter circuit."], "jumps": ["P13040", "P1001"]}, {"id": "P13040", "text": ["The transmitter circuit is contained on PC130-326 and consists of five major sections."], "jumps": ["P13050", "P13020"]}, {"id": "P13050", "text": ["The amplifier circuit is used to scale the analog input voltage."], "jumps": ["P13060", "P13020"]}, {"id": "P13060", "text": ["The Analog to Digital Converter converts the analog information to digital."], "jumps": ["P13070", "P13020"]}, {"id": "P13070", "text": ["The output of the A/D is also used to drive a display card, \nPC130-284.", "The output of the A/D is also used to drive a display card, PC130-284."], "jumps": ["P13080", "P13020"]}, {"id": "P13080", "text": ["The display card is used to give you a visual indication of the output of the A/D converter."], "jumps": ["P13090", "P13020"]}, {"id": "P13090", "text": ["The Parallel to Serial Converter changes the parallel output of the A/D converter to serial."], "jumps": ["P13100", "P13020"]}, {"id": "P13100", "text": ["The Output Multiplexer adds the sync pulse to the serial data. Then the entire frame is transmitted out."], "jumps": ["P13110", "P13020"]}, {"id": "P13110", "text": ["The Timer/Sync Bit Generator generates the sync pulse and controls the operation of the A/D and P/S converters.", "Now, pick up the PC130-326 card and compare to the schematic."], "jumps": ["P13120", "P13020", "P13130", "P13110"]}, {"id": "P13130", "text": ["Notice R7, R10 and R14. These variable resistors are used to align the PCM modulator."], "jumps": ["P13140", "P13120"]}, {"id": "P13140", "text": ["Also notice J1 on the card. This is the parallel output to the display card."], "jumps": ["P13150", "P13120"]}, {"id": "P13150", "text": ["Now, pick up the PC130-284 digital readouts card.", "Match up the other components on the card to the schematic.", "Now, pick up the PC130-284 digital readouts card............"], "jumps": ["P13160", "P13120", "P13170", "P"]}, {"id": "P13170", "text": ["The eight LEDs are used to indicate an eight bit digital number in binary.  The LSB is A0.", "The eight LEDs are used to indicate an eight bit digital number in binary. The LSB is A0."], "jumps": ["P13180", "P13160"]}, {"id": "P13180", "text": ["The two seven segment displays are used to indicate two four bit binary numbers."], "jumps": ["P13190", "P13160"]}, {"id": "P13190", "text": ["The decoders used in the circuit do not decode the binary numbers from 1010 to 1111 into hexadecimal letters, A through F."], "jumps": ["P13200", "P13160"]}, {"id": "P13200", "text": ["Therefore, the seven segment displays will not be used in this experiment; however, they will show the numbers 0 through 9."], "jumps": ["P13210", "P13160"]}, {"id": "P13210", "text": ["An 8 pin ribbon cable (twisted) connects PC130-326 to \nPC130-284.", "An 8 pin ribbon cable (twisted) connects PC130-326 to PC130-284."], "jumps": ["P13230", "P13160"]}, {"id": "P13230", "text": ["Let's start the experiment.", "Let's start the experiment.e..............................."], "jumps": ["P13240", "P13210"]}, {"id": "P13240", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13230"]}, {"id": "P13250", "text": ["2.  Carefully plug PC130-326 into the Test Console PC2 position. 3.  Carefully plug PC130-284 into the Test Console PC3 position.", "2. Carefully plug PC130-326 into the Test Console PC2 position. 3. Carefully plug PC130-284 into the Test Console PC3 position."], "jumps": ["P13260"]}, {"id": "P13260", "text": ["4.  Press Enter to set:  Positive Supply Voltage - 15 \n                                          Negative Supply Voltage - 15", "5.  On PC130-326, set switches S1 to DC and S2 to READOUT.", "6.  On PC130-284, set switch S1 to 15. This allows operation of           the card using +15 volts.  The 5 position allows operation of           the card using +5 volts.", "4. Press Enter to set: Positive Supply Voltage - 15 Negative Supply Voltage - 15", "5. On PC130-326, set switches S1 to DC and S2 to READOUT..", "6. On PC130-284, set switch S1 to 15. This allows operation of the card using +15 volts. The 5 position allows operation of the card using +5 volts."], "jumps": ["P13250", "P13290", "P13300", "P13280", "P"]}, {"id": "P13300", "text": ["7.  Connect the 8 pin ribbon cable from J1 on PC130-326 to J1 on       PC130-284.  Ensure that the top wire from PC130-326                        connects to the bottom connector on PC130-284.", "7. Connect the 8 pin ribbon cable from J1 on PC130-326 to J1 on PC130-284. Ensure that the top wire from PC130-326 connects to the bottom connector on PC130-284.", "MEASUREMENT SETUP - 8 pin ribbon cable (twisted) connected from J1 PC130-326 to J1 PC130-284."], "jumps": ["P13310", "P13290", "P13305"]}, {"id": "P13310", "text": ["8.  Connect the MAIN output of the function generator to the                PC1 OUTPUT BNC. The function generator is used as the               analog information source.", "8. Connect the MAIN output of the function generator to the PC1 OUTPUT BNC. The function generator is used as the analog information source."], "jumps": ["P13320", "P13300"]}, {"id": "P13320", "text": ["9.  On the function generator, set the controls as follows:", "9. On the function generator, set the controls as follows:", "Modulation: Off Frequency: 1 kHz Output level: Minimum DC offset: On DC offset level: Minimum Function Square wave"], "jumps": ["P13325", "P13310"]}, {"id": "P13325", "text": ["10. Adjust both channel 1 and channel 2 of the oscilloscope to the following settings:", "Time/Div 0.5 msec Volts/Div 5 Input DC Triggering Auto Trigger source Channel 1"], "jumps": ["P13330", "P13320"]}, {"id": "P13330", "text": ["11.  Press Enter to set: PC2 DC Power Switch - ON \n                                            PC3 DC Power Switch - ON", "11. Press Enter to set: PC2 DC Power Switch - ON PC3 DC Power Switch - ON"], "jumps": ["P13325"]}, {"id": "P13340", "text": ["The PCM modulator circuit is now setup.", "The PCM modulator circuit is now setup. e function generator is setup to output a DC voltage used for aligning the PCM modulator."], "jumps": ["P13350"]}, {"id": "P13350", "text": ["In this PCM modulator circuit, the information signal is limited to 10 Vpp at 10 kHz.  Calculate and type in the minimum sample frequency that can be used.", "In this PCM modulator circuit, the information signal is limited to 10 Vpp at 10 kHz. Calculate and type in the minimum sample frequency that can be used."], "jumps": ["P13340", "P13352", "P13355"]}, {"id": "P13351", "text": [], "jumps": []}, {"id": "P13352", "text": ["The minimum sample frequency is the Nyquist rate which is twice the highest information signal frequency, or twice 10 kHz. Recalculate the sample rate."], "jumps": []}, {"id": "P13355", "text": ["SAMPLE RATE - The minimum sample rate is the Nyquist rate which is two times the highest information signal frequency."], "jumps": []}, {"id": "P13357", "text": ["You still have not calculated the correct sample rate. You should have calculated 20 kHz, or 2 times 10 kHz."], "jumps": ["P13360", "P13350"]}, {"id": "P13360", "text": ["Using a sample rate of 20 kHz and considering the number of bits that are to be transmitted is 9 (eight data and one sync), calculate and type in the bandwidth of the system."], "jumps": ["P13350", "P13365", "P13362"]}, {"id": "P13361", "text": [], "jumps": []}, {"id": "P13362", "text": ["The bandwidth is the number of bits used times the minimum sample rate of 20 kHz.  Recalculate the sample rate.", "The bandwidth is the number of bits used times the minimum sample rate of 20 kHz. Recalculate the sample rate."], "jumps": []}, {"id": "P13365", "text": ["BANDWIDTH - The bandwidth of a system is equal to the number of bits used times the sample rate."], "jumps": []}, {"id": "P13367", "text": ["You still have not calculated the bandwidth. You should have calculated 180 kHz, or 9 times 20 kHz."], "jumps": ["P13370", "P13360"]}, {"id": "P13370", "text": ["Now, knowing the minimum sample rate, 20 kHz, maximum voltage input, 10 Vpp, and the bandwidth, 180 kHz, the PCM modulator can be aligned for the parameters given.", "1.  Using a frequency counter if available (use an oscilloscope if        not), adjust R7 on PC130-326 for a 180 kHz (+/- 1 kHz ) signal \n     at the Frame Clock TP.", "2.  Connect the oscilloscope Channel 1 probe to the Input test             point on the PC130-326 card.", "1. Using a frequency counter if available (use an oscilloscope if not), adjust R7 on PC130-326 for a 180 kHz (+/- 1 kHz ) signal at the Frame Clock TP. t the Nida 440 function generator has a built in frequency counter.", "2. Connect the oscilloscope Channel 1 probe to the Input test point on the PC130-326 card.10.00 volt measurement on PC130-326 Input TP."], "jumps": ["P13380", "P13360", "P13390", "P13370", "P13395"]}, {"id": "P13395", "text": ["3. Using the DC Offset and the Output Level controls on the function generator, apply a 10 Volt p-p square wave. The most-negative part of the waveform must be at zero volts as shown...", "4. Set the function generator for the minimum frequency output possible. The output should change from positive to negative about every 3 seconds. Adjust R10 on the PC130- 326 card fully CCW."], "jumps": ["P13400", "P13390", "P13410"]}, {"id": "P13410", "text": ["5.  During the POSITIVE portion of the input waveform slowly adjust R10 CW.  You'll note the LEDs on the PC130-284 begin\nincrementing the count.  Stop the CW rotation JUST as the LEDs\ndisplay 11111111.", "5. During the POSITIVE portion of the input waveform slowly adjust R10 CW. You'll note the LEDs on the PC130-284 begin incrementing the count. Stop the CW rotation JUST as the LEDs display 11111111.", "Ensure the adjustment of R10 is accurate and CW rotation is halted JUST as 11111111 is displayed during the positive portion of the waveform. negative about every 3 seconds. Adjust R10 on the PC130- 326 card fully CCW. output."], "jumps": ["P13415", "P13400", "P13420"]}, {"id": "P13420", "text": ["The PCM modulator circuit is now set up and aligned for analog information signals from 0 Hz to 10 kHz at levels up to 10 Vpp."], "jumps": ["P13430", "P13400"]}, {"id": "P13430", "text": ["Now, let's measure signals in the PCM modulator circuit and verify that the A/D and P/S converters are operating correctly.", "We'll next vary the input voltage at the Input test point while monitoring the LED display.", "We'll next vary the input voltage at the Input test point while monitoring the LED display.\"the Input TP. 2. Vary the DC Offset control on the function generator."], "jumps": ["P13440", "P13420", "P13450", "P13430"]}, {"id": "P13450", "text": ["Vary the DC Offset control on the function generator while viewing the LEDs and the oscilloscope.  Do not adjust past 00000000 on the negative side or 11111111 on the positive side.", "1.  Connect CH1 of the oscilloscope to the IN TP. \n2.  Vary the DC Offset control on the function generator.", "Vary the DC Offset control on the function generator while viewing the LEDs and the oscilloscope. Do not adjust past 00000000 on the negative side or 11111111 on the positive side.\".", "1. Connect CH1 of the oscilloscope to the IN TP. 2. Vary the DC Offset control on the function generator."], "jumps": ["P13460", "P13440", "P13470", "P", "Ps"]}, {"id": "P13470", "text": ["You should observe the DC input voltage change just like you did on the Input TP.  The only difference in this TP is that in the AC mode, a DC bias will be added.", "You should observe the DC input voltage change just like you did on the Input TP. The only difference in this TP is that in the AC mode, a DC bias will be added."], "jumps": ["P13480", "P13440"]}, {"id": "P13480", "text": ["To determine if the A/D and S/P converters are operating correctly,  you must calculate the binary output of the modulator for a given analog voltage input.  This is where the quantization level and quantization level voltage spacing comes into play.", "To determine if the A/D and S/P converters are operating correctly, you must calculate the binary output of the modulator for a given analog voltage input. This is where the quantization level and quantization level voltage spacing comes into play."], "jumps": ["P13490", "P13440"]}, {"id": "P13490", "text": ["Knowing that the A/D converter produces an 8 bit output (ignore sync pulse for right now), calculate and type in the quantization level."], "jumps": ["P13480", "P13495", "P13492"]}, {"id": "P13491", "text": [], "jumps": []}, {"id": "P13492", "text": ["Remember, the quantization level equals two to the    power and  is 8 in this circuit.", "Remember, the quantization level equals two to the power and is 8 in this circuit.."], "jumps": []}, {"id": "P13495", "text": ["QUANTIZATION LEVEL - The quantization level of an A/D converter is equal to two to the power where equals the number of bits in the converter."], "jumps": []}, {"id": "P13497", "text": ["You still have not calculated the correct quantization level.  You should have calculated 256 because    equals 8.", "You still have not calculated the correct quantization level. You should have calculated 256 because equals 8."], "jumps": ["P13500", "P13490"]}, {"id": "P13500", "text": ["Knowing that q is 256, calculate and type in, rounded to three decimal places, the voltage between levels (remember, the maximum Vpp is 10)."], "jumps": ["P13490", "P13505", "P13502"]}, {"id": "P13501", "text": [], "jumps": []}, {"id": "P13502", "text": ["Remember, the voltage spacing is the maximum input voltage divided by the quantization level minus 1.  Recalculate the voltage spacing.", "Remember, the voltage spacing is the maximum input voltage divided by the quantization level minus 1. Recalculate the voltage spacing."], "jumps": []}, {"id": "P13505", "text": ["Vmax Voltage spacing = q - 11", "VOLTAGE SPACING - The voltage between levels in an A/D converter is equal to the maximum voltage input divided by the quantization level minus 1."], "jumps": []}, {"id": "P13507", "text": ["You still have not calculated the correct voltage spacing between quantization levels.  You should have calculated 0.039 which is 10 divided by 255 and rounded off to three places.", "You still have not calculated the correct voltage spacing between quantization levels. You should have calculated 0.039 which is 10 divided by 255 and rounded off to three places."], "jumps": ["P13510", "P13500"]}, {"id": "P13510", "text": ["Now, to determine the binary output of the A/D converter, you must determine the number of levels for a particular input voltage.  Let's use a voltage of 7.5 volts.", "Now, to determine the binary output of the A/D converter, you must determine the number of levels for a particular input voltage. Let's use a voltage of 7.5 volts."], "jumps": ["P13520", "P13500"]}, {"id": "P13520", "text": ["Dividing 7.5 volts by the voltage level spacing produces 192.30. Since the quantization levels are always a whole number, the output level for a 7.5 volt input is 192 out of 256."], "jumps": ["P13530", "P13510"]}, {"id": "P13530", "text": ["Changing the level of 191 into binary produces 10111111. 1011111 should be the output of the A/D converter for an input of 7.5 volts.  Let's check.", "Changing the level of 191 into binary produces 10111111. 1011111 should be the output of the A/D converter for an input of 7.5 volts. Let's check."], "jumps": ["P13535", "P13520"]}, {"id": "P13535", "text": ["Reduce the function generator frequency to minimum and view the LEDs while the input waveform cycles.", "Set the function generator to any frequency above 100 Hz so that a square wave is displayed on the oscilloscope. Using the DC Offset and the Output Level controls, adjust for a 7.5 V p-p output with the zero volts reference as shown.\" Then reduce the frequency to minimum."], "jumps": ["P13540", "P13530", "P13550", "P13535"]}, {"id": "P13550", "text": ["Look at the LEDs on the PC130-284 card and enter the binary man Baltic;Arial CE;Arial Cyr;Arial Greek;Arial Tur;Arial (Hebrew);Arial (Arabic);Arial Baltic;Compare the oscilloscope display to the LED display on the PC130-284 card while adjusting R10, the Offset control CW from 00000001 to 11111111."], "jumps": ["P13700", "P13680"]}, {"id": "P13700", "text": ["Note that the sync pulse is different from the HIGH data pulses. Remember, the demodulator circuit must be able to distinguish  between a sync pulse and a HIGH data pulse.", "Note that the sync pulse is different from the HIGH data pulses. Remember, the demodulator circuit must be able to distinguish between a sync pulse and a HIGH data pulse."], "jumps": ["P13740", "P13690"]}, {"id": "P13740", "text": ["As you have seen, the PCM modulator changes analog to digital and serially outputs digital data along with a sync pulse."], "jumps": ["P13700"]}, {"id": "P13750", "text": ["1.  Set the Console Power Switch to OFF.", "1. Set the Console Power Switch to OFF.FF................................."], "jumps": []}, {"id": "P13760", "text": ["2.  Disconnect all test equipment. \n3.  Carefully remove experiment card. \n4.  Return all equipment to designated storage areas.", "2. Disconnect all test equipment. 3. Carefully remove experiment card. 4. Return all equipment to designated storage areas."], "jumps": ["P13910", "P13750"]}, {"id": "P13910", "text": ["This completes the experiment on PCM TRANSMITTER CIRCUITS.", "This completes the experiment on PCM TRANSMITTER CIRCUITS...."], "jumps": ["P13760"]}, {"id": "P14020", "text": ["In this experiment, you will observe the operation and measure signals in a typical PCM receiver circuit."], "jumps": ["P14040", "P2001"]}, {"id": "P14040", "text": ["The receiver circuit is contained on PC130-327 and consists of six major sections."], "jumps": ["P14050", "P14020"]}, {"id": "P14050", "text": ["The input amplifier circuit is used to compensate for attenuation and distortion caused by the transmission medium."], "jumps": ["P14060", "P14020"]}, {"id": "P14060", "text": ["The serial to parallel converter changes the serial input PCM data to parallel."], "jumps": ["P14070", "P14020"]}, {"id": "P14070", "text": ["The digital to analog converter converts the parallel digital data to analog."], "jumps": ["P14080", "P14020"]}, {"id": "P14080", "text": ["The Output Amplifier is used to filter and amplify the analog output signal."], "jumps": ["P14090", "P14020"]}, {"id": "P14090", "text": ["The SYNC Bit Detector locates the SYNC pulse and initializes the timing circuit."], "jumps": ["P14100", "P14020"]}, {"id": "P14100", "text": ["The timing section controls the serial to parallel conversion.  The conversion only takes place after the eight data bits have been loaded.", "Now, pick up the PC130-327 card and compare to the schematic.", "The timing section controls the serial to parallel conversion. The conversion only takes place after the eight data bits have been loaded."], "jumps": ["P14110", "P14020", "P14120"]}, {"id": "P14120", "text": ["Notice the five variable resistor, R4, R5, R6, R7 and R9."], "jumps": ["P14130", "P14110"]}, {"id": "P14130", "text": ["R4, R5 and R6 set the SYNC bit detector, R7 sets the bandwidth and R9 calibrates the D/A converter."], "jumps": ["P14140", "P14110"]}, {"id": "P14140", "text": ["Also, the output of the serial to parallel converter, IC2, connects to J1.  J1 is used to connect a display.", "Also, the output of the serial to parallel converter, IC2, connects to J1. J1 is used to connect a display."], "jumps": ["P14150", "P14110"]}, {"id": "P14150", "text": ["Match up the other components on the card to the schematic."], "jumps": ["P14160", "P14110"]}, {"id": "P14160", "text": ["Let's start the experiment!", "Let's start the experiment!e...............................", "The PCM Transmitter circuit cards must be aligned as per the PCM Transmitter experiment before entering the PCM Receiver Experiment. If you have not aligned these circuit cards or are unsure whether they ar r must be at least the minimum sample rate times the number of digits used in the system."], "jumps": []}, {"id": "P14245", "text": ["BANDWIDTH - Use the formulas below to calculate the bandwidth.", "1.  Using a frequency counter adjust R7 on PC130-327 for a\n     180  kHz signal at the RxCLOCK TP.  The Nida 440 Function           Generator has a built in frequency counter that can be used           for this alignment.", "s) The bandwidth of a PCM system is the sample rate times the number of bits transmitted...", "mmax The number of transmitted data bits is 8 and 1 SYNC pulse which produces 9 bits.", "1. Using a frequency counter adjust R7 on PC130-327 for a 180 kHz signal at the RxCLOCK TP. The Nida 440 Function Generator has a built in frequency counter that can be used for this alignment."], "jumps": ["P14260", "P14240"]}, {"id": "P14260", "text": ["Now, the bandwidth of the PCM receiver is setup.  The next process is to check that the demodulator on PC130-327 is receiving the PCM signal that consists of SYNC pulses and data pulses.", "Now, the bandwidth of the PCM receiver is setup. The next process is to check that the demodulator on PC130-327 is receiving the PCM signal that consists of SYNC pulses and data pulses."], "jumps": ["P14270", "P14250"]}, {"id": "P14270", "text": ["On the oscilloscope set the controls as follows:", "On the oscilloscope set the controls as follows:s:.......", "Volt/Div CH1 & CH2 - As needed Time/Div - 2 ms Triggering - EXT, AC, - (Negative) Display - Dual - enabled, pulled out"], "jumps": ["P14280", "P14260", "P14275"]}, {"id": "P14275", "text": ["Connect the external trigger of the oscilloscope to the SYNC          TP on PC130-326. The Modulator card is in the PC2 position.          The sync pulse generated in the modulator circuit is used as         triggering for the oscilloscope to align the SYNC detector                circuit in the demodulator.", "OSCILLOSCOPE - CH1 Volts/Div - As needed; Time/Div - 2 ms CH2 Volts/Div - As ne let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
