const book = {"title": "93953602", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . ."], "jumps": []}, {"id": "P1", "text": ["Title: ASTABLE MULTIVIBRATOR OPERATIONfd asdf asdf sadf", "Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Measure the input and output waveforms of an astable multivibrator. w Recognize normal operation of an astable multivibrator......", "w Identify astable multivibrator circuits. w Identify the purpose of individual components in astable multivibrators. w Describe the operation of astable multivibrators........"], "jumps": ["P10", "P300"]}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about the astable multivibrator."], "jumps": ["P300", "P410"]}, {"id": "P410", "text": ["Astable multivibrators change the DC operating voltage to a square wave output."], "jumps": ["P400", "P420"]}, {"id": "P420", "text": ["The operation of an astable multivibrator is free-running. It requires no external input pulse."], "jumps": ["P400", "P430"]}, {"id": "P430", "text": ["The components in the feedback circuit determine astable operation."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on ASTABLE MULTIVIBRATOR OPERATION..................."], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": ["P440"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["This is a typical astable multivibrator circuit............"], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["It is identified as an astable multivibrator by the feedback circuit containing C1 and C2."], "jumps": ["P1020", "P1040"]}, {"id": "P1040", "text": ["The circuit consists of two common emitter amplifiers. Notice that NPN transistors are used."], "jumps": ["P1020", "P1050"]}, {"id": "P1050", "text": ["Q1 amplifier uses R1 and R3 for biasing."], "jumps": ["P1020", "P1060"]}, {"id": "P1060", "text": ["R1 is the collector load resistor and R3 is the base bias resistor. The RC circuit made up of R3 and C2 control the charge time for the voltage present at the base of Q1..."], "jumps": ["P1020", "P1070"]}, {"id": "P1070", "text": ["Q2 amplifier uses R2 and R4 for biasing. Normally, the value of R2 is the same as R3 and the value of R4 is the same as R1."], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["R2 is the base bias resistor and R4 is the collector load resistor. The RC circuit made up of R2 and C1 control the charge time for the voltage present at the base of Q2....."], "jumps": ["P1020", "P1090"]}, {"id": "P1090", "text": ["The output of each transistor at the collector is connected to the input of the opposite transistor at the base through the /", "The output of each transistor at the collector is connected to the input of the opposite transistor at the base through the capacitors C1 and C2, a pair of capacitors, usually of the same value..."], "jumps": ["P1020", "P1100"]}, {"id": "P1100", "text": ["What is the purpose of R1?s typed.........................."], "jumps": ["P1020"]}, {"id": "P1101", "text": [], "jumps": ["P1100", "P1110"]}, {"id": "P1102", "text": ["R1 is not the base bias resistor for Q2. C1 blocks DC voltage, only R2 is in the base circuit of Q2..."], "jumps": ["P1100"]}, {"id": "P1103", "text": ["R1 is not the base bias resistor for Q1. R1 is not in the base circuit for Q1."], "jumps": ["P1100"]}, {"id": "P1110", "text": ["What is the purpose of R3?s typed.........................."], "jumps": ["P1100"]}, {"id": "P1111", "text": [], "jumps": ["P1110", "P1120"]}, {"id": "P1112", "text": ["R3 is not the base bias resistor for Q2. R3 is not in the base circuit for Q2."], "jumps": ["P1110"]}, {"id": "P1113", "text": ["R3 is not the collector load resistor of Q1. R3 is not in the collector circuit for Q1."], "jumps": ["P1110"]}, {"id": "P1120", "text": ["With the cross coupling of the inputs and the outputs the circuit ensures that when Q1 is conducting Q2 is off. Likewise, when Q2 is on Q1 must be off. The outputs are exactly opposite each other and 180 degrees out of phase..."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["When the circuit is first energized, a positive voltage is applied to the base of each transistor amplifier. The capacitors have no effect, as initially, both plates of each capacitor have a positive potential applied."], "jumps": ["P1120", "P1140"]}, {"id": "P1140", "text": ["Since the components in the two amplifiers are not EXACTLY the same value, one of the transistor bases will reach .6 volts first and begin conducting momentarily before the other transistor."], "jumps": ["P1150", "P1120", "P1145"]}, {"id": "P1142", "text": ["Since the components in the two amplifiers are not EXACTLY the same values, the two amplifiers will start conducting at different times."], "jumps": ["P1150", "P1120", "P1145"]}, {"id": "P1145", "text": ["COMPONENT DIFFERENCES - Identical components can not be manufactured to exactly the same value. Resistors are normally", "10% of marked value. Also, the same type of transistors have slightly different characteristics."], "jumps": []}, {"id": "P1150", "text": [], "jumps": ["P1142", "P1160"]}, {"id": "P1160", "text": ["When Q1 turns ON, the +12 V on the collector decreases to 0 V. C1 discharges, dumping a negative charge to the base of Q2, latching Q2 OFF. At this point Q1's collector is 0 V and Q2's collector is 12 V since Q2 is turned OFF."], "jumps": ["P1142", "P1170"]}, {"id": "P1170", "text": ["The side of C1 common to the Q1 collector is 0 V. This causes C1 to begin charging through R2. The voltage at the base of Q2 also begins to increase since the two points are common................n.."], "jumps": ["P1180", "P1142"]}, {"id": "P1180", "text": ["e amount of time it takes for the base of Q2 to reach .6 V, the potential needed to tur.", "The values of R2 and C1 determine the amount of time it takes for the base of Q2 to reach .6 V, the potential needed to turn ON Q2."], "jumps": ["P1190", "P1142"]}, {"id": "P1190", "text": ["FIRST STATE OF THE MULTIVIBRATOR Q1 is ON, and the output at the collector is 0 V. Q2 is OFF and the output at the collector is 12 V. The base of Q2 has an increasing DC voltage present, but not yet enough to cause the transistor to conduct..."], "jumps": ["P1200", "P1142"]}, {"id": "P1192", "text": ["FIRST STATE OF THE MULTIVIBRATOR Q1 is ON, and the output at the collector is 0 V. Q2 is OFF and the output at the collector is 12 V. The base of Q2 has an increasing DC voltage present, but not yet enough to cause the transistor to conduct....."], "jumps": ["P1200", "P1142"]}, {"id": "P1200", "text": ["One side of C2 is at 12 V and the other side is fixed at .6 V so C2 is also building a charge. The charging of C1 through R2 will soon change the state of the multivibrator, but at the current state the ouputs of the mul.", "One side of C2 is at 12 V and the other side is fixed at .6 V so C2 is also building a charge. The charging of C1 through R2 will soon change the state of the multivibrator, but at the current state the outputs of the multivibrator have not toggled."], "jumps": ["P1240", "P1190"]}, {"id": "P1240", "text": ["Once C1 charges to .6 V through R2, the base-emitter junction of Q2 is forward biased and Q2 turns ON."], "jumps": ["P1250", "P1190"]}, {"id": "P1250", "text": ["Forward biasing Q2 immediately pulls the collector to ground through Q2. This causes the output to go to zero voltage..."], "jumps": ["P1260", "P1192"]}, {"id": "P1260", "text": ["C2 discharges, dum to ground through Q1. This pulls the base of Q1 to 0 V, turning OFF Q1. The collector of Q1 rises to 12 V, thus completing the toggle of both outputs between 0 and 12 V.", "C2 discharges, dumping a negative voltage to the base of Q1. This turns OFF Q1. The collector of Q1 immediatly rises to 12 V, thus completing the toggle of both outputs between 0 and 12 V..................................."], "jumps": ["P1270", "P1192"]}, {"id": "P1270", "text": ["The discharging current sets up a negative voltage on the bottom of R3 which is felt on the base of Q1."], "jumps": ["P1290", "P1192"]}, {"id": "P1290", "text": ["SECOND STATE OF THE MULTIVIBRATOR Q1 OFF, +12 V on collector: Q1 turned off by the discharging of C2.", "SECOND STATE OF THE MULTIVIBRATOR Q1 OFF, +12 V on collector: Q1 turned off by the discharging of C2. Q2 is conducting. The"], "jumps": ["P1192", "P1295"]}, {"id": "P1292", "text": ["SECOND STATE OF THE MULTIVIBRATOR Q1 OFF, +12 V on collector: Q1 turned off by the discharging of C1. 3", "SECOND STATE OF THE MULTIVIBRATOR Q1 OFF, +12 V on collector: Q1 turned off by the discharging of C1. Q2 is conducting."], "jumps": ["P1294", "P1192"]}, {"id": "P1294", "text": ["Q2 ON, 0 V on collector: Q2 turned on by the potential through R2 charging of C1..."], "jumps": ["P1292", "P1300"]}, {"id": "P1295", "text": ["pposite of before, C1 has +12 V on the side cono effect in the circuit for now and base voltage at Q1 now begins to rise as C2 charges through R3.", "Just the opposite of before, C1 has +12 V on the side common to the collector of Q1 and .6 V at the side common to the base of Q2. The base voltage at Q1, now too negative for conduction, is rising as C2 charges through R3....................................."], "jumps": ["P1300", "P1292"]}, {"id": "P1300", "text": ["As before, the multivibrator will remain in this state until the voltage at Q1 base reaches .6 V. At that time Q1 turns ON, C1 discharges, Q2 turns OFF, and the outputs again toggle."], "jumps": ["P1292", "P1360"]}, {"id": "P1360", "text": ["RETURN TO THE FIRST STATE Q1 ON with a 0 V output, Q2 OFF with a 12 V output, and C1 charging through R2......................"], "jumps": ["P1292", "P1365"]}, {"id": "P1365", "text": ["RETURN TO THE SECOND STATE Q1 OFF, Q2 ON, and voltage increasing on the base of Q1 as C2 charges through R3."], "jumps": ["P1390", "P1292"]}, {"id": "P1390", "text": ["With Q1 ON, how is Q2 turned OFF?.........................."], "jumps": ["P1292", "P1393", "P1392"]}, {"id": "P1391", "text": [], "jumps": ["P1390", "P1400"]}, {"id": "P1392", "text": ["C2 discharging places a negative voltage on the base of Q1, turning it OFF."], "jumps": ["P1390"]}, {"id": "P1393", "text": ["When Q2 is ON C2 is charging through R3...................."], "jumps": ["P1390"]}, {"id": "P1400", "text": ["When Q1 is ON, how does Q2 turn ON?........................"], "jumps": ["P1390", "P1402"]}, {"id": "P1401", "text": [], "jumps": ["P1400", "P1410"]}, {"id": "P1402", "text": ["When Q1 is ON C1 has no effect on the circuit. C1 is charging and will eventually turn ON Q2."], "jumps": ["P1400"]}, {"id": "P1410", "text": ["When Q2 turns ON, what turns Q1 OFF?......................."], "jumps": ["P1400", "P1412"]}, {"id": "P1411", "text": [], "jumps": ["P1410", "P1420"]}, {"id": "P1412", "text": ["With Q2 turned on C1 has no effect on the circuit.........."], "jumps": ["P1410"]}, {"id": "P1420", "text": ["Normal operation of an astable multivibrator is checked by measuring the output frequency with an oscilloscope or frequency counter."], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["= = 10 kHz", "The frequency of a multivibrator can be calculated using the below formula.ge paths of C1 and C2."], "jumps": ["P1420", "P1440"]}, {"id": "P1440", "text": ["= = 10 kHzzzzzzzzzzzzzzzzzzzz", "1 TTTTTTTTTTTTTTTTTTTTTT x [(C1 x R2) + (C2 x R3)]]]]", "You'll note the two time constants are added since each controls only half of the duty cycle time. The fractional .7 is in place as the transistor will begin conduction prior to the completion of one time constant..."], "jumps": ["P1420", "P1450"]}, {"id": "P1450", "text": ["The remaining portion of the formula is the standard formula for converting time to frequency..."], "jumps": ["P1580", "P1440"]}, {"id": "P1580", "text": ["= = 10 kHzzzzzzzzzzzzzzzzzzzz", "1 TTTTTTTTTTTTTTTTTTTTTT x [(C1 x R2) + (C2 x R3)]]]]", "For example, the frequency of this astable multivibrator is 1.43 kHz. T = .7 x [(C1 x R2) + (C2 x R3)]"], "jumps": ["P1590", "P1440", "P1585"]}, {"id": "P1585", "text": ["T = .7 [(C1 x R2) + (C2 x R3)] = .7 [(.005", "F x 100 kW)] = .7 (.5msec + .5 msec) = .7 (1msec) = .7 mseccccccccccccccccccccccccccccccccc x R2) + .7 x (C2 x R3)]", "F = = 10 kHzzzzzzzzzzzzzzzzzzzz", "1 TTTTTTTTTTTTTTTTTTTTTT x [(C1 x R2) + (C2 x R3)]]]]", "F = = 1.43 kHz zzz", "1 .7 msecTTTTTTTTTTTTTTT x [(C1 x R2) + (C2 x R3)]]]]"], "jumps": []}, {"id": "P1590", "text": ["What is the frequency of this multivibrator? Round to one decimal place.) in a variable.able.le."], "jumps": ["P1580", "P1592", "P1595"]}, {"id": "P1591", "text": [], "jumps": ["P1590", "P1600"]}, {"id": "P1592", "text": ["T = .7 [(C1 x R2) + (C2 x R3)] = .7 [(.001", "F x 50 kW)] = .7 (.05 msec + .05 msec) = .7 (.10 msec) = .07 msecccccccccccccccccccccccccccc x R2) + .7 x (C2 x R3)]", "F = = 10 kHzzzzzzzzzzzzzzzzzzzz", "1 TTTTTTTTTTTTTTTTTTTTTT x [(C1 x R2) + (C2 x R3)]]]]", "F = = ? zzz", "1 .07 msecTTTTTTTTTTTTT x [(C1 x R2) + (C2 x R3)]]]]", "Your answer is incorrect. Use this formula to find the frequency........"], "jumps": ["P1590"]}, {"id": "P1595", "text": ["= = 10 kHzzzzzzzzzzzzzzzzzzzz", "1 TTTTTTTTTTTTTTTTTTTTTT x [(C1 x R2) + (C2 x R3)]]]]", "SOLVING FOR FREQUENCY - To solve for frequency use this formula: T = .7 x [(C1 x R2) + (C2 x R3)]"], "jumps": []}, {"id": "P1597", "text": ["Your answer is still incorrect. You should have measured approximately 14 to 14.4 kHz."], "jumps": ["P1590"]}, {"id": "P1600", "text": ["There are many variations of this typical astable multivibrator. However, they all operate the same."], "jumps": ["P1610", "P1590"]}, {"id": "P1610", "text": ["In this astable multivibrator, R5 is used to adjust the symmetry of the output waveform."], "jumps": ["P1620", "P1600"]}, {"id": "P1620", "text": ["Since C1,R2 and C2,R3 are not exactly the same value the output signal is not symmetrical. The output is asymmetrical..."], "jumps": ["P1627", "P1610", "P1630"]}, {"id": "P1621", "text": ["Since C1,R2 and C2,R3 are not exactly the same value the output signal is not symmetrical. The output is asymmetrical..."], "jumps": ["P1630", "P1610", "P1627"]}, {"id": "P1625", "text": ["SYMMETRICAL - Symmetrical is having the time of the positive peak equal to the time of the negative peak."], "jumps": []}, {"id": "P1626", "text": ["ASYMMETRICAL - Asymmetrical is having the time of the positive peak not equaling the time of the negative peak."], "jumps": []}, {"id": "P1627", "text": ["DIFFERENT VALUE COMPONENTS - Remember, the multivibrator started operation because the values were not the same."], "jumps": ["P1628", "P1621"]}, {"id": "P1628", "text": ["DIFFERENT VALUE COMPONENTS - Since the capacitor and resistor values are not exactly the same, the RC time constant will not be equal."], "jumps": ["P1627", "P1621"]}, {"id": "P1630", "text": ["R5 is used to adjust the resistance of R2 and R3 to compensate for any differences in the values of the discharge path for C1 and C2."], "jumps": ["P1621", "P1640"]}, {"id": "P1640", "text": ["The added resistance must be used when calculating the frequency."], "jumps": ["P1621", "P1650"]}, {"id": "P1650", "text": ["This variation allows for the frequency to be changed......"], "jumps": ["P1660", "P1621"]}, {"id": "P1660", "text": ["R5 adds the same amount of resistance to both R2 and R3. Thus changing the frequency."], "jumps": ["P1650", "P1670"]}, {"id": "P1670", "text": ["The added resistance must be used when calculating the frequency."], "jumps": ["P1650", "P1680"]}, {"id": "P1680", "text": ["This variation ensures that the output waveform has sharp rise times."], "jumps": ["P1690", "P1650"]}, {"id": "P1690", "text": ["Diodes D1 and D2 isolate the capacitor from the output to prevent slow rise times."], "jumps": ["P1680", "P1700"]}, {"id": "P1700", "text": ["Remember, the operation is always based on the charging and discharging of the capacitors used in the RC circuits and the cross coupling of the inputs and outputs.."], "jumps": ["P1910", "P1680"]}, {"id": "P1910", "text": ["This completes the information on ASTABLE MULTIVIBRATOR...."], "jumps": ["P1700", "P1001"]}, {"id": "P1920", "text": ["1. Astable multivibrators are free running and change the DC operating voltage into a square wave output."], "jumps": ["P1001", "P1930"]}, {"id": "P1930", "text": ["2. R1 is the collector load resistor and R3 is the base bias resistor for Q1.."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. R2 is the base bias resistor and R4 is the collector load resistor for Q2."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. When Q1 is ON the collector is 0 V and C1 begins charging through R2...."], "jumps": ["P1960", "P1930"]}, {"id": "P1960", "text": ["5. After Q2 triggers the collector goes to 0 V. C2 discharges, turning OFF Q1. C2 begins charging through R3. When the base voltage of Q1 common to C2/R3 reaches .6 V Q1 turns ON and the cycle reverses...................."], "jumps": ["P1999", "P1950"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu..."], "jumps": ["P1950", "P1001"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2015", "text": ["The purpose of this experiment is to demonstrate the operation of astable multivibrators.", "Pick up the PC130-44 card. This card demonstrates the operation of astable multivibrators."], "jumps": ["P2001", "P2020", "P2030", "P2015"]}, {"id": "P2030", "text": ["Compare the components on PC130-44 to the schematic shown."], "jumps": ["P2020", "P2040"]}, {"id": "P2040", "text": ["Note that both a frequency control (R5) and a symmetry control (R6) is used."], "jumps": ["P2020", "P2050"]}, {"id": "P2050", "text": ["Also note that the diodes D1 and D3 are used to ensure sharp rise times on the output."], "jumps": ["P2020", "P2060"]}, {"id": "P2060", "text": ["C1, C2, R2, R4 and D2 are used to apply an external synchronizing pulse. S1 disconnects the input."], "jumps": ["P2020", "P2070"]}, {"id": "P2070", "text": ["This circuit is used to input pulses at a precise frequency to force the multivibrator operation. This will not be used in this lesson."], "jumps": ["P2020", "P2080"]}, {"id": "P2080", "text": ["Let's start the experiment..lesson. Let's start the experiment."], "jumps": ["P2020", "P2090"]}, {"id": "P2090", "text": ["1. Set the Test Console controls to their initial control settings........"], "jumps": ["P2020"]}, {"id": "P2100", "text": ["2. Carefully plug PC130-44 into the Test Console PC1 position. ternal program = SCAN PWR 0 1 External program = SCAN FCC 0eaker switch to ON........................................."], "jumps": ["P2090"]}, {"id": "P2110", "text": ["3. Place S1 on PC130-44 to the OUT position. 4. Rotate R5 on PC130-44 fully CW. 5. Rotate R6 on PC130-44 ,EK'5@P=;''aaaT55 5GT;aA9AAOA;AA;AA:;Aa'"], "jumps": ["P2415", "P2370", "P2420"]}, {"id": "P2415", "text": ["OSCILLOSCOPE LEAD PLACEMENT - Connect oscilloscope CH2 probe to TP5."], "jumps": []}, {"id": "P2420", "text": ["You will note the action of C4 is identical to C3 except C4 discharges when Q2 turns ON. The action occurs during the other half of the output cycle."], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["When Q2 turns ON, C4 discharges forcing the base of Q1 negative. The negative voltage turns OFF Q1."], "jumps": ["P2410", "P2440"]}, {"id": "P2440", "text": ["C4 begins to charge toward +12 V through R5, R6, and R8 from about -12 V. When the potential reaches +.6 V, Q1 turns ON, pulling the collector to ground. This causes a negative charge to appear at C3, pulling the base of Q2 below the level needed for conduction and Q2 is turned OFF."], "jumps": ["P2410", "P2450"]}, {"id": "P2450", "text": ["4. Remove CH2 probe and set the oscilloscope to display CH1 only."], "jumps": ["P2410", "P2460"]}, {"id": "P2460", "text": ["Last, you will see the condition of an astable multivibrator in LOCK UP."], "jumps": ["P2450", "P2470"]}, {"id": "P2470", "text": ["Lock up occurs when power is first applied to the multivibrator and Q1 and Q2 turn ON at exactly the same time."], "jumps": ["P2460", "P2480"]}, {"id": "P2480", "text": ["1. Set the PC1 DC switch to OFF..........................................."], "jumps": ["P2470"]}, {"id": "P2490", "text": ["2. Rotate R5 and R6 fully CCW. 3. Ensure that oscilloscope is connected to PC130-44 TP9 and set to DC coupling for CH1 display only.."], "jumps": ["P2495", "P2480", "P2500"]}, {"id": "P2495", "text": ["MEASUREMENT SETUP - Connect oscilloscope CH1 probe to TP9. Set oscilloscope to DC coupling, CH1 only. Rotate R5 fully CCW."], "jumps": []}, {"id": "P2500", "text": ["4. Turn PC1 DC Power switch to ON........................................."], "jumps": ["P2490"]}, {"id": "P2510", "text": ["Notice that the output on PC130-44 TP9 is 0 V. Q2 is ON all the time. 5. Move CH1 probe to PC130-44 TP3.."], "jumps": ["P2515", "P2500", "P2520"]}, {"id": "P2515", "text": ["MEASUREMENT SETUP - Connect oscilloscope CH1 probe to TP3."], "jumps": []}, {"id": "P2520", "text": ["If waveform does not appear on the oscilloscope, rotate R6 a very small amount in either direction.....................", "Notice that the output on PC130-44 TP3 is 0 V. Q1 is ON all the time. 6. Rotate R5 CW until an asymmetrical waveform appears on the screen. If the square wave does not appear on the oscilloscope, rotate R6 a very the small amount in either direction."], "jumps": ["P2525", "P2510", "P2530"]}, {"id": "P2525", "text": [], "jumps": []}, {"id": "P2530", "text": ["7. Rotate R5 back to fully CCW. The multivibrator will probably still operate. Lock up usually occurs only at intial power up and only when the settings are set to the extreme limits."], "jumps": ["P2540", "P2520"]}, {"id": "P2540", "text": ["1. Return the Test Console controls to the initial control settings......."], "jumps": ["P2530"]}, {"id": "P2550", "text": ["2. Set the Test Console Power to OFF.0000000000000000000000000000000000"], "jumps": ["P2540"]}, {"id": "P2560", "text": ["3. Disconnect all test equipment. 4. Carefully remove PC130-44 card. 5. Return all equipment to its proper storage area..."], "jumps": ["P2550", "P2910"]}, {"id": "P2910", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "This completes the experiment on ASTABLE MULTIVIBRATOR....."], "jumps": ["P2001"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P1  C4 discharges f The voltage is felt on the base of Q1 which turns it OFF.", "When Q2 turns ON, C4 discharges forcing the base of Q1 negative. The negative voltage turns OFF Q1................................."], "jumps": ["P13410", "P13440"]}, {"id": "P13440", "text": ["C4 begins to charge toward +12 V throu, at +.6 V, Q1 is turned back ON and Q2 is turned OFF.", "C4 begins to charge toward +12 V through R5, R6, and R8 from about -12 V. When the potential reaches +.6 V, Q1 turns ON, pulling the collector to ground. This causes a negative charge to appear at C3, pulling the base of Q2 below the level needed for conduction and Q2 is turned OFF."], "jumps": ["P13410", "P13450"]}, {"id": "P13450", "text": ["4. Remove CH2 probe and set the oscilloscope to display CH1 only."], "jumps": ["P13410", "P13460"]}, {"id": "P13460", "text": ["Last, you will see the condition of an astable multivibrator in LOCK UP."], "jumps": ["P13450", "P13470"]}, {"id": "P13470", "text": ["Lock up occurs when power is first applied to the multivibrator and Q1 and Q2 turn ON at exactly the same time."], "jumps": ["P13460", "P13480"]}, {"id": "P13480", "text": ["1. Press Enter to Set: PC1 DC Power Switch - OFF ...................."], "jumps": ["P13470"]}, {"id": "P13490", "text": ["2. Rotate R5 and R6 fully CCW. 3. Ensure that oscilloscope is connected to PC130-44 TP9 and set to DC coupling for CH1 display only."], "jumps": ["P13495", "P13480", "P13500"]}, {"id": "P13495", "text": ["MEASUREMENT SETUP - Connect oscilloscope CH1 probe to TP9. Set oscilloscope to DC coupling, CH1 only. Rotate R5 fully CCW."], "jumps": []}, {"id": "P13500", "text": ["4. Press Enter to Set: PC1 DC Power Switch - ON ........................."], "jumps": ["P13490"]}, {"id": "P13510", "text": ["Notice that the output on PC130-44 TP9 is 0 V. Q2 is ON all the time. 5. Move CH1 probe to PC130-44 TP3."], "jumps": ["P13515", "P13500", "P13520"]}, {"id": "P13515", "text": ["MEASUREMENT SETUP - Connect oscilloscope CH1 probe to TP3."], "jumps": []}, {"id": "P13520", "text": ["If waveform does not appear on the oscilloscope, rotate R6 a very small amount in either direction.....................", "Notice that the output on PC130-44 TP3 is 0 V. Q1 is ON all the time. 6. Rotate R5 CW until an asymmetrical waveform appears on the screen. NOTE If the square wave does not appear on the oscilloscope, rotate R6 a very the small amount in either direction."], "jumps": ["P13525", "P13510", "P13530"]}, {"id": "P13525", "text": [], "jumps": []}, {"id": "P13530", "text": ["7. Rotate R5 back to fully CCW. The multivibrator will probably still operate. Lock up usually occurs only at intial power up and only when the settings are set to the extreme limits."], "jumps": ["P13520"]}, {"id": "P13550", "text": ["1. Set the Test Console Power to OFF...F.FF................................."], "jumps": []}, {"id": "P13560", "text": ["2. Disconnect all test equipment. 3. Carefully remove PC130-44 card. 4. Return all equipment to its proper storage area..."], "jumps": ["P13910", "P13550"]}, {"id": "P13910", "text": ["This completes the experiment on ASTABLE MULTIVIBRATOR....."], "jumps": ["P2001"]}, {"id": "P14015", "text": ["The purpose of this experiment is to demonstrate the operation of astable multivibrators.", "Pick up the PC130-44 card. This card demonstrates the operation of astable multivibrators."], "jumps": ["P2001", "P14020", "P14030", "P14015"]}, {"id": "P14030", "text": ["Compare the components on PC130-44 to the schematic shown."], "jumps": ["P14020", "P14040"]}, {"id": "P14040", "text": ["Once that both a frequency control (R5) and a symmetry control (R6) are used."], "jumps": ["P14020", "P14050"]}, {"id": "P14050", "text": ["Also note that the diodes D1 and D3 are used to ensure sharp rise times on the output."], "jumps": ["P13020", "P14060"]}, {"id": "P14060", "text": ["C1, C2, R2, R4 and D2 are used to apply an external synchronizing pulse. S1 disconnects the input."], "jumps": ["P14020", "P14070"]}, {"id": "P14070", "text": ["This circuit is used to input pulses at a precise frequency to force the multivibrator operation. This will not be used in this lesson."], "jumps": ["P14020", "P14080"]}, {"id": "P14080", "text": ["Let's start the experiment.son. Let's start the experiment."], "jumps": ["P14020", "P14090"]}, {"id": "P14090", "text": ["1. Set the Test Console controls to their initial control settings........"], "jumps": ["P14020"]}, {"id": "P14100", "text": ["2. Carefully plug PC130-44 into the Test Console position.ion."], "jumps": ["P14090", "P14110"]}, {"id": "P14110", "text": ["3. Place S1 on PC130-44 to the OUT position. 4. Rotate R5 on PC130-44 fully CW. 5. Rotate R6 on PC130-44 to mid position. Arrow pointing UP..."], "jumps": ["P14115", "P14100", "P14120"]}, {"id": "P14115", "text": ["MEASUREMENT SETUP - S1 to OUT (down). R5 with arrow pointing fully CW. R6 with arrow pointing up."], "jumps": []}, {"id": "P14120", "text": ["6. Press Enter to Set: Supply Voltage - 12age - 12......................."], "jumps": ["P14110"]}, {"id": "P14130", "text": ["7. Press Enter to Set: DC Power Switch - ON ON..........................."], "jumps": ["P14120"]}, {"id": "P14140", "text": ["8. Connect an oscilloscope to PC130-44 TP3. Set the oscilloscope coupling to AC."], "jumps": ["P14145", "P14130", "P14150"]}, {"id": "P14145", "text": ["MEASUREMENT SETUP - Connect oscilloscope CH1 probe to TP3. Set oscilloscope coupling to AC.O"], "jumps": []}, {"id": "P14150", "text": ["\u0000\u0000\u0000correct\u00001\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000[\u0001\u000f\u0000\u0000\u0000 \u0000\u0003\u0000Yes\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000d\u0001\u0000\u0000\u0000\u0001\u00b0\u0003\u0012\u0002q\u0001\u0010\u0000\u0000\u0000 ble multivibrator in LOCK UP."], "jumps": ["P14450", "P14470"]}, {"id": "P14470", "text": ["Lock up occurs when power is first applied to the multivibrator and Q1 and Q2 turn ON at exactly the same time."], "jumps": ["P14460", "P14480"]}, {"id": "P14480", "text": ["1. Press Enter to Set: DC Power Switch - OFF ...................."], "jumps": ["P14470"]}, {"id": "P14490", "text": ["2. Rotate R5 and R6 fully CCW. 3. Ensure that oscilloscope is connected to PC130-44 TP9 and set to DC coupling for CH1 display only."], "jumps": ["P14495", "P14480", "P14500"]}, {"id": "P14495", "text": ["MEASUREMENT SETUP - Connect oscilloscope CH1 probe to TP9. Set oscilloscope to DC coupling, CH1 only. Rotate R5 fully CCW."], "jumps": []}, {"id": "P14500", "text": ["4. Press Enter to Set: DC Power Switch - ON N ........................."], "jumps": ["P14490"]}, {"id": "P14510", "text": ["Notice that the output on PC130-44 TP9 is 0 V. Q2 is ON all the time. 5. Move CH1 probe to PC130-44 TP3."], "jumps": ["P14515", "P14520"]}, {"id": "P14515", "text": ["MEASUREMENT SETUP - Connect oscilloscope CH1 probe to TP3.Q"], "jumps": []}, {"id": "P14520", "text": ["If a waveform does not appear on the oscilloscope, rotate R6 a very small amount in either direction...................", "Notice that the output on PC130-44 TP3 is 0 V. Q1 is ON all the time. 6. Rotate R5 CW until an asymmetrical waveform appears on the screen. TE If the square wave does not appear on the oscilloscope, rotate R6 a very the small amount in either direction."], "jumps": ["P14525", "P14510", "P14530"]}, {"id": "P14525", "text": [], "jumps": []}, {"id": "P14530", "text": ["7. Rotate R5 back to fully CCW. The multivibrator will probably still operate. Lock up usually occurs only at intial power up and only when the settings are set to the extreme limits..."], "jumps": ["P14520"]}, {"id": "P14550", "text": ["1. Set the Test Console Power to OFF.FF.FF................................."], "jumps": []}, {"id": "P14560", "text": [ let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
</body>
</html>
