<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Describe a three phase power system. w Describe some definitions associated with Three Phase Power Systems. w Determine line and phase currents and voltages. w Discuss some advantages of Three Phase systems over Single Phase systems. w Discuss Three Phase Power system connections (WYE and Delta)."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about three phase power."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["You will learn some of the advantages obtained by using a three phase power distribution system. 3-Phase Power System Advantages 1. Efficient 2. Smaller & Lighter 3. Smoother Signal 4. Flexible", "1. Efficient 2. Smaller and Lighter 3. Smoother Signal 4. Flexible", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["You will see how 3-phase distribution systems are connected. WYE 2. DELTA"], "jumps": ["P440", "P410"]}, {"id": "P440", "text": ["Let's begin the lesson on THREE PHASE POWER..............................."], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["An AC generator produces AC electricity from a mechanical input."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["An AC generator is frequently called an alternator."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["A single phase alternator physically resembles a single phase AC motor."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Notice that a single AC waveform is generated.............."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["A three phase alternator generates three separate AC signals."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": [], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["Since there are three signals separated by 120", ", the entire output of the generator translates to 360", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["What is the phase difference between waveforms of a 3-phase alternator?"], "jumps": ["P1080"]}, {"id": "P1091", "text": [], "jumps": []}, {"id": "P1092", "text": ["phase shifts because one complete rotor cycle equals 360", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."], "jumps": []}, {"id": "P1093", "text": ["TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF.", "A three phase signal is separated by 120", ", the entire output of the generator translates to 360", "phase difference. . Complete Revolution 3 x 120 = 360"], "jumps": []}, {"id": "P1100", "text": ["TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF.", "Three phase power systems are more popular than single phase systems. They are more efficient for a given load requirement. 3-Phase Power System Advantages 1. Efficient"], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["Three phase motors are smaller and lighter than single phase motors of equal power. 1. Efficient 2. Smaller & Lighter"], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["Energy flow, in a three phase motor, is smoother than in a single phase system. 2. Smaller & Lighter 3. Smoother Signal"], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["Three phase power systems allow much more flexibility than single phase systems. 3. Smoother Signal 4. Flexible"], "jumps": ["P1140", "P1100"]}, {"id": "P1140", "text": ["By using only one waveform of a three phase alternator, you have produced a single phase output."], "jumps": ["P1150", "P1100"]}, {"id": "P1150", "text": ["Which type of alternator is more efficient?................"], "jumps": ["P1100"]}, {"id": "P1151", "text": [], "jumps": []}, {"id": "P1152", "text": ["A single phase alternator uses massive, bulky windings to generate a lot of power on one waveform. A 3-phase system requires much smaller windings.", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."], "jumps": []}, {"id": "P1153", "text": ["A double or 2-phase alternator would be more efficient than a single phase but not as efficient as a 3-phase.", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."], "jumps": []}, {"id": "P1160", "text": ["In order to understand many of the terms used in 3-phase power distribution systems, you must first know how the alternator windings are connected. 1. WYE 2. DELTA"], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["Three phase systems are usually WYE connected for military applications. 1. WYE"], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["The term \"WYE\" is derived from the shape of the connection."], "jumps": ["P1190", "P1160"]}, {"id": "P1190", "text": ["One lead of each armature winding is connected together to a common or neutral line, which is usually grounded."], "jumps": ["P1200", "P1160"]}, {"id": "P1200", "text": ["The other three leads are called \"Phase Voltages\", labeled A, B and C."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["Since each phase has a common ground (neutral), any one phase can be used to power single-phase loads."], "jumps": ["P1220", "P1190"]}, {"id": "P1220", "text": ["Most high power transmission lines are 3-phase WYE connected."], "jumps": ["P1230", "P1190"]}, {"id": "P1230", "text": ["Your home appliances run on single phase AC................"], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["LINE VOLTAGE, is the voltage between any two phases: A to B, B to C and C to A."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["There is a simple conversion between line voltages and phase voltage. WYE Connection Line Voltage = Phase Voltage x 1.73 Line Current = Phase Current", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["Tracing current paths, one can see that line current is the same as phase current."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["The second type of 3-phase power connection is called the \"DELTA\" connection. 1. WYE 2. DELTA"], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["Notice that a DELTA connection has no neutral and also uses only three wires."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["For a DELTA connection, one end of two armature coils are connected together and the output is taken across any one phase. Va = Phase C Line Ra A Rc Vc = Phase Line"], "jumps": ["P1300", "P1270"]}, {"id": "P1300", "text": ["In the DELTA connection, line voltage and phase voltage are equal."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["In a DELTA connection, it is the currents which are out of phase and there is a conversion factor. Delta Connection Line Voltage = Phase Voltage Line Current = 1.73 x Phase Current", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."], "jumps": ["P1320", "P1290"]}, {"id": "P1320", "text": ["In most cases, the WYE connected transformers are used. So this is where the majority of our discussion will be focused. A Neutral B C"], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["For a WYE connected system, the line voltage is found to be 208 V. What is the phase voltage?"], "jumps": ["P1320"]}, {"id": "P1331", "text": [], "jumps": []}, {"id": "P1332", "text": ["For a WYE connected power system, line voltage and phase voltage share the formula:"], "jumps": []}, {"id": "P1340", "text": ["Most WYE connected systems utilize balanced WYE connected loads. A Phase V Ra = Ia = Ib = Ic Neutral Phase R V Phase = Va = Vb = Vc Rb Rc", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["Balanced means the resistor values are the same. This implies the voltage across each phase resistor is equal. R = Ra = Rb = Rc"], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["Since current is determined by phase voltage and resistance, line current will equal phase current. Any difference results in neutral current. Phase V = Ia = Ib = Ic Phase R R = Ra = Rb = Rc"], "jumps": ["P1370", "P1340"]}, {"id": "P1370", "text": ["This means that a balanced load represents a safe circuit."], "jumps": ["P1910", "P1340"]}, {"id": "P1910", "text": ["This completes the information on THREE PHASE POWER........"], "jumps": ["P1001", "P1340"]}, {"id": "P1920", "text": ["1. A three phase generator (also called alternator) produces 3 AC waveforms separated by 120 electrical degrees."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. 3-phase power systems incorporate advantages over single phase systems. wer System Advantages 1. Efficient 2. Smaller & Lighter 3. Smoother Signal 4. Flexible", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF.", "1. Efficient 2. Smaller and Lighter 3. Smoother Signal 4. Flexible"], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. 3-phase power systems can be connected in two distinct ways. A"], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. A WYE connection produces three phase voltages sharing a common ground. Line voltage is the potential between any two phases."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. Line voltage and phase voltage differ by a factor of 1.73. Line and phase currents are the same. ction Line Voltage = Phase Voltage x 1.73 Line Current = Phase Current", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."] let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
