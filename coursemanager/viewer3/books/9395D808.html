const book = {"title": "9395D808", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: CENTRAL ANNOUNCING SYSTEMsd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": ["# #\" #& \"\"# &\"###2' &2#&.22&# 25--283-.#285255232/238882-.-5:38832222882282-213:22::82-22225:8-33-22282232.22258558.5822385:235:222283538::2585582::2:", "&&#&# #/2.#.& -8 \"#.-&23..22'/.#212&-2258\"588:52", "### ## /# #/&# \" \"/##\"#/&//..#/..&/28.&...&824/&.88-8588..2222858852.28:582228588358282228258.888:825:583.8828::8228828588828583:35558.555.85::88::85588:88:5555::38::85:::5:5:52::85::88::", ":85:855::83:5:5.5:55:855:52.5:5283822242348522...252...2..82/.4..22//2./..##/.8.#&./#&/..##// ##\",##/## #. / /& # ## ## ## ## ## \" #/# ## /# ## #.\" ./ #//###,//.&/#.\"#/.##/./#&/2.&/.../&//....//&2222.2/252.&28.8522582.824828828::255:::5:", "/,,,,,,,,,,,,,/, ,, ,,,,,,6, ,,,6,,, ,,,,,//6//6,,,,/6/,,,/,4/,,/6/4494,,494/6846446/4884664;44;889448489888<8648<<8;44;88988<88948;98<44<;:<44<<8;44<48<<8;48<48<88;48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["1. Central Announcing Systemr objective 1 line item 2 here. item 2 here.e.e.", "w Explain the purpose of the central announcing system. w Describe the components of the central announcing system. w Explain the operation of the microphone control station. w Explain the alarms associated with the central announcing system.."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["Central announcing systems are used in dormitories and barracks to pass important information or to make general announcements."], "jumps": ["P300"]}, {"id": "P410", "text": ["Navy ships utilize a central announcing system to transmit voice announcements and alarms throughout the ship."], "jumps": []}, {"id": "P420", "text": ["Let's begin the lesson on the CENTRAL ANNOUNCING SYSTEM..................."], "jumps": []}, {"id": "P900", "text": [], "jumps": ["P420"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The central announcing system (1MC) provides a means of transmitting general orders, information and, alarm signals to various locations simultaneously throughout the ship."], "jumps": ["P1001"]}, {"id": "P1030", "text": ["The 1MC is the primary means of passing information, and alarms throughout the ship, making it a vital means of communication within the ship."], "jumps": []}, {"id": "P1040", "text": ["The central announcing system also provides for inter-ship communications (6MC) during such evolutions as underway replenishment, passing orders to small boats or tugs during restricted maneuvering, and can also be used for ship to shore during mooring operations..."], "jumps": ["P", "PX"]}, {"id": "P1050", "text": ["The central announcing system is a central amplifier type system consisting of up to six microphone control stations, a control rack, power rack(s), up to six speaker groups, alarm contact makers for five different ship's alarms, and visual alarm indicators for high noise environments..."], "jumps": []}, {"id": "P1060", "text": ["Microphone control stations are installed at various locations aboard ship. The stations provide a means of transmitting voice announcements over the 1MC and 6MC circuits.", "XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXJJJ XXX"], "jumps": []}, {"id": "P1070", "text": ["What announcing circuit is used for inter-ship communications?"], "jumps": ["P1060"]}, {"id": "P1071", "text": [], "jumps": []}, {"id": "P1072", "text": ["Inter-ship communications are used during underway replenishment, passing orders to small boats or tugs during restricted maneuvering and ship to shore mooring operations."], "jumps": []}, {"id": "P1080", "text": ["The IC/MSB-2 microphone control station is the most common microphone control station used in the Navy. It is a self-contained, bulkhead-mounted unit with a hinged cover guard."], "jumps": ["P1070", "Pt", "P", "PtdP", "PP"]}, {"id": "P1090", "text": ["The control cabinet is a bulkhead mounted enclosure normally located adjacent to the main IC switchboard. It contains the alarm oscillators, pre-amplifiers, system controls, indicators and external connections..."], "jumps": []}, {"id": "P1100", "text": ["The power rack (power amplifier) is a deck mounted enclosure located adjacent to the control rack. The power amplifiers amplify the voice and alarm signals received from the associated preamplifier in the control rack..."], "jumps": []}, {"id": "P1110", "text": ["Loudspeakers are located in nearly every space throughout the ship and are normally divided into four groups. These loudspeaker groups are designated (1) officers, (2) topside, (3) crew, and (4) engineering. There is also one circuit 6MC loudspeaker group...", "999 V899999999999999", "??hhhIPPPV 99999999999", "?i lh?", "hhPc h9999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999", "999999999999999999999999999999999999999999999999999999999999999h Ph?9999999999", "999 l", "99999999999999899??hPP clV h99999999999999999999999999999999999999", "?lc 999", "i h8998998998998998998998998998999999999", "_iiiiiiiii 77777777777777777777ooooooooo o", "oooocooooooooooooooooooooooo o ooooooooooo"], "jumps": ["P", "PP", "PPPPPP"]}, {"id": "P1120", "text": ["Alarm contact makers are installed at various locations, such as the pilothouse/bridge and quarterdecks, where they are easily accessible to watch standers."], "jumps": ["P"]}, {"id": "P1130", "text": ["Visual alarm indicators are installed in areas where there are high noise levels, such as engineering spaces and hangar decks, to alert personnel when an alarm is being sounded."], "jumps": []}, {"id": "P1140", "text": ["The visual alarm indicator consists of lighting fixtures with red lamps installed in them. The red lamp flashes when the general alarm is sounded, and illuminates steady when the collision or chemical attack alarm is sounded..."], "jumps": []}, {"id": "P1150", "text": ["In the central announcing system (1MC), speakers are normally divided into how many loudspeaker groups?"], "jumps": ["P1140"]}, {"id": "P1151", "text": [], "jumps": []}, {"id": "P1152", "text": ["Nearly every space throughout the ship has a loudspeaker. Loudspeakers are designated officers, topside and crew engineering."], "jumps": []}, {"id": "P1160", "text": ["The microphone control station is the user interface with the system. Let's familiarize ourselves with its operation."], "jumps": ["P1150"]}, {"id": "P1170", "text": ["Each station consists of a detachable microphone with a press-to-talk switch, six loudspeaker group control switches, two busy indicator lights, and a volume indicator meter."], "jumps": []}, {"id": "P1180", "text": ["A magnetic type microphone equipped with an 18-inch cable and a plug is used with the IC/MSB-2 microphone control station. The microphone plugs into a receptacle mounted in the bottom of the station.n"], "jumps": []}, {"id": "P1190", "text": ["A tapered holder, mounted on the front panel of the station, holds the microphone. When using the microphone to transmit, you may remove it from its holder or leave it in the holder."], "jumps": []}, {"id": "P1200", "text": ["There are six loudspeaker selector switches provided on the front panel of the microphone control station. Normally four are designated as 1MC speaker groups. The microphone station in the pilothouse is the only station on which a switch is designated for the 6MC..."], "jumps": []}, {"id": "P1210", "text": ["To make an announcement the operator must first select the desired loudspeaker groups, by turning their respective selector switches to the on position."], "jumps": []}, {"id": "P1220", "text": ["The operator then depresses the press-to-talk (PTT) switch located on the microphone to transmit over the system."], "jumps": ["PTT", "P", "PP"]}, {"id": "P1230", "text": ["Pressing the PTT switch will also illuminate the BUSY 1 (1MC) or BUSY 2 (6MC) light on all stations. These lights indicate the associated circuit is in use, avoiding the possibility of simultaneously initiating another announcement through that circuit..."], "jumps": ["P", "PDFc"]}, {"id": "P1240", "text": ["Except in an emergency, do not attempt to use circuit 1MC when the busy indicator light is lighted. If another microphone control station has already selected a loudspeaker group(s) and is initiating an announcement, the transmission will go out to all loudspeakers selected at both stations.."], "jumps": ["P"]}, {"id": "P1250", "text": ["When talking into the microphone, you should hold the microphone one-half inch from your mouth and speak directly into it in a normal tone of voice.."], "jumps": []}, {"id": "P1260", "text": ["The volume meter indicates the amount of output volume when a transmission is made. When the press-to-talk switch on the microphone is depressed, the meter needle should deflect. During an announcement the meter needle should deflect to 0 dB on peaks for normal volume.."], "jumps": ["P", "PP", "PtB"]}, {"id": "P1270", "text": ["Upon completion of an announcement, make sure the loudspeaker group control switches are returned to the OFF position."], "jumps": []}, {"id": "P1280", "text": ["If any loudspeaker group control switch at the microphone control station is left in the ON position, announcements made from any other control station will go out on those loudspeakers.", "=; YYcYcccccccccccc9c99c99c99999c9999999......", "???eeeP22[iii 6P6666P?P???t?P?DtP2ii2yiiiy"], "jumps": ["P", "PT", "Pwb"]}, {"id": "P1290", "text": ["What is the first step in initiating a 1MC announcement?...", "Turn the power switch to the on position.", "Hold the microphone 1/2\" from the mouth.", "Turn the desired loudspeaker group switch(s) to the on position."], "jumps": ["P1280", "PTT"]}, {"id": "P1291", "text": [], "jumps": []}, {"id": "P1292", "text": ["Before the microphone is used you must select the group that you will speak to."], "jumps": []}, {"id": "P1293", "text": ["There is not a power switch on the microphone control station."], "jumps": []}, {"id": "P1300", "text": ["Normally three alarm contact makers are installed at each microphone control station for the general, chemical, and collision alarms. Additional contact makers may be installed for the flight crash, and unassigned alarms...", "=3333333333333333333333333333333333333, 33=", "3333333333333333333333333333333333333333= ,"], "jumps": ["P1290"]}, {"id": "P1310", "text": ["The alarm contact makers are each color coded to facilitate quick visual identification. The color codes are; collision (green), chemical (yellow), general (red), unassigned (gray), and flight crash (red)..."], "jumps": []}, {"id": "P1320", "text": ["All alarms have priority over voice announcements. Sounding an alarm will override any voice transmission in progress, both busy 1 and busy 2 lights will illuminate steady, and the alarm will be transmitted over all loudspeaker groups..."], "jumps": []}, {"id": "P1330", "text": ["Additionally each alarm associated with the central announcing system is assigned a priority level. Alarms assigned a higher priority level will cutout any alarm with a lower priority level."], "jumps": []}, {"id": "P1340", "text": ["The lowest priority alarm is the flight crash alarm, it is sounded for a pending or actual flight deck emergency. This alarm simulates a wailing siren by a varying frequency every three seconds..."], "jumps": []}, {"id": "P1350", "text": ["The unassigned alarm has the next higher priority. On many ships this is designated as the engineering casualty alarm. It's frequency increases and decreases at a rate of three times per second, creating a jump tone..."], "jumps": []}, {"id": "P1360", "text": ["The general alarm has the third highest priority. This alarm is a striking gong tone that begins loud and gradually decreases repeatedly for 15 seconds."], "jumps": []}, {"id": "P1370", "text": ["The chemical alarm has the second highest priority. This alarm has a continuous tone, through the entire duration of the alarm."], "jumps": ["PR", "P6", "P", "P6P", "PC", "PMMR"]}, {"id": "P1380", "text": ["The collision alarm is assigned the highest priority. It is a series of three pulsating tones followed by a short silence, and then repeated as long as the alarm is activated."], "jumps": []}, {"id": "P1390", "text": ["Which three alarms are normally grouped together at each microphone control station?"], "jumps": ["P1380"]}, {"id": "P1391", "text": [], "jumps": []}, {"id": "P1392", "text": ["Flight crash and unassigned alarm contact makers are additions to those normally installed."], "jumps": []}, {"id": "P1910", "text": ["You have completed the information on CENTRAL ANNOUNCING SYSTEM."], "jumps": ["P1001", "P1390"]}, {"id": "P1920", "text": ["1. The central announcing system is used to transmit general orders, information and, alarm signals to various locations simultaneously throughout the ship."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. The central announcing system is made up of microphone control stations, a control rack, power rack(s), loudspeaker groups, alarm contact makers, and visual alarm indicators."], "jumps": []}, {"id": "P1940", "text": ["3. Prior to making a voice transmission, an operator must first use the loudspeaker group selector switches to select the desired loudspeaker group(s).."], "jumps": []}, {"id": "P1950", "text": ["4. Announcements are made by pressing the PTT switch and speaking directly into the microphone in a normal tone of voice, keeping the microphone one-half inch from your mouth..", "..UUUUUE..7.&.&.&&1&&&&&&&'B'''('KKK(JJ /(///DD", "H.U.........E5E&.&.&5&&&&&:&&&Tq'q'''''('((((((< <///</////", "............E5&.&.1&&&&&&&&&&Be''''''''('(((((JS <///<////N/", "............&1.&.1.&&&&&&&&&&&&TY''''''''''((((((< <////////", "U.....E...E&.1...5&1&.&&&&&&&&&&Y''''''('('((((((< <//D/DND/D", ".U.E.......E5&.&.&..&&&&&&&&'&''''''''((('(J((< S/////", "U...............5&.E5E5E&&&&&&&&&eq&eq'q'q'''''('((((((/J< /////D///"], "jumps": []}, {"id": "P1960", "text": ["5. During an announcement the volume meter needle should deflect to 0 dB on peaks for normal volume..", "B:S uuuFgeuuFFwgFFFFF!!ww&FFFwww#ww!#U##wwwwwYY&&lYY", "wwwEfcwwEEEfEEEEE ||#EEE|||%|| %V%%|||||XX##lXX}}}}}}}XXl__##E##| |%", "mmmmVV!4!!qq!:!!++qx+:!:4444..:g.zgggzk S"], "jumps": ["P"]}, {"id": "P1970", "text": ["6. Ships alarms are assigned a priority relative to it's importance. A higher priority alarm will always override a lower priority alarm and all voice transmissions."], "jumps": []}, {"id": "P1980", "text": ["7. The five alarms associated with the central announcing system in order of precedence from lowest to highest are the flight crash, unassigned, general, chemical, and collision."], "jumps": ["P1999", "P1970"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["Where is the IC/MSB-2 microphone control station that operates the inter-ship announcing system located?"], "jumps": []}, {"id": "P10211", "text": ["The announcement will be heard over both the engineering and the topside loudspeaker groups.", "What would be the result of leaving the topside loudspeaker group selector switch on at the aft quarterdeck microphone control station, and the bridge makes an announcement over the engineering loudspeaker group.", "The announcement will be heard over the only the topside loudspeaker group.", "The announcement will be heard over the only the engineering loudspeaker group.", "The announcement will not be heard on any loudspeaker group."], "jumps": []}, {"id": "P10212", "text": ["Hold the microphone an arms length away, and speak in a loud, clear voice.", "When making a voice announcement over the 1MC you should _______", "Hold the microphone 3 to 4 inches from your mouth and speak in a normal voice.", "Hold the microphone 1/2 inch from your mouth and speak in a normal voice.", "Leave the microphone in the holder, hold your mouth 3 to 4 inches from the microphone and speak in a normal voice."], "jumps": []}, {"id": "P10213", "text": ["What type of microphone is used with the central announcing system?"], "jumps": []}, {"id": "P10214", "text": ["-5 db A choice is d, and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "How far should the volume meter needle deflect during an announcement?"], "jumps": []}, {"id": "P10215", "text": ["Which alarm has a frequency increasing and decreasing at a rate of 3 times per second creating a jump tone?"], "jumps": []}, {"id": "P10216", "text": ["Which alarm has one continuous tone for the entire time in which the alarm is sounded?"], "jumps": []}, {"id": "P10217", "text": ["BUSY 1 indicator on steady, and BUSY 2 indicator flashing.", "What indication is displayed at the microphone control station during an alarm transmission?", "BUSY 1 indicator flashing, and BUSY 2 indicator on steady."], "jumps": []}, {"id": "P10218", "text": ["What will be heard over the 1MC if, vital announcement from damage control central is being made and then the chemical alarm is activated from the pilothouse?", "The alarm signals will both heard with the voice announcement.", "Neither the alarm nor the voice announcement will be heard."], "jumps": []}, {"id": "P10219", "text": ["Where would you find a visual alarm indicator?"], "jumps": []}, {"id": "P10220", "text": ["What color is the collision alarm contact maker painted?"], "jumps": []}, {"id": "P10221", "text": [], "jumps": []}, {"id": "P10222", "text": ["How many alarms are associated with the central announcing system?"], "jumps": []}, {"id": "P10223", "text": ["Fire, Flooding, Flight Crash, Engineering Casualty, Chemical, and Collision.", "What are the alarms associated with the central announcing system in order of priority from lowest to highest?", "Collision, Chemical, General, Unassigned, and Flight Crash.", "General, Chemical, Collision, Flight Crash, and Unassigned, Fire.", "Flight Crash, Unassigned, General, Chemical, and Collision."], "jumps": []}, {"id": "P10224", "text": ["What color is chemical alarm contact maker painted?"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to __________"], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "PINFO", "text": ["03-10-04 Converted from sty file - patty 03-24-04 Completed t", "03-10-04 Converted from sty file - patty 03-24-04 Completed the lesson according to the PowerPoint file. Yu-Chi 04-05-04 Updated the lesson. Mary 04-07-04 Updated the lesson. Yu-Chi 04-14-04 Updated P1220, P1250 and P1950. Yu-Chi"], "jumps": []}, {"id": "PQINFO", "text": ["Page # Test# Question# HelpPage # 10210 1 110 1200 10211 1 111 1280 10212 1 112 1250 10213 1 113 1180 10214 1 114 1260 10215 1 115 1350 10216 1 116 1370 10217 1 117 1320 10218 1 118 1320 10219 1 119 1130 10220 1 120 1310 10221 1 121 1340 10222 1 122 1300 10223 1 123 1340 10224 1 124 1310 10225 2 125 30000 10226 2 126 30000 10227 2 127 30000 10228 2 128 30 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
