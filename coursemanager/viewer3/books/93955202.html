const book = {"title": "93955202", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: DC SHUNT FIELD MOTORSdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["1. DC Shunt Field Motor Characteristics", "w Describe the operating characteristics of a DC Shunt Field Motor. w Describe the effects of a load on a DC Shunt Field Motor. w Describe the methods used to control speed in a DC Shunt Field Motor.", "w Verify DC Shunt Field Motor speed control by way of armature and field control techniques. w Measure and calculate Shunt Field circuit parameters for unloaded motor conditions. w Measure and calculate Shunt Field circuit parameters for loaded motor conditions. loaded motor conditions. loaded motor conditions."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "3. Nida Model 280 Rotating Machinery Trainer"], "jumps": []}, {"id": "P301", "text": [], "jumps": []}, {"id": "P330", "text": ["Nida Model 280 Rotating Machinery Trainer"], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P350", "text": [], "jumps": []}, {"id": "P351", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about the DC Shunt Field motor."], "jumps": ["P410", "P301"]}, {"id": "P410", "text": ["You will learn how to calculate many DC shunt field motor circuit values."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["You will perform an experiment that allows hands-on use of the Rotating Machinery Trainer."], "jumps": ["P440", "P410"]}, {"id": "P440", "text": ["Let's begin the lesson on DC SHUNT FIELD MOTORS..........................."], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The DC Shunt Field motor is generally used for industrial applications."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["In this lesson, you will explore the characteristics of this type of motor."], "jumps": ["P1035", "P1020"]}, {"id": "P1035", "text": ["As you know, all motors share certain characteristics......"], "jumps": ["P1038", "P1020"]}, {"id": "P1038", "text": ["Each of these characteristics can be measured or calculated."], "jumps": ["P1040", "P1035"]}, {"id": "P1040", "text": ["Let's begin by calculating torque in a shunt field motor..."], "jumps": ["P1050", "P1035"]}, {"id": "P1050", "text": ["There is a relatively simple formula for calculating the torque of a Shunt motor.", "I = Armature Current I = Field Coil Current K = Physical Characteristics"], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["The equation states that the output torque of a motor is the product of the armature current (I ), field coil current (I ) and the physical characteristics of the field (K)."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["Throughout this lesson and future lessons assume that K has a value of 1. This will simplify calculations."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["Meters depending on the system of measurement used."], "jumps": ["P1400", "P1050"]}, {"id": "P1085", "text": ["Let's examine the effects of the second characteristic of DC shunt field motors, CEMF."], "jumps": ["P1090", "P1510"]}, {"id": "P1090", "text": ["As motor shaft speed increases, CEMF increases. They are directly proportional."], "jumps": ["P1100", "P1085"]}, {"id": "P1095", "text": ["The polarity of an induced electromagnetic force is such that it sets up a current, the magnetic field of which always opposes the change in the existing magnetic field.", "CEMF- CEMF is short for \"Counter Electromotive Force\" and is defined in terms of LENZ'S LAW. CEMF can best be visualized as an opposite polarity battery placed in series to the armature or in parallel to the armature voltage (V ) of a DC shunt field motor."], "jumps": []}, {"id": "P1100", "text": ["CEMF opposes the original applied voltage that induces motor action."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["CEMF acts as another voltage source opposing E .........."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["Because of CEMF, I does not equal the applied voltage divided by the resistance of the armature."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["I equals the applied voltage minus CEMF divided by the resistance of the armature."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["As stated before, measuring CEMF inside the motor is impractical."], "jumps": ["P1520", "P1110"]}, {"id": "P1150", "text": ["Power Out = Speed x Torque x (0.1047) = Ft Lbs Sec (RPM) x (Ft Lbs) x (constant) =nt) ==========", "Output power is equal to speed times torque times the constant (0.1047)."], "jumps": ["P1160", "P1730"]}, {"id": "P1160", "text": ["Speed is easily measured and torque is calculated as before."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["Notice the formulas indicate that speed (RPM) and shaft rotation (Torque) must occur before a motor supplies mechanical power."], "jumps": ["P1183", "P1160"]}, {"id": "P1183", "text": ["What is the output power of this DC Shunt Motor?..........."], "jumps": ["P1170", "P1186"]}, {"id": "P1184", "text": [], "jumps": []}, {"id": "P1185", "text": ["Your answer is incorrect, remember the formula for Output Power is: Power Out = (Torque) (Speed) (0.1047)"], "jumps": []}, {"id": "P1186", "text": ["OUTPUT POWER (W)-To find output power, find torque first: Torque = I x I x K (Assume K = 1) After finding torque, multiply this value times the speed (RPM) and the constant (0.1047): Power Out = (Torque) (Speed) (0.1047)"], "jumps": []}, {"id": "P1190", "text": ["Motor speed and torque are inversely proportional. As a result, only one combination of the two will give maximum output power."], "jumps": ["P1200", "P1183"]}, {"id": "P1200", "text": ["Now, let's see the effects of a load on Power In and Power Out."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["As the load on a motor increases, the speed (RPM) decreases."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["As RPM decreases, CEMF also decreases. This relationship increases Torque as well as I ."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["Since I increases, I increases, power In also increases. Pin = E x I"], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": [], "jumps": ["P1245", "P1220"]}, {"id": "P1245", "text": ["Also, since torque increases (even though RPM decreases), Power out increases. P = (Torque) (Speed) (0.1047) = Ft Lbs/Sec"], "jumps": ["P1250", "P1220"]}, {"id": "P1250", "text": ["You will see the results of increasing a load on power in the experiment."], "jumps": ["P1260", "P1220"]}, {"id": "P1260", "text": ["Remember:iscussion text here...............................", "Increased Load causes: RPM to. . . . . . . . . . . . . . . . . . . . .Decrease CEMF to . . . . . . . . . . . . . . . . . . . Decrease I to . . . . . . . . . . . . . . . . . . . . . . . Increase I & Torque to . . . . . . . . . . . . . . Increase Pin & Pout to . . . . . . . . . . . . . . . Increase"], "jumps": ["P1265", "P1220"]}, {"id": "P1265", "text": ["The last important element of DC shunt motors is speed control."], "jumps": ["P1270", "P1260"]}, {"id": "P1270", "text": ["Varying the applied voltage lowers the current through both the armature and the field, this increases RPM."], "jumps": ["P1280", "P1265"]}, {"id": "P1280", "text": [], "jumps": ["P1290", "P1265"]}, {"id": "P1290", "text": ["Resistors can also be used to lower the current through the field coil."], "jumps": ["P1300", "P1265"]}, {"id": "P1300", "text": ["This will decrease the strength of the field coil, decreasing RPM."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["This method is called shunt field control."], "jumps": ["P1320", "P1290"]}, {"id": "P1320", "text": ["In reference to the schematic, by increasing the resistance of R1, I will decrease. This will cause motor RPM to decrease."], "jumps": ["P1330", "P1290"]}, {"id": "P1330", "text": ["This can be seen by applying Ohms law to the circuit..."], "jumps": ["P1340", "P1290"]}, {"id": "P1340", "text": ["You will see the operation of both types of speed control in the experiment."], "jumps": ["P1350", "P1290"]}, {"id": "P1350", "text": ["What type of speed control is used in this DC Shunt Motor?."], "jumps": ["P1290"]}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1352", "text": ["Armature speed control is used, but how about the use of R1."], "jumps": []}, {"id": "P1353", "text": ["Shunt Field speed control is used, but how about the variable E supply.."], "jumps": []}, {"id": "P1400", "text": ["Calculating torque is accomplished by determining the currents in the armature and field circuits."], "jumps": ["P1410", "P1080"]}, {"id": "P1410", "text": ["One method is to measure current using an ammeter."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["What is torque in this DC Shunt motor?....................."], "jumps": ["P1400"]}, {"id": "P1421", "text": [], "jumps": []}, {"id": "P1422", "text": ["You added I and I . Torque is the product of coil currents."], "jumps": []}, {"id": "P1423", "text": ["You divided I by I . Torque is the product of coil currents.", "Since it is difficult to get inside most motor cases, measuring I and I is normally impractical.."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["An alternate method for determining I and I is to use Ohm's Law and measure applied voltage and total current."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["As you can see, E and I can be easily measured outside the motor."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["The field current can be calculated using the applied voltage and the resistance of the field coil."], "jumps": ["P1470", "P1440"]}, {"id": "P1470", "text": ["The resistance of the field coil is normally given in the motor's specifications. However, you will measure the resistance in the experiment."], "jumps": ["P1480", "P1440"]}, {"id": "P1480", "text": ["Ohm's Law can be applied because the Field Coil has no inductive reactance when DC voltage is applied."], "jumps": ["P1490", "P1440"]}, {"id": "P1490", "text": ["What is I in this DC Shunt motor?........................"], "jumps": ["P1440"]}, {"id": "P1491", "text": [], "jumps": []}, {"id": "P1492", "text": ["Remember Ohm's Law: E I = R................................"], "jumps": []}, {"id": "P1500", "text": ["The only other quantity needed to calculate torque is I . Remember, K is considered to be 1."], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["You would think that I is calculated the same as I . However, because of CEMF, I is calculated differently."], "jumps": ["P1085", "P1500"]}, {"id": "P1520", "text": ["The method used to determine I , at a set RPM, is to subtract I from I ."], "jumps": ["P1530", "P1110"]}, {"id": "P1530", "text": ["Remember, Kirchhoff's current law states that total current equals the sum of the branch currents.", "I = I + I so I = I - IF"], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["What is I in this DC Shunt motor?........................"], "jumps": ["P1530"]}, {"id": "P1541", "text": [], "jumps": []}, {"id": "P1542", "text": ["Remember, Kirchhoff's current law states that total current equals the sum of the branch currents.", "I = I + I so I = I - IF"], "jumps": []}, {"id": "P1550", "text": ["As you have seen, measuring E and I is all that is needed to calculate Torque..", "I = = 0.24A I = I - I = 0.5 - 0.24 = 0.26 Torque = I x I x K = 0.24 x 0.26 x 1 = 0.0624 Ft - lbs . Decrease IA to . . . . . . . . . . . . . . . . . . . . . . . Increase IT & Torque to . . . . . . . . . . . . . . Increase Pin & Pout to . . . . . . . . . . . . . . . Increase"], "jumps": ["P1560", "P1540"]}, {"id": "P1560", "text": ["The last basic characteristic of DC shunt field motors is Speed."], "jumps": ["P1570", "P1550"]}, {"id": "P1570", "text": ["Recall that as speed increases, CEMF increases and torque decreases."], "jumps": ["P1580", "P1560"]}, {"id": "P1580", "text": ["The effect speed has on torque can be easily seen using the DC Shunt Motor schematic."], "jumps": ["P1590", "P1570"]}, {"id": "P1590", "text": ["As speed increases, CEMF increases. As a result, I decreases...."], "jumps": ["P1600", "P1580"]}, {"id": "P1600", "text": ["Torque equals I x I x K. If speed increases then torque decreases due to I decreasing."], "jumps": ["P1610", "P1580"]}, {"id": "P1610", "text": ["In other words, as speed increases, I decreases."], "jumps": ["P1620", "P1580"]}, {"id": "P1620", "text": ["As speed decreases, Torque increases (due to I increasing as CEMF decreases) and I increases."], "jumps": ["P1630", "P1580"]}, {"id": "P1630", "text": ["In a DC shunt motor, I is not affected by changes in speed."], "jumps": ["P1640", "P1580"]}, {"id": "P1640", "text": ["This is why DC Shunt Motors have a higher torque value at faster RPM than Series DC Motors.", "Another factor affecting speed is the LOAD................."], "jumps": ["P1650", "P1580", "P1660", "P1640"]}, {"id": "P1660", "text": ["As a load increases, RPM decreases........................."], "jumps": ["P1670", "P1650"]}, {"id": "P1670", "text": ["As RPM decreases, CEMF decreases, increasing torque."], "jumps": ["P1672", "P1660"]}, {"id": "P1672", "text": ["The only new concept is the effect of a load on RPM. All other relationships remain the same."], "jumps": ["P1675", "P1660"]}, {"id": "P1675", "text": ["You will see the effects of a load on RPM in the experiment."], "jumps": ["P1680", "P1660"]}, {"id": "P1680", "text": ["Now, let's talk about POWER. Remember: wer Out % Efficiency = x 100 Power In", "Efficiency = x 100", "In a DC Shunt Motor, Power In is electrical................"], "jumps": ["P1690", "P1660", "P1700", "P1680"]}, {"id": "P1700", "text": ["Calculating Power In is done by multiplying E times I ."], "jumps": ["P1710", "P1690"]}, {"id": "P1710", "text": ["What is the input power to this DC Shunt Motor?............"], "jumps": ["P1690"]}, {"id": "P1711", "text": [], "jumps": []}, {"id": "P1712", "text": ["Remember, power equals voltage times current...............", "In a DC Shunt Motor, Power Out is mechanical..............."], "jumps": ["P1150", "P1710"]}, {"id": "P1910", "text": ["This completes the information on SHUNT FIELD CHARACTERISTICS."], "jumps": ["P1001", "P1350"]}, {"id": "P1920", "text": ["1. Speed and CEMF are proportional in a DC Shunt Filed motor."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. Torque is inversely proportional to both speed and CEMF."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. Torque can be expressed as the product of the armature and shunt field currents.1", "I = Armature Current I = Field Coil Current K = Physical Characteristics"], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. Torque is calculated by measuring E and I and knowing R ."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["Lbs/Sec. RPM is measurable and torque is calculated by I , I and 0.1047.", "Pout = Speed x Torque x (0.1047) = Ft Lbs/Sec (RPM) x (Ft lbs) x (0.1047) = Ft Lbs/Sec"], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6. Power In can be expressed in the following formula. E and I are measurable."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7. All loaded motors exhibit three fundamental characteristics. acteristics of all Loaded Motors (1) Torque increases and Speed decreases (2) Power Out increases (3) Power Input increases", "Characteristics of all Loaded Motors (1) Torque increases and Speed decreases (2) Power Out increases (3) Power Input increases"], "jumps": ["P1999", "P1970"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["In this experiment you will configure the 280 rotating machinery trainer as a DC Shunt Field motor."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["You will verify Shunt Motor speed regulation by applying Armature control and Field control.U"], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["You will also verify parameters for loaded and unloaded conditions."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["Let's begin the experiment. 1. Set the 280 trainer to it's initial control settings."], "jumps": ["P2070", "P2020", "P22000"]}, {"id": "P2070", "text": ["2. Set the Test Console controls to their initial control settings........"], "jumps": ["P2060"]}, {"id": "P2080", "text": ["3. Insert PC130-280 into the PC3 position on the 130 test console.2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2090"]}, {"id": "P2090", "text": ["4. Connect the 8 pin connector from the PC130-280 card to the PC130-280 connector on the 280 trainer. 80 Trainer 130A Test ConsoleON........................................."], "jumps": ["P2080", "P"]}, {"id": "P2100", "text": ["5. To configure the 280 Trainer as a DC Shunt Field motor, set the switches as follows: Switch Settings OPER/TEST - TEST RUN/STOP - RUN ARM/OFF/VAR - ARM", "YGIH@t7<< ??KJJ|KyLPvS?J|F<=KWjXW?KY}NPOQY?BWKNQ"], "jumps": ["P2090"]}, {"id": "P2110", "text": ["6. Set the test console controls as follows: Filament . . . . . . . ON + Positive Supply . . . . 5 Volts - Negative Supply . . . . 15 Volts", "2. For DC motor operation, press enter to set the 130E Test Console controls as follows: t.......... ON + Power Supply... 24 Volts - Power Supply....15 Volts"], "jumps": []}, {"id": "P2120", "text": ["until the motor starts. This should happen between 7 and", "7. Set PC3 DC Power switch ON and adjust the Positive Supply", "7. Press Enter to set PC3 DC Power - ON", "7. Press Enter to set PC3 DC Power - ON3 DC Power - ONupply 15 VDC.e motor starts. This should happen between 7 and 15 VDC.."], "jumps": ["P2125"]}, {"id": "P2125", "text": ["MEASUREMENT SETUP- Adjust the Positive Supply control until motor action begins. The DC motor should begin spinning between 7 and 15 VDC."], "jumps": []}, {"id": "P2130", "text": ["At this time you have configured the trainer as a Shunt Field motor. The test console serves as the power supply to the motor."], "jumps": ["P2140"]}, {"id": "P2140", "text": ["volts while observing the trainer voltmeter and motor action", "8. Adjust the Positive Supply control while observing the trainer", "8. Vary the Positive power Supply between 5, 12, 15, and 24", "8. Vary the Positive power Supply between 5, 12, 15, and 24 volts while observing the trainer voltmeter and motor actiontionnnnnnn"], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["As the voltage on the voltmeter increased, what happened to motor RPM."], "jumps": ["P2140"]}, {"id": "P2151", "text": [], "jumps": []}, {"id": "P2152", "text": ["The voltage you are reading indicates the input voltage to the motor. As voltage increases, motor speed increases."], "jumps": []}, {"id": "P2160", "text": ["Notice that the motor RPM and input voltage on the voltmeter correlate. This verifies Armature control of a DC Shunt Field motor."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["10. Set the Positive Supply control on the test console to", "9. Press Enter to set PC3 DC Power - OFF", "9. Press Enter to set PC3 DC Power - OFFress Enter to set PC3 DC Power - OFFhe test console to +15 VDC as seen on the voltmeter. . tmeter."], "jumps": ["P2160"]}, {"id": "P2180", "text": ["11. Set the DC motor ARM/OFF/VAR switch to VAR............"], "jumps": ["P2190", "P", "PPORJ", "PRJJJJMSQu"]}, {"id": "P2190", "text": ["12. Press Enter to set PC3 DC Power - ON 13. At this time, the trainer is configured for Shunt Field motor speed control. Vary the field current potentiometer throughout it's range while observing motor action."], "jumps": ["P2180", "P2195"]}, {"id": "P2195", "text": ["SHUNT FIELD POTENTIOMETER- Vary the shunt field potentiometer throughout it's range."], "jumps": []}, {"id": "P2200", "text": ["What type of speed control technique is currently used?...."], "jumps": []}, {"id": "P2201", "text": [], "jumps": []}, {"id": "P2202", "text": ["Armature control is accomplished by varying the input voltage to the armature."], "jumps": []}, {"id": "P2203", "text": ["Series field control is for a series field or compound motor type only."], "jumps": []}, {"id": "P2210", "text": ["You should have observed that increasing the potentiometer resistance decreased or stopped motor RPM. This is because a -15 V offset voltage is applied to the coil. 14. Return the Field Current potentiometer to fully CCW............."], "jumps": ["P2220", "P2200", "P2215"]}, {"id": "P2215", "text": ["SHUNT FIELD CONTROL ON THE 280 TRAINER- When the Arm/Off/Var switch is in the Var position, -15 V is applied to the let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
