const book = {"title": "93953903", "pages": [{"id": "P13040", "text": ["The circuits for the AM receiver are contained on three PC cards, PC130-38, 39 and 40.", "PC130-38 e faulty function, circuit and component.", "PC130-39 e faulty function, circuit and component.", "PC130-40 e faulty function, circuit and component.", "Nida Corporation - AM Receiver Troubleshooting"], "jumps": ["P13050", "P13020"]}, {"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . .", "Title: AM RECEIVER TROUBLESHOOTING fasfd asdf asdf sadf"], "jumps": []}, {"id": "P2200", "text": ["4.  Set the Time/Div control on the oscilloscope to 1 mSec. \n5.  Set the function generator to produce AM modulation of about       50%.\n6.  Select internal modulation of 200 Hz, 400 Hz, or 1 kHz.", "4. Set the Time/Div control on the oscilloscope to 1 mSec. 5. Set the function generator to produce AM modulation of about 50%. 6. Select internal modulation of 200 Hz, 400 Hz, or 1 kHz.odulation frequency and amplitude controls to obtain a modulated RF signal at approximately 200 Hz......"], "jumps": ["P2210", "P2190", "P2205"]}, {"id": "P2220", "text": ["9.  The receiver is now tuned to the function generator output             signal.  For the remainder of the lesson the speaker may be \n     manually turned ON or OFF and the schematics may be \n     viewed by entering Ctrl+S.", "9. The receiver is now tuned to the function generator output signal. For the remainder of the lesson the speaker may be manually turned ON or OFF and the schematics may be viewed by entering Ctrl+S.....g Ctrl+S."], "jumps": ["P2210"]}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 440 Function Generator XXXXXnt"], "jumps": []}, {"id": "P301", "text": ["7. Nida Model 470 Oscilloscope or Equivalent"], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P335", "text": [], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson you will learn about troubleshooting electronic equipment using the AM receiver."], "jumps": ["P410", "P301"]}, {"id": "P410", "text": ["In previous lessons you learned about troubleshooting individual circuits."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["The method for troubleshooting equipment is similar to troubleshooting circuits."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["The only difference in troubleshooting electronic equipment is that you must find which circuit is faulty."], "jumps": ["P440", "P410"]}, {"id": "P440", "text": ["The same troubleshooting skills required to repair an AM receiver are required to repair other electronic equipment no matter how complex."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["Let's begin the lesson on AM RECEIVER TROUBLESHOOTING....................."], "jumps": ["P440"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The same skills that a technician uses to find a faulty circuit in an AM receiver are used to locate faulty circuits in all electronic circuits in all electronic equipment."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["If you learn to approach all equipment failures with the same logical method, you will become a skilled electronic technician."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The method used to troubleshoot electronic equipment is similar to troubleshooting individual circuits.", "TROUBLESHOOTING CHECKLIST 1. Analyze the Circuit 2. Check the Setup 3. Calculate and Measure 4. Check Results"], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The only difference is that the steps must be expanded to include all the circuits in the equipment.", "TROUBLESHOOTING CHECKLIST 1. Analyze the Equipment 2. Check the Setup 3. Calculate and Measure 4. Check Results"], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["Lets start with analyzing the equipment.", "TROUBLESHOOTING CHECKLIST 1. Analyze the Equipment 2. Check the Setup 3. Calculate and Measure 4. Check Results"], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["You must first \"know the equipment\". You cannot tell if the equipment is faulty unless you know what it is supposed to do."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["Then you must identify the symptom. That is, what is the problem."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["This is referred to as symptom recognition. For example, this receiver has no output."], "jumps": ["P1100", "P1070"]}, {"id": "P1100", "text": ["In more complex equipment, such as a TV, the problem could be one or more of the following:"], "jumps": ["P1110", "P1070"]}, {"id": "P1110", "text": ["Be sure to identify ALL symptoms. This is called symptom elaboration. Each symptom gives clues to the faulty function and circuit."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["The next step is to check the setup.", "The next step is to check the setup........................", "TROUBLESHOOTING CHECKLIST 1. Analyze the Equipment 2. Check the Setup 3. Calculate and Measure 4. Check Results"], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["This is when you check all the controls, switches and connections to insure that they are in the proper position or configuration."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["For example, if your symptom is no output, check that the receiver is turned on!"], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["Also (and don't laugh because it is a common fault), check to see if the receiver is plugged in."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["If the receiver is portable, check that the batteries are installed and that they are good."], "jumps": ["P1170", "P1130"]}, {"id": "P1170", "text": ["The next step is to Calculate and Measure.", "The next step is to Calculate and Measure..................", "TROUBLESHOOTING CHECKLIST 1. Analyze the Equipment 2. Check the Setup 3. Calculate and Measure 4. Check Results"], "jumps": ["P1180", "P1130"]}, {"id": "P1180", "text": ["Until now, all the troubleshooting steps have been limited to controls, switches and connections."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["Now test equipment is used to isolate the problem down to the faulty component."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["The Calculate and Measure step is divided into three parts. This is the difference between troubleshooting circuits and electronic equipment.", "First, determine the faulty function using a functional diagram and test equipment.", "A. Identify faulty function. B. Identify faulty circuit. C. Identify faulty component."], "jumps": ["P1210", "P1180", "P1220", "P1200"]}, {"id": "P1220", "text": ["For example in an AM receiver, connect a known modulated RF signal to the tuner.", "Then check the input and output signals of each functional block using an oscilloscope and compare to expected or calculated values."], "jumps": ["P1230", "P1210", "P1240"]}, {"id": "P1240", "text": ["The point where the input to a block is correct and output is incorrect identifies the faulty block."], "jumps": ["P1250", "P1210"]}, {"id": "P1250", "text": ["The procedure to follow for identifying the faulty function is to start in the middle of the functional diagram."], "jumps": ["P1260", "P1210"]}, {"id": "P1260", "text": ["If the signal is incorrect, the problem is before this point, in the tuner or IF amplifier."], "jumps": ["P1270", "P1210"]}, {"id": "P1270", "text": ["If the signal is correct, the problem is after this point, in the detector or AF amplifier."], "jumps": ["P1280", "P1210"]}, {"id": "P1280", "text": ["Continue halving the block diagram until the faulty circuit is isolated.", "Once the faulty function has been isolated, use schematics and test equipment to determine the faulty circuit."], "jumps": ["P1290", "P1210", "P1300"]}, {"id": "P1300", "text": ["For example, there are three circuits in the AF amplifier block."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["Use an oscilloscope to determine the faulty circuit by measuring the input and output signals of each circuit."], "jumps": ["P1320", "P1290"]}, {"id": "P1320", "text": ["Start by measuring signals in the middle of the diagram."], "jumps": ["P1325", "P1290"]}, {"id": "P1325", "text": ["If the signal at TP22 is correct, then the fault is in the audio push-pull amplifier circuit."], "jumps": ["P1330", "P1290"]}, {"id": "P1330", "text": ["If the signal at TP22 is incorrect, then the fault is in the audio preamplifier or audio driver."], "jumps": ["P1340", "P1290"]}, {"id": "P1340", "text": ["Measuring the signal at TP21 will isolate the fault to the circuit."], "jumps": ["P1350", "P1290"]}, {"id": "P1350", "text": ["Once the faulty circuit is isolated, determine the faulty component."], "jumps": ["P1360", "P1290"]}, {"id": "P1360", "text": ["Use an oscilloscope or multimeter and troubleshoot the circuit as a standard common emitter amplifier circuit."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["The last step is to check results.", "The last step is to check results..........................", "TROUBLESHOOTING CHECKLIST 1. Analyze the Equipment 2. Check the Setup 3. Calculate and Measure 4. Check Results"], "jumps": ["P1380", "P1350"]}, {"id": "P1380", "text": ["Always check to see if the suspected faulty component can cause all the symptoms identified in step 1."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["If so, replace the component and repeat step1 (analyze equipment) to ensure that the receiver is functioning correctly."], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["If the suspected faulty component can not cause the symptom, or all of the symptoms, further troubleshooting is required."], "jumps": ["P1410", "P1380"]}, {"id": "P1410", "text": ["If the suspected component could not cause the symptom, repeat step 3, Calculate and measure."], "jumps": ["P1420", "P1380"]}, {"id": "P1420", "text": ["If some of the symptoms still remain there is another fault present. Repair the first fault and repeat steps 1 through 4 for other faults."], "jumps": ["P1430", "P1380"]}, {"id": "P1430", "text": ["Finding faulty components is easy no matter how complex the equipment is, if you use the four step troubleshooting method."], "jumps": ["P1440", "P1380"]}, {"id": "P1440", "text": ["In the following series of questions, assume that an AM receiver has a weak output (low volume for all stations, step 1 - analyze equipment) and that all controls, switches and connections are correct (step 2 - check setup).", "In the following series of questions, assume that an AM receiver has a weak output (low volume for all stations, step 1 - analyze equipment) and that all controls, switches and connections are correct (step 2 - check setup)..."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["After connecting a known RF input into the tuner, you first measure the signal between the _______."], "jumps": ["P1440"]}, {"id": "P1451", "text": [], "jumps": []}, {"id": "P1452", "text": ["Measuring a correct signal at this point would indicate the fault is in the IF Amp, detector or AF Amp (tuner OK). This does not divide the receiver in half."], "jumps": []}, {"id": "P1453", "text": ["Measuring an incorrect signal at this point would indicate the fault is in the tuner, IF amp or detector (AF Amp OK). This does not divide the receiver in half."], "jumps": []}, {"id": "P1460", "text": ["If the signal between the IF Amp and detector is incorrect, what are the possible faulted functional blocks?"], "jumps": ["P1450"]}, {"id": "P1461", "text": [], "jumps": []}, {"id": "P1462", "text": ["The input signal to the detector is incorrect. The detector will not function with an incorrect input. This will also cause the audio Amp. not to function correctly."], "jumps": []}, {"id": "P1463", "text": ["The IF amplifier may be faulted, its output signal is incorrect. However, the detector has an incorrect input and will not function correctly."], "jumps": []}, {"id": "P1470", "text": ["Between which two functional blocks would you measure next?"], "jumps": ["P1460"]}, {"id": "P1471", "text": [], "jumps": []}, {"id": "P1472", "text": ["You already determined there is a fault in either the tuner or IF Amp. Measuring between the detector and audio Amp. would not help you isolate the fault."], "jumps": []}, {"id": "P1480", "text": ["If the signal between the tuner and IF amplifier is correct, what is the faulted block?"], "jumps": ["P1470"]}, {"id": "P1481", "text": [], "jumps": []}, {"id": "P1482", "text": ["The output of the tuner is correct, the tuner function is working correctly."], "jumps": []}, {"id": "P1483", "text": ["The Detector function is not one of the possible faulted areas, its input is incorrect.", "Which test point in the IF amplifier circuits would be checked now?"], "jumps": ["P1480"]}, {"id": "P1491", "text": ["TP9 is the input to the IF amplifiers. It has already been determined that this signal is correct. The output of the tuner was good.", "TP17 is one of the outputs from the IF amplifiers. It has already been determined that this signal is incorrect.", "Measuring the signal at TP12 indicates a correct signal. Which circuit is faulted?", "Measuring the signal at TP12 indicates a correct signal. Which circuit is faulted??"], "jumps": ["P1490"]}, {"id": "P1501", "text": ["The input signal to the second IF Amp. is correct. This indicates that the first IF Amp. is functioning correctly.", "Measuring the elements of Q3 indicate:\nBase         - AC signal is okay, DC bias is okay.       \nCollector - AC signal low, DC bias is okay.\nEmitter    - DC bias is okay but has an AC signal riding on it.", "Which element of Q3 is faulted?", "Measuring the elements of Q3 indicate: Base - AC signal is okay, DC bias is okay. Collector - AC signal low, DC bias is okay. Emitter - DC bias is okay but has an AC signal riding on it. n it.OKKKKKKKKKKKKKKKKKKKKKKK", "Which element of Q3 is faulted?ed.........................."], "jumps": ["P1520", "P1500", "P1510"]}, {"id": "P1521", "text": ["The base signals are normal, the fault is not in the base circuit of Q3.", "The collector bias is normal, only the AC signal is low. With the proper input to the base, the collector circuit is not at fault.", "What component in the emitter circuit would cause a low AC output on the collector?"], "jumps": ["P1520"]}, {"id": "P1531", "text": ["If R10 was faulted, the emitter DC bias would be incorrect.", "An open bypass capacitor would place an AC signal on the emitter causing the gain of Q3 to decrease."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on TROUBLESHOOTING THEORY.", "This completes the information on TROUBLESHOOTING THEORY..."], "jumps": ["P1001", "P1540"]}, {"id": "P1920", "text": ["1.  Troubleshooting electronic equipment requires a four step             process.", "1. Troubleshooting electronic equipment requires a four step process..", "TROUBLESHOOTING CHECKLIST 1. Analyze the Equipment 2. Check the Setup 3. Calculate and Measure 4. Check Results"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Analyze Equipment: You must know the equipment so that            you can determine the symptoms.", "2. Analyze Equipment: You must know the equipment so that you can determine the symptoms.", "Symptom: Only one station can be tuned in.."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Check the Setup: Ensure that all controls, switches and                  connections are correct.", "4.  Calculate and Measure: Use Test Equipment to compare                 measured signals with expected or calculated signals.", "3. Check the Setup: Ensure that all controls, switches and connections are correct.........", "Setup: Antenna Connected Plugged In Power ON Volume Up AM Stations Available", "4. Calculate and Measure: Use Test Equipment to compare measured signals with expected or calculated signals.", "Identify the faulty function, circuit and component."], "jumps": ["P1950", "P1930", "P1960"]}, {"id": "P1960", "text": ["5.  Check Results: Ensure the suspected fault would cause the            symptoms.", "5. Check Results: Ensure the suspected fault would cause the symptoms.", "Is there more than one fault? rcuit and component."], "jumps": ["P1999", "P1950"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.nu."], "jumps": ["P1001", "P1950"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["The purpose of this experiment is to apply the four step troubleshooting method to locate a faulty circuit in an AM receiver.", "TROUBLESHOOTING CHECKLIST 1. Analyze the Equipment 2. Check the Setup 3. Calculate and Measure 4. Check Results"], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["The circuits for the AM receiver are contained on three PC cards, PC130-38, 39 and 40.", "PC130-38 is the tuner section. It contains the RF amplifier, local oscillator and the mixer.", "PC130-39 is the IF amplifier and detector. It contains the first and second IF amplifiers along with the detector.", "PC130-40 is the audio amplifier. It contains an audio preamplifier, audio driver and audio push-pull amplifier.", "PC130-38 e faulty function, circuit and component.", "PC130-39 e faulty function, circuit and component.", "PC130-40 e faulty function, circuit and component.", "PC130-38 is the tuner section. It contains the RF amplifier, local oscillator and the mixer._"], "jumps": ["P2050", "P2020", "P2060", "P2040", "P2070", "P2080"]}, {"id": "P2080", "text": ["You will first test the receiver for normal operation. Then a fault will be inserted and you will use the four step troubleshooting method to locate the faulty circuit. Let's start the experiment."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2080"]}, {"id": "P2100", "text": ["2.  Carefully place PC130-38 into the Test Console PC1 position. 3.  Carefully place PC130-39 into the Test Console PC2 position. 4.  Carefully place PC130-40 into the Test Console PC3 position.", "2. Carefully place PC130-38 into the Test Console PC1 position. 3. Carefully place PC130-39 into the Test Console PC2 position. 4. Carefully place PC130-40 into the Test Console PC3 position."], "jumps": ["P2090"]}, {"id": "P2110", "text": ["5.  Place PC130-39 S1 to OPR. \n6.  Rotate PC130-39 R12 (volume control) to mid position.", "5. Place PC130-39 S1 to OPR. 6. Rotate PC130-39 R12 (volume control) to mid position. AC switch to ON. 9. Set the PC3 Speaker switch to ON.........................................", "MEASUREMENT SETUP - S1 set to OPR, R12 set to mid position."], "jumps": ["P2100", "P2115"]}, {"id": "P2120", "text": ["7.  Set the Voltmeter Switch to Positive. \n8.  Set the Positive Supply Voltage to 12. The Test Console's                Voltage Meter should indicate 12 volts.", "7. Set the Voltmeter Switch to Positive. 8. Set the Positive Supply Voltage to 12. The Test Console's Voltage Meter should indicate 12 volts."], "jumps": ["P2110"]}, {"id": "P2130", "text": ["9.  Turn PC1, PC2 and PC3 DC Power switches to ON.", "9. Turn PC1, PC2 and PC3 DC Power switches to ON.A - Set the PC1 DC Switch to ON...."], "jumps": ["P2120"]}, {"id": "P2140", "text": ["10.  Place the Test Console SPKR switch to ON. \n11.  Vary C1 on PC130-38 to tune in a local station. Adjust the                 volume control as needed (PC130-39 R12).", "10. Place the Test Console SPKR switch to ON. 11. Vary C1 on PC130-38 to tune in a local station. Adjust the volume control as needed (PC130-39 R12). dphones or be required to use headphones, check with your instructor.", "You may use headphones or be required to use headphones, check with your instructor.", "NOTE ay use headphones or be required to use headphones, check with your instructor."], "jumps": ["P2130", "P2145", "PC130"]}, {"id": "P2145", "text": ["TUNING IN A LOCAL STATION - You might not be able to pick up a local AM station. Your location to an AM transmitter and the type of building you are in will effect the receivers capability to tune in stations. If unable to tune in a station, check with your instructor. Your set up may be incorrect or your receiver may be misaligned."], "jumps": []}, {"id": "P2150", "text": ["12.  Place the SPKR switch to OFF. The receiver is operating                 normally.", "12. Place the SPKR switch to OFF. The receiver is operating normally. 130A - Set the PC2 AC switch to ON. 130A - Set the PC3 Speaker switch to ON.."], "jumps": ["P2140"]}, {"id": "P2160", "text": ["Now, let's verify the correct operation (and review the correct waveforms) of the receiver by using a function generator and observing the signals with an oscilloscope. This is part of step 1, analyze circuit (know your equipment first).", "Now, let's verify the correct operation (and review the correct waveforms) of the receiver by using a function generator and observing the signals with an oscilloscope. This is part of step 1, analyze circuit (know your equipment first)..."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["1.  Connect the function generator output to the Test Console            Input Signal BNC.", "1. Connect the function generator output to the Test Console Input Signal BNC.."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["2.  Connect the oscilloscope CH1 input to PIN E on PC130-38             and zero the display.", "2. Connect the oscilloscope CH1 input to PIN E on PC130-38 and zero the display..."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["3.  Adjust the function generator for a 1 MHz sine wave output at        2 - 8 Vpp.  This is the carrier frequency.  1 MHz is close to the         center of the AM broadcast band.", "3. Adjust the function generator for a 1 MHz sine wave output at 2 - 8 Vpp. This is the carrier frequency. 1 MHz is close to the center of the AM broadcast band.", "'}:5 t0H( 9E}A9As5/GA}A;aEAA}EAKE;AAaAE;A}AEAU;aA};aEAEA;EAAAEA;E;AaA", "EUaa 555G7EEEa::Ts1TA;;AA;EEA;AAa9:AAE;E;;;UaAA;AEEA;aA};AA9aAA}}};E;AA9E}9AA;}AAEaaA;AEAEaAAEEaAAA9EEAAA}EAE;aEEEAU;EE;Ea;}", "EK,,L17;UT9;EK;,=17=9EK;AaTs a7(aEAEas5:9<5", "mzF(tt-FsFF-cmzssttst|t--yTmVstys|tytts sm t syst", ";EaTTy55F }Aaas= yjm;AEEAA T_}zc(GGFGVVVccVcVVlllGLVs-FFccclFm--jz5(-VFzmmm(ctmmlmzzzFFFFFzmmmctmFmsmmtcVmt5mzzl-zFmmFmtz", "KT[Qa9mFKKaa 5TL:EAa95 |9/:}EAEAALA_l>lz(lllFmV-V/czzFzFz/cVmcc--F(GlzFVllWmzzm(mzm(FzmpcF(zmFlzFmmlz-llplcmV-z-mcjsFV`zltmlzFVz-tVczFFtcmVmzlFz(mmzFmzFzmFl/VtmtVFmzmVcmmsVccFt C130-39 TP9).          Adjust the oscilloscope controls as necessary. The signal is          the same as the output of the tuner, a 40 mV 455 kHz IF signal.", "2. Observe the input signal to the IF amplifiers (PC130-39 TP9). Adjust the oscilloscope controls as necessary. The signal is the same as the output of the tuner, a 40 mV 455 kHz IF signal.", "MEASUREMENT SETUP - Connect CH1 test probe to TP9."], "jumps": ["P2250", "P2230", "P2245", "PC130"]}, {"id": "P2250", "text": ["3.  Observe the output of the 2nd IF amplifier at  PC130-39 TP13.         Adjust the oscilloscope controls as necessary.  The signal is         approximately a 1 V,  modulated 455 kHz IF signal.", "3. Observe the output of the 2nd IF amplifier at PC130-39 TP13. Adjust the oscilloscope controls as necessary. The signal is approximately a 1 V, modulated 455 kHz IF signal............. modulated 455 kHz IF signal.", "MEASUREMENT SETUP - Connect CH1 test probe to TP13.hode of D1."], "jumps": ["P2260", "P2240", "P2255"]}, {"id": "P2260", "text": ["4.  Observe the output of the detector (PC130-39 TP17).  Adjust            the oscilloscope controls as necessary. The signal at TP17 is        the detected audio with the 455 kHz IF frequency removed.             The waveform will be about 0.1 to 0.3 Vpp.", "4. Observe the output of the detector (PC130-39 TP17). Adjust the oscilloscope controls as necessary. The signal at TP17 is the detected audio with the 455 kHz IF frequency removed. The waveform will be about 0.1 to 0.3 Vpp.e.", "MEASUREMENT SETUP - Connect CH1 test probe to TP17."], "jumps": ["P2270", "P2250", "P2265", "PC130"]}, {"id": "P2270", "text": ["5.  Observe the input to the audio amplifier (PC130-40 TP18).               Adjust the oscilloscope controls as necessary. The audio               signal is reduced by the action of the volume control. The               level depends on the setting of R12.", "5. Observe the input to the audio amplifier (PC130-40 TP18). Adjust the oscilloscope controls as necessary. The audio signal is reduced by the action of the volume control. The level depends on the setting of R12.............", "MEASUREMENT SETUP - Oscilloscope test probe shown connected to TP18."], "jumps": ["P2280", "P2260", "P2275", "PC130"]}, {"id": "P2280", "text": ["6.  Observe the output of the audio amplifiers (PC130-40 TP30).          Adjust the oscilloscope controls as necessary. The signal is          an amplified audio signal. The level depends on the setting of        the volume control.", "6. Observe the output of the audio amplifiers (PC130-40 TP30). Adjust the oscilloscope controls as necessary. The signal is an amplified audio signal. The level depends on the setting of the volume control.", "MEASUREMENT SETUP - Oscilloscope test probe shown connected to TP30."], "jumps": ["P2290", "P2270", "P2285", "PC130"]}, {"id": "P2290", "text": ["Now that you have seen the normal signals in an AM receiver tuned to an RF signal, the computer will insert a fault. Use the four step troubleshooting method to find the faulted circuit.", "Now that you have seen the normal signals in an AM receiver tuned to an RF signal, the computer will insert a fault. Use the four step troubleshooting method to find the faulted circuit. External program = SCAN FTR 0 F2 02"], "jumps": ["P2280"]}, {"id": "P2300", "text": ["1.  Place the Test Console SPKR switch to ON and perform step        1 of the troubleshooting procedure.", "1. Place the Test Console SPKR switch to ON and perform step 1 of the troubleshooting procedure..2 AC switch to ON. 130A - Set the PC3 Speaker switch to ON..", "TROUBLESHOOTING CHECKLIST 1. Analyze the Equipment 2. Check the Setup 3. Calculate and Measure 4. Check Results"], "jumps": ["P2290"]}, {"id": "P2305", "text": ["Is the audio from the function generator heard in the speaker?"], "jumps": ["P2300"]}, {"id": "P2306", "text": [], "jumps": []}, {"id": "P2307", "text": ["The fault inserted will cause no output to the speaker. Check with your instructor if you hear the audio from the function generator."], "jumps": []}, {"id": "P2310", "text": ["No output from the receiver is the symptom. Check to see if there are any other symptoms.", "Other possible symptoms: Power problem Static in the speakermeeeeeeeeeiv - .2"], "jumps": ["P2315", "P2305"]}, {"id": "P2315", "text": ["There are no other symptoms. The only symptom is no output.", "Other possible symptoms: Power problem Static in the speakermeeeeeeeeeiv - .2"], "jumps": ["P2320", "P2310"]}, {"id": "P2320", "text": ["2.  Check your setup.", "2. Check your setup.xt here...............................", "TROUBLESHOOTING CHECKLIST 1. Analyze the Equipment 2. Check the Setup 3. Calculate and Measure 4. Check Results", "Ensure that C1 is tuned to 1000 kHz during the experiment. The LO frequency will be 1455 kHz at TP4 on PC130-38. If not, adjust C1 until the LO frequency is 1455 kHz....", "NOTE ay use headphones or be required to use headphones, check with your instructor."], "jumps": ["P2325", "P2310"]}, {"id": "P2325", "text": ["The setup should be correct."], "jumps": ["P2330", "P2320"]}, {"id": "P2330", "text": ["Perform step 3, Calculate and Measure."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["First locate the faulty function.  Measure mid way in the functional diagram between the IF amplifiers and the detector.  Midway is at the TP13 on PC130-39.", "First locate the faulty function. Measure mid way in the functional diagram between the IF amplifiers and the detector. Midway is at the TP13 on PC130-39.130-39.", "PC130-38 e faulty function, circuit and component.", "PC130-39 e faulty function, circuit and component.", "PC130-40 e faulty function, circuit and component.", "MEASUREMENT SETUP - Connect CH1 test probe to TP13.hode of D1."], "jumps": ["P2350", "P2320", "P2345"]}, {"id": "P2350", "text": ["Is the signal an amplified and modulated IF signal of about 1 V?"], "jumps": ["P2340"]}, {"id": "P2351", "text": [], "jumps": []}, {"id": "P2352", "text": ["You should have measured a DC voltage. This is not the correct output from the IF amplifiers."], "jumps": []}, {"id": "P2360", "text": ["This measurement indicates the fault is in either the _______", "This measurement indicates the fault is in either the _______."], "jumps": ["P2350"]}, {"id": "P2361", "text": [], "jumps": []}, {"id": "P2362", "text": ["The output of the IF amplifier is incorrect. The detector and audio amplifier will not have good inputs, so there is no way to tell if they are faulted."], "jumps": []}, {"id": "P2370", "text": ["Now, determine which function is faulty by measuring the signal between the tuner and IF amplifiers at PC130-39 TP9.", "PC130-38 e faulty function, circuit and component.", "PC130-39 e faulty function, circuit and component.", "PC130-40 e faulty function, circuit and component.", "MEASUREMENT SETUP - Connect CH1 test probe to TP9."], "jumps": ["P2380", "P2360", "P2375"]}, {"id": "P2380", "text": ["Is the signal a 455 kHz modulated IF signal at about 40 mV?"], "jumps": ["P2370"]}, {"id": "P2381", "text": [], "jumps": []}, {"id": "P2382", "text": ["You should have measured a 455 kHz modulated signal of about 40 mV. This is a correct signal."], "jumps": []}, {"id": "P2390", "text": ["This measurement indicates the fault is in the _______", "This measurement indicates the fault is in the _______....."], "jumps": ["P2380"]}, {"id": "P2391", "text": [], "jumps": []}, {"id": "P2392", "text": ["The output of the tuner is OK, the tuner is not faulted.", "Now, determine which circuit in the IF amplifier is faulted by measuring mid way between the two IF amplifiers at PC130-39 TP12.", "The output of the tuner is OK, the tuner is not faulted...."], "jumps": []}, {"id": "P2410", "text": ["Is the signal amplified and modulated IF?", "Is the signal amplified and modulated IF?.................."], "jumps": ["P2400"]}, {"id": "P2411", "text": [], "jumps": []}, {"id": "P2412", "text": ["You should have measured a DC level. This is not a correct signal."], "jumps": []}, {"id": "P2420", "text": ["This measurement indicates which IF amplifier is faulty?", "This measurement indicates which IF amplifier is faulty?..."], "jumps": ["P2410"]}, {"id": "P2421", "text": [], "jumps": []}, {"id": "P2422", "text": ["The output of the first IF amplifier is incorrect, this does not indicate the second IF amplifier is faulted."], "jumps": []}, {"id": "P2430", "text": ["Congratulations, you have found the faulty circuit, the first IF amplifier.", "Now, find the faulty component. Use an oscilloscope and multimeter to measure the signals on the base, collector and emitter of Q2."], "jumps": ["P2440", "P2420"]}, {"id": "P2450", "text": ["You should have measured the following:", "Base - AC and DC bias (.7 V) Collector - NO AC, DC bias (12 V) Emitter - DC bias (.28 V))Van AC signal riding on it.................................."], "jumps": ["P2460", "P2440"]}, {"id": "P2460", "text": ["Base - AC and DC bias (.7 V) Collector - NO AC, DC bias (12 V) Emitter - DC bias (.28 V)VVan AC signal riding on it..................................", "Although the base bias has increased slightly, Q2 base circuit is good..."], "jumps": ["P2470", "P2440"]}, {"id": "P2470", "text": ["The collector has 12 V which indicates the transistor is in cutoff.", "Base - AC and DC bias (.7 V) Collector - NO AC, DC bias (12 V) Emitter - DC bias (.28 V)VVan AC signal riding on it.................................."], "jumps": []}, {"id": "P2480", "text": ["The emitter should have a small DC bias voltage due to the voltage drop of R6 and it should be .6 volts less than the base.\nIt has, in fact, gone up while the base voltage increased slightly.", "The emitter should have a small DC bias voltage due to the voltage drop of R6 and it should be .6 volts less than the base. It has, in fact, gone up while the base voltage increased slightly...", "Base - AC and DC bias (.7 V) Collector - NO AC, DC bias (12 V) Emitter - DC bias (.28 V)VVan AC signal riding on it.................................."], "jumps": ["P2490", "P2440"]}, {"id": "P2490", "text": ["Q2 should have .6 volts between the base and the emitter.  The bias has decreased to .42 volts because the emitter voltage has increased.  Therefore the problem must be in Q2 the emitter circuit.", "Q2 should have .6 volts between the base and the emitter. The bias has decreased to .42 volts because the emitter voltage has increased. Therefore the problem must be in Q2 the emitter circuit...", "Base - AC and DC bias (.7 V) Collector - NO AC, DC bias (12 V) Emitter - DC bias (.28 V)VVan AC signal riding on it.................................."], "jumps": ["P2500", "P2440"]}, {"id": "P2500", "text": ["11.  Set the PC1, PC2 and PC3 DC switches to OFF. Turn the Test         Console's SPKR to OFF.", "Measuring the resistance of R6 from TP11 to ground indicates that R6 is open.", "11. Set the PC1, PC2 and PC3 DC switches to OFF. Turn the Test Console's SPKR to OFF. Set the PC2 AC switch to ON. 130A - Set the PC3 Speaker switch to ON.."], "jumps": ["P2440"]}, {"id": "P2520", "text": ["Step 4, Check Results. With R6 open there is no output.", "Now, the computer will replace PC130-39 R6 for you.", "Now, the computer will replace PC130-39 R6 for you. ernal program = SCAN FTR 0 C1 00PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2530", "P2510", "P"]}, {"id": "P2540", "text": ["1.  Set PC1, PC2 and PC3 DC Power ON.  \n2.  Place the Test Console SPKR switch to ON.", "1. Set PC1, PC2 and PC3 DC Power ON. 2. Place the Test Console SPKR switch to ON. 130A - Set the PC2 AC switch to ON. 130A - Set the PC3 Speaker switch to ON.."], "jumps": ["P2510"]}, {"id": "P2550", "text": ["Check for normal operation of the receiver. Notice that replacing R6 repaired the receiver."], "jumps": ["P2560", "P2540"]}, {"id": "P2560", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console mputer will insert a fault. Use the four step troubleshooting method to find the faulted circuit."], "jumps": ["P13280"]}, {"id": "P13300", "text": ["Perform step 1 of the troubleshooting procedure.", "Perform step 1 of the troubleshooting procedure............", "TROUBLESHOOTING CHECKLIST 1. Analyze the Equipment 2. Check the Setup 3. Calculate and Measure 4. Check Results"], "jumps": ["P13305"]}, {"id": "P13305", "text": ["Is the audio from the function generator heard in the speaker?"], "jumps": ["P13300"]}, {"id": "P13306", "text": [], "jumps": []}, {"id": "P13307", "text": ["The fault inserted will cause no output to the speaker. Check with your instructor if you hear the audio from the function generator."], "jumps": []}, {"id": "P13310", "text": ["No output from the receiver is the symptom. Check to see if there are any other symptoms.", "Other possible symptoms: Power problem Static in the speakermeeeeeeeeeiv - .2"], "jumps": ["P13315", "P13305"]}, {"id": "P13315", "text": ["There are no other symptoms. The only symptom is no output.", "Other possible symptoms: Power problem Static in the speakermeeeeeeeeeiv - .2"], "jumps": ["P13320", "P13310"]}, {"id": "P13320", "text": ["2.  Check your setup.", "2. Check your setup.xt here...............................", "TROUBLESHOOTING CHECKLIST 1. Analyze the Equipment 2. Check the Setup 3. Calculate and Measure 4. Check Results", "Ensure that C1 is tuned to 1000 kHz during the experiment. The LO frequency will be 1455 kHz at TP4 on PC130-38. If not, adjust C1 until the LO frequency is 1455 kHz.", "NOTE ay use headphones or be required to use headphones, check with your instructor."], "jumps": ["P13325", "P13310"]}, {"id": "P13325", "text": ["The setup should be correct."], "jumps": ["P13330", "P13320"]}, {"id": "P13330", "text": ["Perform step 3, Calculate and Measure."], "jumps": ["P13340", "P13320"]}, {"id": "P13340", "text": ["First locate the faulty function.  Measure mid way in the functional diagram between the IF amplifiers and the detector.  Midway is at the TP13 on PC130-39.", "First locate the faulty function. Measure mid way in the functional diagram between the IF amplifiers and the detector. Midway is at the TP13 on PC130-39.130-39.", "PC130-38 e faulty function, circuit and component.", "PC130-39 e faulty function, circuit and component.", "PC130-40 e faulty function, circuit and component.", "MEASUREMENT SETUP - Connect CH1 test probe to TP13.hode of D1."], "jumps": ["P13350", "P13320", "P13345"]}, {"id": "P13350", "text": ["Is the signal an amplified and modulated IF signal of about 1 V?"], "jumps": ["P13340"]}, {"id": "P13351", "text": [], "jumps": []}, {"id": "P13352", "text": ["You should have measured a DC voltage. This is not the correct output from the IF amplifiers."], "jumps": []}, {"id": "P13360", "text": ["This measurement indicates the fault is in either the _______", "This measurement indicates the fault is in either the _______."], "jumps": ["P13350"]}, {"id": "P13361", "text": [], "jumps": []}, {"id": "P13362", "text": ["The output of the IF amplifier is incorrect. The detector and audio amplifier will not have good inputs, so there is no way to tell if they are faulted."], "jumps": []}, {"id": "P13370", "text": ["Now, determine which function is faulty by measuring the signal between the tuner and IF amplifiers at PC130-39 TP9.", "PC130-40 e faulty function, circuit and component.", "PC130-38 e faulty function, circuit and component.", "PC130-39 e faulty function, circuit and component.", "MEASUREMENT SETUP - Connect CH1 test probe to TP9."], "jumps": ["P13380", "P13360", "P13375"]}, {"id": "P13380", "text": ["Is the signal a 455 kHz modulated IF signal at about 40 mV?"], "jumps": ["P13370"]}, {"id": "P13381", "text": [], "jumps": []}, {"id": "P13382", "text": ["You should have measured a 455 kHz modulated signal of about 40 mV.  This is a correct signal.", "You should have measured a 455 kHz modulated signal of about 40 mV. This is a correct sign ..........."], "jumps": ["P13470", "P13440"]}, {"id": "P13470", "text": ["The collector has 12 V which indicates the transistor is in cutoff.", "Base - AC and DC bias (.7 V) Collector - NO AC, DC bias (12 V) Emitter - DC bias (.28 V)"], "jumps": []}, {"id": "P13480", "text": ["Base - AC and DC bias (.7 V) Collector - NO AC, DC bias (12 V) Emitter - DC bias (.28 V)VVan AC signal riding on it..................................", "The emitter should have a small DC bias voltage due to the voltage drop of R6 and it should be .6 volts less than the base. It has, in fact, gone up while the base voltage increased slightly."], "jumps": ["P13490", "P13440"]}, {"id": "P13490", "text": ["Q2 should have .6 volts between the base and the emitter.  The bias has decreased to .42 volts because the emitter voltage has increased.  Therefore the problem must be in Q2 the emitter circuit.", "Q2 should have .6 volts between the base and the emitter. The bias has decreased to .42 volts because the emitter voltage has increased. Therefore the problem must be in Q2 the emitter circuit.", "Base - AC and DC bias (.7 V) Collector - NO AC, DC bias (12 V) Emitter - DC bias (.28 V)VVan AC signal riding on it.................................."], "jumps": ["P13500", "P13440"]}, {"id": "P13500", "text": ["11.  Press Enter to Set: PC1, PC2 and PC3 DC Switches - OFF", "Measuring the resistance of R6 from TP11 to ground indicates that R6 is open.", "11. Press Enter to Set: PC1, PC2 and PC3 DC Switches - OFF................"], "jumps": ["P13440", "P13520"]}, {"id": "P13520", "text": ["Step 4, Check Results. With R6 open there is no output."], "jumps": ["P13530", "P13510"]}, {"id": "P13530", "text": ["Now, the computer will replace PC130-39 R6 for you."], "jumps": ["P13510"]}, {"id": "P13540", "text": ["1.  Press Enter to Set: PC1, PC2 and PC3 DC Power Switches             and Speaker - ON", "1. Press Enter to Set: PC1, PC2 and PC3 DC Power Switches and Speaker - ONNNNNNNNNNN"], "jumps": []}, {"id": "P13 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
