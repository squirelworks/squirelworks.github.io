": "P400", "text": ["In this lesson you will verify normal operation of series and parallel LCR circuits by calculating and measuring circuit values."], "jumps": ["P410", "P301"]}, {"id": "P410", "text": ["The experiment is divided into two objectives."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Objective 1 covers LCR series circuits.  PC130-17 series LCR circuit card is used.", "Objective 1 covers LCR series circuits. PC130-17 series LCR circuit card is used."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Objective 2 covers LCR parallel circuits.  PC130-19 parallel LCR circuit card is used.", "Objective 2 covers LCR parallel circuits. PC130-19 parallel LCR circuit card is used."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on LCR SERIES & PARALLEL CIRCUIT EXPERIMENT.........."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": ["P440"]}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1020", "text": ["The purpose of this experiment is to demonstrate the normal operation of an LCR series circuit."], "jumps": ["P1040", "P1001"]}, {"id": "P1040", "text": ["Pick up the PC130-17 card. This card is used to demonstrate the operation of LCR series circuits."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Compare the card with the schematic shown."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["Notice that there are three LCR series circuits. S1, S2, S3 are used to select the circuit."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["Also notice that the values of resistance, capacitance, and inductance are the same in all three circuits."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["Since all L, C, and R components are identical, the voltages and waveforms across them are the same no matter where they are placed in the circuit."], "jumps": ["P1090", "P1040"]}, {"id": "P1090", "text": ["This al nnected to measure IR,  IC, IL or IT.", "Switch S6 allows sampling resistors to be connected to measure IR, IC, IL or IT."], "jumps": ["P2090", "P2040", "P2085"]}, {"id": "P2082", "text": ["Switch S6 allows sampling resistors to be connected to measure IR,  IC, IL or IT.", "Switch S6 allows sampling resistors to be connected to measure IR, IC, IL or IT."], "jumps": ["P2090", "P2040", "P2085"]}, {"id": "P2085", "text": ["SAMPLING RESISTORS - The sampling resistors (R2, R3, and R4) are used so that current can be measured with an oscilloscope, I = E/R. The value is very small and will not effect the current through the branches of the circuit or IT."], "jumps": ["P2086", "P2082"]}, {"id": "P2086", "text": ["SAMPLING RESISTORS - Remember, voltage and current are in phase through a resistor so, not only can the value of current be determined, the phase can also be determined in each branch along with total current.", "SAMPLING RESISTORS - Remember, voltage and current are in phase through a resistor so, not only can the value of current be determined, the phase can also be determined in each branch along with total current..."], "jumps": ["P2082", "P2085"]}, {"id": "P2090", "text": ["S6 in the up position allows current measurements in each branch across R2, R3, and R4."], "jumps": ["P2100", "P2082"]}, {"id": "P2100", "text": ["S6 in the down position allows total current measurement across R2."], "jumps": ["P2120", "P2090"]}, {"id": "P2120", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2090"]}, {"id": "P2130", "text": ["2.  Carefully plug PC130-19 into the Test Console PC1 position.\n3.  Set PC130-19 S3, S4 and S6 to the UP position.\n4.  Set PC130-19 S1, S2, and S5 to the DOWN position.", "2. Carefully plug PC130-19 into the Test Console PC1 position. 3. Set PC130-19 S3, S4 and S6 to the UP position. 4. Set PC130-19 S1, S2, and S5 to the DOWN po ormal operation of an LCR series circuit."], "jumps": ["P13040", "P1001"]}, {"id": "P13040", "text": ["Pick up the PC130-17 card. This card is used to demonstrate the operation of LCR series circuits."], "jumps": ["P13050", "P13020"]}, {"id": "P13050", "text": ["Compare the card with the schematic shown."], "jumps": ["P13060", "P13040"]}, {"id": "P13060", "text": ["Notice that there are three LCR series circuits. S1, S2, S3 are used  to select the circuit.", "Notice that there are three LCR series circuits. S1, S2, S3 are used to select the circuit."], "jumps": ["P13070", "P13040"]}, {"id": "P13070", "text": ["Also notice that the values of resistance, capacitance, and inductance are the same in all three circuits."], "jumps": ["P13080", "P13040"]}, {"id": "P13080", "text": ["Since all L, C, and R components are identical, the voltages and waveforms across them are the same no matter where they are placed in the circuit."], "jumps": ["P13090", "P13040"]}, {"id": "P13090", "text": ["This allows measuring all three circuit components using an oscilloscope reference to ground."], "jumps": ["P13100", "P13040"]}, {"id": "P13100", "text": ["ER is measured across R1.  EC is measured across C2, and EL is measured across L3.", "ER is measured across R1. EC is measured across C2, and EL is measured across L3."], "jumps": ["P13120", "P13040"]}, {"id": "P13120", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13040"]}, {"id": "P13130", "text": ["2.  Carefully place PC130-17 into the Test Console PC1 position. \n3.  Set PC130-17 S1, S2, and S3 to the UP position.", "2. Carefully place PC130-17 into the Test Console PC1 position. 3. Set PC130-17 S1, S2, and S3 to the UP position."], "jumps": ["P13140", "P13135"]}, {"id": "P13135", "text": ["EXPERIMENT CARD PLACEMENT - PC130-17 shown in PC1 position."], "jumps": ["P13136"]}, {"id": "P13136", "text": ["MEASUREME 17.   \n4.  Return all equipment to its proper storage area.", "2. Disconnect all test equipment. 3. Carefully remove PC130-17. 4. Return all equipment to its proper storage area. its proper storage area."], "jumps": ["P13910", "P13540"]}, {"id": "P13910", "text": ["This completes the experiment on LCR SERIES CIRCUITS.", "This completes the experiment on LCR SERIES CIRCUITS......."], "jumps": ["P1001", "P13550"]}, {"id": "P14020", "text": ["The purpose of this experiment is to demonstrate the normal operation of an LCR parallel circuit."], "jumps": ["P14040", "P2001"]}, {"id": "P14040", "text": ["Pick up the PC130-19 card. This card is used to demonstrate the operation of LCR parallel circuits."], "jumps": ["P14050", "P14020"]}, {"id": "P14050", "text": ["Compare the card with the schematic shown."], "jumps": ["P14060", "P14040"]}, {"id": "P14060", "text": ["S1 through S5 allow the components to be placed in the circuit in parallel."], "jumps": ["P14070", "P14040"]}, {"id": "P14070", "text": ["R1 is variable and can be set to any value from 0 to10 kW."], "jumps": ["P14080", "P14040"]}, {"id": "P14080", "text": ["Switch S6 allows sampling resistors to be connected to measure IR, IC, IL or IT.", "Switch S6 allows sampling resistors to be connected to measure IR, IC, IL or IT.."], "jumps": ["P14090", "P14040", "P14085"]}, {"id": "P14082", "text": ["Switch S6 allows sampling resistors to be connected to measure IR, IC, IL or IT."], "jumps": ["P14090", "P14040", "P14085"]}, {"id": "P14085", "text": ["SAMPLING RESISTORS - The sampling resistors (R2, R3, and R4) are used so that current can be measured with an oscilloscope, I = E/R. The value is very small and will not effect the current through the branches of the circuit or IT."], "jumps": ["P14086", "P14082"]}, {"id": "P14086", "text": ["SAMPLING RESISTORS - Remember, voltage and current are in phase through a resistor so, not only can the value of current be determined, the phase can also be determined in each branch along with total current.", "SAMPLING RESISTORS - Remember, voltage and current are in phase through a resistor so, not only can the value of current be determined, the phase can also be determined in each branch along with total current..."], "jumps": ["P14082", "P14085"]}, {"id": "P14090", "text": ["S6 in the up position allows current measurements in each branch across R2, R3, and R4."], "jumps": ["P14100", "P14082"]}, {"id": "P14100", "text": ["S6 in the down position allows total current measurement across R2."], "jumps": ["P14120", "P14090"]}, {"id": "P14120", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P14090"]}, {"id": "P14130", "text": ["2.  Carefully plug PC130-19 into the Test Console PC1 position.\n3.  Set PC130-19 S3, S4 and S6 to the UP position.  \n4.  Set PC130-19 S1, S2, and S5 to the DOWN position.", "2. Carefully plug PC130-19 into the Test Console PC1 position. 3. Set PC130-19 S3, S4 and S6 to the UP position. 4. Set PC130-19 S1, S2, and S5 to the DOWN position."], "jumps": ["P14140", "P14135"]}, {"id": "P14135", "text": ["EXPERIMENT CARD PLACEMENT - PC130-19 shown in PC1 position."], "jumps": ["P14136", "P14130"]}, {"id": "P14136", "text": ["MEASUREMENT SETUP - Place switches S1, S2, S5 to the DOWN position and S3, S4, S6 to the UP position."], "jumps": ["P14130", "P14135"]}, {"id": "P14140", "text": ["5.  Connect a multimeter between PC130-19 TP6 and TP2 and             adjust R1 for 5 kW. \n6.  Set PC130-19 S1 to the UP position.", "5. Connect a multimeter between PC130-19 TP6 and TP2 and adjust R1 for 5 kW. 6. Set PC130-19 S1 to the UP position.."], "jumps": ["P14150", "P14130", "P14145"]}, {"id": "P14145", "text": ["MEASUREMENT SETUP - Place switch S1 to the UP position. Place the positive test lead on TP6. Place the negative test lead on TP2."], "jumps": []}, {"id": "P14150", "text": ["The parallel circuit consists of : "P15090", "text": ["This allows measuring all three circuit components using an oscilloscope reference to ground."], "jumps": ["P15100", "P15040"]}, {"id": "P15100", "text": ["ER is measured across R1.  EC is measured across C2, and EL is measured across L3.", "ER is measured across R1. EC is measured across C2, and EL is measured across L3."], "jumps": ["P15120", "P15040"]}, {"id": "P15120", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P15040"]}, {"id": "P15130", "text": ["2.  Carefully place PC130-17 into the Test Console PC position. \n3.  Set PC130-17 S1, S2, and S3 to the UP position.", "2. Carefully place PC130-17 into the Test Console PC position. 3. Set PC130-17 S1, S2, and S3 to the UP position."], "jumps": ["P15140", "P15136"]}, {"id": "P15136", "text": ["MEASUREMENT SETUP - Place switches S1, S2 and S3 to the UP position."], "jumps": ["P15130"]}, {"id": "P15140", "text": ["4.  Connect the function generator output to the Test Console's           INPUT BNC connector. \n5.  Connect the function generator SYNC output to the                           oscilloscopes external trigger input.", "4. Connect the function generator output to the Test Console's INPUT BNC connector. 5. Connect the function generator SYNC output to the oscilloscopes external trigger input.."], "jumps": ["P15150", "P15130", "P15145"]}, {"id": "P15145", "text": ["BNC CONNECTION - Connect the Function Generator's Main Output BNC to the Test Console's Input Signal BNC."], "jumps": ["P15147"]}, {"id": "P15147", "text": ["SYNC CONNECTION - Connect the Function Generator's SYNC Output to the Oscilloscope's External Trigger Output.", "K, HK_,,_K,_K'',EK,,,,,'_,KEKZ;;XK98JO9[N=9N@N99U,,K,,EK", "'_K_'K'',K' QUK_,''KK}0;KK,KK__',K'K_K''KK'K_", "'_K_'KK',K_,,'_'',K,K', F;__KK,K, TK,,__,''KKK'", ",KK,,E:9 POOHPPP=70=07PUHP^UOOU=YOVP=PPPPOOPXOOOOXH9UO95P0P===TXZOOU1NIIPPPHPVGH 80", "text": ["Switch S6 allows sampling resistors to be connected to measure IR, IC, IL or IT.", "Switch S6 allows sampling resistors to be connected to measure IR, IC, IL or IT.."], "jumps": ["P16090", "P16040", "P16085"]}, {"id": "P16082", "text": ["Switch S6 allows sampling resistors to be connected to measure IR, IC, IL or IT."], "jumps": ["P16090", "P16040", "P16085"]}, {"id": "P16085", "text": ["SAMPLING RESISTORS - The sampling resistors (R2, R3, and R4) are used so that current can be measured with an oscilloscope, I = E/R. The value is very small and will not effect the current through the branches of the circuit or IT."], "jumps": ["P16086", "P16082"]}, {"id": "P16086", "text": ["SAMPLING RESISTORS - Remember, voltage and current are in phase through a resistor so, not only can the value of current be determined, the phase can also be determined in each branch along with total current.", "SAMPLING RESISTORS - Remember, voltage and current are in phase through a resistor so, not only can the value of current be determined, the phase can also be determined in each branch along with total current..."], "jumps": ["P16082", "P16085"]}, {"id": "P16090", "text": ["S6 in the up position allows current measurements in each branch across R2, R3, and R4."], "jumps": ["P16100", "P16082"]}, {"id": "P16100", "text": ["S6 in the down position allows total current measurement across R2."], "jumps": ["P16120", "P16090"]}, {"id": "P16120", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P16090"]}, {"id": "P16130", "text": ["2.  Carefully plug PC130-19 into the Test Console PC position.\n3.  Set PC130-19 S3, S4 and S6 to the UP position.  \n4.  Set PC130-19 S1, S2, and S5 to the DOWN position.", "2. Carefully plug PC130-19 into the Test Console PC position. 3. Set PC130-19 S3, S4 and S6 to the UP position. 4. Set PC130-19 S1, S2, and S5 to the DOWN positi let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
