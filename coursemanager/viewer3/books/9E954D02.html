const book = {"title": "9E954D02", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: INTRODUCTION TO INTEGRATED CIRCUITSsdf asdf sadf"], "jumps": []}, {"id": "P10", "text": ["# #\" #& \"\"# &\"###2' &2#&.22&# 25--283-.#285255232/238882-.-5:38832222882282-213:22::82-22225:8-33-22282232.22258558.5822385:235:222283538::2585582::2:", "&&#&# #/2.#.& -8 \"#.-&23..22'/.#212&-2258\"588:52", "### ## /# #/&# \" \"/##\"#/&//..#/..&/28.&...&824/&.88-8588..2222858852.28:582228588358282228258.888:825:583.8828::8228828588828583:35558.555.85::88::85588:88:5555::38::85:::5:5:52::85::88::", ":85:855::83:5:5.5:55:855:52.5:5283822242348522...252...2..82/.4..22//2./..##/.8.#&./#&/..##// ##\",##/## #. / /& # ## ## ## ## ## \" #/# ## /# ## #.\" ./ #//###,//.&/#.\"#/.##/./#&/2.&/.../&//....//&2222.2/252.&28.8522582.824828828::255:::5:", "/,,,,,,,,,,,,,/, ,, ,,,,,,6, ,,,6,,, ,,,,,//6//6,,,,/6/,,,/,4/,,/6/4494,,494/6846446/4884664;44;889448489888<8648<<8;44;88988<88948;98<44<;:<44<<8;44<48<<8;48<48<88;48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Interpret basic IC numbers. w Locate information on an IC using an IC Data Book............", "w Identify the different IC construction classifications. w Identify Integration Classifications.", "w Explain the construction of a basic IC. w Understand the various IC packaging Arrays. w Identify basic IC packaging Materials. w Identify various integrated components."], "jumps": []}, {"id": "P300", "text": ["Integrated Circuits (ICs) are used in almost every electronic application today. If you have used a pocket calculator, you have used electronic circuits containing several IC's."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["ICs were made possible after the discovery of transistors. In this lesson you will find out how integrated circuits are used and what they are composed of."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Not only will you learn how ICs work and how they are constructed, we are also going to look at the methods for identifying ICs using standard reference materials, otherwise known as Data Books.", "Not only will you learn how ICs work and how they are constructed, we are also going to look at the methods for identifying ICs using standard reference materials, otherwise known as Data Books..."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["Let's begin the lesson on INTRODUCTION TO INTEGRATED CIRCUITS..............."], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Integrated Circuits (ICs), first developed in 1959 by Texas Instruments, have revolutionized electronics. The Integrated Circuit was made possible by the invention of semiconductor devices."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Recall that semiconductor devices are created from doped materials. It is important to realize that resistors and capacitors are made of the same semiconducting materials as transistors and diodes. These resistors and capacitors do have some limitations.", "Recall that semiconductor devices are created from doped materials. It is important to realize that resistors and capacitors are made of the same semiconducting materials as transistors and diodes. These resistors and capacitors do have some limitations..."], "jumps": []}, {"id": "P1040", "text": ["Inductors are also made of semiconducting material, but due to their large size they are not used often."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Which of the following semiconductor devices is NOT normally used due to size?"], "jumps": ["P1020"]}, {"id": "P1051", "text": [], "jumps": []}, {"id": "P1052", "text": ["Diodes and resistors are not large and ARE normally used in integrated circuits."], "jumps": []}, {"id": "P1060", "text": ["Integrated Circuits are referred to as IC's or chips. By integrating or combining one or more circuits on one device less space and money are used, and rel.", "Integrated Circuits are referred to as IC's or chips. By integrating or combining one or more circuits on one device less space and money are used, and reliablility is increased."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["To realize how small an IC is consider the computer you are using. It contains a large IC called a microprocessor. The microprocessor's size is approximately one inch by one inch, and about a quarter of an inch high. This small device is capable of performing thousands of tasks.", "To realize how small an IC is consider the computer you are using. It contains a large IC called a microprocessor. The microprocessor's size is approximately one inch by one inch, and about a quarter of an inch high. This small device is capable of performing thousands of tasks..."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["The microprocessor consists of over a million transistors and other devices. Imagine having a million transistors on a printed circuit card. Your computer would probably fill an entire room and more than likely only perform simple math functions.", "The microprocessor consists of over a million transistors and other devices. Imagine having a million transistors on a printed circuit card. Your computer would probably fill an entire room and more than likely only perform simple math functions..."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["ibes the number of integrated components.C, like an operational amplifier, may contain only a handful. ICs have a classification which describes the number of integrated components.", "Microprocessors may contain more than a million integrated components while an operational amplifier (specific type of IC) might contain only a handful. ICs have a classification which describes the number of integrated components......................................."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["IC integration is classified by the number of components in the IC.  The microprocessor is ULSI (Ultra Large Scale Integration) and the operational amplifier is SSI. As technology advances additional classifications will be determined.", "IC integration is classified by the number of components in the IC. The microprocessor is ULSI (Ultra Large Scale Integration) and the operational amplifier is SSI. As technology advances additional classifications will be determined..........", "Small ScaIe Integration Medium Scale Integration Large Scale Integration Very Large Scale Integration Ultra Large Scale Integration", "less than 12 12 to 99 100 to 9,999 10,000 to 99,999 100,000 or more nnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn"], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["An IC containing 637 gates would be classified under what integration category?"], "jumps": ["P1090"]}, {"id": "P1111", "text": [], "jumps": []}, {"id": "P1112", "text": ["The chip has 637 integrated components. Look at the chart below to determine it's classification.", "Small ScaIe Integration Medium Scale Integration Large Scale Integration Very Large Scale Integration Ultra Large Scale Integration", "less than 12 12 to 99 100 to 9,999 10,000 to 99,999 100,000 or more nnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn"], "jumps": []}, {"id": "P1120", "text": ["Next, we are going to discuss different types of IC construction. The four main ways of IC construction are:", "Monolithic Thin Film Thick Film Hybrid"], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["Monolithic components are made by placing all integrated components on a single piece of doped semiconductor material and by using doped deposits. This type of IC construction is used most often.", "Monolithic components are made by placing all integrated components on a single piece of doped semiconductor material and by using doped deposits. This type of IC construction is used most often..."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["Thin film construction is different than Monolithic. Instead of all the integrated components being made on doped material (substrate) they are placed on the insulating material (substrate). This material may be glass or ceramic.", "Thin film construction is different than Monolithic. Instead of all the integrated components being made on doped material (substrate) they are placed on the insulating material (substrate). This material may be glass or ceramic..."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["This provides good insulation and less power usage since the insulating material, which is known as the substrate, does not draw power. The doped material used in Monolithic construction will draw some power due to increased current flow.", "This provides good insulation and less power usage since the insulating material, which is known as the substrate, does not draw power. The doped material used in Monolithic construction will draw some power due to increased current flow..."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["Thick film ICs have more than one substrate. Resistors and capacitors are formed on the main substrate while transistors are contained on their own separate substrates. The last type of construction technique we will mention is the Hybrid IC.", "Thick film ICs have more than one substrate. Resistors and capacitors are formed on the main substrate while transistors are contained on their own separate substrates. The last type of construction technique we will mention is the Hybrid IC..."], "jumps": ["P1130"]}, {"id": "P1170", "text": ["The Hybrid IC is a mixture of both Monolithic and Thin film devices all deposited on a single ceramic platform. Even Thick film devices can be added for certain applications."], "jumps": ["P1160"]}, {"id": "P1180", "text": ["What terms would you use to describe the classification of the diagram shown?"], "jumps": ["P1160"]}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1182", "text": ["There are only 2 resistors and 2 transistors in this device. This indicates that the IC is SSI. The next classification is really based on the substrate, in this case a P-type semiconductor. Since nothing is labeled ceramic, glass, or insulated, this IC must be Monolithic.", "There are only 2 resistors and 2 transistors in this device. This indicates that the IC is SSI. The next classification is really based on the substrate, in this case a P-type semiconductor. Since nothing is labeled ceramic, glass, or insulated, this IC must be Monolithic...", "Small ScaIe Integration Medium Scale Integration Large Scale Integration Very Large Scale Integration Ultra Large Scale Integration", "less than 12 12 to 99 100 to 9,999 10,000 to 99,999 100,000 or more nnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn"], "jumps": []}, {"id": "P1190", "text": ["ICs are normally classified under one of two main headings, linear or digital. Linear ICs are used in Analog situations and Digital ICs are used in digital applications.", "* Oscillators * Operational Amplifiers * Voltage Regulatorss", "* Microprocessors * Shift Registers * Nand Gatesgulatorsulatorsssssssssssss"], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["Below are some examples of Linear and Digital ICs. As you can see, there are many different classifications for ICs. It is important to remember that these are not all the types of IC classification, as there are hundreds.", "Below are some examples of Linear and Digital ICs. As you can see, there are many different classifications for ICs. It is important to remember that these are not all the types of IC classification, as there are hundreds..."], "jumps": ["P1910", "P1190"]}, {"id": "P1910", "text": ["This completes the information on IC CLASSIFICATIONS.", "This completes the information on IC CLASSIFICATIONS......."], "jumps": ["P1001", "P1190"]}, {"id": "P1920", "text": ["1.  ICs have a classification which describes the number of\n     integrated components.", "1. ICs have a classification which describes the number of integrated components..", "Small ScaIe Integration Medium Scale Integration Large Scale Integration Very Large Scale Integration Ultra Large Scale Integration", "less than 12 12 to 99 100 to 9,999 10,000 to 99,999 100,000 or more nnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  There are four main ways to construct an IC; Monolithic, Thin\n     film, Thick film and Hybrid.", "2. There are four main ways to construct an IC; Monolithic, Thin film, Thick film and Hybrid.."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  ICs are normally classified under one of two main headings;\n     linear or digital.", "3. ICs are normally classified under one of two main headings; linear or digital..", "* Oscillators * Operational Amplifiers * Voltage Regulatorss", "* Microprocessors * Shift Registers * Nand Gatesgulatorsulatorsssssssssssss"], "jumps": ["P1999", "P1930"]}, {"id": "P1999", "text": ["You have completed the Summary. \nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.."], "jumps": ["P1001", "P1940"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["As you have learned, there are four common methods for IC  construction; Monolithic, Thin film, Thick film, and Hybrid. The diagram below illustrates the construction of a typical Monolithic IC.", "As you have learned, there are four common methods for IC construction; Monolithic, Thin film, Thick film, and Hybrid. The diagram below illustrates the construction of a typical Monolithic IC."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["Let's look at the method for Monolithic IC construction. A wafer of silicon is cut from a larger piece. The number of ICs that can be created from a wafer depend on the wafer's size, as well as the size of the IC's being cut. The number of ICs usually ranges from 25 to 100."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["The different layers of doped material are created by using different techniques; oxidation, photochemical, chemical, evaporation, and depositing. There are many other techniques that can be used. During the process all the IC's on the wafer are created at one time.", "The different layers of doped material are created by using different techniques; oxidation, photochemical, chemical, evaporation, and depositing. There are many other techniques that can be used. During the process all the IC's on the wafer are created at one time...", "All ICs on wafer are created at the same time"], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["On top of the wafer, wire is deposited to connect all the different components of the integrated circuit. The material used for this wire is normally aluminum or gold. The wafers are cut apart using a technique similar to cutting glass.", "On top of the wafer, wire is deposited to connect all the different components of the integrated circuit. The material used for this wire is normally aluminum or gold. The wafers are cut apart using a technique similar to cutting glass..."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["Now the ICs are tested to see if they function properly. Since the creation of an IC involves certain irreversible steps, non-working ICs are normally discarded. Once the IC has passed operational tests, it is ready to be packaged. Some companies only test on the initial run. Once the initial run is good, additional runs are not tested.."], "jumps": ["P2065", "P2040"]}, {"id": "P2065", "text": ["Which of the following materials is NOT normally used as a wire deposit on the wafer?"], "jumps": ["P2060"]}, {"id": "P2066", "text": [], "jumps": []}, {"id": "P2067", "text": ["Aluminum and Gold ARE the materials normally used for wire deposited on top of the wafer."], "jumps": []}, {"id": "P2070", "text": ["There are three different factors to deal with when packaging an IC; packaging material, package shape, and pin arrangement. The packaging material for IC's can be ceramic, plastic, glass or metal.", "There are many different shapes and pin arrangements used to package IC's. It is important to realize that the package type and pin arrangement needed depends on the application. Let's look at some different groups of package and pin types.", "There are three different factors to deal with when packaging an IC; packaging material, package shape, and pin arrangement. The packaging material for IC's can be ceramic, plastic, glass or metal..al.al.tal...", "Ceramic Plastic Glass - Metal", "There are many different shapes and pin arrangements used to package IC's. It is important to realize that the package type and pin arrangement needed depends on the application. Let's look at some different groups of package and pin types..."], "jumps": ["P2080", "P2065", "P2090", "P2070"]}, {"id": "P2090", "text": ["The Can package is normally metal and glass with the pins connected in a fashion similar to a transistor. A tab is provided to identify pin 1 or an important pin."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["If the marked pin indicates pin number one, all other pins can be determined by counting in a counterclockwise direction. The diagram below illustrates this principle. It is important to realize that Can packages are not used for large integrated circuits.", "If the marked pin indicates pin number one, all other pins can be determined by counting in a counterclockwise direction. The diagram below illustrates this principle. It is important to realize that Can packages are not used for large integrated circuits..."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["The next group of package types we will look at are DIPs, SIPs, and ZIPs. These three package types will be either made from plastic or ceramic. As you can see from the diagrams below, most space is used for the connection of external leads.", "The next group of package types we will look at are DIPs, SIPs, and ZIPs. These three package types will be either made from plastic or ceramic. As you can see from the diagrams below, most space is used for the connection of external leads.ds..."], "jumps": ["P2120", "P2090"]}, {"id": "P2120", "text": ["The top and bottom half of the ICs are bonded together using an epoxy. Ceramic packages can be sealed better than plastic packages. A good seal will help prevent corrosion and undesirable effects.", "The top and bottom half of the ICs are bonded together using an epoxy. Ceramic packages can be sealed better than plastic packages. A good seal will help prevent corrosion and undesirable effects..."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["The IC shown below is in the DIP package, which stands for Dual Inline Package due to the two rows of pins. A dot or notch is located on the IC to indicate pin 1. The pin to the left of the notch or dot is pin 1. Count the pins counterclockwise around the IC to identify their numbers. The diagram below illustrates this principle....."], "jumps": ["P2110"]}, {"id": "P2140", "text": ["The IC shown below is in the SIP package, which stands for Single Inline Package due to the one straight row of pins. A dot or notched side indicates pin 1. All other pins are identified by counting away from pin 1.", "The IC shown below is in the SIP package, which stands for Single Inline Package due to the one straight row of pins. A dot or notched side indicates pin 1. All other pins are identified by counting away from pin 1..."], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["The IC shown below is in the ZIP package, which stands for Zigzag Inline Package due to the jagged row of pins. A dot or notched side indicates pin 1. All other pins are identified just like the SIP package since they still exit the package in a straight line.", "The IC shown below is in the ZIP package, which stands for Zigzag Inline Package due to the jagged row of pins. A dot or notched side indicates pin 1. All other pins are identified just like the SIP package since they still exit the package in a straight line..."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["The next group of package types we will look at is the Flat Pack, and the Quad Flat Pack (QFP). Like the DIPs, SIPs, and ZIPs, these packages are made from either ceramic or plastic. The only major difference between the two groups is the pin arrangement.", "The next group of package types we will look at is the Flat Pack, and the Quad Flat Pack (QFP). Like the DIPs, SIPs, and ZIPs, these packages are made from either ceramic or plastic. The only major difference between the two groups is the pin arrangement..."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["The IC shown below is the Flat Pack package. The reason for this name is the straight pins exiting the IC and the overall thinness of the package itself. Pins are assigned just like the DIP package. A dot or notch indicates that the pin to the left is pin 1. The other pins can be identified by counting counterclockwise from pin 1....."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["The IC shown below is the Quad Flat Pack package. The Quad Flat Pack has pins on all four sides of the IC. Pin 1 is identified by a dot or notch. Count the pins counterclockwise starting at pin 1 to identify them.", "The IC shown below is the Quad Flat Pack package. The Quad Flat Pack has pins on all four sides of the IC. Pin 1 is identified by a dot or notch. Count the pins counterclockwise starting at pin 1 to identify them..."], "jumps": ["P2170"]}, {"id": "P2190", "text": ["Flat Package ICs can be mounted in a hole on a PC board to allow both sides of an IC to effectively dissipate heat or be used for surface mounting on PC boards. Surface mount ICs do not have leads that extend through the PC board.", "Flat Package ICs can be mounted in a hole on a PC board to allow both sides of an IC to effectively dissipate heat or be used for surface mounting on PC boards. Surface mount ICs do not have leads that extend through the PC board..."], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["The next group of package types are the SOJ, TSOP, and SOP packages.  Like the Flat Pack package, these packages are made from either ceramic or plastic. The only major difference between the two groups of ICs is size.", "The next group of package types are the SOJ, TSOP, and SOP packages. Like the Flat Pack package, these packages are made from either ceramic or plastic. The only major difference between the two groups of ICs is size."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["The IC shown below is the Small-Outline J-lead package (SOJ). The SOJ has pins in the same arrangement as the DIP, however, the pins curl inward in the shape of a J. The pins are identified in the same manner as the DIP package.", "The IC shown below is the Small-Outline J-lead package (SOJ). The SOJ has pins in the same arrangement as the DIP, however, the pins curl inward in the shape of a J. The pins are identified in the same manner as the DIP package..."], "jumps": ["P2200"]}, {"id": "P2220", "text": ["ICs that have pins shaped in a J are not normally soldered to a PC board. Instead, a socket is provided for the insertion of an IC. You will see later that the LCC package is very similar but larger than the SOJ.", "ICs that have pins shaped in a J are not normally soldered to a PC board. Instead, a socket is provided for the insertion of an IC. You will see later that the LCC package is very similar but larger than the SOJ..."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["The IC shown below is the Thin Small-Outline Package (TSOP). The TSOP has pins in the same arrangement as the Flat Pack, however, it is much smaller. The pins on this IC are identified the same way as a Flat Pack IC. The diagram below illustrates this principle.", "The IC shown below is the Thin Small-Outline Package (TSOP). The TSOP has pins in the same arrangement as the Flat Pack, however, it is much smaller. The pins on this IC are identified the same way as a Flat Pack IC. The diagram below illustrates this principle..."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["The IC shown below is the Small-Outline Package (SOP). The SOP has pins in the same arrangement as the TSOP, however, the IC is slightly bigger. The pins can be identified in the same manner as the TSOP.", "The IC shown below is the Small-Outline Package (SOP). The SOP has pins in the same arrangement as the TSOP, however, the IC is slightly bigger. The pins can be identified in the same manner as the TSOP..."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["The ICs in this group are normally used for surface mount PC boards. A surface mount IC is specially soldered to the top side of a PC board. This allows large circuits to be assembled on a small PC board, utilizing both sides of the board better.", "The ICs in this group are normally used for surface mount PC boards. A surface mount IC is specially soldered to the top side of a PC board. This allows large circuits to be assembled on a small PC board, utilizing both sides of the board better..."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["The last group of package types we will look at is the LCC and PGA package. Like the Quad Flat Pack, these packages are made from either ceramic or plastic. The only major difference is the size and pin arrangement.", "The last group of package types we will look at is the LCC and PGA package. Like the Quad Flat Pack, these packages are made from either ceramic or plastic. The only major difference is the size and pin arrangement..gement..."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["The IC shown below is the Leaded (or Leadless) Chip Carrier (LCC). The LCC has pins in the same arrangement as the SOJ, each lead being shaped like a J. Remember, these types of ICs are inserted into a socket.", "The IC shown below is the Pin Grid Array (PGA) package. The PGA has pins that exit the bottom of the IC. For PGA ICs, pin assignment should be determined by examining the data book with the particular IC in it.", "The IC shown below is the Leaded (or Leadless) Chip Carrier (LCC). The LCC has pins in the same arrangement as the SOJ, each lead being shaped like a J. Remember, these types of ICs are inserted into a socket...", "The IC shown below is the Pin Grid Array (PGA) package. The PGA has pins that exit the bottom of the IC. For PGA ICs, pin assignment should be determined by examining the data book with the particular IC in it..."], "jumps": ["P2280", "P2260", "P2285", "P2270", "PGA"]}, {"id": "P2285", "text": ["Identify the package type of the IC shown below.", "Identify the package type of the IC shown below............"], "jumps": ["P2280"]}, {"id": "P2286", "text": [], "jumps": []}, {"id": "P2287", "text": ["Remember, the DIP package has two rows of pins, hence the word Dual. The IC shown below has multiple pins exiting the bottom of the chip package. These pins are in a pin grid array."], "jumps": []}, {"id": "P2288", "text": ["Remember, the Flat-Pack has two rows of pins leaving straight out of  the package. The IC shown below has multiple pins exiting the bottom of the chip package. These pins are in a pin grid array.", "Remember, the Flat-Pack has two rows of pins leaving straight out of the package. The IC shown below has multiple pins exiting the bottom of the chip package. These pins are in a pin grid array."], "jumps": []}, {"id": "P2290", "text": ["As you can see, there are many different types of IC packages and pin arrangements. However, there are many more types than the ones we have discussed. These are just the basic package types. As industry needs change, different package types are likely to follow.", "As you can see, there are many different types of IC packages and pin arrangements. However, there are many more types than the ones we have discussed. These are just the basic package types. As industry needs change, different package types are likely to follow..."], "jumps": ["P2910", "P2285"]}, {"id": "P2910", "text": ["This completes the information on IC CIRCUIT CONSTRUCTION.", "This completes the information on IC CIRCUIT CONSTRUCTION.."], "jumps": ["P2001", "P2290"]}, {"id": "P2920", "text": ["1.  Monolithic ICs are created using different layers of doped\n     materials, and using different techniques; oxidation,\n     photochemical, chemical, evaporation, and depositing.", "1. Monolithic ICs are created using different layers of doped materials, and using different techniques; oxidation, photochemical, chemical, evaporation, and depositing."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2.  There are three different factors to deal with when packaging\n     an IC; packaging material, package shape, pin arrangement.\n     The packaging material for IC's can be ceramic, plastic,\n     glass, or metal.", "3.  For package shape and pin arrangement, there are many\n     different varieties. The illustration shows groups of some\n     different package types and pin arrangements. The\n     application will help to determine which package type and pin\n     arrangement will be used.", "2. There are three different factors to deal with when packaging an IC; packaging material, package shape, pin arrangement. The packaging material for IC's can be ceramic, plastic, glass, or metal...tal....", "Ceramic Plastic Glass - Metal", "3. For package shape and pin arrangement, there are many different varieties. The illustration shows groups of some different package types and pin arrangements. The application will help to determine which package type and pin arrangement will be used."], "jumps": ["P2940", "P2920", "P2999", "P2930"]}, {"id": "P2999", "text": ["You have completed the Summary. \nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.."], "jumps": ["P2001", "P2940"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3020", "text": ["Knowing the electrical and functional characteristics of an IC is essential for proper operation. The operational information is not printed on the IC, but the information can be found by using the number printed on the IC.", "Unless you have used this IC before, from just looking at the IC below you cannot determine the electrical or functional characteristics of this IC. There are two general ways that the information about this IC can be retrieved.", "Unless you have used this IC before, from just looking at the IC below you cannot determine the electrical or functional characteristics of this IC. There are two general ways that the information about this IC can be retrieved..."], "jumps": ["P3030", "P3001", "P3020"]}, {"id": "P3040", "text": ["The first method we will look at is the data book. This method will give you the most information. Examine the IC and notice the classification number and manufacturer. In the example below, the classification number is SN74LS11 and the manufacturer is identified by the logo.", "The first method we will look at is the data book. This method will give you the most information. Examine the IC and notice the classification number and manufacturer. In the example below, the classification number is SN74LS11 and the manufacturer is identified by the logo..."], "jumps": ["P3020"]}, {"id": "P3050", "text": ["In most cases you will know the general application of the IC, in our example we know that we are using a digital gate IC. So far we know the make and general classification of the IC. We can use this to select the data book we need.", "In most cases you will know the general application of the IC, in our example we know that we are using a digital gate IC. So far we know the make and general classification of the IC. We can use this to select the data book we need...", "Numerical Index SN7400............................101 SN7LS00..........................100 SN7401............................103 SN74LS01........................103 SN7402............................105 SN74LS02........................105 SN74S02..........................105 SN7403............................107 SN74LS03........................107 SN74S03..........................107 SN7404............................109 SN74LS04........................109 SN74S04..........................109 666", "Numerical Index SN7405............................111 SN7LS05..........................111 SN74S05..........................113 SN7406............................115 SN7407............................117 SN7408............................117 SN74LS08........................117 SN7409............................121 SN74LS09........................121 SN74S09..........................121 SN7410............................123 SN74LS11........................125 SN7412............................127 77"], "jumps": ["P3040"]}, {"id": "P3060", "text": ["The data book we will use to reference this IC is the Nida Digital Gates TTL Logic data book. If you know that a particular company makes the IC, but are unsure of the IC type, use the numerical index to see if that IC is in that particular data book.", "The data book we will use to reference this IC is the Nida Digital Gates TTL Logic data book. If you know that a particular company makes the IC, but are unsure of the IC type, use the numerical index to see if that IC is in that particular data book...", "SN54LS11,SN54S11 SN74LS11,SN74S11 Triple 3 - Input AND Description Packages Symbol Function Diagram Table Recommended Op conditions E lectrical Characteristics 125"], "jumps": ["P3040"]}, {"id": "P3070", "text": ["The numerical index lists the IC's contained in the book or a series of books, and what page or book contains the information. If the IC isn't in the data book, try another one from the same company.", "The numerical index lists the IC's contained in the book or a series of books, and what page or book contains the information. If the IC isn't in the data book, try another one from the same company..."], "jumps": ["P3040"]}, {"id": "P3080", "text": ["Once you have located the data book containing the IC you are referencing, turn to the page indicated in the numerical index. At the top of the page you will see a list of IC's labeled. One of them should be the same as your IC.", "Once you have located the data book containing the IC you are referencing, turn to the page indicated in the numerical index. At the top of the page you will see a list of IC's labeled. One of them should be the same as your IC..."], "jumps": ["P3040"]}, {"id": "P3090", "text": ["Since one type of IC may have a few varieties with minor differences, all the types will be grouped together like the example below; SN54LS11, SN54S11, SN74LS11, a Triple 3-input AND gate.", "Since one type of IC may have a few varieties with minor differences, all the types will be grouped together like the example below; SN54LS11, SN54S11, SN74LS11, a Triple 3-input AND gate..."], "jumps": ["P3040"]}, {"id": "P3100", "text": ["Given the IC below, identify the function of the IC.", "Given the IC below, identify the function of the IC........", "SN5442A, SN54LS42 SN7442A, SN74LS42 4 - Line BCD to 10 - Line Decimal Decccccccccccccccges Symbol Function Diagram Table Recommended Op conditions E lectrical Characteristics 125", "SN5414, SN54LS14 SN7414, SN74LS14 Hex Schmitt - Trigger Inverterrrrrrrrrrrrrrrrrrrrrrr", "SN5491A, SN54LS91 SN7491, SN74LS91 8 - Bit Shift Registersssssssssssssssssssssssssssssmbol Function Diagram Table Recommended Op conditions E lectrical Characteristics 125"], "jumps": ["P3040"]}, {"id": "P3101", "text": [], "jumps": []}, {"id": "P3102", "text": ["From the data book page heading you should have determined that the IC had the same heading as the IC labels for the Hex Schmitt-Trigger Inverters.", "SN5442A, SN54LS42 SN7442A, SN74LS42 4 - Line BCD to 10 - Line Decimal Decccccccccccccccges Symbol Function Diagram Table Recommended Op conditions E lectrical Characteristics 125", "SN5414, SN54LS14 SN7414, SN74LS14 Hex Schmitt - Trigger Inverterrrrrrrrrrrrrrrrrrrrrrr", "SN5491A, SN54LS91 SN7491, SN74LS91 8 - Bit Shift Registersssssssssssssssssssssssssssssmbol Function Diagram Table Recommended Op conditions E lectrical Characteristics 125"], "jumps": []}, {"id": "P3110", "text": ["Now let's look at the information that is contained on the data book IC pages. While this information may be spread over many pages, the page shown below shows the general information contained in the data book.", "Now let's look at the information that is contained on the data book IC pages. While this information may be spread over many pages, the page shown below shows the general information contained in the data book...", "SN54LS11,SN54S11 SN74LS11,SN74S11 Triple 3 - Input AND Description Packages Symbol Function Diagram Table Recommended Op conditions E lectrical Characteristics 12555555"], "jumps": ["P3100"]}, {"id": "P3120", "text": ["The description normally tells about; the operation of the IC, variations of different versions, and other useful data that may help in the use of the IC. In our example the description tells what the IC contains, and the temperature range for the operation of different versions.", "The description normally tells about; the operation of the IC, variations of different versions, and other useful data that may help in the use of the IC. In our example the description tells what the IC contains, and the temperature range for the operation of different versions...", "DESCRIPTION These devices contain three independent 3 - input gates. The SN54LS11 and SN54S11 are characterized for operation over the full military temperature range of -55 C to 125 C. The SN74LS11 and SN74S11 are characterized for operation from 0 C to 70 C.."], "jumps": ["P3110"]}, {"id": "P3130", "text": ["The package types show you the different packages and pin assignments for that IC. As you can see from our IC, the two diagrams show the correct pin out. The two different package types for this IC are DIP and LCC.", "The package types show you the different packages and pin assignments for that IC. As you can see from our IC, the two diagrams show the correct pin out. The two different package types for this IC are DIP and LCC......."], "jumps": ["P3120"]}, {"id": "P3140", "text": ["For Digital ICs, data books also provide a logic diagram, logic symbol, and a function table if applicable. For our example all three of these are used. The logic  diagram and symbol represent two ways to illustrate the contents of the IC.", "For Digital ICs, data books also provide a logic diagram, logic symbol, and a function table if applicable. For our example all three of these are used. The logic diagram and symbol represent two ways to illustrate the contents of the IC..."], "jumps": ["P3150", "P3130"]}, {"id": "P3150", "text": ["While the logic diagram and symbol illustrate the contents of the IC, a schematic is provided to show all the components of the IC, not grouped into devices. The digital AND gates are shown as their actual components; resistors, diodes, and transistors.", "While the logic diagram and symbol illustrate the contents of the IC, a schematic is provided to show all the components of the IC, not grouped into devices. The digital AND gates are shown as their actual components; resistors, diodes, and transistors..."], "jumps": ["P3160", "P3140"]}, {"id": "P3160", "text": ["The operating voltage levels for inputs and outputs are listed in the Recommended Operating Conditions table. For example, this table shows the supply voltage should be adjusted to approximately 5V.", "The operating voltage levels for inputs and outputs are listed in the Recommended Operating Conditions table. For example, this table shows the supply voltage should be adjusted to approximately 5V...", "Vcc Supply voltage 4.5 5 5.5 4.8 5 5.2 V Vih High-level input voltage 2 2 V Vil Low-level input voltage 0.7 0.8 V Ioh High-level output current -0.4 -0.4 mA Iol Low-level output current 4 8 mA Ta Operating free-air temperature -55 125 0 70"], "jumps": ["P3170", "P3150"]}, {"id": "P3170", "text": ["The electrical characteristics table lists the IC conditions based on recommended operating voltage levels. Most of these values are used by an electrical engineer and not by a technician.", "Vik Vcc=MIN, Ii=-18mA -1.5 -1.5 V Voh Vcc=MIN, Vih=2V, Ioh=-0.4mA 2.5 3.4 2.7 3.4 V Vol Vcc=MIN, Vil=MAX, Iol=4mA 0.3 0.4 0.3 0.4 V Ii Vcc=MIN, Vi=7.0V 0.1 0.1 mA Iih Vcc=MAX, Vi=2.7V 20 20 mA Iil Vcc=MAX, Vi=0.4V -0.4 -0.4 mA Ios Vcc=MAX -20 -100 -20 -100 mA Icch Vcc=MAX, Vi=4.5V 1.8 3.6 1.8 3.6 mA Iccl Vcc=MAX, Vi=0.0V 3.3 6.6 3.3 6.6 mAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "Electrical Characteristicssssssssssssssssss", "PAR TEST CONDITIONSXXXXXXXXXXXXXXXXXX"], "jumps": ["P3180", "P3160"]}, {"id": "P3180", "text": ["The last section we are concerned with is the typical characteristics. This data is normally supplied for a linear (Analog) IC. Our IC is digital so this section contains no diagrams. The picture below illustrates some typical characteristic diagrams for a particular linear IC.", "The last section we are concerned with is the typical characteristics. This data is normally supplied for a linear (Analog) IC. Our IC is digital so this section contains no diagrams. The picture below illustrates some typical characteristic diagrams for a particular linear IC...", "Maximum Peak-to-Peak Output Voltage vs. Frequency", "LM101A, LM201A, LM301A HIGH PERFORMANCE OPERATIONAL AMPLIFIERSS", "Typical Characteristicsicssssssssssssssssss"], "jumps": ["P3190", "P3170"]}, {"id": "P3190", "text": ["It is important to realize that all the information we have covered may not be contained in every data book. Different manufacturers have different standards.", "It is important to realize that all the information we have covered may not be contained in every data book. Different manufacturers have different standards..", "SN54LS11,SN54S11 SN74LS11,SN74S11 Triple 3 - Input AND Description Packages Symbol Function Diagram Table Recommended Op conditions E lectrical Characteristics 125"], "jumps": ["P3200", "P3180"]}, {"id": "P3200", "text": ["Most data books contain a section called general information. In this section, other data printed on an IC may or may not be described and defined."], "jumps": ["P3210", "P3190"]}, {"id": "P3210", "text": ["Now that we have referenced an IC using a data book, let's reference an IC using our second resource, the IC technical guide and cross reference.", "Technical Guide and Cross Referencee"], "jumps": ["P3220", "P3190"]}, {"id": "P3220", "text": ["This type of re let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
