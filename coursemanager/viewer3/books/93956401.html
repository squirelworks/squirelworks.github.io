const book = {"title": "93956401", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ............................"], "jumps": []}, {"id": "P1", "text": ["Title: INTRODUCTION TO SYNCHROSasd fasfd asdf asdf sadf", "Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P10", "text": ["Hello, this lesson is about:s about: about:"], "jumps": []}, {"id": "P100", "text": ["w State the definition of a synchro. w Identify synchro schematic symbols. w Identify the basic design of a synchro. w Demonstrate knowledge of the function of the Torque Transmitter and the Torque receiver..."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["Synchros are widely used in military and industrial applications."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Tanks use synchros to control the movement of gun turrets.", "[[[[[[[[[[[[[ G666666666666666666666666666666666666666666"], "jumps": ["P420", "P400", "P"]}, {"id": "P420", "text": ["Satellite systems are also controlled by synchros."], "jumps": ["P400", "P430"]}, {"id": "P430", "text": ["The space shuttle uses synchros to control the movement of its robotic arm.", "Large ships use synchros to control rudder positioning."], "jumps": ["P440", "P400", "P450", "P430"]}, {"id": "P450", "text": ["These are just a few examples of the areas where you will find synchro systems."], "jumps": ["P430", "P460"]}, {"id": "P460", "text": ["Let's begin the lesson on INTRODUCTION TO SYNCHROS........................"], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Basic synchros are rotary, electromechanical position-sensing devices. This means the movement of one device produces a voltage that causes another device to move.."], "jumps": ["P1025", "P1001"]}, {"id": "P1025", "text": ["Synchros rapidly and accurately transmit information between equipment and stations in the form of voltages.e movement of the second device (receiver).."], "jumps": ["P1020", "P1030"]}, {"id": "P1027", "text": ["There are two parameters that apply to all synchros: 1. All synchros operate on AC voltages, usually 26 vac or 115 vac. 2. The AC voltages is either 60 Hz or 400 Hz, usually 400 Hz due to their size and accurancy............t the three outputs of the stator indicate the exact position of the rotor..", "Never connect a 400 Hz synchro to 60 Hz voltages. The reduced impedance results in excessive flow and the windings will quickly burn out."], "jumps": ["P1060", "P1020"]}, {"id": "P1030", "text": ["The two basic components of a synchro are the stator and the rotor. ransmitter). As the voltage changes the movement of the second device (reciever).."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The rotor is made with a single winding. Single phase AC voltage at either 60 Hz or 400 Hz is fed into the winding through a commutator to slip rings. The stator is comprised of three windings in a \"Y\" configuration."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The windings of the stator have a common end and are spaced 120", "apart. The magnetic field generated by the rotor induces energy in the windings of the stator, and with the arrangement of the windings, the voltage and the phase relationship at the three outputs of the stator indicate the exact position of the rotor.."], "jumps": ["P1060", "P1030"]}, {"id": "P1060", "text": ["Think of the rotor as the primary of a transformer. As with any transformer, the magnetic field developed in the primary induces electrical energy in the secondary windings.the 0", "position is reached and the cycle again repeats."], "jumps": ["P1065"]}, {"id": "P1065", "text": ["The Rotor (R1 and R2), turns into an electromagnet when it is supplied with an excitation voltage of 115 VAC. The resultant magnetic field of the rotor induces voltages into Stator (S1,S2, and S3) windings corresponding to their angular relationship...e outputs of the stator indicate the exact position of the rotor..", "-26 VAC 52VAC", "52 VAC 52VACC"], "jumps": ["P1070"]}, {"id": "P1070", "text": ["Maximum voltage (52 VAC) is induced into the stator winding when the rotor and stator are in exact alignment. With a standard turn ratio between rotor and stator windings of 2.2:1 (115VAC/2.2 = 52VAC)...genergenerated in a stator winding when the rotor and the stator winding are in exact alignment.", "-26 VAC 52VAC"], "jumps": []}, {"id": "P1080", "text": ["45 VAC 52VACC", "The minimum voltage, zero volts AC, is generated when the rotor is positioned 90", "from a given stator winding. The lines of flux cut the secondary windings at 90", "0 VAC 52VACCC", "-45 VAC 52VAC"], "jumps": []}, {"id": "P1082", "text": ["For ease of explanation, let's look at the induced voltage on only on stator winding. In practical applications all three stator windings voltages are varying between 0 and", "52 VAC.2.2 = 52VAC)...genergenerated in a stator winding when the rotor and the stator winding are in exact alignment."], "jumps": []}, {"id": "P1084", "text": [") the induced voltage on the stator windings will vary from (+ 52 VAC through - 52 VAC).e of explanation, lets look at the induced voltage on only on stator winding. In practical applications all three stator windings voltages are varying between 0 and"], "jumps": []}, {"id": "P1086", "text": ["Using same theory of operation, a three stator output produces the same waveforms except each output waveform is displaced 120", "from the previous one. The amount of induced voltage depends on the angular relationship between rotor and stator..n practical applications all three stator windings voltages are varying between 0 and"], "jumps": []}, {"id": "P1090", "text": ["the induced voltages at stator windings S2 varies from", "less energy is developed in the secondary as the rotor's magnetic field has less effect as the rotor approaches 90"], "jumps": []}, {"id": "P1120", "text": ["If you were to graph the S2 output as compared to the constant input of the rotor you'd see the slow decrease of voltage in S2 up to the 90", "point where zero volts is measured and then the increase of voltage again BUT in the opposite direction due to the reversed phase relation caused by rotation of the primary."], "jumps": []}, {"id": "P1130", "text": ["position, the secondary energy decreases to the 270", "position where the output again changes the phase angle and begins building again until the 0", "position is reached and the cycle again repeats."], "jumps": []}, {"id": "P1140", "text": ["Synchros use a single energized rotating primary winding on the rotor and three stationary secondary windings on the stator. The combination used ensures only one voltage combination for any position in the rotation of the rotor. te direction due to the reversed phase relation caused by rotation of the primary."], "jumps": []}, {"id": "P1142", "text": ["However, induced voltages at one stator winding cannot be measured because they are not physically accessible. With rotor voltage at 115 VAC, the maximum voltage induced between any two windings is 90 VAC. rotation of the rotor. te direction due to the reversed phase relation caused by rotation of the primary."], "jumps": []}, {"id": "P1144", "text": ["We know this because when the rotor is moved to 90 degrees in relation to one winding, it is displaced 30 degrees from each of the other two causing 45 VAC to be induced into the other two windings. When the voltage is measured across those windings, it will equal 90 VAC.relation caused by rotation of the primary."], "jumps": []}, {"id": "P1150", "text": ["Since one side of the secondary windings are common, the three outputs are each a combination of two adjacent secondary windings. When the two windings are in phase the output voltage is added. This would be when the output voltage is increasing during rotation."], "jumps": []}, {"id": "P1160", "text": ["When the adjacent windings are out of phase due to the rotation of the primary, the voltage is decreasing at the output. . The combination used ensures only one voltage combination for any position in the rotation of the rotor..."], "jumps": ["P1170"]}, {"id": "P1170", "text": ["The AC voltage developed at three windings in the secondary remains constant as long as the rotor remains in one position and varies with the slightest movement of the rotor."], "jumps": []}, {"id": "P1180", "text": ["Of course, all this rotation control means nothing unless something can be done with it. This is where the synchronization comes in. We've been reviewing the transmitter portion of a simple synchro system. Review the schematic diagram while reading the following pages."], "jumps": []}, {"id": "P1190", "text": ["The simplest synchro system consists of a transmitter and a receiver. The rotor for both the transmitter and the receiver are driven from the same single phase AC source and stay in constant phase regardless of the rotational position."], "jumps": []}, {"id": "P1200", "text": ["The stator windings are paralleled between the transmitter and receiver. S1 S2 and S3 of the transmitter are tied to S1, S2 and S3 of the receiver. Notice that the voltages at S1, S2 and S3 are at equal potentials with no current flow. This is called correspondence."], "jumps": []}, {"id": "P1210", "text": ["When the TX rotor is moved, S1 has the strongest magnetic field and largest current flow while current and voltage potential in S2 has decreased. There is now a difference in stator potentials between the TX and the TR... voltage relationship of the stator windings."], "jumps": []}, {"id": "P1220", "text": ["Current flows in the TR stator until the voltage potential of S1 equals the 52 VAC applied from S1 of field and move until it is back in correspondence.otor movement, however minor, is duplicated by the receiver rotor."], "jumps": ["P1230"]}, {"id": "P1230", "text": ["Which Synchro system is in correspondence?................."], "jumps": ["P1180"]}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1232", "text": ["In a simple synchro system with a transmitter and receiver, the receiver is electrically forced to rotate to the same angular position as the transmitter."], "jumps": []}, {"id": "P1240", "text": ["A synchro is schematically represented showing one primary winding and three secondary windings."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["Synchros are also represented with this schematic symbol when it is important to see the external connections to the synchros."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["The primary winding represents the rotor while the secondary windings represent the stators."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["The letters R and S are used to identify the rotor and stator connections."], "jumps": ["P1280", "P1240"]}, {"id": "P1280", "text": ["The synchro is essentially a transformer with a rotatable primary winding (rotor) and three secondary windings (stators) spaced 120"], "jumps": ["P1290", "P1240"]}, {"id": "P1290", "text": ["Select the rotor on this synchro..........................."], "jumps": ["P1240"]}, {"id": "P1291", "text": [], "jumps": []}, {"id": "P1292", "text": ["You selected the stator winding. The rotor winding is the primary......."], "jumps": []}, {"id": "P1300", "text": ["The simple synchro system we've used thus far is called a Torque Synchro. Another form of synchro is the Control Synchro. This is the schematic symbol for both types."], "jumps": ["P1290", "P1310"]}, {"id": "P1310", "text": ["Torque synchros provide a mechanical output and are used in synchro systems with a light load."], "jumps": ["P1300", "P1320"]}, {"id": "P1320", "text": ["Torque synchros are well suited for tasks such as positioning indicator dials on instrument panels."], "jumps": ["P1300", "P1330"]}, {"id": "P1330", "text": ["Control synchros provide an electrical output and are used in synchro systems with a heavy load."], "jumps": ["P1340", "P1300"]}, {"id": "P1340", "text": ["Control synchros can be used to position radars and other heavy equipment."], "jumps": ["P1300", "P1350"]}, {"id": "P1350", "text": ["The first letter indicates the classification of the synchro: - T for Torque synchros - C for Control synchros"], "jumps": ["P1300", "P1360"]}, {"id": "P1360", "text": ["The second letter in the device abbreviation is the device type. The Differential, Transformer, and Transolver will be discussed in later lessons."], "jumps": ["P1370", "P1300"]}, {"id": "P1370", "text": ["There are 3 types of Control synchros:....................."], "jumps": ["P1375", "P1360", "P1380"]}, {"id": "P1375", "text": ["Electrical output of rotor represents the sine of the difference between the desired position and the actual position.", "Electrical output of rotor represents the difference of the rotor angle and CX position.", "Electrical output from stator represents rotor position.", "Electrical data applied to stator, rotor positioned mechanically or manually.", "CX output applied to stator, rotor positioned by modifying signal.", "Rotor positioned mechanically or manually.", "Control Transformer or Control Transolverrr"], "jumps": []}, {"id": "P1380", "text": ["There are 4 types of Torque synchros:......................"], "jumps": ["P1385", "P1370", "P1390"]}, {"id": "P1385", "text": ["Rotor positions to difference between the two inputs.", "Electrical output of rotor represents the difference of the rotor angle and TX position.", "Electrical output from stator represents rotor position.", "Electrical data from two sources, TX and TDX.tioned mechanically or manually.", "TX output applied to stator, rotor positioned by modifying signal.", "Rotor positioned mechanically or manually."], "jumps": []}, {"id": "P1390", "text": ["A torque transmitter (TX) and a torque receiver (TR) make up a simple torque synchro system."], "jumps": ["P1380", "P1400"]}, {"id": "P1400", "text": ["A control transmitter (CX) and a control transolver (CT) make up a simple control synchro system."], "jumps": ["P1390", "P1910"]}, {"id": "P1410", "text": ["A control transmitter (CX) and a control transolver (CT) make up a simple control synchro system."], "jumps": ["P1390", "P1910"]}, {"id": "P1415", "text": ["TRANSOLVER - a synchro used as a transmitter or control transformer. A transolver has a two-phase cylindrical rotor within a three-phase stator. ith no degradation of accuracy or nulls. er with no degradation of accuracy or nulls."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on SYNCHROS. 1 TITLE........"], "jumps": ["P1001", "P1410"]}, {"id": "P1920", "text": ["1. The purpose of a synchro is to transfer angular information in the form of voltage."], "jumps": ["P1001", "P1930"]}, {"id": "P1930", "text": ["2. The amount of voltage produced is proportional to the amount of movement in the transmitter."], "jumps": ["P1920", "P1940"]}, {"id": "P1940", "text": ["3. The receiver is electrically forced to reposition in response to the voltage applied."], "jumps": let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}

document.getElementById("back").addEventListener("click", () => show(i - 1));
