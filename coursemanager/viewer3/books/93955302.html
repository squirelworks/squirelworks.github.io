<script>
const book = {"title": "93955302", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: AC MOTORSE sdf sdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe AC Motor theory of operation. w Describe AC Motor construction. w Discuss terms related to AC Motors such as; synchronous machine, synchronous speed, slip speed, etc. w Discuss the equivalent model of an induction motor transformer.", "w Observe an AC Motor in action. w Verify AC Motor operation for various line voltage inputs. w Experimentally determine synchronous speed, slip speed % and synchronous speed.........."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 410 Frequency Counter XXXXXnt", "3. Nida Model 280 Rotating Machinery Trainer"], "jumps": []}, {"id": "P330", "text": ["Nida Model 280 Rotating Machinery Trainer"], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P350", "text": [], "jumps": []}, {"id": "P361", "text": [], "jumps": []}, {"id": "P362", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson you will learn about the AC motor."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["AC motors, just like DC motors, convert electrical energy into mechanical energy."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["AC motors use AC or Alternating Current as an electrical input source."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["Because of an AC input signal, AC motors are much different in their theory of operation than the DC motor."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["Let's begin the lesson on AC MOTORS.TLE..................................."], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["AC motors, just like DC motors, are classified as continuous devices. Rotating Machinery Motor Incremental Continuous DC AC"], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["As you know, DC motors have certain operating characteristics. Motor Characteristics 1. High Starting Torque 2. Speed Control Capabilities 3. Large Starting Current", "DC Motor Characteristics 1. High Starting Torque 2. Speed Control Capabilities 3. Large Starting Current"], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["When an application requires one or more of these features, a DC motor is usually used."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["When these features are not required, the AC motor is usually used."], "jumps": ["P1060", "P1030"]}, {"id": "P1060", "text": ["Since AC power is used in every home and offices worldwide, the AC motor is the most popular device. AC Supply"], "jumps": ["P1070", "P1030"]}, {"id": "P1070", "text": ["Based on their construction, AC motors can be classified into three categories: universal, induction and synchronous."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["The universal motor is essentially a DC motor with AC applied."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["Synchronous motors are either large horse power or special application devices, seldom found by electronics technicians."], "jumps": ["P1100", "P1070"]}, {"id": "P1100", "text": ["Applications for AC induction motors include: machines, pumps, spindles and clocks."], "jumps": ["P1110", "P1070"]}, {"id": "P1110", "text": ["AC and DC motors are classified as what type?.............."], "jumps": ["P1070"]}, {"id": "P1111", "text": [], "jumps": []}, {"id": "P1112", "text": ["Induction and synchronous motors are only classified as AC motors."], "jumps": []}, {"id": "P1120", "text": ["All motors require the same basic criteria for motor action to occur."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["There are, however, some major differences between the DC and AC motor construction."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["AC motor rotors do not have turns of wire connected externally to a voltage source through a commutator assembly."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["AC rotors (inductor type) have a distinct appearance and are often referred to as squirrel cage rotors."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["The squirrel cage rotor is simpler and less expensive to manufacture than the DC rotor."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["The squirrel cage rotor requires no commutator or brush assembly. This reduces cost, maintenance and sparking."], "jumps": ["P1180", "P1150"]}, {"id": "P1180", "text": ["The stator of an AC motor is similar to the stator of a DC motor."], "jumps": ["P1190", "P1150"]}, {"id": "P1190", "text": ["In both motor types, the field windings are placed on pole pieces to generate a magnetic field."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["Which part listed below is used in AC motors only?........."], "jumps": ["P1180"]}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1202", "text": ["A stator is common to both DC and AC motors and works with the rotor to generate motor action."], "jumps": []}, {"id": "P1203", "text": ["The commutator and brushes are common to a DC motor only..."], "jumps": []}, {"id": "P1210", "text": ["Since an AC induction motor's rotor has no commutator, brushes or applied voltage source, it cannot generate a field."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["The only field induced in an AC motor is a result of the windings around the pole pieces."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["If an AC induction motor has only one field in the stator, how can motor action occur?"], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["To understand AC motor action, let's use 3 moving magnets: 2 stators and 1 rotor."], "jumps": ["P1250", "P1230", "Pivot"]}, {"id": "P1250", "text": ["Assume that the outside magnets (stator magnets) rotate and that the distance between the two magnets is small."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["Attracted forces between the two magnets cause the rotor magnet to follow."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["The rotor will rotate around the pivot point."], "jumps": ["P1280", "P1240"]}, {"id": "P1280", "text": ["If the rotor magnet keeps pace with the stator magnets, then the magnets are said to be synchronized."], "jumps": ["P1290", "P1240"]}, {"id": "P1290", "text": ["If this rotation could be maintained, motor action would then exist."], "jumps": ["P1300", "P1240"]}, {"id": "P1300", "text": ["An actual AC inductor motor is slightly more complicated than three moving magnets."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["The stators of an AC induction motor are fixed and do not rotate."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["The rotor of an AC induction motor is not a magnet."], "jumps": ["P1330", "P1300"]}, {"id": "P1330", "text": ["To understand an actual AC induction motor, consider two sine waves, 90", "T0 T1 T2 T3 T4 T5"], "jumps": ["P1340", "P1300"]}, {"id": "P1340", "text": ["The two sine waves are applied to different pole pairs (2 poles) of the induction motor."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["If you consider the stator windings to be purely inductive, stator currents will also be 90 degrees out of phase."], "jumps": ["P1360", "P1340"]}, {"id": "P1352", "text": ["If you consider the stator windings to be purely inductive, stator currents will also be 90 degrees out of phase."], "jumps": ["P1360", "P1340"]}, {"id": "P1355", "text": ["PURELY INDUCTIVE- The ability for the stator to produce the largest possible magnetic field (maximum power) across it, without having any resistance. This resistance would cause some of the power to be dissipated in the form of heat."], "jumps": []}, {"id": "P1360", "text": ["These stator currents (not voltages) cause pulsating magnetic fields that rotate in a circle around the rotor."], "jumps": ["P1370", "P1352"]}, {"id": "P1370", "text": ["Initially, 1 is at its zero crossing point, while 2 is at maximum.", "T0 T1 T2 T3 T4 T5"], "jumps": ["P1380", "P1352"]}, {"id": "P1380", "text": ["Since 2 current is maximum, a magnetic field is developed across the poles connected to 2."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["At line T1, 2 is zero and 1 is maximum. This corresponds to maximum 1 current and minimum 2 current."], "jumps": ["P1400", "P1370"]}, {"id": "P1400", "text": ["Since 1 current is maximum, a magnetic field is developed across the poles connected to 1."], "jumps": ["P1410", "P1370"]}, {"id": "P1410", "text": ["At time T2, 1 is zero and 2 now has it's maximum negative value."], "jumps": ["P1420", "P1370"]}, {"id": "P1420", "text": ["Because 2 is negative, it corresponds to a reversed polarity magnetic field on the connected stator poles."], "jumps": ["P1430", "P1370"]}, {"id": "P1430", "text": ["At time T3, 2 is zero and 1 is at it's maximum negative value."], "jumps": ["P1440", "P1370"]}, {"id": "P1440", "text": ["Because 1 is negative, it corresponds to a reversed polarity magnetic field on the connected stator poles."], "jumps": ["P1450", "P1370"]}, {"id": "P1450", "text": ["At time T4, each waveform has completed one cycle and the process begins again."], "jumps": ["P1370"]}, {"id": "P1460", "text": ["The changing amplitude of the waveforms cause the stator magnetic fields to constantly expand and contract, as well as rotate."], "jumps": []}, {"id": "P1470", "text": ["Because of expanding and contracting stator magnetic fields, rotor current is induced. This is due to induction."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["This is how the motor derives it's name, the AC induction motor."], "jumps": ["P1490", "P1460"]}, {"id": "P1490", "text": ["All squirrel cage rotors have induced current flow through the connecting rods via the shorting rings."], "jumps": ["P1500", "P1460"]}, {"id": "P1500", "text": ["The induced currents in the rotor will induce a magnetic field in the rotor."], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["The induced magnetic field in the rotor is attracted to the stator magnetic field."], "jumps": ["P1490"]}, {"id": "P1520", "text": ["As the stator field changes, the rotor field follows due to this attraction."], "jumps": ["P1510"]}, {"id": "P1530", "text": ["Due to the attraction of the stator field and the rotor field, motor action occurs."], "jumps": ["P1540", "P1510"]}, {"id": "P1540", "text": ["What induces current in the rotor of an induction motor?..."], "jumps": ["P1510"]}, {"id": "P1541", "text": [], "jumps": []}, {"id": "P1542", "text": ["Stator voltage is related to stator current only. The voltage cannot induce a rotor current."], "jumps": []}, {"id": "P1543", "text": ["Stator current induces a stator magnetic field, but will not induce rotor current."], "jumps": []}, {"id": "P1550", "text": ["What induces a rotor magnetic field in an induction motor?."], "jumps": ["P1540"]}, {"id": "P1551", "text": [], "jumps": []}, {"id": "P1552", "text": ["Stator current induces a magnetic field...................."], "jumps": []}, {"id": "P1553", "text": ["A stator magnetic field induces a rotor current not a rotor magnetic field."], "jumps": []}, {"id": "P1560", "text": ["The stator magnetic field rotates from pole pair to pole pair."], "jumps": ["P1570", "P1550"]}, {"id": "P1570", "text": ["How fast the stator magnetic field rotates is known as the Field Speed or Field RPM."], "jumps": ["P1580", "P1560"]}, {"id": "P1580", "text": ["Field RPM can easily be calculated. ield RPM Formula 60 () Field RPM = N = Frequency of Input (Hz) N = # of Pole Pairs", "= Frequency of Input (Hz) N= # of pole Pairs"], "jumps": ["P1590", "P1560"]}, {"id": "P1590", "text": ["If the input sine wave has a frequency of 60 Hz and the motor has 4 stator poles, the field RPM equals 1800. Back: P1580"], "jumps": ["P1595"]}, {"id": "P1595", "text": [], "jumps": []}, {"id": "P1600", "text": ["Due to magnetic attraction, the rotor attempts to follow the stator (in rotation)."], "jumps": ["P1590"]}, {"id": "P1610", "text": ["The rotor's RPM always lags behind the stator's magnetic field RPM."], "jumps": ["P1620", "P1600"]}, {"id": "P1620", "text": ["This is called slip RPM because the rotor slips or lags behind the stator magnetic field."], "jumps": ["P1630", "P1610"]}, {"id": "P1630", "text": ["How fast the rotor actually rotates is termed shaft speed.."], "jumps": ["P1640", "P1610"]}, {"id": "P1640", "text": ["Shaft RPM can be calculated since it is the difference between the Field RPM and the Slip RPM. Shaft RPM Formula Shaft RPM = Field RPM - Slip RPM 60 () Shaft RPM = - Slip RPM N", "Shaft RPM = - Slip RPMM"], "jumps": ["P1650", "P1630"]}, {"id": "P1650", "text": ["Since the rotor is always trying to catch up or synchronize with the stator field RPM, the field RPM is commonly called the Synchronous Speed of the armature. eld RPM = Synchronous Speed 60 () = frequency of input (Hz) Field RPM = N N = # of Pole Pairs", "Field RPM = - Slip RPMM", "= Frequency of input (Hz) RPMM", "N = # pf Pole Pairs RPMM"], "jumps": ["P1660", "P1640"]}, {"id": "P1660", "text": ["As an example of shaft speed, assume the motor's synchronous speed is 1800 RPM with a slip speed of 100 RPM. How fast is the motors output shaft spinning? Shaft RPM Formula Shaft RPM = Field RPM - Slip RPM 60 () Shaft RPM = - Slip RPM", "Shaft RPM = - Slip RPMM"], "jumps": ["P1670", "P1650"]}, {"id": "P1670", "text": ["Since synchronous speed is field RPM and slip speed is slip RPM, the motor's output shaft (shaft RPM) is rotating at 1700 RPM. AFT RPM = FIELD RPM - SLIP RPM = Synchronous Speed - Slip Speed = 1800 RPM - 100 RPM Motors Output Shaft = 1700 RPM"], "jumps": ["P1680", "P1660"]}, {"id": "P1680", "text": ["A 1 phase 8 pole induction motor is operated at 60 Hz. What is the synchronous speed of the motor?"], "jumps": ["P1670"]}, {"id": "P1681", "text": [], "jumps": []}, {"id": "P1682", "text": ["Remember, N equals the number of Pole Pairs per phase. In this case, there are 4 Pole Pairs or; FIELD RPM = SYNCHRONOUS SPEED 60() 60() Field RPM = Synchronous Speed = N N 60(60)", "Field RPM = Synchronous Speed ="], "jumps": []}, {"id": "P1690", "text": ["If the synchronous speed of a motor is 1200 RPM and the motor's output shaft is rotating at 1000 RPM, what is the slip speed?"], "jumps": ["P1680"]}, {"id": "P1691", "text": [], "jumps": []}, {"id": "P1692", "text": ["Remember, Field RPM equals synchronous speed and Shaft RPM equals the motors output Shaft speed or; SLIP SPEED FORMULA SLIP SPEED = FIELD RPM - SHAFT SPEED = 1200 - 1000 Field RPM = 1200 Shaft Speed = 1000"], "jumps": []}, {"id": "P1700", "text": ["Looking at an AC induction motor, indicates an inductor (stator) very close to a conductor (rotor)."], "jumps": ["P1710", "P1690"]}, {"id": "P1710", "text": ["Since there is no electrical connection between the stator and rotor, the magnetic field of the stator induces voltage in the rotor coils."], "jumps": ["P1720", "P1700"]}, {"id": "P1720", "text": ["This is identical to transformer action. condary (Rotor) Primary Primary Secondary (Stator) (Stator) (Rotor) Electrical"], "jumps": ["P1730", "P1700"]}, {"id": "P1730", "text": ["Sometimes the stator is called the primary and the rotor is called the secondary."], "jumps": ["P1740", "P1720"]}, {"id": "P1740", "text": ["An equivalent electrical drawing of the stator and rotor is a step down transformer."], "jumps": ["P1750", "P1720"]}, {"id": "P1750", "text": ["A step down transformer has less voltage and more current on the secondary than the primary."], "jumps": ["P1755", "P1720"]}, {"id": "P1755", "text": ["The primary to secondary winding ratio will have a significant effect on current."], "jumps": ["P1760", "P1720"]}, {"id": "P1760", "text": ["Compared to its input current, the output current of a motor is larger."], "jumps": ["P1770", "P1720"]}, {"id": "P1770", "text": ["Remember, torque and current are proportional. The higher the current, the higher the torque."], "jumps": ["P1780", "P1720"]}, {"id": "P1780", "text": ["Rotor current depends on the relative motion between the stator's magnetic field and the conductor (rotor)."], "jumps": ["P1790", "P1720"]}, {"id": "P1790", "text": ["If the rotor is locked (no rotation), there is maximum relative motion between the rotating stator field and the conductor (rotor)."], "jumps": ["P1800", "P1720"]}, {"id": "P1800", "text": ["This produces maximum current and maximum torque."], "jumps": ["P1810", "P1720"]}, {"id": "P1810", "text": ["If the rotor is turning at the same RPM as the stator's magnetic field, there is no relative motion between the rotating stator field and conductor (rotor)."], "jumps": ["P1820", "P1720"]}, {"id": "P1820", "text": ["No current is produced and the torque is zero."], "jumps": ["P1830", "P1720"]}, {"id": "P1830", "text": ["This is an important concept when discussing loaded and unloaded AC motor characteristics."], "jumps": ["P1910", "P1720"]}, {"id": "P1910", "text": ["This completes the information on AC MOTORS.1 TITLE........"], "jumps": ["P1001", "P1720"]}, {"id": "P1920", "text": ["1. AC induction motors are continuous rotating machines that require alternating current as an input. chinery Motor Incremental Continuous DC AC"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. Induction motor rotors are commonly called squirrel cage rotors due to their distinct appearance. orting Ring Shaft AC Induction Motor Rotor Construction"], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. AC motor action is caused by a rotating stator magnetic field. This field is induced by stator current (1 and 2).", "Cross Section of 4 - pole 2 phase AC induction motor"], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. The rotating stator magnetic field also expands and contracts. A rotor current is generated by the principle of induction."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. The rotor current induces a magnetic field which is attracted to the stator field causing motor action."], "jumps": ["P1970", "P1940"]}, {"id": "P1970", "text": ["6. Slip speed equals the Field RPM minus Shaft RPM. AFT RPM FORMULAS FIELD RPM OR SYNCHRONOUS SPEED Shaft RPM = Field RPM - Slip RPM The rotational speed of the stator's magnetic field. 60() Shaft RPM = - Slip RPM SHAFT RPM OR SHAFT SPEED N", "Shaft RPM = - Slip RPMM", "The rational speed of the stator's magnetic field."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7. The field RPM or synchronous speed can be determined by the frequency of the input AC current and the # of pole pairs of the motor. () Field RPM = N", "= Frequency of Input (Hz) N= # of pole Pairs"], "jumps": ["P1999", "P1970"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["In this experiment you will configure the 280 trainer as an AC motor and observe normal motor action."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["You will vary the input line voltage to the AC motor and determine synchronous speed, shaft speed and slip speed."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["You will determine the motors synchronous speed at different input voltages. Shaft Speed % Synchronous Speed = X 100 Synchronous Speed", "% Synchronous Speed = x 100"], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["Let's Begin the Experiment!e..............................."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["Let's begin the experiment. 1. Set the 280 trainer to it's initial control settings."], "jumps": ["P2070", "P2050", "P22000"]}, {"id": "P2070", "text": ["2. Set the Test Console controls to their initial control settings........"], "jumps": ["P2060"]}, {"id": "P2080", "text": ["3. Insert PC130-280 into the PC3 position on the 130 test console. ........"], "jumps": ["P2090"]}, {"id": "P2090", "text": ["4. Connect the 8 pin connector from the PC130-280 card to the PC130-280 connector on the 280 trainer. 80 Trainer 130A Test ConsoleON........................................."], "jumps": ["P2080", "P2110", "P"]}, {"id": "P2110", "text": ["5. Connect the 2 pin connector from the Variac to the 115 VAC input terminals located on the 280 trainer AC motor subpanel."], "jumps": ["P2120", "P2090"]}, {"id": "P2120", "text": ["6. Set the Variac at 0% line voltage (fully counterclockwise) and apply power."], "jumps": []}, {"id": "P2130", "text": ["7. To configure the 280 trainer as an AC motor, perform the following. more details. AC motor PHASE switches - 1 IN AC motor PHASE switches - 1", "AC motor RUN/START switches - IN AC motor PHASE switches - 1"], "jumps": ["P2140", "P2120"]}, {"id": "P2135", "text": ["AC MOTOR CONFIGURATION- Set the Run and Start Switches to IN, and the Phase Switches to 1."], "jumps": ["P"]}, {"id": "P2140", "text": ["8. Increase the % Line control on the Variac until motor action occurs."], "jumps": ["P2150", "P2130", "P2145"]}, {"id": "P2145", "text": ["VARIAC SETTING- Turn the dial until motor action occurs."], "jumps": []}, {"id": "P2150", "text": ["9. Vary the % Line control and observe motor RPM.........."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["As the input voltage increases the Motor RPM _______......."], "jumps": ["P2150"]}, {"id": "P2161", "text": [], "jumps": []}, {"id": "P2162", "text": ["Remember as the applied voltage increases shaft speed also increases."], "jumps": []}, {"id": "P2165", "text": ["The speed does not change as much as a DC motor when the input voltage is adjusted."], "jumps": ["P2167", "P2160"]}, {"id": "P2167", "text": ["Remember, Synchronous speed is set by the frequency of the input voltage times 60 divided by the number of pole pairs."], "jumps": ["P2169", "P2165"]}, {"id": "P2169", "text": ["Slip speed is equal to synchronous speed minus shaft speed."], "jumps": ["P2180", "P2167"]}, {"id": "P2180", "text": ["10. Set Filament Switch to ON. 11. Connect Frequency Counter to the TACH test point on the PC130-280 experiment card."], "jumps": ["P2169"]}, {"id": "P2190", "text": ["12. Adjust the Variac % line control while observing the Frequency Counter."], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["As motor RPM increased, what happened to the frequency?...."], "jumps": ["P2190"]}, {"id": "P2201", "text": [], "jumps": []}, {"id": "P2202", "text": ["The frequency is the output from the motor shaft. member, 1 = Period"], "jumps": []}, {"id": "P2210", "text": ["The frequency that you are observing represents the output from the magnetic pickup of the 280 trainer."], "jumps": ["P2240", "P2200"]}, {"id": "P2240", "text": ["The AC motor on the 280 trainer is currently configured as a 2 phase motor. Each phase has a pole pair with windings. Compute the synchronous speed of the AC motor."], "jumps": ["P2245", "P2210"]}, {"id": "P2245", "text": ["Since the input frequency is 60 Hz, the synchronous speed is 1800 RPM."], "jumps": ["P2250", "P2240"]}, {"id": "P2250", "text": ["The AC motor on the 280 trainer is rated at 110 - 120 VAC. This means that it reaches near 100% synchronous speed at the rated voltage."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["13. Set the 414 Variac % line control to 100%. Determine the motor's output shaft RPM."], "jumps": ["P2270", "P2250"]}, {"id": "P2265", "text": [], "jumps": []}, {"id": "P2270", "text": ["You should have determined a motor shaft speed of approximately 1440 to 1760 RPM depending on motor alignment."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["What is the slip speed of the AC motor?...................."], "jumps": ["P2270", "P2285"]}, {"id": "P2281", "text": [], "jumps": []}, {"id": "P2282", "text": ["Remember, the formula for Slip Speed is, Synchronous Speed - Shaft Speed"], "jumps": []}, {"id": "P2285", "text": ["SLIP SPEED- You will need to know the synchronous speed to calculate slip speed. Synchronous speed was 1800 RPM."], "jumps": []}, {"id": "P2290", "text": ["Calculate the AC motor's synchronous speed percentage by using the following formula. Shaft Speed % Synchronous Speed = X 100 Synchronous Speed", "% Synchronous Speed = x 100"], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["You should have calculated a % synchronous speed between 80 and 98%."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["Ideally, an AC motor would have 100% synchronous speed. This indicates no slip between the stator field and the rotor RPM. This is never possible."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["14. Increase the Variac % line control to 110% of Field Line."], "jumps": ["P2330", "P2310", "P2325"]}, {"id": "P2325", "text": ["INCREASING OF % LINE CONTROL- Increase the dial to 110%."], "jumps": []}, {"id": "P2330", "text": ["15. Determine the motor shaft RPM from the frequency. Remember, frequency equals RPM."], "jumps": ["P2340", "P2320", "P2335"]}, {"id": "P2335", "text": [], "jumps": []}, {"id": "P2340", "text": ["You should have determined a shaft RPM of approximately 1700 - 1790 RPM. Notice how the change is very small. This is due to the AC motor being more dependent on the input frequency, rather than the input voltage..."], "jumps": ["P2370", "P2330"]}, {"id": "P2370", "text": ["If % synchronous speed is SMALL, what can you say about the motor's slip speed?", "Slip speed is independent of synchronous speed"], "jumps": ["P2340"]}, {"id": "P2371", "text": [], "jumps": []}, {"id": "P2372", "text": ["If % synchronous speed is small then there is a large difference between shaft and synchronous speed."], "jumps": []}, {"id": "P2373", "text": ["Slip speed is a result of synchronous speed minus shaft speed. Slip speed is not independent of synchronous speed."], "jumps": []}, {"id": "P2382", "text": ["Remember, an AC motor's speed is more dependent on input frequency than input voltage. This makes an AC motor unsuited for speed control by using voltage levels."], "jumps": ["P2385", "P2370"]}, {"id": "P2385", "text": ["1. Disconnect all test equipment. 2. Turn power OFF to variac and disconnect 2 pin jack from variac to 280 trainer. 3. Remove 8 pin interconnect cable from PC130-280 to the 280 trainer.........."], "jumps": ["P2382"]}, {"id": "P2390", "text": ["4. Return the Test Console to the initial control settings................"], "jumps": ["P2385"]}, {"id": "P2400", "text": ["5. Return the 280 test controls to it's initial control settings.", "4. Return the 280 test controls to it's initial control settings."], "jumps": ["P2410", "P22000"]}, {"id": "P2410", "text": ["6. Remove PC130-280 experiment card and all connecting cables.", "5. Remove PC130-280 experiment card and all connecting cables."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["7. Return all equipment to the proper storage locations.", "8. Return all equipment to the proper storage locations.", "7. Remove power to the Test Console. 8. Return all equipment to the proper storage locations.s."], "jumps": ["P2410"]}, {"id": "P2910", "text": ["This completes the experiment on AC MOTORS. 2 TITLE........"], "jumps": ["P2001", "P2420"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["What does an AC motor need as an electrical input signal?"], "jumps": []}, {"id": "P10211", "text": ["Why is the AC motor the most popular type of rotating machinery used?"], "jumps": []}, {"id": "P10212", "text": ["Which type of AC motor is not commonly seen by a technician?"], "jumps": []}, {"id": "P10213", "text": ["AC and DC motors fall under what classification?"], "jumps": []}, {"id": "P10214", "text": ["The AC induction motor uses what type of rotor?"], "jumps": []}, {"id": "P10215", "text": ["How many turns of wire does an AC induction rotor have?"], "jumps": []}, {"id": "P10216", "text": ["If an AC induction motor has two poles and it is a 3 phase motor, how many pole pairs does it contain?"], "jumps": []}, {"id": "P10217", "text": ["An AC induction motor operates on the principle of _______"], "jumps": []}, {"id": "P10218", "text": ["the difference between rotor RPM and shaft torque.", "the difference between stator field RPM and shaft RPM.", "the sum of the stator field RPM and shaft RPM."], "jumps": []}, {"id": "P10219", "text": ["What generates rotor current in an AC induction motor?"], "jumps": []}, {"id": "P10220", "text": ["What type of AC motor was used on the 280 trainer for this experiment?"], "jumps": []}, {"id": "P10221", "text": ["What was the synchronous speed of the AC motor used in this experiment?"], "jumps": []}, {"id": "P10222", "text": ["AC motors RPM's when the input voltage is increased."], "jumps": []}, {"id": "P10223", "text": ["What percentage of synchronous speed is present when no difference between the stator field and rotor RPM exits."], "jumps": []}, {"id": "P10224", "text": ["If an AC motor has a slip speed of 300 RPM and a shaft speed of 1500 RPM, what is the synchronous speed of the motor?"], "jumps": []}, {"id": "P10225", "text": ["ronous speed (1800 RPM) what is motor shaft speed?", "If an AC motor is operating at 85% of synchronous speed (1800 RPM) what is motor shaft speed?"], "jumps": []}, {"id": "P10226", "text": ["If motor slip speed is small, what do you know about % synchronous speed?"], "jumps": []}, {"id": "P10227", "text": ["The sum of the rotor and stator field RPM", "The difference between rotor and stator field RPM"], "jumps": []}, {"id": "P10228", "text": ["If an AC induction motor has a stator magnetic field speed of 1900 RPM and a slip speed of 300 RPM, how fast is the motor shaft turning?"], "jumps": []}, {"id": "P10229", "text": ["amount of magnetic pick-ups on the shaft", "An AC motor's speed is more dependent on the _______ than on the input voltage."], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
