const book = {"title": "9395T323", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: TROUBLESHOOTING CLOSED LOOP SYSTEMSsdf asdf sadf"], "jumps": []}, {"id": "P10", "text": ["# #\" #& \"\"# &\"###2' &2#&.22&# 25--283-.#285255232/238882-.-5:38832222882282-213:22::82-22225:8-33-22282232.22258558.5822385:235:222283538::2585582::2:", "&&#&# #/2.#.& -8 \"#.-&23..22'/.#212&-2258\"588:52", "### ## /# #/&# \" \"/##\"#/&//..#/..&/28.&...&824/&.88-8588..2222858852.28:582228588358282228258.888:825:583.8828::8228828588828583:35558.555.85::88::85588:88:5555::38::85:::5:5:52::85::88::", ":85:855::83:5:5.5:55:855:52.5:5283822242348522...252...2..82/.4..22//2./..##/.8.#&./#&/..##// ##\",##/## #. / /& # ## ## ## ## ## \" #/# ## /# ## #.\" ./ #//###,//.&/#.\"#/.##/./#&/2.&/.../&//....//&2222.2/252.&28.8522582.824828828::255:::5:", "/,,,,,,,,,,,,,/, ,, ,,,,,,6, ,,,6,,, ,,,,,//6//6,,,,/6/,,,/,4/,,/6/4494,,494/6846446/4884664;44;889448489888<8648<<8;44;88988<88948;98<44<;:<44<<8;44<48<<8;48<48<88;48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["1. Troubleshooting Closed Loop Systems 1 line item 2 here. item 2 here.e.e.", "2. Experimentwo Title Enter objective 1 line item 2 here. item 2 here.e.e.", "w Describe the four-step process of basic troubleshooting. w Describe component isolation, signal tracing and signal injection..", "w Troubleshoot and fault isolate to the circuit level of a closed loop feedback system.", "w Trace signal flow through a closed loop feedback system. w Troubleshoot and fault isolate to the circuit level of a closed loop feedback system."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Experiment Card PC130-179er or equivalent"], "jumps": []}, {"id": "P301", "text": [], "jumps": []}, {"id": "P320", "text": [], "jumps": ["P"]}, {"id": "P321", "text": [], "jumps": []}, {"id": "P322", "text": ["TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT"], "jumps": []}, {"id": "P323", "text": [], "jumps": []}, {"id": "P324", "text": [], "jumps": []}, {"id": "P400", "text": ["This lesson introduces the student to the principles of troubleshooting closed loop feedback systems."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["There are many different methods of controlling motors by using feedback. No matter how complicated the feedback system may appear, a systematic troubleshooting approach will always yield satisfactory results..."], "jumps": []}, {"id": "P420", "text": ["Troubleshooting is a diverse process that involves theoretical knowledge, test equipment competency, and an understanding of equipment operation, all blended together with a little intuition."], "jumps": []}, {"id": "P430", "text": ["A particular symptom may be caused by any number of reasons, many of which will not seem logical. Therefore, the best troubleshooters are those who can exercise both logical and creative thought processes..."], "jumps": []}, {"id": "P440", "text": ["Let's begin the lesson on TROUBLESHOOTING CLOSED LOOP SYSTEMS..............."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": ["P440"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The experienced troubleshooter knows that many factors come into play when trying to solve a system fault, and will not be shocked that a suspected component is not actually the problem."], "jumps": ["P1001"]}, {"id": "P1030", "text": ["The troubleshooting process has been and will continue to be defined in several different ways. Different organizations may use different terminology and divide the process into a different number of phases. The following terms can be used for the first phase of the troubleshooting process: Setup check * Functional test * Circuit analysisssss"], "jumps": []}, {"id": "P1040", "text": ["Technicians will be exposed to many terms and number of varying troubleshooting phases. No single recipe for troubleshooting exists; only time and practice and adherence to tried and proven guidelines will structure your way of thinking..."], "jumps": []}, {"id": "P1050", "text": ["As with any service-related work, customer satisfaction is the goal. Quality work and quick turn-around time are the keys to that goal.", "2 P2FF<<F<<<<<<<<<<<<<<<F2P 2", "< F!"], "jumps": []}, {"id": "P1060", "text": ["Before diving into an equipment failure, the technician should fully analyze all the possible symptoms. The troubleshooting process consists of four basic steps: Step 2. Identify Step 3. Repair Step 4. Re-Assessment"], "jumps": []}, {"id": "P1070", "text": ["During the assessment process, the technician should evaluate: What is the equipment doing? What is the equipment not doing? When an initial assessment is done properly, some problems can be identified without the need for in-depth troubleshooting.ng."], "jumps": []}, {"id": "P1080", "text": ["A good visual inspection can help identify obvious conditions, such as unplugged power cords, burned out light bulbs, blown fuses and controls set to the wrong position. When identifying a fault, localization may require either signal injection or signal tracing or both...."], "jumps": []}, {"id": "P1090", "text": ["Most equipment today, contains either a Built in Test (BIT), or a computerized diagnostic operational test to help the technician localize the problem to a section, stage or even to the component level. Once the stage or component is isolated, the technician can make the required repairs..."], "jumps": []}, {"id": "P1100", "text": ["After replacing or repairing the failed component, the technician should run an operational check to re-assess the proper functioning of the equipment. This verifies the repair, and makes sure no new problems were created during the maintenance procedure. ep 2. Identify Step 3. Repair Step 4. Re-Assessmenttt"], "jumps": []}, {"id": "P1110", "text": ["The process of signal tracing through a system involves methodically observing a signal along the signal path. This signal can be derived from an internal source or generated by test equipment. The best overall approach is to use the back-to-front method that is tracing the output signal backwards toward the source....."], "jumps": []}, {"id": "P1120", "text": ["An alternative method of signal tracing is to pick a point somewhere in the middle of the signal path and check there first. If the signal is present work towards the output and if the signal is not present work backwards towards the input..."], "jumps": []}, {"id": "P1130", "text": ["Some input signals are excessively small for detection by an oscilloscope. If your signal tracing efforts have brought you to this point, you will need to use a function or signal generator in order to isolate the problem..."], "jumps": []}, {"id": "P1140", "text": ["Signal injection is the process of applying a generated signal of appropriate frequency either to the input or to some point along the signal path. If, for example, the Pulse Width Modulator (PWM) clock stage is known to be faulty; you could inject a minimum level 70 Hz, 2Vpp square wave directly to the input of the PWM stage....."], "jumps": ["PWM"]}, {"id": "P1150", "text": ["However, when injecting into the PWM's signal path, keep the injected signal's amplitude at minimum and slowly raise it until the signal can start and stop the motor by using the MOTOR SPEED control on the Model 170 Trainer. Too large a signal can destroy the PWM..."], "jumps": []}, {"id": "P1160", "text": ["Another signal injection example is to simulate the square wave signal from the speed detector. Inserting a minimum level 100 Hz to 700 Hz, 4 Vpp square wave directly to the input or output of the wave shaper will simulate the speed detector output..."], "jumps": []}, {"id": "P1170", "text": ["Remember, when troubleshooting a closed loop feedback DC motor system, the output of the device (motor) has a direct effect on the input back to that same device. The output of the motor (by use of the speed detector) dictates the input to the same motor..."], "jumps": []}, {"id": "P1180", "text": ["The first concept a troubleshooter should perform is to separate the system into stages. Stage isolation allows the technician to step logically through the system without having to check each individual component..."], "jumps": []}, {"id": "P1190", "text": ["Utilizing a block diagram can help the technician isolate the system into stages. Notice, that a system that routes a feedback signal back to the controlling circuits is what composes a closed loop system..."], "jumps": []}, {"id": "P1200", "text": ["Secondly, the troubleshooter should group the stages into major sections. In our discussion, we will use two major sections: * CONTROL CIRCUITRY"], "jumps": []}, {"id": "P1210", "text": ["The SENSING circuitry section consists of the speed detector, frequency to voltage (F/V) converter, Proportional Integral Derivative (PID) controller, speed reference, and error detector stages..."], "jumps": ["PID"]}, {"id": "P1220", "text": ["The CONTROL circuitry section consists of the PWM controller and the H-switch/driver stages.("], "jumps": []}, {"id": "P1230", "text": ["What should be the first step in troubleshooting?.........."], "jumps": ["P1220"]}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1232", "text": ["When troubleshooting, the technician should perform an assessment of the system, which includes a visual inspection. Step 2. Identify Step 3. Repair Step 4. Re-Assessment"], "jumps": []}, {"id": "P1240", "text": ["What can a technician do to troubleshoot a signal path with a signal that is too low for an oscilloscope to read?", "Inject a signal with a function or signal generator."], "jumps": ["P1230"]}, {"id": "P1241", "text": [], "jumps": []}, {"id": "P1242", "text": ["If the signal amplitude is too low for an oscilloscope to read, it is probably too low for the counter as well."], "jumps": []}, {"id": "P1243", "text": ["e oscilloscope is the appropriate instrument.", "The multimeter can not be used for signal tracing, the oscilloscope is the appropriate instrument."], "jumps": []}, {"id": "P1250", "text": ["The following steps will be utilized when troubleshooting the closed loop motor feedback system in the Nida Model 170 Trainer.", "Perform a visual inspection to verify the equipment is set up properly.", "Verify that the problem is not related to the motor itself.", "Verify there is an input to the control circuits from the sensing circuits.", "Verify there is output from the control circuits to the motor."], "jumps": ["P1240"]}, {"id": "P1260", "text": ["The speed detector senses the motor's RPMs by the use of a disk mounted on the motor's shaft. As the disk rotates on the spinning shaft, the outside edge of the disk passes between and LED and a phototransistor..."], "jumps": []}, {"id": "P1270", "text": ["The disk has a series of holes that allows the light generated by the LED to periodically pass through the disk and into the phototransistor. Each time the light passes through the disk, the phototransistor develops a positive pulse..."], "jumps": []}, {"id": "P1280", "text": ["The number of pulses generated during a given amount of time determines the motor's speed. The end result is a string (train) of positive pulses that is sent to the frequency-to-voltage (F/V) converter (U4B on PC130-179)..."], "jumps": []}, {"id": "P1290", "text": ["U4B and U5 on PC130-179 comprise the major components of the frequency-to-voltage (F/V) converter. Wave shaper U4B receives square waves from the speed detector (TP6 on PC130-179) and modifies the square waves to form clean leading edges."], "jumps": []}, {"id": "P1300", "text": ["U5 transforms the pulse train into a voltage. This voltage (TP5 on PC130-179) is variable depending on the frequency of the pulse train and is the input to the PID circuits."], "jumps": []}, {"id": "P1310", "text": ["The PID controller is a rapid acting and corrective controller. The proportional, integral and derivative controller demonstrates the means to maintain a desired actuator (motor) position control."], "jumps": []}, {"id": "P1320", "text": ["The PID controller is operating properly when the output of the controller has a fast rise time, low overshoot, correct gain, and reaches the set point value."], "jumps": []}, {"id": "P1330", "text": ["The PID circuit uses a series of operational amplifiers to reshape the error signal. The proportional and derivative circuits consist of one operational amplifier. The integral circuit consists of two operational amplifiers. U1 and U2 on the PC130-177 comprise the PID and pass the output to the error detector..."], "jumps": []}, {"id": "P1340", "text": ["The MOTOR SPEED control (R1) on the Model 170 Trainer is the major component of the speed reference circuit. This variable resistor picks off a voltage from 0 VDC to +5 VDC and is the comparison voltage input to the error detector..."], "jumps": []}, {"id": "P1350", "text": ["U1 on PC130-178 is the error detection circuit. The two comparison inputs to the error detector come from the PID circuit at (TP1 on PC130-178) and the MOTOR SPEED (R1) speed reference..."], "jumps": []}, {"id": "P1360", "text": ["When the inputs are compared and a difference voltage is present, the detector circuit produces an error voltage, which is sent to the PWM controller at (TP2 on PC130-178)."], "jumps": []}, {"id": "P1370", "text": ["The Pulse Width Modulator (PWM) circuit consists of U2 and U3 on PC130-178. U3 generates the clock signal used by U2 at (TP4 on PC130-178). U2 (the PWM) modulates the pulse width from the clock with the voltage input from the error detector at (TP2 on PC130-178) and sends it to the H-switch/driver at (TP3 on PC130-178).."], "jumps": ["PWM"]}, {"id": "P1380", "text": ["U3 and S2 on PC130-179 make up the H-switch/driver. This section controls the direction of the DC motor and provides sufficient current to drive the motor. S2 selects the voltage inputs to U3 for the motor direction (CW/CCW) control..."], "jumps": []}, {"id": "P1390", "text": ["The H-switch/driver amplifies the signal from the PWM controller at (TP3 on PC130-178) and sends it to the motor at (TP2 on PC130-179). The motor receives the PWM signal from the H-switch/driver through S1 (ON) and S2 (OUT). The amplified PWM signal can be monitored between TJ3 and TJ4 on the Model 170 Trainer....."], "jumps": []}, {"id": "P1400", "text": ["Remember, the following steps will be utilized when troubleshooting the closed loop motor feedback system in the Nida Model 170 Trainer.", "Perform a visual inspection to verify the equipment is set up properly.", "Verify that the problem is not related to the motor itself.", "Verify there is an input to the control circuits from the sensing circuits.", "Verify there is output from the control circuits to the motor."], "jumps": ["P1910"]}, {"id": "P1910", "text": ["You have completed the information on TROUBLESHOOTING CLOSED LOOP SYSTEMS."], "jumps": ["P1001", "P1400"]}, {"id": "P1920", "text": ["P1001 * Setup check * Functional test * Circuit analysis", "1. The troubleshooting process has been and will continue to be defined in several different ways. Different organizations may use different terminology and divide the process into a different number of phases. The following terms can be used for the first phase of the troubleshooting process:"], "jumps": ["P1001"]}, {"id": "P1930", "text": ["2. The process of signal tracing through a system involves methodically observing a signal along the signal path. This signal can be derived from an internal source or generated by test equipment. The best overall approach is to use the back- to-front method, that is, tracing the output signal backwards toward the source..."], "jumps": []}, {"id": "P1940", "text": ["3. Before diving into an equipment failure, the technician should fully analyze all the possible symptoms. The troubleshooting process consists of four basic steps: Step 3. Repair Step 4. Re-Assessmenttt"], "jumps": []}, {"id": "P1950", "text": ["4. Signal injection is the process of applying a generated signal of appropriate frequency either to the input or to some point along the signal path. If, for example, the Pulse Width Modulator (PWM) clock stage is known to be faulty, you could inject a minimum level 70 Hz, 2 Vpp square wave directly to the input of the PWM stage.."], "jumps": ["PWM"]}, {"id": "P1960", "text": ["Perform a visual inspection to verify the equipment is set up properly.", "Verify that the problem is not related to the motor itself.", "Verify there is an input to the control circuits from the sensing circuits.", "Verify there is output from the control circuits to the motor.", "5. The following steps will be utilized when troubleshooting the closed loop motor feedback system in the Nida Model 170 Trainer."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1960"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["In this experiment, you will use test equipment to troubleshoot a closed loop feedback system. To help identify faults, the system is separated into the sensing and control circuitry."], "jumps": ["P2001"]}, {"id": "P2030", "text": ["Remember, the troubleshooting process consists of four basic phases: * Identify- Localize and isolate the problem * Repair - Ensure that the proper part is replaced and installed correctly * Re-Assessment - Verify that the repair did not cause new problems and that the system operates correctly.", "Assessment - Determines what the equipment is or is not doing.", "Identify- Localize and isolate the problem.", "Repair - Ensure that the proper part is replaced and installed correctly.", "Re-Assessment - Verify that the repair did not cause new problems and that the system operates correctly...."], "jumps": []}, {"id": "P2040", "text": ["Position the test console and the Model 170 trainer as shown.ote: Figure 5, page 2-3-12"], "jumps": []}, {"id": "P2050", "text": ["Connect the trainer's 8-pin ribbon cable between PC130-179 output (J1) on the test console and J1 on the trainer."], "jumps": []}, {"id": "P2060", "text": ["1. Set the test console controls to the initial settings.................."], "jumps": []}, {"id": "P2070", "text": ["3. Press Enter to set: Positive Supply Voltage to 15", "2. Carefully plug PC130-177 into the test console PC1 position. PC130-178 card on the PC2 position, PC130-179 card on the PC3 position. 2. Carefully plug PC130-177 into the test console PC1 position. PC130-178 card on the PC2 position, PC130-179 card on the PC3 position.", "- - --a - 4 - 44II - - IZ 4a- -I-I- - -", "ZZZZZjjjjjjj j jj jjjj jj jjjjj jjj jjjj jjj j j jjjj"], "jumps": []}, {"id": "P2080", "text": ["3. Press Enter to set: Positive Supply Voltage to 15 Negative Supply Voltage to 15.ative Supply Voltage to 12.e Supply Voltage to 12.Voltage to 12. ly Voltage to 12."], "jumps": []}, {"id": "P2090", "text": ["4. On PC130-177, set S1 to IN, S2, S3, and S4 to OUT. Adjust R2 to midpoint.ust R2 to midpoint......"], "jumps": []}, {"id": "P2100", "text": ["5. On PC130-178, set S1 to ON and S2 to MOTOR............."], "jumps": []}, {"id": "P2110", "text": ["6. On PC130-179, Set S1 to MOTOR and S2 to CCW............"], "jumps": []}, {"id": "P2120", "text": ["7. On the Model 170 Trainer, set METER to OUT, MOTOR to OFF, and MOTOR SPEED to 0."], "jumps": []}, {"id": "P2130", "text": ["8. On the Model 170 Trainer, adjust the mechanical load screw approximately three turns from the gear wheel (no load position)..", "f---------ffvdd1dX11X=X=P==P=5=PP=mPP_P_mm_mm___((mEE(( E", "___,----8P555PPc5P55m_=c555_5m55_=cc5555P55555I5PcP555X=555=5=PX5=5X5=5j=Xjjj=,j1jo( EE"], "jumps": ["PPPPPP5PP", "P1Xf", "P", "PPPP", "PPP", "PP"]}, {"id": "P2140", "text": ["9. Set the oscilloscope controls to the following positions:", "TIME/DIV 0.2 ms DISPLAY MODE DUAL TRIGGERING AC SLOPE + COUPLING AC SOURCE CH1 lay. w Check input current and compare with normal values. w Check covers, bolts, pulleys, gears, screws, and keys for security. w If the motor has brushes, blow dirt from windings, clean and inspect the commutator and brushes.", "CHANNEL 1 AC/GND/DC DC VOLTS/DIV 1V (x1 probe) CHANNEL 2 AC/GND/DC DC VOLTS/DIV 1V (x1 probe)"], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["11. Set PC1, PC2, and PC3 DC Power switches to ON.", "11. Press Enter to set: PC1, PC2, and PC3 DC Power switches to ON.", "10. Set the Function Generator for a 100 Hz, 4 Vpp square wave output."], "jumps": []}, {"id": "P2160", "text": ["11. Press Enter to set: PC1, PC2, and PC3 DC Power switches to ON. ..................................................."], "jumps": []}, {"id": "P2170", "text": ["12. Verify the motor on the Model 170 Trainer is working by setting the MOTOR switch to ON, and varying the MOTOR SPEED control between 0 to 100 and then back to 0."], "jumps": []}, {"id": "P2180", "text": ["13. On the Model 170 Trainer, set MOTOR to OFF............"], "jumps": []}, {"id": "P2190", "text": ["Let's assume that there is a fault somewhere in the system. The next step is to verify that an output is present from the sensing circuitry to the controlling circuitry."], "jumps": []}, {"id": "P2200", "text": ["14. Set the multimeter to read approximately 3 VDC. On PC130-178, connect the positive lead to TP2 and the negative lead to TP8 (ground).d)."], "jumps": []}, {"id": "P2210", "text": ["15. Manually spin the disc attached to the motor quickly while observing the multimeter display. The phototransistor generates a waveform shaped by the Speed Detector and converted to DC by the F/V converter on the PC130-177, then applied to the Error Detector on the PC130-178, and out to the PWM Controller and H-Switch Driver on PC130-179............."], "jumps": []}, {"id": "P2220", "text": ["The variable DC voltage viewed on the multimeter verifies that the sensing circuitry is performing correctly. No voltage indicates a problem in the sensing circuitry."], "jumps": []}, {"id": "P2230", "text": ["16. Disconnect the multimeter from PC130-178.............."], "jumps": []}, {"id": "P2240", "text": ["17. On PC130-179, connect the oscilloscope CH1 probe to TP3 and the ground lead to TP10, and CH2 probe to TP2 and the ground lead to TP10."], "jumps": []}, {"id": "P2250", "text": ["18. Adjust the CH1 trace to the center of the screen and adjust the CH2 trace to the bottom of the screen.", "EEEEEEEEEEEEEEEEEEEEEEEEEEE EEE;EE;EEEEEE;EE;EEEE;EEEEEEEEE EEEE EEE^EEEEEEEE E EE EEE EE E EEEE; ;E;mm"], "jumps": []}, {"id": "P2260", "text": ["19. On the Model 170 Trainer with the MOTOR switch in the OFF position, vary the MOTOR SPEED control from 0 to 100 while observing the pulse signals on the oscilloscope. Return the MOTOR SPEED to 0..."], "jumps": []}, {"id": "P2270", "text": ["20. Two pulse width modulated signals viewed on the oscilloscope verifies that the Control Circuitry is performing correctly. If an improper waveform (or no waveform) were viewed on the oscilloscope, the Control Circuitry is malfunctioning.", "III III I<IIIIII <II<IIIIIIIIIIIIII IIII III]IIIIIIII I II III II I III I< <"], "jumps": []}, {"id": "P2280", "text": ["If the results from the sensing circuitry test failed, the following troubleshooting sequence of the sensing circuitry is necessary."], "jumps": []}, {"id": "P2290", "text": ["21. Set the oscilloscope to view CH1 only, TIME/DIV to 5 ms and CH1 V/DIV to 2 V. On PC130-179, connect the oscilloscope CH1 probe to TP6 and the ground lead to TP10............"], "jumps": []}, {"id": "P2300", "text": ["22. Manually spin the disk attached to the motor while observing the oscilloscope display. The speed at which you spin the disc will affect the waveforms displayed."], "jumps": []}, {"id": "P2310", "text": ["23. Verify the proper operation of the Speed Detector, by setting the MOTOR switch to ON and slowly adjusting the MOTOR SPEED control until two square waves are achieved. The MOTOR SPEED should be between 10 and 20..."], "jumps": []}, {"id": "P2320", "text": ["24. If a square wave signal is not viewed on the oscilloscope, the problem would have been isolated to the speed detector circuit."], "jumps": []}, {"id": "P2330", "text": ["25. Set the oscilloscope to Dual mode. Set the CH2 Volts/Div control to 2 VDC. Connect the oscilloscope CH2 probe to TP7 on PC130-179. Adjust the CH2 trace to the bottom of the oscilloscope display..."], "jumps": []}, {"id": "P2340", "text": ["26. With the motor still running at a speed between 10 and 20 on the MOTOR SPEED control, observe the oscilloscope display. ................................................................................................................................................."], "jumps": []}, {"id": "P2350", "text": ["27. Verify the proper operation of the Wave Shaper section of the Speed Detector by varying the MOTOR SPEED control. The CH1 waveform is the raw input from the photodiode. CH2 is the output of the Wave Shaper, U4B on PC130-179................................"], "jumps": []}, {"id": "P2360", "text": ["28. If a square wave signal is not viewed on the oscilloscope, the problem would have been isolated to the Wave Shaper circuit of the Speed Detector."], "jumps": []}, {"id": "P2370", "text": ["29. Disconnect the oscilloscope probes from the PC130-179 card."], "jumps": []}, {"id": "P2380", "text": ["30. Connect the 100 Hz, 4 Vpp square wave from the function generator to PC130-179 TP7 and the ground lead to TP10. This will inject a signal that simulates the spinning speed detector disc."], "jumps": []}, {"id": "P2390", "text": ["31. Set the multimeter to measure +10 VDC. On PC130-179, connect the multimeter RED probe to TP5 and the BLACK probe to TP10."], "jumps": []}, {"id": "P2400", "text": ["32. Verify the proper operation of the F/V Converter, by manually adjusting the function generator frequency between 100 Hz and 700 Hz while observing the multimeter display. If the voltage varies with the frequency, the F/V circuit is performing correctly..."], "jumps": []}, {"id": "P2410", "text": ["33. Set the multimeter to measure +10 VDC. On PC130-178, connect the multimeter RED probe to TP1 and the BLACK probe to TP8 (ground).."], "jumps": []}, {"id": "P2420", "text": ["34. Verify the proper operation of the PID Controller, by manually adjusting the function generator frequency between 100 Hz and 700 Hz while observing the multimeter display. If the voltage is variable, the PID circuit is performing correctly."], "jumps": []}, {"id": "P2430", "text": ["35. Disconnect the function generator from the PC130-179 and the multimeter from the PC130-178..."], "jumps": []}, {"id": "P2440", "text": ["36. Let's examine a simple fault condition on the error detector circuit and determine a way to isolate the fault. Remember select CTRL S to view the closed loop system schematics."], "jumps": []}, {"id": "P2450", "text": ["37. On the Model 170 Trainer, set the MOTOR switch to ON.."], "jumps": []}, {"id": "P2460", "text": ["38. On the Model 170 Trainer, verify the closed loop system is operating correctly. Vary the MOTOR SPEED control from 0 to 100. Set the MOTOR SPEED control to 0. Notice that the MOTOR rotates."], "jumps": []}, {"id": "P2470", "text": ["39. Press ENTER to insert a fault into the Closed Feedback Motor Control system."], "jumps": []}, {"id": "P2480", "text": ["40. On the Model 170 Trainer, verify the closed loop system is operating correctly. Vary the MOTOR SPEED control from 0 to 100. Set the MOTOR SPEED control to 0. Notice that the MOTOR did not rotate, which indicates a malfunction in the system.."], "jumps": []}, {"id": "P2490", "text": ["41. On the Model 170 Trainer, set the MOTOR switch to OFF."], "jumps": []}, {"id": "P2500", "text": ["42. Set the function generator for a 100 Hz, 4 Vpp square wave and connect it to PC130-179 TP7 and ground TP10. Injection of this signal will simulate a spinning speed detector disc."], "jumps": []}, {"id": "P2510", "text": ["43. Set the multimeter to read + 30 VDC. On PC130-178, connect the RED probe to TP2 and the Black probe to TP8 (ground)."], "jumps": []}, {"id": "P2520", "text": ["44. Manually adjust the function generator frequency between 100 Hz and 700 Hz while observing the multimeter display. Notice the voltage at TP2, U1 Pin 6 is not variable and has a high DC level."], "jumps": []}, {"id": "P2530", "text": ["You have now isolated the problem to the Error Detector circuit, or its previous stages. To verify that the Error Detector circuit is the problem, you must verify the input signals."], "jumps": []}, {"id": "P2540", "text": ["45. Set the multimeter to read + 10 VDC. On the PC130-178, connect the multimeter RED probe to TP1 and the Black probe to TP8 (ground).."], "jumps": []}, {"id": "P2550", "text": ["46. Manually adjust the function generator frequency between 100 Hz and 700 Hz while observing the multimeter display. Since the voltage at TP1 is variable and operating correctly, you can determine that previous stages are operating normally..."], "jumps": []}, {"id": "P2560", "text": ["The fact that a variable voltage was present at TP1, with no variable voltage evident at TP2, indicates that there is a fault between the MOTOR SPEED control and TP2. The error detector, U1 on PC130-178, is most likely the problem circuit."], "jumps": []}, {"id": "P2570", "text": ["47. Disconnect the multimeter from PC130-178, and the function generator from PC130-179."], "jumps": []}, {"id": "P2580", "text": ["48. The computer has removed the fault. Let's verify the Closed Loop Feedback system is operating properly. On the Model 170 Trainer vary the MOTOR SPEED from 0 to 100, and back to 0. Notice the motor is functioning properly................."], "jumps": []}, {"id": "P2590", "text": ["49. Let's examine a malfunction in the Control circuitry. Set the oscilloscope SLOPE switch to (-) and the TIME/DIV to 2 mS. Connect the CH1 probe to PC130-178 TP4 and the ground lead to TP8 (ground)"], "jumps": []}, {"id": "P2600", "text": ["50. A negative pulse at TP4, verifies the PWM (clock) circuit is performing correctly. You may need to increase the intensity to view the pulses.", "WWWWWWWWWWWWWWWWWTWWWWWWWWWWWWWWWWWWWWWWWWW WWWWWWWW WW W WWWWW W WW W"], "jumps": ["P"]}, {"id": "P2610", "text": ["51. Set the oscilloscope SLOPE switch back to (+) and connect the CH1 probe to TP3 on PC130-178."], "jumps": []}, {"id": "P2620", "text": ["52. On the Model 170 Trainer, vary the MOTOR SPEED control from 0 to 100 while observing the oscilloscope, and then set the MOTOR SPEED control back to 0."], "jumps": []}, {"id": "P2630", "text": ["53. The pulse width modulated signal viewed on the oscilloscope verifies the PWM Controller circuit is performing correctly. An improper waveform (or no waveform) viewed at TP3 indicates a malfunction in the PWM Controller circuitry...."], "jumps": []}, {"id": "P2640", "text": ["54. Press ENTER to insert a fault into the PWM Controller circuitry. Let's determine a way to isolate the fault."], "jumps": []}, {"id": "P2650", "text": ["55. On the Model 170 Trainer, vary the MOTOR SPEED control from 0 to 100 and back to 0, while observing the oscilloscope CH1 at PC130-178 TP3. Notice that the PWM modulated signal is not present and the motor doesn't rotate."], "jumps": []}, {"id": "P2660", "text": ["56. Set the oscilloscope SLOPE switch to (-). On PC130-178, connect the CH1 probe to TP4 and the ground lead to TP8. Notice that the PWM clock pulses are not present."], "jumps": []}, {"id": "P2670", "text": ["57. The fact that no PWM clock pulse was present at TP4 indicates that there is a fault in the PWM clock circuit and the PWM Controller circuit is most likely bad. With the absence of a clock pulse, the PWM Controller will not function."], "jumps": []}, {"id": "P2680", "text": ["58. The computer will now remove the fault. Disconnect the test equipment from the circuit...TD2000 inital control setting script is on the next button of this page.........."], "jumps": []}, {"id": "P2690", "text": ["60. Press Enter to return all controls to their initial control settings.", "60. Return all controls to their initial control settings.", "59. Let's perform a re-assessment of the Closed Loop Feedback system. On the Model 170 Trainer vary the MOTOR SPEED from 0 to 100, and back to 0. Notice the motor is functioning properly. . Enter to return all controls to their initial control settings."], "jumps": []}, {"id": "P2700", "text": ["60. Press Enter to return all controls to their initial control settings. 60. Return all controls to their initial control settings."], "jumps": []}, {"id": "P2710", "text": ["61. Disconnect the J1 cable between the Model 170 Trainer and the test console."], "jumps": []}, {"id": "P2720", "text": ["62. Set the test console Power OFF.h to OFF. C switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": []}, {"id": "P2730", "text": ["63. Carefully remove PC130-177 from the test console PC1 position. PC130-178 card from the PC2 position, PC130-179 card from the PC3 position.."], "jumps": []}, {"id": "P2740", "text": ["64. Return all equipment to its proper storage area. C switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": []}, {"id": "P2910", "text": ["This completes the experiment on TROUBLESHOOTING CLOSED LOOP SYSTEMS."], "jumps": ["P2001", "P2740"]}, {"id": "P2920", "text": ["1. In this experiment, you investigated the troubleshooting of a closed loop feedback system..."], "jumps": ["P2001"]}, {"id": "P2930", "text": ["2. Remember, the troubleshooting process consists of four basic phases: Localize and isolate the problem * Repair - Ensure that the proper part is replaced and installed correctly * Re-Assessment - Verify that the repair did not cause new problems and that the system operates correctly.", "Assessment - Determines what the equipment is or is not doing.", "Identify- Localize and isolate the problem.", "Repair - Ensure that the proper part is replaced and installed correctly.", "Re-Assessment - Verify that the repair did not cause new problems and that the system operates correctly...."], "jumps": []}, {"id": "P2940", "text": ["3. Signal tracing involves following a signal either from beginning to end or from end to beginning.."], "jumps": []}, {"id": "P2950", "text": ["4. Signal injection involves applying a signal throughout a circuit, being careful not to overdrive sensitive circuits."], "jumps": []}, {"id": "P2960", "text": ["5. For all closed loop feedback systems, the output of a device has a direct effect on the return input to that same device.."], "jumps": ["P2999"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2940"]}, {"id": "P5000", "text": ["]]]+]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]] ]] $!", "]]]] ]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]] \"5", "\\]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]\\]]]]]]]]]]]]]]]]]]] ]]", "\\]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]\\]]]]]]]]]]]]]]]]]\\ \\B]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]+\\+]]", "\\;]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]] \\)#\\]]]]]]]]]]]]]]\\]]\\]]]]]]]\\\\\\4]]]]]]]]]]", "\\7]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]] \\\\]]]]]]]]]]]]]]]\\]]\\]]]]]]]]\\", "]\\] ]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]+", "\\]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]] ]]]:", "\\]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]] ]]", "]]H ]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]", "\\ \\]]]$\\3>]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]\\", "]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]IJ]]]]]]\\ ]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]Q\\\\\\]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]F\\\\\\]]]]]]]]]]\\]]]]]]]]]]"], "jumps": []}, {"id": "P5001", "text": ["______<`````````````````````````` __````````````````````````", "````P_`````C_````````````````````_ ``````````", "``````````````````````````````````-_```\"______________________`` _``_``66`", "_```````````````````````````````````````````````````````````````````````````````````` ``", "````````````````````````````````````````````````````````````````````````````````````````````````````````````!__```````` _"], "jumps": []}, {"id": "P5002", "text": ["&b+ )\"bbbba bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb", "a ")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["The _______ phase is not part of the troubleshooting process."], "jumps": []}, {"id": "P10211", "text": ["isolate passive components from active ones.", "determine the best frequency to inject in a given stage.", "determine which stage or section contains the fault."], "jumps": []}, {"id": "P10212", "text": ["The process of determining the bad component in a particular stage or section is known as _______"], "jumps": []}, {"id": "P10213", "text": ["Signal tracing is the best method of _______", "troubleshooting the receiver's RF input stage."], "jumps": []}, {"id": "P10214", "text": ["During signal injection, the generated signal should _______", "be as small as possible to prevent circuit damage.", "be as large as possible for easy detection."], "jumps": []}, {"id": "P10215", "text": ["The square wave signal from the speed detector is changed to a voltage by the _______"], "jumps": []}, {"id": "P10216", "text": ["the output of the device has a direct effect on the input to that same device.", "For all closed loop feedback systems, _______", "the input of the device has no effect on the output of that same device.", "the output of the device has no effect on the input to that same device.", "the input and output are equal and opposite."], "jumps": []}, {"id": "P10217", "text": ["In most cases, system fault localization will require either _______ or ________ to narrow the problem to a specific circuit or stage."], "jumps": []}, {"id": "P10218", "text": ["A system block diagram will help a troubleshooter separate the system into _______"], "jumps": []}, {"id": "P10219", "text": ["What can a technician do to troubleshoot a signal path with a signal that is too low for an oscilloscope to read?", "Inject a signal with a function or signal generator."], "jumps": []}, {"id": "P10220", "te 9 2 129 30000 10230 3 130 30000 10231 3 131 30000 10232 3 132 30000 10233 3 133 30000 10234 3 134 30000 10235 3 135 30000 10236 3 136 30000 10237 3 137 30000 10238 3 138 30000 10239 3 139 30000 10240 10241 10242 10243 10244 10245 10246 10247 10248 10249", "Page # Test# Question# HelpPage # 10210 1 110 1100 10211 1 111 1090 10212 1 112 1090 10213 1 113 1160 10214 1 114 1120 10215 1 115 1280 10216 1 116 1170 10217 1 117 1080 10218 1 118 1190 10219 1 119 1130 10220 2 120 2380 10221 2 121 2380 10222 2 122 2020"], "jumps": []}]};
let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
