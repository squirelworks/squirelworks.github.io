<script>
const book = {"title": "9395Z301", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Title: MASTER WARNING AND ANNUNCIATOR SYSTEMf asdf sadf", "Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Observe master warning and annunciator system operation. w Observe normal system operation. w Identify faulty system operation.", "w Describe the operation of the master warning and annunciator system. w Identify annunciator system applications.", "1. Master Warning and Annunciator System"], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P331", "text": [], "jumps": ["P", "P4", "P7PO", "P4P", "Pg"]}, {"id": "P400", "text": ["Propulsion Aircraft Structure Fuel Environmental Control Navigation Power Distribution", "During flight, many of the aircraft's systems are used at the same time. If one of the systems malfunctions or fails, the aircraft could perform poorly or crash."], "jumps": ["P300", "P410"]}, {"id": "P410", "text": ["To ensure the safety of the aircraft and its passengers, the pilot is required to continuously monitor the status of all flight operations................"], "jumps": ["P400", "P420"]}, {"id": "P420", "text": ["This lesson introduces you to the aircraft master warning and annunciator system. You will see how the pilot is able to monitor the status of all flight operations and still be able to pay attention to where the aircraft is going..."], "jumps": ["P410", "P430"]}, {"id": "P430", "text": ["Let's begin the lesson on MASTER WARNING AND ANNUNCIATOR SYSTEM............."], "jumps": ["P410"]}, {"id": "P900", "text": [], "jumps": ["P430"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The purpose of the master warning and annunciator system is to alert and inform the pilot of the aircraft's condition."], "jumps": ["P1001", "P1030"]}, {"id": "P1030", "text": ["Each individual operational system of the aircraft has a fault indicator light located on the overhead panel or fire module."], "jumps": ["P1020", "P1032"]}, {"id": "P1032", "text": ["In contrast, the master warning and annunciator system lights are located on the forward panel in front of the pilot and copilot for easy visibility."], "jumps": ["P1020", "P1040"]}, {"id": "P1040", "text": ["When an operational system malfunctions, that system's fault indicator illuminates on the overhead panel. Additionally, the appropriate Master Caution, Fire Warn, and annunciator lights illuminate directly in the pilot's field of vision..."], "jumps": ["P1020", "P1042"]}, {"id": "P1042", "text": ["Illumination of the Master Caution or Fire Warning annunciators alert the pilot and copilot to check the system fault indicators on the overhead panel."], "jumps": ["P1040", "P1050"]}, {"id": "P1050", "text": ["Each aircraft manufacturer and type of aircraft may use a different design and layout for the indicator system, but the purpose remains the same: to inform the pilots of system malfunctions and status..."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["All manufacturers follow a standard color coding for indicator lights. This ensures the pilot understands the severity of the indications."], "jumps": ["P1050", "P1080"]}, {"id": "P1080", "text": ["Warning lights are red in color and alert the pilot and copilot of dangerous conditions. For example, generator failure is considered to be a flight-threatening condition."], "jumps": ["P1050", "P1090"]}, {"id": "P1090", "text": ["Caution lights are yellow and indicate abnormal conditions. These conditions are not considered hazardous to the aircraft's flight. For example, if the Inertial Navigational System (INS) were failing, the aircraft could remain airborne..."], "jumps": ["P1080", "P1100"]}, {"id": "P1100", "text": ["Indicators and advisory lights reflect normal conditions or positions. Sometimes these lights are located on the annunciator panel."], "jumps": ["P1080", "P1110"]}, {"id": "P1110", "text": ["Indicators and advisory lights are green, blue, and white in color. Some manufacturers may use only one or two of these colors."], "jumps": ["P1080", "P1120"]}, {"id": "P1120", "text": ["Two Master Caution lights are located in direct view of the pilot and copilot for quick recognition of an alarm indicator that has been set due to a faulty system."], "jumps": ["P1130", "P1080"]}, {"id": "P1130", "text": ["Depending on the manufacturer, these lights may be red or yellow in color and may be labeled as Master Caution or Master Warning."], "jumps": ["P1120", "P1140"]}, {"id": "P1140", "text": ["The system may be equipped with an audible alarm, such as a buzzer. Larger aircraft are normally equipped with buzzers because the pilot has more indicators and controls to monitor than in smaller aircraft..."], "jumps": ["P1120", "P1142"]}, {"id": "P1142", "text": ["After recognizing a fault, either the pilot or the copilot can extinguish both indicators by pressing the Master Caution light on the forward panel in view.?"], "jumps": ["P1120", "P1150"]}, {"id": "P1150", "text": ["The annunciator panel helps the pilot or copilot identify the faulty system at a glance. Then individual caution lights for the faulty system can be investigated."], "jumps": ["P1120", "P1160"]}, {"id": "P1160", "text": ["These annunciator panels are designed as general system indicators. This means the pilot or copilot looks at another system panel associated with the illuminated annunciator to isolate a problem..."], "jumps": ["P1120", "P1170"]}, {"id": "P1170", "text": ["For example, the annunciator panel may have an indicator labeled Doors. If this indicator were illuminated, the pilot or copilot would check another panel to see which door is open."], "jumps": ["P1160", "P1180"]}, {"id": "P1180", "text": ["Some annunciator panels have specific system items labeled and color coded. In this case, additional annunciator lights are not necessary. This enables the pilot and copilot to see specific system faults immediately..."], "jumps": ["P1160", "P1190"]}, {"id": "P1190", "text": ["What lights are red in color and alert the crew of a dangerous malfunction requiring immediate action?"], "jumps": ["P1180"]}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1192", "text": ["Indicator and advisory lights indicate a normal condition and/or position of a system. Indicator and advisory lights are green, blue, and white in color."], "jumps": []}, {"id": "P1200", "text": ["\u0000\u0000\u0000incorrect1\u0000\u0000/\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000Y\u0001\u000f\u0000\u0000\u0000 \u0000\u0016\u0000System Indicator light\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000o\u0001\u0010\u0000\u0000\u0000\u0001\u0000\u0001\u0000\u0000\u0000,\u0004\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000x\u0001\u0000\u0000\u00fa\u0000\u00ba\u0004\u0012\u0002\u0085\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u00af\u0001\u0012\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0014\u0000\u0013\u0000x\u001e\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00c7\u0001\u0013\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00d9\u0001\u0014\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000\u00f3\u0001\u0015\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0017\u0002\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00ba\u0004\u0002\u0000\u0000\u0000V\u0006\u0003\u0000\u0000\u0000t\u0007\u0000\u0000\u0000\u0000\u0000\u00001\u0002\u0017", "What is used to alert the pilot of an emergency condition so corrective action may be taken?"], "jumps": ["P1190"]}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1202", "text": ["Individual system lights are usually located on the overhead panel. They are not readily visible to the pilot and copilot."], "jumps": []}, {"id": "P1210", "text": ["The annunciator uses several types of electrical switches and relays to indicate a fault."], "jumps": ["P1200", "P1220"]}, {"id": "P1220", "text": ["Micro-switches are used to indicate a position of a system component, such as a door or landing gear."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["Relays are used for electrical flow indications, such as the loss of generators. They are also used with other switches to aid in the resetting of the annunciator circuit."], "jumps": ["P1220", "P1240"]}, {"id": "P1240", "text": ["Thermal-switches are used to activate the circuit when a specific temperature is reached in a system or component. A Thermal Switch may be used for the compartment heater temperature circuit. If the temperature is too high, the annunciator is lit..."], "jumps": ["P1220", "P1250"]}, {"id": "P1250", "text": ["Pressure switches are used to activate the annunciator when a system's pressure is not within normal operating parameters. The aircraft hydraulic system uses this type of switch."], "jumps": ["P1220", "P1260"]}, {"id": "P1260", "text": ["Simple series and parallel circuits are used to illuminate and extinguish the annunciator panel. Each manufacturer uses different circuit configurations to achieve the same results."], "jumps": ["P1270", "P1220"]}, {"id": "P1270", "text": ["A door warning circuit could be designed as the one shown. When a door is opened, the switch closes, completing the path for current. The appropriate indicators are illuminated."], "jumps": ["P1260", "P1280"]}, {"id": "P1280", "text": ["When a door is opened, a path to ground is provided, making the circuit complete.", "Integrity switches can be added so the pilot and copilot can determine which door is open or selectively check each door's position."], "jumps": ["P1260", "P1290", "P1300"]}, {"id": "P1300", "text": ["A completely different type of door warning circuit is the Door Advisory circuit. It is a series circuit which illuminates a green indicator when all the doors are closed. When one door opens, the path for current is broken and the indicator is extinguished..."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["Most systems use SCRs (Silicon Controlled Rectifiers) to provide a path to ground when a system indicator is activated."], "jumps": ["P1320", "P1300", "Press"]}, {"id": "P1320", "text": ["When an aircraft system fault occurs, the printed circuit card (system sensor) provides the current needed to activate the SCR. This provides a path to ground for the appropriate warning light..."], "jumps": ["P1310", "P1330", "Press"]}, {"id": "P1330", "text": ["Momentarily pressing the Master Warning light removes power from and deactivates the SCR. The Master Warning light is then turned off with the loss of a path to ground."], "jumps": ["P1310", "P1340"]}, {"id": "P1340", "text": ["The individual system light remains illuminated until the fault is corrected."], "jumps": ["P1310", "P1350"]}, {"id": "P1350", "text": ["If the fault remains, the pilot can press the Master Warning light to reactivate the SCR and illuminate the faulty system's annunciator."], "jumps": ["P1310", "P1360", "Press"]}, {"id": "P1360", "text": ["If the system fault has been corrected, the power is removed from the SCR with the Master Warning light. The warning light does not clear automatically."], "jumps": ["P1310", "P1370"]}, {"id": "P1370", "text": ["Only the individual system indicator lights automatically reset after the fault is corrected."], "jumps": ["P1310", "P1910"]}, {"id": "P1910", "text": ["This completes the information on MASTER WARNING AND ANNUNCIATOR SYSTEM."], "jumps": ["P1310", "P1001"]}, {"id": "P1920", "text": ["1. The warning and annunciator system is placed within the normal view of the pilots, ensuring the pilots do not miss the indication."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. All manufacturers follow a standard color coding for indicator lights. This ensures the pilot understands the severity of the indications."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. Warning lights are red in color and alert the crew of dangerous operations or conditions. Generator failure is considered a hazardous condition."], "jumps": ["P1930", "P1950"]}, {"id": "P1950", "text": ["4. Caution lights are yellow in color and indicate abnormal conditions that are not considered dangerous. Loss of INS (Inertial Navigation System) is considered an abnormal condition..."], "jumps": ["P1930", "P1960"]}, {"id": "P1960", "text": ["5. Depending on the manufacturer, indicator and advisory lights may be located on the annunciator panel. These lights indicate a normal condition and/or position of a system."], "jumps": ["P1930", "P1970"]}, {"id": "P1970", "text": ["6. SCRs are used in most systems to complete a path to ground. This causes both the associated annunciator and the fault indicator to illuminate.."], "jumps": ["P1999", "P1930", "Press"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1970", "P1001"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["This experiment provides the opportunity to observe the normal operation of the master warning and annunciator system."], "jumps": ["P2001", "P2030"]}, {"id": "P2030", "text": ["The Nida PC130-735 and PC130-737 cards are used to display an operational master warning and annunciator circuit. The components and indicators on this card represent the typical warning circuit found on most aircraft..."], "jumps": ["P2020", "P2040"]}, {"id": "P2040", "text": ["The PC130-735 AC to DC Generator card is used to provide the DC voltage needed to operate the PC130-737 Master Warning and Annunciator card. The PC130-735 card is also used in the demonstration of the Generator Failure warning..."], "jumps": ["P2030", "P2050"]}, {"id": "P2050", "text": ["Pick up and analyze the PC130-735 card. The two generator and voltage regulator circuits convert AC voltage to 18 VDC."], "jumps": ["P2030", "P2060"]}, {"id": "P2060", "text": ["R3 is used to adjust the voltage output to 12 VDC, while R4 is used to balance the voltage output between generators 1 and 2."], "jumps": ["P2050", "P2070"]}, {"id": "P2070", "text": ["Now pick up and analyze the PC130-737 card. This card has 4 annunciator indicators: Gen Fail, Fuel Pressure, Over Heat, and Door Open."], "jumps": ["P2050", "P2080"]}, {"id": "P2080", "text": ["Each system uses a sensor to trigger the annunciator circuit. PC130-737 uses two transistors (Q1 and Q8) for the Gen Fail sensor. For simplicity, the other three systems use the trainer circuits to simulate the sensors..."], "jumps": ["P2070", "P2090"]}, {"id": "P2090", "text": ["12 VDC from PC130-735 is applied to the LED side and system side of the transistors (Q1 and Q8). When the generator fails, the LED side, causing the transistor to conduct and provide a path to ground...", "The voltage drop across the circuit causes one side of capacitor C3 to be lower and start to charge. During charging of capacitor C3, the applied voltage drops at least .6 to .75 volts."], "jumps": ["P2070", "P2100", "P2110"]}, {"id": "P2110", "text": ["This creates a differential voltage on two of the leads to the transistor Q4. Q4 triggers and delivers the voltage needed to trigger the two alarm LEDs and buzzer SCRs Q6 and Q7."], "jumps": ["P2100", "P2120"]}, {"id": "P2120", "text": ["The SCRs Q6 and Q7 trigger, providing a path to ground for the pilot and copilot's Master Caution LED and buzzer."], "jumps": ["P2100", "P2130"]}, {"id": "P2130", "text": ["Once the circuit is fully activated, the voltage becomes balanced at the transistor Q4. Triggering voltage is removed from the SCRs Q6 and Q7. This allows the Master Caution LEDs and buzzer to be cleared while the faulted system's LED remains illuminated..."], "jumps": ["P2120", "P2140"]}, {"id": "P2140", "text": ["The SCRs, however, remain triggered until the applied voltage is removed from the circuit. This is accomplished when one of the reset switches (S1 or S2) is pressed. Momentary loss of power and no trigger voltage cause both SCRs to reset..."], "jumps": ["P2120", "P2150"]}, {"id": "P2150", "text": ["To reset the buzzer but not the LEDs, switch S3 is used, which affects Q6 only."], "jumps": ["P2120", "P2160"]}, {"id": "P2160", "text": ["All of the system fault indicators are activated in the same way, with the exception of the one for fuel pressure. The Fuel Pressure indicator is a caution alert, triggering only the Master Caution LED's SCR via Q7...", "Diode D3 prevents the triggering voltage from affecting the buzzer SCR Q6. However, the diode does allow the triggering voltage to pass to SCR Q7 from the other system transistors."], "jumps": ["P2120", "P2170", "P2180"]}, {"id": "P2180", "text": ["Now that you have an understanding of how the circuit operates, let's start the experiment."], "jumps": ["P2170", "P2190"]}, {"id": "P2190", "text": ["1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2180"]}, {"id": "P2200", "text": ["2. Carefully plug PC130-735 into the Test Console PC1 position."], "jumps": ["P2190", "P2210"]}, {"id": "P2210", "text": ["3. Place S1 and S2 to the OFF position. 4. Set R3 fully CCW and R4 to mid position."], "jumps": ["P2200", "P2220"]}, {"id": "P2220", "text": ["5. Carefully plug PC130-737 into the Test Console PC2 position."], "jumps": ["P2210", "P2230"]}, {"id": "P2230", "text": ["6. Set FILAMENT to ON. 7. Set PC1 AC POWER to ON... C switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2220"]}, {"id": "P2240", "text": ["1. Set the multimeter to measure DC voltage. Connect the meter's positive lead on TP2 and the negative lead on TP4. The voltage represented on the multimeter indicates the difference in voltage between the two generators."], "jumps": ["P2245", "P2230", "P2250"]}, {"id": "P2245", "text": ["MEASUREMENT SETUP - Measure the voltage from TP2 to TP4."], "jumps": []}, {"id": "P2250", "text": ["The voltage will not be exactly zero. The lowest positive millivolt value obtained is acceptable.", "2. Adjust R4 until the multimeter indicates zero volts. This reading, comparing both voltages at their current level, specifies that the voltages are identical. OTE The voltage will not be exactly zero. The lowest positive millivolt value obtained is acceptable."], "jumps": ["P2255", "P2240", "P2260"]}, {"id": "P2255", "text": ["MEASUREMENT SETUP - Adjust R4 until multimeter indicates zero volts."], "jumps": []}, {"id": "P2260", "text": ["3. Move the GND probe of the multimeter to the GND TP of PC130-735. Adjust R3 for a 12 V signal on the multimeter."], "jumps": ["P2265", "P2250", "P2300"]}, {"id": "P2265", "text": ["MEASUREMENT SETUP - Adjust R3 for 12 volts."], "jumps": []}, {"id": "P2300", "text": ["4. Set PC130-735 S1 and S2 to the ON position. With the multimeter, verify that 12 VDC is being supplied to PC130-737 TP1 and TP2.."], "jumps": ["P2260", "P2310"]}, {"id": "P2310", "text": ["5. On PC130-737, place S4 to the up position. Press the PC130-737 Test button to check the circuit's operation. All LEDs should illuminate and the buzzer should alarm."], "jumps": ["P2300", "P2320"]}, {"id": "P2320", "text": ["Set PC130-737 S4 switch to the down position to silence the buzzer. Pressing S3 on PC130-737 will remove the audio warning tone, but it will not affect the visual indicator."], "jumps": ["P2310", "P2330"]}, {"id": "P2330", "text": ["Press either S1 or S2 to reset the Master Caution alarm circuit. All LEDs should be cleared. If not, press the reset S1 or S2 again. If the circuit does not reset, call your instructor.["], "jumps": ["P2310", "P2340"]}, {"id": "P2340", "text": ["Now let's see if the circuit is operating correctly. Set PC130-735 S2 to OFF. This removes generator 2 from the generator circuit."], "jumps": ["P2310", "P2350"]}, {"id": "P2350", "text": ["\u0000\u0000\u0000incorrect1\u0000\u00001\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000[\u0001\u000f\u0000\u0000\u0000 \u0000\u0002\u0000Norst Choiceett\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000q\u0001\u0010\u0000\u0000\u0000\u0001\u0000\u0001\u0000\u0000\u0000,\u0004\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000z\u0001\u0000\u0000\u00fc\u0000\u00ba\u0004\u0012\u0002\u0087\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u00b1\u0001\u0012\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0014\u0000\u0013\u0000x\u001e\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00c9\u0001\u0013\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00db\u0001\u0014\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000\u00f5\u0001\u0015\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0019\u0002\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00ba\u0004\u0002\u0000\u0000\u0000V\u0006\u0003\u0000\u0000\u0000t\u0007\u0000\u0000\u0000\u0000\u0000\u00003\u0002\u0017\u0000\u0000", "Did the Master Caution and Annunciator circuit indicate a generator failure?"], "jumps": ["P2340"]}, {"id": "P2351", "text": [], "jumps": []}, {"id": "P2352", "text": ["PC130-735 PC130-737 S1 - Up S4 - Up S2 - Down", "If the Master Caution, buzzer, and Gen Fail LEDs are not illuminated, check your setup. If the problem cannot be corrected, contact your instructor."], "jumps": []}, {"id": "P2360", "text": ["With a multimeter, measure the voltage at PC130-737 TP4, TP5, TP6, and TP7. Notice that the voltage is around 2.5 VDC at TP5 and is about 10 VDC at the other test points. Now measure the generator 1 and 2 input to PC130-737 TP1 and TP2...", "The voltage at TP2 has dropped to less than 3 volts and triggered the system transistor Q8. This provides a path to ground and illuminates the Gen Fail indicator."], "jumps": ["P2350", "P2370", "P2380", "P2360"]}, {"id": "P2380", "text": ["Press the reset switch (S1 or S2) to clear the LEDs. Notice that the Gen Fail LED remains illuminated. The fault has not cleared and will remain active. The system is ready to alert the pilot if another malfunction occurs..."], "jumps": ["P2370"]}, {"id": "P2390", "text": ["Notice what happens when another malfunction occurs while the Gen Fail is still in alarm. The Master Caution, buzzer, and Over Heat LEDs illuminate."], "jumps": ["P2380", "P2400"]}, {"id": "P2400", "text": ["Set PC130-735 S2 to the ON position and press the reset switches (PC130-737 S1 or S2). The circuit should be clear of all system failures.to ON.........................................", "When a caution is activated, the Master Caution LEDs are illuminated but not the buzzer. D3 prevents the caution circuit from triggering the buzzer SCR Q6.s"], "jumps": ["P2380", "P2400"]}, {"id": "P2420", "text": ["Now that you have observed the normal operation of the master warning and annunciator system, let's examine a faulty circuit.peaker switch to ON.........................................", "Notice that only the Master Caution LEDs are illuminated. Press the reset switches to clear the LEDs. The LEDs remain illuminated, meaning the path to ground has not been removed from the SCR Q7..."], "jumps": ["P2410", "P2420"]}, {"id": "P2440", "text": ["Determine if any system transistor is triggering the SCR. With a multimeter, measure the voltage at PC130-737 TP4, TP5, TP6, and TP7."], "jumps": ["P2430", "P2450"]}, {"id": "P2450", "text": ["\u0000\u0000\u0000incorrect1\u0000\u00001\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000[\u0001\u000f\u0000\u0000\u0000 \u0000\u0003\u0000Yesst Choiceett\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000q\u0001\u0010\u0000\u0000\u0000\u0001\u0000\u0001\u0000\u0000\u0000,\u0004\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000z\u0001\u0000\u0000\u00fc\u0000\u00ba\u0004\u0012\u0002\u0087\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u00b1\u0001\u0012\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0014\u0000\u0013\u0000x\u001e\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00c9\u0001\u0013\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00db\u0001\u0014\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000\u00f5\u0001\u0015\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0019\u0002\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00ba\u0004\u0002\u0000\u0000\u0000V\u0006\u0003\u0000\u0000\u0000t\u0007\u0000\u0000\u0000\u0000\u0000\u00003\u0002\u0017\u0000\u0000", "Do the voltage measurements indicate that any of the systems are triggering the SCR???"], "jumps": ["P2430"]}, {"id": "P2451", "text": ["The voltage at each test point TP4, TP5, TP6, and TP7 is about 10 VDC. This indicates that none of the system transistors are triggered to ground.", "Press the Test push button to check the operation of the circuit. The buzzer alarms, and all the system LEDs illuminate. This indicates the circuit is operating correctly up to SCR Q7."], "jumps": ["P2470", "P2450"]}, {"id": "P2470", "text": ["SCR Q7 failed in the triggered position.", "Gen Fail transistor Q4 is triggering the SCR.", "What is the probable cause for the Master Caution LEDs to remain illuminated?"], "jumps": ["P2460"]}, {"id": "P2471", "text": [], "jumps": []}, {"id": "P2472", "text": ["When the reset is pressed, the LEDs go out until they are released, indicating the switches operate correctly."], "jumps": []}, {"id": "P2473", "text": ["The test points TP4, TP5, TP6, and TP7 indicate that the system transistors are not triggered to ground, meaning there is no alarm condition."], "jumps": []}, {"id": "P2480", "text": ["The fault could be one of three possible conditions: 1. The circuit has a ground in the Master Caution LEDs and SCR Q7 circuit. 2. The SCR Q7 has failed in the triggered position. 3. The caution transistor Q5 has failed in the triggering position."], "jumps": ["P2470"]}, {"id": "P2490", "text": ["Let's try another troubleshooting exercise. Determine whether or not the system is working properly. Press the Test button and the reset switch (S1 or S2)............................."], "jumps": ["P2480"]}, {"id": "P2500", "text": ["The system indicates an alarm condition. However, the system's LEDs are not illuminated. Pressing the reset switch (S1 or S2) has no effect on resetting the circuit.", "Determine if any of the system transistors are triggering the SCR. With a multimeter, measure the voltage at PC130-737 TP4, TP5, TP6, and TP7.."], "jumps": ["P2490", "P2510", "P2520", "P2500"]}, {"id": "P2520", "text": ["\u0000\u0000\u0000incorrect1\u0000\u00001\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000[\u0001\u000f\u0000\u0000\u0000 \u0000\u0003\u0000Yesst Choiceett\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000q\u0001\u0010\u0000\u0000\u0000\u0001\u0000\u0001\u0000\u0000\u0000,\u0004\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000z\u0001\u0000\u0000\u00fc\u0000\u00ba\u0004\u0012\u0002\u0087\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u00b1\u0001\u0012\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0014\u0000\u0013\u0000x\u001e\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00c9\u0001\u0013\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00db\u0001\u0014\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000\u00f5\u0001\u0015\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0019\u0002\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00ba\u0004\u0002\u0000\u0000\u0000V\u0006\u0003\u0000\u0000\u0000t\u0007\u0000\u0000\u0000\u0000\u0000\u00003\u0002\u0017\u0000\u0000", "Do the voltage measurements indicate that any of the systems are triggering the SCR???"], "jumps": ["P2510"]}, {"id": "P2521", "text": ["The voltages at TP4, TP5, TP6, and TP7 are about 10 VDC. This indicates that none of the system transistors are triggered to ground.", "Since both SCR Q6 and Q7 are triggered, it is safe to say they are not at fault. The system transistors and LEDs indicate that they are not triggered to ground. The fault has to be located between the two sections of the circuit..."], "jumps": ["P2540", "P2520"]}, {"id": "P2540", "text": ["One of the transistors Q2, Q3 or Q4 failed.", "What is the possible fault with the circuit?..............."], "jumps": ["P2530"]}, {"id": "P2541", "text": [], "jumps": []}, {"id": "P2542", "text": ["When the reset is pressed, the LEDs go out until they are released, indicating the switches operate correctly."], "jumps": []}, {"id": "P2543", "text": ["The test points TP4, TP5, TP6, and TP7 indicate that the system transistors are not triggered to ground. This means there is no alarm condition.", "One of the transistors Q2, Q3 or Q4 is at fault. Each lead of the transistors would have to be measured to determine which one is at fault. Q5 is not suspected because the buzzer has been activated. Q5 does not trigger Q6..."], "jumps": ["P2560", "P2540"]}, {"id": "P2560", "text": ["Let's try another troubleshooting exercise. Determine whether or not the system is working properly.to ON. 9. Set the PC3 Speaker switch to ON.........................................", "The circuit has alarmed with the Generator Failure indication. Check the Master Caution circuit by pressing the reset (S1 or S2)."], "jumps": ["P2550", "P2580", "P2560"]}, {"id": "P2580", "text": ["The LEDs cleared with the exception of the Generator Failure LED. This indicates that the SCRs were triggered and they are operating correctly."], "jumps": ["P2570", "P2590"]}, {"id": "P2590", "text": ["The next step is to see if the indication actually represents the condition. Measure the voltage at TP1 and TP2."], "jumps": ["P2570", "P2600"]}, {"id": "P2600", "text": ["\u0000\u0000\u0000incorrect1\u0000\u00001\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000[\u0001\u000f\u0000\u0000\u0000 \u0000\u0003\u0000Yesst Choiceett\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000q\u0001\u0010\u0000\u0000\u0000\u0001\u0000\u0001\u0000\u0000\u0000,\u0004\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000z\u0001\u0000\u0000\u00fc\u0000\u00ba\u0004\u0012\u0002\u0087\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u00b1\u0001\u0012\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0014\u0000\u0013\u0000x\u001e\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00c9\u0001\u0013\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00db\u0001\u0014\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000\u00f5\u0001\u0015\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0019\u0002\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00ba\u0004\u0002\u0000\u0000\u0000V\u0006\u0003\u0000\u0000\u0000t\u0007\u0000\u0000\u0000\u0000\u0000\u00003\u0002\u0017\u0000\u0000", "Is the circuit faulty?on is typed.........................."], "jumps": ["P2570"]}, {"id": "P2601", "text": ["TP1 has less than 2 VDC applied, while TP2 has 12 VDC. This indicates that the generator 1 has actually failed."], "jumps": []}, {"id": "P2610", "text": ["The generator has failed and the circuit is operating correctly. Measure PC130-735 TP2 and verify that the generator output is lower than normal."], "jumps": ["P2600", "P2620"]}, {"id": "P2620", "text": ["1. Return the Test Console to the initial control settings."], "jumps": ["P2610"]}, {"id": "P2630", "text": ["2. Set the Console Power Switch to OFF.al settings........................"], "jumps": ["P2620"]}, {"id": "P2640", "text": ["3. Disconnect all test equipment. 4. Carefully remove PC130-735 and PC130-737. 5. Return all equipment to its proper storage area."], "jumps": ["P2630", "P2910"]}, {"id": "P2910", "text": ["This completes the experiment on MASTER WARNING AND ANNUNCIATOR SYSTEM."], "jumps": ["P2640", "P2001"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["What color is the warning light that is used to alert the crew of a dangerous condition?"], "jumps": []}, {"id": "P10211", "text": ["What color of warning light is used to indicate an abnormal condition considered to be nonhazardous?"], "jumps": []}, {"id": "P10212", "text": ["What colors are used for normal indication and operation?"], "jumps": []}, {"id": "P10213", "text": ["Master Caution and Warning System indicator", "To identify the exact fault with the aircraft, the pilot would investigate which indicator panel?"], "jumps": []}, {"id": "P10214", "text": ["The Master Caution and Warning System indications are used as a general system alarm indication."], "jumps": []}, {"id": "P10215", "text": ["What type of switch would be used to monitor the engine compartment temperature?"], "jumps": []}, {"id": "P10216", "text": ["What type of switch would be used to monitor the electrical flow from a generator?"], "jumps": []}, {"id": "P10217", "text": ["What type of switch would be used to monitor the position of a door?"], "jumps": []}, {"id": "P10218", "text": ["The individual local indication is reset.", "The alarm circuit is reset for further monitoring.", "What happens when the Master Warning light is momentarily pressed? W"], "jumps": []}, {"id": "P10219", "text": ["Resetting the Master Caution and Warning circuit resets the individual indication."], "jumps": []}, {"id": "P10220", "text": ["The individual local indication is reset.", "What is the result of a loss of electrical power to the Master Caution and Warning SCRs?"], "jumps": []}, {"id": "P10221", "text": ["Generator Failure transistor is triggering the SCR.", "What is the probable cause for the Master Caution LEDs to remain illuminated while there are no alarming conditions indicated by the individual systems?"], "jumps": []}, {"id": "P10222", "text": ["What component will shift line up to ground when a .6 to .75 voltage differential is measured between the system and indication side of the circuit? )"], "jumps": []}, {"id": "P10223", "text": ["Non Dangerous Abnormal Condition (YELLOW)", "When does the buzzer NOT activate during an alarming condition?"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to _________"], "jumps": []}, {"id": "P10410", "text": ["1. Master Warning Systemmmmmmmmor System"], "jumps": []}, {"id": "P13020", "text": ["This experiment provides the opportunity to observe the normal operation of the Master Warning and Annunciator system."], "jumps": ["P2001", "P13030"]}, {"id": "P13030", "text": ["The Nida PC130-735 and PC130-737 cards are used to display an operational Master Warning and Annunciator circuit. The components and indicators on this card represent the typical warning circuit found on most aircraft..."], "jumps": ["P13020", "P13040"]}, {"id": "P13040", "text": ["The PC130-735 AC to DC Generator card is used to provide the DC voltage needed to operate the PC130-737 Master Warning and Annunciator card. The PC130-735 card is also used in the demonstration of the Generator Failure warning..."], "jumps": ["P13030", "P13050"]}, {"id": "P13050", "text": ["Pick up and analyze the PC130-735 card. The two generator and voltage regulator circuits convert AC voltage to 18 VDC."], "jumps": ["P13030", "P13060"]}, {"id": "P13060", "text": ["R3 is used to adjust the voltage output to 12 VDC, while R4 is used to balance the voltage output between generators 1 and 2."], "jumps": ["P13050", "P13070"]}, {"id": "P13070", "text": ["Now pick up and analyze the PC130-737 card. This card has 4 annunciator indicators: Gen Fail, Fuel Pressure, Over Heat, and Door Open."], "jumps": ["P13050", "P13080"]}, {"id": "P13080", "text": ["Each system uses a sensor to trigger the annunciator circuit. PC130-737 uses two transistors (Q1 and Q8) for the Gen Fail sensor. For simplicity, the other three systems use the trainer circuits to simulate the sensors..."], "jumps": ["P13070", "P13090"]}, {"id": "P13090", "text": ["12 VDC from PC130-735 is applied to the LED side and system side of the transistors (Q1 and Q8). When the generator fails, the LED side, causing the transistor to conduct and provide a path to ground...", "The voltage drop across the circuit causes one side of capacitor C3 to be lower and start to charge. During charging of capacitor C3, the applied voltage drops at least .6 to .75 volts."], "jumps": ["P13070", "P13100", "P13110"]}, {"id": "P13110", "text": ["This creates a differential voltage on two of the leads to the transistor Q4. Q4 triggers and delivers the voltage needed to trigger the two alarm LEDs and buzzer SCRs Q6 and Q7."], "jumps": ["P13100", "P13120"]}, {"id": "P13120", "text": ["The SCRs Q6 and Q7 trigger, providing a path to ground for the pilot and copilot's Master Caution LED and buzzer."], "jumps": ["P13100", "P13130"]}, {"id": "P13130", "text": ["Once the circuit is fully activated, the voltage becomes balanced at the transistor Q4. Triggering voltage is removed from the SCRs Q6 and Q7. This allows the Master Caution LEDs and buzzer to be cleared while the faulted system's LED remains illuminated."], "jumps": ["P13120", "P13140"]}, {"id": "P13140", "text": ["The SCRs, however, remain triggered until the applied voltage is removed from the circuit. This is accomplished when one of the reset switches (S1 or S2) is pressed. Momentary loss of power and no trigger voltage cause both SCRs to reset..."], "jumps": ["P13120", "P13150"]}, {"id": "P13150", "text": ["To reset the buzzer but not the LEDs, switch S3 is used, which affects Q6 only."], "jumps": ["P13120", "P13160"]}, {"id": "P13160", "text": ["All of the system faults are activated in the same way, with the exception of the one for fuel pressure. The Fuel Pressure indicator is a caution alert, triggering only the Master Caution LED's SCR via Q7...", "Diode D3 prevents the triggering voltage from affecting the buzzer SCR Q6. However, the diode does allow the triggering voltage to pass to SCR Q7 from the other system transistors."], "jumps": ["P13120", "P13170", "P13180"]}, {"id": "P13180", "text": ["Now that you have an understanding of how the circuit operates, let's start the experiment."], "jumps": ["P13170", "P13190"]}, {"id": "P13190", "text": ["1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13180"]}, {"id": "P13200", "text": ["2. Carefully plug PC130-735 into the Test Console PC1 position."], "jumps": ["P13210"]}, {"id": "P13210", "text": ["3. Place S1 and S2 to the OFF position. 4. Set R3 fully CCW and R4 to mid position.."], "jumps": ["P13200", "P13220"]}, {"id": "P13220", "text": ["5. Carefully plug PC130-737 into the Test Console PC2 position."], "jumps": ["P13210", "P13225"]}, {"id": "P13225", "text": ["6. On PC130-735 and PC130-737, attach alligator to alligator cable from pin A to pin H."], "jumps": ["P13220", "P13230"]}, {"id": "P13230", "text": ["7. Press Enter to Set: PC1 AC Power Switch - ON.........................."], "jumps": ["P13225"]}, {"id": "P13240", "text": ["1. Set the multimeter to measure DC voltage. Connect the meter's positive lead on TP2 and the negative lead on TP4. The voltage represented on the multimeter indicates the difference in voltage between the two generators."], "jumps": ["P13245", "P13250"]}, {"id": "P13245", "text": ["MEASUREMENT SETUP - Measure the voltage from TP2 to TP4."], "jumps": []}, {"id": "P13250", "text": ["The voltage will not be exactly zero. The lowest positive millivolt value obtained is acceptable.", "2. Adjust R4 until the multimeter indicates zero volts. This reading, measuring both voltages at their current level, specifies that the voltages are identical. TE The voltage will not be exactly zero. The lowest positive millivolt value obtained is acceptable."], "jumps": ["P13255", "P13240", "P13260"]}, {"id": "P13255", "text": ["MEASUREMENT SETUP - Adjust R4 until multimeter indicates zero volts."], "jumps": []}, {"id": "P13260", "text": ["3. Move the GND probe of the multimeter to the GND TP of PC130-735. Adjust R3 for a 12 V signal on the multimeter."], "jumps": ["P13265", "P13250", "P13300"]}, {"id": "P13265", "text": ["MEASUREMENT SETUP - Adjust R3 for 12 volts."], "jumps": []}, {"id": "P13300", "text": ["4. Set PC130-735 S1 and S2 to the ON position. With the multimeter, verify that 12 VDC is being supplied to PC130-737 TP1 and TP2."], "jumps": ["P13260", "P13310"]}, {"id": "P13310", "text": ["5. On PC130-737, place S4 to the up position. Press the PC130-737 Test button to check the circuit's operation. All LEDs should illuminate and the buzzer should alarm."], "jumps": ["P13300", "P13320"]}, {"id": "P13320", "text": ["Set PC130-737 S4 switch to the down position to silence the buzzer. Pressing S3 on PC130-737 will remove the audio warning tone, but it will not affect the visual indicator."], "jumps": ["P13310", "P13330"]}, {"id": "P13330", "text": ["Press either S1 or S2 to reset the Master Caution alarm circuit. All LEDs should be cleared. If not, press the reset S1 or S2 again. If the circuit does not reset, call your instructor.["], "jumps": ["P13310", "P13340"]}, {"id": "P13340", "text": ["Now let's see if the circuit is operating correctly. Set PC130-735 S2 to OFF. This removes generator 2 from the generator circuit."], "jumps": ["P13310", "P13350"]}, {"id": "P13350", "text": ["\u0000\u0000\u0000incorrect1\u0000\u00001\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000[\u0001\u000f\u0000\u0000\u0000 \u0000\u0002\u0000Norst Choiceett\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000q\u0001\u0010\u0000\u0000\u0000\u0001\u0000\u0001\u0000\u0000\u0000,\u0004\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000z\u0001\u0000\u0000\u00fc\u0000\u00be\u0004\u0012\u0002\u0087\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u00b1\u0001\u0012\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0014\u0000\u0013\u0000x\u001e\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00c9\u0001\u0013\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00db\u0001\u0014\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000\u00f5\u0001\u0015\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0019\u0002\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00be\u0004\u0002\u0000\u0000\u0000\\\u0006\u0003\u0000\u0000\u0000|\u0007\u0000\u0000\u0000\u0000\u0000\u00003\u0002\u0017\u0000\u0000", "Did the Master Caution and Annunciator circuit indicate a generator failure?"], "jumps": ["P13340"]}, {"id": "P13351", "text": [], "jumps": []}, {"id": "P13352", "text": ["PC130-735 PC130-737 S1 - Up S4 - Up S2 - Down", "If the Master Caution, buzzer, and Gen Fail LEDs are not illuminated, check your setup. If the problem cannot be corrected, contact your instructor."], "jumps": []}, {"id": "P13360", "text": ["With a multimeter, measure the voltage at PC130-737 TP4, TP5, TP6, and TP7. Notice that the voltage is around 2.5 VDC at TP5 and is about 10 VDC at the other test points. Now measure the generator 1 and 2 input to PC130-737 TP1 and TP2...", "The voltage at TP2 has dropped to less than 3 volts and triggered the system transistor Q8. This provides a path to ground and illuminates the Gen Fail indicator."], "jumps": ["P13350", "P13370", "P13380", "P13360"]}, {"id": "P13380", "text": ["Press the reset switch (S1 or S2) to clear the LEDs. Notice that the Gen Fail LED remains illuminated. The fault has not cleared and will remain active. The system is ready to alert the pilot if another malfunction occurs..."], "jumps": ["P13370"]}, {"id": "P13390", "text": ["Notice what happens when another malfunction occurs while the Gen Fail is still in alarm. The Master Caution, buzzer, and Over Heat LEDs illuminate."], "jumps": ["P13400"]}, {"id": "P13400", "text": ["Set PC130-735 S2 to the ON position and press the reset switches (PC130-737 S1 or S2). The circuit should be clear of all system failures.", "When a caution is activated, the Master Caution LEDs are illuminated but not the buzzer. D3 prevents the caution circuit from triggering the buzzer SCR Q6."], "jumps": ["P13380", "PC130"]}, {"id": "P13420", "text": ["Now that you have observed the normal operation of the master warning and annunciator system, let's examine a faulty circuit.", "Notice that only the master caution LEDs are illuminated. Press the reset switches to clear the LEDs. The LEDs remain illuminated, meaning the path to ground has not been removed from the SCR Q7..."], "jumps": ["P13440"]}, {"id": "P13440", "text": ["Determine if any system transistor is triggering the SCR. With a multimeter, measure the voltage at PC130-737 TP4, TP5, TP6, and TP7."], "jumps": ["P13430", "P13450"]}, {"id": "P13450", "text": ["\u0000\u0000\u0000incorrect1\u0000\u00001\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000[\u0001\u000f\u0000\u0000\u0000 \u0000\u0003\u0000Yesst Choiceett\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000q\u0001\u0010\u0000\u0000\u0000\u0001\u0000\u0001\u0000\u0000\u0000,\u0004\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000z\u0001\u0000\u0000\u00fc\u0000\u00be\u0004\u0012\u0002\u0087\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u00b1\u0001\u0012\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0014\u0000\u0013\u0000x\u001e\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00c9\u0001\u0013\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00db\u0001\u0014\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000\u00f5\u0001\u0015\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0019\u0002\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00be\u0004\u0002\u0000\u0000\u0000\\\u0006\u0003\u0000\u0000\u0000|\u0007\u0000\u0000\u0000\u0000\u0000\u00003\u0002\u0017\u0000\u0000", "Do the voltage measurements indicate that any of the systems are triggering the SCR???"], "jumps": ["P13430"]}, {"id": "P13451", "text": ["The voltage at each test point TP4, TP5, TP6, and TP7 is about 10 VDC. This indicates that none of the system transistors are triggered to ground.", "Press the Test push button to check the operation of the circuit. The buzzer alarms, and all the system LEDs illuminate. This indicates the circuit is operating correctly up to SCR Q7."], "jumps": ["P13470", "P13450", "P"]}, {"id": "P13470", "text": ["SCR Q7 failed in the triggered position.", "Gen Fail transistor Q4 is triggering the SCR.", "What is the probable cause for the Master Caution LEDs to remain illuminated?"], "jumps": ["P13460"]}, {"id": "P13471", "text": [], "jumps": []}, {"id": "P13472", "text": ["When the reset is pressed, the LEDs go out until they are released, indicating the switches operate correctly."], "jumps": []}, {"id": "P13473", "text": ["The test points TP4, TP5, TP6, and TP7 indicate that the system transistors are not triggered to ground, meaning there is no alarm condition."], "jumps": []}, {"id": "P13480", "text": ["The fault could be one of three possible conditions: 1. The circuit has a ground in the Master Caution LEDs and SCR Q7 circuit. 2. The SCR Q7 has failed in the triggered position. 3. The caution transistor Q5 has failed in the triggering position."], "jumps": ["P13470"]}, {"id": "P13490", "text": ["Let's try another troubleshooting exercise. Determine whether or not the system is working properly. Press the Test button and the reset switch (S1 or S2)."], "jumps": []}, {"id": "P13500", "text": ["The system indicates an alarm condition. However, the system's LEDs are not illuminated. Pressing the reset switch (S1 or S2) has no effect on resetting the circuit.", "Determine if any of the system transistors are triggering the SCR. With a multimeter, measure the voltage at PC130-737 TP4, TP5, TP6, and TP7.."], "jumps": ["P13510", "P13520", "P13500"]}, {"id": "P13520", "text": ["\u0000\u0000\u0000incorrect1\u0000\u00001\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000[\u0001\u000f\u0000\u0000\u0000 \u0000\u0003\u0000Yesst Choiceett\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000q\u0001\u0010\u0000\u0000\u0000\u0001\u0000\u0001\u0000\u0000\u0000,\u0004\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000z\u0001\u0000\u0000\u00fc\u0000\u00be\u0004\u0012\u0002\u0087\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u00b1\u0001\u0012\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0014\u0000\u0013\u0000x\u001e\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00c9\u0001\u0013\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00db\u0001\u0014\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000\u00f5\u0001\u0015\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0019\u0002\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00be\u0004\u0002\u0000\u0000\u0000\\\u0006\u0003\u0000\u0000\u0000|\u0007\u0000\u0000\u0000\u0000\u0000\u00003\u0002\u0017\u0000\u0000", "Do the voltage measurements indicate that any of the systems are triggering the SCR???"], "jumps": ["P13510"]}, {"id": "P13521", "text": ["The voltages at TP4, TP5, TP6, and TP7 are about 10 VDC. This indicates that none of the system transistors are triggered to ground.", "Since both SCR Q6 and Q7 are triggered, it is safe to say they are not at fault. The system transistors and LEDs indicate that they are not triggered to ground. The fault has to be located between the two sections of the circuit..."], "jumps": ["P13540", "P13520"]}, {"id": "P13540", "text": ["One of the transistors Q2, Q3 or Q4 failed.", "What is the possible fault with the circuit?................."], "jumps": ["P13530"]}, {"id": "P13541", "text": [], "jumps": []}, {"id": "P13542", "text": ["When the reset is pressed, the LEDs go out until they are released, indicating the switches operate correctly."], "jumps": []}, {"id": "P13543", "text": ["The test points TP4, TP5, TP6, and TP7 indicate that the system transistors are not triggered to ground. This means there is no alarm condition.", "One of the transistors Q2, Q3 or Q4 is at fault. Each lead of the transistors would have to be measured to determine which one is at fault. Q5 is not suspected because the buzzer has been activated. Q5 does not trigger Q6..."], "jumps": ["P13560", "P13540"]}, {"id": "P13560", "text": ["Let's try another troubleshooting exercise. Determine whether or not the system is working properly.", "The circuit has alarmed with the Generator Failure indication. Check the Master Caution circuit by pressing the reset (S1 or S2)."], "jumps": ["P13550", "P13580"]}, {"id": "P13580", "text": ["The LEDs cleared with the exception of the Generator Failure LED. This indicates that the SCRs were triggered and they are operating correctly."], "jumps": ["P13570", "P13590"]}, {"id": "P13590", "text": ["The next step is to see if the indication actually represents the condition. Measure the voltage at TP1 and TP2."], "jumps": ["P13570", "P13600"]}, {"id": "P13600", "text": ["\u0000\u0000\u0000incorrect1\u0000\u00001\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000[\u0001\u000f\u0000\u0000\u0000 \u0000\u0003\u0000Yesst Choiceett\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000q\u0001\u0010\u0000\u0000\u0000\u0001\u0000\u0001\u0000\u0000\u0000,\u0004\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000z\u0001\u0000\u0000\u00fc\u0000\u00be\u0004\u0012\u0002\u0087\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u00b1\u0001\u0012\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0014\u0000\u0013\u0000x\u001e\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00c9\u0001\u0013\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00db\u0001\u0014\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000\u00f5\u0001\u0015\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0019\u0002\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00be\u0004\u0002\u0000\u0000\u0000\\\u0006\u0003\u0000\u0000\u0000|\u0007\u0000\u0000\u0000\u0000\u0000\u00003\u0002\u0017\u0000\u0000", "Is the circuit faulty?tion is typed.........................."], "jumps": ["P13570"]}, {"id": "P13601", "text": ["TP1 has less than 2 VDC applied, while TP2 has 12 VDC. This indicates that the generator 1 has actually failed."], "jumps": []}, {"id": "P13610", "text": ["The generator has failed and the circuit is operating correctly. Measure PC130-735 TP2 and verify that the generator output is lower than normal."], "jumps": ["P13600"]}, {"id": "P13630", "text": ["1. Set the Console Power Switch to OFF.FF................................."], "jumps": []}, {"id": "P13640", "text": ["itch to OFF.FF.................................", "2. Disconnect all test equipment. 3. Carefully remove PC130-735 and PC130-737. 4. Return all equipment to its proper storage area."], "jumps": ["P13910", "P13630"]}, {"id": "P13910", "text": ["This completes the experiment on MASTER WARNING AND ANNUNCIATOR SYSTEM."], "jumps": ["P13640", "P2001"]}, {"id": "PINFO", "text": ["07-31-00 Converted from SAM to toolbook. Pat 08-04-00 Text and Branching. frieda 09-21-00 Graphics added. Richard S. 05-07-01 (P13190) changed help button to go to page P22040 - lisa 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-12-02 review - rs 10-11-02", "07-31-00 Converted from SAM to toolbook. Pat 08-04-00 Text and Branching. frieda 09-21-00 Graphics added. Richard S. 05-07-01 (P13190) changed help button to go to page P22040 - lisa 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-12-02 review - rs 10-11-02 P13910, P13640 were corrupted. Ran repair kit and replaced pages. -Penny 04-07-05 P10220, changed sentence wording. P10223, capitalized and underlined \"not\" in question stem. -Penny", "Nida Corporation - Master Warning and Annunciator System"], "jumps": ["P13190"]}]};
let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
