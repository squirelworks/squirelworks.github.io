const book = {"title": "93954703", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . .", "Title: DATA SELECTOR CIRCUITSf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Identify the purpose of data selector circuits. w Recognize data selector circuits.", "w Predict the outputs of a data selector circuit. w Measure the outputs of a data selector circuit. w Recognize normal operation of a data selector circuit."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P335", "text": [], "jumps": []}, {"id": "P400", "text": ["Data selector circuits choose between several inputs to select a single output.", "Data selector circuits choose between several inputs to select a single output.put."], "jumps": ["P300"]}, {"id": "P410", "text": [], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["If the subtractor output is needed, the data selector applies only the subtractor signal to the output."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["If both outputs are needed, the data is multiplexed and applied to the output.", "If both outputs are needed, the data is multiplexed and applied to the output..."], "jumps": ["P431", "P400"]}, {"id": "P431", "text": ["If both outputs are needed, the data is multiplexed and applied to the output.", "If both outputs are needed, the data is multiplexed and applied to the output..."], "jumps": ["P440", "P400"]}, {"id": "P435", "text": ["MULTIPLEXED - Multiplexing is the process of placing information from several sources onto a single output."], "jumps": ["P437"]}, {"id": "P437", "text": ["If both outputs are needed, the data is multiplexed and applied to the output.", "If both outputs are needed, the data is multiplexed and applied to the output..."], "jumps": ["P431", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on DATA SELECTOR CIRCUITS.........................."], "jumps": ["P437"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The data selector circuits have seven inputs and one output."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["A, B, C and D are data inputs."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["A1 and A2 are the address inputs that select which data input is placed on the output."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["00 selects input A, 01 selects input B, 10 selects input C and 11 selects input D.", "0 0 0 A 0 0 1 B 0 1 0 C 0 1 1 DDDDD"], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["The EN input enables inputs A through D. A low signal is required for selection. If the EN input is high, the output will be low, regardless of any other input levels......"], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["The output contains single data from A through D or multiplexed data from a combination of A through D."], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["What is the output of the data selector circuit?", "What is the output of the data selector circuit?..........."], "jumps": ["P1020", "P1085"]}, {"id": "P1081", "text": [], "jumps": []}, {"id": "P1082", "text": ["First, find the address and determine which input is selected. Then look at the selected input level."], "jumps": []}, {"id": "P1085", "text": ["ADDRESSING DATA - Providing that EN is low, an address input of 00 selects data input A. 01 selects B, 10 selects C and 11 selects D."], "jumps": []}, {"id": "P1090", "text": ["What is the output of this data selector circuit?", "What is the output of this data selector circuit?.........."], "jumps": ["P1080", "P1085"]}, {"id": "P1091", "text": [], "jumps": []}, {"id": "P1092", "text": ["If the EN input is high, the output will be low, regardless of any other input levels.", "If the EN input is high, the output will be low, regardless of any other input levels....."], "jumps": []}, {"id": "P1100", "text": ["Multiplexing is accomplished by addressing each input during one time period."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["During T1, inputs A through D are selected and placed on the output."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["The counter addresses input A. Touch NEXT to observe the operation."], "jumps": ["P1122", "P1100"]}, {"id": "P1122", "text": ["The counter addresses input A. Touch NEXT to observe the operation."], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["The counter addresses input B. Touch NEXT to observe the operation."], "jumps": ["P1132", "P1100"]}, {"id": "P1132", "text": ["The counter addresses input B. Touch NEXT to observe the operation."], "jumps": ["P1140", "P1100"]}, {"id": "P1140", "text": ["The counter addresses input C. Touch NEXT to observe the operation."], "jumps": ["P1142", "P1100"]}, {"id": "P1142", "text": ["The counter addresses input C. Touch NEXT to observe the operation."], "jumps": ["P1150", "P1100"]}, {"id": "P1150", "text": ["The counter addresses input D. Touch NEXT to observe the operation."], "jumps": ["P1152", "P1100"]}, {"id": "P1152", "text": ["The counter addresses input D. Touch NEXT to observe the operation."], "jumps": ["P1160", "P1100"]}, {"id": "P1160", "text": ["At time T2, the counter is set to 00 and the data during T2 is placed on the output in the same manner."], "jumps": ["P1170", "P1100"]}, {"id": "P1170", "text": ["This selector circuit consists of three inverters, four 4-input AND gates and one 4-input OR gate.", "This selector circuit consists of three inverters, four 4-input AND gates and one 4-input OR gate......"], "jumps": ["P1100"]}, {"id": "P1180", "text": ["A low ENABLE input places a high on each AND gate."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["An address of 00 places two highs on AND gate 1."], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["With three high inputs to gate 1, the output is the level of input A."], "jumps": ["P1210", "P1170"]}, {"id": "P1210", "text": ["AND gates 2, 3 and 4 all have low inputs from the address.", "AND gates 2, 3 and 4 all have low inputs from the address.m"], "jumps": ["P1220", "P1170"]}, {"id": "P1220", "text": ["An address of 01 places two highs on AND gate 2."], "jumps": ["P1230", "P1170"]}, {"id": "P1230", "text": ["With three high inputs to gate 2, the output is the level of input B."], "jumps": ["P1240", "P1170"]}, {"id": "P1240", "text": ["AND gates 1, 3 and 4 all have low inputs from the address.", "AND gates 1, 3 and 4 all have low inputs from the address.W"], "jumps": ["P1250", "P1170"]}, {"id": "P1250", "text": ["Select the AND gate that is enabled with an address of 11?", "Select the AND gate that is enabled with an address of 11?."], "jumps": ["P1170"]}, {"id": "P1251", "text": [], "jumps": []}, {"id": "P1252", "text": ["An address of 11 places a low from A1 inverter to gates 1 and 3 and a low from A2 inverter to gates 1 and 2."], "jumps": []}, {"id": "P1260", "text": ["Select the AND gate that is enabled with an address of 10?", "Select the AND gate that is enabled with an address of 10?."], "jumps": ["P1250"]}, {"id": "P1261", "text": [], "jumps": []}, {"id": "P1262", "text": ["An address of 10 places a low from A1 to gates 2 and 4 and from A2 inverter to gates 1 and 2."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on DATA SELECTOR CIRCUITS.", "This completes the information on DATA SELECTOR CIRCUITS..."], "jumps": ["P1001", "P1260"]}, {"id": "P1920", "text": ["1. The data selector circuits have seven inputs and one output."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Inputs A, B, C and D are the data inputs.", "2. Inputs A, B, C and D are the data inputs."], "jumps": ["P1932", "P1920"]}, {"id": "P1932", "text": ["3.  Inputs A1 and A2 are the address inputs that select which data\n     input will be placed on the output.", "3. Inputs A1 and A2 are the address inputs that select which data input will be placed on the output.."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["4.  The output is either A, B, C, D or multiplexed.", "4. The output is either A, B, C, D or multiplexed."], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["5. This selector circuit consists of three inverters, four 4-input            AND gates and one 4-input OR gate.", "5. This selector circuit consists of three inverters, four 4-input AND gates and one 4-input OR gate."], "jumps": ["P1999", "P1920"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.."], "jumps": ["P1001", "P1950"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["This experiment demonstrates the operation of a data selector 130-112 into the Test Console PC1 position. 4.  Carefully plug PC130-133 into the Test Console PC2 position.", "3. Carefully plug PC130-112 into the Test Console PC1 position. 4. Carefully plug PC130-133 into the Test Console PC2 position."], "jumps": ["P13110", "P13090"]}, {"id": "P13110", "text": ["5.  Set S1 and S2 to LO and S3 to PULSED on PC130-112.\n6.  Set S1 and S2 to 0 and S3 to MAN on PC130-133.", "5. Set S1 and S2 to LO and S3 to PULSED on PC130-112. 6. Set S1 and S2 to 0 and S3 to MAN on PC130-133."], "jumps": ["P13120", "P13100", "P13115"]}, {"id": "P13115", "text": ["SWITCH POSITIONS PC130-112 - S1 and S2 set to LO and S3 to", "SWITCH POSITIONS PC130-112 - S1 and S2 set to LO and S3 to PULSED. PC130-133 - S1 and S2 set to 0 and S3 to MAN."], "jumps": []}, {"id": "P13120", "text": ["7.  Press Enter to Set: PC1 DC Power Switches - ON\n                                          PC2 DC Power Switches - ON", "7. Press Enter to Set: PC1 DC Power Switches - ON PC2 DC Power Switches - ON"], "jumps": ["P13110"]}, {"id": "P13130", "text": ["8.  Setup the oscilloscope as follows:", "8. Setup the oscilloscope as follows:.....................", "Sweep Mode - Norm Trigger Coupling - AC Trigger Level - CH2 Trigger Slope - + Time/Div - .2 msec Display Mode - Dual Volt/Div CH1 - 2 DC Volt/Div CH2 - 2 DC"], "jumps": ["P13140", "P13120", "P13135"]}, {"id": "P13135", "text": ["OSCILLOSCOPE Sweep - Norm Display - Dual Volt/Div CH1 - 2 DC Level - CH2 Coupling - AC Volt/Div CH2 - 2 DC Slope - + Time/Div - .2 msec", "K, HK_,,_K,_K'',EK,,,,,'_,KEKZ;;XK98JO9[N=9N@N99U,,K,,EK", "'_K_'K'',K' QUK_,''KK}0;KK,KK__',K'K_K''KK'K_", "'_K_'KK',K_,,'_'',K,K', F;__KK,K, TK,,__,''KKK'", ",KK,,E:9 POOHPPP=70=07PUHP^UOOU=YOVP=PPPPOOPXOOOOXH9UO95P0P===TXZOOU1NIIPPPHPVGH5PSOPZXXOK;E", "a5T 55:s5 m5 ts55Tt T--|57s- Fss y 5 -VVFs5m--FFFmm5FFs---t-t t-| -s-ymV sGFt--ss5-", "7mty-5m--F-s- mVs t --FFy5V-|-F smst Vm--5sVt T-", ",,K;A:'K,57VGO;EEEOa>2OK9)1UE; VPKEE,'KK__K'KK'KKKKK'K_',_", "K';;_KE,KKK let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
