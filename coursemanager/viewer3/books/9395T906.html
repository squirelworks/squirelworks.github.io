100"]}, {"id": "P13100", "text": ["2.  Carefully place PC130-441 in PC1 position, PC130-442 in \n      PC2 position and PC130-443 in PC3 position.", "3. Press Enter to set: Positive Supply Voltage to 12.", "2. Carefully place PC130-441 in PC1 position, PC130-442 in PC2 position and PC130-443 in PC3 position."], "jumps": []}, {"id": "P13090", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13080"]}, {"id": "P13080", "text": ["The first part of this experiment, you will use the Function Generator to produce an FM signal and view it on the oscilloscope.  You will also manipulate the signal by altering the frequency and percent of modulation.", "The first part of this experiment, you will use the Function Generator to produce an FM signal and view it on the oscilloscope. You will also manipulate the signal by altering the frequency and percent of modulation."], "jumps": ["P13090", "P13060"]}, {"id": "P13070", "text": ["A full operational test is then performed and any additional repairs or alignments on the receiver are done before returning the receiver to service."], "jumps": ["P13080", "P13060"]}, {"id": "P13060", "text": ["The accepted practice in the field is to perform an alignment after repairs are performed, but the alignment is performed on only the stage that was repaired.", "The accepted practice in the field is to perform an alignment after repairs are performed, but the alignment is performed on only the stage that was repaired.ntly changing. The Function Generator enables us to control the signal strength and amount of modulation, without interference."], "jumps": ["P13050", "P13070"]}, {"id": "P13050", "text": ["Manufacturers are also challenged to develop alignment procedures for use in the field requiring minimal test equipment.", "Manufacturers are also challenged to develop alignment procedures for use in the field requiring minimal test equipment. ose generated by test equipment."], "jumps": ["P13060", "P13020"]}, {"id": "P13040", "text": ["During the manufacturing process each stage in the receiver (RF, IF, FM Detector, etc) is completely aligned.", "During the manufacturing process each stage in the receiver (RF, IF, FM Detector, etc) is completely aligned...le this is limiting, some of the experiments can be re-created using the Function Generator rather than the FM receiver."], "jumps": ["P13050", "P13020"]}, {"id": "P13030", "text": ["Receiver alignment is a precise step-by-step process with each step building upon the previous step. The system of receiver alignment must be followed according to the manufacturer's procedure."], "jumps": ["P13040", "P13020"]}, {"id": "P13020", "text": ["During the experiment you will measure and visually examine a frequency modulated signal produced by a signal generator, view the IF and AF of a FM broadcast signal and perform an alignment procedure for an FM Receiver."], "jumps": ["P13030", "P2001"]}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is 10%. Do you want to __________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10224", "text": ["What is the approximate voltage applied to the VCO when tuned to 88 MHz? ? L2 should be adjusted to _______ VDC as seen at TP4 of PC130-442."], "jumps": []}, {"id": "P10223", "text": ["What is the approximate voltage applied to the VCO when tuned to 108.1 MHz? L2 should be adjusted to _______ VDC as seen at TP4 of PC130-442."], "jumps": []}, {"id": "P10222", "text": ["During alignment, the PLL must be tuned so that _______", "only frequencies evenly divisible by the IF are available. /", "all frequencies between 88 and 108 MHz are available."], "jumps": []}, {"id": "P10221", "text": ["The IF section of an FM receiver is normally aligned to _______"], "jumps": []}, {"id": "P10220", "text": ["A complete alignment of the entire receiver.", "Disabling the AGC (if applicable for the receiver).", "What is usually not required for the alignment of most receivers in the field?"], "jumps": []}, {"id": "P10217", "text": ["The Station Detector is controlled by _______"], "jumps": []}, {"id": "P10216", "text": ["current compensation for the IF amplifier."], "jumps": []}, {"id": "P10215", "text": [], "jumps": []}, {"id": "P10214", "text": ["The muting network in the FM trainer is located in _______"], "jumps": []}, {"id": "P10213", "text": ["The Discriminator used in the FM trainer is _______"], "jumps": []}, {"id": "P10212", "text": ["DC coupling between that point and the PC130-443 card.", "the lower sideband to pass into the IF section.", "only the 10.7 MHz signal to pass into the IF section. O"], "jumps": []}, {"id": "P10211", "text": ["On PC130-442, the purpose of U1 is to provide _______", "the RF Amplifier, Mixing operations and the Local Oscillator.", "Local Oscillator, Limiter and Mixing operations. I", "a clear reference for the Micoprocessor."], "jumps": []}, {"id": "P10210", "text": ["The VCO's output is always _______ below the incoming tuned RF."], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P5002", "text": [], "jumps": []}, {"id": "P5001", "text": [], "jumps": []}, {"id": "P5000", "text": [], "jumps": []}, {"id": "P2910", "text": ["This completes the experiment on FM CIRCUIT ANALYSIS.", "This completes the experiment on FM CIRCUIT ANALYSIS......."], "jumps": ["P2001", "P2630"]}, {"id": "P2630", "text": ["3.  Remove all cards and return all equipment to its proper                   storage location.", "3. Remove all cards and return all equipment to its proper storage location."], "jumps": ["P2910", "P2620"]}, {"id": "P2620", "text": ["2.  Set the Test Console Power to OFF.", "2. Set the Test Console Power to OFF.F...................."], "jumps": ["P2610"]}, {"id": "P2610", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": ["P2590"]}, {"id": "P2600", "text": ["As your receiver knowledge and experience grows, the time and effort needed to perform alignments will decrease."], "jumps": ["P2610", "P2590"]}, {"id": "P2590", "text": ["Most commercial receivers require a much more involved process for alignment.  This will vary with the size and complexity of the receiver.  Some multiband receivers can require alignments that, when done properly, can take the better part of a day to complete.", "Most commercial receivers require a much more involved process for alignment. This will vary with the size and complexity of the receiver. Some multiband receivers can require alignments that, when done properly, can take the better part of a day to complete."], "jumps": ["P2600", "P2570"]}, {"id": "P2580", "text": ["6.  Repeat steps 4 and 5 until the signal's gain is maximized.", "6. Repeat steps 4 and 5 until the signal's gain is maximized.."], "jumps": ["P2590", "P2570"]}, {"id": "P2570", "text": ["5.  Now connect the alligator clip to TP3 on PC130-442.  Set the          oscilloscopes trigger source to EXT.", "5. Now connect the alligator clip to TP3 on PC130-442. Set the oscilloscopes trigger source to EXT."], "jumps": ["P2580", "P2560"]}, {"id": "P2560", "text": ["4.  Connect the alligator clip or resistor lead to TP1 on PC130-443      (the IF amplifier stage).  Using a plastic alignment \"tweaking\"         tool or a small, insulated, flat-headed screwdriver, adjust T1           for maximum signal strength.", "4. Connect the alligator clip or resistor lead to TP1 on PC130-443 (the IF amplifier stage). Using a plastic alignment \"tweaking\" tool or a small, insulated, flat-headed screwdriver, adjust T1 for maximum signal strength."], "jumps": ["P2570", "P2550"]}, {"id": "P2550", "text": ["Because the oscilloscope may load down the signal during this portion of the alignment, a resistor (commonly 4.7 kW) may be used to prevent this problem.  Simply insert the resistor between the test point and the alligator clip.", "Because the oscilloscope may load down the signal during this portion of the alignment, a resistor (commonly 4.7 kW) may be used to prevent this problem. Simply insert the resistor between the test point and the alligator clip."], "jumps": ["P2560", "P2540"]}, {"id": "P2540", "text": ["3.  Connect a BNC to alligator cable to CH1 on the oscilloscope.        Set the Volts/Div to 5 mV and the Time/Div to .2 ms.", "3. Connect a BNC to alligator cable to CH1 on the oscilloscope. Set the Volts/Div to 5 mV and the Time/Div to .2 ms."], "jumps": ["P2550", "P2530"]}, {"id": "P2530", "text": ["1.  Ensure that the FM Receiver is working properly. \n2.  Tune to a known local station.", "1. Ensure that the FM Receiver is working properly. 2. Tune to a known local station.", "1. If the frequency display illuminates and/or any other light indicators, the power supply is probably good. 2. Place the tuning select switch on PC130-442 to PLL (Phase-Lock Loop). 3. Ensure that the LED frequency display on PC130-441 first illuminates with the word NIDA followed by the frequency 98.1. This frequency is exactly halfway between the lowest and highest frequency in the FM broadcast spectrum. 4. Press and hold the scan-up and scan-down buttons on the frequency display. Did the frequencies go up and down accordingly? 5. Press and hold the seek button. The frequency display should begin incrementing itself in 200 kHz steps until a strong frequency is detected. At that time, the seek function should halt and lock and station detector LED's should illuminate. If the lock light comes on, the PLL is working. Is there audio? If yes, adjust the volume control on PC130-443. Does it regulate the sound level? 6. Place the tuning select switch in the manual position. Rotate the manual tuning control knob until a broadcast station is clearly audible."], "jumps": ["P2540", "P2525", "Phase"]}, {"id": "P2525", "text": ["The second part of the alignment process involves tuning the IF transformers for maximum response.  The first transformer is actually a part of the mixer circuit, but, in fact, is more of a tunable input for the IF amplifier.  The second transformer is located on PC130-443 and is shown as a part of the IF section.", "The second part of the alignment process involves tuning the IF transformers for maximum response. The first transformer is actually a part of the mixer circuit, but, in fact, is more of a tunable input for the IF amplifier. The second transformer is located on PC130-443 and is shown as a part of the IF section."], "jumps": ["P2530", "P2520"]}, {"id": "P2524", "text": ["Ease of calculation is not the issue.", "Ease of calculation is not the issue.ation is not the issue."], "jumps": []}, {"id": "P2523", "text": ["Dividing by 9 would leave the result incorrect.", "Dividing by 9 would leave the result incorrect.e the result incorrect."], "jumps": []}, {"id": "P2522", "text": ["The VCO has nothing to do with the limiter.", "The VCO has nothing to do with the limiter.to do with the limiter."], "jumps": []}, {"id": "P2521", "text": [], "jumps": []}, {"id": "P2520", "text": ["The purpose of divide by 10 for the VCO adjustment is _______", "14.  Perform steps 11, 12 and 13 using a station on the upper end        of the FM band.", "because dividing by 9 would be too difficult..", "to simulate the function of the Prescaler..", "14. Perform steps 11, 12 and 13 using a station on the upper end of the FM band."], "jumps": ["P2510", "P2520", "P2490"]}, {"id": "P2500", "text": ["13.  Now divide the frequency by 10.  This division simulates the          division process performed by the Prescaler.  After the                     division is performed, the quotient should match the                         frequency displayed on the Function Generator.", "13. Now divide the frequency by 10. This division simulates the division process performed by the Prescaler. After the division is performed, the quotient should match the frequency displayed on the Function Generator....."], "jumps": ["P2510", "P2490"]}, {"id": "P2490", "text": ["12.  Using the frequency counter on the Function Generator,                  measure the frequency at TP6 on PC130-442.  Notice the                 displayed frequency on PC130-441, subtract 10.7 MHz from            the displayed frequency.", "11.  Verification of proper VCO adjustment may be accomplished          by tuning to a known broadcast station at both the upper                and lower ends of the FM band.  First tune to a station at the           low end.", "The tuning process you have just performed has set the limits for the receiver's VCO.  The receiver will now be able to tune to any available frequency in the FM broadcast band.", "12. Using the frequency counter on the Function Generator, measure the frequency at TP6 on PC130-442. Notice the displayed frequency on PC130-441, subtract 10.7 MHz from the displayed frequency.", "11. Verification of proper VCO adjustment may be accomplished by tuning to a known broadcast station at both the upper and lower ends of the FM band. First tune to a station at the low end.", "The tuning process you have just performed has set the limits for the receiver's VCO. The receiver will now be able to tune to any available frequency in the FM broadcast band."], "jumps": ["P2500", "P2480", "P2490", "P2470", "P2460"]}, {"id": "P2460", "text": ["10.  Ensure you have the negative lead of the voltmeter                           connected to a ground source and the positive lead to TP4             on PC130-442.  Adjust L2 on PC130-442 to approximately\n       4.5 volts.", "10. Ensure you have the negative lead of the voltmeter connected to a ground source and the positive lead to TP4 on PC130-442. Adjust L2 on PC130-442 to approximately 4.5 volts."], "jumps": ["P2470", "P2440"]}, {"id": "P2450", "text": ["9.  Tune the receiver to approximately 87.9 MHz.  Adjust L2 for a          voltage of approximately .3 VDC on the voltmeter.", "9. Tune the receiver to approximately 87.9 MHz. Adjust L2 for a voltage of approximately .3 VDC on the voltmeter."], "jumps": ["P2460", "P2440"]}, {"id": "P2440", "text": ["8.  This operation aligns the receiver's top end.  We will now                 perform the alignment for the low end.", "8. This operation aligns the receiver's top end. We will now perform the alignment for the low end."], "jumps": ["P2450", "P2420"]}, {"id": "P2430", "text": ["7.  Connect the negative lead of the voltmeter to a ground source      and the positive lead to TP4 of PC130-442.  Adjust L2 on                  PC130-441 for a reading of approximately 4.5 VDC on the                voltmeter.", "7. Connect the negative lead of the voltmeter to a ground source and the positive lead to TP4 of PC130-442. Adjust L2 on PC130-441 for a reading of approximately 4.5 VDC on the voltmeter."], "jumps": ["P2440", "P2420"]}, {"id": "P2420", "text": ["6.  Connect the probe (X10 if available) to CH1 of the                              oscilloscope  and TP3 on PC130-441.  The oscilloscope                   should display negative going spikes.", "6. Connect the probe (X10 if available) to CH1 of the oscilloscope and TP3 on PC130-441. The oscilloscope should display negative going spikes."], "jumps": ["P2430", "P2410"]}, {"id": "P2410", "text": ["3.  Ensure that the receiver is functioning properly. \n4.  Place the tuning select switch on PC130-442 to the PLL                   position.\n5.  Using the push-buttons on PC130-441, adjust the frequency           to the receiver's top end (approximately 108.1).", "3. Ensure that the receiver is functioning properly. 4. Place the tuning select switch on PC130-442 to the PLL position. 5. Using the push-buttons on PC130-441, adjust the frequency to the receiver's top end (approximately 108.1)."], "jumps": ["P2420", "P2400"]}, {"id": "P2400", "text": ["2.  Set the voltmeter to DC voltage.", "2. Set the voltmeter to DC voltage........................"], "jumps": ["P2410", "P2390"]}, {"id": "P2390", "text": ["1.  Place the function generator and oscilloscope controls to the        following settings:", "1. Place the function generator and oscilloscope controls to the following settings:", "Range - 1 MHz CH1 Volts/Div - .5 V (X1 probe) Function - Sine Wave 50 mV (X10 probe) Amplitude - Mid-Range Time/Div - 1 ms Frequency - 1 MHz Trigger Source - CH1 Counter Select - Internal (INT) Sweep Mode - Auto Modulation - AM Modulation Adjust Knob - Mid-Range Range - 10 kHz Frequency Adjust Knob - Mid-Range", "FUNCTION GENERATOR oadcast Citizen Band Narrow Band FM Single Side-Band Independent Side-Band", "Range........................... - N/A Function....................... - N/A Amplitude..................... - N/A Attenuation................... - N/A Frequency.................... - N/A Counter Select............. - EXT Modulation................... - N/A Modulation Adjust Knob- N/A Range........................... - N/A Frequency Adjust Knob - N/A-RangengeRange Mid-Rangenge-Range-Rangege- Mid-Rangeeee Mid-Range10 kHz Frequency Adjust Knob - Mid-RangeFrequency Adjust Knob - Mid-Rangeee", "OSCILLOSCOPE ATOR roadcast Citizen Band Narrow Band FM Single Side-Band Independent Side-Band", "CH1 Volts/Div.. - .2 V Time/Div......... - .1 ms Trigger Source - CH1 Sweep Mode... - Auto Trigger Source - CH1 Sweep Mode... - Auto .. - Auto eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee Frequency Adjust Knob - Mid-Rangeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeecy Adjust Knob - Mid-Rangeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee Knob - Mid-Rangeee"], "jumps": ["P2400", "P2370"]}, {"id": "P2380", "text": ["In order to achieve this, the PLL must be able to tune to 10.7 MHz below the lowest frequency in the FM band and 10.7 MHz above the highest frequency in the FM band."], "jumps": ["P2390", "P2370"]}, {"id": "P2370", "text": ["The first step in the alignment process is to ensure that the Phase Lock Loop is tuned in such a way that the entire FM frequency band is available.  This means that it must be capable of locking onto all frequencies between 88 to 108 MHz.", "The first step in the alignment process is to ensure that the Phase Lock Loop is tuned in such a way that the entire FM frequency band is available. This means that it must be capable of locking onto all frequencies between 88 to 108 MHz."], "jumps": ["P2380", "P2360"]}, {"id": "P2360", "text": ["In some cases it may be necessary to place a 10 kW resistor across each tuned circuit during the alignment process to lower the Q of the circuits.  In this lesson we will be using a Function (Signal) Generator.", "In some cases it may be necessary to place a 10 kW resistor across each tuned circuit during the alignment process to lower the Q of the circuits. In this lesson we will be using a Function (Signal) Generator."], "jumps": ["P2370", "P2340"]}, {"id": "P2350", "text": ["Sweep alignment is a standard procedure when aligning wideband amplifiers, and is always required when aligning television tuners. The IF section of an FM broadcast receiver, however, has a narrower bandwidth than a television tuner, and alignment can be accomplished with a standard signal generator if it is done carefully."], "jumps": ["P2360", "P2340"]}, {"id": "P2340", "text": ["Some sweep generators provide \"markers\" at 10.6 MHz, \n10.7 MHz and 10.8 MHz which show up on the oscilloscope pattern, as illustrated below.  These markers provide guidance when shaping the response curve.", "Some sweep generators provide \"markers\" at 10.6 MHz, 10.7 MHz and 10.8 MHz which show up on the oscilloscope pattern, as illustrated below. These markers provide guidance when shaping the response curve."], "jumps": ["P2350", "P2330"]}, {"id": "P2330", "text": ["Instead of injecting a signal at 10.7 MHz and then peaking the tuned circuits, the IF section is swept with a Sweep Generator and the tunable circuits are adjusted to produce the desired response curve as seen on an oscilloscope."], "jumps": ["P2340", "P2300"]}, {"id": "P2320", "text": ["The IF section of an FM broadcast receiver is usually aligned at 10.7 MHz with a bandwidth of 200 kHz.  Due to this bandwidth, the third step listed below is normally modified.", "The IF section of an FM broadcast receiver is usually aligned at 10.7 MHz with a bandwidth of 200 kHz. Due to this bandwidth, the third step listed below is normally modified. The tunable circuits must be aligned from the detector back to the mixer.", "3. The tunable circuits must be aligned from the detector back to the mixer."], "jumps": ["P2330", "P2300"]}, {"id": "P2310", "text": ["The FM Receiver trainer does not require the steps below because of its simplicity.  This is particularly due to the IF section. Most commercial radios have multiple IF stages which makes disabling the local oscillator (VCO) critical to proper alignment.", "The FM Receiver trainer does not require the steps below because of its simplicity. This is particularly due to the IF section. Most commercial radios have multiple IF stages which makes disabling the local oscillator (VCO) critical to proper alignment."], "jumps": ["P2320", "P2300"]}, {"id": "P2300", "text": ["There are some differences from one type of receiver to another, but most commercial receivers require certain pre-alignment steps.", "There are some differences from one type of receiver to another, but most commercial receivers require certain pre-alignment steps. 1. The local oscillator must be disabled. 2. The AGC (if appropriate) must be disabled. 3. The tunable circuits must be aligned from the detector back to the mixer.", "1. The local oscillator must be disabled. 2. The AGC (if appropriate) must be disabled. 3. The tunable circuits must be aligned from the detector back to the mixer. he negative lead to any ground potential. 4. Connect the counter TP5 on the PC130-442 card. 5. Adjust variable resistor R2 until approximately 87 MHz is present on the counter. 6. Take note of the DC voltage level on the meter. Future adjustments are then possible without the frequency counter. 7. Turn the tuning control knob fully clockwise and ensure that the upper range is inclusive to 108 MHz. If not, re-adjust the pot at the low end a bit closer to 88 MHz. In most cases this will not be necessary........ry.cessary.ary."], "jumps": ["P2310", "P2275"]}, {"id": "P2290", "text": ["While the size and complexity of a receiver normally dictates the degree of difficulty involved in the alignment, the process itself    is fairly simple.", "While the size and complexity of a receiver normally dictates the degree of difficulty involved in the alignment, the process itself is fairly simple."], "jumps": ["P2300", "P2275"]}, {"id": "P2280", "text": ["Fortunately, this is not a very common occurrence and is usually the result of an \"alignment\" by someone that has no idea what they are doing.", "Whether you are working with an AM, FM, SSB, Short Wave or any other receiver, proper alignment is necessary for the receiver to operate with peak performance.  In some cases, the receiver may be so misaligned that it will not work at all.", "Whether you are working with an AM, FM, SSB, Short Wave or any other receiver, proper alignment is necessary for the receiver to operate with peak performance. In some cases, the receiver may be so misaligned that it will not work at all."], "jumps": ["P2290", "P2275", "P2280", "P2270"]}, {"id": "P2274", "text": ["Carrier frequency will not increase with increased modulation.", "Carrier frequency will not increase with increased modulation.ith increased modulation."], "jumps": []}, {"id": "P2273", "text": ["Amplitude is constant in FM.", "Amplitude is constant in FM.mplitude is constant in FM....."], "jumps": []}, {"id": "P2272", "text": ["Observe the oscilloscope screen closely when increasing modulation.", "Observe the oscilloscope screen closely when increasing modulation.when increasing modulation."], "jumps": []}, {"id": "P2271", "text": [], "jumps": []}, {"id": "P2270", "text": ["When the modulation was increased, what happened to the signal as displayed on the oscilloscope?"], "jumps": ["P2260"]}, {"id": "P2260", "text": ["11.  Using the modulation portion of the Function Generator,                  change the percent of modulation and the frequency.  Note            the change in the tonal quality as either one is varied.               12.  Remove all probes and cables from the test equipment.", "11. Using the modulation portion of the Function Generator, change the percent of modulation and the frequency. Note the change in the tonal quality as either one is varied. 12. Remove all probes and cables from the test equipment."], "jumps": ["P2270", "P2230"]}, {"id": "P2250", "text": ["10.  The waveform present on the oscilloscope is the detected               audio tone that modulated the 10.7 MHz carrier frequency               produced by the Function Generator.", "10. The waveform present on the oscilloscope is the detected audio tone that modulated the 10.7 MHz carrier frequency produced by the Function Generator."], "jumps": ["P2260", "P2230"]}, {"id": "P2240", "text": ["The waveform should be symmetrical and free of any distortion. If the upper and lower peaks are distorted, fine adjust the frequency control knob on the Function Generator until the distortion is minimized. If the peaks are clipped (squared off) adjust the volume control down until the desired waveshape is achieved."], "jumps": ["P2250", "P2230"]}, {"id": "P2230", "text": ["9.  Connect the BNC to alligator cable from the Function                       Generator to TP3 (IF Out) on PC130-442.  A tone should be              heard coming from the Speaker and a sine wave should now         be seen on the oscilloscope screen.", "9. Connect the BNC to alligator cable from the Function Generator to TP3 (IF Out) on PC130-442. A tone should be heard coming from the Speaker and a sine wave should now be seen on the oscilloscope screen."], "jumps": ["P2240", "P2220"]}, {"id": "P2220", "text": ["8.  Verify that the receiver is functioning properly and remove              power from PC2.  This will disable the local oscillator and                allow an injected signal to pass uninterrupted into the                      discriminator.", "8. Verify that the receiver is functioning properly and remove power from PC2. This will disable the local oscillator and allow an injected signal to pass uninterrupted into the discriminator."], "jumps": ["P2230", "P2210"]}, {"id": "P2210", "text": ["5.  Ensure the signal generator is still set to 1 MHz. \n6.  Adjust the Frequency Control knob to 10.7 MHz.  \n7.  Set the oscilloscopes Time/Div control to 1 ms and the                     Volts/Div to 1 Volt.", "5. Ensure the signal generator is still set to 1 MHz. 6. Adjust the Frequency Control knob to 10.7 MHz. 7. Set the oscilloscopes Time/Div control to 1 ms and the Volts/Div to 1 Volt."], "jumps": ["P2220", "P2200"]}, {"id": "P2200", "text": ["4.  Disconnect the BNC to BNC cable from CH1 of the                            oscilloscope.  Connect the oscilloscope probe from CH1 to            TP3 (Power Amplifier out) on the PC130-443 card.", "4. Disconnect the BNC to BNC cable from CH1 of the oscilloscope. Connect the oscilloscope probe from CH1 to TP3 (Power Amplifier out) on the PC130-443 card."], "jumps": ["P2210", "P2190", "Power"]}, {"id": "P2190", "text": ["3.  Slowly rotate the frequency control knob on the Function               Generator while observing the waveform on the oscilloscope.       As the frequency increases, you can clearly see the portion of       the signal that the oscilloscope triggered on.", "3. Slowly rotate the frequency control knob on the Function Generator while observing the waveform on the oscilloscope. As the frequency increases, you can clearly see the portion of the signal that the oscilloscope triggered on."], "jumps": ["P2200", "P2170"]}, {"id": "P2180", "text": ["The oscilloscope needs to sync on the incoming signal.  Since the essential element of FM is varying the frequency, it is more      difficult for the oscilloscope to lock on the signal.  AM, on the       other hand, varies amplitude.  This allows the oscilloscope to fully trigger on the signal.", "The oscilloscope needs to sync on the incoming signal. Since the essential element of FM is varying the frequency, it is more difficult for the oscilloscope to lock on the signal. AM, on the other hand, varies amplitude. This allows the oscilloscope to fully trigger on the signal."], "jumps": ["P2190", "P2170"]}, {"id": "P2170", "text": ["2.  A frequency modulated signal should appear on the                         oscilloscope at this time.  Notice how only a portion of the              displayed wave appears to be triggered on.  Even low                      frequency FM signals are not as well displayed on an                       oscilloscope as are AM.", "2. A frequency modulated signal should appear on the oscilloscope at this time. Notice how only a portion of the displayed wave appears to be triggered on. Even low frequency FM signals are not as well displayed on an oscilloscope as are AM."], "jumps": ["P2180", "P2160"]}, {"id": "P2160", "text": ["1.  Attach a \"T\" connector to the main output of the Function               Generator.  Connect a BNC to BNC cable from one side of the       \"T\" connector to CH1 of the oscilloscope.  Connect a X10               probe to the other side of the \"T\" connector.", "1. Attach a \"T\" connector to the main output of the Function Generator. Connect a BNC to BNC cable from one side of the \"T\" connector to CH1 of the oscilloscope. Connect a X10 probe to the other side of the \"T\" connector."], "jumps": ["P2170", "P2145"]}, {"id": "P2150", "text": ["An operational test is easy to develop and should be performed for any receiver or other electronic equipment you are working with.  As a technician, it is an important maintenance procedure.", "An operational test is easy to develop and should be performed for any receiver or other electronic equipment you are working with. As a technician, it is an important maintenance procedure."], "jumps": ["P2160", "P2145"]}, {"id": "P2145", "text": ["If any problems still exist, check your procedure steps again.  If there is still a problem, inform your instructor.", "If any problems still exist, check your procedure steps again. If there is still a problem, inform your instructor."], "jumps": ["P2150", "P2140"]}, {"id": "P2140", "text": ["Before beginning the experiment, we will check for normal operation of the FM Receiver.", "1. If the frequency display illuminates and/or any other light indicators, the power supply is probably good. 2. Place the tuning select switch on PC130-442 to PLL (Phase-Lock Loop). 3. Ensure that the LED frequency display on PC130-441 first illuminates with the word NIDA followed by the frequency 98.1. This frequency is exactly halfway between the lowest and highest frequency in the FM broadcast spectrum. 4. Press and hold the scan-up and scan-down buttons on the frequency display. Did the frequencies go up and down accordingly? 5. Press and hold the seek button. The frequency display should begin incrementing itself in 200 kHz steps until a strong frequency is detected. At that time, the seek function should halt and lock and station detector LED's should illuminate. If the lock light comes on, the PLL is working. Is there audio? If yes, adjust the volume control on PC130-443. Does it regulate the sound level? 6. Place the tuning select switch in the manual position. Rotate the manual tuning control knob until a broadcast station is clearly audible."], "jumps": ["P2145", "P2130", "Phase"]}, {"id": "P2130", "text": ["5.  Place the function generator and oscilloscope controls to the        following settings:", "5. Place the function generator and oscilloscope controls to the following settings:", "Range - 1 MHz CH1 Volts/Div - .5 V (X1 probe) Function - Sine Wave 50 mV (X10 probe) Amplitude - Mid-Range Time/Div - 1 ms Frequency - 1 MHz Trigger Source - CH1 Counter Select - Internal (INT) Sweep Mode - Auto Modulation - AM Modulation Adjust Knob - Mid-Range Range - 10 kHz Frequency Adjust Knob - Mid-Range", "FUNCTION GENERATOR oadcast Citizen Band Narrow Band FM Single Side-Band Independent Side-Band", "Range........................... - 1 M Function....................... - Sine Wave Amplitude..................... - Mid-Range Attenuation................... - 20 dbm Frequency.................... - 7 MHz Counter Select............. - Internal (INT) Modulation................... - FM, Sine Wave Modulation Adjust Knob- Fully CW Range........................... - 10 kHz Frequency Adjust Knob - Mid-Rangeeee Mid-Range10 kHz Frequency Adjust Knob - Mid-RangeFrequency Adjust Knob - Mid-Rangeee", "OSCILLOSCOPE ATOR roadcast Citizen Band Narrow Band FM Single Side-Band Independent Side-Band", "CH1 Volts/Div.. - .2 V Time/Div......... - 2 ms Trigger Source - CH1 Sweep Mode... - Auto Trigger Source - CH1 Sweep Mode... - Auto .. - Auto eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee Frequency Adjust Knob - Mid-Rangeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeecy Adjust Knob - Mid-Rangeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee Knob - Mid-Rangeee"], "jumps": ["P2140", "P2120"]}, {"id": "P2120", "text": ["4.  Set PC1, PC2, PC3 and SPEAKER DC Power Switches to ON.", "4. Set PC1, PC2, PC3 and SPEAKER DC Power Switches to ON................ch to ON...."], "jumps": ["P2110"]}, {"id": "P2110", "text": ["3.  Set the Positive Supply Voltage to 12 volts.", "3. Set the Positive Supply Voltage to 12 volts.30A - Set the PC1 DC Switch to ON...."], "jumps": ["P2100"]}, {"id": "P2100", "text": ["2.  Carefully place PC130-441 in PC1 position, PC130-442 in PC2         position and PC130-443 in PC3 position.", "2. Carefully place PC130-441 in PC1 position, PC130-442 in PC2 position and PC130-443 in PC3 position. ch to ON........................................."], "jumps": ["P2090"]}, {"id": "P2090", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2080"]}, {"id": "P2080", "text": ["The first part of this experiment, you will use the Function Generator to produce an FM signal and view it on the oscilloscope.  You will also manipulate the signal by altering the frequency and percent of modulation.", "The first part of this experiment, you will use the Function Generator to produce an FM signal and view it on the oscilloscope. You will also manipulate the signal by altering the frequency and percent of modulation."], "jumps": ["P2090", "P2060"]}, {"id": "P2070", "text": ["As you will see, this is equally true when we compare FM signals coming from a broadcast station with FM signals from the Function Generator."], "jumps": ["P2080", "P2060"]}, {"id": "P2060", "text": ["This results from the fact that the Function Generator created a static signal, whereas, live broadcast signals are modulated by     intelligence that is constantly changing.  The Function Generator enables us to control the signal strength and amount of modulation, without interference.", "This results from the fact that the Function Generator created a static signal, whereas, live broadcast signals are modulated by intelligence that is constantly changing. The Function Generator enables us to control the signal strength and amount of modulation, without interference."], "jumps": ["P2050", "P2070"]}, {"id": "P2050", "text": ["You may remember that the AM broadcast signals measured and viewed on the oscilloscope were not nearly as well defined as those generated by test equipment."], "jumps": ["P2060", "P2020"]}, {"id": "P2040", "text": ["As a result, many of the experiments in the AM lesson cannot be accomplished using the FM receiver card set.  While this is limiting, some of the experiments can be re-created using the Function Generator rather than the FM receiver.", "As a result, many of the experiments in the AM lesson cannot be accomplished using the FM receiver card set. While this is limiting, some of the experiments can be re-created using the Function Generator rather than the FM receiver."], "jumps": ["P2050", "P2020"]}, {"id": "P2030", "text": ["Many signals found in the receiver are either too high in frequency or too low in amplitude (or both) to be measurable by some test equipment."], "jumps": ["P2040", "P2020"]}, {"id": "P2020", "text": ["During the experiment you will measure and visually examine a frequency modulated signal produced by a signal generator, view the IF and AF of a FM broadcast signal and perform an alignment procedure for an FM Receiver."], "jumps": ["P2030", "P2001"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "8.  The IF amp, Limiter and Discriminator are located in U1,                    PC130- 443.", "You have completed the Summary. You are about to return to the Objective Menu.", "8. The IF amp, Limiter and Discriminator are located in U1, PC130- 443."], "jumps": ["P1001", "P1985", "P1999", "P1980"]}, {"id": "P1980", "text": ["7.  The Station Detector is controlled by the incoming signal and         the variable resistor, R2.", "7. The Station Detector is controlled by the incoming signal and the variable resistor, R2."], "jumps": ["P1985", "P1970"]}, {"id": "P1970", "text": ["6.  The muting network blocks weak signals and quiets the                   receiver when tuned between stations.", "5.  The T1 transformer is tuned to pass IF to the IF Amplifier on            the PC130-443 card.", "4.  Manual  tuning is accomplished by bypassing the PC 130-441       card and using a local VCO control potentiometer.", "6. The muting network blocks weak signals and quiets the receiver when tuned between stations.", "5. The T1 transformer is tuned to pass IF to the IF Amplifier on the PC130-443 card. ection.", "4. Manual tuning is accomplished by bypassing the PC 130-441 card and using a local VCO control potentiometer. elements in the RF section is decided by R1."], "jumps": ["P1980", "P1960", "P1970", "P1950", "P1940", "P"]}, {"id": "P1940", "text": ["3.  The VCO's output is always 10.7 MHz below the incoming                tuned RF.", "2.  Tuning is digital on the Nida Model 130 FM receiver. The                   microcontroller, PLL, Control/Display and the reference                   crystal oscillator are mounted on the PC 130-441 card.", "1.  The PC130-442 card mounts the FM front end electronics,                including the RF Amplifier, VCO, and Mixer.", "3. The VCO's output is always 10.7 MHz below the incoming tuned RF.", "2. Tuning is digital on the Nida Model 130 FM receiver. The microcontroller, PLL, Control/Display and the reference crystal oscillator are mounted on the PC 130-441 card..", "1. The PC130-442 card mounts the FM front end electronics, including the RF Amplifier, VCO, and Mixer."], "jumps": ["P1950", "P1930", "P1940", "P1920", "P1001"]}, {"id": "P1910", "text": ["This completes the information on SCHEMATIC ANALYSIS.", "This completes the information on SCHEMATIC ANALYSIS......."], "jumps": ["P1001", "P1390"]}, {"id": "P1394", "text": ["The push buttons control the microprocessor only...plication. 10 and mod 11."], "jumps": []}, {"id": "P1393", "text": ["Synthesized frequencies are not used in this PLL application.", "Synthesized frequencies are not used in this PLL application. 10 and mod 11."], "jumps": []}, {"id": "P1392", "text": ["Parallel data would require 16 lines and  there are only 3 lines between the PLL and microcontroller.", "Parallel data would require 16 lines and there are only 3 lines between the PLL and microcontroller."], "jumps": []}, {"id": "P1391", "text": [], "jumps": []}, {"id": "P1390", "text": ["The PLL and Microcontroller communicate over what kind of link_______", "The PLL and Microcontroller communicate over what kind of link_______._____", "PLL troubleshooting steps are relatively easy: 1. Verify the clock operation (confirms power and partial operation). 2. Verify the microcontroller input and output lines. 3. Verify the Voltage Controlled Oscillator output voltage. 4. Verify Phase Lock. Should everything test correctly, look to the RF section of the receiver."], "jumps": ["P1380", "P1390", "P1310"]}, {"id": "P1377", "text": ["When the PLL is unlocked, (move S1 on PC130-442 to \"Man.\") the DC voltage at TP4 drops to about 2 volts and the duty cycle is less than 50%. n oscilloscope will show a waveform with a duty cycle of about 95%.."], "jumps": ["P1380", "P1310"]}, {"id": "P1375", "text": ["When the PLL is locked the DC voltage at TP4 will read almost 5 volts. An oscilloscope will show a waveform with a duty cycle of about 95%.r an oscilloscope., the loop locks. 1 kHz frequency at the output."], "jumps": ["P1380", "P1310"]}, {"id": "P1370", "text": ["The Lock Detect signal at TP4 is a digital signal with a duty cycle dependent upon the lock condition.  It can be verified with a multimeter or an oscilloscope.", "The Lock Detect signal at TP4 is a digital signal with a duty cycle dependent upon the lock condition. It can be verified with a multimeter or an oscilloscope., the loop locks. 1 kHz frequency at the output."], "jumps": ["P1380", "P1310"]}, {"id": "P1365", "text": ["The frequency at TP6 is at the local oscillator frequency and will vary between 77.3 MHz and 97.4 MHz. Accurate measurements can only be made with equipment capable of this frequency range. DC output voltage is made..."], "jumps": ["P1370", "P1310"]}, {"id": "P1360", "text": ["The PLL IC outputs a DC voltage and compares the input feed back at TP6 for frequency and phase comparison to an internal reference.  Should an out-of-lock condition exist, correction to the DC output voltage is made.", "The PLL IC outputs a DC voltage and compares the input feed back at TP6 for frequency and phase comparison to an internal reference. Should an out-of-lock condition exist, correction to the DC output voltage is made..."], "jumps": ["P1370", "P1310"]}, {"id": "P1350", "text": ["The DC voltage at TP5 will vary from about 0.5 VDC at 88 MHz and almost 5 VDC at 108.1 MHz.  Should the voltage at TP5 be zero or out of range, verify proper operation of the RF circuitry using manual tuning prior to troubleshooting the PLL circuits.", "The DC voltage at TP5 will vary from about 0.5 VDC at 88 MHz and almost 5 VDC at 108.1 MHz. Should the voltage at TP5 be zero or out of range, verify proper operation of the RF circuitry using manual tuning prior to troubleshooting the PLL circuits.lock indication is displayed using an LED."], "jumps": ["P1360", "P1310"]}, {"id": "P1340", "text": ["Another test of the system that can be performed to confirm normal operation during the seek sweep/function is to monitor the DC voltage at TP5 on the PC130-441 card.  This test point is the VCO output voltage from the PLL circuitry.", "Another test of the system that can be performed to confirm normal operation during the seek sweep/function is to monitor the DC voltage at TP5 on the PC130-441 card. This test point is the VCO output voltage from the PLL circuitry."], "jumps": ["P1350", "P1310"]}, {"id": "P1330", "text": ["While they may not be accurate to measure, the waveforms at TP1, TP2, and TP3 can be viewed with most oscilloscopes.  Set the volts per division control to its lowest setting, usually 0.1 mV.", "While they may not be accurate to measure, the waveforms at TP1, TP2, and TP3 can be viewed with most oscilloscopes. Set the volts per division control to its lowest setting, usually 0.1 mV.."], "jumps": ["P1340", "P1310"]}, {"id": "P1320", "text": ["The serial interface to the microcontroller is at test point 2.  TP1 contains the serial clock signal.  TP3 is the serial data enable.  All three test points contain frequencies near the local oscillator frequency.", "The system requires a stable clock to operate.  The 4 MHz clock can be verified at TP10 using an oscilloscope or frequency counter.  Verifying the clock also confirms the IC has power.", "While the theory of phase lock loop circuitry can tend to be complicated, servicing a phase lock loop is easier than it appears.  The illustration has the key elements of the circuit identified.", "The serial interface to the microcontroller is at test point 2. TP1 contains the serial clock signal. TP3 is the serial data enable. All three test points contain frequencies near the local oscillator frequency...", "The system requires a stable clock to operate. The 4 MHz clock can be verified at TP10 using an oscilloscope or frequency counter. Verifying the clock also confirms the IC has power. source for the reference frequency.", "While the theory of phase lock loop circuitry can tend to be complicated, servicing a phase lock loop is easier than it appears. The illustration has the key elements of the circuit identified......"], "jumps": ["P1330", "P1310", "P1320", "P1300", "P1230"]}, {"id": "P1230", "text": ["The output of the audio amplifier at pin 5 is sufficient to drive a speaker.  The audio output is coupled to the speaker through C14.", "The output of the audio amplifier at pin 5 is sufficient to drive a speaker. The audio output is coupled to the speaker through C14.requires a larger signal to drive the speaker. Hence, the audio amplifier. The signal enters on pin 8 of U2, is amplified and then sent to the output (pin 2) which drives the speaker."], "jumps": ["P1300", "P1220"]}, {"id": "P1220", "text": ["Audio from the quadrature detector is coupled through C10 to R5, the volume control.  The wiper of R2 is connected to the input of the audio amplifier, U2, at pin 3.", "Audio from the quadrature detector is coupled through C10 to R5, the volume control. The wiper of R2 is connected to the input of the audio amplifier, U2, at pin 3."], "jumps": ["P1230", "P1210"]}, {"id": "P1210", "text": ["U3 compares the level of the received signal strength reference to a threshold level set by R2.  When the DC level at pin 2 of U3A is higher than the DC level set at pin 3, pin 1 goes low forward biasing DS1 causing it to illuminate.", "U3 compares the level of the received signal strength reference to a threshold level set by R2. When the DC level at pin 2 of U3A is higher than the DC level set at pin 3, pin 1 goes low forward biasing DS1 causing it to illuminate.."], "jumps": ["P1220", "P1170"]}, {"id": "P1200", "text": ["o the signal strength circuit. The output at pin 5 is a DC voltage level referenced to the IF signal strength l", "A second output of the IF amplifier is fed to the signal strength circuit. The output at pin 5 is a DC voltage level referenced to the IF signal strength level."], "jumps": ["P1210", "P1170"]}, {"id": "P1180", "text": ["The Quadrature Detector has two outputs.  An unmuted output at pin 7 is unused in this application.  The second output is routed to the Mute circuitry.  The mute circuit blocks weak signals and quiets the receiver between stations.", "The Quadrature Detector has two outputs. An unmuted output at pin 7 is unused in this application. The second output is routed to the Mute circuitry. The mute circuit blocks weak signals and quiets the receiver between stations. ontrolled switch. Pin 7 is not connected in this particular application."], "jumps": ["P1190", "P1160"]}, {"id": "P1170", "text": ["The Limiter removes any noise spikes that have been amplified through the IF circuit.  The output of the Limiter is applied to the Quadrature Detector, the FM detector circuit.", "The signal at pin 14 is applied to X2, another 10.7 MHz ceramic filter.  X2's output is fed to pin 12 of U1, the Limiter input.", "The Limiter removes any noise spikes that have been amplified through the IF circuit. The output of the Limiter is applied to the Quadrature Detector, the FM detector circuit. Discriminator (Quadrature Detector).", "The signal at pin 14 is applied to X2, another 10.7 MHz ceramic filter. X2's output is fed to pin 12 of U1, the Limiter input. imiter."], "jumps": ["P1180", "P1160", "P1170", "P1150"]}, {"id": "P1150", "text": ["The signal from T1 leaves PC130-442 and is applied to pin E of PC130-443 and is sent to X1, a ceramic band pass filter that is        tuned to 10.7 MHz.  From the filter, the signal enters U1 at pin 16.", "The IF frequency is the result of subtracting the local oscillator frequency from the tuned RF frequency.", "The IF frequency should be below the desired RF frequency.", ". A reference signal out of the IF amplifier is applied to the signal strength driver. The IF signal containing the audio is output at pin 14. The IF signal is at 10.7 MHz wi", "The IF signal is applied to the IF amplifier. A reference signal out of the IF amplifier is applied to the signal strength driver. The IF signal containing the audio is output at pin 14. The IF signal is at 10.7 MHz with a 200 kHz bandwidth...", "The signal from T1 leaves PC130-442 and is applied to pin E of PC130-443 and is sent to X1, a ceramic band pass filter that is tuned to 10.7 MHz. From the filter, the signal enters U1 at pin 16.", "The IF frequency is the result of subtracting the local oscillator frequency from the tuned RF frequency. (the difference between the two)..", "TuningDC Inngggggggg or PLL TuningggggggggggggOO", "The IF frequency should be below the desired RF frequency.."], "jumps": ["P1160", "P1140", "P1150", "P1130"]}, {"id": "P1131", "text": [], "jumps": []}, {"id": "P1130", "text": ["In the FM Receiver card set, the IF is the result of _______", "Tuning is accomplished by varying the reverse bias for D1 and D2.  D1 and L2 make up the local oscillator tuned circuit.  D2 and L1 make up the RF tuned circuit, always 10.7 MHz above the local oscillator frequency.  This system provides a tuning range of 88 MHz to 108 MHz, the standard FM commercial band.", "the sum of the original RF and VCO output.", "the product of the original RF and VCO output.", "the difference of the original RF and VCO output.", "none of the above................................", "Tuning is accomplished by varying the reverse bias for D1 and D2. D1 and L2 make up the local oscillator tuned circuit. D2 and L1 make up the RF tuned circuit, always 10.7 MHz above the local oscillator frequency. This system provides a tuning range of 88 MHz to 108 MHz, the standard FM commercial band...", "TuningDC Innggggg let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
