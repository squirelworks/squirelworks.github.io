const book = {"title": "93954702", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: D/A CONVERSION sdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Identify the purpose of D/A conversion circuits. w Recognize binary weighted D/A converter circuits. w Recognize R/2R ladder D/A converter circuits and describe resolution.", "w Predict the outputs of a R/2R ladder D/A converter. w Measure the outputs of a R/2R ladder D/A converter. w Recognize normal operation of a R/2R ladder D/A converter."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P335", "text": [], "jumps": []}, {"id": "P400", "text": ["Digital to analog (D/A) conversion is a process required by most digital circuits."], "jumps": []}, {"id": "P410", "text": ["In music, for example, voice signals are digitized for processing and then changed back to analog."], "jumps": ["P400", "P420"]}, {"id": "P420", "text": ["Without good A/D conversion, the music you hear might not sound like the performer."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["Let's begin the lesson on D/A CONVERSION.................................."], "jumps": ["P410"]}, {"id": "P900", "text": [], "jumps": ["P430"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Digital to analog conversion changes digital signals to analog signals."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["D/A converter circuits accept binary inputs to generate analog voltages."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Recall that each binary column value is twice the value of the preceding column value."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["A D/A converter circuit generates voltages to represent the binary column values."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["There are two methods to accomplish the conversion.  Let's look at weighted D/A conversion first.", "There are two methods to accomplish the conversion. Let's look at weighted D/A conversion first."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["A network of four resistors represents a binary number with four digits.  One resistor is required for each input.", "A network of four resistors represents a binary number with four digits. One resistor is required for each input."], "jumps": ["P1075", "P1060"]}, {"id": "P1075", "text": ["Each binary digit's value is represented by a resistor value."], "jumps": ["P1080", "P1070"]}, {"id": "P1080", "text": ["How many resistors are required if the binary number has 5 digits?"], "jumps": ["P1070"]}, {"id": "P1081", "text": [], "jumps": []}, {"id": "P1082", "text": ["Seven resistors can accommodate 7 bit inputs.", "Seven resistors can accommodate 7 bit inputs..............."], "jumps": []}, {"id": "P1083", "text": ["Six resistors can accommodate 6 bit inputs.", "Six resistors can accommodate 6 bit inputs................."], "jumps": []}, {"id": "P1090", "text": ["The weighted D/A converter places a 0 volt potential at TP1 using an op-amp."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["When a high is applied to input D, current flows through resistor R."], "jumps": ["P1120", "P1090"]}, {"id": "P1120", "text": ["The source of the current is from the output of the op-amp through Rout.", "The current path is between input D and the op-amp output through Rout.", "The source of the current is from the output of the op-amp through Rout.Y"], "jumps": ["P1130", "P1090"]}, {"id": "P1130", "text": ["Current does not flow from the inverting input (-) of the op-amp due to the very high input impedance.", "Current does not flow thru the inverting input (-) of the op-amp due to the very high input impedance."], "jumps": ["P1140", "P1090"]}, {"id": "P1140", "text": ["The current flow produced by R develops a voltage across Rout.  This is the analog output voltage.", "The current flow produced by R develops a voltage across Rout. This is the analog output voltage."], "jumps": ["P1150", "P1090"]}, {"id": "P1150", "text": ["The amount of voltage depends on the current generated by resistor R."], "jumps": ["P1160", "P1090"]}, {"id": "P1160", "text": ["Resistor R has the lowest resistance. Voltage produced by the high input of D generates the largest voltage output."], "jumps": ["P1170", "P1090"]}, {"id": "P1170", "text": ["Resistor 2R has the second lowest resistance and generates half as much voltage as resistor R."], "jumps": ["P1175", "P1090"]}, {"id": "P1175", "text": ["Resistor 4R generates half as much voltage as 2R and resistor 8R generates half as much voltage as 4R."], "jumps": ["P1180", "P1090"]}, {"id": "P1180", "text": ["When more than one input is high, the currents combine.  Four inputs are available and 16 different outputs are possible.", "When more than one input is high, the currents combine. Four inputs are available and 16 different outputs are possible."], "jumps": ["P1190", "P1090"]}, {"id": "P1190", "text": ["For example in this circuit, a high on input D and C produces 3 volts."], "jumps": ["P1200", "P1090"]}, {"id": "P1200", "text": ["The current through R1 is .2 mA.  The current through R2 is .1 mA.", "The current through R1 is .2 mA. The current through R2 is .1 mA..."], "jumps": ["P1210", "P1190", "P1205"]}, {"id": "P1205", "text": ["CALCULATE CURRENT - Use Ohm's Law to calculate the current through R1 and R2.", "5 R1 = =.2mA 25 k 5 R2 = =.1mA 50 k"], "jumps": []}, {"id": "P1207", "text": ["The current through R1 is .2 mA.  The current through R2 is .1 mA.", "The current through R1 is .2 mA. The current through R2 is .1 mA."], "jumps": ["P1210", "P1190", "P1205"]}, {"id": "P1210", "text": ["The total current is .3 mA through Rout which produces 3 volts."], "jumps": ["P1220", "P1207", "P1215"]}, {"id": "P1215", "text": ["CALCULATE CURRENT - Using Kirchhoff's current law, the sum of the currents into TP1 equals the sum of the currents out of TP1."], "jumps": []}, {"id": "P1217", "text": ["The total current is .3 mA through Rout which produces 3 volts."], "jumps": ["P1220", "P1207", "P1215"]}, {"id": "P1220", "text": ["What is the output voltage with 0011 applied to the inputs?"], "jumps": ["P1217"]}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1222", "text": ["The current through R3 is .05 mA and the current through R4 is .025 mA.  The total current is .075 mA.  Multiply the total current by the resistance of Rout.", "The current through R3 is .05 mA and the current through R4 is .025 mA. The total current is .075 mA. Multiply the total current by the resistance of Rout."], "jumps": []}, {"id": "P1230", "text": ["What is the output voltage with 0000 applied to the inputs?"], "jumps": ["P1220"]}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1232", "text": ["Remember, a 0V potential is at TP1 and with 0 volts on the inputs no current flow is produced."], "jumps": []}, {"id": "P1240", "text": ["The other method of D/A conversion uses scaling resistors.  They divide the input into fractional values.", "The other method of D/A conversion uses scaling resistors. They divide the input into fractional values."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["With four binary inputs there are 16 combinations possible."], "jumps": ["P1260", "P1240", "P1255"]}, {"id": "P1255", "text": ["4 = number of inputs 4 2 = 16", "CALCULATING BINARY COMBINATIONS - Since there are two possible outputs for every binary input, multiply the number 2 by the n power (n being the number of inputs)."], "jumps": []}, {"id": "P1257", "text": ["With four binary inputs there are 16 combinations possible."], "jumps": ["P1260", "P1240", "P1255"]}, {"id": "P1260", "text": ["The circuit divides +5 volts into 16 equal parts, then combines the parts to produce 16 different output voltages."], "jumps": ["P1270", "P1257"]}, {"id": "P1270", "text": ["The smallest voltage generated is 1/16 of the input voltage.  This is called the resolution voltage.", "The smallest voltage generated is 1/16 of the input voltage. This is called the resolution voltage."], "jumps": ["P1280", "P1257", "P1275"]}, {"id": "P1275", "text": ["RESOLUTION - Resolution voltage is the smallest increment of voltage that can be expressed. It is essentially the voltage represented by the LSD in the binary input, therefore: resolution is a function of the number of bits."], "jumps": []}, {"id": "P1276", "text": ["The smallest voltage generated is 1/16 of the input voltage.  This is called the resolution voltage.", "The smallest voltage generated is 1/16 of the input voltage. This is called the resolution voltage."], "jumps": ["P1280", "P1257", "P1275"]}, {"id": "P1280", "text": ["What is the resolution of a 5 bit binary scaled D/A converter?"], "jumps": ["P1276", "P1285"]}, {"id": "P1281", "text": [], "jumps": []}, {"id": "P1282", "text": ["A resolution of 1/16 indicates that there are 16 different output voltages.  A five bit binary number has 32 different combinations.", "A resolution of 1/16 indicates that there are 16 different output voltages. A five bit binary number has 32 different combinations."], "jumps": []}, {"id": "P1283", "text": ["A resolution of 1/64 indicates that there are 64 different output voltages.  A five bit binary number has 32 different combinations.", "A resolution of 1/64 indicates that there are 64 different output voltages. A five bit binary number has 32 different combinations."], "jumps": []}, {"id": "P1285", "text": ["4 = number of inputs 4 2 = 16", "CALCULATING BINARY COMBINATIONS - Since there are two possible outputs for every binary input, multiply the number 2 by the n power (n being the number of inputs)."], "jumps": []}, {"id": "P1290", "text": ["What is the resolution of a 3 bit binary scaled D/A converter?"], "jumps": ["P1280", "P1295"]}, {"id": "P1291", "text": [], "jumps": []}, {"id": "P1292", "text": ["A three bit digital input can produce 8 different analog outputs.  The resolution is the smallest output voltage that can be generated.", "A three bit digital input can produce 8 different analog outputs. The resolution is the smallest output voltage that can be generated."], "jumps": []}, {"id": "P1295", "text": ["4 = number of inputs 4 2 = 16", "CALCULATING BINARY COMBINATIONS - Since there are two possible outputs for every binary input, multiply the number 2 by the n power (n being the number of inputs)."], "jumps": []}, {"id": "P1300", "text": ["The R/2R D/A converter uses scaling resistors to form a network designed to produce a fixed output."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["Using a R value of 1k for an example, an input of 1000 produces 8/16 of the input voltage or 2.5 volts."], "jumps": ["P1330", "P1300", "P1325"]}, {"id": "P1320", "text": ["Using a R value of 1k for an example, an input of 1000 produces 8/16 of the input voltage or 2.5 volts."], "jumps": ["P1330", "P1300", "P1325"]}, {"id": "P1325", "text": ["CIRCUIT ANALYSIS - R8 and R7 are in parallel producing 1k which is in series with R6."], "jumps": ["P1326", "P1320"]}, {"id": "P1326", "text": ["Req and R5 are in parallel producing 1k which is in series with R4.", "Req and R5 are in parallel producing 1k which is in series with R4............................................................."], "jumps": ["P1327", "P1325"]}, {"id": "P1327", "text": ["Req and R3 are in parallel producing 1k which is in series with R2.", "Req and R3 are in parallel producing 1k which is in series with R2............................................................."], "jumps": ["P1328", "P1325"]}, {"id": "P1328", "text": ["The +5 volts is divided equally between the two resistors giving an output of +2.5 volts.", "The +5 volts is divided equally between the two resistors giving an output of +2.5 volts......................................."], "jumps": ["P1320", "P1325"]}, {"id": "P1330", "text": ["An input of 0100 produces 4/16 of the input voltage or 1.25 volts."], "jumps": ["P1340", "P1320", "P1335"]}, {"id": "P1335", "text": ["The circuit reduces to a simple series parallel circuit. Solving for the output produces 1.25 volts."], "jumps": []}, {"id": "P1337", "text": ["An input of 0100 produces 4/16 of the input voltage or 1.25 volts.", "An input of 0100 produces 4/16 of the input voltage or 1.25 volts.."], "jumps": ["P1340", "P1320", "P1335"]}, {"id": "P1340", "text": ["What is the voltage output with 0010 applied to the input?", "What is the voltage output with 0010 applied to the input?."], "jumps": ["P1337", "P1345"]}, {"id": "P1341", "text": [], "jumps": []}, {"id": "P1342", "text": ["0.3125 volts is the output if 0001 is the input.", "0.3125 volts is the output if 0001 is the input............"], "jumps": []}, {"id": "P1343", "text": ["0.0000 volts is the output if 0000 is the input.", "0.0000 volts is the output if 0000 is the input............"], "jumps": []}, {"id": "P1345", "text": ["For an input of 0010, multiply 5 volts by 2/16. Or you can solve this circuit!"], "jumps": []}, {"id": "P1350", "text": ["What is the voltage output with 1100 applied to the input?", "What is the voltage output with 1100 applied to the input?."], "jumps": ["P1340", "P1355"]}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1352", "text": ["3.1250 volts is 10/16 of the input voltage.  The binary input would be 1010.", "3.1250 volts is 10/16 of the input voltage. The binary input would be 1010."], "jumps": []}, {"id": "P1353", "text": ["3.4375 volts is 11/16 of the input voltage.  The binary input would be 1011.", "3.4375 volts is 11/16 of the input voltage. The binary input would be 1011."], "jumps": []}, {"id": "P1355", "text": ["For an input of 1100, multiply 5 volts by 12/16. Or you can solve this circuit!"], "jumps": []}, {"id": "P1910", "text": ["This completes the information on D/A CONVERSION.", "This completes the information on D/A CONVERSION.LE........"], "jumps": ["P1001", "P1350"]}, {"id": "P1920", "text": ["1.  Digital to analog conversion changes a digital signal to an              analog signal.  \n2.  D/A converter circuits accept a binary input and generate an          analog voltage proportional to its input.", "1. Digital to analog conversion changes a digital signal to an analog signal. 2. D/A converter circuits accept a binary input and generate an analog voltage proportional to its input."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["3.  A D/A converter generates a voltage that is twice as much for        each digit.  \n4.  The two methods used are weighted and scaled.", "3. A D/A converter generates a voltage that is twice as much for each digit. 4. The two methods used are weighted and scaled."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["5.  The binary weighted D/A converter uses weighting. \n6.  Each resistor represents a binary digit's value.", "5. The binary weighted D/A converter uses weighting. 6. Each resistor represents a binary digit's value.."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["7.  The R/2R D/A converter uses scaling.  \n8.  The resistor network divides the input voltage into equal parts.", "7. The R/2R D/A converter uses scaling. 8. The resistor network divides the input voltage into equal parts."], "jumps": ["P1999", "P1940"]}, {"id": "P1999", "text": ["You have completed the Summary.  You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1950"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["This experiment demonstrates the operation of a R/2R D/A converter.  You will enter a binary input and measure the output of the converter to verify correct operation.", "This experiment demonstrates the operation of a R/2R D/A converter. You will enter a binary input and measure the output of the converter to verify correct operation."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["Pick up the PC130-136 card.  The purpose of this card is to demonstrate a R/2R D/A converter.", "Pick up the PC130-136 card. The purpose of this card is to demonstrate a R/2R D/A converter."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["The counter produces 16 different binary outputs.  Output A is the LSD.  S1clears the counter.", "The counter produces 16 different binary outputs. Output A is the LSD. S1clears the counter."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["The eight resistors are the D/A converter."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["The analog gate enables the output of the D/A converter to the display TP when PC130-111 S1 is in the 1 position.  Let's start the experiment.", "The analog gate enables the output of the D/A converter to the display TP when PC130-111 S1 is in the 1 position. Let's start the experiment."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2040"]}, {"id": "P2090", "text": ["2.  Set the Voltmeter Switch to Positive.  \n3.  Set the Positive Supply Voltage to 5. The Test Console's                 Voltage Meter should indicate 5 volts.", "2. Set the Voltmeter Switch to Positive. 3. Set the Positive Supply Voltage to 5. The Test Console's Voltage Meter should indicate 5 volts. = SCAN PWR 0 12 External program = SCAN FCC 0"], "jumps": ["P2080"]}, {"id": "P2100", "text": ["4.  Carefully plug PC130-111 into the Test Console PC1 position.  5.  Carefully plug PC130-136 into the Test Console PC2 position.", "4. Carefully plug PC130-111 into the Test Console PC1 position. 5. Carefully plug PC130-136 into the Test Console PC2 position. External program = SCAN FTR 0 C1 00..................."], "jumps": ["P2090"]}, {"id": "P2110", "text": ["6.  Set S2 to PULSER and S3 to 1 on PC130-111. \n7.  Set S2 to STAIR, S3 to 16 and S4 to D/A on PC130-136. \n8.  If using a logic probe connect it to PC130-111.  The\n     oscilloscope can also be used to display logic state.", "6. Set S2 to PULSER and S3 to 1 on PC130-111. 7. Set S2 to STAIR, S3 to 16 and S4 to D/A on PC130-136. 8. If using a logic probe connect it to PC130-111. The oscilloscope can also be used to display logic state..."], "jumps": ["P2120", "P2100", "P2115"]}, {"id": "P2115", "text": ["PC130-111 - S2 - Pulser S3 - 1 PC130-136 - S2 - Stair S3 - 16 S4 - D/A S4 - D/A S4 - D/A"], "jumps": []}, {"id": "P2120", "text": ["9.  Set PC1 and PC2 DC Power switches to ON.", "9. Set PC1 and PC2 DC Power switches to ON.. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2110"]}, {"id": "P2130", "text": ["10.  Press and release S1 on PC130-136.  \n11.  Probe the outputs of the counter on PC130-136 using the \n       logic probe urth line of text for the distractor. X"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to _________"], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P13020", "text": ["This experiment demonstrates the operation of a R/2R D/A converter.  You will enter a binary input and measure the output of the converter to verify correct operation.", "This experiment demonstrates the operation of a R/2R D/A converter. You will enter a binary input and measure the output of the converter to verify correct operation."], "jumps": ["P13040", "P2001"]}, {"id": "P13040", "text": ["Pick up the PC130-136 card.  The purpose of this card is to demonstrate a R/2R D/A converter.", "Pick up the PC130-136 card. The purpose of this card is to demonstrate a R/2R D/A converter."], "jumps": ["P13050", "P13020"]}, {"id": "P13050", "text": ["The counter produces 16 different binary outputs.   Output A is the LSD.  S1 clears the counter.", "The counter produces 16 different binary outputs. Output A is the LSD. S1 clears the counter."], "jumps": ["P13060", "P13040"]}, {"id": "P13060", "text": ["The eight resistors are the D/A converter."], "jumps": ["P13070", "P13040"]}, {"id": "P13070", "text": ["The analog gate enables the output of the D/A converter to the display TP when PC130-111 S3 is in the 1 position.  Let's start the experiment.", "The analog gate enables the output of the D/A converter to the display TP when PC130-111 S3 is in the 1 position. Let's start the experiment."], "jumps": ["P13080", "P13040"]}, {"id": "P13080", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13040"]}, {"id": "P13090", "text": ["2.  Press Enter to set: Positive Supply Voltage - 5", "2. Press Enter to set: Positive Supply Voltage - 5........................"], "jumps": []}, {"id": "P13100", "text": ["3.  Carefully plug PC130-111 into the Test Console PC1 position.  4.  Carefully plug PC130-136 into the Test Console PC2 position.", "3. Carefully plug PC130-111 into the Test Console PC1 position. 4. Carefully plug PC130-136 into the Test Console PC2 position."], "jumps": ["P13110"]}, {"id": "P13110", "text": ["5.  Set S2 to PULSER and S3 to 1 on PC130-111. \n6.  Set S2 to STAIR, S3 to 16 and S4 to D/A on PC130-136. \n7.  If using a logic probe connect it to PC130-111.  The\n     oscilloscope can also be used to display logic state.", "5. Set S2 to PULSER and S3 to 1 on PC130-111. 6. Set S2 to STAIR, S3 to 16 and S4 to D/A on PC130-136. 7. If using a logic probe connect it to PC130-111. The oscilloscope can also be used to display logic state.."], "jumps": ["P13120", "P13100", "P13115"]}, {"id": "P13115", "text": ["PC130-111 - S2 - Pulser S3 - 1 PC130-136 - S2 - Stair S3 - 16 S4 - D/A S4 - D/A"], "jumps": []}, {"id": "P13120", "text": ["8.  Press Enter to set: PC1 and PC2 DC Power Switches - ON", "8. Press Enter to set: PC1 and PC2 DC Power Switches - ON................."], "jumps": ["P13110"]}, {"id": "P13130", "text": ["9.  Press and release S1 on PC130-136.  \n10.  Probe the outputs of the counter on PC130-136 using the \n       logic probe or oscilloscope set to measure DC while \n       pressing and releasing S1 on PC130-111.  The counter                     should count from 0000 to 1111.", "9. Press and release S1 on PC130-136. 10. Probe the outputs of the counter on PC130-136 using the logic probe or oscilloscope set to measure DC while pressing and releasing S1 on PC130-111. The counter should count from 0000 to 1111..."], "jumps": ["P13140", "P13135"]}, {"id": "P13135", "text": ["SET UP - If the indication in step 11 is not correct, check the set up:", "- PC130-111 in PC1, PC130-136 in PC2. - S2 set to PULSER on PC130-111. - S2 set to STAIR, S3 set to 16 and S4 set to D/A on PC130-136. - Check with your instructor.btract the offset voltage.set voltage.ffset voltage.TP and subtract the offset voltage.voltage."], "jumps": []}, {"id": "P13140", "text": ["The experiment is now set up.  Let's verify the operation of the R/2R converter.", "The experiment is now set up. Let's verify the operation of the R/2R converter."], "jumps": ["P13150", "P13130"]}, {"id": "P13150", "text": ["1.  Press and release S1 on PC130-111 until the counters                      contents are 1111.  \n2.", "1. Press and release S1 on PC130-111 until the counters contents are 1111. 2. ..................................................................................................................................................................", "1. Press and release S1 on PC130-111 until the counters contents are 1111. 2. Using a digital multimeter set to measure DC, measure the outputs of the counter. Type in the measured output voltages to two decimal places if your meter offers the resolution."], "jumps": ["P13140", "P13155"]}, {"id": "P13151", "text": [], "jumps": []}, {"id": "P13152", "text": ["Your answer is not acceptable.  Check your multimeter and test lead placement.", "Your answer is not acceptable. Check your multimeter and test lead placement."], "jumps": []}, {"id": "P13155", "text": ["PC130-111 - Press and Release S1 PC130-136 - Measure the outputs of the counter"], "jumps": []}, {"id": "P13157", "text": ["Your answer is incorrect. You should have measured approximately 2.4 to 5 volts."], "jumps": ["PutVar"]}, {"id": "P13160", "text": ["3.  Take the average of the four voltage readings. This is the                applied voltage to the D/A converter.  \n     A=           ,  B=           ,  C=           ,  D=  \n     Type in the average voltage to two decimal places.", "3. Take the average of the four voltage readings. This is the applied voltage to the D/A converter. A= , B= , C= , D= Type in the average voltage to two decimal places.ces."], "jumps": ["P13150", "P13162"]}, {"id": "P13161", "text": [], "jumps": []}, {"id": "P13162", "text": ["Add the four voltages and divide by 4.", "Add the four voltages and divide by 4. with a negative sign.............."], "jumps": []}, {"id": "P13167", "text": ["Your answer is incorrect.  You should have measured approximately 2.4 to 5 volts.", "Your answer is incorrect. You should have measured approximately 2.4 to 5 volts."], "jumps": ["PutVar"]}, {"id": "P13170", "text": ["4.  Press and release S1 on PC130-136. The inputs to the                      converter should be 0000.  \n5.  Using a digital multimeter set to measure DC, measure the              output of the converter on the DISPLAY TP.  Type in the                   measured voltage in volts to three decimal places.", "4. Press and release S1 on PC130-136. The inputs to the converter should be 0000. 5. Using a digital multimeter set to measure DC, measure the output of the converter on the DISPLAY TP. Type in the measured voltage in volts to three decimal places..."], "jumps": ["P13160", "P13175", "P13172"]}, {"id": "P13171", "text": [], "jumps": []}, {"id": "P13172", "text": ["Remember, you're measuring volts.  The calculated value is 0 volts, applied voltage is multiplied by 0/16.  However, in a real circuit there will be some small voltage.  Check with your instructor if you measure more than .150 volts with a 0000 digital input.", "Remember, you're measuring volts. The calculated value is 0 volts, applied voltage is multiplied by 0/16. However, in a real circuit there will be some small voltage. Check with your instructor if you measure more than .150 volts with a 0000 digital input..."], "jumps": []}, {"id": "P13175", "text": ["PC130-111 - Press and Release S1 PC130-136 - Measure the output of the converter on the Display TP."], "jumps": []}, {"id": "P13177", "text": ["Your answer is incorrect. You should have measured between .001 and .150 volts."], "jumps": ["PutVar"]}, {"id": "P13180", "text": ["The calculated voltage for a digital input of 0000 is 0 volts.  The voltage measured is an offset voltage.  This voltag jumps": []}, {"id": "P13212", "text": ["Check:", "Check:0001 is the output of the counter. - That you are measuring the DISPLAY TP. - That you subtracted the offset from the measured voltage. - With your instructor.", "- 0001 is the output of the counter. - That you are measuring the DISPLAY TP. - That you subtracted the offset from the measured voltage. - With your instructor."], "jumps": []}, {"id": "P13217", "text": ["Your answer is incorrect. You should have measured between .13 and .34 volts."], "jumps": ["PutVar"]}, {"id": "P13220", "text": ["Notice that your predicted value matches your measured value within the tolerance of the resistors used in the D/A converter and the accuracy of your multimeter.", "Predicted Measured V V subtracted the offset from the measured voltage. - With your instructor.r."], "jumps": ["P13230", "P13210"]}, {"id": "P13230", "text": ["10.  Set the counter to 0101.  Use the logic probe or oscilloscope    to verify the                 contents of the counter.", "10. Set the counter to 0101. Use the logic probe or oscilloscope to verify the contents of the counter.", "10. Set the counter to 0101. Use the logic probe, oscilloscope, or digital multimeter to verify the contents of the counter at test points A, B, C, and D."], "jumps": ["P13240", "P13220", "P13235"]}, {"id": "P13235", "text": ["SETTING THE COUNTER TO 0101 - Press and release S1 on PC130-111 until the probed outputs of the counter on PC130-136 indicates 0101."], "jumps": []}, {"id": "P13240", "text": ["11.  Measure the output voltage of the converter.  Calculate the             output value and compare with the measured value minus               the voltage offset.  Do the values agree?", "11. Measure the output voltage of the converter. Calculate the output value and compare with the measured value minus the voltage offset. Do the values agree?"], "jumps": ["P13230", "P13245"]}, {"id": "P13241", "text": [], "jumps": []}, {"id": "P131", "text": [], "jumps": []}, {"id": "P132 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
