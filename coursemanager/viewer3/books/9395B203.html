e signal        at TP3.   \n5.  Adjust C6 for the maximum amplitude signal.", "CARRIER SIGNAL ADJUSTMENT - Adjust C6 for a maximum amplitude signal. The signal should be approximately 1.5 Vpp.", "4. Using the oscilloscope (with a X10 probe) measure the signal at TP3. 5. Adjust C6 for the maximum amplitude signal."], "jumps": ["P13290", "P13270", "P13240", "P13265"]}, {"id": "P14200", "text": ["The test console is now set up.  Let's first set up and align the AM transmitter card.", "7.  Adjust PC130-92 R5 for the loudest possible tone.  Note that          R7 is the volume control and can be raised or lowered as                desired, the mid position is recommended.  However, try not          to disturb your class.", "The AM signal is present at TP3, this is the transmitters output signal.", "The negative alternation of the carrier signal may be distorted.", "The test console is now set up. Let's first set up and align the AM transmitter card.", "7. Adjust PC130-92 R5 for the loudest possible tone. Note that R7 is the volume control and can be raised or lowered as desired, the mid position is recommended. However, try not to disturb your class."], "jumps": ["P14210", "P14330", "P13250", "P13230"]}, {"id": "P13231", "text": ["Type in the measured frequency to one decimal place.", "2.  Using the oscilloscope (with a X10 probe) measure the signal        on emitter of Q2 (bottom lead). \n3.  Adjust T1 for the best possible signal.", "Type in the measured frequency to one decimal place....................) in a variable.able.le.", "2. Using the oscilloscope (with a X10 probe) measure the signal on emitter of Q2 (bottom lead). 3. Adjust T1 for the best possible signal."], "jumps": ["P13200", "P13212", "P13230", "P13210"]}, {"id": "P13217", "text": ["You still have not measured the correct value of fc.  You should have measured 1 MHz.", "You still have not measured the correct value of fc. You should have measured 1 MHz........."], "jumps": ["P13220", "P13210"]}, {"id": "P let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
