put or output coupling capacitor prevents an AC signal reaching the base of the transistor or from reaching the output of the circuit. This does not effect the DC operating voltages. An open input or output coupling capacitor is easily identified by measuring the AC signal before and after the capacitor.\" to \"An open bypass capacitor will result in degeneration by allowing AC variations to be developed across the emitter resistor. This will not effect the DC voltage on the emitter but will cause the output signal on the collector to be smaller than expected.\" p1080 - added text \"...TRACING. Basically, there are two styles of signal tracing - Linear and Half-Splitting. The linear method, as the name implies, follows the signal through the amplifier stages in a straight line. Half-splitting uses a method of dividing multiple amplifier stages into smaller and smaller sections. p1090 - changed text from \"Signal tracing is a method of troubleshooting that measures a known input signal through a circuit from beginning to end.\" to \"Linear signal tracing is a method of throubleshooting that follows a known signal from input to input through the stages until it is lost. This method requires many measurements to accomplish.\" p1100 - added text \"...tracing. This is the LINEAR method of signal tracing. p1150 - added \"...in the driver amplifier stage... p1300 & 1302 added to text: Note: Disregard base current for this example. 10-03-02 p1260 & 1262 changed text from \"Only an open capacitor will not change DC bias.\" to \"Only an open input /output coupling or bypass capacitor will not change DC bias.\" frieda 02-03-03 P1325, 1327 changed scripting of help button (previous pages) to get setupAndGoto (\" \"). frieda 11-04-03 P2250, P13250, changed \"2 Vpp\" to \"1.5 Vpp\"- Dean 12-04-03 P1200, inverted the input to Q2. Waveform was in phase with input to circuit and I changed it so that it is 180 out of phase with the input. -Penny 02-18-04 P13650, 2650, changed correct answer to \"R12 Open\" (it was R11 Open) and incorrect2 response to \"R11 Shorted\". Also named the second incorrect response field to \"incorrect2\". -Pennyyy"], "jumps": []}, {"id": "P13910", "text": ["This completes the experiment on MULTISTAGE TROUBLESHOOTING.", "This completes the experiment on MULTISTAGE TROUBLESHOOTING.."], "jumps": ["P2001", "P13720"]}, {"id": "P13720", "text": ["2.  Disconnect all test equipment.\n3.  Carefully remove PC130-33 and PC130-34.   \n4.  Return all equipment to its proper storage area.", "2. Disconnect all test equipment. 3. Carefully remove PC130-33 and PC130-34. 4. Return all equipment to its proper storage area................"], "jumps": ["P13910", "P13710"]}, {"id": "P13710", "text": ["1.  Turn Power OFF to the Test Console.", "1. Turn Power OFF to the Test Console..FF................................."], "jumps": []}, {"id": "P13690", "text": ["Notice that the 1 kHz tone is heard in the speaker. There are no more faults."], "jumps": []}, {"id": "P2230", "text": ["1.  Leave the CH1 input connected to TP2  PC130-33 throughout \n     the next few steps.\n2. Trigger the oscilloscope to the CH1 input, using the CH2 input \n     for signal tracing.", "1. Leave the CH1 input connected to TP2 PC130-33 throughout the next few steps. 2. Trigger the oscilloscope to the CH1 input, using the CH2 input for signal tracing....................", "The CH1 input is kept at TP2, the circuit input, to view each amplifier stage as it inverts the input signal.BNC - Function Generator at 1 kHz, 2 Vpp"], "jumps": ["P2240", "P2220"]}, {"id": "P13260", "text": ["4.  Using the CH2 input, measure the signal at PC130-33 TP3. \n   This is the input to Q1.", "4. Using the CH2 input, measure the signal at PC130-33 TP3. This is the input to Q1.", "4. Using the CH2 input, measure the signal at PC130-33 TP3. This is the input to Q1..."], "jumps": ["P13270", "P13250", "P13265"]}, {"id": "P13660", "text": ["Congratulations, you found the fault. R12 could have been open. The resistance from the emitter of Q2 to ground was infinity."], "jumps": ["P13670", "P13650"]}, {"id": "P13653", "text": ["S3 is OUT (closed), which shorts out R11.  R11 is NOT in the circuit and can not be the fault.", "S3 is OUT (closed), which shorts out R11. R11 is NOT in the circuit and can not be the fault."], "jumps": []}, {"id": "P13652", "text": ["If C6 was open, you would still measure the resistance of R12,  3.3 kW, between the emitter and ground.", "If C6 was open, you would still measure the resistance of R12, 3.3 kW, between the emitter and ground.........."], "jumps": []}, {"id": "P13651", "text": [], "jumps": []}, {"id": "P13910", "text": ["This completes the experiment on MULTISTAGE TROUBLESHOOTING.", "This completes the experiment on MULTISTAGE TROUBLESHOOTING..", "of measuring the emitter to ground resistance, which component is probably faulted?", "MULTIMETER PLACEMENT - Connect the multimeter leads to TP1 and TP10."], "jumps": ["P2001", "P13720"]}, {"id": "P13640", "text": ["12.  Measure the resistance from the emitter of Q2 to ground,                  TP10 to TP1. Notice you measured infinity.", "12. Measure the resistance from the emitter of Q2 to ground, TP10 to TP1. Notice you measured infinity."], "jumps": ["P13650", "P13630", "P13645"]}, {"id": "P13630", "text": ["11.  Measure the resistance across R10, TP7 to TP8. Notice you            measured around 10 kW, R10 is not shorted.", "11. Measure the resistance across R10, TP7 to TP8. Notice you measured around 10 kW, R10 is not shorted."], "jumps": ["P13640", "P13605"]}, {"id": "P13620", "text": ["9.  Press Enter to set:  PC2 DC Power Switch - OFF \n                                             PC3 DC Power Switch - OFF     \n10.  Disconnect the function generator from the Test Console.", "9. Press Enter to set: PC2 DC Power Switch - OFF PC3 DC Power Switch - OFF 10. Disconnect the function generator from the Test Console................................................."], "jumps": ["P13610"]}, {"id": "P13610", "text": ["Notice that you measured approximately 0 V. The fault is in either R10 shorted, the transistor, or the emitter circuit.", "MULTIMETER PLACEMENT - Connect the multimeter leads to TP7 and TP8."], "jumps": ["P13620", "P13600"]}, {"id": "P13600", "text": ["8.  Measure the voltage across R10, TP7 to TP8 on PC130-33. If          the measurement is 12 V, R10 is open.  If the voltage is 0 V,             R10 is shorted or the fault is in the transistor or emitter circuit.", "8. Measure the voltage across R10, TP7 to TP8 on PC130-33. If the measurement is 12 V, R10 is open. If the voltage is 0 V, R10 is shorted or the fault is in the transistor or emitter circuit.."], "jumps": ["P13610", "P13590", "P13605"]}, {"id": "P13590", "text": ["Note, Ec measures 12 V, the applied voltage. This indicates an open between the collector of Q2 and ground or a fault that prevents emitter to collector current flow.", "Measured Calculated Eb = 2.92 VDC Ee = 2.32 VDC Ec = 4.97 VDC", "MULTIMETER PLACEMENT - Use TP6, TP8 and TP10 to measure Eb, Ee and Ec."], "jumps": ["P13600", "P13580", "P13584", "P13585", "P"]}, {"id": "P13587", "text": ["Ee = 3.32 VDC Eb - .6 = 2.92 - .6 = 2.32 V Ec = 5 VDC Ie = Ee/Re = 2.32/R11 + R12 = 2.32/3.3 k = .7 mA Ie = Ic, Er10 = Ic x R10 = 7 V, Vcc - Er10 = 5 VVV VVVVV"], "jumps": ["P13584", "P13586"]}, {"id": "P13586", "text": ["Eb = 3.92 VDC R8 + R9 = 74 kW I = 12 V/74 kW = .162 mA Er9 = I x R9 = .162 mA x 18 kW = 2.92 VV"], "jumps": ["P13587", "P13584"]}, {"id": "P13585", "text": ["MEASURED VALUES Eb - Voltage on the base of Q2. Measure from TP6 to ground. Ee - Voltage on the emitter of Q2. Measure from TP10 to ground. Ec - Voltage on the collector of Q2. Measure from TP8 to ground."], "jumps": ["P13588", "P13584"]}, {"id": "P13680", "text": ["1.  Remove the multimeter from the circuit.\n2.  Press Enter to set: PC2 DC Power Switch - ON\n                                          PC3 DC Power Switch - ON   \n3.  Connect the function generator to PC1 Output BNC.", "1. Remove the multimeter from the circuit. 2. Press Enter to set: PC2 DC Power Switch - ON PC3 DC Power Switch - ON 3. Connect the function generator to PC1 Output BNC."], "jumps": ["P13670", "P13175"]}, {"id": "P13583", "text": ["Your measurements are still incorrect. You should have measured approximately 3.0 V at Eb, 2.4 V at Ee, and 12 V at Ec. Check to see that your multimeter is set correctly."], "jumps": ["P13580"]}, {"id": "P13582", "text": ["Your measurement is incorrect. Check the set up of the multimeter.", "Your measurement is incorrect. Check the set up of the multimeter.........."], "jumps": []}, {"id": "P13581", "text": [], "jumps": []}, {"id": "P13580", "text": ["7. Measure and type in the DC voltages in the circuit for Q2 (use a multimeter). Compare to calculated values........"], "jumps": ["P13570", "P13584"]}, {"id": "P13570", "text": ["Stage 2 of the four stage amplifier is not working, it has a good input but no output. Now, you can troubleshoot Q2 as you would an individual common emitter amplifier."], "jumps": ["P13580", "P13560"]}, {"id": "P13562", "text": ["The inserted fault does effect the output signal of stage 2, Q2. Check your measurement."], "jumps": []}, {"id": "P13561", "text": [], "jumps": []}, {"id": "P13560", "text": ["6.  Measure the signal at PC130-33 TP8. \n     Is the signal correct?", "6. Measure the signal at PC130-33 TP8. Is the signal correct????"], "jumps": ["P13550"]}, {"id": "P13552", "text": ["The inserted fault does not effect the input signal to stage 2, Q2. Check your measurement."], "jumps": []}, {"id": "P13551", "text": [], "jumps": []}, {"id": "P13550", "text": ["5.  Measure the signal at PC130-33 TP6.  Is the signal correct?", "5. Measure the signal at PC130-33 TP6. Is the signal correct?"], "jumps": ["P13540"]}, {"id": "P13542", "text": ["The inserted fault does not effect the output signal of stage 1, Q1. Check your measurement.", "The inserted fault does not effect the output signal of stage 1, Q1. Check your measurement.."], "jumps": []}, {"id": "P13670", "text": ["The computer will now remove the fault. Check for normal operation of the circuit. There may have been two faults!"], "jumps": ["P13660"]}, {"id": "P13540", "text": ["4.  Measure the signal at PC130-33 TP4. \n     Is the signal correct?", "4. Measure the signal at PC130-33 TP4. Is the signal correct???"], "jumps": ["P13530"]}, {"id": "P13532", "text": ["The inserted fault does not effect the input signal to stage 1, Q1. Check your measurement."], "jumps": []}, {"id": "P13531", "text": [], "jumps": []}, {"id": "P13530", "text": ["3.  Measure the signal at PC130-33 TP3. \n     Is the signal correct?", "3. Measure the signal at PC130-33 TP3. Is the signal correct???"], "jumps": ["P13520"]}, {"id": "P13520", "text": ["2.  Connect the oscilloscope set up to measure AC at PC130-33          TP2. This is the known input.  Adjust, if necessary, the                      function generator for a 1 kHz signal at 1.5 Vpp.", "2. Connect the oscilloscope set up to measure AC at PC130-33 TP2. This is the known input. Adjust, if necessary, the function generator for a 1 kHz signal at 1.5 Vpp.."], "jumps": ["P13530", "P13510", "P13245"]}, {"id": "P13510", "text": ["There is a problem in the four stage amplifier. Let's start signal tracing at the input to PC130-33."], "jumps": ["P13520", "P13500"]}, {"id": "P13502", "text": ["You should not have heard the tone. The fault inserted by the computer causes no output to the speaker. Check with your instructor."], "jumps": []}, {"id": "P13501", "text": [], "jumps": []}, {"id": "P13500", "text": ["Do you hear the 1 kHz tone in the speaker?", "Do you hear the 1 kHz tone in the speaker?................."], "jumps": []}, {"id": "P13495", "text": ["1.  Press Enter to set: Speaker Switch - ON", "1. Press Enter to set: Speaker Switch - ON................................"], "jumps": []}, {"id": "P13490", "text": ["Now, the computer will insert a fault. You will use the signal tracing method of troubleshooting to locate the faulted stage. Then circuit troubleshooting methods are used to isolate the fault to a component.", "Now, the computer will insert a fault. You will use the signal tracing method of troubleshooting to locate the faulted stage. Then circuit troubleshooting methods are used to isolate the fault to a component..."], "jumps": ["P13480"]}, {"id": "P13480", "text": ["This completes the signal tracing. You traced the known input signal through all four stages and checked for normal operation.", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP11.."], "jumps": ["P13490", "P13470"]}, {"id": "P13470", "text": ["15.  Measure the signal at PC130-34 TP11. This is the output of              the card. It should be the same as PC130-34 TP10.", "15. Measure the signal at PC130-34 TP11. This is the output of the card. It should be the same as PC130-34 TP10."], "jumps": ["P13480", "P13460", "P13475"]}, {"id": "P13460", "text": ["The signal should measure about the same as at TP7 and TP8. The voltage gain of a common collector is 1.  Also, note there is no phase inversion.", "The signal should measure about the same as at TP7 and TP8. The voltage gain of a common collector is 1. Also, note there is no phase inversion...", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP10.."], "jumps": ["P13470", "P13450"]}, {"id": "P13450", "text": ["14.  Measure the signal at PC130-34 TP10. This is the output of              Q2 and Q3.", "14. Measure the signal at PC130-34 TP10. This is the output of Q2 and Q3.."], "jumps": ["P13460", "P13440", "P13455"]}, {"id": "P13440", "text": ["The signals should range between .5 to .92 Vpp. The action of R8 through R11 is a voltage divider.", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP7 and TP8.."], "jumps": ["P13450", "P13430"]}, {"id": "P13430", "text": ["13.  Measure the signals at PC130-34 TP7 and TP8. These are the         input signals on the bases of Q2 and Q3.", "The signal should be the same as at PC130-34 TP4.", "13. Measure the signals at PC130-34 TP7 and TP8. These are the input signals on the bases of Q2 and Q3.", "The signal should be the same as at PC130-34 TP4...........", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP6.."], "jumps": ["P13440", "P13420", "P13435", "P13430", "P13410"]}, {"id": "P13410", "text": ["12.  Measure the signal at PC130-34 TP6. This is the input signal           to Q2 and Q3.", "12. Measure the signal at PC130-34 TP6. This is the input signal to Q2 and Q3."], "jumps": ["P13420", "P13400", "P13415"]}, {"id": "P2400", "text": ["The signal is approximately .92 Vpp and out of sync with the CH1 input. The voltage gain is about 31 and the signal is inverted.", "The signal is approximately .92 Vpp and out of sync with the CH1 input. The voltage gain is about 31 and the signal is inverted......................................", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP4.."], "jumps": ["P2410", "P2390"]}, {"id": "P13390", "text": ["11.  Measure the signal at PC130-34 TP4. This is the output of Q1.", "11. Measure the signal at PC130-34 TP4. This is the output of Q1."], "jumps": ["P13400", "P13380", "P13395"]}, {"id": "P13340", "text": ["The signal is approximately 6.4 Vpp and again in phase with the input since this is the second stage of amplification.  The voltage gain is about 183 (281 calculated).", "The signal is approximately 6.4 Vpp and again in phase with the input since this is the second stage of amplification. The voltage gain is about 183 (281 calculated)......................................."], "jumps": ["P13350", "P13330"]}, {"id": "P13387", "text": ["Now, remove the CH1 probe. Notice the output signal increased. Place the CH1 probe back on TP3. Notice the output signal decreased. This indicates that the test equipment is effecting the circuit.", "Now, remove the CH1 probe. Notice the output signal increased. Place the CH1 probe back on TP3. Notice the output signal decreased. This indicates that the test equipment is effecting the circuit..."], "jumps": ["P13388", "P13385"]}, {"id": "P13386", "text": ["To check this condition, use the oscilloscope in the dual display mode and place CH1 on the input to Q1, TP3 and CH2 on the output of Q1, TP4."], "jumps": ["P13387", "P13385"]}, {"id": "P13385", "text": ["SIGNAL AT PC130-34 TP3 - You probably measured around 12 mVpp. This measurement indicates that there is a fault in the input circuit. However, there is no fault, the oscilloscope is loading down the input signal."], "jumps": ["P13386", "P13380"]}, {"id": "P13380", "text": ["By the action of R1 and R2, you should have measured approximately 30 mVpp in sync with the input.  If your measurement is off, touch help.", "By the action of R1 and R2, you should have measured approximately 30 mVpp in sync with the input. If your measurement is off, touch help......................................", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP3.."], "jumps": ["P13390", "P13370", "P13385"]}, {"id": "P13370", "text": ["10.  Measure the signal at PC130-34 TP3. This is the input to Q1.", "10. Measure the signal at PC130-34 TP3. This is the input to Q1.", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP2.."], "jumps": ["P13380", "P13360", "P13375"]}, {"id": "P13360", "text": ["9.  Measure the signal at PC130-34 TP2. This is the input to the           card and should be 6.4 Vpp, the same as the output of \n     PC130- 33.", "9. Measure the signal at PC130-34 TP2. This is the input to the card and should be 6.4 Vpp, the same as the output of PC130- 33........", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP9.."], "jumps": ["P13370", "P13350", "P13365"]}, {"id": "P13350", "text": ["8.  Measure the signal at PC130-33 TP9. This is the output of the         card and should be the same as the signal on TP8.", "8. Measure the signal at PC130-33 TP9. This is the output of the card and should be the same as the signal on TP8."], "jumps": ["P13360", "P13340", "P13355"]}, {"id": "P13340", "text": ["The signal is approximately 6.4 Vpp triggered on the positive alternation. The voltage gain is about 183 (281 calculated).", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP8.."], "jumps": ["P13350", "P13330"]}, {"id": "P13330", "text": ["7.  Measure the signal at PC130-33 TP8. This is the output of Q2.", "7. Measure the signal at PC130-33 TP8. This is the output of Q2."], "jumps": ["P13340", "P13320", "P13335"]}, {"id": "P13320", "text": ["The signal is approximately 35 mV triggered on the negative alternation.  It is the same signal on the output of Q1.", "The signal is approximately 35 mV triggered on the negative alternation. It is the same signal on the output of Q1.", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP6.."], "jumps": ["P13330", "P13310"]}, {"id": "P13310", "text": ["6.  Measure the signal at PC130-33 TP6. This is the input to Q2.", "6. Measure the signal at PC130-33 TP6. This is the input to Q2."], "jumps": ["P13320", "P13300", "P13315"]}, {"id": "P13300", "text": ["The loaded calculated Av is 8. The measured voltage gain is approximately 2.3, 35 mV / 15 mV, due to the effect of the unswamped Q2..", "To see the effect of swamping Q2, set S3 to IN and then check Q1's output. It should be about 110 mV, which will give a measured gain of approximately 7. Set S3 back to OUT."], "jumps": ["P13310", "P13290"]}, {"id": "P13290", "text": ["The signal is approximately 35 mV triggered on the negative alternation with a phase shift of 180\u00ba, normal operation.", "The signal is approximately 35 mV triggered on the negative alternation with a phase shift of 180", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP4.."], "jumps": ["P13300", "P13280"]}, {"id": "P13280", "text": ["5.  Measure the signal at PC130-33 TP4. This is the output of Q1.", "5. Measure the signal at PC130-33 TP4. This is the output of Q1."], "jumps": ["P13290", "P13270", "P13285"]}, {"id": "P13275", "text": ["The signal is approximately 15 mVpp in phase with the function generator, no phase shift.  R1 and R2 act as a voltage divider.", "Rt = R1 + R2 = 101 kW It = Ea/Rt = 1.5 Vpp/101 kW = .0148 mA Er2 = It x R2 = .0148 mA x 1 k = 14.8 mVthe input signal.nction Generator at 1 kHz, 2 Vpp", "VALUE OF INPUT SIGNAL - The input signal is equal to AC voltage across R2 or:", "The signal is approximately 15 mVpp in phase with the function generator, no phase shift. R1 and R2 act as a voltage divider.", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP3.."], "jumps": ["P13280", "P13260", "P13275"]}, {"id": "P2388", "text": ["Normally, test equipment does not effect the circuit under test. However, don't assume that it will never effect the circuit. Check to be sure an incorrect signal is due to a fault and not the test equipment.  Place the CH1 probe back on PC130-33 TP2.", "Normally, test equipment does not effect the circuit under test. However, don't assume that it will never effect the circuit. Check to be sure an incorrect signal is due to a fault and not the test equipment. Place the CH1 probe back on PC130-33 TP2."], "jumps": ["P2380", "P2385"]}, {"id": "P13255", "text": ["SIGNAL TRIGGERING - If the signal is incorrect, adjust the function generator. The signal is used as the known input signal for signal tracing."], "jumps": []}, {"id": "P13250", "text": ["The signal should be triggered on the positive slope.", "The signal should be triggered on the positive slope..............................................................", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH1 probe to TP2."], "jumps": ["P13260", "P13240", "P13255"]}, {"id": "P13240", "text": ["3.  Confirm the 5 KHz 1.5 Vpp signal at PC130-33 TP2 on the CH1 in.  This is the input to the          four stage amplifier.", "3. Confirm the 5 KHz 1.5 Vpp signal at PC130-33 TP2 on the CH1 in. This is the input to the four stage amplifier.", "3. Confirm the 1 KHz 1.5 Vpp signal at PC130-33 TP2 on the CH1 input. This is the input to the four stage amplifier and will be used for signal comparison."], "jumps": ["P13250", "P13230", "P13245"]}, {"id": "P2290", "text": ["The signal is approximately 35 mV with a phase shift of 180\u00ba when compared to the input at CH1.  This is normal operation as a common-emitter amplifier inverts the input signal.", "The signal is approximately 35 mV with a phase shift of 180", "when compared to the input at CH1. This is normal operation as a common-emitter amplifier inverts the input signal."], "jumps": ["P2300", "P2280"]}, {"id": "P13220", "text": ["Now, let's signal trace the 1 kHz 1.5 Vpp signal through the four stages.  Remember, the amplifier is operating normally.", "Now, let's signal trace the 1 kHz 1.5 Vpp signal through the four stages. Remember, the amplifier is operating normally."], "jumps": ["P13230"]}, {"id": "P13210", "text": ["10.  Press Enter to set: Speaker Switch - OFF\n        The four stage amplifier is operating normally. The 1 kHz                 signal from the function generator is being amplified to a                 level that can drive a speaker.", "10. Press Enter to set: Speaker Switch - OFF The four stage amplifier is operating normally. The 1 kHz signal from the function generator is being amplified to a level that can drive a speaker."], "jumps": ["P13200"]}, {"id": "P13202", "text": ["You should hear a 1 kHz tone from the speaker. Check your set up:  If set up is correct, check with your instructor.", "You should hear a 1 kHz tone from the speaker. Check your set up: If set up is correct, check with your instructor.", "- PC130-33 in PC2, PC130-34 in PC3 - PC130-33 S1 & S2 to IN, S3 to OUT - Function Generator connected to PC1 output BNC - Function Generator at 1 kHz, 1.5 Vpppppppppppppp"], "jumps": []}, {"id": "P13201", "text": [], "jumps": []}, {"id": "P13200", "text": ["Do you hear a 1 kHz tone from the speaker?", "Do you hear a 1 kHz tone from the speaker?................."], "jumps": []}, {"id": "P or the distractor. X", "when the fault has been isolated to a bias circuit.", "when the fault has been isolated to a transistor.. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "after the faulty stage has been identified. arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor."], "jumps": []}, {"id": "P2910", "text": ["This completes the experiment on MULTISTAGE TROUBLESHOOTING.", "This completes the experiment on MULTISTAGE TROUBLESHOOTING.."], "jumps": ["P2001", "P2720"]}, {"id": "P2720", "text": ["3.  Disconnect all test equipment.\n4.  Carefully remove PC130-33 and PC130-34. \n5.  Return all equipment to its proper storage area.", "3. Disconnect all test equipment. 4. Carefully remove PC130-33 and PC130-34. 5. Return all equipment to its proper storage area."], "jumps": ["P2910", "P2710"]}, {"id": "P2710", "text": ["2.  Turn Power OFF to the Test Console.", "2. Turn Power OFF to the Test Console....................."], "jumps": ["P2700"]}, {"id": "P2700", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": ["P2690"]}, {"id": "P2690", "text": ["Notice that the 1 kHz tone is heard in the speaker. There are no more faults."], "jumps": ["P2700", "P2680"]}, {"id": "P2680", "text": ["1.  Remove the multimeter from the circuit. \n2.  Place PC2 and PC3 DC Power switches to ON. \n3.  Connect the function generator to PC1 Output BNC.", "1. Remove the multimeter from the circuit. 2. Place PC2 and PC3 DC Power switches to ON. 3. Connect the function generator to PC1 Output BNC...............o ON.."], "jumps": ["P2670", "P2175"]}, {"id": "P2670", "text": ["The computer will now remove the fault. Check for normal operation of the circuit. There may have been two faults!", "The computer will now remove the fault. Check for normal operation of the circuit. There may have been two faults! External program = SCAN FTR 0 E2 02..................................."], "jumps": ["P2660"]}, {"id": "P2660", "text": ["Congratulations, you found the fault.  R12 could have been open. The resistance from the emitter of Q2 to ground was infinity.", "Congratulations, you found the fault. R12 could have been open. The resistance from the emitter of Q2 to ground was infinity."], "jumps": ["P2670", "P2650"]}, {"id": "P2653", "text": ["S3 is OUT (closed), which shorts out R11.  R11 is NOT in the circuit and can not be the fault.", "S3 is OUT (closed), which shorts out R11. R11 is NOT in the circuit and can not be the fault."], "jumps": []}, {"id": "P2652", "text": ["If C6 was open, you would still measure the resistance of R12,   3.3 kW, between the emitter and ground.", "If C6 was open, you would still measure the resistance of R12, 3.3 kW, between the emitter and ground........"], "jumps": []}, {"id": "P2651", "text": [], "jumps": []}, {"id": "P2650", "text": ["From the results of measuring the emitter to ground resistance, which component is probably faulted?", "MULTIMETER PLACEMENT - Connect the multimeter leads to TP1 and TP10."], "jumps": ["P2640", "P2655"]}, {"id": "P2640", "text": ["12.  Measure the resistance from the emitter of Q2 to ground,                  TP10 to TP1.  Notice you measured infinity.", "12. Measure the resistance from the emitter of Q2 to ground, TP10 to TP1. Notice you measured infinity."], "jumps": ["P2650", "P2630", "P2645"]}, {"id": "P2630", "text": ["11.  Measure the resistance across R10, TP7 to TP8.  Notice you           measured around 10 kW, R10 is not shorted.", "11. Measure the resistance across R10, TP7 to TP8. Notice you measured around 10 kW, R10 is not shorted."], "jumps": ["P2640", "P2620", "P2605"]}, {"id": "P2620", "text": ["9.  Turn PC2 and PC3 DC Power switches to OFF. \n10.  Disconnect  the function generator from the Test Console.", "9. Turn PC2 and PC3 DC Power switches to OFF. 10. Disconnect the function generator from the Test Console......to ON. 130A - Set the PC3 Speaker switch to ON.."], "jumps": ["P2610"]}, {"id": "P2610", "text": ["Notice that you measured approximately 0 V.  The fault is in either R10 shorted, the transistor, or the emitter circuit.", "Notice that you measured approximately 0 V. The fault is in either R10 shorted, the transistor, or the emitter circuit.", "MULTIMETER PLACEMENT - Connect the multimeter leads to TP7 and TP8."], "jumps": ["P2620", "P2600"]}, {"id": "P2600", "text": ["8.  Measure the voltage across R10, TP7 to TP8 on PC130-33. If          the measurement is 12 V, R10 is open.  If the voltage is 0 V,             R10 is shorted or the fault is in the transistor or emitter circuit.", "8. Measure the voltage across R10, TP7 to TP8 on PC130-33. If the measurement is 12 V, R10 is open. If the voltage is 0 V, R10 is shorted or the fault is in the transistor or emitter circuit......"], "jumps": ["P2610", "P2590", "P2605"]}, {"id": "P2590", "text": ["Note, Ec measures 12 V, the applied voltage. This indicates an open between the collector of Q2 and ground or a fault that prevents emitter to collector current flow.", "Measured Calculated Eb = 2.92 VDC Ee = 2.32 VDC Ec = 4.97 VDC", "OSCILLOSCOPE LEAD PLACEMENT - Use TP6, TP8 and TP10 to measure Eb, Ee and Ec."], "jumps": ["P2600", "P2580", "P2584", "P2585"]}, {"id": "P2587", "text": ["Ee = 3.32 VDC Eb - .6 = 2.92 - .6 = 2.32 V Ec = 5 VDC Ie = Ee/Re = 2.32/R11 + R12 = 2.32/3.3 k = .7 mA Ie = Ic, Er10 = Ic x R10 = 7 V, Vcc - Er10 = 5 VVV VVVVV"], "jumps": ["P2584", "P2586"]}, {"id": "P2586", "text": ["Eb = 3.92 VDC R8 + R9 = 74 kW I = 12 V/74 kW = .162 mA Er9 = I x R9 = .162 mA x 18 kW = 2.92 VV"], "jumps": ["P2587", "P2584"]}, {"id": "P2585", "text": ["MEASURED VALUES Eb - Voltage on the base of Q2. Measure from TP6 to ground. Ee - Voltage on the emitter of Q2. Measure from TP10 to ground. Ec - Voltage on the collector of Q2. Measure from TP8 to ground."], "jumps": ["P2588", "P2584"]}, {"id": "P2584", "text": ["MEASURED AND CALCULATED VALUES"], "jumps": []}, {"id": "P2583", "text": ["Your measurements are still incorrect. You should have measured approximately 3.0 V at Eb, 2.4 V at Ee, and 12 V at Ec. Check to see that your multimeter is set correctly."], "jumps": ["P2580"]}, {"id": "P2582", "text": ["Your measurement is incorrect. Check the set up of the multimeter.", "Your measurement is incorrect. Check the set up of the multimeter.........."], "jumps": []}, {"id": "P2581", "text": [], "jumps": []}, {"id": "P2580", "text": ["7.  Measure and type in the DC voltages in the circuit for Q2 \n     (use a multimeter). \n     Compare to calculated values.", "7. Measure and type in the DC voltages in the circuit for Q2 (use a multimeter). Compare to calculated values........."], "jumps": ["P2570", "P2584"]}, {"id": "P2570", "text": ["Stage 2 of the four stage amplifier is not working, it has a good input but no output.  Now, you can troubleshoot Q2 as you would an individual common emitter amplifier.", "Stage 2 of the four stage amplifier is not working, it has a good input but no output. Now, you can troubleshoot Q2 as you would an individual common emitter amplifier."], "jumps": ["P2580", "P2560"]}, {"id": "P13230", "text": ["1.  Leave the CH1 input connected to TP2  PC130-33 throughout \n     the next few steps.\n2. Trigger the oscilloscope to the CH1 input, using the CH2 input \n     for signal tracing.", "1. Leave the CH1 input connected to TP2 PC130-33 throughout the next few steps. 2. Trigger the oscilloscope to the CH1 input, using the CH2 input for signal tracing.................................", "The CH1 input is kept at TP2, the circuit input, to view each amplifier stage as it inverts the input signal.................................Hz, 2 Vpp"], "jumps": ["P13240", "P13220"]}, {"id": "P2561", "text": [], "jumps": []}, {"id": "P2560", "text": ["6.  Measure the signal at PC130-33 TP8.  Is the signal correct?", "6. Measure the signal at PC130-33 TP8. Is the signal correct?"], "jumps": ["P2550"]}, {"id": "P2552", "text": ["The inserted fault does not effect the input signal to stage 2, Q2. Check your measurement."], "jumps": []}, {"id": "P2551", "text": [], "jumps": []}, {"id": "P2340", "text": ["The signal is approximately 6.4 Vpp and again in phase with the input since this is the second stage of amplification.  The voltage gain is about 183 (281 calculated).", "5.  Measure the signal at PC130-33 TP6. Is the signal correct?", "The signal is approximately 6.4 Vpp and again in phase with the input since this is the second stage of amplification. The voltage gain is about 183 (281 calculated).", "5. Measure the signal at PC130-33 TP6. Is the signal correct?"], "jumps": ["P2350", "P2330"]}, {"id": "P2542", "text": ["The inserted fault does not effect the output signal of stage 1, Q1. Check your measurement."], "jumps": []}, {"id": "P2541", "text": [], "jumps": []}, {"id": "P2540", "text": ["4.  Measure the signal at PC130-33 TP4.  Is the signal correct?", "4. Measure the signal at PC130-33 TP4. Is the signal correct?"], "jumps": ["P2530"]}, {"id": "P2532", "text": ["The inserted fault does not effect the input signal to stage 1, Q1.  Check your measurement.", "The inserted fault does not effect the input signal to stage 1, Q1. Check your measurement."], "jumps": []}, {"id": "P2531", "text": [], "jumps": []}, {"id": "P2530", "text": ["3.  Measure the signal at PC130-33 TP3. Is the signal correct?", "3. Measure the signal at PC130-33 TP3. Is the signal correct?"], "jumps": ["P2520"]}, {"id": "P2520", "text": ["2.  Connect the oscilloscope set up to measure AC at PC130-33          TP2. This is the known input.  Adjust, if necessary, the                      function generator for a 1 kHz signal at 1.5 Vpp.", "2. Connect the oscilloscope set up to measure AC at PC130-33 TP2. This is the known input. Adjust, if necessary, the function generator for a 1 kHz signal at 1.5 Vpp."], "jumps": ["P2530", "P2510", "P2245"]}, {"id": "P2510", "text": ["There is a problem in the four stage amplifier. Let's start signal tracing at the input to PC130-33."], "jumps": ["P2520", "P2500"]}, {"id": "P2502", "text": ["You should not have heard the tone. The fault inserted by the computer causes no output to the speaker. Check with your instructor."], "jumps": []}, {"id": "P2501", "text": [], "jumps": []}, {"id": "P2500", "text": ["Do you hear the 1 kHz tone in the speaker?", "Do you hear the 1 kHz tone in the speaker?................."], "jumps": ["P2495"]}, {"id": "P2495", "text": ["1.  Turn the speaker switch to ON.", "1. Turn the speaker switch to ON.ol to 12. 130A - Set the PC1 DC switch to ON. 130A - Set the PC2 AC switch to ON. 130A - Set the PC3 Speaker switch to ON.."], "jumps": ["P2490"]}, {"id": "P2490", "text": ["Now, the computer will insert a fault. You will use the signal tracing method of troubleshooting to locate the faulted stage. Then circuit troubleshooting methods are used to isolate the fault to a component.", "Now, the computer will insert a fault. You will use the signal tracing method of troubleshooting to locate the faulted stage. Then circuit troubleshooting methods are used to isolate the fault to a component. . External program = SCAN FTR 0 F2 02"], "jumps": ["P2480"]}, {"id": "P2480", "text": ["This completes the signal tracing. You traced the known input signal through all four stages and checked for normal operation.", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP11.."], "jumps": ["P2490", "P2470"]}, {"id": "P2470", "text": ["15.  Measure the signal at PC130-34 TP11. This is the output of              the card.  It should be the same as PC130-34 TP10.", "15. Measure the signal at PC130-34 TP11. This is the output of the card. It should be the same as PC130-34 TP10."], "jumps": ["P2480", "P2460", "P2475"]}, {"id": "P2460", "text": ["The signal should measure about the same as at TP7 and TP8. The voltage gain of a common collector is 1.  Also, note there is no phase inversion.", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP10.", "The signal should measure about the same as at TP7 and TP8. The voltage gain of a common collector is 1. Also, note there is no phase inversion...", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP10.."], "jumps": ["P2470", "P2450"]}, {"id": "P2450", "text": ["14.  Measure the signal at PC130-34 TP10. This is the output of             Q2 and Q3.", "14. Measure the signal at PC130-34 TP10. This is the output of Q2 and Q3.3.d Q3."], "jumps": ["P2460", "P2440", "P2455"]}, {"id": "P2440", "text": ["The signals should range between .5 to .92 Vpp. The action of R8 through R11 is a voltage divider.", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP7 and TP8.."], "jumps": ["P2450", "P2430"]}, {"id": "P2430", "text": ["13.   Measure the signals at PC130-34 TP7 and TP8. These are                the input signals on the bases of Q2 and Q3.", "The signal should be the same as at PC130-34 TP4.", "13. Measure the signals at PC130-34 TP7 and TP8. These are the input signals on the bases of Q2 and Q3.........", "The signal should be the same as at PC130-34 TP4...........", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP6.."], "jumps": ["P2440", "P2420", "P2435", "P2430", "P2410"]}, {"id": "P2410", "text": ["12.  Measure the signal at PC130-34 TP6. This is the input signal           to Q2 and Q3.", "12. Measure the signal at PC130-34 TP6. This is the input signal to Q2 and Q3.."], "jumps": ["P2420", "P2400", "P2415"]}, {"id": "P2400", "text": ["The signal is approximately .92 Vpp triggered on the negative alternation. The voltage gain is about 31 and the signal is inverted.", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP4.."], "jumps": ["P2410", "P2390"]}, {"id": "P2390", "text": ["11.  Measure the signal at PC130-34 TP4. This is the output of Q1.", "11. Measure the signal at PC130-34 TP4. This is the output of Q1."], "jumps": ["P2400", "P2380", "P2395"]}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to _________"], "jumps": []}, {"id": "P2387", "text": ["Now, remove the CH1 probe. Notice the output signal increased. Place the CH1 probe back on TP3. Notice the output signal decreased. This indicates that the test equipment is effecting the circuit.", "Now, remove the CH1 probe. Notice the output signal increased. Place the CH1 probe back on TP3. Notice the output signal decreased. This indicates that the test equipment is effecting the circuit..."], "jumps": ["P2388", "P2385"]}, {"id": "P2386", "text": ["To check this condition, use the oscilloscope in the dual display mode and place CH1 on the input to Q1, TP3 and CH2 on the output of Q1, TP4."], "jumps": ["P2387", "P2385"]}, {"id": "P2385", "text": ["SIGNAL AT PC130-34 TP3 - You probably measured around 12 mVpp. This measurement indicates that there is a fault in the input circuit. However, there is no fault, the oscilloscope is loading down the input signal."], "jumps": ["P2386", "P2380"]}, {"id": "P2380", "text": ["By the action of R1 and R2, you should have measured approximately 30 mVpp in sync with the input.  If your measurement is off, touch help.", "By the action of R1 and R2, you should have measured approximately 30 mVpp in sync with the input. If your measurement is off, touch help......................................", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP3.."], "jumps": ["P2390", "P2370", "P2385"]}, {"id": "P2370", "text": ["10.  Measure the signal at PC130-34 TP3. This is the input to Q1.", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP2.", "10. Measure the signal at PC130-34 TP3. This is the input to Q1.", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP2.."], "jumps": ["P2380", "P2360", "P2375"]}, {"id": "P2360", "text": ["9.  Measure the signal at PC130-34 TP2. This is the input to the           card and should be 6.4 Vpp, the same as the output of\n     PC130- 33.", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP9.", "9. Measure the signal at PC130-34 TP2. This is the input to the card and should be 6.4 Vpp, the same as the output of PC130- 33.........", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP9.."], "jumps": ["P2370", "P2350", "P2365"]}, {"id": "P2350", "text": ["8.  Measure the signal at PC130-33 TP9. This is the output of the         card and should be the same as the signal on TP8.", "8. Measure the signal at PC130-33 TP9. This is the output of the card and should be the same as the signal on TP8."], "jumps": ["P2360", "P2340", "P2355"]}, {"id": "P2340", "text": ["The signal is approximately 6.4 Vpp triggered on the positive alternation. The voltage gain is about 183 (281 calculated).", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP8.", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP8.."], "jumps": ["P2350", "P2330"]}, {"id": "P2330", "text": ["7.  Measure the signal at PC130-33 TP8. This is the output of Q2.", "7. Measure the signal at PC130-33 TP8. This is the output of Q2."], "jumps": ["P2340", "P2320", "P2335"]}, {"id": "P2320", "text": ["The signal is approximately 35 mV triggered on the negative alternation.  It is the same signal on the output of Q1.", "The signal is approximately 35 mV triggered on the negative alternation. It is the same signal on the output of Q1.", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP6.."], "jumps": ["P2330", "P2310"]}, {"id": "P2310", "text": ["6.  Measure the signal at PC130-33 TP6. This is the input to Q2.", "6. Measure the signal at PC130-33 TP6. This is the input to Q2."], "jumps": ["P2320", "P2300", "P2315"]}, {"id": "P2300", "text": ["The loaded calculated Av is 8. The measured voltage gain is approximately 2.3, 35 mV / 15 mV, due to the effect of the unswamped Q2..", "To see the effect of swamping Q2, set S3 to IN and then check Q1's output. It should be about 110 mV, which will give a measured gain of approximately 7. Set S3 back to OUT."], "jumps": ["P2310", "P2290"]}, {"id": "P2290", "text": ["The signal is approximately 35 mV triggered on the negative alternation with a phase shift of 180\u00ba, normal operation.", "The signal is approximately 35 mV triggered on the negative alternation with a phase shift of 180", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP4.."], "jumps": ["P2300", "P2280"]}, {"id": "P2280", "text": ["5.  Measure the signal at PC130-33 TP4. This is the output of Q1.", "5. Measure the signal at PC130-33 TP4. This is the output of Q1."], "jumps": ["P2290", "P2270", "P2285"]}, {"id": "P2275", "text": ["VALUE OF INPUT SIGNAL - The input signal is equal to AC voltage across R2 or:", "The signal is approximately 15 mVpp in phase with the function generator, no phase shift.  R1 and R2 act as a voltage divider.", "Rt = R1 + R2 = 101 kW It = Ea/Rt = 1.5 Vpp/101 kW = .0148 mA Er2 = It x R2 = .0148 mA x 1 k = 14.8 mVthe input signal.nction Generator at 1 kHz, 2 Vpp", "The signal is approximately 15 mVpp in phase with the function generator, no phase shift. R1 and R2 act as a voltage divider.", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH2 probe to TP3.."], "jumps": ["P2280", "P2260", "P2275"]}, {"id": "P2260", "text": ["4.  Using the CH2 input, measure the signal at PC130-33 TP3. \n     This is the input to Q1.", "4. Using the CH2 input, measure the signal at PC130-33 TP3. This is the input to Q1."], "jumps": ["P2270", "P2250", "P2265"]}, {"id": "P2255", "text": ["SIGNAL TRIGGERING - If the signal is incorrect, adjust the function generator. The signal is used as the known input signal for signal tracing."], "jumps": []}, {"id": "P2250", "text": ["The signal should be triggered on the positive slope.", "The signal should be triggered on the positive slope..............................................................", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH1 probe to TP2.."], "jumps": ["P2260", "P2240", "P2255"]}, {"id": "P2240", "text": ["3.  Confirm the 1 KHz 1.5 Vpp signal at PC130-33 TP2 on the CH1 \n      input.  This is the input to the four stage amplifier and will be \n      used for signal comparison.", "3. Confirm the 1 KHz 1.5 Vpp signal at PC130-33 TP2 on the CH1 input. This is the input to the four stage amplifier and will be used for signal comparison."], "jumps": ["P2250", "P2230", "P2245"]}, {"id": "P13290", "text": ["The signal is approximately 35 mV with a phase shift of 180\u00ba when compared to the input at CH1.  This is normal operation as a common-emitter amplifier inverts the input signal.", "The signal is approximately 35 mV with a phase shift of 180", "when compared to the input at CH1. This is normal operation as a common-emitter amplifier inverts the input signal."], "jumps": ["P13300", "P13280"]}, {"id": "P2220", "text": ["Now, let's signal trace the 1 kHz 1.5 Vpp signal through the four stages.  Remember, the amplifier is operating normally.", "Now, let's signal trace the 1 kHz 1.5 Vpp signal through the four stages. Remember, the amplifier is operating normally."], "jumps": ["P2230", "P2210"]}, {"id": "P2210", "text": ["12.  Turn the speaker switch OFF.\n        The four stage amplifier is operating normally.  The 1 kHz                signal from the function  generator is being  amplified to a               level that can drive a  speaker.", "12. Turn the speaker switch OFF. The four stage amplifier is operating normally. The 1 kHz signal from the function generator is being amplified to a level that can drive a speaker."], "jumps": ["P2200"]}, {"id": "P2202", "text": ["You should hear a 1 kHz tone from the speaker. Check your set up: If set up is correct, check with your instructor.", "ected to PC1 output BNC - Function Generator at 1 kHz, 2 VppC", "- PC130-33 in PC2, PC130-34 in PC3 - PC130-33 S1 & S2 to IN, S3 to OUT - Function Generator connected to PC1 output BNC - Function Generator at 1 kHz, 1.5 Vpppppppppppppp"], "jumps": []}, {"id": "P2201", "text": [], "jumps": []}, {"id": "P2200", "text": ["Do you hear a 1 kHz tone from the speaker?", "Do you hear a 1 kHz tone from the speaker?................."], "jumps": ["P2190"]}, {"id": "P2190", "text": ["10.  Turn PC2 and PC3 DC Power switches ON.\n11.  Turn the speaker switch ON.", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH1 probe to TP2.", "10. Turn PC2 and PC3 DC Power switches ON. 11. Turn the speaker switch ON. to ON. 130A - Set the PC2 AC switch to ON. 130A - Set the PC3 Speaker switch to ON.."], "jumps": ["P2180"]}, {"id": "P2180", "text": ["8.  Connect an oscilloscope set up to measure AC to PC130-33           TP2.\n9.  Adjust the output of the function generator for a 1 kHz, \n     1.5 Vpp signal as measured on PC130-33 TP2.", "8. Connect an oscilloscope set up to measure AC to PC130-33 TP2. 9. Adjust the output of the function generator for a 1 kHz, 1.5 Vpp signal as measured on PC130-33 TP2........"], "jumps": ["P2190", "P2170", "P2185"]}, {"id": "P2175", "text": ["MEASUREMENT SETUP - Connect the Function Generator to PC1 output BNC."], "jumps": []}, {"id": "P2170", "text": ["7.  Connect a function generator to PC1 Output BNC.   PC1                   output BNC connects to the input of PC2.", "7. Connect a function generator to PC1 Output BNC. PC1 output BNC connects to the input of PC2......."], "jumps": ["P2180", "P2160", "P2175"]}, {"id": "P2160", "text": ["5.  Set the Voltmeter Switch to Positive. \n6.  Set the Positive Supply Voltage to 12. \n     The Test Console's Voltage Meter should indicate 12 volts.", "The loaded voltage gains for PC130-34 are: stage 3 (Q1)  approximately 31 stage 4 (Q2, Q3) approximately 1.", "5. Set the Voltmeter Switch to Positive. 6. Set the Positive Supply Voltage to 12. The Test Console's Voltage Meter should indicate 12 volts....................", "The loaded voltage gains for PC130-34 are: stage 3 (Q1) approximately 31 stage 4 (Q2, Q3) approximately 1."], "jumps": ["P2150", "P2160", "P2140"]}, {"id": "P2145", "text": ["S1 swamps Q1.  S2 connects Q1 output to Q2 input.  S3 is OUT (closed) to provide maximum gain from Q2.  The voltage gains are: stage 1 (Q1) about 8; stage 2 (Q2) about 281.", "MEASUREMENT SETUP - S1and S2 set to IN.  The position of the switch denotes the component or circuit being applied.  When S1 is set to IN it is open.  When S2 is set to IN it is closed.  When S3 is set to OUT it is closed.", "SWAMP - A transistor is swamped when a small unbypassed resistor (swamping resistor) is placed on the emitter. The swamping resistor allows a small AC signal on the emitter which decreases the gain, making the transistor more stable.", "S1 swamps Q1. S2 connects Q1 output to Q2 input. S3 is OUT (closed) to provide maximum gain from Q2. The voltage gains are: stage 1 (Q1) about 8; stage 2 (Q2) about 281..", "MEASUREMENT SETUP - S1and S2 set to IN. The position of the switch denotes the component or circuit being applied. When S1 is set to IN it is open. When S2 is set to IN it is closed. When S3 is set to OUT it is closed."], "jumps": ["P2150", "P2130"]}, {"id": "P2130", "text": ["4.  On PC130-33, set S1 and S2 to IN and S3 to OUT.", "4. On PC130-33, set S1 and S2 to IN and S3 to OUT.PC1 DC switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2120", "P2135"]}, {"id": "P2120", "text": ["2.  Carefully plug PC130-33 into the Test Console PC2 position. \n3.  Carefully plug PC130-34 into the Test Console PC3 position.", "2. Carefully plug PC130-33 into the Test Console PC2 position. 3. Carefully plug PC130-34 into the Test Console PC3 position.er switch to ON........................................."], "jumps": ["P2110"]}, {"id": "P2110", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P2090"]}, {"id": "P2100", "text": ["The input is from stage 2 and the output is connected to a speaker.  Let's start the experiment.", "It consists of a driver amplifier and a push-pull amplifier. Q1 is stage 3 and Q2/Q3 is stage 4.", "The input is from stage 2 and the output is connected to a speaker. Let's start the experiment."], "jumps": ["P2110", "P2090", "P2100", "P2080"]}, {"id": "P2080", "text": ["PC130-34 contains the third and fourth stages.", "PC130-34 contains the third and fourth stages.............."], "jumps": ["P2090", "P2060"]}, {"id": "P2070", "text": ["The input is from a function generator and the output is fed to stage 3.", "It consists of two common emitter class A RC coupled amplifiers. Q1 is stage 1 and Q2 is stage 2."], "jumps": ["P2080", "P2060", "P2070", "P2040"]}, {"id": "P2050", "text": ["PC130-33 contains the first and second stage."], "jumps": ["P2060", "P2040"]}, {"id": "P2040", "text": ["The multistage amplifier circuit is made up of two cards,\nPC130-33 and PC130-34.", "The multistage amplifier circuit is made up of two cards, PC130-33 and PC130-34.."], "jumps": ["P2050", "P2020"]}, {"id": "P2020", "text": ["The purpose of this experiment is to apply the troubleshooting method of signal tracing in locating a faulty circuit in a  multistage amplifier.", "The purpose of this experiment is to apply the troubleshooting method of signal tracing in locating a faulty circuit in a multistage amplifier."], "jumps": ["P2040", "P2001"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. \nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.."], "jumps": ["P1001", "P1960"]}, {"id": "P1960", "text": ["5.  After the faulted stage is repaired, check for normal operation        in case the circuit contained two or more faults.", "5. After the faulted stage is repaired, check for normal operation in case the circuit contained two or more faults."], "jumps": ["P1999", "P1920"]}, {"id": "P1950", "text": ["4.  Once the faulted stage has been identified, troubleshoot the           stage as an individual circuit.", "4. Once the faulted stage has been identified, troubleshoot the stage as an individual circuit."], "jumps": ["P1960", "P1920"]}, {"id": "P1940", "text": ["3.   A faulted stage has a correct input and an incorrect output.", "3. A faulted stage has a correct input and an incorrect output."], "jumps": ["P1950", "P1920"]}, {"id": "P1930", "text": ["2.  Signal tracing is measuring the input and output waveforms          of  each stage as it flows through the circuit.", "2. Signal tracing is measuring the input and output waveforms of each stage as it flows through the circuit....."], "jumps": ["P1940", "P1920"]}, {"id": "P1920", "text": ["1.  Troubleshooting multistage circuits requires a logical                       approach (signal tracing).", "1. Troubleshooting multistage circuits requires a logical approach (signal tracing)."], "jumps": ["P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on MULTISTAGE TROUBLESHOOTING."], "jumps": ["P1001", "P1400"]}, {"id": "P1420", "text": ["Stage 2 has not been checked, and may be faulted."], "jumps": ["P1910", "P1400"]}, {"id": "P1400", "text": ["Replacing R1 returns the bias voltages back to normal. However, always check that the entire circuit is operating normally."], "jumps": ["P1420", "P1390"]}, {"id": "P1393", "text": ["R2 is not open. Remember, the voltage drop across an open component measures the applied voltage."], "jumps": []}, {"id": "P1392", "text": ["R1 is not shorted. Remember, the voltage drop across a shorted component measures 0 V."], "jumps": []}, {"id": "P1391", "text": [], "jumps": []}, {"id": "P1390", "text": ["If Er1 measured 15 V and Er2 measured 0 V, what is the probable faulty component?"], "jumps": ["P1380"]}, {"id": "P1380", "text": ["Now that the fault is isolated to the base circuit, additional voltage and resistance measurements determine the faulty component.", "Calculated Bias Voltages Eb = 3.0 V Ee = 2.4 V Ec = 4.2 V"], "jumps": ["P1390", "P1370"]}, {"id": "P1373", "text": ["Vcc (15 V) indicates that no current is flowing in the circuit.  R5 is not dropping any Vcc.  A fault in the collector circuit would not cause current in the base circuit to STOP.", "Vcc (15 V) indicates that no current is flowing in the circuit. R5 is not dropping any Vcc. A fault in the collector circuit would not cause current in the base circuit to STOP."], "jumps": []}, {"id": "P1372", "text": ["Vcc (15 V) indicates that no current is flowing in the circuit.  R5 is not dropping any Vcc.  A faulted emitter circuit would not stop current flow in the base circuit.", "Vcc (15 V) indicates that no current is flowing in the circuit. R5 is not dropping any Vcc. A faulted emitter circuit would not stop current flow in the base circuit."], "jumps": []}, {"id": "P1371", "text": [], "jumps": []}, {"id": "P1370", "text": ["What is the probable fault in this circuit if the following voltages were measured?"], "jumps": ["P1332"]}, {"id": "P1360", "text": ["If R4 resistance measures .5 k  the fault is Q1.", "If R4 resistance measures .5 k the fault is Q1."], "jumps": ["P1370", "P1332"]}, {"id": "P13541", "text": [], "jumps": []}, {"id": "P1340", "text": ["Now resistance measurements in the emitter circuit determine the faulted component."], "jumps": ["P1350", "P1332"]}, {"id": "P1336", "text": ["VALUE OF APPLIED VOLTAGE - With no current flow through R3, Q1 and R4 a series circuit is formed by R5, R1 and R2. Rt = 16 kW It = Vcc", "Rt = .94 mA The voltage drop of R5 is It x R5 or .94 V leaving the voltage at the top of R3 at 14.06 V."], "jumps": ["P1332", "P1335"]}, {"id": "P1335", "text": ["OPEN EMITTER CIRCUIT - The 14 volts measured at the top of R3 indicate no current flowing through the collector-emitter junction, to ground."], "jumps": ["P1336", "P1332"]}, {"id": "P1332", "text": ["Measuring all three bias voltages indicates that the emitter circuit is open.", "Calculated Bias Voltages Eb = 3.0 V Ee = 2.4 V Ec = 4.2 V"], "jumps": ["P1340", "P1322", "P1335"]}, {"id": "P1330", "text": ["Measuring all three bias voltages indicates that the emitter circuit is open."], "jumps": ["P1340", "P1322", "P1335"]}, {"id": "P1327", "text": ["This makes a simple series circuit consisting of R5, R1 and R2."], "jumps": ["P1322", "P1325"]}, {"id": "P1325", "text": ["16 k = .94 mA Eb = .94 mA x 5 k = 4.7 V Eb = 4.7 V", "CIRCUIT OPERATION WITH OPEN EMITTER - With the emitter circuit open, bias current would only flow through R1 and R2 to ground.", "CIRCUIT OPERATION WITH OPEN EMITTER - With the emitter circuit open, bias current would only flow through R5, R1 and R2 to ground."], "jumps": ["P1327", "P1322"]}, {"id": "P1322", "text": ["An open in the emitter bias circuit causes the base voltage to measure 4.7 V.  Bias current no longer flow through R3, Q1, and R4.", "An open in the emitter bias circuit causes the base voltage to measure 4.7 V. Bias current no longer flow through R3, Q1, and R4.", "Calculated Bias Voltages Eb = 3.0 V Ee = 2.4 V Ec = 4.2 V"], "jumps": ["P1330", "P1302", "P1325"]}, {"id": "P1320", "text": ["An open in the emitter bias circuit causes the base voltage to measure 4.7 V.  Bias current no longer flows through R3, Q1 and R4.", "An open in the emitter bias circuit causes the base voltage to measure 4.7 V. Bias current no longer flows through R3, Q1 and R4."], "jumps": ["P1330", "P1302", "P1325"]}, {"id": "P1310", "text": ["If you measured 4.7 V on the base, do not assume that the base biasing components are faulted."], "jumps": ["P1320", "P1302"]}, {"id": "P1305", "text": ["BIAS VOLTAGES - Assume that the voltage at the top of R1 and R3 is 9 V.", "15 k = .6 mA Er2 = It x R2 = .6 mA x 5 k = 3 V"], "jumps": []}, {"id": "P1302", "text": ["Calculated Bias Voltages Eb = 3.0 V Ee = 2.4 V Ec = 4.2 V", "For example, in this circuit the calculated bias voltages are as shown. Note: Disregard base current for this example."], "jumps": ["P1310", "P1240", "P1305"]}, {"id": "P1300", "text": ["Calculated Bias Voltages Eb = 3.0 V Ee = 2.4 V Ec = 4.2 V", "For example, in this circuit the calculated bias voltages are as shown. Note: Disregard base current for this example."], "jumps": ["P1310", "P1262", "P1305"]}, {"id": "P1290", "text": ["Remember, always measure the voltage on all three elements.  An incorrect base voltage measurement may be caused by a fault in the collector bias circuit.", "Remember, always measure the voltage on all three elements. An incorrect base voltage measurement may be caused by a fault in the collector bias circuit."], "jumps": ["P1300", "P1262"]}, {"id": "P1280", "text": ["Then resistance measurements are made to find the failed component."], "jumps": ["P1290", "P1262"]}, {"id": "P1270", "text": ["Measuring the DC voltage levels on the base, emitter and collector isolate the fault to one of the biasing circuits or to a faulted element in the transistor."], "jumps": ["P1280", "P1262"]}, {"id": "P1265", "text": ["OPEN BYPASS CAPACITOR - An open bypass capacitor will result in degeneration by allowing AC variations to be developed across the emitter resistor. This will not effect the DC voltage on the emitter but will cause the output signal on the collector to be smaller than expected. There will be a signal on the emitter when there shouldn't be one."], "jumps": []}, {"id": "P1262", "text": ["Only an open input/output coupling or bypass capacitor will not change DC bias.", "Only an open input/output coupling or bypass capacitor will not change DC bias..."], "jumps": ["P1270", "P1240", "P1265"]}, {"id": "P1260", "text": ["Only an open input/output coupling or bypass capacitor will not change DC bias.", "Only an open input/output coupling or bypass capacitor will not change DC bias...."], "jumps": ["P1270", "P1240", "P1265"]}, {"id": "P1250", "text": ["Most of these common faults change the DC bias levels in the circuit."], "jumps": ["P1260", "P1240"]}, {"id": "P1240", "text": ["Common faults in multistage transistor amplifier stages include:  * Failed Transistor                 * Open Component  \n* Shorted Component          * Changes Values", "Common faults in multistage transistor amplifier stages include: * Failed Transistor * Open Component * Shorted Component * Changes Values"], "jumps": ["P1250", "P1230"]}, {"id": "P1230", "text": ["After locating the faulty stage, troubleshoot the stage as an individual circuit."], "jumps": ["P1240", "P1220"]}, {"id": "P1223", "text": ["An incorrect signal at any point in the circuit indicates that there is a fault."], "jumps": []}, {"id": "P1222", "text": ["A correct signal at TP2 indicates that the Q1 stage is operating normally."], "jumps": []}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1220", "text": ["Which stage is faulted if you measured a correct signal at TP2 and an incorrect signal at TP3?"], "jumps": ["P1210"]}, {"id": "P1213", "text": ["Measuring at TP3 first would not indicate if an incorrect signal was due to a faulty Q1 stage or a faulty Q2 stage."], "jumps": []}, {"id": "P1212", "text": ["Measuring at TP2 first would not indicate if an incorrect signal was due to a faulty Q1 stage or a faulty input to the Q1 stage."], "jumps": []}, {"id": "P1211", "text": [], "jumps": []}, {"id": "P1210", "text": ["In this circuit, where would the first measurement be made during signal tracing?"], "jumps": ["P1180"]}, {"id": "P1200", "text": ["Then using an oscilloscope to check frequency, amplitude and phase, measure the signal through the circuit."], "jumps": ["P1210", "P1180"]}, {"id": "P1190", "text": ["A function generator is used to produce a signal in the form that the circuit is designed to use."], "jumps": ["P1200", "P1180"]}, {"id": "P1180", "text": ["The key to signal tracing is using a KNOWN input.", "The key to signal tracing is using a KNOWN input..........."], "jumps": ["P1190", "P1130"]}, {"id": "P1170", "text": ["Then resistance measurements are used to isolate the fault to a component."], "jumps": ["P1180", "P1130"]}, {"id": "P1160", "text": ["Once the faulty stage is located, measuring the DC bias voltages isolates the fault to either the transistor or one of the three biasing circuits."], "jumps": ["P1170", "P1130"]}, {"id": "P1150", "text": ["Notice that the DC bias voltages in the driver amplifier stage have not been measured.  If a stage has the correct AC input and output signals, the DC bias voltages must be correct.", "Notice that the DC bias voltages in the driver amplifier stage have not been measured. If a stage has the correct AC input and output signals, the DC bias voltages must be correct."], "jumps": ["P1160", "P1130"]}, {"id": "P1140", "text": ["There is no need to make additional measurements in the driver amplifier stage.  The fault is in the push-pull amplifier stage.", "There is no need to make additional measurements in the driver amplifier stage. The fault is in the push-pull amplifier stage."], "jumps": ["P1150", "P1130"]}, {"id": "P1130", "text": ["For example in this faulted circuit, if the input signal is correct at C1 and the output signal is correct at C3, the driver amplifier stage is not faulted.", "For example in this faulted circuit, if the input signal is correct at C1 and the output signal is correct at C3, the driver amplifier stage is not faulted.S"], "jumps": ["P1140", "P1020"]}, {"id": "P1120", "text": ["You located the faulty stage.  Troubleshoot the stage as an individual circuit.", "You located the faulty stage. Troubleshoot the stage as an individual circuit."], "jumps": ["P1130", "P1020"]}, {"id": "P1110", "text": ["Once you have found a stage that has a correct input and an incorrect output, you can stop signal tracing."], "jumps": ["P1120", "P1020"]}, {"id": "P1100", "text": ["hrough each stage and compare it to calculated or expected values. This the LIN", "You measure the input signal as it travels through each stage and compare it to calculated or expected values. This the LINEAR method of signal tracing."], "jumps": ["P1110", "P1020"]}, {"id": "P1090", "text": ["n input signal through a circuit from beginning to end.", "Linear signal tracing is a method of throubleshooting that follows a known signal from input to input through the stages until it is lost. This method requires many measurements to accomplish.........................................................."], "jumps": ["P1100", "P1020"]}, {"id": "P1080", "text": ["The logical approach is called SIGNALTRACING. Basically, there are two styles of signal tracing - Linear and Half-Splitting. The linear method, as the name implies, follows the signal through the amplifier stages in a straight line. Half-splitting uses a method of dividing multiple amplifier stages into smaller and smaller sections........"], "jumps": ["P1090", "P1020"]}, {"id": "P1070", "text": ["Then, only the faulted stage needs to be investigated further."], "jumps": ["P1080", "P1020"]}, {"id": "P1060", "text": ["A logical approach must be used. One that will quickly, using a minimum number of measurements, isolate a fault to the correct stage in the circuit."], "jumps": ["P1070", "P1020"]}, {"id": "P1050", "text": ["This hit or miss method is not very practical.  An incorrect measurement in Q2's circuit might be caused by a fault in Q1's circuit.", "This hit or miss method is not very practical. An incorrect measurement in Q2's circuit might be caused by a fault in Q1's circuit."], "jumps": ["P1060", "P1020"]}, {"id": "P1040", "text": ["If you are lucky, after making a few measurements, the problem could be located."], "jumps": ["P1050", "P1020"]}, {"id": "P1030", "text": ["You could start troubleshooting by measuring DC and/or AC voltages anywhere in the circuit."], "jumps": ["P1040", "P1020"]}, {"id": "P1020", "text": ["In this two stage amplifier circuit, there are many faults that can cause an incorrect output."], "jumps": ["P1030", "P1001"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P450", "text": ["Let's begin the lesson on MULTISTAGE AMPLIFIER TROUBLESHOOTING EXPERIMENT..."], "jumps": ["P400"]}, {"id": "P440", "text": ["Once the correct faulted stage is identified, circuit troubleshooting techniques can be followed."], "jumps": ["P450", "P400"]}, {"id": "P430", "text": ["If amplifier number 3 is faulted, amplifier number 4 will not operate normally."], "jumps": ["P440", "P400"]}, {"id": "P420", "text": ["Guessing that amplifier number 4 is faulted and then troubleshooting this stage may prove useless."], "jumps": ["P430", "P400"]}, {"id": "P410", "text": ["Troubleshooting a multistage circuit can be confusing unless a logical procedure is followed."], "jumps": ["P420", "P400"]}, {"id": "P400", "text": ["In this lesson you will learn a troubleshooting method for locating common faults in a multistage amplifier circuit."], "jumps": ["P410", "P300"]}, {"id": "P335", "text": [], "jumps": ["P300"]}, {"id": "P330", "text": [], "jumps": ["P300"]}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 480, 488 or Equivalent XXXXXnt"], "jumps": ["P330", "P335"]}, {"id": "P100", "text": ["w Describe the troubleshooting method of signal tracing. w Identify common faults in a multistage amplifier circuit.", "w Recognize that a multistage amplifier circuit is faulted. w Troubleshoot a faulted multistage amplifier circuit..............."], "jumps": []}, {"id": "P10", "text": ["MULTISTAGE AMPLIFIER TROUBLESHOOTING EXPERIMENT"], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
