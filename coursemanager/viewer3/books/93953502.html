P420", "text": ["The operation of a Hartley oscillator is the same as a LC oscillator.", "The operation of a Hartley oscillator is the same as a LC oscillator..."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Only the number of components in the feedback circuit are different."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on HARTLEY OSCILLATOR OPERATION...................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": ["P440"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["This is a typical Hartley oscillator.", "This is a typical Hartley oscillator. ......................", "This is a typical Hartley oscillator. Its purpose is to change the DC operating voltage to a sine wave AC output..."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["It is identified as an LC oscillator by the components in the feedback circuit."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["It is identified as a Hartley oscillator by the two inductors."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["To analyze circuit operation, divide the oscillator into its two circuits."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["The amplifier circuit consists of Q1 and its associated components."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["A common emitter amplifier is used.  Notice that the transistor is an NPN.", "A common emitter amplifier is used. Notice that the transistor is an NPN."], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["R1 and R2 develop fixed bias on the base of Q1.  R3 is the collector load resistor.", "R1 and R2 develop fixed bias on the base of Q1. R3 is the collector load resistor."], "jumps": ["P1090", "P1020"]}, {"id": "P1090", "text": ["R4 and C3 provide self biasing."], "jumps": ["P1100", "P1020"]}, {"id": "P1100", "text": ["C2 and C4 are coupling capacitors."], "jumps": ["P1110", "P1020"]}, {"id": "P1110", "text": ["Q1 output is routed through the feedback circuit to its input."], "jumps": ["P1115", "P1020"]}, {"id": "P1115", "text": ["This produces oscillations at one particular frequency."], "jumps": ["P1120"]}, {"id": "P1120", "text": ["The feedback circuit consists of C1, L1 and L2.", "The feedback circuit consists of C1, L1 and L2............."], "jumps": ["P1130", "P1020"]}, {"id": "P1130", "text": ["These components determine the frequency of oscillations."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["When the LC tank is resonant, circulating current flows through L1 and L2 in series."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["Two inductors are used to reduce the amount of feedback to the amplifier's input."], "jumps": ["P1155", "P1120"]}, {"id": "P1155", "text": ["This prevents over driving the amplifier."], "jumps": ["P1160", "P1120"]}, {"id": "P1160", "text": ["L1 and L2 form an AC voltage divider.  The input to the feedback circuit is developed across C1 and L2.", "L1 and L2 form an AC voltage divider. The input to the feedback circuit is developed across C1 and L2."], "jumps": ["P1170", "P1120"]}, {"id": "P1170", "text": ["The output to Q1 is developed across C1 and L1."], "jumps": ["P1180", "P1120"]}, {"id": "P1180", "text": ["The required phase shift is accomplished by the feedback circuit."], "jumps": ["P1190", "P1120"]}, {"id": "P1190", "text": ["Checking for normal operation requires calculating the frequency of the resonant circuit.", "= = 5 kHz 2pS LC"], "jumps": ["P1200", "P1120"]}, {"id": "P1200", "text": ["Then measure the output frequency with an oscilloscope or frequency counter."], "jumps": ["P1210", "P1120"]}, {"id": "P1210", "text": ["Touch the Hartley oscillator feedback circuit.", "Touch the Hartley oscillator feedback circuit.............."], "jumps": ["P1120"]}, {"id": "P1212", "text": [], "jumps": []}, {"id": "P1213", "text": ["The circuit you touched has one inductor and two capacitors.  Hartley oscillators do not use two capacitors in the feedback circuit.", "The circuit you touched has one inductor and two capacitors. Hartley oscillators do not use two capacitors in the feedback circuit."], "jumps": []}, {"id": "P1214", "text": ["The circuit you touched has one inductor and one capacitor.  Hartley oscillator feedback circuits are different from a basic LC oscillator.", "The circuit you touched has one inductor and one capacitor. Hartley oscillator feedback circuits are different from a basic LC oscillator."], "jumps": []}, {"id": "P1220", "text": ["What is the frequency of this Hartley oscillator?", "What is the frequency of this Hartley oscillator?.........."], "jumps": ["P1210"]}, {"id": "P1222", "text": [], "jumps": []}, {"id": "P1223", "text": ["The frequency of a LC or Hartley oscillator equals the formula below.  Remember to add the values of L1 and L2 before using the rest of the formula.", "The frequency of a LC or Hartley oscillator equals the formula below. Remember to add the values of L1 and L2 before using the rest of the formula.", "= 2pS(L1+L2)CL1+L2)C"], "jumps": []}, {"id": "P1225", "text": ["= 2pS LCpS LC", "FREQUENCY OF HARTLEY OSCILLATOR - To solve for the frequency of a Hartley oscillator use the formula below."], "jumps": ["P1226", "P1220"]}, {"id": "P1226", "text": ["Solve for L first by adding L1 and L2 together.  Then multiply L and C for LC.  Remember the value for p is 3.14.", "Solve for L first by adding L1 and L2 together. Then multiply L and C for LC. Remember the value for p is 3.14...............", "= 2pS LCpS LC"], "jumps": ["P1227", "P1225"]}, {"id": "P1227", "text": ["FREQUENCY OF HARTLEY OSCILLATOR - The feedback circuit comprised of C1, L1 and L2 determine the frequency of a Hartley oscillator."], "jumps": ["P1220", "P1225"]}, {"id": "P1230", "text": ["Is this Hartley oscillator operating normally?", "Is this Hartley oscillator operating normally?............."], "jumps": ["P1220"]}, {"id": "P1232", "text": [], "jumps": []}, {"id": "P1233", "text": ["Compare the calculated frequency with the measured frequency. Since they are the same, the circuit is operating normally.", "Compare the calculated frequency with the measured frequency. Since they are the same, the circuit is operating normally.."], "jumps": []}, {"id": "P1235", "text": ["NORMAL OPERATION OF HARTLEY OSCILLATOR - Calculate the frequency of the tank circuit. Compare the calculated frequency with the measured frequency.", "= 2pS LCpS LC"], "jumps": []}, {"id": "P1240", "text": ["This is also a Hartley oscillator.  It uses two inductors in the feedback circuit.", "This is also a Hartley oscillator. It uses two inductors in the feedback circuit."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["The operation is the same.  Only the amplifier's biasing and the point where the output is taken from is different.", "The operation is the same. Only the amplifier's biasing and the point where the output is taken from is different."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["Q1 uses emitter feedback biasing."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["Fewer components are used and there is no temperature stabilization."], "jumps": ["P1280", "P1240"]}, {"id": "P1280", "text": ["Taking the output of the feedback circuit allows the amplifier to be biased class B or C.", "Taking the output of the feedback circuit allows the amplifier to be biased class B or C.plifier to be biased class B or C."], "jumps": ["P1290", "P1240"]}, {"id": "P1290", "text": ["Taking the output from the collector of an amplifier biased class B or C produces a distorted output waveform."], "jumps": ["P1300", "P1240"]}, {"id": "P1300", "text": ["This circuit is also a Hartley oscillator.  It uses two inductors.", "This circuit is also a Hartley oscillator. It uses two inductors."], "jumps": ["P1310", "P1240"]}, {"id": "P1310", "text": ["However, the input to the feedback circuit is from the emitter to the center of L1 and L2."], "jumps": ["P1320", "P1300"]}, let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
