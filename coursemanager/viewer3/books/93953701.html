es are switches..................................."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Regular transistors may be used as switches with proper biasing; however, UJTs and SCRs are designed only for switching."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["UJTs and SCRs require less circuitry than transistors to perform switching.  This saves space and cost.", "UJTs and SCRs require less circuitry than transistors to perform switching. This saves space and cost."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["Let's begin the lesson on INTRODUCTION TO TRIGGER DEVICES..................."], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": ["P450"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1040", "text": ["The UJT can replace two transistors in an astable multivibrator circuit.  Note the decrease in circuit size and the number of components.", "The UJT can replace two transistors in an astable multivibrator circuit. Note the decrease in circuit size and the number of components."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The schematic symbol for UJTs is similar to FETs.", "The schematic symbol for UJTs is similar to FETs................"], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["However, the names of the elements are different.", "However, the names of the elements are different................"], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["There are two bases, labeled B1 and B2.", "There are two bases, labeled B1 and B2........................."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["The emitter has an arrow pointing to B1.  The arrowhead always points to B1 base.", "The emitter has an arrow pointing to B1. The arrowhead always points to B1 base."], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["UJTs do not have P type material bases.", "UJTs do not have P type material bases........................."], "jumps": ["P1100", "P1050"]}, {"id": "P1102", "text": ["You touched B1.  Remember, B1 is indicated by the emitter arrowhead pointing towards it.", "You touched B1. Remember, B1 is indicated by the emitter arrowhead pointing towards it."], "jumps": []}, {"id": "P1103", "text": ["You touched the emitter.  Remember, the emitter has an arrowhead.", "You touched the emitter. Remember, the emitter has an arrowhead."], "jumps": []}, {"id": "P1100", "text": ["Touch Base 2 on this unijunction transistor.", "Touch Base 2 on this unijunction transistor................"], "jumps": ["P1050"]}, {"id": "P1101", "text": [], "jumps": []}, {"id": "P1112", "text": ["You touched B1.  Remember, B1 is indicated by the emitter arrowhead pointing towards it.", "You touched B1. Remember, B1 is indicated by the emitter arrowhead pointing towards it."], "jumps": []}, {"id": "P1111", "text": [], "jumps": []}, {"id": "P1110", "text": ["Touch the emitter on this unijunction transistor.", "Touch the emitter on this unijunction transistor..........."], "jumps": ["P1100"]}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1113", "text": ["You touched B2.  Remember, there are two bases.  B1 has the emitter arrowhead pointing towards it, the emitter does not point towards B2.", "You touched B2. Remember, there are two bases. B1 has the emitter arrowhead pointing towards it, the emitter does not point towards B2."], "jumps": []}, {"id": "P1120", "text": ["The name unijunction is derived from the construction of UJTs.  There is only one PN junction.", "The name unijunction is derived from the construction of UJTs. There is only one PN junction."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["The two bases are formed from a bar of N type material that is lightly doped."], "jumps": ["P1140", "P1120", "P1135"]}, {"id": "P1150", "text": ["The emitter and bases form a PN junction.  Only when the junction is forward biased will current flow from the N material to the P material.", "The two bases are formed from a bar of N type material that is lightly doped.", "The emitter and bases form a PN junction. Only when the junction is forward biased will current flow from the N material to the P material."], "jumps": ["P1160", "P1132"]}, {"id": "P1132", "text": ["The two bases are formed from a bar of N type material that is lightly doped."], "jumps": ["P1135", "P1140", "P1120"]}, {"id": "P1135", "text": ["or three electrons in the outer most orbit.", "DOPED - Doping is adding impurities to a piece of pure semiconductor material that has four electrons in the outermost orbit. The doping produces N or P type material depending on if the impurity has five or three electrons in the outer most orbit."], "jumps": ["P1132"]}, {"id": "P1172", "text": ["The emitter is constructed from P material.", "The emitter is constructed from P material......................."], "jumps": []}, {"id": "P1391", "text": [], "jumps": ["P1400", "P1390"]}, {"id": "P1160", "text": ["How many PN junctions do UJTs have?", "How many PN junctions do UJTs have?........................"], "jumps": ["P1132"]}, {"id": "P1240", "text": ["The UJT is OFF or not conducting when emitter current is not flowing."], "jumps": ["P1250", "P1180"]}, {"id": "P1162", "text": ["Remember, the two bases are constructed from one piece of semiconductor material."], "jumps": []}, {"id": "P1170", "text": ["The two bases of a UJT are constructed from", "The two bases of a UJT are constructed from................", "P material for B1 and N material for B2."], "jumps": ["P1160"]}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1251", "text": ["The emitter is constructed from P material.", "The emitter is constructed from P material......................."], "jumps": []}, {"id": "P1173", "text": ["In a UJT, both bases are constructed from the same type of material."], "jumps": []}, {"id": "P1180", "text": ["The operation of UJTs require biasing the bases only.", "The operation of UJTs require biasing the bases only............"], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["B2 is biased positive with respect to B1.", "B2 is biased positive with respect to B1........................."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["The input is applied to the emitter.", "The input is applied to the emitter..............................."], "jumps": ["P1180"]}, {"id": "P1210", "text": ["When the input voltage is sufficiently positive, the base 1 to emitter PN junction is forward biased and current will flow."], "jumps": ["P1220", "P1180"]}, {"id": "P1220", "text": ["The UJT is ON or conducting when emitter current flows.", "The UJT is ON or conducting when emitter current flows.........."], "jumps": ["P1180"]}, {"id": "P1260", "text": ["Normally, it takes approximately +.6 volts to forward bias a PN junction in a transistor.", "The UJT is OFF or not conducting when emitter current is not flowing."], "jumps": ["P1270", "P1250", "P1180"]}, {"id": "P1250", "text": ["A UJT is ON when", "A UJT is ON whenquestion is typed.........................."], "jumps": ["P1180"]}, {"id": "P1393", "text": ["The voltage at the junction of the diode and the two resistances determine the turn on voltage.  7 V is the voltage dropped before the junction.", "The voltage at the junction of the diode and the two resistances determine the turn on voltage. 7 V is the voltage dropped before the junction."], "jumps": []}, {"id": "P1392", "text": ["The voltage at the junction of the diode and the two resistances determines the turn ON voltage.  10 V is the applied voltage.", "The voltage at the junction of the diode and the two resistances determines the turn ON voltage. 10 V is the applied voltage."], "jumps": []}, {"id": "P1253", "text": ["When the PN junction is reverse biased, emitter current does not flow.  The UJT is not ON.", "When the PN junction is reverse biased, emitter current does not flow. The UJT is not ON."], "jumps": []}, {"id": "P1270", "text": ["However, UJTs are different due to their construction.  Turn ON voltages range from +.6 VDC to the value of +Vcc.  Let's see why.", "However, UJTs are different due to their construction. Turn ON voltages range from +.6 VDC to the value of +Vcc. Let's see why."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["The two bases are made from lightly doped N type material.", "The two bases are made from lightly doped N type material......."], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["The lightly doped N material will not conduct very much current when the bias voltage is applied.  There are very few current carriers.", "The lightly doped N material will not conduct very much current when the bias voltage is applied. There are very few current carriers."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["This is the same as saying that there is a high resistance between the two bases. The resistance is called Interbase Resistance, Rbb."], "jumps": ["P1310", "P1280"]}, {"id": "P1310", "text": ["The emitter forms a PN junction, or diode, between the two bases.  It divides Rbb in two.", "The emitter forms a PN junction, or diode, between the two bases. It divides Rbb in two."], "jumps": ["P1320", "P1280"]}, {"id": "P1320", "text": ["Rbb1 and Rbb2 form a voltage divider.  This places a positive voltage on the cathode of the diode.", "Rbb1 and Rbb2 form a voltage divider. This places a positive voltage on the cathode of the diode."], "jumps": ["P1280"]}, {"id": "P1330", "text": ["The input voltage on the emitter must be larger than +Erbb1 to forward bias the diode and turn ON the UJT."], "jumps": ["P1340", "P1280"]}, {"id": "P1340", "text": ["During the manufacturing process, the placement of the emitter determines the voltage required to overcome Erbb1."], "jumps": ["P1280"]}, {"id": "P1350", "text": ["For example, if Vcc is +12 V and Rbb1 equals Rbb2, it takes a little more than +6 V to turn the UJT ON."], "jumps": ["P1360", "P1280"]}, {"id": "P1360", "text": ["If the value of Rbb1 and Rbb2 are different, a different voltage is required to turn ON the UJT."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["Once the UJT is ON, the resistance of Rbb1 drops to near zero."], "jumps": ["P1380", "P1350"]}, {"id": "P1380", "text": ["The heavily doped emitter forces holes into the base when forward biased.  This supplies a good conducting path and the resistance is lowered.", "The heavily doped emitter forces holes into the base when forward biased. This supplies a good conducting path and the resistance is lowered.", "The heavily doped emitter forces positive charges into the base when forward biased. This supplies a good conducting path and the resistance is lowered.", "\"The heavily doped emitter forces positive charges", "The heavily doped emitter forces holes into the base when forward biased. This supplies a good conducting path and the resistance is lowered.is lowered."], "jumps": ["P1390", "P1350"]}, {"id": "P1400", "text": ["Each type of UJT has a different turn ON voltage.", "Each type of UJT has a different turn ON voltage................."], "jumps": ["P1410", "P1390"]}, {"id": "P1390", "text": ["What is the emitter voltage required to turn this UJT ON?", "What is the emitter voltage required to turn this UJT ON?.."], "jumps": ["P1350"]}, {"id": "P1410", "text": ["To find the approximate turn ON voltage for a particular UJT, look up the eta (e) in a transistor reference book and multiply it by Vcc.", "The voltage at the junction of the diode and the two resistances determines the turn ON voltage.  10 V is the applied voltage.", "The voltage at the junction of the diode and the two resistances determines the turn ON voltage. 10 V is the applied voltage."], "jumps": ["P1420", "P1400"]}, {"id": "P1430", "text": ["Multiplying by Vcc equals the voltage at the junction of the diode and Rbb1, Rbb2. \n                                    Turn ON Voltage = (e) x Vcc", "Multiplying by Vcc equals the voltage at the junction of the diode and Rbb1, Rbb2. Turn ON Voltage = (e) x Vcc"], "jumps": ["P1440", "P1420", "P1435"]}, {"id": "P1435", "text": ["TURN ON VOLTAGE - Rbb1 and Rbb2 form a voltage divider. The voltage between the two resistances equals:", "= x Rbb1 orr"], "jumps": ["P1432"]}, {"id": "P1432", "text": ["Multiplying by Vcc equals the voltage at the junction of the diode and Rbb1, Rbb2. \n                                    Turn ON Voltage = (e) x Vcc", "Multiplying by Vcc equals the voltage at the junction of the diode and Rbb1, Rbb2. Turn ON Voltage = (e) x Vcc"], "jumps": ["P1440", "P1420", "P1435"]}, {"id": "P1420", "text": ["Eta is the value of:  \n\n                                                         Rbb1   \n                                                  Rbb1 + Rbb2", "Eta is the value of: Rbb1 Rbb1 + Rbb2222222222222222222222222222222222222222222222"], "jumps": ["P1430", "P1400"]}, {"id": "PINFO", "text": ["at. jay 08-02-99 Converted steps 1 - 9. debbie 08-05-99 Trainer code N/A. debbie 08-10-99 Test and cleanup. debbie 01-11-00 Added else statement to following pages: 1200, 1210, 1220, 1230, 1250, 1252, 1253, 1320, 1330, 1340, 1350, 1380, 1940, 1950, 1960, 1970, 1980, 2150, 2160, 2260, 2270, 2285, 2290 2300, 2340, 2360, 2362, 2370, 2372, 2373, 2960, 2970, 10215, 10225, 10226, & 10228. debbie 07-14-00 Converted to ToolBook 7.1 format. jay 10-27-00 Add Monitor Pro code to quiz pages. jay 11-29-00 Added HelpPage information and new random gen. script. -Penny 01-24-01 P10221, changed distractor a, input current to gate current. Changed distractor b, input voltage to cathode voltage. Changed distractor c, diode is to anode to gate is. Changed distractor d, diode is to anode to cathode is. GLK comments, -Penny 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-14-02 Reviewed and made corrections. - james 10-24-02 P10219 - changed \"Beta\" to \"eta\" - frieda 11-11-02 P10218 - changed from ...ON, is the approximate... to ...ON, the approximate... - frieda 02-17-03 Made script ar of N material with the emitter being P material. There is only one PN junction."], "jumps": ["P1930"]}, {"id": "P1950", "text": ["4.  The UJT is ON when emitter current flows, emitter to Base 1            PN junction is forward biased.", "4. The UJT is ON when emitter current flows, emitter to Base 1 PN junction is forward biased."], "jumps": ["P1940"]}, {"id": "P1960", "text": ["5.  The UJT is OFF when emitter current does not flow, emitter to        Base 1 PN junction is reversed biased.", "5. The UJT is OFF when emitter current does not flow, emitter to Base 1 PN junction is reversed biased."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  The voltage necessary to forward bias the emitter is equal to          the voltage developed inside the UJT by the connection of             the emitter to the resistance between the bases.", "6. The voltage necessary to forward bias the emitter is equal to the voltage developed inside the UJT by the connection of the emitter to the resistance between the bases."], "jumps": ["P1960"]}, {"id": "P1980", "text": ["7.  The turn ON voltage of UJTs depends on the eta and the bias         voltage.  \n                                    Turn ON Voltage = (e) x Vcc", "7. The turn ON voltage of UJTs depends on the eta and the bias voltage. Turn ON Voltage = (e) x Vcc"], "jumps": ["P1999", "P1970"]}, {"id": "P1999", "text": ["You have completed the Summary.  \nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["The purpose of a silicon control rectifier (SCR) is to switch current On and Off."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["SCRs turn ON (conduct) when an input current is applied to one of the elements."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["The SCR can replace mechanical switches that control large amounts of load current.  There are no moving parts to cause arcing or to wear out.", "The SCR can replace mechanical switches that control large amounts of load current. There are no moving parts to cause arcing or to wear out."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["The schematic symbol for SCRs is similar to diodes.", "The schematic symbol for SCRs is similar to diodes.............."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["However, in addition to the anode and cathode, there is a gate.", "However, in addition to the anode and cathode, there is a gate...."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["The anode is the same as a diode's anode.", "The anode is the same as a diode's anode......................."], "jumps": ["P2080", "P2050"]}, {"id": "P2080", "text": ["The cathode is the same as a diode's cathode.", "The cathode is the same as a diode's cathode..................."], "jumps": ["P2090", "P2050"]}, {"id": "P2090", "text": ["The gate is a line connected to the cathode.", "The gate is a line connected to the cathode......................"], "jumps": ["P2100", "P2050"]}, {"id": "P2100", "text": ["Touch the cathode on this silicon control rectifier.", "Touch the cathode on this silicon control rectifier........"], "jumps": ["P2050"]}, {"id": "P2101", "text": [], "jumps": []}, {"id": "P2102", "text": ["You touched the gate.  The gate is shown by a line connected to the cathode.", "You touched the gate. The gate is shown by a line connected to the cathode."], "jumps": []}, {"id": "P2103", "text": ["You touched the anode.  Remember, in a diode and SCR, the anode is represented by the arrow.", "You touched the anode. Remember, in a diode and SCR, the anode is represented by the arrow.A"], "jumps": []}, {"id": "P2110", "text": ["Touch the anode on this silicon control rectifier.", "Touch the anode on this silicon control rectifier.........."], "jumps": ["P2100"]}, {"id": "P2111", "text": [], "jumps": []}, {"id": "P2112", "text": ["You touched the cathode.  Remember, in a diode and SCR, the cathode is represented by a line across the arrow.", "You touched the cathode. Remember, in a diode and SCR, the cathode is represented by a line across the arrow."], "jumps": []}, {"id": "P2113", "text": ["You touched gate.  Remember, the gate is represented by a line connected to the cathode.", "You touched gate. Remember, the gate is represented by a line connected to the cathode."], "jumps": []}, {"id": "P2120", "text": ["The name silicon control rectifier is derived from the fact that it is a rectifier (diode) that is controlled by additional semiconductor material."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["It is constructed from four semiconductor elements, two N and two P."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["The anode is connected to P material as in a diode.", "The anode is connected to P material as in a diode..............."], "jumps": ["P2150", "P2120"]}, {"id": "P2150", "text": ["The cathode is connected to N material as in a diode.", "The cathode is connected to N material as in a diode............."], "jumps": ["P2120"]}, {"id": "P2160", "text": ["Only when the anode to cathode is forward biased will current flow, if the gate allows it."], "jumps": ["P2170", "P2120"]}, {"id": "P2170", "text": ["The gate is connected to a thin piece of P material between two pieces of N material.  The gate can be as thin as the size of one atom.", "The gate is connected to a thin piece of P material between two pieces of N material. The gate can be as thin as the size of one atom."], "jumps": ["P2180", "P2120"]}, {"id": "P2180", "text": ["It is the action of the gate that makes a SCR different from a normal rectifier diode."], "jumps": ["P2190", "P2120"]}, {"id": "P2190", "text": ["How many PN junctions do SCRs have?", "How many PN junctions do SCRs have?........................"], "jumps": ["P2120"]}, {"id": "P2191", "text": [], "jumps": []}, {"id": "P2192", "text": ["Remember, there are four elements, two P and two N types.  This produces more than 1 PN junction.", "Remember, there are four elements, two P and two N types. This produces more than 1 PN junction."], "jumps": []}, {"id": "P2193", "text": ["Remember, there are four elements, two P and two N types.  This produces more than 2 PN junctions.", "Remember, there are four elements, two P and two N types. This produces more than 2 PN junctions."], "jumps": []}, {"id": "P2200", "text": ["The gate is constructed from _______", "The gate is constructed from _______......................."], "jumps": ["P2190"]}, {"id": "P2201", "text": [], "jumps": []}, {"id": "P2202", "text": ["The gate is not made from N material.  The gate is next to the cathode which is N material.", "The gate is not made from N material. The gate is next to the cathode which is N material."], "jumps": []}, {"id": "P2203", "text": ["The gate is made from P material but, it is not thick.", "The gate is made from P material but, it is not thick..............."], "jumps": []}, {"id": "P2320", "text": ["Each type of SCR requires a different value of gate current to turn ON.  Values range from 2 to 20 mA.", "Each type of SCR requires a different value of gate current to turn ON. Values range from 2 to 20 mA."], "jumps": ["P2330", "P2300"]}, {"id": "P450", "text": ["Let's begin the lesson on INTRODUCTION TO TRIGGER DEVICES..................."], "jumps": ["P430"]}, {"id": "P2260", "text": ["The gate to cathode current flow eliminates the P material gate, and the N materials combine."], "jumps": ["P2210"]}, {"id": "P2350", "text": ["Output current rating is also given in transistor reference books."], "jumps": ["P2360", "P2320"]}, {"id": "P2240", "text": ["The P material of the gate prevents the current carriers in the anode and cathode from conducting current."], "jumps": ["P2250", "P2210"]}, {"id": "P2250", "text": ["Applying a positive current flow to the gate causes the P material to vanish. Remember, the voltage necessary to cause the current flow must be at least +.7 V."], "jumps": ["P2260", "P2210"]}, {"id": "P2300", "text": ["This is accomplished by either placing a switch in series with the SCR or by shorting the cathode to anode.", "This is accomplished by either placing a switch in series with the SCR or by shorting the anode to cathode."], "jumps": ["P2310", "P2210"]}, {"id": "P2280", "text": ["Removing the gate current once the SCR is ON has no effect.  The SCR is latched ON.", "Removing the gate current once the SCR is ON has no effect. The SCR is latched ON."], "jumps": ["P2285", "P2210"]}, {"id": "P2285", "text": ["The P material gate is eliminated, the two areas of N material stay together and the SCR performs like a forward biased diode."], "jumps": ["P2210"]}, {"id": "P2290", "text": ["The only way to restore the P material in the gate is to interrupt cathode to anode current flow.", "The only way to restore the P material in the gate is to interrupt anode to cathode current flow."], "jumps": ["P2300", "P2210"]}, {"id": "P1020", "text": ["The purpose of a unijunction transistor (UJT) is to switch voltage."], "jumps": ["P1030", "P1001"]}, {"id": "P2310", "text": ["Once the SCR is OFF, it remains OFF until a current is applied to the gate."], "jumps": ["P2320", "P2300"]}, {"id": "P1030", "text": ["UJTs turn ON (conduct) when the input voltage exceeds a specified level."], "jumps": ["P1040", "P1020"]}, {"id": "P2330", "text": ["Transistor reference books list the value as trigger current.  For example, a 2N4441 SCR requires 10 mA of gate current to turn it ON.", "Transistor reference books list the value as trigger current. For example, a 2N4441 SCR requires 10 mA of gate current to turn it ON."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["Even though a small amount of current turns a SCR ON.  SCR's output current rating (cathode to anode current) can be as high as 100 A.", "Even though a small amount of current turns a SCR ON. SCR's output current rating (cathode to anode current) can be as high as 100 A.", "Even though a small amount of current turns a SCR ON. SCR's output current rating (anode to cathode current) can be as high as 100 A."], "jumps": ["P2350", "P2320"]}, {"id": "P2360", "text": ["When a SCR is forward biased, what allows cathode to anode current flow?", "When a SCR is forward biased, what allows cathode to anode current flow?", "When a SCR is forward biased, what allows anode to cathode current flow?"], "jumps": ["P2320"]}, {"id": "P2361", "text": [], "jumps": []}, {"id": "P2362", "text": ["A large forward bias produces a large cathode to anode current flow when the SCR is ON.  The forward bias does not turn a SCR ON.", "A large forward bias produces a large anode to cathode current flow when the SCR is ON. The forward bias does not turn a SCR ON.", "A large forward bias produces a large cathode to anode current flow when the SCR is ON. The forward bias does not turn a SCR ON."], "jumps": []}, {"id": "P2363", "text": ["A large gate voltage may turn a SCR ON, but it is the gate current that eliminates the P material in the gate so that the N materials combine."], "jumps": []}, {"id": "P2370", "text": ["What happens to an SCR once it is turned ON and the gate current is removed?"], "jumps": ["P2360"]}, {"id": "P2371", "text": [], "jumps": []}, {"id": "P2372", "text": ["Once the P material in the gate is eliminated, the current flow through the SCR remains even if the gate current is taken away."], "jumps": []}, {"id": "P2373", "text": ["The gate current and voltage has no effect on the biasing of the SCR."], "jumps": []}, {"id": "P2380", "text": ["What turns a SCR OFF?", "What turns a SCR OFF?ion is typed.........................."], "jumps": ["P2370"]}, {"id": "P2381", "text": [], "jumps": []}, {"id": "P2382", "text": ["The gate current turns ON a SCR. However, removing the gate current once the SCR is latched ON will not turn the SCR OFF."], "jumps": []}, {"id": "P2383", "text": ["The gate voltage will turn ON a SCR if the current flow is great enough.  However, it does not affect the SCR once it is ON.  The SCR is latched ON.", "The gate voltage will turn ON a SCR if the current flow is great enough. However, it does not affect the SCR once it is ON. The SCR is latched ON."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on THE SILICON CONTROL RECTIFIER."], "jumps": ["P2001", "P2380"]}, {"id": "P2920", "text": ["1.  SCRs are current controlled electronic switches.", "1. SCRs are current controlled electronic switches.here..."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2.  The schematic symbol is similar to a diode. It has an anode,            cathode and a gate. The gate connects to the cathode.", "2. The schematic symbol is similar to a diode. It has an anode, cathode and a gate. The gate connects to the cathode."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3.  SCRs are constructed from four pieces of semiconductor                material.  Two P and two N.  There are three PN junctions.", "3. SCRs are constructed from four pieces of semiconductor material. Two P and two N. There are three PN junctions."], "jumps": ["P2950", "P2930"]}, {"id": "P2950", "text": ["4.  The SCR is ON when a gate current is applied and the                       cathode to anode is forward biased.", "4. The SCR is ON when a gate current is applied and the cathode to anode is forward biased."], "jumps": ["P2960", "P2940"]}, {"id": "P2960", "text": ["5.  SCRs are latched.  Once turned ON, they remain ON even if             the gate current is removed.", "5. SCRs are latched. Once turned ON, they remain ON even if the gate current is removed."], "jumps": ["P2950"]}, {"id": "P2970", "text": ["6. The SCR is OFF when there is no cathode to anode current.  To turn OFF an ON SCR, the cathode to anode current must be interrupted.", "6. The SCR is OFF when there is no anode to cathode current. To turn OFF an ON SCR, the cathode to anode current must be interrupted.", "6. The SCR is OFF when there is no cathode to anode current. To turn OFF an ON SCR, the cathode to anode current must be interrupted.", "6. The SCR is OFF when there is no cathode to anode current. To turn OFF an ON SCR, the cathode to anode current must be interrupted.pted.pted....."], "jumps": ["P2980", "P2950"]}, {"id": "P2980", "text": ["7.  The turn ON current depends on the type of SCR and ranges          from 2 to 20 mA.", "7. The turn ON current depends on the type of SCR and ranges from 2 to 20 mA."], "jumps": ["P2999", "P2950"]}, {"id": "P2999", "text": ["You have completed the Summary.  \nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2980"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P2230", "text": ["When the anode is positive with respect to the cathode, current still does not flow. Unlike a diode."], "jumps": ["P2240", "P2210"]}, {"id": "P10211", "text": ["A UJT turns ON when the _______d in when the brown dog chased him over the fence? X XXXX", "input current exceeds a specified level.int arial. This is the second line of text for the distractor. This is the third line of tex let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
