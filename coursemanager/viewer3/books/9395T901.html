ng random noise."], "jumps": []}, {"id": "P10216", "text": ["Selectivity is best defined as a receiver's ability to _______", "convert audio frequency to frequency modulation.", "tune to a specific frequency while rejecting others."], "jumps": []}, {"id": "P10215", "text": ["Distortion is commonly caused by _______"], "jumps": []}, {"id": "P10214", "text": ["Unwanted disruptions or variations that contaminate the RF carrier are _______"], "jumps": []}, {"id": "P10213", "text": ["AM detector is in phase with the RF carrier.", "\"intelligence\" is extracted from the carrier."], "jumps": []}, {"id": "P10212", "text": ["Modulation may best be defined as _______", "the altering of the modulus of the transmitter's antenna.", "recovery of the \"intelligence\" from the carrier signal.", "the superimposition of low frequency information on a higher frequency carrier signal.", "redundant amplitude variations in a given frequency."], "jumps": []}, {"id": "P10211", "text": ["In electronic communications, \"information\" may be defined as _______", "the heterodyning of the upper and lower sidebands.", "any intelligence or data deliberately being transmitted and/or received. g"], "jumps": []}, {"id": "P10210", "text": ["What is not a component of a typical communications system?"], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1995"]}, {"id": "P1995", "text": ["9.  Conversion of audio frequencies to sound waves is                          necessary because the human ear cannot hear RF.", "9. Conversion of audio frequencies to sound waves is necessary because the human ear cannot hear RF."], "jumps": ["P1999", "P1990"]}, {"id": "P1990", "text": ["8.  Sensitivity is a receiver's ability to lock onto a weak signal and      correct intended information.", "8. Sensitivity is a receiver's ability to lock onto a weak signal and correct intended information."], "jumps": ["P1995", "P1980"]}, {"id": "P1980", "text": ["7.  Selectivity is a receiver's ability to tune to a specific frequency       while rejecting others.", "7. Selectivity is a receiver's ability to tune to a specific frequency while rejecting others."], "jumps": ["P1990", "P1970"]}, {"id": "P1970", "text": ["6.  Distortion refers to the degradation of a signal normally due to      overdriven amplifiers.", "6. Distortion refers to the degradation of a signal normally due to overdriven amplifiers."], "jumps": ["P1980", "P1960"]}, {"id": "P1960", "text": ["5.  Noise is defined as any unwanted disruptions or variations            that contaminate the modulated signal.  Noise sources are:", "5. Noise is defined as any unwanted disruptions or variations that contaminate the modulated signal. Noise sources are: (Graphic Text) an-made 2. Atmospheric 3. Galactic", "Information to be conveyed RF source Modulation Transmitter Channel (frequency range) Receiver Demodulation Audio Amplifiers", "Man-Made mmunication System Composition Narrow Band FM Single Side-Band Independent Side-Band", "Atmospheric nication System Composition Narrow Band FM Single Side-Band Independent Side-Band", "Galactic mmunication System Composition Narrow Band FM Single Side-Band Independent Side-Band"], "jumps": ["P1970", "P1950"]}, {"id": "P1950", "text": ["4.  Demodulation is the extracting of the intelligence from the              carrier frequency.", "4. Demodulation is the extracting of the intelligence from the carrier frequency."], "jumps": ["P1960", "P1940"]}, {"id": "P1940", "text": ["3.  Modulation is the process of altering some characteristic of           the carrier frequency in direct response of another signal.", "2.  Information refers to the intelligence or data that is to be                  transmitted.", "3. Modulation is the process of altering some characteristic of the carrier frequency in direct response of another signal.", "2. Information refers to the intelligence or data that is to be transmitted."], "jumps": ["P1950", "P1930", "P1940", "P1920"]}, {"id": "P1920", "text": ["1.  A typical radio communication system must have:", "1. A typical radio communication system must have: raphic Text)- Information to be conveyed - RF source - Modulation - Transmitter - Channel (frequency range) - Receiver", "Information to be conveyed RF source Modulation Transmitter Channel (frequency range) Receiver Demodulation Audio Amplifiers", "Typical Communication System Composition Narrow Band FM Single Side-Band Independent Side-Band"], "jumps": ["P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on INTRODUCTION TO COMMUNICATIONS."], "jumps": ["P1001", "P1600"]}, {"id": "P1600", "text": ["While designs vary for both microphones and speakers, the actual conversion process remains fundamentally the same."], "jumps": ["P1910", "P1530"]}, {"id": "P1590", "text": ["The cone movement disrupts the air on either side of the cone and creates sound waves."], "jumps": ["P1600", "P1530"]}, {"id": "P1580", "text": ["This, in turn, drives the voice coil and cone in or out depending on direction of current flow."], "jumps": ["P1590", "P1530"]}, {"id": "P1570", "text": ["When current flows through the voice coil, a magnetic field is induced that interacts with the magnetic field of the permanent      magnet.", "When current flows through the voice coil, a magnetic field is induced that interacts with the magnetic field of the permanent magnet."], "jumps": ["P1580", "P1530"]}, {"id": "P1560", "text": ["The AF (Audio Frequency) from the amplifier is put across the inputs of a speaker which are actually opposite ends of a voice coil."], "jumps": ["P1570", "P1530"]}, {"id": "P1550", "text": ["They both use magnets and voice coils."], "jumps": ["P1560", "P1530"]}, {"id": "P1540", "text": ["A loudspeaker contains essentially the same elements in, basically, the same order.  The cone and diaphragm have the same function.", "This conversion process is reversed when audio frequency is turned into sound.", "A loudspeaker contains essentially the same elements in, basically, the same order. The cone and diaphragm have the same function."], "jumps": ["P1550", "P1530", "P1540", "P1480"]}, {"id": "P1520", "text": ["The audio frequencies created by the induced energy are the intelligence that modulates the radio frequency transmitted into the air and picked up by receivers."], "jumps": ["P1530", "P1480"]}, {"id": "P1510", "text": ["As the diaphragm reacts to the changes in air pressure, the coil moves back and forth through the flux lines of the magnetic field, including an electromotive force in the coil."], "jumps": ["P1520", "P1480"]}, {"id": "P1500", "text": ["The diaphragm is connected to a coil of fine wire called a \"voice coil\".  This coil is positioned within a magnetic field.", "The diaphragm is connected to a coil of fine wire called a \"voice coil\". This coil is positioned within a magnetic field."], "jumps": ["P1510", "P1480"]}, {"id": "P1490", "text": ["Here they collide with a sensitive diaphragm designed to respond to even slight variations in air pressure.", "Consider a local broadcast station.  When an announcer speaks into a microphone, the sound waves are projected into the sound receptor section.", "Consider a local broadcast station. When an announcer speaks into a microphone, the sound waves are projected into the sound receptor section."], "jumps": ["P1500", "P1480", "P1490", "P1470"]}, {"id": "P1470", "text": ["Because the human ear is incapable of detecting radio waves, they must first be converted to sound waves.  The reverse process must be used before a transmission takes place.", "Because the human ear is incapable of detecting radio waves, they must first be converted to sound waves. The reverse process must be used before a transmission takes place."], "jumps": ["P1480", "P1460"]}, {"id": "P1460", "text": ["In most cases, information being transmitted and received through a communication system will be in the range of audio frequencies.", "Speed of Light Wavelength = Frequency"], "jumps": ["P1470", "P1450"]}, {"id": "P1450", "text": ["While this may appear to be a matter of designing high gain amplifier stages, noise must be factored into the equation.  If the   signal is amplified, so is the noise.  Conversely, noise may not be reduced without an equal reduction of signal.", "While this may appear to be a matter of designing high gain amplifier stages, noise must be factored into the equation. If the signal is amplified, so is the noise. Conversely, noise may not be reduced without an equal reduction of signal."], "jumps": ["P1460", "P1440"]}, {"id": "P1440", "text": ["A receiver's sensitivity lies in its ability to lock onto a weak signal and correctly reproduce the intended information."], "jumps": ["P1450", "P1410"]}, {"id": "P1430", "text": ["An AM station may be broadcasting as 620 kHz, while elsewhere another station may be broadcasting at 630 kHz.  A receiver must be able to reject neighboring frequencies while tuning to the desired frequency.", "An AM station may be broadcasting as 620 kHz, while elsewhere another station may be broadcasting at 630 kHz. A receiver must be able to reject neighboring frequencies while tuning to the desired frequency."], "jumps": ["P1440", "P1410"]}, {"id": "P1420", "text": ["AM broadcast stations are able to cover large geographical areas."], "jumps": ["P1430", "P1410"]}, {"id": "P1410", "text": ["Selectivity is a receiver's ability to tune to a specific frequency while rejecting others."], "jumps": ["P1420", "P1390"]}, {"id": "P1400", "text": ["From the perspective of the final audible product, there is a fine line between noise and distortion."], "jumps": ["P1410", "P1390"]}, {"id": "P1390", "text": ["Distortion is the degradation of a signal, commonly resulting from overdriven amplifiers, where the peaks of the waveform are clipped or flattened.  This results in the loss of upper and lower frequencies.", "Distortion is the degradation of a signal, commonly resulting from overdriven amplifiers, where the peaks of the waveform are clipped or flattened. This results in the loss of upper and lower frequencies."], "jumps": ["P1400", "P1360"]}, {"id": "P1380", "text": ["Because noise is unpredictable, it is difficult to design circuitry that can completely eliminate noise."], "jumps": ["P1390", "P1360"]}, {"id": "P1370", "text": ["Band specific filters greatly assist in eliminating much of the noise, both internal and external."], "jumps": ["P1380", "P1360"]}, {"id": "P1360", "text": ["Internal noise (sometimes called Johnson Noise) is generated by all the components of the system and, for the most part, is accumulative.  That is, noise generated in one stage is amplified in the next.", "Internal noise (sometimes called Johnson Noise) is generated by all the components of the system and, for the most part, is accumulative. That is, noise generated in one stage is amplified in the next."], "jumps": ["P1370", "P1340"]}, {"id": "P1350", "text": ["Galactic noise is commonly caused by sunspots, and may be strong enough to completely blank out normal reception.  This is particularly true in communication systems like cable TV, that use satellites.", "Galactic noise is commonly caused by sunspots, and may be strong enough to completely blank out normal reception. This is particularly true in communication systems like cable TV, that use satellites."], "jumps": ["P1360", "P1340"]}, {"id": "P1340", "text": ["Noises generated outside our atmosphere are considered galactic."], "jumps": ["P1330", "P1350"]}, {"id": "P1330", "text": ["Atmospheric noises are predominantly caused by lightning.", "Atmospheric noises are predominantly caused by lightning..."], "jumps": ["P1340", "P1320"]}, {"id": "P1320", "text": ["Externally speaking, noise may be derived from man-made, atmospheric and galactic sources.  Man-made noises, like those in an industrial environment, often decrease frequency.  Common culprits are engine ignition systems and high-voltage power lines.", "Externally speaking, noise may be derived from man-made, atmospheric and galactic sources. Man-made noises, like those in an industrial environment, often decrease frequency. Common culprits are engine ignition systems and high-voltage power lines."], "jumps": ["P1310", "P1330"]}, {"id": "P1314", "text": ["Current has nothing to do with noise.", "Current has nothing to do with noise......................."], "jumps": []}, {"id": "P1313", "text": ["The audio is shifted 180 out of phase to modulate the carrier."], "jumps": []}, {"id": "P1312", "text": ["In FM, variances in frequency is the intelligence.", "In FM, variances in frequency is the intelligence.........."], "jumps": []}, {"id": "P1311", "text": [], "jumps": []}, {"id": "P1310", "text": ["Noise may best be defined as _______", "Noise may best be defined as _______.......................", "any unwanted disruptions or variations that contaminate the modulated carrier.", "external and internal current fluctuations."], "jumps": ["P1300"]}, {"id": "P1304", "text": ["Demodulation has nothing to do with the signal strength.", "Demodulation has nothing to do with the signal strength...."], "jumps": []}, {"id": "P1303", "text": ["Demodulation has nothing to do with balancing the modulator."], "jumps": []}, {"id": "P1302", "text": ["Control of modulation is performed at the transmitter.", "Control of modulation is performed at the transmitter......"], "jumps": []}, {"id": "P1301", "text": [], "jumps": []}, {"id": "P1300", "text": ["Demodulation is necessary to _______", "Demodulation is necessary to _______.......................", "extract the intelligence from the carrier.", "keep the carrier frequency from breaking up."], "jumps": ["P1290"]}, {"id": "P1290", "text": ["Noise may be defined as any unwanted disruptions or variations that contaminate the modulated carrier."], "jumps": ["P1300", "P1270"]}, {"id": "P1280", "text": ["Understanding both the nature and origins of noise is necessary from a technician's perspective with regard to system alignment or any other maintenance operation."], "jumps": ["P1290", "P1270"]}, {"id": "P1270", "text": ["In any communication system, noise is created by both external and internal sources.  Since there isn't any known way to isolate the system from the problem of noise, limiting it is the best that can be achieved.", "In any communication system, noise is created by both external and internal sources. Since there isn't any known way to isolate the system from the problem of noise, limiting it is the best that can be achieved."], "jumps": ["P1280", "P1260"]}, {"id": "P1260", "text": ["Once the signal is received, the AM detector and filter network will eliminate all but the original audio signal.  This process of  extracting the intelligence from the carrier frequency is known as demodulation.", "Once the signal is received, the AM detector and filter network will eliminate all but the original audio signal. This process of extracting the intelligence from the carrier frequency is known as demodulation."], "jumps": ["P1270", "P1240"]}, {"id": "P1250", "text": ["The audio signal is replicated on the positive side of the carrier, while on the negative side of the carrier, it is 180 degrees out of    phase.  Some receivers use the positive side of the carrier while   others use the negative side.", "The audio signal is replicated on the positive side of the carrier, while on the negative side of the carrier, it is 180 degrees out of phase. Some receivers use the positive side of the carrier while others use the negative side."], "jumps": ["P1260", "P1240"]}, {"id": "P1240", "text": ["The illustration below depicts a modulated RF carrier.", "The illustration below depicts a modulated RF carrier......"], "jumps": ["P1250", "P1230"]}, {"id": "P1230", "text": ["By using modulation, the parameters change by a large factor.  If the 10 kHz signal was being \"carried\" by a 90 MHz signal, the wavelength is 10.9 feet.  Using a quarter-wave antenna, the length need only be 2.06 feet long.", "By using modulation, the parameters change by a large factor. If the 10 kHz signal was being \"carried\" by a 90 MHz signal, the wavelength is 10.9 feet. Using a quarter-wave antenna, the length need only be 2.06 feet long.", "Information to be conveyed RF source Modulation Transmitter Channel (frequency range) Receiver Demodulation Audio Amplifiers", "Wavelength Formula n System Composition Narrow Band FM Single Side-Band Independent Side-Band", "186,000 mi/s = 2.6 miles 90 kHzzzzz Channel (frequency range) Receiver Demodulation Audio Amplifiers"], "jumps": ["P1240", "P1190"]}, {"id": "P1220", "text": ["Still, using the parameters from the previous calculation, the antenna could only be reduced to 2.32 miles long.  This would still be a problem if you wanted to drive a car with a radio.", "Still, using the parameters from the previous calculation, the antenna could only be reduced to 2.32 miles long. This would still be a problem if you wanted to drive a car with a radio."], "jumps": ["P1230", "P1190"]}, {"id": "P1210", "text": ["While antenna length is a problem, through the use of image frequencies and other antenna theory, 1/2, 1/4 and 1/8 wave        antennas may be utilized.", "While antenna length is a problem, through the use of image frequencies and other antenna theory, 1/2, 1/4 and 1/8 wave antennas may be utilized."], "jumps": ["P1220", "P1190"]}, {"id": "P1200", "text": ["Ideally, an antenna should be as long as the frequency it is receiving.  Using a frequency somewhere in the middle of the human hearing spectra, (16Hz to 16 kHz), the wavelength or antenna length for a 10 kHz frequency would be 18.6 miles long!", "Ideally, an antenna should be as long as the frequency it is receiving. Using a frequency somewhere in the middle of the human hearing spectra, (16Hz to 16 kHz), the wavelength or antenna length for a 10 kHz frequency would be 18.6 miles long!", "186,000 mi/s = 18.6 miles 10 kHzzzz Channel (frequency range) Receiver Demodulation Audio Amplifiers"], "jumps": ["P1210", "P1190"]}, {"id": "P1190", "text": ["The process of using an audio signal to modulate the frequency of a higher  \"carrier signal\"  was developed primarily to reduce the necessity for excessively long antennas.", "The process of using an audio signal to modulate the frequency of a higher \"carrier signal\" was developed primarily to reduce the necessity for excessively long antennas.", "Information to be conveyed RF source Modulation Transmitter Channel (frequency range) Receiver Demodulation Audio Amplifiers", "Wavelength Formula n System Composition Narrow Band FM Single Side-Band Independent Side-Band"], "jumps": ["P1200", "P1180"]}, {"id": "P1180", "text": ["One way of thinking about modulation is as the process of altering some characteristic of a frequency (the carrier) as a direct response of another signal.  In the case of AM, FM, CB, NBFM or SSB, the audio signal.", "One way of thinking about modulation is as the process of altering some characteristic of a frequency (the carrier) as a direct response of another signal. In the case of AM, FM, CB, NBFM or SSB, the audio signal."], "jumps": ["P1190", "P1170"]}, {"id": "P1170", "text": ["The transmission and reception (through a wireless medium) of any information requires superimposing the waveform onto an RF carrier.  This \"modulates\" the carrier signal.", "As mentioned, the first requirement for a communications system is to have information or some form of intelligence to be conveyed.  This might be in the form of voice, music, or coded signal.  In communications, the terms \"information\", \"intelligence\", and \"data\" are synonymous.", "The transmission and reception (through a wireless medium) of any information requires superimposing the waveform onto an RF carrier. This \"modulates\" the carrier signal.", "As mentioned, the first requirement for a communications system is to have information or some form of intelligence to be conveyed. This might be in the form of voice, music, or coded signal. In communications, the terms \"information\", \"intelligence\", and \"data\" are synonymous."], "jumps": ["P1180", "P1160", "P1170", "P1130"]}, {"id": "P1150", "text": ["For example, AM broadcasts use 535 to 1605 kHz, while FM broadcasts are assigned at 88 to 108 MHz.  Without this assignment, the airwaves would become a whirlpool of sound, mostly unintelligible, overlapping one another.", "For example, AM broadcasts use 535 to 1605 kHz, while FM broadcasts are assigned at 88 to 108 MHz. Without this assignment, the airwaves would become a whirlpool of sound, mostly unintelligible, overlapping one another."], "jumps": ["P1160", "P1130"]}, {"id": "P1140", "text": ["Within the radio frequency range, certain bands have been assigned for particular applications."], "jumps": ["P1150", "P1130"]}, {"id": "P1130", "text": ["The most commonly used radio frequencies (RF) range from \n30 kHz to 30 GHz.  Some even lower frequencies are used in sonar and submarine communications, while some higher frequencies are used in weather radar and secure government communications.", "The most commonly used radio frequencies (RF) range from 30 kHz to 30 GHz. Some even lower frequencies are used in sonar and submarine communications, while some higher frequencies are used in weather radar and secure government communications."], "jumps": ["P1140", "P1110"]}, {"id": "P1120", "text": ["The waves that can be detected by the human ear (approximately 16Hz to 16 kHz) are considered audio frequencies (AF).  Before we can hear these frequencies they must first be converted to sound waves.", "The waves that can be detected by the human ear (approximately 16Hz to 16 kHz) are considered audio frequencies (AF). Before we can hear these frequencies they must first be converted to sound waves."], "jumps": ["P1130", "P1110"]}, {"id": "P1110", "text": ["The frequency spectrum exists all around us in the form of electromagnetic waves that range in the frequency of 1 Hz on up to many Gigahertz.", "Speed of Light Wavelength = Frequency"], "jumps": ["P1120", "P1100"]}, {"id": "P1100", "text": ["One very important fundamental is understanding the terminology associated with radio frequency and receiver or transmitter equipment."], "jumps": ["P1110", "P1080"]}, {"id": "P1090", "text": ["While an understanding of electronics is indispensable, processing communication fundamentals is necessary for any effective radio maintenance operations."], "jumps": ["P1100", "P1080"]}, {"id": "P1080", "text": ["Specific parameters and characteristics must be understood when undertaking the task of servicing communications equipment.", "Frequency? Sensitivity? Heterodyning? Selectivity? mmmm...", "Sensitivity? Heterodyning? Selectivity? ctivity? mmmm...", "Heterodyning? Selectivity? rodyning? Selectivity? mmmm...#", "Selectivity? nsitivity? Heterodyning? Selectivity? mmmm..."], "jumps": ["P1090", "P1070"]}, {"id": "P1070", "text": ["CB (Citizen Band) radios have both a receiver and a transmitter in one chassis.  These are sometimes refer let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
