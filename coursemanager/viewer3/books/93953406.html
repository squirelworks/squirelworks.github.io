et the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P3080"]}, {"id": "P3080", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P3040"]}, {"id": "P3070", "text": ["Q1 is a 2N5484 N channel FET.  It has a Gm of 2 mmhos.  Let's start the experiment.", "Q1 is a 2N5484 N channel FET. It has a Gm of 2 mmhos. Let's start the experiment."], "jumps": ["P3040"]}, {"id": "P3060", "text": ["Note, the input is applied through a voltage divider (R1 and R2) which reduces the input voltage from the function generator."], "jumps": ["P3040"]}, {"id": "P3050", "text": ["Compare the components on PC130- 49 to the schematic shown."], "jumps": ["P3040"]}, {"id": "P3040", "text": ["Pick up the PC130-49 card. This card  demonstrates the operation of a common source FET amplifier circuit.", "Pick up the PC130-49 card. This card demonstrates the operation of a common source FET amplifier circuit.uit."], "jumps": ["P3020"]}, {"id": "P3020", "text": ["The purpose of this experiment is to check the normal operation of a common source FET amplifier circuit."], "jumps": ["P3040", "P3001"]}, {"id": "P3001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.nu."], "jumps": ["P2001", "P2980"]}, {"id": "P2980", "text": ["6.  Normal operation is determined by comparing measured Av          with calculated Av.  If Gm is not known, use 2 mmhos.", "6. Normal operation is determined by comparing measured Av with calculated Av. If Gm is not known, use 2 mmhos.", "1 Vpp = 8 Calculated Av Gm x Rd .002 x 4000 80000000000000"], "jumps": ["P2999", "P2950"]}, {"id": "P2960", "text": ["5.  Common source FET amps produce an amplified inverted              output signal.", "5. Common source FET amps produce an amplified inverted output signal."], "jumps": ["P2980", "P2950"]}, {"id": "P2950", "text": ["4.  A typical common source FET amp uses self biasing to                   establish the operating voltages.", "4. A typical common source FET amp uses self biasing to establish the operating voltages..."], "jumps": ["P2960", "P2930"]}, {"id": "P2940", "text": ["3.  The common gate FET is normally used as a switch.  It does           not have a high input resistance.", "3. The common gate FET is normally used as a switch. It does not have a high input resistance.."], "jumps": ["P2950", "P2930"]}, {"id": "P2930", "text": ["2.  The common source and common drain FETs are normally             used as amplifiers.  The common source amp inverts the                 output.", "2. The common source and common drain FETs are normally used as amplifiers. The common source amp inverts the output..."], "jumps": ["P2940", "P2920"]}, {"id": "P2920", "text": ["1.  FETs can replace bipolar transistors.  FETs are normally used       when extremely high input resistances are required in an                amplifier.", "1. FETs can replace bipolar transistors. FETs are normally used when extremely high input resistances are required in an amplifier..."], "jumps": ["P2930", "P2001"]}, {"id": "P2910", "text": ["This completes the information on FET AMPLIFIERS.", "This completes the information on FET AMPLIFIERS.LE........"], "jumps": ["P2001", "P2410"]}, {"id": "P2415", "text": ["CHECKING FOR NORMAL OPERATION - Compare calculated gain to measured gain. Measured Av is within", "10% of calculated Av for normal operation.", "Einput Calculated Av = Gm x Rd 02 x 4000 8"], "jumps": []}, {"id": "P2412", "text": ["Notice that the measured gain is 25% lower than the calculated gain.", ".5 Vpp = 30 Calculated Av Gm x Rd .005 x 8000 40000000000"], "jumps": []}, {"id": "P2411", "text": [], "jumps": []}, {"id": "P2410", "text": ["Is this common source FET amplifier operating normally?", "Is this common source FET amplifier operating normally?...."], "jumps": ["P2360", "P2415"]}, {"id": "P2400", "text": ["For example, this circuit's measured Av equals the calculated Av. The circuit is operating normally.", "Av Gm x Rd .002 x 4000 8", "1 Vpp = 88888888888", "Calculated Av Gm x Rd .002 x 4000 8"], "jumps": ["P2410", "P2360"]}, {"id": "P2390", "text": ["If Gm is not known, use 2 mmhos. This gives an approximate voltage gain value for checking normal operation."], "jumps": ["P2400", "P2360"]}, {"id": "P2380", "text": ["Calculated Av is found by multiplying Gm by the drain resistor."], "jumps": ["P2390", "P2360"]}, {"id": "P2370", "text": ["Measured Av is found using this formula with peak-to-peak or RMS values.", "Eoutput Measured Av = Einputttt"], "jumps": ["P2380", "P2360"]}, {"id": "P2360", "text": ["Checking for normal operation of a FET common source amplifier requires comparing the calculated and measured voltage gain (Av)."], "jumps": ["P2370", "P2350"]}, {"id": "P2353", "text": ["When Id increases, the voltage drop across R2 increases.  Drain voltage will not stay the same.", "When Id increases, the voltage drop across R2 increases. Drain voltage will not stay the same."], "jumps": []}, {"id": "P2352", "text": ["When Id increases, the voltage drop across R2 increases.  Drain voltage will not increase.", "When Id increases, the voltage drop across R2 increases. Drain voltage will not increase."], "jumps": []}, {"id": "P2351", "text": [], "jumps": []}, {"id": "P2350", "text": ["An increase in Id causes the drain voltage to _______", "An increase in Id causes the drain voltage to _______......"], "jumps": ["P2340", "P2352", "P2353"]}, {"id": "P2343", "text": ["Increasing positive voltage on the gate decreases the reverse bias between the gate and source. Source to drain current will not stay the same.", "Increasing positive voltage on the gate decreases the reverse bias between the gate and source. Drain to source current will not stay the same.", "\"Increasing positive voltage on the gate decreases"], "jumps": []}, {"id": "P2342", "text": ["An increase in positive voltage on the gate decreases the reverse bias between the gate and source. Source to drain current will not decrease."], "jumps": []}, {"id": "P2341", "text": [], "jumps": []}, {"id": "P2340", "text": ["On the positive alternation of an input signal, Id _______", "On the positive alternation of an input signal, Id _______."], "jumps": ["P2272", "P2343", "P2342"]}, {"id": "P2330", "text": ["A small AC input voltage controlled a larger output current producing an amplified inverted AC signal."], "jumps": ["P2340", "P2272"]}, {"id": "P2320", "text": ["C3 blocks the DC drain voltage producing a positive alternation."], "jumps": ["P2330", "P2272"]}, {"id": "P2310", "text": ["When Vgs is increased, the source to drain current is decreased. The reduced voltage drop across R2 raises the drain voltage.", "When Vgs is increased, the drain to source current is decreased. The reduced voltage drop across R2 raises the drain voltage.", "decreased. The reduced voltage drop across R2 raises"], "jumps": ["P2320", "P2272"]}, {"id": "P2300", "text": ["When the input signal on the gate goes negative, Vgs is increased, and Vs remains constant."], "jumps": ["P2310", "P2272"]}, {"id": "P2290", "text": ["C3 (output coupling capacitor) blocks the DC voltage on the drain. The output is a negative alternation."], "jumps": ["P2300", "P2272"]}, {"id": "P2280", "text": ["The decrease in Vgs increases source to drain current. The increase in current causes R2 to drop more voltage decreasing the drain voltage (Vd).", "The decrease in Vgs increases drain to source current. The increase in current causes R2 to drop more voltage decreasing the drain voltage (Vd)."], "jumps": ["P2290", "P2272"]}, {"id": "P2275", "text": ["GATE SOURCE BIASING - When the difference between gate and source voltage (reverse bias) increases, drain current decreases."], "jumps": []}, {"id": "P2272", "text": ["The increase in gate voltage decreases the reverse bias (Vgs).  Source voltage (Vs) remains at a positive level by the action of C2.", "The increase in gate voltage decreases the reverse bias (Vgs). Source voltage (Vs) remains at a positive level by the action of C2."], "jumps": ["P2280", "P2240", "P2275"]}, {"id": "P2270", "text": ["The increase in gate voltage decreases the reverse bias (Vgs). Source voltage (Vs) remains at a positive level by the action of C2."], "jumps": ["P2280", "P2240", "P2275"]}, {"id": "P2260", "text": ["As the input signal goes positive the gate voltage (Vg) increases."], "jumps": ["P2270", "P2240"]}, {"id": "P2250", "text": ["The AC input signal is coupled across C1 (input coupling capacitor) to the gate of Q1."], "jumps": ["P2260", "P2240"]}, {"id": "P2240", "text": ["Applying an AC input signal produces an amplified inverted AC output signal. Let's see how."], "jumps": ["P2250", "P2232"]}, {"id": "P2235", "text": ["SELF BIASING - If temperature causes a change in current, the voltage across R3 changes. This alters the reverse bias between the gate and the source in order to regulate drain to source current flow.", "SELF BIASING - If temperature causes a change in current, the voltage across R3 changes. This alters the reverse bias between the gate and the source in order to regulate source to drain current flow.", "p in order to regulate source to drain current flow."], "jumps": []}, {"id": "P2232", "text": ["The FET is biased for normal operation.  Since self biasing is used, temperature changes do not effect source to drain current flow.", "The FET is biased for normal operation. Since self biasing is used, temperature changes do not effect drain to source current flow.", "The FET is biased for normal operation. Since self biasing is used, temperature changes do not effect source to drain current flow."], "jumps": ["P2240", "P2160", "P2235"]}, {"id": "P2230", "text": ["The FET is biased for normal operation.  Since self biasing is used, temperature changes do not effect source to drain current flow.", "The FET is biased for normal operation. Since self biasing is used, temperature changes do not effect drain to source current flow.", "The FET is biased for normal operation. Since self biasing is used, temperature changes do not effect source to drain current flow."], "jumps": ["P2240", "P2160", "P2235"]}, {"id": "P2220", "text": ["With no bias voltage applied to the gate (0 V) and the source at a positive voltage, the gate to source PN junction is reverse biased.  Vgs is a negative value.", "With no bias voltage applied to the gate (0 V) and the source at a positive voltage, the gate to source PN junction is reverse biased. Vgs is a negative value."], "jumps": ["P2230", "P2160"]}, {"id": "P2210", "text": ["C2 grounds AC signals on the source. This allows only an AC signal on the gate to control current flow."], "jumps": ["P2220", "P2160"]}, {"id": "P2200", "text": ["The current flow from the source to the drain causes a voltage drop across R3 that applies a positive voltage on the source.", "The current flow from the drain to the source causes a voltage drop across R3 that applies a positive voltage on the source.", "source causes a voltage drop across R3 that applies a positive", "The current flow from the source to the drain causes a voltage drop across R3 that applies a positive voltage on the source.q"], "jumps": ["P2210", "P2160"]}, {"id": "P2190", "text": ["+Vdd applies a positive voltage on the drain of Q1. This establishes current flow through the FET."], "jumps": ["P2200", "P2160"]}, {"id": "P2180", "text": ["The biasing is accomplished by self biasing."], "jumps": ["P2190", "P2160"]}, {"id": "P2170", "text": ["Q1 is an N channel JFET. For proper operation, the drain needs a positive voltage and the gate to source elements are reverse biased."], "jumps": ["P2180", "P2160"]}, {"id": "P2160", "text": ["This is a typical common source FET amplifier circuit.", "This is a typical common source FET amplifier circuit......"], "jumps": ["P2170", "P2150"]}, {"id": "P2150", "text": ["The most widely used FET amp is the common source.  Let's look at the operation of a common source FET amplifier.", "The most widely used FET amp is the common source. Let's look at the operation of a common source FET amplifier."], "jumps": ["P2160", "P2140"]}, {"id": "P2142", "text": ["A common source FET amp has the input applied to the gate and the output taken from the drain."], "jumps": []}, {"id": "P2141", "text": [], "jumps": []}, {"id": "P2140", "text": ["What type of configuration is this FET amplifier?", "What type of configuration is this FET amplifier?.........."], "jumps": ["P2130"]}, {"id": "P2133", "text": ["A common gate FET amplifier has the input applied to the source and the output taken from the drain."], "jumps": []}, {"id": "P2132", "text": ["A common drain FET amp has the input applied to the gate and the output taken from the source."], "jumps": []}, {"id": "P2131", "text": [], "jumps": []}, {"id": "P2130", "text": ["What type of configuration is this FET amplifier?", "What type of configuration is this FET amplifier?.........."], "jumps": ["P2080"]}, {"id": "P2120", "text": ["Common gate FETs are used as electronic switches. The gate controls the current flow from the source to the drain.", "Common gate FETs are used as electronic switches. The gate controls the current flow from the drain to the source."], "jumps": ["P2130", "P2080"]}, {"id": "P2110", "text": ["The common gate FET is not normally used as an amplifier because it does not have an extremely high input resistance."], "jumps": ["P2120", "P2080"]}, {"id": "P2100", "text": ["The difference between the two circuits is that the common source amp inverts the output."], "jumps": ["P2110", "P2080"]}, {"id": "P2090", "text": ["The common source and common drain amplifiers have the input applied to the gate."], "jumps": ["P2100", "P2080"]}, {"id": "P2080", "text": ["There are three configurations of FET amplifiers.", "There are three configurations of FET amplifiers..........."], "jumps": ["P2090", "P2020"]}, {"id": "P2070", "text": ["The input resistance prevents the test equipment from loading the circuit.", "INPUT RESISTANCE Bipolar FET 10 to 50 k 10 to 100 M"], "jumps": ["P2080", "P2020"]}, {"id": "P2060", "text": ["The high input resistance makes FET amplifiers well suited for use in test equipment.", "INPUT RESISTANCE Bipolar FET 10 to 50 k 10 to 100 M"], "jumps": ["P2070", "P2020"]}, {"id": "P2050", "text": ["The extremely high input resistance of a FET is obtained by applying the input to the reverse biased gate.", "INPUT RESISTANCE Bipolar FET 10 to 50 k 10 to 100 M"], "jumps": ["P2060", "P2020"]}, {"id": "P2040", "text": ["The primary difference between a FET amplifier and a bipolar transistor amplifier is the input resistance.", "INPUT RESISTANCE Bipolar FET 10 to 50 k 10 to 100 M-"], "jumps": ["P2050", "P2020"]}, {"id": "P2030", "text": ["The most common application of a FET is an amplifier."], "jumps": ["P2040", "P2020"]}, {"id": "P2020", "text": ["Field effect transistors may be used in place of bipolar transistors in any type of circuit."], "jumps": ["P2030", "P2001"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.nu."], "jumps": ["P1001", "P1980"]}, {"id": "P1980", "text": ["7.  FETs are biased in many ways.  Biasing does two things:", "7. FETs are biased in many ways. Biasing does two things:", "1. Place a positive voltage on the drain to establish current flow. 2. Reverse bias the source to gate PN junction to control current flow....."], "jumps": ["P1999", "P1970"]}, {"id": "P1970", "text": ["6.  Transconductance is the measure of how much control the            input voltage has on the output current and is measured in             mhos.", "6. Transconductance is the measure of how much control the input voltage has on the output current and is measured in mhos.", "Ioutput Gm = Einputtttttticonductor material and can have four elements."], "jumps": ["P1980", "P1960"]}, {"id": "P1960", "text": ["5.  Increasing the reverse bias Vgs decreases Id.  Decreasing the       reverse bias Vgs increases Id.", "5. Increasing the reverse bias Vgs decreases Id. Decreasing the reverse bias Vgs increases Id."], "jumps": ["P1970", "P1950"]}, {"id": "P1950", "text": ["4.  N channel FETs operate by placing a positive voltage on the          drain and reverse biasing the gate to source PN junction.", "4. N channel FETs operate by placing a positive voltage on the drain and reverse biasing the gate to source PN junction."], "jumps": ["P1960", "P1940"]}, {"id": "P1940", "text": ["3.  The gate forms a channel between the source and drain. The amount of current flow is determined by the PN junction barrier size.", "3. The gate forms a channel between the source and drain. The amount of current flow is determined by the PN junction barrier size..", "3. The gate forms a channel between the drain and the source. The amount of current flow is determined by the PN junction barrier size.", "The gate forms a channel between the drain", "3. The gate forms a channel between the source and drain. The amount of current flow is determined by the PN junction barrier size.. barrier size.ier size."], "jumps": ["P1950", "P1920"]}, {"id": "P1930", "text": ["2.  Electrons enter the FET from the source and leave from the drain.  The gate controls electron flow.", "2. Positive charges enter the FET from the drain and leave from the source. The gate controls positive charge flow.", "2. Electrons enter the FET from the source and leave from the drain. The gate controls electron flow.", "2. Electrons enter the FET from the source and leave from the drain. The gate controls electron flow..n flow....."], "jumps": ["P1940", "P1920"]}, {"id": "P1920", "text": ["1.  Field effect transistors have three elements. The arrow on the        gate indicates the type of FET.", "1. Field effect transistors have three elements. The arrow on the gate indicates the type of FET."], "jumps": ["P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on FIELD EFFECT TRANSISTORS.", "This completes the information on FIELD EFFECT TRANSISTORS..."], "jumps": ["P1001", "P1470"]}, {"id": "P1473", "text": ["Self biasing uses one resistor on the gate.", "Self biasing uses one resistor on the gate................."], "jumps": []}, {"id": "P1472", "text": ["Gate biasing applies a negative voltage on the gate.", "Gate biasing applies a negative voltage on the gate........"], "jumps": []}, {"id": "P1471", "text": [], "jumps": []}, {"id": "P1470", "text": ["What type of biasing is used with this FET?", "What type of biasing is used with this FET?................"], "jumps": ["P1450"]}, {"id": "P1460", "text": ["-Vss sets up the reverse bias between the gate and source.", "-Vss sets up the reverse bias between the gate and source.m"], "jumps": ["P1470", "P1450"]}, {"id": "P1450", "text": ["Source biasing uses two voltage sources. Vdd applies a positive voltage on the drain through Rd."], "jumps": ["P1460", "P1430"]}, {"id": "P1440", "text": ["R1 and R2 form a fixed bias and apply a small positive voltage on the gate. Rs applies self biasing.", "R1 and R2 form a fixed bias and apply a small positive voltage on the gate. Rs applies self biasing..."], "jumps": ["P1450", "P1430"]}, {"id": "P1430", "text": ["Voltage divider bias also uses one voltage source. Vdd applies a positive voltage on the drain through Rd."], "jumps": ["P1440", "P1410"]}, {"id": "P1420", "text": ["The voltage drop across Rs sets up the reverse bias between the gate and source. Remember, the gate is less positive (more negative) than the source."], "jumps": ["P1430", "P1410"]}, {"id": "P1410", "text": ["Self-biasing uses one voltage source. Vdd applies a positive voltage on the drain through Rd."], "jumps": ["P1420", "P1390"]}, {"id": "P1400", "text": ["Gate biasing does not produce a stable operating point and is not normally used."], "jumps": ["P1410", "P1390"]}, {"id": "P1390", "text": ["Gate biasing uses two voltage sources.  Vdd applies the positive voltage on the drain and Vgg applies a negative voltage on the gate.", "Gate biasing uses two voltage sources. Vdd applies the positive voltage on the drain and Vgg applies a negative voltage on the gate."], "jumps": ["P1400", "P1370"]}, {"id": "P1380", "text": ["There are many ways to bias a FET for correct operation.  All FET biasing techniques accomplish two things:", "There are many ways to bias a FET for correct operation. All FET biasing techniques accomplish two things:", "1. Place a positive voltage on the drain to establish current flow. 2. Reverse bias the source to gate PN junction to control current flow....."], "jumps": ["P1390", "P1370"]}, {"id": "P1370", "text": ["For correct operation of the FET, it must be biased.   Biasing is similar to bipolar transistor biasing.", "For correct operation of the FET, it must be biased. Biasing is similar to bipolar transistor biasing."], "jumps": ["P1380", "P1360"]}, {"id": "P1362", "text": ["Your calculations are incorrect. Remember:", "Your calculations are incorrect. Remember:.................", "Einput, Ioutput = Gm x Einput Ioutput = .008 mho x 2 V Ioutput = .008 x 2 = ? mAAAAAAAAAAAAAAA"], "jumps": []}, {"id": "P1361", "text": [], "jumps": []}, {"id": "P1360", "text": ["What is the current change for a FET that has a Gm of 8 mmhos and a 2 V change in input voltage?  \nRemember, Gm = Ioutput \u00f7 Einput.", "What is the current change for a FET that has a Gm of 8 mmhos and a 2 V change in input voltage? Remember, Gm = Ioutput"], "jumps": ["P1320"]}, {"id": "P1350", "text": ["For example, a 2N5451 FET has a Gm of 2 mmhos. This indicates that a 1 V change in input voltage produces a 2 mA change in output current.", "Einput, Ioutput = Gm x Einput Ioutput = .002 x 1 = .002 x 1 = .002 A = 2 mA............................................................"], "jumps": ["P1360", "P1320"]}, {"id": "P1340", "text": ["Transconductance is similar to a bipolar transistor's beta. Values range between 1 and 10 milli mhos(mmhos) as listed in transistor reference books."], "jumps": ["P1350", "P1320"]}, {"id": "P1335", "text": ["FETs transfer conductance from the input to the output. Recall that transistors transfer resistance from the input to the output."], "jumps": ["P1340", "P1320"]}, {"id": "P1330", "text": ["The word transconductance comes from trans referring to the transfer from input to output and conductance which is the opposite of resistance.", "I ohm ohm............................................................................................................................"], "jumps": ["P1335", "P1320"]}, {"id": "P1325", "text": ["MHO - Mho is the name given for a unit of conductance. Mho is ohm backwards to demonstrate that conductance is opposite resistance. The term siemens (S) is also used instead of Mho."], "jumps": []}, {"id": "P1320", "text": ["The amount of control that the input voltage has over the output current is referred to as transconductance (Gm) and is measured in mhos."], "jumps": ["P1330", "P1310"]}, {"id": "P1313", "text": ["Saturation means the PN junction barrier is at minimum and current flow is constant.  Notice, this FET has closed the channel and stopped current flow.", "Saturation means the PN junction barrier is at minimum and current flow is constant. Notice, this FET has closed the channel and stopped current flow."], "jumps": []}, {"id": "P1312", "text": ["Class A operation allows current flow.  Notice that the PN junction barrier in this FET has closed the channel and stopped current flow.", "Class A operation allows current flow. Notice that the PN junction barrier in this FET has closed the channel and stopped current flow."], "jumps": []}, {"id": "P1311", "text": [], "jumps": []}, {"id": "P1310", "text": ["This FET is at _______", "This FET is at _______on is typed.........................."], "jumps": ["P1300"]}, {"id": "P1303", "text": ["If Vgs is increased, the PN junction barrier increases which does not increase source to drain current.", "If Vgs is increased, the PN junction barrier increases which does not increase drain to source current.", "increased, the PN junction barrier increases which does"], "jumps": []}, {"id": "P1302", "text": ["Id only remains constant when the FET is in saturation. When biased in the center of its operating area, a change in Vgs changes Id."], "jumps": []}, {"id": "P1301", "text": [], "jumps": []}, {"id": "P1300", "text": ["With a FET biased in the center of its operating area, when Vgs is increased, Id _______"], "jumps": ["P1260"]}, {"id": "P1290", "text": ["A FET is biased to operate:\n                                       Mid Point         -  Class A \n                                       At Cutoff          -  Class B                                                                               Below Cutoff  -  Class C", "A FET is biased to operate: Mid Point - Class A At Cutoff - Class B Below Cutoff - Class C"], "jumps": ["P1300", "P1260"]}, {"id": "P1280", "text": ["When the negative bias voltage is too small, the PN junction barrier no longer decreases causing current flow to remain constant (saturation)."], "jumps": ["P1290", "P1260"]}, {"id": "P1270", "text": ["When the negative bias voltage is too large, the PN junction barrier increases to a point that causes current flow to stop (cutoff)."], "jumps": ["P1280", "P1260"]}, {"id": "P1265", "text": ["For a one volt change in gate voltage, a 2 mA change in drain current is produced."], "jumps": ["P1270", "P1260"]}, {"id": "P1260", "text": ["FETs operate by a small reverse bias voltage (Vgs) controlling a large source to drain current flow (Id)..", "FETs operate by a small reverse bias voltage (Vgs) controlling a large drain to source current flow (Id).."], "jumps": ["P1265", "P1220"]}, {"id": "P1250", "text": ["Forward biasing damages the component.  FETs are made to operate only when the PN junction is reverse biased.", "Forward biasing damages the component. FETs are made to operate only when the PN junction is reverse biased."], "jumps": ["P1260", "P1220"]}, {"id": "P1230", "text": ["A small negative gate voltage decreases the junction barrier to a point where it no longer decreases in size. Current flow remains constant. This is JFET saturation."], "jumps": ["P1250", "P1220"]}, {"id": "P1220", "text": ["Decreasing the negative gate voltage decreases the PN junction barrier which increases source to drain current.", "Decreasing the negative gate voltage decreases the PN junction barrier which increases drain to source current.", "\"Decreasing the negative gate voltage decreases", "!PN junction barrier which increases drain"], "jumps": ["P1230", "P1182"]}, {"id": "P1210", "text": ["A large negative gate voltage increases the junction barrier to a point where current flow stops. This is JFET cutoff."], "jumps": ["P1220", "P1182"]}, {"id": "P1200", "text": ["Increasing the negative gate voltage (Vgg) increases the PN junction barrier which decreases source to drain current.", "Increasing the negative gate voltage (Vgg) increases the PN junction barrier which decreases drain to source current.", "\"Increasing the negative gate voltage (Vgg) increases", "'PN junction barrier which decreases source"], "jumps": ["P1210", "P1182"]}, {"id": "P1190", "text": ["The size of the junction barrier limits the amount of electrons that flow from the source to the drain.", "The size of the junction barrier limits the amount of electrons that flow from the drain to the source."], "jumps": ["P1200", "P1182"]}, {"id": "P1185", "text": ["PN JUNCTION - The PN junction barrier is caused by the negative voltage on the P material gate. Just like in a diode, a reverse biased PN junction sets up a junction barrier."], "jumps": []}, {"id": "P1182", "text": ["A negative bias voltage (Vgg) is applied to the gate. This reverse biases the PN junction forming a junction barrier."], "jumps": ["P1190", "P1172", "P1185"]}, {"id": "P1180", "text": ["A negative bias voltage (Vgg) is applied to the gate. This reverse biases the PN junction forming a junction barrier."], "jumps": ["P1190", "P1172", "P1185"]}, {"id": "P1175", "text": ["CURRENT FLOW - The positive voltage on the drain attracts the free electrons in the N type material while the negative voltage on the source repels electrons. The combined effect is the current flow through the semiconductor from source to drain.", "CURRENT FLOW - The positive voltage on the drain repels positive charges in the N type material while the negative voltage on the source attracts them. The combined effect is the current flow through the semiconductor from drain to source."], "jumps": []}, {"id": "P1172", "text": ["A positive bias voltage (Vdd) is applied to the drain. This produces current flow."], "jumps": ["P1180", "P1160", "P1175"]}, {"id": "P1170", "text": ["A positive bias voltage (Vdd) is applied to the drain. This produces current flow."], "jumps": ["P1180", "P1160", "P1175"]}, {"id": "P1160", "text": ["Let's discuss the operation of N channel JFETs.", "Let's discuss the operation of N channel JFETs.............", "NOTE: The only difference between N and P channel JFET operation is the polarity of the bias voltages and current flow.............."], "jumps": ["P1170", "P1150"]}, {"id": "P1153", "text": ["PNP is a type of bipolar transistor. JFETs contain both P material and N material, but they are classified as P Channel or N Channel."], "jumps": []}, {"id": "P1152", "text": ["P Channel JFETs have a channel of P material between two N material islands."], "jumps": []}, {"id": "P1151", "text": [], "jumps": []}, {"id": "P1150", "text": ["Wh let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
