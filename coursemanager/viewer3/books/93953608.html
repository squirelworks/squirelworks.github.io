const book = {"title": "93953608", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: SCHMITT TRIGGER TROUBLESHOOTING EXPERIMENTf sadf"], "jumps": []}, {"id": "P10", "text": ["SCHMITT TRIGGER TROUBLESHOOTING EXPERIMENT"], "jumps": []}, {"id": "P100", "text": ["w Recognize that a Schmitt trigger is faulted. w Identify the faulted component in a Schmitt trigger......", "w Describe typical faults in Schmitt trigger circuits. w Describe Schmitt trigger troubleshooting procedures.............."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 480, 488 or Equivalent XXXXXnt"], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson you will learn about troubleshooting Schmitt Triggers."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["The troubleshooting procedures for a Schmitt trigger are not much different from the procedures used to troubleshoot most other transistor circuits."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Schmitt Triggers have relatively few components.  This makes troubleshooting easy as compared to other circuits.", "Schmitt Triggers have relatively few components. This makes troubleshooting easy as compared to other circuits."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["An incorrect waveform indicates that the circuit is faulted."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Check the output signal, input signal, Vcc, the transistors, and circuit resistances."], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["Let's begin the lesson on SCHMITT TRIGGER TROUBLESHOOTING EXPERIMENT........"], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Schmitt Triggers produce an output pulse any time the upper threshold level is exceeded by the input signal."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Although they are often used to change irregular wave shapes into clean pulses, troubleshooting is easier with a symmetrical waveform applied."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The input signal must be greater at some point than the threshold of the circuit.  If the output is a constant high or low, a fault may exist.", "The input signal must be greater at some point than the threshold of the circuit. If the output is a constant high or low, a fault may exist."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["If the output is incorrect and you suspect the circuit is faulted, check the input amplitude."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["If the input amplitude does periodically exceed the upper threshold level and the output is incorrect, a problem exists."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["Once you have measured the input of the circuit and determined it to be correct, measure Vcc to ensure correct supply voltage."], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["If Vcc checks good, the next step is to check the transistors in the circuit."], "jumps": ["P1090", "P1020"]}, {"id": "P1090", "text": ["og ohmmeter or a diode junctishould be made with the input signal and Vcc disconnected (zero).", "Transistor checks with an analog ohmmeter or a diode junction tester should be made with the input signal and Vcc disconnected (zero)."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["The Base-to-Emitter and Base-to-Collector junctions should read a high reading for one lead polarity and low reading for the other. It doesn't matter if an an", "The Base-to-Emitter and Base-to-Collector junctions should read a high reading for one lead polarity and low reading for the other. It doesn't matter if an an)", "The Base-to-Emitter and Base-to-Collector junctions should read a high reading for one lead polarity and low reading for the other. An analog ohmmeter will show resistance flowing in one direction only. A diode junction tester will indicate current flow in only one direction."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["If both transistors check good, the next step is to measure the circuit resistances with an ohmmeter.  A digital ohmmeter is p", "If both transistors check good, the next step is to measure the circuit resistances with an ohmmeter. A digital ohmmeter is p", "If both transistors check good, the next step is to measure the circuit resistances with an ohmmeter. A digital ohmmeter is preferred as it lacks sufficient voltage to forward bias a transistor junction. But an analog ohmmeter can be used if the leads are positioned to reverse bias the junction. Just reverse the leads if an erroneous reading is displayed."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["With Vcc and the input still disconnected, measure from the Vcc input across the circuit resistances."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["Individual circuit resistances may also need to be made such as R6, R2, etc.  This step of troubleshooting is a skill that becomes better with practice.", "Individual circuit resistances may also need to be made such as R6, R2, etc. This step of troubleshooting is a skill that becomes better with practice."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["Sometimes, multiple current paths make resistance measurements difficult."], "jumps": ["P1150", "P1110"]}, {"id": "P1150", "text": ["A digital multimeter helps to ensure that semiconductor components are not forward biased, causing erroneous resistance measurements."], "jumps": ["P1160", "P1110"]}, {"id": "P1160", "text": ["Resistance measurements help to identify shorted or open components."], "jumps": ["P1170", "P1110"]}, {"id": "P1170", "text": ["Is this Schmitt Trigger functioning correctly?", "Is this Schmitt Trigger functioning correctly?............."], "jumps": ["P1110"]}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1172", "text": ["The input exceeds the upper threshold level twice.  The Schmitt Trigger should produce two square wave output pulses.", "The input exceeds the upper threshold level twice. The Schmitt Trigger should produce two square wave output pulses."], "jumps": []}, {"id": "P1180", "text": ["Use this troubleshooting method as a guide to help you troubleshoot Schmitt Trigger circuits.", "1. Output 2. Input 3. Vcc 4. Transistors 5. Circuit Resistances"], "jumps": ["P1185", "P1170"]}, {"id": "P1185", "text": ["This is not the only method.  You may develop your own techniques as you become a proficient troubleshooter.", "This is not the only method. You may develop your own techniques as you become a proficient troubleshooter."], "jumps": ["P1910", "P1180"]}, {"id": "P1910", "text": ["This completes the information on SCHMITT TRIGGER FAULTS.", "This completes the information on SCHMITT TRIGGER FAULTS..."], "jumps": ["P1001", "P1180"]}, {"id": "P1920", "text": ["1.  A Schmitt Trigger is faulted when the output is a constant               high or low and the input exceeds the threshold.", "1. A Schmitt Trigger is faulted when the output is a constant high or low and the input exceeds the threshold."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  If a fault is suspected, check the input to ensure it periodically       exceeds the threshold.", "2. If a fault is suspected, check the input to ensure it periodically exceeds the threshold."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  If the input is correct, check Vcc to ensure proper supply                voltage.", "3. If the input is correct, check Vcc to ensure proper supply voltage."], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["4.  Then perform junction tests of the transistors with an analog         ohmmeter or digit.", "4. Then perform junction tests of the transistors with an analog ohmmeter or digit.", "4. Then perform junction tests of the transistors with an analog ohmmeter or digital junction tester."], "jumps": ["P1960", "P1920"]}, {"id": "P1960", "text": ["5.  If the transistors check good, measure circuit resistances with      a muldigital meter.", "5. If the transistors check good, measure circuit resistances with a muldigital meter.", "5. If the transistors check good, measure circuit resistances with a multimeter........."], "jumps": ["P1999", "P1950"]}, {"id": "P1999", "text": ["You have completed the Summary.  You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1960"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["The purpose of this experiment is to demonstrate troubleshooting Schmitt trigger circuits."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["Pick up the PC130-47N card.  This card is used to demonstrate typical faults in a Schmitt Trigger.", "Pick up the PC130-47N card. This card is used to demonstrate typical faults in a Schmitt Trigger."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["Compare the card with the schematic shown."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["R3 adjusts the bias for Q2, effectively varying the upper threshold level."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["R1 and R10 are voltage dividers which also determine the upper threshold level."], "jumps": ["P2080", "P2050"]}, {"id": "P2080", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2050"]}, {"id": "P2090", "text": ["2.  Carefully plug PC130-47N into the Test Console PC1 position.  3.  Place PC130-47N R3 to the mid position (arrow up).", "2. Carefully plug PC130-47N into the Test Console PC1 position. 3. Place PC130-47N R3 to the mid position (arrow up). External program = SCAN FTR 0 C1 00............................."], "jumps": ["P2080", "P2095"]}, {"id": "P2095", "text": ["MEASUREMENT SETUP - Carefully turn R3 to mid position (arrow up)."], "jumps": []}, {"id": "P2100", "text": ["4.  Set the Voltmeter switch to Positive.  Set the Positive Supply          Voltage to 12. The Test Console's voltage meter should                   indicate 12 volts.\n5.  Turn PC1 DC Power switch to ON.", "4. Set the Voltmeter switch to Positive. Set the Positive Supply Voltage to 12. The Test Console's voltage meter should indicate 12 volts. 5. Turn PC1 DC Power switch to ON. External program = SCAN FCC 0 External program = SCAN PWR 0 111"], "jumps": ["P2090"]}, {"id": "P2110", "text": ["6.  Connect the Function Generator to the Input BNC Connector        on the Test Console. \n7.  Set the function Generator for a 2 kHz, 10 Vpp triangle wave           output as measured at TP2 on PC130-47N.", "6. Connect the Function Generator to the Input BNC Connector on the Test Console. 7. Set the function Generator for a 2 kHz, 10 Vpp triangle wave output as measured at TP2 on PC130-47N..."], "jumps": ["P2120", "P2100", "P2115"]}, {"id": "P2115", "text": ["BNC CONNECTION - Connect the Function Generator's Main Output BNC to the Test Console's Input BNC."], "jumps": ["P2116", "P2110"]}, {"id": "P2116", "text": ["FUNCTION GENERATOR - Set Range to 1k Set Function switch Set Frequency Dial to 2"], "jumps": ["P2110", "P2115"]}, {"id": "P2120", "text": ["The experiment is now set up.  Let's verify correct operation of this Schmitt Trigger.", "The experiment is now set up. Let's verify correct operation of this Schmitt Trigger."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["1.  Place the CH1 oscilloscope probe to TP2 on PC130-47N and         the CH2 probe to TP8.  You may have to adjust R3 to obtain            the display shown.", "1. Place the CH1 oscilloscope probe to TP2 on PC130-47N and the CH2 probe to TP8. You may have to adjust R3 to obtain the display shown.", "'}:5 t0H( 9E}A9As5/GA}A;aEAA}EAKE;AAaAE;A}AEAU;aA};aEAEA;EAAAEA;E;AaA", "EUaa 555G7EEEa::Ts1TA;;AA;EEA;AAa9:AAE;E;;;UaAA;AEEA;aA};AA9aAA}}};E;AA9E}9AA;}AAEaaA;AEAEaAAEEaAAA9EEAAA}EAE;aEEEAU;EE;Ea;}", "EK,,L17;UT9;EK;,=17=9EK;AaTs a7(aEAEas5:9<5", "mzF(tt-FsFF-cmzssttst|t--yTmVstys|tytts sm t syst", ";EaTTy55F }Aaas= yjm;AEEAA T_}zc(GGFGVVVccVcVVlllGLVs-FFccclFm--jz5(-VFzmmm(ctmmlmzzzFFFFFzmmmctmFmsmmtcVmt5mzzl-zFmmFmtz", "KT[Qa9mFKKaa 5TL:EAa95 |9/:}EAEAALA_l>lz(lllFmV-V/czzFzFz/cVmcc--F(GlzFVllWmzzm(mzm(FzmpcF(zmFlzFmmlz-llplcmV-z-mcjsFV`zltmlzFVz-tVczFFtcmVmzlFz(mmzFmzFzmFl/VtmtVFmzmVcmmsVccFtsmmmmFFysGsV", "}9}AAK,,KKK/>V;U9a;EE;KTfV=:lFE;AaTTssc AA :: :9W5EAEEA-Es.>i?fodfi..r.l`(zlVclmlFzljlm", "K,EKK71CA;TU9;EKK:/H:ajlEaaaTa :G Eaa9sya9W", "iid>?>>viijVjcFGfmsG5ssTy|ymssmV5|Hsy5ysTTVsytmmV|t=sm55ms5VLmsH5sGc5m5m=VmmVmmmGmtymmls5j5mmmFV5spcmmmmV5mtt5Gmmmltsmmlmsmy5T5mssQtysFssmmmsmmtsmtsymmtss myy|s5|T5|ystsHa|s|", ",K,KK,,E,,E',EK'5@P=;''aaaT55 5GT;aA9AAOA;AA;AA: Vmcc--F(GlzFVllWmzzm(mzm(FzmpcF(zmFlzFmmlz-llplcmV-z-mcjsFV`zltmlzFVz-tVczFFtcmVmzlFz(mmzFmzFzmFl/VtmtVFmzmVcmmsVccFtsmmmmFFysGsV", "}9}AAK,,KKK/>V;U9a;EE;KTfV=:lFE;AaTTssc AA :: :9W5EAEEA-Es.>i?fodfi..r.l`(zlVclmlFzljlm", "K,EKK71CA;TU9;EKK:/H:ajlEaaaTa :G Eaa9sya9W", "iid>?>>viijVjcFGfmsG5ssTy|ymssmV5|Hsy5ysTTVsytmmV|t=sm55ms5VLmsH5sGc5m5m=VmmVmmmGmtymmls5j5mmmFV5spcmmmmV5mtt5Gmmmltsmmlmsmy5T5mssQtysFssmmmsmmtsmtsymmtss myy|s5|T5|ystsHa|s|", ",K,KK,,E,,E',EK'5@P=;''aaaT55 5GT;aA9AAOA;AA;AA:;Aa'", "aA 999a9=9}A:aa9=9aA 59O9a::A T:T:a: a=: } - aaaT :AA55:9:aa=Ta A::a aaa=:}AA } A"], "jumps": []}, {"id": "P2150", "text": ["The Schmitt Trigger is operating normally.  The computer will now insert a fault.", "The Schmitt Trigger is operating normally. The computer will now insert a fault. External program = SCAN FTR 0 F1 07 PC3 Speaker switch to ON........................................."], "jumps": ["P2140"]}, {"id": "P2160", "text": ["1.  Measure the output of the Schmitt trigger at TP8 on                           PC130- 47N.  Is the Schmitt Trigger functioning correctly?", "1. Measure the output of the Schmitt trigger at TP8 on PC130- 47N. Is the Schmitt Trigger functioning correctly??????????????"], "jumps": ["P2150", "P2165"]}, {"id": "P2161", "text": [], "jumps": []}, {"id": "P2162", "text": ["Ensure you are measuring TP8.  The fault inserted by the computer will cause no output from the circuit.", "Ensure you are measuring TP8. The fault inserted by the computer will cause no output from the circuit."], "jumps": []}, {"id": "P2165", "text": ["MEASUREMENT SETUP - Carefully measure the output of the Scmitt Trigger at TP8."], "jumps": []}, {"id": "P2170", "text": ["The output is zero and the input signal periodically exceeds the upper threshold level.  A problem exists.  Let's ensure Vcc is correct.", "The output is zero and the input signal periodically exceeds the upper threshold level. A problem exists. Let's ensure Vcc is correct."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["2.  Measure Vcc at TP7.\n      Is it a smooth +12 VDC voltage?", "2. Measure Vcc at TP7. Is it a smooth +12 VDC voltage??????????????????????????????????"], "jumps": ["P2170", "P2185"]}, {"id": "P2181", "text": [], "jumps": []}, {"id": "P2182", "text": ["The fault does not affect the Vcc supply.  Ensure your equipment is set to measure  correct.", "The fault does not affect the Vcc supply. Ensure your equipment is set to measure correct.{", "The fault does not affect the Vcc supply. Ensure your equipment is set to measure DC voltage........."], "jumps": []}, {"id": "P2185", "text": ["LEAD PLACEMENT - Carefully measure Vcc at TP7.............."], "jumps": []}, {"id": "P2190", "text": ["Since Vcc is correct, the next troubleshooting step is to check      the transistors in the circuit. \n3.  Turn the PC1 DC Power OFF.\n4.  Disconnect the Function Generator.", "Since Vcc is correct, the next troubleshooting step is to check the transistors in the circuit. 3. Turn the PC1 DC Power OFF. 4. Disconnect the Function Generator."], "jumps": ["P2180"]}, {"id": "P2200", "text": ["5.  Check across the Base-to-Emitter junction of Q2 (the right-\n     hand side of R6 to TP6).  Reverse the leads and check it again.  \n\n    Did the base-to-emitter junction of Q2 test OK?", "5. Check across the Base-to-Emitter junction of Q2 (the right- hand side of R6 to TP6). Reverse the leads and check it again. Did the base-to-emitter junction of Q2 test OK?????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????"], "jumps": ["P2190", "P2205"]}, {"id": "P2201", "text": [], "jumps": []}, {"id": "P2202", "text": ["Check your measurements across the transistor.  You may have to use a different range or switch to a digital junction tester, but you should measure high resistance or no current flow one way and low resistance or current flow in the other direction.", "Check your measurements across the transistor. You may have to use a different range or switch to a digital junction tester, but you should measure high resistance or no current flow one way and low resistance or current flow in the other direction."], "jumps": []}, {"id": "P2205", "text": ["TRANSISTOR CHECK - Using an ohmmeter, the B-E and B-C junction tests of transistors should indicate high resistance for one lead polarity and low resistance for the other. Using a digital multimeter with the diode junction tester the device should show current flow in one direction only....................................", "resistance for one lead polarity and low resistance for the other."], "jumps": []}, {"id": "P2210", "text": ["Your check of the Base-to-Emitter junction of Q2 indicates that it is good.  NextLet's check the Base-to-Collector junction.", "Your check of the Base-to-Emitter junction of Q2 indicates that it is good. NextLet's check the Base-to-Collector junction.-", "Your check of the Base-to-Emitter junction of Q2 indicates that it is good. Next, check the Base-to-Collector junction......"], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["6.  Check across the Base-to-Collector junction of Q2 (right-hand\n     side of R6 to TP8).  Reverse the leads and check it again.  \n\n    Did the Base-to-Collector junction of Q2 test correctly?", "6. Check across the Base-to-Collector junction of Q2 (right-hand side of R6 to TP8). Reverse the leads and check it again. Did the Base-to-Collector junction of Q2 test correctly?????????????????????????????????????????????????????????????????????????????????????????"], "jumps": ["P2210"]}, {"id": "P2221", "text": [], "jumps": []}, {"id": "P2222", "text": ["Check your measurements across the transistor.  You may have to use a different range or switch to a digital junction tester, but you should measure high resistance or no current flow one way and low resistance or current flow in the other direction.", "Check your measurements across the transis let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
