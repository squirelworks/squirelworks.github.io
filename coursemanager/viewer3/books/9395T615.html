const book = {"title": "9395T615", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: CELLULAR TELEPHONY asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": ["# #\" #& \"\"# &\"###2' &2#&.22&# 25--283-.#285255232/238882-.-5:38832222882282-213:22::82-22225:8-33-22282232.22258558.5822385:235:222283538::2585582::2:", "&&#&# #/2.#.& -8 \"#.-&23..22'/.#212&-2258\"588:52", "### ## /# #/&# \" \"/##\"#/&//..#/..&/28.&...&824/&.88-8588..2222858852.28:582228588358282228258.888:825:583.8828::8228828588828583:35558.555.85::88::85588:88:5555::38::85:::5:5:52::85::88::", ":85:855::83:5:5.5:55:855:52.5:5283822242348522...252...2..82/.4..22//2./..##/.8.#&./#&/..##// ##\",##/## #. / /& # ## ## ## ## ## \" #/# ## /# ## #.\" ./ #//###,//.&/#.\"#/.##/./#&/2.&/.../&//....//&2222.2/252.&28.8522582.824828828::255:::5:", "/,,,,,,,,,,,,,/, ,, ,,,,,,6, ,,,6,,, ,,,,,//6//6,,,,/6/,,,/,4/,,/6/4494,,494/6846446/4884664;44;889448489888<8648<<8;44;88988<88948;98<44<;:<44<<8;44<48<<8;48<48<88;48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Describe the theoretical and physical structures of a cellular telephone system and discuss the different multiplexing techniques used. w Define cellular telephony and associated terminology. w Explain the process of a cellular telephone call and state the difference between the original mobile telephone and cellular telephone............................"], "jumps": []}, {"id": "P300", "text": ["While the average person regards the portable telephone as a relatively new technology, the first mobile telephone went into service in 1946, in St. Louis, Missouri. At that time, the cost of a car phone exceeded the cost of a new car by several fold."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Additionally, each city had only one transmitter for the entire service area. This meant that the maximum number of simultaneous calls possible was limited to 25 to 35. Moreover, those fortunate enough to be one of the 25 to 35 people with the service had to suffer through erratic connectivity, high noise levels, and call interruptions.....", "25 to 35 simultaneous calls St. Louis, Mo."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Due to these and other reasons, mobile telephony did not have a massive following, in either industry or the public sector. Even so, enough interest remained over the years to foster research and development. In the mid-seventies, the FCC re-allocated the 800-900 MHz frequency band, taking it away from UHF television...", "This provided a large number of voice channels for mobile telephone use. Furthermore, the introduction of integrated circuitry brought production costs down to a level that made owning a mobile telephone possible for many people..."], "jumps": ["P430", "P410", "P440", "P420"]}, {"id": "P440", "text": ["In the 1980's and 1990's, significant strides in multiplexing, modulation, and circuit integration techniques made the mobile telephone not only more affordable but able to service densely populated areas where thousands of mobile telephones are in use simultaneously..."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["Let's begin the lesson on CELLULAR TELEPHONY.............................."], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": ["A cellular telephone can be described as a modern mobile phone system in which the coverage area is structured in hexagonally- shaped cells with automated switching to maintain service when users travel from one cell to the next.", "Mobile telephone switching office (MTSO)", "Mobile unit or pocket cellular telephone", "The cellular telephone system can be divided into two parts: 1) Logical or theoretical structure and 2) Physical or hardware structure. The ability of a cellular phone system to be operationally practical is based upon its system layout and the requirements and constraints within which the physical or hardware aspect must operate.....", "The first mobile telephones were actually mobile radios, in that they lacked full duplex operation (both parties talking at the same time)."], "jumps": ["P1030", "P1001", "P1040", "P1020", "P1050", "P"]}, {"id": "P1050", "text": ["The primary operational difference between the original mobile telephone and a cellular telephone is that cellular systems are _______"], "jumps": ["P1040"]}, {"id": "P1051", "text": [], "jumps": []}, {"id": "P1052", "text": ["The original mobile telephones were half duplex operation devices and a cellular telephone is not half duplex."], "jumps": []}, {"id": "P1053", "text": ["Being smaller would be a physical difference and not an operational difference.", "The original mobile telephone systems were limited to one transmitter that had to provide coverage to a large area. This proved to be problematic at best. The introduction of AMPS (Advanced Mobile Phone System) in the 1980's is the real forerunner of the cellular telephone system known today..."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["AMPS is an analog cellular system that is still in use, although it is rapidly losing ground to more advanced digital systems. The cellular concept provides far greater service capacity because it reuses frequencies by reducing the transmission power and adding many more transmitters...", "In this way, one telephone may be using frequency x while, ten miles away, another telephone may also be using frequency x. In some systems, two or more people in the same cell can use the same frequency..."], "jumps": ["P1080", "P1060", "P1090", "P1070"]}, {"id": "P1090", "text": ["The logical structure consists of hexagonally shaped cells in the form of a beehive. The more densely populated the area, the smaller and, hence, more numerous, the cells. Each cell has the ability to receive, transmit, and switch any call within the cell to the Mobile Telephone Switching Office (MTSO)..."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["When a cellular call is being made to a number within the Public Telephone Network, it is routed from the MTSO to the Central Telephone Office via a landline.", "MTSO connects the cellular network to the public switched telephone network."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["Beginning with the individual cell, the hardware consists of the user cellular telephone, the cell's base transceiver station (BTS), the cell antenna, and the MTSO. The BTS is the interface between the mobile unit (cell phone) and the MTSO..."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["It receives and processes all traffic signals and instructions from the MTSO and sends and receives traffic to or from the mobile telephone. It is also responsible for handover operations (transfer and routing) of the traffic and control of the power signals between the MTSO and the transmitter. The antenna is the conduit for traffic signals in and out of the cell site....."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["The MTSO is the heart of the cellular system. It regulates and manages all switching to and from the cells in its area of responsibility. It provides for hardware backup, diagnostics, public telephone network interfacing and logs time and location of all calls for billing purposes..."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["Most modern MTSOs are able to process both analog and digital signals. This requires A/D and D/A (Analog to Digital and Digital to Analog) conversion hardware as well as an electronic switching system capable of handling both signal formats..."], "jumps": ["P1150", "P1110"]}, {"id": "P1150", "text": ["The MTSO has two major sections: the logic control section and the switching section. The logic control section is microprocessor based and is responsible for switching calls between active users and the network. The switch matrix may be any one of a number of high-speed electronic switching systems.....", "MTSO Logic Control Section Switching Section Microprocessor Electronic Switching System"], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["The MTSOs and the cell sites assigned to it are connected by landline. The cellular telephone itself contains a logic unit, a control unit, a transceiver, and an antenna. The logic unit responds to system commands and interprets customer actions."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["The control unit houses the user interfaces such as the dialer and indicator lights. The transceiver is nothing more than a combination receiver/transmitter. Due to the size constraints of a cellular phone, the transceiver often shares many components needed by both the receiver and the transmitter..."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["This section also includes a synthesizer that allows the unit to tune to any of the allocated frequencies. Cell phones have two antennas: an internal one that is used for transmission and reception and an external one that is only used for transmission..."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["The external antenna of the cellular telephone is used for _______"], "jumps": ["P1170"]}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1192", "text": ["Of the two antennas on the cellular telephone, none is used for reception only."], "jumps": []}, {"id": "P1193", "text": ["The internal antenna of a cellular telephone is used for both transmission and reception."], "jumps": []}, {"id": "P1200", "text": ["This means that both antennas are used for reception in a space-diversity configuration. Space-diversity is a process whereby two or more antennas are used for reception. The receiver automatically selects the antenna with the best signal strength...", "Any telephone call, whether made on a conventional wire line or wireless, is subject to three control functions: seizure, signaling, and supervision. In order to ensure that these processes occur, certain signal events must take place at the right time and in the right sequence..."], "jumps": ["P1210", "P1190", "P1220", "P1200"]}, {"id": "P1220", "text": ["There are two methods for controlling the network. The first is the use of voice channels for control purposes at appropriate times during the call. The second method is to have dedicated channels for control purposes. The North American cellular network uses the second method...", "1. Voice Channels 2. Dedicated Channelsssssss"], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["The control signals perform a variety of functions, which include system identification and characterization, directing active units to tune to a particular channel, and initiating seizures. There are two identical 333-channel cellular systems in each city..."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["Each system reserves 21 channels for control purposes, leaving 312 channels for voice. Since there are two systems, there are actually 624 voice channels and 42 control channels. Mobile phones must be capable of tuning to any one of the total 666 channels...", "Since cell phones require full duplex operation (simultaneous two-way conversation), each call uses two channels. Most cells handle 45 mobile units, which means that each cell uses roughly 90 of the 666 available channels. This may not seem to be enough channels for a major metropolitan area and, in fact, it is not....."], "jumps": ["P1250", "P1230", "P1260"]}, {"id": "P1260", "text": ["Four factors make the system large enough to accommodate the thousands of mobile units (cell phones) that exist in urban areas of the country: 1) Frequency reuse 2) Cell splitting 3) Spread spectrum and 4) Not all phones are in use at the same time..."], "jumps": ["P1270", "P1230"]}, {"id": "P1270", "text": ["The first three factors are processes or techniques that have been developed to make more from less, and the last factor is just a matter of chance. It is theoretically possible for all existing cell phones in a given area to be in use at the same time, but the odds of that occurring are probably nil..."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["Frequency reuse, cell splitting, and spread spectrum will be addressed as they apply in the course of this lesson. Let's examine the process for making a call using a cellular telephone."], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["Upon power-up, a cellular phone goes into an idle state. This is when it is turned on, but not actively engaged in a phone connection or in the process of making a phone connection. To get to the idle state, the receiver first tunes to each of the 21 (or 42) control channels, selecting the one with the strongest signal...", "1. Power on 2. Selects strongest control channel 3. Reaches idle state"], "jumps": ["P1300", "P1260"]}, {"id": "P1300", "text": ["It reads a series of bits that are formatted into words, which are composed of paging messages mixed with tuning and overhead messages. The paging messages are identification (ID) numbers assigned to each mobile unit. The receiver looks for its own signal...", "4. Reads paging messages 5. Receiver looks foe its own signal 3. Reaches idle state"], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["Every eleventh bit of the paging signal is dedicated as the idle/busy bit. If it is set to idle, it remains in the idle state and continues to monitor the paging signal on the control channel. If the bit indicates busy, then either the user has initiated a call or another party has sent out a request for that identification number.....", "6. Monitors idle/busy bit of paging signal a. If idle, continues to monitor paging signal b. If busy, user made a call or someone called them."], "jumps": ["P1320", "P1290"]}, {"id": "P1320", "text": ["In either case, the network responds with a voice channel assignment. Once the mobile unit has tuned to the assigned voice channel, it is ready for seizure. Seizure takes place when the mobile unit sends its seizure message to the network...", "7. Assigns voice channel 8. Sends seizure message to network 3. Reaches idle state"], "jumps": ["P1330", "P1290"]}, {"id": "P1330", "text": ["As part of the seizure message, a precursor indicates to the network which base station it's attempting to take control of. While the message is being sent, the unit continues to monitor the idle/busy bit in case the user aborts the call, or the called base station is busy, or the called number is busy...", "6. Monitors idle/busy bit of paging signal a. If idle, continues to monitor paging signal b. If busy, user made a call or someone called them.", "4. Reads paging messages 5. Receiver looks foe its own signal 3. Reaches idle state", "7. Assigns voice channel 8. Sends seizure message to network 3. Reaches idle state", "9. Identifies user base station 10. Continues to monitor idle/busy bit in the event of: a. User aborts call b. Base station is busy c. Number called is busy", "1. Power on 2. Selects strongest control channel 3. Reaches idle state", "The signaling process is concurrent with the period of telephone connection from start to finish and concerns not only the connection to the called party, but the error rate, the economy of the channel capacity ( the number of transmissions on same channel), and the transmission of control information...", "Signaling 1. Monitors connection from start to finish", "capacity (the number of transmissions on same channel) and transmission of control information", "2. Checks error rate, economy of channel capacity (the number of transmissions on same channel) and transmission of control information"], "jumps": ["P1340", "P1290", "P1350"]}, {"id": "P1350", "text": ["The reliability of the intelligence signal in a fading, low-power, signal environment often reveals errors that are manifest in groups and commonly in bursts. This can be true even when overall error rates are well within acceptable limits..."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["Incomplete connections due to control information that cannot be decoded should be held to fewer than 1 in 10,000. Wrong numbers (not operator initiated) and mispaged or misidentified users should be fewer than 1 in 10,000,000. This is because paging signals may be received by as many as 50,000 idle mobile units....."], "jumps": ["P1370", "P1340"]}, {"id": "P1370", "text": ["Multiplexing techniques used with the radio frequency (RF) carrier are designed to be as frugal as possible with the available spectrum. The most popular techniques presently used are TDMA (Time-Division Multiple Access) and CDMA (Code-Division Multiple Access). They are used in the signaling process and will be discussed later in the lesson.....", "1. Time -Division Multiple Access (TDMA)", "2. Code- Division Multiple Access (CDMA)"], "jumps": ["P1380", "P1340"]}, {"id": "P1380", "text": ["Control information can be viewed as forward and reverse and then sub-categorized for control or voice channels. The graphic lists the kinds of information that must be processed for proper signaling to occur...", "1. Pages 2. Channel Designations 3. Mobile power level 4. Local Parameters (Overhead)", "1. Dialed Digits 2. Mobile Identifications 3. Mobile power level 4. Local Parameters (Overhead)", "1. Orders 2. Channel Designations 3. Mobile power level 4. Local Parameters (Overhead))", "1. Order Confirmation 2. Dialed Digits (3-way calling) ower level 4. Local Parameters (Overhead)"], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["The graphic reflects those control signals associated with a connection that has forward as a land-based transmitter and reverse as a mobile transmitter. When calls are made from one mobile unit to another, additional and/or different signals must be processed..."], "jumps": ["P1400", "P1370"]}, {"id": "P1400", "text": ["There are 21 channels dedicated to control signals, once the signaling portion of the call has begun, some control signals must be interspersed with the voice. This is done by briefly blanking (pausing) the voice intelligence long enough to send a burst of control signals. The user does not generally perceive the pause....."], "jumps": ["P1410", "P1370"]}, {"id": "P1410", "text": ["Finally, supervision is the portion of the connective operations that monitors when a call is picked up or terminated. This is accomplished by one of three out-of-band audio tones called Supervisory Audio Tones (SAT)...", "Accomplished by 1 of 3 Supervisory Audio Tones"], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["They consist of 5970 Hz, 6000 Hz, and 6030 Hz and are generally referred to as SATs. For each call, one of the three tones is sent on each active voice channel by the base transmitter and returned by the mobile transmitter for as long as it is on..."], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["Another frequency is used by the mobile transmitter to indicate an on-hook condition. This system is still used for analog cellular systems, but digitally based systems use a unique 8-bit code..."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["The latest digital cellular systems are still patterned after the AMPS system: multiple low-power transmitters in a hexagonal (cellular) array. The term cellular telephone is derived from the AMPS cellular format..."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["The hexagonal shape was chosen because it most closely resembles a circle, which is the normal pattern for antenna wave propagation. Wave propagation refers to the emission of RF energy from an antenna..."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["If circular cells were used, there would be areas of dead zones between them as shown. If the circles were overlapped to avoid the dead zones, then frequency interference would result in the areas indicated. By joining hexagonal shapes, dead zones and overlapped areas are eliminated and a group of cells closely resembles a circle....."], "jumps": ["P1470", "P1440"]}, {"id": "P1470", "text": ["In the AMPS system, each cell can accommodate 57 conversations. If more capacity is needed, the cells are split. Cell splitting takes one cell and breaks it into a group of smaller cells..."], "jumps": ["P1480", "P1440"]}, {"id": "P1480", "text": ["If an original cell has the capacity of 57 conversations and is broken into four separate cells occupying the same original space, capacity of the original cell area jumps to 228 conversations..."], "jumps": ["P1490", "P1470"]}, {"id": "P1490", "text": ["In major metropolitan areas, where population density is high for a relatively small area, thousands of cellular phone conversations may be occurring simultaneously. Cell splitting is necessary in such an environment..."], "jumps": ["P1500", "P1470"]}, {"id": "P1500", "text": ["The downside to cell splitting is that it requires all the equipment that was within the original cell to be duplicated for each of the new cells and this can be a costly venture."], "jumps": ["P1510", "P1470"]}, {"id": "P1510", "text": ["Furthermore, some segments of the population, including those who use cellular phones, dislike the antenna towers, which spurs some heated debates between the public and community leaders as to where the towers should be located. This has led to the development of various techniques designed to camouflage cell towers....."], "jumps": ["P1520", "P1470"]}, {"id": "P1520", "text": ["Notice that the higher the service density (the number of people desiring a cellular connection), the smaller the cells must be. Conversely, the lower the service density, the larger the cells can be..."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["One of the most efficient ways of increasing the capacity of a cellular system is through the process of frequency reuse. This is not only a way of increasing the capacity of a cellular system, but it also demonstrates an economical use of the available RF spectrum...", "A = 825 Mhz B = 830 Mhz C = 835 Mhz D = 840 Mhz"], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["Which is not a benefit of frequency reuse?.................", "increase in capacity of cellular systemm", "economical use of the available RF spectrumm", "duplication of cell's original equipmentt"], "jumps": ["P1530"]}, {"id": "P1541", "text": [], "jumps": []}, {"id": "P1542", "text": ["Frequency reuse is a way to increase the capacity of a cellular system."], "jumps": []}, {"id": "P1543", "text": ["Frequency reuse does promote economical use of the available RF spectrum."], "jumps": []}, {"id": "P1550", "text": ["By keeping the transmission power levels of each cell as low as possible, the same frequency can be used in a nearby cell, providing it doesn't border another cell using the same frequency. The graphic shows a cellular structure of 44 cells that are serviced with only four frequencies...", "A = 825 Mhz B = 830 Mhz C = 835 Mhz D = 840 Mhz"], "jumps": ["P1560", "P1540"]}, {"id": "P1560", "text": ["In a real system, each cell would be assigned a group of frequencies, but in this illustration, we are only demonstrating the concept. In the illustration, all A cells have been assigned 825 MHz, all B cells 830 MHz, and so on. Notice that no like cells border each other..."], "jumps": ["P1570", "P1550"]}, {"id": "P1570", "text": ["There is at least one different cell between any two like cells. In this way, a conversation using 825 MHz in cell A5 will not interfere with a conversation using 825 MHz in cell A6. The importance of low-power transmissions in a cellular system becomes quite clear when frequency reuse and cell splitting are considered.....", "The process of hand-off in cellular telephony is of particular importance and one that requires a bit of technical wizardry. When a cellular conversation is in progress and the user begins to leave the current cell due to travel, the signal level will drop significantly..."], "jumps": ["P1550", "P1590"]}, {"id": "P1590", "text": ["When this occurs, the MTSO will poll all of the cells that it is responsible for to determine which cell now has the highest signal level. This will always be the cell where the mobile unit is physically located. The MTSO will then automatically assign a new voice channel to the unit...", "The conversation will continue unbroken and the users will not detect the channel change. In an urban area, where the cells may only be a mile across, a 30-minute conversation can have many hand-offs..."], "jumps": ["P1600", "P1610", "P1580"]}, {"id": "P1610", "text": ["In most cases, the cell phone is only used within the area to which it is registered. This area may encompass several cities or counties. In North America, however, we have a very mobile society, and frequently the cell phone is used far from its normal confines..."], "jumps": ["P1620", "P1580"]}, {"id": "P1620", "text": ["Since each MTSO is assigned a given number of cells to service, once a mobile unit leaves the home MTSO's area of responsibility, it needs to be picked up by the cellular system handling the location that the mobile unit has entered..."], "jumps": ["P1630", "P1610"]}, {"id": "P1630", "text": ["Presently, a mobile unit can be located nearly anywhere in the world and be picked up by one system or another. Roaming simply refers to a mobile unit requiring service outside its home service area. Fundamentally, the process is the same as used for hand-off within the home service area..."], "jumps": ["P1640", "P1610"]}, {"id": "P1640", "text": ["Roaming does present some problems that do not arise when the mobile unit is within its assigned service area, such as, toll charges and roaming fees - how they are assessed and to whom they are assessed. There is no established guideline; it will likely vary from one cellular service provider to another..."], "jumps": ["P1650", "P1610"]}, {"id": "P1650", "text": ["Just like the price and deal wars between long distance service providers, cellular service providers offer the same confusion. Most cellular telephones have some feature to alert users when they have left their home service area and are roaming, such as an illuminated LED or an indication on a liquid crystal display...", "When cellular telephones were rare, frequency reuse and cell splitting were sufficient to provide service for the existing demand. As the number of cellular telephones increased, creative measures were necessary to accommodate them...", "A = 825 Mhz B = 830 Mhz C = 835 Mhz D = 840 Mhz"], "jumps": ["P1660", "P1640", "P1670"]}, {"id": "P1670", "text": ["Experimentation in multiplexing and modulation techniques yielded favorable results. The three most popular methods presently in use are: ime-Division Multiple Access (TDMA), Code-Division Multiple Access (CDMA), and Groupe Speciale Mobile (GSM)..."], "jumps": ["P1680", "P1660"]}, {"id": "P1680", "text": ["First generation cellular systems (AMPS) are analog systems and, as such, are unable to utilize much of the technology devised for digital systems. Second generation cellular systems are all digital (D-AMPS) and are primarily used with Personal Communication Services (PCS) networks...", "AMPS Advanced Mobile Phone System Analog", "D-AMPS Digital Advanced Mobile Phone System PCSlog"], "jumps": ["P1690", "P1670", "PCS"]}, {"id": "P1690", "text": ["Time-Division Multiple Access is a multiplexing technology that permits multiple users to occupy the same frequency simultaneously by dividing the frequency into separate time slots (milliseconds in length), with each slot assigned to a different user..."], "jumps": ["P1700", "P1680"]}, {"id": "P1700", "text": ["The most current TDMA standard divides the frequency into 6 time slots with two slots assigned to each user, allowing three conversations per channel. The graphic illustrates one channel being utilized by three simultaneous users. The conversations are chopped into short segments. The breaks in conversation are so short that they are transparent to the users.....", "User 1 \"I should be able to get there on time.\" User 2 \"Where would you like to go on vacation\" User 3 \"What movie do you want to see tonight\""], "jumps": ["P1710", "P1690"]}, {"id": "P1710", "text": ["The advantages of TDMA include a high degree of protection from interference by other users. This is because each user is assigned a different time slot so that conversations are not occurring at precisely the same time..."], "jumps": ["P1720", "P1700"]}, {"id": "P1720", "text": ["TDMA offers a substantial cost savings over other systems, specifically CDMA. TDMA systems have a price tag of about $80,000 compared to CDMA at $300,000. Users save on battery life, because the mobile unit is actually only transmitting during the portion of the time that the conversation is taking place...", "Like all systems, TDMA also has disadvantages. User time slots are predefined, so if all the time slots in a cell the user is in are filled, no dial tone will be received. A user who roams out of one cell and into another may have the connection terminated for the same reason. TDMA is also quite susceptible to multipath interference....."], "jumps": ["P1730", "P1700", "P1740", "P1720"]}, {"id": "P1740", "text": ["Multipath interference can occur when a transmitted signal uses several different paths to arrive at a receiver. Transmitted signals have a tendency to bounce off buildings and other objects, causing them to reach the receiver at slightly different times. This can cause phase distortion in the transmitted signal..."], "jumps": ["P1750", "P1730"]}, {"id": "P1750", "text": ["At present, TDMA is the most widely used digital transmission technology adapted to cellular telephony. It holds a prominent position in the North American cellular system, and it is the basis for the European GSM system as well as the Japanese Digital Cellular (JDC) system..."], "jumps": ["P1760", "P1730"]}, {"id": "P1760", "text": ["The big competitor for TDMA is a spread spectrum technology called CDMA. While the spread spectrum technology behind CDMA has been around for a long time, the CDMA cellular process itself is relatively new compared to the older analog AMPS and TDMA systems...", "CDMA works by taking the transmitted signal and spreading it out over a very wide band of frequencies at a very low power level. A predetermined bit stream is mixed with the transmitted intelligence to spread the signal out...", "Locally generated PN bit stream identical to \"B\" above by xoring \"C\" with the locally generated PN bit stream one can derive the original data", "The receiver uses the same bit stream as a key to decode the signal and restore the original intelligence. Because the receiver needs a key to unlock the transmission, all other signals picked up by the antenna are ignored. This makes the CDMA signal far more secure than other cellular systems...", "CDMA allows many mobile units to use the same frequencies because each unit is operating with a unique code and the transmissions are very low power. Another major advantage of CDMA is that it coherently combines the multipath signal receptions, which actually enhances the received signal..."], "jumps": ["P1770", "P1750", "P1780", "P1760", "P1790", "P1800"]}, {"id": "P1800", "text": ["CDMA advantages over TDMA are: 1) Increased capacity, 2) High degree of security (privacy), 3) Very low power consumption, 4) More efficient use of available bandwidth, 5) Clearer reception and 6) Hand-offs from cell to cell are rarely problematic...", "More efficient use of available bandwidth", "Hand-offs cell to cell are rarely problematicc"], "jumps": ["P1810", "P1790"]}, {"id": "P1810", "text": ["The largest disadvantage of CDMA compared to TDMA is the cost factor. Due to the complexity of CDMA systems, they carry a higher price tag. CDMA and TDMA proponents have been in competition since 1989 when CDMA was first introduced...", "AMPS TDMA CDMA CDMA"], "jumps": ["P1820", "P1800"]}, {"id": "P1820", "text": ["Considering that TDMA had been in place for several years and was endorsed by the Telecommunications Industry Association in the same year CDMA was introduced, it is understandable that the backers of TDMA were not pleased. In addition, many of the Bell Telephone companies and Sprint Communications climbed on the CDMA train.....", "AMPS TDMA CDMA CDMA"], "jumps": ["P1830", "P1810"]}, {"id": "P1830", "text": ["With vast sums of money at stake today, neither side is willing to fold. While it is impossible to foresee the results of the wrangling over system superiority between TDMA and CDMA, many second and third generation cellular systems are now embracing CDMA as the chosen method...", "TDMA vs CDMA = ???? CDMAAA CDMA"], "jumps": ["P1840", "P1820"]}, {"id": "P1840", "text": ["GSM is the cellular standard endorsed by the European Union, operating throughout Europe, parts of Asia, Australia, New Zealand, and most of Latin America. It is also referred to as Global System for Mobile Communications (GSM). GSM is fundamentally a TDMA format with different protocols and particulars....."], "jumps": ["P1850", "P1830"]}, {"id": "P1850", "text": ["In the United States, Omnipoint uses GSM, and AT&T Wireless has a very similar system. The primary goal of the European Union was to eliminate incompatibility of the varied systems within the mobile communications arena worldwide. While this was certainly a noble endeavor, it has proven to be a difficult one, at best....."], "jumps": ["P1860", "P1840"]}, {"id": "P1860", "text": ["Even without the introduction of CDMA, getting the world's financial and technological movers to agree to one particular system was (and is) destined to face some enormous obstacles. With CDMA in the picture, matters look even gloomier for GSM...", "AMPS TDMA CDMA CDMA"], "jumps": ["P1870", "P1850"]}, {"id": "P1870", "text": ["CDMA's first commercial debut was in Hong Kong in 1995. Hutchison Telecom put the CDMA system in place in parallel to their GSM system. The CDMA system had 24,000 subscribers and provided 3 to 5 times the capacity of the GSM system. e next year, a spokesman for Hutchison stated that the CDMA system needed 30 to 40 percent fewer cells to get the same results as the GSM system....."], "jumps": ["P1875", "P1860"]}, {"id": "P1875", "text": ["The next year, a spokesman for Hutchison stated that the CDMA system needed 30 to 40 percent fewer cells to get the same results as the GSM system."], "jumps": ["P1880", "P1870"]}, {"id": "P1880", "text": ["In regard to the development of cellular telephone, AMPS can be seen as 1st generation (G), and D-AMPS, GSM, TDMA and CDMA can be seen as 2nd generation. 3rd generation cellular standards have yet to be defined. Like its 2nd generation roots, 3G's future is almost surely to be burdened by the occurrence of several different systems....."], "jumps": ["P1890", "P1870"]}, {"id": "P1890", "text": ["One hope is that any approved 3G standard will be compatible with any existing standards. Thus far, most of the 3G standards are CDMA-based. One standard being tested is called HDR (high data rate) CDMA, which supports throughput at speeds up to 1.8 Mbps rather than the 14.4 to 56 kbps presently achieved..."], "jumps": ["P1892", "P1880"]}, {"id": "P1892", "text": ["Two other proposals for CDMA standards are CDMA 2000 and W-CDMA. CDMA 2000 is being implemented in two phases. Phase 1 is already in operation and transmits data packets at 14.4 kbps. A notable feature is that it also transmits an identification code from the mobile unit that allows 911 to pinpoint the location of the unit......", "We have your location! We're on our way."], "jumps": ["P1894", "P1880"]}, {"id": "P1894", "text": ["Phase 2 will have the capability to transmit multimedia at 2 Mbps and carry voice over data networks. W-CDMA (wideband) is designed to be faster than CDMA2000, but it demonstrates a less efficient use of the allocated spectrum. W-CDMA will probably be rather short lived..."], "jumps": ["P1896", "P1892"]}, {"id": "P1896", "text": ["Two major TDMA-based industry groups have agreed to devise a 3G standard that will be compatible with existing AMPS, TDMA, GSM and CDMA systems. They are planning a network that will deliver data at speeds of up to 384 kbps in both their own TDMA systems and in CDMA...", "AMPS TDMA GSM CDMA", "384 Kbps 384 Kbps"], "jumps": ["P1900", "P1892"]}, {"id": "P1900", "text": ["It is also their goal to have this system set up so that users can roam from one system to another without interruption.", "AMPS TDMA GSM CDMA", "384 Kbps 384 Kbps", "TDMA TDMA GSM CDMA", "GSM TDMA GSM CDMA", "CDMA TDMA GSM CDMA"], "jumps": ["P1910", "P1896"]}, {"id": "P1910", "text": ["This completes the information on CELLULAR TELEPHONY.......", "1. Cellular telephone can be described as a modern mobile phone system in which the coverage area is structured in hexagonally- shaped cells with automated switching to maintain service when users travel from one cell to the next. and breaks it into a group of smaller cells....", "Mobile telephone switching office (MTSO)", "Mobile unit or pocket cellular telephone", "2. Cell splitting takes one cell and breaks it into a group of smaller cells.ing, and supervision...", "3. The three main control functions of a cellular telephone call are: seizure, signaling, and supervision..."], "jumps": ["P1001", "P1896", "P1925", "P1940", "P1920"]}, {"id": "P1940", "text": ["4. Frequency reuse is a method of using a frequency more than once within the same cellular system..", "A = 825 Mhz B = 830 Mhz C = 835 Mhz D = 840 Mhz", "5. Hand-off in cellular telephony refers to the process of automatically switching a conversation from one frequency to another when the mobile unit travels from one cell to another."], "jumps": ["P1930", "P1960", "P1940"]}, {"id": "P1960", "text": ["6. Roaming refers to a mobile unit requiring service outside its home service area."], "jumps": ["P1970"]}, {"id": "P1970", "text": ["7. TDMA (Time-Division Multiple Access) is a process whereby the frequency is broken into time slots of some specified length and assigned to multiple users.", "User 1 \"I should be able to get there on time.\" User 2 \"Where would you like to go on vacation\" User 3 \"What movie do you want to see tonight\""], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["8. CDMA (Code-Division Multiple Access) is a spread spectrum technique where each mobile unit uses a unique code that is mixed into the transmitted signal. The receiving unit will only recognize the intended call, ignoring any other transmissions on the same frequency."], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["9. GSM (Groupe Speciale Mobile or Global System for Mobile Communications) is the most widely used cellular system outside of the United States. It is a TDMA-based system but is losing popularity as newe let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
