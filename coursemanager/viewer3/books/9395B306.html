const book = {"title": "9395B306", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: DC CIRCUIT TROUBLESHOOTINGd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Determine if a DM transmitter and receiver system is operating correctly. w Identify the faulted component in a malfunctioning DM transmitter and receiver system......................."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 470 Oscilloscope rXXXXXXXXXXnt"], "jumps": []}, {"id": "P301", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will troubleshoot faults in a DM transmitter and receiver system."], "jumps": ["P410", "P301"]}, {"id": "P410", "text": ["Troubleshooting DM systems is not difficult due to the use of only one major integrated circuit."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Measuring the input and output signals of a chip determines if the chip is faulted.  That's all there is to it!", "Measuring the input and output signals of a chip determines if the chip is faulted. That's all there is to it!"], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["However, there is support circuitry in the DM system that could cause the main modulator/demodulator chip to appear faulted."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["So, you must first isolate the malfunctioning DM system to either the transmitter or the receiver."], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["In other words, you troubleshoot a DM system as you would any signal processing system. You isolate the fault from the system down to a circuit!"], "jumps": ["P460", "P400"]}, {"id": "P460", "text": ["Then you find the faulted component."], "jumps": ["P470", "P400"]}, {"id": "P470", "text": ["Let's begin the lesson on DM CIRCUIT TROUBLESHOOTING......................"], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1020", "text": ["In this experiment, you will locate the failed chip or component in a DM transmitter and receiver system."], "jumps": ["P1040", "P1001"]}, {"id": "P1040", "text": ["The transmitter is located on the PC130-332 card.", "The transmitter is located on the PC130-332 card..........."], "jumps": ["P1050", "P1020", "P1045"]}, {"id": "P1050", "text": ["The transmitter consists of a MC3418 CVSD modulator and support circuitry."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["The receiver is located on the PC130-333 card.", "The receiver is located on the PC130-333 card.............."], "jumps": ["P1070", "P1040", "P1065", "P"]}, {"id": "P1070", "text": ["The receiver consists of a MC3418 CVSD demodulator and support circuitry."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["To locate a faulted chip, you must first determine if the DM system is operating correctly."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["This is accomplished by making one simple oscilloscope measurement.  Measure the input to the transmitter and the output of the receiver.", "This is accomplished by making one simple oscilloscope measurement. Measure the input to the transmitter and the output of the receiver."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["If the output signal matches the input signal, the DM system is operating correctly."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["If you do not have a good signal on the output of the receiver, the system is faulted."], "jumps": ["P1120", "P1080"]}, {"id": "P1120", "text": ["Once you have determined that the DM system is not operating correctly you must then isolate the fault to either the transmitter, transmission medium or receiver."], "jumps": ["P1130", "P1080"]}, {"id": "P1130", "text": ["This is accomplished by making two simple oscilloscope measurements."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["First, measure the output of the transmitter."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["If a DM signal is present, the transmitter circuit must be operating correctly."], "jumps": ["P1160", "P1120"]}, {"id": "P1160", "text": ["If the DM signal is not present, the transmitter is faulted."], "jumps": ["P1170", "P1120"]}, {"id": "P1170", "text": ["Second, measure the input to the receiver.  You already know that the receiver has a bad output or you would not be troubleshooting the system.", "Second, measure the input to the receiver. You already know that the receiver has a bad output or you would not be troubleshooting the system."], "jumps": ["P1180", "P1120"]}, {"id": "P1180", "text": ["If an attenuated DM signal is not present on the input, the fault is in the transmission medium."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["If an attenuated DM signal is present on the output, the fault is in the receiver."], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["If the fault is in the transmission medium, checking out the antenna or transmission cables will normally locate the failure."], "jumps": ["P1210", "P1170"]}, {"id": "P1210", "text": ["If the fault is in the transmitter, oscilloscope measurements will isolate the fault to circuit."], "jumps": ["P1220", "P1170", "P1045"]}, {"id": "P1220", "text": ["If the fault is in the receiver, oscilloscope measurements will isolate the fault to a circuit."], "jumps": ["P1230", "P1210", "P1065"]}, {"id": "P1230", "text": ["Once the circuit has been located, further oscilloscope or multimeter measurements will locate the fault to a particular chip or component.  Let's start the experiment.", "Once the circuit has been located, further oscilloscope or multimeter measurements will locate the fault to a particular chip or component. Let's start the experiment."], "jumps": ["P1240", "P1220", "P1235", "P1236", "P1230"]}, {"id": "P1240", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P1230"]}, {"id": "P1250", "text": ["2.  Place PC130-332 into the test console PC2 position.  \n3.  Place PC130-333 into the test console PC3 position.", "2. Place PC130-332 into the test console PC2 position. 3. Place PC130-333 into the test console PC3 position."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["4.  Set the Positive Supply Control to 12.  The Voltmeter on the           130A should indicate 12 Volts.", "4. Set the Positive Supply Control to 12. The Voltmeter on the 130A should indicate 12 Volts."], "jumps": ["P1250"]}, {"id": "P1270", "text": ["5.  On PC130-332, set R1 and R2 to mid position.   \n6.  On PC130-333, set R1 and R2 to mid position.", "5. On PC130-332, set R1 and R2 to mid position. 6. On PC130-333, set R1 and R2 to mid position."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["7.  Connect the MAIN output of the function generator to the PC1       OUTPUT BNC. \n8.  On the function generator, set the output for a 1 kHz, 1 Vpp            sine wave signal as measured on PC130-332 TP1.", "7. Connect the MAIN output of the function generator to the PC1 OUTPUT BNC. 8. On the function generator, set the output for a 1 kHz, 1 Vpp sine wave signal as measured on PC130-332 TP1.", "BNC CONNECTION - Connect the Function Generator's Main Output BNC to the Test Console's Output BNC."], "jumps": ["P1290", "P1270", "P1285"]}, {"id": "P1290", "text": ["9.  Set the PC2 and PC3 DC Switch to ON.", "10.  Using a frequency counter if available (if not use an                           oscilloscope), adjust R2 on PC130-332 for a 36 kHz 1 \u00b1 kHz            signal as measured on TP2.  Note that the Nida 440 function           generator has a built in frequency counter.", "11.  Using a frequency counter if available (if not use an                           oscilloscope), adjust R2 on PC130-333 for 36 kHz  \u00b11 kHz               signal as measured on TP2.  Note that the Nida 440 function           generator has a built in frequency counter.", "12.  Using the oscilloscope, measure the signal on PC130-333               TP1 and adjust R1 for a 8 Vpp signal.", "9. Set the PC2 and PC3 DC Switch to ON....................................", "10. Using a frequency counter if available (if not use an oscilloscope), adjust R2 on PC130-332 for a 36 kHz 1", "kHz signal as measured on TP2. Note that the Nida 440 function generator has a built in frequency counter.", "11. Using a frequency counter if available (if not use an oscilloscope), adjust R2 on PC130-333 for 36 kHz", "1 kHz signal as measured on TP2. Note that the Nida 440 function generator has a built in frequency counter.", "12. Using the oscilloscope, measure the signal on PC130-333 TP1 and adjust R1 for a 8 Vpp signal."], "jumps": ["P1280", "P1310", "P1290", "P1320", "P1300", "P1330"]}, {"id": "P1330", "text": ["13.  On the oscilloscope, set the controls as follows:", "13. On the oscilloscope, set the controls as follows: lt/Div CH1 - 0.5 Volt/Div CH2 - 0.05 Time/Div - 0.2 ms Triggering - CH1, AC, + Display - Dual", "Volt/Div CH1 - 0.5 Volt/Div CH2 - 0.05 Time/Div - 0.2 ms Triggering - CH1, AC, + Display - Dual"], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["14.  Connect the CH1 probe to TP1 on PC130-332.   \n15.  Connect the CH2 probe to TP6 on PC130-333.", "14. Connect the CH1 probe to TP1 on PC130-332. 15. Connect the CH2 probe to TP6 on PC130-333.", "PC130-332 SCHEMATIC - Transmitter - Connect the CH1 probe to TP1.", "PC130-333 SCHEMATIC - Receiver - Connect the CH2 probe to TP6."], "jumps": ["P1350", "P1330", "P1345", "P1346", "P1340"]}, {"id": "P1350", "text": ["16.  Compare the signals shown on the oscilloscope.  Is the DM            communication system operating correctly?", "16. Compare the signals shown on the oscilloscope. Is the DM communication system operating correctly?"], "jumps": ["P1340"]}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1352", "text": ["The adjustments to the DM transmitter and receiver are not correct.  You must repeat the procedure.  If you can not align the system after three times, see you instructor.", "The adjustments to the DM transmitter and receiver are not correct. You must repeat the procedure. If you can not align the system after three times, see you instructor."], "jumps": ["P1350", "P1300"]}, {"id": "P1360", "text": ["The DM system is operating correctly, changing the analog information signal to digital pulses that represent changes and then changing the DM signal back to the original analog signal."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["The computer will now insert a fault, or insert no fault, into the DM system. You are to determine if the system is operating correctly, and if not, you are to locate the fault to the transmitter or receiver, to the circuit, and then to the most probable chip or component."], "jumps": ["P9360"]}, {"id": "P1410", "text": ["Would you like to try another troubleshooting experiment?", "Would you like to try another troubleshooting experiment?.."], "jumps": []}, {"id": "P1420", "text": ["You have completed all the troubleshooting experiments for this lesson.  If you would like to try the troubleshooting experiments again, select DM CIRCUIT TROUBLESHOOTING from the Lesson Menu.", "You have completed all the troubleshooting experiments for this lesson. If you would like to try the troubleshooting experiments again, select DM CIRCUIT TROUBLESHOOTING from the Lesson Menu."], "jumps": []}, {"id": "P1440", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": []}, {"id": "P1450", "text": ["Disconnect test equipment. \n     Carefully remove PC cards.                                \n     Return all equipment to its proper storage area.", "Disconnect test equipment. Carefully remove PC cards. Return all equipment to its proper storage area.."], "jumps": []}, {"id": "P1460", "text": ["Set the Test Console Power OFF. Carefully remove the PC cards from the test console. Return all equipment to its proper storage area. .."], "jumps": []}, {"id": "P1910", "text": ["This completes the experiment on DM CIRCUIT TROUBLESHOOTING.", "This completes the experiment on DM CIRCUIT TROUBLESHOOTING.."], "jumps": ["P1460"]}, {"id": "P2000", "text": ["The DM system may or may not be faulted, you must check using the oscilloscope."], "jumps": ["P2010"]}, {"id": "P2010", "text": ["1.  Measure the input signal of the transmitter on PC130-332 TP1        and the output signal of the receiver on PC130-333 TP6 to               determine if the DM system is operating correctly.                              Is the DM system operating correctly?", "1. Measure the input signal of the transmitter on PC130-332 TP1 and the output signal of the receiver on PC130-333 TP6 to determine if the DM system is operating correctly. Is the DM system operating correctly?"], "jumps": []}, {"id": "P2011", "text": [], "jumps": []}, {"id": "P2012", "text": ["The output signal of the receiver is incorrect, it does not match the input signal to the transmitter. The DM system is not operating correctly."], "jumps": []}, {"id": "P2020", "text": ["2.  Determine if the transmitter, transmission medium or receiver        is faulted by measuring the signals on PC130-332 TP4 and on       PC130-333 Pin E and comparing the signal on PC130-332 TP1.      Is the transmitter, transmission medium or receiver faulted?", "2. Determine if the transmitter, transmission medium or receiver is faulted by measuring the signals on PC130-332 TP4 and on PC130-333 Pin E and comparing the signal on PC130-332 TP1. Is the transmitter, transmission medium or receiver faulted?"], "jumps": ["P2010"]}, {"id": "P2021", "text": [], "jumps": []}, {"id": "P2022", "text": ["The output of the transmitter is incorrect. This means that the transmission medium will not operate correctly even if not faulted.", "TP4, PC130-332 TP1, PC130-333 IC2 Pin 2, PC130-333"], "jumps": []}, {"id": "P2023", "text": ["The output of the transmitter is incorrect. This means that the receiver will not operate correctly even if not faulted.", "TP4, PC130-332 TP1, PC130-333 IC2 Pin 2, PC130-333"], "jumps": []}, {"id": "P2030", "text": ["3.  Determine the faulted circuit in the transmitter by measuring           the signals on the IC pins and TPs of PC130-332.  Which                  circuit in the transmitter is faulted?", "3. Determine the faulted circuit in the transmitter by measuring the signals on the IC pins and TPs of PC130-332. Which circuit in the transmitter is faulted?"], "jumps": ["P2020", "P1045"]}, {"id": "P2031", "text": [], "jumps": []}, {"id": "P2032", "text": ["The signal on IC1 pin 9 is correct, output of modulator.  The signal is an inverted DM signal.  The modulator is not faulted.", "The signal on IC1 pin 9 is correct, output of modulator. The signal is an inverted DM signal. The modulator is not faulted.", "IC1 Pin 9, PC130-332 IC1 Pin 13, PC130-333 IC2 Pin 3, PC130-333"], "jumps": []}, {"id": "P2033", "text": ["The signal TP2 is correct.  The clock circuit of IC2c and IC2b is not faulted.", "The signal TP2 is correct. The clock circuit of IC2c and IC2b is not faulted.", "Volt/Div = 5 Time/Div = 5ms Coupling = DC", "TP2 - Clock, 36 kHz, 10 Vpp Squarewaveeeeeee"], "jumps": []}, {"id": "P2034", "text": ["The signal on TPs 3, 5 and 6 are correct.  The filters are not faulted.", "The signal on TPs 3, 5 and 6 are correct. The filters are not faulted.", "Volt/Div = 1 Time/Div = - Coupling = DC TP3 = Filter Signal, +16 VDC", "Volt/Div = .5 Time/Div = .2 mS Coupling = AC TP5 = RC Time Constant Waveform, Triangle", "Volt/Div = 1 Time/Div = .2 mS Coupling = AC TP6 = Filter Signal, Triangle"], "jumps": []}, {"id": "P2040", "text": ["Which IC or component is most likely to cause the fault?", "Which IC or component is most likely to cause the fault?..."], "jumps": ["P2030"]}, {"id": "P2041", "text": [], "jumps": []}, {"id": "P2042", "text": ["You should have measured a correct signal on IC1 pin 9, output of  modulator.  This indicates that IC1 is operating correctly.", "You should have measured a correct signal on IC1 pin 9, output of modulator. This indicates that IC1 is operating correctly.", "IC1 Pin 9, PC130-332 IC1 Pin 13, PC130-333 IC2 Pin 3, PC130-333"], "jumps": []}, {"id": "P2043", "text": ["You should have measured a correct signal on TPs 3, 5 and 6 of PC130-332.  This indicates that the filter circuits of IC3/IC4 are operating correctly.", "Congratulations, you determined that the fault is the output inverter, IC2a.", "You should have measured a correct signal on TPs 3, 5 and 6 of PC130-332. This indicates that the filter circuits of IC3/IC4 are operating correctly.", "Volt/Div = 1 Time/Div = - Coupling = DC TP3 = Filter Signal, +16 VDC", "Volt/Div = .5 Time/Div = .2 mS Coupling = AC TP5 = RC Time Constant Waveform, Triangle", "Volt/Div = 1 Time/Div = .2 mS Coupling = AC TP6 = Filter Signal, Triangle"], "jumps": ["P2050", "P2040"]}, {"id": "P2050", "text": ["In this case, IC2a was not receiving an input."], "jumps": ["P2060", "P2044"]}, {"id": "P2060", "text": ["The computer will now remove the fault.  Check the output of the receiver on PC130-333 TP6 and verify the DM system is operating correctly.", "The computer will now remove the fault. Check the output of the receiver on PC130-333 TP6 and verify the DM system is operating correctly."], "jumps": ["P2044"]}, {"id": "P3000", "text": ["The DM system may or may not be faulted, you must check using the oscilloscope."], "jumps": []}, {"id": "P3010", "text": ["1.   Measure the input signal of the transmitter on PC130-332 TP1        and the output signal of the receiver on PC130-333 TP6 to               determine if the DM system is operating correctly.                              Is the DM system operating correctly?", "1. Measure the input signal of the transmitter on PC130-332 TP1 and the output signal of the receiver on PC130-333 TP6 to determine if the DM system is operating correctly. Is the DM system operating correctly?"], "jumps": ["P3000"]}, {"id": "P3011", "text": [], "jumps": []}, {"id": "P3012", "text": ["The output signal of the receiver is incorrect, it does not match the input signal to the transmitter.  The DM system is not operating correctly.", "The output signal of the receiver is incorrect, it does not match the input signal to the transmitter. The DM system is not operating correctly."], "jumps": []}, {"id": "P3020", "text": ["2.  Determine if the transmitter, transmission medium or receiver        is faulted by measuring the signals on PC130-332 TP4 and on       PC130-333 Pin E and comparing the signal on PC130-332 TP1.      Is the transmitter, transmission medium or receiver faulted?", "2. Determine if the transmitter, transmission medium or receiver is faulted by measuring the signals on PC130-332 TP4 and on PC130-333 Pin E and comparing the signal on PC130-332 TP1. Is the transmitter, transmission medium or receiver faulted?"], "jumps": ["P3010"]}, {"id": "P3021", "text": [], "jumps": []}, {"id": "P3022", "text": ["The output of the transmitter is incorrect. This means that the transmission medium will not operate correctly even if not faulted.", "TP4, PC130-332 TP1, PC130-333 IC2 Pin 2, PC130-333"], "jumps": []}, {"id": "P3023", "text": ["The output of the transmitter is incorrect. This means that the receiver will not operate correctly even if not faulted.", "TP4, PC130-332 TP1, PC130-333 IC2 Pin 2, PC130-333"], "jumps": []}, {"id": "P3030", "text": ["3.  Determine the faulted circuit in the transmitter by measuring          the signals on the IC pins and TPs of PC130-332.  Which                  circuit in the transmitter is faulted?", "3. Determine the faulted circuit in the transmitter by measuring the signals on the IC pins and TPs of PC130-332. Which circuit in the transmitter is faulted?"], "jumps": ["P3020", "P1045"]}, {"id": "P3031", "text": [], "jumps": []}, {"id": "P3032", "text": ["The signal TP2 is correct. The clock circuit is not faulted.", "The signal TP2 is correct. The clock circuit is not faulted..", "Volt/Div = 5 Time/Div = 5ms Coupling = DC", "TP2 - Clock, 36 kHz, 10 Vpp Squarewaveeeeeee"], "jumps": []}, {"id": "P3033", "text": ["The signal on TPs 3, 5 and 6 may be incorrect.  However, there is another problem in the circuit that would cause incorrect signals. The filter circuits are probably not faulted.", "The signal on TPs 3, 5 and 6 may be incorrect. However, there is another problem in the circuit that would cause incorrect signals. The filter circuits are probably not faulted..", "Volt/Div = 1 Time/Div = - Coupling = DC TP3 = Filter Signal, +16 VDC", "Volt/Div = .5 Time/Div = .2 mS Coupling = AC TP5 = RC Time Constant Waveform, Triangle", " let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
