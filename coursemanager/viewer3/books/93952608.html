const book = {"title": "93952608", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: RESONANT CIRCUIT TROUBLESHOOTINGd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Identify an open component in a resonant circuit. w Identify a shorted component in a resonant circuit. w Identify a changed value component in a resonant circuit.", "w Observe the effects of an open component in a series and parallel resonant circuit. w Observe the effects of a shorted component in a series and parallel resonant circuit......"], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 470 Oscilloscope rXXXXXXXXXXnt"], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P335", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about troubleshooting series and parallel resonant circuits."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Troubleshooting a resonant circuit requires identifying the circuit as faulty and then isolating the fault to the failed component.", "Troubleshooting a resonant circuit requires identifying the circuit as faulty and then isolating the fault to the failed component........"], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Voltage measurements across the circuit's resistor can quickly determine if the circuit is operating correctly."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Resistance measurements isolate and verify the fault to one of the three components."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on RESONANT CIRCUIT TROUBLESHOOTING.................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": ["P440"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The three most common faults in a resonant circuit are the same as in other LCR circuits. A resonant circuit is an LCR circuit."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["However, due to the characteristics of resonance, the troubleshooting techniques are simpler.  You do not have to calculate individual component voltage drops.", "However, due to the characteristics of resonance, the troubleshooting techniques are simpler. You do not have to calculate individual component voltage drops."], "jumps": ["P1035", "P1020"]}, {"id": "P1035", "text": ["Calculating the resonant frequency is all that is required."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The  effects on the circuit of an open, short, or changed value component depend on whether the components are in series or in parallel.", "The effects on the circuit of an open, short, or changed value component depend on whether the components are in series or in parallel..."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Let's discuss series resonant circuit faults first."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["This series circuit produces a voltage drop across R based on the frequency of the applied voltage."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["In a series circuit, Er is maximum at the resonant frequency.  This means that if we find the point at which Er is maximum, then the frequency that we measure at that point is the resonant frequency.", "In a series circuit, Er is maximum at the resonant frequency. This means that if we find the point at which Er is maximum, then the frequency that we measure at that point is the resonant frequency..."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["Comparing the calculated resonant frequency with the measured frequency, checks for normal operation.", "Comparing the calculated resonant frequency with the measured frequency, checks for normal operation..r normal operation."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["Observing that Er decreases as the frequency deviates from the resonant frequency checks for normal operation...................."], "jumps": ["P1100", "P1060"]}, {"id": "P1100", "text": ["If one of the components opens, current flow in the series circuit stops."], "jumps": ["P1110", "P1060"]}, {"id": "P1110", "text": ["Voltage measurements quickly identify which component is open."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["The open component measures the applied voltage and the other components measure 0 V."], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["Recall that in theory, ignoring the voltage drop across the inductor due to its' coil resistance, Er measures the applied voltage at resonance."], "jumps": ["P1140", "P1100"]}, {"id": "P1140", "text": ["However, the inductor and capacitor do not measure 0V if the circuit is operating correctly.", "However, the inductor and capacitor do not measure 0V if the circuit is operating correctly.o"], "jumps": ["P1150", "P1100"]}, {"id": "P1150", "text": ["Resistance measurements are made to verify that the component is open."], "jumps": ["P1160", "P1100"]}, {"id": "P1160", "text": ["Remember that in a series circuit, an open stops current flow and the open component measures the applied voltage."], "jumps": ["P1170", "P1100"]}, {"id": "P1170", "text": ["If one of the reactive components (L or C) shorts, the circuit no longer behaves like an LCR circuit. It effectively becomes either RL or RC, and resonance is no longer a factor.", "If one of the reactive components (L or C) shorts, the circuit no longer behaves like an LCR circuit. It effectively becomes either RL or RC, and resonance is no longer a factor.."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["The voltage across the resistor will not decrease as the frequency increases above resonance if the inductor is shorted. stead, the voltage will act as it does in an RC circuit. It will start at minimum, at lower frequencies, and will increase to a maximum as frequency increases."], "jumps": ["P1181", "P1170"]}, {"id": "P1181", "text": ["Instead, the voltage will act as it does in an RC circuit. At lower frequencies it will start at minimum and will increase to a maximum as frequency increases. frequency increases.. will start at minimum, at lower frequencies, and will increase to a maximum as frequency increases."], "jumps": ["P1182", "P1180"]}, {"id": "P1182", "text": ["If the capacitor is shorted, the voltage across the resistor will not decrease as frequency drops below resonance.d, the voltage will act as it does in an RL circuit. it will start at maximum, at lower frequencies, and will decrease to a minimum as frequency increases."], "jumps": ["P1183", "P1180"]}, {"id": "P1183", "text": ["At lower frequencies it will start at maximum and will decrease to a minimum as frequency increases.frequency increases..voltage will act as it does in an RL circuit. it will start at maximum, at lower frequencies, and will decrease to a minimum as frequency increases."], "jumps": ["P1190", "P1182"]}, {"id": "P1190", "text": ["Voltage measurements quickly determine which reactive component is shorted."], "jumps": ["P1200", "P1182"]}, {"id": "P1200", "text": ["The shorted component measures 0V and the other components measure some voltage value."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["If the resistor shorts, its voltage drop measures 0V.  The circuit still has a resonant frequency, but you cannot measure for maximum Er at resonance.", "If the resistor shorts, its voltage drop measures 0V. The circuit still has a resonant frequency, but you cannot measure for maximum Er at resonance."], "jumps": ["P1220", "P1190"]}, {"id": "P1220", "text": ["Resistance measurements are made to verify that the component is shorted. The inductor should measure some small value of resistance."], "jumps": ["P1230", "P1190"]}, {"id": "P1230", "text": ["Remember that in a series circuit, a shorted component measures 0V and the other components measure some value of voltage."], "jumps": ["P1240", "P1190"]}, {"id": "P1240", "text": ["If one of the reactive components (L or C) changes value, the resonant frequency changes.", "If one of the reactive components (L or C) changes value, the resonant frequency changes.."], "jumps": ["P1250", "P1190"]}, {"id": "P1250", "text": ["Er will not be maximum at the correct frequency.", "Er will not be maximum at the correct frequency.."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["To determine which reactive component has changed value, you must use a capacitor or inductor bridge tester."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["If the tester is not available,  replace C and L one at a time until the circuit is operating normally.", "If the tester is not available, replace C and L one at a time until the circuit is operating normally."], "jumps": ["P1280", "P1240"]}, {"id": "P1280", "text": ["If the resistor changes value, you will see little effect. Er is maximum at resonance no matter what the value of R is.."], "jumps": ["P1300", "P1240"]}, {"id": "P1300", "text": ["In this case, a simple resistance measurement across R verifies whether or not the resistor has changed value."], "jumps": ["P1310", "P1280"]}, {"id": "P1310", "text": ["Remember, a changed value component changes circuit values. There is no indication of an open or short."], "jumps": ["P1320", "P1280"]}, {"id": "P1320", "text": ["What is the probable fault in this series LCR circuit?", "What is the probable fault in this series LCR circuit?cuit?"], "jumps": ["P1310"]}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1322", "text": ["A shorted resistor would measure 0 V, however the voltage drops across the inductor and capacitor indicate that the resistor is not shorted."], "jumps": []}, {"id": "P1323", "text": ["A shorted inductor would measure 0 V, however the voltage drops across the capacitor and resistor indicate that the inductor is not shorted."], "jumps": []}, {"id": "P1330", "text": ["What is the probable fault in this series LCR circuit?", "What is the probable fault in this series LCR circuit?cuit?"], "jumps": ["P1320"]}, {"id": "P1331", "text": [], "jumps": []}, {"id": "P1332", "text": ["A changed value R would not change the resonant frequency.", "A changed value R would not change the resonant frequency.."], "jumps": []}, {"id": "P1333", "text": ["Notice that the measured resonant frequency does not match the calculated resonant frequency of 15 kHz.  There is a fault in the circuit.", "Notice that the measured resonant frequency does not match the calculated resonant frequency of 15 kHz. There is a fault in the circuit."], "jumps": []}, {"id": "P1340", "text": ["What is the probable fault in this series LCR circuit?", "What is the probable fault in this series LCR circuit?cuit?"], "jumps": ["P1330"]}, {"id": "P1341", "text": [], "jumps": []}, {"id": "P1342", "text": ["A changed value resistor would not change the characteristics of the circuit at resonance.  Look at the value of Er on the graph, Er does not decrease ABOVE and BELOW resonance.", "A changed value resistor would not change the characteristics of the circuit at resonance. Look at the value of Er on the graph, Er does not decrease ABOVE and BELOW resonance.."], "jumps": []}, {"id": "P1343", "text": ["An open inductor would measure the applied voltage because current would not flow in the circuit.  R would measure 0 V.", "An open inductor would measure the applied voltage because current would not flow in the circuit. R would measure 0 V."], "jumps": []}, {"id": "P1350", "text": ["Now, let's discuss faults in a parallel resonant circuit.", "Now, let's discuss faults in a parallel resonant circuit..."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["This parallel circuit produces a voltage drop across the sampling resistor based on the frequency of the applied voltage."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["In this circuit, Ers is minimum at the resonant frequency.", "In this circuit, Ers is minimum at the resonant frequency.uency."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["With Ers at minimum, comparing the measured frequency with the calculated resonant frequency checks for normal operation.", "With Ers at minimum, comparing the measured frequency with the calculated resonant frequency checks for normal operation..............................."], "jumps": ["P1390", "P1360"]}, {"id": "P1390", "text": ["Observing the fact that Ers increases as the frequency deviates from the resonant frequency provides another check for normal operation."], "jumps": ["P1400", "P1360"]}, {"id": "P1400", "text": ["If one of the reactive components (L or C) opens, the circuit is no longer an LCR circuit and resonance is no longer a factor."], "jumps": ["P1410", "P1360"]}, {"id": "P1410", "text": ["The voltage drop across the sampling resistor does not fall to a minimum at resonance as we would expect from a parallel LCR circuit."], "jumps": ["P1400", "P1420"]}, {"id": "P1420", "text": ["An open capacitor produces an RL circuit.  Ers decreases when frequency increases because XL increases.", "An open capacitor produces an RL circuit. Ers decreases when frequency increases because XL increases."], "jumps": ["P1430", "P1400"]}, {"id": "P1430", "text": ["An open inductor produces an RC circuit.  Ers increases when frequency increases because Xc decreases.", "An open inductor produces an RC circuit. Ers increases when frequency increases because Xc decreases."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["Breaking the circuit and making current measurements verifies the open reactive component."], "jumps": ["P1450", "P1420"]}, {"id": "P1450", "text": ["Current does not flow through an open component.  The branch that has the open measures 0 A current.", "Current does not flow through an open component. The branch that has the open measures 0 A current."], "jumps": ["P1460", "P1420"]}, {"id": "P1460", "text": ["Resistance measurements also verify the open.  Note, capacitors normally measure infinite resistance.", "Resistance measurements also verify the open. Note, capacitors normally measure infinite resistance."], "jumps": ["P1470", "P1420"]}, {"id": "P1470", "text": ["If the resistor is open, the circuit becomes a tank circuit.  The voltage drop across Rs indicates a resonant circuit.", "If the resistor is open, the circuit becomes a tank circuit. The voltage drop across Rs indicates a resonant circuit."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["Resistance measurements determine if the resistor is open.", "Resistance measurements determine if the resistor is open.K"], "jumps": ["P1490", "P1470"]}, {"id": "P1490", "text": ["Remember, in a parallel circuit an open stops current flow in the branch."], "jumps": ["P1500", "P1470"]}, {"id": "P1500", "text": ["If one of the components shorts (L, C, or R), the entire LCR circuit is shorted."], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["The voltage across the sampling resistor measures the applied voltage at all frequencies."], "jumps": ["P1520", "P1500"]}, {"id": "P1520", "text": ["After opening the circuit, resistance measurements determine the shorted component.  Note, an inductor should measure some small value of resistance.", "After opening the circuit, resistance measurements determine the shorted component. Note, an inductor should measure some small value of resistance."], "jumps": ["P1530", "P1500"]}, {"id": "P1530", "text": ["Remember, in a parallel circuit a shorted component shorts the entire LCR circuit.", "Remember, in a parallel circuit a shorted component shorts the entire LCR circuit.."], "jumps": ["P1540", "P1500"]}, {"id": "P1540", "text": ["If one of the reactive components (L or C) changes value, the resonant frequency changes.", "If one of the reactive components (L or C) changes value, the resonant frequency changes.."], "jumps": ["P1550", "P1530"]}, {"id": "P1550", "text": ["Ers would not be minimum at the correct frequency."], "jumps": ["P1560", "P1540"]}, {"id": "P1560", "text": ["To determine which reactive component has changed value, you must use a capacitor or inductor bridge tester."], "jumps": ["P1570", "P1540"]}, {"id": "P1570", "text": ["If the tester is not available then replace C and L, one at a time, until the circuit is operating normally."], "jumps": ["P1580", "P1540"]}, {"id": "P1580", "text": ["If the resistor changed value, you would see little effect.  Ers is minimum at resonance no matter what the value of R is.", "If the resistor changed value, you would see little effect. Ers is minimum at resonance no matter what the value of R is."], "jumps": ["P1590", "P1540"]}, {"id": "P1590", "text": ["A changed value resistor does not affect the resonant frequency.", "A changed value resistor does not affect the resonant frequency.."], "jumps": ["P1600", "P1540"]}, {"id": "P1600", "text": ["In this case, a simple resistance measurement across R would verify whether or not the resistor had changed value.", "In this case, a simple resistance measurement across R would verify whether or not the resistor had changed value........"], "jumps": ["P1610", "P1540"]}, {"id": "P1610", "text": ["Remember, a changed component value changes circuit values. There is no indication of an open or short.", "Remember, a changed component value changes circuit values. There is no indication of an open or short.."], "jumps": ["P1620", "P1540"]}, {"id": "P1620", "text": ["What is the probable fault in this parallel LCR circuit?", "What is the probable fault in this parallel LCR circuit?cuit?"], "jumps": ["P1610"]}, {"id": "P1621", "text": [], "jumps": []}, {"id": "P1622", "text": ["A shorted resistor would short the entire LCR circuit.  The voltage drop across Rs would be the applied voltage no matter what the frequency was.", "A shorted resistor would short the entire LCR circuit. The voltage drop across Rs would be the applied voltage no matter what the frequency was."], "jumps": []}, {"id": "P1623", "text": ["An open capacitor produces an RL circuit.   As frequency increased, Ers would decrease because XL increases.", "An open capacitor produces an RL circuit. As frequency increased, Ers would decrease because XL increases."], "jumps": []}, {"id": "P1630", "text": ["What is the probable fault in this parallel LCR circuit?", "What is the probable fault in this parallel LCR circuit?cuit?"], "jumps": ["P1620"]}, {"id": "P1631", "text": [], "jumps": []}, {"id": "P1632", "text": ["An open inductor would cause the voltage drop across Rs to increase when frequency increased due to Xc decreasing in value."], "jumps": []}, {"id": "P1633", "text": ["An open capacitor would cause the voltage drop across Rs to decrease when frequency increased due to XL increasing in value."], "jumps": []}, {"id": "P1640", "text": ["What is the probable fault in this parallel LCR circuit?", "What is the probable fault in this parallel LCR circuit?cuit?"], "jumps": ["P1630"]}, {"id": "P1641", "text": [], "jumps": []}, {"id": "P1642", "text": ["A changed value resistor would not change the characteristics of the circuit at resonance.  Look at the value of Ers and frequency on the graph.", "A changed value resistor would not change the characteristics of the circuit at resonance. Look at the value of Ers and frequency on the graph.aph."], "jumps": []}, {"id": "P1643", "text": ["An open inductor changes the circuit from LCR to RC.  An RC circuit does not have resonance so  there is no minimum value for Ers at resonance.", "An open inductor changes the circuit from LCR to RC. An RC circuit does not have resonance so there is no minimum value for Ers at resonance.ecause an RC circuit does not have resonance..................................."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on RESONANT CIRCUIT FAULTS.", "This completes the information on RESONANT CIRCUIT FAULTS.."], "jumps": ["P1001", "P1640"]}, {"id": "P1920", "text": ["1.  Opens, shorts, and changed value components are the                   common faults found in resonant circuits.", "1. Opens, shorts, and changed value components are the common faults found in resonant circuits...."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.   In a resonant series circuit, an open component measures\n      the applied voltage.", "2. In a resonant series circuit, an open component measures the applied voltage."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  In resonant series circuits, a shorted reactive component                eliminates the effect of resonance.   0 V is measured across            the shorted component.", "3. In resonant series circuits, a shorted reactive component eliminates the effect of resonance. 0 V is measured across the shorted component......."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["3.  In resonant series circuits, a shorted reactive component                eliminates the effect of resonance.   0V is measured across the      shorted component.", "3. In resonant series circuits, a shorted reactive component eliminates the effect of resonance. 0V is measured across the shorted component.."], "jumps": ["P1960", "P1930"]}, {"id": "P1960", "text": ["4.  In a resonant parallel circuit, an open reactive component               eliminates resonance.  A circuit with an open L acts like RC,           and one with an open C acts like RL.", "4. In a resonant parallel circuit, an open reactive component eliminates resonance. A circuit with an open L acts like RC, and one with an open C acts like RL..........."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["5.   In a resonant parallel circuit, a shorted component shorts the        entire LCR circuit.", "5. In a resonant parallel circuit, a shorted component shorts the entire LCR circuit..."], "jumps": ["P1999", "P1960"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.."], "jumps": ["P1001", "P1970"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["The purpose of this experiment is to observe the effect of opens and shorts in series and parallel resonant circuits."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["You will use both PC130-18A and PC130-20A cards in this experiment.", "Pick up the PC130-18A card.  This card is used to troubleshoot series resonant circuits.", "Pick up the PC130-18A card. This card is used to troubleshoot series resonant circuits."], "jumps": ["P2050", "P2020", "P2060", "P2040"]}, {"id": "P2060", "text": ["Compare the card with the schematic shown."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["Notice that there are four LCR series circuits labeled A, B, C, and D."], "jumps": ["P2080", "P2050"]}, {"id": "P2080", "text": ["When S1 through S4 are positioned to the right (closed), they connect an LCR circuit to the input."], "jumps": ["P2090", "P2050"]}, {"id": "P2090", "text": ["Pick up the PC130-20A card.  This card is used to troubleshoot  parallel resonant circuits.", "Pick up the PC130-20A card. This card is used to troubleshoot parallel resonant circuits."], "jumps": ["P2100", "P2050"]}, {"id": "P2100", "text": ["Compare the card with the schematic shown."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["Notice that there are four LCR parallel circuits labeled A, B, C, and D."], "jumps": ["P2120", "P2090"]}, {"id": "P2120", "text": ["When S1 through S4 are positioned to the right (closed), they connect an LCR circuit to the input."], "jumps": ["P2130", "P2090"]}, {"id": "P2130", "text": ["Notice that there is not a  parallel resistor, the circuit is a tank with a sampling resistor.", "Notice that there is not a parallel resistor, the circuit is a tank with a sampling resistor."], "jumps": ["P2140", "P2090"]}, {"id": "P2140", "text": ["Let's start the experiment by first setting up and then troubleshooting series resonant circuits."], "jumps": ["P2150", "P2090"]}, {"id": "P2150", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2140"]}, {"id": "P2160", "text": ["2.  Carefully plug PC130-18A into the test console PC1 position. \n3.  Place S1 through S4 on PC130-18A to the left.", "2. Carefully plug PC130-18A into the test console PC1 position. 3. Place S1 through S4 on PC130-18A to the left...e PC3 Speaker switch to ON........................................."], "jumps": ["P2150", "P2165"]}, {"id": "P2165", "text": ["EXPERIMENT CARD PLACEMENT - PC130-18A shown in PC1 position.", "MEASUREMENT SETUP - Carefully place S1 through S4 to the left (Open)."], "jumps": ["P2166", "P2160", "P2165", "P"]}, {"id": "P2170", "text": ["4.  Set up the oscilloscope to measure voltage dro he oscilloscope CH1 probe to TP14 and the CH2              probe to TP1 on PC130-18A. \n8.  Adjust the output of the function generator for 5 Vpp at 10 kHz      as measured on the oscilloscope.  Set the TIME/DIV control as      necessary to display at least two cycles.", "7. Connect the oscilloscope CH1 probe to TP14 and the CH2 probe to TP1 on PC130-18A. 8. Adjust the output of the function generator for 5 Vpp at 10 kHz as measured on the oscilloscope. Set the TIME/DIV control as necessary to display at least two cycles.", "MEASUREMENT SETUP - Carefully connect CH1 probe to TP14. Carefully connect CH2 probe to TP1."], "jumps": ["P2200", "P2180", "P2195"]}, {"id": "P2200", "text": ["Now that the circuit is set up, let's verify that circuit A is operating correctly before inserting a fault."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["Calculate the resonant frequency of circuit A.  What is the calculated resonant frequency? Round to the nearest tenth of a  kHertz.", "Calculate the resonant frequency of circuit A. What is the calculated resonant frequency? Round to the nearest tenth of a kHertz."], "jumps": ["P2200", "P2212", "P2215"]}, {"id": "P2211", "text": [], "jumps": []}, {"id": "P2212", "text": ["Your calculations are incorrect.  Remember the formula and be sure you are taking the square root of the powers of ten correctly.", "Your calculations are incorrect. Remember the formula and be sure you are taking the square root of the powers of ten correctly."], "jumps": []}, {"id": "P2213", "text": ["Your calculations are still incorrect.  You should have calculated approximately 50.4 kHz.", "Your calculations are still incorrect. You should have calculated approximately 50.4 kHz.", "1 1", "o = = 2p LC 2p (2.5 x 10-3) (.004 x 10-6) 1 1 = = 6.28 .01 x 10-9 6.28 .1 x 10-10 1 1 = = = 50.4 kHz 6.28 (.32 x 10-5) 1.98 x 10-5 .32 x 10-5) 1.98 x 105"], "jumps": ["P2220", "P2210"]}, {"id": "P2215", "text": ["RESONANT FREQUENCY - Calculate resonant frequency using this formula.", "1 1", "o = = 2p LC 6.28 2.5 mH x .004 mF 1 1 = = 6.28 .01 x 10-9 6.28 .1 x 10-10 1 1 = = = 50.4 kHz 6.28 (.32 x 10-5) 1.98 x 105 105 .32 x 10-5) 1.98 x 105"], "jumps": []}, {"id": "P2220", "text": ["Next, measure the resonant frequency. \n1.  Set S1 on PC130-18A to the right.  This applies power to\n     circuit  A.\n2.  Connect the CH1 probe to TP4 and the CH2 probe to TP1.         \n     This measures the voltage drop across R1.", "Next, measure the resonant frequency. 1. Set S1 on PC130-18A to the right. This applies power to circuit A. 2. Connect the CH1 probe to TP4 and the CH2 probe to TP1. This measures the voltage drop across R1.", "MEASUREMENT SETUP - Set S1 to the right (Closed). Carefully connect CH1 probe to TP4. Carefully connect CH2 probe to TP1."], "jumps": ["P2230", "P2210", "P2225"]}, {"id": "P2230", "text": ["3.  Adjust the frequency of the function generator until Er1 is               maximum.  The frequency indicated on the function generator       should be approximately 50.4 kHz.  The circuit is operating             correctly.", "3. Adjust the frequency of the function generator until Er1 is maximum. The frequency indicated on the function generator should be approximately 50.4 kHz. The circuit is operating correctly."], "jumps": ["P2238", "P2220", "P2235"]}, {"id": "P2235", "text": ["- PC130-18A S1 to the right - Oscilloscope connected across R1, CH1 to TP4, CH2 to TP1 - Oscilloscope set up for the ADD display and CH2 input inverted inverted", "MEASUREMENT SETUP - If the frequency of the function generator is incorrect, check your setup."], "jumps": []}, {"id": "P2238", "text": ["The computer will now insert a fault into circuit A.", "The computer will now insert a fault into circuit A. ternal program = SCAN FTR 0 F1 132 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2230"]}, {"id": "P2240", "text": ["4. Ensure that CH1 is connected to TP4 and CH2 is connected to TP1 on PC130-18A. Notice that you are now measuring 0 V across the resistor. Changing the input frequency does not change the reading."], "jumps": ["P2250", "P2238"]}, {"id": "P2250", "text": ["This indicates that R1 is shorted or, L1 or C1 is open.  Additional voltage measurements will determine the fault.", "This indicates that R1 is shorted or, L1 or C1 is open. Additional voltage measurements will determine the fault."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["5.  Ensure the function generator is set to 50.4 kHz.\n6.  Connect CH1 probe to TP2 on PC130-18A. \n7.  Connect CH2 probe to TP3 on PC130-18A.  This measures the       voltage across C1.", "5. Ensure the function generator is set to 50.4 kHz. 6. Connect CH1 probe to TP2 on PC130-18A. 7. Connect CH2 probe to TP3 on PC130-18A. This measures the voltage across C1."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["Note that you measured close to 0 V (approx. .3 V).  Both R1 and C1 measure 0 V.  The fault is probably an open L1.   If L1 was open, the voltage across it would measure the applied voltage. Let's check.", "Note that you measured close to 0 V (approx. .3 V). Both R1 and C1 measure 0 V. The fault is probably an open L1. If L1 was open, the voltage across it would measure the applied voltage. Let's check."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["8.  Connect CH1 probe to TP3 on PC130-18A.\n9.  Connect CH2 probe to TP4 on PC130-18A. \n     Notice that the voltage across L1 is approximately the applied       voltage.", "8. Connect CH1 probe to TP3 on PC130-18A. 9. Connect CH2 probe to TP4 on PC130-18A. Notice that the voltage across L1 is approximately the applied voltage.........", "MEASUREMENT SETUP - Carefully connect CH1 probe to TP3. Carefully connect CH2 probe to TP4."], "jumps": ["P2290", "P2270", "P2285"]}, {"id": "P2290", "text": ["Measuring the resistance of L1 will verify that it is open.\n10.  Place S1 to the left on PC130-18A. \n11.  Measure the resistance of L1 using a multimeter placed                   across TP3 and TP4.", "Measuring the resistance of L1 will verify that it is open. 10. Place S1 to the left on PC130-18A. 11. Measure the resistance of L1 using a multimeter placed across TP3 and TP4.", "MEASUREMENT SETUP - Measure the resistance across L1 at TP3 and TP4. Place S1 to the left (Open)."], "jumps": ["P2300", "P2280", "P2295"]}, {"id": "P2300", "text": ["Note that the resistance measures infinity, L1 is open.", "Note that the resistance measures infinity, L1 is open....."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["The computer will now replace L1.", "The computer will now replace L1. ternal program = SCAN FTR 0 C1 00 ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2300"]}, {"id": "P2320", "text": ["12. Place S1 to the right on PC130-18A to reapply power. 13. Connect CH1 probe to TP4 and CH2 probe to TP1 on PC130-18A, across R1. 14. Vary the frequency of the function generator to check for normal operation. Notice that Er1 is maximum at 50.4 kHz, the circuit is operating normally.", "MEASUREMENT SETUP - Place S1 to the right (closed). Carefully connect CH1 probe to TP4. Carefully connect CH2 probe to TP1."], "jumps": ["P2330", "P2310", "P2325"]}, {"id": "P2330", "text": ["15.  Place S1 to the left on PC130-18A and remove the probes.               Now,  let's check out circuit B before the computer inserts              another fault.", "15. Place S1 to the left on PC130-18A and remove the probes. Now, let's check out circuit B before the computer inserts another fault."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["Calculate the resonant frequency of circuit B.  What is the calculated resonant frequency? Round to the nearest tenth of a kHertz", "Calculate the resonant frequency of circuit B. What is the calculated resonant frequency? Round to the nearest tenth of a kHertz"], "jumps": ["P2330", "P2345", "P2342"]}, {"id": "P2341", "text": [], "jumps": []}, {"id": "P2342", "text": ["Your calculations are incorrect.   Remember the formula and be sure you are taking the square root of the powers of ten correctly.", "Your calculations are incorrect. Remember the formula and be sure you are taking the square root of the powers of ten correctly."], "jumps": []}, {"id": "P2343", "text": ["Your calculations are still incorrect.  You should have calculated approximately 29.0 kHz.", "Your calculations are still incorrect. You should have calculated approximately 29.0 kHz.", "1 1", "o = = 2p LC 2p (10 x 10-3) (.003 x 10-6) 1 1 = = 6.28 .03 x 10-9 6.28 .3 x 10-10 1 1 = = = 29 kHz 6.28 (.55 x 10-5) 3.44 x 10-5 105 .32 x 10-5) 1.98 x 105"], "jumps": ["P2350", "P2340"]}, {"id": "P2345", "text": ["RESONANT FREQUENCY - Calculate resonant frequency using this formula.", "1 1", "o = = 2p LC 6.28 10 mH x .003 mF 1 1 = = 6.28 .01 x 10-9 6.28 .1 x 10-10 1 1 = = = 50.4 kHz 6.28 (.32 x 10-5) 1.98 x 105 105 .32 x 10-5) 1.98 x 105"], "jumps": []}, {"id": "P2350", "text": ["Next, measure the resonant frequency. \n1.  Set S2 on PC130-18A to the right. This applies power to\n     circuit B.  \n2.  Connect the CH1 probe to TP7 and the CH2 probe to TP1.               This measures the voltage drop across R2.", "Next, measure the resonant frequency. 1. Set S2 on PC130-18A to the right. This applies power to circuit B. 2. Connect the CH1 probe to TP7 and the CH2 probe to TP1. This measures the voltage drop across R2.", "MEASUREMENT SETUP - Place S2 to the right (closed). Carefully connect CH1 probe to TP7. Carefully connect CH2 probe to TP1."], "jumps": ["P2360", "P2340", "P2355"]}, {"id": "P2360", "text": ["3.  Adjust the frequency of the function generator until Er2 is               maximum.  The frequency indicated on the function generator       should be approximately 29.0 kHz.  The circuit is operating             correctly.", "3. Adjust the frequency of the function generator until Er2 is maximum. The frequency indicated on the function generator should be approximately 29.0 kHz. The circuit is operating correctly.."], "jumps": ["P2370", "P2350", "P2365"]}, {"id": "P2365", "text": ["- PC130-18A S2 to the right - Oscilloscope connected across R2, CH1 to TP7, CH2 to TP1 - Oscilloscope set up for the ADD display and CH2 input inverted inverted", "MEASUREMENT SETUP - If the frequency of the function generator is incorrect, check your setup."], "jumps": []}, {"id": "P2370", "text": ["The computer will now insert a fault into circuit B.", "The computer will now insert a fault into circuit B. ternal program = SCAN FTR 0 F1 042 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2360"]}, {"id": "P2380", "text": ["4.  Ensure that CH1 is connected to TP7 and CH2 is connected to      TP1 on PC130-18A.  Notice that you are not measuring                     maximum voltage across the resistor at resonance.  In fact, as       frequency decreases, Er2 increases.  Decrease the frequency       and observe Er2 increasing.", "4. Ensure that CH1 is connected to TP7 and CH2 is connected to TP1 on PC130-18A. Notice that you are not measuring maximum voltage across the resistor at resonance. In fact, as frequency decreases, Er2 increases. Decrease the frequency and observe Er2 increasing.."], "jumps": ["P2390", "P2370"]}, {"id": "P2390", "text": ["This indicates that the circuit is no longer a resonant circuit. There must be a short in L2 or C2.   Additional voltage measurements will determine the fault.", "This indicates that the circuit is no longer a resonant circuit. There must be a short in L2 or C2. Additional voltage measurements will determine the fault.", "L2 or C2 open - Er2 measures 0 V R2 shorted - Er2 measures 0 V R2 open - Er2 measures Ea et up for the ADD display and CH2 input inverted inverted"], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["5.  Ensure the function generator is set to 29.0 kHz.\n6.  Connect CH1 probe to TP5 on PC130-18A.  \n7.  Connect CH2 probe to TP6 on PC130-18A. \n     This measures the voltage across C2.", "5. Ensure the function generator is set to 29.0 kHz. 6. Connect CH1 probe to TP5 on PC130-18A. 7. Connect CH2 probe to TP6 on PC130-18A. This measures the voltage across C2.", "MEASUREMENT SETUP - Carefully connect CH1 probe to TP5. Carefully connect CH2 probe to TP6."], "jumps": ["P2410", "P2390", "P2405"]}, {"id": "P2410", "text": ["Note that you are measuring approximately 0 V.  The fault is probably a shorted C2.", "Note that you are measuring approximately 0 V. The fault is probably a shorted C2."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["To verify, measure the resistance. \n10.  Place S2 to the left on PC130-18A. \n11.  Measure the resistance of C2 using a multimeter connected           across TP5 and TP6.", "To verify, measure the resistance. 10. Place S2 to the left on PC130-18A. 11. Measure the resistance of C2 using a multimeter connected across TP5 and TP6.", "MEASUREMENT SETUP - Place S2 to the left (Open)."], "jumps": ["P2430", "P2410", "P2425"]}, {"id": "P2430", "text": ["Note that the resistance measures 0 ohms, C2 is shorted.", "Note that the resistance measures 0 ohms, C2 is shorted...."], "jumps": ["P2440", "P2420"]}, {"id": "P2440", "text": ["The computer will now replace C2.", "The computer will now replace C2. ternal program = SCAN FTR 0 C1 00 ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2430"]}, {"id": "P2450", "text": ["12. Place S2 to the right on PC130-18A to reapply power. 13. Connect CH1 probe to TP7 and CH2 probe to TP1 on PC130-18A, across R2. 14. Vary the frequency of the function generator to check for normal operation. Notice that Er2 is maximum at 29.0 kHz, the circuit is operating normally...........", "MEASUREMENT SETUP - Place S2 to the right (closed). Carefully connect CH1 probe to TP7. Carefully connect CH2 probe to TP1."], "jumps": ["P2460", "P2440", "P2455"]}, {"id": "P2460", "text": ["15.  Place S2 on PC130-18A to the left and remove probes.  Next,          you will troubleshoot a parallel resonant circuit.", "15. Place S2 on PC130-18A to the left and remove probes. Next, you will troubleshoot a parallel resonant circuit."], "jumps": ["P2470", "P2450"]}, {"id": "P2470", "text": ["1.  Turn power OFF to the function generator. \n2.  Carefully remove PC130-18A from the Test Consoles PC1               position.\n3.  Carefully plug PC130-20A into the Test Console PC1 position.", "1. Turn power OFF to the function generator. 2. Carefully remove PC130-18A from the Test Consoles PC1 position. 3. Carefully plug PC130-20A into the Test Console PC1 position..."], "jumps": ["P2475", "P2460"]}, {"id": "P2475", "text": ["4.  Place switches S1 through S4 to the left on PC130-20A. \n5.  Turn power ON to the function generator.", "4. Place switches S1 through S4 to the left on PC130-20A. 5. Turn power ON to the function generator......"], "jumps": ["P2480", "P2470"]}, {"id": "P2480", "text": ["Now that the circuit is set up, let's verify that circuit A is operating correctly before inserting a fault."], "jumps": ["P2490", "P2475"]}, {"id": "P2490", "text": ["Calculate the resonant frequency of circuit A. What is the calculated resonant frequency? Round to the nearest tenth of a  kHertz.", "Calculate the resonant frequency of circuit A. What is the calculated resonant frequency? Round to the nearest tenth of a kHertz."], "jumps": ["P2480", "P2492", "P2345"]}, {"id": "P2491", "text": [], "jumps": []}, {"id": "P2492", "text": ["Your calculations are incorrect.   Remember the formula and be sure you are taking the square root of the powers of ten correctly.", "Your calculations are incorrect. Remember the formula and be sure you are taking the square root of the powers of ten correctly."], "jumps": []}, {"id": "P2493", "text": ["Your calculations are still incorrect.  You should have calculated approximately 29.0 kHz.", "Your calculations are still incorrect. You should have calculated approximately 29.0 kHz.", "1 1", "o = = 2p LC 2p (10 x 10-3) (.003 x 10-6) 1 1 = = 6.28 .03 x 10-9 6.28 .3 x 10-10 1 1 = = = 29 kHz 6.28 (.55 x 10-5) 3.44 x 10-5 105 .32 x 10-5) 1.98 x 105"], "jumps": ["P2500", "P2490"]}, {"id": "P2500", "text": ["Next, measure the resonant frequency. \n1.  Set S1 on PC130-20A to the right. This applies power to\n     circuit A.\n2.  Connect the CH1 probe to TP3 and the CH2 probe to TP1.              This measures the voltage drop across R1.", "Next, measure the resonant frequency. 1. Set S1 on PC130-20A to the right. This applies power to circuit A. 2. Connect the CH1 probe to TP3 and the CH2 probe to TP1. This measures the voltage drop across R1........................................."], "jumps": ["P2510", "P2490", "P2505"]}, {"id": "P2505", "text": ["MEASUREMENT SETUP - Place S1 to the right (closed). Carefully place CH1 probe to TP3. Carefully place CH2 probe to TP1."], "jumps": []}, {"id": "P2510", "text": ["3.  Adjust the frequency of the function generator until Er1 is               minimum.  The frequency indicated on the function generator        should be approximately 29.0 kHz.  The circuit is operating             correctly.", "3. Adjust the frequency of the function generator until Er1 is minimum. The frequency indicated on the function generator should be approximately 29.0 kHz. The circuit is operating correctly."], "jumps": ["P2520", "P2500", "P2515"]}, {"id": "P2515", "text": ["- PC130-20A S1 to the right - Oscilloscope connected across R1, CH1 to TP3, CH2 to TP1 - Oscilloscope set up for the ADD display and CH2 input inverted inverted", "MEASUREMENT SETUP - If the frequency of the function generator is incorrect, check your setup."], "jumps": []}, {"id": "P2520", "text": ["The computer will now insert a fault into circuit A.", "The computer will now insert a fault into circuit A. ternal program = SCAN FTR 0 F1 102 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2510"]}, {"id": "P2530", "text": ["4.  Ensure that CH1 is connected to TP3 and CH2 is connected to      TP1 on PC130-20A.  Notice that you are not measuring the              minimum voltage across the resistor.  In fact, as frequency             increases, Er1 decreases.  Increase the frequency and                     observe Er1 decreasing.", "4. Ensure that CH1 is connected to TP3 and CH2 is connected to TP1 on PC130-20A. Notice that you are not measuring the minimum voltage across the resistor. In fact, as frequency increases, Er1 decreases. Increase the frequency and observe Er1 decreasing.."], "jumps": ["P2540", "P2520"]}, {"id": "P2540", "text": ["This indicates that C1 is open. \nL1 open - Er1 decreases as frequency decreases. \nShort - Er1 measures the applied voltage.", "This indicates that C1 is open. L1 open - Er1 decreases as frequency decreases. Short - Er1 measures the applied voltage."], "jumps": ["P2550", "P2530"]}, {"id": "P2550", "text": ["Since there are no switches in the parallel branches to open so that an ammeter can be inserted, current measurements will not be made."], "jumps": ["P2560", "P2540"]}, {"id": "P2560", "text": ["Also, because there are no switches in the parallel branches to open so components can be isolated, resistance measurements will not be made."], "jumps": ["P2570", "P2550"]}, {"id": "P2570", "text": ["So, the computer will replace C1.  If C1 was open, the circuit will now operate correctly.  If C1 was not the fault, the circuit will remain faulted.", "So, the computer will replace C1. If C1 was open, the circuit will now operate correctly. If C1 was not the fault, the circuit will remain faulted. External program = SCAN FTR 0 C1 00"], "jumps": ["P2560"]}, {"id": "P2580", "text": ["5.  Ensure CH1 probe is connected to TP3 and CH2 probe is               connected  to TP1 on PC130-20A, across mula."], "jumps": []}, {"id": "P2610", "text": ["Next, measure the resonant frequency.\n1.  Set S2 on PC130-20A to the right. This applies power to\n     circuit B.  \n2.  Connect the CH1 probe to TP5 and the CH2 probe to TP1.               This measures the voltage drop across R2.", "Next, measure the resonant frequency. 1. Set S2 on PC130-20A to the right. This applies power to circuit B. 2. Connect the CH1 probe to TP5 and the CH2 probe to TP1. This measures the voltage drop across R2."], "jumps": ["P2620", "P2600", "P2615"]}, {"id": "P2615", "text": ["MEASUREMENT SETUP - Place S2 to the right (closed). Carefully place CH1 probe on TP5. Carefully place CH2 probe on TP1."], "jumps": []}, {"id": "P2620", "text": ["3.  Adjust the frequency of the function generator until Er2 is               minimum.  The frequency indicated on the function generator        should be approximately 67.3 kHz.  The circuit is operating             correctly.", "3. Adjust the frequency of the function generator until Er2 is minimum. The frequency indicated on the function generator should be approximately 67.3 kHz. The circuit is operating correctly."], "jumps": ["P2630", "P2610", "P2625"]}, {"id": "P2625", "text": ["- PC130-20A S1 to the right - Oscilloscope connected across R2, CH1 to TP5, CH2 to TP1 - Oscilloscope set up for the ADD display and CH2 input inverted inverted", "MEASUREMENT SETUP - If the frequency of the function generator is incorrect, check your setup."], "jumps": []}, {"id": "P2630", "text": ["The computer will now insert a fault into circuit B.", "The computer will now insert a fault into circuit B. ternal program = SCAN FTR 0 F1 042 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2620"]}, {"id": "P2640", "text": ["4.  Ensure that CH1 is connected to TP5 and CH2 is connected to      TP1 on PC130-20A.  Notice that you are not measuring the              minimum voltage across the resistor.  In fact, you are                        measuring the applied voltage and it does not change when          the frequency changes.  Vary the frequency and observe Er2.", "4. Ensure that CH1 is connected to TP5 and CH2 is connected to TP1 on PC130-20A. Notice that you are not measuring the minimum voltage across the resistor. In fact, you are measuring the applied voltage and it does not change when the frequency changes. Vary the frequency and observe Er2."], "jumps": ["P2650", "P2630"]}, {"id": "P2650", "text": ["This indicates that there is a short in the parallel circuit. \n L2 open - Er2 decreases as frequency decreases.\n C2 open - Er2 increases as frequency decreases.", "This indicates that there is a short in the parallel circuit. L2 open - Er2 decreases as frequency decreases. C2 open - Er2 increases as frequency decreases..."], "jumps": ["P2660", "P2640"]}, {"id": "P2660", "text": ["Since there are no switches in the parallel branches to open so that an ammeter can be inserted, current measurements will not be made."], "jumps": ["P2670", "P2650"]}, {"id": "P2670", "text": ["Also, because there are no switches in the parallel branches to open so components can be isolated, resistance measurements will not be made."], "jumps": ["P2680", "P2660"]}, {"id": "P2680", "text": ["The computer will guess and replace C1.  If C1 was shorted, the circuit will now operate correctly.  If C1 was not the fault, the circuit will remain faulted.", "The computer will guess and replace C1. If C1 was shorted, the circuit will now operate correctly. If C1 was not the fault, the circuit will remain faulted."], "jumps": ["P2690", "P2670"]}, {"id": "P2690", "text": ["5.  Ensure CH1 probe is connected to TP5 and CH2 probe is               connected  to TP1 on PC130-20A, across R1.                                  6.  Vary the frequency of the function generator to check for                normal operation.  Notice that there was no change. The                  same problem is still in the circuit.", " power to circuit      A.                                                                \n2.  Connect the CH1 probe to TP4 and the CH2 probe to TP1.              This measures the voltage drop across R1.", "Next, measure the resonant frequency. 1. Set S1 on PC130-18A to the right. This applies power to circuit A. 2. Connect the CH1 probe to TP4 and the CH2 probe to TP1. This measures the voltage drop across R1..", "MEASUREMENT SETUP - Set S1 to the right (Closed). Carefully connect CH1 probe to TP4. Carefully connect CH2 probe to TP1."], "jumps": ["P13230", "P13210", "P13225"]}, {"id": "P13230", "text": ["3.  Adjust the frequency of the function generator until Er1 is               maximum.  The frequency indicated on the function generator       should be approximately 50.4 kHz.  The circuit is operating             correctly.", "3. Adjust the frequency of the function generator until Er1 is maximum. The frequency indicated on the function generator should be approximately 50.4 kHz. The circuit is operating correctly.."], "jumps": ["P13238", "P13220", "P13235"]}, {"id": "P13235", "text": ["- PC130-18A S1 to the right - Oscilloscope connected across R1, CH1 to TP4, CH2 to TP1 - Oscilloscope set up for the ADD display and CH2 input inverted inverted", "MEASUREMENT SETUP - If the frequency of the function generator is incorrect, check your setup."], "jumps": []}, {"id": "P13238", "text": ["The computer will now insert a fault into circuit A.", "The computer will now insert a fault into circuit A........................"], "jumps": ["P13230"]}, {"id": "P13240", "text": ["4.  Ensure that CH1 is connected to TP4 and CH2 is connected to      TP1 on PC130-18A.  Notice that you are now measuring 0 V            across the resistor.  Changing the input frequency does not           change the reading.", "4. Ensure that CH1 is connected to TP4 and CH2 is connected to TP1 on PC130-18A. Notice that you are now measuring 0 V across the resistor. Changing the input frequency does not change the reading."], "jumps": ["P13250"]}, {"id": "P13250", "text": ["This indicates that R1 is shorted or, L1 or C1 is open.   Additional voltage measurements will determine the fault.", "This indicates that R1 is shorted or, L1 or C1 is open. Additional voltage measurements will determine the fault."], "jumps": ["P13260", "P13240"]}, {"id": "P13260", "text": ["5.  Ensure the function generator is set to 50.4 kHz. \n6.  Connect CH1 probe to TP2 on PC130-18A.                            \n7.  Connect CH2 probe to TP3 on PC130-18A.  This measures the       voltage across C1.", "5. Ensure the function generator is set to 50.4 kHz. 6. Connect CH1 probe to TP2 on PC130-18A. 7. Connect CH2 probe to TP3 on PC130-18A. This measures the voltage across C1."], "jumps": ["P13270", "P13250"]}, {"id": "P13270", "text": ["Note that you measured close to 0 V (approx. .3 V).  Both R1 and C1 measure 0 V.  The fault is probably an open L1.   If L1 was open, the voltage across it would measure the applied voltage. Let's check.", "Note that you measured close to 0 V (approx. .3 V). Both R1 and C1 measure 0 V. The fault is probably an open L1. If L1 was open, the voltage across it would measure the applied voltage. Let's check."], "jumps": ["P13280", "P13260"]}, {"id": "P13280", "text": ["8.  Connect CH1 probe to TP3 on PC130-18A.\n9.  Connect CH2 probe to TP4 on PC130-18A.  Notice that the               voltage across L1 is approximately the applied voltage.", "8. Connect CH1 probe to TP3 on PC130-18A. 9. Connect CH2 probe to TP4 on PC130-18A. Notice that the voltage across L1 is approximately the applied voltage..", "MEASUREMENT SETUP - Carefully connect CH1 probe to TP3. Carefully connect CH2 probe to TP4."], "jumps": ["P13290", "P13270", "P13285"]}, {"id": "P13290", "text": ["Measuring the resistance of L1 will verify that it is open. \n10.  Place S1 to the left on PC130-18A.                                \n11.  Measure the resistance of L1 using a multimeter placed                   across TP3 and TP4.", "Measuring the resistance of L1 will verify that it is open. 10. Place S1 to the left on PC130-18A. 11. Measure the resistance of L1 using a multimeter placed across TP3 and TP4.", "MEASUREMENT SETUP - Measure the resistance across L1 at TP3 and TP4. Place S1 to the left (Open)."], "jumps": ["P13300", "P13280", "P13295"]}, {"id": "P13300", "text": ["Note that the resistance measures infinity, L1 is open.", "Note that the resistance measures infinity, L1 is open....."], "jumps": ["P13310", "P13290"]}, {"id": "P13310", "text": ["The computer will now replace L1.", "The computer will now replace L1..........................................."], "jumps": ["P13300"]}, {"id": "P13320", "text": ["12. Place S1 to the right on PC130-18A to reapply power. 13. Connect CH1 probe to TP4 and CH2 probe to TP1 on PC130-18A, across R1. 14. Vary the frequency of the function generator to check for normal operation. Notice that Er1 is maximum at 50.4 kHz, the circuit is operating normally........", "MEASUREMENT SETUP - Place S1 to the right (closed). Carefully connect CH1 probe to TP4. Carefully connect CH2 probe to TP1."], "jumps": ["P13330", "P13325"]}, {"id": "P13330", "text": ["15.  Place S1 to the left on PC130-18A and remove the probes.              Now,  let's check out circuit B before the computer inserts              another fault.", "15. Place S1 to the left on PC130-18A and remove the probes. Now, let's check out circuit B before the computer inserts another fault."], "jumps": ["P13340", "P13320"]}, {"id": "P13340", "text": ["Calculate the resonant frequency of circuit B.  What is the calculated resonant frequency? Round to the nearest tenth of a kHertz", "Calculate the resonant frequency of circuit B. What is the calculated resonant frequency? Round to the nearest tenth of a kHertz"], "jumps": ["P13330", "P13345", "P13342"]}, {"id": "P13341", "text": [], "jumps": []}, {"id": "P13342", "text": ["Your calculations are incorrect.   Remember the fo  C2.", "5. Ensure the function generator is set to 29.0 kHz. 6. Connect CH1 probe to TP5 on PC130-18A. 7. Connect CH2 probe to TP6 on PC130-18A. This measures the voltage across C2.", "MEASUREMENT SETUP - Carefully connect CH1 probe to TP5. Carefully connect CH1 probe to TP6."], "jumps": ["P13410", "P13390", "P13405"]}, {"id": "P13410", "text": ["Note that you are measuring approximately 0 V.  The fault is probably a shorted C2.", "Note that you are measuring approximately 0 V. The fault is probably a shorted C2."], "jumps": ["P13420", "P13400"]}, {"id": "P13420", "text": ["To verify, measure the resistance.  \n10.  Place S2 to the left on PC130-18A. \n11.  Measure the resistance of C2 using a multimeter connected           across  TP5 and TP6.", "MEASUREMENT SETUP - Place S2 to the left (Open).", "To verify, measure the resistance. 10. Place S2 to the left on PC130-18A. 11. Measure the resistance of C2 using a multimeter connected across TP5 and TP6."], "jumps": ["P13430", "P13410", "P13425"]}, {"id": "P13430", "text": ["Note that the resistance measures 0 ohms, C2 is shorted.", "Note that the resistance measures 0 ohms, C2 is shorted...."], "jumps": ["P13440", "P13420"]}, {"id": "P13440", "text": ["The computer will now replace C2.", "The computer will now replace C2..........................................."], "jumps": ["P13430"]}, {"id": "P13450", "text": ["12. Place S2 to the right on PC130-18A to reapply power. 13. Connect CH1 probe to TP7 and CH2 probe to TP1 on PC130- 18A, across R2. 14. Vary the frequency of the function generator to check for normal operation. Notice that Er2 is maximum at 29.0 kHz, the circuit is operating normally........", "MEASUREMENT SETUP - Place S2 to the right (closed). Carefully connect CH1 probe to TP7. Carefully connect CH2 probe to TP1."], "jumps": ["P13460", "P13455"]}, {"id": "P13460", "text": ["15.  Place S2 on PC130-18A to the left and remove probes.  Next,          you will troubleshoot a parallel resonant circuit.", "15. uring the             minimum voltage across the resistor.   In fact, as frequency            increases, Er1 decreases.   Increase the frequency and                    observe Er1 decreasing.", "4. Ensure that CH1 is connected to TP3 and CH2 is connected to TP1 on PC130-20A. Notice that you are not measuring the minimum voltage across the resistor. In fact, as frequency increases, Er1 decreases. Increase the frequency and observe Er1 decreasing."], "jumps": ["P13540"]}, {"id": "P13540", "text": ["This indicates that C1 is open. \nL1 open - Er1 decreases as frequency decreases. \nShort - Er1 measures the applied voltage.", "This indicates that C1 is open. L1 open - Er1 decreases as frequency decreases. Short - Er1 measures the applied voltage."], "jumps": ["P13550", "P13530"]}, {"id": "P13550", "text": ["Since there are no switches in the parallel branches to open so that an ammeter can be inserted, current measurements will not be made."], "jumps": ["P13560", "P13540"]}, {"id": "P13560", "text": ["Also, because there are no switches in the parallel branches to open so components can be isolated, resistance measurements will not be made."], "jumps": ["P13570", "P13550"]}, {"id": "P13570", "text": ["So, the computer will replace C1.  If C1 was open, the circuit will now operate correctly.  If C1 was not the fault, the circuit will remain faulted.", "So, the computer will replace C1. If C1 was open, the circuit will now operate correctly. If C1 was not the fault, the circuit will remain faulted."], "jumps": ["P13560"]}, {"id": "P13580", "text": ["5.  Ensure CH1 probe is connected to TP3 and CH2 probe is               connected  to TP1 on PC130-20A, across R1.  \n6.  Vary the frequency of the function generator to check for                normal operation.  Notice that Er1 is minimum at 29.0 kHz, the        circuit is operating normally.", "5. Ensure CH1 probe is connected to TP3 and CH2 probe is connected to TP1 on PC130-20A, across R1. 6. Vary the frequency of the fun rop across R2."], "jumps": ["P13620", "P13600", "P13615"]}, {"id": "P13615", "text": ["MEASUREMENT SETUP - Place S2 to the right (closed). Carefully place CH1 probe on TP5. Carefully place CH2 probe on TP1."], "jumps": []}, {"id": "P13620", "text": ["3.  Adjust the frequency of the function generator until Er2 is               minimum. The frequency indicated on the function generator         should be approximately 67.3 kHz. The circuit is operating              correctly.", "3. Adjust the frequency of the function generator until Er2 is minimum. The frequency indicated on the function generator should be approximately 67.3 kHz. The circuit is operating correctly."], "jumps": ["P13630", "P13610", "P13625"]}, {"id": "P13625", "text": ["- PC130-20A S1 to the right - Oscilloscope connected across R2, CH1 to TP5, CH2 to TP1 - Oscilloscope set up for the ADD display and CH2 input inverted inverted", "MEASUREMENT SETUP - If the frequency of the function generator is incorrect, check your setup."], "jumps": []}, {"id": "P13630", "text": ["The computer will now insert a fault into circuit B.", "The computer will now insert a fault into circuit B........................"], "jumps": ["P13620"]}, {"id": "P13640", "text": ["4.  Ensure that CH1 is connected to TP5 and CH2 is connected to      TP1 on PC130-20A.   Notice that you are not measuring the             minimum voltage across the resistor.   In fact, you are                       measuring the applied voltage and it does not change when          the frequency changes.  Vary the frequency and observe Er2.", "4. Ensure that CH1 is connected to TP5 and CH2 is connected to TP1 on PC130-20A. Notice that you are not measuring the minimum voltage across the resistor. In fact, you are measuring the applied voltage and it does not change when the frequency changes. Vary the frequency and observe Er2."], "jumps": ["P13650"]}, {"id": "P13650", "text": ["This indicates that there is a short in the parallel circuit.  \nL2 open - Er2 decreases as frequency decreases.  \nC2 open - Er2 increases as frequency decreases.", "This indicates that there is a short in the parallel circuit. L2 open - Er2 decreases as frequency decreases. C2 open - Er2 increases as frequency decreases."], "jumps": ["P13660", "P13640"]}, {"id": "P13660", "text": ["Since there are no switches in the parallel branches to open so that an ammeter can be inserted, current measurements will not be made."], "jumps": ["P13670", "P13650"]}, {"id": "P13670", "text": ["Also, because there are no switches in the parallel branches to open so components can be isolated, resistance measurements will not be made."], "jumps": ["P13680", "P13660"]}, {"id": "P13680", "text": ["The computer will guess and replace C1.   If C1 was shorted, the circuit will now operate correctly.   If C1 was not the fault, the circuit will remain faulted.", "The computer will guess and replace C1. If C1 was shorted, the circuit will now operate correctly. If C1 was not the fault, the circuit will remain faulted."], "jumps": ["P13690", "P13670"]}, {"id": "P13690", "text": ["5.  Ensure CH1 probe is connected to TP5 and CH2 probe is               connected  to TP1 on PC130-20A, across R1.                                  6.  Vary the frequency of the function generator to check for                normal operation.   Notice that there was no change. The                 same problem is still in the circuit.", "5. Ensure CH1 probe is connected to TP5 and CH2 probe is connected to TP1 on PC130-20A, across R1. 6. Vary the frequency of the function generator to check for normal operation. Notice that there was no change. The same problem is still in the circuit......."], "jumps": ["P13700", "P13680", "P13695"]}, {"id": "P13695", "text": ["MEASUREMENT SETUP - Ensure that the CH1 probe is on TP5. Ensure that the CH2 probe is on TP1."], "jumps": []}, {"id": "P13700", "text": ["The computer will now replace L1.", "The computer will now replace L1............................. let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
