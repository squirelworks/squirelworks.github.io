const book = {"title": "93952505", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . .", "Title: RC CIRCUIT TRANSIENT TROUBLESHOOTING EXPERIMENTf"], "jumps": []}, {"id": "P10", "text": ["RC CIRCUIT TRANSIENT TROUBLESHOOTING EXPERIMENT"], "jumps": []}, {"id": "P100", "text": ["w Describe typical faults in an RC transient circuit. w Describe RC circuit transient troubleshooting procedures. w Describe the effects of open, shorted, and changed value components.", "w Recognize that an RC transient circuit is faulted. w Observe the effects of an open and shorted component in an RC transient circuit............."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 470 Oscilloscope rXXXXXXXXXXnt"], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will troubleshoot a faulted RC transient circuit."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["The input signal is altered depending upon its frequency and the RC time constant of the circuit.", "The input signal is altered depending upon its frequency and the RC time constant of the circuit.."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Measuring the waveforms with an oscilloscope determines if the circuit is operating normally."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["An incorrect waveform indicates that the circuit is faulted."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on RC CIRCUIT TRANSIENT TROUBLESHOOTING EXPERIMENT."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": ["P440"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The most common fault in RC transient circuits is an open or shorted component."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Changed value components do occur, but are less frequent than opens and shorts."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["For the circuit to operate correctly, all components must function correctly."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["In this RC circuit, the frequency allows the capacitor to fully charge and discharge in 5 time constants. The output waveform is taken across the resistor.", "In this RC circuit, the frequency allows the capacitor to fully charge and discharge in 5 time constants. The output waveform is taken across the resistor. 7"], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["If C1 opens internally, the input is dropped across it and no current flows through the capacitor."], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["The voltage across R1 drops to zero because current cannot flow  through the open series capacitor.", "The voltage across R1 drops to zero because current cannot flow through the open series capacitor."], "jumps": ["P1090", "P1020"]}, {"id": "P1090", "text": ["The entire input signal is present across the capacitor and is unaltered."], "jumps": ["P1100", "P1020"]}, {"id": "P1100", "text": ["A circuit with an extremely short time constant or extremely low frequency has similar characteristics because of high capacitive reactance."], "jumps": ["P1110", "P1020", "P1105"]}, {"id": "P1101", "text": ["A circuit with an extremely short time constant or extremely low frequency has similar characteristics because of high capacitive reactance."], "jumps": ["P1110", "P1020", "P1105"]}, {"id": "P1105", "text": ["CAPACITIVE REACTANCE - When capacitive reactance increases more signal is dropped across the capacitor, and less signal is dropped across the resistor..."], "jumps": ["P1107"]}, {"id": "P1107", "text": ["CAPACITIVE REACTANCE - Although capacitive reactance is calculated differently for square wave and sine wave circuits, the same principles apply."], "jumps": ["P1101", "P1105"]}, {"id": "P1110", "text": ["If C1 shorts internally, the circuit has no effect on the input signal other than the load of R1. The input signal is measured across R1."], "jumps": ["P1120", "P1101"]}, {"id": "P1120", "text": ["Current bypasses the capacitor. C1 is effectively not in the circuit and no waveform is present across the capacitor."], "jumps": ["P1130", "P1101"]}, {"id": "P1130", "text": ["If R1 opens internally, the waveform across it is identical to the input signal except it is AC."], "jumps": ["P1140", "P1101"]}, {"id": "P1140", "text": ["The capacitor blocks the DC component and passes only the AC."], "jumps": ["P1147", "P1101"]}, {"id": "P1142", "text": ["The capacitor blocks the DC component and passes only the AC."], "jumps": ["P1147", "P1101"]}, {"id": "P1145", "text": ["DC COMPONENT - The waveform shown is a DC square wave from 0V to 2V. The DC component is the average DC level or 1V."], "jumps": []}, {"id": "P1147", "text": ["It should be noted that if R1 and C1 are in opposite positions C1 cannot block the DC component."], "jumps": ["P1150", "P1142"]}, {"id": "P1150", "text": ["A circuit with an extremely long time constant or extremely high frequency has similar characteristics."], "jumps": ["P1160", "P1142", "P1155"]}, {"id": "P1152", "text": ["A circuit with an extremely long time constant or extremely high frequency has similar characteristics."], "jumps": ["P1160", "P1142", "P1155"]}, {"id": "P1155", "text": ["CAPACITIVE REACTANCE - When capacitive reactance decreases less signal is dropped across the capacitor and more signal is dropped across the resistor."], "jumps": ["P1157"]}, {"id": "P1157", "text": ["CAPACITIVE REACTANCE - Although capacitive reactance is calculated differently for square wave circuits and sine wave circuits, the same principles apply."], "jumps": ["P1152", "P1155"]}, {"id": "P1160", "text": ["If the resistor shorts, there is no signal across it."], "jumps": ["P1170", "P1152"]}, {"id": "P1170", "text": ["The entire input signal is dropped across C1 and is unaltered."], "jumps": ["P1180", "P1152"]}, {"id": "P1180", "text": ["These are the same indications as for an open capacitor.  Measuring the resistance of R1 determines if R1 is shorted or if C1 is open.", "These are the same indications as for an open capacitor. Measuring the resistance of R1 determines if R1 is shorted or if C1 is open."], "jumps": ["P1190", "P1152"]}, {"id": "P1190", "text": ["What is the probable fault in this circuit?", "What is the probable fault in this circuit?................"], "jumps": ["P1152"]}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1192", "text": ["If C1 is shorted, the waveform across R1 would be identical to the input.  Notice the DC level of the input.", "If C1 is shorted, the waveform across R1 would be identical to the input. Notice the DC level of the input."], "jumps": []}, {"id": "P1193", "text": ["If R1 is shorted, the signal is grounded and there is no waveform. Notice the waveform across R1.", "If R1 is shorted, the signal is grounded and there is no waveform. Notice the waveform across R1.."], "jumps": []}, {"id": "P1200", "text": ["A changed value component changes the RC time constant of the circuit."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["An increase in resistance or capacitance increases the time constant."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["A decrease in resistance or capacitance decreases the time constant."], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["A resistance measurement is necessary to determine if the capacitor or the resistor changed value."], "jumps": ["P1240", "P1200"]}, {"id": "P1240", "text": ["If the resistor checks good, then the capacitor is the changed value component."], "jumps": ["P1250", "P1200"]}, {"id": "P1250", "text": ["If the resistor does not check good, then it is the changed value component. This method of locating the component eliminates the need for an RCL bridge."], "jumps": ["P1260", "P1200", "P1255"]}, {"id": "P1252", "text": ["If the resistor does not check good, then it is the changed value component. This method of locating the component eliminates the need for an RCL bridge."], "jumps": ["P1260", "P1200", "P1255"]}, {"id": "P1255", "text": ["RCL BRIDGE - An RCL bridge is a piece of electronic test equipment that determines the resistance of resistors, capacitance of capacitors, and inductance of inductors."], "jumps": []}, {"id": "P1260", "text": ["This chart will help you remember what to look for when troubleshooting.", "FAULT CAPACITOR WAVEFORM RESISTOR WAVEFORM Open Capacitor Identical to input Zero waveform Shorted Capacitor Zero waveform Identical to input Open Resistor DC component of input AC portion of the input Shorted Resistor Identical to input Zero waveform Changed Value Component Indicates erroneous RC Indicates erroneous RC Time Constant Time Constant"], "jumps": ["P1270", "P1252"]}, {"id": "P1270", "text": ["What type of faults produce no waveform across the resistor?"], "jumps": ["P1260"]}, {"id": "P1271", "text": [], "jumps": []}, {"id": "P1272", "text": ["An open R1 or shorted C1 would not cause the waveform across R1 to be zero."], "jumps": []}, {"id": "P1273", "text": ["A changed value R1 and C1 would not cause the waveform across R1 to be zero."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on RC CIRCUIT TRANSIENT FAULTS."], "jumps": ["P1001", "P1270"]}, {"id": "P1920", "text": ["1.  Faults in RC transient circuits can be determined by                         component waveforms.", "1. Faults in RC transient circuits can be determined by component waveforms.", "FAULT CAPACITOR WAVEFORM RESISTOR WAVEFORM Open Capacitor Identical to input Zero waveform Shorted Capacitor Zero waveform Identical to input Open Resistor DC component of input AC portion of the input Shorted Resistor Identical to input Zero waveform Changed Value Component Indicates erroneous RC Indicates erroneous RC Time Constant Time Constant"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Distinguishing an open capacitor from a shorted resistor                requires measuring the value of the resistor.", "2. Distinguishing an open capacitor from a shorted resistor requires measuring the value of the resistor."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  A circuit with a changed value component also requires                  resistance measurements to determine the fault.", "3. A circuit with a changed value component also requires resistance measurements to determine the fault."], "jumps": ["P1999", "P1930"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.."], "jumps": ["P1001", "P1930"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["RC Transient Circuit Faults\nThe purpose of this experiment is to demonstrate troubleshooting methods for RC transient circuits.", "RC Transient Circuit Faults The purpose of this experiment is to demonstrate troubleshooting methods for RC transient circuits."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["Pick up the PC130-14A card. This card is used to demonstrate RC circuit transient faults."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["Compare the card with the schematic shown."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["Notice that there are four series RC circuits on the card. Switches S1 - S4 apply the input signal to each circuit."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["In this experiment, you will use circuit B.", "In this experiment, you will use circuit B................."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2070"]}, {"id": "P2100", "text": ["2.  Carefully plug PC130-14A into the Test Console PC1 position.", "2. Carefully plug PC130-14A into the Test Console PC1 position. to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2080", "P2105"]}, {"id": "P2105", "text": ["EXPERIMENT CARD PLACEMENT - PC130-14A shown in PC1 position."], "jumps": []}, {"id": "P2110", "text": ["3.  Set S1, S3, and S4 to OUT on PC130-14A. \n4.  Set S2 IN on PC130-14A.", "3. Set S1, S3, and S4 to OUT on PC130-14A. 4. Set S2 IN on PC130-14A. ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2100", "P2115"]}, {"id": "P2115", "text": ["SWITCH POSITIONS - S2 shown at the IN position. S1, S3 and S4 shown at the OUT position."], "jumps": []}, {"id": "P2120", "text": ["5.  Set up the function generator to produce a 1000 Hz                           squarewave output. Be sure all attenuation and modulation            controls are off.", "5. Set up the function generator to produce a 1000 Hz squarewave output. Be sure all attenuation and modulation controls are off..", "Function - Square Wave Gate Select - .1 sec Frequency Dial - 10 Attenuation - OUT Modulation - OUT Range - 100"], "jumps": ["P2130", "P2110", "P2125"]}, {"id": "P2125", "text": ["FUNCTION GENERATOR Range - 100 Gate Select - .1 Sec Function - Modulation - OUT Frequency - 10 Attenuation - OUT"], "jumps": []}, {"id": "P2130", "text": ["6.  Connect a BNC to BNC cable from the main output on the               function generator to the INPUT BNC on the Test Console.", "6. Connect a BNC to BNC cable from the main output on the function generator to the INPUT BNC on the Test Console."], "jumps": ["P2140", "P2120", "P2135"]}, {"id": "P2135", "text": ["BNC CONNECTION - Connect the Function Generator's Main Output BNC to the Test Console's Input BNC."], "jumps": []}, {"id": "P2140", "text": ["7.   Set the oscilloscope up as follows:", "7. Set the oscilloscope up as follows:...................", "CH1 - Zero trace, then set to DC CH2 - Zero trace, then set to DC Trigger - CH1, AC, + Time/Div - .2 msec CH1 Input - Connect x1 probe Sweep Mode - AUTO Display Mode - CH1 CH1 Volts/Div - 1 CH2 Volts/Div - 1111+"], "jumps": ["P2150", "P2130", "P2145"]}, {"id": "P2145", "text": ["OSCILLOSCOPE - CH1 - DC Coupling - AC Time/Div - .2 msec CH2 - DC Display - CH1 Volts/Div - 1 DC Slope - + Source - CH1 Sweep - AUTO", "Zero Tracece at least 5 divisions above trace", "K, HK_,,_K,_K'',EK,,,,,'_,KEKZ;;XK98JO9[N=9N@N99U,,K,,EK", "'_K_'K'',K' QUK_,''KK}0;KK,KK__',K'K_K''KK'K_", "'_K_'KK',K_,,'_'',K,K', F;__KK,K, TK,,__,''KKK'", ",KK,,E:9 POOHPPP=70=07PUHP^UOOU=YOVP=PPPPOOPXOOOOXH9UO95P0P===TXZOOU1NIIPPPHPVGH5PSOPZXXOK;E", "a5T 55:s5 m5 ts55Tt T--|57s- Fss y 5 -VVFs5m--FFFmm5FFs---t-t t-| -s-ymV sGFt--ss5-", "7mty-5m--F-s- mVs t --FFy5V-|-F smst Vm--5sVt T-", ",,K;A:'K,57VGO;EEEOa>2OK9)1UE; VPKEE,'KK__K'KK'KKKKK'K_',_", "K';;_KE,KKKKE,KEEK,EKEEE OKKK-RL0;;E,;A ?PU;a", ";U;U;;UU;;;;;KEUW>< E__,K,K,', let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
