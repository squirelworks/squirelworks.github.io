const book = {"title": "93954701", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . .", "Title: INTRODUCTION TO CONVERSION AND DATA CIRCUITSsadf"], "jumps": []}, {"id": "P10", "text": ["INTRODUCTION TO CONVERSION AND DATA CIRCUITS"], "jumps": []}, {"id": "P100", "text": ["w Identify the purpose of conversion circuits. w Recognize basic A/D and D/A circuits.", "w Identify the purpose of data circuits. w Recognize basic data selector and data distributor circuits."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["Almost all measurable quantities are recorded in analog form.  For example, temperature, speed and time.", "Almost all measurable quantities are recorded in analog form. For example, temperature, speed and time."], "jumps": []}, {"id": "P410", "text": ["Analog signals must be converted to digital before digital circuits can process the information."], "jumps": []}, {"id": "P413", "text": ["Analog signals must be converted to digital before digital circuits can process the information."], "jumps": []}, {"id": "P420", "text": ["After conversion from analog to digital, the data is distributed to the digital circuits."], "jumps": []}, {"id": "P423", "text": ["After conversion from analog to digital, the data is distributed to the digital circuits."], "jumps": []}, {"id": "P430", "text": ["The digital signals are then converted back to analog and sent to the display circuits for you to see."], "jumps": []}, {"id": "P433", "text": ["The digital signals are then converted back to analog and sent \nto the display circuits for you to see.", "The digital signals are then converted back to analog and sent to the display circuits for you to see."], "jumps": []}, {"id": "P440", "text": ["In this lesson you will be introduced to these circuits:"], "jumps": []}, {"id": "P450", "text": ["Let's begin the lesson on INTRODUCTION TO CONVERSION AND DATA CIRCUITS......"], "jumps": ["P410"]}, {"id": "P900", "text": [], "jumps": ["P450"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["An Analog to Digital (A/D) converter is a circuit that changes analog signals to digital signals."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["A Digital to Analog (D/A) converter is a circuit that changes digital signals to analog signals."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Let's look at an A/D converter first."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["This is a simultaneous A/D converter circuit or flash converter."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["This circuit compares the analog input voltage with a reference voltage produced by R1 through R4."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["When the analog voltage exceeds the reference voltage for a given comparator, a high is generated."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["The high or low outputs of the comparators are applied to an encoder which produces a two-digit binary number on every sampling pulse.", "The high or low outputs of the comparators are applied to an encoder which produces a two-digit binary number on every sampling pulse.."], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["The output of the encoder represents the digital equivalent to the analog input."], "jumps": ["P1100", "P1050"]}, {"id": "P1100", "text": ["An analog sine wave produces a digital square wave represented in binary numbers."], "jumps": ["P1110", "P1050"]}, {"id": "P1110", "text": ["The advantage of this type of A/D converter is that the analog input is converted to digital simultaneously."], "jumps": ["P1120", "P1050"]}, {"id": "P1120", "text": ["An important fact to remember is that a separate comparator is needed for each level of quantization.  This can be considered a disadvantage when there is limited space for circuit components.", "An important fact to remember is that a separate comparator is needed for each level of quantization. This can be considered a disadvantage when there is limited space for circuit components."], "jumps": ["P1130", "P1050"]}, {"id": "P1122", "text": ["An important fact to remember is that a separate comparator is needed for each level of quantization. This can be considered a disadvantage when there is limited space for circuit components."], "jumps": ["P1130", "P1050"]}, {"id": "P1125", "text": ["QUANTIZATION - the assignment of a unique value from a range of digital values (set by the number of bits used) based on the sampling of an analog waveform."], "jumps": []}, {"id": "P1130", "text": ["This is a stairstep A/D converter, or ramp converter.", "This is a stairstep A/D converter, or ramp converter......."], "jumps": ["P1135", "P1050"]}, {"id": "P1135", "text": ["The analog input is compared with the output of a D/A converter."], "jumps": ["P1137", "P1130"]}, {"id": "P1137", "text": ["If the analog input voltage is higher than the output of the D/A converter, a high output is generated by the comparator."], "jumps": ["P1140", "P1130"]}, {"id": "P1140", "text": ["The AND gate is enabled allowing the clock pulses to be applied to the Up Counter. As long as the comparator output is high, the Up Counter will continue counting up."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["Once the counter contains a binary number equal to the analog input, the counter is disabled by a low to the AND gate."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["The clear input sets the counter to zero before another conversion takes place."], "jumps": ["P1170", "P1130"]}, {"id": "P1170", "text": ["An analog sine wave input produces a stepped digital output."], "jumps": ["P1180", "P1130"]}, {"id": "P1180", "text": ["The advantage of this A/D converter is that it has less components compared to a simultaneous A/D converter."], "jumps": ["P1190", "P1130"]}, {"id": "P1190", "text": ["The disadvantage is that more time is required to convert analog signals to digital."], "jumps": ["P1200", "P1130"]}, {"id": "P1200", "text": ["This circuit is a tracking A/D converter.", "This circuit is a tracking A/D converter..................."], "jumps": ["P1210", "P1130"]}, {"id": "P1210", "text": ["The circuit operates much like a stairstep A/D converter except the counter counts up and down."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["A high output allows the counter to count up.  A low output allows the counter to count down.", "A high output allows the counter to count up. A low output allows the counter to count down."], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["A tracking A/D converter continuously tracks an analog input."], "jumps": ["P1240", "P1200"]}, {"id": "P1240", "text": ["The advantage of a tracking A/D converter is fast conversion requiring less circuitry."], "jumps": ["P1250", "P1200"]}, {"id": "P1250", "text": ["What type of A/D converter is shown in this circuit?", "What type of A/D converter is shown in this circuit?......."], "jumps": ["P1200"]}, {"id": "P1251", "text": [], "jumps": []}, {"id": "P1252", "text": ["A stairstep converter uses an up counter.", "A stairstep converter uses an up counter..................."], "jumps": []}, {"id": "P1253", "text": ["A tracking converter uses an up/down counter.", "A tracking converter uses an up/down counter..............."], "jumps": []}, {"id": "P1260", "text": ["What type of A/D converter is shown in this circuit?", "What type of A/D converter is shown in this circuit?......."], "jumps": ["P1250"]}, {"id": "P1261", "text": [], "jumps": []}, {"id": "P1262", "text": ["A simultaneous converter uses more than one comparator.", "A simultaneous converter uses more than one comparator....."], "jumps": []}, {"id": "P1263", "text": ["A tracking converter uses an up/down counter.", "A tracking converter uses an up/down counter..............."], "jumps": []}, {"id": "P1270", "text": ["Now, let's look at two types of digital to analog converters."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["This is a binary weighted input D/A converter.", "This is a binary weighted input D/A converter.............."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["The analog voltage output is taken from the voltage developed across Rout."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["The voltage across Rout depends on the current flow.  The higher the current, the greater the voltage output.", "The voltage across Rout depends on the current flow. The higher the current, the greater the voltage output."], "jumps": ["P1310", "P1280"]}, {"id": "P1310", "text": ["The current flow through Rout is the sum of the currents in R, 2R, 4R and 8R parallel branches."], "jumps": ["P1320", "P1280"]}, {"id": "P1320", "text": ["Each of the four resistors have a value that is weighted in binary."], "jumps": ["P1330", "P1280"]}, {"id": "P1330", "text": ["The LSD digit from the register has the highest resistance."], "jumps": ["P1340", "P1280"]}, {"id": "P1340", "text": ["When QA is high, the current produced is the lowest which adds the least amount of voltage drop across Rout."], "jumps": ["P1350", "P1280"]}, {"id": "P1350", "text": ["When QA is low, no current flow is produced in the 8R branch which adds no voltage drop across Rout."], "jumps": ["P1360", "P1280"]}, {"id": "P1360", "text": ["The MSD digit from the register has the lowest resistance."], "jumps": ["P1370", "P1280"]}, {"id": "P1370", "text": ["When QD is high, the current produced is the highest which adds the greatest amount of voltage drop across Rout."], "jumps": ["P1380", "P1280"]}, {"id": "P1380", "text": ["Each of the 16 output combinations from the register produces a different voltage across Rout."], "jumps": ["P1390", "P1280"]}, {"id": "P1390", "text": ["The advantage of this D/A converter is that it is simultaneous."], "jumps": ["P1400", "P1280"]}, {"id": "P1400", "text": ["The disadvantage is that it takes a different value resistor for each output.  An 8 bit converter requires 8 resistors with values from R to 128R.", "The disadvantage is that it takes a different value resistor for each output. An 8 bit converter requires 8 resistors with values from R to 128R."], "jumps": ["P1410", "P1280"]}, {"id": "P1410", "text": ["This is a R/2R D/A converter or ladder converter.", "This is a R/2R D/A converter or ladder converter..........."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["The eight resistors form a series-parallel circuit.  The total resistance determines the analog voltage output.", "The eight resistors form a series-parallel circuit. The total resistance determines the analog voltage output."], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["With all 0's from the register, 0 volts are produced.  The equivalent circuit is shown.", "With all 0's from the register, 0 volts are produced. The equivalent circuit is shown."], "jumps": ["P1450", "P1410"]}, {"id": "P1450", "text": ["With all 1's from the register, maximum voltage will be produced.  The equivalent circuit is shown.", "With all 1's from the register, maximum voltage will be produced. The equivalent circuit is shown."], "jumps": ["P1470", "P1410"]}, {"id": "P1470", "text": ["Each of the 16 output combinations from the register produces a different voltage output."], "jumps": ["P1480", "P1410"]}, {"id": "P1480", "text": ["The advantage of this D/A converter is that it uses only two values of resistors."], "jumps": ["P1490", "P1410"]}, {"id": "P1490", "text": ["What type of D/A converter is shown in this circuit?", "What type of D/A converter is shown in this circuit?......."], "jumps": ["P1410"]}, {"id": "P1491", "text": [], "jumps": []}, {"id": "P1492", "text": ["A weighted D/A converter uses a different value resistor for each output."], "jumps": []}, {"id": "P1493", "text": ["A stairstep circuit is an A/D converter.", "A stairstep circuit is an A/D converter...................."], "jumps": []}, {"id": "P1500", "text": ["What type of D/A converter is shown in this circuit?", "What type of D/A converter is shown in this circuit?......."], "jumps": ["P1490"]}, {"id": "P1501", "text": [], "jumps": ["P1500"]}, {"id": "P1502", "text": ["A tracking circuit is a A/D converter.", "A tracking circuit is a A/D converter......................"], "jumps": []}, {"id": "P1503", "text": ["A ladder D/A converter uses only two values of resistors connected in a series-parallel circuit."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on CONVERSION CIRCUITS.", "This completes the information on CONVERSION CIRCUITS......"], "jumps": ["P1001", "P1500"]}, {"id": "P1920", "text": ["1.  An Analog to Digital (A/D) converter is a circuit that changes          analog signals to digital signals.", "1. An Analog to Digital (A/D) converter is a circuit that changes analog signals to digital signals."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  A Digital to Analog (D/A) converter is a circuit that changes             digital signals to analog signals.", "2. A Digital to Analog (D/A) converter is a circuit that changes digital signals to analog signals."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  A simultaneous A/D converter uses many comparators and an      encoder.", "3. A simultaneous A/D converter uses many comparators and an encoder."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  A stairstep A/D converter uses one comparator and an up               counter.", "4. A stairstep A/D converter uses one comparator and an up counter."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  A tracking A/D converter uses one comparator and an                      up/down counter.", "5. A tracking A/D converter uses one comparator and an up/down counter."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  A weighted D/A converter uses various sizes of resistors.", "6. A weighted D/A converter uses various sizes of resistors."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7.  A ladder D/A converter uses two sizes of resistors in a series-       parallel circuit.", "7. A ladder D/A converter uses two sizes of resistors in a series- parallel circuit."], "jumps": ["P1999", "P1970"]}, {"id": "P1999", "text": ["You have completed the Summary.  You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1980"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["Data selector circuits have four inputs and one output.", "Data selector circuits have four inputs and one output....."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["These circuits are used to select a specific input when more than one input is applied."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["Data distributor circuits have one input and four outputs."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["They are used to distribute one specific output when more than one output is available."], "jumps": ["P2060", "P2020"]}, {"id": "P2060", "text": ["Let's look at selector circuits first."], "jumps": ["P2070", "P2020"]}, {"id": "P2070", "text": ["A data selector has four data inputs.  Each input is high or low.", "A data selector has four data inputs. Each input is high or low."], "jumps": ["P2080", "P2020"]}, {"id": "P2080", "text": ["Two address inputs are used to select the data that is sent to the output."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["If A1 and A2 are 0, then the data on input A is sent to the output."], "jumps": ["P2100", "P2070"]}, {"id": "P2100", "text": ["If A1 is 1 and A2 is 0, then the data on input B is sent to the output."], "jumps": ["P2110", "P2070"]}, {"id": "P2110", "text": ["If A1 is a 0 and A2 is a 1, then the data on input C is sent to the output."], "jumps": ["P2120", "P2070"]}, {"id": "P2120", "text": ["If both A1 and A2 are a 1, then the data on input D is sent to the output."], "jumps": ["P2130", "P2070"]}, {"id": "P2130", "text": ["For example, this data selector circuit chooses which input device is used."], "jumps": ["P2140", "P2070"]}, {"id": "P2140", "text": ["Multiplexing is accomplished by addressing each input during one time period."], "jumps": ["P2142", "P2130", "P2145"]}, {"id": "P2142", "text": ["A counter is added to the circuit and its output is used as address inputs."], "jumps": ["P2150", "P2140"]}, {"id": "P2145", "text": ["MULTIPLEX - Multiplexing is the process of putting information from several sources onto a single line or transmission path."], "jumps": []}, {"id": "P2150", "text": ["During T1, inputs A through D are selected and placed on the output."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["The first clock pulse sets the counter to 00, addressing input A.  Touch NEXT to observe the operation.", "The first clock pulse sets the counter to 00, addressing input A. Touch NEXT to observe the operation."], "jumps": ["P2140"]}, {"id": "P2161", "text": ["The first clock pulse sets the counter to 00, addressing input A.  Touch NEXT to observe the operation.", "The first clock pulse sets the counter to 00, addressing input A. Touch NEXT to observe the operation."], "jumps": ["P2170", "P2140"]}, {"id": "P2170", "text": ["The second clock pulse sets the counter to 01, addressing input B.  Touch NEXT to observe the operation.", "The second clock pulse sets the counter to 01, addressing input B. Touch NEXT to observe the operation."], "jumps": ["P2140"]}, {"id": "P2171", "text": ["The second clock pulse sets the counter to 01, addressing input B.  Touch NEXT to observe the operation.", "The second clock pulse sets the counter to 01, addressing input B. Touch NEXT to observe the operation."], "jumps": ["P2180", "P2140"]}, {"id": "P2180", "text": ["The third clock pulse sets the counter to 10, addressing input C.  Touch NEXT to observe the operation.", "The third clock pulse sets the counter to 10, addressing input C. Touch NEXT to observe the operation."], "jumps": ["P2140"]}, {"id": "P2181", "text": ["The third clock pulse sets the counter to 10, addressing input C.  Touch NEXT to observe the operation.", "The third clock pulse sets the counter to 10, addressing input C. Touch NEXT to observe the operation."], "jumps": ["P2190"]}, {"id": "P2190", "text": ["The fourth clock pulse sets the counter to 11, addressing input D.  Touch NEXT to observe the operation.", "The fourth clock pulse sets the counter to 11, addressing input D. Touch NEXT to observe the operation."], "jumps": ["P2140"]}, {"id": "P2191", "text": ["The fourth clock pulse sets the counter to 11, addressing input D.  Touch NEXT to observe the operation.", "The fourth clock pulse sets the counter to 11, addressing input D. Touch NEXT to observe the operation."], "jumps": ["P2140"]}, {"id": "P2192", "text": ["The fourth clock pulse sets the counter to 11, addressing input D.", "The fourth clock pulse sets the counter to 11, addressing input D. Touch NEXT to continue.he operation."], "jumps": ["P2200", "P2140"]}, {"id": "P2200", "text": ["At time T2, the counter is set to 00 and the data during T2 is placed on the output in the same manner."], "jumps": ["P2210", "P2140"]}, {"id": "P2210", "text": ["What is the output of this data selector circuit?", "What is the output of this data selector circuit?.........."], "jumps": ["P2140", "P2215"]}, {"id": "P2211", "text": [], "jumps": []}, {"id": "P2212", "text": ["The address is 10, the data on input C is applied to the output."], "jumps": []}, {"id": "P2215", "text": ["DATA SELECTOR CIRCUIT - If A1 is a 0 and A2 is a 1, then the data on input C is sent to the output."], "jumps": []}, {"id": "P2220", "text": ["What is the output of this circuit after three clock pulses with the counter initially set to 00?"], "jumps": ["P2210"]}, {"id": "P2221", "text": [], "jumps": []}, {"id": "P2222", "text": ["Input A is on the output first since the counter is at 00. On the first clock pulse the count goes to 01 and Input B is on the output and so on."], "jumps": []}, {"id": "P2230", "text": ["What is the output of this circuit after three clock pulses with the counter initially set to 10?"], "jumps": ["P2220"]}, {"id": "P2231", "text": [], "jumps": []}, {"id": "P2232", "text": ["Input C is on the output first since the counter is at 10.  Then input D and so on.", "Input C is on the output first since the counter is at 10. Then input D and so on."], "jumps": []}, {"id": "P2240", "text": ["Now let's look at data distributors.", "Now let's look at data distributors........................"], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["A data distributor has one data input and more than one output. The input data is 1, 0 or multiplexed.", "A data distributor has one data input and more than one output. The input data is 1, 0 or multiplexed.."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["Two address inputs are used to distribute the data to one of the four outputs."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["If A1 and A2 are 0, then data on the input is sent to output A."], "jumps": ["P2280", "P2250"]}, {"id": "P2280", "text": ["If A1 is 1 and A2 is 0, then data on the input is sent to output B."], "jumps": ["P2290", "P2250"]}, {"id": "P2290", "text": ["If A1 is a 0 and A2 is a 1, then data on the input is sent to output C."], "jumps": ["P2300", "P2250"]}, {"id": "P2300", "text": ["If both A1 and A2 are a 1, then data on the input is sent to output D."], "jumps": ["P2310", "P2250"]}, {"id": "P2310", "text": ["For example, this data distributor circuit chooses which output device is used."], "jumps": ["P2320", "P2250"]}, {"id": "P2320", "text": ["Demultiplexing is accomplished by adding a counter to the circuit.", "Demultiplexing is accomplished by adding a counter to the circuit.."], "jumps": ["P2330", "P2310", "P2325"]}, {"id": "P2325", "text": ["DEMULTIPLEX - Demultiplexing is the process of putting information from a single source onto several output paths."], "jumps": []}, {"id": "P2330", "text": ["The output of the counter is used as address inputs to the data distributor."], "jumps": ["P2320"]}, {"id": "P2340", "text": ["The first clock pulse sets the counter to 00, addressing output A.  Touch NEXT to observe the operation.", "The first clock pulse sets the counter to 00, addressing output A. Touch NEXT to observe the operation."], "jumps": ["P2320"]}, {"id": "P2350", "text": ["The second clock pulse sets the counter to 01, addressing output B.  Touch NEXT to observe the operation.", "The second clock pulse sets the counter to 01, addressing output B. Touch NEXT to observe the operation."], "jumps": ["P2320"]}, {"id": "P2360", "text": ["The third clock pulse sets the counter to 10, addressing output C.  Touch NEXT to observe the operation.", "The third clock pulse sets the counter to 10, addressing output C. Touch NEXT to observe the operation."], "jumps": ["P2320"]}, {"id": "P2370", "text": ["The fourth clock pulse sets the counter to 11, addressing output D.  Touch NEXT to observe the operation.", "The fourth clock pulse sets the counter to 11, addressing output D. Touch NEXT to observe the operation."], "jumps": ["P2380", "P2320"]}, {"id": "P2380", "text": ["All four bits of data on the input have been separated to different outputs."], "jumps": ["P2390", "P2320"]}, {"id": "P2390", "text": ["What is output B of this data distributor?", "What is output B of this data distributor?................."], "jumps": ["P2320"]}, {"id": "P2391", "text": [], "jumps": []}, {"id": "P2392", "text": ["The input is 0. The address is 01 which allows the output to be applied to output B."], "jumps": []}, {"id": "P2400", "text": ["What is output C of this data distributor?", "What is output C of this data distributor?................."], "jumps": ["P2390"]}, {"id": "P2401", "text": [], "jumps": []}, {"id": "P2402", "text": ["With 11 in the counter, the D output will be 1. However, the output on C is not known at this time.  When the counter is at 10, then the input to the distributor will give an output on C.", "With 11 in the counter, the D output will be 1. However, the output on C is not known at this time. When the counter is at 10, then the input to the distributor will give an output on C."], "jumps": []}, {"id": "P2420", "text": ["What is on the A output after three clock pulses with the counter initially set to 10?"], "jumps": ["P2400"]}, {"id": "P2421", "text": [], "jumps": ["P2420"]}, {"id": "P2422", "text": ["The first digit is a 0 and will be placed on the C output - counter at 10, the second digit is a 1 and will be placed on the D output - counter at 11, etc."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on DATA CIRCUITS.", "This completes the information on DATA CIRCUITS.TLE........"], "jumps": ["P2001", "P2420"]}, {"id": "P2920", "text": ["1.  Data selector circuits have four inputs and let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
