n diodes are open,\n     short or changed value.", "1. The three most common faults for junction diodes are open, short or changed value."], "jumps": ["P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on JUNCTION DIODE FAULTS.", "This completes the information on JUNCTION DIODE FAULTS...."], "jumps": ["P1001", "P1340"]}, {"id": "P1450", "text": ["Regardless of the type of meter used for testing, a diode should allow current flow when forward biased and no current flow when reverse biased."], "jumps": ["P1910", "P1440"]}, {"id": "P1440", "text": ["Remember, the basic operation of a diode will permit current flow in only one direction."], "jumps": ["P1450", "P1430"]}, {"id": "P1430", "text": ["A forward biased germanium diode shows a different knee voltage.drop across the diode junction. This example is a silicon diode."], "jumps": ["P1440", "P1420"]}, {"id": "P1420", "text": ["When forward biased the voltage displayed is the actual voltage drop across the diode junction. This example is a silicon diode."], "jumps": ["P1430", "P1410"]}, {"id": "P1410", "text": ["When reverse biased the voltage displayed does not change from the static reading as no current flows through the diode.sistance."], "jumps": ["P1420", "P1400"]}, {"id": "P1400", "text": ["Meters displaying voltage for diode testing are actually indicating the voltage present at the meter leads. infinite resistance."], "jumps": ["P1410", "P1390"]}, {"id": "P1390", "text": ["When forward biased the meter indicates low resistance. nfinite resistance."], "jumps": ["P1400", "P1380"]}, {"id": "P1380", "text": ["This multimeter preforms the diode test using a resistance display. When reverse biased the meter indicates infinite resistance."], "jumps": ["P1390", "P1370"]}, {"id": "P1370", "text": ["Digital multimeters differ in the way the display indicates the diode test function. Some display a resistance indication. Others display a voltage indication."], "jumps": ["P1380", "P1360"]}, {"id": "P1360", "text": ["Digital multimeters include a diode test function for testing diode and transistor junctions. The multimeter increases the voltage at the leads when in the diode test mode so the diode junction can be biased."], "jumps": ["P1370", "P1350"]}, {"id": "P1350", "text": ["Digital multimeters will usually indicate a completely shorted diode but it's best to use the diode test function of the digital multimeter to be sure of the diode condition."], "jumps": ["P1360", "P1330"]}, {"id": "P1340", "text": ["A digital multimeter set to read resistance will usually indicate an open condition even with a known good diode as the meter does not produce enough voltage to forward bias the diode junction."], "jumps": ["P1350", "P1330"]}, {"id": "P1332", "text": ["Infinite resistance in either direction through a diode is an indication of an open diode.", "Infinite resistance in either direction through a diode is an indication of an open diode. open diode."], "jumps": []}, {"id": "P1331", "text": [], "jumps": ["P1340"]}, {"id": "P1330", "text": ["What type of fault is indicated by these two resistance readings?"], "jumps": ["P1320"]}, {"id": "P1322", "text": ["A low resistance in one direction and high resistance in\nthe other direction is normal operation for a diode.", "A low resistance in one direction and high resistance in the other direction is normal operation for a diode. . ......"], "jumps": []}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1320", "text": ["What type of fault is indicated by these two resistance readings?"], "jumps": ["P1240"]}, {"id": "P1310", "text": ["Detection of this fault with an ohmmeter is not likely. Only after\nthe component opens or shorts can the problem be detected.", "Detection of this fault with an ohmmeter is not likely. Only after the component opens or shorts can the problem be detected."], "jumps": ["P1249", "P1240"]}, {"id": "P1300", "text": ["A changed value diode provides resistance readings very much\nlike those of a good diode.", "A changed value diode provides resistance readings very much like those of a good diode."], "jumps": ["P1310", "P1240"]}, {"id": "P1280", "text": ["Reversing the leads and checking from cathode to anode\nprovides a similar reading.", "Reversing the leads and checking from cathode to anode provides a similar reading."], "jumps": ["P1240", "P1247"]}, {"id": "P1270", "text": ["A shorted diode provides zero resistance in both directions. Checking from anode to cathode deflects the meter's needle."], "jumps": ["P1280", "P1240"]}, {"id": "P1260", "text": ["Reversing the leads will provide the same reading.  An open\ndiode is easily identified using resistance measurements.", "Reversing the leads will provide the same reading. An open diode is easily identified using resistance measurements."], "jumps": ["P1245", "P1240"]}, {"id": "P1251", "text": ["An open diode has infinite resistance. The connection between anode and cathode is broken."], "jumps": ["P1260", "P1240"]}, {"id": "P1249", "text": ["Select a faulted diode. Observe the ohmmeter values for each\nfault. Select NEXT when finished.", "Select a faulted diode. Observe the ohmmeter values for each fault. Select NEXT when finished."], "jumps": ["P1320", "P1200", "P1251", "P1270", "P1300"]}, {"id": "P1247", "text": ["Select a faulted diode. Observe the ohmmeter values for each\nfault. Select NEXT when finished.", "Select a faulted diode. Observe the ohmmeter values for each fault. Select NEXT when finished."], "jumps": ["P1320", "P1200"]}, {"id": "P1245", "text": ["Select a faulted diode. Observe the ohmmeter values for each\nfault. Select NEXT when finished.", "Select a faulted diode. Observe the ohmmeter values for each fault. Select NEXT when finished."], "jumps": ["P1320", "P1200", "P1251", "P1270", "P1300"]}, {"id": "P1240", "text": ["Select a faulted diode. Observe the ohmmeter values for each\nfault. Select NEXT when finished.", "Select a faulted diode. Observe the ohmmeter values for each fault. Select NEXT when finished."], "jumps": ["P1320", "P1210", "P1251", "P1270", "P1300"]}, {"id": "P1230", "text": ["Reversing the test leads indicates high resistance between\nthe cathode and the anode. This is a normal reverse resistance\nreading.", "Reversing the test leads indicates high resistance between the cathode and the anode. This is a normal reverse resistance reading."], "jumps": ["P1240", "P1210"]}, {"id": "P1220", "text": ["A good diode has some resistance from the anode to the cathode\nas the meter indicates. This is a normal forward resistance\nreading.", "A good diode has some resistance from the anode to the cathode as the meter indicates. This is a normal forward resistance reading."], "jumps": ["P1230", "P1210"]}, {"id": "P1216", "text": ["Some multimeters apply negative voltage to the positive test lead.  If this occurs, reverse the test leads to forward bias the diode.  Check the instruction manual on your multimeter for further information.", "Some multimeters apply negative voltage to the positive test lead. If this occurs, reverse the test leads to forward bias the diode. Check the instruction manual on your multimeter for further information."], "jumps": ["P1215"]}, {"id": "P1215", "text": ["Different multimeters provide different values. Values depend on; type of diode, internal meter voltage, and internal meter resistance. The important point is that you measure conduction through the diode."], "jumps": ["P1216"]}, {"id": "P1210", "text": ["This ohmmeter indicates a normal reading for a good diode.  Note\nthe polarity of the test leads.", "This ohmmeter indicates a normal reading for a good diode. Note the polarity of the test leads."], "jumps": ["P1204", "P1220", "P1215"]}, {"id": "P1204", "text": ["When using a meter with a negatively polarized internal battery, reverse the test leads and ensure a high and low resistance is measured for a good diode.  If both readings have a high resistance, then the diode is open.  If both readings have a low resistance, then the diode is shorted.", "When using a meter with a negatively polarized internal battery, reverse the test leads and ensure a high and low resistance is measured for a good diode. If both readings have a high resistance, then the diode is open. If both readings have a low resistance, then the diode is shorted.gg resistance measurements, check the meter's instruction manual to determine the polarity of the internal battery. The internal polarity of the meter will determine how you connect the test leads to forward or reverse bias the diode.", "Both measurements have a high resistance = open diodeyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy", "Both measurements have a low resistance = shorted diodeyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy"], "jumps": ["P1210", "P1201"]}, {"id": "P1203", "text": ["When making resistance checks the main objective is to measure a low resistance when forward biased and high resistance when reversed biased.  Remember, this is only a concern when making resistance checks on diodes or other polarity sensitive devices.", "When making resistance checks the main objective is to measure a low resistance when forward biased and high resistance when reversed biased. Remember, this is only a concern when making resistance checks on diodes or other polarity sensitive devices... low resistance when forward biased and high resistance when reversed biased. Remember, this is only a concerne when making resistance checks on diodes or other polarity sensitive devices.bvirttbe"], "jumps": ["P1204", "P1201"]}, {"id": "P1202", "text": ["Some Nida Model multimeters may have an internal battery with a negative polarity.  Throughout the rest of the lesson we will discuss multimeters with a positive internal battery polarity.", "Some Nida Model multimeters may have an internal battery with a negative polarity. Throughout the rest of the lesson we will discuss multimeters with a positive internal battery polarity. en making resistance checks the main objective is to measure a low resistance when forward biased and high resistance when reversed biased. Remember, this is only a concerne when making resistance checks on diodes or other polarity sensitive devices.bvirttbe"], "jumps": ["P1203", "P1201"]}, {"id": "P1201", "text": ["Resistance Checks Only\nWhen making resistance measurements, check the meter's instruction manual to determine the polarity of the internal battery.  The internal polarity of the meter will determine how you connect the test leads to forward or reverse bias the diode.", "Resistance Checks Only When making resistance measurements, check the meter's instruction manual to determine the polarity of the internal battery. The internal polarity of the meter will determine how you connect the test leads to forward or reverse bias the diode.", "Positive internal battery polarity---------", "Forward Biasedyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy", "Reversed Biasedyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy", "Negative internal battery polarityyyyy-----"], "jumps": ["P1202", "P1200"]}, {"id": "P1200", "text": ["If voltage measurements indicate a faulty diode, remove power and check the diode with an analog ohmmeter set to the resistance range or use a digital multimeter with the diode test function."], "jumps": ["P1201", "P1190"]}, {"id": "P1193", "text": ["A voltage drop of 99.3 indicates normal operation. The diode\ndrops about .7 volts and the resistor drops 99.3 volts.", "A voltage drop of 99.3 indicates normal operation. The diode drops about .7 volts and the resistor drops 99.3 volts. ....."], "jumps": []}, {"id": "P1192", "text": ["If the voltage drop across the resistor is zero the diode is open."], "jumps": []}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1190", "text": ["What is the voltage drop of R1 when D1 is shorted?", "What is the voltage drop of R1 when D1 is shorted?........."], "jumps": ["P1180"]}, {"id": "P1183", "text": ["A voltage drop of 99.3 indicates normal operation. The diode\ndrops about .7 volts and the resistor drops 99.3 volts.", "A voltage drop of 99.3 indicates normal operation. The diode drops about .7 volts and the resistor drops 99.3 volts. ....."], "jumps": []}, {"id": "P1182", "text": ["If the voltage drop across the resistor is equal to the applied        voltage, the diode is shorted.", "If the voltage drop across the resistor is equal to the applied voltage, the diode is shorted."], "jumps": []}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1180", "text": ["What is the voltage drop of R1 when D1 is open?", "What is the voltage drop of R1 when D1 is open?............"], "jumps": ["P1070"]}, {"id": "P1170", "text": ["Detection of this fault probably will not occur until the component\nopens or shorts.", "Detection of this fault probably will not occur until the component opens or shorts."], "jumps": ["P1089", "P1070"]}, {"id": "P1160", "text": ["A changed value diode is the least common diode fault. Total\ncurrent may change slightly.", "A changed value diode is the least common diode fault. Total current may change slightly."], "jumps": ["P1170", "P1070", "P1091"]}, {"id": "P1150", "text": ["Normally, in a reverse biased circuit the diode should act like an\nopen switch.", "Normally, in a reverse biased circuit the diode should act like an open switch."], "jumps": ["P1087", "P1070"]}, {"id": "P1140", "text": ["A short provides the same indications in a reverse biased circuit.\nNote the voltage drops are negative.", "A short provides the same indications in a reverse biased circuit. Note the voltage drops are negative."], "jumps": ["P1150", "P1070"]}, {"id": "P1130", "text": ["No voltage is dropped across the shorted diode. A shorted diode\nis easily identified using voltage measurements.", "No voltage is dropped across the shorted diode. A shorted diode is easily identified using voltage measurements."], "jumps": ["P1140", "P1070"]}, {"id": "P1120", "text": ["A shorted diode causes a slightly higher circuit current. Overall\nresistance of the circuit is decreased.", "A shorted diode causes a slightly higher circuit current. Overall resistance of the circuit is decreased."], "jumps": ["P1130", "P1070", "P1091"]}, {"id": "P1110", "text": ["An open diode provides the same indications in a reverse biased\ncircuit. Note, the voltage drops are negative.", "An open diode provides the same indications in a reverse biased circuit. Note, the voltage drops are negative."], "jumps": ["P1085", "P1070"]}, {"id": "P1100", "text": ["The open diode drops the entire applied voltage. An open diode\nis easily identified using voltage measurements.", "The open diode drops the entire applied voltage. An open diode is easily identified using voltage measurements."], "jumps": ["P1110", "P1070"]}, {"id": "P1091", "text": ["A circuit with an open diode will not operate. The open\ncomponent interrupts current flow in the circuit.", "A circuit with an open diode will not operate. The open component interrupts current flow in the circuit."], "jumps": ["P1100", "P1070"]}, {"id": "P1089", "text": ["Select a faulted diode. Observe the change in circuit values.\nSelect NEXT when finished.", "Select a faulted diode. Observe the change in circuit values. Select NEXT when finished."], "jumps": ["P1180", "P1070", "P1091", "P1160", "P1120"]}, {"id": "P1087", "text": ["Select a faulted diode.  Observe the change in circuit values.\nSelect NEXT when finished.", "Select a faulted diode. Observe the change in circuit values. Select NEXT when finished."], "jumps": ["P1180", "P1070", "P1160", "P1091", "P1120"]}, {"id": "P1085", "text": ["Select a faulted diode.  Observe the change in circuit values.\nSelect NEXT when finished.", "Select a faulted diode. Observe the change in circuit values. Select NEXT when finished."], "jumps": ["P1091", "P1180", "P1070", "P1120", "P1160"]}, {"id": "P1080", "text": ["Select a faulted diode.  Observe the change in circuit values.\nSelect NEXT when finished.", "Select a faulted diode. Observe the change in circuit values. Select NEXT when finished."], "jumps": ["P1180", "P1070", "P1091", "P1120", "P1160"]}, {"id": "P1070", "text": ["The voltmeters indicate normal voltage drops for a properly          operating, forward biased diode circuit.", "The voltmeters indicate normal voltage drops for a properly operating, forward biased diode circuit."], "jumps": ["P1080", "P1040"]}, {"id": "P1060", "text": ["Think of a forward biased diode as a closed switch producing       practically no voltage drop.", "Think of a forward biased diode as a closed switch producing practically no voltage drop."], "jumps": ["P1070", "P1040"]}, {"id": "P1050", "text": ["The voltage drop across the diode is very small, representing a knee voltage of .3 volts to .7 volts."], "jumps": ["P1060", "P1040"]}, {"id": "P1040", "text": ["In normal operation, the forward biased diode permits current flow in the circuit as indicated by the voltage drop across R1."], "jumps": ["P1050", "P1020"]}, {"id": "P1030", "text": ["Let's look at each fault separately to identify its effect on         circuit operation and determine how to isolate the fault.", "Let's look at each fault separately to identify its effect on circuit operation and determine how to isolate the fault."], "jumps": ["P1040", "P1020"]}, {"id": "P1020", "text": ["The three most common faults for junction diodes are open, short or changed value."], "jumps": ["P1030", "P1001"]}, {"id": "P1001", "text": ["JUNCTION DIODE FAULTS JUNCTION DIODE FAULTS"], "jumps": []}, {"id": "P900", "text": [], "jumps": ["P430"]}, {"id": "P430", "text": ["Let's begin the lesson on JUNCTION DIODE TROUBLESHOOTING EXPERIMENT........."], "jumps": ["P400"]}, {"id": "P420", "text": ["Resistance measurements and diode tests can identify a faulty diode only when power is not applied to the circuit."], "jumps": ["P430", "P400"]}, {"id": "P410", "text": ["Voltage measurements can identify a faulty diode only when power is applied to the circuit."], "jumps": ["P420", "P400"]}, {"id": "P408", "text": ["DIODE TEST - Digital multimeters do not normally have enough voltage in the resistance ranges to forward bias the junction of a diode, which is necessary for diode testing. Most digital multimeters have a special setting to handle this function."], "jumps": []}, {"id": "P406", "text": ["VOLTAGE MEASUREMENTS - Voltage measurements are used to check the voltage drops of components. The voltage drop across a diode is very small, representing a knee voltage of .3 volts to .7 volts."], "jumps": []}, {"id": "P405", "text": ["RESISTANCE MEASUREMENTS - Resistance measurements on diodes check forward and reverse resistance. Forward resistance is low with a normal range of 20 W to 1 kW. Reverse resistance is very high and normally reads near infinity..."], "jumps": []}, {"id": "P400", "text": ["Identifying a faulted diode may require voltage, resistance, or diode test  measurements.", "Identifying a faulted diode may require voltage, resistance, or diode test measurements."], "jumps": ["P410", "P300"]}, {"id": "P330", "text": [], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "4. Nida Model 480, 488 or equivalent nt"], "jumps": []}, {"id": "P100", "text": ["w Observe an open junction diode in a circuit. w Observe a shorted junction diode in a circuit.", "w Identify an open junction diode circuit. w Identify a shorted junction diode in a circuit. w Identify a changed value junction diode in a circuit.."], "jumps": ["P300", "P10"]}, {"id": "P10", "text": ["JUNCTION DIODE TROUBLESHOOTING EXPERIMENT"], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used i let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
