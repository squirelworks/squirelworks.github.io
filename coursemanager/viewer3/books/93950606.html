ection changes.  Since velocity is speed and direction, this car is also accelerated.", "Changing Direction The magnitude of the car's velocity is constant, but its direction changes. Since velocity is speed and direction, this car is also accelerated..."], "jumps": ["P3040"]}, {"id": "P1100", "text": ["The vertical line through 0, called 0Y, is known as the Y-axis."], "jumps": ["P1110", "P1060"]}, {"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-04-99 Conversion cleanup steps 1 thru 17 - lisa 08-17-99 Reviewed lesson with sam and branching - lisa 12-01-99 Changed comments from dean. debbie 04-26-00 Executed clear response. Penny 07-14-00 Converted to ToolBook 7.1 format. jay 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-04-02 Repaired and reviewed graphics, text, and scripting. Richard S. 02-13-02 Checked text backgrounds,minor graphical fixes. Jeff H. 09-09-02 Objective page format corrected. frieda"], "jumps": []}, {"id": "P3455", "text": ["MAXIMUM HEIGHT - Remember, since the upward initial acceleration is positive, the acceleration of gravity will be negative. The formula to find the maximum height of the object is:"], "jumps": []}, {"id": "P3920", "text": ["1.   Acceleration is the rate of change of velocity with time.", "1. Acceleration is the rate of change of velocity with time."], "jumps": ["P3930", "P3001"]}, {"id": "P3950", "text": ["4.   If we make the same calculation at two times which are later           in the process, we should get the same acceleration.", "4. If we make the same calculation at two times which are later in the process, we should get the same acceleration......"], "jumps": ["P3960", "P3940"]}, {"id": "P3970", "text": ["6.   Here are some examples of different formulas for acceleration.", "6. Here are some examples of different formulas for acceleration."], "jumps": ["P3999", "P3960"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["Let's examine the graph of a car having a constant acceleration.", "You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre", "P3100"]}, {"id": "P3120", "text": ["Each point represents an instantaneous velocity.   All the points lie on a straight line, showing the direct relationship between time and velocity.", "Increasing Velocity\nAs the car increases speed, the distance traveled increases in respect to a given period of time.", "Each point represents an instantaneous velocity. All the points lie on a straight line, showing the direct relationship between time and velocity.", "Increasing Velocity As the car increases speed, the distance traveled increases in respect to a given period of time.."], "jumps": ["P3110", "P3020"]}, {"id": "P3190", "text": ["What is the acceleration of a car that starts from zero and accelerates to 27 m/sec in 12 seconds?"], "jumps": ["P3180"]}, {"id": "P3220", "text": ["This means a body falling from rest has a velocity of 9.8 m/sec after the first second, a velocity of 19.6 m/sec after the next second, and continues like this until it reaches the ground."], "jumps": ["P3230", "P3210"]}, {"id": "P3192", "text": ["Your answer is incorrect.  Use the formula below to figure the acceleration of the car.", "Your answer is incorrect. Use the formula below to figure the acceleration of the car."], "jumps": []}, {"id": "P3270", "text": ["A watermelon is dropped from the top of a bank which is 50 meters high.   First, let's determine how long it will take before the watermelon hits the ground and explodes.", "A watermelon is dropped from the top of a bank which is 50 meters high. First, let's determine how long it will take before the watermelon hits the ground and explodes."], "jumps": ["P3280", "P3250"]}, {"id": "P3390", "text": ["Since the acceleration of gravity is downward and opposite to the positive upward acceleration, the value of gravity will be negative.", "A body whose velocity is not constant is accelerated.  This term applies whether velocity is increasing, decreasing or changing in direction.", "A body whose velocity is not constant is accelerated. This term applies whether velocity is increasing, decreasing or changing in direction."], "jumps": ["P3400", "P3340", "P3020", "P3001"]}, {"id": "P3095", "text": ["When the final velocity is less than the initial velocity, the acceleration is negative; this means the body is going slower and slower."], "jumps": ["P3080"]}, {"id": "P3130", "text": ["Although the car's velocity is not constant, it varies in a uniform way with time: as time goes on, the velocity increases at exactly the same rate."], "jumps": ["P3110"]}, {"id": "P2980", "text": ["9.   For an object having varying velocities, we need to know the         total distance (s) that is covered and the total time (t) involved.", "9. For an object having varying velocities, we need to know the total distance (s) that is covered and the total time (t) involved.", "1. s1 = 400 km/hr x 4 hrs 2. s1 = 1600 km", "3. s2 = 500 km/hr x3.5 4hrs 4. s2 = 1750 km", "5. s = 1600 km + 1750 km = 3350 km 6. t = 4 hr + 3.5 hr = 7.5 hr", "7. v = 3350 km/7.5 hr 8. v = 447 km/hr 4 hr + 3.5 hr = 7.5 hr"], "jumps": ["P2999", "P2970"]}, {"id": "P2999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "7.   Although the velocity of the car varies, at every instant it has          a specific value, called the instantaneous velocity.", "You have completed the Summary. You are about to return to the Objective Menu.", "7. Although the velocity of the car varies, at every instant it has a specific value, called the instantaneous velocity...."], "jumps": ["P2001", "P2980", "P2970", "P2952"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3070", "text": ["The standard formula for acceleration is:", "The standard formula for acceleration is:.................."], "jumps": ["P3060"]}, {"id": "P3100", "text": ["From its definition, acceleration is expressed in terms of:", "When the final velocity is greater than the initial velocity, the acceleration is positive, meaning the object is going faster and faster."], "jumps": ["P3080"]}, {"id": "P2950", "text": ["5.   If the object has a constant velocity, this is what a typical                graph showing the relationship between distance and time             would look like.", "5. If the object has a constant velocity, this is what a typical graph showing the relationship between distance and time would look like."], "jumps": ["P2952", "P2942"]}, {"id": "P2952", "text": ["6.   Not all objects have constant velocities.   In the graph below,         the line joining the various points is not straight, it is curved           upward.", "6. Not all objects have constant velocities. In the graph below, the line joining the various points is not straight, it is curved upward..."], "jumps": ["P2960", "P2950"]}, {"id": "P3120", "text": ["Each point represents an instantaneous velocity.   All the points lie on a straight line, showing the direct relationship between time and velocity.", "Each point represents an instantaneous velocity. All the points lie on a straight line, showing the direct relationship between time and velocity."], "jumps": ["P3110"]}, {"id": "P3140", "text": ["To calculate this car's acceleration, we start at the initial velocity and take any point along the acceleration line."], "jumps": ["P3150", "P3110"]}, {"id": "P3170", "text": ["The first value of velocity does not have to be zero.   For example, we can use 5 meters per second as the initial velocity and 10 meters per second as the second velocity.", "The first value of velocity does not have to be zero. For example, we can use 5 meters per second as the initial velocity and 10 meters per second as the second velocity."], "jumps": ["P3180", "P3160"]}, {"id": "P3180", "text": ["Total time is represented by the time elapsed between these two velocities, which is 20 seconds.   Inserting these values into the formula illustrates how the acceleration is the same throughout.", "Total time is represented by the time elapsed between these two velocities, which is 20 seconds. Inserting these values into the formula illustrates how the acceleration is the same throughout."], "jumps": ["P3190", "P3160"]}, {"id": "P3191", "text": [], "jumps": []}, {"id": "P2942", "text": ["4.   If we are given the velocity and the distance traveled, we need       to find how long it takes to get there. The formula is:", "4. If we are given the velocity and the distance traveled, we need to find how long it takes to get there. The formula is:"], "jumps": ["P2950", "P2940"]}, {"id": "P2910", "text": ["You have completed the information on VELOCITY MEASUREMENTS.", "You have completed the information on VELOCITY MEASUREMENTS.", "You have completed the information on VELOCITY MEASUREMENTS.."], "jumps": ["P2001", "P2480"]}, {"id": "P2930", "text": ["2.   Displacement shows change of position in a particular                    direction while speed is defined as time rate of motion.", "2. Displacement shows change of position in a particular direction while speed is defined as time rate of motion."], "jumps": ["P2940", "P2920"]}, {"id": "P2482", "text": ["To find the average velocity, separate the velocities and times into two separate distance problems.  Once you find the distance values, calculate distance as the total distance of the two problems and calculate time as the total times of the two problems. Last, insert these values into the standard formula for velocity.", "To find the average velocity, separate the velocities and times into two separate distance problems. Once you find the distance values, calculate distance as the total distance of the two problems and calculate time as the total times of the two problems. Last, insert these values into the standard formula for velocity...."], "jumps": []}, {"id": "P2485", "text": ["Note The distance interval of the tangency line ranges from 200 meters to 300 meters. The time interval between them ranges from 50 seconds to 60 seconds.", "1. Calculate s1 s1 = v1 x t1 = 325 x 3.5 2. Calculate s2 s2 = v2 x t2 = 440 x 6.5 3. Calculate average distance add v1 + v2 4. Calculate average time add t1 + t2 5. Calculate average velocity v = s / ttttttt"], "jumps": []}, {"id": "P2940", "text": ["3.  Velocity is always measured in the following format: the                  distance the object is traveling divided by the time it takes to          travel that distance.", "3. Velocity is always measured in the following format: the distance the object is traveling divided by the time it takes to travel that distance."], "jumps": ["P2942", "P2920"]}, {"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-04-99 Conversion cleanup steps 1 thru 17 - lisa 08-17-99 Reviewed lesson with sam and branching - lisa 12-01-99 Changed comments from dean. debbie 04-26-00 Executed clear response. Penny 07-14-00 Converted to ToolBook 7.1 format. jay 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-04-02 Repaired and reviewed graphics, text, and scripting. Richard S. 02-13-02 Checked text backgrounds,minor graphical fixes. Jeff H. 09-09-02 Objective page format corrected. frieda 06-19-03 P10226 r", "07-29-99 Converted to new question format. jay 08-04-99 Conversion cleanup steps 1 thru 17 - lisa 08-17-99 Reviewed lesson with sam and branching - lisa 12-01-99 Changed comments from dean. debbie 04-26-00 Executed clear response. Penny 07-14-00 Converted to ToolBook 7.1 format. jay 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-04-02 Repaired and reviewed graphics, text, and scripting. Richard S. 02-13-02 Checked text backgrounds,minor graphical fixes. Jeff H. 09-09-02 Objective page format corrected. frieda 06-19-03 P10226 replaced question, P10227 Meters per second not seconds squared. P3430,P3440 T=1.6 to t = 1.6 sec. P2180,P2210 velocity to speed. P3400 -256m/sec(2) to -256 m(2)/sec(2). P10213 Swapped answers a and c to make 192.50 kilometers the correct answer. P10225 changed correct to 4.3 m/sec(2). P3280 t=3.19 m/sec to 3.19 sec. P3230,P3240 changed graphics. Lydia"], "jumps": ["P"]}, {"id": "P2960", "text": ["7.   Although the velocity of the car varies, at every instant it has          a specific value, called the instantaneous velocity.", "7. Although the velocity of the car varies, at every instant it has a specific value, called the instantaneous velocity...."], "jumps": ["P2970", "P2952"]}, {"id": "P2970", "text": ["8.  The average velocity, called v, of an object during a period of          time (t) is the total displacement (s) it has undergone in that            period of time divided by (t).", "8. The average velocity, called v, of an object during a period of time (t) is the total displacement (s) it has undergone in that period of time divided by (t)."], "jumps": ["P2980", "P2952"]}, {"id": "P2440", "text": ["In the first part of the flight, the airplane covers:", "In the first part of the flight, the airplane covers:......"], "jumps": ["P2450", "P2430"]}, {"id": "P2480", "text": ["What is the average velocity for an airplane that takes off at 10:30 P.M. and flies in a straight path at 325 km/hr until 2:00 A.M?  At 2:00 A.M. its velocity is increased to 440 km/hr and it maintains this velocity in the same direction as before until it finally lands at 8:30 A.M.", "What is the average velocity for an airplane that takes off at 10:30 P.M. and flies in a straight path at 325 km/hr until 2:00 A.M? At 2:00 A.M. its velocity is increased to 440 km/hr and it maintains this velocity in the same direction as before until it finally lands at 8:30 A.M......."], "jumps": ["P2470", "P2485"]}, {"id": "P2460", "text": ["To obtain the total values for distance and time:", "To obtain the total values for distance and time:.........."], "jumps": ["P2470", "P2440"]}, {"id": "P2470", "text": ["Using the formula for average velocity, we get:", "Using the formula for average velocity, we get:............"], "jumps": ["P2480", "P2460"]}, {"id": "P3060", "text": ["Just as velocity is the rate of change of displacement with time, acceleration is the rate of change of velocity with time."], "jumps": ["P3050"]}, {"id": "P3090", "text": ["When the final velocity is greater than the initial velocity, the acceleration is positive, meaning the object is going faster and faster."], "jumps": ["P3080"]}, {"id": "P2430", "text": ["For example, an airplane takes off at 10:00 A.M. and flies westward at 400 km/hr until 2:00 P.M.   At 2:00 P.M. its velocity increases to 500 km/hr and is maintained until it lands at 5:30 P.M.   What is the flight's average velocity?", "For an object having varying velocities, we need to know the total distance (s) that is covered and the total time (t) involved.", "For example, an airplane takes off at 10:00 A.M. and flies westward at 400 km/hr until 2:00 P.M. At 2:00 P.M. its velocity increases to 500 km/hr and is maintained until it lands at 5:30 P.M. What is the flight's average velocity?"], "jumps": ["P2440", "P2420"]}, {"id": "P2360", "text": ["The average velocity, called v, of an object during a period of time (t) is the total displacement (s) it has undergone in that period of time divided by (t)."], "jumps": ["P2370", "P2350"]}, {"id": "P2370", "text": ["Notice how this formula is the same as the definition of an object moving at a constant velocity."], "jumps": ["P2380", "P2350"]}, {"id": "P2390", "text": ["Let's look at an example of average velocity."], "jumps": ["P2400", "P2350"]}, {"id": "P2345", "text": ["VELOCITY - Your first step is to find the point at 55 seconds that lies along the curve. Once you find this point, draw the tangency line along the curve.", "Note The distance interval of the tangency line ranges from 200 meters to 300 meters. The time interval between them ranges from 50 seconds to 60 seconds..", "Note The distance interval of the tangency line ranges from 200 meters to 300 meters. The time interval between them ranges from 50 seconds to 60 seconds."], "jumps": []}, {"id": "P2342", "text": ["100 m/sec is not the instantaneous velocity.   Remember to use this formula: v = Ds/D t.", "100 m/sec is not the instantaneous velocity.   Remember to use this formula: v = Ds/D t.", "100 m/sec is not the instantaneous velocity. Remember to use this formula: v = Ds/D t."], "jumps": []}, {"id": "P2340", "text": ["Using the chart below, what is the instantaneous velocity of a car at 55 seconds?"], "jumps": ["P2290", "P2345"]}, {"id": "P2380", "text": ["For an object whose velocity varies, the instantaneous velocity is normally different from the average velocity."], "jumps": ["P2390", "P2350"]}, {"id": "P2320", "text": ["By looking at the curve, we see that the distance interval is 50 meters and the time interval is 7 seconds.", "By looking at the curve, we see that the distance interval is 50 meters and the time interval is 7 seconds.", "By looking at the curve and drawing our tangency line, we can determine what the velocity of the car is at one second in time."], "jumps": ["P2330", "P2290"]}, {"id": "P2310", "text": ["By looking at the curve and drawing our tangency line, we can determine what the velocity of the car is at one second in time."], "jumps": ["P2320", "P2290"]}, {"id": "P2330", "text": ["Using the formula for instantaneous velocity, we can determine that at 40 seconds into the trip, the car was traveling at 7.14 meters per second."], "jumps": ["P2340", "P2290"]}, {"id": "P2343", "text": ["50 m/sec is not the instantaneous velocity.   Remember to use this formula: v = Ds/D t.", "50 m/sec is not the instantaneous velocity. Remember to use this formula: v = Ds/D t."], "jumps": []}, {"id": "P2341", "text": ["TANGENT -  A line that is tangent to another surface is one making contact at a single point along the surface, touching it but not intersecting it.", "TANGENT - A line that is tangent to another surface is one making contact at a single point along the surface, touching it but not intersecting it."], "jumps": []}, {"id": "P2282", "text": ["To find the instantaneous velocity at a particular time, we draw a straight line tangent to the curve at the time value we are looking for."], "jumps": ["P2290", "P2230"]}, {"id": "P2270", "text": ["Although the velocity of the car varies, at every instant it has a specific value, called the instantaneous velocity."], "jumps": ["P2280", "P2230"]}, {"id": "P2250", "text": ["For each interval of time, the car goes a greater distance.  This means the car is going faster and faster.  Press enter to see the plotted values.", "For each interval of time, the car goes a greater distance. This means the car is going faster and faster. Press enter to see the plotted values."], "jumps": ["P2260", "P2230"]}, {"id": "P2280", "text": ["To find the instantaneous velocity at a particular time, we draw a straight line tangent to the curve at the time value we are looking for."], "jumps": ["P2290", "P2230"]}, {"id": "P2285", "text": ["TANGENT - A line that is tangent to another surface is one making contact at a single point along the surface, touching it but not intersecting it."], "jumps": []}, {"id": "P2350", "text": ["Just as we are interested in the instantaneous velocity of a moving object, we somtimes need to find the average velocity."], "jumps": ["P2360", "P2340"]}, {"id": "P2220", "text": ["If the object has a constant velocity, this is what a typical graph showing the relationship between distance and time."], "jumps": ["P2230", "P2210"]}, {"id": "P2410", "text": ["Since the car went a total distance of 450 meters in 73 seconds, its average velocity can be calculated in the following manner."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["For an object having varying velocities, we need to know the total distance (s) that is covered and the total time (t) involved.", "What is the velocity of a train that travels 352 miles in 4 hours?"], "jumps": ["P2430", "P2400"]}, {"id": "P2212", "text": ["To find the velocity, divide the distance traveled by the time it takes for the train to reach its destination."], "jumps": []}, {"id": "P2260", "text": ["Because the distance is not directly proportional to time, the car's velocity is not constant."], "jumps": ["P2270", "P2230"]}, {"id": "P2300", "text": ["On the example below, we want to figure out the instantaneous velocity at 40 seconds from the beginning."], "jumps": ["P2310", "P2290"]}, {"id": "P2210", "text": ["What is the speed of a train that travels 352 miles in 4 hours?", "What is the speed of a train that travels 352 miles in 4 hours?rs?"], "jumps": ["P2180"]}, {"id": "P2240", "text": ["By plotting these values on a graph, we see the line joining the various points is not straight like the constant velocity graph, it is curved upward."], "jumps": ["P2250", "P2230"]}, {"id": "P2160", "text": ["The basic formula for figuring velocity is: \nvelocity = distance/time. (V = d/t).", "The basic formula for figuring velocity is: velocity = distance/time. (V = d/t)."], "jumps": ["P2170", "P2140"]}, {"id": "P2170", "text": ["By knowing any two of these values, we can figure out what the third one will be."], "jumps": ["P2180", "P2140"]}, {"id": "P2290", "text": ["We determine the velocity from this straight line using this formula: velocity = the distance interval between the ends of the line divided by time interval between these distances. (v =Ds/Dt)", "What is the velocity of a train that travels 352 miles in 4 hours?", "1.   One of the most common vector quantities is velocity.  There          are two elements of velocity; displacement and speed.", "Decreasing Velocity\nAs the car decreases speed, the distance traveled decreases in respect to a given period of time.", "The greater the distance at which an object falls after being dropped, the greater its speed when it hits the ground.   But the acceleration is always the same.", "We determine the velocity from this straight line using this formula: velocity = the distance interval between the ends of the line divided by time interval between these distances. (v =Ds/Dt)))", "1. One of the most common vector quantities is velocity. There are two elements of velocity; displacement and speed.", "Decreasing Velocity As the car decreases speed, the distance traveled decreases in respect to a given period of time..", "The greater the distance at which an object falls after being dropped, the greater its speed when it hits the ground. But the acceleration is always the same."], "jumps": ["P2300", "P2282", "P2930", "P2001", "P3030"]}, {"id": "P3250", "text": ["The formula for calculating the time it takes a free falling object to reach the ground is:", "h = height object is dropped g = acceleration of gravity"], "jumps": ["P3260", "P3230"]}, {"id": "P3300", "text": ["Since the watermelon starts at rest, the initial velocity is zero. Insert the values for acceleration of gravity and the time to get:", "For example, if you are walking at a speed of 3 meters per second, you have traveled 3 meters in one second.", "Since the watermelon starts at rest, the initial velocity is zero. Insert the values for acceleration of gravity and the time to get: 1. v = 0 + (9.8 x 3.19) 2. v = 31.26 m/sec", "1. v = 0 + (9.8 x 3.19) 2. v = 31.26 sec"], "jumps": ["P3310", "P3270", "P2090", "P2070"]}, {"id": "P2100", "text": ["Direction separates speed from velocity.   Velocity combines displacement with speed to illustrate an object moving at a certain speed in a certain direction.", "Direction separates speed from velocity. Velocity combines displacement with speed to illustrate an object moving let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
