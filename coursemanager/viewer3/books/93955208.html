const book = {"title": "93955208", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: TROUBLESHOOTING CLOSED LOOP FEEDBACK SYSTEMSsadf"], "jumps": []}, {"id": "P10", "text": ["TROUBLESHOOTING CLOSED LOOP FEEDBACK SYSTEMS"], "jumps": []}, {"id": "P100", "text": ["1. Troubleshooting Closed Loop Feedback Systems", "w Verify troubleshooting techniques. w Trace a typical closed loop feedback system.", "w Develop a procedure for troubleshooting closed loop feedback systems. w Describe the steps to troubleshoot the closed loop system used in the 280 trainer."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "3. Nida Model 280 Rotating Machinery Trainer", "6. Nida Model 414 Variac imeterXXXXXXXXXXnt"], "jumps": []}, {"id": "P301", "text": [], "jumps": []}, {"id": "P330", "text": ["Nida Model 280 Rotating Machinery Trainer"], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P341", "text": [], "jumps": []}, {"id": "P350", "text": [], "jumps": ["P"]}, {"id": "P360", "text": [], "jumps": []}, {"id": "P361", "text": [], "jumps": []}, {"id": "P362", "text": [], "jumps": []}, {"id": "P363", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn troubleshooting techniques for closed loop feedback systems."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Since closed loop feedback systems are commonly used, a troubleshooting technique is crucial."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["This lesson allows you a hands-on opportunity to troubleshoot a closed loop feedback system."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["The technique in this lesson can be applied to any closed loop system."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["Let's begin the lesson on TROUBLESHOOTING CLOSED LOOP FEEDBACK SYSTEMS......"], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": ["TROUBLESHOOTING CLOSED LOOP FEEDBACK SYSTEMS"], "jumps": []}, {"id": "P1020", "text": ["There are a wide variety of closed loop feedback systems..."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["The fundamental philosophy behind any closed loop feedback system is the same."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Regardless of how complicated a feedback system seems, a systematic troubleshooting approach will yield good results."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["The systems should first be analyzed using a Macroscopic approach."], "jumps": ["P1060", "P1030"]}, {"id": "P1060", "text": ["The problem can then be reduced to a microscopic level."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["A macroscopic approach to a feedback system can be represented in a block diagram."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["Notice that the output of the motor affects the input."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["In the case of the 280 trainer, the feedback system is simple."], "jumps": ["P1095", "P1070"]}, {"id": "P1095", "text": ["The macroscopic approach is to isolate the fault to the 280 Trainer or 130 Test Console cards."], "jumps": ["P1100", "P1090"]}, {"id": "P1100", "text": ["The microscopic view might be one portion of the feedback path."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["Once the problem is isolated to the microscopic level, you then troubleshoot down to the component like in any electronic circuit. Inductor Capacitor Resistor"], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["Troubleshooting should initially be approached using a _______ point of view."], "jumps": ["P1110"]}, {"id": "P1121", "text": [], "jumps": []}, {"id": "P1122", "text": ["Troubleshooting can eventually be reduced to a microscopic or component level but not initially."], "jumps": []}, {"id": "P1126", "text": ["Let's look at the steps that are followed to troubleshoot the 280 Trainer when using feedback circuits on the 130 Test Console."], "jumps": ["P1130", "P1120"]}, {"id": "P1130", "text": ["Troubleshooting Steps Step 1: Recognize the problem. Step 2: Proper equipment setup. Step 3: Verify problem not related to motor. Step 4: Verify input to controlling circuitry. Step 5: Verify output of controlling circuitry.", "The first step of the troubleshooting procedure is to recognize the problem.", "Is motor being controlled? Does motor run properly?"], "jumps": ["P1140", "P1126"]}, {"id": "P1140", "text": ["This is usually the most difficult part of the troubleshooting procedure."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["The second step is to make certain that all equipment is setup properly.", "Troubleshooting Steps Step 1: Recognize the problem. Step 2: Proper equipment setup. Step 3: Verify problem not related to motor. Step 4: Verify input to controlling circuitry. Step 5: Verify output of controlling circuitry."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["Most problems with feedback systems can be attributed to human error."], "jumps": ["P1170", "P1130"]}, {"id": "P1170", "text": ["Troubleshooting Steps Step 1: Recognize the problem. Step 2: Proper equipment setup. Step 3: Verify problem not related to motor. Step 4: Verify input to controlling circuitry. Step 5: Verify output of controlling circuitry.", "The third step is to verify that the problem is not related to the motor. You are starting to isolate the circuit."], "jumps": ["P1173", "P1130"]}, {"id": "P1173", "text": ["If the motor is not operating correctly, you have found the problem. Fix or replace the motor."], "jumps": ["P1176", "P1130"]}, {"id": "P1176", "text": ["If the motor is operating correctly, continue with the troubleshooting steps."], "jumps": ["P1180", "P1130"]}, {"id": "P1180", "text": ["Measure the output of the sensing circuitry to the input of the controller circuitry."], "jumps": ["P1182", "P1130"]}, {"id": "P1182", "text": ["If the output of the sensing circuit is incorrect, troubleshoot the RPM and associated circuitry on the 280 trainer."], "jumps": ["P1184", "P1130"]}, {"id": "P1184", "text": ["If the input to controller circuitry is incorrect when the output of the sensor circuits is correct, troubleshoot the interconnecting cables.les.", "Troubleshooting Steps Step 1: Recognize the problem. Step 2: Proper equipment setup. Step 3: Verify problem not related to motor. Step 4: Verify input to controlling circuitry. Step 5: Verify output of controlling circuitry."], "jumps": ["P1190", "P1130"]}, {"id": "P1190", "text": ["If the output of the sensor circuits and input to controller circuits are correct, continue the troubleshooting steps.", "Troubleshooting Steps Step 1: Recognize the problem. Step 2: Proper equipment setup. Step 3: Verify problem not related to motor. Step 4: Verify input to controlling circuitry. Step 5: Verify output of controlling circuitry."], "jumps": ["P1200", "P1130"]}, {"id": "P1200", "text": ["Measure the output of the controller circuitry to the input of the motor.", "Troubleshooting Steps Step 1: Recognize the problem. Step 2: Proper equipment setup. Step 3: Verify problem not related to motor. Step 4: Verify input to controlling circuitry. Step 5: Verify output of controlling circuitry."], "jumps": ["P1210", "P1130"]}, {"id": "P1210", "text": ["If the output of the controller circuitry is incorrect, troubleshoot the PC130-281 card."], "jumps": ["P1220", "P1130"]}, {"id": "P1220", "text": ["If the input to the motor is incorrect when the output of the controlling circuitry is correct troubleshoot the interconnecting cables."], "jumps": ["P1230", "P1130"]}, {"id": "P1230", "text": ["If the output of the controlling circuits and input to the motor are correct, there is NO fault."], "jumps": ["P1236", "P1130"]}, {"id": "P1236", "text": ["Remember, this is a closed loop system. You are back to where you started, check the motor....."], "jumps": ["P1240", "P1130"]}, {"id": "P1240", "text": ["If the input to the controlling circuitry is bad and the motor is producing an output, which of the following is a valid problem?"], "jumps": ["P1130"]}, {"id": "P1241", "text": [], "jumps": []}, {"id": "P1242", "text": ["The controlling circuitry may or may not be faulty. Since a signal is not reaching the circuitry, look elsewhere for the fault."], "jumps": []}, {"id": "P1243", "text": ["If the motor is producing an output then the error cannot be the motor."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on TROUBLESHOOTING CLOSED LOOP FEEDBACK SYSTEMS."], "jumps": ["P1001", "P1240"]}, {"id": "P1920", "text": ["1. When troubleshooting, begin with a macroscopic approach and work your way down to a component level.."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. First, recognize the problem and make certain the problem is not human engineered."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. Make sure that the problem is not in the motor itself. tput Controlling Input Circuitry Motor Input Output Closed Loop Feedback System"], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. Isolate the controlling circuitry by verifying that there is an input signal and an output signal."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. If there is a solid input and a good output, then the controlling circuitry is fine."], "jumps": ["P1970", "P1940"]}, {"id": "P1970", "text": ["6. If the motor is running but no signal is being applied to the controlling circuitry, examine the sensing circuitry. 130-280 Controlling Interface Circuitry Output Input Sensing"], "jumps": ["P1980", "P1940"]}, {"id": "P1980", "text": ["7. If there is a good input to the controlling circuitry but no output, reduce the problem to the component level inside the controlling circuit. a Corp."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["In this experiment you will troubleshoot the closed loop feedback system used on the 280 rotating machinery trainer."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["You will follow the troubleshooting steps learned in the theory portion of this lesson."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["The techniques used in this experiment apply to any closed loop feedback system."], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["Let's begin the experiment. 1. Set the 280 trainer to it's initial control settings."], "jumps": ["P2060", "P2040", "P22000"]}, {"id": "P2060", "text": ["2. Set the Test Console controls to their initial control settings........"], "jumps": ["P2050"]}, {"id": "P2070", "text": ["3. On the 280 trainer, set the following AC motor controls as follows: AC SWITCHES Line Meter - INNNN"], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["4. To configure the DC motor for a series field, set the controls as follows: SWITCH SETTINGS RUN/STOP - RUN SERIES FIELD - IN"], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["5. Insert PC130-281 into the PC2 position on the 130 test console. 6. Insert PC130-280 into the PC3 position on the 130 test console........"], "jumps": ["P2080", "P2110"]}, {"id": "P2110", "text": ["7. Set R12 on PC130-281 to fully clockwise................"], "jumps": ["P2120", "P2090", "P2115"]}, {"id": "P2115", "text": ["MEASUREMENT SETUP - Set R12 on PC130-281 fully clockwise."], "jumps": []}, {"id": "P2120", "text": ["8. Connect the 2 pin interconnect from the PC130-281 experiment card to the PC130-286 connector located on the rear of the 280 trainer."], "jumps": ["P2110", "P2130", "P"]}, {"id": "P2130", "text": ["9. Connect the 8 pin connector from the PC130-280 card to the PC130-280 connector on the 280 trainer. 80 Trainer 130A Test ConsoleON........................................."], "jumps": ["P2140", "P2120", "P"]}, {"id": "P2140", "text": ["10. Connect the 2 Pin Jack cable from the output jacks of the Variac to the 115 VAC input jacks located on the AC subpanel of the 280 trainer."], "jumps": ["P2150", "P2120"]}, {"id": "P2150", "text": ["11. Connect the 14-pin dip clip to IC2 located on the 281 controller card. Note: The smallest dip clip is 14 pin. Press the clip open and clip on to IC2..", "Note: The smallest dip clip is 14 pin. Press the clip open and clip on to IC2."], "jumps": ["P2140"]}, {"id": "P2160", "text": ["12. Set the 130 controls as follows: Filament - ON Negative Supply Voltage - 12 V Positive Supply Voltage - 12 V", "12. Press enter to set the 130E Test Console controls as follows: ntrols as follows: t.......... ON + Power Supply... 24 Volts - Power Supply....15 Volts"], "jumps": ["P2150"]}, {"id": "P2170", "text": ["13. Set PC2 and PC3 DC Power switches to ON.", "13. Press Enter to Set PC2 and PC3 DC Power - ON.", "13. Press Enter to Set PC2 and PC3 DC Power - ON.A - Set the PC1 DC Switch to ON...."], "jumps": []}, {"id": "P2180", "text": ["14. Turn power on to the Variac and set the line voltage for 75%. If motor action does not occur, check your setup."], "jumps": ["P2200", "P2185"]}, {"id": "P2185", "text": ["MEASUREMENT SETUP - Turn Variac power ON and set the line voltage to 75%."], "jumps": []}, {"id": "P2200", "text": ["15. Vary R12 to verify proper motor speed control........."], "jumps": ["P2210", "P2180"]}, {"id": "P2210", "text": ["Since motor RPM changes as R12 is varied, you know the feedback system is operating correctly.", "1. As a review of the controlling circuit signals, measure the following signals using the oscilloscope (Vary R12)."], "jumps": ["P2220", "P2200", "P2230", "P2210", "P2225"]}, {"id": "P2225", "text": ["OSCILLOSCOPE SETUP - Set the oscilloscope controls as follows:::", "Time/Div - .5mS Display - CH1 Trigger - AC, + Source - CH1 CH1 & CH2 Volts/Div - .5V CH1 & CH2 AC/GND/DC - AC Probe - X1000"], "jumps": []}, {"id": "P2230", "text": ["2. Now, measure the signal on IC2 Pin 2. This is the input to the Op-Amp. It is negative due to the bias from R11."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["3. Measure the signal on IC2 Pin 6. This is the output to the gate of the Triac."], "jumps": ["P2250", "P2220"]}, {"id": "P2250", "text": ["The computer will now insert a fault. Let's follow the five steps and determine what the fault is. CH1 ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2220"]}, {"id": "P2255", "text": ["Step 1: Recognize the problem. Is the motor running? Do you have speed control by varying R12 on PC130-281?"], "jumps": ["P2260"]}, {"id": "P2260", "text": ["Which statement best describes the operation of the motor?.", "The controlling circuit operates the motor either fully on or completely off."], "jumps": ["P2255"]}, {"id": "P2261", "text": [], "jumps": []}, {"id": "P2262", "text": ["The 280 Trainer motor's should be rotating. The inserted fault does not cause the DC motor to fail or lose input power."], "jumps": []}, {"id": "P2263", "text": ["You should have noticed that by varying PC130-281 R12, the motor was either fully on or completely stopped. The controlling circuitry does effect the DC motor."], "jumps": []}, {"id": "P2270", "text": ["Step 2: Proper Equipment Setup. Since you passed the point in the experiment that verified that R12 on PC130-281 controlled the motors speed, you can assume that the experiment is setup correctly."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["Step 3: Verify problem not related to motor. Since the motor is running, it is probably not the motor that is causing the faulted operation..."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["Step 4: Verify input to controlling circuitry. 1. Using the oscilloscope, measure output of the motor on the PC130-280 TACH test point. PC130-281 PC130-280 Controlling Interface Circuitry Output"], "jumps": ["P2295", "P2280"]}, {"id": "P2295", "text": ["2. Using the oscilloscope, measure the input to the controlling circuitry on Pin U of PC130-281."], "jumps": ["P2300", "P2290"]}, {"id": "P2300", "text": ["3. With the oscilloscope connected to Pin U on PC130-281, rotate R12 fully CCW. If the input to the controlling circuitry is operating correctly, you should see the square wave decrease in frequency to 0 as the motor slowed down.."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["Is the input to the controlling circuitry correct?........."], "jumps": ["P2300"]}, {"id": "P2311", "text": [], "jumps": []}, {"id": "P2312", "text": ["The input to the controlling circuitry is correct.........."], "jumps": []}, {"id": "P2320", "text": ["With the correct input to the controlling circuitry, you know that the sensing circuits are good and the interface from the 280 to the 130 is good."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["Step 5: Verify output of controlling circuitry. 1. Using the oscilloscope, measure the signal between Control 1 and Control 2 on PC130-280 (use Control 2 as ground with a X10 probe) while varying PC130-281 R12."], "jumps": ["P2335", "P2320"]}, {"id": "P2335", "text": ["2. Using the oscilloscope, measure the signal between TPE and TPF on the 280 Trainer (use TPE as ground with a X10 probe) while varying PC130-281 R12."], "jumps": ["P2340", "P2330"]}, {"id": "P2340", "text": ["Which statement best describes the output of the controller circuitry?"], "jumps": ["P2330"]}, {"id": "P2341", "text": [], "jumps": []}, {"id": "P2342", "text": ["With PC130-281 R12 fully CCW, the output voltage of the controlling circuitry is 0 volts."], "jumps": []}, {"id": "P2350", "text": ["Since the output circuitry was either 360", "of the output voltage or 0 volts, this shows that the fault was in the speed control circuitry. All other possibilities were eliminated.."], "jumps": ["P2340"]}, {"id": "P2610", "text": ["1. Return the Test Console to the initial control settings................"], "jumps": ["P2350"]}, {"id": "P2620", "text": ["2. Return the 280 trainer to it's initial control settings.", "1. Return the 280 trainer to it's initial control settings.", "1. Return the 280 trainer to it's initial control settings.1. Return the 280 trainer to it's initial control settings."], "jumps": ["P2630", "P2610", "P22000"]}, {"id": "P2630", "text": ["2. Set the Console switch to OFF.o OFF...................."], "jumps": []}, {"id": "P2640", "text": ["4. Disconnect all test equipment, cables and 14 Pin Dip Clip.", "4. Remove PC130-280 and PC130-281 experiment cards.", "3. Disconnect all test equipment, cables and 14 Pin Dip Clip.", "5. Remove PC130-280 and PC130-281 experiment cards.", "4. Disconnect all test equipment, cables and 14 Pin Dip Clip. 5. Remove PC130-280 and PC130-281 experiment cards.s."], "jumps": ["P2910", "P2630"]}, {"id": "P2910", "text": ["This completes the experiment on TROUBLESHOOTING CLOSED LOOP FEEDBACK SYSTEMS."], "jumps" let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
