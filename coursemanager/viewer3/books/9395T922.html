const book = {"title": "9395T922", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: HF FUNDAMENTALSsdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["1. HF Radio Characteristicsr objective 1 line item 2 here. item 2 here.e.e.", "2. HF Radio Theory of Operation.ective 1 line item 2 here. item 2 here.e.e.", "w Define the purpose of an HF system. w Identify the HF frequency range. w Define the different modes of operation of an HF system.", "w Describe the HF system components. w Describe a block diagram of an HF system. w Understand HF Radio system circuit functions. w Understand basic Fault Isolation of an HF system."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["This lesson will help you understand basic high frequency (HF) systems."], "jumps": []}, {"id": "P410", "text": ["High frequency (HF) systems, like any other radio system, transmit and receive voice and data using the earth's atmosphere as the transmission medium."], "jumps": []}, {"id": "P420", "text": ["Due to the HF system's ability to communicate over long distances and over the horizon, day or night, it is used by, but not limited to, the military, mariners, and air traffic control centers."], "jumps": []}, {"id": "P430", "text": ["Let's begin the lesson on HF FUNDAMENTALS................................."], "jumps": []}, {"id": "P900", "text": [], "jumps": ["P430"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The HF in HF systems is the abbreviation for high frequency. The bandwidth for high frequency communications is from 3 MHz to 30 MHz.", "!!!! !!!", "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!! !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!", "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!! !!!!!!!!!!!!!!!!!!!!!!!!", "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!! !!!!!!!!!!!!!!!!!!!!!!!!!", "!!!! !! !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"], "jumps": []}, {"id": "P1030", "text": ["The large bandwidth allows the HF system to provide long range high frequency surface to surface, surface to air, air to air and air to surface, two-way voice and data communications at line of sight and over the horizon..."], "jumps": []}, {"id": "P1040", "text": ["Successful HF system communication depends on three principle factors:"], "jumps": []}, {"id": "P1050", "text": ["High power transmitters are used in HF systems to ensure that the transmission will be strong enough for the receiver to detect clearly."], "jumps": []}, {"id": "P1060", "text": ["HF system receivers have high sensitivity. The higher the receiver's sensitivity, the greater the ability to receive weak signals."], "jumps": []}, {"id": "P1070", "text": ["Conditions in the ionosphere have a great effect on HF transmissions. When transmitted frequencies enter the ionosphere, they are refracted back to the earth's surface, creating an area of radio silence called a skip zone. amount of refraction depends on; the density of the ionosphere, the frequency, and the angle that the radio wave enters the ionosphere. $Back: P10011111"], "jumps": ["P1080"]}, {"id": "P1072", "text": ["The amount of refraction depends on the density of the ionosphere, the frequency, and the angle at which the radio wave enters the ionosphere."], "jumps": []}, {"id": "P1075", "text": ["Ionosphere - is part of the earth's atmosphere. It extends approximately between 50 and 250 miles above the earth's surface. The ionosphere is broken into layers (D, E and F). The layers contain negative ions, positive ions and free electrons."], "jumps": []}, {"id": "P1080", "text": ["The density of the ionosphere is changed by the sun's radiation. During daylight hours the sun's radiation strikes the ionosphere and it becomes denser and closer to the earth's surface. This increases refraction and reduces the size of the skip zone..."], "jumps": ["P1070"]}, {"id": "P1090", "text": ["In the evening, less of the sun's radiation strikes the ionosphere and it becomes less dense and farther from the earth's surface. This decreases refraction and increases the size of the skip zone."], "jumps": []}, {"id": "P1100", "text": ["The skip zone either lengthens or shortens the HF system's communication distance. To compensate for the skip zone, the radio operator can adjust the HF system frequency. This adjustment can lengthen or shorten the communication distance, maintaining 24-hour connectivity between transmitter and receiver....."], "jumps": []}, {"id": "P1110", "text": ["Higher frequencies are required during the daylight hours when the density of the ionosphere is increased by the sun's radiation. Refraction increases and the skip zone decreases.."], "jumps": []}, {"id": "P1120", "text": ["Lower frequencies are used during the evening and at night when the density of the ionosphere decreases. Refraction decreases and the skip zone increases. Lower frequencies will hop and propagate at longer distances because less power is absorbed by the ionosphere...."], "jumps": []}, {"id": "P1130", "text": ["HF system operators remember this rule of thumb to determine which way to adjust the frequency for optimum communications: The higher the sun, the higher the frequency. The maximum frequency that each ionosphere layer will refract is known as the Critical frequency..."], "jumps": []}, {"id": "P1140", "text": ["Some frequencies will pass through the ionosphere into space, while others are refracted back towards earth. The highest angle that allows radio waves to refract is called the Critical angle."], "jumps": []}, {"id": "P1150", "text": ["The Critical angle is determined by the height of the ionosphere and the frequency of the transmitted signal. Again, a frequency adjustment is made to achieve successful communication."], "jumps": []}, {"id": "P1160", "text": ["Let's look at an example of how the ionosphere affects HF system transmission and reception.", "717 G11111111111111111111111111111111111111111V"], "jumps": []}, {"id": "P1170", "text": ["During night communications, Stations (A and C) are communicating on 5 MHz. Note that Station (B) cannot talk to Station (A) because of the resulting Skip Zone.", "W %", "%W % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % % dW", "% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %% %%"], "jumps": []}, {"id": "P1180", "text": ["As night transitions to day, all three stations (A , B and C) can now communicate on 5 MHz because the Skip Zone has decreased.", "77777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777777n&~ NN NN NN NN NNN"], "jumps": []}, {"id": "P1190", "text": ["The ground wave component of the transmitted signal is line of sight and will hug the earth. Increasing the antenna height increases ground wave coverage."], "jumps": []}, {"id": "P1200", "text": ["The height of the ionosphere _______ during the day and _______ at night...."], "jumps": ["P1190"]}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1202", "text": ["During the day, the ionosphere is denser..................."], "jumps": []}, {"id": "P1210", "text": ["This is where the question is typed..........................", "The Skip Zone is known as the area of _______ between the end of the Ground Wave Coverage and the beginning of the Sky Wave Coverage."], "jumps": ["P1200"]}, {"id": "P1211", "text": [], "jumps": []}, {"id": "P1212", "text": ["Refraction is the bending or change of direction of electromagnetic waves passing from one medium to another medium that has a different density.."], "jumps": []}, {"id": "P1213", "text": ["Reflection waves are neither transmitted nor absorbed, but are reflected from the surface of the medium they encounter.nter.."], "jumps": []}, {"id": "P1214", "text": ["Density is the degree of ionization that occurs in a medium.."], "jumps": []}, {"id": "P1220", "text": ["Each layer of the ionosphere has a maximum frequency that it will refract, known as the _______."], "jumps": ["P1210"]}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1222", "text": ["Skip zone is the area of silence..........................."], "jumps": []}, {"id": "P1223", "text": ["Each layer has a band of frequencies that will allow wave propagation.ave propagation."], "jumps": []}, {"id": "P1224", "text": ["Critical angle determines whether a wave passes through or is refracted back to the earth's surface.."], "jumps": []}, {"id": "P1230", "text": ["The HF system produces high amounts of output power and poses a hazard to personnel. Do not perform operational checks within 50' of personnel or within 300' of refueling operations..."], "jumps": ["P1220"]}, {"id": "P1240", "text": ["HF systems have four basic modes of operation.n............"], "jumps": []}, {"id": "P1250", "text": ["Amplitude Modulation (AM) mode transmits the carrier and both sidebands (USB and LSB). Large amounts of transmitting power are consumed in transmitting both sidebands. This causes a large bandwidth and decreases the peak transmitted talk power..."], "jumps": []}, {"id": "P1260", "text": ["Amplitude Modulation Equivalent (AME) is a process that HF receiver transmitters use. The carrier is re-inserted with the sideband prior to transmission creating an AME signal."], "jumps": []}, {"id": "P1270", "text": ["Upper Side Band (USB) is the most common mode of operation. This is a Single Side Band (SSB) transmission that removes both the carrier and LSB prior to transmission."], "jumps": []}, {"id": "P1280", "text": ["USB signals are more efficient than AM because all transmit power is concentrated into talk power. USB creates a smaller bandwidth and output power only occurs when the microphone is keyed and the user talks..."], "jumps": []}, {"id": "P1290", "text": ["Lower Side Band (LSB) is similar to USB but uses the sideband below the carrier frequency. This example signal has been modulated by a 1 kHz tone. Note the transmit frequency is 1 kHz lower than the carrier frequency.."], "jumps": []}, {"id": "P1300", "text": ["USB and LSB are two different frequencies. Long haul naval communications uses a variation of SSB called Independent sideband (ISB) transmission. ISB uses outputs from two sideband generators; filtering and combining the USB and LSB into one envelope containing different intelligence on each sideband...."], "jumps": []}, {"id": "P1310", "text": ["What mode of operation transmits the carrier frequency and both sidebands?"], "jumps": ["P1300"]}, {"id": "P1311", "text": [], "jumps": []}, {"id": "P1312", "text": ["During AME mode, the carrier is re-inserted with the sideband prior to transmission."], "jumps": []}, {"id": "P1313", "text": ["During USB mode, only the upper sideband is transmitted...."], "jumps": []}, {"id": "P1314", "text": ["During LSB mode, only the lower sideband is transmitted...."], "jumps": []}, {"id": "P1320", "text": ["What modes have output power only when the microphone is keyed and the user talks?"], "jumps": ["P1310"]}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1322", "text": ["AM and AME modes transmit carrier and sidebands when keyed."], "jumps": []}, {"id": "P1323", "text": ["Partially correct, however the AM mode only transmits when the radio is keyed.."], "jumps": []}, {"id": "P1324", "text": ["Partially correct, however the AME mode only transmits when the radio is keyed."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on HF RADIO CHARACTERISTICS."], "jumps": ["P1320"]}, {"id": "P1920", "text": ["1. The HF system provides long range high frequency surface to surface, surface to air, air to air and air to surface, two-way voice and data communications."], "jumps": []}, {"id": "P1930", "text": ["2. HF systems provide long-range communications well over the horizon. However, sustained connectivity depends on the three factors listed below.."], "jumps": []}, {"id": "P1940", "text": ["3. Conditions in the ionosphere have a great effect on HF transmissions. When transmitted frequencies enter the ionosphere, they are refracted back to the earth's surface, creating an area of radio silence called a skip zone. phere, the frequency, and the angle that the radio wave enters the ionosphere....."], "jumps": []}, {"id": "P1950", "text": ["4. Higher frequencies are required during the daylight hours when the density of the ionosphere is increased by the sun's radiation. Refraction increases and the skip zone decreases. The maximum frequency that each ionospheric layer will refract is known as the Critical frequency."], "jumps": []}, {"id": "P1960", "text": ["5. The ground wave component of the transmitted signal is line of sight and will hug the earth. Increasing the antenna height increases ground wave coverage.."], "jumps": []}, {"id": "P1970", "text": ["6. HF system operators remember this rule of thumb to determine which way to adjust the frequency for optimum communications: The higher the sun, the higher the frequency..."], "jumps": []}, {"id": "P1980", "text": ["7. Amplitude Modulation (AM) mode transmits the carrier and both sidebands (USB and LSB). Large amounts of transmitting power are consumed in transmitting both sidebands. This causes a large bandwidth and decreases the peak transmitted talk power."], "jumps": []}, {"id": "P1990", "text": ["8. The HF system produces high amounts of output power and poses a hazard to personnel. Do not perform operational checks within 50' of personnel or within 300' of refueling operations..."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1990"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["The HF system's components are the: Receiver Transmitter, Antenna, Antenna Coupler, Control Head and Audio System."], "jumps": []}, {"id": "P2030", "text": ["The Receiver Transmitter generates RF transmissions and processes received RF signals into audio signals, known as headset audio. As the microphone is initially keyed, the receiver creates and routes a sidetone to the audio system..."], "jumps": ["P2040", "P2020"]}, {"id": "P2032", "text": ["The Receiver Transmitter generates RF transmissions and processes received RF signals into audio signals, known as headset audio. As the microphone is initially keyed, the receiver creates and routes a sidetone to the audio system..."], "jumps": ["P2040", "P2020"]}, {"id": "P2035", "text": ["SIDETONE- Hearing of one's own voice in the receiver of a headset when speaking into the microphone.", "jaHHEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEHHaj8 JV"], "jumps": ["P2032"]}, {"id": "P2040", "text": ["The antenna is a conductor or group of conductors used either for radiating electromagnetic energy into space or for collecting it from space."], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["An efficient transmitting antenna must have exact dimensions to prevent standing waves. The antenna dimensions are determined by the frequency being transmitted."], "jumps": ["P2060", "P2040"]}, {"id": "P2055", "text": ["Standing waves- damaging electromagnetic waves reflected back toward the transmitter caused by an impedance mismatch at the antenna."], "jumps": []}, {"id": "P2060", "text": ["Antennas are most efficient when they match the wavelength of the transmitted signal. Below is the formula used to calculate the wavelength of any frequency. consider the wavelength for a frequency of 15 MHz..."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["Antenna lengths can be reduced by quarter wavelengths and still maintain impedance matching for a given frequency. However, an antenna coupler can be used to electrically change the length of the antenna to allow a large bandwidth of frequencies to use the same antenna..."], "jumps": []}, {"id": "P2080", "text": ["The antenna coupler connects the receiver transmitter to the HF antenna. It matches the appropriate electrical antenna length to the selected frequency."], "jumps": []}, {"id": "P2090", "text": ["Common HF antenna couplers accomplish the following tasks: lers electrically lengthen or shorten an antenna by adding inductors or capacitors in series. Couplers match the antenna impedance. Couplers monitor the Standing Wave Ratio (SWR)))"], "jumps": []}, {"id": "P2100", "text": ["When a new HF frequency is selected and the transmitter is keyed for the first time, the coupler channelizes and couples the antenna to the transmitter."], "jumps": []}, {"id": "P2110", "text": ["Preventing standing waves is important because they will reflect the transmit power back to the transmitter at a magnitude two times the output power. This could burn up the transmitter. -"], "jumps": []}, {"id": "P2120", "text": ["The HF system Control Head provides the operator with a means to select the Operating Frequency, Mode and Squelch.."], "jumps": []}, {"id": "P2130", "text": ["All audio between the HF system and the operator is routed through the audio system. The routed signals are Microphone (transmit audio), Sidetone, and Headset Audio."], "jumps": []}, {"id": "P2140", "text": ["To couple the antenna to the Transmitter during transmit and the receiver during receive.", "What is the purpose of the Antenna Coupler?................", "To electrically couple the antenna to the Receiver Transmitter", "To electrically couple the antenna to the Transmitter during transmit only", "To electrically couple the antenna to the Receiver during receive only"], "jumps": ["P2130"]}, {"id": "P2141", "text": [], "jumps": []}, {"id": "P2142", "text": ["The Antenna Coupler electrically changes the length of the antenna to match the impedance of the Receiver Transmitter."], "jumps": []}, {"id": "P2143", "text": ["Partially correct, the Antenna Coupler electrically changes the length of the antenna to match the Receiver Transmitter selected frequency."], "jumps": []}, {"id": "P2144", "text": ["Partially correct, the Antenna Coupler electrically changes the length of the antenna to match the Receiver Transmitter selected frequency."], "jumps": []}, {"id": "P2150", "text": ["The following basic block diagram shows the main inputs, outputs and related HF system components."], "jumps": ["P2140"]}, {"id": "P2160", "text": ["The Control Head routes the selected frequency and mode information to the receiver transmitter.."], "jumps": []}, {"id": "P2170", "text": ["The Receiver Transmitter sends band information to the coupler and channelizes, rough tuning the coupler."], "jumps": []}, {"id": "P2180", "text": ["As the operator depresses the Push-to-Talk (PTT) button, the microphone keyline is sent to the receiver transmitter from the Audio system. A tone is present in the headset as the coupler tunes by adjusting the electrical length of the antenna to match the output impedance.."], "jumps": ["PTT"]}, {"id": "P2190", "text": ["The tone goes away within eight seconds and the operator is able to talk into the microphone."], "jumps": []}, {"id": "P2200", "text": ["Audio to be transmitted (microphone audio) is received via the audio system and sent to the receiver transmitter. ."], "jumps": []}, {"id": "P2210", "text": ["The modulated RF is routed from the receiver transmitter to the coupler and Sidetone audio is heard by the operator. The coupler routes the modulated signal to the antenna for transmission. imate and Highlight a modulated pulse from the RX/TX to the coupler to the antenna..."], "jumps": []}, {"id": "P2220", "text": ["The following basic block diagram shows the main inputs and outputs of a received HF signal."], "jumps": ["P"]}, {"id": "P2230", "text": ["The Control Head routes frequency and mode information to the receiver transmitter. The receiver transmitter sends band information to the coupler and channelizes, rough tuning the coupler..."], "jumps": []}, {"id": "P2240", "text": ["Incoming RF is received and routed through the coupler and sent to the receiver transmitter. The receiver transmitter demodulates the signal and sends the detected audio to the audio system...", "1 11111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111", "K !***KKK", "L ))111LL", "L1)' !!!!!!!!!D!D!DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD!D!D!!!!!!!!!!!!!"], "jumps": ["P2230"]}, {"id": "P2250", "text": ["The audio system processes the audio signal and routes headset audio to the operator."], "jumps": []}, {"id": "P2260", "text": ["As a technician, you are responsible for understanding HF system operation and fault isolation. The tools needed in HF fault isolation are listed below:"], "jumps": []}, {"id": "P2270", "text": ["Changing frequencies as the ionospheric layers change can help counter the loss of connectivity created by Skip Zones. The higher the sun, the higher the frequency.frequency"], "jumps": []}, {"id": "P2280", "text": ["The Antenna coupler tone is present when the microphone is initially keyed on a new frequency for about eight seconds. Coupler tones longer than 8 seconds normally indicate a problem. Try re-channelizing on a new frequency and re-couple.re-couple..."], "jumps": []}, {"id": "P2290", "text": ["Selecting the correct mode of operation will correct many problems. If LSB is selected and a USB signal is received, the audio should not be heard because they are really two different frequencies..cies..."], "jumps": []}, {"id": "P2300", "text": ["The following table is a guide to assist in fault isolating most HF system problems. Knowing basic HF principles prevents unnecessary component changes, saves time, and saves resources..."], "jumps": []}, {"id": "P2310", "text": ["You should fully understand the discrepancy before attempting to fault analyze the problem. Knowing the basic block diagram of an HF system will allow you to isolate the problem to the defective component..."], "jumps": []}, {"id": "P2320", "text": ["There are several common faults associated with HF systems. The following table is a list of faults with possible fixes."], "jumps": ["P2910", "P2310"]}, {"id": "P2910", "text": ["This completes the information on HF RADIO THEORY OF OPERATION.Radio Theory of Operation"], "jumps": ["P2001", "P2320"]}, {"id": "P2920", "text": ["1. The HF system's components are the: Receiver Transmitter, Antenna, Antenna Coupler, Control Head and Audio System."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2. The Receiver Transmitter generates RF transmissions and processes received RF signals into audio signals, known as headset audio. As the microphone is keyed, the receiver creates and routes a sidetone to the audio system...."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3. An efficient transmitting antenna must have exact dimensions to prevent standing waves. The antenna dimensions are determined by the frequency being transmitted."], "jumps": ["P2950", "P2930"]}, {"id": "P2950", "text": ["4. All audio between the HF system and the operator is routed through the audio system. The routed signals are Microphone (transmit audio), Sidetone, and Headset Audio.."], "jumps": ["P2960", "P2940"]}, {"id": "P2960", "text": ["5. The following basic block diagram shows the main inputs, outputs and related HF system components."], "jumps": ["P2970", "P2950"]}, {"id": "P2970", "text": ["6. As a technician you are responsible for understanding HF system operation and fault isolation. The tools needed in HF fault isolation are listed below:"], "jumps": ["P2980", "P2960"]}, {"id": "P2980", "text": ["7. There are several common faults associated with HF systems. The following table is a list of faults with possible fixes."], "jumps": ["P2999", "P2970"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2980"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the qu let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
