count. Instead of it taking days, it could take as little as a few seconds.", "In: JohnDoe@Nida.com.jap PattySmith@usbid.usa Alexis894559@house.hk Out: JohnDoe@Nida.com 12:30pm 9-01 No I will not PattySmith@usbid.com 11:40pm 9-02 FW:Read This"], "jumps": ["P2059", "P2040"]}, {"id": "P2061", "text": ["The Internet is currently in a never ending state of change. Some of the earlier commercial providers and Internet providers are declining in popularity, while new providers are cropping up.", "Phone, cable, satellite, cellular phone, and computer companies to name a few, are all looking to provide Internet access and services."], "jumps": ["P1360", "P1340", "P1370", "P1350"]}, {"id": "P1950", "text": ["4. When ARPANET could not handle the increased amount of traffic, the National Science Foundation-funded research for supercomputers. When this did not work out, they began another network named NSFNET."], "jumps": ["P1960", "P1940"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2059", "text": ["Usually your mail stays at an electronic post office, and you have to retrieve it, much like a phone service or answering machine.", "Since the NSFNET was used for research and education only, many businesses like IBM, SPRINT, and Alternet started independent IP (Internet Protocol) networks. They also began providing Internet access through their networks..."], "jumps": ["P2060", "P2050", "P1300", "P1280"]}, {"id": "P1330", "text": ["Bulletin-board services (BBS) are another way to reach the Internet. Dial their number and connect your computer to the Internet.", "Welcome to Super BBS Premier BBS & Internet"], "jumps": ["P1340", "P1320"]}, {"id": "P1270", "text": ["Unfortunately, supercomputer centers that the NSF built to be supported by NSFNET, had serious problems.", "The NSF provided funding for supercomputers................"], "jumps": ["P1280", "P1260"]}, {"id": "P1261", "text": [], "jumps": []}, {"id": "P1262", "text": ["The NSF provided funding for supercomputers................", "E-mail services provide you with an e-mail account. This allows you to send and receive mail messages on the Internet. The provider is like a postal carrier delivering messages between e-mail account holders.", "2. DOD wanted a network that could withstand an enemy attack. If one link in the network was damaged, information could be automatically rerouted through another link.", "The National Science Foundation (NSF) set up five supercomputer centers to be used for research and education only. NSF provided the funding for these supercomputers.", "Researchers throughout the country would send their programs through the ARPANET to NSF. NSF would run the programs and then send the results back to them."], "jumps": ["P1350", "P1330", "P1940", "P1920", "P1230", "P1210", "P1240", "P1220"]}, {"id": "P1250", "text": ["The NSF decided to build a much faster network. It set up many regional networks to connect to the supercomputer centers. This began a new network called the NSFNET."], "jumps": ["P1259", "P1220"]}, {"id": "P1260", "text": ["The National Science Foundation provided the funding for _______"], "jumps": ["P1250"]}, {"id": "P1910", "text": ["This completes the information on INTRODUCTION TO THE INTERNET."], "jumps": ["P1001", "P1360"]}, {"id": "P1980", "text": ["6. By the year 1994, commercial providers began taking over much of the traffic on the Internet. You can also access the Internet using BBS, e-mail providers and Internet providers..", "Workstation manufacturers also began making the hardware available for network connections.", "With the appropriate cards and connectors, to get a network operating you just needed to run cables from workstation to workstation."], "jumps": ["P1990", "P1960", "P1190", "P1170", "P1200", "P1180"]}, {"id": "P1200", "text": ["An individual workstation was much faster than one of the 1970's multi-user system. One workstation could generate enough network traffic to clog the ARPANET."], "jumps": ["P1209", "P1190"]}, {"id": "P1213", "text": ["Remote terminals consisted of a keyboard and monitor and were controlled by a central computer."], "jumps": []}, {"id": "P1140", "text": ["Since many remote terminals could access the central computer simultaneously, it would slow the performance of all the remote terminals."], "jumps": ["P1150", "P1130"]}, {"id": "P1209", "text": ["With more workstations being used, a way to handle the network traffic was needed."], "jumps": ["P1210", "P1190"]}, {"id": "P1212", "text": ["Central computers ran a large network of many computers....", "A type of network, that only transmits information.", "A scheme that computers use to communicate."], "jumps": []}, {"id": "P1123", "text": ["These types of networks were known as time-sharing machines or multi-user systems."], "jumps": ["P1130", "P1122"]}, {"id": "P1150", "text": ["The system faced another big disadvantage: if the central computer quit working, everyone connected would be at a stand still until it was repaired.", "AT&T and the University of California at Berkeley, developed operating software called UNIX. Berkeley's UNIX version included the ability to connect to a network."], "jumps": ["P1160", "P1140", "P1180"]}, {"id": "P1300", "text": ["With the speed, power, and affordability of computers and the expanding home market, the demand for supercomputers decreased. By 1994 commercial providers began taking over much of the traffic on the Internet..."], "jumps": ["P1305", "P1290"]}, {"id": "P1305", "text": ["Let us look at the most likely ways that you would access the Internet today."], "jumps": ["P1310", "P1300"]}, {"id": "P1370", "text": ["No one person knows which type or combination of companies will dominate in the future. How YOU use the Internet will determine its future.", "Protocol is an agreed upon set of rules that computers use to communicate; deciding when to send, receive, stop, and complete communications."], "jumps": ["P1910", "P1360", "P1110", "P1090"]}, {"id": "P1211", "t let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
