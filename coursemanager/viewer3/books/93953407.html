t the Test Console Power to OFF.", "1. Set the Test Console Power to OFF.F.FF................................."], "jumps": []}, {"id": "P13430", "text": ["The FET amplifier is operating correctly. The fault has been repaired.", "The FET amplifier is operating correctly. The fault has been repaired........"], "jumps": ["P13410"]}, {"id": "P13420", "text": ["Notice that the input signal is .4 Vpp and the output signal is inverted at about 3 Vpp. The measured Av is 7.5, close to the calculated Av of 7.8."], "jumps": ["P13430", "P13410"]}, {"id": "P13410", "text": ["12.  Check for normal operation of the amplifier by measuring the         input and output signals with the oscilloscope.", "12. Check for normal operation of the amplifier by measuring the input and output signals with the oscilloscope."], "jumps": ["P13420"]}, {"id": "P13400", "text": ["10.   Remove the multimeter from the circuit. \n11.   Press Enter to Set: PC2 DC Power Switch - ON", "10. Remove the multimeter from the circuit. 11. Press Enter to Set: PC2 DC Power Switch - ON"], "jumps": []}, {"id": "P13390", "text": ["The resistance check indicates that the gate to drain is open, the FET is bad. The computer will now replace the FET.", "The resistance check indicates that the gate to drain is open, the FET is bad. The computer will now replace the FET.he PC3 Speaker switch to ON........................................."], "jumps": ["P13380"]}, {"id": "P13382", "text": ["You should have measured a high resistance to current flow when the gate to drain was forward biased and also a high resistance to the flow when reverse biased. Check the way you connected the test leads. Remember, to forward bias, the + potential lead must be placed on the gate.", "You should have measured a high resistance to current flow when the gate to drain was forward biased and also a high resistance to the flow when reverse biased. Check the way you connected the test leads. Remember, to forward bias, the + potential lead must be placed on the gate........................................................................................................................................................................................................................................"], "jumps": []}, {"id": "P13381", "text": [], "jumps": []}, {"id": "P13380", "text": ["Is the gate to drain junction testing OK?  \n\nForward biased: low resistance or current flows\nReverse biased: high resistanc", "Is the gate to drain junction testing OK? Forward biased: low resistance or current flows Reverse biased: high resistancK", "Is the gate to drain junction testing OK? Forward biased: low resistance or current flows Reverse biased: high resistance or no current flow"], "jumps": ["P13370"]}, {"id": "P13375", "text": ["FETs gate to source. Forward biased: + TP3, - TP5 Reverse biased: + TP5, - TP3", "MEASUREMENT SETUP - Use an ohmeter to measure the resistance of the FETs gate to drain or a diode test to check the junction. Forward biased: + TP3, - TP5 Reverse biased: + TP5, - TP3333333333333333333333333333333333333333333333333333333333333333333333333"], "jumps": []}, {"id": "P13370", "text": ["resistance of the FET's gate to drain. Forward biased: + TP3, - TP5 Reverse biased: + TP5, - TP3", "9. Using a multimeter, check the FET's gate to drain junction. Forward biased: + TP3, - TP5 Reverse biased: + TP5, - TP3 to drain. Forward biased: + TP3, - TP5 Reverse biased: + TP5, - TP3333333rd biased: + TP3, - TP5 Reverse biased: + TP5, - TP333"], "jumps": ["P13380", "P13360", "P13375"]}, {"id": "P13362", "text": ["You should have measured a low resistance to current flow when the gate to source was forward biased and a high resistance to the flow when reverse biased. Check the way you connected the test leads. Remember, to forward bias, the + potential lead must be placed on the gate."], "jumps": []}, {"id": "P13361", "text": [], "jumps": []}, {"id": "P13360", "text": ["Is the gate to source junction testing OK?  \n\nForward biased: low or has current flow \nReverse biased: high or has no cur", "Is the gate to source junction testing OK? Forward biased: low or has current flow Reverse biased: high or has no cur", "Is the gate to source junction testing OK? Forward biased: low or has current flow Reverse biased: high or has no current flowww"], "jumps": ["P13350"]}, {"id": "P13355", "text": ["MEASUREMENT SETUP - Use a multimeter to measure the resistance of the FETs gate to source . Forward biased: + TP3, - TP4 Reverse biased: + TP4, - TP3", "MEASUREMENT SETUP - Use an ohmeter to measure the resistance of the FETs gate to source or a diode test to check the junction. Forward biased: + TP3, - TP4 Reverse biased: + TP4, - TP3"], "jumps": []}, {"id": "P13350", "text": ["8.  Using a multimeter, measure the resistance or cof the FET's gate          to source. \n      Forward biased: + TP3, - TP4     Reverse biased: + TP4, - TP3", "8. Using a multimeter, measure the resistance or cof the FET's gate to source. Forward biased: + TP3, - TP4 Reverse biased: + TP4, - TP3", "8. Using a multimeter, check the FET's gate to source junction. Forward biased: + TP3, - TP4 Reverse biased: + TP4, - TP33333333333333333333333333333333"], "jumps": ["P13360", "P13355"]}, {"id": "P13340", "text": ["7.  Press Enter to Set: PC2 DC Power Switch - OFF   \n     The FET has an input but no output signal. Both coupling               capacitors appear to be OK. Now, let's check the operation of        the FET.", "7. Press Enter to Set: PC2 DC Power Switch - OFF The FET has an input but no output signal. Both coupling capacitors appear to be OK. Now, let's check the operation of the FET..."], "jumps": ["P13330"]}, {"id": "P13332", "text": ["You should have measured +12 VDC. Check that you are measuring PIN O and that you have the meter set for +DC voltage measurements."], "jumps": []}, {"id": "P13331", "text": [], "jumps": []}, {"id": "P13330", "text": ["6.  Measure the voltage at PC130-49 PIN O with a multimeter. \n     This will check for +Vcc. Is there +12 VDC on PIN O?", "6. Measure the voltage at PC130-49 PIN O with a multimeter. This will check for +Vcc. Is there +12 VDC on PIN O?"], "jumps": ["P13320"]}, {"id": "P13322", "text": ["You should have measured the .4 Vpp signal at TP2 and TP3. This indicates that C1 is good."], "jumps": []}, {"id": "P13321", "text": [], "jumps": []}, {"id": "P13320", "text": ["5.  Measure the signal at TP3 on PC130-49 with the oscilloscope.       This will check the input coupling capacitor.  Is C1 faulty?", "5. Measure the signal at TP3 on PC130-49 with the oscilloscope. This will check the input coupling capacitor. Is C1 faulty?"], "jumps": ["P13310"]}, {"id": "P13312", "text": ["You should have measured NO signal at TP5. If there was a signal at TP5 and no signal at TP6, that would indicate that C2 was open. But, this is not the case."], "jumps": []}, {"id": "P13311", "text": [], "jumps": []}, {"id": "P13310", "text": ["4.  Measure the signal at TP5 on PC130-49 with the oscilloscope.       This  will check the output coupling capacitor.  Is C2 faulty?", "4. Measure the signal at TP5 on PC130-49 with the oscilloscope. This will check the output coupling capacitor. Is C2 faulty?"], "jumps": ["P13300"]}, {"id": "P13302", "text": ["The FET amplifier is not operating correctly. There is no output at TP6."], "jumps": []}, {"id": "P13301", "text": [], "jumps": []}, {"id": "P13300", "text": ["Is the FET amplifier circuit operating correctly?", "Is the FET amplifier circuit operating correctly?.........."], "jumps": ["P13290"]}, {"id": "P13295", "text": ["MEASUREMENT SETUP - Input voltage (TP2, 0.4 Vpp) Output voltage (TP6, 3 Vpp)"], "jumps": []}, {"id": "P13290", "text": ["3.  Determine if the FET amplifier is operating correctly. Using the      oscilloscope, measure the input voltage (TP2, 0.4 Vpp) and             output voltage (TP6, 3 Vpp). Check phase and gain.", "3. Determine if the FET amplifier is operating correctly. Using the oscilloscope, measure the input voltage (TP2, 0.4 Vpp) and output voltage (TP6, 3 Vpp). Check phase and gain...."], "jumps": ["P13300", "P13295"]}, {"id": "P13280", "text": ["1.  Remove the multimeter from the circuit.  \n2.  Press Enter to Set: PC2 DC Power Switch - ON", "1. Remove the multimeter from the circuit. 2. Press Enter to Set: PC2 DC Power Switch - ON"], "jumps": []}, {"id": "P13270", "text": ["The FET is operating correctly. Now, the computer will insert a fault. Use the FET amplifier troubleshooting procedures to determine the faulty component.", "The FET is operating correctly. Now, the computer will insert a fault. Use the FET amplifier troubleshooting procedures to determine the faulty component................................"], "jumps": ["P13260"]}, {"id": "P13262", "text": ["You should have measured about infinity using an ohmeter and had a \"no current flow\" indication if using a digital meter as the gate to drain PN junction is reverse biased. Check your multimeter test lead connections.", "You should have measured about infinity using an ohmeter and had a \"no current flow\" indication if using a digital meter as the gate to drain PN junction is reverse biased. Check your multimeter test lead connections......."], "jumps": []}, {"id": "P13261", "text": [], "jumps": []}, {"id": "P13260", "text": ["7. Reverse the test leads that are on TP3 and TP5. This reverse biases the FET gate to drain. An ohmeter should show very high resistance and a diode tester should show no current flow. Are you getting a forward biased indication on your multimeter?????????????????????????"], "jumps": ["P13250"]}, {"id": "P13252", "text": ["The FET gate to source is forward biased, the ohmeter should have measured about 125 ohms. A diode test should indicate current flow.  Check your meter test lead connections.", "The FET gate to source is forward biased, the ohmeter should have measured about 125 ohms. A diode test should indicate current flow. Check your meter test lead connections..."], "jumps": []}, {"id": "P13251", "text": [], "jumps": []}, {"id": "P13250", "text": ["The FET is forward biased between the gate and drain.  \nIs the multimeter reading high or low ohms?", "The FET is forward biased between the gate and drain. Is the multimeter reading high or low ohms?", "The FET is forward biased between the gate and drain. An ohmmeter should show low resistance while a diode tester should indicate current flow. Does the multimeter indicate a forward biased condition???????????????????????????????????????????????????????????????????????????????????????????????????????????????"], "jumps": ["P13240"]}, {"id": "P13245", "text": ["MEASUREMENT SETUP - Connect the black test lead of the multimeter to TP3 and the red lead to TP5."], "jumps": []}, {"id": "P13240", "text": ["5.  Place the test lead connected to the positive potential of the           meter (black lead on Nida 480) to TP3 on PC130-49, gate of Q1. 6.  Place the test lead connected to the negative potential of the         meter (red lead on Nida 480) to TP5 on PC130-49, drain of Q1.", "5. Place the test lead connected to the positive potential of the meter (black lead on Nida 480) to TP3 on PC130-49, gate of Q1. 6. Place the test lead connected to the negative potential of the meter (red lead on Nida 480) to TP5 on PC130-49, drain of Q1."], "jumps": ["P13250", "P13230", "P13245"]}, {"id": "P13232", "text": ["You should have measured about infinity using an ohmeter and had a \"no current flow\" indication if using a digital meter as the gate to source PN junction is reverse biased. Check your multimeter test lead connections.", "You should have measured about infinity using an ohmeter and had a \"no current flow\" indication if using a digital meter as the gate to source PN junction is reverse biased. Check your multimeter test lead connections..."], "jumps": []}, {"id": "P13231", "text": [], "jumps": []}, {"id": "P13230", "text": ["4.  Reverse the test leads that are on TP3 and TP4. This reverse         biases the FET gate to source.\n     Does the meter indicate a forward biased condition?", "4. Reverse the test leads that are on TP3 and TP4. This reverse biases the FET gate to source. Does the meter indicate a forward biased condition????????????????????????????????????????????????????????????"], "jumps": ["P13220"]}, {"id": "P13222", "text": ["The FET gate to source is forward biased, the ohmeter should have measured about 125 ohms. A diode test should indicate current flow.  Check your meter test lead connections.", "The FET gate to source is forward biased, the ohmeter should have measured about 125 ohms. A diode test should indicate current flow. Check your meter test lead connections."], "jumps": []}, {"id": "P13221", "text": [], "jumps": []}, {"id": "P13220", "text": ["between the gate and source. Does the multimeter indicate a forward biasereading high or low ohms?", "The FET is forward biased between the gate and source. An ohmmeter should show low resistance while a diode tester should indicate current flow. Does the multimeter indicate a forward biased condition???"], "jumps": ["P13210"]}, {"id": "P13215", "text": ["MEASUREMENT SETUP - Connect the black test lead of the multimeter to TP3 and the red lead to TP4."], "jumps": []}, {"id": "P13210", "text": ["2.  Place the test lead connected to the positive potential of the           meter (black lead on Nida 480) to TP3 on PC130-49, gate of Q1. 3.  Place the test lead connected to the negative potential of the         meter (red lead on Nida 480) to TP4 on PC130-49, source of Q1.", "2. Place the test lead connected to the positive potential of the meter (black lead on Nida 480) to TP3 on PC130-49, gate of Q1. 3. Place the test lead connected to the negative potential of the meter (red lead on Nida 480) to TP4 on PC130-49, source of Q1."], "jumps": ["P13220", "P13215"]}, {"id": "P13200", "text": ["Power Switch - OFF Remember, power must be OFF to the circuit when making resistance measurements or wh.)", "1. Press Enter to Set: PC2 DC Power Switch - OFF Remember, power must be OFF to the circuit when making resistance measurements or when testing semiconductor junctions."], "jumps": ["P13190"]}, {"id": "P13190", "text": ["Now, depending upon the type of multimeter used, let's test the FET. The computer will isolate the FET for you.  The demo uses an analog meter as the diode test function settings and display varies between digital multimeter brands and cannot be duplicated in a generic fashion.", "Now, depending upon the type of multimeter used, let's test the FET. The computer will isolate the FET for you. The demo uses an analog meter as the diode test function settings and display varies between digital multimeter brands and cannot be duplicated in a generic fashion.", "An analog multimeter set to the 100 ohm range is ideal. A digital multimeter's internal power source is too small to forward bias the PN junctions in the FET using any resistance range but the diode test function can be used.."], "jumps": ["P13200", "P13180"]}, {"id": "P13180", "text": ["Also, the output signal should be approximately 3 Vpp. Dividing the level of the output signal by the input signal produces a measured Av of about 7.5, close to the 7.8 calculated. The circuit is operating correctly.", "Also, the output signal should be approximately 3 Vpp. Dividing the level of the output signal by the input signal produces a measured Av of about 7.5, close to the 7.8 calculated. The circuit is operating correctly..."], "jumps": ["P13190", "P13170"]}, {"id": "P13175", "text": ["MEASUREMENT SETUP - Connect CH2 probe to TP6."], "jumps": []}, {"id": "P13170", "text": ["2.  Connect CH2 probe to the output signal at PC130-49 TP6.               Compare the two signals on the oscilloscope. The output               signal, CH2, should be inverted.", "2. Connect CH2 probe to the output signal at PC130-49 TP6. Compare the two signals on the oscilloscope. The output signal, CH2, should be inverted."], "jumps": ["P13180", "P13160", "P13175"]}, {"id": "P13165", "text": ["MEASUREMENT SETUP - Measure the voltage at TP2."], "jumps": []}, {"id": "P13160", "text": ["1.  Measure the input signal at TP2 on PC130-49 using the                    oscilloscope. Use dual trace, CH1 triggering, and connect the        CH1 probe to the input signal. You should measure                           approximately 0.4 Vpp.", "1. Measure the input signal at TP2 on PC130-49 using the oscilloscope. Use dual trace, CH1 triggering, and connect the CH1 probe to the input signal. You should measure approximately 0.4 Vpp."], "jumps": ["P13170", "P13165"]}, {"id": "P13150", "text": ["9.  Press Enter to Set: PC2 DC Power Switch - ON  \n     The experiment is now setup. Let's verify normal operation of        the FET amplifier before inserting a fault.", "9. Press Enter to Set: PC2 DC Power Switch - ON The experiment is now setup. Let's verify normal operation of the FET amplifier before inserting a fault."], "jumps": ["P13140"]}, {"id": "P13145", "text": ["MEASUREMENT SETUP - Measure the voltage at TP2."], "jumps": []}, {"id": "P13147", "text": ["Your answer is still incorrect. You should have measured approximately 0.40 V. Ensure your setup is correct, then check with your instructor."], "jumps": ["P13150", "P13140"]}, {"id": "P13142", "text": ["Your measurement is not acceptable. Check your setup:", "Your measurement is not acceptable. Check your setup: Function generator output voltage at PC130-49 pin E is a 6 Vpp 1 kHz. - Oscilloscope connected to PC130-49 TP2. - Answer in volts.", "- Function generator output voltage at PC130-49 pin E is a 6 Vpp 1 kHz. - Oscilloscope connected to PC130-49 TP2. - Answer in volts.. volts..."], "jumps": []}, {"id": "P13141", "text": [], "jumps": []}, {"id": "P13140", "text": ["8.  Measure the peak-to-peak input voltage at PC130-49 TP2.               What is the measured voltage?", "8. Measure the peak-to-peak input voltage at PC130-49 TP2. .........................."], "jumps": ["P2910", "P2450"]}, {"id": "P2450", "text": ["2.  Set the Test Console Power to OFF.", "2. Set the Test Console Power to OFF.F...................."], "jumps": ["P2440"]}, {"id": "P2440", "text": ["1.  Return the Test Console controls to the initial control settings.", "1. Return the Test Console controls to the initial control settings......."], "jumps": ["P2410"]}, {"id": "P2430", "text": ["The FET amplifier is operating correctly. The fault has been repaired."], "jumps": ["P2440", "P2410"]}, {"id": "P2420", "text": ["Notice that the input signal is .4 Vpp and the output signal is inverted at about 3 Vpp. The measured Av is 7.5, close to the calculated Av of 7.8."], "jumps": ["P2430", "P2410"]}, {"id": "P2410", "text": ["12.  Check for normal operation of the amplifier by measuring the         input and output signals with the oscilloscope.", "12. Check for normal operation of the amplifier by measuring the input and output signals with the oscilloscope."], "jumps": ["P2420", "P2400"]}, {"id": "P2400", "text": ["10.  Remove the multimeter from the circuit. \n11.  Place PC2 Power switch to ON.", "10. Remove the multimeter from the circuit. 11. Place PC2 Power switch to ON........."], "jumps": ["P2390"]}, {"id": "P2390", "text": ["The resistance check indicates that the gate to drain is open, the FET is bad. The computer will now replace the FET.", "The resistance check indicates that the gate to drain is open, the FET is bad. The computer will now replace the FET. External program = SCAN FTR 0 C2 00................................"], "jumps": ["P2380"]}, {"id": "P2382", "text": ["You should have measured a high resistance to current flow when the gate to drain was forward biased and also a high resistance to the flow when reverse biased. Check the way you connected the test leads. Remember, to forward bias, the + potential lead must be placed on the gate."], "jumps": []}, {"id": "P2381", "text": [], "jumps": []}, {"id": "P2380", "text": ["Is the gate to drain resistance measurements correct? Forward biased: low Reverse biased: highh", "Is the gate to drain junction testing OK? Forward biased: low resistance or current flows Reverse biased: high resistance or no current flow"], "jumps": ["P2370"]}, {"id": "P2375", "text": ["MEASUREMENT SETUP - Forward biased: + TP3, - TP5 Reverse biased: + TP5, - TP3urce. Forward biased: + TP3, - TP5 Reverse biased: + TP5, - TP333", "MEASUREMENT SETUP - Use an ohmeter to measure the resistance of the FETs gate to drain or a diode test to check the junction. Forward biased: + TP3, - TP5 Reverse biased: + TP5, - TP3"], "jumps": []}, {"id": "P2370", "text": ["9.  Using a multimeter checkmeasure the resistance of the FET's gate          to drain.\n      Forward biased: + TP3, - TP5     Reverse biased: + TP5, - TP3", "9. Using a multimeter checkmeasure the resistance of the FET's gate to drain. Forward biased: + TP3, - TP5 Reverse biased: + TP5, - TP3", "9. Using a multimeter check the FET's gate to drain junction. Forward biased: + TP3, - TP5 Reverse biased: + TP5, - TP3333333333333333333333333333"], "jumps": ["P2380", "P2360", "P2375"]}, {"id": "P2362", "text": ["You should have measured a low resistance to current flow when the gate to source was forward biased and a high resistance to the flow when reverse biased. Check the way you connected the test leads. Remember, to forward bias, the + potential lead must be placed on the gate."], "jumps": []}, {"id": "P2361", "text": [], "jumps": []}, {"id": "P2360", "text": ["Is the gate to source junction testing OK? Forward biased: low or has current flow Reverse biased: high or has no current flow"], "jumps": ["P2350"]}, {"id": "P2355", "text": [": + TP4, - TP333333333333333333333333333333333333333333333333333333333333333333333333", "MEASUREMENT SETUP - Use an ohmeter to measure the resistance of the FETs gate to source or a diode test to check the junction. Forward biased: + TP3, - TP4 Reverse biased: + TP4, - TP3"], "jumps": []}, {"id": "P2350", "text": ["8.    Using a multimeter, check the FET's gate to source junction.  \n\n      Forward biased: + TP3, - TP4     Reverse biased: + TP4, - TP3", "8. Using a multimeter, check the FET's gate to source junction. Forward biased: + TP3, - TP4 Reverse biased: + TP4, - TP333333333333333333"], "jumps": ["P2360", "P2340", "P2355"]}, {"id": "P2340", "text": ["7.  Turn PC2 Power switch to OFF. The FET has an input but no         output signal. Both coupling capacitors appear to be OK.                Now, let's check the operation of the FET.", "7. Turn PC2 Power switch to OFF. The FET has an input but no output signal. Both coupling capacitors appear to be OK. Now, let's check the operation of the FET. ternal program = SCAN FTR 0 F2 10"], "jumps": ["P2330"]}, {"id": "P2332", "text": ["You should have measured +12 VDC. Check that you are measuring PIN O and that you have the meter set for +DC voltage measurements."], "jumps": []}, {"id": "P2331", "text": [], "jumps": []}, {"id": "P2330", "text": ["6.  Measure the voltage at PC130-49 PIN O with a multimeter. \n     This will check for +Vcc. Is there +12 VDC on PIN O?", "6. Measure the voltage at PC130-49 PIN O with a multimeter. This will check for +Vcc. Is there +12 VDC on PIN O??????"], "jumps": ["P2320"]}, {"id": "P2322", "text": ["You should have measured the 0.4 Vpp signal at TP2 and TP3. This indicates that C1 is good."], "jumps": []}, {"id": "P2321", "text": [], "jumps": []}, {"id": "P2320", "text": ["5.  Measure the signal at TP3 on PC130-49 with the oscilloscope.       This will check the input coupling capacitor. Is C1 faulty?", "5. Measure the signal at TP3 on PC130-49 with the oscilloscope. This will check the input coupling capacitor. Is C1 faulty?"], "jumps": ["P2310"]}, {"id": "P2312", "text": ["You should have measured NO signal at TP5. If there was a signal at TP5 and no signal at TP6, that would indicate that C2 was open. But, this is not the case."], "jumps": []}, {"id": "P2311", "text": [], "jumps": []}, {"id": "P2310", "text": ["4.  Measure the signal at TP5 on PC130-49 with the oscilloscope.       This will check the output coupling capacitor. Is C2 faulty?", "4. Measure the signal at TP5 on PC130-49 with the oscilloscope. This will check the output coupling capacitor. Is C2 faulty?"], "jumps": ["P2300"]}, {"id": "P2302", "text": ["The FET amplifier is not operating correctly. There is no output at TP6."], "jumps": []}, {"id": "P2301", "text": [], "jumps": []}, {"id": "P2300", "text": ["Is the FET amplifier circuit operating correctly?", "Is the FET amplifier circuit operating correctly?.........."], "jumps": ["P2290"]}, {"id": "P2295", "text": ["MEASUREMENT SETUP - Input voltage (TP2, 0.4 Vpp) Output voltage (TP6, 3 Vpp)"], "jumps": []}, {"id": "P2290", "text": ["3.  Determine if the FET amplifier is operating correctly. Using the      oscilloscope, measure the input voltage (TP2, 0.4 Vpp) and             output voltage (TP6, 3 Vpp). Check phase and gain.", "3. Determine if the FET amplifier is operating correctly. Using the oscilloscope, measure the input voltage (TP2, 0.4 Vpp) and output voltage (TP6, 3 Vpp). Check phase and gain.."], "jumps": ["P2300", "P2280", "P2295"]}, {"id": "P2280", "text": ["1.  Remove the multimeter from the circuit. \n2.  Place PC2 Power switch to ON.", "1. Remove the multimeter from the circuit. 2. Place PC2 Power switch to ON."], "jumps": ["P2270"]}, {"id": "P2270", "text": ["The FET is operating correctly. Now, the computer will insert a fault. Use the FET amplifier troubleshooting procedures to determine the faulty component.", "The FET is operating correctly. Now, the computer will insert a fault. Use the FET amplifier troubleshooting procedures to determine the faulty component. ternal program = SCAN FTR 0 E2 10 External program = SCAN FTR 0 F2 07"], "jumps": ["P2260"]}, {"id": "P2262", "text": ["You should have measured about infinity using an ohmeter and had a \"no current flow\" indication if using a digital meter as the gate to drain PN junction is reverse biased. Check your multimeter test lead connections."], "jumps": []}, {"id": "P2261", "text": [], "jumps": []}, {"id": "P2260", "text": ["7. Reverse the test leads that are on TP3 and TP5. This reverse biases the FET gate to drain. An ohmeter should show very high resistance and a diode tester should show no current flow. Are you getting a forward biased indication on your multimeter???"], "jumps": ["P2250"]}, {"id": "P2252", "text": ["The FET gate to source is forward biased. The ohmeter should have measured about 125 ohms. A diode test should indicate current flow.  Check your meter test lead connections.", "The FET gate to source is forward biased. The ohmeter should have measured about 125 ohms. A diode test should indicate current flow. Check your meter test lead connections.."], "jumps": []}, {"id": "P2251", "text": [], "jumps": []}, {"id": "P2250", "text": ["The FET is forward biased between the gate and drain. An ohmmeter should show low resistance while a diode tester should indicate current flow.  Does the multimeter indicate a forward biased condition?", "The FET is forward biased between the gate and drain. An ohmmeter should show low resistance while a diode tester should indicate current flow. Does the multimeter indicate a forward biased condition?"], "jumps": ["P2240"]}, {"id": "P2245", "text": ["MEASUREMENT SETUP - Connect the black test lead of the multimeter to TP3 and the red lead to TP5."], "jumps": []}, {"id": "P2240", "text": ["5.  Place the test lead connected to the positive potential of the            meter (black lead on Nida 480) to TP3 on PC130-49, gate of             Q1.  \n6.   Place the test lead connected to the negative potential of the         meter (red lead on Nida 480) to TP5 on PC130-49, drain of Q1.", "5. Place the test lead connected to the positive potential of the meter (black lead on Nida 480) to TP3 on PC130-49, gate of Q1. 6. Place the test lead connected to the negative potential of the meter (red lead on Nida 480) to TP5 on PC130-49, drain of Q1."], "jumps": ["P2250", "P2230", "P2245"]}, {"id": "P2232", "text": ["You should have measured about infinity using an ohmeter and had a \"no current flow\" indication if using a digital meter as the gate to source PN junction is reverse biased. Check your multimeter test lead connections."], "jumps": []}, {"id": "P2231", "text": [], "jumps": []}, {"id": "P2230", "text": ["4.  Reverse the test leads that are on TP3 and TP4. This reverse         biases the FET gate to source.\n     Does the meter indicate a forward biased condition?", "4. Reverse the test leads that are on TP3 and TP4. This reverse biases the FET gate to source. Does the meter indicate a forward biased condition?"], "jumps": ["P2220"]}, {"id": "P2222", "text": ["The FET gate to source is forward biased, the ohmeter should have measured about 125 ohms. A diode test should indicate current flow.  Check your meter test lead connections.", "The FET gate to source is forward biased, the ohmeter should have measured about 125 ohms. A diode test should indicate current flow. Check your meter test lead connections."], "jumps": []}, {"id": "P2221", "text": [], "jumps": []}, {"id": "P2220", "text": ["The FET is forward biased between the gate and source. Is the multimeter reading high or low ohms? ??", "The FET is forward biased between the gate and source. An ohmmeter should show low resistance while a diode tester should indicate current flow. Does the multimeter indicate a forward biased condition???????????????????????????????????????????????????????????????????????????????????????????????????"], "jumps": ["P2210"]}, {"id": "P2215", "text": ["MEASUREMENT SETUP - Connect the black test lead of the multimeter to TP3 and the red lead to TP4."], "jumps": []}, {"id": "P2210", "text": ["2.  Place the test lead connected to the positive potential of the           meter (black lead on Nida 480) to TP3 on PC130-49, gate of Q1. 3.  Place the test lead connected to the negative potential of the         meter (red lead on Nida 480) to TP4 on PC130-49, source of Q1.", "2. Place the test lead connected to the positive potential of the meter (black lead on Nida 480) to TP3 on PC130-49, gate of Q1. 3. Place the test lead connected to the negative potential of the meter (red lead on Nida 480) to TP4 on PC130-49, source of Q1."], "jumps": ["P2220", "P2200", "P2215"]}, {"id": "P2200", "text": ["1.  Place the PC2 Power switch to OFF.  \n     Remember, power must be OFF to the circuit when making             resistance measurements or when testing semiconductor \n     junctions.", "1. Place the PC2 Power switch to OFF. Remember, power must be OFF to the circuit when making resistance measurements or when testing semiconductor junctions."], "jumps": ["P2190"]}, {"id": "P2190", "text": ["Now, depending upon the type of multimeter used, let's test the FET. The computer will isolate the FET for you. The demo uses an analog meter as the diode test function settings and display varies between digital multimeter brands and cannot be duplicated in a generic fashion."], "jumps": ["P2200", "P2180"]}, {"id": "P2180", "text": ["Also, the output signal should be approximately 3 Vpp. Dividing the level of the output signal by the input signal produces a measured Av of about 7.5, close to the 7.8 calculated. The circuit is operating correctly.", "Also, the output signal should be approximately 3 Vpp. Dividing the level of the output signal by the input signal produces a measured Av of about 7.5, close to the 7.8 calculated. The circuit is operating correctly..."], "jumps": ["P2190", "P2170"]}, {"id": "P2175", "text": ["MEASUREMENT SETUP - Connect CH2 probe to TP6."], "jumps": []}, {"id": "P2170", "text": ["2.  Connect CH2 probe to the output signal at PC130-49 TP6.               Compare the two signals on the oscilloscope. The output               signal, CH2, should be inverted.", "2. Connect CH2 probe to the output signal at PC130-49 TP6. Compare the two signals on the oscilloscope. The output signal, CH2, should be inverted."], "jumps": ["P2180", "P2160", "P2175"]}, {"id": "P2165", "text": ["MEASUREMENT SETUP - Measure the voltage at TP2."], "jumps": []}, {"id": "P2160", "text": ["1. Measure the input signal at TP2 on PC130-49 using the oscilloscope. Use dual trace, CH1 triggering, and connect the CH1 probe to the input signal. You should measure approximately 0.4 Vpp.."], "jumps": ["P2170", "P2150", "P2165"]}, {"id": "P2150", "text": ["10.  Turn PC2 DC Power switch to ON.\n        The experiment is now setup. Let's verify normal operation             of  the FET amplifier before inserting a fault.", "10. Turn PC2 DC Power switch to ON. The experiment is now setup. Let's verify normal operation of the FET amplifier before inserting a fault.t."], "jumps": ["P2140"]}, {"id": "P2145", "text": ["MEASUREMENT SETUP - Measure the voltage at TP2."], "jumps": []}, {"id": "P2143", "text": ["Your answer is still incorrect. You should have measured approximately 0.40 V. Ensure your setup is correct, then check with your instructor."], "jumps": ["P2150", "P2140"]}, {"id": "P2142", "text": ["Your measurement is not acceptable. Check your setup:", "Your measurement is not acceptable. Check your setup: Function generator output voltage at PC130-49 pin E is a 6 Vpp 1 kHz. - Oscilloscope connected to PC130-49 TP2. - Answer in volts.", "- Function generator output voltage at PC130-49 pin E is a 6 Vpp 1 kHz. - Oscilloscope connected to PC130-49 TP2. - Answer in volts. in volts.s.....volts..."], "jumps": []}, {"id": "P2141", "text": [], "jumps": []}, {"id": "P2140", "text": ["9.  Measure the peak-to-peak input voltage at PC130-49 TP2. \n     What is the measured voltage?", "9. Measure the peak-to-peak input voltage at PC130-49 TP2. What is the measured voltage?."], "jumps": ["P2130", "P2142", "P2145"]}, {"id": "P2137", "text": ["OSCILLOSCOPE LEAD PLACEMENT - Connect CH1 probe to pin E and adjust the Function Generator's amplitude control for a 6 Vpp output."], "jumps": ["P2130", "P2135"]}, {"id": "P2135", "text": ["MEASUREMENT SETUP - Range - 1 k Output Level - 6 Vpp Function - Frequency Dial - 1"], "jumps": ["P2137", "P2130"]}, {"id": "P2130", "text": ["7.  Adjust the function generator's frequency for a 1 kHz sine               wave output.\n8.  Adjust the function generator's amplitude for a 6 Vpp output           measured with an oscilloscope at PC130-49 Pin E.", "7. Adjust the function generator's frequency for a 1 kHz sine wave output. 8. Adjust the function generator's amplitude for a 6 Vpp output measured with an oscilloscope at PC130-49 Pin E."], "jumps": ["P2140", "P2120", "P2135"]}, {"id": "P2125", "text": ["MEASUREMENT SETUP - Connect the main output of Function Generator to the PC1 output BNC on Test Console."], "jumps": []}, {"id": "P2120", "text": ["6.  Connect the function generator to the Test Console PC1                 OUTPUT BNC.", "6. Connect the function generator to the Test Console PC1 OUTPUT BNC. NOTE 1 output BNC connection is between PIN T on PC1 and PIN E on PC2. An input to this BNC applies a signal to PC2 PIN E, the PC2 card input......", "PC1 output BNC connection is between PIN T on PC1 and PIN E on PC2. An input to this BNC applies a signal to PC2 PIN E, the PC2 card input....card input.put.............d input.C2 card input..."], "jumps": ["P2130", "P2110", "P2125"]}, {"id": "P2110", "text": ["4.  Set the Voltmeter Switch to Positive. \n5.  Set the Positive Supply Voltage to 12.\n     The Test Console's Voltage Meter should indicate 12 volts.", "4. Set the Voltmeter Switch to Positive. 5. Set the Positive Supply Voltage to 12. The Test Console's Voltage Meter should indicate 12 volts."], "jumps": ["P2107"]}, {"id": "P2108", "text": [], "jumps": []}, {"id": "P2107", "text": ["3.  Adjust R6 on PC130-49 fully CW. This removes the load from         the amplifier.", "3. Adjust R6 on PC130-49 fully CW. This removes the load from the amplifier. PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2100", "P2108"]}, {"id": "P2100", "text": ["2.  Carefully plug PC130-49 into the Test Console PC2 position.", "2. Carefully plug PC130-49 into the Test Console PC2 position.h to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2090"]}, {"id": "P2090", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P2072"]}, {"id": "P2080", "text": ["The input signal is applied through a voltage divider, Ein is measured at TP2.  Let's start the experiment.", "The input signal is applied through a voltage divider, Ein is measured at TP2. Let's start the experiment."], "jumps": ["P2090", "P2072"]}, {"id": "P2075", "text": ["FET AMPLIFIER GAIN - To calculate the gain of an FET amplifier, use the formula below.", "Av = Gm x Rd Where: Av = Gain of Amplifier Gm = Transconductance given in data book (use 2 if unknown) Rd = Drain Resistance (R3)"], "jumps": []}, {"id": "P2072", "text": ["Q1 is a N channel FET with a Gm of 2 mmhos. Rd is 3.9 kohms, so the calculated gain is 7.8.\n\n                               Av = Gm x Rd or 2 mmhos x 3.9 k", "Q1 is a N channel FET with a Gm of 2 mmhos. Rd is 3.9 kohms, so the calculated gain is 7.8. Av = Gm x Rd or 2 mmhos x 3.9 k"], "jumps": ["P2080", "P2040", "P2075"]}, {"id": "P2070", "text": ["Q1 is a N channel FET with a Gm of 2 mmhos. Rd is 3.9 kohms, so the calculated gain is 7.8.\n\n                               Av = Gm x Rd or 2 mmhos x 3.9 k", "Q1 is a N channel FET with a Gm of 2 mmhos. Rd is 3.9 kohms, so the calculated gain is 7.8. Av = Gm x Rd or 2 mmhos x 3.9 k"], "jumps": ["P2080", "P2040", "P2075"]}, {"id": "P2060", "text": ["Recall that this circuit is a common source FET amplifier."], "jumps": ["P2070", "P2040"]}, {"id": "P2050", "text": ["Compare the components on the card with the schematic shown."], "jumps": ["P2060", "P2040"]}, {"id": "P2040", "text": ["Pick up the PC130-49 card. The purpose of this card is to demonstrate troubleshooting FET amplifier circuits."], "jumps": ["P2050", "P2020"]}, {"id": "P2020", "text": ["The purpose of this experiment is to use an ohmmeter to check out a FET and then troubleshoot a faulted FET amplifier circuit.", "An analog multimeter must be used. A digital multimeter's internal power source is too small to forward bias the PN junctions in the FET. Also, a range that will indicate approximately 100 ohms should be used on the analog multimeter..............................................."], "jumps": ["P2040", "P2001"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu....."], "jumps": ["P1001", "P1940"]}, {"id": "P1940", "text": ["3.  To troubleshoot a FET amplifier:\n      a.  Determine amplifier operation. \n      b.  Determine if Vcc is present.\n      c.  Determine if FET is good. \n      d.  Isolate problem to bias circuit.", "3. To troubleshoot a FET amplifier: a. Determine amplifier operation. b. Determine if Vcc is present. c. Determine if FET is good. d. Isolate problem to bias circuit."], "jumps": ["P1999", "P1930"]}, {"id": "P1930", "text": ["tance is low only when the PN junctions are forward biased.", "2. FETs are checked out using an analog ohmmeter or the diode test function of a digital multimeter. The resistance is low only when the PN junctions are forward biased........................"], "jumps": ["P1940", "P1920"]}, {"id": "P1920", "text": ["1.  The most common fault in a FET amplifier circuit is a failed              FET.  Open or short.", "1. The most common fault in a FET amplifier circuit is a failed FET. Open or short.."], "jumps": ["P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on FET AMPLIFIER FAULTS.", "This completes the information on FET AMPLIFIER FAULTS....."], "jumps": ["P1001", "P1300"]}, {"id": "P1300", "text": ["Remember, the bias voltages are done last because: Coupling capacitors pass AC signals. Vcc effects entire circuit. A faulted FET effects biases."], "jumps": ["P1910", "P1202"]}, {"id": "P1290", "text": ["Voltage measurements and resistance measurements will determine the faulty component."], "jumps": ["P1300", "P1202"]}, {"id": "P1280", "text": ["4.  Measure the bias voltages for correct and incorrect levels.", "4. Measure the bias voltages for correct and incorrect levels."], "jumps": ["P1290", "P1202"]}, {"id": "P1270", "text": ["If the FET is not operating correctly, replace and retest the circuit. If the FET does operate correctly, continue to troubleshoot."], "jumps": ["P1280", "P1202"]}, {"id": "P1260", "text": ["3.  Check the FET for proper operation using the ohmmeter or \n     diode test.", "3. Check the FET for proper operation using the ohmmeter or diode test.."], "jumps": ["P1270", "P1202"]}, {"id": "P1250", "text": ["If correct, continue to troubleshoot.  If not correct, find the fault in the power supply circuit.", "If correct, continue to troubleshoot. If not correct, find the fault in the power supply circuit."], "jumps": ["P1260", "P1202"]}, {"id": "P1240", "text": ["2.  Determine if the operating voltage (Vcc) is correct.  Use a                multimeter.", "2. Determine if the operating voltage (Vcc) is correct. Use a multimeter..."], "jumps": ["P1250", "P1202"]}, {"id": "P1230", "text": ["If the phase and gain are incorrect, the circuit is faulted."], "jumps": ["P1240", "P1202"]}, {"id": "P1220", "text": ["Use an oscilloscope to check phase and level of the output signal.  Check to see if it passes through the coupling capacitor.", "Use an oscilloscope to check phase and level of the output signal. Check to see if it passes through the coupling capacitor."], "jumps": ["P1230", "P1202"]}, {"id": "P1210", "text": ["Use an oscilloscope to determine the level of the input signal. Check to see if it passes through the coupling capacitor."], "jumps": ["P1220", "P1202"]}, {"id": "P1205", "text": ["FET AMPLIFIER GAIN - To calculate the gain of an FET amplifier, use the formula below.", "Av = Gm x Rd Where: Av = Gain of Amplifier Gm = Transconductance given in data book (use 2 if unknown) Rd = Drain Resistance (R3)"], "jumps": []}, {"id": "P1202", "text": ["Remember, a common source FET amplifier inverts the input signal.  Also check the measured gain with the calculated gain.", "Remember, a common source FET amplifier inverts the input signal. Also check the measured gain with the calculated gain."], "jumps": ["P1210", "P1180", "P1205"]}, {"id": "P1200", "text": ["Remember, a common source FET amplifier inverts the input signal.  Also check the measured gain with the calculated gain.", "Remember, a common source FET amplifier inverts the input signal. Also check the measured gain with the calculated gain."], "jumps": ["P1210", "P1180", "P1205"]}, {"id": "P1190", "text": ["1.  Determine if the amplifier circuit is operating correctly.", "1. Determine if the amplifier circuit is operating correctly."], "jumps": ["P1200", "P1180"]}, {"id": "P1180", "text": ["The procedures to check out a FET amplifier circuit are simple."], "jumps": ["P1190", "P1170"]}, {"id": "P1173", "text": ["The drain is made from P type semiconductor material. A positive potential on the drain forward biases the PN junction."], "jumps": []}, {"id": "P1172", "text": ["The gate is made of N type semiconductor material.  A negative potential on the gate forward biases the PN junction.", "The gate is made of N type semiconductor material. A negative potential on the gate forward biases the PN junction."], "jumps": []}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1170", "text": ["Which test lead is placed on the gate of this FET to check the reverse bias resistance of the gate to drain?"], "jumps": ["P1160"]}, {"id": "P1163", "text": ["The drain is made from P type semiconductor material. A negative potential on the drain reverse biases the PN junction."], "jumps": []}, {"id": "P1162", "text": ["The gate is made of N type semiconductor material.  A positive potential on the gate reverse biases the PN junction.", "The gate is made of N type semiconductor material. A positive potential on the gate reverse biases the PN junction."], "jumps": []}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1160", "text": ["Which test lead is placed on the gate of this FET to check the forward bias resistance of the gate to drain?"], "jumps": ["P1150"]}, {"id": "P1153", "text": ["The source is made from N type semiconductor material.  A positive potential on the source reverse biases the PN junction.", "The source is made from N type semiconductor material. A positive potential on the source reverse biases the PN junction."], "jumps": []}, {"id": "P1152", "text": ["The gate is made of P type semiconductor material. A negative potential on the gate reverse biases the PN junction."], "jumps": []}, {"id": "P1151", "text": [], "jumps": []}, {"id": "P1150", "text": ["Which test lead is placed on the gate of this FET to check the forward bias resistance of the gate to source?"], "jumps": ["P1082"]}, {"id": "P1140", "text": ["sing an analog meter or a digital using diode test, is that current should flow in one directi", "Remember, whether using an analog meter or a digital meter using the diode test function, current should flow in one direction only between the gate and the drain and the gate and the source........."], "jumps": ["P1150", "P1082"]}, {"id": "P1130", "text": ["Reverse the leads, reverse biasing the gate to drain PN junction. A normal reading is high resistance.  Low resistance reading indicates a shorted FET.", "Reverse the leads, reverse biasing the gate to drain PN junction. A normal reading is high resistance. Low resistance reading indicates a shorted FET."], "jumps": ["P1140", "P1082"]}, {"id": "P1120", "text": ["Second, measure the resistance of the gate to drain PN junction when forward biased. A low resistance reading is normal. A high resistance indicates an open FET."], "jumps": ["P1130", "P1082"]}, {"id": "P1110", "text": ["Now reverse the test leads, reverse biasing the gate to source PN junction. The normal resistance measurement is high.  A low reading indicates a shorted FET.", "Now reverse the test leads, reverse biasing the gate to source PN junction. The normal resistance measurement is high. A low reading indicates a shorted FET."], "jumps": ["P1120", "P1082"]}, {"id": "P1100", "text": ["The normal resistance reading is low. A high reading indicates an open FET."], "jumps": ["P1110", "P1082"]}, {"id": "P1090", "text": ["Remember, on some multimeters, the black lead is connected to the positive voltage source of the meter (Nida Model 480)."], "jumps": ["P1100", "P1082"]}, {"id": "P1087", "text": ["P CHANNEL FET - If checking a P channel FET, connect the negative potential lead to the gate and positive potential lead to the source."], "jumps": []}, {"id": "P1085", "text": ["N CHANNEL FET - The source and drain are made from the same type of  semiconductor material, N. The gate is P type semiconductor material.", "N CHANNEL FET - The source and drain are made from the same type of semiconductor material, N. The gate is P type semiconductor material."], "jumps": []}, {"id": "P1082", "text": ["First, check the resistance of the gate to source when forward biased. Since this is a N channel FET, the gate should be positive with respect to the source.", "First, check the resistance of the gate to source when forward biased. Since this is a N channel FET, the gate should be positive with respect to the source..."], "jumps": ["P1090", "P1070", "P1087"]}, {"id": "P1080", "text": ["First, check the resistance of the gate to source when forward biased. Since this is a N channel FET, the gate should be positive with respect to the source.", "First, check the resistance of the gate to source when forward biased. Since this is a N channel FET, the gate should be positive with respect to the source..."], "jumps": ["P1090", "P1070", "P1087"]}, {"id": "P1070", "text": ["The test requires checking the resistance of the FET elements when forward and reverse biased."], "jumps": ["P1080", "P1050"]}, {"id": "P1050", "text": ["A simple test using an analog ohmmeter or a digital multimeter with a diode junction test feature can verify whether a FET is good or bad.  An analog meter is used in the demos as digital meters vary too much in settings and displays to provide a generic representation.", "A simple test using an analog ohmmeter or a digital multimeter with a diode junction test feature can verify whether a FET is good or bad. An analog meter is used in the demos as digital meters vary too much in settings and displays to provide a generic representation.should be used on the analog multimeter...", "An analog multimeter set to the 100 ohm range is ideal. A digital multimeter's internal power source is too small to forward bias the PN junctions in the FET using any resistance range but the diode test function can be used..........................................................."], "jumps": ["P1070", "P1020"]}, {"id": "P1040", "text": ["However, be aware that any other component failures will cause an incorrect output from the FET circuit.", "However, be aware that any other component failures will cause an incorrect output from the FET circuit...................."], "jumps": ["P1050", "P1020"]}, {"id": "P1030", "text": ["The FET may fail in either PN junction, Gate to Source or Gate to Drain. Either way, the effect is the same - the output voltage will not be correct."], "jumps": ["P1040", "P1020"]}, {"id": "P1020", "text": [ let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
