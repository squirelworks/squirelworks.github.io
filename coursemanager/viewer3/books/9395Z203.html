<script>
const book = {"title": "9395Z203", "pages": [{"id": "P0", "text": ["Nida Corporation 2003-2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003-2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . .", "Title: THREE PHASE POWER GENERATIONfasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe the operation of a typical power supply. w Describe Three Phase 400 Hz power and its advantages. w Describe a Three Phase 400 Hz Power Supply.", "w Measure signals in a Three Phase 400 Hz Power Supply. w Troubleshoot a faulted Three Phase 400 Hz Power Supply......"], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 480, 488 or Equivalent XXXXXnt"], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P331", "text": [], "jumps": []}, {"id": "P332", "text": [], "jumps": []}, {"id": "P400", "text": ["Three phase 400 Hz power supplies are used in airplanes because they are lightweight and efficient.", "open door get broom close door sweepeatures 2. Use The Programming Device 4. Consult Flow Charts"], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["You may be asking why aircraft need three phase, 400 Hz AC power supplies?  Most electronic equipment operates on DC.", "You may be asking why aircraft need three phase, 400 Hz AC power supplies? Most electronic equipment operates on DC."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["The alternating current produced by the aircraft generator is converted to DC by the three phase 400 Hz power supply system."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["To operate DC electronic equipment, the AC power must be changed to DC before it can be used.", "AC Power Supplyyyyyyyyyy Power Supply", "Three Phase, 400 Hz Power Supply"], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Due to size and weight limitations on aircraft, using three phase 400 Hz power allows for small and efficient equipment design as you will see."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["Consequently, to convert three phase 400 Hz AC power to DC takes a three phase 400 Hz power supply."], "jumps": ["P460", "P430"]}, {"id": "P460", "text": ["Let's begin the lesson on THREE PHASE POWER GENERATION...................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["A three phase 400 Hz power supply is no different than any other AC power supply."], "jumps": ["P1025", "P1001"]}, {"id": "P1025", "text": ["An AC input is applied to the rectifier circuit first."], "jumps": ["P1030", "P1020"]}, {"id": "P1030", "text": ["The rectifier changes AC to pulsating DC."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The rectifier circuit uses standard diodes in halfwave, fullwave and bridge rectifier configurations to change the AC to a pulsating DC."], "jumps": ["P1050", "P1020"]}, {"id": "P1043", "text": ["HALF WAVE RECTIFIER - The diode only conducts when forward biased. Thus only the positive alternation (half wave) of the sine wave reaches the load. AC is changed to Pulsating DC."], "jumps": []}, {"id": "P1045", "text": ["FULL WAVE RECTIFIER - The diode only conducts when forward biased but, each alternation (full wave) of the sine wave reaches the load due to the center tapped transformer and the two diodes. This changes AC to Pulsating DC."], "jumps": []}, {"id": "P1047", "text": ["BRIDGE RECTIFIER - The diodes only conduct when forward biased but, each alternation (full wave) of the sine wave reaches the load due to the use of the four diodes (no center tapped transformer). This changes AC to Pulsating DC."], "jumps": []}, {"id": "P1050", "text": ["Once the AC is changed to pulsating DC, it is filtered to produce pure DC."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["Filters consist of a capacitor, a resistor and capacitor or an inductor and capacitor."], "jumps": ["P1070", "P1050"]}, {"id": "P1063", "text": ["CAPACITOR FILTER - The capacitor will charge up to the average voltage level of the applied pulsating DC. The charging and discharging of the capacitor when the pulsating DC is applied produces a smooth or filtered output."], "jumps": []}, {"id": "P1065", "text": ["RESISTOR CAPACITOR FILTER - The two capacitors will charge up to the average voltage level of the applied pulsating DC. The charging and discharging of the capacitors through the resistor when the pulsating DC is applied produces a smooth or filtered output."], "jumps": []}, {"id": "P1067", "text": ["INDUCTOR CAPACITOR FILTER - The two capacitors will charge up to the average voltage level of the applied pulsating DC.\nThe charging and discharging of the capacitors through the inductor when the pulsating DC is applied produces a smooth or filtered output.", "INDUCTOR CAPACITOR FILTER - The two capacitors will charge up to the average voltage level of the applied pulsating DC. The charging and discharging of the capacitors through the inductor when the pulsating DC is applied produces a smooth or filtered output."], "jumps": []}, {"id": "P1070", "text": ["Finally, the pure DC is applied to a voltage regulator that maintains a constant voltage output even if the load on the power supply changes."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["Normally, a zener diode or transistor voltage regulator is used.", "Normally, a zener diode or transistor voltage regulator is used....."], "jumps": ["P1090", "P1070"]}, {"id": "P1083", "text": ["ZENER REGULATOR - The zener diode will produce a constant output voltage as long as the input voltage is above the zener diodes breakdown voltage. This is why changes in the output load have no effect on the output voltage, the zener changes its internal resistance."], "jumps": []}, {"id": "P1085", "text": ["TRANSISTOR REGULATOR - The conduction of the transistor is changed to compensate for output voltage variation by comparing the output voltage with a reference voltage (set by the zener diode)."], "jumps": []}, {"id": "P1090", "text": ["One phase and three phase power supplies change AC into pure DC using the rectifier, filter and regulator circuits."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["Touch the block that smooths pulsating DC to pure DC.", "Touch the block that smooths pulsating DC to pure DC......."], "jumps": ["P1090"]}, {"id": "P1101", "text": [], "jumps": []}, {"id": "P1102", "text": ["You touched the rectifier.  The rectifier changes AC into pulsating DC, it does not change pulsating DC into pure DC.", "You touched the rectifier. The rectifier changes AC into pulsating DC, it does not change pulsating DC into pure DC."], "jumps": []}, {"id": "P1103", "text": ["You touched the regulator.  The regulator maintains a constant output voltage even if the load changes.  It does not change pulsating DC into pure DC.", "You touched the regulator. The regulator maintains a constant output voltage even if the load changes. It does not change pulsating DC into pure DC....."], "jumps": []}, {"id": "P1110", "text": ["Touch the block that maintains a constant output voltage.", "Touch the block that maintains a constant output voltage..."], "jumps": ["P1100"]}, {"id": "P1111", "text": [], "jumps": []}, {"id": "P1112", "text": ["You touched the rectifier.  The rectifier changes AC into pulsating DC, it does not maintain a constant output voltage.", "You touched the rectifier. The rectifier changes AC into pulsating DC, it does not maintain a constant output voltage."], "jumps": []}, {"id": "P1113", "text": ["You touched the filter.  The filter changes pulsating DC into pure DC, it does not maintain a constant output voltage.", "You touched the filter. The filter changes pulsating DC into pure DC, it does not maintain a constant output voltage."], "jumps": []}, {"id": "P1120", "text": ["Now, let's look at three phase 400 Hz power and find out why it is used instead of 1 phase 60 Hz power."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["If you viewed one phase power with an oscilloscope, you would see one varying voltage level in the shape of a sine wave."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["If it was changed to DC, you would get an average value of DC power out."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["Three phase power has three varying voltage levels of equal amplitude and frequency but, at different phases."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["Phase 1 or 1, varies from +V to -V just like one phase power.  It is used as the reference phase.", "Phase 1 or 1, varies from +V to -V just like one phase power. It is used as the reference phase."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["Phase 2 or 2, also varies from +V to -V but starts 120 degrees from 1."], "jumps": ["P1180", "P1150"]}, {"id": "P1180", "text": ["Phase 3 or 3, also varies from +V to -V but starts 240 degrees from 1 or 120 degrees from 2 (all phases are 120 degrees apart)."], "jumps": ["P1190", "P1150"]}, {"id": "P1190", "text": ["Changing three phase power to DC produces a higher DC voltage than 1 phase power."], "jumps": ["P1200", "P1150"]}, {"id": "P1200", "text": ["Comparing one phase power to three phase power, you can see that the three phase contains MORE POWER."], "jumps": ["P1210", "P1150"]}, {"id": "P1210", "text": ["This is very important when the size and weight of the power generating equipment is limited - such as in aircraft."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["Most AC motors and other AC mechanical devices operate more efficiently on three phase power.  Equipment size and weight is also reduced.", "Most AC motors and other AC mechanical devices operate more efficiently on three phase power. Equipment size and weight is also reduced."], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["The next question we will look at is why use 400 Hz?  Most equipment used in factories and your home is 50 or 60 Hz.", "The next question we will look at is why use 400 Hz? Most equipment used in factories and your home is 50 or 60 Hz."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["Again, it has to do with changing AC to DC and the efficiency of AC motors and other AC mechanical devices."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["As you can see, the average power delivered by 400 Hz is greater than 60 Hz due to the higher frequency."], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["Since the average power is higher, converting the power to DC produces a higher DC voltage.  Motors and other AC devices operate more efficiently using higher frequencies.", "Since the average power is higher, converting the power to DC produces a higher DC voltage. Motors and other AC devices operate more efficiently using higher frequencies."], "jumps": ["P1270", "P1230"]}, {"id": "P1270", "text": ["Again, since space and weight are limited on aircraft, 400 Hz power is used to reduce the size and weight of equipment."], "jumps": ["P1280", "P1230"]}, {"id": "P1280", "text": ["It is not uncommon to find a low voltage 10 kHz power system on an aircraft."], "jumps": ["P1290", "P1230"]}, {"id": "P1290", "text": ["Which term can be used to describe a piece of equipment that uses three phase 400 Hz power?"], "jumps": ["P1280"]}, {"id": "P1291", "text": [], "jumps": []}, {"id": "P1292", "text": ["Three phase 400 Hz equipment can be smaller, have less weight and receive more power from a source than one phase 60 Hz equipment.  They are not less efficient.", "Three phase 400 Hz equipment can be smaller, have less weight and receive more power from a source than one phase 60 Hz equipment. They are not less efficient....."], "jumps": []}, {"id": "P1293", "text": ["Three phase 400 Hz equipment can be smaller and have less weight.  They are not larger and heavier.", "Three phase 400 Hz equipment can be smaller and have less weight. They are not larger and heavier."], "jumps": []}, {"id": "P1300", "text": ["Finally, let's look at a typical three phase 400 Hz power supply. This is the power supply used in the experiment."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["The power supply consists of these standard three circuits:"], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["The rectifier converts three phase 400 Hz power to a pulsating DC."], "jumps": ["P1330", "P1300"]}, {"id": "P1330", "text": ["A typical rectifier contains three transformers and six diodes."], "jumps": ["P1340", "P1300"]}, {"id": "P1340", "text": ["The three transformers, one for each phase, provide isolation and will step up or step down the voltage depending on the output requirements."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["There are six diodes used to form a bridge circuit for each one of the three phases.  This is the main difference between one phase and three phase power supplies.", "There are six diodes used to form a bridge circuit for each one of the three phases. This is the main difference between one phase and three phase power supplies."], "jumps": ["P1360", "P1330"]}, {"id": "P1360", "text": ["Diodes D1, D2, D3 and D4 form a bridge rectifier for phase 1 and produce a full wave pulsating DC output."], "jumps": ["P1370", "P1330", "P1365"]}, {"id": "P1365", "text": ["BRIDGE RECTIFIER - Bottom of transformer NEGATIVE - current flow via bottom of transformer, D4, ground, up through load, D1, to top of transformer. Bottom of transformer POSITIVE - current flow via top of transformer, D2, ground, up through load, D3, to bottom of transformer. Current flow through load in same direction for both alternation."], "jumps": []}, {"id": "P1370", "text": ["Diodes D3, D4, D5 and D6 form a bridge rectifier for phase 2 and produce a full wave pulsating DC output displaced 120 degrees from phase 1."], "jumps": ["P1380", "P1360", "P1375"]}, {"id": "P1375", "text": ["flow via bottom of transformer, D6, ground, up through load, D3, to top of transformer.", "BRIDGE RECTIFIER - Bottom of transformer NEGATIVE - current flow via bottom of transformer, D6, ground, up through load, D3, to top of transformer. Bottom of transformer POSITIVE - current flow via top of transformer, D4, ground, up through load, D5, to bottom of transformer. Current flow through load in same direction for both alternation."], "jumps": []}, {"id": "P1380", "text": ["Diodes D1, D2, D5 and D6 form a bridge rectifier for phase 3 and produce a full wave pulsating DC output 240 degrees displaced from phase 1 and 120 degrees displaced from phase 2."], "jumps": ["P1390", "P1370", "P1385"]}, {"id": "P1385", "text": ["BRIDGE RECTIFIER - Bottom of transformer NEGATIVE - current flow via bottom of transformer, D6, ground, up through load, D5, to top of transformer. Bottom of transformer POSITIVE - current flow via top of transformer, D6, ground, up through load, D5, to bottom of transformer. Current flow through load in same direction for both alternation."], "jumps": []}, {"id": "P1390", "text": ["The result is a pulsating DC output, or DC with a ripple.  Ripple is commonly used to describe the DC variations when AC is rectified.", "The result is a pulsating DC output, or DC with a ripple. Ripple is commonly used to describe the DC variations when AC is rectified."], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["In the rectifier, which diodes are used to rectify phase 2 of the three phase AC input?"], "jumps": ["P1390"]}, {"id": "P1401", "text": [], "jumps": []}, {"id": "P1402", "text": ["D1, D2 and D3, D4 are used to rectify phase 1.", "D1, D2 and D3, D4 are used to rectify phase 1.............."], "jumps": []}, {"id": "P1403", "text": ["D1, D2 and D5, D6 are used to rectify phase 3.", "D1, D2 and D5, D6 are used to rectify phase 3.............."], "jumps": []}, {"id": "P1410", "text": ["What type of rectifier is used in this schematic?", "What type of rectifier is used in this schematic?.........."], "jumps": ["P1400"]}, {"id": "P1411", "text": [], "jumps": []}, {"id": "P1412", "text": ["A full wave rectifier uses two diodes and a center tapped transformer to rectify a phase."], "jumps": []}, {"id": "P1413", "text": ["A half wave rectifier uses one diode to rectify a phase.", "A half wave rectifier uses one diode to rectify a phase...."], "jumps": []}, {"id": "P1420", "text": ["After the rectification, the pulsating DC is filtered to produce a pure DC signal."], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["Our three phase 400 Hz power supply uses a small capacitor with a small value as the filter."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["This illustrates an advantage of using three phase 400 Hz power, the components can be smaller - saving space and weight for aircrafts."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["What principle is used in a capacitor to smooth out ripple or small changes in voltage?"], "jumps": ["P1440"]}, {"id": "P1451", "text": [], "jumps": []}, {"id": "P1452", "text": ["A capacitor may have a breakdown voltage but, if it is reached the capacitor fails.  Breakdown voltage is not the principle used to smooth the ripple.", "A capacitor may have a breakdown voltage but, if it is reached the capacitor fails. Breakdown voltage is not the principle used to smooth the ripple......."], "jumps": []}, {"id": "P1453", "text": ["A capacitor does not have a constant resistance, it's reactance changes according the applied frequency.  This is not the principle used to smooth the ripple.", "A capacitor does not have a constant resistance, it's reactance changes according the applied frequency. This is not the principle used to smooth the ripple...."], "jumps": []}, {"id": "P1460", "text": ["After the filtering, the pure DC is regulated to maintain a constant output."], "jumps": ["P1470", "P1450"]}, {"id": "P1470", "text": ["The regulator circuit used in the experiment consists of a voltage regulator and an overcurrent protection circuit."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["Voltage regulation is accomplished by Q2, D7, and U1."], "jumps": ["P1490", "P1470"]}, {"id": "P1490", "text": ["Conduction of the voltage regulator Q2 varies to compensate for output voltage variations."], "jumps": ["P1500", "P1470"]}, {"id": "P1500", "text": ["The conduction of Q2 is controlled by the voltage applied to its base from the operational amplifier in the differential configuration."], "jumps": ["P1510", "P1470"]}, {"id": "P1501", "text": ["The conduction of Q2 is controlled by the voltage applied to its base from the operational amplifier in the differential configuration."], "jumps": ["P1510", "P1470"]}, {"id": "P1505", "text": ["DIFFERENTIAL AMPLIFIER - The operational amplifier produces a DC output in proportion to the difference between the + or non-inverting input and the - or inverting input."], "jumps": []}, {"id": "P1510", "text": ["The negative input is a sample of the output voltage through the voltage divider action of R8 and R1."], "jumps": ["P1520", "P1501"]}, {"id": "P1520", "text": ["The positive input is a constant voltage developed by zener diode D7 as adjusted by R3 (C2 acts as another filter blocking DC and R2 supplies the voltage to D7)."], "jumps": ["P1530", "P1501"]}, {"id": "P1530", "text": ["The difference between the + and - inputs of U1 produce a positive voltage to the base of Q2 which causes it to conduct at a certain rate, producing a voltage level to the load."], "jumps": ["P1540", "P1501"]}, {"id": "P1540", "text": ["If the load changes causing the output voltage to decrease, the voltage applied to the negative input of U1 decreases."], "jumps": ["P1550", "P1501"]}, {"id": "P1550", "text": ["With a constant voltage applied to the positive input of U1 and the negative input voltage being less, the positive output of U1 increases."], "jumps": ["P1560", "P1540"]}, {"id": "P1560", "text": ["The increased positive output voltage of U1 is applied to the base of Q2 and the conduction of Q2 increases."], "jumps": ["P1570", "P1540"]}, {"id": "P1570", "text": ["With Q2 conducting more, the output voltage increases to the original set level.", "Output Increases to original set level"], "jumps": ["P1580", "P1540"]}, {"id": "P1580", "text": ["If the load changes causing the output voltage to increase, the voltage applied to the negative input of U1 increases."], "jumps": ["P1590", "P1540"]}, {"id": "P1590", "text": ["With a constant voltage applied to the positive input of U1 and a higher negative input voltage, the positive output of U1 decreases."], "jumps": ["P1600", "P1580"]}, {"id": "P1600", "text": ["The decreased positive output voltage of U1 is applied to the base of Q2 and the conduction of Q2 decreases."], "jumps": ["P1610", "P1580"]}, {"id": "P1610", "text": ["With Q2 conducting less, the output voltage decreases to the original level as set.", "Output Decreases to original set level"], "jumps": ["P1620", "P1580"]}, {"id": "P1620", "text": ["U1 controls the conduction of Q2 to maintain a constant output voltage even if the load changes.  This is voltage regulation.", "U1 controls the conduction of Q2 to maintain a constant output voltage even if the load changes. This is voltage regulation."], "jumps": ["P1630", "P1580"]}, {"id": "P1630", "text": ["The overcurrent protection circuit is made up of Q1 and R4, R5 and R9 as illustrated."], "jumps": ["P1640", "P1620"]}, {"id": "P1640", "text": ["R4, R5 and R9 are small value resistors that develop a small voltage drop which has very little effect on the output voltage."], "jumps": ["P1650", "P1630"]}, {"id": "P1650", "text": ["With the base and emitter of Q1 connected across R4, R5 and R9, Q1 is not biased ON.  This is due to the small voltage drop of the resistors.", "With the base and emitter of Q1 connected across R4, R5 and R9, Q1 is not biased ON. This is due to the small voltage drop of the resistors."], "jumps": ["P1660", "P1630"]}, {"id": "P1660", "text": ["With Q1 OFF, there is no effect in the circuit and output current continues to flow."], "jumps": ["P1670", "P1630"]}, {"id": "P1670", "text": ["However, if the output current increases to a high enough level, as set by R5, the voltage drop of R4, R5 and R9 will be sufficient to bias Q1 ON."], "jumps": ["P1680", "P1630"]}, {"id": "P1680", "text": ["When Q1 turns ON, the base and emitter of Q2 are shorted which turns Q2 OFF and the output current stops flowing."], "jumps": ["P1690", "P1630"]}, {"id": "P1690", "text": ["When the current flow stops, Q1 will turn OFF allowing Q2 to turn ON, producing current."], "jumps": ["P1700", "P1630"]}, {"id": "P1700", "text": ["If the current is still excessive, Q1 turns ON turning Q2 OFF again.  The process will continue until the current is no longer excessive.", "If the current is still excessive, Q1 turns ON turning Q2 OFF again. The process will continue until the current is no longer excessive."], "jumps": ["P1710", "P1630"]}, {"id": "P1710", "text": ["The net effect is that when current is excessive, Q2 turns ON and OFF which effectively lowers the output voltage so current is kept within the set limits."], "jumps": ["P1720", "P1630"]}, {"id": "P1720", "text": ["Q1 is an overcurrent protection device."], "jumps": ["P1730", "P1630"]}, {"id": "P1730", "text": ["In the regulator circuit, which component controls the level of conduction of Q2?"], "jumps": ["P1630"]}, {"id": "P1731", "text": [], "jumps": []}, {"id": "P1732", "text": ["Q1 is used as an overcurrent protection device.  It either lets Q2 conduct or turns Q2 off depending on the output current flow.  Q1 does not control the conduction level of Q2.", "Q1 is used as an overcurrent protection device. It either lets Q2 conduct or turns Q2 off depending on the output current flow. Q1 does not control the conduction level of Q2......"], "jumps": []}, {"id": "P1733", "text": ["D7 sets the constant reference voltage to the positive input of U1.  D7 does not directly control the conduction of Q2.", "D7 sets the constant reference voltage to the positive input of U1. D7 does not directly control the conduction of Q2."], "jumps": []}, {"id": "P1740", "text": ["In the regulator circuit, which component is adjusted to set the overcurrent protection?"], "jumps": ["P1730"]}, {"id": "P1741", "text": [], "jumps": []}, {"id": "P1742", "text": ["R3 sets the constant voltage from D7 for the reference voltage to U1.  U1 controls the conduction of Q2, not the ON or OFF state of Q2.", "R3 sets the constant voltage from D7 for the reference voltage to U1. U1 controls the conduction of Q2, not the ON or OFF state of Q2."], "jumps": []}, {"id": "P1743", "text": ["D7 is not adjustable. The value of D7 is chosen so that the voltage applied to the positive input of U1 produces the correct conduction of Q2 for the output voltage desired.", "D7 is not adjustable. The value of D7 is chosen so that the voltage applied to the positive input of U1 produces the correct conduction of Q2 for the output voltage desired...."], "jumps": []}, {"id": "P1750", "text": ["In the regulator circuit, if the output voltage increases, what happens to the conduction of Q2?"], "jumps": ["P1740"]}, {"id": "P1751", "text": [], "jumps": []}, {"id": "P1752", "text": ["If the conduction of Q2 increases, the output voltage will increase.  Since the question states that the output increased, the conduction of Q2 can not increase to maintain a constant voltage output.", "If the conduction of Q2 increases, the output voltage will increase. Since the question states that the output increased, the conduction of Q2 can not increase to maintain a constant voltage output...."], "jumps": []}, {"id": "P1753", "text": ["If the conduction of Q2 stays the same, the output voltage will not change.  Since the question states that the output increased, the conduction of Q2 can not stay the same to maintain a constant voltage output.", "If the conduction of Q2 stays the same, the output voltage will not change. Since the question states that the output increased, the conduction of Q2 can not stay the same to maintain a constant voltage output................"], "jumps": []}, {"id": "P1910", "text": ["This completes the information on THREE PHASE POWER GENERATION OPERATION."], "jumps": ["P1001", "P1750"]}, {"id": "P1920", "text": ["1.  Three phase 400 Hz power supplies have a rectifier, filter, and        voltage regulator.", "1. Three phase 400 Hz power supplies have a rectifier, filter, and voltage regulator."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  The rectifier changes AC to pulsating DC.  The filter changes          pulsating DC to pure DC.  The regulator maintains a constant        output.", "2. The rectifier changes AC to pulsating DC. The filter changes pulsating DC to pure DC. The regulator maintains a constant output."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Three phase power has three voltage levels of equal                          amplitude and frequency, but at different phases that are \n      120 degrees apart.", "3. Three phase power has three voltage levels of equal amplitude and frequency, but at different phases that are 120 degrees apart."], "jumps": ["P1960", "P1920"]}, {"id": "P1960", "text": ["4.  Three phase 400 Hz power is used where larger amounts of            efficient power is needed.", "4. Three phase 400 Hz power is used where larger amounts of efficient power is needed."], "jumps": ["P1970", "P1940"]}, {"id": "P1970", "text": ["5.  The rectifier in a three phase 400 Hz power supply consists of        six diodes, two for each phase.", "5. The rectifier in a three phase 400 Hz power supply consists of six diodes, two for each phase."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["6.  The filter in a three phase 400 Hz power supply consists of a          small capacitor due to efficiency of three phase 400 Hz                    power.", "6. The filter in a three phase 400 Hz power supply consists of a small capacitor due to efficiency of three phase 400 Hz power."], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["7.  The regulator in a three phase 400 Hz power supply consists         of a voltage regulator, Q2, and an overprotection circuit, Q1.", "7. The regulator in a three phase 400 Hz power supply consists of a voltage regulator, Q2, and an overprotection circuit, Q1."], "jumps": ["P1999", "P1980"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1990"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["In this experiment, you will study the operation of and troubleshoot a three phase 400 Hz power supply."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["The three phase 400 Hz power supply, PC130-230, is supported by two other cards that will be located in PC1 and PC3 positions."], "jumps": []}, {"id": "P2040", "text": ["The PC130-290 card is the Load card."], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["It is used to verify correct operation of the voltage regulator on PC130-230.  This is accomplished by applying different loads using the PC130-290 card.", "It is used to verify correct operation of the voltage regulator on PC130-230. This is accomplished by applying different loads using the PC130-290 card."], "jumps": ["P2060", "P2030"]}, {"id": "P2060", "text": ["The switches along the top portion of the card are used to apply different fixed loads and R1 is used to vary the load."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["The PC130-229 card is an electronic Three Phase Generator.", "The PC130-229 card is an electronic Three Phase Generator.."], "jumps": ["P2080", "P2050"]}, {"id": "P2080", "text": ["It is used in place of a mechanical three phase alternator or generator to produce the three phase 400 Hz power."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["You will adjust the potentiometers on the card to produce a clean three phase 400 Hz output."], "jumps": ["P2100", "P2070"]}, {"id": "P2100", "text": ["Basically, U1 produces a sine wave output that is split to drive three power amplifiers that have 120 degree phase differences."], "jumps": ["P2110", "P2070"]}, {"id": "P2110", "text": ["The three devices on top of the card are connected to a heat sink. U4, U5 and U6 are power amplifiers and will become hot and will burn you if touched."], "jumps": ["P2120", "P2070"]}, {"id": "P2120", "text": ["Finally, PC130-230 is the Power Supply.", "Finally, PC130-230 is the Power Supply....................."], "jumps": ["P2130", "P2070"]}, {"id": "P2130", "text": ["It is the circuit that you studied in the theory portion of the lesson with the addition of test points and test console connector    pins.", "It is the circuit that you studied in the theory portion of the lesson with the addition of test points and test console connector pins."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["You will set up, measure signals and troubleshoot the circuit."], "jumps": ["P2160", "P2120"]}, {"id": "P2160", "text": [], "jumps": ["P2170", "P2120"]}, {"id": "P2170", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2120"]}, {"id": "P2180", "text": ["2.  Place PC130-229 into the PC1 position. \n3.  Set S1 to HIGH and S2 to ALL.       \n4.  Set all potentiometers to mid position.", "2. Place PC130-229 into the PC1 position. 3. Set S1 to HIGH and S2 to ALL. 4. Set all potentiometers to mid position. ......................"], "jumps": ["P2170"]}, {"id": "P2190", "text": ["5.  Place PC130-230 into the PC2 position. \n6.  Set S1, S2 and S3 to UP.  \n7.  Set R3 and R5 to mid position.", "5. Place PC130-230 into the PC2 position. 6. Set S1, S2 and S3 to UP. 7. Set R3 and R5 to mid position. ....................."], "jumps": ["P2180"]}, {"id": "P2200", "text": ["8.  Place PC130-290 into the PC3 position. \n9.  Set S1 to E, S2 to POS, S3 to the left and S4 through S9 to               DOWN.", "8. Place PC130-290 into the PC3 position. 9. Set S1 to E, S2 to POS, S3 to the left and S4 through S9 to DOWN."], "jumps": ["P2190"]}, {"id": "P2210", "text": ["10.  Set the Positive Supply Control to 9. \n       The Voltmeter on the 130A should indicate 9 Volts.    \n11.  Set the Negative Supply Control to 9.  \n        The Voltmeter on the 130A should indicate 9 Volts.", "10. Set the Positive Supply Control to 9. The Voltmeter on the 130A should indicate 9 Volts. 11. Set the Negative Supply Control to 9. The Voltmeter on the 130A should indicate 9 Volts."], "jumps": ["P2200"]}, {"id": "P2220", "text": ["The circuits are now set up on the test console.  You will align the generator card first.", "The circuits are now set up on the test console. You will align the generator card first. raphics Text) NOTE When the power is applied to the generator card, PC130-229, the VOLTMETER on the Test Console may indicate that the Test Console's output voltage dropped. This is due to the generator card not being aligned. The output voltage will", "When the power is applied to the generator card, PC130-229, the VOLTMETER on the Test Console may indicate that the Test Console's output voltage dropped. This is due to the generator card not being aligned. The output voltage will return to 9 volts once the card is aligned."], "jumps": ["P2240", "P2210"]}, {"id": "P2240", "text": ["1.  Turn PC1 DC Power switch to ON.", "1. Turn PC1 DC Power switch to ON.ol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2220"]}, {"id": "P2250", "text": ["2.  Using the oscilloscope set to measure AC voltage, connect            the CH1 probe to TP6 on PC130-229.  This is the phase 1                 output.  You will see a large distorted signal.  Use a Time/Div          setting of 0.5 msec and a Volt/Div setting of 1.", "2. Using the oscilloscope set to measure AC voltage, connect the CH1 probe to TP6 on PC130-229. This is the phase 1 output. You will see a large distorted signal. Use a Time/Div setting of 0.5 msec and a Volt/Div setting of 1."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["3.  On PC130-229 adjust the gain control (R6) and the distortion          control (R3) for a clean symmetrical sinewave at 4 Vpp.", "3. On PC130-229 adjust the gain control (R6) and the distortion control (R3) for a clean symmetrical sinewave at 4 Vpp."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["The test console output voltage should be back to 9 volts.  If not see your instructor.", "The test console output voltage should be back to 9 volts. If not see your instructor."], "jumps": ["P2280", "P2250"]}, {"id": "P2280", "text": ["4.  Using the oscilloscope, or frequency counter adjust the                  frequency control (R2 Freq.), for an output of 400 Hz.  When           using the oscilloscope, the time for one complete cycle is \n     2.5 msec (1/\u0083, 1/400 Hz) or 5 horizontal divisions at a Time/Div        setting of 0.5 msec.", "4. Using the oscilloscope, or frequency counter adjust the frequency control (R2 Freq.), for an output of 400 Hz. When using the oscilloscope, the time for one complete cycle is 2.5 msec (1/", ", 1/400 Hz) or 5 horizontal divisions at a Time/Div setting of 0.5 msec."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["5.  Re-adjust R3 (distortion), R2 (frequency) and R6 (gain), if                 needed, to ensure a symmetrical smooth 400 Hz output at \n     4 Vpp.  Phase 1 or the reference phase is now adjusted.", "5. Re-adjust R3 (distortion), R2 (frequency) and R6 (gain), if needed, to ensure a symmetrical smooth 400 Hz output at 4 Vpp. Phase 1 or the reference phase is now adjusted."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["6.  Place the Time/Div control to 0.2 msec. \n7.  Adjust the Time/Div Variable control so that one cycle of the           400 Hz signal equals exactly 6 cm or 6 major divisions as                shown.", "6. Place the Time/Div control to 0.2 msec. 7. Adjust the Time/Div Variable control so that one cycle of the 400 Hz signal equals exactly 6 cm or 6 major divisions as shown."], "jumps": ["P2310", "P2280"]}, {"id": "P2310", "text": ["This set up makes each cm or major division equal to 60 degrees."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["Since each division is 60 degrees, making adjustments for \n120 degree phase differences is easy, two divisions for \n120 degree phase shifts and four divisions for 240 degree phase shifts.", "Since each division is 60 degrees, making adjustments for 120 degree phase differences is easy, two divisions for 120 degree phase shifts and four divisions for 240 degree phase shifts."], "jumps": ["P2330", "P2300"]}, {"id": "P2330", "text": ["8.  Set the oscilloscope to dual trace. \n  9.  Connect the CH2 probe to TP7 on PC130-229.  This is the                phase 2 output. \n10.  Adjust the position of the two traces so that the 0 volt line for          each signal is the same.", "8. Set the oscilloscope to dual trace. 9. Connect the CH2 probe to TP7 on PC130-229. This is the phase 2 output. 10. Adjust the position of the two traces so that the 0 volt line for each signal is the same."], "jumps": ["P2340", "P2300", "P2335"]}, {"id": "P2335", "text": ["OSCILLOSCOPE SETUP- Set oscilloscope for dual trace. Adjust the position of the two traces so that the 0 volt line is the same."], "jumps": []}, {"id": "P2340", "text": ["11.  Adjust the phase (R12) and the gain (R14) so that a negative           to positive transition occurs on the second division from the          left as shown at 4 Vpp.", "This step requires fine tuning of both potentiometers. Adjust one slightly then adjust the other. age dropped. This is due to the generator card not being aligned. The output voltage will return to 9 volts once the card is aligned.", "11. Adjust the phase (R12) and the gain (R14) so that a negative to positive transition occurs on the second division from the left as shown at 4 Vpp. NOTE: This step requires fine tuning of both potentiometers. Adjust one slightly then adjust the other."], "jumps": ["P2360", "P2330"]}, {"id": "P2360", "text": ["12.  Move the CH2 probe to TP8 on PC130-229.  This is the Phase         3 output.", "12. Move the CH2 probe to TP8 on PC130-229. This is the Phase 3 output."], "jumps": ["P2370", "P2340"]}, {"id": "P2370", "text": ["13.  Adjust the phase (R22) and the gain (R24) so that a negative           to positive transition occurs on the fourth division from the            left as shown at 4 Vpp.", "13. Adjust the phase (R22) and the gain (R24) so that a negative to positive transition occurs on the fourth division from the left as shown at 4 Vpp. TE: This step requires fine tuning of both potentiometers. Adjust one slightly then adjust the other."], "jumps": ["P2390", "P2340"]}, {"id": "P2390", "text": ["14.  Remove the oscilloscope probes.  The three phase 400 Hz             generator is now set up and suppling the three phases to the        power supply.  Let's now set up the power supply.", "14. Remove the oscilloscope probes. The three phase 400 Hz generator is now set up and suppling the three phases to the power supply. Let's now set up the power supply."], "jumps": ["P2370"]}, {"id": "P2400", "text": ["1.  Use the multimeter set for DC voltage measurements and                measure the voltage at TP11 output on PC130-230.                      2.  Adjust R3, (`V' OUT) for a 5.00 volt reading, \u00b11% or from \n     4.95 to 5.05 volts.", "1. Use the multimeter set for DC voltage measurements and measure the voltage at TP11 output on PC130-230. 2. Adjust R3, (`V' OUT) for a 5.00 volt reading,"], "jumps": ["P2410", "P2390"]}, {"id": "P2410", "text": ["That's it!  The power supply was adjusted for a 5.00 volt output with one control.  The current protection circuit has little effect now because there is no load on the circuit.", "That's it! The power supply was adjusted for a 5.00 volt output with one control. The current protection circuit has little effect now because there is no load on the circuit."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["Now, let's measure signals in the power supply circuit.", "Now, let's measure signals in the power supply circuit....."], "jumps": ["P2430", "P2400"]}, {"id": "P2430", "text": ["1.  Using the oscilloscope measure the AC input signals from the       three phase generator on PC130-230 at TP's 1, 4 and 7.", "1. Using the oscilloscope measure the AC input signals from the three phase generator on PC130-230 at TP's 1, 4 and 7."], "jumps": ["P2440", "P2420"]}, {"id": "P2440", "text": ["2.  Using the oscilloscope measure the AC output signals from            the transformers on PC130-230 at TP's 2, 5 and 8.", "2. Using the oscilloscope measure the AC output signals from the transformers on PC130-230 at TP's 2, 5 and 8."], "jumps": ["P2450", "P2420"]}, {"id": "P2450", "text": ["Comparing the AC input voltage to T1, T2, and T3 with the output voltages, what type of transformers are used?"], "jumps": ["P2420", "P2455"]}, {"id": "P2451", "text": [], "jumps": []}, {"id": "P2452", "text": ["If 1 to 1 transformers are used, the input and output voltages would have been the same.  You should have noticed that the output voltages were higher.", "If 1 to 1 transformers are used, the input and output voltages would have been the same. You should have noticed that the output voltages were higher.."], "jumps": []}, {"id": "P2453", "text": ["If step down transformers are used, the output voltages would have been less than the input voltages.  You should have noticed that the output voltages were higher.", "If step down transformers are used, the output voltages would have been less than the input voltages. You should have noticed that the output voltages were higher...."], "jumps": []}, {"id": "P2455", "text": ["EXPERIMENT CARD PC130-230 - Compare the AC input to the AC output.  Compare TP1 to TP2, TP4 to TP5, and TP7 to TP8.", "EXPERIMENT CARD PC130-230 - Compare the AC input to the AC output. Compare TP1 to TP2, TP4 to TP5, and TP7 to TP8."], "jumps": []}, {"id": "P2460", "text": ["3.  Using the oscilloscope to measure DC, measure the signal at         TP10 PC130-230.  It may be necessary to change the                         oscilloscope coupling to AC and decrease the Volt/Div.                    control.", "3. Using the oscilloscope to measure DC, measure the signal at TP10 PC130-230. It may be necessary to change the oscilloscope coupling to AC and decrease the Volt/Div. control."], "jumps": ["P2480", "P2450"]}, {"id": "P2480", "text": ["You are viewing the AC component of the DC output from the rectifier and filter, what is it called?"], "jumps": ["P2460"]}, {"id": "P2481", "text": [], "jumps": []}, {"id": "P2482", "text": ["Regulation is the act of maintaining a constant output voltage for changing loads."], "jumps": []}, {"id": "P2483", "text": ["Rectification is the act of changing AC to pulsating DC.", "Rectification is the act of changing AC to pulsating DC...."], "jumps": []}, {"id": "P2490", "text": ["What you saw was the three phase AC changed to pulsating DC in the rectifier and then smoothed by the filter.  However, some ripple still remained.", "What you saw was the three phase AC changed to pulsating DC in the rectifier and then smoothed by the filter. However, some ripple still remained."], "jumps": ["P2500", "P2480"]}, {"id": "P2500", "text": ["5.  Place S1 to DOWN on PC130-230 and now observe the ripple. 6.  Make sure the oscilloscope coupling is set to DC and observe       the output voltage.", "5. Place S1 to DOWN on PC130-230 and now observe the ripple. 6. Make sure the oscilloscope coupling is set to DC and observe the output voltage."], "jumps": ["P2510", "P2490"]}, {"id": "P2510", "text": ["You should have seen that the ripple increased and that the DC voltage level decreased.  Placing S1 to DOWN removed phase 1 from the circuit.  As you saw, three phase power produces more DC than two phase (or one phase) power.", "You should have seen that the ripple increased and that the DC voltage level decreased. Placing S1 to DOWN removed phase 1 from the circuit. As you saw, three phase power produces more DC than two phase (or one phase) power."], "jumps": ["P2520", "P2490"]}, {"id": "P2520", "text": ["7.  Place PC130-230 S1 back UP. \n8.  Measure the DC output voltage on PC130-230 TP11 using               multimeter.   \n9.  While observing the DC voltage, place PC130-290 S4 to UP            and rotate PC130-290 R1 clockwise and counterclockwise.", "7. Place PC130-230 S1 back UP. 8. Measure the DC output voltage on PC130-230 TP11 using multimeter. 9. While observing the DC voltage, place PC130-290 S4 to UP and rotate PC130-290 R1 clockwise and counterclockwise."], "jumps": ["P2530", "P2510", "P2525"]}, {"id": "P2525", "text": ["EXPERIMENT CARD PC130-290 - S4 to UP Rotate R1 CW and CCW."], "jumps": []}, {"id": "P2530", "text": ["What was your observation concerning the output voltage of the power supply circuit?", "output voltage remained constant, within about 0.05 of 5.00 volts."], "jumps": ["P2520"]}, {"id": "P2531", "text": [], "jumps": []}, {"id": "P2532", "text": ["You should have seen that the output stayed fairly constant.  If the output voltage did change considerably, see your instructor.", "You should have seen that the output stayed fairly constant. If the output voltage did change considerably, see your instructor."], "jumps": []}, {"id": "P2540", "text": ["10.  Place PC130-290 S4 to DOWN and ensure the output voltage          is 5 V.  The computer will disable the voltage regulator when          you continue to the next page.", "10. Place PC130-290 S4 to DOWN and ensure the output voltage is 5 V. The computer will disable the voltage regulator when you continue to the next page."], "jumps": ["P2530"]}, {"id": "P2550", "text": ["11.  Measure the DC output voltage on PC130-230 TP11 using               the multimeter. \n12.  While observing the DC voltage, place PC130-290 S4 to UP             and rotate PC130-290 R1 clockwise and counterclockwise.", "11. Measure the DC output voltage on PC130-230 TP11 using the multimeter. 12. While observing the DC voltage, place PC130-290 S4 to UP and rotate PC130-290 R1 clockwise and counterclockwise."], "jumps": ["P2560", "P2540"]}, {"id": "P2560", "text": ["What was your observation concerning the output voltage of the power supply circuit?", "output voltage remained constant, within about 0.05 of 5.00 volts.", "output voltage decreased more than 0.1 volts."], "jumps": ["P2550"]}, {"id": "P2561", "text": [], "jumps": []}, {"id": "P2562", "text": ["You should have seen that the output dropped to around \n4.7 volts and varied as the load was changed.  The output voltage did not remain fairly constant.", "You should have seen that the output dropped to around 4.7 volts and varied as the load was changed. The output voltage did not remain fairly constant......"], "jumps": []}, {"id": "P2570", "text": ["What you have seen was the action of the voltage regulator. When the regulator was operating, changing loads had little effect but, when the regulator was not operating, changes in the load affected the the output voltage.  The computer will enable the voltage regulator when you continue to the next page.", "What you have seen was the action of the voltage regulator. When the regulator was operating, changing loads had little effect but, when the regulator was not operating, changes in the load affected the the output voltage. The computer will enable the voltage regulator when you continue to the next page."], "jumps": ["P2560"]}, {"id": "P2580", "text": ["Now let's look at the action of U1 which controls the conduction of Q2, which compensates the output voltage for changes in the load."], "jumps": ["P2590", "P2570"]}, {"id": "P2590", "text": ["13.  Using the multimeter or oscilloscope, measure the DC                      voltage on PC130-230 TP12.", "13. Using the multimeter or oscilloscope, measure the DC voltage on PC130-230 TP12."], "jumps": ["P2600", "P2570"]}, {"id": "P2600", "text": ["14.  Place or ensure that PC130-290 S4 is UP. \n15.  While observing the DC voltage, vary PC130-290 R1.                         Note if the output voltage on TP12 increases or decreases              when the load is increased, R1 rotated clockwise or in the               INCREASE direction as indicated on the PC130-290 card.", "14. Place or ensure that PC130-290 S4 is UP. 15. While observing the DC voltage, vary PC130-290 R1. Note if the output voltage on TP12 increases or decreases when the load is increased, R1 rotated clockwise or in the INCREASE direction as indicated on the PC130-290 card."], "jumps": ["P2610", "P2570"]}, {"id": "P2610", "text": ["When the load on the power supplied increases, PC130-290 R1 rotated clockwise, what happens to the voltage that is supplied to Q2?"], "jumps": ["P2600"]}, {"id": "P2611", "text": [], "jumps": []}, {"id": "P2612", "text": ["When the load increases, the control voltage to Q2 should not decrease, check your measurements."], "jumps": []}, {"id": "P2613", "text": ["When the load increases, the control voltage to Q2 should not remain the same, check your measurements."], "jumps": []}, {"id": "P2620", "text": ["What you have seen is an increase in load which tends to decrease the output voltage of the power supply.  The control voltage to the base of Q2 increases, placing the output voltage back to normal.", "What you have seen is an increase in load which tends to decrease the output voltage of the power supply. The control voltage to the base of Q2 increases, placing the output voltage back to normal."], "jumps": ["P2630", "P2610"]}, {"id": "P2630", "text": ["16.  While observing the voltage on TP12, vary R3 on PC130-230.", "16. While observing the voltage on TP12, vary R3 on PC130-230."], "jumps": ["P2640", "P2620"]}, {"id": "P2640", "text": ["What you saw was the voltage applied to the base of Q2 change as PC130-230 R3 was varied.  R3 is used to set the output voltage level by setting up the initial conduction of Q2.", "What you saw was the voltage applied to the base of Q2 change as PC130-230 R3 was varied. R3 is used to set the output voltage level by setting up the initial conduction of Q2."], "jumps": ["P2650", "P2620"]}, {"id": "P2650", "text": ["Finally, let's look at the current protection circuit."], "jumps": ["P2660", "P2620"]}, {"id": "P2660", "text": ["17.  Place PC130-290 S4 down removing the load. \n18.  Measure the output voltage on TP11 and adjust PC130-230            R3 for a  5 volt output.", "17. Place PC130-290 S4 down removing the load. 18. Measure the output voltage on TP11 and adjust PC130-230 R3 for a 5 volt output."], "jumps": ["P2670", "P2620"]}, {"id": "P2670", "text": ["19.  While observing the output voltage, vary the current                          protection control, PC130-230, R5.", "19. While observing the output voltage, vary the current protection control, PC130-230, R5."], "jumps": ["P2680", "P2660"]}, {"id": "P2680", "text": ["You should have viewed very little change in the output voltage, with no load, the current draw is not excessive."], "jumps": ["P2690", "P2670"]}, {"id": "P2690", "text": ["20.  On PC130-290, place S4 and S5 to UP. \n21.  While observing the output voltage with the multimeter, vary           PC130-290, R1.", "20. On PC130-290, place S4 and S5 to UP. 21. While observing the output voltage with the multimeter, vary PC130-290, R1."], "jumps": ["P2700", "P2680"]}, {"id": "P2700", "text": ["You should have seen the voltage decrease.  What's happening is that the load causes excessive current and Q1 is turned ON.", "You should have seen the voltage decrease. What's happening is that the load causes excessive current and Q1 is turned ON."], "jumps": ["P2710", "P2690"]}, {"id": "P2710", "text": ["This action turns Q2 off stopping the current flow.  As the current flow now decreases, Q1 turns off and Q2 turns back on.  The process goes on and on.", "This action turns Q2 off stopping the current flow. As the current flow now decreases, Q1 turns off and Q2 turns back on. The process goes on and on."], "jumps": ["P2720", "P2700"]}, {"id": "P2720", "text": ["In other words, the output voltage is decreased to keep the output current at a safe level by turning Q2 on and off."], "jumps": ["P2730", "P2700"]}, {"id": "P2730", "text": ["Now that you have seen normal operation, let's troubleshoot a typical fault in the power supply."], "jumps": ["P2740", "P2700"]}, {"id": "P2740", "text": ["First, set the power supply for normal operation. 1. Remove the load by ensuring S4 and S5 on PC130-290 are DOWN. 2. Measure the output voltage on PC130-230 TP11 and adjust R3 for a 5 volt output. Second, ensure the circuit is working correctly."], "jumps": ["P2750", "P2730"]}, {"id": "P2750", "text": ["3. Check the output voltage of the power supply under no load conditions by measuring for 5 volt output, on PC130-230, TP11. 4. Check the voltage regulation by placing S4 on PC130-290 to UP and varying R1. Ensure the output voltage remains constant on PC130-230, TP11. -230, TP11."], "jumps": ["P2760", "P2740"]}, {"id": "P2760", "text": ["Now that you are sure the power supply circuit is operating correctly, the computer will insert a fault.", "Now that you are sure the power supply circuit is operating correctly, the computer will insert a fault. eaker switch to ON........................................."], "jumps": ["P2750"]}, {"id": "P2770", "text": ["Test the Circuit \n1.  Remove the load, S4 on PC130-290 to DOWN, and verify the           output is 5 volts, on PC130-230, TP11. \n2.  Place a load on the circuit, S4 on PC130-290 to UP, and verify        output voltage remains close to 5 volts, on PC130-230, TP11.", "Test the Circuit 1. Remove the load, S4 on PC130-290 to DOWN, and verify the output is 5 volts, on PC130-230, TP11. 2. Place a load on the circuit, S4 on PC130-290 to UP, and verify output voltage remains close to 5 volts, on PC130-230, TP11."], "jumps": ["P2780", "P2760"]}, {"id": "P2780", "text": ["Is the power supply maintaining a 5 volt output when unloaded and loaded?"], "jumps": ["P2770"]}, {"id": "P2781", "text": [], "jumps": []}, {"id": "P2782", "text": ["With the fault inserted, the output voltage is greater than 5 volts unloaded and has large changes when a load is applied."], "jumps": []}, {"id": "P2790", "text": ["Now that you know the circuit is faulted, you must determine if the fault is in the rectifier, filter or the voltage regulator."], "jumps": ["P2800", "P2780"]}, {"id": "P2800", "text": ["Determining the Faulted Section 3. Measure the voltage on PC130-230, TP10. TP10 is the output of the rectifier or filter. If the voltage is below 5 volts, not present, or has a large ripple, the fault is in the rectifier or filter. If the voltage is above 5 volts with little ripple, the fault is in the voltage regulator."], "jumps": ["P2810", "P2790"]}, {"id": "P2810", "text": ["Is the fault in the rectifier, filter or voltage regulator?"], "jumps": ["P2800"]}, {"id": "P2811", "text": [], "jumps": []}, {"id": "P2812", "text": ["You should have measured greater than 5 volts with little ripple on PC130-230, TP10.  This means the rectifier/filter is producing a voltage large enough for the regulator to operate correctly.", "You should have measured greater than 5 volts with little ripple on PC130-230, TP10. This means the rectifier/filter is producing a voltage large enough for the regulator to operate correctly........"], "jumps": []}, {"id": "P2820", "text": ["Now you must isolate the fault to either U1 or the Q1 and Q2 circuit."], "jumps": ["P2830", "P2810"]}, {"id": "P2830", "text": ["4.  Measure the voltage on PC130-230, TP12 and vary PC130-230,      R3.  TP12 is the output of U1 which controls the regulator Q2.        If U1's output voltage can be varied, the fault is probably in Q1       or Q2.  If U1's output voltage can not be varied, the fault is               probably in U1 or its inputs.", "4. Measure the voltage on PC130-230, TP12 and vary PC130-230, R3. TP12 is the output of U1 which controls the regulator Q2. If U1's output voltage can be varied, the fault is probably in Q1 or Q2. If U1's output voltage can not be varied, the fault is probably in U1 or its inputs."], "jumps": ["P2840", "P2820"]}, {"id": "P2840", "text": ["Is the fault in U1 or Q1, Q2?", "Is the fault in U1 or Q1, Q2?yped.........................."], "jumps": ["P2820"]}, {"id": "P2841", "text": [], "jumps": []}, {"id": "P2842", "text": ["You should have seen that varying R3 had no effect on the output of U1, TP12.  This means the voltage regulator, Q2, will not operate even if not faulted.", "You should have seen that varying R3 had no effect on the output of U1, TP12. This means the voltage regulator, Q2, will not operate even if not faulted......."], "jumps": []}, {"id": "P2850", "text": ["You have isolated the fault to U1.  The negative input of U1 has a constant ground applied.", "You have isolated the fault to U1. The negative input of U1 has a constant ground applied."], "jumps": ["P2860", "P2840"]}, {"id": "P2860", "text": ["With the negative input at zero, the difference between the positive input is always maximum.  This produces a maximum output to the base of Q2.", "With the negative input at zero, the difference between the positive input is always maximum. This produces a maximum output to the base of Q2."], "jumps": ["P2870", "P2850"]}, {"id": "P2870", "text": ["With the maximum voltage applied to the base of Q2, Q2 conducts fully.  This is why the no load output voltage was around 12 volts with no regulation when a load was applied.", "With the maximum voltage applied to the base of Q2, Q2 conducts fully. This is why the no load output voltage was around 12 volts with no regulation when a load was applied."], "jumps": ["P2880", "P2850"]}, {"id": "P2880", "text": ["The computer will now remove the fault.", "The computer will now remove the fault.ault. the PC1 DC switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2850"]}, {"id": "P2890", "text": ["5. Remove the load, PC130-290, S4 DOWN, measure the DC voltage on TP11 of PC130-230 - output, and adjust R3 on PC130-230 for 5 volt output. 6. Place PC130-290, S4 to UP and vary the load, R1 on PC130-290. You should see that the power supply is back in operation. ration."], "jumps": ["P2880"]}, {"id": "P2900", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": ["P2890"]}, {"id": "P2902", "text": ["2.  Place CONSOLE POWER to OFF.", "2. Place CONSOLE POWER to OFF.h to OFF...................."], "jumps": ["P2900"]}, {"id": "P2903", "text": ["3.  Disconnect all test equipment. \n4.  Remove all PC cards.  \n5.  Return all equipment to the designated storage area.", "3. Disconnect all test equipment. 4. Remove all PC cards. 5. Return all equipment to the designated storage area."], "jumps": ["P2910", "P2902"]}, {"id": "P2910", "text": ["This completes the experiment on THREE PHASE POWER GENERATION."], "jumps": ["P2001", "P2903"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["In any power supply, which block changes AC power to pulsating DC power?"], "jumps": []}, {"id": "P10211", "text": ["In any power supply, which block changes pulsating DC to pure DC?"], "jumps": []}, {"id": "P10212", "text": ["In any power supply, which block maintains a constant output voltage?"], "jumps": []}, {"id": "P10213", "text": ["In any power supply, which block generates one, two or three phase power?"], "jumps": []}, {"id": "P10214", "text": ["In any power supply, which block may contain an overcurrent protection circuit?"], "jumps": []}, {"id": "P10215", "text": ["What is the advantage of using three phase 400 Hz power?"], "jumps": []}, {"id": "P10216", "text": ["In this rectifier, which components rectify the phase two input? evator/Stabilator"], "jumps": []}, {"id": "P10217", "text": ["In this three phase filter, why can a small value capacitor be used alone?", "less ripple in one phase power regulator"], "jumps": []}, {"id": "P10218", "text": [], "jumps": []}, {"id": "P10219", "text": [], "jumps": []}, {"id": "P10220", "text": ["In the experiment, the three phases from the generator card were how many degrees displaced?"], "jumps": []}, {"id": "P10221", "text": ["In the experiment, what type of transformers were used in the rectifier?"], "jumps": []}, {"id": "P10222", "text": ["In the experiment, you removed one phase of the three phase input. What happened to the pulsating DC output?", "In the experiment, R3 in the regulator circuit did what?", "determined the amount of conduction for Q2", "determined the amount of output signal that is fed to U1"], "jumps": []}, {"id": "P10224", "text": ["In the experiment, R5 in the regulator circuit did what?", "Determined the amount of conduction for Q2", "Determined the amount of output signal that is fed to U1"], "jumps": []}, {"id": "P10225", "text": ["In the experiment, U1 in the regulator circuit did what?", "Determined the amount of output signal that is fed to U1", "Determined the amount of conduction for Q2"], "jumps": []}, {"id": "P10226", "text": ["In the experiment, what happened to the conduction of Q2 if the output voltage increased?"], "jumps": []}, {"id": "P10227", "text": ["In the experiment, what happened to Q2 if the current flow became excessive?", "Turned ON and OFF to lower the output voltage", "Turned ON and OFF to raise the output voltage"], "jumps": []}, {"id": "P10228", "text": ["What is the probable fault if the input to the regulator/current protection circuit of the regulator measured 0 volts?"], "jumps": []}, {"id": "P10229", "text": ["What is the probable fault if the output of the power supply is good under no load conditions but drops off when a load is applied?"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to _________"], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P13020", "text": ["In this experiment, you will study the operation of and troubleshoot a three phase 400 Hz power supply."], "jumps": ["P13030", "P2001"]}, {"id": "P13030", "text": ["The three phase 400 Hz power supply, PC130-230, is supported by two other cards that will be located in PC1 and PC3 positions."], "jumps": ["P13040", "P13020"]}, {"id": "P13040", "text": ["The PC130-290 card is the Load card."], "jumps": ["P13050", "P13030"]}, {"id": "P13050", "text": ["It is used to verify correct operation of the voltage regulator on PC130-230.  This is accomplished by applying different loads using the PC130-290 card.", "It is used to verify correct operation of the voltage regulator on PC130-230. This is accomplished by applying different loads using the PC130-290 card."], "jumps": ["P13060", "P13030"]}, {"id": "P13060", "text": ["The switches along the top portion of the card are used to apply different fixed loads and R1 is used to vary the load."], "jumps": ["P13070", "P13050"]}, {"id": "P13070", "text": ["The PC130-229 card is an electronic Three Phase Generator.", "The PC130-229 card is an electronic Three Phase Generator.."], "jumps": ["P13080", "P13050"]}, {"id": "P13080", "text": ["It is used in place of a mechanical three phase alternator or generator to produce the three phase 400 Hz power."], "jumps": ["P13090", "P13070"]}, {"id": "P13090", "text": ["You will adjust the potentiometers on the card to produce a clean three phase 400 Hz output."], "jumps": ["P13100", "P13070"]}, {"id": "P13100", "text": ["Basically, U1 produces a sine wave output that is split to drive three power amplifiers that have 120 degree phase differences."], "jumps": ["P13110", "P13070"]}, {"id": "P13110", "text": ["The three devices on top of the card are connected to a heat sink.  U4, U5 and U6 are power amplifiers and will become hot and will burn you if touched.", "The three devices on top of the card are connected to a heat sink. U4, U5 and U6 are power amplifiers and will become hot and will burn you if touched."], "jumps": ["P13120", "P13070"]}, {"id": "P13120", "text": ["Finally, PC130-230 is the Power Supply.", "Finally, PC130-230 is the Power Supply....................."], "jumps": ["P13130", "P13070"]}, {"id": "P13130", "text": ["It is the circuit that you studied in the theory portion of the lesson with the addition of test points and test console connector    pins.", "It is the circuit that you studied in the theory portion of the lesson with the addition of test points and test console connector pins."], "jumps": ["P13140", "P13120"]}, {"id": "P13140", "text": ["You will set up, measure signals and troubleshoot the circuit."], "jumps": ["P13160", "P13120"]}, {"id": "P13160", "text": [], "jumps": ["P13170", "P13120"]}, {"id": "P13170", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13120"]}, {"id": "P13180", "text": ["2.  Place PC130-229 into the PC1 position. \n3.  Set S1 to HIGH and S2 to ALL.\n4.  Set all potentiometers to mid position.", "2. Place PC130-229 into the PC1 position. 3. Set S1 to HIGH and S2 to ALL. 4. Set all potentiometers to mid position."], "jumps": ["P13190"]}, {"id": "P13190", "text": ["5.  Place PC130-230 into the PC2 position. \n6.  Set S1, S2 and S3 to UP.\n7.  Set R3 and R5 to mid position.", "5. Place PC130-230 into the PC2 position. 6. Set S1, S2 and S3 to UP. 7. Set R3 and R5 to mid position."], "jumps": ["P13200", "P13180"]}, {"id": "P13200", "text": ["8.  Place PC130-290 into the PC3 position. \n9.  Set S1 to E, S2 to POS, S3 to the left and S4 through S9 \n      to DOWN.", "8. Place PC130-290 into the PC3 position. 9. Set S1 to E, S2 to POS, S3 to the left and S4 through S9 to DOWN."], "jumps": ["P13210", "P13190"]}, {"id": "P13210", "text": ["10.  Press Enter to Set: Positive Supply Voltage - 12 \n                                            Negative Supply Voltage - 12", "10. Press Enter to Set: Positive Supply Voltage - 12 Negative Supply Voltage - 12"], "jumps": ["P13200"]}, {"id": "P13220", "text": ["The circuits are now set up on the test console. You will align the generator card first.", "The circuits are now set up on the test console. You will align the generator card first. raphics Text) NOTE When the power is applied to the generator card, PC130-229, the VOLTMETER on the Test Console may indicate that the Test Console's output voltage dropped. This is due to the generator card not being aligned. The output voltage will", "When the power is applied to the generator card, PC130-229, the VOLTMETER on the Test Console may indicate that the Test Console's output voltage dropped. This is due to the generator card not being aligned. The output voltage will return to 12 volts once the card is aligned."], "jumps": ["P13240"]}, {"id": "P13240", "text": ["1.  Press Enter to Set: PC1 DC Power Switch - ON", "1. Press Enter to Set: PC1 DC Power Switch - ON..........................."], "jumps": ["P13220"]}, {"id": "P13250", "text": ["2.  Using the oscilloscope set to measure AC voltage, connect             the CH1 probe to TP6 on PC130-229.  This is the phase 1                 output.  You will see a large distorted signal.  Use a Time/Div          setting of 0.5 msec and a Volt/Div setting of 1.", "2. Using the oscilloscope set to measure AC voltage, connect the CH1 probe to TP6 on PC130-229. This is the phase 1 output. You will see a large distorted signal. Use a Time/Div setting of 0.5 msec and a Volt/Div setting of 1."], "jumps": ["P13260"]}, {"id": "P13260", "text": ["3.  On PC130-229 adjust the gain control (R6) and the distortion          control (R3) for a clean symmetrical sinewave at 4 Vpp.", "3. On PC130-229 adjust the gain control (R6) and the distortion control (R3) for a clean symmetrical sinewave at 4 Vpp."], "jumps": ["P13270", "P13250"]}, {"id": "P13270", "text": ["The test console output voltage should be back to 12 volts.  If not see your instructor.", "The test console output voltage should be back to 12 volts. If not see your instructor."], "jumps": ["P13280", "P13250"]}, {"id": "P13280", "text": ["4.  Using the oscilloscope, or frequency counter adjust the                   frequency control (R2 Freq.), for an output of 400 Hz.  When           using the oscilloscope, the time for one complete cycle is \n      2.5 msec (1/\u0083, 1/400 Hz) or 5 horizontal divisions at a                         Time/Div setting of  0.5 msec.", "4. Using the oscilloscope, or frequency counter adjust the frequency control (R2 Freq.), for an output of 400 Hz. When using the oscilloscope, the time for one complete cycle is 2.5 msec (1/", ", 1/400 Hz) or 5 horizontal divisions at a Time/Div setting of 0.5 msec."], "jumps": ["P13290", "P13270"]}, {"id": "P13290", "text": ["5.  Re-adjust R3 (distortion), R2 (frequency) and R6 (gain), if                 needed, to ensure a symmetrical smooth 400 Hz output at \n     4 Vpp.  Phase 1 or the reference phase is now adjusted.", "5. Re-adjust R3 (distortion), R2 (frequency) and R6 (gain), if needed, to ensure a symmetrical smooth 400 Hz output at 4 Vpp. Phase 1 or the reference phase is now adjusted."], "jumps": ["P13300", "P13280"]}, {"id": "P13300", "text": ["6.  Place the Time/Div control to 0.2 msec. \n7.  Adjust the Time/Div Variable control so that one cycle of the           400 Hz signal equals exactly 6 cm or 6 major divisions as                shown.", "6. Place the Time/Div control to 0.2 msec. 7. Adjust the Time/Div Variable control so that one cycle of the 400 Hz signal equals exactly 6 cm or 6 major divisions as shown..."], "jumps": ["P13310", "P13280"]}, {"id": "P13310", "text": ["This set up makes each cm or major division equal to 60 degrees."], "jumps": ["P13320", "P13300"]}, {"id": "P13320", "text": ["Since each division is 60 degrees, making adjustments for\n120 degree phase differences is easy, two divisions for \n120 degree phase shifts and four divisions for 240 degree \nphase shifts.", "Since each division is 60 degrees, making adjustments for 120 degree phase differences is easy, two divisions for 120 degree phase shifts and four divisions for 240 degree phase shifts."], "jumps": ["P13330", "P13300"]}, {"id": "P13330", "text": ["8.  Set the oscilloscope to dual trace. \n  9.  Connect the CH2 probe to TP7 on PC130-229.  This is the                phase 2 output.\n10.  Adjust the position of the two traces so that the 0 volt line for         each signal is the same.", "8. Set the oscilloscope to dual trace. 9. Connect the CH2 probe to TP7 on PC130-229. This is the phase 2 output. 10. Adjust the position of the two traces so that the 0 volt line for each signal is the same."], "jumps": ["P13340", "P13300", "P13335"]}, {"id": "P13335", "text": ["OSCILLOSCOPE - Set oscilloscope for dual trace. Adjust the position of the two traces so that the 0 volt line is the same."], "jumps": []}, {"id": "P13340", "text": ["11. Adjust the phase (R12) and the gain (R14) so that a negative to positive transition occurs on the second division from the left as shown at 4 Vpp. TE: This step requires fine tuning of both potentiometers. Adjust one slightly then adjust the other.", "This step requires fine tuning of both potentiometers. Adjust one slightly then adjust the other. age dropped. This is due to the generator card not being aligned. The output voltage will return to 9 volts once the card is aligned."], "jumps": ["P13360", "P13330"]}, {"id": "P13360", "text": ["12.  Move the CH2 probe to TP8 on PC130-229.  This is the \n        Phase 3 output.", "12. Move the CH2 probe to TP8 on PC130-229. This is the Phase 3 output."], "jumps": ["P13370", "P13340"]}, {"id": "P13370", "text": ["13.  Adjust the phase (R22) and the gain (R24) so that a negative           to positive transition occurs on the fourth division from the            left as shown at 4 Vpp.", "13. Adjust the phase (R22) and the gain (R24) so that a negative to positive transition occurs on the fourth division from the left as shown at 4 Vpp. TE: This step requires fine tuning of both potentiometers. Adjust one slightly then adjust the other."], "jumps": ["P13390", "P13340"]}, {"id": "P13390", "text": ["14.  Remove the oscilloscope probes.  The three phase 400 Hz             generator is now set up and suppling the three phases to the        power supply.  Let's now set up the power supply.", "14. Remove the oscilloscope probes. The three phase 400 Hz generator is now set up and suppling the three phases to the power supply. Let's now set up the power supply."], "jumps": ["P13400", "P13370"]}, {"id": "P13400", "text": ["1.  Use the multimeter set for DC voltage measurements and               measure the voltage at TP11 output on PC130-230.                      2.  Adjust R3, (`V' OUT) for a 5.00 volt reading, 1% or from 4.95 to        5.05 volts.", "1. Use the multimeter set for DC voltage measurements and measure the voltage at TP11 output on PC130-230. 2. Adjust R3, (`V' OUT) for a 5.00 volt reading, 1% or from 4.95 to 5.05 volts."], "jumps": ["P13410", "P13390"]}, {"id": "P13410", "text": ["That's it!  The power supply was adjusted for a 5.00 volt output with one control.  The current protection circuit has little effect now because there is no load on the circuit.", "That's it! The power supply was adjusted for a 5.00 volt output with one control. The current protection circuit has little effect now because there is no load on the circuit."], "jumps": ["P13420", "P13400"]}, {"id": "P13420", "text": ["Now, let's measure signals in the power supply circuit.", "Now, let's measure signals in the power supply circuit....."], "jumps": ["P13430", "P13400"]}, {"id": "P13430", "text": ["1.  Using the oscilloscope measure the AC input signals from the       three phase generator on PC130-230 at TP's 1, 4 and 7.", "1. Using the oscilloscope measure the AC input signals from the three phase generator on PC130-230 at TP's 1, 4 and 7."], "jumps": ["P13440", "P13420"]}, {"id": "P13440", "text": ["2.  Using the oscilloscope measure the AC output signals from            the transformers on PC130-230 at TP's 2, 5 and 8.", "2. Using the oscilloscope measure the AC output signals from the transformers on PC130-230 at TP's 2, 5 and 8."], "jumps": ["P13450", "P13420"]}, {"id": "P13450", "text": ["Comparing the AC input voltage to T1, T2, and T3 with the output voltages, what type of transformers are used?"], "jumps": ["P13420"]}, {"id": "P13451", "text": [], "jumps": []}, {"id": "P13452", "text": ["If 1 to 1 transformers are used, the input and output voltages would have been the same.  You should have noticed that the output voltages were higher.", "If 1 to 1 transformers are used, the input and output voltages would have been the same. You should have noticed that the output voltages were higher..."], "jumps": []}, {"id": "P13453", "text": ["If step down transformers are used, the output voltages would have been less than the input voltages.  You should have noticed that the output voltages were higher.", "If step down transformers are used, the output voltages would have been less than the input voltages. You should have noticed that the output voltages were higher...."], "jumps": []}, {"id": "P13455", "text": ["EXPERIMENT CARD PC130-230 - Compare the AC input to the AC output. Compare TP1 to TP2, TP4 to TP5, and
