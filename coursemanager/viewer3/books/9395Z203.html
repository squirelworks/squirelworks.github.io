 TP7 to TP8."], "jumps": []}, {"id": "P13460", "text": ["3.  Using the oscilloscope to measure DC, measure the signal at        TP10 PC130-230.  It may be necessary to change the                         oscilloscope coupling to AC and decrease the Volt/Div                     control.", "3. Using the oscilloscope to measure DC, measure the signal at TP10 PC130-230. It may be necessary to change the oscilloscope coupling to AC and decrease the Volt/Div control."], "jumps": ["P13480", "P13450"]}, {"id": "P13480", "text": ["You are viewing the AC component of the DC output from the rectifier and filter, what is it called?"], "jumps": ["P13460"]}, {"id": "P13481", "text": [], "jumps": []}, {"id": "P13482", "text": ["Regulation is the act of maintaining a constant output voltage for changing loads."], "jumps": ["P13480"]}, {"id": "P13483", "text": ["Rectification is the act of changing AC to pulsating DC.", "Rectification is the act of changing AC to pulsating DC...."], "jumps": []}, {"id": "P13490", "text": ["What you saw was the three phase AC changed to pulsating DC in the rectifier and then smoothed by the filter.  However, some ripple still remained.", "What you saw was the three phase AC changed to pulsating DC in the rectifier and then smoothed by the filter. However, some ripple still remained."], "jumps": ["P13500", "P13480"]}, {"id": "P13500", "text": ["5.  Place S1 to DOWN on PC130-230 and now observe the ripple. 6.  Make sure the oscilloscope coupling is set to DC and observe      the output voltage.", "5. Place S1 to DOWN on PC130-230 and now observe the ripple. 6. Make sure the oscilloscope coupling is set to DC and observe the output voltage."], "jumps": ["P13510", "P13490"]}, {"id": "P13510", "text": ["You should have seen that the ripple increased and that the DC voltage level decreased.  Placing S1 to DOWN removed phase 1 from the   the circuit.  As you saw, three phase power produces more DC than two phase (or one phase) power.", "You should have seen that the ripple increased and that the DC voltage level decreased. Placing S1 to DOWN removed phase 1 from the the circuit. As you saw, three phase power produces more DC than two phase (or one phase) power."], "jumps": ["P13520", "P13490"]}, {"id": "P13520", "text": ["7.  Place PC130-230 S1 back UP. \n8.  Measure the DC output voltage on PC130-230 TP11 using               multimeter. \n9.  While observing the DC voltage, place PC130-290 S4 to UP            and rotate PC130-290 R1 clockwise and counterclockwise.", "7. Place PC130-230 S1 back UP. 8. Measure the DC output voltage on PC130-230 TP11 using multimeter. 9. While observing the DC voltage, place PC130-290 S4 to UP and rotate PC130-290 R1 clockwise and counterclockwise."], "jumps": ["P13530", "P13510", "P13525"]}, {"id": "P13525", "text": ["EXPERIMENT CARD PC130-290 - S4 to UP Rotate R1 CW and CCW."], "jumps": []}, {"id": "P13530", "text": ["What was your observation concerning the output voltage of the power supply circuit?", "output voltage remained constant, within about 0.05 of 5.00 volts."], "jumps": ["P13520"]}, {"id": "P13531", "text": [], "jumps": []}, {"id": "P13532", "text": ["You should have seen that the output stayed fairly constant.  If the output voltage did change considerably, see your instructor.", "You should have seen that the output stayed fairly constant. If the output voltage did change considerably, see your instructor."], "jumps": []}, {"id": "P13540", "text": ["10.  Place PC130-290 S4 to DOWN and ensure the output voltage          is 5 V.  The computer will disable the voltage regulator when          you continue to the next page.", "10. Place PC130-290 S4 to DOWN and ensure the output voltage is 5 V. The computer will disable the voltage regulator when you continue to the next page."], "jumps": ["P13530"]}, {"id": "P13550", "text": ["11.  Measure the DC output voltage on PC130-230 TP11 using               the multimeter. \n12.  While observing the DC voltage, place PC130-290 S4 to UP             and rotate PC130-290 R1 clockwise and counterclockwise.", "11. Measure the DC output voltage on PC130-230 TP11 using the multimeter. 12. While observing the DC voltage, place PC130-290 S4 to UP and rotate PC130-290 R1 clockwise and counterclockwise."], "jumps": ["P13560"]}, {"id": "P13560", "text": ["What was your observation concerning the output voltage of the power supply circuit?", "output voltage remained constant, within about 0.05 of 5.00 volts.", "output voltage decreased more than 0.1 volts."], "jumps": ["P13550"]}, {"id": "P13561", "text": [], "jumps": []}, {"id": "P13562", "text": ["You should have seen that the output dropped to around \n4.7 volts and varied as the load was changed.  The output voltage did not remain fairly constant.", "You should have seen that the output dropped to around 4.7 volts and varied as the load was changed. The output voltage did not remain fairly constant..."], "jumps": []}, {"id": "P13570", "text": ["What you have seen was the action of the voltage regulator. When the regulator was operating, changing loads had little effect but, when the regulator was not operating, changes in the load affected the output voltage.  The computer will enable the voltage regulator when you continue to the next page.", "What you have seen was the action of the voltage regulator. When the regulator was operating, changing loads had little effect but, when the regulator was not operating, changes in the load affected the output voltage. The computer will enable the voltage regulator when you continue to the next page."], "jumps": ["P13560"]}, {"id": "P13580", "text": ["Now let's look at the action of U1 which controls the conduction of Q2, which compensates the output voltage for changes in the load."], "jumps": ["P13590"]}, {"id": "P13590", "text": ["13.  Using the multimeter or oscilloscope, measure the DC                      voltage on PC130-230 TP12.", "13. Using the multimeter or oscilloscope, measure the DC voltage on PC130-230 TP12."], "jumps": ["P13600", "P13570"]}, {"id": "P13600", "text": ["14.  Place or ensure that PC130-290 S4 is UP. \n15.  While observing the DC voltage, vary PC130-290 R1.  Note if           the output voltage on TP12 increases or decreases when the         load is increased, R1 rotated clockwise or in the INCREASE           direction as indicated on the PC130-290 card.", "14. Place or ensure that PC130-290 S4 is UP. 15. While observing the DC voltage, vary PC130-290 R1. Note if the output voltage on TP12 increases or decreases when the load is increased, R1 rotated clockwise or in the INCREASE direction as indicated on the PC130-290 card."], "jumps": ["P13610", "P13570"]}, {"id": "P13610", "text": ["When the load on the power supplied increases, PC130-290 R1 rotated clockwise, what happens to the voltage that is supplied to Q2?"], "jumps": ["P13600"]}, {"id": "P13611", "text": [], "jumps": []}, {"id": "P13612", "text": ["When the load increases, the control voltage to Q2 should not decrease, check your measurements."], "jumps": []}, {"id": "P13613", "text": ["When the load increases, the control voltage to Q2 should not remain the same, check your measurements."], "jumps": []}, {"id": "P13620", "text": ["What you have seen is an increase in load which tends to decrease the output voltage of the power supply.  The control voltage to the base of Q2 increases, placing the output voltage back to normal.", "What you have seen is an increase in load which tends to decrease the output voltage of the power supply. The control voltage to the base of Q2 increases, placing the output voltage back to normal."], "jumps": ["P13630", "P13610"]}, {"id": "P13630", "text": ["16.  While observing the voltage on TP12, vary R3 on PC130-230.", "16. While observing the voltage on TP12, vary R3 on PC130-230."], "jumps": ["P13640", "P13620"]}, {"id": "P13640", "text": ["What you saw was the voltage applied to the base of Q2 change as PC130-230 R3 was varied.  R3 is used to set the output voltage level by setting up the initial conduction of Q2.", "What you saw was the voltage applied to the base of Q2 change as PC130-230 R3 was varied. R3 is used to set the output voltage level by setting up the initial conduction of Q2."], "jumps": ["P13650", "P13620"]}, {"id": "P13650", "text": ["Finally, let's look at the current protection circuit."], "jumps": ["P13660", "P13620"]}, {"id": "P13660", "text": ["17.  Place PC130-290 S4 down removing the load. \n18.  Measure the output voltage on TP11 and adjust PC130-230             R3 for a 5 volt output.", "17. Place PC130-290 S4 down removing the load. 18. Measure the output voltage on TP11 and adjust PC130-230 R3 for a 5 volt output."], "jumps": ["P13670", "P13620"]}, {"id": "P13670", "text": ["19.  While observing the output voltage, vary the current                          protection control, PC130-230, R5.", "19. While observing the output voltage, vary the current protection control, PC130-230, R5."], "jumps": ["P13680", "P13660"]}, {"id": "P13680", "text": ["You should have viewed very little change in the output voltage, with no load, the current draw is not excessive."], "jumps": ["P13690", "P13670"]}, {"id": "P13690", "text": ["20.  On PC130-290, place S4 and S5 to UP. \n21.  While observing the output voltage with the multimeter, vary           PC130-290, R1.", "20. On PC130-290, place S4 and S5 to UP. 21. While observing the output voltage with the multimeter, vary PC130-290, R1."], "jumps": ["P13700", "P13680"]}, {"id": "P13700", "text": ["You should have seen the voltage decrease.  What's happening is that the load causes excessive current and Q1 is turned ON.", "You should have seen the voltage decrease. What's happening is that the load causes excessive current and Q1 is turned ON."], "jumps": ["P13710", "P13690"]}, {"id": "P13710", "text": ["This action turns Q2 off stopping the current flow.  As the current flow now decreases, Q1 turns off and Q2 turns back on.  The process goes on and on.", "This action turns Q2 off stopping the current flow. As the current flow now decreases, Q1 turns off and Q2 turns back on. The process goes on and on."], "jumps": ["P13720", "P13700"]}, {"id": "P13720", "text": ["In other words, the output voltage is decreased to keep the output current at a safe level by turning Q2 on and off."], "jumps": ["P13730", "P13700"]}, {"id": "P13730", "text": ["Now that you have seen normal operation, let's troubleshoot a typical fault in the power supply."], "jumps": ["P13740", "P13700"]}, {"id": "P13740", "text": ["First, set the power supply for normal operation. 1. Remove the load by ensuring S4 and S5 on PC130-290 are DOWN. 2. Measure the output voltage on PC130-230 TP11 and adjust R3 for a 5 volt output. Second, ensure the circuit is working correctly."], "jumps": ["P13750", "P13730"]}, {"id": "P13750", "text": ["3. Check the output voltage of the power supply under no load conditions by measuring for 5 volt output, on PC130-230, TP11. 4. Check the voltage regulation by placing S4 on PC130-290 to UP and varying R1. Ensure the output voltage remains constant on PC130-230, TP11...........0, TP11..."], "jumps": ["P13760", "P13740"]}, {"id": "P13760", "text": ["Now that you are sure the power supply circuit is operating correctly, the computer will insert a fault."], "jumps": ["P13750"]}, {"id": "P13770", "text": ["Test the Circuit\n 1.  Remove the load, S4 on PC130-290 to DOWN, and verify the           output is 5 volts, on PC130-230, TP11.\n 2.  Place a load on the circuit, S4 on PC130-290 to UP, and verify        output voltage remains close to 5 volts, on PC130-230, TP11.", "Test the Circuit 1. Remove the load, S4 on PC130-290 to DOWN, and verify the output is 5 volts, on PC130-230, TP11. 2. Place a load on the circuit, S4 on PC130-290 to UP, and verify output voltage remains close to 5 volts, on PC130-230, TP11."], "jumps": ["P13780"]}, {"id": "P13780", "text": ["Is the power supply maintaining a 5 volt output when unloaded and loaded?"], "jumps": ["P13770"]}, {"id": "P13781", "text": [], "jumps": []}, {"id": "P13782", "text": ["With the fault inserted, the output voltage is greater than 5 volts unloaded and has large changes when a load is applied."], "jumps": []}, {"id": "P13790", "text": ["Now that you know the circuit is faulted, you must determine if the fault is in the rectifier, filter or the voltage regulator."], "jumps": ["P13800", "P13780"]}, {"id": "P13800", "text": ["Determining the Faulted Section 3. Measure the voltage on PC130-230, TP10. TP10 is the output of the rectifier or filter. If the voltage is below 5 volts, not present, or has a large ripple, the fault is in the rectifier or filter. If the voltage is above 5 volts with little ripple, the fault is in the voltage regulator."], "jumps": ["P13810", "P13790"]}, {"id": "P13810", "text": ["Is the fault in the rectifier, filter or voltage regulator?"], "jumps": ["P13800"]}, {"id": "P13811", "text": [], "jumps": []}, {"id": "P13812", "text": ["You should have measured greater than 5 volts with little ripple on PC130-230, TP10.  This means the rectifier/filter is producing a voltage large enough for the regulator to operate correctly.", "You should have measured greater than 5 volts with little ripple on PC130-230, TP10. This means the rectifier/filter is producing a voltage large enough for the regulator to operate correctly."], "jumps": ["P13810"]}, {"id": "P13820", "text": ["Now you must isolate the fault to either U1 or the Q1 and Q2 circuit."], "jumps": ["P13830", "P13810"]}, {"id": "P13830", "text": ["4.  Measure the voltage on PC130-230, TP12 and vary PC130-230,      R3.  TP12 is the output of U1 which controls the regulator Q2.        If U1's output voltage can be varied, the fault is probably in Q1       or Q2.   If U1's output voltage can not be varied, the fault is              probably in U1 or its inputs.", "4. Measure the voltage on PC130-230, TP12 and vary PC130-230, R3. TP12 is the output of U1 which controls the regulator Q2. If U1's output voltage can be varied, the fault is probably in Q1 or Q2. If U1's output voltage can not be varied, the fault is probably in U1 or its inputs."], "jumps": ["P13840", "P13820"]}, {"id": "P13840", "text": ["Is the fault in U1 or Q1, Q2?", "Is the fault in U1 or Q1, Q2?yped.........................."], "jumps": ["P13820"]}, {"id": "P13841", "text": [], "jumps": []}, {"id": "P13842", "text": ["You should have seen that varying R3 had no effect on the output of U1, TP12.  This means the voltage regulator, Q2, will not operate even if not faulted.", "You should have seen that varying R3 had no effect on the output of U1, TP12. This means the voltage regulator, Q2, will not operate even if not faulted......."], "jumps": []}, {"id": "P13850", "text": ["You have isolated the fault to U1.  The negative input of U1 has a constant ground applied.", "You have isolated the fault to U1. The negative input of U1 has a constant ground applied."], "jumps": ["P13860", "P13840"]}, {"id": "P13860", "text": ["With the negative input at zero, the difference between the positive input is always maximum.  This produces a maximum output to the base of Q2.", "With the negative input at zero, the difference between the positive input is always maximum. This produces a maximum output to the base of Q2."], "jumps": ["P13870", "P13850"]}, {"id": "P13870", "text": ["With the maximum voltage applied to the base of Q2, Q2 conducts fully.  This is why the no load output voltage was around 12 volts with no regulation when a load was applied.", "With the maximum voltage applied to the base of Q2, Q2 conducts fully. This is why the no load output voltage was around 12 volts with no regulation when a load was applied....."], "jumps": ["P13880", "P13850"]}, {"id": "P13880", "text": ["The computer will now remove the fault.", "The computer will now remove the fault....................................."], "jumps": ["P13850"]}, {"id": "P13890", "text": ["5. Remove the load, PC130-290, S4 DOWN, measure the DC voltage on TP11 of PC130-230 - output, and adjust R3 on PC130-230 for 5 volt output. 6. Place PC130-290, S4 to UP and vary the load, R1 on PC130-290. You should see that the power supply is back in operation. n."], "jumps": []}, {"id": "P13900", "text": ["1.  Set the Console Power Switch to OFF.", "1. Set the Console Power Switch to OFF.FF................................."], "jumps": []}, {"id": "P13902", "text": ["2.  Disconnect all test equipment. \n3.  Remove all PC cards.\n4.  Return all equipment to the designated storage area.", "2. Disconnect all test equipment. 3. Remove all PC cards. 4. Return all equipment to the designated storage area."], "jumps": ["P13910", "P13900"]}, {"id": "P13910", "text": ["This completes the experiment on THREE PHASE POWER GENERATION."], "jumps": ["P2001", "P13902"]}, {"id": "PINFO", "text": ["07-14-00 Converted to ToolBook 7.1 format. jay 08-03-00 Text and Branching. frieda 09-19-00 Graphics. damian 09-27-00 Reviewed - lisa 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-12-02 review - rs 01-16-04 Repositioned comma on P1940 to before \"but\", not after. Changed \"Q2 is\" to \"Q2 if\" on P10227. Pat 01-21-04 Changed graphic to show higher DC level on P1190, 1200, 1210, 1250, 1260, 1270, 1960.-sarah 01-22-04 Reviewed changes. frieda 03-24-04 P1380, text says that \"D1, D2, D5 & D6..\" but D3,4,5 & 6 are the components that are highlighted. Highlited D1 and D2, removed highlite on D3 and D4. -Phil 07-09-04 P2910, P13910 Added end of experiment script per jay. frieda"], "jumps": []}]};
let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
