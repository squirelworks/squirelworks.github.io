k at the actual circuitry used to control the keyboard in the 8051 microcontroller system.", "Input means that the device does not provide any outputs to the user. To better understand the operation of an input device, let's look at the actual circuitry used to control the keyboard in the 8051 microcontroller system.. system.system.er system."], "jumps": ["P1180", "P1150"]}, {"id": "P1180", "text": ["We will begin by looking at a block diagram of the system and, as each section is covered, the blocks will be replaced by their actual circuitry.", "We will begin by looking at a block diagram of the system and, as each section is covered, the blocks will be replaced by their actual circuitry.cuitry.circuitry."], "jumps": ["P1190", "P1150"]}, {"id": "P1190", "text": ["As you can see, the keyboard has been broken down into five main sections: control, keyboard latch, keyboard matrix, keyboard buffer, and the key decoding circuit.  Let's start by looking at the keyboard key matrix.", "The keyboard matrix is an arrangement of horizontal and vertical wires with switches connected across them.  Pressing any one key connects two wires, one horizontal and one vertical.", "As you can see, the keyboard has been broken down into five main sections: control, keyboard latch, keyboard matrix, keyboard buffer, and the key decoding circuit. Let's start by looking at the keyboard key matrix. matrix. matrix.", "The keyboard matrix is an arrangement of horizontal and vertical wires with switches connected across them. Pressing any one key connects two wires, one horizontal and one vertical....al.rtical."], "jumps": ["P1200", "P1180"]}, {"id": "P1210", "text": ["Each key has its own unique connection so that the microcontroller can differentiate one key from another.  By sending a signal through a vertical wire, the horizontal wires can be looked at to see which key in that row was pressed, if any. This brings us to the next circuit, the keyboard latch.", "Each key has its own unique connection so that the microcontroller can differentiate one key from another. By sending a signal through a vertical wire, the horizontal wires can be looked at to see which key in that row was pressed, if any. This brings us to the next circuit, the keyboard latch....latch.d latch.d latch.ad latch..."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["The keyboard latch is an 8-bit latch connected to the 8 vertical    connections of the keyboard key matrix.  The output of a latch is the last input present when the clock signal triggered the latch.", "The keyboard latch is an 8-bit latch connected to the 8 vertical connections of the keyboard key matrix. The output of a latch is the last input present when the clock signal triggered the latch. latch. latch."], "jumps": ["P1200"]}, {"id": "P1230", "text": ["The data bus of the 8051 is used to send and receive signals from the keyboard circuitry.  Since we cannot send and receive at the same time, a latch provides a way of keeping a previous set of signals from the data bus, allowing results of these applied signals to be read.", "The data bus of the 8051 is used to send and receive signals from the keyboard circuitry. Since we cannot send and receive at the same time, a latch provides a way of keeping a previous set of signals from the data bus, allowing results of these applied signals to be read. read. read.. read. read..."], "jumps": ["P1240", "P1200"]}, {"id": "P1240", "text": ["A program in the microcontroller sets the latch to output all highs to all the vertical lines.  The program then waits to see if an        interrupt is generated by the key decoding circuit as a result of a key being pressed.", "A program in the microcontroller sets the latch to output all highs to all the vertical lines. The program then waits to see if an interrupt is generated by the key decoding circuit as a result of a key being pressed..."], "jumps": ["P1250", "P1200"]}, {"id": "P1250", "text": ["If an interrupt is not generated       b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
</body>
