const book = {"title": "93953803", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . .", "Title: OPERATIONAL AMPLIFIER TROUBLESHOOTING EXPERIMENT"], "jumps": []}, {"id": "P10", "text": ["OPERATIONAL AMPLIFIER TROUBLESHOOTING EXPERIMENT"], "jumps": []}, {"id": "P100", "text": ["w Describe typical faults in operational amplifier circuits. w Describe operational amplifier troubleshooting procedures. ibe operational amplifier troubleshooting procedures. .", "w Recognize that an operational amplifier circuit is faulted. w Verify correct circuit operation for a repaired op-amp circuit.. w Verify correct circuit operation for a repaired op-amp circuit........ circuit."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "5. Nida Model 480, 488 Multimeter or Equivalent"], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson you will learn about troubleshooting operational amplifier circuits."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Although the operational amplifier may function as different types of amplifiers, troubleshooting is the same for each."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["In most cases, the Op-amp IC is the most likely component to fail. This requires replacement of the IC as you cannot repair integrated circuits."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Measuring the output and comparing it to the input determines if a problem exists."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Replacing the op-amp and rechecking the circuit verifies that the fault has been corrected."], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["Let's begin the lesson on OPERATIONAL AMPLIFIER TS EXPERIMENT..............."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Op-amps have many different functions. When troubleshooting, you must first recognize what type of circuit it is."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Inverting and non-inverting amps have only one input. To determine normal operation, compare calculated gain with measured gain.", "Calculated A = + 1 Measured A =", "Calculated A = Measured A =A ="], "jumps": ["P1035", "P1020"]}, {"id": "P1035", "text": ["Inverting amps should produce a negative output for a positive DC applied. If AC is applied, the signal should be inverted."], "jumps": ["P1040", "P1030"]}, {"id": "P1040", "text": ["The measured gain should match your calculated gain within \u00b110% for normal operation.", "The measured gain should match your calculated gain within", "Calculated A = Measured A =A =", "Calculated A = + 1 Measured A ="], "jumps": ["P1050", "P1035"]}, {"id": "P1050", "text": ["Difference amps have two inputs and summing amps may have even more. To determine normal operation, compare calculated output with measured output."], "jumps": ["P1055", "P1040"]}, {"id": "P1055", "text": ["For this troubleshooting discussion, summing and difference amps with a gain of one are discussed since it is the most common configuration."], "jumps": ["P1060", "P1050"]}, {"id": "P1060", "text": ["If the output of an operational amplifier is incorrect for the given input(s), check Vcc to ensure correct supply voltage."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["Since most op-amps require positive and negative supply voltages, both should be checked with an oscilloscope for correct DC voltage levels."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["The operational amplifier is faulted if the output is incorrect and the input(s) and supply voltages check good."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["Is this operational amplifier circuit with a gain of one faulted?"], "jumps": ["P1060", "P1095"]}, {"id": "P1091", "text": [], "jumps": []}, {"id": "P1092", "text": ["The difference amplifier should produce an output equal to the +input minus the -input for normal operation."], "jumps": []}, {"id": "P1095", "text": ["DIFFERENCE AMPLIFIER - The op-amp shown is connected as a difference amplifier. The output should be the (+) input minus the (-) input."], "jumps": []}, {"id": "P1100", "text": ["Since the operational amplifier is an IC containing numerous components, many different faults can occur."], "jumps": ["P1110", "P1090", "P"]}, {"id": "P1110", "text": ["Attempting to diagnose the exact problem in an op-amp is not necessary."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["If the op-amp is faulted, replace the component and check the circuit again for normal operation."], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["If this op-amp circuit has a gain of one, what do you predict the output will be for normal operation?"], "jumps": ["P1100"]}, {"id": "P1131", "text": [], "jumps": []}, {"id": "P1132", "text": ["This is a summing amp. The output would be 1 V if it was a difference amp."], "jumps": []}, {"id": "P1133", "text": ["The sum of the inputs is 7. However, the inputs are applied to the inverting input, so the output is negative."], "jumps": []}, {"id": "P1140", "text": ["Use this troubleshooting method as a guide to help you troubleshoot operational amplifier circuits. This is not the only method, and you may develop your own techniques as you become a proficient troubleshooter.", "Use this troubleshooting method as a guide to help you troubleshoot operational amplifier circuits. This is not the only method, and you may develop your own techniques as you become a proficient troubleshooter. 1. Determine type of circuit 2. Measure input(s) 3. Calculate gain (output) 4. Measure output 5. Compare calculated with measured 6. Check both supply voltages 7. Replace IC and verify operationnn", "1. Determine type of circuit 2. Measure input(s) 3. Calculate gain (output) 4. Measure output 5. Compare calculated with measured 6. Check both supply voltages 7. Replace IC and verify operationn"], "jumps": ["P1910", "P1130"]}, {"id": "P1910", "text": ["This completes the information on OP-AMP FAULTS.", "This completes the information on OP-AMP FAULTS.TLE........"], "jumps": ["P1001", "P1140"]}, {"id": "P1920", "text": ["1.  When troubleshooting op-amps, first determine what                        configuration the op-amp is operating in.", "1. When troubleshooting op-amps, first determine what configuration the op-amp is operating in.."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.   A problem exists if the measured gain or output is more than         \u00b110% off from your calculated values.", "2. A problem exists if the measured gain or output is more than", "Calculated A = Measured A ====", "Calculated A = + 1 Measured A ="], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The output of a summing amp with a gain of one should be             the negative sum of the inputs.", "3. The output of a summing amp with a gain of one should be the negative sum of the inputs....."], "jumps": ["P1943", "P1930"]}, {"id": "P1943", "text": ["4.  The output of a difference amp with a gain of one should be             the (+) input minus the (-) input.", "4. The output of a difference amp with a gain of one should be the (+) input minus the (-) input."], "jumps": ["P1950", "P1940"]}, {"id": "P1950", "text": ["5.  If a faulted op-amp is suspected, check both operating                     voltages with an oscilloscope to ensure smooth DC.", "5. If a faulted op-amp is suspected, check both operating voltages with an oscilloscope to ensure smooth DC."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["6.  If the op-amp is determined to be faulted, replace the op-amp          and verify correct operation.", "6. If the op-amp is determined to be faulted, replace the op-amp and verify correct operation."], "jumps": ["P1999", "P1950"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.."], "jumps": ["P1001", "P1950"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["The purpose of this experiment is to demonstrate troubleshooting op-amp circuits. The output of a difference amplifier is calculated and verified. Faulted operation is observed through a computer inserted fault."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["Pick up the PC130-54 card. This card is used to demonstrate typical faults in an operational amplifier."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["Compare the card with the schematic shown."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["S3 and S4 select input resistances to change the gain of the amplifier."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["S5 selects the summing or difference function let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
