["P2910", "P13370"]}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson you will learn about the bistable multivibrator."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Bistable multivibrators change the DC operating voltage to a square wave output."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["The bistable multivibrator is triggered.  It has two stable states.", "The bistable multivibrator is triggered. It has two stable states."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["The components in the feedback circuit determine the bistable operation."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on BISTABLE MULTIVIBRATOR OPERATION.................."], "jumps": ["P430"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P13200", "text": ["Compare your measured frequency with the frequency of the trigger pulses.", "Compare your measured frequency with the frequency of the trigger pulses.........", "Measured Trigger Pulses 2000 Hzzzzz"], "jumps": ["P13210", "P13190"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["This is a typical bistable multivibrator circuit.", "This is a typical bistable multivibrator circuit..........."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["It is identified as a bistable multivibrator by the feedback circuit containing R2, C2 and R3, C3."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The circuit consists of two common emitter amplifiers. Notice that NPN transistors are used."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Q1 amplifier uses R1, R3,R4 and R5 for biasing."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["R1 is the collector load resistor.  R3 and R5 are voltage divider base bias resistors.  The base bias voltage is taken between R5 and R3.", "R1 is the collector load resistor. R3 and R5 are voltage divider base bias resistors. The base bias voltage is taken between R5 and R3."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["Q2 amplifier uses R4, R2, R6 and R1 for biasing."], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["R4 is the collector load resistor.  R2 and R6 are voltage divider base bias resistors.  The base bias voltage is taken between R6 and R2.", "R4 is the collector load resistor. R2 and R6 are voltage divider base bias resistors. The base bias voltage is taken between R6 and R2."], "jumps": ["P1090", "P1020"]}, {"id": "P1090", "text": ["R2, C2 and R3, C3 cross couple the output of one amplifier to the input of the other amplifier."], "jumps": ["P1100", "P1020"]}, {"id": "P1100", "text": ["C2 and C3 are speed up capacitors.  They immediately couple a change in voltage from the collector of one transistor to the base of the other transistor.", "C2 and C3 are speed up capacitors. They immediately couple a change in voltage from the collector of one transistor to the base of the other transistor."], "jumps": ["P1110", "P1020"]}, {"id": "P1110", "text": ["C1, D1 and C4, D2 are used to input the trigger pulse.  A negative input is required to forward bias the diodes.", "C1, D1 and C4, D2 are used to input the trigger pulse. A negative input is required to forward bias the diodes."], "jumps": ["P1120", "P1020"]}, {"id": "P1120", "text": ["R7 and R8 apply a bias to D1 and D2 so that only one diode is forward biased for each stable state of the multivibrator."], "jumps": ["P1130", "P1020"]}, {"id": "P1130", "text": ["What is the purpose of C2 and C3?", "What is the purpose of C2 and C3?..........................", "Immediately couple a change in voltage to a transistor's base..."], "jumps": ["P1020"]}, {"id": "P1131", "text": [], "jumps": []}, {"id": "P1132", "text": ["R7 and R8 apply the bias to D1 and D2.", "R7 and R8 apply the bias to D1 and D2......................"], "jumps": []}, {"id": "P1133", "text": ["C2 and C3 are not used as biasing for Q1 and Q2.  Q1 base bias is from R3 and R5, Q2 base bias is from R2 and R6.", "C2 and C3 are not used as biasing for Q1 and Q2. Q1 base bias is from R3 and R5, Q2 base bias is from R2 and R6."], "jumps": []}, {"id": "P1140", "text": ["What is the purpose of D1 and D2?", "What is the purpose of D1 and D2?.........................."], "jumps": ["P1130"]}, {"id": "P1141", "text": [], "jumps": []}, {"id": "P1142", "text": ["D1 and D2 are not used for transistor biasing.", "D1 and D2 are not used for transistor biasing.............."], "jumps": []}, {"id": "P1150", "text": ["The operation of a bistable multivibrator is controlled by the input trigger. Let's see how."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["When the circuit is first energized, a positive voltage is applied to the base of each transistor amplifier."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["Since the components in the two amplifiers are not EXACTLY the same values, the two transistors will not start conducting at the same time."], "jumps": ["P1180", "P1150", "P1175"]}, {"id": "P1172", "text": ["Since the components in the two transistors are not EXACTLY the same values, the two transistors will not start conducting at the same time."], "jumps": ["P1180", "P1150", "P1175"]}, {"id": "P1175", "text": ["COMPONENT DIFFERENCES - Identical components can not be manufactured to exactly the same value. Resistors are normally", "10% of marked value. Also, the same type of transistors are slightly different from one to another."], "jumps": []}, {"id": "P1180", "text": ["One transistor will conduct before the other.  Assume Q1 starts to conduct first.", "One transistor will conduct before the other. Assume Q1 starts to conduct first."], "jumps": ["P1185", "P1172"]}, {"id": "P1185", "text": ["The operation is identical if Q2 starts to conduct first."], "jumps": ["P1190", "P1172"]}, {"id": "P1190", "text": ["When Q1 turns ON, the voltage on the collector decreases to 0V, normal common emitter operation when approaching saturation."], "jumps": ["P1200", "P1172"]}, {"id": "P13150", "text": ["1.  Connect a function generator to the PC1 OUTPUT BNC                   connector.\n2.  Adjust the function generator for a 2 kHz square wave output.", "1. Connect a function generator to the PC1 OUTPUT BNC connector. 2. Adjust the function generator for a 2 kHz square wave output..", "ve going) voltage is coupled through C2 to the base of Q2 overriding the small positive voltage from +Vcc."], "jumps": ["P13160", "P13155"]}, {"id": "P1210", "text": ["The negative voltage on the base of Q2 insures that it does not start conducting. Q2 is OFF.", "The negative voltage on the base of Q2 insures that it does not start conducting. Q2 is OFF.?"], "jumps": ["P1220", "P1172"]}, {"id": "P1220", "text": ["With Q2 OFF,  +12V is on the collector which is applied to Q1 through the voltage divider of R3 and R5.", "With Q2 OFF, +12V is on the collector which is applied to Q1 through the voltage divider of R3 and R5."], "jumps": ["P1230", "P1172"]}, {"id": "P1230", "text": ["This applies a small positive voltage on the base of Q1 keeping Q1 ON."], "jumps": ["P1240", "P1172"]}, {"id": "P1240", "text": ["FIRST STATE OF THE MULTIVIBRATOR  \nQ1 ON, 0 V on collector: Q1 turns on because it started to conduct first.", "FIRST STATE OF THE MULTIVIBRATOR Q1 ON, 0 V on collector: Q1 turns on because it started to conduct first."], "jumps": ["P1245", "P1172"]}, {"id": "P1242", "text": ["FIRST STATE OF THE MULTIVIBRATOR  \nQ1 ON, 0 V on collector: Q1 turns on because it started to conduct first.", "FIRST STATE OF THE MULTIVIBRATOR Q1 ON, 0 V on collector: Q1 turns on because it started to conduct first."], "jumps": ["P1245", "P1172"]}, {"id": "P1245", "text": ["Q2 OFF, +12V on collector: Q2 turns off because of the zero voltage on the collector of Q1.", "Q2 OFF, +12V on collector: Q2 turns off because of the zero voltage on the collector of Q1..............."], "jumps": ["P1250", "P1242"]}, {"id": "P1250", "text": ["The circuit stays in this state until an input trigger is received."], "jumps": ["P1260", "P1242"]}, {"id": "P1260", "text": ["With Q1 ON, 0 V is applied to the cathode of D1, it is forward biased.  With Q2 OFF, +12V is applied  to the cathode of D2, it is reverse biased.", "With Q1 ON, 0 V is applied to the cathode of D1, it is forward biased. With Q2 OFF, +12V is applied to the cathode of D2, it is reverse biased."], "jumps": ["P1270", "P1242"]}, {"id": "P1270", "text": ["When the negative input pulse is received, D1 allows the pulse to pass to the base of Q1.  D2 blocks the path to the base of Q2.", "When the negative input pulse is received, D1 allows the pulse to pass to the base of Q1. D2 blocks the path to the base of Q2."], "jumps": ["P1280", "P1242"]}, {"id": "P1280", "text": ["The negative pulse on the base of Q1 turns it OFF.  The collector voltage raises to +12V.", "The negative pulse on the base of Q1 turns it OFF. The collector voltage raises to +12V."], "jumps": ["P1290", "P1242"]}, {"id": "P1290", "text": ["At the instant Q1 turns OFF, C2 couples the raise in collector voltage to the base of Q2."], "jumps": ["P1300", "P1242"]}, {"id": "P1300", "text": ["The positive voltage on the base of Q2 turns it ON.  The collector voltage decreases to 0V.", "The positive voltage on the base of Q2 turns it ON. The collector voltage decreases to 0V."], "jumps": ["P1310", "P1242"]}, {"id": "P1310", "text": ["The 0V on the collector of Q2 is applied by the voltage divider of R3 and R5, to the base of Q1.  Q1 remains OFF.", "The 0V on the collector of Q2 is applied by the voltage divider of R3 and R5, to the base of Q1. Q1 remains OFF."], "jumps": ["P1320", "P1242"]}, {"id": "P1320", "text": ["SECOND STATE OF THE MULTIVIBRATOR  \nQ1 OFF, +12V on collector: Q1 was turned  OFF by the negative input pulse.", "SECOND STATE OF THE MULTIVIBRATOR Q1 OFF, +12V on collector: Q1 was turned OFF by the negative input pulse."], "jumps": ["P1325", "P1242"]}, {"id": "P1322", "text": ["SECOND STATE OF THE MULTIVIBRATOR \nQ1 OFF, +12V on collector: Q1 was turned  OFF by the negative input pulse.", "SECOND STATE OF THE MULTIVIBRATOR Q1 OFF, +12V on collector: Q1 was turned OFF by the negative input pulse."], "jumps": ["P1325", "P1242"]}, {"id": "P1325", "text": ["Q2 ON, 0V on collector: Q2 was turned ON by the +12V on the collector of Q1."], "jumps": ["P1340", "P1322"]}, {"id": "P1340", "text": ["With Q1 OFF, +12 V is applied to the cathode of D1, it is reverse biased.  With Q2 ON, 0V is applied to the cathode of D2, it is forward biased.", "With Q1 OFF, +12 V is applied to the cathode of D1, it is reverse biased. With Q2 ON, 0V is applied to the cathode of D2, it is forward biased."], "jumps": ["P1350", "P1322"]}, {"id": "P1350", "text": ["When a negative input pulse is received, D2 allows the pulse to pass to the base of Q2.  D1 blocks the path to the base of Q1.", "When a negative input pulse is received, D2 allows the pulse to pass to the base of Q2. D1 blocks the path to the base of Q1."], "jumps": ["P1360", "P1322"]}, {"id": "P1360", "text": ["The negative pulse on the base of Q2 turns it OFF.  The collector voltage raises to +12 V.", "The negative pulse on the base of Q2 turns it OFF. The collector voltage raises to +12 V."], "jumps": ["P1365", "P1322"]}, {"id": "P1365", "text": ["At the instant Q2 turns OFF, C3 couples the raise in collector voltage to the base of Q1."], "jumps": ["P1370", "P1322"]}, {"id": "P1370", "text": ["The positive voltage on the base of Q1 turns it ON.  The collector voltage decreases to 0V.", "The positive voltage on the base of Q1 turns it ON. The collector voltage decreases to 0V."], "jumps": ["P1380", "P1322"]}, {"id": "P1380", "text": ["The 0 V on the collector of Q1 is applied to the base of Q2.  Q2 remains OFF.", "The 0 V on the collector of Q1 is applied to the base of Q2. Q2 remains OFF."], "jumps": ["P1390", "P1322"]}, {"id": "P1390", "text": ["RETURN TO THE FIRST STABLE STATE  \nQ1 ON, 0V on collector: Q1 turned ON by the +V on the collector of Q2.", "RETURN TO THE FIRST STABLE STATE Q1 ON, 0V on collector: Q1 turned ON by the +V on the collector of Q2."], "jumps": ["P1395", "P1322"]}, {"id": "P1392", "text": ["RETURN TO THE FIRST STABLE STATE  \nQ1 ON, 0V on collector: Q1 turns on by the +V on the collector of Q2.", "RETURN TO THE FIRST STABLE STATE Q1 ON, 0V on collector: Q1 turns on by the +V on the collector of Q2."], "jumps": ["P1395", "P1322"]}, {"id": "P1395", "text": ["Q2 OFF, +12V on collector: Q2 turned OFF by the negative input pulse."], "jumps": ["P1410", "P1392"]}, {"id": "P1410", "text": ["Remember, when the trigger pulse is received, only one diode is forward biased."], "jumps": ["P1415", "P1392"]}, {"id": "P1415", "text": ["The forward biased diode connects the negative input pulse to the base of the transistor that is ON."], "jumps": ["P1420", "P1392"]}, {"id": "P1420", "text": ["The negative trigger pulse turns Q1 OFF, this turns Q2 ON.", "The negative trigger pulse turns Q1 OFF, this turns Q2 ON./"], "jumps": ["P1430", "P1392"]}, {"id": "P2175", "text": ["6.  Adjust the frequency of the function generator for an exact .5        msec cycle (2 kHz) using the oscilloscope.  Four complete \n     waveforms should be displayed on the screen with the \n     Time/Div control set to .2 msec.", "6. Adjust the frequency of the function generator for an exact .5 msec cycle (2 kHz) using the oscilloscope. Four complete waveforms should be displayed on the screen with the Time/Div control set to .2 msec."], "jumps": ["P2180", "P2170"]}, {"id": "P14175", "text": ["6.  Adjust the frequency of the function generator for an exact .5        msec cycle (2 kHz) using the oscilloscope.  Four complete \n     waveforms should be displayed on the screen with the \n     Time/Div control set to .2 msec.", "6. Adjust the frequency of the function generator for an exact .5 msec cycle (2 kHz) using the oscilloscope. Four complete waveforms should be displayed on the screen with the Time/Div control set to .2 msec."], "jumps": ["P14180", "P14170"]}, {"id": "P2910", "text": ["This completes the experiment on BISTABLE MULTIVIBRATOR.", ". The experiment in this lesson is not setup to use the selected trainer.", "This completes the experiment on BISTABLE MULTIVIBRATOR...."], "jumps": ["P2001"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1431", "text": [], "jumps": []}, {"id": "P1432", "text": ["C2 is a speed up capacitor.  Its charging and discharging does not affect circuit operation.", "C2 is a speed up capacitor. Its charging and discharging does not affect circuit operation.y"], "jumps": []}, {"id": "P1440", "text": ["How is the ON transistor turned OFF?", "How is the ON transistor turned OFF?......................."], "jumps": ["P1430"]}, {"id": "P1441", "text": [], "jumps": []}, {"id": "P1442", "text": ["C2 is a speed up capacitor.  Its charging and discharging does not affect circuit operation.", "C2 is a speed up capacitor. Its charging and discharging does not affect circuit operation."], "jumps": []}, {"id": "P1450", "text": ["When Q2 turns ON, how is Q1 kept OFF?", "When Q2 turns ON, how is Q1 kept OFF???????................"], "jumps": ["P1440"]}, {"id": "P1451", "text": [], "jumps": []}, {"id": "P1452", "text": ["With +12 V on the collector of Q2, a positive voltage is applied to the base of Q1 which turns Q1 ON."], "jumps": []}, {"id": "P1453", "text": ["D1 being forward biased allows the input trigger to turn OFF Q1."], "jumps": []}, {"id": "P1460", "text": ["Normal operation of a bistable multivibrator is checked by measuring the output frequency with an oscilloscope or frequency counter."], "jumps": ["P1470", "P1450"]}, {"id": "P1470", "text": ["Then compare the measured output frequency with one half of the frequency of the trigger pulses."],  purpose of this experiment is to demonstrate the operation of bistable multivibrators."], "jumps": ["P2020", "P2001"]}, {"id": "P2020", "text": ["Pick up the PC130-45 card.  This card demonstrates the operation of  bistable multivibrators.", "Pick up the PC130-45 card. This card demonstrates the operation of bistable multivibrators.."], "jumps": ["P2030", "P2015"]}, {"id": "P2030", "text": ["Compare the components on PC130-45 to the schematic shown.", "Compare the components on PC130-45 to the schematic shown.m"], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["Notice that the output of Q3 (TP12) is coupled to the input of Q4 (TP17) and the output of Q4 (TP16) is coupled to the input of Q3 (TP13)."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["Let's start the experiment."], "jumps": ["P2060", "P2020"]}, {"id": "P2060", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P2020"]}, {"id": "P2070", "text": ["2.  Carefully plug PC130-45 into the Test Console PC2 position.", "2. Carefully plug PC130-45 into the Test Console PC2 position. ternal program = SCAN PWR 0 12itch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2060"]}, {"id": "P2080", "text": ["3.  Set the Voltmeter Switch to Positive.  \n4.  Set the Positive Supply Voltage to 12.  The Test Console's               Voltage Meter should indicate 12 volts.", "3. Set the Voltmeter Switch to Positive. 4. Set the Positive Supply Voltage to 12. The Test Console's Voltage Meter should indicate 12 volts.."], "jumps": ["P2070"]}, {"id": "P2090", "text": ["5.  Set up an oscilloscope for dual display and DC coupling.  \n6.  Adjust CH1 and CH2 traces as shown.", "5. Set up an oscilloscope for dual display and DC coupling. 6. Adjust CH1 and CH2 traces as shown.", "'}:5 t0H( 9E}A9As5/GA}A;aEAA}EAKE;AAaAE;A}AEAU;aA};aEAEA;EAAAEA;E;AaA", "EU let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
