const book = {"title": "9395T801", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: INTRODUCTION TO 68000 MICROPROCESSORSf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Identify the major sections of a microprocessor system. w Define the buses used by the 68000 for addressing, data and control. w Define the modes of operation for the 68000.", "w Understand the use and manipulation of binary, hexadecimal and decimal numbering systems. w Understand ASCII and BCD data encoding."], "jumps": []}, {"id": "P300", "text": ["Many items we use everyday are controlled by microprocessors."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Microprocessors have quietly found a place in our lives.  We use them in modern transportation, microwave ovens, entertainment systems and calculators.", "Microprocessors have quietly found a place in our lives. We use them in modern transportation, microwave ovens, entertainment systems and calculators."], "jumps": ["P415", "P400"]}, {"id": "P415", "text": ["Another example of how microprocessors are used is light control.  Microprocessors vary the window tint according to the light intensity.", "Another example of how microprocessors are used is light control. Microprocessors vary the window tint according to the light intensity."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Microprocessors are designed to accurately process information, perform repetitive actions and do so precisely the same way every time.  They are extremely reliable and relatively inexpensive.  In this lesson, we will examine a 32-bit 68000 microprocessor.", "Microprocessors are designed to accurately process information, perform repetitive actions and do so precisely the same way every time. They are extremely reliable and relatively inexpensive. In this lesson, we will examine a 32-bit 68000 microprocessor......"], "jumps": ["P430", "P415"]}, {"id": "P430", "text": ["Let's begin the lesson on INTRODUCTION TO 68000 MICROPROCESSORS............."], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["There are three primary components to any microprocessor system; Central Processing Unit (CPU), Memory, Input and Output (I/O).  Any of the three, alone, have no functional value.", "There are three primary components to any microprocessor system; Central Processing Unit (CPU), Memory, Input and Output (I/O). Any of the three, alone, have no functional value."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Memory is a place where the CPU can store and recall information."], "jumps": ["P1031", "P1020"]}, {"id": "P1031", "text": ["Input and output devices allow the CPU to communicate with a user or another device.  This is how the CPU gets instructions and information to act on.", "Input and output devices allow the CPU to communicate with a user or another device. This is how the CPU gets instructions and information to act on."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The CPU is the microprocessor of any system.  It is responsible for performing instructions, controlling the system and maintaining operations.  To achieve these requirements, the CPU employs a Control Unit, Registers and an Arithmetic Logic Unit.", "The CPU is the microprocessor of any system. It is responsible for performing instructions, controlling the system and maintaining operations. To achieve these requirements, the CPU employs a Control Unit, Registers and an Arithmetic Logic Unit."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The Control Unit is the section of the CPU that directs all information passed to or from the CPU."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["Without accurate timing, information being processed by the CPU would get scrambled and blocked much like a Los Angeles traffic jam."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["Because the CPU must handle enormous amounts of information simultaneously, it must have a place to temporarily store data while other information is being processed. The number of registers will vary from one CPU to the next. In the 68000, there are 20; 8 for data, 7 for addresses and 5 system registers."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["Digital electronics has been called the electronics of counting.  Every function performed by a CPU, in some manner, involves the manipulation of binary numbers.  Any mathematical operations in the  CPU are performed by the Arithmetic Logic Unit (ALU).", "Digital electronics has been called the electronics of counting. Every function performed by a CPU, in some manner, involves the manipulation of binary numbers. Any mathematical operations in the CPU are performed by the Arithmetic Logic Unit (ALU)."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["The Arithmetic Logic Unit in the 68000 CPU series is capable of performing the following functions:", "AND ADD OR SUBTRACT NOT MULTIPLY XOR DIVIDE SHIFT RIGHT NEGATE SHIFT LEFT COMPARE ROTATE RIGHT ROTATE LEFT"], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["Now that we have examined the make-up of the CPU, our next focus will be memory.  The memory section of a microprocessor system provides a large storage area for information.  The information includes both programs and the data needed by the system to run the programs.", "Now that we have examined the make-up of the CPU, our next focus will be memory. The memory section of a microprocessor system provides a large storage area for information. The information includes both programs and the data needed by the system to run the programs."], "jumps": ["P1101", "P1090"]}, {"id": "P1101", "text": ["There are two types of memory used by the CPU;  Read Only Memory and  Random Access Memory.  These are commonly known as ROM and RAM.", "There are two types of memory used by the CPU; Read Only Memory and Random Access Memory. These are commonly known as ROM and RAM."], "jumps": ["P1110", "P1100"]}, {"id": "P1105", "text": ["READ ONLY MEMORY - ROM is a nonvolatile form of memory. ROM can be accessed randomly. The program counter points to the location of the next instruction. The address of ROM can be changed randomly by changing the program counter."], "jumps": []}, {"id": "P1106", "text": ["RANDOM ACCESS MEMORY - RAM is a form of memory. When power is off, all the data in RAM is destroyed. RAM is useful to store temporary data or important values generated by the computer. RAM also stores frequently used parts of contained in slower mass memory. RAM can be accessed randomly."], "jumps": ["P1101"]}, {"id": "P1110", "text": ["The amount of memory used by a system varies greatly with need.  Early home PC's typically had 640 kB of RAM.  Today, this has increased to many millions of bytes.", "The amount of memory used by a system varies greatly with need. Early home PC's typically had 640 kB of RAM. Today, this has increased to many millions of bytes."], "jumps": ["P1111", "P1101"]}, {"id": "P1111", "text": ["As programs become larger and more elaborate, the amount of memory needed for smooth operation also grows.  Because memory is expensive, most systems have only enough for their applications.", "As programs become larger and more elaborate, the amount of memory needed for smooth operation also grows. Because memory is expensive, most systems have only enough for their applications."], "jumps": ["P1120", "P1101"]}, {"id": "P1120", "text": ["Memory is organized in a grid format known as a matrix.  Every location in the matrix is assigned a unique address.  In this way, the CPU is able to write or read from any particular location within memory.", "Memory is organized in a grid format known as a matrix. Every location in the matrix is assigned a unique address. In this way, the CPU is able to write or read from any particular location within memory.", "11 12 13 14 15 16 17 18 19 1A 1B 1C 1D", "21 22 23 24 25 26 27 28 29 2A 2B 2C 2D", "31 32 33 34 35 36 37 38 39 3A 3B 3C 3D", "41 42 43 44 45 46 47 48 49 4A 4B 4C 4D", "51 52 53 54 55 56 57 58 59 5A 5B 5C 5D", "61 62 63 64 65 66 67 68 69 6A 6B 6C 6D", "71 72 73 74 75 76 77 78 79 7A 7B 7C 7D", "81 82 83 84 85 86 87 88 89 8A 8B 8C 8D", "91 92 93 94 95 96 97 98 99 9A 9B 9C 9D", "A1 A2 A3 A4 A5 A6 A7 A8 A9 AA AB AC ADD"], "jumps": ["P1130", "P1101"]}, {"id": "P1130", "text": ["Normally, there are different varieties of memory used in the same system.  Often, portions of one kind of memory are assigned to one particular function.  Therefore, each distinctive block of memory maintains a consecutive block of addresses assigned to it.", "Normally, there are different varieties of memory used in the same system. Often, portions of one kind of memory are assigned to one particular function. Therefore, each distinctive block of memory maintains a consecutive block of addresses assigned to it."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["In order for the system user to keep track of what portion of memory is dedicated to what, a graphic representation called a Memory Map is used.", "EPROM RAM LCD CONTROL LCD DATA KEYBOARD DATA SERIAL PORT PARALLEL PORT UNUSED OTATE LEFT RIGHT ROTATE LEFT ARE ROTATE RIGHT ROTATE LEFT T PARE ROTATE RIGHT ROTATE LEFT ROTATE RIGHT ROTATE LEFT"], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["The last section of a microprocessor system is I/O.  The input/output section interfaces the CPU to the real world.  I/O devices allow the user or the devices, themselves, to communicate with the CPU.  The chart below lists many common I/O devices.", "The last section of a microprocessor system is I/O. The input/output section interfaces the CPU to the real world. I/O devices allow the user or the devices, themselves, to communicate with the CPU. The chart below lists many common I/O devices.", "Keyboard Monitor Modem Scanner Printer Disk Drives Mouse Speakers Light Pen Joy Stick CD Rom ROTATE LEFT FT LEFT EFT FT E LEFT ATE LEFT"], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["For the three sections of a microprocessor system to work properly, they need a conduit or some form of highway to pass information back and forth.  This is accomplished through the use of buses.", "For the three sections of a microprocessor system to work properly, they need a conduit or some form of highway to pass information back and forth. This is accomplished through the use of buses."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["A bus, in a microprocessor system, is a series of wires grouped by function and connected to various portions of the system; Address Bus, Data Bus and Control Bus."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["The address bus is used to carry the addresses generated by the CPU. As mentioned, the addresses indicate a location in memory or an I/O port. Address values for the 68000 microprocessor are 24 bits in length. This means they can have a value anywhere from 1 (2 ) to 16,777,216 (2 ), nearly 17 million locations!"], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["Address buses are unidirectional.  This means that the system's devices can only read from the address bus, not write to it.", "Address buses are unidirectional. This means that the system's devices can only read from the address bus, not write to it."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["The data bus is used to transfer information between different sections of the microprocessor system.  Once the proper address has been selected by the CPU, data may be passed to or from the CPU via the data bus.", "The data bus is used to transfer information between different sections of the microprocessor system. Once the proper address has been selected by the CPU, data may be passed to or from the CPU via the data bus."], "jumps": ["P1210", "P1180"]}, {"id": "P1210", "text": ["The data bus in the 68000 microprocessor is 16 bits long.  This means that 16 bits of data may be transferred at one time.  Unlike the address bus, the data bus is bi-directional.  Data may be written to or read from the data bus.", "The data bus in the 68000 microprocessor is 16 bits long. This means that 16 bits of data may be transferred at one time. Unlike the address bus, the data bus is bi-directional. Data may be written to or read from the data bus."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["The last bus that will be examined is the control bus.  The control bus carries the signals that both synchronize and enable or disable certain functions of devices wishing to communicate with the CPU.", "The last bus that will be examined is the control bus. The control bus carries the signals that both synchronize and enable or disable certain functions of devices wishing to communicate with the CPU."], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["Some control signals are generated by the CPU while others are from the devices tied to it.  As with the data bus, the control bus is bi-directional.", "Some control signals are generated by the CPU while others are from the devices tied to it. As with the data bus, the control bus is bi-directional."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["Now that you have been introduced to the major components of a microprocessor system, let's see how they work together."], "jumps": ["P1250", "P1220"]}, {"id": "P1250", "text": ["A program is stored in memory, but the microprocessor needs a way to access the program.  One of the system registers in the CPU, known as the program counter (PC), is used for this purpose.", "A program is stored in memory, but the microprocessor needs a way to access the program. One of the system registers in the CPU, known as the program counter (PC), is used for this purpose.", "oard Monitor Modem Scanner Printer Disk Drives Mouse Speakers Light Pen Joy Stick CD Rom ROTATE LEFT FT LEFT EFT FT E LEFT ATE LEFT"], "jumps": ["P1260", "P1240", "PC"]}, {"id": "P1260", "text": ["The program counter holds the address of the next instruction for the program and directs the control section of the CPU to the location (address) of that instruction.  The control section takes the address stored in the program counter and places it on the address bus.", "The program counter holds the address of the next instruction for the program and directs the control section of the CPU to the location (address) of that instruction. The control section takes the address stored in the program counter and places it on the address bus."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["The control section then signals to memory (through the control bus) that it's requesting the instruction at that memory location. The control section of the CPU then stores the instruction in the   instruction register (IR).", "The control section then signals to memory (through the control bus) that it's requesting the instruction at that memory location. The control section of the CPU then stores the instruction in the instruction register (IR)."], "jumps": ["P1280", "P1250"]}, {"id": "P1280", "text": ["After the instruction is stored in the instruction register, the control section must then decode it so that the CPU knows what it is being told to do.  Once that is accomplished the CPU then performs the instruction and sets (increments) the program counter to the location of next instruction.", "After the instruction is stored in the instruction register, the control section must then decode it so that the CPU knows what it is being told to do. Once that is accomplished the CPU then performs the instruction and sets (increments) the program counter to the location of next instruction."], "jumps": ["P1290", "P1250"]}, {"id": "P1290", "text": ["This process is repeated as each instruction of the program is requested.  The time required to perform each instruction is based upon the system's clock speed and the number of cycles of the instruction.  Buses and registers are of finite capacity, so some instructions require several cycles to complete them.", "This process is repeated as each instruction of the program is requested. The time required to perform each instruction is based upon the system's clock speed and the number of cycles of the instruction. Buses and registers are of finite capacity, so some instructions require several cycles to complete them."], "jumps": ["P1300", "P1250"]}, {"id": "P1300", "text": ["Microprocessors are often categorized by their clock speed and data size.  For example, an eight bit data bus would be equal to an eight bit CPU, and so on.  However, the 68000 CPU is an exception.", "Microprocessors are often categorized by their clock speed and data size. For example, an eight bit data bus would be equal to an eight bit CPU, and so on. However, the 68000 CPU is an exception."], "jumps": ["P1310", "P1250"]}, {"id": "P1310", "text": ["The 68000 has the ability to manage 8, 16, and 32 bits of data. The data bus however, only holds 16 bits, so if 32 bits of information are being sent the CPU must read the line twice to get all 32 bits from memory."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["The names associated with the 8, 16, and 32 bit data groups are: byte for 8 bits, word for 16 bits and longword for 32 bits.  All instructions used by the 68000 are words since it is limited to a 16 line data bus.", "The names associated with the 8, 16, and 32 bit data groups are: byte for 8 bits, word for 16 bits and longword for 32 bits. All instructions used by the 68000 are words since it is limited to a 16 line data bus."], "jumps": ["P1330", "P1300"]}, {"id": "P1330", "text": ["The instructions listed in the table below (MOV, SUB and RTS) are shown in their binary and hex machine language as well as assembly language.  All three formats represent identical information.", "The instructions listed in the table below (MOV, SUB and RTS) are shown in their binary and hex machine language as well as assembly language. All three formats represent identical information.", "Function OP Code Assembly Language Machine Language Hexadecimal (Mnemonics) (Binary) Move 14 3C 00 42 MOVE.B #42H,D2 Subtract 94 3C 00 01 SUB.B #1,D2 Return 4E 75 RTS"], "jumps": ["P1331", "P1320"]}, {"id": "P1331", "text": ["The first two instructions are 32 bit longwords while the last instruction is a 16 bit word.", "Function OP Code Assembly Language Machine Language Hexadecimal (Mnemonics) (Binary) Move 14 3C 00 42 MOVE.B #42H,D2 Subtract 94 3C 00 01 SUB.B #1,D2 Return 4E 75 RTS"], "jumps": ["P1340", "P1330"]}, {"id": "P1340", "text": ["Microprocessors only understand binary, but binary numbers tend to be large and hard to enter accurately.  The Hexadecimal or OP Code is much easier for an operator to enter CPU instructions.  The CPU sends the OP Code to the instruction decoder where the hexadecimal is converted to binary.", "Microprocessors only understand binary, but binary numbers tend to be large and hard to enter accurately. The Hexadecimal or OP Code is much easier for an operator to enter CPU instructions. The CPU sends the OP Code to the instruction decoder where the hexadecimal is converted to binary.", "Function OP Code Assembly Language Machine Language Hexadecimal (Mnemonics) (Binary) Move 14 3C 00 42 MOVE.B #42H,D2 Subtract 94 3C 00 01 SUB.B #1,D2 Return 4E 75 RTS"], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["Assembly language uses mnemonics (shortened versions of words that describe the action indicated by the instruction).  In this way, the programmer is able to read through the program without having to memorize all of the OP Codes.", "Assembly language uses mnemonics (shortened versions of words that describe the action indicated by the instruction). In this way, the programmer is able to read through the program without having to memorize all of the OP Codes."], "jumps": ["P1360", "P1330"]}, {"id": "P1360", "text": ["When in the Supervisor Mode, programs have control of the CPU and all system functions, this includes the operating system, interrupts and routines which manage I/O.", "oard Monitor Modem Scanner Printer Disk Drives Mouse Speakers Light Pen Joy Stick CD Rom ROTATE LEFT FT LEFT EFT FT E LEFT ATE LEFT"], "jumps": ["P1361", "P1330"]}, {"id": "P1361", "text": ["The User Mode, on the other hand, normally operates with application programs.  In the User Mode, several microprocessor instructions and certain areas of memory are not accessible.", "The User Mode, on the other hand, normally operates with application programs. In the User Mode, several microprocessor instructions and certain areas of memory are not accessible.", "oard Monitor Modem Scanner Printer Disk Drives Mouse Speakers Light Pen Joy Stick CD Rom ROTATE LEFT FT LEFT EFT FT E LEFT ATE LEFT"], "jumps": ["P1910", "P1360"]}, {"id": "P1910", "text": ["This completes the information on the BASICS OF THE 68000 MICROPROCESSOR.", "1.  Microprocessors have many applications.", "1. Microprocessors have many applications.nd line here...."], "jumps": ["P1360", "P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Microprocessors systems require a CPU, Memory and I/O to          be functional.", "2. Microprocessors systems require a CPU, Memory and I/O to be functional."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The CPU is comprised of three major sections.", "3. The CPU is comprised of three major sections..........."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  Communications with the CPU are made possible using the           Address Bus, the Data Bus and the Control Bus.", "4. Communications with the CPU are made possible using the Address Bus, the Data Bus and the Control Bus."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  Microprocessors are often classified by operating speed and        data size.", "5. Microprocessors are often classified by operating speed and data size."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  Microprocessors understand only binary.  Hexadecimal is              used to represent binary data in an easy-to-read format.", "6. Microprocessors understand only binary. Hexadecimal is used to represent binary data in an easy-to-read format.", "Function OP Code Assembly Language Machine Language Hexadecimal (Mnemonics) (Binary) Move 14 3C 00 42 MOVE.B #42H,D2 Subtract 94 3C 00 01 SUB.B #1,D2 Return 4E 75 RTS"], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7.  Machine language is what microprocessors are controlled by        through programming.", "7. Machine language is what microprocessors are controlled by through programming.."], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["8.  There are two modes of operation:", "8. There are two modes of operation:......................", "oard Monitor Modem Scanner Printer Disk Drives Mouse Speakers Light Pen Joy Stick CD Rom ROTATE LEFT FT LEFT EFT FT E LEFT ATE LEFT"], "jumps": ["P1999", "P1970"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1990"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["All microprocessors evaluate data in binary form.  This means that they only recognize two voltage conditions: 1 and 0, 1 representing high voltage (typically 5 V) and 0 representing low voltage (typically 0 V).", "All microprocessors evaluate data in binary form. This means that they only recognize two voltage conditions: 1 and 0, 1 representing high voltage (typically 5 V) and 0 representing low voltage (typically 0 V)."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["Binary numbers are often large and hard to work with, so hexadecimal is commonly used in programming."], "jumps": ["P2032", "P2020"]}, {"id": "P2032", "text": ["Converting from one number system to another is an essential skill needed by technicians and programmers."], "jumps": ["P2033", "P2030"]}, {"id": "P2033", "text": ["A quick review of the decimal number system may refresh your understanding of other number systems."], "jumps": ["P2040", "P2030"]}, {"id": "P2040", "text": ["Any quantity can be represented by using these ten symbols.", "20 twentyyyennnnnnnnnnnnred sixty-fiveee"], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["Other number systems use different sets of symbols.  For example, binary has two symbols, 1 and 0, while hexadecimal uses sixteen, 0 through 9 plus A through F.  Yet, the common factor between the systems is that any quantity may be represented regardless of the system used.", "Other number systems use different sets of symbols. For example, binary has two symbols, 1 and 0, while hexadecimal uses sixteen, 0 through 9 plus A through F. Yet, the common factor between the systems is that any quantity may be represented regardless of the system used."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["There are two methods used to distinguish between number systems.  One method is to write the base (also known as the radix) as a subscript at the end of a number, such as 11001   or EAC24    .  The  other method is to designate the base by letter after the number as in FF64h or 1100011b.", "There are two methods used to distinguish between number systems. One method is to write the base (also known as the radix) as a subscript at the end of a number, such as 11001 or EAC24 . The other method is to designate the base by letter after the number as in FF64h or 1100011b.", "2ourteennnnnnnennnnnnnnnnnnred sixty-fiveee", "16urteennnnnnnennnnnnnnnnnnred sixty-fiveee"], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["Throughout much of the world, the decimal system is the standard, so the radix of a decimal number is rarely indicated. Still, when working with different number systems, the base should always be shown to avoid confusion.  Without the base, 10101 could be interpreted as binary, decimal or hexadecimal.", "Throughout much of the world, the decimal system is the standard, so the radix of a decimal number is rarely indicated. Still, when working with different number systems, the base should always be shown to avoid confusion. Without the base, 10101 could be interpreted as binary, decimal or hexadecimal."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["All modern number systems are positional, where each number's position indicates its relative value.  In the decimal system, for example, each position has a value ten times greater than the one to its immediate right.  This method of number representation is known as positional notation.", "All modern number systems are positional, where each number's position indicates its relative value. In the decimal system, for example, each position has a value ten times greater than the one to its immediate right. This method of number representation is known as positional notation.", "10,000's 1,000's 100's 10's 1's", "5 5 3 4 2"], "jumps": ["P2090", "P2060"]}, {"id": "P2090", "text": ["An example of a non-positional number system is the roman numeral system.  In this system the value of a position varies as the count increases or decreases.", "An example of a non-positional number system is the roman numeral system. In this system the value of a position varies as the count increases or decreases.", "1 = I 2 = II 3 = III 4 = IV 5 = VVVIV 5 = VV", "6 = VI 7 = VII 8 = VIII 9 = IX 10 = X"], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["The left-most digit of any numerical quantity has the largest value in any positional number system.  This digit is referred to as MSD (most significant digit) except for binary where it is called the most significant bit (MSB).  The right-most digit is called the least significant digit (LSD) or LSB for binary.", "The left-most digit of any numerical quantity has the largest value in any positional number system. This digit is referred to as MSD (most significant digit) except for binary where it is called the most significant bit (MSB). The right-most digit is called the least significant digit (LSD) or LSB for binary."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["Consider the decimal number 4356.  The 4, the left-most digit, has a value of 4000, the 3, 300, the 5, 50 and 6 represents 6.  The left-most digit has the greatest value while the 6 has the least.  This number could be written as 4000 + 300 + 50 + 6 or in scientific notation as: (4x10  ) + (3x10  ) + (5x10  ) + (6x10  ).", "Consider the decimal number 4356. The 4, the left-most digit, has a value of 4000, the 3, 300, the 5, 50 and 6 represents 6. The left-most digit has the greatest value while the 6 has the least. This number could be written as 4000 + 300 + 50 + 6 or in scientific notation as: (4x10 ) + (3x10 ) + (5x10 ) + (6x10 ).", "4,0 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
