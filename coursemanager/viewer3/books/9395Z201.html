const book = {"title": "9395Z201", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . .", "Title: BASIC POWER DISTRIBUTIONasd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe the operation of a Basic Power Distribution System. w Identify the basic requirements for a Power Distribution System. w Identify the various components of Basic Power Distribution Systems...", "w Observe the operation of a Basic Power Distribuition System. w Observe faults in a Basic Power Distribution System....................................."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P331", "text": ["b b HHH HHGHGHGG GHG bbbbbbbbbbbbbbb", "HGHHHGHHGHuHGGGHGHHGHHGHHHHGGHHHGGHGGHHGHGbG HHHHGuH", "HGGGHGHGHGHHGHGHHGGGHGHGGGGGHHGGHG GGGGGGG", "G G G G G G bbb G G G G G G G G H G G G GGG", "G G GGHuHH9uHHuH GGHG G G GGHGGGG G G b G q", "bb H GGHHHHHHHGGHHGGGHHHHGGHHHGHHGHHH GGG HHHHHHHHHHH"], "jumps": ["P"]}, {"id": "P400", "text": ["All aircraft use and contain some type of power distribution system to route DC and AC power to the many electrical and electronic systems on an aircraft.", "All aircraft use and contain some type of power distribution system to route DC and AC power to the many electrical and electronic systems on an aircraft. cause it provides power to the computer system and instrument panel, it is considered vital. It does however, provide power to many other systems."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["An aircraft's safety of flight depends on a well designed power distribution system.  Power distribution systems must be designed to ensure critical aircraft systems are always available, even in an emergency situation.", "An aircraft's safety of flight depends on a well designed power distribution system. Power distribution systems must be designed to ensure critical aircraft systems are always available, even in an emergency situation."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["In this lesson we will look at the operation of a basic power distribution system.  Knowing how a power distribution system works will help in the effective troubleshooting of a faulty system.", "In this lesson we will look at the operation of a basic power distribution system. Knowing how a power distribution system works will help in the effective troubleshooting of a faulty system."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Let's begin the lesson on BASIC POWER DISTRIBUTION........................"], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["One of the most important systems on an aircraft is the power distribution system.  The power distribution system is used to       transfer power from a multitude of sources to any device on the    aircraft requiring power.", "One of the most important systems on an aircraft is the power distribution system. The power distribution system is used to transfer power from a multitude of sources to any device on the aircraft requiring power."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Examples of power sources would be; a battery, DC alternators, DC starter generators, AC alternators, and external power.  A battery is used only to start the engine and in emergency situations.  External power can only be used when a plane is on the ground.", "Examples of power sources would be; a battery, DC alternators, DC starter generators, AC alternators, and external power. A battery is used only to start the engine and in emergency situations. External power can only be used when a plane is on the ground."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["All power sources are connected to a bus bar.  A bus bar is a simple copper bar capable of handling all of the power being transferred throughout the system.  Between the power sources and the bus there are protective devices.", "All power sources are connected to a bus bar. A bus bar is a simple copper bar capable of handling all of the power being transferred throughout the system. Between the power sources and the bus there are protective devices."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["These protective devices include relays, current limiters, and switches.  In the case of generators and alternators, current limiters are used to disconnect them from the bus if a problem occurs that could result in damage or undesired effects on the bus.", "These protective devices include relays, current limiters, and switches. In the case of generators and alternators, current limiters are used to disconnect them from the bus if a problem occurs that could result in damage or undesired effects on the bus."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["For external power, a relay is used to make sure that power is attached to the aircraft properly.  If power isn't connected           properly, the relay won't allow the external power to be connected to the bus.", "For external power, a relay is used to make sure that power is attached to the aircraft properly. If power isn't connected properly, the relay won't allow the external power to be connected to the bus."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["Relays also are used to keep power flowing in one direction.  The Reverse Current Relay (RCR) prevents battery or external power from flowing towards the alternator when the alternator is idle.", "Relays also are used to keep power flowing in one direction. The Reverse Current Relay (RCR) prevents battery or external power from flowing towards the alternator when the alternator is idle.ernator."], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["Once the alternator is producing enough power, the RCR closes and connects the alternator to the main bus.", "Once the alternator is producing enough power, the RCR closes and connects the alternator to the main bus.. Remember, a diode allows current flow in one direction, but not the other."], "jumps": ["P1087", "P1020"]}, {"id": "P1087", "text": ["Pouvez-vous identifier les dispositifs de protection dans ce sch", "XL2???r distribution system is used to transfer power from a multitude of sources to any device on the aircraft requiring power."], "jumps": ["P1090", "P1020"]}, {"id": "P1090", "text": ["Which of the following protective devices is used to disconnect faulty power generation units from the bus?"], "jumps": ["P1087"]}, {"id": "P1091", "text": [], "jumps": []}, {"id": "P1092", "text": ["Relays are used to prevent external power from being applied to the bus incorrectly and to protect the alternator from reverse current.", "Relays are used to prevent external power from being applied to the bus incorrectly and to protect the alternator from reverse current.f power coming from a source already supplying power to the bus..."], "jumps": []}, {"id": "P1093", "text": ["Circuit breakers protect the bus from faulty loads.  Another device protects the bus from faulty generation devices.", "Circuit breakers protect the bus from faulty loads. Another device protects the bus from faulty generation devices."], "jumps": []}, {"id": "P1100", "text": ["The main bus provides power to equipment and secondary busses, such as an avionics bus.  The main bus is protected from indiviual equipment or circuit faults by circuit breakers.", "The main bus provides power to equipment and secondary busses, such as an avionics bus. The main bus is protected from indiviual equipment or circuit faults by circuit breakers."], "jumps": ["P1102", "P1090"]}, {"id": "P1102", "text": ["The main bus circuit breakers are usually located in the cockpit to allow for easy reset when the faults are fixed. rom indiviual equipment or circuit faults by circuit breakers."], "jumps": ["P1110", "P1100"]}, {"id": "P1110", "text": ["An instrument, a light, or any piece of electrical equipment connected to the bus is referred to as a load.", "An instrument, a light, or any piece of electrical equipment connected to the bus is referred to as a load. loads, essential and non-essential."], "jumps": ["P1112", "P1100"]}, {"id": "P1112", "text": ["Essential loads include the minimum devices needed to safely fly an aircraft.  These loads are often found on a secondary power bus or essential bus.", "Essential loads include the minimum devices needed to safely fly an aircraft. These loads are often found on a secondary power bus or essential bus."], "jumps": ["P1114", "P1110"]}, {"id": "P1114", "text": ["In the event of alternator failure, the battery, on general aviation aircraft, will power the main bus.  Since the battery has a very limited life, all non-essential items should be turned off to conserve power.", "In the event of alternator failure, the battery, on general aviation aircraft, will power the main bus. Since the battery has a very limited life, all non-essential items should be turned off to conserve power..."], "jumps": ["P1120", "P1110"]}, {"id": "P1120", "text": ["All loads are rated for their level of power consumption.  This is important when power sources become faulty and power becomes limited.  In the Liberty XL2 example the loads on the bus are 184.5 amps maximum.", "All loads are rated for their level of power consumption. This is important when power sources become faulty and power becomes limited. In the Liberty XL2 example the loads on the bus are 184.5 amps maximum. for different loads. The values below are examples they do not represent values used in aircraft."], "jumps": ["P1127", "P1110"]}, {"id": "P1127", "text": ["Adding the avionics bus the secondary power bus requirements, the Liberty generation system must produce a minimum of 253.5 amps.ads, essential and non-essential."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["The alernator in the power generation system must be capable of providing more power than the sum of the loads.  In this system, the loads sum up to 253.5 amps and the alternator is rated at 300 amps.", "The alernator in the power generation system must be capable of providing more power than the sum of the loads. In this system, the loads sum up to 253.5 amps and the alternator is rated at 300 amps."], "jumps": ["P1140", "P1110"]}, {"id": "P1137", "text": ["But what if the alternator fails in flight and the battery, only rated at 100 amps, must be used?f the loads. In this system, the loads sum up to 253.5 amps and the alternator is rated at 300 amps."], "jumps": ["P1140", "P1130"]}, {"id": "P1140", "text": ["The power rating of the battery is not large enough to power all of the Liberty XL2 systems.  In this case, the pilot should turn off any system that is not essential to flight to reduce the load to less then 100 amps.  For example:", "The power rating of the battery is not large enough to power all of the Liberty XL2 systems. In this case, the pilot should turn off any system that is not essential to flight to reduce the load to less then 100 amps. For example: conditioning power can be disconnected from the bus to lessen the load on the system."], "jumps": ["P1150", "P1110"]}, {"id": "P1150", "text": ["Now the battery can effectively provide power to the bus until the generator can be fixed.  Remember, the battery is only used when starting the engine and in emergency situations, and is normally  being charged by the generators in normal operation.", "Now the battery can effectively provide power to the bus until the generator can be fixed. Remember, the battery is only used when starting the engine and in emergency situations, and is normally being charged by the generators in normal operation."], "jumps": ["P1160", "P1110"]}, {"id": "P1157", "text": ["Which systems would you turn off to reduce your loads to less than 100 amps?e bus is referred to as a load. loads, essential and non-essential."], "jumps": ["P1160", "P1137"]}, {"id": "P1160", "text": ["What must the secondary power source (secondary battery) be rated to support the secondary power bus?"], "jumps": ["P1110"]}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1162", "text": ["To determine the minimum rating of a power source, add up the circuit breaker values.  The source amperage must be greater than the total bus amperage.", "To determine the minimum rating of a power source, add up the circuit breaker values. The source amperage must be greater than the total bus amperage."], "jumps": []}, {"id": "P1170", "text": ["A master switch is provided to disconnect power from the bus. On some aircraft this may only disconnect the battery, and on others, both the battery and the generators.  If the generators are not controlled by the master switch, they will have individual switches to disconnect them.", "A master switch is provided to disconnect power from the bus. On some aircraft this may only disconnect the battery, and on others, both the battery and the generators. If the generators are not controlled by the master switch, they will have individual switches to disconnect them."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["Another important component of the power distribution system is the ammeter.  An ammeter will indicate to a pilot how much power an alternator is producing.  This is important when power is limited and loads need to be removed to boost the output of the generators.", "Another important component of the power distribution system is the ammeter. An ammeter will indicate to a pilot how much power an alternator is producing. This is important when power is limited and loads need to be removed to boost the output of the generators."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["Some ammeters don't need to be monitored by the pilot.  In automatic systems, current sensing devices determine if too much power is being used on the bus.  Different relays will disconnect different loads automatically based on their importance to flight.", "Some ammeters don't need to be monitored by the pilot. In automatic systems, current sensing devices determine if too much power is being used on the bus. Different relays will disconnect different loads automatically based on their importance to flight............."], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["This importance of loads is known as Load Hierarchy.  This means when systems are designed, essential loads are placed on the bus system in places where faults are least likely to occur. This makes disconnecting non-essential loads much easier.", "This importance of loads is known as Load Hierarchy. This means when systems are designed, essential loads are placed on the bus system in places where faults are least likely to occur. This makes disconnecting non-essential loads much easier."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["The unit that controls the bus is called the bus power control unit.  There are many different control and monitoring units that feed into the bus power control unit.  These units are constantly monitored to provide complete uninterrupted power.", "The unit that controls the bus is called the bus power control unit. There are many different control and monitoring units that feed into the bus power control unit. These units are constantly monitored to provide complete uninterrupted power.", "Automatic Power Distribution System Control"], "jumps": ["P1220", "P1190"]}, {"id": "P1220", "text": ["Some units are even designed to identify the exact location of faults in the system.  It is important to note that not all planes     have a bus power control unit, power use and supply has to be    monitored by the pilot or copilot.", "Some units are even designed to identify the exact location of faults in the system. It is important to note that not all planes have a bus power control unit, power use and supply has to be monitored by the pilot or copilot."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["The unit which can automatically control the operation of the power distribution system is known as the _______"], "jumps": ["P1210"]}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1232", "text": ["The Bus Power Control Unit is used to automatically control the operation of the power distribution system.  Remember, not all      airplanes have this system and control of the bus is performed     manually while observing indicators.", "The Bus Power Control Unit is used to automatically control the operation of the power distribution system. Remember, not all airplanes have this system and control of the bus is performed manually while observing indicators......."], "jumps": []}, {"id": "P1240", "text": ["On light twin engine aircraft, the battery normally connects to a battery bus, not directly to the main bus.  The battery bus is than connected to the main bus and the emergency bus, or essential bus.", "On light twin engine aircraft, the battery normally connects to a battery bus, not directly to the main bus. The battery bus is than connected to the main bus and the emergency bus, or essential bus.al equipment only."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["Since some systems require AC instead of DC, static inverters  are used on the emergency bus which change the battery DC to AC when needed in emergency situations.", "Since some systems require AC instead of DC, static inverters are used on the emergency bus which change the battery DC to AC when needed in emergency situations."], "jumps": ["P1260", "P1240"]}, {"id": "P1252", "text": ["Since some systems require AC instead of DC, static inverters  are used on the emergency bus which change the battery DC to AC when needed in emergency situations.", "Since some systems require AC instead of DC, static inverters are used on the emergency bus which change the battery DC to AC when needed in emergency situations."], "jumps": ["P1260", "P1240"]}, {"id": "P1255", "text": ["STATIC INVERTERS - A static inverter changes 24 - 28 Vdc to 115 Vac to power essential AC systems such as flight instruments and avionics equipment.eeded in normal operation; However, if the generators fail, the battery's voltage must be converted for the essential loads requiring AC voltage. Most static inverters will change 28 Vdc to 115 Vac single phase."], "jumps": []}, {"id": "P1260", "text": ["On many twin engine turboprops and jets, AC generators are used to provide power.  A transformer rectifier is used to change the AC to DC for poweirng the DC bus circuits and equipment.", "On many twin engine turboprops and jets, AC generators are used to provide power. A transformer rectifier is used to change the AC to DC for poweirng the DC bus circuits and equipment. output of the generator is also applied to a transformer- rectifier-unit which converts the AC voltage to DC."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["In most cases this DC voltage is 28 Vdc.  The output of the transformer-rectifier-unit is connected to a DC bus.", "In most cases this DC voltage is 28 Vdc. The output of the transformer-rectifier-unit is connected to a DC bus."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["Remember, the negative side of the aircraft power generation system is connected to the aircraft structure.  This makes all aircraft busses positive.", "Remember, the negative side of the aircraft power generation system is connected to the aircraft structure. This makes all aircraft busses positive.ne structure, provided that it is conductive."], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["Even though aircraft look different and the location of electrical equipment is rarely in the same place, the basic power distribution system will be electrically structured the same.conductive."], "jumps": ["P1910", "P1280"]}, {"id": "P1910", "text": ["This completes the information on BASIC POWER DISTRIBUTION.", "This completes the information on BASIC POWER DISTRIBUTION..."], "jumps": ["P1001", "P1290"]}, {"id": "P1920", "text": ["1.  All power sources are connected to a bus bar.  A bus bar is a         simple copper bar capable of handling all of the power being         transferred throughout the system.  Between the power                   sources and the bus there are protective devices.", "1. All power sources are connected to a bus bar. A bus bar is a simple copper bar capable of handling all of the power being transferred throughout the system. Between the power sources and the bus there are protective devices."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. An instrument, light, piece of equipment, etc., attached to the bus is referred to as a load. There are two main types of loads, essential and non-essential. Essential loads are the minimum number of devices needed to safely fly an aircraft. Non-essential loads are loads which are not necessary for flight."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Another important component of the power distribution                   system is the ammeter.  An ammeter will indicate to a pilot or          copilot how much power a generator is producing.  This is             important when power is limited and loads need to be                      removed to boost the generators output.", "3. Another important component of the power distribution system is the ammeter. An ammeter will indicate to a pilot or copilot how much power a generator is producing. This is important when power is limited and loads need to be removed to boost the generators output."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  This importance of loads is known as Load Hierarchy.  This           means when systems are designed, essential loads are                   placed on the bus system in places where faults are least                likely to occur.  This makes disconnecting non-essential                 loads much easier.", "4. This importance of loads is known as Load Hierarchy. This means when systems are designed, essential loads are placed on the bus system in places where faults are least likely to occur. This makes disconnecting non-essential loads much easier."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. In most aircraft there is both AC and DC power busses. Generators normally make AC voltage and are applied directly to the AC bus. This AC voltage is known as three-phase, and is normally 115 Vac. The output of the generator is applied also to a transformer- rectifier-unit which converts the AC voltage to DC."], "jumps": ["P1999", "P1950"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1960"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["In this experiment, you will look at the operation of a basic power distribution system.  By understanding this operation,                  troubleshooting of a faulty system can be quick and effective.", "In this experiment, you will look at the operation of a basic power distribution system. By understanding this operation, troubleshooting of a faulty system can be quick and effective."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["The circuits are mounted on two circuit cards.  The controls, components and indicators represent different sections of an        aircraft power distribution system.", "The circuits are mounted on two circuit cards. The controls, components and indicators represent different sections of an aircraft power distribution system."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["The PC130-735 card is the AC to DC generator system.  This card will provide two balanced DC voltages.  For this experiment, we will only be concerned with one of them.", "The PC130-735 card is the AC to DC generator system. This card will provide two balanced DC voltages. For this experiment, we will only be concerned with one of them..."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["The trainer will simulate the generator outputs.  Inside a generator AC voltage is produced which is converted to a pulsating DC waveform using diodes and capacitors.", "The trainer will simulate the generator outputs. Inside a generator AC voltage is produced which is converted to a pulsating DC waveform using diodes and capacitors."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["This output from the generator will be directed to the Voltage Regulator circuit.  This circuit will adjust the output voltage level   of the generator and balance the voltage.", "This output from the generator will be directed to the Voltage Regulator circuit. This circuit will adjust the output voltage level of the generator and balance the voltage."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["The balance adjusts the difference between the two voltage outputs.  Both outputs should be exactly the same to provide correct current flow.  We will be balancing the two voltages, but again only using one of them.", "The balance adjusts the difference between the two voltage outputs. Both outputs should be exactly the same to provide correct current flow. We will be balancing the two voltages, but again only using one of them."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["Switches S1 and S2 are used to turn on and off the output of the generators.  The output we will be using is 12 volts DC.", "Switches S1 and S2 are used to turn on and off the output of the generators. The output we will be using is 12 volts DC."], "jumps": ["P2090", "P2040"]}, {"id": "P2090", "text": ["The PC130-734 card is the basic power distribution card.  Pick it up and examine it.", "The PC130-734 card is the basic power distribution card. Pick it up and examine it."], "jumps": ["P2100", "P2040"]}, {"id": "P2100", "text": ["To the left of the bus are the inputs and controls to the power distribution system.  For this system we have an alternator input, generator 1 from PC130-735, and a simulated battery input.", "To the left of the bus are the inputs and controls to the power distribution system. For this system we have an alternator input, generator 1 from PC130-735, and a simulated battery input."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["There are four indicators and two switches in this area of the card.  Two LEDs are used to indicate if power is being applied from its associated source.", "There are four indicators and two switches in this area of the card. Two LEDs are used to indicate if power is being applied from its associated source."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["The other two LEDs are used to indicate the status of the aircraft's engine.  This is important because this engine powers the alternator (generator) that we are using.", "The other two LEDs are used to indicate the status of the aircraft's engine. This is important because this engine powers the alternator (generator) that we are using."], "jumps": ["P2130", "P2100"]}, {"id": "P2130", "text": ["S2 is used to start the engine and S1 is used to control all bus input power.  With this switch off, the entire power to the    aircraft is off.", "S2 is used to start the engine and S1 is used to control all bus input power. With this switch off, the entire power to the aircraft is off."], "jumps": ["P2140", "P2100"]}, {"id": "P2140", "text": ["On the right side of the bus there are two sections; protection circuits and loads.  The protection circuits, circuit breakers, are     used to prevent a faulty load from altering power delivered to other sections of the aircraft.", "On the right side of the bus there are two sections; protection circuits and loads. The protection circuits, circuit breakers, are used to prevent a faulty load from altering power delivered to other sections of the aircraft."], "jumps": ["P2150", "P2100"]}, {"id": "P2150", "text": ["The loads just represent arbitrary loads that would be seen on an aircraft.  The LEDs located within the load illustrations indicate if power is being applied to them.", "The loads just represent arbitrary loads that would be seen on an aircraft. The LEDs located within the load illustrations indicate if power is being applied to them."], "jumps": ["P2160", "P2100"]}, {"id": "P2160", "text": ["Let's begin the experiment.", "Let's begin the experiment.e..............................."], "jumps": ["P2170", "P2100"]}, {"id": "P2170", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2160"]}, {"id": "P2180", "text": ["2.  Insert PC130-735 into the PC1 position. \n3.  Set the card settings as follows:\n     S1 - OFF (down)    R3 - Fully CCW\n     S2 - OFF (down)    R4 - Fully CCW", "2. Insert PC130-735 into the PC1 position. 3. Set the card settings as follows: S1 - OFF (down) R3 - Fully CCW S2 - OFF (down) R4 - Fully CCW"], "jumps": ["P2170"]}, {"id": "P2190", "text": ["4.  Insert PC130-734 into the PC2 position. \n5.  Set the card settings as follows: \n     S1 - OFF (left)   \n     S3 - OFF (down)", "4. Insert PC130-734 into the PC2 position. 5. Set the card settings as follows: S1 - OFF (left) S3 - OFF (down)"], "jumps": ["P2180"]}, {"id": "P2200", "text": ["6.  Set the Positive Supply Control to 11.  The Voltmeter should          indicate 11 volts.", "6. Set the Positive Supply Control to 11. The Voltmeter should indicate 11 volts. nsole's voltage meter should indicate 11 volts."], "jumps": ["P2190"]}, {"id": "P2210", "text": ["7.  Press the FILAMENT power switch to ON. \n8.  Press PC1 AC POWER switch to ON. \n9.  Press PC2 DC POWER switch to ON.", "7. Press the FILAMENT power switch to ON. 8. Press PC1 AC POWER switch to ON. 9. Press PC2 DC POWER switch to ON."], "jumps": ["P2200"]}, {"id": "P2220", "text": ["The next step is to set up the voltages from the AC to DC generator card.  This is important for proper operation.  This step will require a multimeter.", "The next step is to set up the voltages from the AC to DC generator card. This is important for proper operation. This step will require a multimeter."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["1.  Set the multimeter to measure DC voltage and connect it from       TP2 to TP4.  The voltage represented on the multimeter                    indicates the difference in voltage between the two                            generators.", "1. Set the multimeter to measure DC voltage and connect it from TP2 to TP4. The voltage represented on the multimeter indicates the difference in voltage between the two generators."], "jumps": ["P2240", "P2220", "P2235"]}, {"id": "P2235", "text": ["PC130-735 MEASUREMENT SETUP - Measure the voltage from TP2 to TP4."], "jumps": []}, {"id": "P2240", "text": ["2.  Adjust R4 until the multimeter indicates zero volts.  This                  indicates that the voltages are identical.", "2. Adjust R4 until the multimeter indicates zero volts. This indicates that the voltages are identical. raphics text) NOTE The voltage will not be exactly zero, the lowest millivolt value obtained is acceptable.", "The voltage will not be exactly zero, the lowest millivolt value obtained is acceptable."], "jumps": ["P2250", "P2230", "P2245"]}, {"id": "P2245", "text": ["MEASUREMENT SETUP - Adjust R4 until the multimeter indicates zero volts."], "jumps": []}, {"id": "P2250", "text": ["Disconnect the ground lead from TP4 and connect it to ground. This voltage represents both voltages at their current level. 3. Adjust R3 for a 13 volt signal on the multimeter. Both voltages are now at 13 volts."], "jumps": ["P2260", "P2240", "P2255"]}, {"id": "P2255", "text": ["MEASUREMENT SETUP - Disconnect the ground lead from TP4 and connect it to ground. Adjust R3 for 12 volts."], "jumps": []}, {"id": "P2260", "text": ["The AC to DC generator circuit is now working properly. \n4.  Set S1 to ON, or the up position.  Let's now look at the                      operation of a basic power distribution system.", "The AC to DC generator circuit is now working properly. 4. Set S1 to ON, or the up position. Let's now look at the operation of a basic power distribution system."], "jumps": ["P2270", "P2250", "P2265"]}, {"id": "P2265", "text": ["MEASUREMENT SETUP - Set S1 to ON (up) on the PC130-735."], "jumps": []}, {"id": "P2270", "text": ["Looking at the PC130-734 we will assume that both the alternator and battery power are off.  The first thing we will need to do is turn the master switch on so the aircraft can be started.", "Looking at the PC130-734 we will assume that both the alternator and battery power are off. The first thing we will need to do is turn the master switch on so the aircraft can be started."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["5.  Set S1 to the ON position, or right.  The battery power to bus          LED should illuminate along with the instrument panel and             cabin lights.  The fasten seatbelt LED would illuminate if it               were turned on.", "5. Set S1 to the ON position, or right. The battery power to bus LED should illuminate along with the instrument panel and cabin lights. The fasten seatbelt LED would illuminate if it were turned on."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["At this point, battery power is being supplied to the bus.  Since battery power is limited and really only used to start the engine,    let's start the engine.", "At this point, battery power is being supplied to the bus. Since battery power is limited and really only used to start the engine, let's start the engine."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["6.  While observing the LEDs of the PC130-734 card press and           release the S2 \"Start\" switch.  What did you observe?", "6. While observing the LEDs of the PC130-734 card press and release the S2 \"Start\" switch. What did you observe?", "The starter light illuminated and then went off.", "The engine light illuminated after a short time and stayed illuminated.", "The bus power switched from the battery to the alternator......................................................."], "jumps": ["P2290", "P2305"]}, {"id": "P2301", "text": [], "jumps": []}, {"id": "P2302", "text": ["You should have observed all of the choices.  If you didn't, check your setup or ask your instructor for assistance.", "You should have observed all of the choices. If you didn't, check your setup or ask your instructor for assistance."], "jumps": []}, {"id": "P2305", "text": ["MEASUREMENT SETUP - Press and release the S2 start button."], "jumps": []}, {"id": "P2310", "text": ["When you pressed the start button, the starter turned on to start the engine.  Releasing the button disengaged the starter.  Since the alternator is now generating power it powers the bus.", "When you pressed the start button, the starter turned on to start the engine. Releasing the button disengaged the starter. Since the alternator is now generating power it powers the bus."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["If you measured the alternator voltage (TP1 to ground) and the battery voltage (TP1 to TP5) before pressing the start button, you may have noticed that the alternator voltage is approximately 3 V more than the battery voltage.  This is so the alternator power can power the bus and charge the battery at the same time.", "If you measured the alternator voltage (TP1 to ground) and the battery voltage (TP1 to TP5) before pressing the start button, you may have noticed that the alternator voltage is approximately 3 V more than the battery voltage. This is so the alternator power can power the bus and charge the battery at the same time."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["At this point, the power distribution system is working properly. Let's cause the alternator to fail and see what happens to the system."], "jumps": ["P2320"]}, {"id": "P2340", "text": ["What happened to the power applied to the bus?", "What happened to the power applied to the bus?.............", "The alternator continued to supply power.", "Neither sources supply the bus with power."], "jumps": ["P2330"]}, {"id": "P2341", "text": [], "jumps": []}, {"id": "P2342", "text": ["When the alternator cut off, the battery should have begun to power the bus.  Check your setup or ask your instructor for assistance.", "When the alternator cut off, the battery should have begun to power the bus. Check your setup or ask your instructor for assistance."], "jumps": []}, {"id": "P2350", "text": ["It is important for the battery to supply power to the bus when all other sources are disabled.  If the battery didn't supply power no  power would be available in the aircraft.", "It is important for the battery to supply power to the bus when all other sources are disabled. If the battery didn't supply power no power would be available in the aircraft."], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["Most batteries can supply necessary power for about an half hour.  This gives pilots a chance to land or fix the problem. Without any power, the aircraft would become non-operational in flight.", "Most batteries can supply necessary power for about an half hour. This gives pilots a chance to land or fix the problem. Without any power, the aircraft would become non-operational in flight."], "jumps": ["P2370", "P2350"]}, {"id": "P2370", "text": ["Let's say we were able to get the alternator working again.  Since battery power is limited, let's reconnect it to the bus and see what happens.", "Let's say we were able to get the alternator working again. Since battery power is limited, let's reconnect it to the bus and see what happens."], "jumps": ["P2350", "P2380"]}, {"id": "P2380", "text": ["The alternator has been reconnected to the bus.  As you can see, power to the bus is now delivered from the alternator.  It is important to note that the an actual aircraft battery would be recharging again.", "The alternator has been reconnected to the bus. As you can see, power to the bus is now delivered from the alternator. It is important to note that the an actual aircraft battery would be recharging again."], "jumps": ["P2370"]}, {"id": "P2390", "text": ["The last thing that we are going to look at is circuit protection.  It is very important that faulty loads are isolated from the bus.", "The last thing that we are going to look at is circuit protection. It is very important that faulty loads are isolated from the bus."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["If you had a faulty load that shorted voltage to ground, all other loads would not operate and the power source may become damaged."], "jumps": ["P2410", "P2390"]}, {"id": "P2410", "text": ["To be certain that loads can be isolated from the bus, a circuit breaker is used.  When a load becomes faulty the circuit breaker   actually disconnects it from the bus.", "To be certain that loads can be isolated from the bus, a circuit breaker is used. When a load becomes faulty the circuit breaker actually disconnects it from the bus."], "jumps": ["P2420", "P2390"]}, {"id": "P2420", "text": ["Let's create a faulty load on the bus and observe the operation of the circuit breaker."], "jumps": ["P2410"]}, {"id": "P2430", "text": ["You should have observed circuit breaker one pop-out and the instrument panel light turn off.  At this point the instrument panel  has been isolated from the bus.", "You should have observed circuit breaker one pop-out and the instrument panel light turn off. At this point the instrument panel has been isolated from the bus."], "jumps": ["P2410"]}, {"id": "P2440", "text": ["Let's say we have fixed the fault in the instrument panel.  To reconnect power you need to reset the circuit breaker.  For this     particular model just push in the red button until it locks.", "Let's say we have fixed the fault in the instrument panel. To reconnect power you need to reset the circuit breaker. For this particular model just push in the red button until it locks."], "jumps": ["P2450", "P2430"]}, {"id": "P2450", "text": ["You should observe that the instrument panel light is now on.  If a load is critical and needed for flight, being able to reconnect it    to the system is important, provided it can be fixed.", "You should observe that the instrument panel light is now on. If a load is critical and needed for flight, being able to reconnect it to the system is important, provided it can be fixed."], "jumps": ["P2451", "P2440"]}, {"id": "P2451", "text": ["Let's create another fault on the bus and determine which load is malfunctioning.", "Let's create another fault on the bus and determine which load is malfunctioning. tch to ON........................................."], "jumps": ["P2450"]}, {"id": "P2460", "text": ["Which load has a fault and has been isolated from the bus?", "Which load has a fault and has been isolated from the bus?."], "jumps": ["P2450"]}, {"id": "P2461", "text": [], "jumps": []}, {"id": "P2462", "text": ["The second circuit breaker should have popped out.  The component faulted is the component connected to this circuit breaker, cabin lights.  Check your setup or ask your instructor for assistance.", "The second circuit breaker should have popped out. The component faulted is the component connected to this circuit breaker, cabin lights. Check your setup or ask your instructor for assistance...."], "jumps": []}, {"id": "P2470", "text": ["Assume that you have fixed your cabin lights and that you are ready to attach them to the bus.  Press the red button that is extending from the second circuit breaker.  The four lights should illuminate.", "Assume that you have fixed your cabin lights and that you are ready to attach them to the bus. Press the red button that is extending from the second circuit breaker. The four lights should illuminate......."], "jumps": []}, {"id": "P2480", "text": ["As you can see, there are many important sections to a basic power distribution system.  While the actual structure of a system may be different, its basic operation is the same.", "As you can see, there are many important sections to a basic power distribution system. While the actual structure of a system may be different, its basic operation is the same."], "jumps": ["P2490", "P2470"]}, {"id": "P2490", "text": ["Without the proper knowledge of a basic bus system, troubleshooting can be time consuming and costly."], "jumps": ["P2500", "P2480"]}, {"id": "P2500", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": ["P2480"]}, {"id": "P2510", "text": ["2.  Set the Console Power Switch to OFF.", "2. Set the Console Power Switch to OFF...................."], "jumps": ["P2500"]}, {"id": "P2520", "text": ["3.  Remove all test equipment connections. \n4.  Remove all PC cards.   \n5.  Return all equipment to the designated storage areas.", "3. Remove all test equipment connections. 4. Remove all PC cards. 5. Return all equipment to the designated storage areas."], "jumps": ["P2910", "P2510"]}, {"id": "P2910", "text": ["This completes the experiment on BASIC POWER DISTRIBUTION OPERATION."], "jumps": ["P2001", "P2520"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["What is the purpose of the power distribution system?", "Release undesired heat from the operation of the generators.", "Adjust torque output from multi-prop aircraft engine.", "Transfer power from a multitude of sources to anything on the aircraft needing power.", "Relieves pressure on landing apparatus at landing and take-off."], "jumps": []}, {"id": "P10211", "text": ["To provide power to low load rated equipment.", "To provide power to lights in the galley."], "jumps": []}, {"id": "P10212", "text": ["Which of the following is NOT a protective device?"], " nerators of an aircraft fail, it is acceptable to have NO power available in the aircraft."], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is 20%. Do you want to _________"], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P13020", "text": ["In this experiment, you will look at the operation of a basic power distribution system.  By understanding this operation,                  troubleshooting of a faulty system can be quick and effective.", "In this experiment, you will look at the operation of a basic power distribution system. By understanding this operation, troubleshooting of a faulty system can be quick and effective."], "jumps": ["P13030", "P2001"]}, {"id": "P13030", "text": ["The circuits are mounted on two circuit cards.  The controls, components and indicators represent different sections of an        aircraft power distribution system.", "The circuits are mounted on two circuit cards. The controls, components and indicators represent different sections of an aircraft power distribution system."], "jumps": ["P13040", "P13020"]}, {"id": "P13040", "text": ["The PC130-735 card is the AC to DC generator system.  This card will provide two balanced DC voltages.  For this experiment, we will only be concerned with one of them.", "The PC130-735 card is the AC to DC generator system. This card will provide two balanced DC voltages. For this experiment, we will only be concerned with one of them...."], "jumps": ["P13050", "P13020"]}, {"id": "P13050", "text": ["The trainer will simulate the generator outputs.  Inside a generator AC voltage is produced which is converted to a pulsating DC waveform using diodes and capacitors.", "The trainer will simulate the generator outputs. Inside a generator AC voltage is produced which is converted to a pulsating DC waveform using diodes and capacitors."], "jumps": ["P13060", "P13040"]}, {"id": "P13060", "text": ["This output from the generator will be directed to the Voltage Regulator circuit.  This circuit will adjust the output voltage level   of the generator and balance the voltage.", "This output from the generator will be directed to the Voltage Regulator circuit. This circuit will adjust the output voltage level of the generator and balance the voltage."], "jumps": ["P13070", "P13040"]}, {"id": "P13070", "text": ["The balance adjusts the difference between the two voltage outputs.  Both outputs should be exactly the same to provide correct current flow.  We will be balancing the two voltages, but again only using one of them.", "The balance adjusts the difference between the two voltage outputs. Both outputs should be exactly the same to provide correct current flow. We will be balancing the two voltages, but again only using one of them."], "jumps": ["P13080", "P13040"]}, {"id": "P13080", "text": ["Switches S1 and S2 are used to turn on and off the output of the generators.  The output we will be using is 12 volts DC.", "Switches S1 and S2 are used to turn on and off the output of the generators. The output we will be using is 12 volts DC."], "jumps": ["P13090", "P13040"]}, {"id": "P13090", "text": ["The PC130-734 card is the basic power distribution card.  Pick it up and examine it.", "The PC130-734 card is the basic power distribution card. Pick it up and examine it."], "jumps": ["P13100", "P13040"]}, {"id": "P13100", "text": ["To the left of the bus are the inputs and controls to the power distribution system.  For this system we have an alternator input, generator 1 from PC130-735, and a simulated battery input.", "To the left of the bus are the inputs and controls to the power distribution system. For this system we have an alternator input, generator 1 from PC130-735, and a simulated battery input."], "jumps": ["P13110", "P13090"]}, {"id": "P13110", "text": ["There are four indicators and two switches in this area of the card.  Two LEDs are used to indicate if power is being applied from its associated source.", "There are four indicators and two switches in this area of the card. Two LEDs are used to indicate if power is being applied from its associated source."], "jumps": ["P13120", "P13100"]}, {"id": "P13120", "text": ["The other two LEDs are used to indicate the status of the aircraft's engine.  This is important because this engine powers the alternator (generator) that we are using.", "The other two LEDs are used to indicate the status of the aircraft's engine. This is important because this engine powers the alternator (generator) that we are using."], "jumps": ["P13130", "P13100"]}, {"id": "P13130", "text": ["S2 is used to start the engine and S1 is used to control all bus input power.  With this switch off, the entire power to the    aircraft is off.", "S2 is used to start the engine and S1 is used to control all bus input power. With this switch off, the entire power to the aircraft is off."], "jumps": ["P13140", "P13100"]}, {"id": "P13140", "text": ["On the right side of the bus there are two sections; protection circuits and loads.  The protection circuits, circuit breakers, are     used to prevent a faulty load from altering power delivered to other sections of the aircraft.", "On the right side of the bus there are two sections; protection circuits and loads. The protection circuits, circuit breakers, are used to prevent a faulty load from altering power delivered to other sections of the aircraft."], "jumps": ["P13150", "P13100"]}, {"id": "P13150", "text": ["The loads just represent arbitrary loads that would be seen on an aircraft.  The LEDs located within the load illustrations indicate if power is being applied to them.", "The loads just represent arbitrary loads that would be seen on an aircraft. The LEDs located within the load illustrations indicate if power is being applied to them."], "jumps": ["P13160", "P13100"]}, {"id": "P13160", "text": ["Let's begin the experiment.", "Let's begin the experiment.e..............................."], "jumps": ["P13170", "P13100"]}, {"id": "P13170", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13160"]}, {"id": "P13180", "text": ["2.  Insert PC130-735 into the PC1 position. \n3.  Set the card settings as follows:\n     S1 - OFF (down)    R3 - Fully CCW\n     S2 - OFF (down)    R4 - Fully CCW", "2. Insert PC130-735 into the PC1 position. 3. Set the card settings as follows: S1 - OFF (down) R3 - Fully CCW S2 - OFF (down) R4 - Fully CCW"], "jumps": ["P13190"]}, {"id": "P13190", "text": ["4.  Insert PC130-734 into the PC2 position. \n5.  Set the card settings as follows: \n     S1 - OFF (left) \n     S3 - OFF (down)", "4. Insert PC130-734 into the PC2 position. 5. Set the card settings as follows: S1 - OFF (left) S3 - OFF (down)"], "jumps": ["P13200", "P13180"]}, {"id": "P13200", "text": ["6.  Press Enter to Set: Positive Supply Voltage - 12", "6. Press Enter to Set: Positive Supply Voltage - 12......................."], "jumps": ["P13190"]}, {"id": "P13210", "text": ["7.  Press Enter to Set: PC1 AC Power Switch - ON \n8.  Press Enter to Set: PC2 DC Power Switch - ON", "7. Press Enter to Set: PC1 AC Power Switch - ON 8. Press Enter to Set: PC2 DC Power Switch - ON"], "jumps": []}, {"id": "P13220", "text": ["The next step is to set up the voltages from the AC to DC generator card.  This is important for proper operation.  This step will require a multimeter.", "The next step is to set up the voltages from the AC to DC generator card. This is important for proper operation. This step will require a multimeter."], "jumps": ["P13230"]}, {"id": "P13230", "text": ["1.  Set the multimeter to measure DC voltage and connect it from        TP2 to TP4.  The voltage represented on the multimeter                    indicates the difference in voltage between the two                            generators.", "1. Set the multimeter to measure DC voltage and connect it from TP2 to TP4. The voltage represented on the multimeter indicates the difference in voltage between the two generators."], "jumps": ["P13240", "P13220", "P13235"]}, {"id": "P13235", "text": ["MEASUREMENT SETUP - Measure the voltage from TP2 to TP4."], "jumps": []}, {"id": "P13240", "text": ["2.  Adjust R4 until the multimeter indicates zero volts.  This                  indicates that the voltages are identical.", "2. Adjust R4 until the multimeter indicates zero volts. This indicates that the voltages are identical. raphics Text) NOTE The voltage will not be exactly zero, the lowest millivolt value obtained is acceptable."], "jumps": ["P13250", "P13230", "P13245"]}, {"id": "P13245", "text": ["MEASUREMENT SETUP - Adjust R4 until the multimeter indicates zero volts."], "jumps": []}, {"id": "P13250", "text": ["Disconnect the ground lead from TP4 and connect it to                    ground. This voltage represents both voltages at their current       level. \n3.  Adjust R3 for a 13 volt signal on the multimeter.  Both voltages      are now at 13 volts.", "Disconnect the ground lead from TP4 and connect it to ground. This voltage represents both voltages at their current level. 3. Adjust R3 for a 13 volt signal on the multimeter. Both voltages are now at 13 volts."], "jumps": ["P13260", "P13240", "P13255"]}, {"id": "P13255", "text": ["MEASUREMENT SETUP - Disconnect the ground lead from TP4 and connect it to ground.  Adjust R3 for 12 volts.", "MEASUREMENT SETUP - Disconnect the ground lead from TP4 and connect it to ground. Adjust R3 for 12 volts."], "jumps": []}, {"id": "P13260", "text": ["The AC to DC generator circuit is now working properly. \n4.  Set S1 to ON, or the up position.  Let's now look at the                      operation of a basic power distribution system.", "The AC to DC generator circuit is now working properly. 4. Set S1 to ON, or the up position. Let's now look at the operation of a basic power distribution system."], "jumps": ["P13270", "P13250", "P13265"]}, {"id": "P13265", "text": ["MEASUREMENT SETUP - Set S1 to ON (up) on the PC130-735."], "jumps": []}, {"id": "P13270", "text": ["Looking at the PC130-734 we will assume that both the alternator and battery power are off.  The first thing we will need to do is turn the master switch on so the aircraft can be started.", "Looking at the PC130-734 we will assume that both the alternator and battery power are off. The first thing we will need to do is turn the master switch on so the aircraft can be started."], "jumps": ["P13280", "P13260"]}, {"id": "P13280", "text": ["5.  Set S1 to the ON position, or right.  The battery power to bus          LED should illuminate along with the instrument panel and             cabin lights.  The fasten seatbelt LED would illuminate if it               were turned on.", "5. Set S1 to the ON position, or right. The battery power to bus LED should illuminate along with the instrument panel and cabin lights. The fasten seatbelt LED would illuminate if it were turned on."], "jumps": ["P13290", "P13270"]}, {"id": "P13290", "text": ["At this point, battery power is being supplied to the bus.  Since battery power is limited and really only used to start the engine,    let's start the engine.", "At this point, battery power is being supplied to the bus. Since battery power is limited and really only used to start the engine, let's start the engine."], "jumps": ["P13300", "P13280"]}, {"id": "P13300", "text": ["6.  While observing the LEDs of the PC130-734 card press and           release the S2 \"Start\" switch.  What did you observe?", "6. While observing the LEDs of the PC130-734 card press and release the S2 \"Start\" switch. What did you observe?", "The starter light illuminated and then went off.", "The engine light illuminated after a short time and stayed illuminated.", "The bus power switched from the battery to the alternator......................................................."], "jumps": ["P13290", "P13305"]}, {"id": "P13301", "text": [], "jumps": []}, {"id": "P13302", "text": ["You should have observed all of the choices.  If you didn't, check your setup or ask your instructor for assistance.", "You should have observed all of the choices. If you didn't, check your setup or ask your instructor for assistance."], "jumps": []}, {"id": "P13305", "text": ["MEASUREMENT SETUP - Press and release the S2 start button."], "jumps": []}, {"id": "P13310", "text": ["When you pressed the start button, the starter turned on to start the engine.  Releasing the button disengaged the starter.  Since the alternator is now generating power it powers the bus.", "When you pressed the start button, the starter turned on to start the engine. Releasing the button disengaged the starter. Since the alternator is now generating power it powers the bus."], "jumps": ["P13320", "P13300"]}, {"id": "P13320", "text": ["If you measured the alternator voltage (TP1 to ground) and the battery voltage (TP1 to TP5) before pressing the start button, you may have noticed that the alternator voltage is approximately 3 V more than the battery voltage.  This is so the alternator power can power the bus and charge the battery at the same time.", "If you measured the alternator voltage (TP1 to ground) and the battery voltage (TP1 to TP5) before pressing the start button, you may have noticed that the alternator voltage is approximately 3 V more than the battery voltage. This is so the alternator power can power the bus and charge the battery at the same time."], "jumps": ["P13330", "P13310"]}, {"id": "P13330", "text": ["At this point, the power distribution system is working properly. Let's cause the alternator to fail and see what happens to the        system.", "At this point, the power distribution system is working properly. Let's cause the alternator to fail and see what happens to the system."], "jumps": ["P13320"]}, {"id": "P13340", "text": ["What happened to the power applied to the bus?", "What happened to the power applied to the bus?.............", "The alternator continued to supply power.", "Neither sources supply the bus with power."], "jumps": []}, {"id": "P13341", "text": [], "jumps": []}, {"id": "P13342", "text": ["When the alternator cut off the battery should have begun to power the bus.  Check your setup or ask your instructor for assistance.", "When the alternator cut off the battery should have begun to power the bus. Check your setup or ask your instructor for assistance."], "jumps": []}, {"id": "P13350", "text": ["It is important for the battery to supply power to the bus when all other sources are disabled.  If the battery didn't supply power no  power would be available in the aircraft.", "It is important for the battery to supply power to the bus when all other sources are disabled. If the battery didn't supply power no power would be available in the aircraft."], "jumps": ["P13360", "P13340"]}, {"id": "P13360", "text": ["Most batteries can supply necessary power for about an half hour.  This gives pilots a chance to land or fix the problem.  Without any power, the aircraft would become non-operational in flight.", "Most batteries can supply necessary power for about an half hour. This gives pilots a chance to land or fix the problem. Without any power, the aircraft would become non-operational in flight."], "jumps": ["P13370", "P13350"]}, {"id": "P13370", "text": ["Let's say we were able to get the alternator working again.  Since battery power is limited, let's reconnect it to the bus and see what happens.", "Let's say we were able to get the alternator working again. Since battery power is limited, let's reconnect it to the bus and see what happens. I"], "jumps": ["P13350", "P13380"]}, {"id": "P13380", "text": ["The alternator has been reconnected to the bus.  As you can see, power to the bus is now delivered from the alternator.  It is         important to note that the an actual aircraft battery would be       recharging again.", "The alternator has been reconnected to the bus. As you can see, power to the bus is now delivered from the alternator. It is important to note that the an actual aircraft battery would be recharging again."], "jumps": []}, {"id": "P13390", "text": ["The last thing that we are going to look at is circuit protection.  It is very important that faulty loads are isolated from the bus.", "The last thing that we are going to look at is circuit protection. It is very important that faulty loads are isolated from the bus."], "jumps": ["P13400"]}, {"id": "P13400", "text": ["If you had a faulty load that shorted voltage to ground, all other loads would not operate and the power source may become damaged."], "jumps": ["P13410", "P13390"]}, {"id": "P13410", "text": ["To be certain that loads can be isolated from the bus, a circuit breaker is used.  When a load becomes faulty the circuit breaker   actually disconnects it from the bus.", "To be certain that loads can be isolated from the bus, a circuit breaker is used. When a load becomes faulty the circuit breaker actually disconnects it from the bus."], "jumps": ["P13420", "P13390"]}, {"id": "P13420", "text": ["Let's create a faulty load on the bus and observe the operation of the circuit breaker."], "jumps": ["P13410"]}, {"id": "P13430", "text": ["You should have observed circuit breaker one pop-out and the instrument panel light turn off.  At this point the instrument panel  has been isolated from the bus.", "You should have observed circuit breaker one pop-out and the instrument panel light turn off. At this point the instrument panel has been isolated from the bus."], "jumps": []}, {"id": "P13440", "text": ["Let's say we have fixed the fault in the instrument panel.  To reconnect power you need to reset the circuit breaker.  For this     particular model just push in the red button until it locks.", "Let's say we have fixed the fault in the instrument panel. To reconnect power you need to reset the circuit breaker. For this particular model just push in the red button until it locks."], "jumps": ["P13450", "P13430"]}, {"id": "P13450", "text": ["You should observe that the instrument panel light is now on.  If a load is critical and needed for flight, being able to reconnect it    to the system is important, provided it can be fixed.", "You should observe that the instrument panel light is now on. If a load is critical and needed for flight, being able to reconnect it to the system is important, provided it can be fixed."], "jumps": ["P13451", "P13440"]}, {"id": "P13451", "text": ["Let's create another fault on the bus and determine which load is malfunctioning."], "jumps": ["P13450"]}, {"id": "P13460", "text": ["Which load has a fault and has been isolated from the bus?", "Which load has a fault and has been isolated from the bus?."], "jumps": []}, {"id": "P13461", "text": [], "jumps": []}, {"id": "P13462", "text": ["The second circuit breaker should have popped out.  The component faulted is the component connected to this circuit breaker, cabin lights.  Check your setup or ask your instructor for assistance.", "The second circuit breaker should have popped out. The component faulted is the component connected to this circuit breaker, cabin lights. Check your setup or ask your instructor for assistance...."], "jumps": []}, {"id": "P13470", "text": ["Assume that you have fixed your cabin lights and that you are ready to attach them to the bus.  Press the red button that is extending from the second circuit breaker.  The four lights should illuminate.", "Assume that you have fixed your cabin lights and that you are ready to attach them to the bus. Press the red button that is extending from the second circuit breaker. The four lights should illuminate."], "jumps": ["P13480", "P13460"]}, {"id": "P13480", "text": ["As you can see, there are many important sections to a basic power distribution system.  While the actual structure of a system may be different, its basic operation is the same.", "As you can see, there are many important sections to a basic power distribution system. While the actual structure of a system may be different, its basic operation is the same."], "jumps": ["P13490", "P13470"]}, {"id": "P13490", "text": ["Without the proper knowledge of a basic bus system, troubleshooting can be time consuming and costly."], "jumps": ["P13480"]}, {"id": "P13510", "text": ["1.  Set the Console Power Switch to OFF.", "1. Set the Console Power Switch to OFF.FF................................."], "jumps": []}, {"id": "P13520", "text": ["2.  Remove all test equipment connections. \n3.  Remove all PC cards.\n4.  Return all equipment to the designated storage areas.", "2. Remove all test equipment connections. 3. Remove all PC cards. 4. Return all equipment to the designated storage areas."], "jumps": ["P13910", "P13510"]}, {"id": "P13910", "text": ["This completes the experiment on BASIC POWER DISTRIBUTION OPERATION."], "jumps": ["P2001", "P13520"]}, {"id": "PINFO", "text": ["07-14-00 Converted to ToolBook 7.1 format. jay 08-01-00 Text and Branching. frieda 08-01-00 Ran experiment with trainers. frieda 09-11-00 Graphics added. Richard S. 09-27--00 Reviewed - lisa 07-19-01 Converted to ToolBook 8.1 format. jay 10-30-01 P2300,13300, 2340, 13340 Capped 1st letter of sentences in the distractors. P2380,13380, Moved the clear fault from back button and inserted fault. P2451,13451, F201 is popping the circuit breakers for the insturment panel and the cabin lights. -Penny 01-14-02 Converted to Phase II format. jay 02-12-02 review - rs 05-27-04 P1160, changed \"loads in not\" to \"loads is not\". P1240, 1250 changed \"Static Convertor\" \"Ac to DC\" to \"Static Inverter\" \"DC to AC\". -Penny 05-29-04 P2250 & 13250 changed \"12 V\" to \"13 V\". P2430 & 13430 added script to erase fault 200 on next button. P2470 & 13470 added script on enterpage to erase fault 201 and replaced cards throughout lesson per Ray. frieda 11-04-04 Made text changes as per Kevin Gulliver's comments. -Penny 11-05-04 Changed out graphics in lesson per kevin. frieda 11-17-04 Made graphics changes through out lesson - patty 02-18-05 Made corrections to P2430 and P13430 added 81F to script. - patty"], "jumps": []}]};
let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
