const book = {"title": "9395T905", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "PINFO", "text": ["03-06-00 Converted from SAM to toolbook. frieda 05-23-00 Text and Branching. frieda 06-08-00 Graphics CAI checklist - james 07-14-00 Converted to ToolBook 7.1 format. jay 08-14-00 Fixed up - lisa 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-12-02 Review of Conversion. Alexis 04-29-02 Review - lisa 02-19-03 Technical review completed for Rev C hardware implementation - Bill. Renamed 9395T905C for continuity purposes. 02-19-03 Made text corrections to P1,420,1020,1050,1190,1410,1530,1590, 1640,1650,1670,2070,2400,2430,2530,2620,2630.-patty 02-21-03 Deleted page P1650,p1660, change photo p1590, change text p2360.- patty 01-21-04 Made text corrections to P1550, P1680, P2410. Made graphic changes to P1020, P1130, P1150, P1460, P1470, P2020, P2030, P1480.-sarah 03-22-04 Grammar changes as per Pat Short. -Penny 07-29-04 P2290, P2290, line 1 changed 'rate of' to 'amount of', line 2 changed 'amount of' to 'rate of'. -Penny/Phil"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w The merits and deficiencies of FM vs. AM. w Terminology associated with FM.", "w FM Generation Methods w Methods of Tuning"], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["During radio's infancy, AM broadcast stations reigned; not just in the United States, but in Europe and elsewhere in the world."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["The developers of the emerging radio technology were well aware that AM lacked any innate immunity to noise.  Further, all efforts to alter the operating characteristics of AM as a way of providing it with resistance to noise was, at best, unfruitful.", "The developers of the emerging radio technology were well aware that AM lacked any innate immunity to noise. Further, all efforts to alter the operating characteristics of AM as a way of providing it with resistance to noise was, at best, unfruitful."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Noise reduction was extemely important, especially for communications.  In 1936, the first practical FM system was tested.  Since then, FM has provided a realistic solution to broadcast and communications radio technology.", "Noise reduction was extemely important, especially for communications. In 1936, the first practical FM system was tested. Since then, FM has provided a realistic solution to broadcast and communications radio technology..of FM was initiated."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Let's begin the lesson on FREQUENCY MODULATION RECEIVERS...................."], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Unlike Amplitude Modulation, where amplitude is the modulating component in the signal and frequency remains constant; in Frequency Modulation, amplitude is constant while frequency is modulated."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["This means the \"intelligence\" is carried in minute, instantaneous variations in the frequency."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["While this is the obvious difference between AM and FM, there are many other benefits and deficits between the two forms of  modulation.  Some are more apparent than others.", "While this is the obvious difference between AM and FM, there are many other benefits and deficits between the two forms of modulation. Some are more apparent than others."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["AM transmissions actually produce 3 frequencies: the carrier (or center frequency) and 2 sidebands, an upper and a lower.", "Upper Side Band (fc+fi)))"], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["Frequency modulation presents an entirely different picture mathematically because it has the carrier as well as an infinite     number of sidebands.", "Frequency modulation presents an entirely different picture mathematically because it has the carrier as well as an infinite number of sidebands."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["For example, when a frequency modulated signal is derived from a 5 kHz modulating frequency, the resultant frequency will have sidebands at 5 kHz intervals to infinity."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["The sidebands, as they progress outward in either direction from the carrier, will continually become weaker and weaker; but, none-the-less, are still present."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["Those sidebands that contain the majority of the power are considered significant sidebands."], "jumps": ["P1100", "P1060"]}, {"id": "P1100", "text": ["This, of course, makes FM a far more complex form of modulation than AM.  It also is the factor that indicates the need for some sort of limiting device.", "This, of course, makes FM a far more complex form of modulation than AM. It also is the factor that indicates the need for some sort of limiting device.", "Upper Side Band (fc+fi)))"], "jumps": ["P1110", "P1060"]}, {"id": "P1110", "text": ["FM sidebands have equal amplitudes and are always an equal distance from the carrier frequency.  This keeps FM sideband distribution in a symmetrical format around the carrier frequency.", "FM sidebands have equal amplitudes and are always an equal distance from the carrier frequency. This keeps FM sideband distribution in a symmetrical format around the carrier frequency."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["Here are some additional observations pertinent to frequency modulated signals:", "Here are some additional observations pertinent to frequency modulated signals: 1. When a carrier frequency is modulated, its power is reduced. 2. Any energy removed from the carrier is added to the sidebands. 3. The greater the amplitude of the modulating signal, the more power produced in the sidebands. 4. In frequency modulated signals, the sidebands may contain more", "Range - 1 MHz CH1 Volts/Div - .5 V (X1 probe) Function - Sine Wave 50 mV (X10 probe) Amplitude - Mid-Range Time/Div - 1 ms Frequency - 1 MHz Trigger Source - CH1 Counter Select - Internal (INT) Sweep Mode - Auto Modulation - AM Modulation Adjust Knob - Mid-Range Range - 10 kHz Frequency Adjust Knob - Mid-Range", "1. When a carrier frequency is modulated, its power is reduced. 2. Any energy removed from the carrier is added to the sidebands. 3. The greater the amplitude of the modulating signal, the more power produced in the sidebands. 4. In frequency modulated signals, the sidebands may contain more power than the carrier."], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["Advantages of Frequency Modulation:\nAs mentioned at the beginning of this lesson, Frequency Modulation provides superior noise suppression over Amplitude Modulation.", "Advantages of Frequency Modulation: As mentioned at the beginning of this lesson, Frequency Modulation provides superior noise suppression over Amplitude Modulation."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["There are other advantages as well which will be discussed along with reduced noise.  Below, is a list of the primary advantages of FM.", "There are other advantages as well which will be discussed along with reduced noise. Below, is a list of the primary advantages of FM. 1. greater noise suppression 2. high-fidelity (stereo) reception 3. less interference between broadcast stations 4. reduced transmitter power to cover assigned area", "Range - 1 MHz CH1 Volts/Div - .5 V (X1 probe) Function - Sine Wave 50 mV (X10 probe) Amplitude - Mid-Range Time/Div - 1 ms Frequency - 1 MHz Trigger Source - CH1 Counter Select - Internal (INT) Sweep Mode - Auto Modulation - AM Modulation Adjust Knob - Mid-Range Range - 10 kHz Frequency Adjust Knob - Mid-Range", "1. greater noise suppression 2. high-fidelity (stereo) reception 3. less interference between broadcast stations 4. reduced transmitter power to cover assigned areay contain more power than the carrier.debands may contain more power than the carrier. more power than the carrier. more power than the carrier."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["Noise:\nMost people are aware that their home receiver is far quieter when switched to FM as opposed to AM.  Static noise is not commonly heard in the FM band, whereas, with AM it can be quite noisy.", "Noise: Most people are aware that their home receiver is far quieter when switched to FM as opposed to AM. Static noise is not commonly heard in the FM band, whereas, with AM it can be quite noisy."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["Noise is seen in the form of amplitude variations. We know from previous lessons that the intelligence in an AM signal is located in the USB and LSB which is the same as saying that the intelligence is stored in the amplitude variations of the carrier frequency. Obviously, then, any introduction of noise will have a dramatic affect on the detected sign."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["The removal of noise spikes in an FM signal is accomplished by the limiter circuitry.  Outwardly, this may appear to be without cost.  However, there is a trade-off.", "The removal of noise spikes in an FM signal is accomplished by the limiter circuitry. Outwardly, this may appear to be without cost. However, there is a trade-off."], "jumps": ["P1180", "P1150"]}, {"id": "P1180", "text": ["While the limiter is capable of clipping off a noise spike, the spike still generates a phase shift.  This phase shift causes a shift   in the frequency which cannot be compensated for.  Fortunately, this deviation in frequency caused by the noise is rarely an audible problem.", "Because of the selective characteristics of the tuning circuitry in an FM receiver, the frequency range of the noise will be very close to the desired tuned FM signal.", "While the limiter is capable of clipping off a noise spike, the spike still generates a phase shift. This phase shift causes a shift in the frequency which cannot be compensated for. Fortunately, this deviation in frequency caused by the noise is rarely an audible problem."], "jumps": ["P1190", "P1170", "P1200"]}, {"id": "P1200", "text": ["That is, if the receiver is tuned to 89.9 MHz, the gain provided by the receiver's amplifiers for the tuned frequency will also provide amplification to any noise at or near 89.9 MHz.  The noise (although clipped) has sufficient energy to cause phase shift and thus, frequency deviation.", "That is, if the receiver is tuned to 89.9 MHz, the gain provided by the receiver's amplifiers for the tuned frequency will also provide amplification to any noise at or near 89.9 MHz. The noise (although clipped) has sufficient energy to cause phase shift and thus, frequency deviation."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["The advantage of reduced noise in FM transmissions is actually a trade-off.  AM signals occupy a 10 kHz bandwidth within their assigned  frequency range.  FM signals have bandwidths of \n200 kHz for broadcast transmissions and about 30 kHz for narrow-band FM used for voice communications.", "The advantage of reduced noise in FM transmissions is actually a trade-off. AM signals occupy a 10 kHz bandwidth within their assigned frequency range. FM signals have bandwidths of 200 kHz for broadcast transmissions and about 30 kHz for narrow-band FM used for voice communications."], "jumps": ["P1220", "P1190"]}, {"id": "P1220", "text": ["Simple math tells you that twenty AM stations take up the same space in the frequency spectrum as just one FM station.  This is necessary because the power in FM signals is located in its multiple sidebands.", "Simple math tells you that twenty AM stations take up the same space in the frequency spectrum as just one FM station. This is necessary because the power in FM signals is located in its multiple sidebands."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["Remember that the power in an AM signal is located in its upper and lower sideband which is only 5 kHz above and below the 455 kHz IFsignal.  The sidebands in FM are directly proportional to the modulating frequency and are spaced apart at the same frequency.", "Remember that the power in an AM signal is located in its upper and lower sideband which is only 5 kHz above and below the 455 kHz IFsignal. The sidebands in FM are directly proportional to the modulating frequency and are spaced apart at the same frequency."], "jumps": ["P1240", "P1210"]}, {"id": "P1240", "text": ["The bandwidth for an FM Broadcast signal is _______", "The bandwidth for an FM Broadcast signal is _______........"], "jumps": ["P1210"]}, {"id": "P1241", "text": [], "jumps": []}, {"id": "P1242", "text": ["The entire FM Broadcast Band is only 20 MHz.", "The entire FM Broadcast Band is only 20 MHz................"], "jumps": []}, {"id": "P1243", "text": ["FM Broadcast signals have two 25 kHz guard bands.", "FM Broadcast signals have two 25 kHz guard bands..........."], "jumps": []}, {"id": "P1244", "text": ["10 kHz is the bandwidth for AM Broadcast signals.", "FM Stereo:\nAside from relatively noiseless reception, the greatest benefit of    FM broadcasts for most people is stereophonic sound.", "10 kHz is the bandwidth for AM Broadcast signals...........", "FM Stereo: Aside from relatively noiseless reception, the greatest benefit of FM broadcasts for most people is stereophonic sound."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["It was the appearance of stereo records and tapes in the late 1950's that was the driving force for the development of stereo FM broadcasts."], "jumps": ["P1261", "P1250"]}, {"id": "P1261", "text": ["Stereo transmission and reception is far more complex because two separate audio signals must be used to modulate the same carrier while, at the same time, occupy different frequency ranges.  This is accomplished through the use of a sub-carrier and frequency-division multiplexing.", "Stereo transmission and reception is far more complex because two separate audio signals must be used to modulate the same carrier while, at the same time, occupy different frequency ranges. This is accomplished through the use of a sub-carrier and frequency-division multiplexing."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["In order to transmit in stereo, both a left channel (L) and a right channel (R) must be created in the recording studio or concert hall.", "In order to transmit in stereo, both a left channel (L) and a right channel (R) must be created in the recording studio or concert hall. Simplified FM Stereo Generator"], "jumps": ["P1280", "P1250"]}, {"id": "P1280", "text": ["The left and right channels are fed into a Summing/Difference amplifier (commonly referred to as a matrix) to produce a left minus right channel (L - R) and a left plus right channel (L + R)."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["Since the (L + R) sideband is a frequency that can easily be filtered at the receiver; no further processing is required.  The     signal is directly transmitted through the summing network.  The  (L - R) signal requires additional modification.", "Since the (L + R) sideband is a frequency that can easily be filtered at the receiver; no further processing is required. The signal is directly transmitted through the summing network. The (L - R) signal requires additional modification."], "jumps": ["P1300", "P1270"]}, {"id": "P1300", "text": ["A 19 kHz pilot sub-carrier is sent simultaneously to the summing network (used as a reference signal) and to the frequency doubler. From the doubler, the now 38 kHz signal and the (L - R) signal are modulated and also sent to the summing network. The (L + R), modified (L - R) and pilot signal constitute the composite stereo signal that is ultimately transmitted and received."], "jumps": ["P1310", "P1270"]}, {"id": "P1310", "text": ["On the receiving end, the composite FM stereo signal (having been conditioned by filters and amplifiers) has its three components separated by filters and then processed.", "On the receiving end, the composite FM stereo signal (having been conditioned by filters and amplifiers) has its three components separated by filters and then processed. Simplified FM Stereo Decoding Circuitry"], "jumps": ["P1320", "P1270"]}, {"id": "P1320", "text": ["Because the (L + R) signal was not modified, all that is needed to extract it from the composite signal is a low pass filter.  A          band-pass filter extracts the 19 kHz pilot frequency.", "Because the (L + R) signal was not modified, all that is needed to extract it from the composite signal is a low pass filter. A band-pass filter extracts the 19 kHz pilot frequency."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["A high frequency band-pass filter is used to extract the \n23 - 53 kHz carrier signal which contains the intelligence from the (L - R) signal.  The pilot frequency is then doubled again and modulated with the carrier signal. In the process, the (L - R) signal is extracted.", "A high frequency band-pass filter is used to extract the 23 - 53 kHz carrier signal which contains the intelligence from the (L - R) signal. The pilot frequency is then doubled again and modulated with the carrier signal. In the process, the (L - R) signal is extracted."], "jumps": ["P1340", "P1310"]}, {"id": "P1340", "text": ["The two signals are then fed into the summing/difference (matrix) amplifier where the (L - R) is added to the (L + R) signal to produce a 2L signal.  The (L + R) signal is subtracted from the \n(L - R) signal to produce a 2R signal.", "The two signals are then fed into the summing/difference (matrix) amplifier where the (L - R) is added to the (L + R) signal to produce a 2L signal. The (L + R) signal is subtracted from the (L - R) signal to produce a 2R signal."], "jumps": ["P1350", "P1310"]}, {"id": "P1350", "text": ["These two signals are then sent to their appropriate audio amplifiers.  This process also allows normal reception for             non-stereophonic FM receivers.  An FM stereophonic system requires stringent technological management.  This is particularly true with the generation and transmission aspects.", "It should be mentioned that some AM radio stations are also broadcasting in stereo.  Several methods of stereophonic amplitude modulation were devised in the late 1970's.", "These two signals are then sent to their appropriate audio amplifiers. This process also allows normal reception for non-stereophonic FM receivers. An FM stereophonic system requires stringent technological management. This is particularly true with the generation and transmission aspects.", "It should be mentioned that some AM radio stations are also broadcasting in stereo. Several methods of stereophonic amplitude modulation were devised in the late 1970's."], "jumps": ["P1360", "P1310", "P1370"]}, {"id": "P1370", "text": ["The Federal Communications Commission (FCC), however, elected to defer to the marketplace the choice of which system is best. Subsequently, as of 1987, there were only 400 AM stations broadcasting in stereo in the United States, using four different systems. This has resulted in FM radio taking a firm lead as the mode of choice in broadcast radio."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["Reduced Interference (Capture Effect): \nOne of the problems overcome by FM broadcasts is interference  between stations operating at or near the same frequency.  In order for radio coverage to be as complete as possible, station broadcast areas sometimes overlap.", "Reduced Interference (Capture Effect): One of the problems overcome by FM broadcasts is interference between stations operating at or near the same frequency. In order for radio coverage to be as complete as possible, station broadcast areas sometimes overlap."], "jumps": ["P1390", "P1360"]}, {"id": "P1390", "text": ["Nighttime AM broadcasts are particularly subject to this problem because of variations in the depth of the ionosphere, for example, the disappearance of the E layer, which allows skywaves to be reflected great distances. When listening to an AM radio, it is not uncommon to hear more than one station at a time. FM broadcast radio greatly reduces this problem."], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["You may have noticed that while listening to an FM station in a car, the station is suddenly replaced by another.  Occasionally, the receiver may flip-flop back and forth between the two stations.  FM receivers do this because they are designed to lock onto the strongest signal and reject the weaker.", "You may have noticed that while listening to an FM station in a car, the station is suddenly replaced by another. Occasionally, the receiver may flip-flop back and forth between the two stations. FM receivers do this because they are designed to lock onto the strongest signal and reject the weaker."], "jumps": ["P1410", "P1380"]}, {"id": "P1410", "text": ["The flip-flop action occurs when the two signals are very close in signal strength, and the receiver is unable to \"decide\" which signal is stronger. The FM receiver's ability to do this is known as the capture effect. This capture effect is a distinct FM advantage. It is a disadvantage if the desired signal is the weaker of the two signals.eive!"], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["Reduced Power Requirements: \nMost AM receivers will operate adequately (not necessarily well)   without the need of any RF amplifier.  FM receivers, on the other   hand, require an RF amplification stage.", "Reduced Power Requirements: Most AM receivers will operate adequately (not necessarily well) without the need of any RF amplifier. FM receivers, on the other hand, require an RF amplification stage."], "jumps": ["P1430", "P1400"]}, {"id": "P1430", "text": ["The problem is rooted in the FM receiver's inherent ability to function with signals as small as 1 microvolt.  Specifically, noise   reduction capabilities in FM receivers allow the receiver to tune to and process tiny RF signals, where AM receivers, for example, normally require an RF signal of about 30 microvolts.", "The problem is rooted in the FM receiver's inherent ability to function with signals as small as 1 microvolt. Specifically, noise reduction capabilities in FM receivers allow the receiver to tune to and process tiny RF signals, where AM receivers, for example, normally require an RF signal of about 30 microvolts."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["From the perspective of transmission, this is all very beneficial. FM transmitters are able to broadcast at much lower signal levels than AM or SSB transmitters.  Add to this that FM is amplitude       constant, which also decreases the need for high power transmitters.  This significantly reduces operating costs.", "Because noise levels increase as signal strength decreases, the smaller the signal the more noise is present. If a 1 microvolt signal is injected into the mixer of an FM receiver, the high noise level would destroy the intelligence. Consequently, it is necessary to increase the gain of the signal to at least 15- 20 microvolts prior to mixing.", "From the perspective of transmission, this is all very beneficial. FM transmitters are able to broadcast at much lower signal levels than AM or SSB transmitters. Add to this that FM is amplitude constant, which also decreases the need for high power transmitters. This significantly reduces operating costs."], "jumps": ["P1450", "P1420", "P1460"]}, {"id": "P1460", "text": ["FM Terminology: \nAs with your studies of AM receivers, FM receivers have components either partially or fully unique to itself.  Comparing a block diagram of an FM receiver with a SSB or AM receiver will certainly reveal many likenesses; indeed, much is identical.", "FM Terminology: As with your studies of AM receivers, FM receivers have components either partially or fully unique to itself. Comparing a block diagram of an FM receiver with a SSB or AM receiver will certainly reveal many likenesses; indeed, much is identical."], "jumps": ["P1470", "P1450"]}, {"id": "P1470", "text": ["Still, there are sections that exist in one receiver that do not exist in others. Additionally, beyond the scope of hardware, there are conceptual differences that have given rise to terminology not used in other systems. A firm understanding of the terms and the circuits or concepts they describe will facilitate your comprehension of FM radio."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["Preemphasis: \nAs previously discussed, the noise rejection capability of FM is one of its essential attributes.  Unfortunately, as the frequency of the intelligence rises, this aspect of FM begins to deteriorate.", "Consider a live concert.  High notes produced by a flute may seem to have the same energy level as a bass guitar; when, in reality, it may contain less than half the electrical energy.  In FM, half the electrical energy equates to half the deviation.", "Preemphasis: As previously discussed, the noise rejection capability of FM is one of its essential attributes. Unfortunately, as the frequency of the intelligence rises, this aspect of FM begins to deteriorate.", "Consider a live concert. High notes produced by a flute may seem to have the same energy level as a bass guitar; when, in reality, it may contain less than half the electrical energy. In FM, half the electrical energy equates to half the deviation."], "jumps": ["P1490", "P1460", "P1500", "P1480"]}, {"id": "P1500", "text": ["This translates to much higher noise levels for all frequencies in the upper limits of the human ear.  To compensate for this, nearly all FM broadcasts increase the signal strength of the upper            frequencies.  This particular form of signal manipulation is known as preemphasis.", "This translates to much higher noise levels for all frequencies in the upper limits of the human ear. To compensate for this, nearly all FM broadcasts increase the signal strength of the upper frequencies. This particular form of signal manipulation is known as preemphasis."], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["Preemphasis is accomplished prior to the signal being modulated.  Ultimately, the goal of preemphasis is to raise the S/N ratio of the upper frequencies to a level where noise is no longer a hindrance to high fidelity.", "Preemphasis is accomplished prior to the signal being modulated. Ultimately, the goal of preemphasis is to raise the S/N ratio of the upper frequencies to a level where noise is no longer a hindrance to high fidelity."], "jumps": ["P1520", "P1500"]}, {"id": "P1520", "text": ["This is all done with respect to the desired level of the lower frequencies.  The down side to preemphasis is that it disrupts the natural balance between the high and low frequencies at the   receiving end.", "This is all done with respect to the desired level of the lower frequencies. The down side to preemphasis is that it disrupts the natural balance between the high and low frequencies at the receiving end."], "jumps": ["P1530", "P1500"]}, {"id": "P1530", "text": ["In order to preserve this balance the signal must first be restored to its original condition.  This is accomplished by the use of a       deemphasis circuit in the receiver.", "In order to preserve this balance the signal must first be restored to its original condition. This is accomplished by the use of a deemphasis circuit in the receiver."], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["Deemphasis reduces the signal strength of the upper frequencies by the same amount that they were increased prior to transmission.  Normally, deemphasis circuitry is located between the discriminator and the audio amplifiers.", "Deemphasis reduces the signal strength of the upper frequencies by the same amount that they were increased prior to transmission. Normally, deemphasis circuitry is located between the discriminator and the audio amplifiers."], "jumps": ["P1550", "P1520"]}, {"id": "P1550", "text": ["Discriminator:\nAs you may recall, the circuitry in an AM receiver that extracts the intelligence from the 455 kHz IF signal is called a Detector.  In FM  radios, the equivalent circuitry is usually known as a Discriminator.", "Discriminator: As you may recall, the circuitry in an AM receiver that extracts the intelligence from the 455 kHz IF signal is called a Detector. In FM radios, the equivalent circuitry is usually known as a Discriminator."], "jumps": ["P1560", "P1520"]}, {"id": "P1560", "text": ["It provides an intelligence signal whose amplitude is a response to the instantaneous deviations of the carrier frequency."], "jumps": ["P1570", "P1520"]}, {"id": "P1570", "text": ["There are several versions of the Discriminator circuit found in FM receivers.  The choice of discriminator is predominantly based on cost and technology.", "There are several versions of the Discriminator circuit found in FM receivers. The choice of discriminator is predominantly based on cost and technology."], "jumps": ["P1580", "P1520"]}, {"id": "P1580", "text": ["For example, the Slope Detector is simplistic and inexpensive, where the Quadrature Detector and Phase Lock Loop FM Detector is best suited for implementation in IC's.  Some other popular detectors are the Foster-Seely Detector and the Ratio Detector.", "For example, the Slope Detector is simplistic and inexpensive, where the Quadrature Detector and Phase Lock Loop FM Detector is best suited for implementation in IC's. Some other popular detectors are the Foster-Seely Detector and the Ratio Detector."], "jumps": ["P1590", "P1520"]}, {"id": "P1590", "text": ["The FM Receiver trainer utilizes the PLL FM Detector.", "The FM Receiver trainer utilizes the PLL FM Detector......."], "jumps": ["P1600", "P1580"]}, {"id": "P1600", "text": ["As in AM, Discriminators are located after the tank circuit in the final IF stage.  In FM, a limiter will proceed it as well.  The tank     circuit is detuned from the carrier in order that the carrier is in    the most linear portion of the response curve.", "As in AM, Discriminators are located after the tank circuit in the final IF stage. In FM, a limiter will proceed it as well. The tank circuit is detuned from the carrier in order that the carrier is in the most linear portion of the response curve."], "jumps": ["P1610", "P1590"]}, {"id": "P1610", "text": ["As the FM signal rises above or falls below the carrier frequency, the output amplitude rises and falls in a corresponding manner. The result is an AM signal which is then detected by the diode prior to the audio amplifier(s)."], "jumps": ["P1620", "P1600"]}, {"id": "P1620", "text": ["Limiters:\nLimiters perform the job of maintaining a constant amplitude for any input above value.  In the FM receiver, it clips off any undesired amplitude modulation and/or amplitude spikes manifest by noise.", "Limiters: Limiters perform the job of maintaining a constant amplitude for any input above value. In the FM receiver, it clips off any undesired amplitude modulation and/or amplitude spikes manifest by noise."], "jumps": ["P1630", "P1600"]}, {"id": "P1630", "text": ["Limiters also provide an additional function in that they produce an AGC effect.  This is accomplished because signals from the      established minimum and maximum values provide a constant input level to the discriminator.", "Limiters also provide an additional function in that they produce an AGC effect. This is accomplished because signals from the established minimum and maximum values provide a constant input level to the discriminator."], "jumps": ["P1640", "P1620"]}, {"id": "P1640", "text": ["Prescalers: \nPrescaling is dividing the frequency down to a more usable, or workable value.  The Nida FM receiver does not need a prescaler circuit.  The PLL is capable of handling FM broadcast RF.", "Prescalers: Prescaling is dividing the frequency down to a more usable, or workable value. The Nida FM receiver does not need a prescaler circuit. The PLL is capable of handling FM broadcast RF."], "jumps": ["P1680", "P1620"]}, {"id": "P1680", "text": ["The FM Discriminator compares to the AM _______", "The FM Discriminator compares to the AM ___________........"], "jumps": ["P1640"]}, {"id": "P1681", "text": [], "jumps": []}, {"id": "P1682", "text": ["The PLL (Phase Lock Loop) in receivers is primarily used for tuning."], "jumps": ["Phase"]}, {"id": "P1683", "text": ["The mixer combines the LO frequency with the tuned RF.", "The mixer combines the LO frequency with the tuned RF......"], "jumps": []}, {"id": "P1684", "text": ["Frequency dividers are not a part of the discriminator circuit."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on FREQUENCY MODULATION.", "This completes the information on FREQUENCY MODULATION....."], "jumps": ["P1001", "P1680"]}, {"id": "P1920", "text": ["1.  In Frequency Modulation, amplitude is constant while                      frequency is modulated.  The intelligence is carried in minute         variations in the frequency.", "1. In Frequency Modulation, amplitude is constant while frequency is modulated. The intelligence is carried in minute variations in the frequency."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Frequency Modulation has a carrier and an infinite number of        sidebands.", "2. Frequency Modulation has a carrier and an infinite number of sidebands."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  FM sidebands have equal amplitudes and are always an equal      distance from the center (carrier) frequency.", "3. FM sidebands have equal amplitudes and are always an equal distance from the center (carrier) frequency."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  The primary advantages of FM radio are:", "4. The primary advantages of FM radio are: ater noise suppression 2. High Fidelity (stereo) reception 3. Less interference between broadcast stations 4. Reduced transmitter power to cover assigned area", "Range - 1 MHz CH1 Volts/Div - .5 V (X1 probe) Function - Sine Wave 50 mV (X10 probe) Amplitude - Mid-Range Time/Div - 1 ms Frequency - 1 MHz Trigger Source - CH1 Counter Select - Internal (INT) Sweep Mode - Auto Modulation - AM Modulation Adjust Knob - Mid-Range Range - 10 kHz Frequency Adjust Knob - Mid-Range", "1. greater noise suppression 2. high-fidelity (stereo) reception 3. less interference between broadcast stations 4. reduced transmitter power to cover assigned areay contain more power than the carrier.debands may contain more power than the carrier. more power than the carrier. more power than the carrier."], "jumps": ["P1999", "P1930"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1950"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["As was mentioned earlier, in a block diagram comparison of an AM and FM receiver, many sections are identical; if not physically, at least in name and/or function."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["Aside from the components necessary to support and interface correctly with the receiver's nominal frequency range and optional circuits, AM and FM receivers are fundamentally the same."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["Refer to the diagram below.  Since the discriminator is essentially a demodulator, it's function is the same as an AM detector.  That only leaves the Limiter and Deemphasis Network as items uniquely FM.", "Refer to the diagram below. Since the discriminator is essentially a demodulator, it's function is the same as an AM detector. That only leaves the Limiter and Deemphasis Network as items uniquely FM."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["RF Amplifier Stage:\nWe have already discussed the importance of an RF amplifier stage in an FM receiver.  There are two other significant advantages to having an RF stage:", "RF Amplifier Stage: We have already discussed the importance of an RF amplifier stage in an FM receiver. There are two other significant advantages to having an RF stage: 1. Higher degree of Image Frequency rejection 2. Reduction of Local Oscillator Reradiation", "Range - 1 MHz CH1 Volts/Div - .5 V (X1 probe) Function - Sine Wave 50 mV (X10 probe) Amplitude - Mid-Range Time/Div - 1 ms Frequency - 1 MHz Trigger Source - CH1 Counter Select - Internal (INT) Sweep Mode - Auto Modulation - AM Modulation Adjust Knob - Mid-Range Range - 10 kHz Frequency Adjust Knob - Mid-Range", "1. Higher degree of Image Frequency rejection 2. Reduction of Local Oscillator Reradiation 3. less interference between broadcast stations 4. reduced transmitter power to cover assigned area power than the carrier.debands may contain more power than the carrier. more power than the carrier. more power than the carrier."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["While the superheterodyne receiver solves many of the problems that faced the TRF receivers of old, the mixer-oscillator circuitry sometimes allows unwanted signals to enter the IF amplifier."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["Suppose a receiver is tuned to 27 MHz with a 1 MHz IF.  The Local Oscillator or VCO would then adjust to 28 MHz.  If there is an undesired station broadcasting at 29 MHz, it is quite possible that frequency may enter the mixer.", "Suppose a receiver is tuned to 27 MHz with a 1 MHz IF. The Local Oscillator or VCO would then adjust to 28 MHz. If there is an undesired station broadcasting at 29 MHz, it is quite possible that frequency may enter the mixer."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["Although the receiver is tuned to the center frequency of 27 MHz, the response curve of the tuning circuit may not completely attenuate the frequency at 29 MHz."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["The real problem arises when the 29 MHz frequency is fed into the mixer.  The 29 MHz frequency mixes with the local oscillator's 28 MHz.  That produces a difference frequency of 1 MHz --- the same as the IF!", "The real problem arises when the 29 MHz frequency is fed into the mixer. The 29 MHz frequency mixes with the local oscillator's 28 MHz. That produces a difference frequency of 1 MHz --- the same as the IF!"], "jumps": ["P2100", "P2070"]}, {"id": "P2100", "text": ["This all results with two frequencies (27 MHz and 29 MHz) being accepted by the IF, which see either frequency as being acceptable.  At this point, the undesired station may interfere with the other or completely block it.", "This all results with two frequencies (27 MHz and 29 MHz) being accepted by the IF, which see either frequency as being acceptable. At this point, the undesired station may interfere with the other or completely block it."], "jumps": ["P2110", "P2070"]}, {"id": "P2110", "text": ["A well designed RF amplifier with its own tunable circuit will segregate and strengthen the tuned frequency to a degree that it  will fully override any image frequency that may slip into the mixer.", "A well designed RF amplifier with its own tunable circuit will segregate and strengthen the tuned frequency to a degree that it will fully override any image frequency that may slip into the mixer."], "jumps": ["P2120", "P2070"]}, {"id": "P2120", "text": ["Reradiation of the local oscillator is normally much less of a problem, but it does occur.  Basically, the LO signal is coupled back to the antenna which produces interference.  Again, the inclusion of an RF amplifier stage reduces the chances of this dramatically.", "Reradiation of the local oscillator is normally much less of a problem, but it does occur. Basically, the LO signal is coupled back to the antenna which produces interference. Again, the inclusion of an RF amplifier stage reduces the chances of this dramatically."], "jumps": ["P2130", "P2070"]}, {"id": "P2130", "text": ["Local Oscillator, Mixer and IF Amplifier: \nThe local oscillator, mixer and IF amplifier in an FM receiver works exactly the same as in an AM receiver.  The only real difference is that the IF is standard at 10.7 MHz as opposed to 455 kHz in AM receivers.", "Local Oscillator, Mixer and IF Amplifier: The local oscillator, mixer and IF amplifier in an FM receiver works exactly the same as in an AM receiver. The only real difference is that the IF is standard at 10.7 MHz as opposed to 455 kHz in AM receivers."], "jumps": ["P2140", "P2070"]}, {"id": "P2140", "text": ["Also, FM receivers normally incorporate two or more IF amplifier stages which increases gain and provides better filtering action so that only the desired signal is passed into the discriminator.     Beyond mentioning that higher frequencies are involved, there is little reason to elaborate.", "Also, FM receivers normally incorporate two or more IF amplifier stages which increases gain and provides better filtering action so that only the desired signal is passed into the discriminator. Beyond mentioning that higher frequencies are involved, there is little reason to elaborate."], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["Limiter: \nAs was discussed earlier, the limiter's primary function is to         provide a constant output above a certain value.  Based on the     limiter's circuitry, a certain voltage input must be achieved before the circuit is able to begin its limiting action.", "Limiter: As was discussed earlier, the limiter's primary function is to provide a constant output above a certain value. Based on the limiter's circuitry, a certain voltage input must be achieved before the circuit is able to begin its limiting action."], "jumps": ["P2160", "P2130"]}, {"id": "P2160", "text": ["This voltage level is called the threshold, quieting or limiting knee voltage. Once this voltage level is achieved (commonly, this voltage is about 1 volt) the limiter then begins providing a constant amplitude output, the level of which is determined by the maximum and minimum value prescribed by the limiter's range."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["Discriminator: It should be remembered that although the FM discriminator and the AM detector strive to perform the same function, for example, the extraction of audio intelligence from the IF signal, they are not the same circuits nor, for the most part, are they interchangeable."], "jumps": ["P2180", "P2150"]}, {"id": "P2180", "text": ["Although, in a pinch, an AM receiver could be used to receive an FM signal by detuning the tank circuit that precedes the detector. The  name discriminator was coined because of the FM \"detector's\" inherent ability to discriminate between signal and noise.", "Although, in a pinch, an AM receiver could be used to receive an FM signal by detuning the tank circuit that precedes the detector. The name discriminator was coined because of the FM \"detector's\" inherent ability to discriminate between signal and noise."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["Deemphasis Stage: \nThe noise level in the output voltage of an FM detector results from unwanted phase modulation mentioned earlier in this lesson.  The noise increases proportionally with the frequency, roughly 6 dB per octave.", "Deemphasis Stage: The noise level in the output voltage of an FM detector results from unwanted phase modulation mentioned earlier in this lesson. The noise increases proportionally with the frequency, roughly 6 dB per octave."], "jumps": ["P2200", "P2170"]}, {"id": "P2195", "text": ["OCTAVE - A range of frequency where the highest frequency is twice the lowest frequency."], "jumps": []}, {"id": "P2200", "text": ["The insertion of a deemphasis stage immediately following the discriminator that attenuates at 6 dB per octave, curtails the noise proportionally with the frequency and restores the original S/N ratio. The frequency characteristics of the deemphasis network should be a mirror image of the preemphasis network in the transmitter."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["Audio Power Amplifier: \nAs in AM receivers, FM receivers require having the detected         intelligence amplified.  There are no special requirements for the AF power amps in an FM receiver.  They are much the same as any found in a home stereo system.", "Audio Power Amplifier: As in AM receivers, FM receivers require having the detected intelligence amplified. There are no special requirements for the AF power amps in an FM receiver. They are much the same as any found in a home stereo system."], "jumps": ["P2220", "P2190"]}, {"id": "P2220", "text": ["It may be useful to remember that stereo receivers require two amplifiers in the AF stage, one for each channel.  In this instance, they should be as characteristically identical to one another as     possible.  Any differences in impedance or other values may cause stress to one or both of the amplifiers.", "It may be useful to remember that stereo receivers require two amplifiers in the AF stage, one for each channel. In this instance, they should be as characteristically identical to one another as possible. Any differences in impedance or other values may cause stress to one or both of the amplifiers."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["FM Generation Methods: The FM frequency band of 88 to 108 MHz allows for 100 channels spaced 200 kHz apart with a frequency range from 50 to 15 kHz. The frequency deviation ratio is 5. This indicates that there will be five significant sidebands above and below the carrier frequency."], "jumps": ["P2240", "P2210"]}, {"id": "P2240", "text": ["The maximum carrier deviation is  \u00b1 75 kHz for a spectrum of \n150 kHz.  The additional 50 kHz provides 25 kHz guard bands at the upper and lower boundaries of each channel's frequency. These bands guard against adjacent channel interference.", "75 kHz for a spectrum of 150 kHz. The additional 50 kHz provides 25 kHz guard bands at the upper and lower boundaries of each channel's frequency. These bands guard against adjacent channel interference."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["Frequency modulation generation may be categorized into two distinct groups:", "Frequency modulation generation may be categorized into two distinct groups: FM Generation Methods 1. Direct 2. Indirect", "Range - 1 MHz CH1 Volts/Div - .5 V (X1 probe) Function - Sine Wave 50 mV (X10 probe) Amplitude - Mid-Range Time/Div - 1 ms Frequency - 1 MHz Trigger Source - CH1 Counter Select - Internal (INT) Sweep Mode - Auto Modulation - AM Modulation Adjust Knob - Mid-Range Range - 10 kHz Frequency Adjust Knob - Mid-Range", "FM Generation Methods 1. Direct 2. Indirect of Local Oscillator Reradiation on of Local Oscillator Reradiation etween broadcast stations 4. reduced transmitter power to cover assigned area power than the carrier.debands may contain more power than the carrier. more power than the carrier. more power than the carrier."], "jumps": ["P2251", "P2230"]}, {"id": "P2251", "text": ["Direct: \nFrequency modulation will result whenever the inductance or        capacitance of an LC tank circuit is varied.  When the variation is  directly proportional to the voltage of the modulation circuit, pure FM is produced.", "Direct: Frequency modulation will result whenever the inductance or capacitance of an LC tank circuit is varied. When the variation is directly proportional to the voltage of the modulation circuit, pure FM is produced."], "jumps": ["P2260", "P2250"]}, {"id": "P2260", "text": ["The circuit below illustrates a capacitor microphone FM Generator.  The microphone is a commonplace item found on many portable cassette recorders and is often referred to as a condenser microphone.", "The circuit below illustrates a capacitor microphone FM Generator. The microphone is a commonplace item found on many portable cassette recorders and is often referred to as a condenser microphone."], "jumps": ["P2270", "P2251"]}, {"id": "P2270", "text": ["Ultimately, it is nothing more than a variable capacitor.  In the absence of sound waves, the capacitor's plates are static and there is no change in capacitive value.", "Ultimately, it is nothing more than a variable capacitor. In the absence of sound waves, the capacitor's plates are static and there is no change in capacitive value."], "jumps": ["P2280", "P2251"]}, {"id": "P2280", "text": ["However, when sound waves strike the orifice of the microphone the plates move in and out accordingly, causing the capacitance to increase or decrease from whatever fixed capacitive value is in place."], "jumps": ["P2290", "P2251"]}, {"id": "P2290", "text": ["When the changing capacitive value directly affects the oscillator's frequency, two factors may be realized:", "When the changing capacitive value directly affects the oscillator's frequency, two factors may be realized: 1. The intelligence amplitude determines the rate of frequency deviation. 2. The intelligence frequency determines the amount of frequency deviation.", "Range - 1 MHz CH1 Volts/Div - .5 V (X1 probe) Function - Sine Wave 50 mV (X10 probe) Amplitude - Mid-Range Time/Div - 1 ms Frequency - 1 MHz Trigger Source - CH1 Counter Select - Internal (INT) Sweep Mode - Auto Modulation - AM Modulation Adjust Knob - Mid-Range Range - 10 kHz Frequency Adjust Knob - Mid-Range", "1. The intelligence amplitude determines the amount of frequency deviation. 2. The intelligence frequency determines the rate of frequency deviation. wer than the carrier.debands may contain more power than the carrier. more power than the carrier. more power than the carrier."], "jumps": ["P2300", "P2251"]}, {"id": "P2300", "text": ["Devices that vary the frequency of an oscillator are considered \"Direct\" methods of FM generation.  The most common direct methods of  FM generation are the reactance modulator and the varactor diode modulator.", "Devices that vary the frequency of an oscillator are considered \"Direct\" methods of FM generation. The most common direct methods of FM generation are the reactance modulator and the varactor diode modulator."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["Indirect Method: \nWhen FM is generated via phase modulation, the generation process is said to be of the Indirect Method.  Two common indirect methods are:", "Indirect Method: When FM is generated via phase modulation, the generation process is said to be of the Indirect Method. Two common indirect methods are:", "Range - 1 MHz CH1 Volts/Div - .5 V (X1 probe) Function - Sine Wave 50 mV (X10 probe) Amplitude - Mid-Range Time/Div - 1 ms Frequency - 1 MHz Trigger Source - CH1 Counter Select - Internal (INT) Sweep Mode - Auto Modulation - AM Modulation Adjust Knob - Mid-Range Range - 10 kHz Frequency Adjust Knob - Mid-Range", "Phase to Frequency Modulation Armstrong Method e frequency determines the amount of frequency deviation. ermines the amount of frequency deviation. wer than the carrier.debands may contain more power than the carrier. more power than the carrier. more power than the carrier."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["Phase modulation will occur when the phase of a crystal oscillator's output is varied.  The phase change is the result of changing the phase angle of an RC network in conjunction with the frequency-corrected modulating signal.", "Phase modulation will occur when the phase of a crystal oscillator's output is varied. The phase change is the result of changing the phase angle of an RC network in conjunction with the frequency-corrected modulating signal."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["The purpose of the guard bands in an FM signal is to _______", "isolate the carrier from the intelligence.", "differentiate between AM and FM signals.", "provide a buffer against adjacent channel interference.", "provide extra power to the sidebands.ls."], "jumps": ["P2310"]}, {"id": "P2331", "text": [], "jumps": []}, {"id": "P2332", "text": ["The carrier and the intelligence must remain a single entity until the signal passes through the discriminator."], "jumps": []}, {"id": "P2333", "text": ["Guard bands are not needed for AM/FM recognition.", "Guard bands are not needed for AM/FM recognition..........."], "jumps": []}, {"id": "P2334", "text": ["In FM signals, the power in the sidebands is produced by the amplitude of the modulating signal."], "jumps": []}, {"id": "P2340", "text": ["Tuning Methods: \nReceivers may be tuned in one of two ways:", "Tuning Methods: Receivers may be tuned in one of two ways: 1. Manual Tuning 2. Synthesized Tuning", "Range - 1 MHz CH1 Volts/Div - .5 V (X1 probe) Function - Sine Wave 50 mV (X10 probe) Amplitude - Mid-Range Time/Div - 1 ms Frequency - 1 MHz Trigger Source - CH1 Counter Select - Internal (INT) Sweep Mode - Auto Modulation - AM Modulation Adjust Knob - Mid-Range Range - 10 kHz Frequency Adjust Knob - Mid-Range", "1. Manual Tuning 2. Synthesized Tuning thod e frequency determines the amount of frequency deviation. ermines the amount of frequency deviation. wer than the carrier.debands may contain more power than the carrier. more power than the carrier. more power than the carrier."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["Manual Tuning: \nManual Tuning circuitry will vary to some degree from one receiver to another.  This is primarily due to the whim of whatever engineer designed the receiver, and also due to component availability.", "Potentiometer R1 performs manual tuning when selected.", "Manual Tuning: Manual Tuning circuitry will vary to some degree from one receiver to another. This is primarily due to the whim of whatever engineer designed the receiver, and also due to component availability.", "Potentiometer R1 performs manual tuning when selected.riable resistor R1 is the actual tuning control used for frequency selection. As the knob is rotated clockwise, the voltage increases."], "jumps": ["P2360", "P2340", "P2370", "P2350"]}, {"id": "P2370", "text": ["This voltage crosses S1, the Tuning Select Switch (which will be in the DOWN position for manual operation) and feeds up to the filter consisting of D2, L1."], "jumps": ["P2380", "P2360"]}, {"id": "P2380", "text": ["D2 is a Varactor which is a specialized diode primarily used for its voltage controlled variable capacitance.  Varactors have replaced the mechanically tuned capacitors which where the mainstay of older receivers.", "D2 is a Varactor which is a specialized diode primarily used for its voltage controlled variable capacitance. Varactors have replaced the mechanically tuned capacitors which where the mainstay of older receivers."], "jumps": ["P2390", "P2360"]}, {"id": "P2390", "text": ["As the voltage level increases across D2, its capacitance decreases, which, in turn, increases the frequency.  Remember, all local radio frequencies are interfacing with the antenna at any given moment of time.  It's the job of the filter to pass only the desired frequency.", "As the voltage level increases across D2, its capacitance decreases, which, in turn, increases the frequency. Remember, all local radio frequencies are interfacing with the antenna at any given moment of time. It's the job of the filter to pass only the desired frequency."], "jumps": ["P2400", "P2360"]}, {"id": "P2400", "text": ["Note the tank circuit formed by varactor D1 and variable inductor L2.  This circuit provides a reference frequency for the voltage controlled oscillator.  It, too, is controlled by the voltage from R1.", "Note the tank circuit formed by varactor D1 and variable inductor L2. This circuit provides a reference frequency for the voltage controlled oscillator. It, too, is controlled by the voltage from R1."], "jumps": ["P2410", "P2360"]}, {"id": "P2410", "text": ["This means that both circuits simultaneously tune to the same frequency. It is critical for these two circuits to work together, any frequency difference will cause tracking errors. The local oscillator must be precisely at 10.7 MHz below the tuned RF, otherwise stations will appear on the dial where they shouldn't be."], "jumps": ["P2420", "P2360"]}, {"id": "P2420", "text": ["While exact tuning between the RF and the local oscillator is desired, achieving it is not possible; there will always be some     measurable error.", "Synthesized Tuning: \nA receiver's ability to faithfully reproduce a desired signal is     based predominantly by its sensitivity and selectivity of the       incoming RF signal.", "While exact tuning between the RF and the local oscillator is desired, achieving it is not possible; there will always be some measurable error.", "Synthesized Tuning: A receiver's ability to faithfully reproduce a desired signal is based predominantly by its sensitivity and selectivity of the incoming RF signal."], "jumps": ["P2430", "P2360", "P2440"]}, {"id": "P2440", "text": ["The quality of those two characteristics may be affected by any number of reasons both internal and external of the receiver.         Station drift, atmospheric interference, and internally generated    noise are a few of the reasons for poor reception.", "The quality of those two characteristics may be affected by any number of reasons both internal and external of the receiver. Station drift, atmospheric interference, and internally generated noise are a few of the reasons for poor reception...."], "jumps": ["P2450", "P2430"]}, {"id": "P2450", "text": ["The use of Synthesized Tuning Loops help eliminate these problems or at least reduce them to an acceptable level."], "jumps": ["P2460", "P2430"]}, {"id": "P2460", "text": ["Synthesized Tuning is a tuning technique that has become popular in recent years; not just in radio, but television, radar and other applications.  Some of the benefits include:", "Synthesized Tuning is a tuning technique that has become popular in recent years; not just in radio, but television, radar and other applications. Some of the benefits include: (Graphics Text)1. Greater frequency stability. 2. Frequency may be changed electronically which allows for control by microprocessors. 3. Reduced costs through the elimination of expensive 4. Much smaller size. 5. Greater speed and accuracy.", "Range - 1 MHz CH1 Volts/Div - .5 V (X1 probe) Function - Sine Wave 50 mV (X10 probe) Amplitude - Mid-Range Time/Div - 1 ms Frequency - 1 MHz Trigger Source - CH1 Counter Select - Internal (INT) Sweep Mode - Auto Modulation - AM Modulation Adjust Knob - Mid-Range Range - 10 kHz Frequency Adjust Knob - Mid-Range", "1. Greater frequency stability. 2. Frequency may be changed electronically which allows for control by microprocessors. 3. Reduced costs through the elimination of expensive electromagnetic/mechanical devices. 4. Much smaller size. 5. Greater speed and accuracy. and accuracy."], "jumps": ["P2470", "P2450"]}, {"id": "P2470", "text": ["There are several different methods of synthesized tuning, but they can be broken down into two groups:", "There are several different methods of synthesized tuning, but they can be broken down into two groups: Direct Synthesis: which uses filtering, mixing and multiplication to derive a specific frequency. Indirect Synthesis: which incorporates Phase-Lock Loops (PLL) and Voltage Controlled Oscillators (VCO) to acquire the desired frequency.", "Range - 1 MHz CH1 Volts/Div - .5 V (X1 probe) Function - Sine Wave 50 mV (X10 probe) Amplitude - Mid-Range Time/Div - 1 ms Frequency - 1 MHz Trigger Source - CH1 Counter Select - Internal (INT) Sweep Mode - Auto Modulation - AM Modulation Adjust Knob - Mid-Range Range - 10 kHz Frequency Adjust Knob - Mid-Range", "Direct Synthesis: which uses filtering, mixing and multiplication to derive a specific frequency. Indirect Synthesis: which incorporates Phase-Lock Loops (PLL) and Voltage Controlled Oscillators (VCO) to acquire the desired frequency."], "jumps": ["P2480", "P2460", "PLL"]}, {"id": "P2480", "text": ["The term \"synthesis\" refers to any process whereby separate elements are combined to create or form a coherent whole. This is exactly what frequency synthesis does. It generates a large number of stable frequencies (in some pre-established range) while actually using only a few oscillators and, in most cases, only one..."], "jumps": ["P2490", "P2470"]}, {"id": "P2490", "text": ["Simply stated, a Phase-Lock Loop system compares the output of a Voltage Controlled Oscillator (VCO) with an established reference frequency."], "jumps": ["P2500", "P2470"]}, {"id": "P2500", "text": ["If the output is in error, a DC controlling voltage is produced to steer the VCO output."], "jumps": ["P2510", "P2490"]}, {"id": "P2510", "text": ["The VCO was first addressed in the discussion of the RF section of the receiver.  Unlike normal crystal oscillators which operate at a set frequency, the frequency of the oscillator in a VCO is variable based on the voltage applied to its tuning capacitor (the previously mentioned varactor) at the input of the VCO.", "The VCO was first addressed in the discussion of the RF section of the receiver. Unlike normal crystal oscillators which operate at a set frequency, the frequency of the oscillator in a VCO is variable based on the voltage applied to its tuning capacitor (the previously mentioned varactor) at the input of the VCO."], "jumps": ["P2520", "P2490"]}, {"id": "P2520", "text": ["Phase Detectors may be categorized into two broad groups; sequential circuits and multiplier circuits."], "jumps": ["P2530", "P2490"]}, {"id": "P2530", "text": ["Multipliers provide a DC error output as the product of the reference frequency times the input frequency.  A well designed   multiplier is capable of phase lock on signals residing in electronically noisy environments.", "Multipliers provide a DC error output as the product of the reference frequency times the input frequency. A well designed multiplier is capable of phase lock on signals residing in electronically noisy environments."], "jumps": ["P2540", "P2490"]}, {"id": "P2540", "text": ["Sequential phase detectors are normally designed using digital circuits and, in effect, have memory.  This is not true with multipliers, which are zero-memory devices.  The output voltage generated by sequential phase detectors is the result of the time interval between the zero crossing of the two frequencies.", "Sequential phase detectors are normally designed using digital circuits and, in effect, have memory. This is not true with multipliers, which are zero-memory devices. The output voltage generated by sequential phase detectors is the result of the time interval between the zero crossing of the two frequencies."], "jumps": ["P2550", "P2530"]}, {"id": "P2550", "text": ["With the memory capability of sequential detectors, they are capable of providing phase detection characteristics that are not normally obtainable when multiplier circuits are used."], "jumps": ["P2560", "P2540"]}, {"id": "P2560", "text": ["The Phase Detector used on the PC130-438, PC130-441 and PC130-444 circuit cards is a tri-state, sequential device, Its job is to compare reference frequency against the incoming frequency of the VCO."], "jumps": ["P2570", "P2540"]}, {"id": "P2570", "text": ["When the frequency and phase of the two signals are equal, PD out, located at pin 5, is in a high impedance state.  When the VCO's output (fv) is greater than reference frequency (fr) the phase detector outputs negative pulses.  When fv is smaller than fr, the phase detector outputs positive pulses.", "When the frequency and phase of the two signals are equal, PD out, located at pin 5, is in a high impedance state. When the VCO's output (fv) is greater than reference frequency (fr) the phase detector outputs negative pulses. When fv is smaller than fr, the phase detector outputs positive pulses."], "jumps": ["P2580", "P2560"]}, {"id": "P2580", "text": ["Phase Detectors are categorized into what two groups?", "Phase Detectors are categorized into what two groups?......"], "jumps": ["P2570"]}, {"id": "P2581", "text": [], "jumps": []}, {"id": "P2582", "text": ["The groups describe the type of circuits and functional characteristics they possess."], "jumps": []}, {"id": "P2590", "text": ["Programmable Counters/Dividers are commonly used devices in a PLL because they are easily controlled by microprocessors and may be programmed to operate in different frequency ranges. Most counters, however, are best suited for operation in the 100 MHz range or lower. This problem has already been addressed."], "jumps": ["P2600", "P2580"]}, {"id": "P2600", "text": ["The last major component of the phase-lock loop is the loop filter.  It is usually a simple low-pass filter but is very important to the overall operation of the PLL.", "The last major component of the phase-lock loop is the loop filter. It is usually a simple low-pass filter but is very important to the overall operation of the PLL."], "jumps": ["P2610", "P2590"]}, {"id": "P2610", "text": ["The filter's primary goal is to remove any harmonic components of the reference frequency as well as any noise elements that may be, and normally are, present."], "jumps": ["P2620", "P2590"]}, {"id": "P2620", "text": ["Most of the phase-lock loop components shown above are contained in the IC chip, U-2 on the Nida PC130-441 circuit card."], "jumps": ["P2630", "P2590"]}, {"id": "P2630", "text": ["U2 is a nearly self-contained Phase-Lock Loop that is directly governed by the microprocessor U1.  In a sense, it is also controlled by the VCO which is U1 on the PC130-442 circuit card.", "U2 is a nearly self-contained Phase-Lock Loop that is directly governed by the microprocessor U1. In a sense, it is also controlled by the VCO which is U1 on the PC130-442 circuit card."], "jumps": ["P2910", "P2590"]}, {"id": "P2910", "text": ["This completes the information on FM RECEIVER SECTIONS.", "This completes the information on FM RECEIVER SECTIONS....."], "jumps": ["P2001", "P2590"]}, {"id": "P2920", "text": ["1.  The Local Oscillator in an FM receiver works the same as in           AM receiver except that the IF is standard at 10.7 MHz instead        of 455 kHz.", "1. The Local Oscillator in an FM receiver works the same as in AM receiver except that the IF is standard at 10.7 MHz instead of 455 kHz."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2.  FM receivers normally incorporate two or more IF stages.", "2. FM receivers normally incorporate two or more IF stages."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3.  The Limiter's primary function is to provide a constant output         above a certain voltage value.  That value is commonly                    referred to as threshold, quieting or limiting knee voltage.", "3. The Limiter's primary function is to provide a constant output above a certain voltage value. That value is commonly referred to as threshold, quieting or limiting knee voltage."], "jumps": ["P2950", "P2920"]}, {"id": "P2950", "text": let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
