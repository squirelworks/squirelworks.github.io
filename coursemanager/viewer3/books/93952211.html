80"]}, {"id": "P1300", "text": ["6.  Set the DC Offset button Out.\n7.  Push in the Duty Cycle (Symmetry) In, and rotate the Duty               Cycle control knob CW and CCW.  Notice the effect on the              output waveform.", "6. Set the DC Offset button Out. 7. Push in the Duty Cycle (Symmetry) In, and rotate the Duty Cycle control knob CW and CCW. Notice the effect on the output waveform..."], "jumps": ["P1301", "P1280"]}, {"id": "P1301", "text": ["8.  Select the triangle wave function.\n9.  Adjust the Duty Cycle (Symmetry) control knob CW and CCW.       Notice that you are producing different ramp waves by using         the symmetry control.", "8. Select the triangle wave function. 9. Adjust the Duty Cycle (Symmetry) control knob CW and CCW. Notice that you are producing different ramp waves by using the symmetry control..."], "jumps": ["P1307", "P1280"]}, {"id": "P1307", "text": ["10.  Select the square wave function.\n11.  Ensure the Duty Cycle button is pushed in and rotate the                 Duty Cycle (Symmetry) CW and CCW.  Notice that you are               producing different pulse waves by using the symmetry                  control.", "10. Select the square wave function. 11. Ensure the Duty Cycle button is pushed in and rotate the Duty Cycle (Symmetry) CW and CCW. Notice that you are producing different pulse waves by using the symmetry control."], "jumps": ["P1310", "P1280"]}, {"id": "P1310", "text": ["12.  Push the Duty Cycle out.  Now, let's modulate the output                signal.", "12. Push the Duty Cycle out. Now, let's modulate the output signal.nal..nal."], "jumps": ["P1320", "P1280"]}, {"id": "P1320", "text": ["1.  Set the output of the Function Generator for a 4 Vpp SINE               wave.  \n2.  Set the Time/Div control on the Oscilloscope to 2 msec.  The          trace on the Oscilloscope is the high frequency signal that will      be modulated.  Notice the peak to peak amplitude.", "1. Set the output of the Function Generator for a 4 Vpp SINE wave. 2. Set the Time/Div control on the Oscilloscope to 2 msec. The trace on the Oscilloscope is the high frequency signal that will be modulated. Notice the peak to peak amplitude."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["3.  Push the Modulation buttons in and ensure function is Sine           Wave, and 20 k button is in.\n4.  Rotate the Coarse Frequency until 10.000 is displayed.  Use           the Fine control knob if necessary.  This is a AM modulated            signal.", "3. Push the Modulation buttons in and ensure function is Sine Wave, and 20 k button is in. 4. Rotate the Coarse Frequency until 10.000 is displayed. Use the Fine control knob if necessary. This is a AM modulated signal..."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["5.  Vary the Coarse frequency knob CW and CCW. \n6.  Vary the % modulation knob CW and CCW.  Notice the effect         of these controls on the output signal.", "5. Vary the Coarse frequency knob CW and CCW. 6. Vary the % modulation knob CW and CCW. Notice the effect of these controls on the output signal.y using the symmetry control..."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["7.  Set the Time/Div on the Oscilloscope to 20 ms.\n8.  Push in the Triangle button on the Function Generator.  Notice      the effect of these controls on the output signal.", "7. Set the Time/Div on the Oscilloscope to 20 ms. 8. Push in the Triangle button on the Function Generator. Notice the effect of these controls on the output signal."], "jumps": ["P1360", "P1330"]}, {"id": "P1360", "text": ["9. Push the function button Sine wave to In. Depress the FM/AM switch until it is in the out position. This will be a FM modulated signal. 10. Push in the 20 k Range button and adjust the Coarse and Fine frequency knobs to mid position. 11. Set the Time/Div to 20 ms..."], "jumps": ["P1370", "P1330"]}, {"id": "P1370", "text": ["12.  Vary the Coarse and Fine frequency control CW and CCW.  \n13.  Vary let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
