olumn added to the decimal chart is 10 times the value of the preceding column."], "jumps": ["P1070"]}, {"id": "P1100", "text": ["What is the decimal number if the count is increased by 1?", "What is the decimal number if the count is increased by 1?."], "jumps": ["P1070"]}, {"id": "P1101", "text": [], "jumps": []}, {"id": "P1110", "text": ["The Binary System is very common in digital electronics.", "The Binary System is very common in digital electronics...."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["The Binary System or base 2 uses only two digits. They are:"], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["Counting in the base 2 system begins at  0 and continues to 1. The 2 digits are written in the 1's column.", "Counting in the base 2 system begins at 0 and continues to 1. The 2 digits are written in the 1's column."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["When the count of one is exceeded, a zero is placed in the 1's column and a one is placed in the 2's column."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["Each column added to the binary chart is 2 times the value of the preceding column."], "jumps": ["P1130"]}, {"id": "P1160", "text": ["What is the binary number if the count is increased by 1?", "What is the binary number if the count is increased by 1?.."], "jumps": ["P1130"]}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1162", "text": ["When the count of 1 is exceeded, place a zero in that column and add one to the next higher column."], "jumps": []}, {"id": "P1170", "text": ["The Octal System is also common in digital electronics.", "The Octal System is also common in digital electronics....."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["The Octal System or base 8 uses eight digits. They are:", "The Octal System or base 8 uses eight digits. They are:...."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["Counting in the base 8 system begins at 0 and continues to 7. All 8 d "id": "P3910", "text": ["This completes the information on MATH OPERATIONS.", "This completes the information on MATH OPERATIONS.E........"], "jumps": ["P3001", "P3180"]}, {"id": "P3920", "text": ["1.  Addition is performed by adding binary numbers together. A          carry results when the count exceeds 1.", "1. Addition is performed by adding binary numbers together. A carry results when the count exceeds 1.", "10 + 01 11 action on 3 4 5 6 7 8 9 1 000000000", "1 Carry 111 1001 on 3 4 5 6 7 8 9 1 000000000"], "jumps": ["P3930", "P3001"]}, {"id": "P3930", "text": ["2.  Subtraction:", "2. Subtraction: ment the subtrahend. 2. Add the complimented subtrahend to the minuend. 3. If a carry is generated add it into th result; the aswer is positive. 4. If a carry is not generated, compliment the result; the answer is negative.", "111101 111101 - = + + 9 1 000000000", "110001 110001 - = + 8 9 1 000000000", "1. Complement the subtrahend. 2. Add the complemented subtrahend to the minuend. 3. If a carry is generated add it into the result; the answer is positive. 4. If a carry is not generated, complement the result; the answer is negative....."], "jumps": ["P3940", "P3920"]}, {"id": "P3940", "text": ["3.  Multiplication is performed as any multiplication is performed.       In this example 100 is multiplied by 10.", "3. Multiplication is performed as any multiplication is performed. In this example 100 is multiplied by 10..", "100 x 10 000 + 100 3 4 5 6 7 8 9 1 000000000"], "jumps": ["P3950", "P3930"]}, {"id": "P3950", "text": ["4.  Binary division follows the same rules as decimal division.", "4. Binary division follows the same rules as decimal division.", "10 1100 01 01 + 111 10101 3 4 5 6 7 8 9 1 000000000"], "jumps": ["P3999", "P3940"]}, {"id": "P3999", "text": ["You have completed the Summary. \nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P3001", "P3950"]}, {"id": "P4001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P4020", "text": ["This experiment demonstrates the conversion from a binary number to octal, decimal and hexadecimal."], "jumps": ["P4001"]}, {"id": "P4040", "text": ["The four horizontal yellow LEDs on PC130-124 represent the binary number."], "jumps": ["P4020"]}, {"id": "P4050", "text": ["The 16 vertical LEDs on PC130-124 display the results of the conversion."], "jumps": ["P4040"]}, {"id": "P4060", "text": ["When switch S1 is in the 8 position, LEDs 0 through 7 represent an octal number."], "jumps": ["P4040"]}, {"id": "P4070", "text": ["When switch S1 is in the10 position, LEDs 0 through 9 represent a decimal number."], "jumps": ["P4040"]}, {"id": "P4080", "text": ["When switch S1 is in the 16 position, LEDs 0 through F represent a hexadecimal number. Let's start the experiment."], "jumps": ["P4040"]}, {"id": "P4090", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P4040"]}, {"id": "P4100", "text": ["2.  Set the Voltmeter Switch to Positive. \n3.  Set the Positive Supply Voltage to 5. The Test Console's                 Voltage Meter should indicate 5 volts.", "2. Set the Voltmeter Switch to Positive. 3. Set the Positive Supply Voltage to 5. The Test Console's Voltage Meter should indicate 5 volts."], "jumps": ["P4090"]}, {"id": "P4110", "text": ["4.  Carefully plug PC130-111 into the Test Console PC1 position. 5.  Carefully plug PC130-124 into the Test Console PC2 position.", "4. Carefully plug PC130-111 into the Test Console PC1 position. 5. Carefully plug PC130-124 into the Test Console PC2 position. r switch to ON........................................."], "jumps": ["P4100", "P4115"]}, {"id": "P4115", "text": ["EXPERIMENT CARD PLACEMENT - PC130-111 shown in PC1 position. PC130-124 shown in PC2 position."], "jumps": []}, {"id": "P4120", "text": ["6.  Set S2 to PULSER on PC130-111.  \n7.  Set S1 to 16 and S3 to OFF on PC130-124.", "6. Set S2 to PULSER on PC130-111. 7. Set S1 to 16 and S3 to OFF on PC130-124."], "jumps": ["P4110"]}, {"id": "P4130", "text": ["8.  Set PC1 and PC2 DC Power switches to ON.", "8. Set PC1 and PC2 DC Power switches to ON.. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P4120"]}, {"id": "P4140", "text": ["9.  Press and release S2 on PC130-124 to clear the binary                     counter.  All LEDs on PC130-124 should be off.", "9. Press and release S2 on PC130-124 to clear the binary counter. All LEDs on PC130-124 should be off."], "jumps": ["P4130"]}, {"id": "P4150", "text": ["The circuit is now set properly. Let's start by checking the operation of the binary counter."], "jumps": ["P4140"]}, {"id": "P4160", "text": ["1.  Press and release S1 on PC130-111. Observe that LED 1 is on       and LEDs 2, 4 and 8 are off. The number 1 is represented in            binary 0001.", "1. Press and release S1 on PC130-111. Observe that LED 1 is on and LEDs 2, 4 and 8 are off. The number 1 is represented in binary 0001."], "jumps": ["P4150"]}, {"id": "P4170", "text": ["2.  Press and release S1 on PC130-111. Observe that LED 2 is on       and LEDs 1, 4 and 8 are off. The number 2 is represented in            binary 0010.", "2. Press and release S1 on PC130-111. Observe that LED 2 is on and LEDs 1, 4 and 8 are off. The number 2 is represented in binary 0010.."], "jumps": ["P4160"]}, {"id": "P4180", "text": ["3.  Press and release S1 on PC130-111. Observe that LEDs 1 and       2 are on and LEDs 4 and 8 are off. The number 3 is                            represented in binary 0011.", "3. Press and release S1 on PC130-111. Observe that LEDs 1 and 2 are on and LEDs 4 and 8 are off. The number 3 is represented in binary 0011."], "jumps": ["P4170"]}, {"id": "P4190", "text": ["4.  Set S2 to CLOCK on PC130-111. Observe the count cycles              from 0000 to 1111 or from 0 to 15.", "4. Set S2 to CLOCK on PC130-111. Observe the count cycles from 0000 to 1111 or from 0 to 15."], "jumps": ["P4200", "P4180"]}, {"id": "P4200", "text": ["Now you will activate the base 8 LEDs and observe the conversion from binary to octal."], "jumps": ["P4190"]}, {"id": "P4210", "text": ["1.  Set S2 to PULSER on PC130-111. \n2.  Set S1 to 8 and S3 to READ on PC130-124. \n3.  Press and release S2 on PC130-124. Observe that all binary           LEDs  are off, indicating a count of zero. Note that the base 8         LED for zero is on.", "1. Set S2 to PULSER on PC130-111. 2. Set S1 to 8 and S3 to READ on PC130-124. 3. Press and release S2 on PC130-124. Observe that all binary LEDs are off, indicating a count of zero. Note that the base 8 LED for zero is on."], "jumps": ["P4220", "P4200"]}, {"id": "P4220", "text": ["4.  Press and release S1 on PC130-111. Observe the binary count      increased by 1. At the same time the octal count increased by        1.", "4. Press and release S1 on PC130-111. Observe the binary count increased by 1. At the same time the octal count increased by 1."], "jumps": ["P4230", "P4210"]}, {"id": "P4230", "text": ["5.  Slowly press and release S1 on PC130-111 several times.               Compare the changing binary number to the changing octal          number. Notice, the binary number returns to 0000 when the          count exceeds 7.", "5. Slowly press and release S1 on PC130-111 several times. Compare the changing binary number to the changing octal number. Notice, the binary number returns to 0000 when the count exceeds 7."], "jumps": ["P4240", "P4220"]}, {"id": "P4240", "text": ["Now you will activate the base 10 LEDs and observe the conversion from binary to decimal."], "jumps": ["P4230"]}, {"id": "P4250", "text": ["1.  Set S1 to 10 on PC130-124.  \n2.  Press and release S2 on PC130-124. Observe that all binary           LEDs are off, indicating a count of zero. Note that the base 10        LED for zero is on.", "1. Set S1 to 10 on PC130-124. 2. Press and release S2 on PC130-124. Observe that all binary LEDs are off, indicating a count of zero. Note that the base 10 LED for zero is on..."], "jumps": ["P4260", "P4240"]}, {"id": "P4260", "text": ["3.  Press and release S1 on PC130-111. Observe the binary count      increased by 1. At the same time the decimal count increased        by 1.", "3. Press and release S1 on PC130-111. Observe the binary count increased by 1. At the same time the decimal count increased by 1."], "jumps": ["P4270", "P4250"]}, {"id": "P4270", "text": ["4.  Press and release S1 on PC130-111 until the green LED 7 is           illuminated.\n5.  Press and release S1 on PC130-111. Observe the binary count      is 1000 and the red decimal 8 LED is on.", "4. Press and release S1 on PC130-111 until the green LED 7 is illuminated. 5. Press and release S1 on PC130-111. Observe the binary count is 1000 and the red decimal 8 LED is on...."], "jumps": ["P4280", "P4260"]}, {"id": "P4280", "text": ["6.  Slowly press and release S1 on PC130-111 several times.               Compare the changing binary number to the changing                     decimal number. Notice, the binary number returns to 0000             when the count exceeds 9.", "6. Slowly press and release S1 on PC130-111 several times. Compare the changing binary number to the changing decimal number. Notice, the binary number returns to 0000 when the count exceeds 9..."], "jumps": ["P4290", "P4270"]}, {"id": "P4290", "text": ["Now you will activate the base 16 LEDs and observe the conversion from binary to hexadecimal."], "jumps": ["P4280"]}, {"id": "P4300", "text": ["1.  Set S1 to 16 on PC130-124. \n2.  Press and release S2 on PC130-124. Observe that all binary           LEDs are off, indicating a count of zero. Note that the base 16        LED for zero is on.", "1. Set S1 to 16 on PC130-124. 2. Press and release S2 on PC130-124. Observe that all binary LEDs are off, indicating a count of zero. Note that the base 16 LED for ze let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
