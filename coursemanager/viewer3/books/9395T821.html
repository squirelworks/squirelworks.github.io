d will run faithfully for years on a set of batteries or even solar power.power.."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["More impressive is that the Eniac of the 1950's cost over one million dollars and today the calculator costs well under one hundred dollars."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["Which of the following is a true statement?", "Which of the following is a true statement?................", "The Univac was the first fully electronic computer.", "Experimental computers were built in the 1940's."], "jumps": ["P1070"]}, {"id": "P1091", "text": [], "jumps": []}, {"id": "P1092", "text": ["The ENIAC was the first fully electronic computer.", "The ENIAC was the first fully electronic computer.........."], "jumps": []}, {"id": "P1093", "text": ["Early computers were unreliable because they used vacuum tubes."], "jumps": []}, {"id": "P1100", "text": ["Today's desktop computer is as powerful as anything that existed in the 1950's.  It is smaller, uses less power and is far more reliable.", "Today's desktop computer is as powerful as anything that existed in the 1950's. It is smaller, uses less power and is far more reliable.ess power and is far more reliable..."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["What caused system reliability to increase, the size to decrease,  and power consumption to be lower?  Breakthroughs in technology!", "What caused system reliability to increase, the size to decrease, and power consumption to be lower? Breakthroughs in technology!"], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["The first electronic computers relied on vacuum tubes.  They were fine, but they were large, expensive and required a lot of electricity.", "The first electronic computers relied on vacuum tubes. They were fine, but they were large, expensive and required a lot of electricity. roprocessors which are small and do not require much electricity to operate........"], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["While reliable during their manufactured life expectancy, heat and other factors limited the life span of vacuum tubes.  This required the tubes to be replaced frequently.", "While reliable during their manufactured life expectancy, heat and other factors limited the life span of vacuum tubes. This required the tubes to be replaced frequently."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["Then the transistor was born.  Invented at Bell Laboratories in 1947, it was first used in computers in the 1950's.", "Then the transistor was born. Invented at Bell Laboratories in 1947, it was first used in computers in the 1950's."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["Transistors did the same job as vacuum tubes but they were smaller, needed less electricity, and had a longer operational life.", "Transistors did the same job as vacuum tubes but they were smaller, needed less electricity, and had a longer operational life.ife."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["The next step in the evolution of the computer was in 1964, when the integrated circuit or \"chip\" replaced the transistor."], "jumps": ["P1170", "P1140"]}, {"id": "P1170", "text": ["Today, thousands of transistors can be formed on a single silicon chip.", "Today, thousands of transistors can be formed on a single silicon chip. A typical microprocessor today has millions of transistors."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["Advancements in transistor and IC technology have led to the creation of the microprocessor.  A typical microprocessor IC has millions of transistors formed inside.", "Advancements in transistor and IC technology have led to the creation of the microprocessor. A typical microprocessor IC has millions of transistors formed inside. d inside. sterday's computers.........."], "jumps": ["P1200", "P1160"]}, {"id": "P1200", "text": ["Select the component that was the first technological breakthrough in t is a microprocessor system?  A microprocessor system is one which performs functions on inputs and provides outputs.", "If you have played a video game, used a calculator or a VCR, you have used a microprocessor.  Each of these devices have one thing in common...", "What is a microprocessor system? A microprocessor system is one which performs functions on inputs and provides outputs.", "If you have played a video game, used a calculator or a VCR, you have used a microprocessor. Each of these devices have one thing in common..."], "jumps": ["P2030", "P2001", "P2035", "P2020"]}, {"id": "P2035", "text": ["... a microprocessor.", "... a microprocessor.xt here..............................."], "jumps": ["P2040", "P2030"]}, {"id": "P2040", "text": ["There are three categories of computers: the macro, mini and micro computer."], "jumps": ["P2030"]}, {"id": "P2041", "text": ["There are three categories of computers: the macro, mini and micro computer.", "There are three categories of computers: the macro, mini and micro computer...ose system. This computer is used in research, military and government applications. This is where the most expensive and powerful processors are used..."], "jumps": []}, {"id": "P2042", "text": ["There are three categories of computers: the macro, mini and micro computer."], "jumps": ["P2050", "P2035"]}, {"id": "P2050", "text": ["The macrocomputer, also known as a mainframe or supercomputer, is a general purpose system.  This computer is used in research, military and government applications.  This is where the most expensive and powerful processors are used.", "The macrocomputer, also known as a mainframe or supercomputer, is a general purpose system. This computer is used in research, military and government applications. This is where the most expensive and powerful processors are used..."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["It is used where enormous amounts of data must be manipulated very quickly."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["The minicomputer handles tasks similar to the macro, but on a smaller scale. It is used for single primary tasks such as inventory or billing of clients for large corporations. These microprocessors are not as powerful as the ones in macrocomputers but more powerful than those in the microcomputer....."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["The microcomputer is smaller than the minicomputer.  Microcomputers are used by small business and people at home.  These microprocessors are the most common and highly mass produced.", "The microcomputer is smaller than the minicomputer. Microcomputers are used by small business and people at home. These microprocessors are the most common and highly mass produced..."], "jumps": ["P2090", "P2040"]}, {"id": "P2090", "text": ["The microprocessors used in microcomputers are also used as a microcontroller in many consumer products, like video games, microwave ovens and stereo systems."], "jumps": ["P2100", "P2040"]}, {"id": "P2100", "text": ["It is important to note that Macro and Mini computer systems are being phased out by the incredible growth in the technology of microcomputer microprocessors."], "jumps": ["P2110", "P2040"]}, {"id": "P2110", "text": ["Another name for the macrocomputer is _______", "Another name for the macrocomputer is _______.............."], "jumps": ["P2040"]}, {"id": "P2111", "text": [], "jumps": []}, {"id": "P2112", "text": ["The macrocomputer is not also called a Millicomputer.", "The macrocomputer is not also called a Millicomputer......."], "jumps": []}, {"id": "P2113", "text": ["The macrocomputer is not also called a Megaprocessor.", "The macrocomputer is not also called a Megaprocessor......."], "jumps": []}, {"id": "P2130", "text": ["A microprocessor system is made up of five basic parts:  the input, the control, the memory, the arithmetic logic unit and the output.", "A microprocessor system is made up of five basic parts: the input, the control, the memory, the arithmetic logic unit and the output."], "jumps": ["P2135", "P2110"]}, {"id": "P2135", "text": ["Input is the information provided to the microprocessor.  The most common input device is the keyboard.  Other input devices include tapes, hard and floppy disks, mouse and other devices.", "Input is the information provided to the microprocessor. The most common input device is the keyboard. Other input devices include tapes, hard and floppy disks, mouse and other devices.ces."], "jumps": ["P2140", "P2130"]}, {"id": "P2140", "text": ["Output is the information generated by the microprocessor.  We receive the microprocessor's output in many ways.  The most common output devices are the video screen and printers.", "Output is the information generated by the microprocessor. We receive the microprocessor's output in many ways. The most common output devices are the video screen and printers."], "jumps": ["P2150", "P2135"]}, {"id": "P2150", "text": ["The Arithmetic Logic Unit (ALU) is the device which performs all the math and logic functions for the microprocessor."], "jumps": []}, {"id": "P2160", "text": ["The memory section contains all the data used by the system.  This includes both instructions and information.", "The memory section contains all the data used by the system. This includes both instructions and information."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["The control section regulates the movement of data and the processing of data at the inputs and outputs."], "jumps": ["P2190", "P2160"]}, {"id": "P2190", "text": ["Which of the following is an input device?", "Which of the following is an input device?................."], "jumps": ["P2170"]}, {"id": "P2191", "text": [], "jumps": []}, {"id": "P2192", "text": ["The printer is an output device, not an input device.", "The printer is an output device, not an input device......."], "jumps": []}, {"id": "P2193", "text": ["The monitor is an output device, not an input device.", "The monitor is an output device, not an input device......."], "jumps": []}, {"id": "P2300", "text": ["Here is an example of the control section of the microprocessor moving data to the ALU to be processed."], "jumps": ["P2320", "P2190"]}, {"id": "P2320", "text": ["The control unit also activates the ALU, allowing the modified data to be returned to memory."], "jumps": ["P2330", "P2300"]}, {"id": "P2330", "text": ["You have seen data travel from one section of the microprocessor to another. Data is transferred from one section to another using a system of wires called buses.to connect the sections. Data is transferred from one section to another on these buses........."], "jumps": ["P2340", "P2300"]}, {"id": "P2340", "text": ["The data bus carries data between the main sections of the system as controlled by the microprocessor."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["The address bus selects a memory location or an input/output device."], "jumps": ["P2355", "P2330"]}, {"id": "P2355", "text": ["This allows the memory or input/output device to place data on or take data from the data bus."], "jumps": ["P2360", "P2330"]}, {"id": "P2360", "text": ["The control bus carries various signals from the microprocessor that coordinate operations."], "jumps": ["P2365", "P2330"]}, {"id": "P2365", "text": ["These signals control the other devices and allow the CPU to know if data is being received or sent."], "jumps": ["P2910", "P2330"]}, {"id": "P2910", "text": ["This completes the information on STRUCTURE OF MICROPROCESSORS."], "jumps": ["P2001", "P2330"]}, {"id": "P2920", "text": ["1.  The three categories of computers are macro, mini and micro.", "1. The three categories of computers are macro, mini and micro."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2.  A microprocessor system is made up of five basic parts: the          input, the control, the memory, the arithmetic logic unit and            the output.", "2. A microprocessor system is let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
