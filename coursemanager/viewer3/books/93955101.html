<script>
const book = {"title": "93955101", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: INTRODUCTION TO ROTATING MACHINERYasdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Define a rotating machine. w Describe the various classes of rotating machinery. w Describe the advantages and disadvantages of each type of rotating machinery.", "w Define magnetism. w Describe properties of magnetic lines of force. w Define electromagnetism. w Describe magnetism as it applies to rotating machinery... machinery."], "jumps": []}, {"id": "P300", "text": ["Rotating Machinery is used in your life every single day."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["From a simple fan to your car's alternator, rotating machinery is used frequently."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Because of their frequent use, a technician must understand rotating machinery."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["To understand rotating machines, a technician must understand the theory of magnetism and electromagnetics."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["Let's begin the lesson on INTRODUCTION TO ROTATING MACHINERY................"], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": ["In this lesson you will learn about Rotating Machinery....."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Rotating machines are composed of a wide variety of devices."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Any device which exhibits a rotating shaft is called a rotating machine."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Rotating machines are commonly called motors."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["Actually, rotating machines are more than motors alone....."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["A generator is also classified as a rotating machine."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["A motor is a device that produces a mechanical force or work from an electrical input."], "jumps": ["P1090", "P1060", "P430"]}, {"id": "P1090", "text": ["A fan is one example of a motor............................"], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["A fan runs on electricity from either a wall outlet or a battery source."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["The fans motor takes the electric input and causes a mechanical output."], "jumps": ["P1120", "P1090"]}, {"id": "P1120", "text": ["The output from the motor is the turning of fan blades producing forced air flow.", "A generator is a device that produces an electrical output from a mechanical input."], "jumps": ["P1130", "P1090", "P1140"]}, {"id": "P1140", "text": ["A generator could get it's input from an engine, a nuclear reactor or some other device.", "Mechanical Input Electrical Output"], "jumps": ["P1150", "P1130", "P1160"]}, {"id": "P1160", "text": ["This mechanical input causes the generator to produce or generate an electrical output."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["The electrical energy then can be used as an input to a motor. For example, the power company uses a generator, you use the electricity to run a fan."], "jumps": ["P1180", "P1150"]}, {"id": "P1180", "text": ["Motors are classified as either Incremental or Continuous..", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["An incremental motor rotates a specific distance in degrees.", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["An incremental motor requires a specific input in order to rotate a certain distance."], "jumps": ["P1210", "P1180"]}, {"id": "P1210", "text": ["There are two basic types of incremental motors............", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["The digital incremental motor operates on a digital input.."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["This type of motor is commonly called a Stepper motor."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["Each digital pulse causes the motor shaft to rotate a specific number of degrees."], "jumps": []}, {"id": "P1250", "text": ["The other type of incremental motor is an analog type......", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["The analog incremental motor operates on an analog signal input."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["The analog incremental motor is commonly called a synchro/servo."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["Synchro/Servos are widely used in radar and navigational applications."], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["What are the two basic types of Rotating Machinery?........"], "jumps": ["P1280"]}, {"id": "P1291", "text": [], "jumps": []}, {"id": "P1292", "text": ["Digital and analog are the two basic types of incremental motors.", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."], "jumps": []}, {"id": "P1293", "text": ["Steppers and Synchro/Servos represent the digital and analog types of incremental motors.", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."], "jumps": []}, {"id": "P1300", "text": ["What are the two basic types of motors?...................."], "jumps": ["P1290"]}, {"id": "P1301", "text": [], "jumps": []}, {"id": "P1302", "text": ["Digital and analog are the two basic types of incremental motors.", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."], "jumps": []}, {"id": "P1303", "text": ["Motors and generators are the two basic types of rotating machines.", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."], "jumps": []}, {"id": "P1310", "text": ["What are the two basic types of incremental motors?........"], "jumps": ["P1300"]}, {"id": "P1311", "text": [], "jumps": []}, {"id": "P1312", "text": ["TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF.", "Incremental and Continuous are the two basic types of motors."], "jumps": []}, {"id": "P1313", "text": ["Motors and generators are the two basic types of rotating machines.", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."], "jumps": []}, {"id": "P1320", "text": ["The other type of motor classification is Continuous.......", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["A continuous motor rotates constantly, not in specific steps.", "Output Shaft of Continuous Motorrr"], "jumps": ["P1340", "P1320", "P430"]}, {"id": "P1340", "text": ["There are two basic types of continuous motors.............", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["The AC motor operates on an alternating current input signal."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["A simple sine wave input enables the AC motor to produce a constant mechanical output.", "Since AC current is easily available, AC motors are the most popular rotating devices in use today.", "Two of the biggest advantages of AC motors is that they are inexpensive and require low starting currents..", "STARTING CURRENTS - Starting current is the amount of current needed to initially turn the motor over or rotate the output shaft. Starting current is always higher than \"free-running current\" and has an effect on the cost efficiency of the motor as well as the limitations of the power supply needed to operate the motor.", "The major disadvantage of the AC motor is it's lack of speed control..", "SPEED CONTROL- Speed control is the ability to control how fast the motors output shaft rotates. This corresponds to the amount of output power the motor produces. AC motors generally lack good speed control."], "jumps": ["P1370", "P1340", "P1380", "P1360", "P1390", "P1400"]}, {"id": "P1400", "text": ["The other type of continuous motor is the DC motor.........", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["The DC motor operates on a direct current input signal....."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["A simple DC input enables the DC motor to produce a constant mechanical output."], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["The DC motor can be separated into three basic categories..", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."], "jumps": ["P1440", "P1410"]}, {"id": "P1440", "text": ["Let's discuss a few basic motor characteristics. You will study each category separately."], "jumps": ["P1640", "P1430"]}, {"id": "P1640", "text": ["What are the two types of Continuous motors?..............."], "jumps": ["P1430"]}, {"id": "P1641", "text": [], "jumps": []}, {"id": "P1642", "text": ["TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF.", "These are two types of DC motors..........................."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on INTRODUCTION TO ROTATING MACHINERY."], "jumps": ["P1001", "P1640"]}, {"id": "P1920", "text": ["1. There are two basic types of Rotating Machinery.ere....", "2. Generators produce electricity from a mechanical input."], "jumps": ["P1930", "P1001", "P1940", "P1920"]}, {"id": "P1940", "text": ["3. Motors produce a mechanical output from an electrical input."], "jumps": ["P430"]}, {"id": "P1950", "text": ["TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF.", "4. Motors are further subdivided into incremental and continuous classifications."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. Incremental motors are divided into Digital and Analog classifications while Continuous motors are divided into DC and AC classifications.", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6. The DC motor is subdivided into three categories; Shunt, Series, and Compound motors.", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."], "jumps": ["P1999", "P1950"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1970"]}, {"id": "P2001", "text": ["Magnetism is a force that attracts or repels certain types of metal objects. It is what makes rotating machinery operate."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["To understand magnetism you need to look at the characteristics of a magnet."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["Each end of a magnet has a pole. One end is the north pole and the other end is the south pole."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["All magnets have lines of force called flux lines."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["The flux lines leave the north pole and enter the south pole of the magnet."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["The flux lines form a magnetic field around the magnet."], "jumps": ["P2080", "P2040"]}, {"id": "P2072", "text": ["The flux lines form a magnetic field around the magnet....."], "jumps": ["P2080", "P2040"]}, {"id": "P2075", "text": ["MAGNETIC FIELD- A magnetic field is the region around a magnet in which magnetic forces are present. The strength and size of the magnetic field indicates the attraction or repulsion strength of the magnet."], "jumps": []}, {"id": "P2080", "text": ["The more flux lines a magnet has, the stronger the magnetic field."], "jumps": ["P2090", "P2072"]}, {"id": "P2090", "text": ["The stronger the magnetic field (more flux lines), the more work or attraction the magnet can perform."], "jumps": ["P2100", "P2072"]}, {"id": "P2100", "text": ["Magnets follow two simple rules:...........................", "1. Unlike poles attract each other 2. Like poles repel each other.", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."], "jumps": ["P2110", "P2072"]}, {"id": "P2110", "text": ["If the north and south poles of two magnets are brought together, a magnetic attraction occurs."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["The flux lines of each magnet combine causing the magnets to come together and become one magnet."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["If like poles of two magnets are brought together, they will repel each other."], "jumps": ["P2140"]}, {"id": "P2140", "text": ["The repelling force is as strong as the force of attraction when unlike poles are brought together."], "jumps": ["P2145", "P2130"]}, {"id": "P2145", "text": ["Rotating machinery uses attraction or repulsion to change electrical energy to mechanical energy and mechanical energy to electrical energy.", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."], "jumps": ["P2148", "P2140"]}, {"id": "P2148", "text": ["However, instead of using a natural magnet, man made magnets are used."], "jumps": ["P2150", "P2145"]}, {"id": "P2150", "text": ["Rotating machinery normally uses electromagnets. Electromagnets are man made."], "jumps": ["P2160", "P2145"]}, {"id": "P2160", "text": ["Electromagnets are made by applying electricity to magnetic materials."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["When electric current passes through a conductor, a small circular magnetic field, called magnemotive force (MMF), is generated."], "jumps": ["P2180", "P2150"]}, {"id": "P2180", "text": ["MMF is the magnetic field of the conductor induced by the flow of current."], "jumps": ["P2185", "P2170"]}, {"id": "P2185", "text": ["It is the MMF that produces a motor. Let's see."], "jumps": ["P2210", "P2170"]}, {"id": "P2190", "text": ["In a generator, mechanical energy is changed to electrical energy."], "jumps": ["P2200", "P2338"]}, {"id": "P2200", "text": ["When a conductor is moved through a magnetic field, a current is produced in the conductor by induced EMF."], "jumps": ["P2205", "P2338"]}, {"id": "P2203", "text": ["The right hand rule still applies. But, this time the direction of current flow is determined."], "jumps": ["P2340", "P2338", "P2209"]}, {"id": "P2205", "text": ["Note that this is opposite of passing current through a conductor."], "jumps": ["P2208", "P2338"]}, {"id": "P2208", "text": ["The right hand rule still applies. But, this time the direction of current flow is determined."], "jumps": ["P2340", "P2338", "P2209"]}, {"id": "P2209", "text": ["RIGHT HAND RULE - Place the center finger of your right hand in the direction of current flow through the conductor. Place your first finger in the direction of the magnetic field. Your thumb will point in the direction that the conductor will rotate."], "jumps": []}, {"id": "P2210", "text": ["The current carrying conductor, when placed in a magnetic field, produces its own electromagnetic field (EMF)."], "jumps": ["P2220", "P2170"]}, {"id": "P2220", "text": ["The direction of the field can be determined using the left hand rule.."], "jumps": ["P2230", "P2210"]}, {"id": "P2222", "text": ["The direction of the field can be determined using the left hand rule.."], "jumps": ["P2230", "P2210"]}, {"id": "P2225", "text": ["LEFT HAND RULE- Place the left hand so that the thumb points in the direction of current flow. The curled fingers point in the direction of the induced electromagnetic field."], "jumps": []}, {"id": "P2230", "text": ["Since current is flowing into the conductor (represented by an X), the induced electromagnetic field is traveling in a CCW direction."], "jumps": ["P2240", "P2222"]}, {"id": "P2240", "text": ["The induced electromagnetic field and the magnetic field interact."], "jumps": ["P2250", "P2222"]}, {"id": "P2250", "text": ["These two interacting forces cause the conductor to go into motion."], "jumps": ["P2260", "P2222"]}, {"id": "P2260", "text": ["The direction of motion that the conductor follows can be determined by the right hand rule."], "jumps": ["P2270", "P2222"]}, {"id": "P2265", "text": ["RIGHT HAND RULE - Place the center finger of your right hand in the direction of current flow through the conductor. Place your first finger in the direction of the magnetic field. Your thumb will point in the direction that the conductor will rotate."], "jumps": []}, {"id": "P2270", "text": ["The moving conductor is a normal phenomenon in magnetic theory. This is motor action."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["Examine the field interactions carefully..................."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["At the top interaction point the electromagnetic and magnetic fields are in opposite directions."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["Remember opposite fields attract. This tends to pull the conductor upward."], "jumps": ["P2310", "P2280"]}, {"id": "P2310", "text": ["At the bottom interaction point, the two fields are in the same direction."], "jumps": ["P2320", "P2280"]}, {"id": "P2320", "text": ["Remember, like fields repel. This tends to push the conductor upward."], "jumps": ["P2325", "P2280"]}, {"id": "P2325", "text": ["As you can see, the conductor will be forced up and out of the field."], "jumps": ["P2330", "P2280"]}, {"id": "P2330", "text": ["These combined actions illustrate why the conductor moves in the magnetic field."], "jumps": ["P2335", "P2280"]}, {"id": "P2335", "text": ["You will see how this motion is changed to the rotating motion of a motor later."], "jumps": ["P2338", "P2280"]}, {"id": "P2338", "text": ["The principles of magnetism are also used in generators...."], "jumps": ["P2190", "P2280"]}, {"id": "P2340", "text": ["All rotating machinery work under the fundamental principles of magnetism and electromagnetism.", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF."], "jumps": ["P2350", "P2338"]}, {"id": "P2350", "text": ["Which of the following terms is generated by man?.........."], "jumps": ["P2340"]}, {"id": "P2351", "text": [], "jumps": []}, {"id": "P2352", "text": ["Magnetism is a time phenomenon of nature and requires no applied voltage or current."], "jumps": []}, {"id": "P2353", "text": ["Micromagnetics are not man generated......................."], "jumps": []}, {"id": "P2360", "text": ["The left hand rule gives the direction of _______.........."], "jumps": ["P2350"]}, {"id": "P2361", "text": [], "jumps": []}, {"id": "P2362", "text": ["The left hand rule does not show the direction of rotation."], "jumps": []}, {"id": "P2363", "text": ["The direction of the voltage has no significant meaning...."], "jumps": []}, {"id": "P2370", "text": ["Passing a conductor through a magnetic field generates what?"], "jumps": ["P2360"]}, {"id": "P2371", "text": [], "jumps": []}, {"id": "P2372", "text": ["Flux is present before the conductor is passed through a magnetic field."], "jumps": []}, {"id": "P2373", "text": ["The electromagnetic field is present before a conductor is passed through the magnetic field."], "jumps": []}, {"id": "P2380", "text": ["The right hand rule gives the direction of _______........."], "jumps": ["P2370"]}, {"id": "P2381", "text": [], "jumps": []}, {"id": "P2382", "text": ["The left hand rule gives the direction of the induced electromagnetic field."], "jumps": []}, {"id": "P2383", "text": ["The direction of the voltage is not significant for this application."], "jumps": []}, {"id": "P2390", "text": ["You have now seen how magnetism plays an important part in motors and generators."], "jumps": ["P2910", "P2380"]}, {"id": "P2910", "text": ["This completes the information on MAGNETISM AND ELECTROMAGNETISM."], "jumps": ["P2001", "P2390"]}, {"id": "P2920", "text": ["1. Magnetism works on two key points: second line here....", "TDX OPERATIONAL CHECK ____Initial Control Settings ____Power ON ____Electrical Zero Check ____Dial indecates Zero ____Power OFF the voltage across TDX~R1 and TDX~R3. d. Measure voltage is 0 to .5 volts. If not, perform the TDX Alignment. 4. Place Power to OFF.", "1. Unlike fields attract 2. Like fields repel.ach other.ach other."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2. Electromagnetics are produced by applying a current source to a conductor."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3. The principles of magnetics and electromagnetics are applied to rotating machinery."], "jumps": ["P2950", "P2930"]}, {"id": "P2950", "text": ["4. The left hand rule indicates the direction of the induced electromagnetic field."], "jumps": ["P2960", "P2940"]}, {"id": "P2960", "text": ["5. The right hand rule indicates the direction o let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
