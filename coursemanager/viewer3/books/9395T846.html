 Central Processing Unit or CPU."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["CPU arithmetic capabilities are of prime importance since the processing of data almost always involves arithmetic."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Additionally, this lesson introduces the way in which binary addition and subtraction operations alter the status of the flag register.  This is important because some arithmetic operations use the contents of the flag register as a factor in their calculations.", "Additionally, this lesson introduces the way in which binary addition and subtraction operations alter the status of the flag register. This is important because some arithmetic operations use the contents of the flag register as a factor in their calculations....."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on 8086 ADDITION AND SUBTRACTION..................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": ["P440"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The ADD instruction can add a single byte hexadecimal number to another single byte hexadecimal number."], "jumps": ["P1025", "P1001"]}, {"id": "P1025", "text": ["It can also add a hexadeximal word (two bytes) to another hexadecimal word."], "jumps": ["P1030", "P1020"]}, {"id": "P1030", "text": ["The SUBTRACT instruction can subtract a single byte hexadecimal number from another single byte hexadecimal number."], "jumps": ["P1035", "P1020"]}, {"id": "P1035", "text": ["It can also subtract a hexadecimal word (two bytes) from another hexadecimal word.", "It can also subtract a hexadecimal word (two bytes) from another hexadecimal word.r..umber.r.."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The numbers that are added or subtracted can be from the contents of the accumulator, another register, the contents of a storage location in memory, or the immediate operand (data) contained in the instruction."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["When adding or subtracting one register to or from another register, the Opcode identifies the two registers."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["The instructions CANNOT add or subtract one memory location to or from another memory location."], "jumps": ["P1065", "P1020"]}, {"id": "P1065", "text": ["You can only add or subtract a memory location to or from a register."], "jumps": ["P1068", "P1020"]}, {"id": "P1068", "text": ["The location of the memory address is located in the SI, DI, BP or BX register."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["Also, the instructions CANNOT add or subtract data to or from data.", "Also, the instructions CANNOT add or subtract data to or from data..."], "jumps": ["P1075", "P1020"]}, {"id": "P1075", "text": ["Data must be added or subtracted from either a register or memory location."], "jumps": ["P1078", "P1020"]}, {"id": "P1078", "text": ["As before, the memory address is located in the SI, DI, BP or BX register."], "jumps": ["P1079", "P1020"]}, {"id": "P1079", "text": ["This chart summarizes the allowed operands for addition and subtraction operations.", "This chart summarizes the allowed operands for addition and subtraction operations. the carry flag is reset. PHICS TEXT) Carry Flag (cf) Status Statement 1 = the result of the operation resulted in a carry out or borrow in. 0 = the result of the operation did not generate a carry out or borrow in.", "Destination Source Register Register Register Memory Memory Register Register Immediate Memory Immediate Accumulator Immediate"], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["The result of the addition or subtraction sets certain flags."], "jumps": ["P1085", "P1020"]}, {"id": "P1085", "text": ["The addition or subtraction sets the carry flag if an overflow or borrow occurs, otherwise the carry flag is reset.", "The addition or subtraction sets the carry flag if an overflow or borrow occur d from FF FF, which flag is set?", "If FF FF is subtracted from FF FF, which flag is set?......"], "jumps": ["P1110"]}, {"id": "P1121", "text": [], "jumps": []}, {"id": "P1122", "text": ["A borrow would have to take place during the subtraction in  order for the carry flag (CF) to be set to 1.", "A borrow would have to take place during the subtraction in order for the carry flag (CF) to be set to 1."], "jumps": []}, {"id": "P1123", "text": ["For the zero flag (ZF) to be reset to 0, the result must be something other than zero.", "For the zero flag (ZF) to be reset to 0, the result must be something other than zero......."], "jumps": []}, {"id": "P1130", "text": ["There are two instruction codes used for each arithmetic function."], "jumps": ["P1135", "P1120"]}, {"id": "P1135", "text": ["Let's look at addition first."], "jumps": ["P1140", "P1130"]}, {"id": "P1140", "text": ["The first addition instruction is ADD.  For example, this Opcode will add Register BX to the accumulator (Register AX).", "The first addition instruction is ADD. For example, this Opcode will add Register BX to the accumulator (Register AX). GRAPHICS TEXT)Code Mnemonic Pseudocode 03 C3 ADD AX, BX Add Register BX to Register AX", "Opcode Mnemonic Pseudocode 03 C3 ADD AX, BX Add Register BX to Register AX"], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["This instruction takes the contents of the BX register and adds them to the AX register."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["Remember, there are other Opcodes used for adding other registers, memory locations to registers, data to registers and data to memory."], "jumps": ["P1170", "P1140"]}, {"id": "P1170", "text": ["The second instruction is called Add With Carry.", "The second instruction is called Add With Carry.GRAPHICS TEXT) Code Mnemonic Pseudocode 13 C3 ADC AX, BX Add Register BX to Register AX plus 1 if cf is set.", "Opcode Mnemonic Pseudocode 13 C3 ADC AX, BX Add Register BX to Register AX plus 1 if CF is  flag?............."], "jumps": ["P1290"]}, {"id": "P1301", "text": [], "jumps": []}, {"id": "P1302", "text": ["The ADC instruction is Add With Carry.  It uses the carry flag.", "The ADC instruction is Add With Carry. It uses the carry flag."], "jumps": []}, {"id": "P1303", "text": ["The SBB instruction is subtract with borrow.  It uses the carry flag.", "The SBB instruction is subtract with borrow. It uses the carry flag."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on ADDING & SUBTRACTING INSTRUCTIONS."], "jumps": ["P1001", "P1300"]}, {"id": "P1920", "text": ["1.  Addition and subtractions operations are performed by the            Arithmetic Logic Unit (ALU) of the 8086 microprocessor.\n2.  Single bytes or words can be added or subtracted.", "1. Addition and subtractions operations are performed by the Arithmetic Logic Unit (ALU) of the 8086 microprocessor. 2. Single bytes or words can be added or subtracted."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["3.  The number that is added or subtracted may come from:", "3. The number that is added or subtracted may come from: APHICS TEXT) Another register A memory location The instruction itself", "Another register A memory location The instruction itself elf"], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["4.  The flag register is effected:\n    - If an overflow or borrow is generated, the carry flag is set  to 1.\n    - If the results of adding or subtracting equals 0, the zero flag is       set to 1.", "4. The flag register is effected: - If an overflow or borrow is generated, the carry flag is set to 1. - If the results of adding or subtracting equals 0, the zero flag is set to 1."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["5.  Some of the opcodes, mnemonics, and pseudocodes used            for adding and subtracting are:", "5. Some of the opcodes, mnemonics, and pseudocodes used for adding and subtracting are:ic Pseudocode 03 C3 ADD AX, BX Add BX t let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
