const book = {"title": "9395N208", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: FILE INSTRUCTIONSf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Understand the concepts of file instructions. w Describe the operation of file instructions.", "w Demonstrate the usage of file instructions using Allen Bradely APS software...e.", "w Demonstrate the usage of file instructions using Rockwell RSLOGIX software...oftware."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P310", "text": [], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, we will examine the file instructions used by a PLC. The file instructions are used for manipulating the data files of the PLC memory."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["File manipulation is important when you need to copy or initialize data files in the PLC memory."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["In the experiment, you will enter a ladder logic program that will demonstrate the operation of the file instructions."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Let's begin the lesson on FILE INSTRUCTIONS..............................."], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1040", "text": ["File instructions are used to copy or fill data files with specific values. These instructions are useful and very similar to the move instructions you learned earlier."], "jumps": ["P1050", "P1001"]}, {"id": "P1050", "text": ["The difference is that these instructions can do more than just move a word. They can copy as little as a word or as much as a file.."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["There are only two file instructions. Let's look at these instructions and what they do."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["This is the File Copy (COP) instruction. As the name implies, this instruction is used to copy files.", "Note: Does not change arithmetic status bit."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["The File Copy instruction requires three parameters: a source, a destination, and a length. The source is the location of a file that you want to copy. You cannot enter a data value here. (Use the move instruction for doing that.) You must enter a file location..."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["The second parameter is the destination location. Again, this is the file where you would like the source data copied to. Again, this parameter has to be a file location in memory."], "jumps": ["P1100", "P1070"]}, {"id": "P1100", "text": ["The last element is the length. This is the number of data elements you want copied from the source into the destination. A data element has a number of words depending on the type of data..."], "jumps": ["P1110", "P1070"]}, {"id": "P1110", "text": ["For example, a counter data element is composed of three words, while an integer data element contains one word."], "jumps": ["P1120", "P1070"]}, {"id": "P1120", "text": ["The length refers to the number of elements in the destination. For example, if you had a source as integer 0 in integer file 17 (#N17:0), a destination as counter 1 in counter file 5 (#C5:1), and a length of 2 elements, six words would be copied into the destination..."], "jumps": ["P1130", "P1070"]}, {"id": "P1130", "text": ["Since a counter element is three words long, a length of two elements specifies six words will be copied. If we switch the source and destination, only two words are transferred into the integer file..."], "jumps": ["P1140", "P1070"]}, {"id": "P1140", "text": ["These two words are the first two of the three words in counter 1. Remember, the element size is determined by the destination."], "jumps": ["P1150", "P1070"]}, {"id": "P1150", "text": ["The length that you can specify depends on the number of words in the element. The maximum length value you can use must be equal to or less than 128 words."], "jumps": ["P1160", "P1070"]}, {"id": "P1160", "text": ["If the destination contains integers, the maximum length is 128. If the destination contains counter data file elements, the maximum length is 42. Remember, 42 elements x 3 words per element equals 126 words..."], "jumps": ["P1170", "P1070"]}, {"id": "P1170", "text": ["This leaves 2 words, but a counter file has 3. This is why only 42 can be specified."], "jumps": ["P1180", "P1070"]}, {"id": "P1180", "text": ["The File Copy instruction where length 1 works the same as the move instruction except that the File Copy instruction does not change the arithmetic status bits. If you need to move data without changing the arithmetic status bits, use the File Copy instruction..."], "jumps": ["P1190", "P1070"]}, {"id": "P1190", "text": ["The number of words in an element is determined by _______."], "jumps": ["P1070"]}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1192", "text": ["Remember, it is the destination that determines the word length of elements."], "jumps": []}, {"id": "P1200", "text": ["The last of the file instructions is the File Fill (FLL) instruction. This instruction is used to fill a defined number of destination elements with the same value.", "Note: Does not change arithmetic status bit."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["This instruction requires a source, destination, and length, just as with the File Copy instruction. The source is either an entered value or the location of a value in memory. Recall the COP instruction was restricted to a location only..."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["The destination is where you want the source value copied to. The length specifies how many elements of the destination will be filled with same source value."], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["After the instruction is evaluated, the source value is placed in the file location specified by the destination, and each element therefore, up to the length specified. Again, the maximum length is 128 words..."], "jumps": ["P1240", "P1200"]}, {"id": "P1240", "text": ["This instruction is very useful if you want to initialize memory with a specific value, like zero."], "jumps": ["P1250", "P1200"]}, {"id": "P1250", "text": ["The source of the File Fill Instruction must be a file location. Entered values cannot be used."], "jumps": ["P1200"]}, {"id": "P1251", "text": [], "jumps": []}, {"id": "P1252", "text": ["Remember, the source can be either a location in memory or an actual value entered into the instruction."], "jumps": []}, {"id": "P1260", "text": ["You have examined the file instructions for a PLC.........."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["In the experiment, we will look at the copy command and see how it copies a large block of data."], "jumps": ["P1910", "P1260"]}, {"id": "P1910", "text": ["This completes the information on FILE INSTRUCTIONS........"], "jumps": ["P1001", "P1260"]}, {"id": "P1920", "text": ["1. The File Copy (COP) instruction is used to copy data from one file to another and requires a source, destination, and length. The length and destination element type determine how many words will be copied.", "Note: Does not change arithmetic status bit."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. The File Fill (FLL) instruction is used to copy single values into multiple elements of a destination data file. The number of words filled with the source value is determined by the length parameter and the destination element type.", "Note: Does not change arithmetic status bit."], "jumps": ["P1999", "P1920"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1930"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2040", "text": ["In this experiment, you will program the PLC Trainer to use the file instructions that you have learned earlier in this lesson."], "jumps": ["P2050", "P2001"]}, {"id": "P2050", "text": ["You will create a new processor program and make the appropriate configurations.", "1. Connect the 5050 interface cable between the Nida Model 5050 PLC Trainer and the computer which has the APS software.", "+\".S///'Q'QW(1/$R/'/,6SQQeeQaVQjRd/(QueQddQ/&R6RS/QR'QQ/&&-R/'//'/(QRQ'Sd/VRQ8aQQSQRj9QR/8SdQd8'6\"&/'\"/&''VQ'RSdaQkdeRaR/jdQ'Qa/'dmerd+R1dehjeeQdgredSdQVeedgRQhhfemjdearggdeddQ8=ldrvgjdaVemaedlebRhukgneaVagkhkefRR9l9lkljerkasrl/hjRljeQedd1dQZeVVaSaRRd6Q1Ie(RdR&,/,&.6RQ'R&\"'dd,Q.&Q/./'//Q6S.(daQ1SQRQRhd(/./a(/.RddaRVeQS1(QQ/'/Q/QQ(/djdS/IQ/QQQddQe10''Q$ddQQ',1/''QQ8/(aVQ(RQQQjg.VRd(Vd(/'(aQQd1mhrVIRldQdRraaRQeeerhaqeeaQerhRVmRefRRR8dehaYbmeerkdhehaheemQ/eredammredhheaaeefQd91RRftdbmRrrW1ReRQQR/RaYkgRddmdjRamQ(/8SdVVQeQa('/Q 'a/QRVV//#/Q"], "jumps": ["P2060", "P2040", "P2070", "PQ", "P", "P11HQeVQd1We8ddRQQRearhQRdeaVbfhhdddf", "P1"]}, {"id": "P2070", "text": ["2. Start the APS software by performing the following commands at the DOS prompt of the computer which has the APS software and is attached to the PLC Trainer. a. Type 'CD \\IPDS\\ATTACH\\SLC500' and press enter. b. Type 'APS' and press enter."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["If the software did not start, see your instructor for assistance. These instructions are for default installation of the APS software and may differ from your installation."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["3. Set up a new processor file and begin editing the ladder logic program. If you need help on configuring and setting up the PLC APS software, select the help button below."], "jumps": ["P2100", "P2080", "P2095"]}, {"id": "P2095", "text": ["Follow these steps to set up the APS software for ladder logic program entry and evaluation:", "1. From the main menu, select F4 [ OFFLINE CONFIG ] and then F6 [ CREATE ]. Enter a file name and press enter. You must use a filename that does not already exist and one ten characters or less. Do not forget your file name. 2. Using the up and down arrow keys, adjust the PROCESSOR box until '1747-L20C/F 12-DC SNK 8-RLY' is highlighted by the cursor bar. Press F2 [ SELECT PROC ] to select this processor. 3. Now we will select th I/O modules attached to the PLC. Press F5 [ CONFIGR I/O ]. 4. Press F4 [ MODIFY RACKS ] and then F1 [ RACK 1 ]. Rack 1 is the backplane that the other two modules will attach to. Use the cursor bar and select '1746-A2 2-slot Backplane' and press enter. 5. Use the arrow keys to highlight '*1' (Slot 1) with the cursor bar and press F5 [ MODIFY SLOT ]. Using the arrow keys again, highlight '1746-IG16 16-Input [ TTL ] (Sink) 5 VDC' and press F2 [ SELECT MODULE ]. 6. Use the arrow keys to highlight '*2' (Slot 2) with the cursor bar and press F5 [ MODIFY SLOT ]. Using the arrow keys again, highlight '1746-NI04V Analog Comb. 2 In & 2 Voltage Out' and press F2 [ SELECT MODULE ]. 7. Select F8 [ EXIT ] and F8 [ SAVE & EXIT ] and then F8 [ ACCEPT ]. 8. Press F3 [ OFFLINE PRG/DOC ] and then F1 [ PROCSSR FUNCTNS ]. We are going to change the name of our ladder logic file to be more descriptive of what it does. 9. Using the cursor bar, select File 2 and press F4 [ CHANGE FL. NAME] Enter 'C_TEST' and press return. The name should appear in the Name column for file 2. 10. We are now ready to edit the ladder program file. Using the arrow keys, highlight File 2 and press F8 [ MONITOR FILE ]. 11. To began editing, press F10 [ EDIT ]..."], "jumps": []}, {"id": "P2100", "text": ["The program shown below is the ladder logic program you will enter to demonstrate the file instructions that you learned in the first part of this lesson.", "Copy File Source : # Dest : # Length : 1", "File Fill Source : -1 Dest : # Length : 1"], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["Before we actually begin entering the program into the PLC APS software, let's look at what the program should do. This will help us understand if the program is operating properly when we test it..."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["On the 5050-1 PC card, there are three switches we will use for this program: two push button switches and a slide switch."], "jumps": ["P2130", "P2100"]}, {"id": "P2130", "text": ["The slide switch, which is connected to input I:0/2, is used to select between the File Copy and the File Fill instructions. This allows us to see the operation of both instructions."], "jumps": ["P2140", "P2100"]}, {"id": "P2140", "text": ["When the slide switch is in the right position, rung 1 is active. This rung uses the copy command to copy the inputs of one word starting at I:0.0 to one word of output O:0.0.", "Copy File Source : # Dest : # Length : 1", "File Fill Source : -1 Dest : # Length : 1"], "jumps": ["P2150", "P2100"]}, {"id": "P2150", "text": ["If we press the START or STOP buttons, the corresponding output LEDs should illuminate. Also, the slide switch LED, LED 2, should remain illuminated as long as the switch is on.", "Copy File Source : # Dest : # Length : 1"], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["If the slide switch is in the left position, the output file's first word will have highs in each bit. This causes the LEDs to remain illuminated. Notice that we are using the entered value -1.", "Copy File Source : # Dest : # Length : 1"], "jumps": ["P2170", "P2140"]}, {"id": "P2170", "text": ["Remember, negative values are stored in two's-complement form. The binary value for negative 1 is 1111111111111111. When you enter the instructions later, you can enter negative one as -1, &HFFFF or &B1111111111111111. All of these represent the same value.", "Copy File Source : # Dest : # Length : 1"], "jumps": ["P2180", "P2140"]}, {"id": "P2180", "text": ["The operation of these instructions is straightforward. We have implemented them into our short program so that you can observe their performance.", "Copy File Source : # Dest : # Length : 1"], "jumps": ["P2190", "P2140"]}, {"id": "P2190", "text": ["When used in larger programs, these instructions are similarly implemented, except, in most cases, the length value will be greater. Since we can only display half of the first word of the output, it isn't necessary to copy more...", "File Fill Source : -1 Dest : # Length : 1"], "jumps": ["P2200", "P2140"]}, {"id": "P2200", "text": ["Let's enter the ladder logic program......................."], "jumps": ["P2210", "P2140"]}, {"id": "P2210", "text": ["Each rung is presented in order for you to type it into the APS software. If you have trouble, a help button will give you a list of steps for entering the instruction. Try to do as much as possible on your own..."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["4. Enter Rung 1 shown below...............................", "Copy File Source : # Dest : # Length : 1"], "jumps": ["P2230", "P2200", "P2225"]}, {"id": "P2225", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, XIC and then enter I:0/2. 3. Select FILE, COP and enter #I:0.0, #O:0.0, and 1. 4. Press ESC and ACCEPT RUNG.."], "jumps": []}, {"id": "P2230", "text": ["5. Enter Rung 2 shown below...............................", "File Fill Source : - Dest : # Length : 1111"], "jumps": ["P2240", "P2220", "P2235"]}, {"id": "P2235", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, XIO and then enter I:0/2. 3. Select FILE, FLL and enter -1, #O:0.0 and 1. 4. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2240", "text": ["Now that we have finished entering the program, we need to load it into the PLC and test it. Ensure the last rung of the program has been accepted.", "Copy File Source : # Dest : # Length : 1", "File Fill Source : -1 Dest : # Length : 1"], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["6. Set the PLC Trainer to the initial control settings....", "Main Power ON DC Power ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF"], "jumps": ["P2240"]}, {"id": "P2255", "text": ["INITIAL CONTROL SETTING - Main Power ON, DC Power ON, Monitor ON, Process Selector OFF, +DC Voltage Select 5V, PC1 & PC2 Power OFF."], "jumps": []}, {"id": "P2260", "text": ["7. Place the PC5050-1 card in the PC1 position............"], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["8. Set the PLC Trainer controls as follows:...............", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "+DC Voltage Select 24V PC1 Power ONNeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"], "jumps": ["P2260", "P2275"]}, {"id": "P2275", "text": ["PLC TRAINER CONTROLS - Turn the +DC Voltage Select dial fully CW to the 24V position. Push the PC1 Power switch up to the ON position."], "jumps": []}, {"id": "P2310", "text": ["The trainer is turned on and set up to send our program to the trainer. Let's send our program to the trainer."], "jumps": ["P2320", "P2270"]}, {"id": "P2320", "text": ["9. Press F1 [SAVE/GO ONLINE]. If the file exists, you will be asked if you would like to overwrite it. Press F8 [YES]. If the processor is not in program mode, the APS software will ask you if it can switch to that mode. Press F8 [YES]."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["10. Once the program has been sent, the APS software will ask you if you would like to switch to run mode. Again, press F8 [YES]."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["The program you entered is now running. Try out the START and STOP buttons and the POWER slide switch. Observe how the LEDs are illuminated based on the COP and FLL instructions we have used in the program..."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["With the slide switch in the right position, the inputs are copied straight to the outputs; in the left position, the value 1111111111111111 is filled into the outputs."], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["This completes the demonstration of the file instructions. Try creating your own ladder logic and enter it into the APS software. It is easier to write your logic on paper first and then enter it into the software...."], "jumps": ["P2370", "P2340"]}, {"id": "P2370", "text": ["If you want to edit your program, select EDIT and edit DISK PROGRAM. Then follow the same steps to send the program to the PLC Trainer. The inputs and outputs are listed below.", "I :0/0 Start Switch O :0/0 Led 0 O :0/4 Led 4 I :0/1 Stop Switch O :0/1 Led 1 O :0/5 Led 5 I :0/2 Power Switch O :0/2 Led 2 O :0/6 Led 6 O :0/3 Led 3 O :0/7 Led 74"], "jumps": ["P2380", "P2340"]}, {"id": "P2380", "text": ["11. Press F3 [EXIT] or ESC and then F3, depending on where you left off in the APS software. Now select F3 [RETURN TO MENU] and then F10 [EXIT SYSTEM]."], "jumps": ["P2390", "P2370"]}, {"id": "P2390", "text": ["12. Return the PLC trainer to the initial control settings.", "Main Power ON DC Power ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF"], "jumps": ["P2380"]}, {"id": "P2400", "text": ["13. Turn OFF the PLC Trainer's main power switch.........."], "jumps": ["P2390"]}, {"id": "P2410", "text": ["14. Return all PC cards and test equipment to their proper storage location."], "jumps": ["P2910", "P2400"]}, {"id": "P2910", "text": ["This completes the experiment on FILE INSTRUCTIONS........."], "jumps": ["P2001", "P2410"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3020", "text": ["In this experiment, you will program the PLC Trainer to use the file instructions that you have learned earlier in this lesson."], "jumps": ["P3030", "P3001"]}, {"id": "P3030", "text": ["You will create a new processor program and make the appropriate configurations."], "jumps": ["P3020"]}, {"id": "P3040", "text": ["1. Ensure the 5050 interface cable is connected between the Nida Model 5050 PLC Trainer and the computer which has the RSLinx and RSLogix software...."], "jumps": ["P3020"]}, {"id": "P3050", "text": ["2. Turn on the 5050 PLC Trainer..........................."], "jumps": ["P3040"]}, {"id": "P3070", "text": ["3. Start and set up the RSLinx communication software. If you need help on configuring and setting up the RSLinx software, select the help button below.."], "jumps": ["P3050", "P3075"]}, {"id": "P3075", "text": ["1. Start the RSLinx communication software by double-clicking the RSLinx icon on the computer that has the RSLinx software and is attached to the PLC Trainer. If the software did not start, see your instructor for assistance. 2. Now we need to know if the computer and PLC Trainer are communicating. In the right window, double-click on the AB_PIC-1 DH-485 icon. 3. Make sure that the PLC icon does not have a red \"X\" over it. If a red \"X\" is present, make sure the PLC Trainer is turned on and connected. If the PLC is still not active, see your instructor for assistance. 4. Click on the minimize button..", "Follow these steps to start and set up the RSLinx software for communication between the computer and the PLC Trainer...re and is attached to the PLC Trainer. If the software did not start, see your instructor for assistance. 2. Now we need to know if the computer and PLC Trainer are communicating. In the right window, double-click on the AB_PIC-1 DH-485 icon. 3. Make sure that the PLC icon does not have a red \"X\" over it. If a red \"X\" is present, make sure the PLC Trainer is turned on and connected. If the PLC is still not active, see your instructor for assistance. 4. Click on the minimize button. and connected. If the PLC is still not active, see your instructor for assistance. 4. Click on the minimize button..."], "jumps": []}, {"id": "P3080", "text": ["4. Start the RSLogix software and set up a new processor file. If you have trouble, a help button will give you a list of steps for entering the instructions. Try to do as much as possible on your own.."], "jumps": ["P3070", "P3085"]}, {"id": "P3085", "text": ["Follow these steps to start RSLogix and set up a new processor file::: the computer, which has the RSLogix software and is attached to the PLC Trainer. If the software did not start, see your instructor for assistance. 2. Click on the maximize button. 3. From the standard toolbar, click on the NEW icon. 4. Enter a file name in the processor name text box. You must choose a name that does not already exist and is less than ten characters in length. Do not forget this file name. 5. Select the PLC type and the different I/O modules that we have attached to the system. In the case of the Nida PLC Trainer, ther are two extra modules: a TTL module and an analog module. 6. At the bottom of the select processor type window, AB_PIC-1 should be displayed in the driver text box. If not displayed, click on the down-arrow and select AB_PIC-1. 7. Using the listbox scroll bar arrows, scroll until \"1747-L20C/F 12-DC SNK In, 8-RLY Out\" is displayed. Click on this PLC processor and then click on OK. 8. The project window (left) and the ladder window (right) will appear. LAD2 should be displayed in the ladder window title bar. 9. Select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 10. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. 11. Double-click on the \"1746-IG16 16-Input (TTL-SOURCE) 5VDC\" module name to transfer the module information to the left window for the #1 slot of the PLC. 12. Double click on the \"1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out\" module name to transfer the module information to the left window for the #2 slot of the PLC. 13. Save the configuration settings by clicking on the I/O configuration close button. This button is the \"X\" in top right-hand corner of the I/O configuration window. 14. The processor section of your file is complete. You are now at the main window and should see the \"end\" ladder in the ladder window. main window and should see the \"end\" ladder in the ladder window.", "1. Start the RSLogix software by double-clicking on the RSLogix icon on the computer, which has the RSLogix software and is attached to the PLC Trainer. If the software did not start, see your instructor for assistance. 2. Click on the maximize button. 3. From the standard toolbar, click on the NEW icon. 4. Enter a file name in the processor name text box. You must choose a name that does not already exist and is less than ten characters in length. Do not forget this file name. 5. Select the PLC type and the different I/O modules that we have attached to the system. In the case of the Nida PLC Trainer, ther are two extra modules: a TTL module and an analog m let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
