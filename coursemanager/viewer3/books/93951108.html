\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1930"]}, {"id": "P1930", "text": ["3. Like components are numbered sequentially in the circuit and usually from left to right. 4. Schematic diagrams provide the normal measured voltages and signals to aid in troubleshooting when a component fails."], "jumps": []}, {"id": "P1920", "text": ["1. Schematic diagrams provide a pictorial explanation of an electronic circuit. 2. Schematic diagrams are written so the data or signal flows through the circuit from left to right...."], "jumps": ["P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on SCHEMATIC DIAGRAMS......."], "jumps": ["P1001", "P1260"]}, {"id": "P1260", "text": ["When test points are not provided by the manufacturer the schematic will list voltages and/or signal data at key locations of the schematic."], "jumps": ["P1910", "P1220"]}, {"id": "P1255", "text": ["The remaining test points are all tested using a common reference point, ground. Usually ground is also common to the metal case or chassis of the circuit."], "jumps": ["P1260", "P1230"]}, {"id": "P1250", "text": ["To test the voltage at TP1 and TP2 the multimeter is connected to both TP1 and TP2 together."], "jumps": ["P1255", "P1230"]}, {"id": "P1245", "text": ["Without knowing the normal voltages and signals it is very difficult to troubleshoot the circuit. Since a power supply only processes voltage, no signal waveforms are provided.ntrol in this AM receiver circuit...", "Next, we'll analyze the power supply schematic. The power supply schematic reads from left to right, with AC voltage entering on the left at points G and H, and regulated 5 volts DC exiting the circuit at point T..."], "jumps": ["P1230"]}, {"id": "P1260", "text": ["When test points are not provided by the manufacturer the schematic will list voltages and/or signal data at key locations of the schematic.", "2. Circuitry must also exist after the illustrated circuits as there are no output devices as expected for a receiver. There is no headphone or speaker on the illustration. It should also be noted that an amplifier circuit would be necessary should a speaker be the output device as the output of the volume control will not drive a speaker directly. There is no headphone or speaker on the illustration. It should also be $Note:d that an amplifier circuit would be necessary should a speaker be the output device as the output of the volume control will not drive a speaker directly.....", "1. Another circuit with components Q1, C1 through C3, T1 through T3 and R1 through R4 precede the shown circuits. circuits. 2. Circuitry must also exist after the illustrated circuits as there are no output devices as expected for a receiver. There is no headphone or speaker on the illustration. It should also be $Note:d that an amplifier circuit would be necessary should a speaker be the output device as the output of the volume control will not drive a speaker directly.....", "It is obvious that the schematic is not the complete receiver. But, knowing common schematic practices allows you to make the following two assumptions:Another circuit with components Q1, C1 through C3, T1 through T3, and R1 through R4 precede the shown circuits. 2. Circuitry must also exist after the illustrated circuits as there are no output devices as expected for a receiver. There is no headphone or speaker on the illustration. It should also be $Note:d that an amplifier circuit would be necessary should a speaker be the output device as the output of the volume control will not drive a speaker directly....."], "jumps": ["P1910", "P1230", "P1170", "P1220", "P1215"]}, {"id": "P1200", "text": ["It is common practice to number like-components beginning at 1 and going through the circuit until every similar component is numbered. It is also common practice to begin the numbering sequence at the left side of the schematic numbering to the right side of the schematic."], "jumps": ["P1210", "P1170"]}, {"id": "P1190", "text": ["Other components or abbreviations listed on the schematic include: AVC - Automatic Volume Control feedback line (to a previous circuit). C - Capacitor D - Diode Q - Transistor S - Switch T - Transformer TP - Test Point"], "jumps": ["P1200", "P1180"]}, {"id": "P1182", "text": ["For instance, there are 9 resistors on the schematic, numbered R5 through R13. R12 is a variable resistor that also has an additional label of VOLUME. R12 serves as the volume control in this AM receiver circuit..."], "jumps": []}, {"id": "P1180", "text": ["You will also notice several points in the schematic are grounded. Several components are the same type of device. To eliminate confusion, same-type components are numbered. instance, there are 9 resistors on the schematic, numbered R5 through R13. R12 is a variable resistor that also has an additional label of VOLUME. R12 serves as the volume control in this AM receiver circuit......", "You can also expect to see the components from each functional group to be together on a schematic. On the illustration the identified functional groupings are the 1st IF Amp, 2nd IF Amp, and the Detector circuits. In this example the three circuits are also separated by dashed lines..."], "jumps": ["P1182", "P1170"]}, {"id": "P1160", "text": ["Components making up the circuit are interconnected on the schematic using lines to simulate the wires of the circuit. When lines cross on a schematic it must be indicated if the crossed lines are common to each other or unconnected. When connected, a dot will be at the juncture. If unconnected, there will be no dot at the juncture or a slight hump in one line will be evident....."], "jumps": []}, {"id": "P1150", "text": ["Usually, the negative side of the power supply output is common throughout the circuit and is often called \"ground\". This is derived from the old telegraph and radio days when the earth served as an active part of the circuit. Still today, earth ground is used in power distribution and radio transmission due to its commonality.....", "With portable electronics often the power supply consists of just a single battery. But, it still must supply power to every circuit in the device. Usually the positive part of the supply is labeled as \"+12V\", \"+5V\", or similar. $Note:s -Symbol for +12V.....", "With the inputs on the left, you can usually assume the power supply to be on the left, and usually also in the lower left of the schematic. The power supply has the job of converting the supply voltage, in this case, 120 VAC, to a DC voltage or voltages, to supply the various circuits. Usually the outputs are labeled and easily found throughout the schematic....."], "jumps": ["P1140", "P1110"]}, {"id": "P1120", "text": ["For instance, on a schematic for a radio receiver you could expect the antenna and the AC power input to be on the left side of the schematic and the speaker to be on the right side of the schematic. As the signal processes through the circuit it also crosses the schematic from the antenna, through the various circuits until it becomes sound at the speaker....."], "jumps": ["P1130", "P1110"]}, {"id": "P1110", "text": ["Like roadmaps, all schematics have some functional architecture in common regardless of the final use of the circuit. First, schematics are laid out so the signal flows on the diagram from left to right. This means you could expect the inputs to be on the left and the outputs on the right. d a large shaded arrow over schematic pointing to the right....", "Don't be concerned with trying to learn all the various schematic symbols used in this lesson. These symbols represent components which will be discussed in detail in future lessons.."], "jumps": ["P1110", "P1080"]}, {"id": "P1090", "text": ["At first sight of a schematic many students are overwhelmed. But there are several rules used in schematic layout making the understanding of the function of the circuit easier.", "The schematic diagram is the roadmap of an electronic circuit. Every component, wire, and connection used in the circuit is represented on the schematic diagram."], "jumps": ["P1100", "P1080"]}, {"id": "P1070", "text": ["Below are two schematic representations of the same circuit. While both circuits are electrically equal, the bottom diagram is far easier to interpret."], "jumps": ["P1080", "P1030"]}, {"id": "P1060", "text": ["In this lesson we are going to look at the characteristics of an electronic schematic. This includes symbols, layouts and conventions."], "jumps": ["P1070", "P1030"]}, {"id": "P1050", "text": ["Without a schematic, electronic circuits are very difficult to understand. When engineers design a system, they first do so on paper in the form of a schematic diagram. The schematic provides a visual representation of the circuits within the system..."], "jumps": ["P1060", "P1030"]}, {"id": "P1040", "text": ["Electronic circuits are like road maps of cities. They can be very simple or very complex depending on the number of components in the design.", "This lesson will focus on schematics for electronics and the associated symbols.", "Schematic diagrams are used in many technologies including mechanics, pneumatics, hydraulics and electronics."], "jumps": ["P1050", "P1030", "P1040", "P1020", "P1001", "P"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": ["P430"]}, {"id": "P430", "text": ["Let's begin the lesson on SCHEMATIC DIAGRAMS.............................."], "jumps": ["P400"]}, {"id": "P420", "text": ["Understanding this type of technical graphic can save time, energy, and help you understand the overall picture of a design or process.", "There are many different areas of technical graphics. However, we are going to focus on one important type which technicians use on a regular basis. They are schematic diagrams...flow charts.", "Technical Graphics are an impo let i = 0;
const stage = document.getElementById("stage");

function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);

}
