<48<88;48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["1. Intercommunicating Unitsr objective 1 line item 2 here. item 2 here.e.e.", "w Explain the purpose of the intercommunication system. w Identify the controls and indicators associated with the type LS-518/SIC and LS-519/SIC intercommun", "w Explain the purpose of the intercommunication system. w Identify the controls and indicators associated with the type LS-518/SIC and LS-519/SIC intercommunicating units. w Explain the operation of the type LS-518/SCI and LS-519/SIC intercommunicating units."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P1190", "text": ["When the conversation is completed, depress the release push button to restore the selector switch(s). The release light will extinguish indicating the station is ready to receive calls.", "Uw@@@@@@@@@_@_j__j_j_jjjj_@j)kkkk k kk"], "jumps": []}, {"id": "P410", "text": ["Intercommunication systems can be used in homes, businesses and aboard navy ships."], "jumps": []}, {"id": "P420", "text": ["Let's begin the lesson on INTERCOMMUNICATING UNITS........................."], "jumps": ["P410"]}, {"id": "P900", "text": [], "jumps": ["P420"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The captain's battle circuit (21MC) is an example of an intercommunication (intercom) system. It provides for two-way transmissions of orders and information between stations"], "jumps": ["P1001"]}, {"id": "P1030", "text": ["This system consists of multiple intercom units, each containing its own internal amplifier. The intercom units are installed in various locations aboard ship, all electrically connected together within the designated circuit..."], "jumps": []}, {"id": "P1040", "text": ["The intercommunicating units most commonly used aboard navy ships are the type LS-518/SIC and type LS-519/SIC."], "jumps": ["PCCC"]}, {"id": "P1050", "text": ["The LS-518/SIC is a 10-station unit, and the LS-519/SIC is a 20 station unit. The components and operation are the same for both units, with the exception of the number of station selector switches..."], "jumps": []}, {"id": "P1060", "text": ["Each intercom unit contains a reproducer, push-button selector switches, release buttons, volume control, dimmer, press-to-talk (PTT) switch, a release light, a call light, and a busy light."], "jumps": ["PTT"]}, {"id": "P1070", "text": ["The reproducer serves a dual function. When it is the transmitting station, it performs as a microphone, and when it is the receiving station, it performs as a speaker."], "jumps": []}, {"id": "P1080", "text": ["The station selector switches are located at the top of the front panel. The locations of the various units associated with the pushbutton is engraved on the station designation plate immediately below the push button.."], "jumps": []}, {"id": "P1090", "text": ["A volume control is provided to adjust the output level of the reproducer. This volume control has no effect on the output signal transmitted to other stations."], "jumps": []}, {"id": "P1100", "text": ["The press-to-talk (PTT) switch is a three-position switch. When the switch is depressed to the press-to-talk position the reproducer functions as a microphone and transmits a signal to the receiving station..."], "jumps": ["PTT"]}, {"id": "P1110", "text": ["When the spring-loaded talk switch is released it will return to the normal position. In this position the reproducer functions as a loudspeaker and is ready to receive an incoming call."], "jumps": []}, {"id": "P1120", "text": ["Additionally a hands-free position is provided to facilitate answering an incoming call without having to depress the PTT switch. In this position the calling station controls the transmitting and receiving functions..."], "jumps": []}, {"id": "P1130", "text": ["The station selector switches are self-locking switches. Once a station selector switch is depressed it will remain depressed. This allows more than one station to be selected simultaneously."], "jumps": []}, {"id": "P1140", "text": ["A calling station may select up to five stations simultaneously. Any more than five stations being selected will result in a highly degraded system."], "jumps": []}, {"id": "P1150", "text": ["To release the station selector switches you must depress the release button. This button will remain depressed until a station selector switch is again selected."], "jumps": []}, {"id": "P1160", "text": ["To place a call, depress the push-button station selector switch(s) for the desired station(s). The release light will illuminate to indicate that a station selector switch has been depressed..."], "jumps": []}, {"id": "P1170", "text": ["If the station you are calling is in use, the busy light will illuminate. Should the busy light illuminate, depress the release push button to restore the station selector switch and try again later..."], "jumps": []}, {"id": "P1180", "text": ["If no busy light is present, depress the talk switch, and speak directly into the reproducer grille. Release the talk switch to listen."], "jumps": []}, {"id": "P1190", "text": ["When the conversation is completed, depress the release push button to restore the selector switch(s). The release light will extinguish indicating the station is ready to receive calls."], "jumps": []}, {"id": "P1200", "text": ["To receive a call, the release push button must be in the depressed position with all station selector switches restored and all lights extinguished."], "jumps": []}, {"id": "P1210", "text": ["An illuminated call light indicates that your station is being called by another station. The audio connection has been established and you should hear the other stations message being transmitted..."], "jumps": []}, {"id": "P1220", "text": ["To answer a call, simply listen to the conversation, and answer by depressing the talk switch and speaking into the reproducer."], "jumps": []}, {"id": "P1230", "text": ["If the call light remains illuminated at the completion of your conversation, depress the talk switch and remind the calling station to depress their release push button."], "jumps": []}, {"id": "P1240", "text": ["A handset or a portable microphone can also be used with this equipment. The operation is the same, except the push button on the handset or portable microphone is used instead of the normal talk switch.."], "jumps": []}, {"id": "P1910", "text": ["You have completed the information on INTERCOMMUNICATING UNITS."], "jumps": ["P1001", "P1240"]}, {"id": "P1920", "text": ["1. Intercommunication systems provide a two-way means of transmitting messages between stations..", "Uw@@@@@@@@@_@_j__j_j_jjjj_@j)kkkk k kk"], "jumps": ["P1001"]}, {"id": "P1930", "text": ["2. The type LS-518/SIC intercommunicating unit provides for selection of up to ten different stations. The type LS-519/SIC intercommunicating unit provides for selection of up to twenty different stations."], "jumps": []}, {"id": "P1940", "text": ["3. The intercoms internal amplifier amplifies the outgoing signal to the selected station(s), limiting the number of stations that can be called at one time to five.", "OYHN44H5%N4RHH44hO5 N| HB%4: H@|N%6H%44 H3RN:HB 4N%H34NNi88", "R6R4iOYHN44H5%N4RHH44RO5 N| HB%4: H@|N%6H%44 H3RN:HB 4N%H34NNi88"], "jumps": []}, {"id": "P1950", "text": ["4. The reproducer serves the function of a microphone when transmitting and a speaker when receiving messages."], "jumps": []}, {"id": "P1960", "text": ["5. Indicator lights are provided on each unit as a visual indication of a station selector switch being depressed, a station being busy, and receipt of an incoming call."], "jumps": ["P00"]}, {"id": "P1970", "text": ["6. After completion of an initiated call ensure that you press the release button, or else you will not be able to receive incoming calls."], "jumps": []}, {"id": "P1980", "text": ["7. The three positions of the press-to-talk switch are hands-free, normal and press-to-talk."], "jumps": []}, {"id": "P1990", "text": ["8. An external microphone or handset may be utilized with the type LS-518/SIC and type LS-519/SIC intercom units."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1990"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["The LS-518/SIC Intercommunication Station provides _______", "both one-way and two-way voice communications and alarm signaling."], "jumps": []}, {"id": "P10211", "text": ["How many station selector switches are provided on the LS-518/SIC intercommunicating unit?"], "jumps": []}, {"id": "P10212", "text": ["How many station selector pushbuttons are on the LS- 519/SIC?"], "jumps": []}, {"id": "P10213", "text": ["What two functions does the reproducer provide?"], "jumps": []}, {"id": "P10214", "text": ["The volume control on the LS519/SIC intercommunication unit controls the transmitting and receiving voice signals."], "jumps": []}, {"id": "P10215", "text": ["How many positions are provided by the press-to-talk switch?"], "jumps": []}, {"id": "P10216", "text": ["What position will the spring loaded push-to-talk switch return to when released?"], "jumps": []}, {"id": "P10217 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
