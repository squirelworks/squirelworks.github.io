ow recharging extends the life of the battery.", "6. Chemical Action The cars engine has an alternator or generator that slowly charges the battery as it is driven. This slow recharging extends the life of the battery."], "jumps": ["P1680"]}, {"id": "P2420", "text": ["6. Chemical Action In a car the electrical energy from the battery is used to start the engine. In time the battery will lose its charge."], "jumps": ["P1670"]}, {"id": "P2410", "text": ["6. Chemical Action The solution is called an electrolyte and allows the chemical reaction between the plates to take place."], "jumps": ["P1660"]}, {"id": "P2400", "text": ["6. Chemical Action Car batteries are storage cells and can also be recharged. The lead acid car batteries are made of lead and lead oxide plates submerged in a solution of sulfuric acid and water."], "jumps": []}, {"id": "P2390", "text": ["ell. Better known as a car battery. The battery resembles Volta's first storage battery.", "6. Chemical Action Another common battery is the lead acid cell. Better known as a car battery. The battery resembles Volta's first storage battery."], "jumps": []}, {"id": "P2380", "text": ["6. Chemical Action A storage cell, on the other hand, can be recharged. Ni-Cad (nickel-cadmium) and NiMH (nickel-metal hydride) are examples of storage cells.", "6. Chemical Action Batteries are rated in volts. The most common battery is the dry cell. Dry cell batteries are also called primary cells, which means that the chemicals are used up after awhile, and must be replaced."], "jumps": ["P2380", "P2360"]}, {"id": "P2362", "text": ["Batteries are constructed using chemicals, there are no moving parts in a battery."], "jumps": []}, {"id": "P2361", "text": [], "jumps": []}, {"id": "P2360", "text": ["What produces electricity in a battery?...................."], "jumps": ["P2320"]}, {"id": "P2350", "text": ["al Action With a negative charge on the zinc and a positive charge on the copper, the electrical potential is established. When a conductor and load are attached between the two electrodes, current will flow.", "6. Chemical Action With a negative charge on the zinc and a positive charge on the copper, the electrical potential is established. When a conductor and load are attached between the two electrodes, current will flow."], "jumps": ["P1600"]}, {"id": "P2340", "text": ["6. Chemical Action Hydrogen ions, created in the electrolyte, gather on the copper electrode and pull electrons away from the copper, forming hydrogen bubbles and leaving the copper electrode with a positive charge."], "jumps": ["P1590"]}, {"id": "P2330", "text": ["6. Chemical Action Zinc atoms give up electrons and become positively charged, then pass into the electrolyte solution, leaving the zinc electrode with a net negative charge. As this takes place, the zinc rod slowly dissolves."], "jumps": []}, {"id": "P2320", "text": ["6. Chemical Action By placing zinc and copper rods in hydrochloric acid a battery similar to Volta's is produced. A battery's electricity is a result of chemical reaction."], "jumps": []}, {"id": "P2310", "text": ["6. Chemical Action An Italian Physicist, Alessandro Volta, built the first storage battery. a charge like a capacitor.", "5. Magnetism Magnetism is the most common method used to produce voltage. Power stations produce electricity using magnetism. discussion text here."], "jumps": []}, {"id": "P2300", "text": ["5. Magnetism Magnetism produces voltage when a metal rod is moved through a magnetic field. iscussion text here.", "5. Magnetism The action of the magnetic field causes electrons to move through the conductor. Large amounts of voltage can be produced with this method."], "jumps": []}, {"id": "P2290", "text": ["4. Light Light produces small voltages. This method is used in sensing devices such as alarms. er the discussion text here."], "jumps": []}, {"id": "P2280", "text": ["4. Light Light striking the surface of sensitive material forces electrons to move. lay page."], "jumps" let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;

    p.textContent = line;
    stage.appendChild(p);

      const b = document.createElement("button");

      b.textContent = id;
      b.addEventListener("click", () => go(id));

  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);

}
