<48<88;48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["1. PID Control System Experimentective 1 line item 2 here. item 2 here.e.e.", "w Identify the Proportional, Integral and Derivative circuits. w Adjust the PID proportional gain. w Adjust the PID integral reset control. w Adjust the PID derivative rate control."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Experiment Card PC130-179erXXXXXXXXXXnt"], "jumps": []}, {"id": "P301", "text": ["7. Nida Model 488 Multimeter or equivalent", "8. Nida Model 470 Oscilloscope or equivalent", "6. Nida Model 480 or 488 MultimeterXXXXXXXXXXnt"], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P341", "text": [], "jumps": ["P"]}, {"id": "P342", "text": [], "jumps": []}, {"id": "P343", "text": ["TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT"], "jumps": []}, {"id": "P344", "text": ["This lesson introduces the student to the operation of a proportional, integral, and derivative (PID) to control a closed loop servo system.", "One of the most widely used industrial control is the Proportional, Integral, and Derivative (PID) controller. The PID is a rapid acting and corrective controller.", "The PID demonstrates the means to maintain a desired actuator (motor) position control. Automation of manufacturing processes is but one of the many applications used in industry.", "Manufacturing automation requires the use of accurate position controls to install miniature components in a limited area using fine motor and actuator regulation."], "jumps": ["P410", "P301", "PID"]}, {"id": "P440", "text": ["Let's begin the lesson on PID CONTROL SYSTEM EXPERIMENT..................."], "jumps": []}, {"id": "P900", "text": [], "jumps": ["P440"]}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1020", "text": ["The PID circuit uses a series of operational amplifiers to reshape the error signal. The output signal should have a fast rise time, low overshoot, and the correct gain that reaches the desired set point value..."], "jumps": ["P1001"]}, {"id": "P1030", "text": ["The use of a quad operational amplifier (OP AMP) provides for the proportional, integral, and derivative actions. The quad OP AMP amplifies and combines the PID signals"], "jumps": []}, {"id": "P1040", "text": ["The PID control system uses an LM3403 Quad OP AMP. The LM3403 integrated circuit consists of four independent high-gain, operational amplifiers."], "jumps": []}, {"id": "P1050", "text": ["The PID summing amplifier is a standard LM741 OP AMP. The LM741 consists of a single operational amplifier that provides amplification and isolation of the combined PID signal."], "jumps": []}, {"id": "P1060", "text": ["'s look at the block diagram for the PID Control System.", "This experiment demonstrates the use of the PID control system as a servo motor controller. Throughout the remainder of the lesson the schematic diagrams may be brought up at any time by pressing Ctrl S (Holding the computer keyboard Ctrl key while pressing the S key). Let's look at the block diagram for the PID Control System.."], "jumps": []}, {"id": "P1070", "text": ["The Position controller sends a set point (reference position) to the Window decoder. The Position detector sends the process variable signal to the Window decoder."], "jumps": []}, {"id": "P1080", "text": ["The Window decoder processes the two signals and only sends an error signal to the PID controller if a difference voltage is present.", "FF FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF", "FFFFFF GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG", "GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG FF", "FF GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG", "F GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG", "FF GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG"], "jumps": []}, {"id": "P1090", "text": ["The error signal sent to the proportional control is processed into a gain input to the summing amplifier."], "jumps": []}, {"id": "P1100", "text": ["The error signal sent to the integral control is processed into a reset signal. The derivative control processes the reset signal from the integral control and outputs a rate signal to the summing amplifier....."], "jumps": []}, {"id": "P1110", "text": ["The Summing amplifier combines and amplifies the input signals into an actuator signal and sends it to the Pulse Width Modulator (PWM). The PWM, sends the pulse width modulated actuator signal to the H-Switch/Amplifier..."], "jumps": ["PWM"]}, {"id": "P1120", "text": ["The H-Switch/Amplifier processes the PWM signal into a directional encoding and amplification signal to the motor. The closed loop cycle is repeated as the Position Detector senses and processes a new variable signal to the Window decoder..."], "jumps": []}, {"id": "P1130", "text": ["In this experiment, you will use the Model 170 Trainer and test equipment to adjust a PID system controller. -"], "jumps": []}, {"id": "P1140", "text": ["This experiment consists of three parts:...................", "wPart 1: Proportional Control (Gain) Adjustment wPart 2: Derivative Control (Rate) Adjustment wPart 3: Integral Control (Reset) Adjustment s). w Check shaft endplay. w Check input current and compare with normal values. w Check covers, bolts, pulleys, gears, screws, and keys for security. w If the motor has brushes, blow dirt from windings, clean and inspect the commutator and brushes."], "jumps": []}, {"id": "P1150", "text": ["Position the test console and the Model 170 trainer as shown.wn."], "jumps": []}, {"id": "P1160", "text": ["Connect d to TP6. Notice, TP3 is the output of the PID controller."], "jumps": []}, {"id": "P1370", "text": ["Adjust R2 (KP) on PC130-177 clockwise until the oscilloscope CH2 trace reads at least one division (1 V) higher than the CH1 trace."], "jumps": []}, {"id": "P1380", "text": ["When the PID summing amplifier output (TP3) is higher than the proportional controller input (TP1), lock is difficult or impossible to establish. The PID controller output is therefore regulated by the gain of the proportional control..............."], "jumps": []}, {"id": "P1390", "text": ["On the Model 170 Trainer, MOMENTARILY set the MOTOR switch to ON. The motor should be moving randomly back and forth. Set the MOTOR switch OFF after confirming the motor movement."], "jumps": []}, {"id": "P1400", "text": ["On the Model 170 Trainer, ensure the MOTOR switch is set to OFF..."], "jumps": []}, {"id": "P1410", "text": ["The CH1 trace should still be at approximately + 6 VDC. If the trace is at the null actuator signal of 0 VDC, adjust the MOTOR SPEED control until the CH1 trace reads approximately + 6 VDC............"], "jumps": []}, {"id": "P1420", "text": ["VDC DC", "Measure the voltage indicated on the CH1 trace and records the result below as Input Voltage.le.", "Input Voltage = DC"], "jumps": []}, {"id": "P1421", "text": [], "jumps": []}, {"id": "P1427", "text": ["Your answer is still incorrect. You should have measured approximately: 6 VDC"], "jumps": ["PutVar"]}, {"id": "P1430", "text": ["Calculate a 50% proportional gain by using the Input Voltage you measured and the following equation: 50% PROPORTIONAL GAIN = _____2.3 to 2.6____VDC", "50% Proportional Gain = Input Voltage x 0.5 = x 0.5 50% Proportional Gain = VDCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC"], "jumps": []}, {"id": "P1431", "text": [], "jumps": []}, {"id": "P1437", "text": ["Your answer is still incorrect. You should have measured approximately: 3 VDC"], "jumps": ["PutVar"]}, {"id": "P1440", "text": ["On the Model 170 Trainer, set the MOTOR switch to ON. Set the Proportional Gain by SLOWLY adjusting R2 (KP) on PC130-177 counter clockwise just until the motor stops. Do not allow the motor to jump back and forth for more than 30 seconds.to a minute."], "jumps": []}, {"id": "P1460", "text": ["The motor should lock into position and should not move until the MOTOR SPEED control is moved. The CH1 and CH2 oscilloscope traces should be at the 0 VDC null actuator signal level..."], "jumps": []}, {"id": "P1470", "text": ["Set the multimeter to read + 10 VDC. On PC130-179, connect the multimeter RED lead to TP1 and the BLACK lead to TP10."], "jumps": []}, {"id": "P1480", "text": ["As you SLOWLY vary the MOTOR SPEED from 20 to 80, use the multimeter to measure and record the voltage at PC130-179 TP1 in the Set Point column.solve for RPM."], "jumps": []}, {"id": "P1481", "text": [], "jumps": []}, {"id": "P1482", "text": ["Your answer is not acceptable. Make sure your setup is correct. TOR SPEED. . . . . .0 METER . . . . . . . . . . .IN MOTOR. . . . . . . . . . .ON"], "jumps": []}, {"id": "P1487", "text": ["Your answer is still incorrect. You should have measured approximately:6.75 V. If you are still having difficulty, contact your instructor."], "jumps": ["PutVar"]}, {"id": "P1490", "text": ["Set the multimeter to measure +10 VDC. On PC130-179, connect the multimeter RED probe to TP4 and the BLACK probe to TP10."], "jumps": []}, {"id": "P1500", "text": ["As you SLOWLY vary the MOTOR SPEED from 20 to 80, use the multimeter to measure and record the voltage in the Process Variable column.."], "jumps": []}, {"id": "P1501", "text": [], "jumps": []}, {"id": "P1502", "text": ["Your answer is not acceptable. Make sure your setup is correct. TOR SPEED. . . . . .0 METER . . . . . . . . . . .IN MOTOR. . . . . . . . . . .ON"], "jumps": []}, {"id": "P1507", "text": ["Your answer is still incorrect. You should have measured approximately:re shown below."], "jumps": ["PutVar"]}, {"id": "P1510", "text": ["Set the multimeter to measure +10 VDC. On PC130-178, connect the multimeter RED probe to TP1 and the BLACK probe to TP8 (ground)."], "jumps": []}, {"id": "P1520", "text": ["Notice that the measured values of the process variables follow the measured values of the set points. Adjusting the set point value will cause the process variable and the motor position toward the new set point value..."], "jumps": []}, {"id": "P1530", "text": ["Slowly vary the MOTOR SPEED control on the Model 170 Trainer between 20 and 80. The motor should be stepping from position to position. Set the MOTOR SPEED to 50."], "jumps": []}, {"id": "P1540", "text": ["On the Model 170 Trainer, set the MOTOR switch to OFF......"], "jumps": []}, {"id": "P1550", "text": ["Adjust the MOTOR SPEED control CLOCKWISE on the Model 170 Trainer until the CH1 trace is approximately + 6 VDC and no longer at the O VDC null actuator signal level. Pay no attention to the CH 2 trace."], "jumps": []}, {"id": "P1560", "text": ["Given the INPUT VOLTAGE at PC130-177 TP1 of + 6 VDC, we can calculate the 25% proportional gain to + 1.5 VDC. longer at the O VDC null actuator signal level.", "25% PROPORTION GAIN = INPUT VOLTAGE x 0.25 25% PROPORTIONAL GAIN = 6 VDC x 0.25 = 1.5 VDCCCCCCCC VDCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC", "25% PROPORTION GAIN = INPUT VOLTAGE x 0.25 25% PROPORTIONAL GAIN = 5 VDC x 0.25 = 1.5 VDCCCCCCCC VDCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC"], "jumps": []}, {"id": "P1570", "text": ["Set the PROPORTIONAL GAIN by adjusting R2 (KP) on PC130-177 so that the value of the CH2 trace is 1.5 VDC."], "jumps": ["Pp", "P66"]}, {"id": "P1580", "text": ["On the Model 170 Trainer, set the MOTOR switch to ON......."], "jumps": []}, {"id": "P1590", "text": ["Slowly vary the MOTOR SPEED control on the Model 170 Trainer between 20 and 80. Notice the motor should be moving more smoothly then with a Proportional Gain of 50%."], "jumps": []}, {"id": "P1600", "text": ["On the Model 170 Trainer, set the MOTOR switch to OFF......"], "jumps": []}, {"id": "P1610", "text": ["The Derivative Control (Rate) adjustment has the ability to stabilize a controlled process. Stabilization is achieved from the derivative control by improving the overshoot of the processed signal..."], "jumps": []}, {"id": "P1620", "text": ["Disconnect the CH2 probe from the PC130-177 card. Move the CH1 probe to PC130-177 TP3."], "jumps": []}, {"id": "P1630", "text": ["Set oscilloscope CH1 AC/GND/DC to AC, MODE to CH1, and VOLTS/DIV to 5. Adjust the trace to the middle of the screen.", "((((((( ( (( ( ( ( ( ( h h h h h h h h h h h"], "jumps": []}, {"id": "P1640", "text": ["On PC130-177, set S1 to IN, S2 to OUT, S3 to IN, S4 to IN, and adjust R7 (KD) fully clockwise."], "jumps": []}, {"id": "P1650", "text": ["On PC130-178, set S2 to MOTOR. On PC130-179, set S1 to MOTOR..."], "jumps": []}, {"id": "P1660", "text": ["On the Model 170 Trainer, set MOTOR to ON and MOTOR SPEED to 100."], "jumps": []}, {"id": "P1670", "text": ["Slowly adjust R7 (KD) on PC130-177 until the oscilloscope display looks like the screen below. Minimize the small sine wave signals between the large sine waves. This is the coarse adjustment for the derivative control."], "jumps": []}, {"id": "P1680", "text": ["The derivative control reduces the overshoot of the processed signal. When the derivative control potentiometer (R7) was turned counterclockwise, the overshoot of the signal was reduced..."], "jumps": []}, {"id": "P1690", "text": ["On the Model 170 Trainer, set MOTOR to OFF................."], "jumps": ["PPP6Pi12p", "P", "PggPi2", "Pci", "P6"]}, {"id": "P1700", "text": ["On PC130-178, set S2 to SERVO.............................."], "jumps": []}, {"id": "P1710", "text": ["On PC130-179, set S1 to SERVO.............................."], "jumps": []}, {"id": "P1720", "text": ["On the Model 170 Trainer set the MOTOR SPEED control to 50 and the MOTOR switch to ON."], "jumps": []}, {"id": "P1730", "text": ["Vary the MOTOR SPEED control on the Model 170 Trainer between 20 and 80. The motor should be tracking with the setting of the MOTOR SPEED control."], "jumps": []}, {"id": "P1740", "text": ["Notice that there is a small delay in the response of the motor as the MOTOR SPEED control is adjusted. Compensation for this response delay is provided by the Integral Control (Reset) adjustment..."], "jumps": []}, {"id": "P1750", "text": ["On the Model 170 Trainer, set the MOTOR switch to OFF......", "cccBBB B D B B BBBccbBbBB D"], "jumps": []}, {"id": "P1760", "text": ["Integral control is used to maintain a constant process variable signal regardless of the loading characteristics caused by the use of compensation. Integral action is introduced any time there is a deviation between the set point and process variable..."], "jumps": []}, {"id": "P1770", "text": ["On PC130-177 set S2 to IN and adjust R6 (KI) fully clockwise."], "jumps": []}, {"id": "P1780", "text": ["On the Model 170 Trainer, ensure the MOTOR switch is set to OFF."], "jumps": []}, {"id": "P1790", "text": ["Set the function generator for a 500 Hz, 4 Vpp square wave output. Connect the generator output to TP1 on PC130-177 and the ground lead to TP6. Injection of this signal will simulate a continuous error signal to the PID circuit..."], "jumps": []}, {"id": "P1800", "text": ["Slowly adjust R6 (KI) on PC130-177 until the first sine wave on the oscilloscope (TP3 on PC130-177) displays 2 Vpp. This adjusts the integral action of the signal."], "jumps": []}, {"id": "P1810", "text": ["Set oscilloscope CH1 VOLTS/DIV to 1 V......................"], "jumps": []}, {"id": "P1820", "text": ["Fine adjust the derivative (Rate) control by slowly adjusting R7 (KD) on PC130-177 until the first sine wave on the oscilloscopes display is shortened to the first graticule as shown..................."], "jumps": []}, {"id": "P1830", "text": ["Disconnect the function generator from TP 1 of PC130-177. On the Model 170 Trainer, set MOTOR SPEED to 50 and then turn the MOTOR switch to ON. let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
