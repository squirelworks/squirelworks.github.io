const book = {"title": "93957201", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: NATURE OF MOTIONdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": ["Hello Student, this lesson is about: about:"], "jumps": []}, {"id": "P100", "text": ["w Define motion. w Describe distance and velocity as related to motion. w Describe acceleration as related to motion.", "w Define circular motion. w Describe rotations per minute as related to circular motion. w Describe runout rate and runout distance as related to circular motion........................."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about motion."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["If you are going 55 mph, you are using the terms associated with motion."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["The terms are distance and time!"], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Distance can be given in any absolute term.  Examples are inches, feet, miles, meters, etc.", "Distance can be given in any absolute term. Examples are inches, feet, miles, meters, etc.."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Distance can be given in relative terms.  Examples are machine cycles, revolutions, strokes, etc.", "Distance can be given in relative terms. Examples are machine cycles, revolutions, strokes, etc."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["Time can also be given in many forms.  Examples are seconds, minutes, hours, days, etc.", "In motion, a change in the position of an object over time is important.", "Time can also be given in many forms. Examples are seconds, minutes, hours, days, etc."], "jumps": ["P460", "P440", "P470", "P450", "P"]}, {"id": "P470", "text": ["Let's begin the lesson on NATURE IN MOTION................................"], "jumps": ["P460"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1015", "text": ["Motion is the movement of an object.", "Motion is the movement of an object........................"], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["If an object moves from point A to point X, it is exhibiting motion."], "jumps": ["P1040", "P1015"]}, {"id": "P1040", "text": ["For example, an assembly line or conveyer belt has motion.", "For example, an assembly line or conveyer belt has motion.;"], "jumps": ["P1050", "P1015"]}, {"id": "P1050", "text": ["Motion has two principle factors, distance and time.", "Motion has two principle factors, distance and time........"], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["Distance, or the change in distance, is how far an object moves."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["In the illustration, distance is 10 feet, or the point at x, Dx (final point), minus the point at a, Da (initial point) is DD.", "In the illustration, distance is 10 feet, or the point at x, Dx (final point), minus the point at a, Da (initial point) is DD..ta symbol) D."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["Time, or the change in time, is how long it took the object to move from point a to point x."], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["In the illustration, time is 5 seconds, or the time at x, Tx (final time), minus the time at a, Ta (initial time) is DT.", "In the illustration, time is 5 seconds, or the time at x, Tx (final time), minus the time at a, Ta (initial time) is DT..............."], "jumps": ["P1100", "P1050"]}, {"id": "P1100", "text": ["Motion can be measured by knowing the objects change in distance and the change in time."], "jumps": ["P1110", "P1050"]}, {"id": "P1110", "text": ["The measurement of motion is VELOCITY, or the change in distance per change in time."], "jumps": ["P1120", "P1050"]}, {"id": "P1120", "text": ["In the example, the velocity of the object is 2 feet per second."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["In this example, distance is given in miles and time is given in hours."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["The velocity is 55 miles per hour or 55 mph."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["What is motion?", "What is motion? question is typed.........................."], "jumps": ["P1130"]}, {"id": "P1151", "text": [], "jumps": []}, {"id": "P1152", "text": ["Velocity is the method used to measure motion.", "Velocity is the method used to measure motion.............."], "jumps": []}, {"id": "P1153", "text": ["A change in time is part of what motion is but, there is another quantity that must be taken into consideration to have motion.", "What is the velocity of the object shown?", "What is the velocity of the object shown?.................."], "jumps": ["P1150", "P1165"]}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1162", "text": ["Look at the given information.  The distance is not in miles and the time is not in hours.  10 miles/hr is incorrect.", "Look at the given information. The distance is not in miles and the time is not in hours. 10 miles/hr is incorrect."], "jumps": []}, {"id": "P1163", "text": ["The distance is 60 feet, 60 - 0, and the time is 6 seconds, 6 - 0.  You have to divide 60 by 6 to get velocity.", "The distance is 60 feet, 60 - 0, and the time is 6 seconds, 6 - 0. You have to divide 60 by 6 to get velocity."], "jumps": []}, {"id": "P1165", "text": ["VELOCITY - The velocity of an object equals the change in distance divided by the change in time."], "jumps": []}, {"id": "P1170", "text": ["The formula for velocity can be rearranged to find other values than V."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["For example, if velocity and time are known, distance can be computed."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["If the velocity and distance is known, time can be computed."], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["If you drive 50 miles/hour and have 150 miles to go, how long will it take you to reach your destination?"], "jumps": ["P1170", "P1205"]}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1202", "text": ["The change in time equals the change in distance divided by the velocity.  150 miles divided by 50 miles/hr does not equal 1 hour.", "The change in time equals the change in distance divided by the velocity. 150 miles divided by 50 miles/hr does not equal 1 hour.."], "jumps": []}, {"id": "P1203", "text": ["The change in time equals the change in distance divided by the velocity.  150 miles divided by 50 miles/hr does not equal 2 hours.", "The change in time equals the change in distance divided by the velocity. 150 miles divided by 50 miles/hr does not equal 2 hours."], "jumps": []}, {"id": "P1205", "text": ["TIME - In motion, time equals the change in distance divided by the velocity."], "jumps": []}, {"id": "P1210", "text": ["If you travel 600 feet/sec for 5 seconds, how many feet did you move?"], "jumps": ["P1200", "P1215"]}, {"id": "P1211", "text": [], "jumps": []}, {"id": "P1212", "text": ["The change in distance equals the change in time times the velocity.  5 seconds times 600 feet/sec does not equal 1200 feet.", "The change in distance equals the change in time times the velocity. 5 seconds times 600 feet/sec does not equal 1200 feet."], "jumps": []}, {"id": "P1213", "text": ["The change in distance equals the change in time times the velocity.  5 seconds times 600 feet/sec does not equal 600 feet.", "The change in distance equals the change in time times the velocity. 5 seconds times 600 feet/sec does not equal 600 feet."], "jumps": []}, {"id": "P1215", "text": ["DISTANCE - In motion, distance equals the change in time times the velocity."], "jumps": []}, {"id": "P1220", "text": ["So far, you have seen the velocity between two points.", "So far, you have seen the velocity between two points......"], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["The velocity between point A and X is called the average velocity."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["Points between A and X are subdivisions."], "jumps": ["P1250", "P1220"]}, {"id": "P1250", "text": ["This example shows the same total distance and total time, 10 ft, 5 seconds."], "jumps": ["P1260", "P1220"]}, {"id": "P1260", "text": ["Additional points have been added at 1 second intervals."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["The velocity between each point can now be determined."], "jumps": ["P1280", "P1250"]}, {"id": "P1280", "text": ["The velocity between points A and B is 2 ft/sec."], "jumps": ["P1290", "P1250"]}, {"id": "P1290", "text": ["The velocity between points B and C is 2 ft/sec."], "jumps": ["P1300", "P1250"]}, {"id": "P1300", "text": ["In fact, the velocity between all points is 2 ft/sec."], "jumps": ["P1310", "P1250"]}, {"id": "P1310", "text": ["In this case with the velocity the same between each point, the velocity is fixed, or constant, and is equal to the average velocity."], "jumps": ["P1320", "P1250"]}, {"id": "P1320", "text": ["This graph shows the relationship between distance and a constant velocity, linear motion."], "jumps": ["P1330", "P1250"]}, {"id": "P1330", "text": ["Now, look at this example.", "Now, look at this example..e..............................."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["The average velocity is the total change in distance divided by the total change in time, or 4 ft/sec."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["Notice, the velocity between each point is different."], "jumps": ["P1360", "P1330"]}, {"id": "P1360", "text": ["The velocity between each point is:", "The velocity between each point is:GRAPHICS TEXT) Vab = 1 ft/1 sec = 1 ft/sec Vcd = 5 ft/1 sec = 5 ft/sec Vbc = 3 ft/1 sec = 3 ft/sec Vdx = 7 ft/1 sec = 7 ft/sec", "Vab = 1 ft/1 sec = 1 ft/sec Vbc = 3 ft/1 sec = 3 ft/sec", "Vcd = 5 ft/1 sec = 5 ft/sec Vdx = 7 ft/1 sec = 7 ft/sec"], "jumps": ["P1370", "P1330"]}, {"id": "P1370", "text": ["Notice velocity increases with distance."], "jumps": ["P1380", "P1330"]}, {"id": "P1380", "text": ["The increase in velocity is called acceleration.  Acceleration is a change (increase) in velocity.", "The increase in velocity is called acceleration. Acceleration is a change (increase) in velocity."], "jumps": ["P1390", "P1330"]}, {"id": "P1390", "text": ["In this case, the acceleration is an increase in velocity of 2 ft/sec for each second, or 2 ft/sec/sec."], "jumps": ["P1400", "P1330"]}, {"id": "P1400", "text": ["Note the unit of measure, distance per time (ft/sec/sec). Acceleration is a change in velocity, distance per time (ft/sec), for a change in time (sec)."], "jumps": ["P1410", "P1330"]}, {"id": "P1410", "text": ["To calculate acceleration, you find the difference in velocity between points and divide by change in time."], "jumps": ["P1420", "P1330"]}, {"id": "P1420", "text": ["Now, look at this example.", "Now, look at this example.re..............................."], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["The change in velocity between Vbc and Vdx is 4 ft/sec and the change in time is 2 seconds, acceleration is 2 ft/sec/sec.", "7 ft/sec - 3 ft/sec = 4 ft/sec 1 sec + 1 sec = 2 sec"], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["Look at this example.", "Look at this example.xt here..............................."], "jumps": ["P1450", "P1420"]}, {"id": "P1450", "text": ["Notice that the velocity is decreasing from 10 ft/sec to 1 ft/sec."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["This is called deceleration."], "jumps": ["P1470", "P1440"]}, {"id": "P1470", "text": ["Deceleration is also equal to the change in velocity divided by the change in time (final quantity; initial quantity)."], "jumps": ["P1480", "P1440"]}, {"id": "P1480", "text": ["In this case, the deceleration is -3 ft/sec/sec."], "jumps": ["P1490", "P1440"]}, {"id": "P1490", "text": ["The negative sign indicates deceleration."], "jumps": ["P1500", "P1440"]}, {"id": "P1500", "text": ["Any point can be used.  Deceleration is the change in velocity divided by the change in time.", "Any point can be used. Deceleration is the change in velocity divided by the change in time."], "jumps": ["P1510", "P1440"]}, {"id": "P2080", "text": ["What is circular motion?", "What is circular motion? is typed.........................."], "jumps": ["P2040"]}, {"id": "P1520", "text": ["Does this illustration indicate acceleration or deceleration?"], "jumps": ["P1510"]}, {"id": "P1521", "text": [], "jumps": []}, {"id": "P1522", "text": ["Notice that the velocity decreases for each time period, the object is not accelerating."], "jumps": []}, {"id": "P1530", "text": ["What is the deceleration shown?", "What is the deceleration shown?ed.........................."], "jumps": ["P1520", "P1535"]}, {"id": "P1531", "text": [], "jumps": []}, {"id": "P1532", "text": ["The answer 4 ft/sec is a measure of velocity, it is not an acceleration or deceleration."], "jumps": []}, {"id": "P1533", "text": ["The change in velocity between each point is 4 ft/sec but, the change in time is 4 seconds.  This does not produce a deceleration of 4 ft/sec/sec.", "The change in velocity between each point is 4 ft/sec but, the change in time is 4 seconds. This does not produce a deceleration of 4 ft/sec/sec."], "jumps": []}, {"id": "P1535", "text": ["DECELERATION - Deceleration is the change in velocity divided by the change in time."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on NATURE OF MOTION.", "This completes the information on NATURE OF MOTION........."], "jumps": ["P1001", "P1530"]}, {"id": "P1920", "text": ["1.  Motion is a change in position of an object per time.", "1. Motion is a change in position of an object per time..."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Velocity measures motion. It is the change in distance of an           object with respect to a change in time.", "2. Velocity measures motion. It is the change in distance of an object with respect to a change in time..."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Using the formula for velocity, any value can be calculated if           two of the values are known.", "3. Using the formula for velocity, any value can be calculated if two of the values are known.."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  Fixed velocity is a constant velocity between each point.", "4. Fixed velocity is a constant velocity between each point.."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  Acceleration is the change in velocity (increase) for a change        in time.", "5. Acceleration is the change in velocity (increase) for a change in time..."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  Deceleration is also a change in velocity (decrease) for a                 change in time.", "6. Deceleration is also a change in velocity (decrease) for a change in time..."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7.  A constant velocity produces linear motion.", "7. A constant velocity produces linear motion............."], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["8.  Changing velocity also produces linear motion.", "8. Changing velocity also produces linear motion..........", "- Distance - Acceleration - Velocity - Deceleration"], "jumps": ["P1999", "P1980"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1990"]}, {"id": "P10213", "text": [], "jumps": []}, {"id": "P2015", "text": ["Circular motion is the motion produced by rotating machines, motors for example."], "jumps": ["P2020", "P2001"]}, {"id": "P2020", "text": ["In fact, most industrial applications first produce motion by motors, circular motion, and then change it to linear motion."], "jumps": ["P2030", "P2015"]}, {"id": "P2030", "text": ["The changing between circular and linear motion is accomplished by a rack and pinion."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["Circular motion is normally measured in rotations (or revolutions) per minute, RPM."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["RPM is the number of complete rotations, 360 degree movements, that occur each minute."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["RPM is velocity.  Rotation is a relative term for distance.  Minutes is a term for time.", "RPM is velocity. Rotation is a relative term for distance. Minutes is a term for time."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["A change in RPM (velocity) causes acceleration or deceleration."], "jumps": ["P2080", "P2040"]}, {"id": "P10218", "text": ["What happens to velocity during deceleration?"], "jumps": []}, {"id": "P2081", "text": [], "jumps": []}, {"id": "P2082", "text": ["Linear velocity is motion in a straight line.  Circular motion is like the shaft of a spinning motor.", "Linear velocity is motion in a straight line. Circular motion is like the shaft of a spinning motor."], "jumps": []}, {"id": "P2083", "text": ["RPM is a measure of circular motion.", "RPM is a measure of circular motion........................"], "jumps": []}, {"id": "P2090", "text": ["The problem with using RPM as velocity is that it is a relative term."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["In most applications, you need to describe circular velocity and circular distance in absolute terms, like ft/sec and feet."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["Changing RPM to absolute terms is done by calculating: runout rate (ROR) and runout distance (ROD)."], "jumps": ["P2120", "P2090"]}, {"id": "P2120", "text": ["Runout is a term used to describe the method of changing circular motion to linear motion."], "jumps": ["P2130", "P2090"]}, {"id": "P2130", "text": ["Consider that a rotating shaft will cause a plate to move.", "Consider that a rotating shaft will cause a plate to move.."], "jumps": ["P2140", "P2090"]}, {"id": "P2140", "text": ["Point A is the initial position on the shaft."], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["Point a is the initial position on the plate.  Notice these points are where the shaft and plate touch.", "Point a is the initial position on the plate. Notice these points are where the shaft and plate touch."], "jumps": ["P2160", "P2130"]}, {"id": "P2160", "text": ["Now, as the shaft rotates to points B, the plate also moves to point b."], "jumps": ["P2170", "P2130"]}, {"id": "P2170", "text": ["The distance between point a and point b of the plate is the distance that the shaft rotated is called runout.", "The distance between point a and point b of the plate is the distance that the shaft rotated is called runout........"], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["As the shaft continues to rotate to point C, the plate continues to move."], "jumps": ["P2190", "P2160"]}, {"id": "P2190", "text": ["The distance the plate moved is now from point a to point c."], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["At point D, the shaft has moved more causing the plate to move more."], "jumps": ["P2210", "P2180"]}, {"id": "P2210", "text": ["Finally, when the shaft returns to point A, the distance from A to a on the shaft and the distance from A to a on the plate is the same."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["You can now measure the distance on the plate from A to a in feet, inches, or meters, in absolute terms."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["The circular motion was changed into linear motion.", "The circular motion was changed into linear motion........."], "jumps": ["P2240", "P2210"]}, {"id": "P2240", "text": ["Now, you can determine velocity and distance in absolute terms."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["The formula for determining the runout rate, velocity or ROR, is simple.  You multiply the RPM times the circumference of the shaft.", "The formula for determining the runout rate, velocity or ROR, is simple. You multiply the RPM times the circumference of the shaft."], "jumps": ["P2260", "P2230"]}, {"id": "P2260", "text": ["Recall that the circumference is the distance around a circle, or shaft."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["RPM is the number of complete rotations in a minute."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["So, if a shaft has a circumference of 10 inches and is moving at 10 RPM, the ROR is 100 inches/minutes.  This is velocity.", "So, if a shaft has a circumference of 10 inches and is moving at 10 RPM, the ROR is 100 inches/minutes. This is velocity.", "ROR = RPM x C = 10 RPM x 10\" = 100 inches/minutesssss"], "jumps": ["P2290", "P2260"]}, {"id": "P2290", "text": ["What is the ROR of a motor that has a RPM of 60 and has a shaft with the circumference of 2 inches?"], "jumps": ["P2280", "P2295"]}, {"id": "P2291", "text": [], "jumps": []}, {"id": "P2292", "text": ["60 is the RPM of the motor.  To find the velocity, or runout rate, you must multiply RPM by the circumference of the shaft.", "60 is the RPM of the motor. To find the velocity, or runout rate, you must multiply RPM by the circumference of the shaft.."], "jumps": []}, {"id": "P2293", "text": ["The units of measure are not in feet and seconds.  RPM is minutes and the circumference is inches.", "The units of measure are not in feet and seconds. RPM is minutes and the circumference is inches."], "jumps": []}, {"id": "P2295", "text": ["VELOCITY OR RUNOUT RATE - The velocity of circular motion equals the RPM of the object times the circumference of the object."], "jumps": []}, {"id": "P2300", "text": ["Normally, the velocity of most circular motion devices is calculated in ft/sec."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["Normally the radius is given instead of circumference.", "Normally the radius is given instead of circumference......"], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["So, this formula is the one that you will normally use.", "So, this formula is the one that you will normally use....."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["Two pi r is used to calculate the circumference of the device when the radius is given, and r should be in feet."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["Dividing by 60 changes rotations per minute, RPM, to rotations per second."], "jumps": ["P2350", "P2320"]}, {"id": "P2350", "text": ["For example, if a motor has an RPM of 1500 and has a shaft radius of .03 feet, the velocity or ROR is 4.71 ft/sec."], "jumps": ["P2360", "P2320"]}, {"id": "P2360", "text": ["What is the velocity, ROR in ft/sec, of a motor with a shaft radius of 0.6 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
