 ["P13350"]}, {"id": "P13350", "text": ["As you learn more about I/O devices, you will see that they all work relatively the same. The only differences being extra signals, software to enhance speed, and different types of protection/testing signals being sent with the data.", "As you learn more about I/O devices, you will see that they all work relatively the same. The only differences being extra signals, software to enhance speed, and different types of protection/testing signals being sent with the data..."], "jumps": ["P13360", "P13340"]}, {"id": "P13340", "text": ["Working with the I/O ports of a microprocessor system is very simple if the system is set up properly. It only took a few lines of code to send and receive information."], "jumps": ["P13350", "P13335"]}, {"id": "P13337", "text": [], "jumps": ["P13340", "P13335"]}, {"id": "P13335", "text": ["When the parallel port is active in the Nida 8085 _______", "When the parallel port is active in the Nida 8085 _______..", "the microprocessor is in a RST condition."], "jumps": ["P13330"]}, {"id": "P13330", "text": ["At this point, 1 is added to the retrieved value and then output back to port A.  Port \"A\" should now be showing the value 10h which is, as stated earlier, OFh + 1.", "At this point, 1 is added to the retrieved value and then output back to port A. Port \"A\" should now be showing the value 10h which is, as stated earlier, OFh + 1."], "jumps": ["P13335", "P13320"]}, {"id": "P13320", "text": ["In this program the value OFh is sent to port A of the parallel port. This is microprocessor port COh.  After this the accumulator is cleared to OOh and the value is then read from parallel port A.", "In this program the value OFh is sent to port A of the parallel port. This is microprocessor port COh. After this the accumulator is cleared to OOh and the value is then read from parallel port A."], "jumps": ["P13330", "P13310"]}, {"id": "P13310", "text": ["Notice the output of parallel port A. If you treat output pin 1 as the least significant bit you can see the output to be the same as the out command sending, OFh + 1 which is 10h."], "jumps": ["P13320", "P13300"]}, {"id": "P13300", "text": ["Observe the display. It should indicate that the program terminated properly by showing the initial startup screen of the 8085 microprocessor.  If there are any doubts about the accuracy of the code you typed in, go back and verify that it is correct.", "Observe the display. It should indicate that the program terminated properly by showing the initial startup screen of the 8085 microprocessor. If there are any doubts about the accuracy of the code you typed in, go back and verify that it is correct.."], "jumps": ["P13310", "P13290"]}, {"id": "P13290", "text": ["14.  Once you have finished entering the program, select the                  RUN key on the 8085 keypad, enter the address value                      \"1000\" and press ENTER.", "14. Once you have finished entering the program, select the RUN key on the 8085 keypad, enter the address value \"1000\" and press ENTER."], "jumps": ["P13300", "P13280"]}, {"id": "P13280", "text": ["13.  Enter the following program into memory starting at \"1000\".          Select EDIT, then type 1000, load values with an ENTER after         each one.  Press STOP when finished.", "13. Enter the following program into memory starting at \"1000\". Select EDIT, then type 1000, load values with an ENTER after each one. Press STOP when finished.", "MNEMONIC MVI A, 80Fh OUT C0h MVI A, 80Fh IN C0h ADI 801h OUT C0h RET", "DESCRIPTION Moves the value 0fFh into the A register. Output the value stored in A to the I/O port at C0H. Set the register value to zero, effectively clears the register. Input the value from the I/O device at location C0h to A. Add the value 1 to the value stored in the A register. Output the value on the A register to the I/O port C0h again. Return to the monitor program.."], "jumps": ["P13290", "P13270"]}, {"id": "P13270", "text": ["This is just a basic example of sending data to a parallel port. To be more useful, let's send a byte of data to the parallel port and then read it from the parallel port."], "jumps": ["P13280", "P13260"]}, {"id": "P13260", "text": ["Remember, no other devices are active when the parallel port is active. Only one device which uses the data bus can be active at a given time in this system.", "Remember, no other devices are active when the parallel port is active. Only one device which uses the data bus can be active at a given time in this system.."], "jumps": ["P13270", "P13250"]}, {"id": "P13250", "text": ["The parallel port A uses address CO. This address is decoded by circuitry and the IO/M signal which are used to select the parallel port as active.", "The parallel port A uses address CO. This address is decoded by circuitry and the IO/M signal which are used to select the parallel port as active.."], "jumps": ["P13260", "P13240"]}, {"id": "P13240", "text": ["The second command actually sends the information to the I/O device. It is important to note that only 256 I/O devices can be attached to the system. This accounts for the binary values 00h to Ffh."], "jumps": ["P13250", "P13235"]}, {"id": "P13235", "text": ["In this program, the first step was to put the data we wanted to send to the I/O device into the accumulator register. This is the only register that is used to output data to I/O."], "jumps": ["P13240", "P13230"]}, {"id": "P13230", "text": ["Observe the parallel port C and see if the LEDs illuminate and show  the pattern from most significant bit to lowest. If this is not the output, check your code or ask your instructor for assistance.", "Observe the parallel port C and see if the LEDs illuminate and show the pattern from most significant bit to lowest. If this is not the output, check your code or ask your instructor for assistance."], "jumps": ["P13235", "P13220"]}, {"id": "P13220", "text": ["12.  Run the program you just entered. This is done by pressing           the RUN key and entering the starting address of the                        program, \"1000\".", "12. Run the program you just entered. This is done by pressing the RUN key and entering the starting address of the program, \"1000\"."], "jumps": ["P13230", "P13210"]}, {"id": "P13210", "text": ["11.   Enter the following program into memory starting at \"1000\".          (EDIT, 1000, enter values with an ENTER after each one,                  press STOP when finished).", "11. Enter the following program into memory starting at \"1000\". (EDIT, 1000, enter values with an ENTER after each one, press STOP when finished). ess Opcode Mnemonic Description 1000 3E MVI A, 0A5h Moves the value A5h into the A register.1001 A5 1002 D3 OUT C0h Outputs the value in A to the IO port at C0h. 1003 C0 1004 C9 RET Return to the monitor program.", "Address Opcode Mnemonic Description 1000 3E MVI A, 0A5h Moves the value A5h into the A register. 1001 A5 1002 D3 OUT C0h Outputs the value in A to the I/O port at C0h. 1003 C0 1004 C9 RET Return to the monitor program......"], "jumps": ["P13220", "P13200"]}, {"id": "P13205", "text": ["Entering programs into memory of the 8085 uses the EDIT function of the 8085 Monitor Program. Once you have pressed EDIT, you will be asked to enter an address to edit. The typical address we will use is 8000. On the screen is the current address that you are looking at and the current value stored in that location. There are three things you can do at any address. Enter a new value and press enter, press the down arrow to move to the next address or use the up arrow to move to the previous address. Every time you enter a value and press enter, you will be automatically moved to the address. If at anytime you just press enter without entering data, zeros will result for that memory location. Always remember to use the up and down arrows for movement through your code. When a program is shown to you, you will be given an address, Opcodes, Mnemonics and a description. Start at the first address given and enter each opcode consecutively until you are finished. Once you are finished editing your program you can press STOP. e opcodes for a program. Once you are finished editing your program you can press STOP."], "jumps": []}, {"id": "P13200", "text": ["10.  Press the RESET button on the PC130-485 card. You will be          entering a program into memory for execution by the 8085              microprocessor.  Press the HELP button for a brief summary         on entering programs into the 8085.", "10. Press the RESET button on the PC130-485 card. You will be entering a program into memory for execution by the 8085 microprocessor. Press the HELP button for a brief summary on entering programs into the 8085.."], "jumps": ["P13210", "P13180", "P13205"]}, {"id": "P13190", "text": ["The 8085 microprocessor trainer has a parallel port with three ports; A, B, and C. In this lesson we are only going to write to port A read from port A."], "jumps": ["P13200", "P13180"]}, {"id": "P13180", "text": ["Without the delay, the 8085 operates so quickly, all you would see is the port's output LEDs illuminated."], "jumps": ["P13190", "P13160"]}, {"id": "P13170", "text": ["The first program that you are going to enter will demonstrate continuous writing to the parallel port. The program includes a delay routine to slow the writing of information to the port's LEDs.", "The first program that you are going to enter will demonstrate continuous writing to the parallel port. The program includes a delay routine to slow the writing of information to the port's LEDs..."], "jumps": ["P13180", "P13160"]}, {"id": "P13160", "text": ["The system should now be functioning properly. Remember from earlier reading that the I/O ports are used the same way as memory. Certain address values will allow the processor to communicate with the parallel port.", "The system should now be functioning properly. Remember from earlier reading that the I/O ports are used the same way as memory. Certain address values will allow the processor to communicate with the parallel port..."], "jumps": ["P13170", "P13140"]}, {"id": "P13150", "text": ["In the second section, we are going to read the data of the parallel port which should be the same as was written."], "jumps": ["P13160", "P13140"]}, {"id": "P13140", "text": ["COMMUNICATING WITH THE PARALLEL PORT\nThis experiment has two sections.  In the first section we are going to look at communication with the parallel port, and write data to  the parallel port.", "COMMUNICATING WITH THE PARALLEL PORT This experiment has two sections. In the first section we are going to look at communication with the parallel port, and write data to the parallel port..."], "jumps": ["P13150", "P13136"]}, {"id": "P13136", "text": ["The schematics for the 8085 Microprocessor circuits used in  this experiment are accessibleby pressing Ctrl and S.", "The schematics for the 8085 Microprocessor circuits used in this experiment are accessibleby pressing Ctrl and S.ccessible through the F5 key.he F5 key."], "jumps": ["P13140"]}, {"id": "P13135", "text": ["9. The microprocessor system is now assembled and operating. You should see the message \"NIDA 485 Vx.x:\" in the LCD display on the PC130-400 card. If the message is dim or blank, try adjusting the Display Intensity potentiometer R1 on the PC130-404 card using a small screwdriver. If you still cannot see the message, see your instructor for assistance. e version of the monitor program you are using. This experiment is written for all versions of the monitor program. If, at any time during the experiment, you short some of the IC pins together while observing the signals, press the reset button. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run the program before proceeding with your measurements.ents...", "The \"Vx.x\" in the display of the LCD indicates the version of the monitor 1\", \"P10302\", \"P10303\")", "SELECT A TOUCH AREA TO VIEW MORE DETAIL."], "jumps": []}, {"id": "P2910", "text": ["This completes the experiment on 8085 MICROPROCESSOR.", "This completes the experiment on 8085 MICROPROCESSOR......."], "jumps": ["P2001", "P2400"]}, {"id": "P2800", "text": [], "jumps": []}, {"id": "P2400", "text": ["17.  Disconnect the equipment and return to the designated area.", "17. Disconnect the equipment and return to the designated area."], "jumps": ["P2910", "P2390"]}, {"id": "P2390", "text": ["16.  Set the Console Power Switch to OFF.", "16. Set the Console Power Switch to OFF..................."], "jumps": ["P2380"]}, {"id": "P2380", "text": ["15.  Return the Test Console to the initial control settings.", "15. Return the Test Console to the initial control settings..............."], "jumps": ["P2360"]}, {"id": "P2360", "text": ["Whenever dealing with complex I/O systems, look for the basic operation and then work from there."], "jumps": ["P2380", "P2350"]}, {"id": "P2350", "text": ["As you learn more about I/O devices, you will see that they all work relatively the same. The only differences being extra signals, software to enhance speed, and different types of protection/testing signals being sent with the data.", "As you learn more about I/O devices, you will see that they all work relatively the same. The only differences being extra signals, software to enhance speed, and different types of protection/testing signals being sent with the data..."], "jumps": ["P2360", "P2340"]}, {"id": "P2340", "text": ["Working with the I/O ports of a microprocessor system is very simple if the system is set up properly. It only took a few lines of code to send and receive information."], "jumps": ["P2350", "P2335"]}, {"id": "P2337", "text": [], "jumps": []}, {"id": "P2335", "text": ["When the parallel port is active in the Nida 8085 _______", "When the parallel port is active in the Nida 8085 _______..", "the microprocessor is in a RST condition."], "jumps": ["P2330"]}, {"id": "P2330", "text": ["At this point 1 is added to the retrieved value and then output back to port A. Port \"A\" should now be showing the value 10h which is, as stated earlier, OFh + 1."], "jumps": ["P2335", "P2320"]}, {"id": "P2320", "text": ["In this program the value OFh is sent to port A of the parallel port. This is microprocessor port COh. After this the accumulator is cleared to OOh and the value is then read from parallel port A."], "jumps": ["P2330", "P2310"]}, {"id": "P2310", "text": ["Notice the output of parallel port A. If you treat output pin 1 as the least significant bit you can see the output to be the same as the out command sending, OFh + 1 which is 10h."], "jumps": ["P2320", "P2300"]}, {"id": "P2300", "text": ["Observe the display. It should indicate that the program terminated properly by showing the initial startup screen of the 8085 microprocessor.  If there are any doubts about the accuracy of the code you typed in, go back and verify that it is correct.", "Observe the display. It should indicate that the program terminated properly by showing the initial startup screen of the 8085 microprocessor. If there are any doubts about the accuracy of the code you typed in, go back and verify that it is correct.."], "jumps": ["P2310", "P2290"]}, {"id": "P2290", "text": ["14.  Once you have finished entering the program, select the                  RUN key on the 8085 keypad, enter the address value                      \"1000\" and press ENTER.", "14. Once you have finished entering the program, select the RUN key on the 8085 keypad, enter the address value \"1000\" and press ENTER."], "jumps": ["P2300", "P2280"]}, {"id": "P2280", "text": ["13.  Enter the following program into memory starting at \"1000\".          Select EDIT, then type 1000, load values with an ENTER after         each one.  Press STOP when finished.", "13. Enter the following program into memory starting at \"1000\". Select EDIT, then type 1000, load values with an ENTER after each one. Press STOP when finished.", "MNEMONIC MVI A, 80Fh OUT C0h MVI A, 80Fh IN C0h ADI 801h OUT C0h RET", "DESCRIPTION Moves the value 0fFh into the A register. Output the value stored in A to the I/O port at C0H. Set the register value to zero, effectively clears the register. Input the value from the I/O device at location C0h to A. Add the value 1 to the value stored in the A register. Output the value on the A register to the I/O port C0h again. Return to the monitor program.."], "jumps": ["P2290", "P2270"]}, {"id": "P2270", "text": ["This is just a basic example of sending data to a parallel port. To be more useful, let's send a byte of data to the parallel port and then read it from the parallel port."], "jumps": ["P2280", "P2260"]}, {"id": "P2260", "text": ["Remember, no other devices are active when the parallel port is active. Only one device which uses the data bus can be active at a given time in this system."], "jumps": ["P2270", "P2250"]}, {"id": "P2250", "text": ["The parallel port A uses address CO. This address is decoded by decoding circuitry and the IO/M signal which are used to select the parallel port as active.", "The parallel port A uses address CO. This address is decoded by decoding circuitry and the IO/M signal which are used to select the parallel port as active.."], "jumps": ["P2260", "P2240"]}, {"id": "P2240", "text": ["The second command actually sends the information to the I/O device. It is important to note that only 256 I/O devices can be attached to the system. This accounts for the binary values 00h to Ffh.", "The second command actually sends the information to the I/O device. It is important to note that only 256 I/O devices can be attached to the system. This accounts for the binary values 00h to Ffh.."], "jumps": ["P2250", "P2235"]}, {"id": "P2235", "text": ["In this program, the first step was to put the data we wanted to send to the I/O device into the accumulator register. This is the only register than is used to output data to I/O."], "jumps": ["P2240", "P2230"]}, {"id": "P2230", "text": ["Observe the parallel port C and see if the LEDs illuminate and show the pattern from most significant bit to lowest. If this not the output, check your code or ask your instructor for assistance."], "jumps": ["P2235", "P2220"]}, {"id": "P2220", "text": ["12.  Run the program you just entered. This is done by pressing           the RUN key and entering the starting address of the                        program, \"1000\".", "12. Run the program you just entered. This is done by pressing the RUN key and entering the starting address of the program, \"1000\"."], "jumps": ["P2230", "P2210"]}, {"id": "P2210", "text": ["11.   Enter the following program into memory starting at \"1000\".          (EDIT, 1000, enter values with an ENTER after each one,                  press STOP when finished).", "11. Enter the following program into memory starting at \"1000\". (EDIT, 1000, enter values with an ENTER after each one, press STOP when finished). ess Opcode Mnemonic Description 1000 3E MVI A, 0A5h Moves the value A5h into the A register.1001 A5 1002 D3 OUT C0h Outputs the value in A to the IO port at C0h. 1003 C0 1004 C9 RET Return to the monitor program.", "Address Opcode Mnemonic Description 1000 3E MVI A, 0A5h Moves the value A5h into the A register. 1001 A5 1002 D3 OUT C0h Outputs the value in A to the I/O port at C0h. 1003 C0 1004 C9 RET Return to the monitor program......"], "jumps": ["P2220", "P2200"]}, {"id": "P2205", "text": ["Entering programs into memory of the 8085 uses the EDIT function of the 8085 Monitor Program. Once you have pressed EDIT, you will be asked to enter an address to edit. The typical address we will use is 8000. On the screen is the current address that you are looking at and the current value stored in that location. There are three things you can do at any address. Enter a new value and press enter, press the down arrow to move to the next address or use the up arrow to move to the previous address. Every time you enter a value and press enter, you will be automatically moved to the address. If at anytime you just press enter without entering data, zeros will result for that memory location. Always remember to use the up and down arrows for movement through your code. When a program is shown to you, you will be given an address, Opcodes, Mnemonics and a description. Start at the first address given and enter each opcode consecutively until you are finished. Once you are finished editing your program you can press STOP. e opcodes for a program. Once you are finished editing your program you can press STOP."], "jumps": []}, {"id": "P2200", "text": ["10.  Press the RESET button on the PC130-485 card. You will be          entering a program into memory for execution by the 8085              microprocessor.  Press the HELP button for a brief summary         on entering programs into the 8085.", "10. Press the RESET button on the PC130-485 card. You will be entering a program into memory for execution by the 8085 microprocessor. Press the HELP button for a brief summary on entering programs into the 8085.."], "jumps": ["P2210", "P2180", "P2205"]}, {"id": "P2190", "text": ["The 8085 microprocessor trainer has a parallel port with three ports; A, B, and C. In this lesson we are only going to write to port A read from port A."], "jumps": ["P2200", "P2180"]}, {"id": "P2180", "text": ["Without the delay, the 8085 operates so quickly, all you would see is the port's output LEDs illuminated."], "jumps": ["P2190", "P2160"]}, {"id": "P2170", "text": ["The first program that you are going to enter will demonstrate continuous writing to the parallel port. The program includes a delay routine to slow the writing of information to the port's LEDs.", "The first program that you are going to enter will demonstrate continuous writing to the parallel port. The program includes a delay routine to slow the writing of information to the port's LEDs..."], "jumps": ["P2180", "P2160"]}, {"id": "P2160", "text": ["The system should now be functioning properly.  Remember from earlier reading that the I/O ports are used the same way as memory. Certain address values will allow the processor to communicate with the parallel port.", "The system should now be functioning properly. Remember from earlier reading that the I/O ports are used the same way as memory. Certain address values will allow the processor to communicate with the parallel port.."], "jumps": ["P2170", "P2140"]}, {"id": "P2150", "text": ["In the second section, we are going to read the data of the parallel port which should be the same as was written."], "jumps": ["P2160", "P2140"]}, {"id": "P2140", "text": ["COMMUNICATING WITH THE PARALLEL PORT \nThis experiment has two sections.  In the first section we are going to look at communication with the parallel port, and write data to the parallel port.", "COMMUNICATING WITH THE PARALLEL PORT This experiment has two sections. In the first section we are going to look at communication with the parallel port, and write data to the parallel port."], "jumps": ["P2150", "P2136"]}, {"id": "P2136", "text": ["The schematics for the 8085 Microprocessor circuits used in  this experiment are accessibleby pressing Ctrl and S.", "The schematics for the 8085 Microprocessor circuits used in this experiment are accessibleby pressing Ctrl and S.ment are accessible through the F5 key."], "jumps": ["P2140"]}, {"id": "P2135", "text": ["9. The microprocessor system is now assembled and operating. You should see the message \"NIDA 485 Vx.x:\" in the LCD display on the PC130-400 card. If the message is dim or blank, try adjusting the Display Intensity potentiometer R1 on the PC130-404 card using a small screwdriver. If you still cannot see the message, see your instructor for assistance. e version of the monitor program you are using. This experiment is written for all versions of the monitor program. If, at any time during the experiment, you short some of the IC pins together while observing the signals, press the reset button. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run the program before proceeding with your measurements.ents...", "The \"Vx.x\" in the display of the LCD indicates the version of the monitor program you are using. This experiment is written for all versions of the monitor program. If, at any time during the experiment, you short some of the IC pins together while observing the signals, press the reset button. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run the program before proceeding with your measurements."], "jumps": ["P2136", "P2130"]}, {"id": "P2130", "text": ["8.  Press the PC1 DC Power switch to ON.", "8. Press the PC1 DC Power switch to ON.o 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2125"]}, {"id": "P2125", "text": ["7.  Press the PC2 DC Power switch to ON.", "7. Press the PC2 DC Power switch to ON.o 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2120"]}, {"id": "P2120", "text": ["6.  Press the PC3 DC Power switch to ON.", "6. Press the PC3 DC Power switch to ON.o 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2100"]}, {"id": "P2100", "text": ["5.  Set the Positive Supply Control to 5V.", "5. Set the Positive Supply Control to 5V.................................."], "jumps": ["P2090"]}, {"id": "P2090", "text": ["4.  Connect four experiment cards with the ribbon cables as                follows:\n     a.  Using the 30 pin ribbon cable, connect PC130-485 J1 to PC130-402 J1.\n       b.  Using the short 20 pin ribbon cable, connect PC130-402 J2 to PC130-401 J1.\n       c.  Using the long 20 pin ribbon cable, connect PC130-401 J2 to PC130-400 J1.", "4. Connect four experiment cards with the ribbon cables as follows: a. Using the 30 pin ribbon cable, connect PC130-485 J1 to PC130-402 J1. b. Using the short 20 pin ribbon cable, connect PC130-402 J2 to PC130-401 J1. c. Using the long 20 pin ribbon cable, connect PC130-401 J2 to PC130-400 J1. n the proper orientation. Note that each cable has a red stripe on one side. This stripe indicates pin 1. On the Experiment Cards, the number 1 or 2 indicates the end of the connector with the 1 pin. Attach the cables to the connectors such that the red stripe is at the end of the connector with the numeral 1 or 2.1 or 2."], "jumps": ["P2100", "P2085"]}, {"id": "P2085", "text": ["3.  Place the PC130-400 Keyboard and Display card in front of            the test console between the PC2 and PC3 positions.", "3. Place the PC130-400 Keyboard and Display card in front of the test console between the PC2 and PC3 positions. aker switch to ON........................................."], "jumps": ["P2080"]}, {"id": "P2080", "text": ["2. Insert the following 130 experiment cards on the test console. a. Insert PC130-485 8085 Microprocessor card in the PC1 position. b. Insert PC130-402 Memory & Decoder card in the PC2 position. c. Insert PC130-401 I/O card in the PC3 position."], "jumps": ["P2070"]}, {"id": "P2070", "text": ["1. Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings..........."], "jumps": ["P2060"]}, {"id": "P2060", "text": ["Let's begin the experiment on the operation of the 8085 microprocessor."], "jumps": ["P2070", "P2040"]}, {"id": "P2050", "text": ["By understanding and using a parallel port, basic principles about I/O communication with a microprocessor can be seen."], "jumps": ["P2060", "P2040"]}, {"id": "P2040", "text": ["In this experiment, you will get a hands-on look at one of the most common I/O port used, the parallel port. While parallel ports may differ from machine to machine, their basic operation is the same."], "jumps": ["P2001"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.nu."], "jumps": ["P1001", "P1980"]}, {"id": "P1990", "text": ["8.  Parallel ports are faster than serial ports, however, the cables        are restricted to shorter distances and the cable can be more         expensive since six more wires are required.", "8. Parallel ports are faster than serial ports, however, the cables are restricted to shorter distances and the cable can be more expensive since six more wires are required."], "jumps": ["P1999", "P1980"]}, {"id": "P1980", "text": ["7.  Serial Ports are slower than parallel ports, however, they can         span greater cable lengths. Parallel ports have nine wires at a        minimum, 8 data lines and a ground.", "7. Serial Ports are slower than parallel ports, however, they can span greater cable lengths. Parallel ports have nine wires at a minimum, 8 data lines and a ground."], "jumps": ["P1990", "P1970"]}, {"id": "P1970", "text": ["6.  Serial ports need a minimum of three connections for \n     bi-directional communication; send, receive and ground.", "6. Serial ports need a minimum of three connections for bi-directional communication; send, receive and ground...ive and ground."], "jumps": ["P1980", "P1960"]}, {"id": "P1960", "text": ["5.  LCD's are normally in pre-built modules containing a                        processor designed to control the LCD.", "5. LCD's are normally in pre-built modules containing a processor designed to control the LCD."], "jumps": ["P1970", "P1950"]}, {"id": "P1950", "text": ["4.  The 8085 keypad has three major sections to it: control,                  decoding and detecting, and keypad key matrix.", "4. The 8085 keypad has three major sections to it: control, decoding and detecting, and keypad key matrix.."], "jumps": ["P1960", "P1940"]}, {"id": "P1940", "text": ["3.  I/O is connected to a microprocessor system through the                address, data and control lines, just like memory. Certain                address values will enable each I/O device individually. The            difference in connections involves the IO/M pin.", "3. I/O is connected to a microprocessor system through the address, data and control lines, just like memory. Certain address values will enable each I/O device individually. The difference in connections involves the IO/M pin....", "HIGH INDICATES IO ACCESS, LOW INDICATES MEMORY"], "jumps": ["P1950", "P1920"]}, {"id": "P1930", "text": ["2.  Some examples of common I/O are: a Network Adapter, a                Serial Port, a Parallel Port, a Keypad or an LCD Display.", "2. Some examples of common I/O are: a Network Adapter, a Serial Port, a Parallel Port, a Keypad or an LCD Display."], "jumps": ["P1940", "P1920"]}, {"id": "P1920", "text": ["1.  I/O allows a microprocessor to input and output data with the        world around it. Without the I/O ability, a microprocessor is             useless.", "1. I/O allows a microprocessor to input and output data with the world around it. Without the I/O ability, a microprocessor is useless."], "jumps": ["P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on INTERFACING WITH 8085 MICROPROCESSOR."], "jumps": ["P1001", "P1850"]}, {"id": "P1853", "text": ["While the keyboard is an input device, it is NOT an output device."], "jumps": []}, {"id": "P1852", "text": ["While the display is an output device, it is NOT an input device."], "jumps": []}, {"id": "P1851", "text": [], "jumps": []}, {"id": "P1850", "text": ["Which of the following is an input and an output device?", "Which of the following is an input and an output device?..."], "jumps": ["P1840"]}, {"id": "P1843", "text": ["While the parallel port can be an input, it is also an output. This question asked which device is JUST an input device."], "jumps": []}, {"id": "P1842", "text": ["The display is only an output device. Remember, an input device provides some sort of input to the microprocessor."], "jumps": []}, {"id": "P1841", "text": [], "jumps": []}, {"id": "P1840", "text": ["Which of the following is just an input device?", "Which of the following is just an input device?............"], "jumps": ["P1785"]}, {"id": "P1830", "text": ["However, the principles of their operation will closely relate to the most common interface ports, serial and parallel."], "jumps": ["P1840", "P1785"]}, {"id": "P1820", "text": ["As the Internet grows larger and larger, communication ports may change to accommodate the different needs associated with this type of communication."], "jumps": ["P1830", "P1785"]}, {"id": "P1810", "text": ["If one computer sends information, each of the other computers on a network can look to see if they are supposed to read that data."], "jumps": ["P1820", "P1785"]}, {"id": "P1800", "text": ["Computers connected to the Internet are connected through some sort of networking device. Computer programs are designed to allow many different computers to have their I/O ports connected together.", "Computers connected to the Internet are connected through some sort of networking device. Computer programs are designed to allow many different computers to have their I/O ports connected together..."], "jumps": ["P1810", "P1785"]}, {"id": "P1790", "text": ["A network is the connection of a few or many computers together for the purpose of communicating and sharing resources.", "A network is the connection of a few or many computers together for the purpose of communicating and sharing resources.ifferent types of protocols and configurations, however, their main purpose is the same..."], "jumps": ["P1800", "P1785"]}, {"id": "P1785", "text": ["One of the most important uses for the I/O port is the network.", "One of the most important uses for the I/O port is the network. implemented into the 8085 system you are using, is networking. It hasn't been implemented because this trainer does not need to be networked. However, the principle is important.."], "jumps": ["P1790", "P1780"]}, {"id": "P1780", "text": ["In this experiment we will look at the operation of the parallel port. By looking at the parallel port, you will see some of the characteristics that are important regarding input and output."], "jumps": ["P1785", "P1760"]}, {"id": "P1770", "text": ["This table shows the pin-out for an advanced parallel port such as that normally found in personal computers.", "This table shows the pin-out for an advanced parallel port such as that normally found in personal computers.onal computers..ters."], "jumps": ["P1780", "P1760"]}, {"id": "P1760", "text": ["The table below shows the pin-out for an advanced serial port such as that normally found in personal computers.", "The table below shows the pin-out for an advanced serial port such as that normally found in personal computers.rsonal computers."], "jumps": ["P1770", "P1730"]}, {"id": "P1750", "text": ["On some systems it is called the printer port and, on others, LPT. In some situations, certain devices need the speed of the parallel port and the distance of the serial port. Special devices exist that can amplify and boost the signal of the parallel port to allow it to travel longer distances.", "On some systems it is called the printer port and, on others, LPT. In some situations, certain devices need the speed of the parallel port and the distance of the serial port. Special devices exist that can amplify and boost the signal of the parallel port to allow it to travel longer distances..."], "jumps": ["P1760", "P1730"]}, {"id": "P1740", "text": ["The parallel port is faster than a serial port, however, the cable lengths used to connect to a parallel port are shorter. Printers are commonly right next to your computer. For this reason the parallel port is used.", "The parallel port is faster than a serial port, however, the cable lengths used to connect to a parallel port are shorter. Printers are commonly right next to your computer. For this reason the parallel port is used..."], "jumps": ["P1750", "P1730"]}, {"id": "P1730", "text": ["Parallel communication, used mostly with printers, is the sending of  many bits at once. Normally, 8-bits are sent each on their own line. Additional lines are also provided for control and protection.", "Parallel communication, used mostly with printers, is the sending of many bits at once. Normally, 8-bits are sent each on their own line. Additional lines are also provided for control and protection..."], "jumps": ["P1740", "P1710"]}, {"id": "P1720", "text": ["If you were sending 8-bits of data, it would take 8 sends to completely transmit the bits. The advantage of serial communications is that it only requires a few wires, so it's well adapted for telephone.", "If you were sending 8-bits of data, it would take 8 sends to completely transmit the bits. The advantage of serial communications is that it only requires a few wires, so it's well adapted for telephone..."], "jumps": ["P1730", "P1710"]}, {"id": "P1710", "text": ["In some systems more connections are provided for certain types of control and protection. However, in most cases, these types of signals aren't needed. Serial indicates that, at any given time, only one data bit can be sent.", "In some systems more connections are provided for certain types of control and protection. However, in most cases, these types of signals aren't needed. Serial indicates that, at any given time, only one data bit can be sent..."], "jumps": ["P1720", "P1660"]}, {"id": "P1700", "text": ["The name serial and parallel describe the type of communication that occurs. Serial connections require, at a minimum, three connections for two-way communication: send, receive and ground.", "The name serial and parallel describe the type of communication that occurs. Serial connections require, at a minimum, three connections for two-way communication: send, receive and ground..."], "jumps": ["P1710", "P1660"]}, {"id": "P1690", "text": ["Only the most common types of ports have been integrated into the system."], "jumps": ["P1700", "P1660"]}, {"id": "P1680", "text": ["An I/O port allows you to hook up any of these using a standardized protocol, either serial or parallel. There are other types of standard connections, however, but they are not a part of this 8085 system."], "jumps": ["P1690", "P1660"]}, {"id": "P1670", "text": ["The two most common forms of input/output are the serial and parallel ports. Ports are connectors in a system used to interface external devices. External devices could be modems, printers, scanners, etc.", "The two most common forms of input/output are the serial and parallel ports. Ports are connectors in a system used to interface external devices. External devices could be modems, printers, scanners, etc..."], "jumps": ["P1680", "P1660"]}, {"id": "P1660", "text": ["Now that we have looked at individual input and output devices, let's look at some common circuits which employ both methods of  communication, input and output.", "Now that we have looked at individual input and output devices, let's look at some common circuits which employ both methods of communication, input and output."], "jumps": ["P1670", "P1530"]}, {"id": "P1650", "text": ["All areas of the screen are fully programmable. The last seven lines of the display module connections are data lines. These lines are used to input information to the display module."], "jumps": ["P1660", "P1530"]}, {"id": "P1640", "text": ["The display RAM, known as the DD RAM, is used to hold the current information that is being displayed on the LCD screen. There isn't any DD ROM because it isn't necessary."], "jumps": ["P1650", "P1530"]}, {"id": "P1630", "text": ["Data books written about the displays will illustrate the predefined characters, how they are organized, and also indicate which characters can be changed."], "jumps": ["P1640", "P1530"]}, {"id": "P1620", "text": ["This is because the CG memory space is RAM which is erased every time power is removed from the system. The character ROM, known as the CG ROM, holds all the permanent information about the predefined unchangeable characters of the display module.", "This is because the CG memory space is RAM which is erased every time power is removed from the system. The character ROM, known as the CG ROM, holds all the permanent information about the predefined unchangeable characters of the display module..."], "jumps": ["P1630", "P1530"]}, {"id": "P1610", "text": ["Character memory is split into two sections; RAM and ROM. The character RAM, also known as the CG RAM, holds all of the user defined character codes. If you create your own characters you must reload them into the display every time you turn the display module on.", "Character memory is split into two sections; RAM and ROM. The character RAM, also known as the CG RAM, holds all of the user defined character codes. If you create your own characters you must reload them into the display every time you turn the display module on..."], "jumps": ["P1620", "P1530"]}, {"id": "P1600", "text": ["Character memory holds all the information about the displayable characters and the user definable characters. User definable characters means that you can assign them to whatever function you want.", "Character memory holds all the information about the displayable characters and the user definable characters. User definable characters means that you can assign them to whatever function you want..."], "jumps": ["P1610", "P1530"]}, {"id": "P1590", "text": ["The next three connections of the LCD module are control lines. The control lines are the RS (Register Select), R/W (Read/Not Write) and the E (Enable) pins. There are two types of memory within the display unit; character memory and display memory.", "The next three connections of the LCD module are control lines. The control lines are the RS (Register Select), R/W (Read/Not Write) and the E (Enable) pins. There are two types of memory within the display unit; character memory and display memory..."], "jumps": ["P1600", "P1530"]}, {"id": "P1580", "text": ["You can see that this pin is connected to a potentiometer with one side connected to 5 volts and the other to ground. Adjusting the potentiometer will adjust the display intensity."], "jumps": ["P1590", "P1530"]}, {"id": "P1570", "text": ["Vss and Vdd are used to power the LCD module. The capacitor between them is used to protect the circuit from voltages spikes. Vcc is used to set the intensity of the display."], "jumps": ["P1580", "P1530"]}, {"id": "P1560", "text": ["The LCD unit, like the one on the PC130-400 card, has fourteen pins interfacing the LCD unit with the NIDA 8085 microprocessor system."], "jumps": ["P1570", "P1530"]}, {"id": "P1550", "text": ["In the rear portion of the glass, holding the liquid crystal, a reflective surface shines light backwards through the glass illuminating the characters."], "jumps": ["P1560", "P1530"]}, {"id": "P1540", "text": ["Transparent, conductive materials are used to apply voltage to the liquid crystal. When voltage is applied, the crystals in the liquid scatter and do not allow light to pass through the glass."], "jumps": ["P1550", "P1530"]}, {"id": "P1530", "text": ["LCD is an acronym which stands for Liquid Crystal Display, which also describes the technique of how the display works. A liquid crystal display has an actual liquid crystal in between two pieces of glass.", "To get a better understanding of output devices, let's look at the operation of the LCD display of the 8085 microprocessor trainer.", "LCD is an acronym which stands for Liquid Crystal Display, which also describes the technique of how the display works. A liquid crystal display has an actual liquid crystal in between two pieces of glass..."], "jumps": ["P1540", "P1500", "P1530", "P", "PE"]}, {"id": "P1510", "text": ["An output device could be a printer, speakers, or display of some sort. Many microprocessor systems have outputs to monitors or LCD displays like 8085 microprocessor system.", "An output device could be a printer, speakers, or display of some sort. Many microprocessor systems have outputs to monitors or LCD displays like 8085 microprocessor system..m."], "jumps": ["P1520", "P1500"]}, {"id": "P1500", "text": ["While input devices allow you to input information into a microprocessor system, output devices allow you to see or receive feedback from the microprocessor about operations, data, or performance.", "While input devices allow you to input information into a microprocessor system, output devices allow you to see or receive feedback from the microprocessor about operations, data, or performance..."], "jumps": ["P1510", "P1490"]}, {"id": "P1490", "text": ["Now that we have looked at an input device, let's look at an output device."], "jumps": ["P1500", "P1370"]}, {"id": "P1480", "text": ["If the keyboard had consisted of only one key it would have probably been connected directly to the microprocessor and that would have been the entire circuit."], "jumps": ["P1490", "P1370"]}, {"id": "P1470", "text": ["As you can see, there are many sections to even a simple input device. The actual complexity of an input device will depend on its purpose.", "PB6 checks to see if a key has been pressed. PC3 is used to reset the decoding and detection circuit.", "PB0-PB3 are connected to DOA-DOD. PB4 is used to read which set of 16 keys has been pressed and PB5 is used to activate the polling circuit and key detection.", "As you can see, there are many sections to even a simple input device. The actual complexity of an input device will depend on its purpose.. purpose."], "jumps": ["P1480", "P1370", "P1470", "P1460"]}, {"id": "P1440", "text": ["There are 8 connections which are used to control and read the keyboard circuit on the 82C55 from the microprocessor."], "jumps": ["P1450", "P1370"]}, {"id": "P1430", "text": ["It is important to note that all of the interface between the keypad and the microprocessor occurs through the 82C55 port extender as stated earlier."], "jumps": ["P1440", "P1370"]}, {"id": "P1420", "text": ["The second flip-flop, B, indicates which of the two sets of 16 keys have been pressed."], "jumps": ["P1430", "P1370"]}, {"id": "P1410", "text": ["The polling circuit's DOA, DOB, DOC and DOD connections provide information to identify which of the 16 keys has been pressed."], "jumps": ["P1420", "P1370"]}, {"id": "P1400", "text": ["Once the microprocessor has detected the key press, it can then decode the key from an internal look-up table and information from the polling circuit."], "jumps": ["P1410", "P1370"]}, {"id": "P1390", "text": ["After the key is released and the DA signal removed, the flip-flop holds the signal on its output until the microprocessor can read it.  In this sense it works as a temporary memory.", "After the key is released and the DA signal removed, the flip-flop holds the signal on its output until the microprocessor can read it. In this sense it works as a temporary memory."], "jumps": ["P1400", "P1370"]}, {"id": "P1380", "text": ["The circuit is comprised of two D flip-flops. Flip-flop A is used to show that a key has been pressed. This is driven by a signal of the polling circuit, (DA) which indicates that a key press has occurred and been detected by the polling circuit.", "The circuit is comprised of two D flip-flops. Flip-flop A is used to show that a key has been pressed. This is driven by a signal of the polling circuit, (DA) which indicates that a key press has occurred and been detected by the polling circuit..."], "jumps": ["P1390", "P1370"]}, {"id": "P1370", "text": ["DETECTION AND DECODING\nThe key detection and decoding circuit, as shown below, allows the microprocessor to detect and identify a pressed key.", "DETECTION AND DECODING The key detection and decoding circuit, as shown below, allows the microprocessor to detect and identify a pressed key.ey.."], "jumps": ["P1380", "P1250"]}, {"id": "P1360", "text": ["The resistors limit current to protect the circuit."], "jumps": ["P1370", "P1250"]}, {"id": "P1350", "text": ["The HIGH input is used in the key detection circuit to indicate a key from the second set of keys. The resistors connected to the supply voltage provide the high condition required when no key is being pressed."], "jumps": ["P1360", "P1250"]}, {"id": "P1340", "text": ["If a key is in second set is pressed, it is also detected by a low on the corresponding Y input but also causes the NAND gate to go HIGH because one of the inputs is now a low."], "jumps": ["P1350", "P1250"]}, {"id": "P1330", "text": ["If a key from the first set is pressed, it is detected by a low on the corresponding Y input and not on the other side of the diode."], "jumps": ["P1340", "P1250"]}, {"id": "P1320", "text": ["The diodes keep the keys of the first set from affecting the NAND gate. Remember, diodes allow current flow in only one direction. During polling, the circuit places a low on the column being tested."], "jumps": ["P1330", "P1250"]}, {"id": "P1310", "text": ["On the 74C922 IC there are four pins, identified as Y1, Y2, Y3 and Y4. These are the horizontal matrix connections and are connected directly to the first four rows of the keypad. The second set of 16 keys are also connected to Y1, Y2, Y3 and Y4, but through diodes.", "On the 74C922 IC there are four pins, identified as Y1, Y2, Y3 and Y4. These are the horizontal matrix connections and are connected directly to the first four rows of the keypad. The second set of 16 keys are also connected to Y1, Y2, Y3 and Y4, but through diodes..."], "jumps": ["P1320", "P1250"]}, {"id": "P1300", "text": ["Normally the circuit can only detect 16 keys, but, with the use of a NAND gate, four resistors and four diodes, the circuit can detect 32."], "jumps": ["P1310", "P1250"]}, {"id": "P1290", "text": ["This enable signal, when on, indicates that the microprocessor is paying attention to this circuit only. The other side of the port expander has both inputs and outputs. The outputs are attached to a  polling circuit found in the 74C922 which monitors each column of the keypad matrix.", "This enable signal, when on, indicates that the microprocessor is paying attention to this circuit only. The other side of the port expander has both inputs and outputs. The outputs are attached to a polling circuit found in the 74C922 which monitors each column of the keypad matrix."], "jumps": ["P1300", "P1250"]}, {"id": "P1280", "text": ["Attached to the port expander are the RD, WR, RESET and enable lines from the microprocessor and associated circuitry. The enable signal is identical to the ones used to turn on the different types of memory attached to the system.", "Attached to the port expander are the RD, WR, RESET and enable lines from the microprocessor and associated circuitry. The enable signal is identical to the ones used to turn on the different types of memory attached to the system..."], "jumps": ["P1290", "P1250"]}, {"id": "P1270", "text": ["This chip controls both the keypad and the LCD display, however, our discussion at this time is limited to the keypad."], "jumps": ["P1280", "P1250"]}, {"id": "P1260", "text": ["The port expander (82C55) is used to connect devices to a microprocessor system."], "jumps": ["P1270", "P1250"]}, {"id": "P1250", "text": ["CONTROL\nThe control section is comprised of a polling circuit, a port expander and the control lines from the microprocessor.", "CONTROL The control section is comprised of a polling circuit, a port expander and the control lines from the microprocessor..."], "jumps": ["P1260", "P1220"]}, {"id": "P1240", "text": ["By sending a signal through a vertical wire, the horizontal wires can be looked at to see which key in that column was pressed, if any. This brings us to the next circuit, the control."], "jumps": ["P1250", "P1220"]}, {"id": "P1230", "text": ["Pressing any one key connects two wires, one horizontal and one vertical. Each key has its own connection making them unique to one another.", "KEYPAD MATRIX\nThe keypad matrix is an arrangement of horizontal and vertical wires with switches connected across them. The image below shows how the matrix is set up.", "KEYPAD MATRIX The keypad matrix is an arrangement of horizontal and vertical wires with switches connected across them. The image below shows how the matrix is set up."], "jumps": ["P1240", "P1220", "P1200"]}, {"id": "P1210", "text": ["The keypad has been broken down into three main sections: control, detection and decoding, and the keypad matrix. Let's start by looking at the keypad key matrix."], "jumps": ["P1220", "P1200"]}, {"id": "P1200", "text": ["We will begin by looking at a block diagram of the system and, as each section is covered, the blocks will be replaced by their actual circuitry. Below is the block diagram of the keyboard and its associated circuitry.", "We will begin by looking at a block diagram of the system and, as each section is covered, the blocks will be replaced by their actual circuitry. Below is the block diagram of the keyboard and its associated circuitry..."], "jumps": ["P1210", "P1180"]}, {"id": "P1190", "text": ["Input means that the device does not provide any outputs to the user. To better understand the operation of an input device, let's look at the actual circuitry used to control the keypad in the 8085 microprocessor trainer.", "Input means that the device does not provide any outputs to the user. To better understand the operation of an input device, let's look at the actual circuitry used to control the keypad in the 8085 microprocessor trainer..."], "jumps": ["P1200", "P1180"]}, {"id": "P1180", "text": ["Input devices include: a mouse, lightpen, trackball, scanner or keyboard, to name a few. The only \"Input Only\" device on the 8085 microprocessor trainer is the keypad."], "jumps": ["P1190", "P1170"]}, {"id": "P1170", "text": ["Input devices allow information to be sent to the microprocessor or to control it in some fashion. A keyboard, for example, can be used to select options, program new instructions or make modifications to old programs.", "Input devices allow information to be sent to the microprocessor or to control it in some fashion. A keyboard, for example, can be used to select options, program new instructions or make modifications to old programs..."], "jumps": ["P1180", "P1130"]}, {"id": "P1160", "text": ["Let's look at an example of each type of device to understand their communication with the microprocessor."], "jumps": ["P1170", "P1130"]}, {"id": "P1150", "text": ["Examples of fixed I/O are the keypad and display of the Nida 8085 trainer. Removable I/O would be connected to either the parallel or serial port."], "jumps": ["P1160", "P1130"]}, {"id": "P1140", "text": ["Fixed I/O are I/O devices which are permanently connected to the system. Removable I/O are connected to a microprocessor through a special universal connection port. These ports are designed for many different types of I/O.", "Fixed I/O are I/O devices which are permanently connected to the system. Removable I/O are connected to a microprocessor through a special universal connection port. These ports are designed for many different types of I/O.."], "jumps": ["P1150", "P1130"]}, {"id": "P1130", "text": ["I/O devices fall into three categories under two types. They are input devices, output devices and input/output devices. All of these are contained within either fixed or removable I/O."], "jumps": ["P1140", "P1110"]}, {"id": "P1120", "text": ["Now that you understand the basic connection of I/O circuits, which is very similar to memory connecting let's look at different devices connected to the 8085."], "jumps": ["P1130", "P1110"]}, {"id": "P1110", "text": ["These different addresses use different functions of the device. When we look at the operation of the parallel port  I/O device we will see this type of setup. The graphic below shows the connection of a few I/O devices to an 8085 microprocessor.", "These different addresses use different functions of the device. When we look at the operation of the parallel port I/O device we will see this type of setup. The graphic below shows the connection of a few I/O devices to an 8085 microprocessor."], "jumps": ["P1120", "P1040"]}, {"id": "P1100", "text": ["I/O is arranged in the same way as memory chips. Each address combination of the 8085 address lines can be used by a different device. Most devices will take a range of addresses, not just one."], "jumps": ["P1110", "P1040"]}, {"id": "P1090", "text": ["The ALE pin is used for the address latches and the IO/M pin is what selects between I/O and memory. When this pin is high, it indicates that I/O is being accessed.", "The ALE pin is used for the address latches and the IO/M pin is what selects between I/O and memory. When this pin is high, it indicates that I/O is being accessed.d."], "jumps": ["P1100", "P1040"]}, {"id": "P1080", "text": ["Also provided to I/O devices are 8 data lines used to transfer information. The direction of data transfer from I/O to the microprocessor is controlled by the WR and RD pins, just as memory  is.", "Also provided to I/O devices are 8 data lines used to transfer information. The direction of data transfer from I/O to the microprocessor is controlled by the WR and RD pins, just as memory is."], "jumps": ["P1090", "P1040"]}, {"id": "P1070", "text": ["Notice there are only 8 address lines used. The 8085 was designed to allow the use of 256 I/O devices. Most computer systems today don't have a need for more than 100 devices."], "jumps": ["P1080", "P1040"]}, {"id": "P1060", "text": ["Many of these signals are used for memory circuit connections. As far as connecting I/O to the 8085, the connections are  similar. The main difference is how they are accessed through assembly code.", "Many of these signals are used for memory circuit connections. As far as connecting I/O to the 8085, the connections are similar. The main difference is how they are accessed through assembly code. e."], "jumps": ["P1070", "P1040"]}, {"id": "P1050", "text": ["Let's look at the signals necessary for the connection of the I/O to the 8085. The graphic below shows only the signals used to connect the 8085 microprocessor to the I/O."], "jumps": ["P1060", "P1040"]}, {"id": "P1040", "text": ["In the previous lesson we looked at the connection of memory to the 8085 microprocessor. The connection of I/O devices is very similar to the connection of memory.", "HIGH INDICATES IO ACCESS, LOW INDICATES MEMORY"], "jumps": ["P1050", "P1001"]}, {"id": "P1001", "text": ["INTERFACING WITH 8085 MICROPROCESSOR"], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P430", "text": ["Let's begin the lesson on INTERFACING WITH THE 8085 MICROPROCESSOR.........."], "jumps": ["P400"]}, {"id": "P420", "text": ["In this lesson, we are going to look at how I/O (Input/Output) devices are connected to the 8085, the different types of devices and examples of their implementation."], "jumps": ["P430", "P400"]}, {"id": "P410", "text": ["For this reason there are numerous input/output devices available today for many different needs.", "Without input, output or Input/Output devices, a microprocessor system has no way of accepting new information or showing you the information that it holds or has calculated.", "For this reason there are numerous input/output devices available today for many different needs..s.s."], "jumps": ["P420", "P400", "P410", "P300"]}, {"id": "P340", "text": [], "jumps": []}, {"id": "P339", "text": [], "jumps": []}, {"id": "P338", "text": [], "jumps": []}, {"id": "P337", "text": [], "jumps": []}, {"id": "P336", "text": [], "jumps": []}, {"id": "P335", "text": [], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Experiment Card PC130 - let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
