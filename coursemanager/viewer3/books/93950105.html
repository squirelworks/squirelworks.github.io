mal places."], "jumps": []}, {"id": "P2341", "text": [], "jumps": []}, {"id": "P2340", "text": ["Convert the standard fraction 2/3 to a decimal fraction. Round off to three decimal places."], "jumps": ["P2310", "P2345"]}, {"id": "P2330", "text": ["In this case, you would round off to a number of decimal places.  The fraction of 1/3 is:", "In this case, you would round off to a number of decimal places. The fraction of 1/3 is:", "- 9 10 - 9 10 - 40 00"], "jumps": ["P2340", "P2310"]}, {"id": "P2320", "text": ["The remainder never equals zero, the standard fraction of 1/3 is 0.33333333 infinitely.", "- 9 10 - 9 10 - 40 00"], "jumps": ["P2330", "P2310"]}, {"id": "P2310", "text": ["Take a look at the conversion of 1/3.", "Take a look at the conversion of 1/3.......................", "- 9 10 - 9 10 - 40 00"], "jumps": ["P2320", "P2300"]}, {"id": "P2305", "text": ["CONVERTING 1/5 TO DECIMAL - To convert the standard fraction 1/5 to a decimal fraction, you divide 1 by 5."], "jumps": []}, {"id": "P2303", "text": ["1 divided by 5 does not equal .1.", "1 divided by 5 does not equal .1..........................."], "jumps": []}, {"id": "P2302", "text": ["1 divided by 5 does not equal .5.", "1 divided by 5 does not equal .5..........................."], "jumps": []}, {"id": "P2301", "text": [], "jumps": []}, {"id": "P2300", "text": ["Convert the standard fraction 1/5 to a decimal fraction?", "Convert the standard fraction 1/5 to a decimal fraction?..."], "jumps": ["P2220", "P2305"]}, {"id": "P2290", "text": ["Since the remainder is 0, 3/8 converts to 0.375.", "- 24 60 - 56 40 - 40 00"], "jumps": ["P2300", "P2220"]}, {"id": "P2280", "text": ["Divide 8 into 40, you get 5 with no remainder.", "- 24 60 - 56 40 - 40 00"], "jumps": ["P2290", "P2220"]}, {"id": "P2270", "text": ["Add another zero to the dividend and bring it down."], "jumps": ["P2280", "P2220"]}, {"id": "P2260", "text": ["Divide 8 into 60. You get 7 with 4 remaining."], "jumps": ["P2270", "P2220"]}, {"id": "P2250", "tex let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
