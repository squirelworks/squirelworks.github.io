<script>
const book = {"title": "9395B401", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: TIME DIVISION MULTIPLEXING (TDM)d asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe Time Division Multiplexing. w Describe the characteristics of TDM signals.", "w Describe a typical TDM demultiplexer circuit. w Describe the MC14051 circuit used as a TDM demultiplexer.............", "w Describe a typical TDM multiplexer circuit. w Describe the MC14051 circuit used as a TDM multiplexer."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you are taught a new method of signal processing Multiplexing and demultiplexing."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Multiplexing, or MUX for short, is a method of sending more than one information source over ONE wire or channel."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Multiplexing is accomplished in transmitter circuits."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["Demultiplexing, or DEMUX for short, is a method that separates the one signal back into the individual information signals."], "jumps": ["P440", "P410"]}, {"id": "P440", "text": ["Demultiplexing is accomplished in receiver circuits."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["Time Division multiplexing, TDM for short, is a method of MUX and DEMUX that uses TIME as the means of combining and separating  information signals.", "Time Division multiplexing, TDM for short, is a method of MUX and DEMUX that uses TIME as the means of combining and separating information signals."], "jumps": ["P460", "P430"]}, {"id": "P460", "text": ["For example, telephone systems use TDM to convey hundreds of telephone conversations over one channel or wire."], "jumps": ["P470", "P450"]}, {"id": "P470", "text": ["If it wasn't for multiplexing, each call would need a separate wire or channel and considering the number of calls, that would be impossible!"], "jumps": ["P480", "P460"]}, {"id": "P480", "text": ["Let's begin the lesson on TIME DIVISION MULTIPLEXING (TDM)................"], "jumps": ["P460"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1015", "text": ["Time division multiplexing is a signal processing technique that places several information sources on one channel or wire."], "jumps": ["P1020", "P1001"]}, {"id": "P1020", "text": ["Each source is sent and received at different times."], "jumps": ["P1030", "P1015"]}, {"id": "P1030", "text": ["The information sources are lined up like a digital pulse train."], "jumps": ["P1040", "P1015"]}, {"id": "P1040", "text": ["How are the information sources divided in TDM?", "How are the information sources divided in TDM?............"], "jumps": ["P1015"]}, {"id": "P1041", "text": [], "jumps": []}, {"id": "P1042", "text": ["Dividing information signals into frequencies is frequency division multiplexing.  TDM is not frequency division multiplexing.", "Dividing information signals into frequencies is frequency division multiplexing. TDM is not frequency division multiplexing.quency division multiplexing."], "jumps": []}, {"id": "P1043", "text": ["Dividing information signals into phases is done in phase shift keying.  TDM is not phase shift keying.", "Dividing information signals into phases is done in phase shift keying. TDM is not phase shift keying."], "jumps": []}, {"id": "P1050", "text": ["TDM multiplexers and demultiplexers do not use standard modulation techniques like AM or FM."], "jumps": ["P1060", "P1040"]}, {"id": "P1055", "text": ["AM & FM - AM is the modulation technique of changing a carrier frequency's amplitude according to the amplitude of the information signal. Amplitude Modulation. FM is the modulation technique of changing a carrier frequency's frequency according to the amplitude of the information signal. Frequency Modulation."], "jumps": []}, {"id": "P1060", "text": ["However, the information signals can be used to modulate carrier signals before being applied to the multiplexer."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["AM, FM, PCM, Delta, FSK, and PSK signal processing techniques may be used before the information signals are combined."], "jumps": ["P1080", "P1050"]}, {"id": "P1072", "text": ["AM, FM, PCM, Delta, FSK, and PSK signal processing techniques may be used before the information signals are combined."], "jumps": ["P1080", "P1050"]}, {"id": "P1075", "text": ["SIGNAL PROCESSING TECHNIQUES AM - Amplitude Modulation FM - Frequency Modulation PCM - Pulse Code Modulation Delta - Delta Modulation FSK - Frequency Shift Keying PSK - Phase Shift Keying"], "jumps": []}, {"id": "P1080", "text": ["Then in the multiplexer, each information source is transmitted one at a time."], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["First, source 1 is transmitted for a specific period of time."], "jumps": ["P1100", "P1050"]}, {"id": "P1100", "text": ["Then source 2 is transmitted for a specific period of time."], "jumps": ["P1110", "P1050"]}, {"id": "P1110", "text": ["Then source 3 is transmitted for a specific period of time."], "jumps": ["P1120", "P1050"]}, {"id": "P1120", "text": ["Then source 4 is transmitted for a specific period of time.", "The sequence continues; source 1, source 2, source 3, source 4, source 1, etc.", "The sequence continues; source 1, source 2, source 3, source 4, source 1, etc.."], "jumps": ["P1130", "P1050", "P1140"]}, {"id": "P1140", "text": ["In the demultiplexer, the one signal is received from the transmission medium along with TIMING."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["Of course, if any modulation techniques were used in the multiplexer, the signals must be demodulated after separation."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["When source 1 is sent, the demultiplexer connects the signal to the source 1 output."], "jumps": ["P1170", "P1140"]}, {"id": "P1170", "text": ["When source 2 is sent, the demultiplexer connects the signal to the source 2 output"], "jumps": ["P1180", "P1140"]}, {"id": "P1180", "text": ["When source 3 is sent, the demultiplexer connects the signal to the 3 output."], "jumps": ["P1190", "P1140"]}, {"id": "P1190", "text": ["When source 4 is sent, the demultiplexer connects the signal to the source 4 output.", "And the process continues.", "And the process continues.re..............................."], "jumps": ["P1200", "P1140", "P1210"]}, {"id": "P1210", "text": ["As you have seen, the TDM system operates as a switch.", "As you have seen, the TDM system operates as a switch......"], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["Which circuit ensures that if source 1 is transmitted, source 1 is received?"], "jumps": ["P1210"]}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1222", "text": ["The signal processing circuits, if used, modulate and demodulate.  The circuits do not ensure connecting the correct inputs to the correct outputs.", "The signal processing circuits, if used, modulate and demodulate. The circuits do not ensure connecting the correct inputs to the correct outputs."], "jumps": []}, {"id": "P1223", "text": ["The MUX and DEMUX combine and separate the information signals.  They do not generate timing.", "The MUX and DEMUX combine and separate the information signals. They do not generate timing."], "jumps": []}, {"id": "P1230", "text": ["In which part of a TDM system would you find demodulators?", "In which part of a TDM system would you find demodulators?."], "jumps": ["P1220"]}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1232", "text": ["If used, the transmitter circuits would contain modulators.  Demodulators are not used in transmitter circuits.", "If used, the transmitter circuits would contain modulators. Demodulators are not used in transmitter circuits."], "jumps": []}, {"id": "P1233", "text": ["The only types of circuits normally used in a transmission medium is amplifiers and wave shapers.  Demodulators are not used in transmission mediums.", "The only types of circuits normally used in a transmission medium is amplifiers and wave shapers. Demodulators are not used in transmission mediums."], "jumps": []}, {"id": "P1240", "text": ["Let's talk about the characteristics of TDM signals.", "Let's talk about the characteristics of TDM signals........"], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["Let's start with bandwidth.  Remember each information signal, no matter the type, has a bandwidth.", "Let's start with bandwidth. Remember each information signal, no matter the type, has a bandwidth."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["The bandwidth of a TDM system is the highest information signal bandwidth times the number of information sources.", "BW(TDM)=BM (information) x n Where n is the number of information sources."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["It is important to use the highest bandwidth of the information sources.", "BW(TDM) = BM (information) x n ere n is the number of information sources."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["For if a lower bandwidth is used, the system would lose information."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["For example, if a TDM system multiplexed four signals with bandwidths of 4, 8, 16, and 32 kHz, the bandwidth of the system would be 128 kHz.", "BW(TDM) = BM (information) x n = 32 kHz x 4 = 128 kHz"], "jumps": ["P1300", "P1270"]}, {"id": "P1300", "text": ["What is the bandwidth of a TDM system that uses 12 information signals with bandwidths of 10 kHz each?"], "jumps": ["P1270", "P1305"]}, {"id": "P1301", "text": [], "jumps": []}, {"id": "P1302", "text": ["100 kHz is 10 kHz times 10 information sources.  The question states that 12 information sources are used.", "100 kHz is 10 kHz times 10 information sources. The question states that 12 information sources are used."], "jumps": []}, {"id": "P1303", "text": ["10 kHz is the bandwidth of one information source.  TDM circuits multiplex all information sources into one signal and they must be part of the systems bandwidth.", "10 kHz is the bandwidth of one information source. TDM circuits multiplex all information sources into one signal and they must be part of the systems bandwidth."], "jumps": []}, {"id": "P1305", "text": ["BANDWIDTH - The bandwidth of a TDM system is the highest bandwidth of the information sources times the number of information sources."], "jumps": []}, {"id": "P1310", "text": ["The next characteristic is sample rate.", "The next characteristic is sample rate....................."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["The sample rate in TDM systems is how often each of the information signals is sent out from the multiplexer.\n \n                                      Sample Rate = BW(TDM) x 2", "The sample rate in TDM systems is how often each of the information signals is sent out from the multiplexer. Sample Rate = BW(TDM) x 2"], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["The sample rate must be high enough so that the complete signal can be recovered by the demultiplexer."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["The minimum sample rate is the Nyquist rate, or two times the frequency, or bandwidth, of the TDM system."], "jumps": ["P1350", "P1320"]}, {"id": "P1350", "text": ["Remember, the bandwidth of the TDM system is the highest bandwidth of the information signals times the number of information signals.   \n                                   BW(TDM) = BW(information) x n\n                                       Sample Rate = BW(TDM) x 2", "Remember, the bandwidth of the TDM system is the highest bandwidth of the information signals times the number of information signals. BW(TDM) = BW(information) x n Sample Rate = BW(TDM) x 2"], "jumps": ["P1360", "P1320"]}, {"id": "P1360", "text": ["What is the minimum sample rate for a TDM system that uses 5 information sources each with a bandwidth of 5 kHz?"], "jumps": ["P1320", "P1365"]}, {"id": "P1361", "text": [], "jumps": []}, {"id": "P1362", "text": ["5 kHz is the bandwidth of one information source.  The sample rate must be higher than that.", "5 kHz is the bandwidth of one information source. The sample rate must be higher than that."], "jumps": []}, {"id": "P1363", "text": ["25 kHz is the bandwidth of the TDM system.  The sample rate must be higher than that.", "25 kHz is the bandwidth of the TDM system. The sample rate must be higher than that."], "jumps": []}, {"id": "P1365", "text": ["BW(TDM)=BW (information) x n Sample Rate = 2 x BW(TDM))))))))))))information sources.", "SAMPLE RATE - The minimum sample rate is the Nyquist rate and is twice the bandwidth of the TDM system."], "jumps": []}, {"id": "P1370", "text": ["The next characteristic is noise.", "The next characteristic is noise..........................."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["Noise, unwanted amplitude variations, effect TDM systems.", "Noise, unwanted amplitude variations, effect TDM systems..."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["Channel noise is the noise that is in each information signal."], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["For example, if the information sources are amplitude modulated, noise that effects AM signals effects the TDM signal."], "jumps": ["P1410", "P1380"]}, {"id": "P1410", "text": ["Using FM or digital signal processing before multiplexing reduces channel noise."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["Multiplexing noise is caused by time dividing the information signals."], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["It is very similar to quantization noise in analog to digital conversion."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["And as in pulse code modulation, quantization noise or multiplexing noise is reduce by filtering."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["Synchronization is important in TDM system to ensure proper demultiplexing."], "jumps": ["P1460", "P1430"]}, {"id": "P1460", "text": ["There are many methods that can synchronizes TDM systems but,  generally a sync pulse is used.", "There are many methods that can synchronizes TDM systems but, generally a sync pulse is used."], "jumps": ["P1470", "P1450"]}, {"id": "P1470", "text": ["The sync pulse is the information signal for the first channel of the TDM system."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["The resultant TDM signal, a frame, consists of a sync pulse and information signals."], "jumps": ["P1490", "P1460"]}, {"id": "P1490", "text": ["Using a sync pulse that is completely different form an information signal source ensures that the demultiplexer circuits can detect the pulse."], "jumps": ["P1500", "P1480"]}, {"id": "P1500", "text": ["And once the pulse is detected, the demultiplexer circuits are set up to connect the TDM signal to the proper output lines at the proper times."], "jumps": ["P1510", "P1480"]}, {"id": "P1510", "text": ["The last characteristics is crosstalk.", "The last characteristics is crosstalk......................"], "jumps": ["P1520", "P1480"]}, {"id": "P1520", "text": ["Crosstalk is the receiving of two channels of information on one output channels."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["You have probably heard crosstalk when making a long distance telephone call."], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["You hear another conversation besides yours!"], "jumps": ["P1550", "P1520"]}, {"id": "P1550", "text": ["Crosstalk is caused by one, the transmission medium spreading out the information signals causing overlaps."], "jumps": ["P1560", "P1520"]}, {"id": "P1560", "text": ["Then the timing of the demultiplexer causes part of one signal to demultiplex to the wrong output line."], "jumps": ["P1570", "P1550"]}, {"id": "P1570", "text": ["And two, timing errors in the multiplexer or demultiplexer."], "jumps": ["P1580", "P1550"]}, {"id": "P1580", "text": ["Crosstalk is minimized by using accurate timing circuits and guard times."], "jumps": ["P1590", "P1550"]}, {"id": "P1590", "text": ["Guard times are periods of time that no information is transmitted."], "jumps": ["P1600", "P1550"]}, {"id": "P1600", "text": ["In this way, the spreading of the signals in the transmission medium or timing errors do not cause the signal sources to overlap."], "jumps": ["P1610", "P1590"]}, {"id": "P1610", "text": ["Guard time is used to _______", "Guard time is used to _______yped.........................."], "jumps": ["P1590"]}, {"id": "P1611", "text": [], "jumps": []}, {"id": "P1612", "text": ["Sync pulses are used to synchronize TDM systems.  Guard time is something different.", "Sync pulses are used to synchronize TDM systems. Guard time is something different."], "jumps": []}, {"id": "P1613", "text": ["The bandwidth of a TDM system is the result of the bandwidth of the information sources.  Guard time is used to separate the bandwidth of signals but, guard time is not used to set up bandwidths.", "The bandwidth of a TDM system is the result of the bandwidth of the information sources. Guard time is used to separate the bandwidth of signals but, guard time is not used to set up bandwidths."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on TDM Signals.", "This completes the information on TDM Signals.TITLE........"], "jumps": ["P1610"]}, {"id": "P1920", "text": ["1.  Time Division Multiplexing is a signal processing technique            that combines several information sources into one signal              using time.", "1. Time Division Multiplexing is a signal processing technique that combines several information sources into one signal using time."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  TDM systems are like a switch. Different inputs are switched to\n      the different outputs one at a time.", "2. TDM systems are like a switch. Different inputs are switched to the different outputs one at a time.urces into one signal using time."], "jumps": ["P1940", "P1001"]}, {"id": "P1940", "text": ["3.  The bandwidth of a TDM system is the highest bandwidth of           an information source times the number of sources.", "3. The bandwidth of a TDM system is the highest bandwidth of an information source times the number of sources."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  The minimum sample rate is the Nyquist rate or twice the                bandwidth of the TDM system.", "4. The minimum sample rate is the Nyquist rate or twice the bandwidth of the TDM system.", "Sample Rate = BW(TDM) x 2 x n ere n is the number of information sources."], "jumps": ["P1960", "P1930"]}, {"id": "P1960", "text": ["5.  TDM systems have channel noise or multiplexing noise.", "5. TDM systems have channel noise or multiplexing noise..."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  Sync pulses are used to set up timing in the demultiplexer              circuits.", "6. Sync pulses are used to set up timing in the demultiplexer circuits."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7.  Crosstalk is the receiving of two channels of information on           one output channel.", "7. Crosstalk is the receiving of two channels of information on one output channel."], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["8.  Crosstalk is reduced by guard times.", "8. Crosstalk is reduced by guard times...................."], "jumps": ["P1999", "P1980"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1990"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2015", "text": ["Typical TDM multiplexers have three major circuits.", "Typical TDM multiplexers have three major circuits........."], "jumps": ["P2020", "P2001"]}, {"id": "P2020", "text": ["The multiplexer circuit is similar to a data selector chip."], "jumps": ["P2030", "P2015"]}, {"id": "P2030", "text": ["The information signals are applied to the inputs."], "jumps": ["P2040", "P2015"]}, {"id": "P2040", "text": ["The number of information inputs to the multiplexer depend on the type of chip used and the number of information sources."], "jumps": ["P2050", "P2015"]}, {"id": "P2050", "text": ["The signal generated in the control section is used to select which of the information inputs is connected to the output."], "jumps": ["P2060", "P2015"]}, {"id": "P2060", "text": ["The control section is normally a counter IC.  The Q outputs used depend on the number of information inputs to the multiplexer chip.", "The control section is normally a counter IC. The Q outputs used depend on the number of information inputs to the multiplexer chip."], "jumps": ["P2070", "P2015"]}, {"id": "P2070", "text": ["The control section is driven by a clock."], "jumps": ["P2080", "P2015"]}, {"id": "P2080", "text": ["The clock section uses any type of oscillator circuit."], "jumps": ["P2090", "P2015"]}, {"id": "P2090", "text": ["The frequency of the clock is set to the required sample rate."], "jumps": ["P2100", "P2015"]}, {"id": "P2100", "text": ["In other words, the clock frequency, or sample rate, drives the counter."], "jumps": ["P2110", "P2015"]}, {"id": "P2110", "text": ["The Q outputs of the counter count up and are used to connect an information input to output one at a time -- time division multiplexing."], "jumps": ["P2120", "P2015"]}, {"id": "P2120", "text": ["Which circuit controls which input is connected to the output?"], "jumps": ["P2015"]}, {"id": "P2121", "text": [], "jumps": []}, {"id": "P2122", "text": ["The multiplexer circuit connects one input to the output as controlled by an external input.  It does not control the external input.", "The multiplexer circuit connects one input to the output as controlled by an external input. It does not control the external input."], "jumps": []}, {"id": "P2123", "text": ["The clock circuit drives the control circuit at the sample rate.  It does not control which input is applied to the output in the multiplexer.", "The clock circuit drives the control circuit at the sample rate. It does not control which input is applied to the output in the multiplexer."], "jumps": []}, {"id": "P2130", "text": ["Which circuit sets the sample rate?", "Which circuit sets the sample rate?........................"], "jumps": ["P2120"]}, {"id": "P2131", "text": [], "jumps": []}, {"id": "P2132", "text": ["The multiplexer connects one input to the output.  It does not have a built in timing circuit that would be set to the sample rate.", "The multiplexer connects one input to the output. It does not have a built in timing circuit that would be set to the sample rate."], "jumps": []}, {"id": "P2133", "text": ["The control section is normally a counter that controls the selection of inputs to the output.  A counter needs external timing signals.", "The control section is normally a counter that controls the selection of inputs to the output. A counter needs external timing signals."], "jumps": ["P19"]}, {"id": "P2140", "text": ["There are many types of multiplexer chips that can be used in TDM systems."], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["The MC14051 is a typical example and is used in the experiments."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["The chip is able to multiplex eight different inputs, X0 through X7."], "jumps": ["P2170", "P2140"]}, {"id": "P2170", "text": ["The output is on pin 3, X."], "jumps": ["P2180", "P2140"]}, {"id": "P2180", "text": ["The control inputs are A, B, and C."], "jumps": ["P2190", "P2140"]}, {"id": "P2190", "text": ["Note that three control inputs are required to select one of eight inputs."], "jumps": ["P2200", "P2140"]}, {"id": "P2200", "text": ["If the control inputs are 000 (a 0), the X0 input is connected to the output."], "jumps": ["P2210", "P2140"]}, {"id": "P2210", "text": ["If the control inputs are 001 (a 1), the X1 input is connected to the output."], "jumps": ["P2220", "P2140"]}, {"id": "P2220", "text": ["The selection continues up to a control input of 111 (a 7) where the X7 input is connected to the output."], "jumps": ["P2230", "P2140"]}, {"id": "P2230", "text": ["The binary number on the A, B, and C inputs control which information input is connected to the output."], "jumps": ["P2240", "P2140"]}, {"id": "P2240", "text": ["Remember, the A, B, and C inputs to the multiplexer are from a counter that is driven by a clock at the sample rate."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["The inhibit pin of the multiplexer is used to disable the chip."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["To operate the chip, pin 6 is held LOW.  To disable the chip, pin 6 is held HIGH.", "To operate the chip, pin 6 is held LOW. To disable the chip, pin 6 is held HIGH."], "jumps": ["P2270", "P2240"]}, {"id": "P2270", "text": ["One use of inhibit is to set up guard times as you will see in the experiments."], "jumps": ["P2280", "P2240"]}, {"id": "P2280", "text": ["Pins 7, 8, and 16 are the power connections."], "jumps": ["P2290", "P2240"]}, {"id": "P2290", "text": ["Pin 16 connects to a positive voltage, Pin 8 is ground, and pin 7 connects to a negative voltage if used or grounded if not."], "jumps": ["P2300", "P2240"]}, {"id": "P2300", "text": ["As you can see, a TDM multiplexer circuit is not complex.", "As you can see, a TDM multiplexer circuit is not complex..."], "jumps": ["P2310", "P2240"]}, {"id": "P2310", "text": ["If the MC14051 multiplexer chip has a 101 on the A, B, and C inputs, which information input connects to the output?", "If the MC14051 multiplexer chip has a 101 on the A, B, and C inputs, which information input connects to the output? Incorrect1: X4"], "jumps": ["P2300"]}, {"id": "P2311", "text": [], "jumps": []}, {"id": "P2312", "text": ["The X4 input requires a 100 input on A, B, and C.", "The X4 input requires a 100 input on A, B, and C..........."], "jumps": []}, {"id": "P2313", "text": ["The X6 input requires a 110 input on A, B, and C.", "The X6 input requires a 110 input on A, B, and C..........."], "jumps": []}, {"id": "P2320", "text": ["If the MC14051 multiplexer chip has a 110 on the A, B, and C inputs and a HIGH on pin 6, which information input connects to the output?"], "jumps": ["P2310"]}, {"id": "P2321", "text": [], "jumps": []}, {"id": "P2322", "text": ["First, a 110 on the A, B, and C inputs select X6 not X5.  Second,  with pin 6 HIGH, the chip is disabled.", "First, a 110 on the A, B, and C inputs select X6 not X5. Second, with pin 6 HIGH, the chip is disabled."], "jumps": []}, {"id": "P2323", "text": ["Which 110 on the A, B, and C inputs, X6 is selected but, pin 6 is HIGH and disables the chip."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on TDM MULTIPLEXER CIRCUITS.", "This completes the information on TDM MULTIPLEXER CIRCUITS..."], "jumps": ["P2320"]}, {"id": "P2920", "text": ["1.  TDM multiplexer's have three major circuits.", "1. TDM multiplexer's have three major circuits.ne here...."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2.  The multiplexer is used to connect one of the inputs to the             output.", "2. The multiplexer is used to connect one of the inputs to the output."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3.  The input selected is controlled by the Q outputs of a counter        that forms the control circuit.", "3. The input selected is controlled by the Q outputs of a counter that forms the control circuit."], "jumps": ["P2950", "P2920"]}, {"id": "P2950", "text": ["4.  The counter is driven by a clock that is set to the sample rate.", "4. The counter is driven by a clock that is set to the sample rate."], "jumps": ["P2960", "P2920"]}, {"id": "P2960", "text": ["5.  A typical example of a multiplexer is the MC14051 chip.", "5. A typical example of a multiplexer is the MC14051 chip."], "jumps": ["P2970", "P2920"]}, {"id": "P2970", "text": ["6.  The MC14051 has eight information inputs and three control           inputs.", "6. The MC14051 has eight information inputs and three control inputs."], "jumps": ["P2980", "P2960"]}, {"id": "P2980", "text": ["7.  Pin 6 in the inhibit. It must be LOW for the chip to operate.", "7. Pin 6 in the inhibit. It must be LOW for the chip to operate."], "jumps": ["P2999", "P2960"]}, {"id": "P2999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2960"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3015", "text": ["Typical TDM demultiplexers have four major circuits.", "Typical TDM demultiplexers have four major circuits........"], "jumps": ["P3020", "P3001"]}, {"id": "P3020", "text": ["The demultiplexer receives the TDM signal."], "jumps": ["P3030", "P3015"]}, {"id": "P3030", "text": ["The TDM input is then connected to one of the outputs according to the signal from the control section."], "jumps": ["P3015"]}, {"id": "P3040", "text": ["The control section is normally a counter IC.  The Q outputs used depend on the number of information outputs in the demultiplexer chip.", "The control section is normally a counter IC. The Q outputs used depend on the number of information outputs in the demultiplexer chip."], "jumps": ["P3015"]}, {"id": "P3050", "text": ["The control section is driven by a clock and reset by the sync detector."], "jumps": ["P3015"]}, {"id": "P3060", "text": ["The clock section uses any type of oscillator circuit."], "jumps": ["P3015"]}, {"id": "P3070", "text": ["The frequency of the clock is set to the same frequency used in  the multiplexer.", "The frequency of the clock is set to the same frequency used in the multiplexer."], "jumps": ["P3015"]}, {"id": "P3080", "text": ["The sync detector is a circuit that recognizes the sync pulse."], "jumps": ["P3015"]}, {"id": "P3090", "text": ["When a sync pulse is received, the detector applies a pulse to the control circuit that resets the counter, initializing the circuit."], "jumps": ["P3015"]}, {"id": "P3100", "text": ["In other words, the clock frequency, or sample rate, drives the counter."], "jumps": ["P3015"]}, {"id": "P3110", "text": ["The Q outputs of the counter count up and are used to connect the TDM signal to the outputs one at a time - - time division demultiplexing."], "jumps": ["P3100"]}, {"id": "P3120", "text": ["When the sync pulse is received, the sync detector resets the counter, starting the counting over."], "jumps": ["P3100"]}, {"id": "P3130", "text": ["Which circuit controls which output is connected to the TDM input?"], "jumps": ["P3100"]}, {"id": "P3131", "text": [], "jumps": []}, {"id ency. It does not initialize the circuit."], "jumps": []}, {"id": "P3150", "text": ["There are many types of demultiplexer chips that can be used in TDM systems."], "jumps": ["P3160", "P3140"]}, {"id": "P3160", "text": ["The MC14051 is a typical example.  Yes, it is the same chip used in TDM multiplexers.", "The MC14051 is a typical example. Yes, it is the same chip used in TDM multiplexers."], "jumps": ["P3170", "P3150"]}, {"id": "P3170", "text": ["The chip can be used as a multiplexer or demultiplexer."], "jumps": ["P3180", "P3150"]}, {"id": "P3180", "text": ["The demultiplexer receives one input, a TDM signal."], "jumps": ["P3190", "P3150"]}, {"id": "P3190", "text": ["And demultiplexes the signal to eight different outputs."], "jumps": ["P3200", "P3150"]}, {"id": "P3200", "text": ["The control inputs are A, B, and C."], "jumps": ["P3210", "P3150"]}, {"id": "P3210", "text": ["Again, three control inputs are required to select one of eight outputs."], "jumps": ["P3220", "P3150"]}, {"id": "P3220", "text": ["If the control inputs are 000 (a 0), the TDM input is connected to the X0 output."], "jumps": ["P3230", "P3150"]}, {"id": "P3230", "text": ["If the control inputs are 001 (a 1), the TDM input is connected to the X1 output.", "If the control inputs are 001 (a 1), the TDM input is connected to the X1 output..ut."], "jumps": ["P3240", "P3150"]}, {"id": "P3240", "text": ["The selection continues up to a control input of 111 (a 7) where the TDM input is connected to the X7 output."], "jumps": ["P3250", "P3150"]}, {"id": "P3250", "text": ["The binary number on the A, B, and C inputs control which output the TDM input is connected to."], "jumps": ["P3260", "P3150"]}, {"id": "P3260", "text": ["Remember, the A, B, and C inputs to the demultiplexer are from a counter that is driven by a clock at the sample rate and reset by the sync detector."], "jumps": ["P3270", "P3250"]}, {"id": "P3270", "text": ["The inhibit pin of the multiplexer is used to disable the chip.  The sign let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
