const book = {"title": "9395T612", "pages": [{"id": "P30000", "text": ["There is no specific help provided for this question. The question is based on accumulated knowledge and cannot be referenced to a singular piece of information. It is recommended that you review all of the material covered in objective:", "??pacitive/Inductive Reactance and LCR Circuits Troubleshooting"], "jumps": []}, {"id": "PQINFO", "text": ["Page # Test# Question# HelpPage # 10210 1 110 1050 10211 1 111 1060 10212 1 112 1060 10213 1 113 1070 10214 1 114 1030 10215 1 115 1070 10216 1 116 1050 10217 1 117 1020 10218 1 118 1660 10219 1 119 1290 10220 1 120 1750 10221 1 121 1760 10222 1 122 1730 10223 1 123 1440 10224 1 124 1080 10225 1 125 1350 10226 1 126 1190 10227 1 127 1360 10228 2 128 30000 10229 2 129 30000 10230 3 130 30000 10231 3 131 30000 10232 3 132 30000 10233 3 133 30000 10234 3 134 30000 10235 3 135 30000 10236 3 136 30000 10237 3 137 30000 10238 3 138 30000 10239 3 139 30000 10240 10241 10242 10243 10244 10245 10246 10247 10248 10249", "Page # Test# Question# HelpPage # 10210 1 110 1050 10211 1 111 1060 10212 1 112 1060 10213 1 113 1070 10214 1 114 1030 10215 1 115 1070 10216 1 116 1050 10217 1 117 1020 10218 1 118 1660 10219 1 119 1290 10220 1 120 1750 10221 1 121 1760 10222 1 122 1730 10223 1 123 1440 10224 1 124 1080 10225 1 125 1350 10226 1 126 1190 10227 1 127 1360"], "jumps": []}, {"id": "PINFO", "text": ["07-20-01 Converted from sty to tbk. frieda 07-20-01 Text and Branching. frieda 08-14-01 Graphics John Ayala 01-14-02 Converted to Phase II format. jay", "07-20-01 Converted from sty to tbk. frieda 07-20-01 Text and Branching. frieda 08-14-01 Graphics John Ayala 01-14-02 Converted to Phase II format. jay 02-08-02 Checked for convertion errors. John Ayala 04-30-02 Review - lisa 03-23-04 P1040, capped \"Packet\". P1570, brought next arrow to front so it is not covered by graphic. -Penny"], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is 40%. Do you want to __________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10227", "text": ["Which is not an example of combined systems switching?"], "jumps": []}, {"id": "P10226", "text": ["In _______ switching, a defined path exists between the originator and the recipient prior to any transmission of information."], "jumps": []}, {"id": "P10225", "text": ["The first method devised for non-voice communications was message switching and has been replaced by _______"], "jumps": []}, {"id": "P10224", "text": ["The first switching device for telecommunications was called the _______"], "jumps": []}, {"id": "P10223", "text": ["It provides a complete physical path between source and receiver.", "It is well suited for interactive communications.", "The entire packet is received and tested before re-transmission.", "It is a completely error-free form of communication."], "jumps": []}, {"id": "P10222", "text": ["The latest, fastest, and most promising of switching systems is _______"], "jumps": []}, {"id": "P10221", "text": ["cannot process video or image information."], "jumps": []}, {"id": "P10220", "text": ["Which switching system has a fixed packet size?"], "jumps": []}, {"id": "P10219", "text": ["Smaller blocks can be stored in memory rather than on a hard disk.", "Which is not a benefit of packet switching?", "It has a pre-determined path from source to receiver.", "It is well suited for interactive traffic.", "The first packet of a multi-packet transmission can be re-transmitted before subsequent packets have arrived."], "jumps": []}, {"id": "P10218", "text": ["Which ESS was the first complete electronic switching system?"], "jumps": []}, {"id": "P10217", "text": ["In the early days of telephone, switching operations were performed by humans using a _______."], "jumps": []}, {"id": "P10216", "text": ["the process of transmitting data in blocks that is referred to as a forward and store network.", "The International Telecommunications Union defines switching as _______", "the establishment, on demand, of an individual connection from a desired inlet to a desired outlet within a set of inlets and outlets for as long as is required for the transfer of information.", "making a complete circuit path from one end to the other prior to the transmission of any information.", "the first complete electronic exchange using digital technology."], "jumps": []}, {"id": "P10215", "text": ["The terms _______ and _______ can be used interchangeably."], "jumps": []}, {"id": "P10214", "text": ["To meet the telecommunication demands of modern society.", "Which is not a reason why automated switching networks were devised?", "To avoid using both electronic and electromechanical forms of switching."], "jumps": []}, {"id": "P10213", "text": ["the means by which information (data) is sent from one computer to another in the form of blocks.", "the physical locations of the telecommunications switching devices.", "used when no physical connection exists prior to the first transmission of data.", "like a keyboard matrix of vertical and horizontal wires."], "jumps": []}, {"id": "P10212", "text": ["Which is not considered a switching office and thereby a routing point in the telecommunications network?"], "jumps": []}, {"id": "P10211", "text": ["locations to receive incoming traffic and ensure it connects to its destination or another appropriate switching office en route to its destination.", "Switching offices are best described as _______", "centralized points for control and administrative tasks.", "ports in the telecommunications system exclusively for maintenance purposes."], "jumps": []}, {"id": "P10210", "text": ["Switching in the telecommunications field is described as _______", "making a physical connection between two points.", "connecting one telephone number to any other telephone number, at any time, and maintaining that connection until one of the parties hangs up.", "making a virtual connection between two points."], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1990"]}, {"id": "P1990", "text": ["10. Asynchronous Transfer Mode switching uses cell relay technology and transmits fixed-length packets called cells. Each cell has two fields called header and information fields. The header field is 5 bytes in length and the information field is 48 bytes. It is used for voice, data, or video information.."], "jumps": ["P1999", "P1980"]}, {"id": "P1980", "text": ["9. Virtual cut-through is a form of packet switching that begins re-transmission as soon as the header is received."], "jumps": ["P1990", "P1970"]}, {"id": "P1970", "text": ["8. Time-division switching, (a variation of packet switching), examines each input line to the exchange on a pre- determined rotational basis and packets are immediately re- transmitted. Re-transmission often takes place as soon as the header of a packet is read."], "jumps": ["P1980", "P1960"]}, {"id": "P1960", "text": ["7. The Variations of switching are as follows:............", "1) fast-connect switching 2) time-division switching 3) virtual cut-through switching, 5 electronic switching systems - (No. 1 through No. 5 ESS),and Asynchronous Transfer Mode (ATM) switching.............................s Transfer Mode (ATM) switching.uit switched in nature.", "VARIATIONS OF SWITCHING THREE COMBINED SYSTEMSS", "6. The benefits of packet over message switching are: 1) Blocks can be stored in memory instead of a hard disk. 2) Transmission is suited for interactive traffic. 3) Multi-pack transmission feature allows a packet to be transmitted to an exchange office before that office has re- transmitted its previously received packet......."], "jumps": ["P1970", "P1950", "P1960", "P1940"]}, {"id": "P1940", "text": ["4. In circuit switching, a complete circuit path is made from one end to the other prior to the transmission of any information. 5. Message switching was the first generation of switching designed for non-voice communications (data) and has been replaced by packet switching.", "Data 1 = data transmitted from T1 to T2 Data 2 = data transmitted from T2 to T1 T1, T2, T3 = terminate 1, 2, 3 N1, N2, N3 = circuit switching nodes 1, 2, 3", "T1,T2,T3 = terminals 1,2,3 M1,M2 = messages 1,2 N1,N2,N3 = message switching nodes 1,2,3"], "jumps": ["P1950", "P1930"]}, {"id": "P1930", "text": ["2. The first switching device for telecommunications was the Strowger switch. 3. The four major methods of switching are: circuit switching, message switching, packet switching, and combined systems....", "1. The International Telecommunications Union defines switching as: The establishment, on demand, of an individual connection from a desired inlet to a desired outlet within a set of inlets and outlets for as long as is required for the transfer of information..."], "jumps": ["P1940", "P1920", "P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on NETWORK SWITCHING........"], "jumps": ["P1001", "P1900"]}, {"id": "P1900", "text": ["In 1991, the ATM governing body (ATM Forum) agreed upon ATM fiber optic transmission rates of 45,100, and 155 Mbit/s. Some ATM transmission rates are running at 622 Mbit/s now."], "jumps": ["P1910", "P1890"]}, {"id": "P1890", "text": ["ATM was designed for the fiber optic medium but it can be used over twisted pair transmission lines at speeds as fast as 51.84 Mbit/s. Rates of 25.92 Mbit/s and 12.96 Mbit/s are also used.", "ATM service and equipment promises to provide the flexibility to support high bandwidth multimedia applications because of its high data transfer speeds, small cell sizes, and rapid switching of data between source and destination..."], "jumps": ["P1900", "P1882", "P1890", "P1880"]}, {"id": "P1880", "text": ["The Disadvantages are as follows:..........................", "1) overhead associated with cell header. 2) congestion may cause cell losses. 3) complex mechanisms are needed to achieve quality of service. service.iously packet or circuit switched in nature.s that were previously packet or circuit switched in nature.switched in nature."], "jumps": ["P1890", "P1872"]}, {"id": "P1872", "text": ["The Advantages for both circuit-switching and packet-switching are as follows:", "1) simple routing due to connection orientated technology. 2) delay critical applications can be given higher priority than non- delay critical applications. 3) one transport network capable of carrying applications that were previously packet or circuit switched in nature."], "jumps": ["P1880", "P1870"]}, {"id": "P1870", "text": ["The result is the bandwidth guarantee of circuit switching combined with the high efficiency of packet switching."], "jumps": ["P1872", "P1860"]}, {"id": "P1860", "text": ["ATM accomplishes this because its cell-switching technology combines the best advantages of both circuit-switching (for constant bit rate services such as voice and image) and packet-switching (for variable bit rate services such as data and full motion video) technologies..."], "jumps": ["P1870", "P1840"]}, {"id": "P1850", "text": ["Data transfers can tolerate some delay but must arrive at their destination exactly as they left their source. The most significant benefit of ATM is its uniform handling of services, allowing one network to meet the needs of many broadband services..."], "jumps": ["P1860", "P1840"]}, {"id": "P1840", "text": ["ATM can handle both short bursty transmissions and more streams of data such as file transfers. Voice and video transfers are different from data transfers in that voice and video can tolerate some losses and quality degradation but they must be moved in real-time..."], "jumps": ["P1850", "P1780"]}, {"id": "P1830", "text": ["All broadband transmissions (whether audio, data, imaging or video) are divided into a series of cells and routed across an ATM network consisting of links connected by ATM switches. Each ATM link comprises a constant stream of ATM cell slots into which transmissions are placed or left idle, if unused..."], "jumps": ["P1840", "P1780"]}, {"id": "P1820", "text": ["The transport layer controls end-to-end integrity of data transmission. Six other layers exist as a part of a telecommunications protocol hierarchy. Each layer is assigned a specific task/s that must be performed at a specified time during any communication activity. This subject is covered in the Information Systems lesson...."], "jumps": ["P1830", "P1780"]}, {"id": "P1810", "text": ["After the information has been transferred, the resources are released which permits the cells to arrive at the destination in the order they were sent. Cell delivery to the destination is not guaranteed. ATM links do not provide error or flow control. These functions must be provided by the transport layer..."], "jumps": ["P1820", "P1780"]}, {"id": "P1800", "text": ["ATM is connection orientated in that before information is transferred from a terminal to the network, a set-up phase must first reserve the necessary resources. Once the connection is established, ATM cells are self-routing because each cell contains fields identifying its connection to the cell to which it belongs....."], "jumps": ["P1810", "P1780"]}, {"id": "P1790", "text": ["Because the cell is a fixed length, the switching and buffering of cells can be implemented in hardware (as opposed to software for packet switching). This allows for much faster switching than any switching software could achieve...", "By using small cells on high speed links, the links can quickly respond to changes in load e.g. switch from many voice cells to many video cells then to many data cells as the need to service voice, video and data interfaces changes..."], "jumps": ["P1800", "P1780", "P1790", "P1750"]}, {"id": "P1770", "text": ["Cells are very small chunks of data with no error checking. They are designed to operate over highly reliable optical fiber links with virtually no errors."], "jumps": ["P1780", "P1750"]}, {"id": "P1760", "text": ["The header field, 5 bytes in length, contains addressing and flow controls. The information field, 48 bytes in length, can be digitized voice, data, video, or image. Digital data from multiple sources operating at multiple rates is spliced on a cell-by-cell basis into the ATM stream and the cell types can be mixed..."], "jumps": ["P1770", "P1750"]}, {"id": "P1750", "text": ["Traditional packet transmissions have limits on their upper size limit but can vary. ATM transmits fixed-length packets called cells. Each cell has two fields, the header field and the information field...", "ATM is designed to be carried on the Synchronous Optical Network (SONET). SONET is a transmission system technology for use on fiber optic cable networks. It is not a service directly provided to organizations, but the technology that is the foundation for future communications services...."], "jumps": ["P1760", "P1740", "P1750", "P1730"]}, {"id": "P1730", "text": ["The latest, fastest and most promising switching technology is called Asynchronous Transfer Mode or ATM. It is comprised of a cell relay technology that includes high-speed multiplexing and switching for voice, data, and video in an integrated manner at a wide range of different bit rates...", "Each day, the demand for voice and data communication grows, and existing systems must be upgraded to meet the demand, so the likelihood of a No. 6 ESS should not be doubted."], "jumps": ["P1740", "P1720", "P1730", "P1700"]}, {"id": "P1710", "text": ["Most of the hardware uses specially designed LSI and VLSI (Very Large Scale Integration) devices that are capable of handling up to 500 volts. Advanced software permits new calling features like call forwarding, caller ID, three-way calling, speed calling, et al..."], "jumps": ["P1720", "P1700"]}, {"id": "P1700", "text": ["The latest innovation from Bell Labs is No. 5 ESS. It integrates the newest logic technology with fiber optics and advanced software. No. 5 ESS is well suited for large metropolitan areas and rural communities. It is designed to be used as a fully remote-controlled unit. It can serve as many as 100,000 subscribers.."], "jumps": ["P1710", "P1690"]}, {"id": "P1690", "text": ["It uses a combination of time-division multiplexing and space-division multiplexing. Space division multiplexing is simply the combining of physically separate signals into a bundled cable. It combines subscriber loop and trunk circuits..."], "jumps": ["P1700", "P1680"]}, {"id": "P1684", "text": ["No. 3 ESS uses both electromechanical and electronic devices for switching and computer control circuitry."], "jumps": []}, {"id": "P1683", "text": ["No. 2 ESS uses both electromechanical and electronic devices for switching and computer control circuitry."], "jumps": []}, {"id": "P1682", "text": ["No. 1 ESS uses both electromechanical and electronic devices for switching and computer control circuitry."], "jumps": []}, {"id": "P1681", "text": [], "jumps": []}, {"id": "P1680", "text": ["Which switching system was the first to use digital technology for switching and computer control circuitry?"], "jumps": ["P1670"]}, {"id": "P1670", "text": ["A trunk is an interconnection link used to interconnect switching centers in order to achieve longer-distance communications. A fiber optic trunk can carry thousands of voice channels that are multiplexed and sent over a single cable..."], "jumps": ["P1680", "P1660"]}, {"id": "P1660", "text": ["No. 4 ESS was the first complete electronic exchange using digital technology to be used in both the switching and computer control circuitry. No. 4 ESS can accommodate more than 10,000 trunk circuits."], "jumps": ["P1670", "P1650"]}, {"id": "P1650", "text": ["The No. 3 ESS employs bipolar LSI ROMs for microprogram control. Under microprogram control, the stored program control is executed from a unique set of micro-instructions stored in ROM. No. 3 ESS was designed for small towns of 100 to 1,000 subscribers........"], "jumps": ["P1660", "P1620"]}, {"id": "P1640", "text": ["The first two ESS systems used small-scale (SSI) and medium-scale (MSI) integrated devices. In the 1970's, large-scale integration (LSI) devices were developed which reduced circuitry size and cost. LSI ROMs replaced the older memory devices and increased speed..."], "jumps": ["P1650", "P1620"]}, {"id": "P1630", "text": ["The size of the control circuitry was reduced by using resistor-transistor logic (RTL) instead of Diode-transistor logic (DTL). The RTL circuitry is more than twice as fast as DTL and is less expensive..."], "jumps": ["P1640", "P1620"]}, {"id": "P1620", "text": ["The No. 2 ESS is for use in exchanges that handle between 1,000 and 10,000 lines and provides economical reliability. The system can be operated from a remote location, allowing administrative functions, maintenance, and traffic management to be performed in a more populated area..."], "jumps": ["P1630", "P1590"]}, {"id": "P1610", "text": ["The ferrite sheets are stacked in a module, and four modules make up a Call Store, each holding 196,608 bits of read-write information. The No. 1 ESS can address over 1 million bits of memory..."], "jumps": ["P1620", "P1590"]}, {"id": "P1600", "text": ["Three lines are threaded through each hole to allow reading and writing to each hole in a manner similar to core memory. Core memory is a magnetic type of memory consisting of tiny toroids that can be magnetized in one direction to represent a 1 and in the other direction to represent a 0.."], "jumps": ["P1610", "P1590"]}, {"id": "P1590", "text": ["Ferrite sheet memory is used for temporary storage of data (read-write/RAM memory) related to the processing and administration of a call. The ferrite sheet shown has 256 perforated holes on a 1 in.-square board. Ferrite material surrounds each hole, which acts like a core and stores one bit of information."], "jumps": ["P1600", "P1570"]}, {"id": "P1580", "text": ["The memory card is made of aluminum sheets measuring approximately 11 by 6 1/2. Each sheet contains rows of magnetic spots that are either magnetized or de-magnetized prior to installation. The magnetic state of each spot represents one bit of stored data. Each card stores 64 words that are 24 bits in length...."], "jumps": ["P1590", "P1570"]}, {"id": "P1570", "text": ["The twistor memory stores the control program and any data that are not likely to change. It is read-only (ROM) where power failures and read errors cannot alter the memory contents. Only an operator can change its contents by reprogramming them with a special device.."], "jumps": ["P1580", "P1560"]}, {"id": "P1560", "text": ["The switching arrangement for the No. 1 ESS is made up of an arrangement sealed dry reed switches that are activated or deactivated by a 300 (ms current pulse. Two types of memory are used: twistor memory and ferrite sheet memory..."], "jumps": ["P1570", "P1500"]}, {"id": "P1550", "text": ["The first stored program control switch used in 1965 was the Number 1-Electronic Switching System (1ESS). It was a computer controlled crossbar switch. The No. 1 ESS can handle from 10,000 to 70,000 subscribers..."], "jumps": ["P1560", "P1500"]}, {"id": "P1540", "text": ["The control of these switches changed from processing each digit as it is dialed to storing the number in a register and then making the dialed connection. The switches were previously called common control switches and then advanced to stored program control..."], "jumps": ["P1550", "P1500"]}, {"id": "P1530", "text": ["Switching, signaling, and administrative tasks are achieved using software. In an ESS system, a computer controls electromechanical or electronic switching devices."], "jumps": ["P1540", "P1500"]}, {"id": "P1520", "text": ["These systems scan and select an available transmission path that provides the quickest connection. The circuit may not necessarily be the shortest, or most direct, transmission path between switching centers..."], "jumps": ["P1530", "P1500"]}, {"id": "P1510", "text": ["There are presently five different ESS processes in use, named No. 1 ESS, No. 2 ESS, etc. The ESS processes have proved to be far superior to predecessor switching systems such as Strowger and crossbar switches. Of the five ESS models, only No. 4 ESS and No. 5 ESS are complete electronic switching systems....."], "jumps": ["P1520", "P1500"]}, {"id": "P1500", "text": ["It is difficult to separate the systems by any single factor. Based solely on the control element of a switching system, we have another category of switching, called, electronic switching systems referred to as ESS. These systems, introduced by Bell Labs in 1965, are microprocessor controlled.."], "jumps": ["P1510", "P1490"]}, {"id": "P1490", "text": ["Many of the switching processes mentioned can be categorized as electromechanical because of their use of relays. Most of the switching techniques fall into gray areas where one technology is integrated with another in a single system..."], "jumps": ["P1500", "P1460"]}, {"id": "P1480", "text": ["In most cases (except during times of heavy traffic), the packets move through the exchange immediately after the header is received. Sometimes a packet's header will reach its destination before the entire packet has left the source. Under those circumstances, the process resembles circuit switching..."], "jumps": ["P1490", "P1460"]}, {"id": "P1470", "text": ["Each switch element must either forward or buffer the entire packet. This is similar to the store-and-forward method. Flow is packet-based and the buffers must be large enough to store at least one packet..."], "jumps": ["P1480", "P1460"]}, {"id": "P1460", "text": ["If the output port is busy, the packet is blocked and buffered. The header and trailing data are blocked and stay in buffers along with the established route until the channel becomes open."], "jumps": ["P1470", "P1440"]}, {"id": "P1450", "text": ["In cut-through networks, the switch element examines the packet's header route information to determine the proper output port and immediately forwards the packet if the output port is not busy..."], "jumps": ["P1460", "P1440"]}, {"id": "P1440", "text": ["Recall that packet switching is required to delay re-transmission until the entire packet is received and tested. In order to decrease the amount of time spent on transmitting data, virtual cut-through routing, and a form of packet switching was introduced..."], "jumps": ["P1450", "P1430"]}, {"id": "P1430", "text": ["Since packet size is constant and synchronized, buffer space (temporary memory) is not needed. This decreases the costs and switching circuitry, which increases the speed. The benefit is the high speed, which can exceed 100 Mbps...", "Vacant slots occur when an idle terminal has nothing to transmit in its slot or a conversation experiences periods of silence between the conversing parties. If a device has no traffic, its slot is empty, because the slots are pre-assigned to the devices. TDM wastes the bandwidth of the communications line because of this......"], "jumps": ["P1440", "P1420", "P1430", "P1390"]}, {"id": "P1410", "text": ["TDM cyclically scans the input signals (incoming data) from the multiple incoming points. Bits, bytes, or blocks of data are separated and interleaved together into frames on a single high-speed communications line. Re-transmission often takes place as soon as the header of a packet is read..."], "jumps": ["P1420", "P1390"]}, {"id": "P1400", "text": ["Time-division multiplexing (TDM) is a form of packet switching and provides a user the full channel capacity but divides the channel usage into time slots. Each user is given a slot and the slots are rotated among the attached users..."], "jumps": ["P1410", "P1390"]}, {"id": "P1390", "text": ["Simple demands of economy require that many phone conversations be carried over a single communications channel. Multiplexing techniques are used to achieve this goal. Frequency division multiplexing is used for analog lines and will not be covered. Time division multiplexing is used for digital lines......"], "jumps": ["P1400", "P1380"]}, {"id": "P1380", "text": ["One answer to the problem is a switching variation called fast-connect circuit switching. This solution requires scrapping an existing telephone system and replacing it with a new system. This was done in the Scandinavian countries where a downscaled, fast-connect system was built for data communications only....."], "jumps": ["P1390", "P1370"]}, {"id": "P1370", "text": ["The primary purpose of message/packet switching was to improve the connection time for long-distance calls. Depending upon the points being connected, more than 15 seconds could be required..."], "jumps": ["P1380", "P1360"]}, {"id": "P1360", "text": ["Variations of processes called combined systems have been devised to improve data accuracy and throughput. They are virtual cut-through switching, time division switching, fast-connect switching, and five electronic switching systems (No. 1 through No. 5 ESS) and Asynchronous Transfer Mode switching..."], "jumps": ["P1370", "P1330"]}, {"id": "P1350", "text": ["Message switching was the first method of switching devised for non-voice communications but the benefits of packet switching, have made it the process of choice for data communications. On occasion, circuit switching is used, but message switching is no longer a viable means of data transmission..."], "jumps": ["P1360", "P1330"]}, {"id": "P1340", "text": ["Since different paths may be taken through the network, undesirable delays may be introduced. In packet switching, the backbone network channels are shared by many users. When the network is heavily loaded, the full channel capacity is not available from caller to receiver so there can be slow network performance....."], "jumps": ["P1350", "P1330"]}, {"id": "P1330", "text": ["Packet switching effectively uses transmission resources since pauses in conversations are not sent. Packet networks can experience an outage without impacting caller communications because data is re-routed on the fly over the remaining communications channels...", "T1,T2,T3 = terminal 1,2,3 M1 = message 1 PAD = packet assembler- disassembler P1,P2,P3 = packets 1, 2, 3 N1,N2,N3 = packet switching nodes 1,2,3"], "jumps": ["P1340", "P1300"]}, {"id": "P1320", "text": ["Packets are sent by one switching office to the next available switching office, regardless of its location. In this manner, packets are not held up at any particular exchange waiting to be transmitted. Traffic is kept evenly distributed, and the entire transmission is accomplished with greater speed..."], "jumps": ["P1330", "P1300"]}, {"id": "P1310", "text": ["The packets overlay, which reduces transmission time by a considerable factor. The packets do not necessarily take the same path. They can end up on opposite sides of the country before being reassembled in their proper order at the final switching office. Packet switching is well suited for interactive traffic.....", "This eliminates the possibility of any one user tying up any given transmission line for more than an average of 30 to 50 mS. Another advantage of packet switching is that subsequent packets can be transmitted to the exchange offices before the previous packets have been re-transmitted..."], "jumps": ["P1320", "P1300", "P1310", "P1280"]}, {"id": "P1290", "text": ["The transmitted data is broken into packets that have a strict size limit, which allows the switching offices to hold incoming packets in memory rather than on disk. This improves transmission time, since accessing memory is much faster than accessing hard disks...", "Due to the inherent delay in the transmission of information blocks by message switching, a variation of the process, called packet switching, was developed. Packet switching is not subject to the problems associated with message switching...", "Packets interleaved as required in no special order", "Voice changed to analog, digitized and put into packets", "Packets reordered and sent to customers, voice changed to analog."], "jumps": ["P1300", "P1280", "P1290", "P1260"]}, {"id": "P1270", "text": ["The block is checked for errors and then re-transmitted through the second switching office to the final destination, computer B. Until the first switching office has transmitted the block it holds, a new block is not transmitted by computer A...", "Message switching is being used to send blocks of information from computer A to computer B. Computer A sends a block to the first switching office."], "jumps": ["P1280", "P1260", "P1270", "P1250"]}, {"id": "P1250", "text": ["Further, a single block of data may occupy the connection between one switching office and another for a long time, making the process unsuitable for any interactive data exchange. The process of transmitting data in blocks is often referred to as a store-and-forward network...", "T1,T2,T3 = terminals 1,2,3 M1,M2 = messages 1,2 N1,N2,N3 = message switching nodes 1,2,3"], "jumps": ["P1260", "P1232"]}, {"id": "P1240", "text": ["The first block is forwarded to the initial switching office and examined for errors before being sent to the next switching office or the recipient. Each block is treated the same way. There is no limit as to the size of the blocks, so switching offices must have the disk storage capacity to handle large blocks of data....."], "jumps": ["P1250", "P1232"]}, {"id": "P1232", "text": ["A header is located at the beginning of a data unit and it contains the sender's and receiver's addresses, routing instructions, etc. the part of the message that guides it to the correct destination.", "Mr. John Doe 123 Simple Ave Orlando,FL 32900", "Miss. Jane Doe 456 Easy St. Brooklyn,N.Y. 32245"], "jumps": ["P1240", "P1220"]}, {"id": "P1230", "text": ["When information (data) is sent from one computer to another, it is sent in the form of blocks. Individual blocks are transmitted and received as complete, separate entities. Each block contains data and a header..", "Communication between two computers requires a different kind of switching and has forced modifications upon the existing telephone system. With message switching, there is no physical connection prior to the first transmission.."], "jumps": ["P1232", "P1220", "P1230", "P1200"]}, {"id": "P1210", "text": ["Another disadvantage is that circuit switching is unsuitable for bursty applications such as certain video transmissions. Bursty refers to short periods of high usage followed by long intervals of little or no usage. Also when a channel fails in circuit switched networks, communications are disrupted...", "The advantages include guaranteed throughput and data is received in the same order as sent. One disadvantage is the inefficient use of transmission resources due to the circuit being reserved and used even when no data is being sent as in the pauses of silence in a conversation..."], "jumps": ["P1220", "P1200", "P1210", "P1190"]}, {"id": "P1190", "text": ["In circuit switching, a defined path exists between the originator and the recipient prior to any transmission of information. There is no delay as the circuit is dedicated for the duration of the call and the data takes a pre-determined path through the network...", "Data 1 = data transmitted from T1 to T2 Data 2 = data transmitted from T2 to T1 T1, T2, T3 = terminate 1, 2, 3 N1, N2, N3 = circuit switching nodes 1, 2, 3"], "jumps": ["P1200", "P1180"]}, {"id": "P1184", "text": ["A reed switch is a physical switch used in network switching."], "jumps": []}, {"id": "P1183", "text": ["A crossbar switch is a physical switch used in network switching."], "jumps": []}, {"id": "P1182", "text": ["A Strowger switch is a physical switch used in network switching."], "jumps": []}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1180", "text": ["Which is not an example of a physical switch used in network switching?"], "jumps": ["P1170"]}, {"id": "P1170", "text": ["Reed switches use reed relays that open or close in response to current that passes through a coil wrapped around each relay. Plates of magnetic material on either side of the relay latch the reed contacts until a reverse current is applied..."], "jumps": ["P1180", "P1160"]}, {"id": "P1160", "text": ["Crossbar switches use a matrix, much like a keyboard matrix of vertical and horizontal wires. The intersections of the wires are called cross points, and each cross point represents an individual connection. Crossbars are available in both electronic and electromechanical forms..."], "jumps": ["P1170", "P1150"]}, {"id": "P1150", "text": ["There are other physical switches including crossbar and reed switches. Both of these are still in service."], "jumps": ["P1160", "P1110"]}, {"id": "P1140", "text": ["The switch will not operate with tone dialing, so conversion equipment is required. Because the switches work in tandem, it's possible for a call to be blocked once the dialing process has already begun..."], "jumps": ["P1150", "P1110"]}, {"id": "P1130", "text": ["Since the switch is hardwired, making any changes to the arrangement or replacing a switch is labor-intensive. The considerable voltage and current used to operate these switches generates a large amount of electrical and mechanical noise. They also require frequent replacement..."], "jumps": ["P1140", "P1110"]}, {"id": "P1120", "text": ["The Strowger switch was first patented in 1891, but Bell Telephone did not put it into service until 1918. By 1978, 58% of Bell's exchanges were operating with the Strowger switches. The Strowger has several disadvantages and limitations..."], "jumps": ["P1130", "P1110"]}, {"id": "P1110", "text": ["In real-world applications, many of these switches work in tandem. This is an example of circuit switching where a complete circuit path is made from one end to the other prior to the transmission of any information..."], "jumps": ["P1120", "P1080"]}, {"id": "P1100", "text": ["When that is accomplished, a dial tone is sent to the caller, who then dials the desired number. Each pulse of the number searches through a set of switches dedicated to that particular digit. Once a switch for each digit has been selected, a physical (or perhaps atmospheric) connection exists between the two parties....."], "jumps": ["P1110", "P1080"]}, {"id": "P1090", "text": ["When the handset is taken off the hook, current on the line triggers a relay at the exchange office, which causes the first switch (the line finder) in the series to seek out an active line. The switch then increments vertically until it comes to the first unused selector..."], "jumps": ["P1100", "P1080"]}, {"id": "P1080", "text": ["The first automated device was called the Strowger or step-by-step switch. It has two series of contacts, one vertical and one horizontal. Each call is under control of the pulses created when the number is dialed..."], "jumps": ["P1090", "P1060"]}, {"id": "P1070", "text": ["A telephone call from your house to a friend 600 miles away may have to be processed by numerous exchanges to make the necessary connection. Exchanges are the physical locations of the telecommunications switching devices. In this lesson, the terms exchange and switching office are used interchangeably..."], "jumps": ["P1080", "P1060"]}, {"id": "P1060", "text": ["Switching offices, including the local network, the area exchange network, and long-distance network, are routing points in the telecommunications network. Their purpose is to receive incoming traffic and ensure it connects to its destination or another appropriate switching office en route to its destination..."], "jumps": ["P1070", "P1040"]}, {"id": "P1052", "text": ["This means that one telephone number can connect to any other telephone number, at any time, and remain connected until one of the parties hangs up."], "jumps": ["P1060", "P1040"]}, {"id": "P1050", "text": ["The International Telecommunications Union defines switching as: The establishment, on demand, of an individual connection from a desired inlet to a desired outlet within a set of inlets and outlets for as long as is required for the transfer of information.."], "jumps": []}, {"id": "P1044", "text": ["Packet switching is a major method of automated network switching..."], "jumps": []}, {"id": "P1043", "text": ["Message switching is a major method of automated network switching."], "jumps": []}, {"id": "P1042", "text": ["Circuit switching is a major method of automated network switching."], "jumps": []}, {"id": "P1041", "text": [], "jumps": []}, {"id": "P1040", "text": ["Which is not a major method of automated network switching?"], "jumps": ["P1030"]}, {"id": "P1030", "text": ["Automated switching networks were devised because the demands of modern society for telecommunication needed a more timesaving and efficient method. The four major methods of switching are: circuit switching, message switching, packet switching, and combined systems..."], "jumps": ["P1040", "P1020"]}, {"id": "P1020", "text": ["Switching operations were once performed by operators that received verbal instructions about the number to be dialed. The operator would use a patch cord (a small cable with a jack at either end) and physically make the connection on a patch panel."], "jumps": ["P1030", "P1001"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P430", "text": ["Let's begin the lesson on INTRODUCTION TO NETWORK SWITCHING.................", "International calls must be routed through many different exchanges that may involve different connection links, possibly even satellite. As the demand for telecommunication increases, the number and capacity of switching devices and methods will increase as well...", "When you call your neighbor from your home, the number dialed is received by the local exchange where a connection to that number is made. A more complicated process is used to call someone in a foreign country...", "Millions of people telecommunicate with each other 24 hours a day, every day. To meet the demands for connections, switching is required. Whether it's a voice connection on the telephone, or a data connection on the Internet, some means of connecting both ends of the communication is required..."], "jumps": ["P420", "P430", "P410", "P400", "P300"]}, {"id": "P300", "text": [], "jumps": []}, {"id": "P100", "text": ["w Define and identify the purpose of switching in a telecommunications network. w Describe the four major methods and variations of switching in a telecommunications network."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
