ext for the distractor. This is the fourth line of text for the distractor. X", "Which of the following is a Control Differential Transmitter?"], "jumps": []}, {"id": "P10212", "text": ["oice A choice is d, and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "oice C choice is d, and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "Which of the following is a Control Transformer?"], "jumps": []}, {"id": "P10211", "text": ["Which of the following is a Control Differential Transmitter?"], "jumps": []}, {"id": "P10210", "text": ["Control Synchro System provides high current to rotate radars."], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": []}, {"id": "P1940", "text": ["3. The Control Transformer or Control Transolver receives electrical synchronization signals from the Control Transmitters and mechanical positioning input from the load to develop synchronization input to the servo system with error correction.."], "jumps": []}, {"id": "P1930", "text": ["2. Control Synchro Systems provide the position control with error feedback to servo systems.."], "jumps": []}, {"id": "P1920", "text": ["1. The Control Synchro System is used when large assemblies must be kept in synchronization...."], "jumps": ["P1930", "P1001"]}, {"id": "P1910", "text": ["You have completed the information on CONTROL SYNCHRO SYSTEMS."], "jumps": ["P1001", "P1280"]}, {"id": "P1285", "text": [], "jumps": []}, {"id": "P1280", "text": ["Remember these relationships: l Transmitter (CX): Set to the desired compass bearing. Control Differential Transmitter CDX): Set to the current vehicle heading. Control Transformer: Mechanically coupled to the load. Provides positional and error correction signals to the servo system.."], "jumps": ["P1285"]}, {"id": "P1270", "text": ["The Control Transolver is also abbreviated \"CT\" like the Control Transformer but can be easily identified by the additional rotor output."], "jumps": []}, {"id": "P1260", "text": ["With the outputs of the Control Transolver coming from windings at a 90 degree spacing, one output will be null when the other is at maximum in relation to a given stator winding, providing the sine and the cosine angle at the same time..."], "jumps": []}, {"id": "P1250", "text": ["A variation of the Control Transformer known as the Control Transolver adds a second rotor winding at a 90 degree position and two rotor outputs. The Control Transolver provides dual outputs at all times..."], "jumps": []}, {"id": "P1240", "text": ["The input to the Control Transformer in this application is a combination of the input provided by the Control Transmitter(s). Positional correction is self generated provided by the Control Differential Transformer..."], "jumps": []}, {"id": "P1230", "text": ["The Torque Differential Transmitter in a Torque Synchro System provides positional offset. The Control Differential Transmitter (CDX) provides the same function in the Control Synchro System..."], "jumps": []}, {"id": "P1220", "text": ["The constant error correcting provided by the mechanical connection of the Control Transformer rotor to the load ensures the accuracy of the system."], "jumps": []}, {"id": "P1210", "text": ["Should the load be leading or trailing the rotational signal provided by the Control Transmitter, the Control Transformer automatically creates a modified input signal to the servo amplifier due to the change in the signal caused by the change of the position in relation to the control signal..."], "jumps": []}, {"id": "P1200", "text": ["As the servo system positions the mechanical device (the load), the Control Transformer rotor winding moves in conjunction with the load seeking a null signal. This provides constant positional feedback to the servo amplifier..."], "jumps": []}, {"id": "P1190", "text": ["The Control Transformer rotor winding is the positioning input source to the servo system. As the input provided by the Control Transmitter rotates through the stator windings, the signal received by the rotor winding is fed to the servo amplifier, a part of the servo system..."], "jumps": []}, {"id": "P1180", "text": ["The Control Transformer symbol differs only slightly from that of the Torque Receiver. It does not move on its own accord. The Control Transformer is mechanically coupled to the driven device. The three stator windings receive input from the Control Transmitter..."], "jumps": []}, {"id": "P1170", "text": ["The Control Synchro System differs at this point as it provides no direct mechanical movement. Instead, a Control Transformer (CT) is the third device in the circuit."], "jumps": []}, {"id": "P1160", "text": ["The Torque Synchro System uses a Torque Receiver (TR). The Torque Receiver spins its rotor, rotating any attached mechanical devices to the proper bearing. The controlling device is the Torque Transmitter (TX). The Torque Differential Transmitter (TDX) provides rotational correction..."], "jumps": []}, {"id": "P1150", "text": ["As with a Torque Synchro System, the Control Transmitter (CX) and the Control Differential Transmitter (CDX) both create or modify a rotational position signal based upon the settings or the position of the rotor in each device..."], "jumps": []}, {"id": "P1140", "text": ["The Control Differential Transmitter (CDX) performs the same function as the Torque Differential Transmitter (TDX). The device provides positional corrections to the system from manual or automatic input from an outside source, usually the navigation system..."], "jumps": []}, {"id": "P1130", "text": ["As the Control Transmitter (CX) rotor is turned the resulting voltage and phase signals generated in the stator windings represent the position of the rotor."], "jumps": []}, {"id": "P1120", "text": ["The Control Transmitter (CX) performs the same function as the Torque Transmitter (TX) discussed in earlier lessons. Like the Torque Transmitter, the Control Transmitter incorporates a movable rotor using an AC powered single winding with three stator windings positioned at 120"], "jumps": []}, {"id": "P1114", "text": ["Torque Synchro Systems and Control Synchro Systems can both be designed to operate on 60 Hz or 400 Hz frequencies."], "jumps": []}, {"id": "P1113", "text": ["Control Synchro System components may be physically smaller than Torque Synchro System components but size is not the major difference."], "jumps": []}, {"id": "P1112", "text": ["Torque Synchro Systems and Control Synchro Systems can both be designed to operate on common voltages."], "jumps": []}, {"id": "P1111", "text": [], "jumps": []}, {"id": "P1110", "text": ["This is where the question is typed..........................", "What is the biggest difference between Torque Synchro Systems components and Control Synchro Systems components?"], "jumps": ["P1100"]}, {"id": "P1100", "text": ["Since the current requirements are lessened in the Control Synchro System all devices used in the system can be smaller and more compact. The reduced current demand on the system should also reduce heat and increase reliability of the system..."], "jumps": []}, {"id": "P1090", "text": ["However, the Control Synchro System only provides direction control with positional feedback to a Servo System. The Servo System can be as large or as small as necessary to perform the mechanical function of moving the equipment..."], "jumps": []}, {"id": "P1080", "text": ["The greatest difference between the components in a Torque Synchro System and the Control Synchro System is that of the current requirements. Since a Torque Receiver mechanically powers the output, the Torque Synchro System must provide enough current to perform the physical movement in a reliable manner....."], "jumps": []}, {"id": "P1070", "text": ["Control Synchro Systems operate from the same voltage supply sources as Torque Synchro Systems and at both 60 Hz and 400 Hz depending upon the designed application."], "jumps": []}, {"id": "P1065", "text": ["TRANSOLVER - a synchro used as a transmitter or control transformer. A transolver has a two-phase cylindrical rotor within a three-phase stator. ith no degradation of accuracy or nulls. er with no degradation of accuracy or nulls."], "jumps": []}, {"id": "P1060", "text": ["If higher torque is needed a Control Synchro System is used incorporating a Control Transmitter (CX), a Control Differential Transmitter (CDX), and a Control Transformer or Transolver (CT)."], "jumps": []}, {"id": "P1050", "text": ["The basic Synchro System rapidly and accurately transmits information between equipment and stations. Torque Synchro systems are used when low torque is required, such as moving an indicator or dial..."], "jumps": []}, {"id": "P1040", "text": ["When positional correction is needed a differential transmitter is added between the transmitter and the receiver."], "jumps": []}, {"id": "P1030", "text": ["In its simplest form the synchro system consists of a transmitter and a receiver. They are electrically identical but slightly different mechanically."], "jumps": ["P1040", "P1020"]}, {"id": "P1020", "text": ["The basic synchro system converts mechanical movement into an electrical signal which is then used to duplicate the mechanical movement at another location."], "jumps": ["P1030", "P1001"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": ["P410"]}, {"id": "P470", "text": ["Let's begin the lesson on CONTROL SYNCHRO SYSTEMS........................."], "jumps": []}, {"id": "P460", "text": ["These are just a few examples of the areas where you will find synchro systems."], "jumps": []}, {"id": "P450", "text": ["Large ships use synchros to control rudder positioning....."], "jumps": []}, {"id": "P440", "text": ["The space shuttle uses synchros to control the movement of its robotic arm."], "jumps": []}, {"id": "P430", "text": ["Satellite systems are also controlled by synchros.........."], "jumps": []}, {"id": "P420", "text": ["Tanks use synchros to control the movement of gun turrets.."], "jumps": []}, {"id": "P410", "text": ["Synchros are widely used in military and industrial applications."], "jumps": []}, {"id": "P400", "text": ["This lesson familiarizes you with the operation of the basic control synchro operations and circuitry.ry."], "jumps": ["P410", "P300"]}, {"id": "P300", "text": [], "jumps": []}, {"id": "P100", "text": ["1. Control Synchro Systemser objective 1 line item 2 here. item 2 here.e.e.", "w Describe the differences between Torque Synchro Systems and Control Synchro Systems. w Identify Control Synchro schematic symbols. w Demonstrate knowledge of the functions of the Control Transformer and Control Transolver.........."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No par let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();

    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {

    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}

  const n = book.pages.findIndex(p => p.id === id);

}
