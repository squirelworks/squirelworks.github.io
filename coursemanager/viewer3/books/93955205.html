const book = {"title": "93955205", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: TIME CONTROL OF DC MOTORSsd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe speed control techniques for DC motor control. w Describe a basic SCR controller. w Describe a basic Triac controller. w Describe fire angle (ff) and conduction angle (fc).", "SCR controller operation. w Verify proper 360"], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "3. Nida Model 280 Rotating Machinery Trainer", "6. Nida Model 414 Variac imeterXXXXXXXXXXnt"], "jumps": []}, {"id": "P301", "text": [], "jumps": []}, {"id": "P330", "text": ["Nida Model 280 Rotating Machinery Trainer"], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P341", "text": [], "jumps": []}, {"id": "P350", "text": [], "jumps": ["P"]}, {"id": "P360", "text": [], "jumps": []}, {"id": "P361", "text": [], "jumps": []}, {"id": "P362", "text": ["In this lesson, you will learn about speed control for DC motors."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["In particular, basic SCR and Triac controllers will be explored."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["These types of controllers are used where variable motor speed is crucial."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["You will also experimentally verify proper speed control of DC motors. Time Control of DC Motors"], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["Let's begin the lesson on TIME CONTROL OF DC MOTORS......................."], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["There are two types of DC motor speed controls: Amplitude Control and Time Control. C Motor Controllers Amplitude Time Control Control", "AC Filament.......... ON (130A only) + Power Supply... 5 Volts - Power Supply..... 15 Volts"], "jumps": ["P1022", "P1001"]}, {"id": "P1022", "text": ["On DC motors that use amplitude control, varying E (the applied voltage) changes the speed (RPM) of the motor."], "jumps": ["P1030", "P1020"]}, {"id": "P1030", "text": ["In this lesson you will be concerned with Time Control of DC motors."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Time control is based on a duty cycle of repetitive waveforms."], "jumps": ["P1042", "P1020"]}, {"id": "P1042", "text": ["Let's look at using a square wave input to a DC motor first."], "jumps": ["P1044", "P1040"]}, {"id": "P1044", "text": ["A DC motor responds to the average DC voltage applied. If a pure DC signal is applied, the average voltage is the peak value."], "jumps": ["P1050", "P1040"]}, {"id": "P1050", "text": ["When applying a square wave, the average voltage is less than a DC level. Therefore the RPM is also less.", "Average voltage = E ( time on cycle time ) = 10 ( .10 ) = 1VVV"], "jumps": ["P1060", "P1044"]}, {"id": "P1060", "text": ["The average DC voltage is the product of the duty cycle of the wave and the maximum output voltage.", "Average Voltage = Duty Cycle x Max Applied Voltage", "Where Duty Cycle = Time On Time Cycle", "AC Filament.......... ON (130A only) + Power Supply... 5 Volts - Power Supply..... 15 Volts"], "jumps": ["P1070", "P1044"]}, {"id": "P1070", "text": ["The duty cycle is the ratio of the ON time to the total cycle.", "Average voltage = E ( time on cycle time ) = 10 ( .10 ) = 1VVV"], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["The greater the ON time of the pulse, the higher the average DC voltage and the faster the motor RPM.", "Average voltage = E ( time on cycle time ) = 10 ( .9 ) = 9VVVV"], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["This technique is for pulsed waveforms only and is called Pulse Width Modulation, (PWM)."], "jumps": ["P1092", "P1080", "PWM"]}, {"id": "P1092", "text": ["The motor does not stop when the pulse is low (OFF)........"], "jumps": ["P1094", "P1080"]}, {"id": "P1094", "text": ["The motor's internal inertia and mass keeps the rotor spinning during OFF times."], "jumps": ["P1096", "P1092"]}, {"id": "P1096", "text": ["A typical circuit that performs time control using a square wave would use a variable one shot multivibrator. Source Time control Device Squarewave One Shot DC Variable Generator Multivibrator Motor RPM", "AC Filament.......... ON (130A only) + Power Supply... 5 Volts - Power Supply..... 15 Volts"], "jumps": ["P1098", "P1092"]}, {"id": "P1098", "text": ["Triangular wave input voltages are used as speed control by the same method. urce Conversion Time control Device Triangular Wave Schmitt One Shot DC Variable Generator Trigger Multivibrator Motor RPMMM", "AC Filament.......... ON (130A only) + Power Supply... 5 Volts - Power Supply..... 15 Volts"], "jumps": ["P1320", "P1096"]}, {"id": "P1100", "text": ["Sine wave or AC inputs to a DC motor can also be used for time control. Sine wave Square wave Triangular"], "jumps": ["P1110", "P1340"]}, {"id": "P1110", "text": ["Let's look at one alternation only, changing when the input is applied to a DC motor, changes the average DC voltage.", "- Aug. DC - 8V - Aug. DC - 4V - Aug. DC - 1V - Aug. DC - 0V"], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["The longer the voltage is not applied to the motor, the less the average DC.", "- Aug. DC - 8V - Aug. DC - 4V - Aug. DC - 1V - Aug. DC - 0V"], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["The time that the voltage is off is called the fire angle (fF) and is measured in degrees."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["The Fire Angle of the illustrated waveforms are: 1. fF = 45"], "jumps": ["P1150", "P1110"]}, {"id": "P1150", "text": ["The time that the voltage is on is called the conduction angle (fC) and is measured in degrees."], "jumps": ["P1152", "P1110"]}, {"id": "P1152", "text": ["The conduction angle of the illustrated waveforms are: 1. fC = 135"], "jumps": ["P1154", "P1110"]}, {"id": "P1154", "text": [], "jumps": ["P1156", "P1110"]}, {"id": "P1156", "text": ["When applying time control, using an AC signal, varying fF varies the average DC voltage applied to the DC motor."], "jumps": ["P1160", "P1110"]}, {"id": "P1160", "text": ["The time before the AC signal goes ON is determined by the _______"], "jumps": ["P1110"]}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1162", "text": ["The conduction angle determines how long the signal is ON.."], "jumps": []}, {"id": "P1163", "text": ["The average DC value is determined by the ON time, not when the signal goes ON."], "jumps": []}, {"id": "P1170", "text": ["How long a signal is ON is determined by the _______......."], "jumps": ["P1160"]}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1172", "text": ["The firing angle determines when the signal is turned ON..."], "jumps": []}, {"id": "P1173", "text": ["The amplitude of a waveform has no bearing on how long the signal is ON."], "jumps": []}, {"id": "P1180", "text": ["The firing angle can be varied when time control has been achieved."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["Two components that are commonly used to control the firing angle of a signal are an SCR and a TRIAC."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": [], "jumps": ["P1210", "P1180"]}, {"id": "P1210", "text": ["An SCR is a diode that conducts on one alternation of a full cycle, 180"], "jumps": ["P1216", "P1180"]}, {"id": "P1216", "text": ["The difference in a SCR is that the point where conduction starts can be varied by a signal applied to the gate."], "jumps": ["P1218", "P1210"]}, {"id": "P1218", "text": ["Even if forward biased, the SCR will not conduct until a voltage is applied to the gate."], "jumps": ["P1220", "P1216"]}, {"id": "P1220", "text": ["The SCR's firing voltage can easily be controlled with a variable resistor. . -"], "jumps": ["P1350", "P1216"]}, {"id": "P1225", "text": ["FIRING VOLTAGE - The firing voltage of an SCR is the amount of voltage needed to let the SCR conduct. This voltage is also termed the THRESHOLD VOLTAGE."], "jumps": []}, {"id": "P1230", "text": [], "jumps": ["P1240", "P1350"]}, {"id": "P1240", "text": ["A TRIAC can conduct on both the positive and negative half cycles of a sine wave, or 360"], "jumps": ["P1242", "P1230"]}, {"id": "P1242", "text": ["As in the SCR, the conduction point in a triac can be varied."], "jumps": ["P1245", "P1240"]}, {"id": "P1245", "text": ["Unlike the SCR, the triac has a fC on both the positive and negative alternations."], "jumps": ["P1420", "P1242"]}, {"id": "P1250", "text": ["controller is used, a sinusoidal signal is always applied to the DC motor."], "jumps": ["P1260", "P1440"]}, {"id": "P1260", "text": ["A DC motor can run on an AC signal, although not very efficiently."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["controller operates on the principle that the DC motor utilizes the positive half cycle of the input waveform."], "jumps": ["P1280", "P1250"]}, {"id": "P1280", "text": ["A DC motor treats this half cycle as a DC input."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["controller operates on the principle that the DC motor utilizes both half cycles of the input waveform."], "jumps": ["P1300", "P1270"]}, {"id": "P1300", "text": ["What does this waveform represent?........................."], "jumps": ["P1290"]}, {"id": "P1301", "text": [], "jumps": []}, {"id": "P1302", "text": ["Notice that only one alternation of the input voltage is used. This is not a 360"], "jumps": []}, {"id": "P1303", "text": ["controller but, notice there is 0 volts during the fire angle. This indicates the waveform is developed over the load."], "jumps": []}, {"id": "P1310", "text": ["The principle is that a SCR is used for a 180", "controller circuit and a TRIAC is used for a 360"], "jumps": ["P1910", "P1520"]}, {"id": "P1320", "text": ["The only difference is that the triangular input is first applied to a Schmitt Trigger to produce a square wave."], "jumps": ["P1330", "P1098"]}, {"id": "P1330", "text": ["Time control of a DC motor refers to changing a motor's _______"], "jumps": ["P1098"]}, {"id": "P1331", "text": [], "jumps": []}, {"id": "P1332", "text": ["Torque does vary as a result of time control since RPM, torque, power in, power out and motor currents are related. However, changes in torque are a result of what time control directly effects.."], "jumps": []}, {"id": "P1333", "text": ["Input power does vary as a result of time control since RPM, torque, power in, power out and motor currents are related. However, change in input power is a result of what time control directly effects."], "jumps": []}, {"id": "P1340", "text": ["What is changing the ON time of a square wave input called?"], "jumps": ["P1330", "PAM", "PDM", "PWM"]}, {"id": "P1341", "text": [], "jumps": []}, {"id": "P1342", "text": ["Pulse amplitude modulation is changing the amplitude or voltage level of a motor applied voltage. This is not time control."], "jumps": []}, {"id": "P1343", "text": ["Pulse duration modulation changes the frequency of the voltage applied to a DC motor. Even though frequency and time are related, f = I"], "jumps": []}, {"id": "P1350", "text": ["This is the SCR circuit that is used in the experiment....."], "jumps": ["P1360", "P1220"]}, {"id": "P1360", "text": ["The SCR, Q1, is in series with the applied voltage to the motor."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["Variable resistor R2 controls the voltage and current to the gate of Q1, thus controlling when Q1 fires during the position of the input AC."], "jumps": ["P1380", "P1350"]}, {"id": "P1380", "text": ["In other words, changing the fire angle of the SCR changes the average DC applied to the motor."], "jumps": ["P1390", "P1350"]}, {"id": "P1390", "text": ["Notice that across the SCR, the applied voltage is felt when not conducting."], "jumps": ["P1400", "P1350"]}, {"id": "P1400", "text": ["This is because the SCR is like an open during non-conduction times."], "jumps": ["P1410", "P1350"]}, {"id": "P1410", "text": ["When the SCR is conducting, it is like a short (0 volts across it) and the voltage is developed across the motor."], "jumps": ["P1230", "P1350"]}, {"id": "P1420", "text": ["It may seem that applying a positive and negative DC average voltage will cause the motor to rotate back and fourth."], "jumps": ["P1430", "P1242"]}, {"id": "P1430", "text": ["Reversing the polarity on both the field windings and armature cause no direction change."], "jumps": ["P1440", "P1242"]}, {"id": "P1440", "text": ["This is the triac circuit that is used in the experiment..."], "jumps": ["P1450", "P1242"]}, {"id": "P1450", "text": ["controller Triac, is in series to the voltage which is applied across the DC motor."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["The rest of the circuit ensures proper operation of the triac's gate through variable resistor R3."], "jumps": ["P1470", "P1440"]}, {"id": "P1470", "text": ["D1 is a bridge rectifier and D2 is a zener diode."], "jumps": ["P1480", "P1440"]}, {"id": "P1480", "text": ["R3 controls the amount of current and voltage applied to Q2 which changes the turn on time (in respect to the applied voltage)."], "jumps": ["P1490", "P1440"]}, {"id": "P1490", "text": ["When Q2 turns ON, a pulse is applied through T1 to the gate of Q1. Q1 turns on applying power to the load."], "jumps": ["P1500", "P1440"]}, {"id": "P1500", "text": [], "jumps": ["P1440", "P1510"]}, {"id": "P1510", "text": ["Just like in the SCR, the Triac has the applied voltage across it when non-conducting and 0 volts when conducting."], "jumps": ["P1440", "P1250"]}, {"id": "P1520", "text": ["What does this waveform represent?........................."], "jumps": ["P1300"]}, {"id": "P1521", "text": [], "jumps": []}, {"id": "P1522", "text": ["controller but, notice there is 0 volts during the conduction angle. This indicates the waveform is developed over the Triac."], "jumps": []}, {"id": "P1523", "text": ["Notice that both alternations of the input voltage are used. This is not a 180"], "jumps": []}, {"id": "P1910", "text": ["This completes the information on THEORY OF OPERATION......"], "jumps": ["P1001", "P1520"]}, {"id": "P1920", "text": ["1. Time control of a DC motor refers to the time an input voltage is applied to the motor."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. By varying the time the input voltage is applied to the motor, average DC is varied, which varies RPM."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. Using an AC input voltage, fire angle (fF) is the time the SCR or Triac is non-conducting. Conduction angle (fC) is the time the SCR is conducting."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["controller works on the principle that the DC motor operates on the positive half cycle of the input signal."], "jumps": ["P1960", "P1930"]}, {"id": "P1960", "text": ["controller works on the principle that the DC motor can operate on the complete input signal cycle."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["controller since it only responds to the positive half cycle input signal."], "jumps": ["P1980", "P1950"]}, {"id": "P1980", "text": ["controller because it responds to both input signal half cycles (positive and negative)."], "jumps": ["P1999", "P1970"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1970"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": [], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["You will examine the firing angle and conduction angle in both types of controllers.", "Examine PC130-288 and notice that it is three circuits in one."], "jumps": ["P2050", "P2020", "P2060", "P2030"]}, {"id": "P2060", "text": ["R9, Q5 and their associated components represent a TRIAC 360"], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["R2, Q1 and their associated components represent a SCR 180"], "jumps": ["P2080", "P2050"]}, {"id": "P2080", "text": ["Q3, Q2 and their associated components represent a microprocessor controller."], "jumps": ["P2090", "P2050"]}, {"id": "P2090", "text": ["Switch S1 selects either the microprocessor or the TRIAC/SCR controllers."], "jumps": ["P2100", "P2050"]}, {"id": "P2100", "text": ["S2 selects between the TRIAC controller or the SCR controller."], "jumps": ["P2110", "P2050"]}, {"id": "P2110", "text": ["In this experiment, we will only use the SCR and Triac controllers."], "jumps": ["P2120", "P2050"]}, {"id": "P2120", "text": ["Let's begin the experiment. 1. Set the 280 trainer to it's initial control settings."], "jumps": ["P2130", "P2110", "P22000"]}, {"id": "P2130", "text": ["2. Set the Test Console controls to their initial control settings........"], "jumps": ["P2120"]}, {"id": "P2140", "text": ["3. Insert PC130-288 into the PC2 position on the 130 test console."], "jumps": ["P2160", "P2130"]}, {"id": "P2160", "text": ["4. Insert PC130-280 into the PC3 position on the 130 test console.2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2140", "P2170"]}, {"id": "P2170", "text": ["5. Connect the 2 pin interconnect from the PC130-288 experiment card to the PC130-286 connector located on the rear of the 280 trainer."], "jumps": ["P2180", "P2160", "P"]}, {"id": "P2180", "text": ["6. Connect the 8 pin connector from the PC130-280 card to the PC130-280 connector on the rear of the 280 Trainer.."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["7. Connect the 2 Pin Jack cable from the output jacks of the Variac to the 115 VAC input jacks located on the AC subpanel of the 280 trainer. 280 Trainer Variac"], "jumps": ["P2200", "P2170"]}, {"id": "P2200", "text": ["With the trainers set to their initial control settings and the PC cards installed the system can be configured as a 180", "time controller. to ON........................................."], "jumps": ["P2190"]}, {"id": "P2210", "text": ["1. On the PC130-288 experiment card: .et S1 to DOWN - Set S2 to UP - Set R2 to FULLY CCW", "- Set S1 to DOWN - Set S2 to UP - Set R2 to FULLY CCW", "AC Filament.......... ON (130A only) + Power Supply... 5 Volts - Power Supply..... 15 Volts"], "jumps": ["P2220", "P2200", "P2215"]}, {"id": "P2215", "text": ["PC130-288 EXPERIMENT CARD S1 set to DOWN S2 set to UP R2 fully CCW W"], "jumps": []}, {"id": "P2220", "text": ["2. On the AC sub-panel, place the line meter switch to IN. Switch Settings LINE METER - IN"], "jumps": ["P2223", "P2210"]}, {"id": "P2223", "text": ["Placing the AC line meter switch to IN without an ammeter installed breaks the power connection to the AC motor from the Variac. Through internal wiring, the AC voltage is routed out the PC130-286 connector to the input \"AC IN\" on PC130-288..."], "jumps": ["P2220"]}, {"id": "P2224", "text": ["3. On the DC sub-panel, set the switches for a DC Series Motor. Switch Settings RUN/STOP - RUN SERIES FIELD - IN"], "jumps": ["P2230", "P2223"]}, {"id": "P2230", "text": ["4. Turn power on to the Variac. 5. Using the multimeter set to measure AC voltage across the output of the Variac, set the output to 120 VAC. Motor action should occur. If not, check your setup."], "jumps": ["P2240", "P2235"]}, {"id": "P2235", "text": [], "jumps": []}, {"id": "P2240", "text": ["6. Vary the % line control on the variac controller and observe motor RPM variance...."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["You have configured the system as follows.................."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["7. Connect the multimeter set for DC voltage to TPF and TPE on the 280 Trainer."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["8. While observing the DC voltmeter and the RPM of the motor, vary R2 on PC130-288."], "jumps": ["P2280", "P2260", "P2275"]}, {"id": "P2275", "text": ["PC130-288 EXPERIMENT CARD - Vary R2 on PC130-288 and observe the voltmeter."], "jumps": []}, {"id": "P2280", "text": ["Did the DC voltage applied to the Series Motor change as PC130-288 R2 was varied?"], "jumps": ["P2270"]}, {"id": "P2281", "text": [], "jumps": []}, {"id": "P2282", "text": ["You should have seen the voltage applied to the DC motor vary. Check your setup."], "jumps": []}, {"id": "P2290", "text": ["Did the RPM of the Series Motor change as PC130-288 R2 was varied?"], "jumps": ["P2280"]}, {"id": "P2291", "text": [], "jumps": []}, {"id": "P2292", "text": ["You should have seen the RPM change. You can tell by the sound of the rotating motor."], "jumps": []}, {"id": "P2300", "text": ["Now, let's observe the wave forms in the 180"], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["1. On the oscilloscope set the controls as follows. . an area for more detail CH1 & CH2 Probes - X10 Time/Div - 2ms Trigger - LINE, AC, + CH1 & CH2 Volt/Div - 5 V CH1 & CH2 - AC"], "jumps": ["P2320", "P2300", "P2315"]}, {"id": "P2315", "text": ["CH1 & CH2 CH1 & CH2 Volts/Div Time/Div CH1 & CH2 Probes Display CH2 Trigger Sweep Mode Autoode - AutoMode - Auto - Auto Auto- Auto Auto Auto", "- AC - 5V - 2ms - X10 - ADD - Inverted - Line, AC, + - Autoooode - Autoe - AutoAuto- AutoSweep Mode - Autode - Auto Sweep Mode - Autoode - Auto"], "jumps": []}, {"id": "P2317", "text": ["MEASUREMENT SETUP - By placing CH2 to inverted and adding CH1 to CH2, you can measure across components using the CH1 and CH2 probes.", "2. Measure the voltage source by: A. Connecting CH1 probe to PC130-288 TP4. B. Connecting CH2 probe to PC130-288 TP3. C. Adjusting the Time/Div variable control to view two cycles."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["You should be measuring around 170 Vpp. This is the voltage through the 280"], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["3. Measure the voltage across SCR by: A. Ensuring CH1 probe is connected to PC130-288 TP4. B. Connecting CH2 probe to PC130-288 TP5. C. Change CH2 to normal mode instead of inverted."], "jumps": ["P2350", "P2320"]}, {"id": "P2350", "text": ["4. Vary PC130-288 R2 throughout it's range."], "jumps": ["P2360", "P2320"]}, {"id": "P2360", "text": ["Notice that the fully applied voltage is seen across the SCR when R2 is fully CW."], "jumps": ["P2370", "P2320"]}, {"id": "P2370", "text": ["This indicates the SCR is open for the entire input cycle, no power to the motor as indicated by 0 RPM of the DC motor."], "jumps": ["P2380", "P2360"]}, {"id": "P2380", "text": ["Rotating R2 fully CCW the maximum voltage is applied to the motor."], "jumps": ["P2390", "P2360"]}, {"id": "P2390", "text": ["When the wave is 0 volts, the SCR is on and supplying power to the motor."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["5. Measure the voltage applied to the motor by: A. Connecting CH1 to PC130-280 control 1 TP. B. Connecting CH2 to PC130-280 control 2 TP. C. Change CH2 to let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
