const book = {"title": "9395Z813", "pages": [{"id": "P10220", "text": ["The fuel-flow indication data sent from turbine, motor driven impeller, and motorless fuel flow transmitters is a measure of _______"], "jumps": []}, {"id": "P10221", "text": ["Which unit most accurately indicates fuel consumption of a reciprocating engine?", "<<*)('&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&$ ;", "' #", ";! :::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::", ";!! :", "%%S&%Z%%Z&%Z%%Z%%[&%[&%['&[&&['&]'']((]((^))_*)^)(]((]((_**^))]((])(])(\\''\\'']((])(])(^))]((\\''\\''\\''Z&&Z%%Z%%Y%$X$$X$#X##W\"\"W\"\"W\"\"W\"\"U!!U U!!U!!U!!U T", "U V\"\"U!!V\"\"W\"\"V\"\"W\"\"X##X%$Y%$X##X##Y$$Y%%Z%%\\''['&Z%%['&\\''])(^))])(Z))", "x))M&&W%%W%%V%%W&%W&%W'&W&&W'&Y''Z((Z)(Z*)[*)Z((Z((Z))Z*)Z((Z)(Z)(X''X''Z)(Z)(Z))Z))Y''X''X''W&&W%%V%%U%$T$$T$#T##S\"\"S\"\"S\"\"R\"\"Q Q!!Q!!Q!!Q!!P", "Q R\"\"Q!!S\"\"R\"\"R\"\"T##T$$U%%T##T##U$$U%%W%%X''W&&W%%X''Y('Z))Z)(S++u", "####\"########\"########\"##\"#########\"\"#############\"\"#############\"######################\"####\"##\"#########################\"#\"#####\"#####\"#######\"##\"#########\"############\"#\"##############\"######\"########\"####\"##\"\"#####\"##############\"##\"########### \"#", "!!!!!! ! !! !!!!! !!!!!! !!!! !! !!!! !! ! !!!! !!! ! !!! !! !! !!!!! !!! !!! ! ! !! !!!!!!! ! !!!!!!! !!!!!!! !!!!!!!!! !!!!!!! !!!!!!!!!!!!!!!!!!!!! ! !! ! !! !", "! ! !! !! !! !! !! ! !! !! ! ! ! !! !! ! !! !! !! ! ! !! ! ! ! ! ! !!! !!!! ! !!! !! ! !!! !!"], "jumps": ["P2690", "P2480", "P2780"]}, {"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Title: TEMPERATURE AND FUEL FLOW INSTRUMENTATIONdf sadf", "Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P10", "text": ["TEMPERATURE AND FUEL FLOW INSTRUMENTATION", "# #\" #& \"\"# &\"###2' &2#&.22&# 25--283-.#285255232/238882-.-5:38832222882282-213:22::82-22225:8-33-22282232.22258558.5822385:235:222283538::2585582::2:", "&&#&# #/2.#.& -8 \"#.-&23..22'/.#212&-2258\"588:52", "### ## /# #/&# \" \"/##\"#/&//..#/..&/28.&...&824/&.88-8588..2222858852.28:582228588358282228258.888:825:583.8828::8228828588828583:35558.555.85::88::85588:88:5555::38::85:::5:5:52::85::88::", ":85:855::83:5:5.5:55:855:52.5:5283822242348522...252...2..82/.4..22//2./..##/.8.#&./#&/..##// ##\",##/## #. / /& # ## ## ## ## ## \" #/# ## /# ## #.\" ./ #//###,//.&/#.\"#/.##/./#&/2.&/.../&//....//&2222.2/252.&28.8522582.824828828::255:::5:", "/,,,,,,,,,,,,,/, ,, ,,,,,,6, ,,,6,,, ,,,,,//6//6,,,,/6/,,,/,4/,,/6/4494,,494/6846446/4884664;44;889448489888<8648<<8;44;88988<88948;98<44<;:<44<<8;44<48<<8;48<48<88;48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Identify the principles of temperature transducers. w Analyze the operation of solid-state temperature transducers.....", "w Identify the types and describe the function of the Exhaust Gas Temperature (EGT), Cylinder Head Temperature (CHT), and Carburator Air Temperature (CAT) sensing systems instruments. w Identify the types and describe the function of fuel flow indicating systems instruments..", "2. Temperature Transducer Operationive 1 line item 2 here. item 2 here.e.e.", "1. Temperature and Fuel Flowmeter Instruments.item 2 here. item 2 here.e.e."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. 1/8 Inch Slotted ScrewdrivereterXXXXXXXXXXnt"], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P341", "text": [], "jumps": []}, {"id": "P400", "text": ["This lesson introduces the principles and concepts of aircraft temperature, and fuel flow indicating systems instruments."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Aircraft Instrumentation provides the technician and flight crew with an indication of how the vital aircraft systems are performing."], "jumps": []}, {"id": "P420", "text": ["Flight crews need to continuously monitor the outside air, the engine exhaust and the engine oil temperatures to ensure they remain in normal operating ranges."], "jumps": []}, {"id": "P430", "text": ["Let's begin the lesson on TEMPERATURE AND FUEL FLOW INSTRUMENTATION........."], "jumps": ["P400"]}, {"id": "P900", "text": ["1. Temperature and Fuel Flowmeter Instruments"], "jumps": ["P430"]}, {"id": "P1001", "text": ["TEMPERATURE AND FUEL FLOW INSTRUMENTSMENTS"], "jumps": []}, {"id": "P1020", "text": ["Aircraft temperature and fuel flow systems instruments provide indications of whether the specific system is performing within its normal operating range."], "jumps": ["P1001", "P1030"]}, {"id": "P1030", "text": ["Numerous temperature indications must be constantly monitored to ensure the safety of flight and proper operation of the aircraft engine. The most important indications include the engine oil, cylinder head, and exhaust systems of turbine engines.s."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Various types of thermometers, such as the bimetal and resistance types, collect and present this information. The bimetal thermometer is made of strips of two metals with different coefficients of expansion welded together and twisted in a spiral..."], "jumps": []}, {"id": "P1050", "text": ["When the bimetal thermometer is heated, one of the strips expands more than the other and tries to straighten out the spiral. A pointer attached to the metal strip of the spiral moves across a dial to indicate changes in temperature..."], "jumps": []}, {"id": "P1060", "text": ["Resistance change and voltage generation are two methods used in electrical temperature measurements. The main parts of resistance thermometers are the indicating instrument, the temperature-sensitive element (resistance bulb), and the connecting wires leading from the bulb..."], "jumps": []}, {"id": "P1070", "text": ["The indicator dials of resistance thermometers are calibrated according to the range of temperature to be measured. The indicators are self-compensating, allowing for the changes in cockpit temperatures.s"], "jumps": []}, {"id": "P1080", "text": ["Some resistance thermometers use a Wheatstone bridge circuit. A resistance bulb element from the monitored source is placed into one side of the circuit. The other three sides of the bridge are resistors mounted in the temperature indicator instrument..."], "jumps": []}, {"id": "P1090", "text": ["When the temperature bulb senses a temperature of 0", "C, its resistance is 100 ohms. The resistance of arms X, Y and Z are also 100 ohms each. At this temperature, the Wheatstone bridge is in balance. The sum of X and Y equals the sum of the bulb and Z."], "jumps": []}, {"id": "P1100", "text": ["When the resistance in a Wheatstone bridge is equal, the same amount of current flows in both sides of this parallel circuit and the voltage drop across side X equals the voltage drop across the bulb..."], "jumps": []}, {"id": "P1110", "text": ["When the voltages are equal, the voltage measurement from A to B is zero, and the temperature indicator reads zero. As the temperature of the bulb changes, the resistance changes causing the bridge circuit to be unbalanced..."], "jumps": []}, {"id": "P1120", "text": ["When the temperature of the bulb increases, its resistance increases. This unbalances the bridge circuit causing the needle to deflect to the right. As the bulb temperature decreases, the resistance decreases causing the needle to deflect to the left..."], "jumps": []}, {"id": "P1130", "text": ["The ratiometer is a temperature indicator that uses two coils in a balanced circuit. There are two types of ratiometer circuits: moving-coil and moving-magnet."], "jumps": []}, {"id": "P1140", "text": ["In the moving-coil ratiometer, the coils turn between the poles of a permanent magnet with an attached indicator needle. In the moving-magnet ratiometer, a small permanent-magnet rotor with an attached needle turns between two stationary coils..."], "jumps": []}, {"id": "P1150", "text": ["In the moving-coil ratiometer, when the temperature is low, the resistance in the bulb is low and more current flows through coil A and the bulb, than coil B and resistor R1. The resulting magnetic field pulls the needle to the low side..."], "jumps": []}, {"id": "P1160", "text": ["When the temperature is high, the resistance in the bulb is high and more current flows through coil B and resistor R1, than coil A and the bulb. The resulting magnetic field deflects the needle to the high side of the indicator dial..."], "jumps": []}, {"id": "P1170", "text": ["In the moving-magnet ratiometer, the two coils are stationary in the instrument, and the indicator needle fastens to the permanent-magnet rotor. The needle position is determined by how the permanent magnet aligns itself with the resultant flux of the two coils..."], "jumps": []}, {"id": "P1180", "text": ["We trace the current flow in the circuit, by starting at ground. Current flows up through the resistance bulb, centering potentiometer R5 and R6, to point D. Current through the left leg of the bridge is from ground through R1 to point A..."], "jumps": []}, {"id": "P1190", "text": ["Current then goes from point A through the lower part of the expansion and contraction potentiometer R2. It also goes from pin 2 of R2 through R4 to point D. The current from both legs combine and flow through R7 to the positive 28 volts..."], "jumps": []}, {"id": "P1200", "text": ["The restoring coil L2, resistor R3, and the upper part of potentiometer R2 forms a parallel path for current flow from point A to pin 2 of R2. Deflection coil L1 connects between points A and B..."], "jumps": []}, {"id": "P1210", "text": ["Any difference in potential between points A and B will cause current to flow through L1. Temperature changes sensed by the bulb cause a change in voltage at point B and causes a resultant current flow through the deflection coil L1..."], "jumps": []}, {"id": "P1220", "text": ["As the temperature changes, the resistance of the bulb changes, causing current to flow in the coils L1 and L2 creating resultant lines of flux that cause the permanent-magnet with its attached needle to move left or right..."], "jumps": []}, {"id": "P1230", "text": ["Thermocouple temperature indicators display the air temperatures in the heater duct of anti-icing systems, the exhaust gas temperature (EGT) of jet engines and cylinder head temperature (CHT) in reciprocating engines..."], "jumps": []}, {"id": "P1240", "text": ["A thermocouple is a junction or connection of two unlike metals. Strips of iron and Constantan (copper/nickel alloy) or Chromel and Alumel are normally used in thermocouple junctions."], "jumps": []}, {"id": "P1250", "text": ["As one junction becomes hotter than the other, an electromotive force is produced in the circuit. By including galvanometers in the circuit, this electromotive force can be measured. By calibrating the galvanometers dial, in degrees of temperature, it becomes a thermometer..."], "jumps": []}, {"id": "P1260", "text": ["The galvanometers in the indicator comprise the cold junction, while the hot junction of a thermocouple varies in shape, depending on its application. The common types of thermocouples are the gasket, bayonet and the screw-in..."], "jumps": []}, {"id": "P1270", "text": ["Cylinder head temperature (CHT) is normally measured by a gasket thermocouple. Rings of two dissimilar metals are pressed together, forming a spark plug gasket. The gasket is called the hot or measuring junction.."], "jumps": []}, {"id": "P1280", "text": ["A voltage proportional to the temperature difference between the junctions causes current to flow through the indicator. The indicator is a current measuring instrument that is calibrated in degrees Celsius or Fahrenheit..."], "jumps": ["P1270", "P1290"]}, {"id": "P1290", "text": ["Thermocouple leads are critical in makeup and length because the galvanometers are calibrated for a specific set of leads in the circuits. Crossed leads would cause the indicator needle to move off scale to the left..."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["High temperatures are measured on reciprocating and turbine engines using thermocouples made of Chromel and Alumel wires. On reciprocating engines, the thermocouple is mounted in the exhaust pipe within about six inches of the cylinder..."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["The exhaust gas temperature (EGT) indicating systems provide a visual temperature indication in the cockpit of the engine exhaust gases. Multi-engine aircraft contain two separate but identical EGT indicating systems, one for each engine..."], "jumps": ["P1300", "P1320"]}, {"id": "P1320", "text": ["Exhaust gas temperature (EGT) systems on turbine engines usually have 12 dual thermocouples arranged around the tail cone to sample the average EGT. Each instrument is a hermetically sealed unit with a single plug receptacle..."], "jumps": ["P1310", "P1330"]}, {"id": "P1330", "text": ["C. Internally, the indicator contains a simulated thermocouple cold junction with compensating resistors, a reference voltage source, and a DC-to-AC modulator."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["The thermocouples convert engine exhaust gas temperature into millivolts. The voltage is amplified and drives a small servomotor. The motor, in turn, drives the indicator pointer to display the exhaust gas temperature...", "#55 ++777777'7'777777+++++ 55555#####", "#55 +77''''OOOOOOOOOOO''''''7777++++ 55555#####", "1111111E1EEEEOOO'''''7777++++ 55555#####", "1111EEEOOO'''''7777++++ + 5 5555#####", "11E1EEEEOO''''''7777++++ 5 5555#####", "1111E1EEEOOO'''''7777++++ 5 555#####", "1111EEEEOOO'''''7777++++ 55555#####", "1111EEEEOOO'''''7777++++ + 5 5555#####", "11111EEEEOOO'''''7777++++ 5 5555#####", "11111EEEEOO'''''7777++++ + 5 5555#####", "11E1EEEEOOO'''''7777++++ 5 5555#####"], "jumps": ["P1330", "P1350"]}, {"id": "P1350", "text": ["Turbine inlet temperature (TIT) is the most critical temperature in a turbine engine. However, TIT is difficult to measure due to the high temperatures and high velocity of gases passing through the first stage of the turbine..."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["Turbine inlet temperature (TIT) indicator systems provide a visual indication of temperatures entering the turbine. Monitoring TIT while starting an engine can prevent a \"HOT START\"."], "jumps": ["P1350", "P1370"]}, {"id": "P1370", "text": ["All parts of the engine temperature measurement system are made of Chromel and Alumel material, including welds. Special wiring and wire identification are in the aircraft from the thermocouple harness terminal block to the indicator..."], "jumps": ["P1360", "P1380"]}, {"id": "P1380", "text": ["Plugs in the thermocouple circuits are also of a special type and can't be altered. The thermocouple harness mounts on the turbine unit aft of the thermocouple. The harness includes separate leads for each of the 18 thermocouples...."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["Electrical signals from the 18 dual-junction thermocouples are averaged within the harness. Since the average voltage of the thermocouples represents the TIT, a special wiring harness is used to prevent signal interference from other sources..."], "jumps": ["P1380", "P1400"]}, {"id": "P1400", "text": ["The TIT indicator contains a bridge circuit with cold junction compensation, a two-phase motor to drive the pointer, and a feedback potentiometer. A Zener voltage reference circuit, a chopper circuit, an amplifier, power supply, a power-off flag, and an over-temp warning light are also included..."], "jumps": ["P1390", "P1410"]}, {"id": "P1410", "text": ["The indicator scale is calibrated from 0", "C in 2-degree increments. The bridge circuit output is amplified and fed to the variable field of the two-phase motor..."], "jumps": ["P1400", "P1420"]}, {"id": "P1420", "text": ["The two-phase motor in the TIT system is similar to the moving-magnet ratiometer. The flux from the variable field positions the magnetic rotor with the attached main pointer to indicate the turbine inlet temperature..."], "jumps": ["P1410", "P1430"]}, {"id": "P1430", "text": ["What are the two types of metal used in the construction of exhaust gas temperature system thermocouples?"], "jumps": ["P1420"]}, {"id": "P1431", "text": [], "jumps": []}, {"id": "P1432", "text": ["Copper and nickel are used in low temperature thermocouple systems."], "jumps": []}, {"id": "P1440", "text": ["What is the most critical temperature measurement in a gas turbine engine?"], "jumps": []}, {"id": "P1441", "text": [], "jumps": []}, {"id": "P1442", "text": ["Cylinder Head Temperature is measured on reciprocating engines."], "jumps": []}, {"id": "P1443", "text": ["Normally when the EGT is within limits, the TIT is also within limits. However, TIT is considered the most critical temperature."], "jumps": []}, {"id": "P1450", "text": ["Fuel flow indicating systems provide a continuous indication of the rate of fuel delivery to the engine. The rate of flow is in pounds or gallons per hour. Some fuel system indicators also show the amount of fuel remaining in the tanks..."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["A typical fuel flowmeter consists of a transmitter and an indicator. The measurements are transmitted electrically to the panel-mounted indicator. Some fuel flowmeter systems are similar to the basic Autosyn (Synchro) systems..."], "jumps": ["P1450", "P1470"]}, {"id": "P1470", "text": ["The fuel flow transmitter is a two-in-one unit: a fuel-measuring mechanism (or meter) and a synchro transmitter. The fuel enters the inlet port of the transmitter and flows against the vane, causing the vane to swing..."], "jumps": ["P1460", "P1480"]}, {"id": "P1480", "text": ["The spiral fuel chamber design allows the distance between the vane and chamber wall to become increasingly larger as fuel flow increases. This device measures the fuel mass (volume and density) flow...", "9{???{ AAAAj33]]//NNBUU!!!!UBBN//]33jAk.?", "?V888{ TAAj33]]//NNBUU!!!!UBBN//]33jATk{D\"", "=Dk000000000000000000000000 0 0 kXk1PKLD??k"], "jumps": ["P1470", "P1490", "P", "Pjj3", "Pi"]}, {"id": "P1490", "text": ["A calibrated hairspring retards the motion of the vane. The vane ceases motion when the forces exerted on it by the hairspring and by the fuel are equal."], "jumps": ["P1480", "P1500"]}, {"id": "P1500", "text": ["The rotor shaft of the synchro transmitter connects to a bar magnet. A ring magnet is attached to the vane shaft and moves when the vane shaft moves. The transmitter-mounting frame forms a liquid-tight seal between the magnets..."], "jumps": ["P1490", "P1510"]}, {"id": "P1510", "text": ["The bar magnet and ring magnet move in unison because the two magnets are magnetically coupled. The south pole of the ring magnet is opposite the north pole of the bar magnet."], "jumps": ["P1500", "P1520"]}, {"id": "P1520", "text": ["As fuel flows, the vane shaft with its attached ring magnet moves, magnetically moving the bar magnet. This action results in corresponding movement of the synchro rotor."], "jumps": ["P1510", "P1530"]}, {"id": "P1530", "text": ["Therefore, the angular displacement of the vane in relation to the fuel chamber housing determines the synchro rotor movement with respect to the stator windings. The stator windings of the synchro transmitter are attached to the electrical connector..."], "jumps": ["P1520", "P1540"]}, {"id": "P1540", "text": ["A wire harness connects the output of the synchro transmitter to the fuel flow indicator on the instrument panel in the cockpit. The remote-indicating instrument consists of a synchro receiver, a step-up gear train, a magnetic drag cup, and a calibrated spring..."], "jumps": ["P1530", "P1550"]}, {"id": "P1550", "text": ["When fuel flows through the fuel flow transmitter, an electrical signal goes to the indicator receiver. This signal drives the synchro rotor with its attached pointer to the proper position and indicates the rate of fuel flow..."], "jumps": ["P1540", "P1560"]}, {"id": "P1560", "text": ["Computerized fuel systems use a small turbine rotor transducer mounted in the fuel line between the flow divider and the fuel injection nozzles."], "jumps": ["P1550", "P1570"]}, {"id": "P1570", "text": ["Fuel flowing to the cylinders must pass through the turbine, which spins at a speed proportional to the rate of fuel flow."], "jumps": ["P1560", "P1580"]}, {"id": "P1580", "text": ["As the turbine spins, it breaks a beam of light between a phototransistor and a light-emitting diode. The interrupted beam of light is converted into pulses of electricity, which are processed by a computer and displayed on the fuel flow indicator..."], "jumps": ["P1570", "P1590", "Pb"]}, {"id": "P1590", "text": ["Fuel flow indicating systems provide a continuous indication of the rate of fuel delivery to the engine. The rate of flow is in _______"], "jumps": []}, {"id": "P1591", "text": [], "jumps": []}, {"id": "P1592", "text": ["Fuel flow systems indicated flow rates in pounds per hour.."], "jumps": []}, {"id": "P1600", "text": ["What fuel flow system uses photo-transducers to measure the rate of fuel?"], "jumps": []}, {"id": "P1601", "text": [], "jumps": []}, {"id": "P1602", "text": ["Single fuel flow indicating systems utilize an Autosyn (Synchro) system."], "jumps": []}, {"id": "P1603", "text": ["Volume type fuel flow indicating systems utilize an Autosyn (Synchro) system."], "jumps": []}, {"id": "P1610", "text": ["The fuel flowmeter most accurately indicates fuel consumption in reciprocating aircraft engines because it can be cross-checked with the electronic fuel quantity indicator."], "jumps": ["P1600", "P1620"]}, {"id": "P1620", "text": ["The fuel flowmeter used with a continuous-fuel injection system installed on an aircraft horizontally opposed reciprocating engine measures the pressure drop across the fuel injector nozzles..."], "jumps": ["P1610", "P1630"]}, {"id": "P1630", "text": ["The pressure drop across the injector nozzles is a function of the volume of fuel flowing through them. If one of the injector nozzles were clogged, the pressure drop would increase indicating a false increase in fuel flow..."], "jumps": ["P1620", "P1640"]}, {"id": "P1640", "text": ["Maintenance technicians must follow published procedures to ensure aircraft fuel, oil and hydraulic fluids remain free of contaminants."], "jumps": ["P1650", "P1630"]}, {"id": "P1650", "text": ["Aircraft instruments can only be calibrated and repaired by the manufacturer or an FAA certificated repair station. A certificated mechanic with airframe and powerplant ratings may NOT repair or alter any aircraft instrument..."], "jumps": ["P1640", "P1660"]}, {"id": "P1660", "text": ["Certificated mechanics can perform 100-hour inspections on instruments. Routine inspections are preventative maintenance procedures that can identify loose screws, improper grounding or cracks in the instruments...", "\"\"MMmmm8Zo11 ggB6b6bbbbbbbbbbbbbbbbbbbbbbb", "bbbbbbbbbbbbbb66bOI ,8>UUUUUUUUUMMUUUUUUUUt"], "jumps": ["P1650", "P1670"]}, {"id": "P1670", "text": ["Many aircraft instruments have colored range marks to let the flight crew instantly know whether a particular system or component is operating in a safe and optimum range or unsafe range...", "MARK DEFINITION Green Arc Normal Operating Range Yellow Arc Caution Range White Arc Special Operations Range Red Arc Prohibited Range Red Radial Line Do Not Exceed indication Blue Radial line Special Operating Conditionn"], "jumps": ["P1680", "P1660"]}, {"id": "P1680", "text": ["The technician installing an instrument is responsible for ensuring the instruments are properly installed and marked for that particular aircraft. The range marking for temperature indicators of reciprocating engines are defined below...", "INSTRUMENT RANGE MARKING Carburetor Air Temperature (CAT) Green Arc Normal Operating Range Yellow Arc Range where carburetor ice is most likely to form. Red Radial Line Maximum allowable inlet air temperature. Carburetor Head Temperature (CHT) Green Arc Normal Operating Range Yellow Arc Operation approved for limited time. Red Radial Line Never-Exceed Temperature"], "jumps": []}, {"id": "P1690", "text": ["The range marking for temperature indicators turbine engines are defined below. below.", "INSTRUMENT RANGE MARKING Exhaust Gas Temp. (EGT,Turbine Engine) Green Arc Normal Operating Range Yellow Arc Precautionary Range Red Radial Line Maximum permissible rotational speed Oil Temperature Gage Green Arc Normal Operating Range Yellow Arc Precautionary Range Red Radial Line Maximum and/or Minimum permissible oil temperature."], "jumps": []}, {"id": "P1700", "text": ["Aircraft instrument shape and size will vary with the type of aircraft and the manufacturer."], "jumps": []}, {"id": "P1710", "text": ["Instruments that have range markings on the glass rather than on the dial, must have a white slip mark to show if the glass has slipped in the case. The white slip mark is painted across the bezel onto the glass at the bottom of the instrument..."], "jumps": []}, {"id": "P1720", "text": ["If the glass in an instrument slips, the range markings on the glass will be out of alignment with the numbers on the dial and the slip mark will be broken warning the pilot the instrument is no longer aligned..."], "jumps": []}, {"id": "P1730", "text": ["The technician installing aircraft instruments in an instrument panel is responsible to ensure the instruments are secure in their mounting and that all attached hoses and wires are in good condition and do not interfere with any of the flight controls..."], "jumps": []}, {"id": "P1740", "text": ["Most electrical instruments are mounted in steel or iron cases to prevent interference from nearby magnetic fields. Lines of magnetic flux do not flow through steel or iron, and are entrapped in these types of cases..."], "jumps": []}, {"id": "P1750", "text": ["Remember, aircraft instruments can only be repaired or altered by the manufacturer or an FAA certified repair station approved for that particular instrument. Replacing range marks, tightening loose screws, tightening leaking B nuts in the plumbing and touching up chipped case paint are not considered to be repairs or alterations....."], "jumps": []}, {"id": "P1760", "text": ["perform 100-hour inspections of aircraft instruments.", "make minor repairs to aircraft instruments.", "A certificated mechanic with an airframe and powerplant ratings can _______."], "jumps": ["P1750"]}, {"id": "P1761", "text": [], "jumps": []}, {"id": "P1762", "text": ["Only a certificated repair station or the manufacturer can repair or alter aircraft instruments."], "jumps": []}, {"id": "P1770", "text": ["Which of the following instrument problems can be corrected by a certificated aviation mechanic?"], "jumps": ["P1760"]}, {"id": "P1771", "text": [], "jumps": []}, {"id": "P1772", "text": ["Only certificated repair stations can repair or alter aircraft instruments.", "CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC C C", "C CC CC d d ddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd dddddd dd dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd dddddd ddd ddd dddd ddd d dddddd dd dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd", "dd ddddd d dd d d dd d d ddd d ddddddddd dd dd d d dddddd??dddddddddddddddddddddddddddddddddddddddddd?ddd?d ddd dd?dd??dddd", "d dddddddddddddddd dd?????", "??ddd dd dddd ddddddd ddd ddddd???d ddd?dd?ddd ddd?ddd d???d?dd??????????", "?dd ddd?d dddd dd d d d? d d d dd dddd d"], "jumps": []}, {"id": "P1910", "text": ["You have completed the information on TEMPERATURE AND FUEL FLOWMETER INSTRUMENTS."], "jumps": ["P1770", "P1001"]}, {"id": "P1920", "text": ["1. Aircraft temperature and fuel flow systems instruments provide indications of whether the specific system is performing within its normal operating range.."], "jumps": ["P1001", "P1930"]}, {"id": "P1930", "text": ["2. Cylinder head temperature is normally measured by a gasket thermocouple. Rings of two dissimilar metals are pressed together, forming a spark plug gasket. The gasket is called the hot or measuring junction.."], "jumps": ["P1920", "P1940"]}, {"id": "P1940", "text": ["3. Turbine inlet temperature (TIT) is the most critical temperature in a turbine engine. However, TIT is difficult to measure due to the high temperatures and high velocity of gases passing through the first stage of the turbine..........."], "jumps": []}, {"id": "P1950", "text": ["4. All parts of the engine temperature measurement system are made of Chromel and Alumel material, including welds. Special wiring and wire identification are in the aircraft from the thermocouple harness terminal block to the indicator.."], "jumps": []}, {"id": "P1960", "text": ["5. Fuel flow indicating systems provide a continuous indication of the rate of fuel delivery to the engine. The rate of flow is in pounds or gallons per hour. Some fuel system indicators also show the amount of fuel remaining in the tanks."], "jumps": []}, {"id": "P1970", "text": ["6. Aircraft instruments can only be calibrated and repaired by the manufacturer or an FAA certificated repair station. A certificated mechanic with airframe and powerplant ratings may not repair or alter any aircraft instrument.."], "jumps": []}, {"id": "P1980", "text": ["7. The technician installing an instrument is responsible for ensuring the instruments are properly installed and marked for that particular aircraft.."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": []}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["This experiment introduces temperature indicating system measurement transducers.to the semiconductor industry. Usually, four strain-sensitive resistors are ion implanted on a silicon wafer in a Wheatstone-bridge configuration..."], "jumps": []}, {"id": "P2022", "text": ["Solid-state transducers are fabricated using silicon-processing techniques similar to the semiconductor industry. Usually, four strain-sensitive resistors are ion implanted on a silicon wafer in a Wheatstone-bridge configuration.This experiment introduces temperature indicating system measurement transducers..."], "jumps": []}, {"id": "P2030", "text": ["In electronics, any component with resistance will heat up as current flows through it, due to the I R effects. In the case of heat generators, this effect is a desired result."], "jumps": []}, {"id": "P2040", "text": ["All resistive components have a property called Thermal Resistance ( R), which equates electrical watts to the temperature within the core of the device (or at the P-N junction of a solid-state component)."], "jumps": []}, {"id": "P2050", "text": ["The Thermal Resistance rating for any component, describes how hot the component will become for each watt of electrical power that is applied to it, as indicated by the junction temperature dissipation equation: T = T + ( R x P )", "Where: T is the junction (P-N) or core temperature of the component T is the ambient temperature P is the power dissipationn P is the power dissipation"], "jumps": ["P"]}, {"id": "P2060", "text": ["For example, a resistor is rated for an R (Thermal Resistance) of 20", "C/watt. If the resistance equals 10 ohms, with 10 volts applied, what is the core temperature of the component at 20"], "jumps": ["P2020", "P2070"]}, {"id": "P2070", "text": ["In our example, the component will heat 20", "C above ambient for every watt applied. With 10 watts applied, its core temperature (T ) rises 200"], "jumps": ["P2060", "P2080"]}, {"id": "P2080", "text": ["Resistive components heat up with electrical power (watts) applied, and have a maximum internal temperature rating. Above this rating, the component will fail due to structural limitations.", "Where: = Maximum device allowable wattage T = Maximum core temperature of component (given by manufacturer)", "T = Maximum core temperature of component (given by manufacturer))", "Where: P = Maximum device allowable wattage", "T = Maximum core temperature of component (given by manufacturer)rer)"], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["For the example of a 10-ohm resistor rated for 300", "C/Watt. We solve P for the 10-ohm resistor to equal 14 watts."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["Notice in the maximum device power equation, the ambient temperature affects component wattage ratings directly. As TA increases, (T - T ) decreases, causing a decrease in P ."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["Whether a component is used as a heater or is simply creating heat as a by-product, heat at the core serves no useful purpose and must be dissipated to the surrounding environment usually with a \"heat sink\"..."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["Heat sinks lower the core temperature of the heat generator and facilitate heat transfer to the surrounding environment. We use the core-to-air thermal resistance equation to calculate heat dissipation.", "jc = thermal resistance core to case (with heat sink)))", "cs = thermal resistance heat sink (with heat sink)", "sa = thermal resistance heat sink to air (heat sink))", "ja = thermal resistance care to air (with heat sink) jc = thermal resistance caore ti case (with heat sink) cs = thermal resistance heat sink (with heat sink) sa = thermal resistance heat sink to air (heat sink)", "ja = thermal resistance core to air (with heat sink) jc = thermal resistance caore ti case (with heat sink) cs = thermal resistance heat sink (with heat sink) sa = thermal resistance heat sink to air (heat sink)"], "jumps": ["P2110", "P2130"]}, {"id": "P2130", "text": ["The core-to-air thermal resistance equation indicates that thermal resistance from the junction (core) to air is the sum of the heat transfers from one intermediate material to another with heat sinks used..."], "jumps": ["P2120", "P2140"]}, {"id": "P2140", "text": ["Heat flows from core-to-air through various materials. Each intermediate material will heat up due to its rated thermal resistance that will help reduce the T (P-N junction) temperature.."], "jumps": ["P2130", "P2150", "P"]}, {"id": "P2150", "text": ["Using an example of a 10 ohm resistor, if the resistor dissipates 10 watts with the following thermal resistance (at T = 20", "C): We can calculate the heat distribution through each material as follows:"], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["The majority of temperature sensor outputs must be raised to useful analog levels for aircraft applications. Often, these analog signals are converted to digital signals for glass cockpit displays."], "jumps": ["P2150", "P2170"]}, {"id": "P2170", "text": ["Thermocouple sensors are connected to temperature instruments by a wiring harness of specific length and wire type. To reduce the effects of Electromagnetic interference (EMI) in the harness, the Differential Amplifier is employed..."], "jumps": []}, {"id": "P2180", "text": ["Notice that the differential amplifier is used to boost the signal from the thermocouple. Noise generated on the wiring harness is canceled due to the common-mode rejection ratio (CMRR) features of the amplifier..."], "jumps": []}, {"id": "P2190", "text": ["Notice that two sensors are used in a Wheatstone bridge differential measurement device. The reference sensor is in one leg while the remote sensor is in the other. In this case, V is proportional to the difference in temperature between the sensors."], "jumps": []}, {"id": "P2200", "text": ["IC temperature transducers are commonly used in temperature measurement and control systems. The IC transducer produces an output current proportional to absolute (Kelvin) temperature and is fed into a temperature detector circuit to produce a DC voltage output...", "BB! BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBA", "B@@BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB@@BBBB' #BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBA"], "jumps": []}, {"id": "P2202", "text": ["Press CTRL+S on the keyboard to display the schematic for the PC130-189 card. utput current proportional to absolute (Kelvin) temperature and is fed into a temperature detector circuit to produce a DC voltage output..."], "jumps": []}, {"id": "P2210", "text": ["The detector circuit uses a precise voltage to establish reference and stability for the DC voltage output. A 2.5 VDC regulated reference voltage from (U1) is sent to the ZERO potentiometer (R8), which compensates for circuit variations..."], "jumps": []}, {"id": "P2220", "text": ["A dual voltage compensator (U3) and a D-Type flip-flop (U4) are used for Fan Control. One comparator (U3B) turns the fan ON while the second comparator (U3A) turns the fan OFF."], "jumps": []}, {"id": "P2230", "text": ["Two variable resistors R13 (OFF) and R14 (ON) are used to select the voltage that is translated into temperature to control the operation of the fan. When the transducer reaches a set temperature the fan will turn on..."], "jumps": []}, {"id": "P2240", "text": ["The outputs of the comparators (Pin 1 of U3A and Pin 7 of U3B) are tied to the SET (Preset) and RESET (Clear) inputs of flip-flop U4A."], "jumps": ["Pin", "Preset"]}, {"id": "P2250", "text": ["When U4A is SET (Q = HIGH) and switch S1 is in the manual position, Q1 turns ON, placing a LOW on DS2 (Fan On indicator) and M1 (Fan). With a LOW applied to the indicator and fan, both of them become active..", "3666666666666666666666666666666666666666666666666666666666666666666666666666666666666666666666666666644663566666666666666666666666666666666666666666666666666666666645555555 666 66652666666666666666666666666666666666666666666666635366446"], "jumps": []}, {"id": "P2260", "text": ["When U4A is RESET (Q = LOW) and switch S1 is in the manual position, Q1 turns OFF, placing a HIGH on DS2 (Fan On indicator) and M1 (fan). With a HIGH applied, both the indicator and the fan turn OFF...", "3666666666666666666666666666666666666666666666666666666666666666666666666666666666666666666666666666644663566666666666666666666666666666666666666666666666666666666645555555 666 66652666666666666666666666666666666666666666666666635366446"], "jumps": []}, {"id": "P2270", "text": ["In this experiment, you will use a resistive thermal generator (resistor) as the heat source and a temperature transducer as the heat sensor to view and measure temperature."], "jumps": []}, {"id": "P2280", "text": ["You will use the PC130-189 experiment card to perform measurements and observations of a temperature measurement system, and read the digital temperature display on the PC130-190 experiment card."], "jumps": []}, {"id": "P2290", "text": ["Closely examine the PC130-189 experiment card and observe the location of the temperature transducer (heat sensor), resistive thermal generator (heater), fan, test points, switches, and controls..."], "jumps": []}, {"id": "P2300", "text": ["Set the test console controls to the initial control settings.ings........."], "jumps": []}, {"id": "P2310", "text": ["Carefully plug PC130-189 in the PC1 position and PC130-190 in the PC2 position."], "jumps": []}, {"id": "P2320", "text": ["Press Enter to set: Positive Supply Voltage - 12 Negative Supply Voltage - 122"], "jumps": []}, {"id": "P2330", "text": ["On PC130-189, set S1 to MICROPROC, adjust R6 to mid-range, and adjust R12 fully counterclockwise (CCW)."], "jumps": ["P2340"]}, {"id": "P2340", "text": ["On PC130-190, set S1 to C/I................................"], "jumps": []}, {"id": "P2350", "text": ["Press Enter to set PC1 and PC2 DC power switches - ON. PC2 DC Power switch - ON"], "jumps": []}, {"id": "P2360", "text": ["Adjust R8 on PC130-189 to read +2.5 VDC with the multimeter at TP6 on PC130-189. The R8 adjustment zeros the temperature transducer (heat sensor) to an approximate room (ambient) temperature of 25"], "jumps": []}, {"id": "P2370", "text": ["Adjust R13 on PC130-189 to read +4.0 VDC (", "0.05 VDC) with the multimeter at TP10 on PC130-189. The R13 adjustment establishes the low limit (fan Off) at 40"], "jumps": ["P2360", "P2380"]}, {"id": "P2380", "text": ["Adjust R14 on PC130-189 to read +4.5 VDC (", "0.05 VDC) with the multimeter at TP11 on PC130-189. The R14 adjustment establishes the high limit (fan On) at 45"], "jumps": []}, {"id": "P2390", "text": ["Using the multimeter verify, the control output voltage at TP6 on PC130-189. This voltage represents the temperature control output at ambient temperature."], "jumps": []}, {"id": "P2400", "text": ["Multiplying the temperature control output of 2.5 VDC by ten results in an ambient temperature of 25", "C. Adjust R1 on PC130-190 until the digital temperature display indicates 25"], "jumps": []}, {"id": "P2410", "text": ["Set S1 on PC130-189 to MAN.e..............................."], "jumps": []}, {"id": "P2420", "text": ["Slowly adjust R12 clockwise (CW) on PC130-189 until the HEATER ON LED illuminates. Adjust R12 no further than necessary to cause the LED to come up to full brightness. R12 adjusts the heating rate of R4...", "NOTE: An adjustment to R12 may be required if the temperature, as shown on the tempature display, does not decrease (or stops decreasing) while the fan is rotating. If this happens, adjust R12 slightly CCW, ensuring that the HEATER ON LED does not go out. This will reduce the current going to the heater (R4) and allow the fan to continue cooling the heater", "NOTE: An adjustment to R12 may be required if the temperature, as shown on the tempature display, does not decrease (or stops decreasing) while the fan is rotating. If this happens, adjust R12 slightly CCW, ensuring that the HEATER ON LED does not go out. This will reduce the current going to the heater (R4) and allow the fan to continue cooling the heater.", "DO NOT TOUCH R4 ( THE HEATING RESISTOR UNDER THE FAN) OR PLACE YOUR FINGERS OR OBJECTS IN THE FAN"], "jumps": []}, {"id": "P2430", "text": ["When the PC130-189 fan is rotating, record the maximum temperature as shown on the PC130-190 display under the #1 TEMP", "C FAN ON. Note this may take a few minutes to occur.", "If the digital temperature display does not show a reduction in temperature, adjust R12 on PC130-189 counterclockwise (CCW) slightly to reduce the heating rate of R4.."], "jumps": ur."], "jumps": []}, {"id": "P2481", "text": [], "jumps": []}, {"id": "P2482", "text": ["Make sure that you are measuring at TP6.ith a negative sign.............."], "jumps": []}, {"id": "P2487", "text": ["Your measurements are still incorrect. You should have measured: 4.0 VDC to 4.9 VDC."], "jumps": ["PutVar"]}, {"id": "P2490", "text": ["Notice the plot of your voltage readings in the graph below. The graph shows a linear relationship between the voltage output of the temperature detector circuit and the temperature measured in degrees Celsius..."], "jumps": []}, {"id": "P2500", "text": ["Adjust R12 on PC130-189 fully counterclockwise (CCW) to turn off the heater."], "jumps": []}, {"id": "P2510", "text": ["Adjust R13 on PC130-189 clockwise (CW) until the FAN ON LED turns OFF."], "jumps": []}, {"id": "P2520", "text": ["Using the multimeter, measure the output of the fan controller at TP1 on PC130-189 and enter the result in the VOLTAGE column TP1 FAN OFF."], "jumps": ["P2522"]}, {"id": "P2521", "text": [], "jumps": []}, {"id": "P2522", "text": ["Make sure that you are measuring at TP1.P1...1.your set - up at TP1.1...."], "jumps": []}, {"id": "P2527", "text": ["Your answer is still incorrect. You should have measured between 0 VDC to 1 VDC."], "jumps": ["PutVar"]}, {"id": "P2530", "text": ["Using the multimeter, measure the output of the fan voltage at TP3 on PC130-189 and enter the result in the VOLTAGE column TP3 FAN OFF."], "jumps": ["P2532"]}, {"id": "P2531", "text": [], "jumps": []}, {"id": "P2532", "text": ["Make sure that you are measuring at TP3.ith a negative sign.............."], "jumps": []}, {"id": "P2537", "text": ["Your answer is still incorrect. You should have measured between 10 VDC to 12 VDC."], "jumps": ["PutVar"]}, {"id": "P2540", "text": ["Adjust R14 on PC130-189 fully counterclockwise (CCW). The fan should be rotating."], "jumps": []}, {"id": "P2550", "text": ["Using the multimeter, measure the output of the fan controller at TP1 on PC130-189 and enter the result in the VOLTAGE column for TP1 FAN ON."], "jumps": ["P2552"]}, {"id": "P2551", "text": [], "jumps": []}, {"id": "P2552", "text": ["Make sure that you are measuring at TP1..th a negative sign.............."], "jumps": []}, {"id": "P2557", "text": ["Your answer is still incorrect. You should have measured between 8 VDC to 12 VDC."], "jumps": ["PutVar"]}, {"id": "P2560", "text": ["Using the multimeter, measure the output of the fan controller at TP3 on PC130-189 and enter the result in the VOLTAGE column for TP3 FAN ON."], "jumps": ["P2562"]}, {"id": "P2561", "text": [], "jumps": []}, {"id": "P2562", "text": ["Make sure that you are measuring at TP3.ith a negative sign.............."], "jumps": []}, {"id": "P2567", "text": ["Your answer is still incorrect. You should have measured between 8 VDC to 11 VDC."], "jumps": ["PutVar"]}, {"id": "P2570", "text": ["Monitoring the voltages at PC130-189 TP1 and TP3 test points provide an operational assessment of the fan motor section of the temperature control system."], "jumps": []}, {"id": "P2580", "text": ["Let's look at some troubleshooting procedures used to localize faults in the temperature indicating system. First, check for a proper digital display, FAN ON LED, and whether the motor is operating..."], "jumps": ["P2590", "P2570"]}, {"id": "P2590", "text": ["The second step is to isolate the fault. Take voltage measurements of the suspected circuitry to locate the proper faulted circuit."], "jumps": []}, {"id": "P2600", "text": ["0.05 VDC with the multimeter at TP10 on PC130-189. This adjustment establishes the low limit (fan off) at 40"], "jumps": []}, {"id": "P2610", "text": ["0.05 VDC with the multimeter at TP11 on PC130-189. This adjustment establishes the upper limit (fan on) at 45"], "jumps": []}, {"id": "P2620", "text": ["DO NOT adjust R12 on PC130-189 at this time. It should be fully CCW with the heater OFF."], "jumps": ["P2630", "P2610"]}, {"id": "P2630", "text": ["Press Enter to allow the compu let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
