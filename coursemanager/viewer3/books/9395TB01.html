const book = {"title": "9395TB01", "pages": [{"id": "P13040", "text": ["This experiment demonstrates the operation of three phase lock loop configurations along with the phase detection and error amplification sections."], "jumps": ["P13050", "P2001"]}, {"id": "P2612", "text": ["ncy Adjust potentiometer for approxima for 200 kHz signal as seen on TP1 on PC130-224. On the PC130-224 adjust the Frequency Adjust potentiometer for approximately 200 kHz signal as seen on TP1 on the PC130-224", "28. On the PC130-224 adjust the Frequency Adjust potentiometer for approximately 200 kHz signal as seen on TP1 on the PC130-224.224 adjust the Frequency Adjust potentiometer for approximately 200 kHz signal as seen on TP1 on the PC130-22444444", "You skipped X question(s). Do you want to _________", "The test is complete and your score is XX%. Do you want to _________", "You have successfully passed the assessment test!", "Are you sure you want to Bookmark the Lesson?", "Are you sure you want to Exit the Lesson?"], "jumps": ["PutVar"]}, {"id": "P13140", "text": ["2. Carefully plug PC130-224 into the Test Console PC1 position. PC130-224 is going to supply the reference input signal to the PLL Detector and Error Amplifier on PC130-225."], "jumps": ["P13150", "P2340"]}, {"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: PHASE LOCK LOOPsdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": ["# #\" #& \"\"# &\"###2' &2#&.22&# 25--283-.#285255232/238882-.-5:38832222882282-213:22::82-22225:8-33-22282232.22258558.5822385:235:222283538::2585582::2:", "&&#&# #/2.#.& -8 \"#.-&23..22'/.#212&-2258\"588:52", "### ## /# #/&# \" \"/##\"#/&//..#/..&/28.&...&824/&.88-8588..2222858852.28:582228588358282228258.888:825:583.8828::8228828588828583:35558.555.85::88::85588:88:5555::38::85:::5:5:52::85::88::", ":85:855::83:5:5.5:55:855:52.5:5283822242348522...252...2..82/.4..22//2./..##/.8.#&./#&/..##// ##\",##/## #. / /& # ## ## ## ## ## \" #/# ## /# ## #.\" ./ #//###,//.&/#.\"#/.##/./#&/2.&/.../&//....//&2222.2/252.&28.8522582.824828828::255:::5:", "/,,,,,,,,,,,,,/, ,, ,,,,,,6, ,,,6,,, ,,,,,//6//6,,,,/6/,,,/,4/,,/6/4494,,494/6846446/4884664;44;889448489888<8648<<8;44;88988<88948;98<44<;:<44<<8;44<48<<8;48<48<88;48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Describe phase lock loop circuits to the block diagram level. w Describe phase lock loop FM demodulators. w Define phase lock loop circuitry. w Describe the operation of a phase lock loop detector circuit. w Describe the operation of a phase lock loop error amplifier circuit.cuit....", "w Observe the operation of a phase lock loop system configured as a band pass filter, FM Demodulator, and a Frequency Synthesizer....."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 440 Function Generator XXXXXnt"], "jumps": []}, {"id": "P301", "text": [], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P331", "text": [], "jumps": ["P", "Pss"]}, {"id": "P332", "text": [], "jumps": []}, {"id": "P400", "text": ["The phase lock loop circuit is a very versatile and interesting electronic circuit. Reference Phase Low Pass Comparator Filter Voltage Controlled Oscillator"], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["This circuitry has opened up a new world in consumer electronics and communications equipment."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Phase lock loop systems can be configured as frequency multipliers and dividers, FM demodulators and bandpass filters."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["It is important that you learn how the circuits operate as you will encounter them many times in your electronics career."], "jumps": ["P460", "P400"]}, {"id": "P460", "text": ["Let's begin the lesson on PHASE LOCK LOOP................................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Most phase lock loop (PLL) circuits are complex and constructed of many components. Integrating the circuit saves a lot of space and simplifies troubleshooting."], "jumps": ["P1030", "P1001", "PLL"]}, {"id": "P1030", "text": ["Since most PLL circuits are in chips, a block diagram and pin out description is all that is needed for circuit analysis."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The basic function of a phase lock loop circuit is to compare the phase and frequency of an oscillator signal with the phase and frequency of an input signal."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The principle component of the circuit is the phase comparator which uses two inputs; one is from a VCO (voltage controlled oscillator) and one is a reference signal."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["An output is produced by the phase comparator based on the phase or frequency of the two inputs. The comparator output is a square wave and is called the comparison signal.", "F xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", "wwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww v xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx !", "& xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["The comparison signal is filtered by a low pass filter which creates a smooth DC voltage. The voltage is boosted by an amplifier and sent to the VCO."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["The output signal from the VCO can be a sine wave, sawtooth or square wave. The signal from the VCO to the comparator, the comparator to the low pass filter, low pass filter to amplifier, and amplifier to VCO form a closed loop.", "{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{ #", "# {{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{{xx"], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["Because the circuit is a closed loop, you can begin signal tracing anywhere within the system."], "jumps": ["P1100", "P1050"]}, {"id": "P1100", "text": ["A closed loop system does not alter the input signal. The reference signal and signal from the VCO combine forming a third signal, the comparison signal."], "jumps": ["P1110", "P1050"]}, {"id": "P1110", "text": ["You should note that feedback is not used. Feedback alters the input signal in oscillators and operational amplifiers."], "jumps": ["P1120", "P1050"]}, {"id": "P1120", "text": ["What is the phase comparator's function?...................", "Ensure that the comparison signal is a smooth DC voltage.", "Produce an output signal based on the phase and frequency of the input signals."], "jumps": ["P1050"]}, {"id": "P1121", "text": [], "jumps": []}, {"id": "P1122", "text": ["The phase comparator does not separate the input signals. It compares the two input signals and produces an output."], "jumps": []}, {"id": "P1123", "text": ["The low pass filter produces a DC voltage.................."], "jumps": []}, {"id": "P1130", "text": ["What type of signal does the low pass filter produce?......"], "jumps": ["P1120"]}, {"id": "P1131", "text": [], "jumps": []}, {"id": "P1132", "text": ["Sinewaves and square waves are input signals to the comparator. The comparator also produces a square wave output that is fed to the input of the low pass filter."], "jumps": []}, {"id": "P1140", "text": ["Now that we have identified each block's main purpose let's look at the system closer and see how the signals are used."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["Since the PLL system is a closed loop we can start with the VCO. The voltage controlled oscillator creates an output signal after receiving a DC voltage input."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["The output frequency is controlled by the value of the DC voltage, therefore, a VCO has an output frequency that is proportional to it's input voltage."], "jumps": ["P1170", "P1140"]}, {"id": "P1170", "text": ["The output of the VCO is fed to one input of the phase comparator, where it is compared to a reference signal."], "jumps": ["P1180", "P1140"]}, {"id": "P1180", "text": ["The reference signal is also an input to the phase comparator. It can be sent from another oscillator, FM signal source, or the likes."], "jumps": ["P1190", "P1140"]}, {"id": "P1190", "text": ["If the frequency of the VCO is different from the reference signals frequency, the phase comparator creates an error signal or comparison signal."], "jumps": ["P1200", "P1140"]}, {"id": "P1200", "text": ["The comparison signal is a square wave with negative and/or positive pulses, depending upon whether the VCO frequency is higher or lower than the reference input frequency."], "jumps": ["P1210", "P1140"]}, {"id": "P1210", "text": ["The output from the phase comparator is applied to a low pass filter."], "jumps": ["P1220", "P1140"]}, {"id": "P1220", "text": ["Its function is to convert the comparison signal from the comparator to a smooth DC signal, which allows the VCO to operate smoother."], "jumps": ["P1230", "P1140"]}, {"id": "P1230", "text": ["Without the low pass filter the PLL would operate erratically or not at all because the VCO would receive varying pulses."], "jumps": ["P1240", "P1140"]}, {"id": "P1240", "text": ["The amplitude of the converted DC error signal is directly proportional to the phase difference between the comparator's two input signals."], "jumps": ["P1250", "P1140"]}, {"id": "P1250", "text": ["You should note that if the two signals are not equal in frequency, they can only be in phase for a brief instance. In this manner, the phase detector is capable of detecting differences in frequency."], "jumps": ["P1252", "P1240"]}, {"id": "P1252", "text": ["For example, if the reference input has a frequency of 6 Hz and the VCO frequency is 3 Hz, the signals are only in phase every 20 seconds."], "jumps": ["P1260", "P1250"]}, {"id": "P1260", "text": ["The greater the phase/frequency difference between the two input signals, the greater the amplitude of the comparison signal."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["When the VCO frequency is lagging the reference frequency, the phase comparator, operating in conjunction with the low pass filter, increases the DC output voltage."], "jumps": ["P1280", "P1250"]}, {"id": "P1280", "text": ["The output voltage is fed to the input of the VCO. When the VCO's input voltage is increased the output frequency is increased, catching up to the reference."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["When the VCO frequency is leading the reference frequency, the phase comparator and low pass filter lower the DC output voltage, decreasing the VCO's output frequency which ensures that its phase and frequency match the reference signal's."], "jumps": ["P1300", "P1270"]}, {"id": "P1300", "text": ["Once the input signals match, the comparison signal toggles back and forth very rapidly to maintain an error voltage that will keep the output frequency of the VCO at the same frequency as the reference signal frequency."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["There is always a comparison signal correcting the VCO frequency, even when the VCO's free running frequency closely matches the reference frequency's."], "jumps": ["P1311", "P1290"]}, {"id": "P1311", "text": ["The error voltage will be 0 VDC only when the free running frequency of the VCO exactly matches the reference signal frequency."], "jumps": ["P1320", "P1290"]}, {"id": "P1320", "text": ["To increase a lagging VCO frequency the DC voltage from the low pass filter _______"], "jumps": ["P1290"]}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1322", "text": ["A VCO's output frequency is proportional to the input voltage. If the frequency is lagging it needs to be increased."], "jumps": []}, {"id": "P1330", "text": ["What is the output from the phase comparator?.............."], "jumps": ["P1320"]}, {"id": "P1331", "text": [], "jumps": []}, {"id": "P1332", "text": ["The reference signal is an input to the phase comparator..."], "jumps": []}, {"id": "P1333", "text": ["The DC voltage is an output from the low pass filter to the VCO."], "jumps": []}, {"id": "P1340", "text": ["PLL's have a wide range of applications in the electronics world.", "Noise Filter Small Signal Filter Bandpass Filter FM Demodulator Digital Data Transmission and Storage Frequency Synthesizer"], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["Because of the PLL's ability to lock onto low level signals, even if the input signals are carrying a great deal of interference, they make good Noise Filters and Small Signal Amplifiers.", "Noise Filter Small Signal Filter Bandpass Filter FM Demodulator Digital Data Transmission and Storage Frequency Synthesizer"], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["Because interference is outside the VCO's frequency range it is disregarded."], "jumps": ["P1370", "P1340"]}, {"id": "P1370", "text": ["Being able to limit the frequency range of the PLL also makes it a handy bandpass filter.", "Noise Filter Small Signal Filter Bandpass Filter FM Demodulator Digital Data Transmission and Storage Frequency Synthesizer"], "jumps": ["P1380", "P1340"]}, {"id": "P1380", "text": ["A very common use for PLLs is as an FM demodulator........."], "jumps": ["P1390", "P1340"]}, {"id": "P1390", "text": ["The FM transmitter's carrier frequency is used as the center frequency for the VCO."], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["The received FM signal is the reference input to the phase comparator."], "jumps": ["P1410", "P1380"]}, {"id": "P1410", "text": ["Because the output of the comparator and filter is the difference between the FM signal and the VCO's frequency the output is the demodulated intelligence."], "jumps": ["P1420", "P1380"]}, {"id": "P1420", "text": ["As you know, after the phase detector has determined that the two input frequencies are out of phase, it sends a comparison signal to the low pass filter."], "jumps": ["P1430", "P1380"]}, {"id": "P1430", "text": ["The filter changes the comparison signal to a low frequency AC signal that represents the original intelligence."], "jumps": ["P1440", "P1380"]}, {"id": "P1440", "text": ["With a constantly changing reference signal, as an FM waveform, the VCO is constantly trying to track it."], "jumps": ["P1450", "P1380"]}, {"id": "P1450", "text": ["This means the comparison signal is constantly increasing and decreasing with the FM signal resulting in the demodulated information."], "jumps": ["P1460", "P1380"]}, {"id": "P1460", "text": ["The PLL's specific frequency range make it good for use as a _______"], "jumps": ["P1380"]}, {"id": "P1461", "text": [], "jumps": []}, {"id": "P1462", "text": ["The PLL's ability to lock onto low level signals with interference make it a good noise filter.", "Noise Filter Small Signal Filter Bandpass Filter FM Demodulator Digital Data Transmission and Storage Frequency Synthesizer"], "jumps": []}, {"id": "P1463", "text": ["The PLL's ability to constantly compare the reference and VCO signal make it a good FM demodulator.", "Noise Filter Small Signal Filter Bandpass Filter FM Demodulator Digital Data Transmission and Storage Frequency Synthesizer"], "jumps": []}, {"id": "P1470", "text": ["PLLs can also be used for digital data transmission and storage. Frequency shift keying (FSK) modulation is a common form used to represent data."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["No matter what type of digital information is used in an FSK, the signals are either high or low."], "jumps": ["P1490", "P1470"]}, {"id": "P1490", "text": ["A PLL readily demodulates this data for use within a digital system."], "jumps": ["P1500", "P1470"]}, {"id": "P1500", "text": ["PLL's can be used to synchronize data......................"], "jumps": ["P1510", "P1470"]}, {"id": "P1510", "text": ["For instance, many circuits in a computer system must be synchronized to ensure that operations occur in the proper sequence and at the right time."], "jumps": ["P1520", "P1500"]}, {"id": "P1520", "text": ["Using a PLL data synchronizer, the synch signals can be held very accurately."], "jumps": ["P1530", "P1500"]}, {"id": "P1530", "text": ["Larger PLL systems allow synch pulses and data to be shifted throughout on the same line (serial transmission)."], "jumps": ["P1540", "P1500"]}, {"id": "P1540", "text": ["PLL frequency syntheziers have replaced older systems that required many crystal oscillators, like CB radios."], "jumps": ["P1550", "P1500"]}, {"id": "P1550", "text": ["Crystal oscillators are expensive and bulky. The PLL frequency synthesizer is relatively inexpensive and compact."], "jumps": ["P1560", "P1540"]}, {"id": "P1560", "text": ["One IC sized frequency synthesizer can replace many crystal oscillators."], "jumps": ["P1570", "P1540"]}, {"id": "P1570", "text": ["Frequency synthesizers are also very accurate and stable making them highly reliable."], "jumps": ["P1580", "P1540"]}, {"id": "P1580", "text": ["As you can see Phase Lock Loop Systems can take on any number of different forms and can be used in a number of different applications but their operation is essentially the same. ise Filter Small Signal Amplifier Bandpass Filter FM Demodulator", "Noise Filter Small Signal Filter Bandpass Filter FM Demodulator Digital Data Transmission and Storage Frequency Synthesizer"], "jumps": ["P1910", "P1540"]}, {"id": "P1910", "text": ["This completes the information on PHASE LOCK LOOPS........."], "jumps": ["P1001", "P1580"]}, {"id": "P1920", "text": ["1. PLL systems are made of a phase comparator, low pass filter, amplifier and VCO."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. The phase comparator compares the phase and frequency of a reference signal and VCO signal to produce an output signal called a comparison signal."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. The comparison signal is a square wave that reflects the phase and frequency difference between the two inputs to the phase comparator."], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["4. The low pass filter changes the comparison signal to a smooth DC voltage."], "jumps": ["P1960", "P1920"]}, {"id": "P1960", "text": ["5. This voltage is proportional to the phase difference of the comparator's input signals."], "jumps": ["P1970", "P1920"]}, {"id": "P1970", "text": ["6. The amplifier boosts low DC levels for use by the VCO."], "jumps": ["P1980", "P1920"]}, {"id": "P1980", "text": ["7. The VCO changes the DC level to a sine wave, sawtooth or square wave with a frequency that tries to match or lock onto the reference signal's frequency."], "jumps": ["P1999", "P1920"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1920"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2040", "text": ["This experiment demonstrates the operation of three phase lock loop configurations along with the phase detection and error amplification sections."], "jumps": ["P2050", "P2001"]}, {"id": "P2050", "text": ["First, let's examine the circuitry that performs the phase detection and error signal amplification functions.", "Phase detection is performed by IC1, an MC4044 which is a phase detector circuit contained within a single integrated circuit chip."], "jumps": ["P2060", "P2040", "P2070", "P2050"]}, {"id": "P2070", "text": ["The circuit receives two inputs, one of which is an external AC signal (REF IN), the other is the feedback loop from the VCO (FREQ IN)."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["The output of the phase detector (pins 2 and 13) are fed directly into the corresponding inputs on the charge pump (pins 11 and 4)."], "jumps": ["P2090", "P2060"]}, {"id": "P2090", "text": ["The chip will compare the two signals. If a phase difference is detected an error voltage is produced."], "jumps": ["P2100", "P2060"]}, {"id": "P2100", "text": ["The error voltage is used to change the output frequency of the VCO to rematch the reference frequency.", "IC2 is a 741 op amp, it's associated components make up a two pole low pass filter."], "jumps": ["P2110", "P2060"]}, {"id": "P2120", "text": ["R4 and C2 make up a low pass filter whose output is fed to the inverting input of IC2. C1 is a low pass feedback capacitor."], "jumps": ["P2122", "P2110"]}, {"id": "P2122", "text": ["The two pole filter creates a rather smooth DC level on the input of IC3 which is simply a 741 op amp configured as a variable gain amplifier."], "jumps": ["P2124", "P2110"]}, {"id": "P2124", "text": ["Now that we have discussed the PLL circuitry let's observe and verify proper circuit operation."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2110"]}, {"id": "P2140", "text": ["2. Carefully plug PC130-224 into the Test Console PC1 position. PC130-224 is going to supply the reference input signal to the PLL Detector and Error Amplifier on PC130-225.."], "jumps": ["P2130", "P2150"]}, {"id": "P2150", "text": ["3. Carefully plug PC130-225 into the Test Console PC2 position."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["4. Carefully plug PC130-86 into the Test Console PC3 position. PC130-86 is the VCO for the PLL Detector and Error Amplifier on PC130-225.."], "jumps": ["P2180", "P2150"]}, {"id": "P2180", "text": ["5. Set the Positive Supply Control to 12. The Voltmeter on the 130A should indicate 12 Volts. 6. Set the Negative Supply Control to 12. The Voltmeter on the 130A should indicate 12 Volts."], "jumps": ["P2160"]}, {"id": "P2190", "text": ["8. Set PC130-224 as follows: - Set the Frequency Adjust potentiometer to mid position. - Place switches S1, S2, S3, S5 and S6 to 0. - Place switch S4 to 1. - Place S7 to Internal."], "jumps": ["P2200", "P2185"]}, {"id": "P2185", "text": ["7. Set PC1, PC2 and PC3 DC Power Switches to ON.0A - Set the PC1 DC Switch to ON...."], "jumps": ["P2180", "P", "Pss"]}, {"id": "P2200", "text": ["Placing S4 to the 1 position divides the VCO frequency by 2 because the VCO's static output is approximately two times the reference frequency.N........................................."], "jumps": ["P2190", "P", "Pss"]}, {"id": "P2210", "text": ["9. On PC130-225 set the following controls: - GAIN fully CCW. - OFFSET midrangeeeeer, adjust the offset control for -1.4 VDC as seen at the ERROR OUT test point."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["10. On PC130-86 set the following switches and controls: - Place switches S1 and S2 to the PLL position. - Turn the Level Control (R4) fully clockwise."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["11. Set up the oscilloscope to measure CH1 and CH2 signals (dual). Set the triggering control to channel 1, sweep mode to AUTO, and both input selectors to DC.."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["12. Connect channel 1 of the oscilloscope to PC130-224 TP1. On PC130-224 adjust the Freq. Adj. for a 4.4 ms or 227 kHz signal as observed on the oscilloscope."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["13. Connect channel 1 of the oscilloscope to PC130-225 REF IN test point and channel 2 of the oscilloscope to PC130-225 FREQ IN test point. Change the triggering on the oscilloscope to ALT."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["At this time, you should see two square waves in phase and of approximately equal amplitude.", "Adjust the OFFSET potentiometer on the PC130-225 card until both signals are exactly in phase and frequency. They should both be approximately equal in amplitude.", "The signal at the REF IN test point is the reference signal generated by the 555 timer circuit divided by two on the PC130-225 card and the signal at the FREQ IN test point is the output of the VCO. If you are having trouble, recheck your setup or ask your instructor for assistance."], "jumps": ["P2270", "P2250", "P2280", "P2260"]}, {"id": "P2280", "text": ["The VCO did not followed the reference signal when the frequency changed.", "The VCO followed the reference signal when the frequency changed.", "14. While observing the oscilloscope display, increase the PC130-224 frequency adjust potentiometer slightly. What happened to the output of the VCO?"], "jumps": ["P2270"]}, {"id": "P2281", "text": [], "jumps": []}, {"id": "P2282", "text": ["You should have observed the VCO frequency trying to track the frequency of the reference signal, whether it increased or decreased. This happens because as the frequency of the reference signal increases, the phase detector increases the voltage to the VCO, increasing its frequency output..."], "jumps": []}, {"id": "P13290", "text": ["14. Connect the multimeter to the ERROR OUT test point on the PC130-225 card. This is the error voltage produced by the interfunctioning of the phase detector, the low-pass filter, and the amplifier. Again, vary the frequency control pot on the PC130-224 card and observe the voltage on the multimeter....."], "jumps": ["P13300", "P13280"]}, {"id": "P2300", "text": ["You should have observed increasing error voltage with increasing frequency and decreasing error voltage with decreasing frequency."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["16. Turn the frequency control potentiometer on the PC130-224 card completely clockwise. You will notice that the VCO signal is not in phase with the signal at the Ref. In test point on the PC130-225."], "jumps": ["P2320", "P2290", "P", "Pss"]}, {"id": "P2320", "text": ["This is the low cutoff point of the phase comparator section. Record the frequency of the VCO's output and the error voltage in the spaces below."], "jumps": ["P2310"]}, {"id": "P2321", "text": [], "jumps": []}, {"id": "P2322", "text": ["You should have noticed that the FREQ IN signal stops tracking the REF IN at a specific frequency. The error voltage should also decrease as the frequency decreased."], "jumps": []}, {"id": "P2323", "text": ["You should have measured approximately 60 kHz for the VCO frequency and - 0.55V for the error voltage."], "jumps": ["P2320"]}, {"id": "P2330", "text": ["17. Now turn the frequency control pot completely counterclockwise, you should notice that the VCO signal at the Freq. In test point on PC130-225 is now in phase with the signal at the Ref In test point...................."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["Record the frequency of the VCO's output and the error voltage in the spaces below. in variable."], "jumps": ["P2330"]}, {"id": "P2341", "text": [], "jumps": []}, {"id": "P2342", "text": ["You should have noticed that the FREQ IN signal stops tracking the REF IN at a specific frequency. The error voltage should have increased as the frequency increased."], "jumps": []}, {"id": "P2343", "text": ["You should have measured approximately 130 kHz for the VCO frequency and 3 V for the error voltage."], "jumps": ["P2340"]}, {"id": "P2350", "text": ["You have just observed the PLL system operating as a band pass filter. These cutoff points are the maximum and minimum voltages that the phase comparator can put out, therefore, the maximum and minimum frequencies that the VCO can produce in this configuration. w VCO frequency = !%25 Low error voltage = !%26 High VCO frequency = !%27 High error voltage = !%288888", "Low VCO frequency = Low error voltage = High VCO frequency = High error voltage = !%28 !%28= !%28 !%28"], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["Let's now configure our PLL system as an FM demodulator...."], "jumps": ["P2370", "P2350"]}, {"id": "P2370", "text": ["18. Place S7 on PC130-224 to the EXT position. Ensure S1-S6 are set to zero (Down)."], "jumps": ["P2390", "P2360", "P", "Pss"]}, {"id": "P2380", "text": ["Page not used", "Using the information you obtained, calculate the center frequency of this PLL system.le.able.le.", "Page not usedduring changes.tained, calculate the center frequency of this PLL system.le.able.le."], "jumps": ["P2370", "P2382"]}, {"id": "P2381", "text": [], "jumps": []}, {"id": "P2382", "text": ["The center frequency is between low frequency and high frequency of the bandwidth.", "Calculating the Center Frequency 1) Subtract the lower frequency from the upper frequency. 2) Divide the result of the subtraction by 2. 3) Add the result of the division to the lower frequency to find the center frequency...", "Page not usedduring changes.tained, calculate the center frequency of this PLL system.le.able.le."], "jumps": []}, {"id": "P2383", "text": ["Your answer should be approximately 225 kHz.have measured 5.0mA.", "Page not usedduring changes.tained, calculate the center frequency of this PLL system.le.able.le."], "jumps": ["P2380"]}, {"id": "P2390", "text": ["19. Set up a function generator to produce a 225 kHz square wave at approximately 3 VPP. with the center frequency you calculated, ."], "jumps": ["P2400", "P2370"]}, {"id": "P2400", "text": ["20. Connect the channel 1 oscilloscope probe to the REF IN test point on the PC130-225 card. Set sweep mode ALT button to OUT position."], "jumps": []}, {"id": "P2410", "text": ["21. Connect the function generator output to PC1 OUTPUT BNC. Make sure all the attenuation and modulation buttons are OUT on the function generator and adjust the amplitude approximately 3 VPP at the REF IN testpoint......."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["22. At this time, ensure that the oscilloscope is set for dual display, ALT sweep mode button to IN, and also that channel 2 of the oscilloscope is at the FREQ IN test point........."], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["The VCO's output and the function generator's output should be locked in with each other. If not, recheck your setup or ask your instructor for assistance. CH1 - REF IN CH2 - FREQ IN"], "jumps": ["P2440", "P2420"]}, {"id": "P2440", "text": ["23. Set the function generator's modulation controls as follows: nge - 1 Function - FM, Sine wave Modulation level - Fully clockwise Frequency - Fully clockwise (1 Hz)", "Function - FM, Square wave Modulation level - Fully clockwise Frequency - 2 Hz clockwise (1 Hz)"], "jumps": ["P2450", "P2430"]}, {"id": "P2450", "text": ["At this time you should notice that the VCO is trying to track the FM waveform but isn't quite fast enough to keep up with it; it is always slightly behind the reference."], "jumps": ["P2460", "P2440"]}, {"id": "P2460", "text": ["24. Set the oscilloscope to display CH1, connect CH1 probe to PC130-225 ERROR OUT test point and change the sweep mode ALT button to OUT. 225 Phase Detector & Error Amp."], "jumps": ["P2470", "P2450"]}, {"id": "P2470", "text": ["The oscilloscope now displays the level of error voltage produced by the phase detector and error amplifier. Remember, if the input frequency changes, the PLL must develop an error voltage that changes the output frequency of the VCO to compensate..."], "jumps": ["P2480", "P2460"]}, {"id": "P2480", "text": ["What do you observe on the oscilloscope?..................."], "jumps": ["P2470"]}, {"id": "P2481", "text": [], "jumps": []}, {"id": "P2482", "text": ["Check your oscilloscope and PC130-225 setup. You should have noticed a rising and falling DC level that represents the modulated reference frequency.....reference frequency."], "jumps": []}, {"id": "P2483", "text": ["Check your oscilloscope and PC130-225 setup. There should be a change."], "jumps": []}, {"id": "P2490", "text": ["As you can see, a PLL system readily operates as an FM demodulator because the error voltage produced by the phase detector and error amplifier represent the modulated waveform."], "jumps": ["P2500", "P2480"]}, {"id": "P2500", "text": ["The experiment cards you are using have been designed with a very slow response time so that the action of the PLL can be readily observed, therefore a higher frequency can not be used to show the actual sine wave that modulates the reference frequency..."], "jumps": ["P2502", "P2490"]}, {"id": "P2502", "text": ["25. Disconnect the Function Generator from PC1 OUTPUT BNC."], "jumps": ["P2510", "P2500"]}, {"id": "P2510", "text": ["Let's now observe the PLL system configured as a frequency synthesizer.", "Begin by examining experiment card PC130-224 and its schematic.", "IC5 is an internal reference frequency generator circuit formed from a basic 555 timer. Its function is to generate an on-board AC signal for use within the system."], "jumps": ["P2520", "P2500"]}, {"id": "P2550", "text": ["This allows you to observe PLL operation without the requirement of an external AC function generator. This particular frequency generator circuit has a range from 150 Hz to 250 kHz."], "jumps": ["P2560", "P2540"]}, {"id": "P2560", "text": ["The experiment card also contains two binary counters, IC1 and IC2. IC1 receives the pulses from the 555 timer and IC2 receives the pulses from the VCO."], "jumps": ["P2570", "P2540"]}, {"id": "P2570", "text": ["Both counters are connected to 3 switches which allow binary division of the frequency. IC1 uses the reference pulses as a clock input to count down the binary number entered through switches S1-S3 and produce a terminal count pulse for each \"N\" clock..."], "jumps": ["P2572", "P2540"]}, {"id": "P2572", "text": ["The binary range of divisors that S1-S3 can produce is 0 through 7; S1 = bit 0, S2 = bit 1, S3 = bit 2."], "jumps": ["P2575", "P2540"]}, {"id": "P2575", "text": ["IC2 uses the VCO output signal pulses as a clock input to count down the binary number entered through switches S4-S6 and produces a terminal count pulse for each \"M\" clock."], "jumps": ["P2576", "P2540"]}, {"id": "P2576", "text": ["The binary range of divisors that S4-S6 can produce is 0 through 7; S4 = bit 0, S5 = bit 1, S6 = bit 2."], "jumps": ["P2580", "P2540"]}, {"id": "P2580", "text": ["U1 also functions to clean up the signals, which allows the phase detector to operate better."], "jumps": ["P2590", "P2540"]}, {"id": "P2590", "text": ["U2 and IC2 function the same as U1 and IC1 except that their inputs are from the voltage controlled oscillator."], "jumps": ["P2600", "P2540"]}, {"id": "P2600", "text": ["25. On the PC130-224 card, ensure that switches S1 - S6 are in the 0 position. Set S7 REF to INT."], "jumps": ["P2610", "P2540", "P", "Pss"]}, {"id": "P2610", "text": ["26. Set up the oscilloscope for dual channel operation with the triggering control set to ALT. Place the channel 1 probe on PC130-224 test point 1 and the channel 2 probe on test point 2. ......"], "jumps": ["P2611", "P2600", "P", "Pss"]}, {"id": "P2611", "text": ["27. Set the S1 on the PC130-86 to DC and adjust the Carrier Frequency adjust on PC130-86 for a 400 kHz signal as seen on TP2 on PC130-224. PC130- 224 test point 3 and the channel 2 probe on test point TP2."], "jumps": ["P", "Pss"]}, {"id": "P13290", "text": ["14. Connect the multimeter to the ERROR OUT test point on the PC130-225 card. This is the error voltage produced by the interaction between the phase detector, low-pass filter, and amplifier. Again, vary the frequency control pot on the PC130-224 card and observe the voltage on the multimeter.on the PC130-224 card and observe the voltage on the multimeter...............", "28. Adjust the Frequency Adjust on PC130-224 for 200 kHz signal as seen on TP1 on PC130-224. C130- 224 test point 3 and the channel 2 probe on test point TP2................................. channel 2 probe on test point TP2."], "jumps": ["P13300", "P13280", "P", "Pss"]}, {"id": "P2613", "text": ["29. Move CH1 oscilloscope probe from TP1 to TP3 and CH2 oscilloscope probe from TP2 to TP4. Notice that the frequency has been divided by 2, TP1 200 kHz to TP3 100 kHz and TP2 400 kHz to TP4 200 kHz. P2."], "jumps": ["P", "Pss"]}, {"id": "P2620", "text": ["The signal at TP3 is the reference frequency that goes to the phase detector. The signal at TP4 is a VCO signal, it also goes to the phase detector."], "jumps": ["P2630", "P2613", "P", "Pss"]}, {"id": "P2630", "text": ["30. Place S4 to position 1. What happened to the VCO frequency?"], "jumps": ["P2610"]}, {"id": "P2631", "text": [], "jumps": []}, {"id": "P2632", "text": ["By setting S4 to 1 the reference signal decreases in frequency. the VCO signal should try to match the reference signal."], "jumps": []}, {"id": "P2640", "text": ["reference frequency? equency?", "31. Now place S1 to PLL on the PC130-86 and adjust the Frequency adjust on the PC130-224 card. Is the VCO frequency locked onto the reference frequency?"], "jumps": ["P2630"]}, {"id": "P2641", "text": [], "jumps": []}, {"id": "P2642", "text": ["By placing S4 to 1, countdown counter IC2 (\"M\" frequency) is set to match the N frequency of countdown counter IC1. Fout = M/N x Fref"], "jumps": []}, {"id": "P2650", "text": ["By dividing the reference frequency and the VCO frequency, a very stable frequency synthesizer can be produced from a PLL circuit. This is extremely useful in computers where stable, yet flexible timing is critical to the operation..."], "jumps": ["P2660", "P2640"]}, {"id": "P2660", "text": ["32. Return the Test Console to the initial control settings..............."], "jumps": ["P2650"]}, {"id": "P2670", "text": ["33. Set the Console Power Switch to OFF..................."], "jumps": ["P2660"]}, {"id": "P2680", "text": ["34. Turn all test equipment OFF and return it to its designated storage area."], "jumps": ["P2910", "P2670"]}, {"id": "P2910", "text": ["This completes the experiment on PHASE LOCK LOOP.LE........"], "jumps": ["P2001", "P2680"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["What type of circuit is a phase lock loop circuit?"], "jumps": []}, {"id": "P10211", "text": ["Frequency variations produced by the response curve of the low pass filter.", "How does a phase lock loop circuit demodulate FM signals?", "Amplitude variations produced by the response curve of the low pass filter.", "Frequency variations produced by the difference between the FM input frequency and VCO frequency.", "Amplitude variations produced by the difference between the FM signal and VCO frequency."], "jumps": []}, {"id": "P10212", "text": ["If the VCO frequency is lagging the reference frequency, the _______"], "jumps": []}, {"id": "P10213", "text": ["they can lock onto low level signals even if they are carrying interference.", "PLL's make good noise filters because _______", "they use many crystals to filter interference."], "jumps": []}, {"id": "P10214", "text": ["What type of filter is a PLL commonly used for?"], "jumps": []}, {"id": "P10215", "text": ["Without a Low Pass filter, the PLL would _______", "have pulses applied to the VCO making it operate smoothly."], "jumps": []}, {"id": "P10216", "text": ["square wave with positive and/or negative pulses."], "jumps": []}, {"id": "P10217", "text": ["directly proportional to the phase difference between the comparators input signals.", "The amplitude of the DC Error voltage is _______", "inversely proportional to the phase difference between the comparator input signals.", "directly proportional to the reference input only.", "inversely proportional to the VCO signal.", "directly proportional to the phase difference between the comparator's input signals.", "inversely proportional to the phase difference between the comparator's input signals."], "jumps": []}, {"id": "P10218", "text": ["When the VCO's free running frequency matches the reference signal phase and frequency exactly, the DC error voltage is _______"], "jumps": []}, {"id": "P10219", "text": ["When a PLL is used as an FM demodulator, the output is _______", "a frequency that matches the reference signal."], "jumps": []}, {"id": "P10220", "text": ["When the error voltage from the low pass filter increases, the VCO output frequency _______"], "jumps": []}, {"id": "P10221", "text": ["The reference signal is applied to the _______"], "jumps": []}, {"id": "P10222", "text": ["Which component of the PLL has a center frequency?"], "jumps": []}, {"id": "P10223", "text": ["Which component of the PLL tries to lock onto the refence signal?", "Which component of the PLL tries to lock onto the reference signal?"], "jumps": []}, {"id": "P10224", "text": ["As the reference signal's frequency is decreased, the error voltage _______"], "jumps": []}, {"id": "P10225", "text": ["When the VCO frequency is locked onto the reference signal frequency, the VCO signal's amplitude is _______"], "jumps": []}, {"id": "P10226", "text": ["The PLL's output of the low pass filter is a/an _______"], "jumps": []}, {"id": "P10227", "text": ["The VCO frequency can lock onto the reference frequency when the reference signal is _______", "between the upper and lower cutoff frequency."], "jumps": []}, {"id": "P10228", "text": ["If the VCO cannot lock onto the reference signal, the reference signal frequency may be _______", "between the upper and lower cutoff frequencies of the VCO."], "jumps": []}, {"id": "P10229", "text": ["The input signals to the Phase Comparator are the _______"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to __________"], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P2290", "text": ["15. Connect the multimeter to the ERROR OUT test point on the PC130-225 card. This is the error voltage produced by the interaction between the phase detector, low-pass filter, and amplifier. Again, vary the frequency control pot on the PC130-224 card and observe the voltage on the multimeter..."], "jumps": ["P2300", "P2280"]}, {"id": "P13050", "text": ["First, let's examine the circuitry that performs the phase detection and error signal amplification functions. This circuitry is on Nida PC130-225.", "Phase detection is performed by IC1, an MC4044 which is a phase detector circuit contained within a single integrated circuit chip."], "jumps": ["P13060", "P13040", "P13070", "P13050"]}, {"id": "P13070", "text": ["The circuit receives two inputs, one of which is an external AC signal (REF IN), the other is the feedback loop from the VCO (FREQ IN)."], "jumps": ["P13080", "P13060"]}, {"id": "P13080", "text": ["The output of the phase detector (pins 2 and 13) are fed directly into the corresponding inputs on the charge pump (pins 11 and 4)."], "jumps": ["P13090", "P13060"]}, {"id": "P13090", "text": ["The chip will compare the two signals. If a phase difference is detected an error voltage is produced."], "jumps": ["P13100", "P13060"]}, {"id": "P13100", "text": ["The error voltage is used to change the output frequency of the VCO to rematch the reference frequency.", "IC2 is a 741 op amp, it's associated components make up a two pole low pass filter."], "jumps": ["P13110", "P13060", "P13120", "P13100"]}, {"id": "P13120", "text": ["R4 and C2 make up a low pass filter whose output is fed to the inverting input of IC2. C1 is a low pass feedback capacitor."], "jumps": ["P13122", "P13110"]}, {"id": "P13122", "text": ["The two pole filter creates a rather smooth DC level on the input of IC3 which is simply a 741 op amp configured as a variable gain amplifier."], "jumps": ["P13124", "P13110"]}, {"id": "P13124", "text": ["Now that we have discussed the PLL circuitry let's observe and verify proper circuit operation."], "jumps": ["P13130", "P13110"]}, {"id": "P13130", "text": ["1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13110"]}, {"id": "P13140", "text": ["2. Carefully plug PC130-224 into the Test Console PC1 position. PC130-224 is going to supply the reference input signal to the PLL Detector and Error Amplifier on PC130-225."], "jumps": ["P13150"]}, {"id": "P13150", "text": ["3. Carefully plug PC130-225 into the Test Console PC2 position."], "jumps": ["P13160", "P13140"]}, {"id": "P13160", "text": ["4. Carefully plug PC130-86 into the Test Console PC3 position. PC130-86 is the VCO for the PLL Detector and Error Amplifier on PC130-225.."], "jumps": ["P13180", "P13150"]}, {"id": "P13180", "text": ["5. Press Enter to Set: Positive Supply Voltage - 12 Negative Supply Voltage - 12"], "jumps": ["P13160"]}, {"id": "P13185", "text": ["6. Press Enter to Set: PC1, PC2 and PC3 DC Power Switches - ON"], "jumps": []}, {"id": "P13190", "text": ["7. Set PC130-224 as follows: - Set the Frequency Adjust potentiometer to mid position. - Place switches S1, S2, S3, S5 and S6 to 0. - Place switch S4 to 1. - Place S7 to Internal...."], "jumps": ["P13200", "P", "Pss"]}, {"id": "P13200", "text": ["Placing S4 to the 1 position divides the VCO frequency by 2 because the VCO's static output is approximately two times the reference frequency."], "jumps": ["P13210", "P13190"]}, {"id": "P13210", "text": ["8. On PC130-225 set the following controls: - GAIN fully CCW. - OFFSET midrange adjust the offset control for 1.4 VDC as seen at the ERROR OUT test point."], "jumps": ["P13220", "P13190"]}, {"id": "P13220", "text": ["9. On PC130-86 set the following switches and controls: - Place switches S1 and S2 to the PLL position. - Turn the Level Control (R4) fully clockwise."], "jumps": ["P13230", "P13210"]}, {"id": "P13230", "text": ["10. Set up the oscilloscope to measure CH1 and CH2 signals (dual). Set the triggering control to channel 1, sweep mode to AUTO, and both input selectors to DC."], "jumps": ["P13240", "P13220"]}, {"id": "P13240", "text": ["11. Connect channel 1 of the oscilloscope to PC130-224 TP1. On PC130-224 adjust the Freq. Adj. for a 4.4 ms or 227 kHz signal as observed on the oscilloscope..."], "jumps": ["P13250", "P13230"]}, {"id": "P13250", "text": ["12. Connect channel 1 of the oscilloscope to PC130-225 REF IN test point and channel 2 of the oscilloscope to PC130-225 FREQ IN test point. Change the triggering on the oscilloscope to ALT."], "jumps": ["P13260", "P13240"]}, {"id": "P13260", "text": ["are waves in phase and of approximately equal amplitude. CH1 - REF IN CH2 - FREQ IN", "Adjust the OFFSET potentiometer on the PC130-225 card until both signals are exactly in phase and frequency. They should both be approximately equal in amplitude. time, you should see two square waves in phase and of approximately equal amplitude.", "t point is the reference signal generated by the 555 timer circuit divided by two on the PC130-225 card and the signal at the FREQ IN test point is the output of the VCO d. If you are having trouble, recheck your setup or ask your instructor for assistance.", "The signal at the REF IN test point is the reference signal generated by the 555 timer circuit divided by two on the PC130-225 card and the signal at the FREQ IN test point is the output of the VCO. If you are having trouble, recheck your setup or ask your instructor for assistance..................."], "jumps": ["P13270", "P13250", "P13280", "P13260"]}, {"id": "P13280", "text": ["The VCO did not followed the reference signal when the frequency changed.", "The VCO followed the reference signal when the frequency changed.", "13. While observing the oscilloscope display, increase the PC130-224 frequency adjust potentiometer slightly. What happened to the output of the VCO?"], "jumps": ["P13270"]}, {"id": "P13281", "text": [], "jumps": []}, {"id": "P13282", "text": ["You should have observed the VCO frequency trying to track the frequency of the reference signal, whether it increased or decreased. This happens because as the frequency of the reference signal increases, the phase detector increases the voltage to the VCO, increasing its frequency output..."], "jumps": []}, {"id": "P13310", "text": ["15. Turn the frequency control potentiometer on the PC130-224 card completely clockwise . You will notice that the VCO signal is not in phase with the signal at the Ref. In test point on the PC130-225.."], "jumps": ["P13320", "P13290"]}, {"id": "P13300", "text": ["You should have observed increasing error voltage with increasing frequency and decreasing error voltage with decreasing frequency."], "jumps": ["P13310", "P13290"]}, {"id": "P13370", "text": ["17. Place S7 on PC130-224 to the EXT position. Ensure S1-S6 are set to zero (Down)."], "jumps": ["P13390", "P13360", "P", "Pss"]}, {"id": "P13343", "text": ["You should have measured approximately 130 kHz for the VCO frequency and 3 V for the error voltage...", "This is the low cutoff point of the phase comparator section. Record the frequency of the VCO's output and the error voltage in the spaces below."], "jumps": ["P13340"]}, {"id": "P13321", "text": [], "jumps": []}, {"id": "P13322", "text": ["You should have noticed that the FREQ IN signal stops tracking the REF IN at a specific frequency. The error voltage should also decrease as the frequency decreased."], "jumps": []}, {"id": "P13323", "text": ["You should have measured approximately 60 kHz for the VCO frequency and - 0.55V for the error voltage."], "jumps": ["P13320"]}, {"id": "P13390", "text": ["18. Set up a function generator to produce a 225 kHz square wave at approximately 3 Vpp. the center frequency you calculated,"], "jumps": ["P13400", "P13370"]}, {"id": "P13340", "text": ["Record the frequency of the VCO's output and the error voltage in the spaces below. in variable."], "jumps": ["P13330"]}, {"id": "P13341", "text": [], "jumps": []}, {"id": "P13342", "text": ["You should have noticed that the FREQ IN signal stops tracking the REF IN at a specific frequency. The error voltage should have increased as the frequency increased."], "jumps": []}, {"id": "P13330", "text": ["16. Now turn the frequency control pot completely counterclockwise, you should notice that the VCO signal at the Freq. In test point on PC130-225 is now in phase with the signal at the Ref In test point..."], "jumps": ["P13340", "P13320"]}, {"id": "P13350", "text": ["You have just observed the PLL system operating as a band pass filter. These cutoff points are the maximum and minimum voltages that the phase comparator can put out, therefore, the maximum and minimum frequencies that the VCO can produce in this configuration. w VCO frequency = !%25 Low error voltage = !%26 High VCO frequency = !%277777", "Low VCO frequency = Low error voltage = High VCO frequency = High error voltage = !%28 !%28= !%28 !%28"], "jumps": ["P13360", "P13340"]}, {"id": "P13360", "text": ["Let's now configure our PLL system as an FM demodulator...."], "jumps": ["P13370", "P13350"]}, {"id": "P13130", "text": ["1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13110", "P", "Pss"]}, {"id": "P13380", "text": ["Using the information you obtained, calculate the center frequency of this PLL system.le.able.le.", "Page not usedduring changes.tained, calculate the center frequency of this PLL system.le.able.le."], "jumps": ["P13370", "P13382"]}, {"id": "P13381", "text": [], "jumps": []}, {"id": "P13382", "text": ["The center frequency is between low frequency and high frequency of the bandwidth. lculating the Center Frequency 1) Subtract the lower frequency from the upper frequency. 2) Divide the result of the subtraction by 2. 3) Add the result of the divison to the lower frequency to find the center frequency.", "Calculating the Center Frequency 1) Subtract the lower frequency from the upper frequency. 2) Divide the result of the subtraction by 2. 3) Add the result of the division to the lower frequency to find the center frequency...", "g changes.tained, calculate the center frequency of this PLL system.le.able.le.", "Page not usedduring changes.tained, calculate the center frequency of this PLL system.le.able.le."], "jumps": []}, {"id": "P13383", "text": ["Your answer should be approximately 225 kHz.have measured 5.0mA.", "Page not usedduring changes.tained, calculate the center frequency of this PLL system.le.able.le."], "jumps": ["P13380"]}, {"id": "P13390", "text": ["18. Set up a function generator to produce a 225 kHz square wave at approximately 3 Vpp. the center frequency you calculated,"], "jumps": ["P13400", "P13370"]}, {"id": "P13400", "text": ["19. Connect the channel 1 oscilloscope probe to the REF IN test point on the PC130-225 card. Set sweep mode ALT button to OUT position........."], "jumps": []}, {"id": "P13410", "text": ["20. Connect the function generator output to PC1 OUTPUT BNC. Make sure all the attenuation and modulation buttons are OUT on the function generator and adjust the amplitude approximately 3 Vpp at the REF IN testpoint.point............."], "jumps": ["P13420", "P13400"]}, {"id": "P13420", "text": ["21. At this time, ensure that the oscilloscope is set for dual display, ALT sweep mode button to IN, and also that channel 2 of the oscilloscope is at the FREQ IN test point........."], "jumps": ["P13430", "P13410"]}, {"id": "P13430", "text": ["The VCO's output and the function generator's output should be locked in with each other. If not, recheck your setup or ask your instructor for assistance. CH1 - REF IN CH2 - FREQ IN"], "jumps": ["P13440", "P13420"]}, {"id": "P13440", "text": ["22. Set the function generator's modulation controls as follows: Range - 1 Function - FM, Sine wave Modulation level - Fully clockwise Frequency - Fully clockwise (1 Hz)", "Function - FM, Square wave Modulation level - Fully clockwise Frequency - 2 Hz lockwise (1 Hz) se (1 Hz)"], "jumps": ["P13450", "P13430"]}, {"id": "P13450", "text": ["At this time you should notice that the VCO is trying to track the FM waveform but isn't quite fast enough to keep up with it; it is always slightly behind the reference."], "jumps": ["P13460", "P13440"]}, {"id": "P13460", "text": ["23. Set the oscilloscope to display CH1, connect CH1 probe to PC130-225 ERROR OUT test point and change the sweep mode ALT button to OUT."], "jumps": ["P13470", "P13450"]}, {"id": "P13470", "text": ["The oscilloscope now displays the level of error voltage produced by the phase detector and error amplifier. Remember, if the input frequency changes, the PLL must develop an error voltage that changes the output frequency of the VCO to compensate..."], "jumps": ["P13480", "P13460"]}, {"id": "P13480", "text": ["What do you observe on the oscilloscope?..................."], "jumps": ["P13470"]}, {"id": "P13481", "text": [], "jumps": []}, {"id": "P13482", "text": ["Check your oscilloscope and PC130-225 setup. You should have noticed a rising and falling DC level that represents the modulated reference frequency.....reference frequency."], "jumps": []}, {"id": "P13483", "text": ["Check your oscilloscope and PC130-225 setup. There should be a change."], "jumps": []}, {"id": "P13490", "text": ["As you can see, a PLL system readily operates as an FM demodulator because the error voltage produced by the phase detector and error amplifier represent the modulated waveform."], "jumps": ["P13500", "P13480"]}, {"id": "P13500", "text": ["The experiment cards you are using have been designed with a very slow response time so that the action of the PLL can be readily observed, therefore a higher frequency can not be used to show the actual sine wave that modulates the reference frequency..."], "jumps": ["P13502", "P13490"]}, {"id": "P13502", "text": ["24. Disconnect the Function Generator from PC1 OUTPUT BNC."], "jumps": ["P13510", "P13500"]}, {"id": "P13510", "text": ["Let's now observe the PLL system configured as a frequency synthesizer.", "Begin by examining experiment card PC130-224 and its schematic.", "IC5 is an internal reference frequency generator circuit formed from a basic 555 timer. Its function is to generate an on-board AC signal for use within the system."], "jumps": ["P13520", "P13500"]}, {"id": "P13550", "text": ["This allows you to observe PLL operation without the requirement of an external AC function generator. This particular frequency generator circuit has a range from 120 kHz to 300 kHz.."], "jumps": ["P13560", "P13540"]}, {"id": "P13560", "text": ["The experiment card also contains two binary counters, IC1 and IC2. IC1 receives the pulses from the 555 timer and IC2 receives the pulses from the VCO."], "jumps": ["P13570", "P13540"]}, {"id": "P13570", "text": ["Both counters are connected to 3 switches which allow binary division of the frequency. IC1 uses the reference pulses as a clock input to count down the binary number entered through switches S1-S3 and produce a terminal count pulse for each \"N\" clock..."], "jumps": ["P13572", "P13540"]}, {"id": "P13572", "text": ["The binary range of divisors that S1-S3 can produce is 0 through 7; S1 = bit 0, S2 = bit 1, S3 = bit 2."], "jumps": ["P13575", "P13540"]}, {"id": "P13575", "text": ["IC2 uses the VCO output signal pulses as a clock input to count down the binary number entered through switches S4-S6 and produces a terminal count pulse for each \"M\" clock."], "jumps": ["P13576", "P13540"]}, {"id": "P13576", "text": ["The binary range of divisors that S4-S6 can produce is 0 through 7; S4 = bit 0, S5 = bit 1, S6 = bit 2."], "jumps": ["P13580", "P13540"]}, {"id": "P13580", "text": ["U1 also functions to clean up the signals, which allows the phase detector to operate better."], "jumps": ["P13590", "P13540"]}, {"id": "P13590", "text": ["U2 and IC2 function the same as U1 and IC1 except that their inputs are from the voltage controlled oscillator."], "jumps": ["P13600", "P13540"]}, {"id": "P13600", "text": ["25. On the PC130-224 card, ensure that switches S1 - S6 are in the 0 position. Set S7 REF to INT."], "jumps": ["P13540", "P", "Pss"]}, {"id": "P13610", "text": ["26. Set up the oscilloscope for dual channel operation with the triggering control set to ALT. Place the channel 1 probe on PC130-224 test point 1 and the channel 2 probe on test point 2."], "jumps": ["P", "Pss"]}, {"id": "P13611", "text": ["27. Set the S1 on the PC130-86 to DC and adjust the Carrier Frequency adjust on PC130-86 for a 400 kHz signal as seen on TP2 on PC130-224. PC130- 224 test point 3 and the channel 2 probe on test point TP2."], "jumps": ["P", "Pss"]}, {"id": "P13612", "text": ["28. On the PC130-224 adjust the Frequency Adjust potentiometer for approximately 200 kHz signal as seen on TP1 on the PC130-224.d the channel 2 probe on test point TP2................................. channel 2 probe on test point TP2."], "jumps": ["P", "Pss"]}, {"id": "P13613", "text": ["29. Move CH1 oscilloscope probe from TP1 to TP3 and CH2 oscilloscope probe from TP2 to TP4. Notice that the frequency has been divided by 2, TP1 200 kHz to TP3 100 kHz and TP2 400 kHz to TP4 200 kHz. ."], "jumps": ["P", "Pss"]}, {"id": "P13620", "text": ["The signal at TP3 is the reference frequency that goes to the phase detector. The signal at TP4 is a VCO signal, it also goes to the phase detector."], "jumps": ["P13610", "P", "Pss"]}, {"id": "P13630", "text": ["30. Place S4 to position 1 on the PC130-224 card. What happened to the VCO frequency?"], "jumps": ["P13610"]}, {"id": "P13631", "text": [], "jumps": []}, {"id": "P13632", "text": ["By setting S4 to 1 the reference signal decreases in frequency. the VCO signal should try to match the reference signal."], "jumps": []}, {"id": "P13640", "text": ["31. Now place S1 to PLL on the PC130-86 and adjust the Frequency adjust on the PC130-224 card. Is the VCO frequency locked onto the reference frequency?"], "jumps": ["P13630"]}, {"id": "P13641", "text": [], "jumps": []}, {"id": "P13642", "text": ["By placing S4 to 1, countdown counter IC2 (\"M\" frequency) is set to match the N frequency of countdown counter IC1."], "jumps": []}, {"id": "P13650", "text": ["By dividing the reference frequency and the VCO frequency, a very stable frequency synthesizer can be produced from a PLL circuit. This is extremely useful in computers where stable, yet flexible timing is critical to the operation..."], "jumps": ["P13640"]}, {"id": "P13670", "text": ["32. Set the Console Power Switch to OFF.F................................."], "jumps": []}, {"id": "P13680", "text": ["33. Turn all test equipment OFF and return it to its designated storage area."], "jumps": ["P13910", "P13670"]}, {"id": "P13910", "text": ["This completes the experiment on PHASE LOCK LOOP.LE........"], "jumps": ["P2001", "P13680"]}, {"id": "PINFO", "text": ["09-02-00 Converted from SAM to toolbook. frieda 09-09-00 Text and Branching. frieda 10-16-00 Graphics John Ayala 10-18-00 Reviewed - lisa 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-12-02 Review of Conversion. Alexis 04-18-02 Review - lisa 02-18-04 Updated the lesson according to Dave's comments. Yu-Chi 02-20-04 Reviewed lesson with changes and ran experiment with trainers. frieda 03-22-04 Grammar changes as per Pat Short. -Penny 03-31-04 P13210, 2210 changed OFFSET to ERROR OUT. -Penny 04-28-04 P13520, 13540, 2520, 2540 fixed schematic of PC130-224. Errors were tp's not labeled, missing a tie point etc. No component changes. -Penny 05-04-04 many changes see N1290- Dean 07-14-04 P2910, P13910 Added end of experiment script per jay. frieda 03-10-05 P2185, Scripting next button - added sendfaults 130A (F314)2190Scripting back button - added sendfaults 130A (E314) P2190, 13190changed text from \"Set the Frequency Adjust potentiometer at mid position. \" to \"Set the Frequency Adjust potentiometer to mid position.\" P2290,13290, Changed 2nd sentence from \"This the error voltage produced by the interfunctioning of the phase detector, the low-pass filter, and the amplifier. \" To: \"This is the error voltage produced by the interaction between the phase detector, low-pass filter, and ": ["This is the low cutoff point of the phase comparator section. Record the frequency of the VCO's output and the error voltage in the spaces below.", "\"You have successfully passed the assessment", "You skipped X question(s). Do you want to _________", "The test is complete and your score is XX%. Do you want to _________", "You have successfully passed the assessment test!", "Are you sure you want to Bookmark the Lesson?", "Are you sure you want to Exit the Lesson?"], "jumps": ["P13310", "P13320", "P13340", "P2320", "P2340", "PutVar"]}]};
let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
