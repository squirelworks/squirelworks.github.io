const book = {"title": "9395Z407", "pages": [{"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 02-21-00 Changed copyright date on page Q0 to 1999-2000. Penny 03-09-00 Changed the red mat on the main window viewer to blue. Changed the high yellow word in text field of definition page to blue, Q1055. Added a 4 distractor touch area question page, Q1240. - Penny 03-30-00 Conversion from Sam. - lisa 03-30-00 Text & Branching - lisa 04-14-00 Graphics.damian 07-14-00 Converted to ToolBook 7.1 format. jay 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-12-02 review - rs"], "jumps": []}, {"id": "P1250", "text": ["Also attached to the terminal controller are two PROMS (programmable read only memory) and two oscillators.  The PROMS, Transmit Personality PROM (TPP) and Receive Personality PROM (RPP) are used to instruct the terminal controller.", "Also attached to the terminal controller are two PROMS (programmable read only memory) and two oscillators. The PROMS, Transmit Personality PROM (TPP) and Receive Personality PROM (RPP) are used to instruct the terminal controller.", "* Describe the different components associated with the ARINC 629 data bus system. w Identify basic principles of operation related to the ARINC 629 data bus system specifications."], "jumps": ["P1260", "P1240"]}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to __________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10223", "text": ["What is the data word length for transmission used in ARINC 629 systems?"], "jumps": []}, {"id": "P10222", "text": ["Which timer(s) must elapse before the Terminal Gap Timer may start?"], "jumps": []}, {"id": "P10221", "text": ["The Transmit Interval Timer is the most important timer when in the Aperiodic mode."], "jumps": []}, {"id": "P10220", "text": ["Which timer is the most important in the periodic mode of operation?"], "jumps": []}, {"id": "P10219", "text": ["It is possible to connect 140 CMCs to a bus as long as the last twenty have termination resistors inside them?"], "jumps": []}, {"id": "P10218", "text": ["How many external oscillators does the terminal controller use?"], "jumps": []}, {"id": "P10217", "text": ["How many conductors are inside the Stub Cable?"], "jumps": []}, {"id": "P10216", "text": ["What component isolates the global side from the local side of the ARINC 629 data bus cable?"], "jumps": []}, {"id": "P10215", "text": ["The ARINC 429 and ARINC 629 data buses are not compatible but both systems can be used together for certain applications."], "jumps": []}, {"id": "P10214", "text": ["Which device contains a personality table for incoming data?"], "jumps": []}, {"id": "P10213", "text": ["How many terminals can one single twisted pair data bus support?"], "jumps": []}, {"id": "P10212", "text": ["Which component is responsible for inducing the signal onto the bus?"], "jumps": []}, {"id": "P10211", "text": ["What type of modulation does the ARINC 629 data bus use?"], "jumps": []}, {"id": "P10210", "text": ["What mode of operation does the ARINC 629 use on each single twisted pair wire?"], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P100", "text": ["w Describe and interpret different data formats. w Describe and interpret different word formats.", "w Describe the different components associated with the ARINC 629 data bus system. w Identify basic principles of operation related to the ARINC 629 data bus system specifications."], "jumps": []}, {"id": "P1210", "text": ["The signals on the bus are known as", "The signals on the bus are known as........................"], "jumps": ["P1190"]}, {"id": "P2999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2950"]}, {"id": "P1030", "text": ["Below is a block diagram of a generalized ARINC 629 system. This block diagram shows three different systems attached to the same bus.  We will look at one of these systems to understand the concepts involved with ARINC 629 specifications.", "Below is a block diagram of a generalized ARINC 629 system. This block diagram shows three different systems attached to the same bus. We will look at one of these systems to understand the concepts involved with ARINC 629 specifications."], "jumps": ["P1040", "P1020"]}, {"id": "P2940", "text": ["3.  There are two modes of data transfer on the bus, periodic and       aperiodic.  The actual mode of operation is determined by the        terminal controller and is a function of the load of data on the         system.", "2.  The three timers are: Transmit Interval timer, Synchronization       Gap timer, and the Terminal Gap timer.", "3. There are two modes of data transfer on the bus, periodic and aperiodic. The actual mode of operation is determined by the terminal controller and is a function of the load of data on the system.", "2. The three timers are: Transmit Interval timer, Synchronization Gap timer, and the Terminal Gap timer.."], "jumps": ["P2950", "P2920"]}, {"id": "P2920", "text": ["1.  Timing is very important when dealing with data transfer.  If            equipment didn't use timers they would either send data                 whenever they felt like it, or possibly not even send it at all.             Every piece of equipment attached to the bus has three                   timers.", "1. Timing is very important when dealing with data transfer. If equipment didn't use timers they would either send data whenever they felt like it, or possibly not even send it at all. Every piece of equipment attached to the bus has three timers.", "and the data word begin with a three bit sync pulse. The label word sync pulse goes high to low, and the data word sync pulse goes from low to high."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2.  The three timers are: Transmit Interval timer, Synchronization       Gap timer, and the Terminal Gap timer.", "Which word type has a sync pulse in the first three bits?", "2. The three timers are: Transmit Interval timer, Synchronization Gap timer, and the Terminal Gap timer..", "Which word type has a sync pulse in the first three bits?.."], "jumps": ["P2940", "P2920"]}, {"id": "P2322", "text": ["Remember, a system can transfer one message, containing up to 31 wordstrings, each containing up to 256 words."], "jumps": []}, {"id": "P2320", "text": ["How many wordstrings can a message contain?", "How many wordstrings can a message contain?................"], "jumps": ["P2310"]}, {"id": "P2950", "text": ["4.  When a system sends data on the bus it sends it in a form               known as a message.  A system can only send one message         at a time on the bus.  If a system could send more than one at        a time, other systems may never get a chance to transmit data       on the bus.", "4. When a system sends data on the bus it sends it in a form known as a message. A system can only send one message at a time on the bus. If a system could send more than one at a time, other systems may never get a chance to transmit data on the bus."], "jumps": ["P2999", "P2940"]}, {"id": "P2300", "text": ["The first three bits of the label are used for a high to low sync pulse, again used for synchronization purposes.  Following the sync pulse is a four bit extension, a twelve bit label, and one parity bit.", "The first three bits of the label are used for a high to low sync pulse, again used for synchronization purposes. Following the sync pulse is a four bit extension, a twelve bit label, and one parity bit."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["The data word is also twenty bits long.  The first three bits are a low to high sync pulse, followed by sixteen data bits and one parity bit.", "The data word is also twenty bits long. The first three bits are a low to high sync pulse, followed by sixteen data bits and one parity bit."], "jumps": ["P2320", "P2300"]}, {"id": "P2330", "text": ["Which word type has a sync pulse in the first three bits?", "Which word type has a sync pulse in the first three bits?.."], "jumps": ["P2320"]}, {"id": "P2280", "text": ["A message consists of up to 31 wordstrings.", "A message consists of up to 31 wordstrings. A wordstring is a label followed by up to 256 data words. These data words contain the data needed to be transmitted."], "jumps": ["P2282", "P2270"]}, {"id": "P2321", "text": ["Remember, the SG timer must fully elapse before the TG timer can begin.  Also, once the SG timer fully elapses it can only be reset by that system transmitting data.", "Remember, the SG timer must fully elapse before the TG timer can begin. Also, once the SG timer fully elapses it can only be reset by that system transmitting data."], "jumps": []}, {"id": "P2261", "text": [], "jumps": []}, {"id": "P2260", "text": ["Which timer must fully elapse before the TG timer can begin?"], "jumps": ["P2250"]}, {"id": "P2270", "text": ["DATA STRUCTURE\nWhen a system sends data on the bus it sends it in a form known as a message.  A system can only send one message at a time on the bus.  If a system could send more than one at a time, other systems may never get a chance to transmit data on the bus.", "DATA STRUCTURE When a system sends data on the bus it sends it in a form known as a message. A system can only send one message at a time on the bus. If a system could send more than one at a time, other systems may never get a chance to transmit data on the bus."], "jumps": ["P2280", "P2260"]}, {"id": "P2282", "text": ["A wordstring is a label followed by up to 256 data words.  These data words contain the data needed to be transmitted.", "A wordstring is a label followed by up to 256 data words. These data words contain the data needed to be transmitted. tted."], "jumps": ["P2290", "P2280"]}, {"id": "P2332", "text": ["Remember, both the label word and the data word begin with a three bit sync pulse.  The label word sync pulse goes high to low, and the data word sync pulse goes from low to high.", "Remember, both the label word and the data word begin with a three bit sync pulse. The label word sync pulse goes high to low, and the data word sync pulse goes from low to high."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on ARINC 629 PROTOCOL.", "This completes the information on ARINC 629 PROTOCOL......."], "jumps": ["P2330"]}, {"id": "P2240", "text": ["Now that we have looked at the basic flow of data on the ARINC 629 bus, let's examine the structure of the data being sent on the bus.", "Also, the aperiodic mode keeps the bus running smoothly when it overloads with data.  Again, meaning more data to transfer than what is possible in one TI.  The aperiodic mode enhances the abilities of the ARINC 629 bus, without it, system operation would not be as effective, and system additions timely.", "Also, the aperiodic mode keeps the bus running smoothly when it overloads with data. Again, meaning more data to transfer than what is possible in one TI. The aperiodic mode enhances the abilities of the ARINC 629 bus, without it, system operation would not be as effective, and system additions timely."], "jumps": ["P2250", "P2210"]}, {"id": "P2200", "text": ["This means that the rate would be consistent for nine cycles, and the tenth cycle would be longer.  The extra time required would be dependent on the size of the data being transferred by these two systems.", "This means that the rate would be consistent for nine cycles, and the tenth cycle would be longer. The extra time required would be dependent on the size of the data being transferred by these two systems."], "jumps": ["P2210", "P2180"]}, {"id": "P2180", "text": ["As you can see, even though the TI for the first system has elapsed, all data isn't finished being sent.  The TI is reset when a system begins sending data.  In the aperiodic mode you can see the importance of the TG and SG timers.", "As you can see, even though the TI for the first system has elapsed, all data isn't finished being sent. The TI is reset when a system begins sending data. In the aperiodic mode you can see the importance of the TG and SG timers."], "jumps": ["P2190", "P2150"]}, {"id": "P2190", "text": ["The reason that the rate of transfer is not guaranteed is due to data that isn't transmitted regularly.  If say in the example below the second and third system only transferred on every tenth TI, those spaces would be eliminated in the flow except for every tenth TI.", "The reason that the rate of transfer is not guaranteed is due to data that isn't transmitted regularly. If say in the example below the second and third system only transferred on every tenth TI, those spaces would be eliminated in the flow except for every tenth TI."], "jumps": ["P2200", "P2180"]}, {"id": "P2230", "text": ["Also, the aperiodic mode keeps the bus running smoothly when it overloads with data.  Again, meaning more data to transfer than what is possible in one TI.  The aperiodic mode enhances the abilities of the ARINC 629 bus, without it, system operation would not be as effective, and system additions timely.", "Also, the aperiodic mode keeps the bus running smoothly when it overloads with data. Again, meaning more data to transfer than what is possible in one TI. The aperiodic mode enhances the abilities of the ARINC 629 bus, without it, system operation would not be as effective, and system additions timely."], "jumps": ["P2240", "P2210"]}, {"id": "P2250", "text": ["What is the most important timer in the periodic mode of operation?"], "jumps": ["P2240"]}, {"id": "P2251", "text": [], "jumps": []}, {"id": "P2140", "text": ["In the aperiodic mode the SG (synchronization gap) timer and the TG (terminal gap) timer are very important.  The TI does not effect the operation of the data transfer in the aperiodic mode.", "In the aperiodic mode the SG (synchronization gap) timer and the TG (terminal gap) timer are very important. The TI does not effect the operation of the data transfer in the aperiodic mode."], "jumps": ["P2150", "P2130"]}, {"id": "P2170", "text": ["The next smallest TG is the third system, which transmits its data and resets its SG.  Remember, the SG has to fully elapse before the TG timer will start, and the SG resets when the bus is active until it has had a chance to fully elapse.", "The next smallest TG is the third system, which transmits its data and resets its SG.  Remember, the SG has to fully elapse before the TG timer will start, and the SG resets when the bus is active until it has had a chance to fully elapse.", "The next smallest TG is the third system, which transmits its data and resets its SG. Remember, the SG has to fully elapse before the TG timer will start, and the SG resets when the bus is active until it has had a chance to fully elapse."], "jumps": ["P2180", "P2150"]}, {"id": "P2110", "text": ["After the SG timer has fully elapsed, the TG (terminal gap) timer begins.  Every system has their own value for the TG timer.  Think of this value as a ticket number.  The bus will allow each of the systems to transmit once in the order of their ticket numbers.", "After the SG timer has fully elapsed, the TG (terminal gap) timer begins. Every system has their own value for the TG timer. Think of this value as a ticket number. The bus will allow each of the systems to transmit once in the order of their ticket numbers."], "jumps": ["P2120", "P2090"]}, {"id": "P2090", "text": ["The SG (synchronization gap) timer does not effect the operation of data transfer in the periodic mode, however, it is still active in the system.  The SG timer for a system is reset when its data has been sent.  The SG timer after being reset will start when there is nothing happening on the bus.", "The SG (synchronization gap) timer does not effect the operation of data transfer in the periodic mode, however, it is still active in the system. The SG timer for a system is reset when its data has been sent. The SG timer after being reset will start when there is nothing happening on the bus."], "jumps": ["P2100", "P2060"]}, {"id": "P2252", "text": ["Remember, the SG and TG timers are very important in the aperiodic mode but, in the periodic mode the TI is the most important timer."], "jumps": []}, {"id": "P2290", "text": ["At the beginning of a message there is a series of pulses that are used for synchronization.  After these pulses the label word of the first wordstring is sent.  The label word is 20 bits long.", "In the periodic mode the TG timer is not very important, data will be sent every TI or multiple of TI no matter which TG is shorter as shown by the example below.  Even if data is transmitted in a different order than the TG numbers, it will still be sent at the same interval.", "At the beginning of a message there is a series of pulses that are used for synchronization. After these pulses the label word of the first wordstring is sent. The label word is 20 bits long.", "In the periodic mode the TG timer is not very important, data will be sent every TI or multiple of TI no matter which TG is shorter as shown by the example below. Even if data is transmitted in a different order than the TG numbers, it will still be sent at the same interval."], "jumps": ["P2300", "P2280", "P2090"]}, {"id": "P2020", "text": ["Now that you have learned the operating principles of the ARINC 629, it is important to learn about the structure and timing involved with data transfer.  First we will cover the timing principles involved with data flow, then, the structure of this data.", "Now that you have learned the operating principles of the ARINC 629, it is important to learn about the structure and timing involved with data transfer. First we will cover the timing principles involved with data flow, then, the structure of this data."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["DATA FLOW\nTiming is very important when dealing with data transfer.  If equipment didn't use timers they would either send data whenever they felt like it, or possibly not even send it at all.  Every piece of equipment attached to the bus has three timers.", "DATA FLOW Timing is very important when dealing with data transfer. If equipment didn't use timers they would either send data whenever they felt like it, or possibly not even send it at all. Every piece of equipment attached to the bus has three timers."], "jumps": ["P2040", "P2020"]}, {"id": "P2150", "text": ["In our example below the SG timer has elapsed for all systems. After the SG timer elapses the TG timer begins, and the system with the smallest TG will transmit first.  After the data for this system has been sent, its SG timer is reset to zero.", "In our example below the SG timer has elapsed for all systems. After the SG timer elapses the TG timer begins, and the system with the smallest TG will transmit first. After the data for this system has been sent, its SG timer is reset to zero."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["Now that the bus is quiet, the SG timer starts for the first system, but the TG timers start over for the rest of the systems.  Since the SG timer is set larger than any of the TGs, it will never fully elapse until all systems have sent their data.", "Now that the bus is quiet, the SG timer starts for the first system, but the TG timers start over for the rest of the systems. Since the SG timer is set larger than any of the TGs, it will never fully elapse until all systems have sent their data."], "jumps": ["P2170", "P2150"]}, {"id": "P2210", "text": ["One basic reason for the aperiodic mode was the expansion of a pre-existing system.  Remember, most systems are designed to operate in the periodic mode.  The TI is usually just long enough for all data to transmit once.", "One basic reason for the aperiodic mode was the expansion of a pre-existing system. Remember, most systems are designed to operate in the periodic mode. The TI is usually just long enough for all data to transmit once."], "jumps": ["P2220", "P2180"]}, {"id": "P1950", "text": ["4.  STUB CABLE - The stub cable connects from the CMC to the         LRU (Line Replaceable Unit).  This cable has four conductors        and can be up to 55 feet long.  The stub cable is the medium          used to send data between the CMC and the Line                               Replaceable Unit (LRU).", "4. STUB CABLE - The stub cable connects from the CMC to the LRU (Line Replaceable Unit). This cable has four conductors and can be up to 55 feet long. The stub cable is the medium used to send data between the CMC and the Line Replaceable Unit (LRU)."], "jumps": ["P1960", "P1920"]}, {"id": "P1970", "text": ["6.  The maximum number of CMCs that can be attached to the            bus is 120.  To determine the maximum length of the bus wire,        use the formula below.  As CMCs increase, bus length                      decreases.", "6. The maximum number of CMCs that can be attached to the bus is 120. To determine the maximum length of the bus wire, use the formula below. As CMCs increase, bus length decreases."], "jumps": ["P1999", "P1950"]}, {"id": "P1930", "text": ["2.  BUS TERMINATORS - At each end of the bus cable there is a         permanent bus terminator.  These bus terminators are 130              ohms so that they will match the impedance of the bus wire.           The terminators are designed to handle faulted conditions on        the bus without damage.", "2. BUS TERMINATORS - At each end of the bus cable there is a permanent bus terminator. These bus terminators are 130 ohms so that they will match the impedance of the bus wire. The terminators are designed to handle faulted conditions on the bus without damage."], "jumps": ["P1940", "P1920"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1970"]}, {"id": "P1910", "text": ["This completes the information on ARINC 629 OPERATING PRINCIPLES."], "jumps": ["P1390"]}, {"id": "P2130", "text": ["If a terminal controller detects more data to be sent than the size TI will allow, it will switch to aperiodic mode.  Once a terminal has switched to aperiodic mode it will not switch back since aperiodic mode supports periodic data, it's just not guaranteed to be sent at a specific rate.", "If a terminal controller detects more data to be sent than the size TI will allow, it will switch to aperiodic mode. Once a terminal has switched to aperiodic mode it will not switch back since aperiodic mode supports periodic data, it's just not guaranteed to be sent at a specific rate."], "jumps": ["P2140", "P2090"]}, {"id": "P1380", "text": ["Finally, the maximum number of CMCs that can be attached to the bus is 120.  To determine the maximum length of the bus wire, use the formula below.  As CMCs increase, bus length decreases.", "Finally, the maximum number of CMCs that can be attached to the bus is 120. To determine the maximum length of the bus wire, use the formula below. As CMCs increase, bus length decreases."], "jumps": ["P1390", "P1370"]}, {"id": "P1920", "text": ["1.  BUS CABLE - The bus cable is the medium in which all of the        systems will communicate.  The bus cable is a twisted pair of         wires that are bonded at the point of contact.", "1. BUS CABLE - The bus cable is the medium in which all of the systems will communicate. The bus cable is a twisted pair of wires that are bonded at the point of contact."], "jumps": ["P1930", "P1001"]}, {"id": "P1940", "text": ["3.  CURRENT MODE COUPLER - Connected to the bus cable is a      Current Mode Coupler (CMC).  Every system that wants to              transmit information on the bus requires a CMC.  The CMC             connects to the bus without cutting or crimping the bus wires.", "3. CURRENT MODE COUPLER - Connected to the bus cable is a Current Mode Coupler (CMC). Every system that wants to transmit information on the bus requires a CMC. The CMC connects to the bus without cutting or crimping the bus wires."], "jumps": ["P1950", "P1920"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P1330", "text": ["The best way to understand the process of data transfer is to use a simple analogy.  Let's say that the subsystem is a person, the common memory is a mailbox, the terminal controller is the post office, and the rest is the mail transportation system.", "The best way to understand the process of data transfer is to use a simple analogy. Let's say that the subsystem is a person, the common memory is a mailbox, the terminal controller is the post office, and the rest is the mail transportation system."], "jumps": ["P1340", "P1310"]}, {"id": "P1310", "text": ["Data is encoded into Manchester as it leaves the terminal controller chip. Data received by the terminal controller is decoded from Manchester and then sent to other parts of the chip. Remember, all data on the global side of the terminal controller is modulated, all data inside and on the local side is not modulated."], "jumps": ["P1320", "P1300"]}, {"id": "P1350", "text": ["Now that the post office (terminal controller) has accepted the package (data), it will process the package (data) and deliver it to someone's mailbox (common memory).  Once the package (data) has been delivered, someone (subsystem) can check the mailbox (common memory) to see if their package arrived.", "Now that the post office (terminal controller) has accepted the package (data), it will process the package (data) and deliver it to someone's mailbox (common memory). Once the package (data) has been delivered, someone (subsystem) can check the mailbox (common memory) to see if their package arrived."], "jumps": ["P1360", "P1330"]}, {"id": "P1290", "text": ["All data to and from the Serial Interface Module (SIM) and the terminal controller is encoded using Manchester code. Manchester code is a modulation technique that allows easy generation of the original clock. In other words, something receiving the data can determine the clock speed of the sender by analyzing the signal."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["Below is an example of how data is encoded using this technique.  Notice that a high is represented by a high to low sequence, and a low is represented by a low to high sequence.", "Below is an example of how data is encoded using this technique. Notice that a high is represented by a high to low sequence, and a low is represented by a low to high sequence."], "jumps": ["P1310", "P1290"]}, {"id": "P1340", "text": ["The post office (terminal controller) receives a package (data) from the mail transportation system (bus). The post office (terminal controller) then looks at the label of the package (data). If the post office (terminal controller) finds that the label corresponds to someone in this district (PROM) then it will accept the package (data)."], "jumps": ["P1350", "P1330", "PROM"]}, {"id": "P1370", "text": ["Data that is sent on the bus can be read by only one CMC.", "Data that is sent on the bus can be read by only one CMC..."], "jumps": ["P1330"]}, {"id": "P1371", "text": [], "jumps": []}, {"id": "P2100", "text": ["The SG timer will continue until it has either completely elapsed, or is reset by data being sent on the bus.  Once the SG has fully elapsed it can only be reset by that systems data being sent on the bus.  The SG timer is the same for all systems, and is longer than the largest TG timer.", "The SG timer will continue until it has either completely elapsed, or is reset by data being sent on the bus. Once the SG has fully elapsed it can only be reset by that systems data being sent on the bus. The SG timer is the same for all systems, and is longer than the largest TG timer."], "jumps": ["P2110", "P2090"]}, {"id": "P2120", "text": ["In the periodic mode the TG timer is not very important, data will be sent every TI or multiple of TI no matter which TG is shorter as shown by the example below.  Even if data is transmitted in a different order than the TG numbers, it will still be sent at the same interval.", "In the periodic mode the TG timer is not very important, data will be sent every TI or multiple of TI no matter which TG is shorter as shown by the example below. Even if data is transmitted in a different order than the TG numbers, it will still be sent at the same interval."], "jumps": ["P2130", "P2090"]}, {"id": "P1281", "text": [], "jumps": []}, {"id": "P1320", "text": ["After data has passed the label check of the terminal controller, it is sent over the Sub System Interface (SSI) and written to memory.  This memory is then read by a subsystem attached to the memory in need of the data. If that subsystem would like to send data, it would write its data to the same memory.", "After data has passed the label check of the terminal controller, it is sent over the Sub System Interface (SSI) and written to memory. This memory is then read by a subsystem attached to the memory in need of the data. If that subsystem would like to send data, it would write its data to the same memory."], "jumps": ["P1330", "P1310"]}, {"id": "P1270", "text": ["These instructions and labels in each PROM are known as personality tables.  If a terminal controller receives a label that is not in the table, the terminal controller will ignore the incoming data until the next label comes along.", "The TPP tells the terminal controller which labels to use, and how to format the data encoding.  The RPP tells the terminal controller which labels it should receive and what to do with that data.", "These instructions and labels in each PROM are known as personality tables. If a terminal controller receives a label that is not in the table, the terminal controller will ignore the incoming data until the next label comes along.", "The TPP tells the terminal controller which labels to use, and how to format the data encoding. The RPP tells the terminal controller which labels it should receive and what to do with that data."], "jumps": ["P1280", "P1240"]}, {"id": "P1960", "text": ["5.  LINE REPLACEABLE UNIT - The Line Replaceable Unit (LRU)        is the system that is sending data on the ARINC 629 bus.  The       LRU is designed to be easily replaced if it becomes faulty.               Inside the LRU is an ARINC 629 terminal and a subsystem              that needs to send data over the bus.", "5. LINE REPLACEABLE UNIT - The Line Replaceable Unit (LRU) is the system that is sending data on the ARINC 629 bus. The LRU is designed to be easily replaced if it becomes faulty. Inside the LRU is an ARINC 629 terminal and a subsystem that needs to send data over the bus."], "jumps": ["P1970", "P1950"]}, {"id": "P2060", "text": ["When a system is designed it is normally designed for the periodic mode of operation, meaning data is guaranteed to transmit at a certain rate.  Shown below is a generalized example of periodic data transfer and the involvement of timers.", "When a system is designed it is normally designed for the periodic mode of operation, meaning data is guaranteed to transmit at a certain rate. Shown below is a generalized example of periodic data transfer and the involvement of timers."], "jumps": ["P2070", "P2050"]}, {"id": "P1110", "text": ["LINE REPLACEABLE UNIT\nThe Line Replaceable Unit (LRU) is the system that is sending data on the ARINC 629 bus.  The LRU is designed to be easily replaced if it becomes faulty.  Inside the LRU is an ARINC 629 terminal and a subsystem that needs to send data over the bus.", "Remember, the transformer induces current onto the bus.", "LINE REPLACEABLE UNIT The Line Replaceable Unit (LRU) is the system that is sending data on the ARINC 629 bus. The LRU is designed to be easily replaced if it becomes faulty. Inside the LRU is an ARINC 629 terminal and a subsystem that needs to send data over the bus.", "Remember, the transformer induces current onto the bus....."], "jumps": ["P1120", "P1100"]}, {"id": "P1211", "text": [], "jumps": []}, {"id": "P1210", "text": ["The signals on the bus are known as", "The signals on the bus are known as........................"], "jumps": ["P1190"]}, {"id": "P1200", "text": ["Some LRUs actually check the data it sends by comparing the transmitted data to the received data.  If an LRU detects that it has become faulty, it should isolate itself from the system.  If an LRU didn't isolate itself from the system it could possibly cause error in other data being transferred.", "Some LRUs actually check the data it sends by comparing the transmitted data to the received data. If an LRU detects that it has become faulty, it should isolate itself from the system. If an LRU didn't isolate itself from the system it could possibly cause error in other data being transferred.", "Isolate From System LRU"], "jumps": ["P1210", "P1190"]}, {"id": "P1190", "text": ["These current doublets are now read by the receive transformers of all CMCs attached to the bus, including the CMC that sent the data.  The CMCs then change the received data from the bus into voltage doublets.  This data is sent to the LRU through the stub cable.", "These current doublets are now read by the receive transformers of all CMCs attached to the bus, including the CMC that sent the data. The CMCs then change the received data from the bus into voltage doublets. This data is sent to the LRU through the stub cable.", "Send and Receive Data LRU w"], "jumps": ["P1200", "P1170"]}, {"id": "P1180", "text": ["The use of voltage doublets is necessary for the proper induction of the signals to the bus wires.  Since transformers induce current, the signals on the bus are called current doublets.", "The use of voltage doublets is necessary for the proper induction of the signals to the bus wires. Since transformers induce current, the signals on the bus are called current doublets."], "jumps": ["P1190", "P1170"]}, {"id": "P1170", "text": ["The CMC amplifies the voltage doublets and induces them into the bus through the transmit transformer.  Remember, the bus wire passes through both transformers of the CMC.", "The CMC amplifies the voltage doublets and induces them into the bus through the transmit transformer. Remember, the bus wire passes through both transformers of the CMC."], "jumps": ["P1180", "P1150"]}, {"id": "P1160", "text": ["The data sent from the LRU to the CMC through the stub cable is in the form of a voltage doublet.  Each voltage doublet indicates a change in the state of data.  Below is an illustration of how the doublet corresponds to a data waveform.", "The data sent from the LRU to the CMC through the stub cable is in the form of a voltage doublet. Each voltage doublet indicates a change in the state of data. Below is an illustration of how the doublet corresponds to a data waveform."], "jumps": ["P1170", "P1150"]}, {"id": "P1200", "text": ["Some LRUs actually check the data it sends by comparing the transmitted data to the received data.  If an LRU detects that it has become faulty, it should isolate itself from the system.  If an LRU didn't isolate itself from the system it could possibly cause error in other data being transferred.", "Some LRUs actually check the data it sends by comparing the transmitted data to the received data. If an LRU detects that it has become faulty, it should isolate itself from the system. If an LRU didn't isolate itself from the system it could possibly cause error in other data being transferred.", "Isolate From System LRU"], "jumps": ["P1210", "P1190"]}, {"id": "P2050", "text": ["There are two modes for data transfer on the bus, periodic and aperiodic.  The actual mode of operation is determined by the terminal controller and is a function of the load of data on the     system.", "There are two modes for data transfer on the bus, periodic and aperiodic. The actual mode of operation is determined by the terminal controller and is a function of the load of data on the system."], "jumps": ["P2060", "P2020"]}, {"id": "P1142", "text": ["It is the current mode coupler, with the use of a transformer, that induces a signal onto the bus."], "jumps": []}, {"id": "P2060", "text": ["When a system is designed it is normally designed for the periodic mode of operation, meaning data is guaranteed to transmit at a certain rate.  Shown below is a generalized example of periodic data transfer and the involvement of timers.", "When a system is designed it is normally designed for the periodic mode of operation, meaning data is guaranteed to transmit at a certain rate. Shown below is a generalized example of periodic data transfer and the involvement of timers."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["TI is the same for all transmitting equipment, the only difference being the point in time when it starts timing.  For the periodic mode the TI is long enough to allow all systems to transmit data during that time.  However, some systems on the bus are designed to transmit every so many TIs, not every TI.", "TI is the same for all transmitting equipment, the only difference being the point in time when it starts timing. For the periodic mode the TI is long enough to allow all systems to transmit data during that time. However, some systems on the bus are designed to transmit every so many TIs, not every TI."], "jumps": ["P2090", "P2060"]}, {"id": "P1100", "text": ["STUB CABLE\nThe stub cable connects from the CMC to the LRU (Line Replaceable Unit).  This cable has four conductors and can be up to 55 feet long.  The stub cable is the medium used to send data between the CMC and the Line Replaceable Unit (LRU).", "The CMC is two pieces, the top half and the bottom half.  The bottom half of the CMC is connected to the frame of the airplane and does not contain any active components.  It only contains the second halves of the transformers.", "STUB CABLE The stub cable connects from the CMC to the LRU (Line Replaceable Unit). This cable has four conductors and can be up to 55 feet long. The stub cable is the medium used to send data between the CMC and the Line Replaceable Unit (LRU).", "The CMC is two pieces, the top half and the bottom half. The bottom half of the CMC is connected to the frame of the airplane and does not contain any active components. It only contains the second halves of the transformers."], "jumps": ["P1110", "P1080", "P1090", "P1040"]}, {"id": "P1260", "text": ["The TPP tells the terminal controller which labels to use, and how to format the data encoding.  The RPP tells the terminal controller which labels it should receive and what to do with that data.", "The TPP tells the terminal controller which labels to use, and how to format the data encoding. The RPP tells the terminal controller which labels it should receive and what to do with that data."], "jumps": ["P1270", "P1240"]}, {"id": "P1280", "text": ["Which component of the ARINC terminal contains a personality table for OUTGOING data?"], "jumps": ["P1270"]}, {"id": "P1072", "text": ["The wires pass through the CMC through the center of two transformers.  The data to be sent will be induced into the bus by these transformers.  This makes connecting systems or moving systems on the bus much easier since no direct connections are made.", "The wires pass through the CMC through the center of two transformers. The data to be sent will be induced into the bus by these transformers. This makes connecting systems or moving systems on the bus much easier since no direct connections are made."], "jumps": ["P1075", "P1080", "P1040"]}, {"id": "P1075", "text": ["INDUCED - Inducing a signal is transferring a signal from one line to another by magnetic induction. By applying a changing voltage to the coil of a transformer, a magnetic field is created that induces current into the bus wires. This induced current can then be induced back into the coil of a transformer."], "jumps": []}, {"id": "P1060", "text": ["CURRENT MODE COUPLER\nConnected to the bus cable is a Current Mode Coupler (CMC). Every system that wants to transmit information on the bus requires a CMC.  The CMC connects to the bus without cutting or crimping the bus wires.", "CURRENT MODE COUPLER Connected to the bus cable is a Current Mode Coupler (CMC). Every system that wants to transmit information on the bus requires a CMC. The CMC connects to the bus without cutting or crimping the bus wires."], "jumps": ["P1070", "P1040"]}, {"id": "P1130", "text": ["The LRU may also connect to other LRUs or equipment by other means of communication through additional connectors on the unit.  These other communications could be ARINC 429 DITS or RS232-C just to name a few.  Now let's look at the functions of each component in the ARINC 629 system.", "The LRU may also connect to other LRUs or equipment by other means of communication through additional connectors on the unit. These other communications could be ARINC 429 DITS or RS232-C just to name a few. Now let's look at the functions of each component in the ARINC 629 system."], "jumps": ["P1140", "P1110"]}, {"id": "P1040", "text": ["BUS CABLE The bus cable is the medium in which all of the systems will communicate. The bus cable is a twisted pair of wires that are bonded at the point of contact. Below are some specifications on the bus cable. You are not required to know these specifications."], "jumps": ["P1050", "P1020"]}, {"id": "P2050", "text": ["There are two modes for data transfer on the bus, periodic and aperiodic.  The actual mode of operation is determined by the terminal controller and is a function of the load of data on the     system.", "There are two modes for data transfer on the bus, periodic and aperiodic. The actual mode of operation is determined by the terminal controller and is a function of the load of data on the system."], "jumps": ["P2060", "P2020"]}, {"id": "P1050", "text": ["BUS TERMINATORS At each end of the bus cable there is a permanent bus terminator. These bus terminators are 130 ohms so that they will match the impedance of the bus wire. The terminators are designed to handle faulted conditions on the bus without damage."], "jumps": ["P1060", "P1040"]}, {"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 02-21-00 Changed copyright date on page Q0 to 1999-2000. Penny 03-09-00 Changed the red mat on the main window viewer to blue. Changed the high yellow word in text field of definition page to blue, Q1055. Added a 4 distractor touch area question page, Q1240. - Penny 03-30-00 Conversion from Sam. - lisa 03-30-00 Text & Branching - lisa 04-14-00 Graphics.damian 07-14-00 Converted to ToolBook 7.1 format. jay 07-19-01 Converted to ToolBook 8.1 format. jay", "07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 02-21-00 Changed copyright date on page Q0 to 1999-2000. Penny 03-09-00 Changed the red mat on the main window viewer to blue. Changed the high yellow word in text field of definition page to blue, Q1055. Added a 4 distractor touch area question page, Q1240. - Penny 03-30-00 Conversion from Sam. - lisa 03-30-00 Text & Branching - lisa 04-14-00 Graphics.damian 07-14-00 Converted to ToolBook 7.1 format. jay 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay"], "jumps": []}, {"id": "P2220", "text": ["If you added additional systems to the bus the amount of data to transfer in one cycle would be greater than the TI.  By using aperiodic mode you can add systems to a pre-existing bus without redefining the TI of all systems attached to the bus.", "If you added additional systems to the bus the amount of data to transfer in one cycle would be greater than the TI. By using aperiodic mode you can add systems to a pre-existing bus without redefining the TI of all systems attached to the bus."], "jumps": ["P2230", "P2210"]}, {"id": "P2251", "text": [], "jumps": []}, {"id": "P2261", "text": [], "jumps": []}, {"id": "P2331", "text": [], "jumps": []}, {"id": "P1180", "text": ["The use of voltage doublets is necessary for the proper induction of the signals to the bus wires.  Since transformers induce current, the signals on the bus are called current doublets.", "The use of voltage doublets is necessary for the proper induction of the signals to the bus wires. Since transformers induce current, the signals on the bus are called current doublets."], "jumps": ["P1190", "P1170"]}, {"id": "P440", "text": ["Let's begin the lesson on ARINC 629.TLE..................................."], "jumps": ["P430"]}, {"id": "P400", "text": ["This lesson describes the ARINC communication system specification 629.  This specification became necessary as the complexity of today's modern aircraft systems increased.  This increase demanded a reliable, maintainable, fast, standard method of data transfer.", "This lesson describes the ARINC communication system specification 629. This specification became necessary as the complexity of today's modern aircraft systems increased. This increase demanded a reliable, maintainable, fast, standard method of data transfer."], "jumps": ["P410", "P300"]}, {"id": "P1090", "text": ["The top half of the CMC contains all of the active components and can easily be replaced.  The top half of the CMC also contains the stub connector which is used to connect the stub cable.  The CMC is used to transfer data to the bus, like an interface, it does not generate or manipulate the data.", "The top half of the CMC contains all of the active components and can easily be replaced. The top half of the CMC also contains the stub connector which is used to connect the stub cable. The CMC is used to transfer data to the bus, like an interface, it does not generate or manipulate the data."], "jumps": ["P1100", "P1080"]}, {"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P0", "text": ["Nida Corporation 1998 - 2001 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P430", "text": ["The ARINC 629 system is not compatible with the ARINC 429 DITS, however, these systems are normally used together in large applications.  One reason for using the ARINC 429 DITS with the ARINC 629 is that some equipment doesn't support ARINC 629 communications yet.", "The ARINC 629 system is not compatible with the ARINC 429 DITS, however, these systems are normally used together in large applications. One reason for using the ARINC 429 DITS with the ARINC 629 is that some equipment doesn't support ARINC 629 communications yet."], "jumps": ["P440", "P420"]}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: ARINC 629 f asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P1120", "text": ["The ARINC 629 terminal processes the data to and from the data bus.  Remember, the CMC only sends and receives data on the bus, it does not process that data.  The ARINC 629 terminal reads and writes data to memory in the LRU which is shared by the subsystem.", "The ARINC 629 terminal processes the data to and from the data bus. Remember, the CMC only sends and receives data on the bus, it does not process that data. The ARINC 629 terminal reads and writes data to memory in the LRU which is shared by the subsystem."], "jumps": ["P1130", "P1110"]}, {"id": "P1150", "text": ["OPERATION The CMC has two purposes, transmit data it receives from the LRU to the bus, and receive data from the bus and transmit it to the LRU. Remember, the CMC does not check the quality or content of the data from either the bus or the LRU.", "Are you sure you want to Bookmark the Lesson?", "Are you sure you want to Exit the Lesson?", "You skipped X question(s). Do you want to _________", "The test is complete and your score is XX%. Do you want to _________", "You have successfully passed the assessment test!"], "jumps": ["P1160", "P1140"]}, {"id": "P420", "text": ["Equipment made from different manufacturers designed for the ARINC 629 specification should be interchangeable or Line Replaceable Units (LRUs).  This allows a faulty piece of equipment to be replaced easily with a new piece.", "Remember, the transformer induces current onto the bus.", "Equipment made from different manufacturers designed for the ARINC 629 specification should be interchangeable or Line Replaceable Units (LRUs). This allows a faulty piece of equipment to be replaced easily with a new piece.", "Remember, the transformer induces current onto the bus....."], "jumps": ["P430", "P400"]}, {"id": "P1230", "text": ["The stub cable is fed to the serial interface module (SIM).  The SIM converts the voltage doublets into Manchester encoded \ndata, and converts Manchester encoded data to voltage doublets.  If there is a fault in the system, the SIM will isolate the LRU from the CMC.", "The stub cable is fed to the serial interface module (SIM). The SIM converts the voltage doublets into Manchester encoded data, and converts Manchester encoded data to voltage doublets. If there is a fault in the system, the SIM will isolate the LRU from the CMC."], "jumps": ["P1235", "P1240", "P1220"]}, {"id": "P1360", "text": ["Also, if someone (subsystem) has a package (data) to send they too can put it in the mailbox (common memory) for the post office (terminal controller) to pick up and deliver.  Note, the data from the terminal controller and the common memory is sent on a parallel bus.", "Also, if someone (subsystem) has a package (data) to send they too can put it in the mailbox (common memory) for the post office (terminal controller) to pick up and deliver. Note, the data from the terminal controller and the common memory is sent on a parallel bus."], "jumps": ["P1370", "P1330"]}, {"id": "P1372", "text": ["The LRU determines whether it should be accepted.  Data that is not accepted by the LRU is ignored.", "The LRU determines whether it should be accepted. Data that is not accepted by the LRU is ignored..."], "jumps": []}, {"id": "P1390", "text": ["We have discussed the Current Mode ARINC 629 system, which induced current into the bus using a CMC.  Two other modes of operation have been specified by the ARINC 629 specification, but have not been developed.  These two modes are: Voltage mode and Fiber Optic mode.", "We have discussed the Current Mode ARINC 629 system, which induced current into the bus using a CMC. Two other modes of operation have been specified by the ARINC 629 specification, but have not been developed. These two modes are: Voltage mode and Fiber Optic mode.", "\"You have successfully passed the assessment"], "jumps": ["P1910", "P1380"]}, {"id": "P1240", "text": ["The output of the SIM is fed to the Terminal Controller.  The terminal controller is responsible for manipulating, identifying and sending the incoming and outgoing data.  Almost all of the circuitry required for the terminal controller is contained on one 180-pin chip.", "The output of the SIM is fed to the Terminal Controller. The terminal controller is responsible for manipulating, identifying and sending the incoming and outgoing data. Almost all of the circuitry required for the terminal controller is contained on one 180-pin chip."], "jumps": ["P1250", "P1230"]}, {"id": "P1235", "text": ["MANCHESTER ENCODED DATA - A modulation technique that allows easy determination of the original dock speed."], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P2040", "text": ["The three timers are: Transmit Int let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
