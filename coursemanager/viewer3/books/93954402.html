const book = {"title": "93954402", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: RS FLIP-FLOPdf sdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Identify the purpose of an RS flip-flop. w Describe an RS flip-flop circuit.", "w Predict the outputs of an RS flip-flop. w Probe the inputs and outputs of an RS flip-flop. w Recognize normal operation of an RS flip-flop............."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "4. Nida Model 2100 Logic Probe or Equivalent"], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P400", "text": ["The RS flip-flop is the simplest of the flip-flops."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Think of the RS flip-flop as a switch that changes when a signal is applied to the S or R inputs."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Let's begin the lesson on RS FLIP-FLOP...................................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": ["P420"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1040", "text": ["The Reset-Set (RS) flip-flop is designed to store the last input condition until the next input condition is applied."], "jumps": ["P1050", "P1001"]}, {"id": "P1050", "text": ["The RS flip-flop has two inputs and two outputs."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["A high applied to the SET (S) input sets the output Q high and output Q low."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["A high applied to the RESET (R) input sets output Q low and the output Q high."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["If a high is applied to inputs S and R at the same time an illegal state exists.  The outputs Q and Q cannot be determined.", "If a high is applied to inputs S and R at the same time an illegal state exists. The outputs Q and Q cannot be determined."], "jumps": ["P1090", "P1040"]}, {"id": "P1090", "text": ["An application for the RS flip-flop is as a replacement for the mechanical switch."], "jumps": ["P1100", "P1040"]}, {"id": "P1100", "text": ["Mechanical switches physically vibrate or bounce several times before a solid contact is made."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["Bouncing of the switch causes voltage spikes that can affect digital circuit operation."], "jumps": ["P1120", "P1090"]}, {"id": "P1120", "text": ["The RS flip-flop acts as an electrical switch.  There is no mechanical bounce produced by the flip-flop.", "The RS flip-flop acts as an electrical switch. There is no mechanical bounce produced by the flip-flop."], "jumps": ["P1130", "P1090"]}, {"id": "P1130", "text": ["When does this RS flip-flop produce a high output on Q?", "When does this RS flip-flop produce a high output on Q?...."], "jumps": ["P1090"]}, {"id": "P1131", "text": [], "jumps": []}, {"id": "P1132", "text": ["When a high is applied to the R or reset input of a flip-flop the Q output goes low and the Q output goes high."], "jumps": []}, {"id": "P1133", "text": ["When a high is applied to both the S and R inputs the outputs are unknown."], "jumps": []}, {"id": "P1140", "text": ["Remember, a high input to S sets the Q output high and the Q output low.  A high input to R resets the Q output low and the Q output high.", "Remember, a high input to S sets the Q output high and the Q output low. A high input to R resets the Q output low and the Q output high."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["This RS flip-flop is constructed from two NOR gates.  RS flip-flops can also be constructed from NAND gates.", "This RS flip-flop is constructed from two NOR gates. RS flip-flops can also be constructed from NAND gates."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["Let's start with a high applied to input S and a low applied to input R.  The output Q is high and output Q is low.", "Let's start with a high applied to input S and a low applied to input R. The output Q is high and output Q is low."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["The high input on S is applied to gate B and inverted to a low output.  Any high input to a NOR gate will produce a low output.", "The high input on S is applied to gate B and inverted to a low output. Any high input to a NOR gate will produce a low output."], "jumps": ["P1180", "P1150"]}, {"id": "P1180", "text": ["The output of gate B is used as a feedback signal to the input of gate A."], "jumps": ["P1190", "P1150"]}, {"id": "P1190", "text": ["The low input on R is applied to gate A.  The two low inputs of gate A are inverted producing a high output on Q.", "The low input on R is applied to gate A. The two low inputs of gate A are inverted producing a high output on Q."], "jumps": ["P1200", "P1150"]}, {"id": "P1200", "text": ["The output of gate A is used as a feedback signal to the input of gate B."], "jumps": ["P1210", "P1150"]}, {"id": "P1210", "text": ["Notice, even if the inputs are removed, the feedback signal from gate A will hold the Q output low.  Remember, any high input produces a low output.", "Notice, even if the inputs are removed, the feedback signal from gate A will hold the Q output low. Remember, any high input produces a low output."], "jumps": ["P1220", "P1150"]}, {"id": "P1220", "text": ["The flip-flop must remain in the set state until a high is applied to the reset input."], "jumps": ["P1230", "P1150"]}, {"id": "P1230", "text": ["When a high is applied to the R input and a low is applied to the S input the gate will reset."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["The high input on R is applied to gate A and inverted to a low output."], "jumps": ["P1250", "P1220"]}, {"id": "P1250", "text": ["The output of gate A is used as a feedback to the input of gate B."], "jumps": ["P1260", "P1220"]}, {"id": "P1260", "text": ["The low input on S is applied to gate B.  The two low inputs to gate B are inverted producing a high output on Q.", "The low input on S is applied to gate B. The two low inputs to gate B are inverted producing a high output on Q."], "jumps": ["P1270", "P1220"]}, {"id": "P1270", "text": ["The output of gate B is used as a feedback to the input of gate A."], "jumps": ["P1280", "P1220"]}, {"id": "P1280", "text": ["Notice, even if the inputs are removed the feedback signal from gate B will hold the Q output low."], "jumps": ["P1290", "P1220"]}, {"id": "P1290", "text": ["The flip-flop must remain in the reset state until a high is applied to the set input."], "jumps": ["P1300", "P1220"]}, {"id": "P1300", "text": ["Feedback allows the flip-flop to hold the last input condition until a different condition is applied."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["The ability of the flip-flop to hold an output condition, even after the inputs have been removed, is a result of feedback."], "jumps": ["P1320", "P1290"]}, {"id": "P1320", " let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
