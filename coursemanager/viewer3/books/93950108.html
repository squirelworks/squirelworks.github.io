t to return to the Objective Menu..."], "jumps": ["P1001", "P1990"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2010", "text": ["A square root is the base of a squared number.", "A square root is the base of a squared number.............."], "jumps": ["P2020", "P2001"]}, {"id": "P2020", "text": ["The square root of a number is a number which when multiplied by itself gives the original number."], "jumps": ["P2030", "P2010"]}, {"id": "P2030", "text": ["The symbol for the square root is         and it is called a radical sign.", "The symbol for the square root is and it is called a radical sign..."], "jumps": ["P2040", "P2010"]}, {"id": "P2040", "text": ["An alternate radical sign uses the number 2 to indicate a square root."], "jumps": ["P2050", "P2010"]}, {"id": "P2050", "text": ["When a number appears under the radical sign, it means that you are to find a number which can be multiplied by itself to give the original number."], "jumps": ["P2060", "P2010"]}, {"id": "P2060", "text": ["For example, the square root of 25 is 5."], "jumps": ["P2070", "P2010"]}, {"id": "P2070", "text": ["In general terms, the square root of a number is expressed as:"], "jumps": ["P2080", "P2010"]}, {"id": "P2080", "text": ["Fractional exponents can also indicate square roots. 9 to the 1/2 (or .5) power equals the square root of 9."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["And as you might have guessed, there are many types of roots other than square roots."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["However, this lesson teaches how to calculate square roots only."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["What is the resultant number called if the number, when multiplied by itself, equals the original number?"], "jumps": ["P2100"]}, {"id": "P2111", "text": [], "jumps": []}, {"id": "P2112", "text": ["An exponent is a number the raises a base number to a power.  It is not the result of finding a number that when multiplied by itself equals the original number.", "An exponent is a number the raises a base number to a power. It is not the result of finding a number that when multiplied by itself equals the original number."], "jumps": []}, {"id": "P2113", "text": ["A power is a way of expressing numbers that use exponents.  It is not the result of finding a number that when multiplied by itself equals the original number.", "A power is a way of expressing numbers that use exponents. It is not the result of finding a number that when multiplied by itself equals the original number."], "jumps": []}, {"id": "P2120", "text": ["Which expression signifies square roots?", "Which expression signifies square roots?..................."], "jumps": ["P2110"]}, {"id": "P2121", "text": [], "jumps": []}, {"id": "P2122", "text": ["The letters a   are used to signify powers or that a number is using exponents.", "The letters a are used to signify powers or that a number is using exponents."], "jumps": []}, {"id": "P2123", "text": ["The letters  a    do not signify square roots.", "The letters a do not signify square roots.............."], "jumps": []}, {"id": "P2130", "text": ["What is the square root of 36?", "What is the square root of 36?ped.........................."], "jumps": ["P2120", "P2135"]}, {"id": "P2131", "text": [], "jumps": []}, {"id": "P2132", "text": ["5 times 5 equals 25.", "5 times 5 equals 25.page..................................."], "jumps": []}, {"id": "P2133", "text": ["4 times 4 equals 16.", "4 times 4 equals 16.page..................................."], "jumps": []}, {"id": "P2135", "text": ["SQUARE ROOT OF 36 - To find the square root of 36 you must find a number that when multiplied by itself equals the original number, 36."], "jumps": []}, {"id": "P2140", "text": ["Up to this point, the square root of numbers were easily calculated."], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["However, finding the square root of 2835 is not as easy!", "However, finding the square root of 2835 is not as easy!..."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["One way to solve for these difficult problems is to use a technique of modified division."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["You first separate the number into groups of two starting at the decimal point."], "jumps": ["P2180", "P2150"]}, {"id": "P2180", "text": ["Here are some additional examples showing the groups of two.", "S7 = S07 . 55 35", "S127.1 = S01 27 . 10", "S567.823 = S05 67 . 82 30"], "jumps": ["P2190", "P2150"]}, {"id": "P2190", "text": ["How would you group this number to find the square root?", "How would you group this number to find the square root?..."], "jumps": ["P2180"]}, {"id": "P2191", "text": [], "jumps": []}, {"id": "P2192", "text": ["To group the original number, start at the decimal point and go to the right and left."], "jumps": []}, {"id": "P2200", "text": ["Let's find the square root of 2835.  The number has been grouped so we can start dividing.", "Let's find the square root of 2835. The number has been grouped so we can start dividing."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["Starting with the first group, find a number that when multiplied by itself will give an answer close but not larger than the first group.", "5 x 5 = 25 6 x 6 = 366 x 6 = 36"], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["Notice in the example that 5 is the largest number.   Four squared equals 16 which is not close enough to 28.   Six squared equals 36 which is too large.", "Notice in the example that 5 is the largest number. Four squared equals 16 which is not close enough to 28. Six squared equals 36 which is too large..", "4 x 4 = 16 5 x 5 = 25 6 x 6 = 36"], "jumps": ["P2230", "P2200"]}, {"id": "P2230", "text": ["Now, bring down the next group.  Never bring down a single number.  This is your new dividend.", "Now, bring down the next group. Never bring down a single number. This is your new dividend."], "jumps": ["P2240", "P2200"]}, {"id": "P2240", "text": ["Double the quotient, this is your new divisor, and place it to the left of your new dividend.", "5 x 2 = 10 6 x 6 = 366 x 6 = 36"], "jumps": ["P2250", "P2200"]}, {"id": "P2250", "text": ["Ignore the last digit in the new dividend, the 5 in 335, find out how many times the new divisor, 10, will go into the new dividend, 33.", "10 x 2 = 20 10 x 3 = 30 10 x 4 = 40"], "jumps": ["P2260", "P2200"]}, {"id": "P2260", "text": ["Now, place the result in the quotient and on the end of the new divisor, 10.", "10 x 2 = 20 10 x 3 = 30 10 x 4 = 40"], "jumps": ["P2270", "P2200"]}, {"id": "P2270", "text": ["Multiply 3 times 103 and place the result under 335 (include the five in the dividend.) Subtract like you would do if dividing.", "103 x 3 = 309 x 6 = 366 x 6 = 36"], "jumps": ["P2280", "P2200"]}, {"id": "P2280", "text": ["At this point you have found the approximate square root of 2835. However, 53 times 53 equals 2809 which is not close enough to 2835.", "53 x 53 = 2809 x 6 = 366 x 6 = 36"], "jumps": ["P2290", "P2200"]}, {"id": "P2290", "text": ["So, bring down the next group and repeat the process. In this case the next group is 00.   Be sure to keep track of the decimal point.", "So, bring down the next group and repeat the process. In this case the next group is 00. Be sure to keep track of the decimal point."], "jumps": ["P2300", "P2200"]}, {"id": "P2300", "text": ["Double your quotient as before and place it to the left of the new dividend.", "53 x 2 = 106 x 6 = 366 x 6 = 36"], "jumps": ["P2310", "P2200"]}, {"id": "P2310", "text": ["Ignoring the last 0 in 2600, find out how many times 106 will go into 260.  Place your result in the quotient and on the end of the 106.", "Ignoring the last 0 in 2600, find out how many times 106 will go into 260. Place your result in the quotient and on the end of the 106.", "106 x 1 = 106 106 x 2 = 212 106 x 3 = 318"], "jumps": ["P2320", "P2200"]}, {"id": "P2320", "text": ["Multiply the 1062 by 2 and place let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
