<script>
const book = {"title": "9395P308", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: EXPANSIONE sdf sdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe the types of expansion buses. w Identify bus type by expansion slot. w Understand the characteristics of different bus types..........", "w Recognize common computer adapter cards. w Describe the purpose of different types of adapter cards. w Identify adapter card compatibility with the expansion bus................................."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In previous lessons, the term bus was defined as a common electrical pathway for data to flow."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["In this lesson, we will examine computer buses and their relationships to each other and to the system in general.", "We will also examine some of the adapter cards which make use of those expansion capabilities."], "jumps": ["P420", "P400", "P430"]}, {"id": "P430", "text": ["Let's begin the lesson on EXPANSION.TLE..................................."], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": ["P430"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["An expansion bus is the data pathway between the system and its peripheral components."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["There is a hierarchical structure of buses, with each one connecting to a faster bus above it in the hierarchy. Modern systems have at least three buses, and most have four or more."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Buses have two important characteristics: width and speed.", "8 conductors = 8 bits = 1 byte 64 conductors = 64 bits = 8 bytess"], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["Width refers to the number of individual data bits that can flow simultaneously. This is determined by the number of individual conductors available to carry the signals, where each conductor carries an individual bit of information..", "8 conductors = 8 bits = 1 byte 64 conductors = 64 bits = 8 bytess"], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["The speed of a bus refers to its clock speed. It is measured in megahertz, the same as the system clock, but an expansion bus will always be slower than the system clock."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["Some components, such as memory, need to run as fast as possible to keep up with the CPU. Others would be unreliable at such high speeds, and need to run slower."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["The processor bus is the top of the hierarchy, the fastest bus in the computer. It is the communication path between the CPU and the North Bridge of the chipset."], "jumps": ["P1090", "P1040"]}, {"id": "P1090", "text": ["The processor bus is also the link between the CPU and any cache memory that may be located on the motherboard, such as was done with older systems."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["At the other end of the processor bus, the chipset's North Bridge generates the next tier of buses and connects to the South Bridge via the PCI bus. More on the PCI bus in a moment."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["The South Bridge generates the slowest tier of buses. It also connects to the Super I/O chip, which then connects to the I/O devices that don't communicate via buses, such as the keyboard and mouse.."], "jumps": ["P1120", "P1080"]}, {"id": "P1120", "text": ["Which is the fastest bus in a computer?...................."], "jumps": ["P1110"]}, {"id": "P1121", "text": [], "jumps": []}, {"id": "P1122", "text": ["The ISA bus is one of the slowest buses in the computer...."], "jumps": []}, {"id": "P1123", "text": ["The PCI bus is fast, but it isn't the fastest bus.........."], "jumps": []}, {"id": "P1130", "text": ["The ISA bus (Industry Standard Architecture) is the oldest of the major types of I/O buses. It was introduced with the IBM PC in 1981 as an 8-bit, 4.77 MHz bus."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["It was increased to 16 bits at 6 MHz in 1984 for use in the PC/AT, and the speed was eventually standardized at 8.33 MHz."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["Although the ISA bus and adapter cards have been surpassed in capabilities by newer buses and cards, there are still some in use today because they are still capable of providing useful I/O in situations where very high speeds aren't really necessary...", "They are becoming less common, however, as many newer motherboards are being manufactured without the ISA bus at all.", "The ISA bus standard requires a -5 VDC power source, but no other components or buses use that particular voltage. This means that the power supply will change, also, as the ISA bus ceases to be installed in new systems.."], "jumps": ["P1160", "P1130", "P1170", "P1180"]}, {"id": "P1180", "text": ["The MCA bus (Micro Channel Architecture) was introduced in 1987 by IBM to replace the ISA bus for 32-bit PS/2 systems."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["It was technically superior to ISA on all counts. It was faster and more powerful than the ISA bus and required no hardware configuration of any kind. it had no jumpers or switches at all. Everything was done automatically via software."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["You can borrow it... oh yes and its going to cost you.", "There are two reasons that MCA didn't take the industry by storm: IBM kept it a proprietary system, and it was not compatible with the large installed base of ISA cards.", "But it's not compatible with anything I have."], "jumps": ["P1210", "P1180"]}, {"id": "P1210", "text": ["Not only did IBM insist that licensees pay royalties for MCA, but they also required royalties for prior use of ISA, which had been free. This was not a popular idea, obviously."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["The lack of compatibility meant that existing ISA cards would have to be replaced with MCA cards. This would have required a huge outlay of capital, and people (and corporations) were simply not willing to spend the extra money.."], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["The EISA bus (Extended ISA) was introduced in 1988 as an alternative to the MCA bus for 32-bit systems using ISA hardware. Originally developed by Compaq, it was released as an open standard in order to ensure that vendors would support it.."], "jumps": ["P1240", "P1200"]}, {"id": "P1240", "text": ["Unfortunately, it just never caught on, and few adapter cards were ever developed. Most of the cards that were produced were disk array and server network cards, so there was a niche market, but that was all.."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["The most important feature of the new bus was the ability of the slot to accommodate either the older ISA cards or the newer EISA cards, and most EISA slots ended up being used with older ISA cards..."], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["Why didn't the MCA bus supplant the ISA bus?...............", "Using MCA technology required payment of royalties.", "It was incompatible with existing expansion cards."], "jumps": ["P1250"]}, {"id": "P1261", "text": [], "jumps": []}, {"id": "P1262", "text": ["Using MCA technology would have required paying royalties, but that wasn't the only reason."], "jumps": []}, {"id": "P1263", "text": ["The MCA bus wasn't compatible with existing expansion cards, but that wasn't the only reason."], "jumps": []}, {"id": "P1270", "text": ["Local Bus is a general term for an expansion capability which takes advantage of higher speeds by allowing peripherals to connect to the processor bus (local to the CPU)."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["Since the North Bridge is the bottom end of the processor bus, buses generated by it are considered to be local buses, even if they don't run at the full processor speed."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["This connection to the processor bus means that the peripheral shares the bus's full width. That is, a 64-bit processor will have a 64-bit local bus instead of a 32- or 16-bit bus. This makes it ideal for supporting cache RAM and high speed graphics."], "jumps": ["P1300", "P1270"]}, {"id": "P1300", "text": ["The VESA Local Bus (Video Electronics Standards Association), also called the VL-Bus, was the first local bus in use. It was developed by NEC and released as an open standard for the 80486 family of processors..."], "jumps": ["P1310", "P1270"]}, {"id": "P1310", "text": ["It was capable of moving data at the full processor bus width and speed because it was actually a direct connection to the processor bus, brought out to an expansion slot (a card edge connector)..."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["Problems sometimes arose because of timing glitches caused by capacitance of the different expansion cards. Since different processors ran at different speeds, no one card could be properly matched to all of them.."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["The VL-bus fell out of favor and was replaced by the more reliable PCI bus. This means that the VL-bus is strictly a 486 bus. It was never used on a Pentium system."], "jumps": ["P1340", "P1310"]}, {"id": "P1340", "text": ["The PCI bus (Peripheral Component Interconnect) was introduced in 1992. It is sometimes called a mezzanine bus because it adds another layer to the bus structure by adding another set of controller chips instead of connecting directly to the processor bus.."], "jumps": ["P1350", "P1310", "Peripheral"]}, {"id": "P1350", "text": ["It runs at 33 MHz using the full width of the processor bus (either 32-bit or 64-bit), and can transfer data between other parts of the system while the CPU is occupied with other tasks."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["It is generated by the chipset's North Bridge and is used to communicate with the I/O cards in the PCI slots and with the South Bridge. Even though the South Bridge isn't generated by the PCI, it still uses the PCI for its communication path with the North Bridge.."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["The AGP (Accelerated Graphics Port) was created by Intel specifically for high-performance video and graphics."], "jumps": ["P1380", "P1350"]}, {"id": "P1380", "text": ["It is based on PCI technology but is totally separate from the PCI bus. It has a number of additions and enhancements to the PCI standards aimed at high-end video and graphics."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["Unlike other buses, AGP is a single, full-width (32-bit or 64-bit) high-performance port-no other connections, just one video card slot."], "jumps": ["P1400", "P1370"]}, {"id": "P1400", "text": ["Originally released in 1996, it specified a 66MHz clock at 1X or 2X signaling rate (an effective data transfer rate of 266MB/sec or 533 MB/sec).", "Clock Speed Bus Width Signaling Rate Transfer Rateeeee", "66MHz 32 bits 1x 266MHz 66MHz 32 bits 2x 533MHz 66MHz 32 bits 4x 1066MHz"], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["Version 2.0, released in1998, reduced the operating voltage from 3.3 V to 1.5 V and added a 4X signaling rate which gives an effective transfer rate of 1066 MB/sec)."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["The PC Card, formerly known as the PCMCIA card (Personal Computer Memory Card International Association) provides platform-independent expandability for portable computers."], "jumps": ["P1430", "P1400", "Personal"]}, {"id": "P1430", "text": ["They are credit card sized devices which are intended to fit into a small slot on a laptop or notebook computer. They come in all types, everything from RAM to hard disk drives to network cards to GPS receivers, but are limited to16-bit data paths at 8 MHz.."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["The CardBus card is an extension of the PC Card standard. It provides for a 33MHz 32-bit PC Card interface and includes a new, shielded connector which prevents CardBus PC Cards from being inserted into older slots, which don't support the newer standard..."], "jumps": ["P1450", "P1420"]}, {"id": "P1450", "text": ["The USB (Universal Serial Bus) standard was initially released in 1996. It was revised to v1.1 in 1998 and to v2.0 in 2000. Version 1.x offers speeds of up to 12 Mbits/second, and version 2.x can go as high as 480 Mbits/second."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["USB is probably the most popular expansion bus ever invented. It offers a long list of improvements over existing expansion buses.", "For instance, the bus can include up to 127 different devices simultaneously, although the bandwidth is shared among all the peripherals connected.", "In addition, USB acts to consolidate all I/O devices. Many different kinds of devices can be connected, such as disk drives, mice and other pointing devices, keyboards, scanners, printers, and so on.."], "jumps": ["P1470", "P1450", "P1480", "P1490"]}, {"id": "P1490", "text": ["Also, the peripherals are all hot-swappable. That is, they can be connected or disconnected while the system and the peripheral are both powered on, without any need to restart."], "jumps": ["P1500", "P1480"]}, {"id": "P1500", "text": ["They are automatically recognized and configured as soon as they are physically connected, and they all share the same set of system resources. Under any previous bus architecture they would each require a separate share of the system's resources.."], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["They also don't require separate slots on the motherboard. In fact, peripherals which have additional ports can act as hubs, providing connection points for other peripherals. Hubs can be stacked (cascaded) up to five levels deep.", "'(!';!(;;';!(N;'N((N((V(;N;(N((N'(NV;('V;'WV; U';';", "(V(;NN(;;'N;';;N;' ;(;(N;'N(;;(N(;;('U;'V'U;UUV(VVVQ(Q;'';UU(U'U('(UVU;''''(;('('V(''':(':(:'':('';:G''''G'''G''7'''''F", "! N!;NN'D;NN(N;;NWNN;NNNDND ;DNDNDN;NN !:7PR3>>"], "jumps": ["P1520", "P1490"]}, {"id": "P1520", "text": ["What is the maximum number of video cards that can be connected via the AGP bus?"], "jumps": ["P1510"]}, {"id": "P1521", "text": [], "jumps": []}, {"id": "P1522", "text": ["The AGP bus cannot connect two video cards................."], "jumps": []}, {"id": "P1523", "text": ["The AGP bus cannot connect four video cards................"], "jumps": []}, {"id": "P1530", "text": ["Firewire (IEEE-1394) was originally developed by Apple Computer and Texas Instruments. It was turned over to the Institute of Electrical and Electronic Engineers in late 1995."], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["The original version offers connectivity of 100 or 200 Mbits per second, with an upper limit of 400 Mbits/sec. Second-generation standards will be in the gigabit range."], "jumps": ["P1550", "P1530"]}, {"id": "P1550", "text": ["Because of the enormously fast transfer rates, it has gained popularity for use with digital video (referred to as DV) and multimedia."], "jumps": ["P1560", "P1530"]}, {"id": "P1560", "text": ["IEEE-1394 is not specifically a computer expansion bus. The interface can be built into just about any electronic device-it does not require a connection to a host computer."], "jumps": ["P1570", "P1550"]}, {"id": "P1570", "text": ["It can be used, for example, to connect a DV camcorder or electronic musical keyboard to a DV VCR."], "jumps": ["P1910", "P1560"]}, {"id": "P1910", "text": ["This completes the information on THE EXPANSION BUS........"], "jumps": ["P1001", "P1560"]}, {"id": "P1920", "text": ["1. An expansion bus is the data pathway between the system and its peripheral components. 2. Buses have two important characteristics: width and speed..........", "8 conductors = 8 bits = 1 byte 64 conductors = 64 bits = 8 bytess"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["3. The processor bus is the communication path between the CPU and the North Bridge, and is the fastest bus in the computer. 4. The North Bridge connects to the South Bridge via the PCI bus.."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["5. The MCA bus was unsuccessful because it was proprietary and it was not compatible with existing ISA cards."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["6. A Local Bus is a bus which connects to the processor bus (local to the CPU). 7. Buses generated by the North Bridge are considered to be local buses, even if they don't run at the full processor speed.."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["8. The VESA Local Bus was the first local bus in use. 9. The PCI bus can transfer data between other parts of the system while the CPU is occupied with other tasks."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["10. The AGP (Accelerated Graphics Port) was created specifically for high-performance video and graphics. 11. AGP is based on PCI technology, but is totally separate from the PCI bus and has only a single port."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["12. The PC Card (or PCMCIA card) provides expandability for a laptop or notebook computer. 13. The CardBus card is a 33 MHz 32-bit PC Card with a new, shielded connector.."], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["14. USB can include up to 127 different devices simultaneously, and they can be connected or disconnected without any need to restart. 15. USB bandwidth is shared among all the devices."], "jumps": ["P1999", "P1980"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1990"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["In general, it's difficult or impossible to tell what a particular adapter card does just by looking at the circuitry itself. The key is to examine the connectors. Each different type of function or interface uses a characteristic connector, as does each different bus."], "jumps": ["P2030", "P2001", "PJJj", "P"]}, {"id": "P2030", "text": ["We'll examine some of the more common adapter cards and briefly discuss what each does, as well as identifying its interface or interfaces. Remember, the connectors discussed are those on the adapter cards, not the cables that connect to them.."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["One of the most important adapters in a computer is the video (or graphics) adapter, which is the piece of hardware that tells the computer's monitor how to create the image that you see."], "jumps": ["P2050", "P2020", "PT", "P", "PLo", "PY", "PTQ", "Pfn", "PRP", "Pa", "PP", "PYa"]}, {"id": "P2050", "text": ["In the early days there was no such thing as built-in video. Each system required a video adapter card, and the output of these early cards was digital."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["With the release of the model PS/2 in 1987, IBM introduced built-in video and analog video to the \"IBM compatible\" world. The reason for moving from digital to analog instead of analog to digital is that analog allows for more colors in the display..", "1. Keyboard/Mouse data 2. Keyboard data 3. Ground 4. +5 VDC 5. Keyboard/Mouse CLK 6. Keyboard CLK"], "jumps": ["P2070", "P2040", "P", "PGE", "PG"]}, {"id": "P2070", "text": ["The new display type was called the Video Graphics Array (VGA), and it was produced as built-in video for IBM systems and as a separate adapter card for other systems."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["The VGA standard allows for display of a picture 640 pixels wide by 480 pixels high, using up to 256 colors at once."], "jumps": ["P2090", "P2060"]}, {"id": "P2085", "text": ["PIXEL- The word comes from picture element. It is the smallest \"piece\" of a picture on a monitor, somewhat like the individual dots that are used to make a picture in a newspaper."], "jumps": []}, {"id": "P2090", "text": ["The operation of the video adapter will be discussed in more detail in a later lesson. For now, we'll concentrate on identifying the particular type of adapter."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["Very old systems used a DB-9 female connector. Adapter cards for these older non-IBM systems plugged into an ISA expansion slot."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["Modern adapters use a connector which is the size and shape of a DB-9 female, but close examination shows that there are actually fifteen pins, not nine, laid out in three rows of five pins each...", "High Density 15 - pin Subminiature D shell Connector"], "jumps": ["P2120", "P2090"]}, {"id": "P2120", "text": ["This fifteen-pin connector is formally called a High-Density 15-pin Subminiature D-Shell connector, but it is more commonly just called a VGA connector."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["The first VGA cards were for ISA slots, but newer ones are for either a PCI slot or for an AGP slot. The difference between these two is shown below."], "jumps": ["P2140", "P2110"]}, {"id": "P2140", "text": ["Which connector would you connect a monitor to?............"], "jumps": ["P2130"]}, {"id": "P2141", "text": [], "jumps": []}, {"id": "P2142", "text": ["The DB-9 male is used for serial ports. It is not a video port."], "jumps": []}, {"id": "P2143", "text": ["The DB-25 female is used for parallel ports. It is not a video port."], "jumps": []}, {"id": "P2150", "text": ["When it comes to sound cards, there are so many variations that it is impossible to discuss them all. Therefore, we will concentrate on those things that are considered characteristic of sound cards in general.."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["A typical sound card is characterized by mini-phono jacks for both input and output connectors. A different style connector, a DB-15 female, is also commonly installed as a game port."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["In addition to connecting a joystick or other game-type controller to the system, the DB-15 can also be used as the input port for a MIDI device such as a synthesizer keyboard."], "jumps": ["P2180", "P2150"]}, {"id": "P2180", "text": ["The outputs are usually stereo jacks. There will be one for the speakers (SPEAKER or SPKR or AUDIO OUT) and there may be another for direct connection to a stereo system or other playback or recording device (LINE OUT or OUT).."], "jumps": ["P2190", "P2150"]}, {"id": "P2190", "text": ["One input connector is for a microphone (MICROPHONE or MIC). The other is for an external sound source such as a stereo amplifier or synthesizer, and is commonly labeled LINE IN or AUX (or AUXILIARY) IN..."], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["Some cards have individual left and right speaker outputs, so these jacks are mono, not stereo. On such a card, there may or may not be another output jack for LINE OUT."], "jumps": ["P2210", "P2180"]}, {"id": "P2210", "text": ["High-end sound cards frequently have other connectors as well, such as digital interfaces and dedicated MIDI ports."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["However, most connectors other than the basic line in, line out, microphone, speakers and game port are usually either on the side of the card or on a separate auxiliary panel which connects to the sound card via cables inside the computer..."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["One fairly common connector for high-end cards is the SPDIF, or Sony/Philips Digital Interface, which is normally an RCA jack. This connector is often mounted on the sound card rear panel."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["Dedicated MIDI ports are typically mini-DIN connectors, and are usually found on separate sub-cards which connect to the sound card via cables. These ports may be either on the computer's rear panel or front panel.."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["If a sound card has auxiliary connections, where would they most likely be located?", "On the side of the sound card, near the top", "On an auxiliary connector panel, connected to the sound card by internal cables."], "jumps": ["P2240"]}, {"id": "P2251", "text": [], "jumps": []}, {"id": "P2252", "text": ["Auxiliary connectors are sometimes located on the side of the sound card, but that's not the only place."], "jumps": []}, {"id": "P2253", "text": ["Auxiliary connectors are sometimes located on an auxiliary connector panel, but that's not the only place."], "jumps": []}, {"id": "P2260", "text": ["Most modern systems include two serial ports (designated COM1 and COM2) and one parallel port built-in on the motherboard. Older systems used a type of expansion card called a multi-I/O card.."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["The multi-I/O card normally includes at least one serial port and at least one parallel port. Even for systems with built-in ports, it's sometimes necessary to add additional ones. This is more likely in an industrial setting than in a small office or home environment."], "jumps": ["P2280", "P2250"]}, {"id": "P2280", "text": ["For systems which require several serial ports, such as those used for industrial control, there are adapter cards called multi-serial cards. These cards provide anywhere from two to sixteen additional serial ports, but no other ports.."], "jumps": ["P2290", "P2250"]}, {"id": "P2290", "text": ["Very old serial ports (on PC, XT, and PS/2 systems) used a 25-pin D style male connector (usually referred to as a DB-25), but more modern ones use a 9-pin. Whether it uses a 9-pin or 25-pin connector, the D style serial port connector is always a male.."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["The parallel port is easily distinguished from the serial port by the fact that it always uses a DB-25 female connector. There are four varieties of parallel port, but they all use this same connector..", "`pg^]^n fgppgf^ggg]f^^^^gr``rg`r_l{ssl?m4mo?mm}x", "xD}}4r;z__!zhhr_p_pppngnvpppgnfnnn^gppnf^^f]^::fnnnvvgr` phhrhl", ">vvvv, pgpp,n>r`ppvv= vp>>_>>rrpvp>!>prpppp>p!vvnpvpKv>p,v>ppvK>vvKvv,p", "hrralsr_`pp>rp, rhhsrp!hrhhlzhlsszrrs4ss_ss;4lah@z4lshsszrhshr", "mm?mlr_prr,p_K>ppgngpprp>ppggnnngg`p^^nnnnv, ,p phhr__rr;4szhs?m44;rrhrrhh_r!4hr", "-&mh_hrp_,nnfff:qf:c:%dbqdd::cddqcfngff ^,gn=n,f!gf_{{4hl?mm??smxx", "laWV__r``g``_,gpr ^^f]^f]]f^nf:%f=nnngrrrrr>z{{}L"], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["The original parallel port could only send data in one direction, from the system to the peripheral, and was intended for printers. Modern ports can both send and receive data, and are used for many other types of devices in addition to printers..."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["The original port is referred to as the Standard Parallel Port, or SPP. It was originally intended only to send data to a printer, eight bits at a time."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["However, a clever scheme was devised to allow the port to use four of its data lines to receive data. Although the SPP is extremely rare today, this crude bidirectionality allowed printers to send feedback to the system for the first time.."], "jumps": ["P2340", "P2310"]}, {"id": "P2340", "text": ["With the introduction of the Model PS/2 in 1987, IBM also introduced a true bidirectional parallel port, sometimes called the \"PS/2 type\" or \"extended\" parallel port. This type, too, is extremely rare, having been replaced by more capable types.."], "jumps": ["P2350", "P2310"]}, {"id": "P2350", "text": ["In 1991 Intel, Xircom, and Zenith Data Systems released a newer specification called the Enhanced Parallel Port, or EPP, sometimes referred to as the \"Fast Mode\" type.", "Enhanced Parallel Port Enhanced Capabilities Port"], "jumps": ["P2360", "P2310"]}, {"id": "P2360", "text": ["The EPP was specifically developed to include external disk and tape drives and LAN adapters. It can achieve transfer rates of up to 2 MB/sec in either direction."], "jumps": ["P2370", "P2350"]}, {"id": "P2370", "text": ["The Enhanced Capabilities Port (ECP) was released in 1992 as a joint effort of Microsoft and Hewlett-Packard. Like the EPP, it was developed for relatively high-speed bidirectional communications between a system and its external peripherals.."], "jumps": ["P2380", "P2350"]}, {"id": "P2380", "text": ["The IEEE 1284 standard was formalized in 1994 to address the physical characteristics and the physical and electrical standards for parallel ports, but it only addresses hardware and line control. The software interface is covered by the IEEE1284.3 standard..", "Port Type Description", "Standard Parallel Port 8 bit output, 4 bit input; 50KB/sec IN and 150KB/sec OUT Bidirectional Parallel Port 8 bit output, 8 bit input; 150KB/sec IN and 150KB/sec OUT Enhanced Parallel Port 8 bit output, 8 bit input; 1/2-2MB/sec IN and .5-2MB/sec OUT Enhanced Capabilities Port 8 bit output, 8 bit input; 1/2-2MB/sec IN and .5-2MB/sec OUT"], "jumps": ["P2390", "P2350"]}, {"id": "P2390", "text": ["Which standard covers the parallel port?..................."], "jumps": ["P2380"]}, {"id": "P2391", "text": [], "jumps": []}, {"id": "P2392", "text": ["IEEE 1394 covers Firewire (i.Link), not parallel ports....."], "jumps": []}, {"id": "P2393", "text": ["IEEE 802 covers ethernet, not parallel ports...............", "The modem (MOdulator/DEModulator) is the card which allows a stand-alone computer to connect to another computer or to a network via a normal telephone line."], "jumps": ["P2410", "P2390", "PEP"]}, {"id": "P2410", "text": ["It normally includes two RJ-11 connectors. One is for the telephone line to connect into the system, and the other is a pass-through so that a telephone can be physically connected to the line at the same time.."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["This eliminates the need to change the plugs around each time, but only one device can actually use the line at a time."], "jumps": ["P2430", "P2400"]}, {"id": "P2430", "text": ["The Network Interface Card (NIC) may have any of three connectors associated with it. The most common is the RJ-45 jack, which is used for connecting to an ethernet network via twisted-pair cable.."], "jumps": ["P2440", "P2400"]}, {"id": "P2435", "text": ["TWISTED-PAIR CABLE- A type of cable in which individual pairs of wires are actually twisted together in order to help cancel noise which may be picked up from outside sources. This is discussed in some detail in other lessons."], "jumps": []}, {"id": "P2440", "text": ["As you can see, the RJ-45 looks like an oversized telephone connector, having room for eight conductors instead of the six for a regular telephone jack."], "jumps": ["P2450", "P2430"]}, {"id": "P2450", "text": ["The second connector commonly associated with network cards is the BNC connector. This is commonly used for a type of network cabling known as ThinNet, which uses coaxial cable."], "jumps": ["P2460", "P2430", "P", "PNk", "PTW", "P5"]}, {"id": "P2460", "text": ["Although there is still a significant amount of thinnet in use, it has not been the first choice in network cabling for quite awhile and is seldom installed anymore. New installations use twisted pair technology instead of coaxial cabling.."], "jumps": ["P2470", "P2450"]}, {"id": "P2470", "text": ["The third type of network card connector is the DB-15 female. This connector is no longer being put on network cards, but exists on many legacy cards. It is used to connect a type of coaxial cable known as Thicknet.."], "jumps": ["P2480", "P2450"]}, {"id": "P2475", "text": ["LEGACY CARDS- Legacy refers to items (in this case, adapter cards) which were in use in the past, but are no longer being produced. This means that the only ones around are the ones that are either still in use or were in storage somewhere."], "jumps": []}, {"id": "P2480", "text": ["Thicknet was used with the original form of ethernet, called 10Base5. This cable didn't connect directly to the NIC. Instead, an adapter called an AUI (Attachment Unit Interface) was connected to the DB-15, and the AUI connected to the cable."], "jumps": ["P2490", "P2470"]}, {"id": "P2490", "text": ["SCSI host adapter cards use one of two styles of connectors. They either use a D-type or a Centronics type connector, and the host is always a female connector."], "jumps": ["P2500", "P2480"]}, {"id": "P2500", "text": ["Older (8-bit) versions of SCSI use either a full-sized 50-pin Centronics connector or a DB-25 female. The version of the standard which followed, called SCSI-2, included a higher density version of the 50-pin Centronics style connector.."], "jumps": ["P2510", "P2490"]}, {"id": "P2510", "text": ["The standard 50-pin Centronics connector looks like the parallel port connector used for printers, but it is larger-the parallel printer connector has only 36 pins. The DB-25, on the other hand, is the same DB-25 which is used for the parallel port.."], "jumps": ["P2520", "P2490"]}, {"id": "P2520", "text": ["This use of the same connector for two different ports can be a serious problem because the hardware is not pin compatible. Plugging in the wrong hardware can damage the peripheral or the adapter card itself. The card type must be known in advance.."], "jumps": ["P2530", "P2510"]}, {"id": "P2530", "text": ["The most recent version, SCSI-3, uses a 68-pin high-density connector for individual peripherals, and an 80-pin connector for drive arrays."], "jumps": ["P2540", "P2520"]}, {"id": "P2535", "text": ["DRIVE ARRAY- A group of disk drives mechanically and electrically combined to effectively create a single integrated peripheral. This makes the array very high performance."], "jumps": []}, {"id": "P2540", "text": ["The USB host adapter has either two or four Type A connectors available at the rear panel, the front panel, or both."], "jumps": ["P2550", "P2530"]}, {"id": "P2550", "text": ["The USB peripheral device itself will normally have a Type B connector. If the peripheral acts as a hub, then it will have a Type A connector as well."], "jumps": ["P2560", "P2540"]}, {"id": "P2560", "text": ["The IEEE 1394 interface will probably not be built into computers the way that other interfaces have been (at least not for the forseeable future), so an expansion card will continue to be necessary for those who want the interface..."], "jumps": ["P2570", "P2550"]}, {"id": "P2570", "text": ["The IEEE 1394 connector is extremely small. The 6-pin connector is less than half an inch wide, while the 4-pin is only about a quarter inch wide. The extremely small size makes them a good choice for cameras."], "jumps": ["P2580", "P2560"]}, {"id": "P2580", "text": ["However, the 6-pin connector will probably continue to be the first choice for adapter card interfaces, since the extra two pins supply power to the peripheral."], "jumps": ["P2590", "P2570"]}, {"id": "P2590", "text": ["If the pins are present, the power may be used or not, as needed. If power isn't there, the peripheral must have its own source of power, limiting the user's options."], "jumps": ["P2910", "P2570"]}, {"id": "P2910", "text": ["This completes the information on ADAPTER CARDS.TLE........"], "jumps": ["P2001", "P2560"]}, {"id": "P2920", "text": ["1. The video (or graphics) adapter tells the computer's monitor how to display the image that you see. 2. A VGA connector is the size and shape of a DB-9 female, but has three rows of five pins each..."], "jumps": ["P2930", "P2001", "PT", "P", "PLo", "PY", "PTQ", "Pfn", "PRP", "Pa", "PP", "PYa"]}, {"id": "P2930", "text": ["3. A typical sound card has mini-phono jacks for audio input/output and a DB-15 female for a game or MIDI port. 4. The multi-I/O card normally includes at least one serial port and at least one parallel port."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["5. The D style serial port connector is always a male. 6. The parallel port is covered by the IEEE 1284 standard. 7. A parallel port always uses a DB-25 female connector."], "jumps": ["P2950", "P2930"]}, {"id": "P2950", "text": ["8. The Enhanced Parallel Port (EPP), and the Enhanced Capabilities Port (ECP) support several different kinds of external devices, at speeds up to 2 MB/sec."], "jumps": ["P2960", "P2940"]}, {"id": "P2960", "text": ["9. A modem allows a stand-alone computer to connect to another computer or to a network via a normal telephone line. A newer Network Interface Card (NIC) includes at least one RJ- 45 jack....."], "jumps": ["P2970", "P2950"]}, {"id": "P2970", "text": ["10. The USB host adapter has either two or four Type A connectors available at the rear panel, the front panel, or both."], "jumps": ["P2980", "P2960"]}, {"id": "P2980", "text": ["11. A USB peripheral device normally has a Type B connector. If it acts as a hub, then it will have a Type A connector as well."], "jumps": ["P2990", "P2970"]}, {"id": "P2990", "text": ["12. The IEEE 1394 connector is less than half an inch wide, while the 4-pin is only about a quarter inch wide."], "jumps": ["P2999", "P2980"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P2001", "P2990"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["To enable two peripherals to exchange data without the CPU being involved", "What is the purpose of an expansion bus?", "To provide a data path between the system and its peripheral components"], "jumps": []}, {"id": "P10211", "text": ["Which bus standard requires a -5 VDC power supply?"], "jumps": []}, {"id": "P10212", "text": ["What are two important characteristics of a bus?"], "jumps": []}, {"id": "P10213", "text": ["The number of megahertz that the bus can support", "The gauge of wire used for the data path", "The number of data bits that can flow simultaneously", "The amount of processor time that the bus requires"], "jumps": []}, {"id": "P10214", "text": ["Which component generates the slowest tier of buses?"], "jumps": []}, {"id": "P10215", "text": ["A bus which allows peripherals to transfer data without interrupting the CPU", "A bus which directly connects two or more peripherals together", "A bus which allows peripherals to connect to the processor bus"], "jumps": []}, {"id": "P10216", "text": [], "jumps": []}, {"id": "P10217", "text": [], "jumps": []}, {"id": "P10218", "text": ["Providing expansion slots is the only function of the PCI bus", "Other than providing slots for expansion cards, what other function does the PCI bus perform?", "It effectively doubles the clock speed of its adapter cards", "It provides the communication path between the North Bridge and South Bridge", "It allows a system to make use of multiple CPUs"], "jumps": []}, {"id": "P10219", "text": ["It can include up to 127 devices at once", "What has led to the popularity of the Universal Serial Bus?", "Peripherals can be connected without any need to shut down or restart", "Individual devices don't need individual sets of system resources"], "jumps": []}, {"id": "P10220", "text": ["How can you distinguish which type of adapter a particular card is?", "The model information is clearly stamped on the card's faceplate", "E-mail the manufacturer for exact specifications", "Examine the expansion slot that it's plugged into"], "jumps": []}, {"id": "P10221", "text": ["It changes a black and white image to a color image", "What is the function of the video (or graphics) adapter?", "It tells the monitor how to create the screen image", "It provides additional memory for creating 3-D textures on the screen", "It replaces the monitor, because modern systems use displays instead of monitors"], "jumps": []}, {"id": "P10222", "text": ["It didn't. Computer video has always been digital", "Why did computer video move from its original digital format to an analog format?", "With the existing technology at the time, analog was capable of displaying more colors"], "jumps": []}, {"id": "P10223", "text": [], "jumps": []}, {"id": "P10224", "text": ["Which type of card would be used to add additional communications ports to a system?"], "jumps": []}, {"id": "P10225", "text": ["An adapter card has a DB-9 male connector and a DB-25 female connector on the rear panel. What kind of adapter card is it?"], "jumps": []}, {"id": "P10226", "text": ["What kind of connector is characteristic of sound cards?"], "jumps": []}, {"id": "P10227", "text": ["Interface with a MIDI input device such as a keyboard", "What is the purpose of the DB-15 connector found on most sound cards?", "Interface with a LAN adapter without having to use additional system resources", "Interface with a game controller, such as a joystick"], "jumps": []}, {"id": "P10228", "text": ["It allows a computer to directly connect to another computer on a LAN", "It converts speech to electrical signals and electrical signals to speech", "It allows a stand-alone computer to connect to another computer or to a network via a normal telephone line", "It converts a parallel port to a serial port for ease of communication"], "jumps": []}, {"id": "P10229", "text": ["What is the most common type of connector used on new LAN adapter cards?"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is 30%. Do you want to __________"], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "PINFO", "text": ["11-21-01 Converted from sty to tbk. frieda 11-21-01 Text and Branching. frieda 12-17-01 Graphics John Ayala 01-14-02 Converted to Phase II format. jay", "11-21-01 Converted from sty to tbk. frieda 11-21-01 Text and Branching. frieda 12-17-01 Graphics John Ayala 01-14-02 Converted to Phase II format. jay 02-13-02 Review of Convserion. Alexis 03-22-02 Added photos on pages P2140 & P10223, re-reviewed lesson. - james 04-16-02 Review - lisa"], "jumps": []}, {"id": "PQINFO", "text": ["Page # Test# Question# HelpPage # 10210 1 110 1020 10211 1 111 1170 10212 1 112 1040 10213 1 113 1040 10214 1 114 1110 10215 1 115 1270 10216 1 116 1300 10217 1 117 1350 10218 1 118 1350 10219 1 119 1470 10220 2 120 2020 10221 2 121 2040 10222 2 122 2060 10223 2 123 2110 10224 2 124 2260 10225 2 125 2240 10226 2 126 2150 10227 2 127 2150 10228 2 128 2350 10229 2 129 2430 10230 3 130 30000 10231 3 131 30000 10232 3 132 30000 10233 3 133 30000 10234 3 134 30000 10235 3 135 30000 10236 3 136 30000 10237 3 137 30000 10238 3 138 30000 10239 3 139 30000 10240 10241 10242 10243 10244 10245 10246 10247 10248 10249", "Page # Test# Question# HelpPage # 10210 1 110 1020 10211 1 111 1170 10212 1 112 1040 10213 1 113 1040 10214 1 114 1110 10215 1 115 1270 10216 1 116 1300 10217 1 117 1350 10218 1 118 1350 10219 1 119 1470 10220 2 120 2020 10221 2 121 2040 10222 2 122 2060 10223 2 123 2110 10224 2 124 2260 10225 2 125 2240 10226 2 126 2150 10227 2 127 2150 10228 2 128 2350 10229 2 129 2430"], "jumps": []}]};
let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
