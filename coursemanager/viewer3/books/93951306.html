 resistance in a parallel circuit. et Test Console main power ON."], "jumps": ["P15870"]}, {"id": "P15760", "text": ["This completes the experiment on MEASURING CURRENT IN A PARALLEL CIRCUIT. ITLE."], "jumps": []}, {"id": "P15750", "text": [], "jumps": []}, {"id": "P15730", "text": ["2. Shut off the multimeter. ...."], "jumps": []}, {"id": "P15720", "text": ["1. Remove the printed circuit card PC130-8A from the console and store it in its designated area."], "jumps": []}, {"id": "P15710", "text": ["This experiment demonstrated that the sum of the individual branch currents equals the total current."], "jumps": []}, {"id": "P15700", "text": ["Compare the branch current sum to total current. The two values are very close to the same.", "Total Current Branch Current Total Current !%18 mA Texttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttt", "1.0 mAAA Total Current !%18 mA Texttttttttttttt!%18 mA Textttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttt", "1.0 mA mA Total Current !%18 mA Texttttttttttttt!%18 mA Textttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttt", "1.0 mAAmA Total Current !%18 mA Texttttttttttttt!%18 mA Textttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttt", "3.0 mAAmA Total Current !%18 mA Texttttttttttttt!%18 mA Textttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttt"], "jumps": ["PutVar"]}, {"id": "P15690", "text": [], "jumps": []}, {"id": "P15689", "text": ["19. Close switch S7 and remove the multimeter leads."], "jumps": []}, {"id": "P15687", "text": ["You still have not entered the right value. You should have measured about 8 mA."], "jumps": ["PutVar"]}, {"id": "P15683", "text": ["Your answer is not acceptable. Make sure the slide switches are in the following positions:", "S1 - IN S5 - OUT S2 - IN S6 - OUT S3 - IN S7 - OUT S4 - OUT S8 - OUTTxtttttttttttttttttttttttttttttttttttttttt let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
