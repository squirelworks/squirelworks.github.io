const book = {"title": "93957107", "pages": [{"id": "P1130", "text": ["Electrically they look like a wheatstone bridge.  A voltage is applied across two of the rewires and the voltage difference is measured between the other two.", "Electrically they look like a wheatstone bridge. A voltage is applied across two of the rewires and the voltage difference is measured between the other two.", "Electrically they look like a wheatstone bridge. A voltage is applied across two of the resistors, R1 and R2. R4 is the resistance wire. R3 is in series with R4 and used to set the \"at rest\" or null position. Strain changes will effect the resistance of R4, which is indicated on the meter."], "jumps": ["P1140", "P1110"]}, {"id": "P1195", "text": ["The variable-inductance device causes a large percent of change in inductance making it more useable than a resistive wire strain gauge setup in a similar application......", "Nida Corporation - Introduction to Transducers"], "jumps": ["P1200", "P1190"]}, {"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: INTRODUCTION TO TRANSDUCERS fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": ["Hello, this lesson is about:s about: about:"], "jumps": []}, {"id": "P100", "text": ["w Identify types of transducers. w Understand transducer operating principles."], "jumps": []}, {"id": "P300", "text": ["Nida Corporation - Introduction to Transducers"], "jumps": []}, {"id": "P1430", "text": ["If the resistance of the element is even thr, it is linear.  If the resistance increases as the wiper arm is moved from one end to the other, it is nonlinear.", "If the resistance of the element is even thr, it is linear. If the resistance increases as the wiper arm is moved from one end to the other, it is nonlinear.", "If the rate of resistance is even throughout the motion of the wiper the potentiometer is considered linear. If the resistance rate is different throughout the motion of the wiper arm as it is moved from one end to the other, the potentiometer is nonlinear...."], "jumps": ["P1440", "P1400"]}, {"id": "P1440", "text": ["The potentiometer-type device using a ccompares an unknown EMF with the voltage of a standard cell, this circuit is a resistance network, which can be built for a high degree of precision.", "The potentiometer-type device using a regulated voltage as a supply source can be built for a high degree of precision.........................................................................................."], "jumps": ["P1450", "P1430"]}, {"id": "P410", "text": ["An electrical transformer is used to convert one voltage/current level to another voltage/current level. But the transformer cannot be considered a transducer as the electrical energy is not converted to another energy form..."], "jumps": ["P420", "P400"]}, {"id": "P1260", "text": ["Reluctance in the variable-inductance device is similar to the concept of _______ in the r", "Reluctance in the variable-inductance device is similar to the concept of _______ in the resistive wire strain device..."], "jumps": ["P1190"]}, {"id": "P430", "text": ["Modern industrial and engineering techniques often require transmission of data measured at one location to be transmitted and sent to another location for control and analysis purposes.", "Modern industrial and engineering techniques often require transmission of data measured at one location to be transmitted and sent to another location for control and analysis purposes..."], "jumps": []}, {"id": "P445", "text": ["Data may need to be converted to different types of signals depending on the medium used, transducers can be used for this conversions."], "jumps": []}, {"id": "P1205", "text": ["Reluctance is the measure of opposition to the establishment of flux (magnetic lines of force) material, much like electrical resistance."], "jumps": ["P1210", "P1190"]}, {"id": "P450", "text": ["Many different electronic components and devices are used in transducers to convert one form of energy to another."], "jumps": ["P470", "P430"]}, {"id": "PINFO", "text": ["These devices along with basic properties of electronics such as voltage, resistance, current, capacitance, inductance, magnetism, and many others, can be measured with various instruments.", "07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 01-07-00 Converted from storyboard to toolbook. frieda 01-07-00 Text and Branching. frieda 01-13-00 Graphics. doan 01-28-00 Reviewed and fixed. debbie 03-07-00 Changes as per dean - lisa 03-13-00 Review - lisa 07-14-00 Converted to ToolBook 7.1 format. jay 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 05-24-02 Made corrections to text - patty 06-10-02 Review - lisa 01-14-03 P430 through P445, fixed script on back and next buttons. Lesson did not move forward or backward through these pages. -Pennyyy", "These devices along with basic properties of electronics such as voltage, resistance, current, capacitance, inductance, magnetism, and many others, can be measured with various instruments..."], "jumps": ["P470", "P430"]}, {"id": "P470", "text": ["Let's look at how transducers are used and accomplish their tasks.", "Let's look at how transducers are used and accomplish their tasks...ks."], "jumps": ["P480", "P420"]}, {"id": "P480", "text": ["Let's begin the lesson on INTRODUCTION TO TRANSDUCERS....................."], "jumps": ["P470"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1170", "text": ["Semiconductor strain gages have outputs 10 times higher than the metal-film method previously describevariety have problems.", "An electrical signal that eventually is used or transmitted must be converted to a quantity to be measured, this is called the measurand.", "Semiconductor strain gages have outputs 10 times higher than the metal-film method previously describevariety have problems.s", "Semiconductor strain gages with outputs 10 times higher than the metal-film method previously described have been developed and are more reliable and accurate....."], "jumps": ["P1180", "P1160"]}, {"id": "P1025", "text": ["Some examples of transducer measurements include:", "Some examples of transducer measurements include: Weight Torque Capacitance Temperature", "Color Speed Weight Torque Capacitance Temperature"], "jumps": ["P1030", "P1020"]}, {"id": "P1030", "text": ["The device sensing the change in the physical aspect and performing the electrical conversion is the transducer.", "The device sensing the change in the physical aspect and performing the electrical conversion is the transducer.."], "jumps": ["P1040", "P1025"]}, {"id": "P1040", "text": ["Transducers include the following types.", "Transducers include the following types.GRAPHICS TEXT) 1. Resistance-wire strain 2. Variable-inductance 3. Potentiometer 4. Voltage-measuring 5. Special purpose", "1. Resistance-wire strain 2. Variable-inductance 3. Potentiometer 4. Voltage-measuring 5. Special purposeeeeeee"], "jumps": ["P1045", "P1030"]}, {"id": "P1045", "text": ["Let's discuss the resistance-wire strain transducer type first."], "jumps": ["P1050", "P1040"]}, {"id": "P1050", "text": ["Variable-resistance gages for measuring small changes in length are called resistance strain gages because of their early use in stress analysis."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["One such device, a bonded-wire strain gage is shown below. This gage consists of a conducting material as a fine wire or a thin sheet cemented to the material to be stressed."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["The thin sheet is usually made of carbon-like substance, this provides a resistance high enough that will make it convenient to obtain high resistance measurements."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["A wire of a known resistance is used to demonstrate the principle of the device."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["If the wire is stretched or compressed, the length of the wire increases and the cross-sectional area of the wire decreases. This increases the resistance of the wire."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["The formula used to determine this relationship is R = L/A, or \n\n       Resistance = Wire Length / Wire Cross Section.", "The formula used to determine this relationship is R = L/A, or Resistance = Wire Length / Wire Cross Section. gth Ohm symbol = Resistance", "LEGEND A = Cross Sectional Area L = Length W = Resistance"], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["The elastic limit of the wire is not to be exceeded.  The change of resistance to the change in length is a linear relationship.", "The elastic limit of the wire is not to be exceeded. The change of resistance to the change in length is a linear relationship."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["This relationship translates into electrical signals, the change in resistance can be measured and the strain calculated."], "jumps": ["P1130", "P1110"]}, {"id": "P1620", "text": ["Typical measurements might be of x-rays, cosmic rays, alpha,  beta, or even smoke particles.", "Typical measurements might be of x-rays, cosmic rays, alpha, beta, or even smoke particles.", "Typical measurements might be of x-rays, cosmic rays, alpha, beta, or even smoke particles as found in the common ionization smoke detector."], "jumps": ["P1630", "P1600"]}, {"id": "P1700", "text": ["Transducers made of these materials are self-generating; the electrical energy produced is linearly proportional to the physical movement.", "Transducers made of these materials are self-generating; the electrical energy produced is linearly proportional to the physical movement........................"], "jumps": ["P1710", "P1680"]}, {"id": "P10210", "text": [], "jumps": []}, {"id": "P1150", "text": ["When the wire of a known resistance is stretched, what is the relationship between the resistance and length of a wire?", "As the length increases the resistance decreases.", "As the length increases the resistance stays the same.", "As the length increases the resistance increases."], "jumps": ["P1130"]}, {"id": "P1151", "text": [], "jumps": []}, {"id": "P1152", "text": ["Remember when the length increases the cross-sectional area decreases, R = L/A, increasing the resistance."], "jumps": []}, {"id": "P1160", "text": ["Drawbacks for this type of test are limitations of the wire's elasticity and the output signals are very small.  These signals need considerable amplification.", "Drawbacks for this type of test are limitations of the wire's elasticity and the output signals are very small. These signals need considerable amplification."], "jumps": ["P1170", "P1150"]}, {"id": "P10216", "text": ["Pure metals have linear temperature-resistivity while some semiconductors have _______ temperature-resistivity."], "jumps": []}, {"id": "P10220", "text": ["The device whisensing the change in the measurand and performing the conversion is the _______", "The device which converts one form of energy to another form of energy is the _______"], "jumps": []}, {"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 01-07-00 Converted from storyboard to toolbook. frieda 01-07-00 Text and Branching. frieda 01-13-00 Graphics. doan 01-28-00 Reviewed and fixed. debbie 03-07-00 Changes as per dean - lisa 03-13-00 Review - lisa 07-14-00 Converted to ToolBook 7.1 format. jay 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 05-24-02 Made corrections to text - patty 06-10-02 Review - lisa 01-14-03 P430 through P445, fixed script on back and next buttons. Lesson did not move forward or backward through these pages. -Penny 10-06-04 Reviewed the lesson.", "07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 01-07-00 Converted from storyboard to toolbook. frieda 01-07-00 Text and Branching. frieda 01-13-00 Graphics. doan 01-28-00 Reviewed and fixed. debbie 03-07-00 Changes as per dean - lisa 03-13-00 Review - lisa 07-14-00 Converted to ToolBook 7.1 format. jay 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 05-24-02 Made corrections to text - patty 06-10-02 Review - lisa 01-14-03 P430 through P445, fixed script on back and next buttons. Lesson did not move forward or backward through these pages. -Penny 10-06-04 Reviewed and updated the lesson. Removed the word measurand. Dave"], "jumps": []}, {"id": "P1180", "text": ["One problem, since the gages are cemented to thin wires or sheets, is temperature.  Temperature will need to be accounted for during use.", "One problem, since the gages are cemented to thin wires or sheets, is temperature. Temperature will need to be accounted for during use."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["Another type of transducer, called a variable-inductance device is used when pressure or position monitoring is required.", "Another type of transducer, called a variable-inductance device is used when pressure or position monitoring is required. A = Diaphragm (which can be permeable metal) B = Permeable piece of metal C = Core D = Winding", "LEGEND A = Diaphragm (which can be permeable metal) B = Permeable piece of metal C = Core D = Winding"], "jumps": ["P1195", "P1170"]}, {"id": "P1280", "text": ["A differential transformer uses essentially the same principle as the variable-inductance pressure gage."], "jumps": ["P1281", "P1270"]}, {"id": "P1200", "text": ["The variable-inductance device changes the reluctance of a magnetic circuit."], "jumps": ["P1205", "P1190"]}, {"id": "P1205", "text": ["Reluctance is the measure of opposition to the establishment of flux (magnetic lines of force) material, much like electrical resistance."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["The change in reluctance can be accomplished by varying the thickness of an air gap in a magnetic circuit, or varying the magnetic permeability of an iron core in a magnetic circuit."], "jumps": ["P1220", "P1190"]}, {"id": "P1211", "text": ["The change in reluctance can be accomplished by varying the thickness of an air gap in a magnetic circuit, or varying the magnetic permeability of an iron core in a magnetic circuit.", "LEGEND A = Diaphragm (which can be permeable metal) B = Permeable piece of metal C = Core D = Winding"], "jumps": ["P1220", "P1190"]}, {"id": "P1215", "text": ["PERMEABILITY - Permeability is a measure of the ease with which flux can be established in and throughout the material."], "jumps": ["P1211"]}, {"id": "P1220", "text": ["The variable-inductance pressure gage is shown below:"], "jumps": ["P1230", "P1190"]}, {"id": "P1230", "text": ["The pressure causes A and B to move toward the core reducing the amount of air gap between the two.  This amount may be as little as a few thousandths of an inch.", "The pressure causes A and B to move toward the core reducing the amount of air gap between the two. This amount may be as little as a few thousandths of an inch........"], "jumps": ["P1240", "P1190"]}, {"id": "P1240", "text": ["As A and B move toward the core, the reluctance of the core decreases and induction of the winding increases.  As in the resistant-wire strain gage this difference can be measured.", "As A and B move toward the core, the reluctance of the core decreases and induction of the winding increases. As in the resistant-wire strain gage this difference can be measured."], "jumps": ["P1250", "P1190"]}, {"id": "P1250", "text": ["Though the difference between an induction measurement is larger than resistive measurement, they still suffer from temperature compensation problems due to the small amount of distance between A and B to the core.", "Though the difference between an induction measurement is larger than resistive measurement, they still suffer from temperature compensation problems due to the small amount of distance between A and B to the core..."], "jumps": ["P1260", "P1190"]}, {"id": "P1585", "text": ["Current flow depends on the wavelength and intensity of the light illuminating the pcathode.", "Reluctance is similar to the concept of _______", "Current flow depends on the wavelength and intensity of the light illuminating the photocathode.", "Reluctance is similar to the concept of _______............"], "jumps": ["P1590", "P1560"]}, {"id": "P1261", "text": [], "jumps": []}, {"id": "P1262", "text": ["Remember reluctance is the measure of opposition to the establishment of flux (magnetic lines of force)."], "jumps": []}, {"id": "P1270", "text": ["Another type of variable-inductance device is a differential transformer."], "jumps": ["P1280", "P1260"]}, {"id": "P1360", "text": ["Generally, variable-inductance devices are used in position monitoring applications.", "Generally, variable-inductance devices are used in position monitoring applications. .........................................................."], "jumps": ["P1370", "P1350"]}, {"id": "P1281", "text": ["The ferromagnetic core is moved between primary transformer L1 and the two secondary transformers L2 and L3."], "jumps": ["P1290", "P1270"]}, {"id": "P1282", "text": ["The ferromagnetic core is moved between primary transformer L1 and the two secondary transformers L2 and L3."], "jumps": ["P1290", "P1270"]}, {"id": "P1285", "text": ["FERROMAGNETIC - Materials that have magnetic properties similar to iron or iron alloy."], "jumps": ["P1282"]}, {"id": "P1290", "text": ["Moving the magnetic slug changes the magnetic coupling between the primary and secondary transformers."], "jumps": ["P1300", "P1270"]}, {"id": "P1300", "text": ["Since L2 and L3 are in series, with the magnetic fields pointing toward each other the inductance from L1 is reduced."], "jumps": ["P1310", "P1270"]}, {"id": "P1310", "text": ["If the ferrite slug is moved between transformer L1 and L2 the inductance between the two increases, and the inductance between L1 and L3 decreases."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["This is known as permeability tuning, because the ferrite core has a higher degree of permeability between L1 and L2."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["However, it has the opposite effect between L1 and L3.  There is no longer an iron core between the two, but an air gap.", "However, it has the opposite effect between L1 and L3. There is no longer an iron core between the two, but an air gap."], "jumps": ["P1331", "P1310"]}, {"id": "P1331", "text": ["Since air has a lower permeability than iron, the inductance is less."], "jumps": ["P1340", "P1310"]}, {"id": "P1340", "text": ["The output voltage is proportional to the mechanical displacement of the core."], "jumps": ["P1350", "P1310"]}, {"id": "P1350", "text": ["If the ferrite slug is moved up or down the phase will either lead or lag the input current by a maximum of 90 degrees."], "jumps": ["P1360", "P1310"]}, {"id": "P1360", "text": ["Generally, variable-inductance devices are used in frequency sensitive devices, particularly FM transmitters."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["If L1 and L2 are aligned, the inductance between them will be _______ than the inductance between L1 and L3."], "jumps": ["P1360"]}, {"id": "P1371", "text": [], "jumps": []}, {"id": "P1372", "text": ["Since the permeability of iron is higher than air, the inductance will be higher between L1 and L2 and lower between L1 and L3."], "jumps": []}, {"id": "P1380", "text": ["The potentiometer-type device monitors the position of a physical quantity that has large-scale movements."], "jumps": ["P1381", "P1370"]}, {"id": "P1381", "text": ["The movement of the substance is linked to the wiper arm of the potentiometer."], "jumps": ["P1390", "P1380"]}, {"id": "P1390", "text": ["Two basic potentiometer designs are the slide pot or rotary pot."], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["The voltage applied to the potentiometer may be either alternating current or direct current."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["Advantages of the potentiometer-type device are in its simplicity, high-level output, and ease with which it can be tapered."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["Taper refers to the distribution of resistance along the resistive element."], "jumps": ["P1421", "P1400"]}, {"id": "P1421", "text": ["A carbon element can be made to have different degrees of resistance, by controlling the cross-sectional area of the carbon or changing its density."], "jumps": ["P1430", "P1400"]}, {"id": "P1430", "text": ["If the resistance of the element is even, it is linear.  If the resistance increases as the wiper arm is moved from one end to the other, it is nonlinear.", "If the resistance of the element is even, it is linear. If the resistance increases as the wiper arm is moved from one end to the other, it is nonlinear.."], "jumps": ["P1440", "P1400"]}, {"id": "P1440", "text": ["The potentiometer-type device compares an unknown EMF with the voltage of a standard cell, this circuit is a resistance network, which can be built for a high degree of precision."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["The drawback to this type of network is the unwanted thermoelectric EMF's that are produced, usually by the sliding switch and slide-wire contacts."], "jumps": ["P1451", "P1440"]}, {"id": "P1451", "text": ["The connections made between various metals produce measurement errors from temperature differences."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["What is meant by the term taper?", "What is meant by the term taper?d..........................", "amount of air gap between plates of capacitorss", "distribution of resistance along the resistive elementt"], "jumps": ["P1440"]}, {"id": "P1461", "text": [], "jumps": []}, {"id": "P1462", "text": ["Taper refers to the distribution of resistance along the resistive element.  A carbon element can be made to have different degrees of resistance, by controlling the cross-sectional area of the carbon or changing its density.", "Taper refers to the distribution of resistance along the resistive element. A carbon element can be made to have different degrees of resistance, by controlling the cross-sectional area of the carbon or changing its density."], "jumps": []}, {"id": "P1470", "text": ["Voltage-measuring devices encompass many different kinds of instruments."], "jumps": ["P1490", "P1460"]}, {"id": "P1480", "text": ["Some examples are geiger counters, ionization chambers, and ionization pressures gages."], "jumps": ["P1490", "P1470"]}, {"id": "P1485", "text": ["IONIZATION - The formation of one or more ions by the addition of electrons to or removal of electrons from an electrically neutral atomic or molecular configuration by heat, electrical discharge, radiation, or chemical reaction."], "jumps": []}, {"id": "P1490", "text": ["Electronic transducers use motion, production, or control of free electrons.  These include photoelectric, ionization, thermoelectric and piezoelectric transducers.", "Electronic transducers use motion, production, or control of free electrons. These include photoelectric, ionization, thermoelectric and piezoelectric transducers."], "jumps": ["P1500", "P1470"]}, {"id": "P1500", "text": ["Any phenomenon that produces a variation in light intensity, position, or color may be measured/detected with photoelectric transducers."], "jumps": ["P1501", "P1480"]}, {"id": "P1501", "text": ["These include photoconductor, photovoltaic, and photoemissive devices."], "jumps": ["P1510", "P1500"]}, {"id": "P1510", "text": ["The term photoconductivity describes changes of conductivity induced by illumination in a gas, solid, or liquid medium."], "jumps": ["P1520", "P1500"]}, {"id": "P1520", "text": ["Most photoconductive devices operate in series with a voltage source.  Variations in conductivity produce a corresponding output voltage change.", "Most photoconductive devices operate in series with a voltage source. Variations in conductivity produce a corresponding output voltage change."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["Photovoltaic cells develop an internal EMF when illuminated by energy in the visible infrared and ultraviolet regions of the spectrum."], "jumps": ["P1540", "P1510"]}, {"id": "P1540", "text": ["Commercially-available photovoltaic cells have outputs proportional to the area exposed to radiant energy."], "jumps": ["P1542", "P1530"]}, {"id": "P1542", "text": ["For example, a one and three-eigths of an inch diameter silicon-junction cell will generate 0.25 volts across a 10-ohm resistor in sunlight."], "jumps": ["P1550", "P1540"]}, {"id": "P1550", "text": ["Photoelectric transducers measure or detect any phenomenon that produces variation in position, color, or _______ intensity."], "jumps": ["P1540"]}, {"id": "P1551", "text": [], "jumps": []}, {"id": "P1552", "text": ["Any phenomenon that produces a variation in light intensity, position, or color may be measured or detected with photoelectric transducers."], "jumps": []}, {"id": "P1560", "text": ["Photoemissive transducers are of two general types: gas or high-vacuum diodes, and multiplier photocubes."], "jumps": ["P1570", "P1550"]}, {"id": "P1570", "text": ["The electron-emitting element (cathode) in these tubes is coated with a photosensitive substance."], "jumps": ["P1575", "P1560"]}, {"id": "P1575", "text": ["A positive voltage is applied to the electron collecting element (anodes)."], "jumps": ["P1580", "P1560"]}, {"id": "P1580", "text": ["Photoelectrons are emitted by the cathode and collected by the anode, producing current flow in the circuit."], "jumps": ["P1585", "P1560"]}, {"id": "P1585", "text": ["Current flow depends on the wavelength and intensity of the light illuminating the cathode."], "jumps": ["P1590", "P1560"]}, {"id": "P1590", "text": ["As the light on the photocathode varies, the current changes, causing a variation in the voltage drop across a load resistor in series with the tube."], "jumps": ["P1600", "P1560"]}, {"id": "P1600", "text": ["Ionization transducers operate on the principle, that an atom ejects an orbital electron when a fast-moving charged particle approaches sufficiently close to it.", "Gas Inside 87% Argon 10% Xenon 3% Carbon Dioxideee"], "jumps": ["P1610", "P1560"]}, {"id": "P1610", "text": ["The residue of the atom is now a positively-charge ion, and the incident particles are ionizing radiations."], "jumps": ["P1615", "P1600"]}, {"id": "P1615", "text": ["Nuclear radiations can be measured by observing the resulting ionization when they pass through a medium such as a gas."], "jumps": ["P1620", "P1600"]}, {"id": "P1620", "text": ["Typical measurements might be of x-rays, cosmic rays, alpha, or beta particles."], "jumps": ["P1630", "P1600"]}, {"id": "P1630", "text": ["Thermolectric transducers work on this principle: at the junction of the two dissimilar metals there exists an EMF that depends on temperature."], "jumps": ["P1640", "P1600"]}, {"id": "P1640", "text": ["If the circuit is closed by another remote junction of two dissimilar metals, an opposing EMF exists at the other junction."], "jumps": ["P1645", "P1630"]}, {"id": "P1645", "text": ["If the junctions are at the same temperature, the EMFs are equal and no current flows."], "jumps": ["P1650", "P1630"]}, {"id": "P1650", "text": ["When one junction is at a higher temperature, the EMF at the hot junction exceeds the EMF at the cold junction, and current flow depends on the circuit resistance."], "jumps": ["P1660", "P1630"]}, {"id": "P1660", "text": ["If two dissimilar metals are joined and the temperature is equal at the other junction, the EMFs are _______"], "jumps": ["P1630"]}, {"id": "P1661", "text": [], "jumps": []}, {"id": "P1662", "text": ["Remember, if the junctions of the two dissimilar metals are at the same temperature, the EMFs are equal and no current flow."], "jumps": []}, {"id": "P1670", "text": ["Piezoelectric transducers work on the principle that certain materials can generate an electrical voltage when subjected to mechanical stress."], "jumps": ["P1680", "P1660"]}, {"id": "P1680", "text": ["Much like a crystal record player cartridge, the record grooves provide stress to the stylus, causing it to vibrate through the crystal."], "jumps": ["P1690", "P1670"]}, {"id": "P1690", "text": ["This piezoelectric property is common to natural crystals such as quartz and tourmaline, synthetic materials such as Rochelle salts, and ceramics such as barium titanate."], "jumps": ["P1700", "P1680"]}, {"id": "P1700", "text": ["Transducers made of these materials are self-generating; the electrical energy produced is linearly proportional to the energy of the measurand."], "jumps": ["P1710", "P1680"]}, {"id": "P1710", "text": ["Crystals when _______ stressed, can generate an electrical voltage."], "jumps": ["P1680"]}, {"id": "P1711", "text": [], "jumps": []}, {"id": "P1712", "text": ["Remember the crystal record player cartridge, the grooves in the record stress the stylus, causing it to vibrate.  These vibrations are then transmitted through the crystal.", "Remember the crystal record player cartridge, the grooves in the record stress the stylus, causing it to vibrate. These vibrations are then transmitted through the crystal."], "jumps": []}, {"id": "P1720", "text": ["Special Purpose Devices \nNonmechanical resistance-vibration devices, and capacitance transducers are used for special purposes.  Nonmechanical resistance-variation devices include temperature sensitive and voltage-sensitive materials.", "Special Purpose Devices Nonmechanical resistance-vibration devices, and capacitance transducers are used for special purposes. Nonmechanical resistance-variation devices include temperature sensitive and voltage-sensitive materials."], "jumps": ["P1730", "P1710"]}, {"id": "P1730", "text": ["Temperature-sensitive materials are usually of two types: pure metals that have linear temperature-resistivity characteristics, and semiconductors that have nonlinear temperature-resistivity characteristics.", "Temperature-sensitive materials are usually of two types: pure metals that have linear temperature-resistivity characteristics, and semiconductors that have nonlinear temperature-resistivity characteristics............"], "jumps": ["P1740", "P1720"]}, {"id": "P1740", "text": ["In contrast to metals, which often have small positive temperature coefficients of resistance, some semiconductors have large, nonlinear temperature coefficients.", "In contrast to metals, which often have small positive temperature coefficients of resistance, some semiconductors have large, nonlinear temperature coefficients.........."], "jumps": ["P1750", "P1720"]}, {"id": "P1750", "text": ["Thermistors are among the most widely-used semiconductors.", "Thermistors are among the most widely-used semiconductors.."], "jumps": ["P1755", "P1740"]}, {"id": "P1755", "text": ["The resistance of a thermistor may change as much as 2.5 to 8 percent per degree centrigrade of temperature change at 20 degrees centigrade, in comparison to one-third percent for average metals.", "The resistance of a thermistor may change as much as 2.5 to 8 percent per degree centrigrade of temperature change at 20 degrees centigrade, in comparison to one-third percent for average metals..."], "jumps": ["P1760", "P1750"]}, {"id": "P1760", "text": ["Pure metals have _______ temperature-resistivity.", "Pure metals have _______ temperature-resistivity..........."], "jumps": ["P1750"]}, {"id": "P1761", "text": [], "jumps": []}, {"id": "P1762", "text": ["Refer to the graphs.", "Refer to the graphs.page..................................."], "jumps": []}, {"id": "P1770", "text": ["Capacitance transducers are composed of two or more electrodes or conductors separated by an insulating material.", "Capacitance transducers are composed of two or more electrodes or conductors separated by an insulating material..", "Flexible diaphragm acting as 1st plate capacitorr"], "jumps": ["P1780", "P1760"]}, {"id": "P1780", "text": ["Capacitance depends on the separation of the electrodes, the area of the conductors and the dielectric constant of the insulator, so changing any one of these parameters causes a capacitance change that can be analyzed.", "Capacitance depends on the separation of the electrodes, the area of the conductors and the dielectric constant of the insulator, so changing any one of these parameters causes a capacitance change that can be analyzed..."], "jumps": ["P1790", "P1770"]}, {"id": "P1790", "text": ["For example, two fixed electrodes can be immersed in a medium of variable dielectric constant, or the dielectric constant may remain fixed and the amount of dielectric may be varied."], "jumps": ["P1800", "P1780"]}, {"id": "P1800", "text": ["One electrode can remain fixed and the other electrode made to vary with the amount of dielectric.  The latter two methods allow volume to be measured.", "One electrode can remain fixed and the other electrode made to vary with the amount of dielectric. The latter two methods allow volume to be measured."], "jumps": ["P1810", "P1790"]}, {"id": "P1810", "text": ["Angular displacement can be measured by rotating one electrode of a parallel-plate variable capacitor."], "jumps": ["P1820", "P1790"]}, {"id": "P1820", "text": ["Linear displacement is measured by fixing one electrode and causing the other electrode to approach or recede from it."], "jumps": ["P1830", "P1810"]}, {"id": "P1830", "text": ["Capacitance transducers are composed of two or more electrodes separated by _______ material."], "jumps": ["P1820"]}, {"id": "P1831", "text": [], "jumps": []}, {"id": "P1832", "text": ["Capacitance depends on the separation of the electrodes, the area of the conductors and the dielectric constant of the insulator, so changing any one of these parameters causes a capacitance change that can be analyzed."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on TRANSDUCER OPERATING PRINCIPLES."], "jumps": ["P1001", "P1830"]}, {"id": "P1920", "text": ["1.  The device that converts one form of energy to another form \n     of energy is the transducer.", "1. The device that converts one form of energy to another form of energy is the transducer................................"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Variable-resistance gages measure the difference between a          known resistance before being stressed and comparing it              with the resistance after being stressed.", "2. Variable-resistance gages measure the difference between a known resistance before being stressed and comparing it with the resistance after being stressed."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Variable-inductance devices change the reluctance of a                   magnetic circuit and are usually used because the difference         in inductance is much greater than the difference in                          resistance.", "3. Variable-inductance devices change the reluctance of a magnetic circuit and are usually used because the difference in inductance is much greater than the difference in resistance...", "LEGEND A = Diaphragm (which can be permeable metal) B = Permeable piece of metal C = Core D = Winding"], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  Potentiometer devices are used because of their simplicity,            high-level output, and ease with which it can be tapered.", "4. Potentiometer devices are used because of their simplicity, high-level output, and ease with which it can be tapered."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  Voltage-measuring devices encompass a large variety of                electronic transducers, they use the motion, production or             control of free electrons that include photoelectric, ionization,       thermoelectric and piezoelectric transducers.", "5. Voltage-measuring devices encompass a large variety of electronic transducers, they use the motion, production or control of free electrons that include photoelectric, ionization, thermoelectric and piezoelectric transducers..."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  Special purpose devices have two categories nonmechanical       resistance and capacitance devices.", "6. Special purpose devices have two categories nonmech did not move forward or backward through these pages. -Pennyyy"], "jumps": ["P1460", "P1440"]}, {"id": "P420", "text": ["Transducers convert energy from one form to another.", "An obvious example of transducers is the conversion of sound to electrical energy.  But often transducers are used to convert mechanical motion to electrical", "ibrations to electrical signals for transmission purposes. In the receand change electrical signals to sound during reception.", "In radio equipment a transducer, the microphone, changes sound vibrations to electrical signals for transmission purposes. In the receiver another transducer, the speaker, changes the electrical signals back to sound energy...........", "Transducers convert energy from one form to another...", "An obvious example of transducers is the conversion of sound to electrical energy. But often transducers are used to convert mechanical motion to electrical", "An obvious example of transducers is the conversion of sound to electrical energy. But most often transducers convert mechanical motion to electrical energy to provide monitoring of the movement, position, temperature, or other physical condition of a device or application."], "jumps": ["P470", "P410", "P300", "P1025", "P1001"]}]};
let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
