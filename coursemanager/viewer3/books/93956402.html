<48<88;48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["1. Differential Transmitterr objective 1 line item 2 here. item 2 here.e.e.", "w State the definition of the Torque Differential Transmitter used in a synchro system. w Identify the synchro Torque Differential Transmitter schematic symbol. w Understand the functions of a Torque Differential Transmitter........"], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["Synchros are widely used in military and industrial applications."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Satellite systems are also controlled by synchros.........."], "jumps": []}, {"id": "P420", "text": ["The space shuttle uses synchros to control the movement of its robotic arm."], "jumps": []}, {"id": "P430", "text": ["Large ships use synchros to control rudder positioning.....", "YYY:YY YYYYYY:Y:Y:Y:Y:Y:Y:Y:YYYYY:Y:Y:Y:Y:Y:YYYYYYYYYY YYYYYY:Y:Y:Y:Y:Y:Y:Y:YYYYYYYYYYYYYYYYYYYYYYY:Y:Y:Y:Y:Y:Y:YYYYYYYYYYYYYYYYYYYYYY YYY YYYYYYYY:Y:Y:YYYYYYYYYYYYYYY:Y:Y:Y:Y:Y:YYYYYYYYYYYYYYYYYYYYYYYYYYYYYYY:Y:Y:Y:Y:YYYYYYYY YYYYYYYY:Y:Y:Y:Y:Y:YYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYY:YYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYY:Y:YYYYYY YYYY:Y:Y:Y", ". . . . .", ". . . . ... . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ... ... . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."], "jumps": []}, {"id": "P440", "text": ["These are just a few examples of the areas where you will find synchro systems."], "jumps": []}, {"id": "P450", "text": ["Let's begin the lesson on DIFFERENTIAL TRANSMITTERS......................."], "jumps": ["P440"]}, {"id": "P900", "text": [], "jumps": ["P450"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Basic synchro systems convert mechanical movement into an electrical signal which is then used to duplicate the mechanical movement at another location."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["In its simplest form the synchro system consists of a transmitter and a receiver. They are electrically identical but slightly different mechanically. The receiver has a built-in mechanical damper to prevent back and forth oscillations (known as hunting) at the rotational position provided by the transmitter.."], "jumps": []}, {"id": "P1040", "text": ["Both the transmitter and receiver incorporate a primary electrical winding on a movable rotor and three stationary secondary windings spaced 120", "apart on the stator. The primary of both is energized with single phase AC voltage of 60 or 400Hz..."], "jumps": []}, {"id": "P1050", "text": ["Depending upon the position of the rotor in the transmitter, voltage is induced in the transmitter's secondary stator windings. This voltage may be in or out of phase with the rotor winding due to the positional relationship between the rotor and each winding..."], "jumps": []}, {"id": "P1060", "text": ["The voltage is applied to the counterpart stator windings of the receiver. The magnetic fields generated by the secondary windings and the rotor winding of the receiver causes the receiver rotor to position itself to the same rotational position as the rotor of the transmitter..."], "jumps": []}, {"id": "P1070", "text": ["What is a common frequency of the AC supply voltage to a synchro system? $Incorrect1: 50"], "jumps": ["P1060"]}, {"id": "P1071", "text": [], "jumps": []}, {"id": "P1072", "text": ["Special frequency generation equipment is not required by Synchro systems. The locally supplied AC source is usually used.Again text."], "jumps": []}, {"id": "P1080", "text": ["What is a common phase of the AC supply voltage to a synchro system? $Incorrect1: Dual"], "jumps": ["P1070"]}, {"id": "P1081", "text": [], "jumps": []}, {"id": "P1082", "text": ["AC is applied to the rotor winding of each device in a Synchro System. The Stator windings are not powered from the line but receive voltage through transformer...."], "jumps": []}, {"id": "P1090", "text": ["This is where the question is typed..........................", "In a torque synchro system which component has a rotor with rotational position driven by electric voltage and phase?"], "jumps": ["P1080"]}, {"id": "P1091", "text": [], "jumps": []}, {"id": "P1092", "text": ["You have chosen a transmitter device. Rotors are driven by voltage and phase in receiver devices..."], "jumps": []}, {"id": "P1100", "text": ["The basic synchro system as described thus far performs adequately provided high torque and positional correction is not required. The receiver rotor (TR) will follow the rotational positioning of the transmitter rotor..."], "jumps": []}, {"id": "P1110", "text": ["Control Synchro Systems produce no torque, so they do not directly position the load. Instead they \"control\" the movement of the entire servo system through a series of amplifiers to position the load....."], "jumps": []}, {"id": "P1120", "text": ["In a Torque system or a Control system should positional correction be needed the correction is provided by another rotational transformer known as the Torque Differential Transmitter (TDX) or the Control Differential Transmitter (CDX)..."], "jumps": []}, {"id": "P1130", "text": ["The most common application is navigational correction on ships, planes, and land vehicles and systems on motorized assemblies..zed assemblies.."], "jumps": []}, {"id": "P1140", "text": ["The radar of our ship sailing on a compass heading of 0", "(true North) detects another vessel at 75", ", true North.h..h. Our ship is on a true bearing of 0", ". The other ship is said to be on a true bearing of 75"], "jumps": []}, {"id": "P1150", "text": ["Should we need to bear our weaponry upon the other vessel we would set the weapons to a 75", "relative bearing. Notice, in this situation that the target also bears 75"], "jumps": []}, {"id": "P1160", "text": ["relative bearing, the weapons are now pointed toward a 105", "relative bearing. Re-aiming the weapons is required to again bear upon the suspected enemy............................"], "jumps": []}, {"id": "P1170", "text": ["The Torque Differential Transmitter (TDX) or the Control Differential Transmitter (CDX) provides the method of compensating for our ship heading."], "jumps": []}, {"id": "P1190", "text": ["Mechanical input is provided to the Torque/Control Differential Transmitter from the navigation system to provide a reference to true north input to the radar and gun control systems on board.", "rQQXXX;;;eCChTT3333PP`SSSgg,,pYYYcc666GG2#///WWAAAAAJA## ////++++\"\"\"\"\"\"\"A)))-", "rQQXXX;;;eCChTT3333PP`SSSgg,,pYYYcc666G:#////WWAAAAAJA## ///W++++\"\"\"\"\"\"\"\" ))-", "rQQXXX;;;eCChTT3333PP`SSSgg,,pYYYcc6662 ////WWAAAAAJ/## ///A++++\"\"\"\"\"\"\"\"J))-", "rQQXXX;;;eCChTT3333PP`SSSgg,,pYYYcc662 ////WWAAAAAJ/## ///\"++++\"\"\"\"\"\"\"\"J/)-", "rQQXXX;;;eCChTT3333PP`SSSgg,,pYYYcc6' ////WWAAAAAJ ## ///+++++\"\"\"\"\"\"\"\"JJ)-", "# ////WWAAAAAJ)## //A+++++\"\"\"\"\"\"\"\"JJJ)", "## ////WWAAAAAl)## //\"+++++\"\"\"\"\"\"\"\"JJJ/", "QQXXX;;;eCChTT3333PP`SSSgg,,pYo-)## ////WWAAAAA/)## //++++++\"\"\"\"\"\"\"\"JJJA-", "QXXX;;;eCChTT3333PP`SSSgg,,pG-))## ////WWAAAAA )## /W++++++\"\"\"\"\"\"\"\"JJJJ", "XXX;;;eCChTT3333PP`SSSgg,,2))))## ////WWAAAAA#)## /J++++++\"\"\"\"\"\"\"\"JJJJl", "X;;;eCChTT3333PP`SSSggp'-))))## ////WWAAAAA-)## /\"++++++\"\"\"\"\"\"\"\"JJJJA)"], "jumps": []}, {"id": "P1200", "text": ["The Torque/Control Differential Transmitter (TDX/CDX) incorporates three stator windings with 120", "spacing just as with the Torque Transmitter and the Torque Receiver. The rotor, though, also has three windings, also spaced at 120"], "jumps": []}, {"id": "P1210", "text": ["The input to the Torque/Control Differential Transmitter (TDX/CDX) is the output of the Torque/Control Transmitter (TX/CX) with the outputs of the transmitter windings connected to their counterpart windings on the TDX/CDX, S1 to S1, S2 to S2, and S3 to S3..."], "jumps": []}, {"id": "P1220", "text": ["Electrical energy induced in the stator windings of the transmitter is fed to their counterpart differential transmitter windings. The resulting magnetic fields in the stator windings of the differential transmitter develop electrical energy in the three windings of the differential transmitter rotor..."], "jumps": []}, {"id": "P1230", "text": ["The rotor of the differential transmitter receives mechanical position input from an external source. The positional relationship between the differential transmitter stator windings and rotor windings produces an output from the rotor windings, which is used for correction..."], "jumps": []}, {"id": "P1240", "text": ["Always remember that both rotors mentioned thus far, on the Torque/Control Transmitter and the Torque/Control Differential Transmitter are not free to spin. Each receives positional input from a mechanical source and is held in position..."], "jumps": []}, {"id": "P1250", "text": ["In our previous example the original target setting of 75", "was done with the Torque/Control Transmitter. Since the compass heading of the target did not change the Torque/Control Transmitter position did not change as the ship was turned to the 30"], "jumps": []}, {"id": "P1260", "text": ["heading the Torque/Control Differential Transmitter subtracted 30", "from the original weapon position, moving the weapons to a relative position of 45"], "jumps": []}, {"id": "P1270", "text": ["The output of the Torque/Control Differential Transmitter is taken from the three rotor windings and is supplied to the Torque Receiver or Control Transolver. The Torque Receiver performs the same function as with the simple synchro system..."], "jumps": []}, {"id": "P1280", "text": ["the radar detects another plane on a heading of 10", ". In which direction would you look to visually identify the other plane?"], "jumps": ["P1270"]}, {"id": "P1281", "text": [], "jumps": []}, {"id": "P1282", "text": ["heading on the compass rose......................"], "jumps": []}, {"id": "P1290", "text": [], "jumps": []}, {"id": "P1300", "text": [], "jumps": []}, {"id": "P1310", "text": ["Instruction signals were sent from the TDX to the TR to reposition from 75"], "jumps": []}, {"id": "P1320", "text": ["The Torque Receiver (TR) has the same in-phase voltage applied to the rotor winding as the Torque Transmitter (TX). The Torque Receiver stator windings are no longer connected to the Torque Transmitter stator windings but instead to the Torque Differential Transmitter (TDX) ROTOR windings..."], "jumps": []}, {"id": "P1330", "text": ["The Torque Differential Transmitter (TDX) allows full 360", "rotation of the rotor just as with the Torque Transmitter (TX). In our example it allows the targeting of the other ship using a compass heading as the Torque Differential Transmitter automatically supplies the targeting corrections..."], "jumps": []}, {"id": "P1340", "text": ["Here is an example of a simple synchronization system. You'll note that when the Torque Transmitter rotates, the Torque Receiver exactly follows the movement........................."], "jumps": []}, {"id": "P1350", "text": ["A Torque Differential Transmitter, also with a graduated scale, has been added to the illustration. It also has a simulated vessel outline. This allows the built-in navigational offset to be entered into the synchro system..."], "jumps": []}, {"id": "P1360", "text": ["You'll note the correction made to the TR position by the TDX. The TX is set at the True Bearing and the TDX makes corrections to the TR position based on the ship heading.n."], "jumps": []}, {"id": "P1362", "text": ["This allows the antenna heading to remain accurate regardless of the ship heading.e True Bearing and the TDX makes corrections to the TR position based on the ship heading.n."], "jumps": []}, {"id": "P1364", "text": ["In this example the target is at a true bearing of 30", "heading. The antenna therefore is positioned at 0", "relative bearing. The Ship is headed directly toward the target."], "jumps": []}, {"id": "P1366", "text": ["In this example the target is at a true bearing of 120", "heading. The antenna therefore is positioned at 180", "relative bearing. The ship is heading directly away from the target."], "jumps": []}, {"id": "P1368", "text": ["In this example the target is at a true bearing of 90", "heading. The antenna therefore is positioned at 180", "relative bearing. The ship is again headed directly away from the target."], "jumps": []}, {"id": "P1369", "text": ["In this final example the target is at a true bearing of 240", "heading. The antenna therefore is positioned at 230"], "jumps": []}, {"id": "P1370", "text": ["Enter the position of the Torque Receiver for the Torque Transmitter and the Torque Differential Transmitter positions shown.:positions::ns:", "TX TDX TRRRRR"], "jumps": ["P1369"]}, {"id": "P1373", "text": ["You should have entered the following values for the position of the Torque Receiver.with the Torque Transmitter and the Torque Differential Transmitter: 0", "TX TDX TRRRRR"], "jumps": []}, {"id": "P1380", "text": ["Enter the position of the Torque Receiver for the Torque Transmitter and the Torque Differential Transmitter positions shown.::::::::::::::::::::::::::", "TX TDX TRRRRR"], "jumps": ["P1370"]}, {"id": "P1383", "text": ["You should have entered the following values for the position of the Torque Receiver. u should have entered: 90", "TX TDX TRRRRR"], "jumps": []}, {"id": "P1390", "text": ["Remember these relationships: Torque Transmitter: Set to the desired compass bearing. Torque Differential Transmitter: Set to the current heading. Torque Receiver: Powered by the Torque Transmitter and Torque Differential Transmitter to the relative corrected bearing..."], "jumps": ["P1910"]}, {"id": "P1800", "text": [], "jumps": []}, {"id": "P1801", "text": [], "jumps": []}, {"id": "P1910", "text": ["You have completed the information on DIFFERENTIAL TRANSMITTERS."], "jumps": ["P1001", "P1390"]}, {"id": "P1920", "text": ["1. The Torque Differential Transmitter provides positional correction to the Torque Receiver in a synchro system."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. The source of the correction applied by the Torque Differential Transmitter is usually navigational equipment or position- finding equipment on motorized assemblies."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. The Torque Differential Transmitter is placed electrically between the Torque Transmitter and the Torque Receiver.."], "jumps": ["P1999", "P1930"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1940"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["A Torque Differential Transmitter must be used on every synchro system."], "jumps": []}, {"id": "P10211", "text": ["Which of the following is a Torque Differential Transmitter?"], "jumps": []}, {"id": "P10212", "text": ["Which of the following is a Torque Differential Transmitter?"], "jumps": []}, {"id": "P10213", "text": ["Which of the following is a Torque Differential Transmitter?"], "jumps": []}, {"id": "P10214", "text": ["Adjusts the elevation of a radar platform.", "What is the function of the Torque Differential Transmitter?", "Supplies power to the Torque Transmitter.", "Provides rotational correction to the Torque Receiver."], "jumps": []}, {"id": "P10215", "text": ["Which winding on the Torque Differential Transmitter is powered with AC voltage in phase with the Torque Transmitter from the power supply?"], "jumps": []}, {"id": "P10216", "text": ["another aircraft is detected on a heading of 120", ". How much correction is applied to the radar tracking system by the Torque Differential Transmitter in this situation?"], "jumps": []}, {"id": "P10217", "text": ["What resistance would you expect to measure between the S1 and the R1 terminals of the Torque Differential Transmitter?"], "jumps": []}, {"id": "P10218", "text": [". Correction is applied by the Torque Differential Transmitter. To keep the radar targeted on the other vessel, in which direction is the radar pointed?", "To the starboard (right).To the bow (straight ahead)."], "jumps": []}, {"id": "P10219", "text": ["The Torque Differential Transmitter always adjusts a synchro system according to _______", "the current compass heading. the relative bearing."], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
