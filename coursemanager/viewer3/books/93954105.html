const book = {"title": "93954105", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: 555 TIMERE sdf sdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe the purpose of the 555 timer. w Describe the internal operation of the 555 timer.", "multivibrator. w Describe the operation of a 555 timer used as a monostable multivibrator.", "w Observe the operation of a 555 timer circuit. w Operate a 555 timer in astable and monostable multivibrator configurations..", "w Describe the operation of a 555 timer used as an astable multivibrator. w Describe the operation of a 555 timer used as a monostable multivibrator."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson you will learn about a very important circuit, the 555 timer."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["The 555 timer is a circuit that provides timing signals to other digital circuits."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["The importance of accurate timing in digital systems cannot be overemphasized."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Without accurate timing, everyday appliances such as TVs, VCRs, stereos and even cars would not be able to function."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["A low cost, effective digital timer had to be developed as digital circuitry became commonplace."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["The 555 Timer (and its revisions) is that digital circuit.", "The 555 Timer (and its revisions) is that digital circuit.."], "jumps": ["P460", "P430"]}, {"id": "P460", "text": ["Let's begin the lesson on the 555 TIMER..................................."], "jumps": ["P450"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The 555 integrated circuit is a commonly used device that operates as either an astable or monostable vibrator."], "jumps": ["P1025", "P1001"]}, {"id": "P1025", "text": ["The output waveform is a square wave that can range from a few hertz to several megahertz."], "jumps": ["P1030", "P1020"]}, {"id": "P1030", "text": ["555 timers can operate as TTL compatible astable multivibrators, monostable multivibrators, pulse width modulators, pulse position modulators or linear ramp generators."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Most 555 integrated circuits are housed in an eight-pin dip case."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["Some older style 555's are housed in cans."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["The pin out is as follows:", "The pin out is as follows:re...............................", "1 - GND 2 - Trigger 3 - OUT 4 - CLR 5 - Control 6 - Threshold 7 - Discharge 8 - Vcc"], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["In keeping with the versatile nature of the circuit, Vcc can vary from 5 VDC to 15 VDC without affecting circuit operation.", "1 - GND 2 - Trigger 3 - OUT 4 - CLR 5 - Control 6 - Threshold 7 - Discharge 8 - Vcc"], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["The ground for the chip is on Pin 1 and Pin 3 is the output.", "1 - GND 2 - Trigger 3 - OUT 4 - CLR 5 - Control 6 - Threshold 7 - Discharge 8 - Vcc"], "jumps": ["P1100", "P1070"]}, {"id": "P1100", "text": ["To produce the different circuit configurations, different external components or voltages are connected to Pins 2, 4, 5, 6 and 7.", "1 - GND 2 - Trigger 3 - OUT 4 - CLR 5 - Control 6 - Threshold 7 - Discharge 8 - Vcc"], "jumps": ["P1110", "P1070"]}, {"id": "P1110", "text": ["What is the purpose of a 555 integrated circuit?", "What is the purpose of a 555 integrated circuit?..........."], "jumps": ["P1070"]}, {"id": "P1111", "text": [], "jumps": []}, {"id": "P1112", "text": ["The 555 chip can operate on different voltages but, it is not used to supply different voltages."], "jumps": []}, {"id": "P1113", "text": ["You are partially correct, the 555 is a type of oscillator. However, its purpose is to provide something to digital circuits."], "jumps": []}, {"id": "P1120", "text": ["The internal circuit design is what makes the 555 versatile. Let's discuss the internal operation."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["The major components of the 555 timer are an inverter, a transistor, 2 comparators and an RS flip-flop.", "The major components of the 555 timer are an inverter, a transistor, 2 comparators and an RS flip-flop.."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["Together, the circuit can operate in many configurations."], "jumps": ["P1160", "P1120"]}, {"id": "P1160", "text": ["Let's briefly discuss the comparators and RS flip-flop operation."], "jumps": ["P1180", "P1120"]}, {"id": "P1180", "text": ["A comparator does what its name implies, it compares two input voltage levels."], "jumps": ["P1190", "P1120"]}, {"id": "P1190", "text": ["If the + input is larger than the - input, the output is high (1 or true)."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["If the + input is smaller than the - input, the output is low (0 or false)."], "jumps": ["P1210", "P1180"]}, {"id": "P1210", "text": ["Notice the - input is subtracted from the + input. If the difference is 1 or positive the output is 1. If the difference is 0 or negative the output is 0."], "jumps": ["P1220", "P1180"]}, {"id": "P1220", "text": ["RS flip-flop operation is just as simple. RS means Reset, Set."], "jumps": ["P1230", "P1180"]}, {"id": "P1230", "text": ["The device has three inputs:", "The device has three inputs:..............................."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["The device has two outputs:"], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["The outputs are always opposite. If Q is 1, Q is 0 and if Q is 0, Q is 1."], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["If the S input (SET) is high, Q is high and Q is low. The flip-flop is said to be SET."], "jumps": ["P1270", "P1230"]}, {"id": "P1270", "text": ["If the R input (RESET) is high, Q is low and Q is high. The flip-flop is RESET."], "jumps": ["P1280", "P1230"]}, {"id": "P1280", "text": ["Having R and S high at the same time will drive both Q and Q low, this is an invalid input condition."], "jumps": ["P1290", "P1230"]}, {"id": "P1290", "text": ["Once the flip-flop is SET or RESET, the outputs will not change if the inputs become zero."], "jumps": ["P1300", "P1230"]}, {"id": "P1300", "text": ["The flip-flop stays SET or RESET until a high is present on an input."], "jumps": ["P1320", "P1230"]}, {"id": "P1310", "text": ["The CLR input overrides inputs R and S. If CLR is low, the flip-flop resets, (Q low and Q high) even if input S is high."], "jumps": ["P1330", "P1230"]}, {"id": "P1320", "text": ["The small circle on the CLR input indicates a low activates this function."], "jumps": ["P1310", "P1230"]}, {"id": "P1330", "text": ["As long as CLR is high, the flip-flop SETs when S is high and RESETs when R is high.", "As long as CLR is high, the flip-flop SETs when S is high and RESETs when R is high..."], "jumps": ["P1340", "P1230"]}, {"id": "P1340", "text": ["What is the output of this comparator?", "What is the output of this comparator?....................."], "jumps": ["P1330"]}, {"id": "P1341", "text": [], "jumps": []}, {"id": "P1342", "text": ["Notice the - input is larger than the + input. To determine whether the input is high or low subtract the negative input from the positive."], "jumps": []}, {"id": "P1350", "text": ["Is the RS flip-flop SET or RESET?", "Is the RS flip-flop SET or RESET?.........................."], "jumps": ["P1340"]}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1352", "text": ["Remember, a low on the CLR input overrides a high on inputs R and S."], "jumps": []}, {"id": "P1360", "text": ["Now, let's see the internal operation of a 555 timer.", "Now, let's see the internal operation of a 555 timer......."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["Note that the 555 by itself will not operate, it takes external components connected to pins 2, 4, 5, 6, and 7."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["You can see how different voltages on pins 2, 4, 5, 6 and 7 affect the circuits without seeing the connected components."], "jumps": ["P1390", "P1360"]}, {"id": "P1390", "text": ["The R and S inputs to the flip-flop are provided by the outputs of  two comparators.", "The R and S inputs to the flip-flop are provided by the outputs of two comparators."], "jumps": ["P1400", "P1360"]}, {"id": "P1400", "text": ["When the output of a comparator becomes high, the flip-flop will SET or RESET depending on which comparator has the high output."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["Remember, a zero or low input to the RS flip-flop has no effect, the flip-flop stays SET or RESET."], "jumps": ["P1420", "P1390"]}, {"id": "P1420", "text": ["The CLR input to the flip-flop comes from an external source."], "jumps": ["P1430", "P1390"]}, {"id": "P1430", "text": ["In most configurations, the CLR input is tied to Vcc which disables CLR."], "jumps": ["P1440", "P1390"]}, {"id": "P1440", "text": ["The comparators have a reference voltage applied from +Vcc."], "jumps": ["P1450", "P1390"]}, {"id": "P1450", "text": ["+Vcc is divided by three equal value resistors and applied to comparators 1 and 2.", "+Vcc is divided by three equal value resistors and applied to comparators 1 and 2..........."], "jumps": ["P1460", "P1390"]}, {"id": "P1460", "text": ["2/3 of +Vcc is applied to the - input of comparator 1."], "jumps": ["P1470", "P1390"]}, {"id": "P1470", "text": ["Also note that this voltage can be changed by applying a voltage to the control input on Pin 5. This adds versatility to the chip."], "jumps": ["P1480", "P1390"]}, {"id": "P1480", "text": ["In most configurations, Pin 5 is connected to ground through a DC blocking capacitor (blocks 2/3 +Vcc from ground)."], "jumps": ["P1490", "P1390"]}, {"id": "P1490", "text": ["1/3 of Vcc is applied to the + input of comparator 2."], "jumps": ["P1500", "P1390"]}, {"id": "P1500", "text": ["These reference voltages and the inputs on pins 6 (threshold) and 2 (trigger) make the 555 operate."], "jumps": ["P1510", "P1390"]}, {"id": "P1510", "text": ["The external components connected to pins 2 and 6 control the 555 timer configuration."], "jumps": ["P1520", "P1390"]}, {"id": "P1520", "text": ["When the threshold voltage input, on Pin 6, goes above 2/3 Vcc, comparator 1 produces a high output that is applied to the R input of the flip-flop."], "jumps": ["P1530", "P1390"]}, {"id": "P1530", "text": ["The RS flip-flop resets causing the Q output to go high. The inverter changes the high to a low and puts a low on pin 3."], "jumps": ["P1540", "P1390"]}, {"id": "P1540", "text": ["Even if the threshold voltage drops below 2/3 Vcc and causes a low output from comparator 1, the flip-flop stays RESET."], "jumps": ["P1550", "P1390"]}, {"id": "P1550", "text": ["When the trigger input voltage, on Pin 2 drops below 1/3 Vcc, comparator 2 puts a high on input S of the flip-flop."], "jumps": ["P1560", "P1390"]}, {"id": "P1560", "text": ["The high from comparator 2 causes the flip-flop to SET, Q goes low and the output becomes high."], "jumps": ["P1570", "P1390"]}, {"id": "P1570", "text": ["Even if the trigger input goes above 1/3 Vcc, the 0 output of comparator 2 will not change the flip-flop's state."], "jumps": ["P1580", "P1390"]}, {"id": "P1580", "text": ["To summarize, Pin 3 output is LOW when the threshold input goes above 2/3 Vcc and HIGH when the trigger input goes below 1/3 of Vcc.", "To summarize, Pin 3 output is LOW when the threshold input goes above 2/3 Vcc and HIGH when the trigger input goes below 1/3 of Vcc.... of Vcc."], "jumps": ["P1590", "P1390"]}, {"id": "P1590", "text": ["Note that when the 555 output goes low, it stays low even if the voltage on the threshold input drops below 2/3 Vcc."], "jumps": ["P1600", "P1580"]}, {"id": "P1600", "text": ["When the 555 output is high, it stays high even if the voltage on the trigger input goes above 1/3 Vcc."], "jumps": ["P1610", "P1580"]}, {"id": "P1610", "text": ["The transistor in the 555 timer performs another important operation."], "jumps": ["P1620", "P1580"]}, {"id": "P1620", "text": ["The transistor is used as a switch to supply a ground to Pin 7, the Discharge pin."], "jumps": ["P1630", "P1610"]}, {"id": "P1630", "text": ["When the Q output of the flip-flop is high, the transistor is forward biased, connecting the ground on Pin 1 to Pin 7."], "jumps": ["P1640", "P1610"]}, {"id": "P1640", "text": ["When the Q output of the flip-flop is low, the transistor is reverse biased, breaking the connection from Pin 1 to Pin 7."], "jumps": ["P1650", "P1610"]}, {"id": "P1650", "text": ["The operation of the threshold and trigger inputs along with the ground or no ground on the discharge pin are important for circuit operation."], "jumps": ["P1670", "P1610"]}, {"id": "P1670", "text": ["If the input on Pin 6 is above 2/3 Vcc, what is the flip-flop's state?"], "jumps": ["P1650"]}, {"id": "P1671", "text": [], "jumps": []}, {"id": "P1672", "text": ["Comparator 1 output is connected to input R. A high on R will not SET the flip-flop."], "jumps": []}, {"id": "P1673", "text": ["When the + input to comparator 1 is above 2/3 Vcc, the output does change."], "jumps": []}, {"id": "P1680", "text": ["Consider comparator 2 only and that the F/F has been set, what condition will the F/F assume if the input on pin 2 rises above 1/3 of Vcc?"], "jumps": ["P1670"]}, {"id": "P1681", "text": [], "jumps": []}, {"id": "P1682", "text": ["The only time a flip-flop sets or resets is when a high is applied to one of the inputs. When the - input of comparator 2 is above 1/3 Vcc, the output is not high."], "jumps": []}, {"id": "P1683", "text": ["A high output from comparator 2 will not Reset the F/F since it's output is connected to S (Set) on the F/F."], "jumps": []}, {"id": "P1690", "text": ["A ground is applied to Pin 7 when the transistor is forward biased due to Q output being"], "jumps": ["P1680"]}, {"id": "P1691", "text": [], "jumps": []}, {"id": "P1692", "text": ["When the output of Q is low, the transistor is off, breaking the connection from Pin 1 to 7."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on 555 TIMER DESCRIPTION.", "This completes the information on 555 TIMER DESCRIPTION...."], "jumps": ["P1001", "P1690"]}, {"id": "P1920", "text": ["1.  A 555 integrated circuit provides other digital circuits with               square wave timing signals from below 1 Hz to several Mhz.", "1. A 555 integrated circuit provides other digital circuits with square wave timing signals from below 1 Hz to several Mhz."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Most 555's are housed in an eight pin dip case.", "2. Most 555's are housed in an eight pin dip case.........", "1 - GND 2 - Trigger 3 - OUT 4 - CLR 5 - Control 6 - Threshold 7 - Discharge 8 - Vcc"], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The internal circuit design is what makes the 555 versatile.", "3. The internal circuit design is what makes the 555 versatile."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  The comparators produce a high output if the + input is larger        than the - input. \n5.  The comparators produce a low output if the + input is smaller       than the - input.", "4. The comparators produce a high output if the + input is larger than the - input. 5. The comparators produce a low output if the + input is smaller than the - input.."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["6.  The RS flip-flop produces a high Q if S is high and a low Q              output if R is high.\n7.  No change if R and S are both low.                \n8.  Q and Q are always opposite.", "6. The RS flip-flop produces a high Q if S is high and a low Q output if R is high. 7. No change if R and S are both low. 8. Q and Q are always opposite......", "SET RESET S - 1 S - 0 R - 0 R - 1 Q - 0 Q - 1 Q - 1 Q - 000000000ccccccc"], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["9.  If the threshold input goes above 2/3 Vcc, the flip-flop                       RESETs producing a 0 output. \n10.  If the trigger input goes below 1/3 Vcc, the flip-flop SETs                  producing a 1 output.", "9. If the threshold input goes above 2/3 Vcc, the flip-flop RESETs producing a 0 output. 10. If the trigger input goes below 1/3 Vcc, the flip-flop SETs producing a 1 output."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["11.  When Q is low, the transistor is off, breaking the ground                   connection from Pin 1 to Pin 7.  \n12.  When Q is high, the transistor is on, making the ground                    connection from Pin 1 to Pin 7.", "11. When Q is low, the transistor is off, breaking the ground connection from Pin 1 to Pin 7. 12. When Q is high, the transistor is on, making the ground connection from Pin 1 to Pin 7."], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["13.  Pins 2, 6, and 7 can have various components connected to          them to configure the 555 for different circuits.", "13. Pins 2, 6, and 7 can have various components connected to them to configure the 555 for different circuits."], "jumps": ["P1999", "P1970"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.nu."], "jumps": ["P1001", "P1970"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["The 555 timer can be configured for many types of circuits. The chip was designed to be very versatile."], "jumps": ["P2025", "P2001"]}, {"id": "P2025", "text": ["We are going to discuss its use as an astable and monostable multivibrator."], "jumps": ["P2030", "P2020"]}, {"id": "P2030", "text": ["The astable multivibrator is a circuit that produces a continuous square wave output. There are no stable states."], "jumps": ["P2040", "P2025"]}, {"id": "P2040", "text": ["As long as power is applied to the circuit, there is an output square wave."], "jumps": ["P2060", "P2030"]}, {"id": "P2060", "text": ["The monostable multivibrator is a circuit that produces a high output only when an input is received, then the output goes back low. There is one stable state."], "jumps": ["P2080", "P2030"]}, {"id": "P2080", "text": ["The 555 Timer has the following characteristics.", "The 555 Timer has the following characteristics............", "555 Timer Characteristics Threshold 2/3 Vcc . Sets Output LOW Trigger 1/3 Vcc . . . . Sets Output HIGH HIGH Output . . . . . . . Pin 7 Open LOW Output . . . . . . . Pin 7 Grounded"], "jumps": ["P2090", "P2060"]}, {"id": "P2090", "text": ["You may want to write these down for future reference."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["Let's first discuss the astable multivibrator 555 circuit.", "Let's first discuss the astable multivibrator 555 circuit.."], "jumps": ["P2110", "P2080"]}, {"id": "P2110", "text": ["The astable multivibrator circuit uses two resistors and one capacitor to configure the 555 timer."], "jumps": ["P2120", "P2100", "P2115"]}, {"id": "P2112", "text": ["The astable multivibrator circuit uses two resistors and one capacitor to configure the 555 timer."], "jumps": ["P2120", "P2100", "P2115"]}, {"id": "P2115", "text": ["ASTABLE MULTIVIBRATOR CIRCUIT - External connection to 555 Timer."], "jumps": []}, {"id": "P2120", "text": ["R1, Pin 4 and Pin 8 are connected to +Vcc. Pin 4 at +Vcc disables the CLR input to the RS flip-flop."], "jumps": ["P2130", "P2112"]}, {"id": "P2130", "text": ["Pin 1 is grounded and a capacitor is connected between pin 5 and ground. This keeps the reference voltages at 2/3 and 1/3 Vcc. The capacitor and ground on pin 5 also filter noise and voltage variations from the power supply.", "Pin 1 is grounded and a capacitor is connected between pin 5 and ground. This keeps the reference voltages at 2/3 and 1/3 Vcc. The capacitor and ground on pin 5 also filter noise and voltage variations from the power supply..."], "jumps": ["P2140", "P2112"]}, {"id": "P2140", "text": ["The connection of R1 and R2 is applied to Pin 7, the discharge connection. Pin 7 will be open or grounded depending on the state of the internal circuit."], "jumps": ["P2150", "P2112"]}, {"id": "P2150", "text": ["The connection of R2 and C1 is applied to Pins 2 and 6, the threshold and trigger inputs."], "jumps": ["P2160", "P2112"]}, {"id": "P2160", "text": ["The circuit operation is based on the charging and discharging of C1."], "jumps": ["P2170", "P2112"]}, {"id": "P2170", "text": ["When +Vcc is first applied to the circuit, the voltage across C1 is 0 volts."], "jumps": ["P2180", "P2112"]}, {"id": "P2180", "text": ["0 volts on Pin 6 is not greater than 2/3 Vcc. The output on Pin 3 will not change to low.", "555 Timer Characteristics Threshold 2/3 Vcc . Output LOW HIGH Out . . . . . . . . . . Pin 7 Open LOW Out . . . . . . . . . . Pin 7 GNDt . . . . . . . . . . Pin 7 GNDDDDDded"], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["0 volts on Pin 2 is less than 1/3 Vcc. The output on Pin 3 will be HIGH and Pin 7 is open.", "HIGH Out . . . . . . . . . . Pin 7 OpenH"], "jumps": ["P2200", "P2170"]}, {"id": "P2200", "text": ["With an open on Pin 7, C1 begins to charge. The voltage across C1 increases."], "jumps": ["P2170"]}, {"id": "P2210", "text": ["Note when the voltage across C1 increases between 1/3 Vcc and 2/3 Vcc, no circuit action happens.", "555 Timer Characteristics Threshold 2/3 Vcc . Output LOW Trigger 1/3 Vcc . . . .Output HIGH HIGH Out . . . . . . . . . . Pin 7 Open LOW Out . . . . . . . . . . Pin 7 GNDd"], "jumps": ["P2220", "P2170", "P2215"]}, {"id": "P2212", "text": ["Note when the voltage across C1 increases to between 1/3 Vcc and 2/3 Vcc, no circuit action happens.", "555 Timer Characteristics Threshold 2/3 Vcc . Output LOW Trigger 1/3 Vcc . . . .Output HIGH HIGH Out . . . . . . . . . . Pin 7 Open LOW Out . . . . . . . . . . Pin 7 GNDd"], "jumps": ["P2220", "P2170", "P2215"]}, {"id": "P2215", "text": ["ASTABLE MULTIVIBRATOR CIRCUIT - Both comparators have LOW outputs.Lows on R and S do not change the flip-flop."], "jumps": []}, {"id": "P2220", "text": ["C1 continues to charge until reaching 2/3 Vcc."], "jumps": ["P2230", "P2212"]}, {"id": "P2230", "text": ["Above 2/3 Vcc, the threshold input causes the output to change to a low and Pin 7 is grounded.", "LOW Out . . . . . . . . . . Pin 7 GNDnnH", "Threshold 2/3 Vcc . Output LOWWWDDDDD Pin 7 GND"], "jumps": ["P2212"]}, {"id": "P2240", "text": ["The ground on Pin 7 causes +Vcc to be dropped across R1. C1 starts discharging, decreasing the voltage on Pin 2 and 6."], "jumps": ["P2250", "P2212"]}, {"id": "P2250", "text": ["Note when the voltage across C1 decreases between 1/3 Vcc and 2/3 Vcc, there is no circuit action.", "555 Timer Characteristics Threshold 2/3 Vcc . Output LOW Trigger 1/3 Vcc . . . .Output HIGH HIGH Out . . . . . . . . . . Pin 7 Open LOW Out . . . . . . . . . . Pin 7 GNDd", "LOW Out . . . . . . . . . . Pin 7 GNDDDH", "Threshold 2/3 Vcc . Output LOWWWDDDDD Pin 7 GND"], "jumps": ["P2260", "P2212", "P2255"]}, {"id": "P2255", "text": ["ASTABLE MULTIVIBRATOR CIRCUIT - Both comparators have LOW outputs. Lows on R and S do not change the flip-flop."], "jumps": []}, {"id": "P2260", "text": ["C1 continues to discharge until reaching 1/3 Vcc."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["Below 1/3 Vcc, the trigger input changes the output to a high and Pin 7 opens.", "555 Timer Characteristics Threshold 2/3 Vcc . Output LOW Trigger 1/3 Vcc . . . .Output HIGH HIGH Out . . . . . . . . . . Pin 7 Open LOW Out . . . . . . . . . . Pin 7 GNDd", "HIGH Out . . . . . . . . . . Pin 7 OpenH"], "jumps": ["P2250"]}, {"id": "P2280", "text": ["With Pin 7 open, C1 begins to charge towards 2/3 Vcc again.", "555 Timer Characteristics Threshold 2/3 Vcc . Output LOW Trigger 1/3 Vcc . . . .Output HIGH HIGH Out . . . . . . . . . . Pin 7 Open LOW Out . . . . . . . . . . Pin 7 GNDd"], "jumps": ["P2250"]}, {"id": "P2290", "text": ["The cycle repeats. As long as power is applied to the circuit, the output is a continuous square wave."], "jumps": ["P2250", "P2300"]}, {"id": "P2300", "text": ["The output is high until C1 charges above 2/3 Vcc. Then the output is low and a ground is placed on Pin 7 to discharge C1."], "jumps": ["P2310", "P2250"]}, {"id": "P2310", "text": ["As C1 discharges, the output is low until the discharge is below 1/3 Vcc. Then the output goes high and the ground is removed from Pin 7 to charge C1."], "jumps": ["P2320", "P2250"]}, {"id": "P2320", "text": ["The frequency of the output waveform depends on the charge and discharge time of C1 and the RC time constant."], "jumps": ["P2330", "P2250"]}, {"id": "P2330", "text": ["Different values of R1, R2 and C1 will produce different output frequencies."], "jumps": ["P2340", "P2250"]}, {"id": "P2340", "text": ["Vcc values have no affect on operation since the 555 circuit, R1, R2 and C1 use the same Vcc."], "jumps": ["P2350", "P2250"]}, {"id": "P2350", "text": ["Changes in Vcc change the 1/3 and 2/3 voltage levels in the 555 and the voltage across C1 will change proportionally."], "jumps": ["P2360", "P2250"]}, {"id": "P2360", "text": ["What causes C1 to discharge in this astable multivibrator circuit?"], "jumps": ["P2250"]}, {"id": "P2361", "text": [], "jumps": []}, {"id": "P2362", "text": ["With Pin 7 opened, Vcc is routed through R1 and R2, C1 is charging."], "jumps": []}, {"id": "P2363", "text": ["The inputs cause a high output. Pin 7 is open, C1 will not discharge.", "555 Timer Characteristics Threshold 2/3 Vcc . Output LOW Trigger 1/3 Vcc . . . .Output HIGH HIGH Out . . . . . . . . . . Pin 7 Open LOW Out . . . . . . . . . . Pin 7 GNDd"], "jumps": []}, {"id": "P2370", "text": ["What voltage value will C1 discharge to when Pin 7 is grounded?"], "jumps": ["P2360"]}, {"id": "P2371", "text": [], "jumps": []}, {"id": "P2372", "text": ["C1 never reaches Vcc. C1 charges and discharges between 1/3 and 2/3 Vcc."], "jumps": []}, {"id": "P2373", "text": ["C1 charges (increases) to 2/3 Vcc. Discharge is decreasing voltage."], "jumps": []}, {"id": "P2380", "text": ["What determines the frequency of the output square wave?", "What determines the frequency of the output square wave?..."], "jumps": ["P2370"]}, {"id": "P2381", "text": [], "jumps": []}, {"id": "P2382", "text": ["Vcc has no affect on circuit frequency. The RC time constant affects frequency."], "jumps": []}, {"id": "P2383", "text": ["The internal circuitry of the 555 does not affect the output frequency signal."], "jumps": []}, {"id": "P2390", "text": ["Now, let's see the same 555 timer used as a monostable multivibrator."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["The monostable multivibrator circuit uses one resistor and one capacitor to configure the 555 timer."], "jumps": ["P2410", "P2390", "P2405"]}, {"id": "P2402", "text": ["The monostable multivibrator circuit uses one resistor and one capacitor to configure the 555 timer."], "jumps": ["P2410", "P2390", "P2405"]}, {"id": "P2405", "text": ["MONOSTABLE MULTIVIBRATOR CIRCUIT - External connection to 555 Timer."], "jumps": []}, {"id": "P2410", "text": ["R1, Pin 4 and Pin 8 are connected to +Vcc. Pin 4 at Vcc disables the CLR input to the RS flip-flop."], "jumps": ["P2420", "P2390"]}, {"id": "P2420", "text": ["Pin 1 and Pin 5 are grounded. Pin 5 at ground keeps the reference voltages at 2/3 and 1/3 Vcc."], "jumps": ["P2430", "P2390"]}, {"id": "P2430", "text": ["The connection of R1 and C1 is applied to Pins 6 and 7. Pin 7 is open or grounded depending on the 555 circuit."], "jumps": ["P2440", "P2390"]}, {"id": "P2440", "text": ["The circuit input is the Trigger, Pin 2, and is normally high. A low starts circuit operation."], "jumps": ["P2460", "P2390"]}, {"id": "P2460", "text": ["The circuit operation is based on the charging and discharging of C1."], "jumps": ["P2470", "P2390"]}, {"id": "P2470", "text": ["When +Vcc is first applied to the circuit, the voltage across C1 is 0 volts."], "jumps": ["P2480", "P2390"]}, {"id": "P2480", "text": ["The 0 volts on Pin 6 will not cause a change in the circuit.", "555 Timer Characteristics Threshold 2/3 Vcc . Output LOW Trigger 1/3 Vcc . . . .Output HIGH HIGH Out . . . . . . . . . . Pin 7 Open LOW Out . . . . . . . . . . Pin 7 GNDd", "Threshold 2/3 Vcc . Output LOWWWDDDDD Pin 7 GND"], "jumps": ["P2490", "P2470"]}, {"id": "P2490", "text": ["The normally high input on Pin 2 does not cause the circuit to change either.", "555 Timer Characteristics Threshold 2/3 Vcc . Output LOW Trigger 1/3 Vcc . . . .Output HIGH HIGH Out . . . . . . . . . . Pin 7 Open LOW Out . . . . . . . . . . Pin 7 GNDd"], "jumps": ["P2500", "P2470"]}, {"id": "P2500", "text": ["A low circuit output with the other given circuit conditions indicates that Pin 7 is grounded.", "LOW Out . . . . . . . . . . Pin 7 GNDnnH"], "jumps": ["P2510", "P2470"]}, {"id": "P2510", "text": ["Note if the output is high at this time, the circuit automatically changes the output to a low."], "jumps": ["P2520", "P2470"]}, {"id": "P2520", "text": ["Since Pin 7 is connected to Pin 6, the voltage on Pin 6 is grounded and the capacitor cannot charge."], "jumps": ["P2530", "P2470"]}, {"id": "P2530", "text": ["The circuit remains in this stable state since Pin 2's voltage has not changed and Pin 6 voltage cannot change."], "jumps": ["P2540", "P2470"]}, {"id": "P2540", "text": ["The internal circuitry of the 555 will not change the output. A low applied to Pin 2 will change the output.", "555 Timer Characteristics Threshold 2/3 Vcc . Output LOW Trigger 1/3 Vcc . . . .Output HIGH HIGH Out . . . . . . . . . . Pin 7 Open LOW Out . . . . . . . . . . Pin 7 GNDd"], "jumps": ["P2560", "P2470"]}, {"id": "P2560", "text": ["The low trigger voltage, less than 1/3 Vcc, causes a high output and removes the ground from Pin 7.", "555 Timer Characteristics Threshold 2/3 Vcc . Output LOW Trigger 1/3 Vcc . . . .Output HIGH HIGH Out . . . . . . . . . . Pin 7 Open LOW Out . . . . . . . . . . Pin 7 GNDd", "HIGH Out . . . . . . . . . . Pin 7 OpenH"], "jumps": ["P2470"]}, {"id": "P2570", "text": ["With the ground removed from Pin 7, Pin 6 also has the ground removed and C1 begins to charge.", "555 Timer Characteristics Threshold 2/3 Vcc . Output LOW Trigger 1/3 Vcc . . . .Output HIGH HIGH Out . . . . . . . . . . Pin 7 Open LOW Out . . . . . . . . . . Pin 7 GNDd"], "jumps": ["P2580", "P2560"]}, {"id": "P2580", "text": ["Even if the trigger input goes back to high, C1 will continue to charge."], "jumps": ["P2600", "P2560", "P2585"]}, {"id": "P2582", "text": ["Even if the trigger input goes back to high, C1 will continue to charge.", "555 Timer Characteristics Threshold 2/3 Vcc . Output LOW Trigger 1/3 Vcc . . . .Output HIGH HIGH Out . . . . . . . . . . Pin 7 Open LOW Out . . . . . . . . . . Pin 7 GNDd"], "jumps": ["P2600", "P2560", "P2585"]}, {"id": "P2585", "text": ["MONOSTABLE MULTIVIBRATOR CIRCUIT - A high on comparator #2 causes a low output to the S input of the flip-flop. No change since the threshold hasn't reached 2/3 Vcc."], "jumps": []}, {"id": "P2600", "text": ["At just above 2/3 Vcc, the threshold input causes the output to go low and Pin 7 is grounded."], "jumps": ["P2610", "P2582"]}, {"id": "P2610", "text": ["If the 555 circuit has a high output when power is first applied (either Q or Q will be high, which one is not predictable), the output returns to low.", "If the 555 circuit has a high output when power is first applied (either Q or Q will be high, which one is not predictable), the output returns to low.."], "jumps": ["P2620", "P2582"]}, {"id": "P2620", "text": ["With the ground on Pins 6 and 7, C1 quickly discharges to 0 volts. However, the output does not change.", "555 Timer Characteristics Threshold 2/3 Vcc . Output LOW Trigger 1/3 Vcc . . . .Output HIGH HIGH Out . . . . . . . . . . Pin 7 Open LOW Out . . . . . . . . . . Pin 7 GNDd"], "jumps": ["P2630", "P2582", "P2625"]}, {"id": "P2625", "text": ["MONOSTABLE MULTIVIBRATOR CIRCUIT - A low from Pin 6 causes a low to the R input of the flip-flop. No change since the trigger input hasn't changed to low."], "jumps": []}, {"id": "P2630", "text": ["As before, the circuit stays in the stable state until another input is received on the trigger."], "jumps": ["P2640", "P2620"]}, {"id": "P2640", "text": ["The output stays low until a low input signal is received on the trigger."], "jumps": ["P2650", "P2620"]}, {"id": "P2650", "text": ["The low trigger input causes a high output and the ground to be removed from Pins 6 and 7 allowing C1 to charge."], "jumps": ["P2660", "P2620"]}, {"id": "P2660", "text": ["Once C1 charges above 2/3 Vcc, the output goes back to low and the ground is placed back on Pins 6 and 7."], "jumps": ["P2670", "P2620"]}, {"id": "P2670", "text": ["The time the output is high depends on the time constant of R1 and C1, not the time Pin 2 is low. This is normal monostable operation."], "jumps": ["P2680", "P2620"]}, {"id": "P2680", "text": ["Different values of R1 and C1 will produce different pulse lengths."], "jumps": ["P2690", "P2620"]}, {"id": "P2690", "text": ["As with the astable multivibrator, the value of Vcc has no affect on the circuit operation."], "jumps": ["P2700", "P2620"]}, {"id": "P2700", "text": ["What would the applied input trigger have to be for the output to be high?"], "jumps": ["P2620"]}, {"id": "P2701", "text": [], "jumps": []}, {"id": "P2702", "text": ["When the trigger input is below 1/3 Vcc circuit action occurs."], "jumps": []}, {"id": "P2710", "text": ["What determines the positive pulse length in this monostable multivibrator?"], "jumps": ["P2700"]}, {"id": "P2711", "text": [], "jumps": []}, {"id": "P2712", "text": ["Remember, Vcc can range from +5 volts to +15 volts without affecting circuit operation."], "jumps": []}, {"id": "P2713", "text": ["The input pulse to Pin 2 going low only starts the charging of C1."], "jumps": []}, {"id": "P2720", "text": ["When will capacitor C1 charge in this monostable multivibrator circuit?"], "jumps": ["P2710"]}, {"id": "P2721", "text": [], "jumps": []}, {"id": "P2722", "text": ["When Pin 7 is ground, +Vcc is dropped across R1 to ground and C1 discharges on Pin 7."], "jumps": []}, {"id": "P2723", "text": ["Q1 turns ON when the output is low. This grounds Pin 7 and discharges C1."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on 555 TIMER CONFIGURATION.", "This completes the information on 555 TIMER CONFIGURATION.."], "jumps": ["P2001", "P2720"]}, {"id": "P2920", "text": ["1.  An astable multivibrator 555 uses two resistors and one                  capacitor with the capacitor voltage connected to Pins 2 and 6.", "1. An astable multivibrator 555 uses two resistors and one capacitor with the capacitor voltage connected to Pins 2 and 6."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2.  With 0 volts across the capacitor, the output is high and Pin 7         is open due to a low trigger input.", "2. With 0 volts across the capacitor, the output is high and Pin 7 is open due to a low trigger input.", "555 Timer Characteristics Threshold 2/3 Vcc . Output LOW Trigger 1/3 Vcc . . . .Output HIGH HIGH Out . . . . . . . . . . Pin 7 Open LOW Out . . . . . . . . . . Pin 7 GNDd", "HIGH Out . . . . . . . . . . Pin 7 OpenH"], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3.  As the capacitor charges above 2/3 Vcc, the output goes low         and Pin 7 is grounded due to the threshold input.", "3. As the capacitor charges above 2/3 Vcc, the output goes low and Pin 7 is grounded due to the threshold input.", "LOW Out . . . . . . . . . . Pin 7 GNDnnH", "Threshold 2/3 Vcc . Output LOWWHHHHHHHHH"], "jumps": ["P2950", "P2930"]}, {"id": "P2950", "text": ["4.  C1 now discharges to less than 1/3 Vcc producing a high\n     output and Pin 7 opens due to the trigger input.", "4. C1 now discharges to less than 1/3 Vcc producing a high output and Pin 7 opens due to the trigger input........", "HIGH Out . . . . . . . . . . Pin 7 OpenH"], "jumps": ["P2960", "P2930"]}, {"id": "P2960", "text": ["5.  A monostable multivibrator 555 uses one resistor and one              capacitor with the capacitor voltage connected to Pins 6 and 7.", "5. A monostable multivibrator 555 uses one resistor and one capacitor with the capacitor voltage connected to Pins 6 and 7."], "jumps": ["P2970", "P2930"]}, {"id": "P2970", "text": ["6.  With 0 volts across the capacitor, the output stays in one                state, which is low with Pin 7 grounded.", "6. With 0 volts across the capacitor, the output stays in one state, which is low with Pin 7 grounded..", "555 Timer Characteristics Threshold 2/3 Vcc . Output LOW Trigger 1/3 Vcc . . . .Output HIGH HIGH Out . . . . . . . . . . Pin 7 Open LOW Out . . . . . . . . . . Pin 7 GNDd", "LOW Out . . . . . . . . . . Pin 7 GNDnnH"], "jumps": ["P2980", "P2960"]}, {"id": "P2980", "text": ["7.  When the trigger input goes low, the output changes to high           and Pin 7 is opened. C1 starts to charge.", "7. When the trigger input goes low, the output changes to high and Pin 7 is opened. C1 starts to charge.", "HIGH Out . . . . . . . . . . Pin 7 OpenH"], "jumps": ["P2990", "P2970"]}, {"id": "P2990", "text": ["8.  When C1 charges above 2/3 Vcc, the output goes low and Pin        7 is grounded. C1 discharges to 0 volts.", "8. When C1 charges above 2/3 Vcc, the output goes low and Pin 7 is grounded. C1 discharges to 0 volts.", "LOW Out . . . . . . . . . . Pin 7 GNDnnH"], "jumps": ["P2994", "P2970"]}, {"id": "P2994", "text": ["9.  The circuit remains in this state until another low trigger input        is received.", "9. The circuit remains in this state until another low trigger input is received.", "LOW Out . . . . . . . . . . Pin 7 GNDnnH"], "jumps": ["P2999", "P2970"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.nu."], "jumps": ["P2001", "P2970"]}, {"id": "P3001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P3020", "text": ["This experiment demonstrates the operation of a 555 timer in the astable and monostable modes. You will measure the output signal to verify correct circuit operation for various external component selections."], "jumps": ["P3030", "P3001"]}, {"id": "P3030", "text": ["The purpose of the PC130-153 card is to demonstrate the various operation modes of the 555 Timer."], "jumps": ["P3020"]}, {"id": "P3040", "text": ["Locate IC1, on the right hand side of the card. This is the 555 timer IC."], "jumps": ["P3030"]}, {"id": "P3050", "text": ["The test points numbered 1 through 8 correspond to the pins on the IC.", "Pin Out 1 - Ground 5 - Control 2 - Trigger 6- Threshold 3 - Output 7 - Discharge 4 - CLR 8 - Vcc"], "jumps": ["P3030"]}, {"id": "P3060", "text": ["S1 is used to supply signals from an external source. When UP, the signal is applied to PIN 2, the trigger input on the 555. When DOWN, the signal is applied to Pin 5, the control input on the 555."], "jumps": ["P3030", "P3065"]}, {"id": "P3065", "text": ["EXPERIMENT CARD PC130-153 - Place S1 Up and then Down."], "jumps": []}, {"id": "P3070", "text": ["S2 selects between astable (DOWN) and monostable (UP) modes of operation."], "jumps": ["P3060"]}, {"id": "P3080", "text": ["S3 selects RC time constants of either R2 and R3 (10k to 20k) or R4 (100k)."], "jumps": ["P3070"]}, {"id": "P3090", "text": ["S4 selects between C2 (.01 mf) and C3 (1 mf) for changing the RC time constant of the circuit."], "jumps": ["P3070"]}, {"id": "P3100", "text": ["S5, when UP, supplies an external signal to the CLR input, Pin 4 of the 555."], "jumps": ["P3070"]}, {"id": "P3110", "text": ["S6 supplies a triggering voltage from the card to the trigger input in the monostable mode of operation.", "Let's start the experiment by observing the 555 timer in the astable mode of operation."], "jumps": ["P3070"]}, {"id": "P3130", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P3120"]}, {"id": "P3140", "text": ["2.  Set the Voltmeter Switch to Positive. \n3.  Set the Positive Supply Voltage to 5. The Test Console's                  Voltage Meter should indicate 5 volts.", "2. Set the Voltmeter Switch to Positive. 3. Set the Positive Supply Voltage to 5. The Test Console's Voltage Meter should indicate 5 volts."], "jumps": ["P3130"]}, {"id": "P3150", "text": ["4.  Carefully plug PC130-153 into the Test Console PC1 position. 5.  Set PC130-153 Controls as follows:", "4. Carefully plug PC130-153 into the Test Console PC1 position. 5. Set PC130-153 Controls as follows: ON. 9. Set the PC3 Speaker switch to ON.........................................", "S1 - INPUT TRIGGER S2 - ASTABLE (Down) S3 - 20 k (Left) S4 - 0.01 (Left) S5 - OUT (Down)S5 - cc S5 - S5 - - Vcc S5 - 8 - Vcc"], "jumps": ["P3140", "P3155"]}, {"id": "P3155", "text": ["EXPERIMENT CARD PLACEMENT - PC130-153 shown in PC1 position."], "jumps": []}, {"id": "P3160", "text": ["6.  Turn PC1 DC Power switch to ON.", "6. Turn PC1 DC Power switch to ON.ol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P3150", "P3165"]}, {"id": "P3165", "text": ["The circuit setup is as shown.", "PC POWER SWITCHES - Set the PC1 Power switch to ON.", "The circuit setup is as shown.............................."], "jumps": ["P3180", "P3160"]}, {"id": "P3180", "text": ["S3 selects R2 and R3 which is variable from 10k to 20k. This resistance is connected to R5."], "jumps": ["P3190", "P3170"]}, {"id": "P3190", "text": ["The Discharge pin is connected between R2, R3, and R5."], "jumps": ["P3200", "P3170"]}, {"id": "P3200", "text": ["Notice S2 connects Pin 2 and Pin 6, the Threshold and Trigger inputs."], "jumps": ["P3210", "P3170"]}, {"id": "P3210", "text": ["S4 selects the 0.01 mF capacitor and connects to Pins 2 and 6."], "jumps": ["P3220", "P3170"]}, {"id": "P3220", "text": ["Pins 1 and 5 are grounded, pin 5 through a capacitor. Pins 4 and 8 are connected to Vcc.", "Pins 1 and 5 are grounded, pin 5 through a capacitor. Pins 4 and 8 are connected to Vcc..."], "jumps": ["P3230", "P3170"]}, {"id": "P3230", "text": ["Resistors R6 and R7 ensure proper circuit operation."], "jumps": ["P3250", "P3170"]}, {"id": "P3250", "text": ["1.  Connect channel 1 of the oscilloscope to TP3, the output of            the 555.", "1. Connect channel 1 of the oscilloscope to TP3, the output of the 555."], "jumps": ["P3260", "P3170", "P3255"]}, {"id": "P3255", "text": ["EXPERIMENT CARD PC130-153 - Connect CH1 oscilloscope probe to TP3."], "jumps": []}, {"id": "P3260", "text": ["You should be viewing a rectangular wave, it is high longer than it is low. The 555 is operating in the astable mode which means as long as power is applied to the circuit, the output is a constant wave.", "You should be viewing a rectangular wave, it is high longer than it is low. The 555 is operating in the astable mode which means as long as power is applied to the circuit, the output is a constant wave..."], "jumps": ["P3270", "P3250"]}, {"id": "P3270", "text": ["2.  Vary R3 CW and CCW. Did the frequency of the square wave         output change?", "2. Vary R3 CW and CCW. Did the frequency of the square wave output change??"], "jumps": ["P3260", "P3275"]}, {"id": "P3271", "text": [], "jumps": []}, {"id": "P3272", "text": ["The frequency should have changed. Varying R3 changes the RC time constant of the circuit. If the frequency did not change, see your instructor for assistance."], "jumps": []}, {"id": "P3275", "text": ["EXPERIMENT CARD PC130-153 - Vary R3 CW and CCW."], "jumps": []}, {"id": "P3280", "text": ["3.  Place PC130-153 S3 to the 100k position and observe the               output of the 555.   \n4.  Place PC130-153 S4 to the 1.0 position and observe the                   output of the 555.", "3. Place PC130-153 S3 to the 100k position and observe the output of the 555. 4. Place PC130-153 S4 to the 1.0 position and observe the output of the 555...."], "jumps": ["P3290", "P3270", "P3285"]}, {"id": "P3285", "text": ["EXPERIMENT CARD PC130-153 - Set S3 to 100k Set S4 to 1.0"], "jumps": []}, {"id": "P3290", "text": ["You should have seen that as the RC time constant increased (TC = RC), the frequency of the rectangular wave decreased\n(\u0083 = 1/t).", "You should have seen that as the RC time constant increased (TC = RC), the frequency of the rectangular wave decreased ("], "jumps": ["P3300", "P3280"]}, {"id": "P3300", "text": ["5.  Set S3 to 20k and adjust R3 fully CCW (10k). \n6.  Set S4 to .01. You have set in the shortest time constant which       sets the highest frequency of the 555.", "5. Set S3 to 20k and adjust R3 fully CCW (10k). 6. Set S4 to .01. You have set in the shortest time constant which sets the highest frequency of the 555."], "jumps": ["P3310", "P3290", "P3305"]}, {"id": "P3305", "text": ["EXPERIMENT CARD PC130-153 - Set S3 to 20k Adjust R3 fully CCW Set S4 .01"], "jumps": []}, {"id": "P3310", "text": ["7.  Set CH2 AC/DC/GND switch to GND and center the trace on           the 0 volt reference line. Set the Trigger Coupling to DC. \n8.  Connect CH2 to TP2 or TP6 (Threshold or Trigger) of the 555.        Compare the waveforms of CH1 and CH2.", "7. Set CH2 AC/DC/GND switch to GND and center the trace on the 0 volt reference line. Set the Trigger Coupling to DC. 8. Connect CH2 to TP2 or TP6 (Threshold or Trigger) of the 555. Compare the waveforms of CH1 and CH2..."], "jumps": ["P3320", "P3300", "P3315"]}, {"id": "P3315", "text": ["CH2 displays the charging and discharging of C2.", "EXPERIMENT CARD PC130-153 - Connect CH2 oscilloscope probe to TP2 or TP6.", "CH2 displays the charging and discharging of C2............"], "jumps": ["P3330", "P3310"]}, {"id": "P3330", "text": ["When the charge of C2 is 1/3 Vcc, the Trigger input causes the output of the 555 to go high and removes the ground from Pin 7, allowing C2 to charge. Notice the increase in the CH2 voltage trace.", "When the charge of C2 is 1/3 Vcc, the Trigger input causes the output of the 555 to go high and removes the ground from Pin 7, allowing C2 to charge. Notice the increase in the CH2 voltage trace..."], "jumps": ["P3340", "P3320"]}, {"id": "P3340", "text": ["When the charge of C2 is 2/3 Vcc, the Threshold input causes the output of the 555 to go low and places a ground on Pin 7 that discharges C2. A decrease in the CH2 voltage trace."], "jumps": ["P3350", "P3330"]}, {"id": "P3350", "text": ["What is the lowest voltage level of CH2 (555 input) when CH1 (output) is High?", "What is the lowest voltage level of CH2 (555 input) when CH1 (output) is High?? variable.able.le."], "jumps": ["P3340", "P3352"]}, {"id": "P3351", "text": [], "jumps": []}, {"id": "P3352", "text": ["You did not type in the correct voltage. Ensure that you are measuring the voltage on CH2 correctly. The waveform will be riding on a DC level, the lowest point is the voltage that causes a high output."], "jumps": []}, {"id": "P3357", "text": ["You still did not type in the correct voltage. You should have measured around 1.7 volts or 1/3 of the 5 volt Vcc."], "jumps": ["P3350"]}, {"id": "P3360", "text": ["Notice the voltage of C2 (CH2) is approximately 1/3 of Vcc (5 V) when the 555 output goes HIGH."], "jumps": ["P3370", "P3350"]}, {"id": "P3370", "text": ["What is the voltage of C2 (CH2) (555 input) when CH1 (555 output) is LOW?", "What is the voltage of C2 (CH2) (555 input) when CH1 (555 output) is LOW?) in a variable.able.le."], "jumps": ["P3360", "P3372"]}, {"id": "P3371", "text": [], "jumps": []}, {"id": "P3372", "text": ["You did not type in the correct voltage. Ensure that you are measuring the voltage on CH2 correctly."], "jumps": []}, {"id": "P3377", "text": ["You still did not type in the correct voltage. You should have measured around 3.3 volts or 2/3 of the 5 Vcc."], "jumps": ["P3370"]}, {"id": "P3380", "text": ["Notice the voltage of C2 (CH2) is approximately 2/3 of Vcc (5V) when the 555 output goes LOW."], "jumps": ["P3390", "P3370"]}, {"id": "P3390", "text": ["You have seen the operation of the 555 in the astable mode, now", "Input Output 1/3 Vcc High 2/3 Vcc Loww"], "jumps": ["P3400", "P3380"]}, {"id": "P3400", "text": ["1.  Place PC130-153 S2 to MONOSTABLE, up.", "1. Place PC130-153 S2 to MONOSTABLE, up..................."], "jumps": ["P3410", "P3390", "P3405"]}, {"id": "P3405", "text": ["EXPERIMENT CARD PC130-153 - Set S2 to monostable.", "This is the circuit setup.", "This is the circuit setup.re..............................."], "jumps": ["P3420", "P3400"]}, {"id": "P3420", "text": ["S3 and S4 still select the RC time constant for the circuit."], "jumps": ["P3430", "P3410"]}, {"id": "P3430", "text": ["Note S2 now connects Pin 7 (Discharge) to the input Pin 6 (Threshold)."], "jumps": ["P3440", "P3410"]}, {"id": "P3440", "text": ["The Trigger input is now from S6 and C1. R8 supplies a normal high input."], "jumps": ["P3450", "P3410"]}, {"id": "P3450", "text": ["When S6 is depressed, a ground or low is placed on R1 and R8 which causes a low on the trigger input to the 555, Pin 2."], "jumps": ["P3460", "P3410"]}, {"id": "P3460", "text": ["C1 couples the change in voltage to the 555."], "jumps": ["P3480", "P3410"]}, {"id": "P3480", "text": ["1.  Ensure CH1 of the oscilloscope is still connected to TP3, the         output of the 555. \n2.  Remove CH2 from TP2 or TP6.", "1. Ensure CH1 of the oscilloscope is still connected to TP3, the output of the 555. 2. Remove CH2 from TP2 or TP6."], "jumps": ["P3490", "P3410", "P3485"]}, {"id": "P3485", "text": ["EXPERIMENT CARD PC130-153 - Ensure CH1 oscilloscope probe is connected to TP3. Remove CH2 oscilloscope probe from TP2 or TP6."], "jumps": []}, {"id": "P3490", "text": ["You should be viewing a constant low output of the 555. The 555 is operating in the monostable mode which means the output is low until an external trigger pulse is received."], "jumps": ["P3500", "P3480"]}, {"id": "P3500", "text": ["3.", "3. Press and release S6 on PC130-153. Did the output go high and then return to low?", "3. Press and release S6 on PC130-153 several times watching the CH1 display closely. Did the output spike HIGH momentarily?"], "jumps": ["P3490", "P3505"]}, {"id": "P3501", "text": [], "jumps": []}, {"id": "P3502", "text": ["Set the oscilloscope Time/Div control to 4 or 5 msec.  The ouput pulse is very short in duration.  Look again while pressing S6 several times.  A positive-going spike occurs with each press of S6 but is difficult to view.", "Set the oscilloscope Time/Div control to 4 or 5 msec. The ouput pulse is very short in duration. Look again while pressing S6 several times. A positive-going spike occurs with each press of S6 but is difficult to view.."], "jumps": []}, {"id": "P3505", "text": ["4.  Ensure that S3 is set to 20k and that R3 is fully CW (20k\n     position). \n5.  Ensure that S4 is set to 0.01 position.", "EXPERIMENT CARD PC130-153 - Press and release S6", "4. Ensure that S3 is set to 20k and that R3 is fully CW (20k position). 5. Ensure that S4 is set to 0.01 position............"], "jumps": ["P3520", "P3500", "P3515"]}, {"id": "P3515", "text": ["EXPERIMENT CARD PC130-153 - Set S3 to 20k Set R3 fully CW Set S4 to 0.01"], "jumps": []}, {"id": "P3520", "text": ["6.  Press and release S6 a few times and notice on the                           oscilloscope how long the 555 output stayed high.", "6. Press and release S6 a few times and notice on the oscilloscope how long the 555 output stayed high."], "jumps": ["P3530", "P3510", "P3525"]}, {"id": "P3525", "text": ["7.  Place S3 on PC130-153 to 100k.   \n8.  Place S4 on PC130-153 to 1.0. You have now increased the            RC time constant of the circuit.", "EXPERIMENT CARD PC130-153 - Press and release S6", "7. Place S3 on PC130-153 to 100k. 8. Place S4 on PC130-153 to 1.0. You have now increased the RC time constant of the circuit.."], "jumps": ["P3540", "P3520", "P3535"]}, {"id": "P3535", "text": ["EXPERIMENT CARD PC130-153 - Set S3 to 100k Set S4 to 1.0"], "jumps": []}, {"id": "P3540", "text": ["9.  Press and release PC130-153 S6 a few times. Observe the               length of  time the output stayed high. Was the 555 output               high for a longer or shorter length of time?", "9. Press and release PC130-153 S6 a few times. Observe the length of time the output stayed high. Was the 555 output high for a longer or shorter length of time?"], "jumps": ["P3530", "P3545"]}, {"id": "P3541", "text": [], "jumps": []}, {"id": "P3542", "text": ["With an increase in the RC time constant, the output of the 555 should have stayed HIGH longer. Check the time using the oscilloscope."], "jumps": []}, {"id": "P3545", "text": ["EXPERIMENT CARD PC130-153 - Press and release S6"], "jumps": []}, {"id": "P3550", "text": ["10.  Connect CH2 of the oscilloscope, set the coupling of CH2 to          DC and connect it to TP6.", "10. Connect CH2 of the oscilloscope, set the coupling of CH2 to DC and connect it to TP6."], "jumps": ["P3560", "P3540", "P3555"]}, {"id": "P3555", "text": ["EXPERIMENT CARD PC130-153 - Connect CH2 oscilloscope probe to TP6"], "jumps": []}, {"id": "P3560", "text": ["With no low Trigger input, the output of the 555 (on CH1) is low which places a ground on Pin 7. The ground on Pin 7 keeps the voltage across C2 (CH2) at 0 volts."], "jumps": ["P3570", "P3550", "P3565"]}, {"id": "P3570", "text": ["11.  Press and release PC130-153 S6 and observe the CH1 and            CH2 waveforms. You may have to press and release S6                   several times to see the complete voltages on CH1 and CH2.", "11. Press and release PC130-153 S6 and observe the CH1 and CH2 waveforms. You may have to press and release S6 several times to see the complete voltages on CH1 and CH2."], "jumps": ["P3580", "P3560", "P3575"]}, {"id": "P3575", "text": ["You should have seen that when S6 is depressed, the output of the 555 was high (CH1) and C2 began to charge (CH2).", "EXPERIMENT CARD PC130-153 - Press and release S6"], "jumps": ["P3590", "P3570"]}, {"id": "P3590", "text": ["The voltage across C2 (CH2) reached 2/3 Vcc, the Threshold caused the output to go low and grounded Pin 7."], "jumps": ["P3600", "P3580"]}, {"id": "P3600", "text": ["C2 discharged to 0 volts (CH2) and the output stayed low (CH1)."], "jumps": ["P3610", "P3580"]}, {"id": "P3610", "text": ["Notice how one IC chip can be used as two different circuits with minor changes to external circuitry."], "jumps": ["P3620", "P3580"]}, {"id": "P3620", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": ["P3610"]}, {"id": "P3630", "text": ["2.  Set the Test Console Power to OFF.", "2. Set the Test Console Power to OFF.F...................."], "jumps": ["P3620"]}, {"id": "P3640", "text": ["3.  Disconnect all test equipment.  \n4.  Carefully remove PC130-153 card.\n5.  Return all equipment to its proper storage area.", "3. Disconnect all test equipment. 4. Carefully remove PC130-153 card. 5. Return all equipment to its proper storage area."], "jumps": ["P3910", "P3630"]}, {"id": "P3910", "text": ["This completes the experiment on 555 TIMER OPERATION.", "This completes the experiment on 555 TIMER OPERATION......."], "jumps": ["P3001", "P3640"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["The purpose of a 555 circuit is _______n the brown dog chased him over the fence? X XXXX", "a digital timing circuit.and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text 555. When DOWN, the signal is applied to Pin 5, the control input on the 555."], "jumps": ["P13070", "P13030", "P13065"]}, {"id": "P13065", "text": ["EXPERIMENT CARD PC130-153 - Place S1 Up and then Down."], "jumps": []}, {"id": "P13070", "text": ["S2 selects between astable (DOWN) and monostable (UP) modes of operation."], "jumps": ["P13060"]}, {"id": "P13080", "text": ["S3 selects RC time constants of either R2 and R3 (10k to 20k) or R4 (100k)."], "jumps": ["P13090", "P13070"]}, {"id": "P13090", "text": ["S4 selects between C2 (.01 mf) and C3 (1 mf) for changing the RC time constant of the circuit."], "jumps": ["P13100", "P13070"]}, {"id": "P13100", "text": ["S5, when UP, supplies an external signal to the CLR input, Pin 4 of the 555."], "jumps": ["P13110", "P13070"]}, {"id": "P13110", "text": ["S6 supplies a triggering voltage from the card to the trigger input in the monostable mode of operation.", "Let's start the experiment by observing the 555 timer in the astable mode of operation."], "jumps": ["P13120", "P13070", "P13130"]}, {"id": "P13130", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13120"]}, {"id": "P13140", "text": ["2.  Press Enter to Set: Positive Supply Voltage - 5", "2. Press Enter to Set: Positive Supply Voltage - 5........................"], "jumps": []}, {"id": "P13150", "text": ["3.  Carefully plug PC130-153 into the Test Console PC1 position. 4.  Set PC130-153 Controls as follows:", "3. Carefully plug PC130-153 into the Test Console PC1 position. 4. Set PC130-153 Controls as follows:", "S1 - INPUT TRIGGER S2 - ASTABLE (Down) S3 - 20 k (Left) S4 - 0.01 (Left) S5 - OUT (Down)S5 - cc S5 - S5 - - Vcc S5 - 8 - Vcc"], "jumps": ["P13160", "P13155"]}, {"id": "P13155", "text": ["EXPERIMENT CARD PLACEMENT - PC130-153 shown in PC1 position."], "jumps": []}, {"id": "P13160", "text": ["5.  Press Enter to Set: PC1 DC Power Switch - ON", "The circuit setup is as shown.", "5. Press Enter to Set: PC1 DC Power Switch - ON...........................", "The circuit setup is as shown.............................."], "jumps": ["P13150", "P13180"]}, {"id": "P13180", "text": ["S3 selects R2 and R3 which is variable from 10k to 20k. This resistance is connected to R5."], "jumps": ["P13190", "P13170"]}, {"id": "P13190", "text": ["The Discharge pin is connected between R2, R3, and R5."], "jumps": ["P13200", "P13170"]}, {"id": "P13200", "text": ["Notice S2 connects Pin 2 and Pin 6, the Threshold and Trigger inputs."], "jumps": ["P13210", "P13170"]}, {"id": "P13210", "text": ["S4 selects the 0.01 mF capacitor and connects to Pins 2 and 6."], "jumps": ["P13220", "P13170"]}, {"id": "P13220", "text": ["Pins 1 and 5 are grounded, pin 5 through a capacitor. Pins 4 and 8 are connected to Vcc.", "Pins 1 and 5 are grounded, pin 5 through a capacitor. Pins 4 and 8 are connected to Vcc..."], "jumps": ["P13230", "P13170"]}, {"id": "P13230", "text": ["Resistors R6 and R7 ensure proper circuit operation."], "jumps": ["P13250", "P13170"]}, {"id": "P13250", "text": ["1.  Connect channel 1 of the oscilloscope to TP3, the output of            the 555.", "1. Connect channel 1 of the oscilloscope to TP3, the output of the 555."], "jumps": ["P13260", "P13170", "P13255"]}, {"id": "P13255", "text": ["EXPERIMENT CARD PC130-153 - Connect CH1 oscilloscope probe to TP3."], "jumps": []}, {"id": "P13260", "text": ["You should be viewing a rectangular wave, it is high longer than it is low. The 555 is operating in the astable mode which means as long as power is applied to the circuit, the output is a constant wave.", "You should be viewing a rectangular wave, it is high longer than it is low. The 555 is operating in the astable mode which means as long as power is applied to the circuit, the output is a constant wave..."], "jumps": ["P13270", "P13250"]}, {"id": "P13270", "text": ["2.  Vary R3 CW and CCW. Did the frequency of the square wave         output change?", "2. Vary R3 CW and CCW. Did the frequency of the square wave output change?"], "jumps": ["P13260", "P13275"]}, {"id": "P13271", "text": [], "jumps": []}, {"id": "P13272", "text": ["The frequency should have changed. Varying R3 changes the RC time constant of the circuit. If the frequency did not change, see your instructor for assistance."], "jumps": []}, {"id": "P13275", "text": ["EXPERIMENT CARD PC130-153 - Vary R3 CW and CCW."], "jumps": []}, {"id": "P13280", "text": ["3.  Place PC130-153 S3 to the 100k position and observe the               output of the 555.  \n4.  Place PC130-153 S4 to the 1.0 position and observe the                   output of  the 555.", "3. Place PC130-153 S3 to the 100k position and observe the output of the 555. 4. Place PC130-153 S4 to the 1.0 position and observe the output of the 555...."], "jumps": ["P13290", "P13270", "P13285"]}, {"id": "P13285", "text": ["EXPERIMENT CARD PC130-153 - Set S3 to 100k Set S4 to 1.0"], "jumps": []}, {"id": "P13290", "text": ["You should have seen that as the RC time constant increased (TC = RC), the frequency of the rectangular wave decreased \n(\u0083 = 1/t).", "You should have seen that as the RC time constant increased (TC = RC), the frequency of the rectangular wave decreased ("], "jumps": ["P13300", "P13280"]}, {"id": "P13300", "text": ["5.  Set S3 to 20k and adjust R3 fully CCW (10k).  \n6.  Set S4 to .01. You have set in the shortest time constant which      sets the highest frequency of the 555.", "5. Set S3 to 20k and adjust R3 fully CCW (10k). 6. Set S4 to .01. You have set in the shortest time constant which sets the highest frequency of the 555."], "jumps": ["P13310", "P13290", "P13305"]}, {"id": "P13305", "text": ["EXPERIMENT CARD PC130-153 - Set S3 to 20k Adjust R3 fully CCW Set S4 .01"], "jumps": []}, {"id": "P13310", "text": ["7.  Set CH2 AC/DC/GND switch to GND and center the trace on            the 0 volt reference line. Set the Trigger Coupling to DC.  \n8.  Connect CH2 to TP2 or TP6 (Threshold or Trigger) of the 555.        Compare the waveforms of CH1 and CH2.", "7. Set CH2 AC/DC/GND switch to GND and center the trace on the 0 volt reference line. Set the Trigger Coupling to DC. 8. Connect CH2 to TP2 or TP6 (Threshold or Trigger) of the 555. Compare the waveforms of CH1 and CH2."], "jumps": ["P13320", "P13300", "P13315"]}, {"id": "P13315", "text": ["CH2 displays the charging and discharging of C2.", "EXPERIMENT CARD PC130-153 - Connect CH2 oscilloscope probe to TP2 or TP6.", "CH2 displays the charging and discharging of C2............"], "jumps": ["P13330", "P13310"]}, {"id": "P13330", "text": ["When the charge of C2 is 1/3 Vcc, the Trigger input causes the output of the 555 to go high and removes the ground from Pin 7, allowing C2 to charge. Notice the increase in the CH2 voltage trace.", "When the charge of C2 is 1/3 Vcc, the Trigger input causes the output of the 555 to go high and removes the ground from Pin 7, allowing C2 to charge. Notice the increase in the CH2 voltage trace..."], "jumps": ["P13340", "P13320"]}, {"id": "P13340", "text": ["When the charge of C2 is 2/3 Vcc, the Threshold input causes the output of the 555 to go low and places a ground on Pin 7 that discharges C2. A decrease in the CH2 voltage trace."], "jumps": ["P13350", "P13330"]}, {"id": "P13350", "text": ["What is the lowest voltage level of CH2 (555 input) when CH1 (output) is High?", "What is the lowest voltage level of CH2 (555 input) when CH1 (output) is High?? variable.able.le."], "jumps": ["P13340", "P13352"]}, {"id": "P13351", "text": [], "jumps": []}, {"id": "P13352", "text": ["You did not type in the correct voltage. Ensure that you are measuring the voltage on CH2 correctly. The waveform will be riding on a DC level, the lowest point is the voltage that causes a high output."], "jumps": []}, {"id": "P13357", "text": ["You still did not type in the correct voltage. You should have measured around 1.7 volts or 1/3 of the 5 volt Vcc."], "jumps": ["P13350"]}, {"id": "P13360", "text": ["Notice the voltage of C2 (CH2) is approximately 1/3 of Vcc (5 V) when the 555 output goes HIGH."], "jumps": ["P13370", "P13350"]}, {"id": "P13370", "text": ["What is the voltage of C2 (CH2) (555 input) when CH1 (555 output) is LOW?", "What is the voltage of C2 (CH2) (555 input) when CH1 (555 output) is LOW?) in a variable.able.le."], "jumps": ["P13360", "P13372"]}, {"id": "P13371", "text": [], "jumps": []}, {"id": "P13372", "text": ["You did not type in the correct voltage. Ensure that you are measuring the voltage on CH2 correctly."], "jumps": []}, {"id": "P13377", "text": ["You still did not type in the correct voltage. You should have measured around 3.3 volts or 2/3 of the 5 Vcc."], "jumps": ["P13370"]}, {"id": "P13380", "text": ["Notice the voltage of C2 (CH2) is approximately 2/3 of Vcc (5V) when the 555 output goes LOW."], "jumps": ["P13390", "P13370"]}, {"id": "P13390", "text": ["You have seen the operation of the 555 in the astable mode, now let's look at the operation in the monostable mode.", "Input Output 1/3 Vcc High 2/3 Vcc Loww"], "jumps": ["P13400", "P13380"]}, {"id": "P13400", "text": ["1.  Place PC130-153 S2 to MONOSTABLE, up.", "1. Place PC130-153 S2 to MONOSTABLE, up..................."], "jumps": ["P13410", "P13390", "P13405"]}, {"id": "P13405", "text": ["This is the circuit setup.", "EXPERIMENT CARD PC130-153 - Set S2 to monostable.", "This is the circuit setup.re..............................."], "jumps": ["P13420", "P13400"]}, {"id": "P13420", "text": ["S3 and S4 still select the RC time constant for the circuit."], "jumps": ["P13430", "P13410"]}, {"id": "P13430", "text": ["Note S2 now connects Pin 7 (Discharge) to the input Pin 6 (Threshold)."], "jumps": ["P13440", "P13410"]}, {"id": "P13440", "text": ["The Trigger input is now from S6 and C1. R8 supplies a normal high input."], "jumps": ["P13450", "P13410"]}, {"id": "P13450", "text": ["When S6 is depressed, a ground or low is placed on R1 and R8 which causes a low on the trigger input to the 555, Pin 2."], "jumps": ["P13460", "P13410"]}, {"id": "P13460", "text": ["C1 couples the change in voltage to the 555."], "jumps": ["P13480", "P13410"]}, {"id": "P13480", "text": ["1.  Ensure CH1 of the oscilloscope is still connected to TP3, the         output of the 555. \n2.  Remove CH2 from TP2 or TP6.", "1. Ensure CH1 of the oscilloscope is still connected to TP3, the output of the 555. 2. Remove CH2 from TP2 or TP6."], "jumps": ["P13490", "P13410", "P13485"]}, {"id": "P13485", "text": ["EXPERIMENT CARD PC130-153 - Ensure CH1 oscilloscope probe is connected to TP3. Remove CH2 oscilloscope probe from TP2 or TP6."], "jumps": []}, {"id": "P13490", "text": ["You should be viewing a constant low output of the 555. The 555 is operating in the monostable mode which means the output is low until an external trigger pulse is received."], "jumps": ["P13500", "P13480"]}, {"id": "P13500", "text": ["3.  Press and release S6 on PC130-153 several times watching the CH1 display closely.  Did the output spike HIGH momentarily", "3. Press and release S6 on PC130-153 several times watching the CH1 display closely. Did the output spike HIGH momentarily", "3. Press and release S6 on PC130-153 several times watching the CH1 display closely. Did the output spike HIGH momentarily??"], "jumps": ["P13490", "P13505"]}, {"id": "P13501", "text": [], "jumps": []}, {"id": "P13502", "text": ["Set the oscilloscope Time/Div control to 4 or 5 msec.  The ouput pulse is very short in duration.  Look again while pressing S6 several times.  A positive-going spike occurs with each press of S6 but is difficult to view.", "Set the oscilloscope Time/Div control to 4 or 5 msec. The ouput pulse is very short in duration. Look again while pressing S6 several times. A positive-going spike occurs with each press of S6 but is difficult to view..."], "jumps": []}, {"id": "P13505", "text": ["EXPERIMENT CARD PC130-153 - Press and release S6", "4.  Ensure that S3 is set to 20k and that R3 is fully CW (20k              \n     position). \n5.  Ensure that S4 is set to 0.01 position.", "4. Ensure that S3 is set to 20k and that R3 is fully CW (20k position). 5. Ensure that S4 is set to 0.01 position."], "jumps": ["P13520", "P13500", "P13515"]}, {"id": "P13515", "text": ["EXPERIMENT CARD PC130-153 - Set S3 to 20k Set R3 fully CW Set S4 to 0.01"], "jumps": []}, {"id": "P13520", "text": ["6.  Press and release S6 a few times and notice on the                           oscilloscope how long the 555 output stayed high.", "6. Press and release S6 a few times and notice on the oscilloscope how long the 555 output stayed high."], "jumps": ["P13530", "P13510", "P13525"]}, {"id": "P13525", "text": ["7.  Place S3 on PC130-153 to 100k.\n8.  Place S4 on PC130-153 to 1.0. You have now increased the            RC time constant of the circuit.", "EXPERIMENT CARD PC130-153 - Press and release S6", "7. Place S3 on PC130-153 to 100k. 8. Place S4 on PC130-153 to 1.0. You have now increased the RC time constant of the circuit.."], "jumps": ["P13540", "P13520", "P13535"]}, {"id": "P13535", "text": ["EXPERIMENT CARD PC130-153 - Set S3 to 100k Set S4 to 1.0"], "jumps": []}, {"id": "P13540", "text": ["9.  Press and release PC130-153 S6 a few times. Observe the               length of  time the output stayed high. Was the 555 output               high for a longer or shorter length of time?", "9. Press and release PC130-153 S6 a few times. Observe the length of time the output stayed high. Was the 555 output high for a longer or shorter length of time?"], "jumps": ["P13530", "P13545"]}, {"id": "P13541", "text": [], "jumps": []}, {"id": "P13542", "text": ["With an increase in the RC time constant, the output of the 555 should have stayed HIGH longer. Check the time using the oscilloscope."], "jumps": []}, {"id": "P13545", "text": ["EXPERIMENT CARD PC130-153 - Press and release S6"], "jumps": []}, {"id": "P13550", "text": ["10.  Connect CH2 of the oscilloscope, set the coupling of CH2 to          DC and connect it to TP6.", "10. Connect CH2 of the oscilloscope, set the coupling of CH2 to DC and connect it to TP6."], "jumps": ["P13560", "P13540", "P13555"]}, {"id": "P13555", "text": ["EXPERIMENT CARD PC130-153 - Connect CH2 oscilloscope probe to TP6"], "jumps": []}, {"id": "P13560", "text": ["With no low Trigger input, the output of the 555 (on CH1) is low which places a ground on Pin 7. The ground on Pin 7 keeps the voltage across C2 (CH2) at 0 volts."], "jumps": ["P13570", "P13550", "P13565"]}, {"id": "P13570", "text": ["11.  Press and release PC130-153 S6 and observe the CH1 and            CH2 waveforms. You may have to press and release S6                   several times to see the complete voltages on CH1 and CH2.", "11. Press and release PC130-153 S6 and observe the CH1 and CH2 waveforms. You may have to press and release S6 several times to see the complete voltages on CH1 and CH2."], "jumps": ["P13580", "P13560", "P13575"]}, {"id": "P13575", "text": ["You should have seen that when S6 is depressed, the output of the 555 was high (CH1) and C2 began to charge (CH2).", "EXPERIMENT CARD PC130-153 - Press and release S6"], "jumps": ["P13590", "P13570"]}, {"id": "P13590", "text": ["The voltage across C2 (CH2) reached 2/3 Vcc, the Threshold caused the output to go low and grounded Pin 7."], "jumps": ["P13600", "P13580"]}, {"id": "P13600", "text": ["C2 discharged to 0 volts (CH2) and the output stayed low (CH1)."], "jumps": ["P13610", "P13580"]}, {"id": "P13610", "text": ["Notice how one IC chip can be used as two different circuits with minor changes to external circuitry."], "jumps": ["P13580"]}, {"id": "P13630", "text": ["1.  Set the Test Console Power to OFF.", "1. Set the Test Console Power to OFF.F.FF................................."], "jumps": []}, {"id": "P13640", "text": ["2.  Disconnect all test equipment. \n3.  Carefully remove PC130-153 card.\n4.  Return all equipment to its proper storage area.", " let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
