const book = {"title": "9395N101", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: INTRODUCTION TO PROGRAMMABLE LOGIC CONTROLLERSdf"], "jumps": []}, {"id": "P10", "text": ["INTRODUCTION TO PROGRAMMABLE LOGIC CONTROLLERS"], "jumps": []}, {"id": "P100", "text": ["w Recognize a basic PLC block diagram. w Identify basic PLC functions. w Identify PLC principles of operation.", "w Recognize and understand a simple ladder logic diagram. w Recognize the symbols used in a basic ladder logic diagram........", "w Use the PLC trainer to control LEDs. w Use the PLC trainer to control the motor. w Understand how the PLC's operation changes by changing the ladder logic programs."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P310", "text": [], "jumps": []}, {"id": "P330", "text": ["Programmable Logic Controllers represent one of the fastest growing areas in the automation required industries of today.", "Recent advances in the automation of industrial processes has rendered most older, less versatile systems obsolete.ods PLC", "The PLC provides versatility and speed without the cost and size of older systems. Old Methods New Methods PLC", "We will take a look at how the PLC functions, and its current usage."], "jumps": ["P410", "P300", "P420", "P400", "P430", "P440"]}, {"id": "P440", "text": ["Let's begin the lesson on INTRODUCTION TO PROGRAMMABLE LOGIC CONTROLLERS...."], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1015", "text": ["A programmable logic controller (PLC) is a device that replaces the control logic used in systems or processes. 28 Volts Motor S1 K1"], "jumps": ["P1020", "P1001", "PLC"]}, {"id": "P1020", "text": ["The same system or process that would require a great number of electromechanical relays is now performed by a more compact and versatile PLC."], "jumps": ["P1025", "P1015"]}, {"id": "P1025", "text": ["PLC's do contain relays, but the PLC can easily be modified by programming instead of rewiring the internal circuitry and components.."], "jumps": ["P1030", "P1015"]}, {"id": "P1030", "text": ["In order to fully understand how the PLC controls a system or process, we need to look closer at its functions."], "jumps": ["P1040", "P1015"]}, {"id": "P1040", "text": ["A PLC has two basic sections: 1. Input/Output Sections 2. Central Processing Unit Input Central Output Section Processing Section Unit"], "jumps": ["P1042", "P1015"]}, {"id": "P1042", "text": ["The input/output (I/O) sections route all external signals into the central processing unit and direct signals from the central processing unit to the outside circuitry. Input Output Section Section"], "jumps": ["P1044", "P1040"]}, {"id": "P1044", "text": ["Different types of I/O modules are available such as TTL, relay and analog."], "jumps": ["P1046", "P1040"]}, {"id": "P1046", "text": ["The central processing unit (CPU) analyzes the input signal and assigns an appropriate output. Input Central Output Section Processing Section Unit"], "jumps": ["P1048", "P1040"]}, {"id": "P1048", "text": ["The programming device is added when the PLC requires program modifications. Central Processing Unit Programming Device"], "jumps": ["P1050", "P1040"]}, {"id": "P1050", "text": ["Let's look at how these sections work together to control a system or process. Input Central Output Section Processing Section Unit", "Most systems or processes use a manually activated switch to apply power. This switch is hard-wired to the input section of the PLC. 24V S1 Input Output Section CPU Section PLC"], "jumps": ["P1060", "P1040", "P1070"]}, {"id": "P1065", "text": ["HARD-WIRED - The term hard-wired means that the electronic components are physically connected and wired together."], "jumps": []}, {"id": "P1070", "text": ["All signals must go through the input section in order to reach the CPU. S1 Input Section"], "jumps": ["P1100", "P1060"]}, {"id": "P1100", "text": ["The applied 24 volts is converted to 5 volts inside the input section and sent on to the CPU for processing. 24V 5V CPU"], "jumps": ["P1110", "P1060"]}, {"id": "P1110", "text": ["The 5 volt signal sent to the CPU is converted to a \"1\" and stored in an input specific memory location. 24V 1 Input Section CPU", "This condition (1) tells the CPU that someone has pushed a button and closed the switch. The CPU is now ready to perform the next step in the process. Input Section CPU"], "jumps": ["P1120", "P1060"]}, {"id": "P1130", "text": ["The CPU uses a 1 to pass information about the closed switch to an output specific memory location. 1"], "jumps": ["P1140", "P1060"]}, {"id": "P1140", "text": ["Once the 1 is loaded into the output memory location of the CPU a 5 volt signal is applied to the output section. 5V Output Section"], "jumps": ["P1150", "P1060"]}, {"id": "P1150", "text": ["All output signals from the CPU must pass through the output section before going to the rest of the circuitry."], "jumps": ["P1170", "P1060"]}, {"id": "P1170", "text": ["The output section converts the CPU's 5 volt output to 24 volts before releasing the signal."], "jumps": ["P1180", "P1060"]}, {"id": "P1180", "text": ["The output voltage from the output section is hard-wired to an external light. The output signal illuminates the light."], "jumps": ["P1190", "P1060"]}, {"id": "P1190", "text": ["Which section of the PLC stores information in memory locations?"], "jumps": ["P1060"]}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1192", "text": ["The input section receives signals from external input devices such as a switch. The input section converts information to be compatible with the CPU, but does not store information."], "jumps": []}, {"id": "P1193", "text": ["The output section sends signals to the external circuitry and devices such as motors, lights, etc. The output section converts information received from the CPU, but does not store information."], "jumps": []}, {"id": "P1200", "text": ["Which section is hard-wired to output devices?............."], "jumps": ["P1190"]}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1202", "text": ["The input section is hard-wired to input devices..........."], "jumps": []}, {"id": "P1203", "text": ["The CPU is not physically connected to either input or output devices. The CPU deals with logical representations rather than physical connections."], "jumps": []}, {"id": "P1210", "text": ["Which section is hard-wired to input devices?.............."], "jumps": ["P1200"]}, {"id": "P1211", "text": [], "jumps": []}, {"id": "P1212", "text": ["The output section is hard-wired to output devices........."], "jumps": []}, {"id": "P1213", "text": ["The CPU is not physically connected to either input or output devices. The CPU deals with logical representations rather than physical connections."], "jumps": []}, {"id": "P1220", "text": ["The PLC's biggest advantage over older relay systems is its ability to adapt to changing conditions without extensive modifications. 24V Input Output Section CPU Section PLC"], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["The PLC won't physically change if additional external input and output devices are added. Logic conditions within the PLC's CPU are changed instead. 4V"], "jumps": ["P1910", "P1220"]}, {"id": "P1910", "text": ["This completes the information on INTRODUCTION TO PLC......"], "jumps": ["P1001", "P1220"]}, {"id": "P1920", "text": ["1. A programmable logic controller (PLC) is a compact and versatile device that replaces the control logic used in systems or processes. 28 Volts Motor S11"], "jumps": ["P1930", "P1001", "PLC"]}, {"id": "P1930", "text": ["2. A PLC has two basic sections: 1. Input/Output Sections 2. Central Processing Unit"], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. The programming device is added when the PLC requires program modifications. Programming Device", "4. The PLC can easily be modified by programming instead of rewiring the internal circuitry and components. ut Output Section CPU Section PLC"], "jumps": ["P1950", "P1930", "P1999", "P1940"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1950"]}, {"id": "P2001", "text": ["The PLC understands ladder logic like a computer understands a program."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["If we intend to communicate with the PLC we need to learn the language it understands, like ladder logic."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["Let's start by analyzing a basic ladder logic diagram and the symbols used."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["Ladder logic diagrams use logic symbols to illustrate operations. Motor 1001 0031 S2 Heater 1002 0032 Operational Ladder Logic Diagram Diagram"], "jumps": ["P2052", "P2020"]}, {"id": "P2052", "text": ["Ladder logic diagrams use numbered input and output symbols to represent the devices used, like switches, relays, motors and heaters. Motor 1001 0031 S2 Heater 1002 0032 Ladder Logic Diagrammm"], "jumps": ["P2060", "P2050"]}, {"id": "P2060", "text": ["The diagram shows program statements as horizontal rungs between two vertical rails. Rail Rail Rungs S1 Motor 1001 0031 S2 Heater 1002 0032"], "jumps": ["P2062", "P2050"]}, {"id": "P2062", "text": ["The name \"ladder\" logic comes from the ladder-like appearance of the diagram and the rung/rail terminology."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["Each rung has an input statement and an output statement. ngs Input Output Input Output"], "jumps": ["P2080", "P2050"]}, {"id": "P2080", "text": ["The output statement is executed when the input is true. In this example the motor turns when S1 is closed and the heater operates when S2 is closed. Input Output Input Output Input Output Input Output"], "jumps": ["P2050"]}, {"id": "P2090", "text": ["Here are the input symbols commonly used in ladder logic diagrams.", "Examine If Open (XIO). The contact is normally closed and passes power until activated by an applied condition of 1 (ON). The contact is open (false) when the applied condition is 1, and closed (true) when the applied condition is 0.", "Examine If Closed (XIC). The contact is normally opened and does not pass power until activated by an applied condition of 1 (ON). The contact is closed (true) when the applied condition is 1 and open (false) when the applied condition is 0."], "jumps": ["P2100", "P2050"]}, {"id": "P2100", "text": ["Select the part of this diagram that is called the rung...."], "jumps": ["P2090"]}, {"id": "P2101", "text": [], "jumps": []}, {"id": "P2102", "text": ["You selected a rail, not a rung. Rungs are horizontal....."], "jumps": []}, {"id": "P2110", "text": ["Select the symbol used in a ladder logic diagram..........."], "jumps": ["P2100"]}, {"id": "P2111", "text": [], "jumps": []}, {"id": "P2112", "text": ["You selected a pictorial diagram which is used in operational diagrams or schematics."], "jumps": []}, {"id": "P2120", "text": ["Let's look at a process that contains a few more conditions."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["Notice that there is no current path since all the switches are open. The rung and it's branch are false so, the motor is off."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["One way to start the motor is to close the push button switch, S3/103. The branch is now true and the motor turns."], "jumps": ["P2120"]}, {"id": "P2150", "text": ["The other way to start the motor is to close both S1/101 and S2/102. Rung 1 is now true and the motor turns."], "jumps": ["P2120"]}, {"id": "P2160", "text": ["The motor will not start if only one of the switches in the rung are closed."], "jumps": ["P2180", "P2120"]}, {"id": "P2180", "text": ["Which switch(es) must be closed to make the light illuminate?"], "jumps": ["P2120"]}, {"id": "P2181", "text": [], "jumps": []}, {"id": "P2182", "text": ["Closing only S1 will not provide a complete path for current. S2 must also be closed."], "jumps": []}, {"id": "P2183", "text": ["Closing only S2 will not provide a complete path for current. S1 must also be closed."], "jumps": []}, {"id": "P2184", "text": ["Closing S3 will provide a complete path for current, but the light is not on, or connected to this ladder rung."], "jumps": []}, {"id": "P2190", "text": ["Which input condition(s) must be true to apply power to the output???"], "jumps": ["P2180"]}, {"id": "P2191", "text": [], "jumps": []}, {"id": "P2192", "text": ["Making only 001 true does not apply power to the motor because 002 must also be true to apply power to the output...................................."], "jumps": []}, {"id": "P2193", "text": ["Making 002 true does not apply power to the motor because either 001or 003 must also be true to apply power to the output......................................"], "jumps": []}, {"id": "P2194", "text": ["Closing 001 and 003 will not start the motor since 002 is open.", "Making 002 true does not apply power to the motor because either 001 or 003 must also be true to apply power to the output.........................."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on BASIC LADDER LOGIC.......", "1. The PLC understands ladder logic like a computer understands a program."], "jumps": ["P2001", "P2190", "P2930"]}, {"id": "P2930", "text": ["2. Ladder logic diagrams use numbered input and output symbols to represent the devices used, like switches, relays, motors and heaters."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3. Ladder logic diagrams can illustrate the different pathways available and conditions needed for output execution."], "jumps": ["P2999", "P2930"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2940"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3015", "text": ["In this experiment you will observe a PLC in operation and use it to control LEDs and a motor."], "jumps": ["P3020", "P3001"]}, {"id": "P3020", "text": ["The buttons and LED's on the PC5050-1 card are connected to the PLC inputs and outputs as shown."], "jumps": ["P3030", "P3015"]}, {"id": "P3030", "text": ["When the start button is pressed, rung 1 is true and bit 0 (B0) is latched."], "jumps": ["P3020"]}, {"id": "P3035", "text": ["LATCH INSTRUCTION - The LATCH instruction is used whenever a contact needs to stay open, or closed, even after the initial input is removed. The instruction energized the specified output point and this output remains energized until the UNLATCH instruction is given."], "jumps": []}, {"id": "P3040", "text": ["Since B0 is true, rung 3 is true and the run LED illuminates. Rung 4 remains false since the contact is normally closed."], "jumps": ["P3032"]}, {"id": "P3045", "text": ["NORMALLY CLOSED - A normally closed contact is false (0) when the applied condition is 1.", "Examine If Closed (XIC). The contact is normally open and does not pass power until activated by an applied condition of 1 (ON). The contact is closed (true) when the applied condition is 1 and open (false) when the applied condition is 0.", "Examine If Open (XIO). The contact is normally closed and passes power until activated by an applied condition of 1 (ON). The contact is open (false) when the applied condition is 1 and closed (true) when the applied condition is 0."], "jumps": ["P3042"]}, {"id": "P3050", "text": ["The run LED does not go off when the start button is released because B0 stays latched."], "jumps": ["P3042"]}, {"id": "P3060", "text": ["Pressing the stop button makes rung 2 true which unlatches B0. Since B0 is false, rung 4 is true and the stop LED illuminates."], "jumps": ["P3042"]}, {"id": "P3070", "text": ["The stop LED does not go off when the stop button is released because B0 stays false."], "jumps": ["P3042"]}, {"id": "P3080", "text": ["Now we are ready to use the Nida PLC trainer and PC5050-1 card.d."], "jumps": ["P3042"]}, {"id": "P3100", "text": ["1. Place the PC5050-1 card in the PC1 position............"], "jumps": ["P3042", "P3105"]}, {"id": "P3105", "text": ["PC CARD PLACEMENT - Align the connectors on the PC5050-1 card with pins for the PC1 positions on the Nida Model 5050 PLC trainer. Gently push down on the PC5050-1 card."], "jumps": []}, {"id": "P3110", "text": ["Main Power ON DC Power ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF", "2. Set the PLC Trainer to the initial control settings. in Power ON DC Power ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFF"], "jumps": ["P3100"]}, {"id": "P3115", "text": ["INITIAL CONTROL SETTING - Main Power ON, DC Power ON, Monitor ON, Process Selector OFF, +DC Voltage Select 5V, PC1 & PC2 Power OFF."], "jumps": []}, {"id": "P3120", "text": ["3. Set the PLC Trainer controls as follows: C Voltage Select 24V PC1 Power ON ON....", "+DC Voltage Select 24V PC1 Power ON ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF"], "jumps": ["P3110", "P3125"]}, {"id": "P3125", "text": ["PLC TRAINER CONTROLS - Turn the +DC Voltage Select dial fully CW to the 24V position. Push the PC1 Power switch up to the ON position."], "jumps": []}, {"id": "P3130", "text": ["4. Set the PC5050-1 Process Control Card as follows: wer Switch ON Analog Control Switch ON", "Power Switch ON Analog Control Switch ONNNNNNN Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF"], "jumps": ["P3120", "P3135"]}, {"id": "P3135", "text": ["PC5050-1 SWITCH SETTINGS - Set the Power switch to ON and the Analog Control switch to ON."], "jumps": []}, {"id": "P3140", "text": ["5. Watch the status lights on the PLC trainer and watch the LED's on the PC5050-1 card as you press and release the start button on the PC5050-1 card."], "jumps": ["P3150", "P3130", "P3145"]}, {"id": "P3145", "text": ["PLC TRAINER STATUS LIGHTS - Watch the status lights on the PLC trainer panel as you press and release the start button on the PC5050-1 card."], "jumps": ["P3146"]}, {"id": "P3146", "text": ["PC5050-1 CARD - Watch the run and stop LED's as you press and release the start button."], "jumps": ["P3140", "P3145"]}, {"id": "P3150", "text": ["6. Watch the status lights on the PLC trainer and watch the LED's on the PC5050-1 card as you press and release the stop button on the PC5050-1 card."], "jumps": ["P3160", "P3140", "P3155"]}, {"id": "P3155", "text": ["PLC TRAINER STATUS LIGHTS - Watch the status lights on the PLC trainer panel as you press and release the stop button on the PC5050-1card."], "jumps": ["P3156"]}, {"id": "P3156", "text": ["PC5050-1 CARD - Watch the run and stop LED's as you press and release the stop button.", "Select the rung that is true when B0 is latched............"], "jumps": ["P3150", "P3155"]}, {"id": "P3161", "text": [], "jumps": []}, {"id": "P3162", "text": ["You selected rung 1. Rung 1 latches B0 but is not affected by B0."], "jumps": []}, {"id": "P3163", "text": ["You selected rung 2. Rung 2 unlatches B0 but is not affected by B0."], "jumps": []}, {"id": "P3164", "text": ["You selected rung 4. Rung 4 is true when B0 is unlatched and false when B0 is latched."], "jumps": []}, {"id": "P3165", "text": ["You did not select a rung in the ladder logic diagram......", "The next part of the experiment lets you control the PLC trainer's motor and the PC card's LED's with the start and stop buttons."], "jumps": ["P3310", "P3160"]}, {"id": "P3310", "text": ["Two rungs are added to the ladder logic program to control the motor."], "jumps": ["P3320", "P3300"]}, {"id": "P3320", "text": ["When the start button is closed, B0 is latched making rungs 3 and 5 true. The run LED illuminates and the PLC trainer's motor turns."], "jumps": ["P3330", "P3300"]}, {"id": "P3330", "text": ["The motor continues to turn and the run LED stays lit when the start button is released because B0 stays true."], "jumps": ["P3340", "P3300"]}, {"id": "P3340", "text": ["Pressing the stop button unlatches B0 which makes rungs 4 and 6 true. The stop LED illuminates and the PLC trainer's motor stops turning."], "jumps": ["P3350", "P3300"]}, {"id": "P3350", "text": ["7. Watch the motor on the PLC trainer and watch the LED's on the PC5050-1 card as you press and release the start button on the PC5050-1 card."], "jumps": ["P3360", "P3300", "P3355"]}, {"id": "P3355", "text": ["PLC TRAINER MOTOR - Watch the motor on the PLC trainer panel as you press and release the start button on the PC5050-1 card."], "jumps": ["P3356"]}, {"id": "P3356", "text": ["PC5050-1 CARD - Watch the run and stop LED's as you press and release the start button."], "jumps": ["P3350", "P3355"]}, {"id": "P3360", "text": ["8. Watch the motor on the PLC trainer and watch the LED's on the PC5050-1 card as you press and release the stop button on the PC5050-1 card."], "jumps": ["P3370", "P3350", "P3365"]}, {"id": "P3365", "text": ["PLC TRAINER MOTOR - Watch the motor on the PLC trainer panel as you press and release the stop button on the PC5050-1 card."], "jumps": ["P3366", "P3360"]}, {"id": "P3366", "text": ["PC5050-1 CARD - Watch the run and stop LED's as you press and release the stop button.", "Which rung needs to be true in order to start the motor?..."], "jumps": ["P3360", "P3365"]}, {"id": "P3371", "text": ["The stop LED illuminates when rung 4 is true. the motor does not turn.", "The motor stops turning when rung 6 is true................", "The last part of the experiment uses a timer instruction to delay the start of the motor for 10 seconds."], "jumps": ["P3410", "P3370"]}, {"id": "P3410", "text": ["The timer instruction replaces the old time delay relay used in electromechanical control systems."], "jumps": ["P3420", "P3400"]}, {"id": "P3420", "text": ["Pressing the start button latches B0 making rungs 3 and 5 true. The timer starts since rung 5 is true."], "jumps": ["P3430", "P3400"]}, {"id": "P3430", "text": ["The timer releases a high output to the done bit (DN) after 10 seconds. Since DN is true, rung 6 is true and the motor turns."], "jumps": ["P3440", "P3400"]}, {"id": "P3440", "text": ["Pressing the stop button makes rungs 4 and 7 true which illuminates the stop LED and stops the motor."], "jumps": ["P3450", "P3400"]}, {"id": "P3450", "text": ["9. Use a watch to determine the time lapse between the moment you press and release the start button on the PC5050-1 card to the point when the motor starts."], "jumps": ["P3460", "P3400", "P3455"]}, {"id": "P3455", "text": ["PLC TRAINER MOTOR - Determine the time it takes for the motor to start after you press and release the start button on the PC5050-1 card."], "jumps": ["P3456"]}, {"id": "P3456", "text": ["PC5050-1 CARD - Determine the time it takes for the PLC trainer motor to start after you press and release the start button."], "jumps": ["P3450", "P3455"]}, {"id": "P3460", "text": ["10. Watch the motor on the PLC trainer and watch the LED's on the PC5050-1 card as you press and release the stop button on the PC5050-1 card."], "jumps": ["P3470", "P3450", "P3465"]}, {"id": "P3465", "text": ["PLC TRAINER MOTOR - Watch the motor on the PLC trainer panel as you press and release the stop button on the PC5050-1 card."], "jumps": ["P3466"]}, {"id": "P3466", "text": ["PC5050-1 CARD - Watch the run and stop LED's as you press and release the stop button.", "The done bit (DN) _______is typed.........................."], "jumps": ["P3460", "P3465"]}, {"id": "P3471", "text": ["The done bit (DN) does not start the timer. The timer sends a high output to DN after the specified time has lapsed.", "The done bit (DN) does not illuminate the run LED.........."], "jumps": []}, {"id": "P3475", "text": ["In this experiment you have: * Controlled LED's using a PLC. * Controlled a motor using a PLC. * Changed the PLC's operation by changing the ladder logic program."], "jumps": ["P3480", "P3470"]}, {"id": "P3480", "text": ["11. Return the PLC trainer to the initial control settings. in Power ON DC Power ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFF", "Main Power ON DC Power ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF"], "jumps": ["P3475"]}, {"id": "P3490", "text": ["12. Turn OFF the PLC trainer's main power switch.........."], "jumps": ["P3480"]}, {"id": "P3500", "text": ["13. Return all PC cards and test equipment to their proper storage location."], "jumps": ["P3910", "P3490"]}, {"id": "P3910", "text": ["This completes the experiment on INTRODUCTION TO PLC......."], "jumps": ["P3001", "P3500"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 3, \"P10301\", \"P1 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
