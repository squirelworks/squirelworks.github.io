acts.", "Look closely at the PC130-130X card. The silk screen printing shows you the connections to the power, input, output , and ground contacts."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": [], "jumps": ["P1100", "P1060"]}, {"id": "P1100", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P1060"]}, {"id": "P1110", "text": ["2.  Construct the circuit shown on the PC130-130X card.  Hints            are provided on the next page.", "2. Construct the circuit shown on the PC130-130X card. Hints are provided on the next page."], "jumps": ["P1120", "P1100", "P13115"]}, {"id": "P1115", "text": ["Use the table below to assist you in parts identification.."], "jumps": ["P1121", "P1110"]}, {"id": "P1120", "text": ["A. Construct the modulator circuit on the upper part of the card. The lower part will be used to construct the demodulator circuit. B. Ensure you connect R1 and R2 to the correct vertical columns for Pins D and E. The circuit inputs are applied to these pins."], "jumps": ["P1121", "P1110"]}, {"id": "P1121", "text": ["C.  Use a piece of hookup wire between the cathode of D1 and            the connection of C1 and L1.  You will disconnect the wire to         see the action of the circuit without the tank circuit.", "C. Use a piece of hookup wire between the cathode of D1 and the connection of C1 and L1. You will disconnect the wire to see the action of the circuit without the tank circuit."], "jumps": ["P1122", "P1110"]}, {"id": "P1122", "text": ["3. Carefully plug PC130-322 into the Test Console PC1 position. are provided on the next page....."], "jumps": ["P1110"]}, {"id": "P1123", "text": ["4. Set the Test Console to +15 VDC and PC1 DC Power to On."], "jumps": ["P1122"]}, {"id": "P1124", "text": ["5. Place the oscilloscope probe on the 500 Hz test point. 6. Adjust the Gain potentiometer for maximum (approximately 0.2 Vpp) amplitude j rect value of fo.  You should have calculated 100.5 kHz.", "You have not calculated the correct value of fo. You should have calculated 100.5 kHz."], "jumps": ["P1230", "P1220"]}, {"id": "P1230", "text": ["Since the tank circuit's resonant frequency is around the carrier frequency you set into the function generator, the circuit is designed to modulate a 100 kHz signal.  Now, let's view the signals inside the circuit and verify correct operation.", "Since the tank circuit's resonant frequency is around the carrier frequency you set into the function generator, the circuit is designed to modulate a 100 kHz signal. Now, let's view the signals inside the circuit and verify correct operation."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["1.  Connect CH1 to PC1 Pin E.  Set the oscilloscope Time/Div              control to 2 ms.  This is the 1 kHz information signal from                 PC130-322.  Notice that the waveform is a sine wave with no          modulation or amplitude variations.", "1. Connect CH1 to PC1 Pin E. Set the oscilloscope Time/Div control to 2 ms. This is the 1 kHz information signal from PC130-322. Notice that the waveform is a sine wave with no modulation or amplitude variations. variations.", "Time/Div = 2 ms Volt/Div = 1 Triggering = as required Coupling = AC"], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["2.  Connect CH1 to PC1 Pin D.  Set the oscilloscope Time/Div               control to 0.2 ms.  This is the 1 kHz modulating signal from             the modulation section of the function generator.  Notice that         there is a small 100 kHz signal riding on the 1 kHz signal.", "2. Connect CH1 to PC1 Pin D. Set the oscilloscope Time/Div control to 0.2 ms. This is the 1 kHz modulating signal from the modulation section of the function generator. Notice that there is a small 100 kHz signal riding on the 1 kHz signal.", "Time/Div = 0.2 ms Volt/Div = 1 Triggering = as required Coupling = AC"], "jumps": ["P1260", "P1240"]}, { let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
