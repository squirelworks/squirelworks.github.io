<script>
const book = {"title": "9395p307", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: INPUT/OUTPUT AND INTERFACES fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Understand the purpose and nature of device interfaces. w Recognize the different types of connectors used for device interfaces. w Understand the advantages and limitations of different types of device interfaces......nterfaces................", "w Describe the purpose of the system BIOS. w Understand the purpose of system resources. w Understand the concept of resource conflicts and their resolution..."], "jumps": []}, {"id": "P300", "text": ["I/O is the abbreviation for Input/Output. Input means getting data and instructions to the CPU for processing, while output means getting the processed data back out to the user."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Note that this lesson covers the I/O interfaces, but does not include details on any of the devices themselves. Devices will be the subject of later lessons."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Let's begin the lesson on INPUT/OUTPUT AND INTERFACES....................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": ["P420"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["BIOS stands for Basic Input/Output System. The BIOS contains the set of instructions which control the boot process and the device drivers (or just \"drivers\") which tell the CPU how to talk to the RAM and the peripherals."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["A device driver is the program (the set of instructions) that tell the system how to operate the device. The drivers collectively become the interface between the system's hardware and its operating system.."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The BIOS consists of the ROM on the motherboard, ROM chips on the adapter cards (if any), and the drivers which load with the operating system at startup."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["The part of the BIOS which is embedded in a ROM chip, whether on the motherboard or an adapter card, is referred to as firmware."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["A much-misunderstood component is the Real-Time Clock/Non-Volatile Random Access Memory, or RTC/NVRAM. It is most commonly called the CMOS (pronounced see-moss)."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["It is called this because (a) the material that it is made from is CMOS (Complementary Metal Oxide Semiconductor), and (b) it's a lot easier to say. The RTC/NVRAM is actually a clock chip with memory (RAM) for keeping track of the time and date.."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["However, it has more RAM than it needs just for keeping track of the time and date, so the extra RAM is used by the program in the ROM BIOS to store system configuration settings."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["For this reason, it is often confused with the ROM BIOS itself, even though the two are completely separate components."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["The reason that CMOS material is used is that it only requires low voltages and extremely small amounts of current to operate, so a fairly small battery can keep the clock and configuration settings active for years..."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["What is a device driver? is typed..........................", "the electrical connection between a peripheral and the CPUU", "the program that tells the computer how to operate the devicee"], "jumps": ["P1100"]}, {"id": "P1111", "text": [], "jumps": []}, {"id": "P1112", "text": ["Device drivers may be contained within the BIOS chip, but they are not the BIOS chip."], "jumps": []}, {"id": "P1113", "text": ["A device driver is not an electrical connection............"], "jumps": []}, {"id": "P1120", "text": ["The term Interrupt refers to the suspension of a process going on in the CPU. It is signaled via an Interrupt Request Channel, or IRQ."], "jumps": ["P1130", "P1060"]}, {"id": "P1130", "text": ["An interrupt request channel is the physical connection, or channel, by which a peripheral component signals its need for the CPU's attention in order to have the CPU perform a task, similar to the way that a student raises their hand to signal the teacher..."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["The channel is also sometimes known as a hardware interrupt, but most commonly is just called an interrupt."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["Very old (8-bit) systems had a total of 8 IRQs, numbered from 0 to 7."], "jumps": ["P1160", "P1120"]}, {"id": "P1160", "text": ["Modern systems insert a second group of 8 IRQs into the space formerly occupied by IRQ 2, so there are 8 - 1 + 8, or 15 IRQs. Normally IRQ 2 will show as belonging to a device listed as a Programmable interrupt controller. It holds the place for the other 8 IRQs..."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["IRQs are generally prioritized according to their number, with lower numbers being the higher priority."], "jumps": ["P1150"]}, {"id": "P1180", "text": ["When a peripheral generates an interrupt, first the current contents of all of the CPU's registers are saved to the stack, which is a block of consecutive memory locations.", "CPU Register Instruction Instruction Instruction Instruction Instruction Instruction Instruction Instruction ................. ................. ..................................... ..............................................."], "jumps": ["P1190", "P1150"]}, {"id": "P1190", "text": ["IRQ 0 IRQ 1 IRQ 2 IRQ 3 IRQ 4 IRQ 5 IRQ 6 IRQ 7 IRQ 8 ........ ........ ........ ........", "Driver Address Driver Address Driver Address Driver Address Driver Address Driver Address Driver Address Driver Address Driver Address ....................... ....................... ....................... .......................", "Next, the system is directed to the Interrupt Vector Table. This table holds the addresses (locations in memory) of the drivers for all of the system's various peripherals."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["The IRQ number of the peripheral sets the pointers in this table to identify the memory location which contains the drivers for the peripheral.", "IRQ 0 IRQ 1 IRQ 2 IRQ 3 IRQ 4 IRQ 5 IRQ 6 IRQ 7 IRQ 8 ........ ........ ........ ........", "Driver Address Driver Address Driver Address Driver Address Driver Address Driver Address Driver Address Driver Address Driver Address ....................... ....................... ....................... ......................."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["Once the address of these instructions is obtained from the table, the instructions themselves are fetched (retrieved from memory) and executed. This is called servicing the interrupt.", "Memory Location Memory Location Memory Location Memory Location Memory Location Memory Location Memory Location Memory Location ....................... ....................... ....................... ......................................"], "jumps": ["P1190"]}, {"id": "P1220", "text": ["After the CPU is finished executing these instructions, the previous \"stack\" of instructions is returned to the CPU registers, and the CPU resumes the task that it was working on before.", "CPU Register Instruction Instruction Instruction Instruction Instruction Instruction Instruction Instruction ................. ................. ..................................... ..............................................."], "jumps": ["P1230", "P1190"]}, {"id": "P1230", "text": ["Note that this 'previous task' may actually be the servicing of a lower-priority interrupt. When one interrupt breaks in on another, it is referred to as nesting. Interrupts may be nested several layers deep.."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["What is a hardware interrupt?yped..........................", "The chip which contains the instructions for operating the peripherals.", "The physical connection by which a peripheral signals its need for the CPU's attention."], "jumps": ["P1230"]}, {"id": "P1241", "text": [], "jumps": []}, {"id": "P1242", "text": ["The suspension of the process is not a hardware interrupt.."], "jumps": []}, {"id": "P1243", "text": ["A hardware interrupt is not a chip........................."], "jumps": []}, {"id": "P1250", "text": ["Unlike ISA interrupts, PCI interrupts can be (and in fact, must be) shared."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["Instead of being labeled IRQ x, where the \"x\" designates a number from 0 to 15, PCI interrupts are designated as INTx#, where x represents the letters A, B, C, or D."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["The PCI specification requires that all PCI cards that use a single interrupt must use INTA#."], "jumps": ["P1280", "P1250"]}, {"id": "P1280", "text": ["The only time that INTB#, INTC#, or INTD# are used is when there are other functions built into the same PCI card. Multifunction PCI cards are relatively rare, so it is unlikely that a system will use any interrupt other than INTA#.."], "jumps": ["P1290", "P1250"]}, {"id": "P1290", "text": ["The limiting factor for PCI peripherals is the fact that each card must be mapped (or assigned) to a corresponding ISA interrupt, so each PCI card will still require a separate IRQ. Newer systems have a means to get around this, however.."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["If both the BIOS and the operating system (Windows 95B or later systems) support it, there is a function available called PCI IRQ Steering. This function allows Windows to change the IRQ settings established by the BIOS..", "This is not done automatically, but if there aren't enough IRQs to go around then Windows can use IRQ steering to assign multiple PCI cards to a single IRQ. In theory, this allows all the devices to function properly..", "In practice, multiple PCI cards on a single IRQ may work perfectly, but there is also the possibility of a resource conflict.", "A resource conflict is when two or more devices require the same resources at the same time. This could result in one or both of the cards not working, or it may even bring the entire system down..", "If there is a conflict, it may be necessary to manually assign fixed IRQs or to remove one or more cards from the system. $Back: P1330", "Competition among PCI-based peripherals for system resources is one of the main reasons for the increasing popularity of USB-based devices."], "jumps": ["P1310", "P1290", "P1320", "P1300", "P1330", "P1350", "P1360"]}, {"id": "P1360", "text": ["For USB, only the bus controller itself requires an IRQ. The individual USB devices are independent of IRQs, depending on the bus controller for their share of system resources."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["What is PCI IRQ steering?is typed..........................", "The means by which the BIOS can change the IRQ settings which were set by Windows.", "The means by which the user can change the IRQ settings which were set by the system.", "The means by which Windows can change the IRQ settings which were set by the BIOS."], "jumps": ["P1350"]}, {"id": "P1371", "text": [], "jumps": []}, {"id": "P1372", "text": ["The BIOS sets the IRQs. It doesn't change them once they are set..."], "jumps": []}, {"id": "P1373", "text": ["IRQ steering is an automatic process. It does not require the user to do anything.", "Direct Memory Access (DMA) is a process which allows a disk drive or other peripheral device to transfer data directly to or from memory without the CPU being involved, thereby saving processing power for other tasks..."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["As is the case with IRQs, very old systems have fewer DMA channels available than newer systems: 8-bit ISA systems have only 4 channels, while 16-bit and 32-bit ISA/PCI systems have 8 available."], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["Of the 4 channels on an 8-bit system, only 1 channel is normally available. The other 3 are spoken for."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["DMA 0 is used for Dynamic RAM Refresh, an operation that is used to keep the contents of RAM from fading. This is discussed more fully in the lesson on Memory."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["DMA channel 2 is normally used for a floppy disk controller, and DMA 3 for a hard disk controller. This means that only DMA 1 is available for use by an expansion peripheral."], "jumps": ["P1430", "P1400"]}, {"id": "P1430", "text": ["In a 16 or 32-bit system, 4 additional channels are \"cascaded\" through another channel, similar to the way that extra IRQs are inserted by grouping them together at IRQ 2. In the case of DMA channels, DMA 0 through 3 are cascaded via DMA 4.."], "jumps": ["P1440", "P1400"]}, {"id": "P1440", "text": ["In this case, DMA 2 is still reserved for the floppy disk controller and DMA 4 is not available at all, but no other channels are limited. They can be assigned as needed. In such a system, DMA is not used for refreshing the RAM. That is handled differently.."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["When the EISA standard was written, its creators took into account the limitations of the way that the DMA channels were implemented in the ISA bus, and created a new DMA controller to go with the new bus...", "DMA Modes Compatible - timing matches the original ISA bus. All ISA cards can operate in this mode. Type A - timing is compressed by 25% relative to Compatible mode. Most, but not all, ISA cards can operate in this mode. Type B - timing is compressed by 50% relative to Compatible mode. In this mode, most EISA cards function properly, but most ISA cards do not. Type C - timing is compressed by 87.5% relative to Compatible mode. In this mode, only EISA cards can function."], "jumps": ["P1460", "P1430"]}, {"id": "P1460", "text": ["Under EISA, DMA transfers can be set to run in any of 4 modes:", "DMA Modes Compatible - timing matches the original ISA bus. All ISA cards can operate in this mode. Type A - timing is compressed by 25% relative to Compatible mode. Most, but not all, ISA cards can operate in this mode. Type B - timing is compressed by 50% relative to Compatible mode. In this mode, most EISA cards function properly, but most ISA cards do not. Type C - timing is compressed by 87.5% relative to Compatible mode. In this mode, only EISA cards can function."], "jumps": ["P1910", "P1450"]}, {"id": "P1910", "text": ["This completes the information on INPUT/OUTPUT.ITLE........"], "jumps": ["P1001", "P1460"]}, {"id": "P1920", "text": ["1. The BIOS (Basic Input/Output System) contains both the program which controls the boot process and the device drivers which are the programs that control the peripherals."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. A device driver is a program that tells the system how to operate the device. The drivers collectively become the interface between the system's hardware and its operating system....."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. The BIOS consists of the ROM on the motherboard and on the adapter cards (if any), and the drivers which load with the operating system at startup. 4. The part of the BIOS which is embedded in a ROM chip is referred to as firmware."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["5. The Real-Time Clock/Non-Volatile Random Access Memory (commonly called the CMOS) is a clock chip with memory for keeping track of the time and date. 6. The extra RAM in the CMOS is used by the program in the ROM BIOS to store system configuration settings."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["7. The term Interrupt refers to the suspension of a process going on in the CPU. 8. An interrupt request channel (IRQ) is the physical connection by which a peripheral component signals its need to have the CPU perform a task."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["9. The limiting factor for PCI peripherals is the fact that each card must be mapped to a corresponding ISA interrupt, so each PCI card will still require a separate IRQ. 10. PCI IRQ steering allows Windows to change the IRQ settings established by the BIOS..", "11. A resource conflict is when two or more devices require the same resources at the same time. 12. Competition for system resources is one of the main reasons for the increasing popularity of USB-based devices, since only the bus controller itself requires an IRQ."], "jumps": ["P1980", "P1960", "P1990", "P1970"]}, {"id": "P1990", "text": ["13. Direct Memory Access (DMA) is a process which allows a disk drive or other peripheral device to transfer data directly to or from memory without the CPU being involved. 14. Under the EISA standards, DMA transfers can be set to run in any of 4 modes:", "DMA Modes Compatible - timing matches the original ISA bus. All ISA cards can operate in this mode. Type A - timing is compressed by 25% relative to Compatible mode. Most, but not all, ISA cards can operate in this mode. Type B - timing is compressed by 50% relative to Compatible mode. In this mode, most EISA cards function properly, but most ISA cards do not. Type C - timing is compressed by 87.5% relative to Compatible mode. In this mode, only EISA cards can function."], "jumps": ["P1999", "P1980"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1990"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["An Interface is a shared boundary. In computer terms, an interface is the boundary between the system and its peripherals, or between the system and the user, or between the peripherals and the user."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["This boundary may be electrical, mechanical, software, or any combination of the three. As an example, let's consider the keyboard interface."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["The mechanical part of the interface relates to the size and shape of the connectors. Many modern keyboards use a PS/2 (mini-DIN 6) connector, but some use a USB connector, and older ones use a 5-pin DIN connector.."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["The electrical part of the interface relates to the operating and signaling voltages. A keyboard of this type would typically use +5 VDC for power, with signal levels also in the range of +5 V and under.", "The software part of the interface relates to the way that a keystroke is transmitted. Each typed character consists of a packet of 11 bits that are sent back to the system. Eight of these are data bits and three are overhead bits."], "jumps": ["P2040", "P2070"]}, {"id": "P2065", "text": ["OVERHEAD - any bit sent along with data bits to assist in their transport, but which itself is not data. It defines the extent (or boundaries) of the bits which actually comprise the data (this is also called framing), are used for error checking, to indicate status, etc."], "jumps": []}, {"id": "P2070", "text": ["What is an interface?ion is typed.........................."], "jumps": []}, {"id": "P2071", "text": [], "jumps": []}, {"id": "P2072", "text": ["An electrical connector would only be part of an interface."], "jumps": []}, {"id": "P2073", "text": ["The software that runs a peripheral is called a driver, not an interface.", "Examples of input devices include keyboards, mice, and scanners. There are a number of others, of course, but these are the most common.", "Input devices all have one thing in common: the data always flows from the device to the system. They are not capable of receiving data, only sending it."], "jumps": ["P2090", "P2070", "P2100", "P2080"]}, {"id": "P2100", "text": ["Of course, there appear to be exceptions to this. There are monitors where you touch the screen to send data and instructions to the computer, right?"], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["Well, yes and no. There are input devices which can be attached to the monitor, making it seem as though the monitor is sending data, but they are attachments and are not part of the display itself. The only data flow is from the system to the monitor...", "Keyboards also appear to be bidirectional devices, but they really aren't. The system may send control and status bits to the keyboard, but not data. As with monitors, the data only flows in one direction-from the keyboard to the system.", "In contrast, output devices are only used to send data from the system to the outside world. You can't use a monitor to put data into the system, but you can use it to display the results of the processing and calculating done by the system.."], "jumps": ["P2120", "P2090", "P2130", "P2110", "P2140"]}, {"id": "P2140", "text": ["The same applies to printers. You can't use the printer to send data to the system. The printer is for the system to send data back out to the user and to the world."], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["As with input devices, exceptions exist for the printer. There are status and control signals that are sent from the printer to the system, but not data.", "There are, of course, devices which both send and receive data. These are primarily storage devices and communications devices."], "jumps": ["P2160", "P2130", "P2170"]}, {"id": "P2170", "text": ["Storage devices include such things as disk drives and tape drives. These devices have a separate lesson devoted to them, covering types and interfaces, so we will not go into detail here."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["The most important communication interface is the serial type, and the most common serial interface is the RS-232."], "jumps": ["P2190", "P2160"]}, {"id": "P2190", "text": ["The standard for RS-232 defines the physical connection, the data transfer rates, the protocols used to send the data, the voltages, and so on."], "jumps": ["P2180"]}, {"id": "P2192", "text": ["The standard for RS-232 defines the physical connection, the data transfer rates, the protocols used to send the data, the voltages, and so on."], "jumps": ["P2180"]}, {"id": "P2195", "text": ["PROTOCOL- the set of rules governing the format of messages."], "jumps": []}, {"id": "P2200", "text": ["A general characteristic of serial interfaces is the nature of the signal: information is sent one bit at a time."], "jumps": ["P2210", "P2192"]}, {"id": "P2210", "text": ["The electrical characteristics of serial connections fall into two major categories: balanced signals and unbalanced signals."], "jumps": ["P2220"]}, {"id": "P2220", "text": ["Unbalanced means that there is a single line for transmitted signals (labeled either Tx for Transmit or TD for Transmitted Data) and another for received signals (Rx or RD), with both signals sharing a common ground..."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["Balanced means that the signal is simultaneously applied in equal amplitude but opposite polarity to a pair of conductors, giving a kind of \"mirror image\" in reference to a common level."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["The lines that carry the transmitted signal away from the device are called TRANSMIT (+) and TRANSMIT (-), while the lines that bring the signal in are the RECEIVE (+) and RECEIVE (-)."], "jumps": ["P2250", "P2220"]}, {"id": "P2250", "text": ["This means that the difference between the signal's positive lead and its negative lead is actually double the voltage level of the original signal."], "jumps": ["P2260", "P2220"]}, {"id": "P2260", "text": ["Doubling the amplitude means that the signal can travel much farther before attenuation becomes a problem."], "jumps": ["P2270", "P2220"]}, {"id": "P2270", "text": ["The RS-232 standard was originally developed by the EIA. It is unbalanced serial data, reliable up to approximately 20 kbps for distances up to 50 feet."], "jumps": ["P2280", "P2220"]}, {"id": "P2280", "text": ["As with all communication devices, there is a trade-off between speed and distance, so the signal could go farther but not as fast, or faster but not as far."], "jumps": ["P2290", "P2220"]}, {"id": "P2290", "text": ["The RS-232 interface normally uses either a DB-25 or DB-9 connector. The signals are in the range of -3 to -25 VDC for a logic \"1\" and +3 to +25 VDC for a logic \"0\".", "0 1 0 1 1 1 0 1", "+ 3 to + 25 VDC - 3 to - 25 VDC"], "jumps": ["P2300", "P2220"]}, {"id": "P2295", "text": ["LOGIC \"1\" AND LOGIC \"0\"- in digital communications, information is represented by a sequence of ones and zeroes. The computer then translates these ones and zeroes into graphics, sounds, and words."], "jumps": ["P2296", "P2290"]}, {"id": "P2296", "text": ["The ones and zeroes themselves are transmitted and received in the form of voltage levels. The particular voltages will depend on the specific application, so instead of speaking of a voltage we refer to the logic level represented by the voltage...", "Another common type of serial connection is RS-422. This standard defines a balanced, rather than unbalanced interface, but does not specify any connector. The connector may be just about any type, from DB-9 to screw terminals."], "jumps": ["P2290", "P2295", "P2310"]}, {"id": "P2310", "text": ["RS-422 is commonly used in industrial applications. Apple Computer uses the mini-DIN 8 for RS-422, which is used in place of RS-232 on Macintosh computers. The biggest advantage of RS-422 is its ability to run at high speeds (up to 2 Mbps) over long distances."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["Another important serial interface is RS-530. This standard specifies a DB-25 connector, and it may work in conjunction with either balanced or unbalanced circuits. It, too, is a high-speed interface."], "jumps": ["P2330", "P2300"]}, {"id": "P2330", "text": ["It uses the same kind of connector as RS-232, but the two are not compatible electrically. The pin-out is very different.", "The last serial interface that we'll mention is RS-485. It somewhat resembles RS-422, but can be used in multi-point applications. That is, many (up to 64) devices may be connected together simultaneously. Each is given a unique identifier (address)."], "jumps": ["P2340", "P2300", "P2350"]}, {"id": "P2350", "text": ["Each device has an input to receive signals and an output to pass the signals along to other devices. This is useful in situations where a single computer controls many different devices, such as measuring instruments, remote power switches, and the like.."], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["Which serial interface is the most commonly used for computer communications?"], "jumps": ["P2340"]}, {"id": "P2361", "text": [], "jumps": []}, {"id": "P2362", "text": ["RS-422 is not the most common interface...................."], "jumps": []}, {"id": "P2363", "text": ["USB is not the most common interface......................."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on INTERFACES. TITLE........"], "jumps": ["P2001", "P2360"]}, {"id": "P2920", "text": ["1. An Interface is a shared boundary, which may be electrical, mechanical, software, or any combination of the three.."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2. A mechanical interface relates to the size and shape of the connectors. 3. An electrical interface relates to the operating and signaling voltages. 4. A software interface relates to the way that the data is transmitted....", "5. For input devices, the data always flows from the device to the system. 6. For output devices, the data flows from the system to the device...", "7. Storage devices (such as disk drives and tape drives) and communications devices both send and receive data.."], "jumps": ["P2940", "P2920", "P2950", "P2930", "P2960"]}, {"id": "P2960", "text": ["8. Communications devices normally use serial interfaces. 9. A general characteristic of serial interfaces is that information is sent one bit at a time. 10. The serial connection may use either balanced signals or unbalanced signals.", "Unbalanced - a single line for transmitted signals and another for recieved signals, with both signals sharing a common ground.", "Balanced - a signal is simultaneously applied in equal ampliture but opposite polarity to a pair of conductors.common ground.d."], "jumps": ["P2970", "P2950"]}, {"id": "P2970", "text": ["11. RS-232 is unbalanced serial data, reliable up to approximately 20 kbps for distances up to 50 feet, or higher speed for shorter distances, or lower speed for longer distances. 12. The RS-232 interface normally uses either a DB-25 or DB-9 connector."], "jumps": ["P2980", "P2960"]}, {"id": "P2980", "text": ["13. Another common type of serial interface is RS-422, which is a balanced signal commonly used in industrial applications. 14. The biggest advantage of RS-422 is high speeds (up to 2 Mbps) over long distances..tances."], "jumps": ["P2999", "P2970"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P2001", "P2970"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": [], "jumps": []}, {"id": "P10211", "text": ["Keeps track of the intructions in the BIOS chip", "To tell the system how to operate a peripheral"], "jumps": []}, {"id": "P10212", "text": ["The interface between hardware and software", "Software which has been programmed into a ROM"], "jumps": []}, {"id": "P10213", "text": ["Because it is much cheaper and reduces overall costs"], "jumps": []}, {"id": "P10214", "text": ["When a peripheral stops until the CPU can catch up", "The suspension of a process going on in the CPU", "A kind of interface used by a peripheral", "The instructions for operating a peripheral"], "jumps": []}, {"id": "P10215", "text": ["What term describes the process when one peripheral gains the CPU's attention while it is servicing another interrupt?"], "jumps": []}, {"id": "P10216", "text": ["What is the term for the process by which Windows overrides the IRQ settings established by the BIOS?", "Windows is not able to override settings made by the BIOS"], "jumps": []}, {"id": "P10217", "text": ["When two programs try to operate the same peripheral at the same time", "When two peripherals need to plug into the same interface at the same time", "When two peripherals require the same system resources at the same time"], "jumps": []}, {"id": "P10218", "text": ["Three. One for the USB controller and one each for the peripherals.", "If two USB peripherals are plugged into the same system, how many IRQs will be required?", "One. Only the USB controller needs an IRQ."], "jumps": []}, {"id": "P10219", "text": ["A process by which a peripheral device transfers data directly to and from memory without the CPU being involved", "A process by which a program in memory directly controls a peripheral device without the CPU being involved", "A process by which the CPU transfers data directly to and from memory without a peripheral device being involved"], "jumps": []}, {"id": "P10220", "text": ["Which term describes the boundary between a computer and a peripheral?"], "jumps": []}, {"id": "P10221", "text": ["Data flows from the device to the system.", "What characteristic do all input devices have in common?"], "jumps": []}, {"id": "P10222", "text": ["Data flows only from the system to the device.", "What characteristic do bidirectional devices have in common?", "Data flows only from the device to the system"], "jumps": []}, {"id": "P10223", "text": [], "jumps": []}, {"id": "P10224", "text": [], "jumps": []}, {"id": "P10225", "text": ["Which is a common interface for communication devices?"], "jumps": []}, {"id": "P10226", "text": ["The electrical characteristics of serial connections fall # HelpPage # 10210 1 110 1020 10211 1 111 1030 10212 1 112 1050 10213 1 113 1100 10214 1 114 1120 10215 1 115 1230 10216 1 116 1300 10217 1 117 1330 10218 1 118 1360 10219 1 119 1380 10220 2 120 2020 10221 2 121 2090 10222 2 122 2160 10223 2 123 2080 10224 2 124 2080 10225 2 125 2180 10226 2 126 2210 10227 2 127 2200 10228 2 128 2270 10229 2 129 2160"], "jumps": []}]};
let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
