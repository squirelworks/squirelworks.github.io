DETAIL."], "jumps": []}, {"id": "P3213", "text": ["When started most computer systems use a program to test memory.  Memory doesn't go bad that often, but when it does, it can totally destroy data being accessed.  To avoid this, the computer scans the memory before you even get a chance to use it.", "When started most computer systems use a program to test memory. Memory doesn't go bad that often, but when it does, it can totally destroy data being accessed. To avoid this, the computer scans the memory before you even get a chance to use it..."], "jumps": []}, {"id": "P3212", "text": ["A visual inspection is where you inspect parts for physical damage.  This program looks inside where you cannot see to see if it is operating properly.", "A visual inspection is where you inspect parts for physical damage. This program looks inside where you cannot see to see if it is operating properly."], "jumps": []}, {"id": "P3211", "text": [], "jumps": []}, {"id": "P3210", "text": ["A program in the computer which checks to see that all the memory locations of RAM are working is known as a _______"], "jumps": ["P3130"]}, {"id": "P3200", "text": ["Now that you have been introduced to the concepts and tools of troubleshooting, let's begin the experiment on troubleshooting the 8085 microprocessor."], "jumps": ["P3210", "P3130"]}, {"id": "P3190", "text": ["Most diagnostic programs will, at a minimum, identify what section is faulted. Some diagnostic routines even identify which components are faulted!  No troubleshooting even required.", "Most diagnostic programs will, at a minimum, identify what section is faulted. Some diagnostic routines even identify which components are faulted! No troubleshooting even required."], "jumps": ["P3200", "P3130"]}, {"id": "P3180", "text": ["The only disadvantage of diagnostic programs is that the microprocessor system must operate well enough to load or execute a program.  The advantage of diagnostic routines is time saving.", "The only disadvantage of diagnostic programs is that the microprocessor system must operate well enough to load or execute a program. The advantage of diagnostic routines is time saving..."], "jumps": ["P3190", "P3130"]}, {"id": "P3170", "text": ["Diagnostic Routines  \nDiagnostic routines are programs used in the microprocessor to test the system.  These programs are normally supplied by the system manufacturer.  If not, and you know how to program a microprocessor, your own diagnostic routines can be written.", "Diagnostic Routines Diagnostic routines are programs used in the microprocessor to test the system. These programs are normally supplied by the system manufacturer. If not, and you know how to program a microprocessor, your own diagnostic routines can be written."], "jumps": ["P3180", "P3130"]}, {"id": "P3160", "text": ["After troubleshooting and repair, do another visual inspection to ensure that the repair process did not cause any damage to the system, such as lifted solder runs, ICs or transistors not seated in their sockets properly, or drops of solder that might cause a short.", "After troubleshooting and repair, do another visual inspection to ensure that the repair process did not cause any damage to the system, such as lifted solder runs, ICs or transistors not seated in their sockets properly, or drops of solder that might cause a short..."], "jumps": ["P3170", "P3130"]}, {"id": "P3150", "text": ["Before you begin measuring circuit values with test instruments, look for damaged components.  A burned resistor is a strong indication of a power supply problem, transistor problems, or some other active component gone bad.", "Before you begin measuring circuit values with test instruments, look for damaged components. A burned resistor is a strong indication of a power supply problem, transistor problems, or some other active component gone bad..."], "jumps": ["P3160", "P3130"]}, {"id": "P3140", "text": ["Visual Inspection \nVisual inspections must be performed carefully before, during and after troubleshooting.  They identify mechanical damage, heat damage, damage from misuse, etc.", "Visual Inspection Visual inspections must be performed carefully before, during and after troubleshooting. They identify mechanical damage, heat damage, damage from misuse, etc..."], "jumps": ["P3150", "P3130"]}, {"id": "P3130", "text": ["Non-Test Instrument Tools \nWhile test instruments provide vital information on the operation of the microprocessor, there are other tools a technician can use to make his job easier.", "Non-Test Instrument Tools While test instruments provide vital information on the operation of the microprocessor, there are other tools a technician can use to make his job easier...."], "jumps": ["P3110"]}, {"id": "P3120", "text": ["The LED or lamp illuminates brightly for a high and is off for a low. A pulse signal is identified by a dimly illuminated LED or lamp. Logic clips are of limited value because many digital circuits today are changing states so rapidly, the lights appear to be constantly ON, even though they are actually turning ON and OFF rapidly....."], "jumps": ["P3110"]}, {"id": "P3110", "text": ["Logic Clip  \nThe logic clip is a simple test instrument used to determine logic levels on an IC.  The clip is attached to an IC where it makes contact with each pin.  On the logic clip are LEDs or lamps, one for each pin connection to the IC.", "Logic Clip The logic clip is a simple test instrument used to determine logic levels on an IC. The clip is attached to an IC where it makes contact with each pin. On the logic clip are LEDs or lamps, one for each pin connection to the IC."], "jumps": ["P3070"]}, {"id": "P3100", "text": ["Again, the signature analyzer is only used in very complex circuits where the cost of the instrument can be justified."], "jumps": ["P3070"]}, {"id": "P3090", "text": ["The instrument converts a series of ones and zeros at a given test point to hexadecimal code.  The code is called the signature for that particular test point.  Then, by comparing the signature to the known signature, you can identify faults.", "The instrument converts a series of ones and zeros at a given test point to hexadecimal code. The code is called the signature for that particular test point. Then, by comparing the signature to the known signature, you can identify faults..."], "jumps": ["P3070"]}, {"id": "P3080", "text": ["Signature analyzers are used to locate faults to the component level in microprocessor based systems."], "jumps": ["P3070"]}, {"id": "P3070", "text": ["Signature Analyzer  \nThe signature analyzer is somewhat like the logic analyzer without the waveform display.  It uses the coded format by measuring pulse trains of highs and lows.", "Signature Analyzer The signature analyzer is somewhat like the logic analyzer without the waveform display. It uses the coded format by measuring pulse trains of highs and lows."], "jumps": ["P3020"]}, {"id": "P3060", "text": ["The code for a particular point in a circuit can then be compared to a given code in a technical manual or to code present in a functional circuit.  Any difference between the measured code and the reference code indicates a fault.", "The code for a particular point in a circuit can then be compared to a given code in a technical manual or to code present in a functional circuit. Any difference between the measured code and the reference code indicates a fault..."], "jumps": ["P3020"]}, {"id": "P3050", "text": ["Another type of format that may be included on some logic analyzers is the CODED format.  The coded format changes ones and zeros to either octal or hexadecimal code.", "Another type of format that may be included on some logic analyzers is the CODED format. The coded format changes ones and zeros to either octal or hexadecimal code."], "jumps": ["P3020"]}, {"id": "P3040", "text": ["The second type of format is the BIT or BIT PATTERN.  A sequence of 1s and 0s from a functional circuit can be compared to the pattern of a faulty circuit to detect errors.  Oscilloscopes and logic probes cannot do this.", "The second type of format is the BIT or BIT PATTERN. A sequence of 1s and 0s from a functional circuit can be compared to the pattern of a faulty circuit to detect errors. Oscilloscopes and logic probes cannot do this..."], "jumps": ["P3020"]}, {"id": "P3030", "text": ["One type of format is the TIMING DIAGRAM.  Several pulse waveforms are displayed in the correct time relationship.  Dual channel oscilloscopes can only display two waveforms.  Logic analyzers can display many, depending on the make and model.", "Logic Analyzer  \nThe logic analyzer is basically a special type of multichannel oscilloscope that has the ability to display logic levels, pulse trains of highs and lows, in several formats.  Logic analyzers are expensive and only used in complex digital circuits.", "One type of format is the TIMING DIAGRAM. Several pulse waveforms are displayed in the correct time relationship. Dual channel oscilloscopes can only display two waveforms. Logic analyzers can display many, depending on the make and model...", "Logic Analyzer The logic analyzer is basically a special type of multichannel oscilloscope that has the ability to display logic levels, pulse trains of highs and lows, in several formats. Logic analyzers are expensive and only used in complex digital circuits."], "jumps": ["P3020", "P3030", "P1880"]}, {"id": "P3010", "text": ["An LED on the current tracer illuminates when the signal at a particular point is pulsing.  No LED illumination indicates a fault and, by signal tracing, the bad component can be located.", "An LED on the current tracer illuminates when the signal at a particular point is pulsing. No LED illumination indicates a fault and, by signal tracing, the bad component can be located."], "jumps": ["P3020", "P1880"]}, {"id": "P3000", "text": ["The logic pulser is used to inject a pulsating signal (square wave) into the circuit if normal signal levels are constant.  The current tracer is used to trace the current paths through the circuit.", "The logic pulser is used to inject a pulsating signal (square wave) into the circuit if normal signal levels are constant. The current tracer is used to trace the current paths through the circuit..."], "jumps": ["P3010", "P1880"]}, {"id": "P2910", "text": ["This completes the experiment on TROUBLESHOOTING THE 8085 MICROPROCESSOR."], "jumps": ["P2001", "P2500"]}, {"id": "P2800", "text": [], "jumps": []}, {"id": "P2500", "text": ["17.  Return all test equipment to their designated storage area.", "17. Return all test equipment to their designated storage area."], "jumps": ["P2910", "P2490"]}, {"id": "P2490", "text": ["16.  Set the Console Power Switch to OFF.", "16. Set the Console Power Switch to OFF. ternal program = SCAN FTR 0 C1 00"], "jumps": ["P2480"]}, {"id": "P2480", "text": ["15.  Return the Test Console to the initial control settings.", "15. Return the Test Console to the initial control settings..............."], "jumps": ["P2400"]}, {"id": "P2400", "text": ["As you gain experience in troubleshooting microprocessor systems, certain faults will become easy to detect."], "jumps": ["P2480", "P2390"]}, {"id": "P2390", "text": ["What you have seen in this experiment is an example of typical faults in a microprocessor system.  You were able to see how they can be detected and which types of indications they show.", "What you have seen in this experiment is an example of typical faults in a microprocessor system. You were able to see how they can be detected and which types of indications they show."], "jumps": ["P2400", "P2385"]}, {"id": "P2387", "text": [], "jumps": []}, {"id": "P2385", "text": ["An open ground can cause _______", "An open ground can cause _______d..........................", "diagnostic routines to overlook the fault.."], "jumps": ["P2380"]}, {"id": "P2380", "text": ["In many situations, many system parameters need to be checked to determine \"NIDA 485 Vx.x:\" in the LCD display on the PC130-400 card. If the message is dim or blank, try adjusting the Display Intensity potentiometer R1 on the PC130-404 card using a small screwdriver. If you still cannot see the message, see your instructor for assistance. e version of the monitor program you are using. This experiment is written for all versions of the monitor program. If, at any time during the experiment, you short some of the IC pins together while observing the signals, press the reset button. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run the program before proceeding with your measurements.ents...", "The \"Vx.x\" in the display of the LCD indicates the version of the monitor program you are using. This experiment is written for all versions of the monitor program. If, at any time during the experiment, you short some of the IC pins together while observing the signals, press the reset button. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run the program before proceeding with your measurements."], "jumps": ["P2136", "P2120"]}, {"id": "P2120", "text": ["8.  Set the PC1 DC Power switch to ON.", "8. Set the PC1 DC Power switch to ON..o 12. 130A - Set the PC1 DC switch to ON. 130A - Set the PC2 AC switch to ON. 130A - Set the PC3 Speaker switch to ON.."], "jumps": ["P2115"]}, {"id": "P2115", "text": ["7.  Set the PC2 DC Power switch to ON.", "7. Set the PC2 DC Power switch to ON..o 12. 130A - Set the PC1 DC switch to ON. 130A - Set the PC2 AC switch to ON. 130A - Set the PC3 Speaker switch to ON.."], "jumps": ["P2110"]}, {"id": "P2110", "text": ["6.  Set the PC3 DC Power switch to ON.", "6. Set the PC3 DC Power switch to ON.to ON. 130A - Set the PC1 DC switch to ON. 130A - Set the PC2 AC switch to ON. 130A - Set the PC3 Speaker switch to ON.."], "jumps": ["P2100"]}, {"id": "P2100", "text": ["5.  Set the Positive DC Power Supply to 5 Volts.", "5. Set the Positive DC Power Supply to 5 Volts.30A - Set the PC1 DC Switch to ON...."], "jumps": ["P2090"]}, {"id": "P2090", "text": ["4.  Connect four experiment cards with the ribbon cables as                follows:\n     a.  Using the 30 pin ribbon cable, connect PC130-485 J1 to PC130-402 J1.\n       b.  Using the short 20 pin ribbon cable, connect PC130-402 J2 to PC130-401 J1.\n       c.  Using the long 20 pin ribbon cable, connect PC130-401 J2 to PC130-400 J1.", "4. Connect four experiment cards with the ribbon cables as follows: a. Using the 30 pin ribbon cable, connect PC130-485 J1 to PC130-402 J1. b. Using the short 20 pin ribbon cable, connect PC130-402 J2 to PC130-401 J1. c. Using the long 20 pin ribbon cable, connect PC130-401 J2 to PC130-400 J1. n the proper orientation. Note that each cable has a red stripe on one side. This stripe indicates pin 1. On the Experiment Cards, the number 1 or 2 indicates the end of the connector with the 1 pin. Attach the cables to the connectors such that the red stripe is at the end of the connector with the numeral 1 or 2.1 or 2."], "jumps": ["P2100", "P2085"]}, {"id": "P2085", "text": ["3.  Place the PC130-400 Keyboard and Display card in front of            the test console between the PC2 and PC3 positions.", "3. Place the PC130-400 Keyboard and Display card in front of the test console between the PC2 and PC3 positions. External program = SCAN FTR 0 C1 00........................."], "jumps": ["P2080"]}, {"id": "P2080", "text": ["2.  Insert the following 130 experiment cards on the test console.  \n     a.   PC130-485 8085 Microprocessor card in the PC1 position.\n     b.   PC130-402 8085 Memory & Address Decoder card in the                 PC2 position.  \n     c.   PC130-401 I/O card in the PC3 position.", "2. Insert the following 130 experiment cards on the test console. a. PC130-485 8085 Microprocessor card in the PC1 position. b. PC130-402 8085 Memory & Address Decoder card in the PC2 position. c. PC130-401 I/O card in the PC3 position. osition. 0 External program = SCAN PWR 0 12333"], "jumps": ["P2070"]}, {"id": "P2070", "text": ["1.  Set the test console controls to their initial control setting.", "1. Set the test console controls to their initial control setting........."], "jumps": ["P2040"]}, {"id": "P2065", "text": ["Let's begin the experiment on troubleshooting the 8085 microprocessor."], "jumps": ["P2070", "P2040"]}, {"id": "P2060", "text": ["If a fault is discovered, certain steps must be performed to isolate the fault to a particular region of the microprocessor system."], "jumps": ["P2065", "P2040"]}, {"id": "P2050", "text": ["You will perform two fault scenarios where you will be required to determine the fault with the assistance of this lesson.  In each case, you will check the system to see if anything isn't working.", "You will perform two fault scenarios where you will be required to determine the fault with the assistance of this lesson. In each case, you will check the system to see if anything isn't working."], "jumps": ["P2060", "P2040"]}, {"id": "P2040", "text": ["In this experiment, you will troubleshoot a microprocessor system."], "jumps": ["P2050", "P2001"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary.  You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1940"]}, {"id": "P1960", "text": ["5.  Non-Test instruments used in troubleshooting are:  Visual             Inspection and Diagnostic Routines.", "5. Non-Test instruments used in troubleshooting are: Visual Inspection and Diagnostic Routines.."], "jumps": ["P1999", "P1940"]}, {"id": "P1950", "text": ["4.  Test instruments used in troubleshooting are:  the Multimeter,        the Oscilloscope, Logic Probes, Logic Analyzers, Signature          Analyzers, Current Tracer/Logic Pulsers and Logic Clips.", "4. Test instruments used in troubleshooting are: the Multimeter, the Oscilloscope, Logic Probes, Logic Analyzers, Signature Analyzers, Current Tracer/Logic Pulsers and Logic Clips.."], "jumps": ["P1960", "P1940"]}, {"id": "P1940", "text": ["3.  Troubleshooting tools fall under two categories:  Test                       Instruments and Non-Test Instruments.", "3. Troubleshooting tools fall under two categories: Test Instruments and Non-Test Instruments."], "jumps": ["P1950", "P1930"]}, {"id": "P1930", "text": ["2.  Preventive maintenance is scheduled and unscheduled                  servicing of equipment in an effort to reduce future equipment      failures.", "2. Preventive maintenance is scheduled and unscheduled servicing of equipment in an effort to reduce future equipment failures."], "jumps": ["P1940", "P1920"]}, {"id": "P1920", "text": ["1.  The four step troubleshooting process is:", "1. The four step troubleshooting process is: line here...."], "jumps": ["P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on TROUBLESHOOTING.", "This completes the information on TROUBLESHOOTING.E........"], "jumps": ["P1001", "P3210"]}, {"id": "P1890", "text": ["The current tracer and logic pulser are used to find points in a digital circuit that are stuck, that is, the point remains a logic 1 or 0 all the time.  It is particularly difficult to isolate a bad IC when several are connected together.  The current tracer and logic pulser make the job easier.", "The current tracer and logic pulser are used to find points in a digital circuit that are stuck, that is, the point remains a logic 1 or 0 all the time. It is particularly difficult to isolate a bad IC when several are connected together. The current tracer and logic pulser make the job easier..."], "jumps": ["P3000", "P1880"]}, {"id": "P1880", "text": ["Current Tracer/Logic Pulser\nThe current tracer and logic pulser are very simple test instruments that measure pulsating current at a particular point in a circuit.  Their appearance is very similar to the logic probe, and they are often used in conjunction with the logic probe.", "Current Tracer/Logic Pulser The current tracer and logic pulser are very simple test instruments that measure pulsating current at a particular point in a circuit. Their appearance is very similar to the logic probe, and they are often used in conjunction with the logic probe..."], "jumps": ["P1890", "P1850"]}, {"id": "P1870", "text": ["A logic probe can indicate a high signal, a low signal, single pulse, multiple pulses or an open or bad level. Even though the logic probe is very useful for detecting faults quickly, it normally must be used with other types of digital test instruments to locate problems that are more than just a missing or incorrect input....."], "jumps": ["P1880", "P1850"]}, {"id": "P1860", "text": ["The probe provides a simple means of measuring highs, lows and pulses.  The probe is nothing more than one or more LEDs that illuminate for certain types of signal inputs.", "The probe provides a simple means of measuring highs, lows and pulses. The probe is nothing more than one or more LEDs that illuminate for certain types of signal inputs."], "jumps": ["P1870", "P1850"]}, {"id": "P1850", "text": ["Logic Probe  \nThe logic probe is the least expensive of all digital test instruments.  It is especially designed to be used with digital circuits.  Logic probes measure logic levels.  Note, logic probes do not measure actual DC values.", "Logic Probe The logic probe is the least expensive of all digital test instruments. It is especially designed to be used with digital circuits. Logic probes measure logic levels. Note, logic probes do not measure actual DC values."], "jumps": ["P1860", "P1760"]}, {"id": "P1840", "text": ["Also, signals viewed by the oscilloscope must be periodic.  In other words, they must repeat themselves in the same pattern over and over to be seen on the oscilloscope display properly.", "Also, signals viewed by the oscilloscope must be periodic. In other words, they must repeat themselves in the same pattern over and over to be seen on the oscilloscope display properly."], "jumps": ["P1850", "P1760"]}, {"id": "P1830", "text": ["The multiplexer allows up to 16 signals to be viewed on the oscilloscope simultaneously.  If you try to check the output of a data bus, you can see where being able to look at all the lines can be important.", "The multiplexer allows up to 16 signals to be viewed on the oscilloscope simultaneously. If you try to check the output of a data bus, you can see where being able to look at all the lines can be important..."], "jumps": ["P1840", "P1760"]}, {"id": "P1820", "text": ["However, oscilloscopes have one disadvantage when used in microprocessor systems.  Only one or two waveforms can usually be displayed at one time.  This disadvantage is overcome by using an oscilloscope multiplexer.", "However, oscilloscopes have one disadvantage when used in microprocessor systems. Only one or two waveforms can usually be displayed at one time. This disadvantage is overcome by using an oscilloscope multiplexer...."], "jumps": ["P1830", "P1760"]}, {"id": "P1810", "text": ["One of the big advantages of using a dual trace oscilloscope is that two waveforms can be measured at the same time.  In this way, the time relationship can be determined and analyzed.", "One of the big advantages of using a dual trace oscilloscope is that two waveforms can be measured at the same time. In this way, the time relationship can be determined and analyzed."], "jumps": ["P1820", "P1760"]}, {"id": "P1800", "text": ["An oscilloscope can also be used to measure logic highs and lows which are DC values.  In addition, pulse waveforms and square waves can be measured.", "An oscilloscope can also be used to measure logic highs and lows which are DC values. In addition, pulse waveforms and square waves can be measured."], "jumps": ["P1810", "P1760"]}, {"id": "P1790", "text": ["Characteristics such as amplitude, rise and fall times, pulse width, and frequency can be quickly determined from oscilloscope measurements.", "Characteristics such as amplitude, rise and fall times, pulse width, and frequency can be quickly determined from oscilloscope measurements..ments."], "jumps": ["P1800", "P1760"]}, {"id": "P1780", "text": ["In digital circuits, the oscilloscope is one of the most versatile instruments.  The oscilloscope can detect abnormalities in waveforms that other instruments cannot.", "In digital circuits, the oscilloscope is one of the most versatile instruments. The oscilloscope can detect abnormalities in waveforms that other instruments cannot."], "jumps": ["P1790", "P1760"]}, {"id": "P1770", "text": ["The oscilloscope provides a visual display of a voltage waveform and measures AC and DC voltages and period.", "The oscilloscope provides a visual display of a voltage waveform and measures AC and DC voltages and period. frequency, and phase."], "jumps": ["P1780", "P1760"]}, {"id": "P1760", "text": ["Oscilloscopes  \nThe oscilloscope is a lot more expensive than the multimeter; however, there are not many electronic repair shops that do not have at least one.", "Oscilloscopes The oscilloscope is a lot more expensive than the multimeter; however, there are not many electronic repair shops that do not have at least one..."], "jumps": ["P1770", "P1680"]}, {"id": "P1750", "text": ["But, if the levels are changing, or these are pulsed inputs or outputs, the multimeter is of little use.  Since there are other means to measure operating voltages and logic levels, the multimeter is not used very often, only for continuity checks or pins that maintain static voltage levels, like Vcc or ground.", "But, if the levels are changing, or these are pulsed inputs or outputs, the multimeter is of little use. Since there are other means to measure operating voltages and logic levels, the multimeter is not used very often, only for continuity checks or pins that maintain static voltage levels, like Vcc or ground..."], "jumps": ["P1760", "P1680"]}, {"id": "P1740", "text": ["Many have different ranges of values that represent high and low conditions.  As long as the logic levels are constant, a multimeter will give an accurate reading of HIGH or LOW.", "Many have different ranges of values that represent high and low conditions. As long as the logic levels are constant, a multimeter will give an accurate reading of HIGH or LOW."], "jumps": ["P1750", "P1680"]}, {"id": "P1730", "text": ["Logic highs and lows may also be measured using a multimeter.  A high is normally between 2 and 12 VDC while a low is between 0 and 2 VDC.  Remember, you must have knowledge about the IC family you are using.", "Logic highs and lows may also be measured using a multimeter. A high is normally between 2 and 12 VDC while a low is between 0 and 2 VDC. Remember, you must have knowledge about the IC family you are using..."], "jumps": ["P1740", "P1680"]}, {"id": "P1720", "text": ["PC card wires are checked by measuring continuity between points on the card. Continuity indicates a good connection; no continuity indicates an open wire."], "jumps": ["P1730", "P1680"]}, {"id": "P1710", "text": ["The trend in digital electronics is to use the lowest Vcc values that the chips can be made to run on.  This helps reduce heat problems.  Many circuits in development today are designed to run all the way down below 1 volt to represent a high condition.", "The trend in digital electronics is to use the lowest Vcc values that the chips can be made to run on. This helps reduce heat problems. Many circuits in development today are designed to run all the way down below 1 volt to represent a high condition..."], "jumps": ["P1720", "P1680"]}, {"id": "P1700", "text": ["In digital electronics, multimeters are used primarily to measure operating power, that is Vcc, and checking for open or shorted wires on printed circuit cards.  Vcc is normally a DC voltage between 1 and 12 volts.", "In digital electronics, multimeters are used primarily to measure operating power, that is Vcc, and checking for open or shorted wires on printed circuit cards. Vcc is normally a DC voltage between 1 and 12 volts..."], "jumps": ["P1710", "P1680"]}, {"id": "P1690", "text": ["Multimeters measure DC and AC voltages, DC and AC current and resistances. Some even test transistors, diodes and capacitors."], "jumps": ["P1700", "P1680"]}, {"id": "P1680", "text": ["Multimeter \nThe multimeter is the most commonly used test instrument in DC and AC circuits.  However, it is not the most commonly used test instrument in digital circuits.", "Multimeter The multimeter is the most commonly used test instrument in DC and AC circuits. However, it is not the most commonly used test instrument in digital circuits...."], "jumps": ["P1690", "P1660"]}, {"id": "P1670", "text": ["Because of these differences, several special types of digital test instruments have been developed.  Let's begin the discussion on digital test equipment with the multimeter and the oscilloscope.", "Because of these differences, several special types of digital test instruments have been developed. Let's begin the discussion on digital test equipment with the multimeter and the oscilloscope..."], "jumps": ["P1680", "P1660"]}, {"id": "P1660", "text": ["The testing of digital circuitry is different from analog circuitry in several ways.", "* Digital Circuits use Low DC Voltages. 0, 1.3, 3, 5 and 12 VDC are the most common voltages encountered. * Digital Circuits normally do not have AC voltages present. * Digital Circuits do not normally require resistance checks due to the design of the IC's. * Digital Circuits often rely on timing. That is, synchronization between signals is vital for proper operation. * Digital Circuits use IC's. Since IC's can not be repaired, measuring input and output signals is the troubleshooting method used.sed.od used..used.."], "jumps": ["P1670", "P1610"]}, {"id": "P1650", "text": ["In this course you have possibly used a multimeter, oscilloscope and logic probe depending on the equipment that you used in the experiments.  However, you should know what other types of test equipment are available to you.", "In this course you have possibly used a multimeter, oscilloscope and logic probe depending on the equipment that you used in the experiments. However, you should know what other types of test equipment are available to you..."], "jumps": ["P1660", "P1610"]}, {"id": "P1640", "text": ["In digital electronics, the oscilloscope and multimeter are used, along with several other types of test instruments."], "jumps": ["P1650", "P1610"]}, {"id": "P1630", "text": ["In DC circuits, the multimeter is the best choice for measuring circuit values of voltage, current and resistance.  In AC circuits, the oscilloscope is invaluable for determining the characteristics of waveforms.", "In DC circuits, the multimeter is the best choice for measuring circuit values of voltage, current and resistance. In AC circuits, the oscilloscope is invaluable for determining the characteristics of waveforms..."], "jumps": ["P1640", "P1610"]}, {"id": "P1620", "text": ["In each area of electronics, different types of test equipment provide the best means for circuit measurements.  Digital electronics is no exception.", "In each area of electronics, different types of test equipment provide the best means for circuit measurements. Digital electronics is no exception."], "jumps": ["P1630", "P1610"]}, {"id": "P1610", "text": ["Test Instruments  \nIn your studies of electronics, you have learned that multimeters and oscilloscopes are invaluable in determining correct circuit operation and for troubleshooting faulted circuits.", "Test Instruments In your studies of electronics, you have learned that multimeters and oscilloscopes are invaluable in determining correct circuit operation and for troubleshooting faulted circuits."], "jumps": ["P1620", "P1580"]}, {"id": "P1600", "text": ["In the experiment you will have the opportunity to use some of the test equipment discussed."], "jumps": ["P1610", "P1580"]}, {"id": "P1590", "text": ["However, it is just as important to know how to use other tools which can speed up the troubleshooting process.  This section of the lesson is not going to teach you how to use the most common troubleshooting tools, but it will introduce them to you.", "However, it is just as important to know how to use other tools which can speed up the troubleshooting process. This section of the lesson is not going to teach you how to use the most common troubleshooting tools, but it will introduce them to you..."], "jumps": ["P1600", "P1580"]}, {"id": "P1580", "text": ["Troubleshooting Tools \nA computer repair technician must select tools which are appropriate to the troubleshooting task.  Often you will choose tools that you are familiar with.", "Troubleshooting Tools A computer repair technician must select tools which are appropriate to the troubleshooting task. Often you will choose tools that you are familiar with.."], "jumps": ["P1590", "P1520"]}, {"id": "P1570", "text": ["Heat buildup may cause components to fail.  Dust, dirt and other airborne particles can also conduct electricity which can cause arcing and shorts.", "Heat buildup may cause components to fail. Dust, dirt and other airborne particles can also conduct electricity which can cause arcing and shorts."], "jumps": ["P1580", "P1520"]}, {"id": "P1560", "text": ["Another preventive maintenance action is routine cleaning.  Dust tends to stick to a printed circuit board.  When a printed circuit board gets coated by a layer of dust, the dust becomes an insulator and holds in the heat.", "Another preventive maintenance action is routine cleaning. Dust tends to stick to a printed circuit board. When a printed circuit board gets coated by a layer of dust, the dust becomes an insulator and holds in the heat..."], "jumps": ["P1570", "P1520"]}, {"id": "P1550", "text": ["So, at a convenient time, you re-adjust the power supply.  What you did was preventive maintenance:  you found a situation that may cause a failure later on and fixed it.", "So, at a convenient time, you re-adjust the power supply. What you did was preventive maintenance: you found a situation that may cause a failure later on and fixed it."], "jumps": ["P1560", "P1520"]}, {"id": "P1540", "text": ["However, you decide to measure the output voltages of the power supply.  The measurements show that the +5V to each chip is measuring +8V.  Even though the system operates correctly, the output voltage may eventually damage some of the chips in the microprocessor system.", "However, you decide to measure the output voltages of the power supply. The measurements show that the +5V to each chip is measuring +8V. Even though the system operates correctly, the output voltage may eventually damage some of the chips in the microprocessor system..."], "jumps": ["P1550", "P1520"]}, {"id": "P1530", "text": ["As the name implies, this maintenance is accomplished before the system has a chance to fail.  For example, suppose that your microprocessor is operating correctly and there are no signs of system failure.", "As the name implies, this maintenance is accomplished before the system has a chance to fail. For example, suppose that your microprocessor is operating correctly and there are no signs of system failure..."], "jumps": ["P1540", "P1520"]}, {"id": "P1520", "text": ["For a technician, troubleshooting is unavoidable, but the frequency of equipment failure can be dramatically reduced by eliminating potential problems before they begin.  This is accomplished by a process called Preventive Maintenance.", "For a technician, troubleshooting is unavoidable, but the frequency of equipment failure can be dramatically reduced by eliminating potential problems before they begin. This is accomplished by a process called Preventive Maintenance..."], "jumps": ["P1530", "P1510"]}, {"id": "P1513", "text": ["The pins of an IC should be moved AS LITTLE as possible.  It is easy to break one of the pins off of an IC.  Once a pin is broken, the IC is useless (unless that signal is not needed).", "The pins of an IC should be moved AS LITTLE as possible. It is easy to break one of the pins off of an IC. Once a pin is broken, the IC is useless (unless that signal is not needed).."], "jumps": []}, {"id": "P1512", "text": ["Some ICs cannot be directly soldered to a PC board.  The heat from the soldering iron may be too intense and cause damage to the internal or external structure.  Also, chip sockets are used to allow quick and easy removal of a bad  IC for replacement with a good one.", "Some ICs cannot be directly soldered to a PC board. The heat from the soldering iron may be too intense and cause damage to the internal or external structure. Also, chip sockets are used to allow quick and easy removal of a bad IC for replacement with a good one.."], "jumps": []}, {"id": "P1511", "text": [], "jumps": []}, {"id": "P1510", "text": ["Integrated circuits (ICs) should _______", "Most technicians, after practice, can insert and remove an IC by hand or with a screwdriver.  However, IC insertion and removal tools are manufactured and should be used whenever possible.  These tools make insertion and removal simple, and greatly reduce the risk of damaging an IC.", "Integrated circuits (ICs) should _______...................", "always be soldered directly to the PC board.", "have the pins bent in all different directions.", "Most technicians, after practice, can insert and remove an IC by hand or with a screwdriver. However, IC insertion and removal tools are manufactured and should be used whenever possible. These tools make insertion and removal simple, and greatly reduce the risk of damaging an IC..."], "jumps": ["P1500", "P1510", "P1440"]}, {"id": "P1490", "text": ["To remove an IC, lift up, being careful not to bend any pins.  This will require a rocking motion.  Ensure that one end of the IC is not completely removed before the other end because this will bend pins.", "To remove an IC, lift up, being careful not to bend any pins. This will require a rocking motion. Ensure that one end of the IC is not completely removed before the other end because this will bend pins..."], "jumps": ["P1500", "P1440"]}, {"id": "P1480", "text": ["To insert the IC, line up all its legs with the socket connectors and then press it down gently.  Ensure all legs have begun to slide into their appropriate socket locations before pushing the IC in the rest of the way.", "To insert the IC, line up all its legs with the socket connectors and then press it down gently. Ensure all legs have begun to slide into their appropriate socket locations before pushing the IC in the rest of the way..."], "jumps": ["P1490", "P1440"]}, {"id": "P1470", "text": ["Pin 1 of the IC should be inserted as shown below.  Remember, inserting a chip backwards can destroy the chip when power is applied.", "Pin 1 of the IC should be inserted as shown below. Remember, inserting a chip backwards can destroy the chip when power is applied."], "jumps": ["P1480", "P1440"]}, {"id": "P1460", "text": ["Before trying to insert an IC, check that its legs are straight and evenly spaced.  ICs have a dimple, dot or notch used for orientation.  The pins are numbered starting at 1 and go counterclockwise from the orientation mark.", "Before trying to insert an IC, check that its legs are straight and evenly spaced. ICs have a dimple, dot or notch used for orientation. The pins are numbered starting at 1 and go counterclockwise from the orientation mark..."], "jumps": ["P1470", "P1440"]}, {"id": "P1450", "text": ["Because of this, most ICs are now placed in sockets with the sockets soldered to the PC board before the IC is inserted.  In this way, IC chips can avoid heat-related damage.", "Because of this, most ICs are now placed in sockets with the sockets soldered to the PC board before the IC is inserted. In this way, IC chips can avoid heat-related damage."], "jumps": ["P1460", "P1440"]}, {"id": "P1440", "text": ["Installing ICs requires special attention and sometimes special equipment.  Soldering an IC, especially a CMOS chip, can destroy the device no matter how careful you are.", "Installing ICs requires special attention and sometimes special equipment. Soldering an IC, especially a CMOS chip, can destroy the device no matter how careful you are."], "jumps": ["P1450", "P1430"]}, {"id": "P1430", "text": ["The only sure method to determine the type of IC is to use the manufacturer's data books.  Many manufacturers include a date mark on the chip.  This date usually indicates the month and year the chip was made.  The date helps identify the chip, especially if the manufacturer changes the method used to identify the chip.", "The only sure method to determine the type of IC is to use the manufacturer's data books. Many manufacturers include a date mark on the chip. This date usually indicates the month and year the chip was made. The date helps identify the chip, especially if the manufacturer changes the method used to identify the chip. Other types of marking may include: * Manufacturer's part number * Inspection Markings * Source of Supply * Manufacturing locationnn", "Other types of markings may include: * Manufacturer's part number * Inspection Markings * Source of Supply * Manufacturing locationn Other manufacturers may put their names on the ICs, like NEC or Toshiba................................................................................................."], "jumps": ["P1440", "P1400"]}, {"id": "P1420", "text": ["Identification codes usually consist of three parts:  a prefix number, a device number, and a suffix.  However, each manufacturer uses a different type of code which, in most cases, is similar to this.", "Identification codes usually consist of three parts: a prefix number, a device number, and a suffix. However, each manufacturer uses a different type of code which, in most cases, is similar to this..."], "jumps": ["P1430", "P1400"]}, {"id": "P1410", "text": ["The only way you can be sure that the replacement IC is the same, is to check the specifications for both chips.  This requires knowing the manufacturer.  Many data books provide a cross-reference for direct replacement of an IC built by a different manufacturer.", "The only way you can be sure that the replacement IC is the same, is to check the specifications for both chips. This requires knowing the manufacturer. Many data books provide a cross-reference for direct replacement of an IC built by a different manufacturer.."], "jumps": ["P1420", "P1400"]}, {"id": "P1400", "text": ["Chip specifications can be looked up in the manufacturer's data books.  This information is very important when replacing an IC with one from a different manufacturer.", "Chip specifications can be looked up in the manufacturer's data books. This information is very important when replacing an IC with one from a different manufacturer."], "jumps": ["P1410", "P1390"]}, {"id": "P1390", "text": ["IC identification codes vary depending on the manufacturer.  Manufacturer recognition is important when replacing chips and researching IC data.  The list below describes some identifying marks by which you can recognize the IC manufacturer.", "IC identification codes vary depending on the manufacturer. Manufacturer recognition is important when replacing chips and researching IC data. The list below describes some identifying marks by which you can recognize the IC manufacturer. . Semiconductor Two parallel wavy lines Texas Instruments Outline of the state of Texas Other manufacturers may put their names on the ICs, like NEC or Toshiba.r names on the ICs, like NEC or Toshiba...", "Motorola : Letter M in a circle National Semiconductor : Two parallel wavy lines Texas Instruments : Outline of the state of Texas Other manufacturers may put their names on the IC's, like NEC or Toshiba................................................................................................-"], "jumps": ["P1400", "P1380"]}, {"id": "P1380", "text": ["Microprocessor systems use many integrated circuits.  These ICs look similar except for the number of pins and the labeling on the cases.  Pin number identification and proper IC placement are extremely important.", "Microprocessor systems use many integrated circuits. These ICs look similar except for the number of pins and the labeling on the cases. Pin number identification and proper IC placement are extremely important..."], "jumps": ["P1390", "P1370"]}, {"id": "P1372", "text": ["SOCKETS: Check that IC's are seated in their proper sockets properly, not tilted. When soldering sockets in place, solder diagonally opposite pins from the farthest corners first and check to see that the socket is flat against the circuit board. Then the remaining pins can be easily soldered into place. SWITCHES: Don't use solvents to clean switches and don't use a pencil to switch rocker switches. If substances get between the switch contacts, its operation may become impaired."], "jumps": ["P1380", "P1370"]}, {"id": "P1371", "text": ["HEADERS: Check that the header pins are straight before plugging a cable into them. These are the large rectangular connectors that are used to conect different section of the 8056 Microprocessor System together. LED's: LED's are easily damaged by soldering heat and applying too much voltage or current to them. RESISTORS: Value and tolerance can be determined from their color bands. Replace cracked or discolored resistors. While they are very rugged components, putting more power through them then what they were designed for can destroy them. Resistors have a power rating in watts. Typical resistors used in Nida Circuits are 1/4 (quarter) Watt."], "jumps": ["P1372", "P1370"]}, {"id": "P1370", "text": ["The following is a short summary of other component maintenance tips and precautions:", "CAPACITORS: Ceramics, mica and tantalum capacitors are not polarized, but the electrolytic capacitors are. If capacitors are cracked, replace them, and if they are electrolytic be sure not to put them in backwards. CRYSTALS: Crystal cases should be grounded. Crystals may be upset by strong emissions from the power supply of other instruments and may vibrate at a different frequency because of this. DIODES: Diodes must be put in the circuit with the correct polarity. FUSES: Don't rely on only visual check. Check fuses with an ohmmeter. fuses with an ohmmeter. k fuses with an ohmmeter. uses with an ohmmeter."], "jumps": ["P1371", "P1360"]}, {"id": "P1360", "text": ["Some options for the preventing damage to CMOS chips are:", "Some options for the preventing damage to CMOS chips are: aise the humidity of the room by use of humidifier, plants or an aquarium. * Use static free carpet. * Wear a ground strap on your wrist that is clipped to gound. * Don't touch more chips then you have to. * When picking up a chip, don't touch its pins; try to only touch the body.", "* Raise the humidity of the room by use of humidifier, plants or an aquarium. * Use static free carpet. * Wear a ground strap on your wrist that is clipped to gound. * Don't touch more chips then you have to. * When picking up a chip, don't touch its pins; try to only touch the body. the body.y.y.y.dy....."], "jumps": ["P1370", "P1330"]}, {"id": "P1350", "text": ["The reason that you don't get seriously injured from this shock is that there is very little current associated with it.  Current kills, not voltage.  However, static voltages as small as 250 volts can destroy or damage a CMOS chip.", "The reason that you don't get seriously injured from this shock is that there is very little current associated with it. Current kills, not voltage. However, static voltages as small as 250 volts can destroy or damage a CMOS chip..."], "jumps": ["P1360", "P1320"]}, {"id": "P1341", "text": ["Have you ever walked across carpet in the middle of winter while shuffling your feet, touched something metal and got an electric shock?  That electric shock you got was 50,000 or more volts!", "Have you ever walked across carpet in the middle of winter while shuffling your feet, touched something metal and got an electric shock? That electric shock you got was 50,000 or more volts!"], "jumps": ["P1350", "P1320"]}, {"id": "P1340", "text": ["Have you ever walked across carpet in the middle of winter while shuffling your feet, touched something metal and got an electric shock?  That electric shock you got was 50,000 or more volts!", "Have you ever walked across carpet in the middle of winter while shuffling your feet, touched something metal and got an electric shock? That electric shock you got was 50,000 or more volts!!!"], "jumps": []}, {"id": "P1330", "text": ["These are two of the most common technologies used in the construction of ICs. TTL chips can work at a higher speed but have high power consumption.  The CMOS is slower but uses less power than TTL.  CMOS is very susceptible to damage from static electricity.", "These are two of the most common technologies used in the construction of ICs. TTL chips can work at a higher speed but have high power consumption. The CMOS is slower but uses less power than TTL. CMOS is very susceptible to damage from static electricity..."], "jumps": ["P1340", "P1320"]}, {"id": "P1320", "text": ["There are two types of ICs used in the 8085 microprocessor system:  CMOS and TTL.  CMOS stands for Complimentary Metal Oxide Semiconductor and TTL stands for Transistor-Transistor Logic.", "There are two types of ICs used in the 8085 microprocessor system: CMOS and TTL. CMOS stands for Complimentary Metal Oxide Semiconductor and TTL stands for Transistor-Transistor Logic..."], "jumps": ["P1330", "P1300"]}, {"id": "P1310", "text": ["However, you cannot treat CMOS ICs in the same way.  Handling CMOS  ICs may destroy them by static discharges from the body.", "However, you cannot treat CMOS ICs in the same way. Handling CMOS ICs may destroy them by static discharges from the body.l"], "jumps": ["P1320", "P1300"]}, {"id": "P1300", "text": ["For instance, a resistor may be hand-carried, dropped, soldered in a board using plenty of heat and then have coffee poured on it, yet it still operates correctly in the circuit, as long as the coffee has dried.", "For instance, a resistor may be hand-carried, dropped, soldered in a board using plenty of heat and then have coffee poured on it, yet it still operates correctly in the circuit, as long as the coffee has dried..."], "jumps": ["P1310", "P1270"]}, {"id": "P1290", "text": ["Different precautions must be taken when handling various components of microprocessor circuits."], "jumps": ["P1300", "P1270"]}, {"id": "P1280", "text": ["Operating the system in the proper environment will help to prevent time consuming and expensive repairs in the future."], "jumps": ["P1290", "P1270"]}, {"id": "P1270", "text": ["There are certain environmental limitations in which a microprocessor system can be stored and operated:", "1. The system should not be stored in a dusty environment. 2. The system should only be operated within the manufacturer's specified temperature limitations. 3. The system should always be plugged into a grounded outlet. 4. The system must not be operated near an unshielded power supply of other equipment. Strong emissions from power supplies can force crystals to vibrate at the wrong frequency. 5. The system should always be turned off before attaching or detaching hardware from the system..pad and the display are working correctly? 4. How can you test that the other peripheral devices are working correctly?"], "jumps": ["P1280", "P1250"]}, {"id": "P1260", "text": ["When troubleshooting a microprocessor system, it is important to understand the sensitivity of the devices you are handling.  Be extremely careful to avoid introducing additional faults that would further complicate your task.", "Now that we have discussed the four step process of troubleshooting, let's discuss the proper handling of parts in a microprocessor system.", "When troubleshooting a microprocessor system, it is important to understand the sensitivity of the devices you are handling. Be extremely careful to avoid introducing additional faults that would further complicate your task..."], "jumps": ["P1270", "P1250", "P1260", "P1190"]}, {"id": "P1240", "text": ["If the fault could not cause the symptoms, go back to Step 1 to ensure that you observed the correct symptoms and then go to Step 3 for more measurements and tests."], "jumps": ["P1250", "P1190"]}, {"id": "P1230", "text": ["If the fault would definitely cause the symptoms (or part of the symptoms - you could have more than one fault), you can be assured that you located the fault.  Replace or repair the bad components and repeat Step 1 to ensure the equipment is 100% operational.", "If the fault would definitely cause the symptoms (or part of the symptoms - you could have more than one fault), you can be assured that you located the fault. Replace or repair the bad components and repeat Step 1 to ensure the equipment is 100% operational..."], "jumps": ["P1240", "P1190"]}, {"id": "P1220", "text": ["Step 4.  Double Check your Results\nAfter determining the possible fault, double check your work.  Assuming you have found the correct fault, analyze the circuit with the suspected fault to determine if the fault could cause the symptoms you observed in Step 1.", "Step 4. Double Check your Results After determining the possible fault, double check your work. Assuming you have found the correct fault, analyze the circuit with the suspected fault to determine if the fault could cause the symptoms you observed in Step 1..."], "jumps": ["P1230", "P1190"]}, {"id": "P1210", "text": ["Step 3. Measure and Test the System This is the step where you actually try to find the fault. Use the symptoms found in Step 1 to guide you to the area that could be causing the problem. Then use test equipment to measure and test the circuits. Once you think you have found the fault, go to Step 4..."], "jumps": ["P1220", "P1190"]}, {"id": "P1200", "text": ["To sum up, this step is used to make sure the symptoms observed in Step 1 are real and not created by incorrect system operation or misuse of test equipment.  If you are sure that there is a fault in the equipment, go to Step 3.", "To sum up, this step is used to make sure the symptoms observed in Step 1 are real and not created by incorrect system operation or misuse of test equipment. If you are sure that there is a fault in the equipment, go to Step 3.tructing the hardware properly."], "jumps": ["P1210", "P1190"]}, {"id": "P1190", "text": ["If the setup was not correct, make corrections and return to    Step 1.  Also, watch for software problems that might appear to be hardware faults.  There could be nothing wrong with the hardware and just the software is not instructing the hardware properly.", "If the setup was not correct, make corrections and return to Step 1. Also, watch for software problems that might appear to be hardware faults. There could be nothing wrong with the hardware and just the software is not instructing the hardware properly."], "jumps": ["P1200", "P1180"]}, {"id": "P1180", "text": ["Step 2.  Recheck the Setup  \nEnsure that you have set up the system and test equipment correctly.  Also, if calculations had to be performed in Step 1, make sure that you did the calculations correctly.  Look for any obvious mistakes.", "Step 2. Recheck the Setup Ensure that you have set up the system and test equipment correctly. Also, if calculations had to be performed in Step 1, make sure that you did the calculations correctly. Look for any obvious mistakes.", "Did you plug the system into a power source?", "Are you using the test equipment correctly?"], "jumps": ["P1190", "P1160"]}, {"id": "P1170", "text": ["The important point in this step is that you ARE NOT trying to fix the fault, only determining the symptoms.  Once you have listed all the symptoms, go to Step 2.", "The important point in this step is that you ARE NOT trying to fix the fault, only determining the symptoms. Once you have listed all the symptoms, go to Step 2."], "jumps": ["P1180", "P1160"]}, {"id": "P1160", "text": ["Step 1.  Analyze the System  \nCompare the operation of a system to how it should operate.  In other words, verify the symptoms.  Do not rely on second-hand observations.  Duplicate the problem.  This way you can see with a trained eye what the equipment is doing or not doing.", "Step 1. Analyze the System Compare the operation of a system to how it should operate. In other words, verify the symptoms. Do not rely on second-hand observations. Duplicate the problem. This way you can see with a trained eye what the equipment is doing or not doing."], "jumps": ["P1170", "P1120"]}, {"id": "P1150", "text": ["You may use the technique later on or use another.  The point is, you must follow a logical sequence when troubleshooting.  If you do not know one, this four step technique is one that will help you be an observant, methodical technician.", "You may use the technique later on or use another. The point is, you must follow a logical sequence when troubleshooting. If you do not know one, this four step technique is one that will help you be an observant, methodical technician..."], "jumps": ["P1160", "P1120"]}, {"id": "P1140", "text": ["There are many troubleshooting techniques that you may use to locate faults in a microprocessor system.  The technique given here is a simple four step process.", "There are many troubleshooting techniques that you may use to locate faults in a microprocessor system. The technique given here is a simple four step process."], "jumps": ["P1150", "P1120"]}, {"id": "P1130", "text": ["Once you are sure that you know about the microprocessor you are working on, then, and only then, should you begin troubleshooting."], "jumps": ["P1140", "P1120"]}, {"id": "P1120", "text": ["Before troubleshooting, think about the sections of the microprocessor and what role they play in the system operation.", "1. Which components are not necessary for successful execution of an interaction with the monitor program? Disconnecting all nonessential assemblies may make the machine operational again. In this case, you can deduce that the fault is in one of the disconnected devices, or the interfacing signals. 2. How can you check that the system is starting correctly when the power is applied? Which components are essential in starting the system? 3. How can you test that the keypad and the display are working correctly? 4. How can you test that the other peripheral devices are working correctly?"], "jumps": ["P1130", "P1040"]}, {"id": "P1110", "text": ["A fault in an essential function may be minor enough not to affect the basic system operations yet be responsible for a less noticeable fault."], "jumps": ["P1120", "P1040"]}, {"id": "P1100", "text": ["In this case, the technician may choose to begin investigating the suspect area without going through checks of the more essential system functions.  As a novice technician, you should be as thorough as possible in your observation of the essential functions.", "In this case, the technician may choose to begin investigating the suspect area without going through checks of the more essential system functions. As a novice technician, you should be as thorough as possible in your observation of the essential functions..."], "jumps": ["P1110", "P1040"]}, {"id": "P1090", "text": ["Occasionally, the fault may allow most of the microprocessor functions to work properly.  The symptoms may be specific enough to assure the experienced technician that the essential functions are working, and also allow the technician to deduce which area is causing the problem.", "Occasionally, the fault may allow most of the microprocessor functions to work properly. The symptoms may be specific enough to assure the experienced technician that the essential functions are working, and also allow the technician to deduce which area is causing the problem..."], "jumps": ["P1100", "P1040"]}, {"id": "P1080", "text": ["You must check the symptoms for yourself before probing into the microprocessor for the cause of these symptoms."], "jumps": ["P1090", "P1040"]}, {"id": "P1070", "text": ["Even if the user does supply a description of the fault symptoms, remember that the user is probably looking at it without the proper electronics knowledge to actually know what they are seeing wrong.", "Even if the user does supply a description of the fault symptoms, remember that the user is probably looking at it without the proper electronics knowledge to actually know what they are seeing wrong..."], "jumps": ["P1080", "P1040"]}, {"id": "P1060", "text": ["Much time can be wasted if the technician jumps to conclusions without sufficient evidence.  In most cases, you will be given equipment to troubleshoot with little information on the history of that particular piece of equipment.", "Much time can be wasted if the technician jumps to conclusions without sufficient evidence. In most cases, you will be given equipment to troubleshoot with little information on the history of that particular piece of equipment..."], "jumps": ["P1070", "P1040"]}, {"id": "P1050", "text": ["It is equally important for a technician to be methodical when troubleshooting.  The technician must always keep sight of the overall troubleshooting task and yet, at the same time, be attentive to details.", "It is equally important for a technician to be methodical when troubleshooting. The technician must always keep sight of the overall troubleshooting task and yet, at the same time, be attentive to details..."], "jumps": ["P1060", "P1040"]}, {"id": "P1040", "text": ["In order to troubleshoot, a technician must have an adequate understanding of both the equipment under test and the test equipment being used.  However, this alone does not make a good technician.", "In order to troubleshoot, a technician must have an adequate understanding of both the equipment under test and the test equipment being used. However, this alone does not make a good technician..."], "jumps": ["P1050", "P1001"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": ["P430"]}, {"id": "P430", "text": ["Let's begin the lesson on TROUBLESHOOTING THE 8085 MICROPROCESSOR..........."], "jumps": ["P410"]}, {"id": "P420", "text": ["The steps and approach to take while troubleshooting a microprocessor will be explained.  Understanding the troubleshooting technique will allow you to apply them to any troubleshooting needs.", "The steps and approach to take while troubleshooting a microprocessor will be explained. Understanding the troubleshooting technique will allow you to apply them to any troubleshooting needs..."], "jumps": ["P430", "P410"]}, {"id": "P410", "text": ["The technician would take the faulty equipment and find the problem.  Once the technician finds the fault the equipment can be fixed.  Troubleshooting is a methodical approach to finding a fault and fixing it.", "The technician would take the faulty equipment and find the problem. Once the technician finds the fault the equipment can be fixed. Troubleshooting is a methodical approach to finding a fault and fixing it..."], "jumps": ["P420", "P400"]}, {"id": "P400", "text": ["Would you throw away your computer if it was malfunctioning?  No, you would probably get it repaired or try to repair it yourself.  Most people would not throw away an expensive piece of equipment but rather give it to a technician to repair.", "Would you throw away your computer if it was malfunctioning? No, you would probably get it repaired or try to repair it yourself. Most people would not throw away a let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
