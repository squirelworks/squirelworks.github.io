: ["P420", "P400"]}, {"id": "P420", "text": ["Resistance measurements isolate the fault to either the resistor or the capacitor."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Knowing which measurement to use will help you easily identify RC series circuit faults."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on RC SERIES CIRCUIT TROUBLESHOOTING EXPERIMENT......"], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": ["P440"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The three most common faults for RC series circuits are open, short, and changed value.", "The three most common faults for RC series circuits are open, short, and changed value. Open Short Changed Value"], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Let's look at each fault separately to identify its effect on circuit operation and determine how to isolate the fault."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["This RC series circuit conducts current according to component values and develops a voltage drop across each component.", "This RC series circuit conducts current according to component values and develops a voltage drop across each component. .39", "8.0 V 6.0 V 10V 100 Hz"], "jumps": ["P1050", "P1020"]}, {"id": "P1045", "text": ["1 1 1 Xc = = = = 4.083 kW or 4 kW 2p", "c 6.28 x 100 Hz x 0.39 mF 0.24492 Rt = 3 kW Zt = Xc2 + Rt2 = 5 kW Ea 10 It = = = 2 mA Zt 5k Ec = Xc x It Er = R x It = 4kW x 2 mA = 3 kW x 2 mA = 8V = 6V"], "jumps": ["P1040"]}, {"id": "P1050", "text": ["The voltmeter indicates normal voltage drops for a properly operating RC series circuit."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["Select a faulted component and observe the change in circuit values.  Select NEXT when finished.", "Select a faulted component and observe the change in circuit values. Select NEXT when finished."], "jumps": ["P1570", "P1040", "P1170", "P1260", "P1440", "P1350", "P1070"]}, {"id": "P1067", "text": ["Select a faulted component and observe the change in circuit values.  Select NEXT when finished.", "Select a faulted component and observe the change in circuit values. Select NEXT when finished."], "jumps": ["P1570", "P1040", "P1170", "P1260", "P1350", "P1440", "P1070"]}, {"id": "P1070", "text": ["A circuit with a changed value resistor or capacitor changes circuit values."], "jumps": ["P1080", "P1067"]}, {"id": "P1080", "text": ["Measuring the voltage drops shows there is a problem in the circuit."], "jumps": ["P1090", "P1067"]}, {"id": "P1090", "text": ["However, voltage measurements cannot determine which component changed value."], "jumps": ["P1100", "P1067"]}, {"id": "P1100", "text": ["Since Er is less than the calculated value, resistance decreased in value or capacitance decreased in value (Xc increases)."], "jumps": ["P1110", "P1067"]}, {"id": "P1110", "text": ["Resistance measurements are used to determine which component changed value."], "jumps": ["P1120", "P1067"]}, {"id": "P1120", "text": ["Measure the resistance of R1 by opening S1.  NOTE: A multimeter cannot measure Xc.", "Measure the resistance of R1 by opening S1. NOTE: A multimeter cannot measure Xc. 39"], "jumps": ["P1130", "P1067"]}, {"id": "P1130", "text": ["The meter indicates that R1decreased to 1 kW.  The fault is a changed value resistor.", "The meter indicates that R1decreased to 1 kW. The fault is a changed value resistor."], "jumps": ["P1140", "P1067"]}, {"id": "P1140", "text": ["If the meter indicates R1 has not changed value, the fault is C1, a changed value capacitor.", "If the meter indicates R1 has not changed value, the fault is C1, a changed value capacitor.I"], "jumps": ["P1150", "P1067"]}, {"id": "P1150", "text": ["Calculating the circuit values when R1 equals 1 kW verifies the measured voltage drops.", "Calculating the circuit values when R1 equals 1 kW verifies the measured voltage drops. .39", "Calculated Values at 1 k", "9.6 V 2.4 V Er = 2.4 V Ec = 9.6 V", "Calc   i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
</body>
