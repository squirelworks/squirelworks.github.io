const book = {"title": "9395B312", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: PSK CIRCUIT TROUBLESHOOTING fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Determine if a PSK/QPSK transmitter and receiver system is operating correctly. w Identify the faulted component in a malfunctioning PSK/QPSK transmitter and receiver system................."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P301", "text": ["11. Nida Model 410 Frequency Counter XXXXXnt"], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P341", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will troubleshoot faults in a PSK/QPSK transmitter and receiver system."], "jumps": ["P410", "P301"]}, {"id": "P410", "text": ["The same process that is used to troubleshoot other signal processing systems is used to troubleshoot PSK/QPSK systems."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["You measure the input signal to the modulator and output signal of the demodulator to determine if the system is operating correctly."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["If the system isn't working properly, you determine if the fault is in the modulator, transmission medium or demodulator circuits."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Then you troubleshoot the associated circuitry of that system."], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["In this lesson you will determine if a PSK/QPSK system is operating properly, and if not, determine where the system is faulted.  We will then show you what the failed component is.", "In this lesson you will determine if a PSK/QPSK system is operating properly, and if not, determine where the system is faulted. We will then show you what the failed component is."], "jumps": ["P460", "P400"]}, {"id": "P460", "text": ["Let's begin the lesson on PSK CIRCUIT TROUBLESHOOTING....................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1020", "text": ["In this experiment you will determine whether or not a system is faulty, and if so, determine the location of the fault.", "The transmitter is located on the PC130-330 card.", "The transmitter is located on the PC130-330 card..........."], "jumps": ["P1040", "P1001", "P1050", "P1020", "P1045"]}, {"id": "P1050", "text": ["The transmitter consists of the components necessary to send PSK/QPSK data.", "The transmitter consists of the components necessary to send PSK/QPSK data.", "The receiver is located on the PC130-331 card.", "The receiver is located on the PC130-331 card.............."], "jumps": ["P1060", "P1040", "P1045", "P1070", "P1051", "P1065"]}, {"id": "P1070", "text": ["The receiver consists of the components necessary to demodulate PSK/QPSK signals.", "The receiver consists of the components necessary to demodulate PSK/QPSK signals."], "jumps": ["P1080", "P1060", "P1065"]}, {"id": "P1080", "text": ["To locate a fault you must first determine if the system is working properly."], "jumps": ["P1090", "P1071"]}, {"id": "P1090", "text": ["If the system is faulted, you determine finally which system is faulty."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["If you do not have a good signal on the output of the receiver, the system is faulted."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["If faulted, you determine if the transmitter or receiver is causing the problem."], "jumps": ["P1120", "P1080"]}, {"id": "P1120", "text": ["If the output of the transmitter is bad, the modulator circuits are causing the problem."], "jumps": ["P1130", "P1080"]}, {"id": "P1130", "text": ["If the output of the transmitter is good, the fault is in the transmission medium or receiver."], "jumps": ["P1140", "P1080"]}, {"id": "P1140", "text": ["If the input to the receiver is bad, the fault is in the transmission medium."], "jumps": ["P1150", "P1080"]}, {"id": "P1150", "text": ["If the input to the receiver is good, the demodulator circuits are faulted."], "jumps": ["P1160", "P1080"]}, {"id": "P1160", "text": ["Once the fault has been located, further oscilloscope or multimeter measurements will isolate the fault to a particular chip or component.  Remember, use an analog multimeter to check transistors.  Let's start the experiment.", "Once the fault has been located, further oscilloscope or multimeter measurements will isolate the fault to a particular chip or component. Remember, use an analog multimeter to check transistors. Let's start the experiment."], "jumps": ["P1170", "P1080"]}, {"id": "P1170", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P1160"]}, {"id": "P1180", "text": ["2.  Carefully place PC130-323 into the Test Console PC1 position. 3.  Carefully place PC130-330 into the Test Console PC2 position. 4.  Carefully place PC130-331 into the Test Console PC3 position.", "2. Carefully place PC130-323 into the Test Console PC1 position. 3. Carefully place PC130-330 into the Test Console PC2 position. 4. Carefully place PC130-331 into the Test Console PC3 position."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["5.  Set the Positive Supply Control to 12.  \n6.  Set the Negative Supply Control to 12.  The Voltmeter on the           130A should indicate 12 Volts.", "5. Set the Positive Supply Control to 12. 6. Set the Negative Supply Control to 12. The Voltmeter on the 130A should indicate 12 Volts.", "Alignment is critical for proper system operation."], "jumps": ["P1180"]}, {"id": "P1210", "text": ["7.  On PC130-323, set the controls as follows:", "7. On PC130-323, set the controls as follows: the PC1 DC switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON.........................................", "a. R2, R17, R29 to mid position b. S1, Frequency Range, to f9 c. S2, Freq, to LO d. S3, Data, to SET e. S4, Output, to CMOS f. S5, DATA SET, to 00000000", "MEASUREMENT SETUP - R2, R17, R29 to mid position. S1, Frequency Range, to f9. S2, Freq. to LO. S3, Data to SET. S4, Output to CMOS. S5, Data Set, to 00000000."], "jumps": ["P1190", "P1215"]}, {"id": "P1220", "text": ["8.  On PC130-330, set the OUTPUT potentiometer fully                            counterclockwise.\n9.  On PC130-331, set the three potentiometers to mid position.", "8. On PC130-330, set the OUTPUT potentiometer fully counterclockwise. 9. On PC130-331, set the three potentiometers to mid position.", "MEASUREMENT SETUP - Set OUTPUT potentiometer fully CCW.", "MEASUREMENT SETUP - Set the three potentiometers to mid position."], "jumps": ["P1230", "P1210", "P1225", "P1226", "P1220"]}, {"id": "P1230", "text": ["10.  Turn PC1 DC Power switch to ON.", "10. Turn PC1 DC Power switch to ON.l to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P1220"]}, {"id": "P1240", "text": ["11.  Using the frequency counter adjust PC130-323 C4 for a\n        8 kHz, \u00b1 .5 kHz signal as measured on TP6.", "11. Using the frequency counter adjust PC130-323 C4 for a 8 kHz,", "MEASUREMENT SETUP - Using a frequency counter, adjust C4 for a 8 kHz,"], "jumps": ["P1250", "P1230", "P1245"]}, {"id": "P1250", "text": ["12.  Remove the frequency counter from PC130-323 TP6 and                 place PC2 DC Power switch to ON.", "12. Remove the frequency counter from PC130-323 TP6 and place PC2 DC Power switch to ON."], "jumps": ["P1240"]}, {"id": "P1260", "text": ["13.  Set the oscilloscope up as follows:", "13. Set the oscilloscope up as follows:...................", "a. Volt/Div, CH1 and CH2 - 5 b. Time/Div - 20 ms c. Triggering - CH1, AC, + d. Display - Dual, DC e. S4, Output, to CMOS f. S5, DATA SET, to 00000000000"], "jumps": ["P1270", "P1250", "P1265"]}, {"id": "P1265", "text": ["OSCILLOSCOPE SETUP - Volts/Div, CH1 & CH2 - 5\n                                                  Time/Div - 20 ms \n                                                  Display Mode - DUAL, DC\n                                                  Triggering - CH1, AC, +", "OSCILLOSCOPE SETUP - Volts/Div, CH1 & CH2 - 5 Time/Div - 20 ms Display Mode - DUAL, DC Triggering - CH1, AC, +"], "jumps": []}, {"id": "P1270", "text": ["14.  Connect CH1 to PC130-330 TP3.\n15.  Connect CH2 to PC130-323 TP2.\n16.  Adjust PC130-323 R29 to synchronize the CH2 trace if                     needed.", "14. Connect CH1 to PC130-330 TP3. 15. Connect CH2 to PC130-323 TP2. 16. Adjust PC130-323 R29 to synchronize the CH2 trace if needed.", "MEASUREMENT SETUP - Connect CH2 oscilloscope probe to TP2. Adjust R29 to synchronize the CH2 trace if needed."], "jumps": ["P1280", "P1260", "P1275", "P1276", "P1270"]}, {"id": "P1280", "text": ["17.  Change the control settings of the oscilloscope as follows:", "17. Change the control settings of the oscilloscope as follows:", "a. Time/Div - 0.2 ms b. Triggering - EXT, AC, negative c. Display - dual AC d. Display - Dual, DC , DC , Output, to CMOS f. S5, DATA SET, to 00000000000"], "jumps": ["P1290", "P1270", "P1285"]}, {"id": "P1285", "text": ["OSCILLOSCOPE SETUP - Time/Div - 0.2 mS Triggering - EXT, AC, negative Display Mode - DUAL, AC"], "jumps": []}, {"id": "P1290", "text": ["18.  Connect the CH1 probe to PC130-330 TP7.\n19.  Connect the CH2 probe to PC130-330 f   Out TP.                       20.  Connect the external trigger to PC130-323 TP3.  Adjust                     triggering level to stabilize the display.", "18. Connect the CH1 probe to PC130-330 TP7. 19. Connect the CH2 probe to PC130-330 f Out TP. 20. Connect the external trigger to PC130-323 TP3. Adjust triggering level to stabilize the display.", "MEASUREMENT SETUP - Connect CH1 probe to TP7 and CH2 probe to f Out.", "MEASUREMENT SETUP - Connect EXT trigger to TP3. Adjust triggering to stabilize the display."], "jumps": ["P1300", "P1280", "P1295", "P1296", "P1290"]}, {"id": "P1300", "text": ["21.  Ensure S5 on PC130-323 is set to 00000000.  You should be            viewing 0 degree shifted signals and a sync cycle on                        channel 2.", "21. Ensure S5 on PC130-323 is set to 00000000. You should be viewing 0 degree shifted signals and a sync cycle on channel 2."], "jumps": ["P1305", "P1290"]}, {"id": "P1305", "text": ["22.  Close the number 1 switch on PC130-323 S5.  You should be          viewing PSK data with a HIGH signal present, 180\u00ba phase                shift along with the 0 degree phase-shifted cycles.", "22. Close the number 1 switch on PC130-323 S5. You should be viewing PSK data with a HIGH signal present, 180", "phase shift along with the 0 degree phase-shifted cycles."], "jumps": ["P1310", "P1300"]}, {"id": "P1310", "text": ["Verify that the PSK/QPSK modulator is operating correctly.", "Verify that the PSK/QPSK modulator is operating correctly.."], "jumps": ["P1320", "P1300", "P1312"]}, {"id": "P1312", "text": ["If the modulator circuit on PC130-330 is not set up correctly, DO NOT go on until the transmitter is aligned.", "Touch if you made adjustments and now have the PSK modulator circuit operating correctly. Touch to return to the modulator alignment procedures."], "jumps": ["P1310", "P1316"]}, {"id": "P1316", "text": ["A.  Turn PC1, PC2 and PC3 DC Power switches to OFF.", "A. Turn PC1, PC2 and PC3 DC Power switches to OFF. - Set the PC1 DC Switch to ON...."], "jumps": []}, {"id": "P1320", "text": ["1.  Place PC3 DC Power switch to ON.", "1. Place PC3 DC Power switch to ON.l to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P1310"]}, {"id": "P1330", "text": ["2.  Ensure S1 on PC130-323 to set to f9 and S5 is 00000000.\n3.  Place the oscilloscope controls as follows:", "2. Ensure S1 on PC130-323 to set to f9 and S5 is 00000000. 3. Place the oscilloscope controls as follows:", "a. Volt/Div - as required b. Time/Div - 0.2 ms c. Triggering - EXT, AC, negative d. Display - dual, AC , Output, to CMOS f. S5, DATA SET, to 00000000000", "MEASUREMENT SETUP - Ensure S1 is set to f9 and S5 is 00000000."], "jumps": ["P1340", "P1320", "P1335", "P1336"]}, {"id": "P1336", "text": [], "jumps": ["P1330", "P1335"]}, {"id": "P1340", "text": ["4.  Connect CH1 to PC130-330 TP7.\n5.  Connect CH2 to PC130-331 TP1.\n6.  Connect the external trigger to PC130-323 TP3.", "4. Connect CH1 to PC130-330 TP7. 5. Connect CH2 to PC130-331 TP1. 6. Connect the external trigger to PC130-323 TP3.", "MEASUREMENT SETUP - Connect CH1 probe to TP7.", "MEASUREMENT SETUP - Connect EXT trigger to TP3."], "jumps": ["P1350", "P1330", "P1345", "P1346", "P1347", "P1340"]}, {"id": "P1350", "text": ["7.  Adjust PC130-330 (modulator card) OUTPUT potentiometer for      a 2.5 Vpp signal on channel 2, input to demodulator.\n8.  Connect CH2 to PC130-331 TP5.\n9.  Adjust PC130-331 R4, SYNC, for a 2.5 Vpp signal on\n     channel 2.", "7. Adjust PC130-330 (modulator card) OUTPUT potentiometer for a 2.5 Vpp signal on channel 2, input to demodulator. 8. Connect CH2 to PC130-331 TP5. 9. Adjust PC130-331 R4, SYNC, for a 2.5 Vpp signal on channel 2.", "MEASUREMENT SETUP - Adjust OUTPUT potentiometer for a 2.5 Vpp signal on channel 2.", "MEASUREMENT SETUP - Connect CH2 to TP5 and adjust R4, SYNC, for a 2.5 Vpp signal on channel 2."], "jumps": ["P1360", "P1340", "P1355", "P1356", "P1350"]}, {"id": "P1360", "text": ["10.  Using the frequency counter, measure the frequency on                  PC130-330 (modulator) TP3.  Type in the measured                            frequency.", "10. Using the frequency counter, measure the frequency on PC130-330 (modulator) TP3. Type in the measured frequency."], "jumps": ["P1350", "P1362"]}, {"id": "P1361", "text": [], "jumps": []}, {"id": "P1362", "text": ["Ensure you are measuring the signal on the modulator card, PC130-330.  Also, check that TP3 is being measured.  This is f    of the modulator.", "Ensure you are measuring the signal on the modulator card, PC130-330. Also, check that TP3 is being measured. This is f of the modulator."], "jumps": []}, {"id": "P1367", "text": ["You still have not measured the correct frequency.  You should have measured around 8.00 kHz.", "You still have not measured the correct frequency. You should have measured around 8.00 kHz."], "jumps": ["P1360"]}, {"id": "P1370", "text": ["Type in the frequency for 4 fc.  fc =", "Type in the frequency for 4 fc. fc = %50 kHz storing numeric answer (5) in a variable.able.le."], "jumps": ["P1360", "P1372"]}, {"id": "P1371", "text": [], "jumps": []}, {"id": "P1372", "text": ["Check your calculations.  Multiply 4 times the fc value.", "Check your calculations. Multiply 4 times the fc value......"], "jumps": []}, {"id": "P1377", "text": ["You still have not entered the correct value of 4f  .  You should have entered:", "You still have not entered the correct value of 4f . You should have entered:"], "jumps": ["P1370"]}, {"id": "P1380", "text": ["11.  Place PC2 DC Power switch to OFF.\n12.  Using the frequency counter, connect the frequency counter         through a 4.7 kohm resistor to PC130-331 TP7.", "11. Place PC2 DC Power switch to OFF. 12. Using the frequency counter, connect the frequency counter through a 4.7 kohm resistor to PC130-331 TP7.", "MEASUREMENT SETUP - Connect a frequency counter through a 4.7 kohm resistor to TP7."], "jumps": ["P1370", "P1385"]}, {"id": "P1390", "text": ["13.  Adjust PC130-331 R20 for approximately the value of 4f  .\n       4f   = \n14.  Disconnect the frequency counter.\n15.  Place PC2 DC Power switch to ON.", "13. Adjust PC130-331 R20 for approximately the value of 4f . 4f = 14. Disconnect the frequency counter. 15. Place PC2 DC Power switch to ON."], "jumps": ["P1380"]}, {"id": "P1400", "text": ["16.  Set the oscilloscope for an external trigger from PC130-323             TP3.  Triggering EXT, AC, Negative.                                      \n17.  Connect the CH1 probe to PC130-330 TP7, f  .\n18.  Connect the CH2 probe to PC130-331 TP2, the output of                  amplifier number 2.", "16. Set the oscilloscope for an external trigger from PC130-323 TP3. Triggering EXT, AC, Negative. 17. Connect the CH1 probe to PC130-330 TP7, f . 18. Connect the CH2 probe to PC130-331 TP2, the output of amplifier number 2.", "MEASUREMENT SETUP - Connect EXT trigger to TP3.", "MEASUREMENT SETUP - Connect CH1 probe to TP7, f ."], "jumps": ["P1410", "P1390", "P1405", "P1406", "P1407", "P1400"]}, {"id": "P1410", "text": ["19.  Adjust the oscilloscope Time/Div and Time/Div Variable                   controls to display two cycles of f   on channel 1 (about \n       20 ms).  Adjust PC130-331 R11 so that the high level as                     seen on channel 2 is about 80% of the positive alternation as         seen on channel 1.", "19. Adjust the oscilloscope Time/Div and Time/Div Variable controls to display two cycles of f on channel 1 (about 20 ms). Adjust PC130-331 R11 so that the high level as seen on channel 2 is about 80% of the positive alternation as seen on channel 1."], "jumps": ["P1420", "P1400", "P1415"]}, {"id": "P1420", "text": ["21. Ensure that S5 on PC130-323 is set to 00000000 and S1 is set to f9. 22. Connect the CH1 probe to PC130-330 TP1, DATA IN. Use DC coupling--the signal is all 0's (0 volts). 23. Connect the CH2 probe to PC130-331 TP10, DATA. Use DC coupling.", "MEASUREMENT SETUP - Ensure S1 is set to f9 and S5 is 00000000.", "MEASUREMENT SETUP - Connect CH1 probe to TP1, DATA IN.", "MEASUREMENT SETUP - Connect the CH2 probe to TP10, DATA."], "jumps": ["P1430", "P1410", "P1425", "P1426", "P1427", "P1420"]}, {"id": "P1430", "text": ["24.  Change the Time/Div control to 50 ms calibrated.\n25.  If the CH2 trace is not 0 VDC, or if pulses appear, slightly                 adjust PC130-331 R11 so that there are no pulses visible.", "24. Change the Time/Div control to 50 ms calibrated. 25. If the CH2 trace is not 0 VDC, or if pulses appear, slightly adjust PC130-331 R11 so that there are no pulses visible."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["26.  Close the number 1 switch on PC130-323 S5.\n27.  Using the Time/Div Variable control, adjust the oscilloscope           sweep so that one complete cycle is shown on the CH1                   trace (leading edge of HIGH pulse to leading edge of next                HIGH pulse).", "26. Close the number 1 switch on PC130-323 S5. 27. Using the Time/Div Variable control, adjust the oscilloscope sweep so that one complete cycle is shown on the CH1 trace (leading edge of HIGH pulse to leading edge of next HIGH pulse)."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["You should be viewing one pulse on channel 2, the output of the demodulator."], "jumps": ["P1460", "P1440", "P1455"]}, {"id": "P1455", "text": ["NO PULSE ON CH2 - The circuit still needs fine adjustment.", "A. Slightly adjust PC130-331 R11 to bring in one HIGH pulse on CH2. B. Change the switch setting in S5 on PC130-323 to 00000000. C. Verify that the channel 2 trace is all zeroes. If not, slightly adjust PC130-331 R11 so no pulses are visible. D. Change the switch setting in S5 on PC130-323 to 100000000. If a HIGH pulse is not present on CH2, repeat steps."], "jumps": []}, {"id": "P1460", "text": ["28.  Close the switches on S5 of PC130-323 and view the output           of the demodulator.  Does the output signal on CH2 match              the input signal on CH1 (with a time difference)?", "28. Close the switches on S5 of PC130-323 and view the output of the demodulator. Does the output signal on CH2 match the input signal on CH1 (with a time difference)?"], "jumps": ["P1450"]}, {"id": "P1461", "text": [], "jumps": []}, {"id": "P1462", "text": ["The system is not set up correctly.  You need to check the alignment of the receiver.", "The system is not set up correctly. You need to check the alignment of the receiver.", "Touch if you made adjustments and now have the PSK modulator circuit operating correctly. Touch to return to the modulator alignment procedures."], "jumps": []}, {"id": "P1470", "text": ["The PSK system is operating correctly, There is no need to check the QPSK system since the modulator and demodulator work automatically in PSK or QPSK.  All troubleshooting problems are done in PSK.", "The PSK system is operating correctly, There is no need to check the QPSK system since the modulator and demodulator work automatically in PSK or QPSK. All troubleshooting problems are done in PSK."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["Notes for troubleshooting: 1. Use at least 00000000 and 10000000 inputs to the transmitter from PC130-323 to check out the system. 2. Use a 4.7 kohm resistor connected to your probe when measuring frequencies in the timing circuit of the demodulator."], "jumps": ["P1490", "P1470"]}, {"id": "P1490", "text": ["The computer will now insert a fault, or insert no fault, into the PSK system.  You are to determine whether or not the system is operating correctly.  If not, you are to localize the fault to either the transmitter or the receiver, then to the circuit, and then to the most probable chip or component.", "The computer will now insert a fault, or insert no fault, into the PSK system. You are to determine whether or not the system is operating correctly. If not, you are to localize the fault to either the transmitter or the receiver, then to the circuit, and then to the most probable chip or component..if the system is operating correctly, and if not, you are to locate the fault to the transmitter or receiver, to the circuit, and then to the most probable chip or component."], "jumps": ["P1480"]}, {"id": "P1530", "text": ["Would you like to try another troubleshooting experiment?", ". The experiment in this lesson is not setup to use the selected trainer.", "Would you like to try another troubleshooting experiment? No"], "jumps": []}, {"id": "P1540", "text": ["You have completed all the troubleshooting experiments for this lesson.  If you would like to try the troubleshooting experiments again, select PSK CIRCUIT TROUBLESHOOTING from the Lesson Menu.", "You have completed all the troubleshooting experiments for this lesson. If you would like to try the troubleshooting experiments again, select PSK CIRCUIT TROUBLESHOOTING from the Lesson Menu."], "jumps": []}, {"id": "P1550", "text": ["1. Return the Test Console to the initial control settings. nter the discussion text here."], "jumps": []}, {"id": "P1560", "text": ["Disconnect test equipment. \n     Carefully remove PC Cards.                           \n     Return all equipment to its proper storage area.", "Disconnect test equipment. Carefully remove PC Cards. Return all equipment to its proper storage area. area."], "jumps": []}, {"id": "P1570", "text": ["Set the Test Console Power OFF. Carefully remove the PC cards from the test console. Return all equipment to its proper storage area. .."], "jumps": []}, {"id": "P1910", "text": ["This completes the experiment on PSK CIRCUIT TROUBLESHOOTING."], "jumps": ["P1001", "P1570"]}, {"id": "P2000", "text": ["The PSK system may or may not be faulted; you must check using the oscilloscope.  Remember, if you lose sync, input  00000000 to generate a sync cycle.", "The PSK system may or may not be faulted; you must check using the oscilloscope. Remember, if you lose sync, input 00000000 to generate a sync cycle..................................."], "jumps": []}, {"id": "P2010", "text": ["1.  Measure the input signal of the transmitter on PC130-330 TP1        and the output signal of the receiver on PC130-331 TP10 to            determine if the PSK system is operating correctly.  Is the                PSK system operating correctly?", "1. Measure the input signal of the transmitter on PC130-330 TP1 and the output signal of the receiver on PC130-331 TP10 to determine if the PSK system is operating correctly. Is the PSK system operating correctly?"], "jumps": ["P2000"]}, {"id": "P2011", "text": [], "jumps": []}, {"id": "P2012", "text": ["The output signal of the receiver is incorrect.  It is zero volts, which does not match the input signal to the transmitter.  The PSK system is not operating correctly.", "The output signal of the receiver is incorrect. It is zero volts, which does not match the input signal to the transmitter. The PSK system is not operating correctly."], "jumps": []}, {"id": "P2020", "text": ["2.  Determine if the transmitter, transmission medium or receiver        is faulted by measuring the signals on PC130-330 f  Out and           on PC130-331 TP1 and comparing to the data input on\n     PC130-330 TP1.  Is the transmitter, transmission medium or            receiver faulted?", "2. Determine if the transmitter, transmission medium or receiver is faulted by measuring the signals on PC130-330 f Out and on PC130-331 TP1 and comparing to the data input on PC130-330 TP1. Is the transmitter, transmission medium or receiver faulted?"], "jumps": ["P2010"]}, {"id": "P2021", "text": [], "jumps": []}, {"id": "P2022", "text": ["The PSK output of the transmitter is incorrect; the signal for a HIGH input, 180\u00ba, is missing.  This means that the transmission medium will not operate correctly even if not faulted.", "The PSK output of the transmitter is incorrect; the signal for a HIGH input, 180", ", is missing. This means that the transmission medium will not operate correctly even if not faulted."], "jumps": []}, {"id": "P2023", "text": ["The PSK output of the transmitter is incorrect; the signal for a HIGH input, 180\u00ba, is missing.  This means that the receiver will not operate correctly even if not faulted.", "The PSK output of the transmitter is incorrect; the signal for a HIGH input, 180", ", is missing. This means that the receiver will not operate correctly even if not faulted."], "jumps": []}, {"id": "P2030", "text": ["At this point, see if you can determine which section of the transmitter is not operating correctly."], "jumps": ["P2040", "P2020", "P2035"]}, {"id": "P2040", "text": ["You should have noticed that IC2, which performs the phase shift, has a bad input to pin 13."], "jumps": ["P2044", "P2030"]}, {"id": "P2044", "text": ["From this we can determine that the fault is the IC2 op-amp and 180\u00ba phase signal.", "From this we can determine that the fault is the IC2 op-amp and 180"], "jumps": ["P2045", "P2040"]}, {"id": "P2045", "text": ["There are no signals applied due to an open.", "There are no signals applied due to an open................"], "jumps": ["P2050", "P2044"]}, {"id": "P2050", "text": ["In this case, the input to IC2d is open.", "In this case, the input to IC2d is open...................."], "jumps": ["P2060", "P2045"]}, {"id": "P2060", "text": ["The computer will now remove the fault. Check the output of the receiver on PC130-331 TP10 and verify the PSK system is operating correctly. If the output looks inverted or incorrect, turn PC2 power off and on a few times and the system should sync properly. If not, slight adjustments to R11 & R20 of PC130-331 may be needed."], "jumps": ["P2050"]}, {"id": "P5000", "text": ["The PSK system may or may not be faulted; you must check using the oscilloscope.  Remember, if you lose sync, input  00000000 to generate a sync cycle.", "The PSK system may or may not be faulted; you must check using the oscilloscope. Remember, if you lose sync, input 00000000 to generate a sync cycle..................................."], "jumps": []}, {"id": "P5010", "text": ["1.  Measure the input signal of the transmitter on PC130-330 TP1        and the output signal of the receiver on PC130-331 TP10 to            determine if the PSK system is operating correctly.  Is the                PSK system operating correctly?", "1. Measure the input signal of the transmitter on PC130-330 TP1 and the output signal of the receiver on PC130-331 TP10 to determine if the PSK system is operating correctly. Is the PSK system operating correctly?"], "jumps": ["P5000"]}, {"id": "P5011", "text": [], "jumps": []}, {"id": "P5012", "text": ["The output signal of the receiver is zero for any input data.  The PSK system is not operating correctly.", "The output signal of the receiver is zero for any input data. The PSK system is not operating correctly."], "jumps": []}, {"id": "P5020", "text": ["2.  Determine if the transmitter, transmission medium or receiver        is faulted by measuring the signals on PC130-330 f  Out and           on PC130-331 TP1, and comparing to the data input on\n     PC130-330 TP1.  Is the transmitter, transmission medium or            receiver faulted?", "2. Determine if the transmitter, transmission medium or receiver is faulted by measuring the signals on PC130-330 f Out and on PC130-331 TP1, and comparing to the data input on PC130-330 TP1. Is the transmitter, transmission medium or receiver faulted?"], "jumps": ["P5010"]}, {"id": "P5021", "text": [], "jumps": []}, {"id": "P5022", "text": ["The output signal from the transmitter is correct, a phase shifted signal for HIGHs.  The transmitter is not faulted.", "The output signal from the transmitter is correct, a phase shifted signal for HIGHs. The transmitter is not faulted."], "jumps": []}, {"id": "P5023", "text": ["The output signal from the transmitter and the input signal to the receiver are correct, a phase shifted signal for HIGHs.  The transmission medium is not faulted.", "The output signal from the transmitter and the input signal to the receiver are correct, a phase shifted signal for HIGHs. The transmission medium is not faulted."], "jumps": []}, {"id": "P5030", "text": ["At this point, see if you can determine which section of the receiver is not working properly."], "jumps": ["P5040", "P5020", "P5035"]}, {"id": "P5040", "text": ["You should have noticed that IC8, the output register, has a bad input.  Pin 8 should have had a high input and instead it has a low input.", "You should have noticed that IC8, the output register, has a bad input. Pin 8 should have had a high input and instead it has a low input."], "jumps": ["P5044", "P5030"]}, {"id": "P5044", "text": ["This low input to pin 8 of IC8 is causing the output register to operate incorrectly, therefore faulting the system."], "jumps": ["P5060", "P5040"]}, {"id": "P5060", "text": ["The computer will now remove the fault. Check the output of the receiver on PC130-331 TP10 and verify the PSK system is operating correctly. If the output looks inverted or incorrect turn PC2 Power off and on a few times and the system should sync properly. If not, slight adjustments to R11 & R20 of PC130-331 may be needed."], "jumps": ["P5044"]}, {"id": "P6000", "text": ["The PSK system may or may not be faulted; you must check using the oscilloscope.  Remember, if you lose sync, input  00000000 to generate a sync cycle.", "The PSK system may or may not be faulted; you must check using the oscilloscope. Remember, if you lose sync, input 00000000 to generate a sync cycle..................................."], "jumps": []}, {"id": "P6010", "text": ["1.  Measure the input signal of the transmitter on PC130-330 TP1        and the output signal of the receiver on PC130-331 TP10 to            determine if the PSK system is operating correctly.  Is the                PSK system operating correctly?", "1. Measure the input signal of the transmitter on PC130-330 TP1 and the output signal of the receiver on PC130-331 TP10 to determine if the PSK system is operating correctly. Is the PSK system operating correctly?"], "jumps": ["P6000"]}, {"id": "P6011", "text": [], "jumps": []}, {"id": "P6012", "text": ["The output signal of the receiver matches the input signal to the transmitter.  The PSK system is operating correctly.", "The output signal of the receiver matches the input signal to the transmitter. The PSK system is operating correctly."], "jumps": []}, {"id": "P6020", "text": ["Congratulations, you determined that the PSK system has no faults."], "jumps": ["P6010"]}, {"id": "P13020", "text": ["In this experiment you will determine whether or not a system is faulty, and if so, determine the location of the fault.", "The transmitter is located on the PC130-330 card.", "The transmitter is located on the PC130-330 card..........."], "jumps": ["P13040", "P1001", "P13050", "P13020", "P13045"]}, {"id": "P13050", "text": ["The transmitter consists of the components necessary to send PSK/QPSK data.", "The transmitter consists of the components necessary to send PSK/QPSK data.", "The receiver is located on the PC130-331 card.", "The receiver is located on the PC130-331 card.............."], "jumps": ["P13060", "P13040", "P13045", "P13070", "P13050", "P13065"]}, {"id": "P13070", "text": ["The receiver consists of the components necessary to demodulate PSK/QPSK signals.", "The receiver consists of the components necessary to demodulate PSK/QPSK signals."], "jumps": ["P13080", "P13060", "P13065"]}, {"id": "P13080", "text": ["To locate a fault you must first determine if the system is working properly."], "jumps": ["P13090", "P13071"]}, {"id": "P13090", "text": ["If the system is faulted, you determine finally which system is faulty."], "jumps": ["P13100", "P13080"]}, {"id": "P13100", "text": ["If you do not have a good signal on the output of the receiver, the system is faulted."], "jumps": ["P13110", "P13080"]}, {"id": "P13110", "text": ["If faulted, you determine if the transmitter or receiver is causing the problem."], "jumps": ["P13120", "P13080"]}, {"id": "P13120", "text": ["If the output of the transmitter is bad, the modulator circuits are causing the problem."], "jumps": ["P13130", "P13080"]}, {"id": "P13130", "text": ["If the output of the transmitter is good, the fault is in the transmission medium or receiver."], "jumps": ["P13140", "P13080"]}, {"id": "P13140", "text": ["If the input to the receiver is bad, the fault is in the transmission medium."], "jumps": ["P13150", "P13080"]}, {"id": "P13150", "text": ["If the input to the receiver is good, the demodulator circuits are faulted."], "jumps": ["P13160", "P13080"]}, {"id": "P13160", "text": ["Once the fault has been located, further oscilloscope or multimeter measurements will isolate the fault to a particular chip or component.  Remember, use an analog multimeter to check transistors.  Let's start the experiment.", "Once the fault has been located, further oscilloscope or multimeter measurements will isolate the fault to a particular chip or component. Remember, use an analog multimeter to check transistors. Let's start the experiment."], "jumps": ["P13170", "P13080"]}, {"id": "P13170", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13160"]}, {"id": "P13180", "text": ["2.  Carefully place PC130-323 into the Test Console PC1 position. 3.  Carefully place PC130-330 into the Test Console PC2 position. 4.  Carefully place PC130-331 into the Test Console PC3 position.", "2. Carefully place PC130-323 into the Test Console PC1 position. 3. Carefully place PC130-330 into the Test Console PC2 position. 4. Carefully place PC130-331 into the Test Console PC3 position."], "jumps": ["P13190"]}, {"id": "P13190", "text": ["5.  Press Enter to Set: Positive Supply Control -  12 \n6.  Press Enter to Set: Negative Supply Control -  12", "5. Press Enter to Set: Positive Supply Control - 12 6. Press Enter to Set: Negative Supply Control - 12", "Alignment is critical for proper system operation."], "jumps": ["P13180"]}, {"id": "P13210", "text": ["7.  On PC130-323, set the controls as follows:", "7. On PC130-323, set the controls as follows:.............", "a. R2, R17, R29 to mid position b. S1, Frequency Range, to f9 c. S2, Freq, to LO d. S3, Data, to SET e. S4, Output, to CMOS f. S5, DATA SET, to 00000000", "MEASUREMENT SETUP - R2, R17, R29 to mid position. S1, Frequency Range, to f9. S2, Freq. to LO. S3, Data to SET. S4, Output to CMOS. S5, Data Set, to 00000000."], "jumps": ["P13220", "P13215"]}, {"id": "P13220", "text": ["8.  On PC130-330, set the OUTPUT potentiometer fully \n     counterclockwise.\n9.  On PC130-331, set the three potentiometers to mid position.", "8. On PC130-330, set the OUTPUT potentiometer fully counterclockwise. 9. On PC130-331, set the three potentiometers to mid position.", "MEASUREMENT SETUP - Set OUTPUT potentiometer fully CCW.", "MEASUREMENT SETUP - Set the three potentiometers to mid position."], "jumps": ["P13230", "P13210", "P13225", "P13226", "P"]}, {"id": "P13230", "text": ["10.  Press Enter to Set: PC1 DC Power Switch - ON", "10. Press Enter to Set: PC1 DC Power Switch - ON.........................."], "jumps": ["P13220"]}, {"id": "P13240", "text": ["11.  Using the frequency counter adjust PC130-323 C4 for a \n        8 kHz, \u00b1 .5 kHz signal as measured on TP6.", ress Enter to Set: PC1, PC2 and PC3 DC Power - OFFFFFFFFF............."], "jumps": ["P13310"]}, {"id": "P13320", "text": ["1.  Press Enter to Set: PC3 DC Power Switch - ON", "1. Press Enter to Set: PC3 DC Power Switch - ON..........................."], "jumps": ["P13310"]}, {"id": "P13330", "text": ["2.  Ensure S1 on PC130-323 to set to f9 and S5 is 00000000.\n3.  Place the oscilloscope controls as follows:", "2. Ensure S1 on PC130-323 to set to f9 and S5 is 00000000. 3. Place the oscilloscope controls as follows:", "a. Volt/Div - as required b. Time/Div - 0.2ms c. Triggering - EXT, AC, negative d. Display - dual, AC , Output, to CMOS f. S5, DATA SET, to 00000000000", "MEASUREMENT SETUP - Ensure S1 is set to f9 and S5 is 00000000."], "jumps": ["P13340", "P13335", "P13336"]}, {"id": "P13336", "text": [], "jumps": ["P13330", "P13335"]}, {"id": "P13340", "text": ["4.  Connect CH1 to PC130-330 TP7.\n5.  Connect CH2 to PC130-331 TP1.\n6.  Connect the external trigger to PC130-323 TP3.", "4. Connect CH1 to PC130-330 TP7. 5. Connect CH2 to PC130-331 TP1. 6. Connect the external trigger to PC130-323 TP3.", "MEASUREMENT SETUP - Connect CH1 probe to TP7.", "MEASUREMENT SETUP - Connect EXT trigger to TP3."], "jumps": ["P13350", "P13330", "P13345", "P13346", "P13347", "P13340"]}, {"id": "P13350", "text": ["7.  Adjust PC130-330 (modulator card) OUTPUT potentiometer for      a 2.5 Vpp signal on channel 2, input to demodulator.\n8.  Connect CH2 to PC130-331 TP5.\n9.  Adjust PC130-331 R4, SYNC, for a 2.5 Vpp signal on \n     channel 2.", "7. Adjust PC130-330 (modulator card) OUTPUT potentiometer for a 2.5 Vpp signal on channel 2, input to demodulator. 8. Connect CH2 to PC130-331 TP5. 9. Adjust PC130-331 R4, SYNC, for a 2.5 Vpp signal on channel 2.", "MEASUREMENT SETUP - Adjust OUTPUT potentiometer for a 2.5 Vpp signal on channel 2.", "MEASUREMENT SETUP - Connect CH2 to TP5 and adjust R4, SYNC, for a 2.5 Vpp signal on channel 2."], "jumps": ["P13360", "P13340", "P13355", "P13356", " uency counter through a 4.7 kohm resistor to TP7."], "jumps": ["P13370", "P13385"]}, {"id": "P13390", "text": ["13.  Adjust PC130-331 R20 for approximately the value of 4f  .\n        4f   = \n14.  Disconnect the frequency counter.\n15.  Press Enter to Set: PC2 DC Power Switch - ON", "13. Adjust PC130-331 R20 for approximately the value of 4f . 4f = 14. Disconnect the frequency counter. 15. Press Enter to Set: PC2 DC Power Switch - ON"], "jumps": []}, {"id": "P13400", "text": ["16.  Set the oscilloscope for an external trigger from PC130-323             TP3. Triggering EXT, AC, Negative.\n17.  Connect the CH1 probe to PC130-330 TP7, f  . \n18.  Connect the CH2 probe to PC130-331 TP2, the output of                  amplifier number 2.", "16. Set the oscilloscope for an external trigger from PC130-323 TP3. Triggering EXT, AC, Negative. 17. Connect the CH1 probe to PC130-330 TP7, f . 18. Connect the CH2 probe to PC130-331 TP2, the output of amplifier number 2.", "MEASUREMENT SETUP - Connect EXT trigger to TP3.", "MEASUREMENT SETUP - Connect CH1 probe to TP7, f ."], "jumps": ["P13410", "P13405", "P13406", "P13407", "P13400"]}, {"id": "P13410", "text": ["19.  Adjust the oscilloscope Time/Div and Time/Div Variable                   controls to display two cycles of f   on channel 1 (about \n       20 ms).  Adjust PC130-331 R11 so that the high level as seen           on channel 2 is about 80% of the positive alternation as seen         on channel 1.", "19. Adjust the oscilloscope Time/Div and Time/Div Variable controls to display two cycles of f on channel 1 (about 20 ms). Adjust PC130-331 R11 so that the high level as seen on channel 2 is about 80% of the positive alternation as seen on channel 1."], "jumps": ["P13420", "P13400", "P13415"]}, {"id": "P13420", "text": ["21. Ensure that S5 on PC130-323 is set to 00000000 and S1 is set to f9. 22. Connect the CH1 probe to PC130-330 TP1, DATA IN. Use DC coupling--the signal is all 0's (0 volts). 23. Connect the CH2 probe to PC130-331 TP10, DATA. Use DC coupling.", "MEASUREMENT SETUP - Ensure S1 is set to f9 and S5 is 00000000.", "MEASUREMENT SETUP - Connect CH1 probe to TP1, DATA IN.", "MEASUREMENT SETUP - Connect the CH2 probe to TP10, DATA."], "jumps": ["P13430", "P13410", "P13425", "P13426", "P13427", "P13420"]}, {"id": "P13430", "text": ["24.  Change the Time/Div control to 50 ms calibrated.\n25.  If the CH2 trace is not 0 VDC, or if pulses appear, slightly                 adjust PC130-331 R11 so that there are no pulses visible.", "24. Change the Time/Div control to 50 ms calibrated. 25. If the CH2 trace is not 0 VDC, or if pulses appear, slightly adjust PC130-331 R11 so that there are no pulses visible."], "jumps": ["P13440", "P13420"]}, {"id": "P13440", "text": ["26.  Close the number 1 switch on PC130-323 S5. \n27.  Using the Time/Div Variable control, adjust the oscilloscope          sweep so that one complete cycle is shown on the CH1 trace        (leading edge of HIGH pulse to leading edge of next HIGH               pulse).", "26. Close the number 1 switch on PC130-323 S5. 27. Using the Time/Div Variable control, adjust the oscilloscope sweep so that one complete cycle is shown on the CH1 trace (leading edge of HIGH pulse to leading edge of next HIGH pulse)."], "jumps": ["P13450", "P13430"]}, {"id": "P13450", "text": ["You should be viewing one pulse on channel 2, the output of the demodulator."], "jumps": ["P13460", "P13440", "P13455"]}, {"id": "P13455", "text": ["NO PULSE ON CH2 - The circuit still needs fine adjustment.", "A. Slightly adjust PC130-331 R11 to bring in one HIGH pulse on CH2. B. Change the switch setting in S5 on PC130-323 to 00000000. C. Verify that the channel 2 trace is all zeroes. If not, slightly adjust PC130-331 R11 so no pulses are visible. D. Change the switch setting in S5 on PC130-323 to 100000000. If a HIGH pulse is not present on CH2, repeat steps."], "jumps": []}, {"id": "P13460", "text": ["28.  Close the switches on S5 of PC130-323 and view the output           of the demodulator.  Does the output signal on CH2 match              the input signal on CH1 (with a time difference)?", "28. Close the switches on S5 of PC130-323 and view the output of the demodulator. Does the output signal on CH2 match the input signal on CH1 (with a time difference)?"], "jumps": ["P13450"]}, {"id": "P13461", "text": [], "jumps": []}, {"id": "P13462", "text": ["The system is not set up correctly.  You need to check the alignment of the receiver.", "The system is not set up correctly. You need to check the alignment of the receiver.", "Touch if you made adjustments and now have the PSK modulator circuit operating correctly. Touch to return to the modulator alignment procedures."], "jumps": ["P13460", "P13330"]}, {"id": "P13470", "text": ["The PSK system is operating correctly, There is no need to check the QPSK system since the modulator and demodulator work automatically in PSK or QPSK.  All troubleshooting problems are done in PSK.", "The PSK system is operating correctly, There is no need to check the QPSK system since the modulator and demodulator work automatically in PSK or QPSK. All troubleshooting problems are done in PSK."], "jumps": ["P13480", "P13460"]}, {"id": "P13480", "text": ["Notes for troubleshooting: 1. Use at least 00000000 and 10000000 inputs to the transmitter from PC130-323 to check out the system. 2. Use a 4.7 kohm resistor connected to your probe when measuring frequencies in the timing circuit of the demodulator."], "jumps": ["P13490", "P13470"]}, {"id": "P13490", "text": ["The computer will now insert a fault, or insert no fault, into the PSK system.  You are to determine whether or not the system is operating correctly.  If not, you are to localize the fault to either the transmitter or the receiver, then to the circuit, and then to the most probable chip or component.", "The computer will now insert a fault, or insert no fault, into the PSK system. You are to determine whether or not the system is operating correctly. If not, you are to localize the fault to either the transmitter or the receiver, then to the circuit, and then to the most probable chip or component."], "jumps": ["P13480"]}, {"id": "P14000", "text": ["The PSK system may or may not be faulted; you must check using the oscilloscope.  Remember, if you lose sync, input  00000000 to generate a sync cycle.", "The PSK system may or may not be faulted; you must check using the oscilloscope. Remember, if you lose sync, input 00000000 to generate a sync cycle."], "jumps": []}, {"id": "P14010", "text": ["1.  Measure the input signal of the transmitter on PC130-330 TP1        and the output signal of the receiver on PC130-331 TP10 to            determine if the PSK system is operating correctly.  Is the PSK      system operating correctly?", "1. Measure the input signal of the transmitter on PC130-330 TP1 and the output signal of the receiver on PC130-331 TP10 to determine if the PSK system is operating correctly. Is the PSK system operating correctly?"], "jumps": []}, {"id": "P14011", "text": [], "jumps": []}, {"id": "P14012", "text": ["The output signal of the receiver is incorrect.  It is zero volts, which does not match the input signal to the transmitter.  The PSK system is not operating correctly.", "The output signal of the receiver is incorrect. It is zero volts, which does not match the input signal to the transmitter. The PSK system is not operating correctly."], "jumps": []}, {"id": "P14020", "text": ["2.  Determine if the transmitter, transmission medium or receiver        is faulted by measuring the signals on PC130-330 fcout and           on PC130-331 TP1 and comparing to the data input on\n     PC130-330 TP1.  Is the transmitter, transmission medium or            receiver faulted?", "2. Determine if the transmitter, transmission medium or receiver is faulted by measuring the signals on PC130-330 fcout and on PC130-331 TP1 and comparing to the data input on PC130-330 TP1. Is the transmitter, transmission medium or receiver faulted?"], "jumps": ["P14010"]}, {"id": "P14021", "text": [], "jumps": []}, {"id": "P14022", "text": ["The PSK output of the transmitter is incorrect; the signal for a HIGH input, 180\u00ba, is missing.  This means that the transmission medium will not operate correctly even if not faulted.", "The PSK output of the transmitter is incorrect; the signal for a HIGH input, 180", ", is missing. This means that the transmission medium will not operate correctly even if not faulted."], "jumps": []}, {"id": "P14023", "text": ["The PSK output of the transmitter is incorrect; the signal for a HIGH input, 180\u00ba, is missing.  This means that the receiver will not operate correctly even if not faulted.", "The PSK output of the transmitter is incorrect; the signal for a HIGH input, 180", ", is missing. This means that the receiver will not operate correctly even if not faulted."], "jumps": []}, {"id": "P14030", "text": ["At this point, see if you can determine which section of the transmitter is not operating correctly."], "jumps": ["P14040", "P14020", "P14035"]}, {"id": "P14040", "text": ["You should have noticed that IC2, which performs the phase shift, has a bad input to pin 13."], "jumps": ["P14044", "P14030"]}, {"id": "P14044", "text": ["From this we can determine that the fault is the IC2 op-amp and 180\u00ba phase signal.", "From this we can determine that the fault is the IC2 op-amp and 180"], "jumps": ["P14045", "P14040"]}, {"id": "P14045", "text": ["There are no signals applied due to an open.", "There are no signals applied due to an open................"], "jumps": ["P14050", "P14044"]}, {"id": "P14050", "text": ["In this case, the input to IC2d is open.", "In this case, the input to IC2d is open...................."], "jumps": ["P14060", "P14045", "P14035"]}, {"id": "P14060", "text": ["The computer will now remove the fault. Check the output of the receiver on PC130-331 TP10 and verify the PSK system is operating correctly. If the output looks inverted or incorrect, turn PC2 power off and on a few times and the system should sync properly. If not, slight adjustments to R11 & R20 of PC130-331 may be needed."], "jumps": ["P14050"]}, {"id": "P15000", "text": ["The PSK system may or may not be faulted; you must check using the oscilloscope.  Remember, if you lose sync, input  00000000 to generate a sync cycle.", "The PSK system may or may not be faulted; you must check using the oscilloscope. Remember, if you lose sync, input 00000000 to generate a sync cycle.."], "jumps": []}, {"id": "P15010", "text": ["1.  Measure the input signal of the transmitter on PC130-330 TP1        and the output signal of the receiver on PC130-331 TP10 to            determine if the PSK system is operating correctly.  Is the                PSK system operating correctly?", "1. Measure the input signal of the transmitter on PC130-330 TP1 and the output signal of the receiver on PC130-331 TP10 to determine if the PSK system is operating correctly. Is the PSK system operating correctly?"], "jumps": []}, {"id": "P15011", "text": [], "jumps": []}, {"id": "P15012", "text": ["The output signal of the receiver is zero for any input data.  The PSK system is not operating correctly.", "The output signal of the receiver is zero for any input data. The PSK system is not operating correctly."], "jumps": []}, {"id": "P15020", "text": ["2.  Determine if the transmitter, transmission medium or receiver         is faulted by measuring the signals on PC130-330 f  Out and           on PC130-331 TP1, and comparing to the data input on\n      PC130-330 TP1.  Is the transmitter, transmission medium or            receiver faulted?", "2. Determine if the transmitter, transmission medium or receiver is faulted by measuring the signals on PC130-330 f Out and on PC130-331 TP1, and comparing to the data input on PC130-330 TP1. Is the transmitter, transmission medium or receiver faulted?"], "jumps": ["P15010"]}, {"id": "P15021", "text": [], "jumps": []}, {"id": "P15022", "text": ["The output signal from the transmitter is correct, a phase shifted signal for HIGHs.  The transmitter is not faulted.", "The output signal from the transmitter is correct, a phase shifted signal for HIGHs. The transmitter is not faulted."], "jumps": []}, {"id": "P15023", "text": ["The output signal from the transmitter and the input signal to the receiver are correct, a phase shifted signal for HIGHs.  The transmission medium is not faulted.", "The output signal from the transmitter and the input signal to the receiver are correct, a phase shifted signal for HIGHs. The transmission medium is not faulted."], "jumps": []}, {"id": "P15030", "text": ["At this point, see if you can determine which section of the receiver is not working properly."], "jumps": ["P15040", "P15020", "P15035"]}, {"id": "P15040", "text": ["You should have noticed that IC8, the output register, has a bad input.  Pin 8 should have had a high input and instead it has a low input.", "You should have noticed that IC8, the output register, has a bad input. Pin 8 should have had a high input and instead it has a low input."], "jumps": ["P15044", "P15030"]}, {"id": "P15044", "text": ["This low input to pin 8 of IC8 is causing the output register to operate incorrectly, therefore faulting the system."], "jumps": ["P15060", "P15040"]}, {"id": "P15060", "text": ["The computer will now remove the fault. Check the output of the receiver on PC130-331 TP10 and verify the PSK system is operating correctly. If the output looks inverted or incorrect turn PC2 Power off and on a few times and the system should sync properly. If not, slight adjustments to R11 & R20 of PC130-331 may be needed."], "jumps": ["P15044"]}, {"id": "P16000", "text": ["The PSK system may or may not be faulted; you must check using the oscilloscope.  Remember, if you lose sync, input  00000000 to generate a sync cycle.", "The PSK system may or may not be faulted; you must check using the oscilloscope. Remember, if you lose sync, input 00000000 to generate a sync cycle."], "jumps": []}, {"id": "P16010", "text": ["1.  Measure the input signal of the transmitter on PC130-330 TP1        and the output signal of the receiver on PC130-331 TP10 to            determine if the PSK system is operating correctly.  Is the PSK      system operating correctly?", "1. Measure the input signal of the transmitter on PC130-330 TP1 and the output signal of the receiver on PC130-331 TP10 to determine if the PSK system is operating correctly. Is the PSK system operating correctly?"], "jumps": ["P16000"]}, {"id": "P16011", "text": [], "jumps": []}, {"id": "P16012", "text": ["The output signal of the receiver matches the input signal to the transmitter.  The PSK system is operating correctly.", "The output signal of the receiver matches the input signal to the transmitter. The PSK system is operating correctly."], "jumps": []}, {"id": "P16020", "text": ["Congratulations, you determined that the PSK system has no faults."], "jumps": ["P16010"]}, {"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 12-07-99 Converted from storyboard to toolbook. frieda 12-07-99 Set up Random experiment pages. frieda 01-07-00 Text & Branching - lisa 02-23-00 Graphics by Chris 03-24-00 CAI Lesson Checklist by Chris 07-14-00 Converted to ToolBook 7.1 format. jay 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-07-02 Checked for conversion errors. John Ayala 05-02-02 Review - lisa 01-06-03 Global change: fcout to fc Out. Text changes throughout lesson. friedaaaaaa"], "jumps": []}]};
let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
