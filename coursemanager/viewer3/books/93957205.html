const book = {"title": "93957205", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: POSITION TRANSDUCERSsdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": ["Hello Student, this lesson is about: about:"], "jumps": []}, {"id": "P100", "text": ["w Describe analog angular position sensors. w Describe analog linear position sensors.", "w Describe digital angular position sensors. w Describe digital linear position sensors."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["One of the most popular aspects of industrial machinery is the capability to sense the position of objects."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Position sensors change mechanical inputs to electrical output signals."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Most systems use both a position generator and sensor.  This creates a closed loop feedback system.", "Most systems use both a position generator and sensor. This creates a closed loop feedback system."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Closed loop feedback systems monitor the start position and end position of an object."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["The feedback created allows the machinery to make corrective moves."], "jumps": ["P480", "P430"]}, {"id": "P480", "text": ["Let's begin the lesson on POSITION TRANSDUCERS............................"], "jumps": ["P430"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2070", "text": ["hanges, the increment sensor produces an output pulse outputs.", "Increment Sensor (Optical or Magnetic)", "As the position of the wheel changes, the increment sensor produces an output pulse as each increment mark passes.."], "jumps": ["P2080", "P2040"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1015", "text": ["Analog position sensors are devices that change a mechanical position to an analog electrical signal."], "jumps": ["P1020", "P1001"]}, {"id": "P1020", "text": ["A popular type of analog position sensor is called a resolver."], "jumps": ["P1030", "P1015"]}, {"id": "P1030", "text": ["There are two types, let's start off with the induction type."], "jumps": ["P1040", "P1015"]}, {"id": "P1040", "text": ["An induction resolver is a transformer with a movable primary coil and a fixed secondary coil."], "jumps": ["P1050", "P1030", "Primary"]}, {"id": "P1050", "text": ["The mechanical input from an object is applied to the shaft which positions the primary coil."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["The electrical output is taken from the secondary coil."], "jumps": ["P1070", "P1040", "Primary"]}, {"id": "P1070", "text": ["As the shaft is rotated from 0 degrees to 360 degrees, the amount of flux coupling between the coils changes."], "jumps": ["P1080", "P1040"]}, {"id": "P1390", "text": ["e primary and two balanced secondary windings connected series opposing. The outputs of the t", "It is constructed with a single primary and two balanced secondary windings connected series opposing. The outputs of the two secondary windings are exactly 180 degrees out of phase..."], "jumps": ["P1400", "P1380"]}, {"id": "P2130", "text": ["In other words, the number of increment marks divide the wheel. This is called the resolution."], "jumps": ["P2140", "P2040"]}, {"id": "P1100", "text": ["At 90 degrees, the primary and secondary coils are parallel and in phase."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["There is maximum coupling between primary and secondary. The output goes from 0 volts to maximum."], "jumps": ["P1120", "P1080"]}, {"id": "P1120", "text": ["At 180 degrees, the primary and secondary coils are again 90 degrees displaced."], "jumps": ["P1130", "P1080"]}, {"id": "P1130", "text": ["There is no coupling between primary and secondary.  The output returns to 0 volts.", "There is no coupling between primary and secondary. The output returns to 0 volts."], "jumps": ["P1140", "P1080"]}, {"id": "P1140", "text": ["At 270 degrees, the primary and secondary coils are again parallel.  Only this time, they are not in phase.", "At 270 degrees, the primary and secondary coils are again parallel. Only this time, they are not in phase."], "jumps": ["P1150", "P1080"]}, {"id": "P1150", "text": ["The coupling is maximum and the output is at it's maximum negative value."], "jumps": ["P1160", "P1080"]}, {"id": "P1160", "text": ["When the shaft returns to the 0 degree position, there is no coupling between primary and secondary."], "jumps": ["P1170", "P1080"]}, {"id": "P1170", "text": ["The output is 0 again."], "jumps": ["P1180", "P1080"]}, {"id": "P1180", "text": ["The voltage and position outputs produce a sine function.", "ctrical output is different. This is a position sensor. When", "For any shaft position the electrical output is different. When the output of the secondary winding is compared to the primary AC signal, the position of the primary winding can be determined by the phase difference between the two windings."], "jumps": ["P1200", "P1080", "P1210", "P1180"]}, {"id": "P1210", "text": ["However, if a linear output is required, the shaft is only allowed to rotate between 140 degrees to 220 degrees."], "jumps": ["P1215", "P1180"]}, {"id": "P1215", "text": ["The voltage output is in the linear region of the curve.  Eout and position output vary from positive to negative, depending on shaft position.", "The voltage output is in the linear region of the curve. Eout and position output vary from positive to negative, depending on shaft position.."], "jumps": ["P1220", "P1210"]}, {"id": "P1220", "text": ["Which device best describes an analog inductive position sensor?"], "jumps": ["P1210"]}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1222", "text": ["The analog inductive position sensor uses flux coupling between a primary coil and a secondary coil.  It is not a potentiometer.", "The analog inductive position sensor uses flux coupling between a primary coil and a secondary coil. It is not a potentiometer."], "jumps": []}, {"id": "P1223", "text": ["The analog inductive position sensor uses flux coupling between a primary coil and a secondary coil.  It is not an inductor.", "The analog inductive position sensor uses flux coupling between a primary coil and a secondary coil. It is not an inductor."], "jumps": []}, {"id": "P1230", "text": ["At which shaft angles is the output of an inductive position sensor 0?"], "jumps": ["P1220"]}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1232", "text": ["At 90 and 270 degrees, the primary and secondary have maximum coupling, the output is maximum not zero."], "jumps": []}, {"id": "P1233", "text": ["The output is zero when the shaft position is 180 degrees. However, at 90 degrees, the primary and secondary have maximum coupling and the output is not 0."], "jumps": []}, {"id": "P1240", "text": ["The second type of resolver is a resistive device.", "The second type of resolver is a resistive device.........."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["Resistance resolvers are specially designed potentiometers."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["The mechanical input from an object is applied to the shaft of the potentiometer which positions the wiper."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["The output is taken across the wiper and one end of the resistive material."], "jumps": ["P1280", "P1250"]}, {"id": "P1280", "text": ["As the position of the shaft changes, the position of the wiper changes, just like a potentiometer."], "jumps": ["P1290", "P1250"]}, {"id": "P1290", "text": ["For each position, there is a specific output."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["If the A and B terminals are left open, the output is resistance."], "jumps": ["P1310", "P1280"]}, {"id": "P1310", "text": ["If a voltage is applied to the A and B terminals, the output is a voltage."], "jumps": ["P1320", "P1280"]}, {"id": "P1320", "text": ["The device acts as a simple voltage divider."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["The result is that for any position of the input shaft, the resistance or voltage output is different."], "jumps": ["P1340", "P1310"]}, {"id": "P1340", "text": ["Which device best describes an analog resistance position sensor?"], "jumps": ["P1330"]}, {"id": "P1341", "text": [], "jumps": []}, {"id": "P1342", "text": ["The analog resistance position sensor uses a resistive material and a wiper.  It is not a transformer.", "The analog resistance position sensor uses a resistive material and a wiper. It is not a transformer."], "jumps": []}, {"id": "P1343", "text": ["The analog resistance position sensor uses a resistive material and a wiper.  It is not an inductor.", "The analog resistance position sensor uses a resistive material and a wiper. It is not an inductor."], "jumps": []}, {"id": "P1350", "text": ["At which shaft position is the output of the resistance position sensor 0?"], "jumps": ["P1340"]}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1352", "text": ["With the shaft positioning the wiper to the top of the resistance, the output is not 0.  The entire resistance is felt at the output.", "With the shaft positioning the wiper to the top of the resistance, the output is not 0. The entire resistance is felt at the output."], "jumps": []}, {"id": "P1353", "text": ["With the shaft positioning the wiper to about half way in the resistance, the output is not 0. About half the resistance is felt at the output."], "jumps": []}, {"id": "P1360", "text": ["Both position sensors use circular motion for sensing.", "Both position sensors use circular motion for sensing......"], "jumps": ["P1370", "P1350", "Primary"]}, {"id": "P1370", "text": ["Even though circular positioning is the most popular, there are times when linear positioning techniques are required."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["This linear position sensor operates similar to the inductive sensor.  It is a linear voltage differential transformer.", "This linear position sensor operates similar to the inductive sensor. It is a linear voltage differential transformer.."], "jumps": ["P1390", "P1360"]}, {"id": "P1420", "text": ["This induceproduces a positive or negative output voltage.", "This induceproduces a positive or negative output voltage.m", "This induces the output to shift phase producing a positive or negative output voltage when compared to the primary AC voltage..."], "jumps": ["P1430", "P1380"]}, {"id": "P1400", "text": ["With the core centered, flux coupling to each secondary is equal, the induced voltages cancel and the output is 0."], "jumps": ["P1410", "P1380"]}, {"id": "P1410", "text": ["When the position of the core changes, one of the secondaries induced voltage increases and the other decreases.  With outpu", "This produces a positive or negative output voltage.", "When the position of the core changes, one of the secondaries induced voltage increases and the other decreases. With outpu", "When the position of the core changes, one of the secondaries induced voltage increases and the other decreases. With opposing phase outputs, the position of the core is easily determined as each position has a different AC output."], "jumps": ["P1420", "P1380", "P1430"]}, {"id": "P1430", "text": ["The output is designed to be a linear function of the core position for the extremes of core travel."], "jumps": ["P1440", "P1380"]}, {"id": "P1440", "text": ["This linear position sensor operates similar to the resistance sensor.  It is a linear resistance sensor.", "This linear position sensor operates similar to the resistance sensor. It is a linear resistance sensor."], "jumps": ["P1450", "P1380"]}, {"id": "P1450", "text": ["Its operation is exactly like that of the circular resistance sensor except motion is in a straight line rather than circular."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["What type of position sensor would be best to determine the depth of an oil drilling rig?"], "jumps": ["P1440"]}, {"id": "P1461", "text": [], "jumps": []}, {"id": "P1462", "text": ["An angular position sensor could be used however, the position is linear and using a linear position sensor would be better than an angular inductive sensor."], "jumps": []}, {"id": "P1463", "text": ["An angular position sensor could be used however, the position is linear and using a linear position sensor would be better than an angular resistance sensor."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on ANALOG POSITION SENSORS.", "This completes the information on ANALOG POSITION SENSORS...."], "jumps": ["P1001", "P1460"]}, {"id": "P1920", "text": ["1.  Analog position sensors change a mechanical input to an              analog electrical output.", "1. Analog position sensors change a mechanical input to an analog electrical output.."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  A resolver is a popular analog position sensor.", "2. A resolver is a popular analog position sensor."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The induction resolver is a transformer with a movable                     primary coil and a fixed secondary coil.", "3. The induction resolver is a transformer with a movable primary coil and a fixed secondary coil..."], "jumps": ["P1950", "P1920", "Primary"]}, {"id": "P1950", "text": ["4.  The shaft is rotated from 0 degrees to 360 degrees changing          the flux coupling between the coils.", "4. The shaft is rotated from 0 degrees to 360 degrees changing the flux coupling between the coils."], "jumps": ["P1960", "P1940", "Primary"]}, {"id": "P1960", "text": ["5.  The resistance resolver is a special designed potentiometer.", "5. The resistance resolver is a special designed potentiometer."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  The shaft is rotated from 0 degrees to 360 degrees changing          the resistance or voltage output.", "6. The shaft is rotated from 0 degrees to 360 degrees changing the resistance or voltage output.."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7.  The linear voltage differential transformer is a linear inductive         position sensor.", "7. The linear voltage differential transformer is a linear inductive position sensor..."], "jumps": ["P1990", "P1960"]}, {"id": "P1990", "text": ["8.  The linear resistance sensor operates like the circular                       resistance sensor only the motion of the input is different.", "8. The linear resistance sensor operates like the circular resistance sensor only the motion of the input is different...."], "jumps": ["P1999", "P1980"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu..."], "jumps": ["P1001", "P1990"]}, {"id": "P2150", "text": ["this wheel is 36 degrees per mark because there are 10 sensor marks each equaspace 36 degrees", "For example, the resolution of this wheel is 36 degrees per mark because there are 10 sensor marks each equally spaced with 36 degrees separation between the marks..."], "jumps": ["P2160", "P2140"]}, {"id": "P2015", "text": ["Digital position sensors are devices that change a mechanical position to an analog electrical signal."], "jumps": ["P2020", "P2001"]}, {"id": "P2020", "text": ["There are two basic types of digital position sensors.", "There are two basic types of digital position sensors......"], "jumps": ["P2030", "P2015"]}, {"id": "P2030", "text": ["Let's start off with the increment wheel."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["An increment wheel position sensor is nothing more than a wheel placed on a prime mover or on an object.", "Increment Sensor (Optical or Magnetic)"], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["The wheel is printed so a light or magnetic transducer may be used to sense the marks.", "Increment Sensor (Optical or Magnetic)"], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["The increment marks represent position in reference to the zero position, indicated by the reference mark."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["As the position of the wheel changes, the increment sensor produces high pulse outputs.", "Increment Sensor (Optical or Magnetic)"], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["By counting the number of pulses, the position of the wheel can be determined.", "By counting the number of pulses, the position of the wheel can be determined............."], "jumps": ["P2090", "P2040"]}, {"id": "P2090", "text": ["To operate correctly, increment marks must be counted from the reference mark."], "jumps": ["P2100", "P2040"]}, {"id": "P2100", "text": ["This means that the shaft must return to zero prior to each move and increment count sequence.", "Increment Sensor (Optical or Magnetic)"], "jumps": ["P2110", "P2040"]}, {"id": "P2110", "text": ["Each mark is a discrete point.  If the position of the wheel is between marks, the position count, or the position, will not be detected.", "Each mark is a discrete point. If the position of the wheel is between marks, the position count, or the position, will not be detected."], "jumps": ["P2120", "P2040"]}, {"id": "P2120", "text": ["Recall that analog position sensors have an infinite number of positions.  Digital position sensors have a discrete number of positions.", "Recall that analog position sensors have an infinite number of positions. Digital position sensors have a discrete number of positions.."], "jumps": ["P2130", "P2040"]}, {"id": "P2190", "text": ["f returning the wheel to zero befor, an encoder wheel is used.", "To overcome the disadvantage of returning the wheel to zero before each count, the increment wheel can be replaced with an encoder wheel........."], "jumps": ["P2200", "P2180"]}, {"id": "P2140", "text": ["To determine resolution, measured in degrees per mark, you divide 360 degrees by the number of marks."], "jumps": ["P2150", "P2040"]}, {"id": "P10226", "text": ["How does an encoder position sensor operate?", "by counting the number of marks from the reference"], "jumps": []}, {"id": "P2160", "text": ["This means if two marks were sensed or counted, that the position of the wheel is 72 degrees from the 0 reference.", "This means if two marks were sensed or counted, that the position of the wheel is 72 degrees from the 0 reference. Position = Resolution x Number of Marks Sensed", "Position = Resolution x Number of Marks Sensed"], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["What is the resolution of this increment wheel?", "What is the resolution of this increment wheel?............"], "jumps": ["P2150", "P2175"]}, {"id": "P2171", "text": [], "jumps": []}, {"id": "P2172", "text": ["18 is the number of marks.  You need to know this information to calculate resolution but, the number of marks is not resolution.", "18 is the number of marks. You need to know this information to calculate resolution but, the number of marks is not resolution."], "jumps": []}, {"id": "P2173", "text": ["36 is not the resolution.  To find the resolution, you divide 360 by the number of marks.", "36 is not the resolution. To find the resolution, you divide 360 by the number of marks."], "jumps": []}, {"id": "P2175", "text": ["RESOLUTION - Resolution equals the 360 degrees divided by the number of sensor marks."], "jumps": []}, {"id": "P2180", "text": ["If a increment wheel has 180 sensor marks, what is the position (in degrees, from 0 degrees) if 23 marks were sensed?"], "jumps": ["P2170", "P2185"]}, {"id": "P2181", "text": [], "jumps": []}, {"id": "P2182", "text": ["360 degrees is the zero position or reference point.  Remember, 360 degrees and 0 degrees are the same point.  Also, to determine position, you must determine the resolution first.", "360 degrees is the zero position or reference point. Remember, 360 degrees and 0 degrees are the same point. Also, to determine position, you must determine the resolution first."], "jumps": []}, {"id": "P2183", "text": ["180 is the number of sensor marks on the increment wheel.  To determine position, you must determine the resolution first.", "180 is the number of sensor marks on the increment wheel. To determine position, you must determine the resolution first."], "jumps": []}, {"id": "P2185", "text": ["POSITION - To determine position, you calculate resolution and then multiply the resolution times the number of sensed marks."], "jumps": []}, {"id": "P2200", "text": ["An encoder wheel is also placed on a prime mover or an object.", "An encoder wheel is also placed on a prime mover or an object."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["The difference is that the encoder wheel is divided into tracks with one sensor for each track."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["In the plane of the sensors, a digital code is printed on the wheel for each number band."], "jumps": ["P2230", "P2200"]}, {"id": "P2230", "text": ["The sensors then detect the code and output parallel digital data that represents position."], "jumps": ["P2240", "P2200"]}, {"id": "P2240", "text": ["Normally, one of two different types of codes are printed on the wheel."], "jumps": ["P2250", "P2200"]}, {"id": "P2250", "text": ["The 8421 code represents the binary weight of each digit from the Most Significant Bit (MSB)  to the Least Significant Bit (LSB).", "The 8421 code represents the binary weight of each digit from the Most Significant Bit (MSB) to the Least Significant Bit (LSB).."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["The dark areas do not reflect light and produce a 0 or low output."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["The light areas reflect light and produce a 1 or high output."], "jumps": ["P2280", "P2250"]}, {"id": "P2280", "text": ["Note that if a magnetic pick up is used, the areas would represent magnetic and non-magnetic portions."], "jumps": ["P2290", "P2250"]}, {"id": "P2290", "text": ["When the sensors are over a band, the output represents the position of the wheel by a binary number, from 0000 to 1111 in this case."], "jumps": ["P2300", "P2250"]}, {"id": "P2300", "text": ["A problem with the 8421 code is that the track for each band is not the same length."], "jumps": ["P2310", "P2250"]}, {"id": "P2310", "text": ["This means that as the wheel moves, the digital output does not change at the same time."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["Incorrect outputs can occur during the transition between one position and another."], "jumps": ["P2330", "P2300"]}, {"id": "P2330", "text": ["For example, at T1, the MSB sensor is in the band for the position 1000 but, the other sensors are in the band for 0111.  The output is 1111 which is incorrect.", "For example, at T1, the MSB sensor is in the band for the position 1000 but, the other sensors are in the band for 0111. The output is 1111 which is incorrect."], "jumps": ["P2340", "P2300"]}, {"id": "P2340", "text": ["At T2, the three MSB sensors are in the 1000 band but, the LSB sensor is still in the 0111 band.  The output is 1001 which is still incorrect.", "At T2, the three MSB sensors are in the 1000 band but, the LSB sensor is still in the 0111 band. The output is 1001 which is still incorrect........."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["At T3, the output is 1001 and is still incorrect.  Only the three MSB digits are in the correct band.", "At T3, the output is 1001 and is still incorrect. Only the three MSB digits are in the correct band."], "jumps": ["P2360", "P2330"]}, {"id": "P2360", "text": ["Finally, at T4, the output is correct.  All sensors are in the correct band.", "Finally, at T4, the output is correct. All sensors are in the correct band."], "jumps": ["P2370", "P2330"]}, {"id": "P10224", "text": ["To overcome the incorrect outputs during transition, an additional track is added.  The strobe track.", "If the area under a sensor is dark in a position transducer, what is the output if light is used to sense position?", "To overcome the incorrect outputs during transition, an additional track is added. The strobe track.", "Strobe Band (Number Sense) Number Band", "Miscount on Leading (A) & Trailing (B) Edges during Transitionn"], "jumps": []}, {"id": "P2380", "text": ["The strobe track is printed so that a high is produced in the center of the number band."], "jumps": ["P2390", "P2370"]}, {"id": "P2390", "text": ["The high output of the strobe track is then used in external circuits to enable the output of the other sensors."], "jumps": ["P2400", "P2370"]}, {"id": "P2400", "text": ["This ensures that the output of the sensors only occurs when all the sensors are in the correct number band, thus eliminating transition errors."], "jumps": ["P2410", "P2370"]}, {"id": "P2410", "text": ["Another method of eliminating transition errors is to use a different type of code on the wheel, the Grey Code."], "jumps": ["P2420", "P2370"]}, {"id": "P2420", "text": ["Look carefully at the binary numbers that represent each position."], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["Notice that only one digit changes from a 1 to 0 or changes from a 0 to 1 for each change in position."], "jumps": ["P2440", "P2410"]}, {"id": "P2440", "text": ["The one digit change occurs both in the clockwise and counterclockwise direction."], "jumps": ["P2450", "P2410"]}, {"id": "P2450", "text": ["By using the Grey Code, the output errors in transition are eliminated."], "jumps": ["P2460", "P2410"]}, {"id": "P2460", "text": ["You have probably noticed that both the 8421 and Grey Code wheels used 4 bits."], "jumps": ["P2470", "P2410"]}, {"id": "P2470", "text": ["This does not have to be the case.  Any number of tracks can be used.", "This does not have to be the case. Any number of tracks can be used."], "jumps": ["P2480", "P2460"]}, {"id": "P2480", "text": ["However, the number tracks determine the resolution of the wheel.  The more tracks, the more the wheel is divided.", "However, the number tracks determine the resolution of the wheel. The more tracks, the more the wheel is divided."], "jumps": ["P2490", "P2460"]}, {"id": "P2490", "text": ["The resolution of a code wheel equals 360 degrees divided by two to the N power, N is the number of tracks."], "jumps": ["P2500", "P2460"]}, {"id": "P2500", "text": ["Recall in digital electronics that the number of digit combinations depends on the number of positions or 2 to the N power."], "jumps": ["P2510", "P2490"]}, {"id": "P2510", "text": ["For example, the resolution of a wheel with four tracks (not including the strobe track) is 22.5 degrees per number band."], "jumps": ["P2520", "P2490"]}, {"id": "P2520", "text": ["If another track is added, five tracks, the resolution is 11.25 degrees per number band."], "jumps": ["P2530", "P2490"]}, {"id": "P2530", "text": ["Which one of the code wheels below WILL NOT eliminate transition errors?"], "jumps": ["P2490"]}, {"id": "P2531", "text": [], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P2533", "text": ["The strobe trace is added to a 8421 code wheel to eliminate transition errors.  The output of the strobe track is used to enable the output of the other sensors.", "The strobe trace is added to a 8421 code wheel to eliminate transition errors. The output of the strobe track is used to enable the output of the other sensors.", "Strobe Band (Number Sense) Number Band", "Miscount on Leading (A) & Trailing (B) Edges during Transition"], "jumps": []}, {"id": "P2540", "text": ["What is the resolution of a code wheel that uses 8 tracks (not including the strobe track)?"], "jumps": ["P2530", "P2545"]}, {"id": "P2541", "text": [], "jumps": []}, {"id": "P2542", "text": ["You divided the number of bands into 360 degrees.  You should have divided 360 degrees by 2 to the N power.  N is the number of tracks.", "You divided the number of bands into 360 degrees. You should have divided 360 degrees by 2 to the N power. N is the number of tracks.."], "jumps": []}, {"id": "P2543", "text": ["You divided 360 degrees by 8, the number of tracks.  You should have divided 360 degrees by 2 to the N power.  N is the number of tracks.", "You divided 360 degrees by 8, the number of tracks. You should have divided 360 degrees by 2 to the N power. N is the number of tracks."], "jumps": []}, {"id": "P2545", "text": ["RESOLUTION - The resolution of a digital position sensor equals 360 degrees divided 2 to the N power. N is the number of tracks."], "jumps": []}, {"id": "P2550", "text": ["These digital position sensors use circular motion.", "These digital position sensors use circular motion........."], "jumps": ["P2560", "P2540"]}, {"id": "P2560", "text": ["Linear position sensors can also be used."], "jumps": ["P2570", "P2550"]}, {"id": "P2570", "text": ["The only difference is that the marks are placed in a straight line instead of on a curve wheel."], "jumps": ["P2910", "P2550"]}, {"id": "P2910", "text": ["This completes the information on DIGITAL POSITION SENSORS."], "jumps": ["P2001", "P2570"]}, {"id": "P2920", "text": ["1.  Digital position sensors change a mechanical input to a digital      electrical output.", "1. Digital position sensors change a mechanical input to a digital electrical output."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2.  There are increment wheel and encoder wheel digital position        sensors.", "2. There are increment wheel and encoder wheel digital position sensors..."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3.  The increment wheel sensor uses marks to represent position       and a reference mark.", "3. The increment wheel sensor uses marks to represent position and a reference mark.."], "jumps": ["P2950", "P2930"]}, {"id": "P2950", "text": ["4.  As the wheel changes position, the marks are counted to                determine position.", "4. As the wheel changes position, the marks are counted to determine position.."], "jumps": ["P2960", "P2940"]}, {"id": "P2960", "text": ["5.  Resolution equals 360 degrees divided by the number of                marks.", "5. Resolution equals 360 degrees divided by the number of marks."], "jumps": ["P2970", "P2940"]}, {"id": "P2970", "text": ["6.  The encoder position sensor uses a binary code to determine        position.", "6. The encoder position sensor uses a binary code to determine position."], "jumps": ["P2980", "P2960"]}, {"id": "P2980", "text": ["7.  The 8421 code represents the binary weight of each digit.  A           strobe track is added to eliminate transition errors.", "7. The 8421 code represents the binary weight of each digit. A strobe track is added to eliminate transition errors.."], "j let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
