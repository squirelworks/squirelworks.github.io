<script>
const book = {"title": "9395N204", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: I/O AND INTERRUPT INSTRUCTIONSsfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Understand the concepts of I/O instructions. w Describe the operation of I/O instructions. w Understand the concepts of interrupt instructions. w Describe the operation of interrupt instructions.", "w Demonstrate the usage of I/O instructions using Allen Bradely APS software.are.", "w Demonstrate the usage of I/O instructions using Rockwell RSLOGIX software..software."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P310", "text": [], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P331", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, we are going to look at the I/O and interrupt instructions commonly used with programmable logic controllers."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["I/O instructions allow you to perform operations with the input and output ports of a PLC."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Interrupts are also associated with I/O devices, and there are special instructions that allow you to control the operation of interrupts."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["We will look at the operation and usage of interrupts. By understanding the operation and usage, you will find it easy to comprehend the instructions for controlling interrupts."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on I/O AND INTERRUPT INSTRUCTIONS.................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": ["I/O and interrupt instructions allow you to control and monitor the inputs, outputs, and status of modules attached to a PLC. These modules provide the connection of the PLC to the outside world.", "I/O Instructions Interrupt Instructions", "For example, a PLC may be used to monitor the number of items that pass by a sensor on four different stages of an assembly line. In this case, the PLC requires four inputs from sensors to the PLC itself..."], "jumps": ["P1050", "P1001", "P1060", "P1040"]}, {"id": "P1060", "text": ["An input module can be used to attach to the PLC, normally in a slot. The sensors are then attached to the PLC module, which is monitored by the PLC. The module is an input device."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["There are hundreds of different modules providing many different types of external connections; however, the ladder logic programs appear the same. All inputs and outputs are read as individual bits or groups of bits..."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["The list below shows the I/O instructions. Let's look at each of these instructions and the parameters they require for operation.", "IIM - Immediate Input with Mask IOM - Immediate Output with Mask REF - I/O Refresh"], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["This is the Immediate Input with Mask (IIM) instruction. This instruction is used to get the current values of the input module and place them in their associated data file in memory.", "Immediate Input With Mask Slot : Mask :"], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["When a PLC ladder logic program is running, input data is not constantly being read into a data file in memory. Instead, the PLC scans all inputs at the same time and sets all outputs at the same time before continuing..."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["After it has read all inputs and set all outputs, the ladder is evaluated again. Once the end of the ladder is reached, the process starts again."], "jumps": ["P1120", "P1090"]}, {"id": "P1120", "text": ["If you have a very long ladder logic program, you may not want to wait a complete cycle for the input value to change. This is where the IIM instruction is used. When this instruction is called, the particular input you specify is immediately scanned..."], "jumps": ["P1130", "P1090"]}, {"id": "P1130", "text": ["After the input is scanned and the associated data is set in the data file, the processor continues in the ladder logic that follows the IIM instruction."], "jumps": ["P1140", "P1090"]}, {"id": "P1140", "text": ["All of the instructions after the IIM instruction will have the new information in the data file that was just scanned in."], "jumps": ["P1150", "P1090"]}, {"id": "P1150", "text": ["The IIM instruction requires two parameters: a slot and a mask. Slot is a term that refers to identifying whether you are addressing the input or output section of the module and the slot number position as well as the word within it. The mask is a process that allows you to specify the bits you want to scan of the word identified in the slot.....", "Slot Examples Mask Examples I : 0 Input Module 0 Word 0 FF (11111111) I : 2.2 Input Module 2 Word 2 A5 (10100101) I : 3 Input Module 3 Word 3 F0 (11110000))"], "jumps": ["P1160", "P1090"]}, {"id": "P1160", "text": ["You do not have to input the entire data set of the input device. For example, let's look at an input that has 8 bits. Bits 0 through 3 are attached to the sensors we mentioned earlier, and 4 through 7 are attached to sensors that indicate if the assembly line is active...", "Current Data File - 1 1 1 1 1 1 1 1 Input Number - 0 1 2 3 4 5 6 7 Input Value - 1 0 1 0 1 0 1 0 Mask - 1 1 1 1 0 0 0 0 Data File after IIM - 1 0 1 0 1 1 1 11"], "jumps": ["P1170", "P1090"]}, {"id": "P1170", "text": ["Since our process will look at the number of items that pass sensors at each point in a process, it is critical to know when an item passes by. In this case, we elect to add extra input scans only for the items that pass sensor bits in the data file..."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["To do this, we use the mask \"11110000\". The ones specify the inputs associated with these bits that we want read and stored in the data file. The zeros indicate which bits should remain unchanged......"], "jumps": ["P1190", "P1160"]}, {"id": "P1190", "text": ["The actual instruction, however, does not take 11110000 as a valid mask. Instead, this binary value must be converted to hexadecimal. The equivalent hexadecimal value for 11110000 is F0..."], "jumps": ["P1200", "P1160"]}, {"id": "P1200", "text": ["Also, a data register in the PLC memory can be specified for the mask. The instruction looks in that register to get the mask. Using this method allows you to change the mask whenever you want during execution of the ladder logic code...", "Immediate Input With Mask Slot : Mask :"], "jumps": ["P1210", "P1160"]}, {"id": "P1210", "text": ["Remember, when using IIM instruction, be sure to write your ladder logic properly, accounting for the fact that the data file can change during the ladder logic evaluation and not just during the initial input scan..."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["The next instruction we will look at is the Immediate Output with Mask (IOM) instruction. This instruction is similar to the IIM instruction, with the exception that it works with the output modules instead of the input modules...", "Immediate Output With Mask Slot : Mask :"], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["This instruction, when called, takes the bits of a data file for an output slot and sends those bit values to that output module. This is also used within a ladder logic program when the output needs to be set before the normal output set..."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["The IOM instruction takes the same parameters as the IIM instruction, slot with word and mask. Again, ones in the mask change the output bit settings and zeroes cause those particular output bits to remain unchanged...", "Slot Examples Mask Examples I : 0 Input Module 0 Word 0 IF (00011111) I : 3 Input Module 3 Word 0 00 (00000000) I : 2.2 Input Module 2 Word 2 11 (00010001))-"], "jumps": ["P1250", "P1220"]}, {"id": "P1250", "text": ["The last I/O instruction we will examine is the I/O Refresh (REF) instruction. This instruction, when used, writes all outputs, services the communications, and reads all inputs of the modules, in that order..."], "jumps": ["P1260", "P1220"]}, {"id": "P1260", "text": ["This instruction doesn't use parameters, so masks cannot be used. Just as with IIM and IOM, the PLC continues with the new data that follows the REF instruction."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["Now we will discuss the interrupt instructions used by I/O in a PLC system. Before we look at these instructions, however, let's look at what an interrupt is.", "IID - I/O Interrupt Disable IIE - I/O Interrupt Enable RPI - Reset Pending I/O Interrupt"], "jumps": ["P1280", "P1250"]}, {"id": "P1280", "text": ["An interrupt is used to pause the PLC and do something else. An input device can be set so that when a particular condition occurs on its inputs, it sends an interrupt to the PLC."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["The interrupt signal sent to the PLC finishes the current operation and then goes to a subroutine associated with the interrupt. The PLC evaluates this subroutine ladder logic and then returns to where it had left off in its normal operation..."], "jumps": ["P1300", "P1270"]}, {"id": "P1300", "text": ["Interrupts are used where it is critical for the PLC to perform some action when a certain condition arises at an I/O device."], "jumps": ["P1310", "P1270"]}, {"id": "P1310", "text": ["The first two instructions are the I/O Interrupt Disable (IID) and I/O Interrupt Enable (IIE) instructions. These instructions are normally used together.", "I/O Interrupt Disable Slots : Mask :sk :", "I/O Interrupt Enable Slots :: Mask :sk :"], "jumps": ["P1320", "P1270"]}, {"id": "P1320", "text": ["There may be portions of your ladder logic code that you don't want interrupted. This is especially true for subroutines or main ladder logic that is time critical. In that case, you want to temporarily ignore specific interrupts..."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["To disable interrupts from I/O modules, you use the IID (I/O Interrupt Disable) instruction. This instruction requires you to specify which slot or slots to disable. Below are examples of how you can specify these types of instructions...", "4 = Slot: 4 4, 5, 7 = Slots: 4 - 5, 7 6, 7, 8, 9 = Slots: 6 - 99"], "jumps": ["P1340", "P1310"]}, {"id": "P1340", "text": ["To enable the interrupts again, use the IIE (I/O Interrupt Enable) instruction, again providing the slots to enable."], "jumps": ["P1350", "P1310"]}, {"id": "P1350", "text": ["Remember, if an interrupt is disabled, the PLC will not know if that interrupt occurs. If you have very important interrupts, make sure they are enabled again as soon as you no longer need them disabled......................."], "jumps": ["P1360", "P1310"]}, {"id": "P1360", "text": ["Reset Pending Interrupt Slots :ask :sk :", "The next instruction is the Reset Pending I/O Interrupt (RPI) instruction. This instruction is used when an I/O module sends an interrupt to the PLC."], "jumps": ["P1370", "P1310"]}, {"id": "P1370", "text": ["The instruction resets the interrupt request of the I/O module and indicates to the I/O module that the interrupt request has been aborted. This instruction also requires a list of slots to reset."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["In more general terms, this instruction tells an I/O module or modules that the PLC recognizes the interrupt requests but is going to ignore them, and it resets the requests."], "jumps": ["P1390", "P1360"]}, {"id": "P1390", "text": ["In the following I/O Interrupt Disable instruction, which slots will have their interrupts disabled?", "I/O Interrupt Disable Slots : 4 - 9:sk :"], "jumps": ["P1360"]}, {"id": "P1391", "text": [], "jumps": []}, {"id": "P1392", "text": ["I/O Interrupt Disable Slots : 4 - 9:sk :", "Remember, the '-' indicates a range of number. So 1 - 3 would be 1, 2 and 3."], "jumps": []}, {"id": "P1400", "text": ["Using the following information, determine what the input 16 bit data file I:0 will contain after the IIM (Immediate Input with Mask).", "Before Instruction I : 0 ( Input Data File Word 0) Input Module Values I I M Instructions Mask"], "jumps": ["P1390"]}, {"id": "P1401", "text": [], "jumps": []}, {"id": "P1402", "text": ["Remember, if the mask bit is zero, the old value will remain unchanged. If the mask bit is a one, the new value will be loaded in from the input module.", "Before Instruction I : 0 ( Input Data File Word 0) Input Module Values I I M Instructions Mask", "We have examined the I/O and Interrupt instruction of a PLC. In the experiment, you will see the operation of an example of these types of instructions.", "I/O Instructions Interrupt Instructions"], "jumps": ["P1910", "P1400"]}, {"id": "P1910", "text": ["This completes the information on I/O AND INTERRUPT INSTRUCTIONS."], "jumps": ["P1001", "P1410"]}, {"id": "P1920", "text": ["1. The Immediate Input with Mask (IIM) instruction is used to update the input data files at once instead of waiting for the normal input scan. You can specify with a mask what input bits you want to scan at once.", "Immediate Input With Mask Slot : Mask :"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. The Immediate Output with Mask (IOM) instruction is used to update the output data files at once instead of waiting for the normal output set. Again, you can specify with a mask what output bits you want to set..", "Immediate Output With Mask Slot : Mask :"], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. The I/O Refresh (REF) instruction is used to set all outputs, perform communication operations, and scan all inputs at once instead of waiting for the normal output, communications, and input scan. This instruction does not use masks."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. The I/O Interrupt Disable and Enable (IID and IIE) are used to disable and enable the PLC from seeing interrupts from the different IO modules.", "I/O Interrupt Disable Slots : Mask :sk :", "I/O Interrupt Enable Slots :: Mask :sk :"], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. The Reset Pending I/O Interrupt (RPI) is used to abort an interrupt that has been set on any of the specified modules to the instruction.", "Reset Pending Interrupt Slots :ask :sk :"], "jumps": ["P1999", "P1950"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1960"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2040", "text": ["In this experiment, we are going to program the PLC Trainer to use some of the I/O instructions that you have learned in this lesson. The particular PLC Trainer you are using does not support interrupts."], "jumps": ["P2050", "P2001"]}, {"id": "P2050", "text": ["Before actually beginning the ladder logic programming, you must create a new processor program and make appropriate configurations as you did in the lesson on bit instructions."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["1. Connect the 5050 interface cable between the Nida Model 5050 PLC Trainer and the computer which has the APS software."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["2. Start the APS software by performing the following commands at the DOS prompt of the computer which has the APS software and is attached to the PLC Trainer. a. Type 'CD \\IPDS\\ATTACH\\SLC500' and press enter. b. Type 'APS' and press enter."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["If the software did not start, see your instructor. These instructions are for default installation of the APS software and may differ from your installation."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["3. Set up a new processor file and begin editing the ladder logic program. If you need help on configuring and setting up the PLC APS software, select the help button below."], "jumps": ["P2100", "P2080", "P2095"]}, {"id": "P2095", "text": ["Follow these steps to set up the APS software for ladder logic program entry and evaluation:", "1. From the main menu, select F4 [ OFFLINE CONFIG ] and then F6 [ CREATE ]. Enter a file name and press enter. You must use a filename that does not already exist and one ten characters or less. Do not forget your file name. 2. Using the up and down arrow keys, adjust the PROCESSOR box until '1747-L20C/F 12-DC SNK 8-RLY' is highlighted by the cursor bar. Press F2 [ SELECT PROC ] to select this processor. 3. Now we will select th I/O modules attached to the PLC. Press F5 [ CONFIGR I/O ]. 4. Press F4 [ MODIFY RACKS ] and then F1 [ RACK 1 ]. Rack 1 is the backplane that the other two modules will attach to. Use the cursor bar and select '1746-A2 2-slot Backplane' and press enter. 5. Use the arrow keys to highlight '*1' (Slot 1) with the cursor bar and press F5 [ MODIFY SLOT ]. Using the arrow keys again, highlight '1746-IG16 16-Input [ TTL ] (Sink) 5 VDC' and press F2 [ SELECT MODULE ]. 6. Use the arrow keys to highlight '*2' (Slot 2) with the cursor bar and press F5 [ MODIFY SLOT ]. Using the arrow keys again, highlight '1746-NI04V Analog Comb. 2 In & 2 Voltage Out' and press F2 [ SELECT MODULE ]. 7. Select F8 [ EXIT ] and F8 [ SAVE & EXIT ] and then F8 [ ACCEPT ]. 8. Press F3 [ OFFLINE PRG/DOC ] and then F1 [ PROCSSR FUNCTNS ]. We are going to change the name of our ladder logic file to be more descriptive of what it does. 9. Using the cursor bar, select File 2 and press F4 [ CHANGE FL. NAME] Enter 'IO_TEST' and press return. The name should appear in the Name column for file 2. 10. We are now ready to edit the ladder program file. Using the arrow keys, highlight File 2 and press F8 [ MONITOR FILE ]. 11. To began editing, press F10 [ EDIT ]..."], "jumps": []}, {"id": "P2100", "text": ["The program shown below is the ladder logic program you are going to enter to demonstrate some of the I/O and interrupt instructions that you learned in the first part of this lesson."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["Before we actually begin entering the program into the PLC APS software, let's look at what the program should do. This will help us understand if the program is operating properly when we test it..."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["It is important to realize that the Immediate Input with Mask and Immediate Output with Mask instructions are normally used in large ladder logic programs where timing is critical and one can't wait until the end of the cycle to write or scan inputs and outputs..."], "jumps": ["P2130", "P2100"]}, {"id": "P2130", "text": ["For this reason, the program you enter will not allow you to see the overall benefits to the IIM or IOM instructions. The purpose of this experiment is to let you see how they are entered into ladder logic..."], "jumps": ["P2140", "P2100"]}, {"id": "P2140", "text": ["Remember, at the beginning of the ladder logic program, the PLC will have just finished writing the outputs, performing communication operations, and scanning the inputs. For this reason, we know the inputs and outputs are up to date..."], "jumps": ["P2150", "P2100"]}, {"id": "P2150", "text": ["The first rung checks to see if the START button on the 5050-1 card is pressed down. Remember, the START button is connected to the 0 input of the input modules built into the PLC."], "jumps": ["P2160", "P2100"]}, {"id": "P2160", "text": ["When the switch is pressed in, the associated bit in the input data file is set to one when scanned by the PLC. If the key is not being pressed, the bit will be scanned and indicated by a zero in the data file.e..."], "jumps": ["P2170", "P2100"]}, {"id": "P2170", "text": ["In this rung, the LED attached to output 0 of the output module will be enabled if the START switch is pressed down. When the button is released and this rung is evaluated again, the LED will extinguish.."], "jumps": ["P2180", "P2100"]}, {"id": "P2180", "text": ["Rung 2 contains the Immediate Output with Mask instruction. The parameters to this instruction indicate that we want to update all the output bits of output module 0, word 0. Remember, FFFF in hex is 1111111111111111 in binary. Ones indicate update with new values."], "jumps": ["P2190", "P2100"]}, {"id": "P2190", "text": ["If the START button is pressed down, this instruction will cause the LED to illuminate now instead of at the normal output write cycle."], "jumps": ["P2200", "P2100"]}, {"id": "P2200", "text": ["The next instruction is the Immediate Input with Mask. At this point, we want to scan the inputs again to see if any of the key conditions have changed. We are using a mask of FFFF so all inputs are updated."], "jumps": ["P2210", "P2100"]}, {"id": "P2210", "text": ["The last rung checks to see if the STOP button is being pressed. This button is attached to the 1 input of the PLC inputs. While this button is pressed, the associated bit in the input data file is set to one.e..."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["With this bit set to one, the LED attached to output 1 of the output module will be enabled. Again, we don't need another IOM or IIM after this instruction because we are at the end of the ladder. The inputs and outputs will update before evaluation begins at the top of the ladder again..."], "jumps": ["P2230", "P2200"]}, {"id": "P2230", "text": ["It is very important to realize that these instructions are used in much larger programs where waiting until the end of the cycle before updating the outputs or scanning the inputs is not possible..."], "jumps": ["P2240", "P2200"]}, {"id": "P2240", "text": ["Let's enter the program and see how it works..............."], "jumps": ["P2250", "P2200"]}, {"id": "P2250", "text": ["Each rung will be presented in order for you to type it into the APS software. If you are having trouble, a help button will give you a list of steps for entering the instruction. Try to do as much as possible on your own..."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["4. Enter Rung 1 shown below..............................."], "jumps": ["P2270", "P2250", "P2265"]}, {"id": "P2265", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, XIC and then enter I:0/0. 3. Select BIT, OTE and enter O:0/0. 4. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2270", "text": ["5. Enter Rung 2 shown below..............................."], "jumps": ["P2280", "P2260", "P2275"]}, {"id": "P2275", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, I/O MESSAGE, IOM and then enter O:0 and FFFF. 3. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2280", "text": ["6. Enter Rung 3 shown below..............................."], "jumps": ["P2290", "P2270", "P2285"]}, {"id": "P2285", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, I/O MESSAGE, IIM and then enter I:0 and FFFF. 3. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2290", "text": ["7. Enter Rung 4 shown below..............................."], "jumps": ["P2300", "P2280", "P2295"]}, {"id": "P2295", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, XIC and then enter I:0/1. 3. Select BIT, OTE and enter O:0/1. 4. Press ESC and ACCEPT RUNG."], "jumps": ["P2290"]}, {"id": "P2300", "text": ["Now that we have finished entering the program, we want to load it into the PLC and test it. Make sure you have accepted the last rung of the program."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["9. Place the PC5050-1 card in the PC1 position............"], "jumps": ["P2320", "P2300", "P2315"]}, {"id": "P2315", "text": ["PC CARD PLACEMENT - Align the connectors on the PC5050-1 card with the pins for the PC1 position on the Nida Model 5050 PLC Trainer. Gently push down on the PC5050-1 card."], "jumps": []}, {"id": "P2320", "text": ["8. Set the PLC Trainer to the initial control settings....", "Main Power ON DC Power ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF"], "jumps": []}, {"id": "P2325", "text": ["INITIAL CONTROL SETTING - Main Power ON, DC Power ON, Monitor ON, Process Selector OFF, +DC Voltage Select 5V, PC1 & PC2 Power OFF."], "jumps": []}, {"id": "P2330", "text": ["10. Set the PLC Trainer controls as follows:..............", "+DC Voltage Select 24V PC1 Power ON ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF"], "jumps": ["P2335"]}, {"id": "P2335", "text": ["PLC TRAINER CONTROLS - Turn the +DC Voltage Select dial fully CW to the 24V position. Push the PC1 Power switch up to the ON position."], "jumps": []}, {"id": "P2370", "text": ["The trainer is now on and set up to send our program to the trainer. Let's send the program to the trainer.", "I :0/0 Start Switch O :0/0 Led 0 O :0/4 Led 4 I :0/1 Stop Switch O :0/1 Led 1 O :0/5 Led 5 I :0/2 Power Switch O :0/2 Led 2 O :0/6 Led 6 O :0/3 Led 3 O :0/7 Led 74"], "jumps": ["P2380", "P2330"]}, {"id": "P2380", "text": ["11. Press F1 [SAVE/GO ONLINE]. If the file exists, you will be asked if you would like to overwrite it. Press F8 [YES]. If the processor is not in program mode, the APS software will ask you if it can switch to that mode. Press F8 [YES]."], "jumps": ["P2390", "P2370"]}, {"id": "P2390", "text": ["12. Once the program has been sent, the APS software will ask you if you would like to switch to run mode. Again, press F8 [YES]."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["The program you have entered is now running. Press the START button on the Process Control board. START should cause LED 0 to turn on. Release the START button and LED 0 should turn off..."], "jumps": ["P2410", "P2390"]}, {"id": "P2410", "text": ["Press and release the STOP button. LED 1 should illuminate while the button is pressed and turn off when you release the button. Remember, you can view the screen of the APS software to observe what is happening in your program..."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["This completes the demonstration on the I/O instructions. Feel free to create your own ladder logic and enter it into the APS software. It is easier to write your logic on paper first and then enter it into the software..."], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["If you want to edit your program, select EDIT and edit DISK PROGRAM. Then follow the same steps to send the program to the PLC Trainer. The inputs and outputs are listed below.", "I :0/0 Start Switch O :0/0 Led 0 O :0/4 Led 4 I :0/1 Stop Switch O :0/1 Led 1 O :0/5 Led 5 I :0/2 Power Switch O :0/2 Led 2 O :0/6 Led 6 O :0/3 Led 3 O :0/7 Led 74"], "jumps": ["P2440", "P2420"]}, {"id": "P2440", "text": ["13. Press F3 [EXIT] or ESC and then F3 depending on where you left off in the APS software. Now select F3 [RETURN TO MENU] and then F10 [EXIT SYSTEM]."], "jumps": ["P2450", "P2430"]}, {"id": "P2450", "text": ["14. Return the PLC Trainer to the initial control settings.", "Main Power ON DC Power ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF"], "jumps": []}, {"id": "P2460", "text": ["15. Turn OFF the PLC Trainer's main power switch.........."], "jumps": []}, {"id": "P2470", "text": ["16. Return all PC cards and test equipment to their proper storage location."], "jumps": ["P2910", "P2460"]}, {"id": "P2910", "text": ["This completes the experiment on I/O AND INTERRUPT INSTRUCTIONS."], "jumps": ["P2001", "P2470"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3020", "text": ["The 130A discussion starts here............................", "In this experiment, we are going to program the PLC Trainer to use some of the I/O instructions that you have learned in this lesson. The particular PLC Trainer you are using does not support interrupts."], "jumps": ["P3030", "P3001"]}, {"id": "P3030", "text": ["Before actually beginning the ladder logic programming, you must create a new processor program and make the appropriate configurations as you did in the lesson on bit instructions programming..."], "jumps": ["P3020"]}, {"id": "P3040", "text": ["Before we can actually program the PLC, we need to make sure that the software and interface are set up and operating properly."], "jumps": ["P3020"]}, {"id": "P3050", "text": ["1. Ensure the 5050 interface cable is connected between the Nida Model 5050 PLC Trainer and the computer which has the RSLinx and RSLogix software..."], "jumps": ["P3020"]}, {"id": "P3060", "text": ["2. Turn on the 5050 PLC Trainer............................"], "jumps": ["P3050"]}, {"id": "P3070", "text": ["3. Start the RSLinx communication software by double-clicking on the RSLinx icon that is on the computer desktop that has the RSLinx software and is attached to the PLC Trainer. If the software did not start, see your instructor for assistance..."], "jumps": ["P3060"]}, {"id": "P3080", "text": ["4. Now we need to know if the computer and PLC Trainer are communicating. In the right window, double-click on the AB_PIC-1 DH-485 icon."], "jumps": ["P3070"]}, {"id": "P3090", "text": ["5. Make sure that the PLC icon does not have a red X over it. If a red X is present, make sure the PLC Trainer is turned on and connected. If the PLC is still not active, see your instructor for assistance.."], "jumps": ["P3080"]}, {"id": "P3100", "text": ["6. Click on the minimize button. This is the \"_ \" in the upper right- hand corner of the window..........."], "jumps": ["P3090"]}, {"id": "P3110", "text": ["7. Start the RSLogix software by double-clicking on the RSLogix icon the computer's desktop, which has the RSLogix software and is attached to the PLC Trainer. If the software did not start, see your instructor for assistance."], "jumps": ["P3100"]}, {"id": "P3120", "text": ["8. Click on the maximize button to bring the window to full size. This is the button just to the right of the minimize button."], "jumps": ["P3100"]}, {"id": "P3130", "text": ["9. Set up a new processor file and begin editing the ladder logic program. If you need help on configuring and setting up the PLC RSLogix software, select the help button below."], "jumps": ["P3120", "P3135"]}, {"id": "P3135", "text": ["Follow these steps to set up the RSLogix software for ladder logic program entry and evaluation: From the standard toolbar, click on the NEW icon (icon looks like a piece of paper). 2. Enter a file name in the processor name text box. You must choose a name that does not already exist and is less than ten characters in length. Do not forget this file name. 3. Now that we have entered a filename, we will need to select the PLC type and the different I/O modules that we have attached to the system. In the case of the Nida PLC Trainer, there are two extra modules: a TTL module and an analog module. 4. At the bottom of the select processor type window, AB_PIC-1 should be displayed in the driver text box. If not displayed, click on the down-arrow and select AB_PIC-1. 5. Using the listbox scroll bar arrows, scroll until 1747-L20C/F 12-DC SNK In, 8-RLY Out is displayed. Click on this PLC processor and then click on OK. 6. Two windows should appear. The left window is the project window and displays the project files. The right window is the ladder window and displays the selected ladder program. LAD2 should be displayed in the ladder window title bar. 7. Now you need to select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 8. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. 9. In the right window scroll down and double-click on the 1746-IG16 16-Input (TTL-SOURCE) 5VDC module name to transfer the module information to the left window for the #1 slot of the PLC. 10. In the right window scroll down and double click on the 1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out module name to transfer the module information to the left window for the #2 slot of the PLC. 11. Save the configuration settings by clicking on the I/O configuration close button. This button is the X in top right-hand corner of the I/O configuration window. 12. The processor section of your file is complete. You are now at the main window and should see the end ladder in the ladder window...", "1. From the standard toolbar, click on the NEW icon (icon looks like a piece of paper). 2. Enter a file name in the processor name text box. You must choose a name that does not already exist and is less than ten characters in length. Do not forget this file name. 3. Now that we have entered a filename, we will need t me text box. You must choose a name that does not already exist and is less than ten characters in length. Do not forget this file name. 3. Now that we have entered a filename, we will need to select the PLC type and the different I/O modules that we have attached to the system. In the case of the Nida PLC Trainer, there are two extra modules: a TTL module and an analog module. 4. At the bottom of the select processor type window, AB_PIC-1 should be displayed in the driver text box. If not displayed, click on the down-arrow and select AB_PIC-1. 5. Using the listbox scroll bar arrows, scroll until 1747-L20C/F 12-DC SNK In, 8-RLY Out is displayed. Click on this PLC processor and then click on OK. 6. Two windows should appear. The left window is the project window and displays the project files. The right window is the ladder window and displays the selected ladder program. LAD2 should be displayed in the ladder window title bar. 7. Now you need to select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 8. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. 9. In the right window scroll down and double-click on the 1746-IG16 16-Input (TTL-SOURCE) 5VDC module name to transfer the module information to the left window for the #1 slot of the PLC. 10. In the right window scroll down and double click on the 1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out module name to transfer the module information to the left window for the #2 slot of the PLC. 11. Save the configuration settings by clicking on the I/O configuration close button. This button is the X in top right-hand corner of the I/O configuration window. 12. The processor section of your file is complete. You are now at the main window and should see the end ladder in the ladder window...", "5. Using the listbox scroll bar arrows, scroll until 1747-L20C/F 12-DC SNK In, 8-RLY Out is displayed. Click on this PLC processor and then click on OK. 6. Two windows should appear. The left window is the project window and displays the project files. The right window is the ladder window and displays the selected ladder program. LAD2 should be displayed in the ladder window title bar. 7. Now you need to select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 8. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. window scroll down and double click on the 1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out module name to transfer the module information to the left window for the #2 slot of the PLC. 11. Save the configuration settings by clicking on the I/O configuration close button. This button is the X in top right-hand corner of the I/O configuration window. 12. The processor section of your file is complete. You are now at the main window and should see the end ladder in the ladder window."], "jumps": []}, {"id": "P3137", "text": ["Follow these steps to set up the RSLogix software for ladder logic program entry and evaluation: From the standard toolbar, click on the NEW icon (icon looks like a piece of paper). 2. Enter a file name in the processor name text box. You must choose a name that does not already exist and is less than ten characters in length. Do not forget this file name. 3. Now that we have entered a filename, we will need to select the PLC type and the different I/O modules that we have attached to the system. In the case of the Nida PLC Trainer, there are two extra modules: a TTL module and an analog module. 4. At the bottom of the select processor type window, AB_PIC-1 should be displayed in the driver text box. If not displayed, click on the down-arrow and select AB_PIC-1. 5. Using the listbox scroll bar arrows, scroll until 1747-L20C/F 12-DC SNK In, 8-RLY Out is displayed. Click on this PLC processor and then click on OK. 6. Two windows should appear. The left window is the project window and displays the project files. The right window is the ladder window and displays the selected ladder program. LAD2 should be displayed in the ladder window title bar. 7. Now you need to select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 8. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. 9. In the right window scroll down and double-click on the 1746-IG16 16-Input (TTL-SOURCE) 5VDC module name to transfer the module information to the left window for the #1 slot of the PLC. 10. In the right window scroll down and double click on the 1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out module name to transfer the module information to the left window for the #2 slot of the PLC. 11. Save the configuration settings by clicking on the I/O configuration close button. This button is the X in top right-hand corner of the I/O configuration window. 12. The processor section of your file is complete. You are now at the main window and should see the end ladder in the ladder window...", "9. In the right window scroll down and double-click on the 1746-IG16 16-Input (TTL-SOURCE) 5VDC module name to transfer the module information to the left window for the #1 slot of the PLC. 10. In the right window scroll down and double click on the 1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out module name to transfer the module information to the left window for the #2 slot of the PLC. 11. Save the configuration settings by clicking on the I/O configuration close button. This button is the X in top right-hand corner of the I/O configuration window. 12. The processor section of your file is complete. You are now at the main window and should see the end ladder in the ladder window."], "jumps": []}, {"id": "P3140", "text": ["The program below is the ladder logic program you are going to enter to demonstrate some of the I/O and interrupt instructions that you learned in the first part of this lesson."], "jumps": ["P3150", "P3130"]}, {"id": "P3150", "text": ["Before we actually begin entering the program into the PLC RSLogix software, let's look at what the program should do. This will help us understand if the program is operating properly when we test it..."], "jumps": ["P3160", "P3140"]}, {"id": "P3160", "text": ["It is important to realize that the Immediate Input with Mask and Immediate Output with Mask instructions are normally used in large ladder logic programs where timing is critical and one can't wait until the end of the cycle to write or scan inputs and outputs..."], "jumps": ["P3170", "P3140"]}, {"id": "P3170", "text": ["For this reason, the program you enter will not allow you to see the overall benefits to the IIM or IOM instructions. The purpose of this experiment is to let you see how they are entered into ladder logic..."], "jumps": ["P3180", "P3140"]}, {"id": "P3180", "text": ["Remember, at the beginning of the ladder logic program, the PLC will have just finished writing the outputs, performing communication operations, and scanning the inputs. For this reason, we know the inputs and outputs are up to date.."], "jumps": ["P3190", "P3140"]}, {"id": "P3190", "text": ["The first rung checks to see if the START button on the 5050-1 card is pressed down. Remember, the START button is connected to the 0 input of the input module built into the PLC."], "jumps": ["P3200", "P3180"]}, {"id": "P3200", "text": ["When the switch is pressed in, the associated bit in the input data file will be set to one when scanned by the PLC. If the key is not being pressed, the bit will be scanned and indicated by a zero in the data file.."], "jumps": ["P3210", "P3180"]}, {"id": "P3210", "text": ["In this rung, the LED attached to output 0 of the output module will be enabled if the START switch is pressed down. When the button is released and this rung is evaluated again, the LED will extinguish.."], "jumps": ["P3220", "P3180"]}, {"id": "P3220", "text": ["Rung 2 contains the Immediate Output with Mask (IOM) instruction. The parameters to this instruction indicate that we want to update all the output bits of output module 0, word 0. Remember, FFFF in hex is 1111111111111111 in binary. Ones indicate update with new values. RSLogix displays the Mask value in hexadecimal format..."], "jumps": ["P3230", "P3180"]}, {"id": "P3225", "text": ["MASK VALUE - Notice the h in the Mask value. When entering a decimal mask, just type in the value. When entering a binary mask, type in the value followed by the letter B. When entering a hexadecimal mask, type in the value followed by the letter H."], "jumps": []}, {"id": "P3230", "text": ["If the START button is pressed down, this instruction will cause the LED to illuminate now instead of at the normal output write cycle."], "jumps": ["P3240", "P3220"]}, {"id": "P3240", "text": ["The third rung contains the Immediate Input with Mask (IIM) instruction. At this point, we want to scan the inputs again to see if any of the key conditions have changed. We are using a mask of FFFF so all inputs are updated.."], "jumps": ["P3250", "P3220"]}, {"id": "P3250", "text": ["The last rung checks to see if the STOP button is being pressed. This button is attached to the 1 input of the PLC inputs. While this button is pressed, the associated bit in the input data file is set to one.."], "jumps": ["P3260", "P3220"]}, {"id": "P3260", "text": ["With this bit set to one, the LED attached to output 1 of the output module will be enabled. Again, we don't need another IOM or IIM after this instruction because we are at the end of the ladder. The inputs and outputs will update before evaluation begins at the top of the ladder again."], "jumps": ["P3270", "P3250"]}, {"id": "P3270", "text": ["It is very important to realize that these instructions are used in much larger programs where waiting until the end of the cycle before updating the outputs or scanning the inputs is not possible..."], "jumps": ["P3280", "P3250"]}, {"id": "P3280", "text": ["Let's enter the program and see how it works..............."], "jumps": ["P3290", "P3250"]}, {"id": "P3290", "text": ["Each rung will be presented to you in order for you to type it into the RSLogix software. If you are having trouble, a help button will give you a list of steps for entering the instruction. Try to do as much as possible on your own."], "jumps": ["P3300", "P3280"]}, {"id": "P3300", "text": ["10. Enter rung 1 shown below.............................."], "jumps": ["P3310", "P3290", "P3305"]}, {"id": "P3305", "text": ["1. Add a rung. Highlight the number to the left of the end rung to select the end rung. Click on the user tab. Click on the new rung icon. 2. Add an XIC instruction to the new rung. Click on the bit tab, and then click on the XIC icon. Type B3/0 and press <ENTER>. 3. Add an OTE instruction. Click on the OTE icon. Type O:0/0 and press <ENTER>. 4. Verify the rung. Click on the verify icon (Looks like a computer with a green check mark over it). timer base, select 0.01 and press <ENTER>. For the preset, type 200 and press <ENTER>. For the accumulator, type 0 and press <ENTER>. 5. Verify the rung. Click on the verify icon (Looks like a computer with a green check mark over it).", "RUNG 1rung. Highlight the number to the left of the end rung to select the end rung. Click on the user tab. Click on the new rung icon. 2. Add an XIC instruction. Click on the bit tab, and then click on the XIC icon. Type I:0/0 and press <ENTER>. Add an OTE instruction. Click on the OTE icon. Type O:0/0 and press <ENTER>. 4. Verify the rung. Click on the verify icon (Looks like a computer with a green check mark over it).."], "jumps": []}, {"id": "P3310", "text": ["11. Enter rung 2 shown below.............................."], "jumps": ["P3320", "P3300", "P3315"]}, {"id": "P3315", "text": ["1. Add a rung. Highlight the number to the left of the end rung to select the end rung. Click on the user tab. Click on the new rung icon. 2. Add an IOM instruction to the new rung. Click on the input/output tab and then click on the XOM icon. For the slot, type 0:0.0 and press <ENTER>. For the mask, type FFFFH and press <ENTER>. The \"H\" is used to indicate to the RSLogix program that is a Hexadecimal value. 3. Verify the rung. Click on the verify icon (Looks like a computer with a green check mark over it). g click on the XIC instruction to select it. Click on the user tab, and then click on the rung branch icon. Grab the right side of the new branch and drag it to the right side of the OTL instruction. 5. Add an OTL instruction to the branch. Click on the bottom-left corner of the new branch. Click on the bit tab, and then click on the OTL icon. Type B3/1. 6. Add another branch around the first OTL instruction. On this rung click on the XIC instruction to select it. Click on the user tab, and then click on the rung branch icon. Grab the right side of the new branch and drag it to the right side of the first OTL instruction.", "RUNG 2rung. Highlight the number to the left of the end rung to select the end rung. Click on the user tab. Click on the new rung icon. 2. Add an IOM instruction to the new rung. Click on the input/output tab and then click on the IOM icon. For the slot, type O:0.0 and press <ENTER>. For the mask, type FFFFH and press <ENTER>. The H is used to indicate to the RSLogix program that this is a Hexadecimal value. . Verify the rung. Click on the verify icon (Looks like a computer with a green check mark over it)."], "jumps": []}, {"id": "P3320", "text": ["12. Enter rung 3 shown below.............................."], let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
