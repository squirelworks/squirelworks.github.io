225 2.02", "-- 60 83 108 152 174 202 235 266 303 2.02", "-- 36 50 66 82 105 123 145 162 190 2.02", "The most common rating for wire size in North America is the American Wire Gauge (AWG) scale. The scale provides more than wire size, it also outlines wire resistance and the maximum current allowance. Select next to see a continuation of the chart."], "jumps": ["P1032", "P1030"]}, {"id": "P1032", "text": ["The AWG scale also lists safety guidelines that should be applied when choosing wire.", "* \"Wiring Confined\" Ratings are based upon 15 or more wires in a single bundle. The sum of the actual load currents of the bundled wires should not exceed 20% of the permitted \"wiring confined\" sum carrying capacity. These ratings approximate 60% of the free-air ratings (with some variations due to rounding). They should be used for wire in harnesses, cable, conduit and general chassis conditions. Bundles of fewer than 15 wires may have the allowable sum of the load currents increased as the bundle approaches the single-wire condition..................................", "The AWG scale also lists safety guidelines that should be applied when choosing wire.e.ire.osing wire.provides more than wire size, it also outlines wire resistance and the maximum current allowance. Select next to see a continuation of the chart."], "jumps": ["P1040", "P1030"]}, {"id": "P1040", "text": ["Notice that as the gauge number increases, the wire diameter decreases.  This, in turn, decreases the current carrying capacity of the conductor.", "Notice that as the gauge number increases, the wire diameter decreases. This, in turn, decreases the current carrying capacity of the conductor. - 0.253 IN. Diameter-8 Amps at 80 C 20 AWG - 0.0320 IN. Diameter-10 Amps at 80 C 18 AWG - 0.0403 IN. Diameter-15 Amps at 80 C", "24 AWG - 0.0201 IN. Diameter-6 Amps at 80", "C 22 AWG - 0.253 IN. Diameter-8 Amps at 80", "C 20 AWG - 0.0320 IN. Diameter-10 Amps at 80", "C 18 AWG - 0.0403 IN. Diameter-15 Amps at 80", "22 AWG - 0.0253 IN. Diameter-8 Amps at 80", "C18 AWG - 0.0403 IN. Diameter-15 Amps at 80", "20 AWG - 0.0320 IN. Diameter-10 Amps at 80", "18 AWG - 0.0403 IN. Diameter-15 Amps at 80"], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["For household wiring, typical AWG sizes are 10, 12, and 14 AWG. Hookup wire for many electronic circuits can range from 16 to 24 AWG, while finer wire for wire wrap circuits and small transformers is usually 30 AWG or smaller."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["Most wire sizes, except for very fine conductors, are available in either multi-conductor stranded or single conductor solid form.", "Wire core constructed with a single strand of copper wire..per wire.", "Wire core constructed with multiple strands of fine AWG copper wire."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["Solid wire has the lower resistance of the two for a given wire size.", "Solid wire has the lower resistance of the two for a given wire size. However, stranded wire is generally more flexible and is easier to work with."], "jumps": ["P1072", "P1060"]}, {"id": "P1072", "text": ["However, stranded wire is generally more flexible and is       easier to work with.", "Solid wire is typically used for jumpers on printed circuit boards or point-to-point wiring applications where the wire is unlikely to  experience excessive mechanical stress.", "However, stranded wire is generally more flexible and is easier to work with.", "Solid wire is typically used for jumpers on printed circuit boards or point-to-point wiring applications where the wire is unlikely to experience excessive mechanical stress."], "jumps": ["P1080", "P1060", "P1090"]}, {"id": "P1090", "text": ["Solid wire is more likely to break than stranded wire when subjected to frequent bending or flexing.  Therefore, solid wire      should never be used in such applications.", "Solid wire is more likely to break than stranded wire when subjected to frequent bending or flexing. Therefore, solid wire should never be used in such applications.", "This is not a suitable application for solid wire."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["Stranded wire is available in most of the common solid wire gauges."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["Stranded wire is constructed by tightly winding many strands of fine gauge wire to form a single, flexible conductor.", "Wire core constructed with multiple strands of fine AWG copper wire."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["The term cable is used to describe a set of two or more conductors encased in the same sheath.  There are many varied types of cable, but four of the more common are the parallel, multi-conductor, ribbon, and coaxial cable.", "The term cable is used to describe a set of two or more conductors encased in the same sheath. There are many varied types of cable, but four of the more common are the parallel, multi-conductor, ribbon, and coaxial cable."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["One common example of parallel cable is the 300 W antenna line.  This type of cable is used to connect a television to an antenna when it does not have a direct cable feed.", "One common example of parallel cable is the 300 W antenna line. This type of cable is used to connect a television to an antenna when it does not have a direct cable feed."], "jumps": ["P1140", "P1120", "P", "P2", "PuPuPP"]}, {"id": "P1140", "text": ["The coaxial (coax) cable is used for cable TV transmission lines and oscilloscope probes.  Coaxial cable in its various forms is also used in many types of electronic communications systems, especially where high frequency signals are present.", "The coaxial (coax) cable is used for cable TV transmission lines and oscilloscope probes. Coaxial cable in its various forms is also used in many types of electronic communications systems, especially where high frequency signals are present."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["Multi-conductor cable is typically used for power cords and cabling used to interconnect signal lines between electronic equipment.", "Ribbon cable is typically used for high density inter-connections between circuit boards."], "jumps": ["P1160", "P1140", "P1170", "P1150"]}, {"id": "P1170", "text": ["As wire selection is perhaps the single most important aspect of building a cable assembly, next to the actual selection of the       connector type, it is important to understand the main               characteristics of common wire types.", "As wire selection is perhaps the single most important aspect of building a cable assembly, next to the actual selection of the connector type, it is important to understand the main characteristics of common wire types. (GRAPHICS TEXT) Mechanical Characteristics Environmental Characteristics Electrical Characteristics", "Mechanical Characteristics Environmental Characteristics Electrical Characteristics"], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["There are three basic mechanical characteristics that should be considered when selecting a wire type for a given application.", "The strength of a wire is primarily determined by the type of conductor used, typically copper or aluminum, and the wire gauge.", "There are three basic mechanical characteristics that should be considered when selecting a wire type for a given application. (GRAPHICS TEXT) chanical Characteristics - Conductor Material - Conductor Construction - Wire Jacket (or sheath)", "Mechanical Characteristics - Conductor Material - Conductor Construction - Wire Jacket (or sheath)"], "jumps": ["P1190", "P1170", "P1200", "P1180"]}, {"id": "P1200", "text": ["Copper wire is by far the most common conductor material because of its relatively low resistance, its flexibility, and its strength characteristics."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["Aluminum wire is lightweight and can reduce corona (discharge of electricity in a high potential wire).  This is why aluminum wire is used by power companies to transfer electricity.", "Aluminum wire is lightweight and can reduce corona (discharge of electricity in a high potential wire). This is why aluminum wire is used by power companies to transfer electricity."], "jumps": ["P1220", "P1190"]}, {"id": "P1220", "text": ["Copper is used when the cabling is exposed to flexing and bending stresses.", "Cable subject to frequent flexing and bending."], "jumps": ["P1230", "P1190"]}, {"id": "P1230", "text": ["The conductor construction technique also effects the wire strength, flexibility, and resistance.", "Wire core constructed with a single strand of copper wire.per wire.", "Wire core constructed with multiple strands of fine AWG copper wire."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["Solid wire offers lower wire resistance for a given wire gauge but is less flexible than stranded wire of the same gauge."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["Applications which subject the wire to flexing and bending stresses should use stranded wire.  If the wire resistance is a major concern you can use a larger wire gauge, thus reducing cable resistance.", "Applications which subject the wire to flexing and bending stresses should use stranded wire. If the wire resistance is a major concern you can use a larger wire gauge, thus reducing cable resistance.", "Cable subject to frequent flexing and bending."], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["Finally, when selecting a wire type you should consider the wire jacket material and construction.  Wires are manufactured with wire jackets designed for a wide variety of applications.", "Finally, when selecting a wire type you should consider the wire jacket material and construction. Wires are manufactured with wire jackets designed for a wide variety of applications."], "jumps": ["P1262", "P1250"]}, {"id": "P1262", "text": ["The strength of a wire is primarily determined by the _______ .", "The strength of a wire is primarily determined by the _______ .e of conductor used, typically copper or aluminum, and the wire gauge. or aluminum, and the wire gauge."], "jumps": ["P1260"]}, {"id": "P1261", "text": [], "jumps": []}, {"id": "P1263", "text": ["The conductor construction technique has an effect the wire strength. It is not the primary factor in determining the strength of a wire.", "Wire core constructed with a single strand of copper wire.per wire.", "Wire core constructed with multiple strands of fine AWG copper wire."], "jumps": []}, {"id": "P1264", "text": ["The jacket material protects the wire and makes it more durable. It does not determine the wires strength.", "The jacket material protects the wire and makes it more durable. It does not determine the wires strength. ires strength. gth. th. strength. re manufactured with wire jackets designed for a wide variety of applications."], "jumps": []}, {"id": "P1270", "text": ["There are three basic environmental characteristics that should be considered when selecting a wire type for a given application.", "There are three basic environmental characteristics that should be considered when selecting a wire type for a given application. (GRAPHICS TEXT) Environmental Characteristics - Temperature - Electrical Noise - Vibration", "Environmental Characteristics - Temperature - Electrical Noise - Vibration E"], "jumps": ["P1280", "P1262"]}, {"id": "P1280", "text": ["The environment in which the cable is exposed will have a significant impact on the type of wire selected for the application."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["If the cable is to be exposed to high temperatures then the wire jacket should be constructed with materials like teflon which can withstand the extremes of temperature better than most other        standard wire jacket materials.", "If the cable is to be exposed to high temperatures then the wire jacket should be constructed with materials like teflon which can withstand the extremes of temperature better than most other standard wire jacket materials."], "jumps": ["P1300", "P1270"]}, {"id": "P1300", "text": ["If the cable is to be exposed to an environment that generates excessive electrical noise, shielded or twisted-pair cable should be used.", "Radiated Electrical Signal (Potential Noise Source)"], "jumps": ["P1310", "P1290", "Potential"]}, {"id": "P1310", "text": ["Shielded cable is constructed with a wire braid wrapped around the center insulator.  This braid when grounded provides a low impedance path to ground for noise signals, thereby increasing the wire's noise immunity.", "Shielded cable is constructed with a wire braid wrapped around the center insulator. This braid when grounded provides a low impedance path to ground for noise signals, thereby increasing the wire's noise immunity."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["Twisted-pair cable is constructed by twisting wire pairs around each other.  Twisted-pair cables also increase the cable's noise immunity.", "Twisted-pair cable is constructed by twisting wire pairs around each other. Twisted-pair cables also increase the cable's noise immunity."], "jumps": ["P1330", "P1300"]}, {"id": "P1330", "text": ["Any noise signal picked up on a twisted wire pair encounters the same signal 180\u00ba out-of-phase in the adjacent wire due to magnetic coupling.  The net effect is for the two signals to cancel out.", "If the cabling system is exposed to a high vibration environment stranded wire should be selected because of its higher tolerance to flexing and bending stresses.", "Any noise signal picked up on a twisted wire pair encounters the same signal 180", "out-of-phase in the adjacent wire due to magnetic coupling. The net effect is for the two signals to cancel out."], "jumps": ["P1340", "P1320", "P1342"]}, {"id": "P1342", "text": ["Which type of cable is used to reduce noise?", "Which type of cable is used to reduce noise? oise? extermely hot and humid environment? ally copper or aluminum, and the wire gauge. or aluminum, and the wire gauge."], "jumps": ["P1340"]}, {"id": "P1341", "text": [], "jumps": []}, {"id": "P1343", "text": ["A cable with a teflon jacket  is used in cases where the cable will be exposed to high temperatures.", "A flexible cable would be used in cases where the cable is exposed to high vibration and bending stresses.", "A cable with a teflon jacket is used in cases where the cable will be exposed to high temperatures.then the wire jacket should be constructed with materials like teflon which can withstand the extremes of temperature..................", "A flexible cable would be used in cases where the cable is exposed to high vibration and bending stresses. rance to flexing and bending stresses."], "jumps": []}, {"id": "P1350", "text": ["There are three basic electrical characteristics that should be considered when selecting a wire type for a given application.", "There are three basic electrical characteristics that should be considered when selecting a wire type for a given application. (GRAPHICS TEXT) Electrical Characteristics - Wire Resistance - Wire Current and Voltage Rating - Wire Insulation", "Electrical Characteristics - Wire Resistance - Wire Current and Voltage Rating - Wire Insulation"], "jumps": ["P1360", "P1342"]}, {"id": "P1360", "text": ["The resistance of a given wire is determined by the conductor material, its cross-sectional area, conductor length, and  temperature.", "The resistance of a given wire is determined by the conductor material, its cross-sectional area, conductor length, and temperature."], "jumps": ["P1370", "P1350", "P"]}, {"id": "P1370", "text": ["At a fixed temperature of 20\u00baC (room temperature), the resistance is related to the other three factors by the expression:", "C (room temperature), the resistance is related to the other three factors by the expression:", "WHERE: R = RESISTANCE IN t the ambient cable temperature to 80% of its maximum temperature rating. rating.", "* CURRENT RATING * VOLTAGE RATING * TEMPERATURE RATING"], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["The voltage rating of a wire is a function of the wire's insulation material and operating temperature.  Wire voltage ratings should  never be exceeded.  A good rule of thumb is to limit the voltage to 80% of the wire's maximum voltage rating.", "The voltage rating of a wire is a function of the wire's insulation material and operating temperature. Wire voltage ratings should never be exceeded. A good rule of thumb is to limit the voltage to 80% of the wire's maximum voltage rating. RAPHIC TEXT) * Limit the cable voltage to 80% of its maximum voltage rating. * Limit the ambient cable", "*Limit the cable current to 80% of its maximum current rating. * Limit the cable voltage to 80% of its maximum voltage rating. * Limit the ambient cable temperature to 80% of its maximum temperature rating. rating.", "* CURRENT RATING * VOLTAGE RATING * TEMPERATURE RATING"], "jumps": ["P1440", "P1410"]}, {"id": "P1440", "text": ["Exceeding a wire's voltage, current, or temperature ratings may result in premature insulator breakdown and must be avoided. Always consult the wire manufacturer's data books for wire ratings.", "Exceeding a wire's voltage, current, or temperature ratings may result in premature insulator breakdown and must be avoided. Always consult the wire manufacturer's data books for wire ratings. (GRAPHICS TEXT) Manufacturer's Data Books"], "jumps": ["P1910", "P1410"]}, {"id": "P1699", "text": ["The following ten (10) questions allow you to review the material covered on common wire types and characteristics."], "jumps": ["P1700", "P1001"]}, {"id": "P1700", "text": ["1.  A significant number of electronic equipment failures can be          attributed to _______", "1. A significant number of electronic equipment failures can be attributed to _______", "cable assemblies which are subject to mechanical stress."], "jumps": ["P1699"]}, {"id": "P1710", "text": ["2.  As AWG sizes get smaller, the wire diameter becomes                      _______ and its maximum current capacity _______.", "2. As AWG sizes get smaller, the wire diameter becomes _______ and its maximum current capacity _______."], "jumps": ["P1700"]}, {"id": "P1720", "text": ["3.  For a given wire gauge and conductor material the resistance       of stranded wire is _______.", "3. For a given wire gauge and conductor material the resistance of stranded wire is _______."], "jumps": ["P1710"]}, {"id": "P1730", "text": ["4.  Solid wire is typically used for _______.", "4. Solid wire is typically used for _______...............", "cables subject to flexing and bending.ing.", "point to point wiring.tions.ive mechanical stress.ess. stress..........................................."], "jumps": ["P1720"]}, {"id": "P1740", "text": ["5.  Coaxial cable is typically used in high _______.", "5. Coaxial cable is typically used in high _______........"], "jumps": ["P1730"]}, {"id": "P1750", "text": ["6.  Ribbon cable is typically used for high _______.", "6. Ribbon cable is typically used for high _______........", "density interconnections between equipment chassist chassis.", "density interconnections between circuit boardsit boards."], "jumps": ["P1740"]}, {"id": "P1760", "text": ["7.  When selecting wire, what characteristic(s) must be                          considered?", "7. When selecting wire, what characteristic(s) must be considered?"], "jumps": ["P1750"]}, {"id": "P1770", "text": ["8.  The three basic mechanical characteristics that must be                   considered for a wire's suitability for a given application are           _______.", "8. The three basic mechanical characteristics that must be considered for a wire's suitability for a given application are _______..", "temperature, noise immunity, and conductor material.", "resistance, current, and voltage ratings.", "conductor material, conductor construction, and wire jacket."], "jumps": ["P1760"]}, {"id": "P1780", "text": ["9.  In high electrical noise environments _______ should be used.", "9. In high electrical noise environments _______ should be used."], "jumps": ["P1770"]}, {"id": "P1790", "text": ["10.  At a fixed temperature the resistance of a wire _______.", "10. At a fixed temperature the resistance of a wire _______.", "increases with increases in the wire's cross sectional area.", "decreases with increases in the wire's lengthsectional area.", "increases with increases in the wire's length."], "jumps": ["P1780"]}, {"id": "P1799", "text": ["You have completed the Exercise.\nYou are about to return to the Objective Menu.", "You have completed the Exercise. You are about to return to the Objective Menu......."], "jumps": ["P1001", "P1790"]}, {"id": "P1800", "text": [], "jumps": []}, {"id": "P1801", "text": [], "jumps": []}, {"id": "P1910", "text": ["This completes the information on WIRE TYPES AND CHARACTERISTICS."], "jumps": ["P1001", "P1440"]}, {"id": "P1920", "text": ["1.  The first step in assembling any cable assembly or connector        terminal is the selection of the appropriate wire type and                  size.", "1. The first step in assembling any cable assembly or connector terminal is the selection of the appropriate wire type and size."], "jumps": ["P1940", "P1001"]}, {"id": "P1940", "text": ["2.  Most wire sizes, except for very fine conductors, are available       in either multi-conductor stranded or single conductor solid           form.", "2. Most wire sizes, except for very fine conductors, are available in either multi-conductor stranded or single conductor solid form.", "Wire core constructed with a single strand of copper wire.per wire.", "Wire core constructed with multiple strands of fine AWG copper wire."], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["3.  The term cable is used to describe a set of two or more                     conductors encased in the same sheath.  There are many               varied types of cable, but four of the more common are the             parallel, multi-conductor, ribbon, and coaxial cable.", "3. The term cable is used to describe a set of two or more conductors encased in the same sheath. There are many varied types of cable, but four of the more common are the parallel, multi-conductor, ribbon, and coaxial cable."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["4.  As wire selection is perhaps the single most important aspect       of building a cable assembly, next to the actual selection of            the connector type, it is important to understand the main               characteristics of common wire types.", "4. As wire selection is perhaps the single most important aspect of building a cable assembly, next to the actual selection of the connector type, it is important to understand the main characteristics of common wire types. Mechanical Characteristics Environmental Characteristics Electrical Characteristics", "Mechanical Characteristics Environmental Characteristics Electrical Characteristics sheath)"], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["5.  There are three basic mechanical characteristics that should          be considered when selecting a wire type for a given                        application.", "5. There are three basic mechanical characteristics that should be considered when selecting a wire type for a given application. racteristics - Conductor Material - Conductor Construction - Wire Jacket (or sheath)", "Mechanical Characteristics - Conductor Material - Conductor Construction - Wire Jacket (or sheath)"], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["6.  There are three basic environmental characteristics that                   should be considered when selecting a wire type for a given          application.", "6. There are three basic environmental characteristics that should be considered when selecting a wire type for a given application. l Characteristics - Temperature - Electrical Noise - Vibration", "Environmental Characteristics - Temperature - Electrical Noise - Vibration"], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["7.  There are three basic electrical characteristics that should be         considered when selecting a wire type for a given application.", "7. There are three basic electrical characteristics that should be considered when selecting a wire type for a given application. (GRAPHICS TEXT) l Characteristics - Wire Resistance - Wire Current and Voltage Rating - Wire Insulation", "Electrical Characteristics - Wire Resistance - Wire Current and Voltage Rating - Wire Insulation"], "jumps": ["P1999", "P1980"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P2001", "text": ["The type of connector attached to the ends of a cable or wire will be determined by the application.", "The type of connector attached to the ends of a cable or wire will be determined by the application.es purpose."], "jumps": ["P2022", "P2001"]}, {"id": "P2022", "text": ["Besides the western union splice there are six other typical wire connections."], "jumps": ["P2030", "P2020"]}, {"id": "P2030", "text": ["Let's look at the crimp connector, also known as a butt splice first."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["The crimp connector is basically a plastic housing with a metal sleeve insert."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["To assemble a crimp connector you will require the following tools:", "To assemble a crimp connector you will require the following tools: (GRAPHICS TEXT) 1 - Crimp Connector Assembly 1 - A length of Test Lead Cable 1 - Crimping Tool 1 - 25 Watt Soldering Iron 1 - Wire Stripper", "1 - Crimp Connector Assembly 1 - A length of Test Lead Cable 1 - Crimping Tool 1 - 25 Watt Soldering Iron 1 - Wire Stripper"], "jumps": ["P2060", "P2040", "P"]}, {"id": "P2060", "text": ["The wires that are to be spliced are stripped, tinned with solder, and inserted into each end of the connector.  The plastic housing must completely cover the bare wire on both connectors.", "The wires that are to be spliced are stripped, tinned with solder, and inserted into each end of the connector. The plastic housing must completely cover the bare wire on both connectors."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["A crimping tool is used to compress each end of the connector so that each wire is held into the connector by a pressure fit.", "A crimping tool is used to compress each end of the connector so that each wire is held into the connector by a pressure fit. CRIMPING TOOL"], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["When using crimp connectors always use a proper crimping tool.  Never use pliers to compress the crimp connector as they do not form a reliable connection and will likely damage the connector.", "When using crimp connectors always use a proper crimping tool. Never use pliers to compress the crimp connector as they do not form a reliable connection and will likely damage the connector."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["Crimp connectors can also be used to terminate wires when they are to be connected to an equipment chassis or a terminal strip."], "jumps": ["P2100", "P2070"]}, {"id": "P2100", "text": ["These terminations are available in a number of various sizes and styles depending upon where they are to be used and the required wire gauge."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["BANANA PLUG AND TEST PROBE ASSEMBLY\nMany pieces of electronic test equipment require quick               connect/disconnect test plugs and probes.  In these applications banana plugs and test probes are frequently used.", "BANANA PLUG AND TEST PROBE ASSEMBLY Many pieces of electronic test equipment require quick connect/disconnect test plugs and probes. In these applications banana plugs and test probes are frequently used."], "jumps": ["P2120", "P2090"]}, {"id": "P2120", "text": ["The assembly procedure for a banana plug and a test probe are identical.  To assemble a banana plug or test probe you will require the following tools:", "The assembly procedure for a banana plug and a test probe are identical. To assemble a banana plug or test probe you will require the following tools: (GRAPHICS TEXT) 1 - Banana Plug or Test Probe Assembly 1 - A Length of Test Lead Wire 1 - Wire Strippers", "1 - Banana Plug or Test Probe Assembly 1 - A Length of Test Lead Wire 1 - Wire Strippers Stripper"], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["The first step in assembling a banana plug/test probe is to strip off approximately 0.5 inches of insulation from the test lead wire.", "Wire core constructed with multiple strands of fine AWG copper wire."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["Next unthread the banana plug/test probe tip from the connector housing by turning it counter-clockwise.  The plug's plastic housing is then slid over the cable.", "Then slide the stripped end of the test lead wire into the back of the banana plug/test probe tip until the wire insulation is seated    against the inside edge of the probe tip insert.", "Next unthread the banana plug/test probe tip from the connector housing by turning it counter-clockwise. The plug's plastic housing is then slid over the cable.", "Then slide the stripped end of the test lead wire into the back of the banana plug/test probe tip until the wire insulation is seated against the inside edge of the probe tip insert."], "jumps": ["P2150", "P2130", "P2160"]}, {"id": "P2160", "text": ["Now comb out the wire strands and wrap them around the probe tip in a counter-clockwise direction.  Ensure that the wire strands are all routed in the wire channel of the probe tip.", "Now comb out the wire strands and wrap them around the probe tip in a counter-clockwise direction. Ensure that the wire strands are all routed in the wire channel of the probe tip."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["Finally, slide the plastic housing up to the probe tip and thread it back onto the probe tip by turning it in a clockwise direction."], "jumps": ["P2180", "P2150"]}, {"id": "P2180", "text": ["Inspect the completed connector assembly to ensure that none of the conductor's wire strands are exposed.  If exposed wire strands are noted, disassemble the connector and repeat the assembly procedure.", "Inspect the completed connector assembly to ensure that none of the conductor's wire strands are exposed. If exposed wire strands are noted, disassemble the connector and repeat the assembly procedure."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["ALLIGATOR CLIP ASSEMBLY\nSometimes it is desired to have the test lead terminated in an alligator clip.", "ALLIGATOR CLIP ASSEMBLY Sometimes it is desired to have the test lead terminated in an alligator clip."], "jumps": ["P2200", "P2170"]}, {"id": "P2200", "text": ["To assemble a alligator clip you will require the following tools:", "To assemble a alligator clip you will require the following tools: RAPHICS TEXT) 1 - Alligator Clip Assembly 1 - A Length of Test Wire 1 - Wire Strippers 1 - 25 Watt Soldering Iron", "1 - Alligator Clip Assembly 1 - A Length of Test Wire 1 - Wire Strippers 1 - 25 Watt Soldering Iron Stripper"], "jumps": ["P2210", "P2190", "PPX", "PZ", "PMM", "PR", "P", "PPM", "PP", "PT", "PMPXRR", "PLUUfj"]}, {"id": "P2210", "text": ["The first step in assembling an alligator clip is to strip off approximately 0.5 inches of insulation from the test lead wire.      Second,  tin the exposed bare wire.", "The first step in assembling an alligator clip is to strip off approximately 0.5 inches of insulation from the test lead wire. Second, tin the exposed bare wire.", "Wire core constructed with multiple strands of fine AWG copper wire."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["Third, slide the stripped end of the test lead wire into the back of the alligator clip until the wire insulation is seated against the    inside edge of the clip.  Ensure that the tinned wire extends into    the solder cup on the alligator clip.", "Third, slide the stripped end of the test lead wire into the back of the alligator clip until the wire insulation is seated against the inside edge of the clip. Ensure that the tinned wire extends into the solder cup on the alligator clip."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["Next using minimum heat and dwell time, solder the test lead to the alligator clip."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["Inspect the solder connection for cold solder joints.  If the solder finish is dull you have a cold solder joint and the connector will     have to be disassembled and the assembly procedure repeated.", "Inspect the solder connection for cold solder joints. If the solder finish is dull you have a cold solder joint and the connector will have to be disassembled and the assembly procedure repeated."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["BNC CONNECTOR ASSEMBLY PROCEDURE \nBNC connectors are used with coaxial cable for high frequency signal applications.  Coaxial cables may be terminated with BNC connectors on both ends or alligator clip to BNC connectors if they are to be used for scope probes.", "To assemble a BNC connector you will require the following tools:", "BNC CONNECTOR ASSEMBLY PROCEDURE BNC connectors are used with coaxial cable for high frequency signal applications. Coaxial cables may be terminated with BNC connectors on both ends or alligator clip to BNC connectors if they are to be used for scope probes.", "To assemble a BNC connector you will require the following tools: (GRAPHICS TEXT) 1 - BNC Connector Assembly 1 - A Length of Coaxial Cable (RG58) 1 - 25 Watt Soldering Iron 1 - X-ACTO Knife (or equivalent) 1 - 7/16 Inch Wrench", "1 - BNC Connector Assembly 1 - A Length of Coaxial Cable (RG58) 1 - 25 Watt Soldering Iron 1 - X-ACTO Knife (or equivalent) 1 - 7/16 Inch Wrench"], "jumps": ["P2260", "P2230", "P2270", "P2250"]}, {"id": "P2270", "text": ["Cut the coaxial cable end so that it is as flat and even as possible.  Then slide the clamp nut, washer, and gasket over the cable.", "Cut the coaxial cable end so that it is as flat and even as possible. Then slide the clamp nut, washer, and gasket over the cable."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["Use an X-ACTO knife to remove the sheath jacket (outer covering - not the braid) a distance of 5/16\" from the end of the cable back.  Take care not to cut any braid strands.", "Use an X-ACTO knife to remove the sheath jacket (outer covering - not the braid) a distance of 5/16\" from the end of the cable back. Take care not to cut any braid strands."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["The best method for removing the wire jacket is by lightly scoring the jacket with an X-ACTO knife then bending the cable along the scored edge and lightly cutting the jacket around the cable circumference."], "jumps": ["P2280"]}, {"id": "P2300", "text": ["Next slide the braid clamp over the cable.  The braid clamp should rest against the jacket edge.  Then comb the braid wires out and fold them down and over the top of the braid clamp. Ensure that they are evenly spaced around the braid clamp.", "Next slide the braid clamp over the cable. The braid clamp should rest against the jacket edge. Then comb the braid wires out and fold them down and over the top of the braid clamp. Ensure that they are evenly spaced around the braid clamp."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["Cut any excess strands of the braid back to the end of the braid clamp."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["Carefully remove the dielectric from the center connector conductor to a length of 1/10\" from the end.  Ensure that the measurement is as accurate as possible, because the center conductor  will not fit properly in the connector body if the length is not correct.", "Carefully remove the dielectric from the center connector conductor to a length of 1/10\" from the end. Ensure that the measurement is as accurate as possible, because the center conductor will not fit properly in the connector body if the length is not correct. ect."], "jumps": ["P2330", "P2300"]}, {"id": "P2330", "text": ["Make sure that the center conductor strands are tightly twisted together and then, using minimum heat and dwell time, tin the center conductor."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["Do not apply too much solder and do not heat the connection for too long or the dielectric will melt or flare."], "jumps": ["P2350", "P2320"]}, {"id": "P2350", "text": ["Slide the center pin over the tinned center conductor and apply heat and a small amount of solder to make a good connection. Do not apply too much solder and do not heat the connection for too long or the dielectric will melt or flare."], "jumps": ["P2360", "P2320"]}, {"id": "P2360", "text": ["Insert the completed assembly into the connector body.  Ensure that the center pin is in the correct position and fully inserted into the connector body.  The center pin should be almost flush with the end of the connector body when fully inserted.", "Insert the completed assembly into the connector body. Ensure that the center pin is in the correct position and fully inserted into the connector body. The center pin should be almost flush with the end of the connector body when fully inserted."], "jumps": ["P2370", "P2350"]}, {"id": "P2370", "text": ["Slide the clamp nut, washer, and gasket up to the braid clamp. Insert the gasket and washer evenly into the connector body and thread the clamp nut into place."], "jumps": ["P2380", "P2360"]}, {"id": "P2380", "text": ["When threading and tightening the clamp nut into the body, keep the body fixed and turn the clamp nut only."], "jumps": ["P2390", "P2370"]}, {"id": "P2390", "text": ["Use the appropriate wrench to tighten the clamp nut and ensure that the entire BNC assembly is secure.  Do not over tighten the clamp nut.", "Use the appropriate wrench to tighten the clamp nut and ensure that the entire BNC assembly is secure. Do not over tighten the clamp nut."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["Inspect the finished connector to ensure that the assembly is secure and that the center pin is almost flush with the connector body.  If not, disassemble the connector and repeat the assembly procedure.", "RIBBON CABLE ASSEMBLY PROCEDURE\nRibbon cable is typically used for high density inter-connections  between circuit boards.", "To assemble a ribbon connector you will require the following tools:", "A ribbon cable connector consists of a connector cover and a connector body with \"V\" contacts placed in a staggered fashion  designed to line up with the ribbon cable conductors.", "Inspect the finished connector to ensure that the assembly is secure and that the center pin is almost flush with the connector body. If not, disassemble the connector and repeat the assembly procedure.", "Center Pin should not extend past the end of the connector body.", "RIBBON CABLE ASSEMBLY PROCEDURE Ribbon cable is typically used for high density inter-connections between circuit boards.....", "To assemble a ribbon connector you will require the following tools: (GRAPHICS TEXT) 1 - Ribbon Cable Connector Assembly 1 - A Length of Ribbon Cable 1 - Ribbon Cable Connector Press 1 - Diagonal Cutters", "1 - Ribbon Cable Connector Assembly 1 - A Length of Ribbon Cable 1 - Ribbon Cable Connector Press 1 - Diagonal Cutters Inch Wrench", "A ribbon cable connector consists of a connector cover and a connector body with \"V\" contacts placed in a staggered fashion designed to line up with the ribbon cable conductors."], "jumps": ["P2410", "P2390", "P2420", "P2425", "P2430"]}, {"id": "P2430", "text": ["Ribbon cable and ribbon cable connectors are commonly available in the 10, 14, 16, 20, 26, 34, 40, 50, and 60 conductor sizes."], "jumps": ["P2440", "P2420"]}, {"id": "P2440", "text": ["Note that most ribbon cable manufacturers color code the first conductor in a ribbon cable.  This color coded conductor should match up with pin one on the connector body.", "Note that most ribbon cable manufacturers color code the first conductor in a ribbon cable. This color coded conductor should match up with pin one on the connector body."], "jumps": ["P2450", "P2425"]}, {"id": "P2450", "text": ["If the only available ribbon cable has more conductors than required it can be stripped length-wise as shown below to the       correct number of conductors.", "If the only available ribbon cable has more conductors than required it can be stripped length-wise as shown below to the correct number of conductors."], "jumps": ["P2460", "P2425"]}, {"id": "P2460", "text": ["Once the ribbon cable has been stripped to the required number of conductors, place the ribbon cable over the \"V\" contacts of the connector body.  Make sure that the cable is aligned in parallel with the contacts or you may short adjacent conductors.", "Once the ribbon cable has been stripped to the required number of conductors, place the ribbon cable over the \"V\" contacts of the connector body. Make sure that the cable is aligned in parallel with the contacts or you may short adjacent conductors."], "jumps": ["P2470", "P2450"]}, {"id": "P2470", "text": ["Next place the connector cover of the connector body, making sure that it aligns with the cable conductors and the connector body."], "jumps": ["P2480", "P2460"]}, {"id": "P2480", "text": ["Place the connector in an assembly press  and apply enough pressure to snap the two sides of the connector together.  This results in the locking tabs holding the connector components together and forces the \"V\" contacts to cut through the wire insulation and make contact with the conductors.", "Place the connector in an assembly press and apply enough pressure to snap the two sides of the connector together. This results in the locking tabs holding the connector components together and forces the \"V\" contacts to cut through the wire insulation and make contact with the conductors."], "jumps": ["P2490", "P2460"]}, {"id": "P2490", "text": ["When the compression fit is finished, remove the connector from the press and trim any excess cable with a pair of diagonal cutters."], "jumps": ["P2500", "P2480"]}, {"id": "P2500", "text": ["Inspect the finished connector for proper alignment and potential shorts between conductors using an ohmmeter."], "jumps": ["P2510", "P2490"]}, {"id": "P2510", "text": ["CIRCULAR CONNECTOR ASSEMBLY PROCEDURE \nCircular connectors are typically used for interconnections between equipment chassis.  These connectors provide rugged quick-connect, quick-disconnect connections between equipment chassis.", "To assemble a circular connector you will require the following tools :", "CIRCULAR CONNECTOR ASSEMBLY PROCEDURE Circular connectors are typically used for interconnections between equipment chassis. These connectors provide rugged quick-connect, quick-disconnect connections between equipment chassis.", "To assemble a circular connector you will require the following tools : (GRAPHICS TEXT) 1 - Circular Connector Assembly 1 - A Length of Multi-conductor Cable 1 - 25 Watt Soldering Iron 1 - Diagonal Cutters 1 - A Length Heat Shrink Tubing", "1 - Circular Connector Assembly 1 - A Length of Multi-conductor Cable 1 - 25 Watt Soldering Iron 1 - Diagonal Cutters 1 - A Length Heat Shrink Tubing 1 - Heat Gun"], "jumps": ["P2520", "P2490", "P2530", "P2510"]}, {"id": "P2530", "text": ["The circular connector consists of a connector housing, which holds the connector pins, a rubber gasket, and a cable clamp/strain relief assembly."], "jumps": ["P2540", "P2520"]}, {"id": "P2540", "text": ["The pins within the connector housing may be male or female depending upon requirements.  These pins may be fixed in the housing or require insertion depending on the connector design.", "The pins within the connector housing may be male or female depending upon requirements. These pins may be fixed in the housing or require insertion depending on the connector design."], "jumps": ["P2550", "P2530"]}, {"id": "P2550", "text": ["If the connector is the type where the pins may be inserted or removed then special insertion/extraction tools are required to      install or remove the pins.", "If the connector is the type where the pins may be inserted or removed then special insertion/extraction tools are required to install or remove the pins."], "jumps": ["P2560", "P2540"]}, {"id": "P2560", "text": ["In all cases, the connector pins have a solder cup in which the conductor is soldered into placed."], "jumps": ["P2570", "P2540"]}, {"id": "P2570", "text": ["The first step in assembling a circular connector is to strip back the cable jacket about 1.5 inches.  Then strip and tin each of the    individual conductors.  Next cut a 1/4 inch length of heat shrink    tubing for each conductor.", "The first step in assembling a circular connector is to strip back the cable jacket about 1.5 inches. Then strip and tin each of the individual conductors. Next cut a 1/4 inch length of heat shrink tubing for each conductor."], "jumps": ["P2580", "P2540"]}, {"id": "P2580", "text": ["Next slide the cable clamp and rubber gasket over the multi-conductor cable."], "jumps": ["P2590", "P2570"]}, {"id": "P2590", "text": ["Select the first conductor and slide the heat shrink tubing over the conductor.  Then solder the conductor to the appropriate pin. Repeat this procedure for each conductor.", "Select the first conductor and slide the heat shrink tubing over the conductor. Then solder the conductor to the appropriate pin. Repeat this procedure for each conductor."], "jumps": ["P2600", "P2580"]}, {"id": "P2600", "text": ["With all conductors soldered in place, slide the heat shrink tubing down over the connector pins and apply heat to shrink the tubing around the pin.", "Heat Shrink Tubing - Apply heat to shrink tubing"], "jumps": ["P2610", "P2590"]}, {"id": "P2610", "text": ["Next, slide the rubber gasket and cable clamp up to the connector housing and thread cable clamp securely into the connector housing."], "jumps": ["P2620", "P2600"]}, {"id": "P2620", "text": ["Finally, tighten the cable clamp screws to securely clamp the multi-conductor cable in place."], "jumps": ["P2630", "P2610"]}, {"id": "P2630", "text": ["Inspect the completed connector assembly to ensure that all components are securely fastened."], "jumps": ["P2910", "P2620"]}, {"id": "P2699", "text": ["The following ten (10) questions allow you to review the material covered on connector termination techniques."], "jumps": ["P2700", "P2001"]}, {"id": "P2700", "text": ["1.  A crimp connector is a quick, reliable method for _______.", "1. A crimp connector is a quick, reliable method for _______.", "connecting three or more wires together."], "jumps": ["P2699"]}, {"id": "P2710", "text": ["2.  Which of the following is the incorrect tool for making a crimp        termination?", "2. Which of the following is the incorrect tool for making a crimp termination?"], "jumps": ["P2700"]}, {"id": "P2720", "text": ["3.  Ring and Spade \"Stake-Ons\" are _______.", "3. Ring and Spade \"Stake-Ons\" are _______.................", "used to terminate wires to equipment chassis.", "used to terminate wires to terminal strips."], "jumps": ["P2710"]}, {"id": "P2730", "text": ["4.  When assembling a banana plug the test lead wire strands              must be _______.", "4. When assembling a banana plug the test lead wire strands must be _______.", "combed out and twisted around the wire ch let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
