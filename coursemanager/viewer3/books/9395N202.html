<script>
const book = {"title": "9395N202", "pages": [{"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: BIT INSTRUCTIONSdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Understand the concepts of bit instructions. w Describe the operation of bit instructions.", "w Demonstrate the usage of bit instructions with Allen Bradely APS software..", "w Demonstrate the usage of bit instructions with Rockwell RSLOGIX software..."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P310", "text": [], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P350", "text": [], "jumps": []}, {"id": "P400", "text": ["By now you know the basic fundamentals of how a programmable logic controller works. You have also been introduced to different aspects of programming a PLC."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["In this lesson, you will begin to learn the fundamentals of programming a PLC. This lesson and the lessons to follow will fully describe the function, purpose, and usage of the PLC instruction set..."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["PLCs use a variety of different instructions to perform a multitude of tasks. Bit instructions are one type of instruction used by a PLC."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["In this lesson, we will look at the details of bit instructions. By understanding bit instructions, you will find it easier to understand other more advanced instructions."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["Let's begin the lesson on BIT INSTRUCTIONS................................"], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1040", "text": ["Bit instructions are commonly used instructions in PLC programming. As their name indicates, they are used to perform operations dealing with a single bit of data.", "Description Mnemonic Symbol Examine if closed Examine if open Output energize Output latch Output unlatch One-shot raising R R R R R", "XIC XIO OTE OTL OTU OSRSRU OSROTU OSR OSR OSROSRhot raising OSRising OSRising OSRaising OSRising OSR"], "jumps": ["P1050", "P1001", "P1055"]}, {"id": "P1050", "text": ["Listed in the table below are six different bit instructions that we will examine. When entering an instruction, what you actually type in is the mnemonic..............................."], "jumps": ["P1060", "P1040", "P1055"]}, {"id": "P1052", "text": ["Listed in the table below are six different bit instructions that we will examine. When entering an instruction, what you actually type in is the mnemonic..s what is actually typed in.", "Description Mnemonic Symbol Examine if closed Examine if open Output energize Output latch Output unlatch One-shot raising R R R R R", "XIC XIO OTE OTL OTU OSRSRU OSROTU OSR OSR OSROSRhot raising OSRising OSRising OSRaising OSRising OSR"], "jumps": ["P1060", "P1040", "P1055"]}, {"id": "P1055", "text": ["Mnemonics are a way of making programming easier. A mnemonic is an abbreviation that suggests the operation to be performed. For example: XIC is the mnemonic for eXamine If Closed.", "Description Mnemonic Symbol Examine if closed Examine if open Output energize Output latch Output unlatch One-shot raising R R R R R", "XIC XIO OTE OTL OTU OSRSRU OSROTU OSR OSR OSROSRhot raising OSRising OSRising OSRaising OSRising OSR"], "jumps": ["P1052"]}, {"id": "P1060", "text": ["Before looking at the actual bit instructions, let's review the operation of a ladder logic program. Below is an example of a ladder logic program."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["The PLC begins at the top most rung and reads from left to right. Each rung may contain one or more test instructions and one or more operations. Test instructions are used to make decisions based on different conditions in the system...."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["Depending on the way the test instructions are used, rungs can require all conditions to be met before an operation is performed, or at least one of many conditions. The example below illustrates these types of configurations..."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["If the conditions are all met for that particular rung, one or more operation instructions can be evaluated. An operation could be used to turn off a motor, turn on a light, etc."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["If the conditions are not met, the PLC processor continues to the next rung, ignoring the previous rung's operations. Once the processor has reached the end of the last rung, it begins again at the top..."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["Bit instructions are used for testing conditions and for performing operations. We will look at both cases while learning all of the bit instructions.", "Description Mnemonic Symbol Examine if closed Examine if open Output energize Output latch Output unlatch One-shot raising R R R R R", "XIC XIO OTE OTL OTU OSRSRU OSROTU OSR OSR OSROSRhot raising OSRising OSRising OSRaising OSRising OSR"], "jumps": ["P1120", "P1080"]}, {"id": "P1120", "text": ["The instruction shown below is the eXamine If Closed (XIC) instruction. This instruction returns either true or false depending on the bit it is analyzing."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["The bit to look at must be specified to the instruction. Normally, the bit is specified by an IO module, the word in that module, and then the bit of that word. Below is an example of this type of specification..."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["When the processor evaluates this instruction, it looks at the specified bit. If the bit being examined is high (referred to as the closed state), the XIC instruction returns true. If the bit is low, or opened, the XIC instruction returns false..."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["The next instruction we are going to look at is the eXamine If Open (XIO) instruction. This instruction is very similar to the XIC instruction."], "jumps": ["P1160", "P1120"]}, {"id": "P1160", "text": ["Like the XIC instruction, the XIO instruction requires a specified bit, but the instruction operation is opposite. The XIO instruction returns a false for a high (closed) condition and a true for a low (open) condition..."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["These instructions are referred to as complements of one another. In other words, they provide exactly the opposite return values for the same input data."], "jumps": ["P1180", "P1150"]}, {"id": "P1180", "text": ["The instruction shown below is the OuTput Energize (OTE) instruction. This instruction is used to set high (close) an output bit. This bit corresponds to an output connection of an output device..."], "jumps": ["P1190", "P1150"]}, {"id": "P1190", "text": ["The OTE command is dependent on the result of test instructions with the same rung. If the rung test instructions return true, the output bit is set high. If the test instructions return false, the output is not modified..."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["Bit I:0/0 & I:0/1 are set High Bit I:0/2 & I:0/3 are set Low", "Below are two examples of using the OuTput Energize instruction. Notice that the test conditions are only true if you can draw a line from the beginning of the rung to the operation instruction....."], "jumps": ["P1210", "P1180"]}, {"id": "P1210", "text": ["The line continues until a false condition is found. If there is a false condition, another path on the rung needs to be examined if possible. Once all paths have been tested and no path to the operation can be drawn, the condition is considered false..."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["The next instruction we are going to look at is the OuTput Latch (OTL) instruction. This instruction is used to set a bit high. However, this instruction cannot set a bit low."], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["The OTL instruction is also considered an operation instruction. The operation of this instruction is dependent on the condition of rung logic before this instruction is analyzed."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["If a true is returned by the test instructions, then the particular bit pointed to by the OTL instruction is set high, unless it is already high. If the test instructions return false, the bit remains unchanged..."], "jumps": ["P1250", "P1220"]}, {"id": "P1250", "text": ["This instruction is normally used to set output bits; however, it can also be used to set any bit data to one. This is very useful when you are initializing data and need to set a particular bit to one..."], "jumps": ["P1260", "P1220"]}, {"id": "P1260", "text": ["The complement to the OTL instruction is the OuTput Unlatch (OTU) instruction. This instruction is used to set a particular bit to low."], "jumps": ["P1270", "P1220"]}, {"id": "P1270", "text": ["Just as with the OTL instruction, the OTU instruction requires the test logic to be true before it will unlatch the bit specified to the instruction. If the test logic returns false, the bit remains unchanged..."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["This instruction can also be used when initializing data to set particular bits to zero. It is important to note that the OTL and OTU instructions are normally used together to provide complete control over an output bit..."], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["The last instruction we are going to look at is the One-Shot Rising (OSR) instruction. This instruction is much different than the ones you have learned about so far.", "bit location to store previous conditionn"], "jumps": ["P1300", "P1260"]}, {"id": "P1300", "text": ["This instruction waits until the preceding test instructions go from low to high. A low to high transition is known as a rise. For this reason, this instruction requires memory to perform its function...", "Time Condition Status Statusssus"], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["The OSR function requires 1 bit of storage. This bit should not be used for anything else. If you used this bit for other data storage in your programs, errors could occur from incorrect values being stored in the bit..."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["Initially, the bit is set to zero. When a false to true ( ) transition occurs on the preceding test instructions, the OSR bit goes high and the operations after the OSR bit are performed.."], "jumps": ["P1330", "P1300"]}, {"id": "P1330", "text": ["When the processor cycles through the ladder logic program and back to this instruction, the bit is reset to zero. The OSR instruction now waits for another low to high transition before allowing the operation after it in the rung..."], "jumps": ["P1340", "P1300"]}, {"id": "P1340", "text": ["It is important to note that this instruction only allows the operations to occur once per transition. This is referred to as the \"one-shot\"."], "jumps": ["P1350", "P1300"]}, {"id": "P1350", "text": ["In this lesson, we have examined the bit instructions common to most PLC systems. In some cases, the mnemonics and names may be different, but the operation will be the same.", "Description Mnemonic Symbol Examine if closed Examine if open Output energize Output latch Output unlatch One-shot raising R R R R R", "XIC XIO OTE OTL OTU OSRSRU OSROTU OSR OSR OSROSRhot raising OSRising OSRising OSRaising OSRising OSR"], "jumps": ["P1360", "P1300"]}, {"id": "P1360", "text": ["Bit instructions are very important when you are analyzing inputs and setting outputs. In the experiment, you will enter a program into the PLC trainer which will demonstrate some of the bit instructions that you have learned..."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["Always remember to refer to the PLC manufacturer's documentation for further details, limitations, and requirements for different instructions."], "jumps": ["P1380", "P1350"]}, {"id": "P1380", "text": ["The symbol below represents what type of bit instruction?.."], "jumps": ["P1350"]}, {"id": "P1381", "text": [], "jumps": []}, {"id": "P1382", "text": ["The One-Shot Rising symbol is shown below.................."], "jumps": []}, {"id": "P1383", "text": ["The OuTput Latch symbol is shown below....................."], "jumps": []}, {"id": "P1390", "text": ["The One-Shot Rising instruction works on what type of transition?"], "jumps": ["P1380"]}, {"id": "P1391", "text": [], "jumps": []}, {"id": "P1392", "text": ["Remember, the One-Shot Rising instruction only allows operations after it in the rung to be evaluated on a low to high transition and for one program cycle."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on BIT INSTRUCTIONS........."], "jumps": ["P1001", "P1390"]}, {"id": "P1920", "text": ["1. The eXamine If Closed (XIC) instruction returns true if the bit being tested is high, and false if the bit being tested is low."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. The eXamine If Open (XIO) instruction returns false if the bit being tested is low, and true if the bit being testing is high."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. The OuTput Energize (OTE) instruction sets a bit high if the preceding logic is high and sets the bit low if the preceding logic is low."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. The OuTput Latch (OTL) instruction is used to set a bit high if the preceding logic is true. This instruction cannot set a bit to low."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. The OuTput Unlatch (OTU) instruction is used to set a bit low if the preceding logic is true. This instruction cannot set a bit high."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6. The One-Shot Rising (OSR) instruction is used to evaluate operations after the OSR instruction in the rung for one cycle when a particular bit makes a low to high transition.", "bit location to store previous conditionn"], "jumps": ["P1999", "P1960"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1970"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2040", "text": ["In this experiment, we are going to program the PLC Trainer to use some of the bit instructions that you have learned earlier in this lesson.", "Description Mnemonic Symbol Examine if closed Examine if open Output energize Output latch Output unlatch One-shot raising R R R R R", "XIC XIO OTE OTL OTU OSRSRU OSROTU OSR OSR OSROSRhot raising OSRising OSRising OSRaising OSRising OSR"], "jumps": ["P2050", "P2001"]}, {"id": "P2050", "text": ["Before we can actually program the PLC, we need to make sure that the software, settings, and interface are set up correctly. This experiment requires two computers and the PLC 5050 Trainer..."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["1. Connect the 5050 interface cable between the Nida Model 5050 PLC Trainer and the computer which has the APS software."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["2. Start the APS software by performing the following commands at the DOS prompt of the computer which has the APS software and is attached to the PLC Trainer. a. Type `CD \\IPDS\\ATTACH\\SLC500' and press enter. b. Type `APS' and press enter......"], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["If the software did not start, see your instructor for assistance. These instructions are for default installation of the APS software and may differ from your installation."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["The APS main screen should be displayed on the monitor. As you may recall, there are three different types of main files associated with the PLC: the processor, program, and data files."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["All of the files for a particular project are contained within one working file that you will use. This file contains the configuration of the system and all ladder logic that you create."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["Before we can create any program or data files, we must have our processor set up correctly. This ensures the configuration of your PLC unit and its optional components."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["Let's start by creating a processor file to ensure that the settings of the PLC are correct..."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["3. From the main menu, select F4 [OFFLINE CONFIG] and then F6 [CREATE FILE]. Enter a file name and press enter. You must choose a filename that does not already exist and is less than ten characters in length. Do not forget your file name....."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["Now that we have entered a filename, we will need to select the PLC type and the different IO modules that we may have attached to the system. In the case of the Nida PLC trainer, there are two extra modules: a TTL module and an analog module..."], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["4. Using the up and down arrow keys, adjust the PROCESSOR box until `1747-L20C/F 12-DC SNK 8-RLY' is highlighted by the cursor bar. Press F2 [SELECT PROC] to select this processor..."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["5. Now we will select the IO modules attached to the PLC. Press F5 [CONFIGR I/O].."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["At the top of the screen, there are three rack specifications labeled `NOT INSTALLED'. A rack is used to attach different modules to the PLC processor. Let's specify the two modules."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["6. Press F4 [MODIFY RACKS] and then F1 [RACK 1]. Rack 1 is the backplane that the other two modules will attach to. Use the cursor bar to select `1746-A2 2-slot Backplane' and then press enter..."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["7. Use the arrow keys to highlight `*1' (Slot 1) with the cursor bar and press F5 [MODIFY SLOT]. Using the arrow keys again, highlight `1746-IG16 16-Input [TTL](Sink) 5 VDC' and press F2 [SELECT MODULE]......"], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["8. Use the arrow keys to highlight `*2' (Slot 2) with the cursor bar and press F5 [MODIFY SLOT]. Using the arrow keys again, highlight `1746-NIO4V Analog Comb. 2 In & 2 Voltage Out' and press F2 [SELECT MODULE]......"], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["9. Select F8 [EXIT], and F8 [SAVE & EXIT], and then F8 [ACCEPT]."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["The processor section of your file is complete. You are now at the main menu and should see your file listed after `Current Offline File:' in the center of the screen."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["We are offline because we do not need to communicate with the PLC trainer yet. First, we need to write our ladder logic. Once we have created our ladder logic, we can send it to the PLC and test it..."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["The program that we are going to enter is shown below. Let's first look at what this program can do before we enter it into the APS software."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["In rung 1, the eXamine If Closed instruction will look at bit 0 of input port 0 and return true or false based on its setting. Bit 0 of input port 0 represents one of the inputs of this particular PLC."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["Input 0 is connected to the START switch on the 5050-1 process control board. When this switch is pressed, the bit will be set to one. When the switch is released, it will be set to zero."], "jumps": ["P2270", "P2240"]}, {"id": "P2270", "text": ["If XIC returns true, both the operations after it will be performed. The first operation (OuTput Latch) will set output port module 0, bit 0, to high. LED 0 is connected to the output latch and will illuminate in response to the high. The LED will remain on until something else turns it off..."], "jumps": ["P2280", "P2240"]}, {"id": "P2280", "text": ["The second operation is the OuTput Energize instruction, OTE. This instruction will turn on LED 1 through output port module 0, bit 1, until XIC returns false. Then, output port module 0, bit 0, will be set to low again..."], "jumps": ["P2290", "P2240"]}, {"id": "P2290", "text": ["In other words, this bit stays high while the START button is pressed, which means LED 1 will stay on. LED 0 is off and will remain off when the START button is pressed and after it's released..."], "jumps": ["P2300", "P2240"]}, {"id": "P2300", "text": ["The second rung is very similar to the first one. The XIC instruction monitors input module 0, bit 1, which represents the STOP button on the 5050-1 card. When this switch is pressed in, output module 0, bit 0, which corresponds to LED 0, will be unlatched. This will turn LED 0 off..."], "jumps": ["P2310", "P2240"]}, {"id": "P2310", "text": ["Also, while the STOP button is pressed, output module 0, bit 2, which corresponds to LED 2, will stay high. Once the button is released, output module 0, bit 2, will go low which turns off LED 2..."], "jumps": ["P2320", "P2240"]}, {"id": "P2320", "text": ["The third and fourth rungs both utilize the eXamine If Open instructions. These two rungs turn on and off LED 3 and 4 based on the position of the START and STOP buttons. They are used to show the complementary action of the instructions XIC and XIO..."], "jumps": ["P2330", "P2240"]}, {"id": "P2330", "text": ["Whenever the START button is not being pressed, LED 3 will be on. When the START button is pressed, LED 3 will turn off. The same condition is true for rung 4, the STOP button, and LED 4."], "jumps": ["P2340", "P2240"]}, {"id": "P2340", "text": ["Now that we have looked at the operation of the ladder logic program, let's enter the program. In this lesson, a step-by-step approach will be provided for entering programs into the APS software..."], "jumps": ["P2350", "P2240"]}, {"id": "P2350", "text": ["In future lessons, this intensity of help will not be provided. The instructions you are about to follow can be used for entering any program. Be sure to follow the directions accurately.."], "jumps": ["P2360", "P2240"]}, {"id": "P2360", "text": ["10. Press F3 [OFFLINE PRG/DOC] and then F1 [PROCSSR FUNCTNS]. We are going to change the name of our ladder logic file to be more descriptive of what it does."], "jumps": ["P2370", "P2240"]}, {"id": "P2370", "text": ["11. Using the cursor bar, select File 2 and press F4 [CHANGE FL. NAME]. Enter `BIT_TEST' and press return. The name should appear in the Name column for File 2."], "jumps": ["P2380", "P2360"]}, {"id": "P2380", "text": ["12. We are now ready to edit the ladder program file. Using the arrow keys, highlight File 2 and press F8 [MONITOR FILE]."], "jumps": ["P2390", "P2370"]}, {"id": "P2390", "text": ["On the screen, you will see the end rung. (No other rungs exist in the ladder program yet. ) At the bottom of the screen, File 2, Rung 0 will always tell you which program file you are in and the number of the currently highlighted rung..."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["13. To begin editing, press F10 [EDIT]. We need to insert a rung before the end rung. To do this, press F4 [INSERT RUNG]. Now the inserted rung is the active rung. When you are using the insert command, the new rung will be inserted before the highlighted rung.."], "jumps": ["P2410", "P2390"]}, {"id": "P2410", "text": ["14. Press F4 [INSERT INSTR], F1 [BIT], F1 [XIC ] [ ], enter `I:0/0', and press enter. The first bit instruction should be displayed on the new rung."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["As with the insert rung command, the insert instruction also puts the instruction before the selected instruction or location. When you insert an instruction, it allows you to keep entering instructions until you press the ESC key..."], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["If you want to put an instruction after a highlighted instruction, use the append command. Since the end of the rung is blinking and we are in insert instruction mode, we know the next instruction will be entered just before the end.........."], "jumps": ["P2440", "P2410"]}, {"id": "P2440", "text": ["15. Press F1 [BIT], F4 [OTL (L) ], enter `O:0/0', and press enter. The first operation instruction should be displayed on the rung."], "jumps": ["P2450", "P2410"]}, {"id": "P2450", "text": ["16. Now we need to enter a branch. In this case, a branch will allow multiple operations for a single test condition. Press ESC. Use the left and right arrow keys to select (L) . You will know when it is selected because it will blink...."], "jumps": ["P2460", "P2410"]}, {"id": "P2460", "text": ["17. Press F1 [BRANCH] and F4 [INSERT BRANCH]. You will notice blinking letters have been added to the rung. You are about to specify where the branch's other end will connect. In this case, press F3 [TARGET C]..."], "jumps": ["P2470", "P2410"]}, {"id": "P2470", "text": ["18. Now with the branch highlighted, press F4 [INSERT INSTR], F1 [BIT], F3 [OTE ( ) ], type `O:0/1', and press enter. This enters the remaining instructions for the rung."], "jumps": ["P2480", "P2410"]}, {"id": "P2480", "text": ["It is important to note that both ends of the rung have broken lines. This indicates that the rung has not been accepted yet into the program. We need to accept the rung."], "jumps": ["P2490", "P2410"]}, {"id": "P2490", "text": ["19. Press ESC and the F10 [ACCEPT RUNG]. You have now successfully entered one rung of the program."], "jumps": ["P2500", "P2410"]}, {"id": "P2500", "text": ["Now that you have seen how to enter a rung, try to create the next rung on your own. The rung is shown below with the IO addresses you need to enter. The help button will show you a quick reference for entering this rung if you have problems....."], "jumps": ["P2510", "P2410"]}, {"id": "P2510", "text": ["20. Enter the rung shown below into the APS software......"], "jumps": ["P2520", "P2500", "P2515"]}, {"id": "P2515", "text": ["1. Use cursor and select END rung, select INSERT RUNG, and then INSERT INSTR. 2. Select BIT, XIC and enter I:0/1, select BIT again, OTU and enter O:0/0."], "jumps": ["P2516", "P2510"]}, {"id": "P2516", "text": ["3. Use cursor and select ` (U) ' just made, press ESC, BRANCH, INSERT BRANCH and then TARGET C. 4. Select INSERT INSTR, BIT, OTE and enter O:0/3. 5. Press ESC, ACCEPT RUNG....EPT RUNG."], "jumps": ["P2510", "P2515"]}, {"id": "P2520", "text": ["21. Enter these two rungs into the APS software..........."], "jumps": ["P2530", "P2510", "P2525"]}, {"id": "P2525", "text": ["1. Use cursor and select END rung, select INSERT RUNG and then INSERT INSTR. 2. Select BIT, XIO and enter I:0/0, select BIT again, OTE and enter O:0/2."], "jumps": ["P2526", "P2520"]}, {"id": "P2526", "text": ["3. Press ESC, ACCEPT RUNG 4. Use cursor and select END rung, select INSERT RUNG and then INSERT INSTR. 5. Select BIT, XIO and enter I:0/1, select BIT again, OTE and enter O:0/4. 6. Press ESC, ACCEPT RUNG."], "jumps": ["P2520", "P2525"]}, {"id": "P2530", "text": ["We have finished entering the program and now need to load it into the PLC for testing. Ensure the last rung of the program has been accepted."], "jumps": ["P2540", "P2520"]}, {"id": "P2540", "text": ["23. Place the PC5050-1 card in the PC1 position..........."], "jumps": ["P2550", "P2530", "P2545"]}, {"id": "P2545", "text": ["Align the connectors on the PC5050-1 card with the pins for the PC1 position on the Nida Model 5050 PLC trainer. Gently push down on the PC5050-1 card."], "jumps": []}, {"id": "P2550", "text": ["22. Set the PLC Trainer to the initial control settings...", "Main Power ON DC Power ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF"], "jumps": ["P2540"]}, {"id": "P2555", "text": ["INITIAL CONTROL SETTING - Main Power ON, DC Power ON, Monitor ON, Process Selector OFF, +DC Voltage Select 5V, PC1 & PC2 Power OFF."], "jumps": []}, {"id": "P2560", "text": ["24. Set the PLC Trainer controls as follows: C Voltage Select 24V PC1 Power ON", "+DC Voltage Select 24 V PC1 Power ONN"], "jumps": ["P2550", "P2565"]}, {"id": "P2565", "text": ["Turn the +DC Voltage Select dial fully CW to the 24V position. Push the PC1 Power switch up to the ON position."], "jumps": []}, {"id": "P2600", "text": ["The trainer has been turned on and set up for us to send our program to the trainer. Let's send our program to the trainer."], "jumps": ["P2610", "P2560"]}, {"id": "P2610", "text": ["25. Press F1 [SAVE/GO ONLINE]. If the file exists, you will be asked if you would like to overwrite. Press F8 [YES]. If the processor is not in program mode, the APS software will ask you if it can switch to that mode. Press F8 [YES]..."], "jumps": ["P2620", "P2600"]}, {"id": "P2620", "text": ["26. Once the program has been sent, the APS software will ask you if you would like to switch to run mode. Again, press F8 [YES]."], "jumps": ["P2630", "P2610"]}, {"id": "P2630", "text": ["The program you have entered is now running. Try out the START and STOP buttons on the Process Control board. START should change LED 1 and 2 when pressed. STOP should change 3 and 4 when pressed. START and STOP together control LED 0..."], "jumps": ["P2640", "P2620"]}, {"id": "P2640", "text": ["Also, look at the screen of the APS software. It displays the ladder logic while the program is running. This is a great feature when troubleshooting is required. is required."], "jumps": ["P2650", "P2630"]}, {"id": "P2650", "text": ["This completes the demonstration on the bit instructions. Feel free to create your own ladder logic and enter it into the APS software. It is easier to write your program on paper first and then enter it into the software....."], "jumps": ["P2660", "P2640"]}, {"id": "P2660", "text": ["If you want to edit your program, select EDIT and edit DISK PROGRAM. Then follow the same steps to send the program to the PLC trainer. The inputs and outputs are listed below.", "I :0/0 Start Switch O :0/0 Led 0 O :0/4 Led 4 I :0/1 Stop Switch O :0/1 Led 1 O :0/5 Led 5 I :0/2 Power Switch O :0/2 Led 2 O :0/6 Led 6 O :0/3 Led 3 O :0/7 Led 74"], "jumps": ["P2670", "P2650"]}, {"id": "P2670", "text": ["27. Press F3 [EXIT] or ESC and then F3, depending on where you left off in the APS software. Now select F3 [RETURN TO MENU] and then F10 [EXIT SYSTEM].."], "jumps": ["P2680", "P2660"]}, {"id": "P2680", "text": ["28. Return the PLC trainer to the initial control settings.", "Main Power ON DC Power ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF"], "jumps": ["P2670"]}, {"id": "P2690", "text": ["29. Turn OFF the PLC trainer's main power switch.........."], "jumps": []}, {"id": "P2700", "text": ["30. Return all PC cards and test equipment to their proper storage location."], "jumps": ["P2910", "P2690"]}, {"id": "P2910", "text": ["This completes the experiment on BIT INSTRUCTIONS.E........"], "jumps": ["P2001", "P2700"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3020", "text": ["In this experiment, you will program the PLC Trainer to use various bit instructions that you have learned earlier in this lesson. These instructions are for default installation of the RSLogix and RSLinx software and may differ from your installation...", "Description Mnemonic Symbol Examine if closed Examine if open Output energize Output latch Output unlatch One-shot raising R R R R R", "XIC XIO OTE OTL OTU OSRSRU OSROTU OSR OSR OSROSRhot raising OSRising OSRising OSRaising OSRising OSR"], "jumps": ["P3030", "P3001"]}, {"id": "P3030", "text": ["Before programming the PLC, we need to make sure that the software and interface are set up and operating properly."], "jumps": ["P3020"]}, {"id": "P3040", "text": ["1. Ensure the 5050 interface cable is connected between the Nida Model 5050 PLC Trainer and the computer that has the RSLinx and RSLogix software installed."], "jumps": ["P3020"]}, {"id": "P3050", "text": ["2. Turn on the 5050 PLC Trainer..........................."], "jumps": ["P3040"]}, {"id": "P3060", "text": ["3. Start the RSLinx communication software by double-clicking on the RSLinx icon. If the software does not start, see your instructor for assistance.."], "jumps": ["P3050"]}, {"id": "P3070", "text": ["4. Now determine if the computer and PLC Trainer are communicating by double-click on the AB_PIC-1 DH-485 icon in the right window..."], "jumps": ["P3060"]}, {"id": "P3080", "text": ["5. Make sure that the SLC 500 icon does not have a red X over it. If a red X is present, make sure the PLC Trainer is turned on and connected. If the PLC is still not active, see your instructor for assistance..."], "jumps": ["P3060"]}, {"id": "P3090", "text": ["6. Click on the minimize button. This is the _ in the upper right- hand corner of the window...."], "jumps": ["P3080"]}, {"id": "P3100", "text": ["7. Start the RSLogix software by double-clicking on the RSLogix icon on the computer that has the RSLogix software and is attached to the PLC Trainer. If the software did not start, see your instructor for assistance.."], "jumps": ["P3090"]}, {"id": "P3110", "text": ["8. Click on the maximize button to bring the window to full size. This is the button just to the right of the minimize button."], "jumps": ["P3100"]}, {"id": "P3120", "text": ["The RSLogix window should be displayed on the monitor. As you may recall, there are three different types of main files associated with the PLC: processor, program, and data files."], "jumps": ["P3110"]}, {"id": "P3130", "text": ["All of the files for a particular project are contained within one working folder that you will use. This file contains the configuration of the system and all ladder logic that you create."], "jumps": ["P3120"]}, {"id": "P3140", "text": ["Before creating any program or data files, we must have our processor set up correctly. This ensures the configuration of your PLC unit and its optional components."], "jumps": ["P3150", "P3120"]}, {"id": "P3150", "text": ["Let's begin creating a processor file to ensure that the settings of the PLC are correct."], "jumps": ["P3160", "P3120"]}, {"id": "P3160", "text": ["9. From the standard toolbar, click on the NEW icon. Enter a filename in the processor name text box. You must choose a name that does not already exist and is less than ten characters in length. Do not forget this file name; write it down if necessary.."], "jumps": ["P3170", "P3120"]}, {"id": "P3170", "text": ["10. With the filename entered, select the PLC type and the different I/O modules attached to the system. In the case of the Nida PLC Trainer, there are two extra modules: a TTL module and an analog module."], "jumps": ["P3180", "P3160"]}, {"id": "P3180", "text": ["11. At the bottom of the select processor type window, AB_PIC-1 should be displayed in the driver text box. If not displayed, click on the down-arrow and select AB_PIC-1."], "jumps": ["P3190", "P3170"]}, {"id": "P3190", "text": ["12. Using the listbox scroll bar arrows, scroll until 1747-L20C/F 12-DC SNK In, 8-RLY Out is displayed. Select this PLC processor and then click on OK.."], "jumps": ["P3200", "P3170"]}, {"id": "P3200", "text": ["13. Two windows should appear. The left window is the project window and displays the project files. The right window is the ladder window and displays the selected ladder program. LAD2 should be displayed in the ladder window title bar.."], "jumps": ["P3210", "P3170"]}, {"id": "P3210", "text": ["14. Now select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder)."], "jumps": ["P3220", "P3170"]}, {"id": "P3220", "text": ["15. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747- 20C/F 12-DC SNK In, 8-RLY Out; slot #1 should be highlighted. If slot #1 is not highlighted, click in the slot #1 area."], "jumps": ["P3230", "P3170"]}, {"id": "P3230", "text": ["16. In the right window scroll down and double-click on the 1746- IG16 16 Input (TTL-SOURCE) 5VDC module name. This transfers the module information to the left window for the #1 slot of the PLC....................."], "jumps": ["P3240", "P3170"]}, {"id": "P3240", "text": ["17. Perform the same steps on the 1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out module name. Ensure the module information transfers to the left window for the #2 slot of the PLC..."], "jumps": ["P3250", "P3170"]}, {"id": "P3250", "text": ["18. Save the configuration settings by clicking on the I/O configuration close button. This button is the X in top right- hand corner of the I/O configuration window..."], "jumps": ["P3260", "P3170"]}, {"id": "P3260", "text": ["The processor section of your file is complete. You are now at the Main window and should see the end ladder in the ladder window."], "jumps": ["P3270", "P3170"]}, {"id": "P3270", "text": ["We are offline because we do not need to communicate with the PLC trainer yet. First, we must write the ladder logic before we can send it to the PLC and test it."], "jumps": ["P3280", "P3260"]}, {"id": "P3280", "text": ["Before entering the program shown below, let's examine the program's function."], "jumps": ["P3290", "P3260"]}, {"id": "P3290", "text": ["In rung 1, the eXamine If Closed (XIC) instruction looks at input port 0, bit 0, and returns true or false based on its setting. Bit 0 of input port 0 represents one of the inputs of this particular PLC."], "jumps": ["P3300", "P3280"]}, {"id": "P3300", "text": ["Input 0 is connected to the start switch on the 5050-1 process control board. When this switch is pressed, input port 0, bit 0, will be set to one. When the switch is released, it will be set to zero..."], "jumps": ["P3310", "P3280"]}, {"id": "P3310", "text": ["If XIC returns true, both the operations after it will be performed. The OuTput Latch (OTL) operation will set output port module 0, bit 0, to high. LED 0 is connected to the output latch and will illuminate in response to the high. The LED will remain on until some other command turns it off."], "jumps": ["P3320", "P3280"]}, {"id": "P3320", "text": ["The second operation is the OuTput Energize (OTE) instruction. This instruction will turn on LED 1 through output port module 0, bit 1, until XIC returns false. Then, output port module 0, bit 0, will be set to low again.."], "jumps": ["P3330", "P3280"]}, {"id": "P3330", "text": ["In other words, this bit stays high while the START button is pressed, which means LED 1 will stay on. LED 0 is off and remains off when the start button is pressed and after it is released.."], "jumps": ["P3340", "P3280"]}, {"id": "P3340", "text": ["The second rung is very similar to the first one. The XIC instruction monitors input module 0, bit 1, which represents the STOP button on the 5050-1 card. When this switch is pressed, output module 0, bit 0, which corresponds to LED 0, will be unlatched. This turns LED 0 off."], "jumps": ["P3350", "P3280"]}, {"id": "P3350", "text": ["Also, while the STOP button is pressed, output module 0, bit 2, which corresponds to LED 2, will stay high. Once the button is released, output module 0, bit 2, will go low which turns off LED 2."], "jumps": ["P3360", "P3340"]}, {"id": "P3360", "text": ["The third and forth rungs both utilize the eXamine If Open (XIO) instructions. These two rungs turn on and off LED 3 and 4 based on the position of the START and STOP buttons. They are used to show the complementary action of the instructions XIC and XIO."], "jumps": ["P3370", "P3340"]}, {"id": "P3370", "text": ["Whenever the START button is not being pressed, LED 3 will be on. When the START button is pressed, LED 3 will turn off. The same condition is true for rung 4, the STOP button, and LED 4."], "jumps": ["P3380", "P3360"]}, {"id": "P3380", "text": ["Now that we have looked at the operation of the ladder logic program, let's enter the program. In this lesson, a step-by-step approach will be provided for entering programs into the RSLogix software.."], "jumps": ["P3390", "P3360"]}, {"id": "P3390", "text": ["In future lessons, this level of help will not be provided. The instructions you are about to follow are used for entering the programs. Be sure to follow the directions accurately."], "jumps": ["P3400", "P3380"]}, {"id": "P3400", "text": ["19. We are going to change the name of our ladder logic file to be more descriptive of what it does. In the left window, right- click on the LAD2 icon, then select properties from the drop- down menu...."], "jumps": ["P3410", "P3390"]}, {"id": "P3410", "text": ["20. The program file properties dialogue box is displayed. In the name text box type BIT_TEST and then click on OK. The right window title bar should now display LAD 2 - BIT_TEST.."], "jumps": ["P3420", "P3390"]}, {"id": "P3420", "text": ["21. We are now ready to edit the ladder program file. Click on the ladder window title bar to select it as the active window."], "jumps": ["P3430", "P3390"]}, {"id": "P3430", "text": ["The ladder window (right window) displays the ladder. You will see only the end rung, since no other rungs exist in the ladder yet. The ladder window title bar tells you which ladder file is active and a highlighted box around the rung number shows which rung is active."], "jumps": ["P3440", "P3390"]}, {"id": "P3440", "text": ["22. We need to add a new rung above the end rung. To do this, click on the new rung icon above the ladder window. Now the inserted rung is the active rung. When you are inserting a new rung, it will be inserted below the active rung (except the end rung)."], "jumps": ["P3450", "P3430"]}, {"id": "P3450", "text": ["23. Click on the insert XIC icon, type I:0/0 and press <ENTER>. Notice that a text box appears above the XIC instruction when you start typing."], "jumps": ["P3460", "P3440"]}, {"id": "P3460", "text": ["The first bit instruction should be displayed on the new rung."], "jumps": ["P3470", "P3440"]}, {"id": "P3470", "text": ["New instructions are placed to the right of the highlighted instructions on the rung. A highlighted instruction is enclosed in a box."], "jumps": ["P3480", "P3460"]}, {"id": "P3480", "text": ["24. Click on the insert OTL (output latch) icon, type O:0/0 and press <ENTER>. The first output instruction should be displayed on the rung."], "jumps": ["P3490", "P3470"]}, {"id": "P3490", "text": ["25. Now we need to enter a branch. In this case, a branch will allow multiple operations for a single test condition. Since the branch starts after the first instruction, the first instruction needs to be highlighted. Click on the first (XIO) instruction to highlight it.."], "jumps": ["P3492", "P3480"]}, {"id": "P3492", "text": ["26. Double-click on insert new rung icon...ase, a branch will allow multiple operations for a single test condition. Since the branch starts after the first instruction, the first instruction needs to be highlighted. Click on the first (XIO) instruction to highlight it.."], "jumps": ["P3500", "P3490"]}, {"id": "P3500", "text": ["27. The right side of the branch is highlighted. Press and hold the left mouse button and drag the right side of the branch to the right side of the OTL instruction. When the box on the right turns green, release the mouse button."], "jumps": ["P3510", "P3490"]}, {"id": "P3510", "text": ["Before an instruction can be entered onto this new branch, the bottom left corner of the branch needs to be highlighted. Click on the bottom left corner of the branch."], "jumps": ["P3520", "P3490"]}, {"id": "P3520", "text": ["28. Now insert an OTE (output energize) instruction into the branch we just entered. Click on the insert OTE icon, type O:0/1 and press <ENTER> to enter the last instruction for the rung..."], "jumps": ["P3530", "P3490"]}, {"id": "P3530", "text": ["It is important to note that there are e's on the left side of the rung. This indicates that the rung has not been accepted. We need to accept the rung."], "jumps": ["P3540", "P3520"]}, {"id": "P3540", "text": ["29. Click on the verify project icon at the top of the window. The verify project icon looks like a computer with a checkmark over it. After the file has been verified and no errors are found rung, the e's on the left of the rung will disappear. rung will disappear.ear."], "jumps": ["P3550", "P3530"]}, {"id": "P3550", "text": ["Now that you know how to enter a rung, try to create the next rung on your own. The rung is shown below with the I/O addresses you need to enter. The help button will show you a quick reference for entering this rung if you have problems."], "jumps": ["P3560", "P3540"]}, {"id": "P3560", "text": ["30. Enter the rung shown below into the RSLogix software."], "jumps": ["P3570", "P3550", "P3565"]}, {"id": "P3562", "text": ["31. Enter the rung shown below into the RSLogix software..ung on your own. The rung is shown below with the I/O addresses you need to enter. The help button will show you a quick reference for entering this rung if you have problems."], "jumps": ["P3570", "P3550", "P3565"]}, {"id": "P3565", "text": ["RUNG 1ght the number to the left of the end rung. 2. Click on the insert rung icon. The new rung number should be highlighted. 3. Click on the bit tab, click on the XIC icon and type I:0/1, then press<ENTER>. 4. Click on the OTU icon and type O:0/0, then press <ENTER>...", "1. Highlight the number to the left of the end rung. 2. Click on the insert rung icon. The new rung number should be highlighted. 3. Click on the bit tab, click on the XIC icon and type I:0/1, then press <ENTER>. 4. Click on the OTU icon and type O:0/0, then press <ENTER>. 5. Click on the XIC instruction previously added. This allows you add a branch after this instruction. 6. Click on the user tab, then click on the branch icon. Drag the right side of the branch to the right side of the OUT instruction. 7. Click on the bottom-left corner of the branch to add next instruction to branch. 8. Click on the bit tab, click on the OTE icon and type O:0/3, then press <ENTER>. 9. Click on the verify icon to verify and accept the rung. and accept the rung. he first OTL instruction. On this rung click on the XIC instruction to select it. Click on the user tab, and then click on the rung branch icon. Grab the right side of the new branch and drag it to the right side of the first OTL instruction."], "jumps": []}, {"id": "P3570", "text": ["32. Enter these two rungs into the RSLogix software... let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
