 "jumps": []}, {"id": "P332", "text": [], "jumps": []}, {"id": "P334", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson you will learn about troubleshooting multivibrators. You will troubleshoot a faulted astable, monostable and bistable multivibrator."], "jumps": ["P410", "P301"]}, {"id": "P11050", "text": ["Compare the card with the schematic shown."], "jumps": ["P11060", "P11040"]}, {"id": "P420", "text": ["Monostable multivibrators produce long output pulses for very short input trigger pulses."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Bistable multivibrators change output states when a very short input trigger is received."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["An incorrect waveform indicates that the circuit is faulted."], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["Let's begin the lesson on MULTIVIBRATOR TROUBLESHOOTING EXPERIMENT I........"], "jumps": ["P440"]}, {"id": "P10219", "text": ["The indications that determine faulty operation in this transistor are ________? X XXXX", "zero ohms for both lead polarities.. point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "low resistance/current flow for both lead polarities..", "high resistance/no current flow for both lead polarities. the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "any of the above..is d, and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor.", "Page id 1323 of Book \"C:\\Dev2000\\Lessons\\93953605.tbk\""], "jumps": []}, {"id": "P2180", "text": ["Since Vcc is correct, the next troubleshooting step is to check      the transistors with an ohmmeter or diode junction tester.\n3.  Turn the PC1 DC Power switch to OFF.", "Since Vcc is correct, the next troubleshooting step is to check the transistors with an ohmmeter or diode junction tester. 3. Turn the PC1 DC Power switch to OFF."], "jumps": ["P2170"]}, {"id": "P2192", "text": ["Check the  junction of Q2 again. If using an analog meter, try a different range.  The junction should test good.", "Check the junction of Q2 again. If using an analog meter, try a different range. The junction should test good........................ne way and low resistance the other."], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Although the three types of multivibrators function slightly different, the troubleshooting procedures are very similar."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Let's look at an astable multivibrator and develop some simple troubleshooting steps."], "jumps": ["P1020", "P1040"]}, {"id": "P1040", "text": ["When Vcc is applied to a normal operating astable multivibrator, two out of phase square waves should be present at points D and E."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["Usually, an interruption anywhere in the multivibrator results in either no output at point E and Vcc at point D or vice versa."], "jumps": ["P1060", "P1030"]}, {"id": "P1060", "text": ["Since many different faults could cause the same symptoms, a basic troubleshooting method is needed."], "jumps": ["P1070", "P1030"]}, {"id": "P1070", "text": ["Once you have measured the circuit outputs and determined that they are incorrect, measure Vcc at point A to ensure that the supply voltage is correct."], "jumps": ["P1080", "P1030"]}, {"id": "P1080", "text": ["If Vcc checks good, the next step is to check the transistors. These components are more likely to fail than any of the others."], "jumps": ["P1090", "P1030"]}, {"id": "P1130", "text": ["And high resistance or no current flow the other way. The actual lead polarity is not important..."], "jumps": ["P1135", "P1090"]}, {"id": "P1160", "text": ["hich may cause confusing readings. An analog ohmmeter cs", "Using a digital meter is recommended to prevent the forward biasing of any semiconductor components, which may cause confusing readings. An analog ohmmeter can be used if you remember to reverse the test leads should an erroneous reading is obtained when making resistance measurements."], "jumps": ["P1170", "P1140"]}, {"id": "P1200", "text": ["Both lead polarities of this transistor measure infinite base-to-collector resistance, what can you conclude?", "The transistor is functioning correctly."], "jumps": ["P1140"]}, {"id": "P13090", "text": ["the full CWmid position (arrow to right).", "2. Carefully plug PC130-46 into the Test Console PC1 position. 3. Rotate R23 to the full CW position (max)........................"], "jumps": ["P13100", "P13080", "P13095"]}, {"id": "P1140", "text": ["If the transistors check good, the next step is to check the resistance from the Vcc input to the collector and base of each transistor."], "jumps": ["P1090", "P1150"]}, {"id": "P1150", "text": ["The resistance from point A to D should indicate the value of R1.  Some circuits may have other parallel resistances, that will alter your reading.", "The resistance from point A to D should indicate the value of R1. Some circuits may have other parallel resistances, that will alter your reading."], "jumps": ["P1160", "P1140"]}, {"id": "P1950", "text": ["4.  Then with power off, check the transistors.  Perform junction\n     tests with an ohmmeter or junction tester.", "4. Then with power off, check the transistors. Perform junction tests with an ohmmeter or junction tester."], "jumps": ["P1960", "P1930"]}, {"id": "P14130", "text": ["1.  Place CH1 oscilloscope probe to TP11.\n2.  Place CH2 oscilloscope probe to TP16. Adjust the\n      oscilloscope controls to obtain the display shown.", "Points A to C should indicate the value of R3 and A to E should indicate the value of R4.", "1. Place CH1 oscilloscope probe to TP11. 2. Place CH2 oscilloscope probe to TP16. Adjust the oscilloscope controls to obtain the display shown..."], "jumps": ["P14140", "P14120"]}, {"id": "P1190", "text": ["Although the exact resistance may vary, the important thing to remember is you should never measure an open or short for any of these measurements."], "jumps": ["P1200", "P1140"]}, {"id": "P1180", "text": ["Both lead polarities of this transistor measure infinite base-to-collector resistance, what can you conclude?", "ate the value of R3 and A to E should indicate the value of R4 bu.", "Points A to C should indicate the value of R3 and A to E should indicate the value of R4 but watch for parallel circuitry.", "The transistor is functioning correctly."], "jumps": ["P1190", "P1140"]}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1202", "text": ["The transistor is not functioning correctly.  The junction should read high resistance one way and low resistance the other way.", "The transistor is not functioning correctly. The junction should read high resistance one way and low resistance the other way."], "jumps": []}, {"id": "P1203", "text": ["The transistor junction is not shorted, a infinite resistance measurement for each lead polarity indicates the junction is open."], "jumps": []}, {"id": "P1210", "text": ["Troubleshooting a monostable multivibrator is not much different than troubleshooting an astable multivibrator."], "jumps": ["P1205", "P1200"]}, {"id": "P1205", "text": ["Monostable multivibrators change extremely short input pulses into long output pulses."], "jumps": ["P1215", "P1210"]}, {"id": "P1215", "text": ["The two outputs are always opposite.  The trigger causes one output to go high for a certain length of time and the other to go low for that same time.", "The two outputs are always opposite. The trigger causes one output to go high for a certain length of time and the other to go low for that same time."], "jumps": ["P1220", "P1210"]}, {"id": "P1220", "text": ["Checking both transistors, Vcc, the input trigger and making resistance measurements will determine the faulted component."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["These same procedures can be used to troubleshoot bistable multivibrators."], "jumps": ["P1235", "P1210"]}, {"id": "P1235", "text": ["A trigger input causes the outputs to change states until the next trigger is applied."], "jumps": ["P1240", "P1230"]}, {"id": "P1240", "text": ["After determining the output is faulted ensure that the trigger pulse is present."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["Use this troubleshooting method as a guide to help you troubleshoot multivibrator circuits.", "Check the following: 1. Output(s)S", "Check the following: 1. Output(s) 2. Input Trigger (if applicable) 3. Vcc 4. Transistors 5. Circuit Resistances"], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["This is not the only method, and you may develop your own techniques as you become a more proficient troubleshooter."], "jumps": ["P1910", "P1250"]}, {"id": "P1910", "text": ["This completes the information on MULTIVIBRATOR FAULTS.", "This completes the information on MULTIVIBRATOR FAULTS....."], "jumps": ["P1001", "P1250"]}, {"id": "P1920", "text": ["1.  Most faults in multivibrator circuits cause one output to always\n     remain high and the other to remain low.", "1. Most faults in multivibrator circuits cause one output to always remain high and the other to remain low.."], "jumps": ["P1001", "P1930"]}, {"id": "P1930", "text": ["2.  In a faulted monostable or bistable multivibrator you should\n     ensure that the input trigger is correct.", "2. In a faulted monostable or bistable multivibrator you should ensure that the input trigger is correct.."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Then check Vcc to ensure that the supply voltage is correct.", "3. Then check Vcc to ensure that the supply voltage is correct."], "jumps": ["P1950", "P1930"]}, {"id": "P11210", "text": ["5.  Using an analog ohmmeter or digital diode junction tester, \n     check across the base-to-collector junction of Q2 (TP7 - TP9).  \n     Reverse the leads and check it again.\n\n     Does the base-to-collector junction of Q2 test OK?", "5. Using an analog ohmmeter or digital diode junction tester, check across the base-to-collector junction of Q2 (TP7 - TP9). Reverse the leads and check it again. Does the base-to-collector junction of Q2 test OK?"], "jumps": ["P11200"]}, {"id": "P1960", "text": ["5.  Then check the feedback circuit with an ohmmeter.", "5. Then check the feedback circuit with an ohmmeter."], "jumps": ["P1999", "P1930"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu..."], "jumps": ["P1001", "P1930"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["The purpose of this experiment is to demonstrate troubleshooting astable multivibrator circuits."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2040", "text": ["Pick up the PC130-44 card.  This card is used to demonstrate typical faults in an astable multivibrator.", "Pick up the PC130-44 card. This card is used to demonstrate typical faults in an astable multivibrator."], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["Compare the card with the schematic shown."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["There is a sync circuit on the card that is not shown on the schematic.  It is not used in the experiment.", "There is a sync circuit on the card that is not shown on the schematic. It is not used in the experiment."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["Placing S1 to the Out (down) position disconnects the sync circuit.  Let's start the experiment.", "Placing S1 to the Out (down) position disconnects the sync circuit. Let's start the experiment."], "jumps": ["P2040"]}, {"id": "P2080", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2070"]}, {"id": "P2090", "text": ["2.  Carefully plug PC130-44 into the Test Console PC1 position.\n3.  Place PC130-44 S1 to the Out (down) position.", "2. Carefully plug PC130-44 into the Test Console PC1 position. 3. Place PC130-44 S1 to the Out (down) position.. the PC3 Speaker switch to ON........................................."], "jumps": ["P2080", "P2100", "P2095"]}, {"id": "P2095", "text": ["MEASUREMENT SETUP - Place S1 to OUT (down) position."], "jumps": []}, {"id": "P2100", "text": ["4.  Set Voltmeter switch to Positive. Set the Positive Supply\n      Voltage to 12.  The Test Console's voltage meter should\n      indicate 12 volts.\n5.  Turn PC1 DC Power switch to ON.", "4. Set Voltmeter switch to Positive. Set the Positive Supply Voltage to 12. The Test Console's voltage meter should indicate 12 volts. 5. Turn PC1 DC Power switch to ON.."], "jumps": ["P2090"]}, {"id": "P2110", "text": ["6.  Set R5 and R6 on PC130-44 to mid position (arrows up).  This\n     sets the frequency to an approximate 1.36 kHz symmetrical \n     square wave.", "6. Set R5 and R6 on PC130-44 to mid position (arrows up). This sets the frequency to an approximate 1.36 kHz symmetrical square wave."], "jumps": ["P2120", "P2100", "P2115"]}, {"id": "P2115", "text": ["MEASUREMENT SETUP - Set R5 and R6 to mid position (arrows up)."], "jumps": []}, {"id": "P2120", "text": ["7.  Measure the output frequency at PC130-44 TP9.  Type in the\n     measured value.  Round to two decimal places.", "7. Measure the output frequency at PC130-44 TP9. Type in the measured value. Round to two decimal places."], "jumps": ["P2122"]}, {"id": "P2121", "text" Vcc. It should be a constant 12 volts DC."], "jumps": ["P2170", "P2150"]}, {"id": "P11172", "text": ["The fault inserted by the computer does not affect the Vcc supply voltage.  Ensure your equipment is setup to measure DC voltage.", "2.  Using your oscilloscope, measure Vcc at TP8.\n     Is it a smooth +12 VDC voltage?", "The fault inserted by the computer does not affect the Vcc supply voltage. Ensure your equipment is setup to measure DC voltage.", "2. Using your oscilloscope, measure Vcc at TP8. Is it a smooth +12 VDC voltage??"], "jumps": []}, {"id": "P2171", "text": [], "jumps": []}, {"id": "P2172", "text": ["The fault inserted by the computer does not affect the Vcc supply voltage.  Ensure your oscilloscope setup is correct.", "The fault inserted by the computer does not affect the Vcc supply voltage. Ensure your oscilloscope setup is correct."], "jumps": []}, {"id": "P2175", "text": ["MEASUREMENT SETUP - Carefully measure Vcc at TP8......................."], "jumps": []}, {"id": "P2172", "text": ["The fault inserted by the computer does not affect the Vcc supply voltage.  Ensure your equipment is setup to measure DC voltage.", "The fault inserted by the computer does not affect the Vcc supply voltage. Ensure your equipment is setup to measure DC voltage..........."], "jumps": []}, {"id": "P2190", "text": ["4.  Using an analog ohmmeter or digital diode junction tester, \n     check across the base-to-emitter junction of Q2 (TP7 - TP1).  \n     Reverse the leads and check it again.\n\n     Does the base-to-emitter junction of Q2 test OK?", "4. Using an analog ohmmeter or digital diode junction tester, check across the base-to-emitter junction of Q2 (TP7 - TP1). Reverse the leads and check it again. Does the base-to-emitter junction of Q2 test OK???????????????????????????????????????????????????????????????????????????????????????????????????"], "jumps": ["P2180", "P2195"]}, {"id": "P2191", "text": [], "jumps": []}, {"id": "P3130", "text": ["1.  Place CH1 oscilloscope probe to TP20.\n2.  Place CH2 oscilloscope probe to TP26.  Adjust the\n     oscilloscope controls to obtain the display shown.", "1. Place CH1 oscilloscope probe to TP20. 2. Place CH2 oscilloscope probe to TP26. Adjust the oscilloscope controls to obtain the display shown."], "jumps": ["P3120"]}, {"id": "P4910", "text": ["This completes the experiment on BISTABLE MULTIVIBRATOR.", "This completes the experiment on BISTABLE MULTIVIBRATOR......", "tter junction of Q2 should read high resistance for one lead polarity and low resistance for the other. An analog meter may be required."], "jumps": ["P4001", "P4270"]}, {"id": "P2910", "text": ["This completes the experiment on ASTABLE MULTIVIBRATOR.", "5.  Make continuity checks across the base-to-collector junction\n     of Q2 (TP7 - TP9).  Reverse the leads and check it again.\n     Did you measure high resistance for one lead polarity and low\n     resistance for the other polarity?", "This completes the experiment on ASTABLE MULTIVIBRATOR.....", "5. Make continuity checks across the base-to-collector junction of Q2 (TP7 - TP9). Reverse the leads and check it again. Did you measure high resistance for one lead polarity and low resistance for the other polarity?"], "jumps": ["P2001", "P2300"]}, {"id": "P2211", "text": [], "jumps": []}, {"id": "P2230", "text": ["Since both junction tests of the transistor passed, Q2 is functioning correctly.  Let's check Q1.", "Since both junction tests of the transistor passed, Q2 is functioning correctly. Let's check Q1."], "jumps": ["P2240", "P2210"]}, {"id": "P2240", "text": ["6.  Using an analog ohmmeter or digital diode junction tester, \n     check across the base-to-emitter junction of Q1 (TP5 - TP1).  \n     Reverse the leads and check it again.\n\n     Does the base-to-emitter junction of Q2 test OK?", "6. Using an analog ohmmeter or digital diode junction tester, check across the base-to-emitter junction of Q1 (TP5 - TP1). Reverse the leads and check it again. Does the base-to-emitter junction of Q2 test OK????????????istance for the other polarity?"], "jumps": ["P2230"]}, {"id": "P2241", "text": [], "jumps": []}, {"id": "P2242", "text": ["Ensure that you're test leads are connected to TP1 and TP5, and re-check your measurements.  Remember, if the base-to-emitter junction is good you will measure high resistanceor no current flow  one way and low resistance or current flow the other.", "Ensure that you're test leads are connected to TP1 and TP5, and re-check your measurements. Remember, if the base-to-emitter junction is good you will measure high resistanceor no current flow one way and low resistance or current flow the other. high resistance one way and low resistance the other..................."], "jumps": []}, {"id": "P2250", "text": ["Congratulations, you determined Q1 is faulted.  The base-to-emitter junction is open.  The computer will replace Q1.", "Congratulations, you determined Q1 is faulted. The base-to-emitter junction is open. The computer will replace Q1.External program = SCAN FTR 0 C1 00.................................."], "jumps": ["P2240"]}, {"id": "P2260", "text": ["7.  Turn the PC1 DC Power to ON.\n8.  Measure the output at TP9 on PC130-44 using the\n     oscilloscope to verify that the circuit has been repaired.", "7. Turn the PC1 DC Power to ON. 8. Measure the output at TP9 on PC130-44 using the oscilloscope to verify that the circuit has been repaired.."], "jumps": ["P2250"]}, {"id": "P2270", "text": ["Notice that the output waveform is now correct for an astable multivibrator."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": ["P2270"]}, {"id": "P2290", "text": ["2.  Turn the Test Console Power to OFF.", "2. Turn the Test Console Power to OFF....................."], "jumps": ["P2280"]}, {"id": "P2300", "text": ["3.  Disconnect all test equipment.\n4.  Carefully remove PC130-44.\n5.  Return all equipment to its proper storage area.", "3. Disconnect all test equipment. 4. Carefully remove PC130-44. 5. Return all equipment to its proper storage area.."], "jumps": ["P2910", "P2290"]}, {"id": "P11080", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P11070"]}, {"id": "P3001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P3020", "text": ["The purpose of this experiment is to demonstrate troubleshooting monostable multivibrator circuits."], "jumps": ["P3030", "P3001"]}, {"id": "P3030", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P3040", "text": ["Pick up the PC130-46 card. This card is used to demonstrate typical faults in a monostable multivibrator."], "jumps": ["P3030"]}, {"id": "P3050", "text": ["Compare the card with the schematic shown."], "jumps": ["P3040"]}, {"id": "P3060", "text": ["The input signal is applied to TP20 and the output is taken from TP22 and TP26."], "jumps": ["P3040"]}, {"id": "P3070", "text": ["R23 adjusts the width of the output pulses.  Let's start the experiment.", "R23 adjusts the width of the output pulses. Let's start the experiment."], "jumps": ["P3040"]}, {"id": "P3080", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P3040"]}, {"id": "P3090", "text": ["2.  Carefully plug PC130-46 into the Test Console PC1 position.   3.  Rotate R23 to mid position (arrow to right).", "2. Carefully plug PC130-46 into the Test Console PC1 position. 3. Rotate R23 to mid position (arrow to right).xternal program = SCAN FTR 0 C1 00....................................."], "jumps": ["P3080", "P3095"]}, {"id": "P3095", "text": ["MEASUREMENT S h to ON........................................."], "jumps": ["P3140"]}, {"id": "P3160", "text": ["1.  Measure the output of the multivibrator at TP26 on PC130-46.\n     Is the multivibrator functioning correctly?", "1. Measure the output of the multivibrator at TP26 on PC130-46. Is the multivibrator functioning correctly??"], "jumps": ["P3150", "P3165"]}, {"id": "P3161", "text": [], "jumps": []}, {"id": "P3162", "text": ["Ensure you are measuring TP26.  The fault inserted by the computer will cause the output to be zero or Vcc.", "Ensure you are measuring TP26. The fault inserted by the computer will cause the output to be zero or Vcc."], "jumps": []}, {"id": "P3165", "text": ["OSCILLOSCOPE LEAD PLACEMENT - Ensure that CH2 probe is measuring the output on TP26."], "jumps": []}, {"id": "P3170", "text": ["Since the output is faulted (measures either zero or Vcc), check to make sure Vcc is +12 volts DC."], "jumps": ["P3180", "P3160"]}, {"id": "P3180", "text": ["2.  Measure Vcc at TP25.\n     Is it a smooth +12 VDC voltage?", "2. Measure Vcc at TP25. Is it a smooth +12 VDC voltage???????????????????????????"], "jumps": ["P3170"]}, {"id": "P3181", "text": [], "jumps": []}, {"id": "P3182", "text": ["The fault inserted by the computer does not affect the Vcc supply voltage.  Ensure your oscilloscope setup is correct.", "The fault inserted by the computer does not affect the Vcc supply voltage. Ensure your oscilloscope setup is correct."], "jumps": []}, {"id": "P3190", "text": ["Since Vcc is correct, the next troubleshooting step is to check the transistors."], "jumps": ["P3195", "P3180"]}, {"id": "P3195", "text": ["3.  Turn the PC1 DC Power switch OFF.\n4.  Disconnect the Function Generator.", "3. Turn the PC1 DC Power switch OFF. 4. Disconnect the Function Generator. to ON...."], "jumps": ["P3190"]}, {"id": "P3200", "text": ["5.  Check across the base-to-emitter junction of Q6 (TP23-TP19) \n     using an analog ohmhmeter or digital diode tester.  Reverse \n     the leads and check it again.\n\n     Did the base-to-emitter junction test OK?", "5. Check across the base-to-emitter junction of Q6 (TP23-TP19) using an analog ohmhmeter or digital diode tester. Reverse the leads and check it again. Did the base-to-emitter junction test OK?"], "jumps": ["P3195", "P3205"]}, {"id": "P3201", "text": [], "jumps": []}, {"id": "P3260", "text": ["Your check of the base-to-emitter junction of Q5 indicates that it is good.  NexLet's check the base-to-collector junction.", "Your check of the base-to-emitter junction of Q5 indicates that it is good. NexLet's check the base-to-collector junction.", "Your check of the base-to-emitter junction of Q5 indicates that it is good. Next, check the base-to-collector junction.", "TRANSISTOR CHECK - The base-to-emitter junction of a transistor should read high resistance for one lead polarity and a low resistance for the other. You may have to use different ranges on the meter."], "jumps": ["P3270", "P3250"]}, {"id": "P3210", "text": ["Your check of the base-to-emitter junction of Q6 indicates that it is good.  Let's check the base-to-collector junction.", "Your check of the base-to-emitter junction of Q6 indicates that it is good. Let's check the base-to-collector junction."], "jumps": ["P3220", "P3200"]}, {"id": "P3220", "text": ["6.  Measure across the base-to-collector junction of Q6 (TP23-\n     TP26).  Reverse the leads and check it again.\n     \n     Did the base-to-collector junction test OK?", "6. Measure across the base-to-collector junction of Q6 (TP23- TP26). Reverse the leads and check it again. Did the base-to-collector junction test OK?"], "jumps": ["P3210"]}, {"id": "P3221", "text": [], "jumps": []}, {"id": "P3230", "text": ["Your check of the base-to-collector junction of Q6 indicates that it is good.  The transistor is functioning correctly.", "Your check of the base-to-collector junction of Q6 indicates that it is good. The transistor is functioning correctly."], "jumps": ["P3240", "P3220"]}, {"id": "P3240", "text": ["Since Q6 checks good, let's check Q5."], "jumps": ["P3250", "P3230"]}, {"id": "P3270", "text": ["8.  Measure across the base-to-collector junction of Q5 (TP21-\n     TP12).  Reverse the leads and check it again.\n     \n     Did the base-to-collector junction test OK?", "8. Measure across the base-to-collector junction of Q5 (TP21- TP12). Reverse the leads and check it again. Did the base-to-collector junction test OK??????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????"], "jumps": ["P3260"]}, {"id": "P3251", "text": [], "jumps": []}, {"id": "P4130", "text": ["1.  Place CH1 oscilloscope probe to TP11.\n2.  Place CH2 oscilloscope probe to TP16.  Adjust the\n     oscilloscope controls to obtain the display shown.", "1. Place CH1 oscilloscope probe to TP11. 2. Place CH2 oscilloscope probe to TP16. Adjust the oscilloscope controls to obtain the display shown..."], "jumps": ["P4120"]}, {"id": "P4182", "text": ["The fault inserted by the computer does not affect the Vcc supply voltage.  Ensure your equipment setup is correct.", "The fault inserted by the computer does not affect the Vcc supply voltage. Ensure your equipment setup is correct............."], "jumps": []}, {"id": "P3271", "text": [], "jumps": []}, {"id": "P3280", "text": ["Your check of the base-to-collector junction of Q5 indicates that it is good.  The transistor is functioning correctly.", "Your check of the base-to-collector junction of Q5 indicates that it is good. The transistor is functioning correctly."], "jumps": ["P3290", "P3270"]}, {"id": "P3290", "text": ["Since Q5 and Q6 are operating correctly, the next step is to check the resistance from the Vcc input to the base and collector of the transistors."], "jumps": ["P3300", "P3280"]}, {"id": "P1090", "text": ["To check the transistors, disconnect Vcc and perform continuity checks between junctions with an ohmmeter or the diode junction test function of a digital multimeter...."], "jumps": ["P1100", "P1030"]}, {"id": "P1120", "text": ["ou should read a lohigh resistance or no current flow one way.", "The same test holds true for the base-to-collector junction. You should read a low resistance or current flow one way........"], "jumps": ["P1130", "P1090"]}, {"id": "P1135", "text": ["The important thing to look for is the changed reading when the lead polarities are reversed regardless of the type of equipment used to perform the measurements. A digital ohmmeter cannot be used as it does not flow enough current to forward bias the transistor junction, a necessity for transistor testing as current flows only when the junction is forward biased."], "jumps": ["P1140", "P1090"]}, {"id": "P1170", "text": ["of R2, with the previous exceptions. Looking closely, you'l", "The resistance from point A to B should indicate the resistance of R2, with the previous exceptions. Looking closely, you'll see that R4 and the base-to-collector junction of Q2 are in parallel with R2 if the transistor were to be forward biased This could cause false readings.."], "jumps": ["P1180", "P1140"]}, {"id": "P3310", "text": ["Does your resistance reading indicate an open or short?", "Does your resistance reading indicate an open or short?...."], "jumps": ["P3300"]}, {"id": "P3311", "text": [], "jumps": []}, {"id": "P14182", "text": ["The fault inserted by the computer does not affect the Vcc supply  voltage.  Ensure your equipment setup is correct.", "The fault inserted by the computer does not affect the Vcc supply voltage. Ensure your equipment setup is correct............."], "jumps": []}, {"id": "P3320", "text": ["10.  Measure the resistance from TP25 to TP22.  This \n       measurement should indicate about 2.2 kW for normal \n       operation.", "10. Measure the resistance from TP25 to TP22. This measurement should indicate about 2.2 kW for normal operation................................"], "jumps": ["P3330", "P3310"]}, {"id": "P3330", "text": ["Does your resistance reading indicate an open or short?", "Does your resistance reading indicate an open or short?...."], "jumps": ["P3320"]}, {"id": "P3331", "text": [], "jumps": []}, {"id": "P3332", "text": ["You should not measure an open or short.  Ensure no semiconductor components are forward biased.", "You should not measure an open or short. Ensure no semiconductor components are forward biased......................................."], "jumps": []}, {"id": "P3340", "text": ["11.  Measure the resistance from TP25 to TP23.  You should \n       measure about 62 kW (R23 to mid-position) for normal \n       operation.", "11. Measure the resistance from TP25 to TP23. You should measure about 62 kW (R23 to mid-position) for normal operation..................................."], "jumps": ["P3350", "P3330"]}, {"id": "P3350", "text": ["Does your resistance reading indicate an open or short?", "Does your resistance reading indicate an open or short?...."], "jumps": ["P3340"]}, {"id": "P3351", "text": [], "jumps": []}, {"id": "P3352", "text": ["You should have measured an open between TP25 and TP23. This is caused by the fault the computer inserted."], "jumps": []}, {"id": "P3360", "text": ["An open between TP25 and TP23 indicates that either R22 or R23 is open. Let's find out which one."], "jumps": ["P3370", "P3350"]}, {"id": "P3370", "text": ["12.  Measure the resistance from TP25 to TP24.  This tests R22.", "12. Measure the resistance from TP25 to TP24. This tests R22."], "jumps": ["P3380", "P3360"]}, {"id": "P3380", "text": ["Is R22 open?", "Is R22 open?the question is typed.........................."], "jumps": ["P3360"]}, {"id": "P3381", "text": [], "jumps": []}, {"id": "P3382", "text": ["You should measure about 12 kW for R22.  Ensure you are measuring from TP25 to TP24.", "You should measure about 12 kW for R22. Ensure you are measuring from TP25 to TP24."], "jumps": []}, {"id": "P3390", "text": ["Since R22 checks good, R23 must be open.\n13.  Measure the resistance from TP24 to TP23.  For normal\n        operation, it should be about 50 kW.", "Since R22 checks good, R23 must be open. 13. Measure the resistance from TP24 to TP23. For normal operation, it should be about 50 kW."], "jumps": ["P3400", "P3380"]}, {"id": "P3400", "text": ["Is R23 open?", "Is R23 open?the question is typed.........................."], "jumps": ["P3390"]}, {"id": "P3401", "text": [], "jumps": []}, {"id": "P3402", "text": ["You should measure infinite resistance for R23.  The fault inserted by the computer opened the resistor.", "You should measure infinite resistance for R23. The fault inserted by the computer opened the resistor."], "jumps": []}, {"id": "P3410", "text": ["Congratulations, you determined R23 is open.\n1.  Place your oscilloscope probe on the output (TP26).\n2.  Turn the PC1 DC Power ON.\n3.  Reconnect the Function Generator.", "Congratulations, you determined R23 is open. 1. Place your oscilloscope probe on the output (TP26). 2. Turn the PC1 DC Power ON. 3. Reconnect the Function Generator..."], "jumps": ["P3400", "P3415"]}, {"id": "P3415", "text": ["OSCILLOSCOPE LEAD PLACEMENT - Carefully connect CH1 probe on the output (TP26)."], "jumps": []}, {"id": "P3420", "text": ["The computer has replaced R23.  Notice the output shown on your oscilloscope is now correct for a monostable multivibrator.", "The computer has replaced R23. Notice the output shown on your oscilloscope is now correct for a monostable multivibrator. xternal program = SCAN FTR 0 C1 00.........................."], "jumps": ["P3410"]}, {"id": "P3430", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": ["P3420"]}, {"id": "P3440", "text": ["2.  Turn Power OFF to the Test Console.", "2. Turn Power OFF to the Test Console.................. 130-45 into the Test Console PC1 position.h to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P4080"]}, {"id": "P4100", "text": ["3.  Connect the output of the function generator to the Input BNC\n     Connector on the Test Console.", "3. Connect the output of the function generator to the Input BNC Connector on the Test Console.."], "jumps": ["P4090", "P3105"]}, {"id": "P4110", "text": ["4.  Set the function generator for a 2 kHz, 5 Vpp square wave\n     output as measured on TP11 with your oscilloscope.", "4. Set the function generator for a 2 kHz, 5 Vpp square wave output as measured on TP11 with your oscilloscope. 5. Pull the symmetry control out and rotate fully CCW."], "jumps": ["P4100", "P3115"]}, {"id": "P4120", "text": ["5.  Set Voltmeter switch to Positive. Set the Positive Supply\n      Voltage to 12. The Test Console's voltage meter should\n      indicate 12 volts.\n6.  Turn the PC1 DC Power switch to ON.", "5. Set Voltmeter switch to Positive. Set the Positive Supply Voltage to 12. The Test Console's voltage meter should indicate 12 volts. 6. Turn the PC1 DC Power switch to ON...."], "jumps": ["P4110"]}, {"id": "P14222", "text": ["You should measure very high (infinite) resistance for the base-to-collector junction using an ohmmeter or no current flow with the leads in both positions using a digital diode junction tester.  This is caused by the fault the computer inserted.", "1.  Place CH1 oscilloscope probe to TP11.\n2.  Place CH2 oscilloscope probe to TP16.  Adjust the\n     oscilloscope controls to obtain the display shown.", "You should measure very high (infinite) resistance for the base-to-collector junction using an ohmmeter or no current flow with the leads in both positions using a digital diode junction tester. This is caused by the fault the computer inserted.", "1. Place CH1 oscilloscope probe to TP11. 2. Place CH2 oscilloscope probe to TP16. Adjust the oscillosc tor functioning correctly??"], "jumps": ["P11130"]}, {"id": "P11151", "text": [], "jumps": []}, {"id": "P11152", "text": ["Ensure you are measuring TP9.  The fault inserted by the computer will either cause no output from the multivibrator or a constant Vcc level.", "Ensure you are measuring TP9. The fault inserted by the computer will either cause no output from the multivibrator or a constant Vcc level."], "jumps": []}, {"id": "P13161", "text": [], "jumps": []}, {"id": "P13181", "text": [], "jumps": []}, {"id": "P13201", "text": [], "jumps": []}, {"id": "P13210", "text": ["Your check of the base-to-emitter junction of Q6 indicates that it is good. Let's check the base-to-collector junction."], "jumps": ["P13220", "P13200"]}, {"id": "P13221", "text": [], "jumps": []}, {"id": "P11170", "text": ["Vcc at TP8. Is it a smooth +12 VDC voltage??", "2. Using your oscilloscope or multimeter, measure Vcc at TP8. Is it a smooth +12 VDC voltage?"], "jumps": ["P11160", "P11175"]}, {"id": "P11180", "text": ["Since Vcc is correct, the next troubleshooting step is to check      the transistors with an ohmmeter or diode junction tester.\n3.  Turn the PC1 DC Power switch to OFF.", "Since Vcc is correct, the next troubleshooting step is to check the transistors with an ohmmeter or diode junction tester. 3. Turn the PC1 DC Power switch to OFF."], "jumps": ["P11170"]}, {"id": "P11172", "text": ["The fault inserted by the computer does not affect the Vcc supply voltage.  Ensure your oscilloscope setup is correct.", "The fault inserted by the computer does not affect the Vcc supply voltage. Ensure your oscilloscope setup is correct."], "jumps": []}, {"id": "P11175", "text": ["MEASUREMENT SETUP - Carefully measure with the oscilloscope Vcc at TP8."], "jumps": []}, {"id": "P11250", "text": ["Congratulations, you determined Q1 is faulted.  The base-to-emitter junction is open. The computer will replace Q1.", "Congratulations, you determined Q1 is faulted. The base-to-emitter junction is ope ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????"], "jumps": ["P11230"]}, {"id": "P11230", "text": ["Since both junction tests of the transistor passed, Q2 is functioning correctly.  Let's check Q1.", "Since both junction tests of the transistor passed, Q2 is functioning correctly. Let's check Q1."], "jumps": ["P11240", "P11210"]}, {"id": "P13150", "text": ["The multivibrator is operating normally. The computer will now insert a fault."], "jumps": ["P13140"]}, {"id": "P13270", "text": ["8.  Measure across the base-to-collector junction of Q5 (TP21-\n     TP22).  Reverse the leads and check it again.\n     \n     Did the base-to-collector junction test OK?", "8. Measure across the base-to-collector junction of Q5 (TP21- TP22). Reverse the leads and check it again. Did the base-to-collector junction test OK??one lead polarity and low resistance for the other polarity???"], "jumps": ["P13260"]}, {"id": "P13050", "text": ["Compare the card with the schematic shown."], "jumps": ["P13060", "P13040"]}, {"id": "P11242", "text": ["Ensure that you're test leads are connected to TP1 and TP5, and re-check your measurements.  Remember, if the base-to-emitter junction is good you will measure high resistanceor no current flow  one way and low resistance or current flow the other.", "Ensure that you're test leads are connected to TP1 and TP5, and re-check your measurements. Remember, if the base-to-emitter junction is good you will measure high resistanceor no current flow one way and low resistance or current flow the other. high resistance one way and low resistance the other..................."], "jumps": []}, {"id": "P11260", "text": ["7.  Measure the output at TP9 on PC130-44 using the\n     oscilloscope to verify that the circuit has been repaired.\n8.  Press Enter to Set: PC1 DC Power Switch - ON", "7. Measure the output at TP9 on PC130-44 using the oscilloscope to verify that the circuit has been repaired. 8. Press Enter to Set: PC1 DC Power Switch - ON"], "jumps": ["P11250"]}, {"id": "P11270", "text": ["Notice that the output waveform is now correct for an astable multivibrator.", "Notice that the output waveform is now correct for an astable multivibrator.."], "jumps": ["P11260"]}, {"id": "P11290", "text": ["1.  Turn Power OFF to the Test Console.", "1. Turn Power OFF to the Test Console..FF................................."], "jumps": []}, {"id": "P11300", "text": ["2.  Disconnect all test equipment.\n3.  Carefully remove PC130-44.\n4.  Return all equipment to its proper storage area.", "2. Disconnect all test equipment. 3. Carefully remove PC130-44. 4. Return all equipment to its proper storage area.."], "jumps": ["P11910", "P11290"]}, {"id": "P11300", "text": ["2.  Disconnect all test equipment.\n3.  Carefully remove PC130-44.\n4.  Return all equipment to its proper storage area.", "2. Disconnect all test equipment. 3. Carefully remove PC130-44. 4. Return all equipment to its proper storage area.."], "jumps": ["P11910", "P11290"]}, {"id": "P11110", "text": ["5.  Set R5 and R6 on PC130-44 to mid position (arrows up).  This\n     sets the frequency to approximately 1.1 kHz symmetrical\n     square wave.", "5. Set R5 and R6 on PC130-44 to mid position (arrows up). This sets the frequency to approximately 1.1 kHz symmetrical square wave."], "jumps": ["P11120", "P11100", "P11115"]}, {"id": "P13020", "text": ["The purpose of this experiment is to demonstrate troubleshooting monostable multivibrator circuits."], "jumps": ["P13030", "P3001"]}, {"id": "P13030", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P13040", "text": ["Pick up the PC130-46 card. This card is used to demonstrate typical faults in a monostable multivibrator."], "jumps": ["P13050", ": ["P13190"]}, {"id": "P13182", "text": ["The fault inserted by the computer does not affect the Vcc supply voltage.  Ensure your equipment setup is correct.", "The fault inserted by the computer does not affect the Vcc supply voltage. Ensure your equipment setup is correct............."], "jumps": []}, {"id": "P13230", "text": ["Your check of the base-to-collector junction of Q6 indicates that it is good.  The transistor is functioning correctly.", "Your check of the base-to-collector junction of Q6 indicates that it is good. The transistor is functioning correctly."], "jumps": ["P13240", "P13220"]}, {"id": "P2200", "text": ["Your check of the base-to-emitter junction of Q2 indicates that it is good.  Let's check the base-to-collector junction.", "Your check of the base-to-emitter junction of Q2 indicates that it is good. Let's check the base-to-collector junction."], "jumps": ["P2210", "P2190"]}, {"id": "P3205", "text": ["TRANSISTOR CHECK - The base-to-emitter junction of a transistor should read high resistance or no current flow for one lead polarity and a low resistance or current flow for the other. You may have to use a different range on the meter or switch to a digital diode junction tester."], "jumps": []}, {"id": "P13205", "text": ["TRANSISTOR CHECK - The base-to-emitter junction of a transistor should read high resistance or no current flow for one lead polarity and a low resistance or current flow for the other. You may have to use a different range on the meter or switch to a digital diode junction tester."], "jumps": []}, {"id": "P13240", "text": ["Since Q6 checks good, let's check Q5."], "jumps": ["P13250", "P13230"]}, {"id": "P13320", "text": ["10.  Measure the resistance from TP25 to TP22.  This \n       measurement should indicate about 2.2 kW for normal \n       operation.", "10. Measure the resistance from TP25 to TP22. This measurement should indicate about 2.2 kW for normal operation. kW for normal operation."], "jumps": ["P13330", "P13310"]} low resistance for the other polarity???"], "jumps": ["P13260"]}, {"id": "P13280", "text": ["Your check of the base-to-collector junction of Q5 indicates that it is good.  The transistor is functioning correctly.", "Your check of the base-to-collector junction of Q5 indicates that it is good. The transistor is functioning correctly."], "jumps": ["P13290", "P13270"]}, {"id": "P13290", "text": ["Since Q5 and Q6 are operating correctly, the next step is to check the resistance from the Vcc input to the base and collector of the transistors."], "jumps": ["P13300", "P13280"]}, {"id": "P13300", "text": ["9. Measure the resistance from TP25 to TP21. Normally, you'll measure about 12.2 kW. This reading may vary. Should the reading be low, a transistor may be forward biased by the meter. Try the reading with the meter leads reversed."], "jumps": ["P13310", "P13280"]}, {"id": "P13310", "text": ["Does your resistance reading indicate an open or short?", "Does your resistance reading indicate an open or short?...."], "jumps": ["P13300"]}, {"id": "P13311", "text": [], "jumps": []}, {"id": "P13312", "text": ["You should not measure an open or short.  Reverse the meter leads so that no semiconductor components are forward biased.", "You should not measure an open or short. Reverse the meter leads so that no semiconductor components are forward biased.rward biased."], "jumps": []}, {"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-02-99 Conversion cleanup steps 1 thru 9 - lisa 08-05-99 Trainer code. debbie 08-11-99 Conversion cleanup steps 10 thru 17 - lisa 03-16-00 Added P11242 and P2242. Penny 03-22-00 P100 Changed \"* Describe typical faults in astable, monostable, and bistable.\" to \" * Describe typical faults in astable, monostable, and bistable multivibrators.\" Under \"2. Astable Experiment\" changed \"* Identify the faulted component in an bistable multivibrator.\" to \"* Identify the faulted component in an astable multivibrator.\" - Penny 07-14- or. X", "Check circuit resistances.nd it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor.", "Page id 881 of Book \"C:\\Dev2000\\Lessons\\93953605.tbk\""], "jumps": []}, {"id": "P11090", "text": ["2.  Carefully plug PC130-44 into the Test Console PC1 position.\n3.  Place PC130-44 S1 to the Out (down) position.", "2. Carefully plug PC130-44 into the Test Console PC1 position. 3. Place PC130-44 S1 to the Out (down) position."], "jumps": ["P11100", "P11080", "P11095"]}, {"id": "P14020", "text": ["The purpose of this experiment is to demonstrate troubleshooting bistable multivibrator circuits."], "jumps": ["P14030", "P4001"]}, {"id": "P14030", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P14040", "text": ["Pick up the PC130-45 card.  This card is used to demonstrate typical faults in a bistable multivibrator.", "Pick up the PC130-45 card. This card is used to demonstrate typical faults in a bistable multivibrator."], "jumps": ["P14050", "P14030"]}, {"id": "P14050", "text": ["Compare the card with the schematic shown."], "jumps": ["P14060", "P14040"]}, {"id": "P14060", "text": ["The input signal is applied to TP11 and the output is taken from TP12 and TP16."], "jumps": ["P14070", "P14040"]}, {"id": "P14070", "text": ["A short trigger pulse applied to the input changes the output state until the next trigger pulse is received.  Let's start the experiment.", "A short trigger pulse applied to the input changes the output state until the next trigger pulse is received. Let's start the experiment."], "jumps": ["P14080", "P14040"]}, {"id": "P14080", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P14040"]}, {"id": "P14090", "text": ["2.  Carefully plug PC130-45 into the Tes let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
