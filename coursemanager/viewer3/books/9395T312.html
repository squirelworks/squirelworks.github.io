const book = {"title": "9395T312", "pages": [{"id": "PPINFO", "text": ["Page # Test# Question# HelpPage # 10210 1 110 1070 10211 1 111 1080 10212 1 112 1110 10213 1 113 1120 10214 1 114 1390 10215 1 115 1380 10216 1 116 1400 10217 1 117 1460 10218 1 118 1550 10219 1 119 1520 10220 2 120 2030 10221 2 121 2030 10222 2 122 2090 10223 2 123 2460 10224 2 124 2560 10225 2 125 2200 10226 2 126 2240", "Page # Test# Question# HelpPage # 10210 1 110 1070 10211 1 111 1080 10212 1 112 1110 10213 1 113 1120 10214 1 114 1390 10215 1 115 1380 10216 1 116 1400 10217 1 117 1460 10218 1 118 1550 10219 1 119 1520 10220 2 120 2030 10221 2 121 2030 10222 2 122 2090 10223 2 123 2460 10224 2 124 2560 10225 2 125 2200 10226 2 126 2240 240 10241 10242 10243 10244 10245 10246 10247 10248 10249 128 30000 10229 2 129 30000 10230 3 130 30000 10231 3 131 30000 10232 3 132 30000 10233 3 133 30000 10234 3 134 30000 10235 3 135 30000 10236 3 136 30000 10237 3 137 30000 10238 3 138 30000 10239 3 139 30000 10240 10241 10242 10243 10244 10245 10246 10247 10248 10249"], "jumps": []}, {"id": "PINFO", "text": ["01-26-04 converted from sty - patty 02-24-04 graphics. mary", "01-26-04 converted from sty - patty 02-24-04 graphics. mary 03-03-04 reviewed & approved. Dave 03-17-04 P1950, Removed the bulleted items from the discussion text field. P10213, changed Ic's to ICs. P10217, stretched question stem text field bigger so that question stem is not on four text lines. -Penny"], "jumps": []}, {"id": "P10410", "text": ["1. Brushless DC Motor (BLDC) Characteristicscs", "2. Brushless DC Motor (BLDC) Controllers"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to __________"], "jumps": []}, {"id": "P10302", "text": ["end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10226", "text": ["Reduced cost. ce is d, and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "What is the benefit of Hall-effect sensors over photodiode sensors?"], "jumps": []}, {"id": "P10225", "text": ["What is the basic purpose of a photodiode array of an optical sensor?"], "jumps": []}, {"id": "P10224", "text": ["The microprocessor controls the motor by sending _______ data to the interface unit."], "jumps": []}, {"id": "P10223", "text": ["The transistor and diode circuits control the stator windings. What are the circuits called and how are they arranged?"], "jumps": []}, {"id": "P10222", "text": ["The conventional DC motor controller uses _______as an indication of motor movement, but BLDC uses _______from a sensor array for the same thing."], "jumps": []}, {"id": "P10221", "text": ["Which functional block in the figure is the microprocessor?"], "jumps": []}, {"id": "P10220", "text": ["Which functional block in the figure is the interface circuit?"], "jumps": []}, {"id": "P10219", "text": ["The muffin fan on a computer motherboard is an example of what common BLDC application?"], "jumps": []}, {"id": "P10218", "text": ["You open a box containing a BLDC motor and find that rotor, stator, and sensors are packaged separately. What is the configuration of the motor?"], "jumps": []}, {"id": "P10217", "text": ["BLDC motors are available in different stator configurations. How many stator windings are on a Limited Angle Torque BLDC motor?"], "jumps": []}, {"id": "P10216", "text": ["Generally speaking, what are the two types of BLDC motors?"], "jumps": []}, {"id": "P10215", "text": ["What is the relationship of torque to acceleration?"], "jumps": []}, {"id": "P10214", "text": ["Which of the following advantages & disadvantages apply to BLDC motors?", "Suitability for digital interface & limited applications."], "jumps": []}, {"id": "P10213", "text": ["What types of sensors are commonly used on BLDC motors?"], "jumps": []}, {"id": "P10212", "text": ["Why is the BLDC easier to examine and repair than a conventional DC motor?", "BLDC is always physically small and lighter.", "BLDC brushes produce less soot than convention brushes.", "The electronics package is part of the motor and may be easily accessed."], "jumps": []}, {"id": "P10211", "text": ["The BLDC rotor is similar in design concept to _______."], "jumps": []}, {"id": "P10210", "text": ["Which component is not part of the BLDC mechanical system?"], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2920"]}, {"id": "P2960", "text": ["5 . The two most popular types of sensors are the LED/photodiode pair (optic) or the Hall-effect device (magnetic)."], "jumps": ["P2999"]}, {"id": "P2950", "text": ["4. While the conventional DC motor uses a tachometer to indicate motor speed, the BLDC uses angular position from a sensor array. Logic circuits determine the drive required to meet the commands coming from a host or user."], "jumps": []}, {"id": "P2940", "text": ["3. While conventional DC motors vary the field in the armature (rotor) with the stator in a fixed position, BLDC motors move the magnet, not the windings. r BLDC Motor"], "jumps": []}, {"id": "P2930", "text": ["2. Commutation electronics are integrated circuits that decode the input signals from the sensors. They consist of the circuits needed to power and rotate the magnetic field around the stator....."], "jumps": []}, {"id": "P2920", "text": ["1. The basic electronics subsystem consists of four functional groups: Sensors, Motor Drive Circuit, Interface Circuit, and Microprocessor (or similar operational device)."], "jumps": ["P2910"]}, {"id": "P2910", "text": ["This completes the lesson on Brushless DC (BLDC) Motor Controllers."], "jumps": ["P2001", "P2710"]}, {"id": "P2710", "text": ["One of the largest BLDC motor/controller combinations is used to position huge radio telescopes. The motor runs on 600 VDC or higher voltage and the controllers are often water-cooled. The transistor switches are high power Field Effect Transistors (FETs)..."], "jumps": ["P2910"]}, {"id": "P2700", "text": ["The controller is usually part of a user interface chip. The motor is sensor less and the load is an off-balanced weight."], "jumps": []}, {"id": "P2690", "text": ["One of the smallest BLDC motor/controller combinations is familiar to most people. The vibrator in a pager, wristwatch, personal data assistant (PDA), and cellular telephone is a BLDC."], "jumps": ["PDA"]}, {"id": "P2680", "text": ["Precise speed control is provided by a crystal-controlled oscillator. The IC also offers motor shutdown for over-current conditions and a low speed alarm. The IC is a 24-pin surface mount device about the size of a dime..."], "jumps": []}, {"id": "P2670", "text": ["The illustration is a 3-phase full-wave controller on a single IC. External components are minimal, consisting of the Hall-effect sensors, direction switch, motor drive transistors, crystal input, and an alarm output..."], "jumps": []}, {"id": "P2660", "text": ["This system of 4-phase BLDC with H-E control is very common in computer and robotics. The pancake motor used in most computer cooling fans is an example of this technology. This method of construction is known as System Integration as all associated circuitry and motor components are integrated into one assembly....."], "jumps": []}, {"id": "P2650", "text": ["The H-E IC outputs are complementary; when pin 2 is high, pin 3 is low. You will note power is applied to the coils at all times and the switching is done by forward biasing the transistors, selectively grounding one end of the coils in the desired order..."], "jumps": []}, {"id": "P2640", "text": ["For simplicity's sake, the H-E ICs are shown in 2 places; realize that each one is a single chip mounted inside the BLDC casing on the stator. The H-E units (HE and HE ) are physically located in the stator. This system uses only 2 sensors and 4 transistor switches."], "jumps": []}, {"id": "P2630", "text": ["Let us examine a full-wave bidirectional 4-phase motor system using H-E (Hall-effect) sensors for manual circuit switching. The sensors are labeled HE and HE on the schematic diagram."], "jumps": []}, {"id": "P2620", "text": ["The full-wave motor controller requires three photodiode or Hall effect sensors, six output transistors, and a logic control unit. The sensors are used as inputs to the logic unit, which turns the output transistors on and off..."], "jumps": []}, {"id": "P2610", "text": ["The system works perfectly in theory, of course, but what ensures that the rotor is moving as directed? This is where the sensors come into play."], "jumps": ["P2600"]}, {"id": "P2603", "text": ["The motor is bi-directional but the controller is full-wave."], "jumps": []}, {"id": "P2602", "text": ["The performance rating means little to direction capability."], "jumps": []}, {"id": "P2601", "text": [], "jumps": []}, {"id": "P2600", "text": ["What type of controller allows the motor to move in either direction?"], "jumps": ["P2590"]}, {"id": "P2590", "text": ["The interface circuit either transmits the data as motor switch commands or saves the information in an idle condition. An operator may control the microprocessor directly. Some applications use a simple logic circuit instead of a microprocessor..."], "jumps": []}, {"id": "P2580", "text": ["You can see how the microprocessor would control the motor. A data word representing an angular position is sent to the interface circuit, a latch or similar buffering device."], "jumps": []}, {"id": "P2570", "text": ["When Q is the most significant bit, 300", "CCW equals 101010 (52 in octal, 2A in hexadecimal)."], "jumps": []}, {"id": "P2560", "text": ["If you look at the tables carefully, digital data will appear to you. When Q is the most significant bit, 180", "CW equals a binary 001110 (16 in octal, E in hexadecimal)."], "jumps": []}, {"id": "P2550", "text": ["With 6 switches, motor movement is controlled in 60", "increments. More switches allow smaller angular movement."], "jumps": []}, {"id": "P2540", "text": ["A table of sensor settings can be used to represent the various combinations that produce motor movement in the three-phase BLDC system."], "jumps": []}, {"id": "P2530", "text": ["There are many of the possible switching combinations but only six are needed to control the full-wave motor in either direction of spin. Two coils are always active to ensure rotational direction is maintained..."], "jumps": []}, {"id": "P2520", "text": ["With the north poles of both magnetic fields pointing towards A, the total resultant field is toward A. No current flows through winding S because Q and Q are at the same potential, creating no current flow, which produces no magnetic field."], "jumps": ["P2530", "P2450"]}, {"id": "P2510", "text": ["The current generated by Q and Q goes through the S winding between A and C and places the north pole of the magnetic field toward A."], "jumps": []}, {"id": "P2500", "text": ["The current generated by Q and Q goes through the S winding between A and B and places the north magnetic field toward A."], "jumps": []}, {"id": "P2490", "text": ["Let's look at one example of operation. Q , Q , and Q are ON, as indicated on the schematic........................................................"], "jumps": []}, {"id": "P2480", "text": ["Notice that arrows indicate the polarity of the transistors: Positive (or north) for Q , Q and Q ; Negative (or south) for Q , Q , and Q ."], "jumps": []}, {"id": "P2470", "text": ["The transistors in this controller are set up in pairs, Q and Q , Q and Q , Q and Q . One transistor in each pair is always conducting, but only one transistor in each pair conducts at a time. For example, when Q conducts, Q must be off."], "jumps": []}, {"id": "P2460", "text": ["Notice each pair of transistor switches is complementary, Q through Q are PNP, and Q through Q are NPN. This allows each winding location, A, B, and C, to be driven with a positive or a negative voltage, reversing the magnetic field in the associated winding of the full wave motor..e motor.."], "jumps": []}, {"id": "P2450", "text": ["The full-wave motor controller allows motor action in both directions. This type of motor is ideal for continuous duty applications requiring motor reversal."], "jumps": []}, {"id": "P2440", "text": ["The three-phase configuration in our example is a unipolar BLDC motor. It provides clockwise rotation to serve any number of purposes quite fully. However, rewiring of the motor or its circuits would be required to deliver both clockwise and counterclockwise motor action..."], "jumps": []}, {"id": "P2430", "text": ["When the rotor is aligned with winding , the shutter cutout exposes photodiode Q . A voltage is sent to transistor Q , and S is energized, pulling the rotor clockwise to end in its original position....."], "jumps": []}, {"id": "P2420", "text": ["Without light to , transistor is turned off. The light that reaches causes it to generate a voltage, which turns on transistor and energizes winding . The magnetic forces move the rotor further clockwise...."], "jumps": []}, {"id": "P2410", "text": ["When S is energized, a south magnetic field is produced at the pole face, and the north pole of the rotor is attracted. The rotor revolves in a clockwise direction to align itself with S . The shutter cutout moves, blocking Q and exposing Q ."], "jumps": []}, {"id": "P2400", "text": ["The light through the shutter cutout causes Q to generate a voltage, which turns on transistor Q . Q amplifies the current to energize the stator winding S ."], "jumps": []}, {"id": "P2390", "text": ["When the north pole of the rotor is aligned with the stator winding S , light reaches photodiode Q through the opening in the shutter. Notice that the other transistors are off, as the shutter blocks light from Q and Q ."], "jumps": []}, {"id": "P2380", "text": ["The LED/photodiode pairs are mounted 120", "intervals. The three photodiodes, Q , Q , and Q , are connected through driver circuitry to Q , Q , and Q , which switch power to S , S , or S dependant upon the position of the rotating shutter."], "jumps": []}, {"id": "P2370", "text": ["Regardless of the number of wires, the operation BLDC motor is the same. Typical construction uses either a three-phase or a four-phase format. Let's look at the three-phase configuration first..."], "jumps": []}, {"id": "P2360", "text": ["In this eight-wire BLDC motor system, three wires provide power to the three-stator windings. The other five wires are for three sensors. Two of the five wires are used to power the sensors and the remaining three are used for the sensor outputs..."], "jumps": []}, {"id": "P2350", "text": ["In contrast to the two-wire motor, the commutation electronics of a multiple-wire BLDC motor may be mounted externally or located in a separate enclosure."], "jumps": []}, {"id": "P2340", "text": ["Additional features are also available for the two-wire BLDC motor, such as a third wire for feedback capability and an on-board potentiometer for speed control."], "jumps": []}, {"id": "P2330", "text": ["Although two-wire BLDC motors are usually limited in size to approximately 1/3 horsepower, hybrid commutation electronics have been developed for higher horsepower requirements."], "jumps": []}, {"id": "P2320", "text": ["The major advantage of the two-wire motor is the simple connection: one wire for the power supply and one wire for the power return. However, since the commutation electronics are enclosed within the motor case, heat generation is a concern with this type..."], "jumps": []}, {"id": "P2310", "text": ["Another factor of BLDC design involves the number of connections and the location of the commutation electronics (CE). Compare the Two-Wire BLDC type and the Multiple-Wire BLDC type. Two-Wire BLDC Multiple-Wire BLDC"], "jumps": ["P2300"]}, {"id": "P2303", "text": ["Both technologies are equally accurate but photodiodes require additional mechanical hardware and electronics."], "jumps": []}, {"id": "P2302", "text": ["Photodiodes, either individual or array, are basically the same size as H-E devices."], "jumps": []}, {"id": "P2301", "text": [], "jumps": []}, {"id": "P2300", "text": ["Why are Hall-effect sensors preferred to photodiodes in the BLDC motor system?", "Photodiodes are too large for BLDC applications.", "Hall-effect sensors are more accurate than photodiode sensors.", "Hall-effect sensors sense the position of the BLDC rotor without additional mechanical hardware or electronics."], "jumps": ["P2280"]}, {"id": "P2290", "text": ["Hall-effect sensors provide a voltage output when there is a magnetic field of proper polarity (north or south) with sufficient current to drive a load. The voltage is sent to the commutation electronics (driver) circuit to properly power the stator windings..."], "jumps": []}, {"id": "P2280", "text": ["The placement of the device is critical so the field generated by the stator windings does not trigger the Hall-effect sensor. Hall-effect (H-E) sensors are placed between the rotor and stator to sense the magnetic position of the rotor..."], "jumps": []}, {"id": "P2270", "text": ["SEND PLAYANIMATION TO GROUP \"2270\" OF PAGE \"P2270\"", "H-E sensors are epoxy encapsulated and highly reliable integrated circuits. They require very little power for operation and therefore generate minimal heat. Pancake motors use circular H-E printed circuit boards..."], "jumps": []}, {"id": "P2260", "text": ["The Hall-effect sensor detects magnetic fields in the immediate area. Unipolar H-E sensors only have one sensor incorporated into the IC. There are other more intricate types of H-E sensors."], "jumps": []}, {"id": "P2250", "text": ["The H-E circuit is a simple pulse generator consisting of a voltage regulator, hall voltage generator (magnetic sensor), amplifier, Schmitt trigger, and (2) output transistors."], "jumps": []}, {"id": "P2240", "text": ["The LED/photodiode (optical) sensor is gradually being replaced by Hall-effect technology for increased reliability and reduced costs. Fewer components are used in the Hall-effect sensor system..."], "jumps": []}, {"id": "P2230", "text": ["Because the current from the photodiode cannot generate a magnetic field strong enough to cause motor action, a power transistor is connected. The stator windings are energized, and the correct rotation is achieved..."], "jumps": []}, {"id": "P2220", "text": ["At a precise moment, the position of the cutout in the shutter allows the light from the LED to reach the photodiode. The photodiode generates a voltage for the length of time the light strikes it, until the shaft rotates the cutout away and the solid shutter breaks the path..."], "jumps": []}, {"id": "P2210", "text": ["The LEDs are placed strategically on the BLDC motor, and a photodiode for each is placed exactly opposite. The shutter, which is attached to the motor shaft, rotates between the pair. The cutout portion of the shutter allows the light from only one of the LED's to reach its corresponding photodiode at a time..."], "jumps": []}, {"id": "P2200", "text": ["The optical type of sensor, the LED/photodiode pair, consists of a light source (LED), a rotating disk (also known as a shutter), and a photodiode. The diodes convert light into data pulse. light into data pulse...."], "jumps": []}, {"id": "P2190", "text": ["Both optical and magnetic sensors are used to detect the rotor's position in a BLDC motor. The two most popular types of sensors are the LED/photodiode pair (optic) or the Hall-effect device (magnetic)..."], "jumps": []}, {"id": "P2180", "text": ["The BLDC motor uses sensors to determine the rotor position and speed. These sensors then generate signals that control the switching of the windings (commutation electronics)."], "jumps": []}, {"id": "P2170", "text": ["Of course, optimum BLDC construction is to use no more sensors and power semiconductors than necessary. Increasing the number of electronic elements increases the cost of the motor. Unnecessary electronic devices dramatically increase the cost without improving functionality..."], "jumps": []}, {"id": "P2160", "text": ["The current capability of the rotor position sensor circuits is limited. Therefore, power semiconductors are used to increase the small current output from the sensor circuits to the amount of current needed for the stator windings..."], "jumps": []}, {"id": "P2150", "text": ["As you can see, precision timing is necessary to keep the rotor moving smoothly. Rotor position sensor circuits track the rotor position and switch the power to the windings. As in any motor system, it takes a specific amount of current to generate a magnetic field strong enough to cause motor action..."], "jumps": []}, {"id": "P2140", "text": ["SEND PLAYANIMATION TO GROUP \"2140\" OF PAGE \"P2140\"", "To achieve a counterclockwise direction, S1 would be energized with a south magnetic field first, instead of S2 ..."], "jumps": []}, {"id": "P2130", "text": ["SEND PLAYANIMATION TO GROUP \"2130\" OF PAGE \"P2130\"", "De-energizing S2 and energizing S1 will keep the rotor moving in the clockwise direction....."], "jumps": []}, {"id": "P2120", "text": ["SEND PLAYANIMATION TO GROUP \"2120\" OF PAGE \"P2120\"", "SEND RESTOREANIMATION TO GROUP \"2120\" OF PAGE \"P2120\"", "Energizing S2 with a south magnetic field will repel the rotor's south field and attract its north field, causing the rotor to start revolving in a clockwise direction..."], "jumps": []}, {"id": "P2110", "text": ["At rest, the rotor's north magnetic field is pointed at stator winding S ."], "jumps": ["P2120", "P2100"]}, {"id": "P2100", "text": ["Now that we've identified the components of a BLDC system, let's look at how they work together. This simple 3-phase design best demonstrates the operation of the motor."], "jumps": []}, {"id": "P2090", "text": ["The BLDC uses angular position from a sensor array. Logic circuits determine the drive required to meet the commands coming from a host or user."], "jumps": ["P2080"]}, {"id": "P2080", "text": ["The second major difference between the two motors has to do with the shaft position sensor. The conventional DC motor uses a tachometer to indicate motor speed.."], "jumps": ["P2090"]}, {"id": "P2070", "text": ["BLDC motors reverse the DC motor operation: the magnet moves, not the windings."], "jumps": []}, {"id": "P2060", "text": ["The main difference between the two motors involves the positioning of the magnetic field that changes to control the rotation. Conventional DC motors vary the field in the armature (rotor) with the stator in a fixed position..."], "jumps": []}, {"id": "P2050", "text": ["Notice that the blocks perform similar functions, but the operational differences between the motors require different circuitry."], "jumps": []}, {"id": "P2040", "text": ["Let's examine the BLDC/conventional differences more closely. Compare the block diagrams below."], "jumps": []}, {"id": "P2030", "text": ["The basic electronics subsystem consists of four functional groups: Sensors, Motor Drive Circuit, Interface Circuit, and Microprocessor (or similar operational device)."], "jumps": []}, {"id": "P2020", "text": ["At this point, you know that the operation of BLDC motors is different from that of conventional DC motors. BLDC is digital friendly, and there are electronics involved. The electronics subsystems of the BLDC motor systems may be simple or complex..."], "jumps": ["P2001"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P1980", "text": ["7. BLDC motors are classified by type, category, and configuration.."], "jumps": []}, {"id": "P1970", "text": ["6. The Angular Acceleration Formula mathematically expresses the relationship of torque and rotational inertia. ( = angular acceleration T = torque I = rotational inertia"], "jumps": []}, {"id": "P1960", "text": ["5. Initial cost is the major disadvantage of BLDC motors. However, lower downtime and maintenance costs often prove them to be most cost-effective in the long run."], "jumps": []}, {"id": "P1950", "text": ["4. The advantages of BLDC motors over other DC types include, but are not limited to: eaner, cooler, and quieter operation Greater torque/lower rotational inertia Faster response time Greater reliability Higher durability Reduced maintenance time and trouble Lower overall long-term cost."], "jumps": []}, {"id": "P1940", "text": ["3. Heavy-duty motors are large regardless of the internal design. It is the application that drives the size of a DC motor, not the use or lack of brushes and commutator devices."], "jumps": []}, {"id": "P1930", "text": ["2. In a BLDC motor, the stator windings are situated on the outside surface of the case. The BLDC rotor is a permanent magnet, like the stator of a conventional DC motor."], "jumps": []}, {"id": "P1920", "text": ["P1910 Rotor Stator Commutation electronics (electronic switches and drivers) Rotor position sensors", "(\"P1910 Rotor Stator Commutation electronics (", "1. Brushes are not used with the commutator. The BLDC motor consists of four basic components::"], "jumps": ["P1910"]}, {"id": "P1910", "text": ["You have completed the lesson on Brushless DC Motor (BLDC) Characteristics."], "jumps": ["P1001", "P1620"]}, {"id": "P1620", "text": ["However, with optimum construction, the long-term cost for a BLDC motor is frequently less than that for a conventional DC motor, even if the initial investment is larger."], "jumps": []}, {"id": "P1610", "text": ["BLDC has not replaced many conventional PM type motors. An automobile starter, an application usually best suited to conventional DC motors, is an example of here-to-stay technology. Starter motors work for a long time in adverse environments, and they are relatively inexpensive..."], "jumps": ["P1600"]}, {"id": "P1603", "text": ["The most common integrated assembly application is for a fan, which rotates repeatedly through all 360 degrees."], "jumps": []}, {"id": "P1602", "text": ["Two-phase motors are 360-degree devices...................."], "jumps": []}, {"id": "P1601", "text": [], "jumps": []}, {"id": "P1600", "text": ["What BLDC motor application is best suited for small angular movements less than 360 degrees?"], "jumps": ["P1590"]}, {"id": "P1520", "text": ["An integrated assembly application that is used on millions of PCs all over the world is the muffin fan on the motherboard. Fans are the most common use of this application."], "jumps": []}, {"id": "P1510", "text": ["Medical and dental applications require special casings because the motors must be sterilized. In other words, the motor must be sealed. This requirement is perfect for BLDC applications because the motors may operate without cooling air..."], "jumps": []}, {"id": "P1500", "text": ["Commercial applications are used for kitchen appliances, automobile luxury features, powerboats, consumer entertainment products, and remote control hobbyists. These motors are lower cost because the application is much less stringent or demanding..."], "jumps": []}, {"id": "P1490", "text": ["High power applications start at about 500 pound-inches of torque and beyond. High power motors drive hoists, conveyor belts, and pumps."], "jumps": []}, {"id": "P1480", "text": ["More phases are associated with less power but higher precision."], "jumps": []}, {"id": "P1470", "text": ["The Two Phase and Three Phase motor applications are commonly used with 360 degree rotation requirements. High performance Three Phase motors are widely used and provide the smoothest acceleration for the cost..."], "jumps": []}, {"id": "P1460", "text": ["The One Phase motor, also called a Limited Angle Torque or LAT, only rotates a fraction of one full rotation. Scanners, cameras, precision gimbal systems, value controllers, transmissions, and aircraft use this motor application..."], "jumps": []}, {"id": "P1450", "text": ["High performance BLDC motors are further characterized by the phase of the motor (number of stator windings). These are: One Phase Two Phase Three Phase"], "jumps": []}, {"id": "P1440", "text": ["If the load is rigorous, demanding a high torque to inertia ratio and a duty cycle near 100%, a high performance motor is the solution."], "jumps": []}, {"id": "P1430", "text": ["High performance BLDC motor requirements may be satisfied by either industrial or miniature types. A pancake motor operating at 100,000 RPM is an example of a miniature high performance application..."], "jumps": []}, {"id": "P1420", "text": ["BLDC applications may be listed in 6 categories: High performance High power Commercial Medical and Dental Integrated Assembly Custom Design"], "jumps": []}, {"id": "P1410", "text": ["Miniature BLDC motors are widely used, in everything from remote control devices to computers. The hard drive in your computer has a high-speed BLDC motor driving it. Another term for miniature is pancake..."], "jumps": []}, {"id": "P1400", "text": ["BLDC motors are found in two general types: Industrial and Miniature. Industrial motors are large and have high torque and power ratings."], "jumps": []}, {"id": "P1390", "text": ["High torque and angular acceleration, along with the capability for continuous operation as well as low maintenance requirements, make this type of motor optimum for applications such as gyroscopes, CD ROM drives, and computer hard drives..."], "jumps": []}, {"id": "P1385", "text": ["BLDC Motors are much more complicated than Conventional DC Motors. The benefits outweigh the primary disadvantage of the BLDC Motor, higher cost, in some applications...e remains constant, rotational inertia decreases. The relationships and use captions of Direct Relationship And Inversely Proportional. 310666"], "jumps": []}, {"id": "P1380", "text": ["As you can see from the formula, if angular acceleration increases while rotational inertia remains constant, torque increases. If angular acceleration increases and torque remains constant, rotational inertia decreases. The relationships and use captions of Direct Relationship And Inversely Proportional. 310666"], "jumps": []}, {"id": "P1370", "text": ["The relationship of angular acceleration (a), torque ( T ), and rotational inertia ( I ) can be expressed mathematically by a formula."], "jumps": []}, {"id": "P1350", "text": ["The difference in momentum and inertia caused by the lower mass of the BLDC rotor allows the motor to reach operating speed faster and respond to changes in speed more quickly."], "jumps": []}, {"id": "P1340", "text": ["The list of advantages of BLDC over conventional motors continues. Without windings attached to the rotor of a BLDC motor, the weight and mass of the rotor is reduced."], "jumps": []}, {"id": "P1330", "text": ["Reduced friction allows increased acceleration, contributing as well to the other advantages of durability, cooler operation, and noiselessness."], "jumps": []}, {"id": "P1320", "text": ["Further advantages are derived from reduced friction. The brushes of DC series motors rub on the commutator to produce friction. In the BLDC motor, however, the only frictional forces are those that arise from the bearings. Conventional DC Motoral DC Motorrr"], "jumps": []}, {"id": "P1310", "text": ["No matter how small the generated spark might be, the end result is interference that could disrupt the operation of electronic equipment in close proximity to the motor. This hazard is avoided by BLDC technology..."], "jumps": []}, {"id": "P1300", "text": ["Radio frequency interference (RFI) is caused by the sparks that are produced when brushes contact the rotating commutator. At each instant that current begins to flow from the brush to the conductor segment, a spark is generated....."], "jumps": []}, {"id": "P1290", "text": ["In DC series motors, audible noise is produced when the brushes contact the conductor segments and the insulation surfaces of the commutator. The noise tends to increase as these surfaces exhibit wear at different rates. mmutator Segments Segment/Insulation Wear Conventional DC Motorrrrr"], "jumps": []}, {"id": "P1280", "text": ["There are two different kinds of noise avoided by BLDC motors: audible noise and radio frequency interference."], "jumps": []}, {"id": "P1250", "text": ["Not only are BLDC motors cooler and more durable than conventional motors, they are also quieter. Operation of these motors is relatively noise-free, as the interference caused by brushes contacting and sparking on the commutator is completely avoided..."], "jumps": []}, {"id": "P1240", "text": ["These factors of BLDC construction allow the motor to keep cool so that it can operate in a continuous mode for long periods of time."], "jumps": []}, {"id": "P1230", "text": ["In the BLDC motor, the permanent-magnet rotor does not generate heat. The current in the stator windings produces heat that is easily dissipated through the case."], "jumps": []}, {"id": "P1220", "text": ["In a conventional DC motor, heat generated in the rotor tends to build up until it is transferred to the stator, through the stator, and then to the cooler ambient air."], "jumps": []}, {"id": "P1210", "text": ["Conventional DC Motor Brushless DC Motor", "Besides eliminating excess heat from arcing, the BLDC construction facilitates rapid dissipation in another way. The stator is mounted on the surface of the case instead of being enclosed like the DC series motor. Conventional DC Motor Brushless DC Motorrr"], "jumps": []}, {"id": "P1200", "text": ["Without voltage leakage, there is no arcing between the commutator contacts and the brushes. Thus, excess heat is not generated to add to the dissipation demanded by the normal operation of current through the electromagnetic windings..."], "jumps": []}, {"id": "P1190", "text": ["BLDC motors are maintained at the stator, not the rotor. It is not normally necessary to pull a rotor on a BLDC motor."], "jumps": []}, {"id": "P1180", "text": ["Anyone who has disassembled a conventional DC motor understands the reduced maintenance advantage of the BLDC. The brushes produce black soot that seems to stick to everything it shouldn't, and the technician ends up looking like a coal miner..."], "jumps": []}, {"id": "P1170", "text": ["How does brushless make the difference? It's quite simple. There are no brushes to cause wear on a commutator or to wear out themselves. Parts that do not wear out do not produce conductive dust that must be removed to prevent voltage leakage paths..."], "jumps": []}, {"id": "P1160", "text": ["Characteristics of BLDC produce advantages over the DC series motors you've studied previously. Brushless translates into cleaner operation and lower maintenance, as well as increased reliability and longer life..."], "jumps": ["P1150"]}, {"id": "P1153", "text": ["The phase of a BLDC motor is not determined by the particular application that uses the motor."], "jumps": []}, {"id": "P1152", "text": ["The phase of a BLDC motor is not determined by the manufacturer's design revision level."], "jumps": []}, {"id": "P1151", "text": [], "jumps": []}, {"id": "P1150", "text": ["What determines the phase of a BLDC motor?.................", "The manufacturer's design revision level, which determines the position of the windings on the outside surface of the case.", "The particular application, which determines where the motor is used in the sequence of program operation.", "The number of windings, which determines the amount of control and therefore the smoothness of the rotation."], "jumps": ["P1140"]}, {"id": "P1140", "text": ["The casing protects the other subsystems from radio frequency interference (RFI), heat, light, moisture, or other unwanted external influence. The case bears the markings that identify the motor type, rating, manufacturing data, and other pertinent information. ----"], "jumps": []}, {"id": "P1130", "text": ["The rotor position sensors are used, as the name implies, to determine the position of the rotor in relation to the stator. Position information enables specific stator windings to be energized and meet the exact direction and speed of shaft rotation required..."], "jumps": []}, {"id": "P1120", "text": ["The third basic component of a BLDC motor involves the commutation electronics. Electronic switches power and rotate the magnetic field around the stator according to signals received from the sensors..."], "jumps": []}, {"id": "P1110", "text": ["Notice that the electrical components of the BLDC are located in the stator, where they are not only more accessible for examination and repair but they are also stationary. The conventional motor rotates the electrical components..."], "jumps": []}, {"id": "P1090", "text": ["The stator windings, which provide the rotational direction from the control system, are situated on the outside surface of the case. The number of windings, or phase, of the BLDC motor is a critical design characteristic. The more windings, the more control, and therefore, the smoother the rotation..."], "jumps": []}, {"id": "P1080", "text": ["The BLDC rotor is a permanent magnet, and, unlike its conventional counterpart, it is not slotted. In a kind of design reversal, the BLDC rotor appears more like the stator of a conventional DC motor..."], "jumps": []}, {"id": "P1070", "text": ["The BLDC motor consists of four basic components: Rotor Stator Commutation electronics (electronic switches and drivers) Rotor position sensors"], "jumps": []}, {"id": "P1060", "text": ["So far we've learned just the basics of BLDC construction: Brushes are not used with the commutator. Let's take a much closer look at the components that make this type of motor so useful. take a much closer look at the components that make this type of motor so useful. rier New Baltic;So far we've learned just the basics of BLDC construction: Brushes are not used with the commutator. Let's take a much closer look at the components that make this type of motor so useful."], "jumps": ["P1050"]}, {"id": "P1053", "text": ["While a higher load rating usually ensures a larger motor, not all conventional motors have higher load ratings than all BLDC motors."], "jumps": []}, {"id": "P1052", "text": ["BLDC motors do lack the bulky components, but conventional motors can also be quite small."], "jumps": []}, {"id": "P1051", "text": [], "jumps": []}, {"id": "P1050", "text": ["Why are BLDC motors characteristically smaller than their conventional permanent magnet DC motor counterparts?", "The BLDC lacks brushes and bulky commutator components.", "The conventional motor has higher load ratings in all instances.", "The BLDC is used in applications that require smaller dimensions."], "jumps": ["P1040"]}, {"id": "P1040", "text": ["Naturally, without the brushes, the internal space required is reduced. Therefore, BLDC may be seen as smaller overall. While this may often be the case, the characteristic of size is driven by the applications of BLDC, not by the design of the mechanical system..."], "jumps": []}, {"id": "P1030", "text": ["BLDC doesn't use brushes for commutation. Externally, the difference between a brushless DC motor and a conventional one may be difficult to ascertain, as the primary BLDC characteristics are internal to the motor case..."], "jumps": []}, {"id": "P1020", "text": ["You have already learned how a standard DC series motor works. As you certainly realize from the name BRUSHLESS DC motor, the topic of our study in this lesson involves a different construction..."], "jumps": ["P1001"]}, {"id": "P1001", "text": ["BRUSHLESS DC MOTOR (BLDC) CHARACTERISTICS"], "jumps": []}, {"id": "P900", "text": ["1. Brushless DC Motor (BLDC) Characteristics", "2. Brushless DC Motor (BLDC) Controllers"], "jumps": ["P440"]}, {"id": "P440", "text": ["Let's begin the lesson on BRUSHLESS DC MOTORS............................."], "jumps": []}, {"id": "P430", "text": ["BLDC is so common that you can't go anywhere in the civilized world without being exposed to the technology. Some people you meet even have BLDC in their bodies: pacemakers for heart rhythm manipulation and advanced prosthetic limbs use BLDC..."], "jumps": []}, {"id": "P420", "text": ["BLDC technology has both macro and micro applications; it is essential to high power servomotors as well as miniature drive mechanisms. The electronics are the same in everything from a heat-shielded module to a microchip, just scaled down or up depending on the purpose to be served..."], "jumps": []}, {"id": "P410", "text": ["Electronic control over mechanical functions has changed many fields. Industrial controls, aviation technology, marine engineering, weapons, communications - the list goes on and on. The backbone of this engineering science is the rotating machine (motor), and a particularly useful type is the brushless DC motor (BLDC)....."], "jumps": ["P400"]}, {"id": "P400", "text": ["You will find electronics in many more applications than thought possible just a few years ago. The use of electronics to control mechanical devices is a growing technology, now found in everything from toy automobiles to Mars exploration spacecraft..."], "jumps": ["P410", "P300"]}, {"id": "P300", "text": [], "jumps": []}, {"id": "P100", "text": ["1. Brushless DC Motor (BLDC) Characteristicse item 2 here. item 2 here.e.e.", "2. Brushless DC Motor (BLDC) Controllers line item 2 here. item 2 here.e.e.", "w Describe motor drive, position sensing, and other controller functions..", "w Identify the physical characteristics of BLDC motors. w Describe the advantages of BLDC over other types. w Understand basic BLDC types, applications, and configurations."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: BRUSHLESS DC MOTORSasdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ..........", "ImageMap hotspots can only be constructed using the following object types:", "Rectangle, Polygon, IrregularPolygon, Ellipse", "You have chosen to remove the image portion of the Image Map object.", "msgTxt = ASYM_GetString(\"OnlyDrawObjects\", \\", "\"ImageMap hotspots can only be constructed", "Rectangle, Polygon, IrregularPolygon, Ellipse\")", "SYSTEM s_ASYMI_ImageDir, s_ASYMI_CurrentBook", "getPixels((x2-x1) / 2 + x1,(y2-y1) / 2 + y1)", "\"You have successfully passed the assessment", "Are you sure you want to Bookmark the Lesson?", "Are you sure you want to Exit the Lesson?"], "jumps": ["P", "Py", "PK", "PPPPPPPPPPPPPPPP", "PP", "PW", "PPP"]}]};
let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
