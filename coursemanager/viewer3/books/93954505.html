const book = {"title": "93954505", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: 64 BIT MEMORY CIRCUITdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Predict outputs of a 64 bit memory circuit. w Probe the outputs of a 64 bit memory circuit. w Recognize normal operation of a 64 bit memory circuit.......", "w Identify the purpose of a 64 bit memory circuit. w Describe word, address, read, write, RAM, ROM, volatile and nonvolatile. w Recognize 64 bit memory circuits..."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "5. Nida Model 2100 Logic Probe or Equivalent"], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P335", "text": [], "jumps": []}, {"id": "P400", "text": ["Computer systems and other digital equipment have a need for permanent or temporary data storage."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["They require memory circuits that store programs and data for future processing."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Memory is a term used to describe the storage of data.  Some memories are small and others are very large.", "Memory devices range from punch cards to integrated circuits.", "Memory is a term used to describe the storage of data. Some memories are small and others are very large."], "jumps": ["P430", "P400", "P440"]}, {"id": "P440", "text": ["Large scale integration is used in producing memory circuits that store up to 16,000 bits of data."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["Let's begin the lesson on 64 BIT MEMORY CIRCUIT..........................."], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": ["P450"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The 64 bit memory IC is capable of storing 64 bits of data."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["As of this writing, memory IC's that can store up to 64M bytes\n(536,870,912 bits!) of information have been developed. This will likely increase as time goes by.", "As of this writing, memory IC's that can store up to 64M bytes (536,870,912 bits!) of information have been developed. This will likely increase as time goes by...."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Think of the 64 bit memory circuit as being sixteen, 4 bit registers contained in one IC."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Each register stores 4 bits of data.  The 4 bits contained in each register is called a WORD.", "Each register stores 4 bits of data. The 4 bits contained in each register is called a WORD."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["Digital circuits are designed to operate on 4, 8 or 16 bit words. Some systems use long-words that are 32 bits in length. A word is a group of bits representing a complete piece of digital information.", "Digital circuits are designed to operate on 4, 8 or 16 bit words. Some systems use long-words that are 32 bits in length. A word is a group of bits representing a complete piece of digital information. 10101010 = 8 bit word 1010101010101010 = 16 bit word", "1010 = 4 bit word 10101010 = 8 bit word 1010101010101010 = 16 bit word"], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["How many words are contained in an 8k, 4 bit word memory?", "How many words are contained in an 8k, 4 bit word memory?.."], "jumps": ["P1060", "P1075"]}, {"id": "P1071", "text": [], "jumps": []}, {"id": "P1072", "text": ["To find the number of words in a memory, divide the memory capacity by the number of bits in each word.", "Memory Capacity 8k = = ? # of Bits per word 4"], "jumps": []}, {"id": "P1075", "text": ["Total Capacity of Memory = # of Words # of Bits in each word", "64 BIT MEMORY CIRCUIT - A 64 bit memory circuit using 4 bit registers contains 16 words. A 64 bit memory circuit that uses 8 bit registers contains 8 words."], "jumps": []}, {"id": "P1080", "text": ["What is the memory capacity of a circuit that contains 2k, eight bit words?"], "jumps": ["P1070", "P1085"]}, {"id": "P1081", "text": [], "jumps": []}, {"id": "P1082", "text": ["To find the memory capacity, multiply the number of words by the number of bits in each word.", "# of words x # of bits per word = Memory Capacity 2k x 8 = ?"], "jumps": []}, {"id": "P1085", "text": ["Total Capacity of Memory x # of words = # of Bits in each word ?", "MEMORY CAPACITY - A Memory that contains 1k, 4 bit words has the capacity of 4k bits. A Memory that contains 1k, 8 bit words has the capacity of 8k bits."], "jumps": []}, {"id": "P1090", "text": ["Words are stored in memory and assigned an ADDRESS.  Each word has a different address.", "Words are stored in memory and assigned an ADDRESS. Each word has a different address."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["The address is used to store new data and to locate old data for transfer.", "A moving company locates your house by knowing the address."], "jumps": ["P1110", "P1090", "P1120", "P1100"]}, {"id": "P1120", "text": ["A memory circuit locates data by knowing the address."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["A memory circuit needs several register circuits to operate properly."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["The address register and memory address decoder work together in storing new data."], "jumps": ["P1145", "P1130"]}, {"id": "P1145", "text": ["Transferring of the address can be serial or parallel."], "jumps": ["P1130"]}, {"id": "P1150", "text": ["When new data enters memory, the address register assigns an address."], "jumps": ["P1145"]}, {"id": "P1160", "text": ["When data leaves memory, the address register knows where to find the data."], "jumps": ["P1170", "P1130"]}, {"id": "P1170", "text": ["The data register is used to hold data that is sent to or removed from memory. Transferring can be serial or parallel."], "jumps": ["P1180", "P1130"]}, {"id": "P1180", "text": ["The process of transferring data into memory is called WRITE."], "jumps": ["P1190", "P1130"]}, {"id": "P1190", "text": ["The process of transferring data out of memory is called READ."], "jumps": ["P1200", "P1130"]}, {"id": "P1200", "text": ["The 64 bit memory circuit simply stores the data until needed."], "jumps": ["P1210", "P1130"]}, {"id": "P1210", "text": ["There are two general types of memory.  Read Only Memories and Random Access Memories.", "There are two general types of memory. Read Only Memories and Random Access Memories.", "ROM Read Only Memory Read Only Memory 2k x 8 = ? 2k x 8 = ?", "RAM Random Access Memory Read Only Memory 2k x 8 = ? 2k x 8 = ?"], "jumps": ["P1220", "P1130"]}, {"id": "P1220", "text": ["ROMs are used in applications that require identical data every time a process occurs.", "ROM Read Only Memory Read Only Memory 2k x 8 = ? 2k x 8 = ?", "RAM Random Access Memory Read Only Memory 2k x 8 = ? 2k x 8 = ?"], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["For example, when some test equipment is turned on, a self test is performed."], "jumps": ["P1240", "P1210"]}, {"id": "P1240", "text": ["The test is always the same and the data needed to run the test is read from the memory."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["RAMs are used in applications that require information or instructions to go into and out of memory.", "ROM Read Only Memory Read Only Memory 2k x 8 = ? 2k x 8 = ?", "RAM Random Access Memory Read Only Memory 2k x 8 = ? 2k x 8 = ?"], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["For example, measuring current with a multimeter sends data to memory."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["The memory then sends data to the display to indicate the current."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["The writing to and reading from memory is called random access."], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["Non volatile memories retain data when power is removed.", "Non volatile memories retain data when power is removed...."], "jumps": ["P1300", "P1260"]}, {"id": "P1300", "text": ["Volatile memories allow data to be stored when power is applied."], "jumps": ["P1290"]}, {"id": "P1310", "text": ["When power is removed all data in memory is lost.", "When power is removed all data in memory is lost..........."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["What is the process called that loads data into memory?", "What is the process called that loads data into memory?...."], "jumps": ["P1300"]}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1322", "text": ["The transferring of data from memory to the data register is called read."], "jumps": []}, {"id": "P1323", "text": ["The location in memory that data is read from or written to is selected by the address."], "jumps": []}, {"id": "P1330", "text": ["What is the process called that transfers data out of memory?"], "jumps": ["P1320"]}, {"id": "P1331", "text": [], "jumps": []}, {"id": "P1332", "text": ["To select a location in memory where data is read from or written to is called address."], "jumps": []}, {"id": "P1333", "text": ["The transferring of data from the data register to memory is called write."], "jumps": []}, {"id": "P1340", "text": ["Which memory can only be read?", "Which memory can only be read?ped.........................."], "jumps": ["P1330"]}, {"id": "P1341", "text": [], "jumps": []}, {"id": "P1342", "text": ["RAM memory can be read from and written to.  RAM means random access memory.", "RAM memory can be read from and written to. RAM means random access memory."], "jumps": []}, {"id": "P1343", "text": ["Volatile memory means that the data is lost once power is removed."], "jumps": []}, {"id": "P1350", "text": ["Now, let's see how the memory address decoder selects the location of data."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["In this circuit, a two bit register can address four memory locations."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["With 00 in the address register, gate 1 has a high output which enables word 0."], "jumps": ["P1380", "P1350"]}, {"id": "P1380", "text": ["The load input is needed for RAM.  If the LOAD input is true, data will transfer from the data register to word 0.", "The load input is needed for RAM. If the LOAD input is true, data will transfer from the data register to word 0."], "jumps": ["P1390", "P1350"]}, {"id": "P1390", "text": ["The data 1010 is written into word 0."], "jumps": ["P1400", "P1350"]}, {"id": "P1400", "text": ["With 01 in the address register, gate 2 has a high output which enables word 1."], "jumps": ["P1410", "P1350"]}, {"id": "P1410", "text": ["If the LOAD input is true, data will transfer from the data register to word 1."], "jumps": ["P1420", "P1350"]}, {"id": "P1420", "text": ["The data 1111 is written into word 1."], "jumps": ["P1430", "P1350"]}, {"id": "P1430", "text": ["With 10 in the address register, gate 3 has a high output which enables word 2."], "jumps": ["P1440", "P1350"]}, {"id": "P1440", "text": ["If the LOAD input is false, data will transfer from memory word 2 to the data register."], "jumps": ["P1450", "P1350"]}, {"id": "P1450", "text": ["The data 0010 is read from memory word 2."], "jumps": ["P1460", "P1350"]}, {"id": "P1460", "text": ["With 11 in the address register, gate 4 has a high output which enables word 3."], "jumps": ["P1470", "P1350"]}, {"id": "P1470", "text": ["If the LOAD input is false, data will transfer from memory word 3 to the data register."], "jumps": ["P1480", "P1350"]}, {"id": "P1480", "text": ["The data 0011 is read from memory word 3."], "jumps": ["P1490", "P1350"]}, {"id": "P1490", "text": ["Read Only Memories (ROM) do not need a load input.  Data is only READ from memory.", "Read Only Memories (ROM) do not need a load input. Data is only READ from memory."], "jumps": ["P1910", "P1350"]}, {"id": "P1910", "text": ["This completes the information on MEMORY CIRCUIT.", "This completes the information on MEMORY CIRCUIT.LE........"], "jumps": ["P1001", "P1490"]}, {"id": "P1920", "text": ["1.  Memory is a generic term for the storage of large amounts of         data.", "1. Memory is a generic term for the storage of large amounts of data."], "jumps": ["P1922", "P1001"]}, {"id": "P1922", "text": ["2.  Using large scale integration, IC memory circuits store up to          64M bytes (512,000,000 bits) of data, presently.", "2. Using large scale integration, IC memory circuits store up to 64M bytes (512,000,000 bits) of data, presently."], "jumps": ["P1930", "P1920"]}, {"id": "P1930", "text": ["3.  WORD       - A group of bits representing a complete piece of                                digital information.  \n4. ADDRESS - The location of a given word in memory.", "3. WORD - A group of bits representing a complete piece of digital information. 4. ADDRESS - The location of a given word in memory."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["5.  WRITE - The process of storing information in memory.  \n6.  READ  - The process of retrieving information from memory.", "5. WRITE - The process of storing information in memory. 6. READ - The process of retrieving information from memory.."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["7.  RAM                    - Read/Write Memory  \n  8.  ROM                    - Read Only Memory \n  9.  VOLATILE          - Data is LOST when power is removed.  \n10.  NONVOLATILE - Data is RETAINED when power is removed.", "7. RAM - Read/Write Memory 8. ROM - Read Only Memory 9. VOLATILE - Data is LOST when power is removed. 10. NONVOLATILE - Data is RETAINED when power is removed..."], "jumps": ["P1999", "P1940"]}, {"id": "P1999", "text": ["You have completed the Summary.  You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1950"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["This experiment demonstrates the operation of a 64 bit memory circuit.  You will enter data and probe the outputs of the memory to verify correct operation.", "This experiment demonstrates the operation of a 64 bit memory circuit. You will enter data and probe the outputs of the memory to verify correct operation.-"], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["Pick up the PC130-126 card.  The purpose of this card is to demonstrate the address, write and read operations of a 64 bit memory circuit.", "Pick up the PC130-126 card. The purpose of this card is to demonstrate the address, write and read operations of a 64 bit memory circuit."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["The COUNTER IC is the address register.  Sixteen words can be addressed by this binary counter IC.  S5 clears the contents of the counter.", "The COUNTER IC is the address register. Sixteen words can be addressed by this binary counter IC. S5 clears the contents of the counter."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["The REGISTER IC is the data register.  It uses asynchronous parallel inputs S1 through S4.  S7 clears the register.", "The REGISTER IC is the data register. It uses asynchronous parallel inputs S1 through S4. S7 clears the register."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["The MEMORY IC is a 64 bit memory that contains 16 four bit words."], "jumps": ["P2071", "P2040"]}, {"id": "P2071", "text": ["The SN7489N 64 Bit Memory IC is used because the outputs of the chip are inverted."], "jumps": ["P2072", "P2040"]}, {"id": "P2072", "text": ["If 0110 is stored at an address, the output data from that address is 1001."], "jumps": ["P2073", "P2040"]}, {"id": "P2073", "text": ["The output data LEDs are LOW activated.  Therefore, a low output of the chip will illuminate the LED.", "The output data LEDs are LOW activated. Therefore, a low output of the chip will illuminate the LED."], "jumps": ["P2074", "P2040"]}, {"id": "P2074", "text": ["Notice the output LEDs indicate the data that was entered into the memory."], "jumps": ["P2076", "P2040"]}, {"id": "P2076", "text": ["The output of the memory is not fed to the data register on this card.  S6 enables loading.  Let's start the experiment.", "The output of the memory is not fed to the data register on this card. S6 enables loading. Let's start the experiment."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2040"]}, {"id": "P2090", "text": ["2.  Set the Voltmeter Switch to Positive.  \n3.  Set the Positive Supply Voltage to 5. The Test Console's                 Voltage Meter should indicate 5 volts.", "2. Set the Voltmeter Switch to Positive. 3. Set the Positive Supply Voltage to 5. The Test Console's Voltage Meter should indicate 5 volts. SCAN FCC 0 External program = SCAN PWR 0 12"], "jumps": ["P2080"]}, {"id": "P2100", "text": ["4.  Carefully plug PC130-111 into the Test Console PC1 position.  5.  Carefully plug PC130-126 into the Test Console PC2 position.", "4. Carefully plug PC130-111 into the Test Console PC1 position. 5. Carefully plug PC130-126 into the Test Console PC2 position. External program = SCAN FTR 0 C1 00..................."], "jumps": ["P2090"]}, {"id": "P2110", "text": ["6.  Set S2 to PULSER on PC130-111.  \n7.  Connect the Logic Probe to PC130-111.", "6. Set S2 to PULSER on PC130-111. 7. Connect the Logic Probe to PC130-111."], "jumps": ["P2120", "P2100", "P2115"]}, {"id": "P2115", "text": [], "jumps": []}, {"id": "P2120", "text": ["8.  Set PC1 and PC2 DC switches to ON.", "8. Set PC1 and PC2 DC switches to ON. to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2110"]}, {"id": "P2130", "text": ["9.  Press and release S5 and S7 on PC130-126.  The 4 yellow               counter and 4 red register output LEDs should be OFF.  The 4       red memory output LEDs will display the contents of the                 memory at location 0000.", "9. Press and release S5 and S7 on PC130-126. The 4 yellow counter and 4 red register output LEDs should be OFF. The 4 red memory output LEDs will display the contents of the memory at location 0000..."], "jumps": ["P2140", "P2120", "P2135"]}, {"id": "P2135", "text": ["MEASUREMENT SETUP - If the counter and register LEDs are not OFF, check:", "- PC130-111 in PC1, PC130-126 in PC2 - S2 set to PULSER on PC130-111 - S5 and S7 pressed and released on PC130-126 6 = ?"], "jumps": []}, {"id": "P2140", "text": ["The experiment is now set up.  Let's verify the write operations of the memory circuit.", "The experiment is now set up. Let's verify the write operations of the memory circuit."], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["1.  Load the data regist let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
