"P440", "text": ["There are many types of multivibrators, but they all operate on the principle that transistors can be either in cutoff or in saturation.", "There are many types of multivibrators, but they all operate on the principle that transistors can be either in cutoff or in saturation.."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["Let's begin the lesson on INTRODUCTION TO MULTIVIBRATOR CIRCUITS............"], "jumps": ["P440"]}, {"id": "P900", "text": [], "jumps": ["P450"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Multivibrators are devices that convert DC energy into square wave energy.", "'}:5 t0H( 9E}A9As5/GA}A;aEAA}EAKE;AAaAE;A}AEAU;aA};aEAEA;EAAAEA;E;AaA", "EUaa 555G7EEEa::Ts1TA;;AA;EEA;AAa9:AAE;E;;;UaAA;AEEA;aA};AA9aAA}}};E;AA9E}9AA;}AAEaaA;AEAEaAAEEaAAA9EEAAA}EAE;aEEEAU;EE;Ea;}", "EK,,L17;UT9;EK;,=17=9EK;AaTs a7(aEAEas5:9<5", "mzF(tt-FsFF-cmzssttst|t--yTmVstys|tytts sm t syst", ";EaTTy55F }Aaas= yjm;AEEAA T_}zc(GGFGVVVccVcVVlllGLVs-FFccclFm--jz5(-VFzmmm(ctmmlmzzzFFFFFzmmmctmFmsmmtcVmt5mzzl-zFmmFmtz", "KT[Qa9mFKKaa 5TL:EAa95 |9/:}EAEAALA_l>lz(lllFmV-V/czzFzFz/cVmcc--F(GlzFVllWmzzm(mzm(FzmpcF(zmFlzFmmlz-llplcmV-z-mcjsFV`zltmlzFVz-tVczFFtcmVmzlFz(mmzFmzFzmFl/VtmtVFmzmVcmmsVccFtsmmmmFFysGsV", "}9}AAK,,KKK/>V;U9a;EE;KTfV=:lFE;AaTTssc AA :: :9W5EAEEA-Es.>i?fodfi..r.l`(zlVclmlFzljlm", "K,EKK71CA;TU9;EKK:/H:ajlEaaaTa :G Eaa9sya9W", "iid>?>>viijVjcFGfmsG5ssTy|ymssmV5|Hsy5ysTTVsytmmV|t=sm55ms5VLmsH5sGc5m5m=VmmVmmmGmtymmls5j5mmmFV5spcmmmmV5mtt5Gmmmltsmmlmsmy5T5mssQtysFssmmmsmmtsmtsymmtss myy|s5|T5|ystsHa|s|", ",K,KK,,E,,E',EK'5@P=;''aaaT55 5GT;aA9AAOA;AA;AA:;Aa'", "aA 999a9=9}A:aa9=9aA 59O9a::A T:T:a: a=: } - aaaT :AA55:9:aa=Ta A::a aaa=:}AA } A"], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["The value of the components in the multivibrator circuit determine the square wave output frequency."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Frequencies range from a few hertz to hundreds of mega hertz."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Multivibrators use two transistor amplifiers."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["The transistors are biased so that they are either in cutoff or saturation and never operate between these two points."], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["When discussing multivibrators, a transistor is said to be ON when in saturation and OFF when in cutoff."], "jumps": ["P1090", "P1020"]}, {"id": "P1090", "text": ["A feedback circuit is added that controls which transistor is ON and which transistor is OFF."], "jumps": ["P1100", "P1020"]}, {"id": "P1100", "text": ["When Q1 is in ON, Q2 is OFF.", "When Q1 is in ON, Q2 is OFF. TE: IS THIS SUPPOSED TO READ \"Q1 is in ON\"? ************** (Take out note...)))"], "jumps": ["P1110", "P1020"]}, {"id": "P1110", "text": ["When Q1 is OFF, Q2 is ON."], "jumps": ["P1120", "P1020"]}, {"id": "P1120", "text": ["The output is taken from the collector of one of the transistors."], "jumps": ["P1130", "P1020"]}, {"id": "P1130", "text": ["When the transistor is OFF (cutoff), no current flows from emitter to collector.  The output voltage is Vcc.", "When the transistor is OFF (cutoff), no current flows from emitter to collector. The output voltage is Vcc.", "When the transistor is OFF (cutoff), no current flows from collector to emitter. The output voltage is Vcc."], "jumps": ["P1140", "P1020", "P1135"]}, {"id": "P1135", "text": ["TRANSISTOR IN CUTOFF - When a transistor is in cutoff, it acts like an open circuit. The output voltage is approximately Vcc."], "jumps": []}, {"id": "P1140", "text": ["When the transistor is ON (saturation), maximum current flows from emitter to collector.  The output voltage is 0.", "When the transistor is ON (saturation), maximum current flows from emitter to collector. The output voltage is 0.", "When the transistor is ON (saturation), maximum current flows from collector to emitter. The output voltage is 0."], "jumps": ["P1150", "P1130", "P1145"]}, {"id": "P1142", "text": ["When the transistor is ON (saturation), maximum current flows from emitter to collector.  The output voltage is 0.", "When the transistor is ON (saturation), maximum current flows from emitter to collector. The output voltage is 0.", "When the transistor is ON (saturation), maximum current flows from collector to emitter. The output voltage is 0."], "jumps": ["P1150", "P1130", "P1145"]}, {"id": "P1145", "text": ["TRANSISTOR IN SATURATION - When a transistor is in saturation, it acts like a short circuit. All of Vcc is dropped across the collector load resistor."], "jumps": []}, {"id": "P1150", "text": ["When the feedback circuit forces Q2 OFF, the output voltage is Vcc or high.  This is the positive peak of the square wave.", "When the feedback circuit forces Q2 OFF, the output voltage is Vcc or high. This is the positive peak of the square wave."], "jumps": ["P1160", "P1142"]}, {"id": "P1160", "text": ["When the feedback circuit forces Q2 ON, the output voltage is 0 or low.  This is the negative peak of the square wave.", "When the feedback circuit forces Q2 ON, the output voltage is 0 or low. This is the negative peak of the square wave."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["The frequency of the output square wave depends on how fast the feedback circuit forces the transistors to switch from ON to OFF."], "jumps": ["P1180", "P1150"]}, {"id": "P1180", "text": ["Component values in the feedback circuit determine the speed of switching."], "jumps": ["P1190", "P1150"]}, {"id": "P1190", "text": ["Note that the output can be on either Q2 or Q1.  Normally, multivibrators have connections for both outputs.", "Note that the output can be on either Q2 or Q1. Normally, multivibrators have connections for both outputs."], "jumps": ["P1200", "P1150"]}, {"id": "P1200", "text": ["The only difference in the two outputs is that they are 180\u00ba out of phase.", "The only difference in the two outputs is that they are 180"], "jumps": ["P1210", "P1150", "P1205"]}, {"id": "P1202", "text": ["The only difference in the two outputs is that they are 180\u00ba out of phase.", "The only difference in the two outputs is that they are 180"], "jumps": ["P1210", "P1150", "P1205"]}, {"id": "P1205", "text": ["OUT OF PHASE OUTPUTS - The outputs are out of phase because when Q1is ON (low output) Q2 is OFF (high output), and when Q1 is OFF (high output) Q2 is ON (low output)."], "jumps": []}, {"id": "P1210", "text": ["Multivibrators produce what type of output waveform?", "Multivibrators produce what type of output waveform?......."], "jumps": ["P1202"]}, {"id": "P1211", "text": [], "jumps": ["P1210"]}, {"id": "P1212", "text": ["The output of a multivibrator is either Vcc (transistor OFF) or 0 (transistor ON). This does not produce a sine wave output.", "The output of a multivibrator is either Vcc (transistor OFF) or 0 (transistor ON). This does not produce a sine wave output.I"], "jumps": ["P1210"]}, {"id": "P1213", "text": ["The output of a multivibrator is either Vcc (transistor OFF) or 0 (transistor ON). This does not produce a triangle output."], "jumps": ["P1210"]}, {"id": "P1220", "text": ["The output of a multivibrator is 0 when the output transistor is"], "jumps": ["P1210"]}, {"id": "P1221", "text": [], "jumps": ["P1220"]}, {"id": "P1222", "text": ["When a transistor is OFF, it is in cutoff and acts like an open circuit.  The output voltage is Vcc.", "When a transistor is OFF, it is in cutoff and acts like an open circuit. The output voltage is Vcc."], "jumps": ["P1220"]}, {"id": "P1230", "text": ["There are two general categories of multivibrators.  \n                                         1.  Free-Running  \n                                         2.  Triggered", "There are two general categories of multivibrators. 1. Free-Running 2. Triggered"], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["Free-running multivibrators generate square wave outputs as soon as power is applied. \n                                                 Free-Running", "Free-running multivibrators generate square wave outputs as soon as power is applied. Free-Running"], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["As long as the DC operating voltage is present, the feedback circuit switches the transistors between ON and OFF."], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["Triggered multivibrators only produce a square wave output when an external input is applied.  \n                                                   Triggered", "Triggered multivibrators only produce a square wave output when an external input is applied. Triggered"], "jumps": ["P1270", "P1230"]}, {"id": "P1270", "text": ["The feedback circuit only switches the transistors between ON and OFF on an input pulse."], "jumps": ["P1280", "P1230"]}, {"id": "P1280", "text": ["Remember, the square wave is produced by the action of a transistor at cutoff and saturation.  The feedback circuit controls that action.", "Remember, the square wave is produced by the action of a transistor at cutoff and saturation. The feedback circuit controls that action."], "jumps": ["P1910", "P1230"]}, {"id": "P1910", "text": ["This completes the information on MULTIVIBRATOR.", "This completes the information on MULTIVIBRATOR.TLE........"], "jumps": ["P1001", "P1230"]}, {"id": "P1920", "text": ["1.  Multivibrators change a DC operating voltage to a square               wave.", "1. Multivibrators change a DC operating voltage to a square wave."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Multivibrators use two transistor amplifiers and a feedback             circuit.", "2. Multivibrators use two transistor amplifiers and a feedback circuit.."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The feedback circuit controls the switching of each transistor        from ON to OFF.", "3. The feedback circuit controls the switching of each transistor from ON to OFF."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  The output is taken from the collector of the transistors.", "4. The output is taken from the collector of the transistors."], "jumps": ["P1960", "P1930"]}, {"id": "P1960", "text": ["5.  The output can be taken from either transistor.", "5. The output can be taken from either transistor."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  The two general categories of multivibrators are Free-running       and Triggered.", "6. The two general categories of multivibrators are Free-running and Triggered."], "jumps": ["P1999", "P1950"]}, {"id": "P1999", "text": ["You have completed the Summary.  You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1970"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["Multivibrators are classified according to the number of stable states that are produced by the feedback circuit."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["A stable state is a steady condition."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["A multivibrator that has no stable state is free running.  They are called ASTABLE.", "A multivibrator that has no stable state is free running. They are called ASTABLE."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["When power is applied, Q1 and Q2 switch back and forth between ON and OFF, no steady state condition."], "jumps": ["P2060", "P2020"]}, {"id": "P2060", "text": ["A multivibrator that has one steady condition is called MONOSTABLE."], "jumps": ["P2070", "P2020"]}, {"id": "P2070", "text": ["When power is applied, Q2 is ON and remains ON (Q1 is OFF).  It is a triggered multivibrator.", "When power is applied, Q2 is ON and remains ON (Q1 is OFF). It is a triggered multivibrator."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["An input pulse causes Q2 to turn OFF and Q1 to turn ON."], "jumps": ["P2090", "P2060"]}, {"id": "P2090", "text": ["After the input pulse is gone, the multivibrator returns to its one steady state condition, Q2 ON."], "jumps": ["P2100", "P2060"]}, {"id": "P2100", "text": ["A multivibrator that has two steady conditions is called BISTABLE."], "jumps": ["P2110", "P2060"]}, {"id": "P2110", "text": ["When power is applied assume Q2 is ON and remains ON.  It is also a triggered multivibrator.", "When power is applied assume Q2 is ON and remains ON. It is also a triggered multivibrator.", "When power is applied, Q1 or Q2 can be ON. However, the operation remains the same..."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["An input pulse causes Q2 to turn OFF and Q1 to turn ON."], "jumps": ["P2130", "P2100"]}, {"id": "P2130", "text": ["However, after the input pulse  is gone, Q1 remains ON.  It stays in its second stable state condition.", "However, after the input pulse is gone, Q1 remains ON. It stays in its second stable state condition."], "jumps": ["P2140", "P2100"]}, {"id": "P2140", "text": ["A second input pulse causes Q1 to turn OFF and Q2 to turn ON."], "jumps": ["P2150", "P2100"]}, {"id": "P2150", "text": ["After the second input pulse is gone, Q2 remains ON.  It stays in its first stable state condition.", "After the second input pulse is gone, Q2 remains ON. It stays in its first stable state condition."], "jumps": ["P2160", "P2100"]}, {"id": "P2160", "text": ["Determining if a multivibrator is astable, monostable or bistable depends on the components in the feedback circuit."], "jumps": ["P2170", "P2100"]}, {"id": "P2170", "text": ["How many stable states does a monostable multivibrator have?"], "jumps": ["P2100"]}, {"id": "P2171", "text": [], "jumps": ["P2170"]}, {"id": "P2172", "text": ["An astable multivibrator has no stable states.", "An astable multivibrator has no stable states.............."], "jumps": ["P2170"]}, {"id": "P2173", "text": ["A bistable multivibrator has two stable states.", "A bistable multivibrator has two stable states............."], "jumps": ["P2170"]}, {"id": "P2180", "text": ["Which multivibrator is free running?", "Which multivibrator is free running?......................."], "jumps": ["P2170"]}, {"id": "P2181", "text": [], "jumps": ["P2180"]}, {"id": "P2182", "text": ["A monostable multivibrator has one stable state.  It is not free running.", "A monostable multivibrator has one stable state. It is not free running."], "jumps": ["P2180"]}, {"id": "P2183", "text": ["A bistable multivibrator has two stable states.  It is not free running.", "A bistable multivibrator has two stable states. It is not free running."], "jumps": ["P2180"]}, {"id": "P2190", "text": ["The type of multivibrator is easily identified by the components used in the feedback circuit.  \n                        Astable          Monostable          Bistable", "The type of multivibrator is easily identified by the components used in the feedback circuit. Astable Monostable Bistable"], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["Let's look at the feedback circuit of an astable multivibrator first.                                                     Astable", "Let's look at the feedback circuit of an astable multivibrator first. Astable"], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["An astable multivibrator uses two capacitors in the feedback circuit."], "jumps": ["P2220", "P2190"]}, {"id": "P2220", "text": ["The output of Q1 is fed back through one capacitor to the input of Q2."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["The output of Q2 is fed back through the other capacitor to the      input of Q1.", "The output of Q2 is fed back through the other capacitor to the input of Q1..."], "jumps": ["P2240", "P2210"]}, {"id": "P2240", "text": ["The charging and discharging of the two capacitors causes the two transistors to continually switch back and forth between ON and OFF."], "jumps": ["P2250", "P2210"]}, {"id": "P2250", "text": ["Next, let's look at a monostable multivibrator feedback circuit. \n                                                Monostable", "Next, let's look at a monostable multivibrator feedback circuit. Monostable"], "jumps": ["P2260", "P2210"]}, {"id": "P2260", "text": ["A monostable multivibrator uses one capacitor and one resistor in the feedback circuit."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["The output of Q1 is fed back through the capacitor to the input of Q2."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["The output of Q2 is fed back through the resistor to the input of Q1."], "jumps": ["P2290", "P2260"]}, {"id": "P2290", "text": ["The trigger input is applied to the input of Q1."], "jumps": ["P2300", "P2260"]}, {"id": "P2300", "text": ["The charging and discharging of the capacitor on the output of Q1 is coupled to the input of Q2, unless Q1 has an input pulse applied. The resistor on the input of Q2 provides bias voltage to keep Q2 ON..ied......."], "jumps": ["P2310", "P2260"]}, {"id": "P2310", "text": ["Last, let's look at a bistable multivibrator feedback circuit.  \n                                                  Bistable", "Last, let's look at a bistable multivibrator feedback circuit. Bistable"], "jumps": ["P2320", "P2260"]}, {"id": "P2320", "text": ["A bistable multivibrator uses two capacitors and two resistors in the feedback circuit."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["The output of Q1 is fed back through the parallel capacitor and resistor to the input of Q2."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["The output of Q2 is fed back through the other parallel capacitor and resistor to the input of Q1."], "jumps": ["P2350", "P2320"]}, {"id": "P2350", "text": ["The trigger input is applied to the inputs of both Q1 and Q2."], "jumps": ["P2360", "P2320"]}, {"id": "P2360", "text": ["The feedback circuit keeps each transistor in one state until an input pulse changes them."], "jumps": ["P2370", "P2320 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
