const book = {"title": "9395N206", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: MATH INSTRUCTIONSf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Understand the concepts of math instructions. w Describe the operation of math instructions.", "w Demonstrate the usage of math instructions using Allen Bradely APS software.....re.", "w Demonstrate the usage of math instructions using Rockwell RSLOGIX software.....software.1"], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P310", "text": [], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, we will look at the operation and usage of math instructions. Math instructions allow you to manipulate data in the PLC memory.", "ADD - ADD SUB - SUBTRACT MUL - MULTIPLY DIV - DIVIDE DDV - DOUBLE DIVIDE NEG - NEGATE CLR - CLEAR TOD - CONVERT TO BCD FRD - CONVERT FROM BCD DCD - DECODE 4 TO 1 OF 16 SQR - SQUARE ROOT SCL - SCALE DATA", "ADD SUBTRACT MULTIPLY DIVIDE DOUBLE DIVIDE NEGATE CLEAR CONVERT TO BCD CONVERT FROM BCD DECODE 4 TO 1 OF 16 SQUARE ROOT SCALE DATAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "0000 0000000000000001 0001 0000000000000010 0010 0000000000000100 0011 0000000000001000 0100 0000000000010000 0101 0000000000100000 0110 0000000001000000 0111 0000000010000000 0000000010000000 0010000000"], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Math instructions include adding, subtracting, multiplying, and dividing, just to name a few. By manipulating data with these instructions, you can calculate many different things."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["In the experiment, you will enter a ladder logic program that demonstrates the operation of math instructions."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Let's begin the lesson on MATH INSTRUCTIONS..............................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": ["While obtaining data in a ladder logic program is important, the values you obtain may not directly tell you the information you would like to know."], "jumps": ["P1050", "P1001"]}, {"id": "P1050", "text": ["Some information may be acquired only by mathematical operation using the values obtained by the ladder logic program."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["Let's say you have a different sensor that returns the paint rate of flow from the nozzle. Now you can divide the number of triangles by the rate of paint flow to get a value that does not depend on paint rate........"], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["You can see how the other variables in the system affect the rate at which the triangles get painted."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["There are hundreds of different uses for the math instructions. The way they are used depends on the process you are writing ladder logic for and the data that you obtain."], "jumps": ["P1090", "P1040"]}, {"id": "P1090", "text": ["The list below shows all the math instructions that we will examine in this lesson. Notice that there are quite a few math instructions.", "ADD - ADD SUB - SUBTRACT MUL - MULTIPLY DIV - DIVIDE DDV - DOUBLE DIVIDE NEG - NEGATE CLR - CLEAR TOD - CONVERT TO BCD FRD - CONVERT FROM BCD DCD - DECODE 4 TO 1 OF 16 SQR - SQUARE ROOT SCL - SCALE DATA"], "jumps": ["P1100", "P1040"]}, {"id": "P1100", "text": ["The first instruction is the Add (ADD) instruction. This instruction requires three parameters: source A, source B, and a destination. Source A is added to source B and stored at the destination.....", "Carry ( C ) - High if carry, low otherwise Overflow ( V ) - Set if overflow, low otherwise Zero ( Z ) - Set if result is zero, low otherwise Sign ( S ) - Set if result is negative, low otherwise"], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["The sources contain the two values that will be added. One of these can be a permanent value that you have entered, known as a constant, but at least one of them must point to a data word in memory..."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["The destination is the location where you would like the result of the addition to be stored. This, too, must be a data word in memory."], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["Something that you may not have seen before are the arithmetic status bits. These are stored in the S data file. These bits are affected by many math instructions."], "jumps": ["P1140", "P1100"]}, {"id": "P1140", "text": ["The bits are used to inform you about the result of the operation that you performed, in this case, the addition instruction. The arithmetic status bits are Carry (C), Overflow (V), Zero (Z), and Sign (S)."], "jumps": ["P1150", "P1100"]}, {"id": "P1150", "text": ["A word is only 16 bits long. When the Add instruction is used, the result of adding two 16-bit numbers is often a 17 bit value. Since only 16 bits can be stored in the destination register, the PLC sets the carry bit high. If the result is only 16 bits, the PLC sets the carry bit to zero...", "Carry ( C ) - High if carry, low otherwise Overflow ( V ) - Set if overflow, low otherwise Zero ( Z ) - Set if result is zero, low otherwise Sign ( S ) - Set if result is negative, low otherwise"], "jumps": ["P1160", "P1100"]}, {"id": "P1160", "text": ["The next status bit is the overflow bit. The overflow bit is set when you add two positive or negative values which result in an incorrect value because it moved out of the allowable range.", "Carry ( C ) - High if carry, low otherwise Overflow ( V ) - Set if overflow, low otherwise Zero ( Z ) - Set if result is zero, low otherwise Sign ( S ) - Set if result is negative, low otherwise"], "jumps": ["P1170", "P1100"]}, {"id": "P1170", "text": ["The example below shows the overflow condition. Two positive values are added, and a negative value results. The range of an integer is -32,768 to 32,767. If added or subtracted numbers are outside that range, the overflow bit is set...", "If this Bit is High (set) it indicates Negative and causes overflow"], "jumps": ["P1180", "P1100"]}, {"id": "P1180", "text": ["Also, the PLC will place either -32,768 or 32,767 in the destination location, depending on which end of the range you overflowed."], "jumps": ["P1190", "P1100"]}, {"id": "P1190", "text": ["The next status bit is the zero bit. If the result of the addition is zero, this bit is set high. If the result of the addition is not zero, this bit is set low.", "Carry ( C ) - High if carry, low otherwise Overflow ( V ) - Set if overflow, low otherwise Zero ( Z ) - Set if result is zero, low otherwise Sign ( S ) - Set if result is negative, low otherwise"], "jumps": ["P1200", "P1100"]}, {"id": "P1200", "text": ["The last arithmetic status bit is the sign bit. This bit is set high if the result is a negative value, and it is set low if the result is a positive value.", "Carry ( C ) - High if carry, low otherwise Overflow ( V ) - Set if overflow, low otherwise Zero ( Z ) - Set if result is zero, low otherwise Sign ( S ) - Set if result is negative, low otherwise"], "jumps": ["P1210", "P1100"]}, {"id": "P1210", "text": ["The next instruction is the Subtract (SUB) instruction. This instruction requires the same parameters as the Add instruction. Source B is subtracted from source A and stored in the destination...", "Carry ( C ) - High if borrow, low otherwise Overflow ( V ) - Set if underflow, low otherwise Zero ( Z ) - Set if result is zero, low otherwise Sign ( S ) - Set if result is negative, low otherwise"], "jumps": ["P1220", "P1100"]}, {"id": "P1220", "text": ["The arithmetic status bits are set differently for the Subtract instruction. The carry bit is set high if the subtraction required a borrow from the 17 bit. If no borrow was required, this bit is set low......", "Carry ( C ) - High if borrow, low otherwise Overflow ( V ) - Set if underflow, low otherwise Zero ( Z ) - Set if result is zero, low otherwise Sign ( S ) - Set if result is negative, low otherwise"], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["The overflow bit actually indicates an underflow. This is the condition where subtracting two numbers goes out of the -32,768 to 32,767 range. If the subtraction result is outside this range, the overflow bit, representing an underflow, will be set...", "Carry ( C ) - High if borrow, low otherwise Overflow ( V ) - Set if underflow, low otherwise Zero ( Z ) - Set if result is zero, low otherwise Sign ( S ) - Set if result is negative, low otherwise"], "jumps": ["P1240", "P1210"]}, {"id": "P1240", "text": ["Also, depending on the side of the range you underflow, either -32,768 or 32,767 will be placed in the destination location."], "jumps": ["P1250", "P1210"]}, {"id": "P1250", "text": ["Both the zero and sign bits of the arithmetic status bits are set the same as they are with the Add instruction......", "Carry ( C ) - High if borrow, low otherwise Overflow ( V ) - Set if underflow, low otherwise Zero ( Z ) - Set if result is zero, low otherwise Sign ( S ) - Set if result is negative, low otherwise"], "jumps": ["P1260", "P1210"]}, {"id": "P1260", "text": ["This instruction is the Multiply (MUL) instruction, which requires the same parameters as the Add and Subtract instructions. Source A is multiplied by source B with the product placed in the destination and the Math Register...", "( S = 13 & S = 14 ) Contains 32 bit multiplication result", "Carry ( C ) - low Overflow ( V ) - Set if overflow, low otherwise Zero ( Z ) - Set if result is zero, low otherwise Sign ( S ) - Set if result is negative, low otherwiseeeeeeeeeeeeeeeeeeeeeeeeeee"], "jumps": ["P1270", "P1210"]}, {"id": "P1270", "text": ["The math register consists of two 16-bit words in the S data file. These two words make one 32-bit value. If an overflow occurs in the multiplication for the 16-bit destination, the correct 32-bit result will be in the math register...", "( S = 13 & S = 14 ) Contains 32 bit multiplication result"], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["The zero and sign bits work the same as in the previously described instructions. The carry bit is not used and is always cleared. The overflow bit operates the same as the previously described instructions; however, the correct result can still be obtained from the math register..", "Carry ( C ) - low Overflow ( V ) - Set if overflow, low otherwise Zero ( Z ) - Set if result is zero, low otherwise Sign ( S ) - Set if result is negative, low otherwiseeeeeeeeeeeeeeeeeeeeeeeeeeee"], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["This is the Divide (DIV) instruction. Source A is divided by source B with the result placed in the destination and the math register. In the destination, the result of the division is stored and rounded up if the remainder is greater than 0.5...", "( S = 13 & S = 14 ) S = 13 - Remainder S = 14 - Unrounded Result", "Carry ( C ) - low Overflow ( V ) - Set if overflow or divide by zero, low otherwise Zero ( Z ) - Set if result is zero, low otherwise, undefined on overflow Sign ( S ) - Set if result is negative, low otherwise, undefined on overflow"], "jumps": ["P1300", "P1260"]}, {"id": "P1300", "text": ["In the math register, the unrounded result is stored in the high word and the remainder is stored in the low word.", "( S = 13 & S = 14 ) S = 13 - Remainder S = 14 - Unrounded Result"], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["The carry bit is always set to zero. The overflow bit is set high if the result is outside the -32,768 to 32,767 range or if divide by zero occurs. Remember, math does not allow division by zero.", "Carry ( C ) - Zero Overflow ( V ) - Set if overflow or divide by zero, low otherwise Zero ( Z ) - Set if result is zero, low otherwise, undefined on overflow Sign ( S ) - Set if result is negative, low otherwise, undefined on overflow"], "jumps": ["P1320", "P1290"]}, {"id": "P1320", "text": ["The zero bit is set high if the result is zero, low if not zero, and undefined if an overflow occurs. Undefined means the value of this bit is unknown.", "Carry ( C ) - Zero Overflow ( V ) - Set if overflow or divide by zero, low otherwise Zero ( Z ) - Set if result is zero, low otherwise, undefined on overflow Sign ( S ) - Set if result is negative, low otherwise, undefined on overflow"], "jumps": ["P1330", "P1290"]}, {"id": "P1330", "text": ["The sign bit is set high if the result is negative, low if the result is positive, and, again, undefined if an overflow occurs.", "Carry ( C ) - Zero Overflow ( V ) - Set if overflow or divide by zero, low otherwise Zero ( Z ) - Set if result is zero, low otherwise, undefined on overflow Sign ( S ) - Set if result is negative, low otherwise, undefined on overflow"], "jumps": ["P1340", "P1290"]}, {"id": "P1340", "text": ["The next instruction is the Double Divide (DDV) instruction. This instruction allows you to divide bigger numbers by using the math register. When this instruction is executed, the entire math register is divided by the source in the instruction...", "( S = 13 & S = 14 ) S = 13 - Remainder S = 14 - Unrounded Result", "Carry ( C ) - Zero Overflow ( V ) - Set if overflow or divide by zero, low otherwise Zero ( Z ) - Set if result is zero, low otherwise Sign ( S ) - Set if result is negative, low otherwise, undefined on overflowwwwwwwwwwwwwwwwwwwwwwww"], "jumps": ["P1350", "P1290"]}, {"id": "P1350", "text": ["The result is placed in the destination and math register, just as it was with the other divide instruction.", "( S = 13 & S = 14 ) S = 13 - Remainder S = 14 - Unrounded Result"], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["The carry bit is always set to zero. Overflow is set high on divide by zero or a result that is outside the -32,768 to 32,767 range. The zero bit is high for a zero result and low otherwise. The sign bit is high for a negative result, low for positive result, and undefined if overflow is set...", "Carry ( C ) - Zero Overflow ( V ) - Set if overflow or divide by zero, low otherwise Zero ( Z ) - Set if result is zero, low otherwise Sign ( S ) - Set if result is negative, low otherwise, undefined on overflowwwwwwwwwwwwwwwwwwwwwwww"], "jumps": ["P1370", "P1340"]}, {"id": "P1370", "text": ["This is the Negate (NEG) instruction. This instruction is used to change the sign of the source and place it in the destination. The example below demonstrates this operation.", "Carry ( C ) - Set low if results is zero or overflow, high otherwise Overflow ( V ) - Set if overflow, low otherwise Zero ( Z ) - Set if result is zero, low otherwise Sign ( S ) - Set if result is negative, low otherwise, undefined on overflowwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww"], "jumps": ["P1380", "P1340"]}, {"id": "P1380", "text": ["The carry bit is set low if the result is zero or an overflow occurs; otherwise, it is set high. The overflow bit is set high if an overflow occurs as described earlier, and the value 32,767 is placed in the destination...", "Carry ( C ) - Set low if results is zero or overflow, high otherwise Overflow ( V ) - Set if overflow, low otherwise Zero ( Z ) - Set if result is zero, low otherwise Sign ( S ) - Set if result is negative, low otherwise, undefined on overflowwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww"], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["The zero bit is high for a zero result and low when not zero. The sign bit is high for a negative result and low for a positive result.", "Carry ( C ) - Set low if results is zero or overflow, high otherwise Overflow ( V ) - Set if overflow, low otherwise Zero ( Z ) - Set if result is zero, low otherwise Sign ( S ) - Set if result is negative, low otherwise, undefined on overflowwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww"], "jumps": ["P1400", "P1370"]}, {"id": "P1400", "text": ["Which instruction is used to divide the value in the math register by a source value and place the result in the math register and destination?"], "jumps": ["P1370"]}, {"id": "P1401", "text": [], "jumps": []}, {"id": "P1402", "text": ["Remember, it is the Double Divide instruction that is used to divide larger values stored in the 32-bit math register.", "( S = 13 & S = 14 ) S = 13 - Remainder S = 14 - Unrounded Result", "Carry ( C ) - Zero Overflow ( V ) - Set if overflow or divide by zero, low otherwise Zero ( Z ) - Set if result is zero, low otherwise Sign ( S ) - Set if result is negative, low otherwise, undefined on overflowwwwwwwwwwwwwwwwwwwwwwww"], "jumps": []}, {"id": "P1410", "text": ["The next instruction is the Clear (CLR) instruction. This is used to set a destination to zero. The only parameter for this instruction is the destination data location."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["When this instruction is evaluated, the carry bit, overflow bit, and sign bit are set low. The zero bit is set high."], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["The next two instructions convert decimal values stored in data files to or from binary coded decimal (BCD). As you may remember, BCD is just another way to encode data.", "ADD - ADD SUB - SUBTRACT MUL - MULTIPLY DIV - DIVIDE DDV - DOUBLE DIVIDE NEG - NEGATE CLR - CLEAR TOD - CONVERT TO BCD FRD - CONVERT FROM BCD DCD - DECODE 4 TO 1 OF 16 SQR - SQUARE ROOT SCL - SCALE DATA", "DECODE TABLE SOURCE DESTINATION 0000 0000000000000001 0001 0000000000000010 0010 0000000000000100 0011 0000000000001000 0100 0000000000010000 0101 0000000000100000 0110 0000000001000000 0111 0000000010000000"], "jumps": ["P1440", "P1410"]}, {"id": "P1440", "text": ["The PLC may obtain BCD data from an external device. This must be converted to decimal in order to perform other math operations on it. If you need to send the data back to the device, you may need the data to be in BCD format............"], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["This instruction is the Convert to BCD (TOD) instruction. This instruction requires a source and a destination. The example below illustrates a BCD conversion.", "0010 1101 Binary = 45 Decimal 45 Decimal = 0100 0101 BCD", "Carry ( C ) - Low Overflow ( V ) - Set if result is larger than 9999 Zero ( Z ) - Set if destination value is zero Sign ( S ) - Set if source is negative, low otherwiseeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee, undefined on overflowwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww"], "jumps": ["P1460", "P1430"]}, {"id": "P1460", "text": ["The carry bit is always set low. The overflow bit is set high if the converted BCD value is greater than 9999; otherwise, it is set low. The zero bit is set high if the result is zero and set low otherwise...", "Carry ( C ) - Low Overflow ( V ) - Set if result is larger than 9999 Zero ( Z ) - Set if destination value is zero Sign ( S ) - Set if source is negative, low otherwiseeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee, undefined on overflowwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww"], "jumps": ["P1470", "P1450"]}, {"id": "P1470", "text": ["The sign bit is set high if the source is negative and low if the source is positive. Notice that it is the source that is being checked, not the result.", "Carry ( C ) - Low Overflow ( V ) - Set if result is larger than 9999 Zero ( Z ) - Set if destination value is zero Sign ( S ) - Set if source is negative, low otherwiseeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee, undefined on overflowwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww"], "jumps": ["P1480", "P1450"]}, {"id": "P1480", "text": ["If you use the math register as the destination, you can convert into a 5-digit BCD value. The overflow bit will still be set high.", "0010 1101 Binary = 45 Decimal 45 Decimal = 0100 0101 BCD"], "jumps": ["P1490", "P1450"]}, {"id": "P1490", "text": ["This instruction is the Convert from BCD (FRD) instruction. This instruction will convert a BCD value to a decimal value. A source and a destination are required..............", "Carry ( C ) - Low Overflow ( V ) - Set if result is not BCD or overflow Zero ( Z ) - Set if result is zero,low otherwise Sign ( S ) - Low if source is negative, low otherwiseeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee, undefined on overflowwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww", "Carry ( C ) - Low Overflow ( V ) - Set if result is not BCD or overflow Zero ( Z ) - Set if result is zero,low otherwise Sign ( S ) - Low"], "jumps": ["P1500", "P1450"]}, {"id": "P1500", "text": ["If the math register is used as the source, a five-digit BCD value can be converted; otherwise, only a four-digital BCD value can be converted.", "Carry ( C ) - Low Overflow ( V ) - Set if result is not BCD or overflow Zero ( Z ) - Set if result is zero,low otherwise Sign ( S ) - Low", "Carry ( C ) - Low Overflow ( V ) - Set if result is not BCD or overflow Zero ( Z ) - Set if result is zero,low otherwise Sign ( S ) - Low if source is negative, low otherwiseeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee, undefined on overflowwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww", "0010 1101 Binary = 45 Decimal 45 Decimal = 0100 0101 BCD"], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["The carry bit is always set low. The overflow bit is set high if the value being converted is not a BCD value or the resulting BCD value is greater than 32,767. Otherwise, it is set to low.", "Carry ( C ) - Low Overflow ( V ) - Set if result is not BCD or overflow Zero ( Z ) - Set if result is zero,low otherwise Sign ( S ) - Low", "Carry ( C ) - Low Overflow ( V ) - Set if result is not BCD or overflow Zero ( Z ) - Set if result is zero,low otherwise Sign ( S ) - Low if source is negative, low otherwiseeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee, undefined on overflowwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww", "0010 1101 Binary = 45 Decimal 45 Decimal = 0100 0101 BCD"], "jumps": ["P1520", "P1500"]}, {"id": "P1520", "text": ["The zero bit is set high for a zero result and low when not zero. The sign bit is always set low.", "Carry ( C ) - Low Overflow ( V ) - Set if result is not BCD or overflow Zero ( Z ) - Set if result is zero,low otherwise Sign ( S ) - Low", "Carry ( C ) - Low Overflow ( V ) - Set if result is not BCD or overflow Zero ( Z ) - Set if result is zero,low otherwise Sign ( S ) - Low if source is negative, low otherwiseeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee, undefined on overflowwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww", "0010 1101 Binary = 45 Decimal 45 Decimal = 0100 0101 BCD"], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["The next instruction is the Decode 4 to 1 of 16 (DCD). This instruction requires a source and destination. The code is used to set only one bit high at a time in the destination based on the lower half of the lower byte value in the source...."], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["In other words, the lowest 4 bits in the source, 0, 1, 2, and 3 can represent a value between 0 and 15. The value you have set in the source will turn on that particular bit in the destination and set all the reset to low..."], "jumps": ["P1550", "P1530"]}, {"id": "P1550", "text": ["Illustrated below are two examples of this instruction. Notice how only the lower 4 bits of the source determine which bit is high in the destination..............."], "jumps": ["P1560", "P1530"]}, {"id": "P1560", "text": ["This table shows all combinations used in the source and the result in the destination. This instruction could be used to turn on 1 output of 16, one at a time. This instruction does not use the math register, and the arithmetic status bits remain unchanged...", "DECODE TABLE SOURCE DESTINATION 0000 0000000000000001 0001 0000000000000010 0010 0000000000000100 0011 0000000000001000 0100 0000000000010000 0101 0000000000100000 0110 0000000001000000 0111 0000000010000000", "DECODE TABLE SOURCE DESTINATION 1000 0000000100000000 1001 0000001000000000 1010 0000010000000000 1011 0000100000000000 1100 0001000000000000 1101 0010000000000000 1110 0100000000000000 1111 1000000000000000"], "jumps": ["P1570", "P1530"]}, {"id": "P1570", "text": ["The next instruction is the Square Root (SQR) instruction. This instruction takes the square root of the value in the source and places it in the destination.", "Carry ( C ) - Reserved Overflow ( V ) - Low Zero ( Z ) - Set if result is zero,low otherwise Sign ( S ) - Lowlow otherwise Sign ( S ) - Lowsource is negative, low otherwiseeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee, undefined on overflowwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww"], "jumps": ["P1580", "P1560"]}, {"id": "P1580", "text": ["The SQR instruction does not know whether the source is positive or negative, so it will determine a square root for negative numbers without giving you an error. It is important to note, however, the result will not be correct..."], "jumps": ["P1590", "P1570"]}, {"id": "P1590", "text": ["Before using this instruction, always use the Compare instruction to make sure the value is not negative.."], "jumps": ["P1600", "P1570"]}, {"id": "P1600", "text": ["The carry bit is reserved and should not be used with this instruction. The overflow bit and sign bit are always set low. The zero bit is set high when the result is zero and low when not zero...", "Carry ( C ) - Reserved Overflow ( V ) - Low Zero ( Z ) - Set if result is zero,low otherwise Sign ( S ) - Lowlow otherwise Sign ( S ) - Lowsource is negative, low otherwiseeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee, undefined on overflowwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww"], "jumps": ["P1610", "P1570"]}, {"id": "P1610", "text": ["The last instruction is the Scale Data (SCL) instructions. This instruction is used to take data and scale its value up and down.", "Scale Source Rate [ / 10000 ] Offset Dest"], "jumps": ["P1620", "P1570"]}, {"id": "P1620", "text": ["This instruction also allows you to add an offset to the result before it is stored at a destination."], "jumps": ["P1630", "P1610"]}, {"id": "P1630", "text": ["N7 :0 100 20000 100 N7 :0 300", "In the example below, the source value is multiplied by 20000 and divided by 10000. This is the rate setting, sometimes referred to as the slope. Then an offset is added. The result is stored in the destination..."], "jumps": ["P1640", "P1610"]}, {"id": "P1640", "text": ["The carry bit is not used and is reserved by the instruction. The overflow bit is set high if an overflow occurs throughout the instruction. The zero bit is set high if the result is zero and low if not zero. The sign bit is set high if the result is negative and low if positive..."], "jumps": ["P1650", "P1610"]}, {"id": "P1650", "text": ["If the source value 0000 0000 0000 0110 was passed to the DCD instruction, what would be the result in the destination?"], "jumps": ["P1610"]}, {"id": "P1651", "text": [], "jumps": []}, {"id": "P1652", "text": ["Remember, the DCD instruction will set only the bit represented by the lower four bits of the source. The lower four bits of the source equal 6, which would set bit six. Don't forget that the leftmost bit is bit 0, so the seventh bit from the left is bit six..."], "jumps": []}, {"id": "P1670", "text": ["We have examined the math instructions used by the PLC in ladder logic programs. There are many different instructions that provide a variety of operations.", "ADD - ADD SUB - SUBTRACT MUL - MULTIPLY DIV - DIVIDE DDV - DOUBLE DIVIDE NEG - NEGATE CLR - CLEAR TOD - CONVERT TO BCD FRD - CONVERT FROM BCD DCD - DECODE 4 TO 1 OF 16 SQR - SQUARE ROOT SCL - SCALE DATA"], "jumps": ["P1680", "P1650"]}, {"id": "P1680", "text": ["The last thing to be mentioned deals with the overflow bit, which, as you know, can be set by many of the instructions.", "Carry ( C ) - Low Overflow ( V ) - Low Zero ( Z ) - Set if result is zero,low otherwise Sign ( S ) - Lowlow otherwise Sign ( S ) - Low if source is negative, low otherwiseeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee, undefined on overflowwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww", "Carry ( C ) - Low Overflow ( V ) - Low Zero ( Z ) - Set if result is zero,low otherwise Sign ( S ) - Low"], "jumps": ["P1690", "P1670"]}, {"id": "P1690", "text": ["The overflow bit informs the PLC of a minor error. If you detect an overflow, you must set the overflow bit to low before the end of the ladder logic cycle. Otherwise, the PLC will cause a CPU fault and stop execution of the program...", "Carry ( C ) - Low Overflow ( V ) - Low Zero ( Z ) - Set if result is zero,low otherwise Sign ( S ) - Lowlow otherwise Sign ( S ) - Low if source is negative, low otherwiseeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee, undefined on overflowwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww", "Carry ( C ) - Low Overflow ( V ) - Low Zero ( Z ) - Set if result is zero,low otherwise Sign ( S ) - Low"], "jumps": ["P1700", "P1680"]}, {"id": "P1700", "text": ["The overflow bit allows you to deal with a result error before the PLC faults because of the result. The table below shows the bit locations of all the bits and the math register."], "jumps": ["P1910", "P1690"]}, {"id": "P1910", "text": ["This completes the information on MATH INSTRUCTIONS........"], "jumps": ["P1001", "P1690"]}, {"id": "P1920", "text": ["1. The Add (ADD) instruction is used to add two numbers and store the result in a destination location.", "Carry ( C ) - High if carry, low otherwise Overflow ( V ) - Set if overflow, low otherwise Zero ( Z ) - Set if result is zero, low otherwise Sign ( S ) - Set if result is negative, low otherwise"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. The Subtract (SUB) instruction is used to subtract two numbers and store the result in a destination location.", "Carry ( C ) - High if borrow, low otherwise Overflow ( V ) - Set if underflow, low otherwise Zero ( Z ) - Set if result is zero, low otherwise Sign ( S ) - Set if result is negative, low otherwise"], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. The Multiply (MUL) instruction is used to multiply two values and store the result in a destination and the math register.", "( S = 13 & S = 14 ) Contains 32 bit multiplication result", "Carry ( C ) - low Overflow ( V ) - Set if overflow, low otherwise Zero ( Z ) - Set if result is zero, low otherwise Sign ( S ) - Set if result is negative, low otherwiseeeeeeeeeeeeeeeeeeeeeeeeeee"], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. The Divide (DIV) instruction is used to divide one value by another and store the rounded result in a destination. The unrounded result and remainder are stored in the math register.", "( S = 13 & S = 14 ) S = 13 - Remainder S = 14 - Unrounded Result", "Carry ( C ) - low Overflow ( V ) - Set if overflow or divide by zero, low otherwise Zero ( Z ) - Set if result is zero, low otherwise, undefined on overflow Sign ( S ) - Set if result is negative, low otherwise, undefined on overflow"], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. The Double Divide (DDV) instruction is used to divide large values stored in the math register by another value specified as a source. The rounded result is placed in the destination and the unrounded result and remainder are stored in the math register.", "Carry ( C ) - Zero Overflow ( V ) - Set if overflow or divide by zero, low otherwise Zero ( Z ) - Set if result is zero, low otherwise Sign ( S ) - Set if result is negative, low otherwise, undefined on overflowwwwwwwwwwwwwwwwwwwwwwww", "( S = 13 & S = 14 ) S = 13 - Remainder S = 14 - Unrounded Result"], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6. The Negate (NEG) instruction turns a number from positive to negative or from negative to positive.", "Carry ( C ) - Set low if results is zero or overflow, high otherwise Overflow ( V ) - Set if overflow, low otherwise Zero ( Z ) - Set if result is zero, low otherwise Sign ( S ) - Set if result is negative, low otherwise, undefined on overflowwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww"], "jumps": ["P1975", "P1960"]}, {"id": "P1975", "text": ["7. The Clear (CLR) instruction places the number zero into a destination location."], "jumps": ["P1980", "P1970"]}, {"id": "P1980", "text": ["8. The Convert to BCD (TOD) and Convert from BCD (FRD) are used to convert values from decimal to BCD and BCD to decimal.", "0010 1101 Binary = 45 Decimal 45 Decimal = 0100 0101 BCD", "Carry ( C ) - Low Overflow ( V ) - Set if result is larger than 9999 Zero ( Z ) - Set if destination value is zero Sign ( S ) - Set if source is negative, low otherwiseeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee, undefined on overflowwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww", "Carry ( C ) - Low Overflow ( V ) - Set if result is not BCD or overflow Zero ( Z ) - Set if result is zero,low otherwise Sign ( S ) - Low if source is negative, low otherwiseeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee, undefined on overflowwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww", "Carry ( C ) - Low Overflow ( V ) - Set if result is not BCD or overflow Zero ( Z ) - Set if result is zero,low otherwise Sign ( S ) - Low"], "jumps": ["P1985", "P1970"]}, {"id": "P1985", "text": ["9. The Decode 4 to 1 of 16 (DCD) instruction is used to decode a 4-bit binary value to an individual bit of a 16-bit word."], "jumps": ["P1990", "P1980"]}, {"id": "P1990", "text": ["10. The Square Root (SQR) instruction takes the square root of a source value and places it in a destination.", "Carry ( C ) - Reserved Overflow ( V ) - Low Zero ( Z ) - Set if result is zero,low otherwise Sign ( S ) - Lowlow otherwise Sign ( S ) - Lowsource is negative, low otherwiseeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee, undefined on overflowwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww"], "jumps": ["P1995", "P1985"]}, {"id": "P1995", "text": ["11. The Scale Data (SCL) instruction is used to scale source data by a certain rate and offset.", "Scale Source Rate [ / 10000 ] Offset Dest", "N7 :0 100 20000 100 N7 :0 300"], "jumps": ["P1999", "P1990"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1995"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2040", "text": ["In this experiment, we are going to program the PLC Trainer to use several of the math instructions you learned earlier in this lesson."], "jumps": ["P2050", "P2001"]}, {"id": "P2050", "text": ["You must create a new processor program and make the appropriate configurations before actually beginning the ladder logic programming."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["1. Connect the 5050 interface cable between the Nida Model 5050 PLC Trainer and the computer which has the APS software."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["2. Start the APS software by performing the following commands at the DOS prompt of the computer which has the APS software and is attached to the PLC Trainer. a. Type 'CD \\IPDS\\ATTACH\\SLC500' and press enter. b. Type 'APS' and press enter."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["If the software did not start, see your instructor for assistance. These instructions are for default installation of the APS software and may differ from your installation."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["3. Set up a new processor file and begin editing the ladder logic program. If you need help on configuring and setting up the PLC APS software, select the help button below."], "jumps": ["P2100", "P2080", "P2095"]}, {"id": "P2095", "text": ["Follow these steps to set up the APS software for ladder logic program entry and evaluation:", "forget your file name. 2. Using the up and down arrow keys, adjust the PROCESSOR box until '1747-L20C/F 12-DC SNK 8-RLY' is highlighted by the cursor bar. Press F2 [SELECT PROC] to select this processor. 3. Now we will select the IO modules attached to the PLC. Press F5 [CONFIGR I/O].", "1. From the main menu, select F4 [ OFFLINE CONFIG ] and then F6 [ CREATE ]. Enter a file name and press enter. You must use a filename that does not already exist and one ten characters or less. Do not forget your file name. 2. Using the up and down arrow keys, adjust the PROCESSOR box until '1747-L20C/F 12-DC SNK 8-RLY' is highlighted by the cursor bar. Press F2 [ SELECT PROC ] to select this processor. 3. Now we will select th I/O modules attached to the PLC. Press F5 [ CONFIGR I/O ]. 4. Press F4 [ MODIFY RACKS ] and then F1 [ RACK 1 ]. Rack 1 is the backplane that the other two modules will attach to. Use the cursor bar and select '1746-A2 2-slot Backplane' and press enter. 5. Use the arrow keys to highlight '*1' (Slot 1) with the cursor bar and press F5 [ MODIFY SLOT ]. Using the arrow keys again, highlight '1746-IG16 16-Input [ TTL ] (Sink) 5 VDC' and press F2 [ SELECT MODULE ]. 6. Use the arrow keys to highlight '*2' (Slot 2) with the cursor bar and press F5 [ MODIFY SLOT ]. Using the arrow keys again, highlight '1746-NI04V Analog Comb. 2 In & 2 Voltage Out' and press F2 [ SELECT MODULE ]. 7. Select F8 [ EXIT ] and F8 [ SAVE & EXIT ] and then F8 [ ACCEPT ]. 8. Press F3 [ OFFLINE PRG/DOC ] and then F1 [ PROCSSR FUNCTNS ]. We are going to change the name of our ladder logic file to be more descriptive of what it does. 9. Using the cursor bar, select File 2 and press F4 [ CHANGE FL. NAME] Enter 'C_TEST' and press return. The name should appear in the Name column for file 2. 10. We are now ready to edit the ladder program file. Using the arrow keys, highlight File 2 and press F8 [ MONITOR FILE ]. 11. To began editing, press F10 [ EDIT ]..."], "jumps": []}, {"id": "P2100", "text": ["Source A C5 = 0 . ACC Source B C5 = 1 . ACC Dest 0 = 0.0", "The program below is the ladder logic you will enter to demonstrate the math instructions."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["Before we actually begin entering the program into the PLC APS software, let's look at what the program should do. This will help you understand if the program is operating properly when we are testing it..."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["On the 5050-1 PC card, there are three switches that we will use for this program: two push button switches and a slide switch. In the program, there are two counters. The values stored in the counters will be summed using the ADD instruction..."], "jumps": ["P2130", "P2100"]}, {"id": "P2130", "text": ["The START and STOP buttons are used to increment or decrement the counter. The slide switch controls which counter the START and STOP buttons change."], "jumps": ["P2140", "P2100"]}, {"id": "P2140", "text": ["The first rung in the ladder logic program checks to see if the START button is pushed and that the slide switch is in the ON position. If these conditions are met, counter 0 is incremented with the CTU instruction..."], "jumps": ["P2150", "P2100"]}, {"id": "P2150", "text": ["Notice the preset value is zero. We are not counting to a particular number, so the done bit has no meaning for us. For convenience, we have set the preset to zero to remind us we do not need the done bit..."], "jumps": ["P2160", "P2100"]}, {"id": "P2160", "text": ["The next rung determines whether the STOP button is pushed in and the slide switch is in the ON position. If a true logic path can be traced through these two bit instructions, counter 0 will be decremented by 1..."], "jumps": ["P2170", "P2100"]}, {"id": "P2170", "text": ["Rung 3 determines whether the START button is pressed in and the slide switch is in the OFF position. If there is a true logic path through these bit instructions, counter 1 will be incremented by 1."], "jumps": ["P2180", "P2100"]}, {"id": "P2180", "text": ["witch ON means START increments and STOP d , decrementing counter 0. Slide switch OFF means START and STOP increment, decrementing counter 1.", "In Rung 4, the STOP button and the slide switch are off, causing counter 1 to decrement by 1. Remember, slide switch ON means START increments and STOP decrements counter 0. Slide switch OFF means START increments and STOP decrements counter 1.1..ing counter 1."], "jumps": ["P2190", "P2100"]}, {"id": "P2190", "text": ["In the next rung, we have the ADD instruction. This instruction adds the accumulator of counter 0 to the accumulator of counter 1. Recall that the accumulator is the second word of a counter data file..file...", "Source A C5 = 0 . ACC Source B C5 = 1 . ACC Dest 0 = 0.0"], "jumps": ["P2200", "P2100"]}, {"id": "P2200", "text": ["The destination setting of the ADD instruction sends the result to output port 0, the LEDs of the PLC Trainer."], "jumps": ["P2210", "P2100"]}, {"id": "P2210", "text": ["As the ladder logic program is evaluated, the LEDs of the PLC Trainer will indicate the addition of counter 0's accumulator value and counter 1's accumulator value."], "jumps": ["P2220", "P2100"]}, {"id": "P2220", "text": ["The value represented on the LEDs will be in binary. The maximum number that can be displayed on the LEDs is 255.", "Source A C5 = 0 . ACC Source B C5 = 1 . ACC Dest 0 = 0.0"], "jumps": ["P2230", "P2100"]}, {"id": "P2230", "text": ["If the result of adding the counter values exceeds 255, the LED output will be incorrect. Remember, the actual accumulators can be counted from -32,768 to 32,767."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["Let's enter the ladder logic program......................."], "jumps": ["P2250", "P2220"]}, {"id": "P2250", "text": ["Each rung is presented in order for you to type it into the APS software. If you have trouble, a help button will provide a list of steps for entering the instruction. Try and do as much as possible on your own..."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["4. Enter Rung 1 shown below..............................."], "jumps": ["P2270", "P2240", "P2265"]}, {"id": "P2265", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, XIC and then enter I:0/0. 3. Select BIT, XIC and enter I:0/2. 4. Select TIMER/COUNTER, CTU, and enter C5:0, 0 and 0. 5. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2270", "text": ["5. Enter Rung 2 shown below..............................."], "jumps": ["P2280", "P2260", "P2275"]}, {"id": "P2275", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, XIC and then enter I:0/1. 3. Select BIT, XIC and enter I:0/2. 4. Select TIMER/COUNTER, CTD, and enter C5:0, 0 and 0. 5. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2280", "text": ["6. Enter Rung 3 shown below..............................."], "jumps": ["P2290", "P2270", "P2285"]}, {"id": "P2285", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, XIC and then enter I:0/0. 3. Select BIT, XIO and enter I:0/2. 4. Select TIMER/COUNTER, CTU, and enter C5:1, 0 and 0. 5. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2290", "text": ["7. Enter Rung 4 shown below.............................."], "jumps": ["P2300", "P2280", "P2295"]}, {"id": "P2295", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, XIC and then enter I:0/1. 3. Select BIT, XIO and enter I:0/2. 4. Select TIMER/COUNTER, CTD, and enter C5:1, 0 and 0. 5. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2300", "text": ["8. Enter Rung 5 shown below..............................."], "jumps": ["P2310", "P2290", "P2305"]}, {"id": "P2305", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, MATH, ADD and then enter C5:0.2, C5:1.2 and O:0.0. 3. Press ESC and ACCEPT RUNG."], "jumps": ["P2300"]}, {"id": "P2310", "text": ["Now that the program is entered, it must be loaded into the PLC and tested. Make sure the last rung of the program has been accepted."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["9. Set the PLC Trainer to the initial control settings....", "Main Power ON DC Power ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF"], "jumps": ["P2310"]}, {"id": "P2325", "text": ["INITIAL CONTROL SETTING - Main Power ON, DC Power ON, Monitor ON, Process Selector OFF, +DC Voltage Select 5V, PC1 & PC2 Power OFF."], "jumps": []}, {"id": "P2330", "text": ["10. Place the PC5050-1 card in the PC1 position..........."], "jumps": ["P2320"]}, {"id": "P2340", "text": ["11. Set the PLC Trainer controls as follows:..............", "+DC Voltage Select 24V PC1 Power ON ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF"], "jumps": ["P2330", "P2345"]}, {"id": "P2345", "text": ["PLC TRAINER CONTROLS - Turn the +DC Voltage Select dial fully CW to the 24V position. Push the PC1 Power switch up to the ON position."], "jumps": []}, {"id": "P2380", "text": ["The trainer has been turned on and set. Let's send our program to the trainer...................... program to the trainer."], "jumps": ["P2390", "P2340"]}, {"id": "P2390", "text": ["12. Press F1 [SAVE/GO ONLINE]. If the file exists, you will be asked if you would like to overwrite it. Press F8 [YES]. If the processor is not in program mode, the APS software will ask you if it can switch to that mode. Press F8 [YES]."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["13. Once the program has been sent, the APS software will ask you if you would like to switch to run mode. Again, press F8 [YES]."], "jumps": ["P2410", "P2390"]}, {"id": "P2410", "text": ["The program is now running. Try out the START and STOP buttons and the POWER slide switch. Observe how the LEDs change, based on the values in the counters. The APS software shows the value in the counters while they are active...", "Source A C5 = 0 . ACC Source B C5 = 1 . ACC Dest 0 = 0.0"], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["The value displayed by the LEDs represents the addition of counter 0's accumulator value to counter 1's accumulator value. Again, observe the APS software screen to verify the program values..."], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["This completes the demonstration of the math instructions. Try creating your own ladder logic and enter it into the APS software. It is easier to write your logic on paper first and then enter it into the software......."], "jumps": ["P2440", "P2410"]}, {"id": "P2440", "text": ["If you want to edit your program, select EDIT and edit DISK PROGRAM. Then follow the same steps to send the program to the PLC Trainer. The inputs and outputs are listed below.", "I :0/0 Start Switch O :0/0 Led 0 O :0/4 Led 4 I :0/1 Stop Switch O :0/1 Led 1 O :0/5 Led 5 I :0/2 Power Switch O :0/2 Led 2 O :0/6 Led 6 O :0/3 Led 3 O :0/7 Led 74"], "jumps": ["P2450", "P2410"]}, {"id": "P2450", "text": ["14. Press F3 [EXIT] or ESC and then F3 depending on where you left off in the APS software. Now select F3 [RETURN TO MENU] and then F10 [EXIT SYSTEM]."], "jumps": ["P2460", "P2440"]}, {"id": "P2460", "text": ["15. Return the PLC Trainer to the initial control settings.", "Main Power ON DC Power ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF"], "jumps": ["P2450"]}, {"id": "P2470", "text": ["16. Turn OFF the PLC Trainer's main power switch.........."], "jumps": ["P2460"]}, {"id": "P2480", "text": ["17. Return all PC cards and test equipment to their proper storage location."], "jumps": ["P2910", "P2470"]}, {"id": "P2910", "text": ["This completes the experiment on MATH INSTRUCTIONS........."], "jumps": ["P2001", "P2480"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3020", "text": ["In this experiment, we are going to program the PLC Trainer to use math instructions you learned earlier in this lesson."], "jumps": ["P3030", "P3001"]}, {"id": "P3030", "text": ["You must create a new processor program and make the appropriate configurations before actually beginning the ladder logic programming."], "jumps": ["P3020"]}, {"id": "P3040", "text": ["Before we can program the PLC, we need to make sure that the software and interface are set up and operating properly."], "jumps": ["P3020"]}, {"id": "P3050", "text": ["1. Ensure the 5050 interface cable is connected between the Nida Model 5050 PLC Trainer and the computer which has the RSLinx and RSLogix software."], "jumps": ["P3020"]}, {"id": "P3060", "text": ["2. Turn on the 5050 PLC Trainer..........................."], "jumps": ["P3050"]}, {"id": "P3070", "text": ["3. Start the RSLinx communication software by double-clicking on the RSLinx icon that is on the computer desktop that has the RSLinx software and is attached to the PLC Trainer. If the software did not start, see your instructor for assistance..."], "jumps": ["P3060"]}, {"id": "P3080", "text": ["4. Now we need to know if the computer and PLC Trainer are communicating. In the right window, double-click on the AB_PIC-1 DH-485 icon..."], "jumps": ["P3070"]}, {"id": "P3090", "text": ["5. Make sure that the PLC icon does not have a red \"X\" over it. If a red \"X\" is present, make sure the PLC Trainer is turned on and connected. If the PLC is still not active, see your instructor for assistance.."], "jumps": ["P3070"]}, {"id": "P3100", "text": ["6. Click on the minimize button. This is the \"_\" in the upper right-hand corner of the window........"], "jumps": ["P3090"]}, {"id": "P3110", "text": ["7. Start the RSLogix software by double-clicking on the RSLogix icon the computer's desktop, which has the RSLogix software and is attached to the PLC Trainer. If the software did not start, see your instructor for assistance...."], "jumps": ["P3100"]}, {"id": "P3120", "text": ["8. Click on the maximize button to bring the window to full size. This is the button just to the right of the minimize button.."], "jumps": ["P3110"]}, {"id": "P3130", "text": ["9. Set up a new processor file and begin editing the ladder logic program. If you need help on configuring and setting up the PLC RSLogix software, select the help button below."], "jumps": ["P3120", "P3135"]}, {"id": "P3135", "text": ["Follow these steps to set up the RSLogix software for ladder logic program entry and evaluation: 1. From the standard toolbar, click on the NEW icon (icon looks like a piece of paper). 2. Enter a file name in the processor name text box. You must choose a name that does not already exist and is less than ten characters in length. Do not forget this file name. 3. Now that we have entered a filename, we will need to select the PLC type and the different I/O modules that we have attached to the system. In the case of the Nida PLC Trainer, there are two extra modules: a TTL module and an analog module. 4. At the bottom of the select processor type window, AB_PIC-1 should be displayed in the driver text box. If not displayed, click on the down-arrow and select AB_PIC-1. 5. Using the listbox scroll bar arrows, scroll until \"1747-L20C/F 12-DC SNK In, 8-RLY Out\" is displayed. Click on this PLC processor and then click on OK. 6. Two windows should appear. The left window is the project window and displays the project files. The right window is the ladder window and displays the selected ladder program. LAD2 should be displayed in the ladder window title bar. 7. Now you need to select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 8. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. 9. In the right window scroll down and double-click on the \"1746-IG16 16-Input (TTL-SOURCE) 5VDC\" module name to transfer the module information to the left window for the #1 slot of the PLC. 10. In the right window scroll down and double click on the \"1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out\" module name to transfer the module information to the left window for the #2 slot of the PLC. 11. Save the configuration settings by clicking on the I/O configuration close button. This button is the \"X\" in top right-hand corner of the I/O configuration window. 12. The processor section of your file is complete. You are now at the main window and should see the \"end\" ladder in the ladder window.", "1. From the standard toolbar, click on the NEW icon (icon looks like a piece of paper). 2. Enter a file name in the processor name text box. You must choose a name that does not already exist and is less than ten characters in length. Do not forget this file name. 3. Now that we have entered a filename, we will need to select the PLC type and the different I/O modules that we have attached to the system. In the case of the Nida PLC Trainer, there are two extra modules: a TTL module and an analog module. 4. At the bottom of the select processor type window, AB_PIC-1 should be displayed in the driver text box. If not displayed, click on the down-arrow and select AB_PIC-1. Using the listbox scroll bar arrows, scroll until 1747-L20C/F 12-DC SNK In, 8-RLY Out is displayed. Click on this PLC processor and then click on OK. . Two windows should appear. The left window is the project window and displays the project files. The right window is the ladder window and displays the selected ladder program. LAD2 should be displayed in the ladder window title bar. 7. Now you need to select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 8. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. 9. In the right window scroll down and double-click on the 1746-IG16 16-Input (TTL-SOURCE) 5VDC module name to transfer the module information to the left window for the #1 slot of the PLC. 10. In the right window scroll down and double click on the 1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out module name to transfer the module information to the left window for the #2 slot of the PLC. 11. Save the configuration settings by clicking on the I/O configuration close button. This button is the X in top right-hand corner of the I/O configuration window. 12. The processor section of your file is complete. You are now at the main window and should see the end ladder in the ladder window."], "jumps": []}, {"id": "P3136", "text": ["Follow these steps to set up the RSLogix software for ladder logic program entry and evaluation: 1. From the standard toolbar, click on the NEW icon (icon looks like a piece of paper). 2. Enter a file name in the processor name text box. You must choose a name that does not already exist and is less than ten characters in length. Do not forget this file name. 3. Now that we have entered a filename, we will need to select the PLC type and the different I/O modules that we have attached to the system. In the case of the Nida PLC Trainer, there are two extra modules: a TTL module and an analog module. 4. At the bottom of the select processor type window, AB_PIC-1 should be displayed in the driver text box. If not displayed, click on the down-arrow and select AB_PIC-1. 5. Using the listbox scroll bar arrows, scroll until \"1747-L20C/F 12-DC SNK In, 8-RLY Out\" is displayed. Click on this PLC processor and then click on OK. 6. Two windows should appear. The left window is the project window and displays the project files. The right window is the ladder window and displays the selected ladder program. LAD2 should be displayed in the ladder window title bar. 7. Now you need to select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 8. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. 9. In the right window scroll down and double-click on the \"1746-IG16 16-Input (TTL-SOURCE) 5VDC\" module name to transfer the module information to the left window for the #1 slot of the PLC. 10. In the right window scroll down and double click on the \"1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out\" module name to transfer the module information to the left window for the #2 slot of the PLC. 11. Save the configuration settings by clicking on the I/O configuration close button. This button is the \"X\" in top right-hand corner of the I/O configuration window. 12. The processor section of your file is complete. You are now at the main window and should see the \"end\" ladder in the ladder window.", "5. Using the listbox scroll bar arrows, scroll until 1747-L20C/F 12-DC SNK In, 8-RLY Out is displayed. Click on this PLC processor and then click on OK. 6. Two windows should appear. The left window is the project window and displays the project files. The right window is the ladder window and displays the selected ladder program. LAD2 should be displayed in the ladder window title bar. 7. Now you need to select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 8. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. information to the left window for the #1 slot of the PLC."], "jumps": []}, {"id": "P3137", "text": ["Follow these steps to set up the RSLogix software for ladder logic program entry and evaluation: 1. From the standard toolbar, click on the NEW icon (icon looks like a piece of paper). 2. Enter a file name in the processor name text box. You must choose a name that does not already exist and is less than ten characters in length. Do not forget this file name. 3. Now that we have entered a filename, we will need to select the PLC type and the different I/O modules that we have attached to the system. In the case of the Nida PLC Trainer, there are two extra modules: a TTL module and an analog module. 4. At the bottom of the select processor type window, AB_PIC-1 should be displayed in the driver text box. If not displayed, click on the down-arrow and select AB_PIC-1. 5. Using the listbox scroll bar arrows, scroll until \"1747-L20C/F 12-DC SNK In, 8-RLY Out\" is displayed. Click on this PLC processor and then click on OK. 6. Two windows should appear. The left window is the project window and displays the project files. The right window is the ladder window and displays the selected ladder program. LAD2 should be displayed in the ladder window title bar. 7. Now you need to select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 8. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. 9. In the right window scroll down and double-click on the \"1746-IG16 16-Input (TTL-SOURCE) 5VDC\" module name to transfer the module information to the left window for the #1 slot of the PLC. 10. In the right window scroll down and double click on the \"1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out\" module name to transfer the module information to the left window for the #2 slot of the PLC. 11. Save the configuration settings by clicking on the I/O configuration close button. This button is the \"X\" in top right-hand corner of the I/O configuration window. 12. The processor section of your file is complete. You are now at the main window and should see the \"end\" ladder in the ladder window.", "9. In the right window scroll down and double-click on the 1746-IG16 16- Input (TTL-SOURCE) 5VDC module name to transfer the module information to the left window for the #1 slot of the PLC. 10. In the right window scroll down and double click on the 1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out module name to transfer the module information to the left window for the #2 slot of the PLC. 11. Save the configuration settings by clicking on the I/O configuration close button. This button is the X in top right-hand corner of the I/O configuration window. 12. The processor section of your file is complete. You are now at the main window and should see the end ladder in the ladder window."], "jumps": []}, {"id": "P3140", "text": ["The program below is the ladder logic program you will enter to demonstrate the math instructions.", "Source A C5 = 0 . ACC Source B C5 = 1 . ACC Dest 0 = 0.0"], "jumps": ["P3150", "P3130"]}, {"id": "P3150", "text": ["Before we actually begin entering the program into the PLC RSLogix software, let's look at what the program should do. This will help you understand if the program is operating properly when we are testing it..."], "jumps": ["P3160", "P3140"]}, {"id": "P3160", "text": ["On the 5050-1 PC card, there are three switches that we will use for this program: two push button switches and a slide switch. In our program, there are two counters. The values stored in the counters will be summed using the ADD instruction."], "jumps": ["P3170", "P3140"]}, {"id": "P3170", "text": ["The START and STOP push buttons are used to increment or decrement the counter. The slide switch controls which counter the START and STOP buttons change."], "jumps": ["P3180", "P3160"]}, {"id": "P3180", "text": ["The first rung of the ladder logic program checks to see if the START button is pushed and that the slide switch is in the ON position. If these conditions are met, counter 0 is incremented with the CTU instruction..", "Source A C5 = 0 . ACC Source B C5 = 1 . ACC Dest 0 = 0.0"], "jumps": ["P3190", "P3160"]}, {"id": "P3190", "text": ["Notice the preset value is zero. We are not counting to a particular number, so the done bit has no meaning for us. For convenience, we have set the preset to zero to remind us we do not need the done bit..."], "jumps": ["P3200", "P3180"]}, {"id": "P3200", "text": ["The next rung determines whether the STOP button is pressed and the slide switch is in the ON position. If a true logic path can be traced through these two bit instructions, counter 0 will be decremented by 1.."], "jumps": ["P3210", "P3180"]}, {"id": "P3210", "text": ["Rung 3 determines whether the START button is pressed and the slide switch is in the OFF position. If there is a true logic path through these bit instructions, counter 1 will be incremented by 1."], "jumps": ["P3220", "P3180"]}, {"id": "P3220", "text": ["In Rung 4, the STOP button is pressed and the slide switch is in the OFF position, which causes the counter to decrement by 1."], "jumps": ["P3230", "P3180"]}, {"id": "P3230", "text": ["Remember, slide switch ON means START increments and STOP decrements counter 0. Slide switch OFF means START increments and STOP decrements counter 1."], "jumps": ["P3240", "P3180"]}, {"id": "P3240", "text": ["In the last rung, we have the ADD instruction. This instruction adds the accumulator of counter 0 to the accumulator of counter 1. Recall that the accumulator is the second word of a counter data file.", "Source A C5 = 0 . ACC Source B C5 = 1 . ACC Dest 0 = 0.0"], "jumps": ["P3250", "P3230"]}, {"id": "P3250", "text": ["The destination setting of the ADD instruction sends the result to output port 0, the LEDs of the PLC trainer."], "jumps": ["P3260", "P3240"]}, {"id": "P3260", "text": ["As the ladder logic program is evaluated, the LEDs of the PLC Trainer will indicate the addition of counter 0's accumulator value and counter 1's accumulator value."], "jumps": ["P3270", "P3240"]}, {"id": "P3270", "text": ["The value represented on the LEDs will be in binary. The maximum number that can be displayed on the LEDs is 255."], "jumps": ["P3280", "P3240"]}, {"id": "P3280", "text": ["If the result of adding the counter values exceeds 255, the LED output will be incorrect. Remember, the actual accumulators can be counted from -32,768 to 32,767."], "jumps": ["P3290", "P3240"]}, {"id": "P3290", "text": ["Let's enter the ladder logic program......................."], "jumps": ["P3300", "P3240"]}, {"id": "P3300", "text": ["Each rung will be presented in order for you to type it into the RSLogix software. If you have trouble, a help button will provide a list of steps for entering the instruction. Try to do as much as possible on your own."], "jumps": ["P3310", "P3290"]}, {"id": "P3310", "text": ["10. Enter rung 1 shown below.............................."], "jumps": ["P3320", "P3290", "P3315"]}, {"id": "P3315", "text": ["RUNG 1rung. Highlight the number to the left of the end rung to select the end rung. Click on the user tab. Click on the new rung icon. 2. Add an XIC instruction. Click on the bit tab and then click on the XIC icon. Type I:0/0 and press <ENTER>. instruction. Click on the XIC icon. Type I:0/2 and press <ENTER>. 4. Add a CTU instruction. Click on the timer/counter tab and then click on CTU. For the counter, type C5:0 and press <ENTER>. For the accumulator type 0 and press <ENTER>. For the preset, type 0 and press <ENTER>. 5. Verify the rung. Click on the verify icon.", "1. Add a rung. Highlight the number to the left of the end rung to select the end rung. Click on the user tab. Click on the new rung icon. 2. Add an XIC instruction. Click on the bit tab and then click on the XIC icon. Type I:0/0 and press <ENTER>. 3. Add another XIC instruction. Click on the XIC icon. Type I:0/2 and press <ENTER>. 4. Add a CTU instruction. Click on the timer/counter tab and then click on CTU. For the counter, type C5:0 and press <ENTER>. For the preset, type 0 and press <ENTER>. For the accumulator type 0 and press <ENTER>. 5. Verify the rung. Click on the verify icon.rify icon..er with a green check mark over it...n check mark over it."], "jumps": ["P3310"]}, {"id": "P3320", "text": ["11. Enter rung 2 shown below.............................."], "jumps": ["P3330", "P3310", "P3325"]}, {"id": "P3325", "text": ["RUNG 2 ng. Highlight the number to the left of the end rung to select the end rung. Click on the user tab. Click on the new rung icon. 2. Add an XIC instruction. Click on the bit tab and then click on the XIC icon. Type I:0/1 and press <ENTER>. 3. Add another XIC instruction. Click on the XIC icon. Type I:0/2 and press <ENTER>. 4. Add a CTD instruction. Click on the timer/counter tab and then click on CTD. For the counter, type C5:0 and press <ENTER>. For the accumulator type 0 and press <ENTER>. For the preset, type 0 and press <ENTER>. 5. Verify the rung. Click on the verify icon.", "1. Add a rung. Highlight the number to the left of the end rung to select the end rung. Click on the user tab. Click on the new rung icon. 2. Add an XIC instruction to the new rung. Click on the bit tab, and then click on the XIC icon. Type I:O/1 and press <ENTER>. 3. Add another XIC instruction. Click on the XIC icon. Type I:0/2 and press <ENTER>. 4. Add a CTD instruction. Click on the timer/counter tab and then click on CTD. For the counter, type C5:0 and press <ENTER>. For the preset, type 0 and press <ENTER>. For the accumulator type 0 and press <ENTER>. 5. Verify the rung. Click on the verify icon..n.rify icon.r with a green check mark over it.."], "jumps": ["P3320"]}, {"id": "P3330", "text": ["12. Enter rung 3 shown below.............................."], "jumps": ["P3340", "P3320", "P3335"]}, {"id": "P3335", "text": ["RUNG 3rung. Highlight the number to the left of the end rung to select the end rung. Click on the user tab. Click on the new rung icon. 2. Add an XIC instruction. Click on the bit tab and then click on the XIC icon. Type I:0/0 and press <ENTER>. 3. Add an XIO instruction. Click on the XIO icon. Type I:0/2 and press <ENTER>. 4. Add a CTU instruction. Click on the timer/counter tab and then click on CTU. For the counter, type C5:1 and press <ENTER>. For the accumulator type 0 and press <ENTER>. For the preset, type 0 and press <ENTER>. 5. Verify the rung. Click on the verify icon..", "1. Add a rung. Highlight the number to the left of the end rung to select the end rung. Click on the user tab. Click on the new rung icon. 2. Add an XIC instruction to the new rung. Click on the bit tab, and then click on the XIC icon. Type I:0/0 and press <ENTER>. 3. Add an XIO instruction. Click on the XIO icon. Type I:0/2 and press <ENTER>. 4. Add a CTU instruction. Click on the timer/counter tab and then click on CTU. For the counter, type C5:1 and press <ENTER>. For the preset, type 0 and press <ENTER>. For the accumulator type 0 and press <ENTER>. 5. Verify the rung. Click on the verify icon.ify icon......with a green check mark over it.."], "jumps": ["P3330"]}, {"id": "P3340", "text": ["13. Enter rung 4 shown below.............................."], "jumps": ["P3350", "P3330", "P3345"]}, {"id": "P3345", "text": ["RUNG 4rung. Highlight the number to the left of the end rung to select the end rung. Click on the user tab. Click on the new rung icon. 2. Add an XIC instruction. Click on the bit tab and then click on the XIC icon. Type I:0/1 and press <ENTER>. 3. Add an XIO instruction. Click on the XIO icon. Type I:0/2 and press <ENTER>. 4. Add a CTD instruction. Click on the timer/counter tab and then click on CTD. For the counter, type C5:1 and press <ENTER>. For the accumulator type 0 and press <ENTER>. For the preset, type 0 and press <ENTER>. 5. Verify the rung. Click on the verify icon....", "1. Add a rung. Highlight the number to the left of the end rung to select the end rung. Click on the user tab. Click on the new rung icon. 2. Add an XIC instruction to the new rung. Click on the bit tab, and then click on the XIC icon. Type I:0/1 and press <ENTER>. 3. Add an XIO instruction. Click on the XIO icon. Type I:0/2 and press <ENTER>. 4. Add a CTD instruction. Click on the timer/counter tab and then click on CTD. For the counter, type C5:1 and press <ENTER>. For the preset, type 0 and press <ENTER>. For the accumulator type 0 and press <ENTER>. 5. Verify the rung. Click on the verify icon...."], "jumps": ["P3340"]}, {"id": "P3350", "text": ["14. Enter rung 5 shown below.............................."], "jumps": ["P3360", "P3340", "P3355"]}, {"id": "P3355", "text": ["RUNG 555ng. Highlight the number to the left of the end rung to select the end rung. Click on the user tab. Click on the new rung icon. 2. Add an ADD instruction. Click on the compute/math tab (use the right arrow next to the tabs to scroll to the compute/math tab) and then click on ADD. For Source A, type C5:0.ACC and press <ENTER>. For Source B, type For destination (DEST), type O:0.0 and press <ENTER>. The destination is the output destination of the LEDs on the PLC trainer. 3. Verify the rung. Click on the verify icon.", "1. Add a rung. Highlight the number to the left of the end rung to select the end rung. Click on the user tab. Click on the new rung icon. 2. Add an ADD instruction. let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
