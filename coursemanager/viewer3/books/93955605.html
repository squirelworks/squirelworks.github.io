const book = {"title": "93955605", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Title: TIME CONTROL OF DC MOTORSsd fasfd asdf asdf sadf", "Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe speed control techniques for DC motor control. w Describe a basic SCR controller. w Describe a basic Triac controller. w Describe fire angle (ff) and conduction angle (fc)."], "jumps": []}, {"id": "P300", "text": ["In this lesson, you will learn about speed control for DC motors."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["In particular, basic SCR and Triac controllers will be explored."], "jumps": ["P400", "P420"]}, {"id": "P420", "text": ["These types of controllers are used where variable motor speed is crucial."], "jumps": ["P400", "P440"]}, {"id": "P440", "text": ["Let's begin the lesson on TIME CONTROL OF DC MOTORS......................."], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["There are two types of DC motor speed controls: Amplitude Control and Time Control. C Motor Controllers Amplitude Time Control Control", "AC Filament.......... ON (130A only) + Power Supply... 5 Volts - Power Supply..... 15 Volts"], "jumps": ["P1001", "P1022"]}, {"id": "P1022", "text": ["On DC motors that use amplitude control, varying E (the applied voltage) changes the speed (RPM) of the motor."], "jumps": ["P1020", "P1030"]}, {"id": "P1030", "text": ["In this lesson you will be concerned with Time Control of DC motors."], "jumps": ["P1020", "P1040"]}, {"id": "P1040", "text": ["Time control is based on a duty cycle of repetitive waveforms."], "jumps": ["P1020", "P1042"]}, {"id": "P1042", "text": ["Let's look at using a square wave input to a DC motor first."], "jumps": ["P1040", "P1044"]}, {"id": "P1044", "text": ["A DC motor responds to the average DC voltage applied. If a pure DC signal is applied, the average voltage is the peak value."], "jumps": ["P1040", "P1050"]}, {"id": "P1050", "text": ["Average voltage = E ( time on cycle time ) = 10 ( 0.10 ) = 1VV", "When applying a square wave, the average voltage is less than a DC level. Therefore the RPM is also less."], "jumps": ["P1060", "P1044"]}, {"id": "P1060", "text": ["Where Duty Cycle = Time On Time Cycle", "Average Voltage = Duty Cycle x Max Applied Voltage", "The average DC voltage is the product of the duty cycle of the wave and the maximum output voltage.", "AC Filament.......... ON (130A only) + Power Supply... 5 Volts - Power Supply..... 15 Volts"], "jumps": ["P1044", "P1070"]}, {"id": "P1070", "text": ["Average voltage = E ( time on cycle time ) = 10 ( 0.10 ) = 1VV", "The duty cycle is the ratio of the ON time to the total cycle."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["Average voltage = E ( time on cycle time ) = 10 ( .9 ) = 9VVVV", "The greater the ON time of the pulse, the higher the average DC voltage and the faster the motor RPM."], "jumps": ["P1070", "P1090"]}, {"id": "P1090", "text": ["This technique is for pulsed waveforms only and is called Pulse Width Modulation, (PWM)."], "jumps": ["P1080", "P1092", "PWM"]}, {"id": "P1092", "text": ["The motor does not stop when the pulse is low (OFF)........"], "jumps": ["P1080", "P1094"]}, {"id": "P1094", "text": ["The motor's internal inertia and mass keeps the rotor spinning during OFF times."], "jumps": ["P1092", "P1096"]}, {"id": "P1096", "text": ["A typical circuit that performs time control using a square wave would use a variable one shot multivibrator. Source Time control Device Squarewave One Shot DC Variable Generator Multivibrator Motor RPM", "AC Filament.......... ON (130A only) + Power Supply... 5 Volts - Power Supply..... 15 Volts"], "jumps": ["P1092", "P1098"]}, {"id": "P1098", "text": ["AC Filament.......... ON (130A only) + Power Supply... 5 Volts - Power Supply..... 15 Volts", "Triangular wave input voltages are used as speed control by the same method. urce Conversion Time control Device Triangular Wave Schmitt One Shot DC Variable Generator Trigger Multivibrator Motor RPMMM"], "jumps": ["P1096", "P1320"]}, {"id": "P1100", "text": ["Sine wave or AC inputs to a DC motor can also be used for time control. Sine wave Square wave Triangular"], "jumps": ["P1340", "P1110"]}, {"id": "P1110", "text": ["- Avg. DC - 8V - Avg. DC - 4V - Avg. DC - 1V - Avg. DC - 0V", "Let's look at one alternation only, changing when the input is applied to a DC motor, changes the average DC voltage."], "jumps": ["P1100", "P1120"]}, {"id": "P1120", "text": ["- Avg. DC - 8V - Avg. DC - 4V - Avg. DC - 1V - Avg. DC - 0V", "The longer the voltage is not applied to the motor, the less the average DC."], "jumps": ["P1110", "P1130"]}, {"id": "P1130", "text": ["The time that the voltage is off is called the fire angle (fF) and is measured in degrees."], "jumps": ["P1110", "P1140"]}, {"id": "P1140", "text": ["The Fire Angle of the illustrated waveforms are: 1. fF = 45"], "jumps": ["P1110", "P1150"]}, {"id": "P1150", "text": ["The time that the voltage is on is called the conduction angle (fC) and is measured in degrees."], "jumps": ["P1110", "P1152"]}, {"id": "P1152", "text": ["The conduction angle of the illustrated waveforms are: 1. fC = 135"], "jumps": ["P1110", "P1154"]}, {"id": "P1154", "text": ["Notice that fire angle, fF, and the conduction angle, fC, always equals 180"], "jumps": ["P1156", "P1110"]}, {"id": "P1156", "text": ["When applying time control, using an AC signal, varying fF varies the average DC voltage applied to the DC motor."], "jumps": ["P1110", "P1160"]}, {"id": "P1160", "text": ["The time before the AC signal goes ON is determined by the _______"], "jumps": ["P1110"]}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1162", "text": ["The conduction angle determines how long the signal is ON.."], "jumps": []}, {"id": "P1163", "text": ["The average DC value is determined by the ON time, not when the signal goes ON."], "jumps": []}, {"id": "P1170", "text": ["How long a signal is ON is determined by the _______......."], "jumps": ["P1160"]}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1172", "text": ["The firing angle determines when the signal is turned ON..."], "jumps": []}, {"id": "P1173", "text": ["The amplitude of a waveform has no bearing on how long the signal is ON."], "jumps": []}, {"id": "P1180", "text": ["The firing angle can be varied when time control has been achieved."], "jumps": ["P1170", "P1190"]}, {"id": "P1190", "text": ["Two components that are commonly used to control the firing angle of a signal are an SCR and a TRIAC."], "jumps": ["P1180", "P1200"]}, {"id": "P1200", "text": [], "jumps": ["P1180", "P1210"]}, {"id": "P1210", "text": ["An SCR is a diode that conducts on one alternation of a full cycle, 180"], "jumps": ["P1180", "P1216"]}, {"id": "P1216", "text": ["The difference in a SCR is that the point where conduction starts can be varied by a signal applied to the gate."], "jumps": ["P1210", "P1218"]}, {"id": "P1218", "text": ["Even if forward biased, the SCR will not conduct until a voltage is applied to the gate."], "jumps": ["P1216", "P1220"]}, {"id": "P1220", "text": ["The SCR's firing voltage can easily be controlled with a variable resistor. . -"], "jumps": ["P1216", "P1350"]}, {"id": "P1225", "text": ["FIRING VOLTAGE - The firing voltage of an SCR is the amount of voltage needed to let the SCR conduct. This voltage is also termed the THRESHOLD VOLTAGE."], "jumps": []}, {"id": "P1230", "text": [], "jumps": ["P1240", "P1350"]}, {"id": "P1240", "text": ["A TRIAC can conduct on both the positive and negative half cycles of a sine wave, or 360"], "jumps": ["P1230", "P1242"]}, {"id": "P1242", "text": ["As in the SCR, the conduction point in a triac can be varied."], "jumps": ["P1240", "P1245"]}, {"id": "P1245", "text": ["Unlike the SCR, the triac has a fC on both the positive and negative alternations."], "jumps": ["P1242", "P1420"]}, {"id": "P1250", "text": ["controller is used, a sinusoidal signal is always applied to the DC motor."], "jumps": ["P1440", "P1260"]}, {"id": "P1260", "text": ["A DC motor can run on an AC signal, although not very efficiently."], "jumps": ["P1250", "P1270"]}, {"id": "P1270", "text": ["controller operates on the principle that the DC motor utilizes the positive half cycle of the input waveform."], "jumps": ["P1250", "P1280"]}, {"id": "P1280", "text": ["A DC motor treats this half cycle as a DC input."], "jumps": ["P1270", "P1290"]}, {"id": "P1290", "text": ["controller operates on the principle that the DC motor utilizes both half cycles of the input waveform."], "jumps": ["P1270", "P1300"]}, {"id": "P1300", "text": ["What does this waveform represent?........................."], "jumps": ["P1290"]}, {"id": "P1301", "text": [], "jumps": []}, {"id": "P1302", "text": ["Notice that only one alternation of the input voltage is used. This is not a 360"], "jumps": []}, {"id": "P1303", "text": ["controller but, notice there is 0 volts during the fire angle. This indicates the waveform is developed over the load."], "jumps": []}, {"id": "P1310", "text": ["The principle is that a SCR is used for a 180", "controller circuit and a TRIAC is used for a 360"], "jumps": ["P1520", "P1910"]}, {"id": "P1320", "text": ["The only difference is that the triangular input is first applied to a Schmitt Trigger to produce a square wave."], "jumps": ["P1098", "P1330"]}, {"id": "P1330", "text": ["Time control of a DC motor refers to changing a motor's _______"], "jumps": ["P1098"]}, {"id": "P1331", "text": [], "jumps": []}, {"id": "P1332", "text": ["Torque does vary as a result of time control since RPM, torque, power in, power out and motor currents are related. However, changes in torque are a result of what time control directly effects...."], "jumps": []}, {"id": "P1333", "text": ["Input power does vary as a result of time control since RPM, torque, power in, power out and motor currents are related. However, change in input power is a result of what time control directly effects..."], "jumps": []}, {"id": "P1340", "text": ["What is changing the ON time of a square wave input called?"], "jumps": ["P1330", "PWM", "PDM", "PAM"]}, {"id": "P1341", "text": [], "jumps": []}, {"id": "P1342", "text": ["Pulse amplitude modulation is changing the amplitude or voltage level of a motor applied voltage. This is not time control."], "jumps": []}, {"id": "P1343", "text": ["Pulse duration modulation changes the frequency of the voltage applied to a DC motor. Even though frequency and time are related, f = I"], "jumps": []}, {"id": "P1360", "text": ["The SCR, Q1, is in series with the applied voltage to the motor."], "jumps": ["P1370", "P1350", "P1360"]}, {"id": "P1370", "text": ["Variable resistor R2 controls the voltage and current to the gate of Q1, thus controlling when Q1 fires during the position of the input AC."], "jumps": ["P1350", "P1380"]}, {"id": "P1380", "text": ["In other words, changing the fire angle of the SCR changes the average DC applied to the motor."], "jumps": ["P1390", "P1350"]}, {"id": "PINFO", "text": ["02-15-01 Converted from SAM to tbk. frieda 02-22-01 Text and Branching. frieda 03-29-01 Graphics. Alexis 05-22-01 Fixed Branching in Theory - lisa 06-18-01 Touchups(Graphics). Alexis 07-19-01 Converted to ToolBook 8.1 format. jay 10-18-01 Fixed background for text. Jeff 01-14-02 Converted to Phase II format. jay 02-08-02 Review - rs 06-04-02 Review - lisa 12-17-03 Deleted experiment - frieda 01-26-04 Made text changes to P100, P1154, P1350, P1440, P1480, P10211. Made graphic changes to P1050, P1070, P1110-P1156 P1360, P1370, P1440, P1450, P1470, P1480, P1490 P1500 And tie points to schematics.", "02-15-01 Converted from SAM to tbk. frieda 02-22-01 Text and Branching. frieda 03-29-01 Graphics. Alexis 05-22-01 Fixed Branching in Theory - lisa 06-18-01 Touchups(Graphics). Alexis 07-19-01 Converted to ToolBook 8.1 format. jay 10-18-01 Fixed background for text. Jeff 01-14-02 Converted to Phase II format. jay 02-08-02 Review - rs 06-04-02 Review - lisa 12-17-03 Deleted experiment - frieda 01-26-04 Made text changes to P100, P1154, P1350, P1440, P1480, P10211. Made graphic changes to P1050, P1070, P1110-P1156 P1360, P1370, P1440, P1450, P1470, P1480, P1490 P1500 And tie points to schematics. - patty"], "jumps": []}, {"id": "P1390", "text": ["Notice that across the SCR, the applied voltage is felt when not conducting."], "jumps": ["P1350", "P1400"]}, {"id": "P1400", "text": ["This is because the SCR is like an open during non-conduction times."], "jumps": ["P1350", "P1410"]}, {"id": "P1410", "text": ["When the SCR is conducting, it is like a short (0 volts across it) and the voltage is developed across the motor."], "jumps": ["P1350", "P1230"]}, {"id": "P1420", "text": ["It may seem that applying a positive and negative DC average voltage will cause the motor to rotate back and fourth."], "jumps": ["P1242", "P1430"]}, {"id": "P1430", "text": ["Reversing the polarity on both the field windings and armature cause no direction change."], "jumps": ["P1242", "P1440"]}, {"id": "P1440", "text": ["This is a typical triac motor control circuit. that is used in the experiment."], "jumps": ["P1450", "P1242"]}, {"id": "P1450", "text": ["controller Triac, is in series to the voltage which is applied across the DC motor."], "jumps": ["P1440", "P1460"]}, {"id": "P1460", "text": ["The rest of the circuit ensures proper operation of the triac's gate through variable resistor R3."], "jumps": ["P1470", "P1440"]}, {"id": "P1470", "text": ["D1 is a bridge rectifier and D2 is a zener diode."], "jumps": ["P1440", "P1480"]}, {"id": "P1480", "text": ["R3 controls the amount of current and voltage applied to Q2, which changes the conduction angle (in respect to the applied voltage). Q2 is a field effect transistor."], "jumps": ["P1440", "P1490"]}, {"id": "P1490", "text": ["When Q2 turns ON, a pulse is applied through T1 to the gate of Q1. Q1 turns on applying power to the load."], "jumps": ["P1440", "P1500"]}, {"id": "P1500", "text": [], "jumps": ["P1510", "P1440"]}, {"id": "P1510", "text": ["Just like in the SCR, the Triac has the applied voltage across it when non-conducting and 0 volts when conducting."], "jumps": ["P1250", "P1440"]}, {"id": "P1520", "text": ["What does this waveform represent?........................."], "jumps": ["P1300"]}, {"id": "P1521", "text": [], "jumps": []}, {"id": "P1522", "text": ["controller but, notice there is 0 volts during the conduction angle. This indicates the waveform is developed over the Triac."], "jumps": []}, {"id": "P1523", "text": ["Notice that both alternations of the input voltage are used. This is not a 180"], "jumps": []}, {"id": "P1910", "text": ["This completes the information on THEORY OF OPERATION......"], "jumps": ["P1520", "P1001"]}, {"id": "P1920", "text": ["1. Time control of a DC motor refers to the time an input voltage is applied to the motor."], "jumps": ["P1001", "P1930"]}, {"id": "P1930", "text
