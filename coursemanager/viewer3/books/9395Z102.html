], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P100", "text": ["w Identify the basic autopilot components. w Describe the principles of operation of the autopilot....", "w Define and describe the primary flight controls of an aircraft w Define and describe the secondary flight controls of an aircraft. w Define and describe the auxiliary flight controls of an aircraft.."], "jumps": []}, {"id": "P1363", "text": ["Servo Tabs are used on stabilators to provide extra drag which prevents stabilator over adjustment.."], "jumps": []}, {"id": "P2970", "text": ["6.  The most common output elements used in aircrafts are                  electric motor servo actuators and electro/pneumatic servo            actuators.  They both perform the same tasks but operate               slightly different.", "6. The most common output elements used in aircrafts are electric motor servo actuators and electro/pneumatic servo actuators. They both perform the same tasks but operate slightly different."], "jumps": ["P2999", "P2960"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P1030", "text": ["Flight controls classified as primary are used to safely maneuver an aircraft about its three axes.  These controls include ailerons, elevators or stabilators and the rudder.", "4.  The sensing elements are normally the flight instruments                located in the cockpit of the plane, like the: directional                      indicator, turn-and-bank indicator, or the altitude indicator.", "Flight controls classified as primary are used to safely maneuver an aircraft about its three axes. These controls include ailerons, elevators or stabilators and the rudder.", "4. The sensing elements are normally the flight instruments located in the cockpit of the plane, like the: directional indicator, turn-and-bank indicator, or the altitude indicator."], "jumps": ["P1040", "P1020", "P2960", "P2940"]}, {"id": "P2940", "text": ["3.  The command elements are normally from one of two                       sources, manual or navigational.  This is where the autopilot          system receives its basic instructions from.", "1.  Autopilot functions can be very simple or very complex.                  Autopilots can be used to keep the aircraft on a specific                   heading without manual assistance.", "3. The command elements are normally from one of two sources, manual or navigational. This is where the autopilot system receives its basic instructions from.", "1. Autopilot functions can be very simple or very complex. Autopilots can be used to keep the aircraft on a specific heading without manual assistance."], "jumps": ["P2950", "P2930", "P2001"]}, {"id": "P10", "text": [], "jumps": []}, {"id": "P2292", "text": ["A computer is very important for an autopilot system that can land a plane.  The computer is used to sequence through events, and make calculations base on instrument data.  All of this is important for a proper landing sequence.", "A computer is very important for an autopilot system that can land a plane. The computer is used to sequence through events, and make calculations base on instrument data. All of this is important for a proper landing sequence."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on AUTOMATIC FLIGHT CONTROLS.", "This completes the information on AUTOMATIC FLIGHT CONTROLS."], "jumps": ["P2290"]}, {"id": "P2960", "text": ["5.  Not all autopilots use a computer to control the autopilot                 system, command signals are sent to an amplifier before they        are sent to the output elements.  However, on more complex          systems a computer is necessary to manipulate the data it              receives.", "5. Not all autopilots use a computer to control the autopilot system, command signals are sent to an amplifier before they are sent to the output elements. However, on more complex systems a computer is necessary to manipulate the data it receives."], "jumps": ["P2970", "P2950"]}, {"id": "P420", "text": ["Knowing how the flight controls are used and how they work is necessary to fully understand the operation of an aircraft.  Flight controls are one of the most important systems on an aircraft.", "Knowing how the flight controls are used and how they work is necessary to fully understand the operation of an aircraft. Flight controls are one of the most important systems on an aircraft."], "jumps": ["P430", "P400"]}, {"id": "P2270", "text": ["The electric servo actuator only uses electric signals to change the position of the flight controls.  The electro/pneumatic system uses electric signals and air pressure to change the position of the flight controls.", "Some autopilot systems are more complex and require a computer to manipulate the data it receives.  For example, an autopilot that was designed to land a plane needs a computer to perform all of the steps required for a proper landing sequence.", "The electric servo actuator only uses electric signals to change the position of the flight controls. The electro/pneumatic system uses electric signals and air pressure to change the position of the flight controls.", "Some autopilot systems are more complex and require a computer to manipulate the data it receives. For example, an autopilot that was designed to land a plane needs a computer to perform all of the steps required for a proper landing sequence."], "jumps": ["P2280", "P2260"]}, {"id": "P2250", "text": ["The signals from the computer or amplifier are then fed to the output elements.  The output elements are the devices which actually change the flight controls of the plane.", "The signals from the computer or amplifier are then fed to the output elements. The output elements are the devices which actually change the flight controls of the plane."], "jumps": ["P2260", "P2230"]}, {"id": "P2290", "text": ["An autopilot system does not need a computer for automatic landing?"], "jumps": ["P2260"]}, {"id": "P2291", "text": ["An autopilot system does not need a computer for automatic landing?"], "jumps": []}, {"id": "P2291", "text": ["The flight indicators in the cockpit are normally considered sensing elements.  Sensing elements are the directional indicator, turn and bank indicator and the attitude indicator.", "The flight indicators in the cockpit are normally considered sensing elements. Sensing elements are the directional indicator, turn and bank indicator and the attitude indicator."], "jumps": ["P2220", "P2180"]}, {"id": "P2260", "text": ["The most common output elements used in aircraft are electric motor servo actuators and electro/pneumatic servo actuators. They both perform the same tasks but operate slightly different."], "jumps": ["P2270", "P2230"]}, {"id": "P2160", "text": ["Now that we have looked at the autopilot control panel and its controls let's look at the elements that make a basic autopilot system."], "jumps": ["P2170", "P2150"]}, {"id": "P2150", "text": ["In the picture below, which control is used to change the pitch of the aircraft?"], "jumps": ["P2140"]}, {"id": "P2180", "text": ["The autopilot system receives its instructions from the command element.  The Omni/Heading Switch selects which command source to use, Manual or Navigational.", "The autopilot system receives its instructions from the command element. The Omni/Heading Switch selects which command source to use, Manual or Navigational."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["When the command source is set to Heading (HDG), commands to the autopilot are read from the control panel of the autopilot. When the command source is set to omni, commands are read from VOR system."], "jumps": ["P2210", "P2180"]}, {"id": "P2230", "text": ["Computing Systems are used to manipulate and address received data.   Some autopilot systems do not use computers, they send sensing and command signals to an amplifier then to the output elements.", "Computing Systems are used to manipulate and address received data. Some autopilot systems do not use computers, they send sensing and command signals to an amplifier then to the output elements."], "jumps": ["P2240", "P2210"]}, {"id": "P2100", "text": ["The Omni/Heading Switch tells the autopilot what mode of operation to use.  The Heading Mode (HDG) follows the information set by the autopilot control panel like heading, turn and pitch.", "The Altitude Hold Switch tells the autopilot to hold the plane at a current altitude.  This control is either ON or OFF.", "The Omni/Heading Switch tells the autopilot what mode of operation to use. The Heading Mode (HDG) follows the information set by the autopilot control panel like heading, turn and pitch.", "The Altitude Hold Switch tells the autopilot to hold the plane at a current altitude. This control is either ON or OFF."], "jumps": ["P2110", "P2050"]}, {"id": "P2130", "text": ["The Master Switch turns the autopilot ON and OFF.  If a malfunction occurs a manual switch is used to disengage the autopilot.", "The Master Switch turns the autopilot ON and OFF. If a malfunction occurs a manual switch is used to disengage the autopilot."], "jumps": ["P2140", "P2110"]}, {"id": "P2151", "text": ["The functions of an autopilot system can go anywhere from just a simple wing leveler to a system that can land a plane during zero visibility.  In any case, autopilots relieve the pilot from the  tedious control work involved with keeping the plane on its intended path.", "The functions of an autopilot system can go anywhere from just a simple wing leveler to a system that can land a plane during zero visibility. In any case, autopilots relieve the pilot from the tedious control work involved with keeping the plane on its intended path."], "jumps": ["P2050", "P2020"]}, {"id": "P2151", "text": [], "jumps": []}, {"id": "P2240", "text": ["Some autopilot systems are more complex and require a computer to manipulate the data it receives.  For example, an autopilot that was designed to land a plane needs a computer to perform all of the steps required for a proper landing sequence.", "Some autopilot systems are more complex and require a computer to manipulate the data it receives. For example, an autopilot that was designed to land a plane needs a computer to perform all of the steps required for a proper landing sequence."], "jumps": ["P2250", "P2230"]}, {"id": "P2280", "text": ["Systems will normally have one servo actuator for every flight control maneuvered by the autopilot.  The example below shows a generalized example of a servo actuator that is used to control the ailerons of a plane.", "Systems will normally have one servo actuator for every flight control maneuvered by the autopilot. The example below shows a generalized example of a servo actuator that is used to control the ailerons of a plane."], "jumps": ["P2290", "P2260"]}, {"id": "P2020", "text": ["Automatic flight control is also known as autopilot.  Autopilot systems automatically make adjustments to the aircraft controls during simple flight patterns or in complex multistage flight       procedures.", "Automatic flight control is also known as autopilot. Autopilot systems automatically make adjustments to the aircraft controls during simple flight patterns or in complex multistage flight procedures."], "jumps": ["P2030", "P2001"]}, {"id": "P2080", "text": ["The Heading Selector sets the heading for the autopilot.  If the Omni Heading Switch is activated the Heading Selector is disabled.  A small knob is attached to the Heading Selector for fine tuning adjustments.", "The Heading Selector sets the heading for the autopilot. If the Omni Heading Switch is activated the Heading Selector is disabled. A small knob is attached to the Heading Selector for fine tuning adjustments."], "jumps": ["P2090", "P2050"]}, {"id": "P2090", "text": ["The Altitude Hold Switch tells the autopilot to hold the plane at a current altitude.  This control is either ON or OFF.", "The Altitude Hold Switch tells the autopilot to hold the plane at a current altitude.  This control is either ON or OFF.", "The Altitude Hold Switch tells the autopilot to hold the plane at a current altitude. This control is either ON or OFF."], "jumps": ["P2100", "P2050"]}, {"id": "P1940", "text": ["3.  Auxiliary Flight Controls: These controls consist of the speed       brakes or spoilers, slats, flaps and slots.  These auxiliary flight      controls can be separated into two groups: lift increaser and         lift decreasers.  Lift increasers are the flaps, slots and slats.            Lift decreasers are speed brakes or spoilers.", "2.  Secondary Flight Controls: These flight controls consist of             trim tabs and spring tabs.  The trim tabs are used to allow the        pilot to adjust out any unbalanced conditions during flight,             while the spring tabs are used to aid the pilot in moving the            primary flight controls.", "3. Auxiliary Flight Controls: These controls consist of the speed brakes or spoilers, slats, flaps and slots. These auxiliary flight controls can be separated into two groups: lift increaser and lift decreasers. Lift increasers are the flaps, slots and slats. Lift decreasers are speed brakes or spoilers.", "2. Secondary Flight Controls: These flight controls consist of trim tabs and spring tabs. The trim tabs are used to allow the pilot to adjust out any unbalanced conditions during flight, while the spring tabs are used to aid the pilot in moving the primary flight controls."], "jumps": ["P1999", "P1920"]}, {"id": "P1920", "text": ["1.  Primary Flight Controls: These flight controls consist of the           ailerons, elevators or stabilators and the rudder.  They are              used to safely maneuver an aircraft about its three axes.", "1. Primary Flight Controls: These flight controls consist of the ailerons, elevators or stabilators and the rudder. They are used to safely maneuver an aircraft about its three axes."], "jumps": ["P1930", "P1001"]}, {"id": "P2800", "text": [], "jumps": []}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2070", "text": ["The plane is turned by using the Turn Control.  If the omni heading switch is activated the Turn Control is disabled.  A turn is fine tuned by a Trim Adjustment.", "The plane is turned by using the Turn Control. If the omni heading switch is activated the Turn Control is disabled. A turn is fine tuned by a Trim Adjustment."], "jumps": ["P2080", "P2050"]}, {"id": "P1930", "text": ["2.  Secondary Flight Controls: These flight controls consist of             trim tabs and spring tabs.  The trim tabs are used to allow the        pilot to adjust out any unbalanced conditions during flight,             while the spring tabs are used to aid the pilot in moving the            primary flight controls.", "2. Secondary Flight Controls: These flight controls consist of trim tabs and spring tabs. The trim tabs are used to allow the pilot to adjust out any unbalanced conditions during flight, while the spring tabs are used to aid the pilot in moving the primary flight controls."], "jumps": ["P1940", "P1920"]}, {"id": "P1492", "text": ["Remember, the slat is normally located on the leading edge of a wing, not the trailing edge."], "jumps": []}, {"id": "P1493", "text": ["The slot is a fixed control, it does not move downward.  A slot is actually an absence that is used to smooth air flow over the wing.", "The slot is a fixed control, it does not move downward. A slot is actually an absence that is used to smooth air flow over the wing."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1920"]}, {"id": "P2060", "text": ["The Pitch Control is used to change the planes position in its pitch axis.  The Pitch Trim Adjust is used to fine tune the adjustment of the pitch.", "The Pitch Control is used to change the planes position in its pitch axis. The Pitch Trim Adjust is used to fine tune the adjustment of the pitch."], "jumps": ["P2070", "P2050"]}, {"id": "P1472", "text": ["When these plates are used with ailerons to bank the aircraft they are called spoilers.  The movement of the spoiler is normally automatic and dependent on the position of the ailerons.", "When these plates are used with ailerons to bank the aircraft they are called spoilers. The movement of the spoiler is normally automatic and dependent on the position of the ailerons."], "jumps": ["P1475", "P1480", "P1460"]}, {"id": "P1460", "text": ["Speed brakes, also known as spoilers, are located on the upper surface of the wing.  They move upward to disturb the flow of air across the wing, increasing drag and decreasing lift.", "Speed brakes, also known as spoilers, are located on the upper surface of the wing. They move upward to disturb the flow of air across the wing, increasing drag and decreasing lift."], "jumps": ["P1470", "P1430"]}, {"id": "P1490", "text": ["What is the name of the auxiliary flight control, located on the trailing edge of a wing, that by moving downward increases the lift on a plane, while at the same time increases drag?"], "jumps": ["P1460"]}, {"id": "P1491", "text": [], "jumps": []}, {"id": "P1426", "text": ["At high angles of attack the air flow starts to become rough and air burbles or eddys over the wing.  This causes the nose of the aircraft to drop and the aircraft stalls.  Slots help reduce the aircraft's stall speed and allow slower cruising speeds.", "At high angles of attack the air flow starts to become rough and air burbles or eddys over the wing. This causes the nose of the aircraft to drop and the aircraft stalls. Slots help reduce the aircraft's stall speed and allow slower cruising speeds."], "jumps": ["P1430", "P1425"]}, {"id": "P1440", "text": ["Slats help to decrease the stall speed of the plane.  One functional difference between the slot and slat is that the slat is adjustable and the plain slot is normally fixed.", "Slats help to decrease the stall speed of the plane.  One functional difference between the slot and slat is that the slat is adjustable and the plain slot is normally fixed.", "Slats help to decrease the stall speed of the plane. One functional difference between the slot and slat is that the slat is adjustable and the plain slot is normally fixed."], "jumps": ["P1450", "P1430"]}, {"id": "P1420", "text": ["Below are some examples of common flaps.  Notice that one of the flaps is slotted.  Slots allow a smooth flow of air between different sections of the wing which increase the effectiveness of the wing.", "When landing, flaps reduce the landing speed shortening the length of landing rollout.  This makes landing in small or obstructed areas possible because it allows the glide angle to increase without greatly increasing approach speed.", "Below are some examples of common flaps. Notice that one of the flaps is slotted. Slots allow a smooth flow of air between different sections of the wing which increase the effectiveness of the wing.", "Flap Type Retracted Extended Plain Fowler Slotted Split", "When landing, flaps reduce the landing speed shortening the length of landing rollout. This makes landing in small or obstructed areas possible because it allows the glide angle to increase without greatly increasing approach speed."], "jumps": ["P1425", "P1390", "P1420"]}, {"id": "P1450", "text": ["Slats also change the camber of the wing.  This is helpful for take off and landing of the plane.  Now that we have looked at the lift increasers, let's look at a lift decreaser called speed brakes.", ers and two different types of lift decreasers.", "Lift Decreasers Speed Brakes Spoilers sssss"], "jumps": ["P1390", "P1370"]}, {"id": "P1370", "text": ["Auxiliary flight controls consist of the speed brakes or spoilers, slats, flaps and slots."], "jumps": ["P1380", "P1360"]}, {"id": "P1400", "text": ["Flaps only move down.  By changing the position of the flap, lift and drag are affected; lift increases and drag decreases. During take off and climbing the flaps are positioned for maximum lift and minimal drag.", "Flaps only move down. By changing the position of the flap, lift and drag are affected; lift increases and drag decreases. During take off and climbing the flaps are positioned for maximum lift and minimal drag."], "jumps": ["P1410", "P1390"]}, {"id": "P2930", "text": ["2.  There are four different elements concerning the makeup of           an autopilot system:  command, sensing, computing and                output.", "2. There are four different elements concerning the makeup of an autopilot system: command, sensing, computing and output."], "jumps": ["P2940", "P2920"]}, {"id": "P1360", "text": ["Which tab type is used to aid the pilot in moving primary flight controls?"], "jumps": ["P1350"]}, {"id": "P2170", "text": ["There are four different elements concerning the makeup of an autopilot system.  They are:  command, sensing, computing and output.", "There are four different elements concerning the makeup of an autopilot system. They are: command, sensing, computing and output."], "jumps": ["P2180", "P2160"]}, {"id": "P1300", "text": ["A rudder trim tab is normally located on the bottom edge of the rudder.  This trim tab can be adjusted by a wheel or crank when the aircraft is on the ground or in the air.  The purpose of the rudder trim tab is to relieve pressure on the cockpit rudder pedals.", "A rudder trim tab is normally located on the bottom edge of the rudder. This trim tab can be adjusted by a wheel or crank when the aircraft is on the ground or in the air. The purpose of the rudder trim tab is to relieve pressure on the cockpit rudder pedals."], "jumps": ["P1310", "P1280"]}, {"id": "P1410", "text": ["When landing, flaps reduce the landing speed shortening the length of landing rollout.  This makes landing in small or obstructed areas possible because it allows the glide angle to increase without greatly increasing approach speed.", "When landing, flaps reduce the landing speed shortening the length of landing rollout. This makes landing in small or obstructed areas possible because it allows the glide angle to increase without greatly increasing approach speed."], "jumps": ["P1420", "P1390"]}, {"id": "P1425", "text": ["Slots are placed on the leading edge of the wing.  Slots allow smooth air flow across the wing.", "Slots are placed on the leading edge of the wing. Slots allow smooth air flow across the wing."], "jumps": ["P1426", "P1420"]}, {"id": "P1430", "text": ["Slats are movable surfaces which are connected to the front or leading edge of a wing.  When the slat is closed it forms the leading edge of the wing.  When open it creates a slot in the leading edge of the wing.", "Slats are movable surfaces which are connected to the front or leading edge of a wing. When the slat is closed it forms the leading edge of the wing. When open it creates a slot in the leading edge of the wing."], "jumps": ["P1440", "P1426"]}, {"id": "P1480", "text": ["When these plates are used to slow the plane down and decrease the lift they are known as speed brakes.  There is a separate control in the cockpit for using these plates as speed brakes.  In this mode of operation all plates are deflected upward.", "When these plates are used to slow the plane down and decrease the lift they are known as speed brakes. There is a separate control in the cockpit for using these plates as speed brakes. In this mode of operation all plates are deflected upward."], "jumps": ["P1490", "P1460"]}, {"id": "P1910", "text": ["This completes the information on MANUAL FLIGHT CONTROLS.", "During maneuvers pressure is placed on the aileron.  The aileron trim tab moves in the opposite direction of the aileron relieving pressure.  In effect, the trim tab provides fine tuning of the force and pressure applied to the aileron.", "This completes the information on MANUAL FLIGHT CONTROLS...", "During maneuvers pressure is placed on the aileron. The aileron trim tab moves in the opposite direction of the aileron relieving pressure. In effect, the trim tab provides fine tuning of the force and pressure applied to the aileron."], "jumps": ["P1500"]}, {"id": "P1361", "text": [], "jumps": []}, {"id": "P1500", "text": ["As you can see, the manual flight controls are important to the proper operation of an airplane.  Some planes may not use all the flight controls discussed and some controls may look slightly different but the operation and purpose is basically the same.", "As you can see, the manual flight controls are important to the proper operation of an airplane. Some planes may not use all the flight controls discussed and some controls may look slightly different but the operation and purpose is basically the same."], "jumps": ["P1910", "P1490"]}, {"id": "P2130", "text": ["The Master Switch turns the autopilot ON and OFF.  If a malfunction occurs a manual switch is used to disengage the autopilot.", "The Master Switch turns the autopilot ON and OFF. If a malfunction occurs a manual switch is used to disengage the autopilot."], "jumps": ["P2140", "P2110"]}, {"id": "P2140", "text": ["In the picture below, which control is used to change the heading of the aircraft?"], "jumps": ["P2130"]}, {"id": "P2220", "text": ["These indicators sense movement in the plane and relay signals to the computing elements keeping the plane on the correct heading."], "jumps": ["P2230", "P2210"]}, {"id": "P1222", "text": ["The ailerons are used to roll the plane in the roll axis, not to adjust the pitch of the aircraft."], "jumps": []}, {"id": "P1230", "text": ["Recall that the secondary flight controls consist of trim tabs and spring tabs.  The pilot uses trim tabs to maintain balanced flight conditions.  Spring tabs are used to help the pilot move the primary flight controls.", "Recall that the secondary flight controls consist of trim tabs and spring tabs. The pilot uses trim tabs to maintain balanced flight conditions. Spring tabs are used to help the pilot move the primary flight controls."], "jumps": ["P1240", "P1220"]}, {"id": "P1260", "text": ["During maneuvers pressure is placed on the aileron.  The aileron trim tab moves in the opposite direction of the aileron relieving pressure.  In effect, the trim tab provides fine tuning of the force and pressure applied to the aileron.", "During maneuvers pressure is placed on the aileron. The aileron trim tab moves in the opposite direction of the aileron relieving pressure. In effect, the trim tab provides fine tuning of the force and pressure applied to the aileron."], "jumps": ["P1270", "P1250"]}, {"id": "P1181", "text": ["Depressing the right pedal causes the rudder to move right, the nose to move right and the tail to move left."], "jumps": ["P1190", "P1180"]}, {"id": "P1200", "text": ["There is also another type of tail assembly known as a ruddervator.  This system replaces the rudder, elevator and stabilator three surface design with a two surface design in the shape of a V.", "There is also another type of tail assembly known as a ruddervator. This system replaces the rudder, elevator and stabilator three surface design with a two surface design in the shape of a V."], "jumps": ["P1210", "P1180"]}, {"id": "P1170", "text": ["The rudder is located at the tail end of the plane and is attached to a vertical stabilizer, also known as a fin.  The rudder is used to maneuver the plane on the yaw axis.  The rudder is controlled by two foot pedals in the cockpit.", "The rudder is located at the tail end of the plane and is attached to a vertical stabilizer, also known as a fin. The rudder is used to maneuver the plane on the yaw axis. The rudder is controlled by two foot pedals in the cockpit."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["When the left pedal is depressed the rudder moves left.  This causes the nose of the plane to move left and the tail to move right.", "When the left pedal is depressed the rudder moves left. This causes the nose of the plane to move left and the tail to move right."], "jumps": ["P1181", "P1170"]}, {"id": "P1310", "text": ["The last type of secondary flight control that we will talk about is the spring tab.  Remember, spring tabs are used to aid the pilot in moving the primary flight controls.", "The last type of secondary flight control that we will talk about is the spring tab. Remember, spring tabs are used to aid the pilot in moving the primary flight controls."], "jumps": ["P1320", "P1300"]}, {"id": "P1223", "text": ["The rudder is used to adjust the plane in the yaw axis, not to adjust the pitch of the aircraft."], "jumps": []}, {"id": "P1270", "text": ["Elevator trim tabs are normally located on the inner edge of the tail stabilizers.  Just as with the aileron trim tabs, these tabs relieve pressure on the elevators.  These trim tabs can be adjusted while the aircraft is on the ground or in the air by a crank or wheel adjustment depending on the type of plane.", "Elevator trim tabs are normally located on the inner edge of the tail stabilizers. Just as with the aileron trim tabs, these tabs relieve pressure on the elevators. These trim tabs can be adjusted while the aircraft is on the ground or in the air by a crank or wheel adjustment depending on the type of plane."], "jumps": ["P1280", "P1250"]}, {"id": "P1120", "text": ["Elevators are mounted on a stabilizer.  A stabilizer is a small stationary wing located at the tail end of the plane.  The stabilizer is stationary while the elevators move to change the pitch of the plane.  When the yoke is pulled back the elevators move up. When the yoke is pushed forward the elevators are moved down.", "Elevators are mounted on a stabilizer. A stabilizer is a small stationary wing located at the tail end of the plane. The stabilizer is stationary while the elevators move to change the pitch of the plane. When the yoke is pulled back the elevators move up. When the yoke is pushed forward the elevators are moved down."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["A stabilator is a small wing located at the tail end of the plane that moves up and down to change the pitch of the plane.  The entire stabilator moves up and down, not just a portion of it like the elevators.", "A stabilator is a small wing located at the tail end of the plane that moves up and down to change the pitch of the plane. The entire stabilator moves up and down, not just a portion of it like the elevators."], "jumps": ["P1140", "P1120"]}, {"id": "P1330", "text": ["When the aileron moves upward, the push-rod moves, which causes the spring to move.  The force applied to the spring then moves the spring tab.  The distance the spring tab moves depends on the distance that the aileron is moved.", "When the aileron moves upward, the push-rod moves, which causes the spring to move. The force applied to the spring then moves the spring tab. The distance the spring tab moves depends on the distance that the aileron is moved."], "jumps": ["P1350", "P1310"]}, {"id": "P1101", "text": ["In the same respect, turning the yoke right causes the left wing to have more lift and the right wing to have less lift rotating the plane in the opposite direction.  Note that a plane will continue to roll until the controls have been adjusted to a neutral position.", "In the same respect, turning the yoke right causes the left wing to have more lift and the right wing to have less lift rotating the plane in the opposite direction. Note that a plane will continue to roll until the controls have been adjusted to a neutral position..", "Generalized Aileron Movement with Yoke Turned Left"], "jumps": ["P1110", "P1091", "P1105"]}, {"id": "P1160", "text": ["By adjusting the elevators or stabilators and the throttle, climbs and descents can be accomplished.  The throttle is a control used to adjust the engine speed.", "By adjusting the elevators or stabilators and the throttle, climbs and descents can be accomplished. The throttle is a control used to adjust the engine speed."], "jumps": ["P1170", "P1150"]}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1091", "text": ["This aileron movement causes the right wing to have more lift and the left wing to have less lift, rotating the plane to the left.", "Generalized Aileron Movement with Yoke Turned Left"], "jumps": ["P1100", "P1090"]}, {"id": "P1100", "text": ["In the same respect, turning the yoke right causes the left wing to have more lift and the right wing to have less lift rotating the plane in the opposite direction.  Note that a plane will continue to roll until the controls have been adjusted to a neutral position.", "In the same respect, turning the yoke right causes the left wing to have more lift and the right wing to have less lift rotating the plane in the opposite direction. Note that a plane will continue to roll until the controls have been adjusted to a neutral position.", "Generalized Aileron Movement with Yoke Turned Left"], "jumps": ["P1110", "P1091", "P1105"]}, {"id": "P1150", "text": ["Like the ailerons, these controls also use a series of cables, pulleys and bellcranks for adjustment.  The main function of the elevators and stabilators is to control the pitch of the wings.", "Like the ailerons, these controls also use a series of cables, pulleys and bellcranks for adjustment. The main function of the elevators and stabilators is to control the pitch of the wings."], "jumps": ["P1160", "P1140"]}, {"id": "P1080", "text": ["Ailerons are located on the far rear of each wing.  They are used to rotate the aircraft around the roll axis.  Both ailerons are controlled at the same time with the use of the yoke and associated pulleys, cables and bellcranks.", "Ailerons are located on the far rear of each wing. They are used to rotate the aircraft around the roll axis. Both ailerons are controlled at the same time with the use of the yoke and associated pulleys, cables and bellcranks."], "jumps": ["P1085", "P1090", "P1060"]}, {"id": "P1105", "text": ["YOKE MOVEMENT - By turning the yoke right the right aileron moves up and the left aileron moves down."], "jumps": []}, {"id": "P1280", "text": ["Anti-servo tabs are located on the back edge of a stabilator. These tabs cause extra drag when the pilot moves the stabilator. Because stabilators can be moved by small control movements, over adjustments would be unavoidable without Anti-servo tabs. The purpose for this extra drag is to keep the pilot from over adjusting the stabilator.", "y controls. Secondary controls include trim tabs and spring tabs."], "jumps": ["P1290", "P1270"]}, {"id": "P1210", "text": ["The ruddervator's advantage is less drag and weight.  Drag is the amount of resistance caused by the aircraft moving through the air.", "The ruddervator's advantage is less drag and weight. Drag is the amount of resistance caused by the aircraft moving through the air."], "jumps": ["P1220", "P1200"]}, {"id": "P1020", "text": ["There are three different types of flight controls in an aircraft: primary, secondary and auxiliary.  These systems are used together to maneuver and stabilize an aircraft while in flight.", "There are three different types of flight controls in an aircraft: primary, secondary and auxiliary. These systems are used together to maneuver and stabilize an aircraft while in flight."], "jumps": ["P1030", "P1001"]}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P1290", "text": ["Anti-servo tabs automatically change position when the stabilator is adjusted, there is not a separate control for the tabs. Notice how the position of the anti-servo tabs change in respect to the stabilator position."], "jumps": ["P1300", "P1280"]}, {"id": "P1320", "text": ["Most spring controls are adjusted automatically when the associated primary control is adjusted.  For example, on some ailerons a spring and push-rod assembly are attached to the aileron and a spring tab.", "Knowing how the flight controls are used and how they work is necessary to fully understand the operation of an aircraft.  Flight controls are one of the most important systems on an aircraft.", "Most spring controls are adjusted automatically when the associated primary control is adjusted. For example, on some ailerons a spring and push-rod assembly are attached to the aileron and a spring tab.", "Knowing how the flight controls are used and how they work is necessary to fully understand the operation of an aircraft. Flight controls are one of the most important systems on an aircraft."], "jumps": ["P1330", "P1310"]}, {"id": "P1040", "text": ["The secondary controls improve performance, stability and relieve excess forces, on the primary controls.  Secondary controls include trim tabs and spring tabs.", "The secondary controls improve performance, stability and relieve excess forces, on the primary controls. Secondary controls include trim tabs and spring tabs."], "jumps": ["P1050", "P1020"]}, {"id": "P400", "text": ["Flight control systems are used to control the movement and stability of an aircraft while in flight."], "jumps": ["P410", "P300"]}, {"id": "P1190", "text": ["The rudder is mainly used with the ailerons to assist in making turns during flight.  Like the other primary controls, the rudder also uses pulleys, cables and bellcranks to achieve desired          movement.", "The rudder is mainly used with the ailerons to assist in making turns during flight. Like the other primary controls, the rudder also uses pulleys, cables and bellcranks to achieve desired movement."], "jumps": ["P1200", "P1180"]}, {"id": "P410", "text": ["Pilots can navigate aircraft by using either manual or automatic controls."], "jumps": ["P420", "P400"]}, {"id": "P430", "text": ["Let's begin the lesson on FLIGHT CONTROL SYSTEMS..........................", "Nida Corporation - Flight Control Systems"], "jumps": ["P400"]}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: FLIGHT CONTROL SYSTEMSf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P1240", "text": ["Trim tabs can be located on the ailerons, elevators, stabilators, and the rudder.  In most aircraft the settings for the trim tabs can be set with either a wheel or a crank.  Let's look at some of the different types of trim tabs.", "Trim tabs can be located on the ailerons, elevators, stabilators, and the rudder. In most aircraft the settings for the trim tabs can be set with either a wheel or a crank. Let's look at some of the different types of trim tabs."], "jumps": ["P1250", "P1230"]}, {"id": "P1220", "text": ["Which primary control is used to adjust the pitch of the aircraft?"], "jumps": ["P1200"]}, {"id": "P1800", "text": ["Nida Corporation - Flight Control Systems", "You have successfully passed the assessment test!"], "jumps": []}, {"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 02-21-00 Changed copyright date on page Q0 to 1999-2000. Penny 03-09-00 Changed the red mat on the main wi n, speed and strength of force. The example below shows the change of direction in the force of a cable."], "jumps": []}, {"id": "P2030", "text": ["On smaller planes, autopilots normally control flight in only one axis of movement, in most cases the roll axis.  On other planes, the autopilot may control all three axes of movement:  roll, pitch and yaw.", "On smaller planes, autopilots normally control flight in only one axis of movement, in most cases the roll axis. On other planes, the autopilot may control all three axes of movement: roll, pitch and yaw."], "jumps": ["P2040", "P2020"]}, {"id": "P2050", "text": ["The picture below illustrates a basic autopilot control panel.  Let's look at the function of each control located on this panel and how it would be used by the pilot.", "The picture below illustrates a basic autopilot control panel. Let's look at the function of each control located on this panel and how it would be used by the pilot."], "jumps": ["P2060", "P2040"]}, {"id": "P2110", "text": ["When Omni Range is used the autopilot follows the navigational information from the omni range receiver.  The omni range receiver sets headings based on radio signals known as radials.", "When Omni Range is used the autopilot follows the navigational information from the omni range receiver. The omni range receiver sets headings based on radio signals known as radials.", "Omni Range Receiver & Course Selector (VOR System)"], "jumps": ["P2120", "P2050"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")", ":$ R R R R R R R R R R R R R R R R R R R 'A", "\"You have successfully passed the assessment"], "jumps": []}, {"id": "P2260", "text": ["The most common output elements used in aircraft are electric motor servo actuators and electro/pneumatic servo actuators. They both perform the same tasks but operate slightly different.", "4 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
