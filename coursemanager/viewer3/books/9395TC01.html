Hoses are usually flexible."], "jumps": ["P3100"]}, {"id": "P3120", "text": ["Tubing is made from the same substances as piping, but is smaller and may be rigid or flexible."], "jumps": ["P3100"]}, {"id": "P3110", "text": ["Piping can be made out of various substances, depending on what it will transport. They can be made out of PVC (plastic), iron, stainless steel, and copper to name a few. Piping is usually not flexible."], "jumps": ["P3100"]}, {"id": "P3100", "text": ["The lines that represent the different system components may be a combination of pipes, tubes, or hoses."], "jumps": ["P3090"]}, {"id": "P3094", "text": ["This is the schematic symbol for a pressure gauge.........."], "jumps": []}, {"id": "P3093", "text": ["This is the schematic symbol for a flow control valve......"], "jumps": []}, {"id": "P3092", "text": ["This is the schematic symbol for a gasoline motor.........."], "jumps": []}, {"id": "P3091", "text": [], "jumps": []}, {"id": "P3090", "text": ["Select the schematic symbol for an electric motor.is ___________"], "jumps": ["P3070"]}, {"id": "P3070", "text": ["Symbols for other types of pumps used in hydraulic systems are shown below."], "jumps": ["P3020"]}, {"id": "P3062", "text": ["This is the symbol for a flow control valve.n gpm, varies according to the used. The one depicted in the block diagram is a common rotary pump."], "jumps": ["P3020"]}, {"id": "P3060", "text": ["The symbol for a pump, along with the output in gpm, varies according to the used. The one depicted in the block diagram is a common rotary pump."], "jumps": ["P3020"]}, {"id": "P3050", "text": ["If the motor was a gasoline motor, it would be represented like this."], "jumps": ["P3020"]}, {"id": "P3040", "text": ["The schematic symbol for an electric motor in the block diagram is shown below."], "jumps": ["P3020"]}, {"id": "P3030", "text": ["The schematic symbol for a reservoir is highlighted."], "jumps": ["P3020"]}, {"id": "P3020", "text": ["Examine the block diagram for a basic hydraulic system....."], "jumps": ["P3030", "P3001"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2980"]}, {"id": "P2990", "text": ["8. Actuators use the system pressure to perform work, either linear or rotary motion."], "jumps": ["P2980", "P2999"]}, {"id": "P2980", "text": ["7. Gauges in a hydraulic system are there to visually check the pressure at different locations throughout the hydraulic system.."], "jumps": ["P2990", "P2970"]}, {"id": "P2970", "text": ["6. Lines, pipes, and hoses transport the fluid from component to component. They can also be used to change the pressure of a system at any point. Piping Tubing Hosing", "5. Valves are used throughout the system to control pressure, direction, velocity, and isolation."], "jumps": ["P2960", "P2980", "P2970", "P2950"]}, {"id": "P2950", "text": ["4. An accumulator applies force to the fluid, releases and stores energy, and absorbs any shocks or surges in the hydraulic system."], "jumps": ["P2960", "P2940"]}, {"id": "P2940", "text": ["3. When a pump is connected to a motor, they both provide the fluid motion. The fluid motion creates pressure in the hydraulic system.", "2. Many different types of motors can be used as prime movers."], "jumps": ["P2950", "P2930", "P2940", "P2920"]}, {"id": "P2920", "text": ["1. Reservoirs store, cool, and filter contaminants.ere...."], "jumps": ["P2930", "P2001"]}, {"id": "P2910", "text": ["This completes the information on HYDRAULIC SYSTEM COMPONENTS.", "Now that all the components have been added you have a complete basic hydraulic system."], "jumps": ["P2460", "P2910", "P2450", "P"]}, {"id": "P2454", "text": ["The reservoir stores, cools and filters contaminants......."], "jumps": []}, {"id": "P2453", "text": ["The pump when connected to the motor provides the fluid motion in the hydraulic system."], "jumps": []}, {"id": "P2452", "text": ["The motor is the prime mover in this hydraulic system, it provides the mechanical energy."], "jumps": []}, {"id": "P2451", "text": [], "jumps": []}, {"id": "P2450", "text": ["The pressure relief valve senses the excess pressure and allows the fluid to pass through back into the _______"], "jumps": ["P2440"]}, {"id": "P2440", "text": ["The reservoir collects the hydraulic fluid and the process starts over again, until the motor is turned off."], "jumps": ["P2430", "P2450"]}, {"id": "P2430", "text": ["The fluid flows through the 4-way directional valve again on its way back to the reservoir.", "As the flow control valve is turned, the rod constricts the opening of the valve. This causes the fluid to flow faster."], "jumps": ["P2440", "P2390", "P2430", "P2370", "P"]}, {"id": "P2380", "text": ["The Flow Control Valve regulates the actuator speed by controlling the pressure in the line..."], "jumps": ["P2390", "P2370"]}, {"id": "P2370", "text": ["The actuator output flows through the flow control valve and back to the 4-way directional valve.", "From 4-Way directional valve Passage A.", "Fluid from the outlet port passes a pressure gauge. The pressure exerted by the extended piston can be visually checked."], "jumps": ["P2380", "P2360", "P2370", "P2350"]}, {"id": "P2350", "text": ["A motor actuator provides rotary motion. The fluid enters the inlet port and causes the rotating element to turn.", "From 4-Way directional valve Passage A.", "The fluid now enters the inlet port of the actuator which pushes the piston out of the cylinder. This actuator provides linear motion."], "jumps": ["P2360", "P2340", "P2350", "P2320"]}, {"id": "P2330", "text": ["The 4-way directional control valve directs the fluid flow in either direction to the actuator, allowing 2-way action from the actuator."], "jumps": ["P2340", "P2320"]}, {"id": "P2320", "text": ["The 4-way directional valve allows the fluid to flow toward the actuator."], "jumps": ["P2330", "P2310"]}, {"id": "P2314", "text": ["It also applies force to fluids and regulates hydraulic system pressure."], "jumps": []}, {"id": "P2313", "text": ["It also applies force to fluids and absorbs shocks or surges in the hydraulic system."], "jumps": []}, {"id": "P2312", "text": ["It also regulates the pressure and absorbs shocks or surges in the hydraulic system."], "jumps": []}, {"id": "P2311", "text": [], "jumps": []}, {"id": "P2310", "text": ["The accumulator is used to _______........................."], "jumps": ["P2300"]}, {"id": "P2300", "text": ["This allows fluid to flow through the valve and back to the reservoir, reducing the system pressure to a safe, pre-determined level."], "jumps": ["P2310", "P2280"]}, {"id": "P2290", "text": ["The tension on the spring is calibrated for a specific pressure. Once that pressure is exceeded, the spring tension is overcome."], "jumps": ["P2280", "P2300"]}, {"id": "P2280", "text": ["The pressure relief valve also senses the hydraulic pressure coming into its high pressure port."], "jumps": ["P2290", "P2250"]}, {"id": "P2270", "text": ["The extra capacity of the accumulator allows it to regulate the pressure and to absorb any surges or shocks in the hydraulic system."], "jumps": ["P2250", "P2280"]}, {"id": "P2260", "text": ["The accumulator also applies force to fluids by storing or releasing pressure as needed.", "The accumulator senses the pressure from the supply line. It is designed to regulate, maintain and store the hydraulic pressure."], "jumps": ["P2250", "P2270", "P2260", "P2240"]}, {"id": "P2240", "text": ["The fluid flows to the accumulator and the pressure relief valve."], "jumps": ["P2250", "P2230"]}, {"id": "P2230", "text": ["The fluid is transported by lines. Lines are constructed from pipes, tubes, or hoses."], "jumps": ["P2220", "P2240"]}, {"id": "P2222", "text": ["When the motor and pump are activated they provide the fluid motion that creates the pressure in the hydraulic system."], "jumps": []}, {"id": "P2221", "text": [], "jumps": []}, {"id": "P2220", "text": ["When the motor and pump are activated they _______........."], "jumps": ["P2210"]}, {"id": "P2210", "text": ["In many cases, the motor and pump are enclosed in one single housing."], "jumps": ["P2220", "P2190"]}, {"id": "P2200", "text": ["Remember, fluid flow provides the pressure in the hydraulic system.", "The pump has vanes inside which start the fluid flow when turned."], "jumps": ["P2190", "P2210", "P2200", "P2184"]}, {"id": "P2184", "text": ["Only light pressure is needed to open the check valve in one direction but no amount of pressure in the opposite direction will open the valve.lve."], "jumps": ["P2190", "P2182"]}, {"id": "P2182", "text": ["t. Fluid flow in one direction is maintained as fluid flow in the opposite direction only seats the poppe", "The check valve has an internal spring which keeps the poppet seated at the inlet. Fluid flow in one direction is maintained as fluid flow in the opposite direction only seats the poppet tighter."], "jumps": ["P2184", "P2180"]}, {"id": "P2180", "text": ["The motor shaft is connected to the pump's linkage. As the shaft rotates, the pump draws fluid from the reservoir through the one-way check valve."], "jumps": ["P2182", "P2170"]}, {"id": "P2170", "text": ["When the motor is turned ON, the shaft begins to rotate...."], "jumps": ["P2160", "P2180"]}, {"id": "P2160", "text": ["Remember that a prime mover provides the mechanical energy in a hydraulic system."], "jumps": ["P2170", "P2150"]}, {"id": "P2150", "text": ["There are many types of motors such as electrical, gasoline, diesel, or hydraulic. This example uses an electrical motor."], "jumps": ["P2140", "P2160"]}, {"id": "P2140", "text": ["The next component we will discuss is the motor. This is the prime mover in our basic hydraulic system."], "jumps": ["P2150", "P2130"]}, {"id": "P2134", "text": ["A pressure gauge is a visual check of the pressure anywhere along the hydraulic system."], "jumps": []}, {"id": "P2133", "text": ["A directional valve channels the fluid to different locations."], "jumps": []}, {"id": "P2132", "text": ["A reservoir stores fluid, but it also filters contaminants and cools the fluid."], "jumps": []}, {"id": "P2131", "text": [], "jumps": []}, {"id": "P2130", "text": ["A reservoir stores hydraulic fluid, but it also filters contaminants and _______"], "jumps": ["P2120"]}, {"id": "P2120", "text": ["Checking and changing the fluid level at regular intervals is recommended to keep the viscosity of the hydraulic fluid at its intended rating.", "As a result, the overall system performance may be decreased."], "jumps": ["P2130", "P2110", "P2120", "P2100"]}, {"id": "P2100", "text": ["Valves and actuators may also begin sticking in place due to lack of lubrication, corrosion, or water absorption."], "jumps": ["P2110", "P2090"]}, {"id": "P2090", "text": ["Parts depending on hydraulic fluid for lubrication can be damaged if the viscosity of the hydraulic fluid is reduced by overheating.", "If the hydraulic fluid gets too hot, the viscosity can be reduced. This can effect the fluid's rate of flow and its lubricating properties."], "jumps": ["P2080", "P2100"]}, {"id": "P2085", "text": ["The heat from this cup of coffee scatters, or dissipates into the atmosphere, eventually leaving the coffee cold.", "DISSIPATE - To drive away, disburse, or scatter."], "jumps": []}, {"id": "P2080", "text": ["If the fluid level in the reservoir is low or nearly empty, the cooling process will be effected. It will be difficult for the heat to dissipate."], "jumps": ["P2085", "P2090", "P2050"]}, {"id": "P2070", "text": ["The sight glass provides a visual indication of how much hydraulic fluid is in the reservoir."], "jumps": ["P2050", "P2080"]}, {"id": "P2060", "text": ["Another function of the reservoir includes filtering contaminants from the fluid and cooling the fluid."], "jumps": ["P2050", "P2070"]}, {"id": "P2050", "text": ["A reservoir stores hydraulic fluid........................."], "jumps": ["P2060", "P2020"]}, {"id": "P2040", "text": ["Describing a reservoir is a good place to begin."], "jumps": ["P2050", "P2020"]}, {"id": "P2030", "text": ["This is a block diagram of a hydraulic system's and of how they are connected."], "jumps": ["P2020", "P2040"]}, {"id": "P2020", "text": ["A basic hydraulic system consists of the following components."], "jumps": ["P2030", "P2001"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1970"]}, {"id": "P1970", "text": ["~repetitive ~require a constant or variable speed ~require rotating motion ~require linear motion ~require torque ~require crushing, cutting, striking or sprayinggg", "* Remove loose clothing and jewelry. * Wear Safety goggles or glasses. * Wear earplugs", "6. Always follow safety guidelines to prevent injuries....", "5. There are many uses for hydraulics:....................", "4. Once the fluid is in motion, it creates the pressure necessary to push, pull, lift or lower the load. The actuator uses this pressure to perform work at the output of the system.", "3. Fluid moves through a hydraulic system when a prime mover provides the mechanical energy."], "jumps": ["P1960", "P1999", "P1970", "P1950", "P1940", "P1930"]}, {"id": "P1930", "text": ["2. Fluids used in hydraulic systems must meet specifics for the application. Lubrication requirements and fluid high boiling points are considered when designing hydraulic systems.", "1. Hydraulics is the use of fluid under pressure to perform work."], "jumps": ["P1940", "P1920", "P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on BASIC HYDRAULIC PRINCIPLES AND SAFETY."], "jumps": ["P1580"]}, {"id": "P1580", "text": ["Remember, by using normal shop safety and common sense the chances of becoming injured are greatly decreased."], "jumps": ["P1910", "P1570"]}, {"id": "P1573", "text": ["Never light a match around hydraulic fluid. Remember, all hydraulic fluids should be considered flammable."], "jumps": []}, {"id": "P1572", "text": ["Use a foreign object to check for leaks; do not use any part of the body. Remember, hydraulic fluids are under extreme pressure and could sever a limb...ck for leaks; do not use any part of the body. The fluids may be under great amounts of pressure and may be able to sever limbs."], "jumps": []}, {"id": "P1571", "text": [], "jumps": []}, {"id": "P1570", "text": ["One method used to check for a hydraulic leak, is to _______", "look for drips or puddles of fluid................................."], "jumps": ["P1560"]}, {"id": "P1563", "text": ["Ear plugs will protect the hearing. They will not prevent contact with a chemical."], "jumps": []}, {"id": "P1562", "text": ["Knee pads protect knees from hard surfaces but chemicals could still be absorbed by the knee pads and contact the skin."], "jumps": []}, {"id": "P1561", "text": [], "jumps": []}, {"id": "P1560", "text": ["What piece of safety gear should you wear to prevent a chemical injury?", "Sometimes leaks can be heard but the obvious sign of a fluid leak is puddles or drips of fluid in an unexpected area. Remember to use a foreign object to search for the leak..ps or puddles of fluid."], "jumps": ["P1550", "P1560", "P1540"]}, {"id": "P1540", "text": ["Leaks - Use a foreign object to check for leaks; do not use any part of the body. The fluids may be under great amounts of pressure and may be able to sever limbs.s.."], "jumps": ["P1520"]}, {"id": "P1530", "text": ["Always use approved methods for cleaning up spills. Refer to the Material Safety Data Sheets for instructions."], "jumps": ["P1540", "P1520"]}, {"id": "P1520", "text": ["Spills should be cleaned up immediately to prevent falls and injuries."], "jumps": ["P1530", "P1500"]}, {"id": "P1510", "text": ["Contact, ingestion and inhalation of fluids or vapors can cause: Chemical burns on skin or clothing - Blindness - Toxic reactions such as nausea, dizziness, shortness of breath and even death.."], "jumps": ["P1500", "P1520"]}, {"id": "P1500", "text": ["Body Contact - Do not allow the body to come into contact with hydraulic fluids and vapors."], "jumps": ["P1510", "P1490"]}, {"id": "P1490", "text": ["Flammability - Many hydraulic fluids and their vapors are flammable. Do not smoke, weld or expose a hydraulic system to flames or sparks."], "jumps": ["P1500", "P1480"]}, {"id": "P1480", "text": ["~repetitive ~require a constant or variable speed ~require rotating motion ~require linear motion ~require torque ~require crushing, cutting, striking or sprayinggg", "Flammability Body Contact Spills Leaks Fluid Safetyy", "These are some basic rules for fluid safety to examine....."], "jumps": ["P1490", "P1470"]}, {"id": "P1470", "text": ["Be aware of the environment and follow common safety procedures. This will greatly reduce the chance of serious injury.", "NEVER turn a hydraulic system off when the piston or actuator is raised. Removing the power from the prime mover decreases fluid pressure causing the actuator to fall."], "jumps": ["P1480", "P1460", "P1470", "P1450"]}, {"id": "P1450", "text": ["Wear ear plugs to prevent hearing loss. It may not be noticeable at first, but continual exposure to loud machinery without ear plugs causes significant hearing loss.", "Wear safety goggles or glasses to prevent flying debris or chemicals from injuring eyes.", "When operating machinery or tools, remove loose clothing and jewelry. These can get caught in moving parts."], "jumps": ["P1460", "P1440", "P1450", "P1430", "P1410"]}, {"id": "P1420", "text": ["The rules for mechanical safety of a hydraulic system are similar to the operation rules of any machinery."], "jumps": ["P1430", "P1410"]}, {"id": "P1410", "text": ["~repetitive ~require a constant or variable speed ~require rotating motion ~require linear motion ~require torque ~require crushing, cutting, striking or sprayinggg", "Mechanical Safety Fluid Safetyter + pipepipe", "There are two areas of safety to consider when operating or repairing hydraulic systems:"], "jumps": ["P1400", "P1420"]}, {"id": "P1400", "text": ["While hydraulic equipment is helpful, it can also be very dangerous if safety precautions are ignored."], "jumps": ["P1410", "P1390"]}, {"id": "P1396", "text": ["Hydraulic presses, like trash compactors, use hydraulics to crush debris."], "jumps": ["P1390"]}, {"id": "P1395", "text": ["Airplanes use hydraulics to extend and retract their wheels when landing or lifting-off."], "jumps": ["P1390"]}, {"id": "P1393", "text": ["Automobiles use hydraulics in their brakes to slow or stop."], "jumps": ["P1390"]}, {"id": "P1392", "text": ["Cranes use hydraulics to lift and lower their boom, which lifts and lowers loads.", "Dump trucks use hydraulics to raise and lower the bed of the truck."], "jumps": ["P1390"]}, {"id": "P1390", "text": ["There are many other applications of hydraulics. lect an item for more information.", "The barber's chair has demonstrated the concept of some basic hydraulic applications. The prime mover applies force to the plunger. The fluid moves the piston, and then the piston moves the load...", "Fluid flows into the original chamber through a release valve allowing the piston to drop, which lowers the seat.", "When the barber is ready to lower the chair, he pulls the handle back.", "When the fluid enters the chamber it drives the piston up, raising the seat (load).", "The plunger applies pressure, forcing the fluid through a one-way valve into another chamber.", "He uses linear motion to apply force to a handle on the chair that is then connected to an internal plunger.", "The barber uses his muscle power as the prime mover."], "jumps": ["P1400", "P1380", "P1310", "P1390", "P1370", "P1360", "P1350", "P1340", "P1330"]}, {"id": "P1310", "text": ["This barber's chair uses the principles of hydraulics......", "The device the fluid moves is called a linear actuator (piston) or a rotary actuator (motor). This device moves the load at the output point of the system."], "jumps": ["P1290", "P1320", "P1310", "P1280"]}, {"id": "P1283", "text": ["The psi is measured by gauges. The prime mover is not used to measure the fluid pressure."], "jumps": []}, {"id": "P1282", "text": ["If a system needs lubrication for operation, usually an oil-based hydraulic fluid is used. The prime mover is not used for lubrication."], "jumps": []}, {"id": "P1281", "text": [], "jumps": []}, {"id": "P1280", "text": ["What is the purpose of a prime mover?......................", "The pressure can be used to increase or decrease the amount of force at the output (fluid power)."], "jumps": ["P1270", "P1280", "P1220"]}, {"id": "P1260", "text": ["This force created by the moving fluid exerts a measurable pressure. The pressure is measured in psi by a gauge."], "jumps": ["P1220", "P1270"]}, {"id": "P1250", "text": ["The fluid motion provides force throughout the hydraulic system."], "jumps": ["P1220", "P1260"]}, {"id": "P1240", "text": ["The mechanical energy has been transferred to fluid motion."], "jumps": ["P1220", "P1250"]}, {"id": "P1230", "text": ["Prime movers supply the mechanical energy to the pump which moves the fluid in a hydraulic system."], "jumps": ["P1220", "P1240"]}, {"id": "P1220", "text": ["Fluid power is generated by a prime mover.................."], "jumps": ["P1230", "P1210"]}, {"id": "P1210", "text": ["As stated before, liquids are noncompressible and flow under pressure. In hydraulics this is called fluid power."], "jumps": ["P1200", "P1220"]}, {"id": "P1202", "text": ["Increasing the diameter of the pipe will reduce the fluid velocity...................................................................................................."], "jumps": []}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1200", "text": ["\u0000\u0000\u0000incorrect1\u0000\u0000/\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000Y\u0001\u000f\u0000\u0000\u0000 \u0000\u001b\u0000Increase the pipe diameter..\u0000\u0000\u0000\u0000x\u0001\u00de\u0002\u0000\u0000_swapped\u0000\u0000y\u0001v\u0000\u00de\u0002X\u0001\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0085\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u009f\u0001\u0012\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00c3\u0001\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00ba\u0004\u0002\u0000\u0000\u0000V\u0006\u0003\u0000\u0000\u0000(\u0007\u0000\u0000\u0000\u0000\u0000\u0000\u00dd\u0001\u0014\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000G\u0002\u0015\u0000\u0000\u0000`\u0000Q\u0000\n\nWhat has to be done to increase the velocity of", "What has to be done to increase the velocity of fluid flowing through a pipe???"], "jumps": ["P1190"]}, {"id": "P1193", "text": ["Pneumatic systems use gas under pressure to perform work..."], "jumps": []}, {"id": "P1192", "text": ["Solar power systems convert light to power................."], "jumps": []}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1190", "text": ["Systems that use liquid under pressure to perform work are called _______"], "jumps": ["P1180"]}, {"id": "P1180", "text": ["Using these two basic laws and much more physics, engineers have been able to construct motors, pumps, hydraulic presses and brakes for automobiles."], "jumps": ["P1140"]}, {"id": "P1170", "text": ["Should the pressure be increased the velocity of the flow increases in both pipes, but again, at a faster rate in the smaller pipe..hen fluid pressure decreases."], "jumps": ["P1140", "P1180"]}, {"id": "P1160", "text": ["Equal pressure is applied to more fluid volume in the larger pipe so the fluid moves slower than the smaller pipe with less flow volume. The same pressure is exerted on a smaller volume of fluid..."], "jumps": ["P1140", "P1170"]}, {"id": "P1150", "text": ["For example, when fluid flows through a large pipe, it flows at a slower rate than fluid flowing through a smaller pipe."], "jumps": ["P1140", "P1160"]}, {"id": "P1140", "text": ["Later, Daniel Bernoulli studied the pressure and velocity of flowing fluids. He found that the pressure remains the same but the velocity of the fluid flow changes based on the size of the pipe. At the same pressure fluid flow is faster in smaller pipes than larger pipes..."], "jumps": ["P1150", "P1100"]}, {"id": "P1130", "text": ["Suppose a sealed, symmetrical pipe filled with liquid had pressure applied from one end. The gauges would indicate the increased pressure exerted by the liquid (measured in pounds per square inch) was equal at all points along the pipe..."], "jumps": ["P1100", "P1140"]}, {"id": "P1120", "text": ["The pressure that Pascal's law refers to can be measured in pounds per square inch, psi."], "jumps": ["P1100", "P1130"]}, {"id": "P1110", "text": ["He found that whenever pressure is applied to or removed from a confined fluid that the change in pressure takes place equally throughout the fluid. This is known as Pascal's Law."], "jumps": ["P1100", "P1120"]}, {"id": "P1100", "text": ["Fluid pressure was analyzed by Blaise Pascal in the 11th century.", "Fluid properties will affect hydraulic pressure and velocity. Pascal and Bernoulli were two men who studied and formed two basic hydraulic laws about fluid pressure and velocity."], "jumps": ["P1110", "P1090", "P1085", "P1100"]}, {"id": "P1085", "text": ["Viscosity for Hydraulic fluid is usually defined by SAE (Society of Automotive Engineers) numbers, which are also used to describe the viscosity of automotive oil.", "Hydraulic fluid only gets warm in use as it is used as the system lubricant and coolant in addition to the primary purpose of performing the work in the hydraulic system."], "jumps": ["P1090", "P1080"]}, {"id": "P1080", "text": ["Viscosity for Hydraulic fluid is usually defined by SAE (Society of Automotive Engineers) numbers, which are also used to describe the viscosity of automotive oil.", "Hydraulic systems that need lubrication and specific fluid thickness (viscosity) will use oil-based fluids..ids."], "jumps": ["P1075", "P1085"]}, {"id": "P1075", "text": ["DOT- 5 is silicone-based and does not absorb water. Any water entering the system stays in pockets which increases the chances for corrosion. Lubrication is not usually a requirement with brake fluid applications...."], "jumps": ["P1080", "P1070"]}, {"id": "P1070", "text": ["DOT- 3 and DOT- 4 are glycol-based fluids. DOT- 4 has a higher boiling point than DOT- 3. Both DOT- 3 and DOT- 4 will absorb water, which reduces the fluid boiling point."], "jumps": ["P1075", "P1060"]}, {"id": "P1060", "text": ["The US Department of Transportation sets the specifications for automotive brake fluid. The primary requirement with brake", "The US Department of Transportation sets the specifications for automotive brake fluid. The primary requirement with brake fluid is its resistance to boiling when heated. Three standards are in place..."], "jumps": ["P1070", "P1050"]}, {"id": "P1050", "text": ["Different types of liquids are used in hydraulic systems.n hydraulic systems.....", "Liquids are ideal for performing work because they are noncompressible. This allows them to move or flow when small amounts of force are applied......."], "jumps": ["P1060", "P1030"]}, {"id": "P1030", "text": ["By giving a liquid, such as water, direction and motion under pressure, a system that can perform work is created. This system is called a hydraulic system......"], "jumps": ["P1020", "P1040"]}, {"id": "P1020", "text": ["~repetitive ~require a constant or variable speed ~require rotating motion ~require linear motion ~require torque ~require crushing, cutting, striking or sprayinggg", "(Greek) Hydro + aulos (English) Water + pipe", "The term hydraulics comes from the two Greek words meaning water and pipe."], "jumps": ["P1030", "P1001"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P480", "text": ["Let's begin the lesson on INTRODUCTION TO HYDRAULIC SYSTEMS................."], "jumps": ["P460"]}, {"id": "P470", "text": ["Hydraulic mechanics and technicians must also be familiar with these symbols to be able to locate, identify, repair or replace the components."], "jumps": ["P460", "P480"]}, {"id": "P460", "text": ["The increased sophistication of hydraulic systems prompted engineers to develop symbols for location, identification, repair, or replacement of components.", "Hydraulic systems have become more sophisticated and have been widely used since the days of grinding wheat with water wheels.", "Hydraulics can also be used to provide rotational power. Fluid power has been used for centuries in this manner.", "...are easier to move by using a hydraulic machine or tool.", "Large, heavy loads that require a lot of muscle power......", "Hydraulic systems use fluid to push, pull, lift and lower heavy loads."], "jumps": ["P450", "P470", "P460", "P430", "P425", "P300", "P400", "P"]}, {"id": "P400", "text": ["Hydraulic systems help us get work done more efficiently."], "jumps": ["P410", "P300"]}, {"id": "P300", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe hydraulics. w Understand the concept of hydraulics. w Realize hydraulic applications. w Understand basic hydraulic safety.", "1. Basic Hydraulic Principles and Safety", "w Describe a basic hydraulic system and its components....", "w Describe different system components and their schematic symbols."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distrib   }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
</body>
