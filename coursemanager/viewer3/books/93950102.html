acks of gum can you buy?"], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["You will find that multiplying is like adding and dividing is like subtracting."], "jumps": ["P450", "P420"]}, {"id": "P450", "text": ["Let's begin the lesson on MULTIPLYING AND DIVIDING.NFINITY................"], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Multiplication is a series of additions.", "Multiplication is a series of additions....................", "4 x 2 84 5 6 7 8 9 8 9", "Addition Series 2 + 2 + 2 + 2 = 8 or 4 + 4 = 8888888888888"], "jumps": ["P1025", "P1001"]}, {"id": "P1025", "text": ["The multiplication process is signified by the x sign.", "Multiplication Symbol X = 8 or 4 + 4 = 8888888", "4 x 2 84 5 6 7 8 9 8 9"], "jumps": ["P1030", "P1020"]}, {"id": "P1030", "text": ["The \u0095 can also represent multiplication.", "Multiplication Symbol X = 8 or 4 + 4 = 8888888", "4 2 = 8888888884 5 6 7 8 9 8 9"], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Another method to show multiplication is to use parentheses.", "Multiplication Symbol X = 8 or 4 + 4 = 8888888", "4 2 = 88888888884 5 6 7 8 9 8 9"], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The two numbers that are multiplied together are called factors.", "4 2 = 8888888884 5 6 7 8 9 8 9", "4 x 2 = 8888888884 5 6 7 8 9 8 9"], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["The result of the multiplication is called the product.", "4 2 = 8888888884 5 6 7 8 9 8 9", "4 x 2 = 8888888884 5 6 7 8 9 8 9"], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["Multiplication is a series of additions; for example 4 x 3 is the same as adding 4 three times.", "4 x 3 1222 5 6 7 8 9 8 9", "Addition Series 4 + 4 + 4 = 12 or 4 + 4 = 8888888888888888"], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["Multiply 5 times 4 using addition. \nType in the answer for each addition.", "Multiply 5 times 4 using addition. Type let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
