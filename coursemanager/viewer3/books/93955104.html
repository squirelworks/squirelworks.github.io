const book = {"title": "93955104", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: ROTATING MACHINERY TRAINER ALIGNMENTdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Align the rotors and dynamic brake on the 280 Rotating Machinery Trainer. w Verify proper trainer operation through the alignment procedure.ure.", "w Discuss the technique for aligning the 280 trainer."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "3. Nida Model 280 Rotating Machinery Trainer", "6. 7/64\" Allen End Wrench imeterXXXXXXXXXXnt"], "jumps": []}, {"id": "P330", "text": ["Nida Model 280 Rotating Machinery Trainer"], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P350", "text": [], "jumps": []}, {"id": "P351", "text": [], "jumps": []}, {"id": "P352", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn how to align the motors on the 280 Rotating Machinery trainer."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["The trainer is a very versatile piece of equipment."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Like many types of equipment, the trainer must be properly aligned prior to experimental use in order to obtain valid results."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Periodic alignment of the trainer should be performed to keep the trainer operating properly."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on ROTATING MACHINERY TRAINER ALIGNMENT.............."], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The Rotating Machinery Trainer can be configured in a number of different ways."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Regardless of the trainers configuration, proper experiment results can only be achieved with a properly aligned trainer."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["For the Model 280 to operate properly, the rotors, couplers and clutch must be properly aligned."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Misalignment will cause excessive wear on the trainer......"], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["Misalignment will also cause incorrect measurements during experiments."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["You should perform the alignment procedure before performing an experiment."], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["This will ensure accurate experiment results."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["Misalignment usually occurs due to dropping, loose screws or clutch wear.", "Misalignment can usually be checked visually..............."], "jumps": ["P1110", "P1080", "P1120", "P1100"]}, {"id": "P1120", "text": ["By looking directly down at the trainer, you can see any misalignment of the motors and couplers."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["A properly aligned trainer shows a straight connection between motors and couplers."], "jumps": ["P1200", "P1120"]}, {"id": "P1150", "text": ["Misalignment causes undue friction on the connecting couplers of the trainer."], "jumps": ["P1160", "P1200"]}, {"id": "P1160", "text": ["Energy in the form of heat is lost in the couplers."], "jumps": ["P1170", "P1200"]}, {"id": "P1170", "text": ["Misalignment also puts unneeded stress on the motors themselves."], "jumps": ["P1180", "P1200"]}, {"id": "P1180", "text": ["Misaligned motor shafts generate counter torque on the motors."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["This counter torque can result in premature wear on the motors."], "jumps": ["P1220", "P1180"]}, {"id": "P1200", "text": ["Misalignments can be visually observed by looking at the sides of the motor shafts and couplings."], "jumps": ["P1210", "P1120"]}, {"id": "P1210", "text": ["Misaligned motor shafts are not perfectly straight with each other."], "jumps": ["P1150", "P1200"]}, {"id": "P1220", "text": ["Motor shafts can be aligned by adjusting the baseplates."], "jumps": ["P1230", "P1180"]}, {"id": "P1230", "text": ["Misalignment can also occur due to the dynamic brake assembly."], "jumps": ["P1240", "P1180"]}, {"id": "P1240", "text": ["The dynamic brake can be applied to any motor on the trainer."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["If the dynamic brake is misaligned, excessive drag on the motors will occur."], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["The dynamic brake is controlled by the dynamic brake adjust, located on the DC motor sub-panel."], "jumps": []}, {"id": "P1270", "text": ["When the brake is misaligned, the brake adjust will not perform properly."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["To align the dynamic brake, the mounting pad must first be adjusted."], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["If the dynamic brake is mounted too far away from the DC motor, the dynamic brake adjust will not work."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["If the dynamic brake is mounted too close to the DC motor, the motor will lock with little or no dynamic brake adjust applied."], "jumps": ["P1310", "P1280"]}, {"id": "P1310", "text": ["What is the best way of determining motor misalignments on the trainer?"], "jumps": ["P1280"]}, {"id": "P1311", "text": [], "jumps": []}, {"id": "P1312", "text": ["The trainer can be aligned mechanically but misalignment should not be determined mechanically."], "jumps": []}, {"id": "P1313", "text": ["Misalignment causes invalid experimental results. You may not be able to determine misalignment experimentally."], "jumps": []}, {"id": "P1320", "text": ["If the dynamic brake is mounted too close to the DC motor, what symptoms will occur?"], "jumps": ["P1310"]}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1322", "text": ["A misaligned dynamic brake does not increase motor speed..."], "jumps": []}, {"id": "P1323", "text": ["A misaligned dynamic brake will never cause excessive motor speed!"], "jumps": []}, {"id": "P1330", "text": ["In the experiment, you will align the Nida Model 280 Trainer."], "jumps": ["P1910", "P1320"]}, {"id": "P1910", "text": ["This completes the information on ALIGNMENT PROCEDURES....."], "jumps": ["P1001", "P1330"]}, {"id": "P1920", "text": ["1. Proper experiment results can only be achieved when the 280 Trainer is properly aligned........"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. Alignment should be performed prior to any experiment if misalignment is suspected."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. Misalignment of the motor shafts produce counter torque and premature wear on the motor shaft couplers."], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["4. Misalignment also produces premature wear on the motors themselves..", "5. Gross misalignment can be determined visually.........."], "jumps": ["P1960", "P1940", "P1970", "P1950"]}, {"id": "P1970", "text": ["6. Motor shaft misalignment can be seen when motor shafts do not line up evenly."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7. The dynamic brake assembly must also be properly aligned for proper experiment results."], "jumps": ["P1999", "P1960"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["In this experiment you will align the motors and dynamic brake assembly on the trainer."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["This alignment should be performed prior to any experiment if you suspect misalignment."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["Let's begin the experiment.e..............................."], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["1. Set the 280 trainer to it's initial control settings.it's initial control settings."], "jumps": ["P2060", "P2040", "P22000"]}, {"id": "P2060", "text": ["2. Set the Test Console controls to their initial control settings........"], "jumps": ["P2050", "P"]}, {"id": "P2070", "text": ["3. Insert PC130-280 into the PC3 position on the 130 test console.2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2080"]}, {"id": "P2080", "text": ["4. Connect the 8 pin connector from the PC130-280 card to the PC130-280 connector on the 280 trainer. 80 Trainer 130A Test ConsoleON........................................."], "jumps": ["P2070", "P2090", "P"]}, {"id": "P2090", "text": ["5. To configure the 280 Trainer for alignment, set the DC sub- panel controls as follows: Switch Settings METER - IN ROTOR - REV OPER/TEST - TEST ARM/OFF/VAR - ARM RUN/STOP - RUN", "YGIH@t7<< ??KJJ|KyLPvS?J|F<=KWjXW?KY}NPOQY?BWKNQ"], "jumps": ["P2100", "P2080", "P"]}, {"id": "P2100", "text": ["6. Connect a DC ammeter, set to the 1A range, across the METER jacks on the 280 chassis. Remember to observe proper polarity. ION The current draw of the DC motor is over 250 mA. Use a current range on the ammeter that is greater than 250 mA (using the 488 Multimeter, use the 10A setting and connect the red test lead to the 10A input jack.", "The current draw of the DC motor is over 250 mA. Use a current range on the ammeter that is greater than 250 mA (using the 488 Multimeter, use the 10A setting and connect the red test lead to the 10A input jack..ut jack."], "jumps": ["P2090", "P2105"]}, {"id": "P2105", "text": ["MEASUREMENT SETUP- Set ammeter to 1A and measure across METER jacks."], "jumps": []}, {"id": "P2110", "text": ["7. Set the 130 Test Console controls as follows: Filament. . . . ON + Positive Supply. . . . 24 Volts - Negative Supply. . . . 15 Volts", "7. Press enter to set the 130E Test Console controls as follows: ntrols as follows: t.......... ON + Power Supply... 24 Volts - Power Supply....15 Volts"], "jumps": ["P2100"]}, {"id": "P2120", "text": ["8. Press Enter to Set PC3 DC Power - ON.", "8. Press Enter to Set PC3 DC Power - ON. 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": []}, {"id": "P2130", "text": ["The DC motor will begin to spin when the Positive Power Supply exceeds 5 volts. Vary the Positive Voltage until the motor begins to spin."], "jumps": []}, {"id": "P2134", "text": ["MEASUREMENT SETUP- Above 5 volts the DC motor should begin to spin."], "jumps": ["P2136", "P2130"]}, {"id": "P2136", "text": ["MEASUREMENT SETUP- If motor action does not occur for any Positive Supply input voltage, make sure the ammeter is connected into the appropriate jacks. Failure to do this results in an open circuit and motor action will not occur."], "jumps": ["P2130", "P2134"]}, {"id": "P2140", "text": ["9. Decrease the Positive Voltage until the motor shafts are turning very slowly and note the current meter reading at this speed............................peed..."], "jumps": ["P2130"]}, {"id": "P2150", "text": ["Visually inspect the shaft couplers, between motors, on the Model 280 by looking straight down."], "jumps": ["P2160"]}, {"id": "P2160", "text": ["Gross shaft misalignment will be very noticeable. If alignment is required, pay close attention to safety! * Keep all loose clothing away from spinning gears & shafts. * Remove all jewelry...."], "jumps": ["P2166"]}, {"id": "P2166", "text": ["Even though alignment may not be required, proceed with the alignment procedure."], "jumps": ["P2170", "P2160"]}, {"id": "P2170", "text": ["10. Carefully remove the clear plastic protective cover by removing the two allen head mounting bolts."], "jumps": ["P2190", "P2160"]}, {"id": "P2190", "text": ["11. Slightly loosen the AC motor baseplate screws."], "jumps": ["P2200", "P2170"]}, {"id": "P2200", "text": ["12. Carefully move the AC motor back and forth until the current meter indicates the least amount of current and maximum shaft speed."], "jumps": ["P2210", "P2170"]}, {"id": "P2210", "text": ["13. While maintaining the AC Motor in position, slowly and gently tighten the AC motor baseplate screws. DO NOT OVERTIGHTEN."], "jumps": ["P2220", "P2200"]}, {"id": "P2215", "text": ["PROPER BASEPLATE ASSEMBLY- Over tightening the baseplate screws could warp the baseplate resulting in complete misalignment of the assembly."], "jumps": []}, {"id": "P2220", "text": ["14. Again, visually inspect the motor shaft couplings. Repeat the baseplate alignment for the stepper motor and DC motor, ONE AT A TIME."], "jumps": ["P2230", "P2210"]}, {"id": "P2225", "text": ["PROPER BASEPLATE ASSEMBLY- NEVER loosen two motor baseplates at the same time. This could result in misalignment of motor shafts and/or motor shaft damage."], "jumps": []}, {"id": "P2230", "text": ["If the left hand shaft coupling appears misaligned, adjust the stepper motor baseplate."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["If the right hand shaft coupling appears misaligned, adjust the DC motor baseplate."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["Upon completion of the motor shaft coupling alignment all motor shafts should be aligned."], "jumps": ["P2255", "P2230"]}, {"id": "P2255", "text": ["If the shafts are not aligned, a shim can be inserted under the baseplate of the misaligned motor."], "jumps": ["P2260", "P2230"]}, {"id": "P2260", "text": ["15. Slightly loosen the dynamic brake baseplate screws...."], "jumps": ["P2270", "P2230"]}, {"id": "P2270", "text": ["16. Looking straight down at the brake assembly, adjust the assembly square with the brake facing."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["17. Slightly move the dynamic brake forward toward the brake faceplate until a slight abrasive sounding rasp is heard. Motor speed should slightly reduce."], "jumps": ["P2290", "P2270", "P2285"]}, {"id": "P2285", "text": ["BRAKE FACING POSITIONING- Move forward until motor speed slows slightly and a slight rasp is heard."], "jumps": []}, {"id": "P2290", "text": ["18. While maintaining the adjustment, slowly and gently tighten the dynamic brake baseplate screws."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["19. Set the Positive Power Supply to Maximum Voltage..ully CW.C1 DC Switch to ON...."], "jumps": ["P2290"]}, {"id": "P2310", "text": ["20. Set the dynamic brake switch to IN and slowly rotate the dynamic brake pot CW noting a load increase on the motor shaft. At a certain dynamic brake setting, the motor should stall..."], "jumps": ["P2320", "P2315"]}, {"id": "P2315", "text": ["DYNAMIC BRAKE CONTROL- Slowly rotate the dynamic brake pot CW to increase the motor load."], "jumps": []}, {"id": "P2320", "text": ["21. Adjust the dynamic brake pot CCW until the DC motor spins at a moderate rate.."], "jumps": ["P2325", "P2310"]}, {"id": "P2325", "text": ["22. Reinstall the clear plastic cover over the Rotating Machinery Trainer."], "jumps": ["P2328"]}, {"id": "P2328", "text": ["This completes the alignment of the Nida Model 280 Trainer."], "jumps": ["P2330", "P2325"]}, {"id": "P2330", "text": ["1. Disconnect ammeter and return the 280 trainer to its initial control settings.."], "jumps": ["P2328", "P22000"]}, {"id": "P2340", "text": ["2. Return the Test Console to the initial control settings................"], "jumps": ["P2330"]}, {"id": "P2350", "text": ["2. Turn all test equipment OFF and remove PC130-280 from the test console. Return the equipment to its designated storage area."], "jumps": ["P2360"]}, {"id": "P2360", "text": ["3. Set the Test Console Power OFF. OFF...................."], "jumps": ["P2350"]}, {"id": "P2370", "text": ["Now that the 280 trainer is aligned correctly, you would think that measured values on all trainers would be the same. Not True! Motor DC Motor +24V Motor #1 1600 RPM +24V Motor #2 1600 RPM"], "jumps": ["P2390", "P2360"]}, {"id": "P2390", "text": ["Different motors will produce different outputs. This is not unusual."], "jumps": ["P2400", "P2370"]}, {"id": "P2400", "text": ["The differences will not pose a problem. Normally, you are requested to compare readings using one trainer. Precise measurement values are important but the relationship between two values is more important..."], "jumps": ["P2410", "P2370"]}, {"id": "P2410", "text": ["For example, you would compare the RPM of a DC motor at different input voltages."], "jumps": ["P2420", "P2370"]}, {"id": "P2420", "text": ["Even though the RPM values are different on each trainer, both trainers indicate that when input voltages increases, RPM increases."], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["It is the relationship between input voltage and output RPM that is important. Not the actual RPM values at different input voltages."], "jumps": ["P2910", "P2410"]}, {"id": "P2910", "text": ["This completes the experiment on ROTATING MACHINERY TRAINER ALIGNMENT."], "jumps": ["P2001", "P2410"]}, {"id": "P10001 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
