undary became known as the 640k memory barrier.", "Extended Memory (XMS) - Once the AT- type systems were introduced, the original 1M of memory was stretched out to 16M for the '286 and as far as 4G for the '386DX, '486 and Pentium systems. The Pentium P6 processors stretch the boundary to 64G!"], "jumps": ["P2070", "P2020", "P2080", "P2060"]}, {"id": "P2080", "text": ["All memory beyond the original 1M is considered Extended Memory (XMS).  XMS stands for EXtended Memory Specification.", "All memory beyond the original 1M is considered Extended Memory (XMS). XMS stands for EXtended Memory Specification."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["Unfortunately, the \"ins and outs\" of extended memory are not quite that simple.  In order to facilitate an understanding of how    Extended Memory is accommodated in various computer systems, some modes of operation need to be defined.", "Unfortunately, the \"ins and outs\" of extended memory are not quite that simple. In order to facilitate an understanding of how Extended Memory is accommodated in various computer systems, some modes of operation need to be defined. (Graphics text) Real Mode Protected Mode Virtual Real Mode"], "jumps": ["P2100", "P2070"]}, {"id": "P2095", "text": ["REAL MODE - A mode available in all 8086-compatible processors that enables compatibility with the original 8086. In this mode RAM storage is limited to 1M."], "jumps": []}, {"id": "P2096", "text": ["PROTECTED MODE - This mode is available in all '286 or '386 - compatible processors. In this mode RAM storage is extended to 16M ('286) and 4G ('386DX >). This mode also allows restricted protection levels to be set to trap software crashes and control the system."], "jumps": []}, {"id": "P2097", "text": ["VIRTUAL REAL MODE - This mode is available in all '386-compatible processors. It permits RAM storage up to 4G and allows restricted protection levels to be set to trap software crashes and control the system. Individual real mode compatible sessions can be set up and maintained separately."], "jumps": []}, {"id": "P2100", "text": ["Extended Memory Specification was developed in 1987 and specified how programs would use extended memory."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["Before XMS, cooperation between program applications that placed the processor in the protected mode and used extended memory was not ensured.", "Multiple programs were unable to know what the other was doing with the extended memory because they were unable to see that memory while in the real mode.", "HIMEM.SYS works with programs that understand the XMS protocol by controlling all extended memory and issuing chunks of it to programs as needed.", "This enables several programs that use extended memory to operate together under DOS on the same system.  XMS prevents a program from trying to acquire a block of memory being used by another program.", "This enables several programs that use extended memory to operate together under DOS on the same system. XMS prevents a program from trying to acquire a block of memory being used by another program."], "jumps": ["P2120", "P2100", "P2130", "P2110", "P2140", "P2150"]}, {"id": "P2150", "text": ["UMA (Upper Memory Area) - consists of the reserved 384k on an XT system and the first 1M on AT-type systems. This upper memory provides blocks of RAM used for the system."], "jumps": ["P2160", "P2110"]}, {"id": "P2160", "text": ["One block is reserved for the monitor and is called Video RAM. Another block is reserved for the Adapter BIOS that resides in ROM on some adapter boards. Not all adapter boards will need it, but this block of memory is available for those that do. The last block is set aside for the Motherboard (system) BIOS."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["In most cases there are blocks in the UMA that are not actually being used by the system."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["For '386 and later systems, programs like Memmaker, Ramboost and QEMM will take the unused portions of the UMA and load them with device drivers and memory-resident programs. This frees up otherwise unaccessible user memory.", "DEVICE DRIVERS & MEMORY RESIDENT PROGRAMS"], "jumps": ["P2190", "P2160"]}, {"id": "P2190", "text": ["High Memory The HMA (High Memory Area) is roughly the first 64k at the beginning of the first 1M of Extended Memory."], "jumps": ["P2200", "P2160"]}, {"id": "P2200", "text": ["Like the UMA, it can be used to load device drivers and memory- resident programs in order to free up space in conventional memory."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["On systems that operate with DOS 5.0 or higher, this area is particularly important because DOS will load about 45k of program instructions into this area by using DOS's XMS driver HIMEM.SYS."], "jumps": ["P2220", "P2190"]}, {"id": "P2220", "text": ["When this is done, the Config.Sys file will have the line \"DOS=HIGH\" added. HIMEM.SYS (or an equivalent driver) controls the use of this area.", "This area of memory can be accessed because of an oversight (a boo-boo) when the 80286 was developed."], "jumps": ["P2230", "P2190", "P2240", "P2220"]}, {"id": "P2240", "text": ["Memory addresses in Intel microprocessors are stipulated by an overlapping segment and offset."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["The 8088/8086 has only 20 address lines (A0 - A19). So, if an address segment FFFF (specifying an actual address of FFFF0 which is 16 bytes shy of the first 1M) is added to an offset of FFFF (equaling 64k) the end result is:", "The 8088/8086 has only 20 address lines (A0 - A19). So, if an address segment FFFF (specifying an actual address of FFFF0 which is 16 bytes shy of the first 1M) is added to an offset of FFFF (equaling 64k) the end result is:s:::"], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["Address 10FFEF can't be achieved with only 20 address lines. The 8088/8086 processors don't quite know what to do with an address that large and so they leave off the MSD (most significant digit) which results in an address of 0FFEF."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["This effectively causes the address to wrap around and end up 16 bytes from the end of the first 64k of the first 1M."], "jumps": ["P2280", "P2250"]}, {"id": "P2280", "text": ["The 80286 and later processors, when operating in the real mode, are supposed to emulate the 8088/8086 exactly, limiting the processors to 20 address lines."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["The aforementioned oversight, however, left address line A20 (the 21st address line) active. This allowed the processor to achieve the address without the wrap around effect, resulting in an address that was 16 bytes less than the first 64k of the second megabyte.", "The aforementioned oversight, however, left address line A20 (the 21st address line) active. This allowed the processor to achieve the address without the wrap around effect, resulting in an address that was 16 bytes less than the first 64k of the second megabyte. e."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["This portion of memory should not have been accessible except in the protected mode.", "IBM engineers were well aware of this \"bug\" in the '80286 processor."], "jumps": ["P2310", "P2290", "P2320"]}, {"id": "P2320", "text": ["So, when they designed the original AT, they took some unused pins on the keyboard controller and utilized them in such a way that the controller would turn on or off the A20 line depending on whether the processor was operating in the real or protected mode."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["This allowed the '286 to operate in the real mode exactly as if it were an 8088/8086 processor."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["Programmers at Microsoft, realizing the potential, devised a method of commanding the keyboard controller to turn on the A20 line for  the sole purpose of using the \"bug\" as a benefit of accessing the  first 64k of extended memory without having to switch into the protected mode.", "Programmers at Microsoft, realizing the potential, devised a method of commanding the keyboard controller to turn on the A20 line for the sole purpose of using the \"bug\" as a benefit of accessing the first 64k of extended memory without having to switch into the protected mode."], "jumps": ["P2350", "P2320"]}, {"id": "P2350", "text": ["This was accomplished with HIMEM.SYS.  It effectively created a new area of memory created called High Memory.", "This was accomplished with HIMEM.SYS. It effectively created a new area of memory created called High Memory."], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["In a PC/XT, user (conventional) memory is restricted to", "In a PC/XT, user (conventional) memory is restricted to...."], "jumps": ["P2350"]}, {"id": "P2361", "text": [], "jumps": []}, {"id": "P2362", "text": ["The first 1M was the restricted memory in AT types.", "The first 1M was the restricted memory in AT types........."], "jumps": []}, {"id": "P2363", "text": ["384kB is the restricted area in PC/XT's.", "384kB is the restricted area in PC/XT's...................."], "jumps": []}, {"id": "P2364", "text": ["16MBytes is the Extended Memory limit for the '286.", "16MBytes is the Extended Memory limit for the '286........."], "jumps": []}, {"id": "P2370", "text": ["High Memory is the result of _______", "High Memory is the result of _______......................."], "jumps": ["P2360"]}, {"id": "P2371", "text": [], "jumps": []}, {"id": "P2372", "text": ["High Memory was being used before the 80386.", "High Memory was being used before the 80386................"], "jumps": []}, {"id": "P2373", "text": ["640k Conventional Memory is still used.", "640k Conventional Memory is still used....................."], "jumps": []}, {"id": "P2374", "text": ["Upper Memory has not been eliminated.", "Upper Memory has not been eliminated......................."], "jumps": []}, {"id": "P2380", "text": ["Expanded Memory - Prior to Extended Memory, Expanded Memory Specification (EMS) was used.", "Expanded Memory is not accessed the same as Conventional and Extended Memory.  It cannot be directly addressed by the processor.", "In order for an Expanded Memory address to be accessed, it must go through a 64k window in Upper Memory.", "Expanded memory is a segment-switching operation, very much like a swap file operation. The major difference is that Expanded Memory is segment-switching (swapping) chunks of RAM where swap file operations borrow chunks of Hard Disk space and utilize it as if it were RAM.", "Expanded Memory is not accessed the same as Conventional and Extended Memory. It cannot be directly addressed by the processor."], "jumps": ["P2390", "P2370", "P2400", "P2380", "P2410", "P2420"]}, {"id": "P2420", "text": ["Expanded Memory requires an EMS board which has numerous 64k segments in addition to switching and mapping hardware. The EMS board's home address is the 64k segment (window) in Upper Memory.", "As that segment is filled with data, it is \"rotated\" by the EMS board and a new empty 64k segment is then made available.", "The disadvantage of EMS operations is that only one segment can be utilized at one time. For this reason it is slow and inefficient, and for the same reason, the segments are used to hold data rather than program files.", "Due to the fact that EMS was devised with 8-bit processors in mind, the system is nearly extinct today.", "Expanded Memory requires an EMS board which has numerous 64k segments in addition to switching and mapping hardware. The EMS board's home address is the 64k segment (window) in Upper Memory. y."], "jumps": ["P2430", "P2400", "P2440", "P2450", "P2460"]}, {"id": "P2460", "text": ["Caches - The speed with which RAM can be accessed has, over the years, remained fairly constant."], "jumps": ["P2470", "P2400"]}, {"id": "P2470", "text": ["Microprocessor speeds, on the other hand, have been increasing at an impressive rate.", "So while processors are trying to acquire and manipulate data at much faster speeds, they are not able to access RAM any faster than  they were able to when their own speeds were far less.", "To get around this bottleneck, caches are used.  A cache is basically very high-speed memory.", "So while processors are trying to acquire and manipulate data at much faster speeds, they are not able to access RAM any faster than they were able to when their own speeds were far less.s.", "To get around this bottleneck, caches are used. A cache is basically very high-speed memory."], "jumps": ["P2480", "P2460", "P2490", "P2470", "P2500"]}, {"id": "P2500", "text": ["Typically, dynamic RAM has an access time of 70-80 nanoseconds, whereas most L1 (internal caches) can be accessed in less than 10 nanoseconds.", "With the 486 and Pentium series processors, having caches is an opportunity for them to strut their stuff. The CPU has no wait time because the cache can keep up with the CPU completely."], "jumps": ["P2510", "P2490", "P2520", "P2500"]}, {"id": "P2520", "text": ["This, of course, is in contrast to conventional RAM which would cause the CPU to wait while code and data are being accessed.", "L2 caches (those external to the processor) are not quite as fast as L1, but still far faster than conventional RAM."], "jumps": ["P2530", "P2510", "P2540", "P2520"]}, {"id": "P2540", "text": ["The P6 processor has taken this a step further and incorporated an L2 cache on-board. While it is a separate piece of silicon, it is   directly hard-wired to the processor itself and is contained within the same package.", "The P6 processor has taken this a step further and incorporated an L2 cache on-board. While it is a separate piece of silicon, it is directly hard-wired to the processor itself and is contained within the same package."], "jumps": ["P2550", "P2520"]}, {"id": "P2550", "text": ["The L2 cache in the P6 is considerably faster than normal L2 caches."], "jumps": ["P2560", "P2540"]}, {"id": "P2560", "text": ["When the 80486 processor was developed it came with an on-board cache controller with an internal (Level 1) cache of either 8k or 16k cache memory."], "jumps": ["P2570", "P2540"]}, {"id": "P2570", "text": ["The Pentium has two, independent, 8k Level 1 caches and the cache controller circuitry on the processor die."], "jumps": ["P2580", "P2560"]}, {"id": "P2580", "text": ["One cache is exclusively for code while the other is for data only. Most Pentium series processors also come with an external Level 2 cache with the normal size being between 256k and 512k.  These caches are typically 15 nanosecond static RAM.", "One cache is exclusively for code while the other is for data only. Most Pentium series processors also come with an external Level 2 cache with the normal size being between 256k and 512k. These caches are typically 15 nanosecond static RAM."], "jumps": ["P2910", "P2570"]}, {"id": "P2910", "text": ["This completes the information on LOGICAL CONFIGURATION OF MEMORY."], "jumps": ["P2001", "P2570"]}, {"id": "P2920", "text": ["1.  All memory beyond the original 1M is considered Extended\n     Memory (XMS).  XMS stands for Extended Memory \n     Specification.", "1. All memory beyond the original 1M is considered Extended Memory (XMS). XMS stands for Extended Memory Specification."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2.  REAL MODE - A mode available in all 8086-compatible\n     processors that enables compatibility with the original 8086. \n     In this mode RAM storage is limited to 1M.", "2. REAL MODE - A mode available in all 8086-compatible processors that enables compatibility with the original 8086. In this mode RAM storage is limited to 1M."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3.  PROTECTED MODE - This mode is available in all '286 or '386 \n     compatible processors. In this mode RAM storage is extended\n     to 16M ('286) and 4G ('386DX >). This mode also allows \n     restricted protection levels to be set to trap software crashes\n     and control the system.", "3. PROTECTED MODE - This mode is available in all '286 or '386 compatible processors. In this mode RAM storage is extended to 16M ('286) and 4G ('386DX >). This mode also allows restricted protection levels to be set to trap software crashes and control the system."], "jumps": ["P2950", "P2930"]}, {"id": "P2950", "text": ["4. VIRTUAL REAL MODE - This mode is available in all '386 compatible processors. This mode permits RAM storage up to 4G. This mode also allows restricted protection levels to be set to trap software crashes and control the system. Further, individual real mode compatible sessions can be set up and maintained separately from each other."], "jumps": ["P2960", "P2930"]}, {"id": "P2960", "text": ["5.  UPPER MEMORY - The UMA (upper memory area) consists of\n     the reserved 384k on an XT system and the first 1M on AT-type\n     systems.  This upper memory provides blocks of RAM used for\n     the system.", "5. UPPER MEMORY - The UMA (upper memory area) consists of the reserved 384k on an XT system and the first 1M on AT-type systems. This upper memory provides blocks of RAM used for the system."], "jumps": ["P2970", "P2930"]}, {"id": "P2970", "text": ["6.  HIGH MEMORY - The HMA (High Memory Area) is roughly the \n     first 64k at the beginning of the first 1M of Extended Memory.", "6. HIGH MEMORY - The HMA (High Memory Area) is roughly the first 64k at the beginning of the first 1M of Extended Memory."], "jumps": ["P2980", "P2960"]}, {"id": "P2980", "text": ["7.  EXPANDED MEMORY - Prior to Extended Memory, Expanded\n     Memory Specification (EMS) was used. Expanded Memory is\n     not accessed the same as Conventional and Extended \n     Memory; it cannot be directly addressed by the \n     processor.", "7. EXPANDED MEMORY - Prior to Extended Memory, Expanded Memory Specification (EMS) was used. Expanded Memory is not accessed the same as Conventional and Extended Memory; it cannot be directly addressed by the processor."], "jumps": ["P2990", "P2970"]}, {"id": "P2990", "text": ["8.  A cache is basically very high-speed memory.", "8. A cache is basically very high-speed memory............"], "jumps": ["P2995", "P2980"]}, {"id": "P2995", "text": ["9.  An L1 cache is internal to the processor, while an L2 cache is \n     external.", "9. An L1 cache is internal to the processor, while an L2 cache is external."], "jumps": ["P2999", "P2990"]}, {"id": "P2999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2990"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["The two primary forms of memory are _______ and _______"], "jumps": []}, {"id": "P10211", "text": [], "jumps": []}, {"id": "P10212", "text": [], "jumps": []}, {"id": "P10213", "text": [], "jumps": []}, {"id": "P10214", "text": [], "jumps": []}, {"id": "P10215", "text": ["What is not one of the functional categories of ROM?"], "jumps": []}, {"id": "P10216", "text": ["Once a PROM has let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
