<script>
const book = {"title": "9395T302", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ..", "Title: DC MOTORS AND GENERATORSasd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe the operation of DC motors. w Describe the operation of DC generators.", "w Observe the normal operation of a DC motor-generator set. w Measure signals in the control circuits for a DC motor- generator set. w Troubleshoot a DC motor-generator set."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 480 Analog Multimeter XXXXXXnt"], "jumps": []}, {"id": "P330", "text": [], "jumps": ["PGO", "P"]}, {"id": "P400", "text": ["In this lesson, you will learn about the operation of DC motors and generators.", "DC Voltage Input Mechanical Output", "Mechanical Input DC Voltage Output"], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["These devices are commonly found in many types of electronic equipment when motion or alternate power is required."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["DC motors and DC generators are types of rotating machinery."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["As an electronic technician you will be required to service equipment that uses DC motors and generators."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["More and more electronic devices are using rotating machinery."], "jumps": ["P450", "P420"]}, {"id": "P450", "text": ["Motors drive components to produce motion and generators supply power that is not normally available."], "jumps": ["P460", "P440"]}, {"id": "P460", "text": ["Let's begin the lesson on DC MOTORS AND GENERATORS........................"], "jumps": ["P440"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1015", "text": ["All DC motors and generators -- in fact all rotating machinery -- operate on the same principle: magnetism."], "jumps": ["P1020", "P1001"]}, {"id": "P1020", "text": ["The first principle of magnetism used in motors-generators is; like magnetic poles repel and unlike magnetic poles attract."], "jumps": ["P1030", "P1015"]}, {"id": "P1030", "text": ["When two magnetic poles, of the same potential, are close together, the magnetic fields repel the magnets."], "jumps": ["P1040", "P1015"]}, {"id": "P1040", "text": ["When two magnetic poles, of opposite potential, are close together, the magnetic fields attract the magnets......."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["The second principle of magnetism used in motors and generators is that; when passing a conductor through a magnetic field an electric current is produced........."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["When the conductor moves up through the magnetic field, current flow is produced......"], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["When the conductor moves down through the magnetic field, opposite current flow is produced."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["As long as these two principles are remembered, motor and generator action is simple.", "DC Voltage Input Mechanical Output", "Mechanical Input DC Voltage Output"], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["Let's start with motor action.............................."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["Basic DC motor action is based on the magnetic principle of attraction and repulsion."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["The basic DC motor consists of a magnetic rotor that is free to rotate."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["The rotor is connected to the output shaft, and this combination rotates on a single pivot point."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["The rotor is placed between two fixed magnetic stators."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["Notice the rotor and stator's magnetic poles are the same."], "jumps": ["P1150", "P1110"]}, {"id": "P1150", "text": ["Since like magnetic poles repel, the rotor will rotate around the pivot."], "jumps": ["P1160", "P1110"]}, {"id": "P1160", "text": ["Once the rotor and stator magnetic poles are opposite, attraction will continue the rotation."], "jumps": ["P1170", "P1110"]}, {"id": "P1170", "text": ["Because unlike poles attract, when the rotor has turned 180 degrees rotation stops."], "jumps": ["P1180", "P1110"]}, {"id": "P1180", "text": ["Of course, this is not continuous motion, only a rotation of 180 degrees."], "jumps": ["P1190", "P1110"]}, {"id": "P1190", "text": ["To continue the rotation, the magnetic poles of the rotor must be reversed."], "jumps": ["P1200", "P1110"]}, {"id": "P1200", "text": ["Now, the rotor will rotate another 180 degrees."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["As long as the magnetic poles of the rotor are reversed, the rotation will continue."], "jumps": ["P1220", "P1190"]}, {"id": "P1220", "text": ["The motor action you have observed is not true motor operation because the poles of a magnet can not be changed."], "jumps": ["P1230", "P1190"]}, {"id": "P1230", "text": ["The motor action you observed was used to illustrate basic motor action."], "jumps": ["P1240", "P1190"]}, {"id": "P1240", "text": ["DC motors operate on the principle of _______e on?.........", "passing a conductor through a magnetic field."], "jumps": ["P1190"]}, {"id": "P1241", "text": [], "jumps": []}, {"id": "P1242", "text": ["Passing a conductor through a magnetic field produces current flow. Motor action does not operate on that principle."], "jumps": []}, {"id": "P1243", "text": ["Current passing through a coil produces an electromagnet. Motor action does not operate on this principle."], "jumps": []}, {"id": "P1250", "text": ["To produce actual DC motor action, the permanent magnet rotor is replaced by an electromagnetic rotor."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["By applying a DC voltage, in one polarity, a North and South pole is produced."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["By reversing the polarity, the North and South poles are reversed."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["Reversing the polarity is accomplished by using brushes and a commutator."], "jumps": ["P1290", "P1250"]}, {"id": "P1290", "text": ["The brushes are made of a soft conductive material and ride on the commutator."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["The commutator is in 2 pieces, these are connected to the ends of a wire loop. The wire loop is wrapped around the rotor."], "jumps": ["P1310", "P1280"]}, {"id": "P1310", "text": ["More than one loop is used in DC motors. Only one is shown for clarity."], "jumps": ["P1320", "P1280"]}, {"id": "P1320", "text": ["With the DC voltage applied, the \"b'' half of the rotor becomes a North pole and the \"a'' half becomes a South pole."], "jumps": ["P1330", "P1280"]}, {"id": "P1330", "text": ["Since the rotor and stator have like poles, the attraction and repulsion of the poles cause rotation."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["Because the stator and rotor poles are opposite, rotation stops."], "jumps": ["P1350", "P1320"]}, {"id": "P1350", "text": ["Due to the brushes and commutator, the poles of the rotor reverse."], "jumps": ["P1360", "P1320"]}, {"id": "P1360", "text": ["Since like poles repel, the rotor continues to rotate."], "jumps": ["P1370", "P1320"]}, {"id": "P1370", "text": ["The brushes and commutator again reverse the polarity."], "jumps": ["P1380", "P1320"]}, {"id": "P1380", "text": [], "jumps": ["P1390", "P1320"]}, {"id": "P1390", "text": ["By using brushes, a commutator, and an electromagnet rotor, true continuous DC motor action occurs."], "jumps": ["P1400", "P1320"]}, {"id": "P1400", "text": ["What type of magnet is used for the rotor in a true DC motor?"], "jumps": ["P1320"]}, {"id": "P1401", "text": [], "jumps": []}, {"id": "P1402", "text": ["Permanent magnet rotors can not be used because the poles can not be reversed."], "jumps": []}, {"id": "P1403", "text": ["A magnetic rotor must be used to produce the attraction and repulsion needed for DC motor action."], "jumps": []}, {"id": "P1410", "text": ["This schematic symbol illustrates a permanent magnet (PM) DC motor."], "jumps": ["P1420", "P1400", "PM"]}, {"id": "P1420", "text": ["The term PM is used because the stator uses a permanent magnet."], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["Other types of DC motors use electromagnet stators........."], "jumps": ["P1440", "P1410"]}, {"id": "P1440", "text": ["The voltage for the stator windings comes from the same source used for the rotor."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["One configuration places the stator windings in parallel to the rotor windings. This is a Shunt DC motor."], "jumps": ["P1460", "P1430"]}, {"id": "P1460", "text": ["The other configuration places the stator windings in series to the rotor windings. This is a Series DC Motor."], "jumps": ["P1470", "P1430"]}, {"id": "P1470", "text": ["No matter what type of DC motor used, the basic operation is the same."], "jumps": ["P1480", "P1430"]}, {"id": "P1480", "text": ["What type of DC motor is illustrated?......................"], "jumps": ["P1470"]}, {"id": "P1481", "text": [], "jumps": []}, {"id": "P1482", "text": ["A PM DC motor does not use stator windings as shown........"], "jumps": []}, {"id": "P1483", "text": ["A series DC motor has the stator windings in series to the rotor as shown."], "jumps": []}, {"id": "P1490", "text": ["Now, let's look at DC Generator action....................."], "jumps": ["P1500", "P1480"]}, {"id": "P1500", "text": ["Basic DC generator action is based on the principle that by passing a conductor through a magnetic field, a current or voltage is produced."], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["The construction of the DC generator is almost identical to the DC motor."], "jumps": ["P1520", "P1500"]}, {"id": "P1520", "text": ["The difference is that the power source is replaced with a load."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": [], "jumps": ["P1540", "P1510"]}, {"id": "P1540", "text": ["As the armature is rotated through the magnetic field of the permanent magnet stator, a current or voltage is produced."], "jumps": ["P1550", "P1510"]}, {"id": "P1550", "text": ["The brushes and commutator ensure that the current flow generated flows through the load in one direction only, this is DC current."], "jumps": ["P1560", "P1510"]}, {"id": "P1560", "text": ["What principle of magnetism do DC generators operate on?...", "passing a conductor through a magnetic fielddd."], "jumps": ["P1510"]}, {"id": "P1561", "text": [], "jumps": []}, {"id": "P1562", "text": ["The attraction and repulsion principle is used in motor action."], "jumps": []}, {"id": "P1563", "text": ["Passing a current through a coil produces an electromagnet. Generator action does not operate on that principle."], "jumps": []}, {"id": "P1570", "text": ["The action of the One Loop or Two Pole DC generator produces pulsating DC voltage. The action of the One Loop or Two Pole DC generator produces pulsating DC voltage....."], "jumps": ["P1580", "P1560"]}, {"id": "P1580", "text": ["When the armature is at the 0/360 degree position, the armature's motion is parallel to the magnetic field of the stator and no lines of force are cut."], "jumps": ["P1590", "P1570"]}, {"id": "P1590", "text": ["Since no lines of force are cut, no voltage is produced."], "jumps": ["P1600", "P1580"]}, {"id": "P1600", "text": ["As the armature rotates towards the 90 degree position movement is perpendicular to the lines of force."], "jumps": ["P1610", "P1580"]}, {"id": "P1610", "text": ["The perpendicular movement of the armature cuts more and more lines of force. This action increases the voltage."], "jumps": ["P1620", "P1580"]}, {"id": "P1620", "text": ["Continued rotation toward the 180 degree position causes less and less lines of force to be cut."], "jumps": ["P1630", "P1580"]}, {"id": "P1630", "text": ["With no lines of force being cut at the 180 degree position, motion is again parallel to the lines of force, no voltage is produced."], "jumps": ["P1640", "P1580"]}, {"id": "P1640", "text": ["As the armature continues to rotate towards 270 degrees motion becomes perpendicular with the lines of force. This motion cuts through more and more lines of force."], "jumps": ["P1650", "P1580"]}, {"id": "P1650", "text": ["This action increases the voltage output."], "jumps": ["P1660", "P1580"]}, {"id": "P1660", "text": ["The commutator and brushes reverse the current flow to keep the flow in the same direction through the load."], "jumps": ["P1670", "P1580"]}, {"id": "P1670", "text": ["Finally, as the armature's rotation approaches the 0/360 degree position, less and less lines of force are cut and the voltage drops back to zero."], "jumps": ["P1690", "P1580"]}, {"id": "P1690", "text": ["What level of voltage is produced in a DC generator when the armature movement is perpendicular to the stator field?"], "jumps": ["P1580"]}, {"id": "P1691", "text": [], "jumps": []}, {"id": "P1692", "text": ["No voltage is produced when the armature movement is parallel to the stator field, at 0, 180, and 360 degrees."], "jumps": []}, {"id": "P1700", "text": ["To generate a smoother DC output voltage, a two loop or four pole, DC generator is used."], "jumps": ["P1710", "P1690"]}, {"id": "P1710", "text": ["With Loop 1 and Loop 2 ninety degrees apart, the combined output through the commutator produces a smoother DC output voltage."], "jumps": ["P1720", "P1700"]}, {"id": "P1720", "text": ["Note that most commercial DC generators use from 12 to 24 loops (24 to 48 poles)."], "jumps": ["P1730", "P1700"]}, {"id": "P1730", "text": [], "jumps": ["P1740", "P1700"]}, {"id": "P1740", "text": ["This schematic symbol represents a permanent magnet (PM) stator DC generator."], "jumps": ["P1750", "P1700", "PM"]}, {"id": "P1750", "text": ["Note that the symbol is just like the PM DC motor."], "jumps": ["P1760", "P1740"]}, {"id": "P1760", "text": ["The difference between a motor and a generator is the generator does not have an applied voltage to the rotor, only an output load."], "jumps": ["P1770", "P1740"]}, {"id": "P1770", "text": ["Other types of DC generators use an electromagnet stator..."], "jumps": ["P1780", "P1740"]}, {"id": "P1780", "text": ["One configuration, called a separately excited DC generator, uses an external power source for the stator."], "jumps": ["P1790", "P1770"]}, {"id": "P1790", "text": ["The other configuration, called a self excited DC generator, uses the output voltage of the generator to supply the stator voltage."], "jumps": ["P1800", "P1770"]}, {"id": "P1800", "text": ["It may be argued that with no stator current, no armature current can be produced to supply the stator..or."], "jumps": ["P1810", "P1770"]}, {"id": "P1810", "text": ["Due to the retentivity of the stator, a small amount of magnetism is present when the armature is not rotating."], "jumps": ["P1820", "P1770", "P1815"]}, {"id": "P1812", "text": ["Due to the retentivity of the stator, a small amount of magnetism is present when the armature is not rotating."], "jumps": ["P1815", "P1820", "P1770"]}, {"id": "P1815", "text": ["RETENTIVITY - Retentivity of an electromagnet is the small amount of magnetism that remains after a magnetizing force has been removed."], "jumps": []}, {"id": "P1820", "text": ["This small amount of magnetism is enough to produce a small amount of output voltage when the armature begins to rotate."], "jumps": ["P1830", "P1812"]}, {"id": "P1830", "text": ["The generated voltage then adds to the magnetic field of the stator producing more output voltage."], "jumps": ["P1840", "P1812"]}, {"id": "P1840", "text": ["The process continues until equilibrium is reached."], "jumps": ["P1850", "P1812"]}, {"id": "P1850", "text": ["What type of DC generator is illustrated?.................."], "jumps": ["P1812"]}, {"id": "P1851", "text": [], "jumps": []}, {"id": "P1852", "text": ["This is a separately excited DC generator.................."], "jumps": []}, {"id": "P1853", "text": ["This is a self excited DC generator........................"], "jumps": []}, {"id": "P1910", "text": ["This completes the information on DC MOTOR AND GENERATOR ACTION."], "jumps": []}, {"id": "P1920", "text": ["1. DC motors and DC generators operate on the principle of magnetism.", "DC Voltage Input Mechanical Output", "Mechanical Input DC Voltage Output"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. DC motors use attraction and repulsion................."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. The DC motor consists of an electromagnetic rotor, stators, commutator, and brushes."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. The commutator and brushes reverse the polarity of the applied voltage to maintain rotor rotation."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. DC generators use the principle of moving a conductor through a magnetic field to produce a current or voltage."], "jumps": ["P1970", "P1940"]}, {"id": "P1970", "text": ["6. The commutator and brushes reverse the current flow to maintain the flow in one direction through the load.."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7. The schematic symbols for the three types of DC motors are:"], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["8. The schematic symbols for the three types of DC generators are:"], "jumps": ["P1999", "P1980"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1990"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2015", "text": ["In this experiment you will:ere............................", "* Verify that increasing the voltage input to a DC motor increases RPM. * Verify that increasing the RPM input to a DC generator increases the voltage output. * Observe the effects of counter electromotive force. * Observe the effects of loads. * Measure the efficiency of a motor-generator set. * Observe the operation of an automatic speed control circuit. * troubleshoot a motor-generator set."], "jumps": ["P2020", "P2001"]}, {"id": "P2020", "text": ["The motor and generator used in this experiment are located on PC130-180."], "jumps": ["P2030", "P2015", "PJlE"]}, {"id": "P2030", "text": ["Locate the motor and generator on the top of the card."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["The device on the left is the motor, which is physically connected to the generator, on the right. This makes up a motor-generator set."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["Locate the wheel between the motor and generator and the component just below (a LED and photodiode unit)."], "jumps": ["P2060", "P2020"]}, {"id": "P2060", "text": ["The wheel and LED-Photodiode unit are used for automatic speed control."], "jumps": ["P2070", "P2020"]}, {"id": "P2070", "text": ["The rest of the components on the card are used to control the DC motor and supply a load to the generator."], "jumps": ["P2090", "P2020"]}, {"id": "P2090", "text": ["M1 is the motor (PM type) and receives a DC voltage through U1 and IC1."], "jumps": ["P2100", "P2020", "PM"]}, {"id": "P2100", "text": ["S3 selects either an external DC voltage or an internal DC voltage. You will use the internal position only."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["The action of R1, R2, R8, D1, and D2 provide adjustable DC voltage to U1."], "jumps": ["P2120", "P2090"]}, {"id": "P2120", "text": ["The DC voltage is applied to the non-inverting input of U1. The inverting input is from the automatic speed control circuit, through S2."], "jumps": ["P2130", "P2090"]}, {"id": "P2130", "text": ["The output DC voltage of U1 is routed to IC1, a voltage regulator."], "jumps": ["P2140", "P2090"]}, {"id": "P2140", "text": ["The output of IC1 is applied through TP2, S3, and TP3 to the motor. S3 is used to break the current path for insertion of an ammeter."], "jumps": ["P2150", "P2090"]}, {"id": "P2150", "text": ["By adjusting R8, the speed of the motor can be manually controlled."], "jumps": ["P2160", "P2090"]}, {"id": "P2160", "text": ["M2 is the generator that is driven by the motor............"], "jumps": ["P2170", "P2090"]}, {"id": "P2170", "text": ["S4 breaks the circuit for inserting an ammeter."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["S5 and S6 apply different loads to the generator. D3 illuminates when R6 is applied."], "jumps": ["P2190", "P2160"]}, {"id": "P2190", "text": ["The rest of the circuit is used for automatic speed control. Let's see how speed control operates."], "jumps": ["P2200", "P2160"]}, {"id": "P2200", "text": ["Look on the PC130-180 card at the wheel. Half is painted black and half is silver."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["The black area of the wheel will not reflect light, the silver area will."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["The LED under the wheel, part of IS01, generates and shines light up towards the wheel."], "jumps": ["P2230", "P2200"]}, {"id": "P2230", "text": ["When the black area of the wheel is over the LED, no light is reflected back to the photodiode, also part of IS01."], "jumps": ["P2240", "P2200"]}, {"id": "P2240", "text": [], "jumps": ["P2250", "P2200"]}, {"id": "P2250", "text": ["When the silver area is over the LED, light is reflected back to the photodiode."], "jumps": ["P2260", "P2200"]}, {"id": "P2260", "text": ["The output of the photodiode is maximum..............."], "jumps": ["P2270", "P2200"]}, {"id": "P2270", "text": ["The output of the photodiode as the wheel rotates, is square wave pulses with a frequency equal to the speed of the motor-generator set."], "jumps": ["P2280", "P2200"]}, {"id": "P2280", "text": ["The output of the photodiode represents RPS (revolutions per second). RPS is used because frequency is in cycles per second, Hz."], "jumps": ["P2290", "P2200"]}, {"id": "P2290", "text": ["The output of the photodiode is applied as a frequency to voltage (F/V) converter, U2."], "jumps": ["P2300", "P2200"]}, {"id": "P2300", "text": ["If the input frequency increases, meaning RPS increased, the voltage output of U2 on pin 7 increases."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["If the input frequency decreases, meaning RPS decreased, the voltage output of the F/V converter decreases."], "jumps": ["P2320", "P2290"]}, {"id": "P2320", "text": ["The voltage output of the F/V converter is then applied to U1 to change the applied voltage to the motor through S2."], "jumps": ["P2330", "P2290", "P2325"]}, {"id": "P2322", "text": ["The voltage output of the F/V converter is then applied to U1 to change the applied voltage to the motor through S2."], "jumps": ["P2330", "P2290", "P2325"]}, {"id": "P2325", "text": ["OP-AMP U1 - U1 is an op-amp configured for a diference amplifier. The output is the voltage on the non-inverting input minus the voltage on the inverting input."], "jumps": []}, {"id": "P2330", "text": ["If the RPS increases, the voltage output of the F/V converter increases which will decrease the output voltage of U1."], "jumps": ["P2340", "P2290"]}, {"id": "P2340", "text": ["The decreased output of U1 causes the motor to slow down, compensating for the increase in RPS."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["If the RPS decreases, the voltage output of the F/V converter decreases which will increase the output voltage of U1."], "jumps": ["P2360", "P2330"]}, {"id": "P2360", "text": ["The increased output of U1 causes the motor to speed up, compensating for the decrease in RPS."], "jumps": ["P2370", "P2330"]}, {"id": "P2370", "text": ["This is automatic speed control. If no automatic speed control is needed, S2 is placed in the open position."], "jumps": ["P2380", "P2330"]}, {"id": "P2380", "text": ["The other components connected to U2 scale the output voltage."], "jumps": ["P2390", "P2330"]}, {"id": "P2390", "text": ["Let's start the experiment!e..............................."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["1. Set the Test Console controls to their initial control settings........"], "jumps": ["P2390"]}, {"id": "P2410", "text": ["2. Insert the PC130-180 into the PC1 position on the Test Console."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["3. Set the Voltmeter Switch to Positive. 4. Set the Positive Supply Voltage to 12. The Test Console's Voltage Meter should indicate 12 volts."], "jumps": ["P2410"]}, {"id": "P2430", "text": ["5. Set the Voltmeter Switch to Negative. 6. Set the Negative Supply Voltage to 12. The Test Console's Voltage Meter should indicate 12 volts."], "jumps": ["P2420"]}, {"id": "P2440", "text": ["7. On PC130-180, set the controls as follows:.............", "A. S1 to INT, (left) B. S2 to OPEN, (left) C. S3 to CLOSED, (right) D. S4 to CLOSED, (right) E. S5 and S6 to OPEN, (down) F. R7 and R8 to mid position"], "jumps": ["P2450", "P2430"]}, {"id": "P2450", "text": ["8. Turn PC1 Power Switch to ON.ntrol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2440"]}, {"id": "P2460", "text": ["Is the motor-generator set rotating?......................."], "jumps": ["P2450"]}, {"id": "P2461", "text": [], "jumps": []}, {"id": "P2462", "text": ["The motor-generator set should be rotating. check your card settings.", "A. S1 to INT, (left) B. S2 to OPEN, (left) C. S3 to CLOSED, (right) D. S4 to CLOSED, (right) E. S5 and S6 to OPEN, (down) F. R7 and R8 to mid position"], "jumps": []}, {"id": "P2470", "text": ["Now let's verify that when the applied voltage is changed, RPS is changed.anging the applied voltage to the motor, the RPS changes."], "jumps": ["P2480", "P2460"]}, {"id": "P2480", "text": ["1. Connect the frequency counter to TP6. The frequency readout of the counter indicates cycles per second and since TP6 measures the square wave output of IS01, the readout is also revolutions per second or RPS."], "jumps": ["P2490", "P2470", "P2485"]}, {"id": "P2490", "text": ["The direct conversion between frequency and RPS is because for each rotation of the wheel between the motor and generator, one cycle of the square wave is produced. You may leave the frequency counter connected to TP6 throughout this experiment..."], "jumps": ["P2500", "P2480"]}, {"id": "P2500", "text": ["2. Set the multimeter to measure voltage. Connect the test leads between TP3 and ground. Note the DC voltage."], "jumps": ["P2510", "P2490", "P2505"]}, {"id": "P2510", "text": ["3. Adjust R8 CW and CCW and observe the voltage on TP3 and RPS. 4. Return R8 to the mid position."], "jumps": ["P2520", "P2500", "P2515"]}, {"id": "P2520", "text": ["What happened to RPS when the applied voltage to the motor increased?"], "jumps": ["P2510"]}, {"id": "P2521", "text": [], "jumps": []}, {"id": "P2522", "text": ["Motors do not decrease RPS when the applied voltage increases."], "jumps": []}, {"id": "P2530", "text": ["You verified that in a motor: xt, let's see if the DC generator is operating and if the RPS input changes the output voltage."], "jumps": ["P2532", "P2520"]}, {"id": "P2532", "text": ["Now lets see if the DC generator is operating and if the RPS input changes the output voltage. put changes the output voltage."], "jumps": ["P2540", "P2530"]}, {"id": "P2540", "text": ["1. Connect the multimeter set to measure voltage to TP4 and ground. The presence of a voltage indicates that the DC generator is operating."], "jumps": ["P2550", "P2532", "P2545"]}, {"id": "P2550", "text": ["2. Connect the multimeter between ground and TP5. While measuring the voltage on TP5, place S4 to OPEN, left. Opening S4 disconnects the applied voltage from the generator. Notice, the voltage on TP5 drops to zero. This proves that the generator was developing the output voltage.ltage.e."], "jumps": ["P2560", "P2540", "P2555"]}, {"id": "P2560", "text": ["3. Place S4 to CLOSED, right. 4. While observing the voltage on TP4, vary R8 CW and CCW. 5. Return R8 to mid position."], "jumps": ["P2570", "P2550", "P2565"]}, {"id": "P2570", "text": ["What happens to the output voltage of the generator when the voltage applied to the motor decreases????????????????????"], "jumps": ["P2560"]}, {"id": "P2571", "text": [], "jumps": []}, {"id": "P2572", "text": ["The voltage output of generators do not increase when the RPS decreases."], "jumps": []}, {"id": "P2573", "text": ["When the RPS input to a generator changes, the output voltage also changes."], "jumps": []}, {"id": "P2580", "text": ["You verified that in generators: xt, let's see the effect of counter electromotive force, CEMF."], "jumps": ["P2582", "P2570"]}, {"id": "P2582", "text": ["Next let's see the effects of Counter Electromotive Force, CEMF. ter electromotive force, CEMF."], "jumps": ["P2590", "P2580"]}, {"id": "P2590", "text": ["Recall that CEMF is a voltage produced by a motor that opposes the applied voltage. CEMF is produced by generator action of the motor."], "jumps": ["P2600", "P2582"]}, {"id": "P2600", "text": ["Since the voltage is internal to the motor, it can not be measured directly. However, you can measure the effects of CEMF by measuring the current drawn by the motor."], "jumps": ["P2610", "P2590"]}, {"id": "P2610", "text": ["When a DC voltage is first applied to the motor, the rotor is not rotating and the CEMF is zero."], "jumps": ["P2620", "P2600"]}, {"id": "P2620", "text": ["The current drawn equals the applied voltage (Ea) divided by the internal resistance of the rotor (Rr)."], "jumps": ["P2630", "P2610"]}, {"id": "P2630", "text": ["As the rotor begins to rotate, CEMF increases from 0 volts."], "jumps": ["P2640", "P2610"]}, {"id": "P2640", "text": ["Now, the current equals the applied voltage (Ea) minus the CEMF voltage (Ecemf) divided by the internal resistance of the rotor (Rr)."], "jumps": ["P2650", "P2630"]}, {"id": "P2650", "text": ["The current flow is less since Ecemf reduces Ea. This means that the starting current of a motor is higher than the running current."], "jumps": ["P2660", "P2630"]}, {"id": "P2660", "text": ["This is important to the circuits wiring. The wires to the motors must be large enough to handle the higher starting current. Let's measure current and see.", "DC Voltage Input Mechanical Output", "Mechanical Input DC Voltage Output"], "jumps": ["P2670", "P2650"]}, {"id": "P2670", "text": ["1. Place S3 to OPEN, to the left. The motor-generator set should stop."], "jumps": ["P2680", "P2650", "P2675"]}, {"id": "P2680", "text": ["2. Set the analog multimeter to measure current with a range of at least 50 mA. 3. Connect the COM lead to TP2."], "jumps": ["P2690", "P2670", "P2685"]}, {"id": "P2690", "text": ["4. While observing the current reading on the ammeter, connect the V.m.mA lead to TP3. The motor will start as soon as the V.m.mA lead is connected."], "jumps": ["P2700", "P2680", "P2695"]}, {"id": "P2700", "text": ["What happens to current as the motor's RPS increases???PS?."], "jumps": ["P2690"]}, {"id": "P2701", "text": [], "jumps": []}, {"id": "P2702", "text": ["Remember, CEMF increases as the RPS increases. This will not increase the current drawn by the motor."], "jumps": []}, {"id": "P2703", "text": ["Remember, CEMF increases as the RPS increases. The current drawn by the motor will not remain the same."], "jumps": []}, {"id": "P2710", "text": ["You observed, by measuring current, that in a motor: w, let's see the effects of loads on the motor-generator set."], "jumps": ["P2712", "P2700"]}, {"id": "P2712", "text": ["Now let's see the effects of a load on the motor-generator set. ee the effects of loads on the motor-generator set."], "jumps": ["P2720", "P2710"]}, {"id": "P2720", "text": ["1. Remove the ammeter and place S3 to CLOSED, the right. The motor-generator set should be rotating with no load applied, S5 and S6 opened, down."], "jumps": ["P2730", "P2712", "P2725"]}, {"id": "P2730", "text": ["2. While observing the RPS, place S5 to CLOSED (up) applying a load. LED D3 should illuminate. You may look at the motor- generator or use the frequency counter to determine the effect on RPS.."], "jumps": ["P2740", "P2720", "P2735"]}, {"id": "P2740", "text": ["3. While observing the RPS, place S5 back to OPEN (down) disconnecting the load. LED D3 should extinguish. You may look at the motor-generator or use the frequency counter to determine the effect on RPS."], "jumps": ["P2750", "P2730", "P2745"]}, {"id": "P2750", "text": ["What happens to RPS when a load was applied to the motor-generator set, S5 placed to up?"], "jumps": ["P2740"]}, {"id": "P2751", "text": [], "jumps": []}, {"id": "P2752", "text": ["In motors and generators, load and RPS are inversely proportional. That is if one increases, the other decreases."], "jumps": []}, {"id": "P2753", "text": ["In motors and generators, load and RPS are inversely proportional. That is if one increases, the other decreases."], "jumps": []}, {"id": "P2760", "text": ["You verified that in a motor-generator: w, let's measure the efficiency of the motor-generator set."], "jumps": ["P2762", "P2750"]}, {"id": "P2762", "text": ["Now lets measure the efficiency of the motor-generator. the efficiency of the motor-generator set."], "jumps": ["P2770", "P2760"]}, {"id": "P2770", "text": ["In this case, you do not have to change mechanical power to electrical power since the input to the motor is electrical and the output of the generator is electrical."], "jumps": ["P2780", "P2762"]}, {"id": "P2780", "text": ["Efficiency is determined by:..............................."], "jumps": ["P2790", "P2770"]}, {"id": "P2790", "text": ["1. Place S5 to CLOSED (up) to apply a load. 2. Adjust R8 for a voltage measurement of 5 volts on TP3. 5 volts is the applied voltage to the DC motor and is needed to calculate power in."], "jumps": ["P2800", "P2780", "P2795"]}, {"id": "P2800", "text": ["3. Using an ammeter connected across TP2 and TP3 (COM lead to TP2), Place S3 to OPEN (left) and measure the current. What is the measured current?t?"], "jumps": ["P2790", "P2802", "P2805"]}, {"id": "P2801", "text": [], "jumps": []}, {"id": "P2802", "text": ["Ensure the multimeter is set to measure current and placed across TP2 and TP3. Also ensure that S3 is open."], "jumps": []}, {"id": "P2807", "text": ["You still did not enter a correct value for current. You should have measured approximately 55 mA."], "jumps": ["PutVar"]}, {"id": "P2810", "text": ["4. Remove the ammeter and place S3 back to CLOSED, to the right."], "jumps": ["P2820", "P2800", "P2815"]}, {"id": "P2820", "text": ["Calculate the power to the motor. P = E x I E = 5 V I ="], "jumps": ["P2810", "P2822"]}, {"id": "P2821", "text": [], "jumps": []}, {"id": "P2822", "text": ["Multiply voltage and current. 5 V x 55.0 mA volts, by the current, @%20 mA"], "jumps": []}, {"id": "P2823", "text": ["You still have not measured a correct voltage. You should have measured approximately between 125 and 285 mW."], "jumps": ["P2820"]}, {"id": "P2830", "text": ["5. Using a voltmeter, measure the voltage on TP4, the output of the generator. What is the measured voltage?"], "jumps": ["P2820", "P2832", "P2835"]}, {"id": "P2831", "text": [], "jumps": []}, {"id": "P2832", "text": ["Ensure the multimeter is set to measure voltage and that S1 is closed. Also, ensure you are measuring TP4."], "jumps": []}, {"id": "P2837", "text": ["You still have not measured a correct voltage. You should have measured approximately 3 volts."], "jumps": ["P2830"]}, {"id": "P2840", "text": ["6. Using an ammeter connected across TP4 and TP5 (COM lead on TP5), Place S4 to OPEN (left) and measure the current. What is the measured current??"], "jumps": ["P2830", "P2842", "P2845"]}, {"id": "P2841", "text": [], "jumps": []}, {"id": "P2842", "text": ["You did not measure a correct value of current. Ensure that the ammeter is connected across TP4 and TP5 and that S4 is open."], "jumps": []}, {"id": "P2847", "text": ["You still did not measure the correct value for current. You should have measured approximately 38 mA."], "jumps": ["P2840"]}, {"id": "P2850", "text": ["7. Remove the ammeter and return S4 to CLOSED, to the right."], "jumps": ["P2860", "P2840", "P2855"]}, {"id": "P2860", "text": ["Calculate the power output of the generator, Pout. P = E x I E = I = in a variable.able.le."], "jumps": ["P2850", "P2862"]}, {"id": "P2861", "text": [], "jumps": []}, {"id": "P2862", "text": ["Multiply voltage and current to find Pout.tage times the current........."], "jumps": []}, {"id": "P2867", "text": ["You still did not calculate the correct power. You should have calculated:"], "jumps": ["P2870", "P2860", "PutVar"]}, {"id": "P2870", "text": ["Now, calculate efficiency. Efficiency (%) = Pout/Pin x 100 Pin = Pout ="], "jumps": ["P2872"]}, {"id": "P2871", "text": [], "jumps": []}, {"id": "P2872", "text": ["You did not divide the Pout by Pin correctly. Be sure to multiply by 100.."], "jumps": []}, {"id": "P2877", "text": ["You still have not calculated the efficiency correctly. You should have calculated:"], "jumps": ["P2880", "P2870", "PutVar"]}, {"id": "P2880", "text": ["The larger the percent, the more efficient the motor-generator. Commercial motors and generators normally have an efficiency of 80% or more. M1/M2 efficiency, !%25%", "Now, let's investigate the automatic speed control circuit. Recall that the circuit consists of the LED-Photo Diode unit, IS01, and the frequency to voltage converter, U2."], "jumps": ["P2890", "P2870", "P2900", "P2880"]}, {"id": "P2900", "text": ["1. Place S5 to OPEN (down) and then back to CLOSED (up). Notice that the RPS of the motor generator set changed as the load was removed and then connected again.."], "jumps": ["P2910", "P2890", "P2905"]}, {"id": "P2910", "text": ["The motor generator set is operating in the Open Loop mode, no automatic speed control or feedback...."], "jumps": ["P2920", "P2900"]}, {"id": "P2920", "text": ["2. Using the oscilloscope, measure the signal on TP6. This is the output of IS01 and input to U2 (the frequency to voltage converter), it is a square wave that represents the speed of the motor-generator."], "jumps": ["P2930", "P2910", "P2925"]}, {"id": "P2930", "text": ["3. While observing the signal on TP6, place S5 to OPEN (down) and back to CLOSED (up). You should have noticed the frequency of the square change as the RPS changed due to changes in the load."], "jumps": ["P2940", "P2920", "P2935"]}, {"id": "P2940", "text": ["4. Using a voltmeter, measure the voltage on TP7. This is the output of the frequency to voltage converter, U2."], "jumps": ["P2950", "P2930", "P2945"]}, {"id": "P2950", "text": ["5. While observing the voltage, place S2 to OPEN (down) and then back to CLOSED (up). You should have seen the voltage increase as the RPS increased and decrease as the RPS decreased. This is the feedback signal to the DC motor supply voltage."], "jumps": ["P2960", "P2940", "P2955"]}, {"id": "P2960", "text": ["6. Using a voltmeter, measure the voltage on TP2. This is the DC voltage that drives the motor.."], "jumps": ["P2970", "P2950", "P2965"]}, {"id": "P2970", "text": ["7. While observing the voltage, place S2 to OPEN (down) and back to CLOSED (up). You should have seen the voltage remain constant. S2 is open and not allowing the feedback voltage to effect the voltage applied to the motor, open loop mode."], "jumps": ["P2980", "P2960", "P2975"]}, {"id": "P2980", "text": ["8. Place S2 to CLOSED, to the right. This places the motor- generator set into the Closed Loop mode."], "jumps": ["P2990", "P2970", "P2985"]}, {"id": "P2990", "text": ["9. While observing the voltage on TP2 and the RPS, place S5 to OPEN (down) and then back to CLOSED (up). The voltage on TP2 should change and the RPS should remain constant!"], "jumps": ["P3000", "P2980", "P2995"]}, {"id": "P3000", "text": ["The automatic speed control circuit operates correctly....."], "jumps": ["P3020", "P2990"]}, {"id": "P3005", "text": ["RPS INCREASE - An increase in RPS increases the frequency of the squarewave and causes the output of the F/V converter to increase. This decreases the output of U1 which decreases the RPS back to normal."], "jumps": []}, {"id": "P3010", "text": ["RPS DECREASE - A decrease in RPS decreases the frequency of the squarewave and causes the output of the F/V converter to decrease. This increases the output of U1 which increases the RPS back to normal."], "jumps": []}, {"id": "P3020", "text": ["You have seen the operation of the motor-generator set in the open and closed loop modes. Last, let's walk through a couple of typical faults that are common in motor-generator sets."], "jumps": ["P3030", "P3000"]}, {"id": "P3030", "text": ["1. Ensure equipment set up is as follows:.................", "A. S1 to INT B. S2 to OPEN, (left) C. S3 and S4 to (right) D. S5 and S6 to down E. Adjust R8 for 5 volts on TP3 F. Measure for voltage on TP4 mid position"], "jumps": ["P3020", "P3035"]}, {"id": "P3040", "text": ["The switch settings place the motor-generator set to the open loop mode, no speed control and no load on the generator. R8 setting establishes the input voltage to the motor and the motor should be rotating. A voltage on TP4 indicates that the generator is operating..."], "jumps": ["P3030"]}, {"id": "P3050", "text": ["2. Place PC1 POWER switch to OFF. Stopping the motor-generator set...................."], "jumps": ["P3040"]}, {"id": "P3060", "text": ["The computer will now enter a fault into the motor-generator set.to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P3050"]}, {"id": "P3070", "text": ["To troubleshoot a motor-generator set, a visual check is first done to see if the motor is rotating. If NOT rotating, the fault is in the motor or the circuit that supplies power -- troubleshoot the motor and motor circuits. If the motor is rotating, the motor and motor circuits are OK.."], "jumps": ["P3060"]}, {"id": "P3080", "text": ["If the motor and motor circuits are OK, the second step is to measure for an output voltage from the generator. If there IS a voltage, the generator and load is OK. If there IS NO voltage, troubleshoot the generator and load..."], "jumps": ["P3070"]}, {"id": "P3090", "text": ["3. Turn PC1 Power Switch to ON.ntrol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P3080"]}, {"id": "P3100", "text": ["4. Do a visual check of the motor. Is the fault in the motor or possibly in the generator??"], "jumps": ["P3090"]}, {"id": "P3101", "text": [], "jumps": []}, {"id": "P3102", "text": ["The motor should be rotating. The fault is not in the motor or motor circuits."], "jumps": []}, {"id": "P3110", "text": ["5. Measure the output voltage of the generator on TP4. Is the generator and generator circuit at fault or is there no fault since the motor is OK?"], "jumps": ["P3100", "P3115"]}, {"id": "P3111", "text": [], "jumps": []}, {"id": "P3112", "text": ["There is a fault, you should have measured 0 volts on TP4.."], "jumps": []}, {"id": "P3120", "text": ["Since there is no load applied to the generator (S5 and S6 down) and the generator is not producing an output voltage, the fault is the generator."], "jumps": ["P3110"]}, {"id": "P3130", "text": ["Motor-generator sets in the open loop mode are easy to troubleshoot. The computer will now remove the fault.9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P3120"]}, {"id": "P3140", "text": ["6. Measure the output voltage of the generator on TP4 and verify that the generator has been repaired."], "jumps": ["P3150", "P3130"]}, {"id": "P3150", "text": ["Troubleshooting closed loop motor-generator sets is a little more complex. First, you determine if the motor and generator are operating correctly like you did previously."], "jumps": ["P3160", "P3140"]}, {"id": "P3160", "text": ["Then you apply a load to check that the RPS remains constant, seeing if the automatic speed control circuit operates correctly. If the RPS does not change, there is no fault. If the RPS changes, there is a fault in theautomatic speed control circuit..."], "jumps": ["P3170", "P3150"]}, {"id": "P3170", "text": ["1. Ensure equipment set up is as follows:.................", "A. S1 to INT (left) B. S2 to CLOSED, (right) C. S3 and S4 to CLOSED (right) D. S5 and S6 OPEN, (down) E. Adjust R8 for 5 volts on TP3 F. Measure for voltage on TP4"], "jumps": ["P3180", "P3160", "P3175"]}, {"id": "P3180", "text": ["The switch settings place the motor/generator set to the closed loop mode, automatic speed control, and no load on the generator. R8 setting establishes the input voltage to the motor and the motor should be rotating. A voltage on TP4 indicates that the generator is operating..."], "jumps": ["P3190", "P3170"]}, {"id": "P3190", "text": ["2. Place PC1 POWER switch to OFF. Stopping the motor-generator set...................."], "jumps": ["P3180"]}, {"id": "P3200", "text": ["The computer will now enter a fault into the motor-generator set.to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P3190"]}, {"id": "P3210", "text": ["3. Turn PC1 Power Switch to ON.ntrol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P3200"]}, {"id": "P3220", "text": ["4. Do a visual check of the motor and measure the output voltage of the generator on TP4. Is the motor, generator, or neither faulted?"], "jumps": ["P3210", "P3225"]}, {"id": "P3221", "text": [], "jumps": []}, {"id": "P3222", "text": ["The motor should be rotating. It is not faulted..........."], "jumps": []}, {"id": "P3223", "text": ["There should be a voltage on TP4, the generator is not faulted."], "jumps": []}, {"id": "P3230", "text": ["You have determined that the motor and generator are operating, now check out the automatic speed control circuit and see if it is operating."], "jumps": ["P3240", "P3220"]}, {"id": "P3240", "text": ["5. Place S5 to CLOSED (up) and then to OPEN (down). This applies and removes a load. Does the RPS remain constant?"], "jumps": ["P3230", "P3245"]}, {"id": "P3241", "text": [], "jumps": []}, {"id": "P3242", "text": ["The RPS should have changed, the automatic speed circuit is faulted..."], "jumps": []}, {"id": "P3250", "text": ["Since there is a fault in the automatic speed control circuit, you must signal trace from IS01 to U1."], "jumps": ["P3260", "P3240"]}, {"id": "P3260", "text": ["6. Using an oscilloscope, carefully measure the square wave signal on U2, Pin 1 while placing S5 UP and DOWN. If no signal is present, the fault is in IS01, the LED-Photo Diode unit. Since a signal is present, the fault is located elsewhere.."], "jumps": ["P3270", "P3250", "P3265"]}, {"id": "P3270", "text": ["7. Using a voltmeter, measure the voltage on TP7 while placing S5 UP and DOWN (changing load). If the voltage remains constant, the fault is in U2, the frequency to voltage converter. Since, the output of U2 changes as the load changes, the fault is elsewhere."], "jumps": ["P3280", "P3260", "P3275"]}, {"id": "P3280", "text": ["8. Using a voltmeter, carefully measure the voltage on U1 pin 2 while placing S5 UP and DOWN. If the voltage remained constant, the fault is between TP7 and Pin 2 of U1, probably R4. If the voltage changes, the fault is in U1."], "jumps": ["P3290", "P3270", "P3285"]}, {"id": "P3290", "text": ["What is the probable fault? typed.........................."], "jumps": ["P3280", "P3295"]}, {"id": "P3291", "text": [], "jumps": []}, {"id": "P3292", "text": ["The voltage remained constant on Pin 2 of U1, when switching S5 up then down. The feedback signal is not reaching U1, U1 is not the fault."], "jumps": []}, {"id": "P3300", "text": ["The computer will now remove the fault.ault. the PC1 DC switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P3290"]}, {"id": "P3310", "text": ["9. Place S5 UP and DOWN and verify that the RPS remains constant. Even though troubleshooting closed loop circuits is more complex, it is still not difficult if you use a systematic approach."], "jumps": ["P3320", "P3300", "P3315"]}, {"id": "P3320", "text": ["1. Disconnect all test equipment from the PC card. 2. Return the test console controls to their Initial Control Settings."], "jumps": ["P3310"]}, {"id": "P3330", "text": ["3. Set the Test Console Power OFF. OFF...................."], "jumps": ["P3320"]}, {"id": "P3340", "text": ["4. Remove experiment card PC130-180. 5. Return all equipment to their designated storage areas."], "jumps": ["P3910", "P3330"]}, {"id": "P3910", "text": ["This completes the experiment on DC MOTORS AND GENERATORS.."], "jumps": ["P3340"]}, {"id": "P5000", "text": [], "jumps": []}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["What principle of magnetism do motors operate on?", "passing a current through a conductor produces a magnet", "passing a conductor through a magnetic field produces voltage"], "jumps": []}, {"id": "P10211", "text": ["What principle of magnetism do generators operate on?", "passing a current through a conductor produces a magnet", "passing a conductor through a magnetic field produces voltage"], "jumps": []}, {"id": "P10212", "text": ["What principle of magnetism allows a generator to power its own stator windings and still generate an output voltage?", "passing a current through a conductor produces a magnet", "passing a conductor through a magnetic field produces voltage"], "jumps": []}, {"id": "P10213", "text": ["of magnetism allows the use of eThis is where the final quiz question is typed. +", "passing a current through a conductor produces a magnet", "passing a conductor through a magnetic field produces voltage", "What principle of magnetism allows the use of electromagnet stators??"], "jumps": []}, {"id": "P10214", "text": ["How is a pulsating DC output eliminated in DC generators?"], "jumps": []}, {"id": "P10215", "text": ["What part of a motor allows reversing the magnetic poles in the rotor?"], "jumps": []}, {"id": "P10216", "text": ["This schematic represents what type of rotating machine?"], "jumps": []}, {"id": "P10217", "text": ["This schematic represents what type of rotating machine?"], "jumps": []}, {"id": "P10218", "text": ["In a generator, when the armature rotation is parallel to the stator magnetic field, what is the output voltage?"], "jumps": []}, {"id": "P10219", "text": ["the power source to the rotor is replaced in a generator with a load", "What is the primary difference between a DC motor and DC generator?", "commutator and brushes are not used in the generator", "an electromagnet stator is used in the generator"], "jumps": []}, {"id": "P10220", "text": ["In the automatic speed control circuit, what is the purpose of U2?"], "jumps": []}, {"id": "P10221", "text": ["In the automatic speed control circuit, what happens to the frequency output of ISO1 if the load on M2 increases?"], "jumps": []}, {"id": "P10222", "text": ["In the automatic speed control circuit, what happens to the output of U2 if the load on M2 decreases?"], "jumps": []}, {"id": "P10223", "text": ["In the motor's voltage source circuit, what is the purpose of IC1?"], "jumps": []}, {"id": "P10224", "text": ["In the motor's voltage source circuit, what is the purpose of U1?"], "jumps": []}, {"id": "P10225", "text": ["In the motor's voltage source circuit, what is the purpose of R8?"], "jumps": []}, {"id": "P10226", "text": ["In U1, if the non-inverting input voltage remains constant and the inverting input voltage increases, what happens to the output voltage?", "Voltage Input From Frequency to Voltage Converter"], "jumps": []}, {"id": "P10227", "text": ["In a motor, it is important to know that the starting current _______"], "jumps": []}, {"id": "P10228", "text": ["When troubleshooting a motor-generator set, if the set is not rotating, what is the probable faulted area?"], "jumps": []}, {"id": "P10229", "text": ["How do you troubleshoot an automatic speed control circuit in a motor-generator set?"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to __________"], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P13015", "text": ["In this experiment you will:ere............................", "* Verify that increasing the voltage input to a DC motor increases RPM. * Verify that increasing the RPM input to a DC generator increases the voltage output. * Observe the effects of counter electromotive force. * Observe the effects of loads. * Measure the efficiency of a motor-generator set. * Observe the operation of an automatic speed control circuit. * troubleshoot a motor-generator set.."], "jumps": ["P13020", "P2001"]}, {"id": "P13020", "text": ["The motor and generator used in this experiment are located on PC130-180.Throughout the remainder of the lesson the schematic diagram may be brought up at any time by pressing Ctrl S (Holding the computer keyboard Ctrl key while pressing the S key)...."], "jumps": ["P13030", "P13015", "PJlE"]}, {"id": "P13030", "text": ["Locate the motor and generator on the top of the card."], "jumps": ["P13040", "P13020"]}, {"id": "P13040", "text": ["The device on the left is the motor, which is physically connected to the generator, on the right. This makes up a motor-generator set."], "jumps": ["P13050", "P13020"]}, {"id": "P13050", "text": ["Locate the wheel between the motor and generator and the component just below (a LED and photodiode unit)."], "jumps": ["P13060", "P13020"]}, {"id": "P13060", "text": ["The wheel and LED-Photodiode unit are used for automatic speed control."], "jumps": ["P13070", "P13020"]}, {"id": "P13070", "text": ["The rest of the components on the card are used to control the DC motor and supply a load to the generator."], "jumps": ["P13090", "P13020"]}, {"id": "P13090", "text": ["M1 is the motor (PM type) and receives a DC voltage through U1 and IC1."], "jumps": ["P13100", "P13020", "PM"]}, {"id": "P13100", "text": ["S1 selects either an external DC voltage or an internal DC voltage. You will use the internal position only."], "jumps": ["P13110", "P13090"]}, {"id": "P13110", "text": ["The action of R1, R2, R8, D1, and D2 provide adjustable DC voltage to U1."], "jumps": ["P13120", "P13090"]}, {"id": "P13120", "text": ["The DC voltage is applied to the non-inverting input of U1. The inverting input is from the automatic speed control circuit, through S2."], "jumps": ["P13130", "P13090"]}, {"id": "P13130", "text": ["The output DC voltage of U1 is routed to IC1, a voltage regulator."], "jumps": ["P13140", "P13090"]}, {"id": "P13140", "text": ["The output of IC1 is applied through TP2, S3, and TP3 to the motor. S3 is used to break the current path for insertion of an ammeter."], "jumps": ["P13150", "P13090"]}, {"id": "P13150", "text": ["By adjusting R8, the speed of the motor can be manually controlled."], "jumps": ["P13160", "P13090"]}, {"id": "P13160", "text": ["M2 is the generator that is driven by the motor............"], "jumps": ["P13170", "P13090"]}, {"id": "P13170", "text": ["S4 breaks the circuit for inserting an ammeter."], "jumps": ["P13180", "P13160"]}, {"id": "P13180", "text": ["S5 and S6 apply different loads to the generator. D3 illuminates when R6 is applied."], "jumps": ["P13190", "P13160"]}, {"id": "P13190", "text": ["The rest of the circuit is used for automatic speed control. Let's see how speed control operates."], "jumps": ["P13200", "P13160"]}, {"id": "P13200", "text": ["Look on the PC130-180 card at the wheel. Half is painted black and half is silver."], "jumps": ["P13210", "P13190"]}, {"id": "P13210", "text": ["The black area of the wheel will not reflect light, the silver area will."], "jumps": ["P13220", "P13200"]}, {"id": "P13220", "text": ["The LED under the wheel, part of IS01, generates and shines light up towards the wheel."], "jumps": ["P13230", "P13200"]}, {"id": "P13230", "text": ["When the black area of the wheel is over the LED, no light is reflected back to the photodiode, also part of IS01."], "jumps": ["P13240", "P13200"]}, {"id": "P13240", "text": [], "jumps": ["P13250", "P13200"]}, {"id": "P13250", "text": ["When the silver area is over the LED, light is reflected back to the photodiode."], "jumps": ["P13260", "P13200"]}, {"id": "P13260", "text": ["The output of the photodiode is maximum."], "jumps": ["P13270", "P13200"]}, {"id": "P13270", "text": ["The output of the photodiode as the wheel rotates, is square wave pulses with a frequency equal to the speed of the motor-generator set."], "jumps": ["P13280", "P13200"]}, {"id": "P13280", "text": ["The output of the photodiode represents RPS (revolutions per second). RPS is used because frequency is in cycles per second, Hz."], "jumps": ["P13290", "P13200"]}, {"id": "P13290", "text": ["The output of the photodiode is applied as a frequency to voltage (F/V) converter, U2."], "jumps": ["P13300", "P13200"]}, {"id": "P13300", "text": ["If the input frequency increases, meaning RPS increased, the voltage output of U2 on pin 7 increases."], "jumps": ["P13310", "P13290"]}, {"id": "P13310", "text": ["If the input frequency decreases, meaning RPS decreased, the voltage output of the F/V converter decreases."], "jumps": ["P13320", "P13290"]}, {"id": "P13320", "text": ["The voltage output of the F/V converter is then applied to U1 to change the applied voltage to the motor through S2."], "jumps": ["P13330", "P13290", "P13325"]}, {"id": "P13322", "text": ["The voltage output of the F/V converter is then applied to U1 to change the applied voltage to the motor through S2."], "jumps": ["P13330", "P13290", "P13325", "P"]}, {"id": "P13325", "text": ["OP-AMP U1 - U1 is an op-amp configured for a diference amplifier. The output is the voltage on the non-inverting input minus the voltage on the inverting input."], "jumps": []}, {"id": "P13330", "text": ["If the RPS increases, the voltage output of the F/V converter increases which will decrease the output voltage of U1."], "jumps": ["P13340", "P13290"]}, {"id": "P13340", "text": ["The decreased output of U1 causes the motor to slow down, compensating for the increase in RPS."], "jumps": ["P13350", "P13330"]}, {"id": "P13350", "text": ["If the RPS decreases, the voltage output of the F/V converter decreases which will increase the output voltage of U1."], "jumps": ["P13360", "P13330"]}, {"id": "P13360", "text": ["The increased output of U1 causes the motor to speed up, compensating for the decrease in RPS."], "jumps": ["P13370", "P13330"]}, {"id": "P13370", "text": ["This is automatic speed control. If no automatic speed control is needed, S2 is placed in the open position."], "jumps": ["P13380", "P13330"]}, {"id": "P13380", "text": ["The other components connected to U2 scale the output voltage."], "jumps": []}, {"id": "P13390", "text": ["Let's start the experiment!e..............................."], "jumps": ["P13400", "P13380"]}, {"id": "P13400", "text": ["1. Set the Test Console controls to their initial control settings........"], "jumps": ["P13390"]}, {"id": "P13410", "text": ["3. Press Enter to set: Positive Supply Voltage to 12", "3. Press Enter to set Voltage Select - 12.", "2. Insert the PC130-180 into the PC1 position on the Test Console."], "jumps": []}, {"id": "P13420", "text": ["3. Press Enter to set: Positive Supply Voltage to 12 Negative Supply Voltage to 12"], "jumps": ["P13410"]}, {"id": "P13440", "text": ["5. Press Enter to set: PC1 DC Power Switch - ON", "5. Press Enter to set: PC DC Power - ON", "4. On PC130-180, set the controls as follows:.............", "A. S1 to INT, (left) B. S2 to OPEN, (left) C. S3 to CLOSED, (right) D. S4 to CLOSED, (right) E. S5 and S6 to OPEN, (down) F. R7 and R8 to mid position"], "jumps": []}, {"id": "P13450", "text": ["5. Press Enter to set: PC1 DC Power Switch - ON..........................."], "jumps": ["P13440"]}, {"id": "P13460", "text": ["Is the motor-generator set rotating?......................."], "jumps": []}, {"id": "P13461", "text": [], "jumps": []}, {"id": "P13462", "text": ["The motor-generator set should be rotating. Check your card settings.", "A. S1 to INT, (left) B. S2 to OPEN, (left) C. S3 to CLOSED, (right) D. S4 to CLOSED, (right) E. S5 and S6 to OPEN, (down) F. R7 and R8 to mid position"], "jumps": []}, {"id": "P13470", "text": ["Now let's verify that when the applied voltage is changed, RPS is changed.anging the applied voltage to the motor, the RPS changes."], "jumps": ["P13480", "P13460"]}, {"id": "P13480", "text": ["1. Connect the frequency counter to TP6. The frequency readout of the counter indicates cycles per second and since TP6 measures the square wave output of IS01, the readout is also revolutions per second or RPS...."], "jumps": ["P13490", "P13470", "P13485"]}, {"id": "P13490", "text": ["The direct conversion between frequency and RPS is because for each rotation of the wheel between the motor and generator, one cycle of the square wave is produced. You may leave the frequency counter connected to TP6 throughout this experiment..."], "jumps": ["P13500", "P13480"]}, {"id": "P13500", "text": ["2. Set the multimeter to measure voltage. Connect the test leads between TP3 and ground. Note the DC voltage."], "jumps": ["P13510", "P13490", "P13505"]}, {"id": "P13510", "text": ["3. Adjust R8 CW and CCW and observe the voltage on TP3 and RPS. 4. Return R8 to the mid position."], "jumps": ["P13520", "P13500", "P13515"]}, {"id": "P13520", "text": ["What happened to RPS when the applied voltage to the motor increased?"], "jumps": ["P13510"]}, {"id": "P13521", "text": [], "jumps": []}, {"id": "P13522", "text": ["Motors do not decrease RPS when the applied voltage increases."], "jumps": []}, {"id": "P13523", "text": ["The RPS will not stay the same when the applied voltage changes."], "jumps": []}, {"id": "P13530", "text": ["You verified that in a motor: xt, let's see if the DC generator is operating and if the RPS input changes the output voltage. OR"], "jumps": ["P13532", "P13520"]}, {"id": "P13532", "text": ["Now let's see if the DC generator is operating and if the RPS input changes the output voltage.nput changes the output voltage. OR"], "jumps": ["P13540", "P13530"]}, {"id": "P13540", "text": ["1. Connect the multimeter set to measure voltage to TP4 and ground. The presence of a voltage indicates that the DC generator is operating."], "jumps": ["P13550", "P13532", "P13545"]}, {"id": "P13550", "text": ["2. Connect the multimeter between ground and TP5. While measuring the voltage on TP5, place S4 to OPEN, left. Opening S4 disconnects the applied voltage from the generator. Notice, the voltage on TP5 drops to zero. This proves that the generator was developing the output voltage......"], "jumps": ["P13560", "P13540", "P13555"]}, {"id": "P13560", "text": ["3. Place S4 to CLOSED, right. 4. While observing the voltage on TP4, vary R8 CW and CCW. 5. Return R8 to mid position."], "jumps": ["P13570", "P13550", "P13565"]}, {"id": "P13570", "text": ["What happens to the output voltage of the generator when the voltage applied to the motor decreased?????????????????"], "jumps": ["P13560"]}, {"id": "P13571", "text": [], "jumps": []}, {"id": "P13572", "text": ["The voltage output of generators do not increase when the RPS decreases."], "jumps": []}, {"id": "P13573", "text": ["When the RPS input to a generator changes, the output voltage also changes."], "jumps": []}, {"id": "P13580", "text": ["You verified that in generators: xt, let's see the effect of counter electromotive force, CEMF. OR"], "jumps": ["P13582", "P13570"]}, {"id": "P13582", "text": ["Next let's see the effects of Counter Electromotive Force, CEMF. er electromotive force, CEMF. OR"], "jumps": ["P13590", "P13580"]}, {"id": "P13590", "text": ["Recall that CEMF is a voltage produced by a motor that opposes the applied voltage. CEMF is produced by generator action of the motor."], "jumps": ["P13600", "P13582"]}, {"id": "P13600", "text": ["Since the voltage is internal to the motor, it can not be measured directly. However, you can measure the effects of CEMF by measuring the current drawn by the motor."], "jumps": ["P13610", "P13590"]}, {"id": "P13610", "text": ["When a DC voltage is first applied to the motor, the rotor is not rotating and the CEMF is zero."], "jumps": ["P13620", "P13600"]}, {"id": "P13620", "text": ["The current drawn equals the applied voltage (Ea) divided by the internal resistance of the rotor (Rr)."], "jumps": ["P13630", "P13610"]}, {"id": "P13630", "text": ["As the rotor begins to rotate, CEMF increases from 0 volts."], "jumps": ["P13640", "P13610"]}, {"id": "P13640", "text": ["Now, the current equals the applied voltage (Ea) minus the CEMF voltage (Ecemf) divided by the internal resistance of the rotor (Rr)."], "jumps": ["P13650", "P13630"]}, {"id": "P13650", "text": ["The current flow is less since Ecemf reduces Ea. This means that the starting current of a motor is higher than the running current."], "jumps": ["P13660", "P13630"]}, {"id": "P13660", "text": ["DC Voltage Input Mechanical Output", "Mechanical Input DC Voltage Output", "This is important to the circuits wiring. The wires to the motors must be large enough to handle the higher starting current. Let's measure current and see."], "jumps": ["P13670", "P13650"]}, {"id": "P13670", "text": ["1. Place S3 to OPEN, to the left. The motor-generator set should stop."], "jumps": ["P13680", "P13650", "P13675"]}, {"id": "P13680", "text": ["2. Set the analog multimeter to measure current with a range of at least 50 mA. 3. Connect the COM lead to TP2."], "jumps": ["P13690", "P13670", "P13685"]}, {"id": "P13690", "text": ["4. While observing the current reading on the ammeter, connect the V.m.mA lead to TP3. The motor will start as soon as the V.m.mA lead is connected."], "jumps": ["P13700", "P13680", "P13695"]}, {"id": "P13700", "text": ["What happens to current as the motor's RPS increases? RPS?."], "jumps": ["P13690"]}, {"id": "P13701", "text": [], "jumps": []}, {"id": "P13702", "text": ["Remember, CEMF increases as the RPS increases. This will not increase the current drawn by the motor."], "jumps": []}, {"id": "P13703", "text": ["Remember, CEMF increases as the RPS increases. The current drawn by the motor will not remain the same."], "jumps": []}, {"id": "P13710", "text": ["You observed, by measuring current, that in a motor: w, let's see the effects of loads on the motor-generator set. OR"], "jumps": ["P13712", "P13700"]}, {"id": "P13712", "text": ["Now let's see the effects of a load on the motor-generator set..ee the effects of loads on the motor-generator set. OR"], "jumps": ["P13720", "P13710"]}, {"id": "P13720", "text": ["1. Remove the ammeter and place S3 to CLOSED, the right. The motor-generator set should be rotating with no load applied, S5 and S6 opened, down."], "jumps": ["P13730", "P13712", "P13725"]}, {"id": "P13730", "text": ["2. While observing the RPS, place S5 to CLOSED (up) applying a load. LED D3 should illuminate. You may look at the motor- generator or use the frequency counter to determine the effect on RPS."], "jumps": ["P13740", "P13720", "P13735"]}, {"id": "P13740", "text": ["3. While observing the RPS, place S5 back to OPEN (down) disconnecting the load. LED D3 should extinguish. You may look at the motor-generator or use the frequency counter to determine the effect on RPS."], "jumps": ["P13750", "P13730", "P13745"]}, {"id": "P13750", "text": ["What happens to RPS when a load was applied to the motor-generator set, S5 placed to up?"], "jumps": ["P13740"]}, {"id": "P13751", "text": [], "jumps": []}, {"id": "P13752", "text": ["Adding a load will not increase RPS........................"], "jumps": []}, {"id": "P13753", "text": ["Adding a load will not cause the RPS to remain the same...."], "jumps": []}, {"id": "P13760", "text": ["You verified that in a motor-generator:ow, let's measure the efficiency of the motor-generator set. OR"], "jumps": ["P13770", "P13750"]}, {"id": "P13762", "text": ["Now lets measure the efficiency of the motor-generator. he efficiency of the motor-generator set. OR"], "jumps": ["P13770", "P13760"]}, {"id": "P13770", "text": ["In this case, you do not have to change mechanical power to electrical power since the input to the motor is electrical and the output of the generator is electrical."], "jumps": ["P13780", "P13762"]}, {"id": "P13780", "text": ["Efficiency is determined by:..............................."], "jumps": ["P13790", "P13770"]}, {"id": "P13790", "text": ["1. Place S5 to CLOSED (up) to apply a load. 2. Adjust R8 for a voltage measurement of 5 volts on TP3. 5 volts is the applied voltage to the DC motor and is needed to calculate power in.......te power in."], "jumps": ["P13800", "P13780", "P13795"]}, {"id": "P13800", "text": ["3. Using an ammeter connected across TP2 and TP3 (COM lead to TP2), place S3 to OPEN (left) and measure the current. What is the measured current?"], "jumps": ["P13802"]}, {"id": "P13801", "text": [], "jumps": []}, {"id": "P13802", "text": ["Ensure the multimeter is set to measure current and place across TP2 and TP3. Also ensure that S3 is open."], "jumps": []}, {"id": "P13807", "text": ["You still did not enter a correct value for current. You should have measured approximately 55 mA."], "jumps": ["P13810", "P13800"]}, {"id": "P13810", "text": ["4. Remove the ammeter and place S3 back to CLOSED, to the right.."], "jumps": ["P13820", "P13800", "P13815"]}, {"id": "P13820", "text": ["Calculate the power input to the motor. P = E x I E = 5 V I = nswer (5) in a variable.able.le."], "jumps": ["P13822"]}, {"id": "P13821", "text": [], "jumps": []}, {"id": "P13822", "text": ["Multiply voltage and current. 5 V x 55.0 mA5 volts, by the current,"], "jumps": []}, {"id": "P13827", "text": ["You still have not calculated the correct value. You should have calculated:"], "jumps": ["P13830", "P13820", "PutVar"]}, {"id": "P13830", "text": ["5. Using a voltmeter, measure the voltage on TP4, the output of the generator. What is the measured voltage?"], "jumps": ["P13832"]}, {"id": "P13831", "text": [], "jumps": []}, {"id": "P13832", "text": ["Ensure the multimeter is set to measure voltage and that S1 is closed. Also, ensure you are measuring TP4."], "jumps": []}, {"id": "P13837", "text": ["You still have not measured a correct voltage. You should have measured approximately 3 volts."], "jumps": ["P13830"]}, {"id": "P13840", "text": ["6. Using an ammeter connected across TP4 and TP5 (black lead on TP5), Place S4 to OPEN (left) and measure the current. What is the measured current??"], "jumps": ["P13842"]}, {"id": "P13841", "text": [], "jumps": []}, {"id": "P13842", "text": ["You did not measure a correct value of current. Ensure that the ammeter is connected across TP4 and TP5 and that S4 is open."], "jumps": []}, {"id": "P13847", "text": ["You still did not measure the correct value for current. You should have measured approximately 38 mA."], "jumps": ["P13840"]}, {"id": "P13850", "text": ["7. Remove the ammeter and return S4 to CLOSED, to the right."], "jumps": ["P13860", "P13840", "P13855"]}, {"id": "P13860", "text": ["Calculate the power output of the generator, Pout. P = E x I E = I ===5) in a variable.able.le."], "jumps": ["P13862"]}, {"id": "P13861", "text": [], "jumps": []}, {"id": "P13862", "text": ["Multiply voltage and current to find Pout.tage times the current."], "jumps": []}, {"id": "P13867", "text": ["You still did not calculate the correct power. You should have calculated:"], "jumps": ["P13870", "P13860", "PutVar"]}, {"id": "P13870", "text": ["Now, calculate efficiency Efficiency (%) = Pout/Pin x 100 Pin = Pout ==="], "jumps": ["P13872"]}, {"id": "P13871", "text": [], "jumps": []}, {"id": "P13872", "text": ["You did not divide the Pout by Pin correctly. Be sure to multiply by 100."], "jumps": []}, {"id": "P13877", "text": ["You still have not calculated the efficiency correctly. You should have calculated:"], "jumps": ["P13880", "P13870", "PutVar"]}, {"id": "P13880", "text": ["The larger the percent, the more efficient the motor-generator. Commercial motors and generators normally have an efficiency of 80% or more.", "Now, let's investigate the automatic speed control circuit. Recall that the circuit consists of the LED-Photo Diode unit, IS01, and the frequency to voltage converter, U2."], "jumps": ["P13890", "P13870", "P13900", "P13880"]}, {"id": "P13900", "text": ["1. Place S5 to OPEN (down) and then back to CLOSED (up). tice that the RPS of the motor generator set changed as the load was removed and then connected again."], "jumps": ["P13910", "P13890", "P13905"]}, {"id": "P13910", "text": ["The motor generator set is operating in the Open Loop mode, no automatic speed control or feedback...."], "jumps": ["P13920", "P13900"]}, {"id": "P13920", "text": ["2. Using the oscilloscope, measure the signal on TP6. This is the output of IS01 and input to U2 (the frequency to voltage converter), it is a square wave that represents the speed of the motor-generator."], "jumps": ["P13930", "P13910", "P13925"]}, {"id": "P13930", "text": ["3. While observing the signal on TP6, place S5 to OPEN (down) and back to CLOSED (up). You should have noticed the frequency of the square change as the RPS changed due to changes in the load."], "jumps": ["P13940", "P13920", "P13935"]}, {"id": "P13940", "text": ["4. Using a voltmeter, measure the voltage on TP7. This is the output of the frequency to voltage converter, U2."], "jumps": ["P13950", "P13930", "P13945"]}, {"id": "P13950", "text": ["5. While observing the voltage, place S5 to OPEN (down) and then back to CLOSED (up). You should have seen the voltage increase as the RPS increased and decrease as the RPS decreased. This is the feedback signal to the DC motor supply voltage."], "jumps": ["P13960", "P13940", "P13955"]}, {"id": "P13960", "text": ["6. Using a voltmeter, measure the voltage on TP2. This is the DC voltage that drives the motor."], "jumps": ["P13970", "P13950", "P13965"]}, {"id": "P13970", "text": ["7. While observing the voltage, place S5 to OPEN (down) and back to CLOSED (up). You should have seen the voltage remain constant. S2 is open and not allowing the feedback voltage to effect the voltage applied to the motor, open loop mode."], "jumps": ["P13980", "P13960", "P13975"]}, {"id": "P13980", "text": ["8. Place S2 to CLOSED, to the right. This places the motor- generator set into the Closed Loop mode."], "jumps": ["P13990", "P13970", "P13985"]}, {"id": "P13990", "text": ["9. While observing the voltage on TP2 and the RPS, place S5 to OPEN (down) and then back to CLOSED (up). The voltage on TP2 should change and the RPS should remain constant!"], "jumps": ["P14000", "P13980", "P13995"]}, {"id": "P14000", "text": ["The automatic speed control circuit operates correctly....."], "jumps": ["P14020", "P13990", "P14005"]}, {"id": "P14005", "text": ["RPS INCREASE - An increase in RPS increases the frequency of the squarewave and causes the output of the F/V converter to increase. This decreases the output of U1 which decreases the RPS back to normal."], "jumps": []}, {"id": "P14010", "text": ["RPS DECREASE - A decrease in RPS decreases the frequency of the square wave and causes the output of the F/V converter to decrease. This increases the output of U1 which increases the RPS back to normal."], "jumps": []}, {"id": "P14020", "text": ["You have seen the operation of the motor-generator set in the open and closed loop modes. Last,
