 let's walk through a couple of typical faults that are common in motor-generator sets."], "jumps": ["P14030", "P14000"]}, {"id": "P14030", "text": ["1. Ensure equipment set up is as follows:", "A. S1 to INT B. S2 to OPEN, (left) C. S3 and S4 to (right) D. S5 and S6 to down E. Adjust R8 for 5 volts on TP3 F. Measure for voltage on TP444id position"], "jumps": ["P14040", "P14020", "P14035"]}, {"id": "P14040", "text": ["2. Press Enter to set: PC1 DC Power Switch - OFF", "2. Press Enter to set: PC DC Power - OFF", "The switch settings place the motor-generator set to the open loop mode, no speed control and no load on the generator. R8 setting establishes the input voltage to the motor and the motor should be rotating. A voltage on TP4 indicates that the generator is operating..."], "jumps": ["P14030"]}, {"id": "P14050", "text": ["2. Press Enter to set: PC1 DC Power Switch - OFF Stopping the motor-generator set."], "jumps": ["P14040"]}, {"id": "P14060", "text": ["The computer will now enter a fault into the motor-generator set..........."], "jumps": []}, {"id": "P14070", "text": ["To troubleshoot a motor-generator set, a visual check is first done to see if the motor is rotating. If NOT rotating, the fault is in the motor or the circuit that supplies power -- troubleshoot the motor and motor circuits. If the motor is rotating, the motor and motor circuits are OK..", "3. Press Enter to set: PC1 DC Power Switch - ON", "3. Press Enter to set: PC DC Power - ON", "If the motor and motor circuits are OK, the second step is to measure for an output voltage from the generator. If there IS a voltage, the generator and load is OK. If there IS NO voltage, troubleshoot the generator and load..."], "jumps": ["P14080", "P14070"]}, {"id": "P14090", "text": ["3. Press Enter to set: PC1 DC Power Switch - ON..........................."], "jumps": ["P14080"]}, {"id": "P14100", "text": ["4. Do a visual check of the motor. Is the fault in the motor or possibly in the generator?"], "jumps": []}, {"id": "P14101", "text": [], "jumps": []}, {"id": "P14102", "text": ["The motor should be rotating. The fault is not in the motor or motor circuits."], "jumps": []}, {"id": "P14110", "text": ["5. Measure the output voltage of the generator on TP4. Is the generator and generator circuit at fault or is there no fault since the motor is OK?"], "jumps": ["P14100", "P14115"]}, {"id": "P14111", "text": [], "jumps": []}, {"id": "P14112", "text": ["There is a fault, you should have measured 0 volts on TP4.."], "jumps": []}, {"id": "P14120", "text": ["Since there is no load applied to the generator (S5 and S6 down) and the generator is not producing an output voltage, the fault is the generator."], "jumps": ["P14130", "P14110"]}, {"id": "P14130", "text": ["Motor-generator sets in the open loop mode are easy to troubleshoot. The computer will now remove the fault."], "jumps": ["P14120"]}, {"id": "P14140", "text": ["6. Measure the output voltage of the generator on TP4 and verify that the generator has been repaired."], "jumps": ["P14150"]}, {"id": "P14150", "text": ["Troubleshooting closed loop motor-generator sets is a little more complex. First, you determine if the motor and generator are operating correctly like you did previously."], "jumps": ["P14160", "P14140"]}, {"id": "P14160", "text": ["Then you apply a load to check that the RPS remains constant, seeing if the automatic speed control circuit operates correctly. If the RPS does not change, there is no fault. If the RPS changes, there is a fault in the automatic speed control circuit..."], "jumps": ["P14170", "P14150"]}, {"id": "P14170", "text": ["1. Ensure equipment set up is as follows:.................", "A. S1 to INT (left) B. S2 to CLOSED, (right) C. S3 and S4 to CLOSED (right) D. S5 and S6 OPEN, (down) E. Adjust R8 for 5 volts on TP3 F. Measure for voltage on TP4"], "jumps": ["P14180", "P14160", "P14175"]}, {"id": "P14180", "text": ["2. Press Enter to set: PC1 DC Power Switch - OFF", "2. Press Enter to set: PC DC Power - OFF", "The switch settings place the motor/generator set to the closed loop mode, automatic speed control, and no load on the generator. R8 setting establishes the input voltage to the motor and the motor should be rotating. A voltage on TP4 indicates that the generator is operating..."], "jumps": ["P14170"]}, {"id": "P14190", "text": ["2. Press Enter to set: PC1 DC Power Switch - OFF Stopping the motor-generator set."], "jumps": ["P14180"]}, {"id": "P14200", "text": ["3. Press Enter to set: PC1 DC Power Switch - ON", "3. Press Enter to set: PC DC Power - ON", "The computer will now enter a fault into the motor-generator set..........."], "jumps": []}, {"id": "P14210", "text": ["3. Press Enter to set: PC DC Power - ONtch - ON..........................."], "jumps": []}, {"id": "P14220", "text": ["4. Do a visual check of the motor and measure the output voltage of the generator on TP4. Is the motor, generator, or neither faulted?"], "jumps": []}, {"id": "P14221", "text": [], "jumps": []}, {"id": "P14222", "text": ["The motor should be rotating. It is not faulted..........."], "jumps": []}, {"id": "P14223", "text": ["There should be a voltage on TP4, the generator is not faulted."], "jumps": []}, {"id": "P14230", "text": ["You have determined that the motor and generator are operating, now check out the automatic speed control circuit and see if it is operating."], "jumps": ["P14240", "P14220"]}, {"id": "P14240", "text": ["5. Place S5 to CLOSED (up) and then to OPEN (down). This applies and removes a load. Does the RPS remain constant?"], "jumps": ["P14230", "P14245"]}, {"id": "P14241", "text": [], "jumps": []}, {"id": "P14242", "text": ["The RPS should have changed, the automatic speed circuit is faulted..."], "jumps": []}, {"id": "P14250", "text": ["Since there is a fault in the automatic speed control circuit, you must signal trace from IS01 to U1."], "jumps": ["P14260", "P14240"]}, {"id": "P14260", "text": ["6. Using an oscilloscope, carefully measure the square wave signal on U2, Pin 1 while placing S5 UP and DOWN. If no signal is present, the fault is in IS01, the LED-Photo Diode unit. Since a signal is present, the fault is located elsewhere."], "jumps": ["P14270", "P14250", "P14265"]}, {"id": "P14270", "text": ["7. Using a voltmeter, measure the voltage on TP7 while placing S5 UP and DOWN (changing load). If the voltage remains constant, the fault is in U2, the frequency to voltage converter. Since, the output of U2 changes as the load changes, the fault is elsewhere."], "jumps": ["P14280", "P14260", "P14275"]}, {"id": "P14280", "text": ["8. Using a voltmeter, carefully measure the voltage on U1 pin 2 while placing S5 UP and DOWN. If the voltage remained constant, the fault is between TP7 and Pin 2 of U1, probably R4. If the voltage changes, the fault is in U1."], "jumps": ["P14290", "P14270", "P14285"]}, {"id": "P14290", "text": ["What is the probable fault? typed.........................."], "jumps": ["P14280"]}, {"id": "P14291", "text": ["The voltage remained constant on Pin 2 of U1, when switching S5 up then down. The feedback signal is not reaching U1, U1 is not the fault."], "jumps": []}, {"id": "P14300", "text": ["The computer will now remove the fault....................................."], "jumps": ["P14290"]}, {"id": "P14310", "text": ["9. Place S5 UP and DOWN and verify that the RPS remains constant. Even though troubleshooting closed loop circuits is more complex, it is still not difficult if you use a systematic approach..."], "jumps": ["P14320", "P14315"]}, {"id": "P14320", "text": ["1. Disconnect all test equipment from the PC card.ings...................."], "jumps": ["P14310"]}, {"id": "P14330", "text": ["2. Set the Test Console Power OFF. OFF.FF................................."], "jumps": []}, {"id": "P14340", "text": ["3. Remove experiment card PC130-180. 4. Return all equipment to their designated storage areas.."], "jumps": ["P14910", "P14330"]}, {"id": "P14910", "text": ["This completes the experiment on DC MOTORS and GENERATORS.."], "jumps": ["P14340"]}, {"id": "PINFO", "text": ["07-27-00 Conversion, Text & Branching - lisa 08-10-00 Graphics John Ayala 08-18-00 Changes. frieda 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-08-02 Review of Conversion. Alexis 04-19-02 Review - lisa 06-12-03 Added TecDec experiment to 130E section. frieda 06-17-03 P13400, added script to help button for TD2000. -Penny 02-17-04 Made text change to P13550, 2550. Enabled schematic view during experiment with control + S.-Sarah. 02-25-04 P1570, removed duplicate sentence from page. -Penny 03-10-04 P1800, changed \"...produced to the supply the...\" to \"...produced to supply the...\". -Phil 03-25-04 P1852/1853, added graphics of \"separately excited\" and \"self excited\" DC Generators to correspond with the wrong answers. -Phil 07-12-04 P3910, P13910 Added end of experiment script per jay. frieda 04-11-05 P1030, 1040, 1050, 1100, 1930, removed the arrows on the flux lines of the magnets. -Penny"], "jumps": []}]};
let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
