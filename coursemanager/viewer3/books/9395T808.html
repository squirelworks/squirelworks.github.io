 Power switch to ON.", "9. Turn PC1 DC Power switch to ON.ol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P3110"]}, {"id": "P3130", "text": ["The program below shows the code that you will enter.  Line numbers are provided on each line of the code to identify the instruction we are talking about.", "The program below shows the code that you will enter. Line numbers are provided on each line of the code to identify the instruction we are talking about.", "1. 11000 22 7C 00 04 00 00 MOVEA.L #IOA,A1 2. 11006 12 3C 00 05 MOVE.B #5,D1 3. 1100A 06 01 00 05 ADDI.B #5,D1 4. 1100E 46 01 NOT.B D1 5. 11010 12 81 MOVE.B D1,(A1) 6. 11012 4E 75 RTS d(An,i) 1 1 0 REGISTER # Abs,W 1 1 1 0 0 0 Abs,L 1 1 1 0 0 1 1 1 1 0 1 1 Imm 1 1 1 1 0 0 x Immediate SUBA SUB.L D1,A1 All Allowed Only Address Register Direct Allowed SUBQ SUBQ.B #2,D3 1-8 Immediate Allowed PC with Offset PC with Index Immediate SUBX SUBX.L -(A5), Only two combinations Only two combinations allowed: -(A1) allowed: Both data register Both Data Register Direct direct Both Indirect with Post Both Indirect with Decrement Post Decrement", "ADDRESSOMMANDSMANDS 0 0 1 A2 0 1 0 A3 0 1 1 A4 1 0 0 A5 1 0 1 A6 1 1 0 A7 1 1 1 5 1 0 1 -(Ax) 6 1 1 0 -(Ay) 7 1 1 11 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs, W 1 1 1 0 0 0 Abs, L 1 1 1 0 0 1R # -(An) 1 0 0 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs,W 1 1 1 0 0 0 Abs,L 1 1 1 0 0 1 1 1 1 0 1 1 Imm 1 1 1 1 0 0 x Immediate SUBA SUB.L D1,A1 All Allowed Only Address Register Direct Allowed SUBQ SUBQ.B #2,D3 1-8 Immediate Allowed PC with Offset PC with Index Immediate SUBX SUBX.L -(A5), Only two combinations Only two combinations allowed: -(A1) allowed: Both data register Both Data Register Direct direct Both Indirect with Post Both Indirect with Decrement Post Decrement", "OPCODESSOMMANDSMANDS 0 0 1 A2 0 1 0 A3 0 1 1 A4 1 0 0 A5 1 0 1 A6 1 1 0 A7 1 1 1 5 1 0 1 -(Ax) 6 1 1 0 -(Ay) 7 1 1 11 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs, W 1 1 1 0 0 0 Abs, L 1 1 1 0 0 1R # -(An) 1 0 0 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs,W 1 1 1 0 0 0 Abs,L 1 1 1 0 0 1 1 1 1 0 1 1 Imm 1 1 1 1 0 0 x Immediate SUBA SUB.L D1,A1 All Allowed Only Address Register Direct Allowed SUBQ SUBQ.B #2,D3 1-8 Immediate Allowed PC with Offset PC with Index Immediate SUBX SUBX.L -(A5), Only two combinations Only two combinations allowed: -(A1) allowed: Both data register Both Data Register Direct direct Both Indirect with Post Both Indirect with Decrement Post Decrement", "ASSEMBLY LANGUAGENDS 0 0 1 A2 0 1 0 A3 0 1 1 A4 1 0 0 A5 1 0 1 A6 1 1 0 A7 1 1 1 5 1 0 1 -(Ax) 6 1 1 0 -(Ay) 7 1 1 11 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs, W 1 1 1 0 0 0 Abs, L 1 1 1 0 0 1R # -(An) 1 0 0 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs,W 1 1 1 0 0 0 Abs,L 1 1 1 0 0 1 1 1 1 0 1 1 Imm 1 1 1 1 0 0 x Immediate SUBA SUB.L D1,A1 All Allowed Only Address Register Direct Allowed SUBQ SUBQ.B #2,D3 1-8 Immediate Allowed PC with Offset PC with Index Immediate SUBX SUBX.L -(A5), Only two combinations Only two combinations allowed: -(A1) allowed: Both data register Both Data Register Direct direct Both Indirect with Post Both Indirect with Decrement Post Decrement"], "jumps": ["P3120"]}, {"id": "P3140", "text": ["The first line of code is a MOVEA instruction.  The value of  $00040000 will be stored in address register 1.  This address is the address of parallel port A.", "The first line of code is a MOVEA instruction. The value of $00040000 will be stored in address register 1. This address is the address of parallel port A.", "1. 11000 22 7C 00 04 00 00 MOVEA.L #IOA,A1"], "jumps": ["P3150", "P3130"]}, {"id": "P3150", "text": ["The next line of code uses immediate decimal data and stores it data register direct to D1.", "1. 11000 22 7C 00 04 00 00 MOVEA.L #IOA,A1", "2. 11006 12 3C 00 05 MOVE.B #5,D111"], "jumps": ["P3160", "P3130"]}, {"id": "P3160", "text": ["The next line, 3, is an add immediate (ADDI) instruction.  The value 5 is being added to the contents in D1.  We could also have used an add quick instruction if we had wanted to.", "The next line, 3, is an add immediate (ADDI) instruction. The value 5 is being added to the contents in D1. We could also have used an add quick instruction if we had wanted to.", "2. 11006 12 3C 00 05 MOVE.B #5,D111", "3. 1100A 06 01 00 05 ADDI.B #5,D1"], "jumps": ["P3170", "P3130"]}, {"id": "P3170", "text": ["Line 4 inverts the value in the byte size portion of D1.  The next line, 5, moves this value to the port to be displayed on the LEDS.  If the program is typed in correctly, 5 + 5 will give us $A.", "Line 4 inverts the value in the byte size portion of D1. The next line, 5, moves this value to the port to be displayed on the LEDS. If the program is typed in correctly, 5 + 5 will give us $A.", "3. 1100A 06 01 00 05 ADDI.B #5,D1", "4. 1100E 46 01 NOT.B D1 5. 11010 12 81 MOVE.B D1,(A1)"], "jumps": ["P3180", "P3130"]}, {"id": "P3180", "text": ["$A is actually $0A in byte size, which when inverted becomes $F5."], "jumps": ["P3190", "P3130"]}, {"id": "P3190", "text": ["The last line, 6, is used to return to the monitor program.  The monitor program runs our routines as if they were subroutines.", "The last line, 6, is used to return to the monitor program. The monitor program runs our routines as if they were subroutines.", "4. 1100E 46 01 NOT.B D1 5. 11010 12 81 MOVE.B D1,(A1)", "6. 11012 4E 75 RTS B D1,(A1) 10 12 81 MOVE.B D1,(A1)"], "jumps": ["P3200", "P3130"]}, {"id": "P3200", "text": ["10.  Press the Reset key on the PC130-468 card.  The main                     screen of the monitor program should be displayed.", "10. Press the Reset key on the PC130-468 card. The main screen of the monitor program should be displayed.", "6. 11012 4E 75 RTS B D1,(A1) 10 12 81 MOVE.B D1,(A1)"], "jumps": ["P3210", "P3130"]}, {"id": "P3210", "text": ["11.  Press the EDIT key and enter the value \"11000\".  Enter the             program shown in Program 1.  Remember to be careful when        entering in the values.  For more help on entering programs,          refer to the experiment in lesson 3 or see your instructor for           assistance.", "11. Press the EDIT key and enter the value \"11000\". Enter the program shown in Program 1. Remember to be careful when entering in the values. For more help on entering programs, refer to the experiment in lesson 3 or see your instructor for assistance."], "jumps": ["P3220", "P3130"]}, {"id": "P3220", "text": ["12.  Once you have finished entering the code, press the STOP             key, press the RUN key on the 68000 keypad and enter the             address value \"11000\".  Press ENTER after doing so.", "12. Once you have finished entering the code, press the STOP key, press the RUN key on the 68000 keypad and enter the address value \"11000\". Press ENTER after doing so."], "jumps": ["P3230", "P3130"]}, {"id": "P3230", "text": ["Observe the display of the 68000.  The display should say \"Program Terminated Correctly\".  This indicates that the RTS instruction worked at the end of the program.", "Observe the display of the 68000. The display should say \"Program Terminated Correctly\". This indicates that the RTS instruction worked at the end of the program."], "jumps": ["P3240", "P3130"]}, {"id": "P3240", "text": ["If you look at port A on card PC130-401 (The bottom of the three LED arrays) you should see the number value $F5 encoded in binary on the LEDS."], "jumps": ["P3250", "P3230"]}, {"id": "P3250", "text": ["Try changing the values using Edit and see if you can get other values to display."], "jumps": ["P3260", "P3230"]}, {"id": "P3260", "text": ["The program that you just completed allowed you to observe the ADD and NOT functions from the 68000 Instruction Set."], "jumps": ["P3270", "P3230"]}, {"id": "P3270", "text": ["The next two programs will allow you to observe the SUB, MULU, AND, OR and EOR instructions in a practical application."], "jumps": ["P3280", "P3230"]}, {"id": "P3280", "text": ["13.  Press the Reset key on the PC130-468 card.  The main                     screen of the monitor program should be displayed.", "13. Press the Reset key on the PC130-468 card. The main screen of the monitor program should be displayed."], "jumps": ["P3290", "P3230"]}, {"id": "P3290", "text": ["14.  Press the EDIT key and enter the value \"11000\".  Enter the             code shown in Programs 2 and 3.  These programs may be            entered successively because they will occupy different                  blocks of address locations.", "14. Press the EDIT key and enter the value \"11000\". Enter the code shown in Programs 2 and 3. These programs may be entered successively because they will occupy different blocks of address locations.", "11000 20 3C 00 00 02 82 MOVE.L #642, D0 11006 22 3C 00 00 00 4E MOVE.L #78, D1 1100C 90 41 SUB.W D1, D0 1100E 24 3C 00 00 00 02 MOVE.L #2, D2 11014 C4 C0 MULU.W D0, D2 11016 4E 75 RTS 11018 20 3C 11 01 11 10 MOVE.L #11011110H, D0 1101E 22 3C 11 11 10 11 MOVE.L #11111011H, D1 11024 CO 81 AND.L D0, D1 11026 24 3C 00 00 10 11 MOVE.L #2, D2 1102C 84 80 OR.L D0, D2 1102E 26 3C 10 11 10 01 MOVE.L #10111001H, D3 11034 B5 83 E0R.L D2, D3 11036 4E 75 RTS Immediate SUBX SUBX.L -(A5), Only two combinations Only two combinations allowed: -(A1) allowed: Both data register Both Data Register Direct direct Both Indirect with Post Both Indirect with Decrement Post Decrement", "ADDRESSOMMANDSMANDS 0 0 1 A2 0 1 0 A3 0 1 1 A4 1 0 0 A5 1 0 1 A6 1 1 0 A7 1 1 1 5 1 0 1 -(Ax) 6 1 1 0 -(Ay) 7 1 1 11 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs, W 1 1 1 0 0 0 Abs, L 1 1 1 0 0 1R # -(An) 1 0 0 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs,W 1 1 1 0 0 0 Abs,L 1 1 1 0 0 1 1 1 1 0 1 1 Imm 1 1 1 1 0 0 x Immediate SUBA SUB.L D1,A1 All Allowed Only Address Register Direct Allowed SUBQ SUBQ.B #2,D3 1-8 Immediate Allowed PC with Offset PC with Index Immediate SUBX SUBX.L -(A5), Only two combinations Only two combinations allowed: -(A1) allowed: Both data register Both Data Register Direct direct Both Indirect with Post Both Indirect with Decrement Post Decrement", "OPCODESSOMMANDSMANDS 0 0 1 A2 0 1 0 A3 0 1 1 A4 1 0 0 A5 1 0 1 A6 1 1 0 A7 1 1 1 5 1 0 1 -(Ax) 6 1 1 0 -(Ay) 7 1 1 11 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs, W 1 1 1 0 0 0 Abs, L 1 1 1 0 0 1R # -(An) 1 0 0 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs,W 1 1 1 0 0 0 Abs,L 1 1 1 0 0 1 1 1 1 0 1 1 Imm 1 1 1 1 0 0 x Immediate SUBA SUB.L D1,A1 All Allowed Only Address Register Direct Allowed SUBQ SUBQ.B #2,D3 1-8 Immediate Allowed PC with Offset PC with Index Immediate SUBX SUBX.L -(A5), Only two combinations Only two combinations allowed: -(A1) allowed: Both data register Both Data Register Direct direct Both Indirect with Post Both Indirect with Decrement Post Decrement", "ASSEMBLY LANGUAGENDS 0 0 1 A2 0 1 0 A3 0 1 1 A4 1 0 0 A5 1 0 1 A6 1 1 0 A7 1 1 1 5 1 0 1 -(Ax) 6 1 1 0 -(Ay) 7 1 1 11 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs, W 1 1 1 0 0 0 Abs, L 1 1 1 0 0 1R # -(An) 1 0 0 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs,W 1 1 1 0 0 0 Abs,L 1 1 1 0 0 1 1 1 1 0 1 1 Imm 1 1 1 1 0 0 x Immediate SUBA SUB.L D1,A1 All Allowed Only Address Register Direct Allowed SUBQ SUBQ.B #2,D3 1-8 Immediate Allowed PC with Offset PC with Index Immediate SUBX SUBX.L -(A5), Only two combinations Only two combinations allowed: -(A1) allowed: Both data register Both Data Register Direct direct Both Indirect with Post Both Indirect with Decrement Post Decrement", "Program 2MMANDSMANDS 0 0 1 A2 0 1 0 A3 0 1 1 A4 1 0 0 A5 1 0 1 A6 1 1 0 A7 1 1 1 5 1 0 1 -(Ax) 6 1 1 0 -(Ay) 7 1 1 11 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs, W 1 1 1 0 0 0 Abs, L 1 1 1 0 0 1R # -(An) 1 0 0 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs,W 1 1 1 0 0 0 Abs,L 1 1 1 0 0 1 1 1 1 0 1 1 Imm 1 1 1 1 0 0 x Immediate SUBA SUB.L D1,A1 All Allowed Only Address Register Direct Allowed SUBQ SUBQ.B #2,D3 1-8 Immediate Allowed PC with Offset PC with Index Immediate SUBX SUBX.L -(A5), Only two combinations Only two combinations allowed: -(A1) allowed: Both data register Both Data Register Direct direct Both Indirect with Post Both Indirect with Decrement Post Decrement", "Program 3MMANDSMANDS 0 0 1 A2 0 1 0 A3 0 1 1 A4 1 0 0 A5 1 0 1 A6 1 1 0 A7 1 1 1 5 1 0 1 -(Ax) 6 1 1 0 -(Ay) 7 1 1 11 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs, W 1 1 1 0 0 0 Abs, L 1 1 1 0 0 1R # -(An) 1 0 0 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs,W 1 1 1 0 0 0 Abs,L 1 1 1 0 0 1 1 1 1 0 1 1 Imm 1 1 1 1 0 0 x Immediate SUBA SUB.L D1,A1 All Allowed Only Address Register Direct Allowed SUBQ SUBQ.B #2,D3 1-8 Immediate Allowed PC with Offset PC with Index Immediate SUBX SUBX.L -(A5), Only two combinations Only two combinations allowed: -(A1) allowed: Both data register Both Data Register Direct direct Both Indirect with Post Both Indirect with Decrement Post Decrement"], "jumps": ["P3300", "P3230"]}, {"id": "P3300", "text": ["In order to observe the operation of the program as it is executing various instructions, breakpoints will be inserted which will pause the microprocessor and allow you to view the contents of the register that contains the result of the last instruction prior to the breakpoint."], "jumps": ["P3310", "P3290"]}, {"id": "P3310", "text": ["After viewing the register contents, the microprocessor will be allowed to complete its next instruction before it reaches the next breakpoint."], "jumps": ["P3320", "P3290"]}, {"id": "P3320", "text": ["Again, the contents of the concerned register may then be examined.  It should be mentioned that the address location of the breakpoint will halt the processor before it can perform whatever instruction happens to be at that address.", "Again, the contents of the concerned register may then be examined. It should be mentioned that the address location of the breakpoint will halt the processor before it can perform whatever instruction happens to be at that address."], "jumps": ["P3330", "P3290"]}, {"id": "P3330", "text": ["For example, in Program 2, address location 1100C, there is a SUB instruction.  If we activate a breakpoint at 1100C, the processor will be halted prior to performing the SUB instruction.", "For example, in Program 2, address location 1100C, there is a SUB instruction. If we activate a breakpoint at 1100C, the processor will be halted prior to performing the SUB instruction."], "jumps": ["P3340", "P3290"]}, {"id": "P3340", "text": ["Before inserting the breakpoints, let's first analyze the programs and see what they will do."], "jumps": ["P3350", "P3290"]}, {"id": "P3350", "text": ["The first instruction loads the decimal number 642 into data register D0.  Following that, the decimal number 78 is loaded into data register D1.", "The first instruction loads the decimal number 642 into data register D0. Following that, the decimal number 78 is loaded into data register D1."], "jumps": ["P3360", "P3290"]}, {"id": "P3360", "text": ["At address 1100C, the contents of register D1 is subtracted from the contents of register D0, with the result being stored in register D0.  The next instruction loads the data register D2 with the decimal value 2.", "At address 1100C, the contents of register D1 is subtracted from the contents of register D0, with the result being stored in register D0. The next instruction loads the data register D2 with the decimal value 2."], "jumps": ["P3370", "P3290"]}, {"id": "P3370", "text": ["Once that is accomplished, the result of our subtraction stored in D0 is multiplied by the contents of data register D2.  The result of  the multiplication is then stored in D2.", "Once that is accomplished, the result of our subtraction stored in D0 is multiplied by the contents of data register D2. The result of the multiplication is then stored in D2."], "jumps": ["P3380", "P3290"]}, {"id": "P3380", "text": ["The number values were chosen to make ascertaining the results of the logic functions easier to calculate and observe."], "jumps": ["P3390", "P3290"]}, {"id": "P3390", "text": ["The first line of the last program loads the hexadecimal value 11011110 into data register D0.  The program then loads the hexadecimal value 11111011 into data register D1.", "The first line of the last program loads the hexadecimal value 11011110 into data register D0. The program then loads the hexadecimal value 11111011 into data register D1."], "jumps": ["P3400", "P3290"]}, {"id": "P3400", "text": ["Following that, the contents of data registers D0 and D1 are ANDed together with the results of the ANDing stored in data register D0.   At address 11026, the program loads the hexadecimal value 00001011 into data register D2.", "Following that, the contents of data registers D0 and D1 are ANDed together with the results of the ANDing stored in data register D0. At address 11026, the program loads the hexadecimal value 00001011 into data register D2."], "jumps": ["P3410", "P3290"]}, {"id": "P3410", "text": ["At this point, the results of the ANDing (stored in D0) is ORed with the contents of data register D2.  The results of the ORing is then stored in data register D2.", "At this point, the results of the ANDing (stored in D0) is ORed with the contents of data register D2. The results of the ORing is then stored in data register D2."], "jumps": ["P3420", "P3290"]}, {"id": "P3420", "text": ["At address 1102E, the hexadecimal value 10111001 is loaded into data register D3.  Finally, the contents of data register D3 is then Exclusively ORed with the contents of data register D2, with the    results stored in data register D3.", "At address 1102E, the hexadecimal value 10111001 is loaded into data register D3. Finally, the contents of data register D3 is then Exclusively ORed with the contents of data register D2, with the results stored in data register D3."], "jumps": ["P3430", "P3290"]}, {"id": "P3430", "text": ["Now that you know what the programs are designed to do, the next step is to insert the breakpoints.", "15.  Press the RESET button on the PC130-468 card.", "15. Press the RESET button on the PC130-468 card.........."], "jumps": ["P3440", "P3290", "P3450"]}, {"id": "P3450", "text": ["16.  Press the DEBUG key on the 68000 keyboard.  The display             will now offer you four options.  Using the arrow keys, place          the \"X\" in the option for Breakpoints and press the STOP                key.", "16. Press the DEBUG key on the 68000 keyboard. The display will now offer you four options. Using the arrow keys, place the \"X\" in the option for Breakpoints and press the STOP key. This activates the breakpoint program.", "Disable All [ ] Step over [ ] Trace Into [ ] Breakpoints [ x ]"], "jumps": ["P3460", "P3440"]}, {"id": "P3460", "text": ["Since we do not want the microprocessor to pause at every line of the program, we must tell it where we want the breakpoints located."], "jumps": ["P3470", "P3450"]}, {"id": "P3470", "text": ["In our case, we want a breakpoint at each location in the program where an arithmetic or logic operation occurs."], "jumps": ["P3480", "P3450"]}, {"id": "P3480", "text": ["The first two lines of Program 2 move data into the registers; it's not until we get to line three that an arithmetic function takes place.  This will be our first breakpoint.", "The first two lines of Program 2 move data into the registers; it's not until we get to line three that an arithmetic function takes place. This will be our first breakpoint.", "11000 20 3C 00 00 02 82 MOVE.L #642, D0 11006 22 3C 00 00 00 4E MOVE.L #78, D1 1100C 90 41 SUB.W D1, D0 1100E 24 3C 00 00 00 02 MOVE.L #2, D2 11014 C4 C0 MULU.W D0, D2 11016 4E 75 RTS 11018 20 3C 11 01 11 10 MOVE.L #11011110H, D0 1101E 22 3C 11 11 10 11 MOVE.L #11111011H, D1 11024 CO 81 AND.L D0, D1 11026 24 3C 00 00 10 11 MOVE.L #2, D2 1102C 84 80 OR.L D0, D2 1102E 26 3C 10 11 10 01 MOVE.L #10111001H, D3 11034 B5 83 E0R.L D2, D3 11036 4E 75 RTS Immediate SUBX SUBX.L -(A5), Only two combinations Only two combinations allowed: -(A1) allowed: Both data register Both Data Register Direct direct Both Indirect with Post Both Indirect with Decrement Post Decrement", "ADDRESSOMMANDSMANDS 0 0 1 A2 0 1 0 A3 0 1 1 A4 1 0 0 A5 1 0 1 A6 1 1 0 A7 1 1 1 5 1 0 1 -(Ax) 6 1 1 0 -(Ay) 7 1 1 11 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs, W 1 1 1 0 0 0 Abs, L 1 1 1 0 0 1R # -(An) 1 0 0 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs,W 1 1 1 0 0 0 Abs,L 1 1 1 0 0 1 1 1 1 0 1 1 Imm 1 1 1 1 0 0 x Immediate SUBA SUB.L D1,A1 All Allowed Only Address Register Direct Allowed SUBQ SUBQ.B #2,D3 1-8 Immediate Allowed PC with Offset PC with Index Immediate SUBX SUBX.L -(A5), Only two combinations Only two combinations allowed: -(A1) allowed: Both data register Both Data Register Direct direct Both Indirect with Post Both Indirect with Decrement Post Decrement", "OPCODESSOMMANDSMANDS 0 0 1 A2 0 1 0 A3 0 1 1 A4 1 0 0 A5 1 0 1 A6 1 1 0 A7 1 1 1 5 1 0 1 -(Ax) 6 1 1 0 -(Ay) 7 1 1 11 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs, W 1 1 1 0 0 0 Abs, L 1 1 1 0 0 1R # -(An) 1 0 0 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs,W 1 1 1 0 0 0 Abs,L 1 1 1 0 0 1 1 1 1 0 1 1 Imm 1 1 1 1 0 0 x Immediate SUBA SUB.L D1,A1 All Allowed Only Address Register Direct Allowed SUBQ SUBQ.B #2,D3 1-8 Immediate Allowed PC with Offset PC with Index Immediate SUBX SUBX.L -(A5), Only two combinations Only two combinations allowed: -(A1) allowed: Both data register Both Data Register Direct direct Both Indirect with Post Both Indirect with Decrement Post Decrement", "ASSEMBLY LANGUAGENDS 0 0 1 A2 0 1 0 A3 0 1 1 A4 1 0 0 A5 1 0 1 A6 1 1 0 A7 1 1 1 5 1 0 1 -(Ax) 6 1 1 0 -(Ay) 7 1 1 11 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs, W 1 1 1 0 0 0 Abs, L 1 1 1 0 0 1R # -(An) 1 0 0 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs,W 1 1 1 0 0 0 Abs,L 1 1 1 0 0 1 1 1 1 0 1 1 Imm 1 1 1 1 0 0 x Immediate SUBA SUB.L D1,A1 All Allowed Only Address Register Direct Allowed SUBQ SUBQ.B #2,D3 1-8 Immediate Allowed PC with Offset PC with Index Immediate SUBX SUBX.L -(A5), Only two combinations Only two combinations allowed: -(A1) allowed: Both data register Both Data Register Direct direct Both Indirect with Post Both Indirect with Decrement Post Decrement", "Program 2MMANDSMANDS 0 0 1 A2 0 1 0 A3 0 1 1 A4 1 0 0 A5 1 0 1 A6 1 1 0 A7 1 1 1 5 1 0 1 -(Ax) 6 1 1 0 -(Ay) 7 1 1 11 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs, W 1 1 1 0 0 0 Abs, L 1 1 1 0 0 1R # -(An) 1 0 0 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs,W 1 1 1 0 0 0 Abs,L 1 1 1 0 0 1 1 1 1 0 1 1 Imm 1 1 1 1 0 0 x Immediate SUBA SUB.L D1,A1 All Allowed Only Address Register Direct Allowed SUBQ SUBQ.B #2,D3 1-8 Immediate Allowed PC with Offset PC with Index Immediate SUBX SUBX.L -(A5), Only two combinations Only two combinations allowed: -(A1) allowed: Both data register Both Data Register Direct direct Both Indirect with Post Both Indirect with Decrement Post Decrement", "Program 3MMANDSMANDS 0 0 1 A2 0 1 0 A3 0 1 1 A4 1 0 0 A5 1 0 1 A6 1 1 0 A7 1 1 1 5 1 0 1 -(Ax) 6 1 1 0 -(Ay) 7 1 1 11 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs, W 1 1 1 0 0 0 Abs, L 1 1 1 0 0 1R # -(An) 1 0 0 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs,W 1 1 1 0 0 0 Abs,L 1 1 1 0 0 1 1 1 1 0 1 1 Imm 1 1 1 1 0 0 x Immediate SUBA SUB.L D1,A1 All Allowed Only Address Register Direct Allowed SUBQ SUBQ.B #2,D3 1-8 Immediate Allowed PC with Offset PC with Index Immediate SUBX SUBX.L -(A5), Only two combinations Only two combinations allowed: -(A1) allowed: Both data register Both Data Register Direct direct Both Indirect with Post Both Indirect with Decrement Post Decrement"], "jumps": ["P3490", "P3450"]}, {"id": "P3490", "text": ["17.  Press the key on the 68000 keyboard marked B.P.  The                    display should now look as depicted below:", "17. Press the key on the 68000 keyboard marked B.P. The display should now look as depicted below:"], "jumps": ["P3500", "P3480"]}, {"id": "P3500", "text": ["18.  Press the ENTER key.  The display should now indicate \"1\"           breakpoint.  At the cursor, we key in the address of the first            arithmetic operation which is 1100C and again press ENTER.", "18. Press the ENTER key. The display should now indicate \"1\" breakpoint. At the cursor, we key in the address of the first arithmetic operation which is 1100C and again press ENTER."], "jumps": ["P3510", "P3490"]}, {"id": "P3510", "text": ["The display now shows that a breakpoint has been established at address \"0001100C\"."], "jumps": ["P3520", "P3500"]}, {"id": "P3520", "text": ["19.  Press ENTER again. The cursor on the display will now                    indicate that it is ready for the 2nd breakpoint.  [Remember,            the contents of the registers will be valid for all executed                 instructions prior to the breakpoint].", "19. Press ENTER again. The cursor on the display will now indicate that it is ready for the 2nd breakpoint. [Remember, the contents of the registers will be valid for all executed instructions prior to the breakpoint]."], "jumps": ["P3530", "P3500"]}, {"id": "P3530", "text": ["Key in address 1100E, then press ENTER twice.  Continue adding breakpoints at address locations 11014 and 11016 and then press STOP.", "Key in address 1100E, then press ENTER twice. Continue adding breakpoints at address locations 11014 and 11016 and then press STOP."], "jumps": ["P3540", "P3500"]}, {"id": "P3540", "text": ["The NIDA 68000 trainer is designed for a maximum of 8 breakpoints.  Because the two programs will require more than that, we will only set breakpoints for Program 2, initially.", "The NIDA 68000 trainer is designed for a maximum of 8 breakpoints. Because the two programs will require more than that, we will only set breakpoints for Program 2, initially."], "jumps": ["P3550", "P3500"]}, {"id": "P3550", "text": ["Once we have completed the examination of Program 2, we will RESET the trainer which will erase all programmed breakpoints. Then, new breakpoints will be inserted for Program 3."], "jumps": ["P3560", "P3500"]}, {"id": "P3560", "text": ["20.  Press RUN.  At the address prompt, key in address 11000               and press ENTER.", "20. Press RUN. At the address prompt, key in address 11000 and press ENTER."], "jumps": ["P3570", "P3500"]}, {"id": "P3570", "text": ["The breakpoint program should have called up the registers showing the contents of the Status Register, the Program Counter and the Stack Pointer."], "jumps": ["P3580", "P3560"]}, {"id": "P3580", "text": ["Arrow down once and the screen will display other data and address registers, specifically D0, A0, D1 and A1."], "jumps": ["P3590", "P3560"]}, {"id": "P3590", "text": ["The data that was moved into D0 and D1 was decimal, however, the register's contents are displayed in hexadecimal.  The conversion was performed automatically by the microprocessor.", "The data that was moved into D0 and D1 was decimal, however, the register's contents are displayed in hexadecimal. The conversion was performed automatically by the microprocessor."], "jumps": ["P3600", "P3560"]}, {"id": "P3600", "text": ["Data register D0 was loaded with the decimal value 642.  At the first breakpoint, D0 indicates that its contents are 00000282h. When we convert 282h to decimal, it equals 642.", "Data register D0 was loaded with the decimal value 642. At the first breakpoint, D0 indicates that its contents are 00000282h. When we convert 282h to decimal, it equals 642."], "jumps": ["P3610", "P3560"]}, {"id": "P3610", "text": ["Data register D1 was loaded with the decimal value 78.  Looking at the register on the display shows that D1 now contains 0000004Eh.", "Data register D1 was loaded with the decimal value 78. Looking at the register on the display shows that D1 now contains 0000004Eh."], "jumps": ["P3620", "P3560"]}, {"id": "P3620", "text": ["Converting 4Eh to decimal yields 78.  This verifies that at the first breakpoint the intended data has, in fact, been stored in the assigned registers.", "Converting 4Eh to decimal yields 78. This verifies that at the first breakpoint the intended data has, in fact, been stored in the assigned registers."], "jumps": ["P3630", "P3560"]}, {"id": "P3630", "text": ["21.  Press the STOP key.  The display should, again, show the              Status Register, Program Counter and Stack Pointer.", "21. Press the STOP key. The display should, again, show the Status Register, Program Counter and Stack Pointer."], "jumps": ["P3640", "P3560"]}, {"id": "P3640", "text": ["The PC indicates that the processor has paused at address 1100E, which is our next breakpoint.  Down arrow to data register D0; the results of the SUB instruction should be evident.", "The PC indicates that the processor has paused at address 1100E, which is our next breakpoint. Down arrow to data register D0; the results of the SUB instruction should be evident."], "jumps": ["P3650", "P3630"]}, {"id": "P3650", "text": ["D0 now contains 00000234h. If we use the decimal values, subtracting 78 from 642, our answer is 564.  Converting 564 to hexadecimal yields 234h.  This answer corresponds with the contents of D0.", "D0 now contains 00000234h. If we use the decimal values, subtracting 78 from 642, our answer is 564. Converting 564 to hexadecimal yields 234h. This answer corresponds with the contents of D0."], "jumps": ["P3660", "P3630"]}, {"id": "P3660", "text": ["22.  Press the STOP key.  The PC should indicate that we are                 now at address 11014.  Down arrow to data register D2.  The          register should show the value 00000002h.", "22. Press the STOP key. The PC should indicate that we are now at address 11014. Down arrow to data register D2. The register should show the value 00000002h."], "jumps": ["P3670", "P3630"]}, {"id": "P3670", "text": ["Since a \"2\" in decimal is the same as a \"2\" in hexadecimal, no conversion is necessary."], "jumps": ["P3680", "P3630"]}, {"id": "P3680", "text": ["23.  Press the STOP key.  The PC should indicate that we are                now at address 11016.  Down arrow to data register D2.  The          register should show the value 00000468h.", "23. Press the STOP key. The PC should indicate that we are now at address 11016. Down arrow to data register D2. The register should show the value 00000468h."], "jumps": ["P3690", "P3630"]}, {"id": "P3690", "text": ["This is the result of the multiplication 2h x 234h.  Since this multiplication can be performed as if it were a decimal value, no conversion is necessary.", "This is the result of the multiplication 2h x 234h. Since this multiplication can be performed as if it were a decimal value, no conversion is necessary."], "jumps": ["P3700", "P3630"]}, {"id": "P3700", "text": ["24.  Press the STOP key.  The display should indicate that the               program has terminated normally.", "24. Press the STOP key. The display should indicate that the program has terminated normally.."], "jumps": ["P3710", "P3630"]}, {"id": "P3710", "text": ["The breakpoint function is very useful in analyzing programs, and that means it can be employed as a debugging tool to help isolate code errors."], "jumps": ["P3720", "P3630"]}, {"id": "P3720", "text": ["For the novice programmer it can assist in understanding the fundamental nature of programming and how programs interact with a microprocessor."], "jumps": ["P3730", "P3630"]}, {"id": "P3730", "text": ["Program 2 focused on arithmetic instructions.  In Program 3, three logic functions will be exercised.", "Program 2 focused on arithmetic instructions. In Program 3, three logic functions will be exercised."], "jumps": ["P3740", "P3630"]}, {"id": "P3740", "text": ["You will not be \"walked through\" every step as you were in Program 2, but instruction on breakpoint insertion will be forthcoming."], "jumps": ["P3750", "P3630"]}, {"id": "P3750", "text": ["25.  Press the RESET key on the PC130-468 card.  The                             breakpoints that were used in Program 2 have now been                 deleted.", "25. Press the RESET key on the PC130-468 card. The breakpoints that were used in Program 2 have now been deleted."], "jumps": ["P3760", "P3630"]}, {"id": "P3760", "text": ["26.  Press the DEBUG key on the 68000 keyboard.  The display             will now offer you four options.  Using the arrow keys, place          the \"X\" in the option for Breakpoints and press the STOP                key.", "26. Press the DEBUG key on the 68000 keyboard. The display will now offer you four options. Using the arrow keys, place the \"X\" in the option for Breakpoints and press the STOP key."], "jumps": ["P3770", "P3750"]}, {"id": "P3770", "text": ["This activates the breakpoint program."], "jumps": ["P3780", "P3750"]}, {"id": "P3780", "text": ["27.  Press the key on the 68000 keyboard marked B.P.  The                    display should now look as depicted below:", "27. Press the key on the 68000 keyboard marked B.P. The display should now look as depicted below:"], "jumps": ["P3790", "P3750"]}, {"id": "P3790", "text": ["28.  Press the ENTER key.  The display should now indicate \"1\"            breakpoint.  At the cursor, key in the address of the first                   arithmetic operation which is 11024 and again press ENTER.", "28. Press the ENTER key. The display should now indicate \"1\" breakpoint. At the cursor, key in the address of the first arithmetic operation which is 11024 and again press ENTER."], "jumps": ["P3800", "P3780"]}, {"id": "P3800", "text": ["The display now shows that a breakpoint has been established at address \"00011024\"."], "jumps": ["P3810", "P3780"]}, {"id": "P3810", "text": ["29.  Press ENTER again.  The cursor on the display will now                   indicate that it is ready for the 2nd breakpoint.  Key in                       address 1102C, then press ENTER twice.  Continue adding            breakpoints at address locations 1102E, 11034 and 11036.", "29. Press ENTER again. The cursor on the display will now indicate that it is ready for the 2nd breakpoint. Key in address 1102C, then press ENTER twice. Continue adding breakpoints at address locations 1102E, 11034 and 11036."], "jumps": ["P3820", "P3780"]}, {"id": "P3820", "text": ["When you have finished inserting the breakpoints, press STOP."], "jumps": ["P3830", "P3780"]}, {"id": "P3830", "text": ["30.  Press RUN.  At the prompt, key in the address 11018 and                 press ENTER.  The program now stops at the first                              breakpoint.  Every time you press STOP, the program                       continues executing instructions until the next breakpoint is          reached.", "30. Press RUN. At the prompt, key in the address 11018 and press ENTER. The program now stops at the first breakpoint. Every time you press STOP, the program continues executing instructions until the next breakpoint is reached."], "jumps": ["P3840", "P3780"]}, {"id": "P3840", "text": ["Step through the program from breakpoint to breakpoint calculating the contents of the various data registers based on the logic function that will be performed next.  Verify your calculations with the contents of the data registers.", "Step through the program from breakpoint to breakpoint calculating the contents of the various data registers based on the logic function that will be performed next. Verify your calculations with the contents of the data registers."], "jumps": ["P3850", "P3780"]}, {"id": "P3850", "text": ["Now you have seen the direct operation of arithmetic and logic commands.  Feel free to explore different instructions using the information presented earlier in this lesson.", "Now you have seen the direct operation of arithmetic and logic commands. Feel free to explore different instructions using the information presented earlier in this lesson."], "jumps": ["P3855", "P3780"]}, {"id": "P3855", "text": ["You will quickly discover what you can change and what effects it causes on the program operation."], "jumps": ["P3860", "P3780"]}, {"id": "P3860", "text": ["Which of the following addition instructions can be used for adding large immediate data?"], "jumps": ["P3780"]}, {"id": "P3861", "text": [], "jumps": []}, {"id": "P3862", "text": ["The instruction you have selected is for quick addition.  While it uses immediate data, it can only use small numbers.", "The instruction you have selected is for quick addition. While it uses immediate data, it can only use small numbers."], "jumps": []}, {"id": "P3863", "text": ["The instruction you have selected is for normal addition. Immediate data is not supported by this instruction."], "jumps": []}, {"id": "P3870", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": ["P3860"]}, {"id": "P3880", "text": ["2.  Set the Test Console Power to OFF.", "2. Set the Test Console Power to OFF.F...................."], "jumps": ["P3870"]}, {"id": "P3890", "text": ["3.  Remove all cards and return all equipment to its proper                   storage location.", "3. Remove all cards and return all equipment to its proper storage location.."], "jumps": ["P3910", "P3880"]}, {"id": "P3910", "text": ["This completes the experiment on ARITHMETIC AND LOGIC COMMANDS."], "jumps": ["P3890"]}, {"id": "P4000", "text": ["The negative bit (N) is set if the most significant bit is one, however, if an overflow occurs, the value is unknown. The extend bit (X) remains unchanged."], "jumps": ["P4010", "P1830"]}, {"id": "P4010", "text": ["DIVS\nThe DIVS instruction is the Signed Divide command. The instruction format is: DIVS.WORD SOURCE,DATA REGISTER", "DIVS The DIVS instruction is the Signed Divide command. The instruction format is: DIVS.WORD SOURCE,DATA REGISTER", "Dn 0 0 0 REGISTER # (An) 0 1 0 REGISTER # (An)+ 0 1 1 REGISTER # -(An) 1 0 0 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs, W 1 1 1 0 0 0 Abs, L 1 1 1 0 0 1 d(PC) 1 1 1 0 1 0 d(PC),i 1 1 1 0 1 1 Imm 1 1 1 1 0 0111111111111111111111111111111111111111111111111111111111111111111111111111111111111R # -(An) 1 0 0 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs,W 1 1 1 0 0 0 Abs,L 1 1 1 0 0 1 1 1 1 0 1 1 Imm 1 1 1 1 0 0 x Immediate SUBA SUB.L D1,A1 All Allowed Only Address Register Direct Allowed SUBQ SUBQ.B #2,D3 1-8 Immediate Allowed PC with Offset PC with Index Immediate SUBX SUBX.L -(A5), Only two combinations Only two combinations allowed: -(A1) allowed: Both data register Both Data Register Direct direct Both Indirect with Post Both Indirect with Decrement Post Decrement", "1 0 0 0 REGISTER 1 1 1 MODE REGISTER", "D0 0 0 0 D1 0 0 1 D2 0 1 0 D3 0 1 1 D4 1 0 0 D5 1 0 1 D6 1 1 0 D7 1 1 1"], "jumps": ["P4020", "P1830", "PC"]}, {"id": "P4020", "text": ["Size is word size. The 32-bit value of the specified data register is divided by the 16-bit value of the source.  This method, signed, indicates that the microprocessor will assume that the data is        positive or negative.", "Size is word size. The 32-bit value of the specified data register is divided by the 16-bit value of the source. This method, signed, indicates that the microprocessor will assume that the data is positive or negative."], "jumps": ["P4010"]}, {"id": "P4030", "text": ["Very large positive values, with their most significant bit set to one, will be treated as twos-complement numbers."], "jumps": ["P4010"]}, {"id": "P4040", "text": ["One of three conditions will occur: a divide by zero error can occur, the division causes an overflow (answer greater than16-bits), or a normal division will occur."], "jumps": ["P4010"]}, {"id": "P4050", "text": ["If normal divi mes $F5."], "jumps": ["P13170", "P13110"]}, {"id": "P13170", "text": ["The last line, 6, is used to return to the monitor program.  The monitor program runs our routines as if they were subroutines.", "The last line, 6, is used to return to the monitor program. The monitor program runs our routines as if they were subroutines.", "4. 1100E 46 01 NOT.B D1 5. 11010 12 81 MOVE.B D1,(A1)", "6. 11012 4E 75 RTS B D1,(A1) 10 12 81 MOVE.B D1,(A1)"], "jumps": ["P13180", "P13110"]}, {"id": "P13180", "text": ["10.  Press the Reset key on the PC130-468 card.  The main                     screen of the monitor program should be displayed.", "10. Press the Reset key on the PC130-468 card. The main screen of the monitor program should be displayed.", "6. 11012 4E 75 RTS B D1,(A1) 10 12 81 MOVE.B D1,(A1)"], "jumps": ["P13190", "P13110"]}, {"id": "P13190", "text": ["11.  Press the EDIT key and enter the value \"11000\".  Enter the             program shown in Program 1.  Remember to be careful when        entering in the values.  For more help on entering programs,          refer to the experiment in lesson 3 or see your instructor for           assistance.", "11. Press the EDIT key and enter the value \"11000\". Enter the program shown in Program 1. Remember to be careful when entering in the values. For more help on entering programs, refer to the experiment in lesson 3 or see your instructor for assistance."], "jumps": ["P13200", "P13110"]}, {"id": "P13200", "text": ["12.  Once you have finished entering the code, press the STOP             key, press the RUN key on the 68000 keypad and enter the             address value \"11000\".  Press ENTER after doing so.", "12. Once you have finished entering the code, press the STOP key, press the RUN key on the 68000 keypad and enter the address value \"11000\". Press ENTER after doing so."], "jumps": ["P13210", "P13110"]}, {"id": "P13210", "text": ["Observe the display of the 68000.  The display should say \"Program Terminated Correctly\".  This indicates that the RTS instruction worked at the end of the program.", "Observe the display of the 68000. The display should say \"Program Terminated Correctly\". This indicates that the RTS instruction worked at the end of the program."], "jumps": ["P13220", "P13110"]}, {"id": "P13220", "text": ["If you look at port A on card PC130-401 (The bottom of the three LED arrays) you should see the number value $F5 encoded in binary on the LEDS."], "jumps": ["P13230", "P13210"]}, {"id": "P13230", "text": ["Try changing the values using Edit and see if you can get other values to display."], "jumps": ["P13240", "P13210"]}, {"id": "P13240", "text": ["The program that you just completed allowed you to observe the ADD and NOT functions from the 68000 Instruction Set."], "jumps": ["P13250", "P13210"]}, {"id": "P13250", "text": ["The next two programs will allow you to observe the SUB, MULU, AND, OR and EOR instructions in a practical application."], "jumps": ["P13260", "P13210"]}, {"id": "P13260", "text": ["13.  Press the Reset key on the PC130-468 card.  The main                     screen of the monitor program should be displayed.", "13. Press the Reset key on the PC130-468 card. The main screen of the monitor program should be displayed."], "jumps": ["P13270", "P13210"]}, {"id": "P13270", "text": ["14.  Press the EDIT key and enter the value \"11000\".  Enter the             code shown in Programs 2 and 3.  These programs may be            entered successively because they will occupy different                  blocks of address locations.", "14. Press the EDIT key and enter the value \"11000\". Enter the code shown in Programs 2 and 3. These programs may be entered successively because they will occupy different blocks of address locations.", "11000 20 3C 00 00 02 82 MOVE.L #642, D0 11006 22 3C 00 00 00 4E MOVE.L #78, D1 1100C 90 41 SUB.W D1, D0 1100E 24 3C 00 00 00 02 MOVE.L #2, D2 11014 C4 C0 MULU.W D0, D2 11016 4E 75 RTS 11018 20 3C 11 01 11 10 MOVE.L #11011110 11 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs, W 1 1 1 0 0 0 Abs, L 1 1 1 0 0 1R # -(An) 1 0 0 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs,W 1 1 1 0 0 0 Abs,L 1 1 1 0 0 1 1 1 1 0 1 1 Imm 1 1 1 1 0 0 x Immediate SUBA SUB.L D1,A1 All Allowed Only Address Register Direct Allowed SUBQ SUBQ.B #2,D3 1-8 Immediate Allowed PC with Offset PC with Index Immediate SUBX SUBX.L -(A5), Only two combinations Only two combinations allowed: -(A1) allowed: Both data register Both Data Register Direct direct Both Indirect with Post Both Indirect with Decrement Post Decrement", "Program 2MMANDSMANDS 0 0 1 A2 0 1 0 A3 0 1 1 A4 1 0 0 A5 1 0 1 A6 1 1 0 A7 1 1 1 5 1 0 1 -(Ax) 6 1 1 0 -(Ay) 7 1 1 11 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs, W 1 1 1 0 0 0 Abs, L 1 1 1 0 0 1R # -(An) 1 0 0 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs,W 1 1 1 0 0 0 Abs,L 1 1 1 0 0 1 1 1 1 0 1 1 Imm 1 1 1 1 0 0 x Immediate SUBA SUB.L D1,A1 All Allowed Only Address Register Direct Allowed SUBQ SUBQ.B #2,D3 1-8 Immediate Allowed PC with Offset PC with Index Immediate SUBX SUBX.L -(A5), Only two combinations Only two combinations allowed: -(A1) allowed: Both data register Both Data Register Direct direct Both Indirect with Post Both Indirect with Decrement Post Decrement", "Program 3MMANDSMANDS 0 0 1 A2 0 1 0 A3 0 1 1 A4 1 0 0 A5 1 0 1 A6 1 1 0 A7 1 1 1 5 1 0 1 -(Ax) 6 1 1 0 -(Ay) 7 1 1 11 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs, W 1 1 1 0 0 0 Abs, L 1 1 1 0 0 1R # -(An) 1 0 0 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs,W 1 1 1 0 0 0 Abs,L 1 1 1 0 0 1 1 1 1 0 1 1 Imm 1 1 1 1 0 0 x Immediate SUBA SUB.L D1,A1 All Allowed Only Address Register Direct Allowed SUBQ SUBQ.B #2,D3 1-8 Immediate Allowed PC with Offset PC with Index Immediate SUBX SUBX.L -(A5), Only two combinations Only two combinations allowed: -(A1) allowed: Both data register Both Data Register Direct direct Both Indirect with Post Both Indirect with Decrement Post Decrement"], "jumps": ["P13280", "P13210"]}, {"id": "P13280", "text": ["In order to observe the operation of the program as it is executing various instructions, breakpoints will be inserted which will pause the microprocessor and allow you to view the contents of the register that contains the result of the last instruction prior to the breakpoint."], "jumps": ["P13290", "P13270"]}, {"id": "P13290", "text": ["After viewing the register contents, the microprocessor will be allowed to complete its next instruction before it reaches the next breakpoint."], "jumps": ["P13300", "P13270"]}, {"id": "P13300", "text": ["Again, the contents of the concerned register may then be examined.  It should be mentioned that the address location of the breakpoint will halt the processor before it can perform whatever instruction happens to be at that address.", "Again, the contents of the concerned register may then be examined. It should be mentioned that the address location of the breakpoint will halt the processor before it can perform whatever instruction happens to be at that address."], "jumps": ["P13310", "P13270"]}, {"id": "P13310", "text": ["For example, in Program 2, address location 1100C, there is a SUB instruction.  If we activate a breakpoint at 1100C, the processor will be halted prior to performing the SUB instruction.", "For example, in Program 2, address location 1100C, there is a SUB instruction. If we activate a breakpoint at 1100C, the processor will be halted prior to performing the SUB instruction."], "jumps": ["P13320", "P13270"]}, {"id": "P13320", "text": ["Before inserting the breakpoints, let's first analyze the programs and see what they will do."], "jumps": ["P13330", "P13270"]}, {"id": "P13330", "text": ["The first instruction loads the decimal number 642 into data register D0.  Following that, the decimal number 78 is loaded into data register D1.", "The first instruction loads the decimal number 642 into data register D0. Following that, the decimal number 78 is loaded into data register D1."], "jumps": ["P13340", "P13270"]}, {"id": "P13340", "text": ["At address 1100C, the contents of register D1 is subtracted from the contents of register D0, with the result being stored in register D0.  The next instruction loads the data register D2 with the decimal value 2.", "At address 1100C, the contents of register D1 is subtracted from the contents of register D0, with the result being stored in register D0. The next instruction loads the data register D2 with the decimal value 2."], "jumps": ["P13350", "P13270"]}, {"id": "P13350", "text": ["Once that is accomplished, the result of our subtraction stored in D0 is multiplied by the contents of data register D2.  The result of  the multiplication is then stored in D2.", "Once that is accomplished, the result of our subtraction stored in D0 is multiplied by the contents of data register D2. The result of the multiplication is then stored in D2."], "jumps": ["P13360", "P13270"]}, {"id": "P13360", "text": ["The number values were chosen to make ascertaining the results of the logic functions easier to calculate and observe."], "jumps": ["P13370", "P13270"]}, {"id": "P13370", "text": ["The first line of the last program loads the hexadecimal value 11011110 into data register D0.  The program then loads the hexadecimal value 11111011 into data register D1.", "The first line of the last program loads the hexadecimal value 11011110 into data register D0. The program then loads the hexadecimal value 11111011 into data register D1."], "jumps": ["P13380", "P13270"]}, {"id": "P13380", "text": ["Following that, the contents of data registers D0 and D1 are ANDed together with the results of the ANDing stored in data register D0.   At address 11026, the program loads the hexadecimal value 00001011 into data register D2.", "Following that, the contents of data registers D0 and D1 are ANDed together with the results of the ANDing stored in data register D0. At address 11026, the program loads the hexadecimal value 00001011 into data register D2."], "jumps": ["P13390", "P13270"]}, {"id": "P13390", "text": ["At this point, the results of the ANDing (stored in D0) is ORed with the contents of data register D2.  The results of the ORing is then stored in data register D2.", "At this point, the results of the ANDing (stored in D0) is ORed with the contents of data register D2. The results of the ORing is then stored in data register D2."], "jumps": ["P13400", "P13270"]}, {"id": "P13400", "text": ["At address 1102E, the hexadecimal value 10111001 is loaded into data register D3.  Finally, the contents of data register D3 is then Exclusively ORed with the contents of data register D2, with the    results stored in data register D3.", "At address 1102E, the hexadecimal value 10111001 is loaded into data register D3. Finally, the contents of data register D3 is then Exclusively ORed with the contents of data register D2, with the results stored in data register D3."], "jumps": ["P13410", "P13270"]}, {"id": "P13410", "text": ["Now that you know what the programs are designed to do, the next step is to insert the breakpoints.", "15.  Press the RESET button on the PC130-468 card.", "15. Press the RESET button on the PC130-468 card.........."], "jumps": ["P13420", "P13270", "P13430"]}, {"id": "P13430", "text": ["16.  Press the DEBUG key on the 68000 keyboard.  The display             will now offer you four options.  Using the arrow keys, place          the \"X\" in the option for Breakpoints and press the STOP                key.", "16. Press the DEBUG key on the 68000 keyboard. The display will now offer you four options. Using the arrow keys, place the \"X\" in the option for Breakpoints and press the STOP key. program.", "Disable All [ ] Step over [ ] Trace Into [ ] Breakpoints [ x ]"], "jumps": ["P13440", "P13420"]}, {"id": "P13440", "text": ["Since we do not want the microprocessor to pause at every line of the program, we must tell it where we want the breakpoints located."], "jumps": ["P13450", "P13430"]}, {"id": "P13450", "text": ["In our case, we want a breakpoint at each location in the program where an arithmetic or logic operation occurs."], "jumps": ["P13460", "P13430"]}, {"id": "P13460", "text": ["The first two lines of Program 2 move data into the registers; it's not until we get to line three that an arithmetic function takes place.  This will be our first breakpoint.", "The first two lines of Program 2 move data into the registers; it's not until we get to line three that an arithmetic function takes place. This will be our first breakpoint.", "11000 20 3C 00 00 02 82 MOVE.L #642, D0 11006 22 3C 00 00 00 4E MOVE.L #78, D1 1100C 90 41 SUB.W D1, D0 1100E 24 3C 00 00 00 02 MOVE.L #2, D2 11014 C4 C0 MULU.W D0, D2 11016 4E 75 RTS 11018 20 3C 11 01 11 10 MOVE.L #11011110H, D0 1101E 22 3C 11 11 10 11 MOVE.L #11111011H, D1 11024 CO 81 AND.L D0, D1 11026 24 3C 00 00 10 11 MOVE.L #2, D2 1102C 84 80 OR.L D0, D2 1102E 26 3C 10 11 10 01 MOVE.L #10111001H, D3 11034 B5 83 E0R.L D2, D3 11036 4E 75 RTS Immediate SUBX SUBX.L -(A5), Only two combinations Only two combinations allowed: -(A1) allowed: Both data register Both Data Register Direct direct Both Indirect with Post Both Indirect with Decrement Post Decrement", "ADDRESSOMMANDSMANDS 0 0 1 A2 0 1 0 A3 0 1 1 A4 1 0 0 A5 1 0 1 A6 1 1 0 A7 1 1 1 5 1 0 1 -(Ax) 6 1 1 0 -(Ay) 7 1 1 11 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs, W 1 1 1 0 0 0 Abs, L 1 1 1 0 0 1R # -(An) 1 0 0 REGISTER # d(An) 1 0 1 REGISTER # d(An,i) 1 1 0 REGISTER # Abs,W 1 1 1 0 0 0 Abs,L 1 1 1 0 0 1 1 1 1 0 1 1 Imm 1 1 1 1 0 0 x Immediate SUBA SUB.L D1,A1 All Allowed Only Address Register Direct Allowed SUBQ SUBQ.B #2,D3 1-8 Immediate Allowed PC with Offset PC with Index Immediate SUBX SUBX.L -(A5), Only two combinations Only two combinations allowed: -(A1) allowed: Both data register Both Data Register Direct direct Both Indirect with Post Both Indire r,            the contents of the registers will be valid for all executed                 instructions prior to the breakpoint].", "19. Press ENTER again. The cursor on the display will now indicate that it is ready for the 2nd breakpoint. [Remember, the contents of the registers will be valid for all executed instructions prior to the breakpoint]."], "jumps": ["P13510", "P13480"]}, {"id": "P13510", "text": ["Key in address 1100E, then press ENTER twice.  Continue adding breakpoints at address locations 11014 and 11016 and then press STOP.", "Key in address 1100E, then press ENTER twice. Continue adding breakpoints at address locations 11014 and 11016 and then press STOP."], "jumps": ["P13520", "P13480"]}, {"id": "P13520", "text": ["The NIDA 68000 trainer is designed for a maximum of 8 breakpoints.  Because the two programs will require more than that, we will only set breakpoints for Program 2, initially.", "The NIDA 68000 trainer is designed for a maximum of 8 breakpoints. Because the two programs will require more than that, we will only set breakpoints for Program 2, initially."], "jumps": ["P13530", "P13480"]}, {"id": "P13530", "text": ["Once we have completed the examination of Program 2, we will RESET the trainer which will erase all programmed breakpoints. Then, new breakpoints will be inserted for Program 3."], "jumps": ["P13540", "P13480"]}, {"id": "P13540", "text": ["20.  Press RUN. At the address prompt, key in address 11000 and        press ENTER.", "20. Press RUN. At the address prompt, key in address 11000 and press ENTER."], "jumps": ["P13550", "P13480"]}, {"id": "P13550", "text": ["The breakpoint program should have called up the registers showing the contents of the Status Register, the Program Counter and the Stack Pointer."], "jumps": ["P13560", "P13540"]}, {"id": "P13560", "text": ["Arrow down once and the screen will display other data and address registers, specifically D0, A0, D1 and A1."], "jumps": ["P13570", "P13540"]}, {"id": "P13570", "text": ["The data that was moved into D0 and D1 was decimal, however, the register's contents are displayed in hexadecimal.  The conversion was performed automatically by the microprocessor.", "The data that was moved into D0 and D1 was decimal, however, the register's contents are displayed in hexadecimal. The conversion was performed automatically by the microprocessor."], "jumps": ["P13580", "P13540"]}, {"id": "P13580", "text": ["Data register D0 was loaded with the decimal value 642.  At the first breakpoint, D0 indicates that its contents are 00000282h. When we convert 282h to decimal, it equals 642.", "Data register D0 was loaded with the decimal value 642. At the first breakpoint, D0 indicates that its contents are 00000282h. When we convert 282h to decimal, it equals 642."], "jumps": ["P13590", "P13540"]}, {"id": "P13590", "text": ["Data register D1 was loaded with the decimal value 78.  Looking at the register on the display shows that D1 now contains 0000004Eh.", "Data register D1 was loaded with the decimal value 78. Looking at the register on the display shows that D1 now contains 0000004Eh."], "jumps": ["P13600", "P13540"]}, {"id": "P13600", "text": ["Converting 4Eh to decimal yields 78.  This verifies that at the first breakpoint the intended data has, in fact, been stored in the assigned registers.", "Converting 4Eh to decimal yields 78. This verifies that at the first breakpoint the intended data has, in fact, been stored in the assigned registers."], "jumps": ["P13610", "P13540"]}, {"id": "P13610", "text": ["21.  Press the STOP key.  The display should, again, show the              Status Register, Program Counter and Stack Pointer.", "21. Press the STOP key. The display should, again, show the Status Register, Program Counter and Stack Pointer."], "jumps": ["P13620", "P13540"]}, {"id": "P13620", "text": ["The PC indicates that the processor has paused at address 1100E, which is our next breakpoint.  Down arrow to data register D0; the results of the SUB instruction should be evident.", "The PC indicates that the processor has paused at address 1100E, which is our next breakpoint. Down arrow to data register D0; the results of the SUB instruction should be evident."], "jumps": ["P13630", "P13610"]}, {"id": "P13630", "text": ["D0 now contains 00000234h. If we use the decimal values, subtracting 78 from 642, our answer is 564.  Converting 564 to hexadecimal yields 234h.  This answer corresponds with the contents of D0.", "D0 now contains 00000234h. If we use the decimal values, subtracting 78 from 642, our answer is 564. Converting 564 to hexadecimal yields 234h. This answer corresponds with the contents of D0."], "jumps": ["P13640", "P13610"]}, {"id": "P13640", "text": ["22.  Press the STOP key.  The PC should indicate that we are                now at address 11014.  Down arrow to data register D2.  The          register should show the value 00000002h.", "22. Press the STOP key. The PC should indicate that we are now at address 11014. Down arrow to data register D2. The register should show the value 00000002h."], "jumps": ["P13650", "P13610"]}, {"id": "P13650", "text": ["Since a \"2\" in decimal is the same as a \"2\" in hexadecimal, no conversion is necessary."], "jumps": ["P13660", "P13610"]}, {"id": "P13660", "text": ["23.  Press the STOP key.  The PC should indicate that we are                now at address 11016.  Down arrow to data register D2.  The          register should show the value 00000468h.", "23. Press the STOP key. The PC should indicate that we are now at address 11016. Down arrow to data register D2. The register should show the value 00000468h."], "jumps": ["P13670", "P13610"]}, {"id": "P13670", "text": ["This is the result of the multiplication 2h x 234h.  Since this multiplication can be performed as if it were a decimal value, no conversion is necessary.", "This is the result of the multiplication 2h x 234h. Since this multiplication can be performed as if it were a decimal value, no conversion is necessary."], "jumps": ["P13680", "P13610"]}, {"id": "P13680", "text": ["24.  Press the STOP key.  The display should indicate that the               program has terminated normally.", "24. Press the STOP key. The display should indicate that the program has terminated normally."], "jumps": ["P13690", "P13610"]}, {"id": "P13690", "text": ["The breakpoint function is very useful in analyzing programs, and that means it can be employed as a debugging tool to help isolate code errors."], "jumps": ["P13700", "P13610"]}, {"id": "P13700", "text": ["For the novice programmer it can assist in understanding the fundamental nature of programming and how programs interact with a microprocessor."], "jumps": ["P13710", "P13610"]}, {"id": "P13710", "text": ["Program 2 focused on arithmetic instructions.  In Program 3, three logic functions will be exercised.", "Program 2 focused on arithmetic instructions. In Program 3, three logic functions will be exercised."], "jumps": ["P13720", "P13610"]}, {"id": "P13720", "text": ["You will not be \"walked through\" every step as you were in Program 2, but instruction on breakpoint insertion will be forthcoming."], "jumps": ["P13730", "P13610"]}, {"id": "P13730", "text": ["25.  Press the RESET key on the PC130-468 card.  The                            breakpoints that were used in Program 2 have now been                 deleted.", "25. Press the RESET key on the PC130-468 card. The breakpoints that were used in Program 2 have now been deleted."], "jumps": ["P13740", "P13610"]}, {"id": "P13740", "text": ["26.  Press the DEBUG key on the 68000 keyboard.  The display             will now offer you four options.  Using the arrow keys, place          the \"X\" in the option for Breakpoints and press the STOP                key.", "26. Press the DEBUG key on the 68000 keyboard. The display will now offer you four options. Using the arrow keys, place the \"X\" in the option for Breakpoints and press the STOP key."], "jumps": ["P13750", "P13730"]}, {"id": "P13750", "text": ["This activates the breakpoint program."], "jumps": ["P13760", "P13730"]}, {"id": "P13760", "text": ["27.  Press the key on the 68000 keyboard marked B.P.  The                    display should now look as depicted below:", "27. Press the key on the 68000 keyboard marked B.P. The display should now look as depicted below:"], "jumps": ["P13770", "P13730"]}, {"id": "P13770", "text": ["28.  Press the ENTER key.  The display should now indicate \"1\"           breakpoint.  At the cursor, key in the address of the first                   arithmetic operation which is 11024 and again press ENTER.", "28. Press the ENTER key. The display should now indicate \"1\" breakpoint. At the cursor, key in the address of the first arithmetic operation which is 11024 and again press ENTER."], "jumps": ["P13780", "P13760"]}, {"id": "P13780", "text": ["The display now shows that a breakpoint has been established at address \"00011024\"."], "jumps": ["P13790", "P13760"]}, {"id": "P13790", "text": ["29.  Press ENTER again.  The cursor on the display will now                   indicate that it is ready for the 2nd breakpoint.  Key in                       address 1102C, then press ENTER twice.  Continue adding            breakpoints at address locations 1102E, 11034 and 11036.", "29. Press ENTER again. The cursor on the display will now indicate that it is ready for the 2nd breakpoint. Key in address 1102C, then press ENTER twice. Continue adding breakpoints at address locations 1102E, 11034 and 11036."], "jumps": ["P13800", "P13760"]}, {"id": "P13800", "text": ["When you have finished inserting the breakpoints, press STOP."], "jumps": ["P13810", "P13760"]}, {"id": "P13810", "text": ["30.  Press RUN.  At the prompt, key in the address 11018 and                press ENTER.  The program now stops at the first                              breakpoint. Every time you press STOP, the program                        continues executing instructions until the next breakpoint is          reached.", "30. Press RUN. At the prompt, key in the address 11018 and press ENTER. The program now stops at the first breakpoint. Every time you press STOP, the program continues executing instructions until the next breakpoint is reached."], "jumps": ["P13820", "P13760"]}, {"id": "P13820", "text": ["Step through the program from breakpoint to breakpoint calculating the contents of the various data registers based on the logic function that will be performed next.  Verify your calculations with the contents of the data registers.", "Step through the program from breakpoint to breakpoint calculating the contents of the various data registers based on the logic function that will be performed next. Verify your calculations with the contents of the data registers."], "jumps": ["P13830", "P13760"]}, {"id": "P13830", "text": ["Now you have seen the direct operation of arithmetic and logic commands.  Feel free to explore different instructions using the information presented earlier in this lesson.", "Now you have seen the direct operation of arithmetic and logic commands. Feel free to explore different instructions using the information presented earlier in this lesson."], "jumps": ["P13835", "P13760"]}, {"id": "P13835", "text": ["You will quickly discover what you can change and what effects it causes on the program operation."], "jumps": ["P13840", "P13760"]}, {"id": "P13840", "text": ["Which of the following addition instructions can be used for adding large immediate data?"], "jumps": ["P13760"]}, {"id": "P13841", "text": [], "jumps": []}, {"id": "P13842", "text": ["The instruction you have selected is for quick addition.  While it uses immediate data, it can only use small numbers.", "The instruction you have selected is for quick addition. While it uses immediate data, it can only use small numbers."], "jumps": []}, {"id": "P13843", "text": ["The instruction you have selected is for normal addition. Immediate data is not supported by th let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
