ps": []}, {"id": "P10226", "text": ["Eliminates the carrier signal from the output", "What is the purpose of C2 in the demodulator circuit shown?"], "jumps": []}, {"id": "P10225", "text": ["What is the function of D1 in the demodulator circuit shown?"], "jumps": []}, {"id": "P10224", "text": ["How is the carrier signal eliminated in the demodulator circuit shown?"], "jumps": []}, {"id": "P10223", "text": ["What would be the RC Time Constant in a demodulator circuit if the carrier signal was 550 kHz? !"], "jumps": []}, {"id": "P10222", "text": ["What is/are the output(s) of a demodulator circuit?"], "jumps": []}, {"id": "P10221", "text": ["What is/are the input(s) to a demodulator circuit?"], "jumps": []}, {"id": "P10220", "text": ["What section of a communication system is the demodulator circuit located?"], "jumps": []}, {"id": "PINFO", "text": ["9 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 10-27-99 Converted from storyboard to toolbook. frieda 12-15-99 Text & Branching - lisa 01-31-00 Graphics. jon 03-07-00 Review, corrections and graphics. doan 03-15-00 tested lesson for errors-John Ayala 07-14-00 Converted to ToolBook 7.1 format. jay 07-19-01 Converted to ToolBook 8.1 format. jay 07-30-01 Ran lesson to verify all pages were converted and ran the repair kit. 01-14-02 Converted to Phase II format. jay 02-06-02 checked for convertion errors John Ayala 03-25-02 Changed script on quiz buttons so experiment questions can be disregarded. -Penny 04-30-02 Review - lisa 12-04-02 P1420 Removed text from top that was already in graphic box. frieda 02-14-03 made text corrections to P1030,P1260 and P1450 per lydia - patty 09-15-03 P1610, changed text from \"develop3s\" to \"develops\" - dean 03-10-04 P10219, added schematic of circuit. -Penny", "07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 10-27-99 Converted from storyboard to toolbook. frieda 12-15-99 Text & Branching - lisa 01-31-00 Graphics. jon 03-07-00 Review, corrections and graphics. doan 03-15-00 tested lesson for errors-John Ayala 07-14-00 Converted to ToolBook 7.1 format. jay 07-19-01 Converted to ToolBook 8.1 format. jay 07-30-01 Ran lesson to verify all pages were converted and ran the repair kit. 01-14-02 Converted to Phase II format. jay 02-06-02 checked for convertion errors John Ayala 03-25-02 Changed script on quiz buttons so experiment questions can be disregarded. -Penny 04-30-02 Review - lisa 12-04-02 P1420 Removed text from top that was already in graphic box. frieda 02-14-03 made text corrections to P1030,P1260 and P1450 per lydia - patty 09-15-03 P1610, changed text from \"develop3s\" to \"develops\" - dean 03-10-04 P10219, added schematic of circuit. -Penny 09-01-04 P10219, Changed a. to \"By the action of L1 and C2\" and b. to \"By the action of R3\" -Penny", "How is the collector voltage on Q1 amplitude modulated?", "In the transistor series modulator circuit shown, which components replace the tank circuit in the diode modulator circuit?", "In the transistor collector modulator circuit shown, which component replaces the diode in the diode modulator circuit?", "What would be the resonant frequency of the tank circuit in the modulator circuit shown? O'>", "Combine the carrier signal and information signal. [", "Eliminate the positive or negative cycles of a combined signal.", "What is the function of C1 and L1 in the modulator circuit shown?", "Pass the information signal to the output.", "Add the negative cycles to the output signal.", "What is the function of D1 in the modulator circuit shown? w"], "jumps": []}, {"id": "P10213", "text": ["Which modulator circuit is the most commonly used and the least expensive?"], "jumps": []}, {"id": "P10212", "text": ["What is/are the output(s) from a modulator circuit?"], "jumps": []}, {"id": "P10211", "text": ["What is/are the input(s) to a modulator circuit?"], "jumps": []}, {"id": "P10210", "text": ["What section of a communication system is the modulator circuit located?"], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2960"]}, {"id": "P2970", "text": ["6. Q1 rectifies and amplifies the AM signal. R3 and C2 eliminate the carrier signal due to the long time constant. The information is passed to the output due to the short time constant. C3 blocks DC voltage.", "5. The transistor demodulator circuit uses a common emitter class B or C amplifier and a RC time constant circuit to recover the information signal."], "jumps": ["P2960", "P2999", "P2970", "P2940"]}, {"id": "P2950", "text": ["4. D1 rectifies the AM signal. R1 and C1 eliminate the carrier signal due to the long time constant. The information is passed to the output due to the short time constant. C2 blocks DC voltage.", "3. The diode demodulator circuit uses a diode and RC time constant circuit to recover the information signal."], "jumps": ["P2940", "P2960", "P2950", "P2920"]}, {"id": "P2930", "text": ["2. AM demodulator circuits input the AM waveform and output the information signal.", "1. AM demodulator circuits are located in the receiver section of a communication system."], "jumps": ["P2920", "P2940", "P2930", "P2001"]}, {"id": "P2910", "text": ["This completes the information on DEMODULATORS.ITLE........", "R1 and R2 establish the base bias for Q1...................", "Q1 amplifies and rectifies the AM input signal............."], "jumps": ["P2350"]}, {"id": "P2351", "text": ["Which component(s) eliminates the AM carrier signal?.......", "R3 and C2 eliminate the carrier signal.....................", "R1 and R2 establish base bias for Q1......................."], "jumps": ["P2340"]}, {"id": "P2341", "text": ["Which component(s) amplifies and rectifies the AM input signal?"], "jumps": ["P2310"]}, {"id": "P2330", "text": [], "jumps": ["P2310", "P2340"]}, {"id": "P2320", "text": ["Finally, C3 blocks the DC collector bias from the output.", "The high frequency carrier signal is eliminated and the low frequency information signal is allowed to pass."], "jumps": ["P2310", "P2330", "P2320", "P2240"]}, {"id": "P2300", "text": ["R3 and C2 operate as a RC time constant circuit to the AC signal (the AC sees +Vcc as ground). Just like R1 and C1 in the diode demodulator."], "jumps": ["P2240", "P2310"]}, {"id": "P2290", "text": ["Q1 is biased for Class B or C operation which only allows the positive cycles on the output. Just like the diode in the diode demodulator."], "jumps": ["P2240", "P2300"]}, {"id": "P2280", "text": ["R1 and R2 establish base bias and R3 establishes collector bias."], "jumps": ["P2240", "P2290"]}, {"id": "P2270", "text": ["The AM signal is applied to the base of Q1 through the DC coupling capacitor C1."], "jumps": ["P2240", "P2280"]}, {"id": "P2260", "text": ["The operation of the transistor demodulator is identical to the diode demodulator."], "jumps": ["P2240", "P2270"]}, {"id": "P2250", "text": ["Transistor demodulators are used to amplify the weak AM signal, thus eliminating a stage of amplification before the demodulator circuit.", "The transistor demodulator, or transistor detector, uses a common emitter amplifier biased class B or C."], "jumps": ["P2240", "P2260", "P2250", "P2230"]}, {"id": "P2230", "text": ["Diode Demodulators Transistor Demodulators Transistor Series Modulatordulatorm effecting the information input signal. C4 grounds any AC signals preventing them from effecting +Vcc.rounds any AC signals preventing them from effecting +Vcc.", "The next demodulator circuit is more complex but, it operates just like the diode demodulator.", "C2 blocks any DC offset voltage on the output..............", "D1 eliminates the upper or lower envelope of the AM waveform."], "jumps": ["P2220", "P2240"]}, {"id": "P2221", "text": [], "jumps": []}, {"id": "P2220", "text": ["To eliminate the upper or lower envelope of the AM waveform.", "To eliminate the DC voltage in the information signal.", "What is the function of R1 and C1 in the circuit shown?....", "C2 blocks any DC offset voltage on the output..............", "The RC time constant for R1 and C1 eliminates the carrier signal."], "jumps": ["P2210"]}, {"id": "P2211", "text": [], "jumps": []}, {"id": "P2210", "text": ["To eliminate the upper or lower envelope of the AM waveform.", "To eliminate the DC voltage in the information signal.", "What is the function of D1 in the circuit shown?..........."], "jumps": ["P2190"]}, {"id": "P2200", "text": ["Finally, C2 blocks the DC level of the information signal. The output, as shown, is the information signal.", "In other words, the high frequency carrier signal is shorted to ground through the reactance of C1 and the low frequency information signal is passed on to the output."], "jumps": ["P2190", "P2210", "P2200", "P2090"]}, {"id": "P2180", "text": ["However, since the RC time constant of R1 and C1 is short compared to the information signal frequency, the charge on C1 follows the amplitude variations of the positive cycles of the carrier frequency."], "jumps": ["P2090", "P2190"]}, {"id": "P2170", "text": ["C1 does not have time to discharge before the next positive cycle of the carrier signal is received."], "jumps": ["P2090", "P2180"]}, {"id": "P2160", "text": ["C1 attempts to discharge through R1 but, the RC time constant of R1 and C1 is long compared to the carrier frequency."], "jumps": ["P2090", "P2170"]}, {"id": "P2150", "text": ["During the negative cycles of the AM waveform, D1 is reverse biased an acts as an open."], "jumps": ["P2090", "P2160"]}, {"id": "P2140", "text": ["C1 charges quickly due to the short time constant of a forward biased diode and C1."], "jumps": ["P2090", "P2150"]}, {"id": "P2130", "text": ["During the positive cycles of the AM waveform, D1 is forward biased and conducts."], "jumps": ["P2090", "P2140"]}, {"id": "P2120", "text": ["R1 and C1 act as a RC time constant circuit and effect the rectified AM waveform."], "jumps": ["P2090", "P2130"]}, {"id": "P2110", "text": ["Also note that the signal at the junction of D1 and R1 can not be seen due to the action R1 and C1, as shown by the signal illustrated on C1."], "jumps": ["P2090", "P2120"]}, {"id": "P2100", "text": ["The AM waveform is applied to D1 which rectifies the signal as shown at the junction of D1 and R1. Note that the diode could be reversed, the output of the circuit would be the same.", "The operation of the circuit is as follows................."], "jumps": ["P2090", "P2110", "P2100", "P2080"]}, {"id": "P2086", "text": ["A TC of 0.50 mS is long compared to the period of the carrier frequency, 0.01 mS, and short compared to the period of the infromation frequency, 1.00 mS.", "Carrier Signal = 100 kHz = 0.01 mS Information = 1 kHz = 1.00 mS Time Constant = 50/fc = 0.50 mS", "For example, if the carrier signal is 100 kHz and the information signal is 1 kHz, the periods and time constant are:"], "jumps": ["P2085"]}, {"id": "P2085", "text": ["TIME CONSTANT OF 50/fc - Since the carrier frequency is at least 50 times higher than the information frequency, using a time constant of 50/fc produces a long time constant for the carrier signal frequency and a short time constant for the information signal frequency."], "jumps": ["P2086"]}, {"id": "P2080", "text": ["A long time constant for the carrier frequency A short time constant for the information frequency on input signal. C4 grounds any AC signals preventing them from effecting +Vcc.rounds any AC signals preventing them from effecting +Vcc.", "Having a TC of 50/fc gives:e..............................."], "jumps": ["P2085", "P2050", "P2090"]}, {"id": "P2070", "text": ["The operation of diode demodulators is based on the RC time constant of R1 and C1 and, the time constant is normally equal to 50/fc where fc is the carrier frequency."], "jumps": ["P2050", "P2080"]}, {"id": "P2060", "text": ["Diode demodulators are the most common demodulator circuits used because they are the least expensive. Only when amplification is needed are other types of demodulator circuits used.", "The diode demodulator, or diode detector, only consists of a diode, a resistor, and two capacitors."], "jumps": ["P2050", "P2070", "P2060", "P2030"]}, {"id": "P2040", "text": ["Diode Demodulators Transistor Demodulators Transistor Series Modulatordulatorm effecting the information input signal. C4 grounds any AC signals preventing them from effecting +Vcc.rounds any AC signals preventing them from effecting +Vcc.", "Let's start with the basic AM demodulator circuit. Diode Demodulators"], "jumps": ["P2030", "P2050"]}, {"id": "P2030", "text": ["Diode Demodulators Transistor Demodulators Transistor Series Modulatordulatorm effecting the information input signal. C4 grounds any AC signals preventing them from effecting +Vcc.rounds any AC signals preventing them from effecting +Vcc.", "AM demodulator circuits are actually simpler than AM modulator circuits and two typical ones are covered."], "jumps": ["P2015", "P2040"]}, {"id": "P2020", "text": ["The demodulator receives one input, the AM waveform, and produces one output, the recovered information signal.", "The demodulator circuit, located in the receiver, is the circuit that recovers the information signal."], "jumps": ["P2015", "P2030", "P2020", "P2001"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1980"]}, {"id": "P1990", "text": ["8. Q1 amplifies the positive cycles. Q2 controls the amplification by the level of the information signal. L2, C4 and C5 add the negative cycles.", "7. The transistor series modulator uses two transistors in series, one class B or C and the other class A, and a tank circuit to produce AM waveforms."], "jumps": ["P1980", "P1999", "P1990", "P1960"]}, {"id": "P1970", "text": ["6. Q1 amplifies the positive cycles of the carrier signal. The amount of amplification is controlled by the information signal changing the collector bias. L2, C6 and C7 add the negative cycles.", "5. The transistor collector modulator circuit uses a common base class B or C amplifier and a tank circuit to produce AM waveforms."], "jumps": ["P1960", "P1980", "P1970", "P1940"]}, {"id": "P1950", "text": ["4. R1 and R2 combine the carrier and information signals. D1 rectifies the signal. C1 and L1 add the negative cycles.", "3. The diode modulator circuit uses a diode and tank circuit to produce AM waveforms."], "jumps": ["P1940", "P1960", "P1950", "P1920"]}, {"id": "P1930", "text": ["2. The inputs to the AM modulator are the carrier and information signals, the output is an AM waveform.", "1. AM modulator circuits are located in the transmitter section of a communication system."], "jumps": ["P1920", "P1940", "P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on MODULATORS. TITLE........", "If the information signal decreases in value, the conduction of Q2 decreases. This increases the resistance of Q2 lowering the voltage on the collector of Q1."], "jumps": ["P1620"]}, {"id": "P1621", "text": ["If the information signal decreases in value, what happens to the AM output signal?", "C2 is used to stabilize the operation of Q2 by grounding AC signals.", "L2 is used in the tank circuit of L2, C2 and C5 and adds the negative cycles to the output signal."], "jumps": ["P1610"]}, {"id": "P1611", "text": ["Which component(s) develops the output signal and does not effectively reduce the DC bias???I>", "The result is an AM waveform as the output of the circuit."], "jumps": ["P1550", "P1610"]}, {"id": "P1590", "text": ["With a negative information signal applied, Q2 conducts less, increasing its resistance and decreasing the signal on Q1's collector -- amplitude modulation."], "jumps": ["P1550", "P1600"]}, {"id": "P1580", "text": ["With a positive information signal applied, Q2 conducts more, decreasing its resistance and increasing the signal on Q1's collector -- amplitude modulation."], "jumps": ["P1550", "P1590"]}, {"id": "P1570", "text": ["This sets up the collector bias of Q1 producing a constant amplitude carrier output signal."], "jumps": ["P1550", "P1580"]}, {"id": "P1560", "text": ["With no information input signal applied, Q2 will conduct at its midpoint level, acting as a collector resistance for Q1.", "The operation of the circuit is as follows:................"], "jumps": ["P1550", "P1570", "P1560", "P1460"]}, {"id": "P1540", "text": ["R1 and R2 provide base bias and C2 provides temperature stabilization."], "jumps": ["P1460", "P1550"]}, {"id": "P1530", "text": ["The information signal is coupled through C1 to the base of the class A common collector amplifier Q2."], "jumps": ["P1460", "P1540"]}, {"id": "P1520", "text": ["L2, C4 and C5 is the tank circuit that adds the negative cycles to the output."], "jumps": ["P1530", "P1460"]}, {"id": "P1510", "text": ["The positive cycles of the output signal are developed across the high AC resistance of L1 through C3."], "jumps": ["P1520", "P1460"]}, {"id": "P1500", "text": ["The constant frequency and amplitude carrier signal is applied to the base of Q1 through T1.7"], "jumps": ["P1510", "P1460"]}, {"id": "P1490", "text": ["Q1 is a standard common emitter class B or C amplifier (operates like a diode with amplification)."], "jumps": ["P1460", "P1500"]}, {"id": "P1480", "text": ["The transistor modulator overcomes the problem of saturation in the transistor collector circuit but, power is wasted in the Q2 circuit decreasing efficiency."], "jumps": ["P1460", "P1490"]}, {"id": "P1470", "text": ["The collector voltage of Q1 is controlled by the information signal in both circuits. Only in this circuit, the voltage is controlled by Q2.", "The operation of the circuit is as follows:................"], "jumps": ["P1460", "P1480", "P1470", "P1450"]}, {"id": "P1450", "text": ["Diode Modulator Transistor Collector Modulator Transistor Series Modulatorral and produces an AM waveform. waveform.orm.", "The last type of AM modulator operates similar to the transistor collector modulator.", "C1 couples the information signal to the collector of Q1 to amplitude modulate the carrier signal.", "Q1 develops the positive cycles of the AM waveform........."], "jumps": ["P1440", "P1460"]}, {"id": "P1441", "text": ["Develops the positive cycles of the AM waveform.............", "Couples the information signal to amplitude modulate the carrier signal.........................", "Adds the negative cycles to the AM waveform.", "What is the purpose of L2, C6 and C7?......................", "Q1 develops the positive cycles of the AM waveform.........", "The negative cycles are added to the AM waveform by L2, C6 and C7."], "jumps": ["P1430"]}, {"id": "P1431", "text": ["Develops the positive cycles of the AM waveform.............", "Couples the information signal to amplitude modulate the carrier signal.........................", "Adds the negative cycles to the AM waveform.", "What is the purpose of C1?s typed.........................."], "jumps": ["P1420"]}, {"id": "P1420", "text": ["C1 blocks DC bias voltages from effecting the information input signal. C2 grounds the high frequency carrier signal preventing it from effecting the information input signal. C4 grounds any AC signals preventing them from effecting +Vcc.", "Finally, C1, C2 and C4 act as isolation components. locks DC bias voltages from effecting the information input signal. C2 grounds the high frequency carrier signal preventing it from effecting the information input signal. C4 grounds any AC signals preventing them from effecting +Vcc."], "jumps": ["P1370", "P1430", "P1420"]}, {"id": "P1400", "text": ["Of course, only the positive cycles of the carrier signal is modulated but, the tank circuit of L2, C6 and C7 add the negative cycles."], "jumps": ["P1370", "P1410"]}, {"id": "P1390", "text": ["This action increases or decreases the conduction of Q1(amplification) according to the amplitude of the information signal, AM modulation."], "jumps": ["P1370", "P1400"]}, {"id": "P1380", "text": ["With an information signal input applied through C1, the signal level adds to and subtracts from the collector bias on Q1.", "With no information input, the output is the carrier signal with no amplitude modulation."], "jumps": ["P1370", "P1390", "P1380", "P1330"]}, {"id": "P1360", "text": ["L2, C6 and C7 act as a tank circuit and add the negative cycles to the output waveform, similar to the tank in the diode modulator."], "jumps": ["P1370", "P1330"]}, {"id": "P1350", "text": ["Only the positive alternation of the carrier signal reaches the output through the coupling capacitor C5 and L2, C6 and C7."], "jumps": ["P1330", "P1360"]}, {"id": "P1340", "text": ["With no information signal applied, the biasing of Q1 is such that the amplifier operates in Class B or C, like the diode in the diode modulator.", "The operation of the circuit is as follows................."], "jumps": ["P1330", "P1350", "P1340", "P1270"]}, {"id": "P1320", "text": ["Collector bias is provided by R2 and the small DC resistance of L1."], "jumps": ["P1270", "P1330"]}, {"id": "P1310", "text": ["Q1 base bias is provided by the voltage divider action of R1, R2 and R3. C3 provides temperature stabilization and grounds AC signals to maintain a constant DC level."], "jumps": ["P1320", "P1270"]}, {"id": "P1300", "text": ["The carrier signal is applied to the emitter of Q1 via T1 and the output is developed across the high AC resistance of L1 through C5."], "jumps": ["P1270", "P1310"]}, {"id": "P1290", "text": ["The disadvantage is that 100% modulation is hard to obtain due to Q1 saturating on large information signal inputs."], "jumps": ["P1270", "P1300"]}, {"id": "P1280", "text": ["The circuit provides amplification that a diode modulator cannot provide.", "Notice that the transistor collector modulator consists of a simple transistor common base amplifier with a few additional components."], "jumps": ["P1270", "P1290", "P1280", "P1260"]}, {"id": "P1260", "text": ["Diode Modulator Transistor Collector Modulator Transistor Series Modulatorral and produces an AM waveform. waveform.orm.", "The second type of AM modulator circuit operates very similar to the diode modulator."], "jumps": ["P1230", "P1270"]}, {"id": "P1250", "text": ["The only difference is that the positive half of the combined signal from R1 and R2 is eliminated by D1 and the tank circuit adds the positive cycles to the AM waveform."], "jumps": ["P1230", "P1260"]}, {"id": "P1240", "text": ["As a final note about diode modulators, the diode can be reversed producing the signals as shown.", "R1 and R2 combine the carrier and information signals......", "D1 rectifies the combined carrier and information signals.."], "jumps": ["P1230", "P1250", "P1240", "P1220"]}, {"id": "P1221", "text": ["Rectify the combined carrier and information signals.", "Combine the carrier and information signals.", "Add the negative cycles to the AM signal.", "What is the purpose of C1 and L1?..........................", "R1 and R2 combine the carrier and information signals......", "The tank circuit of C1 and L1 add the negative cycles to the AM signal."], "jumps": ["P1210"]}, {"id": "P1211", "text": ["Rectify the combined carrier and information signals.", "Combine the carrier and information signals.", "Add the negative cycles to the AM signal.", "What is the purpose of D1 in a diode AM modulator circuit?."], "jumps": ["P1160"]}, {"id": "P1190", "text": ["Information Signal Carrier Signal Sum of the Signals Difference of the Signalsssd produces an AM waveform. waveform.orm."], "jumps": ["P1160", "P1210"]}, {"id": "P1180", "text": ["This grounds the information signal since it is at least 50 times lower than the carrier signal."], "jumps": ["P1160", "P1190"]}, {"id": "P1170", "text": ["However, the reactance of the tank circuit, which is tuned to the carrier frequency, is low at frequencies below and above resonance."], "jumps": ["P1160", "P1180"]}, {"id": "P1160", "text": ["Information Signal Carrier Signal Sum of the Signals Difference of the Signalsssd produces an AM waveform. waveform.orm.", "The circuit functions as a mixing circuit, developing the:."], "jumps": ["P1050", "P1170"]}, {"id": "P1150", "text": ["The tank circuit oscillates according to the signal that is applied, half of the AM waveform, producing a full AM waveform."], "jumps": ["P1050", "P1160"]}, {"id": "P1140", "text": ["The tank circuit is tuned to the frequency of the carrier signal and due to the action of a parallel resonant circuit, the negative cycles are developed."], "jumps": ["P1050", "P1150"]}, {"id": "P1130", "text": ["C1 and L1 act as a tank circuit and are used to add the negative half of the AM signal as shown on the output."], "jumps": ["P1050", "P1140"]}, {"id": "P1120", "text": ["Note that the signal at the junction of D1 and R3 will not be present in the circuit due to the action of C1 and L1."], "jumps": ["P1050", "P1130"]}, {"id": "P1110", "text": ["Recall that a diode only conducts when forward biased."], "jumps": ["P1050", "P1120"]}, {"id": "P1100", "text": ["The action of D1 rectifies the signal producing half of the AM waveform across R3."], "jumps": ["P1050", "P1110"]}, {"id": "P1090", "text": ["At this point the signal is not an AM waveform it is the high frequency carrier signal riding on the low frequency information signal.", "This produces a combined signal at the junction of R1 and R2 as shown."], "jumps": ["P1050", "P1100", "P1090"]}, {"id": "P1070", "text": ["A carrier signal from an oscillator is applied to R1 while the information signal from a transducer is applied to R2."], "jumps": ["P1050", "P1080"]}, {"id": "P1060", "text": ["Diode modulators are the most common modulator circuits used because they are the least expensive. Only when amplification is needed are other types of modulator circuits used.", "Notice that the diode AM modulator only consists of three resistors, one diode, one capacitor, and one inductor."], "jumps": ["P1050", "P1070", "P1030", "P1060"]}, {"id": "P1040", "text": ["Diode Modulator Transistor Collector Modulator Transistor Series Modulatorral and produces an AM waveform. waveform.orm.", "Let's start with the basic AM modulator circuit."], "jumps": ["P1030", "P1050"]}, {"id": "P1030", "text": ["Diode Modulator Transistor Collector Modulator Transistor Series Modulatorral and produces an AM waveform. waveform.orm.", "AM modulator circuits are relatively simple circuits and three typical ones are covered."], "jumps": ["P1015", "P1040"]}, {"id": "P1020", "text": ["The modulator receives two inputs, information and carrier, and generates one output, the AM waveform.", "The modulator circuit, located in the transmitter, is the circuit that produces the AM signal."], "jumps": ["P1015", "P1030", "P1020", "P1001"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P460", "text": ["Let's begin the lesson on AM CIRCUITS.E..................................."], "jumps": ["P450"]}, {"id": let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
