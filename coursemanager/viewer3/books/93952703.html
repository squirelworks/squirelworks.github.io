const book = {"title": "93952703", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . .", "Title: TROUBLESHOOTING TRANSFORMERSfasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe typical faults in transformer circuits. w Describe transformer troubleshooting procedures.", "w Recognize that a transformer is faulted. w Observe the effects of an open and shorted secondary in a transformer circuit."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "* Jumper is not required when using PC130-21 Rev A. Rev A identification is located on the back of the PC130-21 card in the lower left corner . ..d."], "jumps": []}, {"id": "P330", "text": ["PC130-21 Rev A Configured for use with the 130E and TD2000 test consoles. No jumper required..", "PC130-21 Rev A Configured for use with the 130A test console. No jumper required..uired.", "PC130-21 Configured for use with the 130A, 130E and TD2000 test consoles. Jumper required....."], "jumps": []}, {"id": "P400", "text": ["In this lesson you will learn about troubleshooting transformer\ncircuits and you will troubleshoot a faulted transformer.", "In this lesson you will learn about troubleshooting transformer circuits and you will troubleshoot a faulted transformer. ............."], "jumps": []}, {"id": "P410", "text": ["Transformers are input-output devices."], "jumps": []}, {"id": "P420", "text": ["Measuring the input (primary) and output (secondary) voltages\ndetermine if the transformer is operating normally.", "Measuring the input (primary) and output (secondary) voltages determine if the transformer is operating normally. ..............."], "jumps": []}, {"id": "P430", "text": ["An incorrect voltage reading indicates that the transformer is\nfaulted.", "An incorrect voltage reading indicates that the transformer is faulted. .............."], "jumps": []}, {"id": "P440", "text": ["Let's begin the lesson on TROUBLESHOOTING TRANSFORMERS. ..................."], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The two most common faults in transformers are opens and\nshorts.", "The two most common faults in transformers are opens and shorts."], "jumps": []}, {"id": "P1030", "text": ["Let's discuss opens first."], "jumps": []}, {"id": "P1040", "text": ["Opens occur when there is a break in the primary or secondary\ncoil of the transformer.", "Opens occur when there is a break in the primary or secondary coil of the transformer. .........."], "jumps": []}, {"id": "P1050", "text": ["An open prevents current flow. The transformer will not generate an output voltage.", "An open prevents current. The transformer will not generate an output voltage.", "An open prevents current flow. The transformer will not generate an output voltage. n output voltage."], "jumps": []}, {"id": "P1060", "text": ["If the open is in the primary, primary current will not flow. This\nprevents a magnetic field from being developed.", "If the open is in the primary, primary current will not flow. This prevents a magnetic field from being developed. .........."], "jumps": []}, {"id": "P1070", "text": ["Without a changing magnetic field in the primary, there is no\ninduced voltage in the secondary.", "Without a changing magnetic field in the primary, there is no induced voltage in the secondary. ..............."], "jumps": []}, {"id": "P1080", "text": ["If the open is in the secondary, secondary current does not flow\nand no output voltage is developed.", "If the open is in the secondary, secondary current does not flow and no output voltage is developed. ........"], "jumps": []}, {"id": "P1090", "text": ["In this transformer, only the top secondary has no output.  The\nopen only effects one secondary.", "In this transformer, only the top secondary has no output. The open only effects one secondary. ........"], "jumps": []}, {"id": "P1100", "text": ["In a center tapped transformer, an open effects two of the three\noutput voltages.  The open can be either the winding or the center tap itself.", "In a center tapped transformer, an open effects two of the three output voltages. The open can be either the winding or the center tap itself."], "jumps": []}, {"id": "P1105", "text": ["CENTER TAPPED TRANSFORMER - A center tapped transformer has a connection mid-way between the top and bottom of the secondary. This effectively gives three secondary output voltages."], "jumps": []}, {"id": "P1110", "text": ["An open in the primary of a transformer _______", "An open in the primary of a transformer _______ primary of a transformer"], "jumps": []}, {"id": "P1111", "text": [], "jumps": []}, {"id": "P1112", "text": ["An open in the primary prevents the development of magnetic\nfields in the primary which prevents the development of induced\nvoltage or current in the secondary.", "An open in the primary prevents the development of magnetic fields in the primary which prevents the development of induced voltage or current in the secondary. ..................."], "jumps": []}, {"id": "P1120", "text": ["An open in the secondary of a transformer prevents an output\nvoltage in ______", "An open in the secondary of a transformer prevents an output voltage in ______ n"], "jumps": []}, {"id": "P1121", "text": [], "jumps": []}, {"id": "P1122", "text": ["Only the secondary with the open will generate a 0 V output."], "jumps": []}, {"id": "P1123", "text": ["An open in a center tapped transformer changes two of the three\nvoltage measurements.", "An open in a center tapped transformer changes two of the three voltage measurements. ..........."], "jumps": []}, {"id": "P1130", "text": ["Now, let's discuss shorts.", "Now, let's discuss shorts.re..............................."], "jumps": []}, {"id": "P1140", "text": ["Shorts occur when windings in the primary or secondary coils allow an alternate low resistance path for current flow.", "Shorts occur when windings in the primary or secondary coils allow an alternate low resistance path for current.", "Shorts occur when windings in the primary or secondary coils allow an alternate low resistance path for current flow. allow an alternate low resistance path for current flow."], "jumps": []}, {"id": "P1150", "text": ["A short reduces the number of turns in the coil.", "A short reduces the number of turns in the coil............"], "jumps": []}, {"id": "P1160", "text": ["If only a few turns are shorted (partial short), the output voltage is\nchanged.  Remember:", "If only a few turns are shorted (partial short), the output voltage is changed. Remember: :::", "Np Ep Ns = or Es = Ep x Np", "= or Es = Ep x", "Ns Ns = or Es = Ep x Np", "Ep Ep Ns = or Es = Ep x Np"], "jumps": []}, {"id": "P1170", "text": ["If the primary has a short, the output voltage increases.  For\nexample, if 5 turns are shorted, the output voltage increases to\n20 V.", "If the primary has a short, the output voltage increases. For example, if 5 turns are shorted, the output voltage increases to 20 V. ..........................", "Ns Ns = or Es = Ep x Np", "10 Ns = or Es = Ep x Np"], "jumps": []}, {"id": "P1180", "text": ["If the secondary has a short, the output voltage decreases. For\nexample, if 5 turns are shorted, the output voltage decreases to\n5 V.", "If the secondary has a short, the output voltage decreases. For example, if 5 turns are shorted, the output voltage decreases to 5 V. .........................", "Ns Ns = or Es = Ep x Np", "10 Ns = or Es = Ep x Np", "5 Ns = or Es = Ep x Np"], "jumps": []}, {"id": "P1190", "text": ["Shorts can also be across the entire winding (complete shorts)."], "jumps": []}, {"id": "P1200", "text": ["A complete short in the primary is like shorting the input voltage. This causes excessive current flow.", "A complete short in the primary is like shorting the input voltage. This causes excessive current.", "input voltage. This causes excessive current.\"", "A complete short in the primary is like shorting the input voltage. This causes excessive current flow. This causes excessive current flow."], "jumps": []}, {"id": "P1210", "text": ["If the input voltage is not protected by a fuse or circuit breaker,\nthere will be component damage.", "If the input voltage is not protected by a fuse or circuit breaker, there will be component damage. ........."], "jumps": []}, {"id": "P1220", "text": ["Complete shorts in the secondary eliminate the output voltage.\nThere are no secondary turns to develop an induced voltage.", "Complete shorts in the secondary eliminate the output voltage. There are no secondary turns to develop an induced voltage. .............."], "jumps": []}, {"id": "P1230", "text": ["Shorted secondary windings cause excessive primary current.\nThe transformer does not operate properly and will begin to\nheat up.", "Shorted secondary windings cause excessive primary current. The transformer does not operate properly and will begin to heat up. .................................."], "jumps": []}, {"id": "P1240", "text": ["In this transformer, only the top secondary has no output.  The\noutput voltage of the bottom secondary is not affected.", "In this transformer, only the top secondary has no output. The output voltage of the bottom secondary is not affected. ............."], "jumps": []}, {"id": "P1250", "text": ["In this center tapped transformer, a short effects two of the\nthree output voltages.", "In this center tapped transformer, a short effects two of the three output voltages. ..............."], "jumps": []}, {"id": "P1260", "text": ["A partial short in the primary of a transformer _______", "A partial short in the primary of a transformer _______...."], "jumps": []}, {"id": "P1261", "text": [], "jumps": []}, {"id": "P1262", "text": ["The primary has less turns due to the short. The turns ratio\nincreases which does not reduce the secondary voltage.", "The primary has less turns due to the short. The turns ratio increases which does not reduce the secondary voltage. ................", "Ns Ns = or Es = Ep x Np", "10 Ns = or Es = Ep x Np"], "jumps": []}, {"id": "P1263", "text": ["A short reduces the number of turns. This changes the turns\nratio which will change the secondary voltage.", "A short reduces the number of turns. This changes the turns ratio which will change the secondary voltage. ...........", "Ns Ns = or Es = Ep x Np", "Ep Ns = or Es = Ep x Np"], "jumps": []}, {"id": "P1270", "text": ["A complete short in the secondary of a transformer _______", "A complete short in the secondary of a transformer _______."], "jumps": []}, {"id": "P1271", "text": [], "jumps": []}, {"id": "P1272", "text": ["A complete short reduces the number of turns in the secondary\nto 0.  This will not increase secondary voltage.", "A complete short reduces the number of turns in the secondary to 0. This will not increase secondary voltage. ........"], "jumps": []}, {"id": "P1273", "text": ["A complete short reduces the number of turns in the secondary\nto 0.  The secondary voltage does decrease, however it is\ndecreased to 0 V or eliminated.", "A complete short reduces the number of turns in the secondary to 0. The secondary voltage does decrease, however it is decreased to 0 V or eliminated. ................."], "jumps": []}, {"id": "P1280", "text": ["One note about shorts, any voltage change in a transformer will\nchange current.  A short increases current.  This can cause damage to components.", "One note about shorts, any voltage change in a transformer will change current. A short increases current. This can cause damage to components. damaged when current is increased. ncreases of current.", "Ns Ns = or Es = Ep x Np", "Ep Ns = or Es = Ep x Np", "Is Ns = or Es = Ep x Np"], "jumps": []}, {"id": "P1290", "text": ["As you have seen, opens and shorts cause voltage changes in\ntransformers.", "As you have seen, opens and shorts cause voltage changes in transformers. ................."], "jumps": ["PZ"]}, {"id": "P1300", "text": ["Therefore, voltage measurements will quickly determine if a\ntransformer is operating normally.", "Therefore, voltage measurements will quickly determine if a transformer is operating normally. ................."], "jumps": []}, {"id": "P1310", "text": ["If the voltages measured are incorrect, resistance measurements\nwill determine the fault.", "If the voltages measured are incorrect, resistance measurements will determine the fault. tttttttttttt"], "jumps": []}, {"id": "P1320", "text": ["Any open is identified by reading infinity on the multimeter."], "jumps": []}, {"id": "P1330", "text": ["Any complete short is identified by a 0 ohm reading on the\nmultimeter.", "Any complete short is identified by a 0 ohm reading on the multimeter. .................."], "jumps": []}, {"id": "P1340", "text": ["Partial shorts are harder to locate.", "Partial shorts are harder to locate. ....................."], "jumps": []}, {"id": "P1350", "text": ["The decrease in winding resistance due to a partial short might\nnot be detected by resistance measurements.", "The decrease in winding resistance due to a partial short might not be detected by resistance measurements. ........."], "jumps": []}, {"id": "P1360", "text": ["A partial short is the fault if an open or complete short is not\nmeasured and incorrect voltage measurements are obtained.", "A partial short is the fault if an open or complete short is not measured and incorrect voltage measurements are obtained. ............"], "jumps": []}, {"id": "P1370", "text": ["Remember, voltage measurements will quickly determine if a\ntransformer is operating normally.  Resistance measurements will\ndetermine the fault.", "Remember, voltage measurements will quickly determine if a transformer is operating normally. Resistance measurements will determine the fault. ..............................."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on TRANSFORMER FAULTS.", "This completes the information on TRANSFORMER FAULTS. ...."], "jumps": []}, {"id": "P1920", "text": ["1.  Open windings in transformers prevent current flow.", "1. Open windings in transformers prevent current flow.", "1. Open windings in transformers prevent current.", "1. Open windings in transformers prevent current flow. Open windings in transformers prevent current flow."], "jumps": []}, {"id": "P1930", "text": ["2.  Opens in transformers cause no secondary output voltage.", "2. Opens in transformers cause no secondary output voltage."], "jumps": []}, {"id": "P1940", "text": ["3.  Shorted windings in transformers provide a low resistance\n     path for current.", "3. Shorted windings in transformers provide a low resistance path for current."], "jumps": []}, {"id": "P1950", "text": ["4.  Partial shorts in transformers change secondary voltages.\n     Shorts in the primary increase secondary voltage.  Shorts in\n     the secondary decrease secondary voltage.", "4. Partial shorts in transformers change secondary voltages. Shorts in the primary increase secondary voltage. Shorts in the secondary decrease secondary voltage. ........................", "Ns Ns = or Es = Ep x Np"], "jumps": []}, {"id": "P1960", "text": ["5.  Complete shorts in the primary short out the input voltage.\n     Complete shorts in the secondary eliminate secondary                    voltage.", "5. Complete shorts in the primary short out the input voltage. Complete shorts in the secondary eliminate secondary voltage."], "jumps": []}, {"id": "P1970", "text": ["6.  Voltage measurements quickly determine if a transformer is\n       operating normally.", "6. Voltage measurements quickly determine if a transformer is operating normally. ........"], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": []}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["The purpose of this experiment is to demonstrate troubleshooting  transformers.", "The purpose of this experiment is to demonstrate troubleshooting transformers."], "jumps": []}, {"id": "P2040", "text": ["Pick up the PC130-21 card.  This card is used to demonstrate       \ntransformer faults.", "Pick up the PC130-21 card. This card is used to demonstrate transformer faults."], "jumps": []}, {"id": "P2050", "text": ["Compare the card with the schematic shown."], "jumps": []}, {"id": "P2060", "text": ["Notice there are four transformers mounted on the card.", "Notice there are four transformers mounted on the card. }"], "jumps": []}, {"id": "P2070", "text": ["In this experiment you will use T3. Notice that T3 is a center tapped transformer. Let's start the experiment."], "jumps": []}, {"id": "P2080", "text": ["1. Set the test console controls to their initial control settings."], "jumps": []}, {"id": "P2090", "text": ["2. Carefully plug PC130-21 into the test console PC1 position.", "2. Carefully plug PC130-21 into the test console PC1 position. N. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": []}, {"id": "P2100", "text": ["3.  Turn PC1 AC Power switch to ON.", "3. Turn PC1 AC Power switch to ON. C switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": []}, {"id": "P2110", "text": ["4.  Using a multimeter, measure the AC input voltage to T3 (TP13        to TP14).  \n      What is the measured voltage?", "4. Using a multimeter, measure the AC input voltage to T3 (TP13 to TP14). What is the measured voltage?"], "jumps": ["P2112"]}, {"id": "P2111", "text": [], "jumps": []}, {"id": "P2112", "text": ["Your measurement is incorrect.   If your set up is correct and you \nstill measure the same value, check with your instructor.", "Your measurement is incorrect. If your set up is correct and you still measure the same value, check with your instructor.", "- PC1 AC Power Switch to ON. - Measuring between TP13 and TP14. - Multimeter to measure AC voltage. tage."], "jumps": []}, {"id": "P2113", "text": ["Your measurement is still incorrect.  The AC input voltage is        \napproximately 15 Vrms.  You should have measured between 13.5 and 16.5 Vrms.", "Your measurement is still incorrect. The AC input voltage is approximately 15 Vrms. You should have measured between 13.5 and 16.5 Vrms."], "jumps": []}, {"id": "P2115", "text": ["MEASUREMENT SETUP - PC1 AC Power switch ON. Measuring between TP13 and TP14. Multimeter set to measure AC."], "jumps": []}, {"id": "P2120", "text": ["T3 is approximately a 1:3 step up transformer.  \nWith approximately 15 Vrms applied, what is the output voltage?", "T3 is approximately a 1:3 step up transformer. With approximately 15 Vrms applied, what is the output voltage?"], "jumps": []}, {"id": "P2121", "text": [], "jumps": []}, {"id": "P2122", "text": ["5 Vrms is the output voltage if the transformer is a 3:1 step down."], "jumps": []}, {"id": "P2123", "text": ["15 Vrms is the output voltage if the transformer is a 1:1."], "jumps": []}, {"id": "P2130", "text": ["5.  Using a multimeter, measure the output voltage (TP15 to                  TP17).   Note that your measurement is approximately\n      45 Vrms.  The transformer is operating normally.", "5. Using a multimeter, measure the output voltage (TP15 to TP17). Note that your measurement is approximately 45 Vrms. The transformer is operating normally."], "jumps": []}, {"id": "P2135", "text": ["MEASUREMENT SETUP - PC1 AC Power Switch ON. To measure between TP15 and TP17. Multimeter set to measure AC."], "jumps": []}, {"id": "P2140", "text": ["6.  Using a multimeter, measure the voltage from TP15 to TP16           and  from TP16 to TP17.   Note that your measurements are            approximately half of the output voltage.  T3 is a center                    tapped transformer.", "6. Using a multimeter, measure the voltage from TP15 to TP16 and from TP16 to TP17. Note that your measurements are approximately half of the output voltage. T3 is a center tapped transformer.", "MEASUREMENT SETUP - PC1 AC Power Switch ON. Measure between TP15 to TP16 and TP16 to TP17. Multimeter set to measure AC."], "jumps": []}, {"id": "P2150", "text": ["7.  Turn PC1 AC Power switch to OFF.  You will now measure               the resistances of the primary and the secondary.", "7. Turn PC1 AC Power switch to OFF. You will now measure the resistances of the primary and the secondary."], "jumps": []}, {"id": "P2160", "text": ["8.  Measure the resistance of the primary (TP13 to TP14).              \n9.  Measure the resistance of the secondary (TP15 to TP17).  You       should measure approximately 230 W for the primary and\n     2.1 kW for  the secondary.", "MEASUREMENT SETUP -  PC1 AC power switch OFF.                      Primary measurement between TP13 and TP14.      \nSecondary measurement between TP15 and TP17.", "8. Measure the resistance of the primary (TP13 to TP14). 9. Measure the resistance of the secondary (TP15 to TP17). You should measure approximately 230 W for the primary and 2.1 kW for the secondary.", "MEASUREMENT SETUP - PC1 AC power switch OFF. Primary measurement between TP13 and TP14. Secondary measurement between TP15 and TP17."], "jumps": []}, {"id": "P2170", "text": ["10.  Measure the resistance from TP15 to TP16 and from TP16 to          TP17.  Note that the sum of the two resistances equals the              resistance between TP15 and TP17.", "10. Measure the resistance from TP15 to TP16 and from TP16 to TP17. Note that the sum of the two resistances equals the resistance between TP15 and TP17.", "MEASUREMENT SETUP - PC1 AC power switch OFF. Measure resistance between TP15 to TP16. Measure resistance between TP16 to TP17."], "jumps": []}, {"id": "P2180", "text": ["11.  Disconnect the multimeter and turn PC1 AC Power ON.  Now          that you  know the values of T3 when operating normally,               the computer will insert a fault.", "11. Disconnect the multimeter and turn PC1 AC Power ON. Now that you know the values of T3 when operating normally, the computer will insert a fault."], "jumps": []}, {"id": "P2190", "text": ["1.  Using a multimeter set to measure AC voltages, measure the          input  and output voltages of T3 (TP13 through TP17).", "1. Using a multimeter set to measure AC voltages, measure the input and output voltages of T3 (TP13 through TP17)."], "jumps": []}, {"id": "P2195", "text": ["MEASUREMENT SETUP - PC1 AC Power switch ON. Multimeter set to measure AC. Measure TP13 through TP17."], "jumps": []}, {"id": "P2200", "text": ["Which winding, if any, has an incorrect voltage reading."], "jumps": []}, {"id": "P2201", "text": [], "jumps": []}, {"id": "P2202", "text": ["Measure the secondary wi 1 AC Power switch to ON. The computer will now replace T3. .............................."], "jumps": []}, {"id": "P2270", "text": ["Measure the input and output voltages to verify normal operation."], "jumps": []}, {"id": "P2280", "text": ["Is T3 operating normally?", "Is T3 operating normally? typed.........................."], "jumps": []}, {"id": "P2281", "text": [], "jumps": []}, {"id": "P2282", "text": ["Make sure you are measuring the correct test points for T3.  You   should have measured an incorrect output voltage.", "Make sure you are measuring the correct test points for T3. You should have measured an incorrect output voltage."], "jumps": []}, {"id": "P2290", "text": ["The computer must have replaced T3 with a defective spare, the   output voltage is incorrect!  This can happen to you, that's why you always check a circuit for normal operation after any repair.", "The computer must have replaced T3 with a defective spare, the output voltage is incorrect! This can happen to you, that's why you always check a circuit for normal operation after any repair."], "jumps": []}, {"id": "P2300", "text": ["5. Turn PC1 AC Power OFF.                                 \n6. Measure the resistances of the secondary.", "5. Turn PC1 AC Power OFF. 6. Measure the resistances of the secondary."], "jumps": []}, {"id": "P2310", "text": ["What type of fault is in the new T3?", "What type of fault is in the new T3? ..................."], "jumps": []}, {"id": "P2311", "text": [], "jumps": []}, {"id": "P2312", "text": ["You did not measure the correct output voltage, there must be a  fault.", "You did not measure the correct output voltage, there must be a fault."], "jumps": []}, {"id": "P2313", "text": ["Remember, an open measures infinity and a short measures 0 W. Check your measurement between TP16 and TP17."], "jumps": []}, {"id": "P2320", "text": ["Notice that the resistance measurements were correct across the top half of the center tapped secondary."], "jumps": []}, {"id": " rough TP17)."], "jumps": []}, {"id": "P13220", "text": ["From your resistance reading, what is the probable fault?", "From your resistance reading, what is the probable fault? ."], "jumps": []}, {"id": "P13221", "text": [], "jumps": []}, {"id": "P13222", "text": ["Remember, an open measures infinity on a multimeter and a short measures 0 W.  Check your measurement between TP15 and TP17.", "Remember, an open measures infinity on a multimeter and a short measures 0 W. Check your measurement between TP15 and TP17."], "jumps": []}, {"id": "P13230", "text": ["Notice your resistance measurements indicate an open between TP15 and TP17, and between TP15 and TP16.   Resistance between TP16 and TP17 measured normal.", "Notice your resistance measurements indicate an open between TP15 and TP17, and between TP15 and TP16. Resistance between TP16 and TP17 measured normal."], "jumps": []}, {"id": "P13240", "text": ["The open is in the upper part of the secondary."], "jumps": []}, {"id": "P13250", "text": ["Also notice that you did not measure exactly 0 V across the open.  This is due to the induced voltage in a center tapped transformer.", "Also notice that you did not measure exactly 0 V across the open. This is due to the induced voltage in a center tapped transformer."], "jumps": []}, {"id": "P13260", "text": ["4.  Remove the multimeter.                                   \n5.  Press Enter to set:  PC1 AC Power Switch - ON             \n     The computer will replace T3.", "4. Remove the multimeter. 5. Press Enter to set: PC1 AC Power Switch - ON The computer will replace T3."], "jumps": []}, {"id": "P13270", "text": ["Measure the input and output voltages to verify normal operation."], "jumps": []}, {"id": "P13280", "text": ["Is T3 operating normally?", "Is T3 operating normally? typed.........................."], "jumps": []}, {"id": "P13281", "text": [], "jumps": []}, {"id": "P13282", "text": ["Make sure you are measuring the correct test points for T3.  You   should have measured an incorrect output voltage.", "Make sure you are measuring the correct test points for T3. You should have measured an incorrect output voltage."], "jumps": []}, {"id": "P13290", "text": ["The computer must have replaced T3 with a defective spare, the   output voltage is incorrect!  This can happen to you, that's why you always check a circuit for normal operation after any repair.", "The computer must have replaced T3 with a defective spare, the output voltage is incorrect! This can happen to you, that's why you always check a circuit for normal operation after any repair."], "jumps": []}, {"id": "P13300", "text": ["6.  Press Enter to Set: PC1 AC Power Switch - OFF", "6. Press Enter to Set: PC1 AC Power Switch - OFF"], "jumps": []}, {"id": "P13304", "text": ["7.  Measure the resistances of the secondary.", "7. Measure the resistances of the secondary."], "jumps": []}, {"id": "P13310", "text": ["What type of fault is in the new T3?", "What type of fault is in the new T3? ..................."], "jumps": []}, {"id": "P13311", "text": [], "jumps": []}, {"id": "P13312", "text": ["You did not measure the correct output voltage, there must be a  fault.", "You did not measure the correct output voltage, there must be a fault."], "jumps": []}, {"id": "P13313", "text": ["Remember, an open measures infinity and a short measures 0 W. Check your measurement between TP16 and TP17."], "jumps": []}, {"id": "P13320", "text": ["Notice that the resistance measurements were correct across the top half of the center tapped secondary."], "jumps": []}, {"id": "P13330", "text": ["The bottom half of the center tapped secondary is shorted."], "jumps": []}, {"id": "P13340", "text": ["The computer will now replace T3 again.", "The computer will now replace T3 again. ."], "jumps": []}, {"id": "P13350", "text": ["8.  Remove the multimeter.                                       \n9.  Press Enter to Set: PC1 AC Power Switch - ON", "8. Remove the multimeter. 9. Press Enter to Set: PC1 AC P let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
