will learn about the operation of a zener diode regulator."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Regulator circuits provide a constant output voltage even when the input voltage varies or when the output current varies."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Circuit operation is based on changing the effective resistance of the circuit when input and output conditions vary."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Let's begin the lesson on ZENER DIODE REGULATOR OPERATION..................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": ["P430"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["This is a typical zener diode regulator circuit.", "This is a typical zener diode regulator circuit............"], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Q1 is the component that automatically changes resistance to maintain a constant Vout.", "Q1 is the component that automatically changes resistance to maintain a constant Vout. Notice that Q1 is in the common base configuration."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The output voltage of a rectifier filter is applied to the collector of Q1."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The load is connected to the emitter of Q1."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["Current flow is from ground, through RL and Q1, to the rectifier filter.", "Current flow is from the rectifier filter to Q1, RL, and then to ground."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["Since RL and Q1 are in series, this zener diode regulator is a series voltage regulator."], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["R1 and D1 form a voltage divider that applies base bias to Q1.  Collector bias is obtained directly from the rectifier filter.", "R1 and D1 form a voltage divider that applies base bias to Q1. Collector bias is obtained directly from the rectifier filter."], "jumps": ["P1090", "P1020"]}, {"id": "P1090", "text": ["The emitter voltage is developed by the action of the transistor.  Ee = Eb - .6V", "The emitter voltage is developed by the action of the transistor. Ee = Eb - .6V"], "jumps": ["P1100", "P1020"]}, {"id": "P1100", "text": ["The operation of this series voltage regulator is based on two principles.  \n                               * Operation of zener diodes  \n                               *  Voltage drop across Q1", "The operation of this series voltage regulator is based on two principles. * Operation of zener diodes * Voltage drop across Q1"], "jumps": ["P1110", "P1020"]}, {"id": "P1110", "text": ["Let's investigate the operation of D1 first.  \n                               * Operation of zener diodes  \n                               *  Voltage drop across Q1", "Let's investigate the operation of D1 first. * Operation of zener diodes * Voltage drop across Q111"], "jumps": ["P1120", "P1020"]}, {"id": "P1120", "text": ["Recall that a zener diode maintains a constant voltage drop as long as it is operating in the breakdown region."], "jumps": ["P1130", "P1020"]}, {"id": "P1130", "text": ["For example, if the zener voltage for D1 is 6 V and if 8 V is applied, D1 conducts reverse current flow so that R1 drops 2 V, leaving 6 V on the base of Q1.", "For example, if the zener voltage for D1 is 6 V and if 8 V is applied, D1 conducts reverse current flow so that R1 drops 2 V, leaving 6 V on the base of Q1.'"], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["If the input voltage increases to 9 V, D1 conducts more so that R1 drops 3 V, leaving 6 V on the base of Q1."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["If the input voltage decreases to 7 V, D1 conducts less so that R1 drops 1 V, leaving 6 V on the base of Q1."], "jumps": ["P1160", "P1120"]}, {"id": "P1160", "text": ["In other words, the base bias for Q1 is always 6 V as long as the DC input voltage is 6 V or greater."], "jumps": ["P1170", "P1120"]}, {"id": "P1170", "text": ["Now, let's investigate the action of Q1.  \n                               * Operation of zener diodes  \n                               *  Voltage drop across Q1", "Now, let's investigate the action of Q1. * Operation of zener diodes * Voltage drop across Q1"], "jumps": ["P1180", "P1120"]}, {"id": "P1180", "text": ["With a base voltage of + 6 V, the emitter is placed at + 5.4 V."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["If the input voltage is + 8V, the action of Q1 drops 2.6 V from the collector to emitter."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["If the input voltage increases to 9 V, Q1 must drop 3.6 V.  In effect, Q1 collector to emitter resistance increased.", "If the input voltage increases to 9 V, Q1 must drop 3.6 V. In effect, Q1 collector to emitter resistance increased."], "jumps": ["P1210", "P1180"]}, {"id": "P1210", "text": ["If the input voltage decreases to 7 V, Q1 must drop 1.6 V.  In effect, Q1 collector to emitter resistance decreased.", "If the input voltage decreases to 7 V, Q1 must drop 1.6 V. In effect, Q1 collector to emitter resistance decreased."], "jumps": ["P1220", "P1180"]}, {"id": "P1220", "text": ["The result is that the output voltage, voltage on the emitter is held constant even if the input voltage varies."], "jumps": ["P1230", "P1180"]}, {"id": "P1230", "text": ["Also, if the load current varies (due to a change in load resistance) the output voltage is held constant by the action of Q1.."], "jumps": ["P1240", "P1180"]}, {"id": "P1240", "text": ["Again, the voltage on the emitter, which is the output voltage, is established by the action of Q1."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["If RL decreases, it will cause Vout (Ee) to also decrease.  This will cause load current to increase.", "If RL decreases, it will cause Vout (Ee) to also decrease. This will cause load current to increase. to increase because the load drops more voltage."], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["When Ee increases, the base to emitter PN junction forward bias decreases, increasing collector to emitter resistance. This causes Q1's collector to emitter current to decrease.", "When Ee increases, the base to emitter PN junction forward bias decreases, increasing emitter to collector resistance. This causes Q1's emitter to collector current to decrease.", "When Ee increases, the base to emitter PN junction forward bias decreases, increasing emitter to collector resistance. This causes Q1's emitter to collector current to decrease..."], "jumps": ["P1270", "P1230"]}, {"id": "P1270", "text": ["By decreasing Q1's resistance, Q1 drops less voltage (Vce), bringing Vout back up to its original output of 5.4 V."], "jumps": ["P1280", "P1230"]}, {"id": "P1280", "text": ["If RL increases, this will cause Vout to also increase. This will cause load current to decrease.output of 5.4 V."], "jumps": ["P1290", "P1230"]}, {"id": "P1290", "text": ["When Ee increases, the base to emitter PN junction forward bias decreases, increasing collector to emitter resistance. This causes Q1's collector to emitter current to decrease.", "When Ee increases, the base to emitter PN junction forward bias decreases, increasing emitter to collector resistance. This causes Q1's emitter to collector current to decrease."], "jumps": ["P1300", "P1230"]}, {"id": "P1300", "text": ["By increasing Q1's resistance, Q1 drops more voltage (Vce), taking Eout back down to its original output of 5.4 V.", "\"By increasing Q1's resistance, Q1 drops more voltage (Vce), taking Eout"], "jumps": ["P1310", "P1230"]}, {"id": "P1310", "text": ["The result is that the output voltage, (voltage on the emitter), is held constant even if the output current varies."], "jumps": ["P1320", "P1230"]}, {"id": "P1320", "text": ["Putting the circuit together, D1 holds the base of Q1 at Vz and the output is held at Vz minus .6 V under varying conditions."], "jumps": ["P1325", "P1230"]}, {"id": "P1325", "text": ["A negative voltage divider is constructed by reversing the diode and using a PNP transistor."], "jumps": ["P1330", "P1320"]}, {"id": "P1330", "text": ["Which component effectively changes resistance to maintain a constant Vout in a zener diode regulator?"], "jumps": ["P1325"]}, {"id": "P1331", "text": [], "jumps": []}, {"id": "P1332", "text": ["The load resistance may change value, but it does not keep Vout constant.  A changing RL would attempt to change Vout.", "The load resistance may change value, but it does not keep Vout constant. A changing RL would attempt to change Vout."], "jumps": []}, {"id": "P1333", "text": ["D1 does effectively change resistance.  However, its action sets the  base voltage for Q1; D1 does not maintain Vout.", "D1 does effectively change resistance. However, its action sets the base voltage for Q1; D1 does not maintain Vout."], "jumps": []}, {"id": "P1340", "text": ["Which component sets the output voltage in a zener diode regulator?"], "jumps": ["P1330"]}, {"id": "P1341", "text": [], "jumps": []}, {"id": "P1342", "text": ["Q1 maintains the output voltage by effectively changing the emitter to collector resistance.  It does not set the output voltage.", "Q1 maintains the output voltage by effectively changing the emitter to collector resistance. It does not set the output voltage.", "Q1 maintains the output voltage by effectively changing the collector to emitter resistance. It does not set the output voltage."], "jumps": []}, {"id": "P1343", "text": ["RL does not set the output voltage; it receives power.", "RL does not set the output voltage; it receives power......"], "jumps": []}, {"id": "P1350", "text": ["In this zener diode regulator, if the input voltage increases, the voltage across Q1 _______"], "jumps": ["P1340"]}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1352", "text": ["If the voltage across the emitter and collector of Q1 decreased and the applied voltage increases, Eout would not remain constant.", "If the voltage across the collector to emitter of Q1 decreased and the applied voltage increases, Eout would not remain constant."], "jumps": []}, {"id": "P1353", "text": ["If the applied voltage increased, the voltage across the emitter and collector of Q1 cannot decrease to maintain a constant Eout, Eout would increase.", "If the applied voltage increased, the voltage across the collector to emitter of Q1 cannot decrease to maintain a constant Eout, Eout would increase."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on ZENER DIODE REGULATOR CIRCUIT."], "jumps": ["P1001", "P1350"]}, {"id": "P1920", "text": ["1.  This is a typical zener diode series voltage regulator.", "1. This is a typical zener diode series voltage regulator."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  D1 sets the output voltage."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Q1 maintains the output voltage."], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["4.  Q1 effectively changes resistance between its emitter and collector to maintain the emitter voltage at a constant level.", "4. Q1 effectively changes resistance between its collector and emitter to maintain the emitter voltage at a constant level.", "4. Q1 effectively changes resistance between its emitter and collector to maintain the emitter voltage at a constant level.", "4. Q1 effectively changes resistance between its emitter and collector to maintain the emitter voltage at a constant level. collector to maintain the emitter voltage at a constant level."], "jumps": ["P1960", "P1920"]}, {"id": "P1960", "text": ["5.  Voltage changes in the output of the rectifier filter and current       changes drawn by the load do not affect Vout.", "5. Voltage changes in the output of the rectifier filter and current changes drawn by the load do not affect Vout."], "jumps": ["P1999", "P1920"]}, {"id": "P1999", "text": ["You have completed the Summary. \nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1960"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["The purpose of this experiment is to demonstrate the normal operation of a zener diode regulator."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["In this experiment, you will use two PC cards.  One is a rectifier and the other is the zener diode regulator.", "In this experiment, you will use two PC cards. One is a rectifier and the other is the zener diode regulator."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["Pick up the PC130-23 card and compare it to the schematic shown.  This card is used as the rectifier and is placed in the PC1 position.", "Pick up the PC130-23 card and compare it to the schematic shown. This card is used as the rectifier and is placed in the PC1 position."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["Pick up the PC130-25 card.  This card is used to demonstrate zener diode regulator circuits and is placed in the PC2 position.", "Pick up the PC130-25 card. This card is used to demonstrate zener diode regulator circuits and is placed in the PC2 position."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["Compare the card with the schematic shown."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["Notice Q1 on the card and schematic.  Q1 is a power transistor.", "Notice Q1 on the card and schematic. Q1 is a power transistor."], "jumps": ["P2090", "P2060"]}, {"id": "P2090", "text": ["Since the transistor is in series with the load, total load current flows through Q1."], "jumps": ["P2100", "P2060"]}, {"id": "P2100", "text": ["Q1 is large so that more heat can be dissipated.  Power transistors handle more current than regular transistors.", "Q1 is large so that more heat can be dissipated. Power transistors handle more current than regular transistors."], "jumps": ["P2110", "P2060"]}, {"id": "P2110", "text": ["D1 sets the output voltage.  Vz for the diode on the card is 8.2 V.", "D1 sets the output voltage. Vz for the diode on the card is 8.2 V."], "jumps": ["P2120", "P2060"]}, {"id": "P2120", "text": ["Notice that D1 is small.  Remember, D1 is in the base circuit of Q1, where current flow is usually in the micro amps.", "Notice that D1 is small. Remember, D1 is in the base circuit of Q1, where current flow is usually in the micro amps."], "jumps": ["P2130", "P2060"]}, {"id": "P2130", "text": ["Resistors R2, R3 and R4 along with switches S1, S2, S3 select the value of the load that is connected to the emitter of Q1."], "jumps": ["P2140", "P2060"]}, {"id": "P2140", "text": ["S1 can be used to insert an ammeter to measure load current.  Let's start the experiment.", "S1 can be used to insert an ammeter to measure load current. Let's start the experiment.ment.."], "jumps": ["P2150", "P2060"]}, {"id": "P2150", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2060"]}, {"id": "P2160", "text": ["2.  Carefully plug PC130-23 into the Test Console PC1 position.", "2. Carefully plug PC130-23 into the Test Console PC1 position. Carefully plug PC130-25 into the Test Console PC2 position."], "jumps": ["P2150"]}, {"id": "P2162", "text": ["Ensure the two jumpers are placed vertically between the top and middle jumpers located in the upper left hand corner of the PC130-23 card. Jumpers on the PC130-23 card may not be available, if so, disregard graphic and caution below.", "Ensure the two jumpers are placed vertically between the top and middle jumpers located in the upper left hand corner of the PC130-23 card. Jumpers on the PC130-23 card may not be available, if so, disregard graphic and caution below...", "Jumpers that have not been installed correctly on the PC130-23 card may cause damage to the board circuitry. Do not connect the oscilloscope ground to pins G or H......................."], "jumps": ["P2160"]}, {"id": "P2164", "text": ["3.  Carefully plug PC130-25 into the Test Console PC2 position.", "3. Carefully plug PC130-25 into the Test Console PC2 position. Carefully plug PC130-25 into the Test Console PC2 position."], "jumps": ["P2162"]}, {"id": "P2170", "text": ["4.  On PC130-23:  A.  Place S1 and S2 to IN.  \n                                 B.  Place S3 to the right.  \n                                 C.  Place S4, S5 and S6 to OUT.  \n     This sets up the rectifier for full wave and allows the output to       be connected to the PC130-25 card.", "4. On PC130-23: A. Place S1 and S2 to IN. B. Place S3 to the right. C. Place S4, S5 and S6 to OUT. This sets up the rectifier for full wave and allows the output to be connected to the PC130-25 card."], "jumps": ["P2164", "P2175"]}, {"id": "P2175", "text": ["MEASUREMENT SETUP - Carefully place S1 and S2 to IN, S3 to RIGHT and S4, S5 and S6 to OUT."], "jumps": []}, {"id": "P2180", "text": ["5.  On PC130-25 place S1, S2 and S3 to OUT.  S1 OUT                            disconnects the load from the emitter of Q1.", "5. On PC130-25 place S1, S2 and S3 to OUT. S1 OUT disconnects the load from the emitter of Q1."], "jumps": ["P2190", "P2170", "P2185"]}, {"id": "P2185", "text": ["MEASUREMENT SETUP - Carefully place S1 through S3 in the OUT position."], "jumps": []}, {"id": "P2190", "text": ["6.  Turn PC1 AC power switch ON.", "6. Turn PC1 AC power switch ON.trol to 12. 130A - Set the PC1 DC switch to ON. 130A - Set the PC2 AC switch to ON. 130A - Set the PC3 Speaker switch to ON.."], "jumps": ["P2180"]}, {"id": "P2210", "text": ["7.  Using a multimeter, measure the DC voltage at PC130-25 TP4        with respect to ground (input to regulator card from the                   rectifier card).  \n     What is the measured voltage?", "7. Using a multimeter, measure the DC voltage  time for C3 to discharge.", "This is due to the size of C3 on PC130-23. It takes a long time for C3 to discharge."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["Power supply filter capacitors may retain a charge long after power is removed from the circuit, especially high voltage power supplies.  The power supply for a TV picture tube is a good example.", "Power supply filter capacitors may retain a charge long after power is removed from the circuit, especially high voltage power supplies. The power supply for a TV picture tube is a good example.example.."], "jumps": ["P2410", "P2390"]}, {"id": "P2410", "text": ["7.  Turn PC1 AC power ON and remove probes.  Now, let's vary           the output current.   This is done by switching in different size       load resistors on PC130-25.", "7. Turn PC1 AC power ON and remove probes. Now, let's vary the output current. This is done by switching in different size load resistors on PC130-25."], "jumps": ["P2400"]}, {"id": "P2420", "text": ["1.  Set up the oscilloscope for CH1 display of DC signals.  \n2.  Zero the trace.", "1. Set up the oscilloscope for CH1 display of DC signals. 2. Zero the trace.", "Trigger Coupling - DC Trigger Source - CH1 Trigger Slope - + Display - CH1 DC/GND/AC - DC Volt/Div - 555"], "jumps": ["P2430", "P2410", "P2425"]}, {"id": "P2425", "text": ["MEASUREMENT SETUP Trigger Slope - + CH1 Volts/Div - 5 Trigger coupling - DC CH1 AC/GND/DC - DC Trigger source - CH1 Display Mode - CH1", "K HK,,_,_K',E,,,,',KEZ;;K98O9[=9NN99,,,,E", "T a:Tsy : 95a ss a5T 55s5m5 s55t T-|5s- ss y -VFs5--FFmmFFs--tt -| -symVsGF--s5-", "C[R//LRNLQ1/CLR5QTTF\\f[]?1QQ2T;A;;;E,AE;KEK9 7750Q=H=T=TTU9a(&PT5", "K''K''_,'KE,;UA;;U;;;KKE/JK,EK;,K}=EE LOE", "} V@*1[\"[\"1[$@1D7=EEKEE;EEU;KK_E',K____'", "1C*;;a)?U9;U W;;;,E;E;999TH=5mPHH750: 9sOUUK", "@N17;)LUK(QEAE 1;AU;EEE;T9TH=0=T=:=HTPa;;EEEKK", ",K;A'K57VO;EEOa2OK)1U; VKE,'K__KKK'KKK'K_,_", ",,,,',E,,,,,,'}K;AAaOUaAaA: 17Aa9A7O &V=E,'''_',''''K,K'KK,,", "a 99a9=}Aaa99a : "P13020", "text": ["The purpose of this experiment is to demonstrate the normal operation of a zener diode regulator."], "jumps": ["P13040", "P2001"]}, {"id": "P13040", "text": ["In this experiment, you will use two PC cards.  One is a rectifier and the other is the zener diode regulator.", "In this experiment, you will use two PC cards. One is a rectifier and the other is the zener diode regulator."], "jumps": ["P13050", "P13020"]}, {"id": "P13050", "text": ["Pick up the PC130-23 card and compare it to the schematic shown.  This card is used as the rectifier and is placed in the PC1 position.", "Pick up the PC130-23 card and compare it to the schematic shown. This card is used as the rectifier and is placed in the PC1 position."], "jumps": ["P13060", "P13040"]}, {"id": "P13060", "text": ["Pick up the PC130-25 card. This card is used to demonstrate zener diode regulator circuits and is placed in the PC2 position."], "jumps": ["P13070", "P13050"]}, {"id": "P13070", "text": ["Compare the card with the schematic shown."], "jumps": ["P13080", "P13060"]}, {"id": "P13080", "text": ["Notice Q1 on the card and schematic.  Q1 is a power transistor.", "Notice Q1 on the card and schematic. Q1 is a power transistor."], "jumps": ["P13090", "P13060"]}, {"id": "P13090", "text": ["Since the transistor is in series with the load, total load current flows through Q1."], "jumps": ["P13100", "P13060"]}, {"id": "P13100", "text": ["Q1 is large so that more heat can be dissipated.  Power transistors handle more current than regular transistors.", "Q1 is large so that more heat can be dissipated. Power transistors handle more current than regular transistors."], "jumps": ["P13110", "P13060"]}, {"id": "P13110", "text": ["D1 sets the output voltage.  Vz for the diode on the card is 8.2 V.", "D1 sets the output voltage. Vz for the diode on the card is 8.2 V."], "jumps": ["P13120", "P13060"]}, {"id": "P13120", "text": ["Notice that D1 is small.  Remember, D1 is in the base circuit of Q1, where current flow is usually in the micro amps.", "Notice that D1 is small. Remember, D1 is in the base circuit of Q1, where current flow is usually in the micro amps."], "jumps": ["P13130", "P13060"]}, {"id": "P13130", "text": ["Resistors R2, R3 and R4 along with switches S1, S2, S3 select the value of the load that is connected to the emitter of Q1."], "jumps": ["P13140", "P13060"]}, {"id": "P13140", "text": ["Also, S1 can be used to insert an ammeter to measure load current.  Let's start the experiment.", "Also, S1 can be used to insert an ammeter to measure load current. Let's start the experiment."], "jumps": ["P13150", "P13060"]}, {"id": "P13150", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13060"]}, {"id": "P13160", "text": ["2.  Carefully plug PC130-23 into the Test Console PC1 position.", "2. Carefully plug PC130-23 into the Test Console PC1 position. Carefully plug PC130-25 into the Test Console PC2 position."], "jumps": []}, {"id": "P13162", "text": ["Ensure the two jumpers are placed vertically between the middle and bottom jumpers located in the upper left hand corner of the PC130-23 card. Jumpers on the PC130-23 card may not be available, if so, contact your instructor.", "Ensure the two jumpers are placed vertically between the middle and bottom jumpers located in the upper left hand corner of the PC130-23 card. Jumpers on the PC130-23 card may not be available, if so, contact your instructor.......................................", "Jumpers that have not been installed correctly on the PC130-23 card may cause damage to the board circuitry. Do not connect the oscilloscope ground to pins G or H......................."], "jumps": []}, {"id": "P13164", "text": ["3.  Carefully plug PC130-25 into the Test Console PC2 position.", "3. Carefully plug PC130-25 into the Test Console PC2 position.3. Carefully plug PC130-25 into the Test Con let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
