<script>
const book = {"title": "9395Z603", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: AIRCRAFT STRUCTURESasdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe the types of materials used in aircraft construction. w Describe the advantages and disadvantages of using metals in aircraft construction. w Describe the advantages and disadvantages of using composites in aircraft construction..........................", "w Describe fuselage shapes, construction, and their effect on aircraft flight. w Describe wing shapes, construction and their effect on aircraft flight. w Describe tail shapes, construction and their effect on aircraft flight................"], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["One of the many jobs an Aviation Maintenance Technician must learn is aircraft structural repair. They must have a thorough understanding of the materials aircraft are made of and how an aircraft's shape and construction determine its flight characteristics..."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Aviation Maintenance Technicians learn to work with aircraft materials to ensure that the aircraft meet the design specifications. To do this they must be able to inspect, service, repair, overhaul, and manufacture aircraft structural components including; fuselages, wings, tail sections, and interiors..."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["This lesson is about the materials and designs used in aircraft construction and how each has evolved over the years."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Let's begin the lesson on AIRCRAFT STRUCTURES............................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The evolution of materials used in aircraft construction has always been about increasing strength while reducing weight. This concept is called the \"Strength to Weight Ratio\". Ideally, aircraft materials need to be strong enough to lift large loads and light enough to efficiently fly.."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Early aircraft were made of wooden frames covered with fabric. Light weight woods, such as spruce or ash, were quite strong and the frame construction kept the design relatively light.", "Fabric was stretched over the frames to enclose the structure. The fabric was then painted with a doping compound to waterproof the material and prevent air from passing through it.", "The wood and fabric design had a good strength to weight ratio, which made it the material of choice for nearly all WW1 aircraft.", "Wood and fabric material did have their problems, however. They were very susceptible to rot, bugs, and tearing. In time of war, the material offered little protection for the pilots, engines, and fuel tanks against enemy bullets and burned quickly when ignited...", "Plywood was also used as a material in aircraft construction. The plywood could be molded into more aerodynamic shapes and were lighter than wood and fabric designs. Plywood, however, suffered from the same problems that wood and fabric encountered...", "Junker D.I is a low wing design with a duralumin exterior. Duralumin is a light, yet strong, metal. The Junkers monoplane was rugid, fast, and agile. 654 kg/834kg Max speed: 185 km/h", "By the end of WW1, Germany began using aluminum for skinning their aircraft. They found that alloying copper, magnesium, and manganese with, the normally weak, aluminum increased the aluminum's strength and did not affect its inherent light weight characteristics...", "JUNKER D. I a low wing design and currugated duralumin skin. Duralumin is a light, yet strong, metal. The Junkers monoplane was rugid, fast, and agile. Weight: 654 kg/834kg Max speed: 185 km/h", "Weight: 654 kg/834kg Max speed: 185 km/h", "Aluminum alloy aircraft structures offer many qualities over wooden designs. Besides a higher strength to weight ratio, aluminum alloys have good conductivity for lightning protection and is much better at protecting pilots and fuel tanks than fabric..."], "jumps": ["P1040", "P1020", "P1050", "P1030", "P1080", "P1100"]}, {"id": "P1100", "text": ["Additionally, aluminum alloys offer good corrosion resistance, are relatively easy to work with, and are basically non-toxic to technicians working with it."], "jumps": ["P1110"]}, {"id": "P1110", "text": ["Constructing or repairing an aluminum alloy structure has become an art form. Technicians learn how to cut, bend, form and rivet aluminum alloy pieces together to form an aircraft.", "For simple aircraft shapes, aluminum alloy materials are easily formed, however, more complex shapes are very time consuming and require special tools to form them."], "jumps": ["P1120", "P1100", "P1130"]}, {"id": "P1130", "text": ["What was the primary construction material used in World War I aircraft?"], "jumps": ["P1100"]}, {"id": "P1131", "text": ["Aluminum Alloys were used after WWI........................", "Concrete was never used in the construction of aircraft...."], "jumps": []}, {"id": "P1140", "text": ["What is one drawback to using aluminum alloys in aircraft construction?", "Difficult to form complex curves and forms"], "jumps": ["P1130"]}, {"id": "P1141", "text": ["Aluminum Alloys offer good corrosion resistance............"], "jumps": []}, {"id": "P1143", "text": ["Aluminum Alloys are basically non-toxic to workers.........", "Today, more and more aircraft manufacturers are using composite materials to construct aircraft and aircraft parts. Composites are materials formed from separate materials in such a way that the final product has characteristics that are completely different from any of the individual materials...", "You can find composites in many of the recreational items you use. Sailboards, ski boats, surfboards, snow boards, and even many car parts are made up of composites.", "Properly designed composite structures have the highest strength to weight ratio of any other aircraft construction material. In fact, most composite materials used in aircraft are as strong as metal and much lighter...", "Common composite materials used in aircraft construction are Kevlar, Carbon, Graphite, and Fiberglass. These materials are woven into mats or fabric and are bonded with epoxy or polyester resins. The cured result is a very strong material...", "The material gets its strength by orienting the mat layers in different directions. Once the material is bonded together, the results are an extremely strong.", "Composite materials can be shaped into smooth, compound curves and are easy to work with once you learn the techniques. Composite materials do not have the corrosion or rot problems that other materials experience and need only a bit of UV protection added when painting to provide an almost deterioration proof structure.....", "Another great advantage of composite materials is their ease of repair when damaged. Dings, cracks, or holes are quickly patched by filling with composite material matting and resin.", "As fantastic as composite materials are in aircraft construction, they still have a few drawbacks. Currently, composite materials are very expensive and the materials that make up the composites have a limited shelf life until they are bonded together..."], "jumps": ["P1160", "P1140", "P1170", "P1180", "P1190", "P1200", "P1220", "P1230"]}, {"id": "P1230", "text": ["Working with composites can be environmentally challenging because their fibers and dust can cause breathing problems and skin irritation. Technicians working with composites need to be extremely cautious and adhere to all safety practices..."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["Because of their resistance to deterioration, composites do not decompose over time. This is a good thing when the composite structure is usable, but becomes an environmental nuisance when no longer needed..."], "jumps": ["P1220"]}, {"id": "P1250", "text": ["Thin aluminum alloy or composite material sheets are strong but usually are not stiff enough to support a structure on their own. In the early years of construction, manufacturers would glue or bond balsa wood between two pieces of thin aluminum alloy, like a sandwich. is sandwich arrangement provided the strength of the aluminum and the stiffness of a thicker material needed for structural support....."], "jumps": ["P1252", "P1240"]}, {"id": "P1252", "text": ["This sandwich arrangement provided the strength of the aluminum and the stiffness of a thicker material needed for structural support. support.rs of construction, manufacturers would glue or bond balsa wood between two pieces of thin aluminum alloy, like a sandwich. This sandwich arrangement provided the strength of the aluminum and the stiffness of a thicker material needed for structural support....."], "jumps": ["P1250"]}, {"id": "P1260", "text": ["Today, manufacturers are using foam material between thin sheets of composites, such as Kevlar, in all phases of aircraft construction.", "High performance aircraft get even more strength for their weight by utilizing a honeycomb structure as the middle sandwich layer. The honeycomb can be made very thick, while still maintaining its light weight characteristics..."], "jumps": ["P1270", "P1250", "P1280"]}, {"id": "P1280", "text": ["The last material that we will cover is plastics. Plastics are used in many areas of the aircraft including interior panels, windshields, windows, canopies, instrument panels, seat parts, and a number of other areas..."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["Plastics offer great strength, flexibility, light weight characteristics, and accept color in the manufacturing process so you never have to paint them."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["Transparent plastics are used in wind screens and canopies because of their light weight, flexibility, and resistance to shattering.", "Plastics are easy to work with, however, they tend to get scratched or crazed more easily than glass. Scratched plastics can be repaired but it is a long and tedious process of sanding with finer and finer grades of sandpaper until the area is clear again...", "Whether made of wood, metal, or composites, an Aviation Maintenance Technician learns to repair a variety of aircraft structural materials to keep the customers aircraft flying safely."], "jumps": ["P1310", "P1280", "P1300"]}, {"id": "P1340", "text": ["Composites are strong because the layers of fiber materials are laid up in many directions during the manufacturing process?"], "jumps": ["P1320"]}, {"id": "P1341", "text": ["The woven fiber materials are laid in various directions during the bonding process to add incredible strength to the finished composite material."], "jumps": []}, {"id": "P1350", "text": ["What material is used in the construction of high performance aircraft to add stiffness to composite materials?"], "jumps": ["P1340"]}, {"id": "P1351", "text": ["Honeycomb provides the highest strength to weight ratio in sandwich material."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on AIRCRAFT MATERIALS......."], "jumps": ["P1001", "P1350"]}, {"id": "P1920", "text": ["1. Aircraft materials are designed to provide the highest strength to weight ration possible. As aircraft materials evolved, the strength to weight ratio increased."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. Early aircraft were made of wood and fabric materials. These materials provided the strength and light weight characteristics required by World War 1 biplanes. Plywood molded structures soon replaced the wood and fabric...", "3. Near the end of WW1, Germany discovered that alloying copper, magnesium, and manganese to aluminum produced a very strong aluminum alloy. This process is still used today to produce aircraft aluminum alloy materials.", "4. Aluminum alloy material is strong, easy to work with, and resists corrosion or rot. Aluminum alloys are not easy to form into complex shapes or curves needed in today's high performance aircraft..", "5. Today, more and more aircraft manufacturers are using composite materials to construct aircraft and aircraft parts. Composites are materials formed from separate materials in such a way that the final product has characteristics that are completely different from any of the individual materials.", "6. Composite materials offer the greatest strength to weight ration of all aircraft construction materials. To add stiffness to composite materials, a core is used between composite layers, like a sandwich. Honeycomb core materials, used in high performance aircraft, provide the most stiffness with little added weight."], "jumps": ["P1940", "P1920", "P1950", "P1930", "P1970", "P1999", "P1960"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1970"]}, {"id": "P2001", "text": ["How an aircraft is intended to be used dictates how an aircraft is designed and constructed. Large bulky aircraft are usually used as haulers, while small sleek aircraft are used to go fast. In this section we will explore how aircraft designers use shapes and styles to create aircraft that are suited for a variety of jobs..."], "jumps": ["P2001"]}, {"id": "P2030", "text": ["How designers shape an aircraft's fuselage, wings, and tail section determine the aircrafts flying characteristics. Swept wing aircraft require lots of power or speed to get airborne, while perpendicular winged aircraft can usually fly at slow speeds and get airborne quickly...", "The shape of the fuselage is usually defined by what the aircraft is used for. Large cargo needs large fuselages. Attack aircraft need fuselages only big enough to house the engines and tactical gear...", "The fuselage is the main body of an aircraft and for the most part, can be categorized as one of three types; truss, monocoque, or semimonocoque."], "jumps": ["P2040", "P2020", "P2050", "P2060"]}, {"id": "P2060", "text": ["Truss fuselages are constructed like a bridge. Beams and cross braces made of wood, steel tubes, or aluminum are bolted, welded, or riveted together to form a skeletal structure. This structure is covered by fabric or sheet metal..."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["The frame of a Truss type fuselage is the load bearing member while the skin acts only as a covering.", "The Truss type of fuselage has been used since the early days of flight and is still used today on Experimental or Home-built aircraft, ultralights, and project aircraft.", "The Monocoque type of fuselage uses the skin or covering as the full load bearing member. The structure is usually a single shell using bulkheads or formers to give the fuselage its desired shape..."], "jumps": ["P2080", "P2060", "P2090", "P2100"]}, {"id": "P2100", "text": ["The Semi-monocoque fuselage is basically a combination of a truss and monocoque type. It is the most common type of fuselage structure in today's general aviation aircraft."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["The Semi-monocoque fuselage uses bulkheads, frames, and formers for vertical strength and longerons and stringers for horizontal strength. This skin or covering still carries the majority of the load, however, the reinforcement structures add additional strength and security.y"], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["In early aircraft, the fuselage provided a place for the pilot to sit and the engine and wings to attach. Fuselages were the truss type; made of wood and fabric."], "jumps": ["P2130", "P2100"]}, {"id": "P2130", "text": ["This design worked, however, the fabric and fuselage shapes were not very aerodynamic and could not carry much cargo.", "Molded plywood offered a more aerodynamic shape. The plywood was formed in large concrete molds to look like torpedoes. This Monocoque design was very strong, however, the fuselage was still designed to carry only a pilot...", "Once aluminum alloys were introduced to aircraft manufacturing, designers realized that they could make fuselages bigger and more practical.", "They designed cabins in the fuselage that could carry people or cargo in addition to the pilot. As fuselages got bigger, more power was needed to lift them, so designers began using multiple engines. The engines were added to the wings to provide the power needed for flight..."], "jumps": ["P2140", "P2120", "P2150", "P2160", "P2170"]}, {"id": "P2170", "text": ["Engineers and designers soon found that an aircraft flew better and required less power if it was made more aerodynamic. Even bulky cargo planes were beginning to show smoother lines and a more slippery shape..."], "jumps": ["P2180", "P2150"]}, {"id": "P2180", "text": ["Designing an aircraft with a better aerodynamic shape reduced drag, saved on power, and reduced fuel consumption. Some early cargo/passenger planes were as aerodynamic as today's jets...", "Speed was another factor that changed the design of fuselage shapes. When jet engines were introduced to commercial aviation, aircraft were able attain higher speeds. Any parasitic drag on an aircraft fuselage had to be reduced...", "PARASITIC DRAG - Drag caused by protrusions or components interrupting the laminar flow over a surface. Your car antenna and rearview mirrors cause parasitic drag on your car.", "One way designers reduced parasitic drag was to make flush the rivets used to attach the aircraft skin to the framework flush with the skin surface.", "Additionally, enclosing landing gear, streamlining antennas, and rounding out angles reduced drag even more."], "jumps": ["P2190", "P2170", "P2200", "P2210", "P2220"]}, {"id": "P2220", "text": ["What fuselage types use the aircraft skin as the load bearing structure?"], "jumps": ["P2210"]}, {"id": "P2221", "text": [], "jumps": []}, {"id": "P2222", "text": ["Truss type fuselages do not use the skin to support any of the load.", "As we saw how fuselages evolved, we could not help but notice how wing shapes have evolved with them.", "Wings are generally classified into two types; braced and cantilever. Braced wings employ an external structure to help support the wing and keep it from excessive flexing. The support structure can be wires or solid braces...", "A Cantilever wing is not externally braced and must withstand all loads using their own internal structure.", "The shape of the wing is very important to how an aircraft performs in flight. Aircraft that need the ability to go slow or lift off very quickly usually have wings that are quite perpendicular to the fuselage. This wing shape captures maximum lift at reduced speeds..."], "jumps": ["P2220", "P2240", "P2250", "P2230", "P2260", "P2270"]}, {"id": "P2270", "text": ["Aircraft used for search and rescue or ground troop support need to be able to fly at very slow speeds to support their mission."], "jumps": ["P2260"]}, {"id": "P2280", "text": ["Perpendicular wings also provide maximum lift at slower speeds allowing for short field take offs and landings."], "jumps": ["P2290", "P2260"]}, {"id": "P2290", "text": ["Designers found that by sweeping the wings rearward, they could attain greater speeds out of their aircraft. These new wing configurations required greater power and speed to get the aircraft airborne, however, they allowed the aircraft to travel faster and higher once in the air..."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["As aircraft go faster, air pressure builds up in front of the aircraft like a wall of air. Swept wings allowed jet aircraft to penetrate that wall of air with minimal stress on the wings. Once this concept was discovered, it wasn't long before aircraft were designed to travel beyond the speed of sound.."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["Another advance in wing design came when engineers were designing aircraft that were to fly several times faster than the speed of sound. The delta wing was a swept wing design that filled in the area from the wing tip to the fuselage...", "The delta wing design is used on aircraft that fly in the extreme reaches of the atmosphere and subspace. This design allows the aircraft to reach incredible speeds without the flex and instability of standard swept wings...", "Remember, the trade off for speed in flight is the need for more power to get airborne. Swept wing and delta wing aircraft require lots of power to get airborne. Lots of power requires lots of fuel, and lots of fuel equals weight..."], "jumps": ["P2320", "P2300", "P2330", "P2310", "P2340"]}, {"id": "P2340", "text": ["Fast supersonic aircraft cannot carry as much weight as subsonic aircraft, but they will certainly get their cargo to its destination faster."], "jumps": ["P2341", "P2330", "P2350"]}, {"id": "P2350", "text": ["Why do engineers use flush rivets on metal aircraft?......."], "jumps": ["P2330"]}, {"id": "P2351", "text": [], "jumps": []}, {"id": "P2352", "text": ["Flush rivets actually increase the speed of an aircraft by reducing the parasitic drag."], "jumps": []}, {"id": "P2353", "text": ["Flush rivets are just as strong as protruding rivets. They are used primarily to reduce parasitic drag."], "jumps": []}, {"id": "P2360", "text": ["Another area of concern for engineers is the tail section, or empennage. There have been many different designs and configurations of tail sections, however, they all essentially do the same job, moving the aircraft around its vertical and horizontal axis...", "As we saw earlier, the Wright Brothers used their tail section for only one purpose, controlling yaw. It did not take long for aircraft engineers to use the tail to control both yaw and pitch. By WW1, most aircraft used the tail section for controlling both axis..."], "jumps": ["P2370", "P2350", "P2380", "P2360"]}, {"id": "P2380", "text": ["Although there have been variations in shapes, the standard tail configuration consists of a vertical stabilizer (fin) with two horizontal stabilizers extending perpendicularly from of each side..."], "jumps": ["P2390", "P2370"]}, {"id": "P2390", "text": ["The vertical stabilizer acts as a big weathervane and helps keep the aircraft flying in a steady direction. The rudder is attached to the vertical stabilizer and is used to steer the aircraft around its vertical axis..."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["The horizontal stabilizer(s) are used to help keep the aircraft flying level. The elevators are attached to the horizontal stabilizer and are used to control the aircrafts pitch.", "Tail sections were the first aircraft structures to incorporate a swept design to reduce drag.", "During World War II, engineers designed aircraft with twin tail booms, but essentially, the booms incorporated the standard tail section design."], "jumps": ["P2410", "P2380", "P2420", "P2430"]}, {"id": "P2430", "text": ["V-Tail tail sections have only two stabilization surfaces verses the three surfaces found on standard tail sections. The two surfaces work together to control the pitch and yaw movements."], "jumps": ["P2440", "P2420"]}, {"id": "P2440", "text": ["The T-tail uses the same principles as the standard tail configuration except that the horizontal stabilizer is attached to the top of the vertical stabilizer."], "jumps": ["P2450", "P2430"]}, {"id": "P2450", "text": ["The T-tail design moved the horizontal stabilizers out of the way of the ramp or rear doors making it a perfect design for dropping paratroopers and cargo."], "jumps": ["P2460", "P2440"]}, {"id": "P2460", "text": ["Engineers and designers also found the tail section to be a great place to add a third engine for additional power in some aircraft."], "jumps": ["P2470", "P2440"]}, {"id": "P2470", "text": ["Due to the delta wing design, the tail section of the Concorde and Space Shuttle does not have a horizontal stabilizer. Directional control around the axis is performed by surfaces called elevons. These control surfaces act as ailerons and elevators combined..."], "jumps": ["P2480", "P2460"]}, {"id": "P2480", "text": ["Which type of wing is requires external structural support?"], "jumps": ["P2470"]}, {"id": "P2481", "text": [], "jumps": []}, {"id": "P2482", "text": ["Cantilever wing types need no external support............."], "jumps": []}, {"id": "P2483", "text": ["Swept wings can be either externally supported or cantilever (need no external support)."], "jumps": []}, {"id": "P2490", "text": ["As you can see, an aircraft structure is made up of many sections that must be carefully designed to be aerodynamic, strong, and meet the requirements of the aircraft's primary job."], "jumps": ["P2910", "P2480"]}, {"id": "P2910", "text": ["This completes the information on AIRCRAFT CONSTRUCTION....", "1. There are three basic types of aircraft fuselage designs; truss, monocoque, and semi-monocoque.", "2. Aircraft wings are either externally supported, brace type, or internally supported, cantilever type. Both types must handle the stresses experienced during flight..."], "jumps": ["P2490", "P2930", "P2001", "P2940", "P2920"]}, {"id": "P2940", "text": ["3. Tail sections, or empennages, are used for aircraft stability in flight and control the pitch and yaw axis. Tail sections can be standard, V-tail or T-tail configured."], "jumps": ["P2999", "P2920", "P"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": []}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["What materials were used in the construction of WW1 aircraft?"], "jumps": []}, {"id": "P10211", "text": ["What aspect is always evolving in aircraft materials?"], "jumps": []}, {"id": "P10212", "text": ["It is subject to bugs, rot, and cracking", "What is the disadvantage of using wood in aircraft construction?", "It is not as strong as metal or composite materials"], "jumps": []}, {"id": "P10213", "text": ["Doping is a process used to _________ in wood structure aircraft.", "prevent air and water from going through the fabric covering", "assist airflow through the fabric covering"], "jumps": []}, {"id": "P10214", "text": ["Plywood molded structures were early examples of what type of fuselage?"], "jumps": []}, {"id": "P10215", "text": ["Which country discovered aluminum alloying during World War I?"], "jumps": []}, {"id": "P10216", "text": ["What does alloying copper, magnesium, and manganese to aluminum do to the aluminum?", "Increases its strength without increasing its weight"], "jumps": []}, {"id": "P10217", "text": ["Offers good lightning protection of occupants and equipment", "What is the advantage of using aluminum alloys in aircraft construction?", "Can be repaired easily with epoxy bonding when damaged"], "jumps": []}, {"id": "P10218", "text": ["Strongest strength to weight ratio of all materials", "What makes composite materials a good aircraft construction material?"], "jumps": []}, {"id": "P10219", "text": ["What is another name for the tail section of an aircraft?"], "jumps": []}, {"id": "P10220", "text": ["Composite materials are strong because the layers are ________ during the bonding process?"], "jumps": []}, {"id": "P10221", "text": ["What is NOT a concern when working with composite materials?", "Composite materials have a limited shelf life and must be used quickly", "Composite materials can be a skin irritant"], "jumps": []}, {"id": "P10222", "text": ["What material is used to stiffen aluminum alloy or composite sheets in high performance aircraft?"], "jumps": []}, {"id": "P10223", "text": ["The process of bonding balsa or foam between thin metal sheets is called?"], "jumps": []}, {"id": "P10224", "text": ["Which material is used in cockpit canopies because of its superb strength to weight ration?"], "jumps": []}, {"id": "P10225", "text": ["What type of aircraft designs use elevons for control?"], "jumps": []}, {"id": "P10226", "text": ["What type of aircraft fuselages use framework for bearing the loads?"], "jumps": []}, {"id": "P10227", "text": ["What is the skin used f let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
