<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["2. Creating and Editing Ladder Program Files", "w Understand the different file types associatedwith the PLC. w Recognize the importance of proper configuration settings.", "w Understand the process for creating ladder programs. w Develop an understanding of commands used for ladder program development..........."], "jumps": ["P101", "P10"]}, {"id": "P101", "text": ["w Identify the different modes of operation of the PLC. w Understand the usage of each processor mode.", "4. Transferring Files to and from the PLC", "w Understand the steps required to transfer a file to and from the PLC."], "jumps": ["P300", "P100"]}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["TERM Address: N/A Current Device: Full-Duplex PROC Address: N/AAAAAAAmmmmmmmm", "Allen-Bradley Company, Coryright 1989-1993 1747 - PA2E All Rights Reserved", "Thr May 11, 1995 Current Offline File: TEMPLATE 12:12:44 pm", "The purpose of this lesson is to introduce you to the functions and operation of the Allen Bradley APS (Advanced Programming Software) software."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["The APS software is used to create, manage, and implement ladder logic program files for the SLC 500 PLC in the Nida PLC Trainer. After you have learned how to effectively use the APS software, creating ladder logic programs will be fast and effective."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["In this lesson, you will learn through an interactive simulation of the APS software. It is important to note that we will be covering just the basics of the APS software. For more advanced operation, please refer to the APS software manual...ffective."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Let's begin the lesson on APS FAMILIARIZATION............................."], "jumps": ["P400"]}, {"id": "P900", "text": ["2. Creating & Editing Ladder Program Files"], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1040", "text": ["The APS Program is being simulated and only the function being discussed will be active. Follow the instructions carefully.....tware) software.", "Allen-Bradley Company, Coryright 1989-1993 1747 - PA2E All Rights Reserved", "Thr May 11, 1995 Current Offline File: TEMPLATE 12:12:44 pm", "TERM Address: N/A Current Device: Full-Duplex PROC Address: N/AAAAAAAmmmmmmmm"], "jumps": ["P1050", "P1001"]}, {"id": "P1050", "text": ["The display shown below is the \"Main Menu\" and will appear any time you enter the APS program. Observe the listed information....."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["There are three types of files that we will be talking about: processor, program, and data files."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["Processor files are the files you will send to the PLC via a transfer cable. A processor file contains both program and data files."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["Processor files contain user instructions, data, and configurations. Processor files can be transferred from a computer to a PLC or vice versa."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["Some PLC systems use modems to communicate with distant PLC's."], "jumps": ["P1100", "P1060"]}, {"id": "P1100", "text": ["Program files contain three program types: the system program, main ladder program, and the subroutine ladder program. These three programs are required for every processor file."], "jumps": ["P1110", "P1060"]}, {"id": "P1110", "text": ["You can have anywhere from 3 to 255 program files. File 0 is reserved for the system program; files 1 and 2 are for the main ladder program; and files 3 through 255 are for the subroutine ladder programs..."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["The system program contains I/O configuration, the processor type and name, and other system oriented information."], "jumps": ["P1122", "P1100"]}, {"id": "P1122", "text": ["The main ladder program contains user program instructions which tell the processor how to operate."], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["Subroutine ladder programs are short segments of program code that can be retrieved (called) from the parent program for the purpose of performing repetitive operations."], "jumps": ["P1140", "P1100"]}, {"id": "P1140", "text": ["Data files contain information used by the main and subroutine ladder programs. As with the program files, certain data files have pre-defined types."], "jumps": ["P1150", "P1100"]}, {"id": "P1150", "text": ["The pre-defined types are the first 9 files: file 0 - output data, 1 - input data, 2 - status data, 3 - bit data, 4 - timer data, 5 - counter data, 6 - control data, 7 - integer data, 8 is reserved for the system, and 9 - 255 are user definable."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["The user defined data files will contain information needed by the program, but they must be of a type listed in the first eight."], "jumps": ["P1170", "P1140"]}, {"id": "P1170", "text": ["Which of the following files belongs in a program file?...."], "jumps": ["P1140"]}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1172", "text": ["A data file is contained within a processor file, not a program file."], "jumps": []}, {"id": "P1180", "text": ["Having examined the different file types associated with the APS software, let's create and configure our processor file."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["When creating a processor file, you will need to specify the type of PLC and all optional hardware you have connected to it."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["The first step we need to perform is to actually create our processor file. Select F4 [OFFLINE CONFIG].....", "Allen-Bradley Company, Coryright 1989-1993 1747 - PA2E All Rights Reserved", "Thr May 11, 1995 Current Offline File: TEMPLATE 12:12:44 pm", "TERM Address: N/A Current Device: Full-Duplex PROC Address: N/AAAAAAAmmmmmmmm"], "jumps": []}, {"id": "P1210", "text": ["Next select the option F6 [CREATE FILE]. This will bring up the appropriate screens for creating a new processor file."], "jumps": []}, {"id": "P1220", "text": ["The prompt at the bottom of the screen says \"Press a Function Key or Enter a File Name\", enter the file name \"NIDA\" and press enter..", "F2 Processor: 1747-L511 5/01 CPU - 1K USER MEMORY"], "jumps": []}, {"id": "P1230", "text": ["1747-L511 5/01 CPU - 1K USER MEMORY 1747-L514 5/01 CPU - 4K USER MEMORY 1747-L524 5/02 CPU - 4K USER MEMORY 1747-L532 5/03 CPU - 12K USER MEMORY 1747-L20C/F 12-DC SNK 8-RLY", "The next step is to select the correct processor. Use the UP and DOWN arrow keys and select the \"1747-L20C/F 12-DC SNK 8-RLY\" setting and Press F2 [SELECT PROC]...", "F2 Processor: 1747-L511 5/01 CPU - 1K USER MEMORY"], "jumps": []}, {"id": "P1240", "text": ["1747-L20C/F 12-DC SNK 8-RLYSER MEMORY", "Now that you have selected your processor type, you need to specify the I/O configuration of your PLC. These are the input and output modules attached to the SLC 500 processor.....", "F2 Processor: 1747-L511 5/01 CPU - 1K USER MEMORY"], "jumps": ["P1250"]}, {"id": "P1250", "text": ["F2 Processor: 1747-L20C/F 12-DC SNK 8-RLYYEMORYORY", "Select F5 [CONFIG I/O]. This will bring you to the appropriate configuration screens for the PLC I/O.", "1747-L20C/F 12-DC SNK 8-RLYSER MEMORY"], "jumps": []}, {"id": "P1260", "text": ["Notice at the top of the screen there are three rack configurations labeled \"NOT INSTALLED\". A rack is used to attach different modules to the PLC processor.", "SLOT CATALOG # CARD DESCRIPTION", "* 0 1747-L20C/F 12-DC SNK 8-RLY", "1 1747-L20C/F 12-DC SNK 8-RLYY", "2 1747-L20C/F 12-DC SNK 8-RLYY"], "jumps": ["P1270"]}, {"id": "P1270", "text": ["Look at the Nida PLC. You can see two separate modules. Both of these modules are attached to one rack. Let's specify the rack. Select F4 [MODIFY RACKS].", "SLOT CATALOG # CARD DESCRIPTION", "* 0 1747-L20C/F 12-DC SNK 8-RLY", "2 1747-L20C/F 12-DC SNK 8-RLYY", "1 1747-L20C/F 12-DC SNK 8-RLYY"], "jumps": []}, {"id": "P1280", "text": ["Since we only have one rack, you need to select F1 [RACK 1] to modify the configuration of the first rack.....", "SLOT CATALOG # CARD DESCRIPTION", "* 0 1747-L20C/F 12-DC SNK 8-RLY", "2 1747-L20C/F 12-DC SNK 8-RLYY", "1 1747-L20C/F 12-DC SNK 8-RLYY"], "jumps": []}, {"id": "P1290", "text": ["2 1747-L20C/F 12-DC SNK 8-RLYY", "1 1747-L20C/F 12-DC SNK 8-RLYY", "SLOT CATALOG # CARD DESCRIPTION", "* 0 1747-L20C/F 12-DC SNK 8-RLY", "Notice there are only two selections. With the actual APS software, the number of selections may increase as more PLC systems are developed. Using the arrow keys, choose \"1746-A2 2-slot Backplane\" and press enter.", "NOT INSTALLED 1746-A2 2-slot Backplane 5/01 CPU - 4K USER MEMORY 1747-L524 5/02 CPU - 4K USER MEMORY 1747-L532 5/03 CPU - 12K USER MEMORY 1747-L20C/F 12-DC SNK 8-RLY"], "jumps": []}, {"id": "P1300", "text": ["Notice that the rack you just selected has 2 slots, or two locations for modules. The SLOT configuration on the screen with *'s shows that slot 0 is the processor, and 1 and 2 are available for additional modules.", "RACK 1 = 1746-A2 2-slot Backplane", "SLOT CATALOG # CARD DESCRIPTION", "* 0 1747-L20C/F 12-DC SNK 8-RLY", "* 22 1747-L20C/F 12-DC SNK 8-RLYY", "* 11 1747-L20C/F 12-DC SNK 8-RLYY"], "jumps": ["P1310"]}, {"id": "P1310", "text": ["RACK 1 = 1746-A2 2-slot Backplane", "SLOT CATALOG # CARD DESCRIPTION", "Let's configure the slots for the two modules we have. Use the arrow keys and highlight \"* 1\" (Slot 1) with the cursor bar. Select F5 [MODIFY SLOTS]...", "* 0 1747-L20C/F 12-DC SNK 8-RLY * 1 * 2 *2U - 4K USER MEMORY 1747-L524 5/02 CPU - 4K USER MEMORY 1747-L532 5/03 CPU - 12K USER MEMORY 1747-L20C/F 12-DC SNK 8-RLY", "* 1 1747-L20C/F 12-DC SNK 8-RLY"], "jumps": []}, {"id": "P1320", "text": ["Now you need to select the module installed in the first slot. Use the arrow keys, highlight the \"1746-IG16 16-Input [TTL](Source) 5 VDC\", and press F2 [SELECT MODULE].....", "1746-IG16 16-Input [TTL](SOURCE) 5 VDC e Out", "1746-I*16 Any 8pt. Discrete Input Module 1746-I*16 Any 16pt. Discrete Input Module 1746-I*32 Any 32pt. Discrete Input Module 1746-0*8 Any 8pt. Discrete Output Module 1746-0*16 Any 16pt. Discrete Output Module 1746-0*32 Any 32pt. Discrete Output Module 1746-IA4 4-Input 100/120 VAC 1746-IA8 8-Input 100/120 VAC 1746-IB8 8-Input (Sink) 24 VDC 1746-IG16 16-Input [TTL](SOURCE) 5 VDC 1746-NI04V Analog Comb. 2 In & 2 Voltage Out"], "jumps": []}, {"id": "P1330", "text": ["To modify slot two, use the arrow keys and highlight \"* 2\" (Slot 2) with the cursor bar. Select F5 [MODIFY SLOT].", "RACK 1 = 1746-A2 2-slot Backplane", "RACK 2 = NOT INSTALLEDeeeeeeeeeeeeee", "* 0 1747-L20C/F 12-DC SNK 8-RLY * 1 1746-IG16 16-Input [TTL](SOURCE) 5 VDC * 2 * 31746-0*8 Any 8pt. Discrete Output Module 1746-0*16 Any 16pt. Discrete Output Module 1746-0*32 Any 32pt. Discrete Output Module 1746-IA4 4-Input 100/120 VAC 1746-IA8 8-Input 100/120 VAC 1746-IB8 8-Input (Sink) 24 VDC 1746-IG16 16-Input [TTL](SOURCE) 5 VDC 1746-NI04V Analog Comb. 2 In & 2 Voltage Out", "RACK 3 = NOT INSTALLEDDeeeeeeeeeeeee", "SLOT CATALOG # CARD DESCRIPTION", "* 2 1746-IG16 16-Input [TTL](SOURCE) 5 VDC"], "jumps": []}, {"id": "P1340", "text": ["Now you need to select the module installed in the second slot. Use the arrow keys, highlight the \"1746-NIO4V Analog Comb. 2 In & 2 Voltage Out\", and press F2 [SELECT MODULE].", "1746-NI04V Analog Comb. 2 In & 2 Voltage Out", "1746-I*8 Any 8pt. Discrete Input Module 1746-I*16 Any 16pt. Discrete Input Module 1746-I*32 Any 32pt. Discrete Input Module 1746-0*8 Any 8pt. Discrete Input Module 1746-0*16 Any 16pt. Discrete Input Module 1746-0*32 Any 32pt. Discrete Input Module 1746-IA4 4-Input 100/120 VAC 1746-IA8 8-Input 100/120 VAC 1746-IB8 8-Input (Sink) 24 VDC 1746-IG16 16-Input [TTL](SOURCE) 5 VDC 1746-NI04V Analog Comb. 2 In & 2 Voltage Out"], "jumps": []}, {"id": "P1350", "text": ["* 0 1747-L20C/F 12-DC SNK 8-RLY DESCRIPTION", "RACK 1 = 1746-A2 2-slot Backplane", "RACK 2 = NOT INSTALLEDeeeeeeeeeeeeee", "RACK 3 = NOT INSTALLEDDeeeeeeeeeeeee", "SLOT CATALOG # CARD DESCRIPTION", "The PLC configuration operations are now finished. Select F8 [EXIT] to return to the processor file creation menu.", "* 1 1746-IG16 16-Input[TTL](SOURCE) 5 VDCCN", "* 2 1746-NI04V Analog Comb. 2 In & 2 Voltage Outt"], "jumps": []}, {"id": "P1360", "text": ["1747-L20C/F 12-DC SNK 8-RLY MEMORY", "Now select F8 [SAVE & EXIT] to save all of the configuration settings you have just made for your new processor file.", "F2 Processor: 1747-L20C/F 12-DC SNK 8-RLYMEMORYRY", "1747-L20B 12-120 VAC 8-TRIACRY", "Press a function key, or Enter a New File Name"], "jumps": []}, {"id": "P1370", "text": ["After you have created a processor file, you must make it active in the APS software by selecting F8 [ACCEPT]."], "jumps": []}, {"id": "P1380", "text": ["Now you are at the \"Main Menu\". The last things we need to look at are modifying the configuration of an existing processor file and how to set an existing processor file as active.", "Allen-Bradley Company, Coryright 1989-1993 1747 - PA2E All Rights Reserved", "Thr May 11, 1995 Current Offline File: NIDA 12:12:44 pmpm", "TERM Address: N/A Current Device: Full-Duplex PROC Address: N/AAAAAAAmmmmmmmm"], "jumps": ["P1390"]}, {"id": "P1385", "text": ["Allen-Bradley Company, Coryright 1989-1993 1747 - PA2E All Rights Reserved", "Thr May 11, 1995 Current Offline File: NIDA 12:12:44 pmpm", "TERM Address: N/A Current Device: Full-Duplex PROC Address: N/AAAAAAAmmmmmmmm", "Now you are at the \"Main Menu\". The last things we need to look at are modifying the configuration of an existing processor file and how to set an existing processor file as active."], "jumps": ["P1390"]}, {"id": "P1390", "text": ["The first thing you need to do if you want to edit the configuration of a processor file is to make it the active file. This is also necessary for programming, which you will see in the next objective..."], "jumps": ["P1400", "P1385"]}, {"id": "P1400", "text": ["From the \"Main Menu\", you need to select F4 [OFFLINE CONFIG]. Recall that we also did this when we created our new processor file....."], "jumps": []}, {"id": "P1410", "text": ["NIDA2 255 05-12-955", "LIGHTS 255 03-17-95 NIDA 255 05-15-95 NIDA2 255 05-12-95 RICK_TEM 8790 03-29-95", "Use the arrow keys and move the cursor bar to select the file NIDA2. Press F3 [SELECT FILE]. This will set NIDA2 as the active file......"], "jumps": []}, {"id": "P1420", "text": ["Now select F8 [ACCEPT] to confirm the change of the current file to NIDA2. You should then return to the \"Main Menu\"....."], "jumps": []}, {"id": "P1430", "text": ["Now, to change any of the processor configurations, select F3 [OFFLINE PRG/DOC]......", "Allen-Bradley Company, Coryright 1989-1993 1747 - PA2E All Rights Reserved", "Thr May 11, 1995 Current Offline File: NIDA2 12:12:44 pm pm", "TERM Address: N/A Current Device: Full-Duplex PROC Address: N/AAAAAAAmmmmmmmm"], "jumps": []}, {"id": "P1440", "text": ["0 system *", "1 reserved **", "2 Yes ladder *", "Press a key, enter file number or file name"], "jumps": []}, {"id": "P1450", "text": ["2 Yes ladder *", "Press a key, enter file number or file name"], "jumps": []}, {"id": "P1460", "text": ["Press a Function key, ENTER to select Processor, ESC to exit, or Alt-U to abort", "Remember this menu? This is the same menu from when we created our processor file. The same commands used to set the configuration can be used to change them here.....", "F2 Processor: 1747-L20C/F 12-DC SNK 8-RLYMEMORYRY", "1747-L20A 12-120 VAC 8-RLYACRY", "1747-L20B 12-120 VAC 8-TRIACORY"], "jumps": ["P1470"]}, {"id": "P1470", "text": ["As you can see, configuration of the PLC processor file is important. It tells the APS the exact setup of your PLC.....", "Press a Function key, ENTER to select Processor, ESC to exit, or Alt-U to abort", "1747-L20A 12-120 VAC 8-RLYACRY", "1747-L20B 12-120 VAC 8-TRIACORY"], "jumps": ["P1480"]}, {"id": "P1475", "text": ["As you can see, configuration of the PLC processor file is important. It tells the APS software exactly what your PLC setup looks like.", "0 system *", "1 reserved **", "Press a Function key, ENTER to select Processor, ESC to exit, or Alt-U to abort", "1747-L20A 12-120 VAC 8-RLYACRY", "1747-L20B 12-120 VAC 8-TRIACORY", "F2 Processor: 1747-L20C/F 12-DC SNK 8-RLYMEMORYRY"], "jumps": ["P1390"]}, {"id": "P1480", "text": ["Without the correct settings, the APS software cannot communicate with your system properly.", "Press a Function key, ENTER to select Processor, ESC to exit, or Alt-U to abort", "1747-L20A 12-120 VAC 8-RLYACRY", "1747-L20B 12-120 VAC 8-TRIACORY"], "jumps": ["P1490", "P1475"]}, {"id": "P1490", "text": ["At this point, we have created and configured a processor file. In the next objective, you will see how to write programs in your processor file.", "Press a Function key, ENTER to select Processor, ESC to exit, or Alt-U to abort", "1747-L20A 12-120 VAC 8-RLYACRY", "1747-L20B 12-120 VAC 8-TRIACORY"], "jumps": ["P1500", "P1475"]}, {"id": "P1500", "text": ["Press a Function key, ENTER to select Processor, ESC to exit, or Alt-U to abort", "1747-L20A 12-120 VAC 8-RLYACRY", "1747-L20B 12-120 VAC 8-TRIACORY"], "jumps": []}, {"id": "P1510", "text": ["0 system *", "1 reserved **", "2 Yes ladder *", "Press a key, enter file number or file name"], "jumps": []}, {"id": "P1520", "text": ["2 Yes ladder *", "Press a key, enter file number or file name"], "jumps": []}, {"id": "P1530", "text": ["Press a function keyile number or file name", "Allen-Bradley Company, Coryright 1989-1993 1747 - PA2E All Rights Reserved", "Thr May 11, 1995 Current Offline File: NIDA2 12:12:44 pm pm", "TERM Address: N/A Current Device: Full-Duplex PROC Address: N/AAAAAAAmmmmmmmm"], "jumps": ["P1910"]}, {"id": "P1910", "text": ["This completes the information on CREATING & CONFIGURING FILES."], "jumps": ["P1001", "P1475"]}, {"id": "P1920", "text": ["1. The PLC uses three different types of files: processor, program, and data. Processor files contain both program and data files.."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. Program files consist of a system file, main ladder program, and many subroutine ladder programs."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. Data files consist of any of the 8 basic data file types: output data, input data, status data, bit data, timer data, counter data, control data, and integer data."], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["Allen-Bradley Company, Coryright 1989-1993 1747 - PA2E All Rights Reserved", "Thr May 11, 1995 Current Offline File: TEMPLATE 12:12:44 pm", "TERM Address: N/A Current Device: Full-Duplex PROC Address: N/AAAAAAAmmmmmmmm", "4. The configuration of the PLC processor file is essential for proper operation of the APS software.", "Press a function keyile number or file name"], "jumps": ["P1999", "P1920"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1950"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2040", "text": ["Allen-Bradley Company, Coryright 1989-1993 1747 - PA2E All Rights Reserved", "Thr May 11, 1995 Current Offline File: NIDA2 12:12:44 pm pm", "TERM Address: N/A Current Device: Full-Duplex PROC Address: N/AAAAAAAmmmmmmmm", "Once you have created a processor file, the next step is creating the program and data files as needed. F3 [OFFLINE PRG/DOC] brings you to the program editing area, press this key now...now.....", "Press a function keyile number or file name"], "jumps": []}, {"id": "P2050", "text": ["Press a key, enter file number or file name", "0 system *", "1 reserved **", "2 Yes ladder *"], "jumps": []}, {"id": "P2060", "text": ["2 Yes ladder *", "Notice below that File 2 is a ladder file. This is our main ladder program. All additional ladder files will be subroutine.", "Press a key, enter file number or file name"], "jumps": ["P2070"]}, {"id": "P2070", "text": ["Press a key, enter file number or file name", "Remember, a subroutine is a small section of ladder logic that is called in various locations in the main ladder program. Let's change the name of our main ladder program....."], "jumps": ["P2080"]}, {"id": "P2080", "text": ["2 Yes ladder *** ***", "0 system * 1 reserved * 2 Yes ladder * ladder *", "Use the arrow keys and move the cursor bar to File 2. Press F4 [CHANGE FL. NAME]. The function will allow us to change the file name.....", "Press a key, enter file number or file name"], "jumps": []}, {"id": "P2090", "text": ["Enter the name \"MOTORCNTRL\" and press enter. It is good practice to use titles which are descriptive of file's contents. The maximum limit on characters in a name is 10.....", "0 system *", "1 reserved **", "2 Yes ladder *"], "jumps": []}, {"id": "P2100", "text": ["2 Yes motorcntrl ladder *******************\\", "The purpose of the file name we chose is to describe the ladder program we are about to create. This ladder program waits for an input from a switch and, when received, begins evaluating a subroutine program...", "Press a key, enter file number or file name"], "jumps": ["P2110"]}, {"id": "P2110", "text": ["Press a key, enter file number or file name", "This subroutine causes a 5 second delay and then allows the PLC's motor to spin. Press F6 [CREATE FILE]....."], "jumps": []}, {"id": "P2120", "text": ["Now enter '3' and press Enter. This tells the APS software which file you would like to create...."], "jumps": []}, {"id": "P2130", "text": ["Using the arrow keys, highlight File 3 and press F4 [CHANGE FL. NAME]. Just as with the main ladder program, we are going to change the name of the file.....", "3 Yes ladder * ** ***", "0 system * 1 reserved * 2 Yes motorcntrl ladder * 3 Yes ladder **", "Press a key, enter file number or file name"], "jumps": []}, {"id": "P2140", "text": ["Enter the name 'MOTOR_OP' and press enter. Remember, it's good to use descriptive names to describe the function of your program files.....", "0 system *", "1 reserved **", "3 Yes ladder *", "2 Yes motorcntrl ladder ***********************************"], "jumps": []}, {"id": "P2150", "text": ["Press a key, enter file number of file name", "3 Yes motor_op ladder ****************", "If you ever want to delete a file that you do not need any more, highlight the file and select F7 [DELETE FILE]. Remember, once you delete a file, it is destroyed forever....."], "jumps": ["P2160"]}, {"id": "P2160", "text": ["2 Yes motorcntrl ladder * ** ***", "0 system * 1 reserved * 2 Yes motorcntrl ladder * 3 Yes motor_op ladder * **", "Press a key, enter file number of file name", "We are now ready to edit the ladder program files. Using the arrow keys, highlight File 2 and select F8 [MONITOR FILE]. Monitor file allows you to view the contents of the file....."], "jumps": []}, {"id": "P2170", "text": ["On the screen, you will see the end rung. At this time, no other rungs exist in the ladder program. The bottom of the screen (file 2, rung 0) will always tell you which program you are in and the currently highlighted rung.....", "Press a function keyile number or file name"], "jumps": ["P2180"]}, {"id": "P2180", "text": ["For our program, we are going to use the two inputs on the 5050-1 card to latch and unlatch a bit in one of the data files. When this bit is NOT set, we are going to make sure our timer is reset and the motor is not in operation."], "jumps": ["P2190", "P2040"]}, {"id": "P2190", "text": ["When the bit is set, we will run the subroutine that starts a timer and begins the motor running after the timer reaches its set value."], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["Press a function keyile number or file name", "Let's begin editing our main ladder program. Select F10 [EDIT]....."], "jumps": []}, {"id": "P2210", "text": ["Press a key for desired editing functioname", "Now select F4 [INSERT RUNG] to place a new rung in our program..."], "jumps": []}, {"id": "P2220", "text": ["Type a mnemonic or press a key for desired editing function", "Notice the new rung in our program. The broken rails of the rung indicate that this rung hasn't been accepted yet, since it is empty....."], "jumps": ["P2230"]}, {"id": "P2230", "text": ["The next step is to insert an instruction into the highlighted rung, which is the rung we just added. Select F4 [INSERT INSTR].....", "Type a mnemonic or press a key for desired editing function"], "jumps": []}, {"id": "P2240", "text": ["At the bottom of the screen, you can see all of the different types of instruction that can be inserted into this rung. Let's make our first rung set the bit if the start button has been pressed.....", "Type a mnemonic or press a key for desired editing function"], "jumps": ["P2250"]}, {"id": "P2250", "text": ["Type a mnemonic or press a key for desired editing function"], "jumps": []}, {"id": "P2260", "text": ["Select F1 [XIC -] [-]. Remember, this ladder logic command means examine if closed. When the switch is closed, the rest of this rung will be examined.....", "Type a mnemonic or press a key for desired editing function"], "jumps": []}, {"id": "P2270", "text": ["Next you need to add the bit address of the input switch. Enter 'I:0/0' and press enter. This location is the start switch on the 5050-1 card....."], "jumps": []}, {"id": "P2280", "text": ["Now we need to add the instruction to latch the bit (set to high) if the start button is pressed. Remember, this bit is located in a data file and will be created automatically by the APS program.....", "Type a mnemonic or press a key for desired editing function"], "jumps": ["P2290"]}, {"id": "P2290", "text": ["Type a mnemonic or press a key for desired editing function"], "jumps": []}, {"id": "P2300", "text": ["Select F4 [OTL -(L)-]. This instruction is known as the output latch instruction.....", "Type a mnemonic or press a key for desired editing function"], "jumps": []}, {"id": "P2310", "text": ["For the bit address, type 'B3/0' and press Enter. Recall, in the data files the bit file was File 3. We just used one of the bit locations from File 3....."], "jumps": []}, {"id": "P2320", "text": ["Now that we have finished configuring this rung, we need to accept our rung into the ladder program. Press the ESC key.....", "Type a mnemonic or press a key for desired editing function"], "jumps": []}, {"id": "P2330", "text": ["Now press F10 [ACCEPT RUNG] to accept this rung into our ladder program.....", "Type a mnemonic or press a key for desired editing function"], "jumps": []}, {"id": "P2340", "text": ["Now we need to add the rest of the rungs for our ladder program. Using the arrow keys, move the cursor bar to the end rung, and then select F4 [INSERT RUNG].....", "Press a key for desired editing function"], "jumps": []}, {"id": "P2350", "text": ["Select F4 [INSERT INSTR], insert instruction.....", "Type a mnemonic or press a key for desired editing function"], "jumps": ["P1480"]}, {"id": "P2360", "text": ["Select F1 [BIT], for bit related instructions.", "Type a mnemonic or press a key for desired editing function"], "jumps": []}, {"id": "P2370", "text": ["Select F1 [XIC -] [- ], examine if closed instruction.", "Type a mnemonic or press a key for desired editing function"], "jumps": []}, {"id": "P2380", "text": ["Type 'I:0/1' and press enter. This is the input we will monitor."], "jumps": []}, {"id": "P2390", "text": ["Again, select F1 [BIT], for a bit related instruction...", "Type a mnemonic or press a key for desired instruction class"], "jumps": []}, {"id": "P2400", "text": ["Now select F5 [OTU -(U)- ], for an output unlatch instruction.", "Type a mnemonic or press a key for desired editing function"], "jumps": []}, {"id": "P2410", "text": ["Enter 'B3/0' and press enter. This is the bit that we are using in our ladder program, located in data File 3 as indicated in the bit description....."], "jumps": []}, {"id": "P2420", "text": ["The rung we just created monitors the stop button on the 5050-1 card and unlatches the bit (set to zero) if the button is pressed. Press ESC to move back one menu.....", "Type a mnemonic or press a key for desired editing function"], "jumps": []}, {"id": "P2430", "text": ["Now select F10 [ACCEPT RUNG] to accept the rung we just created into our main ladder program file.....", "Type a mnemonic or press a key for desired editing function"], "jumps": []}, {"id": "P2440", "text": ["Press a key for desired editing functionnnnnnnnnnnnnnnntion", "For the main ladder program, we have three more instructions to add. The instructions are going to be added automatically but a description of each of them will be presented....."], "jumps": ["P2450"]}, {"id": "P2450", "text": ["Press a key for desired editing functioned editing function", "This rung checks the status of the bit and evaluates the subroutine if latched. The JSR stands for Jump to Subroutine, and the number indicates the file # of the subroutine.....", "JUMP TO SUBROUTINE SBR file number 3"], "jumps": ["P2460"]}, {"id": "P2460", "text": ["MOVE Source 0 Dest 0:2.0", "Press a key for desired editing functioned editing function", "MOV Source 0 Dest 0:2.0", "The next rung ensures the motor is off if the bit is unlatched. XIO stands for examine if open. The MOV instruction moves a 0 to output location 0:2.0.....", "1OVE Source 0 Dest 0:2.00"], "jumps": ["P2470"]}, {"id": "P2470", "text": ["MOV Source 0 Dest 0:2.0", "Press a key for desired editing functioned editing function", "Location 0:2.0 is the output of the second module. The 0 represents a voltage level output through the module. This rung sends zero volts to the motor if the bit is unlatched....."], "jumps": ["P2480"]}, {"id": "P2480", "text": ["MOV Source 0 Dest 0:2.0", "The last rung of the program sets the timer we are using to zero if the stop button has been pressed. The RES or reset command is used to reset Timer 0 in the pre-defined data file, File 4.....", "Press a key for desired editing functioned editing function"], "jumps": ["P2490"]}, {"id": "P2490", "text": ["Press a key for desired editing functioned editing function", "We have finished creating the main ladder program. It is important to note that the INSERT, MODIFY, DELETE, and UNDEL(ete) commands can be used to modify the ladder program..."], "jumps": ["P2500"]}, {"id": "P2500", "text": ["Press a key for desired editing functioned editing function", "The next step is to create the subroutine ladder program for our processor file. Press ESC....."], "jumps": []}, {"id": "P2510", "text": ["Now press F3 [EXIT] to return to the program listing..", "Press a function keyred editing functioned editing function"], "jumps": []}, {"id": "P2520", "text": ["3 Yes motor_op ladder ** ** ***", "Using the arrow keys, move the cursor bar to File 3. Select F8 [MONITOR FILE]. Remember, F8 is used to monitor the contents of the file.....", "Press a key, enter file number or file name", "0 system * 1 reserved * 2 Yes motorcntrl ladder * 3 Yes motor_op ladder * **"], "jumps": []}, {"id": "P2530", "text": ["Since creating rung instructions is the same for subroutines as for the main ladder program, we are going to just look at the rungs being used in our subroutine program.....", "Press a function keyred editing functioned editing function"], "jumps": ["P2540"]}, {"id": "P2540", "text": ["Press a function keyred editing functioned editing function", "This is the first rung of the subroutine. The TON instruction stands for Timer on. Certain values are required for the timer. Timer on is being used in data File 4.....", "TON TIME ON DELAY Timer T4:0 Time Base 0:01 Preset 500 Accum 00"], "jumps": ["P2550"]}, {"id": "P2550", "text": ["The timer counts in increments of 0.01 seconds. This means for five seconds we need to set the preset value to 500. The starting value should be zero and put in the accum setting.....", "Press a function keyred editing functioned editing function"], "jumps": ["P2560"]}, {"id": "P2560", "text": ["Accum stands for the accumulator. This is where the timer counting occurs. If we had stored value of 100 in the accumulator rather than zero, it would only count for 4 seconds.....", "Press a function keyred editing functioned editing function"], "jumps": ["P2570"]}, {"id": "P2570", "text": ["MOVE Source 10000 Dest 0:2.0:2.0", "MOV Source 0 Dest 0:2.0", "This is the last rung of the subroutine. The purpose of this rung is to start the motor after the timer has finished counting. The T4:0/DN is the DN (done) bit of the timer.....", "Press a key for desired editing functioned editing function"], "jumps": ["P2580"]}, {"id": "P2580", "text": ["The done bit is set after the timer has finished counting to th preset value. Again the MOV command to destination 0:2.0 is going to send 10 volts to the motor. The 10000 is 10000 x .001V (1mV) which equals 10V....", "Press a key for desired editing functioned editing function"], "jumps": ["P2590"]}, {"id": "P2590", "text": ["Now that our subroutine program is complete, we need to save it. Press ESC.....", "Press a key for desired editing functioned editing function"], "jumps": []}, {"id": "P2600", "text": ["Press a function keyred editing functioned editing function"], "jumps": []}, {"id": "P2610", "text": ["0 system *", "Press a key, enter file number or file name", "1 reserved **", "2 Yes motorcntrl ladder ***********************************", "3 Yes motor_op ladder ****************"], "jumps": []}, {"id": "P2620", "text": ["3 Yes motor_op ladder ****************", "Finally, select F8 [YES] to confirm saving the file."], "jumps": []}, {"id": "P2630", "text": ["Press a key, enter file number or file name", "3 Yes motor_op ladder ****************", "Now our ladder logic programs are complete. The steps we followed should always be used in creating ladder logic programs. Additional commands are available but will not be discussed..."], "jumps": ["P2640"]}, {"id": "P2640", "text": ["For more information on other commands related to programming, refer to the APS User Manual and Reference Guide.....", "Press a key, enter file number or file name"], "jumps": ["P2650"]}, {"id": "P2650", "text": ["Press a key, enter file number or file name", "The last things we are going to look at are the data files. Data files contain information that your ladder program files use to perform actions......."], "jumps": ["P2660"]}, {"id": "P2660", "text": ["Press a key, enter file number or file name", "From this screen, select F9 [DATA MONITOR] function. This is going to allow us to view any of the data files we are using....."], "jumps": []}, {"id": "P2670", "text": ["Now you must enter the data type and file number you would like to look at. We are going to look at the timer data in File 4, or 'T4'. Enter 'T4' and press enter....."], "jumps": []}, {"id": "P2680", "text": ["address EN IT EN BASE PRE ACC T4:0 0 0 0 .01 sec. 500 0", "This is the data that we set in the subroutine ladder program file. Remember, the first 9 files have pre-defined data types.....", "no forcesLC 500 formatted decimal addr", "Press a key or enter valuember or file name"], "jumps": ["P2690"]}, {"id": "P2690", "text": ["While not active in this simulation, the F7 [NEXT FILE] and F8 [PREV FILE] will allow you to look at other data files in the current processor file. Press ESC.", "Press a key or enter valuember or file name"], "jumps": []}, {"id": "P2700", "text": ["Now press F3 [RETURN TO MENU] to return to the \"Main Menu\" of the APS software......", "0 system *", "1 reserved **", "2 Yes motorcntrl ladder ***********************************", "3 Yes motor_op ladder ****************", "Press a key, enter file number or file name"], "jumps": []}, {"id": "P2710", "text": ["Press a function keyile number or file name", "As you can see, there are many steps involved in creating the ladder program files. The best way to create good ladder logic programs is to make them on paper first, and then put them into the APS software...", "Allen-Bradley Company, Coryright 1989-1993 1747 - PA2E All Rights Reserved", "Thr May 11, 1995 Current Offline File: NIDA2 12:12:44 pm pm", "TERM Address: N/A Current Device: Full-Duplex PROC Address: N/AAAAAAAmmmmmmmm"], "jumps": ["P2720"]}, {"id": "P2720", "text": ["In the next objective, we will look at changing the operation mode of the PLC. This is important for loading files to or from the actual PLC.....", "Press a function keyile number or file name"], "jumps": ["P2910"]}, {"id": "P2910", "text": ["This completes the information on CREATING & EDITING LADDER PROGRAM FILES."], "jumps": ["P2001", "P2200"]}, {"id": "P2920", "text": ["1. It is good programming practice to use file names representing the process they will be performing, for example MOTORCNTRL for a process that controls a motor.", "0 system *", "1 reserved **", "2 Yes motorcntrl ladder ********************", "Press a key, enter file number or file name", "3 Yes ladder *"], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2. In most cases, data files are created automatically when referenced by a program file. For example, the instruction OTL B3/0 (output latch) would create data in the third file and latch the zero bit."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3. Remember, the APS User Manual and Reference Guide are excellent sources for information. For additional commands, procedures, and help, refer to these manuals."], "jumps": ["P2999", "P2930"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2940"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3040", "text": ["Before you learn how to transfer programs to the PLC, it is important to understand the PLC's modes of operation. The PLC must be in the proper mode for proper operation."], "jumps": ["P3001"]}, {"id": "P3050", "text": ["There are many different processor modes for the SLC-500 PLC. We will discuss two of these modes: program and run."], "jumps": ["P3040"]}, {"id": "P3060", "text": ["In the program mode, processor files can be transferred to/from the PLC from the computer. In this mode, no program execution is being performed."], "jumps": ["P3040"]}, {"id": "P3070", "text": ["It is necessary to change to this mode before attempting to transfer a processor file to the PLC."], "jumps": ["P3040"]}, {"id": "P3080", "text": ["In run mode, ladder programs are executed and their output can be monitored. It is important to note that the ladder program files cannot be modified while in run mode."], "jumps": ["P3040"]}, {"id": "P3090", "text": ["In run mode, however, you can modify the processor data files. This is very helpful when fine tuning a ladder program. You can also transfer a processor file from the PLC to the computer."], "jumps": ["P3040"]}, {"id": "P3100", "text": ["Allen-Bradley Company, Coryright 1989-1993 1747 - PA2E All Rights Reserved", "Thr May 11, 1995 Current Offline File: NIDA2 12:12:44 pm pm", "TERM Address: N/A Current Device: Full-Duplex PROC Address: N/AAAAAAAmmmmmmmm", "Press a function keyile number or file name", "Let's see how to change the processor's mode. First we will change the processor's mode to program. It is important to note that your PLC must be attached to your computer while you are performing this operation when actually programming a PLC..."], "jumps": ["P3040"]}, {"id": "P3110", "text": ["If the processor isn't connected properly, the APS software will not be able to communicate with the PLC. Communication is necessary to instruct the PLC processor. We will simulate the communication...", "Allen-Bradley Company, Coryright 1989-1993 1747 - PA2E All Rights Reserved", "Thr May 11, 1995 Current Offline File: NIDA2 12:12:44 pm pm", "TERM Address: N/A Current Device: Full-Duplex PROC Address: N/AAAAAAAmmmmmmmm", "Press a function keyile number or file name"], "jumps": ["P3100"]}, {"id": "P3120", "text": ["Press a function keyile number or file name", "Now that you have connected your PLC to the computer, run the APS software, and applied power to the PLC, select F1 [ONLINE] from the APS \"Main Menu\" screen....."], "jumps": []}, {"id": "P3130", "text": ["At this time, the APS software will read the contents of the PLC memory. If the current processor file contained within the PLC is contained on the computer, it will be made the active processor file...", "0 system *", "Press a key, enter file number or file name"], "jumps": []}, {"id": "P3140", "text": ["Press a key, enter file number or file name", "If the file does not exist on your computer, you will be prompted with an option to change the file to the computer. It is not necessary to save the current processor file to the computer.....", "0 system *"], "jumps": ["P3150"]}, {"id": "P3150", "text": ["The next step is to go into the processor functions menu. Select F1 [PROCSSR FUNCTNS]. This will bring you to menu commands related to the processor.....", "0 system *", "Press a key, enter file number or file name"], "jumps": []}, {"id": "P3160", "text": ["You can see that we will need to use the first option. Select F1 [CHANGE MODE].....", "0 system *", "Press a function keyile number or file name"], "jumps": []}, {"id": "P3170", "text": ["These are the different modes of operation for the PLC processor. Since we want to change the processor to program mode, select F1 [PROGRAM MODE].....", "0 system *", "Press a key for desired processor mode name"], "jumps": []}, {"id": "P3180", "text": ["0 system *", "Press a function; or <ESC> to abortttttttttttttttttttttttttttttttttttt"], "jumps": []}, {"id": "P3190", "text": ["The processor is now in the program mode. At the bottom of the screen above the menu, the word \"REM PROG\" should be displayed. This is known as the status line.....", "0 system *", "Press a function key <ESC> to abortttttttttttttttttttttttttttttttttttt"], "jumps": ["P3200"]}, {"id": "P3200", "text": ["The status line tells you the current mode of the PLC processor. In our case, the current mode is PROG or program mode. Remember, in this mode we can transfer file to and from the PLC.....", "Press a function key <ESC> to abortttttttttttttttttttttttttttttttttttt"], "jumps": ["P3210"]}, {"id": "P3210", "text": ["In the next objective, you will see how to transfer a file to the PLC. Then we will run the program we transferred to the PLC. If you wanted to change to run mode, you would follow the same steps as with program mode except select F12 [RUN MODE] instead...", "Press a function key <ESC> to abortttttttttttttttttttttttttttttttttttt"], "jumps": ["P3220"]}, {"id": "P3220", "text": ["In run mode, the status line at the bottom of the screen would indicate \"REM RUN\" for run mode. Run mode will begin immediate evaluation of the ladder program files in the PLC memory...", "Press a function key <ESC> to abortttttttttttttttttttttttttttttttttttt"], "jumps": ["P3230"]}, {"id": "P3230", "text": ["As you can see, the PLC's mode of operations is important depending on the function you want to perform. Without being in the correct mode, certain operations cannot be performed...", "Press a function key <ESC> to abortttttttttttttttttttttttttttttttttttt"], "jumps": ["P3910"]}, {"id": "P3910", "text": ["This completes the information on CHANGING THE PLC PROCESSOR MODE."], "jumps": ["P3001", "P3100"]}, {"id": "P3920", "text": ["1. The two important modes of operation are program mode and run mode."], "jumps": ["P3930", "P3001"]}, {"id": "P3930", "text": ["2. In the program mode, files can be transferred to and from the PLC, and both data and program files can be modified."], "jumps": ["P3940", "P3920"]}, {"id": "P3940", "text": ["3. In run mode, evaluation of the processor file in the PLC memory begins immediately. Data let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
