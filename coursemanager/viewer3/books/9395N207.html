const book = {"title": "9395N207", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: MOVE AND LOGIC INSTRUCTIONS fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Understand the concepts of move instructions. w Describe the operation of move instructions. w Understand the concepts of logic instructions. w Describe the operation of logic instructions.", "w Demonstrate the usage of move and logic instructions using Allen Bradely APS software...........", "w Demonstrate the usage of move and logic instructions using Rockwell RSLOGIX software.........."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P310", "text": [], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, the operation and usage of move and logic instructions will be examined. Move instructions are used to transfer data to a new location within the PLC memory."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Logic instructions include AND, OR, XOR, and NOT. Logic instructions, like math instructions, are used to manipulate data."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["In the experiment, you will enter a ladder logic program that will demonstrate the operation of move and logic instructions."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Let's begin the lesson on MOVE AND LOGIC INSTRUCTIONS....................."], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1040", "text": ["Move instructions allow you to transfer a word of data from one location to another in the data files of a PLC. One of the best uses for move instructions is to make copies of data before changing it. This way you have a copy of the original value before it changed...", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "AND - And OR - Inclusive Or XOR - Exclusive Or NOT - Not"], "jumps": ["P1050", "P1001"]}, {"id": "P1050", "text": ["There are two move instructions used by the PLC, which are shown below. They work very similar to each other. The difference is the second one provides additional functions to the move instruction..."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["The logic instructions allow you to perform four Boolean operations on data in memory. Logical functions have many uses and are very easy to understand. The list below shows the four logic instructions..."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["Let's start by looking at the move instructions."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["The Move (MOV) instruction requires a source and destination. The source can be a location in a data file or a value directly entered into the instruction.", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "Carry - Low Overflow - Low Zero - High if result is zero, low otherwise Sign - High if result is negative, low otherwise."], "jumps": ["P1090", "P1040"]}, {"id": "P1090", "text": ["The destination is the address you want to send the data to. When this instruction is evaluated, the value pointed to by the source is copied into the destination location. This instruction also modifies the arithmetic status bits..."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["The carry bit and overflow bit are always set low. The zero bit is set high if the data moved was zero; otherwise, it is low. The sign bit is set high if the result is negative; otherwise, it is set low."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["Remember, the source can be an actual value or a location of a word in a data file. The destination must be a location of a word in a data file."], "jumps": ["P1120", "P1080"]}, {"id": "P1120", "text": ["This instruction is the Masked Move (MVM) instruction. It is similar to the Move instruction with additional functionality..", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "Carry - Low Overflow - Low Zero - High if result is zero, low otherwise Sign - High if result is negative, low otherwise."], "jumps": ["P1130", "P1080"]}, {"id": "P1130", "text": ["Masked Move requires an additional parameter called the mask. The mask allows you to copy specific bits to the destination, ignoring bits that you didn't want copied to the destination."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["This is an example of using a mask. Ones in the mask indicate you want to copy the data; zeros indicate you want those bits in the destination to remain unchanged.", "OV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "Destination 0000 0000 0000 0000 old valuee", "Destination 0000 1001 0000 0000 new valuee"], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["In this example, a BCD value stored in an integer data file is being marked to remove the ones, tens, and thousands decimal place values. The result is only the hundredth's value remaining in the destination..."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["Given the following data, what will be the result in the destination?", "OV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "Original Dest. 1010 1010 1010 1010 Valuee", "Source Value 1011 0100 1011 0100", "Mask Value 1011 0100 1011 0100"], "jumps": ["P1140"]}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1162", "text": ["The value you have selected is incorrect. Remember, ones in the mask copy the new value, and zeros leave the destination bits unchanged."], "jumps": []}, {"id": "P1170", "text": ["Now that we have looked at the move instructions, let's examine the logic instructions. The list below shows the four logic instructions that can be used with the PLC.", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "AND - And OR - Inclusive Or XOR - Exclusive Or NOT - Not"], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["All of these instructions modify data at bit level. In other words, each bit in the source is analyzed individually. For this reason, it is important to note that data can be entered into the PLC using different numbering systems...", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts"], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["When working with logic instructions, you may need to enter the data in its binary form."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["The chart below shows how to enter the same number in decimal, hexadecimal, and binary into the PLC. Notice the &B and &H operators are used to indicate the binary and hexadecimal numbering systems..."], "jumps": ["P1210", "P1180"]}, {"id": "P1210", "text": ["This instruction is the AND instruction. It requires two sources and a destination.", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "Carry - Low Overflow - Low Zero - High if result is zero, low otherwise Sign - High if result is negative, low otherwise."], "jumps": ["P1220", "P1180"]}, {"id": "P1220", "text": ["The instruction examines each source A bit and the corresponding source B bit, then AND's them together, setting the destination bit high or low accordingly. The truth table below shows what bit values put what resultant bit in the destination..."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["Just as the instruction states, if source bit A and source bit B are high, the result is a high bit. This instruction also modifies the arithmetic status bits. The table below shows the settings of these bits..."], "jumps": ["P1240", "P1210"]}, {"id": "P1240", "text": ["This instruction is the OR instruction. Just like the AND instruction, this instruction requires two sources and a destination. Note that this instruction is also known as the Inclusive OR instruction...", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "Carry - Low Overflow - Low Zero - High if result is zero, low otherwise Sign - High if result is negative, low otherwise.", "Bitwise Inclusive Or Source A Source B Dest"], "jumps": ["P1250", "P1210"]}, {"id": "P1250", "text": ["When the bits are examined, if a bit in either source A or B is high, the corresponding bit in the destination is set high. The truth table below illustrates the OR operation."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["This instruction is the Exclusive Or (XOR) instruction. Like the previous logic instructions, two sources and a destination are required.", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "Carry - Low Overflow - Low Zero - High if result is zero, low otherwise Sign - High if result is negative, low otherwise.", "Bitwise Exclusive Or Source A Source B Dest"], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["The truth table below shows the conditions which cause a high bit in the destination location. If the source bits are either both high or both low, the resultant destination bit will be low. If the source bits are opposite (one high and one low), the destination bit will be high..."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["As with the other instructions, the XOR instruction also sets the arithmetic bits as shown below. Notice only the zero and sign bits indicate any information about the destination information."], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["The last instruction we will examine is the NOT instruction. Notice this instruction only requires one source and a destination.", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "Carry - Low Overflow - Low Zero - High if result is zero, low otherwise Sign - High if result is negative, low otherwise.", "Not Source DestttttttttttstA Source B Dest"], "jumps": ["P1300", "P1260"]}, {"id": "P1300", "text": ["All bits in the source are inverted to the opposite value and placed in the destination."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["This instruction modifies the arithmetic status bits. The modifications are shown below."], "jumps": ["P1320", "P1290"]}, {"id": "P1320", "text": ["After using the NOT instruction, what is the result in the destination with this source value?", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts"], "jumps": ["P1290"]}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1322", "text": ["The answer you have selected is incorrect. Remember, the NOT instruction inverts all the bits of the source and places this value in the destination."], "jumps": []}, {"id": "P1330", "text": ["What you have seen are the move and logical instructions of a PLC. These instructions are versatile and common components of ladder logic programs.", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "AND - And OR - Inclusive Or XOR - Exclusive Or NOT - Not"], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["In the experiment, you will see how these instructions work and how they are applied in ladder logic programming."], "jumps": ["P1910", "P1330"]}, {"id": "P1910", "text": ["This completes the information on MOVE AND LOGIC INSTRUCTIONS."], "jumps": ["P1001", "P1330"]}, {"id": "P1920", "text": ["1. The Move (MOV) instruction is used to move data from one location to another.", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "Carry - Low Overflow - Low Zero - High if result is zero, low otherwise Sign - High if result is negative, low otherwise."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. The Masked Move (MVM) instruction is used to move data from one location, through a mask, and into another location.", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "Carry - Low Overflow - Low Zero - High if result is zero, low otherwise Sign - High if result is negative, low otherwise."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. The AND instruction is used to AND the bits of one source with another and place the result in a destination.", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "Carry - Low Overflow - Low Zero - High if result is zero, low otherwise Sign - High if result is negative, low otherwise."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. The OR instruction is used to OR the bits of one source with another and place the result in a destination.", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "Carry - Low Overflow - Low Zero - High if result is zero, low otherwise Sign - High if result is negative, low otherwise.", "Bitwise Inclusive Or Source A Source B Dest"], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. The Exclusive OR (XOR) instruction is used to XOR the bits of one source with another and place the result in a destination.", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "Carry - Low Overflow - Low Zero - High if result is zero, low otherwise Sign - High if result is negative, low otherwise.", "Bitwise Exclusive Or Source A Source B Dest"], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6. The NOT instruction inverts the bits of a source and places them into a destination location.", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "Carry - Low Overflow - Low Zero - High if result is zero, low otherwise Sign - High if result is negative, low otherwise.", "Not Source DestttttttttttstA Source B Dest"], "jumps": ["P1999", "P1960"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1970"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2040", "text": ["In this experiment, we will program the PLC Trainer to use some of the move and logic instructions that you have learned earlier in this lesson."], "jumps": ["P2050", "P2001"]}, {"id": "P2050", "text": ["You will create a new processor program and make the appropriate configurations.", "1. Connect the 5050 interface cable between the Nida Model 5050 PLC Trainer and the computer which has the APS software.", "+\".S///'Q'QW(1/$R/'/,6SQQeeQaVQjRd/(QueQddQ/&R6RS/QR'QQ/&&-R/'//'/(QRQ'Sd/VRQ8aQQSQRj9QR/8SdQd8'6\"&/'\"/&''VQ'RSdaQkdeRaR/jdQ'Qa/'dmerd+R1dehjeeQdgredSdQVeedgRQhhfemjdearggdeddQ8=ldrvgjdaVemaedlebRhukgneaVagkhkefRR9l9lkljerkasrl/hjRljeQedd1dQZeVVaSaRRd6Q1Ie(RdR&,/,&.6RQ'R&\"'dd,Q.&Q/./'//Q6S.(daQ1SQRQRhd(/./a(/.RddaRVeQS1(QQ/'/Q/QQ(/djdS/IQ/QQQddQe10''Q$ddQQ',1/''QQ8/(aVQ(RQQQjg.VRd(Vd(/'(aQQd1mhrVIRldQdRraaRQeeerhaqeeaQerhRVmRefRRR8dehaYbmeerkdhehaheemQ/eredammredhheaaeefQd91RRftdbmRrrW1ReRQQR/RaYkgRddmdjRamQ(/8SdVVQeQa('/Q 'a/QRVV//#/Q"], "jumps": ["P2060", "P2040", "P2070", "PQ", "P", "P11HQeVQd1We8ddRQQRearhQRdeaVbfhhdddf", "P1"]}, {"id": "P2070", "text": ["2. Start the APS software by performing the following commands at the DOS prompt of the computer which has the APS software and is attached to the PLC Trainer. a. Type 'CD \\IPDS\\ATTACH\\SLC500' and press enter. b. Type 'APS' and press enter."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["If the software did not start, see your instructor for assistance. These instructions are for default installation of the APS software and may differ from your installation."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["3. Set up a new processor file and begin editing the ladder logic program. If you need help on configuring and setting up the PLC APS software, select the help button below."], "jumps": ["P2100", "P2080", "P2095"]}, {"id": "P2095", "text": ["Follow these steps to set up the APS software for ladder logic program entry and evaluation:", "CESSOR box until '1747-L20C/F 12-DC SNK 8-RLY' is highlighted by the cursor bar. Press F2 [SELECT PROC] to select this processor. 3. Now we will select the IO modules attached to the PLC. Press F5 [CONFIGR I/O].", "1. From the main menu, select F4 [ OFFLINE CONFIG ] and then F6 [ CREATE ]. Enter a file name and press enter. You must use a filename that does not already exist and one ten characters or less. Do not forget your file name. 2. Using the up and down arrow keys, adjust the PROCESSOR box until '1747-L20C/F 12-DC SNK 8-RLY' is highlighted by the cursor bar. Press F2 [ SELECT PROC ] to select this processor. 3. Now we will select th I/O modules attached to the PLC. Press F5 [ CONFIGR I/O ]. 4. Press F4 [ MODIFY RACKS ] and then F1 [ RACK 1 ]. Rack 1 is the backplane that the other two modules will attach to. Use the cursor bar and select '1746-A2 2-slot Backplane' and press enter. 5. Use the arrow keys to highlight '*1' (Slot 1) with the cursor bar and press F5 [ MODIFY SLOT ]. Using the arrow keys again, highlight '1746-IG16 16-Input [ TTL ] (Sink) 5 VDC' and press F2 [ SELECT MODULE ]. 6. Use the arrow keys to highlight '*2' (Slot 2) with the cursor bar and press F5 [ MODIFY SLOT ]. Using the arrow keys again, highlight '1746-NI04V Analog Comb. 2 In & 2 Voltage Out' and press F2 [ SELECT MODULE ]. 7. Select F8 [ EXIT ] and F8 [ SAVE & EXIT ] and then F8 [ ACCEPT ]. 8. Press F3 [ OFFLINE PRG/DOC ] and then F1 [ PROCSSR FUNCTNS ]. We are going to change the name of our ladder logic file to be more descriptive of what it does. 9. Using the cursor bar, select File 2 and press F4 [ CHANGE FL. NAME] Enter 'T_C_TEST' and press return. The name should appear in the Name column for file 2. 10. We are now ready to edit the ladder program file. Using the arrow keys, highlight File 2 and press F8 [ MONITOR FILE ]. 11. To began editing, press F10 [ EDIT ].", "1. From the main menu, select F4 [ OFFLINE CONFIG ] and then F6 [ CREATE FILE ]. Enter a file name and press enter. You must use a filename that does not already exist and only ten characters or less. Do not forget your file name. 2. Using the up and down arrow keys, adjust the PROCESSOR box until '1747-L20C/F 12-DC SNK 8-RLY' is highlighted by the cursor bar. Press F2 [ SELECT PROC ] to select this processor. 3. Now we will select the I/O modules attached to the PLC. Press F5 [ CONFIGR I/O ]. 4. Press F4 [ MODIFY RACKS ] and then F1 [ RACK 1 ]. Rack 1 is the backplane that the other two modules will attach to. Use the cursor bar and select '1746-A2 2-slot Backplane' and press enter. 5. Use the arrow keys to highlight '*1' (Slot 1) with the cursor bar and press F5 [ MODIFY SLOT ]. Using the arrow keys again, highlight '1746-IG16 16-Input [ TTL ] (Sink) 5 VDC' and press F2 [ SELECT MODULE ]. 6. Use the arrow keys to highlight '*2' (Slot 2) with the cursor bar and press F5 [ MODIFY SLOT ]. Using the arrow keys again, highlight '1746-NI04V Analog Comb. 2 In & 2 Voltage Out' and press F2 [ SELECT MODULE ]. 7. Select F8 [ EXIT ] and F8 [ SAVE & EXIT ] and then F8 [ ACCEPT ]. 8. Press F3 [ OFFLINE PRG/DOC ] and then F1 [ PROCSSR FUNCTNS ]. We are going to change the name of our ladder logic file to be more descriptive of what it does. 9. Using the cursor bar, select File 2 and press F4 [ CHANGE FL. NAME] Enter 'S_TEST' and press return. The name should appear in the Name column for file 2. 10. We are now ready to edit the ladder program file. Using the arrow keys, highlight File 2 and press F8 [ MONITOR FILE ]. 11. To begin editing, press F10 [ EDIT ]..."], "jumps": []}, {"id": "P2100", "text": ["The program shown below is the ladder logic you will enter to demonstrate some of the move and logic instructions that you learned in the first part of this lesson."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["Before we begin entering the program into the PLC APS software, let's look at what the program should do. This will help us understand if the program is operating properly when we test it..."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["On the 5050-1 PC card, there are three switches that we will use for this program: two push button switches and a slide switch."], "jumps": ["P2130", "P2100"]}, {"id": "P2130", "text": ["The START and STOP push-buttons set the first bit of two words that will be logically evaluated. The slide switch controls which logical operation, AND or XOR."], "jumps": ["P2140", "P2100"]}, {"id": "P2140", "text": ["The first rung of the ladder logic program checks to see if the START button is pushed in. If the button is pressed in, the value 0000000000000001 is moved into word B3:0."], "jumps": ["P2150", "P2100"]}, {"id": "P2150", "text": ["By moving this value in, we only set the first bit to high. All the rest of the bits remain at zero. When we use the XOR and AND instructions, we will only be concerned with the first bit."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["The next rung again checks the START button's condition. If the START button isn't pressed, the value 0000000000000000 is moved into B3:0. This sets the first bit to low, as the rest of the bits are set..."], "jumps": ["P2170", "P2140"]}, {"id": "P2170", "text": ["Rung 3 looks to see if the STOP button is pressed in. If the STOP button is pressed in, the value 0000000000000001 is moved into B3:1. Notice that this is a different word than the one used by the START button..."], "jumps": ["P2180", "P2140"]}, {"id": "P2180", "text": ["In Rung 4, the STOP button is not pressed in, causing the value 0000000000000000 to be moved into B3:1. You can see that the START and STOP buttons perform the same operation on two words in the binary data file..."], "jumps": ["P2190", "P2140"]}, {"id": "P2190", "text": ["In the next rung, we check to see if the slide switch is in the right position. If this condition is met, the value in B3:0 is ANDed with B3:1 and placed into the output as a destination. This output is the one attached to the LEDs on the PLC Trainer...", "Dest. 0 : 0 . 0"], "jumps": ["P2200", "P2140"]}, {"id": "P2200", "text": ["Remember, only one bit is changed in both words, so only one LED will be on or off on the PLC Trainer. The LED you will be concerned with is LED 0."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["The last rung of the ladder logic program checks to see if the slide switch is in the left position. If the switch is in this position, B3:0 is XORed with B3:1 and the result is placed into the output data file, just as with the AND instruction...", "Dest. 0 : 0 . 0"], "jumps": ["P2220", "P2190"]}, {"id": "P2220", "text": ["The purpose of this program is to demonstrate a simple move instruction and verify the truth table destination results with the AND and XOR instructions.", "Dest. 0 : 0 . 0"], "jumps": ["P2230", "P2190"]}, {"id": "P2230", "text": ["The AND and XOR instructions evaluate all bits of both words; however, we set the higher bits, other than the one we are interested in, to low.", "Dest. 0 : 0 . 0"], "jumps": ["P2240", "P2190"]}, {"id": "P2240", "text": ["Let's enter the ladder logic program......................."], "jumps": ["P2250", "P2190"]}, {"id": "P2250", "text": ["Each rung is presented in order for you to type it into the APS software. If you have trouble, a help button will give you a list of steps for entering the instructions. Try to do as much as possible on your own..."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["4. Enter Rung 1 shown below..............................."], "jumps": ["P2270", "P2240", "P2265"]}, {"id": "P2265", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, XIC and then enter I:0/0. 3. Select BIT, XIC and enter I:0/2. 4. Select MOVE/LOGICAL, MOV, and enter 1 and B3:0. 5. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2270", "text": ["5. Enter Rung 2 shown below..............................."], "jumps": ["P2280", "P2260", "P2275"]}, {"id": "P2275", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, XIO and then enter I:0/0. 3. Select MOVE/LOGICAL, MOV and enter 0 and B3:0. 4. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2280", "text": ["6. Enter Rung 3 shown below..............................."], "jumps": ["P2290", "P2270", "P2285"]}, {"id": "P2285", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, XIC and then enter I:0/1. 3. Select MOVE/LOGICAL, MOV and enter 1 and B3:1. 4. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2290", "text": ["7. Enter Rung 4 shown below..............................."], "jumps": ["P2300", "P2280", "P2295"]}, {"id": "P2295", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, XIO and then enter I:0/1. 3. Select MOVE/LOGICAL, MOV and enter 0 and B3:1. 4. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2300", "text": ["8. Enter Rung 5 shown below..............................."], "jumps": ["P2310", "P2290", "P2305"]}, {"id": "P2305", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, XIC and then enter I:0/2. 3. Select MOVE/LOGICAL, AND and enter B3:0, B3:1 and O:0.0. 4. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2310", "text": ["9. Enter Rung 6 shown below..............................."], "jumps": ["P2320", "P2300", "P2315"]}, {"id": "P2315", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, XIO and then enter I:0/2. 3. Select MOVE/LOGICAL, XOR and enter B3:0, B3:1 and O:0.0. 4. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2320", "text": ["Now that we have finished entering the program, we want to load it into the PLC and test it. Make sure that you have accepted the last rung of the program."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["10. Set the PLC Trainer to the initial control settings...", "OV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "Main Power DC Power Monitor Process Selector + DC Voltage Select PC1 & PC2 Power"], "jumps": ["P2320"]}, {"id": "P2335", "text": ["INITIAL CONTROL SETTING - Main Power ON, DC Power ON, Monitor ON, Process Selector OFF, +DC Voltage Select 5V, PC1 & PC2 Power OFF."], "jumps": []}, {"id": "P2340", "text": ["11. Place the PC5050-1 card in the PC1 position..........."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["12. Set the PLC Trainer controls as follows:..............", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "+DC Voltage Select 24V PC1 Power ONNeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"], "jumps": ["P2340", "P2355"]}, {"id": "P2355", "text": ["PLC TRAINER CONTROLS - Turn the +DC Voltage Select dial fully CW to the 24V position. Push the PC1 Power switch up to the ON position."], "jumps": []}, {"id": "P2390", "text": ["The trainer is now on and set up to send our program to the trainer. Let's send our program to the trainer."], "jumps": ["P2400", "P2350"]}, {"id": "P2400", "text": ["13. Press F1 [SAVE/GO ONLINE]. If the file exists, you will be asked if you would like to overwrite it. Press F8 [YES]. If the processor is not in program mode, the APS software will ask you if it can switch to that mode. Press F8 [YES]."], "jumps": ["P2410", "P2390"]}, {"id": "P2410", "text": ["14. Once the program is sent, the APS software will ask if you would like to switch to run mode. Again, press F8 [YES]."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["With the program now running, try out the START and STOP buttons and the POWER slide switch. Observe how LED 0 changes based on the values in B3:0 and B3:1. Verify the results with the truth table shown below...", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts"], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["As you can see, the value on LED 0 represents either the AND or XOR of the first bit of the two words in memory. Again, observe the APS software screen to verify the program values."], "jumps": ["P2440", "P2420"]}, {"id": "P2440", "text": ["This completes the demonstration of the move and logical instructions. Try to create your own ladder logic and enter it into the APS software. It is easier to write your logic on paper first and then enter it into the software..."], "jumps": ["P2450", "P2420"]}, {"id": "P2450", "text": ["If you want to edit your program, select EDIT and edit DISK PROGRAM. Then follow the same steps to send the program to the PLC Trainer. The inputs and outputs are listed below.", "I :0/0 Start Switch O :0/0 Led 0 O :0/4 Led 4 I :0/1 Stop Switch O :0/1 Led 1 O :0/5 Led 5 I :0/2 Power Switch O :0/2 Led 2 O :0/6 Led 6 O :0/3 Led 3 O :0/7 Led 74"], "jumps": ["P2460", "P2420"]}, {"id": "P2460", "text": ["15. Press F3 [EXIT] or ESC and then F3, depending on where you left off in the APS software. Now select F3 [RETURN TO MENU] and then F10 [EXIT SYSTEM]."], "jumps": ["P2470", "P2450"]}, {"id": "P2470", "text": ["16. Return the PLC trainer to the initial control settings.", "OV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "Main Power DC Power Monitor Process Selector + DC Voltage Select PC1 & PC2 Power"], "jumps": ["P2460"]}, {"id": "P2480", "text": ["17. Turn OFF the PLC Trainer's main power switch.........."], "jumps": ["P2470"]}, {"id": "P2490", "text": ["18. Return all PC cards and test equipment to their proper storage location.."], "jumps": ["P2910", "P2480"]}, {"id": "P2910", "text": ["This completes the experiment on MOVE AND LOGIC INSTRUCTIONS."], "jumps": ["P2001", "P2490"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3020", "text": ["In this experiment, we will program the PLC Trainer to use some of the move and logic instructions that you have learned earlier in this lesson."], "jumps": ["P3030", "P3001"]}, {"id": "P3030", "text": ["You will create a new processor program and make the appropriate configurations."], "jumps": ["P3020"]}, {"id": "P3040", "text": ["Before we can program the PLC, we need to make sure that the software and interface are set up and operating properly."], "jumps": ["P3020"]}, {"id": "P3050", "text": ["1. Ensure the 5050 interface cable is connected between the Nida Model 5050 PLC Trainer and the computer which has the RSLinx and RSLogix software."], "jumps": ["P3020"]}, {"id": "P3060", "text": ["2. Turn on the 5050 PLC Trainer..........................."], "jumps": ["P3050"]}, {"id": "P3070", "text": ["3. Start the RSLinx communication software by double-clicking on the RSLinx icon that is on the computer desktop that has the RSLinx software and is attached to the PLC Trainer. If the software did not start, see your instructor for assistance.."], "jumps": ["P3060"]}, {"id": "P3080", "text": ["4. Now we need to know if the computer and PLC Trainer are communicating. In the right window, double-click on the AB_PIC-1 DH-485 icon."], "jumps": ["P3070"]}, {"id": "P3090", "text": ["5. Make sure that the PLC icon does not have a red \"X\" over it. If a red \"X\" is present, make sure the PLC Trainer is turned on and connected. If the PLC is still not active, see your instructor for assistance."], "jumps": ["P3070"]}, {"id": "P3100", "text": ["6. Click on the minimize button..........................."], "jumps": ["P3090"]}, {"id": "P3110", "text": ["7. Start the RSLogix software by double-clicking on the RSLogix icon the computer's desktop, which has the RSLogix software and is attached to the PLC Trainer. If the software did not start, see your instructor for assistance."], "jumps": ["P3100"]}, {"id": "P3120", "text": ["8. Click on the maximize button to bring the window to full size."], "jumps": ["P3110"]}, {"id": "P3130", "text": ["9. Set up a new processor file and begin editing the ladder logic program. If you need help on configuring and setting up the PLC RSLogix software, select the help button below.."], "jumps": ["P3120", "P3135"]}, {"id": "P3135", "text": ["Follow these steps to set up the RSLogix software for ladder logic program entry and evaluation: 1. From the standard toolbar, click on the NEW icon (icon looks like a piece of paper). 2. Enter a file name in the processor name text box. You must choose a name that does not already exist and is less than ten characters in length. Do not forget this file name. 3. Now that we have entered a filename, we will need to select the PLC type and the different I/O modules that we have attached to the system. In the case of the Nida PLC Trainer, there are two extra modules: a TTL module and an analog module. 4. At the bottom of the select processor type window, AB_PIC-1 should be displayed in the driver text box. If not displayed, click on the down-arrow and select AB_PIC-1. 5. Using the listbox scroll bar arrows, scroll until \"1747-L20C/F 12-DC SNK In, 8-RLY Out\" is displayed. Click on this PLC processor and then click on OK. 6. Two windows should appear. The left window is the project window and displays the project files. The right window is the ladder window and displays the selected ladder program. LAD2 should be displayed in the ladder window title bar. 7. Now you need to select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 8. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. 9. In the right window scroll down and double-click on the \"1746-IG16 16-Input (TTL-SOURCE) 5VDC\" module name to transfer the module information to the left window for the #1 slot of the PLC. 10. In the right window scroll down and double click on the \"1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out\" module name to transfer the module information to the left window for the #2 slot of the PLC. 11. Save the configuration settings by clicking on the I/O configuration close button. This button is the \"X\" in top right-hand corner of the I/O configuration window. 12. The processor section of your file is complete. You are now at the main window and should see the \"end\" ladder in the ladder window.", "1. From the standard toolbar, click on the NEW icon (icon looks like a piece of paper). 2. Enter a file name in the processor name text box. You must choose a name that ow. 12. The processor section of your file is complete. You are now at the main window and should see the \"end\" ladder in the ladder window.", "6. Two windows should appear. The left window is the project window and displays the project files. The right window is the ladder window and displays the selected ladder program. LAD2 should be displayed in the ladder window title bar. 7. Now you need to select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 8. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8- RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. n the 1746-IG16 16-Input (TTL-SOURCE) 5VDC module name to transfer the module information to the left window for the #1 slot of the PLC. 10. In the right window scroll down and double click on the 1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out module name to transfer the module information to the left window for the #2 slot of the PLC. 11. Save the configuration settings by clicking on the I/O configuration close button. This button is the X in top right-hand corner of the I/O configuration window. 12. The processor section of your file is complete. You are now at the main window and should see the end ladder in the ladder window."], "jumps": []}, {"id": "P3137", "text": ["Follow these steps to set up the RSLogix software for ladder logic program entry and evaluation: 1. From the standard toolbar, click on the NEW icon (icon looks like a piece of paper). 2. Enter a file name in the processor name text box. You must choose a name that does not already exist and is less than ten characters in length. Do not forget this file name. 3. Now that we have entered a filename, we will need to select the PLC type and the different I/O modules that we have attached to the system. In the case of the Nida PLC Trainer, there are two extra modules: a TTL module and an analog module. 4. At the bottom of the select processor type window, AB_PIC-1 should be displayed in the driver text box. If not displayed, click on the down-arrow and select AB_PIC-1. 5. Using the listbox scroll bar arrows, scroll until \"1747-L20C/F 12-DC SNK In, 8-RLY Out\" is displayed. Click on this PLC processor and then click on OK. 6. Two windows should appear. The left window is the project window and displays the project files. The right window is the ladder window and displays the selected ladder program. LAD2 should be displayed in the ladder window title bar. 7. Now you need to select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 8. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. 9. In the right window scroll down and double-click on the \"1746-IG16 16-Input (TTL-SOURCE) 5VDC\" module name to transfer the module information to the left window for the #1 slot of the PLC. 10. In the right window scroll down and double click on the \"1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out\" module name to transfer the module information to the left window for the #2 slot of the PLC. 11. Save the configuration settings by clicking on the I/O configuration close button. This button is the \"X\" in top right-hand corner of the I/O configuration window. 12. The processor section of your file is complete. You are now at the main window and should see the \"end\" ladder in the ladder window.", "9. In the right window scroll down and double-click on the 1746-IG16 16-Input (TTL-SOURCE) 5VDC module name to transfer the module information to the left window for the #1 slot of the PLC. 10. In the right window scroll down and double click on the 1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out module name to transfer the module information to the left window for the #2 slot of the PLC. 11. Save the configuration settings by clicking on the I/O configuration close button. This button is the X in top right-hand corner of the I/O configuration window. 12. The processor section of your file is complete. You are now at the main window and should see the end ladder in the ladder window.."], "jumps": []}, {"id": "P3140", "text": ["The program below is the ladder logic program you will enter to demonstrate some of the move and logic instructions that you learned in the first part of this lesson."], "jumps": ["P3150", "P3130"]}, {"id": "P3150", "text": ["Before we begin entering the program into the PLC RSLogix software, let's look at what the program should do. This will help us understand if the program is operating properly when we test it.."], "jumps": ["P3160", "P3140"]}, {"id": "P3160", "text": ["On the 5050-1 PC card, there are three switches that we will use for this program: two push button switches and a slide switch."], "jumps": ["P3170", "P3140", "P"]}, {"id": "P3170", "text": ["The START and STOP push buttons set the first bit of two words that will be logically evaluated. The slide switch controls which logical operation, AND or XOR is used."], "jumps": ["P3180", "P3160"]}, {"id": "P3180", "text": ["The first rung of the ladder logic program checks to see if the START button is pushed. If the button is pressed, the value 0000000000000001 is moved into word B3:0."], "jumps": ["P3190", "P3170"]}, {"id": "P3190", "text": ["By moving this value in, we only set the first bit to high. All the rest of the bits remain at zero. When we use the XOR and AND instructions, we well only be concerned with the first bit."], "jumps": ["P3200", "P3180"]}, {"id": "P3200", "text": ["The next rung again checks the START button's condition. If the START button is not pressed, the value 0000000000000000 is moved into B3:0. This sets the first bit to low, as the rest of the bits are set."], "jumps": ["P3210", "P3180"]}, {"id": "P3210", "text": ["Rung 3 looks to see if the STOP button is pressed. If the STOP button is pressed, the value 0000000000000001 is moved into B3:1. Notice that this is a different word than the one used by the START button."], "jumps": ["P3220", "P3180"]}, {"id": "P3220", "text": ["In Rung 4, the STOP button is not pressed, causing the value 0000000000000000 to be moved into B3:1. You can see that the START and STOP buttons perform the same operation on two words in the binary data file.."], "jumps": ["P3230", "P3180"]}, {"id": "P3230", "text": ["In the next rung, we check to see if the slide switch is in the right position. If this condition is met, the value in B3:0 is ANDed with B3:1 and placed into the output as a destination. This output is the one attached to the LEDs on the PLC trainer.", "Dest. 0 : 0 . 0"], "jumps": ["P3240", "P3180"]}, {"id": "P3240", "text": ["Remember, only one bit is changed in both words, so only one LED will be on or off on the PLC trainer. The LED you will be concerned with is LED 0."], "jumps": ["P3250", "P3230"]}, {"id": "P3250", "text": ["The last rung of the ladder logic program checks to see if the slide switch is in the left position. If the switch is in this position, B3:0 is XORed with B3:1 and the result is placed into the output data file, just as with the AND instruction..", "Dest. 0 : 0 . 0"], "jumps": ["P3260", "P3230"]}, {"id": "P3260", "text": ["The purpose of this program is to demonstrate a simple move instruction and verify the truth table destination results with the AND and XOR instructions.", "Dest. 0 : 0 . 0"], "jumps": ["P3270", "P3230"]}, {"id": "P3270", "text": ["The AND and XOR instructions evaluate all bits of both words; however, we set the higher bits, other than the one we are interested in, to low."], "jumps": ["P3280", "P3230"]}, {"id": "P3280", "text": ["Let's enter the ladder logic program......................."], "jumps": ["P3290", "P3230"]}, {"id": "P3290", "text": ["Each rung is presented in order for you to type it into the RSLogix software. If you have trouble, a help button will give you a list of steps for entering the instructions. Try to do as much as possible on your own..."], "jumps": ["P3300", "P3280"]}, {"id": "P3300", "text": ["10. Enter rung 1 shown below..............................", "Move Source Dest................urce B Dest.", "1 B3 : 0 : 0.0 0.0 rce A Source B Dest."], "jumps": ["P3310", "P3280", "P3305"]}, {"id": "P3305", "text": ["RUNG 1rung. Highlight the number to the left of the end rung to select the end rung. Click on the user tab. Click on the new rung icon. 2. Add an XIC instruction. Click on the bit tab and then click on the XIC icon. Type I:0/0 and press <ENTER>. 3. Add a MOV instruction. Click on the move/logical tab (use the right arrow next to the tabs to scroll to the move/logical tab) and then click on MOV. For the source, type 1 and press <ENTER>. For the destination type B3:0 and press <ENTER>. 4. Verify the rung. Click on the verify icon.", "1. Add a rung. Highlight the number to the left of the end rung to select the end rung. Click on the user tab. Click on the new rung icon. 2. Add an XIC instruction to the new rung. Click on the bit tab, and then click on the XIC icon. Type I:0/0 and press <ENTER>. 3. Add a MOV instruction. Click on the move/logical tab (use the right arrow next to the tabs to scroll to the move/logical tab) and then click on MOV. For the source, type 1 and press <ENTER>. For the destination type B3:0 and press <ENTER>. 4. Verify the rung. Click on the verify icon..ss <ENTER>. 5. Verify the rung. Click on the verify icon ( looks like a computer with a green check mark over it."], "jumps": ["P3300"]}, {"id": "P3310", "text": ["11. Enter rung 2 shown below..............................", "Move Source Dest................urce B Dest.", "0 B3 : 0 : 0.0 0.0 rce A Source B Dest."], "jumps": ["P3320", "P3300", "P3315"]}, {"id": "P3315", "text": ["RUNG 222ng. Highlight the number to the left of the end run nloaded. A confirmation box will display asking if you want to change back to run mode. Click on yes. 6. A confirmation box will display asking if you want to go online. Click on yes. istbox scroll bar arrows, scroll until 1747-L20C/F 12-DC SNK In, 8-RLY Out is displayed. Click on this PLC processor and then click on OK. 6. Two windows should appear. The left window is the project window and displays the project files. The right window is the ladder window and displays the selected ladder program. LAD2 should be displayed in the ladder window title bar. 7. Now you need to select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 8. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. 9. In the right window scroll down and double-click on the 1746-IG16 16-Input (TTL-SOURCE) 5VDC module name to transfer the module information to the left window for the #1 slot of the PLC. 10. In the right window scroll down and double click on the 1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out module name to transfer the module information to the left window for the #2 slot of the PLC. 11. Save the configuration settings by clicking on the I/O configuration close button. This button is the X in top right-hand corner of the I/O configuration window. 12. The processor section of your file is complete. You are now at the main window and should see the end ladder in the ladder window."], "jumps": []}, {"id": "P3430", "text": ["With the program now running, try out the START and STOP buttons and the POWER slide switch. Observe how LED 0 changes based on the values in B3:0 and B3:1. Verify the results with the truth table shown below...", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts"], "jumps": ["P3440", "P3420"]}, { let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
