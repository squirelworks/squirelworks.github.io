const book = {"title": "93953206", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: COMMON COLLECTOR AMPLIFIERd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe methods to determine class of operation. w Describe methods to determine voltage gain.", "w Describe the operating characteristics of a common collector amplifier. w Describe the purpose of individual components in a common collector amplifier."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["This lesson teaches the common collector amplifier circuit."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["This is a Common Collector because the input is applied to the base, the output is taken from the emitter and the collector is common."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["The common collector amplifier matches a high input resistance source to a low output resistance load.", "Voltage Gain - Low Current Gain - High Power Gain - Medium Input Resistance - High Output Resistance - Low"], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Also, the common collector amplifier is used as a current source due to the high current gain.", "Voltage Gain - Low Current Gain - High Power Gain - Medium Input Resistance - High Output Resistance - Low"], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on COMMON COLLECTOR AMPLIFIER......................"], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["This is a typical common collector amplifier circuit, also known as an emitter-follower."], "jumps": ["P1025", "P1001"]}, {"id": "P1025", "text": ["For this discussion an NPN transistor is used. Note that Vcc is positive."], "jumps": ["P1030", "P1020"]}, {"id": "P1030", "text": ["The amplifier's output is controlled by the input signal."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The output signal is a replica of the input signal."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["The amplifier has two basic circuits:\n1. Input  - Base to Collector \n2. Output - Collector to Emitter", "The amplifier has two basic circuits: 1. Input - Base to Collector 2. Output - Collector to Emitterrrrrrrrrrrrrrrrrrrrrrrrr"], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["Note, the collector is common to both circuits. \n1. Input   - Base to Collector \n2. Output - Collector to Emitter", "Note, the collector is common to both circuits. 1. Input - Base to Collector 2. Output - Collector to Emitterrr"], "jumps": ["P1075", "P1060"]}, {"id": "P1075", "text": ["This means that a change in one circuit effects the other circuit."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["A changing input signal changes the bias voltage on the base of the transistor."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["When the input signal increases, the bias voltage increases."], "jumps": ["P1100", "P1060"]}, {"id": "P1100", "text": ["An increase in bias voltage increases current flow in the emitter collector circuit."], "jumps": ["P1110", "P1060"]}, {"id": "P1110", "text": ["When the input signal decreases, the bias voltage decreases."], "jumps": ["P1120", "P1060"]}, {"id": "P1120", "text": ["A decrease in bias voltage decreases current flow in the emitter collector circuit."], "jumps": ["P1130", "P1060"]}, {"id": "P1130", "text": ["The effects of a changing input signal are seen in a changing output signal."], "jumps": ["P1140", "P1060"]}, {"id": "P1140", "text": ["Note, an increasing input signal produces an increasing output signal."], "jumps": ["P1150", "P1060"]}, {"id": "P1150", "text": ["A decreasing input signal produces a decreasing output signal."], "jumps": ["P1160", "P1060"]}, {"id": "P1160", "text": ["The input signal controlled the output signal."], "jumps": ["P1170", "P1060"]}, {"id": "P1170", "text": ["In a common collector amplifier, when the base voltage increases the emitter current _______"], "jumps": ["P1060"]}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1172", "text": ["When the base voltage increases, the forward biased emitter to base PN junction increases. Emitter current will not decrease."], "jumps": []}, {"id": "P1173", "text": ["When the base voltage increases, the forward biased emitter to base PN junction increases. Emitter current will not stay the same."], "jumps": []}, {"id": "P1180", "text": ["In a common collector amplifier, when base voltage decreases, output voltage _______"], "jumps": ["P1170"]}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1182", "text": ["A decrease in base voltage causes the emitter current to decrease.  The decreased current changes the output voltage.", "A decrease in base voltage causes the emitter current to decrease. The decreased current changes the output voltage."], "jumps": []}, {"id": "P1190", "text": ["Transistor bias is determined by R1, R2 and R3.", "Transistor bias is determined by R1, R2 and R3............."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["When an input signal is applied to the base of Q1, it's combined with the fixed bias voltage established by R1 and R2."], "jumps": ["P1205", "P1190"]}, {"id": "P1205", "text": ["R1 and R2 form a voltage divider that is operated by +Vcc.  A fixed bias is always present on the base of Q1.", "R1 and R2 form a voltage divider that is operated by +Vcc. A fixed bias is always present on the base of Q1..."], "jumps": ["P1210", "P1190"]}, {"id": "P1206", "text": ["VOLTAGE DIVIDER - A voltage divider reduces the applied voltage. The voltage at the top of R1 is Vcc. R1 reduces Vcc so the voltage at the bottom of R1 is less than Vcc. R2 drops the rest of the voltage."], "jumps": []}, {"id": "P1208", "text": ["R1 and R2 form a voltage divider that is operated by +Vcc. A fixed bias is always present on the base of Q1.", "R1 and R2 form a voltage divider that is operated by +Vcc. A fixed bias is always present on the base of Q1..."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["Any change in the fixed bias of Q1 produces a predicted change at the output."], "jumps": ["P1220", "P1208"]}, {"id": "P1220", "text": ["The collector is biased by +Vcc."], "jumps": ["P1230", "P1208"]}, {"id": "P1230", "text": ["The output signal is determined by emitter load resistor R3."], "jumps": ["P1240", "P1208"]}, {"id": "P1240", "text": ["When the emitter to collector current increases, more voltage drops across R3 and the output signal increases."], "jumps": ["P1250", "P1208"]}, {"id": "P1250", "text": ["When current decreases, less voltage is developed across R3 and the output signal decreases."], "jumps": ["P1260", "P1208"]}, {"id": "P1260", "text": ["The result is a signal on the output that is a replica of the input signal."], "jumps": ["P1270", "P1208"]}, {"id": "P1270", "text": ["Now, let's add two important components to the amplifier circuit, C1 and C2."], "jumps": ["P1280", "P1208"]}, {"id": "P1280", "text": ["C1 is an input coupling capacitor that has 2 purposes.  It prevents DC voltage from reaching the base of the transistor.  It", "C1 is an input coupling capacitor that has 2 purposes. It prevents DC voltage from reaching the base of the transistor. It", "C1 is an input coupling capacitor that has 2 purposes. It prevents DC voltage from reaching the base of the transistor. It also couples the AC signal from the previous stage to the base of the transistor..."], "jumps": ["P1290", "P1208"]}, {"id": "P1290", "text": ["C2 is an output coupling capacitor and prevents the DC bias on the emitter from reaching the output."], "jumps": ["P1300", "P1208"]}, {"id": "P1300", "text": ["The coupling capacitors do not effect the DC collector bias voltage from Vcc."], "jumps": ["P1310", "P1208"]}, {"id": "P1310", "text": ["Touch the component(s) that establish the base bias.", "Touch the component(s) that establish the base bias........"], "jumps": ["P1208"]}, {"id": "P1311", "text": [], "jumps": []}, {"id": "P1312", "text": ["C1 and C2 are the coupling capacitors. C1 stops DC voltages on the input and C2 stops DC voltages on the output.  Neither C1 or C2 establish base bias.", "C1 and C2 are the coupling capacitors. C1 stops DC voltages on the input and C2 stops DC voltages on the output. Neither C1 or C2 establish base bias."], "jumps": []}, {"id": "P1313", "text": ["You touched the emitter load resistor. R3 develops the output signal."], "jumps": []}, {"id": "P1314", "text": ["You touched the output coupling capacitor. C2 prevents the DC bias on the emitter from reaching the output."], "jumps": []}, {"id": "P1320", "text": ["Touch the component(s) that develops the output signals.", "Touch the component(s) that develops the output signals...."], "jumps": ["P1310"]}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1322", "text": ["You touched C1, the input coupling capacitor. C1 prevents DC voltages from reaching the transistor base."], "jumps": []}, {"id": "P1323", "text": ["You touched the components that establish base bias. R1 and R2 form a voltage divider."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on COMMON COLLECTOR AMPLIFIER."], "jumps": ["P1001", "P1320"]}, {"id": "P1920", "text": ["1.  The common collector amplifier has the input applied to the            base, the output is taken from the emitter, and the collector is        common.", "1. The common collector amplifier has the input applied to the base, the output is taken from the emitter, and the collector is common."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  In a common collector amplifier, an AC input signal controls           the output signal.", "2. In a common collector amplifier, an AC input signal controls the output signal."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  C1 and C2 are coupling capacitors that pass AC and block DC.", "3. C1 and C2 are coupling capacitors that pass AC and block DC."], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["4.  R1 and R2 form a voltage divider that develops the base bias.", "4. R1 and R2 form a voltage divider that develops the base bias."], "jumps": ["P1960", "P1920"]}, {"id": "P1960", "text": ["5.  R3 is the emitter load resistor that develops the output signal.", "5. R3 is the emitter load resistor that develops the output signal."], "jumps": ["P1999", "P1920"]}, {"id": "P1999", "text": ["You have completed the Summary. \nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.."], "jumps": ["P1001", "P1920"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["The class of operation and the voltage gain (Av) are needed to identify normal operation of a common collector."], "jumps": ["P2030", "P2001", "P2025"]}, {"id": "P2025", "text": ["COMMON COLLECTOR AMPLIFIER CLASS OF OPERATION", "Transistor conducts for the entire duration of input signal.", "Transistor conducts for half of the input signal.put signal.", "Transistor conducts for less than half of the input signal.l."], "jumps": []}, {"id": "P2030", "text": ["Class of operation is determined by the bias placed on the base of Q1 by R1 and R2."], "jumps": ["P2040", "P2020", "P2025"]}, {"id": "P2032", "text": ["Class of operation is determined by the bias placed on the base of Q1 by R1 and R2."], "jumps": ["P2040", "P2020", "P2025"]}, {"id": "P2040", "text": ["The voltage gain is determined by the base to emitter PN junction."], "jumps": ["P2050", "P2032"]}, {"id": "P2050", "text": ["If class of operation and voltage gain are known, normal operation is determined by comparing input and output signals."], "jumps": ["P2060", "P2032"]}, {"id": "P2060", "text": ["The voltage gain of a common collector amplifier is always 1. This class A common collector circuit shows normal operation."], "jumps": ["P2070", "P2032", "P2065"]}, {"id": "P2062", "text": ["The voltage gain of a common collector amplifier is always 1. This class A common collector circuit shows normal operation."], "jumps": ["P2070", "P2032", "P2065"]}, {"id": "P2065", "text": ["Collector current (Ic) b = Base current (Ib) Base current (Ib)", "The normal b value is found in a transistor reference book and compared to the measured b.", "Collector current (Ic) Base current (Ib) rent (Ib) Ib) Base current (Ib)", "b = Base current (Ib)", "COMMON COLLECTOR ATTRIBUTES - Av = 1 The common collector amplifier does not amplify voltage but has a high current gain."], "jumps": []}, {"id": "P2070", "text": ["The 6 V bias at Q1 verifies class A.  Dividing Eout by Ein verifies Av of 1.", "The 6 V bias at Q1 verifies class A. Dividing Eout by Ein verifies Av of 1. Eout 1 Av =", "= 1 Ein 1"], "jumps": ["P2080", "P2062"]}, {"id": "P2080", "text": ["If the bias on Q1 is changed to .6 V, the class of operation becomes class B."], "jumps": ["P2090", "P2062"]}, {"id": "P2090", "text": ["The input to output comparison shows normal operation for a class B common collector."], "jumps": ["P2100", "P2062"]}, {"id": "P2100", "text": ["The actual component values determine the class of operation. The transistor sets the voltage gain at 1."], "jumps": ["P2110", "P2062"]}, {"id": "P2110", "text": ["Let's calculate the base bias on Q1 to determine the class of operation."], "jumps": ["P2120", "P2062"]}, {"id": "P2120", "text": ["R1 and R2 form a voltage divider. The voltage felt between R1 and R2 is applied as Q1 bias voltage (Eb).", "R1 and R2 form a voltage divider. The voltage felt between R1 and R2 is applied as Q1 bias voltage (Eb).."], "jumps": ["P2130", "P2062", "P2125"]}, {"id": "P2122", "text": ["R1 and R2 form a voltage divider. The voltage felt between R1 and R2 is applied as Q1 bias voltage (Eb).", "R1 and R2 form a voltage divider. The voltage felt between R1 and R2 is applied as Q1 bias voltage (Eb).."], "jumps": ["P2130", "P2062", "P2125"]}, {"id": "P2125", "text": ["CALCULATING Eb - The voltage on the base (Eb) equals the voltage between R1 and R2, or Er2. Remember, R1 and R2 form a voltage divider."], "jumps": ["P2127"]}, {"id": "P2127", "text": ["CALCULATING Eb - Follow these steps to find Eb:", "1. Find Rt: Rt + R2 = 8 k + 8 k = 16 k 2. Solve for It: It = Ea", "16 k = .75 mA 3. Calculate Eb: Er2 = It x R2 = .75 mA x 8 k = 6 V", "1. Find Rt: R1 + R2 = 8 k + 8 k = 16 k 2. Solve for It: It = Ea", "16 k = .75 mA 3. Calculate Eb: Er2 = It x R2 = .75 mA x 8 k = 6 V x R2 = .75 mA x 8 k = 6 V 3. Calculate Eb: Er2 = It x R2 = .75 mA x 8 k = 6 V mA x 8 k = 6 V 3. Calculate Eb: Er2 = It x R2 = .75 mA x 8 k = 6 V"], "jumps": ["P2125"]}, {"id": "P2130", "text": ["Recall that .6 V is needed to forward bias the base to emitter PN  junction.", "Recall that .6 V is needed to forward bias the base to emitter PN junction."], "jumps": ["P2140", "P2122"]}, {"id": "P2140", "text": ["This common collector is biased to 6 V or above cutoff. This value indicates class A operation."], "jumps": ["P2150", "P2122", "P2025"]}, {"id": "P2142", "text": ["This common collector is biased to 6 V or above cutoff. This value indicates class A operation."], "jumps": ["P2150", "P2122", "P2025"]}, {"id": "P2150", "text": ["Determine the class of operation for this common collector circuit."], "jumps": ["P2142", "P2155"]}, {"id": "P2151", "text": [], "jumps": []}, {"id": "P2152", "text": ["With .3 VDC on the base, the transistor is biased at cutoff. Class A operation requires the transistor to be biased above cutoff."], "jumps": []}, {"id": "P2153", "text": ["With .3 VDC on the base, the transistor is biased below cutoff. Class B operation requires the transistor to be biased at cutoff."], "jumps": []}, {"id": "P2155", "text": ["CALCULATING Eb - The voltage on the base (Eb) equals the voltage between R1 and R2, or Er2. Remember, R1 and R2 form a voltage divider."], "jumps": ["P2158", "P2150"]}, {"id": "P2158", "text": ["CALCULATING Eb - Follow these steps to find Eb:", "1. Find Rt: Rt = R1 + R2 2. Solve for It: It = Ea", "Rt 3. Calculate Eb: Er2 = It x R2"], "jumps": ["P2164", "P2155"]}, {"id": "P2160", "text": ["Once the class of operation is determined, the gain (Av) is found by comparing the input and output signals."], "jumps": ["P2170", "P2150"]}, {"id": "P2164", "text": ["COMMON COLLECTOR AMPLIFIER CLASS OF OPERATION", "Transistor conducts for the entire duration of input signal.", "Transistor conducts for half of the input signal.put signal.", "Transistor conducts for less than half of the input signal.l."], "jumps": ["P2150", "P2155"]}, {"id": "P2170", "text": ["The actual gain of a common collector is determined by this formula:", "The actual gain of a common collector is determined by this formula: Av ="], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["If the expected gain is 1, using the formula verifies this value.", "If the expected gain is 1, using the formula verifies this value. t 1 Av =", "= 1 Ein 1"], "jumps": ["P2190", "P2160"]}, {"id": "P2190", "text": ["Let's see why Av is 1 in a common collector amplifier."], "jumps": ["P2200", "P2160"]}, {"id": "P2200", "text": ["With no input, the voltage on the base is 6 V."], "jumps": ["P2210", "P2160", "P2125"]}, {"id": "P2202", "text": ["With no input, the voltage on the base is 6 V.", "With no input, the voltage on the base is 6 V.............."], "jumps": ["P2210", "P2160", "P2125"]}, {"id": "P2210", "text": ["The voltage drop across the base to emitter PN junction is about .6 V. This places 5.4 V on the emitter."], "jumps": ["P2220", "P2202"]}, {"id": "P2220", "text": ["The 5.4 V on the emitter is DC which is blocked by C2. The output is 0 VDC."], "jumps": ["P2230", "P2202"]}, {"id": "P2230", "text": ["A 1 Vpp input changes the base voltage from 6 V to a range of 6.5 to 5.5 V."], "jumps": ["P2240", "P2202"]}, {"id": "P2240", "text": ["The emitter voltage changes from 5.4 V to a range of 5.9 to 4.9 V."], "jumps": ["P2250", "P2202"]}, {"id": "P2245", "text": ["CALCULATING Ie - Ohm's law is used to find emitter current (Ie):"], "jumps": []}, {"id": "P2250", "text": ["The changing emitter voltage passes through C2 producing a 1 Vpp output."], "jumps": ["P2260", "P2202"]}, {"id": "P2260", "text": ["Remember, even though the voltage gain is 1 the AC current gain is large. Base current is small, emitter current is large."], "jumps": ["P2910", "P2202"]}, {"id": "P2910", "text": ["This completes the information on COMMON COLLECTOR CIRCUIT VALUES."], "jumps": ["P2001", "P2202"]}, {"id": "P2920", "text": ["1.  Component values determine the normal operation.", "1. Component values determine the normal operation.here..."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2.  R1 and R2 determine class of operation.", "2. R1 and R2 determine class of operation."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3.  The base to emitter PN junction determines the voltage gain of      1.", "3. The base to emitter PN let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
