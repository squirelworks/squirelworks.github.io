<script>
const book = {"title": "93955201", "pages": [{"id": "P0", "text": ["Nida Corporation 2003-2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003-2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . I .", "Title: DC MOTORSE sdf sdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Operate the DC Series Field Motor. w Operate the DC Shunt Field Motor. w Operate the DC Compound Field Motor.", "w Describe the DC Series Field Motor. w Describe the DC Shunt Field Motor. w Describe the DC Compound Field Motor. w Describe basic DC Motor action."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "3. Nida Model 280 Rotating Machinery Trainer"], "jumps": []}, {"id": "P330", "text": ["Nida Model 280 Rotating Machinery Trainer"], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P350", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about DC Motors."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["DC Motors represent a large portion of Rotating Machinery.."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Many of today's most common devices use DC Motors.........."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["There are three basic types of DC Motors: Shunt, Series and Compound. Their principles of operation are quite similar."], "jumps": ["P436", "P420"]}, {"id": "P436", "text": ["You will be introduced to all three types of DC Motors."], "jumps": ["P440", "P430"]}, {"id": "P440", "text": ["Let's begin the lesson on DC MOTOR.ITLE..................................."], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Electric motors are devices that convert electrical energy into mechanical energy."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["One type of electric motor is called the DC Motor."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The DC Motor uses Direct Current (DC) as its electrical power supply."], "jumps": ["P1450", "P1020"]}, {"id": "P1050", "text": ["The way the field windings are connected produces the three types of Electromagnetic DC Motors."], "jumps": ["P1070", "P1700"]}, {"id": "P1070", "text": ["The field coil windings of a DC Motor are represented as an inductor."], "jumps": ["P1050"]}, {"id": "P1120", "text": ["The schematic symbol for a basic Electromagnetic DC Motor shows the brushes, armature, and field coil."], "jumps": ["P1160", "P1070"]}, {"id": "P1160", "text": ["The DC Shunt Field Motor shows the field coil in parallel with the armature."], "jumps": ["P1170", "P1120"]}, {"id": "P1170", "text": ["The DC Series Field Motor shows the field coil in series with the armature."], "jumps": ["P1180", "P1120"]}, {"id": "P1180", "text": ["The Compound Motor contains a Shunt and Series Field Coil.."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["The Compound Motor has two basic configurations: Long and Short Shunt."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["The Long Shunt Compound Motor has the Shunt Coil in parallel to the Series Field Coil and Armature."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["The Short Shunt Compound Motor has the Shunt Coil in parallel with the armature only."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["Which schematic illustrates a DC Shunt Field Motor:........"], "jumps": ["P1210"]}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1222", "text": ["The schematic you selected represents a DC Series Motor. Notice the coil is in series with the armature."], "jumps": []}, {"id": "P1223", "text": ["The schematic you selected is configured as a Short Shunt Compound Motor. The shunt coil is in parallel with the armature and there is also a series coil shown."], "jumps": []}, {"id": "P1230", "text": ["A long shunt DC Motor has a Shunt Coil in parallel with _______"], "jumps": ["P1220"]}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1232", "text": ["A Short Shunt Compound Motor has a Shunt Field Coil in parallel with the armature only."], "jumps": []}, {"id": "P1233", "text": ["The Shunt Field Coil must be placed either in parallel or in series with the armature."], "jumps": []}, {"id": "P1240", "text": ["To vary the speed of a DC Shunt Motor, the current through the armature (IA) or the current through the Field Coil (IF) must be varied."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["By varying the armature voltage (Varm), IA and IF can be varied."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["The Field Current (IF) can also be controlled by placing a variable resistor in series with the Shunt Field Coil."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["The DC Series motor speed can also be varied by changing the armature voltage, (Varm or the field current (IF))."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["When the armature voltage is varied, current flowing through the Series Field Coil will vary."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["By placing a variable resistor in parallel with the Series Field Coil, the coil current (IF) can also be varied."], "jumps": ["P1300", "P1270"]}, {"id": "P1300", "text": ["The Long Shunt Compound DC Motor incorporates both the Shunt and Series Motor speed control techniques."], "jumps": ["P1310", "P1270"]}, {"id": "P1310", "text": ["Varm can be varied to change both Shunt IF and Series IF."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["The most common technique for varying field currents (IF) is to place variable resistors in the circuit."], "jumps": ["P1330", "P1300"]}, {"id": "P1330", "text": ["How is speed control performed in a DC Motor?..............", "Vary the current through either the armature or the coil."], "jumps": ["P1300"]}, {"id": "P1331", "text": [], "jumps": []}, {"id": "P1332", "text": ["Varying the current through the coil controls motor speed, but there is also another way to control speed."], "jumps": []}, {"id": "P1333", "text": ["Varying the current through the armature controls motor speed, but there is also another way to control speed."], "jumps": []}, {"id": "P1340", "text": ["What is the most commonly used component to vary the current through the coil of a DC Motor?K"], "jumps": ["P1330"]}, {"id": "P1341", "text": [], "jumps": []}, {"id": "P1342", "text": ["A variable current source would work but it is not the most common technique used."], "jumps": []}, {"id": "P1343", "text": ["A variable voltage source would work, but it is not the most common technique used."], "jumps": []}, {"id": "P1350", "text": ["Each of the DC Motors has a specific application..........."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["For example, the Shunt Motor is used when high speed and constant torque are required."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["The Shunt Motor also has less torque when the Rotor is locked and no motor rotation is present."], "jumps": ["P1380", "P1350"]}, {"id": "P1380", "text": ["The Series Motor has less torque at higher speeds than the Shunt Motor."], "jumps": ["P1390", "P1350"]}, {"id": "P1390", "text": ["The Series Motor has more torque under locked Rotor conditions."], "jumps": ["P1400", "P1350"]}, {"id": "P1400", "text": ["You may have felt the pain of a twisted wrist due to high torque when a Series Motor is suddenly stopped."], "jumps": ["P1410", "P1350"]}, {"id": "P1410", "text": ["Due to its high torque, a Series Motor is less likely to stall due to a heavy load."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["A Compound Motor has the characteristics of both a Series and Shunt Motor."], "jumps": ["P1430", "P1400"]}, {"id": "P1430", "text": ["The Compound Motor can be configured to exhibit good torque at high speeds and under locked rotor conditions."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["In the next three lessons, you will study the three types of DC Motors individually."], "jumps": ["P1910", "P1420"]}, {"id": "P1450", "text": ["Let's see the basic principles of DC Motor action."], "jumps": ["P1460", "P1020"]}, {"id": "P1460", "text": ["First, a magnetic field is produced using two magnets. S N S N"], "jumps": ["P1470", "P1020"]}, {"id": "P1470", "text": ["Note that the magnets are not allowed to attract each other."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["A rotating magnet is placed between the other two magnets. vot"], "jumps": ["P1460"]}, {"id": "P1490", "text": ["Because like poles repel and unlike poles attract, the center magnet rotates."], "jumps": ["P1500", "P1480"]}, {"id": "P1500", "text": ["The attraction of unlike poles causes the center magnet to stop."], "jumps": ["P1520", "P1480"]}, {"id": "P1520", "text": ["When the poles of the center magnet change, rotation will occur."], "jumps": ["P1530", "P1500"]}, {"id": "P1530", "text": ["By continually changing the poles of the center magnet, motor action occurs."], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["This is basic motor action. However, the center magnet can not be a permanent magnet.anent magnet."], "jumps": ["P1550", "P1530"]}, {"id": "P1550", "text": ["Since the poles of a permanent magnet can't be changed, an electromagnet is used."], "jumps": ["P1570", "P1540"]}, {"id": "P1570", "text": ["By reversing the DC current flow, the center magnet changes poles."], "jumps": ["P1580", "P1540"]}, {"id": "P1580", "text": ["The center electromagnet is called the Armature or Rotor."], "jumps": ["P1590", "P1540"]}, {"id": "P1590", "text": ["The actual construction of the DC Motor shows the armature as a coil."], "jumps": ["P1600", "P1540"]}, {"id": "P1600", "text": ["The armature is connected to the voltage source, Varm, through brushes and commutator."], "jumps": ["P1610", "P1590"]}, {"id": "P1610", "text": ["The commutator rotates along with the armature. The brushes connect the commutator to Varm."], "jumps": ["P1620", "P1590"]}, {"id": "P1620", "text": ["This allows the direction of current flow to change each 180", "of rotation, reversing the poles in the armature.."], "jumps": ["P1590"]}, {"id": "P1630", "text": ["Because the poles in the armature reverse, motor action occurs."], "jumps": ["P1640", "P1590"]}, {"id": "P1640", "text": ["Since DC is applied, the rotating machine is a DC Motor."], "jumps": ["P1650", "P1630"]}, {"id": "P1650", "text": ["The schematic symbol for this type of DC Motor shows the armature and brushes."], "jumps": ["P1660", "P1630"]}, {"id": "P1660", "text": ["It is called a permanent magnet DC Motor because the armature is placed between two permanent magnets."], "jumps": ["P1670", "P1650"]}, {"id": "P1670", "text": ["The permanent magnets are called the Stator."], "jumps": ["P1680", "P1660"]}, {"id": "P1680", "text": ["The most commonly used type of DC Motor is the electromagnetic design.", "Stator Coil or Field Coil"], "jumps": ["P1690", "P1660"]}, {"id": "P1690", "text": ["Instead of a permanent magnet stator, an electromagnet stator is used."], "jumps": ["P1700", "P1680"]}, {"id": "P1700", "text": ["The coils around the stator are the field windings........."], "jumps": ["P1710", "P1680"]}, {"id": "P1710", "text": ["The field windings connect to the same power source as the armature windings (or rotor windings)."], "jumps": ["P1050", "P1700"]}, {"id": "P1910", "text": ["This completes the information on DC MOTORS.1 TITLE........"], "jumps": ["P1001", "P1420"]}, {"id": "P1920", "text": ["1. DC Motors operate using direct current to produce mechanical energy."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. The electromagnet type of DC Motor incorporates a field coil to produce the field lines needed for motor action."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. A typical Electromagnet DC Motor schematic shows the brushes, armature and field coil."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. There are three types of DC Motors, Shunt, Series and Compound Motor."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. The Shunt Motor has the field coil in parallel with the armature. The Series Motor has the coil in series with the armature."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6. The Compound Motor incorporates both the Series and Shunt Motor characteristics."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7. Speed control can be obtained by varying either the armature voltage or the current through the field coils."], "jumps": ["P1999", "P1970"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2015", "text": ["Pick up the PC130-280 Rotating Machinery card. The purpose of this card is to interface the 130 Trainer with the 280 Rotating Machinery trainer."], "jumps": ["P2020", "P2001"]}, {"id": "P2020", "text": ["In this experiment you will configure and verify proper operation for a DC Series, Shunt and Compound Motor."], "jumps": ["P2040", "P2015"]}, {"id": "P2040", "text": ["Let's begin the experiment! DC Motors......................"], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["1. Set the 280 trainer to it's initial control settings..."], "jumps": ["P2060", "P2040", "P22000"]}, {"id": "P2060", "text": ["2. Set the Test Console controls to their initial control settings........"], "jumps": ["P2050", "P"]}, {"id": "P2070", "text": ["3. Insert PC130-280 into the PC3 position on the Test Console.h to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2080"]}, {"id": "P2080", "text": ["4. Connect the 8 pin connector from the PC130-280 card to the PC130-280 connector on the 280 trainer. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2070", "P"]}, {"id": "P2090", "text": ["5. Set the 130 Test Console controls as follows: Filament . . . . . . . . ON + Positive Supply . . . . . 15 Volts - Negative Supply . . . . . 15 Volts", "5. For DC motor operation, press enter to set the 130E Test Console controls as follows: t.......... ON + Power Supply... 24 Volts - Power Supply....15 Volts"], "jumps": ["P2080"]}, {"id": "P2100", "text": ["6. Press Enter to set PC3 DC Power - ON.", "6. Press Enter to set PC3 DC Power - ON. 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": []}, {"id": "P2110", "text": ["7. Set the following controls on the DC Motor Sub-Panel. Switch Settings OPER/TEST - TEST RUN/STOP - RUN SERIES FIELD - IN", "YGIH@t7<< ??KJJ|KyLPvS?J|F<=KWjXW?KY}NPOQY?BWKNQ", "Page Browser needs to be updated. Update"], "jumps": ["P2120"]}, {"id": "P2120", "text": ["At this time the 280 Trainer is configured as a Series DC Motor and should begin to rotate."], "jumps": ["P2130"]}, {"id": "P2130", "text": ["Trace the schematic on the DC Motor Sub-Panel and verify that the trainer is indeed configured as a Series Motor."], "jumps": ["P2140", "P2120", "P2135"]}, {"id": "P2135", "text": [], "jumps": []}, {"id": "P2140", "text": ["In order to change shaft rotation on a Series Motor, current must flow in the opposite direction through the armature and brushes."], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["The 280 Trainer allows the rotor to be repositioned in the circuit so that current flows through the Rotor in the opposite direction. This reverses shaft rotation."], "jumps": ["P2160", "P2140", "P2155"]}, {"id": "P2155", "text": [], "jumps": []}, {"id": "P2160", "text": ["8. Set the following controls on the DC Motor Sub-Panel and observe the direction of shaft rotation. Switch Settings DC Rotor - REVVVV", "|G@Gz@B @BBBB@@BB@@FFGZGZZGGGAA@@Fn\\B@ZZZZFHF%)CFGFF["], "jumps": []}, {"id": "P2170", "text": ["When the direction of current flow through the DC Rotor was changed what was the result?", "The shaft maintained its direction of rotation"], "jumps": ["P2160"]}, {"id": "P2171", "text": [], "jumps": []}, {"id": "P2172", "text": ["The output shaft should have stopped and then reversed it's direction of rotation. Verify that you changed the DC Rotor FWD/REV switch."], "jumps": []}, {"id": "P2180", "text": ["9. Vary the Positive Supply Voltage Control on the Test Console while observing motor action."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["What effect did varying the Positive Supply Voltage Control have on the DC Series Motor?", "As voltage decreased, motor speed increased", "As voltage increased, motor speed decreased", "As voltage increased, motor speed increased"], "jumps": ["P2180"]}, {"id": "P2191", "text": [], "jumps": []}, {"id": "P2192", "text": ["The Positive Supply Voltage Control is in effect (Varm). Voltage and Current through the armature of the DC Motor are directly proportional."], "jumps": []}, {"id": "P2200", "text": ["You should have observed the motors speed change when the Positive Supply Voltage was varied. This is a method used to control the speed of a DC Motor."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["10. Set Positive Supply Voltage back to 15V. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2200"]}, {"id": "P2220", "text": ["11. Set the following control settings on the 280 trainer. Switch Settings OPER/TEST - OPER RUN/STOP - STOP SERIES FIELD - OUTTTTTTTTTTTTT"], "jumps": ["P2230", "P"]}, {"id": "P2230", "text": ["Let's now examine the DC Shunt Field Motor and observe it in operation."], "jumps": []}, {"id": "P2240", "text": ["1. Configure the 280 trainer as a DC Shunt Field Motor by performing these switch settings. Switch Settings OPER/TEST - TEST RUN/STOP - RUN ARM/OFF/VAR - ARM", "YGIH@t7<< ??KJJ|KyLPvS?J|F<=KWjXW?KY}NPOQY?BWKNQ"], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["At this time the 280 Trainer is configured as a Shunt Field DC Motor and should begin to rotate."], "jumps": ["P2260"]}, {"id": "P2260", "text": ["Trace the schematic on the DC Motor sub-panel and verify that the trainer is indeed configured as a Shunt Motor. Remember, the ARM/OFF/VAR switch is in the ARM position.", "9t99tt9999tt9ttttt999t9ttttt99tt88tt9tt99ttt8t9tt9 ["], "jumps": ["P2270", "P2250", "P2265"]}, {"id": "P2265", "text": [], "jumps": []}, {"id": "P2270", "text": ["In order to change shaft rotation on a Shunt Motor, current must flow in the opposite direction in either the Armature or the Field Coil, but not both."], "jumps": ["P2280", "P2260", "P2275"]}, {"id": "P2275", "text": [], "jumps": []}, {"id": "P2280", "text": ["The 280 Trainer allows the Shunt Field and the Rotor to be repositioned in the circuit so that current flows through the Field or the Rotor in the opposite direction."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["If either the Shunt Field FWD/REV switch or the DC Rotor FWD/REV switch is changed, the direction of shaft rotation will change."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["If both switches are changed simultaneously, no change in direction of the motor shaft will occur."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["2. Set the DC Rotor FWD/REV switch to FWD and observe the direction of shaft rotation. Switch Settings FWD/REV - FWD"], "jumps": ["P2319", "P2300"]}, {"id": "P2319", "text": ["3. Change the DC Rotor FWD/REV switch to REV and observe the shaft rotation."], "jumps": ["P2320", "P2310"]}, {"id": "P2320", "text": ["The shaft maintained it's direction of rotation", "What happened to the direction of shaft rotation when the DC Rotor FWD/REV switch was changed?"], "jumps": ["P2319"]}, {"id": "P2321", "text": [], "jumps": []}, {"id": "P2322", "text": ["You changed the direction of current flow through the DC Rotor only. The output shaft should have stopped and then reversed it's direction of rotation. Verify that you changed the DC Rotor FWD/REV switch to REV."], "jumps": []}, {"id": "P2330", "text": ["4. Set the Shunt Field FWD/REV switch to REV. Switch Settings FWD/REV - REV"], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["The shaft maintained it's direction of rotation", "What happened to the direction of shaft rotation when the Shunt Field FWD/REV switch was changed on the Shunt Motor?"], "jumps": ["P2330"]}, {"id": "P2341", "text": [], "jumps": []}, {"id": "P2342", "text": ["You changed the direction of current flow through the Shunt Field coil only. The output shaft should have stopped and then reversed it's direction of rotation. Verify that you changed the Shunt Field FWD/REV switch."], "jumps": []}, {"id": "P2350", "text": ["As you have seen, in a Shunt Field Motor, changing the direction of current flow through either the Shunt Field Coil or the Armature causes the motor output shaft to change its' direction of rotation..."], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["5. Simultaneously change the position of the Shunt Field FWD/REV and the Rotor FWD/REV switch. Perform both switch settings at exactly the same time and watch the motors output shaft direction of rotation."], "jumps": ["P2370", "P2350"]}, {"id": "P2370", "text": ["The shaft maintained it's direction of rotation", "What happened to shaft rotation when the DC Rotor FWD/REV and Shunt Field FWD/REV switches were changed simultaneously?"], "jumps": ["P2360"]}, {"id": "P2371", "text": [], "jumps": []}, {"id": "P2372", "text": ["You changed the direction of current flow through both the Shunt Field and the Rotor. This causes no change in shaft rotation. Verify that you changed both switches at the same time."], "jumps": []}, {"id": "P2380", "text": ["As you have seen, by changing the current flow through the Shunt Field and DC Rotor at the same time, no change in shaft rotation occurs."], "jumps": ["P2390", "P2370"]}, {"id": "P2390", "text": ["6. Vary the Positive Supply Voltage Control on the test console while observing motor action."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["You should have observed that varying the input voltage to the Shunt Field Motor varied motor speed."], "jumps": ["P2410", "P2390"]}, {"id": "P2410", "text": ["This corresponds to speed control by varying Varm.........."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["7. Set Positive Supply Voltage back to 15V.. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2410"]}, {"id": "P2430", "text": ["8. Return the 280 back to it's initial control settings..."], "jumps": ["P2440", "P22000"]}, {"id": "P2440", "text": ["At this time let's examine a DC Compound Field Motor......."], "jumps": ["P2430"]}, {"id": "P2450", "text": ["1. Configure the 280 trainer as a Compound DC Motor by performing the following switch settings Switch Settings OPER/TEST - TEST, DC ROTOR - REV ARM/OFF/VAR - ARM, RUN/STOP - RUN SHUNT FIELD - FWD, SERIES FIELD - INNNNNNN", "YGIH@t7<< ??KJJ|KyLPvS?J|F<=KWjXW?KY}NPOQY?BWKNQ"], "jumps": []}, {"id": "P2460", "text": ["At this time the 280 Trainer is configured let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
