d of R2 to TP1.  This is the       negative applied voltage.", "7. Measure the voltage from the left lead of R2 to TP1. This is the negative applied voltage.."], "jumps": ["P2140", "P2120", "P2135"]}, {"id": "P2120", "text": ["6.  Turn PC1 DC Power switch to ON.", "6. Turn PC1 DC Power switch to ON........................................."], "jumps": ["P2110"]}, {"id": "P2110", "text": ["4.  Set the Voltmeter Switch to Negative.\n5.  Set the Negative Supply Voltage to 6. \n     The Test Console's Voltage Meter should indicate 6 volts.", "4. Set the Voltmeter Switch to Negative. 5. Set the Negative Supply Voltage to 6. The Test Console's Voltage Meter should indicate 6 volts."], "jumps": ["P2100"]}, {"id": "P2105", "text": ["SWITCH POSITIONS - S1 shown in the DC position."], "jumps": []}, {"id": "P2100", "text": ["3.  Set S1 to DC on PC130-22B.", "3. Set S1 to DC on PC130-22B.nsert a fault. the PC1 DC switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2090", "P2105"]}, {"id": "P2090", "text": ["2.  Carefully plug PC130-22B into the Test Console PC1 position.", "2. Carefully plug PC130-22B into the Test Console PC1 position. to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2080"]}, {"id": "P2080", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P2040"]}, {"id": "P2070", "text": ["S1 and S2 select AC or DC voltage to diodes D2 and D4 respectfully.  AC voltage is not used in this experiment.  Let's start the experiment.", "S1 and S2 select AC or DC voltage to diodes D2 and D4 respectfully. AC voltage is not used in this experiment. Let's start the experiment."], "jumps": ["P2080", "P2040"]}, {"id": "P2060", "text": ["D2 and D4 are zener diodes.  D2's cathode is connected to ground and D4's anode is connected to ground.", "D2 and D4 are zener diodes. D2's cathode is connected to ground and D4's anode is connected to ground."], "jumps": ["P2070", "P2040"]}, {"id": "P2050", "text": ["D1 and D3 are junction diodes used as rectifiers.  They are not used in this experiment.  R1, R3, C1 and C2 are also not used.", "D1 and D3 are junction diodes used as rectifiers. They are not used in this experiment. R1, R3, C1 and C2 are also not used."], "jumps": ["P2060", "P2040"]}, {"id": "P2040", "text": ["Pick up the PC130-22B card.  The purpose of this card is to demonstrate zener diodes.", "Pick up the PC130-22B card. The purpose of this card is to demonstrate zener diodes."], "jumps": ["P2050", "P2020"]}, {"id": "P2020", "text": ["This experiment demonstrates the operation of zener diodes. You will apply reverse biasing to a zener diode and measure circuit values to verify correct operation."], "jumps": ["P2040", "P2001"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary.   \nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1950"]}, {"id": "P1950", "text": ["4.  Checking a zener diode with an analog ohmmeter requires              two readings:", "4. Checking a zener diode with an analog ohmmeter requires two readings:", "Forward bias = Low ohms Reverse bias below Vz = High ohms"], "jumps": ["P1999", "P1930"]}, {"id": "P1940", "text": ["3.  Zener diodes conduct reverse current when reverse biased           above Vz, junction diodes breakdown.", "3. Zener diodes conduct reverse current when reverse biased above Vz, junction diodes breakdown.."], "jumps": ["P1950", "P1930"]}, {"id": "P1930", "text": ["2.  Zener diodes act like a junction diode when forward biased            and reverse biased below Vz.", "2. Zener diodes act like a junction diode when forward biased and reverse biased below Vz.."], "jumps": ["P1940", "P1920"]}, {"id": "P1920", "text": ["1.  Zener diodes are used as voltage regulators and operate in            the break down voltage area.", "1. Zener diodes are used as voltage regulators and operate in the break down voltage area."], "jumps": ["P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on ZENER DIODE ACTION.", "This completes the information on ZENER DIODE ACTION......."], "jumps": ["P1001", "P1350"]}, {"id": "P1353", "text": ["The forward bias reading is low compared to the reverse bias below Vz reading.  However, they are both very high.  Forward bias resistance should be low.", "The forward bias reading is low compared to the reverse bias below Vz reading. However, they are both very high. Forward bias resistance should be low.", "Forward biased = 15 M Ohms Reverse biased below Vz = Infinity"], "jumps": []}, {"id": "P1352", "text": [], "jumps": []}, {"id": "P1350", "text": ["Is a zener diode good or bad with the following DC resistance readings?", "Forward biased = 15 M Ohms Reverse biased below Vz = Infinity"], "jumps": ["P1340"]}, {"id": "P1343", "text": ["The forward bias reading is low compared to the reverse bias below Vz reading.", "Forward biased = 30 Ohms Reverse biased below Vz = Infinitys"], "jumps": []}, {"id": "P1342", "text": [], "jumps": []}, {"id": "P1340", "text": ["Is a zener diode good or bad with the following DC resistance readings?", "Forward biased = 30 ohms Reverse biased below Vz = 500 k ohms"], "jumps": ["P1290"]}, {"id": "P1335", "text": ["Remember, that on some multimeters the red test lead is connected to the negative side of the internal voltage source.  If this is the case you must reverse the test leads.", "Remember, that on some multimeters the red test lead is connected to the negative side of the internal voltage source. If this is the case you must reverse the test leads."], "jumps": ["P1340", "P1290"]}, {"id": "P1330", "text": ["Remember, the ohmmeter supplies the bias voltage when measuring the diode.  The size of the internal voltage and the meters internal resistance effects the actual value measured.", "Remember, the ohmmeter supplies the bias voltage when measuring the diode. The size of the internal voltage and the meters internal resistance effects the actual value measured."], "jumps": ["P1335", "P1290"]}, {"id": "P1320", "text": ["The reverse bias resistance above Vz cannot be measured with an ohmmeter because the internal voltage source does not approach Vz."], "jumps": ["P1330", "P1290"]}, {"id": "P1310", "text": ["To check the reverse bias resistance below Vz, set the range of an analog multimeter to X1 or X10.  The resistance reading will be high or infinity.", "To check the reverse bias resistance below Vz, set the range of an analog multimeter to X1 or X10. The resistance reading will be high or infinity."], "jumps": ["P1320", "P1290"]}, {"id": "P1300", "text": ["To check the forward bias resistance, set the range of an analog multimeter to X1 or X10.  The resistance reading will be low.", "To check the forward bias resistance, set the range of an analog multimeter to X1 or X10. The resistance reading will be low."], "jumps": ["P1310", "P1290"]}, {"id": "P1290", "text": ["To check a zener, use an analog ohmmeter and check:", "To check a zener, use an analog ohmmeter and check:........", "Forward bias = Low ohms Reverse bias below Vz = High ohmss"], "jumps": ["P1300", "P1280"]}, {"id": "P13300", "text": ["4.  Set the analog multimeter range to X10.  First measure the \n     forward bias DC resistance of D2 and then measure the \n     reverse bias DC resistance of D2.\n     If using a digital multimeter in diode test mode, note the \n     reading when reverse biased is the same as a junction diode.", "4. Set the analog multimeter range to X10. First measure the forward bias DC resistance of D2 and then measure the reverse bias DC resistance of D2. If using a digital multimeter in diode test mode, note the reading when reverse biased is the same as a junction diode.", "There should be at least a 1000 time difference between the two measurements for the correct operation of the diode.."], "jumps": ["P13400", "P13290", "P13305"]}, {"id": "P1243", "text": ["The zener diode is reverse biased below the Vz voltage.  The action of D1 is like an open switch.", "The zener diode is reverse biased below the Vz voltage. The action of D1 is like an open switch."], "jumps": []}, {"id": "P1242", "text": [], "jumps": []}, {"id": "P1240", "text": ["What is the Eout if D1 has a Vz of 25 volts?", "What is the Eout if D1 has a Vz of 25 volts?..............."], "jumps": ["P1230"]}, {"id": "P1233", "text": ["The zener diode is forward biased.  The action of D1 is like a closed switch.", "The zener diode is forward biased. The action of D1 is like a closed switch."], "jumps": []}, {"id": "P1232", "text": [], "jumps": []}, {"id": "P1230", "text": ["What is the Eout if D1 has a Vz of 10 volts?", "What is the Eout if D1 has a Vz of 10 volts?..............."], "jumps": ["P1220"]}, {"id": "P1223", "text": ["The zener diode is reverse biased beyond Vz.  The action of D1 regulates the voltage output to the Vz value.", "The zener diode is reverse biased beyond Vz. The action of D1 regulates the voltage output to the Vz value."], "jumps": []}, {"id": "P1222", "text": [], "jumps": []}, {"id": "P1220", "text": ["What is the Eout if D1 has a Vz of 15 volts?", "What is the Eout if D1 has a Vz of 15 volts?..............."], "jumps": ["P1150"]}, {"id": "P1210", "text": ["Replacing the zener with one that has a Vz of 8 volts regulates the voltage at -8 volts."], "jumps": ["P1220", "P1150"]}, {"id": "P1205", "text": ["n and Eout will be whatever the applied voltage happens to b", "If the applied voltage is less than VZ, the diode acts as an open and Eout will be whatever the applied voltage happens to be."], "jumps": ["P1210", "P1150"]}, {"id": "P1200", "text": ["As long as the applied voltage is greater than -10 volts, Eout remains at -10 volts."], "jumps": ["P1205", "P1150"]}, {"id": "P1190", "text": ["If the applied voltage is decreased to -13 volts, the zener conducts less reverse current.  Er decreases to 3 volts and Eout is still -10 volts.", "If the applied voltage is decreased to -13 volts, the zener conducts less reverse current. Er decreases to 3 volts and Eout is still -10 volts."], "jumps": ["P1200", "P1150"]}, {"id": "P1183", "text": ["The higher the applied voltage, the lower the resistance of D1. This drops more voltage across R1."], "jumps": ["P1190", "P1150"]}, {"id": "P1182", "text": ["R1 and D1 can be thought of as a voltage divider with the resistance of D1 determined by the applied voltage."], "jumps": ["P1183", "P1150"]}, {"id": "P1180", "text": ["If the applied voltage is increased to -15 volts, the zener conducts more reverse current.  Er1 increases to 5 volts and Eout is still -10 volts.", "If the applied voltage is increased to -15 volts, the zener conducts more reverse current. Er1 increases to 5 volts and Eout is still -10 volts...."], "jumps": ["P1182", "P1150"]}, {"id": "P1170", "text": ["The small reverse current causes a 1 volt drop across the resistor.  Eout is -10 volts.", "The small reverse current causes a 1 volt drop across the resistor. Eout is -10 volts."], "jumps": ["P1180", "P1150"]}, {"id": "P1160", "text": ["The -11V applied to the anode of the zener causes reverse current to flow."], "jumps": ["P1170", "P1150"]}, {"id": "P1150", "text": ["For example, if the zener diode has a Vz of 10 V and -11 V is applied, the output is -10 V."], "jumps": ["P1160", "P1110"]}, {"id": "P1140", "text": ["Reverse current begins to flow through the zener diode."], "jumps": ["P1150", "P1110"]}, {"id": "P1130", "text": ["When the reverse bias voltage is greater than Vz, the zener diode operates differently."], "jumps": ["P1140", "P1110"]}, {"id": "P1128", "text": ["Up to this point the zener diode operated like a junction diode."], "jumps": ["P1130", "P1110"]}, {"id": "P1125", "text": ["When zener diodes are reverse biased lower than Vz, they act as an open switch."], "jumps": ["P1128", "P1110"]}, {"id": "P1120", "text": ["Recalling that a forward biased diode requires approximately .7V to overcome the barrier potential, the actual voltage out is .7 V.", "Recalling that a forward biased diode requires approximately .7V to overcome the barrier potential, the actual voltage out is .7 V.."], "jumps": ["P1125", "P1110"]}, {"id": "P1110", "text": ["For example, when forward biased, the zener diode acts like a closed switch."], "jumps": ["P1120", "P1050"]}, {"id": "P2280", "text": ["1.  Set the PC1 DC switch to OFF.  \n2.  Set up an analog multimeter to measure DC resistance or set\n     a digital multimeter to test diodes.", "1. Set the PC1 DC switch to OFF. 2. Set up an analog multimeter to measure DC resistance or set a digital multimeter to test diodes.........................................................."], "jumps": ["P2270"]}, {"id": "P1050", "text": ["Zener diodes are primarily used as voltage regulators.", "Zener diodes are primarily used as voltage regulators......"], "jumps": ["P1060", "P1020"]}, {"id": "P1040", "text": ["The schematic symbol for the zener diode is similar to the junction diode except for the crooked bar on the cathode."], "jumps": ["P1050", "P1020"]}, {"id": "P1035", "text": ["When the reverse biased voltage is higher than Vz (breakdown), the diode acts as a resistor, always having a voltage drop equal to Vz."], "jumps": ["P1040", "P1020"]}, {"id": "P1030", "text": ["When the zener is reverse biased, it operates like an open switch."], "jumps": ["P1035", "P1020"]}, {"id": "P1020", "text": ["The zener diode acts like a closed switch when forward biased."], "jumps": ["P1030", "P1001"]}, {"id": "P13510", "text": ["In the circuit below, D2 has a Vz of 8 V.  Calculate the resistance D2 must have to provide a voltage drop of 8 V.", "In the circuit below, D2 has a Vz of 8 V. Calculate the resistance D2 must have to provide a voltage drop of 8 V.", "Ed2 = -8 V Rd2 = ? WWWWW", "Er2 = -7 V R2 = 1 kWWWWWWWWWWWWW"], "jumps": ["P13230", "P13515", "P2800"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P440", "text": ["Let's begin the lesson on ZENER DIODE OPERATION..........................."], "jumps": ["P400"]}, {"id": "P430", "text": ["Zener diodes are designed to operate in the \"break down\" condition.  Break down voltage will not harm the zener.", "Zener diodes are designed to operate in the \"break down\" condition. Break down voltage will not harm the zener."], "jumps": ["P440", "P400"]}, {"id": "P420", "text": ["The junction diode is not designed to \"break down\" and may be damaged."], "jumps": ["P430", "P400"]}, {"id": "P410", "text": ["Too much reverse bias will \"break down\" the junction diode and current will flow in the wrong direction."], "jumps": ["P420", "P400"]}, {"id": "P400", "text": ["A junction diode acts like an open switch when reverse biased.  Current will not flow.", "A junction diode acts like an open switch when reverse biased. Current will not flow."], "jumps": ["P410", "P300"]}, {"id": "P330", "text": [], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": ["P400"]}, {"id": "P1060", "text": ["If Vz is 10 V, the output of the power supply will remain at 10 V even if the applied voltage increases.", "w Identify a zener schematic symbol. w Identify the purpose of a zener diode. w Describe the operation of zener diodes. w Recognize the proper method of using a multimeter to verify zener diode operation.", "w Predict the voltage drop of a reverse biased zener diode. w Measure the voltage drop of a reverse biased zener diode. w Recognize normal operation of a zener diode..............."], "jumps": ["P1110", "P1050"]}, {"id": "P13250", "text": ["4.  Connect a digital multimeter to TP1 and TP7 with alligato     stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
</body>
