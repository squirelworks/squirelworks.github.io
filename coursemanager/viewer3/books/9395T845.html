ithin the 8086 microprocessor.  These transfers include moving data between its internal registers or between an internal register and a storage location in memory.", "In this lesson you will learn how data is transferred between different areas within the 8086 microprocessor. These transfers include moving data between its internal registers or between an internal register and a storage location in memory."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["This data transfer is accomplished by instructions that the microprocessors interprets and executes.", "This data transfer is accomplished by instructions that the microprocessors interprets and executes............"], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["While the 8086 microprocessor has a group of instructions that are provided for data transfer, in this lesson we will be primarily concerned with instructions that move, load, or store data via the MOV statement.", "While the 8086 microprocessor has a group of instructions that are provided for data transfer, in this lesson we will be primarily concerned with instructions that move, load, or store data via the MOV statement.t........................................................"], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["The type of data transfer performed is controlled by an instruction contained in a code."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["Let's begin the lesson on 8086 DATA TRANSFER INSTRUCTIONS..................."], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The microprocessor knows what type of transfer to perform by interpreting and executing an instruction."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Each instruction contains one or more bytes of information in hexadecimal form."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The computer instruction is composed of two parts: an opcode and an operand.  The opcode specifies what action is to be performed such as move, load, add, or subtract.  With the 8086 processor, the opcode can be up to two bytes in length.", "The computer instruction is composed of two parts: an opcode and an operand. The opcode specifies what action is to be performed such as move, load, add, or subtract. With the 8086 processor, the opcode can be up to two bytes in length.ww"], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The operand is the second part of the computer instruction.  The operand identifies the data that will be processed by the microprocessor under the control of the opcode.", "The operand is the second part of the computer instruction. The operand identifies the data that will be processed by the microprocessor under the control of the opcode......................................................................................................................................"], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["Operands can be data, an addresses, or both.  In the example below, the operands 1A & 1B are data which will be placed in the AX register by the opcode B8.", "Operands can be data, an addresses, or both. In the example below, the operands 1A & 1B are data which will be placed in the AX register by the opcode B8."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["The particular type of data transfer instruction will determine if the operand is data or a memory address.", "The particular type of data transfer instruction will determine if the operand is data or a memory address.ytes are determined to be data or addresses depending on the type of data transfer instruction."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["The instruction B8, is an example of an instruction written in assembly language.  The instruction is written using alphanumeric symbols instead of the 1's & 0's of the microprocessor's machine code.", "The instruction B8, is an example of an instruction written in assembly language. The instruction is written using alphanumeric symbols instead of the 1's & 0's of the microprocessor's machine code...croprocessor to move data to the AX register (both the AL and the AH registers)."], "jumps": ["P1110", "P1060"]}, {"id": "P1110", "text": ["To further aid in the understanding of computer instructions, each opcode operation is assigned a unique one, two, or three-letter combination.  This letter representation of the opcode is called a Mnemonic.  For example, the mnemonic for the opcode B8 is shown below.", "To further aid in the understanding of computer instructions, each opcode operation is assigned a unique one, two, or three-letter combination. This letter representation of the opcode is called a Mnemonic. For example, the mnemonic for the opcode B8 is shown below.::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::"], "jumps": ["P1130", "P1080"]}, {"id": "P1130", "text": ["To further help you understand opcodes and mnemonics, an English statement was created.", "To further help you understand opcodes and mnemonics, an English statement was created. Opcode and Mnemonic, an English statement is made.............................", "Opcode Mnemonic Statement B8 1B 1A MOV AX, data Move 1A 1B to the AX register"], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["This English statement is called a Pseudocode.", "This English statement is called a Pseudocode.."], "jumps": ["P1145", "P1130"]}, {"id": "P1145", "text": ["In order for the microprocessor to properly transfer data, it must first access this data or operand.  These operands may be part of the instruction, stored in one of the 8086's internal registers, or stored at an address in memory.  The 8086 accesses these operands through various addressing modes.", "In order for the microprocessor to properly transfer data, it must first access this data or operand. These operands may be part of the instruction, stored in one of the 8086's internal registers, or stored at an address in memory. The 8086 accesses these operands through various addressing modes.ddcreto further help you understand opcodes and mnemonics, an English statement was created."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["What data does the instruction BB 12 34 move?", "What data does the instruction BB 12 34 move?.............."], "jumps": ["P1145"]}, {"id": "P1151", "text": [], "jumps": []}, {"id": "P1152", "text": ["The BB tells the microprocessor what to do. It is the first byte, the opcode.  In this case BB moves 12 34 into register BX.", "The BB tells the microprocessor what to do. It is the first byte, the opcode. In this case BB moves 12 34 into register BX."], "jumps": []}, {"id": "P1160", "text": ["Choose the Pseudocode.", "Choose the Pseudocode.on is typed.........................."], "jumps": ["P1150"]}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1162", "text": ["BB AA CC is the instruction containing an opcode and data.", "BB AA CC is the instruction containing an opcode and data.."], "jumps": []}, {"id": "P1163", "text": ["MOV BX, AA CC is the mnemonic for the instruction BB AA CC."], "jumps": []}, {"id": "P1170", "text": ["Choose the Instruction.", "Choose the Instruction.n is typed.........................."], "jumps": ["P1160"]}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1172", "text": ["MOV BX, AA CC is the mnemonic for the instruction.", "MOV BX, AA CC is the mnemonic for the instruction.........."], "jumps": []}, {"id": "P1173", "text": ["Move AA CC into Register BX is the pseudocode.", "Move AA CC into Register BX is the pseudocode.............."], "jumps": []}, {"id": "P1180", "text": ["The 8086 microprocessor uses several different addressing modes to access memory and allow for the transfer of data.  We will be discussing three commonly used addressing modes in this lesson.", "The 8086 microprocessor uses several different addressing modes to access memory and allow for the transfer of data. We will be discussing three commonly used addressing modes in this lesson...erwar Transfer instructions are divided into three categories."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["The first addressing mode which allows the 8086 to transfer data is the immediate addressing mode instruction.", "The first addressing mode which allows the 8086 to transfer data is the immediate addressing mode instruction...et's look at the immediate data transfer instructions first.."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["Each type of immediate addressing mode instruction consists of an opcode in the first byte, followed by data in the second and possibly third byte.", "Each type of immediate addressing mode instruction consists of an opcode in the first byte, followed by data in the second and possibly third byte.su utionEach type of immediate transfer instruction consists of an Opcode in the first byte followed by data in the second and/or third bytes."], "jumps": ["P1210", "P1180"]}, {"id": "P1210", "text": ["With the immediate addressing mode, the operand appears in the instruction, is typically a constant, and can be either a byte or word of data.", "With the immediate addressing mode, the operand appears in the instruction, is typically a constant, and can be either a byte or word of data.cThere is no byte for an address. The data is not in a memory location, the data is in the instruction."], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["Some immediate addressing mode opcodes used for transferring data to registers are:", "Some immediate addressing mode opcodes used for transferring data to registers are:The Opcodes for some of the 8086 microprocessor for MOVE IMMEDIATE data to a register are:", "Opcode Mnemonic Registerreeeeeee", "MOV AX MOV BX MOV CX MOV DX MOV SP MOV BP MOV SI MOV DI"], "jumps": ["P1240", "P1200"]}, {"id": "P1240", "text": ["An example of a short program using an immediate addressing mode instruction to transfer data to the CX register is:", "An example of a short program using an immediate addressing mode instruction to transfer data to the CX register is:.", "Opcode Mnemonic Pseudocode B9 22 11 MOV CX, 11 22 Move 11 22 into the CX register CD 20 HLT Terminate Program"], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["Note that the code places the data backwards.  This is because microprocessor reads the LSB first.", "Note that the code places the data backwards. This is because microprocessor reads the LSB first."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["Note that the MOV instructions are 3 bytes long.", "Note that the MOV instructions are 3 bytes long.."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["Immediate addressing instructions can also transfer one byte of data to the upper or lower portion of a register.", "Immediate addressing instructions can also transfer one byte of data to the upper or lower portion of a register. tMVI instructions can also load one byte of data to the lower or higher register pair.", "Opcode Mnemonic Registereeeeeee", "MOV AL MOV BL MOV CL MOV DL MOV AH MOV BH MOV CH MOV DH"], "jumps": ["P1280", "P1240"]}, {"id": "P1280", "text": ["These instructions contain two bytes, one for the opcode and one for the data.", "Opcode Mnemonic Pseudocode B0 11 MOV AL, 11 Move 11 into the AL registerrrrrr HLT Terminate Program"], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["You can also use the immediate addressing mode to transfer data into memory.", "You can also use the immediate addressing mode to transfer data into memory...seove Immediate data into memory."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["The opcode, mnemonic, and pseudocode to transfer 2 bytes of data into memory using the immediate addressing mode are:", "The opcode, mnemonic, and pseudocode to transfer 2 bytes of data into memory using the immediate addressing mode are: to Immediate Move two bytes of d ediate addressing instructions concerned with moving data to memory require memory address. the MVI M instruction has a memory address."], "jumps": []}, {"id": "P1363", "text": ["Transfer immediate instructions require the data that is to be transferred and the opcode.  Only immediate addressing instructions concerned with moving data to memory require memory address.", "Transfer immediate instructions require the data that is to be transferred and the opcode. Only immediate addressing instructions concerned with moving data to memory require memory address.ress."], "jumps": []}, {"id": "P1370", "text": ["Now, let's look at transferring data via Direct Addressing Mode.", "Now, let's look at transferring data via Direct Addressing Mode................"], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["Direct addressing instructions contain no data.  Unlike immediate instructions, the effective memory address of the operand is specified in the instruction.  With this type of addressing, the microprocessor generates a 20 bit physical address of the operand.", "Direct addressing instructions contain no data. Unlike immediate instructions, the effective memory address of the operand is specified in the instruction. With this type of addressing, the microprocessor generates a 20 bit physical address of the operand...orctttintransfer instructions contain the address where the data needed is stored or where the data is to be stored. The instruction does not contain the data."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["Direct addressing instructions contain an opcode, followed by two bytes of memory location information.", "Direct addressing instructions contain an opcode, followed by two bytes of memory location information...The first byte is the Opcode."], "jumps": ["P1410", "P1380"]}, {"id": "P1410", "text": ["AO, the direct addressing instruction, loads the contents of the memory location specified in the instruction into the A register.", "AO, the direct addressing instruction, loads the contents of the memory location specified in the instruction into the A register.The Load Accumulator Direct instruction loads the contents of the memory location into the A register.", "Opcode Mnemonic A0 MOV Addresssss 11 Move 11 into the AL registerrrrr 20 HLT Terminate Program"], "jumps": ["P1420", "P1390"]}, {"id": "P1420", "text": ["The opcodes and mnemonic for loading a word or byte into the accumulator via the direct addressing mode are as follows:", "The opcodes and mnemonic for loading a word or byte into the accumulator via the direct addressing mode are as follows:oo for load Accumulator Direct is:", "Opcode Mnemonic A0 MOV (byte) A1 MOV (word))) AL registerrrrr 20 HLT Terminate Program"], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["For example, the following are the opcodes, mnemonics, and pseudocodes associated with transferring a word or byte of information from memory location 2211 into the accumulator.", "For example, the following are the opcodes, mnemonics, and pseudocodes associated with transferring a word or byte of information from memory location 2211 into the accumulator...:::", "Opcode Mnemonic Pseudocode A1 11 22 MOV 2211 Transfer the contents of location 2211 into AX A0 11 22 MOV 2211 Transfer the contents of location 2211 into AL"], "jumps": ["P1440", "P1410"]}, {"id": "P1440", "text": ["Notice that the memory location is reversed in the opcode instruction due to the microprocessor's requirement to read in the least significant byte of data first.", "Notice that the memory location is reversed in the opcode instruction due to the microprocessor's requirement to read in the least significant byte of data first...icalinstruction has the memory location backwards."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["This is because the microprocessor reads the least significant byte first in the address."], "jumps": ["P1460", "P1430"]}, {"id": "P1460", "text": ["Data can also be t xth byte be moved to the succeeding memory location.", "6. When moving two bytes of data, the instruction's first two bytes instruct that the data in the fifth byte be moved to the memory location contained in the third and fourth bytes and the sixth byte be moved to the succeeding memory location..."], "jumps": ["P1950", "P1942"]}, {"id": "P1950", "text": ["7.  Direct transfer instructions contain an opcode and address.          When moving data into the accumulator, the second two                 bytes define the memory address from which data is to be              transferred into the accumulator.", "7. Direct transfer instructions contain an opcode and address. When moving data into the accumulator, the second two bytes define the memory address from which data is to be transferred into the accumulator.", "Opcode Mnemonic Pseudocode A1 22 11 MOV, 1122 Move contents of memory location 1122 into the AX register"], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["8.  Indirect transfers instructions contain only an opcode.  The           memory location where the data is to be stored or retrieved is        specified by the contents of one of the following registers: BX,      DI, SI, or the BP.", "8. Indirect transfers instructions contain only an opcode. The memory location where the data is to be stored or retrieved is specified by the contents of one of the following registers: BX, DI, SI, or the BP.", "Opcode Mnemonic Pseudocode 8B 04 MOV AX, M Move contents of memory location in the SI to register AX"], "jumps": ["P1999", "P1950"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1960"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["In this experiment you will enter programs that perform the three types of data transfers."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["Let's begin the experiment.", "Let's begin the experiment.e..............................."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2030"]}, {"id": "P2050", "text": ["2. Insert the following 130 experiment cards on the test console. a. Insert PC130-410 8086 Microprocessor card in the PC1 position. b. Insert PC130-411 8086 Decoder/Memory card in the PC2 position. c. Insert PC130-401 I/O card in the PC3 position."], "jumps": ["P2040"]}, {"id": "P2060", "text": ["3.  Place the PC130-404 Keyboard and Display card in front of            the test console between the PC2 and PC3 positions.  Note            that the PC130-404 card has its own chassis.", "3. Place the PC130-404 Keyboard and Display card in front of the test console between the PC2 and PC3 positions. Note that the PC130-404 card has its own chassis."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["4. Connect the four experiment cards with the flat ribbon cables as follows: A. Using the 50 pin ribbon cable, connect PC130-410 J1 to PC130- 411 J1. B. Using the short 20 pin ribbon cable, connect PC130-411 J2 to PC130- 401 J1. C. Using the long 20 pin ribbon cable, connect PC130-401 J2 to PC130- 404 J1. !", "The Ribbon Cables must be installed in the proper orientation. Note that each cable has a red stripe on one side. This stripe indicates pin 1. On the Experiment Cards, the numeral 1 or 2 indicates the end of the connector with the 1 pin. Attach the cables to the connectors such that the red stripe is at the end of the connector with the numeral 1 or 2.", "The Ribbon Cables must be installed in the proper orientation. Note that each cable has a red stripe on one side. This stripe indicates pin 1. On the Experiment Cards, the numeral 1 or 2 indicates the end of the connector with the 1 pin. Attach the cables to the connectors such that the red stripe is at the end of the connector with the numeral 1 or 2..", "CAUTION -400 card has its own chassis."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["5.   Set the Positive Supply Control to 5.  The Voltmeter on the              130A should indicate 5 Volts.", "5. Set the Positive Supply Control to 5. The Voltmeter on the 130A should indicate 5 Volts."], "jumps": ["P2070"]}, {"id": "P2090", "text": ["6.  Set the PC3 DC Power switch to ON.", "6. Set the PC3 DC Power switch to ON..to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2080"]}, {"id": "P2100", "text": ["7.  Set the PC2 DC Power switch to ON.", "7. Set the PC2 DC Power switch to ON..to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2090"]}, {"id": "P2110", "text": ["8.  Set the PC1 DC Power switch to ON.", "8. Set the PC1 DC Power switch to ON..to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2100"]}, {"id": "P2120", "text": ["9. The microprocessor system is now assembled and operating. You should see the message \"Nida Corporation Intel 8086 V1.0 NIDA:\" in the LCD display on the PC130-404 card. If the message is dim or blank, try adjusting the Display Intensity potentiometer (R1) on the PC130-404 card using a small screwdriver. If you still cannot see the message, see your instructor for assistance. istance. sistance.", "Nida Corporation Intel 8086 V1.0"], "jumps": ["P2140", "P2110"]}, {"id": "P2140", "text": ["The first program that you will enter will perform immediate data transfers."], "jumps": ["P2150", "P2120"]}, {"id": "P2150", "text": ["1.   Load the following program into RAM starting at location                1000.", "1. Load the following program into RAM starting at location 1000."], "jumps": ["P2160", "P2140", "P2155"]}, {"id": "P2155", "text": ["INSTRUCTIONS FOR ENTERING PROGRAMS: 1. Press EDIT on the PC130-404 Keyboard & Display experiment card and enter the desired SEGMENT or OFFSET. A SEGMENT such as 1000 may be entered as 1000:, 1000:0, or 1000:0000. An OFFSET such as 1000 may be entered as 1000, :1000, or 0000:1000. 2. Press ENTER after the desired SEGMENT or OFFSET has been entered. The display will now show the SEGMENT at the top of the display along with OFFSET and store OPCODE at the bottom of the display. NOTE: Every time you enter an OPCODE and press ENTER, you automatically move to the next OFFSET. Additionally, there are three things that can be done at any SEGMENT and OFFSET: enter a new value and press ENTER, press the down arrow to move to the next OFFSET, or press the up arrow to move to the previous OFFSET. 3. Enter all of the desired OPCODES for the program remembering to press ENTER after each. 4. After all OPCODES of the program have been entered, press the STOP key. 5. The program has now been stored in memory. To verify the program has been stored correctly, press the DISPLAY R.M. key, enter the starting address of the program, and press ENTER. All OPCODES for that location, as well for the next 17 locations, will be displayed. Draws up orders and checks automobile prior to delivery. Advertising and telephone marketing may be required at slow times. Environment - Clean well lighted showroom or outside on a lot. Evenings, days and weekends. Requirements - Must be able to maintain a pleasant attitude with people under stressful conditions. Good personal appearance and manners are important."], "jumps": []}, {"id": "P2160", "text": ["2.  To verify that the program has been loaded press the                        DISPLAY/R.M./Recall key.  The Disp. Add:_ prompt will appear       and then press the 1000, ENTER keys. The first 18 locations           will displayed.   After verifying program press the STOP/Step          key.", "2. To verify that the program has been loaded press the DISPLAY/R.M./Recall key. The Disp. Add:_ prompt will appear and then press the 1000, ENTER keys. The first 18 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
