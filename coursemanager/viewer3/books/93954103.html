const book = {"title": "93954103", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: BUFFERS AND INVERTERSdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe the purpose of a buffer. w Describe the purpose of an inverter.", "w Describe input threshold voltages. w Describe output threshold voltages."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "5. Nida Model 470 Oscilloscope or Equivalent", "6. Nida Model 480, 488 or Equivalent XXXXXnt"], "jumps": []}, {"id": "P301", "text": ["7. Nida Model 440 Function Generator or Equiv."], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P350", "text": [], "jumps": []}, {"id": "P400", "text": ["Digital circuits are not completely new circuits. They are made from many of the same components used in analog circuits."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["The difference between digital and analog circuits is the way we look at the inputs and outputs."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["A lamp in an analog circuit is OFF, dimly lit, brightly lit or somewhere in between."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["A lamp in a digital circuit is either ON or OFF. The amount of brightness doesn't matter."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["For the digital circuit to operate properly the two states of ON or OFF must be defined clearly."], "jumps": ["P450", "P420"]}, {"id": "P450", "text": ["Let's begin the lesson on BUFFERS AND INVERTERS..........................."], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1040", "text": ["Buffers and inverters are digital circuits that have one input and one output."], "jumps": ["P1050", "P1001"]}, {"id": "P1050", "text": ["Let's discuss the buffer's operation first."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["The buffer differs from the AND, OR and NOT functions in that a HIGH input always produces a HIGH output."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["A LOW input always produces a LOW output."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["The truth table for the buffer is very simple to make.", "Input Output 1 1 0 0"], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["Fill in the missing value in the buffer's truth table.", "Fill in the missing value in the buffer's truth table.eric answer (25k).................ble.le.", "Input Output 0 0 1"], "jumps": ["P1060", "P1092"]}, {"id": "P1091", "text": [], "jumps": []}, {"id": "P1092", "text": ["Remember, whatever logic level comes into a buffer, the same logic level will leave the buffer."], "jumps": []}, {"id": "P1095", "text": ["Your answer is still incorrect. The missing value for the buffer truth table should have been High or a one."], "jumps": ["P1100", "P1090"]}, {"id": "P1100", "text": ["The buffer performs three basic functions in digital circuits:"], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["PROTECTION -  The buffer is used to protect digital components                                 from an input voltage or current that is too high.", "PROTECTION - The buffer is used to protect digital components from an input voltage or current that is too high."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["For example, the input to the buffer is 10 volts. The digital circuit is designed to operate at 5 volts or less."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["The 10 volts applied to the buffer gates the lower 4 volts through to the digital circuit."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["DRIVER - The buffer is also used as a driver circuit when several                     digital circuits operate from the same voltage source.", "DRIVER - The buffer is also used as a driver circuit when several digital circuits operate from the same voltage source."], "jumps": ["P1150", "P1110"]}, {"id": "P1150", "text": ["In this example, the same 5 volts is needed to drive each of the three digital circuits."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["Each circuit adds a load to the 5 volts until the effective voltage is too small to operate any of the circuits."], "jumps": ["P1170", "P1140"]}, {"id": "P1170", "text": ["The buffer is able to maintain current at a high enough level so that voltage is not loaded down."], "jumps": ["P1180", "P1140"]}, {"id": "P1180", "text": ["SWITCH - The buffer is also used as a switch. It functions much                        like an amplifier, but is only capable of producing two                       different output states.", "SWITCH - The buffer is also used as a switch. It functions much like an amplifier, but is only capable of producing two different output states."], "jumps": ["P1190", "P1140"]}, {"id": "P1190", "text": ["For example, this digital circuit must sound a burglar alarm in the event of a break in."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["The actual output voltage from the digital circuit is only 5 volts;  10 volts is needed to operate the alarm.", "The actual output voltage from the digital circuit is only 5 volts; 10 volts is needed to operate the alarm.rm."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["The buffer is used to gate through a voltage large enough to drive the alarm."], "jumps": ["P1220", "P1190"]}, {"id": "P1220", "text": ["Touch the buffer in this circuit.", "Touch the buffer in this circuit..........................."], "jumps": ["P1190"]}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1222", "text": ["You have selected the NOT gate. The buffer is always drawn as a triangle.", "You have selected the NOT gate. The buffer is always drawn as a triangle..."], "jumps": []}, {"id": "P1223", "text": ["You have selected the OR gate. The buffer is always drawn as a triangle.", "You have selected the OR gate. The buffer is always drawn as a triangle...."], "jumps": []}, {"id": "P1224", "text": ["You have selected the AND gate. The buffer is always drawn as a triangle.", "You have selected the AND gate. The buffer is always drawn as a triangle..."], "jumps": []}, {"id": "P1230", "text": ["What purpose is the buffer performing in this circuit?", "What purpose is the buffer performing in this circuit?....."], "jumps": ["P1220"]}, {"id": "P1232", "text": [], "jumps": []}, {"id": "P1233", "text": ["The 5 volts applied to the buffer is a normal digital voltage. The buffer does not need to protect the NOT or AND functions from the 5 volts."], "jumps": []}, {"id": "P1235", "text": ["The 5 volt input to the buffer is the same voltage level as the output of the buffer. The NOT and AND functions do not require more than the 5 volts to operate."], "jumps": []}, {"id": "P1240", "text": ["Now, let's discuss the Inverter.", "Now, let's discuss the Inverter............................"], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["The inverter is a combination of the buffer and NOT function. A HIGH input is LOW at the output and a LOW input is HIGH at the output."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["When the NOT function is used with other digital circuits, the NOT function is represented with a circle, commonly referred to a BUBBLE."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["The inverter is used to change the output of a digital circuit to the opposite condition of the input."], "jumps": ["P1272", "P1250"]}, {"id": "P1272", "text": ["Schematically, inverters can be drawn with the bubble on the input. The gate will functionally operate the same."], "jumps": ["P1274", "P1250"]}, {"id": "P1274", "text": ["When a buffer is desired but none are available, two inverters can be used in the configuration shown below.", "When a buffer is desired but none are available, two inverters can be used in the configuration shown below.aghts are ON."], "jumps": ["P1280"]}, {"id": "P1280", "text": ["For example, the output of this circuit must turn ON light 1 and turn OFF light 2. With a high output both lights are ON."], "jumps": ["P1290"]}, {"id": "P1290", "text": ["If an inverter is placed in the circuit, the HIGH output is inverted to a LOW, so light 2 is OFF."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["The truth table for the inverter is the opposite of the buffer.", "Inverter Truth Table Input Output 1 0 0 1"], "jumps": ["P1310", "P1280"]}, {"id": "P1310", "text": ["Touch the buffer in this circuit.", "Touch the buffer in this circuit..........................."], "jumps": ["P1300"]}, {"id": "P1311", "text": [], "jumps": []}, {"id": "P1312", "text": ["Remember, the buffer is a triangle shaped circuit without the NOT  function attached.", "Remember, the buffer is a triangle shaped circuit without the NOT function attached."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on BUFFERS AND INVERTERS.", "This completes the information on BUFFERS AND INVERTERS...."], "jumps": ["P1001", "P1310"]}, {"id": "P1920", "text": ["1.  The buffer circuit produces a high output when the input is             high and a low output when the input is low.", "1. The buffer circuit produces a high output when the input is high and a low output when the input is low."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  The truth table for the buffer represents the two combinations        of input/output signals.", "2. The truth table for the buffer represents the two combinations of input/output signals..", "Buffer Truth Table Input Output 1 1 0 01"], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The inverter circuit produces a high output when the input is          low and a low output when the input is high.", "3. The inverter circuit produces a high output when the input is low and a low output when the input is high."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  The truth table for the inverter represents the two                               combinations of input/output signals.", "4. The truth table for the inverter represents the two combinations of input/output signals..", "Input Output 0 1 1 0"], "jumps": ["P1999", "P1940"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.nu."], "jumps": ["P1001", "P1950"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2040", "text": ["While we commonly think of logic highs & lows as 0 volts and 5 volts, there is an acceptable voltage range. The range is stipulated by the manufacturer and defines what is considered a logic high or low.", "While we commonly think of logic highs & lows as 0 volts and 5 volts, there is an acceptable voltage range. The range is stipulated by the manufacturer and defines what is considered a logic high or low..w."], "jumps": ["P2050", "P2001"]}, {"id": "P2050", "text": ["Let's examine the ranges for a 5 volt system using standard TTL logic."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["When TTL was devised, it was agreed upon by industry that logic LOW's would be defined as any voltage level .8 volts or less and logic HIGH's as 2 volts or more."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["There's actually some degree of variance involved based on whether we are looking at an input or output.", "Input Output High = 2 V min High = 2.4 V min Low = .8 V max Low = .4 V maxxxxxxxxxx", "Input Output High = 2 V min High = 2.4 V min Low = .8 V max Low .4 V max"], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["These are the manufacturer's guaranteed voltages. Notice that the output voltages have stiffer mandatory levels.", "These are the manufacturer's guaranteed voltages. Notice that the output voltages have stiffer mandatory levels. to determine proper operation.", "Input Output High = 2 V min High = 2.4 V min Low = .8 V max Low .4 V max", "Input Output High = 2 V min High = 2.4 V min Low = .8 V max Low = .4 V maxxxxxxxxxx"], "jumps": ["P2090", "P2040"]}, {"id": "P2090", "text": ["This ensures that TTL outputs will always meet the minimum and maximum input requirements of another  TTL gate.", "This ensures that TTL outputs will always meet the minimum and maximum input requirements of another TTL gate.", "Input Output High = 2 V min High = 2.4 V min Low = .8 V max Low .4 V max", "Input Output High = 2 V min High = 2.4 V min Low = .8 V max Low = .4 V maxxxxxxxxxx"], "jumps": ["P2100", "P2040"]}, {"id": "P2100", "text": ["The voltages between .8 volts and 2 volts are considered indeterminate and illegal in as much as they are not valid logic levels.", "The voltages between .8 volts and 2 volts are considered indeterminate and illegal in as much as they are not valid logic levels..........................................."], "jumps": ["P2110", "P2040"]}, {"id": "P2110", "text": ["Indeed, when troubleshooting a TTL circuit and a voltage is measured that's between .8 and 2 V, it is often called a \"float\" and points to a likely open in the circuit."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["The actual point where a TTL device switches from a low to a high or a high to a low is normally at roughly 1.4 volts, but to build in a margin of error, the .8 and 2V levels were established."], "jumps": ["P2130", "P2100"]}, {"id": "P2130", "text": ["One of the reasons for the broad range between the valid logic HIGH and the valid logic LOW, is the effect of noise on logic levels.", "One of the reasons for the broad range between the valid logic HIGH and the valid logic LOW, is the effect of noise on logic levels.."], "jumps": ["P2140", "P2100"]}, {"id": "P2140", "text": ["If we assume that switching indeed occurs at 1.4V and measured LOW/HIGH levels were at 1.0 V/1.6 V, a positive going noise spike of only 600 mV could drive a low to a high."], "jumps": ["P2150", "P2100"]}, {"id": "P2150", "text": ["A full discussion of noise effects on logic circuits is discussed in the Logic Families lesson."], "jumps": ["P2160", "P2100"]}, {"id": "P2160", "text": ["Click on the area that is sometimes called a \"float\" in TTL circuits.", "Click on the area that is sometimes called a \"float\" in TTL circuits.OW if the lower threshold is .8 volts?"], "jumps": ["P2100"]}, {"id": "P2161", "text": [], "jumps": []}, {"id": "P2170", "text": ["Label the following volt levels as HIGH, LOW or IND (indeterminate)", "Label the following volt levels as HIGH, LOW or IND (indeterminate) a LOW if the lower threshold is .8 volts?"], "jumps": ["P2160"]}, {"id": "P2171", "text": [], "jumps": []}, {"id": "P2177", "text": ["You should have answered HIGH, IND, LOW, IND, HIGH.", "You should have answered HIGH, IND, LOW, IND, HIGH.and is the HIGH threshold level. This voltage will cause the circuit to change to a HIGH condition."], "jumps": []}, {"id": "P2190", "text": ["Select the voltage that would be recognized by a digital circuit as a LOW if the lower threshold is .8 volts?"], "jumps": ["P2170"]}, {"id": "P2191", "text": [], "jumps": []}, {"id": "P2192", "text": ["2 volts is above the LOW threshold level of .8 volts and is the HIGH threshold level. This voltage will cause the circuit to change to a HIGH condition."], "jumps": []}, {"id": "P2193", "text": ["1.5 volts is above the LOW threshold level of .8 volts. This voltage is in the unknown area and it might cause the circuit to change to a HIGH condition."], "jumps": []}, {"id": "P2200", "text": ["Remember, if the voltage is moving from LOW to HIGH, it must cross over the 2 volt level before a HIGH condition is guaranteed.", "Remember, if the voltage is moving from LOW to HIGH, it must cross over the 2 volt level before a HIGH condition is guaranteed.eed."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["If the voltage is moving from HIGH to LOW, it must cross the .8 level before a LOW condition is guaranteed.", "If the voltage is moving from HIGH to LOW, it must cross the .8 level before a LOW condition is guaranteed.eed."], "jumps": ["P2910", "P2200"]}, {"id": "P2800", "text": [], "jumps": []}, {"id": "P2910", "text": ["This completes the information on INPUT/OUTPUT VOLTAGES.", "This completes the information on INPUT/OUTPUT VOLTAGES...."], "jumps": ["P2001", "P2200"]}, {"id": "P2920", "text": ["1. Logic \"HIGH's\" and \"LOW's\" are guaranteed by manufacturers at levels they established. TTL levels are < .8 volts for LOW and > 2.0 volts for HIGH."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2.  When logic levels are expressed on a chart there are three              areas, ON, OFF and unknown.", "2. When logic levels are expressed on a chart there are three areas, ON, OFF and unknown.wn."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3.  Switching in logic gates occurs in the unknown, aka                          indeterminate or float region.", "3. Switching in logic gates occurs in the unknown, aka indeterminate or float region."], "jumps": ["P2999", "P2930"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.nu."], "jumps": ["P2001", "P2940"]}, {"id": "P3001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P3020", "text": ["The purpose of this experiment is to demonstrate the effects of  varied voltage levels on a digital circuit. The output voltage of a buffer circuit is measured when the input voltage is slowly increased and decreased.", "The purpose of this experiment is to demonstrate the effects of varied voltage levels on a digital circuit. The output voltage of a buffer circuit is measured when the input voltage is slowly increased and decreased...ed.m"], "jumps": ["P3060", "P3001"]}, {"id": "P3060", "text": ["Pick up card PC130-106. Note, there is a single IC on this card. This IC will perform the 4 functions shown on the card."], "jumps": []}, {"id": "P3070", "text": ["Remember,  IC's are very versatile components.  Each function uses different pins and internal circuits of the IC.  Remember, the IC is a very versatile component.", "Remember, IC's are very versatile components. Each function uses different pins and internal circuits of the IC. Remember, the IC is a very versatile component."], "jumps": ["P3060"]}, {"id": "P3080", "text": ["What type of circuit is circuit B?", "What type of circuit is circuit B?........................."], "jumps": []}, {"id": "P3081", "text": [], "jumps": []}, {"id": "P3082", "text": ["Circuit C is a buffer. Note, this circuit doesn't have the NOT function."], "jumps": []}, {"id": "P3083", "text": ["Circuit D is a double inverter. The signal is inverted at the input and at the output. Circuit D can also be considered a buffer."], "jumps": []}, {"id": "P3090", "text": ["Before measuring threshold voltages of an IC, use the Data Book to determine the acceptable threshold voltage levels. If you have a Data Book use it. If you don't, select help. Let's start the experiment.", "Before measuring threshold voltages of an IC, use the Data Book to determine the acceptable threshold voltage levels. If you have a Data Book use it. If you don't, select help. Let's start the experiment..."], "jumps": ["P3080", "P3095"]}, {"id": "P3095", "text": ["IC Number SN7404N Input Low Voltage +.8 Volts Input High Voltage +2.0 Volts"], "jumps": []}, {"id": "P3100", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P3090"]}, {"id": "P3110", "text": ["2.  Carefully plug PC130-106 into the Test Console PC1 position.", "2. Carefully plug PC130-106 into the Test Console PC1 position. to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P3100"]}, {"id": "P3120", "text": ["3.  Set Voltmeter switch to Positive. \n4.  Set the Positive Supply Voltage to 5.\n     The Test Console's voltage meter should indicate 5 volts.", "3. Set Voltmeter switch to Positive. 4. Set the Positive Supply Voltage to 5. The Test Console's voltage meter should indicate 5 volts."], "jumps": ["P3110"]}, {"id": "P3130", "text": ["5.  Set your Multimeter to measure + DC voltage.\n6.  Set the Oscilloscope to the following settings:", "5. Set your Multimeter to measure + DC voltage. 6. Set the Oscilloscope to the following settings:Set the Oscilloscope to the following settings::", "Volts/Div - 2V Vert. Mode - CH1 Source - CH1 Time/Div - 20 msec Input - DC"], "jumps": ["P3120"]}, {"id": "P3132", "text": ["9. Press Enter to set: PC1 DC Power Switch - ON", "9. Press Enter to set: PC DC Power Switch - ON let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
