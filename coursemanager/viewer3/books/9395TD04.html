<script>
const book = {"title": "9395TD04", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Title: TRANSMISSION LINESD TRANSMISSION LINES asdf sadf", "Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Identify transmission line operating characteristics. w Identify the different types of transmission lines. and receiver."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["This lesson will help you understand the purpose and terminology of transmission lines. and commercial users."], "jumps": ["P300", "P410"]}, {"id": "P410", "text": ["Transmission lines provide the physical medium to guide output energy from the transmitter to the antenna, received information from the antenna to the receiver and signals between various system components."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Each type of transmission line has certain charecteristic impedance values, current capacity, and physical shape designed to meet a particular requirement. This lesson will concentrate on two wires: coaxial and waveguides. ent."], "jumps": ["P410", "P440"]}, {"id": "P440", "text": ["Let's begin the lesson on TRANSMISSION LINES.MISSION LINES................"], "jumps": ["P410"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Transmission lines provide the physical medium to guide output energy from the transmitter to the antenna, received information from the antenna to the receiver and signals between various system components."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["All transmission lines have two ends. The end that is connected to a source is called the Input End or Source. The other end of the line is called the Output End or Load. antenna. istic Impedance (Z )"], "jumps": ["P1040"]}, {"id": "P1040", "text": ["You can describe a transmission line in terms of impedance. The input impedance (Z ) is the impedance that is presented to the transmitter by the transmission line and its load, the antenna. istic Impedance (Z )"], "jumps": ["P1050"]}, {"id": "P1050", "text": ["The Output Impedance (Z ) is the impedance that is presented to the load by the transmission line and its source. The impedance at any point of an infinitely long transmission line is known as the Characteristic Impedance (Z )", "To transfer the maximum amount of energy from the source to load, the impedance must be matched or equal between the input and output. Mismatched impedance will result in damaging standing waves reflected back toward the source. Mismatch c", "To transfer the maximum amount of energy from the source to load, the impedance must be matched or equal between the input and output. Mismatched impedance will result in damaging standing waves reflected back toward the source. Mismatch causes loss of power."], "jumps": ["P1060", "P1070"]}, {"id": "P1065", "text": ["STANDING WAVES - Transmission line mismatched impedance that causes a portion of the transferred energy to reflect back toward the source from the point where the mismatch occurred."], "jumps": []}, {"id": "P1066", "text": ["Standing waves reduce the output power that is delivered to the antenna and are measured in ratios. VSWR is voltage standing wave ratio, ISWR is current standing wave ratio, SWR is expressed as a ratio of the maximum value of the current or voltage in the standing wave. A ratio of 1 indicates no standing wave.o standing wave.............."], "jumps": []}, {"id": "P1067", "text": ["Standing waves are produced when part of the signal in the waveguide is reflected back to the source."], "jumps": []}, {"id": "P1068", "text": ["The two signals (the incident wave (or original wave) and the reflected wave) combine to produce a wave that does not move, a standing wave. Standing waves can never be completely eliminated. However, low standing wave ratios can be achieved."], "jumps": []}, {"id": "P1070", "text": ["Radio Frequency (RF) communications and RADAR signal processing systems send electrical pulses from component to component."], "jumps": ["P1080"]}, {"id": "P1080", "text": ["The physical structure that will guide the signal (electromagnetic waves) from place to place is defined as a transmission line."], "jumps": ["P1070", "P1090"]}, {"id": "P1090", "text": ["Transmission lines are conductors or a series of conductors used to form a continuous path from component to component."], "jumps": ["P1070", "P1100"]}, {"id": "P1100", "text": ["Lines used to connect your television set to an antenna or a cable service are transmission lines. nter of the conductor."], "jumps": []}, {"id": "P1110", "text": ["The optimum transmission line is one that provides maximum transfer with minimum loss due to the properties of the line."], "jumps": ["P1090", "P1120"]}, {"id": "P1120", "text": ["Whenever a conductor transfers energy, the natural resistance of the conductor causes a power loss due to dissipated heat."], "jumps": ["P1090", "P1130"]}, {"id": "P1130", "text": ["If the line is of any considerable length, this could be a large amount of power loss. This type of loss is referred to as copper loss."], "jumps": ["P1090", "P1140"]}, {"id": "P1140", "text": ["High frequency current has a tendency to flow to the outside of the conductor. This is called skin effect."], "jumps": ["P1090", "P1150"]}, {"id": "P1150", "text": ["As frequency increases the depth of penetration into the conductive surface decreases. The magnetic flux surrounding each moving electron encounters more resistances towards the center of the conductor."], "jumps": ["P1160"]}, {"id": "P1160", "text": ["This reduces the effective cross section of the conductor. Meaning the size of the useful part of the conductor is reduced."], "jumps": ["P1170"]}, {"id": "P1170", "text": ["Depth of penetration of the current is defined as skin depth. Skin depth is the distance into the conducting medium for which current is reduced."], "jumps": ["P1140", "P1180"]}, {"id": "P1180", "text": ["One way to reduce the loss is to increase the surface area of the conductor. he conductor."], "jumps": ["P1140", "P1190"]}, {"id": "P1190", "text": ["This is why in higher frequency applications a waveguide (hollow conductor) is more effective than a standard wire or cable type conductors for transmission lines."], "jumps": ["P1200"]}, {"id": "P1200", "text": ["The second property of transmission lines is induction loss."], "jumps": ["P2140", "P1210"]}, {"id": "P1210", "text": ["Electromagnetic waves are made of electric fields associated with voltage and magnetic fields associated with current flow."], "jumps": ["P2150", "P1220"]}, {"id": "P1220", "text": ["When the magnetic field expands and collapses it induces voltage and current into conducting material near the transmission lines; resulting in a power loss to nearby items. This type of loss is called induction."], "jumps": ["P1200", "P2180"]}, {"id": "P1230", "text": ["One method used to reduce the induction loss is to use standoff insulators between the transmission line and other surfaces. Standoff insulators are used on common television antenna wires."], "jumps": ["P2190"]}, {"id": "P1240", "text": ["Radiation loss is similar to induction loss. However, the loss is to the atmosphere and not to a nearby object. This type of loss is desirable in an antenna, but undesirable in a transmission line."], "jumps": []}, {"id": "P1250", "text": ["In both induction and radiation, expanding and collapsing the flux field at even faster rates tends to increase the number of flux lines which never return to the inductor."], "jumps": []}, {"id": "P1260", "text": ["Placing a shield around the conductor of the transmission line prevents interaction with other circuits. This type of shielding reduces the radiation and induction losses."], "jumps": ["P2220"]}, {"id": "P1270", "text": ["On a two wire transmission line, the insulation is the dielectric for the capacitance of the line. Charged and discharged, the electrons of the dielectric (insulation) continuously change."], "jumps": []}, {"id": "P1280", "text": ["This type of energy loss is called dielectric loss and is normally in the form of heat dissipation."], "jumps": []}, {"id": "P1290", "text": ["The loss is held to a minimum with the use of high resistance dielectric (insulation)."], "jumps": ["P1270", "P2250"]}, {"id": "P1300", "text": ["Dielectric loss appears as a resistive loss to the power source and increases as the frequency is increased."], "jumps": ["P1270", "P2260"]}, {"id": "P1310", "text": ["What type of power loss is caused by expanding and collapsing magnetic fields inducing a voltage and current into surfaces near the transmission line?"], "jumps": ["P1270"]}, {"id": "P1311", "text": [], "jumps": []}, {"id": "P1312", "text": ["Skin effect is a power loss caused by high frequency currents that flow away from the center of the conductor."], "jumps": []}, {"id": "P1313", "text": ["Copper loss is a decrease in power due to the conductors resistance, especially noticed in long lines."], "jumps": []}, {"id": "P1320", "text": ["What type of power loss is due to high frequency currents flowing near the outer surface of the conductor?"], "jumps": ["P1310"]}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1322", "text": ["Induction loss is a decrease in power caused by expanding and collapsing magnetic fields which induce voltage and current in other nearby surfaces..."], "jumps": []}, {"id": "P1323", "text": ["Copper loss is a decrease in power due to the conductors resistance, especially noticed in long lines."], "jumps": []}, {"id": "P1330", "text": ["There are several factors to consider when selecting a transmission line. For example; the breakdown voltage, power loss at the required frequency, stability of dielectric, flexibility and cost."], "jumps": ["P1340"]}, {"id": "P1340", "text": ["There are many different types of transmission lines used today. In this lesson we will discuss four of the most used types."], "jumps": ["P1330", "P1350"]}, {"id": "P1350", "text": ["Anyone who has had cable television service has used a flexible coaxial cable. This type of transmission line is most commonly used in radio, television, microwave and RADAR services."], "jumps": ["P2310"]}, {"id": "P1360", "text": ["The center wire is the conductor and is usually solid. The outer conductor is a metal braid to give the line flexibility and strength."], "jumps": []}, {"id": "P1370", "text": ["The two conductors are separated by a dielectric (insulating) material usually polyethylene...plastic."], "jumps": ["P1350", "P2330"]}, {"id": "P1380", "text": ["This type of transmission line has very little radiation loss because the inner conductor is shielded by the outer conductor."], "jumps": ["P1350", "P2340"]}, {"id": "P1390", "text": ["This cable is capable of transferring large amounts of power at high frequencies with only small amounts of skin effect and dielectric loss."], "jumps": ["P1350", "P2350"]}, {"id": "P1400", "text": ["Another type of coaxial cable is the rigid coaxial. Just like the flexible coaxial cable, there is a center and an outer conductor."], "jumps": ["P2360"]}, {"id": "P1410", "text": ["However, the outer conductor is a rigid metal tube and has insulating disks to separate the center from the outer conductor."], "jumps": []}, {"id": "P1420", "text": ["Similar to the flexible coaxial cable, the rigid coaxial has little radiation loss and is used for large power and frequencies up to 3 GHz. _"], "jumps": ["P1400", "P2380"]}, {"id": "P1430", "text": ["Another commonly used cable is the twin lead line. This cable is used widely for television reception."], "jumps": ["P2390"]}, {"id": "P1440", "text": ["The twin lead line consists of two conductors molded into the edges of a polyethylene strip or ribbon. The polyethylene is solid enough to keep the conductors separated."], "jumps": []}, {"id": "P1450", "text": ["This line is still flexible enough to bend around corners.."], "jumps": ["P2410"]}, {"id": "P1460", "text": ["Because of the small size and distance between the two conductors, the twin lead is used for transmission of low power frequencies up to 200 MHz."], "jumps": []}, {"id": "P1470", "text": ["Another type of line can be used for low power transmissions besides the twin lead. It is the Open Two Wire line. It has two bare conductors spaced by insulators. The insulators maintain an even space between the wires."], "jumps": ["P2430"]}, {"id": "P1480", "text": ["Diameter of the conductor Frequency transmitted Characteristic impedance required", "There are three factors that determine the distance between the two conductors of a open two wire line."], "jumps": []}, {"id": "P1490", "text": ["Due to the fact that the conductors are bare with no shielding, the major power loss is due to radiation loss."], "jumps": []}, {"id": "P1500", "text": ["The simplest and less expensive transmission line is the twisted pair. Most commonly used for telephone circuits, household appliance and other low frequency purposes."], "jumps": ["P1480", "P2460"]}, {"id": "P1510", "text": ["The twisting of the two wires equalizes the effect of stray fields on both conductors. This type of cable is also used for low voltage and low frequency transmission."], "jumps": []}, {"id": "P1520", "text": ["What type of transmission line has two conductors molded into the edges of a polyethylene strip or ribbon and is used for frequencies up to 200 MHz?"], "jumps": ["P1500"]}, {"id": "P1521", "text": [], "jumps": []}, {"id": "P1522", "text": ["Flexible Coaxial has a solid center conductor and a braided outer conductor. This type of line is used for large power and high frequency."], "jumps": []}, {"id": "P1523", "text": ["Open two-wire has two bare wire conductors with spacers to maintain an even space between the two."], "jumps": []}, {"id": "P1530", "text": ["Log = mF/1000 ft. C = 19.43 x e", "Log = mF/mile e of the Two Signals (Origianal Audio)", "The amount of capacitance is determined by the size of the conductor (s), type of dielectric material (e) and the distance between the conductors (d)."], "jumps": ["P2490"]}, {"id": "P1540", "text": ["Log = mF / 1000 ft. C = 3.68 x e", "Log = mF / mile ft. e of the Two Signals (Origianal Audio)", "The opposition to alternating current due to the capacitance of the line is called characteristic impedance."], "jumps": []}, {"id": "P1550", "text": ["Log = mF / 1000 ft. C = 3.68 x e", "Log = mF / mile ft. e of the Two Signals (Origianal Audio)", "Characteristic impedance (Zo) can be calculated using the values for inductance (L) and capacitance (C)."], "jumps": []}, {"id": "P1560", "text": ["A transmission line can be measured in length electrically and physically."], "jumps": ["P2520"]}, {"id": "P1570", "text": ["Electrical length is a comparison of physical length and wavelength. Wavelength is the distance the energy travels down the line during one cycle."], "jumps": []}, {"id": "P1580", "text": ["To determine electrical length you must understand frequency wavelength. RF (radio frequency) signals travel at the speed of light, 186,000 miles per second."], "jumps": ["P1570", "P2540"]}, {"id": "P1590", "text": ["However, the transmission line has inductance and shunt capacitance. This slows the RF signal down."], "jumps": ["P1570", "P2550"]}, {"id": "P1600", "text": ["Because different types of lines have different characteristics the effect they have on RF signal speed (velocity) is different."], "jumps": ["P2560"]}, {"id": "P1610", "text": ["Wavelength ( l) = = 3 meters (180 million = 60% of speed of light)", "To determine the frequency wavelength of a 60 MHz signal through a twisted pair line that is rated at 60% speed of light, divide the velocity by the frequency."], "jumps": []}, {"id": "P1620", "text": ["Electrical Length = 5 Wavelengths = 3 Meters (180 million = 60% of speed of light)", "Now that we have the frequency length, the electrical length can be determined. Dividing the physical length by the frequency length will result in the electrical length."], "jumps": []}, {"id": "P1630", "text": ["As you can see the type of transmission line used plays an important role in signal transmission and reception. Remember that all line characteristics need to be considered for good communication."], "jumps": ["P1910", "P1620"]}, {"id": "P1910", "text": ["This completes the information on TRANSMISSION LINES......."], "jumps": ["P2580", "P1001"]}, {"id": "P1920", "text": ["Transmission Line Properties (180 million = 60% of speed of light)", "Resistive Loss Induction Loss Radiation Loss Capacitive Loss = 3 Meters (180 million = 60% of speed of light)", "1. The optimum transmission line is one that provides maximum transfer with minimum loss due to the properties of the line."], "jumps": ["P1001", "P1930"]}, {"id": "P1930", "text": ["2. There are several factors to consider when selecting a transmission line. For example; the breakdown voltage, power loss at the required frequency, stability of dielectric, flexibility and cost."], "jumps": ["P1920", "P1940"]}, {"id": "P1940", "text": ["3. Since all lines are not the same in characteristic values, the velocity of the signal is different for the different types of lines."], "jumps": ["P1930", "P1950"]}, {"id": "P1950", "text": ["Wavelength ( l) = = 3 meters (180 million = 60% of speed of light)", "4. To determine the frequency wavelength of a 60 MHz signal through a twisted pair line that is rated at 60% speed of light, divide the velocity by the frequency."], "jumps": ["P1940", "P1999"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1950", "P1001"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["What are the types of losses are associated with transmission lines?"], "jumps": []}, {"id": "P10211", "text": ["distributed inductance and capacitance of the line"], "jumps": []}, {"id": "P10212", "text": ["What type of loss is due to the expanding and collapsing magnetic fields inducing a voltage and current in surfaces near the transmission line?"], "jumps": []}, {"id": "P10213", "text": ["What type of loss is due to high frequency currents flowing near the outer surface of the conductor?"], "jumps": []}, {"id": "P10214", "text": ["When a portion of electric energy is lost to the atmosphere, not a nearby object, it is called _______ __ and not to a nearby object"], "jumps": []}, {"id": "P10215", "text": ["What type of loss is due to the capacitance formed between transmission lines? i"], "jumps": []}, {"id": "P10216", "text": ["What type of loss is due to resistance, especially in long lines?"], "jumps": []}, {"id": "P10217", "text": ["What type of transmission line uses the outer conductor to shield the center conductor?"], "jumps": []}, {"id": "P10218", "text": ["What type of transmission line allows the greatest RF velocity (97% of the speed of light)?"], "jumps": []}, {"id": "P10219", "text": ["Which transmission line allows the least velocity (60% of the speed of light)?"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is 60%. Do you want to __________"], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "PINFO", "text": ["12-16-03 Made changes to lesson B104 and made single objective lesson. frieda 01-15-04 Reviewed lesson and made change on P06", "12-16-03 Made changes to lesson B104 and made single objective lesson. frieda 01-15-04 Reviewed lesson and made change on P1066 - the I to correct current symbol. frieda 01-21-04 P1060 added mismatch causes loss of power at end of sentence. P1130 dehighlighed skin depth and added due to dissipated heat at end of sentence. P1280 changed capacitive loss to dielectric loss in text. P1360 explained conductor. P1370 explained how conductors are separated. frieda 01-22-04 P1300 changed word \"capacitive\" to \"dielectric\". frieda 01-26-04 Turned off all visible components and menu bar in properties for viewer. frieda"], "jumps": []}]};
let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
