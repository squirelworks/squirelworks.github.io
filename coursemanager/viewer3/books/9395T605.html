25", "text": ["Which term is a synonym for certification?"], "jumps": []}, {"id": "P10224", "text": ["What academic concentrations are offered to telecom PhDs?"], "jumps": []}, {"id": "P10223", "text": ["A Bachelor of Science degree in telecom includes a considerable number of course hours in _______"], "jumps": []}, {"id": "P10222", "text": [], "jumps": []}, {"id": "P10221", "text": ["Which of the following training organizations can issue accredited occupational certificates in telecom?"], "jumps": []}, {"id": "P10220", "text": ["Which of the following is not considered an occupational certificate?"], "jumps": []}, {"id": "P10219", "text": ["What types of telecom knowledge workers are found in government service?"], "jumps": []}, {"id": "P10218", "text": ["Which of the following tasks are performed by the customer support group?", "Returned Material Authorization (RMA) support"], "jumps": []}, {"id": "P10217", "text": ["Hardware and software engineering functions differ from field engineering in what way?", "Field engineering is research & development.", "Hardware and field engineering are the same.", "Field engineering is performed on customers' premises."], "jumps": []}, {"id": "P10216", "text": ["What position in a company is typically held by the founding entrepreneur?"], "jumps": []}, {"id": "P10215", "text": ["What task(s) is/are performed by telecom technicians?"], "jumps": []}, {"id": "P10214", "text": ["Which occupational group is the largest in the telecom industry?"], "jumps": []}, {"id": "P10213", "text": ["A professional who designs sales strategies", "A sales person that sells engineering products", "A sales person that is a certified engineer", "A sales person that works for an engineering company"], "jumps": []}, {"id": "P10212", "text": ["Which of the following companies would have a traditional organizational infrastructure?"], "jumps": []}, {"id": "P10211", "text": ["What motivates an entrepreneur to start a business?"], "jumps": []}, {"id": "P10210", "text": ["A person with specific skills knowledge", "Which of the following are characteristics of a telecom knowledge worker?"], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2950"]}, {"id": "P2950", "text": ["4. Certifying agencies support the telecom industry by ensuring the professional population is doing the job correctly. This is accomplished through certification and licensing."], "jumps": ["P2999", "P2940"]}, {"id": "P2940", "text": ["3. Telecom education requirements range from high school graduate to PhD. There are a variety of major subjects in the telecom field including networking, management, engineering and education..."], "jumps": ["P2950", "P2930"]}, {"id": "P2930", "text": ["2. Telecom knowledge workers are educated and certified. There are many goals in life. Each person has the same decision. Which path do I follow?agement, engineering and education..."], "jumps": ["P2940", "P2920"]}, {"id": "P2920", "text": ["1. The career path concept is a system that is designed by you to meet your professional goals."], "jumps": ["P2930", "P2001"]}, {"id": "P2910", "text": ["This completes the information on EDUCATION AND CERTIFICATION."], "jumps": ["P2001", "P2720"]}, {"id": "P2720", "text": ["The career path must include the right training to support upgraded certification and technology. Professionals plan for their own training. Training should be annual or more frequent depending on the certification..."], "jumps": ["P2910", "P2700"]}, {"id": "P2710", "text": ["The training process step is diverse like the education step. Training may be obtained from many sources. If the local college doesn't offer the desired program, a training institution may offer an equivalent. Training must be accredited like education..."], "jumps": ["P2720", "P2700"]}, {"id": "P2700", "text": ["Looking at Mike's career, by the 12- year point Mike could have certified Technician First Class, or with some college, Engineer First Class. Mike could have set the goal anywhere. Maybe he would have gone into business to become a sales engineer..."], "jumps": ["P2710", "P2690"]}, {"id": "P2690", "text": ["Another service provided by NARTE is FCC examination administration. NARTE provides a number of testing sites throughout the US to meet FCC licensing requirements."], "jumps": ["P2700", "P2680"]}, {"id": "P2680", "text": ["The federal Communications Commission (FCC) issues licenses related to telecommunications. The following is a sample of FCC Licenses: Restricted Radiotelephone Operator Permit * Marine Radio Operator Permit * General Radiotelephone Operator License (GROL) * Radar Endorsement (to a license) * Global maritime Distress and Safety System (GMDSS) Radio Operator License", "Restricted Radiotelephone Operator Permit erience) Engineers (NARTE) * Installation * Operation & Maintenance * Administration * Educationnn", "Marine Radio Operator Permit 5 years experience) neers (NACSE) ing * Installation * Operation & Maintenance * Administration * Educationnn", "General Radiotelephone Operator License (GROL) ce) ng * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Radar Endorsement (to a license) years experience) g * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Global Maritime Distress and Safety System (GMDSS) Radio Operator License * Operation & Maintenance * Administration * Educationnn"], "jumps": ["P2690", "P2670"]}, {"id": "P2670", "text": ["Licenses are certifications issued by regulatory bodies. Renewal requirements for licenses are critical because the work performed may not be legal without a license, like driving a car without an operator's license.ithout an operator's license..."], "jumps": ["P2680", "P2660"]}, {"id": "P2663", "text": ["Recertification happens after training....................."], "jumps": []}, {"id": "P2662", "text": ["Training supports the recertification step. Retirement is not a career path process."], "jumps": []}, {"id": "P2661", "text": [], "jumps": []}, {"id": "P2660", "text": ["When does the certification process start in the career path?", "During the training step but before the retirement step"], "jumps": ["P2650"]}, {"id": "P2650", "text": ["The certifying agencies also have engineer level certifications. Manufacturers and other industry companies have certifications too. Microsoft and CISCO offer software and networking certifications.."], "jumps": ["P2660", "P2640"]}, {"id": "P2640", "text": ["The National Association of Communications Systems Engineers (NACSE) offers the following: * Cable Technician * Certified Webmaster * Telecom Associate (Entry Level) * Infrastructure Architect (Web)", "Cable Technician cs Technician (CET) xperience) Engineers (NARTE) * Installation * Operation & Maintenance * Administration * Educationnn", "Certified Webmaster alist (Telecom endorsement) neers (NACSE) ing * Installation * Operation & Maintenance * Administration * Educationnn", "Telecom Associate (Entry Level) good one for Mike ng * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Infrastructure Architect (Web) years experience) g * Engineering * Installation * Operation & Maintenance * Administration * Educationnn"], "jumps": ["P2650", "P2630"]}, {"id": "P2630", "text": ["The Electronics Technician Association (ETA) offers the following: * Certified Electronics Technician (CET) * Customer Service Specialist (Telecom endorsement) * Fiber Optics Technician (Another good one for Mike) * Computer Service Technician (A+) * Network Systems Technician * E-Commerce developer", "* E-Commerce developerrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr", "Certified Electronics Technician (CET) xperience) Engineers (NARTE) * Installation * Operation & Maintenance * Administration * Educationnn", "Customer Service Specialist (Telecom endorsement) neers (NACSE) ing * Installation * Operation & Maintenance * Administration * Educationnn", "Fiber Optics Technician (Another good one for Mike) ng * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Computer Service Technician (A+) years experience) g * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Network Systems Technician echnician s experience) g * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "E-Commerce developer e (ESD) Technician xperience) g * Engineering * Installation * Operation & Maintenance * Administration * Educationnn"], "jumps": ["P2640", "P2620"]}, {"id": "P2620", "text": ["NARTE offers a selection of technician level certifications: Telecom Technician Class 4 (0 - 2 years experience) * Telecom Technician Class 3 (2 - 5 years experience) * Telecom Technician Class 2 (6 - 7 years experience) * Telecom Technician Class 1 (Over 8 years experience) * Wireless Systems Installer Technician * Electrostatic Discharge (ESD) Technician", "Telecom Technician Class 4 (0 - 2 years experience) Engineers (NARTE) * Installation * Operation & Maintenance * Administration * Educationnn", "Telecom Technician Class 3 (2 - 5 years experience) neers (NACSE) ing * Installation * Operation & Maintenance * Administration * Educationnn", "Telecom Technician Class 2 (6 - 7 years experience) ng * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Telecom Technician Class 1 (over 8 years experience) g * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Wireless Systems Installer Technician s experience) g * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Electrostatic Discharge (ESD) Technician xperience) g * Engineering * Installation * Operation & Maintenance * Administration * Educationnn"], "jumps": ["P2630", "P2610"]}, {"id": "P2610", "text": ["Remember Teresa, the human resources interviewer and telecom knowledge worker. She is a human resources person with a Class 3 Telecommunications Technician certification. Her endorsements are in telephone technology and administration. Mike notices a certificate behind her on the wall.", "Glad to have you with us Mike. Let me introduce you to your work leader"], "jumps": ["P2620", "P2600"]}, {"id": "P2600", "text": ["7. Renew or upgrade the certification annually. Every year the certified person should evaluate their experience and training for the next higher certification."], "jumps": ["P2610", "P2590"]}, {"id": "P2590", "text": ["6. Pass the written examination. This requirement may be waved if the applicant has recently graduated for college or holds an FCC license of the application type."], "jumps": ["P2600", "P2580"]}, {"id": "P2580", "text": ["5. Apply for at least 1 endorsement to the certification. An endorsement is a specialty attachment. In Mike's case, fiber optics and networking would be good choices..."], "jumps": ["P2590", "P2560"]}, {"id": "P2570", "text": ["4. Submit materials required. NARTE wants applicants to provide test questions and references. Other agencies may require essays, test procedures for the particular specialty, or other related materials....."], "jumps": ["P2580", "P2560"]}, {"id": "P2560", "text": ["3. Submit reference forms. These forms are completed by supervisory personnel."], "jumps": ["P2570", "P2550"]}, {"id": "P2550", "text": ["2. Submit evidence of completed training in some type of telecommunications. This may be transcript of military training, college, trade school, high school, etc."], "jumps": ["P2560", "P2540"]}, {"id": "P2540", "text": ["1. Complete the application form and submit with the required fee. This may also include a current resum"], "jumps": ["P2550", "P2530"]}, {"id": "P2530", "text": ["Mike could have started his career as a NARTE certified Class 4 Telecommunications Technician. This certification may be earned at the entry level (0-2 years experience). Certification procedures vary, but the criteria are simple..."], "jumps": ["P2540", "P2520"]}, {"id": "P2520", "text": ["There are a number of organizations chartered by the telecommunications industry and the FCC to certify personnel and equipment. Mike's new company recommended three organizations: National Association of Radio and Telecommunications Engineers (NARTE) * National Association of Communications Systems Engineers (NACSE) * Electronics Technician Association (ETA)", "National Association of Radio and Telecommunications Engineers (NARTE) * Installation * Operation & Maintenance * Administration * Educationnn", "National Association of Communications Systems Engineers (NACSE) ing * Installation * Operation & Maintenance * Administration * Educationnn", "Electronics Technician Association (ETA) s & Marketing * Engineering * Installation * Operation & Maintenance * Administration * Educationnn"], "jumps": ["P2530", "P2500"]}, {"id": "P2512", "text": ["Mike should have sought certification early in his career. The certification process automatically sets goals for education, training, and professional development. Now Mike is forced to certify..."], "jumps": ["P2520", "P2500"]}, {"id": "P2510", "text": ["Mike didn't need a certification 12 years ago when he went to work. He went to high school with the son of the general manager. Both the son and Mike got jobs when they graduated from high school. They both worked as helpers during summer vacation..."], "jumps": ["P2512", "P2500"]}, {"id": "P2500", "text": ["Mike accepts the offer with reservations. Mike has never been certified before.", "Without a certification, we will start you out as a helper. After you are certified, we will consider moving you up."], "jumps": ["P2510", "P2490"]}, {"id": "P2490", "text": ["Teresa calms Mike and prepares him for the employment offer.", "We respect your experience Mike, that's why we are interviewing you."], "jumps": ["P2500", "P2480"]}, {"id": "P2480", "text": ["Mike becomes defensive. here...............................", ".............I was a shift leader at my last company?!!?"], "jumps": ["P2490", "P2470"]}, {"id": "P2470", "text": ["Mike is a fiber optics man who was recently laid off. He is interviewing for a job with Nida Broadband. Teresa is a senior human resources interviewer. She is a telecom knowledge worker...", "I'm a fiber optics installer. I've worked on long line and local networks for over 12 years."], "jumps": ["P2480", "P2460"]}, {"id": "P2460", "text": ["Certification is the process of obtaining credentials. Credentials help professionals achieve career goals, and help make career changes easier to handle. Let's examine a case study concerning the certification process..."], "jumps": ["P2470", "P2450"]}, {"id": "P2450", "text": ["Certification (and licensing) proves that a person has demonstrated a particular skill. It adds a bullet to the resum", "too. Certification is a credential. The degree might be good for life, but the certification requires periodic review and updating...."], "jumps": ["P2460", "P2440"]}, {"id": "P2440", "text": ["It should be clear at this point that certifications are proof of competency. Competency is demonstrated by meeting the education requirements for a degree, diploma or occupational certificate too. So why are additional certifications necessary???"], "jumps": ["P2450", "P2430"]}, {"id": "P2430", "text": ["An agency certification example is a General Radiotelephone Operator License (GROL). The certification is awarded by a government agency to qualified individuals."], "jumps": ["P2440", "P2420"]}, {"id": "P2420", "text": ["Trade certifications will be covered later in depth, but a Microsoft Certified Systems Engineer (MCSE) is a good example of a trade certification. Its not a license to work in the local area, but a person must have the certification to be in the occupational field...", "Local certification is based on geo-political requirements in the local area. For example, let's assume that in order to perform a fiber optic installation in Austria, workers must have a state telecommunications license. This is a local certification requirement..."], "jumps": ["P2430", "P2410", "P2420", "P2400"]}, {"id": "P2400", "text": ["Certification has 3 distinct levels: LOCAL, TRADE, and AGENCY."], "jumps": ["P2410", "P2380"]}, {"id": "P2380", "text": ["The certification process is not the receipt of a diploma. Certification starts during the education process and ends when training is required to move up to the next higher rating. Certification standards usually require a candidate to have some amount of practical experience..."], "jumps": ["P2400", "P2370"]}, {"id": "P2370", "text": ["Recalling the sales engineer occupation, a person could have 2 degrees, one in business and the other in telecom."], "jumps": ["P2380", "P2360"]}, {"id": "P2360", "text": ["From high school graduate to PhD is all part of the education process in the career path. Perhaps education is the career path. A person may want the PhD because the goal is a teaching position at a university. Education may substitute for training, but the reverse is not necessarily valid..."], "jumps": ["P2370", "P2350"]}, {"id": "P2350", "text": ["Doctors are certified teachers. A Telecom Doctor would probably be employed by a government agency, university, or scientific research consortium. Telecom PhDs are earned in engineering, networking, or management concentrations..."], "jumps": ["P2360", "P2340"]}, {"id": "P2340", "text": ["The loftiest educational goal is the PhD (Philosophiae Doctor) in Telecommunications. A few institutions worldwide offer PhD sponsorship and support. PhD curricula is not structured the same as a post-graduate degree. A doctor is a scientist and an inventor..."], "jumps": ["P2350", "P2330", "Philosophiae"]}, {"id": "P2330", "text": ["Course Title Credit Hours Remarks", "The master's degree elective grouping is a typical selection of courses. Most colleges offer specific systems courses, such as laser, satellite, antennas, RF microcircuits, etc.", "Network Management I 9", "Internet II 9ionss", "Wireless Telecommunications I 9", "Wireless Telecommunications II 99", "Network Management II 10 Server Configuration", "Intranetworking I 10 Enterprise networks", "Ethics & Legal Issues 10 Business Operationsss", "Intranetworking II 11", "Transport Protocols 11 Lab Required", "Project Management III 11"], "jumps": ["P2340", "P2310"]}, {"id": "P2315", "text": ["important to networking and network protocols.", "STOCHASTIC PROCESS - The study of stochastic processes is higher statistics using random data sets. Statistics is important to networking and network protocols.", "Course Title Credit Hours Remarks", "Telecommunications Technology I 5 Basic operationss", "Introduction to Computers 5 Microsoft", "Introduction to Data Communications 6 333tionss", "Introduction to Voice Communications 6333333333333333333333 operationss", "Computer Operating Systems 6 Windows", "Local Area Networks I 7 Ethernet, FDDI", "C/C++ Language 7 Programming", "Switching Systems 8 PBX, CENTREX", "Local Area Networks II 8 Lab Required"], "jumps": []}, {"id": "P2310", "text": ["The Master of Science degree in telecommunications and networking is the goal for those who want to do research & development work. Engineers may return to college to earn a master's degree to upgrade their scientific skills..."], "jumps": ["P2330", "P2290"]}, {"id": "P2300", "text": ["Transport protocols studies the SONET, T carrier, and other information exchange methods. The senior project is a scientific experiment involving telecom. Next generation networks could be 3G/4G, Bluetooth, or another newly developed type."], "jumps": ["P2310", "P2290"]}, {"id": "P2290", "text": ["The senior year marks the end of the education process, unless post-graduate level education is desired. Pursuit of a higher education can start in the training phase of the career path.", "Course Title Credit Hours Remarks", "Network Management I 9", "Internet II 9ionss", "Wireless Telecommunications I 9", "Wireless Telecommunications II 99", "Network Management II 10 Server Configuration", "Intranetworking I 10 Enterprise networks", "Ethics & Legal Issues 10 Business Operationsss", "Intranetworking II 11", "Transport Protocols 11 Lab Required", "Project Management III 11"], "jumps": ["P2300", "P2280"]}, {"id": "P2280", "text": ["The junior year is networking intensive....................", "Course Title Credit Hours Remarks", "Local Area Networks II 4 Basic operations", "Telecommunications Technology II 5 Basic operationss", "Computer & Technology Integration 533333333333333333perationss", "Network Systems Administration I 53333333333333c operationss", "Network Administration II 6 Lab Requireddd", "Project Management I 6 Microsoft", "UNIX Applications 6erationss", "Wide Area Networks & Internetworking I 7", "Project Management II 7 Plan implementationnn", "Technical Presentation 7 Various visual aidsss"], "jumps": ["P2290", "P2260"]}, {"id": "P2270", "text": ["Again, notice the network courses. The sophomore gets 2 data networking courses. The future telecom engineer has to have a strong computer background."], "jumps": ["P2280", "P2260"]}, {"id": "P2260", "text": ["The computer operating systems are registered to Microsoft (Windows), Hewlett Packard (HPUX), and Sun Microsystems (Solaris). FDDI is Fiber Distributed Data Interface, a fiber optic LAN...", "Course Title Credit Hours Remarks", "Telecommunications Technology I 5 Basic operationss", "Introduction to Computers 5 Microsoft", "Introduction to Data Communications 6 333tionss", "Introduction to Voice Communications 6333333333333333333333 operationss", "Computer Operating Systems 6 Windows", "Local Area Networks I 7 Ethernet, FDDI", "C/C++ Language 7 Programming", "Switching Systems 8 PBX, CENTREX", "Local Area Networks II 8 Lab Required"], "jumps": ["P2270", "P2240"]}, {"id": "P2250", "text": ["The freshman year generally concentrates on general education requirements and prerequisite science courses. The telecom science courses usually enter into the curriculum in the sophomore year. The course lists start with the sophomore year..."], "jumps": ["P2260", "P2240"]}, {"id": "P2240", "text": ["The Bachelor of Science degree used is the example is a technology type degree. In other words, it is not highly specialized. The student spends 4 years learning the most important parts of the science..."], "jumps": ["P2250", "P2230"]}, {"id": "P2230", "text": ["The AAS is a 2-year program. As a rule, the graduate is a technician. In some instances, an AAS may be considered a junior engineer. The bachelor's degree is customarily considered the minimum engineering educational requirement.."], "jumps": ["P2240", "P2220"]}, {"id": "P2220", "text": ["The word network pops up in a few of the courses. This is expected in the telecom education process. Telecom makes communications networks possible. Remember, telecom knowledge workers have a very broad technical range..."], "jumps": ["P2230", "P2210"]}, {"id": "P2210", "text": ["Course Title Credit Hours Remarks", "The work internship is extremely important. Telecom companies in the local area would support the college by opening volunteer positions to students. Internship is on-the-job training; it is not a temporary job. However, interns may be offered jobs after graduating...", "Work Internship 3 Local Telecom Company"], "jumps": ["P2220", "P2200"]}, {"id": "P2200", "text": ["The telecom electives should be related to the entry-level target from the career path. If the person wants to work for city government, a course in voice radio or emergency services would be a good choice...", "Course Title Credit Hours Remarks", "Telecom Electives (2 courses) 6-8 Technology specific"], "jumps": ["P2210", "P2190"]}, {"id": "P2190", "text": ["Here is an example of a course list........................", "Course Title Credit Hours Remarks", "Computer Applications for Technicians 3 Basic operations", "Introduction to Electricity/Electronics 3 Basic operationss", "Digital Control Systems 3 Basic operationss", "Analog Control Systems 3 Basic operationss", "RF Data Communications 4 Lab Required", "Networks for Technicians 3 Basic operationss", "Introduction to Telecommunications 33333333333333333asic operationss", "Telephone Circuits I 33", "Transmission Circuits 4 Lab Required", "Telephone Circuits II 3ddddddddddddddddddddd"], "jumps": ["P2200", "P2180"]}, {"id": "P2180", "text": ["Let's look at the academic requirements of a typical AAS in telecommunications. The example degree syllabus is a 72-quarter hour program. The graduate will be able to certify in a number of areas. The course prerequisites are a satisfactory grade on the college entrance exams and a GED or HS diploma..."], "jumps": ["P2190", "P2170"]}, {"id": "P2174", "text": ["The career path is not a material thing that can be bought."], "jumps": []}, {"id": "P2173", "text": ["You can't recertify without already having a career path..."], "jumps": []}, {"id": "P2172", "text": ["The certification is awarded on a piece of paper, nothing else is provided."], "jumps": []}, {"id": "P2171", "text": [], "jumps": []}, {"id": "P2170", "text": ["How is a person's career path obtained?....................", "The career path is provided with the certification", "The career path is part of the recertification process", "The career path is designed by the person"], "jumps": ["P2160"]}, {"id": "P2160", "text": ["An Associate in Applied Science (AAS) is an undergraduate degree that is occupationally orientated. An Associate in Science (AS) degree is a little different in that it is designed to be the first part of a higher degree program..."], "jumps": ["P2170", "P2150"]}, {"id": "P2150", "text": ["Military schools enter into partnerships with local civilian institutions. As a result, some military schools are fully accredited and are authorized to award occupational certifications...", "The military provides excellent training opportunities and strongly promotes a college education. A large percentage of the professionals in telecom have a military background. The military approach to training is fast paced and vigorous. Military personnel are expected to use their new skills in life and death situations....."], "jumps": ["P2160", "P2140", "P2150", "P2130"]}, {"id": "P2130", "text": ["Occupational certificates may not be valid indefinitely. Some types have built-in recertification requirements. A micro-miniature soldering specialist might have to recertify annually if the person solders microwave circuits on satellites...."], "jumps": ["P2140", "P2120"]}, {"id": "P2125", "text": ["NACC- stands for National Automatic Controls Conference. The NACC published categories for wiring that are used by other standards bodies, like EIA and IEEE."], "jumps": []}, {"id": "P2120", "text": ["Examples of occupational certificates include: Fiber Optics Installer * NACC Category 5 Cable installer * Microwave Radio Installer * Cellular Telephone Installer * Surface Mount Soldering Specialist * Consumer Electronics Repairman * Telecommunications Marketing Specialist", "installer * Microwave Radio Installer * Cellular Telephone Installer * Surface Mount Soldering Specialist * Consumer Electronics Repairman * Telecommunications Marketing Specialist", "Fiber Optics Installer anagement * Sales & Marketing * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "NACC Category 5 Cable Installer * Sales & Marketing * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Microwave Radio Installer gement * Sales & Marketing * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Cellular Telephone Installer ent * Sales & Marketing * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Surface Mount Soldering Specialist * Sales & Marketing * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Consumer Electronics Repairman t * Sales & Marketing * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Telecommunications Marketing Specialist ctor) rketing * Engineering * Installation * Operation & Maintenance * Administration * Educationnn"], "jumps": ["P2130", "P2110"]}, {"id": "P2110", "text": ["Occupational certificates are earned at trade schools, colleges, and training institutions. The curriculum is highly specialized. A certificate is a certification for the lower entry-level skills."], "jumps": ["P2120", "P2100"]}, {"id": "P2100", "text": ["High school is the starting point of the education process. Adult schools and even the various prison systems offer high school level courses. Some trade-oriented high schools, like those in industrial areas, offer technical courses..."], "jumps": ["P2110", "P2090"]}, {"id": "P2090", "text": ["All of the educational institutions should be accredited, meaning valid and respected by authoritative bodies in government and the education community. Do not confuse education and training. Education is a comparatively lengthy process..."], "jumps": ["P2100", "P2080"]}, {"id": "P2080", "text": ["The education process is categorized into the following levels: High School * Occupational Certificate * Military Training * Associate in Applied Science * Bachelor of Science * Master of Science * Doctorate of Science/PhD (Philosophiae Doctor)", "High School ip * Management * Sales & Marketing * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Occupational Certificate gement * Sales & Marketing * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Military Training * Management * Sales & Marketing * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Associate in Applied Science ent * Sales & Marketing * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Bachelor of Science * Management * Sales & Marketing * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Master of Science ance nagement * Sales & Marketing * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Doctorate of Science/PhD (Philosophiae Doctor) rketing * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Education ion tenance nagement * Sales & Marketing * Engineering * Installation * Operation & Maintenance * Administration * Educationnn"], "jumps": ["P2090", "P2020", "Philosophiae"]}, {"id": "P2070", "text": ["Find a mentor to help you move up. Know someone at the next step in the process. Your network of acquaintances should include people at all levels of the career path."], "jumps": ["P2080", "P2020"]}, {"id": "P2060", "text": ["A person's career path cannot be mandated. People set and attain goals based on personal ambition. Some are content to work at the entry level indefinitely. Others change careers mid-stream. Likewise, others return to the path after retirement. The career path process is the only constant..."], "jumps": ["P2070", "P2020"]}, {"id": "P2050", "text": ["Training is the process that keeps professionals up-to-date as the technology advances. Training also opens opportunities for branching into other specialties in the industry. If a different specialty is sought through training, a recertification process is required..."], "jumps": ["P2060", "P2020"]}, {"id": "P2040", "text": ["The education starts the cycle. When education is complete, the person is ready to be initially placed in the entry level of the industry. If the person is already educated and certified, placement will be at the professional level..."], "jumps": ["P2050", "P2020"]}, {"id": "P2030", "text": ["The career path concept is not new or unknown. All professionals know what to do. It is a continuous ladder. The number of repetitions through the cycle is determined by the span of the working life..."], "jumps": ["P2040", "P2020"]}, {"id": "P2020", "text": ["The discussion starts here.................................", "Education and certification are part of a professional's career path. Both are continuous. To agree that education and certification end, is to agree that stagnation is a satisfactory career move."], "jumps": ["P2030", "P2001"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1940"]}, {"id": "P1940", "text": ["3. Engineers occupy the middle and upper levels of the telecom industry infrastructure...."], "jumps": ["P1999", "P1930"]}, {"id": "P1930", "text": ["2. Telecom organizations are setup like others in the technology sector, except the emphasis on telecom production, sales, and market growth...."], "jumps": ["P1940", "P1920"]}, {"id": "P1920", "text": ["1. A knowledge worker is a certified person who is educated and trusted in the particular professional community."], "jumps": ["P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on TELECOMMUNICATIONS PROFESSIONS."], "jumps": ["P1001", "P1590"]}, {"id": "P1590", "text": ["Telecom knowledge workers can also be found in the government services including scientists, commissioners, auditors, inspectors, and military personnel."], "jumps": ["P1910", "P1580"]}, {"id": "P1583", "text": ["The title operator is readily associated with the telephone operator and is not used in this area of telecom work."], "jumps": []}, {"id": "P1582", "text": ["Installers may also maintain and operate, but if troubleshooting and repair are required, installers may not be qualified."], "jumps": []}, {"id": "P1581", "text": [], "jumps": []}, {"id": "P1580", "text": ["Collectively, people who perform maintenance and operations on telecom systems are called _______."], "jumps": ["P1560"]}, {"id": "P1570", "text": ["Some companies specialize in telecom training. Training services include entry-level training, technology update seminars, technical assistance visits, and certification support."], "jumps": ["P1580", "P1560"]}, {"id": "P1560", "text": ["Telecom industry instructors provide hands-on product training at the production facility or other convenient location to installers, technicians, engineers, and other professionals. Seminar programs are also available..."], "jumps": ["P1570", "P1540"]}, {"id": "P1550", "text": ["College professors in science and industry studies are engineers and some have doctoral level degrees. These people convert the interested into enthusiasts, and the enthusiasts into professionals..."], "jumps": ["P1560", "P1540"]}, {"id": "P1540", "text": ["Telecom industry educators are everywhere. Teachers and guidance counselors that promote interest in telecom are a big part of the industry whether they realize it or not. The science teacher teaches how electricity is generated, the history teacher introduces students to the founders of the industry, e.g., Bell, Morse, Edison, etc....."], "jumps": ["P1550", "P1530"]}, {"id": "P1530", "text": ["Human Resources (HR) managers and workers must have a good working knowledge of the telecom occupational structure too. The HR staff of a telecom company is the same as any other company's HR staff, except they talk telecom and know how to recruit and retain telecom professionals..."], "jumps": ["P1540", "P1520"]}, {"id": "P1520", "text": ["The telecom industry has professional schedulers, expediters, clerks, account managers, and other administrative trades. These people are also members of the knowledge base and should be required to certify according to their area of expertise..."], "jumps": ["P1530", "P1510"]}, {"id": "P1510", "text": ["The maintenance side of the occupation includes certified electronics technicians (CETs), satellite service technicians, and wire network technicians."], "jumps": ["P1520", "P1500"]}, {"id": "P1500", "text": ["Telecom technicians, like installers, can achieve engineer status. The operational side of the technician profession includes central office technicians, Network Operations Center (NOC) operators, and switch operators...."], "jumps": ["P1510", "P1490"]}, {"id": "P1490", "text": ["Operation & maintenance knowledge workers fill the gap between installation and end of life cycle. These professionals keep the systems running and assist customers. Operations & maintenance people are collectively called technicians..."], "jumps": ["P1500", "P1480"]}, {"id": "P1480", "text": ["The following occupations are telecom installation specialties: ber Optics Installer - Installs fiber optic conduit and waveguide Cellular Installer - Installs cellular telephone equipment Microwave Installer- Installs microwave links Satellite Link Installer - Installs satellite systems", "Fiber Optics Installer - Installs fiber optic conduit and waveguide Cellular Installer - Installs cellular telephone equipment Microwave Installer- Installs microwave links Satellite Link Installer - Installs satellite systemssss"], "jumps": ["P1490", "P1470"]}, {"id": "P1473", "text": ["Certification is usually required for engineer status......"], "jumps": []}, {"id": "P1472", "text": ["The degree alone does not make a person a telecom engineer."], "jumps": []}, {"id": "P1471", "text": [], "jumps": []}, {"id": "P1470", "text": ["Which statement best describes a telecom engineer?.........", "Bachelor's Degree in telecom minimum requirement", "Technically experienced and educated in telecom"], "jumps": ["P1440"]}, {"id": "P1450", "text": ["Classically, installation was in the licensed electrician domain, especially when a building's internal wiring is installed. This is still true in many jobs, but installers can be certified as a separate occupational field. Some licensed electricians perform telecom installation as a secondary occupation."], "jumps": ["P1470", "P1440"]}, {"id": "P1440", "text": ["Installation is a knowledge level assignment. Installers are often required to meet the requirements of certification, especially for military contracts. Installation skills can convert into engineer status in certain specialties..."], "jumps": ["P1450", "P1410"]}, {"id": "P1430", "text": ["Installation is the largest occupational group in the telecom industry. The proverbial Cable Guy is an example of the installation occupation in telecom. Cable Dog is another common term for installation workers.s..."], "jumps": ["P1440", "P1410"]}, {"id": "P1420", "text": ["Telecom engineers may have broad academic qualifications, or highly specialized skills. For example: trical & Electronics Engineer - Both electrical and electronic background Telecommunications Engineer - Specialist in telecom Wireless Engineer - Expert in wireless equipment and protocols Embedded Software Engineer - Expert in designing highly specialized software. Customer Service Engineer - Expert in customer relations with technical backgrounddddd", "Electrical & Electronics Engineer - Both electrical and electronic background Telecommunications Engineer - Specialist in telecom Wireless Engineer - Expert in wireless equipment and protocols Embedded Software Engineer - Expert in designing highly specialized software. Customer Service Engineer - Expert in customer relations with technical backgrounddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"], "jumps": ["P1430", "P1410"]}, {"id": "P1410", "text": ["Engineer status may be achieved through other means, but the college path is the most respected. The word engineer has several meaning both as a noun and as a verb. A telecom engineer is an educated person who is an experienced knowledge worker..."], "jumps": ["P1420", "P1400"]}, {"id": "P1400", "text": ["An engineer is a highly technical individual with at least a 4 year college degree, who is qualified to design processes, real and/or virtual..."], "jumps": ["P1410", "P1390"]}, {"id": "P1390", "text": ["Doing one's homework is a good thing too, but sometimes it helps to be technical. Some engineers come out of retirement to be sales representatives. The telecom industry is always looking to fill the ranks with sales engineers. A person who can master both career paths is indeed rare..."], "jumps": ["P1400", "P1380"]}, {"id": "P1380", "text": ["If a CLEC needs to procure new and more advanced equipment, they will want to talk to the manufacturer about compatibility, delivery, purchasing agreements, and so on. A sales person may pay a visit to the CLEC to finalize a deal. The sales person had better be ready to receive a bombardment of technical questions.....", "I see that your PBX Software is IMT- 2000 compliant. How do you incorporate ISDN applications, and why does the system have 4 different pedestrain speeds?"], "jumps": ["P1390", "P1370"]}, {"id": "P1370", "text": ["Most sales engineers are professional engineers who have shifted their occupation over to sales. Telecom equipment is technically complex, especially at the consumer level."], "jumps": ["P1380", "P1360"]}, {"id": "P1360", "text": ["Sales engineering is a career field unto itself. Technical knowledge and communication skills must be combined into a single behavior. This is academically radical, but possible. A mid-life career change from sales to engineering is mostly unheard of. The other direction is more feasible..."], "jumps": ["P1370", "P1350"]}, {"id": "P1354", "text": ["Field installation has external processes and would be a poor choice to run logistics."], "jumps": []}, {"id": "P1353", "text": ["Customer service and support is closely tied to logistics, but not enough to be responsible for the processes."], "jumps": []}, {"id": "P1352", "text": ["Hardware engineering does not perform logistics in a telecom company. An industrial equipment company may."], "jumps": []}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1350", "text": ["Which of the following managers would be responsible for logistics in a small company?"], "jumps": ["P1340"]}, {"id": "P1340", "text": ["Sales & Marketing processes won't be discussed in detail, however, the telecom industry, like other technology based industries, employs SALES ENGINEERS. A sales engineer is both a business expert and a technical expert.rt..."], "jumps": ["P1350", "P1300"]}, {"id": "P1330", "text": ["Field installation is like field engineering. If the company installs equipment, this group may be a permanent part of the production department. The manager should be a telecom engineer. Some companies, like Internet Service Providers (ISPs), carry out this process as a primary business function...."], "jumps": ["P1340", "P1300"]}, {"id": "P1320", "text": ["The help desk may be anything from a customer representative with a mobile phone to a technical support center, a laboratory where customer complaints can be investigated immediately on a simulator or other support system.tem..."], "jumps": ["P1330", "P1300"]}, {"id": "P1310", "text": ["The customer support group is headed by a manager who either is a specialized customer service engineer or has a background in telecom engineering. Customer support includes help desk/technical assistance, training, RMA (Returned Material Authorization), and other processes involving customers..."], "jumps": ["P1320", "P1300"]}, {"id": "P1300", "text": ["Logistics is shipping, receiving, rigging, storage, and even security in some cases. A logistics engineer would supervise this group. In small organizations, the manufacturing manager may be in charge of logistics..."], "jumps": ["P1310", "P1290"]}, {"id": "P1295", "text": ["NORMAL WORK DAY - A Normal Work Day is defined by law. Do not assume that this period is the same in every country. In the US, this is mostly an 8-hour event. In other countries, it could be different. Working days may be as long as 24 hours."], "jumps": []}, {"id": "P1292", "text": ["If the manufacturing process involves more than just assembly (for example fabrication, assembly, and testing), subordinate managers may be employed. The process may also operate for more than a Normal Work Day; in which case, shift leaders would also be employed."], "jumps": ["P1300", "P1270"]}, {"id": "P1290", "text": ["If the manufacturing process involves more than just assembly (for example fabrication, assembly, and testing), subordinate managers may be employed. The process may also operate for more than a Normal Work Day; in which case, shift leaders would also be employed..................................................................... be employed."], "jumps": ["P1300", "P1270"]}, {"id": "P1280", "text": ["The manufacturing manager is a manufacturing engineer. The volume of responsibilities is proportional to the scope of the manufacturing process. If the company only builds a single type of hardware product, the manager may supervise the assemblers personally."], "jumps": ["P1290", "P1270"]}, {"id": "P1270", "text": ["The Director of Production leads a diverse department and the responsibilities are wide ranging. The director is undoubtedly an engineer. The technical background depends on the product line..."], "jumps": ["P1280", "P1260"]}, {"id": "P1263", "text": ["ISO compliance is not related to the titles of company employees."], "jumps": []}, {"id": "P1262", "text": ["Quite the contrary, the company is probably large.........."], "jumps": []}, {"id": "P1261", "text": [], "jumps": []}, {"id": "P1260", "text": ["The software group has a number of managers", "You are introduced to the Senior Software Manager of a local telecom company. What can you assume about the organization?"], "jumps": ["P1210"]}, {"id": "P1255", "text": ["ISO- International Organization for Standardization.me that this period is the same in every country. In the US, this is mostly an 8-hour event. In other countries, it could be different. Working days may be as long as 24 hours. as 24 hours."], "jumps": []}, {"id": "P1252", "text": ["The configuration manager position may be filled by an RF engineer. Ideally, this job should be performed by a configuration engineer, especially if the company is ISO compliant. Configuration engineers are experts in quality control, process improvement, and standardization.r of engineering..."], "jumps": ["P1210", "P1260"]}, {"id": "P1250", "text": ["The configuration manager position may be filled by an RF engineer. Ideally, this job should be performed by a configuration engineer, especially if the company is ISO compliant. Configuration engineers are experts in quality control, process improvement, and standardization..."], "jumps": ["P1260", "P1210"]}, {"id": "P1240", "text": ["The managers of the engineering groups are at least certified engineers. If the company's main product is a microwave radio network, the hardware manager is probably a certified radio frequency (RF) engineer. The software manager is likewise qualified, depending on the operating system (OS) and protocol used by the product....."], "jumps": ["P1250", "P1210"]}, {"id": "P1230", "text": ["Field engineering includes testing, certification, and installation. The hardware and software groups are usually in-house or laboratory based. Field engineering means working on the customers' premises, in the environment where the product is designed to work."], "jumps": ["P1240", "P1210"]}, {"id": "P1220", "text": ["The hardware manager has mechanical and electronic engineering responsibilities. The software manager supervises the design of the software. The configuration manager ensures quality and configuration programs are operating..."], "jumps": ["P1230", "P1210"]}, {"id": "P1210", "text": ["The department director issues direction to the managers (sometimes called senior managers if they have subordinate managers). Direction is goal setting. For example, to direct the development of an improved satellite communications system is the responsibility of the director of engineering..."], "jumps": ["P1220", "P1180"]}, {"id": "P1200", "text": ["The directors, also called department heads, occupy the management echelon. Each is an expert in their particular science or business. The size of the organization certainly determines the departmental structure. A small CLEC may not have a departmental organization."], "jumps": ["P1210", "P1180"]}, {"id": "P1190", "text": ["The CEO directs the staff and interfaces with investors and business partnerships. The COO and the CFO direct company operations on a daily basis. The vice presidents are specialists and are certainly the most senior knowledge workers (telecom engineers). Special assistants include translators, government officials, and other high level professionals....."], "jumps": ["P1200", "P1180"]}, {"id": "P1180", "text": ["The executive staff is the highest corporate level. The company's founder may be the president and/or Chief Executive Officer (CEO). Vice presidents, special assistants, and advisors also occupy this echelon. The primary assistants to the CEO are the Chief Operations Officer (COO) and Chief Financial Officer (CFO)....."], "jumps": ["P1190", "P1170"]}, {"id": "P1170", "text": ["A telecom company is usually organized along traditional lines; CEO and executive staff at the top, management in the middle, and workers at the bottom."], "jumps": ["P1180", "P1160"]}, {"id": "P1160", "text": ["The larger the organization and budget, the greater the responsibility, particularly at the CEO level. The CEO is responsible for everything the company does or fails to do. The CEO of the small company is no different from the large company in this respect..."], "jumps": ["P1170", "P1150"]}, {"id": "P1150", "text": ["All companies have the same basic organization, but if the number of personal is limited, some people may have multiple jobs. This is called wearing more than one hat."], "jumps": ["P1160", "P1140"]}, {"id": "P1140", "text": ["Telecom companies vary in size depending on the product and service. A manufacturer or common carrier (traditional telephone company) may be very large, but a Competitive Local Exchange Carrier (CLEC) or Internet Service Provider (ISP) may be small..."], "jumps": ["P1150", "P1130"]}, {"id": "P1133", "text": ["Training alone does not qualify a person as a knowledge worker."], "jumps": []}, {"id": "P1132", "text": ["Knowledge can be obtained by people with varying degrees of intelligence."], "jumps": []}, {"id": "P1131", "text": [], "jumps": []}, {"id": "P1130", "text": ["Define knowledge worker. is typed.........................."], "jumps": ["P1120"]}, {"id": "P1120", "text": ["Entrepreneurs open doors; careerists (professionals who stay in the industry) hold the doors open."], "jumps": ["P1130", "P1110"]}, {"id": "P1110", "text": ["The entrepreneur usually holds a senior position in the new company. The title of the position is President and/or Chief Executive Officer."], "jumps": ["P1120", "P1100"]}, {"id": "P1100", "text": ["Entrepreneurs startup companies for different reasons: The product of interest is marketable * To accumulate personal wealth * Desire to be their own boss * Fulfill a societal need (like creating jobs)", "The product of interest is marketable les & Marketing * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "To accumulate personal wealth t * Sales & Marketing * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Desire to be their own boss ment * Sales & Marketing * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Fullfill a societal need (like creating jobs) arketing * Engineering * Installation * Operation & Maintenance * Administration * Educationnn"], "jumps": ["P1110", "P1090"]}, {"id": "P1090", "text": ["The entrepreneur is the first profession on the list. An entrepreneur is a person who starts a new business, either with a personal investment or by attracting investors."], "jumps": ["P1100", "P1080"]}, {"id": "P1080", "text": ["Telecom careers may be listed in several categories: trepreneurship * Management * Sales & Marketing * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "ering * Installation * Operation & Maintenance * Administration * Educationnn", "Entrepreneurship * Management * Sales & Marketing * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Management hip * Management * Sales & Marketing * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Sales & Marketing * Management * Sales & Marketing * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Engineering ting * Management * Sales & Marketing * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Installation ing * Management * Sales & Marketing * Engi let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
