% is equal to the decimal fraction .102."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["150% is equal to the decimal fraction 1.5 or one and a half."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["To change a percent to a common fraction, drop the percent sign, the number (35) becomes the numerator and 100 is the denominator."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["In this example, the fraction is reduced showing that 150% equals 1 and a half."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["When a percent contains a decimal fraction, you must change the decimal position and increase the denominator."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["When a percent has a decimal, the percent is changed to a decimal fraction and then to a common fraction."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["Change 4% to a decimal fraction.", "Change 4% to a decimal fraction.d.........................."], "jumps": ["P1140"]}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1162", "text": ["The decimal fraction 4.0 is not obtained for 4%.  Drop the percent sign and move the decimal point two places to the left.", "The decimal fraction 4.0 is not obtained for 4%. Drop the percent sign and move the decimal point two places to the left."], "jumps": []}, {"id": "P1163", "text": ["The decimal fraction .40 is not obtained from 4%.  Drop the percent sign and now the decimal two places to the left.", "The decimal fraction .40 is not obtained from 4%. Drop the percent sign and now the decimal two places to the left."], "jumps": []}, {"id": "P1170", "text": ["Change 5% to a common fraction.", "Change 5% to a common fraction.ed.........................."], "jumps": ["P1160"]}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1172", "text": ["Remember, first change the percent to a decimal fraction then to a common fraction."], "jumps": []}, {"id": "P1180", "text": ["Change 12.05% to a decimal fraction.", "Chan o the Objective Menu..."], "jumps": ["P1001", "P1980"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2010", "text": ["The use of percent in math problems involves three parts.", "The use of percent in math problems involves three parts. SE RATE PART"], "jumps": ["P2020", "P2001"]}, {"id": "P2020", "text": ["The Base is designated B and is the initial amount."], "jumps": ["P2030", "P2010"]}, {"id": "P2030", "text": ["The Rate is designated R and is the percent of the base.", "BASE - B RATE - R PART PARTTTPART"], "jumps": ["P2040", "P2010"]}, {"id": "P2050", "text": ["When dealing with percents, what does the letter \"R'' stand for?"], "jumps": ["P2010"]}, {"id": "P2051", "text": [], "jumps": []}, {"id": "P2052", "text": ["The Base is designated by the letter \"B''.", "The Base is designated by the letter \"B''.................."], "jumps": []}, {"id": "P2053", "text": ["The Part is designated by the letter \"P''.", "The Part is designated by the letter \"P''.................."], "jumps": []}, {"id": "P2060", "text": ["The three elements are put into formulas to solve for:", "The three elements are put into formulas to solve for:....."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["Let's start with solving for the PART."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["The Part is a portion of the base and is expressed as:", "The Part is a portion of the base and is expressed as:....."], "jumps": ["P2090", "P2060"]}, {"id": "P2090", "text": ["For example, what is 10% of 30?", "For example, what is 10% of 30?............................"], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["Substituting the values in the formula gives:", "30 - BASE 10% - RATE 30 x 10% = P"], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["To solve the formula you must change 10% to a decimal.", "Percent to Decimal 1. First drop the % Sign 2. Move decimal 2 places left. 10 % = .10 ."], "jumps": ["P2120", "P2090"]}, {"id": "P2120", "text": ["Now mul let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
