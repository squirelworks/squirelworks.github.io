<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Understand the various statistical diagrams. w Understand the statistical histogram.", "w Understand the role of statistics in industry. w Understand the concepts of mean, median, mode, standard deviation, percentiles, and quartiles. w Understand the analysis of statistical data."], "jumps": []}, {"id": "P400", "text": ["While you may not realize it, statistics are an important part of every day life. Whether reading the newspaper or watching the news, you have seen statistical analysis."], "jumps": ["P410", "P100", "Py"]}, {"id": "P410", "text": ["Statistics are a method used to analyze data. While data can come from many different sources, methods developed to analyze the data are more limited and structured."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["In this lesson, you are going to learn how to analyze data using many useful statistical methods. These methods are the foundation of statistical analysis."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["Let's begin the lesson on INTRODUCTION TO STATISTICS.INITY................"], "jumps": ["P410"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1040", "text": ["Statistics is the study of data. Data can come from many sources and in many different forms. The statistics explained in this lesson will deal with numerical data sets."], "jumps": ["P1050", "P1001"]}, {"id": "P1050", "text": ["The first step in understanding statistics is to understand the terminology used to describe the data you will be using. Each specific value of data is known as a Data Point."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["Data points can be obtained from many different sources. When you are performing statistical analysis you must choose data points which are of the same data."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["In other words, if you are measuring temperatures, all data points are temperature values. You would not compare say temperature and speed. Statistics looks at the difference or lack of differences in a single data type.", "In other words, if you are measuring temperatures, all data points are temperature values. You would not compare say temperature and speed. Statistics looks at the difference or lack of differences in a single data type..."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["In many situations you may have thousands or millions of data points. For example, a machine might record a motor position every second. In just a few hours you would obtain many data points."], "jumps": ["P1090", "P1040"]}, {"id": "P1090", "text": ["The accumulation of all obtainable data points is known as a Population. In most cases, this is a very large number. In statistics we use a subset of the population, and we call this a Sample."], "jumps": ["P1100", "P1040"]}, {"id": "P1100", "text": ["A sample is nothing more than a good sized subset of the population, big enough to observe the trend of the population. In many cases, you may not know what size of a sample you need."], "jumps": ["P1110", "P1040"]}, {"id": "P1110", "text": ["Through practice and knowledge of the population, you will be able to determine, in many cases, how many samples you need. Below is a sample set of data we will be working with.", "Data Points of Sample 19 12 14 16 12 10 11 17 11 12 13 6", "Oranges obtained from various orange trees, each data point represents 1 tree."], "jumps": ["P1120", "P1040"]}, {"id": "P1120", "text": ["The data represents the number of oranges obtained from a given number of orange trees. The population of orange trees would be all the ones that have existed until this point in time."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["Our sample is from one field. We have selected 12 random trees. The numbers indicate the number of oranges that were growing on the trees. Just looking at these numbers doesn't really tell us   anything about the sample trend.", "Our sample is from one field. We have selected 12 random trees. The numbers indicate the number of oranges that were growing on the trees. Just looking at these numbers doesn't really tell us anything about the sample trend."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["We need some basic tools that will allow us to understand more about the data points of the sample. The tools we will use are the sample mean, median, mode, and variation. These describe the     characteristics of the sample.", "We need some basic tools that will allow us to understand more about the data points of the sample. The tools we will use are the sample mean, median, mode, and variation. These describe the characteristics of the sample."], "jumps": ["P1150", "P1110"]}, {"id": "P1150", "text": ["The sample mean is the average of all the sample data points. The sample mean indicates the central tendency that all other values will be centered around. The equation below illustrates the method for determining the sample mean.", "X = Q Xi = X1 + X2 + . . . . + Xn = Sample n n r Meannn n n n"], "jumps": ["P1160", "P1110"]}, {"id": "P1160", "text": ["Let's make some observations on the equation notations shown below. Each data point is referred to as x#, where # indicates which data point of the sample. The 'n' is the size of the sample set, or total number of data points.", "X = 19+12+14+16+12+10+11+17+11+12+13+6 122 r Meannnnnn n n n"], "jumps": ["P1170", "P1110"]}, {"id": "P1170", "text": ["X is the symbol used to indicate the sample mean. The equation states to add all the data point values together and then divide by the total number of data points. This gives you the sample mean."], "jumps": ["P1180", "P1110"]}, {"id": "P1180", "text": ["The second form of the equation uses a mathematical operation known as the summation. The Q symbol indicates summation. The summation says sum all values to the right from i going from 1 to n."], "jumps": ["P1190", "P1110"]}, {"id": "P1190", "text": ["This says add X  through X  since the i is in the X . Then, you divide by n to get the sample mean. The concept of the summation is important for you to understand, especially when dealing with variation.", "This says add X through X since the i is in the X . Then, you divide by n to get the sample mean. The concept of the summation is important for you to understand, especially when dealing with variation."], "jumps": ["P1200", "P1110"]}, {"id": "P1200", "text": ["What is the sample mean of the following sample from a population of  temperature readings?", "What is the sample mean of the following sample from a population of temperature readings?"], "jumps": ["P1110"]}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1202", "text": ["The answer you selected was incorrect, check your math and the formula below. If you still get the incorrect answer, see your instructor for help.", "X = Q Xi = X1 + X2 + . . . . + Xn = Sample n n r Meannn n n n"], "jumps": []}, {"id": "P1210", "text": ["The next important tool is the median. The median is the middle value in the sample set. It is important to realize that this is NOT the same as the mean. In determining the median, the sample set has to be in increasing value order.", "Data Points of Sample 19 12 14 16 12 10 11 17 11 12 13 6", "Oranges obtained from various orange trees, each data point represents 1 tree."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["If there are an odd number of data points, then data point (n+1)/2 is the median. If there is an even number of data points, the median is the average of the n/2 and (n+1)/2 data points. The example below illustrates this procedure.", "6, 10, 11, 11, 12, 12, 12, 13, 14, 16, 17, 19 6666666666666 11 12 13 6", "X([n+1]/2) n odd X(n/2) + X(n/2) + 1 n evennnnnnn = Median X(n/2) + X(n/2) + 1 n even=", "X = = Mediann"], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["X is used to indicate a value is the median. In the example below you can see that the median and mode are not the same values. It is possible in some cases they may calculate to be the same, however, they represent two different characteristics of the data."], "jumps": ["P1240", "P1210"]}, {"id": "P1240", "text": ["It is important to realize what makes the mean and median different. In a mean, a number which is very far off compared to the other values in a sample will effect the calculated value."], "jumps": ["P1250", "P1210"]}, {"id": "P1250", "text": ["It is always possible to have bad data points in a sample. If your values were 1, 2, 3 and 700, you can see that the 700 seems to be incorrect. The mean would be 176.5, which clearly doesn't describe the data that well."], "jumps": ["P1260", "P1210"]}, {"id": "P1260", "text": ["The median would be 2.5 which does describe the middle value much better than the mean. By comparing the mean to the median, you can determine whether some of your data points could be incorrect."], "jumps": ["P1270", "P1210"]}, {"id": "P1270", "text": ["In other cases, these extreme variations could be correct and the median will better describe the central tendency of the values better. In other words, the median just allows you to observe the sample data tendencies in a different method."], "jumps": ["P1280", "P1210"]}, {"id": "P1280", "text": ["What is the median of the values shown below?", "What is the median of the values shown below?..............", "10 300 4 16 33 12 F F F"], "jumps": ["P1210"]}, {"id": "P1281", "text": [], "jumps": []}, {"id": "P1282", "text": ["The answer you selected was incorrect, check your math and the formula below. If you still get the incorrect answer, see your instructor for help.", "6, 10, 11, 11, 12, 12, 12, 13, 14, 16, 17, 19 6666666666666 11 12 13 6", "X([n+1]/2) n odd X(n/2) + X(n/2) + 1 n evennnnnnn = Median X(n/2) + X(n/2) + 1 n even7", "X = = Mediann"], "jumps": []}, {"id": "P1290", "text": ["The mode is the data points which occur most in the sample. This just indicates the most common values obtained from the population. If more than one value has the same number of most data points, then they are also part of the mode.", "Data Points of Sample 19 12 14 16 12 10 11 17 11 12 13 6", "Oranges obtained from various orange trees, each data point represents 1 tree."], "jumps": ["P1295", "P1280"]}, {"id": "P1295", "text": ["No mode is when no one number occurs more frequently than any other number. If you get three or more modes then there is no mode in the sample."], "jumps": ["P1300", "P1290"]}, {"id": "P1300", "text": ["Having two modes is known as being bimodal. If you get more than one mode, in most cases, it is good to obtain more samples to make sure the observation is correct.", "6 - 1 12 - 3 16 - 1 10 - 1 13 - 1 17 - 1 11 - 2 14 - 1 19 - 1"], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["The mode is good because it shows you which value you are most likely to get. Although using the mathematical methods of probability would be more accurate. In most cases, the mode is sufficient in showing the most common value from a sample or population."], "jumps": ["P1320", "P1290"]}, {"id": "P1320", "text": ["What is the mode of the sample shown below?", "What is the mode of the sample shown below?................", "1 8 2 8 3 1 8 5 6 2 3 4 5 2 4 5 7 9 5 8 4 8 3 4 7 6"], "jumps": ["P1290"]}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1322", "text": ["Remember, the mode is the value or values which occur most in the sample."], "jumps": []}, {"id": "P1330", "text": ["Before discussing variability, we need to look at one other method of data observation which is related to the median method, known as Quartiles and Percentiles.", "Data Points of Sample 19 12 14 16 12 10 11 17 11 12 13 6", "Oranges obtained from various orange trees, each data point represents 1 tree."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["Instead of just looking at the middle value only, which is the median, you can look at the quarter value. These are at 1/4, 1/2, and 3/4. You order the samples and determine their values in the same way as the median, except at the quarters.", "1/4 1/2 3/4 6, 10, 11, 11, 12, 12, 12, 13, 14, 16, 17, 19"], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["Quartiles are referred to using q1, q2 and q3. The equations below show how to obtain the quartiles from different sized samples. The quartiles will be important in the box plot which will be described in the second objective of this lesson.", "11 12 15 q1 mode q3 q2555 16, 17, 199"], "jumps": ["P1360", "P1330"]}, {"id": "P1360", "text": ["The percentile value is slightly different than the median. A data point will have a percentile value which indicates the percentage of  values at or below that number in the sample set.", "The percentile value is slightly different than the median. A data point will have a percentile value which indicates the percentage of values at or below that number in the sample set.", "MATHEMATICS PRE-ALG/ELEM ALG/COORD GEO PLANE GEO/TRIG", "READING SOC STUD/SCI ARTS/LIT EO PLANE GEO/TRIG", "SCIENCE REASON C STUD/SCI ARTS/LIT EO PLANE GEO/TRIG", "COMPOSITE (AVG) STUD/SCI ARTS/LIT EO PLANE GEO/TRIG", "RANK = % COLLEGE-BOUND STUDENTS AT/BELOW YOUR SCORES", "23 12 12 12"], "jumps": []}, {"id": "P1370", "text": ["The percentile system is used in many schools in ranking student grades compared to other schools on a standard test. The example below illustrates the percentile method of data analysis."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["You are not responsible for knowing how to calculate a percentile, however, it is important for you to understand what a percentile value indicates."], "jumps": ["P1390", "P1360"]}, {"id": "P1390", "text": ["The next topic of statistical methods is the measure of variation of a sample set. There are many different methods for looking at   variation, in this lesson we will look at sample range, sample          variance, sample standard deviation and the sample coefficient of variation.", "The next topic of statistical methods is the measure of variation of a sample set. There are many different methods for looking at variation, in this lesson we will look at sample range, sample variance, sample standard deviation and the sample coefficient of variation.", "Data Points of Sample 19 12 14 16 12 10 11 17 11 12 13 6", "Oranges obtained from various orange trees, each data point represents 1 tree."], "jumps": ["P1400", "P1360"]}, {"id": "P1400", "text": ["The sample range is the maximum data point value minus the minimum data point value. As the name implies, it gives you the range of  which the samples occupy, also referred to as the delta of the sample.", "The sample range is the maximum data point value minus the minimum data point value. As the name implies, it gives you the range of which the samples occupy, also referred to as the delta of the sample.", "r = Xmax - Xmin = Sample Range r = 19 - 6 = 13"], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["What is the range of the sample shown below?", "What is the range of the sample shown below?...............", "100 20 1 39 32 49 F F"], "jumps": ["P1390"]}, {"id": "P1411", "text": [], "jumps": []}, {"id": "P1412", "text": ["The answer you selected was incorrect, check your math and the formula below. If you still get the incorrect answer, see your    instructor for help.", "The answer you selected was incorrect, check your math and the formula below. If you still get the incorrect answer, see your instructor for help...................", "r = Xmax - Xmin = Sample Range r = 19 - 6 = 13"], "jumps": []}, {"id": "P1420", "text": ["The sample variance and sample standard deviation are closely   related. They both indicate how the data point values vary from     each other. Below are the equations for both methods. Notice that the sample standard deviation is the square root of the variance.", "The sample variance and sample standard deviation are closely related. They both indicate how the data point values vary from each other. Below are the equations for both methods. Notice that the sample standard deviation is the square root of the variance.", "Data Points of Sample 19 12 14 16 12 10 11 17 11 12 13 6", "Oranges obtained from various orange trees, each data point represents 1 tree.", "X = 12.75 + . . . . + Xn = Sample n n r Meannn n n n", "(19 - 12.75)2 + (12 - 12.75)2 + . . . + (6 - 12.75)2 11 r r r Meannn n n n", "Q (Xi - X)2 n - 1 Xn = Sample n - 111111 n r r r Meannn n n n"], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["These two methods of measuring variance are used to show how much the data points are spread out in value. Small values indicate close values and large numbers indicate spread out values."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["It is very important to note that the sample standard deviation       value is dependent on the magnitude of the measured values. The sample standard deviation is normally the method of choice in the observation of variation.", "It is very important to note that the sample standard deviation value is dependent on the magnitude of the measured values. The sample standard deviation is normally the method of choice in the observation of variation."], "jumps": ["P1450", "P1420"]}, {"id": "P1450", "text": ["The last tool we need is a method for standardizing sample standard deviation values for comparison. Suppose we used a scale to weight ten bowling balls and ten tennis balls."], "jumps": ["P1460", "P1420"]}, {"id": "P1460", "text": ["Obviously, from the calculations below, you can see that you really only see a measure of deviation of each item measured, the bowling balls and the tennis balls. We want to compare the accuracy of measuring the items to each other.", "Obviously, from the calculations below, you can see that you really only see a measure of deviation o ur    instructor for help.", "The answer you selected was incorrect, check your math and the formula below. If you still get the incorrect answer, see your instructor for help...................", "Q (Xi - X)2 n - 11+ Xn = Sample n - 111111 n r r r Meannn n n n"], "jumps": []}, {"id": "P1500", "text": ["The tools you have learned in this lesson will allow you to observe the trends of sample data from a population."], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["By understanding these calculated values, you can make judgments about processes, experiments, or anything that supplies data.  Statistics saves time and money which are both beneficial to industry and yourself.", "By understanding these calculated values, you can make judgments about processes, experiments, or anything that supplies data. Statistics saves time and money which are both beneficial to industry and yourself."], "jumps": ["P1520", "P1500"]}, {"id": "P1520", "text": ["In the next objective you will look at some graphical methods for  dealing with sample data. These methods will use some of the       calculated information shown in this objective in giving you a        visual description of the data.", "In the next objective you will look at some graphical methods for dealing with sample data. These methods will use some of the calculated information shown in this objective in giving you a visual description of the data."], "jumps": ["P1910", "P1500"]}, {"id": "P1910", "text": ["This completes the information on BASIC STATISTICS.", "This completes the information on BASIC STATISTICS........."], "jumps": []}, {"id": "P1920", "text": ["1.  Each specific value of data is known as a Data Point. All of the      possible data points that could be obtained is known as a               Population. In statistics we use a subset of the population,             and we call this a Sample.", "1. Each specific value of data is known as a Data Point. All of the possible data points that could be obtained is known as a Population. In statistics we use a subset of the population, and we call this a Sample.", "Data Points of Sample 19 12 14 16 12 10 11 17 11 12 13 6", "Oranges obtained from various orange trees, each data point represents 1 tree."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  The sample mean is the average of all the sample data points.       The sample mean indicates the central tendency that all other        values will be centered around.", "2. The sample mean is the average of all the sample data points. The sample mean indicates the central tendency that all other values will be centered around.", "X = Q Xi = X1 + X2 + . . . . + Xn = Sample n n r Meannn n n n"], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The median is the middle value in the sample set. This value          can be used to more accurately determine the central                       tendency when extreme values are involved.", "3. The median is the middle value in the sample set. This value can be used to more accurately determine the central tendency when extreme values are involved.", "6, 10, 11, 11, 12, 12, 12, 13, 14, 16, 17, 19 6666666666666 11 12 13 6", "X([n+1]/2) n odd X(n/2) + X(n/2) + 1 n evennnnnnn = Median X(n/2) + X(n/2) + 1 n even", "X = = Mediann"], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["4.  The mode is the data points which occur most in the sample.", "4. The mode is the data points which occur most in the sample.", "6 - 1 12 - 3 16 - 1 10 - 1 13 - 1 17 - 1 11 - 2 14 - 1 19 - 1"], "jumps": ["P1960", "P1920"]}, {"id": "P1960", "text": ["5.  Quartiles are the values at 1/4, 1/2, and 3/4 of your ordered              data points. Quartiles are referred to using q1, q2 and q3.", "5. Quartiles are the values at 1/4, 1/2, and 3/4 of your ordered data points. Quartiles are referred to using q1, q2 and q3.", "1/4 1/2 3/4 6, 10, 11, 11, 12, 12, 12, 13, 14, 16, 17, 19", "11 12 15 q1 mode q3 q2555 16, 17, 199"], "jumps": ["P1970", "P1920"]}, {"id": "P1970", "text": ["6.  The sample range is just the maximum data point value minus       the minimum data point value.", "6. The sample range is just the maximum data point value minus the minimum data point value.", "r = Xmax - Xmin = Sample Range r = 19 - 6 = 13"], "jumps": ["P1980", "P1920"]}, {"id": "P1980", "text": ["7.  The sample variance and sample standard deviation are                  closely related. They both indicate how the data point values         vary from each other.", "7. The sample variance and sample standard deviation are closely related. They both indicate how the data point values vary from each other...............", "Data Points of Sample 19 12 14 16 12 10 11 17 11 12 13 6", "Oranges obtained from various orange trees, each data point represents 1 tree.", "X = 12.75 + . . . . + Xn = Sample n n r Meannn n n n", "(19 - 12.75)2 + (12 - 12.75)2 + . . . + (6 - 12.75)2 11 r r r Meannn n n n", "Q (Xi + X)2 n - 1+ Xn = Sample n - 111111 n r r r Meannn n n n"], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary.  You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2040", "text": ["In many cases, numerical answers are not enough to draw conclusions about a sample. When this situation occurs, statistical graphics help to visually show you the characteristics of your data.", "15 19 32 8 20 12.75 14"], "jumps": ["P2050", "P2001"]}, {"id": "P2050", "text": ["There are many different types of graphical statistic tools. In this   lesson we will concentrate on the most commonly used types. These types include: the Dot Diagram, the Stem-and-Leaf Diagram, the Histogram and the Box Plot.", "There are many different types of graphical statistic tools. In this lesson we will concentrate on the most commonly used types. These types include: the Dot Diagram, the Stem-and-Leaf Diagram, the Histogram and the Box Plot.............................", "Dot Diagram Stem-and-Leaf Diagram Histogram Box Plot"], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["At the end of this discussion, we will look at the use of all these     statistical tools together. By understanding the use of the tools,    you can appreciate the information they provide.", "At the end of this discussion, we will look at the use of all these statistical tools together. By understanding the use of the tools, you can appreciate the information they provide."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["The most basic form of statistical graph is the Dot Diagram. The    graph shown below is an example of the Dot Diagram for the given sample data.", "The most basic form of statistical graph is the Dot Diagram. The graph shown below is an example of the Dot Diagram for the given sample data."], "jumps": ["P2080", "P2050"]}, {"id": "P2080", "text": ["Each of the points on the diagram represents one of the data points of the sample. The horizontal line is equally divided to include all possible values of the sample data."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["From looking at this graph you can see how the sample data spreads throughout all possible values. This allows you to see if there are certain values that the sample tends to be at."], "jumps": ["P2100", "P2070"]}, {"id": "P2100", "text": ["Notice in the example below how most of the samples are centered around two points. This indicates that both values are prominent within the sample. A mean, median or mode calculation would not show you this trend."], "jumps": ["P2110", "P2070"]}, {"id": "P2110", "text": ["It is also important to note that a Dot Diagram is like an X-Y plot     when looking at it from the side. It is much easier to see data          correlation when they are aligned in this manner.", "It is also important to note that a Dot Diagram is like an X-Y plot when looking at it from the side. It is much easier to see data correlation when they are aligned in this manner."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["Another important use of the Dot Diagram is to look at two samples from two separate populations. Let's say you were creating small metal boxes cut from aluminum. Let's also say that the mill used to cut out the boxes has two different types of cutting bits."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["You make a sample of data points using both types of bits and plot them on a Dot Diagram. From the results you can see if the bits do a comparable job, or if one is better than the other."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["Dot Diagrams can reveal many characteristics of your data. The next graphical statistic tool we are going to look at is the                 Stem-and-Leaf Diagram. The stem-and-leaf diagram is used to       represent the frequency of data point occurrences.", "Dot Diagrams can reveal many characteristics of your data. The next graphical statistic tool we are going to look at is the Stem-and-Leaf Diagram. The stem-and-leaf diagram is used to represent the frequency of data point occurrences."], "jumps": ["P2150", "P2120"]}, {"id": "P2150", "text": ["The first thing you do is separate your data into around 7 groups.  Each of these groups will have something in common and all groups will have an equal number of possible values that could be within the group.", "The first thing you do is separate your data into around 7 groups. Each of these groups will have something in common and all groups will have an equal number of possible values that could be within the group."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["The three stem-and-leaf diagrams below show three possible ways in which data can be separated. It is important to note that there are many ways in which you can divide the data.", "Stem 2 3 4 5 6 7 888885,80,63,75,80", "Leaf 1 2,4,6 1,5,1,3 6,6,1,0 2,3 5 0 8 88863,75,80", "Stem 5U 5L 6U 6L 7U 7L888885,80,63,75,80", "Leaf 5,7 1,2,3 9,8,8 1,2 6,7 10005 0 08 88863,75,80", "Stem 1Z 1T 1F 1S 1E 2Z 2T 2F 2S 2E75,80", "Leaf 0 3 4,5 6 1 2 4,5 7 8005 0 08 88863,75,80"], "jumps": ["P2180", "P2140"]}, {"id": "P2180", "text": ["In the first example, each of the stems represents the tens column of the data. The leaves in the 3rd stem are 2, 4 and 6, which correspond to 32, 34 and 36. Each of the other stems work similarly."], "jumps": ["P2190", "P2160"]}, {"id": "P2190", "text": ["In the second example, the letter after the stem number represents either the lower or upper sets of numbers within that entire set of values. For example, 5L would contain 50, 51, 52, 53, 54 and 5U would contain 55, 56, 57, 58 and 59."], "jumps": ["P2200", "P2160"]}, {"id": "P2200", "text": ["If we didn't created these smaller stems, the number of stems would only be 3. This isn't enough to really see the number of leaves in each stem. The target number of stems is around 7, too many or too few will not accurately tell you much about the data."], "jumps": ["P2210", "P2160"]}, {"id": "P2210", "text": ["The third example is set up so that 1z can have 10 and 11, 1t can  have 12, 13 and so on. From the stem-and-leaf diagram you can see that the stem sizes are too small because the diagram is too large.  In this diagram you cannot see any real central tendency.", "The third example is set up so that 1z can have 10 and 11, 1t can have 12, 13 and so on. From the stem-and-leaf diagram you can see that the stem sizes are too small because the diagram is too large. In this diagram you cannot see any real central tendency."], "jumps": ["P2220", "P2160"]}, {"id": "P2220", "text": ["Again, the stem-and-leaf diagram is used to organize your sample into groups known as stems. Each stem has leaves which represent the data points in that particular stem from the sample."], "jumps": ["P2230", "P2160"]}, {"id": "P2230", "text": ["The stem-and-leaf diagram is the starting point for creating the      Histogram. The histogram is a bar graph representation of the       stem-and-leaf diagram.", "The stem-and-leaf diagram is the starting point for creating the Histogram. The histogram is a bar graph representation of the stem-and-leaf diagram.", "STEM 2 3 4 5 6 7 80,63,75,80", "LEAF 1 2,4,6 1,5,1,3 6,6,1,0 2,3 5 0 8 88863,75,80", "TALLY I III IIII IIII II I I2,3 5 0 8 88863,75,80"], "jumps": ["P2240", "P2160"]}, {"id": "P2240", "text": ["The first step in creating a histogram is to generate the stem-and-leaf plot, like the one shown below. Once you have created this, tally the number of leaves in each stem. This value is known as the frequency."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["Next, draw a graph with the stem ranges on the x-axis (horizontal) and the frequency values on the y-axis (vertical). Now we are ready to add in the bars of the histogram."], "jumps": ["P2260", "P2230"]}, {"id": "P2260", "text": ["Each bar is drawn from the start and to the end of each stem      interval. For example, the first interval, 2 is greater or equal to         20 and less than 30. The vertical height of the bar is that of the       tallied frequency.", "Each bar is drawn from the start and to the end of each stem interval. For example, the first interval, 2 is greater or equal to 20 and less than 30. The vertical height of the bar is that of the tallied frequency."], "jumps": ["P2270", "P2230"]}, {"id": "P2270", "text": ["You continue through each item in the stem until all of the stems  have been represented on the histogram. If you feel the graph may not be descriptive enough, you can go back and change your stem intervals, re-tally, and redraw your histogram.", "You continue through each item in the stem until all of the stems have been represented on the histogram. If you feel the graph may not be descriptive enough, you can go back and change your stem intervals, re-tally, and redraw your histogram."], "jumps": ["P2280", "P2230"]}, {"id": "P2280", "text": ["Histograms can show you the frequency distribution of your sample in a nice bar graph manner. The information is the same as the stem-and-leaf, but the presentation of the data is easier to   interpret.", "Histograms can show you the frequency distribution of your sample in a nice bar graph manner. The information is the same as the stem-and-leaf, but the presentation of the data is easier to interpret."], "jumps": ["P2290", "P2230"]}, {"id": "P2290", "text": ["Below are examples of common histogram trends. Skew indicates that the data values are more or less pushed to one side or the other. This could indicate good or bad trends in your sample."], "jumps": ["P2300", "P2230"]}, {"id": "P2300", "text": ["The last type of plot we are going to look at is the Box Plot, also    known as the box-and-whisker plot. First we will generate the plot, and then we will look at what the plot illustrates.", "The last type of plot we are going to look at is the Box Plot, also known as the box-and-whisker plot. First we will generate the plot, and then we will look at what the plot illustrates."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["The first step is to draw a horizontal axis with equal divisions       containing the minimum and maximum data points of the sample. The vertical axis will not be used for any significant information.", "The first step is to draw a horizontal axis with equal divisions containing the minimum and maximum data points of the sample. The vertical axis will not be used for any significant information.", "10, 8, 10, 15, 2, 4, 6, 8 or 2, 4, 6, 8, 10, 10, 15"], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["Next, determine the quartiles of the sample, remembering that the second quartile is also the median. Draw a small vertical line on the graph for each of these value."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["Connect the lines to form two connected boxes. These boxes each contain 25% of the samples, or together 50% of the sample data points."], "jumps": ["P2340", "P2310"]}, {"id": "P2340", "text": ["Finally, draw a line from each box out to the extreme maximum and extreme minimum of the values. These are known as the whiskers. Each whisker also contains 25% of the sample data."], "jumps": ["P2350", "P2310"]}, {"id": "P2350", "text": ["The box plot is very useful in assessing variability. From the plot  below you can see how much the data varies, and how much each quartile spreads. This is very useful when comparing multiple sample sets.", "The box plot is very useful in assessing variability. From the plot below you can see how much the data varies, and how much each quartile spreads. This is very useful when comparing multiple sample sets."], "jumps": ["P2360", "P2310"]}, {"id": "PINFO", "text": ["Which of the following Dot Diagrams is correct?", "07-29-99 Converted to new question format. jay 08-04-99 Conversion cleanup steps 1 thru 9 - lisa 08-06-99 Conversion cleanup steps 10 thru 17 - lisa 10-20-99 Changed viewer caption to: Introduction To Statistics. Penny 02-29-00 P1420, changed plus sign to a minus sign in top equations, removed the square from S = of the top right equation. P1230, changed X mean to X median in discussion text box. 04-26-00 Executed clear response. Penny 07-14-00 Converted to ToolBook 7.1 format. jay 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 01-31-02 Reviewed and repaired text, graphics, and scripting. Jeff 1", "07-29-99 Converted to new question format. jay 08-04-99 Conversion cleanup steps 1 thru 9 - lisa 08-06-99 Conversion cleanup steps 10 thru 17 - lisa 10-20-99 Changed viewer caption to: Introduction To Statistics. Penny 02-29-00 P1420, changed plus sign to a minus sign in top equations, removed the square from S = of the top right equation. P1230, changed X mean to X median in discussion text box. 04-26-00 Executed clear response. Penn erns, there    are different tools used to analyze these patterns. As you progress further in learning, other statistical methods may become a necessity for you.", "Since data comes in all forms, sizes, ranges and patterns, there are different tools used to analyze these patterns. As you progress further in learning, other statistical methods may become a necessity for you."], "jumps": ["P2400", "P2370"]}, {"id": "P2400", "text": ["These tools can be used in every day life, just like a teacher            assigning your grade based on the mean of your scores. In any case, the methods described in this lesson give you the foundation from which statistical is data built.", "These tools can be used in every day life, just like a teacher assigning your grade based on the mean of your scores. In any case, the methods described in this lesson give you the foundation from which statistical is data built."], "jumps": ["P2910", "P2370"]}, {"id": "P2910", "text": ["This completes the information on STATISTICAL GRAPHICS.", "This completes the information on STATISTICAL GRAPHICS....."], "jumps": []}, {"id": "P2920", "text": ["1.  The Dot Diagram is used to see how the sample data spreads       throughout all possible values.", "1. The Dot Diagram is used to see how the sample data spreads throughout all possible values."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2.  The Stem-and-Leaf and the Histogram are used to illustrate             the frequency of the data points.", "2. The Stem-and-Leaf and the Histogram are used to illustrate the frequency of the data points.", "STEM 2 3 4 5 6 7 80,63,75,80", "LEAF 1 2,4,6 1,5,1,3 6,6,1,0 2,3 5 0 8 88863,75,80", "TALLY I III IIII IIII II I I2,3 5 0 8 88863,75,80"], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3.  The Box Plot is used to observe the variability of your sample       data points.", "3. The Box Plot is used to observe the variability of your sample data points.", "10, 8, 10, 15, 2, 4, 6, 8 or 2, 4, let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
