s follows: Function - Sine wave Range - 100 Amplitude - 5 Vpp Frequency - 4"], "jumps": ["P2160"]}, {"id": "P2160", "text": ["1.  Turn the function generator on and set to 400 Hz or 0.4 kHz. \n2.  Set the output amplitude of the function generator to 5 Vpp as       measured with the oscilloscope on PC130-14B TP10.", "1. Turn the function generator on and set to 400 Hz or 0.4 kHz. 2. Set the output amplitude of the function generator to 5 Vpp as measured with the oscilloscope on PC130-14B TP10."], "jumps": ["P2170", "P2140"]}, {"id": "P2150", "text": ["Let's start out by measuring the output voltages of the low pass filter in Circuit B."], "jumps": ["P2160", "P2140"]}, {"id": "P2140", "text": ["The circuit has been set up as shown. The function generator supplies a signal to the four RC filter circuits."], "jumps": ["P2150", "P2130"]}, {"id": "P2135", "text": ["BNC CONNECTION - Connect the Function Generator's Main Output BNC to the Test Console's Input BNC."], "jumps": ["P2130"]}, {"id": "P2130", "text": ["4.  Connect the output of the function generator to the INPUT               BNC  connector .", "4. Connect the output of the function generator to the INPUT BNC connector .", "4. Connect the output of the function generator to the INPUT BNC connector on the test console."], "jumps": ["P2140", "P2120"]}, {"id": "P2125", "text": ["SWITCH POSITIONS - Open S1, S2, S3 and S4, (move to the left)."], "jumps": ["P2120"]}, {"id": "P2120", "text": ["3.  Open S1, S2, S3, and S4, move to the left.", "3. Open S1, S2, S3, and S4, move to the left. ernal program = SCAN FTR 0 C1 00"], "jumps": ["P2110"]}, {"id": "P2115", "text": ["EXPERIMENT CARD PLACEMENT - PC130-14B shown in PC1 position."], "jumps": ["P2110"]}, {"id": "P2110", "text": ["2.  Carefully plug PC130-14B into the Test Console PC1 position.", "2. Carefully plug PC130-14B into the Test Console PC1 position. ernal program = SCAN FCC 0 External program = SCAN PWR 0 1"], "jumps": ["P2100"]}, {"id": "P2100", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2038"]}, {"id": "P2090", "text": ["Notice that the output is taken across the capacitor. This makes the circuits, RC low pass filters."], "jumps": ["P2100", "P2038"]}, {"id": "P2080", "text": ["The circuit outputs are taken from various test points. Circuit A, TP3; Circuit B, TP5; Circuit C,TP7; and Circuit D, TP9."], "jumps": ["P2090", "P2038"]}, {"id": "P2070", "text": ["The input signal is applied through Pin E to TP10."], "jumps": ["P2080", "P2038"]}, {"id": "P2060", "text": ["Switches S1 through S4 apply the input signal to the circuits."], "jumps": ["P2070", "P2038"]}, {"id": "P2050", "text": ["There are four circuits on the card labeled A, B, C, and D."], "jumps": ["P2060", "P2038"]}, {"id": "P2038", "text": ["The purpose of this card is to demonstrate normal operation and troubleshooting of RC circuits."], "jumps": ["P2050", "P2035"]}, {"id": "P2035", "text": ["Remember, when comparing calculated circuit values to measured circuit values, the oscilloscope adds some error due to interpreting the measurement shown on the screen.  Also, when answering a question involving a measurement, the range of acceptable values has been increased.", "Remember, when comparing calculated circuit values to measured circuit values, the oscilloscope adds some error due to interpreting the measurement shown on the screen. Also, when answering a question involving a measurement, the range of acceptable values has been increased........."], "jumps": ["P2038", "P2025"]}, {"id": "P2033", "text": [], "jumps": []}, {"id": "P2030", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 470 Oscilloscope rXXXXXXXXXXnt"], "jumps": ["P2025", "P2020"]}, {"id": "P2025", "text": ["An oscilloscope will be used to measure the voltages in this experiment. The high frequency voltages used are difficult to measure accurately with a multimeter."], "jumps": ["P2035", "P2030"]}, {"id": "P2020", "text": ["This experiment demonstrates the operation of RC Low Pass Filter circuits. You will measure the output voltage of a low pass RC Filter at various frequencies."], "jumps": ["P2030", "P2001"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P1980", "text": ["9.  The cutoff frequency only depends on circuit components,            not if  the circuit is low or high pass.", "9. The cutoff frequency only depends on circuit components, not if the circuit is low or high pass...", "1 fco = 2pRC = 15.9 kHz 1 = 0.2 Vpppppppppp"], "jumps": ["P1999", "P1970"]}, {"id": "P1970", "text": ["7.  The cutoff frequency is the point where the output power of            the circuit is half of the maximum value.\n8.  The cutoff frequency is equal to:", "7. The cutoff frequency is the point where the output power of the circuit is half of the maximum value. 8. The cutoff frequency is equal to: 1 fco =", "1 fco = 2pRC = 15.9 kHz 1 = 0.2 Vpppppppppp"], "jumps": ["P1980", "P1960"]}, {"id": "P1960", "text": ["6.  The capacitive reactance causes the high frequencies to pass       to the output while blocking the low frequencies.", "6. The capacitive reactance causes the high frequencies to pass to the output while blocking the low frequencies.", "0.1 kHz = 0.075 Vpp 1 kHz = 0.75 Vpp 10 kHz = 6.4 Vpp 100 kHz = 11.9 Vpp 1 MHz = 12.0 Vpppppppppppppppppp"], "jumps": ["P1970", "P1950"]}, {"id": "P1950", "text": ["5.   A high pass RC filter takes the output across the resistor.", "5. A high pass RC filter takes the output across the resistor."], "jumps": ["P1960", "P1940"]}, {"id": "P1940", "text": ["4.  The capacitive reactance causes the low frequencies to pass         to the output while grounding the high frequencies.", "4. The capacitive reactance causes the low frequencies to pass to the output while grounding the high frequencies.", "0.1 kHz = 12 Vpp 1 kHz = 12 Vpp 10 kHz = 10.2 Vpp 100 kHz = 1.9 Vpp 1 MHz = 0.2 VpppppVppVpppppVppppppppp"], "jumps": ["P1950", "P1930"]}, {"id": "P1930", "text": ["3.   A low pass RC filter takes the output across the capacitor.", "3. A low pass RC filter takes the output across the capacitor."], "jumps": ["P1940", "P1920"]}, {"id": "P1920", "text": ["1.  A RC filter circuit blocks certain frequencies and passes                 others. \n2.  RC filter circuits consist of a resistor and capacitor.", "1. A RC filter circuit blocks certain frequencies and passes others. 2. RC filter circuits consist of a resistor and capacitor...."], "jumps": ["P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on RC FILTER DESCRIPTION.", "This completes the information on RC FILTER DESCRIPTION...."], "jumps": ["P1001", "P1650"]}, {"id": "P1650", "text": ["Calculating fco and then comparing to the measured fco will tell you if the circuit is operating or not. You will do this in the experiment."], "jumps": ["P1910", "P1610"]}, {"id": "P1640", "text": ["But note, you can use the fco value to quickly check out the circuit. There is no need to calculate Xc, Z, I, Er, and Ec."], "jumps": ["P1650", "P1610"]}, {"id": "P1630", "text": ["You have had plenty of practice troubleshooting RC circuits."], "jumps": ["P1640", "P1610"]}, {"id": "P1620", "text": ["Troubleshooting RC filters is the same as troubleshooting any RC circuit. Consequently, no troubleshooting practice will be given in this lesson."], "jumps": ["P1630", "P1610"]}, {"id": "P1610", "text": ["The last point about RC filter circuits is troubleshooting."], "jumps": ["P1620", "P1600"]}, {"id": "P1602", "text": ["A low pass filter pass the low frequencies, it does not attenuate them."], "jumps": ["P1600"]}, {"id": "P1601", "text": [], "jumps": ["P1600"]}, {"id": "P1600", "text": ["What frequencies are attenuated in a low pass filter?", "What frequencies are attenuated in a low pass filter?......"], "jumps": ["P1590"]}, {"id": "P1592", "text": ["Remember the formula for cutoff frequency.", "Remember the formula for cutoff frequency..................", "1 fco = 2pRC = 15.9 kHz 1 = 0.2 Vpppppppppp"], "jumps": ["P1590"]}, {"id": "P1591", "text": [], "jumps": ["P1590"]}, {"id": "P1590", "text": ["If a high pass filter uses a 10 kohm resistor and a 0.025 mF capacitor, what is the cutoff frequency of the circuit?"], "jumps": ["P1580"]}, {"id": "P1582", "text": ["Notice where the output is taken. This determines if the circuit is a low or high pass filter."], "jumps": ["P1580"]}, {"id": "P1581", "text": [], "jumps": ["P1580"]}, {"id": "P1580", "text": ["What type of RC filter is this circuit?", "What type of RC filter is this circuit?...................."], "jumps": ["P1570"]}, {"id": "P1572", "text": ["Notice where the output is taken. This determines if the circuit is a low or high pass filter."], "jumps": ["P1570"]}, {"id": "P1571", "text": [], "jumps": ["P1570"]}, {"id": "P1570", "text": ["What type of RC filter is this circuit?", "What type of RC filter is this circuit?...................."], "jumps": ["P1560"]}, {"id": "P1560", "text": ["Also, since the circuit is the same as a low pass filter, only the components location was changed, the formula for fco is the same.", "Also, since the circuit is the same as a low pass filter, only the components location was changed, the formula for fco is the same. 1 fco =", "1 fco = 2pRC = 15.9 kHz 1 = 0.2 Vpppppppppp"], "jumps": ["P1570", "P1520"]}, {"id": "P1540", "text": ["Frequencies above fco, pass band, are passed to the output."], "jumps": ["P1560", "P1520"]}, {"id": "P1530", "text": ["However, the half power point or fco is the same. That is 0.707 times the maximum voltage or 0.707 times 12 Vpp, 8.5 Vpp.", "However, the half power point or fco is the same. That is 0.707 times the maximum voltage or 0.707 times 12 Vpp, 8.5 Vpp.."], "jumps": ["P1540", "P1520"]}, {"id": "P1520", "text": ["Graphing the results produces a different curve.", "Graphing the results produces a different curve. 1 kHz = .075 Vpp 1 kHz = .75 Vpp 10 kHz = 6.4 Vpp 100 kHz = 11.9 Vpp 1 mHz = 12.0 Vpp", "0.1 kHz = 0.075 Vpp 1 kHz = 0.75 Vpp 10 kHz = 6.4 Vpp 100 kHz = 11.9 Vpp 1 MHz = 12.0 Vpppppppppppppppppp"], "jumps": ["P1530", "P1500"]}, {"id": "P1510", "text": ["As you probably notice, the only difference between a low pass filter and a high pass filter is where the output is taken."], "jumps": ["P1520", "P1500"]}, {"id": "P1505", "text": ["C Z = R2 + Xc2 I = Ea/Z Er1 = IR Ec1 = IXcc mA x 10 kW = 12.0 Vpp Ec1 = I x c = 1.2 mA x .159 kW = 0.19 or .2 VppppppppppVpppppp", "Z = R2 + Xc2 I = Ea/Z Er1 = IR Ec1 = IXcccccccc IR Ec1 = IXcc mA x 10 kW = 12.0 Vpp Ec1 = I x c = 1.2 mA x .159 kW = 0.19 or .2 VppppppppppVpppppp", "I = R2 + Xc2 I = Ea/Z Er1 = IR Ec1 = IXcccccccc IR Ec1 = IXcc mA x 10 kW = 12.0 Vpp Ec1 = I x c = 1.2 mA x .159 kW = 0.19 or .2 VppppppppppVpppppp", "Er1 = IR Ec1 = IXcccc = R2 + Xc2 I = Ea/Z Er1 = IR Ec1 = IXcc mA x 10 kW = 12.0 Vpp Ec1 = I x c = 1.2 mA x .159 kW = 0.19 or .2 VppppppppppVpppppp", "Ec1 = IXcccc Z = R2 + Xc2 I = Ea/Z Er1 = IR Ec1 = IXcc mA x 10 kW = 12.0 Vpp Ec1 = I x c = 1.2 mA x .159 kW = 0.19 or .2 VppppppppppVpppppp"], "jumps": ["P1500"]}, {"id": "P1500", "text": ["With the same values used in the low pass filter circuit, these voltages are produced across the resistor (output voltage.)", "With the same values used in the low pass filter circuit, these voltages are produced across the resistor (output voltage.) .1 kHz = Er1 0.075 Vpp 1 kHz = Er1 0.75 Vpp 10 kHz = Er1 6.4 Vpp 100 kHz = Er1 11.9 Vpp 1 MHz = Er1 12.0 Vpp", "0.1 kHz = Er1 0.075 Vpp 1 kHz = Er1 0.75 Vpp 10 kHz = Er1 6.4 Vpp 100 kHz = Er1 11.9 Vpp 1 MHz = Er1 12.0 Vppppp"], "jumps": ["P1510", "P1430"]}, {"id": "P1490", "text": ["The low Xc does not drop very much voltage, most of the input signal reaches the resistor where the output is taken."], "jumps": ["P1500", "P1430"]}, {"id": "P1480", "text": ["At high frequencies, C1 has low capacitive reactance."], "jumps": ["P1490", "P1430"]}, {"id": "P1470", "text": ["Most of the input signal is dropped across the capacitor and does not reach the output (the voltage across the resistor)."], "jumps": ["P1480", "P1430"]}, {"id": "P1460", "text": ["The basic operation is, at low frequencies C1 has a large capacitive reactance."], "jumps": ["P1470", "P1430"]}, {"id": "P1450", "text": ["The output is taken across the resistor. This is also important when identifying an RC high pass filter."], "jumps": ["P1460", "P1430"]}, {"id": "P1440", "text": ["The difference between the low and high pass filter is; the high pass input is applied in series with the capacitor. This is an easy way to identify a RC high pass filter."], "jumps": ["P1450", "P1430"]}, {"id": "P1430", "text": ["A RC high pass filter consists of a capacitor and a resistor, just like the low pass filter."], "jumps": ["P1440", "P1420"]}, {"id": "P1420", "text": ["Now let's discuss high pass filter operation.", "Now let's discuss high pass filter operation..............."], "jumps": ["P1430", "P1410"]}, {"id": "P1412", "text": ["You did not use the formula correctly. Remember the example:", "1 fco = 2pRC = 15.9 kHz ppppppppp"], "jumps": ["P1410"]}, {"id": "P1411", "text": [], "jumps": ["P1410"]}, {"id": "P1410", "text": ["If a low pass filter contains a 4 kW resistor and a 0.5 mF capacitor, what is fco?"], "jumps": ["P1391"]}, {"id": "P1400", "text": ["Calculating fco in this matter eliminates the need to calculate Ec for different frequencies and graphing."], "jumps": ["P1410", "P1391"]}, {"id": "P1395", "text": ["62.8 x 10 = .04777 x 10 = 47.8 kHz", "= zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz", "1 6.28 x 10 kW x 0.001 mF zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz", "1 6.28 x 104 x 10-9 mF zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz", "1 6.28 x 10-5 9 mF zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz", "1 6.28 x 0.00001 9 mF zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz", "1 0.0000628 mF zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz", "= 15.9 kHz zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz"], "jumps": ["P1391"]}, {"id": "P1391", "text": ["The circuit used in the example has a fco of 15.9 kHz.", "The circuit used in the example has a fco of 15.9 kHz. 1 fco =", "RC = 15.9 kHz", "1 fco = 2pRC = 15.9 kHz ppppppp"], "jumps": ["P1400", "P1380"]}, {"id": "P1390", "text": ["The circuit used in the example has a fco of 15.9 kHz."], "jumps": ["P1400", "P1380"]}, {"id": "P1380", "text": ["Using a graph is one way to find fco, but it is not very accurate. Using this formula is more accurate.", "Using a graph is one way to find fco, but it is not very accurate. Using this formula is more accurate. 1 fco =", "RC = 15.9 kHz", "1 fco = 2pRC = 15.9 kHz = 0.2 Vpppppppppp"], "jumps": ["P1390", "P1332"]}, {"id": "P1370", "text": ["Frequencies above fco are attenuated or blocked, from the output. These are the stop band frequencies."], "jumps": ["P1380", "P1332"]}, {"id": "P1360", "text": ["Frequencies below fco pass thru the circuit to the output. These are the pass band frequencies."], "jumps": ["P1370", "P1332"]}, {"id": "P1350", "text": ["Using the graph, an output voltage of 8.5 occurs approximately at 20 kHz, fco is about 20 kHz."], "jumps": ["P1360", "P1332"]}, {"id": "P1340", "text": ["In the example circuit, the half power point is where the voltage o  ["The definition of a RC filter does not include blocking or passing phases."], "jumps": ["P1060"]}, {"id": "P1062", "text": ["The definition of a RC filter does not include blocking or passing voltage."], "jumps": ["P1060"]}, {"id": "P1061", "text": [], "jumps": ["P1060"]}, {"id": "P1060", "text": ["What does a RC filter circuit block or pass?", "What does a RC filter circuit block or pass?..............."], "jumps": ["P1020"]}, {"id": "P1050", "text": ["Using these two concepts, filter circuits are very easy to understand."], "jumps": ["P1060", "P1020"]}, {"id": "P1040", "text": ["The resistance of a resistor does not change when the input frequency changes."], "jumps": ["P1050", "P1020"]}, {"id": "P1030", "text": ["Remember as frequency increases, capacitive reactance decreases.", "Remember as frequency increases, capacitive reactance decreases. Xc ="], "jumps": ["P1040", "P1020"]}, {"id": "P1025", "text": ["The operation is based on how the capacitor reacts to different frequencies. This is capacitive reactance."], "jumps": ["P1030", "P1020"]}, {"id": "P1020", "text": ["A RC filter is a circuit constructed from capacitors and resistors that will block certain frequencies and pass others.", "A RC filter is a circuit constructed from capacitors and resistors that will block certain frequencies and pass others..."], "jumps": ["P1025", "P1001"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": ["P480"]}, {"id": "P480", "text": ["Let's begin the lesson on RC FILTERS.LE..................................."], "jumps": ["P440"]}, {"id": "P470", "text": ["Without filters selecting a particular frequency would be very hard."], "jumps": ["P480", "P440"]}, {"id": "P460", "text": ["The second filter is used to pick a specific television frequency.  When you change the channel you are tuning the filter to a specific frequency.", "The second filter is used to pick a specific television frequency. When you change the channel you are tuning the filt let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
