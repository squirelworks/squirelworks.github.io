<script>
const book = {"title": "9395T622", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Title: TELEPHONE EQUIPMENTasdf asd fasfd asdf asdf sadf", "Nida Corporation 2003- 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Observe the operation of an electronic telephone set and local loop. w Measure signals in the local loop of an electronic telephone set.", "w Describe the operation of the mechanical telephone set. w Describe the operation of the electronic telephone set."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 480, 488 or Equivalent XXXXXnt"], "jumps": []}, {"id": "P330", "text": ["ZZZZD=+\"+#$$\"@\">/%**/%*%%%>/A5=\"+.5po= ::CCZZ"], "jumps": ["PuuuY", "PYYf"]}, {"id": "P340", "text": [], "jumps": []}, {"id": "P350", "text": [], "jumps": ["P", "PRW"]}, {"id": "P400", "text": ["As you have seen, the telephone system is a communication system and uses many types of circuits."], "jumps": ["P300", "P410"]}, {"id": "P410", "text": ["Power supplies, amplifiers, oscillators, modulators, demodulators, multiplexers, and demultiplexers are just a few examples."], "jumps": ["P400", "P420"]}, {"id": "P420", "text": ["And, the circuits used for any one particular system depends on the system you choose to use."], "jumps": ["P400", "P430"]}, {"id": "P430", "text": ["To study all the types of circuits would require covering all aspects of electronics plus signal processing, communications, microwaves, fiberoptics, antennas, and transmission lines."], "jumps": ["P400", "P440"]}, {"id": "P440", "text": ["Not very practical. However, there is one circuit that is common to all telephone systems."], "jumps": ["P400", "P450"]}, {"id": "P450", "text": [], "jumps": ["P400", "P460"]}, {"id": "P460", "text": ["Let's begin the lesson on TELEPHONE EQUIPMENT............................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": ["The telset, it is the device you use every day............."], "jumps": ["P1025", "P1001"]}, {"id": "P1025", "text": ["And, even though there are hundreds of different types, all telsets can be broken down into two general categories."], "jumps": ["P1020", "P1040"]}, {"id": "P1040", "text": ["Although the mechanical telset has become somewhat of a novelty item, it is still useful for understanding basic telset operation. We will"], "jumps": ["P1020", "P1050"]}, {"id": "P1050", "text": ["A typical mechanical telset consists of a base unit and a hand set."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["The base unit plugs into the telephone jack and has the ringer circuit, dialer network, voice network, and hook switch."], "jumps": ["P1050", "P1070"]}, {"id": "P1070", "text": ["The hand set contains the input and output transducers (microphone and speaker) and is connected to the base unit by way of a spiral cord."], "jumps": ["P1050", "P1080"]}, {"id": "P1080", "text": ["Even though newer mechanical telsets have the base unit and hand set combined, the operation is the same. Let's see.", "The two wire local loop (green and red wires) connects into the base unit where the first circuit encountered is the ringer circuit."], "jumps": ["P1050", "P1090", "P1100"]}, {"id": "P1100", "text": ["The ringer circuit is a series resonant LC circuit. The inductors are bell solenoids while the capacitor blocks DC power."], "jumps": ["P1090", "P1110"]}, {"id": "P1110", "text": ["With both L1 and L2 in the circuit, a 20 Hz AC signal produces resonance which operate the bell solenoids - your phone rings."], "jumps": ["P1090", "P1120"]}, {"id": "P1120", "text": ["On some phones, a switch located on the bottom of the base unit allows you to short out one of the inductors reducing the volume of the ringer."], "jumps": ["P1090", "P1130"]}, {"id": "P1130", "text": ["In this case, the resonate frequency is 30 Hz. Remember, the ring signal is a 20 and 30 Hz, 60 to 80 Volt AC signal.", "Just past the ringer circuit is the hook switch, S1........"], "jumps": ["P1090", "P1140", "P1150"]}, {"id": "P1150", "text": ["The switch has three parts, S1A, S1B, and S1C."], "jumps": ["P1140", "P1160"]}, {"id": "P1160", "text": ["S1A and S1B make or break the series local loop."], "jumps": ["P1140", "P1170"]}, {"id": "P1170", "text": ["When the hand set is on the base unit, the hook switch is pushed and opens, breaking the local loop."], "jumps": ["P1140", "P1180"]}, {"id": "P1180", "text": ["Picking up the hand set causes the hook switch to close making the local loop, request for service."], "jumps": ["P1140", "P1190"]}, {"id": "P1190", "text": ["S1C shorts out the speaker when the local loop is open to prevent \"clicks\" when the hook switch is activated.", "Which component in the telset is a bell solenoid?.........."], "jumps": ["P1140", "P1200"]}, {"id": "P1201", "text": ["C1 is a capacitor that blocks the DC power to the telset from the ringer circuit.", "S1 is the hook switch that is used to make or break the local loop.", "The next circuit is the dialer network....................."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["Switch S2A is mechanically connected to the dialer and sequentially opens and closes as the dialer rotates - on the return rotation."], "jumps": ["P1210", "P1230"]}, {"id": "P1230", "text": ["S2A opens and closes a specific number of times to produce pulses for each digit dialed."], "jumps": ["P1210", "P1240"]}, {"id": "P1240", "text": ["For example, dialing a 5 followed by a 3 produces a set of five and three pulses as shown."], "jumps": ["P1210", "P1250"]}, {"id": "P1250", "text": ["Circuits located in the End Office count the pulses to determine the number dialed.", "Switch S2B is used to short the speaker while dialing to prevent you from hearing the pulses."], "jumps": ["P1240", "P1260", "P1270"]}, {"id": "P1270", "text": ["C2, R1, and R2 act as an automatic volume control."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["C2 couples voice signals to R2. R2 is a varistor that inversely changes its resistance according to the level of the applied voltage."], "jumps": ["P1260", "P1290"]}, {"id": "P1290", "text": ["If the signal level on the local loop increases, the resistance of R2 decreases, allowing more of the signal to be shorted around the voice network."], "jumps": ["P1260", "P1300"]}, {"id": "P1300", "text": ["If the signal level on the local loop decreases, the resistance of R2 increases, allowing less of the signal to be shorted around the voice network.", "The last circuit is the voice network that separates the outgoing voice signal from the incoming voice signal."], "jumps": ["P1260", "P1310", "P1320"]}, {"id": "P1320", "text": ["Recall that the transmitted and received voice signals are both on the local loop. This is called \"duplex transmission\"."], "jumps": ["P1310", "P1330"]}, {"id": "P1330", "text": ["The outgoing voice signal from the microphone is coupled to T2A."], "jumps": ["P1340", "P1310"]}, {"id": "P1340", "text": ["By transformer action, the voice signal is passed to T2B and placed on the local loop."], "jumps": ["P1310", "P1350"]}, {"id": "P1350", "text": ["The voice signal is also passed to T1B and T1C. However, the signal in T1 is out of phase, as indicated by the dots, and cancel."], "jumps": ["P1310", "P1360"]}, {"id": "P1360", "text": ["This prevents the transmitted voice signal from reaching the speaker."], "jumps": ["P1310", "P1370"]}, {"id": "P1370", "text": ["C3, C4, and R3 are used to exactly balance T1 and T2 for proper operation."], "jumps": ["P1310", "P1380"]}, {"id": "P1380", "text": ["However, most people prefer to hear a small amount of their own voice in the speaker."], "jumps": ["P1310", "P1390"]}, {"id": "P1390", "text": ["So, R3 is adjusted so a small amount of the transmitted signal is not canceled in T1 and reaches the speaker -- this is called sidetone.", "The received voice signal from the local loop is applied to T1B and T2B in series."], "jumps": ["P1310", "P1400", "P1410"]}, {"id": "P1410", "text": ["This in turn sets up in phase signals in T1C and out of phase signals in T2C."], "jumps": ["P1400", "P1420"]}, {"id": "P1420", "text": ["Consequently, the received signal is induced in T1A and passed on to the speaker."], "jumps": ["P1400", "P1430"]}, {"id": "P1430", "text": ["While the received signal is cancelled in T2A and blocked from the microphone.", "In the dialer network, what is the purpose of C2, R1, and R2?"], "jumps": ["P1400", "P1440"]}, {"id": "P1441", "text": ["The voice network of T1 and T2 separate signals on the local loop.", "L1 and L2 are the bell solenoids...........................", "Which component changes resistance as the signal level changes?"], "jumps": ["P1440"]}, {"id": "P1451", "text": ["R1 is part of the automatic volume control but does not change resistance. R1 is not a varistor.", "R3 is part of the voice network that separates the incoming signal from the outgoing signal. It is not a varistor, it is a variable resistor.", "How is most of the transmitted voice signal prevented from reaching the speaker?"], "jumps": ["P1450"]}, {"id": "P1461", "text": [], "jumps": []}, {"id": "P1462", "text": ["If the signal to the speaker is in phase to the transmitted signal, the speaker would pick up the outgoing voice signal."], "jumps": []}, {"id": "P1463", "text": ["R3 is adjusted to slightly mismatch T1 and T2 so a small amount of the transmitted signal reaches the speaker, not adjusted so most of the transmitted signal does not reach the speaker....", "Now, let's look at the electronic telset..................."], "jumps": ["P1460", "P1480"]}, {"id": "P1480", "text": ["A typical electronic telset consists of a base unit and a hand set, just like the mechanical telset."], "jumps": ["P1470", "P1490"]}, {"id": "P1490", "text": ["Again, newer electronic telsets have the base unit and hand set combined, but the operation is the same."], "jumps": ["P1480", "P1500"]}, {"id": "P1500", "text": ["The major difference between a mechanical telset and an electronic telset is the dialer and the circuits inside the base unit."], "jumps": ["P1480", "P1510"]}, {"id": "P1510", "text": ["The electronic circuits are what give you the added features such as memory dialing, speed dialing, etc."], "jumps": ["P1480", "P1520"]}, {"id": "P1520", "text": ["These electronic circuits also allow for cordless operation of the phone. Cordless phones use FM signal processing between the hand set and base unit."], "jumps": ["P1480", "P1530"]}, {"id": "P1530", "text": ["The electronic circuits used are IC chips. One IC can be used as the ringer circuit, voice network and dialer network."], "jumps": ["P1480", "P1540"]}, {"id": "P1540", "text": ["For simplicity, let's look at a discrete block diagram of a typical electronic telset."], "jumps": ["P1480", "P1550"]}, {"id": "P1550", "text": ["With the hand set on the base unit, on hook, S1A and S1B are open as shown."], "jumps": ["P1540", "P1560"]}, {"id": "P1560", "text": ["R1 presents a high resistance to voice signals and C1 blocks any DC current."], "jumps": ["P1540", "P1570"]}, {"id": "P1570", "text": ["However, the ring signal will be passed by R1 and C1. D2 and D4 rectify the AC ring signal (20 and 30 Hz 60 - 80 VAC) to pulsating DC."], "jumps": ["P1540", "P1580"]}, {"id": "P1580", "text": ["S1B then routes the pulsating DC through D6 and D7, zener diode limiter and clipper, and activates the electronic ringer circuit -- your phone rings."], "jumps": ["P1540", "P1590"]}, {"id": "P1590", "text": ["When you pick up the hand set, off hook, S1A and S1B close..."], "jumps": ["P1600", "P1540"]}, {"id": "P1600", "text": ["S1A closing shorts out R1 and C1 allowing the small level voice signals and DC power to reach the circuits in the telset through closed S1B."], "jumps": ["P1590", "P1610"]}, {"id": "P1610", "text": ["D1 through D4 ensures that the DC power applied to the line voltage regulator is the correct polarity."], "jumps": ["P1590", "P1620"]}, {"id": "P1620", "text": ["This prevents damaging the telset IC chips if the green and red wires are mistakenly reversed."], "jumps": ["P1590", "P1630"]}, {"id": "P1630", "text": ["Normally, the green wire is positive and the red wire is negative. D2 and D3 are forward biased routing positive polarity power to the line voltage regulator."], "jumps": ["P1640", "P1590"]}, {"id": "P1640", "text": ["If the wires are reversed, D1 and D4 are forward biased routing positive polarity power to the line voltage regulator."], "jumps": ["P1650", "P1590"]}, {"id": "P1650", "text": ["From S1B, the +DC voltage is routed to the line voltage regulator, D5 limits the DC voltage applied."], "jumps": ["P1660", "P1590"]}, {"id": "P1660", "text": ["The regulator produces the power to operate the rest of the circuits in the telset."], "jumps": ["P1650", "P1670"]}, {"id": "P1670", "text": ["The voice network separates the incoming and outgoing voice signals."], "jumps": ["P1650", "P1680"]}, {"id": "P1680", "text": ["The outgoing signals are routed from the microphone through the voice network to the local loop. D1 through D4 allow the complete voice signal to pass."], "jumps": ["P1650", "P1690"]}, {"id": "P1690", "text": ["The incoming signals are routed from the local loop through the voice network to the microphone. D1 through D4 allow the complete voice signal to pass."], "jumps": ["P1700", "P1650"]}, {"id": "P1700", "text": ["Also, the Dual Tone Multiple Frequency (DTMF) dialer inputs tones to the voice network which are placed on the local loop."], "jumps": ["P1650", "P1710"]}, {"id": "P1710", "text": ["The crystal produces the fundamental frequency that is used to generate the different tones for each number dialed."], "jumps": ["P1650", "P1720"]}, {"id": "P1720", "text": ["What supplies power to the IC chips in an electronic telset?"], "jumps": ["P1650"]}, {"id": "P1721", "text": [], "jumps": []}, {"id": "P1722", "text": ["The local loop only supplies power to the line voltage regulator."], "jumps": []}, {"id": "P1723", "text": ["D1 through D4 ensures the correct polarity voltage is applied to the line voltage regulator."], "jumps": []}, {"id": "P1730", "text": ["What type of signal is applied to the ringer circuit?......"], "jumps": ["P1720"]}, {"id": "P1731", "text": [], "jumps": []}, {"id": "P1732", "text": ["Due to the action of D2, an AC signal is not applied to the ringer circuit."], "jumps": []}, {"id": "P1733", "text": ["DC is blocked by C1 and will not reach the ringer circuit.."], "jumps": []}, {"id": "P1740", "text": ["What is the purpose of the crystal?........................"], "jumps": ["P1730"]}, {"id": "P1741", "text": [], "jumps": []}, {"id": "P1742", "text": ["The ring signal is generated from the End Office, not the telset."], "jumps": []}, {"id": "P1743", "text": ["The busy signal is generated from the End Office, not the telset."], "jumps": []}, {"id": "P1750", "text": ["Now, let's look at example circuits used in the voice and dialer networks."], "jumps": ["P1760", "P1740"]}, {"id": "P1760", "text": ["The voice network uses a differential amplifier, normally an op-amp configured for a differential amplifier. Recall that a different amplifier rejects common mode signals and operates similarly to the transformer circuit in the mechanical telset."], "jumps": ["P1750", "P1770"]}, {"id": "P1770", "text": ["The outgoing voice signal from the microphone is applied to the base of Q1, to the base of Q2 through Q3, and to the local loop."], "jumps": ["P1780", "P1760"]}, {"id": "P1780", "text": ["Since Q3 is a common collector, emitter follower, the signal applied to Q2 is the same level and in phase with the signal applied to Q1."], "jumps": ["P1760", "P1790"]}, {"id": "P1782", "text": ["Since Q3 is a common collector, emitter follower, the signal applied to Q2 is the same level and in phase with the signal applied to Q1."], "jumps": ["P1790", "P1760"]}, {"id": "P1785", "text": ["COMMON COLLECTOR/EMITTER FOLLOWER - The common collector/emitter follower amplifier has a unity voltage gain (gain of 1) and no phase inversion."], "jumps": []}, {"id": "P1790", "text": ["With the speaker connected across the collectors of Q1/Q2 and with Q1/Q2 amplifying the same signal, there is no difference in potential across the speaker."], "jumps": ["P1782", "P1800"]}, {"id": "P1800", "text": ["The speaker does not respond to outgoing voice signals. The variable resistor in the collector of Q2 circuit is adjusted to balance the conduction of Q1 and Q2 and is offset a little to produce sidetone."], "jumps": ["P1782", "P1810"]}, {"id": "P1810", "text": ["The incoming voice signal from the local loop is only applied to Q2. The signal is isolated from Q1 by Q3 which also isolates the signal from the microphone. With only one input applied, the collector of Q1 remains constant and the collector of Q2 varies. This sets up a potential difference across the speaker and produces an output....."], "jumps": ["P1782", "P1820"]}, {"id": "P1820", "text": ["Consequently, there is a difference in potential across the speaker and the speaker responds."], "jumps": ["P1782", "P1830"]}, {"id": "P1830", "text": ["1 2 3 4 5 6 7 8 9 * 0 #", "The dialer network uses a key decoder, two frequency dividers and a crystal."], "jumps": ["P1782", "P1840"]}, {"id": "P1840", "text": ["Pressing a button sets up two inputs to the key decoder, one for the row (R) and one for the column (c), a matrix."], "jumps": ["P1830", "P1850"]}, {"id": "P1850", "text": ["The key decoder then sends a signal to the high and low tone dividers that selects tones depending on the number dialed."], "jumps": ["P1830", "P1860"]}, {"id": "P1860", "text": ["The high frequency of the crystal, 3.579545 MHz, is used to produce accurate tones when divided."], "jumps": ["P1830", "P1870"]}, {"id": "P1870", "text": ["The two frequencies or tones produced depends on the number dialed or which button was pushed (values are in Hz)."], "jumps": ["P1830", "P1880"]}, {"id": "P1880", "text": ["Newer electronic telsets use additional buttons for added functions."], "jumps": ["P1870", "P1890"]}, {"id": "P1890", "text": ["What type of signal does Q3 block?........................."], "jumps": ["P1880"]}, {"id": "P1891", "text": [], "jumps": []}, {"id": "P1892", "text": ["The outgoing voice signal must be equally applied to both Q1 and Q2 so that the speaker will not respond. Q3 passes the outgoing signal from the microphone...."], "jumps": []}, {"id": "P1893", "text": ["Q3 does not block both the incoming and outgoing signals. Signals from the microphone must be applied to both Q1 and Q2 to isolate the speaker..."], "jumps": []}, {"id": "P1900", "text": ["What are the two frequencies produced if the number 8 is dialed?"], "jumps": ["P1890"]}, {"id": "P1901", "text": [], "jumps": []}, {"id": "P1902", "text": ["An 852 and 1209 Hz tone represents the number 7............"], "jumps": []}, {"id": "P1903", "text": ["A 770 and 1336 Hz tone represents the number 5............."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on TELSETS.E 1 TITLE........", "1. There are two categories of telsets. second line here...."], "jumps": ["P1900", "P1001", "P1930"]}, {"id": "P1930", "text": ["2. The mechanical telset consists of a base unit and hand set.", "3. The mechanical telset contains a ringer circuit, hook switch, dialer network, voice network, speaker, and microphone."], "jumps": ["P1940", "P1920", "P1950", "P1930"]}, {"id": "P1950", "text": ["4. Dialing is accomplished by a switch making and breaking as a dial rotates producing pulses."], "jumps": ["P1940", "P1960"]}, {"id": "P1960", "text": ["5. The electronic telset consists of a base unit and hand set."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6. The electronic telset contains a ringer circuit, hook switch, diodes, dialer network, voice network, speaker, and microphone."], "jumps": ["P1960", "P1980"]}, {"id": "P1980", "text": ["1 2 3 4 5 6 7 8 9 * 0 #", "7. Dialing is accomplished by a key decoder producing two tones."], "jumps": ["P1970", "P1990"]}, {"id": "P1990", "text": ["8. The tones produced depend on the number dialed..........."], "jumps": ["P1980", "P1999"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1990", "P1001"]}, {"id": "P3910", "text": ["This completes the experiment on TELEPHONE EQUIPMENT......."], "jumps": ["P3750"]}, {"id": "P3020", "text": ["In this experiment, you will build a telephone network. Your system will consist of two telsets, two end offices, a switch, and a simulated long distance service."], "jumps": ["P3001", "P3040"]}, {"id": "P3040", "text": ["The Nida PC130-338 experiment card, and supporting test console, serve as end office/local office, intermediate switching office, long distance service toll office, and fiber optic link."], "jumps": ["P3020"]}, {"id": "P3050", "text": ["Each telset is connected to an end office via a local loop. Dialing, automated switching, and tone signals are not provided by the experiment card."], "jumps": ["P3040"]}, {"id": "P3060", "text": ["The experiment card also separates the Tx and Rx signals as required for fiber optic operations in the long distance service system."], "jumps": ["P3040"]}, {"id": "P3070", "text": ["The intermediate switching office is actually a manual mechanical switch. Local loop operation uses twisted pair copper wire and long distance is handled by fiber optics."], "jumps": ["P3040"]}, {"id": "P3080", "text": ["Your long distance service is fiber optic. What are the designations of the two cables exiting and entering the toll office (PC130-338 card)?"], "jumps": ["P3020", "PC130"]}, {"id": "P3081", "text": [], "jumps": []}, {"id": "P3082", "text": ["Tip/Ring are local loop designations......................."], "jumps": []}, {"id": "P3083", "text": ["This would apply to handset voice loop to some extent......"], "jumps": []}, {"id": "P3084", "text": ["These are components of the voice loop....................."], "jumps": []}, {"id": "P3090", "text": ["Let's examine a typical electronic telset.................."], "jumps": ["P3020"]}, {"id": "P3100", "text": ["The slim-line style has the two basic functional units, base unit and handset."], "jumps": ["P3090"]}, {"id": "P3110", "text": ["The base unit provides the local loop connection via a 4-wire flat satin cable with a modular jack. The interior electronics layout is typical."], "jumps": ["P3090"]}, {"id": "P3120", "text": ["A closer look at the circuit board reveals some familiar local loop circuitry. The bridge rectifier diodes, zener diodes, and capacitor are typical electronic telset components."], "jumps": ["P3110"]}, {"id": "P3130", "text": ["The handset contains the majority of the electronics in the slim-line style telset. The primary function is to interface the human being with the voice network. The handset may be connected to the base unit via spiral cord or even a wireless link..."], "jumps": ["P3090"]}, {"id": "P3140", "text": ["Microphone Wires - yellow and black (Voice Network)", "Dual Tone Multiple Frequency Dialer Integrated Circuit.", "The featured handset uses an IC-type dialer circuit. The discrete components on the circuit board comprise the differential amplifier and other special function circuits."], "jumps": ["P3130", "P3150"]}, {"id": "P3150", "text": ["The handset may have a variety of special features including redial, memory, channel select (cordless), tone-pulse select, and other functions."], "jumps": ["P3130", "P3160"]}, {"id": "P3160", "text": ["Now let's examine the experiment card, PC130-338...........", "ggggggggggKgKKLLKKJJKJJJJJJJJJGGGGGG==G=GGG=;E,EGGGGGGGGEe VOGGGG;GGGGGG=G====7==#7#7$$$="], "jumps": ["P3130", "P3170"]}, {"id": "P3170", "text": ["The Telephone System card has 8 integrated circuits, a switch, 2 potentiometers, 2 modular phone jacks, 4 fiber optic transceivers (2 transmit/2 receive), and various discrete components..."], "jumps": ["P3160", "P3180"]}, {"id": "P3180", "text": ["The electronics on the surface of the card can be segregated into the basic functional blocks of the telephone network."], "jumps": ["P3160", "P3190"]}, {"id": "P3190", "text": ["The End Office circuitry consists of the modular jacks, test points, a few resistors, and LEDs (Busy lights)."], "jumps": ["P3160", "P3200"]}, {"id": "P3200", "text": ["The intermediate switch, a manual switch and 2 resistors, perform the signal routing function."], "jumps": ["P3160", "P3210"]}, {"id": "P3210", "text": ["Most of the card's circuitry accomplishes the toll office function for the long distance service. The toll office employs fiber optic links to meet service requirements."], "jumps": ["P3160", "P3220"]}, {"id": "P3220", "text": ["The remaining circuitry provides services to the offices and local loop. Services include -5v and +5v power and convenient test points. The trainer provides the primary (15 v, which serves as the current source for the local loops and power supplies..."], "jumps": ["P3150", "P3230"]}, {"id": "P3230", "text": ["Which of the following components/units are not part of the toll office?"], "jumps": ["P3160"]}, {"id": "P3231", "text": [], "jumps": []}, {"id": "P3232", "text": ["The toll office uses fiber optic links and therefore must make use of the transceivers."], "jumps": []}, {"id": "P3233", "text": ["All of the ICs, with the exception of the power supplies, are used by the toll office."], "jumps": []}, {"id": "P3240", "text": ["Now let's look at the experiment card circuitry using a functional block approach."], "jumps": ["P3250", "P3230"]}, {"id": "P3250", "text": ["The PC130-338 card has four functional processes: INTERFACE, CONVERSION, SWITCHING and POWER GENERATION."], "jumps": ["P3260", "P3240"]}, {"id": "P3260", "text": ["The interface function is accomplished around the boundaries of the card. Any signal that penetrates the boundary must interface with the card via a physical connection."], "jumps": ["P3250", "P3270"]}, {"id": "P3270", "text": ["Interface connections include 15v power (from the trainer), phone jacks, and fiber links. The fiber links have dual functionality, interface and conversion."], "jumps": ["P3250", "P3280"]}, {"id": "P3280", "text": ["Conversion is a change process. In the case of the fiber optic ports, designated Tx (gray) and Rx (blue), this is from electrical to light (Tx) and light to electrical (Rx). The output is converted again by the amplifiers..."], "jumps": ["P3250", "P3290"]}, {"id": "P3290", "text": ["The amplifiers boost and/or combine the signals. The most significant conversion process is local loop (duplex) to Tx/Rx (simplex), then back to local loop. The summing amplifiers add local loop and the receive signal (Rx) from the other circuit..."], "jumps": ["P3250", "P3300"]}, {"id": "P3300", "text": ["Switching is accomplished manually on the PC130-338 card. This is a critical network function. In LL (Local Loop) position, the switch connects the local loops in series. In LD (Long Distance) position, the local loops are connected to the toll office circuitry (amplifiers and fiber interface)..."], "jumps": ["P3250", "P3310"]}, {"id": "P3310", "text": ["Power Generation starts functioning when the 15v source is applied. Integrated circuits produce -5v and +5v to run the electronics on the card. The local loops use the straight 15v inputs to run the talk battery circuit in the voice network..."], "jumps": ["P3250", "P3320"]}, {"id": "P3320", "text": ["Let's construct the telephone network and observe normal operations."], "jumps": ["P3250", "P3330"]}, {"id": "P3330", "text": ["1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P3320"]}, {"id": "P3332", "text": ["3. Press Enter to set: Positive Supply Voltage to 15", "2. Carefully plug PC130-338 into the test console PC1 position.", "EXPERIMENT CARD PLACEMENT - PC130-338 shown in PC1 position.."], "jumps": []}, {"id": "P3340", "text": ["3. Press Enter to set: Positive Supply Voltage to 15 oltage to 12..Negative Supply Voltage to 12.... Set Negative Supply Voltage to 12.e Supply Voltage to 12.Voltage to 12. ly Voltage to 12."], "jumps": []}, {"id": "P3345", "text": ["1. Voltmeter Switch - Pos. 2. + Supply Control - 15 V 3. Voltmeter Switch - Neg. 4. - Supply Control - 12 VVVVVVVVVVVVVVVVVVVVVVVge -DC/+DC/AC Switch ........ +DC Red test Lead ................... V input jack Black test lead ................. COMM input jack COMM input jackM input jackack....... COMM input jackkkjackkkkkkkkkkkkkk", "If using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "TEST CONSOLE CONTROLS - Set the test console controls as indicated. Start second line here."], "jumps": []}, {"id": "P3360", "text": ["4. Set potentiometers R11 and R33 to mid position. 5. Set S1 to LL (Local Loop)."], "jumps": ["P3365", "P3370"]}, {"id": "P3365", "text": ["Each long distance circuit has a potentiometer. Using a screwdriver, adjust the potentiometer fully clockwise, then fully counterclockwise. Now that the radial limits are known, adjust to the middle of the range, or mid point."], "jumps": ["PPX"]}, {"id": "P3370", "text": ["6. Connect telsets 1 and 2 into J1 and J2 (modular phone jacks). 7. Set telset volume to Lo and pulse/tone to tone (if so equipped)."], "jumps": ["P3360", "P3380"]}, {"id": "P3380", "text": ["IC1 IC4 IC2 IC3", "8. Connect fiber optic links as shown:...................."], "jumps": ["P3370", "P3390"]}, {"id": "P3390", "text": ["9. Set PC1 DC Power switch to ON. C switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P3380"]}, {"id": "P3400", "text": ["Perform an operational test of local loop operation as follows:"], "jumps": ["P3410"]}, {"id": "P3410", "text": ["1. Lift the handset on each telset. 2. Ensure the appropriate phone busy light illuminates."], "jumps": ["P3420", "P3400"]}, {"id": "P3420", "text": ["3. Lift one handset and listen while depressing keypad buttons on the other. 4. Ensure audible tones are heard. 5. Reverse the handsets and repeat the process..."], "jumps": ["P3410", "P3430"]}, {"id": "P3430", "text": ["If tones can be heard on both handsets, the end office and switch functions are normal. Test the voice network by talking into the microphone of one handset and listening in the speaker of the other handset..."], "jumps": ["P3440", "P3410"]}, {"id": "P3440", "text": ["The next part of the operational test involves testing the long distance capability of the telephone network. The first step in the process is to perform a dead-end reflection adjustment.."], "jumps": ["P3430", "P3450"]}, {"id": "P3445", "text": ["DEAD-END REFLECTION - A noise signal created in the PC130-338 fiber optic circuitry when one long distance circuit is on the other is off. This noise anomaly may be reduced by adjusting potentiometers R11 and R33. The noise can overdrive the summing operational amplifier and feed noise into the local loop. This noise is sometimes referred to as singing....."], "jumps": []}, {"id": "P3450", "text": ["1. Position S1 to the LD (Long Distance) position. 2. Pick up one of the handsets and listen for dead-end reflection."], "jumps": ["P3440", "P3460"]}, {"id": "P3460", "text": ["3. Adjust R11 and R33 to reduce the noise, or at least set it to a comfortable listening level. 4. Repeat this process with the other handset."], "jumps": ["P3450", "P3470"]}, {"id": "P3470", "text": ["5. Lift both handsets and test audio quality by pressing keypad buttons and talking.."], "jumps": ["P3460", "P3480"]}, {"id": "P3480", "text": ["Evaluate the quality of the local loop and long distance operation. Readjust potentiometers R11 and R33 as necessary to ensure the highest quality telephone network traffic."], "jumps": ["P3470", "P3490"]}, {"id": "P3485", "text": ["TRAFFIC - The term used in telecommunications to describe the signals throughout the system. Traffic consists of analog voice, digital data, tones, pulses, ringing, etc.tc."], "jumps": []}, {"id": "P3490", "text": ["What is indicated by an illuminated phone LED on the PC130-338 card?"], "jumps": ["P3480"]}, {"id": "P3491", "text": [], "jumps": []}, {"id": "P3492", "text": ["The PC130-338 does not utilize the dialing features of the telsets, unlike a central office."], "jumps": []}, {"id": "P3493", "text": ["The LED is illuminated by +15 volts........................"], "jumps": []}, {"id": "P3494", "text": ["If the circuit were dead, the LED would be extinguished...."], "jumps": []}, {"id": "P3500", "text": ["The telephone system has been exercised with full capabilities. The trainer will deliberately insert faults in the circuitry. Your task is to isolate the failure to the lowest component possible."], "jumps": ["P3505", "P3490", "P3510"]}, {"id": "P3505", "text": ["You already know the faults will be on the PC130-338 card. The trainer cannot fault the telsets. You will be shown a logical troubleshooting process that is not unlike what telephone technicians use to isolate problems in the field."], "jumps": []}, {"id": "P3510", "text": ["1 1 Summing Amp Ouput Circuit 1 On with steady tone -0.5 + .1 VDC 2 1 Phone #1 Talk Battery Circuit 1 On -0.4 + .1 VDC 2 1 Phone #1 Talk Battery Circuit 1 Off -15 + .5 VDC 3 1 Rx Amp Output Power Applied +3 + 1 VDC 4 2 Phone #2 Talk Battery Circuit 2 On -0.4 + .1 VDC 4 2 Phone #2 Talk Battery Circuit 2 Off -15 + .5 VDC 5 2 Summing Amp Output Circuit 2 On with steady tone -0.5 + .1 VDC 6 2 Rx Amp Output Power Applied +3 + 1 VDC 7 1 & 2 -15V Power Power Applied -14.5 to -15.5 VDC 8 1 & 2 -5V Power Power Applied -4.8 to -5.2 VDC 9 1 & 2 +15V Power Power Applied +14.5 to +15.5 VDC 10 1 & 2 +5V Power Power Applied +4.8 to +5.2 VDC 11 1 & 2 Chassis Ground Card mounted on trainer 0V (Earth)", "A useful bit of technical specifications will help you troubleshoot. The table below lists all of the test points on the PC130-338 card and includes normal signal specifications. Make notes as desired. st Point Phone Circuit Signal Description Criterion Signal Specifications (Multimeter) 1 1 Summing Amp output Circuit 1 On with steady tone -0.5 (.1 vdc 2 1 Phone #1 Talk Battery Circuit 1 On -0.4 (.1 vdc 2 1 Phone #1 Talk Battery Circuit 1 Off -15 (.5 vdc 3 1 Rx Amp output Power applied +3 (1 vdc 4 2 Phone #2 Talk Battery Circuit 2 On -0.4 (.1 vdc 4 2 Phone #2 Talk Battery Circuit 2 Off -15 (.5 vdc 5 2 Summing Amp output Circuit 2 On with steady tone -0.5 (.1 vdc 6 2 Rx Amp output Power applied +3 (1 vdc 7 1 & 2 _-15v power Power applied -14.5 to -15.5 vdc 8 1 & 2 -5v power Power applied -4.8 to -5.2 vdc 9 1 & 2 +15v power Power applied +14.5 to +15.5 vdc 10 1 & 2 +5v power Power applied +4.8 to +5.2 vdc 11 1 & 2 Chassis Ground Card mounted on trainer 0v (Earth)))))", "Let's add the test points to the functional block diagram.."], "jumps": ["P3500", "P3520", "P3530", "P3510", "P3525"]}, {"id": "P3525", "text": ["The test points are arranged in a logical manner on the surface of the card.Start second line here."], "jumps": ["PPX"]}, {"id": "P3530", "text": ["During the troubleshooting process, the table and block diagram will be referred to when needed."], "jumps": ["P3520", "P3540"]}, {"id": "P3540", "text": ["Perform an operational test on the telephone network.1 DC switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P3530"]}, {"id": "P3550", "text": ["Test local loop operation first. Pick up both handsets and ensure voice and tones are transmitted and received, and that the busy phone LEDs work correctly."], "jumps": ["P3560"]}, {"id": "P3560", "text": ["Is local loop operation satisfactory?......................"], "jumps": ["P3550"]}, {"id": "P3561", "text": [], "jumps": []}, {"id": "P3562", "text": ["Ensure S1 is in the LL position. Check telset modular jack/plug connections."], "jumps": []}, {"id": "P3570", "text": ["Based on your observations it can be determined that the telsets, end offices, and local loops are functioning normally. Switching and long distance functions must be tested next."], "jumps": ["P3560", "P3580"]}, {"id": "P3580", "text": [], "jumps": ["P3560", "P3590"]}, {"id": "P3590", "text": ["It should be readily apparent that there is a problem receiving tones or voice on Phone#1 over the long distance circuit. Phone #2 seems to receive signals from Phone #1, but the reverse is not true..."], "jumps": ["P3560", "P3600"]}, {"id": "P3600", "text": ["Establish the bad link. Phone #2 Rx is good because it receives perfectly well. However, what is the status of the Phone #2 Tx link?"], "jumps": ["P3560", "P3610"]}, {"id": "P3610", "text": ["5 2 Summing Amp Ouput Circuit 2 On with steady tone -0.5 + .1 VDC 2 1 Phone #1 Talk Battery Circuit 1 On -0.4 + .1 VDC 2 1 Phone #1 Talk Battery Circuit 1 Off -15 + .5 VDC 3 1 Rx Amp Output Power Applied +3 + 1 VDC 4 2 Phone #2 Talk Battery Circuit 2 On -0.4 + .1 VDC 4 2 Phone #2 Talk Battery Circuit 2 Off -15 + .5 VDC 5 2 Summing Amp Output Circuit 2 On with steady tone -0.5 + .1 VDC 6 2 Rx Amp Output Power Applied +3 + 1 VDC 7 1 & 2 -15V Power Power Applied -14.5 to -15.5 VDC 8 1 & 2 -5V Power Power Applied -4.8 to -5.2 VDC 9 1 & 2 +15V Power Power Applied +14.5 to +15.5 VDC 10 1 & 2 +5V Power Power Applied +4.8 to +5.2 VDC 11 1 & 2 Chassis Ground Card mounted on trainer 0V (Earth)", "The specifications table lists the Phone #2 circuit summing amplifier output on TP5."], "jumps": ["P3600", "P3620"]}, {"id": "P3620", "text": ["Take a reading of the DC voltage on TP5 under the criterion listed: approximately -0.5 vdc when the telset is transmitting a steady tone. Connect the multimeter black lead to TP11 (Ground) and the positive lead to TP5. Set up to read DC voltage. Pick up phone #2 handset and press a keypad button continuously during the measurement.", "ggggggggggKgKKLLKKJJKJJJJJJJJJGGGGGG==G=GGG=;E,EGGGGGGGGEe VOGGGG;GGGGGG=G====7==#7#7$$$="], "jumps": ["P3610", "P3630"]}, {"id": "P3630", "text": ["Your reading is considerably less than -0.5 vdc. This indicates a potential summing amplifier problem. Either the summing amplifier has failed, or another Tx link component, or number of components, has failed..."], "jumps": ["P3620", "P3640"]}, {"id": "P3640", "text": ["Looking at the functional block diagram, a conclusion may be reached. The summing amplifier is bad. Low voltage could mean a grounded or open output. If the signal on TP5 had been good, Tx circuit troubleshooting would have had to continue..."], "jumps": ["P3630", "P3650"]}, {"id": "P3650", "text": ["The problem was a grounded output on U4, the summing amplifier (Op. Amp.) in the Phone #2 Tx circuit. The trainer will automatically remove the fault..................................."], "jumps": ["P3640"]}, {"id": "P3660", "text": ["Retest the telephone system, especially the restored Phone #2 long distance Tx circuit."], "jumps": ["P3670"]}, {"id": "P3670", "text": ["Has the telephone system resumed normal operation?........."], "jumps": ["P3660"]}, {"id": "P3671", "text": [], "jumps": []}, {"id": "P3672", "text": ["Ensure 15 v power is on and interface connections are correct."], "jumps": []}, {"id": "P3680", "text": ["The trainer has caused the telephone system to fail again by inserting another fault. Conduct the routine operational test and assess the problem(s)...................................."], "jumps": ["P3690", "P3670"]}, {"id": "P3690", "text": ["This particular failure is serious because all service is lost. In this case, it is better to determine what works correctly before searching for failures. The busy LEDs illuminate per design and the tone generators in the telsets produce the tones. The problem is certainly network related because there is no traffic..."], "jumps": ["P3680", "P3700"]}, {"id": "P3700", "text": ["What voltage(s) is/are required for talk battery operation?"], "jumps": ["P3690"]}, {"id": "P3701", "text": [], "jumps": []}, {"id": "P3702", "text": ["Telephones don't need more than one voltage source........."], "jumps": []}, {"id": "P3703", "text": ["8 vdc is too low, considering the distances involved and line losses."], "jumps": []}, {"id": "P3710", "text": ["7 1 & 2 -15V Power Power Applied -0.5 + .1 VDC Phone #1 Talk Battery Circuit 1 On -0.4 + .1 VDC 2 1 Phone #1 Talk Battery Circuit 1 Off -15 + .5 VDC 3 1 Rx Amp Output Power Applied +3 + 1 VDC 4 2 Phone #2 Talk Battery Circuit 2 On -0.4 + .1 VDC 4 2 Phone #2 Talk Battery Circuit 2 Off -15 + .5 VDC 5 2 Summing Amp Output Circuit 2 On with steady tone -0.5 + .1 VDC 6 2 Rx Amp Output Power Applied +3 + 1 VDC 7 1 & 2 -15V Power Power Applied -14.5 to -15.5 VDC 8 1 & 2 -5V Power Power Applied -4.8 to -5.2 VDC 9 1 & nd.....", "ggggggggggKgKKLLKKJJKJJJJJJJJJGGGGGG==G=GGG=;E,EGGGGGGGGEe VOGGGG;GGGGGG=G====7==#7#7$$$="], "jumps": ["P3730", "P3750"]}, {"id": "P3750", "text": ["The trainer has automatically repaired the problem with the talk battery voltage. Perform a retest by observing normal operation. Measure TP2 and TP4 to verify the -15v talk battery source. Type in your readings in the appropriate blanks below: 2 (Circuit on) ______________ vdc TP2 (Circuit off) ______________ vdc TP4 (Circuit on) ______________ vdc TP4 (Circuit off) ______________ vdccc"], "jumps": ["P3740"]}, {"id": "P3751", "text": ["1. Press Enter to return all controls to their initial control settings.", "1. Return all controls to their initial control settings."], "jumps": []}, {"id": "P3757", "text": ["Your readings should have been:............................"], "jumps": []}, {"id": "P3760", "text": ["1. Press Enter to return all controls to their initial control settings..."], "jumps": []}, {"id": "P3770", "text": ["3. Carefully remove PC130-338 card from test console.", "2. Carefully remove PC130-338 card from test console.", "2. Disconnect the test equipment from the circuit.d rtund turn 1. Return all controls to their initial control settings. 19. Remove the red and black test leads from the circuit and turn off test equipment."], "jumps": []}, {"id": "P3780", "text": ["2. Carefully remove PC130-338 card from test console.ve PC130-2 card."], "jumps": []}, {"id": "P3790", "text": ["4. Set the test console Power OFF..h to OFF. C switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": []}, {"id": "P3792", "text": ["5. Return all equipment to its proper storage area.. C switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": []}, {"id": "P3800", "text": [], "jumps": []}, {"id": "P3801", "text": [], "jumps": []}, {"id": "P3910", "text": ["This c let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
