const book = {"title": "93955206", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supportingprograms may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .............................."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: FEEDBACK CONTROL OF DC MOTORSasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Measure the drive signal in a closed loop motor system. w Verify proper feedback control of a DC motor.......", "w Describe a typical closed loop feedback controlled motor system. w Discuss closed loop systems (simple block diagrams)."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "3. Nida Model 280 Rotating Machinery Trainer", "6. Nida Model 414 Variac timeterXXXXXXXXXXnt"], "jumps": []}, {"id": "P302", "text": ["7. (2) Nida Model 488 Digital Multimeter"], "jumps": []}, {"id": "P330", "text": ["Nida Model 280 Rotating Machinery Trainer"], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P341", "text": [], "jumps": []}, {"id": "P350", "text": [], "jumps": ["P"]}, {"id": "P360", "text": [], "jumps": []}, {"id": "P361", "text": [], "jumps": []}, {"id": "P362", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will be introduced to feedback control of DC motors."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["You will learn how feedback controls are used and why."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["You will measure the drive signal to a DC motor for various loads."], "jumps": ["P430", "P400", "PP"]}, {"id": "P430", "text": ["You will experimentally verify feedback control of a DC motor."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["Let's begin the lesson on FEEDBACK CONTROL OF DC MOTORS....................."], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Most motors are required to deliver a constant output RPM, regardless of shaft load."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["A loaded DC motor exhibits a reduced output of RPM."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["A loaded motor produces more torque and less CEMF.........."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["To maintain a steady output RPM, the loaded DC motor must have an increased input voltage."], "jumps": ["P1052", "P1040"]}, {"id": "P1052", "text": ["If the load decreases, the input voltage must be reduced to keep the RPM constant."], "jumps": ["P1054", "P1050"]}, {"id": "P1054", "text": ["In other words, a changing load on a DC motor requires a changing input voltage to keep RPM constant."], "jumps": ["P1060", "P1050"]}, {"id": "P1060", "text": ["How is a changing input voltage sent to the motor?........."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["One method is to use a time control circuit................"], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["This requires you to adjust the circuit as the load changes."], "jumps": ["P1082", "P1070"]}, {"id": "P1082", "text": ["The process is simple for human control and is called a feedback system."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["The block diagram shows a typical human feedback system...."], "jumps": ["P1100", "P1082"]}, {"id": "P1100", "text": ["A tachometer might be used to display motor RPM. nsor (Tachometer)"], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["You could then decide if the motor RPM is correct, too slow, or too fast."], "jumps": ["P1120", "P1090"]}, {"id": "P1120", "text": ["If the motor's RPM is too slow or too fast, adjustments to the speed control circuit are made."], "jumps": ["P1130", "P1090"]}, {"id": "P1130", "text": ["The changed voltage output of the speed control circuit causes the motors RPM to change."], "jumps": ["P1132", "P1090"]}, {"id": "P1132", "text": ["Consequently, the sensor indicates a different RPM and you observe the results and make additional adjustments if necessary."], "jumps": ["P1134", "P1090"]}, {"id": "P1134", "text": ["The process continues until the motor is turned off."], "jumps": ["P1136", "P1090"]}, {"id": "P1136", "text": ["The system is a feedback system since the output from the motor has an effect on its input."], "jumps": ["P1140", "P1090"]}, {"id": "P1140", "text": ["This system is inefficient since a person is needed to make the feedback system work."], "jumps": ["P1150", "P1090"]}, {"id": "P1150", "text": ["A complete electronic feedback control circuit is much more desirable."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["In the \"human operator\" feedback circuit, the operator receives direct input from _______"], "jumps": ["P1140"]}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1162", "text": ["The motor's output signal is received by the operator indirectly."], "jumps": []}, {"id": "P1163", "text": ["The speed control circuitry receives an input from the operator."], "jumps": []}, {"id": "P1170", "text": ["An electronic feedback system eliminates the human, but still operates the same."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["An electronic comparator is used in place of a human operator."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["The comparator \"compares\" the feedback signal from the motor to some predetermined base motor speed."], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["If the feedback signal is larger than the base speed signal, the comparator sends a negative signal to the motor drive circuit."], "jumps": ["P1210", "P1170"]}, {"id": "P1210", "text": ["This negative signal tells the motor drive circuit to reduce the input signal to the motor, slowing the motor down."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["If the feedback signal is smaller than the base speed signal, the comparator sends a positive signal to the motor drive circuit."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["This positive signal tells the motor drive circuit to increase the input signal to the motor, speeding the motor up."], "jumps": ["P1233", "P1220"]}, {"id": "P1233", "text": ["The speed of the motor is held constant without human intervention. DC Motor Sensor 1. No Charge 1. 0 (Tachometer) 1. 500 RPM 2. Increase 2. + 2. 400 RPM 3. Decrease 3. - 3. 600 RPM Motor Drive Comparator 500 RPM Circuit", "1. 500 RPM 2. 400 RPM 3. 600 RPM 500 RPM"], "jumps": ["P1235", "P1230"]}, {"id": "P1235", "text": ["In the next lesson, you will learn the circuits associated with a feedback system."], "jumps": ["P1240", "P1233"]}, {"id": "P1240", "text": ["Which component in the electronic feedback system replaces the human operator in the human controlled feedback system?"], "jumps": ["P1233"]}, {"id": "P1241", "text": [], "jumps": []}, {"id": "P1242", "text": ["The DC motor is common to both types of controllers........"], "jumps": []}, {"id": "P1243", "text": ["The motor drive circuit is the same as the speed control circuitry."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on THEORY OF OPERATION......"], "jumps": ["P1001", "P1240"]}, {"id": "P1920", "text": ["1. Feedback circuits are designed to maintain a constant DC motor RPM regardless of motor shaft load."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. Feedback circuits utilize the motors output to determine the input voltage to the motor."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. A human controlled feedback system utilizes a person making decisions."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. An electronic feedback system incorporates an electronic comparator in place of a human operator."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. The comparator \"compares\" the motor's feedback signal to a predetermined base motor speed."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6. The comparator sends a \"weighted\" signal to the motor drive circuit."], "jumps": ["P1980", "P1950"]}, {"id": "P1980", "text": ["7. The motor drive circuit controls the input signal to the DC motor."], "jumps": ["P1999", "P1950"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1950"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["In this experiment, you will measure the input voltage and current to a DC motor from a feedback circuit."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["These measurements will verify basic feedback control principles."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["You will use the DC motor control experiment card (PC130-281) in this experiment."], "jumps": ["P2060", "P2030", "PC130"]}, {"id": "P2060", "text": ["Let's begin the experiment. 1. Set the 280 trainer to it's initial control settings."], "jumps": ["P2070", "P2040", "P22000"]}, {"id": "P2070", "text": ["2. Set the Test Console controls to their initial control settings........"], "jumps": ["P2060"]}, {"id": "P2080", "text": ["3. Place the 130 power supply controls as follows:C Filament - ON - Supply Voltage - 12 V + Supply Voltage - 12 V", "3. Press enter to set the 130E Test Console controls as follows: ntrols as follows: t.......... ON + Power Supply... 24 Volts - Power Supply....15 Volts"], "jumps": []}, {"id": "P2090", "text": ["Isolate the AC motor from the Variac input by placing the AC LINE METER switch to IN. PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": []}, {"id": "P2094", "text": ["Configure the DC motor for a Series Field. Switch Settings RUN/STOP - Run OPER/TEST - OPER SERIES FIELD - IN DYNAMIC BRAKE - IN"], "jumps": ["P2100", "P"]}, {"id": "P2100", "text": ["4. Insert PC130-281 into the PC2 position on the 130 test console."], "jumps": ["P2110", "P2094"]}, {"id": "P2110", "text": ["5. Insert PC130-280 into the PC3 position on the 130 test console."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["6. Connect the 2 pin interconnect from the PC130-281 experiment card to the PC130-286 connector located on the rear of the 280 trainer."], "jumps": ["P2110", "P2130", "P", "P1"]}, {"id": "P2130", "text": ["7. Connect the 8 pin connector from the PC130-280 card to the PC130-280 connector on the 280 trainer. 80 Trainer 130A Test ConsoleON........................................."], "jumps": ["P2120", "P2140", "P", "P1"]}, {"id": "P2140", "text": ["8. Connect the 2 Pin Jack cable from the output jacks of the Variac to the 115 VAC input jacks located on the AC subpanel of the 280 trainer. 280 Trainer Variac"], "jumps": ["P2150", "P2120"]}, {"id": "P2150", "text": ["9. Adjust the % line control of the variac for 75%........"], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["10. Set R12 on PC130-281 fully clockwise.................."], "jumps": ["P2170", "P2150", "P2165"]}, {"id": "P2165", "text": ["MEASUREMENT SETUP - Set R12 on PC130-281 fully clockwise."], "jumps": []}, {"id": "P2170", "text": ["11. Connect an AC voltmeter across test points E and F on the 280 trainer. This is the applied voltage to the DC motor."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["12. Set the DC meter switch to IN and connect an AC ammeter 1A or higher range across the meter jacks."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["13. Press Enter to set PC2 and PC3 DC Power - ON.", "13. Set PC2 and PC3 DC Power switches to ON.", "13. Press Enter to set PC2 and PC3 DC Power - ON. Set PC2 and PC3 DC POWER switches to ON."], "jumps": ["P2180"]}, {"id": "P2200", "text": ["14. Apply power to the variac. Motor action should begin. *If the motor does not start, turn the \"RUN/STOP\" switch on the 280 trainer to \"STOP\" and then back to \"RUN\"......"], "jumps": ["P2210"]}, {"id": "P2210", "text": ["You have constructed a universal DC motor with PC130-281 serving as the controlling circuitry."], "jumps": ["P2212", "P2200"]}, {"id": "P2212", "text": ["15. Vary R12 on PC130-281. R12 sets the base RPM of the DC motor.. motor."], "jumps": ["P2213", "P2210"]}, {"id": "P2213", "text": ["The comparator on PC130-281 compares the setting of R12 with the TACH output of the motor. The output of the comparator reads a 360 time control circuit that drives the DC motor."], "jumps": ["P2214", "P2210"]}, {"id": "P2214", "text": ["16. Set R12 toward the mid-position, or as required to achieve a 3-volt decrease...on the ammeter reading."], "jumps": ["P2215", "P2210"]}, {"id": "P2215", "text": ["17. Enter the measured voltage AC and current as shown on the meters.swer in variable."], "jumps": ["P2210"]}, {"id": "P2216", "text": [], "jumps": []}, {"id": "P2217", "text": ["Your measured values are not in the acceptable limits. Ensure both meters are set to AC measurements."], "jumps": []}, {"id": "P2218", "text": ["You still have not entered the correct values. You should have measured around 32V at 0.4 A."], "jumps": ["P2220", "P2215"]}, {"id": "P2220", "text": ["18. Slowly rotate the dynamic brake potentiometer CW while observing your meters."], "jumps": ["P2230", "P2215"]}, {"id": "P2230", "text": ["What happened to the input voltage to the motor?..........."], "jumps": ["P2220"]}, {"id": "P2231", "text": [], "jumps": []}, {"id": "P2232", "text": ["The input voltage should increase. This is due to the feedback controller, PC130-281."], "jumps": []}, {"id": "P2237", "text": ["What happened to the input current to the motor?..........."], "jumps": ["P2230"]}, {"id": "P2238", "text": [], "jumps": []}, {"id": "P2239", "text": ["The input current should increase. This is due to the feedback controller, PC130-281."], "jumps": []}, {"id": "P2240", "text": ["With an increased load, the feedback controller increased the input signal strength in an attempt to maintain DC motor output shaft RPM."], "jumps": ["P2245", "P2237"]}, {"id": "P2245", "text": ["Although RPM decreased when the Dynamic Brake increased beyond a certain point. The feedback circuit increased voltage and current."], "jumps": ["P2250", "P2240"]}, {"id": "P2250", "text": ["19. Set the dynamic brake potentiometer fully CCW........."], "jumps": ["P2260", "P2245"]}, {"id": "P2260", "text": ["20. Slowly adjust the % line voltage from the variac between 70 and 80% while monitoring the voltage and current meters."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["With a varying input voltage to the control circuit what happened to the motors input voltage, current and RPM?"], "jumps": ["P2260"]}, {"id": "P2271", "text": [], "jumps": []}, {"id": "P2272", "text": ["The motors input voltage, current and RPM should remain constant unless the % line voltage was reduced enough to force the motor to stall."], "jumps": []}, {"id": "P2280", "text": ["With the input voltage varying, the controller circuitry compensated to maintain a fixed voltage to the DC motor."], "jumps": ["P2287", "P2270"]}, {"id": "P2287", "text": ["As you can see, a Feedback let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
