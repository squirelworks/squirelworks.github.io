operty..."], "jumps": ["P3230", "P3250"]}, {"id": "P3250", "text": ["The Distributive Property states that when multiplying a Real Number by a set of Real Numbers it is the same as multiplying the Real Number by each member of the set."], "jumps": ["P3240", "P3260"]}, {"id": "P3260", "text": ["Here are examples of the Distributive Property............."], "jumps": ["P3240", "P3280"]}, {"id": "P3280", "text": ["Which statement represents the Inverse Property?..........."], "jumps": ["P3260"]}, {"id": "P3281", "text": [], "jumps": []}, {"id": "P3282", "text": ["A + 0 = A is the Identity Property. The Identity Property states adding 0 to a Real Number equals the original number and multiplying a Real Number by 1 equals the original number."], "jumps": []}, {"id": "P3283", "text": ["A(B + C) = AB + AC is the Distributive Property. The Distributive Property states that when multiplying a Real Number by a set of Real Numbers it is the same as multiplying the Real Numbers individually."], "jumps": []}, {"id": "P3290", "text": ["Which property is A(1) = A? typed.........................."], "jumps": ["P3280"]}, {"id": "P3291", "text": [], "jumps": []}, {"id": "P3060", "text": ["Look at this example of the Closure Property..............."], "jumps": ["P3040"]}, {"id": "P3070", "text": ["The second property is called the Commutative Property....."], "jumps": ["P3060"]}, {"id": "P3080", "text": ["The Commutative Property states that the order in which certain operations are performed will not alter results."], "jumps": ["P3070"]}, {"id": "P3090", "text": ["These are examples of the Commutative Property............."], "jumps": ["P3070"]}, {"id": "P3100", "text": ["The third property is the Associative Property............."], "jumps": ["P3090"]}, {"id": "P3110", "text": ["The Associative Property states that the order in which the numbers are grouped will not alter the results."], "jumps": ["P3100"]}, {"id": "P3120", "text": ["Look at these examples. here..............................."], "jumps": ["P3100"]}, {"id": "P3130", "text": ["Which property does AB = BA represent?....................."], "jumps": ["P3120"]}, {"id": "P3131", "text": [], "jumps": []}, {"id": "P3132", "text": ["The Closure Property states that when Real Numbers are added or multiplied the result is a Real Number."], "jumps": []}, {"id": "P3133", "text": ["The Associative Property states that the order in which the numbers are grouped will not alter the results."], "jumps": []}, {"id": "P3140", "text": ["Which property is (A+B)+C = A+(B+C)?......................."], "jumps": ["P3130"]}, {"id": "P3141", "text": [], "jumps": []}, {"id": "P3142", "text": ["The Closure Property states that when Real Numbers are added or multiplied the result is a Real Number."], "jumps": []}, {"id": "P3143", "text": ["The Commutative Property states that the order of certain operations will not alter the result."], "jumps": []}, {"id": "P3150", "text": ["Remember these propertiesere..............................."], "jumps": ["P3140", "P3160"]}, {"id": "P2472", "text": ["You added 3x and 2x to get 5x. The expression states to multiply 3x by 2x."], "jumps": []}, {"id": "P2473", "text": ["You subtracted 2x from 3x to get 1x. The expression states to multiply 3x by 2x."], "jumps": []}, {"id": "P2480", "text": ["What is the result when combining these variables? 3z/z . 2z"], "jumps": ["P2470"]}, {"id": "P2481", "text": [], "jumps": []}, {"id": "P2482", "text": ["You multiplied 3 times 2 to get 6, you should multiply 3 times 2z."], "jumps": []}, {"id": "P2483", "text": ["You multiplied 3z times 2z. Notice that 3z is divided byz.."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on MATH OPERATIONS.E........"], "jumps": ["P2480", "P2001"]}, {"id": "P2920", "text": ["1. Numerical Expressions are a series of Real Numbers that are added, subtracted, multiplied, divided, or raised to exponential powers."], "jumps": ["P2001", "P2930"]}, {"id": "P2930", "text": ["2. Numerical expressions are reduced by using the Order of Operations..."], "jumps": ["P2920", "P2940"]}, {"id": "P2940", "text": ["3. Only like variables can be added and subtracted........"], "jumps": ["P2930", "P2950"]}, {"id": "P2950", "text": ["4. Unlike variables can be multiplied and divided.........."], "jumps": ["P2940", "P2999"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu..."], "jumps": ["P2950", "P2001"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3010", "text": ["Before solving algebra problems, there are some basic rules and properties you must know."], "jumps": ["P3001", "P3040"]}, {"id": "P3040", "text": ["The first property is called the Closure Property.........."], "jumps": ["P3010"]}, {"id": "P3050", "text": ["The Closure Property states that when Real Numbers are added or multiplied the result is a Real Number."], "jumps": ["P3040"]}, {"id": "P2371", "text": [], "jumps": []}, {"id": "P2372", "text": ["You added all the x's. Notice x is added to 4x and then 2x is subtracted."], "jumps": []}, {"id": "P2373", "text": ["You subtracted x and 2x from 4x. Notice x and 4x are added and the 2x is subtracted."], "jumps": []}, {"id": "P2380", "text": ["What is the result of this equation? - 5y + 2x + 6y......."], "jumps": ["P2370"]}, {"id": "P2381", "text": [], "jumps": []}, {"id": "P2382", "text": ["You tried to combine x and y. Remember, x and y represent different Real numbers and cannot be combined."], "jumps": []}, {"id": "P2390", "text": ["Variables can be multiplied and divided...................."], "jumps": ["P2380", "P2400"]}, {"id": "P2400", "text": ["When multiplying and dividing, unlike variables can be combined."], "jumps": ["P2390", "P2410"]}, {"id": "P2410", "text": ["Multiplying variables creates exponents...................."], "jumps": ["P2400", "P2420"]}, {"id": "P2420", "text": ["Let's substitute 2 for Y and check the results."], "jumps": ["P2410", "P2440"]}, {"id": "P2440", "text": ["Dividing a variable by itself eliminates the variable......"], "jumps": ["P2410", "P2450"]}, {"id": "P2450", "text": [], "jumps": ["P2440", "P2460"]}, {"id": "P2460", "text": ["Understanding how variables are combined is essential to solving algebraic equations."], "jumps": ["P2440", "P2470"]}, {"id": "P2470", "text": ["What is the result when combining this expression? (2x)..."], "jumps": ["P2440"]}, {"id": "P2471", "text": [], "jumps": []}, {"id": "P2190", "text": ["This is another example of step 2.........................."], "jumps": ["P2170", "P2200"]}, {"id": "P2200", "text": ["The third step is multiplying and dividing from left to right."], "jumps": ["P2190", "P2230"]}, {"id": "P2230", "text": ["The fourth step is to add and subtract from left to right.."], "jumps": ["P2200", "P2250"]}, {"id": "P2250", "text": ["Remember, the order of operations are parentheses, exponents, multiplying / dividing, and subtracting / adding."], "jumps": ["P2230", "P2260"]}, {"id": "P2260", "text": ["Which operation would exponents be performed after?........"], "jumps": ["P2250"]}, {"id": "P2261", "text": [], "jumps": []}, {"id": "P2262", "text": ["Remember the order of operations..........................."], "jumps": []}, {"id": "P2270", "text": ["Which expression would be reduced first?..................."], "jumps": ["P2260"]}, {"id": "P2271", "text": [], "jumps": []}, {"id": "P2272", "text": ["Operations in brackets are not performed before operations in parentheses. Remember to work from the inside out."], "jumps": []}, {"id": "P2273", "text": ["Operations in parentheses or brackets are performed prior to addition."], "jumps": []}, {"id": "P2280", "text": ["Combining variables is essential for solving algebra problems. Let's discuss how to add and subtract them first."], "jumps": ["P2270", "P2290"]}, {"id": "P2290", "text": ["Remember each different variable represents a different number. This is why only like variables can be combined."], "jumps": ["P2280", "P2320"]}, {"id": "P2320", "text": ["If x equals 2 then the x term equals 14."], "jumps": ["P2290", "P2350"]}, {"id": "P2350", "text": ["Like variables can also be subtracted......................"], "jumps": ["P2290", "P2370"]}, {"id": "P2370", "text": ["What is the result of this equation? x + 4x - 2x......."], "jumps": ["P2350"]}, {"id": "P2040", "text": ["Which symbol represents addition?.........................."], "jumps": ["P2020"]}, {"id": "P2041", "text": [], "jumps": []}, {"id": "P2042", "text": ["The symbol - represents subtraction......................"], "jumps": []}, {"id": "P2043", "text": ["The symbol x represents multiplication....................."], "jumps": []}, {"id": "P2050", "text": ["Numerical Expressions are a series of Real Numbers that are added, subtracted, multiplied, divided, or raised to exponential powers."], "jumps": ["P2040", "P2070"]}, {"id": "P2070", "text": ["Which statement describes this Numerical Expression?(2)(3) + 5"], "jumps": ["P2050"]}, {"id": "P2071", "text": [], "jumps": []}, {"id": "P2072", "text": ["Two plus three equals five is written:....................."], "jumps": []}, {"id": "P2073", "text": ["Two plus three times five is written:......................"], "jumps": []}, {"id": "P2090", "text": ["Order is important. Without a sequence for solving the problem this equation would have 2 answers."], "jumps": ["P2070", "P2100"]}, {"id": "P2100", "text": ["To solve a Numerical Expression, you must perform math operations from left to right in a specific order."], "jumps": ["P2090", "P2110"]}, {"id": "P2110", "text": ["First perform all operations in parentheses."], "jumps": ["P2100", "P2150"]}, {"id": "P2150", "text": ["When parentheses and brackets are both used in an equation, perform operations in parentheses first and operations in brackets next."], "jumps": ["P2100", "P2170"]}, {"id": "P2170", "text": ["The second step is to perform operations indicated by exponents."], "jumps": ["P2150", "P2190"]}, {"id": "P1950", "text": [". . . - 4, -3, -2, -1, 0, 1, 2, 3, 4 . . . etc.", "5. Integers include 0, negative numbers, and positive numbers, but fractions are not included.."], "jumps": ["P1940", "P1960"]}, {"id": "P1960", "text": ["6. A rational number can be written as a fraction where the denominator is any integer other than zero and the numerator is any integer..."], "jumps": ["P1950", "P1970"]}, {"id": "P1970", "text": ["7. Rational numbers have terminal or repeating decimals and rational roots."], "jumps": ["P1960", "P1973"]}, {"id": "P1973", "text": ["8. Irrational numbers do not end or repeat................"], "jumps": ["P1960", "P1980"]}, {"id": "P1980", "text": ["9. In algebra, letters represent real numbers. 10. In General Equations, the letters at the beginning of the alphabet normally represent constants.."], "jumps": ["P1973", "P1990"]}, {"id": "P1990", "text": ["11. Letters at the end of the alphabet normally represent variables."], "jumps": ["P1980", "P1999"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu..."], "jumps": ["P1990", "P1001"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["Math operations used by Real Numbers are addition, subtraction, multiplication, and division."], "jumps": ["P2001", "P2030"]}, {"id": "P2025", "text": ["ADDITION - Addition is represented by the + symbol. It means to combine numbers. The result is called a sum."], "jumps": []}, {"id": "P2026", "text": ["SUBTRACTION - Subtraction is represented by the - symbol. It means to find the difference between numbers."], "jumps": []}, {"id": "P2027", "text": ["MULTIPLICATION - Multiplication can be represented by an X, ( ), or", ". It indicates how many times a number is added. The result is called a product."], "jumps": []}, {"id": "P2028", "text": ["DIVISION - Division can be represented by", ", , or . It indicates how many times a number can be separated by another number. The result is called a quotient."], "jumps": []}, {"id": "P2030", "text": ["These operations are represented by symbols."], "jumps": ["P2020", "P2040"]}, {"id": "P1500", "text": ["Which numbers/letters in this equation are constants? + 3x + 4y = 12z"], "jumps": ["P1490"]}, {"id": "P1501", "text": [], "jumps": []}, {"id": "P1502", "text": ["X, Y, and Z are letters used to represent numbers and are called variables."], "jumps": []}, {"id": "P1503", "text": ["3, 4, and 12 are constants but, there is one more constant in the equation."], "jumps": []}, {"id": "P1510", "text": ["Which numbers/letters in this equation are variables? + x + y = 122"], "jumps": ["P1500"]}, {"id": "P1511", "text": [], "jumps": []}, {"id": "P1512", "text": ["You chose 8 and 12. The numbers 8 and 12 are not variables, they are called constants."], "jumps": []}, {"id": "P1513", "text": ["X is a variable but, there is one more variable in the equation."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on REAL NUMBERS.ITLE........"], "jumps": ["P1510", "P1001"]}, {"id": "P1920", "text": ["1. The set of real numbers includes the rational and irrational numbers......."], "jumps": ["P1001", "P1930"]}, {"id": "P1930", "text": ["2. There are 3 different types of numbers included in the set of rational numbers..."], "jumps": ["P1920", "P1940"]}, {"id": "P1940", "text": ["3. Natural numbers start with 1 and go to infinity. 4. Whole numbers are natural numbers including 0."], "jumps": ["P1920", "P1950"]}, {"id": "P1270", "text": ["What type of number is - 4??typed.........................."], "jumps": ["P1260"]}, {"id": "P1271", "text": [], "jumps": []}, {"id": "P1272", "text": ["Natural numbers are the numbers from 1 to infinity. They do not include 0 or negative numbers."], "jumps": []}, {"id": "P1273", "text": ["Whole numbers contain natural numbers 1 to infinity and 0. They do not include negative numbers."], "jumps": []}, {"id": "P1360", "text": ["In algebra, letters are used to represent numbers. These letters are called Constants and Variables."], "jumps": ["P1270", "P1400"]}, {"id": "P1380", "text": ["The letters at the end of the alphabet normally represent Variables. Each letter signifies a different number."], "jumps": ["P1360", "P1390"]}, {"id": "P1390", "text": ["A+BX=C expresses a type of equation and is called a General Equation. You would not be expected to solve this equation."], "jumps": ["P1395", "P1360", "P1410"]}, {"id": "P1395", "text": ["EQUATION - An equation expresses the relationship between numbers."], "jumps": []}, {"id": "P1400", "text": ["Normally, letters at the beginning of the alphabet represent constants."], "jumps": ["P1360", "P1380"]}, {"id": "P1410", "text": ["By putting values in for A, B and C the equation can now be solved. Normally X is the unknown value."], "jumps": ["P1390", "P1420"]}, {"id": "P1420", "text": ["The real numbers 2, 3, and 11 are constants and the letter X is the variable."], "jumps": ["P1410", "P1430"]}, {"id": "P1430", "text": ["Notice that 3X indicates multiplication. 3X is a shorthand method of showing 3 x X or (3)(X) and is used throughout algebra."], "jumps": ["P1410", "P1440"]}, {"id": "P1440", "text": ["The shorthand method is only used when multiplying variables."], "jumps": ["P1410", "P1490"]}, {"id": "P1490", "text": ["1. 1 + 3X = 7 2. 3X = 7 - 1 3. X = 6", "Algebra is the process of solving for a variable..........."], "jumps": ["P1410", "P1500"]}, {"id": "P1210", "text": ["Let's look at irrational numbers..........................."], "jumps": ["P1205", "P1220"]}, {"id": "P1220", "text": ["Irrational numbers do not end or repeat...................."], "jumps": ["P1210", "P1225"]}, {"id": "P1225", "text": ["Irrational numbers include radicals whose roots are not rational numbers."], "jumps": ["P1220", "P1230"]}, {"id": "P1230", "text": ["The prime example of an irrational number is the number pi (p )."], "jumps": ["P1225", "P1240"]}, {"id": "P1240", "text": ["Computers have calculated pi out to over 1 billion places."], "jumps": ["P1230", "P1250"]}, {"id": "P1250", "text": ["Remember, all these numbers are real numbers..............."], "jumps": ["P1230", "P1260"]}, {"id": "P1260", "text": ["Which number is a natural number?.........................."], "jumps": ["P1250"]}, {"id": "P1261", "text": [], "jumps": []}, {"id": "P1262", "text": ["Negative numbers are integers and are not included in natural numbers."], "jumps": []}, {"id": "P1263", "text": ["Zero is part of whole numbers and is not a natural number.."], "jumps": []}, {"id": "P1090", "text": ["Whole numbers are natural numbers (1 to infinity) and the number 0. Negative numbers and fractions are not included."], "jumps": ["P1080", "P1120"]}, {"id": "P1120", "text": ["Let's look at the next type of rational number called integers."], "jumps": ["P1090", "P1130"]}, {"id": "P1130", "text": [". . . - 4, -3, -2, -1, 0, 1, 2, 3, 4 . . . etc.", "Integers includes positive numbers, negative numbers and zero. Fractions are not included."], "jumps": ["P1120", "P1140"]}, {"id": "P1140", "text": ["Now let's look at rational numbers........................."], "jumps": ["P1130", "P1150"]}, {"id": "P1150", "text": ["A rational number can be written as a fraction where the denominator is any integer other than zero and the numerator is any integer."], "jumps": ["P1140", "P1160"]}, {"id": "P1160", "text": ["Rational numbers have terminal or repeating decimals."], "jumps": ["P1150", "P1200"]}, {"id": "P1162", "text": ["Rational numbers have terminal or repeating decimals......."], "jumps": ["P1150", "P1200"]}, {"id": "P1165", "text": ["TERMINAL DECIMALS - A terminal decimal is a number that has an end. A terminal decimal results when the division used to convert a fraction reaches a remainder of zero."], "jumps": []}, {"id": "P1166", "text": ["REPEATING DECIMALS - A repeating decimal results when the division used to convert a fraction reaches a point where a digit or sequence of digits continues to repeat."], "jumps": []}, {"id": let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
