esents a time value. trace to move across one division (sweep time)."], "jumps": []}, {"id": "P4320", "text": ["The display grid has a screen marked off with lines called divisions. The divisions on the display grid are used to measure the time and amplitude (voltage) of waveforms."], "jumps": []}, {"id": "P4310", "text": ["This section consists of a display area that has a grid and menu area. Some of these have already been covered."], "jumps": []}, {"id": "P4300", "text": ["The next major functional section is the DISPLAY section. It graphically shows the input waveforms."], "jumps": []}, {"id": "P4293", "text": ["Which ever channel is selected, the flag and the corresponding number will be filled solidly with color. While the other channel is not solidly filled."], "jumps": []}, {"id": "P4292", "text": [], "jumps": []}, {"id": "P4291", "text": ["How do you identify which channel has been selected?using an oscilloscope????", "The numbered flag at the far left is solid in color."], "jumps": ["P4290"]}, {"id": "P4290", "text": ["The output section of the oscilloscope mainly consists of the disk drive and the print button. Many of the signals can be printed out directly to a printer or saved to the disk drive...."], "jumps": []}, {"id": "P4280", "text": ["The menu that contains the arithmetic operations will perform the particular function that is selected. The \"+\" selection will add the two signals, the \"-\" will subtract the two signals and so on."], "jumps": []}, {"id": "P4270", "text": ["Pressing the MATH button will show a third signal displayed in red. Again, a flag to the far left is displayed showing the selection. Notice the menu has changed again."], "jumps": []}, {"id": "P4260", "text": ["Repeat the process for the CH2 probe, by pressing the CH2 button, select 1 MW impedance, and then by pressing the AUTOSET button. If the display is distorted make the necessary adjustment....."], "jumps": []}, {"id": "P4250", "text": ["The displayed signal should be a 5 Vpp 1 kHz square wave. If the displayed signal is distorted use an adjustment tool to flatten the signals removing the distortion."], "jumps": []}, {"id": "P4240", "text": ["Ensure that the Impedance menu is set to 1 MW by pressing the button directly below the menu. It will toggle back and forth between the 1 M and 50 ohm selection. Pressing the AUTOSET button in the ACQUIRE control section will stabilize the display..............."], "jumps": []}, {"id": "P4235", "text": ["PROBE COMPENSATION - The act of adjusting electronic components or devices to a reference (usually a voltage or frequency). To calibrate an oscilloscope probe is to adjust internal components of the probe so that the output waveform is exactly the same as the input waveform.put waveform."], "jumps": []}, {"id": "P4230", "text": ["To begin the probe compensation connect one end of the 10X probe to CH1 front panel connector and the other end to the PROBE COMP connectors...."], "jumps": ["P4220"]}, {"id": "P4221", "text": ["DISTORTION - Distortion is the changing of a waveform from its original shape. For example, this display waveform is distorted."], "jumps": ["P4220"]}, {"id": "P4220", "text": ["The probe compensation is very important. It needs to be performed each time a probe is connected to a channel input. Performing the probe compensation will eliminate the distortion of the input signal..."], "jumps": []}, {"id": "P4210", "text": ["Some probes allow for probe compensation adjustments, also known as probe calibration.."], "jumps": []}, {"id": "P4200", "text": ["The two probes for this oscilloscope are X1 and X10 probe. The type of connections and the writing on the side can identify between probes. The retractable pin coming from the bottom of the 10X probe usually means it is auto- sensing. So, the displayed voltages on the screen will automatically be converted......"], "jumps": []}, {"id": "P4190", "text": ["Ensure you are using the probes provided by the manufacturer of the oscilloscope you are using."], "jumps": []}, {"id": "P4180", "text": ["Some probes can be switched between X1 and X10. Always check the position of the switch if you are using one of these probes."], "jumps": []}, {"id": "P4170", "text": ["A X10 probe is called a 10 to 1 probe. If the voltage measured on the oscilloscope indicates 10 volts, the voltage in the circuit is 100 volts."], "jumps": []}, {"id": "P4160", "text": ["A X1 probe is called a 1 to 1 probe. If the voltage measured on the oscilloscope indicates 10 volts, the voltage in the circuit is 10 volts.."], "jumps": []}, {"id": "P4150", "text": ["Oscilloscope probes come in a variety of types. They are the conduit that connects the circuit to the oscilloscope."], "jumps": []}, {"id": "P4140", "text": ["Since CH 2 is selected notice that the yellow flag is no longer solid yellow. Pressing either the CH1 or CH2 buttons and the corresponding flag will show which is the selected channel..."], "jumps": []}, {"id": "P4130", "text": ["Pressing the blue CH2 button will show a blue signal trace on the display grid. To the far left of the blue trace a blue flag will appear with the number 2. The solid blue flag denotes the selection of CH2. You are now viewing a dual channel display....."], "jumps": []}, {"id": "P4120", "text": ["Pressing the yellow CH1 button will show a yellow signal trace on the display grid. To the far left of the yellow trace a yellow flag will appear with the number 1 inside. The solid yellow flag denotes the selection of CH1. Press the Quickmenu button to bring up the expanded menu options.................."], "jumps": []}, {"id": "P4110", "text": ["There are input connectors for each channel of the oscilloscope. One probe can be connected to CH1 and another to CH2..."], "jumps": []}, {"id": "P4100", "text": ["The input section is used to provide signals to the oscilloscope. It consists of front panel input connectors, selection buttons and probes."], "jumps": []}, {"id": "P4090", "text": ["Pressing the oltage in the circuit is 100 volts."], "jumps": ["P2070", "P2100"]}, {"id": "P2080", "text": ["A X1 probe is called a 1 to 1 probe. If the voltage measured on the oscilloscope indicates 10 volts, the voltage in the circuit is 10 volts.."], "jumps": ["P2070", "P2090"]}, {"id": "P2070", "text": ["Oscilloscope probes come in a variety of types. In general, their purpose is the same: to connect the oscilloscope to a circuit.it."], "jumps": ["P2080", "P2040"]}, {"id": "P2063", "text": ["When the Display Mode switch is set to ADD channel 1 is added to channel 2, and the result is displayed.sult of adding channel 1 to channel 2.displays the result of adding channel 1 to channel 2..."], "jumps": ["P2070", "P2040"]}, {"id": "P2062", "text": ["Setting the Display Mode switch to DUAL displays both channels, CH 1 and CH2. nd ADD displays the result of adding channel 1 to channel 2.ADD displays the result of adding channel 1 to channel 2..."], "jumps": ["P2063", "P2040"]}, {"id": "P2060", "text": ["The DISPLAY MODE switch is used to select the input channel or channels that will be shown on the display. AL displays both channels and ADD displays the result of adding channel 1 to channel 2..."], "jumps": ["P2062", "P2040"]}, {"id": "P2050", "text": ["There are input connectors for each channel of the oscilloscope. Notice that there are input connectors for CH 1 and CH2 on the dual trace oscilloscope. The probes are connected to the input connectors.tors."], "jumps": ["P2060", "P2040"]}, {"id": "P2040", "text": ["The input section is used to provide signals to the oscilloscope. It consists of input connectors, a display switch, and probes.."], "jumps": ["P2050", "P2020"]}, {"id": "P2030", "text": [], "jumps": ["P2040", "P2020"]}, {"id": "P2020", "text": ["Dual trace oscilloscopes have four major functional sections.", "Select the oscilloscope that most resembles the one you will be using in this lesson...????????"], "jumps": ["P2030", "P2010", "P2001", "P2020"]}, {"id": "P2001", " ously.taneously.sly.", "It is common to see single trace, dual trace, triple trace and quad trace oscilloscopes but the most commonly used oscilloscope is the dual trace..day is the analog dual trace oscilloscope.."], "jumps": ["P1180", "P1160", "P1150", "P1170", "P"]}, {"id": "P1150", "text": ["Oscilloscopes are classified by their number of channels, and bandwidth. he most popular oscilloscope in use today is the dual trace oscilloscope.oscope. the analog dual trace oscilloscope.."], "jumps": ["P1160", "P1140"]}, {"id": "P1142", "text": ["Most oscilloscopes directly measure either peak or peak to peak voltage. Average and RMS voltage values must be calculated."], "jumps": []}, {"id": "P1141", "text": [], "jumps": []}, {"id": "P1140", "text": ["What value of AC voltage does an oscilloscope directly measure?"], "jumps": ["P1130"]}, {"id": "P1134", "text": ["Multiply the number of divisions between the waveforms by 7.2", "Phase relationship of waveforms is measured on the oscilloscope when one waveform is compared to another waveform.."], "jumps": []}, {"id": "P1133", "text": ["Frequency is derived using an oscilloscope by measuring the time for one cycle and using the frequency formula."], "jumps": []}, {"id": "P1132", "text": ["Voltage can be measured on oscilloscopes by observing the peak or peak-to-peak waveform.."], "jumps": []}, {"id": "P1131", "text": [], "jumps": []}, {"id": "P1130", "text": ["Which quantity CANNOT be measured directly or derived using an oscilloscope????"], "jumps": ["P1122"]}, {"id": "P1125", "text": ["Multiply the divisions between waveforms by 7.2", "to solve for the phase relationship. 12.5 x 7.2", "DEGREES PER DIVISION - Dividing 360 degrees by the number of divisions on the grid equals 7.2 degrees per division. In this example the waveforms are approximately 12.5 divisions apart at the zero volt crossings."], "jumps": ["P1122"]}, {"id": "P1122", "text": ["and is divided into 50 divisions. Each division is equal to 7.2", ". Count the di let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
