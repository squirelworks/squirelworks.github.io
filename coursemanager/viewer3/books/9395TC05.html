const book = {"title": "9395TC05", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Title: TROUBLESHOOTING HYDRAULIC AND PNEUMATIC SYSTEMSf", "Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P10", "text": ["TROUBLESHOOTING HYDRAULIC AND PNEUMATIC SYSTEMS"], "jumps": []}, {"id": "P100", "text": ["w Recognize the symptoms of common hydraulic and pneumatic component failures. w Demonstrate component troubleshooting procedures. ommon pump failures. w Describe the basic repairs needed to restore pumps. operation. to restore pumps. operation.ion..", "1. Troubleshooting Hydraulic and Pneumatic System Componentse."], "jumps": []}, {"id": "P300", "text": ["Hydraulic and pneumatic systems have proven to be reliable in operation but when a system fails the technician must be able to complete repairs quickly and safely."], "jumps": []}, {"id": "P410", "text": ["This lesson will introduce common failures in hydraulic and pneumatic system components..ts..o discussed are common failures in hydraulic and pneumatic system components."], "jumps": []}, {"id": "P420", "text": ["Let's begin the lesson on TROUBLESHOOTING HYDRAULIC AND PNEUMATIC SYSTEMS.matic systems. Also discussed are common failures in hydraulic and pneumatic system components."], "jumps": []}, {"id": "P900", "text": ["1. TroubleshootingPneumatic System Comp."], "jumps": []}, {"id": "P1001", "text": ["TROUBLESHOOTINGPNEUMATIC SYS COMPONENTSNTSEM COMPONENTSTS", "TROUBLESHOOTINGPNEUMATIC SYS COMPOMPNENTSNTSEM COMPONENTS", "Hydraulic and pneumatic systems have several characteristics in common but also are completely different."], "jumps": ["P"]}, {"id": "P1030", "text": ["The hydraulic system uses hydraulic fluid to transfer energy from the pump through the system to perform work and then returns the fluid to a reservoir for reuse. Hydraulic fluid does not compress and the pump runs continuously with a pressure bypass circuit to keep the hydraulic fluid moving through the pump for lubrication and cooling.....", "JJJJJJ MMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMNNNNNNNNNNNNNNNNNNNNNNNNNNNNMMMMMMMMMMM JJJJJ", "JJJJJJJ MMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM", "JJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJ MMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM", "MMMMM JJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJ", "JJJJKJMMMMMMMMMMMMMMMMMMMMMMMMMMMM JJJJ", "JJJJJKJMMMMMMMMMMMMMMMMMMMMMMMMMMMM JJJJ", "LJJJJJKJMMMMMMMMMMMMMMMMMMMMMMMMMMMM JJJJ", "Air and other gases can be compressed. In a pneumatic system the pump operates to compress the air into the receiver, or storage tank, and then shuts down. The pressure in the system is used as needed and then exhausted to the atmosphere. The pump heat is dissipated using cooling fins and an internal oil reservoir provides lubrication....."], "jumps": []}, {"id": "P1050", "text": ["While many of the component parts in hydraulic and pneumatic systems perform the same function and have the same name, almost none of the parts are interchangeable. The hydraulic fluid properties are much different than the properties of air under pressure...", "Liquid hydraulic fluid cannot be compressed. The pressure applied by the hydraulic pump cannot be stored and must be bled through a bypass valve when not used by hydraulic system to perform work. The system accumulator often maintains an even pressure by utilizing a bladder of compressed gas or a spring-driven piston.........................."], "jumps": []}, {"id": "P1070", "text": ["Gases, such as air, can be pressurized. The pressurization bleeds off as the air is used by the system equipment and the pump is cycled to keep the pressure in the system between two levels. Pressure is maintained by a storage tank, the receiver, which is primarily an empty sealed container..."], "jumps": []}, {"id": "P1080", "text": ["While different in application, the problems which develop in both systems are almost the same. Both systems experience similar failures and can be troubleshot in similar manners: Leaks 2. Air or moisture in the system 3. Internal leaks and slippages"], "jumps": []}, {"id": "P1090", "text": ["Both the typical hydraulic or pneumatic systems have many components. Components are attached throughout the system using couplings and a series of pipes, tubes, and hoses. Leaks in both systems reduce the system functionality and can be dangerous to the operator and others in the area.n the area..."], "jumps": []}, {"id": "P1100", "text": ["Leaks can occur in both the suction and the discharge side of the pump. Leaks in the suction side of a pneumatic pump can allow dusty or contaminated air into the system. This could lead to pump failure, component binding, and clogged lines...", "Leaks in the suction side of a hydraulic pump allows air into the system. This could lead to pump cavitation, \"water hammers\", contamination, corrosion, dangerous equipment movement, and premature failures..."], "jumps": []}, {"id": "P1115", "text": ["WATER HAMMER - The result of a sudden change in liquid velocity. Liquid is not compressible and any energy that is applied to it is instantly felt throughout the system. This energy becomes dynamic in nature when a force such as pump cavitation pulses velocity to the fluid..."], "jumps": []}, {"id": "P1120", "text": ["Tests for leaks at the intake of a hydraulic system can be done using an eyedropper or syringe. Apply small amounts of hydraulic fluid to all joints and seams in the suction circuit and pump housing with the pump running. The leak will draw the fluid into the system at the faulty joint..."], "jumps": ["P1110"]}, {"id": "P1130", "text": ["Leaks on the suction side of a pneumatic system using air as the fluid medium are usually due to a damaged or missing air cleaner at the intake. Never allow operation of a pneumatic system without a working air filter..."], "jumps": []}, {"id": "P1140", "text": ["Leaks in the system on the pressure side can usually be spotted or heard. Hydraulic fluid in an uncommon area or puddles of fluid in an unusual area are signs of leaking, cracked, or broken hoses, plumbing, or junctions...", "Listening for leaks is the best way to diagnose pneumatic leaks in the system, the hissing sound is unmistakable. Always keep your hands away from any suspected leaks to avoid personal injury. Use a foreign object to confirm the leak..."], "jumps": ["P1160", "P", "PS"]}, {"id": "P1160", "text": ["Always remember to power down and tag the system prior to performing any maintenance. Any residual pressure should also be bled off prior to attempting repairs."], "jumps": []}, {"id": "P1170", "text": ["What should be done prior to performing service on a hydraulic or pneumatic system?"], "jumps": ["P1090"]}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1172", "text": ["All the steps are important................................", "Air in a hydraulic system and moisture in a pneumatic system greatly affects system performance. greatly affects system performance.", "Should the fluid level become low in a hydraulic reservoir a vortex or whirlpool may form in the fluid and air can be pulled into the suction side of the pump. Air can also enter the system through loose fittings, cracks, and bad gaskets on the suction side..."], "jumps": ["P1170"]}, {"id": "P1200", "text": ["Air can enter fittings on the pressure side when the hydraulic system is powered down. But, you can expect the fitting allowing the air leak with no pressure to also seep fluid when under pressure. After repair the system must be bleed to purge the air...", "The opposite of air in a hydraulic system is water in a pneumatic system. Moisture accumulates in a pneumatic system on a routine basis due to the heating of the air that occurs during compression and the condensation that can happen when the air is cooling..", "A receiver that fills with air quickly or compressors that cycle on and off often are indicators of a receiver with too much water accumulation. The moisture should be drained from the system on a regular basis, daily on large industrial systems. Moisture drains are provided on all receivers and most aftercoolers and air line filters.....", "Pneumatic systems with excessive internal moisture will operate erratically. Too much moisture can also increase corrosion and rust in the system."], "jumps": []}, {"id": "P1240", "text": ["little moisture in a hydraulic system.....", "much moisture in a hydraulic system......", "The reciprocal of too much moisture in a pneumatic system is too _______"], "jumps": ["P1230"]}, {"id": "P1241", "text": ["A hydraulic system with too much air in the system will operate erratically much as a pneumatic system with excessive moisture."], "jumps": []}, {"id": "P1250", "text": ["From 4-Way directional valve Passage A.", "Many components in hydraulic and pneumatic systems process, direct, and actuate upon pressure of the fluid or compressed air in the system.r compressed air in the system.em."], "jumps": ["P1240"]}, {"id": "P1260", "text": ["From 4-Way directional valve Passage A.", "These components all rely upon seals, rings, and gaskets to maintain system pressure while performing the desired action."], "jumps": []}, {"id": "P1270", "text": ["Pumps provide the working pressure for the hydraulic or pneumatic system. A hydraulic pump must run continuously while the pneumatic pump cycles on and off as needed."], "jumps": []}, {"id": "P1280", "text": ["The output of a hydraulic pump is a liquid under pressure. The liquid also provides lubrication and cooling for the hydraulic system.", "l)))))))))))r ?.))))))))))))))))))))))))))))2", "k(((((((((((v l,,,((((((((((((((((((((((((((", "j d"], "jumps": ["P"]}, {"id": "P1290", "text": ["Hydraulic pumps rely upon the internal seals to maintain constant pressure at the discharge outlet. With time, the internal seals loose efficiency as internal parts wear due to friction."], "jumps": []}, {"id": "P1300", "text": ["Clearances between sealing parts widens, allowing fluid leaks, or slippage to occur between the discharge outlet and the suction inlet.", "f2HHHHHHHHHH>BHHHHHHHHHHHHHHHHHHHH@{{{{{{ 8{", "q j"], "jumps": ["PPPPPPPPPPPPPPPPPPPPP", "PPPPPPPPPP", "P"]}, {"id": "P1310", "text": ["SLIPPAGE can be defined as fluid medium leaks internal to a pump, valve, or actuator caused by wear."], "jumps": []}, {"id": "P1320", "text": ["Bearings can also wear with time further increasing the slippage. The packing material can also loose strength after a while and allow fluid leakage, usually at the junction where the packing material and the shaft meet...."], "jumps": []}, {"id": "P1330", "text": ["The output of a pneumatic piston pump is a gas under pressure, usually air. Lubrication is provided by an onboard supply of oil kept away from the output pressure. Cooling is provided by cooling fins on small-to-medium systems and automotive-type liquid cooling systems on larger systems..."], "jumps": []}, {"id": "P1340", "text": ["Piston pumps have fewer parts to wear out that will cause slippage. The piston rings and the valves are the only parts which normally wear and are usually replaced during repair or rebuilding that have a direct effect upon the pressure. Gaskets are always replaced when any teardown is performed..."], "jumps": []}, {"id": "P1350", "text": ["Other parts, such as bearings and gaskets may fail and have an affect on the output pressure. But the cost of rebuilding a worn piston pump are minimal when compared to other pumps discussed in this lesson..."], "jumps": []}, {"id": "P1360", "text": ["Actuators can also experience slippage resulting in erratic operation and creeping when set in one position."], "jumps": ["P1370"]}, {"id": "P1365", "text": ["CREEP - To shift gradually out of place.here. Start second line here."], "jumps": []}, {"id": "P1370", "text": ["Fluid or air can slip past the packing, piston rings, or o-rings during operation causing incomplete motion and loss of power."], "jumps": ["P1360"]}, {"id": "P1380", "text": ["Creeping occurs in application like hydraulic actuator cylinders on fork lifts. The actuator will not hold position and slowly returns to the rest position as the pressure bleeds off.", "?sssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssssE E", ", ,", "F ooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooo", "4////////////// // / C C CCCCCCCCCCCCCCC7CC7C77C777777777777777C77CC7CCCCCCCCCCC C / // //////////44444444444---------------", "7------------------------444444444444444////////////// // / / C C CCCCCCCCCCCCCCC7CC7C77C777777777777777C77CC7CCCCCCCCCCCC C / // //////////444444444444---------------", "=tttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttG G", ":rrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrB B"], "jumps": []}, {"id": "P1390", "text": ["Fluid slippage can also occur at seals and packing during activation hampering the operation of the equipment.", "$$$$$$$$$$$$$$$$$$$$$$******** ***$$$$$$$$", "] iiiy uiiiy uiy uiiiiiiiiiiiiiiiiiiiii \"ddddddddddddddddddddddddd\""], "jumps": []}, {"id": "P1400", "text": ["Rebuilding an actuator cylinder usually requires the replacement of the piston rings, packing, or o-rings, and the replacement of packing material or seals at rod ends.", "Rotary actuators are usually maintenance free except for leaks at the shaft seals. Some rotary actuators in high pressure applications use sliding vanes which can have additional wear at the vane/casing sealing point..."], "jumps": []}, {"id": "P1430", "text": ["Relief valves, bypass valves, and 4-way valves.", "Which parts maintain pressure and eliminate leaks in a hydraulic or pneumatic system?"], "jumps": ["P1410"]}, {"id": "P1431", "text": [], "jumps": []}, {"id": "P1432", "text": ["Pistons, vanes, and rods are used in pumps and actuators to develop or process pressure but they do not assist in maintaining pressure or eliminating leaks."], "jumps": []}, {"id": "P1433", "text": ["Valves control the pressure, direction, and flow but cannot maintain the pressure or prevent leaks."], "jumps": []}, {"id": "P1440", "text": ["Many valves used in hydraulic and pneumatic systems operate on a continuous basis."], "jumps": ["P1430"]}, {"id": "P1450", "text": ["Most valves are can be rebuilt should a leak or an internal slippage develop."], "jumps": []}, {"id": "P1460", "text": ["Finding a leaky valve is usually an easy matter; look for the leaking fluid or listen for the escaping gas. Safety should always be observed when locating leaks; never feel for a leak using the hand, always use a foreign object..."], "jumps": ["P1450"]}, {"id": "P1470", "text": ["The valves used in hydraulic and pneumatic systems work in the same manner. For the remainder of the lesson the simple hydraulic system used in a log splitter will be used to identify valve failures. Animate fluid flow from the reservoir through the check valve, pump, and pressure gauge to the relief valve. From the relief valve send it back to the reservoir. 2. Move the 4-way valve to the right. Have the fluid flow to the reservoir from the relief valve stop. Fluid now flows to the left side of the actuator. The piston moves to the right. Fluid flows from the right side of the actuator, back to the 4-way valve, and out of the 4-way valve back to the reservoir. 3. Move the 4-way valve to the left. Have the fluid flow to the reservoir from the relief valve stop. Fluid now flows to the right side of the actuator. The piston moves to the left. Fluid flows from the left side of the actuator, back to the 4-way valve, and out of the 4-way valve back to the reservoir.....", "-\" GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGc7", "i]]]]i i]]]]] i]]]]] i]]]]] ]]]]]] i]]]]] ]]]]]] i]]]]] ]]]]]] i]]]]] ]]]]]] i]]]]] ]]]]]] i]]]]] i]]]]] i]]]]] i]]]]]i i", "%EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEg7 1", "i\\\\\\\\i i\\\\\\\\\\ i\\\\\\\\\\ i\\\\\\\\\\ \\\\\\\\\\\\ i\\\\\\\\\\ \\\\\\\\\\\\ i\\\\\\\\\\ \\\\\\\\\\\\ i\\\\\\\\\\ \\\\\\\\\\\\ i\\\\\\\\\\ \\\\\\\\\\\\ i\\\\\\\\\\ i\\\\\\\\\\ i\\\\\\\\\\ i\\\\\\\\\\i i", "222222222222222222222222222222222222222222222222222222222222222222222222222222222l EEMF", "[[[[&&&&&[[[[[&&&&&[[[[[&&&&&[[[[[&&&&&[[[[ 3!<7$S-'", "k ::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::,e", "```ggFFFF---XXXX==X=XXheU44444TTTTqL\"'''''111 1", "e @@__(((__M ((___@@@@ VVVV666666OOO", "FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF[= 1"], "jumps": ["P", "Pc", "PO", "PPPHHHHaaI"]}, {"id": "P1480", "text": ["The check valve in this application prevents fluid from flowing back into the reservoir after the equipment is shut down. This shortens the initial fluid flow time and extends the pump life as the fluid does not prime all the way from the reservoir..."], "jumps": []}, {"id": "P1490", "text": ["Should the check valve wear to the point slippage occurs the pump must work longer upon initial startup before fluid starts flowing in the system as the pump primes from the reservoir. Pump life may also be shortened. If the reservoir is distant from the pump the start time may be excessive...", "s}2 D"], "jumps": []}, {"id": "P1500", "text": ["The relief valve allows pressure to be channeled back to the reservoir when the 4-way valve is not activated. This redirection of fluid keeps fluid flow though the pump maintained at all times, keeping the pump cooler and lubricated...", "$&$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$&9 /'"], "jumps": []}, {"id": "P1510", "text": ["A relief valve stuck closed may prevent fluid flow back to the reservoir, overheating the pump when the actuator is not in use. This may also reduce the fluid viscosity and cause increased wear in all moving parts...", "1 I"], "jumps": []}, {"id": "P1520", "text": ["Should the relief valve stick in the open position or have internal slippage the available pressure to the 4-way valve/actuator will be reduced and performance may be hampered. The flow pressure with the 4-way valve open will be lower than normal with a stuck open or slipping relief valve..."], "jumps": []}, {"id": "P1530", "text": ["A 4-way valve with internal slippage may allow fluid to flow between the chambers and back to the reservoir. Pressure is diminished and the actuator may not move fully in both directions. 4-way valves with internal leaks and slipping may also allow the actuator to creep with the valve in the at rest position....."], "jumps": []}, {"id": "P1540", "text": ["Direct fluid flow to the reservoir when idle.", "Direct fluid flow to the left side of the actuator.", "What is the purpose of the check valve in this application?"], "jumps": ["P1530"]}, {"id": "P1541", "text": [], "jumps": []}, {"id": "P1542", "text": ["The 4-way valve directs the fluid flow to the actuator....."], "jumps": []}, {"id": "P1543", "text": ["The suction strainer keeps out foreign particles and helps prevent contamination."], "jumps": []}, {"id": "P1544", "text": ["The relief valve directs fluid flow back to the reservoir when not needed by the 4-way valve and actuator."], "jumps": []}, {"id": "P1545", "text": [], "jumps": []}, {"id": "P1910", "text": ["OTING HYDRAULIC AND PNEUMATIC SYSTEM COMPONENTS.", "This completes the information on TROUBLESHOOTING. DRAULIC AND PNEUMATIC SYSTEM COMPONENTS.", "1. Most component failures in hydraulic and pneumatic systems are due to low fluid, leaks, and internal slippage."], "jumps": ["P1540", "P1001"]}, {"id": "P1930", "text": ["2. Pump failures cause reduced pressure output and poor performance.."], "jumps": []}, {"id": "P1940", "text": ["3. Valve failures include sticking open, sticking closed, and internal leaks, or slippage."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1940", "P1001"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["Both hydraulic and pneumatic systems use positive displacement pumps.", "Hydraulic and pneumatic systems use pressure bypass valves to maintain continuous pump operation.", "The accumulator maintains pressure in a hydraulic system and the receiver maintains the pressure in a pneumatic system.", "Hydraulic systems pump liquids and pneumatic systems pressurize gases.", "Which of the following is NOT a true statement?"], "jumps": []}, {"id": "P10211", "text": ["An eyedropper filled with hydraulic fluid.", "What is best used to locate a suction leak in a hydraulic system?"], "jumps": []}, {"id": "P10212", "text": ["Which of the following is NOT a symptom of suction leaks in a hydraulic system?"], "jumps": []}, {"id": "P10213", "text": ["In a pneumatic system the pressure builds quickly and the pump cycles often. What is the most likely cause? k"], "jumps": []}, {"id": "P10214", "text": ["Fluid medium leaks internal to a pump, valve, or actuator caused by wear.", "Increased performance due to lower viscosity fluid."], "jumps": []}, {"id": "P10215", "text": ["Worn packing in a pump will cause _______ M"], "jumps": []}, {"id": "P10216", "text": ["After gaskets, which component parts are normally replaced when rebuilding a piston pump?"], "jumps": []}, {"id": "P10217", "text": ["Which of the following is a symptom of a pressure relief valve stuc     p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
</body>
