re control, Flow control and Directional."], "jumps": ["P3950", "P3970"]}, {"id": "P3950", "text": ["6. An FRL is an air line filter,When an air line filter, a pressure regulator and a lubricator are pre-piped in one unit, it is called a FRL.", "6. An FRL is an air line filter, a pressure regulator, and a lubricator pre-piped in one unit. alled a FRL."], "jumps": ["P3960", "P3945"]}, {"id": "P3945", "text": ["5. The receiver tank symbol looks like this:.............."], "jumps": ["P3940", "P3950"]}, {"id": "P3940", "text": ["4. This is the symbol for an aftercooler.................."], "jumps": ["P3935", "P3945"]}, {"id": "P3935", "text": ["3. When replacing pipes, tubes or hoses ensure the correct pressure rated replacement is used. This will avoid rupturing of the lines and protect you and others from injury..ury. from injury.."], "jumps": ["P3940", "P3930"]}, {"id": "P3930", "text": ["2. Compressors, depending on the type, will be represented with these symbols.."], "jumps": ["P3920", "P3935"]}, {"id": "P3920", "text": ["1. The symbols for electric and gasoline motors are represented like this in a pneumatic system."], "jumps": ["P3930", "P3001"]}, {"id": "P3910", "text": ["This completes the information on SCHEMATIC SYMBOLS........"], "jumps": ["P3460"]}, {"id": "P3460", "text": ["1. Motor (Prime mover) 2. Compressor 3. Lines 4. Aftercooler 5. Receiver Tank 6. Filter/Regulator/ Lubricator (FRL) 7. Valves 8. Actuator 9. Electric Shut-Off", "Now that all the individual symbols have been added, you now have a complete basic pneumatic system diagram."], "jumps": ["P3910", "P3450", "Prime"]}, {"id": "P3454", "text": ["This is the symbol for a FRL (Filter, Regulator, Lubricator)."], "jumps": []}, {"id": "P3453", "text": ["This is the symbol for a receiver.........................."], "jumps": []}, {"id": "P3452", "text": ["This is the symbol for an aftercooler......................"], "jumps": []}, {"id": "P3451", "text": [], "jumps": []}, {"id": "P3450", "text": ["Which of the following symbols is used for a pressure gauge?"], "jumps": ["P3440"]}, {"id": "P3440", "text": ["A Muffler can be used, not only on a exhaust line; it also can be installed on any other component that may need to relieve pressure.", "A pressure switch is represented by this symbol............"], "jumps": ["P3430", "P3450", "P3440", "P3410", "P"]}, {"id": "P3410", "text": ["The symbol for a pressure gauge is represented like this..."], "jumps": ["P3430", "P3380"]}, {"id": "P3380", "text": ["Cylinder Actuator - (single rod, double-acting) for linear motion, and . Rotary Actuator - (vane motor) for rotary motion._", "The two types of actuators used in our pneumatic system were the Cylinder Actuator - (single rod, double-acting) for linear motion, and the Rotary Actuator - (vane motor) for rotary motion.."], "jumps": ["P3410", "P3360"]}, {"id": "P3360", "text": ["This is the general symbol for a flow control valve........"], "jumps": ["P3340", "P3380"]}, {"id": "P3344", "text": ["The 4-way directional control valve second position directs the input to Port B and the return is directed from Port A to the Exhaust port. When Ports A and B are connected to a linear actuator, movement in both directions is provided..."], "jumps": ["P3360", "P3342"]}, {"id": "P3342", "text": ["The 4-way directional control valve used has two positions. The first positions directs the input to Port A and the return is directed from Port B to the Exhaust port.not the the number of valve positions..."], "jumps": ["P3344", "P3340"]}, {"id": "P3340", "text": ["In our pneumatic system, a 4-way directional control valve is used to reverse the flow through an actuator. These valves are named for the number of ports in the valve, not the the number of valve positions..."], "jumps": ["P3342", "P3330"]}, {"id": "P3330", "text": ["Directional control valves can be simple on/off valves, like the 2-way valve. The 3-way valve, on the other hand, switches the pressure between two outputs. Finally, the 4- way valve allows the complete reversal of the flow....", "If a heavy spring is used inside a check valve, this also can be used to control pressure.", "To control the pressure, we used a pressure regulator valve in our basic pneumatic system."], "jumps": ["P3340", "P3320", "P3330", "P3310", "P3290"]}, {"id": "P3290", "text": ["This is the symbol for a Safety Relief Valve..............."], "jumps": ["P3280", "P3310"]}, {"id": "P3280", "text": ["~ Safety Relief Valve ~ Pressure control valves ~ Directional valves ~ Flow control valves motion ~require torque ~require crushing, cutting, striking or sprayinggggg", "Many various valves are used in pneumatic systems.........."], "jumps": ["P3270", "P3290"]}, {"id": "P3272", "text": ["Remember a pipe, tube, or hose can rupture. They may be under high enough pressure to bring injury to yourself and others."], "jumps": []}, {"id": "P3271", "text": [], "jumps": []}, {"id": "P3270", "text": ["If you do not replace a pipe, tube or hose with the same rating for its pressure handling capability, they may _______"], "jumps": ["P3260"]}, {"id": "P3263", "text": ["The third individual component of a FRL is the Lubricator. The Lubricator and its schematic symbol are as shown.", "The second individual component of a FRL is the Regulator. The Regulator and its schematic symbol are as shown."], "jumps": ["P3262", "P3270", "P3261", "P3263"]}, {"id": "P3261", "text": ["The first individual component of a FRL is the Filter. The filter and its schematic symbol are as shown."], "jumps": ["P3262", "P3260"]}, {"id": "P3260", "text": ["Remember, A FRL is a prepiped package of individual components."], "jumps": ["P3261", "P3230"]}, {"id": "P3250", "text": ["The symbols of a Filter, Regulator, Lubricator (FRL) are as follows:", "1. Motor (Prime mover) 2. Compressor 3. Lines 4. Aftercooler 5. Receiver Tank 6. Filter/Regulator/ Lubricator (FRL) 7. Valves 8. Actuator 9. Electric Shut-Off"], "jumps": ["P3230", "P3260", "Prime"]}, {"id": "P3240", "text": ["The Receiver tank symbol is drawn like this."], "jumps": ["P3250", "P3230"]}, {"id": "P3230", "text": ["1. Motor (Prime mover) 2. Compressor 3. Lines 4. Aftercooler 5. Receiver Tank 6. Filter/Regulator/ Lubricator (FRL) 7. Valves 8. Actuator 9. Electric Shut-Off", "The symbol for an aftercooler looks like this.............."], "jumps": ["P3240", "P3220", "Prime"]}, {"id": "P3224", "text": ["This is the symbol for a pressure gauge...................."], "jumps": []}, {"id": "P3223", "text": ["This is the symbol for an aftercooler......................"], "jumps": []}, {"id": "P3222", "text": ["This is the symbol for an electric motor..................."], "jumps": []}, {"id": "P3221", "text": [], "jumps": []}, {"id": "P3220", "text": ["Which of the symbols below symbolizes a displacement compressor?"], "jumps": ["P3210"]}, {"id": "P3210", "text": ["Always replace a line, tube or hose with the same pressure rating, if you do not it may rupture and possibly injure yourself or others."], "jumps": ["P3220", "P3200"]}, {"id": "P3200", "text": ["The material type used depends on how much pressure is in the line."], "jumps": ["P3210", "P3160"]}, {"id": "P3190", "text": ["Hoses can be made out of different rubber combinations and can be reenforced by an outside covering to strengthen the hose. Hoses are usually flexible."], "jumps": ["P3160", "P3200"]}, {"id": "P3180", "text": ["Tubes can be made out of the same substances as Pipes, but are smaller and can be rigid or flexible."], "jumps": ["P3160", "P3190"]}, {"id": "P3170", "text": ["Pipes can be made out of various substances, depending on what it will transport or where they are located. They can be made out of PVC (type of plastic), iron, stainless steel and copper to name a few. Pipes are usually not flexible."], "jumps": ["P3160", "P3180"]}, {"id": "P3160", "text": ["The lines that connect the different system components can be a combination of the following:"], "jumps": ["P3170", "P3159"]}, {"id": "P3159", "text": ["1. Motor (Prime mover) 2. Compressor 3. Lines 4. Aftercooler 5. Receiver Tank 6. Filter/Regulator/ Lubricator (FRL) 7. Valves 8. Actuator 9. Electric Shut-Off", "The next part of a pneumatic system are the lines.ts can be a combination of the following:"], "jumps": ["P3160", "P3150", "Prime"]}, {"id": "P3154", "text": ["This is the symbol for an aftercooler......................"], "jumps": []}, {"id": "P3153", "text": ["This is the symbol for a pressure gauge...................."], "jumps": []}, {"id": "P3152", "text": ["This is the symbol for a gasoline motor...................."], "jumps": []}, {"id": "P3151", "text": [], "jumps": []}, {"id": "P3150", "text": ["The Symbol for an electric motor is?......................."], "jumps": ["P3140"]}, {"id": "P3140", "text": ["Compressors are rated by how much air they can move. Compressors can be labeled CFM, cubic feet per minute."], "jumps": ["P3150", "P3110"]}, {"id": "P3120", "text": ["DYNAMIC COMPRESSORS, draw in air and accelerate it to a high velocity, it then enters the diffuser section where the air is converted to pressure."], "jumps": ["P3110"]}, {"id": "P3110", "text": ["The other type of compressor is the Dynamic compressor also referred to as a centrifugal compressor."], "jumps": ["P3080"]}, {"id": "P3090", "text": ["The piston pulls down and draws in air through the intake valve, it then pushes up compressing the air. The outlet valve opens and sends the air to a receiver tank."], "jumps": ["P3080"]}, {"id": "P3080", "text": ["One type of displacement compressor is a piston compressor."], "jumps": ["P3020"]}, {"id": "P3070", "text": [], "jumps": ["P3020"]}, {"id": "P3060", "text": ["Number 2 on the list is the compressor. Two types of common compressors are the displacement compressor and dynamic compressor. The displacement compressor symbol is:"], "jumps": ["P3020"]}, {"id": "P3050", "text": ["The gasoline motor is represented like this:"], "jumps": ["P3020", "Prime"]}, {"id": "P3030", "text": ["The symbol for our electric motor in the block diagram would be:"], "jumps": ["P3020", "Prime"]}, {"id": "P3020", "text": ["1. Motor (Prime mover) 2. Compressor 3. Lines 4. Aftercooler 5. Receiver Tank 6. Filter/Regulator/ Lubricator (FRL) 7. Valves 8. Actuator", "Let's now look at each part of the block diagram as we refer to each component and its schematic symbol."], "jumps": ["P3030", "P3001", "Prime"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2990"]}, {"id": "P2990", "text": ["9. Actuators use the system pressure to perform the work, either through linear motion or rotary motion."], "jumps": ["P2999", "P2980"]}, {"id": "P2980", "text": ["8. Gauges in a pneumatic system are there to visually check the pressure at different locations throughout the pneumatic system.", "control the pressure, flow, direction and velocity.", "7. Valves are used throughout the system to control the pressure, flow and direction of the air.........."], "jumps": ["P2990", "P2970", "P2980", "P2960"]}, {"id": "P2960", "text": ["6. An FRL or filter, regulator and lubricator, filters, regulates and lubricates air as a prepiped package which makes installation easier.", "6. An FRL (or filter regulator and lubricator) filters, regulates, and lubricates air as a pre-piped package which makes installation easier."], "jumps": ["P2970", "P2955"]}, {"id": "P2955", "text": ["ner through out the Pneumatic System. It also cools the gas and allows the contaminants to fall to the bottom of the tank. %", "5. The receiver stores the pressure and delivers it in a controlled manner throughout the pneumatic system. It also cools the gas and allows the contaminants to fall to the bottom of the tank."], "jumps": ["P2960", "P2950"]}, {"id": "P2950", "text": ["4. The aftercooler cleans, dries and cools the gas........"], "jumps": ["P2955", "P2940"]}, {"id": "P2940", "text": ["3. Lines include pipes, tubes, and hoses. They transport the fluid from component to component. They can also be used to change the pressure of a system at any point. any point."], "jumps": ["P2950", "P2930"]}, {"id": "P2930", "text": ["2. A motor provides the mechanical energy to the compressor. The compressor provides the fluid motion. The fluid motion creates the pressure against the system's resistance."], "jumps": ["P2940", "P2920"]}, {"id": "P2920", "text": ["1. Many different types of motors can be used as prime movers."], "jumps": ["P2930", "P2001"]}, {"id": "P2910", "text": ["This completes the information on PNEUMATIC SYSTEM COMPONENTS.", "Now that all the components have been added, you have a complete Basic Pneumatic System."], "jumps": ["P2580", "P2910", "P2560"]}, {"id": "P2570", "text": ["poppet. The S It can also be manually tested using the lever.", "The spring is overcome by the system's pressure, unseating the poppet. The Safety Relief Valve can also be manually tested using the lever...."], "jumps": ["P2580", "P2560"]}, {"id": "P2560", "text": ["The Safety Relief valve is also used to prevent injuries and other damage. The valve releases system pressure when it exceeds a predetermined level."], "jumps": ["P2570", "P2540"]}, {"id": "P2550", "text": ["Air is exhausted by hand tools and line tools directly to the atmosphere. The muffler reduces the noise and difuses the stream of air exhausted by a controlled system, such as after being used by an actuator."], "jumps": ["P2540", "P2560"]}, {"id": "P2540", "text": ["system is located, you may have a muffler on the exhaust line.", "Depending on the type of pneumatic system and where the system is located, you may have a muffler on an exhaust line. The muffler reduces noise and diffuses the high pressure air stream to prevent injuries.", "Remember, when the velocity of a fluid increases the pressure of the fluid decreases."], "jumps": ["P2530", "P2550"]}, {"id": "P2531", "text": [], "jumps": []}, {"id": "P2530", "text": ["When the flow control valve is tightened inward, the pressure __________", "After leaving the flow control valve the air passes back through the 4-way directional control valve and is exhausted from the system through the muffler.", "The flow control valve provides a manual pressure adjustment. The pressure may be reduced from fully open (no restriction) to fully closed (no flow), or any point in between."], "jumps": ["P2520", "P2530", "P2510", "P2500"]}, {"id": "P2500", "text": ["From the pressure gauge the compressed air would enter the inlet port of the flow control valve."], "jumps": ["P2510", "P2490"]}, {"id": "P2490", "text": ["After exiting the actuator, the pressure can be viewed by a pressure gauge."], "jumps": ["P2500", "P2480"]}, {"id": "P2480", "text": ["If rotary motion was desired the air pressure would begin pushing the vanes of the rotary actuator. The vanes that are connected to a shaft would begin to rotate."], "jumps": ["P2460", "P2490"]}, {"id": "P2460", "text": ["If the actuator is to provide linear motion, the air pressure pushes the piston in the cylinder......."], "jumps": ["P2480", "P2440"]}, {"id": "P2440", "text": ["The pressure gauge reads the system's pressure before entering the inlet port of the actuator."], "jumps": ["P2460", "P2430"]}, {"id": "P2432", "text": ["A FRL is a combination of a Filter, Regulator and Lubricator."], "jumps": []}, {"id": "P2431", "text": [], "jumps": []}, {"id": "P2430", "text": ["FRL is a combination of a _______.........................."], "jumps": ["P2410"]}, {"id": "P2410", "text": ["After the FRL, the air passes through the 4-way directional valve. It controls the flow of air to other sections of the system and can reroute the flow upon demand."], "jumps": []}, {"id": "P2390", "text": ["The airline filter, pressure regulator and the lubricator can be combined in a pre-piped package to make installation easier, this is called a FRL (Filter, Regulator and Lubricator.)"], "jumps": ["P2410", "P2380"]}, {"id": "P2380", "text": ["The lubricator produces a mist of oil that is sprayed into the airstream at a controlled rate. This prevents the parts from wearing or keeps moving parts from sticking together.", "If the pressure is below the setting of the regulator valve it exits the secondary passage and moves on to the lubricator."], "jumps": ["P2390", "P2340", "P2380"]}, {"id": "P2350", "text": ["If the pressure exceeds the setting of the regulator valve, the air entering the pilot passage lifts the piston. The spring's resistance is overcome lifting the poppet until it blocks the incoming air and allows the air to escape through the vent...", "The air enters the primary passage of the pressure regulator valve, which is set to maintain a certain pressure."], "jumps": ["P2360", "P2340", "P2350", "P2322", "P"]}, {"id": "P2325", "text": ["MICRON - One micron is equal to .000001 inches or one millionth of an inch."], "jumps": []}, {"id": "P2322", "text": ["These filters need to be changed at periodic intervals, which depend on the size of the filter particles they trap. They are usually rated in microns."], "jumps": ["P2340", "P2280"]}, {"id": "P2320", "text": ["These filters need to be changed at periodic intervals, which depend on the size of the filter particles they trap. They are usually rated in microns."], "jumps": ["P2280", "P2340"]}, {"id": "P2310", "text": ["The filter element traps the smaller particles within it and allows the air to pass through to the outlet port."], "jumps": ["P2320", "P2280"]}, {"id": "P2300", "text": ["This swirling action forces large particles to the sides of the interior wall. They then fall to the lower portion of the filter housing."], "jumps": ["P2310", "P2280"]}, {"id": "P2290", "text": ["Air coming from the inlet port flows through deflector plate openings, causing a swirling action. Deflector Plate"], "jumps": ["P2300", "P2280"]}, {"id": "P2280", "text": ["The air moves out of the Receiver and into the Air line Filter (separator). This removes any solid particles, dirt and any remaining moisture from the pneumatic system."], "jumps": ["P2290", "P2270"]}, {"id": "P2274", "text": ["The AFTERCOOLER cleans, dries and cools the air in the pneumatic system."], "jumps": []}, {"id": "P2273", "text": ["The compressor provides the fluid flow to the pneumatic system."], "jumps": []}, {"id": "P2272", "text": ["The PRIME MOVER provides the mechanical energy to the pneumatic system."], "jumps": []}, {"id": "P2271", "text": [], "jumps": []}, {"id": "P2270", "text": ["The _______ stores and stabilizes the compressed air before being delivered in a controlled manner throughout the pneumatic system."], "jumps": ["P2200"]}, {"id": "P2250", "text": ["The Receiver also has a high pressure switch, which opens the pressure relief valve if excessive pressure should built up. The pressure gauge located on the receiver allows you to view the system pressure."], "jumps": ["P2200", "P2270"]}, {"id": "P2240", "text": ["The Receiver needs to be drained at periodic intervals to remove excess water and contaminants.............."], "jumps": ["P2250", "P2200"]}, {"id": "P2230", "text": ["Any water and contaminants fall to the bottom of the tank."], "jumps": ["P2240", "P2200"]}, {"id": "P2220", "text": ["It also cools more of the air, due to the large surface area within the tank."], "jumps": ["P2200", "P2230"]}, {"id": "P2210", "text": ["The Receiver stores the compressed air and stabilizes the air supply as it's delivered throughout the system."], "jumps": ["P2200", "P2220"]}, {"id": "P2200", "text": ["The air continues on towards the Receiver, the storage tank for the pneumatic system..."], "jumps": ["P2150", "P2210"]}, {"id": "P2190", "text": ["The air leaves the aftercooler, cleaner, drier and cooler."], "jumps": ["P2200", "P2150"]}, {"id": "P2180", "text": ["You should clean all the water, oil, and dirt that collects in the aftercooler at regular intervals."], "jumps": ["P2190", "P2150"]}, {"id": "P2170", "text": ["As the air cools, the water vapor begins condensing and collects at the bottom of the aftercooler."], "jumps": ["P2180", "P2150"]}, {"id": "P2160", "text": ["The compressed air begins to cool..........................................."], "jumps": ["P2170", "P2150"]}, {"id": "P2150", "text": ["The air flows into the aftercooler, water circulates through chambered shells in the opposite direction of the incoming air."], "jumps": ["P2160", "P2140"]}, {"id": "P2144", "text": ["A crescent wrench is a mechanical tool....................."], "jumps": []}, {"id": "P2143", "text": ["The exhaust line primary function is to remove excessive fluids."], "jumps": []}, {"id": "P2142", "text": ["A filter primary function is to stop unnecessary particles from entering the pneumatic system...."], "jumps": []}, {"id": "P2141", "text": [], "jumps": []}, {"id": "P2140", "text": ["The _______ provides the mechanical energy to the compressor."], "jumps": ["P2120"]}, {"id": "P2130", "text": ["The compressor will continue running until the pressure in the system overcomes the spring tension of the switch, which then raises the lever to the off position. This will shut off the electricity to the motor.", "The pressure switch keeps a constant watch of the pressure in the pneumatic system, keeping the pressure between pre-set maximum and minimum levels. When the pressure is low, the switch applies power to the compressor's motor."], "jumps": ["P2120", "P2140", "P2130", "P2090"]}, {"id": "P2110", "text": ["The air flows to the pressure switch, safety relief valve, and the aftercooler......"], "jumps": ["P2120", "P2090"]}, {"id": "P2100", "text": ["The air is transported throughout the pneumatic system by lines, pipes and hoses. They connect all the different Pneumatic System components together......"], "jumps": ["P2110", "P2090"]}, {"id": "P2090", "text": ["The compressor uses the mechanical energy supplied by the motor (prime mover) and begins to draw in the air through the filter. The compressor starts to move the fluid. The system's resistance does not allow the fluid to escape. This causes pressure to be built up in the pneumatic system..."], "jumps": ["P2060", "P2100"]}, {"id": "P2070", "text": ["Since the shaft of the motor is connected to the linkage of the compressor, the compressor also begins turning."], "jumps": ["P2090", "P2060"]}, {"id": "P2060", "text": ["When the motor is turned ON, the shaft begins to rotate...."], "jumps": ["P2040", "P2070"]}, {"id": "P2050", "text": ["There are many types of prime movers; electric, gasoline, and diesel motors are the most common.............."], "jumps": ["P2040", "P2060"]}, {"id": "P2040", "text": ["We are using an electric motor in this pneumatic system to provide the mechanical energy to the compressor."], "jumps": ["P2050", "P2020"]}, {"id": "P2030", "text": ["This is a block diagram of the Basic Pneumatic System Components and how they are connected.o"], "jumps": ["P2040", "P2020"]}, {"id": "P2020", "text": ["1. Motor (Prime mover) 2. Compressor 3. Lines 4. Aftercooler 5. Receiver Tank 6. Filter/Regulator/ Lubricator (FRL) 7. Valves 8. Actuator", "A basic Pneumatic System consists of the following components."], "jumps": ["P2030", "P2001", "Prime"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1970"]}, {"id": "P1970", "text": ["6. Always follow safety guidelines to prevent injuries...."], "jumps": ["P1960", "P1999"]}, {"id": "P1960", "text": ["5. There are many uses for pneumatics....................."], "jumps": ["P1950", "P1970"]}, {"id": "P1950", "text": ["4. Once the fluid is in motion, it creates the pressure necessary to be used by an actuator. This in turn provides the linear or rotative power necessary to perform work."], "jumps": ["P1960", "P1940"]}, {"id": "P1940", "text": ["3. Fluid moves through a pneumatic system when a prime mover provides the mechanical energy."], "jumps": ["P1930", "P1950"]}, {"id": "P1930", "text": ["2. Compressed air or nitrogen are used in pneumatic systems to provide fluid power."], "jumps": ["P1940", "P1920"]}, {"id": "P1920", "text": ["1. Pneumatics is the use of fluid under pressure to perform work."], "jumps": ["P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on PNEUMATIC PRINCIPLES AND SAFETY."], "jumps": ["P1610"]}, {"id": "P1610", "text": ["Mechanical Safety Fluid Safetyant or variable speed ~require rotating motion ~require linear motion ~require torque ~require crushing, cutting, striking or sprayinggg", "Remember, by using normal shop safety and common sense your chances of becoming injured are greatly decreased."], "jumps": ["P1600", "P1910"]}, {"id": "P1602", "text": ["Some pneumatic systems are under great amounts of pressure always check the systems pressure rating. Shut-off pressure before working on system components. High pressure can cause severe damage to equipment and personnel......................"], "jumps": []}, {"id": "P1601", "text": [], "jumps": []}, {"id": "P1600", "text": ["Some pneumatic systems are under great amounts of pressure, caution must be used because they can _______", "Suspected leaks can be heard because they usually hiss. A sheet of paper or other approved material should be used to find a suspected leak."], "jumps": ["P1560", "P1550"]}, {"id": "P1550", "text": ["Before working on pneumatic systems check to see how much pressure is created. Some systems are under great amounts of pressure and may cause bodily harm.......................", "Leaks If an air hose becomes severed or slips off the end of a tool it will go out of control, do not try to grab the air hose. Instead turn off the supply of air to the tool or pneumatic system...."], "jumps": ["P1560", "P1540", "P1520"]}, {"id": "P1520", "text": ["When a suspected leak is in a confined area, ventilate the area. Depending on what vapors the air is mixed with, it may cause toxic reactions such as nausea, dizziness, shortness of breath or even death."], "jumps": ["P1540", "P1510"]}, {"id": "P1510", "text": ["Body Contact Do not use compressed air or oxygen for blowing debris off surfaces you may blow debris into your eyes or drive it into your skin..."], "jumps": ["P1520", "P1500"]}, {"id": "P1500", "text": ["Do not smoke, weld or cause sparks around a suspected leak."], "jumps": ["P1490", "P1510"]}, {"id": "P1490", "text": ["Flammability While pneumatic gases are not usually flammable, oxygen from air mixed with oil, gasoline, or other solvents can increase the materials flammability or cause the material to scatter due to the pressure of the gases."], "jumps": ["P1480", "P1500"]}, {"id": "P1480", "text": ["Now let's look at some basic rules for pneumatic fluid safety.", "Mechanical Safety Fluid Safetyant or variable speed ~require rotating motion ~require linear motion ~require torque ~require crushing, cutting, striking or sprayinggg"], "jumps": ["P1490", "P1470"]}, {"id": "P1470", "text": ["NEVER turn a pneumatic system off when the piston or actuator is extended. Removing the power from the prime mover can remove pressure from the system....."], "jumps": ["P1460", "P1480"]}, {"id": "P1460", "text": ["Wear ear plugs to prevent hearing loss. You may not notice it now but, after years of exposure to loud machinery without ear plugs you will have a significant hearing loss.", "Wear safety goggles or glasses to prevent flying debris or chemicals from injuring eyes.", "When operating machinery or tools, remove loose clothing and jewelry. These can get caught in moving parts."], "jumps": ["P1470", "P1450", "P1460", "P1440", "P1430"]}, {"id": "P1430", "text": ["The rules for mechanical safety of a pneumatic system are much like the rules followed when any machinery is used.", "Mechanical Safety Fluid Safetyant or variable speed ~require rotating motion ~require linear motion ~require torque ~require crushing, cutting, striking or sprayinggg"], "jumps": ["P1420", "P1440"]}, {"id": "P1420", "text": ["There are two areas of safety you should think about when operating or repairing pneumatic systems:", "Mechanical Safety Fluid Safetyant or variable speed ~require rotating motion ~require linear motion ~require torque ~require crushing, cutting, striking or sprayinggg"], "jumps": ["P1430", "P1410"]}, {"id": "P1410", "text": ["Pneumatic machines and tools are very helpful but, they can also be very dangerous if safety precautions are not followed."], "jumps": ["P1400", "P1420"]}, {"id": "P1403", "text": ["The screw driver uses rotative motion to perform work......"], "jumps": []}, {"id": "P1402", "text": ["The wrench uses rotative motion to perform work............"], "jumps": []}, {"id": "P1401", "text": [], "jumps": []}, {"id": "P1400", "text": ["Which tool uses linear motion to perform work?............."], "jumps": ["P1396"]}, {"id": "P1396", "text": ["One pneumatic system can provide the power source for many tools at the same time provided the total demand does not exceed the rating of the compressor.al demand the pneumatic system will operate..."], "jumps": ["P1400", "P1394"]}, {"id": "P1394", "text": ["But, when the demand is greater than the supply, the compressor runs constantly and the tools are forced to work at less-than-optimum pressure....the total demand the pneumatic system will operate..."], "jumps": ["P1396", "P1392"]}, {"id": "P1392", "text": ["All hydraulic equipment is rated in average flow using a cubit feet per minute (CFM) rating. As long as the source compressor's output stays above the total demand the pneumatic system will operate..."], "jumps": ["P1394", "P1380"]}, {"id": "P1380", "text": ["There are various pneumatic tools, and they are usually lighter than their electrical counterparts because they do not have a large electric or gasoline motor. ne pneumatic system can provide the power source for many tools at the same time.."], "jumps": ["P1392", "P1370"]}, {"id": "P1375", "text": [], "jumps": []}, {"id": "P1374", "text": ["A rivet hammer is used to drive nails to a uniform depth. One advantage of using a rivet hammer as opposed to an ordinary hammer is that it can be set to the same depth of the nail and another is, that the person using it will be able to nail for a longer period of time.."], "jumps": ["P1370"]}, {"id": "P1373", "text": ["Pneumatic screw drivers are used to install or remove screws quickly and easily."], "jumps": ["P1370"]}, {"id": "P1372", "text": ["Impact wrenches that strike and twist at the same time. These are used when a lot of torque is needed to remove or attach nuts."], "jumps": ["P1370"]}, {"id": "P1371", "text": ["An air wrench is a pneumatic tool that uses rotative motion to perform work. It can tighten or loosen nuts very quickly."], "jumps": ["P1370"]}, {"id": "P1370", "text": ["If you think about it, we use pneumatics for many applications. Select an item for more information:"], "jumps": ["P1310", "P1380"]}, {"id": "P1360", "text": ["This paving breaker has demonstrated the concept of a pneumatic tool using linear motion."], "jumps": ["P1310", "P1370"]}, {"id": "P1350", "text": ["The air valve redirects the air pressure, through the air passage to the front of the piston. This forces the piston back up and the cycle is repeated, until the throttle valve is released."], "jumps": ["P1310", "P1360"]}, {"id": "P1340", "text": ["The piston strikes the anvil which transfers the energy to the chisel-like tool.."], "jumps": ["P1350", "P1310"]}, {"id": "P1330", "text": ["The throttle valve when pressed allows the air pressure to enter the air valve, the air valve opens and forces the piston out of the cylinder."], "jumps": ["P1340", "P1310"]}, {"id": "P1320", "text": ["This paving breaker or jack hammer has an airline (hose) connected to inlet port...oad at the output of the system."], "jumps": ["P1330", "P1310"]}, {"id": "P1310", "text": ["Let's look at an application of fluid power in a pneumatic tool. This moves the load at the output of the system."], "jumps": ["P1320", "P1300"]}, {"id": "P1300", "text": ["The device that the fluid moves or forces, is called an actuator. This moves the load at the output of the system."], "jumps": ["P1290", "P1310"]}, {"id": "P1293", "text": ["PSI is measured by gauges. The prime mover is not used to measure the fluid pressure."], "jumps": []}, {"id": "P1292", "text": ["If the prime mover is an electric motor, it would use the electrical energy and then convert it to mechanical energy."], "jumps": []}, {"id": "P1291", "text": [], "jumps": []}, {"id": "P1290", "text": ["What is the purpose of a prime mover?......................"], "jumps": ["P1270"]}, {"id": "P1280", "text": ["The pressure can be used to increase or decrease the amount of force at the output of the system (fluid power)."], "jumps": ["P1270", "P1290"]}, {"id": "P1270", "text": ["By applying force, pressure is created and the fluid moves. The pressure is measured in PSI by a gauge."], "jumps": []}, {"id": "P1260", "text": ["The motion provides force throughout the pneumatic system."], "jumps": ["P1240", "P1270"]}, {"id": "P1250", "text": ["The mechanical energy is transferred in the form of motion."], "jumps": ["P1240", "P1260"]}, {"id": "P1240", "text": ["Prime movers can be pumps, compressors and electric motors, to name a few."], "jumps": ["P1250", "P1220"]}, {"id": "P1230", "text": ["Prime movers supply the mechanical energy to move the fluid in a pneumatic system."], "jumps": ["P1240", "P1220"]}, {"id": "P1220", "text": ["Fluid power is generated by a prime mover.................."], "jumps": ["P1230", "P1210"]}, {"id": "P1210", "text": ["Gas flowing under pressure is considered fluid power. fluid power."], "jumps": ["P1220", "P1200"]}, {"id": "P1200", "text": ["Liquids are non-compressible, gases can be compressed. Once gases have been compressed to a certain pressure they act much like a liquid."], "jumps": ["P1210", "P1190"]}, {"id": "P1193", "text": ["Hydraulic systems use liquid under pressure to perform work."], "jumps": []}, {"id": "P1192", "text": ["Solar power systems convert light to power................."], "jumps": []}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1190", "text": ["Systems that use gas under pressure to perform work are called?", "Using these two basic laws, and much more physics, engineers have been able to construct a large variety of pneumatic tools and machinery."], "jumps": ["P1180", "P1190", "P1140"]}, {"id": "P1160", "text": ["Equal pressure is applied to more fluid volume in the larger pipe so the fluid moves slower than the smaller pipe with less flow volume. The same pressure is exerted on a smaller volume of fluid..."], "jumps": ["P1140", "P1180"]}, {"id": "P1150", "text": ["For example, when fluid flows through a large pipe, it flows at a slower rate than fluid through a small pipe."], "jumps": ["P1140", "P1160"]}, {"id": "P1140", "text": ["Later, Daniel Bernouilli studied the pressure and velocity of flowing fluids. He found that the pressure remains the same but the velocity of the fluid flow changes based on the size of the pipe. At the same pressure, fluid flow is faster in smaller pipes than in larger pipes..."], "jumps": ["P1150", "P1100"]}, {"id": "P1130", "text": ["For example, if a pipe contains fluid and we exert pressure on the fluid from one end of the pipe. The gauges would show us that the exerted pressure (PSI) is equal at all points along the pipe..s along the pipe..."], "jumps": ["P1100", "P1140", "PSI"]}, {"id": "P1120", "text": ["The pressure that Pascal's law refers to, can be measured in pounds per square inch (PSI)."], "jumps": ["P1100", "P1130", "PSI"]}, {"id": "P1110", "text": ["He found that whenever pressure is applied to or removed from a confined fluid that the change in pressure takes place equally throughout the fluid. This is known as Pascal's law."], "jumps": ["P1100", "P1120"]}, {"id": "P1100", "text": ["Fluid pressure was analyzed by Blaise Pascal in the 11th century.", "Fluid properties are affected by pressure and velocity. Pascal and Bernoulli were two men who formed two basic laws that apply to fluid pressure and velocity."], "jumps": ["P1110", "P1090", "P1100", "P1080"]}, {"id": "P1083", "text": ["Remember, pneumatic systems usually use air or nitrogen...."], "jumps": []}, {"id": "P1082", "text": ["Liquid is used in a hydraulic system......................."], "jumps": []}, {"id": "P1081", "text": [], "jumps": []}, {"id": "P1080", "text": ["Which type of fluid is used in the pneumatic system?......."], "jumps": ["P1070"]}, {"id": "P1073", "text": ["Motion alone does not cause a pneumatic system to perform work. When a fluid, such as a gas, is given direction and motion, pressure is created...."], "jumps": []}, {"id": "P1072", "text": ["Direction alone does not cause a pneumatic system to perform work. When a fluid, such as gas, is given direction and motion, pressure is created..."], "jumps": []}, {"id": "P1071", "text": [], "jumps": []}, {"id": "P1070", "text": ["What causes a pneumatic system to perform work?............", "In some manufacturing environments nitrogen is used since it will not react with other elements like the oxygen in the air."], "jumps": ["P1060", "P1070", "P1050"]}, {"id": "P1050", "text": ["Air is made up of 78 percent nitrogen and 21 percent oxygen, other gases make up the remaining 1 percent.", "Nitrogen -- 78% Oxygen -- 21% Other -- 1%"], "jumps": ["P1020", "P1060"]}, {"id": "P1040", "text": ["When compressed, gases take on fluid properties similar to liquids and follow the same laws regarding fluids under pressure.and then is exhausted to the atmosphere."], "jumps": ["P1050", "P1035"]}, {"id": "P1035", "text": ["A pneumatic system, on the other hand, is usually a total-loss system. The gas is compressed, performs the necessary work, and then is exhausted to the atmosphere.", "By their definition, both hydraulic and pneumatic systems use fluids. Hydraulic systems use liquids in a closed loop system. Pressure is applied to the fluid, which performs the necessary work. The fluid is retained in the system for reuse."], "jumps": ["P1040", "P1030", "P1035", "P1025"]}, {"id": "P1025", "text": ["A fluid is defined as a substance whose molecules move freely past one another and has the tendency to assume the shape of its container. A fluid may be a liquid or a gas.", "The term pneumatic comes from the Greek word pneuma, meaning breath, wind, and spirit."], "jumps": ["P1030", "P1020", "P1025", "P1001"]}, {"id": "P1001", "text": ["PNEUMATIC PRINCIPLES & SAFETYYYYYYYYYYYY"], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P470", "text": ["Let's begin the lesson on INTRODUCTION TO PNEUMATIC SYSTEMS................."], "jumps": ["P450"]}, {"id": "P460", "text": ["Pneumatic technicians and mechanics must also be familiar with these symbols to be able to locate, identify, repair or replace these components."], "jumps": ["P450", "P470"]}, {"id": "P450", "text": ["As the pneumatic systems were further developed, engineers needed to represent different components of a pneumatic system with schematic symbols."], "jumps": ["P460", "P430"]}, {"id": "P440", "text": ["This concept was modified to foot bellows...."], "jumps": ["P450", "P430"]}, {"id": "P430", "text": ["One early pneumatic device was the hand bellows............"], "jumps": ["P440", "P420"]}, {"id": "P420", "text": ["~ repetitive ~ require a constant or variable speed ~ require rotating motion ~ require linear motion ~ require torque ~ require crushing, cutting, striking or sprayinggggg", "These tools or machinery can perform tasks that are:......."], "jumps": ["P410", "P430"]}, {"id": "P410", "text": ["Pneumatic systems are usually connected to tools or machinery.", "Pneumatic systems are used to help us get work done more efficiently."], "jumps": ["P420", "P400", "P410", "P300"]}, {"id": "P300", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe Pneumatics. w Understan let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
