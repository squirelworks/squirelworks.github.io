const book = {"title": "9395TD01", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Title: INTRODUCTION TO RADAR CHARACTERISTICSISTICSan Cyr;Times New Roman Greek;Times New Roman Tur;Times New Roman (Hebrew);Times New Roman (Arabic);Times New Roman Baltic;INTRODUCTION TO RADAR CHARACTERISTICS", "Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["2. RADAR Systemsn Greek;Times New Roman Tur;Times New Roman (Hebrew);Times New Roman (Arabic);Times New RADAR Systemsbic);Times New RADAR Systemsimes New RADAR SystemsRADAR Systems", "w Define abbreviations, terms, symbols and characteristics used in conjunction with RADAR systems. w State the purpose and use of the Surface Search, Air Search and Targeting RADAR systems. w Explain the basic operation of a Pulse, Continuous Wave (CW) and Doppler RADAR systems. aracteristics, capabilities and limitations of RADAR systems....pose and use of the Surface Search, Air Search and Targeting RADAR systems. w Explain the basic operation of a Pulse, Continuous Wave (CW) and Doppler RADAR systems. w State the military operational characteristics, capabilities and limitations of RADAR systems.ons of RADAR systems.", "w Define terms, abbreviations, and symbols used in conjunction with RADAR principles. w Convert Decibel and Power Ratio into standardized reference power (dBm). w Describe the composition of a basic RADAR system. w Identify the blocks of a basic RADAR system.", "1. RADAR Characteristics and Their Use 1 line item 2 here. item 2 here.e.e."], "jumps": []}, {"id": "P101", "text": ["w Describe a block diagram of a Pulse RADAR. w Understand Pulse RADAR circuit functions. w Describe Basic RADAR antennas.c", "3. Theory of Operatione ter objective 1 line item 2 here. item 2 here.e.e."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["This lesson introduces one of the more fascinating areas of electronics - RADAR. Although the technology has been in use since the 1940's, it has become indispensable."], "jumps": ["P300", "P410"]}, {"id": "P410", "text": ["RADAR is the extremely critical facet of military weapons systems. RADARs provide both initial detection and tracking information required to successfully engage an object. ather equipment to police speed detection system. Use Figure 5 A-100-141, Reference Planes page 1666"], "jumps": ["P400", "P420"]}, {"id": "P420", "text": ["Let's begin the lesson on INTRODUCTION TO RADAR CHARACTERISTICS............."], "jumps": ["P410"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The word RADAR is an acronym for RAdio Detection And Ranging. RADAR is a system that measures velocity and location to an object by determining the time required for an electronic signal to travel to the object, be reflected, and return to the point of transmission..."], "jumps": ["P1001", "P1030"]}, {"id": "P1030", "text": ["RADAR detects objects that cannot be seen by applying radio principles. The objects position, including its heading, bearing (azimuth), altitude, and speed may be detected..."], "jumps": ["P1040", "P1020"]}, {"id": "P1035", "text": ["BEARING- (Azimuth) The angle measured clockwise from true north (True Bearing) or from the heading line of a ship or aircraft (Relative Bearing) in the horizontal plane.."], "jumps": []}, {"id": "P1037", "text": ["HEADING - The compass direction in which the ship or aircraft is pointing and traveling. (according to a compass)."], "jumps": []}, {"id": "P1040", "text": ["RADAR operates on the principle that a pulse of energy is sent from a transmitter, strikes an object and a portion of it, called an echo, returns to the receiver and is displayed on a screen.", "$ ffffffffffffffffffffffff", "YY}}}}}}}}}}Y$ ffffffffffffffffffffffffff", "$ ffffffffffffffffffffffffffff", "$ ffffffffffffffffffffffffffffff", "ffffffffffffffffff ffffffffffff", "fffffffffffffff ffffffffffffff", "ffffffffffffff $$II-", "ffffffffffffff ffffffffffffff", "fffffffffff $$II-", "fffffffffffff ffffffffffffffff", "ffffffff $$II-"], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The concept is identical to a person shouting into a cave or canyon and hearing an echo. Although the concept appears simple, it took many years to develop the necessary technology."], "jumps": ["P1040", "P1060"]}, {"id": "P1060", "text": ["Unlike electrical energy's conventional electron flow along a conductor, Electromagnetic (EM) energy, such as RF energy is radiant and does not have electron flow. Radiation is energy moving through space in the form of waves."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["Electromagnetic waves occur naturally, such as the rays of the sun, or can be created through the acceleration of an electric charge. This wave of energy consists of alternating electric (E) and Magnetic (H) fields..."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["Fire Control RADAR systems use five reference planes, (1) Horizontal, (2) Vertical, (3) Deck, (4) Normal, and (5) Slant to determine object position."], "jumps": ["P1070", "P1090"]}, {"id": "P1090", "text": ["The Horizontal and Vertical Planes are both fixed. The Deck Plane is a moving plane, parallel to the ship's deck, with the Normal Plane perpendicular to it. The Slant plane is parallel to the Line of Sight and is variable..."], "jumps": ["P1080", "P1100"]}, {"id": "P1100", "text": ["The line from the RADAR set directly to the object is the LINE OF SIGHT (LOS). The length of this line is called RANGE. The angle between the LOS and Horizontal Plane is the ELEVATION ANGLE. The angle measured clockwise from true north in the horizontal plane is the TRUE BEARING or AZIMUTH..."], "jumps": ["P1090", "P1110"]}, {"id": "P1110", "text": ["While RADAR may operate on the same principle as an audio echo, the frequencies used are much higher. Even the lowest RADAR frequencies are very high. RADARs actually use microwave energy with frequencies ranging from 1 to 30 GHz...."], "jumps": ["P1100", "P1120"]}, {"id": "P1120", "text": ["RADAR frequencies, like radio frequencies, are separated into bands. Frequency bands are often reserved and assigned to specific RADARs."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["RADARs use high frequencies and high power. These two factors are the reason for using extreme caution when performing RADAR maintenance. Serious burns, electric shock, radiation poisoning, or death can occur if proper safety procedures are not followed..."], "jumps": ["P1120", "P1140"]}, {"id": "P1140", "text": ["What does the acronym RADAR mean?.........................."], "jumps": ["P1130"]}, {"id": "P1141", "text": [], "jumps": []}, {"id": "P1142", "text": ["Radiation is a characteristic of the high frequencies and high power used in a RADAR system. It is not part of the acronym for RADAR."], "jumps": []}, {"id": "P1143", "text": ["Radon is a heavy radioactive gas found in the air after radium decomposes. It is not part of the acronym for RADAR."], "jumps": []}, {"id": "P1150", "text": ["transmits a pulse of energy which strikes an object and a portion of it returns to be displayed on a screen.", "transmits a low audio frequency which strikes an object and a portion of it returns to be displayed on a screen. ........ on a screen.", "receives energy pulses from an object and displays them on a screen.", "A RADAR system _______on is typed.........................."], "jumps": ["P1140"]}, {"id": "P1151", "text": [], "jumps": []}, {"id": "P1152", "text": ["A RADAR system transmits an energy pulse then receives a portion of it back when it strikes an object. The principle is much like an echo."], "jumps": []}, {"id": "P1153", "text": ["Remember that RADARs use frequencies in the GHz range......"], "jumps": []}, {"id": "P1160", "text": ["What is the length of the LOS known as?...................."], "jumps": ["P1150"]}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1162", "text": ["Bearing - is the true or relative angle measured clockwise from true north or the heading of a ship or aircraft."], "jumps": []}, {"id": "P1163", "text": ["Azimuth- The angle measured clockwise from true north (True Bearing) or from the heading line of a ship or aircraft (Relative Bearing) in the horizontal plane."], "jumps": []}, {"id": "P1164", "text": ["Elevation is the angular position perpendicular to the RADAR's or earth's surface.."], "jumps": []}, {"id": "P1170", "text": ["Although RADAR systems have different applications and abilities, they share many similar components. While the operation of each component varies by system, the overall purpose of each remains the same..."], "jumps": ["P1160", "P1180"]}, {"id": "P1180", "text": ["RADAR systems can be functionally divided into nine subsystems."], "jumps": []}, {"id": "P1190", "text": ["The SYNCHRONIZER (TIMER) controls all RADAR system timing signals. Timing pulses are used to ensure synchronous circuit operation and are related to the Pulse Repetition Frequency (PRF)..."], "jumps": ["P1200", "PRF"]}, {"id": "P1195", "text": ["PULSE REPETITION FREQUENCY- (PRF) The number of transmitted pulses that are radiated in one second. PRF can also be called Pulse Repetition Rate (PRR). The formula for calculating PRF is: PRF=1/PRT"], "jumps": ["PRF", "PRR"]}, {"id": "P1200", "text": ["The MODULATOR contains a Pulse Forming Network (PFN) which produces a high voltage pulse to fire the transmitter."], "jumps": ["PFN"]}, {"id": "P1210", "text": ["The TRANSMITTER produces electromagnetic energy in the form of continuous waves or short, powerful pulses generated at precise intervals through the duplexer to the antenna."], "jumps": []}, {"id": "P1220", "text": ["The DUPLEXER is an RF switch that permits a RADAR system to use a single antenna to both transmit and receive."], "jumps": []}, {"id": "P1230", "text": ["The ANTENNA focuses the transmitted EM energy into a beam and radiates it out into space. It then catches the echo signal and sends it through the duplexer to the receiver."], "jumps": []}, {"id": "P1240", "text": ["The ANTENNA CONTROL system consists of electromechanical devices such as synchros, servos, and gyros that position the antenna correctly."], "jumps": []}, {"id": "P1250", "text": ["The RECEIVER amplifies and converts the returned RF echo into a video signal."], "jumps": []}, {"id": "P1260", "text": ["The VIDEO PROCESSOR analyzes the video signal from the receiver, detects inconsistent returns and shapes it for clarity."], "jumps": []}, {"id": "P1270", "text": ["The DISPLAY (Indicator) uses the processed video signals to give the operator a visual indication of object information such as range, bearing (azimuth), and elevation."], "jumps": []}, {"id": "P1280", "text": ["Engineers and Technicians express the gain of an active device (amplifier), or loss of a passive device (attenuator) in decibels, or dB. The dB level of a signal is a logarithmic comparison between input and output signals. So, a change of 11.76 dB is an increase of 15 times. From 5 watts to 75 watts - is 11.76 dB. From 5 milliwatts to 75 milliwatts - is 11.76 dB. From 10 watts to 150 watts - is 11.76 dB.is 11.76 dB............ 11.76 dB. From 10 watts to 150 watts - is 11.76 dB..."], "jumps": []}, {"id": "P1290", "text": ["The decibel only represents a change in power levels. In order to measure an amplifier's output power, a standard reference must be used. RADAR systems and power meters use 1 milliwatt (1 mW), or 0 dBm as the standardized reference."], "jumps": []}, {"id": "P1300", "text": ["It is easier to say that a reference signal has increased 50 dB than to say, output has increased 100,000 times. Whether the input power was increased from 1 watt to 100 watts or from 1,000 watts to 100,000 watts the amount of increase is still 20 decibels.ed 100,000 times. Whether the input power was increased from 1 watt to 100 watts or from 1,000 watts to 100,000 watts the amount of increase is still 20 decibels."], "jumps": []}, {"id": "P1310", "text": ["Note, an increase of 3 dB represents a doubling of power, and a decrease by 3 dB represents half the power is lost. A 1,000 mW signal decreased by 3 dB will equal 500 mW, while a 1,000 mW signal increased by 3 dB equals 2,000 mW..."], "jumps": []}, {"id": "P1320", "text": ["The dB is used to measure the power output of RADAR transmitters and sensitivity of RADAR receivers. A plus (+) sign or ( no sign) indicates the output is larger than the reference; a minus (-) sign indicates the output is less than the reference. (+)dB, the Power Ratio is multiplied with the reference and (-) dB, the Power Ratio is divided into the reference.rence.rence.ence.e........"], "jumps": []}, {"id": "P1330", "text": ["Decibels can be expressed in relationship to 1 milliwatt (dBm). For example, 0 dBm is equal to 1mW, because 0 dB represents no change (power ratio of 1.0). (+) dBm indicate amplifier gain, while (-) dBm indicate a reduction. (-) dbm values are used extensively in the receiver section..."], "jumps": []}, {"id": "P1340", "text": ["A Rule of Thumb to remember is that decibels are added and power ratios are multiplied. Therefore, the power output equals 20,000 (power ratio) x 1 milliwatt (reference) or 20,000 milliwatts. Since milli is the metrics prefix for the ratio 1/1000, the most correct way to state the power output is 20 watts. ower Ratio) 10,000 x 2 = 20,0000000"], "jumps": []}, {"id": "P1350", "text": ["A 3 dB loss from -97 dBm to -94 dBm sounds insignificant, however it becomes very important when the number indicates receiver sensitivity in the decibel system. With -94 dBm, the receiver will only detect a signal twice as large as a signal at -97 dBm."], "jumps": []}, {"id": "P1360", "text": ["A -3 dB change _______the output by a _______.ut by a _______..."], "jumps": ["P1350"]}, {"id": "P1361", "text": [], "jumps": []}, {"id": "P1362", "text": ["-dB changes reduces the output. However, looking at the chart the power is reduced by half.."], "jumps": []}, {"id": "P1363", "text": ["-db changes reduce the output power. +db chnages increase the output power..."], "jumps": []}, {"id": "P1364", "text": ["-db chnages reduce the output power........................"], "jumps": []}, {"id": "P1370", "text": ["Under normal condition, the energy transmitted from a radar travels in a straight line at a constant speed. The speed of electromagnetic energy is considered equal to the speed of light, 186,000 miles per second..."], "jumps": []}, {"id": "P1380", "text": ["When referring to the speed of light in miles per second, it should be noted that this is statute miles, 5,280 feet. RADAR distance is measured in nautical miles, 6,080 feet."], "jumps": []}, {"id": "P1390", "text": ["The position of the antenna at the moment an echo returns is an instantaneous measurement of the object position. Object range is the distance, measured along the LOS, from the antenna to the object..."], "jumps": []}, {"id": "P1400", "text": ["Object range in a pulse RADAR is determined by measuring elapsed time while the pulse travels to and from the object. The range in nautical miles to an object can be found by using the following formula:istance. Given time (T) 365", "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx22222222222 ''''''''''''''''"], "jumps": []}, {"id": "P1410", "text": ["By knowing that electromagnetic energy travels 984 feet in one microsecond, the time it takes to travel 1 nautical mile can be found. Original P1210 New P1320"], "jumps": []}, {"id": "P1420", "text": ["You should note that the energy radiated by the RADAR does travel from the antenna, to the target, and back to the antenna. This is called a RADAR mile. The RADAR mile is 12.36 microseconds and is calculated by multiplying 6.18 x 2."], "jumps": []}, {"id": "P1430", "text": ["The distance to the target can be calculated by knowing the amount of time it takes the radiated energy to travel to the target and back."], "jumps": []}, {"id": "P1440", "text": ["How far is a RADAR mile in a measurement of time?.........."], "jumps": ["P1430"]}, {"id": "P1441", "text": [], "jumps": []}, {"id": "P1442", "text": ["6.18 microseconds is the time it takes electromagnetic energy to travel 1 nautical mile. Remember, a RADAR mile is there and back."], "jumps": []}, {"id": "P1443", "text": ["6080 feet is one nautical mile. Microseconds indicate time."], "jumps": []}, {"id": "P1450", "text": ["Many types of RADARs transmit and receive through one antenna. The time the transmitter is on and connected to the antenna is called transmit time. The pulse width of the transmitted pulse is the transmit time. $Back: P135000"], "jumps": []}, {"id": "P1460", "text": ["When the transmitter is using the antenna, the receiver is automatically disconnected to prevent it from getting damaged. During this time, the receiver will not receive any reflected energy..."], "jumps": []}, {"id": "P1470", "text": ["Receive time is when the receiver is active and connected to the antenna. At this time, the transmitter is disconnected from the antenna. This prevents signal loss."], "jumps": []}, {"id": "P1480", "text": ["The amount of time it takes the RADAR to switch from transmit to receive is called recovery time."], "jumps": []}, {"id": "P1490", "text": ["Recovery time and transmit time are considered lost time by the receiver and is called dead time."], "jumps": []}, {"id": "P1500", "text": ["it takes to switch from transmit to receive.", "The RADAR pulse width is the time _______.................."], "jumps": ["P1490"]}, {"id": "P1501", "text": [], "jumps": []}, {"id": "P1502", "text": ["The time the receiver is on is called receive time. It is starts at the trailing edge of one transmitted pulse and ends at the leading edge of the next."], "jumps": []}, {"id": "P1503", "text": ["The time taken to switch from transmit and receive does not produce a pulse and is called recovery time."], "jumps": []}, {"id": "P1510", "text": ["RADAR's have a minimum and maximum range through which electromagnetic energy can be transmitted."], "jumps": []}, {"id": "P1520", "text": ["Minimum range is how close a target can approach and still be detected. Minimum range of a RADAR system that transmits and receives through one antenna is determined by dead time."], "jumps": []}, {"id": "P1530", "text": ["The main factors determining minimum range are pulse width (PW) and recovery time. The wider a transmit PW is, the longer it takes before the receiver can listen for an echo. An increase in PW, will increase minimum range..."], "jumps": ["PW"]}, {"id": "P1540", "text": ["1 RADAR mile = 12.36 microseconds 1 Nautical mile = 6080 feet = 2026.6 yards Dividing 2026.6 yards by 12.36 microseconds = 164 yards/microsecond Minimum range (in yards) = (Pulse width + Recovery time) x 164 yards inimum range (in yards) = (Pulse width + Recovery time) x 164 yards", "The formula derived below is used to calculate the minimum range in yards."], "jumps": ["Pulse"]}, {"id": "P1550", "text": ["Maximum range is the farthest distance a target can be detected."], "jumps": []}, {"id": "P1560", "text": ["Maximum range is affected by several characteristics which include: frequency, peak power, pulse repetition time (PRT), and receiver sensitivity."], "jumps": ["P1570", "PRT"]}, {"id": "P1565", "text": ["SENSITIVITY- The minimum input signal required in a radio receiver or similar device, to produce a specified output signal having a specified signal-to-noise ratio. This signal input may be expressed as a power or voltage at a stipulated input network or impedance..."], "jumps": []}, {"id": "P1570", "text": ["Carrier frequency affects the maximum range when it is increased or decreased while all other characteristics remain constant. For example, if all other characteristics remain the same, and carrier frequency increases the maximum range is decreased."], "jumps": ["P1560"]}, {"id": "P1580", "text": ["Peak power is used to define the strength of a RADAR. Peak power is the maximum instantaneous power that a RADAR transmitter is capable of producing and is determined by the input power and associated components. Increasing peak power increases RADAR range. .........................................................................................................................."], "jumps": []}, {"id": "P1590", "text": ["Peak power x Pulse width Pulse repetition time", "The RADAR's power can also be expressed as average power. Average power is calculated by using peak power, pulse width and the pulse repetition time (PRT). If peak power is increased, average power also increases and so will maximum range..."], "jumps": ["PRT"]}, {"id": "P1600", "text": ["The length of one complete operating cycle can also affect the RADAR range. Pulse repetition time is the time for one complete operating cycle. The operating cycle begins with the leading edge of the transmitted pulse and ends at the leading edge of the next transmitted pulse..."], "jumps": []}, {"id": "P1610", "text": ["Pulse Repetition Time (PRT) 12.36 microseconds", "An increase in PRT will increase maximum range. This can be calculated by using this formula."], "jumps": ["PRT"]}, {"id": "P1620", "text": ["Hits Per Scan = 60/ RPM x PRF (Hz) 360", "HPS = 60/60 x 200 (Hz) = 200 = 0.56 360 3600", "HPS = 60/20 x 200 (Hz) = 600 = 1.67 360 360", "Antenna rotation rates also affect the maximum detection range of a RADAR. A slower antenna has a greater chance of detecting small objects at long ranges. The number of times the beam strikes the object is referred to as hits per scan (HPS). 0 360 360 360 360 360 360 360 360 3600000"], "jumps": []}, {"id": "P1630", "text": ["The last characteristic to affect maximum range is the receiver sensitivity. The more sensitive a receiver is, the less reflected energy it takes to detect a target. This sensitivity increases the distance at which a target can be detected..."], "jumps": []}, {"id": "P1640", "text": ["What happens to the maximum range of a RADAR if peak power decreases?"], "jumps": ["P1630"]}, {"id": "P1641", "text": [], "jumps": []}, {"id": "P1642", "text": ["When the peak power of the transmitted pulse increases, the range of the RADAR increases."], "jumps": []}, {"id": "P1643", "text": ["Peak power has a direct affect on RADAR range. It is the maximum power that a RADAR transmitter is capable of producing during the transmitted pulse."], "jumps": []}, {"id": "P1650", "text": ["Now let's look at some other important RADAR characteristics related to the transmission of electromagnetic energy. The first is called PRF, which is an acronym for Pulse Repetition Frequency. PRF can also be called PRR, Pulse Repetition Rate..."], "jumps": []}, {"id": "P1660", "text": ["PRF is the number of pulses radiated by a RADAR in 1 second. PRF is calculated by dividing the RADAR PRT into 1 second."], "jumps": ["P1560", "P1670"]}, {"id": "P1670", "text": ["Duty cycle (DC) represents the ratio of the time the transmitter is on to one cycle of operation. The formula used to calculate DC is: PW /PRT....er/Peak Power = PW /PRT................"], "jumps": []}, {"id": "P1680", "text": ["Average power (Pavg) is a measurement of the power over the entire PRT. Peak Power (Ppk) is the maximum power contained in just the transmitted pulse."], "jumps": ["Pavg", "Ppk"]}, {"id": "P1690", "text": ["Peak Power: Ppk = Pavg/DC Ppk = Pavg/(PW x PRF) Ppk = Pavg x PRT x PW F", "Average power: Pavg = Ppk x DC Pavg = (Ppk x PW)/PRT Pavg = Ppk x PW x PRF", "Where: Pavg = Average power Ppk = Peak Power DC = Duty Cyclee", "Average Power is normally measured with a power meter, but can be computed using the formulas below. Ppk = Pavg/DC Ppk = Pavg/(PW x PRF) Pavg = Ppk x PW x PRF Ppk = Pavg x PRT x PW= Pavg x PRT x PW= Pavg x PRT x PW Ppk = Pavg x PRT x PW Ppk = Pavg x PRT x PW Pavg x PRT x PWPavg x PRT x PW Ppk = Pavg x PRT x PW"], "jumps": ["PW", "Ppk"]}, {"id": "P1700", "text": ["Ppk = Pavg/(PW x PRF) Ppk = 20 x 103 = 1,000,000 watts or 1 Megawatt 20 x 10-6 x 103 DC = PW x PRF DC = 20 x 10-6 x 103 = 20 x 10-3 Ppk = Pavg/DC Ppk = 20 x 103 = 1 x 106 watts or 1 Megawatt 20 x 10-33333333", "Where: Pavg = 20,000 watts (20 x 103) PW = 20", "seconds (20 x 10-6) PRF = 1,000 or 103 hertz", "Peak power must be calculated more often than average power because most measurement instruments measure average power directly. Given, 20,000 watts Pavg, let's calculate for Peak Power. Ppk = Pavg/(PW x PRF) Ppk = ___20 x 103 ___ = 1,000,000 watts or 1 Megawatt 20 x 10-6 x 103 DC = PW x PRF DC = 20 x 10-6 x 103 = 20 x 10-3 Ppk = Pavg/DC Ppk = 20 x 103 = 1 x 106 watts or 1 Megawatt 20 x 10-3 20 x 10-333"], "jumps": ["PW"]}, {"id": "P1710", "text": ["RADAR resolution is a very important RADAR characteristic. RADAR resolution is the RADAR's ability to distinguish multiple targets from one another when they are close together."], "jumps": []}, {"id": "P1720", "text": ["There are two types of RADAR resolution. One is called Range resolution and the other is called Bearing or (Angular) resolution."], "jumps": []}, {"id": "P1730", "text": ["Range resolution is the ability of the RADAR to separate multiple targets on the same bearing. If range resolution is poor, multiple targets on the same bearing will appear as one on the display."], "jumps": []}, {"id": "P1740", "text": ["The pulse width of the RADAR plays a major role in the quality of range resolution. An accurate RADAR system should be able to distinguish between two targets separated by one-half the pulse width (PW)...", "$$$$$$$$$$$$$:eee ee:ee ee:$$$", "$$$$$$$$$$$$$eee e::e e::$$$$", "$$$$$$$$$$$$eee eeeeee ee$$$$", "$$$$$$$$$$$$$::ee e::e e::$$$$$", "$$$$$$$$$$$$::ee ee:ee eee$$$$", "$$$$$$$$$$$$$::e e:e e:$$$$$", "$$$$$$$$$$$$$:ee e:ee e::$$$$", "$$$$$$$$$$$$$$:ee e:ee e::$$$$$", "g :::$$$$$$$$$::::: :::::::::$$$$$$$$$$::::::", "g ::::$$$$:::: :::::::::::::::::::::", "gg :::$$$$$$$$$::::: :::::::::$$$$$$$$$::::::"], "jumps": ["PW"]}, {"id": "P1750", "text": ["Bearing (Angular) resolution is the ability of a RADAR system to separate objects at the same range but at different bearing or elevation angles."], "jumps": []}, {"id": "P1760", "text": ["Angular resolution depends on the range of the objects and the RADAR beam width."], "jumps": []}, {"id": "P1770", "text": ["A RADAR beam width is defined in terms of the HALF-POWER POINTS, (Points B and B'). The RADAR beam has maximum power along its centerline, point A. The beam pattern is made up of all half-power points from the centerline connected together..."], "jumps": ["Points"]}, {"id": "P1780", "text": ["The physical size and shape of the antenna determines beam size and shape. Antenna beams can vary from about 1 degree up to 60 degrees. Targeting RADARs have narrow beam widths.."], "jumps": []}, {"id": "P1790", "text": ["Two objects at the same range must be separated by at least one beam width to be separately distinguishable to the RADAR system. Good resolution will allow the RADAR to notice an aircraft launching a missile..."], "jumps": []}, {"id": "P1800", "text": ["Which RADAR characteristic indicates the on and off time for the transmitter?"], "jumps": ["P1790"]}, {"id": "P1801", "text": [], "jumps": []}, {"id": "P1802", "text": ["PRF is the pulse repetition frequency of the RADAR. PRF is the number of pulses radiated by a RADAR in 1 second."], "jumps": []}, {"id": "P1803", "text": ["PRT is the pulse repetition time. Pulse repetition time is the time for one complete operating cycle."], "jumps": []}, {"id": "P1810", "text": ["RADAR accuracy is the ability of the RADAR to determine range, bearing, and in some cases, height of an object. The primary factor affecting RADAR accuracy is resolution. Pulse Shape and atmospheric conditions also affect RADAR accuracy..."], "jumps": []}, {"id": "P1820", "text": ["The transmitted pulse should be a square wave with vertical leading and trailing edges. The pulse should rise quickly to its maximum amplitude, remain for the duration of the desired pulse time, and decay instantaneously to zero..."], "jumps": []}, {"id": "P1830", "text": ["Sloping Leading and trailing edges of the pulse adversely affect minimum range. A Sloping Trailing Edge extends the pulse width, which increases minimum range."], "jumps": []}, {"id": "P1840", "text": ["A Sloping Leading Edge provides no definite point from which to measure elapsed time since pulse transmission. Maximum Range needs a flat top for good average power and a narrow pulse width allows for greater object resolution..."], "jumps": []}, {"id": "P1850", "text": ["Atmospheric conditions affect the direction of the radiated RF waves through the process of REFRACTION. Refraction is the bending of RF waves caused by a change in the density of the medium (atmosphere) it passes through.h."], "jumps": []}, {"id": "P1860", "text": ["Particles suspended in the air, such as water droplets and dust particles act to diffuse RADAR energy through absorption, reflection, and scattering. These effects reduce the RADAR's usable range..."], "jumps": []}, {"id": "P1870", "text": ["Temperature Inversion and moisture lapse cause DUCTING. Channels or ducts of cool air sandwiched between the surface of the earth and a layer of warm air keep the RF energy trapped and can greatly affect RADAR performance..."], "jumps": ["P1880"]}, {"id": "P1875", "text": ["TEMPERATURE INVERSION- layers of warm air formed above layers of cool air. Start second line here."], "jumps": []}, {"id": "P1876", "text": ["MOISTURE LAPSE- is a decrease below the normal moisture content of the air just above the sea.here."], "jumps": []}, {"id": "P1880", "text": ["Ducting may extend the RADAR horizon beyond the normal range making the returned information unreliable."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on RADAR CHARACTERISTICS...."], "jumps": ["P1790", "P1001"]}, {"id": "P1920", "text": ["1. The word RADAR is an acronym for RAdio Detection And Ranging. RADAR is a system that measures velocity and location to an object by determining the time required for an electronic signal to travel to the object, be reflected, and return to the point of transmission.."], "jumps": []}, {"id": "P1930", "text": ["2. RADAR detects objects that cannot be seen by applying radio principles. The object's position, including its heading, bearing or azimuth, altitude, and speed may be detected...... indicator.r."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. RADAR operates on the principle that a pulse of energy is sent from a transmitter, strikes an object and a portion of it, called an echo, returns to the receiver and is displayed on a screen...roseconds.."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. Although RADAR systems have different applications and abilities, they share many similar components. While the operation of each component varies by system, the overall purpose of each remains the same..."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. Decibels can be expressed in relationship to 1 milliwatt (dBm). For example, 0 dBm is equal to 1mW, because 0 dB represents no change (power ratio of 1.0). (+) dBm indicates amplifier gain, while (-) dBm indicates a reduction. (-) dBm values are used extensively in the receiver section....."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6. 3D RADARs provide range, altitude and bearing information.."], "jumps": ["P1960", "P1999"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1970", "P1001"]}, {"id": "P2001", "text": ["There are several types of radar transmissions used today. The most commonly used types of transmission are: pulse modulation, continuous wave, frequency modulation, and pulse doppler...y.", "t and return, distance and direction can be measured by the timing of the returned pulses.C", "A pulse modulated radar sends RF electromagenetic energy out in short timed bursts. When the bursts strike an object and return, distance and direction can be measured by the timing of the returned pulses."], "jumps": ["P2030", "P2001", "P2040", "P2020"]}, {"id": "P2040", "text": ["Pulse RADAR systems are divided into two types, Search RADARs and Tracking RADARs. acking RADAR's use a directional scan and provide continuous data (range, bearing, elevation and speed) of an object..."], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["In a simple pulse RADAR, the Timer/Synchronizer controls the PRF of the transmitter and also provides a zero range start signal for the display. The transmitter generates the RFsignal and the Antenna radiates the Electromagnetic wave.ave..."], "jumps": ["P2040", "P2060"]}, {"id": "P2060", "text": ["Modern receivers are of the super heterodyne type because they provide good stability and extreme sensitivity. In the receiver, the echo signal is mixed with a Local Oscillator (LO) signal to produce an intermediate frequency (IF) signal lower than the TX frequency.itivity. In the receiver, the echo signal is mixed with a Local Oscillator (LO) signal to produce an intermediate frequency (IF) signal lower than the TX frequency."], "jumps": ["P2070", "P2050"]}, {"id": "P2065", "text": ["SUPER HETERODYNE RECEIVERS - pre-amplify the incoming RF energy before they are mixed with the LO signal and undergo additional amplification in multiple Intermediate Frequency (IF) amplifier stages..."], "jumps": []}, {"id": "P2070", "text": ["The IF/FILTER amplifies and filters extraneous signals from the IF. The SECOND DETECTOR produces a video signal from the detected IF, which is processed for display by the VIDEO AMPLIFIER...", "Pulse Doppler is a variation of pulse modulation. This type of transmission is used to eliminate stationary objects from the display.", "The Doppler compares the phase of the returned echo's to the phase of the transmitted pulse. A moving object returns a signal that is changing phase. A stationary object's phase is always the same..."], "jumps": ["P2060", "P2080", "P2090", "P2070", "P2100"]}, {"id": "P2100", "text": ["Pulse Doppler RADARs determine the velocity of an object by taking advantage of the Doppler effect and can distinguish between two objects with the same radial velocity, but at different ranges...."], "jumps": ["P2090", "P2110"]}, {"id": "P2110", "text": ["Pulse Doppler RADARs use a high PRF to detect a Doppler frequency from the object echo. High PRF's decrease the PRT, which could produce a BLIND SPOT IN RANGE or RANGE AMBIGUITY...."], "jumps": []}, {"id": "P2120", "text": ["BLIND SPOT IN RANGE can occur when an echo returns at the same time of the next transmission."], "jumps": []}, {"id": "P2130", "text": ["RANGE AMBIGUITY can occur when the echo from the first pulse returns after the second pulse is transmitted............"], "jumps": []}, {"id": "P2140", "text": ["Changing the PRF over a wide range can compensate for the BLIND SPOT IN RANGE and RANGE AMBIGUITIES. For example, the RADAR system could adjust the PRF based on the expected range of a designated object..."], "jumps": []}, {"id": "P2150", "text": ["Pulse Doppler RADARs must be able to compare the echo signal with a reference signal that is in phase (Coherent) with the transmitted pulse.."], "jumps": []}, {"id": "P2160", "text": ["Pulse Doppler RADARs control the transmitted phase to provide coherent detection. A Magnetron is used for the Transmitter and requires that the local oscillator be stable for a fraction of a cycle during one pulse period.;"], "jumps": []}, {"id": "P2170", "text": ["Automatic Frequency Control (AFC) allows the Stable Local Oscillator (STALO) to be locked to the magnetron frequency to compensate for frequency drift and age in components."], "jumps": []}, {"id": "P2180", "text": ["Samples of the transmitted and STALO signals are fed to the Coherent Oscillator (COHO) which locks-in the phase of the COHO until the next Transmitter pulse."], "jumps": []}, {"id": "P2190", "text": ["Klystrons, Traveling-Wave Tubes (TWT), and crossed-field amplifiers can also provide coherency. A Klystron fed by a Stabilized Master Oscillator (STAMO) makes up the TX signal."], "jumps": []}, {"id": "P2200", "text": ["The STAMO signal is mixed with the IF oscillator signal to provide one RF mixer input. The other RF mixer input is the received signal, which is made up of the Transmitter frequency plus or minus the Doppler shift."], "jumps": []}, {"id": "P2210", "text": ["The output of the RF mixer is the IF signal plus or minus the Doppler shift. The receiver then detects the Doppler shift and produces the video signal."], "jumps": []}, {"id": "P2220", "text": ["Moving objects may be distinguished from stationary objects by observing the video output of a phase discriminator on and A-Scope (amplitude vs. range). P2210"], "jumps": []}, {"id": "P2230", "text": ["Based on a single sweep (a), moving objects CANNOT be distinguished from fixed objects."], "jumps": []}, {"id": "P2240", "text": ["Notice lines (b) through (e), echoes from fixed objects remain constant throughout, but echoes from moving objects vary in amplitude from sweep to sweep at a rate corresponding to the Doppler frequency..."], "jumps": []}, {"id": "P2250", "text": ["The superposition of the successive A-scope sweeps is shown in line (f). The moving objects produce, with time, a butterfly effect on the A-scope."], "jumps": []}, {"id": "P2260", "text": ["Continuous wave RADAR transmits a constant flow of electromagnetic energy not referenced to time. CW RADARs cannot determine range and are used to indicate the objects velocity....."], "jumps": []}, {"id": "P2270", "text": ["When a continuous stream of energy is transmitted from a stationary RADAR and strikes a moving object the returned frequency is different from the transmitted frequency. A still object will return a frequency identical to the transmitted frequency..."], "jumps": []}, {"id": "P2280", "text": ["An object can move in any direction and at a wide range of speeds; therefore the radial velocity can change considerably. Stationary objects, such as a landmass, create no Doppler shift."], "jumps": []}, {"id": "P2290", "text": ["In addition, an object moving 90 degrees to the antenna will not produce a Doppler shift, because there is no change in the distance between the object and the antenna."], "jumps": []}, {"id": "P2300", "text": ["If the object moves straight at or away from the RADAR, radial velocity will equal the actual object speed. Inbound objects will have an increasing frequency, while outbound objects have a decreasing frequency...."], "jumps": []}, {"id": "P2310", "text": ["CW RADARs with a single antenna use a ferite circulator to act as a duplexer. However, Ferrite circulators are limited to lower power CW RADARs due to inherent transmitter to receiver leakage......"], "jumps": []}, {"id": "P2320", "text": ["Ferrite circulator leakage is about 20 to 30 dB down from the transmitter power level. For a 1 watt Transmitter, this would be 1 milliwatt. More leakage than this could damage the receiver.."], "jumps": []}, {"id": "P2330", "text": ["The basic CW RADAR has the same components found in pulse RADARs. The differences are the use of a separate antenna to receive, the use of filters to detect a Doppler shift, and the use of a CW transmitter..."], "jumps": []}, {"id": "P2340", "text": ["The filters are designed to operate in the IF range to reduce cost and detect a particular narrow frequency band."], "jumps": []}, {"id": "P2350", "text": ["The bands are set to cover the expected Doppler frequencies above and below transmitter frequency.", "Frequency modulation systems are similar to continuous wave in that they compare the frequency of the received signal to a fixed reference frequency. The difference is they can provide range and bearing information..."], "jumps": []}, {"id": "P2370", "text": ["Frequency Modulated CW (FM-CW) RADAR provides a way to measure the round-trip transit time of a transmitted signal by constantly changing the frequency to provide range."], "jumps": []}, {"id": "P2380", "text": ["Because a finite time is required for a signal to travel to an object and back, there will be a difference in instantaneous frequencies between the transmitted and received signals."], "jumps": []}, {"id": "P2390", "text": ["The greater the range, the greater the difference frequency (DF). A decreasing DF indicates an incoming object while an increasing DF indicates an outgoing object."], "jumps": []}, {"id": "P2400", "text": ["Mixing (heterodyning) the transmitted and the received signals produces a BEAT FREQUENCY or DIFFERENCE FREQUENCY (Fb) equal to the difference between the two frequencies. Graphic: Figure 1, FM-CW RADAR with Separate Transmit and Receive Antennas, page 70"], "jumps": []}, {"id": "P2410", "text": ["The high-pass filter attenuates the stronger signals from close objects to produce a beat frequency signal more uniform in amplitude, which is then sent to the indicator (display)."], "jumps": []}, {"id": "P2420", "text": ["What type of transmission uses the timing of pulses to detect an object's range and bearing?5"], "jumps": ["P2410"]}, {"id": "P2421", "text": [], "jumps": []}, {"id": "P2422", "text": ["Continuous wave RADAR transmissions use frequency deviations to detect an object's speed. It does not detect range and bearing."], "jumps": []}, {"id": "P2423", "text": ["Frequency modulation RADAR compares the phase of a return signal to the phase of a fixed reference signal. It does provide range and bearing information."], "jumps": []}, {"id": "P2430", "text": ["What is the phase shift of a stationary object?............"], "jumps": ["P2420"]}, {"id": "P2431", "text": [], "jumps": []}, {"id": "P2432", "text": ["A Doppler shift up or down comes from moving objects......."], "jumps": []}, {"id": "P2440", "text": ["What type of RADAR uses multiple antennas to transmit and receive RF energy?"], "jumps": ["P2430"]}, {"id": "P2441", "text": [], "jumps": []}, {"id": "P2442", "text": ["Pulse RADARs use a single antenna.........................."], "jumps": []}, {"id": "P2443", "text": ["Pulse-Doppler RADARs use a single antenna.................."], "jumps": []}, {"id": "P2444", "text": ["Pulse-Modulated RADARs use a single antenna................"], "jumps": []}, {"id": "P2450", "text": ["RADARs are classified according to their function.........."], "jumps": []}, {"id": "P2460", "text": ["The most common RADAR is the surface RADAR. Boats and ships use some variation of this RADAR for navigating around land and other vessels."], "jumps": []}, {"id": "P2470", "text": ["Surface Search RADAR provides the operator with range and bearing information of surface contacts, coastal navigation points and slow low flying aircraft.", "Current Frequency Bands Used by USA and NATO", "Most Surface Search RADARs operate in the I and J bands (10 GHz to 30 GHz)."], "jumps": []}, {"id": "P2490", "text": ["Surface Search RADARs have the following characteristics. ow PW's produce good range resolution at short ranges and increase accuracy. High PRR's permit maximum reflection from small reflecting objects, such as periscopes. Medium Ppk Power enhances the detection of small objects at line of sight distances. Wide Vertical Beam Widths compensate for pitch and roll and enhance aircraft detection. Narrow Horizontal Beam Widths permit accurate bearings and good bearing resolution...", "1. Maximum Range is limited to the RADAR horizon. 2. Narrow PW's produce good range resolution at short ranges and increase accuracy. 3. High PRR's permit maximum reflection from small reflecting objects, such as periscopes. 4. Medium Ppk Power enhances the detection of small objects at line of sight distances. 5. Wide Vertical Beam Widths compensate for pitch and roll and enhance aircraft detection. 6. Narrow Horizontal Beam Widths permit accurate bearings and good bearing resolution."], "jumps": []}, {"id": "P2500", "text": ["Air search RADARs are used by civilian and military organizations for the detection of aircraft. The Federal Aviation Administration uses both long and short range air search RADARs for commercial air traffic control.....?"], "jumps": []}, {"id": "P2510", "text": ["All branches of the military use air search RADARs for air traffic control and airborne threat detection. Most air search RADARs are 2D and provide range and bearing information of airborne targets.....", "Many Two Dimensional (2D) Air Search RADARs operate in the B, C and L bands, (0.3 to 0.75 GHz and 70 to 80 GHz)...", "Current Frequency Bands Used by USA and NATO"], "jumps": []}, {"id": "P2530", "text": ["Two Dimensional (2D) Air-Search RADARs have the following characteristics. Wide PW's and High Ppk Power aid in detecting small objects at great distances. Low PRR's permit greater maximum range. Wide Vertical Beam Widths ensure detection of objects from the surface to high altitudes and compensate for pitch and roll.", "1. Relatively low Transmit frequencies are used to permit long-range transmissions. 2. Wide PW's and High Ppk Power aid in detecting small objects at great distances. 3. Low PRR's permit greater maximum range. 4. Wide Vertical Beam Widths ensure detection of objects from the surface to high altitudes and compensate for pitch and roll."], "jumps": []}, {"id": "P2540", "text": ["Which type of RADAR would use a frequency of 20 GHz?......."], "jumps": ["P2530"]}, {"id": "P2541", "text": [], "jumps": []}, {"id": "P2542", "text": ["RADAR frequencies, like radio frequencies, are separated into bands. Frequency bands are often reserved and assigned to specific RADARs.."], "jumps": []}, {"id": "P2543", "text": ["Air search RADAR operates in the B, C, and L RADAR bands...", "Three dimensional (3D) Air-Search RADAR are used to provide the range, bearing and altitude information of an object.", "Current Frequency Bands Used by USA and NATO", "3D Air-Search RADARs are very high powered and operate in the E Frequency band..", "A highly specialized 3D RADAR, called precision approach RADAR (PAR) is used to land aircraft during periods of low visibility. This type of RADAR features extreme accuracy measured in inches. The PAR is aligned along the side of a runway and provides very accurate range, bearing and altitude information..n....."], "jumps": ["PAR"]}, {"id": "P2580", "text": ["One variation of this type of RADAR is mounted on aircraft carriers to provide fully automatic landings.", "Current Frequency Bands Used by USA and NATO", "Precision RADARs normally operate in the I and J bands....."], "jumps": []}, {"id": "P2600", "text": ["What type of information does a 3D RADAR provide?.........."], "jumps": ["P2590"]}, {"id": "P2601", "text": [], "jumps": []}, {"id": "P2602", "text": ["RADAR systems that provide only bearing and range are 2D RADARs. They use azimuth information to provide the bearing and range of an object.."], "jumps": []}, {"id": "P2610", "text": ["Weapons control is another area that uses RADAR. One type of RADAR system used is known as a tracking RADAR.", "They are used by both shipboard and shore-based missile and gun systems to locate targets and direct the weapon/gun systems to the target.", "This requires great accuracy and a fast reaction time. Tracking RADARs are able to provide continuous range, bearing and elevation data of one or more targets which makes them very accurate....", "Current Frequency Bands Used by USA and NATO", "Tracking RADARs normally operate in the F, I and J bands..."], "jumps": ["P2630"]}, {"id": "P2650", "text": ["Tracking RADARs (Weapons System RADARs) have the following characteristics. ry Narrow Pulse Width to increase range resolution Very Narrow Beam Width to provide continuous positional data...", "1. Very High Pulse Repetition Rate to increase Hits Per Scan. 2. Very Narrow Pulse Width to increase range resolution. 3. Very Narrow Beam Width to provide continuous positional data. all reflecting objects, such as periscopes. 4. Medium Ppk Power enhances the detection of small objects at line of sight distances. 5. Wide Vertical Beam Widths compensate for pitch and roll and enhance aircraft detection. 6. Narrow Horizontal Beam Widths permit accurate bearings and good bearing resolution."], "jumps": []}, {"id": "P2660", "text": ["All military and commercial aircraft carry some type of RADAR."], "jumps": []}, {"id": "P2670", "text": ["Airborne RADARs are used by aircraft for navigation,collision avoidance, weather avoidance, threat detection and weapons control. A single military aircraft may carry several RADARs: navigation, weather, altitude, search, and weapons control. search."], "jumps": []}, {"id": "P2680", "text": ["What type of RADAR would be used to detect and destroy an incoming missile?"], "jumps": ["P2670"]}, {"id": "P2681", "text": ["A 2D RADAR will only provide the bearing and range of an object. It does not provide required elevation information.", "A search RADAR will only provide the bearing and range of an object. It does not provide required elevation information.", "As you can see there are many types of RADAR and many uses for them."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on RADAR SYSTEMS.TLE........"], "jumps": ["P2670", "P2001"]}, {"id": "P2920", "text": ["1. Pulse RADAR systems are divided into two types, Search RADARs and Tracking RADARs. Tracking RADARs use a directional scan and provide continuous data (range, bearing, elevation and speed) of an object...."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2. Modern receivers are of the super heterodyne type because they provide good stability and extreme sensitivity. In the receiver, the echo signal is mixed with a Local Oscillator (LO) signal to produce an intermediate frequency (IF) signal lower than the TX frequency."], "jumps": []}, {"id": "P2940", "text": ["3. Pulse Doppler RADARs must be able to compare the echo signal with a reference signal that is in phase (coherent) with the transmitted pulse.."], "jumps": []}, {"id": "P2950", "text": ["4. The output of the RF mixer is the IF signal plus or minus the Doppler shift. The receiver then detects the Doppler shift and produces the video signal."], "jumps": []}, {"id": "P2960", "text": ["5. Moving objects may be distinguished from stationary objects by observing the video output of a phase discriminator on an A-Scope (amplitude vs. range)."], "jumps": []}, {"id": "P2970", "text": ["6. The basic CW RADAR has the same components found in pulse RADARs. The differences are the use of a separate antenna to receive, the use of filters to detect a Doppler shift, and the use of a CW transmitter...."], "jumps": []}, {"id": "P2980", "text": ["7. Mixing (heterodyning) the transmitted and the received signals produces a BEAT FREQUENCY or DIFFERENCE FREQUENCY (Fb) equal to the difference between the two frequencies. Graphic: Figure 1, FM-CW RADAR with Separate Transmit and Receive Antennas, page 70"], "jumps": []}, {"id": "P2990", "text": ["8. Surface Search RADARs have the following characteristics. rrow PW's produce good range resolution at short ranges and increase accuracy. High PRR's permit maximum reflection from small reflecting objects, such as periscopes. Medium Ppk Power enhances the detection of small objects at line of sight distances. Wide Vertical Beam Widths compensate for pitch and roll and enhance aircraft detection. Narrow Horizontal Beam Widths permit accurate bearings and good bearing resolution.", "1. Maximum Range is limited to the RADAR horizon. 2. Narrow PW's produce good range resolution at short ranges and increase accuracy. 3. High PRR's permit maximum reflection from small reflecting objects, such as periscopes. 4. Medium Ppk Power enhances the detection of small objects at line of sight distances. 5. Wide Vertical Beam Widths compensate for pitch and roll and enhance aircraft detection. 6. Narrow Horizontal Beam Widths permit accurate bearings and good bearing resolution."], "jumps": []}, {"id": "P2995", "text": ["9. Two Dimensional (2D) Air-Search RADARs have the following characteristics. and High Ppk Power aid in detecting small objects at great distances. Low PRR's permit greater maximum range. Wide Vertical Beam Widths ensure detection of objects from the surface to high altitudes and compensate for pitch and roll.", "1. Relatively low Transmit frequencies are used to permit long-range transmissions. 2. Wide PW's and High Ppk Power aid in detecting small objects at great distances. 3. Low PRR's permit greater maximum range. 4. Wide Vertical Beam Widths ensure detection of objects from the surface to high altitudes and compensate for pitch and roll."], "jumps": []}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2920", "P2001"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3020", "text": ["All RADAR systems require the same basic functions to operate. The typical pulse RADAR consists of nine subsystems: Timer, Modulator, Transmitter, Duplexer, Antenna, Antenna Control, Video Processor, Receiver, and Display. A Power Supply is required but not considered a RADAR subsystem..."], "jumps": ["P3030", "P3001"]}, {"id": "P3030", "text": ["Let's start at the heart of all pulse RADAR systems, the timing section."], "jumps": []}, {"id": "P3040", "text": ["Pulse RADAR systems are dependent on the timing section. The timer sets up a definite time relationship for all the RADAR circuits to operate from and ensures that the intervals between pulses are of the proper length..."], "jumps": []}, {"id": "P3050", "text": ["A trigger pulse is produced by the timing section.........."], "jumps": []}, {"id": "P3060", "text": ["All RADAR waveforms can be referenced back to the Synchronizer (Timer) trigger pulses. Notice the relationship of the Transmitter and Echo pulses, Receiver, Range Marks and Video Signal waveforms are synched to the Timing-Trigger pulse..."], "jumps": []}, {"id": "P3070", "text": ["The trigger pulse is sent to the Indicator (Display), Modulator in the Transmitter and Video Processor. This ensures that the indicator and Video Processor are synchronized with the modulator during the transmit pulse..."], "jumps": []}, {"id": "P3080", "text": ["This way, the pulses shown on the indicator will be synchronized to the pulses produced by the transmitter. The trigger pulse will be shown as the first pulse on the screen."], "jumps": []}, {"id": "P3090", "text": ["This pulse is a reference for measuring range. Any echo returned from distant targets will appear as a pulse on the indicator."], "jumps": []}, {"id": "P3100", "text": ["The spacing between the targets and the transmitter pulse represents distance between the RADAR and the target."], "jumps": []}, {"id": "P3110", "text": ["Which section does a pulse RADAR depends on for synchronization?"], "jumps": ["P3100"]}, {"id": "P3111", "text": [], "jumps": []}, {"id": "P3112", "text": ["The indicator displays the pulses, but it doesn't synchronize anything."], "jumps": []}, {"id": "P3113", "text": ["The transmitter is controlled by the input trigger that synchronizes the RADAR."], "jumps": []}, {"id": "P3120", "text": ["Let's look inside the transmitter section. When the trigger is received from the timer it is sent to the modulator in the transmitter section, which then produces the pulse that turns on the RF generator and amplifier section..."], "jumps": ["P3110"]}, {"id": "P3130", "text": ["Each time the modulator turns the transmitter on and off, the transmitter sends out a RF pulse. The rate at which the modulator does this determines the PRF of the RADAR.AR."], "jumps": []}, {"id": "P3140", "text": ["The operation of the modulator is based on a circuit called a Pulse Forming Network (PFN). The PFN is the component that creates the high voltage pulse used to fire (turn on) the transmitter..."], "jumps": ["PFN"]}, {"id": "P3150", "text": ["A PFN is nothing more than a high voltage, high current capacitive-inductive network. Other circuits found in the modulator protect the components from overload and possible damage..."], "jumps": []}, {"id": "P3160", "text": ["After the pulse is produced by the modulator, it is sent to the section(s) that produce and amplify the RF. There are two types of transmitters in common use the keyed-oscillator transmitter and the power-amplifier transmitter..."], "jumps": []}, {"id": "P3170", "text": ["The keyed-oscillator transmitter usually uses a magnetron to produce both the RF oscillations (the output frequency band, mentioned earlier) and the high power level needed for transmission. Basically, it includes everything in one stage..."], "jumps": []}, {"id": "P3180", "text": ["The power-amplifier transmitter, on the other hand, uses the system trigger pulse to set up a coherent oscillator (COHO). The output of this oscillator is then mixed with the output of a local oscillator in order to produce the desired output RF...", "The RF is then sent through a series of amplifiers (usually a multicavity klystron tube) to increase the power to the desired output power level."], "jumps": []}, {"id": "P3200", "text": ["The RF pulse is sent through the Duplexer and radiated into space by the Antenna."], "jumps": []}, {"id": "P3210", "text": ["Which of these parts of a transmitter would determine the operating band of a RADAR system?"], "jumps": ["P3200"]}, {"id": "P3211", "text": [], "jumps": []}, {"id": "P3212", "text": ["The output of the modulator determines the pulse repetition frequency, not the RF output frequency."], "jumps": []}, {"id": "P3213", "text": ["The output of the pulse-forming network determines the pulse repetition frequency, but not the RF output frequency.", "There are different types of antenna designs and each one transmits the energy beam in a different pattern. Although each type of radar antenna has a different pattern, the radiated energy travels through the atmosphere in a straight line..."], "jumps": ["P3210"]}, {"id": "P3230", "text": ["RADAR antennas are designed to be highly directional. The more directional an antenna is, the sharper the beam can be and still detect targets."], "jumps": ["P3220"]}, {"id": "P3240", "text": ["Let's look at some of the antenna designs. The parabolic antenna is used primarily for weapons control purposes. It is shaped much like a dish."], "jumps": ["P3220"]}, {"id": "P3250", "text": ["A truncated parabolic search antenna is what would be left if you cut away all but a strip from the center of a parabolic antenna. Oriented horizontally, this antenna is used for surface search and air search radars..."], "jumps": ["P3220"]}, {"id": "P3260", "text": ["Notice that by turning the truncated parabolic search antenna 90", ", it becomes a truncated parabolic elevation antenna. It establishes target elevation."], "jumps": ["P3220"]}, {"id": "P3270", "text": ["The orange-peel parabolic antenna produces a beam that is wide in the vertical plane and narrow in the horizontal plane."], "jumps": ["P3220"]}, {"id": "PINFO", "text": ["01-28-04 Converted from old TD01 - patty 01-28-04 Completed text and graphic revisions as per Ray Richards. mary 01-29-04 Reviewed lesson. frieda 01-30-04 Replaced graphic with misspelling. frieda 03-04-04 P1660, change 1/200 uS = 5 to 1/200 uS = 5,000. P3830, changed \"...bearing and altitude...\" to \"...range and altitude\" -Phil 03-23-04 Made text changes to P2310, P2320, and P3212. Made graphic changes to P1630, P1870, P3040, P3140, P3150, P3160, P3653, P3212, P1642, P1643, P1650, P1802, P1603 per Penny. -Sarah. 03-24-04 Reviewed changes. frieda 03-24-04 Changed graphic on P1280. mary 03-31-04 P1670 Deleted out of text Average Power/Peak Power and left in PW/PRT per phil miller. frieda 05-20-04 P3290, back button takes you to 2260, changed it to 3280. -Phil 03-18-05 P102", "01-28-04 Converted from old TD01 - patty 01-28-04 Completed text and graphic revisions as per Ray Richards. mary 01-29-04 Reviewed lesson. frieda 01-30-04 Replaced graphic with misspelling. frieda 03-04-04 P1660, change 1/200 uS = 5 to 1/200 uS = 5,000. P3830, changed \"...bearing and altitude...\" to \"...range and altitude\" -Phil", "01-28-04 Converted from old TD01 - patty 01-28-04 Completed text and graphic revisions as per Ray Richards. mary 01-29-04 Reviewed lesson. frieda 01-30-04 Replaced graphic with misspelling. frieda 03-04-04 P1660, change 1/200 uS = 5 to 1/200 uS = 5,000. P3830, changed \"...bearing and altitude...\" to \"...range and altitude\" -Phil 03-23-04 Made text changes to P2310, P2320, and P3212. Made graphic changes to P1630, P1870, P3040, P3140, P3150, P3160, P3653, P3212, P1642, P1643, P1650, P1802, P1603 per Penny. -Sarah. 03-24-04 Reviewed changes. frieda 03-24-04 Changed graphic on P1280. mary 03-31-04 P1670 Deleted out of text Average Power/Peak Power and left in PW/PRT per phil miller. frieda 05-20-04 P3290, back button takes you to 2260, changed it to 3280. -Phil 03-18-05 P10232, changed answer from A to B. -Penny", "The cylindrical parabolic antenna is used by some 3D radar and ground control precision approach radar. These antennas are very long and narrow, typically 14 feet by 2 feet."], "jumps": []}, {"id": "P3290", "text": ["The broadside array antenna is used by low frequency 2D air search radar. The front of the antenna resembles bedsprings."], "jumps": ["P3280"]}, {"id": "P3300", "text": ["Which type of antenna is shaped like a dish?..............."], "jumps": ["P3280"]}, {"id": "P3301", "text": [], "jumps": []}, {"id": "P3302", "text": ["The truncated parabolic antenna is electrically a section of the parabolic."], "jumps": []}, {"id": "P3303", "text": ["The orange-peel antenna is as long horizontal and narrow vertically.", "As antennas move they obtain range and azimuth (bearing) information, and sometimes altitude as well."], "jumps": ["P3300"]}, {"id": "P3320", "text": ["Antenna scans can be done mechanically or electrically."], "jumps": ["P3310"]}, {"id": "P3330", "text": ["In a mechanical scan, the antenna moves up, down, side to side or in a 360", "circle. Mechanical scans can gather range, azimuth and altitude information. The type of antenna movement depends on the type of antenna."], "jumps": ["P3310"]}, {"id": "P3340", "text": ["The newer, electronic scan moves the beam up and down the antenna to find elevation (altitude) information.e) information."], "jumps": ["P3330"]}, {"id": "P3350", "text": ["Altitude information is obtained only by specialized 3D radar antennas. Because a radar beam is very narrow, to obtain altitude information, the beam must be moved in the vertical direction...."], "jumps": ["P3340"]}, {"id": "P3360", "text": ["Which type of antenna scan is used to obtain altitude information?"], "jumps": ["P3350"]}, {"id": "P3361", "text": ["Target altitude can be identified using either electrical or mechanical antenna scans.", "Antenna design has great effect on how far a radar is able to transmit. The energy transmitted from the antenna travels in a straight line. It is limited by the horizon and cannot pass through solid objects..."], "jumps": ["P3380", "P3360"]}, {"id": "P3380", "text": ["A radar horizon is the farthest point on earth that the beam touches. Any object below the radar horizon will not be detected. Objects above the horizon are detected.", "While the range of land-based radar is affected by the horizon, it must also contend with terrain. Hills, mountains, buildings and trees can decrease the range of radar."], "jumps": ["P3350"]}, {"id": "P3400", "text": ["A simple solution to horizon and terrain limitations is to raise the antenna. This elevates the beam, increasing the distance the beam can travel."], "jumps": ["P3370"]}, {"id": "P3410", "text": ["You can calculate the radar horizon by using this formula: RADAR horizon (in nautical miles) = 1.23 x square root of antenna height."], "jumps": ["P3370"]}, {"id": "P3430", "text": ["Let's look at an example. A search radar's antenna rotates 360", "every six seconds. The transmitter is fired 1,350 times per second."], "jumps": []}, {"id": "P3440", "text": ["The radars PRF or pulse repetition frequency is the number of times the transmitter is fired per second."], "jumps": []}, {"id": "P3450", "text": ["By doing a little calculating you can see that the radar transmits 8,100 pulses per antenna revolution. .,350 x 6 = 8,100"], "jumps": []}, {"id": "P3460", "text": ["To increase range, the antenna speed could be decreased or the number of transmitted pulses could be increased."], "jumps": []}, {"id": "P3470", "text": ["What needs to be adjusted if a radar's range is being shortened by horizon?"], "jumps": ["P3450"]}, {"id": "P3471", "text": [], "jumps": []}, {"id": "P3472", "text": ["Adjusting the antenna speed and PRF are usually done to increase the strength of the return signal. It does not affect the horizon.", "Since one antenna is shared by both the receiver and the transmitter, a device is required to switch the antenna from receive to transmit.", "The Circulator or Duplexer switches the antenna to the transmitter to radiate the RF pulse and back to the receiver to collect the returned echo."], "jumps": ["P3470"]}, {"id": "P3500", "text": ["There are several types of Duplexers used in RADAR systems, such as the Circulator, RF Switch, Waveguide Duplexer and TR tube. Each will be discussed in more detail in later lessons."], "jumps": []}, {"id": "P3510", "text": ["Both the duplexer and circulator are based on resonant cavities principles. The physical construction of the devices guides the transmitted pulse from the transmitter to the antenna and the received energy from the antenna to the receiver..."], "jumps": []}, {"id": "P3520", "text": ["The receiver processes the returned energy or echoes from the antenna so that they can be displayed on the indicator. The output from the receiver is called RADAR video."], "jumps": ["P3510"]}, {"id": "P3530", "text": ["A basic pulse radar receiver has five sections: RF amplifier, mixer, low intermediate frequency amplifier, video detector and a video amplifier.ier."], "jumps": ["P3540", "P3520"]}, {"id": "P3540", "text": ["As the returned pulses cut through the antenna, small amounts of current are induced. There are many different currents flowing through the antenna but the RF tuner (in the RF amplifier) only selects the transmitted one as an input to the mixer..."], "jumps": ["P3520", "P3550"]}, {"id": "P3550", "text": ["Most contemporary radar receivers have an RF amplifier section which is normally a solid-state amp such as a tunnel diode...... resonance, XC = XL, only that frequency is allowed to pass."], "jumps": ["P3520", "P3560"]}, {"id": "P3560", "text": ["From the RF Amp section, the incoming RF is fed into a mixer that heterodynes the local oscillator frequency to an IF normally somewhere between 30 to 60 MHz. is tunable to a wide range of frequencies..."], "jumps": ["P3520", "P3570"]}, {"id": "P3570", "text": ["Commonly the local oscillator is a reflex klystron, a very stable voltage controlled device. than the input signal selected by the RF tuner. For the purpose of discussion, the LO will be at 30 MHz. This is referred to as gang tuning."], "jumps": ["P3520", "P3580"]}, {"id": "P3580", "text": ["As the result of the mixing, four output frequencies are produced: the original RF, the L.O. frequency, and the sum and difference of the RF and L.O.uencies and the difference between the frequencies..."], "jumps": ["P3520", "P3590"]}, {"id": "P3590", "text": ["The difference frequency is called the intermediate frequency (IF), and is the desired signal. It is selected by a resonant circuit tuned to the IF. All other frequencies are rejected and do not appear beyond this point..point.t..."], "jumps": ["P3520", "P3600"]}, {"id": "P3600", "text": ["The information carried by the original RF is still present in the IF signal, which is then applied to the IF amplifier."], "jumps": ["P3520", "P3610"]}, {"id": "P3610", "text": ["The IF amplifier is a series of cascade high gain amplifiers. Each stage is tuned to the 30 MHz IF frequency. Receiver sensitivity and bandwidth are determined by these stages."], "jumps": ["P3520", "P3620"]}, {"id": "P3620", "text": ["After the pulse modulated signal has been amplified by the IF amplifier, it is sent to the detector.tor."], "jumps": ["P3610", "P3630"]}, {"id": "P3630", "text": ["The detector rectifies the modulated signal and filters unwanted signals and high frequencies. The remaining signal is the echo. Another name for the detector is a demodulator because it extracts the information from the IF in preparation for the video amplifier..."], "jumps": ["P2600", "P3640"]}, {"id": "P3640", "text": ["The last section of the receiver is the video amplifier. Its purpose is to amplify the intelligence coming from the video detector to a high enough level to drive the indicator (display an echo).."], "jumps": ["P3620", "P3650"]}, {"id": "P3650", "text": ["Process pulses from the antenna for display.", "Process pulses to send out through the antenna.", "What function does the receiver perform?..................."], "jumps": ["P3620"]}, {"id": "P3651", "text": [], "jumps": []}, {"id": "P3652", "text": ["The transmitter provides the pulse to be sent by the antenna."], "jumps": []}, {"id": "P3653", "text": ["Timesharing is done in the antenna section. A duplexer, RF switch blade or other timesharing devices are used for this purpose."], "jumps": []}, {"id": "P3660", "text": ["The radar display (indicator) provides a visual means of viewing the targets. There are several different types of radar displays. By design, radar displays vary based upon the intelligence they provide and the most suitable presentation format.,sented..."], "jumps": ["P3670", "P3650"]}, {"id": "P3670", "text": ["The indicator must receive signals from the radar system such as triggers, video, and antenna information to display an echo."], "jumps": ["P3660", "P3680"]}, {"id": "P3680", "text": ["Triggers from the timer section are used to ensure that the indicator is synchronized with the rest of the radar. The video is processed energy from the receiver. The antenna information is used to align the indicator with the radar beam..."], "jumps": ["P3670", "P3690"]}, {"id": "P3690", "text": ["The triggers are applied to the indicator timing section, which then directs them to the sweep generator and the intensity gate. The function of the intensity gate is to blank the indicator when video shouldn't be displayed..."], "jumps": ["P3670", "P3700"]}, {"id": "P3700", "text": ["As the antenna moves it supplies position information by way of the synchro, which is then routed to the sweep generator."], "jumps": ["P3670", "P3710"]}, {"id": "P3710", "text": ["The sweep generator deflects an electron beam called a sweep across the face of the CRT each time the radar transmitter fires."], "jumps": ["P3670", "P3720"]}, {"id": "P3720", "text": ["The video amplifier receives video (target information) from the receiver and the range mark generator. The range mark generator, triggered by the timing section, produces range marks and the range bug..."], "jumps": ["P3660", "P3740"]}, {"id": "P3730", "text": ["The video amplifier receives video (target information) from the receiver and the range mark generator. The range mark generator, triggered by the timing section, produces range marks and the range bug..."], "jumps": ["P3720", "P3740"]}, {"id": "P3735", "text": ["RANGE BUG - A spot on the radar sweep or electronic cursor, brighter than the sweep or cursor itself, which can be moved along the sweep to indicate range from the radar location."], "jumps": []}, {"id": "P3740", "text": ["Range marks provide the operator an indication of range to the target under surveillance. The number of range marks appearing on the indicator depends upon the range of the sweep."], "jumps": ["P3690", "P3750"]}, {"id": "P3750", "text": ["The video amplifier mixes the radar video and range marks for application to the CRT. The CRT receives the intensity gate, radar video, range mark video, and sweep signals and uses them all to produce the display..."], "jumps": ["P3760", "P3730"]}, {"id": "P3760", "text": ["Which part of the radar produces range marks?.............."], "jumps": ["P3750"]}, {"id": "P3761", "text": [], "jumps": []}, {"id": "P3762", "text": ["The transmitter generates a pulse to be sent out through the antenna."], "jumps": []}, {"id": "P3763", "text": ["The receiver processes incoming signals from the antenna so that an echo can be seen on the display."], "jumps": []}, {"id": "P3770", "text": ["The most common type of radar display is the Plan-Position Indicator (PPI) which provides range and bearing information..n..c"], "jumps": ["P3780", "P3760", "PPI"]}, {"id": "P3780", "text": ["The display (CRT) of the PPI is circular. The center of the CRT represents the position of the radar itself. Around the CRT is a compass with 360", "marks, which provide a fixed bearing reference..."], "jumps": ["P3760", "P3790"]}, {"id": "P3790", "text": ["A luminous line called a sweep (a.k.a, a trace) radiates outward from the center of the CRT and rotates in a 360", "arc. The trace is aligned with the antenna and moves with it. There are several fixed rings, called range rings on the indicator. Their function is to provide a fixed range reference."], "jumps": ["P3800", "P3760"]}, {"id": "P3800", "text": ["Target range and bearing information is obtained through the use of a cursor and range bug. The cursor is rotated so that it is over the target. The range bug is then placed over the target. Digital readouts provide the target range and bearing..."], "jumps": ["P3770", "P3810"]}, {"id": "P3810", "text": ["The A Scan is common in weapons control systems. It provides only the target range and the relative strength of the returned echo. The transmitted pulse appears on the left side of the display."], "jumps": ["P3800", "P3820"]}, {"id": "P3820", "text": ["Any target echoes are to the right of the transmitted pulse. The farther from the transmitted pulse, the greater the range to the target. A readout is provided to give the range to the target."], "jumps": ["P3800", "P3830"]}, {"id": "P3830", "text": ["The range height indicator or B Scan is used with 3D radars. It provides the operator with range and altitude information. ."], "jumps": ["P3800", "P3840"]}, {"id": "P3840", "text": ["The sweep starts in the lower left side of the indicator. The sweep moves across the display as the antenna scans up and down. The bottom of the display is referenced to the horizon. Vertical range marks are provided so that the target range can be estimated..."], "jumps": ["P3830", "P3850"]}, {"id": "P3850", "text": ["The exponential position indicator is used with 3D air traffic control radars. The CRT consists of two separate displays."], "jumps": ["P3830", "P3860"]}, {"id": "P3860", "text": ["The top display is elevation or altitude information. The side of the display is the end of the runway or carrier deck. The bottom display is horizontal or azimuth information."], "jumps": ["P3830", "P3870"]}, {"id": "P3870", "text": ["The elevation display has a line going from the origin on the left to the right. This is the glide slope. It represents the perfect descent path for an aircraft. The azimuth display has a line going from the origin on the left to the right. It represents the center line of the runway into space..."], "jumps": ["P3830", "P3880"]}, {"id": "P3880", "text": ["The two displays work together like a gun sight. Notice the vertical lines, or range marks. They are widely spaced on the left and close together on the right. That is because the most critical part of air operations is landing..."], "jumps": ["P3830", "P3890"]}, {"id": "P3890", "text": ["This type of display gives the greatest accuracy when the aircraft is close to landing. It is called an EPI because of appearance of the display.", "RADARs are capable of providing valuable information such as target range, bearing, elevation and with some systems target speed. e basics will be presented as they pertain to a ship search radar..."], "jumps": ["P3830", "P3894", "P3896"]}, {"id": "P3896", "text": ["The radar can be thought of as the center of a compass and the radar beam as the compass needle. The search radar has an antenna that rotates in circles through 360"], "jumps": ["P3830", "P3898"]}, {"id": "P3898", "text": ["As the antenna rotates, the radar beam, or radiated electromagnetic energy is rotated 360", "as well. The bearing information provided by the radar is the position of the target as compared to a reference. The reference can either be the direction north or the bow of the ship.."], "jumps": ["P3830", "P3900"]}, {"id": "P3900", "text": ["Bearing information is expressed in degrees of rotation from the reference point. If the reference point is north, then the bearing information is called true bearing. If the bow of the ship is reference, then the bearing information is called relative bearing...."], "jumps": ["P3830", "P3902"]}, {"id": "P3902", "text": ["Altitude information is determined in a similar fashion. The surface of the earth is the reference. The angle of the radar beam that strikes the target is compared to the reference."], "jumps": ["P3830", "P3904"]}, {"id": "P3904", "text": ["Basic trigonometry is used to determine the altitude of the target. The known quantities are the angle of the beam which is theta (q) and the distance the beam travels to strike the target which is the hypotenuse. The two known are then used by the radar to calculate the unknown, the altitude of the target..."], "jumps": ["P3830", "P3910"]}, {"id": "P3910", "text": ["This completes the information on THEORY OF OPERATION......"], "jumps": ["P3894", "P3001"]}, {"id": "P3920", "text": ["1. All RADAR systems require the same basic functions to operate. The typical pulse RADAR consists of nine subsystems listed below. A Power Supply is required but not considered a RADAR subsystem...............or, Receiver, and Display. A Power Supply is required but not considered a RADAR subsystem.", "1. Synchronizer 2. Modulator 3. Transmitter 4. Duplexer (RF Switch) 5. Antenna 6. Antenna Control 7. Receiver 8. Video Processor 9. Display"], "jumps": []}, {"id": "P3930", "text": ["2. RADAR systems can supply:..............................", "Bearing information Altitude information Range information Speed information"], "jumps": []}, {"id": "P3940", "text": ["3. Characteristics of a RADAR system are:.................", "Pulse Repetition Time (PRT) Pulse Repetition Frequency (PRF) Power (peak and average) Duty cycle Antenna height and rotation speed Resolution Transmission methods (CW, FM, Doppler, PM)"], "jumps": ["PRT", "PRF"]}, {"id": "P3950", "text": ["4. RADAR displays include:e...............................", "A Scan B Scan PPI (Plan-Position Indicator) EPI (Exponential Position Indicator)or"], "jumps": ["Plan"]}, {"id": "P3960", "text": ["5. A RADAR receiver's sensitivity is determined at the IF amplifier stage.."], "jumps": []}, {"id": "P3970", "text": ["6. The number of times the modulator turns on and off determines its PRF..", "7. The most common type of radar display is the Plan-Position Indicator (PPI) which provides range and bearing information."], "jumps": ["PPI"]}, {"id": "P3999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P3970", "P3001"]}, {"id": "P5000", "text": [], "jumps": []}, {"id": "P5001", "text": [], "jumps": []}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["What is RF energy reflected from an object called? ? em?"], "jumps": []}, {"id": "P10211", "text": ["What does the RF energy reflected from an object provide to the RADAR system?"], "jumps": []}, {"id": "P10212", "text": ["What is the length of the LOS known as _______"], "jumps": []}, {"id": "P10213", "text": ["What is the most commonly used reference level in the decibel measurement system for RADAR?"], "jumps": []}, {"id": "P10214", "te let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
