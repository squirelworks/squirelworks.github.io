<script>
const book = {"title": "9395p305", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: THE CPUTLE sdf sdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe the earliest CPUs and the development of newer CPUs. w Discuss the impact that early choices had on the development of personal computers. w Describe the concept of pipelining and how it impacts CPU operation and speed......", "w Describe the internal components of a CPU. w Understand the functions of the internal components. w Understand RISC processors........................"], "jumps": []}, {"id": "P101", "text": ["w Describe how CPU naming conventions used to work. w Describe how CPU naming conventions have changed.................", "w Describe the shapes and functionality of early CPU sockets. w Describe the shapes and functionality of CPU slots........................"], "jumps": []}, {"id": "P300", "text": ["All personal computers, regardless of the manufacturer or the model, include a printed circuit board (PC board or sometimes just PCB) commonly called a motherboard."], "jumps": ["P410", "P300", "PC"]}, {"id": "P410", "text": ["The motherboard has a number of components either mounted directly on it or attached to it in some way. In this lesson, we will discuss the main component on any motherboard: the Central Processing Unit, or CPU..."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["If you think of the motherboard as the heart of the PC, then the CPU would be the brain. It is the single most important chip in the computer."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Let's begin the lesson on THE CPU.TITLE..................................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": ["The CPU performs all of the system's calculating and processing. Whether the computer is adding numbers or displaying pictures, whether you're writing a letter or figuring a payroll or playing a game, the CPU is doing the work of processing the data...", "Modern processors contain millions of transistors etched onto a tiny square of silicon, called a die."], "jumps": ["P1030", "P1001", "P1040", "P1020"]}, {"id": "P1040", "text": ["CPUs are sometimes referred to by the number of bits that they can handle at once. As an example, the very first single-chip CPU, the Intel 4004, is called a 4-bit chip because it can handle 4 bits of data at a time.", "Some chips can handle more data internally than externally, in which case the number is shown as a number of bits, followed by a slash, followed by another number.", "The higher number is the number of bits that the chip handles internally, while the lower number indicates the number of bits that the chip's input/output lines can handle at once.", "For example, the Intel 8086 was a 16-bit chip because it moved 16 bits in at once, processed all 16 bits at once, then moved all 16 back out together.", "The 8088, on the other hand, was an 8/16-bit CPU, because it moved 8 bits in, then moved another 8 bits in, then processed the 16-bits at once, then moved 8 bits back out, and then moved the other 8 bits back out..."], "jumps": ["P1030", "P1060", "P1040", "P1080", "P1090"]}, {"id": "P1090", "text": ["We'll be discussing the internal workings of the 8086 and the 8088, which have considerable historical importance as we shall see shortly. Although modern CPUs have become more complex, the basic principles are still the same..."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["The CPU is composed of two separate parts which work hand-in-hand."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["The Execution Unit (EU) is the part that actually does the system's calculating and processing, but it never talks directly to the outside world. he Bus Interface Unit (BIU) does all the talking, but doesn't actually participate in the calculations..."], "jumps": ["P1115", "P1100"]}, {"id": "P1115", "text": ["The Bus Interface Unit (BIU) does all the talking, but doesn't actually participate in the calculations.r talks directly to the outside world. The Bus Interface Unit (BIU) does all the talking, but doesn't actually participate in the calculations..."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["In essence, the execution unit manipulates the data, while the bus interface unit manipulates the flow of that data."], "jumps": ["P1130", "P1115"]}, {"id": "P1130", "text": ["The execution unit includes a sub-section called the Arithmetic Logic Unit (ALU), which handles both the actual arithmetic (adding, subtracting, etc.) and the logical operations (AND, OR, NAND, NOR, etc.)..."], "jumps": ["P1140", "P1100"]}, {"id": "P1140", "text": ["In addition to the calculator and logic circuitry, the ALU includes the Control System, which provides the path for the flow of instructions into the ALU, and the Flag Register (also known as the Status Register)..."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["The flag register is a special register which uses just nine bits to provide data relating to the conditions of operation of the ALU. Six of these bits represent the status of the results of an executed instruction. The other three represent the status of controls..."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["A flag is said to be set if the value is 1, or reset if the value is 0."], "jumps": ["P1170", "P1130"]}, {"id": "P1170", "text": ["The other part of the execution unit, the General Registers, consists of the Data Registers, the Pointer Registers, and the Index Registers."], "jumps": ["P1180", "P1130"]}, {"id": "P1180", "text": ["The data registers hold the intermediate results of the calculations done by the ALU. The pointer and index registers may be used in arithmetic or logic operations, but are normally used to specify a particular location in memory where data is to be read from or written to..."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["The Bus Interface Unit is the section responsible for obtaining the data from the system and feeding it into the ALU, then taking the results from the ALU and sending them back out again."], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["The BIU consists of three sections: the Bus Control Unit, the Address Control Unit, and the Instruction Queue."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["The Bus Control Unit is the section which is responsible for fetching the instructions and data for the ALU, for sending system control signals to (and receiving them from) other devices in the system, and for acting as the interface to the system's memory and I/O..."], "jumps": ["P1230", "P1190"]}, {"id": "P1215", "text": ["FETCHING - reading instructions and data from locations in memory."], "jumps": []}, {"id": "P1230", "text": ["The Address Control Unit is the section responsible for generating the address that gives the physical (actual) location in memory of the data or instruction. It has three subsections: the Instruction Pointer, the Segment Registers, and the Address Generator..."], "jumps": ["P1240", "P1190"]}, {"id": "P1240", "text": ["The instruction pointer is simply the register which identifies (or points to) the instruction to be executed next. Each time an indicated instruction is executed, the pointer increments, or moves to the next, thereby controlling the sequence of the program..."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["There are four segment registers. They are used to define a segment of memory, called a logical memory space, that is set aside for a particular purpose. These registers consist of up to 64 kilobytes of consecutive memory locations...", "The Code Segment Register points to the current code segment, which is where instructions are fetched from..", "The Data Segment Register points to the current data segment, which is where program variables and data are held.", "The Stack Segment Register points to the current stack segment. The stack is the actual sequence of instructions.d.", "The Extra Segment Register points to the current extra segment, which is also used for data storage, such as strings..."], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["The address generator is used in conjunction with the segment registers to generate the physical addresses for all the possible memory locations."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["The Instruction Queue is the temporary storage area for instructions that are to be executed by the EU. When the BIU prefetches instructions, they are stored in the instruction queue until needed..."], "jumps": ["P1280", "P1260"]}, {"id": "P1275", "text": ["PREFETCHING - When instructions are read from system memory and stored in the instruction queue before they are needed by the ALU, it is known as Prefetching."], "jumps": []}, {"id": "P1280", "text": ["The instruction queue is set up so that instructions are fetched from it for execution in the same order that they were prefetched. This is referred to as First In, First Out or FIFO.."], "jumps": ["P1290", "P1270"]}, {"id": "P1282", "text": ["The instruction queue is set up so that instructions are fetched from it for execution in the same order that they were prefetched. This is referred to as First In, First Out or FIFO.."], "jumps": ["P1290", "P1270"]}, {"id": "P1285", "text": ["FIFO - Think of cans of soft drinks in a vending machine. They load in at the top, and then come out the bottom, so the first one to go in is also the first one to come out."], "jumps": []}, {"id": "P1290", "text": ["The Bus Interface Unit is the section responsible for _______", "obtaining the data from the system and feeding it into the ALU..", "taking the results from the ALU and sending them back out again.."], "jumps": ["P1282"]}, {"id": "P1291", "text": [], "jumps": []}, {"id": "P1292", "text": ["The bus interface unit does more than obtaining the data from the system and feeding it into the ALU."], "jumps": []}, {"id": "P1293", "text": ["The bus interface unit does more than take the results from the ALU and send them back out again,"], "jumps": []}, {"id": "P1300", "text": ["Traditional CPU designs feature a large number of different instructions that the CPU understands. In theory, the more different ways a CPU can operate, the less work the programmer has to do..."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["Traditional designs like the Z-80 and the 486 have instruction sets with several hundred different instructions. Having access to a rich instruction set like this gives an expert assembly language programmer plenty of scope for creative and efficient code..."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["Surely, a CPU which can understand hundreds of different instructions must be better than one that can only understand 50, right? Well, not necessarily."], "jumps": ["P1330", "P1310", "P"]}, {"id": "P1330", "text": ["It turns out that very few programmers use the whole instruction set. There's just too much of it. Hardly any modern software is written in assembler. Most people write in easier-to-use high-level languages like C++ or Pascal.ascal.."], "jumps": ["P1340", "P1320", "P"]}, {"id": "P1340", "text": ["This means that the actual assembly code is generated by a C compiler, not a human being. In addition, compiler technology simply isn't up to the job of using complex instruction sets to their best advantage..."], "jumps": ["P1350", "P1330", "P"]}, {"id": "P1350", "text": ["Much of the power of the CPU's instruction set is wasted. For example, about 90% of the code written for the 386 uses only about 10% of the available instructions. The other 90% of the instructions practically never get used..."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["RISC (Reduced Instruction Set Computer) chips start from this point. RISC designs only have that 10% of instructions that actually get used regularly."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["Less common and more complex tasks can be broken down into a series of smaller RISC instructions instead. This allows RISC chips to be lean, mean, and mighty fast."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["In theory, they can be smaller, cheaper and easier to manufacture, less buggy, and require less time to design and bring to market. Most importantly, because they only have to do a few simple tasks, they can concentrate on doing them at high speed..."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["Although a RISC chip has to execute more instructions to complete a given task, it does this so fast that it ends up being faster than an equivalent CISC chip. At least, that's the theory."], "jumps": ["P1400", "P1380"]}, {"id": "P1392", "text": ["Although a RISC chip has to execute more instructions to complete a given task, it does this so fast that it ends up being faster than an equivalent CISC chip. At least, that's the theory."], "jumps": ["P1400", "P1380"]}, {"id": "P1395", "text": ["CISC - Complex Instruction Set Computer. This nickname was originated in order to distinguish between regular CPUs, with their full instruction sets, and RISC processors."], "jumps": []}, {"id": "P1400", "text": ["There are other benefits too: SC compilers are much easier to design, and their output code uses the CPU much more efficiently.", "RISC compilers are much easier to design, and their output code uses the CPU much more efficiently.", "Because RISC chips can't run existing software without major modifications, it would be easy to throw out all the baggage from the past and start again with a clean sheet of paper.", "Where the x86 instruction set started with the 8080 and has grown from there, a new RISC instruction set can be logically planned and optimized for speed.", "For example, a 386 instruction can be anything from one byte to eleven bytes long."], "jumps": ["P1410", "P1392", "P1420", "P1400", "P1430", "P1440"]}, {"id": "P1440", "text": ["This works fine on a 486, but it causes difficulties with more modern designs because the CPU has no way of knowing where one instruction stops and the next one starts until it actually runs it..."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["Tasks like keeping the pipeline filled and allocating different instructions to multiple integer units become almost impossible."], "jumps": ["P1460", "P1430"]}, {"id": "P1460", "text": ["RISC instructions, on the other hand, are all exactly the same length (usually 32 bits), so they can be easily distributed to the various sub-parts of the CPU."], "jumps": ["P1470", "P1430"]}, {"id": "P1470", "text": ["RISC had its origins in the early 1960's, and it has gradually become more popular ever since."], "jumps": ["P1480", "P1430"]}, {"id": "P1480", "text": ["Which is NOT an advantage of RISC processors??.............", "full-featured instruction set with custom instructions available for special taskss"], "jumps": ["P1430"]}, {"id": "P1481", "text": [], "jumps": []}, {"id": "P1482", "text": ["Smaller instruction set is one of the biggest advantages of a RISC processor."], "jumps": []}, {"id": "P1483", "text": ["Faster execution of instructions is one of the biggest advantages of a RISC processor.", "IBM did a lot of experimental RISC work, as did Stanford University and the University of California at Berkeley. The Power PC chip used by Apple Computer for its Power Macintosh line is basically an IBM design..", "RISC and CISC are not, however, destined to never meet. The Power PC, for example, is a very CISC-like RISC with over 100 instructions. As a comparison, the Acorn RISC Machine, or ARM processor, has a mere 34.."], "jumps": ["P1500", "P1480", "P1510", "P1490"]}, {"id": "P1510", "text": ["Even the x86 family is adopting RISC techniques. The Nx586, AMD K5 and K6, and the Pentium Pro all have RISC cores-a CPU within a CPU, if you like-and they 'translate' the fewer CISC instructions into a larger number of simpler RISC instructions before they execute them..."], "jumps": ["P1910", "P1490"]}, {"id": "P1910", "text": ["This completes the information on FUNCTIONING OF THE CPU...", "1. The CPU performs all of the system's calculating and processing. 2. Modern processors contain millions of transistors etched onto a tiny square of silicon, called a die."], "jumps": ["P1001", "P1490", "P1930"]}, {"id": "P1930", "text": ["3. CPUs are sometimes referred to by the number of bits that they can handle at once. As an example, the very first single- chip CPU, the Intel 4004, is called a 4-bit chip because it can handle 4 bits of data at a time."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["4. The CPU is composed of two separate parts: The Execution Unit (EU), which is the part that actually does the system's calculating and processing, and the Bus Interface Unit (BIU), which interfaces with the rest of the system but doesn't perform calculations."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["5. The execution unit includes the Arithmetic Logic Unit (ALU), which handles both the arithmetic and the logical operations, and the data registers, which hold the intermediate results of calculations..."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["6. The bus interface unit fetches the data from the system for the ALU, then sends the results back out again. 7. The bus control unit fetches instructions and data for the ALU, sends and receives control signals, and provides the interface to the system's memory and I/O.."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["8. The address control unit gives the physical location in memory of the data or instruction. 9. The instruction queue is the temporary storage area for instructions that are to be executed by the EU."], "jumps": ["P1960"]}, {"id": "P1980", "text": ["10. The instruction queue is set up so that instructions are fetched from it for execution in the same order that they were prefetched. This is referred to as First In, First Out or FIFO.", "11. Although a RISC chip has to execute more instructions to complete a given task, it does this so fast that it ends up being faster than an equivalent CISC chip. 12. RISC instructions are all exactly the same length.."], "jumps": ["P1990", "P1960", "P1999"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1990"]}, {"id": "P2001", "text": ["The motherboard has either a socket or a slot into which the CPU is inserted. The type of CPU must match the type of socket or slot on the motherboard, and the particular CPU must be supported by the motherboard's BIOS.", "Prior to the introduction of the Intel 80486 in 1989, an additional socket was required for a second processor chip, variously called a Math Co-processor, a Floating Point Unit (FPU), or a Numeric Processor Unit (NPU)..."], "jumps": ["P2030", "P2001", "P2040", "P2020"]}, {"id": "P2040", "text": ["This chip was very similar to the CPU but was built to handle a specialized sub-set of mathematical calculations involving fractions. Although the CPU can also do these calculations, the co-processor does them much faster..."], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["The following discussion introduces some of the more important milestones in the evolution of the CPU."], "jumps": ["P2060", "P2030"]}, {"id": "P2060", "text": ["The first single-chip microprocessor was the Intel 4004, introduced in 1971. Intel had been contracted to create a custom chip for a desktop calculator. After studying the requirements, they came up with a design for a flexible, multi-purpose chip..."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["This was the humble start of the computer revolution. The 4-bit 4004, a 16-pin Dual Inline Package, or DIP, contained 2,250 transistors and ran at just 108 kHz.", "By comparison, the clocks in today's machines run well over ten thousand times as fast. At the same time, the original 4-bit architecture has been increased to 64-bit, so for every word that the original chip processed, a modern chip will do 16 times as much.."], "jumps": ["P2080", "P2060", "P2090"]}, {"id": "P2090", "text": ["Overall, the modern CPU can process information hundreds of thousands of times as fast as the original!"], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["Intel followed up the 4-bit 4004 with the 8-bit 8008, and then in 1974 introduced the first really successful CPU, the 8080."], "jumps": ["P2110", "P2080"]}, {"id": "P2110", "text": ["It was a 40-pin DIP which contained 4,500 transistors and was used in most of the first generation microcomputers. It originally ran at 2 MHz, getting up to just over 3 MHz by the end of its market life.fe.", "In 1975, MOS Technologies (a group of ex-Motorola engineers) developed the 6502, a variant of the Motorola 6800 chip. It was manufactured by Commodore and contained 5,000 transistors. Like the Intel 8080, it was an 8-bit 40-pin DIP running at 2 MHz.."], "jumps": ["P2120", "P2100", "P2130"]}, {"id": "P2130", "text": ["The 6502 and its clones powered many of the better-known early microcomputers, including Commodore's Pet and C64, the Apple II family, and many early Apple clones. The 6502 had an external math co-processor, unlike the Intel 8080, which had none...", "Programmers loved the 6502 because of its simple but powerful architecture. It had a long and successful market life. Only the Intel 8088 and Zilog Z-80 have been more successful."], "jumps": ["P2140", "P2120", "P2150", "P2130"]}, {"id": "P2150", "text": ["Zilog was founded by a group of ex-Intel engineers who set out to improve on the 8080 but still maintain compatibility with it. They released a 40-pin DIP, the 6,000-transistor Z80 in July of 1976..."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["The Zilog Z-80 was probably the most successful single model of microprocessor of all time. It was at the heart of most of the microcomputers of the late 1970's."], "jumps": ["P2170", "P2140"]}, {"id": "P2170", "text": ["Apple and Commodore used the 6502, but nearly all the other successful manufacturers used a Z-80. Like the 6502, the Z-80 was both powerful and simple."], "jumps": ["P2180", "P2140"]}, {"id": "P2180", "text": ["It introduced the idea of Single Instruction, Multiple Data (SIMD) with its block move and copy instructions, and Zilog continued to push the clock speeds higher over the years, starting at 2.5 MHz and reaching as high as 12 MHz."], "jumps": ["P2190", "P2140"]}, {"id": "P2182", "text": ["It introduced the idea of Single Instruction, Multiple Data (SIMD) with its block move and copy instructions, and Zilog continued to push the clock speeds higher over the years, starting at 2.5 MHz and reaching as high as 12 MHz."], "jumps": ["P2190", "P2140"]}, {"id": "P2185", "text": ["SINGLE INSTRUCTION, MULTIPLE DATA (SIMD) - Prior to this, the CPU had to load an instruction each time that it was needed. SIMD allowed the instruction to remain active while new data was fetched for processing....", "The 8-bit Z-80 performed as well as the first-generation 16-bit CPUs, such as the Intel 8086, and is still in use (and still in production!) more than a quarter of a century later."], "jumps": ["P2200", "P2182"]}, {"id": "P2200", "text": ["Unfortunately, the 16-bit Z-800 and 32-bit Z-8000 were late in getting onto the market and were buggy when they arrived, so Zilog faded into the backgroud of personal computer history.", "I still have the old Z-800 in my PC, but my wife has a Z-8000."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["What was the first single-chip CPU?........................"], "jumps": ["P2200"]}, {"id": "P2211", "text": [], "jumps": []}, {"id": "P2212", "text": ["The Z-80 was not the first single-chip CPU. It was a third generation chip."], "jumps": []}, {"id": "P2213", "text": ["The 8080 was not the first single-chip CPU. It was a third generation chip.", "The decisive moment in computer history came when a (then) small sub-division of IBM couldn't afford to pay cash for their first choice CPU, the Motorola 68000. Instead they selected the 8088 for their new product, the IBM PC..."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["The Intel 8088 powered the original IBM PC, and all later x86 designs (286, 386, 486, Pentium, and so on) have built on that same foundation."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["The PC in IBM PC stood for Personal Computer. It was followed by the XT (eXTended PC), which had more expansion slots, a bigger power supply, and included a hard disk drive. The original PC didn't even have a hard disk available as an option..."], "jumps": ["P2250", "P2220"]}, {"id": "P2250", "text": ["The Motorola 68000 was generally regarded as the best choice, with its combination of simplicity and power, but it was expensive. In the end, the 8086 family ended up the most successful..."], "jumps": ["P2260", "P2220"]}, {"id": "P2260", "text": ["The main reasons for this were its backwards-compatibility with the 8080/8085 and Z-80 family, its relatively low price, and above all, the 8088 variant.", "Where the 8086 was fully 16-bit, the 8088 was a hybrid 8/16-bit design: 16-bit internally, with 8-bit I/O. This meant that system designers could use cheap and readily available 8-bit support chips, and reduce the cost of the system by hundreds of dollars..."], "jumps": ["P2270", "P2220", "P2280"]}, {"id": "P2280", "text": ["Performance was more-or-less satisfactory, and even though the Z-80 and 8085 machines were superior in performance, the dollar-factor was decisive: the 8088 sold well."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["After having selected the 8088 initially, it was too late for IBM to change the PC over to the 68000 because there would have been no backward compatibility. Instead, the 8088 sold in the millions and, as an all-time success story, is second only to the Z-80....", "Unfortunately, Intel made some poor design decisions that plague the personal computer even today. The worst problem was that memory access was organized so badly that IBM felt compelled to limit the theoretical maximum RAM of the original PC to 640 k.."], "jumps": ["P2300", "P2270", "P2310"]}, {"id": "P2310", "text": ["These were shortsighted decisions, and the IBM-compatible world has suffered from them ever since. Of the IBM-compatible world, only true 32-bit operating systems (Windows NT, Windows 2000, Windows XP, OS/2, and Linux) avoid this problem..."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["What was the biggest single factor influencing the choice of the Intel 8088 for the CPU of the original IBM PC?"], "jumps": ["P2300"]}, {"id": "P2321", "text": ["The 8088 processor was not as fast as other processors available at the time.", "The 8088 processor was no more reliable than other processors available at the time."], "jumps": []}, {"id": "P2330", "text": ["The Motorola 68000 was first released in 1979, and was later chosen by Apple for the Macintosh computer and by Commodore for the Amiga."], "jumps": ["P2320", "P2340"]}, {"id": "P2340", "text": ["It was the best of the 16-bit CPUs, but it was expensive. The 68000 powered almost everything that didn't have an 8086 or 8088: Apple's Lisa and then Macintosh, Commodore's Amiga, the Atari ST, and others..."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["The design has stood the test of time. Both it and its descendents (the 68020, 68030, and 68040) are still in use today as embedded industrial controllers. 68000 code tends to be small, fast, and efficient..."], "jumps": ["P2360", "P2330"]}, {"id": "P2360", "text": ["The two factors which ended its use as a computer chip were that Commodore ceased production of the Amiga, and Apple switched over to the PowerPC chip for its Macintosh computers."], "jumps": ["P2370", "P2350"]}, {"id": "P2370", "text": ["The Intel 80286 (usually referred to just as the 286) was introduced in 1982. Its 134,000 transistors were packaged as a 68-pin DIP and there was an available 80287 co-processor."], "jumps": ["P2380", "P2350"]}, {"id": "P2380", "text": ["It supported a 16-bit architecture (known as AT, for Advanced Technology), virtual memory (a technique which allows a part of the hard drive to be used to simulate a large block of RAM), and was available at clock speeds of 8, 10, 12, and 16 MHz.."], "jumps": ["P2390", "P2370"]}, {"id": "P2390", "text": ["The 286 was around 20 times faster than the 8088. The 8 MHz machines were always rare, since people who could afford to buy 286's could usually afford 12 MHz or 16 MHz models."], "jumps": ["P2400", "P2370"]}, {"id": "P2400", "text": ["The Intel 80386 was a huge advance over the 8086 and the 80286. It had three different modes of operation: Real Mode, Protected Mode, and Virtual Real Mode."], "jumps": ["P2410", "P2370"]}, {"id": "P2405", "text": ["MODE OF OPERATION - the manner in which the CPU sees and manages the system's memory and the tasks that use it."], "jumps": []}, {"id": "P2410", "text": ["The original IBM PC used an 8088, which was a 16-bit chip (internally) with a 16-bit instruction set and built-in limitations that prevented it from accessing more than one megabyte of RAM."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["All software written for the original IBM PC used these specifications. A system operating within these constraints is said to be operating in the Real Mode."], "jumps": ["P2430", "P2400"]}, {"id": "P2430", "text": ["The 80386, on the other hand, was a 32-bit chip with a 32-bit instruction set and the ability to (theoretically) access up to four gigabytes of RAM."], "jumps": ["P2440", "P2400"]}, {"id": "P2440", "text": ["An important improvement was the ability to control the memory in such a way as to allow multiple programs to run simultaneously while being protected against overwriting each other in memory. This is known as Protected Mode..."], "jumps": ["P2450", "P2400"]}, {"id": "P2450", "text": ["The 386 could switch back and forth between protected mode and real mode, and it introduced a third mode called Virtual Real Mode."], "jumps": ["P2460", "P2440"]}, {"id": "P2460", "text": ["Since a real mode session can only access 1MB of memory, and since protected mode prevents multiple programs from interfering with each other, it's possible for a 386 to run several real mode sessions simultaneously, each within its own virtual (emulated) real-mode (16-bit) machine..."], "jumps": ["P2470", "P2440"]}, {"id": "P2470", "text": ["In other words, in virtual real mode the chip can handle several different programs at the same time, and each of these programs thinks it has a complete 8086 all to itself.", "Later it was produced as two distinct versions: the 386DX and 386SX. The DX version was a full 32-bit chip, while the SX used 32 bits internally but only had a 16-bit data bus. This made it less capable, but cheaper to produce.."], "jumps": ["P2480", "P2460", "P2490"]}, {"id": "P2490", "text": ["The 386SX was the first attempt in an ongoing strategy by manufacturing companies to produce a low-cost alternative to their previous generation of product.", "Essentially, modern chips like the AMD Athlon and the Intel Pentium family are just very fast 386DXs. Modern software uses the 386 architecture; the newer chips just do the same things faster..."], "jumps": ["P2500", "P2480", "P2510"]}, {"id": "P2510", "text": ["The 386 was available in both a Pin Grid Array (PGA) package and a Quad Flat Pack (QFP), with speeds ranging from 16 MHz to 40 MHz."], "jumps": ["P2520", "P2500", "PGA"]}, {"id": "P2520", "text": ["Like the earlier x86 chips, the 386SX provided for an external math co-processor, or FPU. There was an 8087 to go with the 8086 or 8088, a 287 for a 286, or a 387 for a 386."], "jumps": ["P2530", "P2500"]}, {"id": "P2530", "text": ["A standard CPU is already very good at doing integer (whole number) math, and the vast majority of computer tasks involve simple integers.", "When calculations involving fractions are required, the CPU is capable of doing them, too, though more slowly. However, some uses require many complex fraction calculations. Examples are scientific and engineering work, CAD, and 3D graphics..."], "jumps": ["P2540", "P2520", "P2550"]}, {"id": "P2550", "text": ["The FPU is specifically designed for doing floating point math (the term used to describe computer calculations involving fractions), and does it many times faster than the CPU. Nearly all 386 boards have a socket for an FPU..."], "jumps": ["P2560", "P2540"]}, {"id": "P2560", "text": ["The 80486 didn't introduce any new programming instructions. Instead, the innovations that it brought were in the nature of hardware. A 486 is actually just a fast 80386DX CPU plus an 80387 FPU plus 8k of cache RAM, all on a single chip..."], "jumps": ["P2570", "P2550"]}, {"id": "P2570", "text": ["With three components combined into a single chip, it's no wonder that the 486 was physically much larger than a 386."], "jumps": ["P2580", "P2560"]}, {"id": "P2580", "text": ["By putting the cache and the FPU on the same die with the CPU, the whole process speeds up. In addition, the 486 refined the idea of pipelining instructions. To understand pipelining, imagine putting out a fire with buckets of water...", "If you are alone, you have to walk to the well, fill the bucket, walk to the fire, empty the bucket, walk back to the well, and so on. This is how a 386 works-going to the RAM, getting an instruction, decoding and running it, then going back to the RAM for the next one...", "Now imagine having four or five people to help put the fire out. One fills the buckets, one empties them onto the fire, and the others pass the buckets along."], "jumps": ["P2590", "P2560", "P2600", "P2610"]}, {"id": "P2610", "text": ["You're still only pouring one bucket at a time, but it's much faster because each bucket is waiting for you when you're ready for it, instead of you waiting for the bucket."], "jumps": ["P2620", "P2600"]}, {"id": "P2620", "text": ["CPU pipelining works the same way. Instructions are loaded one after another into the RAM end of the pipeline and the CPU just takes them from the other end as needed. All modern CPUs are heavily pipelined..."], "jumps": ["P2630", "P2600"]}, {"id": "P2630", "text": ["As with almost all new CPU designs, early models of the 486 were not much faster than the best of the 386's, but they were much more expensive."], "jumps": ["P2640", "P2620"]}, {"id": "P2640", "text": ["It is usually only when a design is in its second or third revision (e.g. 386DX-40, 486DX/2-66, Pentium-75 and up) that it really becomes powerful, reliable, and cost-effective."], "jumps": ["P2650", "P2630"]}, {"id": "P2650", "text": ["The 486SX was developed mostly for marketing reasons-to give Intel a relatively cheap chip to compete with the AMD 386DX-40 without undercutting their profitable 486DX-33."], "jumps": ["P2660", "P2630"]}, {"id": "P2660", "text": ["The SX was essentially a DX with the math co-processor disabled. This involved one extra step in the manufacturing process, so the cheap 486SX actually cost more to make than the expensive 486DX..."], "jumps": ["P2670", "P2650"]}, {"id": "P2670", "text": ["But how could they sell it for less when it cost more to make? Because the actual manufacturing cost was so low that the small extra expense wasn't significant and they could still sell it at a reasonable margin..."], "jumps": ["P2680", "P2660"]}, {"id": "P2680", "text": ["Eventually they started making SX chips without an FPU, which saved them a few thousand transistors. The SX also gave them a market for DX chips which passed the testing for the main processor but failed in testing the co-processor. Sort of recycling, as it were...", "A similar strategy is employed by chip manufacturers with regards to chip clock speeds. Chip manufacturers do not intentionally produce different speeds of chips.", "Instead, they produce the chips assuming they will all be of the highest clock speed. All chips are then tested for proper operation at this highest speed."], "jumps": ["P2690", "P2660", "P2700", "P2710"]}, {"id": "P2710", "text": ["Early in the manufacturing cycle, most do not pass. Those that don't are tested at the next lower clock speed, and then the next, and the next, until the chip either passes operational testing or is deemed to be defective.ective..."], "jumps": ["P2720", "P2700"]}, {"id": "P2720", "text": ["As a new design and its associated manufacturing technology mature, the percentage of high-speed chips increases. In the past, there have been times when the demand for the lower-cost lower-speed chips has exceeded the supply...", "In that situation it is not unusual for the manufacturer to send out faster chips which have been marked as slower ones."], "jumps": ["P2730", "P2710", "P2740", "P2720"]}, {"id": "P2740", "text": ["What is the main difference between a 486DX and 486SX chip?", "The SX will not run at the same clock speeds.", "The SX is essentially a DX without a math co-processor."], "jumps": ["P2730"]}, {"id": "P2741", "text": [], "jumps": []}, {"id": "P2742", "text": ["The 486DX and 486SX run at exactly the same clock speeds..."], "jumps": []}, {"id": "P2743", "text": ["The 486DX and 486SX use exactly the same sockets..........."], "jumps": []}, {"id": "P2750", "text": ["The 80486DX/2 was based on the popular 486DX, but featured internal clock speeds that were twice the speed of the system bus. Thus, a DX/2 CPU on a system with a 25 MHz bus would run at 50 MHz..", "It was also available at 66 MHz for system buses of 33 MHz, and later versions went as high as DX/4-120."], "jumps": ["P2760", "P2740", "P2770", "P2750"]}, {"id": "P2770", "text": ["Usually, when Intel found the market for a CPU getting crowded, they would move on to the next performance grade as fast as they could. The DX/2 was an exception.", "For the first time Intel was forced to cut their prices to compete with AMD. As a consequence, the Intel DX/2 was inexpensive, and therefore became very popular."], "jumps": ["P2780", "P2760", "P2790", "P2770"]}, {"id": "P2790", "text": ["All Intel 486-66 chips were traditional 5-volt parts, as were the early AMD ones. Later versions from AMD and all the IBM-Cyrix DX/2s ran at 3.3 volts. Unlike the higher-voltage parts, 3.3 volt DX/2-66s didn't need a heat sink or fan..."], "jumps": ["P2800", "P2780"]}, {"id": "P2800", "text": ["Lowering the operating voltage reduced power consumption and heat generation, but required a step-down voltage regulator on the motherboard. Older boards didn't have this, so the 5-volt parts were always in demand for upgrades and were often hard to get...", "While it is relatively easy to make a CPU run faster, it's much more difficult to speed up a whole motherboard. Many of the parts just don't perform reliably at higher speeds.", "The IBM AT (286) decoupled the expansion bus (separated its functions from the clock that ran the rest of the motherboard), so that the video and I/O cards could run at a more reliable 8 MHz even though the motherboard and CPU were zipping along at much higher speeds..", "However, even the best motherboards were limited to about 40 MHz in those days, so to make a 50 or 66 MHz CPU work reliably, the entire motherboard had to be decoupled as well.", "This is a mixed blessing. It allows a faster CPU, but loses performance because access to anything off-chip (RAM in particular) is limited to motherboard speed - in this case, 25 MHz or 33 MHz."], "jumps": ["P2810", "P2790", "P2820", "P2800", "P2830", "P2840", "P2850"]}, {"id": "P2850", "text": ["Therefore CPU clock doubling is really motherboard clock halving. In itself, it doesn't make the CPU run any faster, it just lets the motherboard run more reliably with a fast CPU.", "CPU Clock doubling = Motherboard clock halving"], "jumps": ["P2860", "P2840"]}, {"id": "P2860", "text": ["The first clock-doubled x86, the 486DX/2-50, was a good example of this. It was not as fast as the full DX-50, but much more reliable in actual use. The popular and reliable clock-doubled DX/2-66 is no faster than a non-doubled DX-50...", "The first generation Pentiums (60 and 66) ran full-speed boards, but all subsequent CPUs are clock-multiplied. The Pentium-75, for example, ran at 1.5 times its 50 MHz main board, the Pentium-166 at 2.5 times 66 MHz."], "jumps": ["P2870", "P2850", "P2910", "P2860"]}, {"id": "P2910", "text": ["This completes the information on EVOLUTION OF THE CPU....."], "jumps": ["P2001", "P2870"]}, {"id": "P2920", "text": ["1. The math coprocessor is very similar to the CPU but is built to handle a specialized sub-set of calculations involving fractions. Although the CPU can also do these calculations, the co-processor does them much faster."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2. The first single-chip microprocessor was the Intel 4004, introduced in 1971. It was followed by the 8-bit 8008, and then in 1974, the first really successful CPU, the 8080..", "3. The 6502 had an external math co-processor, unlike the 8080, which had none. 4. The Zilog Z-80, released in July of 1976, was a 6,000-transistor 40-pin DIP. It was probably the most successful single model of microprocessor of all time.", "5. The Z-80 introduced the idea of Single Instruction, Multiple Data (SIMD) with its block move and copy instructions. 6. The 8088 was a hybrid 8/16-bit design: 16-bit internally, with 8- bit I/O........."], "jumps": ["P2940", "P2920", "P2950", "P2930", "P2960"]}, {"id": "P2960", "text": ["7. Poor design decisions in the 8088 included badly organized memory access, causing IBM to limit the maximum available RAM of the original PC to 640 k. 8. The Intel 80286, introduced in 1982, supported a 16-bit architecture and virtual memory."], "jumps": ["P2970", "P2950"]}, {"id": "P2970", "text": ["9. The Intel 80386 had three different modes of operation: Real Mode, Protected Mode, and Virtual Real Mode."], "jumps": ["P2980", "P2960"]}, {"id": "P2980", "text": ["10. The 80486 didn't introduce any new programming instructions. Instead, it was actually just a fast 80386DX CPU plus an 80387 FPU plus 8 k of cache RAM, all on a single chip..."], "jumps": ["P2990", "P2970"]}, {"id": "P2990", "text": ["11. CPU clock doubling is really motherboard clock halving. In itself, it doesn't make the CPU run any faster, it just lets the motherboard run more reliably with a fast CPU.", "CPU clock doubling = Motherboard clock halving"], "jumps": ["P2999", "P2980"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2990"]}, {"id": "P3001", "text": ["Each CPU will be identified in some way as to its socket requirements. A socket will typically have certain pins blocked off in order to make sure that only the correct chip can be inserted and that it is turned the right way."], "jumps": ["P3030", "P3001"]}, {"id": "P3030", "text": ["Socket 1 was used by the 80486 line. It is basically a grid of pins laid out in the shape of a rectangle with no pins in the center, and is called a Pin Grid Array. Sockets 2, 3, and 4 are similar except with different numbers of pins...", "Although earlier versions of Socket 1 were Low Insertion Force (LIF), later versions of Socket 1 (all virtually all later sockets) were of the Zero Insertion Force (ZIF) type.", "Although earlier versions of Socket 1 were Low Insertion Force (LIF), later versions of Socket 1 (and virtually all later sockets) were of the Zero Insertion Force (ZIF) type.", "LOW INSERTION FORCE (LIF) - A type of chip socket where the contacts have been specially designed to make secure electrical contact while putting minimal pressure against the pins. Note that low is a relative term: it still takes a lot of force to seat a CPU in a LIF socket."], "jumps": ["P3020"]}, {"id": "P3046", "text": ["ZERO INSERTION FORCE (ZIF) - A type of chip socket which has jaw-like contacts, with a lever which opens all of them up so that the pins of the chip can go all the way in without touching the jaws. When the lever is released, all the jaws close securely on the pins."], "jumps": []}, {"id": "P3050", "text": ["There weren't any significant differences between sockets other than the number of pins until Socket 5, which has a different pin pattern as well as modifications to support different voltages."], "jumps": ["P3040"]}, {"id": "P3060", "text": ["Socket 5 looks similar to earlier sockets except that alternate rows of pins are staggered, so the style is called a Staggered Pin Grid Array. This results in denser spacing of the pins. Also, the voltages supplied to the chip are different....."], "jumps": ["P3050"]}, {"id": "P3070", "text": ["Socket 7 has one additional pin compared to Socket 5, but uses a different Voltage Regulator Module (VRM)."], "jumps": ["P3050"]}, {"id": "P3080", "text": ["Socket 8 uses a much different pattern of pins: some of the pins are in a square pin grid array and the rest are in a staggered array. It was made exclusively for the Pentium Pro processor; no other chip uses this one.."], "jumps": ["P3050"]}, {"id": "P3090", "text": ["What is the reason for staggering the pins in a staggered pin grid array socket?", "spreading out the pins to dissipate more heatt", "denser spacing of the pins, resulting in a smaller chipp"], "jumps": ["P3080"]}, {"id": "P3091", "text": [], "jumps": []}, {"id": "P3092", "text": ["The staggered pins are not more spread out................."], "jumps": []}, {"id": "P3093", "text": ["The socket was designed to fit the chip, the chip wasn't designed to fit the socket."], "jumps": []}, {"id": "P3100", "text": ["Slot 1 was developed by Intel to replace their ZIF sockets for CPUs which have the L2 cache connected directly to the CPU but without being part of the same die.", "For Slot 1, the CPU was packaged in a 242 contact Single-Edge Contact Cartridge (SECC). The cartridge could contain up to two CPUs and an L2 cache. Intel's Pentium II, Pentium III, and some Celeron processors used the Slot 1 configuration..."], "jumps": ["P3090", "P3100"]}, {"id": "P3120", "text": ["Slot 2 was essentially a 330 contact version of Slot 1. The slot 2 cartridge could house as many as four processors and an L2 cache. Intel's Xeon processor used Slot 2."], "jumps": ["P3110"]}, {"id": "P3130", "text": ["processor. It had the same number of contacts as Intel's Slot 1, but the electrical requirements were very dif", "Slot A was developed by AMD for their Athlon processor. It had the same number of contacts as Intel's Slot 1, but the electrical requirements were very different."], "jumps": ["P3120"]}, {"id": "P3140", "text": ["With advances in manufacturing techniques, manufacturers began incorporating the L2 cache onto the die along with the processor and L1 cache."], "jumps": ["P3150", "P3130"]}, {"id": "P3150", "text": ["As a result, the added complexity and expense of a separate circuit board and slot for the CPU was no longer needed, so the socket regained favor."], "jumps": ["P3160", "P3140"]}, {"id": "P3160", "text": ["Socket 370 was designed to handle the newer Intel chips of both the Pentium and Celeron lines. It was essentially a staggered pin grid array."], "jumps": ["P3170", "P3140"]}, {"id": "P3170", "text": ["AMD's Socket A (Socket 462) was used for the Athlon and Duron processors as they, too, began incorporating the L2 cache onto the same die as the processor."], "jumps": ["P3180", "P3160"]}, {"id": "P3180", "text": ["Socket A used the same outside dimensions and layout as the Socket 370, but had 462 pins. It supported voltages from 1100 mV to 1850 mV in 25 mV increments."], "jumps": ["P3910", "P3160"]}, {"id": "P3910", "text": ["This completes the information on CPU SOCKETS.TITLE........"], "jumps": ["P3001", "P3160"]}, {"id": "P3920", "text": ["1. Socket 1, used by the 80486 line, is basically a grid of pins laid out in the shape of a rectangle with no pins in the center. It is called a Pin Grid Array. Sockets 2, 3, and 4 are similar except with different numbers of pins....."], "jumps": ["P3930", "P3001"]}, {"id": "P3930", "text": ["2. Socket 5 looks similar to earlier sockets except that alternate rows of pins are staggered, so the style is called a Staggered Pin Grid Array. This results in denser spacing of the pins.."], "jumps": ["P3940", "P3920"]}, {"id": "P3940", "text": ["3. Slot 1 was developed for CPUs which have the L2 cache connected directly to the CPU but without being part of the same die. 4. For Slot 1, the CPU was packaged in a 242 contact Single- Edge Contact Cartridge (SECC).", "5. The L2 cache is now incorporated onto the same die with the processor and L1 cache, so the added complexity and expense of a separate circuit board and slot for the CPU is no longer needed."], "jumps": ["P3950", "P3930", "P3960", "P3940"]}, {"id": "P3960", "text": ["6. Socket 370 was designed to handle the newer Intel chips of both the Pentium and Celeron lines. It was essentially a staggered pin grid array."], "jumps": ["P3970", "P3950"]}, {"id": "P3970", "text": ["7. AMD's Socket A (Socket 462) was used for the Athlon and Duron processors as they, too, began incorporating the L2 cache onto the same die as the processor.."], "jumps": ["P3999", "P3960"]}, {"id": "P3999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P3001", "P3960"]}, {"id": "P4001", "text": ["As marketing rather than technical considerations became ever more important, the once-clear distinctions between different products became ever more blurred. Not too many years ago, the names of CPU chips made their place in the world clear.", "It has not only become the norm for manufacturers to deliberately choose misleading names, it has become a requirement. With everyone else doing it, the manufacturer who doesn't is at a competitive disadvantage..."], "jumps": ["P4001", "P4030", "P4020"]}, {"id": "P4040", "text": ["It started, imperceptibly at first, in 1991. Oddly enough, while the object of the misnaming game is usually to make your chip sound faster or more advanced than it really is, the first instance of it was the other way around...", "The name The reality The reasonb", "Intel 486SX 486 \"SX\" had come to mean \"16/32-bit hybrid\", but these were fully 32-bitttttit", "Cyrix 486SLC 486SX An exact equivalent to the 386SX. Not much faster, either were fully 32-bitit", "Intel 486DX/4 486DX/3 the DX/2 was a clock-doubled 486; the DX/4 was only tripled, not quadrupledd-bitt", "Cyrix 5x86 586SX 32/64-bit hybrid design, like the 16/32-bit 386SX tripled, not quadrupledd-bitt", "AMD 5x86 486DX/4 In the sense that the 100MHz clock-tripled 486 was clearly a \"DX/3\", then that makes these a \"DX/5\". Any way you look at it, clearly a 486."], "jumps": ["P4030"]}, {"id": "P4050", "text": ["Intel needed to make their 486SX sound as though it were slower than their 486DX in order to justify the large difference in price.", "Intel 486SX 486 \"SX\" had some to mean \"16/32-bit hybrid\", but these were fully 32-bitttttit"], "jumps": ["P4040"]}, {"id": "P4060", "text": ["Remember, in those days floating-point was all but irrelevant to 95 percent of users, so the SX was every bit as good as a DX for most purposes. The SX suffix implied that, like the 386SX, the 486SX was slower..."], "jumps": ["P4040"]}, {"id": "P4070", "text": ["Cyrix produced what amounted to a turbo-charged 386SX with 486-like internal design features. By rights, this was the chip that deserved to be called a 486SX, as it was a 16/32-bit hybrid 486, just as the 386SX was a 16/32-bit hybrid 386...", "Cyrix 486SLC 486SX An exact equivalent to the 386SX. Not much faster, either were fully 32-bitit", "Intel 486SX 486 \"SX\" had some to mean \"16/32-bit hybrid\", but these were fully 32-bitttttit"], "jumps": ["P4040"]}, {"id": "P4080", "text": ["Cyrix's M1, or 6x86, from December of 1995, also bent the rules but in a much more subtle way. It was more advanced than the Intel 586 (Pentium) but less advanced than the true sixth-generation chips which were to follow - 51/286 might have been fair...", "The name The reality The reason", "Cyrix MII 6x86MX New name, same old chip. e 16/32-bit 386SX tripled, not quadrupledd-bitt", "P-III Coppermine Pentium III Improved design but only aluminum,not copper. K6-2. tripled, not quadrupledd-bitt", "Intel Celeron Pentium-II SX Billed as a 266, really about PR-200. ch faster, either were fully 32-bitit", "AMD K6-2 K6 3D or K6+ A borderline case. bout PR-200 t much faster, either were fully 32-bititi", "Intel Pentium III Pentium II SSE New name, same old chip. , but really should be K6-2. tripled, not quadrupledd-bitt", "AMD K6-III K6-2 Fair to give it a new name, but really should be K6-2. tripled, not quadrupledd-bittA", "Cyrix 6x86 51/2 86 or M1 Not a full generation ahead of the pentium. se were fully 32-bit fully 32-bitt"], "jumps": ["P4040", "Pentium"]}, {"id": "P4090", "text": ["However, it also introduced Processor Rating (or PR rating) instead of MHz as a measure of processing speed."], "jumps": ["P4080"]}, {"id": "P4100", "text": ["The 6x86MX was a sensible name for its successor (the M2), but halfway through its market life Cyrix introduced their MII - exactly the same chip but a brand-new name.", "Cyrix MII 6x86MX New name, same old chip. e 16/32-bit 386SX tripled, not quadrupledd-bitt", "Cyrix 6x86 51/2 86 or M1 Not a full generation ahead of the pentium. se were fully 32-bit fully 32-bitt", "51/2 86 or M1 Not a full generation ahead of the pentium. of the pentium. se were fully 32-bit fully 32-bitt", "Not a full generation ahead of the pentium. full generation ahead of the pentium. se were fully 32-bit fully 32-bitt", "6x86MX New name, same old chip. me, same old chip. e 16/32-bit 386SX tripled, not quadrupledd-bitt", "New name, same old chip. New name, same old chip. e 16/32-bit 386SX tripled, not quadrupledd-bitt"], "jumps": ["P4080"]}, {"id": "P4110", "text": ["There was only the flimsiest of technical excuses for this-its internal development name had originally been M2."], "jumps": ["P4100"]}, {"id": "P4120", "text": ["The reality was that the 6x86MX started life in competition with the Pentium MMX (and 6x86MX reflected this) but it's later versions were in competition with the Pentium II and the K6-2, so the marketing people judged MII more appropriate..."], "jumps": ["P4100"]}, {"id": "P4130", "text": ["To their credit, Cyrix never really tried to fool anyone into thinking that it was a new chip, but they needed to distinguish their product from the IBM 6x86MX."], "jumps": ["P4100"]}, {"id": "P4140", "text": ["AMD's K6-2 was another borderline case. It was unchanged from their K6 Classic except for the 3Dnow extensions and the ability to run bus speeds of 100 MHz..", "The name The reality The reason", "Cyrix MII 6x86MX New name, same old chip. e 16/32-bit 386SX tripled, not quadrupledd-bitt", "Cyrix 6x86 51/2 86 or M1 Not a full generation ahead of the pentium. se were fully 32-bit fully 32-bitt", "Intel Celeron Pentium-II SX Billed as a 266, really about PR-200. ch faster, either were fully 32-bitit", "AMD K6-2 K6 3D or K6+ A borderline case. bout PR-200 t much faster, either were fully 32-bitit", "Intel Pentium III Pentium II SSE New name, same old chip. , but really should be K6-2. tripled, not quadrupledd-bitta", "P-III Coppermine Pentium III Improved design but only aluminum,not copper. K6-2. tripled, not quadrupledd-bitt", "AMD K6-III K6-2 Fair to give it a new name, but really should be K6-2. tripled, not quadrupledd-bitt"], "jumps": ["P4100"]}, {"id": "P4150", "text": ["It was originally going to be called the K6-3D - a fair and accurate description - until AMD had a last minute change of heart. What's now known as the K6-III was going to be the K6-2 3D."], "jumps": ["P4140"]}, {"id": "P4160", "text": ["One last example: Intel's original Pentium III. It was really no more than a Pentium II with Streaming SIMD, not a new chip at all.", "Intel Pentium III , but really should be K6-2. tripled, not quadrupledd-bittM", "AMD K6-2 K6 3D or K6+ A borderline case. bout PR-200 t much faster, either were fully 32-bitit", "Pentium II SSE New name, same old chip. , but really should be K6-2. tripled, not quadrupledd-bitt", "New name, same old chip. m II SSE New name, same old chip. , but really should be K6-2. tripled, not quadrupledd-bitt"], "jumps": ["P4140"]}, {"id": "P4170", "text": ["Compare with the other two chips that introduced new multi-media instructions-the Pentium MMX and the K6-2."], "jumps": ["P4140"]}, {"id": "P4180", "text": ["All three had extended instruction sets which are of little value except for high-end graphic designers and games players. All three were manufactured on thinner wafers to reduce cost and increase clock speed..."], "jumps": ["P4140"]}, {"id": "P4190", "text": ["But this is routine stuff. Most chips have two or three process shrinks through their lifetime without being named as a whole new family. The 6x86 and the Pentium Classic had about five such process shrinks each...", "AMD K6-2 K6 3D or K6+ A borderline case. bout PR-200 t much faster, either were fully 32-bitit", "Intel Celeron Pentium-II SX Billed as a 266, really about PR-200. ch faster, either were fully 32-bititW", "Cyrix 6x86 51/2 86 or M1 Not a full generation ahead of the pentium. se were fully 32-bit fully 32-bitt", "The name The reality The reason", "Cyrix MII 6x86MX New name, same old chip. e 16/32-bit 386SX tripled, not quadrupledd-bitt", "AMD K6-III K6-2 Fair to give it a new name, but really should be K6-2. tripled, not quadrupledd-bitt", "Intel Pentium III Pentium II SSE New name, same old chip. , but really should be K6-2. tripled, not quadrupledd-bitta", "P-III Coppermine Pentium III Improved design but only aluminum,not copper. K6-2. tripled, not quadrupledd-bitt", "The Pentium MMX had twice as much cache and other detail changes and was about ten percent faster than a basic Pentium at the same clock speed."], "jumps": ["P4200", "P4140", "P4210", "P4190"]}, {"id": "P4210", "text": ["The K6-2 had a faster bus speed and was also about ten percent faster than the K6 Classic - a rather weak claim to a new name, but arguable.", "The name The reality The reason", "Cyrix MII 6x86MX New name, same old chip. e 16/32-bit 386SX tripled, not quadrupledd-bittm", "Cyrix 6x86 51/2 86 or M1 Not a full generation ahead of the pentium. se were fully 32-bit fully 32-bitt", "Intel Celeron Pentium-II SX Billed as a 266, really about PR-200. ch faster, either were fully 32-bitit", "AMD K6-2 K6 3D or K6+ A borderline case. bout PR-200 t much faster, either were fully 32-bitit", "AMD K6-III K6-2 Fair to give it a new name, but really should be K6-2. tripled, not quadrupledd-bittA", "Intel Pentium III Pentium II SSE New name, same old chip. , but really should be K6-2. tripled, not quadrupledd-bitt", "P-III Coppermine Pentium III Improved design but only aluminum,not copper. K6-2. tripled, not quadrupledd-bitt", "But outside of the new streaming SIMD instructions, the Pentium III had nothing to justify its name except a $420 million dollar TV campaign with the word Internet in it.", "The 2000 model Pentium-III was a substantially revised design, and would have deserved the P-III name, if they hadn't already used it."], "jumps": ["P4220", "P4200", "P4230", "P4210", "P4240"]}, {"id": "P4240", "text": ["Out of the most recent CPUs, the Pentium III had the most misleading name, but Cyrix was pretty good at the name game too. The MII-300 was really only PR-266, and the MII-333 was more like PR-300...", "The name The reality The reason", "Cyrix MII 6x86MX New name, same old chip. e 16/32-bit 386SX tripled, not quadrupledd-bitt", "Cyrix 6x86 51/2 86 or M1 Not a full generation ahead of the pentium. se were fully 32-bit fully 32-bitt", "Intel Celeron Pentium-II SX Billed as a 266, really about PR-200. ch faster, either were fully 32-bitit-", "AMD K6-2 K6 3D or K6+ A borderline case. bout PR-200 t much faster, either were fully 32-bitit", "Intel Pentium III Pentium II SSE New name, same old chip. , but really should be K6-2. tripled, not quadrupledd-bitt", "P-III Coppermine Pentium III Improved design but only aluminum,not copper. K6-2. tripled, not quadrupledd-bitt"], "jumps": ["P4250", "P4230"]}, {"id": "P4250", "text": ["For the most part, Intel has dominated the mainstream CPU market since they started it in 1971."], "jumps": ["P4260", "P4240"]}, {"id": "P4260", "text": ["Only four times have other chip makers succeeded in making a faster mainstream CPU. Zilog produced the Z-80 in 1976 and dominated the market with it until the rise of the 16-bit 8086 family in the early 1980's..."], "jumps": ["P4270", "P4250"]}, {"id": "P4270", "text": ["From there, Intel spent 18 consecutive years at the top until they stumbled with the Pentium Pro."], "jumps": ["P4280", "P4260"]}, {"id": "P4280", "text": ["Cyrix then took the lead with their 150MHz 6x86-200, which out-performed both the Pentium-200 and the Pentium Pro-200."], "jumps": ["P4290", "P4260"]}, {"id": "P4290", "text": ["Intel regained the lead with the Pentium MMX in January 1997, then AMD's K6 took over in March, and then Intel surged ahead again with the Pentium II in June of that year."], "jumps": ["P4300", "P4260"]}, {"id": "P4300", "text": ["The Pentium II/III held its lead until 1999, when AMD succeeded again with the K6-III/450, which was itself eclipsed by the Pentium III-550. The seesaw battle will probably continue for the forseeable future..."], "jumps": ["P4310", "P4260", "P"]}, {"id": "P4310", "text": ["Bear one thing in mind, though. We are talking about the x86 family and its forbears. In absolute terms, Intel has never had the fastest CPU in the world (apart from the 4004, of course, which for a short time was the only one)..", "4bit - 4004 was the fastest CPU for its time"], "jumps": ["P4320", "P4300"]}, {"id": "P4320", "text": ["The seriously fast chips are not in the x86 category at all. In the early days, they were things like the 16-bit Motorola 68000 and the 32-bit National Semiconductor 32032."], "jumps": ["P4330", "P4310"]}, {"id": "P4330", "text": ["Later on, the big name RISC chips took over. Hewlett-Packard's PA-RISC and IBM's PowerPC remain highly rated, but the leaders are Digital's Alpha and Sun's SPARC."], "jumps": ["P4340", "P4320"]}, {"id": "P4340", "text": ["It's wise to remember that the ultimate speed crown has little or no relevance to the average consumer. Only a handful of these hot-rod parts were affordable at the time they were introduced-the Z-80, perhaps the 8086 and the K6, and certainly the 6x86..."], "jumps": ["P4350", "P4330"]}, {"id": "P4350", "text": ["Don't look at things like the 286-8 or the 386DX-25 and laugh! These became very cheap later on when they sold in volume, but while they were the fastest thing in silicon they had four-figure price tags, and were very poor value for money..."], "jumps": ["P4910", "P4330"]}, {"id": "P4910", "text": ["This completes the information on MARKETING THE CPU........"], "jumps": ["P4001", "P4330"]}, {"id": "P4920", "text": ["1. While the object of misnaming a chip is usually to make it sound faster or more advanced than it really is, the first instance was just the opposite. IThe 486SX was named to sound as though it were slower than the 486DX in order to justify the difference in price.."], "jumps": ["P4930", "P4001"]}, {"id": "P4930", "text": ["2. Cyrix's M1, or 6x86, from December of 1995, introduced Processor Rating (or PR rating) instead of MHz as a measure of processing speed."], "jumps": ["P4940", "P4920"]}, {"id": "P4940", "text": ["3. Most chips used to have two or three process shrinks through their lifetime without being named as a whole new family.", "4. For the most part, Intel has dominated the mainstream (IBM compatible) CPU market since they started it in 1971."], "jumps": ["P4950", "P4930", "P4960", "P4940"]}, {"id": "P4960", "text": ["5. Zilog produced the Z-80 in 1976 and dominated the market with it until the rise of the 16-bit 8086 family in the early 1980's. From there, Intel spent 18 consecutive years at the top."], "jumps": ["P4970", "P4950"]}, {"id": "P4970", "text": ["6. In absolute terms, Intel has never had the fastest CPU in the world (apart from the 4004, which for a short time was the only one). The seriously fast chips are not in the x86 category at all.", "4bit - 4004 was the fastest CPU for its time"], "jumps": ["P4980", "P4960"]}, {"id": "P4980", "text": ["7. Hewlett-Packard's PA-RISC and IBM's PowerPC are highly rated, but the leaders are Digital's Alpha and Sun's SPARC.."], "jumps": ["P4990", "P4970"]}, {"id": "P4990", "text": ["8. The ultimate speed crown has little or no relevance to the average consumer. Only a handful of advanced parts were affordable at the time they were introduced."], "jumps": ["P4999", "P4980"]}, {"id": "P4999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P4001", "P4990"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 4, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 4, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 4, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["It performs all of the system's calculating and processing.", "It provides the attachment point for peripherals."], "jumps": []}, {"id": "P10211", "text": ["The Arithmetic Logic Unit and the Flag Register", "What are the two working parts of the CPU?", "The Arithmetic Logic Unit and the General Registers", "The Execution Unit (EU) and the Bus Interface Unit (BIU)", "The Data Registers and the Instruction Queue"], "jumps": []}, {"id": "P10212", "text": ["What is the purpose of the Arithmetic Logic Unit (ALU)?", "It handles both the arithmetic and the logical operations."], "jumps": []}, {"id": "P10213", "text": ["They hold the intermediate results of the calculations done by the ALU.", "What is the purpose of the data registers in the execution unit?", "They hold the address of the data that the ALU operates on.", "They indicate which data is to be used next.", "The data registers are not part of the execution unit."], "jumps": []}, {"id": "P10214", "text": ["A special register that indicates that there has been an error in a calculation.", "An indicator which tells the present status of an operational condition.", "An indicator which tells the ALU which instruction to execute next.", "An indicator that tells whether the result of a calculation is positive or negative."], "jumps": []}, {"id": "P10215", "text": ["The area in Main Memory where programs are stored until they are used.", "The temporary storage area for instructions that have already been executed by the EU.", "The temporary storage area for data which hasn't been used yet.", "The temporary storage area for instructions that are waiting to be executed by the EU."], "jumps": []}, {"id": "P10216", "text": ["A type of CPU with a full-featured instruction set", "A type of CPU which has only a limited number of instructions available", "A type of CPU which has user-definable instructions"], "jumps": []}, {"id": "P10217", "text": ["A type of CPU which has user-definable instructions.", "A type of CPU which has user-definable instructions", "A type of CPU with a large number of instructions available.", "n only execute instructions from the BIOS", "A type of CPU which has only a limited number of instructions available.", "A type of CPU which can only execute instructions from the BIOS."], "jumps": []}, {"id": "P10218", "text": ["What is the biggest single advantage of a RISC processor?", "It has user-definable instructions available.", "It runs more slowly so it doesn't make mistakes.", "It is much faster in executing instructions."], "jumps": []}, {"id": "P10219", "text": ["For any given RISC CPU, the instructions are all the same length.", "Which is a characteristic of RISC instructions?", "A RISC instruction is only a single byte in length.", "A RISC instruction incorporates several operations in a single instruction.", "It takes several RISC instructions to complete let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
