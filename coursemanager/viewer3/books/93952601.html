const book = {"title": "93952601", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: CAPACITIVE/INDUCTIVE REACTANCE & LCR CIRCUITSadf"], "jumps": []}, {"id": "P10", "text": ["CAPACITIVE/INDUCTIVE REACTANCE & LCR CIRCUITS"], "jumps": []}, {"id": "P100", "text": ["w Describe the effects of inductors and capacitors when used in the same circuit. w Calculate circuit values in a series LCR circuit. w Calculate circuit values in a parallel LCR circuit."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson you will learn about a circuit that contains \n inductance, capacitance, and resistance (LCR).", "In this lesson you will learn about a circuit that contains inductance, capacitance, and resistance (LCR)."], "jumps": []}, {"id": "P410", "text": ["Placing an inductor and capacitor in the same circuit produces \n interesting results.", "Placing an inductor and capacitor in the same circuit produces interesting results............."], "jumps": []}, {"id": "P420", "text": ["The capacitor and inductor work against each other!"], "jumps": []}, {"id": "P430", "text": ["Series and parallel LCR circuits have many uses in electronics.\nTheir operation is very important in the study of AC circuits.", "Series and parallel LCR circuits have many uses in electronics. Their operation is very important in the study of AC circuits................"], "jumps": []}, {"id": "P440", "text": ["Let's begin the lesson on CAPACITIVE/INDUCTIVE REACTANCE AND LCR CIRCUITS..."], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["In LCR circuits, the circuit effect of the inductor and the circuit \n effect of the capacitor cancel each other.", "In LCR circuits, the circuit effect of the inductor and the circuit effect of the capacitor cancel each other.........."], "jumps": []}, {"id": "P1030", "text": ["In fact, in some cases, the circuit reduces to a simple resistive\ncircuit.  The inductor and capacitor are electrically gone.  Let's\nsee why.", "In fact, in some cases, the circuit reduces to a simple resistive circuit. The inductor and capacitor are electrically gone. Let's see why........................"], "jumps": []}, {"id": "P1040", "text": ["Remember that in a resistor, voltage and current are in phase."], "jumps": []}, {"id": "P1050", "text": ["In an inductor, voltage leads current by 90 degrees."], "jumps": []}, {"id": "P1060", "text": ["In a capacitor, current leads voltage by 90 degrees."], "jumps": []}, {"id": "P1070", "text": ["Comparing the current in the inductor and capacitor shows that\nthe current is 180\u00ba out of phase.", "Comparing the current in the inductor and capacitor shows that the current is 180"], "jumps": []}, {"id": "P1080", "text": ["For example, at this point on the voltage cycle, the inductor\ncurrent lags voltage by 90\u00ba (voltage leads current, ELI).", "For example, at this point on the voltage cycle, the inductor current lags voltage by 90", "(voltage leads current, ELI).................."], "jumps": []}, {"id": "P1090", "text": ["At the same point on the voltage cycle, the capacitor current\nleads voltage by 90\u00ba (current leads voltage, ICE).", "At the same point on the voltage cycle, the capacitor current leads voltage by 90", "(current leads voltage, ICE). .........."], "jumps": []}, {"id": "P1100", "text": ["The inductor current and capacitor current are 180\u00ba out of phase.", "The inductor current and capacitor current are 180"], "jumps": []}, {"id": "P1110", "text": ["IL and IC oppose each other."], "jumps": []}, {"id": "P1120", "text": ["When IL is at the maximum positive point, IC is at the maximum\nnegative point.  They would combine to produce 0.", "When IL is at the maximum positive point, IC is at the maximum negative point. They would combine to produce 0. ............."], "jumps": []}, {"id": "P1130", "text": ["It is the same as two people pushing on an object in opposite\ndirections.", "It is the same as two people pushing on an object in opposite directions. ................"], "jumps": []}, {"id": "P1140", "text": ["The total force is the difference between the two forces.  If the\nforces are equal the result is no movement.", "The total force is the difference between the two forces. If the forces are equal the result is no movement. ............."], "jumps": []}, {"id": "P1150", "text": ["If one force is larger than the other the result is movement in one\ndirection.", "If one force is larger than the other the result is movement in one direction. ..........."], "jumps": []}, {"id": "P1160", "text": ["The inductors and capacitors in a circuit will affect current the\nsame way.", "The inductors and capacitors in a circuit will affect current the same way. ..........."], "jumps": []}, {"id": "P1165", "text": ["If XL and XC are equal in series or parallel circuits, they cancel.  Since there is no reactance it makes the circuit purely resistive.", "If XL and XC are equal in series or parallel circuits, they cancel. Since there is no reactance it makes the circuit purely resistive."], "jumps": []}, {"id": "P1170", "text": ["If XL is larger than XC in a series circuit, the voltage across XL\nis larger and eliminates the voltage across XC.  The circuit is\ninductive.", "If XL is larger than XC in a series circuit, the voltage across XL is larger and eliminates the voltage across XC. The circuit is inductive.........................."], "jumps": []}, {"id": "P1175", "text": ["VOLTAGE IN SERIES CIRCUITS - Remember, in a series circuit,\ncurrent is the same throughout the circuit.  Therefore, the voltage\ndrop of an inductor is 180\u00ba out of phase from the voltage drop of\nthe capacitor.", "VOLTAGE IN SERIES CIRCUITS - Remember, in a series circuit, current is the same throughout the circuit. Therefore, the voltage drop of an inductor is 180", "out of phase from the voltage drop of the capacitor."], "jumps": []}, {"id": "P1180", "text": ["If XL is smaller than XC in a series circuit, the voltage across XC\nis larger and eliminates the voltage across XL.  The circuit is\ncapacitive.", "If XL is smaller than XC in a series circuit, the voltage across XC is larger and eliminates the voltage across XL. The circuit is capacitive. ......................"], "jumps": []}, {"id": "P1182", "text": ["If XL is smaller than XC in a series circuit, the voltage across XC is larger and eliminates the voltage across XL. The circuit is capacitive...."], "jumps": []}, {"id": "P1183", "text": ["If XL is larger than XC in a parallel circuit, the current developed\nin XC is larger and cancels the current developed in XL.  The\ncircuit is capacitive.", "If XL is larger than XC in a parallel circuit, the current developed in XC is larger and cancels the current developed in XL. The circuit is capacitive. ..............."], "jumps": []}, {"id": "P1185", "text": ["If XL is smaller than XC in a parallel circuit, the current developed\nin XL is larger and cancels the current developed in XC.  The\ncircuit is inductive.", "If XL is smaller than XC in a parallel circuit, the current developed in XL is larger and cancels the current developed in XC. The circuit is inductive. ..............................."], "jumps": []}, {"id": "P1187", "text": ["VOLTAGE IN SERIES CIRCUITS - Remember, in a series circuit,\ncurrent is the same throughout the circuit.  Therefore, the voltage\ndrop of an inductor is 180\u00ba out of phase from the voltage drop of\nthe capacitor.", "VOLTAGE IN SERIES CIRCUITS - Remember, in a series circuit, current is the same throughout the circuit. Therefore, the voltage drop of an inductor is 180", "out of phase from the voltage drop of the capacitor."], "jumps": []}, {"id": "P1188", "text": ["VOLTAGE IN PARALLEL CIRCUITS - Remember, in a parallel circuit, voltage is the same across each branch. Therefore, the current in the inductor branch is 180", "out of phase from the current in the capacitor branch."], "jumps": []}, {"id": "P1189", "text": ["CURRENT IN PARALLEL CIRCUITS - Remember, in a parallel\ncircuit, voltage is the same across each branch.  Therefore, the\ncurrent in the inductor branch is 180\u00ba out of phase from the\ncurrent in the capacitor branch.", "CURRENT IN PARALLEL CIRCUITS - Remember, in a parallel circuit, voltage is the same across each branch. Therefore, the current in the inductor branch is 180", "out of phase from the current in the capacitor branch."], "jumps": []}, {"id": "P1190", "text": ["In an inductive, capacitive, and resistive (LCR) circuit, XL and XC oppose current flow at", "In an inductive, capacitive, and resistive (LCR) circuit, XL and XC oppose current at", "In an inductive, capacitive, and resistive (LCR) circuit, XL and XC oppose current flow at oppose current flow at"], "jumps": []}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1192", "text": ["Remember, ELI the ICE man. Voltage leads current by 90\u00ba in\ninductors.  Current leads voltage by 90\u00ba in capacitors.", "Remember, ELI the ICE man. Voltage leads current by 90", "in inductors. Current leads voltage by 90"], "jumps": []}, {"id": "P1200", "text": ["What is the type of series LCR circuit that has XC larger than XL?"], "jumps": []}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1202", "text": ["An inductive series LCR circuit has inductance larger than\ncapacitance, more voltage across XL.", "An inductive series LCR circuit has inductance larger than capacitance, more voltage across XL. LLLLLLLLLLLLLLLLL"], "jumps": []}, {"id": "P1203", "text": ["A resistive series LCR circuit has XC equal to XL.", "A resistive series LCR circuit has XC equal to XL.........."], "jumps": []}, {"id": "P1205", "text": ["What is the type of parallel LCR circuit that has XC larger than\nXL?", "What is the type of parallel LCR circuit that has XC larger than XL?"], "jumps": []}, {"id": "P1206", "text": [], "jumps": []}, {"id": "P1207", "text": ["A capacitive parallel LCR circuit has less XC than XL, more current flow in the capacitive branch.", "A capacitive parallel LCR circuit has less XC than XL, more current in the capacitive branch.", "\"A capacitive parallel LCR circuit has less XC than XL, more current", "A capacitive parallel LCR circuit has less XC than XL, more current flow in the capacitive branch. current flow in the capacitive branch."], "jumps": []}, {"id": "P1208", "text": ["A resistive parallel LCR circuit has XC equal to XL.", "A resistive parallel LCR circuit has XC equal to XL. ....."], "jumps": []}, {"id": "P1210", "text": ["The same formulas used to analyze RC and RL circuits are used\nto analyze LCR circuits.  Only small changes are made to account\nfor both XL and XC.", "The same formulas used to analyze RC and RL circuits are used to analyze LCR circuits. Only small changes are made to account for both XL and XC. ........................."], "jumps": []}, {"id": "P1220", "text": ["Let's first look at series LCR circuits."], "jumps": []}, {"id": "P1230", "text": ["Solving for ZT in a series RL or RC circuit uses this formula."], "jumps": []}, {"id": "P1235", "text": ["ZT = R2+ (XC)2 = 302 + 402 = 900 + 1600 = 2500 = 50 W", "ZT = R2+ (XL)2 = 302 + 522 = 900 + 2704 = 3604 = 60.03 W"], "jumps": []}, {"id": "P1240", "text": ["Solving for ZT in a series LCR circuit uses this formula."], "jumps": []}, {"id": "P1245", "text": ["ZT = R2+ (XL - XC)2 = 302 + 122 = 1044", "= 302+ (52 - 40)2 = 900 + 144 = 32.3 WWWWWWW"], "jumps": []}, {"id": "P1250", "text": ["The effect of XL and XC oppose each other (XL - XC).  Since XL is\nlarger, the circuit is inductive.", "The effect of XL and XC oppose each other (XL - XC). Since XL is larger, the circuit is inductive. ..........."], "jumps": []}, {"id": "P1260", "text": ["Once ZT is determined, calculate IT as in any series circuit.\nIT = EA/ZT", "Once ZT is determined, calculate IT as in any series circuit. IT = EA/ZT"], "jumps": []}, {"id": "P1270", "text": ["The voltage drops are calculated by multiplying IT by the\nindividual resistance or reactance.", "The voltage drops are calculated by multiplying IT by the individual resistance or reactance..............", "ZT = 32.3 W IT = 3.1 A ER = 92.9 V EC = 123.8 V EL = 161.0 V"], "jumps": []}, {"id": "P1272", "text": ["The voltage drops are calculated by multiplying IT by the\nindividual resistance or reactance.", "The voltage drops are calculated by multiplying IT by the individual resistance or reactance. ........", "ZT = 32.3 W IT = 3.1 A ER = 92.9 V EC = 123.8 V EL = 161.0 V"], "jumps": []}, {"id": "P1275", "text": ["ER = IT x R = 3.1A x 30 = 92.9 V EC = IT x XC = 3.1A x 40 = 123.8 V EL = IT x XL = 3.1A x 52 = 161.0 VV", "ZT = 32.3 W IT = 3.1 A ER = 92.9 V EC = 123.8 V EL = 161.0 V"], "jumps": []}, {"id": "P1280", "text": ["Last, calculate the applied voltage by using the voltage drops to\ncheck results. Remember, XL and XC oppose each other.", "Last, calculate the applied voltage by using the voltage drops to check results. Remember, XL and XC oppose each other. ...........", "ZT = 32.3 W IT = 3.1 A ER = 92.9 V EC = 123.8 V EL = 161.0 V EA = 100 V"], "jumps": []}, {"id": "P1282", "text": ["Last, calculate the applied voltage by using the voltage drops to\ncheck results. Remember, XL and XC oppose each other.", "Last, calculate the applied voltage by using the voltage drops to check results. Remember, XL and XC oppose each other. ...........", "ZT = 32.3 W IT = 3.1 A ER = 92.9 V EC = 123.8 V EL = 161.0 V EA = 100 V"], "jumps": []}, {"id": "P1285", "text": ["EA", "EA = ER2+ (EL - EC)2 = 92.92 + (161.0 - 123.8)2 = 92.92 + 37.22 = 8630.41 + 1383.84 = 10014.25 = 100.07"], "jumps": []}, {"id": "P1290", "text": ["The method to analyze LCR series circuits is the same as\nanalyzing RL or RC circuits.  Except, subtracting XL from XC in\nthe formulas.", "The method to analyze LCR series circuits is the same as analyzing RL or RC circuits. Except, subtracting XL from XC in the formulas. .........", "ZT = 32.3 W IT = 3.1 A ER = 92.9 V EC = 123.8 V EL = 161.0 V EA = 100 V"], "jumps": []}, {"id": "P1300", "text": ["In this LCR circuit XC is larger than XL.  Notice that XL - XC\nequals a negative number.", "In this LCR circuit XC is larger than XL. Notice that XL - XC equals a negative number. ...............", "ZT = 302+ (40 - 52)2 = 302 + (-12)2"], "jumps": []}, {"id": "P1310", "text": ["However, when -12W is squared, it equals +144W . The -12W\nindicates that the circuit is capacitive.  XC is larger than XL.", "However, when -12W is squared, it equals +144W . The -12W indicates that the circuit is capacitive. XC is larger than XL.", "ZT = 302+ (40 - 52)2 = 302 + (-12)2 = 900 + 144 = 1044 = 32.3 WWWW"], "jumps": []}, {"id": "P1320", "text": ["Also, using the voltage drops to check results produces a\nnegative value.  Again, when squared, the value changes to\npositive.", "Also, using the voltage drops to check results produces a negative value. Again, when squared, the value changes to positive. .........", "ZT = 32.3 W IT = 3.1 A ER = 92.9 V EC = 161.0 V EL = 123.8 V 123.8 VVVV", "EA = ER2+ (EL - EC)2 = 92.92 + (- 37.2)2 = 8630.41 + 1383.84 = 100.07"], "jumps": []}, {"id": "P1330", "text": ["What type of LCR circuit is this?", "What type of LCR circuit is this? ........................"], "jumps": []}, {"id": "P1331", "text": [], "jumps": []}, {"id": "P1332", "text": ["A series resistive inductive circuit has XL larger than XC."], "jumps": []}, {"id": "P1333", "text": ["A series resistive capacitive circuit has XC larger than XL."], "jumps": []}, {"id": "P1335", "text": ["Now, let's calculate circuit values for this LCR series circuit."], "jumps": []}, {"id": "P1340", "text": ["First, add the common resistances and reactances.", "Rt = 10 kW XCt = 10 kW XLt = 10 kW"], "jumps": []}, {"id": "P1342", "text": ["First, add the common resistances and reactances.", "First, add the common resistances and reactances. ........", "Rt = 10 kW XCt = 10 kW XLt = 10 kW"], "jumps": []}, {"id": "P1345", "text": ["Rt = R1 + R2 = 5 kW + 5 kW = 10 kW XCt = XC1 + XC2 = 7 kW + 3 kW = 10 kW XLt = XL1 = 10 kW"], "jumps": []}, {"id": "P1350", "text": ["Second, calculate total impedance. \nWhat is ZT?", "Second, calculate total impedance. What is ZT? .........", "Rt = 10 kW , XCt = 10 kW, XLt = 10 kW, Zt = ?????????2 = 7 kW + 7 kW = 10 kW Zt = ?XL1 = 10 kWW"], "jumps": []}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1352", "text": ["You calculated the square root of Rt squared plus XCt squared\nor XLt squared.  Remember, subtract XLt from XCt.", "You calculated the square root of Rt squared plus XCt squared or XLt squared. Remember, subtract XLt from XCt. ......."], "jumps": []}, {"id": "P1353", "text": ["You added the values of resistance to capacitive reactance and\ninductive reactance.  Remember, use this formula.", "You added the values of resistance to capacitive reactance and inductive reactance. Remember, use this formula. aaaaaaaaaaaa"], "jumps": []}, {"id": "P1355", "text": ["CALCULATING ZT -   To calculate ZT use the following formula.", "CALCULATING ZT - To calculate ZT use the following formula."], "jumps": []}, {"id": "P1360", "text": ["Notice that ZT = Rt, XL and XC are equal and cancel each other\nout.", "Notice that ZT = Rt, XL and XC are equal and cancel each other out.", "Rt = 10 kW , XCt = 10 kW, XLt = 10 kW Zt = 10 kWWWWW 7 kW + 7 kW = 10 kW Zt = ?XL1 = 10 kWW"], "jumps": []}, {"id": "P1370", "text": ["Third, calculate total current. \nWhat is IT?", "Third, calculate total current. What is IT? ............", "Rt = 10 kW , XCt = 10 kW, XLt = 10 kW, Zt = 10 kWWWWWWWW 7 kW + 7 kW = 10 kW Zt = ?XL1 = 10 kWW"], "jumps": []}, {"id": "P1371", "text": [], "jumps": []}, {"id": "P1372", "text": ["Remember, IT equals EA/ZT.", "Remember, IT equals EA/ZT. ..............................."], "jumps": []}, {"id": "P1375", "text": ["CALCULATING IT - To calculate IT use the following formula. IT = EA/ZT"], "jumps": []}, {"id": "P1380", "text": ["Fourth, calculate voltage drops. \nWhat are the voltage drops?", "Fourth, calculate voltage drops. What are the voltage drops?", "Rt = 10 kW , XCt = 10 kW, ZT = 10 kW, IT = 10 mAWWWWWWWWWWWWWWWWWWWWW= 10 kW Zt = ?XL1 = 10 kWW", "ER1 = ? ER2 = ? EC1 = ? EC2 = ? EL1 = ?"], "jumps": []}, {"id": "P1381", "text": [], "jumps": []}, {"id": "P1382", "text": ["Multiply total current by the resistance or reactance of each\ncomponent.", "Multiply total current by the resistance or reactance of each component. ..............."], "jumps": []}, {"id": "P1385", "text": ["CALCULATING VOLTAGE DROPS - To calculate Voltage Drops use the following formula.", "ER1 = IT x R1 ER2 = IT x R2 EC1 = IT x XC1 EC2 = IT x XC2 EL1 = IT x XL1"], "jumps": []}, {"id": "P1390", "text": ["Last, check results by calculating the applied voltage.  Be sure to\nadd like voltage drops.", "Last, check results by calculating the applied voltage. Be sure to add like voltage drops. ..........", "Rt = 10 kW , XCt = 10 kW, XLt = 10 kW let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
