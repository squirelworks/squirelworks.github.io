or circuit located in?"], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P7103", "text": ["When the FM input signal is below fc, the L3 circuit conducts more than the L2 circuit. The charge across C5 increases which does not produce a negative output."], "jumps": []}, {"id": "P7102", "text": ["When the FM input signal is below fc, the L2 and L3 circuits do not conduct equally and the charges across C4 and C5 are not equal. The changing voltage across C5 produces an output signal through C7 and not a 0 volt output."], "jumps": []}, {"id": "P7101", "text": [], "jumps": []}, {"id": "P7100", "text": ["What is the output polarity of the information signal when the FM  input signal is below center frequency?", "What is the output polarity of the information signal when the FM input signal is below center frequency?"], "jumps": ["P7060"]}, {"id": "P7090", "text": ["Again, the output of the circuit is amplitude changes in proportion to the frequency changes of the input signal which is FM demodulation."], "jumps": ["P7100", "P7060"]}, {"id": "P7080", "text": ["The positive going voltage across C5 is coupled through C7 producing a positive output."], "jumps": ["P7090", "P7060"]}, {"id": "P7070", "text": ["This increases the voltage across C5. Since the voltage across C4 and C5 is held constant by C6, the voltage across C4 must decrease."], "jumps": ["P7080", "P7060"]}, {"id": "P7060", "text": ["When the FM input signal is below fc, the L3 circuit conducts more (just like the discriminator demodulator)."], "jumps": ["P7070", "P7020"]}, {"id": "P7050", "text": ["The output of the circuit is; amplitude changes in proportion to the frequency changes of the input signal which is FM demodulation."], "jumps": ["P7060", "P7020"]}, {"id": "P7040", "text": ["The negative going voltage across C5 is coupled through C7 producing a negative output."], "jumps": ["P7050", "P7020"]}, {"id": "P7030", "text": ["This increases the voltage across C4. Since the voltage across C4 and C5 is held constant, the voltage across C5 must decrease."], "jumps": ["P7040", "P7020"]}, {"id": "P7020", "text": ["When the FM input signal is above fc, the L2 circuit conducts more (just like the discriminator demodulator)."], "jumps": ["P7030", "P2880"]}, {"id": "P7010", "text": ["The output is taken from the junction of C4 and C5 and is a positive DC level that is blocked by C7."], "jumps": ["P7020", "P2880"]}, {"id": "P7000", "text": ["This produces equal charges across C4 and C5 that totals the charge across C6."], "jumps": ["P7010", "P2880"]}, {"id": "P3999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P3970"]}, {"id": "P3970", "text": ["6.  The NE565 is a typical PLL IC used to demodulate FM signals.", "6. The NE565 is a typical PLL IC used to demodulate FM signals.", "-V Input Input VCO Output Comparator Input Reference Output Information Output", "Not Used Not Used Not Used Not Used +V C R"], "jumps": ["P3999", "P3930"]}, {"id": "P3960", "text": ["5.  The error signal changes the frequency of the VCO to track             the frequency changes of the FM input signal.", "5. The error signal changes the frequency of the VCO to track the frequency changes of the FM input signal."], "jumps": ["P3970", "P3930"]}, {"id": "P3950", "text": ["4.  The error signal is filtered and amplified and applied to the               VCO.", "4. The error signal is filtered and amplified and applied to the VCO."], "jumps": ["P3960", "P3930"]}, {"id": "P3940", "text": ["3.  The phase comparator outputs and error signal in proportion         to the magnitude and direction of the frequency difference              between the VCO and FM input signal, this is FM                               demodulation.", "3. The phase comparator outputs and error signal in proportion to the magnitude and direction of the frequency difference between the VCO and FM input signal, this is FM demodulation."], "jumps": ["P3950", "P3930"]}, {"id": "P3930", "text": ["2.  PLL circuits contain a phase comparator, filter, op-amp and a        VCO.", "2. PLL circuits contain a phase comparator, filter, op-amp and a VCO."], "jumps": ["P3940", "P3920"]}, {"id": "P3920", "text": ["1.  Phase lock loop circuits are used to demodulate FM signals.", "1. Phase lock loop circuits are used to demodulate FM signals.."], "jumps": ["P3930", "P3001"]}, {"id": "P3910", "text": ["This completes the information on PHASE LOCK LOOPS.", "This completes the information on PHASE LOCK LOOPS........."], "jumps": ["P3450"]}, {"id": "P3455", "text": ["CENTER FREQUENCY OF VCO - The formula is:", "Remember that k is 10 to the third and pico is 10 to the minus twelfth."], "jumps": []}, {"id": "P3452", "text": ["Check your math and the formula given on the help page to determine the center frequency of VCO."], "jumps": []}, {"id": "P3451", "text": [], "jumps": []}, {"id": "P3450", "text": ["If a 10 k resistor and a 100 pFD capacitor is connected to Pins 8 and 9, what is the center frequency of the VCO?", "-V Input Input VCO Output Comparator Input Reference Output Information Output", "Not Used Not Used Not Used Not Used +V C R"], "jumps": ["P3350", "P3455"]}, {"id": "P3440", "text": ["Pins 11 through 14 are not used."], "jumps": ["P3450", "P3350"]}, {"id": "P3430", "text": ["Pin 10 is the positive supply voltage that operates the chip."], "jumps": ["P3440", "P3350"]}, {"id": "P3420", "text": ["The center frequency of VCO is calculated by"], "jumps": ["P3430", "P3350"]}, {"id": "P3410", "text": ["Pin 8 and 9 are the R (resistor) and C (capacitor) inputs that set the center frequency of the VCO."], "jumps": ["P3420", "P3350"]}, {"id": "P3400", "text": ["Pin 7 is the output of the chip, demodulated information when used as a demodulator."], "jumps": ["P3410", "P3350"]}, {"id": "P3390", "text": ["Pin 6 is a reference output that would be used in an external comparator circuit."], "jumps": ["P3400", "P3350"]}, {"id": "P3380", "text": ["Pin 5 is the input to the phase comparator from the VCO."], "jumps": ["P3390", "P3350"]}, {"id": "P3370", "text": ["Pin 4 is the VCO output and is normally connected straight to\nPin 5 in FM demodulator circuits.", "Pin 4 is the VCO output and is normally connected straight to Pin 5 in FM demodulator circuits.."], "jumps": ["P3380", "P3350"]}, {"id": "P3360", "text": ["Pin 2 and 3 are the inputs to the phase comparator.  Only one input is used at a time depending on application.", "Pin 2 and 3 are the inputs to the phase comparator. Only one input is used at a time depending on application."], "jumps": ["P3370", "P3350"]}, {"id": "P3350", "text": ["The pin out of the chip is as follows:  Pin 1 is the negative input voltage.  It is used to setup a constant current source if required.", "The pin out of the chip is as follows: Pin 1 is the negative input voltage. It is used to setup a constant current source if required.", "-V Input Input VCO Output Comparator Input Reference Output Information Output", "Not Used Not Used Not Used Not Used +V C R"], "jumps": ["P3360", "P3300"]}, {"id": "P3340", "text": ["For example, the chip can be used for; frequency shift keying, modems, tone decoders, data synchronizers, tracking filters, signal restoration, and frequency multiplication/division circuits."], "jumps": ["P3350", "P3300"]}, {"id": "P3330", "text": ["This allows the chip to be used for other functions besides FM demodulation."], "jumps": ["P3340", "P3300"]}, {"id": "P3320", "text": ["Notice that four of the pins are not used.  Also, the VCO has a separate output and the phase comparator a separate input.", "Notice that four of the pins are not used. Also, the VCO has a separate output and the phase comparator a separate input."], "jumps": ["P3330", "P3300"]}, {"id": "P3310", "text": ["The chip contains approximately 28 transistors, 13 diodes and numerous resistors."], "jumps": ["P3320", "P3300"]}, {"id": "P3300", "text": ["Most modern FM modulator circuits use integrated circuit voltage controlled oscillators.", "-V Input Input VCO Output Comparator Input Reference Output Information Output", "Not Used Not Used Not Used Not Used +V C R"], "jumps": ["P3310", "P3290"]}, {"id": "P3293", "text": ["The phase comparator does not change the FM input signal.  The phase comparator generates an error signal that changes the output frequency of the VCO.", "The phase comparator does not change the FM input signal. The phase comparator generates an error signal that changes the output frequency of the VCO."], "jumps": []}, {"id": "P3292", "text": ["When the FM input signal is above the VCO frequency, the phase comparator circuit does not produce a negative error signal."], "jumps": []}, {"id": "P3291", "text": [], "jumps": []}, {"id": "P3290", "text": ["What happens in a phase lock loop circuit if the FM input signal is above the frequency of the VCO?", "The phase comparator generates a negative error signal that raises the VCO frequency.", "The phase comparator lowers the FM signal frequency..", "The phase comparator generates a positive error signal that raises the VCO frequency...."], "jumps": ["P3280"]}, {"id": "P3283", "text": ["Feedback is not used to describe the type of circuit connections used in phase lock loop systems.  Feedback adds to (positive) or subtracts from (negative) the input signal which changes the input signal.  Closed loop system has the output applied back to the input but does not change the output.", "Feedback is not used to describe the type of circuit connections used in phase lock loop systems. Feedback adds to (positive) or subtracts from (negative) the input signal which changes the input signal. Closed loop system has the output applied back to the input but does not change the output."], "jumps": []}, {"id": "P3282", "text": ["The block diagram illustrates that the output of the circuit is routed through the VCO to the input. The circuit is not an open loop."], "jumps": []}, {"id": "P3281", "text": [], "jumps": []}, {"id": "P3280", "text": ["What type of circuit is a phase lock loop?", "What type of circuit is a phase lock loop?................."], "jumps": ["P3190"]}, {"id": "P3270", "text": ["The circuit produces an output signal that varies in amplitude according to the frequency variations of the FM input signal which is FM demodulation."], "jumps": ["P3280", "P3190"]}, {"id": "P3260", "text": ["The correct demodulator output is negative when there are negative frequency changes."], "jumps": ["P3270", "P3190"]}, {"id": "P3250", "text": ["The amplitude of the negative output depends on the frequency deviation of the FM input signal."], "jumps": ["P3260", "P3190"]}, {"id": "P3240", "text": ["If the FM signal is below fc, the output of the phase comparator is negative."], "jumps": ["P3250", "P3190"]}, {"id": "P3230", "text": ["The correct demodulator output is positive when there are positive frequency changes."], "jumps": ["P3240", "P3190"]}, {"id": "P3220", "text": ["The amplitude of the positive output signal depends on the frequency deviation of the FM input signal."], "jumps": ["P3230", "P3190"]}, {"id": "P3210", "text": ["If the FM signal is above fc, the output of the phase comparator is positive."], "jumps": ["P3220", "P3190"]}, {"id": "P3200", "text": ["The correct demodulator output is 0 when the FM signal does not have information."], "jumps": ["P3210", "P3190"]}, {"id": "P3190", "text": ["If the FM is unmodulated the VCO will lock onto the center frequency and the output of the phase comparator is 0."], "jumps": ["P3200", "P3140"]}, {"id": "P3180", "text": ["In other words, the circuit changes the VCO frequency according to the frequency of the FM input signal. The circuit tracks the incoming FM signal."], "jumps": ["P3190", "P3140"]}, {"id": "P3170", "text": ["The error voltage raises or lowers the frequency output of the VCO until the output of the phase comparator is 0."], "jumps": ["P3180", "P3140"]}, {"id": "P3160", "text": ["The output of the comparator is then filtered, amplified, and used as the output of the demodulator and as the input to the VCO."], "jumps": ["P3170", "P3140"]}, {"id": "P3150", "text": ["The phase comparator compares the two signals.  If there is a difference in the frequency or phase, the circuit produces a DC error voltage proportional to the amount and direction of the        difference.", "The phase comparator compares the two signals. If there is a difference in the frequency or phase, the circuit produces a DC error voltage proportional to the amount and direction of the difference."], "jumps": ["P3160", "P3140"]}, {"id": "P3140", "text": ["The second input to the phase comparator is the FM input.", "The second input to the phase comparator is the FM input..."], "jumps": ["P3150", "P3050"]}, {"id": "P3130", "text": ["The output of the VCO is applied to one input of the phase comparator."], "jumps": ["P3050"]}, {"id": "P3120", "text": ["If the input voltage increases, the output frequency increases. \nIf  the input voltage decreases, the output frequency decreases.", "If the input voltage increases, the output frequency increases. If the input voltage decreases, the output frequency decreases."], "jumps": ["P3050"]}, {"id": "P3110", "text": ["The VCO circuit operates just like the VCO modulator circuit."], "jumps": ["P3050"]}, {"id": "P3100", "text": ["The voltage controlled oscillator (VCO) circuit is setup to produce an output frequency equal to the center frequency of the FM input signal (with an input voltage of 0 volts)."], "jumps": ["P3050"]}, {"id": "P3090", "text": ["Because the circuit is a closed loop, you may start the block description anywhere."], "jumps": ["P3050"]}, {"id": "P3080", "text": ["A closed loop system does not alter the input signal.  The input signal and the returned signal combine to form a third signal.", "A closed loop system does not alter the input signal. The input signal and the returned signal combine to form a third signal."], "jumps": ["P3050"]}, {"id": "P3070", "text": ["Note that the circuit does not use feedback.  Feedback alters the input signal as in an oscillator or operational amplifier.", "Note that the circuit does not use feedback. Feedback alters the input signal as in an oscillator or operational amplifier."], "jumps": ["P3050"]}, {"id": "P3060", "text": ["Look closely at the block diagram.  The PLL circuit is a closed loop (the output is routed back to the input).", "Look closely at the block diagram. The PLL circuit is a closed loop (the output is routed back to the input)."], "jumps": ["P3050"]}, {"id": "P3050", "text": ["The operation of a PLL circuit is simple even though the circuit may be complex."], "jumps": ["P3025"]}, {"id": "P3040", "text": ["Since most PLL circuits are in chips, a block diagram and pin out description is all that is needed.  Let's start with the block diagram description.", "Since most PLL circuits are in chips, a block diagram and pin out description is all that is needed. Let's start with the block diagram description."], "jumps": ["P3025"]}, {"id": "P3030", "text": ["A PLL circuit constructed from individual components would require very large circuits and many components.  This is not practical in most FM receivers.", "A PLL circuit constructed from individual components would require very large circuits and many components. This is not practical in most FM receivers."], "jumps": ["P3025"]}, {"id": "P3025", "text": ["PLL circuits are very complex.  Consequently, the circuits are normally in integrated circuit form.", "PLL circuits are very complex. Consequently, the circuits are normally in integrated circuit form.", "-V Input Input VCO Output Comparator Input Reference Output Information Output", "Not Used Not Used Not Used Not Used +V C R"], "jumps": ["P3030", "P3020"]}, {"id": "P3020", "text": ["Phase lock loop circuits, or PLL for short, are the newest types of circuits used to demodulate FM signals."], "jumps": ["P3025", "P3001"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P2999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2980"]}, {"id": "P2990", "text": ["8.  The current in circuits L2 and L3 are changed by the mutual            inductance of L4 to L2 and L3 which is caused by frequency          changes in the FM input signal.  The output is developed by           the different charges on C4 and C5.", "8. The current in circuits L2 and L3 are changed by the mutual inductance of L4 to L2 and L3 which is caused by frequency changes in the FM input signal. The output is developed by the different charges on C4 and C5."], "jumps": ["P2999", "P2980"]}, {"id": "P2980", "text": ["7.  The ratio demodulator uses capacitive and inductive                         reactance and mutual inductance to recover the information          signal.", "7. The ratio demodulator uses capacitive and inductive reactance and mutual inductance to recover the information signal."], "jumps": ["P2990", "P2960"]}, {"id": "P2970", "text": ["6.  The current in circuits L2 and L3 are changed by the mutual            inductance if L4 to L2 and L3, which is caused by frequency          changes in the FM signal input. The output is developed by            the different currents producing different voltages across R1         and R2.", "6. The current in circuits L2 and L3 are changed by the mutual inductance if L4 to L2 and L3, which is caused by frequency changes in the FM signal input. The output is developed by the different currents producing different voltages across R1 and R2."], "jumps": ["P2980", "P2960"]}, {"id": "P2960", "text": ["5.  The discriminator demodulator uses capacitive and inductive         reactance and mutual inductance to recover information                 signals.", "5. The discriminator demodulator uses capacitive and inductive reactance and mutual inductance to recover information signals."], "jumps": ["P2970", "P2940"]}, {"id": "P2950", "text": ["4.  The center frequency of the FM signal is placed on the                     midpoint of the tuned circuit response curve.  This changes           the FM signal to an AM signal which is then demodulated.", "4. The center frequency of the FM signal is placed on the midpoint of the tuned circuit response curve. This changes the FM signal to an AM signal which is then demodulated."], "jumps": ["P2960", "P2940"]}, {"id": "P2940", "text": ["3.  The slope demodulator circuit uses a tuned circuit and an AM       demodulator circuit to recover the information.", "3. The slope demodulator circuit uses a tuned circuit and an AM demodulator circuit to recover the information."], "jumps": ["P2950", "P2920"]}, {"id": "P2930", "text": ["2.  The input to an FM demodulator is an FM waveform and the           output is recovered information.", "2. The input to an FM demodulator is an FM waveform and the output is recovered information."], "jumps": ["P2940", "P2920"]}, {"id": "P2920", "text": ["1.  FM demodulator circuits are located in the receiver section of        a communication system.", "1. FM demodulator circuits are located in the receiver section of a communication system."], "jumps": ["P2930", "P2001"]}, {"id": "P2910", "text": ["This completes the information on FM DEMODULATORS.", "This completes the information on FM DEMODULATORS.E........"], "jumps": ["P7100"]}, {"id": "P2890", "text": ["When the FM input frequency is at fc, the currents in the L2 and L3 circuit are equal (just like the discriminator demodulator)."], "jumps": ["P7000", "P2880"]}, {"id": "P2880", "text": ["Now, the operation of the ratio demodulator is as follows.", "Now, the operation of the ratio demodulator is as follows.."], "jumps": ["P2890", "P2790"]}, {"id": "P2870", "text": ["Also, the constant charge on C6 holds the voltage across C4 and C5 constant."], "jumps": ["P2880", "P2790"]}, {"id": "P2860", "text": ["In other words, the charge on C6 is constant, except for slow signal strength changes. This action eliminates the effect of noise that is in the discriminator demodulator."], "jumps": ["P2870", "P2790"]}, {"id": "P2850", "text": ["C6 will charge to the average amplitude of the FM input signal. The value of C6 is such that noise, high frequency, will not change its charge."], "jumps": ["P2860", "P2790"]}, {"id": "P2840", "text": ["Second, there is a capacitor across L2 and L3, and C4 and C5."], "jumps": ["P2850", "P2790"]}, {"id": "P2830", "text": ["This sets up current flow through C4 and C5 in the same direction, as indicated.  The voltages on C4 and C5 add.", "This sets up current flow through C4 and C5 in the same direction, as indicated. The voltages on C4 and C5 add."], "jumps": ["P2840", "P2790"]}, {"id": "P2820", "text": ["First, the diode D1 is reversed in the ratio demodulator."], "jumps": ["P2830", "P2790"]}, {"id": "P2810", "text": ["Only the differences will be discussed and the difference is in how the output information signal is developed."], "jumps": ["P2820", "P2790"]}, {"id": "P2800", "text": ["In fact, L1 through L4 operate exactly the same as in the discriminator demodulator. Their operation will not be covered again."], "jumps": ["P2810", "P2790"]}, {"id": "P2790", "text": ["The ratio demodulator operates almost like the discriminator demodulator."], "jumps": ["P2800", "P2780"]}, {"id": "P2780", "text": ["Another method to reduce noise is by using a ratio demodulator.", "Slope Demodulator Discriminator Demodulator Ratio Demodulator"], "jumps": ["P2790", "P2760"]}, {"id": "P2770", "text": ["The noise problem is reduced by limiting the FM signal before it is applied to the demodulator circuit."], "jumps": ["P2780", "P2760"]}, {"id": "P2760", "text": ["This disadvantage in the discriminator demodulator is the amplitude variations in the FM signal, noise, cause amplitude variations in the output signal."], "jumps": ["P2770", "P2750"]}, {"id": "P2753", "text": ["When the FM input signal is below fc, the inductive and capacitive reactances are not equal, producing a capacitive circuit. The phase changes between L4, L2 and L3 causes mutual inductance. The current in the L3 circuit increases which does not produce equal voltage across R1 that is greater than R2.", "When the FM input signal is below fc, the inductive and capacitive reactances are not equal, producing a capacitive circuit. The phase changes between L4, L2 and L3 causes mutual inductance. The current in the L3 circuit increases which does not produce equal voltage across R1 that is greater than R2..."], "jumps": []}, {"id": "P2752", "text": ["When the FM input signal is below fc, the inductive and capacitive reactances are not equal, producing capacitive circuits. The phase changes between L4, L2 and L3 causes mutual inductance. The current in the L3 circuit increases which does not produce equal voltages over R1 and R2.", "When the FM input signal is below fc, the inductive and capacitive reactances are not equal, producing capacitive circuits. The phase changes between L4, L2 and L3 causes mutual inductance. The current in the L3 circuit increases which does not produce equal voltages over R1 and R2..."], "jumps": []}, {"id": "P2751", "text": [], "jumps": []}, {"id": "P2750", "text": ["When the FM signal is below fc, what is the relationship between the voltages developed by R1 and R2?"], "jumps": ["P2690"]}, {"id": "P2740", "text": ["And just like frequencies above fc, the greater the frequency is below fc, the more the negative output is increased."], "jumps": ["P2750", "P2690"]}, {"id": "P2730", "text": ["In other words, when the FM input signal is below fc, the circuit  produces a negative output in proportion to the negative frequency change of the FM signal input.", "In other words, when the FM input signal is below fc, the circuit produces a negative output in proportion to the negative frequency change of the FM signal input."], "jumps": ["P2740", "P2690"]}, {"id": "P2720", "text": ["With the information output taken across both R1 and R2, and R1 and R2 have opposite polarities, the output is negative when the voltage across R2 is greater."], "jumps": ["P2730", "P2690"]}, {"id": "P2710", "text": ["With more current flowing through R2, R2 develops more voltage than R1."], "jumps": ["P2720", "P2690"]}, {"id": "P2700", "text": ["The currents generated from the induced voltages is higher in the L3 circuit."], "jumps": ["P2710", "P2690"]}, {"id": "P2690", "text": ["Since the voltage induced into L2 decreased and the voltage induced into L3 increased, and the induced voltage in L4 is common, the currents generated from the induced voltages is higher in the L3 circuit."], "jumps": ["P2700", "P2630"]}, {"id": "P2680", "text": ["The voltage induced into L3 is from L1 and part of L4.  Since the phase difference is 70 degrees, the total voltage developed by L3 increases from the voltage developed by L1 alone.", "The voltage induced into L3 is from L1 and part of L4. Since the phase difference is 70 degrees, the total voltage developed by L3 increases from the voltage developed by L1 alone."], "jumps": ["P2690", "P2630"]}, {"id": "P2670", "text": ["The voltage induced into L2 is from L1 and part of L4.  Since the phase difference is 110 degrees, the total voltage developed by L2 decreases from the voltage developed by L1 alone.", "The voltage induced into L2 is from L1 and part of L4. Since the phase difference is 110 degrees, the total voltage developed by L2 decreases from the voltage developed by L1 alone."], "jumps": ["P2680", "P2630"]}, {"id": "P2660", "text": ["Examining the phase difference, there is mutual inductance between the inductors."], "jumps": ["P2670", "P2630"]}, {"id": "P2650", "text": ["This produces a phase difference of more than 90 degrees between L4 and L2, and a phase difference of less than\n90 degrees between L4 and L3.", "This produces a phase difference of more than 90 degrees between L4 and L2, and a phase difference of less than 90 degrees between L4 and L3."], "jumps": ["P2660", "P2630"]}, {"id": "P2640", "text": ["The L2 and L3 circuits become capacitive and produce an opposite phase shift from when they were inductive.\n\u0083  decreases, Xc increases and XL decreases.", "The L2 and L3 circuits become capacitive and produce an opposite phase shift from when they were inductive.", "decreases, Xc increases and XL decreases."], "jumps": ["P2650", "P2630"]}, {"id": "P2630", "text": ["When the FM input signal is below the center frequency (information signal present), the inductive and capacitive reactances of both the L2 and L3 circuits are not equal."], "jumps": ["P2640", "P2620"]}, {"id": "P2623", "text": ["When the FM input signal is above fc, the inductive and capacitive reactances are not equal producing an inductive circuit. The phase changes between L4, L2, L3 cause mutual inductance. The current flow in the L2 circuit increases which does not produce a voltage across R1 that is less than R2.", "When the FM input signal is above fc, the inductive and capacitive reactances are not equal producing an inductive circuit. The phase changes between L4, L2, L3 cause mutual inductance. The current flow in the L2 circuit increases which does not produce a voltage across R1 that is less than R2..."], "jumps": []}, {"id": "P2622", "text": ["When the FM input signal is above fc, the inductive and capacitive reactances are not equal producing an inductive circuit. The phase changes between L4, L2, L3 cause mutual inductance. The current flow in the L2 circuit increases which does not produce equal voltages over R1 and R2.", "When the FM input signal is above fc, the inductive and capacitive reactances are not equal producing an inductive circuit. The phase changes between L4, L2, L3 cause mutual inductance. The current flow in the L2 circuit increases which does not produce equal voltages over R1 and R2..."], "jumps": []}, {"id": "P2621", "text": [], "jumps": []}, {"id": "P2620", "text": ["When the FM signal is above fc, what is the relationship between the voltages developed by R1 and R2?"], "jumps": ["P2380"]}, {"id": "P2610", "text": ["The positive frequency changes produce positive amplitude changes in the output which is recovery of the information signal."], "jumps": ["P2620", "P2570"]}, {"id": "P2600", "text": ["More current in the L2 circuit increases the voltage developed by R1 which increases the voltage output."], "jumps": ["P2610", "P2570"]}, {"id": "P2590", "text": ["The phase of L2 is closer to L4 and more mutual inductance takes place increasing the voltage developed by L2.  This increases the current in the L2 circuit.", "The phase of L2 is closer to L4 and more mutual inductance takes place increasing the voltage developed by L2. This increases the current in the L2 circuit."], "jumps": ["P2600", "P2570"]}, {"id": "P2580", "text": ["To review, when the frequency increases, the circuit becomes more inductive and shifts the phase of the circuits."], "jumps": ["P2590", "P2570"]}, {"id": "P2570", "text": ["The more the FM input signal is above fc, the greater the positive output."], "jumps": ["P2580", "P2490"]}, {"id": "P2560", "text": ["In other words, when the FM input signal is above fc, the circuit produces a positive output in proportion to the positive frequency change of the FM input signal."], "jumps": ["P2570", "P2490"]}, {"id": "P2550", "text": ["With the information output taken across both R1 and R2, and R1 and R2 have opposite polarities, the output is positive when the voltage across R1 is greater than across R2."], "jumps": ["P2560", "P2490"]}, {"id": "P2540", "text": ["With more current flowing through R1, R1 develops a higher voltage than R2."], "jumps": ["P2550", "P2490"]}, {"id": "P2520", "text": ["Since the voltage induced into L2 has increased and the voltage induced into L3 decreased, and the induced voltage in L4 is common,  the current generated from the induced voltages is greater in the L2 circuit.", "Since the voltage induced into L2 has increased and the voltage induced into L3 decreased, and the induced voltage in L4 is common, the current generated from the induced voltages is greater in the L2 circuit."], "jumps": ["P2540", "P2490"]}, {"id": "P2510", "text": ["The voltage induced into L3 is from L1 and part of L4.  Since the phase difference is 110 degrees, the total voltage developed by L3 decreases from the voltage developed by L1 alone.", "The voltage induced into L3 is from L1 and part of L4. Since the phase difference is 110 degrees, the total voltage developed by L3 decreases from the voltage developed by L1 alone."], "jumps": ["P2520", "P2490"]}, {"id": "P2500", "text": ["The voltage induced into L2 is from L1 and part of L4.  Since the phase difference is 70 degrees, the total voltage developed by L2 increases from the voltage developed by L1 alone.", "The voltage induced into L2 is from L1 and part of L4. Since the phase difference is 70 degrees, the total voltage developed by L2 increases from the voltage developed by L1 alone."], "jumps": ["P2510", "P2490"]}, {"id": "P2490", "text": ["Examining the phase difference, there is mutual inductance between the inductors."], "jumps": ["P2500", "P2450"]}, {"id": "P2480", "text": ["The phase of the induced voltages across L2 and L3 change in relation to the phase of the common voltage induced across L4.  However, L2 and L3 are still 180 degrees out of phase.", "The phase of the induced voltages across L2 and L3 change in relation to the phase of the common voltage induced across L4. However, L2 and L3 are still 180 degrees out of phase."], "jumps": ["P2490", "P2450"]}, {"id": "P2470", "text": ["This produces a phase difference of less than 90 degrees between L4 and L2; and a phase difference of more than \n90 degrees between L4 and L3.", "This produces a phase difference of less than 90 degrees between L4 and L2; and a phase difference of more than 90 degrees between L4 and L3."], "jumps": ["P2480", "P2450"]}, {"id": "P2460", "text": ["The L2 and L3 circuits become inductive and produce a phase shift:  f increases, Xc decreases and Xl increases.", "The L2 and L3 circuits become inductive and produce a phase shift: f increases, Xc decreases and Xl increases."], "jumps": ["P2470", "P2450"]}, {"id": "P2450", "text": ["When the FM input signal is above the center frequency (information signal present), the inductive and capacitive reactance of both the L2 and L3 circuits are not equal."], "jumps": []}, {"id": "P2443", "text": ["When the FM input signal is at fc, the inductive and capacitance reactances cancel out. The current flow in the L2 and L3 circuits are the same which does not make the voltage across R1 less than the voltage across R2."], "jumps": []}, {"id": "P2442", "text": ["When the FM input signal is at fc, the inductive and capacitance reactances cancel out. The current flow in the L2 and L3 circuits are the same which does not make the voltage across R1 greater than the voltage across R2."], "jumps": ["P2440"]}, {"id": "P2441", "text": [], "jumps": []}, {"id": "P2440", "text": ["When the FM signal is at fc, what is the relationship between the voltages developed by R1 and R2?"], "jumps": ["P2380"]}, {"id": "P2430", "text": ["In other words, when the FM input signal is at fc the circuit produces a 0 output, as it should when the FM signal is not modulated."], "jumps": ["P2440", "P2380"]}, {"id": "P2420", "text": ["The information output is taken across both R1 and R2, and since R1 and R2 have the same but opposite voltages, the output is 0 volts."], "jumps": ["P2430", "P2380"]}, {"id": "P2410", "text": ["With the same level of current flowing through R1 and R2 as indicated, the voltages developed by R1 and R2 are the same with opposite polarities."], "jumps": ["P2420", "P2380"]}, {"id": "P2390", "text": ["Since L1 induces the same voltages to L2 and L3 and L4 is common, the current generated by the induced voltages is also the same in L2 and L3."], "jumps": ["P2410", "P2380"]}, {"id": "P2380", "text": ["Examining the phase difference, there is no mutual inductance between the inductors. The induced voltages in L2, L3, and L4 are only from L1."], "jumps": ["P2390", "P2330"]}, {"id": "P2370", "text": ["Remember, L4 is capacitive coupled to the L2 and L3 circuits and L2 and L3 are 180 degrees out of phase."], "jumps": ["P2380", "P2330"]}, {"id": "P2360", "text": ["The result is a 90 degree phase difference between L4, L2 and L3."], "jumps": ["P2370", "P2330"]}, {"id": "P2350", "text": ["The L2 and L3 circuits are resistive and produce no phase shifts."], "jumps": ["P2360", "P2330"]}, {"id": "P2340", "text": ["When the FM input signal is at the center frequency (no modulation), the inductive and capacitive reactances of both the L2 and L3 circuits are equal."], "jumps": ["P2350", "P2330"]}, {"id": "P2330", "text": ["Now, keeping the phase difference between L2, L3, and L4 and the concept of mutual inductance in mind, let's see how the circuit operates."], "jumps": ["P2340", "P2240"]}, {"id": "P2320", "text": ["The charges on C4 and C5 developed the information output signal taken across R1 and R2."], "jumps": ["P2330", "P2240"]}, {"id": "P2310", "text": ["The diodes in the L2 and L3 circuits are used to insure current only flows in one direction developing a charge across C4 and C5."], "jumps": ["P2320", "P2240"]}, {"id": "P2300", "text": ["This is very important. The phase of the voltage developed by L4 is a reference to the phase of the voltages developed by L2 and L3, which will change as you will see."], "jumps": ["P2310", "P2240"]}, {"id": "P2290", "text": ["Notice that L4 is common to the L2 circuit (L2, R1, C4 and D1) and to the L3 circuit (L3, L4, R2, C5, and D2)."], "jumps": ["P2300", "P2240"]}, {"id": "P2280", "text": ["L4 is capacitive coupled from L1.  The voltage developed by L4 will be phase shifted and be out of phase with the voltages developed by L2 and L3.", "L4 is capacitive coupled from L1. The voltage developed by L4 will be phase shifted and be out of phase with the voltages developed by L2 and L3."], "jumps": ["P2290", "P2240"]}, {"id": "P2270", "text": ["Thus the voltages developed by L2 and L3 are always\n180 degrees out of phase.", "Thus the voltages developed by L2 and L3 are always 180 degrees out of phase.."], "jumps": ["P2280", "P2240"]}, {"id": "P2260", "text": ["L2 and L3 act as a center tapped secondary of a transformer with its own circuit.  L1 acts as the primary.", "L2 and L3 act as a center tapped secondary of a transformer with its own circuit. L1 acts as the primary."], "jumps": ["P2270", "P2240"]}, {"id": "P2250", "text": ["Even though the circuit may look complex, it is not. The key to circuit operation is the phase relationship and mutual inductance between L2, L4, and between L3, L4."], "jumps": ["P2260", "P2240"]}, {"id": "P2248", "text": ["At 180 degrees, maximum negative mutual inductance occurs.  For example, if E11 = 1 V and E12 = 1 V, then E11 = 0 V and\nE12 = 0 V.", "At 180 degrees, maximum negative mutual inductance occurs. For example, if E11 = 1 V and E12 = 1 V, then E11 = 0 V and E12 = 0 V."], "jumps": ["P2240", "P2245"]}, {"id": "P2247", "text": ["At 90 degrees, no mutual inductance occurs.  For example, if E11 = 1 V and E12 = 1 V, then E11 = 1 V and E12 = 1 V.  From 90 degrees to 180 degrees, the amount of negative mutual inductance  increases, the voltages in each inductor subtracts.  For example at 135 degrees, if E11 = 1 V and E12 = 1 V, then E11 = 0.5 V and E12 = 0.5 V.", "At 90 degrees, no mutual inductance occurs. For example, if E11 = 1 V and E12 = 1 V, then E11 = 1 V and E12 = 1 V. From 90 degrees to 180 degrees, the amount of negative mutual inductance increases, the voltages in each inductor subtracts. For example at 135 degrees, if E11 = 1 V and E12 = 1 V, then E11 = 0.5 V and E12 = 0.5 V."], "jumps": ["P2248", "P2245"]}, {"id": "P2246", "text": ["One aspect to the amount of mutual inductance is the phase of the magnetic fields. If the phases are:", "One aspect to the amount of mutual inductance is the phase of the magnetic fields. If the phases are: degrees, maximum positive mutual inductance occurs, the voltages in each inductor add. For example, if E11 = 1 V and E12 = 1 V, then E11 = 2 V and E12 = 2 V. From 0 degrees to 90 degrees, the amount of positive mutual inductance decreases. For example at 45 degrees, if E11 = 1 V and E12 = 1 V, then E11 = 1.5 V and E12 = 1.5 V.", "At 0 degrees, maximum positive mutual inductance occurs, the voltages in each inductor add. For example, if E11 = 1 V and E12 = 1 V, then E11 = 2 V and E12 = 2 V. From 0 degrees to 90 degrees, the amount of positive mutual inductance decreases. For example at 45 degrees, if E11 = 1 V and E12 = 1 V, then E11 = 1.5 V and E12 = 1.5 V."], "jumps": ["P2247", "P2245"]}, {"id": "P2245", "text": ["MUTUAL INDUCTANCE - Mutual inductance is the interaction of two inductors that are close to one another in a circuit. In other words, if the inductors are close enough, the magnetic field of one inductor produces a voltage in the other inductor and vice-versa. The amount of mutual inductance depends by how much of the magnetic fields of the two inductors interact."], "jumps": ["P2246"]}, {"id": "P2240", "text": ["The discriminator demodulator uses inductive reactance, capacitive reactance, and mutual inductance to recover the information signal."], "jumps": ["P2250", "P2230"]}, {"id": "P2230", "text": ["The next two demodulator circuits operate very similar.  Let's look at the discriminator demodulator first.", "The next two demodulator circuits operate very similar. Let's look at the discriminator demodulator first.", "Slope Demodulator Discriminator Demodulator Ratio Demodulator"], "jumps": ["P2240", "P2220"]}, {"id": "P2223", "text": ["D1 is not the type of diode that changes capacitance as the amplitude of the applied signal changes."], "jumps": []}, {"id": "P2222", "text": ["C1, L1 and C2, L2 are tank circuits that do not change the capacitance of D1, R1 and R3."], "jumps": []}, {"id": "P2221", "text": [], "jumps": []}, {"id": "P2220", "text": ["What is the basic operation of this circuit?", "What is the basic operation of this circuit?...............", "Tank circuits C1, L1 and C2, L2 change the capacitance of the D1, R1, C3 circuit producing the information..", "Tank circuits C1, L1 and C2, L2 are controlled by D1's changing capacitance according to changes in the information...", "Tank circuits C1, L1 and C2, L2 change FM to AM and D1, R1, C3 demodulate the AM signal.."], "jumps": ["P2210"]}, {"id": "P2213", "text": ["The entire circuit shown is a FM demodulator (C1, L1 and L2, D1 and R1).  The circuit of D1, R1 and C3 make up a circuit you have previously studied.", "The entire circuit shown is a FM demodulator (C1, L1 and L2, D1 and R1). The circuit of D1, R1 and C3 make up a circuit you have previously studied."], "jumps": []}, {"id": "P2212", "text": ["The circuit is not any type of modulator circuit.  Notice that the output is shown as information.", "The circuit is not any type of modulator circuit. Notice that the output is shown as information."], "jumps": []}, {"id": "P2211", "text": [], "jumps": []}, {"id": "P2210", "text": ["What type of circuit does D1, R1 and C3 form?", "What type of circuit does D1, R1 and C3 form?.............."], "jumps": ["P2170"]}, {"id": "P2200", "text": ["The only disadvantage to the circuit is that gain is reduced, requiring more stages of audio amplifiers, and it is very hard to achieve a linear slope response curve, adding distortion to the output signal."], "jumps": ["P2210", "P2170"]}, {"id": "P2190", "text": ["The output is the recovered information signal."], "jumps": ["P2200", "P2170"]}, {"id": "P2180", "text": ["By the action of the AM demodulator, the carrier signal is eliminated, leaving the frequency variations in the carrier signal."], "jumps": ["P2190", "P2170"]}, {"id": "P2170", "text": ["In other words, the signal applied to the cathode of D1 has both amplitude and frequency variations that represent the information signal."], "jumps": ["P2180", "P2100"]}, {"id": "P2160", "text": ["When the input frequency decreases, the output amplitude decreases."], "jumps": ["P2170", "P2100"]}, {"id": "P2150", "text": ["When the input frequency increases, the output amplitude increases."], "jumps": ["P2160", "P2100"]}, {"id": "P2140", "text": ["When the input frequency to the circuit is the center frequency, the output amplitude of the signal will be at the mid level."], "jumps": ["P2150", "P2100"]}, {"id": "P2130", "text": ["By tuning the tank circuits so that the center frequency of an FM signal is midway on the leading slope of the response curve, the output will be an AM signal."], "jumps": ["P2140", "P2100"]}, {"id": "P2120", "text": ["If the input frequency is above or below resonance, the output voltage decreases."], "jumps": ["P2130", "P2100"]}, {"id": "P2110", "text": ["When the input frequency matches the resonant frequency of the tank circuits, the output voltage is at maximum."], "jumps": ["P2120", "P2100"]}, {"id": "P2100", "text": ["The C1 and L1 tank circuit couples the input to the C2 and L2 tank circuit."], "jumps": ["P2110", "P2050"]}, {"id": "P2090", "text": ["To understand how C1 and L1 and C2 and L2 change FM signals to AM signals, you have to remember that tuned circuits have a response curve."], "jumps": ["P2100", "P2050"]}, {"id": "P2080", "text": ["Then, the D1, R1 and C3 circuit demodulates the AM signal.  Yes, the D1, R1 and C3 circuit is an AM diode demodulator!", "Then, the D1, R1 and C3 circuit demodulates the AM signal. Yes, the D1, R1 and C3 circuit is an AM diode demodulator!"], "jumps": ["P2090", "P2050"]}, {"id": "P2070", "text": ["The operation of the circuit is based on circuits C1, L1 and C2, L2 changing FM signals to AM signals."], "jumps": ["P2080", "P2050"]}, {"id": "P2060", "text": ["Slope demodulators are only used in inexpensive small receivers where space is at a premium."], "jumps": ["P2070", "P2050"]}, {"id": "P2050", "text": ["The slope demodulator or slope detector consist of; a tuned circuit, a diode, a resistor and a capacitor."], "jumps": ["P2060", "P2030"]}, {"id": "P2040", "text": ["Let's start with the basic FM demodulator circuit.", "Slope Demodulator Discriminator Demodulator Ratio Demodulator"], "jumps": ["P2050", "P2030"]}, {"id": "P2030", "text": ["FM demodulator circuits range from the simple to the complex.  However, they still perform the same function of recovering the information signal.", "FM demodulator circuits range from the simple to the complex. However, they still perform the same function of recovering the information signal.", "Slope Demodulator Discriminator Demodulator Ratio Demodulator"], "jumps": ["P2040", "P2020"]}, {"id": "P2025", "text": ["The demodulator receives one input, the FM waveform, and produces one output, the recovered information signal."], "jumps": ["P2030", "P2020"]}, {"id": "P2020", "text": ["The demodulator circuit, located in the receiver, is the circuit that recovers the information signal."], "jumps": ["P2025", "P2001"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1980"]}, {"id": "P1990", "text": ["8.  The center frequency is determined by the values of                          resistance and capacitance of pins 6 and 7, and by the DC              offset voltage of the information input signal.", "8. The center frequency is determined by the values of resistance and capacitance of pins 6 and 7, and by the DC offset voltage of the information input signal."], "jumps": ["P1999", "P1980"]}, {"id": "P1980", "text": ["7.  The VCO modulator circuit uses and integrated circuit chip to         produce the FM waveforms.", "7. The VCO modulator circuit uses and integrated circuit chip to produce the FM waveforms."], "jumps": ["P1990", "P1960"]}, {"id": "P1970", "text": ["6.  D1 changes capacitance by the information signal adding or         subtracting from the reverse bias voltage which changes the         capacitance of the tank circuit.", "6. D1 changes capacitance by the information signal adding or subtracting from the reverse bias voltage which changes the capacitance of the tank circuit."], "jumps": ["P1980", "P1960"]}, {"id": "P1960", "text": ["5.  The varactor modulator (VCO) circuit uses a varactor diode             and an oscillator circuit to produce FM waveforms.", "5. The varactor modulator (VCO) circuit uses a varactor diode and an oscillator circuit to produce FM waveforms."], "jumps": ["P1970", "P1940"]}, {"id": "P1950", "text": ["4.  The conduction of Q1, controlled by the information input               signal,  increases or decreases the capacitance of the tank             circuit changing the output frequency.", "4. The conduction of Q1, controlled by the information input signal, increases or decreases the capacitance of the tank circuit changing the output frequency."], "jumps": ["P1960", "P1940"]}, {"id": "P1940", "text": ["3.  The reactance modulator circuit uses a transistor and                      oscillator to produce FM waveforms.", "3. The reactance modulator circuit uses a transistor and oscillator to produce FM waveforms."], "jumps": ["P1950", "P1920"]}, {"id": "P1930", "text": ["2.  The input signals to an FM modulator are the information and        carrier signals. The output is an FM waveform.", "1.  FM modulator circuits are located in the transmitter section of       a communication system.", "2. The input signals to an FM modulator are the information and carrier signals. The output is an FM waveform.", "1. FM modulator circuits are located in the transmitter section of a communication system."], "jumps": ["P1940", "P1920", "P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on FM MODULATORS.", "This completes the information on FM MODULATORS.TLE........"], "jumps": ["P1780"]}, {"id": "P1783", "text": ["Pin 5 is the input pin.  Amplitude variations on this pin produce frequency variations on the outputs.", "Pin 5 is the input pin. Amplitude variations on this pin produce frequency variations on the outputs."], "jumps": []}, {"id": "P1782", "text": ["Pins 3 and 4 are the output pins. The signal is an FM square wave or FM triangle wave."], "jumps": []}, {"id": "P1781", "text": [], "jumps": []}, {"id": "P1780", "text": ["Which pin/pins sets the center frequency in the NE566 VCO?", "Which pin/pins sets the center frequency in the NE566 VCO?."], "jumps": ["P1770"]}, {"id": "P1773", "text": ["Pins 6 and 7 are used to connect external components for setting the center frequency."], "jumps": []}, {"id": "P1772", "text": ["Pins 3 and 4 are the output pins. The signal is an FM square wave or FM triangle wave."], "jumps": []}, {"id": "P1771", "text": [], "jumps": []}, {"id": "P1770", "text": ["In the NE566 VCO, which pin/pins are used to cause frequency modulation of a carrier signal?", "In the NE566 VCO, which pin/pins are used to cause frequency modulation of a carrier signal?W"], "jumps": ["P1680"]}, {"id": "P1760", "text": ["Where R and C are component values, Vcc is the applied voltage, and Vc is the DC offset voltage on the input pin."], "jumps": ["P1770", "P1680"]}, {"id": "P1750", "text": ["The center frequency is calculated by:"], "jumps": ["P1760", "P1680"]}, {"id": "P1740", "text": ["By connecting a resistor to Pin 6 and a capacitor to Pin 7, an RC time constant is produced that sets the center frequency of the carrier signal."], "jumps": ["P1750", "P1680"]}, {"id": "P1730", "text": ["Pin 6, R, and Pin 7, C, setup the center frequency of the carrier signal that is generated inside the chip."], "jumps": ["P1740", "P1680"]}, {"id": "P1720", "text": ["Note that for correct circuit operation, the input signal applied to Pin 5 must be riding on a DC offset voltage.  This offset DC voltage is called Vc.", "Note that for correct circuit operation, the input signal applied to Pin 5 must be riding on a DC offset voltage. This offset DC voltage is called Vc."], "jumps": ["P1730", "P1680"]}, {"id": "P1710", "text": ["Pin 5 is the VCO's input.  Amplitude changes on the input pin produce frequency changes in the outputs on Pins 3 and 4.", "Pin 5 is the VCO's input. Amplitude changes on the input pin produce frequency changes in the outputs on Pins 3 and 4."], "jumps": ["P1720", "P1680"]}, {"id": "P1700", "text": ["Pin 3 is the square wave output and Pin 4 is the triangle wave output."], "jumps": ["P1710", "P1680"]}, {"id": "P1690", "text": ["Pin 1 is the circuit ground and Pin 8 is the power input.  Pin 2 is not used.", "Pin 1 is the circuit ground and Pin 8 is the power input. Pin 2 is not used."], "jumps": ["P1700", "P1680"]}, {"id": "P1680", "text": ["The chip is a VCO that produces a square wave and triangle wave output that is frequency modulated.  Note that the carrier signal does not have to be a sine wave.", "The chip is a VCO that produces a square wave and triangle wave output that is frequency modulated. Note that the carrier signal does not have to be a sine wave."], "jumps": ["P1690", "P1630"]}, {"id": "P1670", "text": ["However, there are only 7 circuit connections and only one of the two output pins is normally used."], "jumps": ["P1680", "P1630"]}, {"id": "P1660", "text": ["The chip contains 20 transistors, 10 diodes, and numerous resistors to make up the VCO circuit (similar to the varactor circuit just discussed)."], "jumps": ["P1670", "P1630"]}, {"id": "P1650", "text": ["The NE566 VCO chip is an example of an FM modulator in IC form."], "jumps": ["P1660", "P1630"]}, {"id": "P1640", "text": ["IC's reduce the amount of space and circuit connections even though the circuits inside may be more complex."], "jumps": ["P1650", "P1630"]}, {"id": "P1630", "text": ["Most modern FM modulator circuits use integrated circuit voltage controlled oscillators."], "jumps": ["P1640", "P1620"]}, {"id": "P1620", "text": ["The last type of FM modulator circuit is also a VCO (varactor) but, it is in integrated circuit (IC) form.", "Reactance Modulator Varactor Modulator IC VCO Modulator"], "jumps": ["P1630", "P1610"]}, {"id": "P1613", "text": ["If the resonant frequency of the tank circuit did not change according to the information signal input, the circuit would not be an FM modulator."], "jumps": []}, {"id": "P1612", "text": ["If the information input signal decreases, the reverse bias on D1 decreases and increases the capacitance. This increases the capacitance in the tank circuit which will decrease the frequency."], "jumps": []}, {"id": "P1611", "text": [], "jumps": []}, {"id": "P1610", "text": ["If the information input signal decreases, what happens to resonant frequency of the tank circuit?"], "jumps": ["P1600"]}, {"id": "P1603", "text": ["C2 is part of the tank circuit but, R1 is used to feedback the output of Q1 to its input for normal oscillator operation."], "jumps": []}, {"id": "P1602", "text": ["C2 is in the tank circuit but, C1 is used to block the positive voltage used to reverse bias D1 from effecting the tank circuit."], "jumps": []}, {"id": "P1601", "text": [], "jumps": []}, {"id": "P1600", "text": ["In a varactor modulator, how is the resonant frequency of the tank circuit changed by the information signal?", "The total capacitance of C1 and C2 changing..", "The variations of Q1's resistance changing the R1 and C2 capacitance.."], "jumps": ["P1580"]}, {"id": "P1590", "text": ["C1 blocks the reverse biasing voltage from effecting the tank circuit."], "jumps": ["P1600", "P1580"]}, {"id": "P1580", "text": ["The other components function as follows: L1 blocks AC signals from the information source."], "jumps": ["P1590", "P1550"]}, {"id": "P1570", "text": ["When the information signal decreases, D1's reverse bias decreases, increasing its capacitance.  This increases the capacitance of the tank circuit and decreases the frequency output.", "When the information signal decreases, D1's reverse bias decreases, increasing its capacitance. This increases the capacitance of the tank circuit and decreases the frequency output."], "jumps": ["P1580", "P1550"]}, {"id": "P1560", "text": ["When the information signal increases, D1's reverse bias increases, decreasing its capacitance.  This decreases the capacitance of the tank circuit and increases the frequency output.", "When the information signal increases, D1's reverse bias increases, decreasing its capacitance. This decreases the capacitance of the tank circuit and increases the frequency output."], "jumps": ["P1570", "P1550"]}, {"id": "P1550", "text": ["The output of the circuit changes frequency according to the amplitude of the information signal which is FM."], "jumps": ["P1560", "P1520"]}, {"id": "P1540", "text": ["This changes the capacitance of the tank circuit and changes the resonant frequency."], "jumps": ["P1550", "P1520"]}, {"id": "P1530", "text": ["When the capacitance of D1 is changed by the amplitude of the information signal, the total capacitor of C2 and D1 in parallel is changed."], "jumps": ["P1540", "P1520"]}, {"id": "P1520", "text": ["Redrawing the tank and D1 circuit (C1 is a coupling capacitor and is not shown), you can see that D1 is in parallel to C2."], "jumps": ["P1530", "P1490"]}, {"id": "P1510", "text": ["Consequently, the capacitance of D1 is varied according to the amplitude of the information input signal."], "jumps": ["P1520", "P1490"]}, {"id": "P1500", "text": ["However, the reverse bias voltage is varied by the information signal input."], "jumps": ["P1510", "P1490"]}, {"id": "P1490", "text": ["Now, referring back to the varactor modulator circuit, D1 is reverse biased by +V."], "jumps": ["P1500", "P1420"]}, {"id": "P1480", "text": ["In other words, by changing the reverse bias of the varactor diode, its capacitance is changed.", "In other words, by changing the reverse bias of the varactor diode, its capacitance is changed.."], "jumps": ["P1490", "P1420"]}, {"id": "P1470", "text": ["By decreasing the reverse bias, the depletion region decreases,  increasing the capacitance.", "By decreasing the reverse bias, the depletion region decreases, increasing the capacitance."], "jumps": ["P1480", "P1420"]}, {"id": "P1460", "text": ["By increasing the reverse bias, the depletion region increases, effectively decreasing the capacitance."], "jumps": ["P1470", "P1420"]}, {"id": "P1450", "text": ["The diode is effectively a capacitor when reverse biased. The capacitance is determined by the size of the P and N regions."], "jumps": ["P1460", "P1420"]}, {"id": "P1440", "text": ["The P and N regions act as plates and the depletion region acts as the dielectric in a capacitor.", "Depletion Region of Reverse Biased Diode"], "jumps": ["P1450", "P1420"]}, {"id": "P1430", "text": ["However, the diode can appear as a capacitor to AC signals when reverse biased."], "jumps": ["P1440", "P1420"]}, {"id": "P1420", "text": ["When a diode is reverse biased, its resistance is very large and can be considered open.  No DC current flows and a depletion region is formed.", "When a diode is reverse biased, its resistance is very large and can be considered open. No DC current flows and a depletion region is formed.", "Depletion Region of Reverse Biased Diode"], "jumps": ["P1430", "P1370"]}, {"id": "P1410", "text": ["D1 is designed especially as a varactor diode.  It has a variable capacitance depending on the level of reverse bias voltage.  Let's see how it works.", "D1 is designed especially as a varactor diode. It has a variable capacitance depending on the level of reverse bias voltage. Let's see how it works."], "jumps": ["P1420", "P1370"]}, {"id": "P1400", "text": ["The L1, C1, D1 circuit is based on the operation of D1.  Notice that it is not the standard symbol for a diode.", "The L1, C1, D1 circuit is based on the operation of D1. Notice that it is not the standard symbol for a diode."], "jumps": ["P1410", "P1370"]}, {"id": "P1390", "text": ["This is why the circuit is called a voltage controlled oscillator."], "jumps": ["P1400", "P1370"]}, {"id": "P1380", "text": ["These components change the resonant frequency of the tank circuit according to the amplitude of the information input signal, frequency modulation."], "jumps": ["P1390", "P1370"]}, {"id": "P1370", "text": ["The difference between this circuit and a normal oscillator circuit are components L1, C1 and D1."], "jumps": ["P1380", "P1330"]}, {"id": "P1360", "text": ["L2, C2, and C3 is the frequency determining tank circuit that applies the output of Q1 to the input.  This is normal oscillator operation.", "L2, C2, and C3 is the frequency determining tank circuit that applies the output of Q1 to the input. This is normal oscillator operation."], "jumps": ["P1370", "P1330"]}, {"id": "P1350", "text": ["R1 is the feedback component that produces oscillations."], "jumps": ["P1360", "P1330"]}, {"id": "P1340", "text": ["Q1 is the amplifier.  R2, R3, L3, R4, and C5 provide normal voltage divider biasing.", "Q1 is the amplifier. R2, R3, L3, R4, and C5 provide normal voltage divider biasing."], "jumps": ["P1350", "P1330"]}, {"id": "P1330", "text": ["Notice that the varactor modulator appears as a standard oscillator circuit."], "jumps": ["P1340", "P1320"]}, {"id": "P1320", "text": ["The second type of FM modulator circuit is commonly called a Varactor Modulator or Voltage Controlled Oscillator, as you will see.", "Reactance Modulator Varactor Modulator IC VCO Modulator"], "jumps": ["P1330", "P1310"]}, {"id": "P1313", "text": ["If the resonant frequency of the tank circuit did not change according to the information input signal, the circuit would not be a FM modulator."], "jumps": []}, {"id": "P1312", "text": ["If the information input signal increases, Q1 conducts more decreasing its resistance. This increases the capacitance of the circuit lowering the resonant frequency of the tank circuit."], "jumps": []}, {"id": "P1311", "text": [], "jumps": []}, {"id": "P1310", "text": ["If the information input signal increases, what happens to resonant frequency of the tank circuit?"], "jumps": ["P1300"]}, {"id": "P1303", "text": ["C5 and C6 ground both high and low frequency information signals.  This prevents a decrease in Q1's gain.", "C5 and C6 ground both high and low frequency information signals. This prevents a decrease in Q1's gain."], "jumps": []}, {"id": "P1302", "text": ["C3 effects the resonant frequency of the tank circuit but, C4 is a coupling capacitor."], "jumps": []}, {"id": "P1301", "text": [], "jumps": []}, {"id": "P1300", "text": ["In a reactance modulator, how is the resonant frequency of the tank circuit changed by the information signal?", "The total capacitance of C3 and C4 changing..", "The total capacitance of C5 and C6 changing..", "The variations of Q1's resistance changing the R2 and C3 capacitance.."], "jumps": ["P1260"]}, {"id": "P1290", "text": ["L1 and C1 allow most of the low frequency information signal to pass while blocking the higher carrier frequency from the information source."], "jumps": ["P1300", "P1260"]}, {"id": "P1280", "text": ["C2 and C4 are coupling capacitors that separate DC voltages from the information source and the output of the modulator circuit."], "jumps": ["P1290", "P1260"]}, {"id": "P1260", "text": ["R3 provides source bias, C5 and C6 ground both the high frequency fc and low frequency information signal (preventing them from decreasing Q1's gain)."], "jumps": ["P1280", "P1200"]}, {"id": "P1250", "text": ["The circuit increases and decreases the center frequency of the tank circuit according to the amplitude of the information signal which is FM."], "jumps": ["P1260", "P1200"]}, {"id": "P1240", "text": ["Again, the amplitude of the negative information signal effects the amount of frequency change."], "jumps": ["P1250", "P1200"]}, {"id": "P1230", "text": ["In other words, the information signal changed the output frequency modulation."], "jumps": ["P1240", "P1200"]}, {"id": "P1220", "text": ["A lower capacitance in parallel to the tank circuit increases the resonant frequency."], "jumps": ["P1230", "P1200"]}, {"id": "P1210", "text": ["The increased resistance lowers the capacitance of the R2, C3, and Q1 circuit."], "jumps": ["P1220", "P1200"]}, {"id": "P1200", "text": ["If the information input signal is negative or decreasing, Q1 conducts less increasing its resistance."], "jumps": ["P1210", "P1172"]}, {"id": "P1190", "text": ["The higher the positive amplitude of the information signal is the more Q1 conducts (decreasing resistance).  More conduction from Q1causes more capacitance which decreases the output frequency.", "The higher the positive amplitude of the information signal is the more Q1 conducts (decreasing resistance). More conduction from Q1causes more capacitance which decreases the output frequency."], "jumps": ["P1200", "P1172"]}, {"id": "P1180", "text": ["In other words, the information signal changed the output frequency of the circuit, frequency modulation."], "jumps": ["P1190", "P1172"]}, {"id": "P1175", "text": ["CAPACITANCE - Effect of capacitance in a tank circuit. C"], "jumps": []}, {"id": "P1172", "text": ["With more capacitance in parallel to the tank circuit, the resonant frequency decreases."], "jumps": ["P1180", "P1140", "P1175"]}, {"id": "P1170", "text": ["With more capacitance in parallel to the tank circuit, the resonant frequency decreases."], "jumps": ["P1180", "P1140", "P1175"]}, {"id": "P1160", "text": ["With decreased resistance, the capacitance of the R2, C3, and Q1 circuit increases."], "jumps": ["P1170", "P1140"]}, {"id": "P1150", "text": ["This lowers the resistance of Q1 decreasing the resistance of the parallel circuit of R2, C3 and Q1."], "jumps": ["P1160", "P1140"]}, {"id": "P1140", "text": ["With a positive or increasing information input signal, Q1 conducts."], "jumps": ["P1150", "P1050"]}, {"id": "P1130", "text": ["This capacitance is added to the tank circuit of C7 and L2 producing a resonant frequency.  This is the center frequency.", "This capacitance is added to the tank circuit of C7 and L2 producing a resonant frequency. This is the center frequency."], "jumps": ["P1140", "P1050"]}, {"id": "P1120", "text": ["With Q1's resistance, the entire circuit appears as capacitive."], "jumps": ["P1130", "P1050"]}, {"id": "P1110", "text": ["The reactance of C3 is large compared to the resistance of R2, which produces a capacitive circuit."], "jumps": ["P1120", "P1050"]}, {"id": "P1090", "text": ["The resonant frequency of the tank circuit is determined by the values of C7, L2, R2, C3 and Q1."], "jumps": ["P1110", "P1050"]}, {"id": "P1080", "text": ["The capacitance of R2, C3, and Q1 is in parallel to the oscillator's tank circuit C7 and L2 (the entire oscillator circuit is not shown)."], "jumps": ["P1090", "P1050"]}, {"id": "P1070", "text": ["Circuit operation is based on R2, C3, and Q1 appearing as a capacitive circuit."], "jumps": ["P1080", "P1050"]}, {"id": "P1060", "text": ["Reactance modulators are found in older types of FM transmitters.  Newer equipment uses IC modulators.", "Reactance modulators are found in older types of FM transmitters. Newer equipment uses IC modulators."], "jumps": ["P1070", "P1050"]}, {"id": "P1050", "text": ["The reactance modulator changes the frequency of a tank circuit according to the information input signal, this is frequency modulation."], "jumps": ["P1060", "P1030"]}, {"id": "P1040", "text": ["Let's start with the reactance modulator circuit."], "jumps": ["P1050", "P1030"]}, {"id": "P1030", "text": ["There are three typical FM modulator circuits.", "There are three typical FM modulator circuits..............", "Reactance Modulator Varactor Modulator IC VCO Modulator"], "jumps": ["P1040", "P1020"]}, {"id": "P1025", "text": ["The modulator receives two inputs, information and carrier, and generates one output, the FM waveform.", "The modulator circuit is in the transmitter and produces the FM signal."], "jumps": ["P1030", "P1020", "P1025", "P1001"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P460", "text": ["Let's begin the lesson on FM CIRCUITS.E..................................."], "jumps": ["P450"]}, {"id": "P450", "text": ["Once you see how the components and circuits are combined to form modulators and demodulators you will also see they are not too difficult to understand."], "jumps": ["P460", "P400"]}, {"id": "P440", "text": ["These circuits still use common diodes, transistors and reactance circuits."], "jumps": ["P450", "P400"]}, {"id": "P430", "text": ["You will also find that the modulator and demodulator circuits are a little bit more complex."], "jumps": ["P440", "P400"]}, {"id": "P420", "text": ["The difference is that FM circuits change the frequency of a carrier signal in proportion to the amplitude of the information signal."], "jumps": ["P430", "P400"]}, {"id": "P410", "text": ["FM modulators and demodulators operate like AM modulators and demodulators."], "jumps": ["P420", "P400"]}, {"i let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
