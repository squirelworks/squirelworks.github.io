const book = {"title": "93953509", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: BLOCKING OSCILLATOR OPERATIONasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Observe normal operation of free-running blocking oscillators. w Observe normal operation of triggered blocking oscillators......", "w Identify the purpose of blocking oscillators. w Describe the operation of free-running and triggered blocking oscillators."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about the operation of blocking oscillators."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Blocking oscillators change DC into short, rectangular pulses that can be used as timing pulses to trigger other circuits."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Blocking oscillators do not produce sine waves like LC and RC oscillators."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Some radars use blocking oscillators as master clocks to control the many circuits needed to produce tracking pulses."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["Let's begin the lesson on BLOCKING OSCILLATOR OPERATION..................."], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1030", "text": ["The blocking oscillator produces extremely narrow pulses and then stops for a relatively long period of time."], "jumps": ["P1040", "P1020"]}, {"id": "P1125", "text": ["INDUCTIVE KICKBACK - Inductive kickback is a spike of very high voltage, resulting from the almost instantaneous collapse of the magnetic field around an inductor when voltage is removed. A diode can absorb this energy and prevent damage to Q1."], "jumps": ["P1122"]}, {"id": "P1220", "text": ["The width of the output pulse also is dependent upon several factors. Vcc, R1, R2, R3, C2 and T1 all determine the frequency and the pulse width."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["In this lesson, you will not be required  to calculate the frequency of free-running blocking oscillators.", "In this lesson, you will not be required to calculate the frequency of free-running blocking oscillators."], "jumps": ["P1240", "P1210"]}, {"id": "P1320", "text": ["The purpose of triggered blocking oscillators is to improve the shape of input pulses.  The input pulse can be any shape, provided it forward biases Q1.", "There are two basic types of blocking oscillators:  \n\nFree-Running Blocking Oscillator     Triggered Blocking Oscillator", "The purpose of triggered blocking oscillators is to improve the shape of input pulses. The input pulse can be any shape, provided it forward biases Q1.", "There are two basic types of blocking oscillators: Free-Running Blocking Oscillator Triggered Blocking Oscillator"], "jumps": ["P1330", "P1240", "P1050", "P1020"]}, {"id": "P1050", "text": ["Let's look at the operation of a free-running blocking oscillator first.  \nFree-Running Blocking Oscillator     Triggered Blocking Oscillator", "Let's look at the operation of a free-running blocking oscillator first. Free-Running Blocking Oscillator Triggered Blocking Oscillatorrr"], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["When Vcc is applied, the NPN transistor starts to conduct. Note: C1 is not used in free-running operation...."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["Collector current flows through the primary winding of T1, inducing voltage into the secondary (D1 is reverse biased)."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["The voltage on the secondary is limited by R3, and coupled through C2 to the base of Q1. This drives Q1 into saturation."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["C2 charges quickly through the low emitter-to-base resistance of Q1 and assumes the charge shown."], "jumps": ["P1100", "P1060"]}, {"id": "P1100", "text": ["When Q1 reaches saturation, collector current stops increasing. With no change in current, no voltage is coupled through T1."], "jumps": ["P1110", "P1060"]}, {"id": "P1110", "text": ["C2 starts to discharge through R1 and R2. Notice C2's polarity.", "C2 starts to discharge as positive charges flow from the battery through R1 and R2 to the capactior.", "C2 starts to discharge through R1 and R2. Notice C2's polarity.C2 starts to discharge through R1 and R2. Notice C2's polarity."], "jumps": ["P1120", "P1060"]}, {"id": "P1120", "text": ["This causes the base of Q1 to become negative and drives Q1 into cutoff for a comparatively long period of time (D1 prevents inductive kickback) ."], "jumps": ["P1130", "P1060"]}, {"id": "P1122", "text": ["This causes the base of Q1 to become negative and drives Q1 into cutoff for a comparatively long period of time (D1 prevents inductive kickback) ."], "jumps": ["P1130", "P1060"]}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1310", "text": ["This time interval when C2 is discharging is called recovery time. The longer C2 takes to discharge, the longer the recovery time.", "INDUCTIVE KICKBACK - Inductive kickback is a spike of very high voltage, resulting from the almost instantaneous collapse of the magnetic field around an inductor when voltage is removed. A diode can absorb this energy and prevent damage to Q1."], "jumps": ["P1320", "P1240"]}, {"id": "P1130", "text": ["When C2 is almost discharged, the reverse bias (negative) is removed from the base and Q1 starts to conduct again."], "jumps": ["P1140", "P1122"]}, {"id": "P1140", "text": ["The process repeats and the result  is sharp, narrow pulses that can be used to trigger other circuits.", "The process repeats and the result is sharp, narrow pulses that can be used to trigger other circuits."], "jumps": ["P1150", "P1122"]}, {"id": "P1150", "text": ["Let's look at the output section of the oscillator and consider the output pulse shape."], "jumps": ["P1160", "P1122"]}, {"id": "P1160", "text": ["When Q1 is at cutoff, collector voltage is at Vcc.", "When Q1 is at cutoff, collector voltage is at Vcc.........."], "jumps": ["P1170", "P1122"]}, {"id": "P1170", "text": ["When Q1 is saturated for a short time, collector voltage drops to near zero."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["Coupling capacitor C3 passes the AC component of the signal to the output creating sharp, negative pulses. Vcc determines the amplitude of the pulses."], "jumps": ["P1190", "P1160"]}, {"id": "P1190", "text": ["Select the output that could have been produced by a blocking oscillator."], "jumps": []}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1192", "text": ["Blocking oscillators do not produce the type of output you chose.", "Blocking oscillators do not produce the type of output you chose..........."], "jumps": []}, {"id": "P1193", "text": ["Blocking oscillators do not produce the type of output you chose.", "Blocking oscillators do not produce the type of output you chose..........."], "jumps": []}, {"id": "P1200", "text": ["What state is Q1 in when this blocking oscillator produces a sharp, narrow output pulse?"], "jumps": ["P1190"]}, {"id": "P1210", "text": ["The frequency of a blocking oscillator is called Pulse Repetition Frequency or (PRF) and depends on many factors."], "jumps": ["P1220", "P1200", "PRF"]}, {"id": "P1240", "text": ["Let's look now at the operation of a triggered blocking oscillator."], "jumps": ["P1250", "P1210"]}, {"id": "P1250", "text": ["Triggered blocking oscillators cannot free-run. There is not any forward bias on the base of Q1."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["Q1 cannot conduct until an input pulse of sufficient amplitude is coupled through C1 to supply the necessary forward bias."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["As soon as current begins to flow through Q1, the magnetic field built up by the primary of T1 induces voltage into the secondary."], "jumps": ["P1280", "P1240"]}, {"id": "P1280", "text": ["This secondary voltage charges C2 and quickly saturates Q1.  This causes the voltage on the secondary (positive, regenerative feedback) to stop.", "This secondary voltage charges C2 and quickly saturates Q1. This causes the voltage on the secondary (positive, regenerative feedback) to stop."], "jumps": ["P1290", "P1240"]}, {"id": "P1290", "text": ["C2 discharges through R1, R3 and T1. This action reverse biases Q1 and collector current stops."], "jumps": ["P1300", "P1240"]}, {"id": "P1300", "text": ["Q1 must receive another trigger pulse to begin conducting again. However, this pulse must not arrive before C2 is discharged or no output pulse occurs.", "Q1 must receive another trigger pulse to begin conducting again. However, this pulse must not arrive before C2 is discharged or no output pulse occurs.."], "jumps": ["P1310", "P1240"]}, {"id": "P1330", "text": ["The blocking oscillator is often used to \"clean up\" signals when precise timing pulses are required."], "jumps": ["P1340", "P1240"]}, {"id": "P1340", "text": ["Each input pulse produces one output pulse."], "jumps": ["P1350", "P1240"]}, {"id": "P1350", "text": ["If the input frequency to this triggered blocking oscillator is\n50 Hz, what is the output frequency?", "If the input frequency to this triggered blocking oscillator is 50 Hz, what is the output frequency??"], "jumps": ["P1240", "P1352"]}, {"id": "P1910", "text": ["This completes the information on BLOCKING OSCILLATOR OPERATION."], "jumps": ["P1001", "P1350"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10216", "text": ["In this free-running blocking oscillator, a negative bias on the base of Q1 is caused by _________", "an external input pulse. and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "the discharging of C2., and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "inductive kickback. e second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor.", "Page id 883 of Book \"C:\\Dev2000\\Lessons\\93953509.tbk\""], "jumps": []}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1352", "text": ["Your answer is not acceptable. Remember, a triggered blocking oscillator produces one output pulse for every input pulse."], "jumps": []}, {"id": "P1353", "text": ["Your answer is still incorrect. A blocking oscillator with an input frequency of 50 Hz will produce an output frequency of 50 Hz."], "jumps": ["P1910", "P1350"]}, {"id": "P10303", "text": ["This completes the information on BLOCKING OSCILLATOR OPERATION.", "The test is complete and your score is XX%. Do you want to __________"], "jumps": []}, {"id": "P1920", "text": ["1. The purpose of blocking oscillators is to produce sharp,                  narrow, timing pulses.", "1. The purpose of blocking oscillators is to produce sharp, narrow, timing pulses."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. There are two basic types of blocking oscillators, free-running       and triggered.", "2. There are two basic types of blocking oscillators, free-running and triggered."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Free-running blocking oscillators produce an output when             power is applied.", "3. Free-running blocking oscillators produce an output when power is applied.."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  Triggered blocking oscillators require a trigger pulse to                    produce an output pulse.", "4. Triggered blocking oscillators require a trigger pulse to produce an output pulse."], "jumps": ["P1999", "P1930"]}, {"id": "P1999", "text": ["You have completed the Summary.  \nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1930"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["The purpose of this experiment is to observe the operation of a typical blocking oscillator.  Free-running and triggered operation is observed as well as frequency changes in both modes of operation.", "The purpose of this experiment is to observe the operation of a typical blocking oscillator. Free-running and triggered operation is observed as well as frequency changes in both modes of operation."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["Pick up PC PC130-42 card. Compare the card with the schematic shown."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["S1 provides the option of an inductive kickback diode."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["S2 selects a normal or inverted output. The inverted output is taken from the primary of a center tapped transformer."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["R1 provides frequency adjustment in the free-running mode by varying the discharge time constant of C2."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["Let's start the experiment.", "Let's start the experiment.e..............................."], "jumps": ["P2090", "P2040"]}, {"id": "P2090", "text": ["1. Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings..........."], "jumps": ["P2080"]}, {"id": "P2100", "text": ["2. Place PC130-42 in the Test Console PC1 position.", "2. Place PC130-42 in the Test Console PC1 position........."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["3. On PC130-42, Set S1 to Left (IN) and S2 to Down (NORM).", "3. On PC130-42, Set S1 to Left (IN) and S2 to Down (NORM). ternal program = SCAN FCC 0 External program = SCAN PWR 0 1PC3 Speaker switch to ON........................................."], "jumps": ["P2100", "P2115"]}, {"id": "P2115", "text": ["MEASUREMENT SETUP - Place S1 to the Left (In) and S2 to Down (Norm)."], "jumps": []}, {"id": "P2120", "text": ["4.  Rotate R1 on PC130-42 to the mid-position.", "4. Rotate R1 on PC130-42 to the mid-position. ernal program = SCAN FTR 0 C1 00 the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2110", "P2125"]}, {"id": "P2125", "text": ["MEASUREMENT SETUP - Carefully place R1 to mid position."], "jumps": []}, {"id": "P2130", "text": ["5. Set PC1 DC Power switch to ON.  \n6. Set the Voltmeter switch to Positive. Set the Positive Supply          Voltage to 12. The Test Console's voltage meter should                   indicate 12 volts.", "5. Set PC1 DC Power switch to ON. 6. Set the Voltmeter switch to Positive. Set the Positive Supply Voltage to 12. The Test Console's voltage meter should indicate 12 volts...."], "jumps": ["P2120"]}, {"id": "P2140", "text": ["The experiment is now set up. Let's observe normal operation of a free-running blocking oscillator."], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["1. Using your oscilloscope, measure the frequency of the output       pulses at TP8 on PC130-42.  \n     Enter the measured value.", "1. Using your oscilloscope, measure the frequency of the output pulses at TP8 on PC130-42. Enter the measured value."], "jumps": ["P2140", "P2152", "P2155"]}, {"id": "P2151", "text": [], "jumps": []}, {"id": "P2152", "text": ["Your answer is not acceptable. Check that you are measuring TP8 on PC130-42 and that R1 is set to the MID position."], "jumps": []}, {"id": "P2153", "text": ["Your answer is still incorrect. You should have measured about 1.3 kHz with your oscilloscope. If you are unable to obtain this reading, contact your instructor."], "jumps": ["P2150"]}, {"id": "P2155", "text": ["MEASURING FREQUENCY - To measure frequency using an oscilloscope, count the number of divisions for one cycle and multiply by the Time/Div setting then, divide into 1.", "'}:5 t0H( 9E}A9As5/GA}A;aEAA}EAKE;AAaAE;A}AEAU;aA};aEAEA;EAAAEA;E;AaA", "EUaa 555G7EEEa::Ts1TA;;AA;EEA;AAa9:AAE;E;;;UaAA;AEEA;aA};AA9aAA}}};E;AA9E}9AA;}AAEaaA;AEAEaAAEEaAAA9EEAAA}EAE;aEEEAU;EE;Ea;}", "EK,,L17;UT9;EK;,=17=9EK;AaTs a7(aEAEas5:9<5", "mzF(tt-FsFF-cmzssttst|t--yTmVstys|tytts sm t syst", ";EaTTy55F }Aaas= yjm;AEEAA T_}zc(GGFGVVVccVcVVlllGLVs-FFccclFm--jz5(-VFzmmm(ctmmlmzzzFFFFFzmmmctmFmsmmtcVmt5mzzl-zFmmFmtz", "KT[Qa9mFKKaa 5TL:EAa95 |9/:}EAEAALA_l>lz(lllFmV-V/czzFzFz/cVmcc--F(GlzFVllWmzzm(mzm(FzmpcF(zmFlzFmmlz-llplcmV-z-mcjsFV`zltmlzFVz-tVczFFtcmVmzlFz(mmzFmzFzmFl/VtmtVFmzmVcmmsVccFtsm y winding of the transformer \"ringing\".", "Notice the oscillations after the pulse on the oscilloscope. This is caused by the primary winding of the transformer \"ringing\"."], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["This is an unwanted condition and in extreme cases, may cause damage to transistors. D1 prevents ringing and inductive kickback."], "jumps": ["P2210", "P2180"]}, {"id": "P2210", "text": ["4. Set S1 to the Left (IN) position. Notice the ringing is eliminated.", "'}:5 t0H( 9E}A9As5/GA}A;aEAA}EAKE;AAaAE;A}AEAU;aA};aEAEA;EAAAEA;E;AaA", "EUaa 555G7EEEa::Ts1TA;;AA;EEA;AAa9:AAE;E;;;UaAA;AEEA;aA};AA9aAA}}};E;AA9E}9AA;}AAEaaA;AEAEaAAEEaAAA9EEAAA}EAE;aEEEAU;EE;Ea;}", "EK,,L17;UT9;EK;,=17=9EK;AaTs a7(aEAEas5:9<5", "mzF(tt-FsFF-cmzssttst|t--yTmVstys|tytts sm t syst", ";EaTTy55F }Aaas= yjm;AEEAA T_}zc(GGFGVVVccVcVVlllGLVs-FFccclFm--jz5(-VFzmmm(ctmmlmzzzFFFFFzmmmctmFmsmmtcVmt5mzzl-zFmmFmtz", "KT[Qa9mFKKaa 5TL:EAa95 |9/:}EAEAALA_l>lz(lllFmV-V/czzFzFz/cVmcc--F(GlzFVllWmzzm(mzm(FzmpcF(zmFlzFmmlz-llplcmV-z-mcjsFV`zltmlzFVz-tVczFFtcmVmzlFz(mmzFmzFzmFl/VtmtVFmzmVcmmsVccFtsmmmmFFysGsV", "}9}AAK,,KKK/>V;U9a;EE;KTfV=:lFE;AaTTssc AA :: :9W5EAEEA-Es.>i?fodfi..r.l`(zlVclmlFzljlm", "K,EKK71CA;TU9;EKK:/H:ajlEaaaTa :G Eaa9sya9W", "iid>?>>viijVjcFGfmsG5ssTy|ymssmV5|Hsy5ysTTVsytmmV|t=sm55ms5VLmsH5sGc5m5m=VmmVmmmGmtymmls5j5mmmFV5spcmmmmV5mtt5Gmmmltsmmlmsmy5T5mssQtysFssmmmsmmtsmtsymmtss myy|s5|T5|ystsHa|s|", ",K,KK,,E,,E',EK'5@P=;''aaaT55 5GT;aA9AAOA;AA;AA:;Aa'", "aA 999a9=9}A:aa9=9aA 59O9a::A T:T:a: a=: } - aaaT :AA55:9:aa=Ta A::a aaa=:}AA } A"], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["5. Vary R1 (PRF Control) on PC130-42 while observing the                   display on the oscilloscope. Return R1 to the mid position. \n     Did the frequency of the free-running blocking oscillator                  change as R1 was varied?", "5. Vary R1 (PRF Control) on PC130-42 while observing the display on the oscilloscope. Return R1 to the mid position. Did the frequency of the free-running blocking oscillator change as R1 was varied???"], "jumps": ["P2210", "P2225", "PRF"]}, {"id": "P2221", "text": [], "jumps": []}, {"id": "P2222", "text": ["The frequency should have changed as R1 was varied. Ensure you are measuring TP8 on PC130-42."], "jumps": []}, {"id": "P2225", "text": ["MEASUREMENT SETUP - Vary R1 while observing the display on the oscilloscope."], "jumps": []}, {"id": "P2227", "text": ["Increasing R1 slows the rate at which C2 discharges, causing frequency to decrease."], "jumps": ["P2228", "P2220"]}, {"id": "P2228", "text": ["Decreasing R1 increases the rate at which C2 discharges causing frequency to increase."], "jumps": ["P2240", "P2227"]}, {"id": "P2240", "text": ["6. While observing the voltage meter on the Test Console, vary          the Positive Supply Voltage between 5 and 15 volts. \n     Does changing Vcc change the frequency (PRF) of the free-           running blocking oscillator?", "6. While observing the voltage meter on the Test Console, vary the Positive Supply Voltage between 5 and 15 volts. Does changing Vcc change the frequency (PRF) of the free- running blocking oscillator???"], "jumps": ["P2228", "PRF"]}, {"id": "P2241", "text": [], "jumps": []}, {"id": "P2242", "text": ["Changing the Vcc of a free-running blocking oscillator does change the output frequency (PRF). You should notice the change on the oscilloscope."], "jumps": ["PRF"]}, {"id": "P2245", "text": ["Increasing Vcc increases the frequency. Decreasing Vcc decreases the frequency."], "jumps": ["P2250", "P2240"]}, {"id": "P2250", "text": ["7. Set the Positive Supply Voltage switch back to 12 volts. Now          let's observe normal operation of a triggered blocking                      oscillator.", "7. Set the Positive Supply Voltage switch back to 12 volts. Now let's observe normal operation of a triggered blocking oscillator."], "jumps": ["P2245"]}, {"id": "P2260", "text": ["A triggered blocking oscillator has no forward bias until an input pulse is received. This forward bias is removed by placing a ground at TP4."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["8. The computer will ground TP4 to remove the forward bias.             The circuit is now a triggered blocking oscillator.", "8. The computer will ground TP4 to remove the forward bias. The circuit is now a triggered blocking oscillator."], "jumps": ["P2260"]}, {"id": "P2280", "text": ["1. Ensure your oscilloscope probe is still on TP8. Notice that               there is no output from the oscillator.", "1. Ensure your oscilloscope probe is still on TP8. Notice that there is no output from the oscillator."], "jumps": ["P2290", "P2260"]}, {"id": "P2290", "text": ["2. Connect the output from the function generator to the input           BNC connector on the Test Console.  \n3. Set the function generator for a 500 Hz, 10 Vpp square wave          signal as measured on pin E of PC130-42 with CH1 of your             oscilloscope.", "2. Connect the output from the function generator to the input BNC connector on the Test Console. 3. Set the function generator for a 500 Hz, 10 Vpp square wave signal as measured on pin E of PC130-42 with CH1 of your oscilloscope....."], "jumps": ["P2300", "P2260", "P2295"]}, {"id": "P2295", "text": ["OSCILLOSCOPE LEAD PLACEMENT - Carefully connect CH1 probe to pin E."], "jumps": []}, {"id": "P2300", "text": ["4. Set the oscilloscope for dual trace and measure TP8 of PC130-     42 using CH2.  \n    What is the output frequency of the triggered blocking                     oscillator?", "4. Set the oscilloscope for dual trace and measure TP8 of PC130- 42 using CH2. What is the output frequency of the triggered blocking oscillator?????"], "jumps": ["P2290", "P2302", "P2305"]}, {"id": "P2301", "text": [], "jumps": []}, {"id": "P2302", "text": ["Your answer is not acceptable. Ensure that you are measuring TP8 and that the function generator is set for 500 Hz."], "jumps": []}, {"id": "P2303", "text": ["Your mm(ctmmlmzzzFFFFFzmmmctmFmsmmtcVmt5mzzl-zFmmFmtz", "KT[Qa9mFKKaa 5TL:EAa95 |9/:}EAEAALA_l>lz(lllFmV-V/czzFzFz/cVmcc--F(GlzFVllWmzzm(mzm(FzmpcF(zmFlzFmmlz-llplcmV-z-mcjsFV`zltmlzFVz-tVczFFtcmVmzlFz(mmzFmzFzmFl/VtmtVFmzmVcmmsVccFtsmmmmFFysGsV", "}9}AAK,,KKK/>V;U9a;EE;KTfV=:lFE;AaTTssc AA :: :9W5EAEEA-Es.>i?fodfi..r.l`(zlVclmlFzljlm", "K,EKK71CA;TU9;EKK:/H:ajlEaaaTa :G Eaa9sya9W", "iid>?>>viijVjcFGfmsG5ssTy|ymssmV5|Hsy5ysTTVsytmmV|t=sm55ms5VLmsH5sGc5m5m=VmmVmmmGmtymmls5j5mmmFV5spcmmmmV5mtt5Gmmmltsmmlmsmy5T5mssQtysFssmmmsmmtsmtsymmtss myy|s5|T5|ystsHa|s|", ",K,KK,,E,,E',EK'5@P=;''aaaT55 5GT;aA9AAOA;AA;AA:;Aa'", "aA 999a9=9}A:aa9=9aA 59O9a::A T:T:a: a=: } - aaaT :AA55:9:aa=Ta A::a aaa=:}AA } A"], "jumps": ["P13220", "P13200"]}, {"id": "P13220", "text": ["5. Vary R1 (PRF Control) on PC130-42 while observing the                  display on the oscilloscope. Return R1 to the mid position.  \n    Did the frequency of the free-running blocking oscillator                  change as R1 was varied?", "5. Vary R1 (PRF Control) on PC130-42 while observing the display on the oscilloscope. Return R1 to the mid position. Did the frequency of the free-running blocking oscillator change as R1 was varied?????"], "jumps": ["P13210", "P13225", "PRF"]}, {"id": "P13221", "text": [], "jumps": []}, {"id": "P13222", "text": ["The frequency should have changed as R1 was varied. Ensure you are measuring TP8 on PC130-42."], "jumps": []}, {"id": "P13225", "text": ["MEASUREMENT SETUP - Vary R1 while observing the display on the oscilloscope."], "jumps": []}, {"id": "P13227", "text": ["Increasing R1 slows the rate at which C2 discharges, causing frequency to decrease."], "jumps": ["P13228", "P13220"]}, {"id": "P13228", "text": ["Decreasing R1 increases the rate at which C2 discharges causing frequency to increase."], "jumps": ["P13240", "P13227"]}, {"id": "P13240", "text": ["6.  While observing the voltage on the Test Console, vary                     the Positive Supply Voltage between 5 and 15 volts. \n     Does changing Vcc change the frequency (PRF) of the free-           running blocking oscillator?", "6. While observing the voltage on the Test Console, vary the Positive Supply Voltage between 5 and 15 volts. Does changing Vcc change the frequency (PRF) of the free- running blocking oscillator?"], "jumps": ["P13228", "PRF"]}, {"id": "P13241", "text": [], "jumps": []}, {"id": "P13242", "text": ["Changing the Vcc of a free-running blocking oscillator does change the output frequency (PRF). You should notice the change on the oscilloscope."], "jumps": ["PRF"]}, {"id": "P13245", "text": ["Increasing Vcc increases the frequency.  Decreasing Vcc decreases the frequency.", "Increasing Vcc increases the frequency. Decreasing Vcc decreases the frequency."], "jumps": []}, {"id": "P13250", "text": ["7.   Now let's observe normal operation of a triggered blocking            oscillator.", "7. Now let's observe normal operation of a triggered blocking oscillator.......riggered blocking oscillator.oscillator....."], "jumps": ["P13245"]}, {"id": "P13260", "text": ["A triggered blocking oscillator has no forward bias until an input pulse is received. This forward bias is removed by placing a ground at TP4."], "jumps": ["P13270"]}, {"id": "P13270", "text": ["8.  The computer will ground TP4 to remove the forward bias.             The circuit is now a triggered blocking oscillator.", "8. The computer will ground TP4 to remove the forward bias. The circuit is now a triggered blocking oscillator....... = FLT 0 F108 S"], "jumps": ["P13260"]}, {"id": "P13280", "text": ["1.  Ensure your oscilloscope probe is still on TP8. Notice that              there is no output from the oscillator.", "1. Ensure your oscilloscope probe is still on TP8. Notice that there is no output from the oscillator.."], "jumps": ["P13290"]}, {"id": "P13290", "text": ["2. Connect the output from the function generator to the input            BNC connector on the Test Console. \n3. Set the function generator for a 500 Hz, 10 Vpp square wave          signal as measured on pin E of PC130-42 with CH1 of your             oscilloscope.", "2. Connect the output from the function generator to the input BNC connector on the Test Console. 3. Set the function generator for a 500 Hz, 10 Vpp square wave signal as measured on pin E of PC130-42 with CH1 of your oscilloscope...."], "jumps": ["P13300", "P13260", "P13295"]}, {"id": "P13295", "text": ["OSCILLOSCOPE LEAD PLACEMENT - Carefully connect CH1 probe to pin E."], "jumps": []}, {"id": "P13300", "text": ["4.  Set the oscilloscope for dual trace and measure TP8 of \n      PC130- 42 using CH2.  \n     What is the output frequency of the triggered blocking                     oscillator?", "4. Set the oscilloscope for dual trace and measure TP8 of PC130- 42 using CH2. What is the output frequency of the triggered blocking oscillator??????"], "jumps": ["P13290", "P13302", "P13305"]}, {"id": "P13301", "text": [], "jumps": []}, {"id": "P13302", "text": ["Your answer is not acceptable. Ensure that you are measuring TP8 and that the function generator is set for 500 Hz."], "jumps": []}, {"id": "P13303", "text": ["Your answer is still incorrect. You should have measured a \n500 Hz signal consisting of sharp, narrow pulses.", "Your answer is still incorrect. You should have measured a 500 Hz signal consisting of sharp, narrow pulses."], "jumps": ["PutVar"]}, {"id": "P13305", "text": ["MEASURING FREQUENCY - To measure frequency using an oscilloscope, count the number of divisions for one cycle and multiply by the Time/Div setting then, divide into 1.", "'}:5 t0H( 9E}A9As5/GA}A;aEAA}EAKE;AAaAE;A}AEAU;aA};aEAEA;EAAAEA;E;AaA", "EUaa 555G7EEEa::Ts1TA;;AA;EEA;AAa9:AAE;E;;;UaAA;AEEA;aA};AA9aAA}}};E;AA9E}9AA;}AAEaaA;AEAEaAAEEaAAA9EEAAA}EAE;aEEEAU;EE;Ea;}", "EK,,L17;UT9;EK;,=17=9EK;AaTs a7(aEAEas5:9<5", "mzF(tt-FsFF-cmzssttst|t--yTmVstys|tytts sm t syst", ";EaTTy55F }Aaas= yjm;AEEAA T_}zc(GGFGVVVccVcVVlllGLVs-FFccclFm--jz5(-VFzmmm(ctmmlmzzzFFFFFzm let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
