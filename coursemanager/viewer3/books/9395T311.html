<script>
const book = {"title": "9395T311", "pages": [{"id": "P10211", "text": ["What is the rotating center electromagnet called?"], "jumps": []}, {"id": "P10212", "text": ["What component is split into segments and each segment is isolated from each other and the shaft?"], "jumps": []}, {"id": "P2090", "text": ["If a high resistance field coil is used in a DC Series motor, most of will drop across the field coil leaving very little voltage across the armature. The rotor will not rotate."], "jumps": ["P2100", "P2060"]}, {"id": "P10210", "text": ["The principal that electrical energy produces mechanical energy."], "jumps": []}, {"id": "P1570", "text": ["You may have felt the pain of a twisted wrist due to high torque when a Series motor is suddenly stopped.", "Nida Corporation - DC Series Field Motor"], "jumps": ["P1580", "P1560"]}, {"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P2280", "text": ["Because of CEMF, does not equal the applied voltage divided by the resistance of the armature.."], "jumps": ["P2290", "P2270"]}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about DC motors."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Within the field of Industrial Controls, any output device, which exhibits a rotating shaft, is called a \"rotating machine\", or more simply a motor.."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["DC motors represent a large portion of rotating machinery.."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["There are three basic types of DC motors: Shunt, Series and Compound..."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["This lesson focuses on DC Series Field motors.............."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["Many of today's most common devices use DC Series motors..."], "jumps": ["P460", "P440"]}, {"id": "P460", "text": ["Let's begin the lesson on DC SERIES MOTORS................................"], "jumps": ["P450"]}, {"id": "P900", "text": [], "jumps": ["P460"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Electric motors are devices that convert electrical energy into mechanical energy..."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["One type of electric motor is called the DC motor."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The DC motor uses Direct Current (DC) as its electrical power supply..."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Let's see the basic principles of DC motor action.."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["First, a magnetic field is produced using two magnets......"], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["Note that the magnets are stationary and not allowed to move toward each other..."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["A rotating magnet is placed between the other two magnets.."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["Because like poles repel and unlike poles attract, the center magnet rotates..."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["The attraction of unlike poles causes the center magnet to be drawn to the stationary magnets."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["When the poles of the center magnet change, the like poles will repel and rotation will occur."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["By continually changing the poles of the center magnet, motor action occurs..."], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["What do like magnetic poles of two magnets do to each other?"], "jumps": ["P1100"]}, {"id": "P1131", "text": [], "jumps": []}, {"id": "P1132", "text": ["Unlike poles attract toward each other....................."], "jumps": []}, {"id": "P1133", "text": ["The magnetic poles of two magnets will affect each other by either attraction (unlike poles) or repulsion (like poles)."], "jumps": []}, {"id": "P1140", "text": ["This is basic motor action. However, the center magnet cannot be a permanent magnet."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["Since the poles of a permanent magnet cannot be changed, an electromagnet is used."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["By reversing the DC current flow, the poles of the center magnet change..."], "jumps": ["P1170", "P1140"]}, {"id": "P1170", "text": ["The center electromagnet is called the armature or rotor..."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["Why is an electromagnet used for motors?...................", "The poles of a permanent magnet can be changed.", "The poles of an electromagnet cannot be changed.", "The poles of an electromagnet can be changed."], "jumps": ["P1140"]}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1182", "text": ["The poles of a permanent magnet are set, while electromagnetic poles can be changed."], "jumps": []}, {"id": "P1190", "text": ["The actual construction of the DC motor shows the armature as a coil, also known as windings."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["A commutator rotates with the armature and is a copper or copper alloy cylinder split into segments with each segment insulated from one another and the shaft."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["Each commutator segment is connected to an end of an armature winding..."], "jumps": ["P1220", "P1190"]}, {"id": "P1220", "text": ["Brushes make contact with the commutator and are normally made of a carbon compound to reduce friction."], "jumps": ["P1230", "P1190"]}, {"id": "P1230", "text": ["The brushes are used to conduct current from the power source to the armature windings."], "jumps": ["P1240", "P1190"]}, {"id": "P1240", "text": ["When a power source is connected to the armature, through the brushes and commutator, a magnetic field is produced."], "jumps": ["P1250", "P1190"]}, {"id": "P1250", "text": ["This allows the direction of current flow to change each 1800 of rotation, reversing the poles in the armature."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["Because the poles in the armature reverse, motor action occurs."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["Since DC is applied, the rotating machine is a DC motor...."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["The schematic symbol for this type of DC motor shows the armature and brushes..."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["It is called a permanent magnet DC Motor because the armature is placed between two permanent magnets."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["The stationary magnets are called the Stator."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["The most commonly used type of DC Motor is the electromagnetic design...", "Stator Coil or Field Coil"], "jumps": ["P1320", "P1290"]}, {"id": "P1320", "text": ["Instead of a permanent magnet stator, an electromagnet stator is used..."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["The coils around the stator are the field windings........."], "jumps": ["P1340", "P1310"]}, {"id": "P1340", "text": ["The field windings connect to the same power source as the armature (rotor) windings."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["The way the field windings are connected produces the three types of Electromagnetic DC motors."], "jumps": ["P1360", "P1330"]}, {"id": "P1360", "text": ["The field coil windings of a DC motor are represented as an inductor..."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["The schematic symbol for a basic Electromagnetic DC Series motor shows the brushes, armature, and includes the field coil."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["The DC Shunt Field motor shows the field coil in parallel with the armature..."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["The DC Series Field motor shows the field coil in series with the armature..."], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["The Compound motor contains a shunt and series field coil.."], "jumps": ["P1410", "P1390"]}, {"id": "P1412", "text": ["The schematic you selected represents a DC Shunt motor. Notice the coil is in parallel with the armature."], "jumps": []}, {"id": "P1411", "text": [], "jumps": []}, {"id": "P1450", "text": ["When the voltage source ( ) is varied, current flowing through the armature will vary."], "jumps": ["P1460", "P1420"]}, {"id": "P1920", "text": ["1. DC motors operate using direct current to produce mechanical energy........"], "jumps": ["P1930", "P1001"]}, {"id": "P1413", "text": ["The schematic you selected is configured as a Short Shunt Compound motor. The shunt coil is in parallel with the armature and a series coil is in series with both the shunt coil and armature....."], "jumps": []}, {"id": "P1420", "text": ["In a series field DC motor, the field coil must exhibit low resistance (few turns of heavy wire), since the coil is in series with the armature. This allows nearly all of to reach the armature for shaft rotation........"], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["The amount of current available to the armature determines the speed of the motor. Decreasing the current to the armature decreases motor speed."], "jumps": ["P1450", "P1420"]}, {"id": "P2223", "text": ["You divided by . Torque is the product of armature and field currents.", "* Throughout this lesson assume that (K) has a value of 1.", "I = Armature Current I = Field Coil Current K = Physical Characteristics of the Fieldd"], "jumps": []}, {"id": "P1460", "text": ["By placing a variable resistor in parallel with the Series Field Coil, the coil current ( ) and armature current can also be varied..."], "jumps": ["P1470", "P1450"]}, {"id": "P1470", "text": ["Now let's see how motor direction is changed..............."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["Using a series motor rotating in a clockwise direction, let's find out the two ways of changing rotational direction."], "jumps": ["P1490", "P1470"]}, {"id": "P1490", "text": ["Reversing the direction of current in the armature is one way."], "jumps": ["P1500", "P1470"]}, {"id": "P1500", "text": ["The other way is to reverse the direction of current in the series field..."], "jumps": ["P1510", "P1470"]}, {"id": "P1510", "text": ["One thing to remember is that reversing both the armature and the series field will not change the direction of the motor. Only the armature OR the series field can be reversed in order to change the rotation of the motor....."], "jumps": ["P1520", "P1470"]}, {"id": "P1520", "text": ["Industrial applications sometimes require the ability of the motor to change directions."], "jumps": ["P1530", "P1470"]}, {"id": "P1530", "text": ["The best control systems will not produce proper results if the motor is not sized properly."], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["A motor that is oversized (too large) will consume more current (power), increase the cost of the motor and amplifier, stress associated machinery, and lose some control which will cause the load to be moved too easily..."], "jumps": ["P1550", "P1530"]}, {"id": "P1550", "text": ["A motor that is undersized (too small) will overheat, and will not supply sufficient torque.C"], "jumps": ["P1560", "P1540"]}, {"id": "P1560", "text": ["The Series motor has high torque (twisting action) under locked rotor conditions and low torque at high speeds."], "jumps": ["P1570", "P1550"]}, {"id": "P2730", "text": [], "jumps": ["P2740", "P2710"]}, {"id": "P2610", "text": ["After horsepower is found, it must be converted into Watts."], "jumps": ["P2620", "P2590"]}, {"id": "P1590", "text": ["In the next lesson you will study the Characteristics of a DC Series motor..."], "jumps": ["P1910", "P1580"]}, {"id": "P1910", "text": ["This completes the information on DC MOTORS.1 TITLE........"], "jumps": ["P1001", "P1590"]}, {"id": "P2290", "text": ["equals the applied voltage minus CEMF divided by the resistance of the armature..."], "jumps": ["P2300", "P2270"]}, {"id": "P1930", "text": ["2. The electromagnetic type of DC motor incorporates a field coil to produce the field lines needed for motor action............"], "jumps": ["P1940", "P1920"]}, {"id": "P2060", "text": ["Let's begin by looking at the construction of a DC Series Field motor..."], "jumps": ["P2070", "P2050"]}, {"id": "P1950", "text": ["4. Speed control can be obtained by varying either the armature voltage or the current through the field coil..............."], "jumps": ["P1999", "P1940"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1950"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2340", "text": ["Let's see what happens when CEMF increases................."], "jumps": ["P2350", "P2310", "P2345"]}, {"id": "P2030", "text": ["As you know, all motors share certain characteristics......"], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["Each of these characteristics can be measured or calculated."], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["You will learn how to calculate many DC series field motor circuit values..."], "jumps": ["P2060", "P2030"]}, {"id": "P2222", "text": ["You added and . Torque is the product of armature current, field current and the physical characteristics of the field.", "* Throughout this lesson assume that (K) has a value of 1.", "I = Armature Current I = Field Coil Current K = Physical Characteristics of the Fieldd"], "jumps": []}, {"id": "P2070", "text": ["The field coil has few turns of heavy wire designed to produce a low resistance..."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["The low resistance is needed to allow most of to be felt across the armature. This ensures the armature will rotate."], "jumps": ["P2090", "P2060"]}, {"id": "P2510", "text": ["In a DC Series motor, P (power in) is electrical, while P (power out) is mechanical. Let's first look at P .....", "ross the armature. The rotor will not rotate."], "jumps": ["P2520", "P2500"]}, {"id": "P2100", "text": ["Let's explore torque in a series field motor..............."], "jumps": ["P2110", "P2060"]}, {"id": "P2650", "text": ["The efficiency of a motor is the ratio of the mechanical output power to the electrical input power."], "jumps": ["P2660", "P2640"]}, {"id": "P2120", "text": ["The equation states that the output torque of a motor is the product of the armature current ( ), field coil current ( ), and the physical characteristics of the field (K).."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["Throughout this lesson assume that (K) has a value of 1. This will simplify calculations."], "jumps": ["P2140", "P2110"]}, {"id": "P2140", "text": ["The units of torque are measured in Foot", "Meters depending on the system of measurement used."], "jumps": ["P2150", "P2110"]}, {"id": "P2150", "text": ["Calculating torque is accomplished by determining the currents in the armature and field circuits."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["One method is to measure current using an ammeter..........", "Since it is difficult to get inside most motor cases, measuring and is normally impractical...."], "jumps": ["P2170", "P2140", "P2180", "P2160"]}, {"id": "P2710", "text": ["As RPM decreases, CEMF also decreases. This relationship increases torque as well as I ."], "jumps": ["P2720", "P2700"]}, {"id": "P2190", "text": ["As you can see, and can be easily measured outside the motor..."], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["Total current can be calculated using the applied voltage and the total resistance. The total resistance is the combination of the armature and field coil. = + ."], "jumps": ["P2210", "P2180"]}, {"id": "P2220", "text": ["What is the torque in this DC Series motor?................"], "jumps": ["P2210"]}, {"id": "P2250", "text": ["As motor shaft speed increases, CEMF increases. They are directly proportional..."], "jumps": ["P2260", "P2230"]}, {"id": "P2221", "text": [], "jumps": []}, {"id": "P2540", "text": ["Now let's look at P . Remember, P is mechanical..al.l.", "Torque is the product of armature and field currents.", "You divided by . Torque is the product of armature and field currents."], "jumps": ["P2560", "P2530"]}, {"id": "P2230", "text": ["As the motor rotates, torque will decrease. To understand this, the phenomena of CEMF must be added."], "jumps": ["P2240", "P2220"]}, {"id": "P2090", "text": ["If a high resistance field coil is used in a DC Series motor, most of will drop across the field coil leaving very little voltage across the armature. The rotor will not rotate."], "jumps": ["P2100", "P2060"]}, {"id": "P2250", "text": ["As motor shaft speed increases, CEMF increases. They are directly proportional..."], "jumps": ["P2260", "P2230"]}, {"id": "P2255", "text": ["CEMF - defined in terms of LENZ'S LAW. CEMF can best be visualized as an opposite polarity battery placed in series to the armature and the armature voltage ( ) of a DC series field motor...", "The polarity of an induced electromagnetic force is such that it sets up a current, the magnetic field of which always opposes the change in the existing magnetic field."], "jumps": []}, {"id": "P2260", "text": ["CEMF opposes the original armature voltage that induces motor action..."], "jumps": [" d": "P2420", "text": ["As speed increases, CEMF increases. As a result, IA decreases..."], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["Torque equals I x I x K. If speed increases then torque decreases due to I decreasing."], "jumps": ["P2440", "P2410"]}, {"id": "P2440", "text": ["In other words, as speed increases, IT decreases."], "jumps": ["P2450", "P2410"]}, {"id": "P2500", "text": ["Now, let's talk about POWER. Remember:...................", "% Efficiency = x 100"], "jumps": ["P2510", "P2470"]}, {"id": "P2460", "text": ["Another factor affecting speed is the LOAD................."], "jumps": ["P2470", "P2410"]}, {"id": "P2470", "text": ["As load increases, RPM decreases..........................."], "jumps": ["P2480", "P2460"]}, {"id": "P2480", "text": ["As RPM decreases, CEMF decreases, increasing torque."], "jumps": ["P2490", "P2470"]}, {"id": "P2490", "text": ["The only new concept is the effect of a load on RPM. All other relationships remain the same."], "jumps": ["P2500", "P2470"]}, {"id": "P1412", "text": ["The schematic you selected represents a DC Shunt motor. Notice the coil is in parallel with the armature."], "jumps": []}, {"id": "P2520", "text": ["Calculating power In is done by multiplying the total applied voltage (V ) times the total current ( I ). P = V x I"], "jumps": ["P2530", "P2510"]}, {"id": "P2530", "text": ["What is the input power to this DC Series motor??.........."], "jumps": ["P2510"]}, {"id": "P2531", "text": [], "jumps": []}, {"id": "P2532", "text": ["Remember, input power equals voltage times current........."], "jumps": []}, {"id": "P2640", "text": ["Knowing P and P , we can now find the efficiency of the motor..or.or.r."], "jumps": ["P2650", "P2630"]}, {"id": "P2560", "text": ["Mechanical power is expressed in horsepower (hp). To find the output power in Watts, horsepower is calculated and then converted to Watts."], "jumps": ["P2570", "P2540"]}, {"id": "P2570", "text": ["One horsepower is the energy required to lift "text": ["When a motor is first turned on, there is 0 RPM and 0 CEMF."], "jumps": ["P2830", "P2810"]}, {"id": "P2830", "text": ["Since CEMF is 0, the entire applied voltage is felt across the armature coils. Armature current is maximum."], "jumps": ["P2840", "P2810"]}, {"id": "P2840", "text": ["As the motor begins to spin, armature current as well as total current drawn from the power source, will decrease due to the increasing CEMF.", "RPM = 0 CEMF - Increasing IT - Decreasing"], "jumps": ["P2850", "P2810"]}, {"id": "P2850", "text": ["Even if the running current for a motor is small, the armature coil, field coil, and other connecting wires must be able to handle larger current at 0 RPM."], "jumps": ["P2860", "P2810"]}, {"id": "P2860", "text": ["In fact, some large motors have two sets of coils and wires that are controlled by a centrifugal switch."], "jumps": ["P2870", "P2850"]}, {"id": "P2870", "text": ["A heavy-duty set of coils is used for starting the motor. This rates the motor for higher starting current."], "jumps": ["P2880", "P2860"]}, {"id": "P2880", "text": ["A normal set of coils is used when the motor is running. This rates the motor for lower running current."], "jumps": ["P2910", "P2860"]}, {"id": "P2910", "text": ["This completes the information on SERIES FIELD CHARACTERISTICS."], "jumps": ["P2001", "P2880"]}, {"id": "P2920", "text": ["1. The DC Series Motor has the same basic characteristics as any motor..."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2. The Series Field motor has the field coil in series with the armature. The field coil uses heavy wire with few turns to obtain a low resistance."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3. The Series Field motor has high torque at low RPM and reduced torque at high RPM.............."], "jumps": ["P2950", "P2930"]}, {"id": "P2950", "text": ["4. Calculating torque is accomplished by determining the currents in the armature and field circuits......."], "jumps": ["P2960" let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
