<script>
const book = {"title": "93955209", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ............................"], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: AMPLITUDE CONTROL OF DC MOTORSsfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Verify amplitude control of a DC motor. w Monitor circuit action in a typical DC motor controller....", "w Describe a typical analog and digital start/speed control circuit for small DC motors. w Describe a digital start/speed control circuit."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "3. Nida Model 280 Rotating Machinery Trainer", "6. Nida Experiment Card PC130-111 XXXXXXXXnt"], "jumps": []}, {"id": "P302", "text": [], "jumps": []}, {"id": "P330", "text": ["Nida Model 280 Rotating Machinery Trainer"], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P341", "text": [], "jumps": []}, {"id": "P342", "text": [], "jumps": []}, {"id": "P350", "text": ["In this lesson, you will learn about amplitude control of a DC motor."], "jumps": ["P410", "P302"]}, {"id": "P410", "text": ["There are two fundamental types of DC motor control: time control and amplitude control."], "jumps": ["P420", "P400", "PWM"]}, {"id": "P420", "text": ["You are already familiar with time control of a DC motor."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["In this lesson you will explore the second type of DC motor control, amplitude control."], "jumps": ["P440", "P410"]}, {"id": "P440", "text": ["Let's begin the lesson on AMPLITUDE CONTROL OF DC MOTORS...................."], "jumps": ["P410"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Large starting torque in a DC motor requires large starting current. High Torque Large Current"], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["In most instances, large currents are undesirable and must be controlled."], "jumps": ["P1032", "P1020"]}, {"id": "P1032", "text": ["Changing the applied voltage (amplitude control) to a motor, controls current."], "jumps": ["P1034", "P1020"]}, {"id": "P1034", "text": ["You have seen amplitude control in previous experiments when the +LV power supply was varied."], "jumps": ["P1036", "P1020"]}, {"id": "P1036", "text": ["Let's look at some electronic circuits that vary amplitude of the applied voltage."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["There are a large variety of manual starters that limit starting current in a DC motor.", "R1, 100W R2, 50W R3, 25W", "R1, 100W R3, 25WWR3, 25W"], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Notice that both starter circuits reduce the values of resistors.", "R1, 100W R3, 25WWR3, 25W", "R1, 100W R2, 50W R3, 25W"], "jumps": ["P1052", "P1040"]}, {"id": "P1052", "text": ["Moving both switches from OFF to 1 places 175 ohms in series with the motor's resistance, reducing the voltage applied to the motor."], "jumps": ["P1054", "P1040"]}, {"id": "P1054", "text": ["The high starting current in the DC motor is reduced. As a result, RPM is also limited."], "jumps": ["P1056", "P1040"]}, {"id": "P1056", "text": ["Once the motor starts to rotate, the current reduces (CEMF increases) and the switch can be moved to position 2."], "jumps": ["P1058", "P1040"]}, {"id": "P1058", "text": ["Now the resistance is only 75 ohms. More voltage is felt across the motor and the motor speeds up."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["As the motor continues to increase in speed, the current draw reduces more. You can switch to position 3."], "jumps": ["P1062", "P1040"]}, {"id": "P1062", "text": ["Now the series resistance is only 25 ohms. More of the applied voltage is across the motor and the motor speeds up, reducing current flow even more."], "jumps": ["P1064", "P1040"]}, {"id": "P1064", "text": ["Finally, the switch is placed in the RUN position (no series resistance)."], "jumps": ["P1066", "P1040"]}, {"id": "P1066", "text": ["As the entire voltage is felt across the motor, the motor increases to maximum speed."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["By changing the amplitude of the applied voltage, large starting currents are reduced in steps."], "jumps": ["P1073", "P1040"]}, {"id": "P1073", "text": ["A disadvantage of this type of controller is that motor current flows through the manually operated switch."], "jumps": ["P1075", "P1040"]}, {"id": "P1075", "text": ["Large current flow is common in large industrial machinery."], "jumps": ["P1077", "P1040"]}, {"id": "P1077", "text": ["This poses a safety hazard when the switch is operated."], "jumps": ["P1079", "P1040"]}, {"id": "P1079", "text": ["Normally the controller is located a long distance away from the motor. This increases the cost of wiring. Large wiring is needed due to high currents."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["Relay controllers overcome the safety and cost disadvantages. lay Control", "R1 R2 R3", "K2 K3 K43"], "jumps": []}, {"id": "P1082", "text": ["First, motor current does not flow through the switch. Low current in the mAmp range will operate a relay."], "jumps": ["P1084", "P1080"]}, {"id": "P1084", "text": ["Second, the wiring between the remote controller and the motor can be smaller, reducing cost."], "jumps": ["P1090", "P1080"]}, {"id": "P1090", "text": ["Remote relay controllers work the same as a manual controller."], "jumps": ["P1092", "P1080"]}, {"id": "P1092", "text": ["With latching relay (K1) energized, R1, R2 and R3 are in the circuit."], "jumps": ["P1094", "P1080"]}, {"id": "P1094", "text": ["With latching relay (K2) energized, R1 is shorted out.", "K2 K3 K43"], "jumps": ["P1096", "P1080"]}, {"id": "P1096", "text": ["With latching relay (K3) energized, R1 and R2 are shorted out.", "K2 K3 K43"], "jumps": ["P1098", "P1080"]}, {"id": "P1098", "text": ["With latching relay (K4) energized, R1, R2 and R3 are shorted out. There is no resistance in series with the motor.", "K2 K3 K43"], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["In smaller DC motors where circuit currents are not large, solid state controllers are used.U"], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["Notice that the motor controller is really a simple emitter follower circuit where the motor is the emitter resistor."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["By varying R2, the voltage divider network consisting of R1 and R2 controls the base circuit of Q2."], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["This in turn controls the conduction of Q1 which controls the voltage across the motor."], "jumps": ["P1132", "P1100"]}, {"id": "P1132", "text": ["If Q1 is off, Vcc is across the collector and emitter of Q1, leaving 0 volts across the motor."], "jumps": ["P1134", "P1100"]}, {"id": "P1134", "text": ["If Q1 is saturated, very little Vcc travels across Q1's collector to the emitter. This leaves almost all of Vcc across the motor."], "jumps": ["P1136", "P1100"]}, {"id": "P1136", "text": ["The values of Q1's base voltage, between cutoff and saturation, allow varying Vcc across the motor."], "jumps": ["P1140", "P1100"]}, {"id": "P1140", "text": ["Many controllers must also maintain motor speed, regardless of motor load. Speed Control"], "jumps": ["P1150", "P1100"]}, {"id": "P1150", "text": ["These types of controllers utilize a feedback network to maintain motor speed. Feedback Loop"], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["A magnetic pickup senses motor RPM and sends this information to a control module."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["The control module then generates a speed drive signal to feed the base."], "jumps": ["P1180", "P1150"]}, {"id": "P1180", "text": ["Why is a relay controller desirable?.......................", "high current relay to control low current motorr", "low current relay to control high current motorr"], "jumps": ["P1150"]}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1182", "text": ["A relay is used to couple a low current relay to a high current motor."], "jumps": []}, {"id": "P1190", "text": ["Modern motor controllers, like everything else, have even progressed to a digital format."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["A digital start/speed controller incorporates a digital to analog converter (D/A) and a comparator array."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["The D/A converter takes a digital input signal and converts it into an analog equivalent."], "jumps": ["P1220", "P1190"]}, {"id": "P1220", "text": ["This analog signal is sent to a comparator array where it is compared against a set threshold level."], "jumps": ["P1230", "P1190"]}, {"id": "P1230", "text": ["The comparator array then triggers one of four possible speed controls."], "jumps": ["P1240", "P1190"]}, {"id": "P1240", "text": ["Which component of a digital controller converts a digital input to an analog equivalent?"], "jumps": ["P1190"]}, {"id": "P1241", "text": [], "jumps": []}, {"id": "P1242", "text": ["A microprocessor utilizes digital signals in normal operation but has no converting capabilities in itself."], "jumps": []}, {"id": "P1243", "text": ["The comparator array compares an input analog signal to a preset threshold."], "jumps": []}, {"id": "P1250", "text": ["This digital speed controller is an open loop controller..."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["The controller has no way of knowing if the motor is responding to the applied signals."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["It is up to the operator to know if the motor is responding."], "jumps": ["P1280", "P1250"]}, {"id": "P1280", "text": ["In this circuit, feedback is used to control the motor once it is up to speed."], "jumps": ["P1290", "P1250"]}, {"id": "P1290", "text": ["The START input energizes K1 and the motor begins to rotate (R1 reduces starting current)."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["With the motor spinning, the RPM sensor applies a signal to the D/A converter."], "jumps": ["P1310", "P1280"]}, {"id": "P1310", "text": ["The D/A converts the pulse train from the sensor to an analog voltage.e."], "jumps": ["P1320", "P1280"]}, {"id": "P1320", "text": ["The analog voltage is inputted to the comparator array where the speed control output selects which relay to energize controlling speed."], "jumps": ["P1330", "P1280"]}, {"id": "P1330", "text": ["The system is a closed loop system due to the output of the motor controlling the input to the motor."], "jumps": ["P1910", "P1280"]}, {"id": "P1910", "text": ["This completes the information on AMPLITUDE CONTROL OF DC MOTORS."], "jumps": ["P1001", "P1280"]}, {"id": "P1920", "text": ["1. Large starting torque in a DC motor requires large starting current. rge Current"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. Manual starter controllers regulate the amount of voltage that reaches the DC motor...", "R1, 100W R3, 25WWR3, 25W", "R1, 100W R2, 50W R3, 25W"], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. Relay motor controllers use low voltage relays to control large current motors. Control", "R1 R2 R3", "K2 K3 K43"], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. Solid state motor controllers utilize analog circuits and feedback networks for proper motor control."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. A digital start/speed controller incorporates a digital to analog converter (D/A) and a comparator array."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6. The D/A converter takes a digital input signal and converts it into an analog equivalent."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7. The comparator array compares an analog signal to a preset value and then triggers one of four possible speed controls."], "jumps": ["P1990", "P1960"]}, {"id": "P1990", "text": ["8. A digital closed loop system uses the output of the motor as an input to the motor through the speed control circuits."], "jumps": ["P1999", "P1960"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1990"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["In this experiment you will verify amplitude control of a DC motor."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["You will examine a manual solid state controller and verify proper operation."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["You will also explore a digital start motor controller."], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["Both types of motor controllers are located on Experiment Card PC130-282. 282 Amplitude Control of Devices SPEED - Manual"], "jumps": ["P2070", "P2030"]}, {"id": "P2060", "text": ["Let's begin the experiment. 1. Set the 280 trainer to it's initial control settings."], "jumps": ["P2070", "P2020", "P22000"]}, {"id": "P2070", "text": ["2. Set the Test Console controls to their initial control settings........"], "jumps": ["P2060"]}, {"id": "P2090", "text": ["3. Carefully plug PC130-282 into the Test Console PC2 position. to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2070", "P2100"]}, {"id": "P2100", "text": ["4. Carefully plug PC130-280 into the Test Console PC3 position."], "jumps": ["P2090", "P2110"]}, {"id": "P2110", "text": ["5. Connect the 8 pin interconnect cable between the PC130-280 experiment card and the 280 motor chassis. 80 Trainer 130A Test ConsoleON........................................."], "jumps": ["P2100", "P2130", "P"]}, {"id": "P2130", "text": ["6. To configure the 280 Trainer as a DC Shunt Field motor, set the switches as follows: Switch Settings ARM/OFF/VAR - ARM RUN/STOP - RUNNN", "9t99tt9999tt9ttttt999t9ttttt99tt88tt9tt99ttt8t9tt9 ["], "jumps": ["P2140", "P2110"]}, {"id": "P2140", "text": ["7. On PC130-282, set S2 to OFF (down), S3 to FIXED TM (down) and S4, S5, S6 and S7 to OFF (down).."], "jumps": ["P2150", "P2130", "P2145"]}, {"id": "P2145", "text": ["PC130-282 SWITCH SETTINGS S2 to OFF (down) S3 to FIXED TMI (down) S4, S5, S6 and S7 to OFF (down)"], "jumps": []}, {"id": "P2150", "text": ["8. On the PC130-282 card, adjust the four trim pots fully CCW to eliminate other circuits from interfering with MANUAL START circuits."], "jumps": ["P2160", "P2140", "P2155"]}, {"id": "P2155", "text": ["PC130-282 SWITCH SETTINGS - Adjust trim pots fully CCW."], "jumps": []}, {"id": "P2160", "text": ["The resultant circuit is a basic manual start solid state DC motor controller. Let's examine a schematic for each section."], "jumps": ["P2161", "P2150", "P2165"]}, {"id": "P2161", "text": ["Speed 1 and 2 are controlled by relays....................."], "jumps": ["P2163", "P2160", "P"]}, {"id": "P2163", "text": ["Manually closing S6 or S7 energizes K1 or K2, placing R32 or R33 in series with the motor (amplitude control)."], "jumps": ["P2164", "P2161"]}, {"id": "P2164", "text": ["Notice that if both S6 and S7 are closed, 5 ohms are placed in series to the motor."], "jumps": ["P2166", "P2161"]}, {"id": "P2166", "text": ["Speed 3 uses transistors instead of a relay................"], "jumps": ["P2167", "P2161"]}, {"id": "P2167", "text": ["When S5 is closed, Q2 turns on, supplying negative voltage through R31 to the motor."], "jumps": ["P2168", "P2166"]}, {"id": "P2168", "text": ["If the speed 1 and speed 2 switches are closed, the total resistance in series to the motor is 3.33 ohms."], "jumps": ["P2169", "P2166"]}, {"id": "P2169", "text": ["The motor again increases in speed, due to an increase in voltage."], "jumps": ["P2170", "P2166"]}, {"id": "P2170", "text": ["Speed 4 also uses a different circuit......................", "10 ,5 or 33 ohms from Speed 1, Speed 2 and Speed 3"], "jumps": ["P2172", "P2166"]}, {"id": "P2172", "text": ["When S4 is closed, the opto-isolator turns on Q3, which supplies NO resistance to the motor."], "jumps": ["P2173", "P2170"]}, {"id": "P2173", "text": ["When S4 is closed, the resistance from speed 1, 2 and 3 are shorted out, leaving the full value of negative voltage applied to the motor."], "jumps": ["P2174", "P2170"]}, {"id": "P2174", "text": ["From the four speed controls, the resistance (10, 5, 3.3, or 0) is placed in series to the motor. Speeds S F -LV 1,2,3 & 4 A (10,5,3.3,0) T E PC130-282 PC130-280 280 Trainer DC Motor"], "jumps": ["P2180", "P2170"]}, {"id": "P2180", "text": ["By manually operating the switches on PC130-282, you can control the speed of the motor using amplitude control."], "jumps": ["P2190", "P2174"]}, {"id": "P2190", "text": ["10. Set the 130 Test Console controls as follows: Positive Supply . . . . 5 Volts - Negative Supply . . . . 18 Volts", "2. For DC motor operation, press enter to set the 130 Test Console controls as follows: .......... ON + Power Supply... 24 Volts - Power Supply....15 Volts"], "jumps": ["P2174"]}, {"id": "P2191", "text": ["11. Set PC2 DC Power switch to ON.ol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": []}, {"id": "P2192", "text": ["The three 3W 10 resistors on the right hand side of PC130-282 will become HOT during the following steps. DO NOT TOUCH R31, R32 and R33.nd R33...."], "jumps": ["P2200"]}, {"id": "P2200", "text": ["Circuit Parameters (1) Motor RPM (2) Input Voltage and Current (3) Input Power (4) Field and Armature Current (5) Coil Resistancee", "12. Set Speed 1 (S7) on PC130-282 UP. Motor action should begin. ases in the Negative voltage may be necessary to start the motor. Return to -18 volts after the motor starts.", "Slight increases in the Negative voltage may be necessary to start the motor. Return to -18 volts after the motor starts."], "jumps": ["P2210", "P2192", "P2205"]}, {"id": "P2205", "text": ["EXPERIMENT CARD PC130-282 - S7 set to UP."], "jumps": []}, {"id": "P2210", "text": ["At this time you are operating the DC motor on speed 1 control."], "jumps": ["P2211", "P2200"]}, {"id": "P2211", "text": ["13. Connect a DC voltmeter across TPs E and F on the 280 trainer. Note the voltage reading."], "jumps": ["P2220", "P2210"]}, {"id": "P2220", "text": ["14. Set Speed 2 (S6) on PC130-282 UP while observing the voltmeter and motor RPM.."], "jumps": ["P2230", "P2211", "P2225"]}, {"id": "P2225", "text": ["EXPERIMENT CARD PC130-282 - S6 set to UP."], "jumps": []}, {"id": "P2230", "text": ["With Speed 1 and Speed 2 (S6 and S7) ON what happened to motor RPM?"], "jumps": ["P2220"]}, {"id": "P2231", "text": [], "jumps": []}, {"id": "P2232", "text": ["If motor RPM remained the same, increase the Negative voltage control and repeat the step."], "jumps": []}, {"id": "P2233", "text": ["Motor RPM should not decrease. Recheck your equipment setup."], "jumps": []}, {"id": "P2240", "text": ["You should notice that motor RPM increased when Speed 2 was initialized. You manually altered the speed of the motor."], "jumps": ["P2250", "P2230", "P2245"]}, {"id": "P2245", "text": ["EXPERIMENT CARD PC130-282 - Set S6 and S7 UP."], "jumps": []}, {"id": "P2250", "text": ["15. Set Speed 3 on (S5 UP) while observing motor RPM and input DC voltage using the voltmeter."], "jumps": ["P2260", "P2240", "P2255"]}, {"id": "P2255", "text": [], "jumps": []}, {"id": "P2260", "text": ["Again, you should observe an increase in motor RPM........."], "jumps": ["P2261", "P2250"]}, {"id": "P2261", "text": ["Note that when S4 is placed to UP, S5, S6 and S7 no longer have an effect. S4 shorts the other resistors."], "jumps": ["P2262", "P2260"]}, {"id": "P2262", "text": ["When S4 is DOWN, S5, S6 and S7 cause 10, 5 or 3.3 ohm resistance in series to the DC motor."], "jumps": ["P2270", "P2261"]}, {"id": "P2270", "text": ["16. Set PC2 DC Power switch to OFF. Now let's use digital control of the DC motor's speed."], "jumps": ["P2262"]}, {"id": "P2280", "text": ["1. Carefully plug PC130-111 into the Test Console PC1 position."], "jumps": ["P2290"]}, {"id": "P2290", "text": ["2. On PC130-282, set Speed control switches (S4 - S7) OFF (down). 3. Set PC130-282 S2 to up."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["4. On PC130-111 set S2 DOWN to the PULSER position........"], "jumps": ["P2310", "P2290", "P2305"]}, {"id": "P2305", "text": ["EXPERIMENT CARD PC130-111 - Set S2 down to PULSER."], "jumps": []}, {"id": "P2310", "text": ["If the motor starts spinning, press S1 on PC130-282", "5. Set PC1 and PC2 DC Power switch to ON. OTE If the motor starts spinning, press S1 on PC130-282.", "Circuit Parameters (1) Motor RPM (2) Input Voltage and Current (3) Input Power (4) Field and Armature Current (5) Coil Resistancee"], "jumps": ["P2300"]}, {"id": "P2320", "text": ["You have set up a digital (from PC130-111) controller circuit using PC130-282. Let's examine the schematics for each section."], "jumps": ["P2321", "P2325"]}, {"id": "P2321", "text": ["First, the same start circuits are used. T2 Speed 4 R31,10 Q1 & Q2 Speed 3 R32,10"], "jumps": ["P2324", "P2320"]}, {"id": "P2324", "text": ["However, the manual switches are not used, they are left open."], "jumps": ["P2327", "P2321"]}, {"id": "P2327", "text": ["Instead, op-amp comparators are used to supply the voltage needed to operate each speed control."], "jumps": ["P2330", "P2321"]}, {"id": "P2330", "text": ["Set up the comparators for 1, 2, 3 and 4 volts. S4 - Down S5 - Down S6 - Down S7 - Down"], "jumps": ["P2331", "P2327"]}, {"id": "P2331", "text": ["The input to the comparator is from a D/A converter."], "jumps": ["P2332", "P2327"]}, {"id": "P2332", "text": ["The D/A converter is a standard ladder type with the input from a counter, IC2. 2k Q3 to op-amp 2k 1k comparator Q2 Clk 2k 1k"], "jumps": ["P2335", "P2327"]}, {"id": "P2335", "text": ["Clock inputs cause the counter IC to count up, producing different analog voltages to the op-amp comparator."], "jumps": ["P2336", "P2332"]}, {"id": "P2336", "text": ["The clock inputs are from the PC130-111 card.+5V To D/A S2 Converter PULSER S1 STEP"], "jumps": ["P2338", "P2332"]}, {"id": "P2338", "text": ["The clock inputs can also be from an oscillator. cillator To D/A S2 Converter PULSE PC130-111"], "jumps": ["P2340", "P2336"]}, {"id": "P2340", "text": ["11. On the PC130-111, depress the STEP push button 13 to 15 times and observe motor action and the voltage applied to the motor. It may be necessary to press the RESET button on the PC130-282 card....."], "jumps": ["P2350", "P2338", "P2345"]}, {"id": "P2345", "text": ["EXPERIMENT CARD PC130-111 - Depress the STEP push button."], "jumps": []}, {"id": "P2350", "text": ["Did motor action occur?n is typed.........................."], "jumps": ["P2340"]}, {"id": "P2351", "text": [], "jumps": []}, {"id": "P2352", "text": ["Motor action should occur. Recheck the Negative Voltage S2 UP on PC130-282 and S2 DOWN on PC130-111."], "jumps": []}, {"id": "P2360", "text": ["By depressin let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
