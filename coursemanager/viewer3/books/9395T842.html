const book = {"title": "9395T842", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: OPERATION OF THE 8086 MICROPROCESSORdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Observe the various signals generated by the 8086 microprocessor. w Observe memory interface signals during actual microprocessor operation.", "w Describe external timing and control connections to the 8086 microprocessor. w Describe the memory connections to the 8086 microprocessor."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Experiment Card PC130 - 411 XXXXXXnt"], "jumps": []}, {"id": "P301", "text": ["12. Alligator to Alligator Jumper XXXXXXXXnt"], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P350", "text": [], "jumps": []}, {"id": "P360", "text": [], "jumps": []}, {"id": "P400", "text": ["In the previous lesson, you looked at the internal operation of the 8086 microprocessor.  This included internal registers, the internal ALU, and the internal control unit.", "In the previous lesson, you looked at the internal operation of the 8086 microprocessor. This included internal registers, the internal ALU, and the internal control unit."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["To utilize these and other internal operations, connections are provided to interface the microprocessor to external circuitry.  It   is this external circuitry that gives the microprocessor its ability   to be useful.", "To utilize these and other internal operations, connections are provided to interface the microprocessor to external circuitry. It is this external circuitry that gives the microprocessor its ability to be useful."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["There are many different types of circuits that interface with a microprocessor.  Some circuits are necessary for operation such as power, memory, and the address decoder.  Others may not be necessary, such as a sound card, a parallel port, or a serial port.", "There are many different types of circuits that interface with a microprocessor. Some circuits are necessary for operation such as power, memory, and the address decoder. Others may not be necessary, such as a sound card, a parallel port, or a serial port.."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Even a display may not be important if the only purpose is to record data and send it over a modem.  However, not having components like a clock would prevent the microprocessor from operating at all.", "Even a display may not be important if the only purpose is to record data and send it over a modem. However, not having components like a clock would prevent the microprocessor from operating at all."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["In this lesson we will be looking at the external circuitry necessary for the operation of the microprocessor.  This includes the clock generation and memory circuits.  In the next lesson we will look at the parallel and serial ports, the display, and the keyboard.", "In this lesson we will be looking at the external circuitry necessary for the operation of the microprocessor. This includes the clock generation and memory circuits. In the next lesson we will look at the parallel and serial ports, the display, and the keyboard."], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["Let's begin the lesson on OPERATION OF THE 8086 MICROPROCESSOR.............."], "jumps": ["P440"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1040", "text": ["In this lesson we are going to look at the timing, control, and memory circuits of the 8086 microprocessor system. These are necessary for any system which uses the 8086               microprocessor.   Let's start with timing and control circuitry.", "In this lesson we are going to look at the timing, control, and memory circuits of the 8086 microprocessor system. These are necessary for any system which uses the 8086 microprocessor. Let's start with timing and control circuitry."], "jumps": ["P1050", "P1001"]}, {"id": "P1050", "text": ["The clock, ready, and reset signals are provided to the microprocessor from the 82C84 CLOCK GENERATOR AND READY INTERFACE chip.  The graphic below shows the connection of this chip to the 8086 microprocessor.", "The clock, ready, and reset signals are provided to the microprocessor from the 82C84 CLOCK GENERATOR AND READY INTERFACE chip. The graphic below shows the connection of this chip to the 8086 microprocessor."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["There are three functions that this chip provides to the microprocessor.   It provides the clock signal, a reset signal if the system has been reset, and a ready signal when the rest of the system is ready.   Let's look at each of these functions.", "There are three functions that this chip provides to the microprocessor. It provides the clock signal, a reset signal if the system has been reset, and a ready signal when the rest of the system is ready. Let's look at each of these functions."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["The clock input to the 8086 microprocessor is twice the operating speed of the microprocessor.  Internally, the microprocessor halves the clock to get its operating frequency.", "The clock input to the 8086 microprocessor is twice the operating speed of the microprocessor. Internally, the microprocessor halves the clock to get its operating frequency."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["Y1 is a 8 MHz crystal which is attached to the 82C84 chip. The crystal, capacitor 3, and capacitor 4 provide a parallel resonant circuit which is required by the chip to generate the desired frequency."], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["There are two clock outputs: CLK and PCLK. The CLK frequency is 1/3 of the 8 MHz oscillator frequency, or 2.66 MHz.  PCLK, or peripheral clock, operates at 1/2 the clock frequency, or 1.33 MHz.  This is actually the same clock speed used internally by the microprocessor in this application.", "There are two clock outputs: CLK and PCLK. The CLK frequency is 1/3 of the 8 MHz oscillator frequency, or 2.66 MHz. PCLK, or peripheral clock, operates at 1/2 the clock frequency, or 1.33 MHz. This is actually the same clock speed used internally by the microprocessor in this application."], "jumps": ["P1100", "P1050"]}, {"id": "P1100", "text": ["The PCLK pin provides a clock signal for other devices in the system requiring the same clock speed as the internal clock signal of the microprocessor.  The diagram below shows the relationship between the CLK and PCLK signals.", "Next let's talk about the READY signal. This is an input to the microprocessor that indicates all other devices in the system are  ready.  In this circuit, all external devices are faster than the      microprocessor.  For this reason the ready signals, RDY1 and RDY2, are connected to HIGH.", "The PCLK pin provides a clock signal for other devices in the system requiring the same clock speed as the internal clock signal of the microprocessor. The diagram below shows the relationship between the CLK and PCLK signals.", "Next let's talk about the READY signal. This is an input to the microprocessor that indicates all other devices in the system are ready. In this circuit, all external devices are faster than the microprocessor. For this reason the ready signals, RDY1 and RDY2, are connected to HIGH."], "jumps": ["P1110", "P1050", "P1120", "P1100"]}, {"id": "P1120", "text": ["Since RDY1 is connected to a test point, a 10k resistor is used to allow connection to ground. This allows the observation of a low ready condition in the system. This will be looked at in the experiment."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["If the resistor wasn't there and the test point was connected to ground, the power supply would be shorted and current would increase until a fuse was blown. The 10 k resistor allows maximum of 0.5 mA of current to flow for 5 volts. This can be verified using Ohm's law."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["Now that we have looked at the ready and clock signals, let's look at the RESET circuitry.  The RESET circuitry consists of a normally open switch, resistor 1, and capacitor 5.  These are connected to the RES input signal of the 82C84.", "Now that we have looked at the ready and clock signals, let's look at the RESET circuitry. The RESET circuitry consists of a normally open switch, resistor 1, and capacitor 5. These are connected to the RES input signal of the 82C84."], "jumps": ["P1150", "P1110"]}, {"id": "P1150", "text": ["The bar over RES indicates that the RESET condition is true when the input is LOW.  This causes a HIGH output on the RESET pin which is connected to the microprocessor.", "The bar over RES indicates that the RESET condition is true when the input is LOW. This causes a HIGH output on the RESET pin which is connected to the microprocessor."], "jumps": ["P1160", "P1110"]}, {"id": "P1160", "text": ["We are going to look at the RES input under two conditions, power up and when the reset button is pressed.  When power is applied to the entire system, the capacitor has no charge. This means that the top of the capacitor is at 0 volts which is a LOW to the 82C84 chip.", "We are going to look at the RES input under two conditions, power up and when the reset button is pressed. When power is applied to the entire system, the capacitor has no charge. This means that the top of the capacitor is at 0 volts which is a LOW to the 82C84 chip."], "jumps": ["P1170", "P1110"]}, {"id": "P1170", "text": ["This indicates the system is in a reset condition.  As you know, it takes five time constants for the capacitor to almost completely    charge.  When the capacitor fully charges, the top pin will be at \n5 volts or a HIGH condition which indicates a non-reset condition.", "This indicates the system is in a reset condition. As you know, it takes five time constants for the capacitor to almost completely charge. When the capacitor fully charges, the top pin will be at 5 volts or a HIGH condition which indicates a non-reset condition."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["Somewhere between 0.8 and 2.0 volts, the 82C84 chip will accept the input signal as a HIGH condition.  This tells the microprocessor that it can start.", "Somewhere between 0.8 and 2.0 volts, the 82C84 chip will accept the input signal as a HIGH condition. This tells the microprocessor that it can start."], "jumps": ["P1190", "P1160"]}, {"id": "P1190", "text": ["The 82C84 chip technology produces a change in HIGH/LOW conditions between 0.8 volts and 2.0 volts. If the delay is designed to be long enough to make sure all other components have had time to reset, the delay will have been designed using the lowest possible recognized high value, or 0.8 volts."], "jumps": ["P1200", "P1160"]}, {"id": "P1200", "text": ["This way, if the change occurs later, at 1.5 volts for example, it will wait longer than required which is OK.   If the delay has been designed using a higher voltage and a chip was used with a lower voltage where the transition occurred, the delay would be shorter and all other devices may not be reset yet.", "This way, if the change occurs later, at 1.5 volts for example, it will wait longer than required which is OK. If the delay has been designed using a higher voltage and a chip was used with a lower voltage where the transition occurred, the delay would be shorter and all other devices may not be reset yet."], "jumps": ["P1210", "P1160"]}, {"id": "P1210", "text": ["This same process can be performed with the ready signals.   It was only connected to the reset section to reduce circuitry since the reset section has the reset switch.", "This same process can be performed with the ready signals. It was only connected to the reset section to reduce circuitry since the reset section has the reset switch."], "jumps": ["P1230", "P1160"]}, {"id": "P1230", "text": ["After the system has been operating and you want to reset it, press the reset button.  While the reset button is pressed down, the positive end of the charged capacitor is connected to ground.", "After the system has been operating and you want to reset it, press the reset button. While the reset button is pressed down, the positive end of the charged capacitor is connected to ground."], "jumps": ["P1240", "P1160"]}, {"id": "P1240", "text": ["Since there is no resistance between the capacitor and ground, it quickly discharges during the short time the button is pressed down.   After the button is released, the capacitor begins charging as it did when power was turned on.", "Since there is no resistance between the capacitor and ground, it quickly discharges during the short time the button is pressed down. After the button is released, the capacitor begins charging as it did when power was turned on."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["As you can see, the 82C84 chip provides several necessary signals for the 8086 microprocessor. This is a very powerful chip which has newer versions for faster microprocessors like the 286, 386 and beyond."], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["Which of the following signals is used to indicate a busy device?"], "jumps": ["P1250"]}, {"id": "P1261", "text": [], "jumps": []}, {"id": "P1262", "text": ["It is the READY signal that indicates whether or not a device in the system is ready."], "jumps": []}, {"id": "P1270", "text": ["The clock signal supplied by the 82C84 chip to the microprocessor is _______ the speed that the microprocessor operates at."], "jumps": ["P1260"]}, {"id": "P1271", "text": [], "jumps": []}, {"id": "P1272", "text": ["Remember, the signal supplied to the clock input of the microprocessor is twice the speed the microprocessor operates at."], "jumps": []}, {"id": "P1280", "text": ["Now that we have looked at how the timing signals are generated for the 8086, let's look at how the microprocessor interfaces to memory attached to the system.  There are many chips and signals required for the proper connection of memory to the microprocessor.", "Now that we have looked at how the timing signals are generated for the 8086, let's look at how the microprocessor interfaces to memory attached to the system. There are many chips and signals required for the proper connection of memory to the microprocessor."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["The address and data lines, which originate at the microprocessor (PC130-410), must both be demultiplexed (depending on the signal) and amplified. Address/Data lines AD0 through AD15 are the signals which must be separated into data and address information. A16 through A17 are just address lines."], "jumps": ["P1300", "P1280", "PC130"]}, {"id": "P1300", "text": ["For instructions that use memory in some way, the microprocessor needs a method for multiplexing the address and data information."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["This is accomplished by making the address available at the beginning of the operation and the data at the end.  Since data is  the last information, it doesn't need to be saved in some kind of    temporary memory.", "This is accomplished by making the address available at the beginning of the operation and the data at the end. Since data is the last information, it doesn't need to be saved in some kind of temporary memory."], "jumps": ["P1320", "P1290"]}, {"id": "P1320", "text": ["However, the address information at the beginning of an instruction cycle needs to be available at the end of the cycle."], "jumps": ["P1330", "P1290"]}, {"id": "P1330", "text": ["The address and data signals provided by the microprocessor are not strong enough to make it very far away from the actual microprocessor.  While the address latch output signals are strong enough, bi-directional buffers are needed for the data information.", "The address and data signals provided by the microprocessor are not strong enough to make it very far away from the actual microprocessor. While the address latch output signals are strong enough, bi-directional buffers are needed for the data information."], "jumps": ["P1340", "P1290"]}, {"id": "P1340", "text": ["Remember, the buffers need to be bi-directional because data flows from either the computer to memory or memory to the computer. Let's look at how the latches and buffers are controlled during a read or write operation."], "jumps": ["P1350", "P1290"]}, {"id": "P1350", "text": ["The data buffers are controlled by the BUFEN and BUF/R/W of the microprocessor.  The buffers are U3 and U4 (PC130-410) which are 74HC245 chips. The BUF/R/W signal determines the direction of the input and output through the buffer.", "The data buffers are controlled by the BUFEN and BUF/R/W of the microprocessor. The buffers are U3 and U4 (PC130-410) which are 74HC245 chips. The BUF/R/W signal determines the direction of the input and output through the buffer."], "jumps": ["P1360", "P1290", "PC130"]}, {"id": "P1360", "text": ["If the microprocessor is writing data to the data bus and that data will be made available to other devices, then the BUF/R/W signal will be high.  This indicates that the microprocessor is trying to write.  It also tells the buffer to amplify signals from the left side and make them available on the right side.", "If the microprocessor is writing data to the data bus and that data will be made available to other devices, then the BUF/R/W signal will be high. This indicates that the microprocessor is trying to write. It also tells the buffer to amplify signals from the left side and make them available on the right side."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["If the microprocessor was reading data from memory, then information will be flowing from the right side to the left side.  For this condition, the BUF/R/W signal will be low which indicates that a READ operation is being performed.", "If the microprocessor was reading data from memory, then information will be flowing from the right side to the left side. For this condition, the BUF/R/W signal will be low which indicates that a READ operation is being performed."], "jumps": ["P1380", "P1350"]}, {"id": "P1380", "text": ["The BUFEN, or buffer enable signal, turns the buffer outputs on and off. This is important when another device has taken control of the bus. This signal can ensure that all other signals are disconnected from the data bus. The drawing below illustrates the flow of data through the buffers and the conditions which affect the flow of data."], "jumps": ["P1390", "P1350"]}, {"id": "P1390", "text": ["The address latches (PC130-410) are similar to the buffer in that they amplify the address signal.  However, as their name implies,  they latch the address.  When using a buffer, the output always     mirrors the input.", "The address latches (PC130-410) are similar to the buffer in that they amplify the address signal. However, as their name implies, they latch the address. When using a buffer, the output always mirrors the input."], "jumps": ["P1400", "P1380", "PC130"]}, {"id": "P1400", "text": ["In a latch, the output is the last value when the ALE pin became active.  In other words, when data is on the lines and the address strobe (ASTB) goes high, it enables the latch to transfer data from the inputs to the outputs.  The address strobe (ASTB) is also known as the address latch enable (ALE).", "In a latch, the output is the last value when the ALE pin became active. In other words, when data is on the lines and the address strobe (ASTB) goes high, it enables the latch to transfer data from the inputs to the outputs. The address strobe (ASTB) is also known as the address latch enable (ALE)."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["When the microprocessor is ready to place data on the multiplexed lines, the ALE signal is put low prohibiting the latch outputs to change as the data is put on the lines.  This makes all the information available at one time.", "When the microprocessor is ready to place data on the multiplexed lines, the ALE signal is put low prohibiting the latch outputs to change as the data is put on the lines. This makes all the information available at one time."], "jumps": ["P1420", "P1390"]}, {"id": "P1420", "text": ["It is important to note that the latches are not bi-directional. Address information is only generated by the microprocessor.  If  other devices need to indicate addresses to the microprocessor, they  will pass it though the data lines just like any other data.", "It is important to note that the latches are not bi-directional. Address information is only generated by the microprocessor. If other devices need to indicate addresses to the microprocessor, they will pass it though the data lines just like any other data."], "jumps": ["P1430", "P1390"]}, {"id": "P1430", "text": ["Now that you know how address information is made available and how data information is amplified, let's look at how the memory chips are attached and controlled by the microprocessor."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["There are two types of memory associated with the 8086 microprocessor: Read Only Memory (ROM) and Random Access Memory (RAM).", "There are two types of memory associated with the 8086 microprocessor: Read Only Memory (ROM) and Random Access Memory (RAM). ry. This is memory which is programmed by a special device and cannot be changed without using other special devices."], "jumps": ["P1430"]}, {"id": "P1441", "text": ["With ROM, as the name implies, information can only be read out of the memory device under normal circumstances.  This type of memory is considered non-volatile as the information stored in it will remain when power is lost.", "With ROM, as the name implies, information can only be read out of the memory device under normal circumstances. This type of memory is considered non-volatile as the information stored in it will remain when power is lost. r special devices."], "jumps": ["P1430"]}, {"id": "P1442", "text": ["The NIDA 8086 microprocessor trainer uses a special kind of ROM called an EPROM which stands for Erasable Programmable Read Only Memory.", "The NIDA 8086 microprocessor trainer uses a special kind of ROM called an EPROM which stands for Erasable Programmable Read Only Memory. considered non-volitale as the information stored in it will remain when power is lost. r special devices."], "jumps": ["P1430"]}, {"id": "P1443", "text": ["The second type of memory associated with the 8086 microprocessor is RAM.  The term RAM is actually a misnomer.  Random access refers to the ability to access any location in memory in the same amount of time.", "The second type of memory associated with the 8086 microprocessor is RAM. The term RAM is actually a misnomer. Random access refers to the ability to access any location in memory in the same amount of time. s lost. r special devices."], "jumps": ["P1430"]}, {"id": "P1444", "text": ["Since this characteristic of RAM is also found in ROM, the name really doesn't differentiate between the two forms of memory.  What makes RAM so different from ROM is that the user can write to RAM as well as read from it.", "Since this characteristic of RAM is also found in ROM, the name really doesn't differentiate between the two forms of memory. What makes RAM so different from ROM is that the user can write to RAM as well as read from it. r special devices."], "jumps": ["P1430"]}, {"id": "P1445", "text": ["The other main difference between RAM and ROM is that when power is lost, all information stored in RAM is also lost.  This is called volatile memory.", "The EPROM contains the monitor program which is used when the system is first turned on.  The EPROM is made up of two chips, U1 and U2, which are 27C256 chips.  Each chip contains 32 k bytes of read only memory.", "The other main difference between RAM and ROM is that when power is lost, all information stored in RAM is also lost. This is called volatile memory. s the information stored in it will remain when power is lost. r special devices.", "The EPROM contains the monitor program which is used when the system is first turned on. The EPROM is made up of two chips, U1 and U2, which are 27C256 chips. Each chip contains 32 k bytes of read only memory."], "jumps": ["P1430", "P1460"]}, {"id": "P1460", "text": ["Since a byte is 8 bits, each chip holds 256 k bits of data.  This is where the 256 comes from in the IC's name.  Since there are two   chips, there is 64 k bytes of EPROM.   Next to the EPROM is the      location for up to 4 RAM chips.", "Since a byte is 8 bits, each chip holds 256 k bits of data. This is where the 256 comes from in the IC's name. Since there are two chips, there is 64 k bytes of EPROM. Next to the EPROM is the location for up to 4 RAM chips."], "jumps": ["P1470", "P1450"]}, {"id": "P1470", "text": ["Each of these locations can contain 32 k bytes of RAM, known as the 62256 chip.  In most cases only the first two RAM locations will be used.  This gives you 64 k of RAM.   Both the top and bottom have to be filled because one is the upper byte and the other is the lower byte of the data bus.", "Each of these locations can contain 32 k bytes of RAM, known as the 62256 chip. In most cases only the first two RAM locations will be used. This gives you 64 k of RAM. Both the top and bottom have to be filled because one is the upper byte and the other is the lower byte of the data bus."], "jumps": ["P1480", "P1450"]}, {"id": "P1480", "text": ["The combination of the upper and lower RAM locations is known as a bank.  If both RAM banks are full, then the microprocessor has 128 k bytes of RAM.  The figure below shows a block diagram of the memory chip configuration connected to the 8086.", "The combination of the upper and lower RAM locations is known as a bank. If both RAM banks are full, then the microprocessor has 128 k bytes of RAM. The figure below shows a block diagram of the memory chip configuration connected to the 8086."], "jumps": ["P1490", "P1450"]}, {"id": "P1490", "text": ["We need to look at the signals which are used to control the memory chips.   A1 through A15 are connected directly to the A0 through A14 connections of all the memory chips U3, U4, U5 & U6. These address lines can address any location within each chip.", "We need to look at the signals which are used to control the memory chips. A1 through A15 are connected directly to the A0 through A14 connections of all the memory chips U3, U4, U5 & U6. These address lines can address any location within each chip."], "jumps": ["P1500", "P1480"]}, {"id": "P1500", "text": ["Each chip only has 32 thousand locations within it.  The microprocessor can address 1 million locations.   For this reason, the address lines are used to pick between the different chips.", "Each chip only has 32 thousand locations within it. The microprocessor can address 1 million locations. For this reason, the address lines are used to pick between the different chips."], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["This method of using the additional address lines is known as chip select decoding.  The address lines dedicated to this process are A0 and A16 through A19.   We also need to introduce a few other signals which affect whether or not a memory chip is selected.", "This method of using the additional address lines is known as chip select decoding. The address lines dedicated to this process are A0 and A16 through A19. We also need to introduce a few other signals which affect whether or not a memory chip is selected."], "jumps": ["P1520", "P1490"]}, {"id": "P1520", "text": ["The IO/M signal form the microprocessor is used to select between memory and IO.  If the signal is low, no memory chip will be active.  If this signal is high, the status of A16 through A19, A0 and UBE will determine the active chip or chips.", "The IO/M signal form the microprocessor is used to select between memory and IO. If the signal is low, no memory chip will be active. If this signal is high, the status of A16 through A19, A0 and UBE will determine the active chip or chips."], "jumps": ["P1530", "P1490"]}, {"id": "P1530", "text": ["A0 is normally referred to as the LBE.  The UBE (Upper Byte Enable) and LBE (Lower Byte Enable) signals control the upper and lower bytes of memory.   If a 16 bit value is being read or written to memory, both signals will be low which will activate both memory chips in a bank.", "A0 is normally referred to as the LBE. The UBE (Upper Byte Enable) and LBE (Lower Byte Enable) signals control the upper and lower bytes of memory. If a 16 bit value is being read or written to memory, both signals will be low which will activate both memory chips in a bank."], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["If only 8 bits of data is being read, either the UBE or the LBE will be low indicating which byte you are reading.  If both are high, no memory chip will be active.", "If only 8 bits of data is being read, either the UBE or the LBE will be low indicating which byte you are reading. If both are high, no memory chip will be active."], "jumps": ["P1550", "P1520"]}, {"id": "P1550", "text": ["The last process needed in controlling memory is the actual address decoding to chip select signals.   A device known as a decoder is used to read address lines A16, A17, A18 and A19 and generate a low signal on an output line to turn a chip on.", "The last process needed in controlling memory is the actual address decoding to chip select signals. A device known as a decoder is used to read address lines A16, A17, A18 and A19 and generate a low signal on an output line to turn a chip on."], "jumps": ["P1560", "P1520"]}, {"id": "P1560", "text": ["All of the different control signals are combined using combinational logic such as AND, NAND, OR, NOR, XOR, and NOT gates and applied to the enable pins of the memory chips."], "jumps": ["P1570", "P1550"]}, {"id": "P1570", "text": ["In the PC130-411 8086 Decoder/Memory circuit card, combinational logic is combined into a single chip (U7) known as a GAL or Gate Array Logic."], "jumps": ["P1580", "P1550"]}, {"id": "P1580", "text": ["Basically, using a special programmer, you can program a GAL to be a combination of logic gates using the internal programmable gates, inputs and outputs."], "jumps": ["P1590", "P1570"]}, {"id": "P1590", "text": ["You are not responsible for understanding the operation of the GAL chip.  However, you are responsible for understanding how the GAL's control signals are used to control the memory circuits.", "You are not responsible for understanding the operation of the GAL chip. However, you are responsible for understanding how the GAL's control signals are used to control the memory circuits.............................................................................."], "jumps": ["P1600", "P1570"]}, {"id": "P1600", "text": ["The last two control signals from the microprocessor to memory are the WR and RD. These are the read and write signals.  If the WR line is low, the microprocessor is trying to write information to memory.", "The last two control signals from the microprocessor to memory are the WR and RD. These are the read and write signals. If the WR line is low, the microprocessor is trying to write information to memory."], "jumps": ["P1620", "P1570"]}, {"id": "P1620", "text": ["When the RD line is low, the microprocessor is trying to read information from memory.  When both lines are high, the                microprocessor is not performing a read or write to memory.", "When the RD line is low, the microprocessor is trying to read information from memory. When both lines are high, the microprocessor is not performing a read or write to memory."], "jumps": ["P1630", "P1600"]}, {"id": "P1630", "text": ["Both lines cannot be low at the same time because the microprocessor cannot read and write and the same time.  On the EPROM chips, since they are read only, the RD signal is connected to the OE or output enable pin of the EPROM chips.", "Both lines cannot be low at the same time because the microprocessor cannot read and write and the same time. On the EPROM chips, since they are read only, the RD signal is connected to the OE or output enable pin of the EPROM chips."], "jumps": ["P1640", "P1600"]}, {"id": "P1640", "text": ["This means that when the microprocessor wants to read data from the EPROM, the output enable is turned on.   When the output enable is turned off, the output of the EPROM is effectively disconnected from the data bus.  This is known as a tri-state operation, where the output is a high impedance.", "This means that when the microprocessor wants to read data from the EPROM, the output enable is turned on. When the output enable is turned off, the output of the EPROM is effectively disconnected from the data bus. This is known as a tri-state operation, where the output is a high impedance."], "jumps": ["P1650", "P1600"]}, {"id": "P1650", "text": ["On the RAM chips, the RD signal is also connected to the OE, and since you can write to RAM, the WR signal is attached to the RAM's WE or Write Enable pin.", "On the RAM chips, the RD signal is also connected to the OE, and since you can write to RAM, the WR signal is attached to the RAM's WE or Write Enable pin. means when the microprocessor generates the write signal, the write enable will be activated and the value on the data bus will be written to the address location on address lines A1 through A15 within the particular RAM chip or chips."], "jumps": ["P1651", "P1600"]}, {"id": "P1651", "text": ["This means that when the microprocessor generates the write signal, the write enable will be activated and the value on  the data bus will be written to the address location on address lines A1 through A15 within the particular RAM chip or chips.", "This means that when the microprocessor generates the write signal, the write enable will be activated and the value on the data bus will be written to the address location on address lines A1 through A15 within the particular RAM chip or chips. p or chips. ll be written to the address location on address lines A1 through A15 within the particular RAM chip or chips."], "jumps": ["P1670", "P1600"]}, {"id": "P1670", "text": ["The way in which memory is connected to any particular 8086 system will depend on the size and number of memory chips used.  However, the manner in which they are connected will be relatively the same.   Normally, a memory map can be used to see how the address lines control which chips are being used.", "The way in which memory is connected to any particular 8086 system will depend on the size and number of memory chips used. However, the manner in which they are connected will be relatively the same. Normally, a memory map can be used to see how the address lines control which chips are being used."], "jumps": ["P1680", "P1600"]}, {"id": "P1680", "text": ["In the experiment you will look at the operation of certain memory signals.  You will be able to see how the synchronized processes work.", "In the experiment you will look at the operation of certain memory signals. You will be able to see how the synchronized processes work."], "jumps": ["P1690", "P1600"]}, {"id": "P1690", "text": ["Which of the following signals is used for latching the address data?"], "jumps": ["P1680"]}, {"id": "P1691", "text": [], "jumps": []}, {"id": "P1692", "text": ["The ALE or Address Latch Enable pin is used to latch address data. This pin is also referred to as the ASTB or Address STroBE signal."], "jumps": []}, {"id": "P1700", "text": ["Which of the following memory types can be written to by the microprocessor?"], "jumps": ["P1690"]}, {"id": "P1701", "text": [], "jumps": []}, {"id": "P1702", "text": ["ROMs are programmed prior to when they are manufactured and EPROMs are written by an EPROM burner.  EPROM data can be changed, but only by erasing the contents with a special device and rewriting the data with a special device.", "ROMs are programmed prior to when they are manufactured and EPROMs are written by an EPROM burner. EPROM data can be changed, but only by erasing the contents with a special device and rewriting the data with a special device......"], "jumps": []}, {"id": "P1910", "text": ["This completes the information on OPERATION OF THE 8086 MICROPROCESSOR."], "jumps": ["P1001", "P1700"]}, {"id": "P1920", "text": ["1.  The 82C84 chip provides timing and clock signals for the 8086       microprocessor.  These signals include the CLOCK, READY          and RESET.", "1. The 82C84 chip provides timing and clock signals for the 8086 microprocessor. These signals include the CLOCK, READY and RESET."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  An RC delay circuit is used in the RESET circuitry to allow a           delay for all system components to be reset when the                       microprocessor restarts.  This is an alternative method                    instead of using the ready signal.", "2. An RC delay circuit is used in the RESET circuitry to allow a delay for all system components to be reset when the microprocessor restarts. This is an alternative method instead of using the ready signal."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The input clock to the 8086 is twice its operating speed. This          means that a 2.66 MHz output from the 82C84 drives the 8086        at 1.33 MHz.", "3. The input clock to the 8086 is twice its operating speed. This means that a 2.66 MHz output from the 82C84 drives the 8086 at 1.33 MHz."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  The BUFEN and BUF/R/W signals control the output enable of       the data buffers and the direction of the buffers.   Buffers                 amplify the data signals from the 8086 which are too weak to          travel far distances or power big loads.", "4. The BUFEN and BUF/R/W signals control the output enable of the data buffers and the direction of the buffers. Buffers amplify the data signals from the 8086 which are too weak to travel far distances or power big loads."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  The ASTB or ALE (Address Strobe or Address Latch Enable)          lock the address value on the multiplexed pins to the output          of the latch.  This allows the address values to be available             later when the data is on the multiplexed pins.", "5. The ASTB or ALE (Address Strobe or Address Latch Enable) lock the address value on the multiplexed pins to the output of the latch. This allows the address values to be available later when the data is on the multiplexed pins."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.   Address lines A0, and A16-19 are used to select different sets        of memory chips.   In the Nida 8086 system there can be\n      64 k bytes of EPROM memory and up to 128 k bytes of RAM           memory.", "6. Address lines A0, and A16-19 are used to select different sets of memory chips. In the Nida 8086 system there can be 64 k bytes of EPROM memory and up to 128 k bytes of RAM memory."], "jumps": ["P1980", "P1950"]}, {"id": "P1980", "text": ["7.  The UBE and A0 (LBE) are used to select the upper and lower        bytes of the address bus from the individual memory chips            connected to the data bus.", "7. The UBE and A0 (LBE) are used to select the upper and lower bytes of the address bus from the individual memory chips connected to the data bus."], "jumps": ["P1990", "P1950"]}, {"id": "P1990", "text": ["8.  The IO/M signal is used to indicate whether memory or IO is            being accessed.", "8. The IO/M signal is used to indicate whether memory or IO is being accessed."], "jumps": ["P1999", "P1950"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1950"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2040", "text": ["The purpose of this experiment is to examine various timing and memory control signals generated and/or used by the microprocessor."], "jumps": ["P2050", "P2001"]}, {"id": "P2050", "text": ["By looking at these signals, you can begin to understand the importance of timing, the purpose for each signal, and a view of    microprocessor memory access in action.", "By looking at these signals, you can begin to understand the importance of timing, the purpose for each signal, and a view of microprocessor memory access in action."], "jumps": ["P2051", "P2040"]}, {"id": "P2051", "text": ["The schematic for the PC130-410 8086 Microprocessor and PC130-411 8086 Decoder/Memory will be displayed to you when needed by pressing Ctrl+S during this experiment."], "jumps": ["P2052", "P2040"]}, {"id": "P2052", "text": ["Having the schematic is like having the road map to a city. Without it, you cannot easily trace the connections between the test points, the pins of the microprocessor, and external circuitry."], "jumps": ["P2060", "P2051"]}, {"id": "P2060", "text": ["Let's begin the experiment on the operation of the 8086 microprocessor."], "jumps": ["P2070", "P2051"]}, {"id": "P2070", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2060"]}, {"id": "P2080", "text": ["2. Insert the following 130 experiment cards on the test console. a. Insert PC130-410 8086 Microprocessor card in the PC1 position. b. Insert PC130-411 8086 Decoder/Memory card in the PC2 position. c. Insert PC130-401 I/O card in the PC3 position."], "jumps": ["P2085", "P2070"]}, {"id": "P2085", "text": ["3.  Place the PC130-404 Keyboard and Display card in front of            the test console between the PC2 and PC3 positions.", "3. Place the PC130-404 Keyboard and Display card in front of the test console between the PC2 and PC3 positions."], "jumps": ["P2090", "P2080"]}, {"id": "P2090", "text": ["4. Connect the 4 experiment cards with the ribbon cables as follows: a. Using the 50 pin ribbon cable, connect PC130-410 J1 to PC130-411 J1. b. Using the short 20 pin ribbon cable, connect PC130-411 J2 to PC130-401 J1. c. Using the long 20 pin ribbon cable, connect PC130-401 J2 to PC130-404 J1.", "The Ribbon Cables must be installed in the proper orientation. Note that each cable has a red stripe on one side. This stripe indicates pin 1. On the Experiment Cards, the numeral 1 or 2 indicates the end of the connector with the 1 pin. Attach the cables to the connectors such that the red stripe is at the end of the connector with the numeral 1 or 2.", "The Ribbon Cables must be installed in the proper orientation. Note that each cable has a red stripe on one side. This stripe indicates pin 1. On the Experiment Cards, the numeral 1 or 2 indicates the end of the connector with the 1 pin. Attach the cables to the connectors such that the red stripe is at the end of the connector with the numeral 1 or 2..", "CAUTION -400 card has its own chassis."], "jumps": ["P2100", "P2085"]}, {"id": "P2100", "text": ["5.  Set the Positive DC Power Supply to 5 volts.", "5. Set the Positive DC Power Supply to 5 volts.30A - Set the PC1 DC Switch to ON...."], "jumps": ["P2090"]}, {"id": "P2120", "text": ["6.  Press the PC3 DC Power switch to ON.", "6. Press the PC3 DC Power switch to ON.N.12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2100"]}, {"id": "P2125", "text": ["7.  Press the PC2 DC Power switch to ON.", "7. Press the PC2 DC Power switch to ON.o 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2120"]}, {"id": "P2130", "text": ["8.  Press the PC1 DC Power switch to ON.", "8. Press the PC1 DC Power switch to ON.o 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2125"]}, {"id": "P2135", "text": ["9. The microprocessor system is now assembled and operating. You should see the message \"NIDA Corporation Intel 8086 Vx.x NIDA:\" in the LCD display on the PC130-404 card. If the message is dim or blank, try adjusting the Display Intensity potentiometer R1 on the PC130-404 card using a small screwdriver. If you still cannot see the message, see your instructor for assistance.", "The \"Vx.x\" in the display of the LCD indicates the version of the monitor program you are using. This experiment is written for all versions of the monitor program. If, at any time during the experiment, you short some of the IC pins together while observing the signals, press the reset button. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run the program before proceeding with your measurements.nts."], "jumps": ["P2136", "P2130"]}, {"id": "P2136", "text": ["TIMING AND CONTROL SIGNALS\nIn the first part of the experiment, we are going to look at the     timing and control signals generated by the 82C84 chip. This         includes the CLK, RDY and RESET signals.", "TIMING AND CONTROL SIGNALS In the first part of the experiment, we are going to look at the timing and control signals generated by the 82C84 chip. This includes the CLK, RDY and RESET signals."], "jumps": ["P2140", "P2135"]}, {"id": "P2140", "text": ["By looking at these signals and their operation, a clearer understanding of their role in system operation can be understood.  The first signal we are going to look at is the CLK signal.", "By looking at these signals and their operation, a clearer understanding of their role in system operation can be understood. The first signal we are going to look at is the CLK signal. GRAPHIC TEXT)NOTE Before trying to measure a signal from the actual IC pin, look at the test point banks on the PC card. Almost all of the pins have test points.", "Before trying to measure a signal from the actual IC pin, look at the test point banks on the PC card. Almost all of the pins have test points. ime during the experiment, you short some of the IC pins together while observing the signals, press the rest button. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run the program before proceeding with your measurements...nts."], "jumps": ["P2150", "P2136"]}, {"id": "P2150", "text": ["10.   Press the reset button.  Using the oscilloscope, measure the         voltage level and frequency of the CLK pin in Test Bank 1.              This is the clock input to the microprocessor.  The frequency         should be 2.66 MHz, which is twice the operating speed that          the 8086 will be using.", "10. Press the reset button. Using the oscilloscope, measure the voltage level and frequency of the CLK pin in Test Bank 1. This is the clock input to the microprocessor. The frequency should be 2.66 MHz, which is twice the operating speed that the 8086 will be using."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["11.  Using CH2 of the oscilloscope, measure the PCLK signal of            the 82C84 chip.  This will be U2 pin 2.  Display both signals             at the same time and compare their differences.", "11. Using CH2 of the oscilloscope, measure the PCLK signal of the 82C84 chip. This will be U2 pin 2. Display both signals at the same time and compare their differences."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["You may have to adjust the triggering slightly to get both signals to trigger together.  You should observe that the output of the        PCLK signal is half the frequency, or twice the time, of the CLK     signal.", "You may have to adjust the triggering slightly to get both signals to trigger together. You should observe that the output of the PCLK signal is half the frequency, or twice the time, of the CLK signal."], "jumps": ["P2180", "P2150"]}, {"id": "P2180", "text": ["Remember that this is used by peripherals needing a clock signal the same as the one used internally by the microprocessor."], "jumps": ["P2190", "P2150"]}, {"id": "P2190", "text": ["Now that we have looked at the clock signal, let's observe the operation of the ready signal.  The ready signal tells the computer if external devices are ready to continue or not.", "Now that we have looked at the clock signal, let's observe the operation of the ready signal. The ready signal tells the computer if external devices are ready to continue or not."], "jumps": ["P2200", "P2150"]}, {"id": "P2200", "text": ["We will look at two situations. The first is the normal operation not ready state.  This may occur when you are writing information to a storage device and it is not ready to continue. The second condition is when the RESET signal is active.", "We will look at two situations. The first is the normal operation not ready state. This may occur when you are writing information to a storage device and it is not ready to continue. The second condition is when the RESET signal is active."], "jumps": ["P2210", "P2150"]}, {"id": "P2210", "text": ["This means that all other devices have not yet reset.  Let's first observe the assertion of the not-ready state, a low input, during    the operation of a program.", "This means that all other devices have not yet reset. Let's first observe the assertion of the not-ready state, a low input, during the operation of a program."], "jumps": ["P2220", "P2150"]}, {"id": "P2220", "text": ["12.  Press Reset. Start the Nida 8086 Demo Program by pressing          0, pressing the down arrow and then selecting 4.  The LCD             should begin displaying messages and the LEDs of the IO              card should start flashing.  This program will continue to                 loop until RESET is pressed.", "12. Press Reset. Start the Nida 8086 Demo Program by pressing 0, pressing the down arrow and then selecting 4. The LCD should begin displaying messages and the LEDs of the IO card should start flashing. This program will continue to loop until RESET is pressed."], "jumps": ["P2230", "P2150"]}, {"id": "P2230", "text": ["Now that we have a program running, our task is to tell the microprocessor that some device is not ready while it is running  this program.", "Now that we have a program running, our task is to tell the microprocessor that some device is not ready while it is running this program."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["13.  While the Demo is running, connect a jumper wire to ground.         While observing the system's display and LEDs,                                momentarily ground the RDY test point in Test Point Bank 1.", "13. While the Demo is running, connect a jumper wire to ground. While observing the system's display and LEDs, momentarily ground the RDY test point in Test Point Bank 1."], "jumps": ["P2250", "P2220"]}, {"id": "P2250", "text": ["You should have seen the display stop while you simulated the READY signal.  When you removed the jumper, the RDY pin returned to a high level and the microprocessor began again from where it stopped.", "You should have seen the display stop while you simulated the READY signal. When you removed the jumper, the RDY pin returned to a high level and the microprocessor began again from where it stopped."], "jumps": ["P2255", "P2220"]}, {"id": "P2255", "text": ["Next let's observe the ready signal during a reset condition. Different devices require varied amounts of time to reset, and may  take longer than the clock circuit and microprocessor.  Let's set the not ready condition and reset the system to see what happens.", "Next let's observe the ready signal during a reset condition. Different devices require varied amounts of time to reset, and may take longer than the clock circuit and microprocessor. Let's set the not ready condition and reset the system to see what happens."], "jumps": ["P2260", "P2220"]}, {"id": "P2260", "text": ["14.   Using a jumper, ground the RDY test point of Test Point                  Bank 1.  Leave this jumper connected and do not remove it            until instructed to.", "14. Using a jumper, ground the RDY test point of Test Point Bank 1. Leave this jumper connected and do not remove it until instructed to."], "jumps": ["P2270", "P2220"]}, {"id": "P2270", "text": ["15.  Press the RESET button on the PC130-410 card and observe         the outputs of the LEDs and the LCD panel.", "15. Press the RESET button on the PC130-410 card and observe the outputs of the LEDs and the LCD panel."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["You should see that the LEDs reset and the LCD display stopped where it was at.  The not ready condition has been asserted and the system is waiting for all circuits to be ready to continue.", "You should see that the LEDs reset and the LCD display stopped where it was at. The not ready condition has been asserted and the system is waiting for all circuits to be ready to continue."], "jumps": ["P2290", "P2260"]}, {"id": "P2290", "text": ["The LED's are connected to the parallel port.  The parallel port chip, also known as a port expander, has a reset input.  This signal is activated when the reset button was pressed.", "The LED's are connected to the parallel port. The parallel port chip, also known as a port expander, has a reset input. This signal is activated when the reset button was pressed."], "jumps": ["P2300", "P2260"]}, {"id": "P2300", "text": ["The LCD circuitry is reset by instructions from the microprocessor.  For this reason, it will not be reset until all circuits have been reset and the microprocessor can reset it with software.", "The LCD circuitry is reset by instructions from the microprocessor. For this reason, it will not be reset until all circuits have been reset and the microprocessor can reset it with software."], "jumps": ["P2310", "P2260"]}, {"id": "P2310", "text": ["16.   Remove the jumper from the PC130-410 card and observe               the system.", "16. Remove the jumper from the PC130-410 card and observe the system."], "jumps": ["P2320", "P2260"]}, {"id": "P2320", "text": ["The display of the system should have returned to the main screen of the monitor program.  When you removed the jumper, the ready condition was acknowledged and the system began processing.", "The display of the system should have returned to the main screen of the monitor program. When you removed the jumper, the ready condition was acknowledged and the system began processing."], "jumps": ["P2330", "P2260"]}, {"id": "P2330", "text": ["In the monitor program are instructions for resetting the LCD. The display's changed output verifies this."], "jumps": ["P2340", "P2260"]}, {"id": "P2340", "text": ["You can see how these signals work together to make sure all systems are ready at the same time during normal operations and in the reset condition. Remember, the 82C84 is a powerful and versatile clock and control chip. The 82C84 is widely used today in a newer version designed for higher speeds and lower voltages."], "jumps": ["P2350", "P2260"]}, {"id": "P2350", "text": ["Now that we have examined the circuits necessary for the timing and control inputs to the microprocessor, let's look at the memory signals."], "jumps": ["P2360", "P2260"]}, {"id": "P2360", "text": ["MEMORY\nAs you have seen in the first part of this lesson, there are many     signals that are used to control the chips that interface with the    memory of the 8086. These chips include RAM, EPROM, latches,   buffers, encoders and logic arrays.", "MEMORY As you have seen in the first part of this lesson, there are many signals that are used to control the chips that interface with the memory of the 8086. These chips include RAM, EPROM, latches, buffers, encoders and logic arrays........."], "jumps": ["P2370", "P2260"]}, {"id": "P2370", "text": ["In this section of the experiment we are going to look at a few of these signals to underscore the importance of their use in the       system.", "In this section of the experiment we are going to look at a few of these signals to underscore the importance of their use in the system."], "jumps": ["P2380", "P2360"]}, {"id": "P2380", "text": ["To look at the signals on the oscilloscope, we need to run a loop program to see the operation of the different signals."], "jumps": ["P2390", "P2360"]}, {"id": "P2390", "text": ["17.   Press the RESET button on the PC130-410 card. You will be          entering a program for execution by the 8086                                       microprocessor.  The help button below will give you a                    summary on entering programs if you do not remember                   from the previous lesson.", "17. Press the RESET button on the PC130-410 card. You will be entering a program for execution by the 8086 microprocessor. The help button below will give you a summary on entering programs if you do not remember from the previous lesson."], "jumps": ["P2400", "P2360", "P2395"]}, {"id": "P2391", "text": ["17.   Press the RESET button on the PC130-410 card. You will be          entering a program for execution by the 8086                                       microprocessor.  The help button below will give you a                    summary on entering programs if you do not remember                   from the previous lesson.", "17. Press the RESET button on the PC130-410 card. You will be entering a program for execution by the 8086 microprocessor. The help button below will give you a summary on entering programs if you do not remember from the previous lesson."], "jumps": ["P2400", "P2360", "P2395"]}, {"id": "P2395", "text": ["INSTRUCTIONS FOR ENTERING PROGRAMS: 1. Press EDIT on the PC130-404 Keyboard & Display experiment card and enter the desired SEGMENT or OFFSET. A SEGMENT such as 1000 may be entered as 1000:, 1000:0, or 1000:0000. An OFFSET such as 1000 may be entered as 1000, :1000, or 0000:1000. 2. Press ENTER after the desired SEGMENT or OFFSET has been entered. The display will now show the SEGMENT at the top of the display along with OFFSET and store OPCODE at the bottom of the display. NOTE: Every time you enter an OPCODE and press ENTER, you automatically move to the next OFFSET. Additionally, there are three things that can be done at any SEGMENT and OFFSET:Enter a new value and press ENTER, press the down arrow to move to the next OFFSET, or press the up arrow to move to the previous OFFSET. 3. Enter all of the desired OPCODES for the program remembering to press ENTER after each. 4. After all OPCODES of the program have been entered, press the STOP key. 5. The program has now been stored in memory. To verify the program has been stored correctly, press the DISPLAY R.M. key, enter the starting address of the program, and press ENTER. All OPCODES for that location, as well for the next 17 locations, will be displayed. up orders and checks automobile prior to delivery. Advertising and telephone marketing may be required at slow times. Environment - Clean well lighted showroom or outside on a lot. Evenings, days and weekends. Requirements - Must be able to maintain a pleasant attitude with people under stressful conditions. Good personal appearance and manners are important."], "jumps": []}, {"id": "P2400", "text": ["18.  Enter the following program starting at \"2000:0\".", "18. Enter the following program starting at \"2000:0\". IC TEXT)Address Opcode Mnemonic Description 2000:0000 B8 MOV AX,0Ah Moves the value 0Ah 2000:0001 00 into the AX register 2000:0002 0A 2000:0003 A3 MOV 2000:0100, AX Moves the value stored 2000:0004 00 in the AX register to 2000:0005 64 memory location 2000: 0000 and starts their. 2000:0006 EB JMP 2000:0000 2000:0007 F8", "Address Opcode Mnemonic Description 2000:0000 B8 MOV AX,0Ah Moves the value 0Ah 2000:0001 00 into the AX register. 2000:0002 0A 2000:0003 A3 MOV 2000:0100, AX Moves the value stored 2000:0004 00 in the AX register to 2000:0005 64 memory location 2000:0000 and starts there. 2000:0006 EB JMP 2000:0000 2000:0007 F8"], "jumps": ["P2410", "P2360"]}, {"id": "P2410", "text": ["19.   Run the program you just entered.  This is done by pressing         the RUN key and entering the starting address of the                        program: \"2000:0\".", "19. Run the program you just entered. This is done by pressing the RUN key and entering the starting address of the program: \"2000:0\"."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["The display of the 8086 should be frozen.  The program you ran is now in a continuous loop performing the same three functions over and over: moving the value 0A into the AX register, writing the value in AX to a memory location, and then returning back to the first instruction again.", "The display of the 8086 should be frozen. The program you ran is now in a continuous loop performing the same three functions over and over: moving the value 0A into the AX register, writing the value in AX to a memory location, and then returning back to the first instruction again."], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["This process is repeated continuously to allow us to look at these signals.   Note that during normal operation, microprocessor signals are not periodic other than the clock signal.", "This process is repeated continuously to allow us to look at these signals. Note that during normal operation, microprocessor signals are not periodic other than the clock signal."], "jumps": ["P2440", "P2410"]}, {"id": "P2440", "text": ["Logic analyzers can be used to look at non-periodic wave forms. Many technicians run a short program that makes many microprocessor signals periodic so they can be tested using an oscilloscope."], "jumps": ["P2450", "P2410"]}, {"id": "P2450", "text": ["The next step requires fine tuning your oscilloscope. The oscilloscope settings are ball park and may need adjusting to       recreate the waveforms as shown below.", "The next step requires fine tuning your oscilloscope. The oscilloscope settings are ball park and may need adjusting to recreate the waveforms as shown below."], "jumps": ["P2460", "P2410"]}, {"id": "P2460", "text": ["20.   Set your oscilloscope to 2mS, dual channel, 0.5 volts and DC          coupling.  Make sure you use x10 oscilloscope probes.                    This will keep the oscilloscope from affecting the operation            of the system.", "20. Set your oscilloscope to 2mS, dual channel, 0.5 volts and DC coupling. Make sure you use x10 oscilloscope probes. This will keep the oscilloscope from affecting the operation of the system."], "jumps": ["P2470", "P2410"]}, {"id": "P2470", "text": ["21.   Connect CH1 of your oscilloscope to the RD signal on the               PC130-411 card.   Using the HOLD OFF control, adjust it                  very slowly to get the RD signal similar to the one shown                below.", "21. Connect CH1 of your oscilloscope to the RD signal on the PC130-411 card. Using the HOLD OFF control, adjust it very slowly to get the RD signal similar to the one shown below."], "jumps": ["P2480", "P2460"]}, {"id": "P2480", "text": ["From the waveforms below you can see what is happening inside the microprocessor during the execution of instructions within the loop.   The first low pulse of the RD line is reading in the first 16 bits of an instruction.", "From the waveforms below you can see what is happening inside the microprocessor during the execution of instructions within the loop. The first low pulse of the RD line is reading in the first 16 bits of an instruction."], "jumps": ["P2490", "P2460"]}, {"id": "P2490", "text": ["The first instruction indicates an additional byte needs to be read from memory.  The second low pulse of the RD line is reading the additional byte of information for that instruction.", "The first instruction indicates an additional byte needs to be read from memory. The second low pulse of the RD line is reading the additional byte of information for that instruction."], "jumps": ["P2500", "P2460"]}, {"id": "P2500", "text": ["Now the microprocessor performs the operation. In this case, it takes a very short amount of time.  Now the processor reads in the next instruction with the third, low pulse on the RD line.", "Now the microprocessor performs the operation. In this case, it takes a very short amount of time. Now the processor reads in the next instruction with the third, low pulse on the RD line."], "jumps": ["P2510", "P2460"]}, {"id": "P2510", "text": ["Again, this instruction requires an additional byte of data which the microprocessor reads.  This instruction is going to write information to RAM.  For this reason, the actual instruction execution stage takes longer.", "Again, this instruction requires an additional byte of data which the microprocessor reads. This instruction is going to write information to RAM. For this reason, the actual instruction execution stage takes longer."], "jumps": ["P2520", "P2460"]}, {"id": "P2520", "text": ["The first instruction moved data internally.  The second instruction takes internal data and sends it to external memory. This means that   all the correct signals must be set for the external devices, which requires more time than a signal microprocessor cycle.", "The first instruction moved data internally. The second instruction takes internal data and sends it to external memory. This means that all the correct signals must be set for the external devices, which requires more time than a signal microprocessor cycle."], "jumps": ["P2530", "P2460"]}, {"id": "P2530", "text": ["After the data has been written (as seen by the WR pulse that goes low) the next instruction is read by the microprocessor. This is the jump instruction which does not require any additional bytes.  The microprocessor performs the jump and execution of the loop begins again.", "After the data has been written (as seen by the WR pulse that goes low) the next instruction is read by the microprocessor. This is the jump instruction which does not require any additional bytes. The microprocessor performs the jump and execution of the loop begins again."], "jumps": ["P2540", "P2460"]}, {"id": "P2540", "text": ["It is important to note that the smallest instruction of the 8086 is 16 bit.  However, there are longer instructions which contain\n16 bit values and an 8 bit instruction.  In these situations the instruction and part of the data is read into memory during the first read.", "It is important to note that the smallest instruction of the 8086 is 16 bit. However, there are longer instructions which contain 16 bit values and an 8 bit instruction. In these situations the instruction and part of the data is read into memory during the first read."], "jumps": ["P2550", "P2460"]}, {"id": "P2550", "text": ["22.   Leaving CH1 attached to the RD signal, use channel 2 and             verify each of the signals shown below.  Every time you                   connect to a new signal it may be necessary to adjust the               HOLD OFF control.", "22. Leaving CH1 attached to the RD signal, use channel 2 and verify each of the signals shown below. Every time you connect to a new signal it may be necessary to adjust the HOLD OFF control."], "jumps": ["P2560", "P2540"]}, {"id": "P2560", "text": ["Since we are not accessing any EPROM memory, CS1 and CS2 remain high which indicates they are not being used.   CS3 and CS4 are used all the way up until the write to memory.  This is because we are writing to the third bank of RAM.", "Since we are not accessing any EPROM memory, CS1 and CS2 remain high which indicates they are not being used. CS3 and CS4 are used all the way up until the write to memory. This is because we are writing to the third bank of RAM."], "jumps": ["P2570", "P2540"]}, {"id": "P2570", "text": ["Even if your set of 8086 cards does not have the third bank of RAM, the microprocessor has no way of knowing.   For this reason, it tries to write to the third bank.  This is why the CS5 and CS6 are low during the write.", "Even if your set of 8086 cards does not have the third bank of RAM, the microprocessor has no way of knowing. For this reason, it tries to write to the third bank. This is why the CS5 and CS6 are low during the write."], "jumps": ["P2580", "P2540"]}, {"id": "P2580", "text": ["The chip select signals CS1 through CS6 indicate that the particular chip is selected when the signal is low.  The IO/M signal is high all the time because no IO is being accessed during the loop.", "The chip select signals CS1 through CS6 indicate that the particular chip is selected when the signal is low. The IO/M signal is high all the time because no IO is being accessed during the loop."], "jumps": ["P2590", "P2540"]}, {"id": "P2590", "text": ["From this experiment you were able to observe the real time operation of the memory control signals.  Timing is important to make sure all operations are performed at the correct times.", "From this experiment you were able to observe the real time operation of the memory control signals. Timing is important to make sure all operations are performed at the correct times."], "jumps": ["P2600", "P2540"]}, {"id": "P2600", "text": ["In the next lesson you will perform a similar experiment looking at the IO circuitry connections and performance.   An important note about microprocessor operation is that memory and timing are required for the microprocessor to operate and perform actions.", "In the next lesson you will perform a similar experiment looking at the IO circuitry connections and performance. An important note about microprocessor operation is that memory and timing are required for the microprocessor to operate and perform actions."], "jumps": ["P2610", "P2540"]}, {"id": "P2610", "text": ["IO is not necessary, but gives the microprocessor an interface to the real world.  This lesson described the necessary circuitry and signals that are required in every microprocessor system using the 8086.", "IO is not necessary, but gives the microprocessor an interface to the real world. This lesson described the necessary circuitry and signals that are required in every microprocessor system using the 8086."], "jumps": ["P2620", "P2540"]}, {"id": "P2620", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": ["P2540"]}, {"id": "P2630", "text": ["2.  Set the Console Power Switch to OFF.", "2. Set the Console Power Switch to OFF...................."], "jumps": ["P2620"]}, {"id": "P2640", "text": ["3.  Disconnect the equipment and return to the designated area.", "3. Disconnect the equipment and return to the designated area.."], "jumps": ["P2910", "P2630"]}, {"id": "P2910", "text": ["This completes the experiment on 8086 MICROPROCESSOR.", "This completes the experiment on 8086 MICROPROCESSOR......."], "jumps": ["P2001", "P2640"]}, {"id": "P5000", "text": [], "jumps": []}, {"id": "P5001", "text": [], "jumps": []}, {"id": "P5002", "text": [], "jumps": []}, {"id": "P5003", "text": [], "jumps": []}, {"id": "P5004", "text": [], "jumps": []}, {"id": "P5005", "text": [], "jumps": []}, {"id": "P6000", "text": ["8086 Decoder/Memory ble ble rrrrrr"], "jumps": []}, {"id": "P6001", "text": [], "jumps": []}, {"id": "P6002", "text": [], "jumps": []}, {"id": "P6003", "text": [], "jumps": []}, {"id": "P6004", "text": [], "jumps": []}, {"id": "P6005", "text": [], "jumps": []}, {"id": "P6006", "text": [], "jumps": []}, {"id": "P6007", "text": [], "jumps": []}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["Which signal is used to indicate that another device has not completed current operation?"], "jumps": []}, {"id": "P10211", "text": ["PCLK is what frequency in comparison with the CLK?"], "jumps": []}, {"id": "P10212", "text": ["A device indicates to the microprocessor that it is ready when _______", "it places a high impedances on the RDY line.."], "jumps": []}, {"id": "P10213", "text": [], "jumps": []}, {"id": "P10214", "text": ["The oscillator of the 82C84 requires _______"], "jumps": []}, {"id": "P10215", "text": ["What is the purpose of the resistor attached to the RDY1 signal?", "The resistor is an extra component that is not needed..", "It limits the current when a low is applied to the RDY1 pin."], "jumps": []}, {"id": "P10216", "text": ["can be reprogrammed using special devices."], "jumps": []}, {"id": "P10217", "text": [], "jumps": []}, {"id": "P10218", "text": ["How many banks are there on the Nida 8086 microprocessor system for memory?"], "jumps": []}, {"id": "P10219", "text": ["Each memory chip in the system can contain _______"], "jumps": []}, {"id": "P10220", "text": ["How many memory chips are required in each bank if each chip has 8 data lines?"], "jumps": []}, {"id": "P10221", "text": ["Which signal is twice the operating speed of the microprocessor?"], "jumps": []}, {"id": "P10222", "text": ["Which signal is the same speed as the microprocessor's operating speed and is used for peripherals?"], "jumps": []}, {"id": "P10223", "text": ["Which signal is used to restart the entire system?"], "jumps": []}, {"id": "P10224", "text": ["Which IC performs timing and control functions for the 8086?"], "jumps": []}, {"id": "P10225", "text": ["Which signal latches an address into the address latches?", "Both A and B are correct. They are two names for the same pin which provide this function."], "jumps": []}, {"id": "P10226", "text": ["How many signals are used to connect memory to the 8086?", "It depends on the amount of memory used, the memory size of the chips, as well as other factors."], "jumps": []}, {"id": "P10227", "text": ["Which of the following signals control the direction of data flow from memory to the microprocessor?"], "jumps": []}, {"id": "P10228", "text": ["In the memory configuration, A0 is used as the ________"], "jumps": []}, {"id": "P10229", "text": ["Which of the following pins is not on the 8086 but on a memory chip?"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to _________"], "jumps": []}, {"id": "P10410", "text": ["1. Operation of the 8086 Microprocessor"], "jumps": []}, {"id": "P13040", "text": ["The purpose of this experiment is to examine various timing and memory control signals generated and/or used by the microprocessor."], "jumps": ["P13050", "P2001"]}, {"id": "P13050", "text": ["By looking at these signals, you can begin to understand the importance of timing, the purpose for each signal, and a view of    microprocessor memory access in action.", "By looking at these signals, you can begin to understand the importance of timing, the purpose for each signal, and a view of microprocessor memory access in action."], "jumps": ["P13051", "P13040"]}, {"id": "P13051", "text": ["The schematic for the PC130-410 8086 Microprocessor and PC130-411 8086 Decoder/Memory will be displayed to you when needed by pressing Ctrl+S during this experiment."], "jumps": ["P13052", "P13040"]}, {"id": "P13052", "text": ["Having the schematic is like having the road map to a city. Without it, you cannot easily trace the connections between the test points, the pins of the microprocessor, and external circuitry."], "jumps": ["P13060", "P13051"]}, {"id": "P13060", "text": ["Let's begin the experiment on the operation of the 8086 microprocessor."], "jumps": ["P13070", "P13051"]}, {"id": "P13070", "text": ["1.   Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings........."], "jumps": ["P13060"]}, {"id": "P13080", "text": ["2. Insert the following 130 experiment cards on the test console. a. Insert PC130-410 8086 Microprocessor card in the PC1 position. b. Insert PC130-411 8086 Decoder/Memory card in the PC2 position. c. Insert PC130-401 I/O card in the PC3 position."], "jumps": ["P13085"]}, {"id": "P13085", "text": ["3.   Place the PC130-404 Keyboard and Display card in front of            the test console between the PC2 and PC3 positions.", "3. Place the PC130-404 Keyboard and Display card in front of the test console between the PC2 and PC3 positions."], "jumps": ["P13090", "P13080"]}, {"id": "P13090", "text": ["4. Connect the 4 experiment cards with the ribbon cables as follows: a. Using the 50 pin ribbon cable, connect PC130-410 J1 to PC130-411 J1. b. Using the short 20 pin ribbon cable, connect PC130-411 J2 to PC130-401 J1. c. Using the long 20 pin ribbon cable, connect PC130-401 J2 to PC130-404 J1.", "The Ribbon Cables must be installed in the proper orientation. Note that each cable has a red stripe on one side. This stripe indicates pin 1. On the Experiment Cards, the numeral 1 or 2 indicates the end of the connector with the 1 pin. Attach the cables to the connectors such that the red stripe is at the end of the connector with the numeral 1 or 2.", "The Ribbon Cables must be installed in the proper orientation. Note that each cable has a red stripe on one side. This stripe indicates pin 1. On the Experiment Cards, the numeral 1 or 2 indicates the end of the connector with the 1 pin. Attach the cables to the connectors such that the red stripe is at the end of the connector with the numeral 1 or 2..", "CAUTION -400 card has its own chassis."], "jumps": ["P13100", "P13085"]}, {"id": "P13100", "text": ["5.  Press enter to set: Positive Supply Voltage -  5", "5. Press enter to set: Positive Supply Voltag
