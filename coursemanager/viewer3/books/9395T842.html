e - 555....................."], "jumps": ["P13090"]}, {"id": "P13110", "text": ["6.  Press enter to set: PC3 DC Power Switch - ON", "6. Press enter to set: PC3 DC Power Switch - ON..........................."], "jumps": []}, {"id": "P13120", "text": ["7.  Press enter to set: PC2 DC Power Switch - ON", "7. Press enter to set: PC2 DC Power Switch - ON..........................."], "jumps": []}, {"id": "P13130", "text": ["8.  Press enter to set: PC1 DC Power switch - ON", "8. Press enter to set: PC1 DC Power switch - ONN.........................."], "jumps": []}, {"id": "P13135", "text": ["9. The microprocessor system is now assembled and operating. You should see the message \"NIDA Corporation Intel 8086 Vx.x NIDA:\" in the LCD display on the PC130-404 card. If the message is dim or blank, try adjusting the Display Intensity potentiometer R1 on the PC130-404 card using a small screwdriver. If you still cannot see the message, see your instructor for assistance.", "The \"Vx.x\" in the display of the LCD indicates the version of the monitor program you are using. This experiment is written for all versions of the monitor program. If, at any time during the experiment, you short some of the IC pins together while observing the signals, press the reset button. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run the program before proceeding with your measurements.nts."], "jumps": ["P13136"]}, {"id": "P13136", "text": ["TIMING AND CONTROL SIGNALS\nIn the first part of the experiment, we are going to look at the     timing and control signals generated by the 82C84 chip. This         includes the CLK, RDY and RESET signals.", "TIMING AND CONTROL SIGNALS In the first part of the experiment, we are going to look at the timing and control signals generated by the 82C84 chip. This includes the CLK, RDY and RESET signals."], "jumps": ["P13140", "P13135"]}, {"id": "P13140", "text": ["By looking at these signals and their operation, a clearer understanding of their role in system operation can be understood.  The first signal we are going to look at is the CLK signal.", "By looking at these signals and their operation, a clearer understanding of their role in system operation can be understood. The first signal we are going to look at is the CLK signal. GRAPHIC TEXT)NOTE Before trying to measure a signal from the actual IC pin, look at the test point banks on the PC card. Almost all of the pins have test points.", "Before trying to measure a signal from the actual IC pin, look at the test point banks on the PC card. Almost all of the pins have test points. ime during the experiment, you short some of the IC pins together while observing the signals, press the rest button. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run the program before proceeding with your measurements...nts."], "jumps": ["P13150", "P13136"]}, {"id": "P13150", "text": ["10.   Press the reset button.  Using the oscilloscope, measure the         voltage level and frequency of the CLK pin in Test Bank 1.              This is the clock input to the microprocessor.  The frequency         should be 2.66 MHz, which is twice the operating speed that          the 8086 will be using.", "10. Press the reset button. Using the oscilloscope, measure the voltage level and frequency of the CLK pin in Test Bank 1. This is the clock input to the microprocessor. The frequency should be 2.66 MHz, which is twice the operating speed that the 8086 will be using."], "jumps": ["P13160", "P13140"]}, {"id": "P13160", "text": ["11.   Using CH2 of the oscilloscope, measure the PCLK signal of            the 82C84 chip.  This will be U2 pin 2.  Display both signals             at the same time and compare their differences.", "11. Using CH2 of the oscilloscope, measure the PCLK signal of the 82C84 chip. This will be U2 pin 2. Display both signals at the same time and compare their differences."], "jumps": ["P13170", "P13150"]}, {"id": "P13170", "text": ["You may have to adjust the triggering slightly to get both signals to trigger together.  You should observe that the output of the        PCLK signal is half the frequency, or twice the time, of the CLK     signal.", "You may have to adjust the triggering slightly to get both signals to trigger together. You should observe that the output of the PCLK signal is half the frequency, or twice the time, of the CLK signal."], "jumps": ["P13180", "P13150"]}, {"id": "P13180", "text": ["Remember that this is used by peripherals needing a clock signal the same as the one used internally by the microprocessor."], "jumps": ["P13190", "P13150"]}, {"id": "P13190", "text": ["Now that we have looked at the clock signal, let's observe the operation of the ready signal.  The ready signal tells the computer if external devices are ready to continue or not.", "Now that we have looked at the clock signal, let's observe the operation of the ready signal. The ready signal tells the computer if external devices are ready to continue or not."], "jumps": ["P13200", "P13150"]}, {"id": "P13200", "text": ["We will look at two situations. The first is the normal operation not ready state.  This may occur when you are writing information to a storage device and it is not ready to continue. The second condition is when the RESET signal is active.", "We will look at two situations. The first is the normal operation not ready state. This may occur when you are writing information to a storage device and it is not ready to continue. The second condition is when the RESET signal is active."], "jumps": ["P13210", "P13150"]}, {"id": "P13210", "text": ["This means that all other devices have not yet reset.   Let's first observe the assertion of the not-ready state, a low input, during    the operation of a program.", "This means that all other devices have not yet reset. Let's first observe the assertion of the not-ready state, a low input, during the operation of a program."], "jumps": ["P13220", "P13150"]}, {"id": "P13220", "text": ["12.   Press Reset.  Start the Nida 8086 Demo Program by                          pressing 0, pressing the down arrow and then selecting 4.              The LCD should begin displaying messages and the LEDs             of the IO card should start flashing.  This program will                       continue to loop until RESET is pressed.", "12. Press Reset. Start the Nida 8086 Demo Program by pressing 0, pressing the down arrow and then selecting 4. The LCD should begin displaying messages and the LEDs of the IO card should start flashing. This program will continue to loop until RESET is pressed."], "jumps": ["P13230", "P13150"]}, {"id": "P13230", "text": ["Now that we have a program running, our task is to tell the microprocessor that some device is not ready while it is running  this program.", "Now that we have a program running, our task is to tell the microprocessor that some device is not ready while it is running this program."], "jumps": ["P13240", "P13220"]}, {"id": "P13240", "text": ["13.  While the Demo is running, connect a jumper wire to ground.         While observing the system's display and LEDs,                                momentarily ground the RDY test point in Test Point Bank 1.", "13. While the Demo is running, connect a jumper wire to ground. While observing the system's display and LEDs, momentarily ground the RDY test point in Test Point Bank 1."], "jumps": ["P13250", "P13220"]}, {"id": "P13250", "text": ["You should have seen the display stop while you simulated the READY signal.  When you removed the jumper, the RDY pin returned to a high level and the microprocessor began again from where it stopped.", "You should have seen the display stop while you simulated the READY signal. When you removed the jumper, the RDY pin returned to a high level and the microprocessor began again from where it stopped."], "jumps": ["P13255", "P13220"]}, {"id": "P13255", "text": ["Next, let's observe the ready signal during a reset condition. Different devices require varied amounts of time to reset, and may take longer than the clock circuit and microprocessor.  Let's set the not ready condition and reset the system to see what happens.", "Next, let's observe the ready signal during a reset condition. Different devices require varied amounts of time to reset, and may take longer than the clock circuit and microprocessor. Let's set the not ready condition and reset the system to see what happens."], "jumps": ["P13260", "P13220"]}, {"id": "P13260", "text": ["14.   Using a jumper, ground the RDY test point of Test Point                  Bank 1.  Leave this jumper connected and do not remove it            until instructed to.", "14. Using a jumper, ground the RDY test point of Test Point Bank 1. Leave this jumper connected and do not remove it until instructed to."], "jumps": ["P13270", "P13220"]}, {"id": "P13270", "text": ["15.   Press the RESET button on the PC130-410 card and                         observe the outputs of the LED's and the LCD panel.", "15. Press the RESET button on the PC130-410 card and observe the outputs of the LED's and the LCD panel."], "jumps": ["P13280", "P13260"]}, {"id": "P13280", "text": ["You should see that the LED's reset and the LCD display stopped where it was at.  The not ready condition has been asserted and the system is waiting for all circuits to be ready to continue.", "You should see that the LED's reset and the LCD display stopped where it was at. The not ready condition has been asserted and the system is waiting for all circuits to be ready to continue."], "jumps": ["P13290", "P13260"]}, {"id": "P13290", "text": ["The LED's are connected to the parallel port.  The parallel port chip, also known as a port expander, has a reset input.  This signal is activated when the reset button was pressed.", "The LED's are connected to the parallel port. The parallel port chip, also known as a port expander, has a reset input. This signal is activated when the reset button was pressed."], "jumps": ["P13300", "P13260"]}, {"id": "P13300", "text": ["The LCD circuitry is reset by instructions from the microprocessor.   For this reason, it will not be reset until all circuits have been reset and the microprocessor can reset it with software.", "The LCD circuitry is reset by instructions from the microprocessor. For this reason, it will not be reset until all circuits have been reset and the microprocessor can reset it with software."], "jumps": ["P13310", "P13260"]}, {"id": "P13310", "text": ["16.   Remove the jumper from the PC130-410 card and observe               the system.", "16. Remove the jumper from the PC130-410 card and observe the system."], "jumps": ["P13320", "P13260"]}, {"id": "P13320", "text": ["The display of the system should have returned to the main screen of the monitor program.  When you removed the jumper, the ready condition was acknowledged and the system began processing.", "The display of the system should have returned to the main screen of the monitor program. When you removed the jumper, the ready condition was acknowledged and the system began processing."], "jumps": ["P13330", "P13260"]}, {"id": "P13330", "text": ["In the monitor program are instructions for resetting the LCD. The display's changed output verifies this."], "jumps": ["P13340", "P13260"]}, {"id": "P13340", "text": ["You can see how these signals work together to make sure all systems are ready at the same time during normal operations and in the reset condition. Remember, the 82C84 is a powerful and versatile clock and control chip. The 82C84 is widely used today in a newer version designed for higher speeds and lower voltages."], "jumps": ["P13350", "P13260"]}, {"id": "P13350", "text": ["Now that we have examined the circuits necessary for the timing and control inputs to the microprocessor, let's look at the memory signals."], "jumps": ["P13360", "P13260"]}, {"id": "P13360", "text": ["MEMORY\nAs you have seen in the first part of this lesson, there are many     signals that are used to control the chips that interface with the    memory of the 8086.  These chips include RAM, EPROM, latches,  buffers, encoders and logic arrays.", "MEMORY As you have seen in the first part of this lesson, there are many signals that are used to control the chips that interface with the memory of the 8086. These chips include RAM, EPROM, latches, buffers, encoders and logic arrays."], "jumps": ["P13370", "P13260"]}, {"id": "P13370", "text": ["In this section of the experiment we are going to look at a few of these signals to underscore the importance of their use in the       system.", "In this section of the experiment we are going to look at a few of these signals to underscore the importance of their use in the system."], "jumps": ["P13380", "P13360"]}, {"id": "P13380", "text": ["To look at the signals on the oscilloscope, we need to run a loop program to see the operation of the different signals."], "jumps": ["P13390", "P13360"]}, {"id": "P13390", "text": ["17.   Press the RESET button on the PC130-410 card. You will be          entering a program for execution by the 8086                                       microprocessor. The help button below will give you a                     summary on entering programs if you do not remember                   from the previous lesson.", "17. Press the RESET button on the PC130-410 card. You will be entering a program for execution by the 8086 microprocessor. The help button below will give you a summary on entering programs if you do not remember from the previous lesson."], "jumps": ["P13400", "P13360", "P13395"]}, {"id": "P13391", "text": ["17.   Press the RESET button on the PC130-410 card. You will be          entering a program for execution by the 8086                                       microprocessor. The help button below will give you a                     summary on entering programs if you do not remember                   from the previous lesson.", "17. Press the RESET button on the PC130-410 card. You will be entering a program for execution by the 8086 microprocessor. The help button below will give you a summary on entering programs if you do not remember from the previous lesson."], "jumps": ["P13400", "P13360", "P13395"]}, {"id": "P13395", "text": ["INSTRUCTIONS FOR ENTERING PROGRAMS: 1. Press EDIT on the PC130-404 Keyboard & Display experiment card and enter the desired SEGMENT or OFFSET. A SEGMENT such as 1000 may be entered as 1000:, 1000:0, or 1000:0000. An OFFSET such as 1000 may be entered as 1000, :1000, or 0000:1000. 2. Press ENTER after the desired SEGMENT or OFFSET has been entered. The display will now show the SEGMENT at the top of the display along with OFFSET and store OPCODE at the bottom of the display. NOTE: Every time you enter an OPCODE and press ENTER, you automatically move to the next OFFSET. Additionally, there are three things that can be done at any SEGMENT and OFFSET:Enter a new value and press ENTER, press the down arrow to move to the next OFFSET, or press the up arrow to move to the previous OFFSET. 3. Enter all of the desired OPCODES for the program remembering to press ENTER after each. 4. After all OPCODES of the program have been entered, press the STOP key. 5. The program has now been stored in memory. To verify the program has been stored correctly, press the DISPLAY R.M. key, enter the starting address of the program, and press ENTER. All OPCODES for that location, as well for the next 17 locations, will be displayed. up orders and checks automobile prior to delivery. Advertising and telephone marketing may be required at slow times. Environment - Clean well lighted showroom or outside on a lot. Evenings, days and weekends. Requirements - Must be able to maintain a pleasant attitude with people under stressful conditions. Good personal appearance and manners are important."], "jumps": []}, {"id": "P13400", "text": ["18.  Enter the following program starting at \"2000:0\".", "18. Enter the following program starting at \"2000:0\". IC TEXT)Address Opcode Mnemonic Description 2000:0000 B8 MOV AX,0Ah Moves the value 0Ah 2000:0001 00 into the AX register 2000:0002 0A 2000:0003 A3 MOV 2000:0100, AX Moves the value stored 2000:0004 00 in the AX register to 2000:0005 64 memory location 2000: 0000 and starts their. 2000:0006 EB JMP 2000:0000 2000:0007 F8", "Address Opcode Mnemonic Description 2000:0000 B8 MOV AX,0Ah Moves the value 0Ah 2000:0001 00 into the AX register. 2000:0002 0A 2000:0003 A3 MOV 2000:0100, AX Moves the value stored 2000:0004 00 in the AX register to 2000:0005 64 memory location 2000:0000 and starts there. 2000:0006 EB JMP 2000:0000 2000:0007 F8"], "jumps": ["P13410", "P13360"]}, {"id": "P13410", "text": ["19.   Run the program you just entered.  This is done by pressing         the RUN key and entering the starting address of the                        program: \"2000:0\".", "19. Run the program you just entered. This is done by pressing the RUN key and entering the starting address of the program: \"2000:0\"."], "jumps": ["P13420", "P13400"]}, {"id": "P13420", "text": ["The display of the 8086 should be frozen.  The program you ran is now in a continuous loop performing the same three functions over and over: moving the value 0A into the AX register, writing the value in AX to a memory location, and then returning back to the first instruction again.", "The display of the 8086 should be frozen. The program you ran is now in a continuous loop performing the same three functions over and over: moving the value 0A into the AX register, writing the value in AX to a memory location, and then returning back to the first instruction again."], "jumps": ["P13430", "P13410"]}, {"id": "P13430", "text": ["This process is repeated continuously to allow us to look at these signals.   Note that during normal operation, microprocessor signals are not periodic other than the clock signal.", "This process is repeated continuously to allow us to look at these signals. Note that during normal operation, microprocessor signals are not periodic other than the clock signal."], "jumps": ["P13440", "P13410"]}, {"id": "P13440", "text": ["Logic analyzers can be used to look at non-periodic wave forms. Many technicians run a short program that makes many microprocessor signals periodic so they can be tested using an oscilloscope."], "jumps": ["P13450", "P13410"]}, {"id": "P13450", "text": ["The next step requires fine tuning your oscilloscope.  The oscilloscope settings are ball park and may need adjusting to       recreate the waveforms as shown below.", "The next step requires fine tuning your oscilloscope. The oscilloscope settings are ball park and may need adjusting to recreate the waveforms as shown below."], "jumps": ["P13460", "P13410"]}, {"id": "P13460", "text": ["20.   Set your oscilloscope to 2mS, dual channel, 0.5 volts and DC          coupling.  Make sure you use x10 oscilloscope probes. This          will keep the oscilloscope from affecting the operation of the          system.", "20. Set your oscilloscope to 2mS, dual channel, 0.5 volts and DC coupling. Make sure you use x10 oscilloscope probes. This will keep the oscilloscope from affecting the operation of the system."], "jumps": ["P13470", "P13410"]}, {"id": "P13470", "text": ["21.   Connect CH1 of your oscilloscope to the RD signal on the               PC130-411 card.  Using the HOLD OFF control, adjust it very          slowly to get the RD signal similar to the one shown below.", "21. Connect CH1 of your oscilloscope to the RD signal on the PC130-411 card. Using the HOLD OFF control, adjust it very slowly to get the RD signal similar to the one shown below."], "jumps": ["P13480", "P13460"]}, {"id": "P13480", "text": ["From the waveforms below you can see what is happening inside the microprocessor during the execution of instructions within the loop.  The first low pulse of the RD line is reading in the first 16 bits of an instruction.", "From the waveforms below you can see what is happening inside the microprocessor during the execution of instructions within the loop. The first low pulse of the RD line is reading in the first 16 bits of an instruction."], "jumps": ["P13490", "P13460"]}, {"id": "P13490", "text": ["The first instruction indicates an additional byte needs to be read from memory.  The second low pulse of the RD line is reading the additional byte of information for that instruction.", "The first instruction indicates an additional byte needs to be read from memory. The second low pulse of the RD line is reading the additional byte of information for that instruction."], "jumps": ["P13500", "P13460"]}, {"id": "P13500", "text": ["Now the microprocessor performs the operation. In this case, it takes a very short amount of time.   Now the processor reads in the next instruction with the third, low pulse on the RD line.", "Now the microprocessor performs the operation. In this case, it takes a very short amount of time. Now the processor reads in the next instruction with the third, low pulse on the RD line."], "jumps": ["P13510", "P13460"]}, {"id": "P13510", "text": ["Again, this instruction requires an additional byte of data which the microprocessor reads.  This instruction is going to write information to RAM.   For this reason, the actual instruction execution stage takes longer.", "Again, this instruction requires an additional byte of data which the microprocessor reads. This instruction is going to write information to RAM. For this reason, the actual instruction execution stage takes longer."], "jumps": ["P13520", "P13460"]}, {"id": "P13520", "text": ["The first instruction moved data internally.  The second instruction takes internal data and sends it to external memory. This means that all the correct signals must be set for the external devices, which requires more time than a signal microprocessor cycle.", "The first instruction moved data internally. The second instruction takes internal data and sends it to external memory. This means that all the correct signals must be set for the external devices, which requires more time than a signal microprocessor cycle."], "jumps": ["P13530", "P13460"]}, {"id": "P13530", "text": ["After the data has been written (as seen by the WR pulse that goes low) the next instruction is read by the microprocessor. This is the jump instruction which does not require any additional bytes.  The microprocessor performs the jump and execution of the loop begins again.", "After the data has been written (as seen by the WR pulse that goes low) the next instruction is read by the microprocessor. This is the jump instruction which does not require any additional bytes. The microprocessor performs the jump and execution of the loop begins again."], "jumps": ["P13540", "P13460"]}, {"id": "P13540", "text": ["It is important to note that the smallest instruction of the 8086 is 16 bit.   However, there are longer instructions which contain\n16 bit values and an 8 bit instruction.   In these situations the instruction and part of the data is read into memory during the first read.", "It is important to note that the smallest instruction of the 8086 is 16 bit. However, there are longer instructions which contain 16 bit values and an 8 bit instruction. In these situations the instruction and part of the data is read into memory during the first read."], "jumps": ["P13550", "P13460"]}, {"id": "P13550", "text": ["22.   Leaving CH1 attached to the RD signal, use channel 2 and             verify each of the signals shown below.   Every time you                  connect to a new signal it may be necessary to adjust the               HOLD OFF control.", "22. Leaving CH1 attached to the RD signal, use channel 2 and verify each of the signals shown below. Every time you connect to a new signal it may be necessary to adjust the HOLD OFF control."], "jumps": ["P13560", "P13540"]}, {"id": "P13560", "text": ["Since we are not accessing any EPROM memory, CS1 and CS2 remain high which indicates they are not being used.  CS3 and CS4 are used all the way up until the write to memory.  This is because we are writing to the third bank of RAM.", "Since we are not accessing any EPROM memory, CS1 and CS2 remain high which indicates they are not being used. CS3 and CS4 are used all the way up until the write to memory. This is because we are writing to the third bank of RAM."], "jumps": ["P13570", "P13540"]}, {"id": "P13570", "text": ["Even if your set of 8086 cards does not have the third bank of RAM, the microprocessor has no way of knowing.   For this reason, it tries to write to the third bank.  This is why the CS5 and CS6 are low during the write.", "Even if your set of 8086 cards does not have the third bank of RAM, the microprocessor has no way of knowing. For this reason, it tries to write to the third bank. This is why the CS5 and CS6 are low during the write."], "jumps": ["P13580", "P13540"]}, {"id": "P13580", "text": ["The chip select signals CS1 through CS6 indicate that the particular chip is selected when the signal is low.  The IO/M signal is high all the time because no IO is being accessed during the loop.", "The chip select signals CS1 through CS6 indicate that the particular chip is selected when the signal is low. The IO/M signal is high all the time because no IO is being accessed during the loop."], "jumps": ["P13590", "P13540"]}, {"id": "P13590", "text": ["From this experiment you were able to observe the real time operation of the memory control signals.  Timing is important to make sure all operations are performed at the correct times.", "From this experiment you were able to observe the real time operation of the memory control signals. Timing is important to make sure all operations are performed at the correct times."], "jumps": ["P13600", "P13540"]}, {"id": "P13600", "text": ["In the next lesson you will perform a similar experiment looking at the IO circuitry connections and performance.   An important note about microprocessor operation is that memory and timing are required for the microprocessor to operate and perform actions.", "In the next lesson you will perform a similar experiment looking at the IO circuitry connections and performance. An important note about microprocessor operation is that memory and timing are required for the microprocessor to operate and perform actions."], "jumps": ["P13610", "P13540"]}, {"id": "P13610", "text": ["IO is not necessary, but gives the microprocessor an interface to the real world.  This lesson described the necessary circuitry and signals that are required in every microprocessor system using the 8086.", "IO is not necessary, but gives the microprocessor an interface to the real world. This lesson described the necessary circuitry and signals that are required in every microprocessor system using the 8086."], "jumps": ["P13540"]}, {"id": "P13630", "text": ["1.  Set the Console Power Switch to OFF.", "1. Set the Console Power Switch to OFF..F................................."], "jumps": []}, {"id": "P13640", "text": ["2.  Disconnect the equipment and return to the designated area.", "2. Disconnect the equipment and return to the designated area.."], "jumps": ["P13910", "P13630"]}, {"id": "P13910", "text": ["This completes the experiment on 8086 MICROPROCESSOR.", "This completes the experiment on 8086 MICROPROCESSOR......."], "jumps": ["P2001", "P13640"]}, {"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-10-99 Converted to Toolbook. frieda 08-11-99 Completed Text and Branching. frieda 08-13-99 Completed inserting Graphics. patrick 08-17-99 Test and review. debbie 08-18-99 Completed comments from debbie. patrick 08-23-99 Changed 404 card and reviewed. debbie 11-16-99 Changed comments from steve. debbie 11-18-99 Changed comments from steve. ben 01-12-00 P1180 \"ship\" to \"chip\ function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
</body>
