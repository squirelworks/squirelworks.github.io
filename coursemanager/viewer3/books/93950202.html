 (7-2=5)."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The answers can eventually be found using a trial and error method."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["Algebra uses a systematic method to solve for X and Y.", "1. X + 2 = 5 2. X + 2 - 2 = 5 - 2 3. X = 3 3 + 2 = 5", "1. Y - 2 = 5 2. Y - 2 + 2 = 5 + 2 3. Y = 7"], "jumps": ["P1020"]}, {"id": "P1070", "text": ["Once you have learned this method you can solve complex problems.", "1. 7X - 5 X + 1 2. (X + 1)(7X - 5) X + 1", "4. 7X - 5X = 5X - 5X + 10 5. 2X 10 2 2 6. X = 5555 2 2 6. X = 5", "3. 7X - 5 + 5 = 5X + 5 + 5 4. 7X - 5X = 5X - 5X + 10 5. 2X 10 2 2 6. X = 5"], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["Let's start with solving the linear equation X + A = B.", "Let's start with solving the linear equation X + A = B....."], "jumps": ["P1090", "P1020"]}, {"id": "P1090", "text": ["The equation X + 2 = 5 means that the expression on the left\n (X + 2) is the same or equal to the expression on the right (5).", "The equation X + 2 = 5 means that the expression on the left (X + 2) is the same or equal to the expression on the right (5)."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["The idea is to isolate the variable. This means placing X by itself on one side of the equation and all other constants on the other side."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["We isolate X by cancelling the 2 from one side of the equation and placing it on the other side without changing the equality of the equation."], "jumps": ["P1120", "P1080"]}, {"id": "P1120", "text": ["This is done by using the Subtraction Law."], "jumps": ["P1130", "P1080"]}, {"id": "P1130", "text": ["The Subtraction Law states that a real number can be subtracted from BOTH sides of an equation without changing the equality of the equation.", "X + A - A = B - A 3. X - 3 3. X - 3 3 + 2 = 5"], "jumps": ["P1140", "P1080"]}, {"id": "P1140", "text": ["Subtract 2 from both sides of this equation to isolate the variable (X).", "1. X + 2 = 5 2. X + 2 - 2 = 5 - 2 3. X - 3 3 + 2 = 5"], "jumps": ["P1150", "P1080"]}, {"id": "P1150", "text": ["Combining terms shows that X is equal to 3.", "1. X + 2 = 5 2. X + 2 - 2 = 5 - 2 3. X = 3 3 + 2 = 5"], "jumps": ["P1170", "P1080"]}, {"id": "P1170", "text": ["X + 5 = 2 and X + 4 = 1 are called equivalent equations.", "X + 5 = 2 and X + 4 = 1 are called equivalent equations...."], "jumps": ["P1180", "P1080"]}, {"id": "P1180", "text": ["When solving for X, both equations give the same answer", "X + 5 = 2 X + 5 - 5 = 2 - 5 X = - 3 3 + 2 = 5", "X + 4 = 1 X + 4 - 4 = 1 - 4 X = - 3 3 + 2 = 5"], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["It is not uncommon for the variable to have a negative value.", "X + 5 = 2 X + 5 - 5 = 2 - 5 X = - 3 3 + 2 = 5", "X + 4 = 1 X + 4 - 4 = 1 - 4 X = - 3 3 + 2 = 5"], "jumps": ["P1210", "P1170"]}, {"id": "P1210", "text": ["Use the Subtraction Law and solve for Z.", "Use the Subtraction Law and solve for Z...................."], "jumps": ["P1170"]}, {"id": "P1211", "text": [], "jumps": []}, {"id": "P1212", "text": ["To get Z = 28 you added 10 to each side of the equation. To solve for Z you must subtract 10.", "To get Z = 28 you added 10 to each side of the equation. To solve for Z you must subtract 10. 10."], "jumps": []}, {"id": "P1213", "text": ["To get 18 - Z you subtracted Z from each side of the equation. To solve for Z you must subtract 10."], "jumps": []}, {"id": "P1220", "text": ["Solve for W in this equation.", "Solve for W in this equation. 12 + W = 10.................."], "jumps": []}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1222", "text": ["In this equation the constant and the variable are reversed (recall the commutative property, A + B = B + A). You must subtract the constant from each side of this equation.", "In this equation the constant and the variable are reversed (recall the commutative property, A + B = B + A). You must subtract the constant from each side of this equation.rty, A+B=B+A).You must subtract the constant from each side of this equation."], "jumps": []}, {"id": "P1230", "text": ["There are no constants in this equation, but the methods to solve for X are the same.", "There are no constants in this equation, but the methods to solve for X are the same...", "1. X + Y = Z 2. X + Y - Y = Z - Y 3. X = Z - Y + 2 = 5"], "jumps": ["P1220"]}, {"id": "P1240", "text": ["You can also solve for Y.", "1. X + Y = Z 2. X - X + Y = Z - X 3. Y = Z - X + 2 = 5"], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["The Addition Law uses a similar method to solve X - A = B.", "The Addition Law uses a similar method to solve X - A = B. - 2 = 555"], "jumps": ["P1270", "P1230"]}, {"id": "P1270", "text": ["First isolate the variable X on one side of the equation and the constants on the other side."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["To isolate X, the 2 must be cancelled from one side of the equation, and placed on the other side without changing the equality of the equation."], "jumps": ["P1300", "P1260"]}, {"id": "P1300", "text": ["The Addition Law states that you can add a real number to BOTH sides of an equation without changing the equation.", "X - A + A = B + A 3. X - 3 3. X - 3 3 + 2 = 5"], "jumps": ["P1310", "P1260"]}, {"id": "P1310", "text": ["Notice, 2 is added to both sides of the equation. Since -2 + 2 = 0 the variable (X) is isolated.", "1. X - 2 = 5 2. X - 2 + 2 = 5 + 2 3. X - 3 3 + 2 = 5"], "jumps": ["P1320", "P1260"]}, {"id": "P1320", "text": ["Combining terms shows that X equals 7.", "1. X - 2 = 5 2. X - 2 + 2 = 5 + 2 3. X = 7 3 + 2 = 5"], "jumps": ["P1340", "P1260"]}, {"id": "P1340", "text": ["When using the Addition Law it is possible to have a negative value for the variable.", "1. Z - 4 = -6 2. Z - 4 + 4 = -6 + 4 3. Z + 0 = -2 4. Z = -2"], "jumps": ["P1350", "P1260"]}, {"id": "P1350", "text": ["Use the Addition Law and solve for X.", "Use the Addition Law and solve for X. X= let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
