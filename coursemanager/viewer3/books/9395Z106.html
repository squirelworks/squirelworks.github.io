od Door Cockpit Door Fuse Station Center Lights Emergency Exits Aft Gallery Door Food Gallery Door"], "jumps": ["P4960", "P4940"]}, {"id": "P4999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P4001", "P4960"]}, {"id": "P4920", "text": ["1.  The interior lighting system is divided into six sections:", "1. The interior lighting system is divided into six sections: (GRAPHIC TEXT) 1. Cockpit Lighting 2. Panels, Consoles and Instruments 3. Cabin Lighting 4. Equipment and area lighting for passengers and crew 5. Cabin Signs", "1. Cockpit Lighting 2. Panels, Consoles and Instruments 3. Cabin Lighting 4. Equipment and area lighting for passengers and crew 5. Cabin Signs"], "jumps": ["P4930", "P4001"]}, {"id": "P4450", "text": ["As you can see the supporting systems are a vital part of the aircraft.  The loss of any of the systems would be a major disaster in the making.", "As you can see the supporting systems are a vital part of the aircraft.  The loss of any of the systems would be a major disaster in the making.", "As you can see the supporting systems are a vital part of the aircraft. The loss of any of the systems would be a major disaster in the making."], "jumps": ["P4910", "P4360"]}, {"id": "P4910", "text": ["This completes the information on LIGHTING SYSTEMS.", "This completes the information on LIGHTING SYSTEMS........."], "jumps": ["P4001", "P4360"]}, {"id": "P4420", "text": ["Turn-off lights are mounted in the leading edge of the wing at the wing root.  Pointed outward, they show the pilot what is in front of  the aircraft's wings during taxing.", "Turn-off lights are mounted in the leading edge of the wing at the wing root. Pointed outward, they show the pilot what is in front of the aircraft's wings during taxing."], "jumps": ["P4430", "P4360"]}, {"id": "P4400", "text": ["Private and charter operation not carrying passengers are required to have at least one landing light installed.  While the commercial aircraft have one landing light installed on each wing (two lights).", "Private and charter operation not carrying passengers are required to have at least one landing light installed. While the commercial aircraft have one landing light installed on each wing (two lights)."], "jumps": ["P4410", "P4360"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P4390", "text": ["The landing lights illuminate the runway during night time landings.  They perform as headlight do on an automobile.", "The landing lights illuminate the runway during night time landings. They perform as headlight do on an automobile."], "jumps": ["P4400", "P4360"]}, {"id": "P4340", "text": ["If you saw a green light on the left and a red light on the right, it would indicate the aircraft is heading towards you."], "jumps": ["P4350", "P4300"]}, {"id": "P4330", "text": ["The lights are arranged so that another aircraft can see the lights and determine what direction the aircraft is going.", "The two tail lights are white and covers the remaining angle of 140 degrees."], "jumps": ["P4340", "P4300"]}, {"id": "P4300", "text": ["All aircraft that fly at night are fitted with navigation lights.  The lights are visible for at least 8 kilometers and cover an angle of 360 degrees.", "All aircraft that fly at night are fitted with navigation lights. The lights are visible for at least 8 kilometers and cover an angle of 360 degrees."], "jumps": ["P4310", "P4290"]}, {"id": "P4350", "text": ["If the green is on the right and a white light on the left means the aircraft is moving to your right."], "jumps": ["P4360", "P4340"]}, {"id": "P4284", "text": ["All emergency exits must be illuminated and have a back up power not connected to the main lighting system.", "Aft Door Food Door Cockpit Door Fuse Station Center Lights Emergency Exits Aft Gallery Door Food Gallery Door"], "jumps": []}, {"id": "P4282", "text": ["Red lights allow for vision in the cockpit with no effect on the pilots night vision."], "jumps": []}, {"id": "P4280", "text": ["What does the Civil Aviation Orders make mandatory for all aircraft?"], "jumps": ["P4270"]}, {"id": "P4320", "text": ["The two tail lights are white and covers the remaining angle of 140 degrees."], "jumps": ["P4330", "P4300"]}, {"id": "P4283", "text": ["Low intensity aisle lights are used to light the aisle of the cabin during night flights."], "jumps": []}, {"id": "P4310", "text": ["The wing tips are marked with a red light for the left wing (port side) and a green light for the right wing (starboard side).  The      wing tip lights cover an angle of 110 degrees.", "The wing tips are marked with a red light for the left wing (port side) and a green light for the right wing (starboard side). The wing tip lights cover an angle of 110 degrees."], "jumps": ["P4320", "P4300"]}, {"id": "P4370", "text": ["The collision avoidance lights are used to help catch the attention of other aircraft and to indicate the engines have been started while on the ground."], "jumps": ["P4380", "P4360"]}, {"id": "P4380", "text": ["A strobe light may be installed on the wing tip or on the tail to assist in the all around visibility and aid in the collision avoidance."], "jumps": ["P4390", "P4360"]}, {"id": "P4272", "text": ["The cabin walls and ceiling are colored pastel to aid the reflection of light evenly."], "jumps": []}, {"id": "P4271", "text": [], "jumps": []}, {"id": "P4281", "text": [], "jumps": []}, {"id": "P4290", "text": ["Exterior lighting system is divided into five sections:", "Exterior lighting system is divided into five sections:GRAPHIC TEXT) 1. Navigation 2. Landing Lights 3. Wing Inspection 4. Entrance and Service Lights 5. Special Lights", "1. Navigation 2. Landing Lights 3. Wing Inspection 4. Entrance and Service Lights 5. Special Lights"], "jumps": ["P4300", "P4280"]}, {"id": "P4230", "text": ["Emergency lighting is essential to enable the crew to operate under abnormal conditions. Also ensures that the passengers are not placed under undue stress during abnormal conditions.", "Aft Door Food Door Cockpit Door Fuse Station Center Lights Emergency Exits Aft Gallery Door Food Gallery Door"], "jumps": ["P4240", "P4220"]}, {"id": "P4240", "text": ["In order for aircraft to meet the Civil Aviation requirements, all emergency exits must have a source of light independent of the main lighting system."], "jumps": ["P4250", "P4230"]}, {"id": "P4250", "text": ["Emergency equipment spaces and cabin must be illuminated to effectively exit or conduct emergency repairs.  The illumination     could be dim and barely able to see.", "For convenience of the passengers, a low intensity spot light is installed at each seat.  Allowing the individual to be able to read    during a night flight.", "Emergency equipment spaces and cabin must be illuminated to effectively exit or conduct emergency repairs. The illumination could be dim and barely able to see.", "For convenience of the passengers, a low intensity spot light is installed at each seat. Allowing the individual to be able to read during a night flight."], "jumps": ["P4260", "P4230"]}, {"id": "P4440", "text": ["A wing light is used to illuminate the wing for in flight inspection of ice conditions.  Mounted in the fuselage and pointed at the wing tip.", "A wing light is used to illuminate the wing for in flight inspection of ice conditions. Mounted in the fuselage and pointed at the wing tip."], "jumps": ["P4450", "P4360"]}, {"id": "P4910", "text": ["This completes the information on LIGHTING SYSTEMS.", "This completes the information on LIGHTING SYSTEMS........."], "jumps": ["P4001", "P4360"]}, {"id": "P4274", "text": ["Red lights allow for vision in the cockpit with no effect on the pilots night vision."], "jumps": []}, {"id": "P4390", "text": ["The landing lights illuminate the runway during night time landings.  They perform as headlight do on an automobile.", "The landing lights illuminate the runway during night time landings. They perform as headlight do on an automobile."], "jumps": ["P4400", "P4360"]}, {"id": "P4410", "text": ["Retractable landing lights are used on higher speed aircraft, because of the ability to protect from ice formation and blocking   the light.", "Retractable landing lights are used on higher speed aircraft, because of the ability to protect from ice formation and blocking the light."], "jumps": ["P4420", "P4360"]}, {"id": "P4430", "text": ["Both the landing lights and the turn-off lights are high intensity lights and are designed for the aircraft to be moving.  If the aircraft is standing still, the lights overheat after approximately \n5 min.", "Both the landing lights and the turn-off lights are high intensity lights and are designed for the aircraft to be moving. If the aircraft is standing still, the lights overheat after approximately 5 min."], "jumps": ["P4440", "P4360"]}, {"id": "P4150", "text": ["The external light is normally of the post or hood type.  The post type is a post fitted with a small lamp and a direction hood.  The    hood is used to direct a small amount of light onto the instrument's face.", "The external light is normally of the post or hood type. The post type is a post fitted with a small lamp and a direction hood. The hood is used to direct a small amount of light onto the instrument's face."], "jumps": ["P4130"]}, {"id": "P4160", "text": ["The hood type is a half circular shaped bar fitted with two small hooded lamps.  The two lamps are directed to shine across the     instrument's face.", "The hood type is a half circular shaped bar fitted with two small hooded lamps. The two lamps are directed to shine across the instrument's face."], "jumps": ["P4150"]}, {"id": "P4200", "text": ["For convenience of the passengers, a low intensity spot light is installed at each seat.  Allowing the individual to be able to read    during a night flight.", "For convenience of the passengers, a low intensity spot light is installed at each seat. Allowing the individual to be able to read during a night flight."], "jumps": ["P4210", "P4180"]}, {"id": "P4220", "text": ["From the cockpit the captain uses information lights (cabin signs) to inform the passengers of the current flight condition       requirements, such as Fasten Seat Belts and No Smoking.", "From the cockpit the captain uses information lights (cabin signs) to inform the passengers of the current flight condition requirements, such as Fasten Seat Belts and No Smoking."], "jumps": ["P4230", "P4210"]}, {"id": "P4110", "text": ["Control panels are also illuminated by small lamps inside the panel.  The panel is made of white plastic with a flat black or gray thin sheet overlaying.", "Control panels are also illuminated by small lamps inside the panel. The panel is made of white plastic with a flat black or gray thin sheet overlaying.", "White Plastic ( transmits filtered Light and reflects day or white light )"], "jumps": ["P4100"]}, {"id": "P4130", "text": ["Instruments may be illuminated with an internal lighting or an external to the panel type lighting.  The internal type is a plastic    ring fitted with a small lamp mounted around the instrument.", "The color of the panels are flat black, light gray or light blue so as not to reflect light.", "Instruments may be illuminated with an internal lighting or an external to the panel type lighting. The internal type is a plastic ring fitted with a small lamp mounted around the instrument."], "jumps": ["P4120"]}, {"id": "P4090", "text": ["Panels are provided with a flood light from overhead or under a glare shield.  The glare shield directs the light towards the panel   while protecting pilot from direct glare.", "Most pilots use dim white flood lights, because of the reduced ability to see red warning indicators under the red flood lights.", "Panels are provided with a flood light from overhead or under a glare shield. The glare shield directs the light towards the panel while protecting pilot from direct glare."], "jumps": ["P4050"]}, {"id": "P4070", "text": ["Normally the two colors of light are white and red.  The red aids in allowing the crew to see inside the cockpit at night without        affecting the pilots night vision.", "Intensity controlled flood lights provide the main lighting in the cockpit area.  The flood lights are able to switch between two colors of light.", "Normally the two colors of light are white and red. The red aids in allowing the crew to see inside the cockpit at night without affecting the pilots night vision.", "Intensity controlled flood lights provide the main lighting in the cockpit area. The flood lights are able to switch between two colors of light."], "jumps": ["P4050"]}, {"id": "P4050", "text": ["The cockpit has various lights required for crew members to perform their duties and may include the individual lighted instruments, control consoles and flood lights.", "The interior lighting system is divided into six sections:", "The interior lighting system is divided into six sections: RAPHIC TEXT) 1. Cockpit Lighting 2. Panels, Consoles and Instruments 3. Cabin Lighting 4. Equipment and area lighting for passengers and crew 5. Cabin Signs", "1. Cockpit Lighting 2. Panels, Consoles and Instruments 3. Cabin Lighting 4. Equipment and area lighting for passengers and crew 5. Cabin Signs 6. Emergency and Emergency exit lighting"], "jumps": ["P4040", "P4020"]}, {"id": "P4050", "text": ["The cockpit has various lights required for crew members to perform their duties and may include the individual lighted instruments, control consoles and flood lights."], "jumps": ["P4040"]}, {"id": "P3999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P3001", "P3970"]}, {"id": "P4090", "text": ["Panels are provided with a flood light from overhead or under a glare fore it has time to spread.            Glaze (smooth surface ice) is formed when the air temperature      is just slightly below freezing and the water has more time to         spread before freezing.", "The interior lighting system is divided into six sections: RAPHIC TEXT) 1. Cockpit Lighting 2. Panels, Consoles and Instruments 3. Cabin Lighting 4. Equipment and area lighting for passengers and crew 5. Cabin Signs", "1. Cockpit Lighting 2. Panels, Consoles and Instruments 3. Cabin Lighting 4. Equipment and area lighting for passengers and crew 5. Cabin Signs 6. Emergency and Emergency exit lighting", "2. Rime (rough surface ice) is formed when the air temperature is very low and the water freezes before it has time to spread. Glaze (smooth surface ice) is formed when the air temperature is just slightly below freezing and the water has more time to spread before freezing."], "jumps": ["P4020", "P3940", "P3920"]}, {"id": "P3940", "text": ["3.  The hot air system uses heated air channeled through the              controlling surfaces and wings.  The use of engine exhaust or       a special combustion heater is used to heat the air flow                    through the controlling surfaces.", "3. The hot air system uses heated air channeled through the controlling surfaces and wings. The use of engine exhaust or a special combustion heater is used to heat the air flow through the controlling surfaces."], "jumps": ["P3950", "P3930"]}, {"id": "P3950", "text": ["4.  Another type of heat source, is the combustion heater.                     Located in the wing area, the combustion heater is a fuel                 burning type of heat exchanger.", "4. Another type of heat source, is the combustion heater. Located in the wing area, the combustion heater is a fuel burning type of heat exchanger."], "jumps": ["P3960", "P3940"]}, {"id": "P4030", "text": ["Depending where the lights are located and their function, determines if they are classified as interior or exterior lighting."], "jumps": ["P4020"]}, {"id": "P3910", "text": ["This completes the information on DE-ICING SYSTEMS.", "Pneumatic system uses rubber boots to remove ice from the controlling surfaces.", "This completes the information on DE-ICING SYSTEMS........."], "jumps": ["P3001", "P3380"]}, {"id": "P3920", "text": ["1.  The pneumatic de-icing system uses inflatable rubber boots           to  break up formation of ice by creating a ripple in the leading       edge.", "1. The pneumatic de-icing system uses inflatable rubber boots to break up formation of ice by creating a ripple in the leading edge."], "jumps": ["P3930", "P3001"]}, {"id": "P3381", "text": [], "jumps": []}, {"id": "P4070", "text": ["Normally the two colors of light are white and red.  The red aids in allowing the crew to see inside the cockpit at night without        affecting the pilots night vision.", "This completes the information on DE-ICING SYSTEMS.", "Normally the two colors of light are white and red. The red aids in allowing the crew to see inside the cockpit at night without affecting the pilots night vision.", "This completes the information on DE-ICING SYSTEMS........."], "jumps": ["P4050"]}, {"id": "P3370", "text": ["A solenoid valve is used to isolate the system when the alcohol pumps are turned off to prevent loss of unused alcohol.", "A steady supply of alcohol is fed to the carburetors while the rate of alcohol flow to the windshield is varied by the pilots rheostat control."], "jumps": ["P3380", "P3340"]}, {"id": "P3340", "text": ["Spraying the windshield with alcohol is another method to prevent ice forming and blocking the pilots view.  The temperature that alcohol freezes is much lower than the aircraft will ever encounter.", "Spraying the windshield with alcohol is another method to prevent ice forming and blocking the pilots view. The temperature that alcohol freezes is much lower than the aircraft will ever encounter."], "jumps": ["P3350", "P3320"]}, {"id": "P3380", "text": ["What uses a heating element made of stannic oxide to remove ice and fog from the windshield of an aircraft?"], "jumps": ["P3340"]}, {"id": "P3310", "text": ["When the element has an electrical charge applied the windshield begins to warm and melts the ice and clear the fog from the pilots view."], "jumps": ["P3320", "P3300"]}, {"id": "P3350", "text": ["A small amount of alcohol is also sprayed in the venturi of the engine's carburetor.  This prevents the fuel from freezing before   entering the engine's combustion cylinders.", "A small amount of alcohol is also sprayed in the venturi of the engine's carburetor. This prevents the fuel from freezing before entering the engine's combustion cylinders."], "jumps": ["P3360", "P3340"]}, {"id": "P3293", "text": ["The pneumatic system uses air pressure to expand rubber boots at the control surfaces leading edges."], "jumps": []}, {"id": "P3383", "text": ["Pneumatic system uses rubber boots to remove ice from the controlling surfaces."], "jumps": []}, {"id": "P3291", "text": [], "jumps": []}, {"id": "P3292", "text": ["Engine exhaust system and combustion heater system are hot air systems."], "jumps": []}, {"id": "P4030", "text": ["Depending where the lights are located and their function, determines if they are classified as interior or exterior lighting."], "jumps": ["P4020"]}, {"id": "P3282", "text": ["Engine exhaust system uses engine heat to melt ice off the controlling surfaces."], "jumps": []}, {"id": "P3290", "text": ["Which system is considered a hot air system?", "Which system is considered a hot air system?...............", "Both Engine Exhaust System and Combustion Chamber Systemm"], "jumps": ["P3280"]}, {"id": "P3330", "text": ["The electrical circuitry containing transformers and control relays maintains the windshield temperature between 105\u00baF and 120\u00baF.", "The electrical circuitry containing transformers and control relays maintains the windshield temperature between 105"], "jumps": ["P3340", "P3320"]}, {"id": "P3250", "text": ["Thermostatic switches prevent the system from over heating and regulate the air temperature to the controlling surfaces."], "jumps": ["P3260", "P3220"]}, {"id": "P3280", "text": ["What de-icing system uses a flexible rubber boot at the aircraft leading edges to brake ice away?"], "jumps": ["P3220"]}, {"id": "P3360", "text": ["A steady supply of alcohol is fed to the carburetors while the rate of alcohol flow to the windshield is varied by the pilots rheostat control."], "jumps": ["P3370", "P3340"]}, {"id": "P3230", "text": ["A nozzle is used to mix the combustion air supply and fuel for ignition.  An electrode is located in the combustion chamber to     initially ignite the fuel during heater start up.", "A nozzle is used to mix the combustion air supply and fuel for ignition. An electrode is located in the combustion chamber to initially ignite the fuel during heater start up."], "jumps": ["P3240", "P3220"]}, {"id": "P3240", "text": ["Outside air enters the system and flows around the outside of the combustion chamber and absorbs the heat generated from the burning fuel."], "jumps": ["P3250", "P3220"]}, {"id": "P3210", "text": ["Another type of heat source, is the combustion heater.  Located in the wing area, the combustion heater is a fuel burning type of heat exchanger.", "Another type of heat source, is the combustion heater. Located in the wing area, the combustion heater is a fuel burning type of heat exchanger."], "jumps": ["P3220", "P3160"]}, {"id": "P3220", "text": ["Fuel from the aircrafts fuel tanks, is fed to the solenoid supply valve.  The solenoid supply valve is used to stop the flow of fuel   when the heater is cycled off for temperature control or to turn off  the system.", "Fuel from the aircrafts fuel tanks, is fed to the solenoid supply valve. The solenoid supply valve is used to stop the flow of fuel when the heater is cycled off for temperature control or to turn off the system."], "jumps": ["P3230", "P3210"]}, {"id": "P3260", "text": ["When the air temperature reaches the upper limits the thermostatic switches shut the solenoid valve.  Stopping the fuel supply to the combustion chamber.", "When the air temperature reaches the upper limits the thermostatic switches shut the solenoid valve. Stopping the fuel supply to the combustion chamber."], "jumps": ["P3270", "P3220"]}, {"id": "P3150", "text": ["Hot air system is also used to supply heat to cabin for comfort of the passengers and crew."], "jumps": ["P3160", "P3130"]}, {"id": "P3180", "text": ["An electrically operated heat source valve is used to control the air flow from the augmentor to the controlling surfaces."], "jumps": ["P3190", "P3160"]}, {"id": "P3130", "text": ["The hot air system uses heated air channeled through the controlling surfaces and wings."], "jumps": ["P3090"]}, {"id": "P3200", "text": ["If the system over heats a warning bell or buzzer is energized to alert the pilot of the condition.  In case the thermostat circuitry    fails the pilot can manually operate the heat source valves.", "If the system over heats a warning bell or buzzer is energized to alert the pilot of the condition. In case the thermostat circuitry fails the pilot can manually operate the heat source valves."], "jumps": ["P3210", "P3160"]}, {"id": "P3281", "text": [], "jumps": []}, {"id": "P3100", "text": ["An engine driven air pump supplies the air pressure needed to inflate the boots.  The air pump also takes a suction on the deflating boots to aid in drawing the boots tight against the wings.", "An engine driven air pump supplies the air pressure needed to inflate the boots. The air pump also takes a suction on the deflating boots to aid in drawing the boots tight against the wings."], "jumps": ["P3090"]}, {"id": "P3110", "text": ["The combination valve maintains system pressure during de-icing operations and vents the air pump to the atmosphere when the de-icing system is not in use."], "jumps": ["P3090"]}, {"id": "P3200", "text": ["If the system over heats a warning bell or buzzer is energized to alert the pilot of the condition.  In case the thermostat circuitry    fails the pilot can manually operate the heat source valves.", "If the system over heats a warning bell or buzzer is energized to alert the pilot of the condition. In case the thermostat circuitry fails the pilot can manually operate the heat source valves."], "jumps": ["P3210", "P3160"]}, {"id": "P3080", "text": ["The system is composed of a series of inflatable boots that are inflated and deflated in alternating cycle that brakes the ice and    allows the air stream to carry it off.", "The system is composed of a series of inflatable boots that are inflated and deflated in alternating cycle that brakes the ice and allows the air stream to carry it off."], "jumps": ["P3070"]}, {"id": "P3180", "text": ["An electrically operated heat source valve is used to control the air flow from the augmentor to the controlling surfaces."], "jumps": ["P3190", "P3160"]}, {"id": "P3060", "text": ["Ice formation starts on the leading edges of the wings, stabilizers, control surfaces and propeller blades.", "There are four different methods used to control ice formation on today's aircraft.", "There are four different methods used to control ice formation on today's aircraft. (GRAPHIC TEXT) Hot Air System Electrical Elements System Pneumatic De-Icing System Alcohol Spray System", "Hot Air System Electrical Elements System Pneumatic De-Icing System Alcohol Spray System"], "jumps": ["P3050", "P3020"]}, {"id": "P3040", "text": ["Glaze (smooth surface ice) is formed when the air temperature is just slightly below freezing and the water has more time to spread before freezing.", "The largest concern of the pilots is the weather, particularly with icy conditions.  Ice causes false instrument readings, jams flight   controls and weighs the aircraft down.", "Glaze (smooth surface ice) is formed when the air temperature is just slightly below freezing and the water has more time to spread before freezing....", "The largest concern of the pilots is the weather, particularly with icy conditions. Ice causes false instrument readings, jams flight controls and weighs the aircraft down."], "jumps": ["P3020", "P3030", "P3001"]}, {"id": "P101", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "w Describe the basic operating principles of the de-icing systems.", "w Identify and describe the basic types of aircraft lighting systems.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": []}, {"id": "P2970", "text": ["6.  The brake assembly of a large aircraft is normally a                            segmented type assembly.", "5.  Unlike the independent system, the power brake control                 receives hydraulic fluid from the aircraft main hydraulic                    system.", "6. The brake assembly of a large aircraft is normally a segmented type assembly.", "5. Unlike the independent system, the power brake control receives hydraulic fluid from the aircraft main hydraulic system."], "jumps": ["P2999", "P2950"]}, {"id": "P2950", "text": ["4.  Power braking system is used on aircraft requiring large                 volume of hydraulic fluid to operate the brake assemblies.              This applies to the larger aircraft.", "4. Power braking system is used on aircraft requiring large volume of hydraulic fluid to operate the brake assemblies. This applies to the larger aircraft."], "jumps": ["P2960", "P2940"]}, {"id": "P2960", "text": ["5.  Unlike the independent system, the power brake control                 receives hydraulic fluid from the aircraft main hydraulic                    system.", "5. Unlike the independent system, the power brake control receives hydraulic fluid from the aircraft main hydraulic system."], "jumps": ["P2970", "P2950"]}, {"id": "P430", "text": ["Let's begin the lesson on AIRCRAFT SUPPORT SYSTEMS........................"], "jumps": ["P400"]}, {"id": "P2940", "text": ["3.  The single disk type brake assembly is mounted on the axle           with the wheel.  The disk and wheel become one unit and                rotate together.  Stopping the rotation of the disk also stops           the wheel rotation.", "3. The single disk type brake assembly is mounted on the axle with the wheel. The disk and wheel become one unit and rotate together. Stopping the rotation of the disk also stops the wheel rotation."], "jumps": ["P2950", "P2920"]}, {"id": "P2999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2970"]}, {"id": "P3030", "text": ["Rime and glaze are the two types of ice formed during flight. Rime (rough surface ice) is formed when the air temperature is very low and the water freezes before it has time to spread.", "This completes the information on AIRCRAFT BRAKING SYSTEM.", "This completes the information on AIRCRAFT BRAKING SYSTEM...."], "jumps": ["P3020"]}, {"id": "P2520", "text": ["The tires provide a cushion of air that helps absorb the shock of landing and takeoffs.  They also provide the traction needed for    braking and stopping the aircraft.", "The tires provide a cushion of air that helps absorb the shock of landing and takeoffs. They also provide the traction needed for braking and stopping the aircraft."], "jumps": ["P2530", "P2500"]}, {"id": "P2500", "text": ["When hydraulic fluid pressure is applied, the piston ring compresses the three lining disks and rotor assembly disks against the backing plate."], "jumps": ["P2510", "P2480"]}, {"id": "P2920", "text": ["1.  The independent braking system is a hydraulic operated                 system.  However, the hydraulic system is independent to the       aircraft hydraulic system.", "1. The independent braking system is a hydraulic operated system. However, the hydraulic system is independent to the aircraft hydraulic system."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2.  On the independent braking system, each main gear is                    equipped with a brake pedal, master cylinder and a brake                assembly.  The nose gear of the aircraft is not fitted with a               brake system.", "2. On the independent braking system, each main gear is equipped with a brake pedal, master cylinder and a brake assembly. The nose gear of the aircraft is not fitted with a brake system."], "jumps": ["P2940", "P2920"]}, {"id": "P2470", "text": ["Brake Assembly: The brake assembly of a large aircraft is normally a segmented type assembly.", "Brake Assembly: The brake assembly of a large aircraft is normally a segmented type assembly. )"], "jumps": ["P2480", "P2450"]}, {"id": "P2480", "text": ["The brake housing is connected to the shock strut and has a piston ring for applying pressure on the rotor assembly (disks)."], "jumps": ["P2490", "P2470"]}, {"id": "P3050", "text": ["There are four different methods used to control ice formation on today's aircraft.", "There are four different methods used to control ice formation on today's aircraft. (GRAPHIC TEXT) Hot Air System Electrical Elements System Pneumatic De-Icing System Alcohol Spray System", "Hot Air System Electrical Elements System Pneumatic De-Icing System Alcohol Spray System"], "jumps": ["P3020"]}, {"id": "P3270", "text": ["As temperature reaches the lower temperature settings, the thermostatic switches open the solenoid valve to supply fuel to the combustion chamber and ignite the fuel with the electrode."], "jumps": ["P3280", "P3220"]}, {"id": "P2420", "text": ["As the spool is repositioned in the valve body, the hydraulic supply line is lined up with the brake line.  Moving the spool more to the left allows more fluid to flow and increases brake pressure.", "As the spool is repositioned in the valve body, the hydraulic supply line is lined up with the brake line. Moving the spool more to the left allows more fluid to flow and increases brake pressure."], "jumps": ["P2430", "P2410"]}, {"id": "P2460", "text": ["Hydraulic fluid from the system in operation is directed to the end of the spool to reposition the line up with that corresponding system."], "jumps": ["P2470", "P2450"]}, {"id": "P2490", "text": ["A brake lining disk is installed between each of the three brake disks.  The backing plate is bolted through the three lining disks to the brake housing.", "A brake lining disk is installed between each of the three brake disks. The backing plate is bolted through the three lining disks to the brake housing."], "jumps": ["P2500", "P2480"]}, {"id": "P2510", "text": ["Because the rotor assembly is keyed to the wheels and the lining disks are bolted to the brake housing, the rotor assembly disks feel resistance and slow or stop."], "jumps": ["P2520", "P2500"]}, {"id": "P2430", "text": ["A spring is used to aid the plunger in repositioning the spool and holding that position until the pilot releases the pedal.", "The power brake control system controls each side of the aircraft separately to aid in steering.  This is accomplished by the two sets of brake valves.", "A hydraulic brake accumulator is used to dampen any surges and provide a reserve supply of fluid under pressure.", "The power brake control system controls each side of the aircraft separately to aid in steering. This is accomplished by the two sets of brake valves."], "jumps": ["P2440", "P2410"]}, {"id": "P2400", "text": ["The set of brake valves consist of a left brake and a right brake control valve.  Each are identical in construction.", "The set of brake valves consist of a left brake and a right brake control valve. Each are identical in construction."], "jumps": ["P2410", "P2340"]}, {"id": "P2440", "text": ["Hydraulic fluid is also directed to the end of the spool to give a feeling of applied pressure to the pilot and to aid the return        spring in returning the spool to the return line up when the pedal  is released.", "Hydraulic fluid is also directed to the end of the spool to give a feeling of applied pressure to the pilot and to aid the return spring in returning the spool to the return line up when the pedal is released."], "jumps": ["P2450", "P2410"]}, {"id": "P2450", "text": ["Hydraulic fluid flows from the brake valves to the shuttle valves. Shuttle valves automatically shift the system to either normal line up or the emergency line up.", "turn line up when the pedal is released."], "jumps": ["P2460", "P2410"]}, {"id": "P2333", "text": ["The brake housing is U-shaped and contains the pucks and pistons."], "jumps": []}, {"id": "P3060", "text": ["Ice formation starts on the leading edges of the wings, stabilizers, control surfaces and propeller blades."], "jumps": ["P3050"]}, {"id": "P3070", "text": ["The pneumatic de-icing system uses inflatable rubber boots to break up formation of ice by creating a ripple in the leading edge."], "jumps": ["P3060"]}, {"id": "P2320", "text": ["Two pistons are located on both sides of the housing and the stationary pucks are located in the center between the two disks."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["What applies pressure against the disk to slow or stop the aircraft?"], "jumps": ["P2310"]}, {"id": "P2300", "text": ["Increased brake pedal pressure increases piston and puck pressure against the disk, causing the disk and the wheel to slow or stop completely."], "jumps": ["P2310", "P2240"]}, {"id": "P2331", "text": [], "jumps": []}, {"id": "P2410", "text": ["When the pilot presses the brake pedal, a plunger moves a spool inside the valve body.  The spool directs the flow of hydraulic fluid to or from the brake assembly.", "The brake housing is U shaped and is mounted on the main gear, so that the disk is able to rotate between two points of the brake housing.", "When the pilot presses the brake pedal, a plunger moves a spool inside the valve body. The spool directs the flow of hydraulic fluid to or from the brake assembly."], "jumps": ["P2420", "P2340"]}, {"id": "P2222", "text": ["Each main gear is equipped with a brake pedal and master cylinder for steering the aircraft."], "jumps": []}, {"id": "P2270", "text": ["To prevent the pistons and the disk from making contact with each other and causing severe damage, a set of lining pucks made of soft metallic fiber are used.", "Why is the brake system fitted with a master cylinder and a pedal to each main gear?"], "jumps": ["P2280", "P2240"]}, {"id": "P2214", "text": ["Pedal linkage connects the pedals to the hydraulic master cylinder."], "jumps": []}, {"id": "P2220", "text": ["Why is the brake system fitted with a master cylinder and a pedal to each main gear?"], "jumps": ["P2210"]}, {"id": "P2280", "text": ["A stationary puck is mounted on the inside section of the housing and disk.  Movable pucks are installed between the piston and disk.", "A stationary puck is mounted on the inside section of the housing and disk. Movable pucks are installed between the piston and disk."], "jumps": ["P2290", "P2240"]}, {"id": "P2212", "text": ["The reservoir stores and supplies the hydraulic fluid to the system."], "jumps": []}, {"id": "P2210", "text": ["What component of the independent brake system applies hydraulic fluid pressure to the brake assembly?"], "jumps": ["P2130"]}, {"id": "P2211", "text": [], "jumps": []}, {"id": "P2221", "text": [], "jumps": []}, {"id": "P2280", "text": ["A stationary puck is mounted on the inside section of the housing and disk.  Movable pucks are installed between the piston and disk.", "A stationary puck is mounted on the inside section of the housing and disk. Movable pucks are installed between the piston and disk."], "jumps": ["P2290", "P2240"]}, {"id": "P2390", "text": ["Two sets of brake valves enable the pilot and copilot to brake the aircraft.  For simplicity only the pilots set will be discussed.", "Two sets of brake valves enable the pilot and copilot to brake the aircraft. For simplicity only the pilots set will be discussed."], "jumps": ["P2400", "P2340"]}, {"id": "P2160", "text": ["As the piston moves towards the brake port, the reservoir port is blocked off and hydraulic fluid is pushed out to the brake assembly through the brake port."], "jumps": ["P2170", "P2130"]}, {"id": "P2190", "text": ["When the piston is returned to the idle position, the piston seal allows leakage from the back of the piston to the front side of the piston.", "Hydraulic fluid is ported to the backside of the piston for lubrication and aiding in the replacement of fluid in the cylinder    when the pedal is released.", "Hydraulic fluid is ported to the backside of the piston for lubrication and aiding in the replacement of fluid in the cylinder when the pedal is released."], "jumps": ["P2200", "P2130"]}, {"id": "P2140", "text": ["The piston is fitted in the cylinder with a seal, to allow the piston to slide towards the brake port without fluid leaking past."], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["The cylinder is filled with hydraulic fluid supplied from the reservoir through the reservoir port of the master cylinder."], "jumps": ["P2160", "P2130"]}, {"id": "P2170", "text": ["When the pedal is released, the return spring forces the piston back to the idle position.  Allowing the hydraulic fluid to return to the cylinder and relieving the pressure off of the brake assembly.", "When the pedal is released, the return spring forces the piston back to the idle position. Allowing the hydraulic fluid to return to the cylinder and relieving the pressure off of the brake assembly."], "jumps": ["P2180", "P2130"]}, {"id": "P2200", "text": ["Dust and dirt is prevented from entering the master cylinder by the rubber boot."], "jumps": ["P2210", "P2130"]}, {"id": "P2120", "text": ["The master cylinder consists of a piston, piston rod, return spring, boot and a cylinder."], "jumps": ["P2130", "P2070"]}, {"id": "P2130", "text": ["The piston rod is connected to the pedal linkage and is used to convert pedal movement to piston movement.  Pressing down on the pedal forces the piston rod and piston to move towards the brake port.", "The piston rod is connected to the pedal linkage and is used to convert pedal movement to piston movement. Pressing down on the pedal forces the piston rod and piston to move towards the brake port."], "jumps": ["P2140", "P2070"]}, {"id": "P2060", "text": ["Two of the types of brake systems in use today are the independent brake system and the power control system."], "jumps": ["P2070", "P2020"]}, {"id": "P2100", "text": ["All master cylinders receive hydraulic fluid from the system reservoir.  The one reservoir stores the hydraulic fluid until needed by the system (brakes applied).", "All master cylinders receive hydraulic fluid from the system reservoir. The one reservoir stores the hydraulic fluid until needed by the system (brakes applied)."], "jumps": ["P2110", "P2070"]}, {"id": "P2110", "text": ["Each brake pedal is mechanically linked to it's corresponding master cylinder.  Pressing down on the pedal forces the master cylinder to pump hydraulic fluid to the brake assembly.", "Each brake pedal is mechanically linked to it's corresponding master cylinder. Pressing down on the pedal forces the master cylinder to pump hydraulic fluid to the brake assembly."], "jumps": ["P2120", "P2070"]}, {"id": "P2050", "text": ["Brakes are installed on each landing gear and may be operated individually of each other.  Individual operation is used to steer     the aircraft.", "Brakes are installed on each landing gear and may be operated individually of each other. Individual operation is used to steer the aircraft."], "jumps": ["P2060", "P2020"]}, {"id": "P2070", "text": ["The independent brake system is used mostly on small light aircraft."], "jumps": ["P2080", "P2060"]}, {"id": "P2090", "text": ["Each main gear is equipped with a brake pedal, master cylinder and a brake assembly.  The nose gear of the aircraft is not fitted with a brake system.", "Each main gear is equipped with a brake pedal, master cylinder and a brake assembly. The nose gear of the aircraft is not fitted with a brake system."], "jumps": ["P2100", "P2070"]}, {"id": "P2180", "text": ["Hydraulic fluid is ported to the backside of the piston for lubrication and aiding in the replacement of fluid in the cylinder    when the pedal is released.", "Hydraulic fluid is ported to the backside of the piston for lubrication and aiding in the replacement of fluid in the cylinder when the pedal is released."], "jumps": ["P2190", "P2130"]}, {"id": "P1980", "text": ["7.  Four sequence valves are used to automatically operate the          door cylinders when the landing gear is in the correct position      to open or close the doors.", "7. Four sequence valves are used to automatically operate the door cylinders when the landing gear is in the correct position to open or close the doors."], "jumps": ["P1999", "P1970"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1970"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2340", "text": ["Power braking systems are used on aircraft requiring large volumes of hydraulic fluid to operate the brake assemblies. This applies to large aircrafts."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["Unlike the independent system, the power brake control receives hydraulic fluid from the aircrafts main hydraulic system."], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["A check valve is used to prevent loss of brake system pressure in case of main hydraulic system failure.  A check valve only allows flow in one direction.", "A check valve is used to prevent loss of brake system pressure in case of main hydraulic system failure. A check valve only allows flow in one direction."], "jumps": ["P2370", "P2340"]}, {"id": "P1960", "text": ["5.  The nose gear and the retractable main gear has a trunnion           connecting the shock strut to the aircraft frame.  This allows          the shock strut to pivot or swing for steering and/or retracting.", "4.  Drag struts provide stability and prevent the retractable                   landing gear from collapsing during ground maneuvering of          the aircraft.", "5. The nose gear and the retractable main gear has a trunnion connecting the shock strut to the aircraft frame. This allows the shock strut to pivot or swing for steering and/or retracting.", "4. Drag struts provide stability and prevent the retractable landing gear from collapsing during ground maneuvering of the aircraft."], "jumps": ["P1970", "P1940"]}, {"id": "P1940", "text": ["3.  To prevent the lower tube of the shock strut from spinning in          the upper tube, a torque link is used to keep the wheels                   pointed in a straight ahead direction.", "3. To prevent the lower tube of the shock strut from spinning in the upper tube, a torque link is used to keep the wheels pointed in a straight ahead direction."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  Drag struts provide stability and prevent the retractable                   landing gear from collapsing during ground maneuvering of          the aircraft.", "4. Drag struts provide stability and prevent the retractable landing gear from collapsing during ground maneuvering of the aircraft."], "jumps": ["P1960", "P1940"]}, {"id": "P2080", "text": ["The independent braking system is a hydraulic operated system. However, the hydraulic system is independent to the aircraft        hydraulic system.", "The independent braking system is a hydraulic operated system. However, the hydraulic system is independent to the aircraft hydraulic system."], "jumps": ["P2090", "P2070"]}, {"id": "P1920", "text": ["1.  The tricycle gear arrangement allows more forceful                           application of the brakes at higher landing speeds without              nosing over.", "6.  Each hydraulic gear assembly has a gear cylinder to convert         hydraulic movement to mechanical movement.  The gear                 cylinder is linked to the landing gear for raising or lowering of        the landing gear.", "1. The tricycle gear arrangement allows more forceful application of the brakes at higher landing speeds without nosing over.", "6. Each hydraulic gear assembly has a gear cylinder to convert hydraulic movement to mechanical movement. The gear cylinder is linked to the landing gear for raising or lowering of the landing gear."], "jumps": ["P1930", "P1001", "P1400", "P1980", "P1940"]}, {"id": "P2213", "text": ["The brake pedal allows the pilot to mechanically operate the brake system (master cylinder)."], "jumps": []}, {"id": "P2240", "text": ["The disk is mounted on the axle with the wheel.  The disk and wheel become one unit and rotate together.  Stopping the rotation of the disk also stops the wheel rotation.", "The disk is mounted on the axle with the wheel. The disk and wheel become one unit and rotate together. Stopping the rotation of the disk also stops the wheel rotation."], "jumps": ["P2250", "P2230"]}, {"id": "P2310", "text": ["The dual disk is very similar in operation with the exception of two disks and the housing is W-shaped."], "jumps": ["P2320", "P2240"]}, {"id": "P2332", "text": ["The lining pucks are used to prevent damage to the pistons and the disk."], "jumps": []}, {"id": "P4180", "text": ["The cabin is fitted with intensity control ceiling lights for total area illumination.  The pastel color of the walls and ceiling aid in   the even reflection of the light.", "The cabin is fitted with intensity control ceiling lights for total area illumination. The pastel color of the walls and ceiling aid in the even reflection of the light."], "jumps": ["P4170"]}, {"id": "P4190", "text": ["The aisle lights are a low intensity beam of light illuminating the aisle for safety.  They are normally located under selected inside  aisle seats or in the overhead pointing straight down.", "The aisle lights are a low intensity beam of light illuminating the aisle for safety. They are normally located under selected inside aisle seats or in the overhead pointing straight down."], "jumps": ["P4200", "P4180"]}, {"id": "P4210", "text": ["Individual area lighting is installed for safe and easy operation of equipment or sanitary conditions.", "Individual area lighting is installed for safe and easy operation of equipment or sanitary conditions. (GRAPHIC TEXT) Restrooms Equipment Bays Galley (kitchen) Cargo Compartments Emergency Evacuation Equipment", "Restrooms Equipment Bays Galley (kitchen) Cargo Compartments Emergency Evacuation Equipment"], "jumps": ["P4220", "P4180"]}, {"id": "P3190", "text": ["Thermostatic switches are located in the controlling surfaces and are used to shut the heat source valves if the temperature becomes too excessive."], "jumps": ["P3200", "P3160"]}, {"id": "P3300", "text": ["An electrical heating element made of transparent conductive material called stannic oxide is placed between layers of windshield glass."], "jumps": ["P3310", "P3290"]}, {"id": "P4001", "text": ["Brake Assembly: The brake assembly of a large aircraft is normally a segmented type assembly.", "When the gear cylinders reach the end of their travel the two sequence valves used for raising the landing gear are opened by the gear cylinder's connecting rod.", "Brake Assembly: The brake assembly of a large aircraft is normally a segmented type assembly. )", "Hydraulic pressure enters the door cylinders forcing the pistons up and closing the landing gear doors.", "The sequence valves port hydraulic pressure to the gear cylinders to force the pistons down and lower the landing gear."], "jumps": ["P1400"]}, {"id": "P4273", "text": ["Low intensity aisle lights are used to light the aisle of the cabin during night flights."], "jumps": []}, {"id": "P4270", "text": ["What is used to prevent the pilot from reduced visibility caused by the cockpit lights and indications?"], "jumps": ["P4230"]}, {"id": "P1350", "text": ["Hydraulic pressure flows through the sequence valve and to the operating gear or door cylinder."], "jumps": ["P1360", "P1300"]}, {"id": "P1270", "text": ["The third position of the valve is closed, stopping all flow to and from the landing gear system."], "jumps": ["P1280", "P1210"]}, {"id": "P1310", "text": ["Reversing the operation, directing the fluid pressure to the bottom of the piston and venting the top side allows the piston to move up and retract the landing gear.", "The second position directs the fluid to the down gear and open doors side of the system.  Notice now that the up gear and door close side are now lined up with the return side of the system.", "The second position directs the fluid to the down gear and open doors side of the system. Notice now that the up gear and door close side are now lined up with the return side of the system."], "jumps": ["P1320", "P1300"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3040", "text": ["Glaze (smooth surface ice) is formed when the air temperature is just slightly below freezing and the water has more time to spread before freezing.", "Glaze (smooth surface ice) is formed when the air temperature is just slightly below freezing and the water has more time to spread before freezing...."], "jumps": ["P3020"]}, {"id": "P3080", "text": ["The system is composed of a series of inflatable boots that are inflated and deflated in alternating cycle that brakes the ice and    allows the air stream to carry it off.", "The system is composed of a series of inflatable boots that are inflated and deflated in alternating cycle that brakes the ice and allows the air stream to carry it off."], "jumps": ["P3070"]}, {"id": "P3090", "text": ["The boots are installed in sections along the leading edge of the wings and stabilizers with the different section operating alternately so as not to disturb the air flow across the wings surfaces."], "jumps": ["P3070"]}, {"id": "P3120", "text": ["The electrical control panel and timer operates the solenoid distributor valve to control the air flow to and from each boot."], "jumps": ["P3090"]}, {"id": "P3140", "text": ["The use of engine exhaust or a special combustion heater is normally used to heat the air flow through the controlling surfaces."], "jumps": ["P3150", "P3130"]}, {"id": "P3160", "text": ["Fresh outside air is directed to a heat exchanger called the augmentor.  This is where the heat is transferred from the engine exhaust to the air.", "Fresh outside air is directed to a heat exchanger called the augmentor. This is where the heat is transferred from the engine exhaust to the air."], "jumps": ["P3170", "P3130"]}, {"id": "P3170", "text": ["The augmentor is best described as a pipe within a pipe.  Engine exhaust flows through the inside pipe and heats the incoming air flowing through the outside pipe, above 100\u00baF.", "The augmentor is best described as a pipe within a pipe. Engine exhaust flows through the inside pipe and heats the incoming air flowing through the outside pipe, above 100"], "jumps": ["P3180", "P3160"]}, {"id": "P3283", "text": ["Burning fuel in a chamber is used to heat the air in a combustion type system."], "jumps": []}, {"id": "P3320", "text": ["A temperature sensing element is imbedded into the windshield to ensure that the windshield is held within safe limits by the control circuitry."], "jumps": ["P3330", "P3310"]}, {"id": "P3382", "text": ["The combustion chamber heater uses aircraft fuel to de-ice the wings and controlling surfaces."], "jumps": []}, {"id": "P4020", "text": ["Aircraft lighting systems provide illumination for both exterior and interior use.  The system was designed for convenience and safety.", "Aircraft lighting systems provide illumination for both exterior and interior use. The system was designed for convenience and safety."], "jumps": ["P4001"]}, {"id": "P4060", "text": ["Intensity controlled flood lights provide the main lighting in the cockpit area.  The flood lights are able to switch between two colors of light.", "Intensity controlled flood lights provide the main lighting in the cockpit area. The flood lights are able to switch between two colors of light."], "jumps": ["P4050"]}, {"id": "P4080", "text": ["Most pilots use dim white flood lights, because of the reduced ability to see red warning indicators under the red flood lights."], "jumps": ["P4050"]}, {"id": "P4100", "text": ["The color of the panels are flat black, light gray or light blue so as not to reflect light."], "jumps": ["P4050"]}, {"id": "P4120", "text": ["Necessary notations are etched through the black or gray plastic, allowing the white to show.  When the inside panel light is on, the etched area is illuminated.", "Necessary notations are etched through the black or gray plastic, allowing the white to show. When the inside panel light is on, the etched area is illuminated."], "jumps": ["P4110"]}, {"id": "P4170", "text": ["Both types of external instrument lights are mounted above each instrument."], "jumps": ["P4160"]}, {"id": "P4260", "text": ["The emergency lights are operated by the crew in the cabin. They are also activated when the main electrical power is lost or interrupted."], "jumps": ["P4270", "P4230"]}, {"id": "P4360", "text": ["Collision avoidance lights are mounted on top and/or bottom of the aircraft.  These lights are flashing red beacons visible in a 360 degree horizontal direction.", "Collision avoidance lights are mounted on top and/or bottom of the aircraft. These lights are flashing red beacons visible in a 360 degree horizontal direction."], "jumps": ["P4370", "P4350"]}, {"id": "P1194", "text": ["The landing gear shock strut absorbs the impact of the landing with the use of air and hydraulic pressure."], "jumps": []}, {"id": "P1260", "text": ["The second position directs the fluid to the down gear and open doors side of the system.  Notice now that the up gear and door close side are now lined up with the return side of the system.", "The second position directs the fluid to the down gear and open doors side of the system. Notice now that the up gear and door close side are now lined up with the return side of the system."], "jumps": ["P1270", "P1210"]}, {"id": "P1192", "text": ["The trunnion allows the shock strut to pivot or swing for steering and/or retracting."], "jumps": []}, {"id": "P1230", "text": ["The selector valve directs the flow of hydraulic pressure to either the up or down position.  This is a rotor type valve with three positions.", "The selector valve directs the flow of hydraulic pressure to either the up or down position. This is a rotor type valve with three positions."], "jumps": ["P1240", "P1210"]}, {"id": "P1184", "text": ["The torque links keep the wheels pointed in a straight ahead direction."], "jumps": []}, {"id": "P1250", "text": ["The down gear and door open side of the system is directed to the return side of the system, or also known as the return header."], "jumps": ["P1260", "P1210"]}, {"id": "P1290", "text": ["The gear cylinder is a cylinder with a piston and connecting rod assembly.  Hydraulic fluid is directed to either the top or bottom of  the piston for operation.", "The gear cylinder is a cylinder with a piston and connecting rod assembly. Hydraulic fluid is directed to either the top or bottom of the piston for operation."], "jumps": ["P1300", "P1210"]}, {"id": "P1250", "text": ["The down gear and door open side of the system is directed to the return side of the system, or also known as the return header."], "jumps": ["P1260", "P1210"]}, {"id": "P1170", "text": ["The nose gear and the retractable main gear has a trunnion connecting the shock strut to the aircraft frame.  This allows the   shock strut to pivot or swing for steering and/or retracting.", "The nose gear and the retractable main gear has a trunnion connecting the shock strut to the aircraft frame. This allows the shock strut to pivot or swing for steering and/or retracting."], "jumps": ["P1180", "P1140"]}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1150", "text": ["The torque link is connected to the upper tube and the lower tube of the shock strut."], "jumps": ["P1160", "P1140"]}, {"id": "P1240", "text": ["Placed in the up position, the selector valve directs the supply of hydraulic pressure to the up gear close door side of the system."], "jumps": ["P1250", "P1210"]}, {"id": "P1130", "text": ["An air valve located at the top of each strut controls the firmness (air pressure) and provides a port for hydraulic fluid servicing."], "jumps": ["P1140", "P1070"]}, {"id": "P1340", "text": ["A spring loaded ball stops flow through the sequence valve until the gear cylinder or door cylinder makes contact with the sequence valve's stem.  The stem pushes the ball against the spring and off  its seat.", "A spring loaded ball stops flow through the sequence valve until the gear cylinder or door cylinder makes contact with the sequence valve's stem. The stem pushes the ball against the spring and off its seat."], "jumps": ["P1350", "P1300"]}, {"id": "P1410", "text": ["Hydraulic pressure enters the three gear cylinders and pushes up on the pistons forcing the gear to retract to the up position."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["When the gear cylinders reach the end of their travel the two sequence valves used for raising the landing gear are opened by the gear cylinder's connecting rod."], "jumps": ["P1430", "P1400"]}, {"id": "P2020", "text": ["When most people think of aircraft systems, only the systems needed to fly normally come to mind.  The ability to stop and maneuver the aircraft on the ground are vital requirements to aircraft operation.", "When most people think of aircraft systems, only the systems needed to fly normally come to mind. The ability to stop and maneuver the aircraft on the ground are vital requirements to aircraft operation."], "jumps": ["P2030", "P2001"]}, {"id": "P2040", "text": ["The braking system is only used when the aircraft is on the ground.  Normally used to stop, park and in some applications used to steer the aircraft.", "The braking system is only used when the aircraft is on the ground. Normally used to stop, park and in some applications used to steer the aircraft."], "jumps": ["P2050", "P2020"]}, {"id": "P1060", "text": ["The number of wheels the landing gear has depends on the size and weight of the aircraft.  The multiple wheels spread the weight of the aircraft over a larger area.", "The number of wheels the landing gear has depends on the size and weight of the aircraft. The multiple wheels spread the weight of the aircraft over a larger area."], "jumps": ["P1070", "P1020"]}, {"id": "P1090", "text": ["When the lower tube is pushed upward from contact with the runway.  The hydraulic fluid is forced into the upper tube through a small opening.", "When the lower tube is pushed upward from contact with the runway. The hydraulic fluid is forced into the upper tube through a small opening."], "jumps": ["P1100", "P1070"]}, {"id": "P1280", "text": ["Each landing gear assembly has a gear cylinder to convert hydraulic movement to mechanical movement.  The gear cylinder is linked to the landing gear for raising or lowering of the landing gear.", "Each landing gear assembly has a gear cylinder to convert hydraulic movement to mechanical movement. The gear cylinder is linked to the landing gear for raising or lowering of the landing gear."], "jumps": ["P1290", "P1210"]}, {"id": "P1320", "text": ["Each landing gear has a door cylinder for opening and closing of the landing gear doors.  The operation of the doors cylinders is the same as the gear cylinders.", "Each landing gear has a door cylinder for opening and closing of the landing gear doors. The operation of the doors cylinders is the same as the gear cylinders."], "jumps": ["P1330", "P1300"]}, {"id": "P1330", "text": ["Four sequence valves are used to automatically operate the door cylinders when the landing gear is in the correct position to open or close the doors."], "jumps": ["P1340", "P1300"]}, {"id": "P2910", "text": ["This completes the information on AIRCRAFT BRAKING SYSTEM.", "This completes the information on AIRCRAFT BRAKING SYSTEM...."], "jumps": ["P2001", "P2520"]}, {"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 02-21-00 Changed copyright date on page Q0 to 1999-2000. Penny 03-09-00 Changed the red mat on the main window viewer to blue. Changed the high yellow word in text field of definition page to blue, Q1055. Added a 4 distractor touch area question page, Q1240. - Penny 04-03-00 Converted from SAM to toolbook. frieda 04-14-00 Text and Branching. frieda 07-14-00 Converted to ToolBook 7.1 format. jay 09-13-00 graphics john Ayala 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-12-02 review - rs", "next button - lisa, penny 02-21-00 Changed copyright date on page Q0 to 1999-2000. Penny 03-09-00 Changed the red mat on the main window viewer to blue. Changed the high yellow word in text field of definition page to blue, Q1055. Added a 4 distractor touch area question page, Q1240. - Penny 04-03-00 Converted from SAM to toolbook. frieda 04-14-00 Text and Branching. frieda 07-14-00 Converted to ToolBook 7.1 format. jay 09-13-00 graphics john Ayala 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-12-02 review - rs", "01-14-02 Converted to Phase II format. jay"], "jumps": []}, {"id": "P100", "text": ["In this lesson we are going to look at the support systems.", "w Identify and describe the basic types of aircraft landing systems.", "w Identify and describe the operating principles of the aircraft braking system."], "jumps": ["P430", "P400"]}, {"id": "P1050", "text": ["The tricycle gear arrangement allows more forceful application of the brakes at higher landing speeds without nosing over."], "jumps": ["P1060", "P1020"]}, {"id": "P400", "text": ["There are a few essential systems required for flight operation of an aircraft."], "jumps": ["P410", "P300"]}, {"id": "P1001", "text": ["* Identify and describe the operating principles of the aircraft braking system."], "jumps": []}, {"id": "P1030", "text": ["To protect the aircraft structure, the landing systems have been designed to absorb and dissipate the tremendous shock loads during landing.", "its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Nida Corporation - Aircraft Support Systems"], "jumps": ["P1040", "P1020"]}, {"id": "P1120", "text": ["After the initial impact, the compressed air will force the fluid back to the lower tube to extend the shock strut back to the normal position."], "jumps": ["P1130", "P1070"]}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P300", "text": ["\"You have successfully passed the assessment", "Nida Corporation - Aircraft Support Systems", "Let's begin the lesson on AIRCRAFT SUPPORT SYSTEMS........................"], "jumps": ["P400"]}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: AIRCRAFT SUPPORT SYSTEMSasd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P1040", "text": ["With the exception of a few older aircraft, most are fitted with the tricycle gear arrangement.  Consisting of a nose gear and the main gear.", "With the exception of a few older aircraft, most are fitted with the tricycle gear arrangement. Consisting of a nose gear and the main gear.", "Are you sure you want to Bookmark the Lesson?", "Are you sure you want to Exit the Lesson?", "You skipped X question(s). Do you want to _________", "The test is complete and your score is XX%. Do you want to _________", "You have successfully passed the assessment test!"], "jumps": ["P1050", "P1020"]}, {"id": "P1180", "text": ["What is designed to absorb the impact of an aircraft landing?"], "jumps": ["P1140"]}, {"id": "P1182", "text": ["The trunnion allows the shock strut to pivot or swing for steering and/or retracting."], "jumps": []}, {"id": "P1190", "text": ["What is used to keep the wheels in a straight ahead direction?"], "jumps": ["P1180"]}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P420", "text": ["In this lesson we are going to look at the support systems.", "When fluid pressure is directed to the top of the piston, the bottom of the piston is vented to the return header and the piston moves down to lower the landing gear."], "jumps": ["P430", "P400", "P1310", "P1210"]}, {"id": "P3384", "text": ["The alcohol system sprays alcohol on the windshield and carburetors.", "Each landing gear has a door cylinder for opening and closing of the landing gear doors. The op"], "jumps": []}, {"id": "P2230", "text": ["Brake Assembly \nThe single and dual disk are the two types of brake assemblies used with small light aircraft.", "Brake Assembly The single and dual disk are the two types of brake assemblies used with small light aircraft."], "jumps": ["P2240", "P2220"]}, {"id": "P2250", "text": ["The brake housing is U shaped and is mounted on the main gear, so that the disk is able to rotate between two points of the brake housing.", "To lower the landing gear the selector valve directs hydraulic pressure to the up gear side and the down gear side is vented to the return header.", "\"You have successfully passed the assessment", "To lower the landing gear the selector valve is placed in the lower position. Allowing hydraulic pressure to enter the down side and venting the up gear side to the return header."], "jumps": ["P2260", "P2240", "P1436", "P1410", "P1300", "P1440", "P1430"]}, {"id": "P1440", "text": ["Hydraulic pressure enters the door cylinders and pushes up the pistons.  When the door cylinders reach the end of their travel the connecting rod opens the lowering sequence valves.  The doors are fully open at this point.", "Hydraulic pressure enters the door cylinders and pushes up the pistons. When the door cylinders reach the end of their travel the connecting rod opens the lowering sequence valves. The doors are fully open at this point."], "jumps": ["P1450", "P1400"]}, {"id": "P1910", "text": ["This completes the information on AIRCRAFT LANDING SYSTEM.", "This completes the information on AIRCRAFT LANDING SYSTEM.."], "jumps": ["P1001", "P1400"]}, {"id": "P2030", "text": ["If the aircraft was not equipped with a braking system, the aircraft would run off the end of the runway when landing.  Even worse, run into a aircraft hanger or another plane.", "If the aircraft was not equipped with a braking system, the aircraft would run off the end of the runway when landing. Even worse, run into a aircraft hanger or another plane."], "jumps": ["P2040", "P2020"]}, {"id": "P1930", "text": ["2.  The landing gear shock strut absorbs the impact of the let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
