const book = {"title": "93955901", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Title: GENERATORS sdf sdf asdf asd fasfd asdf asdf sadf", "Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . ."], "jumps": []}, {"id": "P10", "text": ["# #\" #& \"\"# &\"###2' &2#&.22&# 25--283-.#285255232/238882-.-5:38832222882282-213:22::82-22225:8-33-22282232.22258558.5822385:235:222283538::2585582::2:", "&&#&# #/2.#.& -8 \"#.-&23..22'/.#212&-2258\"588:52", "### ## /# #/&# \" \"/##\"#/&//..#/..&/28.&...&824/&.88-8588..2222858852.28:582228588358282228258.888:825:583.8828::8228828588828583:35558.555.85::88::85588:88:5555::38::85:::5:5:52::85::88::", ":85:855::83:5:5.5:55:855:52.5:5283822242348522...252...2..82/.4..22//2./..##/.8.#&./#&/..##// ##\",##/## #. / /& # ## ## ## ## ## \" #/# ## /# ## #.\" ./ #//###,//.&/#.\"#/.##/./#&/2.&/.../&//....//&2222.2/252.&28.8522582.824828828::255:::5:", "/,,,,,,,,,,,,,/, ,, ,,,,,,6, ,,,6,,, ,,,,,//6//6,,,,/6/,,,/,4/,,/6/4494,,494/6846446/4884664;44;889448489888<8648<<8;44;88988<88948;98<44<;:<44<<8;44<48<<8;48<48<88;48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Discuss Generator theory of operation. w Describe the Generator construction. w Describe Generator characteristics."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about Generators."], "jumps": ["P300", "P410"]}, {"id": "P410", "text": ["Generators and electric motors perform opposite functions."], "jumps": ["P400", "P420"]}, {"id": "P420", "text": ["Motors convert an electrical input to a mechanical output.."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Generators convert a mechanical input to an electrical output."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["Using a motor to supply the mechanical input to a generator is one way that generators are driven."], "jumps": ["P430", "P450"]}, {"id": "P450", "text": ["Let's begin the lesson on GENERATORS.LE..................................."], "jumps": ["P440"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Generators are the second major rotating machinery type. nerators"], "jumps": ["P1001", "P1030"]}, {"id": "P1030", "text": ["Generators perform the opposite function of motors........."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["A mechanical input is used to generate an electrical output."], "jumps": ["P1030", "P1050"]}, {"id": "P1050", "text": ["Generators are often used where electricity is not available."], "jumps": ["P1030", "P1060"]}, {"id": "P1060", "text": ["The mechanical input to the generator can be supplied by a number of different sources."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["Gas and diesel engines are used to produce mechanical input power to a generator.", "Electric motors are also used to produce mechanical input power to a generator."], "jumps": ["P1060", "P1080", "P1090"]}, {"id": "P1090", "text": ["As an electronics technician, you will primarily encounter the motor generator."], "jumps": ["P1080", "P1100"]}, {"id": "P1100", "text": ["There are two types of generators: AC and DC.............."], "jumps": ["P1080", "P1110"]}, {"id": "P1110", "text": ["The AC generator produces AC or alternating current........"], "jumps": ["P1100", "P1120"]}, {"id": "P1120", "text": ["The DC generator produces DC or direct current."], "jumps": ["P1110", "P1130"]}, {"id": "P1130", "text": ["In this lesson, DC generators will be discussed."], "jumps": ["P1110", "P1140"]}, {"id": "P1140", "text": ["DC Generators are nearly identical to DC Motors............"], "jumps": ["P1150", "P1110"]}, {"id": "P1150", "text": ["The DC Generator's theory of operation is similar to a DC Motor's."], "jumps": ["P1140", "P1160"]}, {"id": "P1160", "text": ["Recall, for a DC motor, if a current carrying conductor is placed in a magnetic field, motion of the conductor results."], "jumps": ["P1170", "P1140"]}, {"id": "P1170", "text": ["By the same theory, if a conductor is moved through a magnetic field, current is induced in the moving conductor."], "jumps": ["P1160", "P1180"]}, {"id": "P1180", "text": ["If a load (resistance) is attached to the conductor, current will flow."], "jumps": ["P1170", "P1190"]}, {"id": "P1190", "text": ["This phenomenon is similar to the effects that are necessary for inductive reactance or transformer action."], "jumps": ["P1170", "P1200"]}, {"id": "P1200", "text": ["E (induced) = N x where; N = # of conductors series aiding) T = time (in seconds) D means \"change in\"", "The equation to determine the amount of induced voltage in the conductor is also the same as mutual inductance."], "jumps": ["P1190", "P1210"]}, {"id": "P1210", "text": ["From the equation you can see that to induce a voltage (a combination of flux), motion and a conductor are required."], "jumps": ["P1200", "P1220"]}, {"id": "P1220", "text": ["In generation action, a conductor moves through a magnetic field, producing a current flow."], "jumps": ["P1225", "P1200"]}, {"id": "P1225", "text": ["This current is flowing through a conductor that is in a magnetic field."], "jumps": ["P1220", "P1230"]}, {"id": "P1230", "text": ["The result of this, which is motor action, produces additional torque."], "jumps": ["P1220", "P1240"]}, {"id": "P1240", "text": ["From the Right Hand Rule, you will see that this torque opposes the direction of conductor motion (mechanical torque)."], "jumps": ["P1220", "P1250"]}, {"id": "P1250", "text": ["The counter torque is proportional to the current flowing through the conductor."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["As the load current increases (P ), Counter Torque also increases. This requires more force to move the conductor through the field (P )."], "jumps": ["P1250", "P1270", "P"]}, {"id": "P1270", "text": ["If a large enough load is placed on the generator, motor action counter torque will cause the conductor to stop moving through the field and generator action will cease."], "jumps": ["P1260", "P1280"]}, {"id": "P1280", "text": ["Converts mechanical energy into electrical energy.", "Converts electrical energy into electrical energy.", "Converts electrical energy into mechanical energy.", "What does a generator do?is typed.........................."], "jumps": ["P1270"]}, {"id": "P1281", "text": [], "jumps": []}, {"id": "P1282", "text": ["A motor converts electrical energy into mechanical energy.."], "jumps": []}, {"id": "P1283", "text": ["A transformer converts electrical energy into electrical energy (either step up or step down)."], "jumps": []}, {"id": "P1290", "text": ["What causes counter torque in a generator?................."], "jumps": ["P1280"]}, {"id": "P1291", "text": [], "jumps": []}, {"id": "P1292", "text": ["Generator action and motor action occur simultaneously and counter torque is not due to generator action."], "jumps": []}, {"id": "P1293", "text": ["Induced voltage in the conductor of a generator is similar to transformer action but counter torque is not due to transformer action."], "jumps": []}, {"id": "P1300", "text": ["The construction of DC generators is almost identical to DC motors."], "jumps": ["P1290", "P1310"]}, {"id": "P1310", "text": ["Both the DC motor and generator use stators, rotors, and commutators."], "jumps": ["P1300", "P1320"]}, {"id": "P1320", "text": ["In a DC motor, current is sent to the rotor windings, causing a motor output of the shaft."], "jumps": ["P1300", "P1330"]}, {"id": "P1330", "text": ["In a DC generator, the rotor is driven, causing a current from the rotor windings."], "jumps": ["P1300", "P1340"]}, {"id": "P1340", "text": ["The amount of induced voltage across the rotor windings depends on the position of the rotor with respect to the field."], "jumps": ["P1330", "P1350"]}, {"id": "P1350", "text": ["At 0 , the conductor movement is parallel with the field, resulting in no induced voltage in the rotor windings."], "jumps": ["P1340", "P1360"]}, {"id": "P1360", "text": [", the conductor movement is perpendicular to the field resulting in maximum induced voltage."], "jumps": ["P1340", "P1370"]}, {"id": "P1370", "text": [", the conductor movement is again parallel with the field so no voltage is induced."], "jumps": ["P1340", "P1380"]}, {"id": "P1380", "text": ["represents maximum induced voltage in the rotor with respect to the field."], "jumps": ["P1340", "P1390"]}, {"id": "P1390", "text": [", the rotor movement is again in parallel to the field."], "jumps": ["P1340", "P1400"]}, {"id": "P1400", "text": ["The voltage across the rotor becomes pulsating DC due to the rotor and field positions."], "jumps": ["P1340", "P1410"]}, {"id": "P1410", "text": ["Notice that the pulsating DC represents one complete revolution (360"], "jumps": ["P1400", "P1420"]}, {"id": "P1420", "text": ["The rate at which the field lines are cut (induced voltage) is directly proportional to rotor shaft RPM.", "Slow Rotor Shaft RPM (1 Rev/Unit Time)", "Fast Rotor Shaft RPM (2 Rev/Unit Time)"], "jumps": ["P1400", "P1430"]}, {"id": "P1430", "text": ["A faster rotating rotor shaft represents more revolutions per unit time."], "jumps": ["P1420", "P1440"]}, {"id": "P1440", "text": ["Notice that the output voltage resembles the output of a full wave rectifier."], "jumps": ["P1420", "P1450"]}, {"id": "P1450", "text": ["To reduce the pulsating DC output consider a 2 loop/2 pole DC generator."], "jumps": ["P1440", "P1460"]}, {"id": "P1460", "text": ["Notice that one loop is parallel to the magnetic field and the other loop is perpendicular."], "jumps": ["P1450", "P1470"]}, {"id": "P1470", "text": ["At this time voltage is induced in loop 1 and no voltage is induced in loop 2."], "jumps": ["P1480", "P1450"]}, {"id": "P1480", "text": ["rotation, voltage is induced in loop 2 and no voltage is induced in loop 1."], "jumps": ["P1470", "P1490"]}, {"id": "P1490", "text": ["rotation, loop 2 has no voltage induced and loop 1 does."], "jumps": ["P1470", "P1500"]}, {"id": "P1500", "text": ["rotation, loop 1 has no voltage induced and loop 2 does."], "jumps": ["P1470", "P1510"]}, {"id": "P1510", "text": ["), of rotation, the output voltage returns to it's original levels."], "jumps": ["P1470", "P1520"]}, {"id": "P1520", "text": ["The output voltage across loop 2 resembles a full wave rectifier output."], "jumps": ["P1470", "P1530"]}, {"id": "P1530", "text": ["The output voltage across loop 1 also resembles a full wave rectifier output."], "jumps": ["P1520", "P1540"]}, {"id": "P1540", "text": [], "jumps": ["P1520", "P1550"]}, {"id": "P1550", "text": ["Combining the two waveforms shows the actual output of a two loop generator."], "jumps": ["P1520", "P1560"]}, {"id": "P1560", "text": ["As you can see, the output of the two loop DC generator is much smoother than a one loop DC generator."], "jumps": ["P1550", "P1570"]}, {"id": "P1570", "text": ["Most commercial DC generators have from 6 to 24 loops. This produces a smooth DC output with little ripple."], "jumps": ["P1550", "P1580"]}, {"id": "P1580", "text": ["When the rotor and stator field lines are perpendicular.", "When the rotor and stator field lines are stationary and parallel.", "When the rotor and stator field lines are parallel.", "When is voltage induced in the rotor windings of a DC generator?"], "jumps": ["P1570"]}, {"id": "P1581", "text": [], "jumps": []}, {"id": "P1582", "text": ["If the rotor is stationary and perpendicular to the field lines then a voltage is induced."], "jumps": []}, {"id": "P1583", "text": ["If the rotor is stationary and perpendicular to the field lines then a voltage is induced."], "jumps": []}, {"id": "P1590", "text": ["Why would a 24 loop DC generator be better than a 2 loop DC generator? .Incorrect1:More output power generated"], "jumps": ["P1580"]}, {"id": "P1591", "text": [], "jumps": []}, {"id": "P1592", "text": ["The number of poles used does not affect the amount of output power."], "jumps": []}, {"id": "P1593", "text": ["The number of poles does not have an affect on the input power."], "jumps": []}, {"id": "P1600", "text": ["As in DC motors, DC generators use permanent or electromagnets to produce the field or stator flux."], "jumps": ["P1590", "P1610"]}, {"id": "P1610", "text": ["In permanent magnet DC generators, the field magnetic flux is always present."], "jumps": ["P1600", "P1620"]}, {"id": "P1620", "text": ["When the rotor is rotated, a DC Voltage output occurs."], "jumps": ["P1600", "P1630"]}, {"id": "P1630", "text": ["In electromagnet DC generators, there are two types of machines."], "jumps": ["P1600", "P1640"]}, {"id": "P1640", "text": ["A Separately Excited generator uses an external source to supply current to the field or stator windings."], "jumps": ["P1600", "P1650"]}, {"id": "P1650", "text": ["A separately excited DC generator uses a shunt field only."], "jumps": ["P1640", "P1660"]}, {"id": "P1660", "text": ["A Self Excited generator does not use an external voltage source to produce the field or stator magnetic flux."], "jumps": ["P1640", "P1670"]}, {"id": "P1670", "text": ["The voltage produced in the armature or rotor supplies the field or stator current."], "jumps": ["P1660", "P1680"]}, {"id": "P1680", "text": ["The rotor current induces field winding voltage which induces rotor current. This is possible due to residual magnetism."], "jumps": ["P1660", "P1710"]}, {"id": "P1710", "text": ["With no rotor rotation, there is no rotor current or power to the field windings."], "jumps": ["P1660", "P1720"]}, {"id": "P1720", "text": ["When a rotating force is applied to the rotor, the rotor begins to cut the very weak flux field produced by a residual magnetism."], "jumps": ["P1710", "P1730"]}, {"id": "P1730", "text": ["The small E voltage is also applied to the field windings, increasing the flux - increasing E as RPM increases."], "jumps": ["P1710", "P1740"]}, {"id": "P1740", "text": ["A higher E produces a larger flux field, which produces a higher E as RPM increases."], "jumps": ["P1710", "P1750"]}, {"id": "P1750", "text": ["The process continues until equilibrium occurs."], "jumps": ["P1710", "P1760"]}, {"id": "P1760", "text": ["What are the two main types of DC generators?.............."], "jumps": ["P1710"]}, {"id": "P1761", "text": [], "jumps": []}, {"id": "P1762", "text": ["Self and separately excited DC generators are part of the electromagnet main type of DC generators."], "jumps": []}, {"id": "P1763", "text": ["Shunt and Series are just the way the field coils are around, not the main types of DC generators."], "jumps": []}, {"id": "P1770", "text": ["What are the two types of electromagnet DC generators?....."], "jumps": ["P1760"]}, {"id": "P1771", "text": [], "jumps": []}, {"id": "P1772", "text": ["Permanent and Electromagnet DC generators are the main types, not types of electromagnet generators."], "jumps": []}, {"id": "P1773", "text": ["Shunt and Series are just the way the field coils are around, not the types of electromagnetic DC generators."], "jumps": []}, {"id": "P1780", "text": ["Unlike separately excited generators, self excited generators can use shunt, series, or compound fields."], "jumps": ["P1790", "P1770"]}, {"id": "P1790", "text": ["No matter how the field coils are wound or if field coils are used at all, DC generators are subject to the same effect of loading as any DC source. $Back: P1780"], "jumps": ["P1800"]}, {"id": "P1800", "text": ["As R decreases, E decreases due to series divider action between R and R when the flux field and RPM are held constant."], "jumps": ["P1790", "P1810"]}, {"id": "P1810", "text": ["However, in the series or compound generator, as R decreases, I increases, increasing the series field flux."], "jumps": ["P1790", "P1820"]}, {"id": "P1820", "text": ["This in effect increases E as R decreases.."], "jumps": ["P1790", "P1830"]}, {"id": "P1830", "text": ["The effects of E output and load current are different for different DC generators."], "jumps": ["P1790", "P1840"]}, {"id": "P1840", "text": ["The shunt DC generator (PM, Self or Separately excited) operates just like any DC service."], "jumps": ["P1830", "P1850", "PM"]}, {"id": "P1850", "text": ["The series DC generator increases E for decreasing R (increasing I ), flux increases."], "jumps": ["P1830", "P1860"]}, {"id": "P1860", "text": ["However, the voltage divider action R and R does effect E as R approaches 0 ohms."], "jumps": ["P1830", "P1870"]}, {"id": "P1870", "text": ["The compound DC generator has a somewhat steady E due to the shunt and series field effects."], "jumps": ["P1830", "P1880"]}, {"id": "P1880", "text": ["The following chart sums up DC generators.................."], "jumps": ["P1830", "P1910"]}, {"id": "P1910", "text": ["This completes the information on GENERATORS. TITLE........"], "jumps": ["P1880", "P1001"]}, {"id": "P1920", "text": ["1. Generators produce electrical energy from mechanical energy."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. Motor generators use a motor to generate a mechanical input."], "jumps": ["P1920", "P1940"]}, {"id": "P1940", "text": ["* Magnetic Induction * Counter Torque * Induced Voltage * Counter EMF * Stators, Poles & Rotors * Left & Right Hand Rules", "3. DC motors and DC generators operate using the same principles.."], "jumps": ["P1930", "P1950"]}, {"id": "P1950", "text": ["4. As load current increases in a DC generator, motor action counter torque increases. This opposes generator action. Large Current Large Load Hand acting as load."], "jumps": ["P1940", "P1960"]}, {"id": "P1960", "text": ["5. A one loop DC generator produces an output waveform with significant DC ripple..8"], "jumps": ["P1950", "P1970"]}, {"id": "P1970", "text": ["6. A two loop DC generator produces a much smoother DC output waveform."], "jumps": ["P1960", "P1980"]}, {"id": "P1980", "text": ["7. Most commercial DC generators use 12 to 24 loops......."], "jumps": ["P1960", "P1990"]}, {"id": "P1990", "text": ["8. The DC generator is broken down as follows:............"], "jumps": ["P1980", "P1992"]}, {"id": "P1992", "text": ["9. The type of windings, if used, determine output characteristics."], "jumps": ["P1990", "P1999"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1990", "P1001"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the q     for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
</body>
