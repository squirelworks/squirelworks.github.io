const book = {"title": "93953306", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: INTRODUCTION TO VOLTAGE REGULATORSasdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe the purpose of parallel voltage regulators. w Describe the operation of basic parallel voltage regulator circuits.......................", "w Describe the purpose of series voltage regulators. w Describe the operation of basic series voltage regulator circuits."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you are introduced to voltage regulators."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Recall that voltage regulators are circuits used in power supplies to maintain a constant DC output voltage to a load."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Variations in the AC input voltage to a power supply affects the DC output voltage."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Variations in the current drawn by the load affects the DC output voltage."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["The voltage regulator compensates for variations of the input and output conditions to maintain a constant DC voltage."], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["Let's begin the lesson on INTRODUCTION TO VOLTAGE REGULATORS................"], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The series voltage regulator has the regulator circuit in series with the load."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["The purpose of the regulator circuit is to adjust its voltage drop to maintain Eout at a constant level."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Let's see how a basic manually operated series voltage regulator circuit operates."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["R1 is the series voltage regulator.  Note that R1 and RL form a voltage divider.", "R1 is the series voltage regulator. Note that R1 and RL form a voltage divider."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["The circuit operates by adjusting R1's voltage drop to maintain a constant Eout when circuit conditions vary."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["For example, this circuit is set for an output voltage of 9V.  R1 drops 3V supplying 9V to the load.", "For example, this circuit is set for an output voltage of 9V. R1 drops 3V supplying 9V to the load."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["If the DC input voltage increases to 14 V, the voltage across RL increases.  This causes an increase in current supplied to the load.", "If the DC input voltage increases to 14 V, the voltage across RL increases. This causes an increase in current supplied to the load."], "jumps": ["P1090", "P1040", "P1085"]}, {"id": "P1082", "text": ["If the DC input voltage increases to 14 V, the voltage across RL increases.  This causes an increase in current supplied to the load.", "If the DC input voltage increases to 14 V, the voltage across RL increases. This causes an increase in current supplied to the load.."], "jumps": ["P1090", "P1040", "P1085"]}, {"id": "P1085", "text": ["VOLTAGE ACROSS THE LOAD - The amount of current flow through R1 is dependent on the current drawn by the load. If the load current increases, the voltage drop across R1 increases (E = I x R)...... x R)."], "jumps": ["P1087", "P1082"]}, {"id": "P1087", "text": ["Therefore, if the applied voltage is increased, Er1 & ERL must increase.", "Therefore, if the applied voltage is increased, Er1 & ERL must increase........................................................"], "jumps": ["P1082", "P1085"]}, {"id": "P1090", "text": ["By INCREASING the resistance of R1, the voltage drop across R1 increases. The voltage across RL returns to 9 V."], "jumps": ["P1100", "P1082"]}, {"id": "P1100", "text": ["If the DC input voltage decreases to 10 V, the voltage across RL decreases.  This causes a decrease in the current supplied to the load.", "If the DC input voltage decreases to 10 V, the voltage across RL decreases. This causes a decrease in the current supplied to the load.."], "jumps": ["P1110", "P1082", "P1105"]}, {"id": "P1102", "text": ["If the DC input voltage decreases to 10 V, the voltage across RL decreases.  This causes a decrease in the current supplied to the load.", "If the DC input voltage decreases to 10 V, the voltage across RL decreases. This causes a decrease in the current supplied to the load."], "jumps": ["P1110", "P1082", "P1105"]}, {"id": "P1105", "text": ["VOLTAGE ACROSS THE LOAD - The amount of current flow through R1 is dependent on the current drawn by the load. If the load current decreases, the voltage drop across R1 decreases (E = I x R)......x R)."], "jumps": ["P1107"]}, {"id": "P1107", "text": ["Therefore, if the applied voltage is decreased, Er1 & ERL must decrease.", "Therefore, if the applied voltage is decreased, Er1 & ERL must decrease........decrease........................................"], "jumps": ["P1102", "P1105"]}, {"id": "P1110", "text": ["By DECREASING the resistance of R1, the voltage drop across R1 decreases.  The voltage across RL returns to 9 V.", "By DECREASING the resistance of R1, the voltage drop across R1 decreases. The voltage across RL returns to 9 V."], "jumps": ["P1120", "P1102"]}, {"id": "P1120", "text": ["The circuit maintains a constant output voltage even when the input voltage varies by changing the voltage drop of R1."], "jumps": ["P1130", "P1102"]}, {"id": "P1130", "text": ["Any changes in current drawn by the load also effect the output voltage."], "jumps": ["P1140", "P1102"]}, {"id": "P1140", "text": ["For example, if load current increases, the voltage drop across R1 increases. This decreases the output voltage. Assume DC input voltage remains the same."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["By DECREASING the resistance of R1, the voltage drop across R1 decreases. Eout returns to 9 V."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["If load current decreases, the voltage drop across R1 decreases.  This increases the output voltage.  Assume DC input voltage remains the same.", "If load current decreases, the voltage drop across R1 decreases. This increases the output voltage. Assume DC input voltage remains the same."], "jumps": ["P1170", "P1130"]}, {"id": "P1170", "text": ["By INCREASING the resistance of R1, the voltage drop across R1 increases. Eout returns to 9 V."], "jumps": ["P1180", "P1130"]}, {"id": "P1180", "text": ["The circuit maintains a constant output voltage even when the load current changes by varying the resistance of R1."], "jumps": ["P1190", "P1130"]}, {"id": "P1190", "text": ["For any variation of input voltage or current drawn by the load, R1 is adjusted to vary its voltage drop to maintain a constant output voltage."], "jumps": ["P1200", "P1130"]}, {"id": "P1200", "text": ["if the DC input voltage increases, the output voltage is held constant by adjusting R1 to ___o", "In a series voltage regulator, if the DC input voltage increases, the output voltage is held constant by adjusting R1 to _______"], "jumps": ["P1190"]}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1202", "text": ["If the DC input voltage increases, the output voltage increases. R1's voltage drop must increase to lower Eout to its original value."], "jumps": []}, {"id": "P1210", "text": ["In a series voltage regulator, if the current drawn by the load decreases, the output voltage is held constant by adjusting R1\nto _______", "In a series voltage regulator, if the current drawn by the load decreases, the output voltage is held constant by adjusting R1 to _______"], "jumps": ["P1200"]}, {"id": "P1211", "text": [], "jumps": []}, {"id": "P1212", "text": ["If the current drawn by the load decreases, the voltage drop across R1 decreases, increasing the output voltage. R1's voltage drop must be increased to lower Eout to its original value."], "jumps": []}, {"id": "P1220", "text": ["Manually operated series voltage regulators are slow acting (you must adjust) and require constant attention. However, they are used in some instances."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["Most series voltage regulators use an electronic device that replaces the manual variable resistor with an automatic variable resistance."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["In future lessons, you will learn about these series voltage regulators."], "jumps": ["P1910", "P1220"]}, {"id": "P1910", "text": ["This completes the information on SERIES VOLTAGE REGULATORS.", "This completes the information on SERIES VOLTAGE REGULATORS.."], "jumps": ["P1001", "P1240"]}, {"id": "P1920", "text": ["1.   A series voltage regulator has the regulator circuit in series            with the load.", "1. A series voltage regulator has the regulator circuit in series with the load."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Series voltage regulators operate by changing the voltage              drop across the regulator.", "2. Series voltage regulators operate by changing the voltage drop across the regulator."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  If Eout increases due to the input voltage increasing or the             load current decreasing, the resistance of R1 is increased to          drop more voltage.  Eout remains constant.", "3. If Eout increases due to the input voltage increasing or the load current decreasing, the resistance of R1 is increased to drop more voltage. Eout remains constant."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  If Eout decreases due to the input voltage decreasing or the          load current increasing, the resistance of R1 is decreased to          drop less voltage.  Eout remains constant.", "4. If Eout decreases due to the input voltage decreasing or the load current increasing, the resistance of R1 is decreased to drop less voltage. Eout remains constant."], "jumps": ["P1999", "P1930"]}, {"id": "P1999", "text": ["You have completed the Summary.  \nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1930"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["The parallel voltage regulator has the regulator circuit in parallel with the load."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["The purpose of the regulator circuit is to adjust current flow to maintain Eout at a constant level."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["Let's see how a basic manually operated parallel voltage regulator circuit operates."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["R1 is the parallel voltage regulator.  Note that the resistance of RL and the resistance of R1 are in parallel.  R2 is in series.", "R1 is the parallel voltage regulator. Note that the resistance of RL and the resistance of R1 are in parallel. R2 is in series."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["The circuit operates by adjusting R1's branch current to maintain a constant Eout when circuit conditions change."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["For example, this circuit is set for an output voltage of 9 V.  R2 drops 3V supplying 9 V to the load and R1.", "For example, this circuit is set for an output voltage of 9 V. R2 drops 3V supplying 9 V to the load and R1."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["If the DC input voltage increases to 14 V, the voltages across R1 and RL increase.", "If the DC input voltage increases to 14 V, the voltages across R1 and RL increase. Assume the current drawn by the load remains the same."], "jumps": ["P2090", "P2040", "P2085"]}, {"id": "P2082", "text": ["If the DC input voltage increases to 14 V, the voltages across R1 and RL increase.", "If the DC input voltage increases to 14 V, the voltages across R1 and RL increase. the current drawn by the load remains the same."], "jumps": ["P2090", "P2040", "P2085"]}, {"id": "P2085", "text": ["VOLTAGE ACROSS THE LOAD - If the current through R1 and RL changes, the current through R2 changes. Therefore, if the applied voltage is increased and ER2 remains the same, Eout must increase.ent through R2 remains the same."], "jumps": []}, {"id": "P2090", "text": ["By DECREASING the resistance of R1, the current in the R1 branch increases which increases total current through R2."], "jumps": ["P2100", "P2082", "P2095"]}, {"id": "P2092", "text": ["By DECREASING the resistance of R1, the current in the R1 branch increases which increases total current through R2."], "jumps": ["P2100", "P2082", "P2095"]}, {"id": "P2095", "text": ["TOTAL CURRENT INCREASES - Remember, in a parallel circuit total current equals the sum of the branch currents. If one branch current increases, total current increases."], "jumps": ["P2092"]}, {"id": "P2100", "text": ["The increased current increases the voltage drop across R2."], "jumps": ["P2110", "P2092"]}, {"id": "P2110", "text": ["The increase of voltage across R2 decreases the voltage across RL.  Eout returns to 9 V.", "The increase of voltage across R2 decreases the voltage across RL. Eout returns to 9 V."], "jumps": ["P2120", "P2092"]}, {"id": "P2120", "text": ["If the DC input voltage decreases to 10 V, the voltages across R1 and RL decrease.", "If the DC input voltage decreases to 10 V, the voltages across R1 and RL decrease. ssume the current drawn by the load remains the same......"], "jumps": ["P2130", "P2092", "P2125"]}, {"id": "P2122", "text": ["If the DC input voltage decreases to 10 V, the voltages across R1 and RL decrease.", "If the DC input voltage decreases to 10 V, the voltages across R1 and RL decrease. ume the current drawn by the load remains the same.."], "jumps": ["P2130", "P2092", "P2125"]}, {"id": "P2125", "text": ["VOLTAGE ACROSS THE LOAD - If the current through R1 and RL changes, the current through R2 changes. Therefore, if the applied voltage is decreased and ER2 remains the same, Eout must decrease..rrent through R2 remains the same."], "jumps": []}, {"id": "P2130", "text": ["By INCREASING the resistance of R1, the current in the R1 branch decreases which decreases total current through R2."], "jumps": ["P2140", "P2122", "P2135"]}, {"id": "P2132", "text": ["By INCREASING the resistance of R1, the current in the R1 branch decreases which decreases total current through R2."], "jumps": ["P2140", "P2122", "P2135"]}, {"id": "P2135", "text": ["TOTAL CURRENT DECREASES - Remember, in a parallel circuit total current equals the sum of the branch currents. If one branch current decreases, total current decreases."], "jumps": ["P2132"]}, {"id": "P2140", "text": ["The decreased current decreases the voltage drop across R2."], "jumps": ["P2150", let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
