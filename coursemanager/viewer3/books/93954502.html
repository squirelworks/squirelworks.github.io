const book = {"title": "93954502", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ..", "Title: 4 BIT STORAGE REGISTERf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Predict outputs of a 4 bit storage register. w Probe the inputs and outputs of a 4 bit storage register. w Recognize normal operation of a 4 bit storage register..........", "w Identify the purpose of a 4 bit storage register. w Recognize 4 bit storage register circuits......."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "5. Nida Model 2100 Logic Probe or Equivalent"], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P335", "text": [], "jumps": []}, {"id": "P400", "text": ["Registers are devices that temporarily store and transfer data."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["A register that stores data is called a storage register.  It is primarily used for temporary storage of data.", "A register that stores data is called a storage register. It is primarily used for temporary storage of data."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["A register that transfers data is called a shift register.  It is primarily used to transfer data from one circuit to another.", "A register that transfers data is called a shift register. It is primarily used to transfer data from one circuit to another."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Let's begin the lesson on 4 BIT STORAGE REGISTER.........................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": ["P430"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["A 4 bit storage register is designed to temporarily store 4 bits of binary data."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Other registers store 8 and 16 bits.  Connecting three 4 bit registers will allow storage of 12 bits of data.", "Other registers store 8 and 16 bits. Connecting three 4 bit registers will allow storage of 12 bits of data."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The 4 bit register is used in this lesson because it is easy to understand."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Data is transferred to the register and stored as separate bits until needed."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["When the register receives a command to transfer the data, the stored information is sent to the output."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["The four bits of data are stored and shifted by 4 flip-flops inside the register."], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["The 4 bit storage register can use serial or parallel transfer.  Let's look at a serial storage register first.", "The 4 bit storage register can use serial or parallel transfer. Let's look at a serial storage register first."], "jumps": ["P1090", "P1020"]}, {"id": "P1090", "text": ["This serial 4 bit storage register uses four Type D edge triggered flip-flops connected to the same clock input."], "jumps": ["P1100", "P1020"]}, {"id": "P1100", "text": ["The register's input is applied to the D input of the first flip-flop (A)."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["The output from each flip-flop is the input to the next flip-flop."], "jumps": ["P1120", "P1090"]}, {"id": "P1120", "text": ["The register's output is taken from the last flip-flop (D)."], "jumps": ["P1130", "P1090"]}, {"id": "P1130", "text": ["Each time the clock pulse goes high, all four flip-flops change state according to their inputs."], "jumps": ["P1140", "P1090"]}, {"id": "P1140", "text": ["Let's use the binary number 1011 to demonstrate how serial data is stored and transferred through a register."], "jumps": ["P1150", "P1090"]}, {"id": "P1150", "text": ["Assume all flip-flops are reset and the content of the register is 0000."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["During T1, the clock pulse goes high enabling all 4 flip-flops."], "jumps": ["P1170", "P1140"]}, {"id": "P1170", "text": ["Flip-flop A sets.  The 1 on its input is transferred into the register.  The register's content is now 1000.", "Flip-flop A sets. The 1 on its input is transferred into the register. The register's content is now 1000."], "jumps": ["P1180", "P1140"]}, {"id": "P1180", "text": ["During T2 all 4 flip-flops are again enabled.  A and B have high inputs allowing them to set.", "During T2 all 4 flip-flops are again enabled. A and B have high inputs allowing them to set."], "jumps": ["P1200", "P1140"]}, {"id": "P1200", "text": ["During T3 all flip-flops are again enabled.  A resets and B and C set.  The register shifted the data to the right.  The content is now 0110.", "During T3 all flip-flops are again enabled. A resets and B and C set. The register shifted the data to the right. The content is now 0110."], "jumps": ["P1210", "P1140"]}, {"id": "P1210", "text": ["During T4 all flip-flops are again enabled.  A, C and D set and B resets.  The content of the register is now 1011.", "During T4 all flip-flops are again enabled. A, C and D set and B resets. The content of the register is now 1011."], "jumps": ["P1220", "P1140"]}, {"id": "P1220", "text": ["When serial transfer is used, one clock pulse is needed to transfer each bit of data."], "jumps": ["P1230", "P1140"]}, {"id": "P1230", "text": ["If the clock pulses continue, the data transfers out of the register one bit at a time. Touch NEXT and observe clock pulses T5 through T8."], "jumps": ["P1232", "P1140"]}, {"id": "P1232", "text": [], "jumps": []}, {"id": "P1233", "text": [], "jumps": []}, {"id": "P1234", "text": [], "jumps": []}, {"id": "P1235", "text": [], "jumps": ["P1240", "P1230"]}, {"id": "P1240", "text": ["1011 was shifted out one bit at a time.  The register now contains 0000.", "1011 was shifted out one bit at a time. The register now contains 0000."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["The circulate path allows the register to store data.  The contents of the register are not lost when shifted to the output.", "The circulate path allows the register to store data. The contents of the register are not lost when shifted to the output.c"], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["The Circulate/Load switch, S1, selects data from the circulate (feedback) path or from the load (data input) path."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["Four clock pulses will shift the registers data to the next circuit in line AND feed the data back to the register."], "jumps": ["P1280", "P1250"]}, {"id": "P1280", "text": ["The next four clock pulses send the same data to the next circuit and feed the data back to the register."], "jumps": ["P1290", "P1250"]}, {"id": "P1290", "text": ["Placing S1 to the LOAD position disconnects the circulate path and new data is loaded into the register."], "jumps": ["P1300", "P1250"]}, {"id": "P1300", "text": ["At T0 the content of the register is 0000.  What is the content of the register at T3?", "At T0 the content of the register is 0000. What is the content of the register at T3?"], "jumps": ["P1250"]}, {"id": "P1301", "text": [], "jumps": []}, {"id": "P1302", "text": ["The register transfers one bit in for each clock pulse.  After 3 pulses only 3 bits of new data have transferred.", "The register transfers one bit in for each clock pulse. After 3 pulses only 3 bits of new data have transferred."], "jumps": []}, {"id": "P1310", "text": ["At T0 the content of the register is 0000.  What is the content of the register at T3?", "At T0 the content of the register is 0000. What is the content of the register at T3?"], "jumps": ["P1300"]}, {"id": "P1311", "text": [], "jumps": []}, {"id": "P1312", "text": ["The register transfers one bit in for each clock pulse.  After 3 pulses only 3 bits of new data have transferred.", "The register transfers one bit in for each clock pulse. After 3 pulses only 3 bits of new data have transferred."], "jumps": []}, {"id": "P1320", "text": ["At T0 the content of the register is 1111.  What is the content of the register at T2?", "At T0 the content of the register is 1111. What is the content of the register at T2?"], "jumps": ["P1310"]}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1322", "text": ["The register transfers one bit in for each clock pulse.  After 2 pulses only 2 bits of new data have transferred.", "The register transfers one bit in for each clock pulse. After 2 pulses only 2 bits of new data have transferred."], "jumps": []}, {"id": "P1330", "text": ["Next, let's look at a parallel storage register.", "Next, let's look at a parallel storage register............"], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["This parallel 4 bit storage register uses four Type D edge triggered flip-flops connected to the same clock input."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["The register has a separate input applied to each flip-flop's D input."], "jumps": ["P1360", "P1330"]}, {"id": "P1360", "text": ["These separate inputs allow 4 bits of data to enter into the register on each clock pulse."], "jumps": ["P1370", "P1330"]}, {"id": "P1370", "text": ["A separate output is taken from each flip-flop's Q output.", "A separate output is taken from each flip-flop's Q output.m"], "jumps": ["P1380", "P1330"]}, {"id": "P1380", "text": ["These separate outputs allow 4 bits of data to leave the register on each clock pulse."], "jumps": ["P1390", "P1330"]}, {"id": "P1390", "text": ["Each time the clock pulse goes high, all four flip-flops change state according to their input."], "jumps": ["P1400", "P1330"]}, {"id": "P1400", "text": ["Assume all flip-flops are reset and the contents of the register is 0000."], "jumps": ["P1410", "P1330"]}, {"id": "P1410", "text": ["Let's use the binary number 1011 to demonstrate how data is stored and transferred through a 4 bit parallel register."], "jumps": ["P1420", "P1330"]}, {"id": "P1420", "text": ["When the clock goes high, each flip-flop is enabled.  Any data on the input is transferred to the register and to the output.", "When the clock goes high, each flip-flop is enabled. Any data on the input is transferred to the register and to the output."], "jumps": ["P1430", "P1330"]}, {"id": "P1430", "text": ["When parallel transfer is used, only one clock pulse is needed to transfer all 4 bits of data."], "jumps": ["P1440", "P1330"]}, {"id": "P1440", "text": ["At T0 the content of the register is 0000.  What is the content of the register at T1?", "At T0 the content of the register is 0000. What is the content of the register at T1?"], "jumps": ["P1330"]}, {"id": "P1441", "text": [], "jumps": []}, {"id": "P1442", "text": ["All bits are transferred to the register on each clock pulse.  After one pulse all new data is transferred.", "All bits are transferred to the register on each clock pulse. After one pulse all new data is transferred."], "jumps": []}, {"id": "P1450", "text": ["At T0 the content of the register is 1111.  What is the content of the register at T1?", "At T0 the content of the register is 1111. What is the content of the register at T1?"], "jumps": ["P1440"]}, {"id": "P1451", "text": [], "jumps": []}, {"id": "P1452", "text": ["All bits are transferred to the register on each clock pulse.  After one pulse all new data is transferred.", "All bits are transferred to the register on each clock pulse. After one pulse all new data is transferred."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on 4 BIT STORAGE REGISTER.", "This completes the information on 4 BIT STORAGE REGISTER..."], "jumps": ["P1001", "P1450"]}, {"id": "P1920", "text": ["1.  The 4 bit storage register is designed to temporarily store four      bits of data.", "1. The 4 bit storage register is designed to temporarily store four bits of data."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  A serial register transfers one bit in or out for each clock pulse.", "2. A serial register transfers one bit in or out for each clock pulse."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  In a serial storage register, circulate is used so that the data is       stored when the data is shifted out.", "3. In a serial storage register, circulate is used so that the data is stored when the data is shifted out."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  A parallel register transfers all bits on one clock pulse.  The            outputs are always available.", "4. A parallel register transfers all bits on one clock pulse. The outputs are always available."], "jumps": ["P1999", "P1940"]}, {"id": "P1999", "text": ["You have completed the Summary.  You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1950"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["This experiment demonstrates the operation of a 4 bit storage register.  You will enter data and probe the outputs of the register to verify correct operation.", "This experiment demonstrates the operation of a 4 bit storage register. You will enter data and probe the outputs of the register to verify correct operation."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["Pick up the PC130-118 card.  The purpose of this card is to demonstrate the operation of a 4 bit storage register.", "Pick up the PC130-118 card. The purpose of this card is to demonstrate the operation of a 4 bit storage register."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["The PC130-111 Clock/Pulser Card is used to supply the clock and data inputs to the register."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["S1 on PC130-118 selects between LOAD and CIRCULATE. S2 clears the register and resets the flip-flops."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["IC1 and IC2 are dual Type D positive (Leading) edge triggered flip-flops."], "jumps": ["P2075", "P2040"]}, {"id": "P2075", "text": ["IC1 contains flip-flops A and B, IC2 contains flip-flops C and D."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["LEDs QA, QB, QC and QD are parallel output indicators representing the Q outputs of the four flip-flops."], "jumps": ["P2090", "P2040"]}, {"id": "P2090", "text": ["DATA IN and DATA OUT uses serial transfer of data.  Let's start the experiment.", "DATA IN and DATA OUT uses serial transfer of data. Let's start the experiment."], "jumps": ["P2100", "P2040"]}, {"id": "P2100", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2040"]}, {"id": "P2110", "text": ["2.  Set the Voltmeter Switch to Positive. \n3.  Set the Positive Supply Voltage to 5. The Test Console's                  Voltage Meter should indicate 5 volts.", "2. Set the Voltmeter Switch to Positive. 3. Set the Positive Supply Voltage to 5. The Test Console's Voltage Meter should indicate 5 volts. = SCAN FCC 0 External program = SCAN PWR 0 12"], "jumps": ["P2100"]}, {"id": "P2120", "text": ["4.  Carefully plug PC130-111 into the Test Console PC1 position.  5.  Carefully plug PC130-118 into the Test console PC2 position.", "4. Carefully plug PC130-111 into the Test Console PC1 position. 5. Carefully plug PC130-118 into the Test console PC2 position. External program = SCAN FTR 0 C1 00 External program = SCAN FTR 0 F1 14"], "jumps": ["P2110"]}, {"id": "P2130", "text": ["6.  Set S2 to PULSER and S3 to 1 on PC130-111. \n7.  Set S1 to LOAD on PC130-118.  \n8.  Connect the logic probe to PC130-111.", "6. Set S2 to PULSER and S3 to 1 on PC130-111. 7. Set S1 to LOAD on PC130-118. 8. Connect the logic probe to PC130-111."], "jumps": ["P2140", "P2120", "P2135"]}, {"id": "P2135", "text": ["EXPERIMENT CARD PC130-111 - S2 - Pulser S3 - 1 Connect the logic probe EXPERIMENT CARD PC130-118 - S1 - LOAD"], "jumps": []}, {"id": "P2140", "text": ["9.  Set PC1 and PC2 DC Power switches to ON.", "9. Set PC1 and PC2 DC Power switches to ON................................"], "jumps": ["P2130"]}, {"id": "P2150", "text": ["The experiment is now set up.  Let's verify the loading operation of a 4 bit storage register.", "The experiment is now set up. Let's verify the loading operation of a 4 bit storage register."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["1.  Press and release S2 on PC130-118.  \n2.  Probe the QA, QB, QC and QD outputs.  Are all the outputs              LOW or HIGH?", "1. Press and release S2 on PC130-118. 2. Probe the QA, QB, QC and QD outputs. Are all the outputs LOW or HIGH?"], "jumps": ["P2150", "P2162", "P2165"]}, {"id": "P2161", "text": [], "jumps": []}, {"id": "P2162", "text": ["You should have measured all lows. Check:", "You should have measured all lows. Check: - PC130-118 in PC2 position. - PC130-118 S2 pressed and released. - With your instructor.", "- PC130-118 in PC2 position. - PC130-118 S2 pressed and released. - With your instructor."], "jumps": []}, {"id": "P2165", "text": ["EXPERIMENT CARD PC130-118 - Press and Release S2 Probe QA, QB, QC and QD outputs."], "jumps": []}, {"id": "P2167", "text": ["Your answer is incorrect.  You should have measured all lows.", "Your answer is incorrect. You should have measured all lows..0mA."], "jumps": ["PutVar"]}, {"id": "P2170", "text": ["3.  Probe the DATA IN and CLOCK TPs on PC130-118.", "3. Probe the DATA IN and CLOCK TPs on PC130-118...........", "A high is measured on DATA IN. Since CLOCK is low, the high or binary number 1 is not transferred into the register."], "jumps": ["P2180", "P2160", "P2175"]}, {"id": "P2175", "text": ["EXPERIMENT CARD PC130-118 - Probe the DATA In and CLOCK Tps"], "jumps": []}, {"id": "P2180", "text": ["4.  Place your logic probe on the CLOCK TP of PC130-118. \n5.  While observing the output LEDs and the logic probe, press          and release S1 on PC130-111.", "4. Place your logic probe on the CLOCK TP of PC130-118. 5. While observing the output LEDs and the logic probe, press and release S1 on PC130-111.", "When CLOCK goes high, the high on DATA IN is transferred to the register. QA LED illuminates. d into the register."], "jumps": ["P2190", "P2170", "P2185"]}, {"id": "P2185", "text": ["EXPERIMENT CARD PC130-111 - Press and release S1 EXPERIMENT CARD PC130-118 - Place the logic probe on CLOCK TP"], "jumps": []}, {"id": "P2190", "text": ["6.  Observe the output LEDs on PC130-118.  Press S1 on PC130-       111 three times. \n7.  Probe outputs QA, QB, QC and QD.  Are all the outputs LOW          or HIGH?", "6. Observe the output LEDs on PC130-118. Press S1 on PC130- 111 three times. 7. Probe outputs QA, QB, QC and QD. Are all the outputs LOW or HIGH???"], "jumps": ["P2180", "P2192", "P2195"]}, {"id": "P2191", "text" let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
