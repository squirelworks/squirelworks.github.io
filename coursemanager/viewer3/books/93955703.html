<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Discuss characteristics of a loaded and unloaded AC motor. w Discuss inductive and capacitive Run/Start AC motors."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about AC motor characteristics."], "jumps": ["P300", "P410"]}, {"id": "P410", "text": ["AC motors are very popular in industry because AC power is readily available."], "jumps": ["P400", "P420"]}, {"id": "P420", "text": ["AC motors are used when low starting currents are more important than speed control."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["The AC induction motor is the most commonly used motor when low starting current is a characteristic."], "jumps": ["P420", "P440"]}, {"id": "P440", "text": ["Let's begin the lesson on AC MOTORS CHARACTERISTICS......................."], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Recall, AC motors are constructed from pole pairs and a rotor."], "jumps": ["P1001", "P1030"]}, {"id": "P1030", "text": ["Two powers, each of a different phase are applied to the stator poles."], "jumps": ["P1020", "P1040"]}, {"id": "P1040", "text": ["This sets up a rotating magnetic field around the rotor which produces motor action."], "jumps": ["P1020", "P1050"]}, {"id": "P1050", "text": ["Stator field rotation, called synchronized speed, is calculated by:", "= frequency of the AC sine wave N = number of rotor pole pairs."], "jumps": ["P1020", "P1070"]}, {"id": "P1070", "text": ["Rotor rotation or shaft speed, is never as great as synchronous speed."], "jumps": ["P1050", "P1080"]}, {"id": "P1080", "text": ["The rotor is always trying to catch up or synchronize with the stator field speed."], "jumps": ["P1070", "P1090"]}, {"id": "P1090", "text": ["Slip Speed = Synchronous Speed - Shaft Speed", "The difference between synchronous speed and shaft speed is called slip speed or slip RPM."], "jumps": ["P1070", "P1100"]}, {"id": "P1100", "text": ["Slip speed is how much the shaft speed lags behind the stator field speed."], "jumps": ["P1090", "P1110"]}, {"id": "P1110", "text": ["Synchronous speed is the same as _______..................."], "jumps": ["P1090"]}, {"id": "P1111", "text": [], "jumps": []}, {"id": "P1112", "text": ["Slip speed is the difference between synchronous speed and rotor speed."], "jumps": []}, {"id": "P1113", "text": ["Shaft speed and rotor speed are the same..................."], "jumps": []}, {"id": "P1115", "text": ["Let's look at the relationship between the following AC induction motor characteristics: motor RPM, stator current and torque."], "jumps": ["P1110", "P1120"]}, {"id": "P1120", "text": ["Torque Stator Current Speed in RPM", "An AC motor has a unique relationship when comparing load to the following: motor RPM, stator current and torque."], "jumps": ["P1115", "P1130"]}, {"id": "P1130", "text": ["Notice that as the load on the motor increases toward the rated load, stator current and torque increase."], "jumps": ["P1120", "P1140"]}, {"id": "P1140", "text": ["At the rated load, RPM drops to between 85 and 95% of the synchronous speed."], "jumps": ["P1120", "P1150"]}, {"id": "P1150", "text": ["The point where torque and RPM cross is the rated load RPM stated on many AC motors."], "jumps": ["P1120", "P1155"]}, {"id": "P1155", "text": ["Increasing the load beyond the motor's rating will increase torque to maximum, while RPM remains relatively steady."], "jumps": ["P1120", "P1160"]}, {"id": "P1160", "text": ["Unlike a DC motor, an AC motor has a peak torque that is not at maximum load (locked rotor).f"], "jumps": ["P1120", "P1165"]}, {"id": "P1165", "text": ["As the load is increased further, motor torque decreases."], "jumps": ["P1120", "P1168"]}, {"id": "P1168", "text": ["This causes a rapid drop in RPM until the rotor is locked."], "jumps": ["P1120", "P1170"]}, {"id": "P1170", "text": ["Low torque when the load is maximum increases the motor starting current. This is a prime reason for using AC induction motors."], "jumps": ["P1120", "P1190"]}, {"id": "P1190", "text": ["In an AC induction motor, as the load increases towards maximum rating, _______"], "jumps": ["P1120"]}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1192", "text": ["Both torque and stator current increase as the motor load increases."], "jumps": []}, {"id": "P1200", "text": ["AC induction motors are typically classified as one phase, two phase or three phase machines."], "jumps": ["P1190", "P1203"]}, {"id": "P1203", "text": ["The classification is determined by the number of input power phases required to operate the motor."], "jumps": ["P1200", "P1204"]}, {"id": "P1204", "text": ["You have seen how a two phase AC induction motor operates."], "jumps": ["P1200", "P1206"]}, {"id": "P1206", "text": ["A three phase AC induction motor works the same............"], "jumps": ["P1200", "P1208"]}, {"id": "P1208", "text": ["The difference is 3 stator winding pairs 120", "apart are used instead of 2 winding pairs 90"], "jumps": ["P1206", "P1214"]}, {"id": "P1210", "text": ["Since it takes at least two pairs of stators to produce a rotating magnetic field, how does this motor operate? And how does the motor turn in same direction every time?"], "jumps": ["P1216", "P1214"]}, {"id": "P1214", "text": ["Note that the AC motors in your house are single phase....."], "jumps": ["P1206", "P1210"]}, {"id": "P1216", "text": ["Phase shifts occur due to different R-L configurations in the windings. The start inductor winding is also physically placed 90"], "jumps": ["P1220", "P1210"]}, {"id": "P1220", "text": ["Once rotation has begun, the start inductor is taken out of the circuit by a centrifugal switch.The splitting is accomplished by connecting 2 stator poles across the 1 phase input power in parallel."], "jumps": ["P1230", "P1216"]}, {"id": "P1230", "text": ["Note that R indicates the resistance of the stator windings and L indicates the inductance."], "jumps": ["P1216", "P1240"]}, {"id": "P1240", "text": ["By making the reactance of each pole different, the phase of the pole currents will be different."], "jumps": ["P1216", "P1250"]}, {"id": "P1250", "text": ["Remember, the pole currents are the cause of magnetic flux."], "jumps": ["P1216", "P1260"]}, {"id": "P1260", "text": ["For example, pole #1 has high resistance and low inductance. A phase shift between the input voltage and the current of pole 1 is produced."], "jumps": ["P1270", "P1216"]}, {"id": "P1270", "text": ["This small phase shift is due to pole #1 being more resistive."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["Pole #2 has high inductance and less resistance. High R R 1 Input I#1 Low"], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["Because pole #2 is mostly inductive, a large phase shift is set up between voltage and current. EA Phase I#1 I#2"], "jumps": ["P1300", "P1260"]}, {"id": "P1300", "text": ["Notice the phase difference between pole #1 and pole #2. ase"], "jumps": ["P1310", "P1260"]}, {"id": "P1310", "text": ["Now there are 2 phases, 1 on each pole pair. This causes motor action and ensures start rotates in the same direction..."], "jumps": ["P1320", "P1260"]}, {"id": "P1320", "text": ["This type of split phase AC induction motor is called an inductor run motor. This is one of the two usual methods of star h", "This type of split phase AC induction motor is called an inductor run motor. This is one of the two usual methods of starting split phase AC motors."], "jumps": ["P1330", "P1260"]}, {"id": "P1330", "text": ["In the schematic, the resistance is not shown. You must remember that the two poles are wound differently."], "jumps": ["P1320", "P1340"]}, {"id": "P1340", "text": ["Another type of split phase induction motor is the capacitor run motor. Pole #2 1 Input Pole #1 Rotor"], "jumps": ["P1320", "P1350"]}, {"id": "P1350", "text": ["The difference is the addition of a capacitor in series to one of the pole pairs."], "jumps": ["P1340", "P1360"]}, {"id": "P1360", "text": ["Vector diagrams show the capacitor run motor has a larger phase difference than the inductor run motor. I#2 EA Phase EA I#1 Phase I#2 I#1"], "jumps": ["P1370", "P1340"]}, {"id": "P1370", "text": ["A large phase difference produces high start torque."], "jumps": ["P1360", "P1380"]}, {"id": "P1380", "text": ["Torque Stator Current Speed in RPM", "Recall that AC induction motors have small starting torques. M Synchronous Chart Key Speed * - Torque * - Stator Current * - Speed in RPM"], "jumps": ["P1360", "P1390"]}, {"id": "P1390", "text": ["Because of the increased start torque, capacitor run AC induction motors are used for heavy load applications."], "jumps": ["P1380", "P1430"]}, {"id": "P1430", "text": ["Like the inductor start method, a centrifugal switch is incorporated in the start circuit.or Start Start Start Run Rotor Run Rotor Capacitor Centrifugal Centrifugal Switch Switch"], "jumps": ["P1440", "P1390"]}, {"id": "P1440", "text": ["Once the motor reaches synchronous speed, the centrifugal switch opens, disconnecting the start windings."], "jumps": ["P1430", "P1450"]}, {"id": "P1450", "text": ["Since only the run windings are used, power consumption decreases."], "jumps": ["P1430", "P1910"]}, {"id": "P1910", "text": ["This completes the information on AC MOTOR CHARACTERISTICS..."], "jumps": ["P1450", "P1001"]}, {"id": "P1920", "text": ["1. Stator field rotation is called synchronous speed and can be calculated by::", "= frequency of the AC sine wave N = number of rotor pole pairs."], "jumps": ["P1001", "P1930"]}, {"id": "P1930", "text": ["2. Motor output shaft speed is also the rotor speed. The difference between synchronous speed and shaft speed is called slip speed..", "Slip Speed = Synchronous Speed - Shaft Speed"], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["Torque Stator Current Speed in RPM", "3. An AC motor has a unique relationship between motor RPM, stator current and torque -vs- load. onous Chart Key Speed * - Torque * - Stator Current"], "jumps": ["P1930", "P1950"]}, {"id": "P1950", "text": ["4. A split phase motor produces out of phase current from a single phase source. 1 Winding R R Run AC Input Winding Low High L L"], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. An inductive start motor has two inductive branches and produces a relatively small phase difference. SS Rotor"], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6. A capacitive start motor has a series capacitor in the start branch. otor"], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7. The capacitive reactance produces a start current that causes a large phase difference between the start and run branches. ase EA I#1 Capacitor Run"], "jumps": ["P1970", "P1999"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1980", "P1001"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["An AC motor is typically described as a one, two or three _______ motor. #"], "jumps": []}, {"id": "P10211", "text": ["Stator field rotation is also called _______ c"], "jumps": []}, {"id let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");

    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }

    stage.appendChild(p);

  if (page.jumps.length) {

}
