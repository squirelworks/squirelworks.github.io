const book = {"title": "93957204", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: NATURE OF POSITION asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": ["Hello, this lesson is about:s about: about:"], "jumps": []}, {"id": "P100", "text": ["w Define position. w Describe positional devices.", "w Describe the characteristics of prime movers. w Calculate various output quantities of prime movers..............."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about position.  If you start at one location and move to another, you are dealing with position.", "In this lesson, you will learn about position. If you start at one location and move to another, you are dealing with position..."], "jumps": ["P420", "P300"]}, {"id": "P420", "text": ["Movement of position requires motion."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["When dealing with motion, distance is used only to calculate velocity, acceleration, and deceleration."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["In motion the main concerns are velocity, acceleration, and deceleration."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["When dealing with position the main concern is the starting and ending point of an object."], "jumps": ["P470", "P430"]}, {"id": "P470", "text": ["Let's begin the lesson on NATURE OF POSITION.............................."], "jumps": ["P450"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1015", "text": ["Position describes the location of an object.", "Position describes the location of an object..............."], "jumps": ["P1020", "P1001"]}, {"id": "P1020", "text": ["The position of an object is defined in terms of one, two, or three dimensions in respect to a reference."], "jumps": ["P1030", "P1015"]}, {"id": "P1030", "text": ["Here, the position of the object is defined using one dimension.", "0 1 2 3 4 5 666666666"], "jumps": ["P1040", "P1015"]}, {"id": "P1040", "text": ["The car's position is 3 in respect to zero."], "jumps": ["P1050", "P1015"]}, {"id": "P1050", "text": ["An assembly line is a typical example of one dimensional position."], "jumps": ["P1060", "P1015"]}, {"id": "P1070", "text": ["The position is \"(3,3)''  with respect to zero.", "The position is \"(3,3)'' with respect to zero."], "jumps": ["P1080", "P1060"]}, {"id": "P2113", "text": ["Ft \u0095 Lbs is the unit of measure for torque or force.", "Lbs is the unit of measure for torque or force........"], "jumps": []}, {"id": "P2110", "text": ["What term describes the distance per unit of time in a prime mover?"], "jumps": ["P2100"]}, {"id": "P10210", "text": ["A change in velocity per change in time. U", "A change in distance per change in time."], "jumps": []}, {"id": "P1080", "text": ["A typical example is an X-Y plotter which positions a stylus on a flat plane to draw various forms."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["Another form of two dimensional position is related to circular motion."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["Position is expressed in degrees or radians from a reference point."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["A typical example is a radar scope that indicates the bearing of an object."], "jumps": ["P1120", "P1090"]}, {"id": "P1120", "text": ["This object is defined using three dimensions (X,Y,Z).  X is width, Y is depth, and Z is height.", "A typical example of three dimensional use is a sonar device that detects the position of submarines.", "This object is defined using three dimensions (X,Y,Z). X is width, Y is depth, and Z is height."], "jumps": ["P1150", "P1090"]}, {"id": "P1160", "text": ["What describes the location of an object with respect to a reference?"], "jumps": ["P1150"]}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1162", "text": ["Motion describes the movement of an object, position is not movement."], "jumps": []}, {"id": "P1163", "text": ["Velocity is a measure of movement, position is not movement."], "jumps": []}, {"id": "P1170", "text": ["Touch the diagram that describes the position of an object using two dimensions."], "jumps": ["P1160"]}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1172", "text": ["You touched a one dimensional position indicator.  Notice that the object can only be described using one value.", "You touched a one dimensional position indicator. Notice that the object can only be described using one value."], "jumps": []}, {"id": "P1173", "text": ["You touched a three dimensional position indicator.  Notice that the object can be described using three values.", "You touched a three dimensional position indicator. Notice that the object can be described using three values.."], "jumps": []}, {"id": "P1180", "text": ["Position electronics consists of two general areas.", "Position electronics consists of two general areas........."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["Generator devices cause a change in position.  They are called position or motion generators.", "Generator devices cause a change in position. They are called position or motion generators."], "jumps": ["P1210", "P1180"]}, {"id": "P1210", "text": ["Analog generators include DC, AC servo motors, synchros and transmitting devices.", "DC Servos AC Servos Synchros Transmittersrmitterrrrr"], "jumps": ["P1220", "P1180"]}, {"id": "P1220", "text": ["These devices rotate from one point to another according to an analog input signal."], "jumps": ["P1230", "P1180"]}, {"id": "P1230", "text": ["Digital position generators are stepper motors.", "Digital position generators are stepper motors.............", "DC Servos AC Servos Synchros Transmittersrmitterrrrr"], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["Steppers rotate from one point to another according to a digital input signal."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["Position generators are motors and their characteristics are similar to motion generators.", "DC Servos AC Servos Synchros Transmittersrmitterrrrr"], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["Sensors are devices that detect a change in position.  Position sensors indicate the position of an object.", "Sensors are devices that detect a change in position. Position sensors indicate the position of an object.", "DC Servos AC Servos Synchros Transmittersrmitterrrrr"], "jumps": ["P1280", "P1250"]}, {"id": "P1280", "text": ["Analog position sensors are resolvers, synchros, and variable transducers.", "Resolvers Synchro Receivers Variable Transducers"], "jumps": ["P1290", "P1250"]}, {"id": "P1290", "text": ["Sensors receive a mechanical input from a position generator and produce an analog output.  This output represents the position.", "Sensors receive a mechanical input from a position generator and produce an analog output. This output represents the position."], "jumps": ["P1300", "P1250"]}, {"id": "P1300", "text": ["Digital position sensors are encoders.", "Digital position sensors are encoders......................", "Resolvers Synchro Receivers Variable Transducers"], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["Encoders are rotated by position generators.  Their output is a digital signal that represents position.", "Encoders are rotated by position generators. Their output is a digital signal that represents position."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["Position generators and position sensors are opposite.", "Position generators and position sensors are opposite......"], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["Position generators use an electrical signal for the input and produce a mechanical output."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["Position sensors use a mechanical input to produce an electrical output."], "jumps": ["P1350", "P1320"]}, {"id": "P1350", "text": ["Position generators and sensors normally use feedback.", "Position generators and sensors normally use feedback......"], "jumps": ["P1360", "P1320"]}, {"id": "P1355", "text": ["FEEDBACK - Feedback is the control of the system.  Not all systems contain feedback.  Systems containing feedback are called Closed Loop Systems.", "FEEDBACK - Feedback is the control of the system. Not all systems contain feedback. Systems containing feedback are called Closed Loop Systems."], "jumps": []}, {"id": "P1360", "text": ["Feedback ensures a specified position is maintained."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["What type of position device is an encoder?", "What type of position device is an encoder?................"], "jumps": ["P1350"]}, {"id": "P1371", "text": [], "jumps": []}, {"id": "P1372", "text": ["Position generators are DC, AC servo motors, synchros and transmitters."], "jumps": []}, {"id": "P1380", "text": ["What type of position device uses a mechanical input and produces an electrical output?"], "jumps": ["P1370"]}, {"id": "P1381", "text": [], "jumps": []}, {"id": "P1382", "text": ["Position generators use an electrical input and produce a mechanical output."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on POSITION.", "This completes the information on POSITION. 1 TITLE........"], "jumps": ["P1380"]}, {"id": "P1920", "text": ["1.  Position describes the location of an object in respect to a              reference.", "1. Position describes the location of an object in respect to a reference."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  One, two, or three dimensions can be used.", "2. One, two, or three dimensions can be used.."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Position electronics has two general areas, generators and            sensors.", "3. Position electronics has two general areas, generators and sensors..."], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["4.  Position generators are basically motors that cause an object       to change position.  They are either analog or digital.", "4. Position generators are basically motors that cause an object to change position. They are either analog or digital......", "DC Servos AC Servos Synchros Transmittersrmitterrrrr"], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  Position generators are DC, AC servo motors, synchros and          transmitters.", "5. Position generators are DC, AC servo motors, synchros and transmitters.."], "jumps": ["P1970", "P1940"]}, {"id": "P1970", "text": ["6.  Position sensors are analog or digital devices that detect                position.", "6. Position sensors are analog or digital devices that detect position.", "Resolvers Synchro Receivers Variable Transducers", "DC Servos AC Servos Synchros Transmittersrmitterrrrr"], "jumps": ["P1980", "P1940"]}, {"id": "P1980", "text": ["7.  Position sensors are resolvers, synchro receivers, variable            transducers, and encoders.", "7. Position sensors are resolvers, synchro receivers, variable transducers, and encoders."], "jumps": ["P1990", "P1940"]}, {"id": "P1990", "text": ["8.  Most position systems use the output of a position sensor for       an input to a position generator.", "8. Most position systems use the output of a position sensor for an input to a position generator...."], "jumps": ["P1999", "P1940"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu..."], "jumps": ["P1990"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2015", "text": ["A prime mover is a position generator.", "A prime mover is a position generator......................"], "jumps": ["P2020", "P2001"]}, {"id": "P2020", "text": ["Nearly all prime movers produce an output that has circular motion."], "jumps": ["P2030", "P2015"]}, {"id": "P2030", "text": ["The motion is changed to different velocities or to linear motion depending on the type of position change needed."], "jumps": ["P2050", "P2015"]}, {"id": "P2050", "text": ["It is important to be able to calculate the output power of a prime mover."], "jumps": ["P2060", "P2030"]}, {"id": "P2060", "text": ["Power of a prime mover (motor) is equal to the force that turns the shaft times the distance the shaft moves."], "jumps": ["P2070", "P2030"]}, {"id": "P2070", "text": ["It's like electrical power, the force that moves electrons (voltage), times the movement of electrons (current), equals the amount of power (watts)."], "jumps": ["P2080", "P2030"]}, {"id": "P2080", "text": ["In motors, the force that turns the shaft or twisting action is measured in Ft \u0095 Lbs, called torque or T.", "In motors, the force that turns the shaft or twisting action is measured in Ft"], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["Distance is the change in position per unit of time, which is calculated from RPM or revolutions per minute."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["What term describes the force to turn a prime mover?", "What term describes the force to turn a prime mover?......."], "jumps": ["P2080"]}, {"id": "P2101", "text": [], "jumps": []}, {"id": "P2102", "text": ["RPM is a measure of distance per unit of time, it is not a measure of force in a prime mover."], "jumps": []}, {"id": "P2103", "text": ["Velocity is a measure of the change in distance per change in time, it is not a measure of force in a prime mover."], "jumps": ["P2100"]}, {"id": "P10214", "text": ["What term describes the location of an object with respect to a reference?"], "jumps": []}, {"id": "P2111", "text": [], "jumps": []}, {"id": "P2112", "text": ["Torque is a measure of force that causes the shaft of a prime mover to rotate.  It is not a measure of distance per unit of time.", "Torque is a measure of force that causes the shaft of a prime mover to rotate. It is not a measure of distance per unit of time."], "jumps": ["P2110"]}, {"id": "P2113", "text": ["Ft \u0095 Lbs is the unit of measure for torque or force.", "Lbs is the unit of measure for torque or force........"], "jumps": []}, {"id": "P2120", "text": ["The power of a prime mover is the force times the distance per unit time.", "r Power = (Distance", "r) Distance/Time = 2 r (RPM", "60) Power = 2 r (RPM", "r) Power = (T x RPM)"], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["Force, or T, is measured in Ft \u0095 Lbs at the circumference of the prime mover's shaft.  This is where the force does work.", "Lbs at the circumference of the prime mover's shaft. This is where the force does work."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["Force is equal to the torque of the prime mover in Ft \u0095 Lbs divided by the radius of the shaft in inches or feet.", "Force is equal to the torque of the prime mover in Ft", "Lbs divided by the radius of the shaft in inches or feet.", "r Power = (Distance", "r) Distance/Time = 2 r (RPM", "60) Power = 2 r (RPM", "r) Power = (T x RPM)"], "jumps": ["P2150", "P2120"]}, {"id": "P2150", "text": ["This reduces the power formula to:", "r Power = (Distance", "r) nce/Time = 2 r (RPM", "60) Power = 2 r (RPM", "r) Power = (T x RPM)"], "jumps": ["P2160", "P2120"]}, {"id": "P2160", "text": ["Recall that distance of a rotating shaft equals the circumference times the RPM divided by 60 (the 60 changes minutes to seconds).", "r Power = (Distance", "r) Distance/Time = 2 r (RPM", "60) Power = 2 r (RPM", "r) Power = (T x RPM)"], "jumps": ["P2170", "P2120"]}, {"id": "P2170", "text": ["This reduces the power formula to:", "r Power = (Distance", "r) Distance/Time = 2 r (RPM", "60) Power = 2 r (RPM", "r) wer = (T x RPM)"], "jumps": ["P2180", "P2120"]}, {"id": "P2180", "text": ["Combining and reducing the formula gives:", "r Power = (Distance", "r) Distance/Time = 2 r (RPM", "60) Power = 2 r (RPM", "r) Power = (T x RPM)"], "jumps": ["P2190", "P2120"]}, {"id": "P2190", "text": ["Power of a prime mover equals the torque times RPM divided by 9.55.", "r Power = (Distance", "r) Distance/Time = 2 r (RPM", "60) Power = 2 r (RPM", "r) Power = (T x RPM)"], "jumps": ["P2200", "P2120"]}, {"id": "P2200", "text": ["Most prime movers and motors have power measured in horsepower, or HP for short."], "jumps": ["P2210", "P2120"]}, {"id": "P2210", "text": ["The term horsepower is derived from an old standard that measured the amount of weight one horse could lift one foot in one second."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["At the time the average horse was able to lift 550 Lbs one foot in one second.  So HP is 550 Ft \u0095 Lbs/sec.", "At the time the average horse was able to lift 550 Lbs one foot in one second. So HP is 550 Ft"], "jumps": ["P2230", "P2200"]}, {"id": "P2230", "text": ["This makes the prime mover power formula:", "This makes the prime mover power formula:.................."], "jumps": ["P2240", "P2200"]}, {"id": "P2240", "text": ["What is the horsepower of a prime mover that is rotating at 1000 RPM and has 40 Ft \u0095 Lbs of torque?", "What is the horsepower of a prime mover that is rotating at 1000 RPM and has 40 Ft"], "jumps": ["P2230"]}, {"id": "P2241", "text": [], "jumps": []}, {"id": "P2242", "text": ["You did not multiply the torque and RPM before dividing by 5252.5."], "jumps": []}, {"id": "P2243", "text": ["You divided 5252.5 by RPM times torque and placed the decimal point in the wrong position."], "jumps": []}, {"id": "P2245", "text": ["HORSEPOWER - Horse power equals the RPM times the torque divided by 5252.5."], "jumps": []}, {"id": "P2250", "text": ["Horsepower is important because most prime movers do not position an object directly."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["The driven shaft is used to move the prime mover."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["This allows different applications of the prime mover using one type of driven shaft."], "jumps": ["P2280", "P2250"]}, {"id": "P2280", "text": ["The torque, speed, or direction can be changed by using a different prime mover radius."], "jumps": ["P2290", "P2250"]}, {"id": "P2290", "text": ["In all cases, the driven shafts HP (power in) must equal the prime mover HP (power out)."], "jumps": ["P2300", "P2250"]}, {"id": "P2300", "text": ["Knowing that power in equals power out, the torque and RPM of the prime mover can be calculated by only knowing the characteristics of the driven shaft."], "jumps": ["P2310", "P2250"]}, {"id": "P2310", "text": ["The formulas for the output torque and RPM are found by using the ratio of the radius times the input values."], "jumps": ["P2320", "P2250"]}, {"id": "P2320", "text": ["These formulas work because power in equals power out."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["Torque and RPM depend on the radius of the shaft."], "jumps": ["P2340", "P2310"]}, {"id": "P2340", "text": ["For example, if a driven shaft has a radius of 1 inch at 1000 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
