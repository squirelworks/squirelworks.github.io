................"], "jumps": ["P2340", "P2270"]}, {"id": "P2110", "text": ["Algorithms sometimes have questions or decisions in the process...ecisions in the process."], "jumps": ["P2090", "P2120"]}, {"id": "P2120", "text": ["The flowchart symbol for questions and decisions is the diamond."], "jumps": ["P2110", "P2130"]}, {"id": "P2130", "text": ["As the name flowchart implies, the steps of the algorithm are shown in sequence...hown in sequence.."], "jumps": ["P2110", "P2140"]}, {"id": "P2140", "text": ["The line with a arrow head is used to indicate the flow from one point to another in a flowchart."], "jumps": ["P2130", "P2150"]}, {"id": "P2150", "text": ["Sometimes flowcharts are very large and can not be placed on one page.....one page."], "jumps": ["P2130", "P2160"]}, {"id": "P2160", "text": ["A circle indicates that the flow of the algorithm continues without the line and arrow head. A letter is placed inside the circle for identifying connection."], "jumps": ["P2150", "P2170"]}, {"id": "P2170", "text": ["Which symbol is used for processes?........................"], "jumps": ["P2150"]}, {"id": "P2171", "text": [], "jumps": []}, {"id": "P2172", "text": ["The symbol you picked is used for inputs and outputs......."], "jumps": []}, {"id": "P2173", "text": ["The symbol you picked is used for starts and ends.........."], "jumps": []}, {"id": "P2174", "text": ["The symbol you picked is used for questions and decisions.."], "jumps": []}, {"id": "P2180", "text": ["Which symbol is used for starts and ends of algorithms?...."], "jumps": ["P2170"]}, {"id": "P2181", "text": [], "jumps": []}, {"id": "P2182", "text": ["The symbol you picked is used for processes................"], "jumps": []}, {"id": "P2183", "text": ["The symbol you picked is used for inputs and outputs......."], "jumps": []}, {"id": "P1980", "text": ["Straight Line Repeating Steps Decision", "7. Algorithms have three types: aight Line Repeating Steps Decision"], "jumps": ["P1970", "P1999"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1980", "P1001"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2015", "text": ["A flowchart is a pictorial representation of algorithms. art Input Process Output Stop"], "jumps": ["P2001", "P2020"]}, {"id": "P2020", "text": ["It is a visual way of seeing if an algorithm works correctly."], "jumps": ["P2015", "P2030"]}, {"id": "P2030", "text": ["Flowcharts use specific symbols to represent the different types of operations in computers."], "jumps": ["P2015", "P2040"]}, {"id": "P2040", "text": ["Let's look at the different types of symbols used."], "jumps": ["P2015", "P2050"]}, {"id": "P2050", "text": ["Each flowchart must be finite, just like algorithms, and have a beginning and an end..g and an end."], "jumps": ["P2015", "P2060"]}, {"id": "P2060", "text": ["The flowchart symbol for start and end is the oval."], "jumps": ["P2050", "P2070"]}, {"id": "P2070", "text": ["The input and output operations of a computer are always included in algorithms...d in algorithms."], "jumps": ["P2050", "P2080"]}, {"id": "P2080", "text": ["The flowchart symbol of input and output is the parallelogram."], "jumps": ["P2070", "P2090"]}, {"id": "P2090", "text": ["The process of operations is always included in algorithms flowcharts...charts.."], "jumps": ["P2070", "P2100"]}, {"id": "P2100", "text": ["The flowchart symbol of a process is a rectangle."], "jumps": ["P2090", "P2110"]}, {"id": "P1521", "text": [], "jumps": []}, {"id": "P1522", "text": ["Clear means that nothing should be ambiguous and all terms and steps must be understood in only one way."], "jumps": []}, {"id": "P1523", "text": ["Specific means the algorithm must produce the desired output or results."], "jumps": []}, {"id": "P1530", "text": ["What type of algorithm uses a counter?....................."], "jumps": ["P1520"]}, {"id": "P1531", "text": [], "jumps": []}, {"id": "P1532", "text": ["Straight algorithms is the process of doing each step in order from the beginning to the end."], "jumps": []}, {"id": "P1533", "text": ["Decision algorithms produce different results depending on the outcome of the decision and a counter is not normally used."], "jumps": []}, {"id": "P1910", "text": ["You have completed the information on ALGORITHMS.LE........"], "jumps": ["P1530", "P1001"]}, {"id": "P1920", "text": ["1. Computers use three separate operations. put Process Output"], "jumps": ["P1001", "P1930"]}, {"id": "P1930", "text": ["2. Input is telling the computer what information is going to be used."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. Process is telling the computer what to do or how to solve problems."], "jumps": ["P1930", "P1950"]}, {"id": "P1950", "text": ["4. Output is giving the results of the process."], "jumps": ["P1930", "P1960"]}, {"id": "P1960", "text": ["5. Algorithms are the steps taken in the process block."], "jumps": ["P1930", "P1970"]}, {"id": "P1970", "text": ["Precise Clear Specific Finiteeee", "6. Algorithms must be: ecise Specific Clear Finite..."], "jumps": ["P1930", "P1980"]}, {"id": "P1370", "text": ["Again, M has 1 added ( becomes 4 ), Step 5, and is checked to see if it is equal or less than N."], "jumps": ["P1290", "P1380"]}, {"id": "P1380", "text": ["Now, M is greater than 3 so the next step is 7 send the product 6 out."], "jumps": ["P1290", "P1390"]}, {"id": "P1390", "text": ["To check the value of 3! we see that 1 x 2 x 3 is 6, the output product."], "jumps": ["P1290", "P1400"]}, {"id": "P1400", "text": ["The repeating algorithm allows N to be any number and the same seven steps can be used."], "jumps": ["P1290", "P1410"]}, {"id": "P1410", "text": ["Algorithm Step 1 : Sum = 0 Step 2 : Counter = 1 Step 3 : Input Number Step 4 : Sum = Sum + number Step 5 : Counter = Counter + 1 Step 6 : If counter N N go to Step 3 Step 7 : Average = Sum", "N Step 8 : Output Averageeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee", "Calculate an average of N number Input : N = 30 Value of 30 number Process : Calculate Average Output : Average utput: MPG", "Another type of repeating algorithm uses a counter. Step 1 : Sum = 0 Step 2 : Counter = 1 Step 3 : Input Number Step 4 : Sum = Sum + number Step 5 : Counter = Counter + 1 Step 6 : If counter N go to Step 3 Step 7 : Average = Sum N Step 8 : Output Average 8 : Output Average Step 8 : Output Average 8 : Output Averageep 8 : Output Average Step 8 : Output Average"], "jumps": ["P1290", "P1420"]}, {"id": "P1420", "text": ["The counter is set to 1, Step 2, a sum is found, Step 3, and a 1 is added to the counter each time a number is added to the sum, Step 5."], "jumps": ["P1410", "P1430"]}, {"id": "P1430", "text": ["Step 6 checks to see if the counter is greater than N. If it is all the numbers have been summed and step 7 is executed. Step 7 calculates the average and proceeds to step 8, send the product out."], "jumps": ["P1410", "P1440"]}, {"id": "P1440", "text": ["Calculate Gross pay, including overtime Input: Hours worked rate per hour Process: Calculate Gross pay Output: Gross pay utput : Average MPG", "The final type of algorithm is decision algorithms. tput : Gross payGross pay Output : Gross payculate Gross pay Output : Gross payCalculate Gross pay Output : Gross pay"], "jumps": ["P1410", "P1450"]}, {"id": "P1450", "text": ["Algorithm Step 1: Input Hours, rate Step 2: Set Overtime pay to 0 Step 3: Are hours 40? Yes, goto Step 4 No, goto Step 6 Step 4: Overtime pay = hours minus 40 times 1.5 times rate Step 5: Set hours to 40 Step 6: Regular pay = hours times rate Step 7: Gross pay = overtime pay + regular pay Step 8: Output Gross payeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee", "Decision algorithms yield different results depending on the outcome of the decision. Step 1: Input Hours, rate Step 2: Set Overtime pay to 0 Step 3: Are hours 40? Yes, goto Step 4 No, goto Step 6 Step 4: Overtime pay = hours minus 40 times 1.5 times rate Step 5: Set hours to 40 Step 6: Regular pay = hours times rate Step 7: Gross pay = overtime pay + regular pay Step 8: Output Gross pay"], "jumps": ["P1440", "P1460"]}, {"id": "P1460", "text": ["According to Step 3, if the hours are greater than 40, you go to Step 4 to find overtime pay."], "jumps": ["P1440", "P1470"]}, {"id": "P1470", "text": ["Then hours are set to 40, Step 5, regular pay is found, Step 6, and gross pay is found, Step 7."], "jumps": ["P1440", "P1480"]}, {"id": "P1480", "text": ["But, if the hours are 40 or less in Step 3, you go to Step 6, and calculate regular pay."], "jumps": ["P1440", "P1490"]}, {"id": "P1490", "text": ["Then add zero overtime pay, set in Step 2, to find gross pay, Step 7."], "jumps": ["P1440", "P1500"]}, {"id": "P1500", "text": ["There are two different calculations depending on the outcome of the decision."], "jumps": ["P1440", "P1510"]}, {"id": "P1510", "text": ["Precise Clear Specific Finiteeee", "You may have thought of a different set of algorithms for the examples. There are different variations, the important factor is that the algorithms are: Precise Clear Specific Finite"], "jumps": ["P1440", "P1520"]}, {"id": "P1520", "text": ["Which term means algorithms must have nothing assumed?....."], "jumps": ["P1510"]}, {"id": "P1240", "text": ["Algorithm Step 1. Input miles driven Step 2. Input gallons used Step 3. Divide miles driven by gallons used. Step 4. Output MPGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG", "Calculate Miles per Gallon Input: Miles driven Gallons used Process: Calculate MPG Output: MPG MPG Output: MPG", "The algorithm is the steps necessary to accomplish the process. gorithm Step 1. Input miles driven Step 2. Input gallons used Step 3. Divide miles driven by gallons used Step 4. Output MPGep 4. Output MPG Step 4. Output MPG Step 4. Output MPG Step 4. Output MPG"], "jumps": ["P1200", "P1250"]}, {"id": "P1250", "text": ["Notice that it took four steps to logically solve the process."], "jumps": ["P1240", "P1260"]}, {"id": "P1260", "text": ["You may find MPG in one step, miles driven divided by gallons used."], "jumps": ["P1240", "P1270"]}, {"id": "P1270", "text": ["Remember computers need to be told exactly what to do."], "jumps": ["P1240", "P1280"]}, {"id": "P1280", "text": ["An algorithm must be precise, clear, specific and finite."], "jumps": ["P1240", "P1290"]}, {"id": "P1290", "text": ["Algorithm Step 1 : Input 3 as N Step 2 : Set M = 1 Step 3 : Set Product = 1 Step 4 : Product = Product x M Step 5 : M = M + 1 Step 6 : if M N N , go to Step 4 Step 7 : Output productttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttt", "Calculate N! (N! = 1x2x3x....N) Input : N = 3 Process : Calculate 3! Output : Product Process: Calculate MPG Output: MPG Output: MPG", "Look at this algorithm, it is a repeating step algorithm. Step 1 : Input 3 as N Step 2 : Set M = 1 Step 3 : Set Product = 1 Step 4 : Product = Product x M Step 5 : M = M + 1 Step 6 : if M N , go to Step 4 Step 7 : Output product 7 : Output productStep 7 : Output product7 : Output product Step 7 : Output product"], "jumps": ["P1240", "P1300"]}, {"id": "P1300", "text": ["Notice how steps 4, 5, and 6 are repeated until the final product is obtained."], "jumps": ["P1290", "P1310"]}, {"id": "P1310", "text": ["The first time through M equals 1 (Step 2) and the product equals 1 (Step 3) so product times M equals 1 (Step 4)."], "jumps": ["P1290", "P1320"]}, {"id": "P1320", "text": ["Then M is increased by 1 ( becomes 2 ), Step 5, and checked if it is equal to or less than N (3), Step 6."], "jumps": ["P1290", "P1330"]}, {"id": "P1330", "text": ["Since N is equal to or less than N, 2 N 3, you return to Step 4.."], "jumps": ["P1290", "P1340"]}, {"id": "P1340", "text": ["The second time through the product, 1, is multiplied by 2, Step 4, producing a new product of 2."], "jumps": ["P1290", "P1350"]}, {"id": "P1350", "text": ["Again, M has 1 added (becomes 3), Step 5, and is checked to see if it is less than or equal to N in Step 6..."], "jumps": ["P1290", "P1360"]}, {"id": "P1360", "text": ["The third time through the product, 2, is multiplied by 3, Step 4, producing a new product of 6."], "jumps": ["P1290", "P1370"]}, {"id": "P1132", "text": ["The process operation is solving............................."], "jumps": []}, {"id": "P1133", "text": ["The output operation is getting the result from the process.."], "jumps": []}, {"id": "P1140", "text": ["As stated, the steps used in the process block are called algorithms."], "jumps": ["P1130", "P1150"]}, {"id": "P1150", "text": ["Algorithms must be precise. Nothing can be assumed and every term and step must be defined."], "jumps": ["P1140", "P1160"]}, {"id": "P1160", "text": ["Algorithms must be clear. Nothing should be ambiguous and all terms and steps must be understood in only one way."], "jumps": ["P1140", "P1170"]}, {"id": "P1170", "text": ["Algorithms must be specific to produce the desired output or results."], "jumps": ["P1140", "P1180"]}, {"id": "P1180", "text": ["Algorithms must be finite to produce output in limited number of steps and have a definite ending."], "jumps": ["P1140", "P1190"]}, {"id": "P1190", "text": ["To develop an algorithm, you must identify the process and define the process as a step by step method."], "jumps": ["P1140", "P1200"]}, {"id": "P1200", "text": ["Let's first see how to develop a straight line algorithm.....", "Calculate Miles per Gallon Input: Miles driven Gallons used Process: Calculate MPG Output: MPGGGGGGG"], "jumps": ["P1140", "P1210"]}, {"id": "P1210", "text": ["The input is miles driven and gallons used. put: Miles driven Gallons used", "Calculate Miles per Gallon Input: Miles driven Gallons used Process: Calculate MPG Output: MPG", "Input: Miles driven Gallons used Gallons used Process: Calculate MPG Output: MPGGGGGGG"], "jumps": ["P1200", "P1220"]}, {"id": "P1220", "text": ["The process is to calculate MPG. put: Miles driven Gallons used Process: Calculate MPG", "Calculate Miles per Gallon Input: Miles driven Gallons used Process: Calculate MPG Output: MPGGGte MPG Output: MPG"], "jumps": ["P1200", "P1230"]}, {"id": "P1230", "text": ["Calculate Miles per Gallon Input: Miles driven Gallons used Process: Calculate MPG Output: MPGGGte MPG Output: MPG"], "jumps": ["P1200", "P1240"]}, {"id": "P1090", "text": ["For example, add each days temperature and then divide by 7."], "jumps": ["P1080", "P1100"]}, {"id": "P1100", "text": ["Last, the results of the process must be given or sent out..t out."], "jumps": ["P1080", "P1110"]}, {"id": "P1110", "text": ["For example, the average temperature last week is the result of the process."], "jumps": ["P1100", "P1120"]}, {"id": "P1120", "text": ["Which one of the three operations involves solving?........"], "jumps": ["P1100"]}, {"id": "P1121", "text": [], "jumps": []}, {"id": "P1122", "text": ["The input operation is applying information to the process block."], "jumps": []}, {"id": "P1123", "text": ["The output operation is getting the result from the process.."], "jumps": []}, {"id": "P1130", "text": ["Which one of the three operations involves telling the computer what information is to be used?"], "jumps": ["P1120"]}, {"id": "P1131", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1015", "text": ["An algorithm is the steps a computer must follow to perform a function or to solve a problem."], "jumps": ["P1001", "P1020"]}, {"id": "P1020", "text": ["In other words, an algorithm is the steps a computer uses to operate."], "jumps": ["P1015", "P1030"]}, {"id": "P1030", "text": ["Algorithms are part of overall computer operation.... let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
