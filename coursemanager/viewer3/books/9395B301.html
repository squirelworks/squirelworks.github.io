const book = {"title": "9395B301", "pages": [{"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 11-09-99 Converted from storyboard to toolbook. frieda 11-09-99 Set up main pages and random draw of final quiz. frieda 12-20-99 Text & Branching - lisa 02-17-00 graphics-John Ayala 03-23-00 Final review. damian 03-24-00 Reviewed. frieda 07-14-00 Converted to ToolBook 7.1 format. jay 07-19-01 Converted to ToolBook 8.1 format. jay 12-04-01 P10238, 10239, stretched text fields so that the letters \"a\" and \"b\" can be seen in the IC5 labeling. P10225, 10228, 10229 stretched text fields so that the letters \"a\", \"b\", \"c\" and \"d\" can be seen in the IC labeling. This schematic also had two pin 13's labeled on IC6. Changed COU pin 13 to pin 12 throughout lesson. -Penny 01-14-02 Converted to Phase II format. jay 02-07-02 Checked for convertion errors John Ayala 03-25-02 Changed script on quiz buttons so that the experiment questions can be disregarded. -Penny 05-01-02 Review - lisa 06-14-04 P1286, changed the text to say\"twice the highest frequency of the information signal.\" Cleared the Main Window viewer so that the system menu doesn't show up. -Penny", "07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 11-09-99 Converted from storyboard to toolbook. frieda 11-09-99 Set up main pages and random draw of final quiz. frieda 12-20-99 Text & Branching - lisa 02-17-00 graphics-John Ayala 03-23-00 Final review. damian 03-24-00 Reviewed. frieda 07-14-00 Converted to ToolBook 7.1 format. jay 07-19-01 Converted to ToolBook 8.1 format. jay 12-04-01 P10238, 10239, stretched text fields so that the letters \"a\" and \"b\" can be seen in the IC5 labeling. P10225, 10228, 10229 stretched text fields so that the letters \"a\", \"b\", \"c\" and \"d\" can be seen in the IC labeling. This schematic also had two pin 13's labeled on IC6. Changed COU pin 13 to pin 12 throughout lesson. -Penny 01-14-02 Converted to Phase II format. jay 02-07-02 Checked for convertion errors John Ayala 03-25-02 Changed script on quiz buttons so that the experiment questions can be disregarded. -Penny 05-01-02 Review - lisa 06-14-04 P1286, changed the text to say\"twice the highest frequency of the information signal.\" Cleared the Main Window viewer so that the system menu doesn't show up. -Penny 06-21-04 P2610, added highlight from IC5 A2 to IC3a. P2740, added \"IC5\" in text in front of A2. -Penny"], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to __________"], "jumps": []}, {"id": "P10302", "text": ["end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10239", "text": ["What is the action of IC5a when the PCM data is a HIGH data pulse? {"], "jumps": []}, {"id": "P10238", "text": ["What is the action of IC5a when the PCM data is noise? m"], "jumps": []}, {"id": "P10237", "text": ["sets IC6 counting to quantization level in A/D converter of modulator", "sets IC6 counting to quantization level in D/A converter of demodulator", "sets IC6 counting to sample rate in A/D converter of modulator", "sets IC6 counting to sample rate in D/A converter of demodulator", "What is the function of R7 in this timing circuit in a PCM demodulator?"], "jumps": []}, {"id": "P10236", "text": ["How does IC7 operate in this circuit of a PCM demodulator? Y"], "jumps": []}, {"id": "P10235", "text": ["What is the function of R9 in this D/A converter in the PCM demodulator circuit?"], "jumps": []}, {"id": "P10234", "text": ["so only the eight data bits are processed", "so that both the data bits and sync pulse are processed", "How are the CL and L inputs timed in this serial to parallel (S/P) converter of the pulse code demodulator circuit?"], "jumps": []}, {"id": "P10233", "text": ["compensate of attenuation and distortion", "What is the purpose of the input amplifier in the PCM demodulator circuit?"], "jumps": []}, {"id": "P10232", "text": ["What is/are the output/s of a PCM demodulator circuit? S"], "jumps": []}, {"id": "P10231", "text": ["What is/are the input/s to a PCM demodulator circuit?"], "jumps": []}, {"id": "P10230", "text": ["amp, A/D, D/A, MUX, timing/sync bit generator", "amp, A/D, P/S, MUX, timing/sync bit generator", "amp, S/P, D/A, sync bit detector, timing", "amp, S/P, P/S, sync bit detector, timing", "What type of circuits do typical PCM demodulators consist of?", "How is the sync pulse transmitted out on the PCM line in this pulse code modulator's timing/sync bit generator circuit? k/", "Which gate/s in this pulse code modulator's timing/sync bit produce/s the sync pulse?"], "jumps": []}, {"id": "P10227", "text": ["What is the operation of this pulse code modulator's P/S converter when the SH/PL signal is HIGH?"], "jumps": []}, {"id": "P10226", "text": ["What is the purpose of R7 in this A/D converter in the pulse code modulator circuit?", "How are the data pulses transmitted out on the PCM line in this pulse code modulator's timing/sync bit generator circuit? g/", "What is the quantization level of this A/D converter in the pulse code modulator circuit?"], "jumps": []}, {"id": "P10223", "text": ["compensate of attenuation and distortion", "What is the purpose of the input amplifier in the pulse code modulator circuit?"], "jumps": []}, {"id": "P10222", "text": ["What is/are the output/s of a pulse code modulator circuit?"], "jumps": []}, {"id": "P10221", "text": ["What is/are the input/s to a pulse code modulation circuit?"], "jumps": []}, {"id": "P10220", "text": ["amp, S/P, P/S, sync bit detector, timing", "amp, S/P, D/A, sync bit detector, timing", "amp, A/D, D/A, MUX, timing/sync bit generator", "amp, A/D, P/S, MUX, timing/sync bit generator", "What type of circuits do typical pulse code modulators consist of?"], "jumps": []}, {"id": "P10219", "text": ["The sync pulse must be different from a data pulse.", "The sync pulse must be the same as the data pulse.", "What is the one requirement to produce a sync pulse in a PCM system? w"], "jumps": []}, {"id": "P10218", "text": ["What does multiplying the sampling rate times the number of bits in the A/D converter produce in a PCM system? '"], "jumps": []}, {"id": "P10217", "text": ["What type of noise is built into a PCM system?"], "jumps": []}, {"id": "P10216", "text": ["What is the number of digital levels that an analog signal can be divided into?"], "jumps": []}, {"id": "P10215", "text": ["The highest frequency in the information signal.", "Two times the highest frequency in the information signal.", "Three times the highest frequency in the information signal.", "Which frequency WOULD NOT be used to sample the information signal in a PCM system?"], "jumps": []}, {"id": "P10214", "text": ["What is the major requirement for PCM demodulation?"], "jumps": []}, {"id": "P10213", "text": ["What is the major requirement for pulse code modulation? s"], "jumps": []}, {"id": "P10212", "text": [], "jumps": []}, {"id": "P10211", "text": ["Generating a string of digital pulses from the information signal.", "Generating a string of analog levels from the information signal.", "Modifying an information signal with sampling pulses.", "Modifying sampling pulses with an information signal.", "How is pulse code modulation accomplished?"], "jumps": []}, {"id": "P10210", "text": [], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P3999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P3980", "P3001"]}, {"id": "P3990", "text": ["8. The sync pulse detector separates noise and data bits from the sync pulse.", "7. The sync pulse detector recognizes the sync pulse and then resets the counter in the timing circuit."], "jumps": ["P3980", "P3999", "P3990", "P3970"]}, {"id": "P3970", "text": ["6. The timing circuit controls the operation of the serial to parallel converter so that only the data bits are processed."], "jumps": ["P3980", "P3960"]}, {"id": "P3960", "text": ["5. The output amplifier amplifies and filters the analog data."], "jumps": ["P3950", "P3970"]}, {"id": "P3950", "text": ["4. The D/A analog converter changes the digital data into an analog signal like the analog signal applied to the PCM modulator circuit."], "jumps": ["P3960", "P3940"]}, {"id": "P3940", "text": ["3. The serial to parallel converter changes the serial data into parallel as controlled by the timing section."], "jumps": ["P3930", "P3950"]}, {"id": "P3930", "text": ["2. The input amplifier is used to compensate for attenuation and distortion of the received PCM signal."], "jumps": ["P3940", "P3920"]}, {"id": "P3920", "text": ["1. PCM demodulators contain six major circuits.ne here...."], "jumps": ["P3930", "P3001"]}, {"id": "P3910", "text": ["This completes the information on PULSE CODE DEMODULATION CIRCUITS."], "jumps": ["P3895", "P3001"]}, {"id": "P3905", "text": ["Different types of digital circuits could have been used but, they would still operate as shown in the block diagram."], "jumps": ["P3895", "P3910"]}, {"id": "P3895", "text": ["Remember, the circuits that you have learned are typical. They meet the requirements of a PCM demodulator."], "jumps": ["P3905", "P3830"]}, {"id": "P3890", "text": ["The Q output of IC5b to the timing circuit is only HIGH when the circuit receives a SYNC pulse."], "jumps": ["P3830", "P3895"]}, {"id": "P3880", "text": ["This ensures that IC5b does not become set during the time IC5a is set and then reset for a HIGH data pulse."], "jumps": ["P3830", "P3890"]}, {"id": "P3870", "text": ["This action produces a time delay from between the time IC5a is set and IC5b is set."], "jumps": ["P3830", "P3880"]}, {"id": "P3860", "text": ["Once C4 has discharged enough, the output of IC3d becomes HIGH and applies a clock pulse to IC5b."], "jumps": ["P3830", "P3870"]}, {"id": "P3850", "text": ["When the Q output of IC5a goes LOW (SYNC pulse), D3 is reverse biased and C4 discharges through R6. R6 is adjusted to set timing."], "jumps": ["P3830", "P3860"]}, {"id": "P3840", "text": ["The HIGH on C4 produces a LOW to the clock input of IC5b, there is no clock action at this point.", "When the Q output of IC5a is HIGH, there is no SYNC pulse and D3 is forward biased. C4 will begin to charge. w"], "jumps": ["P3830", "P3850", "P3840", "P3730"]}, {"id": "P3820", "text": ["The circuit of D3, R6 and C4 creates a time delay between the setting of IC5a and IC5b. Let's see how this is done.lay from IC5a becoming set until IC5b becomes set. omes set."], "jumps": ["P3730", "P3830"]}, {"id": "P3810", "text": ["This produces the HIGH and LOW edge, that is inverted in IC3d to LOW to HIGH. This clocks the D input into the flip-flop."], "jumps": ["P3730", "P3820"]}, {"id": "P3800", "text": ["The sync pulse then sets the IC5a Q output HIGH, the Q output now goes low."], "jumps": ["P3730", "P3810"]}, {"id": "P3790", "text": ["The Q output of IC5a produces a HIGH most of the time. Remember, the Q output is LOW for PCM data is LOW, a HIGH noise spike, or a HIGH data pulse."], "jumps": ["P3730", "P3800"]}, {"id": "P3780", "text": ["Like the IC5a flip-flop, the clock input requires a LOW to HIGH edge. Since IC3d is an inverter, its input must be a HIGH to LOW."], "jumps": ["P3730", "P3790"]}, {"id": "P3770", "text": ["The only consideration in the IC5b circuit is how the clock pulses are generated."], "jumps": ["P3730", "P3780"]}, {"id": "P3760", "text": ["This means that the counter in the timing circuit gets reset only on sync pulses."], "jumps": ["P3730", "P3770"]}, {"id": "P3750", "text": ["On each clock pulse to IC5b, the Q input follows the D input. The only time the D input is HIGH is on a sync pulse. /"], "jumps": ["P3730", "P3760"]}, {"id": "P3740", "text": ["Last, the IC5b flip-flop uses the Q output of IC5a as its D input.", "To summarize, IC5a flip-flop operates as follows: - Noise; does not set, does not reset. Q output is LOW. - Sync pulse; sets, does not reset. The Q output is HIGH. - 1 data pulse; sets and resets. The Q output is LOW.", "The clock input is not LOW, C2 has time to discharge during a HIGH data pulse. Also, the reset input is not LOW, C1 has time to discharge during a HIGH data pulse........", "The clock input is HIGH (C2 does have time to discharge during a HIGH data pulse), but the reset input is not LOW. C1 has time to discharge during a HIGH data pulse...."], "jumps": ["P3730", "P3750", "P3720"]}, {"id": "P3721", "text": [], "jumps": []}, {"id": "P3720", "text": ["When the incoming PCM data is a HIGH data pulse, what are the clock and reset input levels, as well as the action of, the D-type flip-flop IC5a?", "The reset input is LOW (C1 does not discharge enough during a noise spike), but the clock input is not HIGH. IC3 has HIGH inputs because C2 does not have time to discharge during a noise spike...........", "The clock input is LOW (C2 does not discharge enough during a noise spike), but the reset input is not HIGH. C1 does not discharge enough to change the IC3b output to a LOW........."], "jumps": []}, {"id": "P3711", "text": [], "jumps": []}, {"id": "P3710", "text": ["When the incoming PCM data is HIGH noise spike, what is the clock and reset input levels, and action of, the D-type flip-flop IC5a?"], "jumps": ["P3620"]}, {"id": "P3700", "text": ["Even though the HIGH data pulse set the flip-flop, the HIGH data pulse also causes the flip-flop to reset. The Q output is LOW for all HIGH data pulses."], "jumps": ["P3620", "P3710"]}, {"id": "P3690", "text": ["The LOW and HIGH inputs to IC3a produce a HIGH output. This resets the flip-flop."], "jumps": ["P3620", "P3700"]}, {"id": "P3680", "text": ["If the input from IC3a is a HIGH data pulse, C1 DOES have time to discharge (a data pulse is longer than a sync pulse.) The inputs to IC3b are now LOW and HIGH."], "jumps": ["P3620", "P3690"]}, {"id": "P3670", "text": ["Since the high portion of the sync pulse set the flip-flop and the reset input does not reset the flip-flop, the Q output is HIGH."], "jumps": ["P3620", "P3680"]}, {"id": "P3660", "text": ["If the input from IC3a is the high portion of the sync pulse, C1 still does not discharge enough to change the output of IC3b. The reset input is still LOW."], "jumps": ["P3620", "P3670"]}, {"id": "P3650", "text": ["Since a noise spike did not set the flip-flop, the Q output is LOW for any noise output."], "jumps": ["P3620", "P3660"]}, {"id": "P3640", "text": ["IC3b still has two HIGH inputs and the output is still LOW. The flip-flop does not reset."], "jumps": ["P3620", "P3650"]}, {"id": "P3630", "text": ["If the input from IC3a is a noise spike, C1 will not discharge enough to produce a LOW input to IC3b.", "In the D2 circuit, the operation is the same, only the discharge rate of C2 is faster, set by R5."], "jumps": ["P3620", "P3640", "P3630", "P3530"]}, {"id": "P3610", "text": ["In other words, the flip-flop only sets on a one data pulse and the high portion of the sync pulse. Remember this!"], "jumps": ["P3530", "P3620"]}, {"id": "P3600", "text": ["The inputs to IC3c become LOW producing a LOW to HIGH input to the flip-flop. The flip-flop sets."], "jumps": ["P3530", "P3610"]}, {"id": "P3590", "text": ["If the HIGH PCM is a one data pulse or the high portion of the sync pulse, C2 DOES have time to discharge."], "jumps": ["P3530", "P3600"]}, {"id": "P3580", "text": ["The inputs to IC3c remain HIGH producing a LOW clock input to the flip-flop. The flip-flop does not set."], "jumps": ["P3530", "P3590"]}, {"id": "P3570", "text": ["If the HIGH PCM data is a noise spike, a short duration HIGH, C2 does not have time to discharge."], "jumps": ["P3530", "P3580"]}, {"id": "P3560", "text": ["In the D1 circuit, C2 discharges through R4. R4 is variable and set to a slow discharge rate for C2."], "jumps": ["P3530", "P3570"]}, {"id": "P3550", "text": ["The LOW output of IC3a reverses biases D1 and D2, diodes act as an open."], "jumps": ["P3530", "P3560"]}, {"id": "P3540", "text": ["Now, when the PCM data is HIGH, a noise spike, a one data bit, or the HIGH portion of the sync pulse, the output of IC3a is LOW.", "To summarize, when the PCM data is LOW, nothing happens in the circuit. A LOW signal is sent to the counter in the timing circuit and the counter is not reset.", "The reset input is LOW, but the clock input is not HIGH. IC3c has HIGH inputs from the charging of C2.", "The clock input is LOW, but the reset input is not HIGH. IC3b has two HIGH inputs, one from the charging of C1 and the other from the HIGH Q output of IC5b........"], "jumps": ["P3530", "P3550", "P3540", "P3520"]}, {"id": "P3521", "text": [], "jumps": []}, {"id": "P3520", "text": ["When the incoming PCM data is LOW, what is the clock and reset input levels, and action of, the D-type flip-flop IC5a?", "With two HIGH inputs to IC3b, the output is LOW. This does not reset IC5a."], "jumps": ["P3502", "P3520"]}, {"id": "P3505", "text": ["IC5b Q OUTPUT - Note that even IC5b is set, the HIGH Q output resets the flip-flop after a short time delay. The output of IC5b Q is HIGH.", "IC3b has a HIGH input from C1 and a HIGH input from IC5b Q..."], "jumps": ["P3502", "P3510", "P3440", "P3505"]}, {"id": "P3500", "text": ["IC3b has a HIGH input from C1 and a HIGH input from IC5b Q ...."], "jumps": ["P3505", "P3440", "P3510"]}, {"id": "P3490", "text": ["The circuit of D2, R5 and C1 operates the same. A HIGH output from IC3a causes C1 to charge."], "jumps": ["P3500", "P3440"]}, {"id": "P3480", "text": ["Since IC5a requires a positive edge, low to high pulse, the flip-flop does not receive a clock pulse and remains reset."], "jumps": ["P3440", "P3490"]}, {"id": "P3470", "text": ["The charging of C2 produces a low to high pulse that is inverted in IC3c to a high to low pulse."], "jumps": ["P3440", "P3480"]}, {"id": "P3460", "text": ["The HIGH on the anode of the D1/R4/C2 circuit forward biases the diode and C2 charges."], "jumps": ["P3440", "P3470"]}, {"id": "P3450", "text": ["When the PCM data is LOW, a 0 data bit or the low portion of the sync pulse, the output of IC3a is HIGH.", "The PCM signal from the input amplifier is applied to IC3a and inverted."], "jumps": ["P3440", "P3460", "P3450", "P3410"]}, {"id": "P3430", "text": ["IC5a DOES NOT become set for a noise spike and BECOMES reset for a HIGH data pulse. Let's see."], "jumps": ["P3410", "P3440"]}, {"id": "P3420", "text": ["The basic operation is that IC5a becomes set and remains set for a sync pulse only (IC5a is initially reset.) IC5b is a time delayed latch.", "The circuit consists of two D-type flip-flops and various logic gates."], "jumps": ["P3410", "P3430", "P3420", "P3400"]}, {"id": "P3400", "text": ["The final circuit is the sync pulse detector..............."], "jumps": ["P3390", "P3410"]}, {"id": "P3393", "text": ["The sample rate has no bearing on the number of bits used. The sample rate is determined by the highest analog information signal frequency."], "jumps": []}, {"id": "P3392", "text": ["The load signal is generated by the Q5 output, which is eight counts from the Q2 output. The Q2 output is not the load signal to the serial to parallel converter."], "jumps": []}, {"id": "P3391", "text": [], "jumps": []}, {"id": "P3390", "text": ["Ensure data bit is present on the input to the S/P converter", "Divide the sample rate by eight because eight data bits are used", "Ensure that the counter counts eight counts before the S/P converter outputs data to the D/A converterr", "What is the purpose of using the Q2 output of IC6 instead of the Q0 output?"], "jumps": ["P3380"]}, {"id": "P3383", "text": ["The demodulator timing circuit has no bearing on the bandwidth of the system. Recall that bandwidth equals the sample rate times the number of bits in the A/D converter, the A/D converter is in the modulator circuit........."], "jumps": []}, {"id": "P3382", "text": ["Serial to parallel (and parallel to serial) converters do not use a sample rate. Analog to digital and digital to analog converters use sample rates...."], "jumps": []}, {"id": "P3381", "text": [], "jumps": []}, {"id": "P3380", "text": ["What frequency is the oscillator circuit set to in the timing section of the demodulator?"], "jumps": ["P3260"]}, {"id": "P3370", "text": ["The sync pulse also sets up the counter to provide the low load pulse that shifts parallel data out after the eight data bits have been serially shifted into the serial to parallel (S/P) converter."], "jumps": ["P3260", "P3380"]}, {"id": "P3360", "text": ["The sync pulse sets up the counter to provide the clock signals to shift the next eight bits into the serial to parallel converter, which is the data in the PCM signal."], "jumps": ["P3260", "P3370"]}, {"id": "P3350", "text": ["The reset input to the counter is the sync pulse. Remember, the sync pulse is the first bit in a frame before the eight data bits."], "jumps": ["P3260", "P3360"]}, {"id": "P3340", "text": ["Now, look at the reset input to the counter on pin 11."], "jumps": ["P3350", "P3260"]}, {"id": "P3330", "text": ["When Q5 goes HIGH, IC1e inverts the signal to a LOW pulse (by the action of C14 and R14) and allows the data in the serial to parallel converter to be shifted out in parallel."], "jumps": ["P3260", "P3340"]}, {"id": "P3320", "text": ["When Q5 is LOW, IC1e inverts the signal to a HIGH and allows the serial data to be clocked into the serial to parallel converter."], "jumps": ["P3260", "P3330"]}, {"id": "P3310", "text": ["The Q5 output, eight counts later (eight counts because eight data bits are used), is routed to the load input of the serial to parallel converter."], "jumps": ["P3260", "P3320"]}, {"id": "P3300", "text": ["The Q2 output is used to ensure that a data bit is being applied to the serial to parallel converter before it is clocked in."], "jumps": ["P3260", "P3310"]}, {"id": "P3290", "text": ["The Q2 output of the counter is routed to the serial to parallel converter clock output."], "jumps": ["P3260", "P3300"]}, {"id": "P3280", "text": ["R7 is used to adjust the frequency of the oscillator to match the sample rate used in the PCM modulator's A/D converter."], "jumps": ["P3260", "P3290"]}, {"id": "P3270", "text": ["The clock for the counter is generated in the oscillator circuit, IC1b and IC1c."], "jumps": ["P3260", "P3280"]}, {"id": "P3260", "text": ["The timing circuit consists of a counter and oscillator circuit."], "jumps": ["P3270", "P3250"]}, {"id": "P3250", "text": ["The timing circuit, as discussed, controls the serial to parallel converter."], "jumps": ["P3260", "P3230"]}, {"id": "P3240", "text": ["The output of the circuit is the demodulated PCM signal, also known as an analog voltage."], "jumps": ["P3230", "P3250"]}, {"id": "P3230", "text": ["The output amplifier is an op-amp that also acts as a filter."], "jumps": ["P3220", "P3240"]}, {"id": "P3220", "text": ["The analog output of the chip is applied to the output amplifier."], "jumps": ["P3230", "P3200"]}, {"id": "P3210", "text": ["R9 is used to adjust the peak to peak output of the converter."], "jumps": ["P3200", "P3220"]}, {"id": "P3200", "text": ["The circuit consists of a DAC08 D/A convert chip..........."], "jumps": ["P3190", "P3210"]}, {"id": "P3190", "text": ["The digital to analog converter changes the eight parallel digital data bits to an analog output."], "jumps": ["P3200", "P3180"]}, {"id": "P3183", "text": ["The data bits are converted to parallel and sent to the D/A converter, but the sync pulse is not. The timing of the circuit eliminates the sync pulse from the output of the S/P converter."], "jumps": []}, {"id": "P3182", "text": ["The sync pulse is used to tell the demodulator/receiver that data follows. The timing of the circuit eliminates the sync pulse from the output of the S/P converter."], "jumps": []}, {"id": "P3181", "text": [], "jumps": []}, {"id": "P3180", "text": ["What bits of the PCM data are converted to parallel and sent to the D/A converter?"], "jumps": []}, {"id": "P3170", "text": ["When L is LOW, the clocked in serial data is sent out in parallel to the digital to analog converter."], "jumps": ["P3120", "P3180"]}, {"id": "P3160", "text": ["When L is HIGH, the serial data is clocked into the converter."], "jumps": ["P3120", "P3170"]}, {"id": "P3150", "text": ["The timing circuit also supplies the L or load input to the converter."], "jumps": ["P3120", "P3160"]}, {"id": "P3140", "text": ["The timing circuit supplies a clock signal that equals the sampling rate used in the modulator circuit."], "jumps": ["P3120", "P3150"]}, {"id": "P3130", "text": ["The timing of the clock and load signals is such that only the eight data bits are converted to parallel and sent out. The sync pulse is blocked."], "jumps": ["P3120"]}, {"id": "P3120", "text": ["The circuit uses a 4094 chip with its clock and load inputs controlled from the timing circuit."], "jumps": ["P3100"]}, {"id": "P3110", "text": ["The serial to parallel converter changes the PCM serial to parallel."], "jumps": ["P3100"]}, {"id": "P3100", "text": ["The output of the input amplifier is applied to the serial to parallel converter (S/P) and to the sync pulse detector circuit."], "jumps": ["P3090"]}, {"id": "P3092", "text": ["The phase between the PCM signals on TP1 and TP2 are the same. Q1 inverts the signal and IC1a inverts the signal back to the original phase."], "jumps": ["P3090"]}, {"id": "P3091", "text": [], "jumps": []}, {"id": "P3090", "text": ["What is the phase relationship between the data on TP1 and TP2 in the input amplifier circuit?"], "jumps": ["P3060"]}, {"id": "P3080", "text": ["IC1a inverts the PCM signal again and produces sharp leading and trailing edges. This helps to overcome distortion."], "jumps": ["P3060"]}, {"id": "P3070", "text": ["Q1 amplifies and inverts the received PCM serial data. This helps to overcome attenuation.", "The circuit consists of a transistor amplifier and an inverter."], "jumps": ["P3060", "P3040"]}, {"id": "P3050", "text": ["The input amplifier is used to compensate the received PCM signal for attenuation and distortion caused by the transmission medium."], "jumps": ["P3040"]}, {"id": "P3040", "text": ["A typical PCM demodulator consists of six major circuits..."], "jumps": ["P3015"]}, {"id": "P3020", "text": ["You will be given a block diagram of the demodulator circuit first, followed by a schematic of the individual blocks."], "jumps": ["P3015", "P3040"]}, {"id": "P3015", "text": ["PCM demodulator circuits normally use integrated circuits.."], "jumps": ["P3020", "P3001"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2980"]}, {"id": "P2990", "text": ["8. When the count is 1 through 8, the data bits are transmitted out and the A/D converter is disabled.", "7. When the count is 0, the sync bit is transmitted out and the A/D converter changes analog to digital."], "jumps": ["P2980", "P2999", "P2990", "P2970"]}, {"id": "P2970", "text": ["Control to A/D and Parallel to Serial Converter", "6. The timer/sync bit generator controls the timing of the entire modulator and generates the sync bit."], "jumps": ["P2960", "P2980"]}, {"id": "P2960", "text": ["5. The output multiplexer places the sync bit and data bits in the correct sequence and outputs PCM to the transmission."], "jumps": ["P2970", "P2950"]}, {"id": "P2950", "text": ["4. The P/S holds the parallel converted data from the A/D converted data from the A/D converter and sends out the data serially.", "3. The A/D converter changes the analog information into digital. It may also supply the clock frequency."], "jumps": ["P2960", "P2940", "P2950", "P2930"]}, {"id": "P2930", "text": ["2. The amplifier is used to scale the analog information input signal."], "jumps": ["P2920", "P2940"]}, {"id": "P2920", "text": ["1. PCM modulators contain five major circuits.ine here...."], "jumps": ["P2930", "P2001"]}, {"id": "P2910", "text": ["This completes the information on PULSE CODE MODULATION CIRCUITS."], "jumps": ["P2790"]}, {"id": "P2800", "text": ["Different types of digital circuits could have been used, but they would still operate as shown in the block diagram."], "jumps": ["P2790", "P2910"]}, {"id": "P2790", "text": ["Remember, the circuits that you have learned are typical. They meet the requirements of a PCM modulator.", "When data is transmitted, IC6 0 output is LOW. This produces a HIGH input to WR(N) and SH/PL. The A/D converter is stopped and the P/S converter is serially shifting...."], "jumps": ["P2780", "P2800"]}, {"id": "P2781", "text": [], "jumps": []}, {"id": "P2780", "text": ["Not converting, Loading to P/S converter", "Converting, Not loading to P/S converter", "Not converting, Not loading to P/S converter", "When data is transmitted out of the demodulator, what is the status of the A/D converter?"], "jumps": ["P2760"]}, {"id": "P2770", "text": ["In other words, when the data bits are transmitted, the parallel to serial converter does not convert data and the parallel to serial converter does not load parallel data, but outputs serial data.", "To summarize, when 0 output of IC6 is LOW, counts 1 through 8: - Sync pulse output is enabled - Serial data output is disabled - A/D conversion is started - P/S parallel input is enabled - P/S serial output is disabledddd serial output is disabledserial output is disabledS serial output is disabledddddddddddddddddddddddddddd"], "jumps": ["P2760", "P2780", "P2770", "P2680"]}, {"id": "P2750", "text": ["The clock pulses shift the data out of the parallel to serial converter through IC3d to the PCM line."], "jumps": ["P2680", "P2760"]}, {"id": "P2740", "text": ["Also, the HIGH output of IC4d enables clock pulses from IC5 A2 to the parallel to serial converter."], "jumps": ["P2680", "P2750"]}, {"id": "P2730", "text": ["And allows the parallel to serial converter to shift data out serially."], "jumps": ["P2680", "P2740"]}, {"id": "P2720", "text": ["This prevents the A/D converter from converting new data."], "jumps": ["P2680", "P2730"]}, {"id": "P2710", "text": ["The LOW count 0 output also causes the output of IC3a to become HIGH."], "jumps": ["P2680", "P2720"]}, {"id": "P2700", "text": ["The LOW 0 output is inverted in IC4d to a HIGH which enables the serial data output."], "jumps": ["P2680", "P2710"]}, {"id": "P2690", "text": ["The LOW 0 output disables the sync output.", "Now, for counts 1 through 8 of IC6, the 0 output is LOW....", "The circuit does not have to wait until the data is transmitted to start processing new data.", "The A/D conversion takes place when the sync pulse is transmitted. There is no need to wait."], "jumps": ["P2680", "P2700", "P2690", "P2670"]}, {"id": "P2671", "text": [], "jumps": []}, {"id": "P2670", "text": ["Ensure the data is transmitted before new data arrives", "Why is IC6 allowed to count nine times?...................."], "jumps": ["P2650"]}, {"id": "P2660", "text": ["In other words, when the sync pulse is transmitted, the analog to digital converter converts data, loads and stores the data in the parallel to serial converter.", "To summarize, when the 0 output of IC6 is HIGH, count 0: - Sync pulse output is enabled - Serial data output is disabled - A/D conversion is started - P/S parallel input is enabled - P/S serial output is disabledddS serial output is disabledS serial output is disabledS serial output is disabled serial output is disabled serial output is disableddddddd"], "jumps": ["P2650", "P2670", "P2660", "P2560"]}, {"id": "P2640", "text": ["Finally, the LOW output of IC4d is also applied to IC3b producing a constant HIGH output to the clock input of the parallel to serial converter."], "jumps": ["P2560", "P2650"]}, {"id": "P2630", "text": ["The LOW to the SH/PL input of the parallel to serial converter enables the parallel load and disables the serial output."], "jumps": ["P2560", "P2640"]}, {"id": "P2620", "text": ["The LOW to the WR input of the A/D converter starts the analog to digital conversion....."], "jumps": ["P2560", "P2630"]}, {"id": "P2610", "text": ["When the A2 clock from IC5 becomes HIGH, the output of IC3a becomes LOW."], "jumps": ["P2560", "P2620"]}, {"id": "P2600", "text": ["Also at this time, the HIGH output of IC6 is applied to the enabling input of IC3a.of IC3a."], "jumps": ["P2560", "P2610"]}, {"id": "P2590", "text": ["At count 0 of IC6, the sync pulse is placed on the PCM output line and the serial data is blocked."], "jumps": ["P2560", "P2600"]}, {"id": "P2580", "text": ["Also, the HIGH output is inverted by IC4d and applied to IC3d. This disables the serial data from the output multiplexer."], "jumps": ["P2560", "P2590"]}, {"id": "P2570", "text": ["The HIGH output is applied to IC3c. This enables the sync pulse for the output multiplexer..", "On count 0, the output is HIGH from IC6.6.................."], "jumps": ["P2560", "P2580", "P2570", "P2480"]}, {"id": "P2550", "text": ["Using the 0 count only, the enable signals to IC3a through IC3d are generated.."], "jumps": ["P2480", "P2560"]}, {"id": "P2540", "text": ["On the tenth count, 9 output, the counter is reset back to count 0."], "jumps": ["P2480", "P2550"]}, {"id": "P2530", "text": ["The decimal counter counts the bits from 0 to 8, for a total of nine. The sync pulse is also counted increasing the count to ten.........."], "jumps": ["P2480", "P2540"]}, {"id": "P2520", "text": ["The A2 output of IC5 is inverted in IC4b and applied as a clock signal to IC6."], "jumps": ["P2480", "P2530"]}, {"id": "P2510", "text": ["The decimal counter, IC6, generates the enable signals for IC3a, IC3b, IC3c, and IC3d. the decimal counter, IC6. IC6 generates enable signals to IC3c and IC3d."], "jumps": ["P2480", "P2520"]}, {"id": "P2500", "text": ["IC3a and IC3b are control gates for the A/D and P/S converters. IC4b is used to drive the decimal counter."], "jumps": ["P2480", "P2510"]}, {"id": "P2490", "text": ["The A2 output is applied to IC3a, IC3b, and IC4b as clock signals.", "Second, the A2 output is used to set up the reset timing of the modulator circuit.tor circuit."], "jumps": ["P2480", "P2500", "P2490", "P2470"]}, {"id": "P2470", "text": ["The operation of the XOR gate, with one frequency input twice the other, produces the 1/2 wide centered sync pulse."], "jumps": ["P2420", "P2480"]}, {"id": "P2460", "text": ["First, the A1 and A2 outputs are used to generate the sync pulse from IC4a."], "jumps": ["P2420", "P2470"]}, {"id": "P2450", "text": ["The circuit produces two outputs, A1 at 1/4 of clock, and A2 at 1/8 of clock."], "jumps": ["P2420", "P2460"]}, {"id": "P2440", "text": ["The clock frequency in the A/D converter is used as clock to the divider circuit, IC5."], "jumps": ["P2420", "P2450"]}, {"id": "P2435", "text": ["ABBREVIATIONS - A/D - analog to digital converter P/S - parallel to serial converter MUX - output multiplexer", "The circuit may look complex, but remembering the operation of the A/D, P/S, and MUX, the timing circuit is easy to understand."], "jumps": ["P2440", "P2420", "P2435"]}, {"id": "P2430", "text": ["The circuit may look complex, but remembering the operation of the A/D, P/S, and MUX, the timing circuit is easy to understand.", "The circuit consists of: a divider, IC5; a decimal counter, IC6; NAND gates, IC3; and XOR gates, IC4."], "jumps": ["P2435", "P2420", "P2440", "P2430", "P2390"]}, {"id": "P2410", "text": ["Along with suppling signals to the sync bit generator that produces the sync pulse."], "jumps": ["P2390", "P2420"]}, {"id": "P2400", "text": ["The clock frequency from the A/D converter is used. The timing/counter circuits control the A/D converter, parallel to serial converter, and output multiplexer."], "jumps": ["P2390", "P2410"]}, {"id": "P2390", "text": ["Control to A/D and Parallel to Serial Converter", "This block controls the operation of the entire modulator circuit."], "jumps": ["P2380", "P2400"]}, {"id": "P2380", "text": ["The last block in the PCM modulator is the Timer/Sync Bit Generator."], "jumps": ["P2370", "P2390"]}, {"id": "P2373", "text": ["The PCM signal, output of IC4c, is inverted by the operation of the XOR gate due to one input always being HIGH."], "jumps": []}, {"id": "P2372", "text": ["The operation of the NAND gate inverts the signals when the enable input is HIGH."], "jumps": []}, {"id": "P2371", "text": [], "jumps": []}, {"id": "P2370", "text": ["Timing of the sync and serial data output", "Inverting the sync and serial data inputs", "What is the purpose of the enable inputs to IC3c and IC3d?."], "jumps": ["P2350"]}, {"id": "P2360", "text": ["The output of IC4c is a PCM waveform with a sync bit. The level is controlled by R14."], "jumps": ["P2350", "P2370"]}, {"id": "P2350", "text": ["The inverted outputs of IC3c and IC3d are inverted again in IC4c and summed."], "jumps": ["P2340", "P2360"]}, {"id": "P2340", "text": ["Looking at the operation of an XOR gate, when one input is held HIGH, the other input produces an inverted output."], "jumps": ["P2350", "P2270"]}, {"id": "P2330", "text": ["In other words, the XOR gate always has one input a constant HIGH. Either from IC3d, when the sync pulse is transmitted, or from IC3c, when the serial data is transmitted."], "jumps": ["P2270", "P2340"]}, {"id": "P2320", "text": ["Also, when the serial data is to be transmitted, the enable signal to IC3c is set LOW. This produces a constant HIGH to the XOR gate."], "jumps": ["P2270", "P2330"]}, {"id": "P2310", "text": ["When the serial data is to be transmitted, the enable signal to IC3d is set HIGH. This produces inverted serial data to the XOR gate."], "jumps": ["P2270", "P2320"]}, {"id": "P2300", "text": ["Also, when the sync pulse is to be transmitted, the enable signal to IC3d is set LOW. This produces a constant HIGH to the XOR gate."], "jumps": ["P2270", "P2310"]}, {"id": "P2290", "text": ["When the sync pulse is to be transmitted, the enable signal to IC3c is set HIGH. This produces an inverted sync pulse to the XOR gate."], "jumps": ["P2300", "P2270"]}, {"id": "P2280", "text": ["NAND gate IC3c receivers that sync pulse and NAND gate IC3d receives the serial data."], "jumps": ["P2270", "P2290"]}, {"id": "P2270", "text": ["The Output Multiplexer consists of two NAND gates and a XOR gate."], "jumps": ["P2260", "P2280"]}, {"id": "P2260", "text": ["The output of the P/S converter is applied to the Output Multiplexer."], "jumps": ["P2250", "P2270"]}, {"id": "P2253", "text": ["When PL is high, the serial output is enabled, but a high clock input will not shift the data out. The clock must be pulsing."], "jumps": []}, {"id": "P2252", "text": ["When PL is low, the parallel inputs are enabled and the serial output is disabled."], "jumps": []}, {"id": "P2251", "text": [], "jumps": []}, {"id": "P2250", "text": ["When does the shift P/S converter send serial digital data out?"], "jumps": ["P2210"]}, {"id": "P2240", "text": ["When SH/PL is HIGH, the parallel input is disabled and the eight bits are serially shifted out using clock pulses applied to the CL input."], "jumps": ["P2210", "P2250"]}, {"id": "P2230", "text": ["When SH/PL is LOW, the parallel data from the A/D converter is loaded and the serial output is disabled."], "jumps": ["P2210", "P2240"]}, {"id": "P2220", "text": ["The SH/PL and CL inputs are from the timer circuit and control the parallel to serial chip.ip."], "jumps": ["P2210", "P2230"]}, {"id": "P2210", "text": ["A shift register, IC2, converts the parallel data from the A/D converter to serial data on pin 9."], "jumps": ["P2200", "P2220"]}, {"id": "P2200", "text": ["The other path for the parallel output is to the serial to parallel converter (S/P) parallel to serial (P/S.)", "One path for the paralleled output is to a display that is used as a visual indication of the operation of the A/D converter."], "jumps": ["P2190", "P2210", "P2200", "P2180"]}, {"id": "P2183", "text": ["The analog input signal is scaled in the amplifier circuit by IC7.", "The quantization level is established by the number of bits in the A/D converter."], "jumps": []}, {"id": "P2181", "text": [], "jumps": []}, {"id": "P2180", "text": ["What is the purpose of R7 in the A/D converter circuit?...."], "jumps": ["P2130"]}, {"id": "P2170", "text": ["When WR is HIGH, A/D conversion is not started.ed."], "jumps": ["P2130", "P2180"]}, {"id": "P2160", "text": ["When WR goes low, the circuit converts the present analog data to digital and stores it.it."], "jumps": ["P2130", "P2170"]}, {"id": "P2150", "text": ["The low activated write input on pin 3, from the timer circuit, controls the operation of the A/D converter."], "jumps": ["P2130", "P2160"]}, {"id": "P2140", "text": ["The frequency is adjustable to set the sampling rate and for use in the timer circuit instead of having an additional 555 timer.", "The converter's CL output and CLIN input set up a clock frequency determined by the RC network of R6/R7/C2.", "You still have not entered the correct quantization level. The ADC0803 A/D converter uses 8 bits, q is 2 to the 8th power or 256."], "jumps": ["P2130", "P2150", "P2140", "P2120"]}, {"id": "P2125", "text": ["q = 2nn22ns) = increments q - 1 q - 11 fmmax is the highest frequency of the modulating signal.gnal.l...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor.", "QUANTIZATION LEVEL - The quantization level equals 2 to the n power where n is the number of bits in the A/D converter."], "jumps": []}, {"id": "P2122", "text": ["Remember, the quantization level equals 2 to the n power where n equals the number of bits in the A/D converter."], "jumps": []}, {"id": "P2121", "text": [], "jumps": []}, {"id": "P2120", "text": ["Type in the quantization level of the ADC0803 A/D converter............) in a variable.able.le."], "jumps": ["P2110", "P2122", "P2125"]}, {"id": "P2110", "text": ["The A/D converter is an eight bit ADC0803 chip............."], "jumps": ["P2120", "P2100"]}, {"id": "P2100", "text": ["The output of the op-amp amplifier is applied to the A/D converter."], "jumps": ["P2080", "P2110"]}, {"id": "P2090", "text": ["S1 allows AC or DC inputs. R1 and R11 applies a DC bias to AC inputs."], "jumps": ["P2080", "P2100"]}, {"id": "P2080", "text": ["The circuit consists of an inverting amplifier, IC7, with an offset control."], "jumps": ["P2090", "P2060"]}, {"id": "P2070", "text": ["The amplifier is used to scale the analog input signal so that its maximum peak to peak value is within the limits of the A/D circuit."], "jumps": ["P2060", "P2080"]}, {"id": "P2060", "text": ["A typical PCM modulator consists of five major circuits...."], "jumps": ["P2015", "P2070"]}, {"id": "P2040", "text": ["During the analysis, only one part of the schematic is illustrated."], "jumps": ["P2015", "P2060"]}, {"id": "P2030", "text": ["Then a typical modulator circuit is analyzed."], "jumps": ["P2015", "P2040"]}, {"id": "P2020", "text": ["Due to the vast number of integrated circuits that can be used, a block diagram of a PCM modulator is given first."], "jumps": ["P2015", "P2030"]}, {"id": "P2015", "text": ["PCM modulator circuits normally use integrated circuits...."], "jumps": ["P2001", "P2020"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1992"]}, {"id": "P1992", "text": ["9. Synchronization is accomplished by adding a sync bit to each frame."], "jumps": ["P1990", "P1999"]}, {"id": "P1990", "text": ["BW = n(fs), = increments q - 1 q - 11 fmmax is the highest frequency of the modulating signal.gnal.l...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor.", "8. Bandwidth depends on the sampling frequency and number of bits used in the A/D converter."], "jumps": ["P1980", "P1992"]}, {"id": "P1980", "text": ["SNRq = 22n, = increments q - 1 q - 11 fmmax is the highest frequency of the modulating signal.gnal.l...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor.", "7. Noise is built into a PCM system and is based on the number of bits used in the A/D converter. The higher the quantization, the less noise."], "jumps": ["P1970", "P1990"]}, {"id": "P1970", "text": ["6. Quantization determines the accuracy (resolution) of the A/D converter."], "jumps": ["P1980", "P1960"]}, {"id": "P1960", "text": ["5. Sampling is used in the A/D converter and the minimum rate is the Nyquist rate."], "jumps": ["P1950", "P1970"]}, {"id": "P1950", "text": ["4. The demodulator/receiver uses a demodulator and a D/A converter."], "jumps": ["P1940", "P1960"]}, {"id": "P1940", "text": ["3. The modulator/transmitter uses an A/D converter and modulator."], "jumps": ["P1950", "P1930"]}, {"id": "P1930", "text": ["2. The PCM is a string of digital pulses and is more like a coding method than modulation and demodulation."], "jumps": ["P1920", "P1940"]}, {"id": "P1920", "text": ["1.  Pulse code modulation is a signal processing technique that         uses digital signals.", "1. Pulse code modulation is a signal processing technique that uses digital signals."], "jumps": ["P1001", "P1930"]}, {"id": "P1910", "text": ["This completes the information on PULSE CODE MODULATION SIGNALS."], "jumps": ["P1890", "P1001"]}, {"id": "P1895", "text": ["And remember, without synchronization the receiver/demodulator will not operate correctly."], "jumps": ["P1890", "P1910"]}, {"id": "P1890", "text": ["The sync bit used in the circuits you will learn is a pulse half as wide and centered as compared to a regular data bit."], "jumps": ["P1850", "P1895"]}, {"id": "P1880", "text": ["The sync bit can be almost any type of bit, as long as it is different from a data bit."], "jumps": ["P1850", "P1890"]}, {"id": "P1870", "text": ["Each time the receiver/demodulator receives a sync bit, it knows that a new frame is about to begin."], "jumps": ["P1850", "P1880"]}, {"id": "P1860", "text": ["The sync bit identifies a set of binary bits as one group, or frame as it is normally called."], "jumps": ["P1850", "P1870"]}, {"id": "P1850", "text": ["To solve the problem of synchronization, an additional bit is added to the PCM signal."], "jumps": ["P1810", "P1860"]}, {"id": "P1840", "text": ["And if that is the case, the receiver will change the digital data back to analog incorrectly."], "jumps": ["P1810", "P1850"]}, {"id": "P1830", "text": ["But, how does the receiver know? It may think that there are three, 4 bit binary numbers."], "jumps": ["P1810", "P1840"]}, {"id": "P1820", "text": ["You may know that the twelve bits in the PCM waveform are four, 3 binary numbers."], "jumps": ["P1810", "P1830"]}, {"id": "P1810", "text": ["The reason for synchronization is really simple............"], "jumps": ["P1780", "P1820"]}, {"id": "P1800", "text": ["This makes synchronization a characteristic."], "jumps": ["P1780", "P1810"]}, {"id": "P1790", "text": ["However, synchronization of PCM signals is accomplished by adding a bit to the PCM digital signal."], "jumps": ["P1780", "P1800"]}, {"id": "P1780", "text": ["You may not think of synchronization as a characteristic of PCM signals."], "jumps": ["P1770", "P1790"]}, {"id": "P1770", "text": ["The last characteristic of PCM signals is synchronization.."], "jumps": ["P1760", "P1780"]}, {"id": "P1765", "text": ["fs = frequency of sample rate/D converter", "n = number of bits used by A/D converter", "BW = n(fs), = increments q - 1 q - 11 fmmax is the highest frequency of the modulating signal.gnal.l...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor.", "BANDWIDTH - The bandwidth of the digital PCM system equals the sampling frequency times the number of bits used in the A/D converter."], "jumps": []}, {"id": "P1763", "text": ["Your calculations are incorrect. You took 10 to the fifth power which is not the way you calculate bandwidth."], "jumps": []}, {"id": "P1762", "text": ["Your calculations are incorrect. You forgot to include the kilo when you multiplied 5 times 10."], "jumps": ["P1760"]}, {"id": "P1761", "text": [], "jumps": []}, {"id": "P1760", "text": ["What is the bandwidth of a PCM system that uses a 5 bit A/D converter and has a sampling frequency of 10 kHz?"], "jumps": ["P1765", "P1710"]}, {"id": "P1750", "text": ["Of course there is a trade off here, too. You know what happens if the sampling frequency becomes lower than the Nyquist rate!"], "jumps": ["P1710", "P1760"]}, {"id": "P1740", "text": ["Another way to try to keep the quantization level high and the bandwidth low is to lower the sampling frequency."], "jumps": ["P1710", "P1750"]}, {"id": "P1730", "text": ["q = 2n BW = n(fs)ncrements q - 1 q - 11 fmmax is the highest frequency of the modulating signal.gnal.l...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor.", "Increasing the quantization level increases the accuracy or resolution, but the bandwidth also increases, which may cause losses -- especially in a system in which bandwidth is limited."], "jumps": ["P1710", "P1740"]}, {"id": "P1720", "text": ["As you can see, there is a trade off between quantization level and bandwidth in a communication system."], "jumps": ["P1710", "P1730"]}, {"id": "P1710", "text": ["q = 2n BW = n(fs)ncrements q - 1 q - 11 fmmax is the highest frequency of the modulating signal.gnal.l...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor.", "Note that the more bits that are used in the A/D converter (higher quantization, which is good), the higher the bandwidth of the system (which is not good.)"], "jumps": ["P1690", "P1720"]}, {"id": "P1700", "text": ["BW = n(fs) = 4(8k) = 32 kBPSSSnts q - 1 q - 11 fmmax is the highest frequency of the modulating signal.gnal.l...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor.", "For example, if the sampling frequency is 8 kHz and the number of bits used in the A/D converter is 4, the bandwidth is 32 kBPS."], "jumps": ["P1690", "P1710"]}, {"id": "P1690", "text": ["BW = n(fs), = increments q - 1 q - 11 fmmax is the highest frequency of the modulating signal.gnal.l...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor.", "The bandwidth of a PCM system is therefore easily calculated:"], "jumps": ["P1650", "P1700"]}, {"id": "P1680", "text": ["The number of bits in the A/D converter is part of bits per second and, of course, if the bits increase, the frequency increases and the bandwidth must increase."], "jumps": ["P1650", "P1690"]}, {"id": "P1670", "text": ["The sample rate is a frequency and, of course, as the frequency increases, the bandwidth of the system must increase."], "jumps": ["P1650", "P1680"]}, {"id": "P1660", "text": ["The bandwidth in a digital system depends upon the sample rate, fs and the number of bits used in the A/D converter, n."], "jumps": ["P1650", "P1670"]}, {"id": "P1650", "text": ["In digital systems, the bandwidth is expressed in \"bits per second\" or BPS.  This is similar to cycles per second, or Hz, in analog systems.", "In digital systems, the bandwidth is expressed in \"bits per second\" or BPS. This is similar to cycles per second, or Hz, in analog systems."], "jumps": ["P1640", "P1660"]}, {"id": "P1640", "text": ["As in all communication systems, bandwidth is very important."], "jumps": ["P1630", "P1650"]}, {"id": "P1635", "text": ["SNRq = 22n, = increments q - 1 q - 11 fmmax is the highest frequency of the modulating signal.gnal.l...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor.", "QUANTIZATION NOISE - The quantization noise, SNRq, is found by taking 2 to the 2n power where n is the number of bits in the A/D converter."], "jumps": []}, {"id": "P1633", "text": ["A SNRq of 1024 is the noise generated by a 5 bit A/D converter."], "jumps": []}, {"id": "P1632", "text": ["A SNRq of 512 is 2 to the ninth power. Since noise is found by 2 to the 2n power, the ninth power is not correct."], "jumps": []}, {"id": "P1631", "text": [], "jumps": []}, {"id": "P1630", "text": ["What is quantization noise of a PCM system that uses a 4 bit A/D converter?"], "jumps": ["P1635", "P1590"]}, {"id": "P1620", "text": ["The higher the SNRq value, the less noise there is in the system."], "jumps": ["P1590", "P1630"]}, {"id": "P1610", "text": ["SNRq = 22(3) = 26 = 64ncrements q - 1 q - 11 fmmax is the highest frequency of the modulating signal.gnal.l...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor.", "For example, if a 3 bit A/D converter is used, the quantization noise is 64."], "jumps": ["P1590", "P1620"]}, {"id": "P1600", "text": ["SNRq = 22n, = increments q - 1 q - 11 fmmax is the highest frequency of the modulating signal.gnal.l...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor.", "Where SNRq is the quantization noise and n is the number of bits in the A/D converter."], "jumps": ["P1590", "P1610"]}, {"id": "P1590", "text": ["SNRq = 22n, = increments q - 1 q - 11 fmmax is the highest frequency of the modulating signal.gnal.l...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor.", "The quantization noise is expressed as the signal to noise ratio, as in any communication system, and equals:"], "jumps": ["P1580", "P1600"]}, {"id": "P1580", "text": ["Of course, the higher the quantization level, the less noise there is in the PCM system."], "jumps": ["P1590", "P1570"]}, {"id": "P1570", "text": ["Quantization Noise is the errors in the A/D and D/A conversion due to the quantization levels."], "jumps": ["P1580", "P1550"]}, {"id": "P1560", "text": ["But, there is noise in the PCM system. It is called Quantization Noise and is built in."], "jumps": ["P1550", "P1570"]}, {"id": "P1550", "text": ["As stated in the introduction, noise in digital systems is not present because amplitude variations do not effect the system."], "jumps": ["P1540", "P1560"]}, {"id": "P1540", "text": ["Noise is the next characteristic..........................."], "jumps": ["P1530", "P1550"]}, {"id": "P1530", "text": ["q = 2nnnnnnnnnnnnere fs is the sampling frequency and fmmax is the highest frequency of the modulating signal.gnal.l...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor.", "Before moving on to the next characteristic, you may be thinking that the quantization level is unlimited, which would produce very accurate PCM systems. However, this is not the case as you will see later."], "jumps": ["P1520", "P1540"]}, {"id": "P1525", "text": ["VOLTAGE INCREMENTS - To determine the voltage increments, you must find the quantization level and subtract one. Then you divide the result into the maximum allowable peak to peak voltage of the information signal."], "jumps": []}, {"id": "P1523", "text": ["You forgot to subtract one from the quantization level before dividing into the peak voltage."], "jumps": []}, {"id": "P1522", "text": ["You divided the number of bits in the A/D converter into peak voltage. You should have found the quantization level first."], "jumps": []}, {"id": "P1521", "text": [], "jumps": []}, {"id": "P1520", "text": ["What is the voltage between levels of a PCM system that use a four bit A/D converter and has information inputs that range from 0 to 10.5 volts?"], "jumps": ["P1525", "P1500"]}, {"id": "P1510", "text": ["1 volt increments are shown in this illustration."], "jumps": ["P1520", "P1500"]}, {"id": "P1500", "text": ["For example, if the allowable peak to peak voltage range of the information signal is 7 volts and the A/D converter uses three bits, the voltage increments are 1 volt."], "jumps": ["P1490", "P1510"]}, {"id": "P1490", "text": ["By subtracting one from the quantization level and then dividing into the allowable peak to peak voltage range of the information signal, each increment is determined."], "jumps": ["P1480", "P1500"]}, {"id": "P1480", "text": ["q = 2nnnnnnnnnnnnere fs is the sampling frequency and fmmax is the highest frequency of the modulating signal.gnal.l...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor.", "Another important point about the quantization level is that it determines the voltage increments."], "jumps": ["P1470", "P1490"]}, {"id": "P1475", "text": ["q = 2nnnnnnnnnnnnere fs is the sampling frequency and fmmax is the highest frequency of the modulating signal.gnal.l...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor.", "QUANTIZATION LEVEL - The quantization level equals two to the n power where n is the number of bits used in the A/D converter."], "jumps": []}, {"id": "P1473", "text": ["A quantization level of 512 is 2 to the 9 power or a 9 bit converter."], "jumps": []}, {"id": "P1472", "text": ["A quantization level of 128 is 2 to the 7 power or a 7 bit converter."], "jumps": []}, {"id": "P1471", "text": [], "jumps": []}, {"id": "P1470", "text": ["What is the quantization level of an 8 bit A/D converter?.."], "jumps": ["P1475", "P1440"]}, {"id": "P1460", "text": ["q = 2n 3 bit = 23 or 8 4 bit = 24 or 16 5 bit = 25 or 32s the highest frequency of the modulating signal.gnal.l...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor.", "For example, the quantization levels of 3, 4, 5 bit converters is given below:"], "jumps": ["P1440", "P1470"]}, {"id": "P1450", "text": ["Where q is the quantization level and n is the number of bits used in the converters."], "jumps": ["P1440", "P1460"]}, {"id": "P1440", "text": ["q = 2nnnnnnnnnnnnere fs is the sampling frequency and fmmax is the highest frequency of the modulating signal.gnal.l...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor.", "The quantization level of a PCM system is expressed as:...."], "jumps": ["P1400", "P1450"]}, {"id": "P1430", "text": ["In other words, the more bits used in the converters -- the higher the quantization level, the more accurate the conversion."], "jumps": ["P1400", "P1440"]}, {"id": "P1420", "text": ["The increments between levels are now 0.46 volts instead of 1.00 volts."], "jumps": ["P1400", "P1430"]}, {"id": "P1410", "text": ["Using four bits instead of three in the A/D converter produced a more accurate output from the D/A converter."], "jumps": ["P1400", "P1420"]}, {"id": "P1400", "text": ["Increasing the quantization level would produce a more accurate output signal from the receiver."], "jumps": ["P1410", "P1360"]}, {"id": "P1390", "text": ["The transmitted and received information are not the same.F"], "jumps": ["P1360", "P1400"]}, {"id": "P1380", "text": ["Then in the receiver, the D/A converter would convert the digital signal into -1 volt and +3 volt analog levels."], "jumps": ["P1360", "P1390"]}, {"id": "P1370", "text": ["The A/D converter would convert the analog signal into 010 and 110 digital levels."], "jumps": ["P1360", "P1380"]}, {"id": "P1360", "text": ["Look at this analog signal. The levels are between digital numbers."], "jumps": ["P1310", "P1370"]}, {"id": "P1350", "text": ["Of course, the analog signal has an infinite number of levels ranging between -3 volts and +3 volts."], "jumps": ["P1310", "P1360"]}, {"id": "P1340", "text": ["Using three bits in the A/D converter, there are only eight different digital levels."], "jumps": ["P1310", "P1350"]}, {"id": "P1330", "text": ["As shown, the analog signal can only be described in 1 volt increments."], "jumps": ["P1310", "P1340"]}, {"id": "P1320", "text": ["Quantization is the number of digital levels that an analog signal can be divided into."], "jumps": ["P1310", "P1330"]}, {"id": "P1310", "text": ["Quantization describes the resolution of the A/D converter in the transmitter/modulator circuits."], "jumps": ["P1300", "P1320"]}, {"id": "P1300", "text": ["The second characteristic of PCM signals is quantization..."], "jumps": ["P1290", "P1310"]}, {"id": "P1295", "text": ["fs = 2fmmax where fs is the sampling frequency and fmmax is the highest frequency of the modulating signal.gnal.l...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor.", "MINIMUM SAMPLING FREQUENCY - The minimum sampling frequency that can be used is the Nyquist rate. The Nyquist rate is defined as twice the highest information signal frequency or:"], "jumps": []}, {"id": "P1293", "text": ["4 kHz is the highest frequency in the information signal. The minimum frequency for sampling is twice the highest frequency in the information signal."], "jumps": []}, {"id": "P1292", "text": ["80 Hz is twice the lowest frequency in the information signal. The minimum frequency for sampling is twice the highest frequency in the information signal."], "jumps": []}, {"id": "P1291", "text": [], "jumps": []}, {"id": "P1290", "text": ["In a PCM system that uses an information signal that ranges from 40 Hz to 4 kHz, what is the minimum sample frequency that can be used in the transmitter's A/D converter?"], "jumps": ["P1295", "P1282"]}, {"id": "P1286", "text": ["The Nyquist rate is defined as twice the highest frequency of the information signal.ormation signal.or:......................", "fs = 2fmmax where fs is the sampling frequency and fmmax is the highest frequency of the modulating signal.gnal.l...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor."], "jumps": []}, {"id": "P1285", "text": ["fs = 2fmmax where fs is the sampling frequency and fmmax is the highest frequency of the modulating signal.gnal.l...demodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor.", "NYQUIST RATE - If the Nyquist rate, or higher, is used as the sample frequency, the receiver circuits will be able to reconstruct the original information signal accurately."], "jumps": []}, {"id": "P1282", "text": ["Just as in analog pulse modulation, digital pulse modulation must use at least the Nyquist sampling rate or higher."], "jumps": ["P1285", "P1270", "P1290"]}, {"id": "P1280", "text": ["Just as in analog pulse modulation, digital pulse modulation must use at least the Nyquist sampling rate or higher."], "jumps": ["P1285", "P1270", "P1290"]}, {"id": "P1270", "text": ["However, if only one sample is taken per cycle, the A/D converter would not be able to reconstruct the original information signal."], "jumps": ["P1280", "P1200"]}, {"id": "P1260", "text": ["In the receiver, the five samples (which are digital numbers) can then be converted back to an analog waveform matching the original analog information signal."], "jumps": ["P1200", "P1270"]}, {"id": "P1250", "text": ["Notice that with five samples, the analog signal is well defined."], "jumps": ["P1200", "P1260"]}, {"id": "P1240", "text": ["Sample times T3, T4 and T5 produce A/D outputs of 011, 000 and 011 respectively."], "jumps": ["P1200", "P1250"]}, {"id": "P1230", "text": ["At sample T2, the analog signal is +3 volts. The A/D converter outputs a 110."], "jumps": ["P1200", "P1240"]}, {"id": "P1220", "text": ["For example, at sample T1, the analog signal is 0 volts. The A/D converter outputs a 011."], "jumps": ["P1200", "P1230"]}, {"id": "P1210", "text": ["Only in PCM systems, the amplitude of the sample is changed to digital by the A/D converter."], "jumps": ["P1200", "P1220"]}, {"id": "P1200", "text": ["Sampling in PCM systems is similar to sampling in analog pulse modulation systems."], "jumps": ["P1210", "P1190"]}, {"id": "P1190", "text": ["To better understand PCM signals, let's study the five basic characteristics starting with sampling."], "jumps": ["P1180", "P1200"]}, {"id": "P1182", "text": ["The transmitter in PCM systems could use amplifier and wave shaping circuits. However, they are normally located in the receiver circuit to compensate for the effects of the transmission."], "jumps": []}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1180", "text": ["\u0000\u0000\u0000incorrect1\u0000\u0000/\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000Y\u0001\u000f\u0000\u0000\u0000 \u0000\u000b\u0000Transmittereett\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000o\u0001\u0010\u0000\u0000\u0000\u0001\u0000\u0001\u0000\u0000\u0000,\u0004\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000x\u0001\u0000\u0000\u00fa\u0000\u00ba\u0004\u0012\u0002\u0085\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u00af\u0001\u0012\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0014\u0000\u0013\u0000x\u001e\u0000\u0000\u0019\u0000\u001a\u0000\u00e5c\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00c7\u0001\u0013\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00d9\u0001\u0014\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000\u00f3\u0001\u0015\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0017\u0002\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00ba\u0004\u0002\u0000\u0000\u0000V\u0006\u0003\u0000\u0000\u0000t\u0007\u0000\u0000\u0000\u0000\u0000\u00001\u0002\u0017", "Where would amplifier and wave shaping circuits be most likely located in a PCM system?"], "jumps": ["P1170"]}, {"id": "P1172", "text": ["A D/A converter changes digital to analog. It is not found in the transmitter where the analog information signal must change to digital."], "jumps": []}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1170", "text": ["\u0000\u0000\u0000incorrect1\u0000\u0000/\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000Y\u0001\u000f\u0000\u0000\u0000 \u0000\u000b\u0000Transmittereett\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000o\u0001\u0010\u0000\u0000\u0000\u0001\u0000\u0001\u0000\u0000\u0000,\u0004\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000x\u0001\u0000\u0000\u00fa\u0000\u00ba\u0004\u0012\u0002\u0085\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u00af\u0001\u0012\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0014\u0000\u0013\u0000x\u001e\u0000\u0000\u0019\u0000\u001a\u0000\u00e5c\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00c7\u0001\u0013\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00d9\u0001\u0014\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000\u00f3\u0001\u0015\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0017\u0002\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00ba\u0004\u0002\u0000\u0000\u0000V\u0006\u0003\u0000\u0000\u0000t\u0007\u0000\u0000\u0000\u0000\u0000\u00001\u0002\u0017", "In which circuit would you find a D/A converter in a PCM system?"], "jumps": ["P1120"]}, {"id": "P1160", "text": ["By adding amplifiers and wave shaping circuits before the demodulator circuit, the PCM waveform is returned to its original shape and amplitude."], "jumps": ["P1120", "P1170"]}, {"id": "P1150", "text": ["If the PCM signal becomes attenuated or distorted in transmission, the receiver circuit can compensate."], "jumps": ["P1120", "P1160"]}, {"id": "P1140", "text": ["Then the binary number sets are converted to an analog signal by a digital to analog (D/A) converter."], "jumps": ["P1120", "P1150"]}, {"id": "P1130", "text": ["The PCM signal is first demodulated, changing the pulse string into sets of binary numbers."], "jumps": ["P1120", "P1140"]}, {"id": "P1120", "text": ["A second requirement for PCM systems is to change the digital signals back into an analog signal."], "jumps": ["P1130", "P1080"]}, {"id": "P1110", "text": ["The result is a string of pulses that is transmitted."], "jumps": ["P1080", "P1120"]}, {"id": "P1100", "text": ["After conversion, the set of digital numbers that represent the analog information signal are then used to form the pulse string --called modulation.."], "jumps": ["P1080", "P1110"]}, {"id": "P1090", "text": ["An analog information signal is converted into a set of digital numbers, each represents the analog level at one particular instant of time, by an analog to digital (A/D) converter."], "jumps": ["P1080", "P1100"]}, {"id": "P1080", "text": ["Since you live in an analog world, one of the requirements of a PCM system is to convert the analog information signal to digital before it is used for modulation."], "jumps": ["P1070", "P1090"]}, {"id": "P1072", "text": ["PCM stands for pulse code modulation. PCM systems do not use analog signals, they use digital signals."], "jumps": []}, {"id": "P1071", "text": [], "jumps": []}, {"id": "P1070", "text": ["\u0000\u0000\u0000incorrect1\u0000\u0000/\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000Y\u0001\u000f\u0000\u0000\u0000 \u0000\u0006\u0000AnalogChoiceett\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000o\u0001\u0010\u0000\u0000\u0000\u0001\u0000\u0001\u0000\u0000\u0000,\u0004\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000x\u0001\u0000\u0000\u00fa\u0000\u00ba\u0004\u0012\u0002\u0085\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u00af\u0001\u0012\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0014\u0000\u0013\u0000x\u001e\u0000\u0000\u0019\u0000\u001a\u0000\u00e5c\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00c7\u0001\u0013\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00d9\u0001\u0014\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000\u00f3\u0001\u0015\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0017\u0002\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00ba\u0004\u0002\u0000\u0000\u0000V\u0006\u0003\u0000\u0000\u0000t\u0007\u0000\u0000\u0000\u0000\u0000\u00001\u0002\u0017", "What type of signals are used in PCM?......................"], "jumps": ["P1020"]}, {"id": "P1060", "text": ["The terms modulation and demodulation are carry-overs from analog signal processing.."], "jumps": ["P1020", "P1070"]}, {"id": "P1050", "text": ["In other words, PCM is more like a coding scheme."], "jumps": ["P1020", "P1060"]}, {"id": "P1040", "text": ["No pulse is placed on the string to represent a digital or binary O."], "jumps": ["P1020", "P1050"]}, {"id": "P1030", "text": ["A pulse is placed on the string to represent a digital or binary 1."], "jumps": ["P1020", "P1040"]}, {"id": "P1020", "text": ["PCM uses a string of pulses to represent binary numbers...."], "jumps": ["P1015", "P1030"]}, {"id": "P1015", "text": ["The most common method of digital signal processing is Pulse Code Modulation, or PCM for short."], "jumps": ["P1001", "P1020"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P500", "text": ["Let's begin the lesson on PULSE CODE MODULATION (PCM)....................."], "jumps": ["P480", "PCM"]}, {"id": "P490", "text": ["More and more audio systems are becoming digital and the process of digital signal processing and digital audio processing is the same."], "jumps": ["P480", "P500"]}, {"id": "P480", "text": ["Also, the techniques of digital communications has found its way into the audio industry."], "jumps": ["P490", "P400"]}, {"id": "P470", "text": ["And as a technician, you will see more and more digital communication circuits."], "jumps": ["P400", "P480"]}, {"id": "P460", "text": ["Because of the advantages, digital signal processing is used throughout the communication industry."], "jumps": ["P400", "P470"]}, {"id": "P450", "text": ["The HIGHs and LOWs can be amplified and shaped to eliminate the effects of transmission without changing the information content of the signal."], "jumps": ["P400", "P460"]}, {"id": "P440", "text": ["Second, digital signals are not noisy. There is only a HIGH or LOW signal."], "jumps": ["P400", "P450"]}, {"id": "P430", "text": ["The operation of ICs is very easy to understand and IC circuits are easy to troubleshoot."], "jumps": ["P400", "P440"]}, {"id": "P420", "text": ["Digital signal proc let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
