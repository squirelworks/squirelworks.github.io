tor class             AB, where the transistors are ON for just a little more than               an alternation.", "This distortion is eliminated by biasing the transistor class AB, where the transistors are ON for just a little more than an alternation. . Press Enter to set: Positive Supply Voltage - 12"], "jumps": ["P13400"]}, {"id": "P13400", "text": ["Crossover distortion occurs when one transistor turns OFF before the other one turns ON."], "jumps": ["P13410", "P13390"]}, {"id": "P13430", "text": ["Notice the output signal on CH2 is no longer distorted around the zero crossing points on the waveform. When 15 volts is the +Vcc, the amplifier circuit is biased for class AB (about .7 V). Class AB eliminates the crossover distortion..d for class AB (about .7 V). Class AB eliminates the crossover distortion.", "Volts/Div: .1 Volt Time/Div: .1 mSS"], "jumps": ["P13420"]}, {"id": "P13910", "text": ["This completes the experiment on PUSH-PULL AMPLIFIER OPERATION."], "jumps": ["P2001", "P13470"]}, {"id": "P13380", "text": ["With 12 volts as +Vcc, Q2 and Q3 are biased for class B operation (about .6 V).", "With 12 volts as +Vcc, Q2 and Q3 are biased for class B operation (about .6 V). en 15 volts is the +Vcc, the amplifier circuit is biased for class AB (about .7 V). Class AB eliminates the crossover distortion.the crossover distortion..."], "jumps": ["P13370"]}, {"id": "P13370", "text": ["The AC portion of the common collector push-pull amplifier is operating normally. Q2 pulls current through RL and Q3 pushes current through RL."], "jumps": ["P13380", "P13360"]}, {"id": "P13365", "text": ["OSCILLOSCOPE LEAD PLACEMENT - Oscilloscope CH1 probe to TP7. Oscilloscope CH2 probe to TP11."], "jumps": []}, {"id": "P13360", "text": ["11.  Connect CH2 input to TP11. The oscilloscope is displaying             the input signal (TP7 and TP8) on CH1 and the output signal          (TP11 on CH2).", "11. Connect CH2 input to TP11. The oscilloscope is displaying the input signal (TP7 and ect Function Generator to the Test Console PC2 OUTPUT BNC."], "jumps": []}, {"id": "P13280", "text": ["1.  Connect the output of a function generator to PC2 output                BNC. This connects the function generator to the input of               PC3.", "1. Connect the output of a function generator to PC2 output BNC. This connects the function generator to the input of PC3."], "jumps": ["P13290", "P13270", "P13285"]}, {"id": "P13270", "text": ["6.  Disconnect the multimeter from the circuit.  Now that you                know  the bias circuits are operating correctly, let's connect           an AC input and check the AC operation of the common                  emitter push-pull amplifier.", "6. Disconnect the multimeter from the circuit. Now that you know the bias circuits are operating correctly, let's connect an AC input and check the AC operation of the common emitter push-pull amplifier.."], "jumps": ["P13280", "P13260"]}, {"id": "P13265", "text": ["MEASUREMENT SETUP - Measure DC voltage between TP8 and TP10."], "jumps": []}, {"id": "P13260", "text": ["5.  Using a multimeter, measure the voltage between TP8 and             TP10. Place the black test lead on TP10. You should measure        approximately -.6 V. This is the base bias that places Q3 near         cutoff.", "5. Using a multimeter, measure the voltage between TP8 and TP10. Place the black test lead on TP10. You should measure approximately -.6 V. This is the base bias that places Q3 near cutoff.."], "jumps": ["P13270", "P13250", "P13265"]}, {"id": "P13255", "text": ["MEASUREMENT SETUP - Measure DC voltage between TP7 and TP10."], "jumps": []}, {"id": "P13250", "text": ["4.  Using a multimeter, measure the DC voltage between TP7 and      TP10.  Place the black test lead on TP10.  You should measure      about +.6 V.  This is the base bias that places Q2 near cutoff.", "4. Using a multimeter, measure the DC voltage between TP7 and TP10. Place the black test lead on TP10. You should measure about +.6 "P2060", "text": ["Q2 and Q3 form the common collector push-pull amplifier."], "jumps": ["P2070", "P2040"]}, {"id": "P2050", "text": ["Compare the card with the schematic shown."], "jumps": ["P2060", "P2040"]}, {"id": "P2040", "text": ["Pick up the PC130-34 card. This card is used to demonstrate the operation of common collector push-pull amplifiers."], "jumps": ["P2050", "P2020"]}, {"id": "P2020", "text": ["The purpose of this experiment is to demonstrate the normal operation of a common collector push-pull amplifier.", "Push-Pull Amplifier"], "jumps": ["P2040", "P2001"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P13211", "text": [], "jumps": []}, {"id": "P1960", "text": ["5.  Q1 and Q2 are common collector Class B amplifiers in series.        C2 charges and discharges to develop the output across RL.", "5. Q1 and Q2 are common collector Class B amplifiers in series. C2 charges and discharges to develop the output across RL."], "jumps": ["P1999", "P1950"]}, {"id": "P1950", "text": ["4.  The common collector push-pull amplifier uses one NPN and         one PNP transistor.", "4. The common collector push-pull amplifier uses one NPN and one PNP transistor."], "jumps": ["P1960", "P1930"]}, {"id": "P1940", "text": ["3.  Q1 and Q2 are common emitter Class B amplifiers in parallel.          T1 produces  two signals 180\u00ba out of phase.  T2 combines the       positive and negative alternation on the output.", "3. Q1 and Q2 are common emitter Class B amplifiers in parallel. T1 produces two signals 180", "out of phase. T2 combines the positive and negative alternation on the output...."], "jumps": ["P1950", "P1930"]}, {"id": "P1930", "text": ["2.  The common emitter push-pull amplifier uses transformers.", "2. The common emitter push-pull amplifier uses transformers."], "jumps": ["P1940", "P1920"]}, {"id": "P1920", "text": ["1.   Push-pull amplifiers are power amplifiers that have:", "1. Push-pull amplifiers are power amplifiers that have:.."], "jumps": ["P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on PUSH-PULL AMPLIFIERS.", "This completes the information on PUSH-PULL AMPLIFIERS....."], "jumps": ["P1001", "P1680"]}, {"id": "P1683", "text": ["C2 will charge to half of +Vcc, or 6 V. This voltage is positive."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary.  You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1950"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P13191", "text": [], "jumps": []}, {"id": "P1681", "text": [], "jumps": []}, {"id": "P1680", "text": ["How is the negative bias for Q2 developed?", "How is the negative bias for Q2 developed?.................", "The difference between potentials on the base and emitter"], "jumps": ["P1670"]}, {"id": "P1672", "text": ["The two transistors are not the same type. Remember, one input signal is applied to both bases that are biased class B."], "jumps": []}, {"id": "P1671", "text": [], "jumps": []}, {"id": "P1670", "text": ["What type of transistors are used in a common collector push-pull amplifier?"], "jumps": ["P1630"]}, {"id": "P1660", "text": ["With no load, there is no charge or discharge path for C2.  The charge on the left hand plate of C2 builds up to levels that can damage the transistors.", "With no load, there is no charge or discharge path for C2. The charge on the left hand plate of C2 builds up to levels that can damage the transistors."], "jumps": ["P1670", "P1630"]}, {"id": "P1650", "text": ["The disadvantage of common collector push-pull amplifiers is that the transistors can be damaged if the load is disconnected."], "jumps": ["P1660", "P1630"]}, {"id": "P1640", "text": ["The advantage of common collector push-pull amplifiers is that transformers are not used."], "jumps": ["P1650", "P1630"]}, {"id": "P1630", "text": ["The combined effect of the circuit produces a current amplified output with high current gain, high efficiency, low output resistance, and low distortion."], "jumps": ["P1640", "P1520"]}, {"id": "P1620", "text": ["Just like in a single common collector class B amplifier, Q2 amplifies half the input signal (current only) with no phase change."], "jumps": ["P1630", "P1520"]}, {"id": "P1610", "text": ["This current flow establishes the negative alternation output."], "jumps": ["P1620", "P1520"]}, {"id": "P1600", "text": ["C2 charging in the negative direction repels electrons on the right side of C2 to ground through RL.", "C2 charging in the negative direction attracts positive charges on the right side of C2 from ground through RL.", "the negative direction attracts positive charges on", "C2 charging in the negative direction repels electrons on the right side of C2 to ground through RL.through RL."], "jumps": ["P1610", "P1520"]}, {"id": "P1590", "text": ["Q2 conducting pushes current to the left hand plate of C2, charging it in the negative direction.", "Q2 conducting pulls current to the left hand plate of C2, charging it in the negative direction."], "jumps": ["P1600", "P1520"]}, {"id": "P1580", "text": ["On the negative alternation of the input signal, Q1 is cutoff and Q2 conducts."], "jumps": ["P1590"]}, {"id": "P1570", "text": ["Just like in a single common collector class B amplifier, Q1 amplifies half the input signal (current only) with no phase change."], "jumps": ["P1580", "P1520"]}, {"id": "P1560", "text": ["This current flow establishes the positive alternation across RL."], "jumps": ["P1570", "P1520"]}, {"id": "P1550", "text": ["C2 charging in the positive direction attracts electrons on the right side of C2 from ground through RL.", "C2 charging in the positive direction causes positive charges on the right side of C2 to flow towards ground.", "C2 charging in the positive direction attracts electrons on the right side of C2 from ground through RL.ound."], "jumps": ["P1560", "P1520"]}, {"id": "P1540", "text": ["Q1 conducting pulls current from the left hand plate of C2, charging it in the positive direction.", "Q1 conducting pushes current to the left hand plate of C2, charging it in the positive direction."], "jumps": ["P1550", "P1520"]}, {"id": "P1530", "text": ["On the positive alternation of the input signal, a positive signal is applied to the base of Q1 and Q2.  Q1 conducts and Q2 is cutoff.", "On the positive alternation of the input signal, a positive signal is applied to the base of Q1 and Q2. Q1 conducts and Q2 is cutoff."], "jumps": ["P1540", "P1520"]}, {"id": "P1520", "text": ["Now, with the correct biasing, let's look at the effect of applying an AC input signal."], "jumps": ["P1530", "P1512"]}, {"id": "P1515", "text": ["Q1 AND Q2 BIAS - Q1 - With +6 on the emitter and +6.6 V on the base, the difference in potential between the elements is +.6 V. Q2 - With +6 V on the emitter and +5.4 V on the base, the difference in potential between the elements is -.6 V.", "e emitter and +5.4 V on the base, the difference in potential between the elements is -.6 V."], "jumps": ["P1512"]}, {"id": "P1512", "text": ["The voltage on the emitters establish the biasing for Q1 at +.6 V & Q2 at -.6 V. This biases both transistors at cutoff or class B."], "jumps": ["P1520", "P1472", "P1515"]}, {"id": "P1510", "text": ["The voltage on the emitters establish the biasing for Q1 at +.6V  & Q2 at -.6 V. This biases both transistors at cutoff or class B.", "The voltage on the emitters establish the biasing for Q1 at +.6V & Q2 at -.6 V. This biases both transistors at cutoff or class B.."], "jumps": ["P1520", "P1472", "P1515"]}, {"id": "P1500", "text": ["Q1 and Q2 must be matched transistors. The NPN transistor must have the same gain & characteristics as the PNP transistor for proper circuit operation."], "jumps": ["P1510", "P1472"]}, {"id": "P1490", "text": ["However, the emitters of Q1 and Q2 are not at ground potential. +Vcc is divided between them placing the emitters at +6V."], "jumps": ["P1500", "P1472"]}, {"id": "P1480", "text": ["At first glance, these voltages appear to be high for biasing a transistor at cutoff, and Q2 has a positive voltage."], "jumps": ["P1490", "P1472"]}, {"id": "P1475", "text": ["BASE VOLTAGES Er1 = It x R1 = 5.4 V Rt = 2.22 kW Er2 = It x R2 = .59 V It = 12 V/2.22 kW = 5.4 mA Er3 = It x R3 = .59 V Eb1 = +Vcc - Er1 = 6.6 V Er4 = It x R4 = 5.4 V Eb2 = +Vcc - Er1 - Er2 - Er3 = 5.4 V"], "jumps": []}, {"id": "P1472", "text": ["Base voltage for Q1 is 6.6 V and the base voltage for Q2 is 5.4 V."], "jumps": ["P1480", "P1450", "P1475"]}, {"id": "P1470", "text": ["Base voltage for Q1 is 6.6 V and the base voltage for Q2 is 5.4 V."], "jumps": ["P1480", "P1450", "P1475"]}, {"id": "P1460", "text": ["The base voltage for Q1 and Q2 is easily computed, R1 through R4 form a voltage divider."], "jumps": ["P1470", "P1450"]}, {"id": "P1450", "text": ["Let's see how the base bias voltages are established (especially the negative bias voltage for Q2) and how the output signal is produced in this circuit."], "jumps": ["P1460", "P1391"]}, {"id": "P1440", "text": ["Symmetry refers to the bias circuits for Q1 and Q2 being a mirror image.  R1 and R4 equal in value, R2 and R3 equal in value.", "Symmetry refers to the bias circuits for Q1 and Q2 being a mirror image. R1 and R4 equal in value, R2 and R3 equal in value."], "jumps": ["P1450", "P1391"]}, {"id": "P1430", "text": ["Complementary refers to the use of both PNP and NPN transistors."], "jumps": ["P1440", "P1391"]}, {"id": "P1420", "text": ["Common collector push-pull amplifiers are commonly called complementary symmetry amplifiers."], "jumps": ["P1430", "P1391"]}, {"id": "P1410", "text": ["Distortion caused by class B amplifiers is overcome by taking the output between Q1 and Q2."], "jumps": ["P1420", "P1391"]}, {"id": "P1400", "text": ["Low output resistance is achieved by the use of common collector amplifiers."], "jumps": ["P1410", "P1391"]}, {"id": "P1395", "text": ["Transistor conducts for less than half of the input signal. Transistor conducts for less than half of the input signal. Transistor conducts for less than half of the input signal. Transistor conducts for less than half of the input signal. of the input signal. put signal.", "A Transistor conducts for the entire duration of input signal...", "B Transistor conducts for half of the input signal.........gnal.", "AB Transistor conducts for a bit more than half a cycle.............", "C Transistor conducts for less than half of the input signal. nal.", "CLASS INPUT OUTPUT"], "jumps": []}, {"id": "P1391", "text": ["High efficiency is achieved by biasing both transistors class B. Q1 conducts on positive alternations and Q2 conducts on negative alternations of  the input signal.", "High efficiency is achieved by biasing both transistors class B. Q1 conducts on positive alternations and Q2 conducts on negative alternations of the input signal."], "jumps": ["P1400", "P1360", "P1395"]}, {"id": "P1390", "text": ["High efficiency is achieved by biasing both transistors class B. Q1 conducts on positive alternations and Q2 conducts on negative alternations of  the input signal.", "High efficiency is achieved by biasing both transistors class B. Q1 conducts on positive alternations and Q2 conducts on negative alternations of the input signal."], "jumps": ["P1400", "P1360", "P1395"]}, {"id": "P1380", "text": ["Common collector amplifiers have high current gain."], "jumps": ["P1390", "P1360"]}, {"id": "P1370", "text": ["Q1 and Q2 are series common collector transistor amplifiers.  Note that one is a PNP and the other is an NPN.", "Q1 and Q2 are series common collector transistor amplifiers. Note that one is a PNP and the other is an NPN."], "jumps": ["P1380", "P1360"]}, {"id": "P1360", "text": ["This is a typical common collector push-pull amplifier circuit."], "jumps": ["P1370", "P1350"]}, {"id": "P1350", "text": ["The disadvantage of using transformers is overcome by the common collector push-pull amplifier."], "jumps": ["P1360", "P1340"]}, {"id": "P1342", "text": ["Remember, the common emitter push-pull amplifier inverts the input.", "Remember, the common emitter push-pull amplifier inverts the input........."], "jumps": []}, {"id": "P1341", "text": [], "jumps": []}, {"id": "P1340", "text": ["Select the output signal for this circuit.", "Select the output signal for this circuit.................."], "jumps": ["P1330"]}, {"id": "P1333", "text": ["Base bias for both Q1 and Q2 is 0 V, it is not developed in the circuit."], "jumps": []}, {"id": "P1332", "text": ["Both Q1 and Q2 are biased class B, they only conduct on positive alternations of an input signal. To produce a complete output, Q1 and Q2 input signals must be out of phase."], "jumps": []}, {"id": "P1331", "text": [], "jumps": []}, {"id": "P1330", "text": ["What is the purpose of the center tapped secondary in T1?", "What is the purpose of the center tapped secondary in T1?.."], "jumps": ["P1300"]}, {"id": "P1320", "text": ["The disadvantage of common emitter push-pull amplifiers is that the circuit uses transformers. This adds cost and requires more room for components."], "jumps": ["P1330", "P1300"]}, {"id": "P1310", "text": ["The advantage of common emitter push-pull amplifiers is that T2 can be designed to exactly match the load resistance."], "jumps": ["P1320", "P1300"]}, {"id": "P1300", "text": ["The combined effect of the circuit produces an amplified inverted output with high current gain, high efficiency, low output resistance, and low distortion."], "jumps": ["P1310", "P1180"]}, {"id": "P1280", "text": ["Just like in a single common emitter class B amplifier, Q2 amplifies half the input signal and inverts the phase."], "jumps": ["P1300", "P1180"]}, {"id": "P1270", "text": ["Since T2 is an in phase transformer, the output is positive."], "jumps": ["P1280", "P1180"]}, {"id": "P1260", "text": ["Current flows from ground to +Vcc through Q2 and the bottom half of T2's primary. This causes a negative potential at the bottom of T2.", "Current flows from +Vcc to ground through the bottom half of T2's secondary, and through Q2. This causes a negative potential at the bottom of T2.", "Current flows from ground to +Vcc through Q2 and the bottom half of T2's primary. This causes a negative potential at the bottom of T2.ttom of T2."], "jumps": ["P1270", "P1180"]}, {"id": "P1682", "text": ["The voltage divider establishes the base voltage which will be positive."], "jumps": []}, {"id": "P1240", "text": ["Just like in a single common emitter class B amplifier, Q1 amplifies half the input signal and inverts the phase."], "jumps": ["P1250", "P1180"]}, {"id": "P1230", "text": ["Since T2 is an in phase transformer, the output is negative."], "jumps": ["P1240", "P1180"]}, {"id": "P1220", "text": ["The current flow causes a negative potential at the top of the primary winding of T2."], "jumps": ["P1230", "P1180"]}, {"id": "P1210", "text": ["Current flows from ground to +Vcc through Q1 and the top half of T2's primary. NOTE The resistance of the primary winding of T2 acts as the collector load resistance...", "Current flows from +Vcc to the top half of T2's primary to ground through Q1. NOTE The resistance of the primary winding of T2 acts as the collector load resistance....s the collector load resistance."], "jumps": ["P1220", "P1180"]}, {"id": "P1200", "text": ["Q1 conducts and Q2 is cutoff."], "jumps": ["P1210", "P1180"]}, {"id": "P1190", "text": ["During the positive alternation of the input signal, a positive signal is applied to the base of Q1 and a negative signal is applied to the base of Q2."], "jumps": ["P1200", "P1180"]}, {"id": "P1180", "text": ["AC inputs applied to the primary of T1 produce two outputs on the center tapped secondary that are 180 degrees out of phase.", "AC inputs applied to the primary of T1 produce two outputs on the center tapped secondary that are 180 degrees out of phase.c"], "jumps": ["P1190", "P1162"]}, {"id": "P1170", "text": ["Let's see how common emitter push-pull amplifiers operate."], "jumps": ["P1180", "P1162"]}, {"id": "P1165", "text": ["CROSSOVER DISTORTION - Crossover distortion occurs between the time one transistor cuts off and the other one comes on. In some applications, like battery-powered systems, this is a desirable effect because no current drain occurs during this time."], "jumps": []}, {"id": "P1162", "text": ["The collector outputs of Q1 and Q2 reproduce the input wave shape with little distortion. The small amount of distortion that is present is called crossover distortion."], "jumps": ["P1170", "P1142"]}, {"id": "P1160", "text": ["The collector outputs of Q1 and Q2 reproduce the input wave shape with little distortion. The small amount of distortion that is present is called crossover distortion."], "jumps": ["P1170", "P1142"]}, {"id": "P1150", "text": ["Low output resistance is achieved by matching the resistance of T2's secondary with the load."], "jumps": ["P1160", "P1142"]}, {"id": "P1145", "text": ["Transistor conducts for less than half of the input signal. Transistor conducts for less than half of the input signal. Transistor conducts for less than half of the input signal. Transistor conducts for less than half of the input signal. of the input signal. put signal.", "CLASS INPUT OUTPUT", "A Transistor conducts for the entire duration of input signal...", "B Transistor conducts for half of the input signal.........gnal.", "AB Transistor conducts for a bit more than half a cycle.............", "C Transistor conducts for less than half of the input signal. nal."], "jumps": []}, {"id": "P1142", "text": ["High efficiency is achieved by not applying a DC bias to the bases (0 V). Q1 and Q2 will only conduct on positive alternations of an input signal, Class B."], "jumps": ["P1150", "P1110", "P1145"]}, {"id": "P1140", "text": ["High efficiency is achieved by not applying a DC bias to the bases (0 V). Q1 and Q2 will only conduct on positive alternations of an input signal, Class B."], "jumps": ["P1150", "P1110", "P1145"]}, {"id": "P1130", "text": ["Common emitter amplifiers have medium current gain however, since Q1 and Q2 are in parallel the output current gain is high."], "jumps": ["P1140", "P1110"]}, {"id": "P1120", "text": ["Q1 and Q2 are parallel common emitter NPN transistor amplifiers."], "jumps": ["P1130", "P1110"]}, {"id": "P1110", "text": ["This is a typical common emitter push-pull amplifier circuit."], "jumps": ["P1120", "P1080"]}, {"id": "P1100", "text": ["Let's look at the common emitter push-pull amplifier first."], "jumps": ["P1110", "P1080"]}, {"id": "P1090", "text": ["The circuits are called:"], "jumps": ["P1100", "P1080"]}, {"id": "P1080", "text": ["These characteristics are obtained in push-pull amplifiers by using two transistors either in parallel or in series."], "jumps": ["P1090", "P1020"]}, {"id": "P1070", "text": ["4. LOW DISTORTION:  The shape of the output signal must                                                        match the shape of the input signal.", "4. LOW DISTORTION: The shape of the output signal must match the shape of the input signal."], "jumps": ["P1080", "P1020"]}, {"id": "P1060", "text": ["3. LOW OUTPUT RESISTANCE:  The output of the amplifier must                                                               match the input resistance of a                                                                 load to transfer the power                                                                           without losses.", "3. LOW OUTPUT RESISTANCE: The output of the amplifier must match the input resistance of a load to transfer the power without losses..."], "jumps": ["P1070", "P1020"]}, {"id": "P1050", "text": ["2. HIGH EFFICIENCY:  An amplifier that delivers high current to a                                             load requires large amounts of operating                                              power from the power supply. let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
