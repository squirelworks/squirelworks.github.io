", "P300"]}, {"id": "P410", "text": ["The first flip-flop is called the Master.  The second flip-flop is called the Slave.", "The first flip-flop is called the Master. The second flip-flop is called the Slave."], "jumps": ["P400"]}, {"id": "P420", "text": ["The most interesting feature of the Master Slave flip-flop is the time delay between the input and output."], "jumps": ["P430", "P400"]}, {"id": "P424", "text": ["The most interesting feature of the Master Slave flip-flop is the time delay between the input and output."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["In this lesson you will learn how the Master Slave uses the clock input to control the output."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on MASTER SLAVE FLIP-FLOP.........................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": ["P440"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["You know that some flip-flops are controlled by the clock input.  The clock triggers the desired output.", "You know that some flip-flops are controlled by the clock input. The clock triggers the desired output."], "jumps": ["P1030", "P1001"]}, {"id": "P1025", "text": ["TRIGGERING - Digital circuits operate from square and pulsed wave inputs.  Both waves have a leading edge, pulse width and trailing edge.", "TRIGGERING - Digital circuits operate from square and pulsed wave inputs. Both waves have a leading edge, pulse width and trailing edge."], "jumps": ["P1026", "P1020"]}, {"id": "P1026", "text": ["Digital circuits are designed to trigger or operate from the leading edge, trailing edge or the width of the input wave form."], "jumps": ["P1020", "P1025"]}, {"id": "P1030", "text": ["The point at which a flip-flop recognizes the input clock signal is very important to the final output of the circuit.", "The point at which a flip-flop recognizes the input clock signal is very important to the final output of the circuit..."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Three types of clock triggering are used with flip-flops.  Let's begin the discussion with the level trigger.", "Three types of clock triggering are used with flip-flops. Let's begin the discussion with the level trigger."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["Level triggering uses the entire pulse width to gate the inputs to the flip-flop."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["At T1 the clock is low, disabling inputs S and R.  The initial state is RESET (Q is high).", "At T1 the clock is low, disabling inputs S and R. The initial state is RESET (Q is high)."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["At T2 the clock goes high enabling the inputs on S and R.  The inputs are enabled for the entire pulse width of T2.", "At T2 the clock goes high enabling the inputs on S and R. The inputs are enabled for the entire pulse width of T2."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["When S is high, Q is high."], "jumps": ["P1082", "P1050"]}, {"id": "P1082", "text": ["When R is high, Q is high."], "jumps": ["P1084", "P1050"]}, {"id": "P1084", "text": ["The flip-flopping continues for the entire pulse width of T2."], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["At T3 the clock goes low disabling the inputs on S and R.  The flip-flop stays in the state recognized just before the clock goes low.", "At T3 the clock goes low disabling the inputs on S and R. The flip-flop stays in the state recognized just before the clock goes low."], "jumps": ["P1095", "P1050"]}, {"id": "P1095", "text": ["Level triggering can also use the low portion of the clock pulse."], "jumps": ["P1097", "P1050"]}, {"id": "P1097", "text": ["The inputs are enabled when the clock is low.  Note the bubble on the clock input.", "The inputs are enabled when the clock is low. Note the bubble on the clock input."], "jumps": ["P1100", "P1095"]}, {"id": "P1100", "text": ["What is the final output state of this level triggered flip-flop?"], "jumps": ["P1095"]}, {"id": "P1101", "text": [], "jumps": []}, {"id": "P1102", "text": ["The output state will change according to the inputs on J and K as long as the clock stays high.  The last high input is held when the clock goes low.", "The output state will change according to the inputs on J and K as long as the clock stays high. The last high input is held when the clock goes low."], "jumps": []}, {"id": "P1103", "text": ["In the toggle state, the flip-flop changes state on each different clock pulse, not during a clock pulse."], "jumps": []}, {"id": "P1110", "text": ["Next, let's discuss edge triggering.", "Next, let's discuss edge triggering........................"], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["Edge triggering uses either the leading or trailing edge of the waveform to gate the inputs to a flip-flop.", "Edge triggering uses either the leading or trailing edge of the waveform to gate the inputs to a flip-flop...."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["Notice the symbol on the clock input.  This identifies a leading edge triggered flip-flop.", "Notice the symbol on the clock input. This identifies a leading edge triggered flip-flop."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["Adding a bubble to the clock input identifies a trailing edge triggered flip-flop."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["At T1 the clock is low disabling inputs S and R.  The flip-flop stays in a reset condition.", "At T1 the clock is low disabling inputs S and R. The flip-flop stays in a reset condition."], "jumps": ["P1160", "P1120"]}, {"id": "P1160", "text": ["At T2 the clock goes high producing a leading edge spike.  Any input high at the time of the leading edge is gated through.", "At T2 the clock goes high producing a leading edge spike. Any input high at the time of the leading edge is gated through."], "jumps": ["P1170", "P1120"]}, {"id": "P1170", "text": ["At the time of the leading edge spike, input S is high.  The flip-flop changes to a s state.", "At the time of the leading edge spike, input S is high. The flip-flop changes to a s state.", "At the time of the leading edge spike, input S is high. The flip-flop changes to a SET state (Q is high)."], "jumps": ["P1180", "P1120"]}, {"id": "P1180", "text": ["The clock remains high for T2 but neither the risR does not change the output.  The output only changes on the leading edge.", "The clock remains high for T2 but neither the risR does not change the output. The output only changes on the leading edge.", "The clock remains high for T2 but neither the rise at R nor the drop at S changes the output. The output only changes on the leading edge........."], "jumps": ["P1190", "P1120"]}, {"id": "P1190", "text": ["At T3 the clock goes low disabling inputs S and R."], "jumps": ["P1200", "P1120"]}, {"id": "P1200", "text": ["If this flip-flop were designed to trigger on the trailing edge of the clock pulse, the output state would be SET."], "jumps": ["P1210", "P1120"]}, {"id": "P1210", "text": ["At T2 the clock goes high and remains high.  However, inputs are only gated through on the trailing edge of the pulse.", "At T2 the clock goes high and remains high. However, inputs are only gated through on the trailing edge of the pulse."], "jumps": ["P1215", "P1200"]}, {"id": "P1215", "text": ["At T3 the clock goes low producing a trailing edge spike.  Any input high at the time of the trailing edge is gated through.", "At T3 the clock goes low producing a trailing edge spike. Any input high at the time of the trailing edge is gated through."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["What is the final output of this edge triggered flip-flop?", "What is the final output of this edge triggered flip-flop?."], "jumps": ["P1200"]}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1222", "text": ["Even though the clock pulse is high, the flip-flop will not change states after the spike pulse from the leading edge."], "jumps": []}, {"id": "P1230", "text": ["What is the final output state of this edge triggered flip-flop?"], "jumps": ["P1220"]}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1232", "text": ["The flip-flop triggers on the trailing edge.  The output state is determined when the clock goes low.", "The flip-flop triggers on the trailing edge. The output state is determined when the clock goes low."], "jumps": []}, {"id": "P1240", "text": ["Last, let's discuss pulse trigger.", "Last, let's discuss pulse trigger.........................."], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["Notice the symbol on the Q and Q outputs.  This identifies a pulse triggered flip-flop.", "Notice the symbol on the Q and Q outputs. This identifies a pulse triggered flip-flop."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["The inputs are gated in at the leading edge (edge triggered) or when the clock pulse is high (level triggered)."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["The output is gated out at the trailing edge (edge triggered) or when the clock pulse is low (level triggered)."], "jumps": ["P1284", "P1260"]}, {"id": "P1284", "text": ["The pulse width determines the time delay.  Let's look at an edge triggered flip-flop using pulse triggering.", "The pulse width determines the time delay. Let's look at an edge triggered flip-flop using pulse triggering."], "jumps": ["P1286", "P1260"]}, {"id": "P1286", "text": ["At T1 the clock is low disabling inputs S and R.  The output of each flip-flop stays the same.", "At T1 the clock is low disabling inputs S and R. The output of each flip-flop stays the same."], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["At T2 the clock goes high enabling inputs S and R of flip-flop 1.  The output of flip-flop 1 is Set.", "At T2 the clock goes high enabling inputs S and R of flip-flop 1. The output of flip-flop 1 is Set."], "jumps": ["P1295", "P1286"]}, {"id": "P1295", "text": ["Notice, the output of Flip-Flop 2 does not change state.  S and R are enabled on the trailing edge of the pulse.", "Notice, the output of Flip-Flop 2 does not change state. S and R are enabled on the trailing edge of the pulse."], "jumps": ["P1300", "P1286"]}, {"id": "P1300", "text": ["The pulse width of T2 determines the time delay between the leading and trailing edge of the clock pulse."], "jumps": ["P1310", "P1286"]}, {"id": "P1310", "text": ["At T3 the clock goes low.  The inputs to flip-flop 2 are enabled.  The flip-flop changes state.", "At T3 the clock goes low. The inputs to flip-flop 2 are enabled. The flip-flop changes state."], "jumps": ["P1320", "P1286"]}, {"id": "P1320", "text": ["What is the final output state of this pulse triggered flip-flop?"], "jumps": ["P1286"]}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1322", "text": ["The input, which is low, is gated on the leading edge of the clock. The output is gated on the trailing edge of the clock, which resets the flip-flop."], "jumps": []}, {"id": "P1330", "text": ["Master Slave flip-flops use pulse triggering.  The next objective describes their operation in detail.", "Master Slave flip-flops use pulse triggering. The next objective describes their operation in detail."], "jumps": ["P1910", "P1320"]}, {"id": "P1910", "text": ["This completes the information on FLIP-FLOP TRIGGERING.", "This completes the information on FLIP-FLOP TRIGGERING....."], "jumps": ["P1001", "P1330"]}, {"id": "P1920", "text": ["1.  The three types of clock triggering are:", "1. The three types of clock triggering are: el Edge Pulse"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Level triggering uses the entire pulse width to gate the inputs.", "2. Level triggering uses the entire pulse width to gate the inputs. in."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Edge triggering uses only the leading or trailing edge of the           clock pulse to gate the inputs.", "3. Edge triggering uses only the leading or trailing edge of the clock pulse to gate the inputs...."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. When the flip flop is triggered on the leading edge of the clock pulse the output state is determined when the clock goes high. the trailing edge. The output state is determined when the clock goes low.ined when the clock goes low."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. When the flip flop is triggered on the trailing edge of the clock pulse the output state is determined when the clock goes low. The flip-flop triggers on the trailing edge. The output state is determined when the clock goes low..es low."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  Pulse triggering uses the leading edge of the clock pulse to           gate the input and the trailing edge of the clock pulse to \n     gate the output.", "6. Pulse triggering uses the leading edge of the clock pulse to gate the input and the trailing edge of the clock pulse to gate the output.............."], "jumps": ["P1999", "P1960"]}, {"id": "P1999", "text": ["You have completed the Summary.  You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1970"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["The Master Slave flip-flop is designed to store an input condition until the clock pulse enables an output."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["A Master Slave flip-flop is pulse triggered, using the leading edge or the high level to gate through inputs and the trailing edge or low level to gate through outputs."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["p-flop has two parts. The first part is desiMaster and the second part, Slave.", "The name Master Slave indicates that the flip-flop has two parts. The first part is designated as the Master and the second part as the Slave."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["J and K inputs are applied to the Master.  The Slave flip-flop only reacts to the Master.", "J and K inputs are applied to the Master. The Slave flip-flop only reacts to the Master."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["Let's take a closer look at the actual operation of a Clocked RS Master Slave flip-flop using a level trigger."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["Inputs S and R are applied to the master.  The final outputs Q and Q are taken from the slave.", "Inputs S and R are applied to the master. The final outputs Q and Q are taken from the slave."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["Inputs S and R to the slave are the Q and Q outputs from the master.  The clock input is applied to the master, and inverted and applied to the slave.", "Inputs S and R to the slave are the Q and Q outputs from the master. The clock input is applied to the master, and inverted and applied to the slave."], "jumps": ["P2090", "P2060"]}, {"id": "P2090", "text": ["When the clock goes high the master inputs are enabled.  The output of the master changes based on the inputs applied.", "When the clock goes high the master inputs are enabled. The output of the master changes based on the inputs applied."], "jumps": ["P2100", "P2060"]}, {"id": "P2100", "text": ["The slave does not change because the inputs are disabled by the inverted high."], "jumps": ["P2110", "P2060"]}, {"id": "P2110", "text": ["When the clock input goes low the master is disabled.  The output of the master can no longer change.", "When the clock input goes low the master is disabled. The output of the master can no longer change."], "jumps": ["P2120", "P2060"]}, {"id": "P2120", "text": ["The low clock is inverted and applied to the slave as a high.  The slave's inputs are now enabled.", "The low clock is inverted and applied to the slave as a high. The slave's inputs are now enabled."], "jumps": ["P2130", "P2060"]}, {"id": "P2130", "text": ["The operation of the edge triggered Clocked RS Master Slave flip-flop is the same as the level triggered Clocked RS Master Slave flip-flop."], "jumps": ["P2140", "P2060"]}, {"id": "P2140", "text": ["Note, the inverter is not required for the slave.  The master is enabled on the leading edge and the slave on the trailing edge.", "Note, the inverter is not required for the slave. The master is enabled on the leading edge and the slave on the trailing edge."], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["The operation of a Type D Master Slave flip-flop is the same as a Clocked RS Master Slave flip-flop."], "jumps": ["P2160", "P2130"]}, {"id": "P2160", "text": ["The Q output of the master is not required since Type D flip-flops only use one input."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["The operation of a JK Master Slave flip-flop is the same as a Clocked RS Master Slave flip-flop."], "jumps": ["P2180", "P2150"]}, {"id": "P2180", "text": ["The master inputs are enabled only when the clock goes high.  The slave inputs are enabled only when the clock goes low.", "The master inputs are enabled only when the clock goes high. The slave inputs are enabled only when the clock goes low."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["Note that the PRE and CLR signals are used on the slave only.  These inputs override any other inputs to the slave latch.", "Note that the PRE and CLR signals are used on the slave only. These inputs override any other inputs to the slave latch.p."], "jumps": ["P2200", "P2170"]}, {"id": "P2200", "text": ["If the flip-flop is set, what are the output states of the master and slave when a high is applied to R and C?"], "jumps": ["P2170"]}, {"id": "P2201", "text": [], "jumps": []}, {"id": "P2202", "text": ["A high clock resets the master.  The slave will not change states until the clock goes low.", "A high clock resets the master. The slave will not change states until the clock goes low."], "jumps": []}, {"id": "P2210", "text": ["What is the output state of the master and slave when the clock goes low?"], "jumps": ["P2200"]}, {"id": "P2211", "text": [], "jumps": []}, {"id": "P2212", "text": ["When the clock goes low, the master inputs are disabled.  The slave inputs are enabled.", "When the clock goes low, the master inputs are disabled. The slave inputs are enabled."], "jumps": []}, {"id": "P2220", "text": ["What is the output state of this flip-flop when J is low, K is high, C is pulsed, and PRE is low?"], "jumps": ["P2210"]}, {"id": "P2221", "text": [], "jumps": []}, {"id": "P2222", "text": ["The PRE and CLR inputs override any input condition.", "The PRE and CLR inputs override any input condition........"], "jumps": []}, {"id": "P2230", "text": ["What is the output state of this flip-flop when D is low and C is pulsed?"], "jumps": ["P2220"]}, {"id": "P2231", "text": [], "jumps": []}, {"id": "P2232", "text": ["When the input is low, a type D flip-flop resets.  The master resets on the leading edge of the clock and the slave resets on the trailing edge.", "When the input is low, a type D flip-flop resets. The master resets on the leading edge of the clock and the slave resets on the trailing edge."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on MASTER SLAVE FLIP-FLOP.", "This completes the information on MASTER SLAVE FLIP-FLOP..."], "jumps": ["P2001", "P2230"]}, {"id": "P2920", "text": ["1.  The Master Slave flip-flop is designed to store an input                     condition until the clock pulse enables an output.", "1. The Master Slave flip-flop is designed to store an input condition until the clock pulse enables an output."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2.  Master Slave flip-flops are constructed from two Clocked RS,        Type D, or JK flip-flops.", "2. Master Slave flip-flops are constructed from two Clocked RS, Type D, or JK flip-flops."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3.  When the clock is high the master inputs are enabled and the        slave inputs are disabled.", "3. When the clock is high the master inputs are enabled and the slave inputs are disabled."], "jumps": ["P2950", "P2930"]}, {"id": "P2950", "text": ["4.  When the clock is low the master inputs are disabled and the         slave inputs are enabled.", "4. When the clock is low the master inputs are disabled and the slave inputs are enabled."], "jumps": ["P2999", "P2940"]}, {"id": "P2999", "text": ["You have completed the Summary.  You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P2001", "P2940"]}, {"id": "P3001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P3020", "text": ["This experiment demonstrates the operation of a Master Slave flip-flop.  You will enter input signals and probe the outputs of the flip-flop to verify correct Q and Q signals.", "Pick up the PC130-137 card.  The purpose of this card is to demonstrate the operation of a Master Slave flip-flop.", "The PC130-111 Clock/Pulser Card is used to supply the Clock input to the flip-flop.", "This experiment demonstrates the operation of a Master Slave flip-flop. You will enter input signals and probe the outputs of the flip-flop to verify correct Q and Q signals.", "Pick up the PC130-137 card. The purpose of this card is to demonstrate the operation of a Master Slave flip-flop."], "jumps": ["P3040", "P3001", "P3020"]}, {"id": "P3060", "text": ["The two switches on PC130-137 select high or low inputs.  On some cards the S input is labeled J and the R input is labeled K. This doesn't necessarily mean that it is a JK flip-flop.", "The two switches on PC130-137 select high or low inputs. On some cards the S input is labeled J and the R input is labeled K. This doesn't necessarily mean that it is a JK flip-flop."], "jumps": ["P3040"]}, {"id": "P3070", "text": ["The clock input is applied to the master and inverted to the slave."], "jumps": ["P3040"]}, {"id": "P3080", "text": ["LEDs L1 and L2 indicate the master output state, and LEDs Q and Q indicate the output state of the flip-flop.  Let's begin the experiment.", "LEDs L1 and L2 indicate the master output state, and LEDs Q and Q indicate the output state of the flip-flop. Let's begin the experiment."], "jumps": ["P3040"]}, {"id": "P3090", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P3040"]}, {"id": "P3100", "text": ["2.  Set the Voltmeter Switch to Positive.  \n3.  Set the Positive Supply Voltage to 5. The Test Console's                 Voltage Meter should indicate 5 volts.", "2. Set the Voltmeter Switch to Positive. 3. Set the Positive Supply Voltage to 5. The Test Console's Voltage Meter should indicate 5 volts. SCAN FCC 0 External program = SCAN PWR 0 12"], "jumps": ["P3090"]}, {"id": "P3110", "text": ["4.  Carefully plug PC130-111 into the Test Console PC1 position.  5.  Carefully plug PC130-137 into the Test console PC2 position.", "4. Carefully plug PC130-111 into the Test Console PC1 position. 5. Carefully plug PC130-137 into the Test console PC2 position. External program = SCAN FTR 0 C1 00..................."], "jumps": ["P3100"]}, {"id": "P3120", "text": ["6.  Set S2 to PULSER on PC130-111. \n7.  Set the J and K input switches to 0 on PC130-137. \n8.  Connect the logic probe to PC130-111.", "6. Set S2 to PULSER on PC130-111. 7. Set the J and K input switches to 0 on PC130-137. 8. Connect the logic probe to PC130-111..", "SWITCH POSITIONS - PC130-111: S2 - Pulser PC130-137: J input switch - 0 K input switch - 0"], "jumps": ["P3125"]}, {"id": "P3130", "text": ["9.  Set PC1 and PC2 DC Power switches to ON.", "9. Set PC1 and PC2 DC Power switches to ON................................"], "jumps": ["P3120"]}, {"id": "P3140", "text": ["The experiment is now set up.  Let's verify the operation of a Master Slave flip-flop.", "The experiment is now set up. Let's verify the operation of a Master Slave flip-flop."], "jumps": ["P3150", "P3130"]}, {"id": "P3150", "text": ["1.  Probe the CLOCK TPs on PC130-137 for both the master and        slave.  Which of the following describes the conditions of the         clock inputs to the master and slave?", "1. Probe the CLOCK TPs on PC130-137 for both the master and slave. Which of the following describes the conditions of the clock inputs to the master and slave?"], "jumps": ["P3140", "P3155"]}, {"id": "P3151", "text": [], "jumps": []}, {"id": "P3152", "text": ["The master should have a low clock and the slave should have a high clock. Check:", "The master should have a low clock and the slave should have a high clock. Check: - PC130-111 installed in PC1 - PC130-137 installed in PC2 - PC1 and PC2 POWER ON. - Logic Probe - With your instructor.", "- PC130-111 installed in PC1 - PC130-137 installed in PC2 - PC1 and PC2 POWER ON - Logic Probe - With your instructor.", "MEASUREMENT SETUP - Probe the CLOCK test points on PC130-137."], "jumps": []}, {"id": "P3160", "text": ["2.  Press and hold S1 on PC130-111.  \n3.  While holding S1, probe the clock TPs on PC130-137 for both         the master and slave.", "2. Press and hold S1 on PC130-111. 3. While holding S1, probe the clock TPs on PC130-137 for both the master and slave.", "MEASUREMENT SETUP - PC130-111: Press and hold S1 PC130-137: Probe the CLOCK Tps"], "jumps": ["P3170", "P3150", "P3165"]}, {"id": "P3170", "text": ["Which of the following describes the conditions of the clock inputs to the master and slave with S1 pressed?"], "jumps": ["P3160"]}, {"id": "P3171", "text": [], "jumps": []}, {"id": "P3172", "text": ["The master should have a high clock and the slave should have a low clock. Check:", "The master should have a high clock and the slave should have a low clock. Check: - Measurement taken when PC130-111 S1 pressed. - With your instructor.", "- Measurement taken when PC130-111 S1 pressed. - With your instructor.....2 - PC1 and PC2 POWER ON - Logic Probe - With your instructor."], "jumps": []}, {"id": "P3180", "text": ["4.  Release PC130-111 S1.  Change J and K input switches on            PC130-137 several times.  Observe the LEDs.  Note, the state         of the master does not change.  The clock is low.", "4. Release PC130-111 S1. Change J and K input switches on PC130-137 several times. Observe the LEDs. Note, the state of the master does not change. The clock is low.", "SWITCH POSITIONS - PC130-111: Release S1 PC130-137: Change J and K Input switches several times"], "jumps": ["P3190", "P3170", "P3185"]}, {"id": "P3190", "text": ["5.  Press and hold PC130-111 S1.  Change J and K input                       switches on PC130-137 several times.  Observe the LEDs.               Note, the state of the master changes.  The clock is high.  The        state of the slave does not change.", "5. Press and hold PC130-111 S1. Change J and K input switches on PC130-137 several times. Observe the LEDs. Note, the state of the master changes. The clock is high. The state of the slave does not change...", "SWITCH POSITIONS - PC130-111: Press and hold S1. PC130-137: Change input switches J and K several times."], "jumps": ["P3200", "P3180", "P3195"]}, {"id": "P3200", "text": ["What type of triggering is used for the master in this flip-flop?"], "jumps": ["P3190"]}, {"id": "P3201", "text": [], "jumps": []}, {"id": "P3202", "text": ["Edge triggering would only allow the state of the master flip-flop to change on the leading edge of the clock pulse, not all the time when the clock pulse is high."], "jumps": []}, {"id": "P3203", "text": ["Some Master Slave flip-flops use pulse triggering, but this one does not.", "Some Master Slave flip-flops use pulse triggering, but this one does not..one uses a different type of trigg let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
