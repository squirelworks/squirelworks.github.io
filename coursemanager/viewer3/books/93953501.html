he inductor.", "4. The capacitor discharges. Again a magnetic field is produced in the inductor........................................"], "jumps": ["P2540", "P2500"]}, {"id": "P2520", "text": ["3. Once the capacitor discharges, the magnetic field of the                   inductor collapses and produces a charging current for the            capacitor. The polarity on the capacitor is reversed.", "3. Once the capacitor discharges, the magnetic field of the inductor collapses and produces a charging current for the capacitor. The polarity on the capacitor is reversed."], "jumps": ["P2530", "P2500"]}, {"id": "P2510", "text": ["2. At the input signal's negative alternation, the capacitor                      discharges through the inductor establishing a magnetic field.", "2. At the input signal's negative alternation, the capacitor discharges through the inductor establishing a magnetic field."], "jumps": ["P2520", "P2500"]}, {"id": "P2500", "text": ["TANK CIRCUIT - The operation of the tank circuit is as follows: 1. An input signal charges the capacitor to the polarity shown."], "jumps": ["P2510"]}, {"id": "P2332", "text": ["An RC oscillator has capacitors and resistors in the feedback circuit."], "jumps": []}, {"id": "P2331", "text": [], "jumps": []}, {"id": "P2330", "text": ["What type of oscillator is this circuit?", "What type of oscillator is this circuit?..................."], "jumps": ["P2320"]}, {"id": "P2323", "text": ["A crystal oscillator has a crystal in the feedback circuit."], "jumps": []}, {"id": "P2322", "text": ["A LC oscillator has an inductor and capacitor in the feedback circuit."], "jumps": []}, {"id": "P2321", "text": [], "jumps": []}, {"id": "P2320", "text": ["What type of oscillator is this circuit?", "What type of oscillator is this circuit?..................."], "jumps": ["P2292"]}, {"id": "P2310", "text": ["The circuit changes +Vcc into a sine wave output."], "jumps": ["P2320", "P2292"]}, {"id": "P2305", "text": ["The output signal is now in  and the resistors form a phase shift circuit."], "jumps": ["P2186", "P2150", "P2185"]}, {"id": "P2180", "text": ["The capacitors and the resistors form a phase shift circuit."], "jumps": ["P2186", "P2150", "P2185"]}, {"id": "P2170", "text": ["C1, C2, C3 and R1, R2, R4 make up the feedback circuit."], "jumps": ["P2180", "P2150"]}, {"id": "P2160", "text": ["Components R3 through R6 and C3 through C5 make the amplifier circuit."], "jumps": ["P2170", "P2150"]}, {"id": "P2150", "text": ["This circuit is an RC sine wave oscillator.", "This circuit is an RC sine wave oscillator................."], "jumps": ["P2160", "P2140"]}, {"id": "P2140", "text": ["Now let's look at an RC oscillator circuit using a class A common emitter amplifier. \n                                       LC       RC      CRYSTAL", "Now let's look at an RC oscillator circuit using a class A common emitter amplifier. LC RC CRYSTALLL", "Class A Common Emitter ator", "Feedback Circuit ator"], "jumps": ["P2150", "P2112"]}, {"id": "P2130", "text": ["The circuit changes +Vcc into a sine wave output."], "jumps": ["P2140", "P2112"]}, {"id": "P2125", "text": ["The output signal is now in phase with the input signal."], "jumps": ["P2130", "P2112"]}, {"id": "P2120", "text": ["The negative alternation at the bottom of C1 becomes positive at the top of C1.", "FEEDBACK SIGNAL - Since the output signal of a common collector or common base amp is in phase, the feedback signal is applied to the top of the tank circuit."], "jumps": ["P2125", "P2112"]}, {"id": "P2112", "text": ["Since the amplifier has an inverted output, the feedback is applied to the bottom of the tank circuit."], "jumps": ["P2120", "P2103", "P2115"]}, {"id": "P2110", "text": ["Since the amplifier has an inverted output, the feedback is applied to the bottom of the tank circuit."], "jumps": ["P2120", "P2103"]}, {"id": "P2103", "text": ["The tank circuit is based on an energy transfer from capacitor to inductor and back to the capacitor and so on."], " eedback circuit used.", "Amplifier Circuit ator", "Feedback Circuit ator"], "jumps": ["P2030", "P2001"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary.  \nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1960"]}, {"id": "P1990", "text": ["8.  The output of the amplifier is limited by:\n      - transistor saturation and cutoff points. \n      - the losses in the feedback circuit.", "8. The output of the amplifier is limited by: - transistor saturation and cutoff points. - the losses in the feedback circuit.", "Feedback Circuit ator"], "jumps": ["P1999", "P1960"]}, {"id": "P1980", "text": ["7.  The amplifier amplifies the input and the process is continued.", "7. The amplifier amplifies the input and the process is continued.", "Feedback Circuit ator", "Amplifier Circuit ator"], "jumps": ["P1990", "P1960"]}, {"id": "P1970", "text": ["6.  The feedback circuit allows only one frequency to pass on to         the input of the amplifier.", "6. The feedback circuit allows only one frequency to pass on to the input of the amplifier..", "Feedback Circuit ator"], "jumps": ["P1980", "P1960"]}, {"id": "P1960", "text": ["5.   An oscillator's first output signal is the noise from the                       resistors.", "5. An oscillator's first output signal is the noise from the resistors.", "Amplifier Circuit ator", "Feedback Circuit ator"], "jumps": ["P1970", "P1920"]}, {"id": "P1950", "text": ["4.  The feedback circuit selects the frequency and ensures the           phase is correct.", "4. The feedback circuit selects the frequency and ensures the phase is correct...", "Feedback Circuit ator", "Amplifier Circuit ator"], "jumps": ["P1960", "P1920"]}, {"id": "P1940", "text": ["3.  The output of the amplifier is fed back to the input.  This                   produces oscillations.", "3. The output of the amplifier is fed back to the input. This produces oscillations.", "Feedback Circuit ator"], "jumps": ["P1950", "P1920"]}, {"id": "P1930", "text": ["2.  Sine wave oscillators consist of two circuits:\n     - Amplifier  \n     - Feedback", "2. Sine wave oscillators consist of two circuits: - Amplifier - Feedback", "Amplifier Circuit ator", "Feedback Circuit ator"], "jumps": ["P1940", "P1920"]}, {"id": "P1920", "text": ["1.  Sine wave oscillators change DC energy into AC energy.", "1. Sine wave oscillators change DC energy into AC energy..", "Amplifier Circuit ator", "Feedback Circuit ator"], "jumps": ["P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on SINE WAVE OSCILLATORS.", "This completes the information on SINE WAVE OSCILLATORS...."], "jumps": ["P1001", "P1320"]}, {"id": "P1323", "text": ["The DC voltage biases the transistor in the amplifier circuit but is not the initial output of the oscillator.", "Amplifier Circuit ator", "Feedback Circuit ator"], "jumps": []}, {"id": "P1322", "text": ["The feedback circuit does not provide the first output of the oscillator.", "Amplifier Circuit ator", "Feedback Circuit ator"], "jumps": []}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1320", "text": ["An oscillator's initial output is the _______", "An oscillator's initial output is the _______.............."], "jumps": ["P1232"]}, {"id": "P1310", "text": ["Remember, no matter how complex the circuits are, you can separate components into two blocks:", "Amplifier Circuit ator"], "jumps": ["P1320", "P1232"]}, {"id": "P1300", "text": ["Second, losses in the feedback circuit reduce the input signal to the amplifier.", "Feedback Circuit ator", "Amplifier Circuit ator"], "jumps": ["P1310", "P1232"]}, {"id": "P1290", "text": ["First, transistors have saturation and cutoff points. This is equivalent to reducing the voltage gain.", "Amplifier Circuit ator"], "jumps": ["P1300", "P1232"]}, {"id": "P1280", "text": ["It may appear that the output signal gets bigger and bigger and bigger. However, the output signal is limited in two ways.", "Feedback Circuit ator"], "jumps": ["P1290", "P1232"]}, {"id": "P1270", "text": ["The sine wave output is applied to the feedback circuit and shifted 180\u00ba degrees if necessary. The process continues on and on.", "The sine wave output is applied to the feedback circuit and shifted 180", "degrees if necessary. The process continues on and on.."], "jumps": ["P1280", "P1232"]}, {"id": "P1260", "text": ["The amplifier no longer amplifies noise, it amplifies the sine wave output of the feedback circuit.", "Feedback Circuit ator", "Amplifier Circuit ator"], "jumps": ["P1270", "P1232"]}, {"id": "P1250", "text": ["The feedback circuit allows only one frequency to pass to the amplifier's input."], "jumps": ["P1260", "P1232"]}, {"id": "P1240", "text": ["The noise is applied to the feedback circuit.", "Feedback Circuit ator"], "jumps": ["P1250", "P1232"]}, {"id": "P1235", "text": ["NOISE CAUSED BY RESISTORS - Every resistor contains some free electrons. Ambient temperature causes these free electrons to move randomly in different directions. The result is noise voltage across the resistors that is amplified by the transistor.", "NOISE CAUSED BY RESISTORS - Every resistor contains some free positive charges. Ambient temperature causes these free positive charges to move randomly in different directions. The result is noise voltage across the resistors that is amplified by the transistor."], "jumps": ["P1232"]}, {"id": "P1232", "text": ["Since there is no input, the amplifier amplifies the multi-frequency noise that is produced by resistors.", "Amplifier Circuit ator", "Feedback Circuit ator"], "jumps": ["P1240", "P1200", "P1235"]}, {"id": "P1230", "text": ["Since there is no input, the amplifier amplifies the multi-frequency noise that is produced by resistors."], "jumps": ["P1240", "P1200", "P1235"]}, {"id": "P1220", "text": ["When the DC operating voltage is applied, the amplifier circuit sets up normal bias voltages to the transistor."], "jumps": ["P1230", "P1200"]}, {"id": "P1210", "text": ["Starting with the circuit turned off, the input and output signals to the amplifier are zero."], "jumps": ["P1220", "P1200"]}, {"id": "P1200", "text": ["Basic operation of all sine wave oscillator circuits are the same.", "Amplifier Circuit ator", "Feedback Circuit ator"], "jumps": ["P1210", "P1190"]}, {"id": "P1197", "text": ["You did not touch a circuit in the oscillator.", "You did not touch a circuit in the oscillator.negative sign..............", "Amplifier Circuit ator", "Feedback Circuit ator"], "jumps": []}, {"id": "P1196", "text": ["You touched the AC output signal. The AC output signal becomes the input signal for the feedback circuit.", "Amplifier Circuit ator", "Feedback Circuit ator"], "jumps": []}, {"id": "P1194", "text": ["You touched the DC input. The DC input is needed for normal operation but it does not determine the frequency.", "Amplifier Circuit ator", "Feedback Circuit ator"], "jumps": []}, {"id": "P1193", "text": ["You touched the oscillator circuit, but not the part of the oscillator that determines the frequency.", "Amplifier Circuit ator", "Feedback Circuit ator"], "jumps": []}, {"id": "P1192", "text": ["You touched the amplifier circuit. The amplifier amplifies the input. The output is used as the input.", "Amplifier Circuit ator", "Feedback Circuit ator"], "jumps": []}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1190", "text": ["Touch the circuit that determines the frequency of the oscillator."], "jumps": ["P1180"]}, {"id": "P1183", "text": ["The feedback circuit, not the amplifier, determines the frequency of the oscillator.", "Amplifier Circuit ator", "Feedback Circuit ator"], "jumps": []}, {"id": "P1182", "text": ["The feedback circuit inverts the output. The amplifier does not invert the output.", "Amplifier Circuit ator", "Feedback Circuit ator"], "jumps": []}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1180", "text": ["Oscillators use modified amplifiers to _______", "Oscillators use modified amplifiers to _______............."], "jumps": ["P1160"]}, {"id": "P1170", "text": ["The DC input, used for normal operation of the amplifier, is changed to an AC output."], "jumps": ["P1180", "P1160"]}, {"id": "P1160", "text": ["Remember, an oscillator is an amplifier circuit combined with a feedback circuit.", "Amplifier Circuit ator", "Feedback Circuit ator"], "jumps": ["P1170", "P1110"]}, {"id": "P1150", "text": ["The feedback circuit is used only to determine the frequency of the output signal.", "Feedback Circuit ator"], "jumps": ["P1160", "P1110"]}, {"id": "P1140", "text": ["Common collector and common base amplifiers produce input and output signals that are in phase.", "Common Base or Collector Amprrrrrrrrrrrrrrrr"], "jumps": ["P1150", "P1110"]}, {"id": "P1130", "text": ["The feedback circuit ensures that the input phase to the amplifier is correct. This is called regenerative or positive feedback.", "Feedback Circuit ator"], "jumps": ["P1140", "P1110"]}, {"id": "P1120", "text": ["The two signals would cancel out each other if the output connects directly to the input. This is called degenerative or negative feedback.", "The two signals would cancel out each other if the output connects directly to the input. This is called degenerative or negative feedback...."], "jumps": ["P1130", "P1110"]}, {"id": "P1110", "text": ["A common emitter amplifier produces input and output signals that are 180\u00ba out of phase.", "A common emitter amplifier produces input and output signals that are 180", "Common Emitter Amplifierr ator"], "jumps": ["P1120", "P1060"]}, {"id": "P1100", "text": ["The correct phase of the input signal is very important to maintain the output frequency."], "jumps": ["P1110", "P1060"]}, {"id": "P1090", "text": ["The feedback circuit also ensures that the applied input signal is in the correct phase to produce the output signal.", "Feedback Circuit ator"], "jumps": ["P1100", "P1060"]}, {"id": "P1080", "text": ["A feedback circuit is added to determine the frequency of the oscillator.", "Amplifier Circuit ator", "Feedback Circuit ator"], "jumps": ["P1090", "P1060"]}, {"id": "P1070", "text": ["In other words, an oscillator is an amplifier that has been modified to supply its own input.", "Amplifier Circuit ator"], "jumps": ["P1080", "P1060"]}, {"id": "P1060", "text": ["Sine wave oscillators are transistor amplifiers that use their output signal as their input signal.", "Amplifier Circuit ator"], "jumps": ["P1070", "P1020"]}, {"id": "P1050", "text": ["Using variable components allow a variable output frequency."], "jumps": ["P1060", "P1020"]}, {"id": "P1040", "text": ["Oscillator frequencies range from a few hertz to tens of giga hertz."], "jumps": ["P1050", "P1020"]}, {"id": "P1030", "text": ["The value of the components in the oscillator circuit determine the output frequency."], "jumps": ["P1040", "P1020"]}, {"id": "P1020", "text": ["Sine wave oscillators are devices that convert DC energy into sinusoidal AC energy."], "jumps": ["P1030", "P1001"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P460", "text": ["Let's begin the lesson on INTRODUCTION TO SINE WAVE OSCILLATORS............."], "jumps": ["P400"]}, {"id": "P450", "text": ["The sine wave oscillator contains two familiar circuits."], "jumps": ["P460", "P400"]}, {"id": "P440", "text": ["Oscillators that produce sinusoidal waveforms are called Sine Wave Oscillators."], "jumps": ["P450", "P400"]}, {"id": "P430", "text": ["In this lesson, you will learn about sine wave oscillators."], "jumps": ["P440", "P400"]}, {"id": "P420", "text": ["Radios, televisions, communication systems and radars all use oscillators of one type or another."], "jumps": ["P430", "P400"]}, {"id": "P410", "text": ["For example, function generators use oscillators to produce many types of output signals at various frequencies."], "jumps": ["P420", "P400"]}, {"id": "P40
