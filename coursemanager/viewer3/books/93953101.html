lectrons from the N-typematerial creates positive ions near the PN junction in the N-type material.", "O O - - O O - - O O - - O O - - O O - - O O - - O O - -"], "jumps": ["P2230", "P2216"]}, {"id": "P2225", "text": ["POSITIVE IONS - A positive ion is an atom that has more protons (+) than electrons (-)."], "jumps": []}, {"id": "P2220", "text": ["The loss of electrons from the N-type material creates positive ions near the PN junction in the N-type material."], "jumps": ["P2230", "P2216"]}, {"id": "P2216", "text": ["Free electrons move to the holes in the P material creating negative ions near the PN junction in the P-type material.", "O O - - O O - - O O - - O O - - O O - - O O - - O O - -"], "jumps": ["P2220", "P2190"]}, {"id": "P2215", "text": ["NEGATIVE IONS - A negative ion is an atom that has more electrons (-) than protons (+)."], "jumps": []}, {"id": "P2210", "text": ["Free electrons move to the holes in the P material creating negative ions near the PN junction in the P-type material."], "jumps": ["P2220", "P2190"]}, {"id": "P2200", "text": ["O O - - O O - - O O - - O O - - O O - - O O - - O O - -", "The free electrons and holes combine in the center of the doped semiconductor. This process is called \"recombination\". The center of the semiconductor is called the PN junction.."], "jumps": ["P2210", "P2190"]}, {"id": "P2190", "text": ["O O - - O O - - O O - - O O - - O O - - O O - - O O - -", "Remember, the free electrons move and the holes appear to move. The atoms do not move; they are held in place by the crystalline structure."], "jumps": ["P2200", "P2180"]}, {"id": "P2183", "text": ["A hole is made by the absence of an electron.  When electrons move, holes also move.", "A hole is made by the absence of an electron. When electrons move, holes also move."], "jumps": []}, {"id": "P2182", "text": ["Hole movement is produced by electrons leaving one atom to fill a hole in another atom.   Hole movement is not the same direction as electron movement.", "Hole movement is produced by electrons leaving one atom to fill a hole in another atom. Hole movement is not the same direction as electron movement."], "jumps": []}, {"id": "P2181", "text": [], "jumps": []}, {"id": "P2180", "text": ["In which direction do holes appear to move?", "In which direction do holes appear to move?................"], "jumps": ["P2170"]}, {"id": "P2173", "text": ["The material does not have a charge because the number of electrons equals the number of protons."], "jumps": []}, {"id": "P2172", "text": ["A hole is the absence of an electron which makes the material\nP-Type.", "A hole is the absence of an electron which makes the material P-Type.."], "jumps": []}, {"id": "P2171", "text": [], "jumps": []}, {"id": "P2170", "text": ["N Type material has _______", "N Type material has _______ typed.........................."], "jumps": ["P2160"]}, {"id": "P2163", "text": ["N Type material has free electrons.  Semiconductor material is doped with impurities that have 5 electrons in the outer most orbit.", "N Type material has free electrons. Semiconductor material is doped with impurities that have 5 electrons in the outer most orbit."], "jumps": []}, {"id": "P2162", "text": ["Semiconductor material does not have holes or free electrons.\nN and P type material is obtained by doping semiconductor material.", "Semiconductor material does not have holes or free electrons. N and P type material is obtained by doping semiconductor material..."], "jumps": []}, {"id": "P2161", "text": [], "jumps": []}, {"id": "P2160", "text": ["What type of material has holes?", "What type of material has holes?d.........................."], "jumps": ["P2147"]}, {"id": "P2157", "text": ["The semiconductor is still electrically neutral because the number of protons and electrons are equal."], "jumps": ["P2160", "P2147"]}, {"id": "P2150", "text": ["This end of the semiconductor is P-type material, or the anode."], "jumps": ["P2157", "P2147"]}, {"id": "P2147", "text": ["Holes appear to move as the electrons move from one hole to another.  This apparent movement of holes is called \"hole flow\" and is in the opposite direction of electron flow.", "Holes appear to move as the electrons move from one hole to another. This apparent movement of holes is called \"hole flow\" and is in the opposite direction of electron flow."], "jumps": ["P2150", "P2070", "P2145"]}, {"id": "P2145", "text": ["ELECTRON MOVEMENT - The hole is filled by an electron. The electron that filled the hole leaves a hole in its old position."], "jumps": ["P2147"]}, {"id": "P2140", "text": ["Holes appear to move as the electrons move from one hole to another.  This apparent movement of holes is called \"hole flow\" and is in the opposite direction of electron flow.", "Holes appear to move as the electrons move from one hole to another. This apparent movement of holes is called \"hole flow\" and is in the opposite direction of electron flow."], "jumps": ["P2150", "P2070", "P2145"]}, {"id": "P2130", "text": ["The missing electron forms a HOLE or positive charge that moves inversely to the electron, negative charge flow.", "The missing electron forms a HOLE that can accept an electron. The movement of electrons from hole to hole produces current flow.", "The missing electron forms a HOLE or positive charge that moves inversely to the electron, negative charge flow. current flow."], "jumps": ["P2140", "P2070"]}, {"id": "P2120", "text": ["The other half of the semiconductor is doped with atoms that have three electrons in the outer most orbit.", "Impurities with 3 electrons Aluminum Indium Gallium Boronssssssssssssssssssssssss"], "jumps": ["P2130", "P2070"]}, {"id": "P2117", "text": ["The semiconductor is still electrically neutral because the number of protons and electrons are equal."], "jumps": ["P2120", "P2070"]}, {"id": "P2110", "text": ["This end of the semiconductor is called N-type material, or the cathode."], "jumps": ["P2117", "P2070"]}, {"id": "P2100", "text": ["The fifth electron becomes a free moving negative charge. This negative charge is FREE to move in any direction.", "The fifth electron is free to move in any direction. It is a FREE electron that can conduct current.", "electron becomes a free moving negative charge. This"], "jumps": ["P2110", "P2070"]}, {"id": "P2090", "text": ["Half of the semiconductor is doped with atoms that have five electrons in the outer most orbit.", "Impurities with 5 electrons Arsenic Antimony Bismuth Phosphorousssssssssssssssssssssssssssss"], "jumps": ["P2100", "P2070"]}, {"id": "P2081", "text": [], "jumps": ["P2090", "P2070"]}, {"id": "P2080", "text": ["Adding different impurities to each half of a piece of semiconductor material produces a diode."], "jumps": ["P2070"]}, {"id": "P2070", "text": ["Adding impurities, called doping, increases the conduction of semiconductors."], "jumps": ["P2080", "P2040"]}, {"id": "P2060", "text": ["The electrons are tightly held by this bonding.  Placing a voltage across the material produces only a small current.", "The electrons are tightly held by this bonding. Placing a voltage across the material produces only a small current."], "jumps": ["P2070", "P2040"]}, {"id": "P2050", "text": ["Because atoms like eight electrons in an orbit, individual atoms share electrons to form crystals."], "jumps": ["P2060", "P2040"]}, {"id": "P2040", "text": ["Pure semiconductor atoms have four electrons in their outer most orbit."], "jumps": ["P2050", "P2020"]}, {"id": "P2030", "text": ["To see the effect that impurities have on semiconductors, let's first look at pure semiconductors."], "jumps": ["P2040", "P2020"]}, {"id": "P2025", "text": ["IMPURITIES - Impurities are materials different from the semiconductor material. For example, a glass of pure water contains only hydrogen and oxygen atoms. Adding salt to the water makes it impure and the taste of the water changes. Adding impurities to a semiconductor changes the electrical characteristics."], "jumps": []}, {"id": "P202   i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
</body>
