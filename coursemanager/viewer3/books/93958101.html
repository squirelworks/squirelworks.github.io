8<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Provide a brief history of microwave inception and explain how microwave communications were initiated. w Identify basic microwave principles and recognize the Radio Frequency spectrum. w Identify microwave frequencies and factors affecting communications.s..ommunications................................", "w Identify metric prefixes. w Perform conversions between different metric prefixes..."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In this course, you will learn about the circuits, hardware and properties of microwave systems."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Microwave is the term used to describe signals in the 1 GHz to\n40 GHz range (1,000,000,000 - 40,000,000,000 Hz).", "Microwave is the term used to describe signals in the 1 GHz to 40 GHz range (1,000,000,000 - 40,000,000,000 Hz)."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Recall that MICRO is a metric prefix meaning millionth or a very small quantity."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["Microwave signals have small or short wavelengths.  Shorter wavelengths have higher frequencies.", "Microwave signals have small or short wavelengths. Shorter wavelengths have higher frequencies."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["Let's begin the lesson on INTRODUCTION TO MICROWAVES......................"], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Microwave techniques are as old as the early days of radio."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Although microwave has been around for a long time, there was little use for high frequency microwave signals."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Signals in the frequency range of 950 to 1600 kHz (AM radio band) was all that were needed for communications."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Radio transmission progressed into the microwave region early during World War II."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["Using these high frequency microwave signals, a system called RADAR, Radio Detection and Ranging, was developed.  A use for microwave was found.", "RADAR allowed detection of enemy airplanes and ships and accurately determined their position.", "As with many other wartime inventions, microwave techniques found their way into civilian applications such as air traffic control systems.", "Using these high frequency microwave signals, a system called RADAR, Radio Detection and Ranging, was developed. A use for microwave was found."], "jumps": ["P1070", "P1050", "P1080", "P1090"]}, {"id": "P1090", "text": ["Today, microwave is not only used in RADAR systems, but is replacing telephone and telegraph wires and poles."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["Microwave technology expanded into communications."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["In fact, microwave is used more and more each day.  As the need for communications increase, the need for higher frequencies also increase.", "In fact, microwave is used more and more each day. As the need for communications increase, the need for higher frequencies also increase."], "jumps": ["P1120", "P1090"]}, {"id": "P1120", "text": ["You can see by the frequency spectrum below how many frequency ranges are already being used.  This shows the demand for more channels.", "You can see by the frequency spectrum below how many frequency ranges are already being used. This shows the demand for more channels."], "jumps": ["P1130", "P1090"]}, {"id": "P1130", "text": ["The frequency spectrum starts at zero hertz and increases to some value far beyond our hearing or sight capabilities."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["The audio band, frequencies that you can hear, starts at 20 Hz and extends to approximately 20 kHz."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["Most telephone communications occur in the audio band."], "jumps": ["P1160", "P1120"]}, {"id": "P1160", "text": ["With the invention of radio, additional frequencies were needed. The band of frequencies between 950 kHz and 1600 kHz was designated the AM Radio band."], "jumps": ["P1170", "P1120"]}, {"id": "P1170", "text": ["As the demand for frequencies increased, a new band was added to the spectrum.  Short Wave radio was designated from 1600 kHz to 20 MHz.", "As the demand for frequencies increased, a new band was added to the spectrum. Short Wave radio was designated from 1600 kHz to 20 MHz."], "jumps": ["P1180", "P1120"]}, {"id": "P1180", "text": ["When television and FM radio were introduced, additional frequencies in the radio spectrum had to be added.  This band is called VHF or Very High Frequency.", "When television and FM radio were introduced, additional frequencies in the radio spectrum had to be added. This band is called VHF or Very High Frequency."], "jumps": ["P1190", "P1120"]}, {"id": "P1190", "text": ["When the VHF band was allocated, nobody believed that there would be a need for more than 13 channels!  This was not the case and the UHF (Ultra High Frequency) band was added.", "When the VHF band was allocated, nobody believed that there would be a need for more than 13 channels! This was not the case and the UHF (Ultra High Frequency) band was added."], "jumps": ["P1200", "P1120"]}, {"id": "P1200", "text": ["With a greater demand for radio frequencies, the microwave band was added to the frequency spectrum."], "jumps": ["P1210", "P1120"]}, {"id": "P1210", "text": ["The microwave band ranges between 1 and 40 GHz."], "jumps": ["P1220", "P1120"]}, {"id": "P1220", "text": ["Looking at the entire frequency spectrum, you can see that there are many bands, with each one including its own large range of frequencies.", "Looking at the entire frequency spectrum, you can see that there are many bands, with each one including its own large range of frequencies.in each band."], "jumps": ["P1230", "P1120"]}, {"id": "P1230", "text": ["To prevent overlapping of transmitted signals, there are certain frequencies in each band that are not used."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["For example, in the AM band, each station is assigned a frequency range in which to operate, called a channel.", "950 970 980 99000", "1000 1100 1300 1400 160000"], "jumps": ["P1250", "P1220"]}, {"id": "P1250", "text": ["On each side of the assigned channel is an area called a guard band.  No transmission is allowed in this area.", "On each side of the assigned channel is an area called a guard band. No transmission is allowed in this area."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["The guard bands keep one AM station from interfering with another AM station."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["The microwave band operates in the same way.  Channels and guard bands are assigned to prevent interference.", "The microwave band operates in the same way. Channels and guard bands are assigned to prevent interference.", "1 4 5.6 10.4 10.6"], "jumps": ["P1280", "P1240"]}, {"id": "P1280", "text": ["The microwave system used in this course operates at a frequency of 10.5 GHz.  Notice that it is the middle of a channel with guard bands on each side.", "The microwave system used in this course operates at a frequency of 10.5 GHz. Notice that it is the middle of a channel with guard bands on each side."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["Using the Frequency Spectrum below, what is the lower and upper frequency limit of the Short Wave band?", "P1270 $TestNo: 1", "20 Hz to 20 kHz $Incorrect2: 950 to 1600 kHz"], "jumps": ["P1270"]}, {"id": "P1291", "text": [], "jumps": []}, {"id": "P1292", "text": ["20 Hz to 20 kHz is the range used by the audio band.  Find the frequencies on the spectrum that define the short wave band.", "20 Hz to 20 kHz is the range used by the audio band. Find the frequencies on the spectrum that define the short wave band........................"], "jumps": []}, {"id": "P1293", "text": ["950 to 1600 kHz is the range used by the AM radio band.  Find the frequencies on the spectrum that define the short wave band.", "950 to 1600 kHz is the range used by the AM radio band. Find the frequencies on the spectrum that define the short wave band. wave band."], "jumps": []}, {"id": "P1300", "text": ["What is the frequency range of the microwave band, as shown on the frequency spectrum below?", "What is the frequency range of the microwave band, as shown on the frequency spectrum below?ave band?"], "jumps": ["P1290"]}, {"id": "P1301", "text": [], "jumps": []}, {"id": "P1302", "text": ["1600 kHz to 20 MHz is the range used by the short wave band.  Find the radio frequencies on the spectrum that define the microwave band.", "1600 kHz to 20 MHz is the range used by the short wave band. Find the radio frequencies on the spectrum that define the microwave band.owave band."], "jumps": []}, {"id": "P1303", "text": ["950 to 1600 kHz is the range used by the AM Radio band.  Find the frequencies spectrum that define in the microwave band.", "950 to 1600 kHz is the range used by the AM Radio band. Find the frequencies spectrum that define in the microwave band...................."], "jumps": []}, {"id": "P1310", "text": ["To this point we have talked primarily about the carrier frequencies.  Carrier frequencies convey no information.", "To this point we have talked primarily about the carrier frequencies. Carrier frequencies convey no information."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["Amplitude Modulation (AM) and Frequency Modulation (FM) are two common modulation techniques.", "Amplitude Modulation (AM) and Frequency Modulation (FM) are two common modulation techniques. modulated for example."], "jumps": ["P1325", "P1310"]}, {"id": "P1325", "text": ["Once the carrier has been modulated, the microwave signal contains information."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["Information, like everthing else in this world, requires a certain amount of space.", "Information, like everthing else in this world, requires a certain amount of space. space."], "jumps": ["P1340", "P1310"]}, {"id": "P1340", "text": ["The space available for information, or modulation, must not interfere with the guard bands.  Information is limited to a certain bandwidth.", "The space available for information, or modulation, must not interfere with the guard bands. Information is limited to a certain bandwidth."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["For example, if a channel is assigned a bandwidth of 12 MHz, the modulation is contained within 6 MHz of the carrier frequency."], "jumps": ["P1360", "P1330"]}, {"id": "P1360", "text": ["If the carrier frequency is 10.494 GHz, the lower limit of the bandwidth is 10.404 GHz and the upper limit of the bandwidth is   10.506 GHz.", "If the carrier frequency is 10.494 GHz, the lower limit of the bandwidth is 10.404 GHz and the upper limit of the bandwidth is 10.506 GHz."], "jumps": ["P1370", "P1330"]}, {"id": "P1370", "text": ["To use another example, when the maximum modulation of the information is 10 MHz, the bandwidth must be 20 MHz (2 times the maximum modulation)."], "jumps": ["P1380", "P1330"]}, {"id": "P1380", "text": ["If the bandwidth is 8 MHz, what is the largest modulation signal allowed?"], "jumps": ["P1330"]}, {"id": "P1381", "text": [], "jumps": []}, {"id": "P1382", "text": ["8 MHz is the bandwidth.  Remember, the maximum modulation signal is equal to 1/2 of the bandwidth.", "8 MHz is the bandwidth. Remember, the maximum modulation signal is equal to 1/2 of the bandwidth."], "jumps": []}, {"id": "P1383", "text": ["16 MHz is twice the bandwidth.  Remember, the maximum modulation signal is equal to 1/2 of the bandwidth.", "16 MHz is twice the bandwidth. Remember, the maximum modulation signal is equal to 1/2 of the bandwidth."], "jumps": []}, {"id": "P1390", "text": ["Will a 2.5 MHz modulation signal fit within a 4 MHz bandwidth?"], "jumps": ["P1380"]}, {"id": "P1391", "text": [], "jumps": []}, {"id": "P1392", "text": ["A 2.5 MHz modulation signal requires 5.0 MHz bandwidth.  It will not fit within a 4 MHz bandwidth.", "A 2.5 MHz modulation signal requires 5.0 MHz bandwidth. It will not fit within a 4 MHz bandwidth."], "jumps": []}, {"id": "P1400", "text": ["Will a 7.5 MHz modulation signal fit within a 16 MHz bandwidth?"], "jumps": ["P1390"]}, {"id": "P1401", "text": [], "jumps": []}, {"id": "P1402", "text": ["A 7.5 MHz modulation signal requires a 15 MHz bandwidth.  It will fit within a bandwidth of 16 MHz.", "A 7.5 MHz modulation signal requires a 15 MHz bandwidth. It will fit within a bandwidth of 16 MHz."], "jumps": []}, {"id": "P1410", "text": ["The radio frequencies when transmitted are often referred to as electromagnetic waves."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["These electromagnetic waves travel from one point to another differently depending on their frequency."], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["The three ways the electromagnetic waves travel are:", "The three ways the electromagnetic waves travel are: ound Waves Sky Waves Direct Waves", "Ground Waves Sky Waves Direct Wavesssssss"], "jumps": ["P1440", "P1410"]}, {"id": "P1440", "text": ["Let's discuss ground waves first.", "Ground Waves Sky Waves Direct Wavesssssss"], "jumps": ["P1450", "P1410"]}, {"id": "P1450", "text": ["Ground waves are signals that have long wavelengths and tend to follow the curvature of the earth."], "jumps": ["P1460", "P1410"]}, {"id": "P1460", "text": ["Frequencies below 1600 kHz are transmitted from the antenna as ground waves."], "jumps": ["P1470", "P1450"]}, {"id": "P1470", "text": ["The range of ground waves is several hundred miles and is limited by the type of terrain and any obstructions such as mountains or buildings."], "jumps": ["P1480", "P1450"]}, {"id": "P1480", "text": ["At higher frequencies, sky waves are used instead of ground waves.", "At higher frequencies, sky waves are used instead of ground waves..", "Ground Waves Sky Waves Direct Wavesssssss"], "jumps": ["P1490", "P1450"]}, {"id": "P1490", "text": ["Sky waves occur mainly in frequencies from 1600 kHz to 30 MHz. The transmitted RF is radiated toward the sky at an angle."], "jumps": ["P1500", "P1480"]}, {"id": "P1500", "text": ["The RF energy is reflected back to the earth's surface by the ionosphere layer of the atmosphere.  However, some signals are not reflected back.", "The RF energy is reflected back to the earth's surface by the ionosphere layer of the atmosphere. However, some signals are not reflected back."], "jumps": ["P1502", "P1490"]}, {"id": "P1502", "text": ["Sky waves are short wave communications signals that are able to travel long distances.", "Sky waves are short wave communications signals that are able to travel long distances.."], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["At even higher frequencies, the RF energy starts to behave as light.", "Ground Waves Sky Waves Direct Wavesssssss"], "jumps": ["P1520", "P1490"]}, {"id": "P1520", "text": ["Direct waves occur in the UHF and microwave region, 30 MHz to 100 GHz.  The RF energy travels in a straight line or line of sight.", "Direct waves occur in the UHF and microwave region, 30 MHz to 100 GHz. The RF energy travels in a straight line or line of sight."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["The distance that direct waves travel is limited by the curvature of the earth.  For long distance transmission, repeater stations      are used.", "The distance that direct waves travel is limited by the curvature of the earth. For long distance transmission, repeater stations are used."], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["The ground, sky and direct waves transmit overlapping frequencies.  The table below indicates where each type of wave has the greatest effect.", "The ground, sky and direct waves transmit overlapping frequencies. The table below indicates where each type of wave has the greatest effect."], "jumps": ["P1560", "P1520"]}, {"id": "P1560", "text": ["Microwave has advantages and disadvantages over the other frequency bands."], "jumps": ["P1570", "P1540"]}, {"id": "P1570", "text": ["The main advantages of microwave is the small component size and the high directivity of the signal."], "jumps": ["P1580", "P1560"]}, {"id": "P1580", "text": ["Small component size is due to the wavelength of microwave."], "jumps": ["P1590", "P1560"]}, {"id": "P1590", "text": ["To operate efficiently, many microwave component dimensions are manufactured at either 1, 1/2 or 1/4 wavelength.  This allows for very small component dimensions.", "To operate efficiently, many microwave component dimensions are manufactured at either 1, 1/2 or 1/4 wavelength. This allows for very small component dimensions."], "jumps": ["P1600", "P1580"]}, {"id": "P1600", "text": ["High directivity, due to most microwave being direct waves, allows all the transmitted power to be directed in one direction."], "jumps": ["P1610", "P1580"]}, {"id": "P1610", "text": ["This prevents loss due to the RF energy being scattered in all directions."], "jumps": ["P1620", "P1600"]}, {"id": "P1620", "text": ["Main disadvantages of the microwave are high component cost, short range and the attenuating effect of weather."], "jumps": ["P1630", "P1600"]}, {"id": "P1630", "text": ["High component cost is due to the manufacturing process, which is more difficult because of the small size of components required."], "jumps": ["P1640", "P1620"]}, {"id": "P1640", "text": ["The short range is due to the direct waves.  Long distance transmission requires repeater stations.", "The short range is due to the direct waves. Long distance transmission requires repeater stations."], "jumps": ["P1650", "P1630"]}, {"id": "P1650", "text": ["The attenuating effect of weather is due to microwave behaving as light.", "For example, on a clear night an automobile's headlights can illuminate long distances.", "On a foggy night, the headlight's illumination decreases.  Light is attenuated by the fog.", "On a foggy night, the headlight's illumination decreases. Light is attenuated by the fog.."], "jumps": ["P1660", "P1640", "P1650", "P1670", "P1680"]}, {"id": "P1680", "text": ["Even with the disadvantages of microwave frequencies, microwave is used more and more as the need for radar and communications systems increases."], "jumps": ["P1910", "P1660"]}, {"id": "P1910", "text": ["This completes the information on MICROWAVES.", "This completes the information on MICROWAVES. TITLE........"], "jumps": ["P1001", "P1680"]}, {"id": "P1920", "text": ["1.  Microwave frequencies range between 1 and 40 GHz.", "2.  Microwave was first used during WWII in RADARs.  After the          war, microwave found many uses in the peacetime world.", "1. Microwave frequencies range between 1 and 40 GHz.re....", "2. Microwave was first used during WWII in RADARs. After the war, microwave found many uses in the peacetime world."], "jumps": ["P1930", "P1001", "P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The frequency spectrum is divided into many bands.  As the          need for frequencies increased, new bands were designated.", "3. The frequency spectrum is divided into many bands. As the need for frequencies increased, new bands were designated."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  Within each band, there are channels and guard bands to                prevent interference between transmitted signals.", "4. Within each band, there are channels and guard bands to prevent interference between transmitted signals.", "1 4 5.6 10.4 10.6"], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  The bandwidth allows modulation of the carrier signal.                      Bandwidth is twice the maximum modulation signal.", "5. The bandwidth allows modulation of the carrier signal. Bandwidth is twice the maximum modulation signal."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  The three types of electromagnetic waves are:", "6. The three types of electromagnetic waves are: OUND WAVE 20 kHz to 1600 kHz SKY WAVE 1600 kHz to 30 MHz DIRECT WAVE 30 MHz to 100 GHz"], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7.  The advantages of microwave are small component size and          high directivity.", "7. The advantages of microwave are small component size and high directivity."], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["8.  The disadvantages of microwave is high component cost,               short range and the attenuating effect of weather.", "8. The disadvantages of microwave is high component cost, short range and the attenuating effect of weather."], "jumps": ["P1999", "P1980"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["There must be a unit of measure and a value in all electronic measurements.  For example:", "There must be a unit of measure and a value in all electronic measurements. For example: Units of Measure Values Frequency..................Hertz Resistance.................Ohms Current....................Amperes Voltage....................Volts", "Units of Measure Values Frequency.......................Hertz Resistance.....................Ohms Current............................Amperes Voltage............................Volts"], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["Some of these values are very large or very small.  Metric prefixes are used so that a lot of zeroes are not n let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
