pulsion and landing gear systems.", "Select an occupation for further information."], "jumps": ["P2001", "P2030"]}, {"id": "P3910", "text": ["This completes the information on CAREERS.E 3 TITLE........"], "jumps": ["P3060"]}, {"id": "P10", "text": [], "jumps": []}, {"id": "P2181", "text": [], "jumps": []}, {"id": "P3080", "text": ["TECHNICIAN Duties - Use test equipment to adjust, repair, maintain and remove and replace aircraft avionics and electrical components. Environment - Technicians work on aircraft & components in hangars and on the flight line. Some military aircraft require flight technicians to repair equipment during flight. Requirements - Must be able to bend, crawl and stoop. Must be able to read and understand various technical and service manuals. Must be able to use diagnostic equipment to isolate, repair and maintain avionics equipment."], "jumps": []}, {"id": "P3100", "text": ["AIR TRAFFIC CONTROLLER Duties - Monitor, advise and direct aircraft pilots on the ground & in the air to ensure adequate aircraft separation to prevent collision and crashes. Environment - Controllers work in air traffic control towers and air route traffic control centers throughout the world. Requirements - Must meet physical requirements. Must complete a FAA approved training program and receive on-the-job training from licensed instructors. Must perform under pressure in high stress environment."], "jumps": []}, {"id": "P3110", "text": ["FLIGHT ATTENDANT Duties - Monitor airline equipment, execute emergency procedures, safety procedures, administer first aid, direct passengers, & provide in flight service to passengers. Environment - Work in airports and in small to large aircraft all over the world. Scheduling and international routes require extensive travel for days or weeks at a time. Requirements - Must meet physical requirements. Must complete industry airline specific training program."], "jumps": []}, {"id": "P3120", "text": ["POWERPLANT MECHANIC Duties - Adjust, repair, service, overhaul, & test aircraft, airframes, engines, propellers, aircraft systems, electronic equipment and aircraft instruments. Environment - Mechanics work on aircraft and systems in hangars and on the flight line. Some military aircraft require flight mechanics to repair and adjust equipment during flight. Requirements - Must be able to bend, crawl and stoop. Must be able to read and understand various technical and service manuals. Must be able to use diagnostic equipment to isolate, repair and maintain avionics equipment."], "jumps": []}, {"id": "P3130", "text": ["AVIONICS TECHNICIAN Duties - Use test equipment to adjust, repair, maintain, and remove and replace aircraft avionics and electrical components. Environment - Technicians work on aircraft and components in hangars and on the flight line. Some military aircraft require flight technicians to repair equipment during flight. Requirements - Must be able to bend, crawl and stoop. Must be able to read and understand various technical and service manuals. Must be able to use diagnostic equipment to isolate, repair and maintain avionics equipment."], "jumps": []}, {"id": "P3140", "text": ["FLIGHT INSTRUCTOR Duties - Determines aircraft airworthiness, prepares aircraft for flight, monitors the student's safe and efficient operation of the aircraft. Environment - Instructors fly small to large aircraft from grass fields to complex multiple runway airports. Requirements - Must read, speak and understand English. Must pass medical physical for type rating. Must complete ground instruction, log sufficient flight hours instruction and pass the FAA written and practical exams."], "jumps": []}, {"id": "P3150", "text": ["TEST PILOT Duties - Determines aircraft airworthiness, prepares aircraft for flight, manages crew and ensures safe and efficient operation of the aircraft. Environment - Test pilots fly experimental and FAA uncertified aircraft to evaluate their airworthiness and flight characteristics. R lot maintains situational awareness by developing a scan pattern which includes periodic glances at the instrument panel.", "Today's aircraft normally use a retractable landing gear to reduce drag and enable faster ground speeds. Most aircraft are limited to speeds below 160 knots with the gear in the down position."], "jumps": ["P2960", "P2940", "P2999", "P2220"]}, {"id": "P2330", "text": ["The navigational system instruments provide aircraft orientation and position information from self-contained and external dependent navigational aids.", "3. The navigational systems enable the pilot to fly along the highways in the sky or air routes. Like the road map, air route charts provide the pilot with airborne highways that connect cities and airports."], "jumps": ["P2320", "P2340"]}, {"id": "P2950", "text": ["4. The internal combustion engine is primarily used in small and medium size, slow, short range aircraft for pleasure flying as well as transportation. The gas turbine engine can be found in helicopters, small, medium and large civil and military aircraft.", "####\"########\"########\"##\"#########\"\"#############\"\"#############\"######################\"####\"##\"#########################\"#\"#####\"#####\"#######\"##\"#########\"############\"#\"##############\"######\"########\"####\"##\"\"#####\"##############\"##\"########### \"#", "!!!!!! ! !! !!!!! !!!!!! !!!! !! !!!! !! ! !!!! !!! ! !!! !! !! !!!!! !!! !!! ! ! !! !!!!!!! ! !!!!!!! !!!!!!! !!!!!!!!! !!!!!!! !!!!!!!!!!!!!!!!!!!!! ! !! ! !! !", "! ! !! !! !! !! !! ! !! !! ! ! ! !! !! ! !! !! !! ! ! !! ! ! ! ! ! !!! !!!! ! !!! !! ! !!! !!"], "jumps": ["P2960", "P2940"]}, {"id": "P2910", "text": ["This completes the information on OPERATIONAL SYSTEMS......"], "jumps": ["P2350"]}, {"id": "P2070", "text": ["Fuel Ignition Supporting Propulsion Instruments Navigational Flight Controls", "An aircraft is easily understood when divided into seven major operational systems."], "jumps": ["P2060", "P2080"]}, {"id": "P0" ent and remove the accumulation of ice caused by flying through precipitation at or above the freezing level."], "jumps": ["P2260", "P2240"]}, {"id": "P2350", "text": ["Fuel Ignition Supporting Propulsion Instruments Navigational Flight Controls", "As you can see, all seven operating systems are vital for aircraft operation."], "jumps": ["P2340", "P2910"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3040", "text": ["Select an occupation for further information.", "Each career field needs motivated and well educated people to maintain the high standards of safety and service. ve, mechanical, technological, scientific and verbal aptitudes. g"], "jumps": ["P3030"]}, {"id": "P2260", "text": ["The accumulation of ice increases aircraft weight and drag, and decreases the wings ability to provide lift. Engine and propeller icing can decrease propulsion or freeze the fuel and controls causing the engine to shutdown."], "jumps": ["P2250", "P2270"]}, {"id": "P2270", "text": ["The anti-ice systems are designed to prevent the accumulation of ice by heating the leading edges of the wings and propellers."], "jumps": ["P2280", "P2260"]}, {"id": "P1070", "text": ["Tremendous advances in aviation were accomplished during World War II. In 1943, Germany developed a jet fighter which could reach speeds of 500 MPH in level flight.", "The accumulation of ice increases aircraft weight and drag, and decreases the wings ability to provide lift. Engine and propeller icing can decrease propulsion or freeze the fuel and controls causing the engine to shutdown."], "jumps": ["P1060", "P1080"]}, {"id": "P2340", "text": ["The propulsion system instruments provide vital engine parameter information to enable the pilot to maintain proper temperatures, pressures and tachometer speeds."], "jumps": ["P2330", "P2350"]}, {"id": "P2180", "text": ["What type of fuel does an internal combustion engine driven airplane use?", "\"You have successfully passed the assessment", "Are you sure you want to Bookmark the Lesson?", "Are you sure you want to Exit the Lesson?", "You skipped X question(s). Do you want to _________", "The test is complete and your score is XX%. Do you want to _________", "You have successfully passed the assessment test!"], "jumps": ["P2160"]}, {"id": "P1050", "text": ["The United States showed little enthusiasm for airplanes until World War I. In 1917, Germany, England and France combined, had thousands of airplanes while the U.S. had only produced 142 obsolete aircraft.."], "jumps": ["P1060", "P1040"]}, {"id": "P1080", "text": ["Today, the supersonic Concorde flies from New York to Paris in only four hours; twenty-nine hours less than Lindbergh's Spirit of St. Louis.", "Charles Lindbergh's, successful flight across the Atlantic in the Spirit of St. Louis, encouraged the development of transoceanic air transportation for the public."], "jumps": ["P1090", "P1070"]}, {"id": "P3040", "text": ["Select an occupation for further information.", "Each career field needs motivated and well educated people to maintain the high standards of safety and service. ve, mechanical, technological, scientific and verbal aptitudes. g"], "jumps": ["P3030"]}, {"id": "P3060", "text": ["Select an occupation for further information.", "Did you think of these? here...............................", "The anti-skid braking system prevents the gear assembly from locking during aircraft taxi and landing. The brakes are designed to rapidly apply and release pressure when they sense a locked condition."], "jumps": ["P3050"]}, {"id": "P1060", "text": ["Charles Lindbergh's, successful flight across the Atlantic in the Spirit of St. Louis, encouraged the development of transoceanic air transportation for the public."], "jumps": ["P1070", "P1050"]}, {"id": "P2930", "text": ["2. The flight control systems enable the pilot to manually or automatically control the movable surfaces that maneuver the airplane in the pitch, roll and yaw axes."], "jumps": ["P2920", "P2940"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.", "The de-ice systems are designed to remove icing by pneumatically expanding bladders in the leading edge on the wings. The ice cracks and is removed by the air flow over the wings."], "jumps": ["P2970"]}, {"id": "P2160", "text": ["Navigational systems are divided into short range and long range. Short range systems include the; very high frequency omni-directional ranging (VOR), distance measuring equipment (DME), automatic direction finder (ADF) and instrument landing system (ILS)."], "jumps": ["P2150", "P2170"]}, {"id": "P2200", "text": ["The propulsion system, is normally either an internal combustion or gas turbine engine. Internal combustion engines use propellers for propulsion, while gas turbine engines can use propellers or turbo-fans."], "jumps": ["P2210", "P2190"]}, {"id": "P1910", "text": ["This completes the information on HISTORY.E 1 TITLE........"], "jumps": ["P1080"]}, {"id": "P2210", "text": ["The internal combustion engine is primarily used in small to medium aircraft traveling at slow speeds for short distances. The gas turbine engine can be found in helicopters, small, medium and large civilian and military aircraft."], "jumps": ["P2220", "P2200"]}, {"id": "P2240", "text": ["The anti-skid braking system prevents the gear assembly from locking during aircraft taxi and landing. The brakes are designed to rapidly apply and release pressure when they sense a locked condition."], "jumps": ["P2230", "P2250"]}, {"id": "P2192", "text": ["ADF, VOR and DME are considered short range systems........"], "jumps": []}, {"id": "P2300", "text": ["Instruments are designed and positioned to provide the pilot with an \"at-a-glance\" indication of the status and position of the aircraft. The pilot maintains situational awareness by developing a scan pattern which includes periodic glances at the instrument panel."], "jumps": ["P2290", "P2310"]}, {"id": "P3060", "text": let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
