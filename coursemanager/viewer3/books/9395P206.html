P10218", "text": ["When retrieving a file found by an Archie tool, if the tool doesn't get the file for you, you need to use _______"], "jumps": []}, {"id": "P10217", "text": ["Like many Internet applications, Archie uses both a client and _______"], "jumps": []}, {"id": "P10216", "text": ["Archie searches for files based on _______"], "jumps": []}, {"id": "P10215", "text": [], "jumps": []}, {"id": "P10214", "text": ["Archie is used to search for files in _______"], "jumps": []}, {"id": "P10213", "text": ["Which of the following is an example of a Gopher?"], "jumps": []}, {"id": "P10212", "text": [], "jumps": []}, {"id": "P10211", "text": [], "jumps": []}, {"id": "P10210", "text": [], "jumps": []}, {"id": "P1040", "text": ["The first thing we are going to talk about is Gopher. Gopher, similar to the World Wide Web, is a system of servers on the Internet."], "jumps": ["P1050", "P1001"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2950", "text": ["4. News clients allow you to read articles from newsgroups on the Internet. There are thousands of newsgroups with thousands of articles.", "help me, I am trying to read all the news but there is too much."], "jumps": ["P2999", "P2940"]}, {"id": "P10410", "text": ["2. Finger, Whois, Ping and News Clients"], "jumps": []}, {"id": "P2930", "text": ["2. Finger allows you to look up information about a user at a particular sight. The information returned will vary based on the finger server software."], "jumps": ["P2940", "P2920"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P2001", "P2950"]}, {"id": "PINFO", "text": ["12-08-00 Converted from SAM to toolbook. frieda 12-08-00 Text and Branching. frieda 12-12-00 Graphics John Ayala 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-13-02 Review of Conversion.Alexis"], "jumps": []}, {"id": "P2470", "text": ["Many Internet providers will give you details on how to access news on their systems. They will also recommend a news application that works well with their system."], "jumps": ["P2910", "P2450"]}, {"id": "P2910", "text": ["This completes the information on FINGER, WHOIS, PING & NEWS CLIENTS."], "jumps": ["P2001", "P2450"]}, {"id": "P1920", "text": ["1. Gopher is a text based information service which uses a menu directory and file structure.", "Ketch burnett 1: Gopher Welcome to the wonderful world of Gopher! Gopher has limitations on its use and comes without a warranty. Please refer to the file \"Copyright\" included in the distribution. Internet Gopher Information Client 2.0 patch8 Copyright 1991,92 93 by the regents of the University of Minnesota. Press RETURN to continue"], "jumps": ["P1930", "P1001"]}, {"id": "P2440", "text": ["If you follow a thread, all the information will pertain to the original article.", "You may notice that when downloading news articles, some may have threads. A thread is a group of articles all in reply to a particular article, like replies to e-mail."], "jumps": ["P2450", "P2390"]}, {"id": "P2420", "text": ["The next step is to select one and start downloading messages. Some groups have thousands of messages, so you may want to specify dates.", "Examples of newsgroups are shown below. Once you are connected to a news server, a list of available newsgroups are shown."], "jumps": ["P2430", "P2390"]}, {"id": "P2400", "text": ["Just as with IRC, there are thousands of newsgroups. Many news servers will provide a subset and allow you to e-mail requests. News servers use LOTS of disk space."], "jumps": ["P2410", "P2390"]}, {"id": "P2410", "text": ["Examples of newsgroups are shown below. Once you are connected to a news server, a list of available newsgroups are shown."], "jumps": ["P2420", "P2390"]}, {"id": "P2430", "text": ["You may notice that when downloading news articles, some may have threads. A thread is a group of articles all in reply to a particular article, like replies to e-mail."], "jumps": ["P2440", "P2390"]}, {"id": "P2385", "text": ["The last item we will talk about is news readers. News reader applications come in text or graphic modes. Some Web browsers contain news readers."], "jumps": ["P2390", "P2380"]}, {"id": "P450", "text": ["Let's begin the lesson on INTERNET UTILITIES.............................."], "jumps": ["P400"]}, {"id": "P2370", "text": ["As you can see, this can be very powerful if you are looking for someone on the Internet. The problem is the information could be outdated.", "Notice that the server indicates only internet information is provided. Locating someone in this fashion may be accomplished with other programs as well."], "jumps": ["P2380", "P2340"]}, {"id": "P2350", "text": ["Note that the name we gave will not be used as a last name, but any part of a name on the Internet. Below shows the list of information returned by the client.", "Burnett Companiesconsolidated (BURNETTPS-DOM) BURNETTPS>COM Burnett Direct,Inc. (BURNETT_DOM) (407) 555-5555 Burnett,Lawson (LB451) 1burnettcKONNECTIONS>COM 801-555-5555 The InterNIC registration Service Host contains ONLY Internet Information (Networks, ASN's,Domains,and POC's) Please use the whois server at nic.ddnmil for MILNET Information."], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["Notice that the server indicates only internet information is provided. Locating someone in this fashion may be accomplished with other programs as well."], "jumps": ["P2370", "P2340"]}, {"id": "P2330", "text": ["It is important to note that whois is a very old tool and the whois server you connect to may not have current information. However, many people still use it.", "The whois application allows you to look up names and try to find the Internet e-mail addresses of these people."], "jumps": ["P2340", "P2310"]}, {"id": "P2310", "text": ["The next tool we will discuss is the whois application. Which as the name implies can tell you \"who is\".", "Finger is an application with loose restrictions on the format of returned information. The output can even be modified by administrators or users of an Internet location."], "jumps": ["P2320", "P2300"]}, {"id": "P2301", "text": [], "jumps": []}, {"id": "P2320", "text": ["The whois application allows you to look up names and try to find the Internet e-mail addresses of these people."], "jumps": ["P2330", "P2310"]}, {"id": "P2290", "text": ["Notice that this finger server only indicates when the user last logged on and the number for the Internet provider service."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["Finger always gives you the same information, regardless of the Internet site."], "jumps": ["P2280"]}, {"id": "P2270", "text": ["From this information you can see that Jane has logged in but hasn't read any mail since the 4th. If you sent Jane mail after the 4th she hasn't read it yet.", "If there is information, it may look like the example shown below. This is from a UNIX internet provider. Finger information can be VERY different based on the provider.", "login name: jsmith in real life: jane smith directory:/accts/jsmith shell:/bin/csh last login wed sep 11 19:50 on ttyp5 from pram.school.edu mail last read wed sep 4 13:38:39 1996 no plan."], "jumps": ["P2280", "P2200"]}, {"id": "P2250", "text": ["If the user you have specified cannot be found then you may be notified of this. Remember, many different finger applications provide their own functionality different than others."], "jumps": ["P2260", "P2200"]}, {"id": "P2230", "text": ["Finally you select go, or the button identified to start the application. The finger client will then try to establish communication with the Internet address location.", "Next, supply the user name, in this example Jane Smith has been assigned the user name of jsmith. Notice if you put the user name and host together with an `@' in between you have an e-mail address."], "jumps": ["P2240", "P2200"]}, {"id": "P2210", "text": ["The first thing is to specify the host or address of the person you want information about, in this case it would be \"school.edu\"."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["Next, supply the user name, in this example Jane Smith has been assigned the user name of jsmith. Notice if you put the user name and host together with an `@' in between you have an e-mail address."], "jumps": ["P2230", "P2200"]}, {"id": "P2190", "text": ["Now let's say that you sent an e-mail to Jane Smith who also has an account at the same location, school.edu, and you want to find out if she has read the mail you sent."], "jumps": ["P2200", "P2150"]}, {"id": "P2180", "text": ["For an example, let's say you are a student at school.edu and school.edu is the service which provides you with Internet access.", "One of finger's features is that it can tell you if someone has any unread mail. E-mail has no way of letting you know if the mail you have sent has been read. Finger can be used to do this."], "jumps": ["P2190", "P2150"]}, {"id": "P2160", "text": ["You can also look up information about people that use the same provider you use. Basically, all you need is their e-mail address.", "The next tool we are going to talk about is finger. Finger is used to look up information about people by their Internet provider."], "jumps": ["P2170", "P2150"]}, {"id": "P2143", "text": ["An Internet address is used to identify who you are trying to communicate with. If the ping does not have an address, it would not know who to try and establish communication with."], "jumps": []}, {"id": "P2141", "text": [], "jumps": []}, {"id": "P2142", "text": ["You use the client application called ping. Ping doesn't need a ping server because it communicates directly with the computer you are contacting."], "jumps": []}, {"id": "P2130", "text": ["Ping is very powerful in the sense that it allows you to examine the connectivity of one computer to other computers on a network, locally or globally."], "jumps": ["P2140", "P2060"]}, {"id": "P2120", "text": ["Finally, system administrators use ping to determine if a new or existing system in their network can communicate with other computers in the same network.", "Other more advanced ping applications can tell you how long it will take for information to travel to and from the site to your computer."], "jumps": ["P2130", "P2060"]}, {"id": "P2100", "text": ["Some ping applications may tell you \"Yes, site is alive\" or \"No communication\". These responses are good for site verification to see if the site is there.", "Ping allows you to check a site and see if it is there. No ping server is required. There are a few different types of ping applications.", "correction established gms transfer time"], "jumps": ["P2110", "P2060"]}, {"id": "P2080", "text": ["If your FTP program simply says that the connection is not established, you haven't got enough information to find the real reason why you can't FTP. Maybe the site you are using doesn't have a FTP server...", "To give an example, let's imagine that you are trying to transfer a file to a site on the Internet, like ftp.cdrom.com."], "jumps": ["P2090", "P2060"]}, {"id": "P2060", "text": ["Let's start with ping. Ping is an application that checks to see if a computer is connected and communicating with the Internet.", "Some Internet applications contain finger, whois and ping."], "jumps": ["P2070", "P2040"]}, {"id": "P2040", "text": ["Finger, whois, ping and News Client/Servers were and still are used to find people, exchange information and check computer connections to the Internet."], "jumps": ["P2050", "P2001"]}, {"id": "P2050", "text": ["Some Internet applications contain finger, whois and ping."], "jumps": ["P2060", "P2040"]}, {"id": "P2070", "text": ["To give an example, let's imagine that you are trying to transfer a file to a site on the Internet, like ftp.cdrom.com."], "jumps": ["P2080", "P2060"]}, {"id": "P1930", "text": ["2. Archie is a tool used to search for files in FTP sites on the Internet.", "file.exe. ftp.sunsite.edu file.exe. ftp.unc.edu file.exe. ftp.nida.com file.exe. ftp.archive.net"], "jumps": ["P1999", "P1920"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1930"]}, {"id": "P1910", "text": ["This completes the information on GOPHER AND ARCHIE........", "Gopher and Archie are two more tools for you to use when you want more information."], "jumps": ["P1001", "P1350", "P1910", "P1340"]}, {"id": "P1342", "text": ["Remember, Archie searches for files on FTP servers........."], "jumps": []}, {"id": "P1340", "text": ["Archie searches for files located on _______ servers......."], "jumps": ["P1260"]}, {"id": "P1341", "text": ["The World Wide Web allows you to search for a topic, word, name, etc. Ideas and keywords are used to start a search engine rather than filenames."], "jumps": []}, {"id": "P1310", "text": ["When you use Archie it is important to know the exact name of the file you are looking for.", "Depending on the client/server, you may have to start an FTP client and use the information you found or, the Archie client may have a built in FTP client."], "jumps": ["P1320", "P1260"]}, {"id": "P1350", "text": ["Gopher and Archie are two more tools for you to use when you want more information."], "jumps": ["P1910", "P1340"]}, {"id": "P1920", "text": ["1. Gopher is a text based information service which uses a menu directory and file structure.", "Ketch burnett 1: Gopher Welcome to the wonderful world of Gopher! Gopher has limitations on its use and comes without a warranty. Please refer to the file \"Copyright\" included in the distribution. Internet Gopher Information Client 2.0 patch8 Copyright 1991,92 93 by the regents of the University of Minnesota. Press RETURN to continue"], "jumps": ["P1930", "P1001"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2090", "text": ["Ping allows you to check a site and see if it is there. No ping server is required. There are a few different types of ping applications.", "correction established gms transfer time"], "jumps": ["P2100", "P2060"]}, {"id": "P2110", "text": ["Other more advanced ping applications can tell you how long it will take for information to travel to and from the site to your computer."], "jumps": ["P2120", "P2060"]}, {"id": "P2130", "text": ["Ping is very powerful in the sense that it allows you to examine the connectivity of one computer to other computers on a network, locally or globally."], "jumps": ["P2140", "P2060"]}, {"id": "P2140", "text": ["Ping does not require a _______ed.........................."], "jumps": ["P2060"]}, {"id": "P1230", "text": ["One example of a good archive program is fpArchie for Windows 95. It works very similar to the find file feature built into Windows 95.", "Archie can be accessed through a telnet session, Gopher, or the World Wide Web. Archie can be text based or graphical based."], "jumps": ["P1240", "P1210"]}, {"id": "P1210", "text": ["The next tool we will talk about is Archie. Archie is a tool used to find FTP files on the Internet. There are a variety of different ways to use Archie.", "Gopher uses many files and directories when providing information to the user."], "jumps": ["P1220", "P1200"]}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1200", "text": ["Which of the following does Gopher not use?................"], "jumps": ["P1190"]}, {"id": "P1202", "text": ["Gopher uses many files and directories when providing information to the user.", "INTERNET SUITE - An Internet suite is just a large collection of Internet programs sold as a bundle."], "jumps": []}, {"id": "P1190", "text": ["You may find Web browsers with built in Gophers. Internet Suites can also contain Gophers.", "The commands available to you will depend on the Gopher you use. As you can see they are very straight forward and easy to use but, if you do have any questions your system administrator or Internet provider can help..."], "jumps": ["P1200", "P1130"]}, {"id": "P1160", "text": ["Also, notice that there are commands listed at the bottom of the screen. For example, \"?\" can get you help or \"u\" will take you to the previous directory."], "jumps": ["P1170", "P1130"]}, {"id": "P1170", "text": ["The commands available to you will depend on the Gopher you use. As you can see they are very straight forward and easy to use but, if you do have any questions your system administrator or Internet provider can help..."], "jumps": ["P1190", "P1130"]}, {"id": "P1130", "text": ["Now this leads you into another directory. Here you can select from all sorts of fun; games, humor, movies, etc. Let's say that you wanted to look at humor.", "Fun & Games 1. Games/ 2. Humor/ 3. Movies/ 4. Music/ 5. Recipes/ Press ? for Help, q to QUIT, u to go up a menu Page: 1/1"], "jumps": ["P1135", "P1120"]}, {"id": "P1150", "text": ["Sometimes there are more directories mixed in with files. If a file is not readable, you will be given options to save the file to your computer."], "jumps": ["P1160", "P1130"]}, {"id": "P1110", "text": ["The directory titles indicate what type of information they will lead you to, for example: Games, News, Weather or Phone Books just to name a few.", "It is important to notice that Gopher works like a series of subdirectories and files. Words with a \"/\" after them are directories."], "jumps": ["P1120", "P1080"]}, {"id": "P1090", "text": ["Internet Gopher Information Client 2.0 p18 Root gopher server: gopher.tc.umn.edu 1. Information About Gopher/ 2. Computer Information/ 3. Discussion Groups/ 4. Fun & Games/ 5. Internet file server (ftp) sites/ 6. Libraries/ 7. News/ 8. Other Gopher and Information Servers/ 9. Phone books/ 10. Search Gopher Titles at the University of Minnesota <?> 11. Search lots of places at the University of Minnesota <?> 12. University of Minnesota Campus Information/", "After pressing return, the following main screen will be displayed. The starting screen for your Gopher may vary depending on the Gopher setup."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["It is important to notice that Gopher works like a series of subdirectories and files. Words with a \"/\" after them are directories."], "jumps": ["P1110", "P1080"]}, {"id": "P1120", "text": ["Let's say that you wanted to have some fun. The first thing you would do is move the cursor to the \"Fun and Games\" selection and press enter.", "Internet Gopher Information Client 2.0 p18 Root gopher server: gopher.tc.umn.edu 1. Information About Gopher/ 2. Computer Information/ 3. Discussion Groups/ 4. Fun & Games/ 5. Internet file server (ftp) sites/ 6. Libraries/ 7. News/ 8. Other Gopher and Information Servers/ 9. Phone books/ 10. Search Gopher Titles at the University of Minnesota <?> 11. Search lots of places at the University of Minnesota <?> 12. University of Minnesota Campus Information/"], "jumps": ["P1130", "P1080"]}, {"id": "P1140", "text": ["To look at the contents of the file you would select the file."], "jumps": ["P1150", "P1130"]}, {"id": "P1060", "text": ["There are graphical Gopher clients, just as there are with FTP's. We, however, are going to talk about a text oriented Gopher client."], "jumps": ["P1070", "P1040"]}, {"id": "PINFO", "text": ["12-08-00 Converted from SAM to toolbook. frieda 12-08-00 Text and Branching. frieda 12-12-00 Graphics John Ayala 07-19-01 Converted to ToolBook 8.1 format. jay", "12-08-00 Converted from SAM to toolbook. frieda 12-08-00 Text and Branching. frieda 12-12-00 Graphics John Ayala 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay"], "jumps": []}, {"id": "P450", "text": ["Let's begin the lesson on INTERNET UTILITIES.............................."], "jumps": ["P400"]}, {"id": "P1040", "text": ["The first thing we are going to talk about is Gopher. Gopher, similar to the World Wide Web, is a system of servers on the Internet."], "jumps": ["P1050", "P1001"]}, {"id": "P430", "text": ["A newsgroup allows information to be posted and distributed widely.", "Finger, whois, and ping are used to get information about users."], "jumps": ["P440", "P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1050", "text": ["It is important to realize that the World Wide Web replaced the need for Gopher, however, because some systems do not support graphical interfaces or have WWW software, Gopher is still used..."], "jumps": ["P1060", "P1040"]}, {"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "not specified in the License Agreement"], "jumps": []}, {"id": "P410", "text": ["Gopher and Archie are older search tools still used today to get information from other computers."], "jumps": ["P420", "P400"]}, {"id": "P10410", "text": ["2. Finger, Whois, Ping and News Clients"], "jumps": []}, {"id": "P420", "text": ["Finger, whois, and ping are used to get information about users."], "jumps": ["P430", "P400"]}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: INTERNET UTILITIES asdf asd fasfd asdf asdf sadf", "\"You have successfully passed the assessment", "You have successfully passed the assessment test!"], "jumps": []}, {"id": "P100", "text": ["w Understand the use and operation of Gopher. w Understand the use and operation of Archie.", "w Understand the use and operation of finger. w Understand the use and operation of whois. w Understand the use and operation of ping. w Understand the use and operation of News clients."], "jumps": []}, {"id": "P440", "text": ["After you have finished this lesson you will have the basic understanding of the most frequently used applications on the internet.", "Are you sure you want to Bookmark the Lesson?", "Are you sure you want to Exit the Lesson?", "You skipped X question(s). Do you want to _________", "The test is complete and your score is XX%. Do you want to _________", "You have successfully passed the assessment test!"], "jumps": ["P450", "P400"]}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["Before features like; web browsing, FTP files, telnet and mail, other applications called Gopher, Archie, finger, whois, ping and News were used."], "jumps": ["P410", "P300"]}, {"id": "P1250", "text": ["Like many Internet applications, a server is required to communicate with the client. Most Archie clients have a list of severs built into them."], "jumps": ["P1260", "P1240"]}, {"id": "P1270", "text": ["After the parameters for a search are entered, the server begins to search the archives."], "jumps": ["P1280", "P1260"]}, {"id": "P10", "text": ["\"You have successfully passed the assessment"], "jumps": []}, {"id": "P2920", "text": ["1. Ping is used to determine if a site on the Internet can communicate with your computer. Ping only requires a client and not a server.."], "jumps": ["P2930", "P2001"]}, {"id": "P2940", "text": ["3. Whois allows you to specify a user name and a list of people on the Internet with that name and their e-mail addresses will be shown."], "jumps": ["P2950", "P2930"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P1070", "text": ["There are different ways to access Gopher. The way Gopher is accessed is determined by the Internet provider."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["Ketch burnett 1: Gopher Welcome to the wonderful world of Gopher! Gopher has limitations on its use and comes without a warranty. Please refer to the file \"Copyright\" included in the distribution. Internet Gopher Information Client 2.0 patch8 Copyright 1991,92 93 by the regents of the University of Minnesota. Press RETURN to continue", "The example below shows a Gopher client user started in a UNIX operating system. All text based clients will start approximately in the same manner."], "jumps": ["P1090", "P1040"]}, {"id": "P1260", "text": ["Depending on the Archie, connection to the server may be required prior to entering the file name. Most graphical clients enter all the information and then they are connected."], "jumps": ["P1270", "P1240"]}, {"id": "P1280", "text": ["The search will take time. The amount of time varies depending on the number of people trying to looking for files using the same Archie server."], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["After the server is done it will return a list of locations and information about the files searched for. There may be hundreds, there may be none.", "file.exe. ftp.sunsite.edu file.exe. ftp.unc.edu file.exe. ftp.nida.com file.exe. ftp.archive.net"], "jumps": ["P1300", "P1260"]}, {"id": "P1300", "text": ["Depending on the client/server, you may have to start an FTP client and use the information you found or, the Archie client may have a built in FTP client."], "jumps": ["P1310", "P1260"]}, {"id": "P1320", "text": ["The World Wide Web allows you to search for a topic, word, name, etc. Ideas and keywords are used to start a search engine rather than filenames."], "jumps": ["P1330", "P1260"]}, {"id": "P1330", "text": ["However, if you know the file you want, a quick method for searching the Internet FTP servers is Archie."], "jumps": ["P1340", "P1260"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1135", "text": ["When Humor is selected from the list a menu or list of Humor related topics is displayed.", "Humor 1. Search Humor <?> 2. 00README. 3. Alice in UNIX Land. 4. Backwoods Fusion. 5. Beer vs cucumbers/ 6. Berkeley. 7. C-Programming. 8. C-Shell 9. Car-Acronyms. 10. Chai's C Bible. 11. Final Exam 12. Hacker Test 13. How to take Notes. 14. Programming. 15. Real Computer Scientists. 16. Real Programmers. 17. real Software Engineers. 18. Research Papers. Press ? for Help, q to QUIT, to go up a menu Page: 1/2"], "jumps": ["P1140", "P1130"]}, {"id": "P1195", "text": ["INTERNET SUITE - An Internet suite is just a large collection of Internet programs sold as a bundle."], "jumps": []}, {"id": "P1220", "text": ["Archie can be accessed through a telnet session, Gopher, or the World Wide Web. Archie can be text based or graphical based."], "jumps": ["P1230", "P1210"]}, {"id": "P1240", "text": ["The actual features of each Archie client/server may be different, however, the functionality will be the same."], "jumps": ["P1250", "P1210"]}, {"id": "P1245", "text": ["CLIENT/SERVER - A computer that allows other computers to use programs and applications it has is a server. A client is a computer that uses a program or application from a server.", "# #\" #& \"\"# &\"###2' &2#&.22&# 25--283-.#285255232/238882-.-5:38832222882282-213:22::82-22225:8-33-22282232.22258558.5822385:235:222 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
