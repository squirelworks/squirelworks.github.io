pendent on the server's software.", "Telnet gives you remote access to another computer. The commands and options depend on the software at the server."], "jumps": ["P2220", "P2160"]}, {"id": "P2190", "text": ["The bulletin-board system was developed before the Internet provided telnetting access. An example would be MajorBBS from galacticomm.", "This is for othe person that reades theis", "rick@netserver> telnet spacecst.net Trying 207.31.115.2... Connected to spacecst.net. Escape character is '^]'. *Major TCP/IP by Vircom Inc. * Connecting....Please Wait.... Auto-sensing... Auto-sensing PPP_(8 seconds) Hit CTRL-X to abort e the file DIRMAP.TXT for more information. 230 Anonymous user logged in. ftp>", "WELCOME!! Space Coast Online (39008001) Running The Major BBS by GALACTICOMM ONLINE 28800 Baud at 23:44 28-Aug-96 We are officially Space Coast Online Inc. Our Internet Address (DNS) is Spacecst.net Note ***** We are in the process of changing rates and classes. The new rates and classes should be posted within the next few days (Gamer's Please Type \"new\" or enter your Username:", "Providers offering Windows NT or MS-DOS based services may not necessarily have telnet. It depends on the server's software they are using."], "jumps": ["P2200", "P2160"]}, {"id": "P2170", "text": ["Internet providers who use UNIX or a UNIX compatible operating system like Linux will have telnet capabilities."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["Providers offering Windows NT or MS-DOS based services may not necessarily have telnet. It depends on the server's software they are using."], "jumps": ["P2190", "P2160"]}, {"id": "P2200", "text": ["Telnet gives you remote access to another computer. The commands and options depend on the software at the server."], "jumps": ["P2210", "P2160"]}, {"id": "P2152", "text": ["Telnet is like FTP in one respect. It needs both a client and a server to operate."], "jumps": []}, {"id": "P2150", "text": ["Unlike FTP, telnet only needs clients?....................."], "jumps": ["P2130"]}, {"id": "P2130", "text": ["Like with FTP, telnet requires both a server and a client to operate. Giving a description of commands is hard because telnet is not just an application."], "jumps": ["P2140", "P2080"]}, {"id": "P2151", "text": [], "jumps": []}, {"id": "P2080", "text": ["Some computers may use a Windows interface; however, there will still be a text area for communications with the telnet server."], "jumps": ["P2090", "P2060"]}, {"id": "P2110", "text": ["Many of these games can be found on the World Wide Web with instructions on how to login. Some give numbers after the Internet address that indicates a specific port on the server."], "jumps": ["P2120", "P2090"]}, {"id": "P2120", "text": ["Port numbers are used for different types of telnet connections. Port 8000 is commonly used for MUD games."], "jumps": ["P2130", "P2090"]}, {"id": "P2140", "text": ["Telnet is more like an interpreter between you and another operating system. You tell it commands to send to the server, and it replies with the results."], "jumps": ["P2150", "P2130"]}, {"id": "P2050", "text": ["Unlike FTP, you can use the other computer operating system. This application is mostly used in the UNIX environment. However, there are some personal computer applications."], "jumps": ["P2060", "P2040"]}, {"id": "P2160", "text": ["Realizing that telnet provides no file transfer to your remote system is important. This is a function of FTP.", "This is for othe person that reades theis", "C:\\>Telnet netserver.company.com SunOS UNIX (netserver) login: rick Password: Last login: Wed Aug 28 13:17:26 from maxwell SunOS Release 4.1.3 (NETSERVER) #1:Thu Feb 25 16:41:46 EST 1993 You have mail. rick@netserver> 230 - This is FTP MICROSOFT.COM. See the file DIRMAP.TXT for more information. 230 Anonymous user logged in. ftp>"], "jumps": ["P2170", "P2150"]}, {"id": "P2040", "text": ["In this section we are going to briefly discuss telnet. Telnet is an application that lets you remotely login to another machine."], "jumps": ["P2050", "P2001"]}, {"id": "P1950", "text": ["4. The most useful commands of FTP are:..................."], "jumps": ["P1999", "P1940"]}, {"id": "P1930", "text": ["2. FTP requires both a client and a server for communication.", "Connected to ftp.//.com User: Anonymous Password: ftp>_"], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. To use public FTP servers, the user name anonymous is used with your e-mail address as the password.", "This is for othe person that reades theis", "C:\\temp>ftp ftp.microsoft.com Connected to ftp.microsoft.com. 220 ftp Microsoft FTP Service (Version 2.0). User (ftp.microsoft.com:(none)): anonymous 331 Anonymous access allowed, send identity (e-mail name) as password. Password: 230 - This is FTP MICROSOFT.COM. See the file DIRMAP.TXT for more information. 230 Anonymous user logged in. ftp>"], "jumps": ["P1950", "P1930"]}, {"id": "P2060", "text": ["Some providers may provide e-mail tools through e-mail. Telnet is started in the same way as FTP, through a DOS window and an Internet address.", "This is for othe person that reades theis", "C:\\>Telnet netserver.company.com SunOS UNIX (netserver) login: rick Password: Last login: Wed Aug 28 13:17:26 from maxwell SunOS Release 4.1.3 (NETSERVER) #1:Thu Feb 25 16:41:46 EST 1993 You have mail. rick@netserver> 230 - This is FTP MICROSOFT.COM. See the file DIRMAP.TXT for more information. 230 Anonymous user logged in. ftp>"], "jumps": ["P2080", "P2050"]}, {"id": "P2090", "text": ["Usually, telnet connections do not have anonymous login, unless it is to a public service.", "This is for othe person that reades theis", "C:\\>Telnet netserver.company.com SunOS UNIX (netserver) login: rick Password: Last login: Wed Aug 28 13:17:26 from maxwell SunOS Release 4.1.3 (NETSERVER) #1:Thu Feb 25 16:41:46 EST 1993 You have mail. rick@netserver> 230 - This is FTP MICROSOFT.COM. See the file DIRMAP.TXT for more information. 230 Anonymous user logged in. ftp>"], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["Many telnet servers are used for playing MUD games. MUD stands for multi-user dungeon. Other games like MOOs, MUSHes and DIKU MUDS are also available.", "Welcome to the Outer Space MUD. By what name would you like to be known? Password: Last login: Wed Aug 28 13:17:26 from maxwell SunOS Release 4.1.3 (NETSERVER) #1:Thu Feb 25 16:41:46 EST 1993 You have mail. rick@netserver> 230 - This is FTP MICROSOFT.COM. See the file DIRMAP.TXT for more information. 230 Anonymous user logged in. ftp>"], "jumps": ["P2110", "P2090"]}, {"id": "P1521", "text": [], "jumps": []}, {"id": "P1540", "text": ["However, web browsers don't keep a constant connection and they are generally slower than a dedicated FTP client."], "jumps": ["P1550", "P1530"]}, {"id": "P1510", "text": ["Graphical FTP servers come with help that details their features. An example of one popular FTP server is WS-FTP which can be found on the Internet."], "jumps": ["P1520", "P1480"]}, {"id": "P1520", "text": ["To use FTP, both a client and a server are required?......."], "jumps": ["P1480"]}, {"id": "P1550", "text": ["In the next section of this lesson you will learn about telnet, another useful utility of the Internet."], "jumps": ["P1910", "P1530"]}, {"id": "P1910", "text": ["This completes the information on FTP.CTIVE 1 TITLE........"], "jumps": ["P1001", "P1530"]}, {"id": "P1470", "text": ["Pub meaning public. This was adopted from UNIX systems where FTP is used the most.", "Most FTP servers will provide information on which directory files can be found. Normally files are in the pub directory or beneath it."], "jumps": ["P1480", "P1430"]}, {"id": "P1480", "text": ["When you are finished using the FTP server, the quit command will log you off the FTP server.", "This is for othe person that reades theis", "ftp> quit 221 Goodbye c:\\temp>d successful. 150 Binary data connections for tcp.zip (163.118.4.167,1080) (12032 bytes). 226 Bin let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
