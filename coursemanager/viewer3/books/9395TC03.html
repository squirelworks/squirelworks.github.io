and valves manufactured for hydraulics or pneumatics?", "Tighter tolerances on pneumatic, no difference on hydraulic."], "jumps": []}, {"id": "P10218", "text": ["How does the exhaust or return port differ between hydraulic and pneumatic systems?", "On pneumatic systems the port returns the air to the reservoir and on hydraulic systems it exhausts the fluid to the atmosphere.", "On hydraulic systems the port returns the fluid to the reservoir and on pneumatic systems it exhausts the air to the atmosphere."], "jumps": []}, {"id": "P10217", "text": ["Which valves provide reversal of the fluid flow?", "Globe and spring-loaded pressure reducing"], "jumps": []}, {"id": "P10216", "text": [], "jumps": []}, {"id": "P10215", "text": ["PILOT-CONTROLLED PRESSURE REDUCING VALVE GOES HERE AFTER COMPLETION MAKE SURE TO GROUP GRAPHIC WITH TEXT AND CENTER ON PAGE"], "jumps": []}, {"id": "P10214", "text": ["GATE VALVE GOES HERE AFTER COMPLETION MAKE SURE TO GROUP GRAPHIC WITH TEXT AND CENTER ON PAGE"], "jumps": []}, {"id": "P10213", "text": [], "jumps": []}, {"id": "P10212", "text": ["BALL CHECK VALVE GOES HERE. AFTER COMPLETION MAKE SURE TO GROUP GRAPHIC WITH TEXT AND CENTER ON PAGE"], "jumps": []}, {"id": "P10211", "text": [], "jumps": []}, {"id": "P10210", "text": ["LE VALVE GOES HERE AFTER COMPLETION MAKE SURE TO GROUP GRAPHIC WITH TEXT AND CENTER ON PAGE"], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1950"]}, {"id": "P1950", "text": ["4. Flow control valves are the common on/off valves used in hydraulics and pneumatics.."], "jumps": ["P1999", "P1930"]}, {"id": "P1940", "text": ["es are used primarily pneumatic systems and maintain the pressure", "3. Pressure reducing valves are used primarily in pneumatic systems and maintain the pressure in the system at a level lower than the supply pressure.."], "jumps": ["P1950", "P1930"]}, {"id": "P1930", "text": ["2. Check valves allow fluid flow in one direction only and are used in hydraulic and pneumatic systems to control the flow direction."], "jumps": ["P1940", "P1920"]}, {"id": "P1920", "text": ["1. Valves are used in hydraulic and pneumatic systems to control the direction, pressure, and flow of the fluid in the system.."], "jumps": ["P1930", "P1001"]}, {"id": "P1910", "text": ["You have completed the information on VALVES. TITLE........"], "jumps": ["P1001", "P1370"]}, {"id": "P1373", "text": ["The check valve is the type of valve used to control the direction in which the fluid flows in a hydraulic or pneumatic system."], "jumps": []}, {"id": "P1372", "text": ["The needle valve is the type of valve used to control the pressure in a hydraulic or pneumatic system."], "jumps": []}, {"id": "P1371", "text": [], "jumps": []}, {"id": "P1370", "text": ["Slider and rotary spool valves are types of _______........"], "jumps": ["P1360"]}, {"id": "P1360", "text": ["You may encounter hydraulic or pneumatic systems with several different types of valves and applications. In some applications you may see several valves operating from a common control."], "jumps": []}, {"id": "P1350", "text": ["The rotary spool valve is another method of flow control. Comprised of a core with fluid passages inside a sleeve with attached ports, the rotary spool valve can provide up to the same options as the four-way spool slider valve..."], "jumps": []}, {"id": "P1340", "text": ["The most common use for the four-way spool valve is the reversal of the fluid flow. The valve has one input, two selectable output ports, and a return or exhaust port. In hydraulic systems the return port directs fluid back to the reservoir. In a pneumatic system the return port exhausts the air to the atmosphere..."], "jumps": []}, {"id": "P1330", "text": ["The three-way spool valve allows the user the choice of directing the pressure input to one of two output ports."], "jumps": ["P1340", "P1310", "P"]}, {"id": "P1310", "text": ["Valves with multiple ports can be operated manually but are usually controlled by other means such as electrically. In the two-way valve the spool slides to one of two positions and either turns the flow on or off. These types of flow valves do not provide gradual flow control such as the globe valve."], "jumps": []}, {"id": "P1300", "text": ["In elaborate fluid power systems there is sometimes the need to direct the fluid in different directions or reverse its flow. Applications of this type bring on a different type of flow valve with multiple inlet and outlet ports. These multiple control valves are named for the number of ports used in each valve..."], "jumps": ["P1310", "P1290"]}, {"id": "P1293", "text": ["The check valve is used to control the direction of the fluid flow in a hydraulic or pneumatic system."], "jumps": []}, {"id": "P1292", "text": ["The needle valve is used to control the pressure in a hydraulic or pneumatic system."], "jumps": []}, {"id": "P1291", "text": [], "jumps": []}, {"id": "P1290", "text": ["The globe valve is an example of which type of fluid power valve?"], "jumps": ["P1280"]}, {"id": "P1280", "text": ["Valves made specifically for hydraulic and pneumatic systems are usually manufactured to tighter tolerances than those made for plumbing due to the higher pressures and types of liquids used..."], "jumps": ["P1290", "P1260"]}, {"id": "P1270", "text": ["While commonly used in a fully open or fully closed configuration, the globe valve also provides regulated fluid control based on the height of the stem in the valve body."], "jumps": []}, {"id": "P1260", "text": ["When closed, the disk is pressed tightly against the seat, preventing the flow of the fluid. Twisting the knob raises the stem, thus allowing the fluid to flow."], "jumps": []}, {"id": "P1250", "text": ["Named for the globular shape of the valve body, the most common valve used in fluid power systems is the globe valve. You're probably most familiar with this valve as it's been the accepted valve for pressurized water systems such as the restroom sink..."], "jumps": []}, {"id": "P1240", "text": ["There are several different types of flow control valves. Their function is to allow or prevent the flow of liquid or gases in a hydraulic or pneumatic system. Most are manually operated but sophisticated systems such as manufacturing plants and aircraft utilize remote activation of the valves..."], "jumps": ["P1250", "P1230"]}, {"id": "P1233", "text": ["Check valves control the direction of fluids in a hydraulic or pneumatic system."], "jumps": []}, {"id": "P1232", "text": ["Ball valves control the flow of fluids in a hydraulic or pneumatic system."], "jumps": []}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1230", "text": ["The spring-loaded, the pilot-controlled, and the needle valves are examples of _______", "Valves that control the direction of fluids.", "Valves that control the pressure of fluids."], "jumps": ["P1220"]}, {"id": "P1220", "text": ["The needle valve performs the function of reducing pressure but does not provide any type of regulation. Should the supply pressure drop, the output pressure drops proportionally.", "Needle Valvelled Pressure Reducing Valvee"], "jumps": ["P1230", "P1190"]}, {"id": "P1210", "text": ["If the pressure should get too high it overcomes the spring tension holding the poppet and the air is exhausted out the drain port. This reduces the pressure at one end of the chamber and the valve spool moves upward, reducing the restrictive opening and lowering the pressure..."], "jumps": ["P1220", "P1190"]}, {"id": "P1200", "text": ["Moving the valve spool upward in the valve body reduces the output pressure and moving downward increases the output pressure."], "jumps": []}, {"id": "P1190", "text": ["The pilot-controlled pressure reducing valve also relies on pressure pushing against the tension of an adjustable spring. The valve spool floats in the valve body with the position determined by the pressure...", "Pilot-Controlled Pressure Reducing Valvee"], "jumps": ["P1200", "P1160"]}, {"id": "P1180", "text": ["When the output pressure reaches the correct level the diaphragm is pushed by the pressure and closes the valve."], "jumps": ["P1190", "P1160"]}, {"id": "P1170", "text": ["When the proper pressure is reached, the valve closes until the output pressure drops again. The spring-loaded pressure reducing valve relies on a diaphragm to monitor the output pressure. When the output pressure drops below the preset level, the spring tension forces the valve off the seat..."], "jumps": []}, {"id": "P1160", "text": ["The most popular versions of pressure reducing valves are the spring-loaded valve and the pilot-controlled valve. The operation of both is similar, when demanded by the pressure monitoring circuit; a valve is manipulated to raise or lower the output pressure..."], "jumps": []}, {"id": "P1150", "text": ["The pressure reducing valves operate reliably provided the supply pressure is always greater than the required output pressure and the pressure demand at the output stays within the designed capacity of the system. The higher pressure flowing through a smaller opening reduces the pressure at the output...", "Pilot-Controlled Pressure Reducing Valvee"], "jumps": []}, {"id": "P1140", "text": ["Pressure reducing valves are often used in pneumatic systems to assure a steady pressure at a preset level. The valve receives a higher pressure from the supply side and then regulates the output pressure, maintaining it at one level..."], "jumps": []}, {"id": "P1132", "text": ["Check valves control the direction in fluid power.........."], "jumps": []}, {"id": "P1131", "text": [], "jumps": []}, {"id": "P1130", "text": ["Check valves perform what function in fluid power?.........", "Control the pressure of the liquid or gas.", "Control the direction of the liquid or gas."], "jumps": ["P1110"]}, {"id": "P1120", "text": ["Pressure in the other direction only forces the ball or cone tighter against the valve seat. Check valves of this type are popular as their operation is automatic and they can be mounted in any position..."], "jumps": []}, {"id": "P1110", "text": ["The most common check valve in use today is the ball or cone check valve. A spring holds the ball or cone against the valve seat. Enough pressure in one direction overcomes the spring tension and allows the fluid to flow..."], "jumps": []}, {"id": "P1100", "text": ["There are many types of check valves. The swing check valve is sometimes used but its operation depends upon gravity and can be mounted only in one position. The pressure of the fluid opens the valve in one direction but slams the flapper closed when pressure is applied from the other direction..."], "jumps": []}, {"id": "P1090", "text": ["As the direction of the pump handle changes to the downward stroke, valve number 1 closes due to the pressure created from compressing the air. When the pressure in the cylinder is greater than the pressure in the bicycle tire, valve number 2 opens and the air is pushed into the tire..."], "jumps": []}, {"id": "P1080", "text": ["As the pump is operated the vacuum generated by pulling the handle upward opens valve number 1 and allows air to flow into the cylinder. Valve number 2 is held closed by the vacuum or by the pressure on the valve from the bicycle tire..."], "jumps": []}, {"id": "P1070", "text": ["A standard bicycle tire pump uses two of the flapper type of check valves. The valves are made of rubber.", "The check valve is a valve that allows the liquid or gas to flow in one direction only. It works automatically as long as pressure is present. Flow in one direction is unhampered but flow in the other direction is blocked..."], "jumps": []}, {"id": "P1050", "text": ["The type of valve used is determined by the designer of the system. The operation of a valve may be automatically controlled by the pressure or the direction of the fluid flow or it may also be controlled by manual, electrical, mechanical, hydraulic, pneumatic methods, or any combination of the above..."], "jumps": []}, {"id": "P1040", "text": ["The fluid type, liquid or gas, usually dictates a valve's material and construction, but the basic function of the various valve types remains the same. With this lesson we'll discuss the common types of valves used in fluid power systems...."], "jumps": []}, {"id": "P1030", "text": ["Valves are used to control the pressure, direction, and flow of fluids in a hydraulic or pneumatic system."], "jumps": []}, {"id": "P1020", "text": ["Any fluid power system, such as brake system in a vehicle or a compressed air system used in a manufacturing plant relies on valves to provide control of the system."], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": ["P410"]}, {"id": "P410", "text": ["Let's begin the lesson on VALVES. TITLE..................................."], "jumps": ["P400"]}, {"id": "P400", "text": ["This lesson will acquaint you with the various valves used in hydraulic and pneumatic systems."], "jumps": ["P410", "P300"]}, {"id": "P300", "text": [], "jumps": []}, {"id": "P100", "text": ["1. Valvesive One Title Enter objective 1 line item 2 here. item 2 const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;

  stage.replaceChildren();

    p.className = "empty";

    stage.appendChild(p);

    stage.appendChild(p);

  if (page.jumps.length) {
