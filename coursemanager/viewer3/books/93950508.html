const book = {"title": "93950508", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: KARNAUGH MAPSf sdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe Karnaugh maps. w Develop a Karnaugh map for two, three and four variables.......", "w Simplify Boolean algebra equations and using Karnaugh maps."], "jumps": []}, {"id": "P400", "text": ["Karnaugh maps provide a systematic method for simplifying Boolean equations.", "WXYZ + WXYZ + WXYZ + WXYZ + WXYZ + WXYZ + WXYZ + WXYZ + WXYZ +WXYZ +WXYZ +"], "jumps": ["P410", "P100"]}, {"id": "P410", "text": ["Just think of trying to simplify this four variable eleven term equation using the properties, rules and theorems!"], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Simplifying using the properties, rules and theorems requires knowing them well and often requires cleverness."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["On the other hand, Karnaugh maps provide a cookbook approach for simplifying equations."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["In this lesson you will learn about KARNAUGH MAPS.INFINITY................"], "jumps": []}, {"id": "P900", "text": [], "jumps": ["P440"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The Karnaugh map is composed of an arrangement of adjacent cells."], "jumps": ["P1025", "P1001"]}, {"id": "P1025", "text": ["Each cell represents one particular combination of variables."], "jumps": ["P1030", "P1020"]}, {"id": "P1030", "text": ["In the case of two variables, four cells are required to produce the four combinations."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The combinations are XY, XY, XY and XY."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["To use the Karnaugh map, the terms are written outside the cells."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["The variables to the left of the cells applies to each cell in that row."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["The variables above the cells applies to each cell in that column."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["As you can see, each cell represents a combination of the two variables X,Y."], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["What is each block called in a Karnaugh map?", "What is each block called in a Karnaugh map?..............."], "jumps": ["P1050"]}, {"id": "P1091", "text": [], "jumps": []}, {"id": "P1092", "text": ["A term is a combination of variables such as XY, XY, XY or XY."], "jumps": []}, {"id": "P1093", "text": ["A variable is unknown such as W, X, Y or Z.", "A variable is unknown such as W, X, Y or Z................."], "jumps": []}, {"id": "P1100", "text": ["To use Karnaugh maps, the Boolean equation must be in the sum of products form."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["The equation XY + XY is in the sum of products form and can be placed in a Karnaugh map."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["Take the first term and place a 1 in the appropriate cell of the map.  A 1 goes into the XY cell, lower right hand corner.", "Take the first term and place a 1 in the appropriate cell of the map. A 1 goes into the XY cell, lower right hand corner."], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["Continue with the next term.  A 1 is placed in the XY cell, lower left hand corner.", "Continue with the next term. A 1 is placed in the XY cell, lower left hand corner."], "jumps": ["P1140", "P1100"]}, {"id": "P1140", "text": ["Since there are only two terms, the map is complete."], "jumps": ["P1150", "P1100"]}, {"id": "P1150", "text": ["Study this example.", "Study this example.text here..............................."], "jumps": ["P1160", "P1100"]}, {"id": "P1160", "text": ["Three terms and three 1's in the map."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["You can also use Karnaugh maps to go directly from a truth table."], "jumps": ["P1180", "P1150"]}, {"id": "P1180", "text": ["Take each F(X,Y) that results in 1 and place a 1 in the proper cell."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["The cells are labeled 0 and 1 with a X\\Y designation."], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["Now try filling in a Karnaugh map on your own.  Use paper and pencil to draw the map, and then fill it in.", "Now try filling in a Karnaugh map on your own. Use paper and pencil to draw the map, and then fill it in."], "jumps": ["P1210", "P1170"]}, {"id": "P1210", "text": ["Check your work.  It is important that you can fill in a Karnaugh map before attempting to simplify equations.", "Check your work. It is important that you can fill in a Karnaugh map before attempting to simplify equations."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["Which Karnaugh map represents XY + XY?", "Which Karnaugh map represents XY + XY??...................."], "jumps": ["P1200"]}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1222", "text": ["You picked a map that has a 1 in XY cell.  Notice that the equation XY + XY does not have an XY term.", "You picked a map that has a 1 in XY cell. Notice that the equation XY + XY does not have an XY term."], "jumps": []}, {"id": "P1223", "text": ["You picked a map that has a 1 in XY and XY cells.  Notice that the equation XY + XY does not have XY or XY terms.", "You picked a map that has a 1 in XY and XY cells. Notice that the equation XY + XY does not have XY or XY terms."], "jumps": []}, {"id": "P1230", "text": ["You know that the equations can contain more than two variables."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["Let's see how three and four variable Karnaugh maps are constructed."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["The three variable map uses two variables to form rows and one variable to form columns, eight cells."], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["Note, that the cells are arranged such that there is only a single variable change between rows."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["This is very important and must be done so that Boolean equations are simplified correctly!"], "jumps": ["P1280", "P1250"]}, {"id": "P1280", "text": ["Filling in the map uses the same procedure as a two variable map."], "jumps": ["P1290", "P1250"]}, {"id": "P1290", "text": ["Again, you can develop a Karnaugh map directly from a truth table."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["Now, try filling in a Karnaugh map on your own.  Use paper and pencil to draw the map, and then fill it in.", "Now, try filling in a Karnaugh map on your own. Use paper and pencil to draw the map, and then fill it in."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["Check your work."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["The four variable map uses two variables to form rows and two variables to form columns, sixteen cells."], "jumps": ["P1330", "P1300"]}, {"id": "P1330", "text": ["Note, that the cells are arranged such that there is only a single variable change between rows and columns."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["Again, this is very important and must be done so that Boolean equations are simplified correctly!"], "jumps": ["P1350", "P1320"]}, {"id": "P1350", "text": ["Filling in the map uses the same procedure as a two or three variable map."], "jumps": ["P1360", "P1320"]}, {"id": "P1360", "text": ["Again, you can develop a Karnaugh map directly from a truth table."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["Now, try filling in a Karnaugh map on your own.  Use paper and pencil to draw the map, and then fill it in.", "Now, try filling in a Karnaugh map on your own. Use paper and pencil to draw the map, and then fill it in."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["Check your work."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["Try this one going from a truth table to a Karnaugh map on your own."], "jumps": ["P1400", "P1370"]}, {"id": "P1400", "text": ["Check your work."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["Which Karnaugh map represents the Boolean equation XYZ + XYZ?"], "jumps": ["P1390"]}, {"id": "P1411", "text": [], "jumps": []}, {"id": "P1412", "text": ["The map you picked has a 1 in each combination that is not in the equation XYZ + XYZ."], "jumps": []}, {"id": "P1413", "text": ["The map you picked has a 1 in the terms XYZ and XYZ.  These terms are not part of the equation XYZ + XYZ.", "The map you picked has a 1 in the terms XYZ and XYZ. These terms are not part of the equation XYZ + XYZ."], "jumps": []}, {"id": "P1420", "text": ["Which equation produces the Karnaugh map shown?", "Which equation produces the Karnaugh map shown?............"], "jumps": ["P1410"]}, {"id": "P1421", "text": [], "jumps": []}, {"id": "P1422", "text": ["You picked WXYZ + WXYZ + WXYZ + WXYZ.  Notice that the WXYZ cell does not contain a 1 and should not be in the equation.", "You picked WXYZ + WXYZ + WXYZ + WXYZ. Notice that the WXYZ cell does not contain a 1 and should not be in the equation."], "jumps": []}, {"id": "P1423", "text": ["You picked WXYZ + WXYZ + WXYZ + WXYZ.  Notice that the WXYZ cell does not contain a 1 and should not be in the equation.", "You picked WXYZ + WXYZ + WXYZ + WXYZ. Notice that the WXYZ cell does not contain a 1 and should not be in the equation."], "jumps": []}, {"id": "P1430", "text": ["Finally, five and six variable Karnaugh maps are possible, but awkward to use. More than seven variable maps must be done by a computer."], "jumps": ["P1910", "P1420"]}, {"id": "P1699", "text": ["The following 10 questions give you practice developing karnaugh maps from Boolean equations and truth tables.  Solve each problem on paper before selecting or entering an answer.", "The following 10 questions give you practice developing karnaugh maps from Boolean equations and truth tables. Solve each problem on paper before selecting or entering an answer."], "jumps": ["P1700", "P1001"]}, {"id": "P1700", "text": ["1.  Which Karnaugh map represents the equation XY + XY?", "1. Which Karnaugh map represents the equation XY + XY?...."], "jumps": []}, {"id": "P1710", "text": ["2.  Which Karnaugh map represents the equation XY + XY?", "2. Which Karnaugh map represents the equation XY + XY?...."], "jumps": []}, {"id": "P1720", "text": ["3.  Which Karnaugh map represents the truth table shown                   below?", "3. Which Karnaugh map represents the truth table shown below?"], "jumps": []}, {"id": "P1730", "text": ["4.  Which Karnaugh map represents the equation XYZ + XYZ +            XYZ + XYZ?", "4. Which Karnaugh map represents the equation XYZ + XYZ + XYZ + XYZ?"], "jumps": []}, {"id": "P1740", "text": ["5.  Which Karnaugh map represents the equation XYZ + XYZ +            XYZ + XYZ?", "5. Which Karnaugh map represents the equation XYZ + XYZ + XYZ + XYZ??"], "jumps": []}, {"id": "P1750", "text": ["6.  Which Karnaugh map represents the truth table shown                   below?", "6. Which Karnaugh map represents the truth table shown below?"], "jumps": []}, {"id": "P1760", "text": ["7.  Which equation is shown in the Karnaugh map?", "7. Which equation is shown in the Karnaugh map?..........."], "jumps": []}, {"id": "P1770", "text": ["8.  Which equation is shown in the Karnaugh map?", "8. Which equation is shown in the Karnaugh map?..........."], "jumps": []}, {"id": "P1780", "text": ["9.  Which equation is shown in the Karnaugh map?", "9. Which equation is shown in the Karnaugh map?..........."], "jumps": []}, {"id": "P1790", "text": ["10.  Which equation is shown in the Karnaugh map?", "10. Which equation is shown in the Karnaugh map?.........."], "jumps": []}, {"id": "P1799", "text": ["You have completed the Drill and Practice.  You are about to return to the objective menu.", "You have completed the Drill and Practice. You are about to return to the objective menu."], "jumps": ["P1001", "P1790"]}, {"id": "P1800", "text": [], "jumps": []}, {"id": "P1801", "text": [], "jumps": []}, {"id": "P1910", "text": ["You have completed the information on Developing Karnaugh Maps."], "jumps": ["P1001", "P1430"]}, {"id": "P1920", "text": ["1.  The Karnaugh map is composed of an arrangement of                      adjacent cells.", "1. The Karnaugh map is composed of an arrangement of adjacent cells."], "jumps": ["P1930", "P1910"]}, {"id": "P1930", "text": ["2.  Each cell represents one particular combination of the                     variables.", "2. Each cell represents one particular combination of the variables.."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  For two variables, a 1 is placed into the proper cell for each            term.", "3. For two variables, a 1 is placed into the proper cell for each term.."], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["4.  For three variables, a 1 is placed into the proper cell for each         term.", "4. For three variables, a 1 is placed into the proper cell for each term."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  For four variables, a 1 is placed into the proper cell for each           term.", "5. For four variables, a 1 is placed into the proper cell for each term."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  It is important that from one row to another and from one                column to another that only one variable is changed.", "6. It is important that from one row to another and from one column to another that only one variable is changed."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7.  Karnaugh maps can also be constructed directly from truth           tables.", "7. Karnaugh maps can also be constructed directly from truth tables.."], "jumps": ["P1999", "P1970"]}, {"id": "P1999", "text": ["You are about to return to the objective menu.", "You are about to return to the objective menu.ut to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["Once a Boolean equation is mapped, it can be simplified.", "Once a Boolean equation is mapped, it can be simplified. APHICS TEXT: WXYZ + WXYZ + WXYZ + WXYZ + WXYZ + WXYZ + WXYZ + WXYZ + WXYZ + WXYZ + WXYZ", "WXYZ + WXYZ + WXYZ + WXYZ + WXYZ + WXYZ + WXYZ + WXYZ + WXYZ +WXYZ +WXYZ +"], "jumps": ["P2025", "P2001"]}, {"id": "P2025", "text": ["The process has five steps."], "jumps": ["P2030", "P2020"]}, {"id": "P2030", "text": ["Step 1  \nUse adjacent cells,  adjacent cells differ by only a single variable.", "Step 1 Use adjacent cells, adjacent cells differ by only a single variable."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["Adjacent cells are not diagonal."], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["Step 2\nThe 1's in adjacent cells are combined in groups of 1, 2, 4, 8, 16, etc.", "Step 2 The 1's in adjacent cells are combined in groups of 1, 2, 4, 8, 16, etc..."], "jumps": ["P2060", "P2030"]}, {"id": "P2060", "text": ["Step 3\nEach group of 1's is maximized to include the largest number of adjacent cells.", "Step 3 Each group of 1's is maximized to include the largest number of adjacent cells."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["Step 4\nEvery 1 on the map must be in a group of 1, 2, 4, 8, 16, etc.  Overlapping groups are OK.", "Step 4 Every 1 on the map must be in a group of 1, 2, 4, 8, 16, etc. Overlapping groups are OK."], "jumps": ["P2080", "P2050"]}, {"id": "P2080", "text": ["Step 5\nEach group represents a simplified product by eliminating opposite terms in each group and then the products are summed.", "Step 5 Each group represents a simplified product by eliminating opposite terms in each group and then the products are summed. TEXT: WXYZ + WXYZ + WXYZ + WXYZ = WXZ + XYZ + WXYZ (YY) (WW)", "WXYZ + WXYZ + WXYZ + WXYZ = WXZ + XYZ + WXYZ (YY) (WW)))"], "jumps": ["P2090", "P2050"]}, {"id": "P2090", "text": ["Which of the below maps used grouping adjacent cells correctly?"], "jumps": []}, {"id": "P2091", "text": [], "jumps": []}, {"id": "P2092", "text": ["The grouping you picked is diagonal.  Adjacent cells are not diagonal.", "The grouping you picked is diagonal. Adjacent cells are not diagonal."], "jumps": []}, {"id": "P2093", "text": ["The grouping you picked has three 1's.  Remember, the grouping must contain 1, 2, 4, 8, 16, etc.", "The grouping you picked has three 1's. Remember, the grouping must contain 1, 2, 4, 8, 16, etc."], "jumps": []}, {"id": "P2100", "text": ["Now, let's simplify using Karnaugh maps.", "Now, let's simplify using Karnaugh maps...................."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["There is one group of adjacent 1's.  The grouping is maximized and all 1's are in a group.", "There is one group of adjacent 1's. The grouping is maximized and all 1's are in a group."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["Simplifying Y is eliminated because both Y and Y variables are in the group."], "jumps": ["P2130", "P2100"]}, {"id": "P2130", "text": ["Only X remains because X is not in the group."], "jumps": ["P2140"]}, {"id": "P2140", "text": ["So, the Karnaugh map simplified the XY + XY equation to X."], "jumps": ["P2150", "P2100"]}, {"id": "P2150", "text": ["Using the properties, rules, and theorems proves the Karnaugh map process."], "jumps": ["P2160", "P2100"]}, {"id": "P2160", "text": ["Look at this example.", "Look at this example.xt here..............................."], "jumps": ["P2170", "P2100"]}, {"id": "P2170", "text": ["One group with X, X and Y.  The X variable is eliminated leaving only Y.", "One group with X, X and Y. The X variable is eliminated leaving only Y..."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["This example has two groups.  X is eliminated from one and Y is eliminated from the other.", "This example has two groups. X is eliminated from one and Y is eliminated from the other.", "1. XY + XY + XY 2. X(Y + Y) + XY 3. X(1) +XY 4. X + XY 5. X + Y"], "jumps": ["P2190", "P2160"]}, {"id": "P2190", "text": ["The result is two terms, one for each group, that are summed."], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["Try these two on your own.  Using pencil and paper, group the terms and find the simplified equation.", "Try these two on your own. Using pencil and paper, group the terms and find the simplified equation."], "jumps": ["P2210", "P2180", "P2205"]}, {"id": "P2205", "text": ["Step 1: Use adjacent cells,adjacent cells differ by only a single variable. Step 2: The 1's in adjacent cells are combined in groups of 1, 2, 4, 8, 16, ect. Step 3: Each group of 1's is maximized to include the largest number of adjacent cells. Step 4: Every 1 on the map must be in a group of 1, 2, 4, 8, 16, ect. Overlapping groups is OK. Step 5: Each group represents a simplified product eliminating opposite terms and then the products are summed.."], "jumps": []}, {"id": "P2210", "text": ["Check your work.  Notice that with one 1, there is no simplification.", "Check your work. Notice that with one 1, there is no simplification."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["What is the result of simplifying this Karnaugh map?", "What is the result of simplifying this Karnaugh map?......."], "jumps": ["P2200", "P2225"]}, {"id": "P2221", "text": [], "jumps": []}, {"id": "P2222", "text": ["Y is the term for the group in the Y column, XY/XY.  But, there are two groups in the Karnaugh map.", "Y is the term for the group in the Y column, XY/XY. But, there are two groups in the Karnaugh map."], "jumps": []}, {"id": "P2223", "text": ["X is the term for the group in the X row, XY/XY.   But, there are two groups in the Karnaugh map.", "X is the term for the group in the X row, XY/XY. But, there are two groups in the Karnaugh map."], "jumps": []}, {"id": "P2225", "text": ["SIMPLIFYING USING KARNAUGH MAPS", "Step 1: Use adjacent cells,adjacent cells differ by only a single variable. Step 2: The 1's in adjacent cells are combined in groups of 1, 2, 4, 8, 16, ect. Step 3: Each group of 1's is maximized to include the largest number of adjacent cells. Step 4: Every 1 on the map must be in a group of 1, 2, 4, 8, 16, ect. Overlapping groups is OK. Step 5: Each group represents a simplified product eliminating opposite terms and then the products are summed.."], "jumps": []}, {"id": "P2230", "text": ["Look at this three variable Karnaugh map.", "Look at this three variable Karnaugh map. APHICS TEXT: XYZ + XYZ + XYZ + XYZ + XYZ Y + XZ"], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["The group of two 1's is just like before, the Y and Y terms cancel leaving XZ."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["The group of four 1's appears different, but it's not."], "jumps": ["P2260", "P2230"]}, {"id": "P2260", "text": ["Remember, adjacent cells are different by only one variable,\n and the top and bottom rows meet that requirement.", "Remember, adjacent cells are different by only one variable, and the top and bottom rows meet that requirement."], "jumps": ["P2270", "P2230"]}, {"id": "P2270", "text": ["In the four cell group, the Z and X variables cancel."], "jumps": ["P2280", "P2230"]}, {"id": "P2280", "text": ["Look at this four term map.", "Look at this four term map.e..............................."], "jumps": ["P2290", "P2230"]}, {"id": "P2290", "text": ["The group of 8 is formed because the difference between YZ and YZ is only one term."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["The result of the group of 8 is that the W, X, and Y terms cancel."], "jumps": ["P2310", "P2280"]}, {"id": "P2310", "text": ["Notice the group of 4.  It can not use the 1's in the YZ column because that would give a group of 6.", "Notice the group of 4. It can not use the 1's in the YZ column because that would give a group of 6."], "jumps": ["P2320", "P2280"]}, {"id": "P2320", "text": ["Also note that making a grouping of 8, 4 and 2 is not maximizing the process."], "jumps": ["P2330", "P2280"]}, {"id": "P2330", "text": ["To maximize the process, place all 1's in as few groups as possible.", "To maximize the process, place all 1's in as few groups as possible.."], "jumps": ["P2340", "P2280"]}, {"id": "P2340", "text": ["Finally, look at this four variable map.", "Finally, look at this four variable map...................."], "jumps": ["P2350", "P2280"]}, {"id": "P2350", "text": ["The corners form one group of 4."], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["Notice that there is only one variable difference between the row and column variables in the corners."], "jumps": ["P2370", "P2340"]}, {"id": "P2370", "text": ["Try simplifying the equations for these two Karnaugh maps on your own.  Use pencil and paper.", "Try simplifying the equations for these two Karnaugh maps on your own. Use pencil and let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
