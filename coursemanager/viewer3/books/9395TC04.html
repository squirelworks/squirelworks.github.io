const book = {"title": "9395TC04", "pages": [{"id": "PQINFO", "text": ["Page # Test# Question# HelpPage # 10210 1 110 1030 10211 1 111 1030 10212 1 112 1040 10213 1 113 1050 10214 1 114 1070 10215 1 115 1100 10216 1 116 1120 10217 1 117 1130 10218 1 118 1210 10219 1 119 1320 10220 2 120 2030 10221 2 121 2130 10222 2 122 2200 10223 2 123 2250 10224 2 124 2260 10225 2 125 2060 10226 2 126 2450 10227 2 127 2520 10228 2 128 2640 10229 2 129 2590 10230 3 130 3040 10231 3 131 3120 10232 3 132 3110 10233 3 133 3220 10234 3 134 3310 10235 3 135 3320 10236 3 136 3340 10237 3 137 3510 10238 3 138 3530 10239 3 139 3330", "Page # Test# Question# HelpPage # 10210 1 110 1030 10211 1 111 1030 10212 1 112 1040 10213 1 113 1050 10214 1 114 1070 10215 1 115 1100 10216 1 116 1120 10217 1 117 1130 10218 1 118 1210 10219 1 119 1320 10220 2 120 2030 10221 2 121 2130 10222 2 122 2200 10223 2 123 2250 10224 2 124 2260 10225 2 125 2060 10226 2 126 2450 10227 2 127 2520 10228 2 128 2640 10229 2 129 2590 10230 3 130 3040 10231 3 131 3120 10232 3 132 3110 10233 3 133 3220 10234 3 134 3310 10235 3 135 3320 10236 3 136 3340 10237 3 137 3510 10238 3 138 3530 10239 3 139 3330 10240 10241 10242 10243 10244 10245 10246 10247 10248 10249"], "jumps": []}, {"id": "PINFO", "text": ["04-05-04 Converted from sty to tbk and branched lesson. frieda 04-13-04 Completed graphics and animations. -Sarah. 04-13-04 Completed graphics and animations on pages 1080, 1120, 2190, 2200, 2210, 2220, 2530, -YuChi. 04-13-04 Completed graphics and animations on pages 2400, 2433, 2540, 2563, -James. 04-14-04 Changed animations on P2140, P2150, P2210, P2220. Changed graphics on P2360, 2540, 2590, as per Dave. -Sarah. 05-04-04 Changed lesson title from Hydraulic and Pneumatic Systems to Hydraulic and Pneumatic Pumps. -Penny 05-18-04 Made Dave's changes. -Penny"], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10229", "text": ["Extreme pneumatic pump belt wear is caused by _______"], "jumps": []}, {"id": "P10228", "text": ["Which of the following can cause pneumatic pump overheating? ="], "jumps": []}, {"id": "P10227", "text": ["Pneumatic pump stalls can be caused by _____"], "jumps": []}, {"id": "P10226", "text": ["Which of the following cannot cause excessive oil in the output of a pneumatic system? a"], "jumps": []}, {"id": "P10225", "text": ["Hydraulic fluid and air compress equally well.", "Pneumatic pumps have a separate oil reservoir.", "Hydraulic pumps use hydraulic fluid for cooling and lubrication.", "Hydraulic pumps run continuously and pneumatic pumps are started and stopped as needed."], "jumps": []}, {"id": "P10224", "text": ["Which of the following will not cause low output pressure? 9"], "jumps": []}, {"id": "P10223", "text": ["What are the two biggest reasons for pneumatic pump failures?"], "jumps": []}, {"id": "P10222", "text": ["a single cylinder pump that pumps air in both directions of the piston", "a multi-cylinder pump with the cylinders in series", "a multi-cylinder pump with the cylinders in parallel"], "jumps": []}, {"id": "P10221", "text": ["What is the popular type of reciprocating pump used in pneumatic systems?"], "jumps": []}, {"id": "P10220", "text": ["What type of positive displacement pump is used in most pneumatic systems? +"], "jumps": []}, {"id": "P10219", "text": ["What should be done first when a running hydraulic pump loses its prime? _"], "jumps": []}, {"id": "P10218", "text": ["Which of the following will NOT cause reduced pump action in a hydraulic system?"], "jumps": []}, {"id": "P10217", "text": ["Which rotary positive displacement pump has the shortest life expectancy?"], "jumps": []}, {"id": "P10216", "text": ["Which positive displacement pump has the best self priming action? +"], "jumps": []}, {"id": "P10215", "text": ["Which pump provides the longest life in a typical hydraulic system?"], "jumps": []}, {"id": "P10214", "text": [], "jumps": []}, {"id": "P10213", "text": ["What is the purpose of the pressure release valve in a hydraulic system? a"], "jumps": []}, {"id": "P10212", "text": ["What does the fluid provide to the rotary pump in a hydraulic system?"], "jumps": []}, {"id": "P10211", "text": ["What type of positive displacement pump is used in most hydraulic systems? +"], "jumps": []}, {"id": "P10210", "text": ["What is a major benefit of positive displacement pumps?"], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001"]}, {"id": "P2940", "text": ["3. Most pneumatic pump failures are due to neglect or poor maintenance but are usually easy to diagnose and repair.."], "jumps": []}, {"id": "P2930", "text": ["2. There are three primary types of piston pumps, the single- action, dual-action, and the multiple stage pump with two or more pump stages.."], "jumps": []}, {"id": "P2920", "text": ["1. Pneumatic systems, for the most part, use piston pumps to supply pressure."], "jumps": ["P2001", "P2930"]}, {"id": "P2910", "text": ["This completes the information on PUMPS USED IN PNEUMATIC SYSTEMS."], "jumps": ["P2660", "P2001"]}, {"id": "P2660", "text": ["Here are other causes for pump overheating previously discussed: Low compression Clogged air filter Air leaks Loose drive belt Low oil in the crankcase"], "jumps": []}, {"id": "P2650", "text": ["Dirty pump casing or cooling fins also develops over time as the equipment gathers dust. Eventually the heat exchange function of the cooling fins or pump casing are compromised allowing the heat to gradually build..d..."], "jumps": []}, {"id": "P2640", "text": ["Poor ventilation usually develops over time as the space around the equipment is used for storage or installation of other equipment. Rearranging the area around the equipment may fix the problem..."], "jumps": []}, {"id": "P2630", "text": ["Overheating can shorten the equipment life. The two most obvious indicators of overheating are discharge air at the point of use being above the ambient temperature and a \"hot\" smell coming from the motor and pump equipment..."], "jumps": []}, {"id": "P2620", "text": ["6. Overheated pump during operation can be caused by the following: n Dirty pump casing or cooling fins Any previous symptom causing prolonged running"], "jumps": []}, {"id": "P2600", "text": ["Belts too tight can fray and put undue wear on bearings and seals. Loose belts can slip causing poor system performance. Adjust the drive belt tension as specified by the manufacturer.djust the drive belt tension as specified by the manufacturer..."], "jumps": []}, {"id": "P2590", "text": ["Pulleys may fall out of alignment when the system is being serviced. They may also become loose and \"walk\" on the motor or pump shaft pulling out the pulley alignment.motor or pump shaft pulling out the pulley alignment..."], "jumps": []}, {"id": "P2580", "text": ["Damage to pulleys could cause them to be gouged, bent, or flattened. Watch the belt action on the pulleys, it should be smooth with little lateral or vertical movement. If the belt wobbles or jumps during rotation, inspect and repair or replace the belt and/or the pulleys...pair or replace the pulley(s)..."], "jumps": []}, {"id": "P2570", "text": ["Extreme drive belt wear can be due to the following problems: : maged pulley(s) Pulleys out of alignment Drive belt too tight or too loose"], "jumps": []}, {"id": "P2563", "text": ["Loose pump mounts causes noise but not stalls.............."], "jumps": []}, {"id": "P2562", "text": ["Worn piston rings allows oil to seep past into the cylinder or lowers the pressure output of the pump. Worn rings will not stall the pump."], "jumps": []}, {"id": "P2561", "text": [], "jumps": []}, {"id": "P2560", "text": ["Which of the following can stall a pump in a pneumatic system?"], "jumps": ["P2550"]}, {"id": "P2553", "text": ["Oil that has too low a viscosity may seep by the piston rings and into the cylinder."], "jumps": []}, {"id": "P2552", "text": ["Worn piston rings allows oil to seep past into the cylinder."], "jumps": []}, {"id": "P2551", "text": [], "jumps": []}, {"id": "P2550", "text": ["Which of the following will not cause excessive oil in the discharge?"], "jumps": ["P2540"]}, {"id": "P2540", "text": ["Electrically check the motor for proper supply voltage. Replace or repair the motor as needed.voltage. Replace or repair the motor as needed."], "jumps": []}, {"id": "P2530", "text": ["A check valve at the discharge stuck in the closed position does not allow air flow and can stall the pump. Rapping on the valve may free it temporarily but it will likely stick again. Check valves at discharge ports function with each pressure output pulse from the pump...pressure output pulse from the pump."], "jumps": []}, {"id": "P2520", "text": ["The wrong lubricant, or lubricant of the wrong viscosity, can also cause binding and seizure of internal components. It may again be necessary to replace a seized bearing or piston ring, and/or cylinder. Fill the crankcase with the proper lubricant according to the manufacturer and watch the system.he manufacturer and watch the system....."], "jumps": []}, {"id": "P2510", "text": ["Low crankcase oil causes poor lubrication which could lead to binding or seizure of internal components. It may be necessary to replace a seized bearing or piston ring, and/or cylinder. Replace the oil and monitor the system. cylinder. Replace the oil and monitor the system..."], "jumps": []}, {"id": "P2500", "text": ["A pneumatic system pump that stalls can have any of the following problems: : Low oil level in the crankcase. Improper lubricant Bad check valve Motor failure or overloaded."], "jumps": []}, {"id": "P2490", "text": ["Oil of too low a viscosity could move past the piston rings and into the cylinder. Oil of too high a viscosity reduces the lubrication, increasing the wear, and could cause the piston rings to prematurely fail..tion, increasing the wear, and could cause the piston rings to prematurely fail..."], "jumps": []}, {"id": "P2480", "text": ["As the piston moves downward in the cylinder a slight amount of pressure is created in the crankcase as the crankcase volume is decreasing. Too much oil in the crankcase causes undue pressure as the oil will not compress equally to the air. The oil must go somewhere, and into the cylinder is the only available path..he air. The oil must go somewhere, and into the cylinder is the only available path....."], "jumps": []}, {"id": "P2460", "text": ["Excessive oil in discharge or excessive oil usage could be due to worn piston rings. During the intake stroke oil is drawn up into the cylinder and then blown out with the discharged air. Replace the rings according to the manufacturers recommendations, most have preset intervals for ring replacement based on the accumulated pump run time......he accumulated pump run time.me.."], "jumps": []}, {"id": "P2450", "text": ["The air filter eventually clogs, reducing the amount of air drawn in during the suction stroke. This increases the pump internal vacuum and could allow oil to be sucked past the piston rings and into the cylinder. This action increases oil usage and causes the oil to be discharged on the compression stroke. oil usage and causes the oil to be discharged on the compression stroke....."], "jumps": []}, {"id": "P2440", "text": ["Here are the reasons for excessive oil in the discharge or excessive oil usage: Clogged air filter. Worn piston rings. Excessive oil in the crankcase. Wrong lubricant viscosity.ity."], "jumps": ["P2430"]}, {"id": "P2433", "text": ["Loose pump mounting can cause vibration and bounce........."], "jumps": []}, {"id": "P2432", "text": ["Low oil in the crankcase allows bearings to run dry, making noise and causing undue wear."], "jumps": []}, {"id": "P2431", "text": [], "jumps": []}, {"id": "P2430", "text": ["Which of the following will NOT cause pump noise?.........."], "jumps": ["P2420"]}, {"id": "P2424", "text": ["Glazed V-belts allow slippage on the pulley and could cause low pressure output as maximum rotational speed is not reached."], "jumps": []}, {"id": "P2423", "text": ["Worn piston rings allow pressure to escape past them and into the crankcase."], "jumps": []}, {"id": "P2422", "text": ["A clogged air filter strangles the system by restricting the air intake, thus reducing the pump output."], "jumps": []}, {"id": "P2421", "text": [], "jumps": []}, {"id": "P2420", "text": ["Which of the following will NOT cause the symptom of low pressure discharge output in a pneumatic system?"], "jumps": ["P2410"]}, {"id": "P2410", "text": ["A check valve at the discharge port could become noisy with time requiring replacement."], "jumps": []}, {"id": "P2400", "text": ["Should the mounting bolts for the pump become loose the pump could bounce on the frame at each compression stroke as additional torque is applied to the drive belt causing vibration and noise. Tighten the mounting bolts to correct the problem..."], "jumps": []}, {"id": "P2390", "text": ["There are three bearings in the typical pneumatic pump, any of which will become noisy when worn. Replacement of the defective bearings is the only fix for the problem. Defective wrist pin bearings or rod bearings make a \"knocking\" sound, 2 per revolution. Defective main bearings \"knock\" once at each revolution......on.ce at each revolution.on....."], "jumps": []}, {"id": "P2380", "text": ["Noise caused by low oil in the crankcase is an indication that moving parts are working without lubrication, a situation that will cause permanent damage. Check the oil at intervals recommended by the manufacturer. Use only the recommended lubricant...c"], "jumps": []}, {"id": "P2370", "text": ["Low oil in a pump crankcase can cause enough damage to require a full rebuild of the pump. Since the fluid medium in a pneumatic system is a gas, the crankcase oil provides lubrication to all internal moving parts..."], "jumps": ["P2350", "P2380"]}, {"id": "P2360", "text": ["A loose pulley can rotate on the shaft against the keeper or set screw causing a \"banging\" on the compression stroke. Tightening the set screw will usually correct the problem if caught early. Damage to the pulley or the pump shaft can result if repairs are postponed..."], "jumps": []}, {"id": "P2350", "text": ["Noisy operation has several causes: ose pulley. Low oil in the crankcase. Worn bearings. Loose pump mounting. Noisy check valve..ng. Noisy check valve..ve."], "jumps": []}, {"id": "P2340", "text": ["The piston rings are also a cause of low compression. Air will slip past the ring during the compression stroke into the crankcase, preventing maximum pressure build up. Replacement of the rings is usually all that is required, but be sure to follow the manufacturer's recommendations..."], "jumps": []}, {"id": "P2330", "text": ["One cause for low compression is a bad valve. A defective valve will prevent the pressure from building as it will constantly leak. A tear down and rebuild is required. The valves are usually easy to replace as most manufactures recommend replacement at preset times to ensure optimum performance..."], "jumps": []}, {"id": "P2320", "text": ["A pump with low compression will run longer than usual before shutting off, or run continuously, never shutting off as pressure does not reach the shut off point. Low compression is rarely something that happens quickly. As the moving parts begin to wear the efficiency of the pump slowly diminishes until the pump is no longer capable of producing adequate pressure....."], "jumps": []}, {"id": "P2310", "text": ["Low discharge output pressure can be caused by low compression. When everything else checks OK, low compression must be considered. If the pump has been neglected, or has been in service for a long time, it's probably time for a pump tear down and rebuild......"], "jumps": []}, {"id": "P2300", "text": ["Low discharge output pressure can also be causd by air intake restrictions. Remove the air filter and check for restored performance. Replace the air filter if performance improves."], "jumps": []}, {"id": "P2290", "text": ["Many medium to large pneumatic systems use V-belts between the motor and the pump. Check the belt for a glazed, worn, or frayed condition. Replace the belt or readjust the belt according to the manufacture's recommendations.adjust the belt according to the manufacture's recommendations..s..."], "jumps": []}, {"id": "P2280", "text": ["Low discharge output pressure can cause discharge leaks or obstructions. Listen and look for air leaks or physical damage in the discharge plumbing. Review any recent repairs to the system in search of obstructions. Check any hoses for kinks, sharp bends, and cuts. Look for blown gaskets."], "jumps": []}, {"id": "P2270", "text": ["Excessive air demand can be caused by too many tools in use at the same time. Review the usage to determine if the system is still capable of handling the air volume and pressure demand. A larger system may be required.uired.. larger system may be required.ed..."], "jumps": []}, {"id": "P2260", "text": ["Low pressure at the discharge outlet can have several different causes: can have several different causes: xcessive air demand Discharge leaks or obstructionsLoose, worn, or slipping belt (if equipped) Air intake restriction Low compressionnnnn"], "jumps": []}, {"id": "P2250", "text": ["Regardless of the type of pneumatic piston pump used (single-action, dual-action, multiple stage, etc); pump problems are easy to diagnose and repair. Most are due to neglect or poor maintenance. Common pneumatic piston pump problems are: ow discharge output pressure 2. Noisy pump operation 3. Excessive oil in the discharge or excessive oil usage 4. Pump stalls 5. Extreme drive belt wear 6. Pump overheatsss"], "jumps": ["P2240"]}, {"id": "P2242", "text": ["Compare the double-action pump to the dual stage pump and notice the differences..."], "jumps": []}, {"id": "P2241", "text": [], "jumps": []}, {"id": "P2240", "text": ["A dual-action pump compresses in both directions of piston movement and a dual stage pump has two cylinders.", "A dual-action pump produces more volume and a dual stage pump produces more pressure.", "A dual action pump has two cylinders and a dual stage pump compresses in both directions of piston movement.", "What is the difference between a dual-action pump and a dual stage pump?"], "jumps": ["P2230"]}, {"id": "P2233", "text": ["Air does not thicken or thin when compressed..............."], "jumps": []}, {"id": "P2232", "text": ["The compressed air does not perform work until it expands in an actuator, air motor, or other device."], "jumps": []}, {"id": "P2231", "text": [], "jumps": []}, {"id": "P2230", "text": ["What happens to the air in the cylinder when it is compressed?"], "jumps": ["P2220"]}, {"id": "P2220", "text": ["Large industrial applications may cascade several stages and may also liquid cool the assembly to absorb heat. It is also common for the subsequent stage(s) to be physically smaller than the first stage..."], "jumps": []}, {"id": "P2210", "text": ["You'll note the compressed heated air from the first stage is also the suction air for the second stage. To keep the temperature of the air at a reasonable level the air is cooled using a long inner-connecting line with cooling fins..."], "jumps": []}, {"id": "P2200", "text": ["Pump cylinders are also cascaded, or placed in series, when constant high pressure requirements are more important than flow volume. In a multiple stage cascade pump the discharge of the first cylinder is connected to the suction of the next cylinder in line. The final stage in line is the pump discharge..."], "jumps": []}, {"id": "P2190", "text": ["An alternative to the double-action pump is the dual stage pump using two cylinders with common suction and discharge ports. Using a double-action or dual stage pump increases the amount of airflow available, measured in cubic feet per minute, CFM..."], "jumps": []}, {"id": "P2180", "text": ["Double-action pumps can pump twice as much air as single-action pumps. Double-action pumps are always single cylinder pumps. They require extra linkages to ensure the piston rod is kept in exact position throughout travel to ensure adequate sealing around the piston rod..."], "jumps": []}, {"id": "P2170", "text": ["A double-action pump is drawing in air and compressing/discharging air almost throughout the reciprocating process. Only at the extreme ends of piston travel does airflow cease. The pump uses two suction and two discharge valves. Their action alternates with the piston travel..."], "jumps": []}, {"id": "P2160", "text": ["The action of compressing the air causes the air to heat up. Cooling fins are usually on the outside of the cylinder to help dissipate the heat. The technician troubleshooting the system should be aware a burn hazard is present and plan accordingly.y."], "jumps": []}, {"id": "P2150", "text": ["After the piston bottoms out in the cylinder it begins the upstroke. The air is compressed as the volume gets smaller. When the pressure inside the cylinder exceeds the pressure at the other side of the discharge valve, the discharge valve opens and the air is pressed out of the cylinder and into the pneumatic system....."], "jumps": []}, {"id": "P2140", "text": ["The single-action piston pump most resembles the piston and cylinder in a car, motorcycle, or lawnmower engine. During the down stroke the vacuum created by the expanding volume opens the suction valve, allowing air into the cylinder as the pressure equalizes.."], "jumps": []}, {"id": "P2130", "text": ["The piston pump is the standard pump used in pneumatic systems. Piston pumps may be single-action, double-action, or multi-stage with two or more cylinders."], "jumps": []}, {"id": "P2120", "text": ["The piston pump used on an air compressor relies on the reciprocating, or back and forth, motion of a piston to pressurize the gas.", "Throughout this lesson air will be used as the fluid medium in pneumatic systems. While used in most cases, air is not the only fluid medium used in pneumatic systems. In industrial applications with possible fire hazards nitrogen is sometimes used to decrease the fire hazard...."], "jumps": []}, {"id": "P2100", "text": ["There are several different types of pumps used in pneumatic systems. The piston pump is used in most applications. The piston pump, motor, receiver (storage tank) and pressure switch make up an assembly commonly known as the air compressor..."], "jumps": ["P2090"]}, {"id": "P2092", "text": ["Gasses can be compressed; therefore, the pump in a pneumatic system is switched as needed by the pressure switch."], "jumps": []}, {"id": "P2091", "text": [], "jumps": []}, {"id": "P2090", "text": ["In hydraulic systems the pump is switched as system pressure is needed and in pneumatic systems the pump runs continuously.", "In hydraulic systems the pump runs continuously and in pneumatic systems the pump is switched as system pressure is needed.", "In hydraulic and pneumatic systems the pumps are switched as system pressure is needed.", "In hydraulic and pneumatic systems the pump runs continuously.", "What effect does the fluid medium have on typical hydraulic and pneumatic systems?", "Gases, though, can be compressed. The pressure is maintained in the system by the storage tank, or receiver, and the expansion of the gas as it flows provides the energy for the system. The pump in a pneumatic system is started and stopped as needed by a pressure switch..."], "jumps": ["P2080"]}, {"id": "P2070", "text": ["In the typical application the hydraulic system the pump runs continuously with a bypass relief valve maintaining fluid flow through the pump when the pressure is not used by an actuator in the system. The liquid cannot be compressed and the system pressure must come from the pump...", "The use of a gas as the fluid medium also changes the overall design of a pneumatic system as compared to a hydraulic system. Both systems must sustain pressure but the compressibility of the medium changes the way each system operates..."], "jumps": []}, {"id": "P2050", "text": ["The use of a gas as the fluid medium prohibits the pump lubrication and cooling action provided by the fluid in a hydraulic system. This greatly changes the demands and design of the pump used..."], "jumps": []}, {"id": "P2040", "text": ["Reciprocating pumps are preferred over rotary pumps in pneumatic systems as they produce higher pressures using a gas, usually air, as the fluid medium. There is also little chance of fluid seepage from the discharge outlet of the pump to the suction inlet due to the construction of the pump..."], "jumps": []}, {"id": "P2030", "text": ["Positive displacement pumps are self-priming and provide high output pressure. There are two categories of positive displacement pumps, the reciprocating and the rotary. Pneumatic systems usually are powered by a reciprocating pump..."], "jumps": []}, {"id": "P2020", "text": ["Pumps used in pneumatic systems are also positive displacement pumps."], "jumps": ["P2001"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1950", "P1001"]}, {"id": "P1950", "text": ["4. Hydraulic pump problems will be in one of these categories:"], "jumps": []}, {"id": "P1940", "text": ["3. Hydraulic fluid of the wrong viscosity can shorten the life of a pump. Always check the fluid level and change the fluid at the manufacturer's recommended intervals."], "jumps": []}, {"id": "P1930", "text": ["2. Rotary positive displacement pumps are self-priming and rely upon the pumped fluid to provide lubrication and cooling of the pump internals.."], "jumps": []}, {"id": "P1920", "text": ["1. Hydraulic systems use rotary positive displacement pumps."], "jumps": ["P1001"]}, {"id": "P1910", "text": ["You have completed the information on PUMPS USED IN HYDRAULIC SYSTEMS."], "jumps": ["P1530", "P1001"]}, {"id": "P1530", "text": ["In an older system, if everything checks OK and the performance is still below necessary the only fix is to install a larger pump configured to turn at a slower rate."], "jumps": []}, {"id": "P1520", "text": ["As a system ages it's efficiency diminishes somewhat with time due to wear of moving components and corrosion buildup. If the system was marginal when first installed it will be difficult to keep optimum performance as the system ages..."], "jumps": []}, {"id": "P1510", "text": ["Misalignment of the components could put additional strain on the equipment. The mechanical alignment between the prime mover and the pump is the final suspect. But, sloppy alignment of hose fittings and other mechanical connections in the system should also be checked..."], "jumps": []}, {"id": "P1500", "text": ["An obstruction in the discharge circuit can increase pressure in the system and reduce fluid flow causing the fluid to overheat. Check any valves inline with the discharge to ensure they are not stuck. It may also be necessary to check the system for obstructions..."], "jumps": []}, {"id": "P1490", "text": ["If the pump has recently been serviced the pump packing or seals may be too tight. It may be necessary to dismantle the pump and check the packing and/or seals."], "jumps": []}, {"id": "P1480", "text": ["As with many other symptoms, first check the hydraulic fluid in the reservoir. If the fluid viscosity has increased the additional fluid viscosity weight will increase the load on the pump, and therefore, the prime mover. When in doubt, change the fluid..."], "jumps": []}, {"id": "P1470", "text": ["Additional strain on the pump is passed onto the prime mover. The symptoms of pulling too much power include:ripping circuit breakers, overheating of the prime mover, reduced system performance, and high fluid temperature.."], "jumps": []}, {"id": "P1460", "text": ["When the pump requires too much power from the prime mover premature failure of the prime mover can be expected..failure of the prime mover can be expected."], "jumps": ["P1450"]}, {"id": "P1452", "text": ["This is only one of the possibilities when a pump cavitates or runs dry."], "jumps": []}, {"id": "P1451", "text": [], "jumps": []}, {"id": "P1450", "text": ["What happens when a pump cavitates or runs dry?............"], "jumps": ["P1440"]}, {"id": "P1440", "text": ["The best cure for both corrosion and contamination is the periodic replacement of the hydraulic fluid. Consult the manufacturer for recommended fluid replacement intervals."], "jumps": []}, {"id": "P1430", "text": ["Contamination of the fluid in a hydraulic system can wreck havoc. Most contamination is water condensed into the fluid over time. Water can foam, reducing both the viscosity of the fluid and the fluid lubrication properties. In systems used periodically the water can collect in areas causing corrosion..."], "jumps": []}, {"id": "P1420", "text": ["Corrosion of components can also accelerate pump wear. Corrosion in the system increases the load on the pump causing early wear and eventual reduction of performance."], "jumps": []}, {"id": "P1410", "text": ["Mechanically, a dry running pump or one that takes a long time to prime can wear at a greater than expected rate. Mechanical strain caused by pump casing misalignment can twist the pump internals over time causing premature wear. Verify the pump installation is optimum and component alignment is accurate after rebuild or replacement....."], "jumps": []}, {"id": "P1400", "text": ["Fast pump wear can be accelerated a number of ways:r of ways:ber of ways:"], "jumps": ["P1390"]}, {"id": "P1396", "text": ["VISCOSITY - A measure of a fluid's resistance to flow. The viscosity of a fluid usually varies with temperature; less viscous as the temperature rises and more viscous with decreasing temperature."], "jumps": []}, {"id": "P1395", "text": ["CAVITATION - The sudden formation and collapse of low-pressure bubbles in a flowing liquid in regions of very low pressure, often damaging impellers and pumps."], "jumps": []}, {"id": "P1390", "text": ["A noisy pump can also be caused by cavitation brought on by old hydraulic fluid or fluid of the wrong viscosity. When in doubt, change the fluid. Prolonged cavitation shortens the life of the pump as much as running a pump dry."], "jumps": []}, {"id": "P1380", "text": ["Check the pump for foreign items internally. Also look for bad bearings, bent shafts, misalignment of parts, or a noisy relief valve."], "jumps": []}, {"id": "P1370", "text": ["Noisy pump operation is usually caused by abnormal mechanical problems.s..nical problems.al problems."], "jumps": ["P1360"]}, {"id": "P1364", "text": ["All the steps are important, but which should be done first?"], "jumps": []}, {"id": "P1363", "text": ["Checking the reservoir fluid level is important but it is not the first thing to do when the prime is lost."], "jumps": []}, {"id": "P1362", "text": ["Searching for an air leak is important but it is not the first thing to do when the prime is lost."], "jumps": []}, {"id": "P1361", "text": [], "jumps": []}, {"id": "P1360", "text": ["What is the first thing to do when the pump prime is lost during operation?"], "jumps": ["P1350"]}, {"id": "P1350", "text": ["If the fluid levels are up and the system passes visual inspection the next step is an operational test. The system must be powered up and running. Using an eyedropper or syringe, apply small amounts of hydraulic fluid to all joints and seams in the suction circuit and pump housing. The leak will draw the fluid into the system....."], "jumps": []}, {"id": "P1340", "text": ["Leaks on the suction side of the pump behave differently than those on the discharge side of the pump. A puddle of fluid will not likely be present below the breach in the system. Visually inspect the entire suction portion of the circuit piping and the pump casing or housing. Look for breaks, cracks, and imperfections....."], "jumps": []}, {"id": "P1330", "text": ["After shutting down the system, check the reservoir for proper fluid level and verify the intake for the suction is below the fluid level."], "jumps": []}, {"id": "P1320", "text": ["Parts (depending on hydraulic fluid used for lubrication) can be damaged if the viscosity of the hydraulic fluid is reduced by overheating.", "In hydraulic systems a loss of prime can cause other serious pump damage since most rotary pumps can handle a dry run condition for only a very short time before damage begins. Immediately shut down the system..."], "jumps": []}, {"id": "P1310", "text": ["A sudden loss of prime while the pump is running can only be attributed to excessive air at the suction port or internal to the pump.t the suction port or internal to the pump."], "jumps": ["P1300"]}, {"id": "P1304", "text": ["A stuck bypass valve allows free flow of the fluid between the discharge and the suction, reducing pressure and fluid flow."], "jumps": []}, {"id": "P1303", "text": ["Air leaks on the suction side can prevent fluid suction resulting in no fluid output."], "jumps": []}, {"id": "P1302", "text": ["Low fluid level in the reservoir is a cause for no fluid output."], "jumps": []}, {"id": "P1301", "text": [], "jumps": []}, {"id": "P1300", "text": ["Which of the following CANNOT cause a no fluid output problem?"], "jumps": ["P1290"]}, {"id": "P1290", "text": ["Verify the prime mover and connecting linkages are working correctly. Internal pump wear should be considered when servicing older hydraulic systems. Wear can allow internal fluid slippage and reduced output..."], "jumps": []}, {"id": "P1280", "text": ["Pump related problems again include the loss of pump prime. Loss of prime can be caused by a suction air leak, cracked pump housing, or bad pump packing, seals, or gaskets."], "jumps": []}, {"id": "P1270", "text": ["Valve related problems could reduce the fluid output also. Misadjusted or jammed relief or bypass valves, or partially closed suction or discharge valves will reduce the fluid flow in a hydraulic system..."], "jumps": []}, {"id": "P1260", "text": ["Fluid related problems - Once again verify the proper viscosity fluid is being used as fluid too thin or too thick can cause reduced output. Also look for a partially clogged input strainer or filter and verify the proper fluid level in the reservoir.."], "jumps": []}, {"id": "P1250", "text": ["Symptom # 2: Reduced fluid output. Problems of this type can happen suddenly but usually occur over time and are brought to light only when the system performance drops below the minimum acceptable level. Once again the cause can be one of three areas: uid related problems Valve related problems Pump related problemsss"], "jumps": ["P1240"]}, {"id": "P1243", "text": ["Air leaks on the suction side can prevent fluid suction resulting in no fluid output."], "jumps": []}, {"id": "P1242", "text": ["Low fluid level in the reservoir is a cause for no fluid output."], "jumps": []}, {"id": "P1241", "text": [], "jumps": []}, {"id": "P1240", "text": ["Which of the following CANNOT cause a no fluid output problem?"], "jumps": ["P1230"]}, {"id": "P1230", "text": ["Pump related problems include the loss of pump prime and a pump running backwards. Loss of prime can be caused by a suction air leak or bad pump packing, seals, or gaskets. If it is discovered a pump is rotating in reverse, check the motor connected to the pump..."], "jumps": []}, {"id": "P1220", "text": ["Valve related problems can be caused by misadjusted or jammed relief or bypass valves, or closed suction or discharge valves."], "jumps": []}, {"id": "P1210", "text": ["Fluid related problems are quickly resolved. First check the reservoir and ensure there is sufficient fluid available. Also check to ensure the pick up tube is below the fluid level, and the strainer or filter at the end of the pickup tube, if equipped, is not clogged. Finally, verify the proper fluid is being used..."], "jumps": []}, {"id": "P1200", "text": ["Symptom # 1: No fluid output. Problems of this type occur suddenly and usually have just one of three causes: Fluid related problems Valve related problems Pump related problems"], "jumps": []}, {"id": "P1190", "text": ["It is usually obvious when the problem is caused by the pump. Pumps can display any of the below failure symptoms: fluid output from the pump Reduced fluid output Loss of prime while running Noisy operation Fast pump wear Pump is overheating the driving motorrr"], "jumps": []}, {"id": "P1180", "text": ["The first step in troubleshooting a suspected pump is the first observe the hydraulic system. Look for obvious signs of problems such as leaks, broken pipes, tubing, or hoses, and missing hydraulic components..."], "jumps": []}, {"id": "P1170", "text": ["The technician should be aware of the normal output pressure of the pump, the motion of the actuators in the system, the proper valve operation, and the condition of the reservoir and the other devices in the system..."], "jumps": []}, {"id": "P1160", "text": ["In hydraulic system failures one of the most suspected causes of reduced or loss of operation is the pump. However, before jumping right in to dismantling the pump, the technician should be aware and familiar with the normal operation of the hydraulic system..."], "jumps": ["P1150"]}, {"id": "P1152", "text": ["Reciprocating pumps are not usually used in hydraulic systems."], "jumps": []}, {"id": "P1151", "text": [], "jumps": []}, {"id": "P1150", "text": ["What type of pump is commonly used in hydraulic systems?..."], "jumps": ["P1140"]}, {"id": "P1144", "text": ["Sliding vane pumps have increased wear due to the sealing of the vanes against the pump housing."], "jumps": []}, {"id": "P1143", "text": ["External gear pumps have increased wear due to the action of the gears."], "jumps": []}, {"id": "P1142", "text": ["Internal gear pumps have increased wear due to the action of the gears."], "jumps": []}, {"id": "P1141", "text": [], "jumps": []}, {"id": "P1140", "text": ["Which pump should offer the longest life in normal use?...."], "jumps": ["P1130"]}, {"id": "P1130", "text": ["It's easy to see the wear factor could be greater with the vane pump than with other rotary pumps due to the required seal at the outer edge of the vane. Most manufacturers provide replacement vanes for pump repair, making restoration to service easier than other types of pumps..."], "jumps": []}, {"id": "P1120", "text": ["The sliding vane pump is the best positive displacement rotary pump for self-priming. Centrifugal force caused by the rotation keeps the vanes against the outer wall of the eccentric pump housing.."], "jumps": []}, {"id": "P1110", "text": ["Both rotors of the lobe pump are driven through external timing geared configurations."], "jumps": []}, {"id": "P1100", "text": ["The lobe pump is similar to the external gear pump but it uses two or three lobes instead of gears. Three lobe pumps produce a smoother pressured output than two lobe pumps. Lobe pumps also have less internal wear than gear pumps, and therefore, should last longer in a given application..."], "jumps": []}, {"id": "P1090", "text": ["The external gear pump uses two gears of equal size. Notice the rotation direction of the gears."], "jumps": []}, {"id": "P1080", "text": ["The rotor of the internal gear pump is inside the idler gear and turns at a faster speed than the idler due to the size difference. The gears are fully meshed at only one point of the rotation. The crescent-shaped divider between the gears prevents backflow from the discharge port to the suction port..."], "jumps": []}, {"id": "P1070", "text": ["Gear pumps operate using a pair of gears. One gear is driven by the prime mover, the rotor gear, and the second gear is driven by the rotor, the idler gear. The un-meshing actions of the gear teeth create the vacuum into which the fluid flows. Fluid is then accelerated out of the pump through the discharge port..."], "jumps": []}, {"id": "P1060", "text": ["The most popular types of rotary pumps used in hydraulic systems are the gear pump, the lobe pump, and the vane pump."], "jumps": []}, {"id": "P1050", "text": ["Most applications include a pressure released bypass valve, as the pump will not last long working against a closed discharge port. Hydraulic fluid would overheat and begin loosing viscosity quickly if fluid flow was not maintained through the pump. This would reduce the life of the pump..."], "jumps": []}, {"id": "P1040", "text": ["Rotary pumps use the vacuum created by an expanding volume to induce fluid flow, making them self-priming. Pressure is then created through the rotational operation. Rotary pumps rely on the pumped fluid to provide the lubrication and cooling needed for proper operation and long life..."], "jumps": []}, {"id": "P1030", "text": ["Positive displacement pumps are self-priming and provide high output pressure. There are two categories of positive displacement pumps, the reciprocating and the rotary. Hydraulic systems usually are powered by a rotary pump.."], "jumps": []}, {"id": "P1020", "text": ["Pumps used in hydraulic systems are positive displacement pumps."], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P440", "text": ["Let's begin the lesson on HYDRAULIC AND PNEUMATIC PUMPS..UMATIC SYSTEMS.matic systems. Also discussed are common failures in hydraulic and pneumatic system components."], "jumps": []}, {"id": "P430", "text": ["This lesson will familiarize you with the pumps used in hydraulic and pneumatic systems. Also discussed are common failures in hydraulic and pneumatic system components."], "jumps": []}, {"id": "P410", "text": ["There are a variety of pumps used and the type of pump used will depend on the systems application....out the service and manufacturing industries.", "Hydraulic and pneumatic pumps are used to circulate fluid throughout the system.em....."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P100", "text": ["w Recognize the types of pumps used in pneumatic systems. w Demonstrate the knowledge of pump operation and application. w Understand the causes of common pump failures. w Describe the basic repairs needed to restore pumps. operation..", "w Recognize the types of pumps used in hydraulic systems. w Demonstrate the knowledge of pump operation and application. w Understand the causes of common pump failures. w Describe the basic repairs needed to restore pumps. operation..", "2. Pumps Used in Pneumatic Systems.tive 1 line item 2 here. item 2 here.e.e.", "1. Pumps Used in Hydraulic Systems.tive 1 line item 2 here. item 2 here.e.e."], "jumps": []}, {"id": "P10", "text": ["HYDRAULIC AND PNEUMATIC PUMPSSSNEUMATIC SYSTEMS"], "jumps": []}, {"id": "P1", "text": ["Title: HYDRAULIC AND PNEUMATIC PUMPSMSNEUMATIC SYSTEMSf", "Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ..........", "Nida Corporation - Hydraulic and Pneumatic Pumps", "\"You have successfully passed the assessment", "Are you sure you want to Bookmark the Lesson?", "Are you sure you want to Exit the Lesson?", "You skipped X question(s). Do you want to _________", "The test is complete and your score is XX%. Do you want to _________", "You have successfully passed the assessment test!", "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa aaaaaaaaaaaaaaaaaaaaaaaaaa__", "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa _", "(!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!! !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!! let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
