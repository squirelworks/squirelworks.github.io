const book = {"title": "93953802", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ..", "Title: OPERATIONAL AMPLIFIER OPERATIONfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Identify operational amplifier circuits. w Describe the operating characteristics of operational amplifier circuits. w Identify the purpose of operational amplifier components.", "w Measure the input and output waveforms of operational amplifier circuits. w Recognize normal operation of operational amplifier circuits... amplifier circuits. w Recognize normal operation of operational amplifier circuits................"], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about operational amplifier circuits."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Operational amplifiers contain a differential amplifier, common collector amplifier and a push-pull amplifier."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["They always amplify the difference between the inverted and non-inverted inputs."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["The way operational amplifiers are connected in a circuit determines the type of amplifier."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on OPERATIONAL AMPLIFIER OPERATION..................."], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The operational amplifier circuit (op-amp) is an integrated circuit component."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Inside are dozens of transistors, diodes and resistors."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Because the circuit is miniaturized and sealed in a package, access to internal circuitry is not possible."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Only the inputs, output and power supply leads are connected externally. The op-amp is treated as a single component."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["External connections are shown by pin numbers. Use an op-amp reference book to determine pins and circuit connections."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["Normally, the power supply connections are not shown in schematics.  It is understood that op-amps require operating voltages.", "Normally, the power supply connections are not shown in schematics. It is understood that op-amps require operating voltages.."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["The op-amp is a super transistor.  It exhibits a nearvery large input resistance, zero output resistance, and near infinite voltage, current and power gain.", "The op-amp is a super transistor. It exhibits a nearvery large input resistance, zero output resistance, and near infinite voltage, current and power gain.{", "The op-amp is a super transistor. It exhibits a near infinite input resistance, zero output resistance, and a very large voltage, current and power gain..............."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["Op-amps amplify frequencies ranging from 0 Hz (DC) to several hundred kHz."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["Because of these characteristics, op-amps are extremely unstable and need to be controlled."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["Op-amps are controlled by external circuits that stabilize their operation using degenerative feedback. This is called closed loop mode of operation."], "jumps": ["P1120", "P1080", "P1115"]}, {"id": "P1115", "text": ["CLOSED LOOP MODE OF OPERATION - The closed loop mode uses feedback. The output is fed back to the input creating a loop. Op-amps, in special circuits, also use the open loop mode where no feedback signals are used."], "jumps": []}, {"id": "P1120", "text": ["Let's look at four op-amp circuits. First, the non-inverting amplifier."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["This is a typical non-inverting amplifier. The input is applied to the + input of the op-amp."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["Resistors Rf (feedback) and R1 form a voltage divider that applies part of the output signal to the inverting input."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["Since the input and output signals are in phase, the result of applying the output signal to the inverting input produces degenerative feedback."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["The amplifier amplifies the difference between the input and the feedback signal."], "jumps": ["P1170", "P1130"]}, {"id": "P1170", "text": ["The degenerative feedback reduces the gain of the op-amp to a controllable amount."], "jumps": ["P1180", "P1130"]}, {"id": "P1180", "text": ["Applying a DC input does not change circuit operation."], "jumps": ["P1190", "P1130"]}, {"id": "P1190", "text": ["Gain is calculated by the ratio of the output resistance to input resistance:", "Gain is calculated by the ratio of the output resistance to input resistance: Rf + R1 Rf A = or + 1 R1 R1", "Rf + R1 Rf A = or + 1 R1 R1"], "jumps": ["P1200", "P1130"]}, {"id": "P1200", "text": ["For example, the gain of this non-inverting amplifier is 11.                \n\n            Rf                 10 k\n A =              + 1  =             + 1  = 10 + 1 = 11        \n            R1                1 k", "For example, the gain of this non-inverting amplifier is 11. Rf 10 k A = + 1 = + 1 = 10 + 1 = 11 R1 1 k"], "jumps": ["P1210", "P1130"]}, {"id": "P1210", "text": ["What is the gain of this non-inverting amplifier?", "What is the gain of this non-inverting amplifier?.........."], "jumps": ["P1130", "P1215"]}, {"id": "P1211", "text": [], "jumps": []}, {"id": "P1212", "text": ["Remember, divide R1 into Rf and add 1.", "Remember, divide R1 into Rf and add 1......................", "Rf 50 k A = + 1 = + 1 R1 5000000"], "jumps": []}, {"id": "P1215", "text": ["Rf A = + 1 R1 500 5000000", "GAIN OF NON-INVERTING AMPLIFIER - Remember to use the formula shown.::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::"], "jumps": []}, {"id": "P1220", "text": ["To determine normal operation, compare the measured gain with the calculated gain.\n        Eout          201 mVpp                                Rf             100k\nA =               =                          = 201          A =          + 1 =             + 1 = 201\n        Ein               1 mVpp                                  R1             500", "To determine normal operation, compare the measured gain with the calculated gain. Eout 201 mVpp Rf 100k A = = = 201 A = + 1 = + 1 = 201 Ein 1 mVpp R1 5000000000000000000000000000000000000"], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["Now, let's look at the inverting amplifier circuit.", "Now, let's look at the inverting amplifier circuit........."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["This is a typical inverting amplifier. The input is applied to the \n- input of the op-amp.", "This is a typical inverting amplifier. The input is applied to the - input of the op-amp."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["Rf applies part of the output signal to the inverting input."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["Since the input and output signals are out of phase, the result of applying the output signal to the inverting input produces degenerative feedback."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["The degenerative feedback reduces the gain of the op-amp to a controllable amount."], "jumps": ["P1280", "P1240"]}, {"id": "P1280", "text": ["Applying a DC input does not change circuit operation."], "jumps": ["P1290", "P1240"]}, {"id": "P1290", "text": ["Gain is calculated by the ratio of the output resistance to the input resistance."], "jumps": ["P1300", "P1240"]}, {"id": "P1300", "text": ["For example, the gain of this inverting amplifier is 10.", "Rf 10 k A = = = 10 Rin 1 kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk"], "jumps": ["P1310", "P1240"]}, {"id": "P1310", "text": ["What is the gain of this inverting amplifier?", "What is the gain of this inverting amplifier?.............."], "jumps": ["P1240", "P1315"]}, {"id": "P1311", "text": [], "jumps": []}, {"id": "P1312", "text": ["Remember, divide Rin into Rf.", "Remember, divide Rin into Rf...............................", "Rf 50 k A = = Rin 500000000kkkkkk"], "jumps": []}, {"id": "P1315", "text": ["GAIN OF INVERTING AMPLIFIER - Remember to use this formula:"], "jumps": []}, {"id": "P1320", "text": ["To determine normal operation, compare the measured gain with the calculated gain. \n       Eout        200 mVpp                                           Rf          100 k\nA =             =                       = 200                        A =          =                 = 200\n       Ein             1 mVpp                                             Rin         500", "To determine normal operation, compare the measured gain with the calculated gain. Eout 200 mVpp Rf 100 k A = = = 200 A = = = 200 Ein 1 mVpp Rin 500"], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["Now, let's look at the difference amplifier circuit.", "Now, let's look at the difference amplifier circuit........"], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["This is a typical differential amp.  Inputs are applied to both the \n+  and - inputs of the op-amp.", "This is a typical differential amp. Inputs are applied to both the + and - inputs of the op-amp."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["Resistor Rf1 applies part of the output signal to the inverting input."], "jumps": ["P1370", "P1340"]}, {"id": "P1370", "text": ["The feedback reduces the gain of the op-amp to a controllable amount."], "jumps": ["P1380", "P1340"]}, {"id": "P1380", "text": ["Using DC inputs does not change circuit operation."], "jumps": ["P1390", "P1340"]}, {"id": "P1390", "text": ["Differential amplifiers normally use a gain of 1. Rf1 and Rin(-) are equal.", "Rf1 A = = 1 Rin(-))nnnnnnnnnnnnnnnnnnnnnn"], "jumps": ["P1400", "P1340"]}, {"id": "P1400", "text": ["Rin(+) and Rf2 form a voltage divider. This ensures that when both inputs are equal, the output is zero."], "jumps": ["P1410", "P1340"]}, {"id": "P1410", "text": ["The voltage divider balances the inputs by reducing the\nnon-inverting input by the same amount as the feedback signal reduces the inverting input.", "The voltage divider balances the inputs by reducing the non-inverting input by the same amount as the feedback signal reduces the inverting input.."], "jumps": ["P1420", "P1340"]}, {"id": "P1420", "text": ["What is the normal gain of difference amplifiers?", "What is the normal gain of difference amplifiers?.........."], "jumps": ["P1340"]}, {"id": "P1421", "text": [], "jumps": []}, {"id": "P1422", "text": ["Difference amplifiers normally have a gain of 1.", "Difference amplifiers normally have a gain of 1............"], "jumps": []}, {"id": "P1430", "text": ["To determine normal operation, find the difference between the inputs and compare to the output.\n\n                Output =  ( +Input) - (-Input) = (+5 V) - (+3 V) = +2 V", "To determine normal operation, find the difference between the inputs and compare to the output. Output = ( +Input) - (-Input) = (+5 V) - (+3 V) = +2 V"], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["Last, let's look at the summing amplifier circuit.", "Last, let's look at the summing amplifier circuit.........."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["This is a typical summing amplifier. Several inputs are applied to the - input of the op-amp."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["Resistor Rf applies part of the output signal to the inverting input."], "jumps": ["P1470", "P1450"]}, {"id": "P1470", "text": ["Since the input and output signals are out of phase, the result of applying the output signal to the inverting input produces degenerative feedback."], "jumps": ["P1480", "P1450"]}, {"id": "P1480", "text": ["The degenerative feedback reduces the gain of the op-amp to a controllable amount."], "jumps": ["P1490", "P1450"]}, {"id": "P1490", "text": ["Using DC inputs does not change circuit operation."], "jumps": ["P1500", "P1450"]}, {"id": "P1500", "text": ["Summing amplifiers normally use a gain of 1."], "jumps": ["P1510", "P1450"]}, {"id": "P1510", "text": ["The two external inputs produce a combined input to the op-amp."], "jumps": ["P1520", "P1450"]}, {"id": "P1520", "text": ["The combined input is amplified by a gain of 1 and applied to the output."], "jumps": ["P1530", "P1450"]}, {"id": "P1530", "text": ["What is the normal gain of summing amplifiers?", "What is the normal gain of summing amplifiers?............."], "jumps": ["P1450"]}, {"id": "P1531", "text": [], "jumps": []}, {"id": "P1532", "text": ["Summing amplifiers normally have a gain of 1.", "Summing amplifiers normally have a gain of 1..............."], "jumps": []}, {"id": "P1540", "text": ["To determine normal operation, find the sum of the inputs and compare to the output.\n\n                 Output = -(Input 1 + Input 2) = -(-5 V + +3 V) = +2 V", "To determine normal operation, find the sum of the inputs and compare to the output. Output = -(Input 1 + Input 2) = -(-5 V + +3 V) = +2 V"], "jumps": ["P1550", "P1530"]}, {"id": "P1550", "text": ["Remember, op-amps are versatile. Connecting them in different ways produces different amplifiers."], "jumps": ["P1910", "P1540"]}, {"id": "P1910", "text": ["This completes the information on OP-AMP CIRCUITS.", "This completes the information on OP-AMP CIRCUITS.E........"], "jumps": ["P1001", "P1550"]}, {"id": "P1920", "text": ["1.  Integrated circuit op-amps contain dozens of inaccessible              components. Only the inputs, outputs and power supply                 connections are available.", "1. Integrated circuit op-amps contain dozens of inaccessible components. Only the inputs, outputs and power supply connections are available."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Pin numbers are labeled in schematics. Refer to operational           amplifier reference books for pin numbers and connections.", "2. Pin numbers are labeled in schematics. Refer to operational amplifier reference books for pin numbers and connections."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Non-inverting op-amps use the + input with the - input                      grounded.  Rf and R1 supply degenerative feedback.", "3. Non-inverting op-amps use the + input with the - input grounded. Rf and R1 supply degenerative feedback. .", "Rf A = + 1 R1111111nnnnnnnnnnnnnn"], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  Inverting op-amps let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
