ircuit."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 488 Digital MultimeterXXXXXXXXXnt", "7. Alligator to Alligator CableeterXXXXXXXXXXnt"], "jumps": []}, {"id": "P1040", "text": ["Pick up the PC130-52A card. Compare the card with the schematic shown."], "jumps": ["P1045", "P1030"]}, {"id": "P1045", "text": ["This card is used to give you practice in troubleshooting SCR  trigger circuits.", "This card is used to give you practice in troubleshooting SCR trigger circuits."], "jumps": ["P1050", "P1040"]}, {"id": "P1050", "text": ["I1 is an incandescent lamp used as the load. When using this card, voltage measurements across the load do not have to be made, just if the lamp is ON/OFF.", "I1 is an incandescent lamp used as the load. When using this card, voltage measurements across the load do not have to be made, just if the lamp is ON/OFF.."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["R2 and R1 form the input circuit.  R3, C1 and S2 form the reset circuit.", "R2 and R1 form the input circuit. R3, C1 and S2 form the reset circuit.."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["S1 selects between a pulse trigger signal or a DC trigger signal.  The DC signal is used in this experiment. Let's start the experiment.", "S1 selects between a pulse trigger signal or a DC trigger signal. The DC signal is used in this experiment. Let's start the experiment."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["On some cards, resistor R4 is not present. Circuit operation is not affected if R4 is not in the circuit for this experiment.", "On some cards, resistor R4 is not present. Circuit operation is not affected if R4 is not in the circuit for this experiment.ent."], "jumps": ["P1090", "P1040"]}, {"id": "P1090", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P1080"]}, {"id": "P1100", "text": ["2.  Carefully place PC130-52A into the Test Console PC2                       position. \n3.  Set S1 on PC130-52A to the DC position and S2 to Operate. \n4.  Adjust R2 on PC130-52A fully CCW.", "2. Carefully place PC130-52A into the Test Console PC2 position. 3. Set S1 on PC130-52A to the DC position and S2 to Operate. 4. Adjust R2 on PC130-52A fully CCW."], "jumps": ["P1090", "P1105"]}, {"id": "P1105", "text": ["MEASUREMENT SETUP - Carefully set S1 to the DC position, S2 to Operate and adjust R2 fully CCW."], "jumps": []}, {"id": "P1110", "text": ["5.  Set the Voltmeter switch to Positive.  \n6.  Set the Positive Supply Voltage to 12.   The Test Console's             voltage meter should indicate 12 volts.", "5. Set the Voltmeter switch to Positive. 6. Set the Positive Supply Voltage to 12. The Test Console's voltage meter should indicate 12 volts..."], "jumps": ["P1100"]}, {"id": "P1130", "text": ["7.  Turn PC2 DC Power switch ON. The experiment card is now          setup. Let's verify normal operation before beginning the                troubleshooting practice.", "7. Turn PC2 DC Power switch ON. The experiment card is now setup. Let's verify normal operation before beginning the troubleshooting practice."], "jumps": ["P1110"]}, {"id": "P1140", "text": ["1.  Rotate R2 fully CW. \n     Did the lamp illuminate?", "1. Rotate R2 fully CW. Did the lamp illuminate???...."], "jumps": ["P1130"]}, {"id": "P1141", "text": [], "jumps": []}, {"id": "P1142", "text": ["The lamp should have illuminated. R2 supplies current to the gate of the SCR. Check your card set up and if the lamp still does not illuminate, check with your instructor."], "jumps": []}, {"id": "P1150", "text": ["2. Rotate R2 fully CCW.\n    Did the lamp extinguish?", "2. Rotate R2 fully CCW. Did the lamp extinguish???......"], "jumps": ["P1140"]}, {"id": "P1151", "text": [], "jumps": []}, {"id": "P1152", "text": ["The lamp should have stayed illuminated. Remember, once the SCR turns ON, the gate current is not needed to retain the SCR ON. Check with your instructor, you may have a faulted card."], "jumps": []}, {"id": "P1160", "text": ["3.  Place the Reset/Operate switch on PC130-52A to RESET and         back to OPERATE.\n     Did the lamp extinguish?", "3. Place the Reset/Operate switch on PC130-52A to RESET and back to OPERATE. Did the lamp extinguish?"], "jumps": ["P1150"]}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1162", "text": ["The lamp should have extinguished. Ensure that R2 is fully CCW and  that you placed S2 to Reset. If the lamp still does not extinguish, check with your instructor.", "The lamp should have extinguished. Ensure that R2 is fully CCW and that you placed S2 to Reset. If the lamp still does not extinguish, check with your instructor."], "jumps": []}, {"id": "P1170", "text": ["The SCR trigger circuit is operating correctly. The computer may now insert a fault into the SCR circuit. You must determine if the circuit is faulted and if so, what the fault is."], "jumps": ["P1160"]}, {"id": "P1200", "text": ["1.  Rotate R2 slowly to the full CW position, and then back fully           CCW.  \n2.  Set S2 to RESET and then back to OPERATE.\n     Is the SCR circuit functioning correctly?", "1. Rotate R2 slowly to the full CW position, and then back fully CCW. 2. Set S2 to RESET and then back to OPERATE. Is the SCR circuit functioning correctly???????????"], "jumps": ["P1205"]}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1202", "text": ["The SCR circuit is not functioning correctly. The lamp should not illuminate, regardless of the trigger. The computer inserted a fault into the circuit."], "jumps": []}, {"id": "P1205", "text": ["SCR TRIGGER CIRCUIT OPERATION - A normal operating SCR trigger circuit applies power to the load when a certain gate level is reached. Power should remain applied to the load until the circuit is reset."], "jumps": []}, {"id": "P1210", "text": ["3.  Measure +Vcc on PC130-52A TP5 with your oscilloscope. \n     Is it a smooth +12 VDC?", "3. Measure +Vcc on PC130-52A TP5 with your oscilloscope. Is it a smooth +12 VDC?"], "jumps": ["P1200"]}, {"id": "P1211", "text": [], "jumps": []}, {"id": "P1212", "text": ["The fault inserted by the computer does not effect +Vcc. Ensure you are measuring TP5 on PC130-52A and that your oscilloscope is set to measure DC."], "jumps": []}, {"id": "P1230", "text": ["4.  Check the gate input signal on TP2 with your digital                          multimeter. Vary R2.\n     Is the input trigger signal to the gate of SCR1 correct?", "4. Check the gate input signal on TP2 with your digital multimeter. Vary R2. Is the input trigger signal to the gate of SCR1 correct?"], "jumps": ["P1210", "P1235"]}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1232", "text": ["The trigger voltage at the gate of SCR1 (TP2 on PC130-52A) is incorrect. The fault is in the gate (control) circuit."], "jumps": []}, {"id": "P1235", "text": ["SCR GATE INPUT - In this SCR circuit, a small trigger voltage must be supplied to the gate in order for current to flow in the power circuit (lamp)."], "jumps": []}, {"id": "P1240", "text": ["5.  Turn PC2 DC Power switch OFF.", "5. Turn PC2 DC Power switch OFF.trol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P1230"]}, {"id": "P1250", "text": ["6.  Check the resistance in the control circuit with your digital             multimeter.  \n     Which component is faulted?", "6. Check the resistance in the control circuit with your digital multimeter. Which component is faulted?"], "jumps": ["P1240", "P1255"]}, {"id": "P1251", "text": [], "jumps": []}, {"id": "P1252", "text": ["Check the resistance of R1 (TP3 to TP2) again. It should read an open with your digital multimeter. Ensure you are measuring the correct test points."], "jumps": []}, {"id": "P1255", "text": ["CONTROL CIRCUIT - The control circuit supplies gate current to trigger the SCR. A problem with one of these components prevents the SCR from functioning correctly."], "jumps": []}, {"id": "P1260", "text": ["Your resistance measurements indicate that R1 is open. This         prevents the gate from receiving the trigger voltage. The                  computer will now replace R1. \n7.  Turn PC2 DC Power switch ON.", "Your resistance measurements indicate that R1 is open. This prevents the gate from receiving the trigger voltage. The computer will now replace R1. 7. Turn PC2 DC Power switch ON."], "jumps": ["P1250"]}, {"id": "P1270", "text": ["8.  Rotate R2 slowly to the full CW position, and then back fully           CCW. \n9. Set S2 to RESET and then back to OPERATE. Is the SCR                 circuit functioning correctly?", "8. Rotate R2 slowly to the full CW position, and then back fully CCW. 9. Set S2 to RESET and then back to OPERATE. Is the SCR circuit functioning correctly??????"], "jumps": ["P1260", "P1275"]}, {"id": "P1271", "text": [], "jumps": []}, {"id": "P1272", "text": ["The SCR circuit should be functioning correctly. The lamp should illuminate when R2 supplies sufficient trigger voltage and remain illuminated until S2 interrupts the holding current."], "jumps": []}, {"id": "P1275", "text": ["SCR TRIGGER CIRCUIT OPERATION - A normal operating SCR trigger circuit applies power to the load when a certain gate level is reached. Power should remain applied to the load until the circuit is reset."], "jumps": []}, {"id": "P1280", "text": ["Congratulations! You correctly identified the fault in an SCR trigger circuit and determined normal operation when the fault was repaired."], "jumps": ["P1270"]}, {"id": "P1300", "text": ["1.  Rotate R2 slowly to the full CW position, and then back fully           CCW.  \n2.  Set S2 to RESET and then back to OPERATE.\n     Is the SCR circuit functioning correctly?", "1. Rotate R2 slowly to the full CW position, and then back fully CCW. 2. Set S2 to RESET and then back to OPERATE. Is the SCR circuit functioning  effectively limiting power to the load."], "jumps": []}, {"id": "P2610", "text": ["Congratulations! You have determined that an SCR power control circuit was functioning correctly. This is an important troubleshooting ability."], "jumps": ["P2600"]}, {"id": "P2700", "text": ["Would you like to try another troubleshooting experiment?", "Would you like to try another troubleshooting experiment? No"], "jumps": []}, {"id": "P2710", "text": ["You have completed all of the troubleshooting experiments. If you wish to perform any of the experiments again, you may select \"SCR Power Control Faults\" from the Lesson Menu."], "jumps": []}, {"id": "P2720", "text": ["1. Return the Test Console to the initial control settings. nter the discussion text here."], "jumps": []}, {"id": "P2730", "text": ["Disconnect test equipment. \n     Carefully remove PC130-52B.                                \n     Return all equipment to its proper storage area.", "Disconnect test equipment. Carefully remove PC130-52B. Return all equipment to its proper storage area."], "jumps": []}, {"id": "P2740", "text": ["Set the Test Console Power OFF. r the discussion text here."], "jumps": []}, {"id": "P2910", "text": ["This completes the experiment on SCR POWER CONTROL FAULTS.", "This completes the experiment on SCR POWER CONTROL FAULTS...."], "jumps": ["P2001", "P2740"]}, {"id": "P13020", "text": ["The purpose of this experiment is to give you practice in troubleshooting SCR trigger circuits. If the circuit is faulted, you will determine the faulty component and verify correct operation when the computer repairs the circuit."], "jumps": ["P13030", "P1001"]}, {"id": "P13030", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 488 Digital MultimeterXXXXXXXXXnt", "7. Alligator to Alligator CableeterXXXXXXXXXXnt"], "jumps": []}, {"id": "P13040", "text": ["Pick up the PC130-52A card. Compare the card with the schematic shown."], "jumps": ["P13045", "P13030"]}, {"id": "P13045", "text": ["This card is used to give you practice in troubleshooting SCR trigger circuits."], "jumps": ["P13050", "P13040"]}, {"id": "P13050", "text": ["I1 is an incandescent lamp used as the load. When using this card, voltage measurements across the load do not have to be made, just if the lamp is ON/OFF.", "I1 is an incandescent lamp used as the load. When using this card, voltage measurements across the load do not have to be made, just if the lamp is ON/OFF.."], "jumps": ["P13060", "P13040"]}, {"id": "P13060", "text": ["R2 and R1 form the input circuit.  R3, C1 and S2 form the reset circuit.", "R2 and R1 form the input circuit. R3, C1 and S2 form the reset circuit.."], "jumps": ["P13070", "P13040"]}, {"id": "P13070", "text": ["S1 selects between a pulse trigger signal or a DC trigger signal. The DC signal is used in this experiment. Let's start the experiment."], "jumps": ["P13080", "P13040"]}, {"id": "P13080", "text": ["On some cards, resistor R4 is not present. Circuit operation is not affected if R4 is not in the circuit for this experiment.", "On some cards, resistor R4 is not present. Circuit operation is not affected if R4 is not in the circuit for this experiment.ent."], "jumps": ["P13090", "P13040"]}, {"id": "P13090", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13080"]}, {"id": "P13100", "text": ["2.  Carefully place PC130-52A into the Test Console PC2 position.\n3.  Set S1 on PC130-52A to the DC position and S2 to Operate. \n4.  Adjust R2 on PC130-52A fully CCW.", "2. Carefully place PC130-52A into the Test Console PC2 position. 3. Set S1 on PC130-52A to the DC position and S2 to Operate. 4. Adjust R2 on PC130-52A fully CCW."], "jumps": ["P13110", "P13105"]}, {"id": "P13105", "text": ["MEASUREMENT SETUP - Carefully set S1 to the DC position, S2 to Operate and adjust R2 fully CCW."], "jumps": []}, {"id": "P13110", "text": ["5.  Press Enter to Set: Positive Supply Voltage - 12", "5. Press Enter to Set: Positive Supply Voltage - 12......................."], "jumps": ["P13100"]}, {"id": "P13602", "text": ["The SCR circuit is functioning correctly. The lamp should illuminate when a certain gate voltage is reached, and then extinguish when the circuit is reset."], "jumps": []}, {"id": "P13140", "text": ["1.  Rotate R2 fully CW. \n     Did the lamp illuminate?", "1. Rotate R2 fully CW. Did the lamp illuminate???...."], "jumps": []}, {"id": "P13141", "text": [], "jumps": []}, {"id": "P13142", "text": ["The lamp should have illuminated. R2 supplies current to the gate of the SCR. Check your card set up and if the lamp still does not illuminate, check with your instructor."], "jumps": []}, {"id": "P13150", "text": ["2.  Rotate R2 fully CCW. \n     Did the lamp extinguish?", "2. Rotate R2 fully CCW. Did the lamp extinguish???..."], "jumps": ["P13140"]}, {"id": "P13151", "text": [], "jumps": []}, {"id": "P13152", "text": ["The lamp should have stayed illuminated. Remember, once the SCR turns ON, the gate current is not needed to retain the SCR ON. Check with your instructor, you may have a faulted card."], "jumps": []}, {"id": "P13160", "text": ["3.  Place the Reset/Operate switch on PC130-52A to RESET and         back to OPERATE.\n     Did the lamp extinguish?", "3. Place the Reset/Operate switch on PC130-52A to RESET and back to OPERATE. Did the lamp extinguish?"], "jumps": ["P13150"]}, {"id": "P13161", "text": [], "jumps": []}, {"id": "P13162", "text": ["The lamp should have extinguished. Ensure that R2 is fully CCW and  that you placed S2 to Reset. If the lamp still does not extinguish, check with your instructor.", "The lamp should have extinguished. Ensure that R2 is fully CCW and that you placed S2 to Reset. If the lamp still does not extinguish, check with your instructor."], "jumps": []}, {"id": "P13170", "text": ["The SCR trigger circuit is operating correctly. The computer may now  insert a fault into the SCR circuit. You must determine if the circuit is faulted and if so, what the fault is.", ". The experiment in this lesson is not setup to use the selected trainer.", "The SCR trigger circuit is operating correctly. The computer may now insert a fault into the SCR circuit. You must determine if the circuit is faulted and if so, what the fault is."], "jumps": ["P13160"]}, {"id": "P13200", "text": ["1.  Rotate R2 slowly to the full CW position, and then back fully           CCW. \n2.  Set S2 to RESET and then back to OPERATE.\n     Is the SCR circuit functioning correctly?", "1. Rotate R2 slowly to the full CW position, and then back fully CCW. 2. Set S2 to RESET and then back to OPERATE. Is the SCR circuit functioning correctly???"], "jumps": ["P13205"]}, {"id": "P13201", "text": [], "jumps": []}, {"id": "P13202", "text": ["The SCR circuit is not functioning correctly. The lamp should not illuminate, regardless of the trigger. The computer inserted a fault into the circuit."], "jumps": []}, {"id": "P13205", "text": ["SCR TRIGGER CIRCUIT OPERATION - A normal operating SCR trigger circuit applies power to the load when a certain gate level is reached. Power should remain applied to the load until the circuit is reset."], "jumps": []}, {"id": "P13210", "text": ["3.  Measure +Vcc on PC130-52A TP5 with your oscilloscope.\n     Is it a smooth +12 VDC?", "3. Measure +Vcc on PC130-52A TP5 with your oscilloscope. Is it a smooth +12 VDC?"], "jumps": ["P13200"]}, {"id": "P13211", "text": [], "jumps": []}, {"id": "P13212", "text": ["The fault inserted by the computer does not effect +Vcc. Ensure you are measuring TP5 on PC130-52A and that your oscilloscope is set to measure DC."], "jumps": []}, {"id": "P13230", "text": ["4.  Check the gate input signal on TP2 with your digital                          multimeter. Vary R2.\n     Is the input trigger signal to the gate of SCR1 correct?", "4. Check the gate input signal on TP2 with your digital mul let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
