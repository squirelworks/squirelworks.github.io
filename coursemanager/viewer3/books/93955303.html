const book = {"title": "93955303", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: AC MOTORS CHARACTERISTICSsd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Verify proper AC motor operation. w Determine the characteristics of a loaded and unloaded AC motor.", "w Discuss characteristics of a loaded and unloaded AC motor. w Discuss inductive and capacitive Run/Start AC motors."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "3. Nida Model 280 Rotating Machinery Trainer", "6. Nida Model 410 Frequency Counter XXXXXnt"], "jumps": []}, {"id": "P301", "text": ["8. (2) Nida Model 488 Digital Multimeter"], "jumps": []}, {"id": "P330", "text": ["Nida Model 280 Rotating Machinery Trainer"], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P350", "text": [], "jumps": ["P"]}, {"id": "P351", "text": [], "jumps": []}, {"id": "P352", "text": [], "jumps": []}, {"id": "P353", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about AC motor characteristics."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["AC motors are very popular in industry because AC power is readily available."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["AC motors are used when low starting currents are more important than speed control."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["The AC induction motor is the most commonly used motor when low starting current is a characteristic."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["Let's begin the lesson on AC MOTORS CHARACTERISTICS......................."], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Recall, AC motors are constructed from pole pairs and a rotor."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Two powers, each of a different phase are applied to the stator poles."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["This sets up a rotating magnetic field around the rotor which produces motor action."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Stator field rotation, called synchronized speed, is calculated by:"], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["\" is the frequency of the stator input and \"N\" is the number of pole pairs."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["Rotor rotation or shaft speed, is never as great as synchronous speed."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["The rotor is always trying to catch up or synchronize with the stator field speed."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["The difference between synchronous speed and shaft speed is called slip speed or slip RPM."], "jumps": ["P1100", "P1070"]}, {"id": "P1100", "text": ["Slip speed is how much the shaft speed lags behind the stator field speed."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["Synchronous speed is the same as _______..................."], "jumps": ["P1090"]}, {"id": "P1111", "text": [], "jumps": []}, {"id": "P1112", "text": ["Slip speed is the difference between synchronous speed and rotor speed."], "jumps": []}, {"id": "P1113", "text": ["Shaft speed and rotor speed are the same..................."], "jumps": []}, {"id": "P1115", "text": ["Let's look at the relationship between the following AC induction motor characteristics: motor RPM, stator current and torque."], "jumps": ["P1120", "P1110"]}, {"id": "P1120", "text": ["An AC motor has a unique relationship when comparing load to the following: motor RPM, stator current and torque.", "Torque Stator Current Speed in RPM"], "jumps": ["P1130", "P1115"]}, {"id": "P1130", "text": ["Notice that as the load on the motor increases toward the rated load, stator current and torque increase."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["At the rated load, RPM drops to between 85 and 95% of the synchronous speed."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["The point where torque and RPM cross is the rated load RPM stated on many AC motors."], "jumps": ["P1155", "P1120"]}, {"id": "P1155", "text": ["Increasing the load beyond the motor's rating will increase torque to maximum, while RPM remains relatively steady."], "jumps": ["P1160", "P1120"]}, {"id": "P1160", "text": ["Unlike a DC motor, an AC motor has a peak torque that is not at maximum load (locked rotor)."], "jumps": ["P1165", "P1120"]}, {"id": "P1165", "text": ["As the load is increased further, motor torque decreases."], "jumps": ["P1168", "P1120"]}, {"id": "P1168", "text": ["This causes a rapid drop in RPM until the rotor is locked."], "jumps": ["P1170", "P1120"]}, {"id": "P1170", "text": ["Low torque when the load is maximum increases the motor starting current. This is a prime reason for using AC induction motors."], "jumps": ["P1190", "P1120"]}, {"id": "P1190", "text": ["In an AC induction motor, as the load increases towards maximum rating, _______"], "jumps": ["P1120"]}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1192", "text": ["Both torque and stator current increase as the motor load increases."], "jumps": []}, {"id": "P1200", "text": ["AC induction motors are typically classified as one phase, two phase or three phase machines."], "jumps": ["P1203", "P1190"]}, {"id": "P1203", "text": ["The classification is determined by the number of input power phases required to operate the motor."], "jumps": ["P1204", "P1200"]}, {"id": "P1204", "text": ["You have seen how a two phase AC induction motor operates."], "jumps": ["P1206", "P1200"]}, {"id": "P1206", "text": ["A three phase AC induction motor works the same............"], "jumps": ["P1208", "P1200"]}, {"id": "P1208", "text": ["The difference is 3 stator winding pairs 120", "apart are used instead of 2 winding pairs 90"], "jumps": ["P1214", "P1206"]}, {"id": "P1210", "text": ["Since it takes at least two pairs of stators to produce a rotating magnetic field, how does this motor operate?"], "jumps": ["P1216", "P1214"]}, {"id": "P1214", "text": ["Note that the AC motors in your house are single phase....."], "jumps": ["P1210", "P1206"]}, {"id": "P1216", "text": ["Inside the motor, the 1 phase input is split into 2 phase inputs. These 2 phase inputs create a split phase motor. . R 1 Input Start Run Inductor L Inductor L"], "jumps": ["P1220", "P1210"]}, {"id": "P1220", "text": ["The splitting is accomplished by connecting 2 stator poles across the 1 phase input power in parallel."], "jumps": ["P1230", "P1216"]}, {"id": "P1230", "text": ["Note that R indicates the resistance of the stator windings and L indicates the inductance."], "jumps": ["P1240", "P1216"]}, {"id": "P1240", "text": ["By making the reactance of each pole different, the phase of the pole currents will be different."], "jumps": ["P1250", "P1216"]}, {"id": "P1250", "text": ["Remember, the pole currents are the cause of magnetic flux."], "jumps": ["P1260", "P1216"]}, {"id": "P1260", "text": ["For example, pole #1 has high resistance and low inductance. A phase shift between the input voltage and the current of pole 1 is produced."], "jumps": ["P1270", "P1216"]}, {"id": "P1270", "text": ["This small phase shift is due to pole #1 being more resistive."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["Pole #2 has high inductance and less resistance. High R R 1 Input I#1 Low"], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["Because pole #2 is mostly inductive, a large phase shift is set up between voltage and current. EA Phase I#1 I#2"], "jumps": ["P1300", "P1260"]}, {"id": "P1300", "text": ["Notice the phase difference between pole #1 and pole #2. ase"], "jumps": ["P1310", "P1260"]}, {"id": "P1310", "text": ["Now there are 2 phases, 1 on each pole pair. This causes motor action."], "jumps": ["P1320", "P1260"]}, {"id": "P1320", "text": ["This type of split phase AC induction motor is called an inductor run motor. #2 1 Input #1 Rotor"], "jumps": ["P1330", "P1260"]}, {"id": "P1330", "text": ["In the schematic, the resistance is not shown. You must remember that the two poles are wound differently."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["Another type of split phase induction motor is the capacitor run motor. Pole #2 1 Input Pole #1 Rotor"], "jumps": ["P1350", "P1320"]}, {"id": "P1350", "text": ["The difference is the addition of a capacitor in series to one of the pole pairs."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["Vector diagrams show the capacitor run motor has a larger phase difference than the inductor run motor. I#2 EA Phase EA I#1 Phase I#2 I#1"], "jumps": ["P1370", "P1340"]}, {"id": "P1370", "text": ["A large phase difference produces high start torque."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["Recall that AC induction motors have small starting torques. M Synchronous Chart Key Speed * - Torque * - Stator Current * - Speed in RPM", "Torque Stator Current Speed in RPM"], "jumps": ["P1390", "P1360"]}, {"id": "P1390", "text": ["Because of the increased start torque, capacitor run AC induction motors are used for heavy load applications."], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["After rotation starts, the two pole phases are not required. 1 Input Rotor Input Rotor"], "jumps": ["P1410", "P1380"]}, {"id": "P1410", "text": ["Once the rotor reaches near synchronous speed, the rotor construction causes circulating currents. This requires a pulsating field of only 1 stator pole pair."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["This is due to the lagging rotor currents which cause constant attraction and repulsion."], "jumps": ["P1430", "P1400"]}, {"id": "P1430", "text": ["Because of this, AC induction motors can be built as start motors. Inductor Start Capacitor Start Start Start Run Rotor Run Rotor Capacitor Centrifugal Centrifugal Switch Switch"], "jumps": ["P1440", "P1400"]}, {"id": "P1440", "text": ["Once the motor reaches synchronous speed, the centrifugal switch opens, disconnecting the start windings."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["Since only the run windings are used, power consumption decreases."], "jumps": ["P1460", "P1430"]}, {"id": "P1460", "text": ["As you will see in the following experiment, the AC motor on the 280 trainer is a capacitor run motor. #2 1 Input #1 Rotor"], "jumps": ["P1910", "P1430"]}, {"id": "P1910", "text": ["This completes the information on AC MOTOR CHARACTERISTICS..."], "jumps": ["P1001", "P1460"]}, {"id": "P1920", "text": ["1. Stator field rotation is called synchronous speed and can be calculated by::"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. Motor output shaft speed is also the rotor speed. The difference between synchronous speed and shaft speed is called slip speed.."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. An AC motor has a unique relationship between motor RPM, stator current and torque -vs- load. onous Chart Key Speed * - Torque * - Stator Current", "Torque Stator Current Speed in RPM"], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. A split phase motor produces out of phase current from a single phase source. 1 Winding R R Run AC Input Winding Low High L L"], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. An inductive start motor has two inductive branches and produces a relatively small phase difference. SS Rotor"], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6. A capacitive start motor has a series capacitor in the start branch. otor"], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7. The capacitive reactance produces a start current that causes a large phase difference between the start and run branches. ase EA I#1 Capacitor Run"], "jumps": ["P1999", "P1970"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["In this experiment you will explore the characteristics of an AC motor."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["You will measure some simple circuit values and compute other circuit values.", "60 N Slip = Synchronous-Shaftttttttttttttttttttttttttttt"], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["This experiment will familiarize you with a typical AC motor."], "jumps": ["P2060", "P2020"]}, {"id": "P2060", "text": ["Let's begin the experiment. 1. Set the 280 trainer to it's initial control settings."], "jumps": ["P2070", "P2040", "P22000"]}, {"id": "P2070", "text": ["2. Set the Test Console controls to their initial control settings........"], "jumps": ["P2060"]}, {"id": "P2080", "text": ["3. Insert PC130-280 into the PC3 position on the 130 test console.2 AC switch to ON. 9. Set the PC3 Speaker switch to ON...................................... let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
