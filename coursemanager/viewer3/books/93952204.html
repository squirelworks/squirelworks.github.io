 10.  Set the Oscilloscope Time/Div to 20 msec.", "9. Set the frequency output of the Function Generator to 5 kHz. 10. Set the Oscilloscope Time/Div to 20 msec."], "jumps": ["P1270", "P1250"]}, {"id": "P1265", "text": ["SETTING FREQUENCY OUTPUT 1. Set the RANGE to 1 kHz. 2. Set the FREQUENCY dial to 5."], "jumps": ["P1260"]}, {"id": "P1270", "text": ["How many cycles are displayed on the Oscilloscope?", "How many cycles are displayed on the Oscilloscope?........."], "jumps": ["P1260"]}, {"id": "P1271", "text": [], "jumps": []}, {"id": "P1272", "text": ["Make sure the Function Generator is set to 5 kHz and the Time/Div on the Oscilloscope is set to 20 msec. Remember,           \u0083 = 1 \u00f7 time.", "Make sure the Function Generator is set to 5 kHz and the Time/Div on the Oscilloscope is set to 20 msec. Remember,"], "jumps": []}, {"id": "P1280", "text": ["11.  Adjust the amplitude on the Function Generator for a 4 Vpp            output. This is the waveform displayed on the Oscilloscope.", "11. Adjust the amplitude on the Function Generator for a 4 Vpp output. This is the waveform displayed on the Oscilloscope.", "'}:5 t0H( 9E}A9As5/GA}A;aEAA}EAKE;AAaAE;A}AEAU;aA};aEAEA;EAAAEA;E;AaA", "EUaa 555G7EEEa::Ts1TA;;AA;EEA;AAa9:AAE;E;;;UaAA;AEEA;aA};AA9aAA}}};E;AA9E}9AA;}AAEaaA;AEAEaAAEEaAAA9EEAAA}EAE;aEEEAU;EE;Ea;}", "EK,,L17;UT9;EK;,=17=9EK;AaTs a7(aEAEas5:9<5", "mzF(tt-FsFF-cmzssttst|t--yTmVstys|tytts sm t syst", ";EaTTy55F }Aaas= yjm;AEEAA T_}zc(GGFGVVVccVcVVlllGLVs-FFccclFm--jz5(-VFzmmm(ctmmlmzzzFFFFFzmmmctmFmsmmtcVmt5mzzl-zFmmFmtz", "KT[Qa9mFKKaa 5TL:EAa95 |9/:}EAEAALA_l>lz(lllFmV-V/czzFzFz/cVmcc--F(GlzFVllWmzzm(mzm(FzmpcF(zmFlzFmmlz-llplcmV-z-mcjsFV`zltmlzFVz-tVczFFtcmVmzlFz(mmzFmzFzmFl/VtmtVFmzmVcmmsVccFtsmmmmFFysGsV", "}9}AAK,,KKK/>V;U9a;EE;KTfV=:lFE;AaTTssc AA :: :9W5EAEEA-Es.>i?fodfi..r.l`(zlVclmlFzljlm", "K,EKK71CA;TU9;EKK:/H:ajlEaaaTa :G Eaa9sya9W", "iid>?>>viijVjcFGfmsG5ssTy|ymssmV5|Hsy5ysTTVsytmmV|t=sm55ms5VLmsH5sGc5m5m=VmmVmmmGmtymmls5j5mmmFV5spcmmmmV5mtt5Gmmmltsmmlmsmy5T5mssQtysFssmmmsmmtsmtsymmtss myy|s5|T5|ystsHa|s|", ",K,KK,,E,,E',EK'5@P=;''aaaT55 5GT;aA9AAOA;AA;AA:;Aa'"], "jumps": ["P1290", "P1270"]}, {"id": "P1285", "text": ["AMPLITUDE CONTROL - Set the Amplitude to 4 Vpp."], "jumps": ["P1280"]}, {"id": "P1290", "text": ["12.  Set the AC-GND-DC switch on the Oscilloscope to DC.\n13.  Pull out the DC Offset control on the Function Generator and         rotate CW and CCW.  Notice the effect on the output                          waveform.", "12. Set the AC-GND-DC switch on the Oscilloscope to DC. 13. Pull out the DC Offset control on the Function Generator and rotate CW and CCW. Notice the effect on the output waveform..."], "jumps": ["P1300", "P1280"]}, {"id": "P1295", "text": ["DC OFFSET CONTROL - Pull out and rotate CW and CCW."], "jumps": ["P1290"]}, {"id": "P1300", "text": ["14.  Push the DC Offset control in.  \n15.  Pull out the Symmetry control on the Function Generator and        rotate CW and CCW.  Notice the effect on the output                          waveform.", "14. Push the DC Offset control in. 15. Pull out the Symmetry control on the Function Generator and rotate CW and CCW. Notice the effect on the output waveform..."], "jumps": ["P1301", "P1290"]}, {"id": "P1301", "text": ["16.  Select the triangle wave function.  \n17.  Adjust the Symmetry control CW and CCW.  Notice that you           are producing different ramp waves by using the symmetry            control.", "16. Select the triangle wave function. 17. Adjust the Symmetry control CW and CCW. Notice that you are producing different ramp waves by using the symmetry control..."], "jumps": ["P1307", "P1300"]}, {"id": "P1302", "text": ["FUNCTION AND SYMMETRY - Set the Function to . Pull the Symmetry control out then vary CW and CCW."], "jumps": ["P1301"]}, {"id": "P1305", "text": ["SYMMETRY - Pull the Symmetry control out then rotate CW and CCW."], "jumps": ["P1300"]}, {"id": "P1307", "text": ["18.  Select the square wave function. \n19.  Adjust the symmetry control CW and CCW.  Notice that you           are producing different pulse waves by using the symmetry           control.", "18. Select the square wave function. 19. Adjust the symmetry control CW and CCW. Notice that you are producing different pulse waves by using the symmetry control...I"], "jumps": ["P1310", "P1301"]}, {"id": "P1308", "text": ["FUNCTION AND SYMMETRY CONTROL - Set the Function to . Vary the Symmetry control CW and CCW."], "jumps": ["P1307"]}, {"id": "P1310", "text": ["20.  Push the symmetry control in. Now, let's modulate the output        signal.", "20. Push the symmetry control in. Now, let's modulate the output signal."], "jumps": ["P1320", "P1307"]}, {"id": "P1320", "text": ["1.  Set the output of the Function Generator for a 4 Vpp SINE               wave.  \n2.  Set the Time/Div control on the Oscilloscope to 2 msec.  The          trace on the Oscilloscope is the high frequency signal that will      be modulated.  Notice the peak to peak amplitude.", "1. Set the output of the Function Generator for a 4 Vpp SINE wave. 2. Set the Time/Div control on the Oscilloscope to 2 msec. The trace on the Oscilloscope is the high frequency signal that will be modulated. Notice the peak to peak amplitude."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["3.  Set the MODULATION controls to AM and SINE wave. \n4.  Set the modulation RANGE to 10k.", "3. Set the MODULATION controls to AM and SINE wave. 4. Set the modulation RANGE to 10k.."], "jumps": ["P1340", "P1320"]}, {"id": "P1335", "text": ["MODULATION - Press Modulation to AM and SINE. Press Range to 10 k."], "jumps": ["P1330"]}, {"id": "P1340", "text": ["5.  Vary the modulation FREQUENCY control CW and CCW.\n6.  Vary the modulation MIN/MAX control CW and CCW.  Notice           the effect of these controls on the output signal.", "5. Vary the modulation FREQUENCY control CW and CCW. 6. Vary the modulation MIN/MAX control CW and CCW. Notice the effect of these controls on the output signal."], "jumps": ["P1350", "P1330"]}, {"id": "P1345", "text": ["MODULATION - Vary the MIN/MAX CW and CCW. Vary the Frequency CW and CCW."], "jumps": ["P1340"]}, {"id": "P1350", "text": ["7.  Set the MODULATION control to triangle and then to square           wave.  Notice the effect of these controls on the output signal.", "7. Set the MODULATION control to triangle and then to square wave. Notice the effect of these controls on the output signal."], "jumps": ["P1360", "P1340"]}, {"id": "P1355", "text": ["MODULATION - Set the Function to         then to       .", "MODULATION - Set the Function to then to ."], "jumps": ["P1350"]}, {"id": "P1360", "text": ["8.  Set the modulation MODULATION controls to SINE wave and         FM.  Release the AM switch. \n  9.  Set the modulation RANGE to 100. \n10.  Set the Time/Div on the Oscilloscope to .1 msec.", "8. Set the modulation MODULATION controls to SINE wave and FM. Release the AM switch. 9. Set the modulation RANGE to 100. 10. Set the Time/Div on the Oscilloscope to .1 msec..to .1 msec."], "jumps": ["P1370", "P1350"]}, {"id": "P1365", "text": ["MODULATION CONTROLS - Press the Modulation AM Out, FM In. Press the Function SINE In. Set the Range to 100."], "jumps": ["P1360"]}, {"id": "P1370", "text": ["11.  Vary the modulation FREQUENCY control CW and CCW. \n12.  Vary the modulation MIN/MAX control CW and CCW.  Notice           the effect of these controls on the output signal.", "11. Vary the modulation FREQUENCY control CW and CCW. 12. Vary the modulation MIN/MAX control CW and CCW. Notice the effect of these controls on the output signal."], "jumps": ["P1380", "P1360"]}, {"id": "P1375", "text": ["MODULATION CONTROLS - Vary the MIN/MAX. Vary the Frequency control."], "jumps": ["P1370"]}, {"id": "P1380", "text": ["13.  Set the modulation to AM sine wave.  \n14.  Set the modulation range to 10 k.\n15.  Set the Time/Div on the Oscilloscope to 1 msec.", "13. Set the modulation to AM sine wave. 14. Set the modulation ra elect the square wave function.  \n19.  Adjust the symmetry control CW and CCW.  Notice that you           are producing different pulse waves by using the symmetry           control.", "18. Select the square wave function. 19. Adjust the symmetry control CW and CCW. Notice that you are producing different pulse waves by using the symmetry control."], "jumps": ["P13310", "P13301"]}, {"id": "P13308", "text": ["FUNCTION AND SYMMETRY CONTROL - Set the Function to . Vary the Symmetry control CW and CCW."], "jumps": ["P13307"]}, {"id": "P13310", "text": ["20.  Push the symmetry control in.  Now, let's modulate the                    output signal.", "20. Push the symmetry control in. Now, let's modulate the output signal."], "jumps": ["P13320", "P13307"]}, {"id": "P13320", "text": ["1.  Set the output of the Function Generator for a 4 Vpp SINE               wave.  \n2.  Set the Time/Div control on the Oscilloscope to 2 msec.  The          trace on the Oscilloscope is the high frequency signal that              will be modulated.  Notice the peak to peak amplitude.", "1. Set the output of the Function Generator for a 4 Vpp SINE wave. 2. Set the Time/Div control on the Oscilloscope to 2 msec. The trace on the Oscilloscope is the high frequency signal that will be modulated. Notice the peak to peak amplitude.."], "jumps": ["P13330", "P13310"]}, {"id": "P13330", "text": ["3.  Set the MODULATION controls to AM and SINE wave.  \n4.  Set the modulation RANGE to 10k.", "3. Set the MODULATION controls to AM and SINE wave. 4. Set the modulation RANGE to 10k."], "jumps": ["P13340", "P13320"]}, {"id": "P13335", "text": ["MODULATION - Press Modulation to AM and SINE. Press Range to 10 k."], "jumps": ["P13330"]}, {"id": "P13340", "text": ["5.  Vary the modulation FREQUENCY control CW and CCW. \n6.  Vary the modulation MIN/MAX control CW and CCW.  Notice            the effect of these controls on the output signal.", "5. Vary the modulation FREQUENCY control CW and CCW. 6. Vary the modulation MIN/MAX control CW and CCW. Notice the effect of these controls on the output signal."], "jumps": ["P13350", "P13330"]}, {"id": "P13345", "text": ["MODULATION - Vary the MIN/MAX CW and CCW. Vary the Frequency CW and CCW."], "jumps": ["P13340"]}, {"id": "P13350", "text": ["7.  Set the MODULATION control to triangle and then to square            wave.  Notice the effect of these controls on the output signal.", "7. Set the MODULATION control to triangle and then to square wave. Notice the effect of these controls on the output signal."], "jumps": ["P13360", "P13340"]}, {"id": "P13355", "text": ["MODULATION - Set the Function to        then to       .", "MODULATION - Set the Function to then to ."], "jumps": ["P13350"]}, {"id": "P13360", "text": ["8.  Set the modulation MODULATION controls to SINE wave and         FM.  Release the AM switch.  \n  9.  Set the modulation RANGE to 100.                                                 10.  Set the Time/Div on  the Oscilloscope to .1 msec.", "8. Set the modulation MODULATION controls to SINE wave and FM. Release the AM switch. 9. Set the modulation RANGE to 100. 10. Set the Time/Div on the Oscilloscope to .1 msec.."], "jumps": ["P13370", "P13350"]}, {"id": "P13365", "text": ["MODULATION CONTROLS - Press the Modulation AM Out, FM In. Press the Function SINE In. Set the Range to 100."], "jumps": ["P13360"]}, {"id": "P13370", "text": ["11.  Vary the modulation FREQUENCY control CW and CCW.  \n12.  Vary the modulation MIN/MAX control CW and CCW.  Notice           the effect of these controls on the output signal.", "11. Vary the modulation FREQUENCY control CW and CCW. 12. Vary the modulation MIN/MAX control CW and CCW. Notice the effect of these controls on the output signal."], "jumps": ["P13380", "P13360"]}, {"id": "P13375", "text": ["MODULATION CONTROLS - Vary the MIN/MAX. Vary the Frequency control."], "jumps": ["P13370"]}, {"id": "P13380", "text": ["13.  Set the modulation to AM sine wave.\n14.  Set the modulation let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
