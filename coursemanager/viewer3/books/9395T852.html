he capacitor are at 5 volts which is a HIGH to the 8051 chip.  This indicates the system is in a reset condition.  Five time constants are required for the capacitor to effectively charge to + 5 volts.", "This means that both the top and bottom of the capacitor are at 5 volts which is a HIGH to the 8051 chip. This indicates the system is in a reset condition. Five time constants are required for the capacitor to effectively charge to + 5 volts."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["When the capacitor fully charges, the top of the capacitor will be at + 5 volts and the bottom of the capacitor (and pin 9 of the 8051) will be at 0 volts.  This represents the non-reset condition of the 8051.", "When the capacitor fully charges, the top of the capacitor will be at + 5 volts and the bottom of the capacitor (and pin 9 of the 8051) will be at 0 volts. This represents the non-reset condition of the 8051...ipin will be at 5 volts and the bottom pin will be at 0 volts or a LOW condition. This indicates a non-reset condition."], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["The 8051 chip construction technology is known to produce a change in HIGH/LOW conditions between 0.8 volts and 2.0 volts."], "jumps": ["P1100", "P1050"]}, {"id": "P1100", "text": ["Somewhere between 2.0 and 0.8 volts, the 8051 will accept the input signal as a LOW condition.  This tells the microcontroller that it can start.", "Somewhere between 2.0 and 0.8 volts, the 8051 will accept the input signal as a LOW condition. This tells the microcontroller that it can start. n. This tells the microcontroller that it can start."], "jumps": ["P1110", "P1050"]}, {"id": "P1110", "text": ["The object of the delay is to ensure all components have had time to reset before the microcontroller starts.  To achieve this, the first recognized value of 2.0 volts is used.", "The object of the delay is to ensure all components have had time to reset before the microcontroller starts. To achieve this, the first recognized value of 2.0 volts is used. designed to be long enough to make sure all other components have had time to reset, the delay will have been designed using the lowest possible recognized low value or 2.0 volts."], "jumps": ["P1120", "P1050"]}, {"id": "P1120", "text": ["This way if the change occurs later, at 1.5 volts for example, it will wait longer than required which is OK.  If too short of a delay had been selected, then other components might not have time to reset before the microcontroller starts.", "This way if the change occurs later, at 1.5 volts for example, it will wait longer than required which is OK. If too short of a delay had been selected, then other components might not have time to reset before the microcontroller starts.. e delay had been designed using a lower voltage and a chip was used with a higher voltage where the transition occurred, the delay would be shorter and all other devices may not be reset yet."], "jumps": ["P1130", "P1050"]}, {"id": "P1130", "text": ["After the system has been operating and you want to reset it, you perform this operation by pressing the reset button.  While the reset button is pressed down, the positive end of the charged capacitor is connected to the negative end of the capacitor through a resistor.", "After the system has been operating and you want to reset it, you perform this operation by pressing the reset button. While the reset button is pressed down, the positive end of the charged capacitor is connected to the negative end of the capacitor through a resistor."], "jumps": ["P1150", "P1050"]}, {"id": "P1150", "text": ["This applies + 5 volts to the RST line and initiates the RESET condition.  The purpose of diode D1 is to rapidly discharge C8 when power is removed.  This ensures that the microcontroller will enter the reset condition upon a brief interruption of power.", "This applies + 5 volts to the RST line and initiates the RESET condition. The purpose of diode D1 is to rapidly discharge C8 when power is removed. This ensures that the microcontroller will enter the reset condition upon a brief interruption of power...Since there are no components between the RST and 5 volts, the RESET condition is recognized by the system. The diode provides protection and voltage limitation."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["After the button is released, the capacitor begins charging as it did when power was turned on."], "jumps": ["P1170", "P1130"]}, {"id": "P1170", "text": ["The reset condition is recognized when the input signal is _______", "The reset condition is recognized when the input signal is _________"], "jumps": ["P1130"]}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1172", "text": ["Remember, the reset condition is asserted when the input signal is in its high state.  Signals that are active low normally have a bar over the signal name or a circle on the input pin as shown below.", "Remember, the reset condition is asserted when the input signal is in its high state. Signals that are active low normally have a bar over the signal name or a circle on the input pin as shown below........", "Example of active low signal labellllllllllTT"], "jumps": []}, {"id": "P1180", "text": ["Now that we have looked at the reset circuitry, let's look at memory.", "There are many chips and signals required for the proper connection of memory to the microcontroller.  The graphic below shows the connections of the memory to the 8051 microcontroller.", "There are many chips and signals required for the proper connection of memory to the microcontroller. The graphic below shows the connections of the memory to the 8051 microcontroller."], "jumps": ["P1190", "P1170", "P1200", "P1180", "P"]}, {"id": "P1200", "text": ["The address and data lines which come out of the microcontroller must be demultiplexed.  Address/Data lines AD0 through AD7 are the signals which must be separated into the data and address information.  A8 through A15 are just address lines.", "The address and data lines which come out of the microcontroller must be demultiplexed. Address/Data lines AD0 through AD7 are the signals which must be separated into the data and address information. A8 through A15 are just address lines."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["In the operation of an instruction which uses memory, the microcontroller has to have a method for multiplexing the address and data information."], "jumps": ["P1220", "P1190"]}, {"id": "P1220", "text": ["This is acheived by making the address information available at beginning of the operation, and making the data available for the remainder of the operation."], "jumps": ["P1230", "P1190"]}, {"id": "P1230", "text": ["Remember, however, that we do need the address information available for the rest of the operation.  This is made possible by the use of an address latch.", "Remember, however, that we do need the address information available for the rest of the operation. This is made possible by the use of an address latch."], "jumps": ["P1240", "P1190"]}, {"id": "P1240", "text": ["An address latch will save the high address bits for the remainder of the operation.  The address latch outputs are the last input values when the C signal was asserted HIGH.", "An address latch will save the high address bits for the remainder of the operation. The address latch outputs are the last input values when the C signal was asserted HIGH."], "jumps": ["P1250", "P1190"]}, {"id": "P1250", "text": ["The 8051 ALE signal (Address Latch Enable) is high while the address is on the multiplexed lines, and low while the data is on the lines.  The ALE signal is attached to the C input of the address latch.", "The 8051 ALE signal (Address Latch Enable) is high while the address is on the multiplexed lines, and low while the data is on the lines. The ALE signal is attached to the C input of the address latch."], "jumps": ["P1260", "P1190"]}, {"id": "P1260", "text": [" ory locations. The microcontroller can address 64 thousand locations with just the address lines, and 128 thousand using a combination of other signals."], "jumps": ["P1360", "P1300"]}, {"id": "P1360", "text": ["For this reason, the last available address line is used to pick between the two chips.  This method of using the additional address line is known as chip select decoding.", "For this reason, the last available address line is used to pick between the two chips. This method of using the additional address line is known as chip select decoding."], "jumps": ["P1370", "P1300"]}, {"id": "P1370", "text": ["The address line used to select between the EPROM and the RAM is A15.  We also need to introduce a few other signals which also affect whether or not a memory chip is selected.", "The address line used to select between the EPROM and the RAM is A15. We also need to introduce a few other signals which also affect whether or not a memory chip is selected."], "jumps": ["P1380", "P1300"]}, {"id": "P1380", "text": ["The PSEN (Program Store Enable) signal from the microcontroller is used to select between reading program memory or writing data and accessing IO.  If the signal is low, then the microcontroller is trying to read information from external memory.", "The PSEN (Program Store Enable) signal from the microcontroller is used to select between reading program memory or writing data and accessing IO. If the signal is low, then the microcontroller is trying to read information from external memory."], "jumps": ["P1390", "P1300", "Program"]}, {"id": "P1390", "text": ["If this signal is high, then the microcontroller is trying to write information to RAM or access an IO device.", "The last two control signals from the microcontroller to memory are the RD and WR.  These are the read and write signals.  If the WR line is low,  then the microcontroller is trying to write information to memory.", "The last two control signals from the microcontroller to memory are the crocontroller is connected to the WE or write enable pin of the RAM chip. When writing from the microcontroller, the PSEN signal is always high."], "jumps": ["P1510", "P1400"]}, {"id": "P1510", "text": ["For this reason the WR or write line is able to be directly connected to the WE of the RAM without other signals.  When designing circuitry, it is important to make sure that only the specific chip and function of that chip is used at a specific time.", "For this reason the WR or write line is able to be directly connected to the WE of the RAM without other signals. When designing circuitry, it is important to make sure that only the specific chip and function of that chip is used at a specific time."], "jumps": ["P1530", "P1400"]}, {"id": "P1530", "text": ["It is important to note how memory is connected in any particular 8051 system will depend on the size and number of memory chips used.  However, the manner in which they are connected will be relatively the same.", "It is important to note how memory is connected in any particular 8051 system will depend on the size and number of memory chips used. However, the manner in which they are connected will be relatively the same. er of memory chips used. However, the way in which they are connected will be relatively the same."], "jumps": ["P1540", "P1400"]}, {"id": "P1540", "text": ["Normally, a memory map can be used to see how the address lines control which chips are being used.  The graphic below shows the memory map for this particular 8051 system.", "Normally, a memory map can be used to see how the address lines control which chips are being used. The graphic below shows the memory map for this particular 8051 system.", "0000Fhhhhhhhhhhhhhhhhhhh 0000Fh", "Address Locationhhhhhhhhhhhhhhhhhhhhhhhh"], "jumps": ["P1550", "P1400"]}, {"id": "P1550", "text": ["In the experiment you will look at the operation of certain memory signals you have learned about in this lesson.  You will be able to see how the synchronized process works.", "In the experiment you will look at the operation of certain memory signals you have learned about in this lesson. You will be able to see how the synchronized process works."], "jumps": ["P1560", "P1540"]}, {"id": "P1560", "text": ["In the next lesson you will look at the connection of IO to a microcontroller and you will see how the implementation is very similar to memory connections in many respects."], "jumps": ["P1910", "P1540"]}, {"id": "P1910", "text": ["This completes the information on OPERATION OF THE 8051 MICROCONTROLLER."], "jumps": ["P1001", "P1540"]}, {"id": "P1920", "text": ["1.  An RC delay circuit is used in the RESET circuitry to ensure           that all system components have the opportunity to reset prior      to the microcontroller starting.", "2.  The ALE (Address Latch Enable) signal latches the address            value on the multiplexed pins to the output of the address               latch.  This allows the address values to be available later               when the data is on the multiplexed pins.", "1. An RC delay circuit is used in the RESET circuitry to ensure that all system components have the opportunity to reset prior to the microcontroller starting. delay for all system components to be reset when the microcontroller restarts.", "2. The ALE (Address Latch Enable) signal latches the address value on the multiplexed pins to the output of the address latch. This allows the address values to be available later when the data is on the multiplexed pins."], "jumps": ["P1930", "P1001", "P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Unused address lines are configured to select different                   memory chips.  In the Nida 8051 system, there are 32 kbytes of      EPROM memory and 32 kbytes of RAM memory.", "3. Unused address lines are configured to select different memory chips. In the Nida 8051 system, there are 32 kbytes of EPROM memory and 32 kbytes of RAM memory."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  The PSEN signal is used to read instructions from memory             connected externally to the 8051 microcontroller.", "4. The PSEN signal is used to read instructions from memory connected externally to the 8051 microcontroller."], "jumps": ["P1999", "P1930"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1930"]}, {"id": "P2001", "text": ["The purpose of this experiment is to investigate the various timing and memory control signals generated and/or used by the microcontroller.  By examining these signals, you can gain an understanding of their purpose as well as observe the microcontroller's memory access in action.", ". The experiment in this lesson is not setup to use the selected trainer.", "The purpose of this experiment is to investigate the various timing and memory control signals generated and/or used by the microcontroller. By examining these signals, you can gain an understanding of their purpose as well as observe the microcontroller's memory access in action...yistemtceinxamine various timing and memory control signals generated and/or used by the microcontroller."], "jumps": ["P2060", "P2001", "P"]}, {"id": "P2060", "text": ["Let's begin the experiment!", "Let's begin the experiment!e..............................."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2060"]}, {"id": "P2080", "text": ["2.  Insert the following 130 experiment cards on the test console.               a.  Insert PC130-405 51 Family Microcontroller card in the PC1 position. \n     b.  Insert PC130-406 Keyboard and Display card in the PC2 position.\n     c.  Insert PC130-407 Microcontroller I/O and Interface card in the PC3                    position.", "2. Insert the following 130 experiment cards on the test console. a. Insert PC130-405 51 Family Microcontroller card in the PC1 position. b. Insert PC130-406 Keyboard and Display card in the PC2 position. c. Insert PC130-407 Microcontroller I/O and Interface card in the PC3 position."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["3. Connect the three experiment cards with the flat ribbon cables as follows: a. Using the first 34 pin ribbon cable, connect PC130-405 J1 to PC130-406 J1. b. Using the second 34 pin ribbon cable, connect PC130-406 J2 to PC130-407 J1."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["4.  Set the Positive Supply Control to 15.  Set the Negative                    Supply Control to 15.  The Voltmeter on the 130A should                 indicate 15 Volts.", "4. Set the Positive Supply Control to 15. Set the Negative Supply Control to 15. The Voltmeter on the 130A should indicate 15 Volts."], "jumps": ["P2090"]}, {"id": "P2120", "text": ["5.   Press the PC3 DC Power switch to ON.", "5. Press the PC3 DC Power switch to ON. 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2100"]}, {"id": "P2125", "text": ["6.   Press the PC2 DC Power switch to ON.", "6. Press the PC2 DC Power switch to ON. 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2120"]}, {"id": "P2130", "text": ["7.   Press the PC1 DC Power switch to ON.", "7. Press the PC1 DC Power switch to ON. 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2125"]}, {"id": "P2135", "text": ["In the first part of this lesson, you were introduced to the IC's and signals that interface with memory on the 8051 trainer.", "8. The microcontroller system is now assembled and operating. You should see the message \"NIDA 51:\" in the LCD display on the PC130-406 card. If the message is dim or blank, try adjusting the Display Intensity potentiometer R4 on the PC130-406 card using a small screwdriver. If you still cannot see the message, see your instructor for assistance. If, at any time during the experiment, you short some of the IC pins together while observing the signals, press the reset button. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run it again before proceeding with your measurements.", "If, at any time during the experiment, you short some of the IC pins together while observing the signals, press the reset button. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run it again before proceeding with your measurements. Before trying to measure a signal from the actual IC pin, look at the test point banks on the PC card. d then run the program before proceeding with your measurements.....nts."], "jumps": ["P2140", "P2130", "P2150", "P2135"]}, {"id": "P2150", "text": ["These chips include RAM, EPROM, a latch, and logic.  In this section of the experiment we are going to look at a few of the signals associated with these chips to understand the importance of their use in the system.", "These chips include RAM, EPROM, a latch, and logic. In this section of the experiment we are going to look at a few of the signals associated with these chips to understand the importance of their use in the system."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["To view the signals, we need to make them periodic.  This means the same signal patterns repeat over and over, allowing us to see them on an oscilloscope.", "To view the signals, we need to make them periodic. This means the same signal patterns repeat over and over, allowing us to see them on an oscilloscope."], "jumps": ["P2165", "P2140"]}, {"id": "P2165", "text": ["To make periodic patterns with the signals of interest, we will enter a program which repeats the same actions."], "jumps": ["P2170", "P2140"]}, {"id": "P2170", "text": ["9.  Press the RESET button on the PC130-405 card.  You will               enter a program into memory for execution by the 8051                    microcontroller.  The help button will lead you to a summary          on entering programs into the 8051.", "9. Press the RESET button on the PC130-405 card. You will enter a program into memory for execution by the 8051 microcontroller. The help button will lead you to a summary on entering programs into the 8051."], "jumps": ["P2180", "P2140", "P2175"]}, {"id": "P2175", "text": ["INSTRUCTIONS FOR ENTERING PROGRAMS: 1. Press EDIT on the PC130-406 Keyboard and Display experiment card and enter the desired SEGMENT or OFFSET. A SEGMENT such as 1000 may be entered as 1000:, 1000:0, or 1000:0000. An OFFSET such as 1000 may be entered as 1000, :1000, or 0000:1000. 2. Press ENTER after the desired SEGMENT or OFFSET has been entered. The display will now show the SEGMENT at the top of the display along with OFFSET and stored OPCODE at the bottom of the display. NOTE: Every time you enter an OPCODE and press ENTER, you automatically move to the next OFFSET. Additionally, there are three things that can be done at any SEGMENT and OFFSET: Enter an new value and press ENTER, press the down arrow to move to the next OFFSET, or press the up arrow to move the previous OFFSET. 3. Enter all of the desired OPCODES for the program remembering to press ENTER after each. 4. After all OPCODES of the program have been entered, press the STOP key. 5. The program has now been stored in memory. To verify the program has been stored correctly, press the DISPLAY R.M. key, enter the starting address of the program, and press ENTER. All OPCODES for that location, as well for the next 17 locations, will be displayed. biles, automobile parts, and automobile maintenance. Draws up orders and checks automobile prior to delivery. Advertising and telephone marketing may be required at slow times. Environment - Clean well lighted showroom or outside on a lot. Evenings, days and weekends. Requirements - Must be able to maintain a pleasant attitude with people under stressful conditions. Good personal appearance and manners are important."], "jumps": []}, {"id": "P2180", "text": ["10.  Enter the following program into memory starting at \"8000\".          (EDIT, 8000, enter values with an ENTER after each one,                  STOP.)", "10. Enter the following program into memory starting at \"8000\". (EDIT, 8000, enter values with an ENTER after each one, STOP.)", "Moves the value 0Ah into the A register. Moves the memory location 8100 into the DPTR, or data pointer register. Moves value in A to memory. Jump back to the beginning of this program at location 8000 or RAM.", "MOV A, #Ah MOV DPRT, #8100h MOVX @ DPTR,A JMP #8000h"], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["11.  Run the program you just entered.  This is done by pressing          the RUN key and entering the starting address of the                        program, \"8000\".", "11. Run the program you just entered. This is done by pressing the RUN key and entering the starting address of the program, \"8000\"."], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["The display of the 8051 should be frozen.  The program you ran is now in an infinite loop performing the same four functions over and over.", "The display of the 8051 should be frozen. The program you ran is now in an infinite loop performing the same four functions over and over.", "1. Move the value 0A into the A register. 2. Put the address 8100 into the data pointer register. 3. Write the value in A to the memory location pointed at by the data pointer. 4. Go back to the first instruction....nnnnn"], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["Again, this loop allows us to look at signals in the system since they are now periodic."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["Note that during normal operation, with exception of the clock signals, microcontroller signals are not periodic.  To view non-periodic signals, logic analyzers can be used.  Generally, logic analyzers are much more expensive than oscilloscopes.", "Note that during normal operation, with exception of the clock signals, microcontroller signals are not periodic. To view non-periodic signals, logic analyzers can be used. Generally, logic analyzers are much more expensive than oscilloscopes."], "jumps": ["P2230", "P2200"]}, {"id": "P2230", "text": ["Many technicians will run a short program that makes the microcontroller's output signals periodic so that they can be analyzed using an oscilloscope."], "jumps": ["P2240", "P2200"]}, {"id": "P2240", "text": ["The next step requires precision tuning of your oscilloscope. The instructions presented here are general in nature and the waveforms shown below should help you acquire the actual waveforms.", "The next step requires precision tuning of your oscilloscope. The instructions presented here are general in nature and the waveforms shown below should help you acquire the actual waveforms.n below to help you get them. are shown below to help you get them."], "jumps": ["P2250", "P2200"]}, {"id": "P2250", "text": ["12.  Set your oscilloscope to 2 ms, dual channel, 0.5 volts and DC          coupling.  Make sure you use x10 oscilloscope probes set to         the 10X setting.  This will keep the oscilloscope from                         affecting the operation of the system.  Set the oscilloscope             to trigger from channel 1.", "12. Set your oscilloscope to 2 ms, dual channel, 0.5 volts and DC coupling. Make sure you use x10 oscilloscope probes set to the 10X setting. This will keep the oscilloscope from affecting the operation of the system. Set the oscilloscope to trigger from channel 1.", "If you cannot get the waveforms to stabilize, change the coupling switch of the oscilloscope through its settings. The hold off and trigger level adjustments are also very important in measuring these waveforms.t reenter the program and then run it again before proceeding with your measurements. Before trying to measure a signal from the actual IC pin, look at the test point banks on the PC card. d then run the program before proceeding with your measurements.....nts."], "jumps": ["P2255", "P2240"]}, {"id": "P2255", "text": ["At any time during the remainder of the experiment you may press Ctrl S to view the schematic diagram of 8051 family microcontroller."], "jumps": ["P2260", "P2250"]}, {"id": "P2260", "text": ["13.  Connect CH1 of your oscilloscope to the PSEN signal on                the PC130-405 card.  Use the HOLD OFF control adjusting it           very slowly to get the PSEN signal similar to the one shown           below.", "13. Connect CH1 of your oscilloscope to the PSEN signal on the PC130-405 card. Use the HOLD OFF control adjusting it very slowly to get the PSEN signal similar to the one shown below."], "jumps": ["P2270", "P2255"]}, {"id": "P2270", "text": ["From the graphic below and the knowledge of the program you entered, you can easily see the operations being performed by the microcontroller."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["A15 is always HIGH indicating that we are reading/writing to RAM.  Remember that A15 is inverted and attached to the CS (chip select) pin of the RAM chip.  Notice also that the RD line never goes low.", "A15 is always HIGH indicating that we are reading/writing to RAM. Remember that A15 is inverted and attached to the CS (chip select) pin of the RAM chip. Notice also that the RD line never goes low."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["You may be wondering how it is reading information from RAM. Remember that external instructions are read with the PSEN signal.  We are only reading instructions and their information.", "You may be wondering how it is reading information from RAM. Remember that external instructions are read with the PSEN signal. We are only reading instructions and their information."], "jumps": ["P2300", "P2270"]}, {"id": "P2300", "text": ["If we were trying to read data from RAM and not instructions, the RD signal would go low and not the PSEN signal."], "jumps": ["P2310", "P2270"]}, {"id": "P2310", "text": ["The first two low pulses of the ALE and PSEN signal load 74 into the instruction register and 0A into a temporary register.  The next pulse performs the action which moves 0A into the accumulator (A).", "The first two low pulses of the ALE and PSEN signal load 74 into the instruction register and 0A into a temporary register. The next pulse performs the action which moves 0A into the accumulator (A)."], "jumps": ["P2320", "P2270"]}, {"id": "P2320", "text": ["The next three pulses of these signals load the next instruction and its immediate data.  Note that this data is considered part of the instruction which is why the RD line is not active (low).", "The next three pulses of these signals load the next instruction and its immediate data. Note that this data is considered part of the instruction which is why the RD line is not active (low)."], "jumps": ["P2330", "P2270"]}, {"id": "P2330", "text": ["The next pulse is the instruction being performed which moves the16-bit value 8100 into the DPTR register.  The next pulse loads the instruction F0 which is MOV @ DPTR,A.  This will take the value stored in A and put it into the memory pointed to by DPTR.", "The next pulse is the instruction being performed which moves the16-bit value 8100 into the DPTR register. The next pulse loads the instruction F0 which is MOV @ DPTR,A. This will take the value stored in A and put it into the memory pointed to by DPTR."], "jumps": ["P2340", "P2270"]}, {"id": "P2340", "text": ["Since we are writing data to external memory, the PSEN signal is not needed.  You can see that the WR signal goes low and the ALE signal goes low.  This indicates the writing of information to RAM.  Notice how much longer this instruction takes.", "Since we are writing data to external memory, the PSEN signal is not needed. You can see that the WR signal goes low and the ALE signal goes low. This indicates the writing of information to RAM. Notice how much longer this instruction takes."], "jumps": ["P2350", "P2270"]}, {"id": "P2350", "text": ["Internal memory transfers are much faster.  After this, the last instruction and data is read which is three bytes long.  This accounts for the three low pulses of PSEN and ALE which load the instruction and information.", "Internal memory transfers are much faster. After this, the last instruction and data is read which is three bytes long. This accounts for the three low pulses of PSEN and ALE which load the instruction and information."], "jumps": ["P2360", "P2270"]}, {"id": "P2360", "text": ["The last low pulse loads the value 8000 into the program counter (PC) and returns to the beginning of this program.  This is the periodic program that you entered into the system.", "The last low pulse loads the value 8000 into the program counter (PC) and returns to the beginning of this program. This is the periodic program that you entered into the system."], "jumps": ["P2370", "P2270", "PC"]}, {"id": "P2370", "text": ["Two additional observations need to be discussed regarding the ALE and PSEN signal.  ALE is address latch enable which means when it is high the address on the address/data bus needs to be latched by the latches.  This is why the PSEN signal does not go low until after the ALE signal has gone low.", "Two additional observations need to be discussed regarding the ALE and PSEN signal. ALE is address latch enable which means when it is high the address on the address/data bus needs to be latched by the latches. This is why the PSEN signal does not go low until after the ALE signal has gone low."], "jumps": ["P2380", "P2270"]}, {"id": "P2380", "text": ["This makes sure that the address information is valid.  Second is the extra low pulse of PSEN and ALE when the microprocessor is performing the action.  This has to do with the design of the system.", "This makes sure that the address information is valid. Second is the extra low pulse of PSEN and ALE when the microprocessor is performing the action. This has to do with the design of the system."], "jumps": ["P2390", "P2270"]}, {"id": "P2390", "text": ["Each read from external memory actually causes two PSEN low pulses and two ALE low pulses.  When the system is reading many memory locations sequentially, the last pulse of the previous read and the new pulse of the next read overlap.", "Each read from external memory actually causes two PSEN low pulses and two ALE low pulses. When the system is reading many memory locations sequentially, the last pulse of the previous read and the new pulse of the next read overlap."], "jumps": ["P2400", "P2270"]}, {"id": "P2400", "text": ["This is why there is an extra set at the end where no new read is needed.  This is where the microcontroller is actually performing operations internally.", "This is why there is an extra set at the end where no new read is needed. This is where the microcontroller is actually performing operations internally."], "jumps": ["P2410", "P2270"]}, {"id": "P2410", "text": ["14.  Leaving CH1 attached to the PSEN signal, use channel 2 and        verify each of the signals shown below.  Every time you                   connect to a new signal it may be necessary to adjust the               HOLD OFF control and trigger level.", "14. Leaving CH1 attached to the PSEN signal, use channel 2 and verify each of the signals shown below. Every time you connect to a new signal it may be necessary to adjust the HOLD OFF control and trigger level."], "jumps": ["P2420", "P2270"]}, {"id": "P2420", "text": ["From these signals you were able to observe the real-time operation of the memory control signals.", "From these signals you were able to observe the real-time operation of the memory control signals. Press F5 to see the schematic of 51 Family Microcontroller..", "Press Control S to see the schematic of 51 Family Microcontroller........................................................."], "jumps": ["P2430", "P2270"]}, {"id": "P2430", "text": ["Timing is important to make sure all operations are performed at the correct times.  Information on timing signals is normally supplied by the manufacturer inside the data book for that IC.", "Timing is important to make sure all operations are performed at the correct times. Information on timing signals is normally supplied by the manufacturer inside the data book for that IC."], "jumps": ["P2440", "P2420"]}, {"id": "P2440", "text": ["This type of information is vital for proper circuit operation and understanding."], "jumps": ["P2450", "P2420"]}, {"id": "P2450", "text": ["Now that you have looked at the signals of the system with the program that you have entered, you may want to press the reset button on the 8051 card and observe the system signals as the monitor program is looping through its \"wait for keypress\" routine."], "jumps": ["P2460", "P2420"]}, {"id": "P2460", "text": ["Also you can observe different signals as you press different keys on the 8051 keypad."], "jumps": ["P2470", "P2420"]}, {"id": "P2470", "text": ["In the next lesson you will perform a similar experiment looking at the IO circuitry connections and performance.  An important note about microcontroller operation is that memory and timing are required for the microcontroller to operate and perform actions.", "In the next lesson you will perform a similar experiment looking at the IO circuitry connections and performance. An important note about microcontroller operation is that memory and timing are required for the microcontroller to operate and perform actions."], "jumps": ["P2480", "P2420"]}, {"id": "P2480", "text": ["IO is not necessary, but gives the microcontroller functionality. This lesson described the necessary circuitry and signals that are required in every microcontroller system involving a 51 family microcontroller that doesn't have or use internal memory."], "jumps": ["P2500", "P2420"]}, {"id": "P2500", "text": ["1.  Disconnect the oscilloscope and logic probe from the                      experiment cards.", "1. Disconnect the oscilloscope and logic probe from the experiment cards.."], "jumps": ["P2510", "P2420"]}, {"id": "P2510", "text": ["2.  Return the Test Console to the initial control settings.", "2. Return the Test Console to the initial control settings................"], "jumps": ["P2500"]}, {"id": "P2520", "text": ["3.  Place Console Power to OFF.", "3. Place Console Power to OFF...to OFF...................."], "jumps": ["P2510"]}, {"id": "P2530", "text": ["4.  Remove cables and cards from the Model 130A Test                         Console.  Return all equipment to proper storage area.", "4. Remove cables and cards from the Model 130A Test Console. Return all equipment to proper storage area. )"], "jumps": ["P2910", "P2520"]}, {"id": "P2910", "text": ["This completes the experiment on 8051 MICROCONTROLLER.", "This completes the experiment on 8051 MICROCONTROLLER......"], "jumps": ["P2530"]}, {"id": "P4000", "text": ["SELECT A TOUCH AREA TO VIEW MORE DETAIL."], "jumps": ["P4001", "P4002", "P4003", "P4004", "P4005"]}, {"id": "P4001", "text": [], "jumps": []}, {"id": "P4002", "text": [], "jumps": []}, {"id": "P4003", "text": [], "jumps": []}, {"id": "P4004", "text": [], "jumps": []}, {"id": "P4005", "text": [], "jumps": []}, {"id": "P5000", "text": ["SELECT A TOUCH AREA TO VIEW MORE DETAIL."], "jumps": ["P5001", "P5002", "P5003", "P5004", "P5005"]}, {"id": "P5001", "text": [], "jumps": []}, {"id": "P5002", "text": [], "jumps": []}, {"id": "P5003", "text": [], "jumps": []}, {"id": "P5004", "text": [], "jumps": []}, {"id": "P5005", "text": [], "jumps": []}, {"id": "P6000", "text": ["SELECT A TOUCH AREA TO VIEW MORE DETAIL."], "jumps": ["P6001", "P6002", "P6003", "P6004", "P6005"]}, {"id": "P6001", "text": [], "jumps": []}, {"id": "P6002", "text": [], "jumps": []}, {"id": "P6003", "text": [], "jumps": []}, {"id": "P6004", "text": [], "jumps": []}, {"id": "P6005", "text": [], "jumps": []}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["Which signal is used in reading instructions from external memory to the 8051 microcontroller?"], "jumps": []}, {"id": "P10211", "text": ["Which signal is NOT used when reading data from external memory?"], "jumps": []}, {"id": "P10212", "text": ["a combination of internal and/or external memory."], "jumps": []}, {"id": "P10213", "text": ["The 8051 in the experiment used program code stored in _______"], "jumps": []}, {"id": "P10214", "text": ["Which type of logic gate is used in the Nida 8051 microcontroller circuit with the control signals of the 8051 to properly operate the external memory circuits?"], "jumps": []}, {"id": "P10215", "text": ["When you tie both inputs to a NAND gate together, what type of gate do you create?"], "jumps": []}, {"id": "P10216", "text": ["Which signal is used to restart the entire system?"], "jumps": []}, {"id": "P10217", "text": ["The reset condition is recognized when the input signal is in what condition?"], "jumps": []}, {"id": "P10218", "text": ["Which of the following statements is correct?", "Timing is not important in a microcontroller system.", "Memory uses a clock signal and randomly sends data to the 8051.", "Timing is very important for proper system operation.", "The 8051 system does not require a clock internal or external. }"], "jumps": []}, {"id": "P10219", "text": ["Which of the following statements is incorrect?", "The 8051 microcontroller is very similar to a microprocessor.", "The 8051 has many internal special registers.", "The 8051 Data bus is actually 32-bits. I"], "jumps": []}, {"id": "P10220", "text": ["Which signal latches an address into the address latches?"], "jumps": []}, {"id": "P10221", "text": ["Which of the statements is correct about an address latch?", "Even though 8 addresses lines go in, only 2 come out.", "The output is the last input when the latch was enabled.", "A latch is exactly the same as a NAND gate."], "jumps": []}, {"id": "P10222", "text": ["How many signals are used to connect memory to the 8051?", "Depends on how much memory, the memory size of the chips and many other factors."], "jumps": []}, {"id": "P10223", "text": ["How many RAM chips are in the 8051 microcontroller system presented in this lesson?"], "jumps": []}, {"id": "P10224", "text": ["Which of the following signals control the direction of data flow from memory to the microcontroller?"], "jumps": []}, {"id": "P10225", "text": ["How many external MEMORY chips are connected to the 8051 microcontroller system presented in this lesson?"], "jumps": []}, {"id": "P10226", "text": ["In the memory configuration used in the Nida 8051 system, A15 is used as the _______", "Chip Select between the RAM and EPROM. !"], "jumps": []}, {"id": "P10227", "text": ["If A15 was not inverted before being connected to the RAM IC, then _______", "RAM and EPROM would be switched in the memory map. ?", "nothing different would occur in the system.", "both the EPROM and the RAM would be activated at the same time."], "jumps": []}, {"id": "P10228", "text": ["Which of the following pins is not on the 8051 but on a memory chip?"], "jumps": []}, {"id": "P10229", "text": ["Which of the following pins is on the 8051 but not on a memory chip?"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to _________"], "jumps": []}, {"id": "P10410", "text": ["The purpose of this experiment is to investigate the various timing and memory control signals generated and/or used by the microcontroller.  By examining these signals, you can gain an understanding of their purpose as well as observe the microcontroller's memory access in action.", "1. 8051 Microcontroller Operationnnroller", "The purpose of this experiment is to investigate the various timing and memory control signals generated and/or used by the microcontroller. By examining these signals, you can gain an understanding of their purpose as well as observe the microcontroller's memory access in action...yistemtceinxamine various timing and memory control signals generated and/or used by the microcontroller."], "jumps": ["P13060", "P2001"]}, {"id": "P13060", "text": ["Let's begin the experiment!", "Let's begin the experiment!e..............................."], "jumps": ["P13070", "P13040"]}, {"id": "P13070", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13060"]}, {"id": "P13080", "text": ["2. Insert the following 130 experiment cards on the test console. a. Insert PC130-405 51 Family Microcontroller card in the PC1 position. b. Insert PC130-406 Keyboard and Display card in the PC2 position. c. Insert PC130-407 Microcontroller I/O and Interface card in the PC3 position."], "jumps": ["P13090"]}, {"id": "P13090", "text": ["3. Connect the three experiment cards with the flat ribbon cables as follows: a. Using the first 34 pin ribbon cable, connect PC130-405 J1 to PC130-406 J1. b. Using the second 34 pin ribbon cable, connect PC130-406 J2 to PC130-407 J1."], "jumps": ["P13100", "P13080"]}, {"id": "P13100", "text": ["4.  Press enter to set: Positive Supply Voltage - 15 \n                                         Negative Supply Voltage - 15", "4. Press enter to set: Positive Supply Voltage - 15 Negative Supply Voltage - 15"], "jumps": ["P13090"]}, {"id": "P13110", "text": ["5.  Press enter to set: PC3 DC Power Switch - ON", "5. Press enter to set: PC3 DC Power Switch - ONN.........................."], "jumps": []}, {"id": "P13120", "text": ["6.  Press enter to set: PC2 DC Power Switch - ON", "6. Press enter to set: PC2 DC Power Switch - ON..........................."], "jumps": []}, {"id": "P13130", "text": ["7.  Press enter to set: PC1 DC Power Switch - ON", "7. Press enter to set: PC1 DC Power Switch - ONN.........................."], "jumps": []}, {"id": "P13135", "text": ["In the first part of this lesson, you were introduced to the IC's and signals that interface with memory on the 8051 trainer.", "8. The microcontroller system is now assembled and operating. You should see the message \"NIDA 51:\" in the LCD display on the PC130-406 card. If the message is dim or blank, try adjusting the Display Intensity potentiometer R4 on the PC130-406 card using a small screwdriver. If you still cannot see the message, see your instructor for assistance. TE If, at any time during the experiment, you short some of the IC pins together while observing the signals, press the reset button. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run it again before proceeding with your measurements.", "If, at any time during the experiment, you short some of the IC pins together while observing the signals, press the reset button. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run it again before proceeding with your measurements. Before trying to measure a signal from the actual IC pin, look at the test point banks on the PC card. d then run the program before proceeding with your measurements.....nts."], "jumps": ["P13140", "P13150", "P13135"]}, {"id": "P13150", "text": ["These chips include RAM, EPROM, a latch, and logic.  In this section of the experiment we are going to look at a few of the signals associated with these chips to understand the importance of their use in the system.", "These chips include RAM, EPROM, a latch, and logic. In this section of the experiment we are going to look at a few of the signals associated with these chips to understand the importance of their use in the system."], "jumps": ["P13160", "P13140"]}, {"id": "P13160", "text": ["To view the signals, we need to make them periodic.  This means the same signal patterns repeat over and over, allowing us to see them on an oscilloscope.", "To view the signals, we need to make them periodic. This means the same signal patterns repeat over and over, allowing us to see them on an oscilloscope."], "jumps": ["P13165", "P13140"]}, {"id": "P13165", "text": ["To make periodic patterns with the signals of interest, we will enter a program which repeats the same actions."], "jumps": ["P13170", "P13140"]}, {"id": "P13170", "text": ["9.   Press the RESET button on the PC130-405 card.  You will               enter a program into memory for execution by the 8051                    microcontroller.  The help button will lead you to a summary          on entering programs into the 8051.", "9. Press the RESET button on the PC130-405 card. You will enter a program into memory for execution by the 8051 microcontroller. The help button will lead you to a summary on entering programs into the 8051."], "jumps": ["P13180", "P13140", "P13175"]}, {"id": "P13175", "text": ["INSTRUCTIONS FOR ENTERING PROGRAMS: 1. Press EDIT on the PC130-406 Keyboard and Display experiment card and enter the desired SEGMENT or OFFSET. A SEGMENT such as 1000 may be entered as 1000:, 1000:0, or 1000:0000. An OFFSET such as 1000 may be entered as 1000, :1000, or 0000:1000. 2. Press ENTER after the desired SEGMENT or OFFSET has been entered. The display will now show the SEGMENT at the top of the display along with OFFSET and stored OPCODE at the bottom of the display. NOTE: Every time you enter an OPCODE and press ENTER, you automatically move to the next OFFSET. Additionally, there are three things that can be done at any SEGMENT and OFFSET: Enter an new value and press ENTER, press the down arrow to move to the next OFFSET, or press the up arrow to move the previous OFFSET. 3. Enter all of the desired OPCODES for the program remembering to press ENTER after each. 4. After all OPCODES of the program have been entered, press the STOP key. 5. The program has now been stored in memory. To verify the program has been stored correctly, press the DISPLAY R.M. key, enter the starting address of the program, and press ENTER. All OPCODES for that location, as well for the next 17 locations, will be displayed. biles, automobile parts, and automobile maintenance. Draws up orders and checks automobile prior to delivery. Advertising and telephone marketing may be required at slow times. Environment - Clean well lighted showroom or outside on a lot. Evenings, days and weekends. Requirements - Must be able to maintain a pleasant attitude with people under stressful conditions. Good personal appearance and manners are important."], "jumps": []}, {"id": "P13180", "text": ["10.  Enter the following program into memory starting at \"8000\".          (EDIT, 8000, enter values with an ENTER after each one,                  STOP.)", "10. Enter the following program into memory starting at \"8000\". (EDIT, 8000, enter values with an ENTER after each one, STOP.)", "Moves the value 0Ah into the A register. Moves the memory location 8100 into the DPTR, or data pointer register. Moves value in A to memory. Jump back to the beginning of this program at location 8000 or RAM.", "MOV A, #Ah MOV DPRT, #8100h MOVX @ DPTR,A JMP #8000h"], "jumps": ["P13190", "P13170"]}, {"id": "P13190", "text": ["11.  Run the program you just entered.  This is done by pressing          the RUN key and entering the starting address of the                        program, \"8000\".", "11. Run the program you just entered. This is done by pressing the RUN key and entering the starting address of the program, \"8000\"."], "jumps": ["P13200", "P13180"]}, {"id": "P13200", "text": ["The display of the 8051 should be frozen.  The program you ran is now in an infinite loop performing the same four functions over and over.", "The display of the 8051 should be frozen. The program you ran is now in an infinite loop performing the same four functions over and over.", "1. Move the value 0A into the A register. 2. Put the address 8100 into the data pointer register. 3. Write the value in A to the memory location pointed at by the data pointer. 4. Go back to the first instructionnnnnnn"], "jumps": ["P13210", "P13190"]}, {"id": "P13210", "text": ["Again, this loop allows us to look at signals in the system since they are now periodic."], "jumps": ["P13220", "P13200"]}, {"id": "P13220", "text": ["Note that during normal operation, with exception of the clock signals, microcontroller signals are not periodic.  To view non-periodic signals, logic analyzers can be used.  Generally, logic analyzers are much more expensive than oscilloscopes.", "Note that during normal operation, with exception of the clock signals, microcontroller signals are not periodic. To view non-periodic signals, logic analyzers can be used. Generally, logic analyzers are much more expensive than oscilloscopes."], "jumps": ["P13230", "P13200"]}, {"id": "P13230", "text": ["Many technicians will run a short program that makes the microcontroller's output signals periodic so that they can be analyzed using an oscilloscope."], "jumps": ["P13240", "P13200"]}, {"id": "P13240", "text": ["The next step requires precision tuning of your oscilloscope. The instructions presented here are general in nature and the waveforms shown below should help you acquire the actual waveforms.", "The next step requires precision tuning of your oscilloscope. The instructions presented here are general in nature and the waveforms shown below should help you acquire the actual waveforms...n below to help you get them. are shown below to help you get them."], "jumps": ["P13250", "P13200"]}, {"id": "P13250", "text": ["12.  Set your oscilloscope to 2 ms, dual channel, 0.5 volts and DC          coupling.  Make sure you use x10 oscilloscope probes set to         the 10X setting.  This will keep the oscilloscope from                         affecting the operation of the system.  Set the oscilloscope             to trigger from channel 1.", "12. Set your oscilloscope to 2 ms, dual channel, 0.5 volts and DC coupling. Make sure you use x10 oscilloscope probes set to the 10X setting. This will keep the oscilloscope from affecting the operation of the system. Set the oscilloscope to trigger from channel 1.", "If you cannot get the waveforms to stabilize, change the coupling switch of the oscilloscope through its settings. The hold off and trigger level adjustments are also very important in measuring these waveforms.t reenter the program and then run it again before proceeding with your measurements. Before trying to measure a signal from the actual IC pin, look at the test point banks on the PC card. d then run the program before proceeding with your measurements.....nts."], "jumps": ["P13255", "P13240"]}, {"id": "P13255", "text": ["At any time during the remainder of the lesson you may press Ctrl S to view the schematic diagram of 8051 family microcontroller."], "jumps": ["P13260", "P13250"]}, {"id": "P13260", "text": ["13.  Connect CH1 of your oscilloscope to the PSEN signal on                the PC130-405 card.  Use the HOLD OFF control adjusting it           very slowly to get the PSEN signal similar to the one shown           below.", "13. Connect CH1 of your oscilloscope to the PSEN signal on the PC130-405 card. Use the HOLD OFF control adjusting it very slowly to get the PSEN signal similar to the one shown below."], "jumps": ["P13270", "P13255"]}, {"id": "P13270", "text": ["From the graphic below and the knowledge of the program you entered, you can easily see the operations being performed by the microcontroller."], "jumps": ["P13280", "P13260"]}, {"id": "P13280", "text": ["A15 is always HIGH indicating that we are reading/writing to RAM.  Remember that A15 is inverted and attached to the CS (chip select) pin of the RAM chip.  Notice also that the RD line never goes low.", "A15 is always HIGH indicating that we are reading/writing to RAM. Remember that A15 is inverted and attached to the CS (chip select) pin of the RAM chip. Notice also that the RD line never goes low."], "jumps": ["P13290", "P13270"]}, {"id": "P13290", "text": ["You may be wondering how it is reading information from RAM. Remember that external instructions are read with the PSEN signal.  We are only reading instructions and their information.", "You may be wondering how it is reading information from RAM. Remember that external instructions are read with the PSEN signal. We are only reading instructions and their information."], "jumps": ["P13300", "P13270"]}, {"id": "P13300", "text": ["If we were trying to read data from RAM and not instructions, the RD signal would go low and not the PSEN signal."], "jumps": ["P13310", "P13270"]}, {"id": "P13310", "text": ["The first two low pulses of the ALE and PSEN signal load 74 into the instruction register and 0A into a temporary register.  The next pulse performs the action which moves 0A into the accumulator (A).", "The first two low pulses of the ALE and PSEN signal load 74 into the instruction register and 0A into a temporary register. The next pulse performs the action which moves 0A into the accumulator (A)."], "jumps": ["P13320", "P13270"]}, {"id": "P13320", "text": ["The next three pulses of these signals load the next instruction and its immediate data.  Note that this data is considered part of the instruction which is why the RD line is not active (low).", "The next three pulses of these signals load the next instruction and its immediate data. Note that this data is considered part of the instruction which is why the RD line is not active (low)."], "jumps": ["P13330", "P13270"]}, {"id": "P13330", "text": ["The next pulse is the instruction being performed which moves the16-bit value 8100 into the DPTR register. The next pulse loads the instruction F0 which is MOV @ DPTR,A. This will take the value stored in A and put it into the memory pointed to by DPTR.", "The next pulse is the instruction being performed which moves the16-bit value 8100 into the DPTR register.  The next pulse loads the instruction F0 which is MOV @ DPTR,A.  This will take the value stored in A and put it into the memory pointed  to by DPTR."], "jumps": ["P13340", "P13270"]}, {"id": "P13340", "text": ["Since we are writing data to external memory, the PSEN signal is not needed. You can see that the WR signal goes low and the ALE signal goes low. This indicates the writing of information to RAM.  Notice how much longer this instruction takes.", "Since we are writing data to external memory, the PSEN signal is not needed.  You can see that the WR signal goes low and the ALE signal goes low.  This indicates the writing of information to RAM.  Notice how much longer this instruction takes.", "Since we are writing data to external memory, the PSEN signal is not needed. You can see that the WR signal goes low and the ALE signal goes low. This indicates the writing of information to RAM. Notice how much longer this instruction takes."], "jumps": ["P13350", "P13270"]}, {"id": "P13350", "text": ["Internal memory transfers are much faster.  After this, the last instruction and data is read which is three bytes long.  This accounts for the three low pulses of PSEN and ALE which load the instruction and information.", "Internal memory transfers are much faster. After this, the last instruction and data is read which is three bytes long. This accounts for the three low pulses of PSEN and ALE which load the instruction and information."], "jumps": ["P13360", "P13270"]}, {"id": "P13360", "text": ["The last low pulse loads the value 8000 into the program counter (PC) and returns to the beginning of this program.  This is the periodic program that you entered into the system.", "The last low pulse loads the value 8000 into the program counter (PC) and returns to the beginning of this program. This is the periodic program that you entered into the system."], "jumps": ["P13370", "P13270", "PC"]}, {"id": "P13370", "text": ["Two additional observations need to be discussed regarding the ALE and PSEN signal.  ALE is address latch enable which means when it is high the address on the address/data bus needs to be latched by the latches.  This is why the PSEN signal does not go low until after the ALE signal has gone low.", "Two additional observations need to be discussed regarding the ALE and PSEN signal. ALE is address latch enable which means when it is high the address on the address/data bus needs to be latched by the latches. This is why the PSEN signal does not go low until after the ALE signal has gone low."], "jumps": ["P13380", "P13270"]}, {"id": "P13380", "text": ["This makes sure that the address information is valid.  Second is the extra low pulse of PSEN and ALE when the microprocessor is performing the action.  This has to do with the design of the system.", "This makes sure that the address information is valid. Second is the extra low pulse of PSEN and ALE when the microprocessor is performing the action. This has to do with the design of the system."], "jumps": ["P13390", "P13270"]}, {"id": "P13390", "text": ["Each read from external memory actually causes two PSEN low pulses and two ALE low pulses.  When the system is reading many memory locations sequentially, the last pulse of the previous read and the new pulse of the next read overlap.", "Each read from external memory actually causes two PSEN low pulses and two ALE low pulses. When the system is reading many memory locations sequentially, the last pulse of the previous read and the new pulse of the next read overlap."], "jumps": ["P13400", "P13270"]}, {"id": "P13400", "text": ["This is why there is an extra set at the end where no new read is needed.  This is where the microcontroller is actually performing operations internally.", "This is why there is an extra set at the end where no new read is needed. This is where the microcontroller is actually performing operations internally."], "jumps": ["P13410", "P13270"]}, {"id": "P13410", "text": ["14.  Leaving CH1 attached to the PSEN signal, use channel 2 and        verify each of the signals shown below.  Every time you                   connect to a new signal it may be necessary to adjust the               HOLD OFF control and trigger level.", "14. Leaving CH1 attached to the PSEN signal, use channel 2 and verify each of the signals shown below. Every time you connect to a new signal it may be necessary to adjust the HOLD OFF control and trigger level."], "jumps": ["P13420", "P13270"]}, {"id": "P13420", "text": ["From these signals you were able to observe the real-time operation of the memory control signals.", "From these signals you were able to observe the real-time operation of the memory control signals. Select F2 to see the schematic of 51 Family Microcontroller.", "Press F5 to see the schematic of 51 Family Microcontroller................................................................"], "jumps": ["P13430", "P13270"]}, {"id": "P13430", "text": ["Timing is important to make sure all operations are performed at the correct times.  Information on timing signals is normally supplied by the manufacturer inside the data book for that IC.", "Timing is important to make sure all operations are performed at the correct times. Information on timing signals is normally supplied by the manufacturer inside the data book for that IC."], "jumps": ["P13440", "P13420"]}, {"id": "P13440", "text": ["This type of information is vital for proper circuit operation and understanding."], "jumps": ["P13450", "P13420"]}, {"id": "P13450", "text": ["Now that you have looked at the signals of the system with the program that you have entered, you may want to press the reset button on the 8051 card and observe the system signals as the monitor program is looping through its \"wait for keypress\" routine."], "jumps": ["P13460", "P13420"]}, {"id": "P13460", "text": ["Also you can observe different signals as you press different keys on the 8051 keypad."], "jumps": ["P13470", "P13420"]}, {"id": "P13470", "text": ["In the next lesson you will perform a similar experiment looking at the IO circuitry connections and performance.  An important note about microcontroller operation is that memory and timing are required for the microcontroller to operate and perform actions.", "In the next lesson you will perform a similar experiment looking at the IO circuitry connections and performance. An important note about microcontroller operation is that memory and timing are required for the microcontroller to operate and perform actions."], "jumps": ["P13480", "P13420"]}, {"id": "P13480", "text": ["IO is not necessary, but gives the microcontroller functionality. This lesson described the necessary circuitry and signals that are required in every microcontroller system involving a 51 family microcontroller that doesn't have or use internal memory."], "jumps": ["P13500", "P13420"]}, {"id": "P13500", "text": ["1.  Disconnect the oscilloscope and logic probe from the                      experiment cards.", "1. Disconnect the oscilloscope and logic probe from the experiment cards......"], "jumps": ["P13420"]}, {"id": "P13520", "text": ["2.  Place the Test Console Power to OFF.", "2. Place the Test Console Power to OFF...................................."], "jumps": []}, {"id": "P13530", "text": ["3.  Remove cables and cards from the Model 130E Test                         Console.  Return all equipment to proper storage area.", "3. Remove cables and cards from the Model 130E Test Console. Return all equipment to proper storage area."], "jumps": ["P13910", "P13520"]}, {"id": "P13910", "text": ["This completes the experiment on 8051 MICROCONTROLLER.", "This completes the experiment on 8051 MICROCONTROLLER......"], "jumps": ["P13530"]}, {"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 08-30-99 Branched F5 key and schematics. ben 09-24-99 Reviewed and made changes. debbie 02-21-00 Turned scroll bar off - lisa 06-06-00 Question format. -Penny 07-14-00 Converted to ToolBook 7.1 format. jay 07-21-00 Changed Book Script for Ctrl S schematic - lisa 10-27-00 Add Monitor Pro code to quiz pages. jay 12-05-00 Added HelpPage and new random gen. script. -Penny 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-12-02 Checked for convertion errors. John Ayala 06-24-02 Review - lisa 07-09-04 P2910, P13910, added eox script - patty", "07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 08-30-99 Branched F5 key and schematics. ben 09-24-99 Revie let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
</body>
</html>
