<script>
const book = {"title": "9395Z103", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: IGNITION SYSTEMsdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Identify the types of ignition systems. w Describe the principles of spark discharge and coil ignition systems. w Describe the types of magneto ignition systems. w Describe the principles of gas turbine ignition systems.", "w Describe the principles of operation of ignition systems. w State the advantages and disadvantages of high and low tension magneto systems......"], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["Ignition systems are designed to ignite fuel in a proper sequence for reciprocating engines, and initially for a turbine engine.", "Without the proper ignition of fuel, engines would not operate properly and be very inefficient.", "In this lesson we are going to look at the different ignition systems for reciprocating and turbine type engines."], "jumps": ["P410", "P300", "P420", "P400", "P430"]}, {"id": "P430", "text": ["Let's begin the lesson on IGNITION SYSTEMS................................"], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": ["An ignition system provides a spark or charge to ignite fuel in an engine."], "jumps": ["P1025", "P1001"]}, {"id": "P1025", "text": ["Aircraft engines use a high voltage electrical charge to ignite the fuel-air mixture. This power requirement is provided by one of three ignition methods; battery ignition, magneto ignition, or turbine engine ignition.", "A battery or generator connected to a coil is called a battery ignition.  One disadvantage to this method is that an external power source is required to generate a spark.  Battery ignition systems are not self-contained.", "A magneto ignition is an AC generator that uses a permanent magnet to produce a high voltage spark.", "A battery or generator connected to a coil is called a battery ignition. One disadvantage to this method is that an external power source is required to generate a spark. Battery ignition systems are not self-contained."], "jumps": ["P1030", "P1020", "P1025", "P1040", "P1045"]}, {"id": "P1045", "text": ["The magneto system has two advantages over the battery ignition; it produces a hotter spark and it is self-contained which means it does not require an external power source."], "jumps": ["P1050", "P1040"]}, {"id": "P1050", "text": ["The third method is used primarily on gas-turbine engines.  The turbine ignition system is only required for initial start up of     engines and after engine flame out, unlike battery and magneto    ignition systems.", "The third method is used primarily on gas-turbine engines. The turbine ignition system is only required for initial start up of engines and after engine flame out, unlike battery and magneto ignition systems."], "jumps": ["P1055", "P1040"]}, {"id": "P1055", "text": ["The gas-turbine ignition system uses a high energy capacitor discharge system to produce a hot ball of fire at the ignitor."], "jumps": ["P1060", "P1050"]}, {"id": "P1060", "text": ["All aircraft are fitted with two identical (redundant) ignition systems for reliability and increased engine power.  Let's look at  how each system is used in the aircraft.", "All aircraft are fitted with two identical (redundant) ignition systems for reliability and increased engine power. Let's look at how each system is used in the aircraft."], "jumps": ["P1070", "P1050"]}, {"id": "P1065", "text": ["The battery ignition system is made of; a battery or generator, ignition switch, induction ignition coil, distributor, cam operated   contact points, condenser capacitor, and spark plugs.", "REDUNDANT - Duplication or repetition of the electrical or mechanical systems to provide alternative functional channels in case of failure.", "The battery ignition system is made of; a battery or generator, ignition switch, induction ignition coil, distributor, cam operated contact points, condenser capacitor, and spark plugs."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["The battery ignition system uses an induction ignition coil to increase the supplied 12 VDC from the battery to a voltage high    enough to ignite the fuel/air mixture in the cylinder.", "The battery ignition system uses an induction ignition coil to increase the supplied 12 VDC from the battery to a voltage high enough to ignite the fuel/air mixture in the cylinder."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["The induction ignition coil continuously sends pulses of high voltage to the distributor.  The distributor properly sequences the voltages to the engine cylinders.", "The induction ignition coil continuously sends pulses of high voltage to the distributor. The distributor properly sequences the voltages to the engine cylinders."], "jumps": ["P1100", "P1070"]}, {"id": "P1100", "text": ["The distributor directs high voltage pulses to the engine cylinders in the correct sequence as the pistons approach top dead center.", "The distributor directs high voltage pulses to the engine cylinders in the correct sequence as the pistons approach top dead center."], "jumps": ["P1110", "P1070"]}, {"id": "P1105", "text": ["TOP DEAD CENTER - A piston that is at maximum distance from the center of the crankshaft and in the center of the \"no travel zone\"."], "jumps": []}, {"id": "P1110", "text": ["A set of cam operated contact points are used to ensure the induction ignition coil sends a pulse to the distributor at the      correct time, to ignite fuel in the cylinder.", "A set of cam operated contact points are used to ensure the induction ignition coil sends a pulse to the distributor at the correct time, to ignite fuel in the cylinder."], "jumps": ["P1120", "P1070"]}, {"id": "P1120", "text": ["The primary capacitor (condenser) prolongs the life of the contact points by reducing the chance of electrical arcing during operation."], "jumps": ["P1130", "P1070"]}, {"id": "P1130", "text": ["Each cylinder has at least one spark plug to deliver the high voltage pulse to the cylinder's combustion chamber."], "jumps": ["P1140", "P1070"]}, {"id": "P1140", "text": ["Spark plugs cause the high voltage pulse to arc or jump across two points and make contact with the fuel for ignition."], "jumps": ["P1150", "P1070"]}, {"id": "P1150", "text": ["What ensures that the inductor ignition coil sends a high voltage pulse at the correct time?"], "jumps": ["P1070"]}, {"id": "P1151", "text": ["Distributor directs high voltage pulses to the engine cylinders in the correct sequences of the piston position.", "Spark plugs deliver the high voltage pulse to the cylinder's combustion chamber to make contact with the fuel/air mixture for ignition.", "Spark plugs deliver the high voltage pulse to the cylinder's combustion chamber to make contact with the fuel/air mixture for ignition....."], "jumps": ["P"]}, {"id": "P1160", "text": ["What increases the battery voltage to a high voltage pulse?"], "jumps": ["P1150"]}, {"id": "P1161", "text": ["The distributor directs high voltage pulses to the engine cylinders in the correct sequence of the piston position.", "To insure the high voltage pulse is sent at the correct time, the distributor requires a set of contact point.", "Magnetos are a special type of generator that produce high voltage pulses needed for fuel ignition without an outside power source."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["Unlike the battery ignition, a high tension magneto ignition system contains the contact points, coil, distributor block and condenser in one housing or assembly.", "With the use of magnets and a coil the high voltage pulse is produced in the magneto.  A cam operated set of contact points are used to control the sequence of pulses from the coil to coincide with the firing order of the distributor block.", "Magnetos are classified as either Low Tension or High Tension systems. Low tension systems produce low voltage from the magneto. Low voltage boosted to a high voltage by a transformer in the harness. High tension systems produce a high voltage in the magneto. The voltage is high enough to ignite the fuel and no amplification is required.", "With the use of magnets and a coil the high voltage pulse is produced in the magneto. A cam operated set of contact points are used to control the sequence of pulses from the coil to coincide with the firing order of the distributor block."], "jumps": ["P1190", "P1170", "P1200", "P1220"]}, {"id": "P1220", "text": ["Without the contact points, the coil may not send a pulse when the distributor block is ready to ignite the fuel in a cylinder.  In       other words, the timing would be off.", "The primary capacitor (condenser) prolongs the life of the contact points by reducing the chance of electrical arcing between the points.", "The rotation of the magneto magnet at initial start up is not sufficient to produce a high ignition voltage.  Auxiliary ignition     systems such as the booster coil and starting vibrator are used    during engine start up.", "Without the contact points, the coil may not send a pulse when the distributor block is ready to ignite the fuel in a cylinder. In other words, the timing would be off.", "The rotation of the magneto magnet at initial start up is not sufficient to produce a high ignition voltage. Auxiliary ignition systems such as the booster coil and starting vibrator are used during engine start up."], "jumps": ["P1230", "P1170", "P1240", "P1250"]}, {"id": "P1250", "text": ["Because the aircraft has dual ignition systems, an ignition switch is used to select one or both magnetos for operation."], "jumps": ["P1260", "P1170"]}, {"id": "P1260", "text": ["The harness has shielded high tension wires used to deliver the high voltage pulse to the spark plugs of each cylinder.  The harness is also insulated to prevent shorting of the high voltage pulse to the frame of the aircraft.", "The operation of the low tension magneto system is similar to the high tension system, with the exception of the way the coil and harness are used.", "The harness has shielded high tension wires used to deliver the high voltage pulse to the spark plugs of each cylinder. The harness is also insulated to prevent shorting of the high voltage pulse to the frame of the aircraft."], "jumps": ["P1270", "P1170", "P1280"]}, {"id": "P1280", "text": ["A low tension magneto ignition system contains the contact points, distributor block and condenser in one housing or assembly called a magneto."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["The low tension system uses a coil at each engine cylinder to boost the low voltage signal from the distributor to a high voltage pulse."], "jumps": ["P1300", "P1270"]}, {"id": "P1300", "text": ["When the magneto's contact points energize, the distributor directs the low voltage signal from the magneto to the correct cylinder coil which boosts the signal to a high voltage pulse."], "jumps": ["P1310", "P1270"]}, {"id": "P1310", "text": ["The harness (made of low tension wire) connects the distributor block to the coils.  A short length of high tension cable is used to connect the coils to the spark plugs.", "The harness (made of low tension wire) connects the distributor block to the coils. A short length of high tension cable is used to connect the coils to the spark plugs."], "jumps": ["P1320", "P1270"]}, {"id": "P1320", "text": ["What type of magneto contains the contact points, high voltage coil, distributor block and condenser in one housing or assembly?"], "jumps": ["P1270"]}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1322", "text": ["A low tension magneto ignition system contains the contact points, low voltage coil, distributor block, and condenser in one housing or assembly."], "jumps": []}, {"id": "P1330", "text": ["What type of magneto has a coil for each engine cylinder?", "What type of magneto has a coil for each engine cylinder?.."], "jumps": ["P1320"]}, {"id": "P1331", "text": [], "jumps": []}, {"id": "P1332", "text": ["A high tension magneto has a coil located in the housing and sends a high voltage pulse to each cylinder through the distributor."], "jumps": []}, {"id": "P1340", "text": ["Gas Turbine Ignition Gas turbine ignition systems are used for engine ground start and restart after a flame out during flight."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["Gas turbine ignition systems use a high energy capacitor discharge system to produce a white hot ball of fire at the electrode of the igniter."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["The gas turbine ignition system is comprised of a High Energy Ignition Unit (exciter) and an igniter."], "jumps": ["P1370", "P1340"]}, {"id": "P1370", "text": ["Like other ignition systems, each turbine engine is fitted with a dual ignition system for redundancy and efficiency.  Each engine is also equipped with two exciters and two igniters.", "Like other ignition systems, each turbine engine is fitted with a dual ignition system for redundancy and efficiency. Each engine is also equipped with two exciters and two igniters."], "jumps": ["P1380", "P1340"]}, {"id": "P1380", "text": ["The exciter contains a series of circuits to increase the electrical current to support ignition of the jet fuel during varying atmospheric conditions."], "jumps": ["P1390", "P1340"]}, {"id": "P1390", "text": ["Igniters perform the same function as a spark plug does. However, igniters provide a flash over or a ball of fire instead of a spark between two contacts."], "jumps": ["P1400", "P1340"]}, {"id": "P1400", "text": ["The exciter charges and holds the charge until the required current limit is met before it discharges into the igniter.  This cycle occurs every second until the engine is started.", "The exciter charges and holds the charge until the required current limit is met before it discharges into the igniter. This cycle occurs every second until the engine is started."], "jumps": ["P1910", "P1340"]}, {"id": "P1910", "text": ["This completes the information on IGNITION SYSTEMS.", "This completes the information on IGNITION SYSTEMS........."], "jumps": ["P1001", "P1340"]}, {"id": "P1920", "text": ["1.  The battery, magneto, and gas turbine engine igniter, are the          three types of aircraft ignition systems.", "2.  All aircraft are equipped with two or dual identical ignition               systems for redundancy and increased engine performance.", "1. The battery, magneto, and gas turbine engine igniter, are the three types of aircraft ignition systems.", "2. All aircraft are equipped with two or dual identical ignition systems for redundancy and increased engine performance."], "jumps": ["P1930", "P1001", "P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Magnetos are classified as either Low or High Tension.", "3. Magnetos are classified as either Low or High Tension.m"], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  A cam operated set of contact points are used to control the          sequence of pulses from the coil to coincide with the firing             order of the distributor block.", "4. A cam operated set of contact points are used to control the sequence of pulses from the coil to coincide with the firing order of the distributor block."], "jumps": ["P1960", "P1930"]}, {"id": "P1960", "text": ["5.  Low tension magneto ignition use a coil for each engine                 cylinder to send the high voltage pulse directly to a spark               plug.", "5. Low tension magneto ignition use a coil for each engine cylinder to send the high voltage pulse directly to a spark plug."], "jumps": ["P1970", "P1930"]}, {"id": "P1970", "text": ["6.  Gas turbine ignition systems are used for engine ground start       and restart after a flame out during flight.  A high energy                  capacitor discharge system is used to produce a hot ball of            fire at the igniter.", "6. Gas turbine ignition systems are used for engine ground start and restart after a flame out during flight. A high energy capacitor discharge system is used to produce a hot ball of fire at the igniter."], "jumps": ["P1999", "P1930"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1970"]}, {"id": "P2001", "text": ["By now you should have a basic understanding of an aircraft ignition system.  Let's take a closer look at the components to get a better understanding of operation.", "By now you should have a basic understanding of an aircraft ignition system. Let's take a closer look at the components to get a better understanding of operation."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["The battery ignition system must have an external power source like the battery and/or generator to supply electrical current to the induced ignition coil."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["The electrical current enters the induction ignition coil through the primary winding.  The secondary winding is connected to the primary winding via a flux linkage.", "The electrical current enters the induction ignition coil through the primary winding. The secondary winding is connected to the primary winding via a flux linkage."], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["The flux linkage is the invisible magnetic field, commonly known as the lines of flux produced from the energized winding."], "jumps": ["P2060", "P2030"]}, {"id": "P2060", "text": ["An iron core is used to assist the flux linkage between the windings.  The iron core develops a heavy concentration of flux lines by providing a path of least resistance.", "An iron core is used to assist the flux linkage between the windings. The iron core develops a heavy concentration of flux lines by providing a path of least resistance."], "jumps": ["P2070", "P2030"]}, {"id": "P2070", "text": ["The primary winding has fewer coil turns than the secondary winding, which increases the flux linkage of the secondary winding and increases the induced voltage."], "jumps": ["P2080", "P2030"]}, {"id": "P2080", "text": ["Induced voltage is created when the lines of flux are changing.  In other words, when the voltage fluctuates at the primary winding a higher voltage is produced at the secondary winding.", "Induced voltage is created when the lines of flux are changing. In other words, when the voltage fluctuates at the primary winding a higher voltage is produced at the secondary winding."], "jumps": ["P2090", "P2030"]}, {"id": "P2090", "text": ["The cam operated contact points provide the changing flux linkage needed to increase the voltage in the coil.  The cam is mechanically connected to the engine and opens the contact points at the correct time for ignition of the cylinder.", "The cam operated contact points provide the changing flux linkage needed to increase the voltage in the coil. The cam is mechanically connected to the engine and opens the contact points at the correct time for ignition of the cylinder."], "jumps": ["P2100", "P2030"]}, {"id": "P2100", "text": ["When the high point of the cam makes contact with the points, the points open and stop current flow through the primary winding.  The developed lines of flux collapse and induce current into the secondary winding.", "When the high point of the cam makes contact with the points, the points open and stop current flow through the primary winding. The developed lines of flux collapse and induce current into the secondary winding."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["As the cam continues to rotate, the contact points close allowing current to flow through the ignition coil's primary winding to        develop the lines of flux and repeat the cycle.", "As the cam continues to rotate, the contact points close allowing current to flow through the ignition coil's primary winding to develop the lines of flux and repeat the cycle."], "jumps": ["P2120", "P2090"]}, {"id": "P2120", "text": ["The operation of the contact points are very quick and provide the induction ignition coil with the needed change of flux linkage to produce a higher voltage at the correct time for ignition."], "jumps": ["P2130", "P2090"]}, {"id": "P2130", "text": ["The distributor has a rotor button that is mechanically connected to the engine.  Current from the induction ignition coil enters the distributor through the top of the rotor button.", "As the rotor button rotates, it comes in contact with the cylinder leads connected to the distributor, which are also timed with induction ignition coil discharge.", "The distributor has a rotor button that is mechanically connected to the engine. Current from the induction ignition coil enters the distributor through the top of the rotor button."], "jumps": ["P2140", "P2120", "P2150", "P2130"]}, {"id": "P2150", "text": ["The high voltage is sent to the spark plug to ignite the fuel/air mixture in the cylinder.  Spark plugs have electrodes, a ceramic    insulator and a metal shell.", "The high voltage is sent to the spark plug to ignite the fuel/air mixture in the cylinder. Spark plugs have electrodes, a ceramic insulator and a metal shell."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["Voltage enters through the terminal connection located on the top of the spark plug.  The terminal is connected to the center electrode that extends beyond the bottom section of the spark plug.", "Voltage enters through the terminal connection located on the top of the spark plug. The terminal is connected to the center electrode that extends beyond the bottom section of the spark plug."], "jumps": ["P2170", "P2140"]}, {"id": "P2170", "text": ["The spark plug insulator prevents the loss of voltage to ground before it enters the cylinder."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["The spark plug shell is threaded into the cylinder head and is grounded to the engine.  High voltage current from the distributor enters the center electrode and arcs to the shell electrode inside  the engine cylinder.", "The spark plug shell is threaded into the cylinder head and is grounded to the engine. High voltage current from the distributor enters the center electrode and arcs to the shell electrode inside the engine cylinder."], "jumps": ["P2190", "P2160"]}, {"id": "P2190", "text": ["High voltage is produced when the lines of flux is changed in the _______ of the induced ignition coil."], "jumps": ["P2160"]}, {"id": "P2191", "text": [], "jumps": []}, {"id": "P2192", "text": ["When the voltage fluctuates at the primary windings a higher voltage is produced at the secondary winding."], "jumps": []}, {"id": "P2200", "text": ["What aligns the induced ignition coil with the correct cylinder for ignition?"], "jumps": ["P2190"]}, {"id": "P2201", "text": ["The cam opens and closes the contact points to control the high voltage from the induced ignition coil.", "The contact points control the high voltage from the induced ignition coil changing the induced ignition coil flux linkages.", "The secondary winding are located in the induced ignition coil and are used to produce a high voltage current for ignition."], "jumps": []}, {"id": "P2210", "text": ["The magneto ignition systems operation is similar to the battery, except its power source is self contained and the coil may be        internal or external to the magneto.", "The magneto ignition systems operation is similar to the battery, except its power source is self contained and the coil may be internal or external to the magneto."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["Magnetos use the lines of flux from a fixed or moving magnet to generate voltage.  If the magnet is stationary then the coil must be in motion.", "Magnetos use the lines of flux from a fixed or moving magnet to generate voltage. If the magnet is stationary then the coil must be in motion."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["The magneto operates like the induced ignition coil, except the magnet provides the lines of flux to the coil."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["In most cases the magnet rotates and the coil is stationary.  The movement of the magnet provides the variation of the flux linkage needed to generate electrical current.", "In most cases the magnet rotates and the coil is stationary. The movement of the magnet provides the variation of the flux linkage needed to generate electrical current."], "jumps": ["P2250", "P2220"]}, {"id": "P2250", "text": ["A magnet develops lines of flux from the North to the South pole due to the principle of un-like poles attract.  Placing a magnet under a sheet of paper and sprinkling the paper with iron filings allows you to see the lines of flux.", "A magnet develops lines of flux from the North to the South pole due to the principle of un-like poles attract. Placing a magnet under a sheet of paper and sprinkling the paper with iron filings allows you to see the lines of flux."], "jumps": ["P2260", "P2220"]}, {"id": "P2260", "text": ["When the magnet rotates, the lines of flux travel from north (left side) to south (right side) through the core of the coil. The core    gives the lines of flux a path of least resistance of travel.", "When the magnet rotates, the lines of flux travel from north (left side) to south (right side) through the core of the coil. The core gives the lines of flux a path of least resistance of travel."], "jumps": ["P2270", "P2220"]}, {"id": "P2270", "text": ["When the poles are between the core shoes the lines of flux travel from the top of the shoe to the bottom of the shoe.  No lines of flux are present in the core of the coil.", "When the poles are between the core shoes the lines of flux travel from the top of the shoe to the bottom of the shoe. No lines of flux are present in the core of the coil."], "jumps": ["P2280", "P2220"]}, {"id": "P2280", "text": ["The next position places the south pole on the left and the lines of flux travel from the right side (north pole) to the left side (south pole)."], "jumps": ["P2290", "P2220"]}, {"id": "P2290", "text": ["The primary winding or primary coil consists of copper wire wrapped around the core."], "jumps": ["P2300", "P2220"]}, {"id": "P2300", "text": ["The secondary winding or the secondary coil used in the high tension magneto's, consists of copper wire wrapped around a core, but with more windings."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["As described in the battery ignition system, the operation of the contact points provide a changing flux linkage in the coils primary winding.", "The low tension magneto ignition system uses a coil for each engine cylinder.  This reduces the amount of shielded high tension wire used, which decreases the loss of high voltage to the aircraft frame.", "The low tension magneto ignition system uses a coil for each engine cylinder. This reduces the amount of shielded high tension wire used, which decreases the loss of high voltage to the aircraft frame."], "jumps": ["P2320", "P2290", "P2330"]}, {"id": "P2330", "text": ["High voltage also causes corrosion of metals and deterioration of insulating materials."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["The low tension magneto only uses a low voltage primary coil and does not have a secondary coil like the high tension magneto.  Current is generated by the magneto to the coil core.", "The low tension magneto only uses a low voltage primary coil and does not have a secondary coil like the high tension magneto. Current is generated by the magneto to the coil core."], "jumps": ["P2350", "P2320"]}, {"id": "P2350", "text": ["The contact points vary the flux linkage as before.  Only this time, the distributor is between the coils and contact points.  The distributor directs low voltage to the coils.", "The contact points vary the flux linkage as before. Only this time, the distributor is between the coils and contact points. The distributor directs low voltage to the coils.", "The cylinder coils have a primary winding, a secondary winding and an iron core. They operate exactly the same as the battery induced ignition coil."], "jumps": ["P2360", "P2320", "P2370"]}, {"id": "P2370", "text": ["What uses the lines of flux from a fixed or moving magnet to generate voltage?"], "jumps": ["P2320"]}, {"id": "P2371", "text": ["When the voltage fluctuates at the primary winding a higher voltage is induced into the secondary winding of a coil.", "The cylinder coils increase the low voltage generated by low tension magneto to a high voltage pulse.", "The distributor directs the voltage to the cylinders or cylinder coils."], "jumps": []}, {"id": "P2380", "text": ["What system requires a minimal amount of shielded high tension wire?"], "jumps": ["P2370"]}, {"id": "P2381", "text": ["High tension magneto systems require high tension wire from the magneto to the spark plug and has very little low tension wire."], "jumps": []}, {"id": "P2390", "text": ["The turbine ignition system is primarily used for engine ground start and engine restarts during the aircraft flight."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["Turbines engine are normally fitted with a capacitor-type ignition system consisting of the exciter and the igniters."], "jumps": ["P2410", "P2390"]}, {"id": "P2410", "text": ["DC voltage from the aircraft battery is sent to the ignition motor and the multi-lobe cam contact points.  The motor drives the          multi-lobe and the single-lobe cam.", "DC voltage from the aircraft battery is sent to the ignition motor and the multi-lobe cam contact points. The motor drives the multi-lobe and the single-lobe cam."], "jumps": ["P2420", "P2390"]}, {"id": "P2420", "text": ["The multi-lobe cam opens and closes the contact points, which vary the voltage sent to the auto transformer, sending a pulsating current to the storage capacitor."], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["A rectifier is used to keep the flow of current in one direction only."], "jumps": ["P2440", "P2410"]}, {"id": "P2440", "text": ["One rotation of the single-lobe cam allows the storage capacitor to charge to 4 watts.  When the high point of the lobe makes contact with the storage capacitor contact points, the capacitor discharges to the triggering transformer.", "One rotation of the single-lobe cam allows the storage capacitor to charge to 4 watts. When the high point of the lobe makes contact with the storage capacitor contact points, the capacitor discharges to the triggering transformer.", "The triggering transformer increases the voltage from the storage capacitor and sends it to the igniters. insulator, and shell."], "jumps": ["P2450", "P2410", "P2460"]}, {"id": "P2460", "text": ["Igniters perform the same function as the spark plug, but operate at much higher voltage.  The main components of an igniter are the electrode, insulator, and shell.", "Igniters perform the same function as the spark plug, but operate at much higher voltage. The main components of an igniter are the electrode, insulator, and shell."], "jumps": ["P2470", "P2410"]}, {"id": "P2470", "text": ["The igniter discharges a white hot flame to the combustion chamber of the engine.  The igniter electrode is connected to the triggering transformer with shielded high tension wires.", "The insulator prevents the loss of the high voltage to ground before entering the combustion chamber of the turbine engine.", "The igniter discharges a white hot flame to the combustion chamber of the engine. The igniter electrode is connected to the triggering transformer with shielded high tension wires."], "jumps": ["P2480", "P2460", "P2490"]}, {"id": "P2490", "text": ["The disadvantage of using the higher tension system, is that the high voltage increases the corrosion factor for both metal and the insulating components."], "jumps": ["P2500", "P2460"]}, {"id": "P2500", "text": ["Unlike reciprocating engines, the gas-turbine ignition system is only used to start and restart the engine, which increases the       components reliability.", "Unlike reciprocating engines, the gas-turbine ignition system is only used to start and restart the engine, which increases the components reliability."], "jumps": ["P2910", "P2460"]}, {"id": "P2910", "text": ["This completes the information on IGNITION SYSTEMS OPERATION."], "jumps": ["P2001", "P2460"]}, {"id": "P2920", "text": ["1.  The electrical current enters the induction ignition coil                     through  the primary winding.  The secondary winding is                 connected to the primary winding via a flux linkage.", "1. The electrical current enters the induction ignition coil through the primary winding. The secondary winding is connected to the primary winding via a flux linkage."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2.  When the high point of the cam makes contact with the points,      the points open and stop current through the primary                       winding.  The lines of flux collapse and induce current to the          secondary winding.", "2. When the high point of the cam makes contact with the points, the points open and stop current through the primary winding. The lines of flux collapse and induce current to the secondary winding."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3.  Magnetos use the lines of flux from a fixed or moving magnet        to generate voltage.  If the magnet is stationary then the coil           must be in motion.", "4.  Low tension magneto ignition systems use a coil for each              engine cylinder, which minimizes the amount of shielded high       tension wire used.  Reducing the loss of high voltage to the           aircraft frame.", "3. Magnetos use the lines of flux from a fixed or moving magnet to generate voltage. If the magnet is stationary then the coil must be in motion.", "4. Low tension magneto ignition systems use a coil for each engine cylinder, which minimizes the amount of shielded high tension wire used. Reducing the loss of high voltage to the aircraft frame."], "jumps": ["P2950", "P2920", "P2960", "P2940"]}, {"id": "P2960", "text": ["5.  Turbine engines are normally fitted with a capacitor-type                 ignition system consisting of the exciter and igniters.", "5. Turbine engines are normally fitted with a capacitor-type ignition system consisting of the exciter and igniters."], "jumps": ["P2970", "P2950"]}, {"id": "P2970", "text": ["6.  One rotation of the single-lobe cam allows the storage                     capacitor to charge to 4 watts.  When the high point of the               lobe contacts the storage capacitor's contact points, the                 capacitor discharges into the triggering transformer.", "6. One rotation of the single-lobe cam allows the storage capacitor to charge to 4 watts. When the high point of the lobe contacts the storage capacitor's contact points, the capacitor discharges into the triggering transformer."], "jumps": ["P2999", "P2960"]}, {"id": "P2999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2970"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["What ignition system requires a battery or generator for a power source?"], "jumps": []}, {"id": "P10211", "text": ["How is the magneto ignition system superior to the battery ignition system?"], "jumps": []}, {"id": "P10212", "text": ["Why are aircraft fitted with two identical ignition systems?"], "jumps": []}, {"id": "P10213", "text": ["What directs high voltage pulses to the engine cylinders in the correct sequence as the piston reaches the correct position for ignition of the fuel-air mixture?"], "jumps": []}, {"id": "P10214", "text": ["What prolongs the life of the contact points, by reducing the chance of electrical arcing?"], "jumps": []}, {"id": "P10215", "text": let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
