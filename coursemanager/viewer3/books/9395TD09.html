<script>
const book = {"title": "9395TD09", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: ELECTROMAGNETIC COMPATIBILITY AND COUNTERMEASURES"], "jumps": []}, {"id": "P10", "text": ["ELECTROMAGNETIC COMPATIBILITY AND COUNTERMEASURESSSSSSSSSSSSSSSSS"], "jumps": []}, {"id": "P100", "text": ["1. Electromagnetic Compatibility and Countermeasures", "w Define terms, abbreviations and symbols associated with Electromagnetic Compatibility. w Describe the function and operational characteristics of Electromagnetic Compatibility (EMC), Electronic Countermeasures (ECM), and Electronic Counter- Countermeasures (ECCM)."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["This lesson will help you understand Electromagnetic Compatibility and Countermeasures."], "jumps": []}, {"id": "P410", "text": ["RADARs use radio frequency energy to detect, determine range to, and track potential targets. These frequencies vary greatly from one RADAR system to another, but usually lie in the 1- 30 GHz bandwidth."], "jumps": []}, {"id": "P420", "text": ["The frequency generation subsection determines the carrier frequency used by the RADAR system. Frequency generation equipment can also be used to exploit the effectiveness of the oppositions RADAR and weapons systems...", "Note: Each band is divided into 10 numbered channels with width as shown. e.g. Band A has 10 stations 25 MHz apart. The fifth band, A5, is 100 MHz. It has a width of 100 MHz to 125 MHz.125 MHz...................."], "jumps": []}, {"id": "P430", "text": ["Let's begin the lesson on ELECTROMAGNETIC COMPATIBILITY AND COUNTERMEASURES."], "jumps": ["P420"]}, {"id": "P900", "text": ["1. Electromagnetic Compatibility & Countermeasuresres"], "jumps": []}, {"id": "P1001", "text": ["ELECTROMAGNETIC COMPATIBILITY & COUNTERMEASURESES"], "jumps": []}, {"id": "P1020", "text": ["Countermeasures in the RF region of the electromagnetic spectrum are collectively grouped under an umbrella termed Electronic Warfare (EW). EW has three branches: Electronic Support Measures (ESM), Electronic Countermeasures (ECM) and Electronic Counter-Countermeasures (ECCM)...."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Electronic Support Measures (ESM) search the RF spectrum for emissions and analyze the results to exploit the weapons or sensors involved. Exploitation provides early warning detection, identification for counter weapon selection, and recording to support countermeasures development..."], "jumps": []}, {"id": "P1040", "text": ["The EW receiver provides a means of identifying friendly, neutral, and enemy emissions. It provides warning of potential attack, knowledge of enemy capabilities, and an indication of the enemies capability to manipulate the electromagnetic spectrum..."], "jumps": []}, {"id": "P1050", "text": ["The EW receiver is a wide bandwidth (30 kHz to 50 GHz). surveillance receiver. The receiver must receive both very weak and extremely strong signals without changing its characteristics..."], "jumps": []}, {"id": "P1060", "text": ["The EW receiver signal analysis capability should determine the signal modulation, sidebands, pulse width, and PRF. Using libraries of recorded emissions data, the specific threat or platforms jamming capability can be identified..."], "jumps": ["P1070", "P1050"]}, {"id": "P1065", "text": ["JAMMING - Deliberate radiation or reflection of electromagnetic energy for the purpose of disrupting enemy use of electronic devices or systems."], "jumps": []}, {"id": "P1070", "text": ["All RADARs, civilian and military, must be able to operate in the crowded electromagnetic environments that result from the transmissions of other radiating sources. This becomes essential in a Battle group with identical RADARs simultaneously operating in close proximity..."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["Electromagnetic Compatibility (EMC) is the ability of RF spectrum systems to reject unwanted radiations and minimize the likelihood of its own transmissions causing interference to other users of the spectrum..."], "jumps": []}, {"id": "P1090", "text": ["In non-hostile environments EMC proves to be invaluable, in that it allows all RADARs to operate at their optimum performance level without causing interference to other users."], "jumps": []}, {"id": "P1100", "text": ["However, military RADARs must operate in a hostile environment where they may be subjected to deliberate interference designed to degrade their performance. The various methods for interfering electronically with RADAR are called Electronic Countermeasures (ECM)..."], "jumps": []}, {"id": "P1110", "text": ["Active ECM is sometimes referred to as jamming. There is also passive ECM, such as Chaff, which is designed to create clutter or false targets. The methods employed to combat ECM are called Electronic Counter-Countermeasures (ECCM)..."], "jumps": []}, {"id": "P1120", "text": ["ECM can be divided into two major categories: (1) denial and (2) deception. Both categories can be subdivided into active and passive. TIVE DENIAL PASSIVE DENIAL ACTIVE DECEPTION PASSIVE DECEPTIONNN"], "jumps": []}, {"id": "P1130", "text": ["Various types of ECM attempt to cause the following effects: denial of detection; confusion or deception; delayed detection or tracking; tracking an invalid target; track overload; denial of, or errors in, target parameters; or loss of target track..."], "jumps": []}, {"id": "P1140", "text": ["What is defined as the ability of RF spectrum systems to reject unwanted radiations and minimize the likelihood of its own transmissions causing interference to other users of the spectrum???"], "jumps": ["P1130"]}, {"id": "P1141", "text": [], "jumps": []}, {"id": "P1142", "text": ["Electronic Counter-Countermeasures (ECCM) is the art of reducing the effectiveness of an EW threat with the objective of making the cost of effective EW prohibitive for the enemy."], "jumps": []}, {"id": "P1143", "text": ["Electronic Countermeasures (ECM) are those means of exploiting an adversary's RF emissions activity to determine intentions and reduce RADAR and weapons system effectiveness..."], "jumps": []}, {"id": "P1144", "text": ["Electronic Support Measures (ESM) search the RF spectrum for emissions and analyze the results to exploit the weapons or sensors involved."], "jumps": []}, {"id": "P1150", "text": ["What are the two categories and sub-categories of ECM?.....", "Active Jamming, Active Chaff, Passive Jamming, and Passive Chaff.", "Active ESM, Active ECCM, Passive ESM, and Passive ECCM.", "Denial, Deception, Active, and Passive ...eption..eption.ption.ption."], "jumps": ["P1140"]}, {"id": "P1151", "text": [], "jumps": []}, {"id": "P1152", "text": ["Active and Passive Jamming and Chaff are types of ECM......"], "jumps": []}, {"id": "P1153", "text": ["ESM is passive surveillance receive, and ECCM are counter-countermeasures not ECM."], "jumps": []}, {"id": "P1160", "text": ["In the Active Denial ECM category, electronic jamming devices are used to produce signals of various types designed to prevent the RADAR from detecting and tracking targets. CW jamming Long/short pulse Spot noise Barrage noise Swept jamming Sidelobe repeater.rrr"], "jumps": ["P1150"]}, {"id": "P1170", "text": ["CW jamming is the transmission of constant-amplitude, constant-frequency, unmodulated jamming signals to change the signal-to-noise ratio of a RADAR receiver."], "jumps": []}, {"id": "P1180", "text": ["Long/short pulse is similar to CW-jamming, except the pulsed signal is used in an attempt to change the signal-to-noise ratio of a RADAR receiver."], "jumps": []}, {"id": "P1190", "text": ["Spot noise is the generation of RF noise in a particular band or frequency channel to change the signal-to-noise ratio of a RADAR receiver.", "+++++++++ +++++++++ ++ ++++++"], "jumps": []}, {"id": "P1200", "text": ["Barrage noise is the generation of a wide bandwidth noise signal over a whole band of frequencies to change the signal-to-noise ratio of a RADAR receiver."], "jumps": []}, {"id": "P1210", "text": ["Swept jamming is sweeping a narrow band signal over a broadband. May be swept at a medium to fast rate to saturate a RADAR receiver."], "jumps": []}, {"id": "P1220", "text": ["Sidelobe repeater is jamming through a side lobe to mask the main lobe signal of a RADAR receiver.", "666 J$$$66 aaaaaaA 6J$$!J 666aR$$!!!"], "jumps": []}, {"id": "P1230", "text": ["In Passive Denial, non-electronic devices are used to prevent detection and tracking. Chaff, reduced RADAR Cross Section (RCS), and RADAR Absorbing Materials (RAM) are three types of passive denial devices..."], "jumps": []}, {"id": "P1240", "text": ["Chaff is an airborne cloud of lightweight reflecting objects (typically aluminum foil or metallic-coated fibers) to produce clutter areas."], "jumps": []}, {"id": "P1250", "text": ["RADAR Cross Section (RCS), Ships and aircraft can be designed to reduce the RCS and present a less reflective surface to the RADAR receiver.."], "jumps": []}, {"id": "P1260", "text": ["RADAR Absorbing Materials (RAM) are special materials used to coat aircraft or ships that absorb most of the RADAR signal, and reflect much less signal back to the RADAR receiver."], "jumps": []}, {"id": "P1270", "text": ["In the Active Deception ECM category, electronic devices are used to produce false echo signals to deceive and confuse a RADAR receiver. peaters Range and velocity gate stealers Inverse gainnn"], "jumps": []}, {"id": "P1280", "text": ["Repeaters intercept and reradiate a signal of the RADAR to produce erroneous target parameters or false targets by modifying the reradiated signal."], "jumps": []}, {"id": "P1290", "text": ["Range gate stealers, modify the reradiated signal to produce a larger target and then shift the signal in time to pull the RADAR's range tracker off in range."], "jumps": []}, {"id": "P1300", "text": ["Velocity gate stealing is accomplished by modifying the reradiated signal's frequency to pull a Doppler tracker off target."], "jumps": []}, {"id": "P1310", "text": ["Inverse gain modifies the reradiated signal to change its amplitude inversely with the received signal from a conically scanned RADAR."], "jumps": []}, {"id": "P1320", "text": ["In Passive Deception, non-electronic devices are used to produce false target returns and confuse the RADAR processor or the operator's ability to distinguish targets. Decoys and Forward dispensed chaff are two types of passive deception devices..."], "jumps": ["P1330", "P1310"]}, {"id": "P1325", "text": ["FORWARD DISPENSED CHAFF - Chaff that is deployed by a rocket or other device so that is begins to disperse in front of the target. The target then maneuvers in an attempt to shift the RADAR track to the chaff.", "KU7r( 3;9Q <eS=ffd+c4Ooo:BqWgu\\p?9=j5U"], "jumps": ["Pq"]}, {"id": "P1330", "text": ["Decoys are devices used to divert or mislead the RADAR. They can be closely deployed chaff or reflective buoys."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["RADAR systems have built in inherent anti-jamming circuitry to reduce their susceptibility to many types of ECM. For example, RADAR using Moving Target Indicators (MTI), or Doppler processing would be practically immune to many of the stationary passive deception and denial devices..."], "jumps": []}, {"id": "P1350", "text": ["Electronic Counter-Countermeasures (ECCM) is defined as actions taken to ensure the use of the electromagnetic spectrum despite ECM efforts to prevent the use of it. Despite all the advances in electronics, one of the best ECCM devices is still the highly trained operator..."], "jumps": []}, {"id": "P1360", "text": ["Most RADARs can be set to automatically respond with certain ECCM features when an expected type of ECM is encountered. The skilled operator has the ability to manually select the type, or types, of ECCM to produce the necessary detection and tracking of targets..."], "jumps": []}, {"id": "P1370", "text": ["Selectable ECCM RADAR system features can either be electronic or operational. The electronic feature types are the transmitter, antenna, and receiver/signal processor. Operational features involve automatic manipulation of data and use of target data from other sources..."], "jumps": []}, {"id": "P1380", "text": ["Transmitter ECCM features include frequency, power, PRF, and waveform."], "jumps": []}, {"id": "P1390", "text": ["The transmitter frequency can be varied rapidly by manual control, frequency agility, frequency diversity, and multi-band operation."], "jumps": []}, {"id": "P1400", "text": ["Frequency agility is the ability of RADAR to change frequency with each transmitted pulse. The more rapidly and randomly the frequency changes, the more difficult it is to actively jam."], "jumps": []}, {"id": "P1410", "text": ["Frequency diversity utilizes two or more RADARs operating in different frequency bands to force a jammer to cover a larger bandwidth and making it more difficult to jam all RADARs simultaneously..."], "jumps": []}, {"id": "P1420", "text": ["The main ECCM feature is power control. The more power a RADAR can output, the greater the range at which the reflected signal will burn through a jamming signal. Higher power can also help detect Reduced RADAR Cross Section (RCS) stealth targets.."], "jumps": ["P1430", "P1410"]}, {"id": "P1425", "text": ["BURN THROUGH - The RADAR output power level that will allow the return echo to be identified through the displayed jamming signal....................... displayed jamming signal.", "+%LGGqqGGGGGG55LL5GGqkkkqqq5TTG5Gqqkkk kqGG55555TLLTLwJ", "k5TL6666wwXX%Xw666wX%CCJJO++OJC%%%XXJw5qk kL%", "k kqGG5555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555L%9", "kGTL6%OCLG qLCOCwLL5q GT%J"], "jumps": []}, {"id": "P1430", "text": ["Many ECCM features can be employed with the Pulse Repetition Frequency (PRF) of a RADAR and the pulse itself. The PRF can be jittered, frequency modulated, staggered, randomly variable, and combinations of multiple PRF's with agility..."], "jumps": ["P1440", "P1420", "PRF"]}, {"id": "P1440", "text": ["PRF features make it difficult for a jammer to synchronize with the RADAR in order to use repeater, range-gate and velocity-gate pull-off, or false-target generators."], "jumps": []}, {"id": "P1450", "text": ["Different waveforms are usually associated with different RADAR systems, but some RADARs have multiple transmitters and modes of operation. The coded waveforms for pulse compression, CW, FM-CW, and pulse-Doppler waveforms are all major Waveform ECCM features..."], "jumps": []}, {"id": "P1460", "text": ["If more than one waveform is selectable or in use simultaneously, than jamming effectiveness is greatly reduced. For example, jamming that effect a pulse RADAR may have no effect on CW RADAR..."], "jumps": []}, {"id": "P1470", "text": ["The Antenna ECCM features are similar to the transmitter type, but they would not be possible without the antenna itself. These features include monopulse, variable scan, phased array, sidelobe blanking (SLB), and sidelobe cancellation (SLC)..."], "jumps": []}, {"id": "P1480", "text": ["Most of the antenna and transmitter ECCM features are detectable, since they affect the transmitted signal, or they are visible characteristics of the antenna. In the future, RADARs will be placed in a stealthy enclosure to reduce the RADAR Cross Section (RCS)..."], "jumps": []}, {"id": "P1490", "text": ["The largest group of ECCM features are contained in the RADAR receiver/signal processor. These features are passive, relatively simple and inexpensive circuits. -Fix Constant False Alarm Rate (CFAR) receiver Logarithmic receiver Matched-filter receiver Passive Angle Tracking (PAT) Sidelobe Blanking (SLB) Sidelobe Canceller (SLC) Sidelobe suppression Fast Time Constant (FTC) Lin-Log amplifierrrrr"], "jumps": ["PAT"]}, {"id": "P1500", "text": ["The Dicke-Fix provides excellent discrimination against fast sweep jamming without appreciable loss in sensitivity. However, strong CW jamming will seriously degrade performance because the CW signal captures the RADAR signal in the limiter..."], "jumps": ["P"]}, {"id": "P1510", "text": ["The Constant False Alarm Rate (CFAR) receiver uses automatic detection circuits to prevent receiver saturation and overload, present clean video information to the display, and a constant noise level to an automatic detector..."], "jumps": []}, {"id": "P1520", "text": ["CFAR receivers do not permit detection of a target that is weaker than the jamming noise, but does attempt to remove the confusing effects of the jamming."], "jumps": []}, {"id": "P1530", "text": ["The Logarithmic receiver's response approximates the logarithm of the strength of the incoming signal. They have a large, dynamic range of automatic gain control, which provides considerable protection against receiver saturation by strong jamming or interference signals. They are also useful against weather, clutter, chaff, and spot jamming....."], "jumps": []}, {"id": "P1540", "text": ["The Matched-filter receivers signal processing circuits are designed to discriminate against signals with characteristics different form those of the transmitted RF pulse."], "jumps": []}, {"id": "P1550", "text": ["Passive Angle Tracking (PAT) allows targets emitting a RADAR jamming signal to be tracked passively. Angle tracking circuits gate the signal and track the angles of maximum signal strength."], "jumps": ["PAT"]}, {"id": "P1560", "text": ["Sidelobe Blanking (SLB), employs an auxiliary wide-angle antenna and receiver to sense and gate a received pulse that originates in the sidelobe region of the main antenna. This technique compares relative signal strength between the wide-angle antenna and the RADAR antenna and blanks the signal from the sidelobe....."], "jumps": []}, {"id": "P1570", "text": ["Sidelobe Canceller (SLC) is a device employing multiple auxiliary antennas and receivers to allow linear subtraction of interfering signals from the desired output if they are sensed to originate in the sidelobe of the main antenna. Extraneous signals entering the sidelobe of the main antenna cancel while targets remain."], "jumps": []}, {"id": "P1580", "text": ["Sidelobe suppression circuitry eliminates any portion of the beam from a Radar antenna that is not part of the main lobe. t of the main lobe."], "jumps": []}, {"id": "P1590", "text": ["Fast Time Constant (FTC) is a short time constant circuit used to emphasize signals of short duration to produce discrimination against extended clutter, long-pulse jamming and noise."], "jumps": []}, {"id": "P1600", "text": ["The Lin-log amplifier is an automatic gain control amplifier that operates in a linear manner for low-amplitude input signals but responds in a logarithmic manner to high-amplitude input signals...."], "jumps": []}, {"id": "P1610", "text": ["What component contains the largest amount of ECCM features?"], "jumps": ["P1600"]}, {"id": "P1611", "text": [], "jumps": []}, {"id": "P1612", "text": ["a Try Again page...................................", "The Transmitter and Antenna features are numerous, but not the largest group. They are easily detected and identified by the frequency transmitted and the characteristics of the antenna propagation..."], "jumps": []}, {"id": "P1620", "text": ["Manual and computer-aided ECCM features vary considerably and include stored rates, beam-to-beam or pulse-to-pulse correlation, acceleration limiting, and data comparison from database libraries..."], "jumps": ["P1610"]}, {"id": "P1630", "text": ["With the increased use of digital computers, decision making within the computer can reject impossible accelerations or maneuvers of targets and select automatic ECCM features from stored database libraries..."], "jumps": []}, {"id": "P1640", "text": ["Let's look by category at which ECCM features are suited for use against certain ECM types. Active Denial, Passive Denial Active Deception Passive Deception)"], "jumps": []}, {"id": "P1650", "text": ["To counter CW-jamming, use Active Denial ECCM features; frequency agility, frequency diversity, FTC, AGC, PW discrimination, side lobe cancellation and passive angle track."], "jumps": []}, {"id": "P1660", "text": ["To counter Long-pulse jamming, use Active Denial ECCM features; frequency diversity, frequency agility, FTC, AGC, PW discrimination, side lobe cancellation, passive angle track and integration..."], "jumps": []}, {"id": "P1670", "text": ["To counter Spot-Noise jamming, use Active Denial ECCM features; frequency diversity, frequency agility, integration, Dicke-fix, and CFAR."], "jumps": []}, {"id": "P1680", "text": ["To counter Barrage Noise jamming, use Active Denial ECCM features; Dicke-fix, CFAR, FTC, automatic video noise level, higher power, and longer time on target."], "jumps": []}, {"id": "P1690", "text": ["To counter Medium and Fast- Sweep jamming, use Active Denial ECCM features; Dicke-fix, CFAR, variable IF bandwidth, integration, pulse compression, and frequency agility."], "jumps": []}, {"id": "P1700", "text": ["To counter Short Pulse jamming, use Active Denial ECCM features; Integration and pulse compression."], "jumps": []}, {"id": "P1710", "text": ["To counter Sidelobe Repeaters, use Active Denial ECCM features; PRF jitter and integration, pulse compression, and side lobe blanking."], "jumps": []}, {"id": "P1720", "text": ["To counter Chaff and Reduced RADAR Absorbing Material (RAM) EMC, use these Passive Denial ECCM features. ECM Type ECCM Features Chaff MTI, Doppler RADAR, improved resolution (narrow beam-width, short pulse, pulse compression), LOG FTC, gain controls, and low scan rate on search. (RAM) Longer time on target and higher power."], "jumps": []}, {"id": "P1730", "text": ["To counter Repeaters, use Active Deception ECCM features Complex RADAR waveform, frequency diversity, frequency agility, PRF jitter, integration, and side lobe blanking."], "jumps": []}, {"id": "P1740", "text": ["To counter Range and Velocity Gate Stealers, use Active Deception ECCM features; PRF jitter, leading edge tracking, acceleration limiting, and Doppler/range rate checking."], "jumps": []}, {"id": "P1750", "text": ["To counter Chaff (Tracking RADAR) and Decoys, use these Passive Deception ECCM features. ECM Type ECCM Features Chaff (Tracking RADAR) Higher resolution in range and angle speed-gate loop, MTI, leading/trailing edge tracking, and pulse compression. Decoys Target/decoy trajectory characteristics."], "jumps": []}, {"id": "P1760", "text": ["Operators and technicians must become familiar with the selectable and automatic ECCM features of the particular RADAR systems they maintain and operate. Time spent on an embedded ECM simulator will improve your capabilities when an exercise or actual jamming does occur..."], "jumps": ["P1910", "P1750"]}, {"id": "P1910", "text": ["This completes the information on ELECTROMAGNETIC COMPATIBILITY AND COUNTERMEASURES."], "jumps": ["P1001", "P1760"]}, {"id": "P1920", "text": ["1. Countermeasures in the RF region of the electromagnetic spectrum are collectively grouped under an umbrella termed Electronic Warfare (EW). EW has three branches: Electronic Support Measures (ESM), Electronic Countermeasures (ECM) and Electronic Counter-Countermeasures (ECCM).."], "jumps": []}, {"id": "P1930", "text": ["2. The EW receiver signal analysis capability should determine the signal modulation, sidebands, pulse width, and PRF. Using libraries of recorded emissions data, the specific threat or platforms jamming capability can be identified."], "jumps": []}, {"id": "P1940", "text": ["3. All RADARs, civilian and military, must be able to operate in the crowded electromagnetic environments that result from the transmissions of other radiating sources. This becomes essential in a battlegroup with identical RADARs simultaneously operating in close proximity."], "jumps": []}, {"id": "P1950", "text": ["4. Active ECM is sometimes referred to as jamming. There is also passive ECM, such as Chaff, which is designed to create clutter or false targets. The methods employed to combat ECM are called Electronic Counter-Countermeasures (ECCM)."], "jumps": []}, {"id": "P1960", "text": ["5. ECM can be divided into two major categories: (1) denial and (2) deception. Both categories can be subdivided into active and passive. IVE DENIAL ACTIVE DECEPTION PASSIVE DECEPTION"], "jumps": []}, {"id": "P1970", "text": ["6. In the Active Denial ECM category, electronic jamming devices are used to produce signals of various types designed to prevent the detection and tracking of targets. e Spot noise Barrage noise Swept jamming Sidelobe repeater.r"], "jumps": []}, {"id": "P1980", "text": ["7. The largest group of ECCM features are contained in the RADAR receiver/signal processor. These features are passive, relatively simple and inexpensive circuits.R) receiver Logarithmic receiver Matched-filter receiver Passive Angle Tracking (PAT) Sidelobe Blanking (SLB) Sidelobe Canceller (SLC) Sidelobe suppression Fast Time Constant (FTC) Lin-Log amplifierrrrr"], "jumps": ["PAT"]}, {"id": "P1990", "text": ["8. Operators and technicians must become familiar with the selectable and automatic ECCM features of the particular RADAR systems they maintain and operate. Time spent on an embedded ECM simulator will improve your capabilities when an exercise or actual jamming does occur."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1990"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["An EW receiver must have what type of bandwidth capability?"], "jumps": []}, {"id": "P10211", "text": ["What is defined as the ability of RF spectrum systems to reject unwanted radiations and minimize the likelihood of its own transmissions causing interference to other users of the spectrum?"], "jumps": []}, {"id": "P10212", "text": ["What are the two categories and sub-categories of ECM?", "Active Jamming, Active Chaff, Passive Jamming, Passive Chaff.", "Active ESM, Active ECCM, Passive ESM, and Passive ECCM.", "Active EW, Active Chaff, Passive EW, and Passive Chaff.", "Active Denial, Active Deception, Passive Denial, and Passive Deception."], "jumps": []}, {"id": "P10213", "text": ["What category of ECM electronic devices are used to produce false echo signals to deceive and confuse a RADAR receiver?"], "jumps": []}, {"id": "P10214", "text": ["What type of jammer transmits constant-amplitude, constant-frequency, unmodulated jamming signals to change the signal-to-noise ratio of a RADAR receiver?"], "jumps": []}, {"id": "P10215", "text": ["What type of jammer generates RF noise in a particular band or frequency channel to change the signal-to-noise ratio of a RADAR receiver?"], "jumps": []}, {"id": "P10216", "text": ["ECCM features, MTI, Doppler RADAR, improved resolution (narrow beam-width, short pulse, pulse compression), LOG FTC, gain controls, and low scan rate on search are used against what type of ECM?"], "jumps": []}, {"id": "P10217", "text": ["Decoys and forward-dispensed chaff are examples of what type of ECM?"], "jumps": []}, {"id": "P10218", "text": ["e and velocity-gate pull-off, or false-target generators", "What transmitter features make it difficult for a jammer to synchronize with the RADAR in order to use repeater, range-gate and velocity-gate pull-off, or false-target generators?"], "jumps": []}, {"id": "P10219", "text": ["What is the main ECCM feature that allows a RADAR to burnthrough a Spot Noise or Barrage Noise jammer?", "What is the main ECCM feature that allows a RADAR to burn through a Spot Noise or Barrage Noise jammer?"], "jumps": []}, {"id": "P10220", "text": ["What component type of ECCM features include monopulse, variable scan, phased array, sidelobe blanking (SLB), and sidelobe cancellation (SLC)?"], "jumps": []}, {"id": "P10221", "text": ["Active ECM is sometimes referred to as _______"], "jumps": []}, {"id": "P10222", "text": ["What methods are employed to combat ECM?"], "jumps": []} let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
