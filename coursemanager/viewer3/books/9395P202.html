P10302\", \"P10303\")"], "jumps": []}, {"id": "PINFO", "text": ["12-07-00 Converted from SAM to toolbook. frieda 12-07-00 Text and Branching. frieda 12-19-00 graphics by Chris 07-19-01 Converted to ToolBook 8.1 format. jay", "12-07-00 Converted from SAM to toolbook. frieda 12-07-00 Text and Branching. frieda 12-19-00 graphics by Chris 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-13-02 Review of Conversion. Alexis", "6. Friends, teachers, students that use or have used Internet provider are your best source of information. Otherwise, check your local want ads, yellow pages, libraries or call a 1- 800 number of a commercial provider for more information..tion.", "Each individual computer needs a LAN card, but not a modem. They can access the Internet through the LAN system."], "jumps": ["P2980", "P2960"]}, {"id": "P2601", "text": [], "jumps": []}, {"id": "P2910", "text": ["This completes the information on INTERNET REQUIREMENTS AND OPTIONS.", "A commercial provider, Internet service provider and BBS can provide an e-mail account."], "jumps": ["P2001", "P2600"]}, {"id": "P2591", "text": [], "jumps": []}, {"id": "P2590", "text": ["Each individual computer needs a LAN card, but not a modem. They can access the Internet through the LAN system."], "jumps": ["P2580"]}, {"id": "PINFO", "text": ["12-07-00 Converted from SAM to toolbook. frieda 12-07-00 Text and Branching. frieda 12-19-00 graphics by Chris 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-13-02 Review of Conversion. Alexis"], "jumps": []}, {"id": "P2990", "text": ["8. Joining a large commercial Internet provider may be best until you gain the experience needed to use many applications on the Internet.", "File Edit Mail Window Help Logoffffffelp", "World Wide Web Sports File transfer Protocol Games Telnet News Chat Rooms Finance", "If you are at a school, business or university, and they do not have an Internet connection, you may want to recommend the use of a Local Area Network (LAN). Through a LAN you can give many computers access.", "3. Modem speeds must match between your computer and the Internet providers. The lower of the two data rates will be used to transfer."], "jumps": ["P2999", "P2980", "P2570", "P2550", "P2950", "P2930"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.u.", "HyperText Markup Language is the programming language that makes up a WWW site."], "jumps": ["P2001", "P2990"]}, {"id": "P2920", "text": ["1. The most important pieces of Internet hardware are a computer and telephone modem. Access to a phone line also is required."], "jumps": ["P2930", "P2001"]}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P2551", "text": [], "jumps": []}, {"id": "P2580", "text": ["With more businesses, schools and homes getting on the Internet the need for an electronic mail address, while not a necessity, becomes more convenient.", "File Edit Mail Window Help Logoffffffelp"], "jumps": ["P2590", "P2570"]}, {"id": "P2530", "text": ["Being able to access FTP sites is one of the most prevalent uses of the Internet. The software is used to view and download files, graphics, software programs and games.", "File Edit Mail Window Help Logoffffffelp", "What is FTP Uploading Downloading Searching FTP Ftp FAQs ELNET Chat"], "jumps": ["P2540", "P2520"]}, {"id": "P2550", "text": ["Telnet uses what kind of software to access to the Internet?"], "jumps": ["P2540"]}, {"id": "P2551", "text": [], "jumps": []}, {"id": "P2590", "text": ["Besides an e-mail provider, what other type of provider can furnish an e-mail account?"], "jumps": ["P2580"]}, {"id": "P2591", "text": [], "jumps": []}, {"id": "P2510", "text": ["Spry Mosaic or Internet in a Box provide a browser but also are communication packages. These can be used with most Internet service providers."], "jumps": ["P2520", "P2500"]}, {"id": "P2520", "text": ["Browsers are used to view the Internet sites. Usually included in their software is an FTP browser.", "File Edit Mail Window Help Logoffffffelp"], "jumps": ["P2530", "P2510"]}, {"id": "P2540", "text": ["E-mail providers like AT&T Easylink, SprintMail, and MCI Mail provide e-mail service. The software is provided by each company.", "File Edit Mail Window Help Logoffffffelp", "File transfer protocol allows you to connect to FTP sites.."], "jumps": ["P2550", "P2530"]}, {"id": "P2450", "text": [], "jumps": ["P2460", "P"]}, {"id": "P2600", "text": ["What is one advantage of a Local Area Network?.............", "Each individual computer does need a modem", "Each individual computer does not need a modem"], "jumps": ["P2590"]}, {"id": "P2930", "text": ["2. Computer hardware and software are needed to connect to the Internet. Many software programs can be downloaded from the Internet.", "Software + hardware = Internet Connection"], "jumps": ["P2940", "P2920"]}, {"id": "P2950", "text": ["4. Deciding between a BBS, a large commercial provider or an Internet service provider depends on your specific needs."], "jumps": ["P2960", "P2940"]}, {"id": "P2440", "text": ["The large commercial providers like Microsoft Network, America Online or CompuServe will provide you with a Web browser. This allows viewing of any HTML page or communicating with any Web site...", "File Edit Mail Window Help Logoffffffelp", "The software that allows you to use the Internet is just as an important consideration as the hardware.", "Software + hardware = Internet Connection", "BBS's use terminal emulation software that mimics the computer you are connecting to and displays the information on your computer. Communication programs usually have these included..."], "jumps": ["P2450", "P2420", "P2440", "P2410", "P2470"]}, {"id": "P2500", "text": ["Along with computer hardware you need _______ to be able to connect to Internet sites."], "jumps": ["P2490"]}, {"id": "P2502", "text": ["A printer produces a hard copy, typewritten words, numerals, symbols or pictures on a piece of paper.", "Software + hardware = Internet Connection"], "jumps": []}, {"id": "P2503", "text": ["A computer uses a modem to send data over the phone lines, it has no use for a telephone.", "Software + hardware = Internet Connection"], "jumps": []}, {"id": "P2360", "text": ["Some Internet providers offer a strictly text service. This helps save money in that you do not receive any graphics which take long amounts of time to download."], "jumps": ["P2370", "P2350"]}, {"id": "P2401", "text": [], "jumps": []}, {"id": "P2402", "text": ["Remember, the number your modem calls must be a local access number or you may be charged long distance."], "jumps": []}, {"id": "P2410", "text": ["Hardware requirements for accessing the Internet are only part of the equation."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["The software that allows you to use the Internet is just as an important consideration as the hardware.", "Software + hardware = Internet Connection"], "jumps": ["P2440", "P2410"]}, {"id": "P2480", "text": ["BBS's accessed over the Internet offer e-mail and other services. Typically a local BBS is more useful and offers more options than one on the Internet..", "After having joined an Internet provider, contacting members of that service for help will be a great source of information."], "jumps": ["P2490", "P2470", "P2350", "P2330"]}, {"id": "P2350", "text": ["You will be surprised by the wealth of information that can be received from other people on some commercial providers service. Remember, they once were just as unfamiliar with the Internet as you...", "File Edit Mail Window Help Logoffffffelp", "Subjects: Getting Started Internet FTP TELNET Chat"], "jumps": ["P2360", "P2340"]}, {"id": "P2380", "text": ["They must have enough modems, telephone lines and other computer hardware to be able to switch you to where you are trying to go on the Internet.", "Contact some of your friends, students, teachers, or co-workers that may have used or are using Internet providers."], "jumps": ["P2390", "P2370", "P2320", "P2290"]}, {"id": "P2390", "text": ["Let us review the basic needs for an Internet connection: mputer Phone line Modem Internet provider", "Computer Phone Line Modem Internet provider 128,000 bps 9,600 bps 14,400 bps 24,000 bps 28,000 bps 33,000 bps 56,000 bps"], "jumps": ["P2400", "P2370"]}, {"id": "P2400", "text": ["If you do not connect through a local access number you may be _______", "Lightening Internet Service Trial Membershippppp"], "jumps": ["P2390"]}, {"id": "P2290", "text": ["Providers will usually have a 1- 800 number that will not cost money to call. Commercial providers will usually offer a free trial membership, they will send their software and allow certain amount of hours to try out their service, at no charge..", "Lightening Internet Service Trial Membershippppp"], "jumps": ["P2291", "P2280"]}, {"id": "P2320", "text": ["If no one is available to help make an informed choice, joining a large commercial provider may be the easiest alternative.", "BBS's, commercial providers and Internet service providers need the necessary hardware to be able to bring you access to the Internet."], "jumps": ["P2330", "P2310", "P2380", "P2360"]}, {"id": "P2450", "text": ["With Internet service providers you will be given an account. You dial their phone number through your computer's modem and they connect you to the Internet. They may or may not provide the software...", "File Edit Mail Window Help Logoffffffelp"], "jumps": ["P2460", "P2440"]}, {"id": "P2470", "text": ["BBS's accessed locally sometimes offer Internet or certain parts of Internet.", "File Edit Settings Phone Transfers Helpfffelp", "1. Main 2. Internet 3. E-mail 4. Chat Room 5. More 6. Exit fer Protocol Games Telnet News Chat Rooms Finance"], "jumps": ["P2480", "P2460"]}, {"id": "P2490", "text": ["An example may be logging onto a university's network and accessing its directories or using their e-mail system. Some systems may deny access unless a password is given.", "File Edit Mail Window Help Logoffffffelp", "1. Access Library 2. E-Mail 3. Internet Access 4. FTP 5. Menu Commands", "Select an option by pressing the corresponding number. Press ESC key to exit."], "jumps": ["P2500", "P2470"]}, {"id": "P2501", "text": ["The Bulletin Board Services, commercial providers and Internet service providers have modems at the other end of the phone line. You will be given an access number that connects you to their modems...", "Ideally, the user and service provider will have modems with baud rates that match at maximum speed. When this is not the case, data transfer will be limited to the slower of the two modems...", "The lower of the two modem speeds between both of the modems is the rate at which the data will be transferred."], "jumps": ["P2240", "P2220", "P2250", "P2230"]}, {"id": "P2280", "text": ["Start by looking in the phone book. The most recent choices will be in the want ads of your local newspaper. You can inquire in the yellow pages or a library."], "jumps": ["P2290", "P2270"]}, {"id": "P2300", "text": ["When deciding on an Internet service provider ask about the ratio of modems to customers and the monthly price. The higher the ratio of customers coupled with the price and the stability of the company is usually your best bet..."], "jumps": ["P2310", "P2290"]}, {"id": "P2330", "text": ["Once familiar with all the applications that can be accessed on the Internet and your level of experience increases, you can then change to another Internet provider, based upon your personal needs..."], "jumps": ["P2340", "P2320"]}, {"id": "P2220", "text": ["The speed at which a modem is measured in is either in Baud or _______"], "jumps": ["P2210"]}, {"id": "P2222", "text": ["Remember, modems are measured in their Baud rate and how many bits per second they can transfer."], "jumps": []}, {"id": "P2251", "text": ["You are also going to need access to a telephone line......"], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["Some low-quality phone lines will impede the data exchange between your computer and the Internet.", "Rural phone lines, because of the distances involved may have problems keeping connected at higher modem speeds."], "jumps": ["P2190", "P2170", "P2200", "P2180"]}, {"id": "P2223", "text": ["A megabyte is a unit of measure that describes the amount of computer storage capacity."], "jumps": []}, {"id": "P2250", "text": ["If your modem speed is at 14,400 bps and your provider's speed is 33,600 bps, at what speed will data be transferred?"], "jumps": ["P2240"]}, {"id": "P2270", "text": ["BBS's are usually local calls, if you do not have a local BBS, you can access many BBS's through a commercial provider or Internet service provider through a service called telnet .", "File Edit Mail Window Help Logoffffffelp", "World Wide Web Sports File transfer Protocol Games Telnet News Chat Rooms Finance"], "jumps": ["P2280", "P2260"]}, {"id": "P2275", "text": ["TELNET - Using a communications program with terminal emulation capability to access another computer as if you were there."], "jumps": []}, {"id": "P2291", "text": ["Although the free trial membership does not cost any money. You must ensure that the access number is local, otherwise long distance charges will apply."], "jumps": ["P2300", "P2290"]}, {"id": "P2080", "text": ["After a computer, the most important piece of hardware needed to access the Internet is a telephone modem. A modem connects a computer through telephone lines onto the Internet."], "jumps": ["P2090", "P2070"]}, {"id": "P2120", "text": ["The speed at which you can connect to a BBS, commercial provider or Internet service provider will be determined by the type of modem."], "jumps": ["P2130", "P2110"]}, {"id": "P2112", "text": ["These are numbers that your modem has to connect to the Internet."], "jumps": []}, {"id": "P2113", "text": ["These are service providers numbers that you call using computer hardware and modem."], "jumps": []}, {"id": "P2130", "text": ["Modems are categorized by baud rate. Baud rate is the amount of information sent over the phone line in a second. Baud rate is measured in Bits Per Second. Most often bps is used when discussing modem speed..."], "jumps": ["P2150", "P2120"]}, {"id": "P2150", "text": ["While most modems run on analog phone lines, there is also another type of modem that runs on a digital phone line. This modem is called an ISDN modem. ISDN modems are almost twice as fast as analog modems..."], "jumps": ["P2160", "P2120"]}, {"id": "P2152", "text": ["While most modems run on analog phone lines, there is also another type of modem that runs on a digital phone line. This modem is called an ISDN modem. ISDN modems are almost twice as fast as analog modems..."], "jumps": ["P2160", "P2120"]}, {"id": "P2155", "text": ["ISDN - Integrated Services Digital Network. This modem, also known as a BRI (Basic Rate Interchange) line, uses two data channels. These channels can operate separately or jointly. Separately, the channels run independent of each other and can be used for either voice or data communications. In the dual configuration, both channels are used for data which doubles the transmission speed. However, in this configuration, no voice is available."], "jumps": []}, {"id": "P2160", "text": ["The speeds of modems are as follows. Graphic Text) Analog Digital (ISDN) 1,200 bps 64,000 bps 2,400 bps 128,000 bps 9,600 bps 14,400 bps 24,000 bps", "Analog Digital (ISDN) 1,200 bps 64,000 bps 2,400 bps 128,000 bps 9,600 bps 14,400 bps 24,000 bps 28,000 bps 33,000 bps 56,000 bps"], "jumps": ["P2170", "P2120"]}, {"id": "P2200", "text": ["Even a noise free line has its limitations, only so much data can be sent across a phone line. This limitation is measured in bandwidth."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["Information transfer speed peaks out at about 38,400. Theoretically, a modem rated at 38,400 would be able to handle transfers at that speed, but most will never reach it due to the quality of phone lines and modem..."], "jumps": ["P2220", "P2200"]}, {"id": "P2221", "text": ["7. Friends, students, teachers, and co-workers are your best source of information when selecting a computer to use."], "jumps": ["P1990", "P1970"]}, {"id": "P2070", "text": ["Graphic, video, and audio files are much larger than text files, and require more time to load, process and view."], "jumps": ["P2080", "P2060"]}, {"id": "P2090", "text": ["Modems can be either external or internal. An external modem is a separate device. It is connected to a computer by a cable. External modems are considered to be better than internal modems.", "An internal modem or modem card is placed inside your computer to save space."], "jumps": ["P2100", "P2080", "P2110"]}, {"id": "P2111", "text": ["5. The computer's intended use will influence the hardware and software requirements.", "8. Technology continues at a rapid pace. Newspaper ads, computer magazines, or visiting computer stores may be the best way to keep up with the changing technology."], "jumps": ["P1970", "P1950", "P1999", "P1980"]}, {"id": "P2030", "text": ["The type and performance capabilities of a computer to access the Internet will need to be addressed."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["The minimum RECOMMENDED requirements needed for an Internet connection are: (Graphic Text) 486 microprocessor or equivalent 4 megabytes of RAM VGA monitor 14,400 bps modem", "486 microprocessor or equivalent 4 megabytes of RAM VGA monitor 14,400 bps modem Pentium Hard Drive 120MB 400MB 2GB Memory 2MB 4MB 16MBBB"], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["Although Internet functions can be performed with lesser system capability, these recommended requirements ensure Internet operations that will not be overly bogged down."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["WWW sites contain home pages made up of HTML (HyperText Markup Language), these pages have graphics, text, animations and audio to make them interesting and descriptive."], "jumps": ["P2070", "P2040"]}, {"id": "P2110", "text": ["The hardware requirements for Internet access are _______..", "BBS, ISP or a large commercial Internet provider."], "jumps": ["P2100"]}, {"id": "P1920", "text": ["1. You must purchase or have access to a computer to be able to get on the Internet."], "jumps": ["P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on COMPUTER REQUIREMENTS AND OPTIONS.", "4. Storage capacity, types of memory, and microprocessors are an important consideration when using software applications."], "jumps": ["P1001", "P1860", "P1960", "P1940"]}, {"id": "P2020", "text": ["The Internet is comprised of 10's of thousands of computers connected together either individually or as part of a network. To use the Internet you will need to purchase or have access to a computer."], "jumps": ["P2030", "P2001"]}, {"id": "P1830", "text": ["Creating a report from a database may explain peaks and valleys in a chart. Both the report and chart may be included in one document.", "Number of gifts: 6 Allocated Actual per person Brenna $50.00 $51.00 Caitlin $50.00 $45.09 Devlin $50.00 $48.23 Jamie $75.00 $69.99 Lystra $75.00 $81.51 Sydney $100.00 $93.99 Total $400.00 $389.811", "$120.00 $100.00 $80.00 $60.00 $40.00 $20.00 $0.00 B C D J L S Allocated Actual", "File Edit View Insert Format Tools Window Help"], "jumps": ["P1840", "P1820"]}, {"id": "P1850", "text": ["The better applications usually have tutorials and help menus included within the software program. You can access these whenever help is needed to perform specific tasks.", "File Edit View Insert Format Tools Window Help"], "jumps": ["P1860", "P1840"]}, {"id": "P1810", "text": [" ication .DRV = Driver file for specific hardware componentss"], "jumps": ["P1770", "P1750"]}, {"id": "P1571", "text": [], "jumps": []}, {"id": "P1640", "text": ["However, a word processor does not immediately type the text on a page. The text is displayed on the monitor's screen."], "jumps": ["P1650", "P1630"]}, {"id": "P1560", "text": ["During the mid 1990's microprocessors on the market included 386's, 486's, and Pentiums. These processors are available at different operating speeds measured in Megahertz. This is the speed of the computer's processing ability..."], "jumps": ["P1570", "P1550"]}, {"id": "P1570", "text": ["Hard drives differ in _______yped.........................."], "jumps": ["P1550"]}, {"id": "P1685", "text": ["A dialogue box is a small box inset within the larger screen of the monitor. Prompt refers to the choices given by the computer within the dialogue box."], "jumps": ["P1690", "P1680"]}, {"id": "P1751", "text": ["Nearly all modern PC's will have empty memory sockets on the motherboard to accommodate additional RAM."], "jumps": ["P1550", "P1530"]}, {"id": "P1550", "text": ["The microprocessor is usually referred to as the \"brain of the computer\", or Central Processing Unit (CPU)."], "jumps": ["P1560", "P1535"]}, {"id": "P1630", "text": ["Wordprocessors are programs that allow you to type text using the computer's keyboard."], "jumps": ["P1640", "P1620"]}, {"id": "P1520", "text": ["One example of multi-tasking is printing text from one application while working on another.", "This is particularly true when multi-tasking (having 2 or more programs running at one time) is desired.", "Applications and multi-tasking run smoother and faster as RAM is added to a system.", "RAM comes in multiple sizes including 256KB, 1MB, 4MB, 8MB, 16MB, or higher. It is uncommon to find a computer marketed today with less than 4MB of RAM."], "jumps": ["P1530", "P1510", "P1515", "P1490", "P1535"]}, {"id": "P1666", "text": ["Extensions are normally used to annotate let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
