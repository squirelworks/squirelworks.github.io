<script>
const book = {"title": "9395A204", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: FIBER OPTIC CABLE CONNECTIONSasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Explain losses due to the different types of misalignment and waveguide geometry. w Describe the basic steps to properly splicing waveguides. w Identify the six requirements for a good connector. connector. connector. connector.", "w Connectorize a fiber optic cable properly. w Determine the losses of adding a non-permanent mechanical splice to a fiber optic cable."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P301", "text": [], "jumps": []}, {"id": "P332", "text": ["Fiber Optic Polishing Kit - 1 each Polish Paper 600 Grit 3\" x 3\" Lapping Film 3 mm 3 \" x 3\" Anvil (Polishing Fixture) Cleaning Tissue Conn, Opto, TX, Grey - 2 each Conn, Opto, RX, Blue - 2 each Conn, Non-perm, Mechanical Splice - 1 each Cable, Fiber Optic, Grey 10 ft"], "jumps": ["Polishing"]}, {"id": "P333", "text": [], "jumps": []}, {"id": "P334", "text": [], "jumps": []}, {"id": "P400", "text": ["Fiber optic connectors, splices, and couplers are an important part of any fiber optic system."], "jumps": ["P410", "P301"]}, {"id": "P410", "text": ["A fiber optic cable must be joined to the optical light source and the detector using specially designed connectors.  Sections of cable are spliced together using another type of connector. Couplers allow a single optical signal to be distributed along different paths.", "A fiber optic cable must be joined to the optical light source and the detector using specially designed connectors. Sections of cable are spliced together using another type of connector. Couplers allow a single optical signal to be distributed along different paths."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Connectors, splices, and couplers increase the versatility of a fiber optic system."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Let's begin the lesson on FIBER OPTIC CABLE CONNECTIONS..................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1040", "text": ["Different types of connectors add versatility to a fiber optic system.  However, some signal loss must be expected for each    connection.  Most of these losses fall into one of two categories.", "Different types of connectors add versatility to a fiber optic system. However, some signal loss must be expected for each connection. Most of these losses fall into one of two categories."], "jumps": ["P1050", "P1001"]}, {"id": "P1050", "text": ["The first category we will discuss is misalignment."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["The three different types of misalignment are lateral displacement, end separation, and angular tilt.  Any of these may occur if the waveguide is not properly inserted into the connector, if the wrong type of connector is used, or if the connector is damaged.", "The three different types of misalignment are lateral displacement, end separation, and angular tilt. Any of these may occur if the waveguide is not properly inserted into the connector, if the wrong type of connector is used, or if the connector is damaged."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["Lateral displacement occurs when the waveguides are not aligned along their central axis.  Recall that light propagation by   total internal reflection is dependant upon the angle of             incidence.  The angle of incidence may be critically altered as light attempts to pass through the joint.  The result is signal loss.", "Lateral displacement occurs when the waveguides are not aligned along their central axis. Recall that light propagation by total internal reflection is dependant upon the angle of incidence. The angle of incidence may be critically altered as light attempts to pass through the joint. The result is signal loss."], "jumps": ["P1080", "P1060"]}, {"id": "P1075", "text": ["TOTAL INTERNAL REFLECTION - This phenomenon results when the first medium has a higher refractive index than the second medium and the angle of incidence is steep.", "High Refractive Index (Core)", "Refractive Index Values Zinc Crown Glass 1.53 Air (Dry, 1 atm) 1.003"], "jumps": []}, {"id": "P1080", "text": ["Lateral displacement may also cause the light to miss the waveguide entirely and strike the cladding instead.  Again, signal loss is the result.  Lateral displacement losses are usually the highest misalignment losses incurred.", "Lateral displacement may also cause the light to miss the waveguide entirely and strike the cladding instead. Again, signal loss is the result. Lateral displacement losses are usually the highest misalignment losses incurred."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["End separation means that the ends of the waveguides are too far apart or the gap between the waveguide and the optical light source/detector is too large. The light path will be altered as the beam traverses the gap and signal loss is the result. End separation losses are typically less than lateral displacement losses."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["Angular tilt combines some of the problems of both lateral displacement and end separation.  The angle of incidence may be changed and/or the light beam may strike the cladding. However, losses due to angular tilt are often the lowest of all the   misalignment losses.", "Angular tilt combines some of the problems of both lateral displacement and end separation. The angle of incidence may be changed and/or the light beam may strike the cladding. However, losses due to angular tilt are often the lowest of all the misalignment losses."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["Which type of misalignment usually has the highest  losses?", "Which type of misalignment usually has the highest losses?"], "jumps": ["P1060"]}, {"id": "P1111", "text": [], "jumps": []}, {"id": "P1112", "text": ["Losses due to angular tilt are often the lowest of all the misalignment losses."], "jumps": []}, {"id": "P1113", "text": ["End separation losses are not the highest.", "End separation losses are not the highest.................."], "jumps": []}, {"id": "P1120", "text": ["Now we will discuss connector losses due to waveguide geometry.  These types of losses involve fluctuations within the structure of the waveguides or varying characteristics of the waveguides.", "Now we will discuss connector losses due to waveguide geometry. These types of losses involve fluctuations within the structure of the waveguides or varying characteristics of the waveguides."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["Losses due to waveguide geometry occur because the two waveguides are mismatched in some way.  The light signal cannot pass easily from the first waveguide to the second and signal loss results.", "Losses due to waveguide geometry occur because the two waveguides are mismatched in some way. The light signal cannot pass easily from the first waveguide to the second and signal loss results."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["Concentricity losses occur when the waveguide's core is shifted and is not centrally located.  Ellipticity losses occur when the core is too elliptical rather than circular.  In either case, the light path may be altered or broken while attempting to travel from waveguide to waveguide since the cores do not align properly.", "Concentricity losses occur when the waveguide's core is shifted and is not centrally located. Ellipticity losses occur when the core is too elliptical rather than circular. In either case, the light path may be altered or broken while attempting to travel from waveguide to waveguide since the cores do not align properly."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["If the cores of the two waveguides are different sizes than a core diameter mismatch results.  The cores will not align properly causing a change in the light path.  The light path may also miss the core of the second waveguide and strike the cladding instead.", "If the cores of the two waveguides are different sizes than a core diameter mismatch results. The cores will not align properly causing a change in the light path. The light path may also miss the core of the second waveguide and strike the cladding instead."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["A cladding diameter mismatch results if the cladding of the two waveguides are different sizes.  Once again, the cores will not align properly and the light path will be interrupted.", "A cladding diameter mismatch results if the cladding of the two waveguides are different sizes. Once again, the cores will not align properly and the light path will be interrupted."], "jumps": ["P1170", "P1130"]}, {"id": "P1170", "text": ["Using two waveguides with different numerical apertures (NA) results in an NA mismatch.  Signal loss may result if the first waveguide has a larger NA than the second, but there is usually not a problem if the first waveguide has a smaller NA than the second.", "Using two waveguides with different numerical apertures (NA) results in an NA mismatch. Signal loss may result if the first waveguide has a larger NA than the second, but there is usually not a problem if the first waveguide has a smaller NA than the second."], "jumps": ["P1180", "P1130"]}, {"id": "P1180", "text": ["You are splicing two different fiber optic cables together and you notice that the core of one waveguide is visibly off center. Should you question the use of this cable?"], "jumps": ["P1130"]}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1182", "text": ["Using a fiber optic cable whose core is visibly off center may result in a concentricity mismatch.  The light path may be altered or broken while attempting to travel from waveguide to waveguide since the cores do not align properly.", "Using a fiber optic cable whose core is visibly off center may result in a concentricity mismatch. The light path may be altered or broken while attempting to travel from waveguide to waveguide since the cores do not align properly......."], "jumps": []}, {"id": "P1190", "text": ["Using the proper technique for splicing waveguides is important in order to limit losses to acceptable levels.  High levels of signal  loss may result if the ends of the fibers are not prepared correctly since a cracked or rough surface will affect the light path.", "Using the proper technique for splicing waveguides is important in order to limit losses to acceptable levels. High levels of signal loss may result if the ends of the fibers are not prepared correctly since a cracked or rough surface will affect the light path."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["The proper method for cutting a glass waveguide involves scoring the waveguide's surface and pulling.  The waveguide will break at the scored area.  This method is similar to cutting a glass pane where the glass surface is scored with a diamond tool and the glass is broken along the scored edge.", "The proper method for cutting a glass waveguide involves scoring the waveguide's surface and pulling. The waveguide will break at the scored area. This method is similar to cutting a glass pane where the glass surface is scored with a diamond tool and the glass is broken along the scored edge."], "jumps": ["P1205", "P1190"]}, {"id": "P1205", "text": ["Plastic waveguides are considered to be low quality fibers.  The methods for cutting plastic waveguides are simpler than those for cutting glass waveguides.  Common methods include using  wire cutters or a hot knife.", "Plastic waveguides are considered to be low quality fibers. The methods for cutting plastic waveguides are simpler than those for cutting glass waveguides. Common methods include using wire cutters or a hot knife."], "jumps": ["P1210", "P1200"]}, {"id": "P1210", "text": ["Polishing the end of a waveguide can help ensure a smooth mirrored finish if the proper procedure is followed. Polishing kits include the appropriate jigs, polishing materials, and instructions. Chipped edges, uneven surfaces, and scratches may result if the instructions are not followed carefully. These conditions will cause signal loss. ."], "jumps": ["P1211", "P1205"]}, {"id": "P1211", "text": ["The two waveguides may be fused together or joined mechanically. A laser, plasma torch, or electric arc may be used to weld fibers together permanently. This is a delicate process and careful consideration must be given to details such as the amount of force used to join the waveguides as well as the alignment."], "jumps": ["P1212", "P1210"]}, {"id": "P1212", "text": ["Mechanical splices allow two waveguides to be joined quickly by using shrink tubes, sleeves, or connectors.  Some mechanical      techniques are as permanent as fusing techniques.  The fibers must be aligned correctly to avoid signal loss.", "Mechanical splices allow two waveguides to be joined quickly by using shrink tubes, sleeves, or connectors. Some mechanical techniques are as permanent as fusing techniques. The fibers must be aligned correctly to avoid signal loss."], "jumps": ["P1240", "P1211"]}, {"id": "P1240", "text": ["Splices are a necessary part of a fiber optic system since trying to run a single piece of mile long cable through a small opening is very awkward. Each splice, however, does mean some signal loss so the number of splices should be kept to a minimum. Splice losses should be below 0.5 dB and most losses are around 0.2 dB."], "jumps": ["P1250", "P1190"]}, {"id": "P1250", "text": ["Which of the following is the proper method for cutting a glass waveguide?", "use high quality scissors sharpened to a fine edgee", "glass waveguides should be cut using a plasma torchh"], "jumps": ["P1190"]}, {"id": "P1251", "text": [], "jumps": []}, {"id": "P1252", "text": ["Scissors should never be used to cut a glass waveguide.  Using scissors may seriously damage the end of the fiber.", "Scissors should never be used to cut a glass waveguide. Using scissors may seriously damage the end of the fiber."], "jumps": []}, {"id": "P1253", "text": ["A plasma torch is used to weld two waveguides together. Torches are not used to cut waveguides."], "jumps": []}, {"id": "P1260", "text": ["A variety of connectors are available for fiber optic applications. Connectors may be made of metal or plastic.  Different connectors are available for multimode and singlemode waveguides.  Some units are threaded and others use a clip-like mechanism for attaching cables or joining other components.", "A variety of connectors are available for fiber optic applications. Connectors may be made of metal or plastic. Different connectors are available for multimode and singlemode waveguides. Some units are threaded and others use a clip-like mechanism for attaching cables or joining other components. RAPHICS TEXT)Connector Requirements 1. Low loss 2. Good environmental stability 3. Easy installation 4. Consistency: There should be the same amount of loss between the same type of connection. 5. Repeatability: Should be able to mate and demate connector many times without changes in loss. 6. Low cost"], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["An acceptable fiber optic connector must meet at least these six requirements regardless of the connector's type or style.", "1. Low loss 2. Good environmental stability 3. Easy installation 4. Consistency: There should be the same amount of loss between the same type of connection. 5. Repeatability: Should be able to mate and demate connector many times without changes in loss. 6. Low cost"], "jumps": ["P1910", "P1260"]}, {"id": "P1910", "text": ["This completes the information on FIBER OPTIC CABLE CONNECTIONS."], "jumps": ["P1001", "P1260"]}, {"id": "P1920", "text": ["1.  Different types of connectors add versatility to a fiber optic             system.  However, some signal loss must be expected for               each connection.  Most of these losses fall into one of two              categories.", "1. Different types of connectors add versatility to a fiber optic system. However, some signal loss must be expected for each connection. Most of these losses fall into one of two categories."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  The three different types of misalignment are lateral                           displacement, end separation, and angular tilt.  Any of these           may occur if the waveguide is not properly inserted into the           connector, if the wrong type of connector is used, or if the              connector is damaged.", "2. The three different types of misalignment are lateral displacement, end separation, and angular tilt. Any of these may occur if the waveguide is not properly inserted into the connector, if the wrong type of connector is used, or if the connector is damaged."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Losses due to waveguide geometry occur because the two           waveguides are mismatched in some way.  The light signal             cannot pass easily from the first waveguide to the second              and signal loss results.", "3. Losses due to waveguide geometry occur because the two waveguides are mismatched in some way. The light signal cannot pass easily from the first waveguide to the second and signal loss results."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  Using the proper technique for splicing waveguides is                     important in order to limit losses to acceptable levels.  High            levels of signal loss may result if the ends of the fibers are              not prepared or aligned correctly.", "4. Using the proper technique for splicing waveguides is important in order to limit losses to acceptable levels. High levels of signal loss may result if the ends of the fibers are not prepared or aligned correctly."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  A variety of connectors are available for fiber optic                            applications.  An acceptable fiber optic connector must meet         at least these six requirements regardless of the connector's         type or style.", "5. A variety of connectors are available for fiber optic applications. An acceptable fiber optic connector must meet at least these six requirements regardless of the connector's type or style.", "1. Low loss 2. Good environmental stability 3. Easy installation 4. Consistency: There should be the same amount of loss between the same type of connection. 5. Repeatability: Should be able to mate and demate connector many times without changes in loss. 6. Low cost"], "jumps": ["P1999", "P1950"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu..."], "jumps": ["P1001", "P1960"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2040", "text": ["In the first part of this experiment you are going to learn how to connectorize a plastic optical fiber, and in the second part you      will observe the losses caused by a mechanical splice.", "In the first part of this experiment you are going to learn how to connectorize a plastic optical fiber, and in the second part you will observe the losses caused by a mechanical splice."], "jumps": ["P2050", "P2001"]}, {"id": "P2050", "text": ["We will be using the grey fiber optic cable to demonstrate the connectorization process.  Wire cutters/strippers are required to cut the waveguide and a crimping tool is used to attach the connectors.", "We will be using the grey fiber optic cable to demonstrate the connectorization process. Wire cutters/strippers are required to cut the waveguide and a crimping tool is used to attach the connectors."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["We will test the fiber optic cable after completing the connectorizing process.  The cable will then be cut in half and      rejoined using a mechanical splice.", "We will test the fiber optic cable after completing the connectorizing process. The cable will then be cut in half and rejoined using a mechanical splice."], "jumps": ["P2090", "P2040"]}, {"id": "P2090", "text": ["1.  Cut a piece of grey fiber optic cable that is 90 cm (3 ft) in                   length.                                                             \n2.  Strip off approximately 7 mm of the outer jacket of a cable with       18 gauge wire strippers.", "1. Cut a piece of grey fiber optic cable that is 90 cm (3 ft) in length. 2. Strip off approximately 7 mm of the outer jacket of a cable with 18 gauge wire strippers. DO NOT use wire cutters to strip the outer jacket of a cable. Do not use strippers other than 18 gauge. Using inappropriate equipment may severely damage the waveguide resulting in unnecessary signal loss.", "DO NOT use wire cutters to strip the outer jacket of a cable. Do not use strippers other than 18 gauge. Using inappropriate equipment may severely damage the waveguide resulting in unnecessary signal loss."], "jumps": ["P2100", "P2040"]}, {"id": "P2100", "text": ["3.  Place the crimp ring and grey connector over one end of the          cable.  Push the connector over the fiber until about 3 mm              protrudes at the end.  Do this for the blue connector also.", "3. Place the crimp ring and grey connector over one end of the cable. Push the connector over the fiber until about 3 mm protrudes at the end. Do this for the blue connector also."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["4.  Carefully position the ring so that it is entirely on the grey                connector and crimp the ring into place.  Do this for the blue          connector also.", "4. Carefully position the ring so that it is entirely on the grey connector and crimp the ring into place. Do this for the blue connector also."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["The reason that there are two separate colors for connectors is for identification purposes only.  Both the blue and grey connectors are the same mechanically.  The grey matches up with the transmitter and the blue matches up with the receiver.", "The reason that there are two separate colors for connectors is for identification purposes only. Both the blue and grey connectors are the same mechanically. The grey matches up with the transmitter and the blue matches up with the receiver."], "jumps": ["P2130", "P2100"]}, {"id": "P2130", "text": ["5.  Any excess fiber protruding from the connector end may be          cut off, however, ensure that at least 1.5 mm of fiber extends          from the connector.", "5. Any excess fiber protruding from the connector end may be cut off, however, ensure that at least 1.5 mm of fiber extends from the connector."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["6.  Look at the bottom of your polishing fixture.  If any of the four        dots are not visible, replace your polishing fixture with a new         one.", "6. Look at the bottom of your polishing fixture. If any of the four dots are not visible, replace your polishing fixture with a new one."], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["7.  Insert the grey connector into the polishing fixture with the             trimmed fiber protruding from the bottom of the fixture.", "7. Insert the grey connector into the polishing fixture with the trimmed fiber protruding from the bottom of the fixture."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["8.  Place the 600 grit abrasive paper (dark grey) on a flat, smooth        surface.  Pressing down on the connector, polish the fiber and      the connector using a figure eight pattern of strokes.  Do this         until the fiber is flush with the polishing fixture.", "8. Place the 600 grit abrasive paper (dark grey) on a flat, smooth surface. Pressing down on the connector, polish the fiber and the connector using a figure eight pattern of strokes. Do this until the fiber is flush with the polishing fixture."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["9.  Wipe the fiber and the polishing fixture clean with the tissue.", "9. Wipe the fiber and the polishing fixture clean with the tissue."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["10.  Place the flush connector and polishing fixture on the dull               side of the 3 mm pink lapping film and continue to polish the           fiber and connector for approximately 25 strokes.  Remove             the connector from the fixture.  The fiber should be flat,                    smooth, and clean.", "10. Place the flush connector and polishing fixture on the dull side of the 3 mm pink lapping film and continue to polish the fiber and connector for approximately 25 strokes. Remove the connector from the fixture. The fiber should be flat, smooth, and clean."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["11.  Repeat steps 7 through 10 with the blue connector.", "11. Repeat steps 7 through 10 with the blue connector. with the trimmed fiber protruding from the bottom of the fixture."], "jumps": ["P2230", "P2180"]}, {"id": "P2195", "text": ["7. Insert the blue connector into the polishing fixture with the trimmed fiber protruding from the bottom of the fixture."], "jumps": ["P2196", "P2190"]}, {"id": "P2196", "text": ["8. Place the 600 grit abrasive paper (dark grey) on a flat, smooth surface. Pressing down on the connector, polish the fiber and the connector using a figure eight pattern of strokes. Do this until the fiber is flush with the polishing fixture.", "until the fiber is flush with the polishing fixture."], "jumps": ["P2197", "P2195"]}, {"id": "P2197", "text": ["9. Wipe the fiber and the polishing fixture clean with the tissue."], "jumps": ["P2198", "P2196"]}, {"id": "P2198", "text": ["10. Place the flush connector and polishing fixture on the dull side of the 3 mm pink lapping film and continue to polish the fiber and connector for approximately 25 strokes. Remove the connector from the fixture. The fiber should be flat, smooth, and clean.", "the connector from the fixture. The fiber should be flat, smooth, and clean."], "jumps": ["P2190", "P2197"]}, {"id": "P2230", "text": ["Your cable is now connectorized.  Now let's use this cable to demonstrate connector loss in the transmission section of a fiber optic system.", "Your cable is now connectorized. Now let's use this cable to demonstrate connector loss in the transmission section of a fiber optic system."], "jumps": ["P2240", "P2190"]}, {"id": "P2240", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2230"]}, {"id": "P2250", "text": ["2.  Carefully plug PC130-301 into the Test Console PC1 position        and PC130-302 into the Test Console PC2 position.", "2. Carefully plug PC130-301 into the Test Console PC1 position and PC130-302 into the Test Console PC2 position. N........................................."], "jumps": ["P2240"]}, {"id": "P2260", "text": ["3.  Set the Positive Supply Control to 15. \n     The Voltmeter on the 130A should indicate 15 Volts. \n4.  Set the Negative Supply Control to 15. \n      The Voltmeter on the 130A should indicate 15 Volts.", "3. Set the Positive Supply Control to 15. The Voltmeter on the 130A should indicate 15 Volts. 4. Set the Negative Supply Control to 15. The Voltmeter on the 130A should indicate 15 Volts."], "jumps": ["P2250"]}, {"id": "P2270", "text": ["5.  Set PC130-301 and PC130-302 as follows:  \n      PC130-301                      PC130-302                           \n      S1 (AGC) - OFF              S1               - ANALOG                 \n                                                 S2 (AGC)  - OFF", "5. Set PC130-301 and PC130-302 as follows: PC130-301 PC130-302 S1 (AGC) - OFF S1 - ANALOG S2 (AGC) - OFF", "SWITCH SETTING - Set the switch on PC130-301 as follows: S1 (AGC) - OFF", "SWITCH SETTINGS - Set the switches on PC130-302 as follows: S1 - ANALOG S2 (AGC) - OFF"], "jumps": ["P2280", "P2260", "P2275", "P2276"]}, {"id": "P2280", "text": ["6.  Set the PC1 and PC2 DC Switch to ON.", "6. Set the PC1 and PC2 DC Switch to ON.o 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2270"]}, {"id": "P2290", "text": ["7.  Connect the function generator to the oscilloscope and set             the function generator for a 300 mVpp sine wave at 1.0 kHz            measured at TP1.       \n8.  Connect the function generator main output to the PC1 Input          BNC.", "7. Connect the function generator to the oscilloscope and set the function generator for a 300 mVpp sine wave at 1.0 kHz measured at TP1. 8. Connect the function generator main output to the PC1 Input BNC.", "BNC CONNECTION - Connect the Function Generator's Main Output BNC to the Test Console's Input Signal BNC."], "jumps": ["P2300", "P2280", "P2295"]}, {"id": "P2300", "text": ["9.  Attach the cable that you connectorized to PC130-301 and             PC130-302.  Be sure that you attach the fiber optic cable's               grey connector to the grey light source housing and the blue         end of the cable to the blue detector housing.", "9. Attach the cable that you connectorized to PC130-301 and PC130-302. Be sure that you attach the fiber optic cable's grey connector to the grey light source housing and the blue end of the cable to the blue detector housing."], "jumps": ["P2310", "P2290", "P2305"]}, {"id": "P2305", "text": ["FIBER OPTIC CONNECTION - Connect the blue end of the cable to the blue detector housing and the grey end of the cable to the grey receiver housing."], "jumps": []}, {"id": "P2310", "text": ["10.  Connect TP1 of the PC130-301 card to CH1 and TP5 of the              PC130-302 card to CH2 of the oscilloscope.  Set the scope              for DUAL mode.", "10. Connect TP1 of the PC130-301 card to CH1 and TP5 of the PC130-302 card to CH2 of the oscilloscope. Set the scope for DUAL mode.", "PROBE CONNECTIONS - Connect the CH1 scope probe to TP1 of the PC130-301 card.", "PROBE CONNECTIONS - Connect the CH2 scope probe to TP5 of the PC130-302 card."], "jumps": ["P2320", "P2300", "P2315", "P2316", "P2310"]}, {"id": "P2320", "text": ["The signal on CH1 is the input signal and the signal on CH2            is the output signal.                                                \n11.  Adjust R1 and R12 on PC130-301, and R10 on PC130-302                until your input and output signals are shaped identically.", "The signal on CH1 is the input signal and the signal on CH2 is the output signal. 11. Adjust R1 and R12 on PC130-301, and R10 on PC130-302 until your input and output signals are shaped identically. ust have the same amplitude as 300 mVpp.", "Both signals must have the approximately same amplitude.", "CONTROLS SETTINGS - Adjust R1 and R12 on the PC130-301 until the input and output signals are shaped identically.", "CONTROL SETTINGS - Adjust R10 on the PC130-302 until the input and the output signals are shaped identical.", "CONTROL SETTINGS - Adjust R10 on the PC130-302 until the input and the output signals are shaped identically."], "jumps": ["P2328", "P2310", "P2325", "P2326", "P2320"]}, {"id": "P2328", "text": ["By sending a signal through the fiber optic cable we can see if the cable is working properly.  If no signal or too small of a signal is present at the output then the fiber optic cable has not been      connectorized correctly, provided that the circuits cards are setup properly.", "By sending a signal through the fiber optic cable we can see if the cable is working properly. If no signal or too small of a signal is present at the output then the fiber optic cable has not been connectorized correctly, provided that the circuits cards are setup properly."], "jumps": ["P2330", "P2320"]}, {"id": "P2330", "text": ["If you cannot achieve the correct output voltage, ask your instructor to check your cable and circuit card setup."], "jumps": ["P2335", "P2320"]}, {"id": "P2335", "text": ["The reason that we adjusted the output signal to match the input signal was to allow us to compensate for the connector loss. Since we have adjusted our signals within 100 mV of each other, we can now add a mechanical splice and observe the additional signal loss."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["12.  Without turning anything off, cut the fiber optic cable that                you constructed in half with your cutters.  You will not get an         electric shock because fiber ectors."], "jumps": ["P13070", "P13040"]}, {"id": "P13070", "text": ["We will test the fiber optic cable after completing the connectorizing process.  The cable will then be cut in half and      rejoined using a mechanical splice.", "We will test the fiber optic cable after completing the connectorizing process. The cable will then be cut in half and rejoined using a mechanical splice."], "jumps": ["P13090", "P13040"]}, {"id": "P13090", "text": ["1.  Cut a piece of grey fiber optic cable that is 90 cm (3 ft) in                   length.                                                             \n2.  Strip off approximately 7 mm of the outer jacket of a cable with      18 gauge wire strippers.", "1. Cut a piece of grey fiber optic cable that is 90 cm (3 ft) in length. 2. Strip off approximately 7 mm of the outer jacket of a cable with 18 gauge wire strippers. DO NOT use wire cutters to strip the outer jacket of a cable. Do not use strippers other than 18 gauge. Using inappropriate equipment may severely damage the waveguide resulting in unnecessary signal loss.", "DO NOT use wire cutters to strip the outer jacket of a cable. Do not use strippers other than 18 gauge. Using inappropriate equipment may severely damage the waveguide resulting in unnecessary signal loss."], "jumps": ["P13100", "P13040"]}, {"id": "P13100", "text": ["3.  Place the crimp ring and grey connector over one end of the          cable.  Push the connector over the fiber until about 3 mm              protrudes at the end.  Do this for the blue connector also.", "3. Place the crimp ring and grey connector over one end of the cable. Push the connector over the fiber until about 3 mm protrudes at the end. Do this for the blue connector also."], "jumps": ["P13110", "P13090"]}, {"id": "P13110", "text": ["4.  Carefully position the ring so that it is entirely on the grey                connector and crimp the ring into place.  Do this for the blue          connector also.", "4. Carefully position the ring so that it is entirely on the grey connector and crimp the ring into place. Do this for the blue connector also."], "jumps": ["P13120", "P13100"]}, {"id": "P13120", "text": ["The reason that there are two separate colors for connectors is for identification purposes only.  Both the blue and grey connectors are the same mechanically. The grey matches up with the transmitter and the blue matches up with the receiver.", "The reason that there are two separate colors for connectors is for identification purposes only. Both the blue and grey connectors are the same mechanically. The grey matches up with the transmitter and the blue matches up with the receiver."], "jumps": ["P13130", "P13100"]}, {"id": "P13130", "text": ["5.  Any excess fiber protruding from the connector end may be          cut off, however, ensure that at least 1.5 mm of fiber extends          from the connector.", "5. Any excess fiber protruding from the connector end may be cut off, however, ensure that at least 1.5 mm of fiber extends from the connector."], "jumps": ["P13140", "P13120"]}, {"id": "P13140", "text": ["6.  Look at the bottom of your polishing fixture.  If any of the four        dots are not visible, replace your polishing fixture with a new         one.", "6. Look at the bottom of your polishing fixture. If any of the four dots are not visible, replace your polishing fixture with a new one."], "jumps": ["P13150", "P13130"]}, {"id": "P13150", "text": ["7.  Insert the grey connector into the polishing fixture with the             trimmed fiber protruding from the bottom of the fixture.", "7. Insert the grey connector into the polishing fixture with the trimmed fiber protruding from the bottom of the fixture."], "jumps": ["P13160", "P13140"]}, {"id": "P13160", "text": ["8.  Place the 600 grit abrasive paper (dark grey) on a flat, smooth        surface.  Pressing down on the connector, polish the fiber and      the connector using a figure eight pattern of strokes.  Do this         unti let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
