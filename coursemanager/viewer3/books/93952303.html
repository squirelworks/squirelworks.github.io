ermine if the  inductor is operating properly.", "Learning to calculate inductive values helps you determine if the inductor is operating properly............", "Lt = L1 + L2 + L3 + . . . XL = 2p", "L XLt = XL1 + XL2 + XL3 + . . ...."], "jumps": []}, {"id": "P440", "text": ["Let's begin the lesson on RL SERIES CIRCUITS. ...................."], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1011", "text": ["The total inductance (Lt) of a series circuit is always greater than\nthe largest inductor.", "The total inductance (Lt) of a series circuit is always greater than the largest inductor.........."], "jumps": []}, {"id": "P1015", "text": ["Placing inductors in series has the same effect as adding more turns on the core."], "jumps": []}, {"id": "P1020", "text": ["The more turns around the core, the higher the inductance."], "jumps": []}, {"id": "P1025", "text": ["The junction between L1 and L2 is essentially the same point."], "jumps": []}, {"id": "P1030", "text": ["Total inductance of the circuit is developed between the left end of L1 and the right end of L2.", "Total inductance of the circuit is developed between the left end of L1 and the right end of L2.."], "jumps": []}, {"id": "P1050", "text": ["To find total inductance (Lt) in a series circuit, use this formula:"], "jumps": []}, {"id": "P1060", "text": ["For example: In this circuit Lt equals 30 mH."], "jumps": []}, {"id": "P1070", "text": ["What is the total inductance of this circuit?", "What is the total inductance of this circuit?.............."], "jumps": []}, {"id": "P1071", "text": [], "jumps": []}, {"id": "P1072", "text": ["Total inductance of inductors in series is higher than the largest  inductor.  Add the inductive values:", "Total inductance of inductors in series is higher than the largest inductor. Add the inductive values:::::::::::"], "jumps": []}, {"id": "P1080", "text": ["What is the total inductance in this circuit?"], "jumps": []}, {"id": "P1081", "text": [], "jumps": []}, {"id": "P1082", "text": ["Remember, change the metric notations to the same value before adding inductances.", "Remember, change the metric notations to the same value before adding inductances....."], "jumps": []}, {"id": "P1090", "text": ["Let's discuss inductive reactance (XL) in a series circuit."], "jumps": []}, {"id": "P1100", "text": ["XL is measured in ohms and expresses the amount of opposition to current flow in the circuit.", "XL is measured in ohms and expresses the amount of opposition to current in the circuit.", "XL is measured in ohms and expresses the amount of opposition to current flow in the circuit.t...."], "jumps": []}, {"id": "P1110", "text": ["XL is caused by the inductance and frequency of the circuit. Let's look at the effects of inductance.", "Inductance describes the induced voltage produced by a changing magnetic field.  The larger the inductance, the greater the induced voltage.", "XL is caused by the inductance and frequency of the circuit. Let's look at the effects of inductance............", "Inductance describes the induced voltage produced by a changing magnetic field. The larger the inductance, the greater the induced voltage.......e."], "jumps": []}, {"id": "P1130", "text": ["AC voltage causes the magnetic field around the inductor to expand and contract producing voltage that opposes circuit current", "AC voltage causes the magnetic field around the inductor to expand and contract producing voltage that opposes circuit currenttttt"], "jumps": []}, {"id": "P1135", "text": ["The larger the field, the greater the induced voltage resulting in   \n more opposition to circuit current.", "The larger the field, the greater the induced voltage resulting in more opposition to circuit current......."], "jumps": []}, {"id": "P1140", "text": ["As inductance increases, current decreases, and inductive reactance increases.", "As inductance increases, current decreases, and inductive reactance increases.sss"], "jumps": []}, {"id": "P1150", "text": ["Frequency is measured in cycles per second.  The more cycles per  second the higher the frequency.", "Frequency is measured in cycles per second. The more cycles per second the higher the frequency....."], "jumps": []}, {"id": "P1160", "text": ["At higher frequencies, the magnetic field expands and contracts   \nfaster which provides more opposition to circuit current.", "At higher frequencies, the magnetic field expands and contracts faster which provides more opposition to circuit current..."], "jumps": []}, {"id": "P1170", "text": ["As frequency increases, current decreases, and inductive reactance increases.", "As frequency increases, current decreases, and inductive reactance increases....."], "jumps": []}, {"id": "P1180", "text": ["Combining the effects of inductance and frequency produces the\nformula for inductive reactance.", "Combining the effects of inductance and frequency produces the formula for inductive reactance......"], "jumps": []}, {"id": "P1185", "text": ["CONSTANT 2 pi - The constant 2p or 6.28, signifies the circular motion from which a sine is derived. Consequently, this formula can only be used in sine wave AC circuits."], "jumps": []}, {"id": "P1190", "text": ["For example, the inductive reactance of L1 is 1.256 kW."], "jumps": []}, {"id": "P1200", "text": ["What is the inductive reactance of L1 in this circuit?                Remember to convert metric prefixes.", "What is the inductive reactance of L1 in this circuit? Remember to convert metric prefixes........."], "jumps": []}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1202", "text": ["1.256 kW is the XL of a 2 H inductor at 100 Hz.  Use 500 Hz for \u0083.", "1.256 kW is the XL of a 2 H inductor at 100 Hz. Use 500 Hz for"], "jumps": []}, {"id": "P1203", "text": ["12.5 kW  is the inductive reactance of L2.  To find XL of L1, use the inductance value of L1 (2 H).", "12.5 kW is the inductive reactance of L2. To find XL of L1, use the inductance value of L1 (2 H)........"], "jumps": []}, {"id": "P1220", "text": ["What is the inductive reactance of L2 in this circuit?                \nRemember to convert metric prefixes.", "What is the inductive reactance of L2 in this circuit? Remember to convert metric prefixes......."], "jumps": []}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1222", "text": ["6.28 kW  is the inductive reactance of L1.  To find XL of L2, use the inductance value of L2 (4 H).", "6.28 kW is the inductive reactance of L1. To find XL of L2, use the inductance value of L2 (4 H)........."], "jumps": []}, {"id": "P1223", "text": ["2.51 kW is the XL of a 4 H inductor at 100 Hz.  Use 500 Hz for \u0083.", "2.51 kW is the XL of a 4 H inductor at 100 Hz. Use 500 Hz for"], "jumps": []}, {"id": "P1230", "text": ["Note, XL of a 2 H inductor at 100 Hz is 1.256 kW and at 500 Hz is    \n6.28 kW.  As frequency increases, XL increases.", "Note, XL of a 2 H inductor at 100 Hz is 1.256 kW and at 500 Hz is 6.28 kW. As frequency increases, XL increases....."], "jumps": []}, {"id": "P1235", "text": ["Note, XL of a 2 H inductor at 500 Hz is 6.28 kW and XL of a 4 H     \n inductor at 500 Hz is 12.56 kW.  As inductance increases, XL         \n increases.", "Note, XL of a 2 H inductor at 500 Hz is 6.28 kW and XL of a 4 H inductor at 500 Hz is 12.56 kW. As inductance increases, XL increases............"], "jumps": []}, {"id": "P1240", "text": ["In a series circuit, total inductive reactance (XLt) is calculated    like total resistance.", "In a series circuit, total inductive reactance (XLt) is calculated like total resistance.........", "XLt = XL1 + XL2 = 6.28 k +12.56 k = 18.84 kW"], "jumps": []}, {"id": "P1250", "text": ["Total XL is determined by adding each inductor's inductive       \n reactance.", "Total XL is determined by adding each inductor's inductive reactance...........", "XLt = XL1 + XL2 = 6.28 k +12.56 k = 18.84 kW"], "jumps": []}, {"id": "P1260", "text": ["Another method used to solve for XLt, is to find Lt and then      \ncalculate XLt.", "Another method used to solve for XLt, is to find Lt and then calculate XLt...........", "XLt = XL1 + XL2 = 6.28 k +12.56 k = 18.84 kW"], "jumps": []}, {"id": "P1270", "text": ["In a circuit containing inductors as well as other components,       other circuit values are calculated using Ohm's Law and XL.", "In a circuit containing inductors as well as other components, other circuit values are calculated using Ohm's Law and XL........", "XLt = 18.84 kW It = = 5.3 mA EL = It x XL EL1 = 33.3 Volts EL2 = 66.6 Voltsltss"], "jumps": []}, {"id": "P1280", "text": ["What is the total current in this pure inductive series circuit?"], "jumps": []}, {"id": "P1281", "text": [], "jumps": []}, {"id": "P1282", "text": ["First solve for total inductive reactance, then use Ohm's Law to    \nsolve for current.", "First solve for total inductive reactance, then use Ohm's Law to solve for current......."], "jumps": []}, {"id": "P1285", "text": ["SOLVING FOR CURRENT -  1. First use either method to solve for XLt.", "SOLVING FOR CURRENT - 1. First use either method to solve for XLt.", "Method 1 Method 2 A. Find Lt A. Find XL for each inductor Lt = L1 + L2... XL1 = 2p", "L2 B. Solve for XLt B. Solve for XLt XLt = 2p", "Lt XLt = XL1 + XL2 '"], "jumps": []}, {"id": "P1286", "text": ["SOLVING FOR CURRENT 2. Use Ohm's law to solve total current. Remember, in a pure inductive circuit, XLt replaces R in Ohm's Law.", "E It = XLt XLt XLt"], "jumps": []}, {"id": "P1290", "text": ["What is the voltage drop across L1 in this pure inductive series     circuit?", "What is the voltage drop across L1 in this pure inductive series circuit??????????"], "jumps": []}, {"id": "P1291", "text": [], "jumps": []}, {"id": "P1292", "text": ["First solve for total current, then use Ohm's Law to solve for the   \nvoltage drop across L1.  Remember, use XL1 for the resistance     value after it has been determined.  EL1 = It x XL1", "First solve for total current, then use Ohm's Law to solve for the voltage drop across L1. Remember, use XL1 for the resistance value after it has been determined. EL1 = It x XL11111111111111111111"], "jumps": []}, {"id": "P1295", "text": ["SOLVING FOR CURRENT\n2.  Use Ohm's law to solve total current.  Remember, in a pure              inductive circuit  XLt replaces R in Ohm's Law.", "SOLVING FOR CURRENT 2. Use Ohm's law to solve total current. Remember, in a pure inductive circuit XLt replaces R in Ohm's Law.", "E It = XLt XLt XLt"], "jumps": []}, {"id": "P1297", "text": ["SOLVING FOR CURRENT 1. First use either method to solve for XLt.", "Method 1 Method 2 A. Find Lt A. Find XL for each inductor Lt = L1 + L2... XL1 = 2p", "L2 B. Solve for XLt B. Solve for XLt XLt = 2p", "Lt XLt = XL1 + XL2 ;"], "jumps": []}, {"id": "P1299", "text": ["SOLVING FOR A VOLTAGE DROP 3. Solve for XL using the inductive reactance formula. 4. Multiply It by XL1 to solve for the voltage drop across L1.", "L 4. EL1 = It x XL1 XLt XLt"], "jumps": []}, {"id": "P1300", "text": ["In an RL series circuit, XL and R cannot be directly added even     though both values are measured in ohms!", "In an RL series circuit, XL and R cannot be directly added even though both values are measured in ohms!!!!!!!!!!!", "Rt = R + XL = 2 kW XLt = R + XL = 2 kW"], "jumps": []}, {"id": "P1310", "text": ["R and XL are not exactly the same quantity.  R and XL oppose current flow differently.", "R and XL are not exactly the same quantity. R and XL oppose current flow differently.", "R and XL are not exactly the same quantity. R and XL oppose current differently."], "jumps": []}, {"id": "P1320", "text": ["In a pure AC resistive circuit, when current is zero, no voltage    \ndrop develops across the resistor.", "In a pure AC resistive circuit, when current is zero, no voltage drop develops across the resistor."], "jumps": []}, {"id": "P1330", "text": ["As current increases, a voltage drop is developed across the      \nresistor.", "As current increases, a voltage drop is developed across the resistor."], "jumps": []}, {"id": "P1340", "text": ["Voltage and current are in phase."], "jumps": []}, {"id": "P1350", "text": ["Combining the graphs shows the phase relationship of current and voltage in an AC series resistive circuit.", "Combining the graphs shows the phase relationship of current and voltage in an AC series resistive circuit......"], "jumps": []}, {"id": "P1360", "text": ["In a pure AC inductive circuit, current is minimum when the voltage across the inductor is maximum.", "In a pure AC inductive circuit, current is minimum when the voltage across the inductor is maximum....."], "jumps": []}, {"id": "P1370", "text": ["As current increases, voltage decreases."], "jumps": []}, {"id": "P1380", "text": ["As current decreases, voltage increases in the opposite direction."], "jumps": []}, {"id": "P1390", "text": ["Voltage and current are not in phase.  Combining the graphs shows voltage leading current by 90 degrees in an inductive circuit.", "Voltage and current are not in phase. Combining the graphs shows voltage leading current by 90 degrees in an inductive circuit..."], "jumps": []}, {"id": "P1410", "text": ["To help remember this relationship, remember the word ELI.  Voltage ( E ) in a inductive circuit ( L ) is before current ( I ). Voltage leads current.", "To help remember this relationship, remember the word ELI. Voltage ( E ) in a inductive circuit ( L ) is before current ( I ). Voltage leads current.3"], "jumps": []}, {"id": "P1420", "text": ["Comparing the resistance and inductance graphs illustrates why R and  XL cannot be added directly.  They oppose current flow at right angles ( 90\u00ba ).", "Comparing the resistance and inductance graphs illustrates why R and XL cannot be added directly. They oppose current at right angles ( 90", "Comparing the resistance and inductance graphs illustrates why R and XL cannot be added directly. They oppose current flow at right angles ( 90"], "jumps": []}, {"id": "P1430", "text": ["For example, if two people push on an object in the same direction (in phase), the total force equals the sum of the two forces.", "For example, if two people push on an object in the same direction (in phase), the total force equals the sum of the two forces....."], "jumps": []}, {"id": "P1435", "text": ["If the resistor and inductor opposed current in the same direction,  they could be added, but they do not.", "If the resistor and inductor opposed current in the same direction, they could be added, but they do not...."], "jumps": []}, {"id": "P1440", "text": ["The inductor and resistor act like two people pushing on an object  at right angles.  The total force is not the sum of the individual  forces.", "The inductor and resistor act like two people pushing on an object at right angles. The total force is not the sum of the individual forces......."], "jumps": []}, {"id": "P1470", "text": ["The combined opposition to current flow from the resistor and inductor is called impedance (Z).  The unit of measure is ohms.", "The combined opposition to current flow from the resistor and inductor is called impedance (Z). The unit of measure is ohms.", "The combined opposition to current from the resistor and inductor is called impedance (Z). The unit of measure is ohms.", "The combined opposition to current flow from the resistor and inductor is called impedance (Z). The unit of measure is ohms.uctor is called impedance (Z). The unit of measure is ohms."], "jumps": []}, {"id": "P1480", "text": ["The formula for total impedance (Zt) is:", "Zt = Rt2 + XL22XL3 = 628 + 942 + 314 = 1884WW XL2 = 6.28 x 10K x 15m = 942W XL3 = 6.28 x 10K x 5m = 314W"], "jumps": []}, {"id": "P1490", "text": ["In this circuit Zt equals 50 ohms.", "Zt = Rt2 + XL22XL3 = 628 + 942 + 314 = 1884WW XL2 = 6.28 x 10K x 15m = 942W XL3 = 6.28 x 10K x 5m = 314W", "Zt = 302 + 402 = 900 + 1600 = 2500 = 50 WVV VVV 314W"], "jumps": []}, {"id": "P1500", "text": ["Total impedance (Zt) dding Er1 and EL1..........", "Zt = R2 + XL2 = 50WWW = 628 + 942 + 314 = 1884WW XL2 = 6.28 x 10K x 15m = 942W XL3 = 6.28 x 10K x 5m = 314W", "E It = = 2 Amps Zt + 314 = 1884WW XL2 = 6.28 x 10K x 15m = 942W XL3 = 6.28 x 10K x 5m = 314W", "Er1 = It x R1 EL1 = It x XL1 2 + 314 = 1884WW XL2 = 6.28 x 10K x 15m = 942W XL3 = 6.28 x 10K x 5m = 314W", "60 V + 80 V 140 V 80 V = 80 V EL2 = 2.7m x 942 = 2.5 V EL3 = 2.7m x 314 = 0.8 V"], "jumps": []}, {"id": "P1550", "text": ["The formula for applied voltage is:", "Er1 = It x R1 = 60 V EL1 = It x XL1 = 80 V = 1884WW XL2 = 6.28 x 10K x 15m = 942W XL3 = 6.28 x 10K x 5m = 314W", "E It = = 2 Amps Zt + 314 = 1884WW XL2 = 6.28 x 10K x 15m = 942W XL3 = 6.28 x 10K x 5m = 314W", "Zt = R2 + XL2 = 50WWW = 628 + 942 + 314 = 1884WW XL2 = 6.28 x 10K x 15m = 942W XL3 = 6.28 x 10K x 5m = 314W", "EA = ER2 + EL2 = 602 + 802 = 10000 = 100 VWV VVV 314W"], "jumps": []}, {"id": "P1560", "text": ["Now, let's use an example to sum up the effects of inductance in an RL series circuit.  Let's solve for total current and voltage drops.", "Now, let's use an example to sum up the effects of inductance in an RL series circuit. Let's solve for total current and voltage drops......."], "jumps": []}, {"id": "P1570", "text": ["1.  Calculate inductive reactance.", "XL1 = 490 W XL2 = 980 W XLt = ? Rt = ? Zt = ? It = ? Er1 = ? Er2 = ? EL1 = ? EL2 = ? Ea = ?a = ? Ea = ?", "XL1 = 6.28 x 60K x 1.3m = 490W XL2 = 6.28 x 60K x 2.6m = 980W 3 = 6.28 x 10K x 5m = 314W", "L = 942W XL3 = 6.28 x 10K x 5m = 314W"], "jumps": []}, {"id": "P1580", "text": ["2. Find total inductive reactance.", "XL1 = 490 W XL2 = 980 W XLt = 1470 W Rt = ? Zt = ? It = ? Er1 = ? Er2 = ? EL1 = ? EL2 = ? Ea = ? Ea = ?", "XL1 = 6.28 x 60K x 1.3m = 490W XL2 = 6.28 x 60K x 2.6m = 980W 3 = 6.28 x 10K x 5m = 314W", "XLt = XL1 + XL2 = 490 + 980 = 1470 W = 942W XL3 = 6.28 x 10K x 5m = 314W"], "jumps": []}, {"id": "P1590", "text": ["3. Determine total resistance.", "XL1 = 490 W XL2 = 980 W XLt = 1470 W Rt = 1200 W Zt = ? It = ? Er1 = ? Er2 = ? EL1 = ? EL2 = ? Ea = ???a = ?", "Rt = R1 + R2 = 500 + 700 = 1200 W 6.28 x 60K x 2.6m = 980W", "XLt = XL1 + XL2 = 490 + 980 = 1470 W = 942W XL3 = 6.28 x 10K x 5m = 314W"], "jumps": []}, {"id": "P1600", "text": ["4. Solve for total impedance.", "XL1 = 490 W XL2 = 980 W XLt = 1470 W Rt = 1200 W Zt = 1900 W It = ? Er1 = ? Er2 = ? EL1 = ? EL2 = ? Ea = ???", "Zt = 12002 + 14702 = 1.44M + 2.16M = 3.60M = 1900 WWWWWx 5m = 314W", "Zt = Rt2 + XLt2XL3 = 628 + 942 + 314 = 1884WW XL2 = 6.28 x 10K x 15m = 942W XL3 = 6.28 x 10K x 5m = 314W"], "jumps": []}, {"id": "P1610", "text": ["5. Solve for total current.", "XL1 = 490 W XL2 = 980 W XLt = 1470 W Rt = 1200 W Zt = 1900 W It = 63.2 mA Er1 = ? Er2 = ? EL1 = ? EL2 = ? Ea = ?", "120 V It = 1900 W = 63.2 mA= 13790000 = 3713 W 3713 Wm = 314W", "E It = Zt = 628 + 942 + 314 = 1884WW XL2 = 6.28 x 10K x 15m = 942W XL3 = 6.28 x 10K x 5m = 314W"], "jumps": []}, {"id": "P1620", "text": ["6. Solve for voltage drops.", "XL1 = 490 W XL2 = 980 W XLt = 1470 W Rt = 1200 W Zt = 1900 W It = 63.2 mA Er1 = 31.6 V Er2 = 44.2 V EL1 = 31.0 V EL2 = 61.9 V Ea = ?", "Er1 = 63.2m x 500 = 31.6 V Er2 = 63.2m x 700 = 44.2 V EL1 = 63.2m x 490 = 31.0 V EL2 = 63.2m x 980 = 61.9 VV", "Er = It x R EL = It x XL Zt942 + 314 = 1884WW XL2 = 6.28 x 10K x 15m = 942W XL3 = 6.28 x 10K x 5m = 314W"], "jumps": []}, {"id": "P1630", "text": ["To check the results, use the voltage drops and solve for Ea.", "Ea = Ert2 + ELt2L3 = 628 + 942 + 314 = 1884WW XL2 = 6.28 x 10K x 15m = 942W XL3 = 6.28 x 10K x 5m = 314W", "Ea = 75.82 + 92.92 = 5745.64 + 8630.41 = 14376.05 = 119.9 VV 314W", "XL1 = 490 W XL2 = 980 W XLt = 1470 W Rt = 1200 W Zt = 1900 W It = 63.2 mA Er1 = 31.6 V Er2 = 44.2 V EL1 = 31.0 V EL2 = 61.9 V Ea = 119.9 V"], "jumps": []}, {"id": "P1632", "text": ["To check the results, use the voltage drops and solve for Ea.", "Ea = Ert2 + ELt2L3 = 628 + 942 + 314 = 1884WW XL2 = 6.28 x 10K x 15m = 942W XL3 = 6.28 x 10K x 5m = 314W", "Ea = 75.82 + 92.92 = 5745.64 + 8630.41 = 14376.05 = 119.9 VV 314W", "XL1 = 490 W XL2 = 980 W XLt = 1470 W Rt = 1200 W Zt = 1900 W It = 63.2 mA Er1 = 31.6 V Er2 = 44.2 V EL1 = 31.0 V EL2 = 61.9 V Ea = 119.9 V"], "jumps": []}, {"id": "P1635", "text": ["Er1 + Er2 = Ert EL1 + EL2 = ELt Ea = Ert2 + ELt2 XLt XLt", "SOLVING FOR Ea - 1. Add the voltages that have the same phase. 2. Then use the formula for Ea:"], "jumps": []}, {"id": "P1640", "text": ["Note, rounding causes slight differences in the applied voltage.", "XL1 = 490 W XL2 = 980 W XLt = 1470 W Rt = 1200 W Zt = 1900 W It = 63.2 mA Er1 = 31.6 V Er2 = 44.2 V EL1 = 31.0 V EL2 = 61.9 V Ea = 119.9 V", "Ea = Ert2 + ELt2L3 = 628 + 942 + 314 = 1884WW XL2 = 6.28 x 10K x 15m = 942W XL3 = 6.28 x 10K x 5m = 314W", "Ea = 75.82 + 92.92 = 5745.64 + 8630.41 = 14376.05 = 119.9 VV 314W"], "jumps": []}, {"id": "P1650", "text": ["Calculate the voltage drops in this circuit. Round off responses to the nearest tenth.", "Calculate the voltage drops in this circuit. Round off responses to the nearest tenth..."], "jumps": []}, {"id": "P1651", "text": [], "jumps": []}, {"id": "P1653", "text": ["1. Total inductive reactance\n2. Total resistance\n3. Total impedance\n4. Total current\n5. Voltage drops\n6. Check by calculating Ea", "SOLVING FOR VOLTAGE DROPS - Solve the following quantities in order.", "1. Total inductive reactance 2. Total resistance 3. Total impedance 4. Total current 5. Voltage drops 6. Check by calculating Ea uch a quantity for further help."], "jumps": []}, {"id": "P1654", "text": ["TOTAL INDUCTIVE REACTANCE - 1. Find XL for each inductor. 2. Then solve for XLt.", "L XLt = XL1 + XL2 + ... XLt XLt"], "jumps": []}, {"id": "P1655", "text": ["Rt = R1 + R2 + ... R1 + R2 + ... XLt XLt", "TOTAL RESISTANCE - Add the resistive values."], "jumps": []}, {"id": "P1656", "text": ["Zt = Rt2 + XLt2 R1 + R2 + ... XLt XLt"], "jumps": []}, {"id": "P1657", "text": ["E It = Zt XLt XLt"], "jumps": []}, {"id": "P1658", "text": ["VOLTAGE DROPS - Use Ohms Law:", "Er = It x R EL = It x XL XLt XLt"], "jumps": []}, {"id": "P1660", "text": ["Your answers were not acceptable.  Let's review the problem and see where you made mistakes.", "Your answers were not acceptable. Let's review the problem and see where you made mistakes...."], "jumps": []}, {"id": "P1670", "text": ["1.  Solve for the total inductive reactance.  Check your\n     calculations with the answers given.", "1. Solve for the total inductive reactance. Check your calculations with the answers given.......", "XL1 = 628W XL2 = 942W XL3 = 314W XLt = 1884W Rt = ? Zt = ? It = ? Er1 = ? EL1 = ? EL2 = ? EL3 = Ea = ?", "XL1 = 6.28 x 10k x 10m = 628W XL2 = 6.28 x 10k x 15m = 942W XL3 = 6.28 x 10k x 5m = 314W", "XLt = XL1 + XL2 + XL3 = 628 + 942 + 314 = 1884W XL2 = 6.28 x 10K x 15m = 942W XL3 = 6.28 x 10K x 5m = 314W"], "jumps": []}, {"id": "P1680", "text": ["2.  Total resistance equals R1.  Solve for total impedance.  Check\n       your calculations with the answers given.", "2. Total resistance equals R1. Solve for total impedance. Check your calculations with the answers given.", "XL1 = 628W XL2 = 942W XL3 = 314W XLt = 1884W Rt = 3.2 kW Zt = 3713 W It = ? Er1 = ? EL1 = ? EL2 = ? EL3 = Ea = ?", "Zt = 3.2k2 + 18842 = 10.24M + 3.55M = 13790000 = 3713 Wx 5m = 314W", "Zt = Rt2 + XLt2XL3 = 628 + 942 + 314 = 1884WW XL2 = 6.28 x 10K x 15m = 942W XL3 = 6.28 x 10K x 5m = 314W"], "jumps": []}, {"id": "P1690", "text": ["3.  Solve for total current.  Check your calculations with the                 answers given.", "3. Solve for total current. Check your calculations with the answers given..", "XL1 = 628W XL2 = 942W XL3 = 314W XLt = 1884W Rt = 3.2 kW Zt = 3713 W It = 2.7 mA W Er1 = ? EL1 = ? EL2 = ? EL3 = ? Ea = ?", "10 It = 3713 = 2.7 mA = 13790000 = 3713 W 3713 Wm = 314W", "E It = Zt = 628 + 942 + 314 = 1884WW XL2 = 6.28 x 10K x 15m = 942W XL3 = 6.28 x 10K x 5m = 314W"], "jumps": []}, {"id": "P1700", "text": ["4.  Solve for voltage drops.  Check your calculations with the umps": []}, {"id": "P1726", "text": ["Zt = Rt2 + XLt2 R1 + R2 + ... XLt XLt"], "jumps": []}, {"id": "P1727", "text": ["E It = Zt XLt XLt"], "jumps": []}, {"id": "P1728", "text": ["VOLTAGE DROPS - Use Ohms Law:", "Er = It x R EL = It x XL XLt XLt"], "jumps": []}, {"id": "P1729", "text": ["Er1 + Er2 = Ert EL1 + EL2 = ELt Ea = Ert2 + ELt2 XLt XLt", "SOLVING FOR Ea - 1. Add the voltages that have the same phase. 2. Then use the formula for Ea:"], "jumps": []}, {"id": "P1730", "text": ["Remember, when solving for values in an RL series circuit:       1.  R and XL effect current 90\u00ba out of phase and cannot be   \n        added directly.", "Remember, when solving for values in an RL series circuit: 1. R and XL effect current 90", "out of phase and cannot be added directly..y..yyyy"], "jumps": []}, {"id": "P1732", "text": ["2.  Er and EL are not in phase and cannot be added directly.", "2. Er and EL are not in phase and cannot be added directly."], "jumps": []}, {"id": "P1733", "text": ["3.  Ir and IL have the same phase, current is the same at every           point.", "3. Ir and IL have the same phase, current is the same at every point.....nt."], "jumps": []}, {"id": "P1750", "text": ["The last circuit value is power.  In AC circuits with reactance,     \nthere are three types of power.", "The last circuit value is power. In AC circuits with reactance, there are three types of power. power.", "Real Reactive Apparent Pa = Ea x It Pa = Ea x It a = Ea x It"], "jumps": []}, {"id": "P1760", "text": ["Real power is the power consumed by the resistor.", "Real Pr = Er x Ir Reactive Apparent Pa = Ea x It a = Ea x It"], "jumps": []}, {"id": "P1770", "text": ["Reactive power is the power in the inductor.", "Real Pr = Er x Ir Reactive PL = EL x IL Apparent a = Ea x It"], "jumps": []}, {"id": "P1775", "text": ["Inductors draw power when the magnetic field is expanding and return power when the magnetic field is contracting."], "jumps": []}, {"id": "P1780", "text": ["Apparent power is the combination of real power and reactive power.", "Apparent power is the combination of real power and reactive power..", "Real Pr = Er x Ir Reactive PL = EL x IL Apparent Pa = Ea x It"], "jumps": []}, {"id": "P1799", "text": ["The following ten problems gives you practice in solving values in inductive circuits and resistive inductive circuits.  Calculate the value that the question asks for and touch the appropriate answer.", "The following ten problems gives you practice in solving values in inductive circuits and resistive inductive circuits. Calculate the value that the question asks for and touch the appropriate answer...r..................r."], "jumps": []}, {"id": "P1802", "text": [], "jumps": []}, {"id": "P1801", "text": [], "jumps": []}, {"id": "P1800", "text": ["1.  What is the total inductance of this circuit?", "1. What is the total inductance of this circuit?.........."], "jumps": []}, {"id": "P1810", "text": ["2.  What is the total inductance of this circuit?", "2. What is the total inductance of this circuit?.........."], "jumps": []}, {"id": "P1820", "text": ["3.  What is total inductance of this circuit?", "3. What is total inductance of this circuit??............."], "jumps": []}, {"id": "P1830", "text": ["4.  What is the inductive reactance of L1?", "4. What is the inductive reactance of L1?................."], "jumps": []}, {"id": "P1840", "text": ["5.  What is the inductive reactance of L2?", "5. What is the inductive reactance of L2?................."], "jumps": []}, {"id": "P1850", "text": ["6.  What is the total inductive reactance in this circuit?", "6. What is the total inductive reactance in this circuit?."], "jumps": []}, {"id": "P1860", "text": ["7.  What is the total inductive reactance in this circuit?", "7. What is the total inductive reactance in this circuit?."], "jumps": []}, {"id": "P1870", "text": ["8.  What is the total impedance in this circuit?", "8. What is the total impedance in this circuit?..........."], "jumps": [ let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
