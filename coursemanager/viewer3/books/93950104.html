ns with like denominators, subtract the numerators and keep the same denominator."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. Find the common denominator first when adding fractions             with unlike denominators.", "3 4482 3 3 3 3 3 3", "2 1 + 4 4 18 3 3 3", "1 1 + 2 4 3 3 3 3", "3. Find the common denominator first when adding fractions with unlike denominators."], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["4. Find the common denominator first when subtracting fractions     with unlike denominators.", "1 4482 3 3 3 3 3 3", "2 1 4 4 18 3 3 3", "1 1 2 4 3 3 3 3", "4. Find the common denominator first when subtracting fractions with unlike denominators.."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. To change a fraction, multiply both the numerator and                      denominator by the same number.", "2 3482 3 3 3 3 3 3", "6 9 9 4 4 18 3 3 3", "2 x 3 3 x 3 3 3 3 3", "5. To change a fraction, multiply both the numerator and denominator by the same number."], "jumps": ["P1970", "P1940"]}, {"id": "P1970", "text": ["6. Mixed numbers may be changed to improper fractions first             before adding or subtracting.", "11 2 4 4 18 3 3 3", "11 1 4 2 18 3 3 3", "3 1 2 4 2 3 3 3", "11 2 + 4 4 18 3 3 3", "11 1 + 4 2 8 3 3 3", "3 1 2 + 4 2 3 3 3", "6. Mixed numbers may be changed to improper fractions first before adding or subtracting.."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7. Fractions may be added or subtracted by changing mixed              numbers to improper fractions first.", "7 = 2 3 = 2 10 2222", "3 2 2 1 + 1 2 333", "7 = 2 3 = 2 4 22", "3 2 2 1 1 2 333", "7. Fractions may be added or subtracted by changing mixed numbers to improper fractions first."], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["8. When adding and subtracting fractions:", "* Change mixed numbers to improper fractions (if desired) * Find a common denominator if required * Add or subtract the fractions * Reduce to lowest terms", "8. When adding and subtracting fractions:.................."], "jumps": ["P1999", "P1980"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu..."], "jumps": []}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2015", "text": ["Multiplying and dividing fractions is actually easier than adding and subtracting fractions.", "1 1 1 x = 2 4 888", "Multiplying and dividing fractions is actually easier than adding and subtracting fractions.I"], "jumps": ["P2020", "P2001"]}, {"id": "P2020", "text": ["Let's see how to multiply fractions first.", "1 1 1 x = 2 4 888"], "jumps": ["P2030", "P2015"]}, {"id": "P2030", "text": ["To multiply fractions, you first multiply the numerators of each fraction to find the numerators' product.", "1 1 1 x = 2 4 888"], "jumps": ["P2040", "P2015"]}, {"id": "P2040", "text": ["Then you multiply the denominators of each fraction to find the denominators' product.", "1 1 1 x = 2 4 888"], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["Last, you reduce to the lowest terms.  Since 1/8 is the lowest term, the total product of 1/2 x 1/4 is 1/8.", "Last, you reduce to the lowest terms. Since 1/8 is the lowest term, the total product of 1/2 x 1/4 is 1/8.", "1 1 1 x = 2 4 888"], "jumps": ["P2060", "P2030"]}, {"id": "P2060", "text": ["Multiplying is simple, multiply the numerators and denominators and then reduce to lowest terms!", "2 3 1 x = 3 4 288"], "jumps": ["P2070", "P2030", "P2065"]}, {"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-04-99 Conversion cleanup steps 1 thru 9 - lisa 08-06-99 Conversion cleanup steps 10 thru 17 - lisa 11-03-99 Changed plus sign to multiplication sign P2230. Lydia 04-26-00 Executed clear response. Penny 07-14-00 Converted to ToolBook 7.1 format. jay 09-22-00 P1970 changed 3/2 to 1/2. lydia 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 01-25-02 Reviewed and corrected graphics, text, scripting. Jeff H 02-13-02 P420 Changed 1/1 + 1/1 =1 to 1/2 + 1/2 =1. Lydia 09-06-02 Objective page corrected. frieda"], "jumps": []}, {"id": "P2070", "text": ["Look at this example, notice how the whole number 4 is changed to the improper fraction 4/1.", "1 4 1 4 x = x 2 1 222"], "jumps": ["P2071", "P2060"]}, {"id": "P2071", "text": ["Then the numerators and denominators are multiplied, the result is reduced to the lowest terms, 2.", "1 4 1 4 4 x = x = = 2 2 1 2 2Q"], "jumps": ["P2080", "P2070"]}, {"id": "P2080", "text": ["If mixed numbers are used, you must first change the mixed numbers to improper fractions before multiplying.", "24 66 3 3 3 3 3 3", "3 8 x 2 3 3 3 3", "1 2 1 x 2 2 3 3 3 3"], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["What is the product of multiplying 2/3 by 2/3?", "What is the product of multiplying 2/3 by 2/3?.............", "2 2 x 3 3 4 4 888"], "jumps": ["P2080"]}, {"id": "P2091", "text": [], "jumps": []}, {"id": "P2092", "text": ["You picked 4/3. You multiplied the numerators but did not multiply the denominators."], "jumps": []}, {"id": "P2093", "text": ["You picked 2/9. You multiplied the denominators but did not multiply the numerators."], "jumps": []}, {"id": "P2100", "text": ["What is the product of multiplying 2 1/3 by 3 3/7?", "What is the product of multiplying 2 1/3 by 3 3/7?.........", "1 3 2 x 3 3 78"], "jumps": ["P2090", "P2105"]}, {"id": "P2101", "text": [], "jumps": []}, {"id": "P2102", "text": ["Change the mixed numbers to improper fractions before multiplying. Then reduce to lowest terms.", "1 3 2 x 3 3 78", "7 24 x 3 778"], "jumps": []}, {"id": "P2105", "text": ["Multiply 7 and 3 and then add 3. Place the result over the denominator 7.1/4444444", "Multiply 2 and 3 and then add 1. Place the result over the denominator 3. 1/444444", "1 7 2 = 3 3333333333 38", "3 24 3 = 7 7 77777 78"], "jumps": []}, {"id": "P2110", "text": ["Let's take a closer look at the multiplication problem in the preceding question.", "1 3 2 x 3 = 8 3 7 3"], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["The first step is to change the mixed numbers to improper fractions.", "1 3 2 x 3 = 3 7 3 3", "7 24 x = 8 3 7 3 3"], "jumps": ["P2130", "P2110", "P2125"]}, {"id": "P2122", "text": ["The first step is to change the mixed numbers to improper fractions.", "1 3 2 x 3 = 3 7 3 3", "7 24 x = 8 3 7 3 3"], "jumps": ["P2130", "P2110", "P2125"]}, {"id": "P2125", "text": ["Multiply 7 and 3 and then add 3. Place the result over the denominator 7.1/4444444", "Multiply 2 and 3 and then add 1. Place the result over the denominator 3. 1/444444", "1 7 2 = 3 3333333333 38", "3 24 3 = 7 7 77777 78"], "jumps": []}, {"id": "P2130", "text": ["Multiply the numerators and denominators. Then reduce to the lowest terms.", "7 24 x = 3 7 3 3", "168 = 8 21 21 21 7"], "jumps": ["P2140", "P2122", "P2135"]}, {"id": "P2132", "text": ["Multiply the numerators and denominators. Then reduce to the lowest terms.", "168 = 8 21 21 21 7", "7 24 x = 3 7 3 3", "1 3 2 x 3 = 3 7 3 3"], "jumps": ["P2140", "P2122", "P2135"]}, {"id": "P2135", "text": ["168 2113 3 3 7 7 2288", "Divide the numerator and denominator by 21. 8 1 21 168 21 21 - 168 21 000 00 8 1["], "jumps": []}, {"id": "P2140", "text": ["However, another step can be done before the multiplication that will make things easier.", "7 24 x 3 7 7 3 3", "1 3 2 x 3 = 3 7 3 3"], "jumps": ["P2150", "P2132"]}, {"id": "P2150", "text": ["Notice that once the mixed numbers were changed to improper fractions, you have 7 over 7.", "7 24 x 3 7 7 3 3", "1 3 2 x 3 = 3 7 3 3"], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["Well, 7 over (divided by) 7 equals 1, the sevens cancel."], "jumps": ["P2170", "P2140"]}, {"id": "P2170", "text": ["In other words, the improper fractions reduce to:", "1 24 x 3 1 7 3 3"], "jumps": ["P2180", "P2140"]}, {"id": "P2180", "text": ["Also notice that you have 24 over 3.  This reduces to 8 over 1.", "1 24 x = 3 1 3 3", "1 8 x 1 1 1 7 3 3", "Also notice that you have 24 over 3. This reduces to 8 over 1."], "jumps": ["P2190", "P2140"]}, {"id": "P2190", "text": ["Now multiply the numerators and denominators!", "8 = 8 1 1 1 1 7 3 3", "1 8 x = 1 1 7 3 3"], "jumps": ["P2200", "P2140"]}, {"id": "P2200", "text": ["Look at this example. This is the way that improper fractions are reduced before multiplication.", "2 3 = 3 = 3 9 3 3", "6 5 x = 5 9 3 3", "1 5 1 x = 5 9 3 3"], "jumps": ["P2210", "P2140", "P2205"]}, {"id": "P2205", "text": ["3) Multiply 2 1 2 x = 1 3 3", "2) Reduce fractions prior to multiplying..", "1) Change mixed numbers to improper fractions.", "2 3 = 3 = 3 9 3 3", "6 5 x = 5 9 3 3", "1 5 1 x = 5 9 3 3"], "jumps": []}, {"id": "P2210", "text": ["You may use this method when applicable.  Remember, sometimes a reduction is not possible before multiplication.", "You may use this method when applicable. Remember, sometimes a reduction is not possible before multiplication."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["Caution, reducing fractions does not apply in addition.", "54 25 + = 45 45 3 3", "6 5 + 5 9 3 3", "79 = 45 3 = 3 9 3 3", "6 5 + = 5 9 3 3", "34 1 45 9 9 9 3 3", "Caution, reducing fractions does not apply in addition....."], "jumps": ["P2230", "P2200"]}, {"id": "P2230", "text": ["Reduce these fractions before multiplying.", "x = 7 1 1 3 3", "2 7 3 = 3 9 3 3", "16 5 x = 35 8 3 3", "Reduce these fractions before multiplying. answers (5)....."], "jumps": ["P2220"]}, {"id": "P2231", "text": [], "jumps": []}, {"id": "P2233", "text": ["Your answers are still incorrect.  You should have answered 2 for the first and 1 for the second answer.", "Your answers are still incorrect. You should have answered 2 for the first and 1 for the second answer."], "jumps": ["P2240", "P2230"]}, {"id": "P2240", "text": ["Now, let's see how division is done.", "Now, let's see how division is done........................", "1 1 1 x = 2 4 888"], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["Recall that division is the opposite of multiplication."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["So to divide, you invert the divisor and then multiply!", "3 2666 3 3 3 3 3 3", "1 3 x 2 1 3 3 3", "So to divide, you invert the divisor and then multiply!...."], "jumps": ["P2270", "P2230"]}, {"id": "P2270", "text": ["You know that 4 divided by 2 equals 2, and that whole numbers can be represented as fractions, 4 = 4/1 and 2 = 2/1."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["So 4/1 \u00f7 2/1 would look like the example shown. Inverting the 2/1 and multiplying produces the whole number 2.", "2 2666 3 3 3 3 3 3", "4 2666 3 3 3 3 3 3", "4 1 x 1 2 3 3 3", "2/1 would look like the example shown. Inverting the 2/1 and multiplying produces the whole number 2."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["To divide fractions, you simply invert the divisor and multiply."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["Dividing mixed numbers requires that you change the mixed numbers to improper fractions, then invert and multiply.", "3 3 x 2 7 3 3 3", "9 146 3 3 3 3 3 3"], "jumps": ["P2310", "P2280"]}, {"id": "P2310", "text": ["You may also reduce the division after the inversion and before you multiply.", "4 3 x 3 2 3 3 3", "6 3346 3 3 3 3 3 3"], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["Don't be confused by this notation of division.", "1 2 1 444442 3 3 3 3 3", "Don't be confused by this notation of division............."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["This notation is the same as:"], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["Which reduces to:", "2 1 4 1 x 1 1 3 3 3 3", "1 4 x 2 1 3 3 3 3"], "jumps": ["P2350", "P2320"]}, {"id": "P2350", "text": ["What is the quotient of 2/3 divided by 3/5?", "What is the quotient of 2/3 divided by 3/5?................"], "jumps": ["P2320"]}, {"id": "P2351", let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
