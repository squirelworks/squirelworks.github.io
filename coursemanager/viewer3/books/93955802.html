<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Discuss a full step 1f stepper controller. w Discuss a full step 2f stepper controller. w Determine the circuit operation of full step 1f and 2f stepper controller."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson you will learn about stepper motor controllers."], "jumps": ["P300", "P410"]}, {"id": "P410", "text": ["You will learn about the full step single phase motor controller."], "jumps": ["P400", "P420"]}, {"id": "P420", "text": ["You will also learn about the full step two phase motor controller."], "jumps": ["P400", "P430"]}, {"id": "P440", "text": ["Let's begin the lesson on STEPPER CONTROLLERS.LLERS......................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["A system which contains a step pattern and driver circuit is called a Stepper Controller."], "jumps": ["P1001", "P1030"]}, {"id": "P1030", "text": ["A typical Stepper Controller must have provisions for a variety of motor characteristics."], "jumps": ["P1020", "P1040"]}, {"id": "P1040", "text": ["Due to the digital characteristics of the stepper, it is ideally suited for microprocessor control."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["Most stepper controllers utilize digital circuit components such as flip-flops and latches."], "jumps": ["P1040", "P1060"]}, {"id": "P1060", "text": ["QA QB QC QDD", "The simplest type of stepper controller is a full step single phase controller."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["The circuit schematic is nothing more than a simple J-K shift register."], "jumps": ["P1060", "P1080"]}, {"id": "P1080", "text": ["To eliminate the need to re-input data every 4th clock pulse, a feedback loop from QD to Data In can be employed."], "jumps": ["P1060", "P1090"]}, {"id": "P1090", "text": ["1 2 3 4 1 2", "The output signals show a sequential step pattern generated by the tracking edge clock pulses."], "jumps": ["P1060"]}, {"id": "P1100", "text": ["Notice that the shaft right circuit relates to a QA to QD coil energizing sequence, or, a CW rotation of the stepper motor output shaft."], "jumps": ["P1090"]}, {"id": "P1110", "text": ["To reverse motor direction, coils must be energized in a reverse order (QD to QA)."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["The circuit below is used to control FWD/REV direction....."], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["The FWD/REV switch will send either a logic 0 to the upper AND and a logic 1 to the lower AND gates or vice versa."], "jumps": ["P1120", "P1140"]}, {"id": "P1140", "text": ["Notice that the sequence of coil winding activations can be reversed by the FWD/REV switch and the inverting amplifier."], "jumps": ["P1120", "P1150"]}, {"id": "P1150", "text": ["QA QB QC QDD", "A two phase full step generator is practically identical to a single phase generator. Clocking two windings at the same time provides smoother step operation."], "jumps": ["P1160", "P1120"]}, {"id": "P1160", "text": ["1 2 3 4 1", "Time delaying a logic 1 data input for two clock pulses generates the 2f full step pattern. You will note the st", "Time delaying a logic 1 data input for two clock pulses generates the 2f full step pattern. You will note the step sequence is maintained but held for one clock pulse longer."], "jumps": ["P1150", "P1170"]}, {"id": "P1170", "text": ["To reverse the stepper rotation direction, coil sequence must be reversed."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["The input DATA and CLOCK signal frequencies must not exceed the Slew Rate and Error Free Start-Stop rates of the stepper motor."], "jumps": ["P1190", "P1170"]}, {"id": "P1182", "text": ["The slew rate (SR) is the maximum number of steps that a stepper motor can use and still operate correctly.f the stepper motor."], "jumps": []}, {"id": "P1184", "text": ["The Error Free Start-Stop (EFSS) is a rate that is used when a stepper motor is first started or when the stepper motor is stopped. This rate is less than the slew rate and is normally between 100 and 1000 pulses per second.."], "jumps": []}, {"id": "P1190", "text": ["The stepper motor is ramped up and down in normal operation...RPM."], "jumps": ["P1180", "P1200"]}, {"id": "P1200", "text": ["A block diagram of a ramp up - ramp down circuit is illustrated below."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["A digital start signal is applied to the latch input. The output latches high..."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["The integrator provides the ramp up signal after receiving the HIGH from the latch..."], "jumps": ["P1200", "P1230"]}, {"id": "P1230", "text": ["The integrator output is applied to a voltage controlled oscillator (VCO)...age controlled oscillator."], "jumps": ["P1240", "P1200"]}, {"id": "P1240", "text": ["The VCO output starts low but increases in frequency with the applied voltage. This allows the stepping motor to gradually increase speed."], "jumps": ["P1250", "P1200"]}, {"id": "P1250", "text": ["The shift register receives the input from the VCO and the clock input. Neither input exceeds the error free start-stop rating of the stepper motor."], "jumps": ["P1260", "P1200"]}, {"id": "P1260", "text": ["The shift register then sequences the output based on the inputs..."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["The step signal is applied to the drivers and then the motor windings. The motor continues rotation until a stop signal is received which begins the ramp down process."], "jumps": ["P1280", "P1250"]}, {"id": "P1280", "text": ["What is the primary difference between a 1f and 2f full step generator?"], "jumps": ["P1270"]}, {"id": "P1281", "text": [], "jumps": []}, {"id": "P1282", "text": ["Clock speed has no bearing on 1f or 2f full step generator action but rather on the speed of the circuit."], "jumps": []}, {"id": "P1283", "text": ["Slew rate covers acceleration and deceleration speeds of the stepper motor only."], "jumps": []}, {"id": "P1290", "text": ["For either a 1f or 2f full step generator, how can you change motor direction?"], "jumps": ["P1280"]}, {"id": "P1291", "text": [], "jumps": []}, {"id": "P1292", "text": ["Clock speed correlates to circuit speed only..............."], "jumps": []}, {"id": "P1293", "text": ["Data speed does not effect any circuit action.............."], "jumps": []}, {"id": "P1300", "text": ["QA QB QC QDD", "The full step generators discussed so far have not depended on the number of clock and data pulses."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["Exact output shaft position was not important in the previously discussed circuits."], "jumps": ["P1300", "P1320"]}, {"id": "P1320", "text": ["Closed loop controllers are typically used when motor output shaft position is important."], "jumps": ["P1310", "P1330"]}, {"id": "P1330", "text": ["This relayed signal is used to determine how much of an output signal is needed, relative to stepper motor output shaft position."], "jumps": ["P1320", "P1910"]}, {"id": "P1910", "text": ["This completes the information on STEPPER MOTOR CONTROLLERS.."], "jumps": ["P1320", "P1001"]}, {"id": "P1920", "text": ["1. Most stepper controllers utilize digital circuit components such as flip-flops and latches."], "jumps": ["P1001", "P1930"]}, {"id": "P1930", "text": ["QA QB QC QDD", "2. The simplest type of stepper controller is a full step single phase controller."], "jumps": ["P1920", "P1940"]}, {"id": "P1940", "text": ["3.  The step pattern shows a single phase coil activation output.", "1 2 3 4 1 2", "3. The step pattern shows a single phase coil activation output."], "jumps": ["P1930", "P1950"]}, {"id": "P1950", "text": ["4. To reverse motor direction, coils must be energized in the reverse order. A FWD/REV circuit controller is used."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["QA QB QC QDD", "5. A two phase full step controller is similar to a full step single phase controller."], "jumps": ["P1950", "P1970"]}, {"id": "P1970", "text": ["1 2 3 4 1", "6. The logic levels are energized for two clock periods instead of one."], "jumps": ["P1960", "P1980"]}, {"id": "P1980", "text": ["7. There are many characteristics of a stepper motor that motor controllers must incorporate."], "jumps": ["P1970", "P1999"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1980", "P1001"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["Due to the digital characteristics of the stepper, it is ideally suited to _______ control."], "jumps": []}, {"id": "P10211", "text": ["Most Stepper Controllers utilize digital circuit components such as _______"], "jumps": []}, {"id": "P10212", "text": ["What is the simplest type of controller? ?"], "jumps": []}, {"id": "P10213", "text": ["A full step single phase Stepper Controller is really nothing more than a single _______ c"], "jumps": []}, {"id": "P10214", "text": ["Given the following stepper motor with a coil activation sequence QA QD. What direction will the rotor rot let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
