8<48<88;48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["1. Using the PDA Title Enter objective 1 line item 2 here. item 2 here.e.e.", "w Unpacking the PDA and setting it up for use. w Navigation through the PDA menus and programs. w Creating, saving, and deleting notes. w Using the PDA for Nida Corporation training materials."], "jumps": []}, {"id": "P300", "text": ["3. Nida Corporation PDA memory carda Corporation PDA memory card"], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P350", "text": ["*****222222k2kkk//////TWWWW LL LLLL((((", "*****2*222k2kkkkkk/////TTWWW LL[L[LL(LL(((", "**)**2*222kkkkk////////TWWWWW LLL[L(L(L(((((", "**222222kkkkk///////TTTTWWWWW LLLLLL((((("], "jumps": []}, {"id": "P360", "text": [")l)))))))))))))))))))))*)))))*)*********f*nfn*n*nn*nnnnnnC nn C ..n. . ..9.. ...9..9 ...=.= =.y", "n .9.9.= 9 =.= =.=.=.....................................C..C..C.C.C.C.CC.CCCCCCCCCCCCnCCCCCCCCCCfCCfCfCffCffffffff"], "jumps": []}, {"id": "P400", "text": ["The PDA, or Personal Digital Assistant, is a very useful tool and is quickly replacing pencil and paper for appointment reminders, note taking, and storing personal data such as telephone numbers and addresses..."], "jumps": ["P300", "P410"]}, {"id": "P410", "text": ["While useful for those functions, the PDA also can be used as a training aid using pre-programmed memory cartridges."], "jumps": []}, {"id": "P420", "text": ["This greatly enhances the learning experience as the PDA can be used anywhere and does not require a computer to operate. The PDA is a hand-held computer with the ability to store and retrieve data as the user desires..."], "jumps": []}, {"id": "P430", "text": ["Let's begin the lesson on PDA FAMILIARIZATION............................."], "jumps": []}, {"id": "P900", "text": [], "jumps": ["P430"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Remove the PDA, the battery, the charging cord, and the memory card case from the box and the packaging. Set the box and the packaging aside, saving it for future storage."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Following the owner's manual or Getting Started guide, install the battery in the PDA."], "jumps": []}, {"id": "P1040", "text": ["Plug the charging cord into the PDA and a nearby wall outlet."], "jumps": []}, {"id": "P1050", "text": ["Again referring to the owner's manual, perform a Full or Hard Reset on the PDA. This will erase all memory and restore the PDA to the factory default settings. If you must align the screen when powering up, the proper reset function was performed..."], "jumps": []}, {"id": "P1060", "text": ["Open the memory case by flipping the catch and remove the memory card. Handle the card by the edges. Do not touch the metal contacts of the card."], "jumps": []}, {"id": "P1070", "text": ["Holding the PDA in the left hand, insert the memory card into the memory expansion slot in the PDA. Pay close attention to the alignment of the card. Push the card in until it latches into place."], "jumps": []}, {"id": "P1080", "text": ["Usually at the top of the PDA is the Power button. When pressed once it will power up the PDA. Pressing the Power button a second time will power down the unit. The Power button also indicates the battery charging state when plugged into a power source.."], "jumps": []}, {"id": "P1090", "text": ["At the side of the PDA is the stylus. The stylus is used on the display for writing notes, typing, and making menu selections. It is the only device which should be used on the display. Pencils and other sharp objects should not be used as they may damage the surface of the display..."], "jumps": []}, {"id": "P1100", "text": ["Turn on the PDA by pressing the Power button. The display should light. The device will power down if unused for a while. Just press the Power button again to resume where you left off. It should also be noted the screen will dim after a short time of no-use but will brighten again at the first input..."], "jumps": []}, {"id": "P1110", "text": ["Remove the stylus from the PDA by lifting it from its slot. Use your fingernail for the initial pull. Touch the stylus to the screen to brighten the image."], "jumps": []}, {"id": "P1120", "text": ["The Today screen equates to the Windows desktop of a laptop or desktop computer. Across the top of the screen is a dark colored bar indicating the status of some of the functions of the device. Near the top right of the screen is a clock display..."], "jumps": []}, {"id": "P1130", "text": ["There are different functions that can be performed using the stylus on the screen. The first to be discussed is the tap."], "jumps": []}, {"id": "P1140", "text": ["Lightly touch the clock display with the stylus once and a summary of the time, upcoming appointments, and the condition of the battery will be displayed for about 5 seconds. The single, light touch is called a tap. It is used like the left button on a mouse on a desktop computer..."], "jumps": []}, {"id": "P1150", "text": ["The next stylus function to discuss is the hold function. The hold function equates to the right mouse button on a desktop computer. Place the stylus tip on the clock icon and hold it in place. Shortly after first contact a ring of red dots will begin building, surrounding the stylus tip..."], "jumps": []}, {"id": "P1160", "text": ["After the red dot ring completes, a sub-menu will appear. The clock sub-menu after the hold is activated allows you to select a digital or an analog clock display. Select the analog display by giving ANALOG a tap. Hold the analog clock display until the clock menu again comes up and select the digital clock again with a tap.....", "77B77777777777799999999999 ffffffff", "7BBBBBBBB7777777777799999999999 9 fffffffff", "7BBBBBBBBB77777777797999999999999 ffffffff", "7BBBBBBBB7777777777999999999999 9 fffffff", "7BBBBBBBB777777777779999999999999 ffffffff", "7BBBBBBBB77777777779799999999999 ffffffff", "7BB777B77777777777779999999999999 fffffffff", "7BBBBBBBB777777777797999999999999 fffffff", "7BBBBBBBB77777777777999999999999 ffffffff", "7BBBBBBBB777777777779999999999999 fffffff", "g77B77777777777779999999999999 9 ffffffff"], "jumps": []}, {"id": "P1170", "text": ["Next to the clock display is a small speaker icon. Tap the speaker icon to bring up the speaker sub-menu. The volume may be set using the stylus or the speaker may be turned off completely..."], "jumps": []}, {"id": "P1180", "text": ["Turn off the speaker by selecting Off and note the speaker icon changes at the top of the Today screen to indicate a no-sound condition. Select On again and leave the menu by tapping anywhere on the screen except the speaker sub-menu..."], "jumps": []}, {"id": "P1190", "text": ["To the left of the speaker is the Connectivity icon. This icon indicates when the PDA is connected to a desktop computer. It is not necessary to discuss this icon at this time as connectivity is not required for this course. Data on this icon and the functions represented is available in the owner's manual..."], "jumps": []}, {"id": "P1200", "text": ["When the main battery is down to 20% of full charge a Low Battery icon will appear at the left of the Connectivity icon. The unit should be plugged in soon for recharging to prevent loss of data..."], "jumps": []}, {"id": "P1210", "text": ["In the upper left of the Today screen is a Windows icon and the word Start. These again equate to the Windows operating system on a desktop computer and will bring up the Start menu. Tap the icon and a drop-down menu will appear. Now tap the Programs icon..."], "jumps": []}, {"id": "P1220", "text": ["Tap Calculator on the menu. The screen changes to a standard calculator screen. The stylus may be used to select the numbers and the math functions. You'll note in the upper right corner of the calculator screen is an X in a circle. After performing a couple of math functions, tap the X and note the screen returns to the previous screen....."], "jumps": []}, {"id": "P1230", "text": ["Back at the Today screen you'll see in the extreme lower left-hand corner the word New. This is a menu shortcut to making new notes, appointments, contacts, or tasks. Tap New and select Note. An empty, lined notepad will appear..."], "jumps": []}, {"id": "P1240", "text": ["From this point there are several options for entering notes but we'll discuss just two of them. The first is just the simple matter of writing to the screen using the stylus. Tap the keyboard in the lower right hand corner of the screen to use the second note recording method, a QWERTY keyboard..."], "jumps": []}, {"id": "P1250", "text": ["Using the stylus, tap each letter to enter a note. The CAP and Shift keys toggle, locking in place on each tap of the key. Enter a note now. When completed, shrink the keyboard by again tapping the small keyboard icon in the lower right-hand corner of the screen..."], "jumps": []}, {"id": "P1260", "text": ["The next step is to edit the note which brings up the third stylus activity known as dragging. A carry-over from Windows, the drag stylus function allows highlighting an area or a list of items or multiple letters or words, similar to holding down the left mouse key to highlight a section of text in a document for editing..."], "jumps": []}, {"id": "P1270", "text": ["Try dragging now. Using the stylus, tap an area of the screen or a letter of your note and slide the stylus to the right. Remove the stylus from the screen when the selected area is highlighted. Should the desired area be missed, tap the note screen at any area and try again."], "jumps": []}, {"id": "P1280", "text": ["To delete the dragged or highlighted section of the note, bring up the Edit menu by tapping the Edit at the bottom left of the screen next to New. In the Edit menu, tap Cut or Clear to delete the highlighted portion of the note. When finished editing, tap OK in the upper right part of the screen..."], "jumps": []}, {"id": "P1290", "text": ["Tapping OK on the Note screen automatically saves the file under the Notes folder. The first 15 characters of the note make up the note name. To view the note or further edit the note, tap the note name and the note is again displayed. When finished editing or viewing the note, tap OK.K..."], "jumps": []}, {"id": "P1300", "text": ["Back at the Notes templates screen again, hold the stylus on the note and another menu will pop up. Several options are available. Select Delete. Another screen will appear advising that this will permanently delete the note. Tap Yes to delete the note. Tap the X in the upper right hand corner until the Today screen is again displayed...."], "jumps": []}, {"id": "P1310", "text": ["At the Today screen, select Programs and then select File Explorer from the Programs screen."], "jumps": []}, {"id": "P1320", "text": ["This should bring the File Explorer program up and display the folders in the PDA. The top item should be My Device as shown. If something other than My Device is at the top, tap the item and select My Device from the drop-down menu..."], "jumps": []}, {"id": "P1330", "text": ["Select Storage Card in the item list. If Storage Card is not present and available for selection, verify the memory card is seated firmly in place, cycle the power to the PDA and try these steps again..."], "jumps": []}, {"id": "P1340", "text": ["Selecting Storage Card in the previous step should bring up a menu similar to the one displayed. Select the Nida folder."], "jumps": []}, {"id": "P1350", "text": ["Folders are listed first with files following. Use the scroll bar on the right of the screen to scroll down past the folders and to the files. Locate the file dcmain and select it. This will open the Internet Explorer program..."], "jumps": []}, {"id": "P1360", "text": ["Internet Explorer is loaded along with the dcmain file. dcmain is the main menu program for the Nida training program review files. The screen should be as illustrated with the path to the file, file://\\Storage%20Card\\nida\\dcmain, listed at the top of the screen in the address line.line."], "jumps": []}, {"id": "P1370", "text": ["At the bottom of the screen select Tools and then Options... to bring up the setup screen for Internet Explorer."], "jumps": []}, {"id": "P1380", "text": ["The setup screen should be shown. In the Home page section of the screen select Use Current. In the History section reduce the counter from 30 days to 1 day. Tap OK at the top of the screen to save these settings..."], "jumps": []}, {"id": "P1390", "text": ["The Internet Explorer screen has several navigation tools available. The first is the scroll bar at the right of the screen. The scroll bar may be used by tapping or dragging the scroll bar up and down to find the specific underlined menu item desired. Tap the desired underlined menu item to bring up the detail page..."], "jumps": []}, {"id": "P1400", "text": ["Tap the X in the upper right corner until the Today screen is shown."], "jumps": []}, {"id": "P1410", "text": ["At the Today screen, tap Start and select Internet Explorer. You'll note the program returned to the same screen last displayed."], "jumps": []}, {"id": "P1420", "text": ["At the bottom center of the screen are the Internet Explorer navigation tools. The first navigation tool to discuss is the Back Arrow. When tapped, the Back Arrow takes you back to the previous screen viewed in Internet Explorer. Tapping the Back Arrow will continue going to previous screens. en the memory limit is reached the Back Arrow dims and it is no longer active....."], "jumps": []}, {"id": "P1430", "text": ["After going Back a few pages using the Back Arrow, you'll need to go Forward to get back to the previous screen. This is an option on the View pop-up menu. Tap the View icon to obtain the View menu..."], "jumps": []}, {"id": "P1440", "text": ["The top option is the Forward command and will advance the screens forward. Tap Forward to go forward in the past viewed screens. You'll need to access the View menu for each Forward command..."], "jumps": []}, {"id": "P1450", "text": ["Should you feel lost among the various screens, use the Home icon. One tap of the Home icon will take you directly to the Home screen, the Nida Main Menu."], "jumps": []}, {"id": "P1460", "text": ["Should the image be difficult to read or too large, adjustments to the text size and the overall image are available at the View menu. The Fit to Screen option allows enlargement of graphics and the Text Size option allows setting the size of the fonts..."], "jumps": []}, {"id": "P1470", "text": ["This completes the basic instruction for the PDA using the Microsoft", "Pocket PC operating system. You should be able to navigate through the various screens, take and retrieve notes, and use the PDA as a review tool for the Nida training..."], "jumps": []}, {"id": "P1480", "text": ["More detailed information is available in the owner's manual for the device. Turn off the PDA. The memory card should be removed and stored if the PDA will not be used for a few days."], "jumps": []}, {"id": "P1910", "text": ["You have completed the information on PDA FAMILIARIZATION.."], "jumps": ["P1001", "P1480"]}, {"id": "P1920", "text": ["1. The PDA, Personal Digital Assistant, is a very useful tool for electronics training..."], "jumps": ["P1001", "P1930"]}, {"id": "P1930", "text": ["2. The PDA can be used for taking notes, calculation, appointment setting, and lesson reviews.."], "jumps": []}, {"id": "P1940", "text": ["3. All lesson reviews provided by Nida Corporation are supplied on the memory card.."], "jumps": []}, {"id": "P1950", "text": ["4. Advanced information for use of the PDA can be found in the User's Guide packaged with the PDA."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P195 P1340", "text": ["Selecting Storage Card in the previous step should bring up a menu similar to the one displayed. Select the Nida folder (o.", "Selecting Storage Card in the previous step should bring up a menu similar to the one displayed. Select the Nida folder (or Student folder depending on which storage card you have)."], "jumps": []}, {"id": "PINFO", "text": ["02-23-04 Converted from sty - patty 02-23-04 Added graphics f", "02-23-04 Converted from sty - patty 02-23-04 Added graphics for P1030, P1040, and P1050. -sarah. 02-24-03 Changed equipment needed page and added P350 and P360. -sarah. 09-30-04 Changed \"...Select the Nida folder.\" to \"...Select the Nida folder (or Student folder depending on which storage card you have).\" to reflect the changes made to the storage card. -Phil"], "jumps": []}]};
let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
