<script>
const book = {"title": "93950607", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: FORCE MEASUREMENTS asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["ates to acceleration and Newton's Second Law of Motion.", "w Describe force as it relates to inertia and Newton's First Law of Motion.", "w Describe force as it relates to interaction and Newton's Third Law of Motion..", "w Describe force as it relates to acceleration and Newton's Second Law of Motion."], "jumps": []}, {"id": "P400", "text": ["The study of simple motion, which is known as kinematics , concerns itself with the relationship between speed, time and distance."], "jumps": ["P410"]}, {"id": "P405", "text": ["KINEMATICS - A branch of dynamics that deals with the aspects of motion apart from considerations of mass and force."], "jumps": []}, {"id": "P410", "text": ["The elements of velocity and acceleration, both constant and changing, are also a part of kinematics."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Kinematics is limited because the cause of these different motions is never explained."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["The study of dynamics takes kinematics one step further because not only is motion described, but the forces that affect motion are also inspected."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's take a look at the major elements of dynamics and force, Newton's Three Laws of Motion, and see how the different force measurements are taken."], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["Let's Begin the Lesson on FORCE MEASUREMENTS. AND INFINITY................"], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": ["The role of force is familiar in our everyday lives.   Every kind of push or pull is normally described as a force.", "The role of force is familiar in our everyday lives. Every kind of push or pull is normally described as a force."], "jumps": ["P1020", "P1001"]}, {"id": "P1020", "text": ["These are common examples of force involving motion, but there does not have to be a motion to describe force."], "jumps": ["P1030", "P1010"]}, {"id": "P1030", "text": ["For example, a horse can exert a force and not move a heavy block of stone or a man can push on a wall and not budge it even one inch.", "Force is a measured quantity that changes, or intends to change, an object's state of rest or motion."], "jumps": ["P1050", "P1010", "P1060", "P1030"]}, {"id": "P1060", "text": ["To describe force, we need to define the direction in which the force acts as well as its magnitude; the magnitude of force is how much or how hard the force pushes or pulls."], "jumps": ["P1050"]}, {"id": "P1070", "text": ["The standard unit of force measurement is the newton (N), named after the first scientist to effectively define force, Sir Isaac Newton."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["One newton is the amount of force required to accelerate one kilogram of mass at 1 meter per second  .", "One newton is the amount of force required to accelerate one kilogram of mass at 1 meter per second ."], "jumps": ["P1090"]}, {"id": "P1090", "text": ["Here are a few typical magnitudes of force:", "Here are a few typical magnitudes of force:................", "Electron force in a hydrogen atom 2 X 10 N", "Maximum pulling force of a locomotive 8.9 X 10 NNNNNNNNN", "Sun's gravitational force on earth 3.5 X 10 N", "Thrust of a rocket 3.9 X 10 NNNNNNNNN", "Weight of a large blue whale 1.9 X 106 NNNNNNNNNN", "Weight of a 250 pound linebacker 1.1 X 103 NNNNNNNNNNNNN", "Weight of a medium sized apple 1 NNNNNNNNNNNNNNNNNNNNNN", "Weight of an insect egg 2 X 10-6 NNNNNNNNNNNNNNNNN", "Weight of a very small bacterium 1 X 10-18 NNNNNNNNNNN", "Weight of hydrogen atom 1.6 X 10-26 NNNNNNNNNNNNN"], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["The most important elements of force and motion can be described by three statements called Newton's Laws of Motion.", "1. A body at rest stays at rest unless a force is applied to it. 2. The effect of an applied force causes an object to accelerate in the direction of the force. The acceleration is directly related to the force and is indirectly related to the object's mass. 3. For every action there is always an equal and opposite reaction. to equal zero.", "The most important elements of force and motion can be described by three statements called Newton's Laws of Motion. A body at rest stays at rest unless a force is applied to it. 2. For every force, there is an equal and opposite force. 3. Two forces acting on the same body cause the body's acceleration to equal zero."], "jumps": ["P1090"]}, {"id": "P1110", "text": ["Newton's first law of motion says every object stays at rest, or continues to move in a straight, uniform line at a constant velocity, unless a force is applied to it."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["This tendency of a body to remain at rest, or to keep moving once it is set in motion, is known as inertia."], "jumps": []}, {"id": "P1130", "text": ["To illustrate this, slide a hockey puck along a tabletop by applying a horizontal force."], "jumps": []}, {"id": "P1140", "text": ["After you stop pushing, the puck won't continue to slide indefinitely, it will eventually slow down and stop."], "jumps": []}, {"id": "P1150", "text": ["To keep the puck sliding across the table, you have to keep pushing, meaning you have to apply force constantly."], "jumps": ["P1160"]}, {"id": "P1160", "text": ["The reason you need to continue to apply force is the table applies an opposite force, called friction , that prevents the puck from sliding endlessly."], "jumps": ["P1170"]}, {"id": "P1162", "text": ["The reason you need to continue to apply force is the table applies an opposite force, called friction , that prevents the puck from sliding endlessly."], "jumps": []}, {"id": "P1165", "text": ["FRICTION - Friction is the resistance encountered when the surface of one object moves upon or across the surface of another."], "jumps": []}, {"id": "P1170", "text": ["By sliding the puck across the smooth ice of a skating rink, you'll see it move much further after you quit pushing before it stops."], "jumps": ["P1162"]}, {"id": "P1180", "text": ["By sliding the puck across an air hockey table, where it will float on a thin cushion of air offering very little friction, it will slide even further."], "jumps": ["P1190"]}, {"id": "P1190", "text": ["Newton's first law states that if friction could be completely eliminated, no forward force would be needed to keep an object moving once it has started."], "jumps": []}, {"id": "P1200", "text": ["Additionally, if no force is applied to an object, it will remain at rest forever."], "jumps": ["P1220", "P1190"]}, {"id": "P1220", "text": ["When an object is acted on by no force or by two opposing forces that cause the object to remain at rest, the object is in equilibrium."], "jumps": ["P1230"]}, {"id": "P1230", "text": ["The more friction a surface possesses, the easier it allows an object to move over it."], "jumps": ["P1220"]}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1232", "text": ["Remember, friction is the resistance encountered when the surface of one object moves upon or across the surface of another."], "jumps": []}, {"id": "P1240", "text": ["Remember, the greater the inertia an object has, the greater the force required to produce an initial velocity."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["For example, a football lying on the ground has little mass, so it has only a small amount of inertia."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["This means the football has little resistance to force."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["You can produce a velocity and acceleration very easily by kicking it with your foot."], "jumps": ["P1250"]}, {"id": "P1280", "text": ["A bowling ball on the other hand, has much more inertia. Because of its mass, it won't be difficult to tell its difference in inertia from the football."], "jumps": ["P1290", "P1250"]}, {"id": "P1290", "text": ["Newton's first law establishes which aspects of motion have a cause, and which aspects don't.", "Uniform motion in a straight line is the only motion possible for an object that is far removed from other objects."], "jumps": ["P1300", "P1280", "P1310", "P1290"]}, {"id": "P1310", "text": ["For example, since space possesses virtually no friction, the satellite will travel in a straight line at a uniform velocity.", "On the other hand, the non-uniform motion of an object is always caused by the presence of other factors, such as gravity or friction."], "jumps": ["P1315", "P1300", "P1320"]}, {"id": "P1320", "text": ["Once the satellite enters the gravitational field of the planet and is affected by it, the motion is no longer uniform."], "jumps": ["P1330", "P1315"]}, {"id": "P1330", "text": ["The satellite's motion is now controlled by the mass, acceleration, velocity, and force of both objects.", "This illustrates that uniform motion needs only an initial force to cause its motion while non-uniform motion needs other factors to determine its path."], "jumps": ["P1340", "P1315", "P1910"]}, {"id": "P1910", "text": ["You have completed the information on NEWTON'S FIRST LAW OF MOTION."], "jumps": ["P1001", "P1340"]}, {"id": "P1920", "text": ["1.   Every kind of push or pull is normally described as a force.", "1. Every kind of push or pull is normally described as a force."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.   Magnitude of force is how much or how hard the force                     pushes or pulls.", "2. Magnitude of force is how much or how hard the force pushes or pulls."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.   Newton's three laws of motion are:", "3. Newton's three laws of motion are: body at rest stays at rest unless a force is applied to it. 2. For every force, there is an equal and opposite force. 3. Two forces acting on the same body cause the body's acceleration to equal zero.", "1. A body at rest stays at rest unless a force is applied to it. 2. The effect of an applied force causes an object to accelerate in the direction of the force. The acceleration is directly related to the force and is indirectly related to the object's mass. 3. For every action there is always an equal and opposite reaction. to equal zero."], "jumps": ["P1920"]}, {"id": "P1950", "text": ["4.   Newton's first law of motion says every object stays at rest,           or continues to move in a straight, uniform line at a constant          velocity, unless a force is applied to it.", "4. Newton's first law of motion says every object stays at rest, or continues to move in a straight, uniform line at a constant velocity, unless a force is applied to it."], "jumps": ["P1940"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1950"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2010", "text": ["Newton's second law of motion is more concerned with the non-uniform movement of objects than the first law of motion.", "Newton's first law of motion states that as long as there is no net force being applied to an object, the object remains as is, whether it is at rest or moving.", "Newton's second law of motion examines what happens to an object when a force is actually applied to it.", "This law states: The effect of an applied force causes an object to accelerate in the direction of the force. The acceleration is directly related to the force and is indirectly related to the object's mass.", "This law states: The effect of an applied force causes an object to accelerate in the direction of the force. The acceleration is directly related to the force and is indirectly related to the object's mass..."], "jumps": ["P2020", "P2001", "P2030", "P2010", "P2040", "P2050"]}, {"id": "P2050", "text": ["If the object is at rest when a force is applied, it has the tendency to move in the direction of the force and will move faster as long as the force continues."], "jumps": ["P2060", "P2020"]}, {"id": "P2060", "text": ["If an object is moving in a straight line when the force is applied in the same direction, this object will also increase in speed as long as the force continues."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["If the force is applied in the direct opposite of the object's direction, the acceleration will again be in the direction of the force; in this case, the object will slow down."], "jumps": ["P2080", "P2050"]}, {"id": "P2080", "text": ["If force continues for a long enough time period, the object will eventually slow down to a stop and then begin to move with increasing speed in the opposite direction."], "jumps": ["P2090", "P2070"]}, {"id": "P2081", "text": [], "jumps": ["P2100", "P2080"]}, {"id": "P2090", "text": ["If the force applied to a moving body is not in line with its motion, the acceleration will still be in the direction of the force."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["The force must be directly opposite to the object's direction for the acceleration to go against the object's path."], "jumps": ["P2110", "P2080"]}, {"id": "P2110", "text": ["Let's look at an example of Newton's second law of motion using a spring balance, a common instrument for measuring."], "jumps": ["P2120", "P2080"]}, {"id": "P2120", "text": ["The spring balance consists of a coil spring, enclosed in a case for protection, with a pointer attached to one end."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["When a force is applied to the end of the spring, it stretches.   The more force that is applied, the more the spring will stretch.", "When a force is applied to the end of the spring, it stretches. The more force that is applied, the more the spring will stretch."], "jumps": ["P2140", "P2110"]}, {"id": "P2140", "text": ["To illustrate Newton's second law of motion, let's apply the spring balance to a hockey puck on an air-hockey table, which is a virtually frictionless surface."], "jumps": ["P2150", "P2110"]}, {"id": "P2150", "text": ["Initially, the puck is traveling horizontally across the x-axis of the below graph."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["Using the spring balance, we apply a constant horizontal force (F) to the puck.   During the time the force is applied, the puck's velocity changes at a constant rate.", "Using the spring balance, we apply a constant horizontal force (F) to the puck. During the time the force is applied, the puck's velocity changes at a constant rate."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["This means the puck is moving with constant acceleration.   If we change the magnitude of the applied force, the acceleration will change in the exact proportion.", "This means the puck is moving with constant acceleration. If we change the magnitude of the applied force, the acceleration will change in the exact proportion."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["This means that if the force is doubled, the acceleration is doubled.   If the force is cut in half, the acceleration is also reduced by a half.", "This means that if the force is doubled, the acceleration is doubled. If the force is cut in half, the acceleration is also reduced by a half."], "jumps": ["P2190", "P2160"]}, {"id": "P2190", "text": ["By taking away the force, the acceleration becomes zero, and the body moves with constant velocity.   Remember, constant velocity can be zero, which means the puck is at rest.", "By taking away the force, the acceleration becomes zero, and the body moves with constant velocity. Remember, constant velocity can be zero, which means the puck is at rest."], "jumps": ["P2200", "P2160"]}, {"id": "P2200", "text": ["In another example, we give the puck the same initial force as in the previous example, but this time we'll reverse the direction of the force."], "jumps": ["P2210", "P2160"]}, {"id": "P2210", "text": ["This time the puck moves more and more slowly to the right, stops, and then begins to move faster and faster toward the left."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["Now the direction of the acceleration is toward the left, in the same direction as the applied force (F)."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["By looking at these two examples, we can conclude that the magnitude of acceleration is directly related to the amount of applied force."], "jumps": ["P2240", "P2210"]}, {"id": "P2240", "text": ["Also, the direction of the acceleration is the same as that of the force, regardless of the direction of the velocity."], "jumps": ["P2250", "P2210"]}, {"id": "P2250", "text": ["For any given object, the ratio between applied force and acceleration is always the same, regardless of how much or how little force is applied."], "jumps": ["P2260", "P2210"]}, {"id": "P2260", "text": ["This ratio is known as the mass of the body, and it is denoted by (m) in the following equation: F = ma where (F) is the amount of applied force measured in Newtons and (a) is the amount of acceleration the object possesses measured in meters/sec   .", "This ratio is known as the mass of the body, and it is denoted by (m) in the following equation: F = ma where (F) is the amount of applied force measured in Newtons and (a) is the amount of acceleration the object possesses measured in meters/sec .."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["For example, a tile worker applies a constant horizontal force with magnitude of 20 Newtons to a box having a mass of 40 kilograms."], "jumps": ["P2280", "P2260", "P2275"]}, {"id": "P2275", "text": ["F = ma -  Remember, a Newton is defined as:", "F = ma - Remember, a Newton is defined as:"], "jumps": []}, {"id": "P2280", "text": ["If the box is resting on a relatively frictionless surface, we can find the acceleration of the box."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["By rearranging the equation to solve for acceleration, we get:"], "jumps": ["P2300", "P2270"]}, {"id": "P2300", "text": ["By substituting 20 Newtons for the force (F) and substituting\n40 kg for the mass (m), we get the formula below.   This is the acceleration of the box.", "By substituting 20 Newtons for the force (F) and substituting 40 kg for the mass (m), we get the formula below. This is the acceleration of the box."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["If a waitress shoves a ketchup bottle with a mass of .2 kilograms along a smooth, level lunch counter toward a customer at an acceleration of 2.8 meters/second  , what is the amount of force she has applied to the bottle?", "If a waitress shoves a ketchup bottle with a mass of .2 kilograms along a smooth, level lunch counter toward a customer at an acceleration of 2.8 meters/second , what is the amount of force she has applied to the bottle???"], "jumps": ["P2290", "P2315"]}, {"id": "P2311", "text": [], "jumps": []}, {"id": "P2312", "text": ["The equation for solving for force is:", "The equation for solving for force is:....................."], "jumps": []}, {"id": "P2315", "text": ["FINDING FORCE - Since the mass (m) and acceleration (a) of the ketchup bottle is given, simply insert these values into the equation for force:"], "jumps": []}, {"id": "P2320", "text": ["By knowing any two of the three elements: force, mass, and acceleration, we can determine the relationship between them using Newton's second law of motion."], "jumps": ["P2910", "P2310"]}, {"id": "P2910", "text": ["You have completed the information on NEWTON'S SECOND LAW OF MOTION.", "1.   Newton's second law of motion examines what happens to            an object when a force is actually applied to it.", "1. Newton's second law of motion examines what happens to an object when a force is actually applied to it....."], "jumps": ["P2001", "P2320", "P2930"]}, {"id": "P2930", "text": ["2.  The force must be directly opposite to the object's direction            for the acceleration to go against the object's path.", "2. The force must be directly opposite to the object's direction for the acceleration to go against the object's path."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3.   A spring balance is a common instrument used for measuring.", "3. A spring balance is a common instrument used for measuring."], "jumps": ["P2999", "P2930"]}, {"id": "P2999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2940"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3010", "text": ["Newton's third law of motion is primarily concerned with the force interaction between two separate objects."], "jumps": ["P3020", "P3001"]}, {"id": "P3020", "text": ["A force acting on an object is always the result of the object's interaction with another object; this means that forces always come in pairs."], "jumps": ["P3030", "P3010"]}, {"id": "P3030", "text": ["Newton's third law of motion says that for every action there is always an equal and opposite reaction."], "jumps": ["P3010"]}, {"id": "P3040", "text": ["In this statement, action and reaction are two forces that are equal in magnitude, but are opposite in direction.", "Force1 = Force2xt"], "jumps": ["P3010"]}, {"id": "P3050", "text": ["A good example is a book resting on a table.  The book has a downward force on the table and the table has an equal upward force on the book.", "A good example is a book resting on a table. The book has a downward force on the table and the table has an equal upward force on the book."], "jumps": ["P3040"]}, {"id": "P3060", "text": ["In order to walk forward on a level floor, you exert a horizontal force against the floor with your feet, while the floor pushes against your feet with an equal and opposite force."], "jumps": ["P3050"]}, {"id": "P3070", "text": ["If these forces were not equal, you would either fall right through the floor or you would be propelled right up into the ceiling."], "jumps": ["P3060"]}, {"id": "P3080", "text": ["In each of these situations we have two objects. In the first case, the two forces are the book against the table and the table against the book."], "jumps": ["P3070"]}, {"id": "P3090", "text": ["In the second, the two forces are the force of the foot against the floor and the force of the floor against the foot.   In each case, one force is the action and the other force is the reaction.", "In the second, the two forces are the force of the foot against the floor and the force of the floor against the foot. In each case, one force is the action and the other force is the reaction."], "jumps": ["P3080"]}, {"id": "P3100", "text": ["It is important to remember that this action and reaction is true for all objects at all times, whether they are moving or at rest.", "An example involving motion is a boy rows a boat toward the shore of a lake; when he gets about one meter from the shore, he attempts to jump ashore."], "jumps": ["P3090"]}, {"id": "P3120", "text": ["The boy exerts a force against the boat, and at the same time, the boat exerts an equal but opposite force against him."], "jumps": ["P3110"]}, {"id": "P3130", "text": ["The boy's force against the boat accelerates him in the opposite direction."], "jumps": ["P3110"]}, {"id": "P3140", "text": ["If the boy uses his former experience of jumping the same distance from an object fixed to the earth, he is in trouble.", "The reason for this is the boat has almost no resistance to the water, making this force unequal to the one he needed on land. Instead of reaching the shore safely, the boy goes face first into the water.", "The reason for this is the boat has almost no resistance to the water, making this force unequal to the one he needed on land. Instead of reaching the shore safely, the boy goes face first into the water..."], "jumps": ["P3150", "P3110", "P3160"]}, {"id": "P3160", "text": ["The push (force) he needed to reach the shore would have to be equal to the force exerted by the boat."], "jumps": ["P3170", "P3110"]}, {"id": "P3170", "text": ["By using two spring balances, we can see an example involving objects at rest that illustrates Newton's third law of motion.", "By using two spring balances, we can see an example involving objects at rest that illustrates Newton's third law of motion....."], "jumps": ["P3180", "P3110"]}, {"id": "P3180", "text": ["Suppose we fasten one spring balance to a rigid support and hook the other spring balance to it."], "jumps": ["P3190", "P3170"]}, {"id": "P3190", "text": ["If we pull on one balance, we find that both of the balance readings are identical; they are both 6 Newtons."], "jumps": ["P3200", "P3170"]}, {"id": "P3200", "text": ["The pull of the first balance on the second equals the pull of the second on the first.  The action is equal but opposite the reaction.", "The pull of the first balance on the second equals the pull of the second on the first. The action is equal but opposite the reaction."], "jumps": ["P3210", "P3170"]}, {"id": "P3210", "text": ["Since force is a vector quantity, one that has direction, the pull of the left balance is positive and the pull of the second balance is negative."], "jumps": ["P3220", "P3170"]}, {"id": "P3220", "text": ["The sum of the two opposite forces is zero."], "jumps": ["P3230", "P3170"]}, {"id": "P3230", "text": ["Be careful! The two forces in an action-reaction pair never act on the same body, they always concern two different, separate objects.", "For example, a tug of war has two teams pulling with equal force on the rope."], "jumps": ["P3240", "P3170", "P3250", "P3230"]}, {"id": "P3250", "text": ["The two forces are equal and opposite, and the rope is not moving anywhere.   But this is not an example of action and reaction.", "The two forces are equal and opposite, and the rope is not moving anywhere. But this is not an example of action and reaction."], "jumps": ["P3260", "P3240"]}, {"id": "P3260", "text": ["There are two forces, it is true, but they are both exerted on the same object."], "jumps": ["P3270", "P3240"]}, {"id": "P3270", "text": ["The fundamental principle of Newton's third law of motion is the force interaction between two bodies, not two forces acting on a single body.", "The fundamental principle of Newton's third law of motion is the force interaction between two bodies, not two forces acting on a single body...."], "jumps": ["P3280", "P3240"]}, {"id": "P3280", "text": ["Which of the following is an illustration of Newton's third law of motion?", "A body at rest stays at rest unless a force is applied to it", "Two forces acting on the same body cause the body's acceleration to equal zero", "For every force, there is an equal and opposite force"], "jumps": ["P3240"]}, {"id": "P3281", "text": [], "jumps": []}, {"id": "P3282", "text": ["You selected Newton's first law of motion.", "You selected Newton's first law of motion.................."], "jumps": []}, {"id": "P3283", "text": ["You selected Newton's second law of motion.", "You selected Newton's second law of motion................."], "jumps": []}, {"id": "P3290", "text": ["A more complicated example is that of a chandelier hanging by a rope from the ceiling.   There are two complete action-reaction pairs, making four forces in all.", "A more complicated example is that of a chandelier hanging by a rope from the ceiling. There are two complete action-reaction pairs, making four forces in all."], "jumps": ["P3300", "P3280"]}, {"id": "P3300", "text": ["Each force is equal to the weight of the chandelier."], "jumps": ["P3310", "P3290"]}, {"id": "P3310", "text": ["A = -A' and B = -B' because opposite forces on a stationary object are opposite; therefore, they are the inverse of each other."], "jumps": ["P3320", "P3290"]}, {"id": "P3320", "text": ["Even though A and B are equal and opposite, they do not make up an action-reaction pair."], "jumps": ["P3330", "P3290"]}, {"id": "P3330", "text": ["Remember, action-reaction pairs always act on different bodies, whereas A and B act only on the chandelier."], "jumps": ["P3340", "P3290"]}, {"id": "P3340", "text": ["The reason they are equal and opposite is not Newton's third law, it is because of Newton's second law: the chandelier is in equilibrium, its acceleration is zero, so its displacement is zero.", "Displacement = 0 Velocity = 0 Acceleration =00"], "jumps": ["P3350", "P3290"]}, {"id": "P3350", "text": ["Only two forces, A and B, actually act on the chandelier.  This shows that A + B = 0 or A = -B.  This is not a part of Newton's third law.", "Only two forces, A and let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
