mer schematic symbols are similar to the inductor symbol. Transformers are constructed of two coils. T2 T3 T4 T5 T6"], "jumps": []}, {"id": "P1060", "text": ["The input to a transformer is applied to one coil called the      \nprimary.", "The input to a transformer is applied to one coil called the primary."], "jumps": []}, {"id": "P1070", "text": ["The output of a transformer is taken from the other coil, which is called a secondary."], "jumps": []}, {"id": "P1080", "text": ["The reference designation for a transformer is the letter T.", "The reference designation for a transformer is the letter T. 1 T2 T3 T4 T5 T6"], "jumps": []}, {"id": "P1090", "text": ["Transformers T1, T4, T5, and T6 have iron cores.  Iron core        \ntransformers are used mostly in power supplies.", "Transformers T1, T4, T5, and T6 have iron cores. Iron core transformers are used mostly in power supplies. 1 T2 T3 T4 T5 T66666666666"], "jumps": []}, {"id": "P1100", "text": ["Transformers T2 and T3 have air cores.  Air core transformers are often used in radio circuits.", "Transformers T2 and T3 have air cores. Air core transformers are often used in radio circuits. T2 T3 T4 T5 T6"], "jumps": []}, {"id": "P1105", "text": ["Notice, T3 is a variable transformer.  Both iron core and air core    \nvariable transformers are used in radio circuits.", "Notice, T3 is a variable transformer. Both iron core and air core variable transformers are used in radio circuits. T3"], "jumps": []}, {"id": "P1110", "text": ["Transformers T4 and T5 indicate more windings in one coil than the other.", "Transformers T4 and T5 indicate more windings in one coil than the other. 3 T4 T5"], "jumps": []}, {"id": "P1120", "text": ["Transformer T6 has more than one secondary coil.", "Select the air core transformer.", "Transformer T6 has more than one secondary coil. T5 T6", "Select the air core transformer. ....................."], "jumps": []}, {"id": "P1131", "text": [], "jumps": []}, {"id": "P1132", "text": ["You selec let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
