const book = {"title": "93953313", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: VOLTAGE DOUBLER OPERATIONsd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Identify the purpose of a voltage doubler. w Describe operation of half and full-wave voltage doublers. w Describe advantages and disadvantages of half and full- wave voltage doublers.", "w Identify normal operation of half and full-wave voltage doublers. w Observe the effect of loading a voltage doubler's output. w Observe the effect of adding additional filter capacitance to a voltage doubler................."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about the operation of voltage doubler circuits."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Voltage doublers change AC voltage into DC voltage with a substantial increase in magnitude."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Step up transformers could be used to increase voltage, but are large, heavy and expensive."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Voltage doublers are constructed from diodes and capacitors and are relatively inexpensive."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["Voltage doublers are used to supply high voltage for devices such as cathode ray tubes in oscilloscopes, televisions and computer monitors.", "K HK,,_,_K',E,,,,',KEZ;;K98O9[=9NN99,,,,E", "T a:Tsy : 95a ss a5T 55s5m5 s55t T-|5s- ss y -VFs5--FFmmFFs--tt -| -symVsGF--s5-", "C[R//LRNLQ1/CLR5QTTF\\f[]?1QQ2T;A;;;E,AE;KEK9 7750Q=H=T=TTU9a(&PT5", "K''K''_,'KE,;UA;;U;;;KKE/JK,EK;,K}=EE LOE", "} V@*1[\"[\"1[$@1D7=EEKEE;EEU;KK_E',K____'", "1C*;;a)?U9;U W;;;,E;E;999TH=5mPHH750: 9sOUUK", "@N17;)LUK(QEAE 1;AU;EEE;T9TH=0=T=:=HTPa;;EEEKK", ",K;A'K57VO;EEOa2OK)1U; VKE,'K__KKK'KKK'K_,_", ",,,,',E,,,,,,'}K;AAaOUaAaA: 17Aa9A7O &V=E,'''_',''''K,K'KK,,", "a 99a9=}Aaa99aA59Oa:: T::a:a= } aaT AA5:9:a=T A:a aa=}AA} A: aaaaaA", "EAaym5caAAAAA;9EEEaaV;aT57(V1(C]:5FV-mF5Gm-5s7- 7 5:s055:5T55 F 5 THTTTH 0-5:575H0555(:75F555T:H0(HV757F72H57LFQQ527G2HH5HH2H:55:5T55 F T T T57H2H75 5F:9TOa;U9Ua9=9 A:::U: ;T9T9=U=9a:77V\"===:99:=;"], "jumps": ["P450", "P430", "P"]}, {"id": "P450", "text": ["Let's begin the lesson on VOLTAGE DOUBLER OPERATION......................."], "jumps": ["P440"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["There are two basic types of voltage doubler circuits:  Half-wave and Full-wave.", "There are two basic types of voltage doubler circuits: Half-wave and Full-wave."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Both circuits produce a DC output approximately equal to twice the peak value of the AC input voltage."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Let's look first at the operation of a half-wave voltage doubler."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["The AC signal applied to this half-wave voltage doubler is \n120 Vrms at 60 Hz (typical line voltage).", "The AC signal applied to this half-wave voltage doubler is 120 Vrms at 60 Hz (typical line voltage)."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["120 VRMS is 170 V peak, (RMS x 1.414 = peak). On the negative alternation, C1 is charged through D1 to 170 V.", "120 VRMS is 170 V peak, (RMS x 1.414 = peak). On the negative alternation, C1 is charged through D1 to 170 V..."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["On the positive alternation, C2 is charged through D2. The charge on C1 adds in series with the positive alternation and charges C2 to 340 V."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["Since the output is taken across C2, the output is 340 VDC. The voltage rating on C2 must be at least twice the peak input voltage (170 V x 2 = 340 V)."], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["The output ripple frequency is 60 Hz because C2 is only charged once (the positive alternation) each cycle."], "jumps": ["P1100", "P1050"]}, {"id": "P1100", "text": ["If a load is placed across the output, the ripple increases and the output voltage decreases. The heavier the load, the more it effects the output."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["This is caused from C2 discharging through the load.  Large capacitive values maintain output voltage better because they store more charge.", "This is caused from C2 discharging through the load. Large capacitive values maintain output voltage better because they store more charge."], "jumps": ["P1120", "P1090"]}, {"id": "P1120", "text": ["Now let's look at the operation of a full-wave voltage doubler."], "jumps": ["P1130", "P1090"]}, {"id": "P1130", "text": ["Assuming the same 170 Vpeak, 60 Hz input voltage, on the positive alternation C1 is charged through D1 to 170 V."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["On the negative alternation, C2  is charged through D2 to 170 V.", "On the negative alternation, C2 is charged through D2 to 170 V."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["The voltage of C1 and C2 add in series. The output is 340 VDC."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["The output from this full-wave voltage doubler has a ripple frequency of 120 Hz. This provides a smoother output than the half-wave voltage doubler."], "jumps": ["P1170", "P1130"]}, {"id": "P1170", "text": ["The load does not effect the output as much, however the ripple still increases and output voltage still decreases when a load is connected."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["Half-wave voltage doublers using 120 Vrms input at 60 Hz produce _______"], "jumps": ["P1160"]}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1182", "text": ["Voltage doublers produce DC voltage.", "Voltage doublers produce DC voltage........................"], "jumps": []}, {"id": "P1183", "text": ["Voltage doublers produce DC voltage equal to twice the peak input voltage."], "jumps": []}, {"id": "P1190", "text": ["What do voltage doublers use to increase voltage?", "What do voltage doublers use to increase voltage?.........."], "jumps": ["P1180"]}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1192", "text": ["Voltage doublers do not use transformers to increase voltage. They use two types of components."], "jumps": []}, {"id": "P1193", "text": ["Voltage doublers do not use amplifiers to increase voltage. They use two types of components."], "jumps": []}, {"id": "P1200", "text": ["A problem with equipment using half or full-wave voltage doublers connected directly to 120 VAC is the lack of line isolation."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["In such equipment, the chassis may be at a high voltage potential or HOT, creating a shock hazard for technicians."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["Using an isolation transformer plugged into a polarized outlet ensures the hot wire is not common to the chassis and isolates the circuit from the AC line.", "Using an isolation transformer plugged into a polarized outlet ensures the hot wire is not common to the chassis and isolates the circuit from the AC line.."], "jumps": ["P1230", "P1200"]}, {"id": "P1225", "text": ["POLARIZED OUTLET - A polarized outlet allows equipment with a polarized plug to only be connected one way. The wide prong on the plug only fits the long slot in the outlet."], "jumps": []}, {"id": "P1230", "text": ["You know that circuits can double voltage but can they triple or even quadruple the input voltage?"], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["The answer is YES. Voltage multipliers can theoretically increase voltage indefinitely."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["However, the higher the multiplication factor, the worse the ripple, the lower the output current capability, and the higher the component ratings must be."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["Voltage multipliers are used where high voltage, and low current are required."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["If both circuits are supplied by the same source and constructed from the same components, which can deliver more current?"], "jumps": ["P1240"]}, {"id": "P1271", "text": [], "jumps": []}, {"id": "P1272", "text": ["Remember, the higher the multiplication factor, the lower the output current capability."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on VOLTAGE DOUBLER OPERATION.", "This completes the information on VOLTAGE DOUBLER OPERATION.."], "jumps": ["P1001", "P1270"]}, {"id": "P1920", "text": ["1.  The purpose of voltage doublers is to produce DC voltages            equal to twice the peak AC input values.", "1. The purpose of voltage doublers is to produce DC voltages equal to twice the peak AC input values."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  There are two basic types of voltage doublers, half-wave and         full-wave.", "2. There are two basic types of voltage doublers, half-wave and full-wave.."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Half-wave voltage doublers produce 60 Hz ripple when fed by        60 Hz input frequency. Output voltage and ripple are greatly           affected by a load.", "3. Half-wave voltage doublers produce 60 Hz ripple when fed by 60 Hz input frequency. Output voltage and ripple are greatly affected by a load."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  Full-wave voltage doublers produce 120 Hz ripple when fed           by 60 Hz input frequency. Output voltage and ripple are not            affected as much by a load.", "4. Full-wave voltage doublers produce 120 Hz ripple when fed by 60 Hz input frequency. Output voltage and ripple are not affected as much by a load........"], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  Voltage multipliers can be designed to supply almost any                multiplication factor, but suffer from increased ripple, reduced       current capability, and stringent component values.", "5. Voltage multipliers can be designed to supply almost any multiplication factor, but suffer from increased ripple, reduced current capability, and stringent component values."], "jumps": ["P1999", "P1950"]}, {"id": "P1999", "text": ["You have completed the Summary.  \nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1960"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["The purpose of this experiment is to observe the operation of a typical voltage doubler. Half and full-wave operation is observed as well as the effects of increasing the load (decreasing resistance), and adding a filter capacitor to the output."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["Pick up PC130-27 card. Compare the card with the schematic shown."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["S1 selects between half and full-wave operation."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["S6 selects additional filter capacitor C4 connected in parallel with the output."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["S7 selects an additional load resistor R3 in parallel with the output."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["Switch positions will be set so that simplified schematics can be used, eliminating unused components. This schematic represents Half-Wave operation."], "jumps": ["P2090", "P2040"]}, {"id": "P2090", "text": ["This schematic represents Full-Wave Operation.", "This schematic represents Full-Wave Operation.............."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["Notice in both schematics, a fixed 5.6 kW load resistor is across the output. Let's start the experiment.", "Notice in both schematics, a fixed 5.6 kW load resistor is across the output. Let's start the experiment.."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2090"]}, {"id": "P2120", "text": ["2.  Place PC130-27 in the Test Console PC2 position.", "2. Place PC130-27 in the Test Console PC2 position. C switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2110"]}, {"id": "P2130", "text": ["3.  On PC130-27, set S1 to HW, S2 - S5 to Up (IN), and S6 and S7          to Down (OUT).", "3. On PC130-27, set S1 to HW, S2 - S5 to Up (IN), and S6 and S7 to Down (OUT).2 A let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
