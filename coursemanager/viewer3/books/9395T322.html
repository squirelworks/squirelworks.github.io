const book = {"title": "9395T322", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Title: ERROR DETECTION AND FEEDBACKfasfd asdf asdf sadf", "Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Measure the error and feedback signals in a closed loop DC motor system.....", "w Describe a closed loop feedback controlled motor system. w Identify simple block diagrams of closed loop systems. w List the functions that a closed loop feedback system performs.", "2. Experimentwo Title Enter objective 1 line item 2 here. item 2 here.e.e.", "1. Error Detection and Feedbackbjective 1 line item 2 here. item 2 here.e.e."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Experiment Card PC130-179erXXXXXXXXXXnt"], "jumps": []}, {"id": "P301", "text": ["12. 1/8 Inch Slotted Screwdriver9erXXXXXXXXXXnt", "9. Nida Model 410 Multifunction counter r equiv.", "8. Nida Model 470 Oscilloscope or equivalentt", "7. Nida Model 488 Multimeter or equivalentt"], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P350", "text": [], "jumps": ["P"]}, {"id": "P360", "text": [], "jumps": []}, {"id": "P370", "text": [], "jumps": []}, {"id": "P380", "text": [], "jumps": []}, {"id": "P400", "text": ["This lesson introduces the student to the principles and concepts of error detection and feedback control in closed loop systems.", "In many applications of both AC and DC motors, shaft RPM must remain constant and independent of variables such as source voltage, shaft load, and temperature.", "If the source voltage remains constant, any load applied to the rotating shaft of a motor will cause RPM to decrease regardless of the amount of torque produced by the motor.", "A factory conveyor belt is a good example of a varying load on the shaft of a motor. At any given time, there may be a large difference in the number of parts the belt is required to move, however, it must operate at a constant rate..."], "jumps": []}, {"id": "P440", "text": ["Let's begin the lesson on ERROR DETECTION AND FEEDBACK...................."], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": ["P440"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The more weight that is applied to a conveyor belt, the more the drive motor is loaded, thus decreasing speed. It would be costly for an operator to be present to monitor and vary the drive signal voltage every time the belt speed varied.eed varied..."], "jumps": ["P1001"]}, {"id": "P1030", "text": ["Before designing an electronic means of controlling the closed loop system (conveyor belt), let's look at the responsibilities of the human controller. The operator and controlling circuitry perform four basic functions..."], "jumps": []}, {"id": "P1040", "text": ["First, the operator must sense a change in speed of the conveyor belt. A tachometer would measure the number of revolutions a shaft turns in one minute and display the information on a meter for the human operator..."], "jumps": []}, {"id": "P1050", "text": ["Second, the operator must make a decision about whether the belt is running too fast or too slow. Some comparison between a reference speed and the monitored speed must be known before corrective action is taken..."], "jumps": []}, {"id": "P1060", "text": ["Third, the operator must increase or decrease the drive signal as needed to compensate for motor loading. The belt should never be loaded or unloaded to the point where the maximum or minimum drive signal cannot correct for the required speed..."], "jumps": []}, {"id": "P1070", "text": ["Fourth, depending on the type of motor (AC or DC), several methods of motor control and feedback are available. DC motors are the most prevalent choice, because the AC motor is not easily varied because frequency, not amplitude is the major drive signal factor that determines speed..."], "jumps": []}, {"id": "P1080", "text": ["For DC motors; the simplest, but least desirable method of speed control is a series rheostat. By adjusting the resistance in series with a DC motor, the voltage drop across the motor is changed which varies the speed. Series motors are ideal for applications that require large starting torque..."], "jumps": []}, {"id": "P1090", "text": ["Depending upon cost and accuracy, Power transistors, Field Effect Transistors (FET) and TRIACs, and other semiconductor devices are the most efficient in controlling motor speed."], "jumps": []}, {"id": "P1100", "text": ["Transistor switching circuits can turn the current to the armature rapidly on and off. The current on time and off time are electronically varied to control motor speed. If the pulses are on longer than they are off, the motor runs faster..."], "jumps": []}, {"id": "P1110", "text": ["With these steps in mind, an electronic controller can be designed to replace the human operator. Shaft RPM, accuracy, prime mover (AC or DC) motor and the total cost limits must all be considered in the decision..."], "jumps": []}, {"id": "P1120", "text": ["In an electronic controlled closed loop system, the method of measuring shaft RPM will determine how accurate the system will be. The smallest change in speed must be detected and a signal produced that is capable of being easily processed..."], "jumps": []}, {"id": "P1130", "text": ["When a motor is physically loaded down. Speed decreases, source current increases, and counterelectromotive-force (CEMF) decreases. Therefore, source current or CEMF could be use as the speed-indicating signal in a closed loop system..al in a closed loop system..."], "jumps": ["P1120", "P1140"]}, {"id": "P1135", "text": ["Counterelectomotive-force (CEMF)- is a voltage developed in an inductive circuit by an alternating or pulsating current. The polarity of this voltage is at every instant opposite that of the applied voltage..."], "jumps": []}, {"id": "P1140", "text": ["Photoelectric and magnetic transducers (sensors) are found in all areas of industrial controls. In selecting motor-source combinations, the DC prime mover should be the first consideration..."], "jumps": ["P1130", "P1150"]}, {"id": "P1150", "text": ["The use of DC motors in closed loop feedback systems has numerous advantages. Torque characteristics, universal supply voltage (AC or DC), and ease of speed control make it the preferred choice...", "Electromagnetic Field Coils Allow AC/DC Operation"], "jumps": []}, {"id": "P1160", "text": ["The universal DC motor can be powered by an AC or DC source. When AC is applied, the current and voltage polarity reversals are applied to both armature and the field coil at the same time. This allows the armature to continue rotating in the same direction..."], "jumps": []}, {"id": "P1170", "text": ["Recall that if both armature and field polarities are reversed, than the direction of shaft rotation remains constant. If only the field or only the armature polarity is reversed, the direction of rotation reverses..."], "jumps": []}, {"id": "P1180", "text": ["If AC is used as the source voltage, line current is also AC, and no rectification or filtering is necessary. Only step-up or step-down transformers are required, which keeps power supply design, construction, and cost to bare minimum..."], "jumps": []}, {"id": "P1190", "text": ["The heart of any speed regulating circuit is the controller. An initial drive signal is applied to a motor having a certain load, which establishes a reference RPM. The RPM is compared to the feedback information to see if the drive signal should be altered..."], "jumps": []}, {"id": "P1200", "text": ["An operational amplifier comparator is a low-cost, effective controller. All closed loop feedback systems operate using a simple process. The output of the device (motor) has a direct effect on the input to the same device..."], "jumps": []}, {"id": "P1210", "text": ["A sensing circuit from the output of the motor provides the feedback information that is compared with a desired reference base motor speed, which is fed directly back to the motor drives circuitry..."], "jumps": []}, {"id": "P1220", "text": ["neither the maximum nor minimum speed the motor can obtain.", "the minimum speed that the motor can obtain.", "the maximum speed of which the motor can obtain.", "In a closed loop system, the base motor speed should always be _______."], "jumps": ["P1210"]}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1222", "text": ["Using either maximum or minimum speed as a base speed is too restrictive and doesn't provide any room for variation to compensate for load changes."], "jumps": []}, {"id": "P1230", "text": ["of their torque characteristics, universal supply voltage, and ease of speed control.", "the speed of an AC motor cannot be controlled.", "the AC frequency of the drive signal solely determines motor speed.", "DC motors are usually used in closed loop applications because _______."], "jumps": ["P1220"]}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1232", "text": ["AC motors can be used in closed loop, but their speed is more difficult to control."], "jumps": []}, {"id": "P1910", "text": ["You have completed the information on ERROR DETECTION AND FEEDBACK.", "1. Depending on the type of motor (AC or DC), several methods of motor control and feedback are available. DC motors are the most prevalent choice, because the AC motor is not easily varied since frequency, not amplitude, is the major drive signal factor that determines speed."], "jumps": ["P1220", "P1001"]}, {"id": "P1930", "text": ["2. For DC motors, the simplest, but least desirable, method of speed control is a series rheostat. With the resistance adjusted in series, the voltage drop across the motor is changed, which varies the speed. Series motors are ideal for applications that require large starting torque..g torque.torque........."], "jumps": []}, {"id": "P1940", "text": ["3. When a motor is physically loaded down, speed decreases, source current increases, and counterelectromotive force (CEMF) decreases. Therefore, source current or CEMF could be used as the speed-indicating signal in a closed loop system."], "jumps": []}, {"id": "P1950", "text": ["4. The heart of any speed regulating circuit is the controller. An initial drive signal is applied to a motor having a certain load, which establishes a reference RPM. The RPM is compared to the feedback information to see if the drive signal should be altered."], "jumps": []}, {"id": "P1960", "text": ["5. A sensing circuit from the output of the motor provides the feedback information that is compared with a desired reference base motor speed, which is fed directly back to the motor drives circuitry."], "jumps": ["P1950", "P1999"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1950", "P1001"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["In this experiment, you will investi let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
