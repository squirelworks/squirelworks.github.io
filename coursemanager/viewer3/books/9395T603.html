const book = {"title": "9395T603", "pages": [{"id": "P2910", "text": ["This completes the experiment on TELEPHONE EQUIPMENT.", "This completes the experiment on TELEPHONE EQUIPMENT......."], "jumps": ["P2001", "P2905"]}, {"id": "P13910", "text": ["This completes the experiment on TELEPHONE EQUIPMENT.", "This completes the experiment on TELEPHONE EQUIPMENT......."], "jumps": ["P2001", "P13900"]}, {"id": "P13900", "text": ["2.  Remove both interface cards. \n3.  Return all equipment to the designated storage areas.", "2. Remove both interface cards. 3. Return all equipment to the designated storage areas."], "jumps": ["P13910", "P13890"]}, {"id": "P13890", "text": ["1.  Set the Test Console power to OFF.", "1. Set the Test Console power to OFF.F.FF................................."], "jumps": []}, {"id": "P13870", "text": ["In this fault, the inputs to IC1 for the PC3 interface card are good and there is no output on TP7.  IC1 in the PC3 interface card is   faulted.", "In this fault, the inputs to IC1 for the PC3 interface card are good and there is no output on TP7. IC1 in the PC3 interface card is faulted."], "jumps": ["P13860"]}, {"id": "P13862", "text": ["You should have seen that there is no Rx input to PC1, so you can not determine if the receiver circuits are operating correctly. PC3 is not putting out a Tx signal and is faulted.", "You should have seen that there is no Rx input to PC1, so you can not determine if the receiver circuits are operating correctly. PC3 is not putting out a Tx signal and is faulted...."], "jumps": []}, {"id": "P13861", "text": [], "jumps": []}, {"id": "P13860", "text": ["Which interface card is faulted?", "Which interface card is faulted?d.........................."], "jumps": ["P13850"]}, {"id": "P13850", "text": ["3.  Using test equipment to measure signals in both interface              circuits, transmit and receive using both telsets to locate the          the fault.", "3. Using test equipment to measure signals in both interface circuits, transmit and receive using both telsets to locate the the fault."], "jumps": ["P13860", "P13840"]}, {"id": "P13840", "text": ["With no received signal in the PC1 telset, there are two possible problems:", "With no received signal in the PC1 telset, there are two possible problems: Receiver circuits in PC1 are faulted. 2. Transmitter circuits in PC3 are faulted.", "1. Receiver circuits in PC1 are faulted. 2. Transmitter circuits in PC3 are faulted."], "jumps": ["P13850", "P13830"]}, {"id": "P13832", "text": ["You should be hearing voice signals from the telset connected to PC3.  Try transmitting and receiving from each telset again.", "You should be hearing voice signals from the telset connected to PC3. Try transmitting and receiving from each telset again."], "jumps": []}, {"id": "P13831", "text": [], "jumps": []}, {"id": "P13830", "text": ["The system is not operating correctly, what is the symptom?"], "jumps": ["P13820"]}, {"id": "P13820", "text": ["2.  Without using test equipment, transmit and receive using both       telsets to determine if the system is operating correctly.", "2. Without using test equipment, transmit and receive using both telsets to determine if the system is operating correctly."], "jumps": ["P13830"]}, {"id": "P13810", "text": ["1.  Disconnect all test equipment from the circuits. The computer        will now enter a fault into one of the interface cards. Note that        the computer can not fault a telset.", "1. Disconnect all test equipment from the circuits. The computer will now enter a fault into one of the interface cards. Note that the computer can not fault a telset."], "jumps": ["P13800"]}, {"id": "P13800", "text": ["Now that you have aligned the two interface cards, observed and measured the transmitting and receiving of voice signals, and       measured DC voltages in the system, let's enter a typical fault and walk through the troubleshooting steps.", "Now that you have aligned the two interface cards, observed and measured the transmitting and receiving of voice signals, and measured DC voltages in the system, let's enter a typical fault and walk through the troubleshooting steps."], "jumps": ["P13810", "P13750"]}, {"id": "P13790", "text": ["3.  Using the multimeter, measure for AC voltage on TP1 and TP2       to verify that the capacitors ground AC voltage to the DC                 power supplies and IC1.", "3. Using the multimeter, measure for AC voltage on TP1 and TP2 to verify that the capacitors ground AC voltage to the DC power supplies and IC1."], "jumps": ["P13800", "P13750"]}, {"id": "P13780", "text": ["2.  Using the multimeter, measure the DC voltage on IC1 pins 2, 3,      and 6 to verify that the capacitors block DC voltage.", "2. Using the multimeter, measure the DC voltage on IC1 pins 2, 3, and 6 to verify that the capacitors block DC voltage."], "jumps": ["P13790", "P13750"]}, {"id": "P13770", "text": ["You measured the DC power from the test console to the circuit and it should have been plus and minus 15 volts."], "jumps": ["P13780", "P13750"]}, {"id": "P13760", "text": ["1.  Using the multimeter, measure the DC voltage on the                        following  test points and pins on IC1.", "1. Using the multimeter, measure the DC voltage on the following test points and pins on IC1."], "jumps": ["P13770", "P13750"]}, {"id": "P13750", "text": ["3.  Using test equipment to measure signals in both interface              circuits, transmit and receive using both telsets to locate the          the fault.", "3. Using test equipment to measure signals in both interface circuits, transmit and receive using both telsets to locate the the fault."], "jumps": ["P13760", "P13740"]}, {"id": "P13740", "text": ["When receiving voice, the signal inputs to IC1 must be the same so the op-amp does not place the Rx signal on the Tx line."], "jumps": ["P13750", "P13730"]}, {"id": "P13732", "text": ["TP5 and TP6 measure the inputs to the op-amp.  When receiving, the signal levels must be the same so that they are canceled and not placed on the Tx line.", "TP5 and TP6 measure the inputs to the op-amp. When receiving, the signal levels must be the same so that they are canceled and not placed on the Tx line....."], "jumps": []}, {"id": "P13731", "text": [], "jumps": []}, {"id": "P13730", "text": ["Are the signal levels on CH1 and CH2 the same or different?"], "jumps": ["P13700"]}, {"id": "P13720", "text": ["8.  While observing the oscilloscope, with both phones off the             hook, speak into the telset connected to PC1.  DO NOT                    transmit from the telset connected to PC3.", "8. While observing the oscilloscope, with both phones off the hook, speak into the telset connected to PC1. DO NOT transmit from the telset connected to PC3."], "jumps": ["P13730", "P13700"]}, {"id": "P13710", "text": ["7.  Connect CH1 probe to PC3 TP5 and the CH2 probe to PC3              TP6.", "7. Connect CH1 probe to PC3 TP5 and the CH2 probe to PC3 TP6."], "jumps": ["P13720", "P13700"]}, {"id": "P13700", "text": ["When receiving voice, the local loop, TP3, has a signal while there is no signal on the Tx line, TP7."], "jumps": ["P13690"]}, {"id": "P13693", "text": ["There is a signal on TP3 but, there should be no signal on TP7 since you are receiving, not transmitting."], "jumps": []}, {"id": "P13692", "text": ["TP7 is the Tx signal. Since you are receiving on the PC card and not transmitting, there should be no signal."], "jumps": []}, {"id": "P13691", "text": [], "jumps": []}, {"id": "P13690", "text": ["Which TP/TPs have a signal?", "Which TP/TPs have a signal? typed.........................."], "jumps": ["P13670"]}, {"id": "P13680", "text": ["6.  While observing the oscilloscope, with both phones off the             hook, speak into the telset connected to PC1.  DO NOT                    transmit from the telset connected to PC3.", "6. While observing the oscilloscope, with both phones off the hook, speak into the telset connected to PC1. DO NOT transmit from the telset connected to PC3."], "jumps": ["P13690", "P13670"]}, {"id": "P13670", "text": ["5.  Connect CH1 of the oscilloscope to PC3 TP3 and CH2 to PC3        TP7.", "5. Connect CH1 of the oscilloscope to PC3 TP3 and CH2 to PC3 TP7."], "jumps": ["P13680", "P13660"]}, {"id": "P13660", "text": ["Now, let's look at real voice signals in the interface card when receiving."], "jumps": ["P13670", "P13650"]}, {"id": "P13650", "text": ["When transmitting your voice, the signal inputs to IC1 must be different so the op-amp passes the signal to the Tx line."], "jumps": ["P13660", "P13640"]}, {"id": "P13642", "text": ["TP5 and TP6 measure the inputs to the op-amp.  When transmitting, the signal levels must be different levels so that they are not canceled placing the Tx signal on the output line.", "TP5 and TP6 measure the inputs to the op-amp. When transmitting, the signal levels must be different levels so that they are not canceled placing the Tx signal on the output line..."], "jumps": []}, {"id": "P13641", "text": [], "jumps": []}, {"id": "P13640", "text": ["Are the signal levels on CH1 and CH2 the same or different?"], "jumps": ["P13610"]}, {"id": "P13630", "text": ["4.  While observing the oscilloscope, with both phones off the             hook, speak into the telset connected to PC1.  Do NOT                     transmit from the telset connected to PC3.", "4. While observing the oscilloscope, with both phones off the hook, speak into the telset connected to PC1. Do NOT transmit from the telset connected to PC3."], "jumps": ["P13640", "P13610"]}, {"id": "P13620", "text": ["3.  Connect CH1 probe to PC1 TP5 and the CH2 probe to PC1              TP6.", "When transmitting your voice, the local loop and the Tx output have signals.", "3. Connect CH1 probe to PC1 TP5 and the CH2 probe to PC1 TP6."], "jumps": ["P13630", "P13610", "P13620", "P13600"]}, {"id": "P13603", "text": ["There is a signal on TP7, but the other TP should also have a signal since you are looking at the local loop.", "There is a signal on TP7, but the other TP should also have a signal since you are looking at the local loop.."], "jumps": []}, {"id": "P13602", "text": ["There is a signal on TP3, but the other TP should also have a signal since you are transmitting.", "There is a signal on TP3, but the other TP should also have a signal since you are transmitting.."], "jumps": []}, {"id": "P13601", "text": [], "jumps": []}, {"id": "P13600", "text": ["Which TP/TPs have a signal?", "Which TP/TPs have a signal? typed.........................."], "jumps": ["P13580"]}, {"id": "P13590", "text": ["2.  While observing the oscilloscope, with both phones off the             hook, speak into the telset connected to PC1.  DO NOT                    transmit from the telset connected to PC3.", "2. While observing the oscilloscope, with both phones off the hook, speak into the telset connected to PC1. DO NOT transmit from the telset connected to PC3."], "jumps": ["P13600", "P13580"]}, {"id": "P13580", "text": ["1.  Connect CH1 of the oscilloscope to PC1 TP3 and CH2 to PC1        TP7.", "1. Connect CH1 of the oscilloscope to PC1 TP3 and CH2 to PC1 TP7."], "jumps": ["P13590", "P13570"]}, {"id": "P13572", "text": ["There is a problem in the system.  Repeat the interface card alignment procedures using 500 Hz instead of 1 kHz. If this does not fix the system, see your instructor.  Selecting       takes you back to the interface alignment procedures.  Selecting       , takes you back to the question.", "There is a problem in the system. Repeat the interface card alignment procedures using 500 Hz instead of 1 kHz. If this does not fix the system, see your instructor. Selecting takes you back to the interface alignment procedures. Selecting , takes you back to the question."], "jumps": ["P13570", "P13440"]}, {"id": "P13571", "text": [], "jumps": []}, {"id": "P13570", "text": ["Is the telephone system working correctly?", "Is the telephone system working correctly?................."], "jumps": ["P13560"]}, {"id": "P13565", "text": ["15.  Pick up both phones and using your lab partner or another            person, carry on a conversation using the two telsets.", "15. Pick up both phones and using your lab partner or another person, carry on a conversation using the two telsets."], "jumps": ["P13570", "P13560"]}, {"id": "P13560", "text": ["12. Disconnect the oscilloscope probes and function generator from the circuits. 13. Hang up both phones. 14. Using two alligator to alligator jumpers connect the two PC130- 337 cards together. Connect the first between PC1 pin T and PC3 pin F. Connect the second between PC1 pin S and PC3 pin E...................."], "jumps": ["P13565", "P13540"]}, {"id": "P13550", "text": ["11.  Adjust R3 for the minimum output of IC1 on TP7.  The PC3               interface card is now aligned.", "11. Adjust R3 for the minimum output of IC1 on TP7. The PC3 interface card is now aligned."], "jumps": ["P13560", "P13540"]}, {"id": "P13540", "text": ["10.  Connect the CH2 probe to PC3 TP7.  This is the transmitted            signal, Tx, output of the circuit.", "10. Connect the CH2 probe to PC3 TP7. This is the transmitted signal, Tx, output of the circuit."], "jumps": ["P13550", "P13530"]}, {"id": "P13532", "text": ["You should have viewed the Rx signal on the local loop.  Check the function generator and connection to the circuit.", "You should have viewed the Rx signal on the local loop. Check the function generator and connection to the circuit."], "jumps": []}, {"id": "P13531", "text": [], "jumps": []}, {"id": "P13530", "text": ["Are you viewing a 1 kHz sine wave signal on TP3 of the PC3 card?"], "jumps": ["P13520"]}, {"id": "P13520", "text": ["9.  Connect the CH1 probe of the oscilloscope to PC3 TP3.  TP3          is used to view the local loop signal.", "9. Connect the CH1 probe of the oscilloscope to PC3 TP3. TP3 is used to view the local loop signal."], "jumps": ["P13530", "P13510"]}, {"id": "P13510", "text": ["8.  Move the function generator output from the PC1 INPUT BNC       to the PC2 OUTPUT BNC.  This connects the output of the              function generator to the Rx input of the PC3 interface card.", "8. Move the function generator output from the PC1 INPUT BNC to the PC2 OUTPUT BNC. This connects the output of the function generator to the Rx input of the PC3 interface card."], "jumps": ["P13520", "P13480"]}, {"id": "P13500", "text": ["7.  Adjust R3 for the minimum output of IC1 on TP7.  The PC1              interface card is now aligned.", "7. Adjust R3 for the minimum output of IC1 on TP7. The PC1 interface card is now aligned."], "jumps": ["P13510", "P13480"]}, {"id": "P13490", "text": ["6.  Adjust PC1 R3 both fully CW and CCW.  Notice how the                   output on TP7 changes from maximum to minimum.", "6. Adjust PC1 R3 both fully CW and CCW. Notice how the output on TP7 changes from maximum to minimum."], "jumps": ["P13500", "P13480"]}, {"id": "P13480", "text": ["5.  Connect the CH2 probe to PC1 TP7.  This is the transmitted           signal, Tx, output of the circuit.", "5. Connect the CH2 probe to PC1 TP7. This is the transmitted signal, Tx, output of the circuit."], "jumps": ["P13490", "P13470"]}, {"id": "P13472", "text": ["You should have viewed the Rx signal on the local loop.  Check the function generator and connection to the circuit.", "You should have viewed the Rx signal on the local loop. Check the function generator and connection to the circuit."], "jumps": []}, {"id": "P13471", "text": [], "jumps": []}, {"id": "P13470", "text": ["Are you viewing a 1 kHz sine wave signal on TP3 of the PC1 card?"], "jumps": ["P13460"]}, {"id": "P13460", "text": ["4.  Using the oscilloscope in the dual trace mode, connect CH1           to PC1 TP3.  TP3 is used to view the local loop signal.", "4. Using the oscilloscope in the dual trace mode, connect CH1 to PC1 TP3. TP3 is used to view the local loop signal."], "jumps": ["P13470", "P13450"]}, {"id": "P13450", "text": ["3.  Connect the output of the function generator to the PC1                   INPUT BNC.  This inputs the function generator signal into             the PC1 card as an Rx signal.", "3. Connect the output of the function generator to the PC1 INPUT BNC. This inputs the function generator signal into the PC1 card as an Rx signal."], "jumps": ["P13460", "P13440"]}, {"id": "P13440", "text": ["1.  Ensure both telsets are off the hook, picked up. \n2.  Set the function generator for a 1 kHz sine wave signal at \n     1 Vpp.   Use attenuation if needed and the oscilloscope to               adjust the output.", "1. Ensure both telsets are off the hook, picked up. 2. Set the function generator for a 1 kHz sine wave signal at 1 Vpp. Use attenuation if needed and the oscilloscope to adjust the output."], "jumps": ["P13450", "P13430"]}, {"id": "P13430", "text": ["The system is now setup.  You will first align the two interface cards so that the Rx signal is not fedback to the Tx line (if so, it   will cause a load noise in the telsets.", "The system is now setup. You will first align the two interface cards so that the Rx signal is not fedback to the Tx line (if so, it will cause a load noise in the telsets."], "jumps": ["P13440"]}, {"id": "P13420", "text": ["7.  Press enter to set:  PC1 DC Power Switch - ON\n                                          PC3 DC Power Switch - ON", "7. Press enter to set: PC1 DC Power Switch - ON PC3 DC Power Switch - ON"], "jumps": ["P13410"]}, {"id": "P13410", "text": ["5.  Connect one telset to J1 on the PC1 card. \n6.  Connect the other telset to J1 on the PC3 card.", "5. Connect one telset to J1 on the PC1 card. 6. Connect the other telset to J1 on the PC3 card."], "jumps": ["P13420"]}, {"id": "P13400", "text": ["4.  Press enter to set:  Positive Supply Voltage -  15 \n                                          Negative Supply Voltage - 15", "4. Press enter to set: Positive Supply Voltage - 15 Negative Supply Voltage - 15"], "jumps": ["P13390"]}, {"id": "P13390", "text": ["2.  Insert one PC130-337 card into the PC1 connectors. \n3.  Insert the other PC130-337 card into the PC3 connectors.", "2. Insert one PC130-337 card into the PC1 connectors. 3. Insert the other PC130-337 card into the PC3 connectors."], "jumps": ["P13400"]}, {"id": "P13380", "text": ["1.  Set the Test Console controls to the Initial Control Settings.", "1. Set the Test Console controls to the Initial Control Settings.........."], "jumps": ["P13370"]}, {"id": "P13370", "text": ["Let's start the experiment.", "Let's start the experiment.e..............................."], "jumps": ["P13380", "P13332"]}, {"id": "P13360", "text": ["C1, C2, C3, and C5 are used to block DC voltages and, C4 and C6 prevent AC signals from effecting the power inputs to IC1."], "jumps": ["P13370", "P13332"]}, {"id": "P13350", "text": ["Finally, R5 is a balancing resistor and R6/R7 set the gain of IC1."], "jumps": ["P13360", "P13332"]}, {"id": "P13340", "text": ["The Tx signal is not canceled in IC1 and is applied to Pin T, voice signal out."], "jumps": ["P13350", "P13332"]}, {"id": "P13335", "text": ["Rx (-) = R2 + R4 = 11k Equal Rx (+) = R3 = 11k", "Tx (-) = R4 = 10K Not Equal Tx (+) = R2 + R3 = 12K"], "jumps": []}, {"id": "P13332", "text": ["In this case, the resistance to the inverting and non-inverting inputs is NOT the same."], "jumps": ["P13340", "P13300", "P13335"]}, {"id": "P13330", "text": ["In this case, the resistance to the inverting and non-inverting inputs is NOT the same."], "jumps": ["P13340", "P13300", "P13335"]}, {"id": "P13320", "text": ["The inverting input path to IC1 is from TP3, R2, R3, C2, and TP5."], "jumps": ["P13330", "P13300"]}, {"id": "P13310", "text": ["The non-inverting input path to IC1 is from TP3, through R4, C3, and TP6."], "jumps": ["P13320", "P13300"]}, {"id": "P13300", "text": ["The transmitted signal, Tx, is placed on the local loop by the telset."], "jumps": ["P13310", "P13282"]}, {"id": "P13290", "text": ["With identical inputs to IC1, IC1 cancels the signal and the Rx signal is not outputted to Pin T."], "jumps": ["P13300", "P13282"]}, {"id": "P13285", "text": ["Rx (-) = R2 + R4 = 11k Equal Rx (+) = R3 = 11k"], "jumps": []}, {"id": "P13282", "text": ["By adjusting R3, the resistance to the non-inverting and inverting inputs is made the same."], "jumps": ["P13290", "P13210", "P13285"]}, {"id": "P13280", "text": ["By adjusting R3, the resistance to the non-inverting and inverting inputs is made the same."], "jumps": ["P13290", "P13210", "P13285"]}, {"id": "P13270", "text": ["The inverting input path is through R3, C2, and TP5."], "jumps": ["P13280", "P13210"]}, {"id": "P13260", "text": ["The non-inverting input path is through R2, R4, C3, and TP6."], "jumps": ["P13270", "P13210"]}, {"id": "P13250", "text": ["Also, the Rx signal is routed to both inputs of IC1."], "jumps": ["P13260", "P13210"]}, {"id": "P13240", "text": ["From Pin S, the Rx signal is routed through C1, TP4, R2, to the local loop."], "jumps": ["P13250", "P13210"]}, {"id": "P13230", "text": ["The Rx or received voice signal is applied to Pin S (Pin E is used to insert a test signal for aligning the card)."], "jumps": ["P13240", "P13210", "Pin"]}, {"id": "P13220", "text": ["The local loop is from TP2, -15 volts, through the telset, J1, through TP3 and R1, to TP1, +15 volts."], "jumps": ["P13230", "P13210"]}, {"id": "P13210", "text": ["Here is the schematic of the card.", "Here is the schematic of the card.........................."], "jumps": ["P13220", "P13180"]}, {"id": "P13200", "text": ["IC1 is an op-amp configured as a differential amplifier that will separate the Tx and Rx signals."], "jumps": ["P13210", "P13180"]}, {"id": "P13190", "text": ["On the bottom center is the modular jack where you plug in a telset.  The card uses only the red and green wires.", "Now, pick up and examine the PC130-337 card.", "On the bottom center is the modular jack where you plug in a telset. The card uses only the red and green wires.", "Now, pick up and examine the PC130-337 card................"], "jumps": ["P13200", "P13180", "P13190", "P13100"]}, {"id": "P13170", "text": ["The other buttons, besides the dialer, are used to store frequently called numbers E1, E2, E3), automatically REDIAL the last number dialed, and to turn off the microphone."], "jumps": ["P13180", "P13100"]}, {"id": "P13160", "text": ["With the switch to PULSE, the telset circuits change the tones into pulses for operation in a system that does not use electronic telsets."], "jumps": ["P13170", "P13100"]}, {"id": "P13150", "text": ["With the switch to TONE, the telset operates like any other electronic telset."], "jumps": ["P13160", "P13100"]}, {"id": "P13140", "text": ["Look at the DTMF dialer.  Above the keypad is a switch labeled TONE and PULSE.", "Look at the DTMF dialer. Above the keypad is a switch labeled TONE and PULSE."], "jumps": ["P13150", "P13100"]}, {"id": "P13130", "text": ["A little different configuration from the one you studied but, the operation is the same."], "jumps": ["P13140", "P13100"]}, {"id": "P13120", "text": ["The hand set, which connects to the base unit by way of a spiral cord, contains the microphone, speaker, and dialer circuit."], "jumps": ["P13130", "P13100"]}, {"id": "P13110", "text": ["The cable has a modular jack on both ends.  The jacks used are standard and allow connecting any telset to the local loop.", "The cable has a modular jack on both ends. The jacks used are standard and allow connecting any telset to the local loop."], "jumps": ["P13120", "P13100"]}, {"id": "P13100", "text": ["Look at the base unit. It contains the hook switch, ringer circuit, voice network, and cable that connects the telset to phone lines."], "jumps": ["P13110", "P13090"]}, {"id": "P13092", "text": ["Look at the dialer, it uses push buttons and is a dead give away to the type of telset."], "jumps": []}, {"id": "P13091", "text": [], "jumps": []}, {"id": "P13090", "text": ["Now, pick up and examine the telsets.  What type of telset is used?", "Now, pick up and examine the telsets. What type of telset is used?"], "jumps": ["P13020"]}, {"id": "P13080", "text": ["The transmission medium for this experiment are the alligator to alligator jumpers but, could have been coax cables, fiberoptic       cables, microwave links, or radio signals.", "The transmission medium for this experiment are the alligator to alligator jumpers but, could have been coax cables, fiberoptic cables, microwave links, or radio signals."], "jumps": ["P13090", "P13020"]}, {"id": "P13070", "text": ["Notice how the Tx signal in one card is the Rx signal in the other.", "Speaker RX Voice Network Microphone TX"], "jumps": ["P13080", "P13020"]}, {"id": "P13060", "text": ["The circled letters indicated pin numbers on the card where the transmitted and received signal connect."], "jumps": ["P13070", "P13020"]}, {"id": "P13050", "text": ["The interface card also separates the Tx and Rx signals for transmitting and receiving over the transmission medium."], "jumps": ["P13060", "P13020"]}, {"id": "P13040", "text": ["In the telsets, the Tx and Rx signals are separated by the voice network as you have seen.", "Speaker RX Voice Network Microphone TX"], "jumps": ["P13050", "P13020"]}, {"id": "P13030", "text": ["Each telset is connected to the End Office by the local loop with both transmitted (Tx) and received (Rx) voice signals."], "jumps": ["P13040", "P13020"]}, {"id": "P13025", "text": ["The interface circuits, PC130-337, act as End Offices without dialing, switching, or AC ring/busy/dial tone signal circuits."], "jumps": ["P13030", "P13020"]}, {"id": "P13020", "text": ["In this experiment, you will use two telsets connected through interface circuits to produce a basic telephone system.", "Speaker RX Voice Network Microphone TX"], "jumps": ["P13025", "P2001"]}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is 100%. Do you want to _________"], ?", "Provide exact matching between T1 and T2", "Provide the required phase shift between T1 and T2 !", "In the mechanical telset, which component is connected to the dialer wheel and is used to break the local loop to produce pulses for each number dialed? 9", "In the mechanical telset, what is the purpose of T1 and T2?", "Produces the pulses of each number dialed", "In the mechanical telset, what is the purpose of R2?"], "jumps": ["P"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P2910", "text": ["This completes the experiment on TELEPHONE EQUIPMENT.", "This completes the experiment on TELEPHONE EQUIPMENT......."], "jumps": ["P2001", "P2905"]}, {"id": "P2905", "text": ["3.  Remove both interface cards. \n4.  Return all equipment to the designated storage areas.", "3. Remove both interface cards. 4. Return all equipment to the designated storage areas."], "jumps": ["P2910", "P2890"]}, {"id": "P2890", "text": ["2.  Set the Test Console power to OFF.", "2. Set the Test Console power to OFF.F...................."], "jumps": ["P2880"]}, {"id": "P2880", "text": ["1.   Return the Test Console controls to the initial control                       settings.", "1. Return the Test Console controls to the initial control settings. ols to the initial control settings."], "jumps": ["P2870"]}, {"id": "P2870", "text": ["In this fault, the inputs to IC1 for the PC3 interface card are good and there is no output on TP7.  IC1 in the PC3 interface card is   faulted.", "In this fault, the inputs to IC1 for the PC3 interface card are good and there is no output on TP7. IC1 in the PC3 interface card is faulted."], "jumps": ["P2880", "P2860"]}, {"id": "P2862", "text": ["You should have seen that there is no Rx input to PC1, so you can not determine if the receiver circuits are operating correctly. PC3 is not putting out a Tx signal and is faulted.", "You should have seen that there is no Rx input to PC1, so you can not determine if the receiver circuits are operating correctly. PC3 is not putting out a Tx signal and is faulted...."], "jumps": []}, {"id": "P2861", "text": [], "jumps": []}, {"id": "P2860", "text": ["Which interface card is faulted?", "Which interface card is faulted?d.........................."], "jumps": ["P2850"]}, {"id": "P2850", "text": ["3.  Using test equipment to measure signals in both interface              circuits, transmit and receive using both telsets to locate                 the fault.", "3. Using test equipment to measure signals in both interface circuits, transmit and receive using both telsets to locate the fault."], "jumps": ["P2860", "P2840"]}, {"id": "P2840", "text": ["With no received signal in the PC1 telset, there are two possible problems:", "With no received signal in the PC1 telset, there are two possible problems: Receiver circuits in PC1 are faulted. 2. Transmitter circuits in PC3 are faulted.", "1. Receiver circuits in PC1 are faulted. 2. Transmitter circuits in PC3 are faulted."], "jumps": ["P2850", "P2830"]}, {"id": "P2832", "text": ["You should be hearing voice signals from the telset connected to PC3.  Try transmitting and receiving from each telset again.", "You should be hearing voice signals from the telset connected to PC3. Try transmitting and receiving from each telset again."], "jumps": []}, {"id": "P2831", "text": [], "jumps": []}, {"id": "P2830", "text": ["The system is not operating correctly, what is the symptom?"], "jumps": ["P2820"]}, {"id": "P2820", "text": ["2.  Without using test equipment, transmit and receive using both       telsets to determine if the system is operating correctly.", "2. Without using test equipment, transmit and receive using both telsets to determine if the system is operating correctly."], "jumps": ["P2830", "P2810"]}, {"id": "P2810", "text": ["1.  Disconnect all test equipment from the circuits.  The computer       will now enter a fault into one of the interface cards.  Note that       the computer can not fault a telset.", "1. Disconnect all test equipment from the circuits. The computer will now enter a fault into one of the interface cards. Note that the computer can not fault a telset."], "jumps": ["P2800"]}, {"id": "P2800", "text": ["Now that you have aligned the two interface cards, observed and measured the transmitting and receiving of voice signals, and       measured DC voltages in the system, let's enter a typical fault and walk through the troubleshooting steps.", "Now that you have aligned the two interface cards, observed and measured the transmitting and receiving of voice signals, and measured DC voltages in the system, let's enter a typical fault and walk through the troubleshooting steps."], "jumps": ["P2810", "P2750"]}, {"id": "P2790", "text": ["3.  Using the multimeter, measure for AC voltage on TP1 and TP2       to verify that the capacitors ground AC voltage to the DC                 power supplies and IC1.", "3. Using the multimeter, measure for AC voltage on TP1 and TP2 to verify that the capacitors ground AC voltage to the DC power supplies and IC1."], "jumps": ["P2800", "P2750"]}, {"id": "P2780", "text": ["2.  Using the multimeter, measure the DC voltage on IC1 pins 2, 3,       and 6 to verify that the capacitors block DC voltage.", "2. Using the multimeter, measure the DC voltage on IC1 pins 2, 3, and 6 to verify that the capacitors block DC voltage."], "jumps": ["P2790", "P2750"]}, {"id": "P2770", "text": ["You measured the DC power from the test console to the circuit and it should have been plus and minus 15 volts."], "jumps": ["P2780", "P2750"]}, {"id": "P2760", "text": ["1.  Using the multimeter, measure the DC voltage on the                         following  test points and pins on IC1.", "1. Using the multimeter, measure the DC voltage on the following test points and pins on IC1. G"], "jumps": ["P2770", "P2750"]}, {"id": "P2750", "text": ["3.  Using test equipment to measure signals in both interface               circuits, transmit and receive using both telsets to locate the          the fault.", "3. Using test equipment to measure signals in both interface circuits, transmit and receive using both telsets to locate the the fault."], "jumps": ["P2760", "P2740"]}, {"id": "P2740", "text": ["When receiving voice, the signal inputs to IC1 must be the same so the op-amp does not place the Rx signal on the Tx line."], "jumps": ["P2750", "P2730"]}, {"id": "P2732", "text": ["TP5 and TP6 measure the inputs to the op-amp.  When receiving, the signal levels must be the same so that they are canceled and not placed on the Tx line.", "TP5 and TP6 measure the inputs to the op-amp. When receiving, the signal levels must be the same so that they are canceled and not placed on the Tx line....."], "jumps": []}, {"id": "P2731", "text": [], "jumps": []}, {"id": "P2730", "text": ["Are the signal levels on CH1 and CH2 the same or different?"], "jumps": ["P2700"]}, {"id": "P2720", "text": ["8.  While observing the oscilloscope, with both phones off the             hook, speak into the telset connected to PC1.  DO NOT                    transmit from the telset connected to PC3.", "8. While observing the oscilloscope, with both phones off the hook, speak into the telset connected to PC1. DO NOT transmit from the telset connected to PC3."], "jumps": ["P2730", "P2700"]}, {"id": "P2710", "text": ["7.  Connect CH1 probe to PC3 TP5 and the CH2 probe to PC3              TP6.", "7. Connect CH1 probe to PC3 TP5 and the CH2 probe to PC3 TP6."], "jumps": ["P2720", "P2700"]}, {"id": "P2700", "text": ["When receiving voice, the local loop, TP3, has a signal while there is no signal on the Tx line, TP7."], "jumps": ["P2710", "P2690"]}, {"id": "P2693", "text": ["There is a signal on TP3 but, there should be no signal on TP7 since you are receiving, not transmitting."], "jumps": []}, {"id": "P2692", "text": ["TP7 is the Tx signal. Since you are receiving on the PC card and not transmitting, there should be no signal."], "jumps": []}, {"id": "P2691", "text": [], "jumps": []}, {"id": "P2690", "text": ["Which TP/TPs have a signal?", "Which TP/TPs have a signal? typed.........................."], "jumps": ["P2670"]}, {"id": "P2680", "text": ["6.  While observing the oscilloscope, with both phones off the             hook, speak into the telset connected to PC1.   DO NOT                   transmit from the telset connected to PC3.", "6. While observing the oscilloscope, with both phones off the hook, speak into the telset connected to PC1. DO NOT transmit from the telset connected to PC3."], "jumps": ["P2690", "P2670"]}, {"id": "P2670", "text": ["5.  Connect CH1 of the oscilloscope to PC3 TP3 and CH2 to PC3        TP7.", "5. Connect CH1 of the oscilloscope to PC3 TP3 and CH2 to PC3 TP7."], "jumps": ["P2680", "P2660"]}, {"id": "P2660", "text": ["Now, let's look at real voice signals in the interface card when receiving."], "jumps": ["P2670", "P2650"]}, {"id": "P2650", "text": ["When transmitting your voice, the signal inputs to IC1 must be different so the op-amp passes the signal to the Tx line."], "jumps": ["P2660", "P2640"]}, {"id": "P2642", "text": ["TP5 and TP6 measure the inputs to the op-amp.  When transmitting, the signal levels must be different levels so that they are not canceled placing the Tx signal on the output line.", "TP5 and TP6 measure the inputs to the op-amp. When transmitting, the signal levels must be different levels so that they are not canceled placing the Tx signal on the output line..."], "jumps": []}, {"id": "P2641", "text": [], "jumps": []}, {"id": "P2640", "text": ["Are the signal levels on CH1 and CH2 the same or different?"], "jumps": ["P2610"]}, {"id": "P2630", "text": ["4.  While observing the oscilloscope, with both phones off the             hook, speak into the telset connected to PC1.   Do NOT                    transmit from the telset connected to PC3.", "4. While observing the oscilloscope, with both phones off the hook, speak into the telset connected to PC1. Do NOT transmit from the telset connected to PC3."], "jumps": ["P2640", "P2610"]}, {"id": "P2620", "text": ["3.  Connect CH1 probe to PC1 TP5 and the CH2 probe to PC1              TP6.", "3. Connect CH1 probe to PC1 TP5 and the CH2 probe to PC1 TP6."], "jumps": ["P2630", "P2610"]}, {"id": "P2610", "text": ["When transmitting your voice, the local loop and the Tx output have signals."], "jumps": ["P2620", "P2600"]}, {"id": "P2603", "text": ["There is a signal on TP7 but, the other TP should also have a signal since you are looking at the local loop."], "jumps": []}, {"id": "P2602", "text": ["There is a signal on TP3 but, the other TP should also have a signal since you are transmitting."], "jumps": []}, {"id": "P2601", "text": [], "jumps": []}, {"id": "P2600", "text": ["Which TP/TPs have a signal?", "Which TP/TPs have a signal? typed.........................."], "jumps": ["P2580"]}, {"id": "P2590", "text": ["2.  While observing the oscilloscope, with both phones off the             hook, speak into the telset connected to PC1.  DO NOT                    transmit from the telset connected to PC3.", "2. While observing the oscilloscope, with both phones off the hook, speak into the telset connected to PC1. DO NOT transmit from the telset connected to PC3."], "jumps": ["P2600", "P2580"]}, {"id": "P2580", "text": ["1.  Connect CH1 of the oscilloscope to PC1 TP3 and CH2 to PC1        TP7.", "1. Connect CH1 of the oscilloscope to PC1 TP3 and CH2 to PC1 TP7."], "jumps": ["P2590", "P2570"]}, {"id": "P2572", "text": ["There is a problem in the system.  Repeat the interface card alignment procedures using 500 Hz instead of 1 kHz. If this does not fix the system, see your instructor.  Selecting       takes you back to the interface alignment procedures.  Selecting       , takes you back to the question.", "There is a problem in the system. Repeat the interface card alignment procedures using 500 Hz instead of 1 kHz. If this does not fix the system, see your instructor. Selecting takes you back to the interface alignment procedures. Selecting , takes you back to the question."], "jumps": ["P2570"]}, {"id": "P2571", "text": [], "jumps": []}, {"id": "P2570", "text": ["Is the telephone system working correctly?", "Is the telephone system working correctly?................."], "jumps": ["P2560"]}, {"id": "P2565", "text": ["15.  Pick up both phones and using your lab partner or another            person, carry on a conversation using the two telsets.", "15. Pick up both phones and using your lab partner or another person, carry on a conversation using the two telsets."], "jumps": ["P2570", "P2560"]}, {"id": "P2560", "text": ["12. Disconnect the oscilloscope probes and function generator from the circuits. 13. Hang up both phones. 14. Using two alligator to alligator jumpers connect the two PC130- 337 cards together. Connect the first between PC1 pin T and PC3 pin F. Connect the second between PC1 pin S and PC3 pin E...................."], "jumps": ["P2565", "P2540"]}, {"id": "P2550", "text": ["11.  Adjust R3 for the minimum output of IC1 on TP7.  The PC3               interface card is now aligned.", "11. Adjust R3 for the minimum output of IC1 on TP7. The PC3 interface card is now aligned."], "jumps": ["P2560", "P2540"]}, {"id": "P2540", "text": ["10.  Connect the CH2 probe to PC3 TP7.  This is the transmitted            signal, Tx, output of the circuit.", "10. Connect the CH2 probe to PC3 TP7. This is the transmitted signal, Tx, output of the circuit."], "jumps": ["P2550", "P2530"]}, {"id": "P2532", "text": ["You should have viewed the Rx signal on the local loop.  Check the function generator and connection to the circuit.", "You should have viewed the Rx signal on the local loop. Check the function generator and connection to the circuit."], "jumps": []}, {"id": "P2531", "text": [], "jumps": []}, {"id": "P2530", "text": ["Are you viewing a 1 kHz sine wave signal on TP3 of the PC3 card?"], "jumps": ["P2520"]}, {"id": "P2520", "text": ["9.  Connect the CH1 probe of the oscilloscope to PC3 TP3.  TP3          is used to view the local loop signal.", "9. Connect the CH1 probe of the oscilloscope to PC3 TP3. TP3 is used to view the local loop signal."], "jumps": ["P2530", "P2510"]}, {"id": "P2510", "text": ["8.  Move the function generator output from the PC1 INPUT BNC        to the PC2 OUTPUT BNC.  This connects the output of the              function generator to the Rx input of the PC3 interface card.", "8. Move the function generator output from the PC1 INPUT BNC to the PC2 OUTPUT BNC. This connects the output of the function generator to the Rx input of the PC3 interface card."], "jumps": ["P2520", "P2480"]}, {"id": "P2500", "text": ["7.  Adjust R3 for the minimum output of IC1 on TP7.  The PC1               interface card is now aligned.", "7. Adjust R3 for the minimum output of IC1 on TP7. The PC1 interface card is now aligned."], "jumps": ["P2510", "P2480"]}, {"id": "P2490", "text": ["6.  Adjust PC1 R3 both fully CW and CCW.  Notice how the                   output on TP7 changes from maximum to minimum.", "6. Adjust PC1 R3 both fully CW and CCW. Notice how the output on TP7 changes from maximum to minimum."], "jumps": ["P2500", "P2480"]}, {"id": "P2480", "text": ["5.  Connect the CH2 probe to PC1 TP7.  This is the transmitted            signal, Tx, output of the circuit.", "5. Connect the CH2 probe to PC1 TP7. This is the transmitted signal, Tx, output of the circuit."], "jumps": ["P2490", "P2470"]}, {"id": "P2472", "text": ["You should have viewed the Rx signal on the local loop. Check the function generator and connection to the circuit."], "jumps": []}, {"id": "P2471", "text": [], "jumps": []}, {"id": "P2470", "text": ["Are you viewing a 1 kHz sine wave signal on TP3 of the PC1 card?"], "jumps": ["P2460"]}, {"id": "P2460", "text": ["4.  Using the oscilloscope in the dual trace mode, connect CH1           to PC1 TP3.  TP3 is used to view the local loop signal.", "4. Using the oscilloscope in the dual trace mode, connect CH1 to PC1 TP3. TP3 is used to view the local loop signal."], "jumps": ["P2470", "P2450"]}, {"id": "P2450", "text": ["3.  Connect the output of the function generator to the PC1                   INPUT BNC.  This inputs the function generator signal into             the PC1 card as an Rx signal.", "3. Connect the output of the function generator to the PC1 INPUT BNC. This inputs the function generator signal into the PC1 card as an Rx signal."], "jumps": ["P2460", "P2440"]}, {"id": "P2440", "text": ["1.  Ensure both telsets are off the hook, picked up. \n2.  Set the function generator for a 1 kHz sine wave signal at\n     1 Vpp.  Use attenuation if needed and the oscilloscope to                adjust the output.", "1. Ensure both telsets are off the hook, picked up. 2. Set the function generator for a 1 kHz sine wave signal at 1 Vpp. Use attenuation if needed and the oscilloscope to adjust the output."], "jumps": ["P2450", "P2430"]}, {"id": "P2430", "text": ["8.  Set PC1 and PC3 DC Power switches to ON.  The system is            now setup.  You will first align the two interface cards so that         the Rx signal is not fedback to the Tx line (if so, it will cause a        load noise in the telsets.", "8. Set PC1 and PC3 DC Power switches to ON. The system is now setup. You will first align the two interface cards so that the Rx signal is not fedback to the Tx line (if so, it will cause a load noise in the telsets."], "jumps": ["P2410"]}, {"id": "P2410", "text": ["6.  Connect one telset to J1 on the PC1 card. \n7.  Connect the other telset to J1 on the PC3 card.", "6. Connect one telset to J1 on the PC1 card. 7. Connect the other telset to J1 on the PC3 card."], "jumps": ["P2430", "P2400"]}, {"id": "P2400", "text": ["4.  Set the Positive Supply control to 15. \n5.  Set the Negative Supply control to 15.", "4. Set the Positive Supply control to 15. 5. Set the Negative Supply control to 15."], "jumps": ["P2390"]}, {"id": "P2390", "text": ["2.  Insert one PC130-337 card into the PC1 connectors. \n3.  Insert the other PC130-337 card into the PC3 connectors.", "2. Insert one PC130-337 card into the PC1 connectors. 3. Insert the other PC130-337 card into the PC3 connectors. Speaker switch to ON........................................."], "jumps": ["P2380"]}, {"id": "P2380", "text": ["1.  Set the Test Console controls to the Initial Control Settings.", "1. Set the Test Console controls to the Initial Control Settings.........."], "jumps": ["P2370"]}, {"id": "P2370", "text": ["Let's start the experiment.", "Let's start the experiment.e..............................."], "jumps": ["P2380", "P2332"]}, {"id": "P2360", "text": ["C1, C2, C3, and C5 are used to block DC voltages and, C4 and C6 prevent AC signals from effecting the power inputs to IC1."], "jumps": ["P2370", "P2332"]}, {"id": "P2350", "text": ["Finally, R5 is a balancing resistor and R6/R7 set the gain of IC1."], "jumps": ["P2360", "P2332"]}, {"id": "P2340", "text": ["The Tx signal is not canceled in IC1 and is applied to Pin T, voice signal out."], "jumps": ["P2350", "P2332"]}, {"id": "P2335", "text": ["Rx (-) = R2 + R4 = 11k Equal Rx (+) = R3 = 11k", "Tx (-) = R4 = 10K Not Equal Tx (+) = R2 + R3 = 12K"], "jumps": []}, {"id": "P2332", "text": ["In this case, the resistance to the inverting and non-inverting inputs is NOT the same."], "jumps": ["P2340", "P2300", "P2335"]}, {"id": "P2330", "text": ["In this case, the resistance to the inverting and non-inverting inputs is NOT the same."], "jumps": ["P2340", "P2300", "P2335"]}, {"id": "P2320", "text": ["The inverting input path to IC1 is from TP3, R2, R3, C2, and TP5."], "jumps": ["P2330", "P2300"]}, {"id": "P2310", "text": ["The non-inverting input path to IC1 is from TP3, through R4, C3, and TP6."], "jumps": ["P2320", "P2300"]}, {"id": "P2300", "text": ["The transmitted signal, Tx, is placed on the local loop by the telset."], "jumps": ["P2310", "P2282"]}, {"id": "P2290", "text": ["With identical inputs to IC1, IC1 cancels the signal and the Rx signal is not out putted to Pin T."], "jumps": ["P2300", "P2282"]}, {"id": "P2285", "text": ["Rx (-) = R2 + R4 = 11k Equal Rx (+) = R3 = 11k"], "jumps": []}, {"id": "P2282", "text": ["By adjusting R3, the resistance to the non-inverting and inverting inputs is made the same."], "jumps": ["P2290", "P2210", "P2285"]}, {"id": "P2280", "text": ["By adjusting R3, the resistance to the non-inverting and inverting inputs is made the same."], "jumps": ["P2290", "P2210", "P2285"]}, {"id": "P2270", "text": ["The inverting input path is through R3, C2, and TP5."], "jumps": ["P2280", "P2210"]}, {"id": "P2260", "text": ["The non-inverting input path is through R2, R4, C3, and TP6."], "jumps": ["P2270", "P2210"]}, {"id": "P2250", "text": ["Also, the Rx signal is routed to both inputs of IC1."], "jumps": ["P2260", "P2210"]}, {"id": "P2240", "text": ["From Pin S, the Rx signal is routed through C1, TP4, R2, to the local loop."], "jumps": ["P2250", "P2210"]}, {"id": "P2230", "text": ["The Rx or received voice signal is applied to Pin S (Pin E is used to insert a test signal for aligning the card)."], "jumps": ["P2240", "P2210", "Pin"]}, {"id": "P2220", "text": ["The local loop is from TP2, -15 volts, through the telset, J1, through TP3 and R1, to TP1, +15 volts."], "jumps": ["P2230", "P2210"]}, {"id": "P2210", "text": ["Here is the schematic of the card.", "Here is the schematic of the card.........................."], "jumps": ["P2220", "P2180"]}, {"id": "P2200", "text": ["IC1 is an op-amp configured as a differential amplifier that will separate the Tx and Rx signals."], "jumps": ["P2210", "P2180"]}, {"id": "P2190", "text": ["On the bottom center is the modular jack where you plug in a telset.  The card uses only the red and green wires.", "Now, pick up and examine the PC130-337 card.", "On the bottom center is the modular jack where you plug in a telset. The card uses only the red and green wires.", "Now, pick up and examine the PC130-337 card................"], "jumps": ["P2200", "P2180", "P2190", "P2100"]}, {"id": "P2170", "text": ["The other buttons, besides the dialer, are used to store frequently called numbers E1, E2, E3), automatically REDIAL the last number dialed, and to turn off the microphone."], "jumps": ["P2180", "P2100"]}, {"id": "P2160", "text": ["With the switch to PULSE, the telset circuits change the tones into pulses for operation in a system that does not use electronic telsets."], "jumps": ["P2170", "P2100"]}, {"id": "P2150", "text": ["With the switch to TONE, the telset operates like any other electronic telset."], "jumps": ["P2160", "P2100"]}, {"id": "P2140", "text": ["Look at the DTMF dialer. Above the keypad is a switch labeled TONE and PULSE."], "jumps": ["P2150", "P2100"]}, {"id": "P2130", "text": ["A little different configuration from the one you studied but, the operation is the same."], "jumps": ["P2140", "P2100"]}, {"id": "P2120", "text": ["The hand set, which connects to the base unit by way of a spiral cord, contains the microphone, speaker, and dialer circuit."], "jumps": ["P2130", "P2100"]}, {"id": "P2110", "text": ["The cable has a modular jack on both ends. The jacks used are standard and allow connecting any telset to the local loop."], "jumps": ["P2120", "P2100"]}, {"id": "P2100", "text": ["Look at the base unit. It contains the hook switch, ringer circuit, voice network, and cable that connects the telset to phone lines."], "jumps": ["P2110", "P2090"]}, {"id": "P2092", "text": ["Look at the dialer, it uses push buttons and is a dead give away to the type of telset."], "jumps": []}, {"id": "P2091", "text": [], "jumps": []}, {"id": "P2090", "text": ["Now, pick up and examine the telsets.  What type of telset is used?", "Now, pick up and examine the telsets. What type of telset is used?"], "jumps": ["P2020"]}, {"id": "P2080", "text": ["The transmission medium for this experiment are the alligator to alligator jumpers but, could have been coax cables, fiberoptic       cables, microwave links, or radio signals.", "The transmission medium for this experiment are the alligator to alligator jumpers but, could have been coax cables, fiberoptic cables, microwave links, or radio signals."], "jumps": ["P2090", "P2020"]}, {"id": "P2070", "text": ["Notice how the Tx signal in one card is the Rx signal in the other.", "Speaker RX Voice Network Microphone TX"], "jumps": ["P2080", "P2020"]}, {"id": "P2060", "text": ["The circled letters indicated pin numbers on the card where the transmitted and received signal connect."], "jumps": ["P2070", "P2020"]}, {"id": "P2050", "text": ["The interface card also separates the Tx and Rx signals for transmitting and receiving over the transmission medium."], "jumps": ["P2060", "P2020"]}, {"id": "P2040", "text": ["In the telsets, the Tx and Rx signals are separated by the voice network as you have seen.", "Speaker RX Voice Network Microphone TX"], "jumps": ["P2050", "P2020"]}, {"id": "P2030", "text": ["Each telset is connected to the End Office by the local loop with both transmitted (Tx) and received (Rx) voice signals."], "jumps": ["P2040", "P2020"]}, {"id": "P2025", "text": ["The interface circuits, PC130-337, act as End Offices without dialing, switching, or AC ring/busy/dial tone signal circuits."], "jumps": ["P2030", "P2020"]}, {"id": "P2020", "text": ["In this experiment, you will use two telsets connected through interface circuits to produce a basic telephone system.", "Speaker RX Voice Network Microphone TX"], "jumps": ["P2025", "P2001"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1990"]}, {"id": "P1990", "text": ["8.  The tones produced depend on the number dialed.", "8. The tones produced depend on the number dialed..........."], "jumps": ["P1999", "P1980"]}, {"id": "P1980", "text": ["7.  Dialing is accomplished by a key decoder producing two                tones.", "7. Dialing is accomplished by a key decoder producing two tones.", "1 2 3 4 5 6 7 8 9 * 0 #"], "jumps": ["P1990", "P1970"]}, {"id": "P1970", "text": ["6.  The electronic telset contains a ringer circuit, hook switch,             diodes, dialer network, voice network, speaker, and                          microphone.", "6. The electronic telset contains a ringer circuit, hook switch, diodes, dialer network, voice network, speaker, and microphone."], "jumps": ["P1980", "P1960"]}, {"id": "P1960", "text": ["5.  The electronic telset consists of a base unit and hand set.", "5. The electronic telset consists of a base unit and hand set."], "jumps": ["P1970", "P1950"]}, {"id": "P1950", "text": ["4.  Dialing is accomplished by a switch making and breaking as a      dial rotates producing pulses.", "3.  The mechanical telset contains a ringer circuit, hook switch,          dialer network, voice network, speaker, and microphone.", "4. Dialing is accomplished by a switch making and breaking as a dial rotates producing pulses.", "3. The mechanical telset contains a ringer circuit, hook switch, dialer network, voice network, speaker, and microphone."], "jumps": ["P1960", "P1940", "P1950", "P1930"]}, {"id": "P1930", "text": ["2.  The mechanical telset consists of a base unit and hand set.", "1.  There are two categories of telsets.", "2. The mechanical telset consists of a base unit and hand set.", "1. There are two categories of telsets. second line here...."], "jumps": ["P1940", "P1920", "P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on TELSETS.", "This completes the information on TELSETS.E 1 TITLE........"], "jumps": ["P1001", "P1900"]}, {"id": "P1903", "text": ["A 770 and 1336 Hz tone represents the number 5.", "A 770 and 1336 Hz tone represents the number 5............."], "jumps": []}, {"id": "P1902", "text": ["An 852 and 1209 Hz tone represents the number 7.", "An 852 and 1209 Hz tone represents the number 7............"], "jumps": []}, {"id": "P1901", "text": [], "jumps": []}, {"id": "P1900", "text": ["What are the two frequencies produced if the number 8 is dialed?"], "jumps": ["P1890"]}, {"id": "P1893", "text": ["Q3 does not block both the incoming and outgoing signals. Signals from the microphone must be applied to both Q1 and Q2 to isolate the speaker.", "Q3 does not block both the incoming and outgoing signals. Signals from the microphone must be applied to both Q1 and Q2 to isolate the speaker..."], "jumps": []}, {"id": "P1892", "text": ["The outgoing voice signal must be equally applied to both Q1 and Q2 so that the speaker will not respond.  Q3 passes the outgoing signal from the microphone.", "The outgoing voice signal must be equally applied to both Q1 and Q2 so that the speaker will not respond. Q3 passes the outgoing signal from the microphone...."], "jumps": []}, {"id": "P1891", "text": [], "jumps": []}, {"id": "P1890", "text": ["What type of signal does Q3 block?", "What type of signal does Q3 block?........................."], "jumps": ["P1880"]}, {"id": "P1880", "text": ["Newer electronic telsets use additional buttons for added functions."], "jumps": ["P1890", "P1870"]}, {"id": "P1870", "text": ["The two frequencies or tones produced depends on the number dialed or which button was pushed (values are in Hz)."], "jumps": ["P1880", "P1830"]}, {"id": "P1860", "text": ["The high frequency of the crystal, 3.579545 MHz, is used to produce accurate tones when divided."], "jumps": ["P1870", "P1830"]}, {"id": "P1850", "text": ["The key decoder then sends a signal to the high and low tone dividers that selects tones depending on the number dialed."], "jumps": ["P1860", "P1830"]}, {"id": "P1840", "text": ["Pressing a button sets up two inputs to the key decoder, one for the row (R) and one for the column (c), a matrix."], "jumps": ["P1850", "P1830"]}, {"id": "P1830", "text": ["The dialer network uses a key decoder, two frequency dividers and a crystal.", "1 2 3 4 5 6 7 8 9 * 0 #"], "jumps": ["P1840", "P1782"]}, {"id": "P1820", "text": ["Consequently, there is a difference in potential across the speaker and the speaker responds."], "jumps": ["P1830", "P1782"]}, {"id": "P1810", "text": ["The incoming voice signal from the local loop is only applied to Q2. The signal is isolated from Q1 by Q3 which also isolates the signal from the microphone. With only one input applied, the collector of Q1 remains constant and the collector of Q2 varies. This sets up a potential difference across the speaker and produces an output....."], "jumps": ["P1820", "P1782"]}, {"id": "P1800", "text": ["The speaker does not respond to outgoing voice signals.  The variable resistor in the collector of Q2 circuit is adjusted to balance the conduction of Q1 and Q2 and is offset a little to produce sidetone.", "The speaker does not respond to outgoing voice signals. The variable resistor in the collector of Q2 circuit is adjusted to balance the conduction of Q1 and Q2 and is offset a little to produce sidetone."], "jumps": ["P1810", "P1782"]}, {"id": "P1790", "text": ["With the speaker connected across the collectors of Q1/Q2 and with Q1/Q2 amplifying the same signal, there is no difference in     potential across the speaker.", "With the speaker connected across the collectors of Q1/Q2 and with Q1/Q2 amplifying the same signal, there is no difference in potential across the speaker."], "jumps": ["P1800", "P1782"]}, {"id": "P1785", "text": ["COMMON COLLECTOR/EMITTER FOLLOWER - The common collector/emitter follower amplifier has a unity voltage gain (gain of 1) and no phase inversion."], "jumps": []}, {"id": "P1782", "text": ["Since Q3 is a common collector, emitter follower, the signal applied to Q2 is the same level and in phase with the signal        applied to Q1.", "Since Q3 is a common collector, emitter follower, the signal applied to Q2 is the same level and in phase with the signal applied to Q1."], "jumps": ["P1790", "P1760"]}, {"id": "P1780", "text": ["Since Q3 is a common collector, emitter follower, the signal applied to Q2 is the same level and in phase with the signal        applied to Q1.", "Since Q3 is a common collector, emitter follower, the signal applied to Q2 is the same level and in phase with the signal applied to Q1."], "jumps": ["P1790", "P1760"]}, {"id": "P1770", "text": ["The outgoing voice signal from the microphone is applied to the base of Q1, to the base of Q2 through Q3, and to the local loop."], "jumps": ["P1780", "P1760"]}, {"id": "P1760", "text": ["The voice network uses a differential amplifier, normally an op-amp configured for a differential amplifier.  Recall that a differential amplifier rejects common mode signals and operates similarly to the transformer circuit in the mechanical telset.", "The voice network uses a differential amplifier, normally an op-amp configured for a differential amplifier. Recall that a differential amplifier rejects common mode signals and operates similarly to the transformer circuit in the mechanical telset."], "jumps": ["P1770", "P1750"]}, {"id": "P1750", "text": ["Now, let's look at example circuits used in the voice and dialer networks."], "jumps": ["P1760", "P1740"]}, {"id": "P1743", "text": ["The busy signal is generated from the End Office, not the telset."], "jumps": []}, {"id": "P1742", "text": ["The ring signal is generated from the End Office, not the telset."], "jumps": []}, {"id": "P1741", "text": [], "jumps": []}, {"id": "P1740", "text": ["What is the purpose of the crystal?", "What is the purpose of the crystal?........................"], "jumps": ["P1730"]}, {"id": "P1733", "text": ["DC is blocked by C1 and will not reach the ringer circuit.", "DC is blocked by C1 and will not reach the ringer circuit.."], "jumps": []}, {"id": "P1732", "text": ["Due to the action of D2, an AC signal is not applied to the ringer circuit."], "jumps": []}, {"id": "P1731", "text": [], "jumps": []}, {"id": "P1730", "text": ["What type of signal is applied to the ringer circuit?", "What type of signal is applied to the ringer circuit?......"], "jumps": ["P1720"]}, {"id": "P1723", "text": ["D1 through D4 ensures the correct polarity voltage is applied to the line voltage regulator.", "D1 through D4 ensures the correct polarity voltage is applied to the line voltage regulator.u"], "jumps": []}, {"id": "P1722", "text": ["The local loop only supplies power to the line voltage regulator."], "jumps": []}, {"id": "P1721", "text": [], "jumps": []}, {"id": "P1720", "text": ["What supplies power to the IC chips in an electronic telset?"], "jumps": ["P1650"]}, {"id": "P1710", "text": ["The crystal produces the fundamental frequency that is used to generate the different tones for each number dialed."], "jumps": ["P1720", "P1650"]}, {"id": "P1700", "text": ["Also, the Dual Tone Multiple Frequency (DTMF) dialer inputs tones to the voice network which are placed on the local loop."], "jumps": ["P1710", "P1650"]}, {"id": "P1690", "text": ["The incoming voice signals are routed from the local loop through the voice network to the speaker.  D1 through D4 allow the complete voice signal to pass.", "The incoming voice signals are routed from the local loop through the voice network to the speaker. D1 through D4 allow the complete voice signal to pass."], "jumps": ["P1700", "P1650"]}, {"id": "P1680", "text": ["The outgoing voice signals are applied to the local loop through the Voice Network from the microphone.  D1 through D4 allow the complete voice signal to pass.", "The outgoing voice signals are applied to the local loop through the Voice Network from the microphone. D1 through D4 allow the complete voice signal to pass."], "jumps": ["P1690", "P1650"]}, {"id": "P1670", "text": ["The voice network separates the incoming and outgoing voice signals."], "jumps": ["P1680", "P1650"]}, {"id": "P1660", "text": ["The regulator produces the power to operate the rest of the circuits in the telset."], "jumps": ["P1670", "P1650"]}, {"id": "P1650", "text": ["From S1B, the +DC voltage is routed to the line voltage regulator, D5 limits the DC voltage applied."], "jumps": ["P1660", "P1590"]}, {"id": "P1640", "text": ["If the wires are reversed, D1 and D4 are forward biased routing positive polarity power to the line voltage regulator."], "jumps": ["P1650", "P1590"]}, {"id": "P1630", "text": ["Normally, the green wire is positive and the red wire is negative. D2 and D3 are forward biased routing positive polarity power to the line voltage regulator."], "jumps": ["P1640", "P1590"]}, {"id": "P1620", "text": ["This prevents damaging the telset IC chips if the green and red wires are mistakenly reversed."], "jumps": ["P1630", "P1590"]}, {"id": "P1610", "text": ["D1 through D4 ensures that the DC power applied to the line voltage regulator is the correct polarity."], "jumps": ["P1620", "P1590"]}, {"id": "P1600", "text": ["S1A closing shorts out R1 and C1 allowing the small level voice signals and DC power to reach the circuits in the telset through    closed S1B.", "S1A closing shorts out R1 and C1 allowing the small level voice signals and DC power to reach the circuits in the telset through closed S1B."], "jumps": ["P1610", "P1590"]}, {"id": "P1590", "text": ["When you pick up the hand set, off hook, S1A and S1B close."], "jumps": ["P1600", "P1540"]}, {"id": "P1580", "text": ["S1B then routes the pulsating DC through D6 and D7, zener diode limiter and clipper, and activates the electronic ringer circuit --  your phone rings.", "S1B then routes the pulsating DC through D6 and D7, zener diode limiter and clipper, and activates the electronic ringer circuit -- your phone rings."], "jumps": ["P1590", "P1540"]}, {"id": "P1570", "text": ["However, the ring signal will be passed by R1 and C1.  D2 and D4 rectify the AC ring signal (20 and 30 Hz 60 - 80 VAC) to pulsating DC.", "However, the ring signal will be passed by R1 and C1. D2 and D4 rectify the AC ring signal (20 and 30 Hz 60 - 80 VAC) to pulsating DC."], "jumps": ["P1580", "P1540"]}, {"id": "P1560", "text": ["R1 presents a high resistance to voice signals and C1 blocks any DC current."], "jumps": ["P1570", "P1540"]}, {"id": "P1550", "text": ["With the hand set on the base unit, on hook, S1A and S1B are open as shown."], "jumps": ["P1560", "P1540"]}, {"id": "P1540", "text": ["For simplicity, let's look at a discrete block diagram of a typical electronic telset."], "jumps": ["P1550", "P1480"]}, {"id": "P1530", "text": ["The electronic circuits used are IC chips.  One IC can be used as the ringer circuit, voice network and dialer network.", "The electronic circuits used are IC chips. One IC can be used as the ringer circuit, voice network and dialer network."], "jumps": ["P1540", "P1480"]}, {"id": "P1520", "text": ["These electronic circuits also allow for cordless operation of the phone.  Cordless phones use FM signal processing between the hand set and base unit.", "These electronic circuits also allow for cordless operation of the phone. Cordless phones use FM signal processing between the hand set and base unit."], "jumps": ["P1530", "P1480"]}, {"id": "P1510", "text": ["The electronic circuits are what give you the added features such as memory dialing, speed dialing, etc."], "jumps": ["P1520", "P1480"]}, {"id": "P1500", "text": ["The major difference between a mechanical telset and an electronic telset is the dialer and the circuits inside the base unit."], "jumps": ["P1510", "P1480"]}, {"id": "P1490", "text": ["Again, newer electronic telsets have the base unit and hand set combined, but the operation is the same."], "jumps": ["P1500", "P1480"]}, {"id": "P1480", "text": ["A typical electronic telset consists of a base unit and a hand set, just like the mechanical telset.", "Now, let's look at the electronic telset.", "Now, let's look at the electronic telset..................."], "jumps": ["P1490", "P1470", "P1480", "P1460"]}, {"id": "P1463", "text": ["R3 is adjusted to slightly mismatch T1 and T2 so a small amount of the transmitted signal reaches the speaker, not adjusted so most of the transmitted signal does not reach the speaker.", "R3 is adjusted to slightly mismatch T1 and T2 so a small amount of the transmitted signal reaches the speaker, not adjusted so most of the transmitted signal does not reach the speaker....M"], "jumps": []}, {"id": "P1462", "text": ["If the signal to the speaker is in phase to the transmitted signal, the speaker would pick up the outgoing voice signal."], "jumps": []}, {"id": "P1461", "text": ["How is most of the transmitted voice signal prevented from reaching the speaker?", "R3 is part of the voice network that separates the incoming signal from the outgoing signal.  It is not a varistor, it is a variable resistor.", "R1 is part of the automatic volume control but does not change resistance.  R1 is not a varistor.", "R3 is part of the voice network that separates the incoming signal from the outgoing signal. It is not a varistor, it is a variable resistor.", "R1 is part of the automatic volume control but does not change resistance. R1 is not a varistor."], "jumps": ["P1450"]}, {"id": "P1451", "text": ["Which component changes resistance as the signal level changes?", "L1 and L2 are the bell solenoids.", "The voice network of T1 and T2 separate signals on the local loop.", "L1 and L2 are the bell solenoids..........................."], "jumps": ["P1440"]}, {"id": "P1441", "text": ["In the dialer network, what is the purpose of C2, R1, and R2?"], "jumps": ["P1400"]}, {"id": "P1430", "text": ["While the received signal is cancelled in T2A and blocked from the microphone."], "jumps": ["P1440", "P1400"]}, {"id": "P1420", "text": ["Consequently, the received signal is induced in T1A and passed on to the speaker."], "jumps": ["P1430", "P1400"]}, {"id": "P1410", "text": ["This in turn sets up in phase signals in T1C and out of phase signals in T2C.", "The received voice signal from the local loop is applied to T1B and T2B in series."], "jumps": ["P1420", "P1400", "P1410", "P1310"]}, {"id": "P1390", "text": ["So, R3 is adjusted so a small amount of the transmitted signal is not canceled in T1 and reaches the speaker -- this is called sidetone."], "jumps": ["P1400", "P1310"]}, {"id": "P1380", "text": ["However, most people prefer to hear a small amount of their own voice in the speaker."], "jumps": ["P1390", "P1310"]}, {"id": "P1370", "text": ["C3, C4, and R3 are used to exactly balance T1 and T2 for proper operation."], "jumps": ["P1380", "P1310"]}, {"id": "P1360", "text": ["This prevents the transmitted voice signal from reaching the speaker."], "jumps": ["P1370", "P1310"]}, {"id": "P1350", "text": ["The voice signal is also passed to T1B and T1C.  However, the signal in T1 is out of phase, as indicated by the dots, and cancel.", "The voice signal is also passed to T1B and T1C. However, the signal in T1 is out of phase, as indicated by the dots, and cancel."], "jumps": ["P1360", "P1310"]}, {"id": "P1340", "text": ["By transformer action, the voice signal is passed to T2B and placed on the local loop."], "jumps": ["P1350", "P1310"]}, {"id": "P1330", "text": ["The outgoing voice signal from the microphone is coupled to T2A."], "jumps": ["P1340", "P1310"]}, {"id": "P1320", "text": ["Recall that the transmitted and received voice signals are both on the local loop.  This is called \"duplex transmission\".", "The last circuit is the voice network that separates the outgoing voice signal from the incoming voice signal.", "Recall that the transmitted and received voice signals are both on the local loop. This is called \"duplex transmission\"."], "jumps": ["P1330", "P1310", "P1320", "P1260"]}, {"id": "P1300", "text": ["If the signal level on the local loop decreases, the resistance of R2 increases, allowing less of the signal to be shorted around the voice network."], "jumps": ["P1310", "P1260"]}, {"id": "P1290", "text": ["If the signal level on the local loop increases, the resistance of R2 decreases, allowing more of the signal to be shorted around the voice network."], "jumps": ["P1300", "P1260"]}, {"id": "P1280", "text": ["C2 couples voice signals to R2.  R2 is a varistor that inversely changes its resistance according to the level of the applied voltage.", "C2 couples voice signals to R2. R2 is a varistor that inversely changes its resistance according to the level of the applied voltage."], "jumps": ["P1290", "P1260"]}, {"id": "P1270", "text": ["C2, R1, and R2 act as an automatic volume control.", "Switch S2B is used to short the speaker while dialing to prevent you from hearing the pulses."], "jumps": ["P1280", "P1260", "P1270", "P1240"]}, {"id": "P1250", "text": ["Circuits located in the End Office count the pulses to determine the number dialed."], "jumps": ["P1260", "P1240"]}, {"id": "P1240", "text": ["For example, dialing a 5 followed by a 3 produces a set of five and three pulses as shown."], "jumps": ["P1250", "P1210"]}, {"id": "P1230", "text": ["S2A opens and closes a specific number of times to produce pulses for each digit dialed."], "jumps": ["P1240", "P1210"]}, {"id": "P1220", "text": ["Switch S2A is mechanically connected to the dialer and sequentially opens and closes as the dialer rotates - on the return rotation.", "The next circuit is the dialer network.", "S1 is the hook switch that is used to make or break the local loop.", "C1 is a capacitor that blocks the DC power to the telset from the ringer circuit.", "The next circuit is the dialer network....................."], "jumps": ["P1230", "P1210", "P1220", "P1200"]}, {"id": "P1201", "text": ["Which component in the telset is a bell solenoid?", "Which component in the telset is a bell solenoid?.........."], "jumps": ["P1140"]}, {"id": "P1190", "text": ["S1C shorts out the speaker when the local loop is open to prevent \"clicks\" when the hook switch is activated."], "jumps": ["P1200", "P1140"]}, {"id": "P1180", "text": ["Picking up the hand set causes the hook switch to close making the local loop, request for service."], "jumps": ["P1190", "P1140"]}, {"id": "P1170", "text": ["When the hand set is on the base unit, the hook switch is pushed and opens, breaking the local loop."], "jumps": ["P1180", "P1140"]}, {"id": "P1160", "text": ["S1A and S1B make or break the series local loop."], "jumps": ["P1170", "P1140"]}, {"id": "P1150", "text": ["The switch has three parts, S1A, S1B, and S1C.", "Just past the ringer circuit is the hook switch, S1.", "Just past the ringer circuit is the hook switch, S1........"], "jumps": ["P1160", "P1140", "P1150", "P1090", "P"]}, {"id": "P1130", "text": ["In this case, the resonate frequency is 30 Hz.  Remember, the US ring signal is a 20 and 30 Hz, 60 to 80 Volt AC signal.", "In this case, the resonate frequency is 30 Hz. Remember, the US ring signal is a 20 and 30 Hz, 60 to 80 Volt AC signal."], "jumps": ["P1140", "P1090"]}, {"id": "P1120", "text": ["On some phones, a switch located on the bottom of the base unit allows you to short out one of the inductors reducing the volume of the ringer."], "jumps": ["P1130", "P1090"]}, {"id": "P1110", "text": ["With both L1 and L2 in the circuit, a 20 Hz AC signal produces resonance which operate the bell solenoids - your phone rings."], "jumps": ["P1120", "P1090"]}, {"id": "P1100", "text": ["The ringer circuit is a series resonant LC circuit.  The inductors are bell solenoids while the capacitor blocks DC power.", "The two wire local loop (green and red wires) connects into the base unit where the first circuit encountered is the ringer circuit.", "The ringer circuit is a series resonant LC circuit. The inductors are bell solenoids while the capacitor blocks DC power."], "jumps": ["P1110", "P1090", "P1050", "P1100"]}, {"id": "P1080", "text": ["Even though newer mechanical telsets have the base unit and hand set combined, the operation is the same.   Let's see.", "Even though newer mechanical telsets have the base unit and hand set combined, the operation is the same. Let's see."], "jumps": ["P1090", "P1050"]}, {"id": "P1070", "text": ["The hand set contains the input and output transducers (microphone and speaker) and is connected to the base unit by way of a spiral cord."], "jumps": ["P1080", "P1050"]}, {"id": "P1060", "text": ["The base unit plugs into the telephone jack and has the ringer circuit, dialer network, voice network, and hook switch."], "jumps": ["P1070", "P1050"]}, {"id": "P1050", "text": ["A typical mechanical telset consists of a base unit and a hand set."], "jumps": ["P1060", "P1020"]}, {"id": "P1040", "text": ["Let's first study the mechanical telset."], "jumps": ["P1050", "P1020"]}, {"id": "P1025", "text": ["And, even though there are hundreds of different types, all telsets can be broken down into two general categories.", "The telset, it is the device you use every day.", "The telset, it is the device you use every day............."], "jumps": ["P1040", "P1020", "P1025", "P1001"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P460", "text": ["Let's begin the lesson on TELEPHONE EQUIPMENT............................."], "jumps": ["P400"]}, {"id": "P450", "text": ["The one common circuit is let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
