.   Finding the volume of a pyramid is not much different than             finding the volume of a prism.", "6. The volume of any pyramid is 1/3(Bh) where b is the area its base and h is the length of its altitude.", "5. Finding the volume of a pyramid is not much different than finding the volume of a prism."], "jumps": ["P2980", "P2960"]}, {"id": "P3040", "text": ["Also, instead of having a set of flat triangular faces, it has a single curved surface called its lateral surface."], "jumps": ["P3030"]}, {"id": "P2950", "text": ["4.  Then to find the volume, we would multiply the product of the         triangle with the altitude of the prism.", "4. Then to find the volume, we would multiply the product of the triangle with the altitude of the prism.", "1. A = 1/2(5 x 3) 2. A = 1/2(15) 3. A = 7.5 ft2 = 141.12 cm3 00,000th of a m33333333333333333333", "1. V = 7.5 x 10 2. V = 75 ft 33) 3. A = 7.5 ft2 = 141.12 cm3 00,000th of a m33333333333333333333"], "jumps": ["P2960", "P2940"]}, {"id": "P3120", "text": ["Every cylinder has three surfaces.  The two flat surfaces are called the bases and the curved surface that connects the bases is known as the lateral surface.", "Every cylinder has three surfaces. The two flat surfaces are called the bases and the curved surface that connects the bases is known as the lateral surface."], "jumps": ["P3110"]}, {"id": "P3150", "text": ["The volume of a cylinder is p r2 h, where r is the radius of its bases and h is the length of the altitude.", "The volume of a cylinder is p r2 h, where r is the radius of its bases and h is the length of the altitude.."], "jumps": ["P3160", "P3140"]}, {"id": "P2910", "text": ["You have completed the information on PRISM AND PYRAMID VOLUME."], "jumps": ["P2001", "P2350"]}, {"id": "P2930", "text": ["2.  Once the area of the base had been found, multiply the                    product by the altitude of the prism.", "2. Once the area of the base had been found, multiply the product by the altitude of the prism..", "1. A = 4 x 5 2. A = 20 m2 V = 1/3(423.36) 3. V = 141.12 cm3 00,000th of a m33333333333333333333", "1. V = 20 x 7 2. V = 140m3 V = 1/3(423.36) 3. V = 141.12 cm3 00,000th of a m33333333333333333333"], "jumps": ["P2940", "P2920"]}, {"id": "P2055", "text": ["CONGRUENT - When two shapes can be superimposed upon each other and they appear to be exactly the same, they are congruent."], "jumps": []}, {"id": "P2920", "text": ["1.  To find the volume of a prism, first we need to find the area of         the base.", "1. To find the volume of a prism, first we need to find the area of the base..", "1. A = 4 x 5 2. A = 20 m2 V = 1/3(423.36) 3. V = 141.12 cm3 00,000th of a m33333333333333333333"], "jumps": ["P2930", "P2001"]}, {"id": "P2960", "text": ["5.   Finding the volume of a pyramid is not much different than             finding the volume of a prism.", "5. Finding the volume of a pyramid is not much different than finding the volume of a prism."], "jumps": ["P2970", "P2940"]}, {"id": "P3101", "text": [], "jumps": []}, {"id": "P2320", "text": ["By multiplying the length times the width of the rectangle, we get the area.", "1. A = 10.5 x 5.6 2. A = 58.8 cm2 3. A = 12.6 m2 72 cm31,000,000th of a m33333333333333333333"], "jumps": ["P2330", "P2290"]}, {"id": "P2310", "text": ["We can see that the pyramid's base is a rectangle.   Let's isolate the rectangle and find its area as if it were a ordinary, two-dimensional rectangle.", "We can see that the pyramid's base is a rectangle. Let's isolate the rectangle and find its area as if it were a ordinary, two-dimensional rectangle."], "jumps": ["P2320", "P2290"]}, {"id": "P2342", "text": ["The base of the pyramid is a rectangle.  The area of the parallelogram is obtained by multiplying the length by the width. This product is then multiplied by the pyramid's altitude and divided by three.", "The base of the pyramid is a rectangle. The area of the parallelogram is obtained by multiplying the length by the width. This product is then multiplied by the pyramid's altitude and divided by three."], "jumps": []}, {"id": "P2341", "text": [], "jumps": []}, {"id": "P2270", "text": ["Triangles, squares, rectangles, and parallelograms are commonly used bases for pyramids."], "jumps": ["P2280", "P2260"]}, {"id": "P2290", "text": ["The volume of any pyramid is 1/3(Bh) where B is the area of its base and h is the length of its altitude."], "jumps": ["P2300", "P2270"]}, {"id": "P2350", "text": ["Regardless of the shape of the pyramid's base, the formula for pyramid volume remains the same.   Just like the prism, the key to finding the volume is to first find the base area.", "Regardless of the shape of the pyramid's base, the formula for pyramid volume remains the same. Just like the prism, the key to finding the volume is to first find the base area."], "jumps": ["P2910", "P2340"]}, {"id": "P2235", "text": ["POLYGON -  A shape is a polygon if all lines intersect only at their endpoints and no two lines lie on the same plane.", "POLYGON - A shape is a polygon if all lines intersect only at their endpoints and no two lines lie on the same plane.", "Number of sides Name of polygon 3 Triangle 4 Quadrilateral 5 Pentagon 6 Hexagon 7 Heptagon 8 Octagon 9 Nonagon 10 Decagon 12 Dodecagon"], "jumps": []}, {"id": "P2280", "text": ["Finding the volume of a pyramid is not much different than finding the volume of a prism."], "jumps": ["P2290", "P2270"]}, {"id": "P2280", "text": ["Finding the volume of a pyramid is not much different than finding the volume of a prism."], "jumps": ["P2290", "P2270"]}, {"id": "P2220", "text": ["A pyramid is a three-dimensional object made up of a group of triangles originating from a common base.", "Another common shape that we need to find volume measurements for is a pyramid."], "jumps": ["P2230", "P2210"]}, {"id": "P2210", "text": ["Another common shape that we need to find volume measurements for is a pyramid."], "jumps": ["P2220", "P2200"]}, {"id": "P2230", "text": ["Notice how the base can be any regular polygon.", "Notice how the base can be any regular polygon............."], "jumps": ["P2240", "P2210"]}, {"id": "P2240", "text": ["Each endpoint of the base meets at a common vertex, regardless of how many sides the base has."], "jumps": ["P2250", "P2230"]}, {"id": "P2260", "text": ["For example, if a pyramid has a triangular base, then three triangles are formed. If the base is a rectangle, four triangles are formed."], "jumps": ["P2270", "P2230"]}, {"id": "P2330", "text": ["To find the total volume, all we do is take 1/3 of the product of the base area times the pyramid's altitude.", "1. V = 1/3(58.8 x 7.2) 2. V = 1/3(423.36) 3. V = 141.12 cm3 00,000th of a m33333333333333333333"], "jumps": ["P2340", "P2290"]}, {"id": "P2340", "text": ["What is the volume of this pyramid?", "What is the volume of this pyramid?........................"], "jumps": ["P2290", "P2345"]}, {"id": "P1160", "text": ["It is just as simple to determine how many liters a rectangular solid holds."], "jumps": ["P1170", "P1150"]}, {"id": "P2200", "text": ["Prisms can come in a wide variety of shapes.  Whether the base is a square, rectangle, triangle, or trapezoid, the formula for prism volume remains unchanged.", "Prisms can come in a wide variety of shapes. Whether the base is a square, rectangle, triangle, or trapezoid, the formula for prism volume remains unchanged."], "jumps": ["P2210", "P2190"]}, {"id": "P2110", "text": ["Remember, the altitude of a prism is a line joining the planes of its two bases; this line is perpendicular to each base."], "jumps": ["P2120", "P2060"]}, {"id": "P2120", "text": ["We can now say the volume of a prism is V = Bh, where B is the area of one base and h is the altitude length."], "jumps": ["P2130", "P2110"]}, {"id": "P2150", "text": ["By looking at the prism, we see that the two bases are triangles."], "jumps": ["P2160", "P2140"]}, {"id": "P2250", "text": ["The result of these lines connecting to this common point is always a group of triangles whose number corresponds to the number of sides of the base."], "jumps": ["P2260", "P2230"]}, {"id": "P2060", "text": ["The illustration below is a common prism.", "The illustration below is a common prism..................."], "jumps": ["P2070", "P2050"]}, {"id": "P430", "text": ["Once we find the volume of an object, we can see how much liquid it takes to fill it or the total space the object occupies."], "jumps": ["P440", "P420"]}, {"id": "P2090", "text": ["First, we have to find the area of a base.   Since each base is a mirror image of each other, either one can be used.", "First, we have to find the area of a base. Since each base is a mirror image of each other, either one can be used.", "1. A = 6 x 3 2. A = 18 cm2 4. V = 72 cm34 4. V = 72 cm31/1,000,000th of a m33333333333333333333"], "jumps": ["P2100", "P2060"]}, {"id": "P2170", "text": ["By using the standard formula for triangle area, which is \nA = 1/2(bh), we complete step one.", "By using the standard formula for triangle area, which is A = 1/2(bh), we complete step one.", "1. A = 1/2(7 x 3.6) 2. A = 1/2(25.2) 3. A = 12.6 m2 72 cm31,000,000th of a m33333333333333333333"], "jumps": ["P2180", "P2160"]}, {"id": "P2050", "text": ["The main requirement of a prism is that the two bases are not only parallel, but also congruent."], "jumps": ["P2060", "P2040"]}, {"id": "P2070", "text": ["Notice how the parallelograms bases are parallel and congruent to each other."], "jumps": ["P2080", "P2060"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2191", "text": [], "jumps": []}, {"id": "P1970", "text": ["6.  One cubic meter is equal to 1000 liters.   Multiply height by              width by length, then multiply the result by 1000 to find cubic         meters.", "6. One cubic meter is equal to 1000 liters. Multiply height by width by length, then multiply the result by 1000 to find cubic meters....", "1. 0.5 x 0.9 x 2 = 0.9 2. 0.9 x 1000 = 900 m3lll = 1/1,000,000th of a m33333333333333333333"],  ["Using the rectangular solid below, let's find the volume in liters."], "jumps": ["P1190", "P1160"]}, {"id": "P3200", "text": ["When measuring the volume of a sphere, we are seeking the volume of the solid consisting of the sphere and its interior."], "jumps": ["P3210", "P3170"]}, {"id": "P1170", "text": ["Remember, a liter is the same as 1000 cm   . This means the liter is a cube having a length of 10 cm, a width of 10 cm, and a height of 10 cm.", "Remember, a liter is the same as 1000 cm . This means the liter is a cube having a length of 10 cm, a width of 10 cm, and a height of 10 cm."], "jumps": ["P1180", "P1160"]}, {"id": "P2030", "text": ["For example, a prism uses a different method for measuring volume."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["A prism is similar to a rectangular solid.  The main difference is the bases of the prism are not always rectangular.  They can be triangles, trapezoids or a variety of different shapes.", "A prism is similar to a rectangular solid. The main difference is the bases of the prism are not always rectangular. They can be triangles, trapezoids or a variety of different shapes."], "jumps": ["P2050", "P2030"]}, {"id": "P2080", "text": ["To find the volume of this prism, we need to complete two steps."], "jumps": ["P2090", "P2060"]}, {"id": "P2100", "text": ["Once the area of the base has been found, multiply this product by the altitude of the prism.", "1. A = 6 x 3 2. A = 18 cm2 3. V = 18 x 4 4. V = 72 cm3000,000th of a m33333333333333333333"], "jumps": ["P2110", "P2060"]}, {"id": "P2130", "text": ["It is important to remember that this formula applies to any prism, regardless of size, shape, or altitude.  The key is to first find the area of the base.", "It is important to remember that this formula applies to any prism, regardless of size, shape, or altitude. The key is to first find the area of the base."], "jumps": ["P2140", "P2110"]}, {"id": "P2180", "text": ["Multiply this product by the altitude of let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
