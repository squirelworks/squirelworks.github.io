: ["P420", "P400"]}, {"id": "P420", "text": ["Signal tracing locates the fault to a specific stage in the amplifier."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Measuring DC operating voltages on the transistor indicates possible component faults.", "Calculated Value Eb = 4.7 V Ee = 4.1 V Ec = 7.0 VVVVVVVVV"], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Resistance measurements confirm a suspected component failure."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["Let's begin the lesson on MULTISTAGE AMPLIFIER TROUBLESHOOTING PRACTICE....."], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1020", "text": ["The purpose of this experiment is to give you practice in determining if a multistage amplifier circuit is operating normally.  If the circuit is faulted you will determine the faulty stage and find the faulty component.", "The purpose of this experiment is to give you practice in determining if a multistage amplifier circuit is operating normally. If the circuit is faulted you will determine the faulty stage and find the faulty component."], "jumps": ["P1040", "P1001"]}, {"id": "P1040", "text": ["The multistage amplifier circuit is made up of two cards, \nPC130-33 and PC130-34.", "The multistage amplifier circuit is made up of two cards, PC130-33 and PC130-34."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["PC130-33 contains the first and second stage.", "It consists of two common emitter class A RC coupled amplifiers. Q1 is stage 1 and Q2 is stage 2."], "jumps": ["P1060", "P1040", "P1070"]}, {"id": "P1070", "text": ["The input is from a function generator and the output is fed to stage 3."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["PC130-34 contains the third and fourth stage.", "It consists of a driver amplifier and a push-pull amplifier. Q1 is stage 3, Q2 and Q3 are stage 4.", "PC130-34 contains the third and fourth stage..............."], "jumps": ["P1090", "P1060", "P1100", "P1080"]}, {"id": "P1100", "text": ["The input is from stage 2 and the output is connected to a speaker.  Let's start the experiment.", "The input is from stage 2 and the output is connected to a speaker. Let's start the experiment."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P1090"]}, {"id": "P1120", "text": ["2.  Carefully plug PC130-33 into the Test Console PC2 position. \n3.  Carefully plug PC130-34 into the Test Console PC3 position.", "2. Carefully plug PC130-33 into the Test Console PC2 position. 3. Carefully plug PC130-34 into the Test Console PC3 position.er switch to ON........................................."], "jumps": ["P1110"]}, {"id": "P1130", "text": ["4.  On PC130-33, set S1 and S2 to IN, set S3 to OUT.", "S1 swamps Q1.  S2 connects Q1 output to Q2 input.  S3 is OUT (closed) to provide maximum gain from Q2.  The loaded voltage gains are: stage 1 (Q1) about 2; stage 2 (Q2) about 183.", "4. On PC130-33, set S1 and S2 to IN, set S3 to OUT........", "MEASUREMENT SETUP - Carefully place S1and S2 to IN, and S3 to OUT.osition.", "S1 swamps Q1. S2 connects Q1 output to Q2 input. S3 is OUT (closed) to provide maximum gain from Q2. The loaded voltage gains are: stage 1 (Q1) about 2; stage 2 (Q2) about 183."], "jumps": ["P1140", "P1120", "P1135", "P1150", "P1130"]}, {"id": "P1145", "text": ["The loaded voltage gains for PC130-34 are:\nstage 3 (Q1) approximately 31 \nstage 4 (Q2, Q3) approximately 1", "SWAMP - A transistor is swamped when a small unbypassed resistor (swamping resistor) is placed on the emitter. The swamping resistor allows a small AC signal on the emitter which decreases the gain, making the transistor more stable.", "The loaded voltage gains for PC130-34 are: stage 3 (Q1) approximately 31 stage 4 (Q2, Q3) approximately 1."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["5.  Set the Voltmeter Switch to Positive. \n6.  Set the Positive Supply Voltage to 12. \n     The Test Console's Voltage Meter should indicate 12 volts.", "5. Set the Voltmeter Switch to Positive. 6. Set the Positive Supply Voltage to 12. The Test Console's Voltage Meter should indicate 12 volts."], "jumps": ["P1150"]}, {"id": "P1170", "text": ["7.  Connect a function generator to PC1 Output BNC.\n     PC1 output BNC connects to the input of PC2.", "7. Connect a function generator to PC1 Output BNC. PC1 output BNC connects to the input of PC2. ................."], "jumps": ["P1180", "P1160", "P1175"]}, {"id": "P1175", "text": ["BNC CONNECTION - Connect the Function Generator's Main Output BNC to the Test Console's PC1 Output BNC."], "jumps": []}, {"id": "P1180", "text": ["8.  Connect an oscilloscope setup to measure AC to PC130-33            TP2. \n9.  Adjust the output of the function generator for a 1 kHz, \n     1.5 Vpp signal as measured on PC130-33 TP2.", "OSCILLOSCOPE LEAD PLACEMENT - Connect CH1 probe to TP2.", "8. Connect an oscilloscope setup to measure AC to PC130-33 TP2. 9. Adjust the output of the function generator for a 1 kHz, 1.5 Vpp signal as measured on PC130-33 TP2........"], "jumps": ["P1190", "P1170", "P1185"]}, {"id": "P1190", "text": ["10.  Turn PC2 and PC3 DC Power switches ON. \n11.  Turn the Speaker switch ON.", "10. Turn PC2 and PC3 DC Power switches ON. 11. Turn the Speaker switch ON. to ON. 130A - Set the PC2 AC switch to ON. 130A - Set the PC3 Speaker switch to ON.."], "jumps": ["P1180"]}, {"id": "P1200", "text": ["Do you hear a 1 kHz tone from the speaker?", "Do you hear a 1 kHz tone from the speaker?................."], "jumps": ["P1190"]}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1202", "text": ["You should hear a 1 kHz tone from the speaker. Check your setup. If setup is correct, check with your instructor.", let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
