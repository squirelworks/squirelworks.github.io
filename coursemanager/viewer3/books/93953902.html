<script>
const book = {"title": "93953902", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ..", "Title: AM RECEIVER OPERATIONdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P13380", "text": ["1.  Press Enter to set: Speaker Switch - ON \n     Leave oscilloscope connected to PIN E. \n2.  Tune PC130-38 C1 until you hear the function generator tone\n     in the speaker.", "1. Press Enter to set: Speaker Switch - ON Leave oscilloscope connected to PIN E. 2. Tune PC130-38 C1 until you hear the function generator tone in the speaker........................."], "jumps": ["P13363"]}, {"id": "P100", "text": ["w Measure the input and output waveforms of AM receiver circuits. w Recognize normal operation of an AM Receiver.", "w Recognize AM Receiver Circuits. w Describe the operating characteristics of AM Receiver Circuits."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 470 Oscilloscope or Equivalent"], "jumps": []}, {"id": "P301", "text": [], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P335", "text": [], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson you will learn about the circuits in AM receivers."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Each block contains electronic circuits that perform specific functions."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["The circuits used are not new, you have already learned how they operate individually."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["What is new is how these circuits are combined to make an AM receiver."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on AM RECEIVER OPERATION..........................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The basic AM receiver contains four functional blocks.", "The basic AM receiver contains four functional blocks......"], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["These blocks contain amplifier, oscillator, LC and diode circuits."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Let's start with the circuits contained in the tuner block."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The tuner block contains three circuits.", "The tuner block contains three circuits...................."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["Recall that the RF amplifier selects and amplifies one frequency from the many picked up by the antenna."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["Recall that the local oscillator produces a frequency 455 kHz above the selected RF frequency."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["The mixer produces four frequencies."], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["The tuner output is the difference between the RF and LO frequencies, 455 kHz intermediate frequency (IF).", "The tuner consists of an RF amplifier, a local oscillator, and a mixer. These circuits are combined in a single unit."], "jumps": ["P1100", "P1050", "P1110", "P1090"]}, {"id": "P1110", "text": ["Q1 functions as an amplifier, oscillator and mixer!"], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["Q1 AS AN AMPLIFIER  \nQ1 is configured as a common emitter with R1, R2 and R3 providing combination biasing in class A.", "Q1 AS AN AMPLIFIER Q1 is configured as a common emitter with R1, R2 and R3 providing combination biasing in class A."], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["The collector load is developed from +Vcc through R4, primary of T3, primary of T2, to the collector of Q1."], "jumps": ["P1135", "P1100"]}, {"id": "P1135", "text": ["The dotted lines around T2 indicate that it is shielded and the arrow indicates that it is variable."], "jumps": ["P1140", "P1100"]}, {"id": "P1140", "text": ["The input to Q1 is from the tuned circuit of T1 and C1A."], "jumps": ["P1150", "P1100"]}, {"id": "P1150", "text": ["T1 functions as the antenna picking up any radio frequencies in the range of 500 kHz to 1600 kHz. These frequencies are modulated with intelligence."], "jumps": ["P1160", "P1100"]}, {"id": "P1160", "text": ["C1A is variable and forms a parallel resonant circuit with T1. Only one radio frequency from the many available is passed to the base of Q1."], "jumps": ["P1170", "P1100"]}, {"id": "P1170", "text": ["The one selected frequency is then amplified. Q1 operates as a RF amplifier."], "jumps": ["P1180", "P1100"]}, {"id": "P1180", "text": ["Q1 AS AN OSCILLATOR  \nThe secondary of T2 and C1B act as a tank circuit in a Hartley oscillator configuration.", "Q1 AS AN OSCILLATOR The secondary of T2 and C1B act as a tank circuit in a Hartley oscillator configuration."], "jumps": ["P1190", "P1100"]}, {"id": "P1190", "text": ["AC energy is supplied to the tank by the primary of T2. The dotted lines around T2 indicate that it is shielded and the arrow indicates that it is variable."], "jumps": ["P1200", "P1100"]}, {"id": "P1200", "text": ["C1B is variable and adjusts the resonant frequency of the tank to 455 kHz above the selected RF frequency."], "jumps": ["P1210", "P1100"]}, {"id": "P1210", "text": ["Notice the C1A and C1B arrows are connected together."], "jumps": ["P1220", "P1100"]}, {"id": "P1220", "text": ["This indicates that they are ganged, one control knob varies both C1A and C1B. C1A tunes in a station and C1B tunes the local oscillator at the same time.", "This indicates that they are ganged, one control knob varies both C1A and C1B. C1A tunes in a station and C1B tunes the local oscillator at the same time.."], "jumps": ["P1230", "P1100"]}, {"id": "P1230", "text": ["C3 feeds back the LO signal to the emitter of Q1."], "jumps": ["P1240", "P1100"]}, {"id": "P1240", "text": ["Q1 acts like a Hartley oscillator tuned to a frequency 455 kHz above the selected RF.", "Q1 AS A MIXER \nThe received RF on the base of Q1 changes the base bias causing collector current to change.", "Q1 AS A MIXER The received RF on the base of Q1 changes the base bias causing collector current to change."], "jumps": ["P1250", "P1100", "P1260"]}, {"id": "P1260", "text": ["The LO frequency is on the emitter of Q1 which also changes the bias causing the collector current to change."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["The result on the collector of Q1 is a combination of the RF and LO frequencies."], "jumps": ["P1280", "P1250"]}, {"id": "P1280", "text": ["The signals are the original RF, original LO, the sum of the LO and RF, and the difference between the LO and RF."], "jumps": ["P1290", "P1250"]}, {"id": "P1290", "text": ["Q1 acts as a mixer.", "Now, the combined signal on the collector of Q1 is passed to T3."], "jumps": ["P1300", "P1250", "P1310"]}, {"id": "P1310", "text": ["The inductor and capacitor of T3's primary and secondary form a resonant circuit. It is tuned to 455 kHz or the difference between LO and RF."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["The output of the tuner is the 455 kHz IF frequency and is applied to the IF amplifier block.", "What signal is applied to the base of Q1?", "What signal is applied to the base of Q1?.................."], "jumps": ["P1330", "P1300"]}, {"id": "P1331", "text": ["The LO signal is developed from T2 and C1B and is applied through C3 to the emitter of Q1.", "The IF signal is contained on the collector of Q1 and passes through T3 to the output.", "What signal is applied to the emitter of Q1?", "What signal is applied to the emitter of Q1?..............."], "jumps": ["P1330"]}, {"id": "P1341", "text": ["The RF signal is developed from T1 and C1A and is applied through C1 to the base of Q1.", "The IF signal is contained on the collector of Q1 and passes through T3 to the output.", "What is the signal on the collector of Q1?", "What is the signal on the collector of Q1?................."], "jumps": ["P1340"]}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1352", "text": ["The signal you selected is on the collector but, there are others."], "jumps": []}, {"id": "P1360", "text": ["Next, let's look at the circuits used in the IF amplifier block."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["Recall that this block amplifies the 455 kHz IF output of the tuner block."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["This circuit contains a two stage amplifier. Any number of stages may be used."], "jumps": ["P1390", "P1360"]}, {"id": "P1390", "text": ["Both Q2 and Q3 are common emitter amplifiers using combination biasing in class A."], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["T4 and T5 are resonant at 455 kHz, the frequency of the input signal. Only the IF is passed from one stage to another."], "jumps": ["P1410", "P1380"]}, {"id": "P1410", "text": ["Base biasing for Q2 is developed by R5 and a DC voltage from the detector block."], "jumps": ["P1415", "P1380"]}, {"id": "P1415", "text": ["The DC voltage from the detector is used to control the gain of Q2 by changing the bias level supplied by R5."], "jumps": ["P1430", "P1380"]}, {"id": "P1430", "text": ["Base biasing for Q3 is developed by R8 and R9 through the secondary of T4."], "jumps": ["P1450", "P1380"]}, {"id": "P1450", "text": ["The collector load for Q2 is from +Vcc through R7 and T4."], "jumps": ["P1460", "P1380"]}, {"id": "P1460", "text": ["The collector load for Q3 is from +Vcc through T5."], "jumps": ["P1470", "P1380"]}, {"id": "P1470", "text": ["The output is an amplified 455 kHz signal that is fed to the Detector block."], "jumps": ["P1480", "P1380"]}, {"id": "P1480", "text": ["What frequency is T4 and T5 tuned to?", "What frequency is T4 and T5 tuned to?......................"], "jumps": ["P1380"]}, {"id": "P1481", "text": [], "jumps": []}, {"id": "P1482", "text": ["The Tuner block changes the RF signal by action of the mixer and LO. T4 & T5 are not tuned to the RF frequency."], "jumps": []}, {"id": "P1483", "text": ["The local oscillator frequency changes the incoming RF in the tuner block. T4 & T5 are not tuned to the LO frequency."], "jumps": []}, {"id": "P1490", "text": ["The next functional block is the Detector.", "The next functional block is the Detector.................."], "jumps": ["P1500", "P1480"]}, {"id": "P1500", "text": ["Recall that the Detector recovers the intelligence. The detector circuit consists of a diode and an RC circuit."], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["The Detector circuit consists of a diode and a RC circuit.", "The Detector circuit consists of a diode and a RC circuit.."], "jumps": ["P1520", "P1490"]}, {"id": "P1520", "text": ["The input signal is a modulated IF signal with a frequency of  455 kHz.", "The input signal is a modulated IF signal with a frequency of 455 kHz."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["D1 rectifies the input signal eliminating the positive portion."], "jumps": ["P1540", "P1510"]}, {"id": "P1540", "text": ["The rectified signal is then passed to a RC circuit consisting of  C11, R12 and R13.", "The rectified signal is then passed to a RC circuit consisting of C11, R12 and R13."], "jumps": ["P1550", "P1510"]}, {"id": "P1550", "text": ["The RC time constant of C11, R12 and R13 is long for the 455 kHz signal. C11 will not have time to discharge between alternations of the IF."], "jumps": ["P1560", "P1510"]}, {"id": "P1560", "text": ["The RC time constant of C11, R12 and R13 is short for the low frequency intelligence. C11 will discharge between alternations."], "jumps": ["P1570", "P1510"]}, {"id": "P1570", "text": ["The result is that the signal on the junction of C11 and R13 is only the low frequency intelligence."], "jumps": ["P1580", "P1510"]}, {"id": "P1580", "text": ["The value of C11 effectively grounds the 455 kHz signal and passes the low frequency intelligence to the output."], "jumps": ["P1590", "P1510"]}, {"id": "P1590", "text": ["R12 is used for volume control. The amplitude of the audio frequency is varied and applied to the last block, the audio amplifier."], "jumps": ["P1600", "P1510"]}, {"id": "P1600", "text": ["Now, remember that the first IF amplifier used a biasing signal from the Detector block."], "jumps": ["P1605", "P1510"]}, {"id": "P1605", "text": ["Combining the detector circuit with just Q2 of the IF amplifier shows how AVC operates."], "jumps": ["P1610", "P1600"]}, {"id": "P1610", "text": ["R11 and C6 produce the AVC signal."], "jumps": ["P1620", "P1605"]}, {"id": "P1620", "text": ["The signal is called Automatic Volume Control - AVC. It may also be called Automatic Gain Control - AGC."], "jumps": ["P1630", "P1605"]}, {"id": "P1630", "text": ["AVC keeps the volume, as set by R12, constant no matter how strong or weak the incoming RF signal is at the tuner."], "jumps": ["P1640", "P1605"]}, {"id": "P1640", "text": ["R11 and C6 form a filter. The rectified RF signal is changed to negative DC level, and is applied to the bottom of R5."], "jumps": ["P1645", "P1605"]}, {"id": "P1645", "text": ["The amount of the negative AVC signal changes the positive bias voltage applied to the base of Q2."], "jumps": ["P1650", "P1605"]}, {"id": "P1650", "text": ["For example, a strong incoming station produces a large input signal to the detector. This produces a large negative AVC voltage."], "jumps": ["P1660", "P1605"]}, {"id": "P1660", "text": ["A large negative AVC voltage reduces the gain of the 1st IF amplifier by opposing the forward bias. Note that Q2 is a NPN transistor."], "jumps": ["P1670", "P1605"]}, {"id": "P1670", "text": ["A weak incoming station produces a small input signal to the detector. This produces a small negative AVC voltage."], "jumps": ["P1680", "P1605"]}, {"id": "P1680", "text": ["A small negative AVC voltage does not reduce the gain of Q2 as much."], "jumps": ["P1685", "P1605"]}, {"id": "P1685", "text": ["If the incoming signal strength varies, the AVC voltage varies, keeping the gain or volume constant."], "jumps": ["P1690", "P1605"]}, {"id": "P1690", "text": ["The Detector circuit recovers the intelligence and provides AVC."], "jumps": ["P1700", "P1605"]}, {"id": "P1700", "text": ["What is the purpose of AVC?", "What is the purpose of AVC? typed.........................."], "jumps": ["P1690"]}, {"id": "P1701", "text": [], "jumps": []}, {"id": "P1702", "text": ["Remember, AVC stands for automatic volume control.", "Remember, AVC stands for automatic volume control.........."], "jumps": []}, {"id": "P1710", "text": ["The last block is the Audio amplifier.", "The last block is the Audio amplifier......................"], "jumps": ["P1720", "P1700"]}, {"id": "P1720", "text": ["Recall that the audio amplifier increases the power of the audio signal to drive a speaker.", "This circuit uses two common emitter amplifiers and a push-pull amplifier as the final driver. More stages may be used."], "jumps": ["P1730", "P1710", "P1740"]}, {"id": "P1740", "text": ["Q4 and Q5 are typical common emitter amplifiers that use capacitive coupling and combination biasing. They are biased class A."], "jumps": ["P1750", "P1730"]}, {"id": "P1750", "text": ["Q6 and Q7 is the push-pull amplifier in the common emitter configuration. Q6 and Q7 are biased class B."], "jumps": ["P1760", "P1730"]}, {"id": "P1760", "text": ["Since both Q6 and Q7 are NPN transistors, T6 is center tapped to supply two signals 180 degrees out of phase."], "jumps": ["P1770", "P1730"]}, {"id": "P1770", "text": ["One signal is applied to the base of Q6 and the other is applied to the base of Q7. This produces push-pull operation."], "jumps": ["P1780", "P1730"]}, {"id": "P1780", "text": ["The outputs of Q6 and Q7 collectors are combined in T7 to produce a complete audio signal."], "jumps": ["P1785", "P1730"]}, {"id": "P1785", "text": ["The AF amp amplifies the detected audio to drive the speaker."], "jumps": ["P1790", "P1730"]}, {"id": "P1790", "text": ["The circuits in an AM receiver change RF signals to audio signals that you can hear."], "jumps": ["P1910", "P1730"]}, {"id": "P1910", "text": ["This completes the information on AM RECEIVER CIRCUITS.", "This completes the information on AM RECEIVER CIRCUITS....."], "jumps": ["P1001", "P1790"]}, {"id": "P1920", "text": ["1.  AM receivers have four functional blocks containing many             circuits.", "2.  The Tuner block has three circuits combined into one. The RF      amplifier, Local Oscillator and mixer.", "1. AM receivers have four functional blocks containing many circuits.", "2. The Tuner block has three circuits combined into one. The RF amplifier, Local Oscillator and mixer."], "jumps": ["P1930", "P1001", "P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The Tuner block selects one RF frequency out of many and           converts it to a 455 kHz IF frequency.", "3. The Tuner block selects one RF frequency out of many and converts it to a 455 kHz IF frequency."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  The IF amplifier block has one or more stages of amplification.      All stages are tuned to 455 kHz.", "4. The IF amplifier block has one or more stages of amplification. All stages are tuned to 455 kHz.."], "jumps": ["P1960", "P1930"]}, {"id": "P1960", "text": ["5.  The Detector block recovers the intelligence audio and                    provides Automatic Volume Control (AVC).", "6.  The AF amp amplifies the audio to a level that can drive a                speaker.", "5. The Detector block recovers the intelligence audio and provides Automatic Volume Control (AVC).", "6. The AF amp amplifies the audio to a level that can drive a speaker."], "jumps": ["P1970", "P1950", "P1999", "P1960"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.nu."], "jumps": ["P1001", "P1970"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["The purpose of this experiment is to demonstrate the normal operation of an AM receiver."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["The circuits for the AM receiver are contained on three PC cards, PC130-38, PC130-39 and PC130-40.", "Pick up the PC130-38 card. This card is the Tuner. It contains the RF amplifier, Local Oscillator and Mixer (converter)."], "jumps": ["P2050", "P2020", "P2060", "P2040"]}, {"id": "P2060", "text": ["Look at C1A and C1B on the card. This is the ganged tuning capacitor. It tunes in the RF frequency and the local oscillator frequency."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["The capacitor uses air for a dielectric. The capacitors are varied by changing the plate area. Rotate the knob and observe the action."], "jumps": ["P2080", "P2050"]}, {"id": "P2080", "text": ["Notice on the schematic the capacitors in parallel to C1A and C1B. These are trimmer capacitors that adjust the overall tuning range."], "jumps": ["P2090", "P2050"]}, {"id": "P2090", "text": ["Look on the card for two screws (by the letters C1A and C1B). These screws vary the trimmer capacitors. DO NOT ADJUST THE TRIMMER CAPACITORS!"], "jumps": ["P2100", "P2050"]}, {"id": "P2100", "text": ["Certain components of cards 38, 39 and 40 are variable and are used to align the receiver. Changing the value of these components will misalign the receiver and it will not operate correctly.", "Now look at T2 and T3 on the card. These are also variable and should not be adjusted.", "Certain components of cards 38, 39 and 40 are variable and are used to align the receiver. Changing the value of these components will misalign the receiver and it will not operate correctly.....", "ALIGN - Align is the term used to describe the adjustment of variable components to specific values. Alignment ensures the correct operation of the equipment. For example, T3 is aligned to 455 kHz, the IF frequency. T3 is adjusted so that the resonant frequency of the inductor and capacitor is 455 kHz."], "jumps": ["P2110", "P2050", "P2120", "P2100"]}, {"id": "P2120", "text": ["The dotted line around T2 and T3 schematic illustrates shielding, a metal can. This prevents unwanted RF signals from effecting the circuit."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["Look at T1 on the card, this is the antenna. It picks up signals in the AM broadcast band.", "Pick up the PC130-39 card. This card contains the IF amplifiers and Detector."], "jumps": ["P2140", "P2110", "P2150"]}, {"id": "P2150", "text": ["S1 allows a test signal to be injected into the card. The signal is developed by C5. The test signal will not be used in this experiment."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["Also notice that the AVC signal is connected to PIN D. PIN D connects to PC130-38 T3, as shown, and is routed back to the base of Q2.", "T4 and T5 are variable and tuned to 455 kHz. DO NOT ADJUST."], "jumps": ["P2170", "P2140", "P2180", "P2160"]}, {"id": "P2180", "text": ["R12 is the volume control. You may adjust this component.", "Pick up card PC130-40. This card contains the audio amplifiers."], "jumps": ["P2190", "P2170", "P2200"]}, {"id": "P2200", "text": ["T6 and T7 are audio transformers. Notice they are larger than T4 and T5 on PC130-39."], "jumps": ["P2205", "P2190"]}, {"id": "P2205", "text": ["Normally AF components are larger than RF components due to the frequencies involved."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["The output of T7 goes to the speaker located on the Test Console. Let's start the experiment."], "jumps": ["P2220", "P2190"]}, {"id": "P2220", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P2190"]}, {"id": "P2230", "text": ["2.  Carefully place PC130-38 into the Test Console PC1 position. 3.  Carefully place PC130-39 into the Test Console PC2 position.  4.  Carefully place PC130-40 into the Test Console PC3 position.", "2. Carefully place PC130-38 into the Test Console PC1 position. 3. Carefully place PC130-39 into the Test Console PC2 position. 4. Carefully place PC130-40 into the Test Console PC3 position."], "jumps": ["P2220"]}, {"id": "P2240", "text": ["5.  Place PC130-39 S1 to OPR. \n6.  Rotate PC130-39 R12 (volume control) to mid position.", "5. Place PC130-39 S1 to OPR. 6. Rotate PC130-39 R12 (volume control) to mid position..... switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2230"]}, {"id": "P2250", "text": ["7.  Set the Voltmeter Switch to Positive. \n8.  Set the Positive Supply Voltage to 12. The Test Console's                Voltage Meter should indicate 12 volts.", "7. Set the Voltmeter Switch to Positive. 8. Set the Positive Supply Voltage to 12. The Test Console's Voltage Meter should indicate 12 volts."], "jumps": ["P2240"]}, {"id": "P2260", "text": ["9.  Set PC1, PC2 and PC3 DC Power switches to ON.", "9. Set PC1, PC2 and PC3 DC Power switches to ON.0A - Set the PC1 DC Switch to ON...."], "jumps": ["P2250"]}, {"id": "P2270", "text": ["10.  Place the Test Consoles SPKR switch to ON. \n11.  Vary C1 on PC130-38 to tune in a local station. Adjust the                 volume control as needed (PC130-39 R12).", "10. Place the Test Consoles SPKR switch to ON. 11. Vary C1 on PC130-38 to tune in a local station. Adjust the volume control as needed (PC130-39 R12)."], "jumps": ["P2260", "PC130"]}, {"id": "P2280", "text": ["12.  Place the SPKR switch to OFF. You have just completed a              simple method of checking for normal AM receiver operation,        turning power on to see if AM stations can be tuned in.", "12. Place the SPKR switch to OFF. You have just completed a simple method of checking for normal AM receiver operation, turning power on to see if AM stations can be tuned in.."], "jumps": ["P2270"]}, {"id": "P2290", "text": ["However, as an electronic technician, there is more to it than that. To ensure 100% correct operation, a known signal is injected into the receiver and the signal is then checked out in each stage or functional block.", "However, as an electronic technician, there is more to it than that. To ensure 100% correct operation, a known signal is injected into the receiver and the signal is then checked out in each stage or functional block..."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["So, let's use a function generator to produce a modulated RF signal and then look at the signal using an oscilloscope in each functional section of the receiver."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["1.  Connect the Function Generator output to the Test Console            Input Signal BNC.", "1. Connect the Function Generator output to the Test Console Input Signal BNC."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "t .r.l`(zlVclmlFzljlm", "K,EKK71CA;TU9;EKK:/H:ajlEaaaTa :G Eaa9sya9W"], "jumps": []}, {"id": "P10229", "text": ["When the receiver is tuned to 1500 kHz, the local oscillator frequency should be _______cy be?", "455 kHz. choice is d, and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "1955 kHz. choice is d, and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "3455 kHz. choice is d, and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor."], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to _________"], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P13020", "text": ["The purpose of this experiment is to demonstrate the normal operation of an AM receiver."], "jumps": ["P13040", "P2001"]}, {"id": "P13040", "text": ["The circuits for the AM receiver are contained on three PC cards, PC130-38, PC130-39 and PC130-40.", "Pick up the PC130-38 card. This card is the Tuner.  It contains the RF amplifier, Local Oscillator and Mixer (converter).", "Pick up the PC130-38 card. This card is the Tuner. It contains the RF amplifier, Local Oscillator and Mixer (converter)."], "jumps": ["P13050", "P13020", "P13060", "P13040"]}, {"id": "P13060", "text": ["Look at C1A and C1B on the card. This is the ganged tuning capacitor. It tunes in the RF frequency and the local oscillator frequency."], "jumps": ["P13070", "P13050"]}, {"id": "P13070", "text": ["The capacitor uses air for a dielectric. The capacitors are varied by changing the plate area.  Rotate the knob and observe the action.", "The capacitor uses air for a dielectric. The capacitors are varied by changing the plate area. Rotate the knob and observe the action."], "jumps": ["P13080", "P13050"]}, {"id": "P13080", "text": ["Notice on the schematic the capacitors in parallel to C1A and C1B. These are trimmer capacitors that adjust the overall tuning range."], "jumps": ["P13090", "P13050"]}, {"id": "P13090", "text": ["Look on the card for two screws (by the letters C1A and C1B). These screws vary the trimmer capacitors. DO NOT ADJUST THE TRIMMER CAPACITORS!"], "jumps": ["P13100", "P13050"]}, {"id": "P13100", "text": ["Certain components of cards 38, 39 and 40 are variable and are used to align the receiver. Changing the value of these components will misalign the receiver and it will not operate correctly.", "Now look at T2 and T3 on the card. These are also variable and should not be adjusted.", "Certain components of cards 38, 39 and 40 are variable and are used to align the receiver. Changing the value of these components will misalign the receiver and it will not operate correctly.....", "ALIGN - Align is the term used to describe the adjustment of variable components to specific values. Alignment ensures the correct operation of the equipment. For example, T3 is aligned to 455 kHz, the IF frequency. T3 is adjusted so that the resonant frequency of the inductor and capacitor is 455 kHz."], "jumps": ["P13110", "P13050", "P13120", "P13100"]}, {"id": "P13120", "text": ["The dotted line around T2 and T3 schematic illustrates shielding, a metal can. This prevents unwanted RF signals from effecting the circuit."], "jumps": ["P13130", "P13110"]}, {"id": "P13130", "text": ["Look at T1 on the card, this is the antenna. It picks up signals in the AM broadcast band.", "Pick up the PC130-39 card. This card contains the IF amplifiers and Detector."], "jumps": ["P13140", "P13110", "P13150"]}, {"id": "P13150", "text": ["S1 allows a test signal to be injected into the card. The signal is developed by C5. The test signal will not be used in this experiment."], "jumps": ["P13160", "P13140"]}, {"id": "P13160", "text": ["Also notice that the AVC signal is connected to PIN D. PIN D connects to PC130-38 T3, as shown, and is routed back to the base of Q2.", "T4 and T5 are variable and tuned to 455 kHz. DO NOT ADJUST."], "jumps": ["P13170", "P13140", "P13180", "P13160"]}, {"id": "P13180", "text": ["R12 is the volume control. You may adjust this component.", "Pick up card PC130-40. This card contains the audio amplifiers."], "jumps": ["P13190", "P13170", "P13200"]}, {"id": "P13200", "text": ["T6 and T7 are audio transformers. Notice they are larger than T4 and T5 on PC130-39."], "jumps": ["P13205", "P13190"]}, {"id": "P13205", "text": ["Normally AF components are larger than RF components due to the frequencies involved."], "jumps": ["P13210", "P13190"]}, {"id": "P13210", "text": ["The output of T7 goes to the speaker located on the Test Console. Let's start the experiment."], "jumps": ["P13220", "P13190"]}, {"id": "P13220", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P13190"]}, {"id": "P13230", "text": ["2.  Carefully place PC130-38 into the Test Console PC1 position. 3.  Carefully place PC130-39 into the Test Console PC2 position. 4.  Carefully place PC130-40 into the Test Console PC3 position.", "2. Carefully place PC130-38 into the Test Console PC1 position. 3. Carefully place PC130-39 into the Test Console PC2 position. 4. Carefully place PC130-40 into the Test Console PC3 position."], "jumps": ["P13240"]}, {"id": "P13240", "text": ["5.  Place PC130-39 S1 to OPR. \n6.  Rotate PC130-39 R12 (volume control) to mid position.", "5. Place PC130-39 S1 to OPR. 6. Rotate PC130-39 R12 (volume control) to mid position."], "jumps": ["P13250", "P13230"]}, {"id": "P13250", "text": ["7.  Press Enter to set: Positive Supply Voltage - 12", "7. Press Enter to set: Positive Supply Voltage - 12......................."], "jumps": ["P13240"]}, {"id": "P13260", "text": ["8.  Press Enter to set: PC1, PC2 and PC3 DC Power Switches -           ON", "8. Press Enter to set: PC1, PC2 and PC3 DC Power Switches - ONNN.."], "jumps": []}, {"id": "P13270", "text": ["9.  Press Enter to set: Speaker Switch - ON \n10.  Vary C1 on PC130-38 to tune in a local station. Adjust the                 volume control as needed (PC130-39 R12).", "9. Press Enter to set: Speaker Switch - ON 10. Vary C1 on PC130-38 to tune in a local station. Adjust the volume control as needed (PC130-39 R12)."], "jumps": ["PC130"]}, {"id": "P13280", "text": ["11.  Press Enter to set: Speaker Switch - OFF\n       You have just completed a simple method of checking for               normal AM receiver operation, turning power on to see if AM          stations can be tuned in.", "11. Press Enter to set: Speaker Switch - OFF You have just completed a simple method of checking for normal AM receiver operation, turning power on to see if AM stations can be tuned in..."], "jumps": []}, {"id": "P13290", "text": ["However, as an electronic technician, there is more to it than that. To ensure 100% correct operation, a known signal is injected into the receiver and the signal is then checked out in each stage or functional block.", "However, as an electronic technician, there is more to it than that. To ensure 100% correct operation, a known signal is injected into the receiver and the signal is then checked out in each stage or functional block..."], "jumps": ["P13300"]}, {"id": "P13300", "text": ["So, let's use a function generator to produce a modulated let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
