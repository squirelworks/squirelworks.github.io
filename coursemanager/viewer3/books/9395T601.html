mps": []}, {"id": "P10210", "text": ["What is the purpose of all communication systems?", "modulate or multiplex information signals", "send information from one location to another", "change information signals into electrical signals", "change information signals into electromagnetic waves"], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P2999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu..."], "jumps": ["P2001", "P2990"]}, {"id": "P2990", "text": ["9.  Noise quality is measured by the signal to noise ratio, the               larger the number, the less the noise.", "9. Noise quality is measured by the signal to noise ratio, the larger the number, the less the noise."], "jumps": ["P2999", "P2980"]}, {"id": "P2980", "text": ["8.  Thermal noise is produced by the electronic circuits                          themselves.  Random motion of charged particles due to                 temperature changes cause erratic voltage and current                    spikes.", "8. Thermal noise is produced by the electronic circuits themselves. Random motion of charged particles due to temperature changes cause erratic voltage and current spikes."], "jumps": ["P2990", "P2960"]}, {"id": "P2970", "text": ["6.  Atmospheric and interference noise can be reduced or                    eliminated by filters and limiters.", "6. Atmospheric and interference noise can be reduced or eliminated by filters and limiters."], "jumps": ["P2980", "P2960"]}, {"id": "P2960", "text": ["5.  Noise is an unwanted signal that can distort and eliminate the        information signal.", "5. Noise is an unwanted signal that can distort and eliminate the information signal."], "jumps": ["P2970", "P2940"]}, {"id": "P2950", "text": ["4.  The bandwidth of the communication system must be equal           to or greater than the bandwidth of the information signal.", "4. The bandwidth of the communication system must be equal to or greater than the bandwidth of the information signal."], "jumps": ["P2960", "P2940"]}, {"id": "P2940", "text": ["3.  Bandwidth is a range of frequencies.  It limits the amount of            information that can be sent in a communication system.", "3. Bandwidth is a range of frequencies. It limits the amount of information that can be sent in a communication system.", "2 30 - 3,000 Hz ELF Extremely low frequencyy", "3 300 - 3,000 Hz VF Voice frequency", "4 3 - 30 kHz VLF Very low frequency", "5 30 - 300 kHz LF Low frequencyy", "6 300 - 3,000 kHz MF Medium frequency", "7 3,000 - 30,000 MHz HF High frequency", "8 30 - 300 MHz VHF Very high frequency", "9 300 - 3,000 MHz UHF Ultra high frequencyy", "10 3,000 - 30,000 MHz SHF Super high frequency", "11 30,000 - 300,000 MHz EHF Extremely high frequency"], "jumps": ["P2950", "P2930"]}, {"id": "P2930", "text": ["2.  Two basic limitations that are common to all communication           systems are bandwidth and noise.", "1.  Communication systems are limited to transmitting and                    receiving information from the same type of system.", "2. Two basic limitations that are common to all communication systems are bandwidth and noise.", "1. Communication systems are limited to transmitting and receiving information from the same type of system."], "jumps": ["P2940", "P2920", "P2930", "P2001"]}, {"id": "P2910", "text": ["This completes the information on LIMITING FACTORS."], "jumps": ["P2001", "P2360"]}, {"id": "P2360", "text": ["Remember, noise covers up information signals and is a basic limiting factor."], "jumps": ["P2910", "P2350"]}, {"id": "P2352", "text": ["Random voltage and current are produced by noise and are not a noise quality measurement."], "jumps": []}, {"id": "P2351", "text": [], "jumps": []}, {"id": "P2350", "text": ["What term describes the noise quality of a communication system?"], "jumps": ["P2320"]}, {"id": "P2340", "text": ["Most communication systems will list SNR as part of the system parameters."], "jumps": ["P2350", "P2320"]}, {"id": "P2330", "text": ["Two ways to increase SNR is to raise the signal power or decrease the noise power."], "jumps": ["P2340", "P2320"]}, {"id": "P2320", "text": ["SNR is computed by the following formula:", "SNR is computed by the following formula:.................."], "jumps": ["P2330", "P2300"]}, {"id": "P2310", "text": ["The higher the SNR, the less noise that is present."], "jumps": ["P2320", "P2300"]}, {"id": "P2300", "text": ["The amount of noise in a communication system is part of the QUALITY of the system and is called the signal to noise ratio or SNR for short."], "jumps": ["P2310", "P2290"]}, {"id": "P2293", "text": ["Interference is noise produced by other equipment.  For example, a HAM radio operator could interfere with your TV.", "Interference is noise produced by other equipment. For example, a HAM radio operator could interfere with your TV."], "jumps": []}, {"id": "P2292", "text": ["Thermal noise is due to temperature changes causing random motion of charged particles.  A thunder storm may change the temperature of a communication system but, does not directly produce thermal noise.", "Thermal noise is due to temperature changes causing random motion of charged particles. A thunder storm may change the temperature of a communication system but, does not directly produce thermal noise......"], "jumps": []}, {"id": "P2291", "text": [], "jumps": []}, {"id": "P2290", "text": ["What type of noise is due to thunder storms?", "What type of noise is due to thunder storms?..............."], "jumps": ["P2240"]}, {"id": "P2280", "text": ["Thermal noise can only be reduced or eliminated by circuit design."], "jumps": ["P2290", "P2240"]}, {"id": "P2270", "text": ["The random motion of the electrons results in the random generation of voltages or currents.  The random voltages and currents are known as noise which distorts the information signal.", "The random motion of the electrons results in the random generation of voltages or currents. The random voltages and currents are known as noise which distorts the information signal."], "jumps": ["P2280", "P2240"]}, {"id": "P2260", "text": ["At any temperature above absolute zero, charged particles, such as electrons, exhibit random motion."], "jumps": ["P2270", "P2240"]}, {"id": "P2250", "text": ["This noise is due to temperature variations in the circuit as the components heat up and cool down."], "jumps": ["P2260", "P2240"]}, {"id": "P2240", "text": ["Thermal noise however, is caused by the communication systems own circuit components and design."], "jumps": ["P2250", "P2220"]}, {"id": "P2230", "text": ["Environmental noise and interference from other electronic equipment can usually be eliminated or reduced by filters and limiters."], "jumps": ["P2240", "P2220"]}, {"id": "P2220", "text": ["There are many types of noise that effect communication systems such as: atmospheric noise, noise from other electronic equipment (interference) and thermal noise."], "jumps": ["P2230", "P2210"]}, {"id": "P2210", "text": ["Simply put, if the noise signal is greater than the information signal, the information signal is lost."], "jumps": ["P2220", "P2190"]}, {"id": "P2200", "text": ["Noise is an unwanted signal in communication systems."], "jumps": ["P2210", "P2190"]}, {"id": "P2190", "text": ["Now let's look at the other limiting factor in communication systems."], "jumps": ["P2200", "P2170"]}, {"id": "P2172", "text": ["The bandwidth of a communication system must be equal to or greater than the frequency range of the information signal for the information to be passed.", "The bandwidth of a communication system must be equal to or greater than the frequency range of the information signal for the information to be passed.. be passed."], "jumps": []}, {"id": "P2171", "text": [], "jumps": []}, {"id": "P2170", "text": ["Would a communication system pass a 3 kHz signal if the bandwidth of the system was 1 kHz?"], "jumps": ["P2120"]}, {"id": "P2160", "text": ["If a transmitted signal is not within the receivers bandwidth, the information signal is severely distorted or attenuated and the        information is lost.", "If a transmitted signal is not within the receivers bandwidth, the information signal is severely distorted or attenuated and the information is lost."], "jumps": ["P2170", "P2120"]}, {"id": "P2150", "text": ["Although the frequency range of the human voice is from 100 Hz to 7500 Hz, it was determined that a bandwidth of 300 Hz to 3400 Hz is sufficient for commercial speech."], "jumps": ["P2160", "P2120"]}, {"id": "P2140", "text": ["Notice that Band 3 is used for voice frequency.  This is the bandwidth established by the FCC for telephones.", "Notice that Band 3 is used for voice frequency. This is the bandwidth established by the FCC for telephones.", "3 300 - 3,000 Hz VF Voice frequency"], "jumps": ["P2150", "P2120"]}, {"id": "P2130", "text": ["This informs engineers of bandwidth limitations for different types of communication systems."], "jumps": ["P2140", "P2120"]}, {"id": "P2120", "text": ["The FCC (Federal Communication Commission) has also set guidelines and limitations to frequency bands.", "2 30 - 3,000 Hz ELF Extremely low frequencyy", "3 300 - 3,000 Hz VF Voice frequencyy", "4 3 - 30 kHz VLF Very low frequency", "5 30 - 300 kHz LF Low frequencyy", "6 300 - 3,000 kHz MF Medium frequency", "7 3,000 - 30,000 MHz HF High frequency", "8 30 - 300 MHz VHF Very high frequency", "9 300 - 3,000 MHz UHF Ultra high frequencyy", "10 3,000 - 30,000 MHz SHF Super high frequency", "11 30,000 - 300,000 MHz EHF Extremely high frequency", "12 300,000 - 3,000,000 MHzzzz"], "jumps": ["P2130", "P2110"]}, {"id": "P2113", "text": ["Bandwidth is a range of frequencies and power does not limit the range."], "jumps": []}, {"id": "P2112", "text": ["Bandwidth is a range of signal frequencies.  Amplitude is the magnitude of a signals variations usually measured in voltage as, peak value, peak-to-peak value or RMS.", "Bandwidth is a range of signal frequencies. Amplitude is the magnitude of a signals variations usually measured in voltage as, peak value, peak-to-peak value or RMS...."], "jumps": []}, {"id": "P2111", "text": [], "jumps": []}, {"id": "P2110", "text": ["How is bandwidth a limitation in a communication system?", "How is bandwidth a limitation in a communication system?..."], "jumps": ["P2100"]}, {"id": "P2100", "text": ["Due to reactive component limitations it is not possible to have a system that covers a frequency range of 300 Hz to 1600 kHz."], "jumps": ["P2110", "P2070"]}, {"id": "P2090", "text": ["This is why you can not receive AM radio signals on a portable telephone.  The AM radio has a frequency range of 950 kHz to 1600 kHz and the telephone frequency range is from 300 Hz to 3400 Hz.", "This is why you can not receive AM radio signals on a portable telephone. The AM radio has a frequency range of 950 kHz to 1600 kHz and the telephone frequency range is from 300 Hz to 3400 Hz."], "jumps": ["P2100", "P2070"]}, {"id": "P2080", "text": ["The reactance or frequency cut off points of these components limit the range of frequencies that pass through communication circuits.", "The reactive components used in communication circuits determine the frequency range or bandwidth of the communication system.", "Since bandwidth is a range of frequencies, the bandwidth of a system must be equal to or greater than the bandwidth of the information to be transmitted and received."], "jumps": ["P2090", "P2070", "P2080", "P2060", "P2050"]}, {"id": "P2050", "text": ["In communication systems, information is sent over transmission medium in frequencies."], "jumps": ["P2060", "P2030"]}, {"id": "P2040", "text": ["Let's look at bandwidth as a limiting factor in communication systems first."], "jumps": ["P2050", "P2030"]}, {"id": "P2030", "text": ["Environmental conditions such as: lightning, power lines, trees, mountains and fog can limit a communication systems effectiveness by causing noise, which in turn causes signal distortion."], "jumps": ["P2040", "P2015"]}, {"id": "P2020", "text": ["Components used in communication circuits set up bandwidths to limit the frequency range of the system.  This separates different types of communication systems from each other.", "Communication systems are limited by the components used in their circuits and their environment.", "Components used in communication circuits set up bandwidths to limit the frequency range of the system. This separates different types of communication systems from each other."], "jumps": ["P2030", "P2015", "P2020", "P2001"]}, {"id": "P2001", "text": ["LIMITING FACTORS IN COMMUNICATION SYSTEMS", "LIMITING FACTORS SYSTEMS"], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu..."], "jumps": ["P1001", "P1986"]}, {"id": "P1990", "text": ["10.  Common circuits are amplifiers, wave shapers,                                    demodulators, demultiplexers and output transducers.", "10. Common circuits are amplifiers, wave shapers, demodulators, demultiplexers and output transducers."], "jumps": ["P1999", "P1986"]}, {"id": "P1986", "text": ["9.  Receivers consist of compensating, signal processing and            output circuits.", "9. Receivers consist of compensating, signal processing and output circuits."], "jumps": ["P1990", "P1970"]}, {"id": "P1980", "text": ["8.  Receivers compensate for attenuation, distortion and noise           along with converting signals back to information signals.", "8. Receivers compensate for attenuation, distortion and noise along with converting signals back to information signals."], "jumps": ["P1986", "P1970"]}, {"id": "P1976", "text": ["7.  Common mediums are twisted wires, coaxial cables, radio               waves, microwaves, optical fibers and lasers.", "7. Common mediums are twisted wires, coaxial cables, radio waves, microwaves, optical fibers and lasers."], "jumps": ["P1980", "P1970"]}, {"id": "P1970", "text": ["6.  The transmission medium bridges the distance between                  transmitter and receiver.", "6. The transmission medium bridges the distance between transmitter and receiver."], "jumps": ["P1976", "P1950"]}, {"id": "P1960", "text": ["5.  Common circuits are input transducers (microphones),                    modulators and multiplexers.", "5. Common circuits are input transducers (microphones), modulators and multiplexers."], "jumps": ["P1970", "P1950"]}, {"id": "P1950", "text": ["4.  Transmitters consist of input and signal processing circuits.", "4. Transmitters consist of input and signal processing circuits.."], "jumps": ["P1960", "P1930"]}, {"id": "P1940", "text": ["3.  Transmitters convert input information into a form that can be        sent over the transmission medium.", "3. Transmitters convert input information into a form that can be sent over the transmission medium."], "jumps": ["P1950", "P1930"]}, {"id": "P1930", "text": ["2.  All communication systems have three major elements.", "1.  Communication systems send information from one location          to another.", "2. All communication systems have three major elements....", "1. Communication systems send information from one location to another."], "jumps": ["P1940", "P1920", "P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on COMMUNICATION SYSTEMS.", "This completes the information on COMMUNICATION SYSTEMS...."], "jumps": ["P1001", "P1760"]}, {"id": "P1760", "text": ["Remember, receivers compensate for losses and get the information signal ready to be used."], "jumps": ["P1910", "P1750"]}, {"id": "P1753", "text": ["Walkie-talkies use one device as an input and output transducer. In other words, one device for a microphone and speaker."], "jumps": []}, {"id": "P1752", "text": ["A microphone is used in transmitter input circuits to change voice signals to electrical signals, it is an input transducer."], "jumps": []}, {"id": "P1751", "text": [], "jumps": []}, {"id": "P1750", "text": ["What is another name for an output transducer used in telephone systems?"], "jumps": ["P1740"]}, {"id": "P1743", "text": ["Output circuits set or change signals so that the information can be used, they do not demodulate signals."], "jumps": []}, {"id": "P1742", "text": ["Compensation circuits make up for attenuation, distortion and noise.  They do not demodulate a modulated signal.", "Compensation circuits make up for attenuation, distortion and noise. They do not demodulate a modulated signal.."], "jumps": []}, {"id": "P1741", "text": [], "jumps": []}, {"id": "P1740", "text": ["In which part of a receiver would demodulation take place?", "In which part of a receiver would demodulation take place?."], "jumps": ["P1690"]}, {"id": "P1730", "text": ["The attraction and repulsion of the coil moves the paper cone producing sound waves."], "jumps": ["P1740", "P1690"]}, {"id": "P1720", "text": ["The coil then produces a magnetic field which reacts with the permanent magnet producing attraction and repulsion."], "jumps": ["P1730", "P1690"]}, {"id": "P1710", "text": ["For speaker operation, the information signal is applied to the coil."], "jumps": ["P1720", "P1690"]}, {"id": "P1700", "text": ["And yes, it looks just like a dynamic microphone.  In fact, dynamic devices can be used as both a microphone and speaker, a walkie-talkie is a good example.", "And yes, it looks just like a dynamic microphone. In fact, dynamic devices can be used as both a microphone and speaker, a walkie-talkie is a good example."], "jumps": ["P1710", "P1690"]}, {"id": "P1690", "text": ["The transducer used in output circuits for telephone systems is called a SPEAKER."], "jumps": ["P1700", "P1630"]}, {"id": "P1680", "text": ["The device that changes electrical signals into voice or music signals is called an OUTPUT TRANSDUCER."], "jumps": ["P1690", "P1630"]}, {"id": "P1670", "text": ["The electrical signals must be changed to voice or music signals."], "jumps": ["P1680", "P1630"]}, {"id": "P1660", "text": ["On the other hand, if the output information must be in the form of voice or music signals, as in telephones and radios, a lot takes place."], "jumps": ["P1670", "P1630"]}, {"id": "P1650", "text": ["Amplifiers, limiters and filters are common circuits used in output circuits for electrical signals."], "jumps": ["P1660", "P1630"]}, {"id": "P1640", "text": ["If the information output is in the form of electrical signals, such as computer signals or video signals to a TV picture tube, very little takes place in the output circuits."], "jumps": ["P1650", "P1630"]}, {"id": "P1630", "text": ["The output circuits set up or change the electrical signal so the information can be used."], "jumps": ["P1640", "P1620"]}, {"id": "P1620", "text": ["If multiplexing was used, the various information signals are separated into individual signals.", "I N F O R M A T I O N 1", "I N F O R M A T I O N 2", "I N F O R M A T I O N 3"], "jumps": ["P1630", "P1610"]}, {"id": "P1610", "text": ["If modulation was used, the information signal is separated from the carrier signal and the carrier signal grounded, leaving the information signal."], "jumps": ["P1620", "P1540"]}, {"id": "P1600", "text": ["That is, if the transmitted signal was modulated or multiplexed, the signal must be demodulated or demultiplexed."], "jumps": ["P1610", "P1540"]}, {"id": "P1590", "text": ["The signal processing circuits change the transmitted signal back to an information signal."], "jumps": ["P1600", "P1540"]}, {"id": "P1580", "text": ["The types of circuits used depend on the transmission medium and the type of signal received."], "jumps": ["P1590", "P1540"]}, {"id": "P1570", "text": ["The compensating circuits consist of amplifiers, wave shapers and limiters."], "jumps": ["P1580", "P1540"]}, {"id": "P1560", "text": ["Receivers basically contain three types of circuits: compensating circuits, signal processing circuits and output circuits."], "jumps": ["P1570", "P1540"]}, {"id": "P1550", "text": ["The receiver converts the electrical signals or electromagnetic waves back into usable information, recovering the transmitted    information.", "The receiver converts the electrical signals or electromagnetic waves back into usable information, recovering the transmitted information."], "jumps": ["P1560", "P1540"]}, {"id": "P1540", "text": ["The primary function of the receiver is to compensate for attenuation, distortion and noise from the transmission medium."], "jumps": ["P1550", "P1520"]}, {"id": "P1530", "text": ["The last element in a communication system is the receiver."], "jumps": ["P1540", "P1520"]}, {"id": "P1520", "text": ["Remember, the transmission medium bridges the gap between transmitter and receiver."], "jumps": ["P1530", "P1510"]}, {"id": "P1513", "text": ["Noise is unwanted signals.  Changing a square wave to narrow pulses is changing a signals shape.", "Noise is unwanted signals. Changing a square wave to narrow pulses is changing a signals shape."], "jumps": []}, {"id": "P1512", "text": ["Attenuation is a loss that decreases the amplitude or power of a signal.  Changing a square wave to a narrow pulse changes a signals shape.", "Attenuation is a loss that decreases the amplitude or power of a signal. Changing a square wave to a narrow pulse changes a signals shape.."], "jumps": []}, {"id": "P1511", "text": [], "jumps": []}, {"id": "P1510", "text": ["If the transmitted signal is a square wave and the output of the transmission medium to the receiver is narrow pulses what type of loss occurred?"], "jumps": ["P1500"]}, {"id": "P1503", "text": ["Coax is a type of wire cable, air is not used.", "Coax is a type of wire cable, air is not used.............."], "jumps": []}, {"id": "P1502", "text": ["Fiberoptics are cables that allow light to travel from one end to another, air is not the medium."], "jumps": []}, {"id": "P1501", "text": [], "jumps": []}, {"id": "P1500", "text": ["Pick the type of transmission medium that uses air.", "Pick the type of transmission medium that uses air........."], "jumps": ["P1490"]}, {"id": "P1490", "text": ["Due to signal processing, an FM radio is less affected by a car's ignition than an AM radio.", "For example, if air is the transmission medium, lightning storms can introduce noise and distortion."], "jumps": ["P1500", "P1480", "P1490", "P1460"]}, {"id": "P1470", "text": ["The amount of losses depend on the transmission medium used and the type of signal processing used in the transmitter."], "jumps": ["P1480", "P1460"]}, {"id": "P1460", "text": ["The losses are due to:", "The losses are due to:TTENUATION - reduction in signal amplitude or power. DISTORTION - changing of the signal's shape. NOISE - unwanted signals.", "ATTENUATION - reduction in signal amplitude or power. DISTORTION - changing of the signal's shape. NOISE - unwanted signals."], "jumps": ["P1470", "P1430"]}, {"id": "P1450", "text": ["Normally, there is no signal processing in transmission mediums but, each type of medium creates some signal loss."], "jumps": ["P1460", "P1430"]}, {"id": "P1430", "text": ["Some types of transmission medium are; twisted wires, coaxial cables, optical fibers and air."], "jumps": ["P1450", "P1400"]}, {"id": "P1420", "text": ["The transmission medium bridges the distance between the transmitter and receiver."], "jumps": ["P1430", "P1400"]}, {"id": "P1410", "text": ["The next element in a communication system is the transmission medium."], "jumps": ["P1420", "P1400"]}, {"id": "P1400", "text": ["Remember, the transmitter gets the information ready to send over the transmission medium."], "jumps": ["P1410", "P1390"]}, {"id": "P1393", "text": ["Amplifying increases the voltage or current level of a signal, it is not used to combine signals."], "jumps": []}, {"id": "P1392", "text": ["Modulation is the method of combining two signals, the information signal and carrier signal, not combining two or more information signals."], "jumps": []}, {"id": "P1391", "text": [], "jumps": []}, {"id": "P1390", "text": ["Which method of signal processing combines two or more information signals?"], "jumps": ["P1330"]}, {"id": "P1380", "text": ["By combining each separate frequency into one, all information signals are transmitted on a single frequency."], "jumps": ["P1390", "P1330"]}, {"id": "P1370", "text": ["FDM or Frequency Division Multiplexing sends each information signal on a separate frequency."], "jumps": ["P1380", "P1330"]}, {"id": "P1360", "text": ["By cycling through each information signal quickly, no information is lost."], "jumps": ["P1370", "P1330"]}, {"id": "P1350", "text": ["TDM or Time Division Multiplexing sends one information signal for a short period of time.  Then another information signal is sent.", "TDM or Time Division Multiplexing sends one information signal for a short period of time. Then another information signal is sent."], "jumps": ["P1360", "P1330"]}, {"id": "P1340", "text": ["Multiplexing allows many information signals to use one wire, channel or frequency in the transmission medium, saving space  and hardware.", "Multiplexing allows many information signals to use one wire, channel or frequency in the transmission medium, saving space and hardware."], "jumps": ["P1350", "P1330"]}, {"id": "P1330", "text": ["Multiplexing is a method of combining two or more information signals into one.", "I N F O R M A T I O N 1", "I N F O R M A T I O N 2", "I N F O R M A T I O N 3"], "jumps": ["P1340", "P1280"]}, {"id": "P1320", "text": ["In PCM or pulse code modulation, such as in computer modems, the information signal is changed to digital pulses."], "jumps": ["P1330", "P1280"]}, {"id": "P1310", "text": ["In FM modulation (Frequency Modulation) the amplitude of the information signal changes the frequency of the carrier signal."], "jumps": ["P1320", "P1280"]}, {"id": "P1300", "text": ["In AM modulation (Amplitude Modulation) the amplitude of the information signal changes the amplitude of the carrier signal."], "jumps": ["P1310", "P1280"]}, {"id": "P1290", "text": ["Modulation combines two different signals, the information signal and a CARRIER SIGNAL, which will carry the information."], "jumps": ["P1300", "P1280"]}, {"id": "P1280", "text": ["Modulation is a method that allows information signals to be transmitted using air as the transmission medium."], "jumps": ["P1290", "P1270"]}, {"id": "P1270", "text": ["Since modulator and multiplexer circuits are commonly used in telephone systems let's go over some basic principles."], "jumps": ["P1280", "P1260"]}, {"id": "P1263", "text": ["The input circuits of the transmitter are used to change the original information signal to electrical signals for signal processing."], "jumps": []}, {"id": "P1262", "text": ["Transducers change sound signals into electrical signals and they are located in the input circuits of the transmitter element."], "jumps": []}, {"id": "P1261", "text": [], "jumps": []}, {"id": "P1260", "text": ["What is the purpose of signal processing circuits in the transmitter element of a communication system?", "Change voice signals into electrical signals", "Input information signals into the transmitter", "Get the information signal ready for transmission"], "jumps": ["P1220"]}, {"id": "P1240", "text": ["Signal processing circuits can be as simple as an amplifier for transmission through wire cables or as complex as modulators    and multiplexers for transmission through the air.", "Signal processing circuits can be as simple as an amplifier for transmission through wire cables or as complex as modulators and multiplexers for transmission through the air."], "jumps": ["P1260", "P1220"]}, {"id": "P1230", "text": ["The signals are conditioned by the signal processor for effective, efficient and reliable transmission."], "jumps": ["P1240", "P1220"]}, {"id": "P1220", "text": ["Once the input information is in the form of electrical signals, the signal processing circuits take over."], "jumps": ["P1230", "P1210"]}, {"id": "P1213", "text": ["A carbon microphone uses carbon granules.", "A carbon microphone uses carbon granules..................."], "jumps": []}, {"id": "P1212", "text": ["A piezoelectric microphone uses a crystal.", "A piezoelectric microphone uses a crystal.................."], "jumps": []}, {"id": "P1211", "text": [], "jumps": []}, {"id": "P1210", "text": ["What type of input transducer uses a magnet?", "What type of input transducer uses a magnet?..............."], "jumps": ["P1160"]}, {"id": "P1200", "text": ["In the carbon microphone, the moving cone changes the density of carbon granules which changes the resistance of the circuit producing electrical signals."], "jumps": ["P1210", "P1160"]}, {"id": "P1190", "text": ["In the piezoelectric microphone, the moving cone moves a lever that applies pressure to a crystal producing electrical signals."], "jumps": ["P1200", "P1160"]}, {"id": "P1180", "text": ["In the dynamic microphone, the moving cone moves a coil in a magnetic field producing electrical signals."], "jumps": ["P1190", "P1160"]}, {"id": "P1170", "text": ["In all three microphones, sound waves move a paper cone back and forth."], "jumps": ["P1180", "P1160"]}, {"id": "P1160", "text": ["The transducer used in the input circuits for telephone systems is called a MICROPHONE."], "jumps": ["P1170", "P1152"]}, {"id": "P1155", "text": ["TRANSDUCER - A transducer is any device that changes one type of energy into another. In radio equipment, transducers change sound vibrations to electrical signals (microphones) for transmission purposes and change electrical signals to sound (speakers) during reception."], "jumps": []}, {"id": "P1152", "text": ["A device that changes voice or music signals into electrical signals is called an INPUT  TRANSDUCER.", "A device that changes voice or music signals into electrical signals is called an INPUT TRANSDUCER."], "jumps": ["P1160", "P1080"]}, {"id": "P1150", "text": ["A device that changes voice or music signals into electrical signals is called an INPUT  TRANSDUCER .", "A device that changes voice or music signals into electrical signals is called an INPUT TRANSDUCER ."], "jumps": ["P1160", "P1080"]}, {"id": "P1140", "text": ["The voice or music signals must be changed to electrical signals."], "jumps": ["P1150", "P1080"]}, {"id": "P1130", "text": ["On the other hand, if the information input is voice or music, as in telephones and radios, a lot takes place."], "jumps": ["P1140", "P1080"]}, {"id": "P1120", "text": ["Amplifiers, limiters and filters are common circuits used in input circuits for electrical signals."], "jumps": ["P1130", "P1080"]}, {"id": "P1110", "text": ["If the information input is in the form of electrical signals such as computer signals or video signals from a camera, very little     conversion takes place in the input circuits.", "If the information input is in the form of electrical signals such as computer signals or video signals from a camera, very little conversion takes place in the input circuits."], "jumps": ["P1120", "P1080"]}, {"id": "P1100", "text": ["The input circuits set up or change the original input information so signal processing can take place."], "jumps": ["P1110", "P1080"]}, {"id": "P1090", "text": ["Transmitters basically contain two types of circuits, input circuits and signal processing circuits."], "jumps": ["P1100", "P1080"]}, {"id": "P1080", "text": ["The primary function of the transmitter is to convert input information into a form that can be sent over the transmission      medium.", "The primary function of the transmitter is to convert input information into a form that can be sent over the transmission medium."], "jumps": ["P1090", "P1070"]}, {"id": "P1070", "text": ["Now, let's look closer at the three elements in a communication system, starting off with the transmitter."], "jumps": ["P1080", "P1060"]}, {"id": "P1063", "text": ["A satellite is not a form of transmission medium.  It is usually used as a transmission relay to boost and/or re-direct signals       that have already been broadcast.", "A satellite is not a form of transmission medium. It is usually used as a transmission relay to boost and/or re-direct signals that have already been broadcast.."], "jumps": []}, {"id": "P1062", "text": ["To transmit radio frequencies through wires to cars would require that a wire be connected between the radio transmitter site and the cars receiver.", "To transmit radio frequencies through wires to cars would require that a wire be connected between the radio transmitter site and the cars receiver...."], "jumps": []}, {"id": "P1061", "text": [], "jumps": []}, {"id": "P1060", "text": ["Which type of transmission medium is used to broadcast AM/FM radio signals to car radios?"], "jumps": ["P1050"]}, {"id": "P1053", "text": ["The transmission medium is the bridge between a transmitter and receiver.  A car's radio is not the transmission medium.", "The transmission medium is the bridge between a transmitter and receiver. A car's radio is not the transmission medium."], "jumps": []}, {"id": "P1052", "text": ["You may have a transmitter in your car, such as a HAM Radio, CB Set or cellular phone but, normally the AM/FM/STEREO radio in your car is not a transmitter.", "You may have a transmitter in your car, such as a HAM Radio, CB Set or cellular phone but, normally the AM/FM/STEREO radio in your car is not a transmitter....."], "jumps": []}, {"id": "P1051", "text": [], "jumps": []}, {"id": "P1050", "text": ["What element of a communication system is the radio in a car?"], "jumps": ["P1020"]}, {"id": "P1040", "text": ["The transmission medium represents the bridge between transmitter and receiver."], "jumps": ["P1050", "P1020"]}, {"id": "P1030", "text": ["The transmitter and receiver elements represent circuits that change and process information."], "jumps": ["P1040", "P1020"]}, {"id": "P1020", "text": ["Communication systems, including telephone systems, have three major elements.", "The purpose of communication systems is to send information, of any type, from one location to another."], "jumps": ["P1030", "P1015", "P1020", "P1001"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": ["2. Limiting Factors ommunication Systems"], "jumps": []}, {"id": "P470", "text": ["Let's begin the lesson on INTRODUCTION TO COMMUNICATION SYSTEMS............."], "jumps": ["P450"]}, {"id": "P460", "text": ["Electronic Communications include: the telephone system, radio, TV, telegraphs, Satellite Communications and many more systems.", "But, to understand the principles of telephone systems, an introduction to electronic communications is required."], "jumps": ["P470", "P450", "P460", "P430"]}, {"id": "P440", "text": ["By studying how these individual circuits are combined into a telephone system, you will be able to understand how sounds      travel through the telephone system.", "By studying how these individual circuits are combined into a telephone system, you will be able to understand how sounds travel through the telephone system."], "jumps": ["P450", "P430"]}, {"id": "P430", "text": ["You will see that telephone systems are mostly comprised of circuits you have already learned."], "jumps": ["P440", "P400"]}, {"id": "P420", "text": ["In this course we will look at the electronic circuits involved in telephone systems and how they operate."], "jumps": ["P430", "P400"]}, {"id": "P410", "text": ["If you are like most people you are not sure how your voice travels from one point to another.", "You probably use \"the phone\" almost everyday."], "jumps": ["P420", "P400", "P410", "P300"]}, {"id": "P300", "text": [], "jumps": []}, {"id": "P100", "text": ["2. Limiting Factors in Communication Systems", "w Describe bandwidth as a limiting factor in communication systems. w Describe noise as a limiting factor in communication systems.", "w Define the basic elements that make up communication systems. w Describe common circuits and components that are contained in the elements of communication systems."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: INTRODUCTION TO COMMUNICATION SYSTEMSf asdf sadf"], "jumps": []}, {"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
