8<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Understand antenna characteristics. w Explain the propagation of energy in antennas. ic construction and theory of operation of microwave lenses. of microwave lenses. of microwave lenses."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about the characteristics and propagation of energy in antennas..."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Antennas are devices used to radiate electromagnetic energy into space and pick up energy from space."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Every Radio Frequency (RF) device requires an antenna to radiate and receive electromagnetic energy. The wavelength, transmit frequency and polarization of the RF will determine the dimensions of each antenna."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["However, because of the short wavelength of microwaves, microwave antennas can be more readily designed for high gains and directivity."], "jumps": ["P410", "P440"]}, {"id": "P440", "text": ["Let's begin the lesson on ANTENNAS.ITLE..................................."], "jumps": ["P410"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["An Antenna may be defined as a conductor or group of conductors used for radiating electromagnetic energy transferred by the transmission line into space - transmitting.."], "jumps": []}, {"id": "P1030", "text": ["They also collect and pass electromagnetic energy back through the transmission line from space - receiving."], "jumps": []}, {"id": "P1040", "text": ["Most practical transmitting antennas are divided into two basic classifications, Hertz Antennas (half-wave) and Marconi (quarter-wave) Antennas."], "jumps": []}, {"id": "P1050", "text": ["Hertz antennas are generally installed some distance above the ground and are positioned to radiate either vertically or horizontally. Marconi antennas operate with one end grounded and are mounted perpendicular to the earth or a surface acting as a ground..."], "jumps": []}, {"id": "P1060", "text": ["The Hertz antenna, also referred to as a dipole, is the basis for some of the more complex communications antenna systems.", "L)))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))) k", ";'''';'' #'A ;' #']]'J A# '# '# ' #]]'# 'Y"], "jumps": []}, {"id": "P1070", "text": ["using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "All antennas used to radiate and receive electromagnetic energy have the same basic characteristics. Let's review these characteristics one at a time."], "jumps": []}, {"id": "P1080", "text": ["One method to determine the efficiency of an antenna is to measure its ability to couple or radiate energy into space."], "jumps": []}, {"id": "P1090", "text": ["This is called POWER GAIN or POWER RATIO..................."], "jumps": []}, {"id": "P1100", "text": ["The power gain of an antenna is the ratio of its radiated power to that of a reference antenna using the same input signal."], "jumps": []}, {"id": "P1110", "text": ["For example, if the radiated power of an antenna is twice that of the reference antenna, the antenna has a power gain of 2."], "jumps": []}, {"id": "P1120", "text": ["The efficiency of an entire transmitting or receiving system depends largely on impedance matching between the waveguide, antenna and space. If the system is efficient, all the energy is transferred out of the system and into free space."], "jumps": []}, {"id": "P1130", "text": ["If it is not efficient, then some of the energy is reflected back up the waveguide. This energy is called a standing wave. Measuring the standing wave ratio gives the efficiency of the entire transmitting or receiving system...", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter."], "jumps": []}, {"id": "P1140", "text": ["The Voltage Standing Wave Ratio (VSWR) is obtained by comparing the voltage levels of the transmitted wave to the levels of the reflected wave at some particular point. The maximum reading divided by the minimum reading is the VSWR. The Current Standing Wave Ratio (ISWR) is handled in the same way.....", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter."], "jumps": []}, {"id": "P1145", "text": ["using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "The Directivity of an antenna or array is a measure of the antenna's ability to focus the energy in one or more specific directions."], "jumps": []}, {"id": "P1150", "text": ["An OMNIDIRECTIONAL antenna radiates and receives RF energy in all directions at one time. These antennas have low directivity."], "jumps": []}, {"id": "P1160", "text": ["The elements in an array can be arranged to change the radiation pattern and distribute the energy more evenly in all directions."], "jumps": []}, {"id": "P1170", "text": ["The elements of an array can also be arranged so that the radiated energy is focused in one direction. The elements can be considered as a group of antennas fed from a common source..."], "jumps": []}, {"id": "P1180", "text": ["Microwave and RADAR antennas are directional. They have high directivity and concentrate electromagnetic energy in one direction. NOTE: (Directional Antenna)"], "jumps": []}, {"id": "P1190", "text": ["Directional antennas increase power gain because the power is concentrated in a smaller space. Less power is required to cover the same distance."], "jumps": []}, {"id": "P1200", "text": ["using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "Reciprocity is the ability of an antenna to act as a transmitting or receiving antenna."], "jumps": []}, {"id": "P1210", "text": ["Antenna reciprocity is possible because the antenna characteristics are essentially the same regardless of whether the antenna is transmitting or receiving energy."], "jumps": ["PG", "PV", "P", "PP"]}, {"id": "P1220", "text": ["Reciprocity allows most communication and RADAR systems to use one antenna for both receiving and transmitting. eceiving energy."], "jumps": []}, {"id": "P1230", "text": ["The efficiency of an ANTENNA is expressed in what terms?..."], "jumps": ["P1210"]}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1232", "text": ["The standing wave ratio gives the efficiency of the entire transmitting or receiving system.", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter."], "jumps": []}, {"id": "P1233", "text": ["Eout over Ein is the measure of voltage gain, not efficiency."], "jumps": []}, {"id": "P1240", "text": ["The efficiency of an entire receiving system is expressed in what terms?"], "jumps": ["P1230"]}, {"id": "P1241", "text": [], "jumps": []}, {"id": "P1242", "text": ["The power gain gives the efficiency of a transmitting or receiving antenna."], "jumps": []}, {"id": "P1243", "text": ["Eout over Ein is the measure of voltage gain, not efficiency."], "jumps": []}, {"id": "P1250", "text": ["A directional antenna radiates power in _______............"], "jumps": ["P1240"]}, {"id": "P1251", "text": [], "jumps": []}, {"id": "P1252", "text": ["An antenna that radiates power in all directions is called an omnidirectional antenna."], "jumps": []}, {"id": "P1253", "text": ["An antenna that radiates power in two directions is called a bidirectional antenna."], "jumps": []}, {"id": "P1260", "text": ["Energy from an antenna is radiated in the form of an expanding sphere. A small section of this sphere is called a wavefront, positioned perpendicular to the direction of the radiation field."], "jumps": []}, {"id": "P1270", "text": ["Within the wavefront, all energy is in phase and all points on the wavefront are an equal distance from the antenna. The farther from the antenna the wave is, the less curved it appears."], "jumps": ["P66"]}, {"id": "P1280", "text": ["The radiation field is made up of magnetic and electric lines of force that are always at right angles to each other. Most electromagnetic fields in space are said to be linearly polarized.", "AAAAAAAAAAAAA A &p,,,,\"\"\"\"\"....222////33333000004444:::555555CCCCLLLLL", "AAAAAAAAAAAAAA &p,,\",\"\"\"\"....222////33333000004444:::555555CCCCLLLLL"], "jumps": []}, {"id": "P1290", "text": ["The direction of polarization is the direction of the electric vector. If the electric lines of force are horizontal, the wave is said to be horizontally polarized. If the lines are vertical, the wave is said to be vertically polarized...", "&r ----222////44444111115555:::666666CCCCKKKKK", "@@@@&r,,,, ----222////44444111115555:::666666CCCCKKKKK", "++,,, , ----222////44444111115555:::666666CCCCKKKKK", "$$+++,,,, ----222////44444111115555:::666666CCCCKKKKK", "$$$$$+++,,, , ----222////44444111115555:::666666CCCCKKKKK", "7((($$$$$+++,,,, ----222////44444111115555:::666666CCCCKKKKK", "7!(!((($$$$$+++,,, , ----222////44444111115555:::666666CCCCKKKKK", "!!!!(((($$$$$+++,,,, ----222////44444111115555:::666666CCCCKKKKK", "!!!!!(((($$$$$+++,,, , ----222////44444111115555:::666666CCCCKKKKK", "!!!!!(((($$$$$+++,,,, ----222////44444111115555:::666666CCCCKKKKK", "!!!!!(((($$$$$+++,,,, ----222////44444111115555:::666666CCCCKKKKKKKKCC66::::::666666C6CCCCCCCKKKKKKKK"], "jumps": []}, {"id": "P1300", "text": ["In general, the polarization of a wave does not change over short distances. Therefore, transmitting and receiving antennas are oriented alike."], "jumps": []}, {"id": "P1310", "text": ["Antennas and antenna arrays are designed to the match the impedance of the wavelength and the desired frequency band. Remember, the lower the frequency, the longer the antenna."], "jumps": []}, {"id": "P1320", "text": ["Very Low Frequency (VLF) antenna arrays must be large to compensate for wavelength and power handling requirements (0.25 to 2 Megawatts) VLF antennas have multiple towers 600 to 1500 feet high with an extensive flat top for capacitive loading..."], "jumps": []}, {"id": "P1330", "text": ["Conical monopoles are used extensively in High Frequency (HF) communications. A conical monopole is an efficient broadband, vertically polarized, omnidirectional antenna."], "jumps": []}, {"id": "P1340", "text": ["HF whip antennas are vertically-polarized omnidirectional monopoles that are used for short-range, ship-to-shore and transportable communications systems. Whip antennas are made of tubular metal or fiberglass, and vary in length from 12 to 35 feet. Couplers are required for impedance matching..", "mmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmm E4\"rX+a"], "jumps": []}, {"id": "P1350", "text": ["RADAR and Microwave antennas are usually directional antennas that radiate energy in one lobe or beam. The two most important characteristics of directional antennas are directivity and power gain..."], "jumps": []}, {"id": "P1360", "text": ["The feed horn is the most commonly used antenna for microwaves......................"], "jumps": []}, {"id": "P1370", "text": ["Horns are constructed in a variety of shapes and sizes. The shape and dimensions determine the electromagnetic field pattern."], "jumps": []}, {"id": "P1380", "text": ["Horn antennas match the impedance of the waveguide to the impedance of space. This reduces standing waves and improves the efficiency of the system."], "jumps": ["P1360", "P"]}, {"id": "P1390", "text": ["The gradual expansion of the mouth provides the impedance matching."], "jumps": []}, {"id": "P1400", "text": ["Horn antennas also direct the electromagnetic energy in one direction, unidirectional."], "jumps": ["P1380"]}, {"id": "P1410", "text": ["This increases the power gain, or efficiency, of the antenna."], "jumps": ["P1380"]}, {"id": "P1420", "text": ["Horn antennas are primarily used in microwave transmission and repeater stations."], "jumps": []}, {"id": "P1430", "text": ["Most RADAR systems use parabolic antennas. These antennas use parabolic reflectors in different variations to focus the radiated energy into a desired beam pattern."], "jumps": []}, {"id": "P1440", "text": ["It consists of a radiating source (which can be a horn antenna) and a parabolic reflector called a dish."], "jumps": []}, {"id": "P1450", "text": ["As a transmitting antenna, a microwave signal is placed at the focal point (F) by a radiating source."], "jumps": ["P1430"]}, {"id": "P1460", "text": ["The field departs the radiating source and is reflected by the dish."], "jumps": []}, {"id": "P1470", "text": ["Due to the shape (parabolic) of the dish, all paths from F to the reflector and to the line XY are of the same length."], "jumps": ["P1450"]}, {"id": "P1480", "text": ["The result is a very narrow beam which increases the power gain and directivity over a simple horn antenna."], "jumps": ["P1450"]}, {"id": "P1490", "text": ["As a receiving antenna, microwave signals that are directed to the dish are reflected to the focal point (F) or the radiating source."], "jumps": []}, {"id": "P1500", "text": ["This increases the signal level at the focal point."], "jumps": []}, {"id": "P1510", "text": ["Very weak signals that normally could not be picked up by a simple horn antenna are easily received by a parabolic reflector antenna."], "jumps": ["P1490"]}, {"id": "P1520", "text": ["Parabolic reflector antennas are used to cover long distances by placing all the available power into a very narrow beam."], "jumps": ["P1490"]}, {"id": "P1530", "text": ["For example, communications between earth stations (like home TV dish antennas) and satellites cover long distances. Like a home TV dish antenna."], "jumps": []}, {"id": "P1540", "text": ["using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "Orange-Peel Parabola Truncated Parabola Cylindrical Parabola", "There are also variations to the full parabolic reflector antennas that are used primarily in RADAR systems."], "jumps": []}, {"id": "P1550", "text": ["The only difference in the antennas is the shape of the reflector."], "jumps": []}, {"id": "P1560", "text": ["The orange-peel parabola is used where a highly directive pattern in the vertical plane and a somewhat broader pattern in the horizontal plane is desired."], "jumps": ["P1540"]}, {"id": "P1570", "text": ["This pattern is desirable for height finding RADAR systems."], "jumps": []}, {"id": "P1580", "text": ["The truncated parabola is a section of a full parabola....."], "jumps": ["P1560"]}, {"id": "P1590", "text": ["If the reflector is truncated (cut) so that it is shortened vertically, the radiated beam then spreads out vertically instead of being focused."], "jumps": []}, {"id": "P1600", "text": ["However, the beam is narrow in the horizontal plane..lane."], "jumps": []}, {"id": "P1610", "text": ["Because of the narrow horizontal pattern, this reflector is used to determine an object's bearing."], "jumps": ["P1590"]}, {"id": "P1620", "text": ["The wide vertical beam allows objects at different altitudes to be detected without tilting the antenna."], "jumps": []}, {"id": "P1630", "text": ["If the reflector is truncated so that it is shortened horizontally , the radiated beam spreads out horizontally.", "VV> LLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLN"], "jumps": []}, {"id": "P1640", "text": ["However, the beam is narrow in the vertical plane..lane."], "jumps": []}, {"id": "P1650", "text": ["This type of reflector is used to determine elevation of objects due to the narrow vertical pattern.", "<< <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<", "< ! b", "<< !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!N", "< !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!P", "< !.!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!t", "< !..!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!", "< !...................................................................", "< !.t.................................................................b", "< !tt.................................................................b", "< !tt.................................................................N", "< !tPtttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttN"], "jumps": ["P1630", "P", "PN", "Pg"]}, {"id": "P1660", "text": ["Such a fan-shaped beam is used to determine elevation very accurately. ithout rotating the antenna."], "jumps": []}, {"id": "P1670", "text": ["The cylindrical parabola radiates a beam of energy that is wider in one dimension than the other."], "jumps": ["P1630"]}, {"id": "P1680", "text": ["This type of antenna is used in search RADAR and ground control approach RADAR systems."], "jumps": []}, {"id": "P1690", "text": ["The last type of antenna we will cover is the lens antenna.", "< ;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;!", ";;;;;;;;;;;;;;;;;;;;;;;;; let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
