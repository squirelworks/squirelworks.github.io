["In this lesson, you will determine if a diode limiter and clamper  circuit is faulted and if so, what the fault is.", "In this lesson, you will determine if a diode limiter and clamper circuit is faulted and if so, what the fault is."], "jumps": ["P410"]}, {"id": "P410", "text": ["The oscilloscope is used to determine if the circuit is operating correctly by comparing the input and output waveforms."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["The waveform measurement will indicate several probable faults such as an open series component or a shorted parallel component."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Resistance measurements determine the faulty component."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on LIMITER AND CLAMPER TROUBLESHOOTING PRACTICE......"], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1020", "text": ["The purpose of this experiment is to give you practice in determining if a limiter circuit is operating normally and if not, to determine the faulty component."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "5. Nida Model 480, 488 Multimeter or Equivalent"], "jumps": []}, {"id": "P1040", "text": ["Pick up the PC130-77A card. This card is used to practice troubleshooting parallel diode limiter circuits."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["Compare the card with the schematic shown."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["Notice that there are four parallel limiter circuits on the card.  Circuit C and D are biased limiters.", "Notice that there are four parallel limiter circuits on the card. Circuit C and D are biased limiters."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["In this experiment you will use the AC 24V as the input voltage.  Let's set up the card before starting the troubleshooting practice.", "In this experiment you will use the AC 24V as the input voltage. Let's set up the card before starting the troubleshooting practice."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P1040"]}, {"id": "P1090", "text": ["2.  Carefully plug PC130-77A into the Test Console PC1 position. 3.  Place PC130-77A S1 to the A position.", "2. Carefully plug PC130-77A into the Test Console PC1 position. 3. Place PC130-77A S1 to the A position.. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P1080", "P1095"]}, {"id": "P1095", "text": ["MEASUREMENT SETUP - Place S1 to the A position."], "jumps": []}, {"id": "P1100", "text": ["4.  Set the Voltmeter Switch to Positive. Set the Positive Supply           Voltage to 12. \n5.  Set the Voltmeter Switch to Negative. Set the Negative Supply        Voltage to 12. \n      The Test Console's Voltage Meter should indicate 12 volts.", "4. Set the Voltmeter Switch to Positive. Set the Positive Supply Voltage to 12. 5. Set the Voltmeter Switch to Negative. Set the Negative Supply Voltage to 12. The Test Console's Voltage Meter should indicate 12 volts....."], "jumps": ["P1090"]}, {"id": "P1110", "text": ["6.  Turn PC1 AC switch to ON. \n7.  Turn PC1 DC Power switch to ON.", "6. Turn PC1 AC switch to ON. 7. Turn PC1 DC Power switch to ON..........."], "jumps": ["P1100"]}, {"id": "P1120", "text": ["8.  Using an oscilloscope or multimeter, adjust PC130-77A R5 for       +5 VDC measured between TP10 and TP1. This applies a +5           volt bias to limiter circuit C.", "8. Using an oscilloscope or multimeter, adjust PC130-77A R5 for +5 VDC measured between TP10 and TP1. This applies a +5 volt bias to limiter circuit C."], "jumps": ["P1130", "P1110", "P1125"]}, {"id": "P1125", "text": ["MEASUREMENT SETUP - Adjust R5 for a +5 VDC measured between TP10 and TP1."], "jumps": []}, {"id": "P1130", "text": ["9.  Using an oscilloscope or multimeter, adjust PC130-77A R6 for -     5 VDC measured between TP11 and TP1. This applies a - 5             volt bias to limiter circuit D.", "9. Using an oscilloscope or multimeter, adjust PC130-77A R6 for - 5 VDC measured between TP11 and TP1. This applies a - 5 volt bias to limiter circuit D..."], "jumps": ["P1140", "P1120", "P1135"]}, {"id": "P1135", "text": ["MEASUREMENT SETUP - Adjust R6 for a - 5 VDC measured between TP11 and TP1."], "jumps": []}, {"id": "P1140", "text": ["10.  Set the oscilloscope controls as follows:", "10. Set the oscilloscope controls as follows:.............", "Display Mode - CH1 AC/GND/DC - DC Sweep - AUTO Trigger Source - CH1 Trigger Coupling - AC Trigger Slope - ++++"], "jumps": ["P1150", "P1130", "P1145"]}, {"id": "P1145", "text": ["OSCILLOSCOPE SETUP Trigger Slope - + Sweep Mode - Auto Display Mode - CH1 Trigger Source - AC CenterTrace Trigger Coupling - AC AC/GND/DC - DC", "K HK,,_,_K',E,,,,',KEZ;;K98O9[=9NN99,,,,E", "T a:Tsy : 95a ss a5T 55s5m5 s55t T-|5s- ss y -VFs5--FFmmFFs--tt -| -symVsGF--s5-", "C[R//LRNLQ1/CLR5QTTF\\f[]?1QQ2T;A;;;E,AE;KEK9 7750Q=H=T=TTU9a(&PT5", "K''K''_,'KE,;UA;;U;;;KKE/JK,EK;,K}=EE LOE", "} V@*1[\"[\"1[$@1D7=EEKEE;EEU;KK_E',K____'", "1C*;;a)?U9;U W;;;,E;E;999TH=5mPHH750: 9sOUUK", "@N17;)LUK(QEAE 1;AU;EEE;T9TH=0=T=:=HTPa;;EEEKK", ",K;A'K57VO;EEOa2OK)1U; VKE,'K__KKK'KKK'K_,_", ",,,,',E,,,,,,'}K;AAaOUaAaA: 17Aa9A7O &V=E,'''_',''''K,K'KK,,", "a 99a9=}Aaa99aA59Oa:: T::a:a= } aaT AA5:9:a=T A:a aa=}AA} A: aaaaaA", "EAaym5caAAAAA;9EEEaaV;aT57(V1(C]:5FV-mF5Gm-5s7- 7 5:s055:5T55 F 5 THTTTH 0-5:575H0555(:75F555T:H0(HV757F72H57LFQQ527G2HH5HH2H:55:5T55 F T T T57H2H75 5F:9TOa;U9Ua9=9 A:::U: ;T9T9=U=9a:77V\"===:99:=;"], "jumps": ["P"]}, {"id": "P1150", "text": ["11.  Measure the input and output waveforms of circuits A, B, C ating normally. The computer may now insert a fault into one of the circuits. Use the oscilloscope to determine which circuit, if any, is faulted and then use a multimeter to determine the faulty component.", "The four limiter circuits are operating normally. The computer may now insert a fault into one of the circuits. Use the oscilloscope to determine which circuit, if any, is faulted and then use a multimeter to determine the faulty component..."], "jumps": ["P1160"]}, {"id": "P1210", "text": ["1.  Measure the input and output waveforms of limiters A, B, C            and D.\n     Are all the circuits operating normally?", "1. Measure the input and output waveforms of limiters A, B, C and D. Are all the circuits operating normally?"], "jumps": []}, {"id": "P1211", "text": [], "jumps": []}, {"id": "P1212", "text": ["There is a fault in one or more of the limiter circuits. Check the input and output waveforms again."], "jumps": []}, {"id": "P1220", "text": ["The fault inserted by the computer causes two circuits to operate incorrectly. \nWhich two circuits are faulted?", "The fault inserted by the computer causes two circuits to operate incorrectly. Which two circuits are faulted??"], "jumps": ["P1210"]}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1222", "text": ["Measure the input and output waveforms of circuits C and D again. Notice that they are correct, biased at 5 volts and either positive or negative limited."], "jumps": []}, {"id": "P1223", "text": ["Circuit A is not operating normally. However, measure the input and output waveforms of circuit C. Notice that the input signal is correct and the output signal is a positive biased negative limited signal."], "jumps": []}, {"id": "P1230", "text": ["Compare the input and output waveforms of circuits A and B. What is the probable fault?"], "jumps": ["P1220"]}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1232", "text": ["If R1 was open, limiter A would have no output. Also, the input signal would not be effected."], "jumps": []}, {"id": "P1233", "text": ["If R2 was shorted, the input and output of circuit B would be positive limited. The fault caused the input signal to be negative limited."], "jumps": []}, {"id": "P1234", "text": ["If R2 was open, there would be no output, however, it would not effect the input signal."], "jumps": []}, {"id": "P1240", "text": ["Let's verify that R1 is shorted. \n2.  Turn PC1 AC and DC Power switches to OFF.", "Let's verify that R1 is shorted. 2. Turn PC1 AC and DC Power switches to OFF."], "jumps": ["P1230"]}, {"id": "P1250", "text": ["3.  Measure the resistance of R1 (TP2 to TP3).\n     Is R1 shorted?", "3. Measure the resistance of R1 (TP2 to TP3). Is R1 shorted????"], "jumps": ["P1240"]}, {"id": "P1251", "text": [], "jumps": []}, {"id": "P1252", "text": ["Check your resistance measurement across R1 (TP2 to TP3). Remember, 0 W indicates a short."], "jumps": []}, {"id": "P1260", "text": ["4.  Remove the multimeter and place PC1 AC and DC Power                switches to ON.  The computer will now replace R1.", "4. Remove the multimeter and place PC1 AC and DC Power switches to ON. The computer will now replace R1. External program = SCAN FTR 0 C1 00"], "jumps": ["P1250"]}, {"id": "P1270", "text": ["5.  Measure the input and output waveforms of circuits A and B.         Are circuits A and B operating normally?", "5. Measure the input and output waveforms of circuits A and B. Are circuits A and B operating normally?"], "jumps": ["P1260"]}, {"id": "P1271", "text": [], "jumps": []}, {"id": "P1272", "text": ["Ensure you are measuring the input and output waveforms of circuits A and B. Notice the input waveform is correct, circuit A output is negative limited and circuit B output is positive limited."], "jumps": []}, {"id": "P1280", "text": ["Congratulations! You have correctly determined and verified the fault."], "jumps": ["P1270"]}, {"id": "P1310", "text": ["1.  Measure the input and output waveforms of limiters A, B, C            and D. \n     Are all the circuits operating normally?", "1. Measure the input and output waveforms of limiters A, B, C and D. Are all the circuits operating normally? SCAN FTR 0 F1 03"], "jumps": []}, {"id": "P1311", "text": [], "jumps": []}, {"id": "P1312", "text": ["There is a fault in one or more of the limiter circuits. Check the input and output waveforms again."], "jumps": []}, {"id": "P1320", "text": ["Which limiter circuit is not operating correctly?", "Which limiter circuit is not operating correctly?.........."], "jumps": ["P1310"]}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1322", "text": ["Measure the input and output waveforms of circuit A again. Notice the input and output signals are both correct for a negative limiter."], "jumps": []}, {"id": "P1323", "text": ["Measure the input and output waveforms of circuit C again. Notice the input and output signals are both correct for a biased negative limiter."], "jumps": []}, {"id": "P1324", "text": ["Measure the input and output waveforms of circuit D again. Notice the input ard output signals are both correct for a biased positive limiter."], "jumps": []}, {"id": "P1330", "text": ["Compare the input and output waveforms of circuit B.  \nWhat are the probable faults?", "Compare the input and output waveforms of circuit B. What are the probable faults??"], "jumps": ["P1320"]}, {"id": "P1331", "text": [], "jumps": []}, {"id": "P1332", "text": ["If R2 was shorted, the output and input signals would be the same, positive limited. If D2 was open, there would be no limiting."], "jumps": []}, {"id": "P1340", "text": ["Let's determine if R2 is open or if D2 is shorted.  \n2.  Turn PC1 AC and DC Power switches to OFF.", "Let's determine if R2 is open or if D2 is shorted. 2. Turn PC1 AC and DC Power switches to OFF."], "jumps": ["P1330"]}, {"id": "P1350", "text": ["3.  Measure the resistances of R2 (TP4 to TP5) and D2 (TP5 to             TP1).\n     What is the fault?", "3. Measure the resistances of R2 (TP4 to TP5) and D2 (TP5 to TP1). What is the fault?"], "jumps": ["P1340"]}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1352", "text": ["Notice that your resistance measurement of R2 indicated approximately 100 kW. An open would indicate infinity ohms."], "jumps": []}, {"id": "P1360", "text": ["4.  Remove the multimeter and place PC1 AC and DC Power                switches to ON.  The computer will now replace D2.", "4. Remove the multimeter and place PC1 AC and DC Power switches to ON. The computer will now replace D2. = SCAN FTR 0 C1 00"], "jumps": ["P1350"]}, {"id": "P1370", "text": ["5.  Measure the input and output waveforms of circuit B. \n     Is circuit B operating normally?", "5. Measure the input and output waveforms of circuit B. Is circuit B operating normally???????????????????"], "jumps": ["P1360"]}, {"id": "P1371", "text": [], "jumps": []}, {"id": "P1372", "text": ["Ensure you are measuring the input and output waveforms of circuit B.  Notice that the input waveform is correct and that circuit B output is positive limited.", "Ensure you are measuring the input and output waveforms of circuit B. Notice that the input waveform is correct and that circuit B output is positive limited."], "jumps": []}, {"id": "P1380", "text": ["Congratulations!  You have correctly determined and verified the fault.", "Congratulations! You have correctly determined and verified the fault."], "jumps": ["P1370"]}, {"id": "P1410", "text": ["1.  Measure the input and output waveforms of limiters A, B, C            and D.  \n     Are all the circuits operating normally?", "1. Measure the input and output waveforms of limiters A, B, C and D. Are all the circuits operating normally? l program = SCAN FTR 0 F1 05"], "jumps": []}, {"id": "P1411", "text": [], "jumps": []}, {"id": "P1412", "text": ["There is a fault in one or more of the limiter circuits. Check the input and output waveforms again."], "jumps": []}, {"id": "P1420", "text": ["Which limiter circuit is not operating correctly?", "Which limiter circuit is not operating correctly?.........."], "jumps": ["P1410"]}, {"id": "P1421", "text": [], "jumps": []}, {"id": "P1422", "text": ["Measure the input and output waveforms of circuit A again. Notice the input and output signals are both correct for a negative limiter."], "jumps": []}, {"id": "P1423", "text": ["Measure the input and output waveforms of circuit B again. Notice the input and output signals are both correct for a positive limiter."], "jumps": []}, {"id": "P1424", "text": ["Measure the input and output waveforms of circuit D again. Notice the input and output signals are both correct for a biased positive limiter."], "jumps": []}, {"id": "P1430", "text": ["Compare the input and output waveforms of circuit C.  \nWhat is the probable fault?", "Compare the input and output waveforms of circuit C. What is the probable fault?"], "jumps": ["P1420"]}, {"id": "P1431", "text": [], "jumps": []}, {"id": "P1432", "text": ["If D3 was shorted, the output would be the applied bias voltage."], "jumps": []}, {"id": "P1433", "text": ["If R3 was shorted, the output and input signals would be the same, biased negative limited."], "jumps": []}, {"id": "P1440", "text": ["Let's determine if D3 is open.  \n2.  Turn PC1 AC and DC Power switches to OFF.", "Let's determine if D3 is open. 2. Turn PC1 AC and DC Power switches to OFF.."], "jumps": ["P1430"]}, {"id": "P1450", "text": ["3.  Measure the resistance of D3 (TP7 to TP10). \n     Is D3 open?", "3. Measure the resistance of D3 (TP7 to TP10). Is D3 open????"], "jumps": ["P1440"]}, {"id": "P1451", "text": [], "jumps": []}, {"id": "P1452", "text": ["Notice that your resistance measurement of D3 indicated approximately infinity in both directions. This indicates an open diode."], "jumps": []}, {"id": "P1460", "text": ["4.  Remove the multimeter and place PC1 AC and DC Power                switches to ON.  The computer will now replace D3.", "4. Remove the multimeter and place PC1 AC and DC Power switches to ON. The computer will now replace D3. External program = SCAN FTR 0 C1 00"], "jumps": ["P1450"]}, {"id": "P1470", "text": ["5.  Measure the input and output waveforms of circuit C.  Is                  circuit C operating normally?", "5. Measure the input and output waveforms of circuit C. Is circuit C operating normally??????"], "jumps": ["P1460"]}, {"id": "P1471", "text": [], "jumps": []}, {"id": "P1472", "text": ["Ensure you are measuring the input and output waveforms of circuit C.  Notice that the input waveform is correct and that circuit C output is biased negative limited.", "Ensure you are measuring the input and output waveforms of circuit C. Notice that the input waveform is correct and that circuit C output is biased negative limited."], "jumps": []}, {"id": "P1480", "text": ["Congratulations! You have correctly determined and verified the fault."], "jumps": ["P1470"]}, {"id": "P1510", "text": ["1.  Measure the input and output waveforms of limiters A, B, C            and D. \n     Are all the circuits operating normally?", "1. Measure the input and output waveforms of limiters A, B, C and D. Are all the circuits operating normally? program = SCAN FTR 0 F1 07"], "jumps": []}, {"id": "P1511", "text": [], "jumps": []}, {"id": "P1512", "text": ["There is a fault in one or more of the limiter circuits. Check the input and output waveforms again."], "jumps": []}, {"id": "P1520", "text": ["Which limiter circuit is not operating correctly?", "Which limiter circuit is not operating correctly?.........."], "jumps": ["P1510"]}, {"id": "P1521", "text": [], "jumps": []}, {"id": "P1522", "text": ["Measure the input and output waveforms of circuit A again. Notice the input and output signals are both correct for a negative limiter."], "jumps": []}, {"id": "P1523", "text": ["Measure the input and output waveforms of circuit B again. Notice the input are output signals are both correct for a positive limiter."], "jumps": []}, {"id": "P1524", "text": ["Measure the input and output waveforms of circuit C again. Notice the input and output signals are both correct for a biased negative limiter."], "jumps": []}, {"id": "P1530", "text": ["Compare the input and output waveforms of circuit D. \nWhat are the probable faults?", "Compare the input and output waveforms of circuit D. What are the probable faults?"], "jumps": ["P1520"]}, {"id": "P1531", "text": [], "jumps": []}, {"id": "P1532", "text": ["If R4 was open, there would be no output. If D4 was shorted, the output would be the applied bias voltage."], "jumps": []}, {"id": "P1533", "text": ["If R4 was shorted, the output and input signal would be the same, biased positive limited. If D4 is open, there would be no limiting."], "jumps": []}, {"id": "P1540", "text": ["Since limiter circuit D has no input, there must be a break in the signal path between TP6 and TP8."], "jumps": ["P1545", "P1530"]}, {"id": "P1545", "text": ["Let's check.  \n2.  Place PC1 AC and DC Power switches to OFF.", "Let's check. 2. Place PC1 AC and DC Power switches to OFF..........."], "jumps": ["P1540"]}, {"id": "P1550", "text": ["3.  Measure the resistances between TP6 and TP8.\n     Is there an open between TP6 and TP8?", "3. Measure the resistances between TP6 and TP8. Is there an open between TP6 and TP8?????????????"], "jumps": ["P1545"]}, {"id": "P1551", "text": [], "jumps": []}, {"id": "P1552", "text": ["Notice your resistance measurement between TP6 and TP8 reads infinity. An infinity measurement indicates an open."], "jumps": []}, {"id": "P1560", "text": ["4.  Remove the multimeter and place PC1 AC and DC Power                switches to ON.  The computer will now repair the break.", "4. Remove the multimeter and place PC1 AC and DC Power switches to ON. The computer will now repair the break. = SCAN FTR 0 C1 00"], "jumps": ["P1550"]}, {"id": "P1570", "text": ["5.  Measure the input and output waveforms of circuit D.  \n     Is circuit D operating normally?", "5. Measure the input and output waveforms of circuit D. Is circuit D operating normally??????????????????"], "jumps": ["P1560"]}, {"id": "P1571", "text": [], "jumps": []}, {"id": "P1572", "text": ["Ensure you are measuring the input and output waveforms of circuit D.  Notice that the input waveform is correct and that circuit D output biased positive limited.", "Ensure you are measuring the input and output waveforms of circuit D. Notice that the input waveform is correct and that circuit D output biased positive limited."], "jumps": []}, {"id": "P1580", "text": ["Congratulations! You have correctly determined and verified the fault."], "jumps": ["P1570"]}, {"id": "P1610", "text": ["1.  Measure the input and output waveforms of limiters A, B, C            and D.  \n     Are all the circuits operating normally?", "1. Measure the input and output waveforms of limiters A, B, C and D. Are all the circuits operating normally? SCAN FTR 0 C1 00"], "jumps": []}, {"id": "P1611", "text": [], "jumps": []}, {"id": "P1612", "text": ["Check the input and output waveforms again. There are no faults, all circuits are operating normally."], "jumps": []}, {"id": "P1620", "text": ["Congratulations, you have correctly determined that there are no faults."], "jumps": ["P1610"]}, {"id": "P1700", "text": ["Would you like to try another troubleshooting experiment?", "Would you like to try another troubleshooting experiment? No"], "jumps": []}, {"id": "P1710", "text": ["You have completed all the troubleshooting exercises. You will now exit the experiment and return to the lesson menu. If you would like to repeat this experiment, touch \"Limiter Troubleshooting Practice\" on the lesson menu.", "You have completed all the troubleshooting exercises. You will now exit the experiment and return to the lesson menu. If you would like to repeat this experiment, touch \"Limiter Troubleshooting Practice\" on the lesson menu..."], "jumps": []}, {"id": "P1720", "text": ["1. Return the Test Console to the initial control settings. nter the discussion text here."], "jumps": []}, {"id": "P1730", "text": ["Disconnect test equipment. \n     Carefully remove PC130-77A.                                \n     Return all equipment to its proper storage area.", "Disconnect test equipment. Carefully remove PC130-77A. Return all equipment to its proper storage area."], "jumps": []}, {"id": "P1740", "text": ["Set the Test Console Power OFF. r the discussion text here."], "jumps": []}, {"id": "P1910", "text": ["This completes the experiment on LIMITER TROUBLESHOOTING.", "This completes the experiment on LIMITER TROUBLESHOOTING..."], "jumps": ["P1001", "P1740"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["The purpose of this experiment is to give you practice in determining if a clamper circuit is operating normally and if not, to determine the faulty component."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["Pick up the PC130-77B card. This card is used to practice troubleshooting diode clamper circuits.", ". The experiment in this lesson is not setup to use the selected trainer.", "5. Nida Model 480, 488 Multimeter or Equivalent"], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["Compare the card with the schematic shown."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["Notice that there are four clamper circuits on the card.  Circuit C and D are biased clampers.", "Notice that there are four clamper circuits on the card. Circuit C and D are biased clampers."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["In this experiment you will use the AC 24V as the input voltage. Let's set up the card before starting the troubleshooting practice."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2040"]}, {"id":  circuits operating normally?", "1. Measure the input and output waveforms of clampers A, B, C and D. Are all the circuits operating normally?"], "jumps": []}, {"id": "P2211", "text": [], "jumps": []}, {"id": "P2212", "text": ["There is a fault in one or more of the clamper circuits. Check the input and output waveforms again."], "jumps": []}, {"id": "P2220", "text": ["Which clamper circuit is not operating correctly?", "Which clamper circuit is not operating correctly?.........."], "jumps": ["P2210"]}, {"id": "P2221", "text": [], "jumps": []}, {"id": "P2222", "text": ["Measure the input and output waveforms of circuit B again. Notice the input and output signals are both correct for a negative clamper."], "jumps": []}, {"id": "P2223", "text": ["Measure the input and output waveforms of circuit C again. Notice the input and output signals are both correct for a biased positive clamper."], "jumps": []}, {"id": "P2224", "text": ["Measure the input and output waveforms of circuit D again. Notice the input and output signals are both correct for a biased negative clamper."], "jumps": []}, {"id": "P2230", "text": ["Compare the input and output waveforms of circuit A.\nWhat are the probable faults?", "Compare the input and output waveforms of circuit A. What are the probable faults??"], "jumps": ["P2220"]}, {"id": "P2231", "text": [], "jumps": []}, {"id": "P2232", "text": ["If C1 was shorted, there would be no clamping action, the output would be limited by D1. If D1 was opened, there would be no clamping or limiting, the circuit is a RC voltage divider."], "jumps": []}, {"id": "P2233", "text": ["If R1 was open, there would be no slow discharge path for C1, the output would be limited by D1."], "jumps": []}, {"id": "P2240", "text": ["Let's determine if C1 is open or if D1 is shorted.   \n2.  Turn PC1 AC and DC Power switches to OFF.", "Let's determine if C1 is open or if D1 is shorted. 2. Turn PC1 AC and DC Power switches to OFF."], "jumps": ["P2230"]}, {"id": "P2250", "text": ["3.  Measure the resistances of C1 (TP3 to TP4) and D1 (TP4 to             TP1). \n     What is the fault?", "3. Measure the resistances of C1 (TP3 to TP4) and D1 (TP4 to TP1). What is the fault??"], "jumps": ["P2240"]}, {"id": "P2251", "text": [], "jumps": []}, {"id": "P2252", "text": ["Check your resistance measurement. If D1 was shorted, you would measure 0 W from TP4 to ground."], "jumps": []}, {"id": "P2260", "text": ["4.  Remove the multimeter and place PC1 AC and DC Power                switches to ON.  The computer will now replace C1.", "4. Remove the multimeter and place PC1 AC and DC Power switches to ON. The computer will now replace C1. = SCAN FTR 0 C1 00"], "jumps": ["P2250"]}, {"id": "P2270", "text": ["5.  Measure the input and output waveforms of circuit A. \n     Is circuit A operating normally?", "5. Measure the input and output waveforms of circuit A. Is circuit A operating normally?????????????????"], "jumps": ["P2260"]}, {"id": "P2271", "text": [], "jumps": []}, {"id": "P2272", "text": ["Ensure you are measuring the input and output waveforms of circuit A. Notice that the input waveform is correct and that circuit A output is positive clamped."], "jumps": []}, {"id": "P2280", "text": ["Congratulations! You have correctly determined and verified the fault."], "jumps": ["P2270"]}, {"id": "P2310", "text": ["1.  Measure the input and output waveforms of clampers A, B, C         and D. \n     Are all the circuits operating normally?", "1. Measure the input and output waveforms of clampers A, B, C and D. Are all the circuits operating normally?"], "jumps": []}, {"id": "P2311", "text": [], "jumps": []}, {"id": "P2312", "text": ["There is a fault in one or more of the clamper circuits. Check the input and output waveforms again."], "jumps": []}, {"id": "P2320", "text": ["Which clamper circuit is not operating correctly?", "Which clamper circuit is not operating correctly?.........."], "jumps": ["P2310"]}, {"id": "P2321", "text": [], "jumps": []}, {"id": "P2322", "text": ["Measure the input and output waveforms of circuit A again. Notice the input and output signals are both correct for a positive clamper."], "jumps": []}, {"id": "P2323", "text": ["Measure the input and output waveforms of circuit C again. Notice the input and output signals are both correct for a biased positive clamper."], "jumps": []}, {"id": "P2324", "text": ["Measure the input and output waveforms of circuit D again. Notice the input and output signals are both correct for a biased negative clamper."], "jumps": []}, {"id": "P2330", "text": ["Compare the input and output waveforms of circuit B. \nWhat are the probable faults?", "Compare the input and output waveforms of circuit B. What are the probable faults??"], "jumps": ["P2320"]}, {"id": "P2331", "text": [], "jumps": []}, {"id": "P2332", "text": ["If C2 was open, there would be no signal output. If D2 was shorted, the output signal would be grounded."], "jumps": []}, {"id": "P2333", "text": ["If C2 was shorted, there would be no clamping and the output would be limited by D2. If R2 was open, there is no long discharge path of C2, the output signal would be limited by D2."], "jumps": []}, {"id": "P2340", "text": ["Let's verify that D2 is open.  \n2.  Turn PC1 AC and DC Power switches to OFF.", "Let's verify that D2 is open. 2. Turn PC1 AC and DC Power switches to OFF."], "jumps": ["P2330"]}, {"id": "P2350", "text": ["3.  Measure the resistance of D2 (TP6 to TP1). \n      Is D2 open?", "3. Measure the resistance of D2 (TP6 to TP1). Is D2 open???"], "jumps": ["P2340"]}, {"id": "P2351", "text": [], "jumps": []}, {"id": "P2352", "text": ["Notice that your resistance measurement of D2 indicates approximately 1 MW in both directions. This indicates that D1 is open."], "jumps": []}, {"id": "P2360", "text": ["4.  Remove the multimeter and place PC1 AC and DC Power                switches to ON.  The computer will now replace D2.", "4. Remove the multimeter and place PC1 AC and DC Power switches to ON. The computer will now replace D2. = SCAN FTR 0 C1 00"], "jumps": ["P2350"]}, {"id": "P2370", "text": ["5.  Measure the input and output waveforms of circuit B. \n     Is circuit B operating normally?", "5. Measure the input and output waveforms of circuit B. Is circuit B operating normally??????????????????"], "jumps": ["P2360"]}, {"id": "P2371", "text": [], "jumps": []}, {"id": "P2372", "text": ["Ensure you are measuring the input and output waveforms of circuit B.  Notice that the input waveform is correct and that circuit B output is negative clamped.", "Ensure you are measuring the input and output waveforms of circuit B. Notice that the input waveform is correct and that circuit B output is negative clamped."], "jumps": []}, {"id": "P2380", "text": ["Congratulations! You have correctly determined and verified the fault."], "jumps": ["P2370"]}, {"id": "P2410", "text": ["1.  Measure the input and output waveforms of clampers A, B, C         and D. \n     Are all the circuits operating normally?", "1. Measure the input and output waveforms of clampers A, B, C and D. Are all the circuits operating normally? al program = SCAN FTR 0 F1 01"], "jumps": []}, {"id": "P2411", "text": [], "jumps": []}, {"id": "P2412", "text": ["There is a fault in one or more of the clamper circuits. Check the input and output waveforms again."], "jumps": []}, {"id": "P2420", "text": ["Which clamper circuit is not operating correctly?", "Which clamper circuit is not operating correctly?.........."], "jumps": ["P2410"]}, {"id": "P2421", "text": [], "jumps": []}, {"id": "P2422", "text": ["Measure the input and output waveforms of circuit A again. Notice the input and output signals are both correct for a positive clamper."], "jumps": []}, {"id": "P2423", "text": ["Measure the input and output waveforms of circuit B again. Notice the input and output signals are both correct for a negative clamper."], "jumps": []}, {"id": "P2424", "text": ["Measure the input and output waveforms of circuit D again. Notice the input and output signals are both correct for a biased negative clamper."], "jumps": []}, {"id": "P2430", "text": ["Compare the input and output waveforms of circuit C.  What are the probable faults?", "Compare the input and output waveforms of circuit C. What are the probable faults?"], "jumps": ["P2420"]}, {"id": "P2431", "text": [], "jumps": []}, {"id": "P2432", "text": ["If D3 was open, there would be no clamping or limiting, RC circuit. If C3 was shorted, there would be no clamping, the output signal would be limited."], "jumps": []}, {"id": "P2433", "text": ["If R3 was open, there would be no slow discharge path for C3, the output would be limited. If D3 was open, there would be no clamping or limiting, RC circuit."], "jumps": []}, {"id": "P2440", "text": ["Let's determine if the output is grounded or C3 is open.   \n2.  Turn PC1 AC and DC Power switches to OFF.", "Let's determine if the output is grounded or C3 is open. 2. Turn PC1 AC and DC Power switches to OFF."], "jumps": ["P2430"]}, {"id": "P2450", "text": ["3.  Measure the resistance of the output (TP8 to TP1) and C3 (TP7      to TP8).   \n     What is the fault?", "3. Measure the resistance of the output (TP8 to TP1) and C3 (TP7 to TP8). What is the fault?"], "jumps": ["P2440"]}, {"id": "P2451", "text": [], "jumps": []}, {"id": "P2452", "text": ["Notice the resistance measurement from TP8 to TP1 (output) indicates 0 W. This indicates a grounded output. Remember, a good capacitor measures infinity."], "jumps": []}, {"id": "P2460", "text": ["4.  Remove the multimeter and place PC1 AC and DC Power                switches to ON.  The computer will now repair the grounded          output.", "4. Remove the multimeter and place PC1 AC and DC Power switches to ON. The computer will now repair the grounded output. External program = SCAN FTR 0 C1 00"], "jumps": ["P2450"]}, {"id": "P2470", "text": ["5.  Measure the input and output waveforms of circuit C.\n     Is circuit C operating normally?", "5. Measure the input and output waveforms of circuit C. Is circuit C operating normally??????????????????"], "jumps": ["P2460"]}, {"id": "P2471", "text": [], "jumps": []}, {"id": "P2472", "text": ["Ensure you are measuring the input and output waveforms of circuit C.  Notice that the input waveform is correct and that circuit C output is biased positive clamped.", "Ensure you are measuring the input and output waveforms of circuit C. Notice that the input waveform is correct and that circuit C output is biased positive clamped."], "jumps": []}, {"id": "P2480", "text": ["Congratulations! You have correctly determined and verified the fault."], "jumps": ["P2470"]}, {"id": "P2510", "text": ["1.  Measure the input and output waveforms of clampers A, B, C         and D.\n     Are all the circuits operating normally?", "1. Measure the input and output waveforms of clampers A, B, C and D. Are all the circuits operating normally?"], "jumps": []}, {"id": "P2511", "text": [], "jumps": []}, {"id": "P2512", "text": ["There is a fault in one or more of the clamper circuits. Check the input and output waveforms again."], "jumps": []}, {"id": "P2520", "text": ["Which clamper circuit is not operating correctly?", "Which clamper circuit is not operating correctly?.........."], "jumps": ["P2510"]}, {"id": "P2521", "text": [], "jumps": []}, {"id": "P2522", "text": ["Measure the input and output waveforms of circuit A again. Notice the input and output signals are both correct for a positive clamper."], "jumps": []}, {"id": "P2523", "text": ["Measure the input and output waveforms of circuit B again. Notice the input and output signals are both correct for a negative clamper.", "Measure the input and output waveforms of circuit B again. Notice the input and output signals are both correct for a negative clamper.."], "jumps": []}, {"id": "P2524", "text": ["Measure the input and output waveforms of circuit C again. Notice the input and output signals are both correct for a biased positive clamper.", "Measure the input and output waveforms of circuit C again. Notice the input and output signals are both correct for a biased positive clamper.."], "jumps": []}, {"id": "P2530", "text": ["Compare the input and output waveforms of circuit D.\nWhat is (are) the probable fault(s)?", "Compare the input and output waveforms of circuit D. What is (are) the probable fault(s)?"], "jumps": ["P2520"]}, {"id": "P2531", "text": [], "jumps": []}, {"id": "P2532", "text": ["If R4 or D4 was shorted, the output would be a reduced sine wave riding on a DC level."], "jumps": []}, {"id": "P2533", "text": ["If C4 was open, there would be no output. However, there would be an input!"], "jumps": []}, {"id": "P2540", "text": ["Since clamper circuit C has an input, there must be a break in the signal path between TP7 and TP9."], "jumps": ["P2545", "P2530"]}, {"id": "P2545", "text": ["Let's check.  \n2.  Place PC1 AC and DC Power switches to OFF.", "Let's check. 2. Place PC1 AC and DC Power switches to OFF..........."], "jumps": ["P2540"]}, {"id": "P2550", "text": ["3.  Measure the resistances between TP7 and TP9. \n      Is there an open between TP7 and TP9?", "3. Measure the resistances between TP7 and TP9. Is there an open between TP7 and TP9?"], "jumps": ["P2545"]}, {"id": "P2551", "text": [], "jumps": []}, {"id": "P2552", "text": ["Notice the resistance measurement between TP7 and TP9 reads infinity. An infinity measurement indicates an open."], "jumps": []}, {"id": "P2560", "text": ["4.  Remove the multimeter and place PC1 AC and DC Power                switches to ON.  The computer will now repair the break.", "4. Remove the multimeter and place PC1 AC and DC Power switches to ON. The computer will now repair the break. External program = SCAN FTR 0 C1 00"], "jumps": ["P2550"]}, {"id": "P2570", "text": ["5.  Measure the input and output waveforms of circuit D. \n     Is circuit D operating normally?", "5. Measure the input and output waveforms of circuit D. Is circuit D operating normally?????????????????"], "jumps": ["P2560"]}, {"id": "P2571", "text": [], "jumps": []}, {"id": "P2572", "text": ["Ensure you are measuring the input and output waveforms of circuit D. Notice that the input waveform is correct and that circuit D output is biased negative clamped."], "jumps": []}, {"id": "P2580", "text": ["Congratulations! You have correctly determined and verified the fault."], "jumps": ["P2570"]}, {"id": "P2610", "text": ["1.  Measure the input and output waveforms of clampers A, B, C         and D. \n     Are all the circuits operating normally?", "1. Measure the input and output waveforms of clampers A, B, C and D. Are all the circuits operating normally?"], "jumps": []}, {"id": "P2611", "text": [], "jumps": []}, {"id": "P2612", "text": ["Check the input and output waveforms again. There are no faults, all circuits are operating normally."], "jumps": []}, {"id": "P2620", "text": ["Congratulations! You have correctly determined that there are no faults."], "jumps": ["P2610"]}, {"id": "P2700", "text": ["Would you like to try another troubleshooting experiment?", "Would you like to try another troubleshooting experiment? No"], "jumps": []}, {"id": "P2710", "text": ["You have completed all the troubleshooting exercises. You will now exit the experiment and return to the lesson menu. If you would like to repeat this experiment, touch \"Clamper Troubleshooting Practice\" on the lesson menu."], "jumps": []}, {"id": "P2720", "text": ["1. Return the Test Console to the initial control settings. nter the discussion text here."], "jumps": []}, {"id": "P2730", "text": ["Disconnect test equipment. \n     Carefully remove PC130-77B.                                \n     Return all equipment to its proper storage area.", "Disconnect test equipment. Carefully remove PC130-77B. Return all equipment to its proper storage area."], "jumps": []}, {"id": "P2740", "text": ["Set the Test Console Power OFF. r the discussion text here."], "jumps": []}, {"id": "P2910", "text": ["This completes the experiment on CLAMPER TROUBLESHOOTING.", "This completes the experiment on CLAMPER TROUBLESHOOTING..."], "jumps": ["P2001", "P2740"]}, {"id": "P13020", "text": ["The purpose of this experiment is to give you practice in determining if a limiter circuit is operating normally and if not, to determine the faulty component."], "jumps": ["P13030", "P1001"]}, {"id": "P13030", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "5. Nida Model 480, 488 Multimeter or Equivalent", "6. Alligator to Alligator Jumper XXXXXnt"], "jumps": []}, {"id": "P13040", "text": ["Pick up the PC130-77A card. This card is used to practice troubleshooting parallel diode limiter circuits."], "jumps": ["P13050", "P13030"]}, {"id": "P13050", "text": ["Compare the card with the schematic shown."], "jumps": ["P13060", "P13040"]}, {"id": "P13060", "text": ["Notice that there are four parallel limiter circuits on the card.   Circuit C and D are biased limiters.", "Notice that there are four parallel limiter circuits on the card. Circuit C and D are biased limiters."], "jumps": ["P13070", "P13040"]}, {"id": "P13070", "text": ["In this experiment you will use the AC 24Vas the input voltage. Let's set up the card before starting the troubleshooting practice."], "jumps": ["P13080", "P13040"]}, {"id": "P13080", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13040"]}, {"id": "P13090", "text": ["2.  Carefully plug PC130-77A into the Test Console PC1 position. 3.  Place PC130-77A S1 to the A position and connect an alligator      to alligator cable between TP1 and Pin H on PC130-77A.", "2. Carefully plug PC130-77A into the Test Console PC1 position. 3. Place PC130-77A S1 to the A position and connect an alligator to alligator cable between TP1 and Pin H on PC130-77A."], "jumps": ["P13100", "P13095"]}, {"id": "P13095", "text": ["MEASUREMENT SETUP - Place S1 to the A position."], "jumps": ["P13096"]}, {"id": "P13096", "text": ["MEASUREMENT SETUP - Place an alligator to alligator between TP1 and Pin H on PC30-77A."], "jumps": []}, {"id": "P13100", "text": ["4.  Press Enter to Set: Positive Supply Voltage - 12\n5.  Press Enter to Set: Negative Supply Voltage - 12", "4. Press Enter to Set: Positive Supply Voltage - 12 5. Press Enter to Set: Negative Supply Voltage - 12"], "jumps": ["P13090"]}, {"id": "P13110", "text": ["6.  Press Enter to Set: PC1 AC Power Switch - ON\n7.  Press Enter to Set: PC1 DC Power Switch - ON", "6. Press Enter to Set: PC1 AC Power Switch - ON 7. Press Enter to Set: PC1 DC Power Switch - ON"], "jumps": []}, {"id": "P13120", "text": ["8.  Using an oscilloscope or multimeter, adjust PC130-77A R5 for        + 5  VDC measured between TP10 and TP1. This applies a +5         volt bias to limiter circuit C.", "8. Using an oscilloscope or multimeter, adjust PC130-77A R5 for + 5 VDC measured between TP10 and TP1. This applies a +5 volt bias to limiter circuit C."], "jumps": ["P13130", "P13125"]}, {"id": "P13125", "text": ["MEASUREMENT SETUP - Adjust R5 for a +5 VDC measured between TP10 and TP1."], "jumps": []}, {"id": "P13130", "text": ["9.  Using an oscilloscope or multimeter, adjust PC130-77A R6 for \n     - 5 VDC measured between TP11 and TP1. This applies a - 5           volt bias to limiter circuit D.", "9. Using an oscilloscope or multimeter, adjust PC130-77A R6 for - 5 VDC measured between TP11 and TP1. This applies a - 5 volt bias to limiter circuit D."], "jumps": ["P13140", "P13120", "P13135"]}, {"id": "P13135", "text": ["MEASUREMENT SETUP - Adjust R6 for a -5 VDC measured between TP11 and TP1."], "jumps": []}, {"id": "P13140", "text": ["10.  Set the oscilloscope controls as follows:", "10. Set the oscilloscope controls as follows:.............", "Display Mode - CH1 AC/GND/DC - DC Sweep - AUTO Trigger Source - CH1 Trigger Coupling - AC Trigger S imiter circuits. Check the input and output waveforms again."], "jumps": []}, {"id": "P13220", "text": ["The fault inserted by the computer causes two circuits to operate incorrectly. \nWhich two circuits are faulted?", "The fault inserted by the computer causes two circuits to operate incorrectly. Which two circuits are faulted??"], "jumps": ["P13210"]}, {"id": "P13221", "text": [], "jumps": []}, {"id": "P13222", "text": ["Measure the input and output waveforms of circuits C and D again. Notice that they are correct, biased at 5 volts and either positive or negative limited."], "jumps": []}, {"id": "P13223", "text": ["Circuit A is not operating normally.  However, measure the input and output waveforms of circuit C.  Notice that the input signal is correct and the output signal is a positive biased negative limited signal.", "Circuit A is not operating normally. However, measure the input and output waveforms of circuit C. Notice that the input signal is correct and the output signal is a positive biased negative limited signal."], "jumps": []}, {"id": "P13230", "text": ["Compare the input and output waveforms of circuits A and B. What is the probable fault?"], "jumps": ["P13220"]}, {"id": "P13231", "text": [], "jumps": []}, {"id": "P13232", "text": ["If R1 was open, limiter A would have no output.  Also, the input signal would not be effected.", "If R1 was open, limiter A would have no output. Also, the input signal would not be effected."], "jumps": []}, {"id": "P13233", "text": ["If R2 was shorted, the input and output of circuit B would be positive limited.  The fault caused the input signal to be negative limited.", "If R2 was shorted, the input and output of circuit B would be positive limited. The fault caused the input signal to be negative limited."], "jumps": []}, {"id": "P13234", "text": ["If R2 was open, there would be no output, however, it would not effect the input signal."], "jumps": []}, {"id": "P13240", "text": ["Let's verify that R1 is shorted. \n2.  Press Enter to Set: PC1 AC and DC Power Switches -  OFF", "Let's verify that R1 is shorted. 2. Press Enter to Set: PC1 AC and DC Power Switches - OFF FF"], "jumps": ["P13230"]}, {"id": "P13250", "text": ["3.  Measure the resistance of R1 (TP2 to TP3).\n     Is R1 shorted?", "3. Measure the resistance of R1 (TP2 to TP3). Is R1 shorted????"], "jumps": []}, {"id": "P13251", "text": [], "jumps": []}, {"id": "P13252", "text": ["Check your resistance measurement across R1 (TP2 to TP3). Remember, 0 W indicates a short."], "jumps": []}, {"id": "P13260", "text": ["4.  Press Enter to Set: PC1 AC and PC1 DC Power Switches - ON       The computer will now replace R1.", "4. Press Enter to Set: PC1 AC and PC1 DC Power Switches - ON The computer will now replace R1."], "jumps": ["P13250"]}, {"id": "P13270", "text": ["5.  Measure the input and output waveforms of circuits A and B.         Are circuits A and B operating normally?", "5. Measure the input and output waveforms of circuits A and B. Are circuits A and B operating normally?"], "jumps": []}, {"id": "P13271", "text": [], "jumps": []}, {"id": "P13272", "text": ["Ensure you are measuring the input and output waveforms of circuits A and B. Notice the input waveform is correct, circuit A output is negative limited and circuit B output is positive limited."], "jumps": []}, {"id": "P13280", "text": ["Congratulations! You have correctly determined and verified the fault."], "jumps": ["P13270"]}, {"id": "P13310", "text": ["1.  Measure the input and output waveforms of limiters A, B, C            and D.\n     Are all the circuits operating normally?", "1. Measure the input and output waveforms of limiters A, B, C and D. Are all the circuits operating normally? External program = 130E FLT 0 F1 03 S"], "jumps": []}, {"id": "P13311", "text": [], "jumps": []}, {"id": "P13312", "text": ["There is a fault in one or more of the limiter circuits. Check the input and output waveforms again."], "jumps": []}, {"id": "P13320", "text": ["Which limiter circuit is not operating correctly?", "Which limiter circuit is not operating correctly?.........."], "jumps": ["P13310"]}, {"id": "P13321", "text": [], "jumps": []}, {"id": "P13322", "text": ["Measure the input and output waveforms of circuit A again. Notice the input and output signals are both correct for a negative limiter."], "jumps": []}, {"id": "P13323", "text": ["Measure the input and output waveforms of circuit C again. Notice the input and output signals are both correct for a biased negative limiter."], "jumps": []}, {"id": "P13324", "text": ["Measure the input and output waveforms of circuit D again. Notice the input and output signals are both correct for a biased positive limiter."], "jumps": []}, {"id": "P13330", "text": ["Compare the input and output waveforms of circuit B. \nWhat are the probable faults?", "Compare the input and output waveforms of circuit B. What are the probable faults?"], "jumps": ["P13320"]}, {"id": "P13331", "text": [], "jumps": []}, {"id": "P13332", "text": ["If R2 was shorted, the output and input signals would be the same, positive limited. If D2 was open, there would be no limiting."], "jumps": []}, {"id": "P13340", "text": ["Let's determine if R2 is open or if D2 is shorted. \n2.  Press Enter to Set: PC1 AC and DC Power Switches - OFF", "Let's determine if R2 is open or if D2 is shorted. 2. Press Enter to Set: PC1 AC and DC Power Switches - OFF F"], "jumps": ["P13330"]}, {"id": "P13350", "text": ["3.  Measure the resistances of R2 (TP4 to TP5) and D2 (TP5 to             TP1). \n     What is the fault?", "3. Measure the resistances of R2 (TP4 to TP5) and D2 (TP5 to TP1). What is the fault?"], "jumps": []}, {"id": "P13351", "text": [], "jumps": []}, {"id": "P13352", "text": ["Notice that your resistance measurement of R2 indicated  approximately 100 kW. An open would indicate infinity ohms.", "Notice that your resistance measurement of R2 indicated approximately 100 kW. An open would indicate infinity ohms."], "j utput signals are both correct for a biased negative limiter."], "jumps": []}, {"id": "P13530", "text": ["Compare the input and output waveforms of circuit D.\nWhat are the probable faults?", "Compare the input and output waveforms of circuit D. What are the probable faults??"], "jumps": ["P13520"]}, {"id": "P13531", "text": [], "jumps": []}, {"id": "P13532", "text": ["If R4 was open, there would be no output.  If D4 was shorted, the output would be the applied bias voltage.", "If R4 was open, there would be no output. If D4 was shorted, the output would be the applied bias voltage."], "jumps": []}, {"id": "P13533", "text": ["If R4 was shorted, the output and input signal would be the same, biased positive limited.  If D4 is open, there would be no limiting.", "If R4 was shorted, the output and input signal would be the same, biased positive limited. If D4 is open, there would be no limiting."], "jumps": []}, {"id": "P13540", "text": ["Since limiter circuit D has no input, there must be a break in the signal path between TP6 and TP8."], "jumps": ["P13545", "P13530"]}, {"id": "P13545", "text": ["Let's check. \n2.  Press Enter to Set: PC1 AC and PC1 DC Power Switches - OFF", "Let's check. 2. Press Enter to Set: PC1 AC and PC1 DC Power Switches - OFF"], "jumps": ["P13540"]}, {"id": "P13550", "text": ["3.  Measure the resistances between TP6 and TP8. \n     Is there an open between TP6 and TP8?", "3. Measure the resistances between TP6 and TP8. Is there an open between TP6 and TP8??"], "jumps": []}, {"id": "P13551", "text": [], "jumps": []}, {"id": "P13552", "text": ["Notice your resistance measurement between TP6 and TP8 reads infinity.  An infinity measurement indicates an open.", "Notice your resistance measurement between TP6 and TP8 reads infinity. An infinity measurement indicates an open."], "jumps": []}, {"id": "P13560", "text": ["4.  Remove the multimeter.\n5.  Press Enter to Set: PC1 AC and PC1 DC Power Switches - ON       The computer will now repair the break.", "4. Remove the multimeter. 5. Press Enter to Set: PC1 AC and PC1 DC Power Switches - ON The computer will now repair the break."], "jumps": ["P13550"]}, {"id": "P13570", "text": ["6.  Measure the input and output waveforms of circuit D. \n      Is circuit D operating normally?", "6. Measure the input and output waveforms of circuit D. Is circuit D operating normally??????"], "jumps": []}, {"id": "P13571", "text": [], "jumps": []}, {"id": "P13572", "text": ["Ensure you are measuring the input and output waveforms of circuit D. Notice that the input waveform is correct and that circuit D output biased positive limited."], "jumps": []}, {"id": "P13580", "text": ["Congratulations! You have correctly determined and verified the fault."], "jumps": ["P13570"]}, {"id": "P13610", "text": ["1.  Measure the input and output waveforms of limiters A, B, C            and D.\n     Are all the circuits operating normally?", "1. Measure the input and output waveforms of limiters A, B, C and D. Are all the circuits operating normally? nal program = 130E FLT 0 C1 00 S"], "jumps": []}, {"id": "P13611", "text": [], "jumps": []}, {"id": "P13612", "text": ["Check the input and output waveforms again.  There are no faults, all circuits are operating normally.", "Check the input and output waveforms again. There are no faults, all circuits are operating normally."], "jumps": []}, {"id": "P13620", "text": ["Congratulations, you have correctly determined that there are no faults."], "jumps": ["P13610"]}, {"id": "P14020", "text": ["The purpose of this experiment is to give you practice in determining if a clamper circuit is operating normally and if not, to determine the faulty component."], "jumps": ["P14030", "P2001"]}, {"id": "P14030", "text": ["Pick up the PC130-77B card. This card is used to practice troubleshooting diode clamper circuits.", ". The experiment in this lesson is not setup to use the selected trainer.", "5. Nida Model 480, 488 Multimeter or Equivalent", "6. Alligator to ": "P14165", "text": ["MEASUREMENT SETUP - If the waveforms are incorrect, there may be a problem with the card or the setup. Ensure your setup is correct and you are using the oscilloscope correctly. Then check with your instructor."], "jumps": []}, {"id": "P14170", "text": ["The four clamper circuits are operating normally. The computer may now insert a fault into one of the circuits. Use the oscilloscope to determine which circuit, if any, is faulted and then use a multimeter to determine the faulty component.", "The four clamper circuits are operating normally. The computer may now insert a fault into one of the circuits. Use the oscilloscope to determine which circuit, if any, is faulted and then use a multimeter to determine the faulty component..."], "jumps": ["P14160"]}, {"id": "P14210", "text": ["1.  Measure the input and output waveforms of clampers A, B, C         and D.\n     Are all the circuits operating normally?", "1. Measure the input and output waveforms of clampers A, B, C and D. Are all the circuits operating normally?"], "jumps": []}, {"id": "P14211", "text": [], "jumps": []}, {"id": "P14212", "text": ["There is a fault in one or more of the clamper circuits. Check the input and output waveforms again."], "jumps": []}, {"id": "P14220", "text": ["Which clamper circuit is not operating correctly?", "Which clamper circuit is not operating correctly?.........."], "jumps": ["P14210"]}, {"id": "P14221", "text": [], "jumps": []}, {"id": "P14222", "text": ["Measure the input and output waveforms of circuit B again. Notice the input and output signals are both correct for a negative clamper."], "jumps": []}, {"id": "P14223", "text": ["Measure the input and output waveforms of circuit C again. Notice the input and output signals are both correct for a biased positive clamper."], "jumps": []}, {"id": "P14224", "text": ["Measure the input and output waveforms of circuit D again. Notice the input and output signals are both correct for a biased negative clamper."], "jumps": []}, {"id": "P14230", "text": ["Compare the input and output waveforms of circuit A. \nWhat are the probable faults?", "Compare the input and output waveforms of circuit A. What are the probable faults?"], "jumps": ["P14220"]}, {"id": "P14231", "text": [], "jumps": []}, {"id": "P14232", "text": ["If C1 was shorted, there would be no clamping action, the output would be limited by D1. If D1 was opened, there would be no clamping or limiting, the circuit is a RC voltage divider."], "jumps": []}, {"id": "P14233", "text": ["If R1 was open, there would be no slow discharge path for C1, the output would be limited by D1."], "jumps": []}, {"id": "P14240", "text": ["Let's determine if C1 is open or if D1 is shorted. \n2.  Press Enter to Set: PC1 AC and DC Power Switches - OFF", "Let's determine if C1 is open or if D1 is shorted. 2. Press Enter to Set: PC1 AC and DC Power Switches - OFF FF"], "jumps": ["P14230"]}, {"id": "P14250", "text": ["3.  Measure the resistances of C1 (TP3 to TP4) and D1 (TP4 to             TP1). \n     What is the fault?", "3. Measure the resistances of C1 (TP3 to TP4) and D1 (TP4 to TP1). What is the fault?"], "jumps": []}, {"id": "P14251", "text": [], "jumps": []}, {"id": "P14252", "text": ["Check your resistance measurement. If D1 was shorted, you would measure 0 W from TP4 to ground."], "jumps": []}, {"id": "P14260", "text": ["4.  Remove the multimeter.\n5.  Press Enter to Set: PC1 AC and PC1 DC Power Switches - ON       The computer will now replace C1.", "4. Remove the multimeter. 5. Press Enter to Set: PC1 AC and PC1 DC Power Switches - ON The computer will now replace C1.."], "jumps": ["P14250"]}, {"id": "P14270", "text": ["5.  Measure the input and output waveforms of circuit A.  \n     Is circuit A operating normally?", "5. Measure the input and output waveforms of circuit A. Is circuit A operating normally???????????????????"], "jumps": []}, {"id": "P14271", "text": [], "jumps": []}, {"id": "P14272", "text": ["Ensure you ar d be no signal output. If D2 was shorted, the output signal would be grounded."], "jumps": []}, {"id": "P14333", "text": ["If C2 was shorted, there would be no clamping and the output would be limited by D2. If R2 was open, there is no long discharge path of C2, the output signal would be limited by D2."], "jumps": []}, {"id": "P14340", "text": ["Let's verify that D2 is open. \n2.  Press Enter to Set: PC1 AC and PC1 DC Power Switches - OFF", "Let's verify that D2 is open. 2. Press Enter to Set: PC1 AC and PC1 DC Power Switches - OFFF"], "jumps": ["P14330"]}, {"id": "P14350", "text": ["3.  Measure the resistance of D2 (TP6 to TP1). \n      Is D2 open?", "3. Measure the resistance of D2 (TP6 to TP1). Is D2 open?"], "jumps": []}, {"id": "P14351", "text": [], "jumps": []}, {"id": "P14352", "text": ["Notice that your resistance measurement of D2 indicates approximately 1 MW in both directions. This indicates that D1 is open."], "jumps": []}, {"id": "P14360", "text": ["4.  Remove the multimeter. \n5.  Press Enter to Set: PC1 AC and PC1 DC Power Switches - ON        The computer will now replace D2.", "4. Remove the multimeter. 5. Press Enter to Set: PC1 AC and PC1 DC Power Switches - ON The computer will now replace D2."], "jumps": ["P14350"]}, {"id": "P14370", "text": ["5.  Measure the input and output waveforms of circuit B. \n     Is circuit B operating normally?", "5. Measure the input and output waveforms of circuit B. Is circuit B operating normally?"], "jumps": []}, {"id": "P14371", "text": [], "jumps": []}, {"id": "P14372", "text": ["Ensure you are measuring the input and output waveforms of circuit B. Notice that the input waveform is correct and that circuit B output is negative clamped."], "jumps": []}, {"id": "P14380", "text": ["Congratulations! You have correctly determined and verified the fault."], "jumps": ["P14370"]}, {"id": "P14410", "text": ["1.  Measure the input and output waveforms of clampers A, B, C         and D. \n     Are all the circuits operating normally?", "1. Measure the input and output waveforms of clampers A, B, C and D. Are all the circuits operating normally? External program = 130E FLT 0 F1 01 S"], "jumps": []}, {"id": "P14411", "text": [], "jumps": []}, {"id": "P14412", "text": ["There is a fault in one or more of the clamper circuits. Check the input and output waveforms again."], "jumps": []}, {"id": "P14420", "text": ["Which clamper circuit is not operating correctly?", "Which clamper circuit is not operating correctly?.........."], "jumps": ["P14410"]}, {"id": "P14421", "text": [], "jumps": []}, {"id": "P14422", "text": ["Measure the input and output waveforms of circuit A again. Notice the input and output signals are both correct for a positive clamper."], "jumps": []}, {"id": "P14423", "text": ["Measure the input and output waveforms of circuit B again. Notice the input and output signals are both correct for a negative clamper."], "jumps": []}, {"id": "P14424", "text": ["Measure the input and output waveforms of circuit D again. Notice the input and output signals are both correct for a biased negative clamper."], "jumps": []}, {"id": "P14430", "text": ["Compare the input and output waveforms of circuit C. \nWhat are the probable faults?", "Compare the input and output waveforms of circuit C. What are the probable faults?"], "jumps": ["P14420"]}, {"id": "P14431", "text": [], "jumps": []}, {"id": "P14432", "text": ["If D3 was open, there would be no clamping or limiting, RC circuit. If C3 was shorted, there would be no clamping, the output signal would be limited."], "jumps": []}, {"id": "P14433", "text": ["If R3 was open, there would be no slow discharge path for C3, the output would be limited. If D3 was open, there would be no clamping or limiting, RC circuit."], "jumps": []}, {"id": "P14440", "text": ["Let's determine if the output is grounded or C3 is open. \n2.  Press Enter to Set: PC1 AC and PC1 DC Power Switches - OFF", "Let's determine if the output is grounded or C3 is open. 2. Press Enter to Set: PC1 AC and PC1 DC Power Switches - OFF"], "jumps": ["P14430"]}, {"id": "P14450", "text": ["3.  Measure the resistance of the output (TP8 to TP1) and C3 (TP7      to TP8).\n     What is the fault?", "3. Measure the resistance of the output (TP8 to TP1) and C3 (TP7 to TP8). What is the fault?"], "jumps": []}, {"id": "P14451", "text": [], "jumps": []}, {"id": "P14452", "text": ["Notice the resistance measurement from TP8 to TP1 (output) indicates 0 W. This indicates a grounded output. Remember, a good capacitor measures infinity."], "jumps": []}, {"id": "P14460", "text": ["4.  Remove the multimeter. \n5.  Press Enter to Set: PC1 AC and PC1 DC Power Switches - ON        The computer will now repair the grounded output.", "4. Remove the multimeter. 5. Press Enter to Set: PC1 AC and PC1 DC Power Switches - ON The computer will now repair the grounded output."], "jumps": ["P14450"]}, {"id": "P14470", "text": ["5.  Measure the input and output waveforms of circuit C.\n     Is circuit C operating normally?", "5. Measure the input and output waveforms of circuit C. Is circuit C operating normally?"], "jumps": []}, {"id": "P14471", "text": [], "jumps": []}, {"id": "P14472", "text": ["Ensure you are measuring the input and output waveforms of circuit C. Notice that the input waveform is correct and that circuit C output is biased positive clamped."], "jumps": []}, {"id": "P14480", "text": ["Congratulations! You have correctly determined and verified the fault."], "jumps": ["P14470"]}, {"id": "P14510", "text": ["1.  Measure the input and output waveforms of clampers A, B, C         and D.\n     Are all the circuits operating normally?", "1. Measure the input and output waveforms of clampers A, B, C and D. Are all the circuits operating normally? External program = 130E FLT 0 F1 07 SE"], "jumps": []}, {"id": "P14511", "text": [], "jumps": []}, {"id": "P14512", "text": ["There is a fault in one or more of the clamper circuits. Check the input and output wavefo ance measurement between TP7 and TP9 reads infinity. An infinity measurement indicates an open."], "jumps": []}, {"id": "P14560", "text": ["4.  Remove the multimeter. \n5.  Press Enter to Set: PC1 AC and PC1 DC Power Switches - ON       The computer will now repair the break.", "4. Remove the multimeter. 5. Press Enter to Set: PC1 AC and PC1 DC Power Switches - ON The computer will now repair the break."], "jumps": ["P14550"]}, {"id": "P14570", "text": ["5.  Measure the input and output waveforms of circuit D. \n     Is circuit D operating normally?", "5. Measure the input and output waveforms of circuit D. Is circuit D operating normally?"], "jumps": []}, {"id": "P14571", "text": [], "jumps": []}, {"id": "P14572", "text": ["Ensure you are measuring the input and output waveforms of circuit D. Notice that the input waveform is correct and that circuit D output is biased negative clamped."], "jumps": []}, {"id": "P14580", "text": ["Congratulations! You have correctly determined and verified the fault."], "jumps": ["P14570"]}, {"id": "P14610", "text": ["1.  Measure the input and output waveforms of clampers A, B, C         and D. \n     Are all the circuits operating normally?", "1. Measure the input and output waveforms of clampers A, B, C and D. Are all the circuits operating normally? xternal program = 130E FLT 0 C1 00 SC"], "jumps": []}, {"id": "P14611", "text": [], "jumps": []}, {"id": "P14612", "text": ["Check the input and output waveforms again. There are no faults, all circuits are operating normally."], "jumps": []}, {"id": "P14620", "text": ["Congratulations! You have correctly determined that there are no faults."], "jumps": ["P14610"]}, {"id": "P10250", "text": ["A score of 100% indicates that the student has completed this experiment on Limiter Troubleshooting Practice. During this section the student used the PC130-77A experiment card and a multimeter. The following behaviors identify the expected outcomes: * Determine if limiter circuits A, B, C, and D let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
