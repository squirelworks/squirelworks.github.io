const book = {"title": "93953901", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: INTRODUCTION TO AM RECEIVERSfasfd asdf asdf sadf"], "jumps": []}, {"id": "P420", "text": ["You need to understand AM receivers as you may have to repair them."], "jumps": ["P430", "P400"]}, {"id": "P440", "text": ["By understanding AM receiver operation you will comprehend other more complex and advanced  receivers.", "By understanding AM receiver operation you will comprehend other more complex and advanced receivers.", "w List the primary functions of an AM Receiver. w Describe AM Receiver primary functions.", "w Identify the basic functional blocks of an AM Receiver.............."], "jumps": ["P450", "P410"]}, {"id": "P400", "text": ["In this lesson, you will learn about AM receivers. This is the first lesson where several circuits are combined into an electronic device."], "jumps": ["P410", "P300"]}, {"id": "P2055", "text": ["A schematic diagram shows every component and connection in electronic equipment.", "A schematic diagram shows every component and connection in electronic equipment..............................................."], "jumps": ["P2057", "P2052"]}, {"id": "P2057", "text": ["Technicians use schematic diagrams and functional block diagrams when repairing equipment.", "Technicians use schematic diagrams and functional block diagrams when repairing equipment......................................"], "jumps": ["P2050", "P2052"]}, {"id": "P2060", "text": ["The tuner section converts the received RF to an intermediate frequency (IF)."], "jumps": ["P2062", "P2050"]}, {"id": "P450", "text": ["Let's begin the lesson on INTRODUCTION TO AM RECEIVERS...................."], "jumps": ["P400"]}, {"id": "P2062", "text": ["IF from the tuner is amplified by the IF amplifier."], "jumps": ["P2063", "P2068"]}, {"id": "P2095", "text": ["The LO frequency is set 455 kHz above the received signal.", "The LO frequency is set 455 kHz above the received signal.m"], "jumps": ["P2100", "P2070"]}, {"id": "P2052", "text": ["FUNCTIONAL BLOCK DIAGRAM - A functional block diagram shows the essential circuits drawn as blocks with only major inputs and outputs."], "jumps": ["P2055"]}, {"id": "P2067", "text": ["Let's look more closely at the function of each block."], "jumps": ["P2070", "P2068"]}, {"id": "P2070", "text": ["The tuner consists of a radio frequency amplifier, a mixer and a local oscillator."], "jumps": ["P2080", "P2068"]}, {"id": "P2080", "text": ["When the radio's tuning knob is adjusted the RF amplifier selects and amplifies one of the incoming antenna frequencies."], "jumps": ["P2090", "P2070"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["AM receivers are electronic devices that pick up signals sent from AM transmitters."], "jumps": ["P1030", "P1001"]}, {"id": "P1025", "text": ["RECEIVER - A receiver is any electronic device that converts radio waves into audio, video or any form that is useful."], "jumps": []}, {"id": "P1027", "text": ["TRANSMITTER - A transmitter is any electronic device that converts intelligence into radio waves. Intelligence can be audio, video, data or any useful form of information."], "jumps": []}, {"id": "P1030", "text": ["The AM broadcast band covers frequencies from 500 kHz to 1600 kHz."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The abbreviation AM stands for Amplitude Modulation."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["AM is one form of modulation that is used to transmit intelligence over long distances."], "jumps": ["P1060", "P1030"]}, {"id": "P1060", "text": ["Intelligence is the information transferred from one location to another."], "jumps": ["P1065", "P1050"]}, {"id": "P1065", "text": ["In the AM band, the intelligence can be voice, music, data or video."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["The intelligence to be transmitted is a relatively low frequency, usually 15 kHz or less."], "jumps": ["P1075", "P1050"]}, {"id": "P1075", "text": ["These low frequencies are not well suited for long distance transmissions."], "jumps": ["P1080", "P1070", "P1078"]}, {"id": "P1076", "text": ["These low frequencies are not well suited for long distance transmissions."], "jumps": ["P1080", "P1070", "P1078"]}, {"id": "P1078", "text": ["TRANSMISSION OF WAVES - Low frequencies tend to follow the curvature of the earth and are easily blocked by buildings and absorbed by the landscape. High frequencies tend to bounce off the atmosphere making long distance communication possible."], "jumps": []}, {"id": "P1080", "text": ["The AM broadcast band uses higher frequencies, called carrier signals to transmit the intelligence."], "jumps": ["P1090", "P1076"]}, {"id": "P1090", "text": ["High frequencies are capable of being transmitted over hundreds of miles."], "jumps": ["P1100", "P1076", "P1078"]}, {"id": "P1091", "text": ["High frequencies are capable of being transmitted over hundreds of miles."], "jumps": ["P1100", "P1070", "P1078"]}, {"id": "P1100", "text": ["Transmitters use carrier frequencies to \"carry\" the intelligence through the atmosphere."], "jumps": ["P1110", "P1091"]}, {"id": "P1110", "text": ["Amplitude modulation occurs when the carrier frequency is altered in amplitude by the lower intelligence frequency."], "jumps": ["P1120", "P1091"]}, {"id": "P1120", "text": ["The low frequency intelligence rides on the high frequency carrier."], "jumps": ["P1130", "P1091"]}, {"id": "P1130", "text": ["This allows the intelligence to be transmitted long distances."], "jumps": ["P1160", "P1091"]}, {"id": "P1160", "text": ["The modulated signal is then transmitted as an electromagnetic wave."], "jumps": ["P1200", "P1091"]}, {"id": "P1162", "text": ["The modulated signal is then transmitted as an electromagnetic wave."], "jumps": ["P1200", "P1091"]}, {"id": "P1165", "text": ["An AM receiver is used to pick up the electromagnetic waves and restore the original low frequency intelligence.", "ELECTROMAGNETIC WAVE - Any class of waves transmitted by a system of electric and magnetic fields."], "jumps": ["P1210", "P1162"]}, {"id": "P1210", "text": ["To operate, a receiver must perform the functions of reception, selection, detection and reproduction."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["Reception is the action of transmitted electromagnetic waves passing through the receiver's antenna."], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["The electromagnetic wave induces a voltage in the antenna that is then processed by the receiver."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["Induced voltage in the antenna is very weak, usually less than 100 micro volts."], "jumps": ["P1250", "P1220"]}, {"id": "P1250", "text": ["Selection is the ability of the receiver to isolate one station's frequency from the many present at the antenna."], "jumps": ["P1300", "P1220"]}, {"id": "P1300", "text": ["Detection is the action of separating the low frequency intelligence from the high frequency carrier."], "jumps": ["P1310", "P1220"]}, {"id": "P1310", "text": ["Reproduction is the action of converting detected intelligence into sound waves that a human can hear."], "jumps": ["P1320", "P1220"]}, {"id": "P1320", "text": ["Touch the waveform that represents a carrier wave that has been modulated by intelligence."], "jumps": ["P1220"]}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1322", "text": ["You did not select the modulated carrier. You selected the intelligence waveform."], "jumps": []}, {"id": "P1323", "text": ["You did not select the modulated carrier. You selected the carrier waveform."], "jumps": []}, {"id": "P1330", "text": ["What is the purpose of a detector?", "What is the purpose of a detector?........................."], "jumps": ["P1320"]}, {"id": "P1331", "text": [], "jumps": []}, {"id": "P1332", "text": ["Selecting one frequency out of the AM broadcast band is called selection."], "jumps": []}, {"id": "P1334", "text": ["Converting the intelligence to sound waves is called reproduction."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on AM RECEIVER BASICS.", "This completes the information on AM RECEIVER BASICS......."], "jumps": ["P1001", "P1330"]}, {"id": "P1920", "text": ["1.  The AM broadcast band covers frequencies from 500 kHz to          1600 kHz.", "1. The AM broadcast band covers frequencies from 500 kHz to 1600 kHz.."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Amplitude Modulation is the action of altering the carrier                  frequency in amplitude by the intelligence frequency.", "2. Amplitude Modulation is the action of altering the carrier frequency in amplitude by the intelligence frequency."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  To operate, a receiver must perform the functions of selection,      detection and reproduction.", "3. To operate, a receiver must perform the functions of selection, detection and reproduction.."], "jumps": ["P1999", "P1930"]}, {"id": "P1999", "text": ["You have completed the Summary.  You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1940"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2050", "text": ["The functional block diagram for an AM receiver consists of four blocks.", "The functional block diagram for an AM receiver consists of four blocks..."], "jumps": ["P2060", "P2001"]}, {"id": "P2063", "text": ["The detector recovers the original audio from the IF signal."], "jumps": ["P2064", "P2068"]}, {"id": "P2064", "text": ["The audio frequency amplifier (AF amplifier) increases the detected audio enough to drive the speaker."], "jumps": ["P2067", "P2068"]}, {"id": "P2100", "text": ["The RF and local oscillator frequencies are combined in the mixer."], "jumps": ["P2110", "P2070"]}, {"id": "P2110", "text": ["The mixer produces four frequencies, the RF, LO, sum and difference frequencies.", "The mixer produces four frequencies, the RF, LO, sum and difference frequencies.."], "jumps": ["P2120", "P2070"]}, {"id": "P2120", "text": ["With a received RF frequency of 1100 kHz the four mixer frequencies are1100 kHz, 1555 kHz, 2655 kHz and 455 kHz.", "RF 1100 kHz LO 1555 kHz LO + RF 2655 kHz LO - RF 455 kHz"], "jumps": ["P2130", "P2070"]}, {"id": "P2130", "text": ["The difference frequency is also called the intermediate frequency (IF).", "RF 1100 kHz LO 1555 kHz LO + RF 2655 kHz LO - RF 455 kHz"], "jumps": ["P2140", "P2070"]}, {"id": "P2140", "text": ["The LO frequency minus the RF frequency equals the IF."], "jumps": ["P2150", "P2070"]}, {"id": "P2065", "text": ["INTERMEDIATE FREQUENCY (IF) - The intermediate frequency is a standard frequency that receivers convert all incoming signals to."], "jumps": []}, {"id": "P2090", "text": ["The local oscillator provides a frequency to mix with the selected RF signal."], "jumps": ["P2095", "P2070"]}, {"id": "P2068", "text": ["The tuner section converts the received RF to an intermediate frequency (IF)."], "jumps": ["P2062", "P2050"]}, {"id": "P2150", "text": ["The most common intermediate frequency found in AM radios is\n455 kHz.", "The most common intermediate frequency found in AM radios is 455 kHz."], "jumps": ["P2160", "P2070"]}, {"id": "P2160", "text": ["For example, if the LO frequency is 1555 kHz and the received signal has a frequency of 1100 kHz then the IF is 455 kHz.", "455 kHzzzz 1100 kHz LO 1555 kHz LO + RF 2655 kHz LO - RF 455 kHz", "1555 kHz - 1100 kHz = 455 kHz 1555 kHz LO + RF 2655 kHz LO - RF 455 kHz", "1100 kHzzz 1100 kHz LO 1555 kHz LO + RF 2655 kHz LO - RF 455 kHz"], "jumps": ["P2170", "P2070"]}, {"id": "P2172", "text": ["The received frequency plus the fixed IF equals the LO frequency."], "jumps": []}, {"id": "P2182", "text": ["The received frequency plus the fixed IF equals the LO frequency."], "jumps": []}, {"id": "PINFO", "text": ["The mixer produces four frequencies, the RF, LO, sum and difference frequencies.", "07-29-99 Converted to new question format. jay 08-02-99 Conversion cleanup steps 1 thru 9 - lisa 08-05-99 Trainer code N/A. debbie 08-11-99 Conversion cleanup steps 10 thru 17 - lisa 11-23-99 P10222 fixed distractor fields. debbie 01-03-00 Fixed all graphic text boxes to inactive - lisa 07-14-00 Converted to ToolBook 7.1 format. jay 09-11-00 P10222, deactivated text boxes. -Penny 10-27-00 Add Monitor Pro code to quiz pages. jay 11-30-00 Added HelpPage information and new random gen. script. -Penny 04-23-01 P2150, changed text from \"The most common intermediate frequency found in radios is 455 kHz.\" to \"The most common intermediate frequency found in AM radios is 455 kHz.\" -GLK & Penny 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-15-02 Phase II Review - lisa 03-20-02", "07-29-99 Converted to new question format. jay 08-02-99 Conversion cleanup steps 1 thru 9 - lisa 08-05-99 Trainer code N/A.  if the LO frequency is 1555 kHz and the received signal has a frequency of 1100 kHz then the IF is 455 kHz.", "455 kHzzzz 1100 kHz LO 1555 kHz LO + RF 2655 kHz LO - RF 455 kHz", "1555 kHz - 1100 kHz = 455 kHz 1555 kHz LO + RF 2655 kHz LO - RF 455 kHz", "1100 kHzzz 1100 kHz LO 1555 kHz LO + RF 2655 kHz LO - RF 455 kHz"], "jumps": ["P2170", "P2070"]}, {"id": "P2170", "text": ["What is the LO frequency if the RF has a frequency of 1540 kHz and the IF has a frequency of 455 kHz?"], "jumps": ["P2070", "P2175"]}, {"id": "P2171", "text": [], "jumps": []}, {"id": "P2181", "text": [], "jumps": []}, {"id": "P2175", "text": ["CALCULATING THE LO FREQUENCY If LO - RF = IF then RF + IF = LO. For example:", "455 kHzzzz 1100 kHz LO 1555 kHz LO + RF 2655 kHz LO - RF 455 kHz", "1555 kHz - 1100 kHz = 455 kHz 1555 kHz LO + RF 2655 kHz LO - RF 455 kHz", "1100 kHzzz 1100 kHz LO 1555 kHz LO + RF 2655 kHz LO - RF 455 kHz", "1705 kHzzz 1100 kHz LO 1555 kHz LO + RF 2655 kHz LO - RF 455 kHz"], "jumps": []}, {"id": "P2180", "text": ["What is the LO frequency if the RF has a frequency of 580 kHz and the IF has a frequency of 455 kHz?"], "jumps": ["P2170"]}, {"id": "P2200", "text": ["The next function on the block diagram is the Intermediate Frequency Amplifier."], "jumps": ["P2210", "P2180"]}, {"id": "P2210", "text": ["The difference frequency (455 kHz) from the tuner is amplified by the IF amplifier stages to a usable level."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["The IF amplifiers also filter out any other frequencies that may be passed from the tuner."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["The amplified signal is sent to the detector next.", "The amplified signal is sent to the detector next.........."], "jumps": ["P2270", "P2210"]}, {"id": "P2270", "text": ["Detection is the process of recovering the original modulation signal from the IF signal."], "jumps": ["P2280", "P2230"]}, {"id": "P2280", "text": ["The detector is normally a diode that is used in conjunction with a series of low pass filters."], "jumps": ["P2285", "P2230"]}, {"id": "P2285", "text": ["The rectifier diode eliminates the positive or the negative audio signal from the carrier."], "jumps": ["P2287", "P2280"]}, {"id": "P2287", "text": ["The RC circuit removes the high frequency 455 kHz from the low frequency audio."], "jumps": ["P2290", "P2280"]}, {"id": "P2290", "text": ["The action of the detector blocks the carrier and passes audio to the AF amplifier."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["The final block in the basic AM receiver is the audio amplifier."], "jumps": ["P2310", "P2280"]}, {"id": "P2310", "text": ["The audio amplifier receives the signal from the detector and amplifies it to a usable level that can drive a speaker."], "jumps": ["P2315", "P2300"]}, {"id": "P2315", "text": ["The AF amplifier consists of a pre-amplifier, a driver and a push-pull amplifier."], "jumps": ["P2320", "P2310"]}, {"id": "P2320", "text": ["The pre-amplifier amplifies the signal level of the incoming signal.", "The AF amplifier consists of a pre-amplifier, a driver and a push-pull amplifier."], "jumps": ["P2330", "P2310"]}, {"id": "P2320", "text": ["The pre-amplifier amplifies the DC level of the incoming signal."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["The driver amplifies the audio signals' current to a level that drives the push-pull amplifier."], "jumps": ["P2340", "P2310"]}, {"id": "P2340", "text": ["The push-pull amplifier increases power to a level that will drive the speaker."], "jumps": ["P2910", "P2310"]}, {"id": "P2910", "text": ["This completes the information on AM RECEIVER BLOCK DIAGRAM.", "This completes the information on AM RECEIVER BLOCK DIAGRAM.."], "jumps": ["P2001", "P2310"]}, {"id": "P2930", "text": ["1.  A basic functional block diagram for an AM receiver consists         of four blocks.", "1. A basic functional block diagram for an AM receiver consists of four blocks."], "jumps": ["P2940", "P2001" let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
