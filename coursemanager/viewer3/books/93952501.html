 or 0.3 Amps, resulting in only 2% of the originals 10 Amps remaining in the circuit, or 0.2 Amps."], "jumps": ["P2350", "P2300"]}, {"id": "P2330", "text": ["At the end of the third time constant, the current again decreases by 63% or 0.9 Amps.  This results in the current dropping to 5% of the original 10 Amps, or 0.5 Amps.", "At the end of the third time constant, the current again decreases by 63% or 0.9 Amps. This results in the current dropping to 5% of the original 10 Amps, or 0.5 Amps."], "jumps": ["P2340", "P2300"]}, {"id": "P2320", "text": ["Time constant two drops the remaining current by 63% (63% of 3.7 Amps) which equals 2.3 Amps.  This leaves 14% of the original current remaining in the circuit and equals 1.4 Amps.", "Time constant two drops the remaining current by 63% (63% of 3.7 Amps) which equals 2.3 Amps. This leaves 14% of the original current remaining in the circuit and equals 1.4 Amps."], "jumps": ["P2330", "P2300"]}, {"id": "P2310", "text": ["In the graph below, the current during T1 drops 63%, leaving 37% of the maximum current (Imax) remaining.  Assuming Imax equaled 10 Amps, at the end of the first time constant, the value of I would be 3.7 Amps.", "In the graph below, the current during T1 drops 63%, leaving 37% of the maximum current (Imax) remaining. Assuming Imax equaled 10 Amps, at the end of the first time constant, the value of I would be 3.7 Amps..."], "jumps": ["P2320", "P2300"]}, {"id": "P2300", "text": ["The time constant graph for a de-energizing inductor can be established much the same as an energizing inductor.  That is, current drops to zero at the same rate, over a period of five time constants.", "The time constant graph for a de-energizing inductor can be established much the same as an energizing inductor. That is, current drops to zero at the same rate, over a period of five time constants..."], "jumps": ["P2310", "P2290"]}, {"id": "P2295", "text": ["Each time constant equates to a 63% increase or decrease in current based upon whether the inductor is energizing or de-energizing."], "jumps": []}, {"id": "P2294", "text": ["This is the value after the first TC.", "This is the value after the first TC......................."], "jumps": []}, {"id": "P2293", "text": ["This is not the correct value.  Check your calculations.", "This is not the correct value. Check your calculations...."], "jumps": []}, {"id": "P2292", "text": ["This is the value following the second TC.", "This is the value following the second TC.................."], "jumps": []}, {"id": "P2291", "text": [], "jumps": []}, {"id": "P2290", "text": ["Using the circuit shown, what is the current value after three time constants?"], "jumps": ["P2280", "P2295"]}, {"id": "P2280", "text": ["More precise calculations can be achieved by using 63.212 as the percentage factor and not rounding the results as severely.  However, for most practical purposes, this is not necessary.", "More precise calculations can be achieved by using 63.212 as the percentage factor and not rounding the results as severely. However, for most practical purposes, this is not necessary."], "jumps": ["P2290", "P2160"]}, {"id": "P2270", "text": ["Since theoretically, 100% can not be achieved, 99% is considered maximum current for time constant calculations.", "Since theoretically, 100% can not be achieved, 99% is considered maximum current for time constant calculations. (same as 2250)", "9.9 amps is considered maximum current.ttttttt"], "jumps": ["P2280", "P2160"]}, {"id": "P2260", "text": ["This leaves roughly .2 amperes of the maximum current remaining at the beginning of the fifth time constant.   63% of 0.2 amperes is approximately 0.1 ampere; bringing the total current, at the end of the fifth time constant, to 99%.", "This leaves roughly .2 amperes of the maximum current remaining at the beginning of the fifth time constant. 63% of 0.2 amperes is approximately 0.1 ampere; bringing the total current, at the end of the fifth time constant, to 99%.", "9.9 amps is considered maximum current.ttttttt"], "jumps": ["P2270", "P2160"]}, {"id": "P2250", "text": ["Time constant four permits the current to rise 63% of the remaining .5 amperes.  This equates to .32 amperes.   Added to the previous value, we now have 9.82 (rounded to 9.8) amperes of total current at the end of the fourth time constant.", "Time constant four permits the current to rise 63% of the remaining .5 amperes. This equates to .32 amperes. Added to the previous value, we now have 9.82 (rounded to 9.8) amperes of total current at the end of the fourth time constant.."], "jumps": ["P2260", "P2160"]}, {"id": "P2240", "text": ["The current increase achieved during the third time constant is added to the sum of the first two time constants for a total current value of 9.5 amperes."], "jumps": ["P2250", "P2160"]}, {"id": "P2230", "text": ["During the third time constant, current increases by 63% of the remaining 1.4 amperes.  This calculates to .882 amperes.  For the purpose of this discussion, we will consider this value as equal to .9 amps.", "During the third time constant, current increases by 63% of the remaining 1.4 amperes. This calculates to .882 amperes. For the purpose of this discussion, we will consider this value as equal to .9 amps..."], "jumps": ["P2240", "P2160"]}, {"id": "P2220", "text": ["The increase during the second time constant is added to that of the first, for a total current of 8.6 amps.  This leaves 1.4 amps until maximum current flows in the circuit.", "The increase during the second time constant is added to that of the first, for a total current of 8.6 amps. This leaves 1.4 amps until maximum current flows in the circuit."], "jumps": ["P2230", "P2160"]}, {"id": "P2210", "text": ["At the completion of the second time constant, current again increases by 63% of the remaining potential.  That is, 63% of 3.7 amperes or a value of 2.3 amps.", "At the completion of the second time constant, current again increases by 63% of the remaining potential. That is, 63% of 3.7 amperes or a value of 2.3 amps."], "jumps": ["P2220", "P2160"]}, {"id": "P2200", "text": ["At the end of the first time constant, the current present in the circuit is 6.3 amps, or 63% of the potential 10 amps."], "jumps": ["P2210", "P2160"]}, {"id": "P2190", "text": ["To demonstrate this, assume that the maximum current in a given RL circuit is 10 amperes."], "jumps": ["P2200", "P2160"]}, {"id": "P2180", "text": ["Maximum current is achieved after the elapse of five (5) time constants."], "jumps": ["P2190", "P2160"]}, {"id": "P2170", "text": ["Each successive time constant represents a current increase of 63% from the existing value to the maximum current potential."], "jumps": ["P2180", "P2160"]}, {"id": "P2160", "text": ["As illustrated, the first RL time constant equates to the time required for the current in an inductor to reach 63% of its maximum potential."], "jumps": ["P2170", "P2150"]}, {"id": "P2150", "text": ["The RL time constant is a valuable tool for use in determining the time required for current in an inductor to reach a specific value."], "jumps": ["P2160", "P2140"]}, {"id": "P2140", "text": ["As with RC series circuits, the time constants of RL series circuits are easily illustrated in graph form.  The major difference being that RC circuits are graphing voltage but in RL circuits, current is the focus.", "As with RC series circuits, the time constants of RL series circuits are easily illustrated in graph form. The major difference being that RC circuits are graphing voltage but in RL circuits, current is the focus..."], "jumps": ["P2150", "P2130"]}, {"id": "P2130", "text": ["Inductors can either be fixed or variable and are normally referred to as coils or chokes.  The term \"choke\" is commonly used for inductors whose application is radio frequency.", "Inductors can either be fixed or variable and are normally referred to as coils or chokes. The term \"choke\" is commonly used for inductors whose application is radio frequency."], "jumps": ["P2140", "P2120"]}, {"id": "P2120", "text": ["The amount of induced voltage produced by an inductor depends on several factors:", "The amount of induced voltage produced by an inductor depends on several factors: Permeability of core material Core cross-sectional area Core length Number of turns", "Permeability of core material Core Cross-sectional area Core length Number of turns", "Permeability of core material Core cross-sectional area Core length Number of turnssss"], "jumps": ["P2130", "P2110"]}, {"id": "P2110", "text": ["The core is made from a variety of materials, commonly a ferromagnetic compound, iron or air."], "jumps": ["P2120", "P2100"]}, {"id": "P2100", "text": ["An inductor consists of a length of wire coiled around a given medium called the core."], "jumps": ["P2110", "P2080"]}, {"id": "P2090", "text": ["Inductance refers to the ability of a conductor to create an induced voltage when current flow through the conductor is varied; such as AC or varying DC."], "jumps": ["P2100", "P2080"]}, {"id": "P2080", "text": ["Through earlier studies of inductors, you have learned about their electrical properties and the effects that they have in circuits.   However, a quick review of inductor basics is appropriate.", "Through earlier studies of inductors, you have learned about their electrical properties and the effects that they have in circuits. However, a quick review of inductor basics is appropriate."], "jumps": ["P2090", "P2070"]}, {"id": "P2070", "text": ["The time required by an RL circuit to rise to maximum current or drop to zero current is based upon the values of the inductor(s) and the resistor(s).  The more inductive the circuit, the longer the time constant, and vice-versa.", "The time required by an RL circuit to rise to maximum current or drop to zero current is based upon the values of the inductor(s) and the resistor(s). The more inductive the circuit, the longer the time constant, and vice-versa...", "More inductive circuit (longer time constant)", "Less inductive circuit (shorter time constant)"], "jumps": ["P2080", "P2050"]}, {"id": "P2060", "text": ["When an inductor is added to the circuit, maximum current flow is no longer instantaneous.  This is due to the inductor opposing current.", "When an inductor is added to the circuit, maximum current flow is no longer instantaneous. This is due to the inductor opposing current. , oh, much slower)"], "jumps": ["P2070", "P2050"]}, {"id": "P2050", "text": ["In the circuit below, when S1 is closed, maximum current flow is instantaneous.", "In the circuit below, when S1 is closed, maximum current flow is instantaneous. super fast!)"], "jumps": ["P2060", "P2030"]}, {"id": "P2040", "text": ["Since there is opposition, it stands to reason that changes in current cannot occur instantaneously.  That is, a certain amount of time must pass for current to change from one value to another.", "Since there is opposition, it stands to reason that changes in current cannot occur instantaneously. That is, a certain amount of time must pass for current to change from one value to another."], "jumps": ["P2050", "P2030"]}, {"id": "P2030", "text": ["A similar activity occurs in RL circuits due to an inductor's characteristic of opposing any change in current."], "jumps": ["P2040", "P2020"]}, {"id": "P2020", "text": ["You have analyzed the capacitive action found in RC circuits using RC Time Constants.  The time constants were based upon the charging and discharging of voltage across the capacitor.", "You have analyzed the capacitive action found in RC circuits using RC Time Constants. The time constants were based upon the charging and discharging of voltage across the capacitor."], "jumps": ["P2030", "P2001"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary.   You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "j nt."], "jumps": ["P1270"]}, {"id": "P1272", "text": ["It takes 4 time constants for a capacitor to reach 98% of the applied voltage. Multiply four times the RC time constant. To find the RC time constant, use the formula: TC = R X C"], "jumps": ["P1270"]}, {"id": "P1271", "text": [], "jumps": ["P1270"]}, {"id": "P1270", "text": ["How long will it take for this capacitor to charge to 98% of the applied voltage?"], "jumps": ["P1260"]}, {"id": "P1265", "text": ["RC TIME CONSTANT - To determine the amount of time for 1 RC time constant use this formula:"], "jumps": ["P1260"]}, {"id": "P1262", "text": ["Remember, the formula provides the time constant in seconds when the resistance is in ohms and capacitance is in farads. Watch metric notation!", "Remember, the formula provides the time constant in seconds when the resistance is in ohms and capacitance is in farads. Watch metric notation! TC = R x C = 2000"], "jumps": ["P1260"]}, {"id": "P1261", "text": [], "jumps": ["P1260"]}, {"id": "P1260", "text": ["What is the RC time constant for this circuit?", "What is the RC time constant for this circuit?............."], "jumps": ["P1160"]}, {"id": "P1250", "text": ["To fully discharge the capacitor takes 5 seconds.", "To fully discharge the capacitor takes 5 seconds. C1= 1 second TC5 = 1 x 5 = 5 seconds"], "jumps": ["P1260", "P1160"]}, {"id": "P1240", "text": ["The time needed for this capacitor to discharge to 37% of the applied voltage (TC1) is 1 second.", "The time needed for this capacitor to discharge to 37% of the applied voltage (TC1) is 1 second. TC = R x C = 1000 x 0.001 = 1 second"], "jumps": ["P1250", "P1160"]}, {"id": "P1210", "text": ["The formula used to determine TC1 for a charging capacitor is also used for a discharging capacitor.", "The formula used to determine TC1 for a charging capacitor is also used for a discharging capacitor. TC = R x C"], "jumps": ["P1240", "P1160"]}, {"id": "P1200", "text": ["The higher the capacitance the more time required to discha let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
