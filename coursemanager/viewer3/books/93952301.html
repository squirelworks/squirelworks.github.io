"]}, {"id": "P1910", "text": ["This completes the information on THE INDUCTOR.", "This completes the information on THE INDUCTOR.ITLE........"], "jumps": ["P1001", "P1410"]}, {"id": "P1413", "text": ["You selected the schematic symbol for an iron core inductor."], "jumps": ["P1410"]}, {"id": "P1412", "text": ["You selected the schematic symbol for an air core inductor."], "jumps": ["P1410"]}, {"id": "P1411", "text": [], "jumps": []}, {"id": "P1410", "text": ["Which symbol represents a variable inductor?", "Which symbol represents a variable inductor?..............."], "jumps": []}, {"id": "P1403", "text": ["You selected the schematic symbol for a variable inductor.  Remember, a variable inductor has an arrow indicating an adjustment.", "You selected the schematic symbol for a variable inductor. Remember, a variable inductor has an arrow indicating an adjustment."], "jumps": ["P1400"]}, {"id": "P1402", "text": ["You selected the schematic symbol of an iron core inductor.  Remember, an iron core inductor has two lines indicating the iron core.", "You selected the schematic symbol of an iron core inductor. Remember, an iron core inductor has two lines indicating the iron core."], "jumps": ["P1400"]}, {"id": "P1401", "text": [], "jumps": ["P1410", "P1400"]}, {"id": "P1400", "text": ["Which symbol represents an air core inductor?", "Which symbol represents an air core inductor?.............."], "jumps": []}, {"id": "P1390", "text": ["The schematic symbol for a variable inductor contains an arrow indicating an adjustment."], "jumps": ["P1400", "P1320"]}, {"id": "P1380", "text": ["Variable inductors vary the value of inductance. This type of inductor is used in transmitters and receivers."], "jumps": ["P1390", "P1320"]}, {"id": "P1370", "text": ["The schematic symbol for an iron core inductor contains two lines indicating the iron core."], "jumps": ["P1380", "P1320"]}, {"id": "P1363", "text": ["This increases the value of inductance for an iron core compared to an air core inductor of the same size."], "jumps": ["P1370", "P1320"]}, {"id": "P1362", "text": ["The iron core enables the inductor to produce a larger magnetic field."], "jumps": ["P1363", "P1320"]}, {"id": "P1360", "text": ["Iron core inductor values are larger due to the conductive material in the core."], "jumps": ["P1362", "P1320"]}, {"id": "P1350", "text": ["The wire used in air core inductors may be supported by a hollow cardboard or plastic tube.  The schematic symbol is a wavy line.", "The wire used in air core inductors may be supported by a hollow cardboard or plastic tube. The schematic symbol is a wavy line........................................................................."], "jumps": ["P1360", "P1320"]}, {"id": "P1340", "text": ["Air core inductors are used as frequency filters and to keep circuit current at a constant level."], "jumps": ["P1350", "P1320"]}, {"id": "P1320", "text": ["There are three classifications of inductors (L):", "There are three classifications of inductors (L):.........."], "jumps": ["P1340", "P1300"]}, {"id": "P1310", "text": ["As current increases, the inductor decreases circuit current.         As current decreases, the inductor increases circuit current.", "As current increases, the inductor decreases circuit current. As current decreases, the inductor increases circuit current."], "jumps": ["P1320", "P1300"]}, {"id": "P1300", "text": ["If an AC voltage is applied to an inductor the current is constantly changing and the inductor is constantly opposing circuit current."], "jumps": ["P1310", "P1220"]}, {"id": "P1290", "text": ["The inductor opposes any change in current in a DC circuit."], "jumps": ["P1300", "P1220"]}, {"id": "P1280", "text": ["When the magnetic field is gone, no voltage is induced and total circuit current is zero."], "jumps": ["P1290", "P1220"]}, {"id": "P1270", "text": ["Induced voltage decreases and total circuit current decreases."], "jumps": ["P1280", "P1220"]}, {"id": "P1250", "text": ["The induced voltage opposes the decreasing current and total circuit current remains at maximum."], "jumps": ["P1270", "P1220"]}, {"id": "P1240", "text": ["A contracting magnetic field induces a voltage in the inductor which has the same polarity as applied voltage."], "jumps": ["P1250", "P1220"]}, {"id": "P1230", "text": ["Current decreases causing the magnetic field to contract in the inductor."], "jumps": ["P1240", "P1220"]}, {"id": "P1220", "text": ["Opening the switch has the opposite effect.", "Opening the switch has the opposite effect................."], "jumps": ["P1230", "P1202"]}, {"id": "P1210", "text": ["Once the current has reached maximum, the inductor no longer opposes circuit current and acts like a short."], "jumps": ["P1220", "P1202"]}, {"id": "P1207", "text": ["Note, the larger increase in current between 0 and 8 amps.  From 8 to 10 amps the change is slower.", "Note, the larger increase in current between 0 and 8 amps. From 8 to 10 amps the change is slower............................."], "jumps": ["P1202", "P1205"]}, {"id": "P1206", "text": ["Graph B shows a non-linear curve.  Non-linear curves are not constant.  The rate of change varies from 0 to 10 amps.", "Graph B shows a non-linear curve. Non-linear curves are not constant. The rate of change varies from 0 to 10 amps............"], "jumps": ["P1207", "P1205"]}, {"id": "P1205", "text": ["NON LINEAR - Graph A shows a linear curve. Linear curves are constant. The rate of change is constant from 0 to 10 amps."], "jumps": ["P1206", "P1202"]}, {"id": "P1202", "text": ["Total circuit current increases rapidly at first and then slows down as current approaches maximum.  Current is non-linear.", "Total circuit current increases rapidly at first and then slows down as current approaches maximum. Current is non-linear....ear ."], "jumps": ["P1210", "P1120"]}, {"id": "P1200", "text": ["Total circuit current increases rapidly at first and then slows down as current approaches maximum.  Current is non-linear.", "Total circuit current increases rapidly at first and then slows down as current approaches maximum. Current is non-linear....ear ."], "jumps": ["P1210", "P1120"]}, {"id": "P1190", "text": ["When the magnetic field reaches a steady state, no voltage is induced and total circuit current is maximum."], "jumps": ["P1200", "P1120"]}, {"id": "P1180", "text": ["Induced voltage decreases and total circuit current increases."], "jumps": ["P1190", "P1120"]}, {"id": "P1170", "text": ["As the magnetic field reaches its maximum strength, the expansion slows down."], "jumps": ["P1180", "P1120"]}, {"id": "P1160", "text": ["The induced voltage opposes the increasing current flow and total circuit current remains at 0 A.", "The induced voltage opposes the increasing current and total circuit current remains at 0 A.", "\"The induced voltage opposes the increasing current"], "jumps": ["P1170", "P1120"]}, {"id": "P1150", "text": ["An expanding magnetic field induces a voltage in the inductor that is opposite to the applied voltage."], "jumps": ["P1160", "P1120"]}, {"id": "P1140", "text": ["Increasing current causes an expanding magnetic field in the inductor."], "jumps": ["P1150", "P1120"]}, {"id": "P1130", "text": ["Closing the switch causes the current in the circuit to increase."], "jumps": ["P1140", "P1120"]}, {"id": "P1120", "text": ["Let's take a closer look at an inductor in a DC circuit.", "Let's take a closer look at an inductor in a DC circuit...."], "jumps": ["P1130", "P1110"]}, {"id": "P1114", "text": ["An inductor requires a change in current to induce voltage. Remember, the magnetic field moves across the conductor to produce voltage in an inductor."], "jumps": []}, {"id": "P1113", "text": ["You are partially correct. Decreasing current does induce a voltage in the inductor, but voltage is also induced when current is increased.", "You are partially correct. Decreasing current does induce a voltage in the inductor, but voltage is also induced when current is increased...."], "jumps": []}, {"id": "P1112", "text": ["You are partially correct. Increasing current does induce a voltage in the inductor, but voltage is also induced when current is decreasing.", "You are partially correct. Increasing current does induce a voltage in the inductor, but voltage is also induced when current is decreasing..."], "jumps": []}, {"id": "P1111", "text": [], "jumps": []}, {"id": "P1110", "text": ["To induce voltage in an inductor, the current flow must be", "To induce voltage in an inductor, the current flow must be."], "jumps": []}, {"id": "P1100", "text": ["If the current is constant, no voltage is induced into the coil of the inductor."], "jumps": ["P1110", "P1082"]}, {"id": "P1090", "text": ["The voltage induced in the inductor is opposite to the voltage applied and opposes the changing current."], "jumps": ["P1100", "P1082"]}, {"id": "P1085", "text": ["MAGNETIC FIELD - Movement between a magnetic field and conductor produces voltage. Normally, voltage is produced by moving the conductor through the magnetic field. Inductors produce voltage by moving the magnetic field across the stationary conductor."], "jumps": []}, {"id": "P1082", "text": ["With changing current in the circuit, the expanding and contracting magnetic field induces a voltage in the coil of the inductor."], "jumps": ["P1090", "P1042"]}, {"id": "P1080", "text": ["With changing current in the circuit, the expanding and contracting magnetic field induces a voltage in the coil of the inductor."], "jumps": ["P1090", "P1042"]}, {"id": "P1070", "text": ["If current flow decreases the magnetic field contracts.", "If current decreases the magnetic field contracts."], "jumps": ["P1080", "P1042"]}, {"id": "P1060", "text": ["If current flow increases, the magnetic field expands.", "If current increases, the magnetic field expands.", "If current flow increases, the magnetic field expands.If current flow increases, the magnetic field expands."], "jumps": ["P1070"]}, {"id": "P1050", "text": ["With the switch closed, the current flow produces a magnetic field in the inductor."], "jumps": ["P1060"]}, {"id": "P1045", "text": ["CORE - A core is the center material of the inductor. The core can be made from insulating material - air core, or from conductive material - iron core."], "jumps": []}, {"id": "P1042", "text": ["The inductor (also called a choke or coil) is constructed by winding wire around a core."], "jumps": ["P1050", "P1020"]}, {"id": "P1040", "text": ["The inductor (also called a choke or coil) is constructed by winding wire around a core."], "jumps": ["P1050", "P1020"]}, {"id": "P1030", "text": ["The reference designator for the inductor is L.", "The reference designator for the inductor is L............."], "jumps": ["P1040", "P1020"]}, {"id": "P1020", "text": ["The inductor is a component that has the ability to concentrate a magnetic field."], "jumps": ["P1030", "P1001"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P430", "text": ["Let's begin the lesson on INTRODUCTION TO INDUCTORS......................."], "jumps": ["P420"]}, {"id": "P420", "text": ["Operation and characteristics of the inductor are described in both AC and DC circuits."], "jumps": ["P430", "P400"]}, {"id": "P410", "text": ["You will learn that inductors have different shapes and values."], "jumps": ["P420", "P400"]}, {"id": "P400", "text": ["This lesson introduces the inductor.  Inductors are simple, yet extremely important electronic devices.", "This lesson introduces the inductor. Inductors are simple, yet extremely important electronic devices."], "jumps": ["P410", "P300"]}, {"id": "P300", "text": [], "jumps": []}, {"id": "P100", "text": ["w Identify characteristics of inductance. w Identify the unit of measurement for inductance.", "w Identify types of inductors. w Describe the current opposing characteristic of an inductor. w Identify the schematic symbol for an inductor."], "jumps": ["P300", "P10"]}, {"id": "P10", "text": [], "ju let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
