const book = {"title": "9395Z105", "pages": [{"id": "P2101", "text": [], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10229", "text": ["Which of the following long range navigational systems do not require external signals to determine change in position?"], "jumps": []}, {"id": "P10228", "text": ["The signals from three GPS satellites would narrow down a receivers locations to _______"], "jumps": []}, {"id": "P10227", "text": ["The main component of the INS is the _______"], "jumps": []}, {"id": "P10226", "text": ["How many received signals does the INS navigational system require?"], "jumps": []}, {"id": "P10225", "text": ["Which segment is comprised of satellites which orbit the earth, in the GPS?"], "jumps": []}, {"id": "P10224", "text": ["Which segment of the GPS monitors the satellites for correct transmissions, and corrects them when they are off?"], "jumps": []}, {"id": "P10223", "text": ["How many satellites are required to determine the location of an aircraft using the GPS navigational system?"], "jumps": []}, {"id": "P10222", "text": ["How many different station signals are required to determine a plane's location with the VLF/OMEGA navigational system?"], "jumps": []}, {"id": "P10221", "text": ["The procedure used by the VLF/OMEGA computer to determine the station of the received signals is known as?"], "jumps": []}, {"id": "P10220", "text": ["What is the approximate number of VLF/OMEGA transmitting sites located on the earth?"], "jumps": []}, {"id": "P10219", "text": ["The option inner marker, located about 1500 feet from the end of the runway, flashes what color light on the instrument panel?"], "jumps": []}, {"id": "P10218", "text": ["The outer marker beacon, located about 5 miles from the runway, flashes what color light on the instrument panel?"], "jumps": []}, {"id": "P10217", "text": ["Which signal transmitter is used to guide an aircraft performing an instrument approach in the vertical axis?"], "jumps": []}, {"id": "P10216", "text": ["What type of radio station is used with the DME systems?"], "jumps": []}, {"id": "P10215", "text": ["Which of the following is NOT a component of the ADF system?"], "jumps": []}, {"id": "P10214", "text": ["The direction of how many radio stations is needed to determine an aircraft's position?"], "jumps": []}, {"id": "P10213", "text": ["ADF systems determine the _______ of a radio station?"], "jumps": []}, {"id": "P10212", "text": ["The radio setting for the VOR equipment is known as _______"], "jumps": []}, {"id": "P10211", "text": ["The signals which are transmitted by the VOR stations are referred to as _______"], "jumps": []}, {"id": "P10210", "text": ["Which of the following is NOT a short range navigational system?"], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P430", "text": ["After looking at the different navigational systems, you will understand their operation and importance to the pilot.  Without   some of these systems, plane navigation would be very difficult,   especially at high altitudes.", "After looking at the different navigational systems, you will understand their operation and importance to the pilot. Without some of these systems, plane navigation would be very difficult, especially at high altitudes."], "jumps": ["P440", "P400"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P2940", "text": ["3.  The INS, Inertial Navigation (reference) System, does not use          received signals.  Instead the INS determines position based         on initial coordinates from the pilot and accelerometers.", "3. The INS, Inertial Navigation (reference) System, does not use received signals. Instead the INS determines position based on initial coordinates from the pilot and accelerometers.", "Current N/S Velocity : 250 mph N Current Position : N 50"], "jumps": ["P2999", "P2930"]}, {"id": "P10001", "text": ["1.  The VLF/OMEGA system utilizes low frequency signals to               determine the position of an aircraft based on initial                           coordinates entered by the pilot.  This system is not position         seeking and requires at least two received signals.", "You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")", "1. The VLF/OMEGA system utilizes low frequency signals to determine the position of an aircraft based on initial coordinates entered by the pilot. This system is not position seeking and requires at least two received signals."], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P2020", "text": ["There are three different types of long range navigational systems that we are going to discuss in this section.  The first system we are going to talk about is the VLF/OMEGA navigational system.", "There are three different types of long range navigational systems that we are going to discuss in this section. The first system we are going to talk about is the VLF/OMEGA navigational system."], "jumps": ["P2030", "P2001"]}, {"id": "P1040", "text": ["The VOR transmitter, again located on the ground, continuously transmits radio signals in all directions known as radials.  These   radials are what the aircraft will be receiving and analyzing to      determine the status of the plane's position.", "The VOR transmitter, again located on the ground, continuously transmits radio signals in all directions known as radials. These radials are what the aircraft will be receiving and analyzing to determine the status of the plane's position."], "jumps": ["P1050", "P1030"]}, {"id": "P1111", "text": [], "jumps": []}, {"id": "P2910", "text": ["This completes the information on LONG RANGE NAVIGATIONAL SYSTEMS."], "jumps": ["P2001", "P2400"]}, {"id": "P1110", "text": ["The radio signals transmitted by the VOR stations are known as?", "However, many planes today have systems designed to re-align the INS in flight using data from different systems of the aircraft. Lastly, the gyro assembly of the accelerometer keeps the mass from changing position due to the pitch, roll, or yaw changes of the plane.", "Accelerometer remains in the same position"], "jumps": ["P1100", "P2370", "P2320"]}, {"id": "P2370", "text": ["If an accelerometer didn't stay level, just a change in pitch would register on the accelerometer giving incorrect indications.  That is why it is very important to keep the accelerometer assembly in its initial position.", "If an accelerometer didn't stay level, just a change in pitch would register on the accelerometer giving incorrect indications. That is why it is very important to keep the accelerometer assembly in its initial position."], "jumps": ["P2380", "P2360"]}, {"id": "P2380", "text": ["Most planes today have multiple independent INS systems.  The flight management computer (FMC) compares the output of all the systems and disregards the input from an INS system out of tolerance.", "Most planes today have multiple independent INS systems. The flight management computer (FMC) compares the output of all the systems and disregards the input from an INS system out of tolerance."], "jumps": ["P2390", "P2370"]}, {"id": "P2391", "text": ["How many received signals does the INS system require?", "How many received signals does the INS system require?....."], "jumps": []}, {"id": "P2920", "text": ["1.  The VLF/OMEGA system utilizes low frequency signals to               determine the position of an aircraft based on initial                           coordinates entered by the pilot.  This system is not position         seeking and requires at least two received signals.", "1. The VLF/OMEGA system utilizes low frequency signals to determine the position of an aircraft based on initial coordinates entered by the pilot. This system is not position seeking and requires at least two received signals."], "jumps": ["P2930", "P2001"]}, {"id": "P2392", "text": ["Remember, the major advantage to the INS system is the fact that it doesn't use received signals, it is a self contained system."], "jumps": []}, {"id": "P2390", "text": ["How many received signals does the INS system require?", "How many received signals does the INS system require?....."], "jumps": ["P2380"]}, {"id": "P2351", "text": [], "jumps": []}, {"id": "P2270", "text": ["The heart of the INS is the accelerometer.  This device measures an aircraft's acceleration, which is therefore used to calculate        velocity and position.  An accelerometer can measure acceleration in only two directions, which means more than one is used.", "The heart of the INS is the accelerometer. This device measures an aircraft's acceleration, which is therefore used to calculate velocity and position. An accelerometer can measure acceleration in only two directions, which means more than one is used.", "Current N/S Velocity : 250 mph N Current Position : N 50"], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["Even though a basic INS system only requires two accelerometers, most aircraft use three.  This provides acceleration measurements in all axes.  There are two basic types of accelerometers in use today; conventional gyro, and solid-state gyro.", "Even though a basic INS system only requires two accelerometers, most aircraft use three. This provides acceleration measurements in all axes. There are two basic types of accelerometers in use today; conventional gyro, and solid-state gyro."], "jumps": ["P2290", "P2270"]}, {"id": "P2400", "text": ["Today, Flight Management Computers (FMC) are used to greatly reduce the error of all systems.  An FMC will monitor the information from all navigational systems and determine which values are correct.  If a systems information isn't correct it is either reset or disregarded.", "Today, Flight Management Computers (FMC) are used to greatly reduce the error of all systems. An FMC will monitor the information from all navigational systems and determine which values are correct. If a systems information isn't correct it is either reset or disregarded."], "jumps": ["P2910", "P2390"]}, {"id": "P2930", "text": ["2.  The GPS, global positioning system, uses signals received             from satellites to determine the position of an aircraft.  This             system requires at least four different satellite transmissions,         and is very accurate.", "2. The GPS, global positioning system, uses signals received from satellites to determine the position of an aircraft. This system requires at least four different satellite transmissions, and is very accurate."], "jumps": ["P2940", "P2920"]}, {"id": "P2999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2940"]}, {"id": "P2300", "text": ["The newer solid state gyro accelerometers use a laser gyro.  The laser gyro is much more accurate and provides less error in the    operation of the INS.", "The newer solid state gyro accelerometers use a laser gyro. The laser gyro is much more accurate and provides less error in the operation of the INS."], "jumps": ["P2310", "P2280"]}, {"id": "P2330", "text": ["As the plane begins to accelerate, the mass tries to stay at the same speed, making it move in the opposite direction of the          movement.  This movement is measured with extremely sensitive equipment.", "As the plane begins to accelerate, the mass tries to stay at the same speed, making it move in the opposite direction of the movement. This movement is measured with extremely sensitive equipment."], "jumps": ["P2340", "P2320"]}, {"id": "P2230", "text": ["This is one of the main reasons that the GPS is becoming the standard for long range navigation.  Hand held GPS systems are also available and used in aircraft, boats, and automobiles.", "This is one of the main reasons that the GPS is becoming the standard for long range navigation. Hand held GPS systems are also available and used in aircraft, boats, and automobiles."], "jumps": ["P2240", "P2170"]}, {"id": "P2260", "text": ["The last navigational system we are going to discuss is the Inertial Navigational System (INS), also known as the Inertial Reference System (IRS).  This system does not require external signals, like the VLF/OMEGA and GPS systems.", "The last navigational system we are going to discuss is the Inertial Navigational System (INS), also known as the Inertial Reference System (IRS). This system does not require external signals, like the VLF/OMEGA and GPS systems."], "jumps": ["P2270", "P2250"]}, {"id": "P1090", "text": ["Most planes will use many VOR transmitters to accomplish a flight.  The example below shows how a plane followed one radial from one VOR station until it reached another radial that it needed to follow from another VOR station.", "Most planes will use many VOR transmitters to accomplish a flight. The example below shows how a plane followed one radial from one VOR station until it reached another radial that it needed to follow from another VOR station.", "Approximately halfway between both stations"], "jumps": ["P1100", "P1080"]}, {"id": "P1160", "text": ["On most aircraft there are two frequency settings for the ADF control panel.  This is because with the direction of two radio      stations, a position can be plotted on a course chart.", "On most aircraft there are two frequency settings for the ADF control panel. This is because with the direction of two radio stations, a position can be plotted on a course chart."], "jumps": ["P1170", "P1130"]}, {"id": "P2091", "text": [], "jumps": []}, {"id": "P2250", "text": ["Which segment of the GPS monitors the satellites for correct transmissions, and corrects them if they are incorrect?"], "jumps": ["P2240"]}, {"id": "P2310", "text": ["Like the VLF/OMEGA system, the initial position of an aircraft must be entered into a computer.  The computer refines the position and monitors the accelerometers to update the position during flight.", "Like the VLF/OMEGA system, the initial position of an aircraft must be entered into a computer. The computer refines the position and monitors the accelerometers to update the position during flight."], "jumps": ["P2320", "P2280"]}, {"id": "P2200", "text": ["As we bring in an additional satellite, the intersection of the spheres creates a circle.  This then indicates to the GPS that the   plane is located somewhere on this circle.  Now we bring in a third satellites data.", "As we bring in an additional satellite, the intersection of the spheres creates a circle. This then indicates to the GPS that the plane is located somewhere on this circle. Now we bring in a third satellites data."], "jumps": ["P2210", "P2170"]}, {"id": "P2340", "text": ["A motor known as a torquer returns the mass to its initial position.  A computer is fed this information and determines speed and position from these acceleration changes.  This is why the INS must be aligned when the plane is at rest.", "A motor known as a torquer returns the mass to its initial position. A computer is fed this information and determines speed and position from these acceleration changes. This is why the INS must be aligned when the plane is at rest."], "jumps": ["P2350", "P2320"]}, {"id": "P2350", "text": ["If you attempted an INS ground alignment while the plane was moving, the system would not sense the acceleration as forward movement and deceleration would be sensed as the aircraft flying in reverse."], "jumps": ["P2360", "P2320"]}, {"id": "P2240", "text": ["How many satellites are required to determine the location of a GPS receiver?"], "jumps": ["P2170"]}, {"id": "P2160", "text": ["A change in the accuracy of a satellites transmissions can be caused by drift.  In other words, the orbit path of the satellite has  changed for some reason.  Drift is a change in the orbit path of a  satellite.", "The control segment is used to control the satellites.  At least once a day various ground stations will receive the information from all of the satellites and send that information to a master control station.", "A change in the accuracy of a satellites transmissions can be caused by drift. In other words, the orbit path of the satellite has changed for some reason. Drift is a change in the orbit path of a satellite.", "The control segment is used to control the satellites. At least once a day various ground stations will receive the information from all of the satellites and send that information to a master control station."], "jumps": ["P2170", "P2140", "P2150", "P2110"]}, {"id": "P2150", "text": ["It is here that the information from each of the GPS satellites is analyzed.  The master control station will send correction signals back to the satellites if their information is not correct.  These     signals will recalibrate the satellite's data.", "The first segment we will discuss is the space segment.  This is a group of satellites that are located in space, orbiting earth.  There are a total of 24 satellites, 21 which are active, and 3 for backup.", "It is here that the information from each of the GPS satellites is analyzed. The master control station will send correction signals back to the satellites if their information is not correct. These signals will recalibrate the satellite's data.", "The first segment we will discuss is the space segment. This is a group of satellites that are located in space, orbiting earth. There are a total of 24 satellites, 21 which are active, and 3 for backup."], "jumps": ["P2160", "P2140", "P2130", "P2110"]}, {"id": "P2180", "text": ["This equipment, called a GPS receiver, requires the information from at least four satellites to determine its location.  Below is a simplified view of a GPS receiver on a plane trying to determine its location from a single satellite.", "This equipment, called a GPS receiver, requires the information from at least four satellites to determine its location. Below is a simplified view of a GPS receiver on a plane trying to determine its location from a single satellite."], "jumps": ["P2190", "P2170"]}, {"id": "P2102", "text": ["Remember, the process for determining the location of a station transmitting the received signals is known as commutation.  By    determining the location of at least two stations, a change in       position from initial coordinates can be determined.", "Remember, the process for determining the location of a station transmitting the received signals is known as commutation. By determining the location of at least two stations, a change in position from initial coordinates can be determined....."], "jumps": []}, {"id": "P2251", "text": ["These satellites continuously transmit both an extremely accurate timing signal, and a coded message which tells the exact location of the satellite.  This information will be used by both the control segment and the user segment.", "These satellites continuously transmit both an extremely accurate timing signal, and a coded message which tells the exact location of the satellite. This information will be used by both the control segment and the user segment."], "jumps": []}, {"id": "P2092", "text": ["There are approximately 20 VLF/OMEGA stations world wide. Each station broadcasts a signal covering half the worlds surface.  The information provided by the VLF/OMEGA's very accurate and easy to commutate.", "There are approximately 20 VLF/OMEGA stations world wide. Each station broadcasts a signal covering half the worlds surface. The information provided by the VLF/OMEGA's very accurate and easy to commutate........."], "jumps": []}, {"id": "P2090", "text": ["There are less VLF/OMEGA transmitters world wide than VOR's because _______", "VLF/OMEGA transmitters do not provide accurate latitude and longitude positions.", "VLF/OMEGA signals are difficult to receive.", "VLF/OMEGA transmitters broadcast signals over half the worlds surface."], "jumps": ["P2070"]}, {"id": "P2130", "text": ["These satellites continuously transmit both an extremely accurate timing signal, and a coded message which tells the exact location of the satellite.  This information will be used by both the control segment and the user segment.", "These satellites continuously transmit both an extremely accurate timing signal, and a coded message which tells the exact location of the satellite. This information will be used by both the control segment and the user segment."], "jumps": ["P2140", "P2120"]}, {"id": "P2060", "text": ["Change in position is determined from signals received from at least two VLF/OMEGA stations.  Since each station blankets half the world with signals, there is no where on earth where two signals cannot be received.", "Change in position is determined from signals received from at least two VLF/OMEGA stations. Since each station blankets half the world with signals, there is no where on earth where two signals cannot be received."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["The computer will sort out the received signals and determine which stations it has received, using a process known as commutation.  This information is then used by the computer to calculate the change in position in reference to the starting coordinates.", "The computer will sort out the received signals and determine which stations it has received, using a process known as commutation. This information is then used by the computer to calculate the change in position in reference to the starting coordinates."], "jumps": ["P2080", "P2060"]}, {"id": "P2050", "text": ["The VLF/OMEGA navigational system is not a position seeking system.  Coordinates must be entered into a computer when starting this system.  Then, the computer will determine the change in position and apply them to these coordinates.", "The VLF/OMEGA navigational system is not a position seeking system. Coordinates must be entered into a computer when starting this system. Then, the computer will determine the change in position and apply them to these coordinates."], "jumps": ["P2060", "P2040"]}, {"id": "P2241", "text": ["t system we are going to talk about is the VLF/OMEGA navigational system."], "jumps": []}, {"id": "P2001", "text": ["LONG RANGE NAVIGATIONAL SYSTEMSSSSSSSSSSS"], "jumps": []}, {"id": "P1280", "text": ["The output from an ILS receiver is fed to the Course Deviation Indicator (CDI).  The pilot can then monitor the CDI to see if the      plane is still on glide path or angle.  If the pilot deviates from      the path he should adjust the plane until the pointers are correct.", "The output from an ILS receiver is fed to the Course Deviation Indicator (CDI). The pilot can then monitor the CDI to see if the plane is still on glide path or angle. If the pilot deviates from the path he should adjust the plane until the pointers are correct.", "e are at least two marker beacon transmitters which inform the pilot at certain distances. When a pilot reached these points he is alerted both visually and aurally."], "jumps": ["P1290", "P1240"]}, {"id": "P2040", "text": ["The advantage of VLF/OMEGA is the greater area that one station's signals can cover.  There are thousands of VOR stations world wide and approximately 20 VLF/OMEGA stations world wide.", "The advantage of VLF/OMEGA is the greater area that one station's signals can cover. There are thousands of VOR stations world wide and approximately 20 VLF/OMEGA stations world wide."], "jumps": ["P2050", "P2030"]}, {"id": "P2110", "text": ["The Global Positioning System (GPS) is the next long range navigational system we are going to look at.  There are three          different sections to the GPS; space segment, control segment, the user segment.", "The Global Positioning System (GPS) is the next long range navigational system we are going to look at. There are three different sections to the GPS; space segment, control segment, the user segment."], "jumps": ["P2120", "P2100"]}, {"id": "P1940", "text": ["3.  DME: Distance Measuring Equipment is used to determine the      distance from a VORTAC station.  A VORTAC station is a radio      station that transmits both VOR and TACAN signals.", "3. DME: Distance Measuring Equipment is used to determine the distance from a VORTAC station. A VORTAC station is a radio station that transmits both VOR and TACAN signals."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  ILS: The Instrument Landing System (ILS) is a system                      designed to aid a pilot in landing an airplane.  This is very               helpful when landing conditions are poor.  It provides the pilot      with glide path and center of runway information.", "4. ILS: The Instrument Landing System (ILS) is a system designed to aid a pilot in landing an airplane. This is very helpful when landing conditions are poor. It provides the pilot with glide path and center of runway information."], "jumps": ["P1960", "P1940"]}, {"id": "P2080", "text": ["The output from the computer is an accurate latitude and longitude position based on the initial coordinates.  The only major disadvantages of the system are the need for external reference signals, and initial coordinates.", "The output from the computer is an accurate latitude and longitude position based on the initial coordinates. The only major disadvantages of the system are the need for external reference signals, and initial coordinates."], "jumps": ["P2090", "P2070"]}, {"id": "P1910", "text": ["This completes the information on SHORT RANGE NAVIGATIONAL SYSTEMS."], "jumps": ["P1001", "P1390"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1970"]}, {"id": "P1392", "text": ["It is the inner marker that causes a white light to flash on the instrument panel of an aircraft."], "jumps": []}, {"id": "P1393", "text": ["It is the outer marker that causes a blue light to flash on the instrument panel of an aircraft."], "jumps": []}, {"id": "P1920", "text": ["1.  VOR:  There are three main components to the VOR system;          transmitter, receiver, and indicator.  The VOR system uses              radio signals known as radials to aid a pilot in flying a plane           to a designated location.", "1. VOR: There are three main components to the VOR system; transmitter, receiver, and indicator. The VOR system uses radio signals known as radials to aid a pilot in flying a plane to a designated location."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  ADF: There are three main components associated with the           ADF; the loop antenna, ADF control panel, and the Radio                Magnetic Indicator   (or radio compass).  This system is used         to determine the direction of radio stations from their radio             signals.", "2. ADF: There are three main components associated with the ADF; the loop antenna, ADF control panel, and the Radio Magnetic Indicator (or radio compass). This system is used to determine the direction of radio stations from their radio signals.", "Radio Magnetic Indicator (Radio Compass)"], "jumps": ["P1940", "P1920"]}, {"id": "P1970", "text": ["6.  Compass: On all aircraft, the compass is the direction seeking       back-up instrument.  This instrument requires no power.", "6. Compass: On all aircraft, the compass is the direction seeking back-up instrument. This instrument requires no power."], "jumps": ["P1999", "P1960"]}, {"id": "P1302", "text": ["The glide slope helps the pilot to maintain a correct glide angle and the localizer guides the pilot to the center of the runway."], "jumps": []}, {"id": "P1300", "text": ["Which transmitter system provides information to the aircraft instruments about the angle used for landing?"], "jumps": ["P1290"]}, {"id": "P1370", "text": ["The compass will indicate to the pilot the direction the plane is heading.  The only time the compass reading becomes inaccurate is when nearing the north or south poles of the earth. This is where the pilot would use an instrument called the heading indicator.", "These beacons provide an accurate measure of distance from the runway.  The marker beacon receivers are automatically turned on when the aircraft master power switch is activated. They do not require any setting from the pilot.", "The compass will indicate to the pilot the direction the plane is heading. The only time the compass reading becomes inaccurate is when nearing the north or south poles of the earth. This is where the pilot would use an instrument called the heading indicator.", "These beacons provide an accurate measure of distance from the runway. The marker beacon receivers are automatically turned on when the aircraft master power switch is activated. They do not require any setting from the pilot."], "jumps": ["P1390", "P1360", "P1310"]}, {"id": "P1280", "text": ["The output from an ILS receiver is fed to the Course Deviation Indicator (CDI).  The pilot can then monitor the CDI to see if the      plane is still on glide path or angle.  If the pilot deviates from      the path he should adjust the plane until the pointers are correct.", "The glide slope also generates two signals, except they are in the vertical plane.  These signals come from a location about\n15 percent  from the beginning of the runway and off to one of the sides.", "The output from an ILS receiver is fed to the Course Deviation Indicator (CDI). The pilot can then monitor the CDI to see if the plane is still on glide path or angle. If the pilot deviates from the path he should adjust the plane until the pointers are correct.", "The glide slope also generates two signals, except they are in the vertical plane. These signals come from a location about 15 percent from the beginning of the runway and off to one of the sides."], "jumps": ["P1290", "P1240"]}, {"id": "P1350", "text": ["These beacons provide an accurate measure of distance from the runway.  The marker beacon receivers are automatically turned on when the aircraft master power switch is activated. They do not require any setting from the pilot.", "These beacons provide an accurate measure of distance from the runway. The marker beacon receivers are automatically turned on when the aircraft master power switch is activated. They do not require any setting from the pilot."], "jumps": ["P1360", "P1310"]}, {"id": "P1391", "text": [], "jumps": []}, {"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 02-21-00 Changed copyright date on page Q0 to 1999-2000. Penny 03-09-00 Changed the red mat on the main window viewer to blue. Changed the high yellow word in text field of definition p LS systems, like the Category IIIC ILS system, can assist the landing of planes in almost zero visibility.   Basically all ILS systems provide instrument assistance to the pilot  when landing.", "Other more complex ILS systems, like the Category IIIC ILS system, can assist the landing of planes in almost zero visibility. Basically all ILS systems provide instrument assistance to the pilot when landing.", "visibility. Basically all ILS systems provide instrument assistance to the pilot when landing."], "jumps": ["P1260", "P1240"]}, {"id": "P1220", "text": ["Most radios that incorporate DME will automatically change their station settings as the NAV station is changed.  Remember, the NAV setting is used by the VOR equipment.", "Most radios that incorporate DME will automatically change their station settings as the NAV station is changed.  Remember, the NAV setting is used by the VOR equipment.", "Most radios that incorporate DME will automatically change their station settings as the NAV station is changed. Remember, the NAV setting is used by the VOR equipment."], "jumps": ["P1230", "P1200"]}, {"id": "P1200", "text": ["Distance Measuring Equipment is used to determine the distance from a VORTAC station.  A VORTAC station is a radio station that transmits both VOR and TACAN signals.", "Distance Measuring Equipment is used to determine the distance from a VORTAC station. A VORTAC station is a radio station that transmits both VOR and TACAN signals..."], "jumps": ["P1210", "P1190"]}, {"id": "P1260", "text": ["Near the runway there are two types of signal generators; the localizer and the glide slope.  The localizer transmits from           approximately 1000 feet from the end of the runway.  The localizer transmits two horizontal signals which the plane will use to determine the center of the runway.", "Near the runway there are two types of signal generators; the localizer and the glide slope. The localizer transmits from approximately 1000 feet from the end of the runway. The localizer transmits two horizontal signals which the plane will use to determine the center of the runway."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["The glide slope also generates two signals, except they are in the vertical plane.  These signals come from a location about\n15 percent  from the beginning of the runway and off to one of the sides.", "The glide slope also generates two signals, except they are in the vertical plane. These signals come from a location about 15 percent from the beginning of the runway and off to one of the sides."], "jumps": ["P1280", "P1240"]}, {"id": "P1290", "text": ["It is important to note that basic ILS systems will bring the plane within 200 feet of the runway.  At this point the pilot of the          aircraft will determine if landing is possible.  If not the pilot will perform missed approached procedures and try again.", "It is important to note that basic ILS systems will bring the plane within 200 feet of the runway. At this point the pilot of the aircraft will determine if landing is possible. If not the pilot will perform missed approached procedures and try again."], "jumps": ["P1300", "P1280"]}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1210", "text": ["The DME component of an aircraft known as the interrogator will send a signal to the transponder, located at the VORTAC station. The transponder will then transmit a signal back to the interrogator.  The DME then calculates the time it took to receive this signal and converts this time into a distance value.", "The DME component of an aircraft known as the interrogator will send a signal to the transponder, located at the VORTAC station. The transponder will then transmit a signal back to the interrogator.  The DME then calculates the time it took to receive this signal and converts this time into a distance value.", "The DME component of an aircraft known as the interrogator will send a signal to the transponder, located at the VORTAC station. The transponder will then transmit a signal back to the interrogator. The DME then calculates the time it took to receive this signal and converts this time into a distance value."], "jumps": ["P1220", "P1200"]}, {"id": "P1190", "text": ["How many different ADF signals are used to determine the position of an aircraft on a course chart?"], "jumps": ["P1170"]}, {"id": "P1230", "text": ["What type of radio station can be used to perform distance measurements?", "However, on most of today's ADF systems the antenna turns electrically and not mechanically.  The ADF control panel is used to set the frequency of the desired station.", "However, on most of today's ADF systems the antenna turns electrically and not mechanically. The ADF control panel is used to set the frequency of the desired station."], "jumps": ["P1200", "P1130"]}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1240", "text": ["The Instrument Landing System (ILS) is a system designed to aid a pilot in landing an airplane.  This is very helpful when landing     conditions are poor.  Most ILS systems are accurate to a half mile, meaning visual references are still necessary.", "The Instrument Landing System (ILS) is a system designed to aid a pilot in landing an airplane. This is very helpful when landing conditions are poor. Most ILS systems are accurate to a half mile, meaning visual references are still necessary."], "jumps": ["P1250", "P1230"]}, {"id": "P1301", "text": [], "jumps": []}, {"id": "P1310", "text": ["Even though the ILS system assists the pilot in landing, it normally doesn't give an indication of the distance to the end of the runway.  Marker beacons are used to indicate distance from the end of the runway.", "Even though the ILS system assists the pilot in landing, it normally doesn't give an indication of the distance to the end of the runway. Marker beacons are used to indicate distance from the end of the runway."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["The first marker beacon the aircraft encounters is the outer marker, it is 5 miles from the end of the runway.  When the aircraft passes over the marker a blue light begins flashing on the instrument panel and a buzzer will sound.", "The first marker beacon the aircraft encounters is the outer marker, it is 5 miles from the end of the runway. When the aircraft passes over the marker a blue light begins flashing on the instrument panel and a buzzer will sound."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["As the plane approaches 2/3 of a mile an amber light will begin to flash and a higher pitched buzzer will begin to sound.  This means the aircraft is over the middle marker.", "As the plane approaches 2/3 of a mile an amber light will begin to flash and a higher pitched buzzer will begin to sound. This means the aircraft is over the middle marker."], "jumps": ["P1340", "P1310"]}, {"id": "P1340", "text": ["Some airports have an inner marker. It is located 1500 feet from the end of the runway.  When the aircraft is over this marker a white light flashes.  This is an optional beacon.", "Some airports have an inner marker. It is located 1500 feet from the end of the runway. When the aircraft is over this marker a white light flashes. This is an optional beacon."], "jumps": ["P1350", "P1310"]}, {"id": "P1360", "text": ["The last navigational system covered in this section will be the compass.  On all aircraft, the compass is the direction seeking       back-up instrument.  This instrument requires no power.", "The last navigational system covered in this section will be the compass. On all aircraft, the compass is the direction seeking back-up instrument. This instrument requires no power."], "jumps": ["P1370", "P1310"]}, {"id": "P1080", "text": ["Most auto pilot systems will pilot the plane using the VOR settings.  An auto pilot will follow the radials until the signal becomes too weak, in which the pilot is informed of this problem.", "Most auto pilot systems will pilot the plane using the VOR settings. An auto pilot will follow the radials until the signal becomes too weak, in which the pilot is informed of this problem.", "This setting tells the Auto pilot to follow the VOR settings.."], "jumps": ["P1090", "P1040"]}, {"id": "P1060", "text": ["This circle is divided up into 360 degrees.  Also notice that the zero points to the north.  A pilot can navigate on any of the\n360 degrees by adjusting a VOR indicator to the heading of his choice.", "This circle is divided up into 360 degrees. Also notice that the zero points to the north. A pilot can navigate on any of the 360 degrees by adjusting a VOR indicator to the heading of his choice."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["Once a pilot has entered a desired heading, the needles on the VOR indicator will tell the pilot how much he has deviated from this desired course.  The VOR indicator also indicates whether the plane is moving to or from the VOR transmitter.", "Once a pilot has entered a desired heading, the needles on the VOR indicator will tell the pilot how much he has deviated from this desired course. The VOR indicator also indicates whether the plane is moving to or from the VOR transmitter."], "jumps": ["P1080", "P1040"]}, {"id": "P1100", "text": ["This is why many planes have two NAV radio settings.  One can be set while the other one is being used.  This allows for simultaneous switching.  Remember, VOR is one of the most common navigational systems.", "This is why many planes have two NAV radio settings. One can be set while the other one is being used. This allows for simultaneous switching. Remember, VOR is one of the most common navigational systems."], "jumps": ["P1110", "P1090"]}, {"id": "P1030", "text": ["There are three main components to the VOR system; transmitter, receiver, and indicator.  The VOR transmitter is located on the ground, while the other two components are located on the aircraft.", "There are three main components to the VOR system; transmitter, receiver, and indicator. The VOR transmitter is located on the ground, while the other two components are located on the aircraft."], "jumps": ["P1040", "P1020"]}, {"id": "P1140", "text": ["The loop antenna is what receives the signals from the radio stations.  On some ADF systems the loop actually turns.  This is   because the ADF system will position the antenna for the best       reception.  This position then represents the heading of the radio transmitter.", "The loop antenna is what receives the signals from the radio stations. On some ADF systems the loop actually turns. This is because the ADF system will position the antenna for the best reception. This position then represents the heading of the radio transmitter."], "jumps": ["P1150", "P1130"]}, {"id": "P420", "text": ["In the second section we will look at long range navigational systems.  These include systems like the Global Positioning System, and the Inertial Navigation System.", "In the second section we will look at long range navigational systems. These include systems like the Global Positioning System, and the Inertial Navigation System."], "jumps": ["P430", "P400"]}, {"id": "P1001", "text": ["SHORT RANGE NAVIGATIONAL SYSTEMSSSSSSSSSS", "In the second section we will look at long range navigational systems. These include systems like the Global Positioning System, and the Inertial Navigation System."], "jumps": []}, {"id": "P2030", "text": ["The VLF/OMEGA system transmits Very Low Frequency radials.", "The VLF/OMEGA system transmits Very Low Frequency radials.."], "jumps": ["P2040", "P2020"]}, {"id": "P400", "text": ["In this lesson we will talk about navigational systems.  These systems are used together to aid a pilot in flying a plane to its     correct destination.  Without this equipment, early pilots had to      navigate by landmarks at low altitudes.", "In this lesson we will talk about navigational systems. These systems are used together to aid a pilot in flying a plane to its correct destination. Without this equipment, early pilots had to navigate by landmarks at low altitudes."], "jumps": ["P410", "P300"]}, {"id": "P1150", "text": ["However, on most of today's ADF systems the antenna turns electrically and not mechanically.  The ADF control panel is used to set the frequency of the desired station.", "However, on most of today's ADF systems the antenna turns electrically and not mechanically. The ADF control panel is used to set the frequency of the desired station."], "jumps": ["P1160", "P1130"]}, {"id": "P100", "text": ["w Describe the operation of the VHF Omnirange system (VOR). w Describe the operation of the Automatic Direction- Finder System (ADF). w Describe the operation of Distance Measuring Equipment (DME). w Identify TACAN and its use with DME. w Describe the operation of the Instrument Landing System (ILS). w Describe the operation of Marker Beacons. w Identify the compass and its purpose."], "jumps": []}, {"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P440", "text": ["Let's begin the lesson on NAVIGATIONAL SYSTEMS............................"], "jumps": ["P400"]}, {"id": "P410", "text": ["In the first section we will look at short range navigational systems.  These include systems like the VHF Omnirange system, and the Automatic Direction-Finder system.", "In the first section we will look at short range navigational systems. These include systems like the VHF Omnirange system, and the Automatic Direction-Finder system."], "jumps": ["P420", "P400"]}, {"id": "P101", "text": ["w Describe the operation of the VLF/OMEGA navigational system. w Describe the operation of the Global Positioning System (GPS). w Describe the operation of the Inertial Navigational System (INS)......", "Branching. frieda 07-14-00 Converted to ToolBook 7.1 format. jay 09-26-00 Reviewed - lisa 07-19-01 Converted to ToolBook 8.1 format. jay 10-26-01 P1302, 1280, 1290 changed \"glidescope\" to \"glide slope\". P10217, change distractor A from \"glide slope\" to \"localizer\" and distractor B from \"localizer\" to \"glide slope\". -Penny", "\"You have successfully passed the assessment"], "jumps": []}, {"id": "P1050", "text": ["The VOR's transmitted radio signals are tuned in by the aircraft receiver, known as the NAV radio.  The NAV radio settings are found by using a course chart.  Notice the chart has a circle around the VOR station, the circle is divided into 360 using 10 increments.", "The VOR's transmitted radio signals are tuned in by the aircraft receiver, known as the NAV radio. The NAV radio settings are found by using a course chart. Notice the chart has a circle around the VOR station, the circle is divided into 360 using 10 increments.", "Are you sure you want to Bookmark the Lesson?", "Are you sure you want to Exit the Lesson?", "You skipped X question(s). Do you want to _________", "The test is complete and your score is XX%. Do you want to _________", "You have successfully passed the assessment test!"], "jumps": ["P1060", "P1040"]}, {"id": "P1120", "text": ["The next navigational system that we are going to talk about is the Automatic Direction-Finder system (ADF).  This system is used to determine the direction of radio stations from their radio signals.", "The next navigational system that we are going to talk about is the Automatic Direction-Finder system (ADF). This system is used to determine the direction of radio stations from their radio signals."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["There are three main components associated with the ADF; the loop antenna, ADF control panel, and the Radio Magnetic Indicator (or radio compass).", "Radio Magnetic Indicator (Radio Compass)"], "jumps": ["P1140", "P1120"]}, {"id": "P1180", "text": ["A pilot can look at this instrument to determine the heading of the stations.  It is important to note that some systems today don't use a pointer, they use a digital readout.  This is becoming the standard for aircraft equipment.", "A pilot can look at this instrument to determine the heading of the stations. It is important to note that some systems today don't use a pointer, they use a digital readout. This is becoming the standard for aircraft equipment."], "jumps": ["P1190", "P1170"]}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P2320", "text": ["Below is a generalized example of the operation of an accelerometer.  This picture does not include the functions of the gyro.  When a plane is not moving the hanging mass is drawn down by the force of gravity.", "Below is a generalized example of the operation of an accelerometer. This picture does not include the functions of the gyro. When a plane is not moving the hanging mass is drawn down by the force of gravity."], "jumps": ["P2330", "P2310"]}, {"id": "P1192", "text": ["Pilots can determine their positions by using the intersection point of two signals.", "The next navigational system that we are going to talk about is the Automatic Direction-Finder system (ADF).  This system is used to determine the direction of radio stations from their radio signals.", "Approximately halfway between both stations", "The next navigational system that we are going to talk about is the Automatic Direction-Finder system (ADF). This system is used to determine the direction of radio stations from their radio signals."], "jumps": []}, {"id": "P1130", "text": ["There are three main components associated with the ADF; the loop antenna, ADF control panel, and the Radio Magnetic Indicator (or radio compass).", "Radio Magnetic Indicator (Radio Compass)"], "jumps": ["P1140", "P1120"]}, {"id": "P1190", "text": ["How many different ADF signals are used to determine the position of an aircraft on a course chart?"], "jumps": ["P1170"]}, {"id": "P1230", "text": ["What type of radio station can be used to perform distance measurements?"], "jumps": ["P1200"]}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P10", "text": ["\"You have successfully passed the assessment"], "jumps": []}, {"id": "P1112", "text": ["Remember, the name for the signals that are continuously being transmitted in all directions is radials."], "jumps": []}, {"id": "P1170", "text": ["The last major component of the ADF system is the radio magnetic indicator (or radio compass).  This indicator normally contains two pointers, one for the first ADF channel, and one for the second ADF channel.  The second radio channel in most cases will be the NAV (VOR) station setting.", "The last major component of the ADF system is the radio magnetic indicator (or radio compass). This indicator normally contains two pointers, one for the first ADF channel, and one for the second ADF channel. The second radio channel in most cases will be the NAV (VOR) station setting."], "jumps": ["P1180", "P1160"]}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: NAVIGATIONAL SYSTEMSsdf asd fasfd asdf asdf sadf", "Are you sure you want to Bookmark the Lesson?", "Are you sure you want to Exit the Lesson?"], "jumps": []}, {"id": "P210 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
