n current through the capacitor which you will observe..."], "jumps": ["P1150", "P1170"]}, {"id": "P1170", "text": ["What is the RC time constant of circuit B?th 3 tries...................) in a variable.able.le."], "jumps": ["P1175", "P1172", "P1160"]}, {"id": "P1171", "text": [], "jumps": ["P1170", "P1180"]}, {"id": "P1172", "text": ["T = R x CCC - Zero trace, then set to DC CH1 Input - Connect x1 probe Trigger - CH1, AC, + Time/Div - .2 msec Display Mode - CH1 CH1 Volts/Div - 1 Sweep Mode - AUTOO", "To calculate the RC time constant of an RC circuit, use the formula below. Remember, T is the time in SECONDS, R is the resistance in OHMS, and C is the capacitance in FARADS."], "jumps": ["P1170"]}, {"id": "P1173", "text": ["T = R x C = 10 kW x .01 mF = 10000 W x .00000001 Farads = .0001 seconds or 100 msec - CH1, AC, + Time/Div - .2 msec Display Mode - CH1 CH1 Volts/Div - 1 Sweep Mode - AUTOO", "Your answer is still incorrect. You should have calculated an RC time constant of 100 msec (.0001 seconds). Substitute circuit values into the formula."], "jumps": ["P1170", "P1180"]}, {"id": "P1175", "text": ["RC TIME CONSTANT - To calculate the RC time constant of an RC circuit, use the formula below. T = R x C Remember, T is the time in SECONDS for 1 Time Constant, R is the resistance in OHMS, and C is the capacitance in FARADS"], "jumps": ["P1170"]}, {"id": "P1180", "text": ["With a time constant of 100 msec, what square wave frequency allows the capacitor to exactly charge and discharge?"], "jumps": ["P1182", "P1185", "P1170"]}, {"id": "P1181", "text": [], "jumps": ["P1180", "P1190"]}, {"id": "P1182", "text": ["To completely charge and discharge a capacitor, 10 time constants are required. This is the period of the square wave frequency. To calculate frequency, divide 1 by the period."], "jumps": ["P1180"]}, {"id": "P1183", "text": ["= 1 / P = 1 / 10 TC's = 1 / .001 sec = 1000 Hzzonds or 100 msecds or 100 msecseccc - CH1, AC, + Time/Div - .2 msec Display Mode - CH1 CH1 d": "P1690", "text": ["3. Turn power OFF on the oscilloscope, and function generator. 4. Disconnect all test equipment. 5. Carefully remove PC130-14A. 6. Return all equipment to its proper storage area................................................................."], "jumps": ["P1680", "P1910"]}, {"id": "P1910", "text": ["This completes the experiment on RC CIRCUIT TRANSIENTS....."], "jumps": ["P1690"]}, {"id": "P13020", "text": ["This experiment demonstrates RC circuit transients. You will apply a square wave frequency to an RC circuit and observe the voltage and current waveforms for the capacitor. Next, you will vary the input frequency and predict the effects."], "jumps": ["P13030"]}, {"id": "P13030", "text": ["Pick up the PC130-14A card. This card contains four series RC circuits. Switches S1 - S4 select which circuit(s) the input is applied to."], "jumps": ["P13020", "P13040"]}, {"id": "P13040", "text": ["The function generator is used to supply a DC square wave to the inputs."], "jumps": ["P13050", "P13030"]}, {"id": "P13050", "text": ["Each circuit, A through D, has a different RC time constant. You will use circuit B. Let's start the experiment."], "jumps": ["P13030", "P13060"]}, {"id": "P13060", "text": ["1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13030"]}, {"id": "P13080", "text": ["2. Carefully plug PC130-14A into the Test Console PC1 position."], "jumps": ["P13090"]}, {"id": "P13090", "text": ["3. Set switches S1, S3, and S4 to OUT (Left) on the PC130-14A. 4. Set switch S2 to IN (Right) on PC130-14A. External program = 130E FLT 0 C1 00 S"], "jumps": ["P13095", "P13080"]}, {"id": "P13095", "text": ["MEASUREMENT SETUP - Place S1, S3 and S4 to OUT (left). Place S2 to IN (right)."], "jumps": ["P13090"]}, {"id": "P13100", "text": ["Function - Square Wave Gate Select - .1 sec Frequency Dial - 10 Attenuation - OUT Modulation - OUT Range - 10000", "5. Set the function generator for 1000 Hz square wave output. Be , "jumps": ["P13140", "P13160"]}, {"id": "P13160", "text": ["The experiment is now set up. The square wave applied to the RC circuit charges and discharges the capacitor. This action produces transients or changes in current through the capacitor which you will observe."], "jumps": ["P13150", "P13170"]}, {"id": "P13170", "text": ["What is the RC time constant of circuit B?th 3 tries...................) in a variable.able.le."], "jumps": ["P13172", "P13175", "P13160"]}, {"id": "P13171", "text": [], "jumps": ["P13170", "P13180"]}, {"id": "P13172", "text": ["T = R x C - Zero trace, then set to DC CH1 Input - Connect x1 probe Trigger - CH1, AC, + Time/Div - .2 msec Display Mode - CH1 CH1 Volts/Div - 1 Sweep Mode - AUTOO", "To calculate the RC time constant of an RC circuit, use the formula below. Remember, T is the time in SECONDS, R is the resistance in OHMS, and C is the capacitance in FARADS."], "jumps": ["P13170"]}, {"id": "P13173", "text": ["T = R x C = 10 kW x .01 mF = 10000 W x .00000001 Farads = .0001 seconds or 100 msec - CH1, AC, + Time/Div - .2 msec Display Mode - CH1 CH1 Volts/Div - 1 Sweep Mode - AUTOO", "Your answer is still incorrect. You should have calculated an RC time constant of 100 msec (.0001 seconds). Substitute circuit values into the formula."], "jumps": ["P13170", "P13180"]}, {"id": "P13175", "text": ["RC TIME CONSTANT - To calculate the RC time constant of an RC circuit, use the formula below. T = R x C Remember, T is the time in SECONDS for 1 Time Constant, R is the resistance in OHMS, and C is the capacitance in FARADS"], "jumps": ["P13170"]}, {"id": "P13180", "text": ["With a time constant of 100 msec, what square wave frequency allows the capacitor to exactly charge and discharge?"], "jumps": ["P13182", "P13185", "P13170"]}, {"id": "P13181", "text": [], "jumps": ["P13180", "P13190"]}, {"id": "P13182", "text": ["To completely charge and discharge a capacitor, 10 time constants are required. This is the period of the square wave frequency. To calculate frequency, divide 1 by the period."], "jumps": ["P13180"]}, {"id": "P13183", "text": ["= 1 / P = 1 / 10 TC's = 1 / .001 sec = 1000 Hzzonds or 100 msecds or 100 msecseccc - CH1, AC, + Time/Div - .2 msec Display Mode - CH1 CH1 Volts/Div - 1 Sweep Mode - AUTOO", "Your answer is still incorrect. You should have calculated a frequency of 1000 Hz or 1 kHz. With a time constant of .0001, the frequency is:"], "jumps": ["P13180", "P13190"]}, {"id": "P13185", "text": ["CALCULATING FREQUENCY - 10 time constants are required to completely charge and discharge a capacitor. The square wave must remain on for 5 TC's and off for 5 TC's. The period is then 10 TC's and the frequency is 1 divided by the period."], "jumps": ["P13180"]}, {"id": "P13190", "text": ["With 1 kHz applied to circuit B, what do you predict the voltage waveform across the capacitor looks like?"], "jumps": ["P13180"]}, {"id": "P13191", "text": [], "jumps": ["P13190"]}, {"id": "P13192", "text": ["It takes 5 time constants to fully charge and 5 time constants to fully discharge."], "jumps": ["P13190"]}, {"id": "P13200", "text": ["Let's measure the voltage waveform across the capacitor and verify that it is indeed as you predicted."], "jumps": ["P13210", "P13190"]}, {"id": "P13210", "text": ["Measuring voltage with an oscilloscope across a component that does not have either side connected to ground requires special procedures."], "jumps": ["P13200", "P13220"]}, {"id": "P13220", "text": ["Since voltage is actually \"difference of potential\", the voltage across C2 is the difference of the voltage at TP4 and the voltage at TP5."], "jumps": ["P13210", "P13230"]}, {"id": "P13230", "text": ["Since the oscilloscope has two channels, CH1 can measure the voltage at TP4 and CH2 can measure the voltage at TP5."], "jumps": ["P13210", "P13240"]}, {"id": "P13240", "text": ["Using the ADD function and inverting CH2 of the oscilloscope subtracts CH2 from CH1. This displays the difference of TP4 and TP5 or Ec."], "jum let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
