first step in digital signal tracing is to note the expected logic levels on the circuit's schematic, based on the circuit's normal input signal states."], "jumps": ["P2440", "P2420"]}, {"id": "P2460", "text": ["When you reach a point in the circuit where the measured logic level is not as expected you have located the fault site.  However, the actual defective device can be any gate connected to this point in the circuit.", "When you reach a point in the circuit where the measured logic level is not as expected you have located the fault site. However, the actual defective device can be any gate connected to this point in the circuit."], "jumps": ["P2470", "P2440"]}, {"id": "P2410", "text": ["SIGNAL TRACING \nIf voltage level measurements made with the oscilloscope and current measurements made with a multimeter do not isolate a fault site, the next step is to begin tracing the digital signals with a logic probe.", "For simple combinational, non-clocked digital circuits these are the only meaningful oscilloscope measurements that can be made to assist you in your troubleshooting efforts.", "SIGNAL TRACING If voltage level measurements made with the oscilloscope and current measurements made with a multimeter do not isolate a fault site, the next step is to begin tracing the digital signals with a logic probe."], "jumps": ["P2420", "P2330"]}, {"id": "P2390", "text": ["Set up the scope to measure DC volts and monitor the DC voltage levels while the circuit under test is operating under normal circumstances.  The measured DC voltage level should never exceed its maximum or drop below its minimum voltage ratings.", "Set up the scope to measure DC volts and monitor the DC voltage levels while the circuit under test is operating under normal circumstances. The measured DC voltage level should never exceed its maximum or drop below its minimum voltage ratings."], "jumps": ["P2400", "P2330"]}, {"id": "P1800", "text": [], "jumps": []}, {"id": "P2370", "text": ["The actual power supply specification for its voltage regulation is almost certainly limited to a smaller voltage range.  It is the power supply's voltage regulation specification that should be used to determine if it's operating properly.", "As previously mentioned the recommended supply voltage for Low Power Schottky TTL devices is 5.0V     0.25V.  Therefore, the power supply must maintain its DC output voltage within the limits of 4.75V to 5.25V for Low Power Schottky TTL devices to function reliably.", "The actual power supply specification for its voltage regulation is almost certainly limited to a smaller voltage range. It is the power supply's voltage regulation specification that should be used to determine if it's operating properly.", "As previously mentioned the recommended supply voltage for Low Power Schottky TTL devices is 5.0V 0.25V. Therefore, the power supply must maintain its DC output voltage within the limits of 4.75V to 5.25V for Low Power Schottky TTL devices to function reliably."], "jumps": ["P2380", "P2330"]}, {"id": "P2350", "text": ["The oscilloscope can also be used to verify that the power supply is maintaining its voltage regulation during system operation."], "jumps": ["P2360", "P2330"]}, {"id": "P2360", "text": ["As previously mentioned the recommended supply voltage for Low Power Schottky TTL devices is 5.0V     0.25V.  Therefore, the power supply must maintain its DC output voltage within the limits of 4.75V to 5.25V for Low Power Schottky TTL devices to function reliably.", "As previously mentioned the recommended supply voltage for Low Power Schottky TTL devices is 5.0V 0.25V. Therefore, the power supply must maintain its DC output voltage within the limits of 4.75V to 5.25V for Low Power Schottky TTL devices to function reliably."], "jumps": ["P2370", "P2330"]}, {"id": "P2380", "text": ["To test a power supply's voltage regulation, connect the oscilloscope across the power supply terminals with the circuit under test connected to the supply."], "jumps": ["P2390", "P2330"]}, {"id": "P2390", "text": ["Set up the scope to measure DC volts and monitor the DC voltage levels while the circuit under test is operating under normal circumstances.  The measured DC voltage level should never exceed its maximum or drop below its minimum voltage ratings.", "Set up the scope to measure DC volts and monitor the DC voltage levels while the circuit under test is operating under normal circumstances. The measured DC voltage level should never exceed its maximum or drop below its minimum voltage ratings."], "jumps": ["P2400", "P2330"]}, {"id": "P2400", "text": ["For simple combinational, non-clocked digital circuits these are the only meaningful oscilloscope measurements that can be made to assist you in your troubleshooting efforts."], "jumps": ["P2410", "P2330"]}, {"id": "P2420", "text": ["Signal tracing is a relatively simple process.  Consider the circuit below.", "Signal tracing is a relatively simple process. Consider the circuit below."], "jumps": ["P2430", "P2410"]}, {"id": "P2740", "text": ["5.  The recommended procedure for digital signal tracing is", "5. The recommended procedure for digital signal tracing is", "start at the middle of the circuit and work outward.", "pick any convenient point and start signal tracing."], "jumps": ["Prevents"]}, {"id": "P2320", "text": ["To measure AC ripple voltage with an oscilloscope set the input coupling to AC and the volts/division scale to 100mV.  Then connect the scope probe to the power supply ground and DC voltage level to be measured.", "With the circuit under test connected to the power supply measure the peak-to-peak value of the AC ripple voltage.  If this voltage exceeds a 100mV you probably have a power supply fault or an excessive current draw from the power supply.", "To measure AC ripple voltage with an oscilloscope set the input coupling to AC and the volts/division scale to 100mV. Then connect the scope probe to the power supply ground and DC voltage level to be measured.", "With the circuit under test connected to the power supply measure the peak-to-peak value of the AC ripple voltage. If this voltage exceeds a 100mV you probably have a power supply fault or an excessive current draw from the power supply."], "jumps": ["P2330", "P2290", "P2340", "P2320"]}, {"id": "P2340", "text": ["To eliminate the possibility of excessive current draw from the power supply, place a DC ammeter in series with the power supply and the circuit under test.  If the measured current is not within the power supply's specifications you have a faulty power supply.", "To eliminate the possibility of excessive current draw from the power supply, place a DC ammeter in series with the power supply and the circuit under test. If the measured current is not within the power supply's specifications you have a faulty power supply."], "jumps": ["P2350", "P2330"]}, {"id": "P2241", "text": [], "jumps": []}, {"id": "P2240", "text": ["a pulsed signal..ll illuminate indicating a pulsed signal..gnal.", "a HIGH level signal.uminate indicating a HIGH level signal.", "an indeterminate signal level.luminate indicating an indeterminate signal level.", "a LOW level signal.illuminate indicating a LOW level signal.", "When the logic probe is placed on this NAND gate's output, the logic probe's red led will illuminate to indicate _______"], "jumps": ["P2230"]}, {"id": "P2230", "text": ["When the logic probe is placed on this NOR gate's output, the logic probe's green LED will illuminate to indicate  _______", "When the logic probe is placed on this NOR gate's output, the logic probe's green LED will illuminate to indicate ________", "HIGH level signal.lluminate indicating a HIGH level signal.", "an indeterminate signal level.luminate indicating an indeterminate signal level.", "a LOW level signal.illuminate indicating a LOW level signal.", "a pulsed signal.ill illuminate indicating a pulsed signal..gnal."], "jumps": ["P2220"]}, {"id": "P2280", "text": ["Typically when monitoring TTL level signals the oscilloscope trace is adjusted for center scale and the volts/division is set at 5. These settings may vary for other logic families such as CMOS which normally are running at 12V and 0V logic levels."], "jumps": ["P2290", "P2250"]}, {"id": "P2290", "text": ["Oscilloscopes are also useful for testing suspected faulty power supplies.  Digital circuits are generally not very tolerant of  excessive AC ripple of the DC supply voltages.", "Oscilloscopes are also useful for testing suspected faulty power supplies. Digital circuits are generally not very tolerant of excessive AC ripple of the DC supply voltages."], "jumps": ["P2300", "P2250"]}, {"id": "P2210", "text": ["If the logic probe is placed on the NAND gate's output in the circuit below, with the inputs provided, the green LED illuminates indicating a LOW level at the circuit's output."], "jumps": ["P2220", "P2200"]}, {"id": "P2260", "text": ["To use an oscilloscope to troubleshoot digital signals requires that the device be properly set up to measure the logic levels for the circuit under test."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["If the circuit under test is a TTL digital circuit then the expected logic levels will range from 0 to +5 volts.  Therefore, the oscilloscope's vertical scale should be set appropriately.", "If the circuit under test is a TTL digital circuit then the expected logic levels will range from 0 to +5 volts. Therefore, the oscilloscope's vertical scale should be set appropriately."], "jumps": ["P2280", "P2250"]}, {"id": "P2190", "text": ["The red clip is connected to the +5 volt test point and the black clip is connected to the ground test point."], "jumps": ["P2200", "P2140"]}, {"id": "P2250", "text": ["OSCILLOSCOPES\nOscilloscopes are effective devices for troubleshooting digital circuits as well.", "OSCILLOSCOPES Oscilloscopes are effective devices for troubleshooting digital circuits as well."], "jumps": ["P2260", "P2240"]}, {"id": "P2130", "text": ["LOGIC PROBE \nA logic probe is a device that was developed to overcome the shortcomings of the multimeter when monitoring clocked digital signals.", "LOGIC PROBE A logic probe is a device that was developed to overcome the shortcomings of the multimeter when monitoring clocked digital signals."], "jumps": ["P2140", "P2120"]}, {"id": "P2150", "text": ["Logic probes vary in size and style but all should indicate when HIGH or LOW logic levels are present."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["Most logic probes also indicate when a digital signal is pulsed.", "Next, starting at the gate inputs, confirm that the input signals are as expected."], "jumps": ["P2170", "P2140", "P2450", "P2420"]}, {"id": "P2780", "text": ["9.  Which LED should illuminate for the condition shown?", "9. Which LED should illuminate for the condition shown?..."], "jumps": ["Prevents"]}, {"id": "P2950", "text": ["4. The logic probe is used to detect the presence or absence of         signals in digital circuits.  Most logic probes also indicate                when a digital signal is pulsed.", "4. The logic probe is used to detect the presence or absence of signals in digital circuits. Most logic probes also indicate when a digital signal is pulsed......"], "jumps": ["P2960", "P2940"]}, {"id": "P2070", "text": ["Similarly, setting the multimeter to measure DC current and connecting it in series with the power supply and the digital circuit will determine the current drawn from the supply.", "A simple measurement with a multimeter set to measure DC volts will quickly verify the power supply's voltage level(s)."], "jumps": ["P2080", "P2050"]}, {"id": "P2050", "text": ["MULTIMETER \nUsually the first step in troubleshooting any circuit is to verify that the power supply voltage level(s) are within tolerance and that the current draw has not exceeded the power supply's specifications.", "MULTIMETER Usually the first step in troubleshooting any circuit is to verify that the power supply voltage level(s) are within tolerance and that the current draw has not exceeded the power supply's specifications."], "jumps": ["P2060", "P2020"]}, {"id": "P2121", "text": ["The first question you must answer when troubleshooting a digital circuit is what tool(s) do you use.  Shown below are several possibilities.", "It is also a good idea to check the power supplies with an oscilloscope to verify that there is no significant amount of AC ripple on the DC levels, and that the voltage levels stay regulated during system operation.", "The first question you must answer when troubleshooting a digital circuit is what tool(s) do you use. Shown below are several possibilities."], "jumps": ["P2030", "P2001", "P2090", "P2050"]}, {"id": "P2140", "text": ["The logic probe is used to detect the presence or absence of signals in digital circuits."], "jumps": ["P2150", "P2130"]}, {"id": "P2220", "text": ["If the logic probe is placed on the NAND gate's output in the circuit below, with the inputs provided, the yellow LED illuminates indicating a PULSED signal at the circuit's output."], "jumps": ["P2230", "P2210"]}, {"id": "P2295", "text": ["AC RIPPLE - The AC voltage component found on DC voltage levels after the rectification and filtering process in a DC power supply. Since power supply rectifiers and filters are not perfect some portion of the original AC signal remains on the DC voltage level after it has been rectified and filtered. Ideally, the AC ripple voltage should be as small as possible."], "jumps": []}, {"id": "P2300", "text": ["The recommended supply voltage for Low Power Schottky TTL devices is 5.0V     0.25V (4.75V to 5.25V).  A DC power supply level that has a measured AC ripple voltage in excess of 100mVpp should be considered suspect.", "The recommended supply voltage for Low Power Schottky TTL devices is 5.0V 0.25V (4.75V to 5.25V). A DC power supply level that has a measured AC ripple voltage in excess of 100mVpp should be considered suspect."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["A properly functioning regulated DC power supply used to power digital circuits should have a measured AC ripple voltage of less than 20mVpp."], "jumps": ["P2320", "P2290"]}, {"id": "P2060", "text": ["A simple measurement with a multimeter set to measure DC volts will quickly verify the power supply's voltage level(s)."], "jumps": ["P2070", "P2050"]}, {"id": "P2090", "text": ["Multimeters can also be used to verify that device logic levels are within specification.  For example, TTL LOW level signals should be the range of 0V to +0.8V and TTL HIGH level signals in the range of  +2.7V to +5.0V.", "Multimeters can also be used to verify that device logic levels are within specification. For example, TTL LOW level signals should be the range of 0V to +0.8V and TTL HIGH level signals in the range of +2.7V to +5.0V."], "jumps": ["P2100", "P2080"]}, {"id": "P2170", "text": ["A typical logic probe has three logic state indicators.  The logic probe shown below uses three LEDs to indicate logic states.  On this logic probe Red is HIGH, Green is LOW, and Yellow is PULSED.", "A typical logic probe has three logic state indicators. The logic probe shown below uses three LEDs to indicate logic states. On this logic probe Red is HIGH, Green is LOW, and Yellow is PULSED."], "jumps": ["P2180", "P2140"]}, {"id": "P2180", "text": ["Logic probes are powered from the circuit under test, typically using red and black alligator clips to connect to the circuit's power source."], "jumps": ["P2190", "P2140"]}, {"id": "P2241", "text": [], "jumps": []}, {"id": "P1910", "text": ["This completes the information on COMMON IC FAULTS AND SYMPTOMS."], "jumps": ["P1430"]}, {"id": "P2030", "text": ["The answer is you can use all of them.  However, there are times that one tool might be a better choice than the others.", "The answer is you can use all of them. However, there are times that one tool might be a better choice than the others."], "jumps": ["P2040", "P2020"]}, {"id": "P1801", "text": [], "jumps": []}, {"id": "P1790", "text": ["10.  If a digital circuit has a suspected power supply fault an                  oscilloscope should be used to:", "10. If a digital circuit has a suspected power supply fault an oscilloscope should be used to:", "check for the amount of AC ripple on the DC levels", "check that the voltage levels stay regulated during system operation"], "jumps": ["Prevents"]}, {"id": "P2110", "text": ["Beyond these simple measurements the multimeter quickly loses its effectiveness in troubleshooting digital circuits.  If the circuit is pulsed or clocked, these frequencies are normally too high for the meter to track and provide meaningful measurements.", "Beyond these simple measurements the multimeter quickly loses its effectiveness in troubleshooting digital circuits. If the circuit is pulsed or clocked, these frequencies are normally too high for the meter to track and provide meaningful measurements."], "jumps": ["P2120", "P2100"]}, {"id": "P2200", "text": ["If the logic probe is placed on the NAND gate's output in the circuit below, with the inputs provided, the red LED illuminates indicating a HIGH level at the circuit's output."], "jumps": ["P2210", "P2190"]}, {"id": "P2231", "text": [], "jumps": []}, {"id": "P1750", "text": ["6.  If the NAND gate shown below has an input internally shorted       to Vcc the measured output signal for the inputs shown would      be:", "6. If the NAND gate shown below has an input internally shorted to Vcc the measured output signal for the inputs shown would be:"], "jumps": ["Prevents"]}, {"id": "P1770", "text": ["8.  The three most common types of external digital IC faults are", "8. The three most common types of external digital IC faults are", "excessive current, shorts, and faulty power supplies.", "opens, shorts, and faulty power supplies."], "jumps": ["Prevents"]}, {"id": "P2040", "text": ["In this objective we will examine the function and use of these basic digital troubleshooting tools to determine how and when they can best be applied to troubleshooting digital circuits."], "jumps": ["P2050", "P2020"]}, {"id": "P1730", "text": ["4.  If a digital IC has a malfunction in its internal circuitry", "4. If a digital IC has a malfunction in its internal circuitry", "its output will always be in the LOW state.", "its output will always be in the HIGH state.", "it will draw excessive current from the power supply."], "jumps": ["Prevents"]}, {"id": "P1780", "text": ["9.  Suspected external open circuit faults are best tested with:", "9. Suspected external open circuit faults are best tested with:"], "jumps": ["Prevents"]}, {"id": "P1717", "text": ["Your answer is still incorrect.  You should have answered\ndetection, isolation or correction in any order.", "Your answer is still incorrect. You should have answered detection, isolation or correction in any order."], "jumps": ["P1720", "P1710"]}, {"id": "P1799", "text": ["You have completed the Exercise.\nYou are about to return to the Objective Menu.", "You have completed the Exercise. You are about to return to the Objective Menu......."], "jumps": ["P1790"]}, {"id": "P1700", "text": ["1.  Which internal IC fault can produce signals that show three            different voltage levels?", "1. Which internal IC fault can produce signals that show three different voltage levels?", "shorts between pins other than Vcc and ground"], "jumps": ["Prevents"]}, {"id": "P1430", "text": ["You should always check the power and ground levels at each IC that appears to be operating incorrectly.", "One of the most common signs of a faulty power supply is one or more chips operating erratically or not at all.  Some ICs are more tolerant of power supply variations and may operate properly, while others do not.", "One of the most common signs of a faulty power supply is one or more chips operating erratically or not at all. Some ICs are more tolerant of power supply variations and may operate properly, while others do not."], "jumps": ["P1910", "P1360"]}, {"id": "P1410", "text": ["It is also a good idea to check the power supplies with an oscilloscope to verify that there is no significant amount of AC ripple on the DC levels, and that the voltage levels stay regulated during system operation."], "jumps": ["P1420", "P1360"]}, {"id": "P1699", "text": ["The following questions will provide you with some practice on common IC faults and symptoms."], "jumps": []}, {"id": "P1710", "text": ["2.  The three basic steps in repairing a digital circuit or system             that has a fault are fault _________, _________, and                           __________.", "2. The three basic steps in repairing a digital circuit or system that has a fault are fault _________, _________, and __________."], "jumps": ["P1700"]}, {"id": "P1390", "text": ["This can happen if a chip or component has a fault that causes it to draw much more current than normal."], "jumps": ["P1400", "P1360"]}, {"id": "P1420", "text": ["One of the most common signs of a faulty power supply is one or more chips operating erratically or not at all.  Some ICs are more tolerant of power supply variations and may operate properly, while others do not.", "One of the most common signs of a faulty power supply is one or more chips operating erratically or not at all. Some ICs are more tolerant of power supply variations and may operate properly, while others do not."], "jumps": ["P1430", "P1360"]}, {"id": "P1360", "text": ["All digital systems have one or more DC power supplies that supply the Vcc and Vdd voltages to the ICs, which will then operate erratically or not at all."], "jumps": ["P1370", "P1340"]}, {"id": "P1370", "text": ["A faulty power supply or one that is overloaded (supplying more than its rated amount of current) will provide poorly regulated supply voltages to the ICs, and the ICs either will not operate, or will operate erratically."], "jumps": ["P1380", "P1360"]}, {"id": "P1400", "text": ["It is a good troubleshooting practice to check the voltage levels at each power supply in the system to see that they are within their specified ranges."], "jumps": ["P1410", "P1360"]}, {"id": "P1330", "text": ["Probably the most common example of shorted signal faults due to sloppy wiring is the result of stripping too much insulation from wire ends that are in close proximity.", "External shorted signal faults have the same effect as internal shorts between IC pins.  It causes the signals of the shorted pins to always be identical.  The main causes are:", "External shorted signal faults have the same effect as internal shorts between IC pins. It causes the signals of the shorted pins to always be identical. The main causes are:", "1. Sloppy Wiring. 2. Solder Bridges. 3. Incomplete Etching. Bent or broken pin on an IC. 5. Faulty IC socket such that the pin does not make good contact with the socket. contact with the socket. good contact with the socket."], "jumps": ["P1340", "P1320", "P1330", "P1310"]}, {"id": "P1310", "text": ["This type of fault is easily verified by disconnecting the power from the circuit and checking continuity with an ohmmeter between the two points in question.", "External open signal line faults include any fault that produces a break or discontinuity in the conducting path such that a voltage level or signal is prevented from going from one point to another. Some of the causes of open signal lines are:", "1. Broken Wire 2. Poor solder connection or loose wire-wrap connection. 3. Cracked or cut trace on a printed circuit board. 4. Bent or broken pin on an IC. 5. Faulty IC socket such that the pin does not make good contact with the socket."], "jumps": ["P1320", "P1300", "P1310", "P1290"]}, {"id": "P1290", "text": ["EXTERNAL FAULTS \nThe experienced troubleshooter must also have an understanding of the common external faults found in digital systems.  The most common external failures found in digital integrated circuits are:", "EXTERNAL FAULTS The experienced troubleshooter must also have an understanding of the common external faults found in digital systems. The most common external failures found in digital integrated circuits are:", "External Failures 1. Open Signal Lines. 2. Shorted Signal Lines. 3. Faulty Power Supply. 4. Shorts between two pins (other than ground or Vcc).nd or Vcc).er than ground or Vcc). than ground or Vcc)."], "jumps": ["P1300", "P1230"]}, {"id": "P1300", "text": ["External open signal line faults include any fault that produces a break or discontinuity in the conducting path such that a voltage level or signal is prevented from going from one point to another. Some of the causes of open signal lines are:", "1. Broken Wire 2. Poor solder connection or loose wire-wrap connection. 3. Cracked or cut trace on a printed circuit board. 4. Bent or broken pin on an IC. 5. Faulty IC socket such that the pin does not make good contact with the socket."], "jumps": ["P1310", "P1290"]}, {"id": "P1320", "text": ["External shorted signal faults have the same effect as internal shorts between IC pins.  It causes the signals of the shorted pins to always be identical.  The main causes are:", "External shorted signal faults have the same effect as internal shorts between IC pins. It causes the signals of the shorted pins to always be identical. The main causes are:", "1. Sloppy Wiring. 2. Solder Bridges. 3. Flawed Etching. Bent or broken pin on an IC. 5. Faulty IC socket such that the pin does not make good contact with the socket. contact with the socket. good contact with the socket."], "jumps": ["P1330", "P1310"]}, {"id": "P1340", "text": ["Solder bridges are splashes of solder that short two or more points together.  They commonly occur between points that are very close together, such as adjacent pins on a chip.", "Solder bridges are splashes of solder that short two or more points together. They commonly occur between points that are very close together, such as adjacent pins on a chip."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["Incomplete printed circuit board etching is a failure in the board manufacturing process where the copper conducting path is completely etched away."], "jumps": ["P1360", "P1340"]}, {"id": "P1380", "text": ["A power supply may go out of regulation because of a fault in its internal circuitry, or because the circuits that it is powering are drawing more current than the supply is designed for."], "jumps": ["P1390", "P1360"]}, {"id": "P1220", "text": ["The short causes the two INVERTER output pins to be connected together so that the signals at Gate 1 pin 2 and Gate 2 pin 4 have to be identical even when the two INVERTER input signals are trying to produce different outputs.", "Consider the circuit below where pins 5 and 6 of the NOR gate are internally shorted together."], "jumps": ["P1230", "P1200"]}, {"id": "P1200", "text": ["An internal short between two pins of an IC will force the logic signals at those pins always to be identical.  Whenever two signals that are supposed to be different show the same logic level variations, there is a good possibility that the signals are shorted together.", "An internal short between two pins of an IC will force the logic signals at those pins always to be identical. Whenever two signals that are supposed to be different show the same logic level variations, there is a good possibility that the signals are shorted together."], "jumps": ["P1210", "P1170"]}, {"id": "P1230", "text": ["To illustrate, consider the input waveforms shown in the diagram.  Even though these two inputs are different, the waveforms at Gate1 pin 2 and Gate 2 pin 4 are the same.", "To illustrate, consider the input waveforms shown in the diagram. Even though these two inputs are different, the waveforms at Gate1 pin 2 and Gate 2 pin 4 are the same."], "jumps": ["P1240", "P1200"]}, {"id": "P1250", "text": ["During the interval t4 to t5 both INVERTERs have a LOW input and both outputs are trying to produce a HIGH output, again their being shorted together makes no difference."], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["However, during the intervals t2 to t3 and t3 to t4, one INVERTER is trying to produce a HIGH output while the other is trying to produce a LOW output."], "jumps": ["P1270", "P1230"]}, {"id": "P1270", "text": ["In this situation the actual voltage level that appears at the shorted outputs of the INVERTERs will depend on the internal IC circuitry."], "jumps": ["P1280", "P1230"]}, {"id": "P1280", "text": ["For TTL devices it will usually be a voltage in the high end of the logic 0 range (i.e., close to 0.8V), although it may also be in the indeterminate range.  For CMOS devices it will often be a voltage in the indeterminate range.", "For TTL devices it will usually be a voltage in the high end of the logic 0 range (i.e., close to 0.8V), although it may also be in the indeterminate range. For CMOS devices it will often be a voltage in the indeterminate range."], "jumps": ["P1290", "P1230"]}, {"id": "P1950", "text": ["4.  INTERNAL DIGITAL IC FAULTS \n     The first step in becoming an effective digital troubleshooter is      recognizing fault symptoms.  The most common internal                 failures of digital integrated circuits are:", "4. INTERNAL DIGITAL IC FAULTS The first step in becoming an effective digital troubleshooter is recognizing fault symptoms. The most common internal failures of digital integrated circuits are:", "Internal Failures 1. Malfunction of the internal circuitry. 2. Inputs or outputs shorted to ground or Vcc. 3. Inputs or outputs open-circuited. 4. Shorts between two pins (other than ground or Vcc)."], "jumps": ["P1960", "P1920"]}, {"id": "P1960", "text": ["5.  EXTERNAL FAULTS \n     The experienced troubleshooter must also have an                           understanding of the common external faults found in digital         systems.  The most common external failures found in digital         integrated circuits are:", "5. EXTERNAL FAULTS The experienced troubleshooter must also have an understanding of the common external faults found in digital systems. The most common external failures found in digital integrated circuits are:", "External Failures 1. Open Signal Lines. 2. Shorted Signal Lines. 3. Faulty Power Supply. 4. Shorts between two pins (other than ground or Vcc).nd or Vcc).er than ground or Vcc). than ground or Vcc)."], "jumps": ["P1999", "P1950"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1960"]}, {"id": "P1740", "text": ["5.  If the NOR gate shown below has an internally open circuited        output the measured output signal for the inputs shown                  would be:", "5. If the NOR gate shown below has an internally open circuited output the measured output signal for the inputs shown would be:"], "jumps": ["Prevents"]}, {"id": "P1760", "text": ["7.  If the inputs of the TTL NOR gate shown below are internally          shorted what voltage level would be measured at its inputs            when the output of INVERTER 1 is HIGH and the output of              INVERTER 2 is LOW?", "If one or more of the digital IC's inputs are internally shorted to ground or Vcc the device's output will be stuck in either the LOW or HIGH state depending upon the type of device.", "7. If the inputs of the TTL NOR gate shown below are internally shorted what voltage level would be measured at its inputs when the output of INVERTER 1 is HIGH and the output of INVERTER 2 is LOW?"], "jumps": ["Prevents"]}, {"id": "P1090", "text": ["When this happens the IC outputs do not respond properly to the IC inputs.  There is no way to predict what the outputs will do, because it depends on what internal component has failed.", "When this happens the IC outputs do not respond properly to the IC inputs. There is no way to predict what the outputs will do, because it depends on what internal component has failed."], "jumps": ["P1100", "P1085"]}, {"id": "P1085", "text": ["The malfunction of internal digital IC circuitry is usually caused by one or more of the internal components failing completely or operating outside of its specifications."], "jumps": ["P1090", "P1080"]}, {"id": "P1080", "text": ["Internal Digital IC Faults \nThe first step in becoming an effective digital troubleshooter is recognizing fault symptoms.  The most common internal failures of digital integrated circuits are:", "Internal Digital IC Faults The first step in becoming an effective digital troubleshooter is recognizing fault symptoms. The most common internal failures of digital integrated circuits are:", "Internal Failures 1. Malfunction of the internal circuitry. 2. Inputs or outputs shorted to ground or Vcc. 3. Inputs or outputs open-circuited. 4. Shorts between two pins (other than ground or Vcc)."], "jumps": ["P1085", "P1070"]}, {"id": "P1070", "text": ["Good troubleshooting techniques can only be developed through practical experience, but this lesson will provide you with the basic techniques and knowledge necessary to become a successful troubleshooter."], "jumps": ["P1080", "P1020"]}, {"id": "P1060", "text": ["Although these steps may seem obvious, the actual troubleshooting procedure that is followed is highly dependent on the type and complexity of the circuitry, and on the kinds of troubleshooting tools and documentation that are available."], "jumps": ["P1070", "P1020"]}, {"id": "P1920", "text": ["1.  Step 1: Fault Detection, observe the circuit or system's                    operation and compare it with the expected correct operation.", "In step 2, Fault Isolation, perform tests and make measurements to isolate the fault.", "1. Step 1: Fault Detection, observe the circuit or system's operation and compare it with the expected correct operation."], "jumps": ["P1930", "P1001", "P1050", "P1020"]}, {"id": "P1070", "text": ["Good troubleshooting techniques can only be developed through practical experience, but this lesson will provide you with the basic techniques and knowledge necessary to become a successful troubleshooter."], "jumps": ["P1080", "P1020"]}, {"id": "P1090", "text": ["When this happens the IC outputs do not respond properly to the IC inputs.  There is no way to predict what the outputs will do, because it depends on what internal component has failed.", "When this happens the IC outputs do not respond properly to the IC inputs. There is no way to predict what the outputs will do, because it depends on what internal component has failed."], "jumps": ["P1100", "P1085"]}, {"id": "P1020", "text": ["There are three basic steps in repairing a digital circuit or system that has a fault."], "jumps": ["P1030", "P1001"]}, {"id": "P1060", "text": ["Although these steps may seem obvious, the actual troubleshooting procedure that is followed is highly dependent on the type and complexity of the circuitry, and on the kinds of troubleshooting tools and documentation that are available."], "jumps": ["P1070", "P1020"]}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P450", "text": ["Let's begin the lesson on TROUBLESHOOTING DIGITAL SYSTEMS.", "In step 3, Fault Correction, replace the faulty component, repair faulty connections, remove shorts, etc., as required by the type of fault or faults discovered.", "Let's begin the lesson on TROUBLESHOOTING DIGITAL SYSTEMS..................."], "jumps": ["P430", "P1060", "P1020"]}, {"id": "P1150", "text": ["Internal IC short circuit faults are normally characterized by excessive heat dissipation by the IC package.  This can be detected by simply touching the device, but do so carefully as they can become very hot.  If the device feels unusually hot it's probably defective.", "Internal IC short circuit faults are normally characterized by excessive heat dissipation by the IC package. This can be detected by simply touching the device, but do so carefully as they can become very hot. If the device feels unusually hot it's probably defective."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["Sometimes the very fine conducting material that connects an IC pin to the IC's internal circuitry will break, producing and open circuit."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["Consider the IC shown below. If a signal is applied to pin 13, it will not reach the input of NAND gate 1 and will have no effect on the NAND gate output.  The gate input will be in the floating state.", "Consider the IC shown below. If a signal is applied to pin 13, it will not reach the input of NAND gate 1 and will have no effect on the NAND gate output. The gate input will be in the floating state."], "jumps": ["P1180", "P1160"]}, {"id": "P1240", "text": ["During the interval t1 to t2 both INVERTERs have a HIGH input and both outputs are trying to produce a LOW output, so that their being shorted together makes no difference."], "jumps": ["P1250", "P1230"]}, {"id": "P10", "text": [], "jumps": []}, {"id": "P420", "text": ["The most common external failures found in digital integrated circuits are:", "External Failures 1. Open Signal Lines. 2. Shorted Signal Lines. 3. Faulty Power Supply. 4. Shorts between two pins (other than ground or Vcc).nd or Vcc).er than ground or Vcc). than ground or Vcc)."], "jumps": ["P430", "P410"]}, {"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Nida Corporation 1998 - 2001 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
