const book = {"title": "9395B103", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P2070", "text": ["Let's start the experiment.", "Let's start the experiment.e..............................."], "jumps": ["P2080", "P2030"]}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe Frequency Modulation. w Describe the characteristics of Frequency Modulation.", "w Generate Frequency Modulation signals using a function generator. w Observe and measure the characteristics of a Frequency Modulated signal. Modulated signal."], "jumps": []}, {"id": "P300", "text": ["2. Nida Model 440 or 4040 Function Generator"], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson you should examine the concept of frequency modulation and frequency modulated signals.", "In this lesson you should examine the concept of frequency modulation and frequency modulated signals. _"], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Frequency modulation, FM, is another method of signal processing and was developed around 1936."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Today, most all home radios have the capability to receive both AM and FM signals."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["FM communication systems have several advantages over AM systems.  For example, FM is less noisy, as you probably already know.", "FM communication systems have several advantages over AM systems. For example, FM is less noisy, as you probably already know."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Also, FM signals are sent in stereo, or two signals, one for each side, left and right.  AM is not normally transmitted in stereo.", "Also, FM signals are sent in stereo, or two signals, one for each side, left and right. AM is not normally transmitted in stereo."], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["Let's begin the lesson on FREQUENCY MODULATION............................"], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Frequency Modulation, FM, is used to convey information from a source to a destination through a transmission medium, just like AM."], "jumps": ["P1025", "P1001"]}, {"id": "P1025", "text": ["Frequency Modulation is a signal processing technique that modifies a carrier signal by the information signal, just like AM."], "jumps": ["P1030", "P1020"]}, {"id": "P1030", "text": ["Without this modification the information signal could not be sent, just like AM."], "jumps": ["P1040", "P1025"]}, {"id": "P1040", "text": ["The name frequency modulation is derived from how the carrier signal is modified; by frequency.  The amplitude of the carrier signal remains constant, unlike AM.", "The name frequency modulation is derived from how the carrier signal is modified; by frequency. The amplitude of the carrier signal remains constant, unlike AM."], "jumps": ["P1050", "P1025"]}, {"id": "P1050", "text": ["In transmitter signal processing, a constant amplitude carrier signal is developed by an oscillator."], "jumps": ["P1060", "P1025"]}, {"id": "P1060", "text": ["The carrier signal is then fed to an FM modulator circuit.", "The carrier signal is then fed to an FM modulator circuit.m"], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["The second input to the modulator circuit is the information signal."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["The modulator circuit causes the frequency of the carrier signal to change according to the amplitude of the information signal."], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["As the information signal's amplitude increases, the carrier frequency is increased."], "jumps": ["P1100", "P1050"]}, {"id": "P1100", "text": ["As the information signal's amplitude decreases, the carrier frequency is decreased."], "jumps": ["P1110", "P1050"]}, {"id": "P1110", "text": ["Note that the carrier signal and frequency of the information signal have the same rate of change."], "jumps": ["P1120", "P1050"]}, {"id": "P1120", "text": ["The resultant FM signal is then transmitted through the transmission medium, normally air, but could be through wire or fiber optic cables."], "jumps": ["P1130", "P1050"]}, {"id": "P1130", "text": ["In receiver signal processing, the transmitted FM signal is picked up through a tuning process and the information signal recovered."], "jumps": ["P1140", "P1050"]}, {"id": "P1140", "text": ["The tuning circuits allow you to choose which one of the many FM signals to process."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["The detector circuits separate the carrier signal from the information signal."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["The information signal is then sent to amplifiers for further processing."], "jumps": ["P1170", "P1130"]}, {"id": "P1170", "text": ["What characteristic of the carrier signal is changed for FM signal processing?"], "jumps": ["P1130"]}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1172", "text": ["FM stands for frequency modulation.  The carrier's amplitude is not changed, that would be AM signal processing.", "FM stands for frequency modulation. The carrier's amplitude is not changed, that would be AM signal processing."], "jumps": []}, {"id": "P1173", "text": ["FM stands for frequency modulation.  The carrier's phase is not changed.", "FM stands for frequency modulation. The carrier's phase is not changed."], "jumps": []}, {"id": "P1180", "text": ["Touch the carrier signal.", "Touch the carrier signal.is typed.........................."], "jumps": ["P1170"]}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1182", "text": ["You touched the information signal.  Notice that it varies in amplitude.", "You touched the information signal. Notice that it varies in amplitude.."], "jumps": []}, {"id": "P1183", "text": ["You touched the FM signal.  Notice that it varies in frequency and has a constant amplitude.", "You touched the FM signal. Notice that it varies in frequency and has a constant amplitude....."], "jumps": []}, {"id": "P1190", "text": ["Touch the FM signal.", "Touch the FM signal.tion is typed.........................."], "jumps": []}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1192", "text": ["You touched the information signal.  Notice that it varies in amplitude.", "You touched the information signal. Notice that it varies in amplitude.."], "jumps": []}, {"id": "P1193", "text": ["You touched the carrier signal.  Notice that it does not vary in amplitude or frequency.", "You touched the carrier signal. Notice that it does not vary in amplitude or frequency.."], "jumps": []}, {"id": "P1200", "text": ["Now, before learning about actual FM circuits, let's talk about some of the characteristics of a FM signal.", "Carrier Frequency Modulation Index/Deviation Ratio Sidebands Bandwidth Noise"], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["s, the carrier frequency in FM systems must be higher than the information frequency.", "CARRIER FREQUENCY As in AM systems, the carrier frequency in FM systems must be higher than the information frequency."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["Unlike AM systems, there is no rule of thumb to follow."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["The carrier frequency must be high enough to allow the full extent of frequency changes caused by the changes in amplitude of the information signal."], "jumps": ["P1240", "P1210"]}, {"id": "P1240", "text": ["This includes the sideband frequencies.  You will see in FM the number of sidebands can theoretically be infinite.  Remember in AM there are only two, upper and lower.", "This includes the sideband frequencies. You will see in FM the number of sidebands can theoretically be infinite. Remember in AM there are only two, upper and lower."], "jumps": ["P1250", "P1210"]}, {"id": "P1250", "text": ["However, the carrier frequency for FM should be 5 MHz or higher.  This is not a problem since the lower carrier frequencies are used in AM systems.", "However, the carrier frequency for FM should be 5 MHz or higher. This is not a problem since the lower carrier frequencies are used in AM systems."], "jumps": ["P1260", "P1210"]}, {"id": "P1260", "text": ["FM radio uses carrier frequencies between 88 and 108 MHz.  TV uses frequencies of 54 to 88 MHz, 174 to 216 MHz and 470 to\n890 MHz.", "FM radio uses carrier frequencies between 88 and 108 MHz. TV uses frequencies of 54 to 88 MHz, 174 to 216 MHz and 470 to 890 MHz."], "jumps": ["P1270", "P1210"]}, {"id": "P1270", "text": ["MODULATION INDEX AND DEVIATION RATIO\nThe modulation index and deviation ratio of a FM signal determines the extent and the rate of modulation.  It is similar to the percent modulation in AM systems.", "MODULATION INDEX AND DEVIATION RATIO The modulation index and deviation ratio of a FM signal determines the extent and the rate of modulation. It is similar to the percent modulation in AM systems."], "jumps": ["P1280", "P1210"]}, {"id": "P1280", "text": ["The difference between AM and FM is that the AM percent modulation ranges from 0% to 100%.  The FM modulation index and ratio has much higher values.", "The difference between AM and FM is that the AM percent modulation ranges from 0% to 100%. The FM modulation index and ratio has much higher values."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["The formula for modulation index is the frequency deviation (fd) divided by the modulating frequency (fm)."], "jumps": ["P1300", "P1270"]}, {"id": "P1300", "text": ["For example, FM broadcast stations are allowed a frequency deviation of 75 kHz, if a 4 kHz audio signal causes full deviation, then the modulation index is 18.75.", "m = = = 18.75"], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["Notice that the modulation index is changed when the information signal frequency changes.", "m = = = 37.5"], "jumps": ["P1320", "P1290"]}, {"id": "P1320", "text": ["Also, notice that changes in the frequency deviation also change the modulation index.", "m = = = 25"], "jumps": ["P1330", "P1290"]}, {"id": "P1330", "text": ["In other words, the frequency of the modulation signal and the amount of frequency deviation will change the modulation index.", "m = = = 18.75 m = = = 37.5 m = = = 25"], "jumps": ["P1340", "P1290"]}, {"id": "P1340", "text": ["The deviation ratio can be found by using this formula:n ratio The deviation ratio can be found by using this formula:::::::::::"], "jumps": ["P1342", "P1330"]}, {"id": "P1342", "text": ["Notice that this formula is also used to calculate the maximum modulation index.For example, the maximum modulation index frequency is 2 when the maximum deviation frequency is 100 kHz and the maximum modulation frequency is 50 kHz...."], "jumps": ["P1350", "P1340"]}, {"id": "P1350", "text": ["The formula for the deviation ratio is the maximum frequency deviation (fdmax) divided by the maximum modulating frequency (fmmax)."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["For example, if the information signal is voice, 40 Hz to 4 kHz, and using the 75 kHz limit for deviation, the deviation ratio equals 18.75.", "Ratio = = = 18.75"], "jumps": ["P1370", "P1340"]}, {"id": "P1370", "text": ["If the information signal increases slightly by 2 kHz, the deviation ratio is the same because the signal could rise to 4 kHz."], "jumps": ["P1380", "P1360"]}, {"id" t have divided the maximum deviation by itself or the maximum/minimum modulating frequency by itself. Remember the formula for deviation ratio........"], "jumps": []}, {"id": "P1395", "text": ["DEVIATION RATIO - The deviation ratio equals the maximum deviation divided by the maximum modulating signal."], "jumps": []}, {"id": "P1400", "text": ["y sideband frequencies and AM only has two. 3", "- Carrier - 1st Sideband - 2nd Sideband - 3rd Sideband - 4th Sideband - 5th Sideband - 6th Sideband", ".25 .5 1.0 1.5 2.0 2.5 3.0 3.5 4.00000.0", "SIDEBANDS The major difference is that FM can have many sideband frequencies and AM only has two."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["Remember, like AM waveforms, FM waveforms are not made of the carrier frequency and the modulating frequency."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["AM and FM waveforms are complex waveforms that are a combination of the carrier frequency and sideband frequencies."], "jumps": ["P1430", "P1400"]}, {"id": "P1430", "text": ["The many sidebands in FM waveforms are due to the numerous frequency shifts produced by the modulating signal."], "jumps": ["P1440", "P1400"]}, {"id": "P1440", "text": ["Consequently, in theory, FM waveforms can have an infinite number of sidebands."], "jumps": ["P1450", "P1400"]}, {"id": "P1450", "text": ["But, many of the higher order sidebands contain a very small amount of power and therefore can be ignored."], "jumps": ["P1460", "P1400"]}, {"id": "P1460", "text": ["The graph below illustrates that as the modulation index increases, the number of significant sidebands increase, and the amplitude of the carrier and sidebands change."], "jumps": ["P1470", "P1400"]}, {"id": "P1470", "text": ["The graph is called the Bessel Function, named after the person who developed it."], "jumps": ["P1480", "P1400"]}, {"id": "P1480", "text": ["At a modulation index of 0, no modulation, the carrier signal has an amplitude of 100% and there are no sideband ted the wrong modulation index.  A modulation index of about 1.5 would give a carrier amplitude of 50% or 5 Vpp.", "You either did not use the graph correctly or you calculated the wrong modulation index. A modulation index of about 1.5 would give a carrier amplitude of 50% or 5 Vpp.."], "jumps": []}, {"id": "P1545", "text": ["CALCULATING CARRIER AMPLITUDE - To calculate carrier amplitude, you use the graph to find % amplitude and multiply by the original carrier frequency amplitude. Also, to determine % amplitude, you need to know the maximum modulation index. Remember the modulation index equals:"], "jumps": []}, {"id": "P1550", "text": ["BANDWIDTH \nThe bandwidth of a communication system is the highest frequency used in the system.   Just as with AM, FM has a bandwidth also.", "BANDWIDTH The bandwidth of a communication system is the highest frequency used in the system. Just as with AM, FM has a bandwidth also."], "jumps": ["P1560", "P1540"]}, {"id": "P1560", "text": ["In the AM system, the bandwidth of the AM waveform is twice the modulating frequency, or the range of frequencies between the lower and upper sidebands."], "jumps": ["P1570", "P1550"]}, {"id": "P1570", "text": ["FM is a little more complex since there are normally more than two sidebands.", "- Carrier - 1st Sideband - 2nd Sideband - 3rd Sideband - 4th Sideband - 5th Sideband - 6th Sideband", ".25 .5 1.0 1.5 2.0 2.5 3.0 3.5 4.00000.0"], "jumps": ["P1580", "P1560"]}, {"id": "P1580", "text": ["The bandwidth of an FM waveform is the modulating frequency times 2 times the number of sidebands."], "jumps": ["P1590", "P1570"]}, {"id": "P1590", "text": ["What is the bandwidth of an FM waveform at 100 MHz modulated with a 18.75 kHz signal and that has a maximum deviation of\n37.5 kHz?", "What is the bandwidth of an FM waveform at 100 MHz modulated with a 18.75 kHz signal and that has a maximum deviation of 37.5 kHz?"], "jumps": ["P1580", "P1595"]}, {"id": "P1591", "text": [], "jumps": []}, {"id": "P1592",  "jumps": ["P1630", "P1600"]}, {"id": "P1630", "text": ["This is the big advantage of FM systems over AM systems, noise can be eliminated."], "jumps": ["P1910", "P1600"]}, {"id": "P1910", "text": ["This completes the information on FREQUENCY MODULATION.", "This completes the information on FREQUENCY MODULATION....."], "jumps": ["P1001", "P1600"]}, {"id": "P1920", "text": ["1.  Frequency modulation is a signal processing technique that          modifies a carrier signal by an information signal.", "1. Frequency modulation is a signal processing technique that modifies a carrier signal by an information signal."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  The transmitter signal processing changes the frequency of a       constant level carrier signal according to the amplitude of an         information signal.", "2. The transmitter signal processing changes the frequency of a constant level carrier signal according to the amplitude of an information signal."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The receiver signal processing picks up the FM signal                     through a tuning process and the information signal is                     recovered.", "3. The receiver signal processing picks up the FM signal through a tuning process and the information signal is recovered."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  The carrier frequency must be higher than the information               frequency.  Carrier frequencies are above 5 MHz.", "4. The carrier frequency must be higher than the information frequency. Carrier frequencies are above 5 MHz."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  The modulation index and deviation ratio are the amount that         the carrier signal is modulated.", "5. The modulation index and deviation ratio are the amount that the carrier signal is modulated."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  Sidebands are frequencies above and bel let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
