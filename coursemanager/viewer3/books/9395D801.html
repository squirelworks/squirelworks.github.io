const book = {"title": "9395D801", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: AcousticsE sdf sdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe sound waves. w Describe sound wavelength, frequency and pitch. w Describe the Doppler effect. w Define sound intensity. radiation."], "jumps": []}, {"id": "P400", "text": ["Let's begin the lesson on INTRODUCTION TO SOUND.S........................."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on ACOUSTICS.1 TITLE........"], "jumps": ["P1870"]}, {"id": "PINFO", "text": ["10-04-00 Converted sm to tbk - lisa 10-09-00 text & branching - frieda 11-01-00 Graphics - Alexis Ayala 12-05-00 Review - lisa 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 05-13-02 Review - lisa 11-13-02 Reviewed & edited graphics & text. jeff 11-13-02 Ran lesson and renumbered to reflect one objective. frieda 08-13-03 Changed text on P1200 to", "The speed of sound depends on many variable, such as the density, rigidity, and temperature of the material the sound is passing through. Temperature has little effect on the speed of sound through solids and liquids, but has a substantial influence on the speed of sound through a gas", "The warmer a gas is, the faster sound will travel through it. -Jeff Hatcher 03-23-04 P1470, changed \"15,000\" to 1,500\", P1480 change \"20,000\" to \"2,000\", P1482 changed 15,000 and 20,000 to 1,500 and 2,000. -Phil 03-25-04 made text correections to P1, p1120,p1170, p1200, p1400, p1460, p1620, p1630, p1650, p1700, p1720, p1770, p1840 , p1873, p10210, p10211, p10217 - P10, p100, p400, p900, p1001, p10410 changed from sound to acoustics - patty 03-31-02 remove script from p1200 for animation. - patty"], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The science of sound is called acoustics. Sound is made up of a pattern of waves, kind of like the ones you see at the beach. These waves happen in a regular, continuous motion.ntinuous motion.", "In the ocean, the current may move you toward or away from the shore, but the waves themselves don't move you forward. These waves are very similar to sound waves.very similar to sound waves...", "There are many types of waves. Sound is created by compression waves. The spring below illustrates compression."], "jumps": ["P1030", "P1001", "P1040", "P1020", "P1050"]}, {"id": "P1050", "text": ["Compression waves are made when molecules in the air are squashed together and thinned out."], "jumps": ["P1040", "P1060"]}, {"id": "P1060", "text": ["Rarefaction is the spreading out of molecules in space."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["The process of compression and rarefaction transfers energy from one molecule to another through a medium (air, gas, water, glass, etc.). Sounds are produced by vibrating matter."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["The movement of the wave in the same direction as the vibrations which cause it are referred to as longitudinal waves. When the vibrations are not in line with the direction of travel, the waves are called transverse waves..."], "jumps": ["P1050", "P1090"]}, {"id": "P1090", "text": ["This is the same manner that sound is produced when a guitar string is plucked."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["Another example of a transverse wave is the wave generated by shaking a garden hose from side-to-side and watching the wave travel down the length of the hose.", "Medium displaced (Perpendicular to direction of travel)"], "jumps": ["P1110", "P1090", "P", "Perpendicular"]}, {"id": "P1110", "text": ["Compression waves can travel through any material. Different mediums transmit sounds at different speeds."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["Sound cannot travel through a vacuum or in space due to the absence of matter.."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["Liquids are very efficient transmitters of sound. A swimmer can easily hear the splashes of objects being dropped in the water. Sound travels faster in water than in air."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["The speed of sound through air is approximately 770 miles per hour. Distances can be calculated from the source of a sound by using this figure."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["For example, you may see a steam locomotive in the distance let a puff of steam out its whistle, then seconds later you hear the sound of the whistle."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["You saw the steam first because light waves travel faster than sound waves.."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["Then your ears sensed the train's whistle."], "jumps": ["P1180", "P1150"]}, {"id": "P1180", "text": ["This also explains why you see the flash of lightning before you hear the thunder."], "jumps": ["P1190", "P1150"]}, {"id": "P1190", "text": ["What happens to the speed of sound in different materials?."], "jumps": ["P1180"]}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1192", "text": ["Different substances will transmit sound at different rates. For example, liquids are very efficient transmitters of sound. Sound travels faster in water than in air."], "jumps": []}, {"id": "P1200", "text": ["The speed of sound depends on many variables, such as the density, rigidity, and temperature of the material the sound is passing through. Temperature has little effect on the speed of sound through solids and liquids, but has a substantial influence on the speed of sound through a gas.", "The Speed of Sound in air varies according to the formula v(sound) = (0.6 m/s/ oC)T Where T = Air Temperature in oCC"], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["The warmer a gas is, the faster sound will travel through it."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["In still air at a constant temperature, sound travels uniformly, but this condition rarely exists. Sound generally travels faster near the ground because the temperature near the ground is usually higher.."], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["A rain storm will cool the ground faster than the air above. When this happens sounds travel faster at distances farther above ground."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["Which type of air does sound travel faster in?............."], "jumps": ["P1220"]}, {"id": "P1241", "text": [], "jumps": []}, {"id": "P1242", "text": ["Remember sound travels faster at higher temperatures.......", "Sound waves travel in all directions. Sound can be reflected by the ground, trees, mountains, and walls."], "jumps": ["P1255", "P1240"]}, {"id": "P1255", "text": ["Reflected sound waves can pass through each other without affecting individual waves.", "This is why you can hear both a singer and a piano at the same time. The sound waves from each do not cancel out or have any effect on each other."], "jumps": ["P1260", "P1250", "P1270"]}, {"id": "P1270", "text": ["We can only recognize the difference between two sounds if they arrive at our ears at least 1/10th of second apart."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["If two similar sounds reach the ear quicker than 1/10th of a second, you will hear an echo.", "This echo has many practical uses. This effect is used in stereo equipment to simulate live surrounding sound."], "jumps": ["P1270", "P1290", "P1300"]}, {"id": "P1300", "text": ["The stereo sound is delayed to the rear speakers for 10-30 milliseconds. This short delay of voices and musical sounds feels more realistic, like a live performance.", "The Navy also uses this echo effect in different types of sonar. One simple type is the depth sounder. A depth sounder indicates how deep the water is below the ship."], "jumps": ["P1310", "P1290", "P1320"]}, {"id": "P1320", "text": ["A unit attached to the hull sends out a sound wave that is reflected off the bottom of the ocean and returned."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["By measuring the length of time between sending and receiving the returning signal, the depth can be quickly calculated."], "jumps": ["P1340", "P1310"]}, {"id": "P1340", "text": ["What characteristic is an echo effect used to determine?..."], "jumps": ["P1310"]}, {"id": "P1341", "text": [], "jumps": []}, {"id": "P1342", "text": ["A sound that is transmitted, reflected and received doesn't measure weight.", "Intensity refers to the amount of energy (power) in the sound. The intensity of sound can be increased or decreased by the shape of objects in a room. These objects absorb sound.."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["Concert halls and auditoriums are built in a concave oval shape. This increases the intensity of the sound waves, directing them towards the audience.", "In contrast, libraries and many restaurants wish to keep sound levels down. Pictures, flat objects and carpets are used to absorb sound.", "2\" 8' UO/{`!o_(}q*ra.qa0p`0o_.?//n^/o_.?0-B2(8)", "g-iY.hX iL l\\ fV,dT,aQ*\\L3OO-XN VB-~a/dT(N> 6&\"4$", "*od-td-l]/n^0p`0p`0p`0?0 nO/P@.n^ oP,VC*UE'YA%^O cH\"K;#4$'SB*LL", "4$!:)!UO/y_!n^(|q*ra.qa0p`0p`/@00p`0p`0?0/A1.B1/p_0G80M=(lU W=/K<#B4#^N']M/\\U,D;\":,-;4'<A:C=5K>", "o0@?0p`0p`0p`0p`/P@0p`0p`.p^,P@/[K'O?%A1/dU.bT#`J5TM3GC#;8/JV*NH3RL7A./. W[W=QL", "u)sd-n_/o_/n^0o_0p`0p`0?00p`0p`0p`/A1 3# D2-G50K</QA U>(SC!aR'YA-PE3[[1KJ,C;.G67dP:YB[d`", "O?!RB(rZ)hN)VF#QA)WG$WG-WP)UE)TD(YI([K*fS(K< @-#<,0D50BA0_P0p`0p`0p`/@00p`0p`0p`0p`0`Q0aQ0p`-bP-p\\;WS,[L0bSGc_/;7&:)/8!D0", ")8(!1\",<-/4&#4($3&16)4>30H>(H9'J6)D7'O@'SC(P@#aH qW*pU tY+{_+aQ,bR bF,bR,fV,fV/hX/n^,`P.k['SF*9*", "/@0/@0 P@/@00o_0aQ0p`0p`/~l.P@.TB$9(\"7&ha\\592/:\"@-", "j iL.M=.jZ/k[.l^.n^/m]0ra/E5.iY+_O*:+&7'#'"], "jumps": ["P1370", "P1350", "P1380", "P1360", "P"]}, {"id": "P1380", "text": ["These objects break up, reduce and absorb the sound waves, therefore reducing the level of sound."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["Sound is commonly measured by its frequency and wavelength. Frequency is the number of waves produced in one second. The wavelength of sound is the distance between two crests of a wave. The unit of measure for frequency is Hertz (Hz)....ure for frequency is Hertz (Hz)."], "jumps": ["P1400", "P1370"]}, {"id": "P1400", "text": ["There are many names for different kinds of sound. All sound waves have a definite frequency. Tone is developed by definite sound waves emitted from a central source."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["Irregular and unrelated sporadic sounds are considered noise."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["Frequency is the number of waves per _______..............."], "jumps": ["P1400"]}, {"id": "P1421", "text": [], "jumps": []}, {"id": "P1422", "text": ["Frequency is measured by the number of cycles (waves) per second."], "jumps": []}, {"id": "P1430", "text": ["Pitch is a certain sound with definite tone and frequency. The pitch of a sound is how the frequency of its waves compare to the musical scale."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["Different pitches are developed from different vibrations or frequencies. When a guitar string is plucked the string vibrates. The string may vibrate in one, two, three or more segments."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["When the string vibrates in one segment it is called the fundamental or first harmonic. This is the lowest frequency the string can make."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["When the string vibrates in two segments it is called the second harmonic. It has twice the frequency of its fundamental frequency.."], "jumps": ["P1470", "P1450"]}, {"id": "P1470", "text": ["The third harmonic has a frequency three times the fundamentals and the fourth is four times."], "jumps": ["P1480", "P1450"]}, {"id": "P1480", "text": ["It is easy to pick out the sound of different instruments in an orchestra. This is because of the difference in sound quality or timbre."], "jumps": ["P1450"]}, {"id": "P1482", "text": ["It is easy to pick out the sound of different instruments in an orchestra. This is because of the difference in sound quality or timbre.."], "jumps": ["P1450"]}, {"id": "P1485", "text": ["TIMBRE - The quality of sound is also called timbre. To improve timbre, harmonics are added to the fundamental to make a richer fuller sound."], "jumps": []}, {"id": "P1500", "text": ["The quality of sound is improved by the addition of harmonics. The quality of sound depends on the intensity and number of harmonics produced."], "jumps": ["P1510", "P1482"]}, {"id": "P1510", "text": ["Frequency of a string varies with length, diameter, density, and tension. The difference in diameter can readily be seen in guitar strings."], "jumps": ["P1520", "P1500"]}, {"id": "P1520", "text": ["What is another name for the first harmonic?..............."], "jumps": ["P1510"]}, {"id": "P1521", "text": [], "jumps": []}, {"id": "P1522", "text": ["A second harmonic vibrates in two segments................."], "jumps": []}, {"id": "P1523", "text": ["The pitch of a sound is how the frequency of its waves compare to the musical scale."], "jumps": []}, {"id": "P1530", "text": ["In a piano the longer thicker strings produce the low or bass frequencies, while the thinner, tighter and shorter strings produce the higher frequency tones."], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["When you pluck a string stretched across a block of wood it will vibrate and produce a humming sound."], "jumps": ["P1550", "P1530"]}, {"id": "P1550", "text": ["When a hollow box is attached between the strings, the intensity of the sound increases."], "jumps": ["P1560", "P1540"]}, {"id": "P1560", "text": ["This increase in sound is due to forced vibrations. The vibration of the string forces air in the box to vibrate.", "Another type of forced vibration is called resonance or sympathetic vibrations. A glass vibrating when a person is singing nearby is an example of resonance."], "jumps": ["P1570", "P1540", "P1580"]}, {"id": "P1580", "text": ["Resonance occurs when the natural vibration rate of two objects are the same."], "jumps": ["P1590", "P1570"]}, {"id": "P1590", "text": ["What kind of frequencies does a long, thick string produce?"], "jumps": ["P1570"]}, {"id": "P1591", "text": [], "jumps": []}, {"id": "P1592", "text": ["In a piano the longer thicker strings produce the low or bass frequencies, while the thinner, tighter and shorter strings produce the higher frequency tones."], "jumps": []}, {"id": "P1600", "text": ["Sound is the range of compression waves we can hear. The human ear can only hear from about 20 to 20,000 hertz. Hertz is the number of cycles per second of a sound wave."], "jumps": ["P1610", "P1590"]}, {"id": "P1610", "text": ["A frequency of 20 hertz would be considered very low bass sound. In comparison, a 20,000 hertz wave would be a very high treble.", "Frequencies above our hearing can still be heard by animals such as dogs. Dog whistles emit high pitched sounds that we cannot hear, but dogs can.."], "jumps": ["P1620", "P1600", "P1630"]}, {"id": "P1630", "text": ["Frequencies above most animals' hearing (over one hundred thousand cycles) are called ultrasonic frequencies."], "jumps": ["P1640", "P1620"]}, {"id": "P1640", "text": ["What is the frequency range of human hearing?' hearing?...."], "jumps": ["P1620"]}, {"id": "P1641", "text": [], "jumps": []}, {"id": "P1642", "text": ["Sound is the range of compression waves we can hear. A 20 hertz wave would be considered a very low bass sound. In comparison, a 20,000 hertz wave would be a very, high treble.reble.", "Today, ultrasound is used to clean jewelry, drill holes in materials, and in medical treatments. Ultrasound is used to clear blocked arteries and break up gall stones without making incisions.ultrasound is that no cutting or surgery is required.is required...", "When a police car rushes by you with its siren blaring, the sound quickly drops off as it passes.. off as it passes."], "jumps": ["P1660", "P1640", "P1670", "P1650", "P"]}, {"id": "P1670", "text": ["As the police car rushes towards you, its sound waves strike you more frequently and are compressed in a smaller area."], "jumps": ["P1660"]}, {"id": "P1680", "text": ["When the car passes, fewer sound waves strike your ear each second. This makes tone of the siren seem to drop. This occurrence is called the Doppler Effect."], "jumps": ["P1660"]}, {"id": "P1690", "text": ["This Doppler Effect makes the frequency of sound emitted by a moving object seem to increase as the object approaches, and makes the frequency lower as the object moves away."], "jumps": ["P1660"]}, {"id": "P1700", "text": ["Scientists use the Doppler Effect in many ways. includiIt is used to calculate the speed of planes, satellite communication, and measuring star distances.", "Scientists use the Doppler Effect in many ways, including calculating the speed of planes, enabling satellite communication, and measuring star distances. .", "Doppler radar and sonar systems can judge the speed of ships, submarines, and in airplanes the system can detect dangerous air turbulence called wind shear.", "The Doppler effect is used in police radar. The radar calculates a passing car's speed."], "jumps": ["P1660", "P1700"]}, {"id": "P1730", "text": ["Intensity is the volume of sound energy. Sound waves cannot be seen by the human eye, but they can be transferred to electrical impulses and displayed on an oscilloscope..lloscope."], "jumps": ["P1720"]}, {"id": "P1740", "text": ["By connecting a microphone to the oscilloscope, we can observe the differences between loud and soft sounds."], "jumps": ["P1730"]}, {"id": "P1750", "text": ["A soft constant hum pattern has a lower amplitude than a louder hum."], "jumps": ["P1730"]}, {"id": "P1760", "text": ["Notice the amplitude (height) of the loud hum is larger. An increase in amplitude corresponds to an increase in volume.", "Distance from the source of the sound also affects intensity. This is a direct relationship; that is, the greater the distance, the lower the intensity of the sound."], "jumps": ["P1750", "P1780"]}, {"id": "P1780", "text": ["Sound intensity is commonly measured in decibels (dB). For example, a whisper could range from 20-30 dB and the crack of thunder could be 100 dB."], "jumps": ["P1770"]}, {"id": "P1790", "text": ["An increase in amplitude indicates an increase in _______.."], "jumps": ["P1780"]}, {"id": "P1791", "text": [], "jumps": []}, {"id": "P1792", "text": ["The speed of sound depends on many variables. The main factor is the temperature of the substance it passes through."], "jumps": []}, {"id": "P1793", "text": ["Frequency is the number of waves per second, not the amplitude of the sound.", "Noise pollution is considered unwanted or excessively loud sounds. Exposure to loud noises can cause permanent hearing loss. This is especially true when the sound is close to the ears."], "jumps": ["P1790"]}, {"id": "P1810", "text": ["For example, many doctors predict that hearing loss in the U.S. will increase due to the wide use of portable stereo headphones. This loud music, being produced so close to the ear drum, can cause severe and permanent hearing loss.hearing loss...."], "jumps": ["P1800"]}, {"id": "P1820", "text": ["Sound may seem flat or dead in wide open spaces. For example, a speech or concert heard outdoors without any amplification would be difficult to hear and rather dull sounding.", "Inside a room the reflection of sound makes the sound more uniform and the impression of the sound lasts longer in this confined space."], "jumps": ["P1800", "P1820"]}, {"id": "P1840", "text": ["This effect is called reverberation and gives sound a more life-like tone, although too much reverberation may cause unpleasant sounds considered noise....."], "jumps": ["P1830"]}, {"id": "P1850", "text": ["The shape and makeup of a room has a major effect on the sound or acoustics."], "jumps": ["P1830"]}, {"id": "P1860", "text": ["The shape of a room may cause dead spots where the sound fades off rapidly or hot spots where the sound is too loud."], "jumps": ["P1830"]}, {"id": "P1870", "text": ["Reflection of sound may also be called _______............."], "jumps": ["P1830"]}, {"id": "P1871", "text": [], "jumps": []}, {"id": "P1872", "text": ["Noise pollution is considered unwanted or excessively loud sounds. Too many reverberations can cause excessive noise."], "jumps": []}, {"id": "P1873", "text": ["Dead spots are times where the sound fades off rapidly usually caused by the shape of a room...room.."], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P1920", "text": ["1. Sound is transmitted by compression and rarefaction of molecules in matter.", "2. Compression waves create sound and are sometimes called longitudinal waves...", "3. Temperature is a main factor when the speed of sound is considered."], "jumps": ["P1930", "P1001", "P1940", "P1920", "P1950", "P3950"]}, {"id": "P1950", "text": ["4. Sound is commonly measured by its frequency and wavelength. Frequency is the number of waves produced in one second. The wavelength of sound is the distance between the two crests of a wave."], "jumps": ["P1999", "P1940"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1950"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["Sound waves cannot travel through _______"], "jumps": []}, {"id": "P10211", "text": [], "jumps": []}, {"id": "P10212", "text": [], "jumps": []}, {"id": "P10213", "text": ["The fundamental or first harmonic is the ________ frequency that a string can make."], "jumps": []}, {"id": "P10214", "text": ["Resonance or sympathetic vibration occurs when _______", "two objects have the same natural vibration frequency.", "sound is reflected off of a solid object."], "jumps": []}, {"id": "P10215", "text": ["The normal ranges of frequencies that a human can hear is approximately _______"], "jumps": []}, {"id": "P10216", "text": let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
