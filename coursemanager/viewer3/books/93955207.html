const book = {"title": "93955207", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: CLOSED LOOP FEEDBACK CONTROL OF DC MOTORSdf sadf"], "jumps": []}, {"id": "P10", "text": ["CLOSED LOOP FEEDBACK CONTROL OF DC MOTORS"], "jumps": []}, {"id": "P100", "text": ["w Describe the closed loop feedback system used on the 280 trainer. w Describe the operation of the Nida DC Controller (PC130- 281).", "w Verify proper closed loop feedback control of a universal DC motor. w Examine control signals in a typical closed loop feedback system...."], "jumps": ["PC130"]}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "3. Nida Model 280 Rotating Machinery Trainer", "6. Nida Model 414 Variac imeterXXXXXXXXXXnt"], "jumps": []}, {"id": "P301", "text": [], "jumps": []}, {"id": "P330", "text": ["Nida Model 280 Rotating Machinery Trainer"], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P341", "text": [], "jumps": []}, {"id": "P350", "text": [], "jumps": ["P"]}, {"id": "P360", "text": [], "jumps": []}, {"id": "P361", "text": [], "jumps": []}, {"id": "P362", "text": ["In this lesson, you will learn about a circuit that performs feedback control of a DC motor. Closed Loop Feedback System"], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["In particular, you will learn about the closed loop feedback system used on the 280 trainer."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["You will experimentally verify proper closed loop feedback system operation."], "jumps": ["P400", "P430"]}, {"id": "P430", "text": ["Signals will be examined throughout the lesson."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["Let's begin the lesson on CLOSED LOOP FEEDBACK CONTROL OF DC MOTORS........."], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["There are many different methods of controlling motors by using feedback to indicate speed. Input DC Output Motor Feedback Circuit Feedback Control"], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Closed loop feedback systems are recognized by the fact that there is a \"closed loop\" from motor output to motor input."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The Nida 280 trainer and 130 test console can be configured as a closed loop feedback system. 280 130", "The Nida experiment card PC130-281 contains the controlling circuitry."], "jumps": ["P1050", "P1020", "P1060"]}, {"id": "P1060", "text": ["Let's examine the closed loop feedback system used on the 280 trainer. 280 Input DC Output Motor Feedback Circuit"], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["The DC motor receives it's input power from the PC130-281 by way of the PC130-280 card."], "jumps": ["P1073", "P1060"]}, {"id": "P1073", "text": ["The variac supplies 360 sinewave power to PC130-281 where it is applied to a 360 triac controller."], "jumps": ["P1074", "P1070"]}, {"id": "P1074", "text": ["The Triac controller in PC130-281 is controlled by the RPM output of the 280 trainer, a closed loop system."], "jumps": ["P1080", "P1070"]}, {"id": "P1080", "text": ["Motor output shaft RPM is detected by means of a magnetic pickup."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["Motor shaft RPM information is fed to the motor controlling circuitry."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["The signal is then processed and fed back to the DC motor as an input signal.", "Processed Signal from DC Motor"], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["Which of the following detects motor shaft RPM?............"], "jumps": ["P1100"]}, {"id": "P1111", "text": [], "jumps": []}, {"id": "P1112", "text": ["The controlling circuitry receives the shaft RPM information but does not detect shaft RPM."], "jumps": []}, {"id": "P1113", "text": ["The DC motor produces shaft RPM and receives input signals from the controlling circuitry."], "jumps": []}, {"id": "P1120", "text": ["The magnetic pickup used on the 280 trainer generates an RPM sensitive signal."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["The teeth of the output shaft create ON and OFF spots that are detected by the pickup."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["This signal is sent to the interface card for digital processing (IC1). The signal is converted to a square wave.", "Now, let's see how the feedback circuit on PC130-281 operates."], "jumps": ["P1146", "P1120", "P1150", "P1140"]}, {"id": "P1150", "text": ["The square wave signal, indicating motor speed, is then sent to the DC motor control circuitry for further processing."], "jumps": ["P1160", "P1146"]}, {"id": "P1160", "text": ["Q1 is a common emitter amplifier which applies a small gain to the signal while inverting it."], "jumps": ["P1170", "P1146"]}, {"id": "P1170", "text": ["Q2 and Q3 form a monostable multivibrator circuit."], "jumps": ["P1180", "P1146"]}, {"id": "P1180", "text": ["The multivibrator circuit produces a constant width signal with a frequency variation proportional to motor RPM. Constant width", "This constant width signal is applied to IC1..............."], "jumps": ["P1190", "P1146", "P1200", "P1180"]}, {"id": "P1200", "text": ["IC1 and its associated components form a filter circuit that changes the variable frequency square wave into a proportional DC level.", "Notice that the multivibrator signal is connected to the inverting input of the op-amp."], "jumps": ["P1210", "P1190", "P1220", "P1200"]}, {"id": "P1220", "text": ["As the input signal frequency decreases, the DC output from the op-amp decreases. + VDC DC Signal 0 V"], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["As the input signal frequency increases, the DC output from the op-amp increases.", "The frequency variations are now directly related to DC amplitude variations.", "IC2 inverts the signal again and R12 provides an adjustable negative bias as an offset."], "jumps": ["P1240", "P1220", "P1250", "P1260"]}, {"id": "P1260", "text": ["In other words, the bias from R12 is overcome by the signal level from IC1. IC2 is the comparator circuit."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["IC3 is an opto-isolator. This component insulates low voltage semiconductor circuits from high voltage AC circuits."], "jumps": ["P1280", "P1250"]}, {"id": "P1280", "text": ["By having an optical (rather than physical) connection between the circuits, IC3 serves as a safe interface.", "The signal from IC3 is applied to Q4 where it is amplified."], "jumps": ["P1290", "P1250", "P1300"]}, {"id": "P1300", "text": ["Triac Q5, zener diode D4, and D3 comprise the 360 time controller.", "Notice that Q5 is in series to the 60 Hz input power."], "jumps": ["P1320", "P1290", "P1330"]}, {"id": "P1330", "text": ["The triac turns on when a gate voltage is applied, and the time controlling the power to the DC motor."], "jumps": ["P1340", "P1290"]}, {"id": "P1340", "text": ["The gate voltage to Q5 is developed by IC2, the comparator."], "jumps": ["P1350", "P1290"]}, {"id": "P1350", "text": ["If RPM decreases, the frequency of the square wave from Q2 and Q3 also decreases. This decreases the DC output of IC1.", "When the voltage output of IC1 decreases, the voltage output if IC2 increases.", "A higher DC voltage out of IC2 turns Q5 on at an earlier point in the cycle, increase the average voltage output to the motor.", "The motor speeds up, and RPM returns to its original value.", "If RPM increases, the frequency of the square wave from Q2 and Q3 also increases. This increases the DC output of IC1.", "As the output of IC1 increases, the voltage output of IC2 decreases.", "The lower DC voltage is from IC2 turns Q5 on at a later point in the cycle which decreases the average voltage output to the motor.", "The motor slows down and RPM returns to its original value.", "For a constant RPM input, what signal is applied to the gate of Q5?"], "jumps": ["P1360", "P1290", "P1370", "P1380", "P1390", "P1400", "P1410", "P1420", "P1430"]}, {"id": "P1431", "text": [], "jumps": []}, {"id": "P1432", "text": ["Applying 0 volts to the gate of Q5 would not allow Q5 to turn ON. In other words, no power applied to the motor and the rotation would stop."], "jumps": []}, {"id": "P1433", "text": ["A varying DC voltage to the gate of Q5 is caused by a varying DC output of IC2, the comparator. This, in turn, is caused by a varying output of IC1 which would be caused by a varying RPM input - which is not the case.", "Which answer identifies the components? DC/AC Isolation Time Control Filter Comparator D4,IC3,Q5 D3,Q5,Q4 IC2,IC1,Q2/Q3 Q2/Q3,IC2,IC1"], "jumps": ["P1430"]}, {"id": "P1441", "text": ["You did not select the correct components and their functions."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on THEORY OF OPERATION......"], "jumps": ["P1001", "P1440"]}, {"id": "P1920", "text": ["1. Closed loop feedback systems are recognizable by the fact that there is a \"closed loop\" from motor output to motor input."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. The DC motor is powered by a 360 time controller circuit."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. Motor output shaft RPM is detected by means of a magnetic pickup."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. Motor shaft RPM information is fed to the motor controlling circuitry."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. The signal is then processed and fed back to the DC motor as an input signal..", "Processed Signal from DC Motor"], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6. The 280 interface card processes the magnetic pickup information into digital pulses to be sent to the DC control circuit.", "7. The 281 controller card contains DC motor control circuitry."], "jumps": ["P1980", "P1960", "P1990", "P1970"]}, {"id": "P1990", "text": ["8. The component functions as: Q1 - Amp Q2/Q3 - M/V IC1 - Filter IC2 - Comparator IC3 - Isolation Q4 - Amp Q5 - 360"], "jumps": ["P1999", "P1980"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["In this experiment, you will verify normal closed loop feedback control of a DC motor."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["You will examine the feedback signal at various points along the feedback path."], "jumps": ["P2035", "P2020"]}, {"id": "P2035", "text": ["These signal measurements are important. In the next lesson, you will troubleshoot the circuit."], "jumps": ["P2040", "P2030"]}, {"id": "P2040", "text": ["Let's begin the experiment. 1. Set the 280 trainer to it's initial control settings."], "jumps": ["P2050", "P2035", "P22000"]}, {"id": "P2050", "text": ["2. Set the Test Console controls to their initial control settings........"], "jumps": ["P2040"]}, {"id": "P2060", "text": ["3. Place the 130 power supply controls as follows:::upply Voltage - 12 V + Supply Voltage - 12 V", "3. Press enter to set the 130E Test Console controls as follows: ntrols as follows: t.......... ON + Power Supply... 24 Volts - Power Supply....15 Volts"], "jumps": []}, {"id": "P2080", "text": ["4. On the AC subpanel, set the line meter switch to IN to isolate variac input from the AC motor."], "jumps": []}, {"id": "P2085", "text": ["5. On the DC subpanel, configure the DC motor for a series field as follows: SWITCH SETTINGS RUN/STOP - RUN DYNAMIC BRAKE - IN SHUNT FIELD - FWD SERIES FIELD - IN OPER/TEST - OPER ROTOR - FWD METER - OUT"], "jumps": ["P2090", "P2080", "P"]}, {"id": "P2090", "text": ["6. Insert PC130-281 into the PC2 position on the 130 test console. 7. Insert PC130-280 into the PC3 position on the 130 test console..."], "jumps": ["P2110"]}, {"id": "P2110", "text": ["8. Connect the 2 pin interconnect from the PC130-281 experiment card to the PC130-286 connector located on the rear of the 280 trainer.."], "jumps": ["P2120", "P2090", "P"]}, {"id": "P2120", "text": ["9. Connect the 8 pin connector from the PC130-280 card to the PC130-280 connector on the 280 trainer. 80 Trainer 130A Test ConsoleON........................................."], "jumps": ["P2130", "P2110", "P"]}, {"id": "P2130", "text": ["10. Connect the 2 Pin Jack cable from the output jacks of the Variac to the 115 VAC input jacks located on the AC subpanel of the 280 trainer."], "jumps": ["P2140", "P2110"]}, {"id": "P2140", "text": ["11. Adjust the % line control of the variac for 75% of line voltage."], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["12. Set R12 on PC130-281 to mid position.................."], "jumps": ["P2160", "P2140", "P2155"]}, {"id": "P2155", "text": ["MEASUREMENT SETUP - Set R12 on PC130-281 to Mid-Position."], "jumps": []}, {"id": "P2160", "text": ["13. Set PC2 and PC3 DC Power switches to ON.", "13. Press Enter to Set PC2 and PC3 DC Power - ON.", "13. Press Enter to Set PC2 and PC3 DC Power - ON.Press Enter to Set PC2 and PC3 DC Power - ON."], "jumps": ["P2150"]}, {"id": "P2170", "text": ["14. Apply power to the variac. Motor action should begin.", "15. Apply power to the variac. Motor action should begin."], "jumps": ["P2177"]}, {"id": "P2177", "text": ["Now the DC motor is setup to be controlled by PC130-281. Let's measure some signals."], "jumps": ["P2180", "P2170"]}, {"id": "P2180", "text": ["1. Connect CH1 of the dual trace oscilloscope to the TACH test point on the PC130-280 card. ing Machinery Interface Nida Corp.", "This is connected to the input of the PC130-281 card......."], "jumps": ["P2177", "P2190", "P2180"]}, {"id": "P2190", "text": ["2. Connect CH2 of the dual trace oscilloscope to TP1 on the PC130-281 experiment card."], "jumps": ["P2200", "P2185"]}, {"id": "P2200", "text": ["Time/Div - .5mS Display - CH1 Trigger - Line, AC, + CH1 & CH2 Volts/Div - 2V CH1 & CH2 AC/GND/DC - AC Sweep Mode - Auto", "3. Set the oscilloscope controls as follows. me/Div - .5mS Display - CH1 Trigger - Line, AC, + CH1 & CH2 Volts/Div - 2V CH1 & CH2 AC/GND/DC - AC Sweep Mode - Auto"], "jumps": ["P2210", "P2185"]}, {"id": "P2210", "text": ["4. Apply power to the oscilloscope and observe the CH1 waveform.", "This square wave signal is from the magnetic pickup and is applied to the input of PC130-281.", "5. Vary R12 on PC130-281 while observing the viewed waveform."], "jumps": ["P2220", "P2200", "P2230", "P2210", "P2240"]}, {"id": "P2240", "text": ["While varying R12, the viewed waveform _______ varied proportionally."], "jumps": ["P2220"]}, {"id": "P2241", "text": [], "jumps": []}, {"id": "P2242", "text": ["Varying the speed of the motor has no bearing on feedback signal amplitude or intensity. This signal is the magnetic pickup loop signal from PC130-280 and is frequency sensitive only."], "jumps": []}, {"id": "P2250", "text": ["The PC130-280 card produces a square wave output with a pulse width change proportional to the frequency change of the magnetic sensor."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["6. Set the oscilloscope Display mode control to Dual and observe CH1 and CH2 waveforms simultaneously.", "7. Vary R12 on PC130-281 while observing the viewed waveform."], "jumps": ["P2270", "P2250", "P2280", "P2260"]}, {"id": "P2280", "text": ["CH1 and CH2 waveforms vary _______ and are _______ degrees out of phase."], "jumps": ["P2270"]}, {"id": "P2281", "text": [], "jumps": []}, {"id": "P2282", "text": ["Notice that one waveform is ON at the same time the other waveform is OFF. This corresponds to 180", "out of phase or completely inverted waveforms.", "CH2 waveform is the output from Q1 (common emitter amplifier), it is inverted. The triangular shape is due to the discharge of C1."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["8. Set the oscilloscope controls as follows. .e/Div - 1mS Display - CH1 Trigger - Line, AC, + CH1 & CH2 Volts/Div - 5V CH1 AC/GND/DC - DC CH2 AC/GND/DC - AC", "Time/Div - 1mS Display - CH1 Trigger - Line, AC, + CH1 & CH2 Volts/Div - 5V CH1 AC/GND/DC - DC CH2 AC/GND/DC - AC Sweep Mode - Auto Auto Auto", "9. Connect CH1 oscilloscope probe to TP3 on the PC130-281 card."], "jumps": ["P2310", "P2290", "P2320", "P2300"]}, {"id": "P2320", "text": ["10. Vary R12 on PC130-281 while observing the viewed waveform."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["Notice that as motor RPM increased, so did the DC voltage level.", "TP3 is the DC output from IC1. A frequency change from the motor corresponds to a DC voltage level variation."], "jumps": ["P2340", "P2310", "P2350", "P2330"]}, {"id": "P2350", "text": ["This frequency sensitive DC waveform is then fed into IC2 where it is amplified and given a negative bias."], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["IC3 and Q4 translate proportional voltage, to a time variable turn on signal, that is applied to the gate of triac, Q5."], "jumps": ["P2370", "P2340"]}, {"id": "P2370", "text": ["11. Place the CH1 X10 oscilloscope probe on the control 1 TP of the 280 card. Use the control 2 TP for ground. 280 Rotating Machinery Interface Nida Corp."], "jumps": ["P2380", "P2340"]}, {"id": "P2380", "text": ["12. Set the oscilloscope to 2ms Time/Div and 2 Volts/Div.."], "jumps": ["P2390", "P2370"]}, {"id": "P2390", "text": ["13. While observing the oscilloscope screen, turn R12 Motor Speed potentiometer fully CCW."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["Notice that the output to the motor was reduced to zero or almost zero."], "jumps": ["P2410", "P2390"]}, {"id": "P2410", "text": ["14. Now, rotate R12 almost fully CW (arrow pointing to the left) while again observing the oscilloscope."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["You should have observed a stable sine wave until the motor reached the base speed where the sine wave began to flutter."], "jumps": ["P2430", "P2400"]}, {"id": "P2430", "text": ["This is caused by the action of IC3 and Q4 switching the triac on and off to maintain a steady motor speed as compared to the base speed."], "jumps": ["P2440", "P2420"]}, {"id": "P2440", "text": ["The RPM of the motor affected its input voltage, verifying Closed Loop Feedback Operation."], "jumps": ["P2430"]}, {"id": "P2450", "text": ["1. Turn Power OFF to the Variac. 2. Return the Test Console to the initial control settings."], "jumps": ["P2430"]}, {"id": "P2460", "text": ["3. Return Rotating Machinery to initial control settings.", "2. Return Rotating Machinery to initial control settings.", "1. Turn Power OFF to the Variac. 2. Return Rotating Machinery to initial control settings.initial control settings.2. Return Rotating Machinery to initial control settings."], "jumps": ["P2470", "P22000"]}, {"id": "P2470", "text": ["3. Set Test Console Power to OFF.3. Set Test Console Power to OFF."], "jumps": ["P2460"]}, {"id": "P2480", "text": ["5. Remove PC130-281 and PC let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
