]}, {"id": "P420", "text": ["Even though few components are used, UJT oscillators produce three output signals."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["A voltage switch,  (UJT Transistor), is controlled by a circuit to produce an oscillator.", "A voltage switch, (UJT Transistor), is controlled by a circuit to produce an oscillator."], "jumps": ["P440", "P410"]}, {"id": "P440", "text": ["Let's begin the lesson on UNIJUNCTION TRANSISTOR OSCILLATOR OPERATION......."], "jumps": ["P410"]}, {"id": "P10229", "text": ["The part of the waveform on the emitter of a UJT oscillator that represents the frequency of the sawtooth wave is _______", "points A to B.ice is d, and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "points B to C.ice is d, and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "points C to D.ice is d, and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor."], "jumps": []}, {"id": "P13220", "text": ["What is the measured frequency of UJT oscillator Q1?  \nRound to the nearest tenth of a kilo hertz.", "What is the measured frequency of UJT oscillator Q1? Round to the nearest tenth of a kilo hertz."], "jumps": ["P13210", "P13222"]}, {"id": "P13080", "text": ["The emitter resistor in this circuit is split in two.  R2 is used to change frequency of the oscillator.", "The emitter resistor in this circuit is split in two. R2 is used to change frequency of the oscillator."], "jumps": ["P13090", "P13040"]}, {"id": "P13100", "text": ["Also note the value of C1, it is in mF.  Let's start the experiment.", "Also note the value of C1, it is in mF. Let's start the experiment...."], "jumps": ["P13110", "P13040"]}, {"id": "P1020", "text": ["This is a typical basic UJT oscillator circuit.", "This is a typical basic UJT oscillator circuit......................"], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["The purpose of the circuit is to act as an oscillator producing a sawtooth wave, changing DC power to AC power."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Vcc applies the bias voltage for Q1.", "Vcc applies the bias voltage for Q1.............................."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["R1 and C1 form an RC circuit that applies emitter voltage to Q1.", "R1 and C1 form an RC circuit that applies emitter voltage to Q1..."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["The operation of the oscillator is based on the RC time constant of R1 and C1.  Let's see how.", "The operation of the oscillator is based on the RC time constant of R1 and C1. Let's see how."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["Initially, before Vcc is applied, Q1 is OFF.  There is no bias voltage on B2 and no TURN ON voltage on E.", "Initially, before Vcc is applied, Q1 is OFF. There is no bias voltage on B2 and no TURN ON voltage on E."], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["Applying Vcc forward biases Q1.  The emitter voltage is still 0 V.  Q1 is OFF.", "Applying Vcc forward biases Q1. The emitter voltage is still 0 V. Q1 is OFF."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["Once Vcc is applied, C1 begins to charge, applying a positive voltage on the emitter of Q1."], "jumps": ["P1100", "P1070"]}, {"id": "P1100", "text": ["At this point, the positive voltage is not large enough to turn Q1 ON."], "jumps": ["P1110", "P1070"]}, {"id": "P1110", "text": ["C1 continues to charge until Q1's TURN ON voltage is reached.", "C1 continues to charge until Q1's TURN ON voltage is reached.."], "jumps": ["P1120", "P1070"]}, {"id": "P1120", "text": ["When Q1 turns ON, C1 is allowed to discharge through the UJT from B1 to E."], "jumps": ["P1130", "P1070", "P1125"]}, {"id": "P1225", "text": ["OSCILLATOR FREQUENCY - Frequency equals 1 divided by time. Time equals 1 RC time constant, therefore:", "T = R x C = 10 kW x .1 mF = 1 msec"], "jumps": []}, {"id": "P13180", "text": ["When a sawtooth is measured on the emitter, the oscillator is operating.  Now, let's check for normal operation by comparing the calculated and measured frequency of the oscillator.", "When a sawtooth is measured on the emitter, the oscillator is operating. Now, let's check for normal operation by comparing the calculated and measured frequency of the oscillator."], "jumps": ["P13190", "P13170"]}, {"id": "P1127", "text": ["When Q1 turns ON, C1 is allowed to discharge through the UJT from B1 to E."], "jumps": ["P1130", "P1070", "P1125"]}, {"id": "P1130", "text": ["C1's voltage drops as it discharges.", "C1's voltage drops as it discharges............................."], "jumps": ["P1140", "P1127"]}, {"id": "P1140", "text": ["Once C1's voltage drops below the TURN ON voltage, Q1 turns OFF.  C1 no longer discharges.", "Once C1's voltage drops below the TURN ON voltage, Q1 turns OFF. C1 no longer discharges."], "jumps": ["P1150", "P1127"]}, {"id": "P1150", "text": ["The cycle repeats.  With Q1 OFF, C1 begins to charge.", "The cycle repeats. With Q1 OFF, C1 begins to charge............"], "jumps": ["P1160", "P1127"]}, {"id": "P1160", "text": ["The voltage on the emitter of Q1 starts at 0 V and increases towards Q1's TURN ON voltage as C1 charges."], "jumps": ["P1170", "P1127"]}, {"id": "P1170", "text": ["Once Q1 turns ON, the emitter voltage drops to 0 V.", "Once Q1 turns ON, the emitter voltage drops to 0 V..............."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["Q1 turns OFF, allowing C1 to charge again.", "Q1 turns OFF, allowing C1 to charge again......................"], "jumps": ["P1190", "P1160"]}, {"id": "P1190", "text": ["The result is a sawtooth waveform on Q1's emitter.  The circuit changes +DC power into AC power.", "The result is a sawtooth waveform on Q1's emitter. The circuit changes +DC power into AC power."], "jumps": ["P1200", "P1160"]}, {"id": "P1200", "text": ["The frequency of the UJT oscillator depends on the charging time of C1, or the RC time constant."], "jumps": ["P1210", "P1160"]}, {"id": "P1210", "text": ["Using 1 TC as the time for one cycle gives an approximation of the frequency of the oscillator."], "jumps": ["P1220", "P1160", "P1214"]}, {"id": "P1212", "text": ["Using 1 TC as the time for one cycle gives an approximation of the frequency of the oscillator."], "jumps": ["P1220", "P1160", "P1214"]}, {"id": "P1214", "text": ["OSCILLATOR FREQUENCY - The actual frequency of the UJT oscillator depends on the applied voltage, the UJTs eta, and the values of R1 and C1."], "jumps": ["P1215", "P1212"]}, {"id": "P1215", "text": ["ETA - Eta equals the value of: Eta = Rbb1", "(Rbb1 + Rbb2) Remember, the emitter forms a voltage divider in the base. The voltage necessary to turn the UJT is the voltage across Rbb1 times Vcc."], "jumps": ["P1216", "P1214"]}, {"id": "P1216", "text": ["RESISTOR AND CAPACITOR VALUES - The values of R1 and C1 establish the time required for C1 to change from 0 V to Vcc. The equates to five time constants (5 x R x C). Normally, Q1 will TURN ON at a voltage level less than Vcc."], "jumps": ["P1217", "P1215"]}, {"id": "P1217", "text": ["OSCILLATOR FREQUENCY - Consequently, the time for C1 to charge from 0 V to Q1's TURN ON voltage is less than 5 time constants. Remember, Q1's TURN ON voltage equals eta times Vcc."], "jumps": ["P1218", "P1215"]}, {"id": "P1218", "text": ["OSCILLATOR FREQUENCY - For example, if Vcc is +12 V and Q1's turn on voltage is 8 V, C1 only had to charge from 0 V to 8 V or 67% of the full charge. 67% of full charge is a little more than 1 TC (recall 1 TC equals 63%)."], "jumps": ["P1219", "P1215"]}, {"id": "P1219", "text": ["OSCILLATOR FREQUENCY - Normally, using 1 time constant to calculate UJT's oscillator frequency gives results close enough to check for normal operation."], "jumps": ["P1212", "P1215"]}, {"id": "P1220", "text": ["For example, the approximate frequency of this UJT oscillator is 1 kHz."], "jumps": ["P1230", "P1212", "P1225"]}, {"id": "P1940", "text": ["3.  R1 and C1 determine the frequency of the oscillator.", "3. R1 and C1 determine the frequency of the oscillator."], "jumps": ["P1950", "P1920"]}, {"id": "P13050", "text": ["Compare the components on PC130-51 to the schematic shown.", "Compare the components on PC130-51 to the schematic shown.."], "jumps": ["P13060", "P13040"]}, {"id": "P1230", "text": ["What type of waveform is on the emitter of this UJT oscillator?"], "jumps": ["P1220"]}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1232", "text": ["The emitter voltage increases from 0 V to Q1's TURN ON voltage by C1 charging.  Once C1 turns ON, the emitter voltage drops to 0 V.  This does not produce a sine wave.", "The emitter voltage increases from 0 V to Q1's TURN ON voltage by C1 charging. Once C1 turns ON, the emitter voltage drops to 0 V. This does not produce a sine wave."], "jumps": []}, {"id": "P1233", "text": ["The emitter voltage increases from 0 V to Q1's TURN ON voltage by C1 charging.  Once C1 turns ON, the emitter voltage drops to 0 V.  This does not produce a square wave.", "The emitter voltage increases from 0 V to Q1's TURN ON voltage by C1 charging. Once C1 turns ON, the emitter voltage drops to 0 V. This does not produce a square wave."], "jumps": []}, {"id": "P1240", "text": ["What determines the frequency of the sawtooth wave in UJT oscillators?"], "jumps": ["P1230"]}, {"id": "P1241", "text": [], "jumps": []}, {"id": "P1242", "text": ["The frequency of the oscillator depends on the time that C1 takes to charge to Q1's TURN ON voltage.  The TURN ON voltage level does affect the time; however, it is not the main consideration.", "The frequency of the oscillator depends on the time that C1 takes to charge to Q1's TURN ON voltage. The TURN ON voltage level does affect the time; however, it is not the main consideration."], "jumps": []}, {"id": "P1243", "text": ["The frequency of the oscillator depends on the time that C1 takes to charge to Q1's TURN ON voltage.  The applied voltage level does affect the time; however, it is not the main consideration.", "The frequency of the oscillator depends on the time that C1 takes to charge to Q1's TURN ON voltage. The applied voltage level does affect the time; however, it is not the main consideration."], "jumps": []}, {"id": "P1250", "text": ["What is the frequency of this UJT oscillator?", "What is the frequency of this UJT oscillator?.............."], "jumps": ["P1240"]}, {"id": "P1251", "text": [], "jumps": ["P1250"]}, {"id": "P1252", "text": ["Remember, frequency equals one over time.  Time equals one RC time constant.", "Remember, frequency equals one over time. Time equals one RC time constant."], "jumps": []}, {"id": "P1260", "text": ["The basic UJT oscillator produces one output signal, a sawtooth wave."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["By adding a small resistor to each base circuit, three output signals are produced."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["Looking at TP1, the output voltage is a little less than +Vcc as long as Q1 is OFF."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["Recall that a UJT acts as a large resistance because the base material is lightly doped.  Since R2 is a small value, most of Vcc is dropped across Q1.", "Recall that a UJT acts as a large resistance because the base material is lightly doped. Since R2 is a small value, most of Vcc is dropped across Q1."], "jumps": ["P1300", "P1270"]}, {"id": "P1300", "text": ["When Q1 turns ON, it conducts heavily causing R2 to drop more voltage.  This decreases the voltage on B2.", "When Q1 turns ON, it conducts heavily causing R2 to drop more voltage. This decreases the voltage on B2."], "jumps": ["P1310", "P1270"]}, {"id": "P1310", "text": ["Q1 does not stay ON very long, only the time it takes for C1 to discharge through R3 (which is also very small), the output signal is a pulse."], "jumps": ["P1320", "P1270"]}, {"id": "P1320", "text": ["The negative going pulse has the same frequency of the sawtooth since both rely on the charging and discharging of C1.", "Q1 OFF OFF TP1 TP3 Q1 ON ON ON"], "jumps": ["P1330", "P1270"]}, {"id": "P1330", "text": ["The small resistor on B1 also produces a pulse.", "The small resistor on B1 also produces a pulse.................."], "jumps": ["P1340", "P1270"]}, {"id": "P1340", "text": ["When Q1 is OFF, the voltage on TP2 is approximately 0 V.", "When Q1 is OFF, the voltage on TP2 is approximately 0 V........."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["Again, recall that a UJT acts as a large resistance because the base material is lightly doped.  R3 being a small value, most of Vcc is dropped across Q1.", "Again, recall that a UJT acts as a large resistance because the base material is lightly doped. R3 being a small value, most of Vcc is dropped across Q1."], "jumps": ["P1360", "P1330"]}, {"id": "P1360", "text": ["When Q1 turns ON, it conducts heavily between E and B1.  The voltage drop across R3 becomes larger.", "When Q1 turns ON, it conducts heavily between E and B1. The voltage drop across R3 becomes larger."], "jumps": ["P1370", "P1330"]}, {"id": "P1370", "text": ["Q1 does not stay ON very long, only the time it takes for C1 to discharge through R3 (which is very small), the output signal is a pulse."], "jumps": ["P1380", "P1330"]}, {"id": "P1380", "text": ["The positive going pulse has the same frequency of the sawtooth since both rely on the charging and discharging of C1.", "Q1 OFF OFF TP3 TP2 Q1 ON ON ON"], "jumps": ["P1390", "P1330"]}, {"id": "P1920", "text": ["1.  UJT oscillators produce a sawtooth wave and two pulse                  outputs.", "1. UJT oscillators produce a sawtooth wave and two pulse outputs..."], "jumps": ["P1930", "P1001"]}, {"id": "P1400", "text": ["The measured frequency is determined by using an oscilloscope or frequency counter."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["The calculated frequency uses one TC of R1 and C1.", "The calculated frequency uses one TC of R1 and C1.............", "Calculated 1 1", "= or T RxC 1 = = 5 kHz .0002"], "jumps": ["P1420", "P1390"]}, {"id": "P1420", "text": ["Is the UJT oscillator operating normally?", "Is the UJT oscillator operating normally?.................."], "jumps": ["P1390", "P1425"]}, {"id": "P1421", "text": [], "jumps": []}, {"id": "P1422", "text": ["Compare the measured indicated frequency with the calculated frequency.  They are the same.", "Compare the measured indicated frequency with the calculated frequency. They are the same."], "jumps": []}, {"id": "P1425", "text": ["NORMAL OPERATING CONDITIONS - Compare calculated frequency to measured frequency. Calculated frequency equals:"], "jumps": []}, {"id": "P1910", "text": ["This completes the information on UNIJUNCTION TRANSISTORS.", "This completes the information on UNIJUNCTION TRANSISTORS.."], "jumps": ["P1001", "P1420"]}, {"id": "P1920", "text": [], "jumps": ["P1930", "P1001"]}, {"id": "P13110", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P13040"]}, {"id": "P13120", "text": ["2.  Carefully plug PC130-51 into the Test Console PC1 position.", "2. Carefully plug PC130-51 into the Test Console PC1 position."], "jumps": ["P13130"]}, {"id": "P13130", "text": ["3.  Adjust R2 on PC130-51 fully CW.", "3. Adjust R2 on PC130-51 fully CW........................."], "jumps": ["P13140", "P13120", "P13135"]}, {"id": "P1930", "text": ["2.  R2 and R3 are used to develop the negative and positive                  going pulses.", "2. R2 and R3 are used to develop the negative and positive going pulses."], "jumps": ["P1940", "P1920"]}, {"id": "P13070", "text": ["You will use UJT oscillator Q1 in this experiment.", "You will use UJT oscillator Q1 in this experiment................."], "jumps": ["P13080", "P13040"]}, {"id": "P13090", "text": ["When calculating the RC time constant, the values of both R1 and R2 must be used."], "jumps": ["P13100", "P13040"]}, {"id": "P1950", "text": ["4.  Q1 remains OFF until the charge on C1 increases to Q1's                 TURN ON voltage.", "4. Q1 remains OFF until the charge on C1 increases to Q1's TURN ON voltage."], "jumps": ["P1960", "P1920"]}, {"id": "P1960", "text": ["5.  When Q1 turns ON, C1 discharges until the voltage decreases        to below Q1's TURN ON voltage.  The cycle repeats                           producing a sawtooth wave.", "5. When Q1 turns ON, C1 discharges until the voltage decreases to below Q1's TURN ON voltage. The cycle repeats producing a sawtooth wave.."], "jumps": ["P1970", "P1920"]}, {"id": "P1970", "text": ["6.  Checking for normal operation requires comparing measured        and calculated frequencies.", "6. Checking for normal operation requires comparing measured and calculated frequencies."], "jumps": ["P1999", "P1920"]}, {"id": "P1999", "text": ["You have completed the Summary.  \nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1920"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["The purpose of this experiment is to check the normal operation of UJT oscillator circuits."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["Pick up the PC130-51 card.  The purpose of this card is to demonstrate the operation of UJT oscillators.", "Pick up the PC130-51 card. The purpose of this card is to demonstrate the operation of UJT oscillators."], "jumps": ["P2050 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
