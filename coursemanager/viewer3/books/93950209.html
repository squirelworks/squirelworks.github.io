const book = {"title": "93950209", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: SYSTEMS OF LINEAR EQUATIONS fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Define a system of equations. w Solve systems of equations by graphing. w Identify consistent, inconsistent and dependent systems by their graphs.", "w Solve systems of equations by substitution. w Identify consistent, inconsistent and dependent systems by the results of substitution.", "w Solve systems of equations by addition. w Identify consistent, inconsistent and dependent systems by the results of addition...."], "jumps": []}, {"id": "P400", "text": ["We know that each equation has many solutions, just choose a value for X and solve to get a value for Y."], "jumps": ["P410", "P100"]}, {"id": "P410", "text": ["Now we will consider both equations together and find one solution which satisfies both equations.", "X Y -2 -5 0 -3 1 -2 4 11", "X Y -2 7 0 5 1 4 4 1"], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["These three methods are used to find the solution to a system of equations."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["In this lesson you will learn about SYSTEMS OF LINEAR EQUATIONS............."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Two or more equations considered together form a system of equations.", "X + Y = 55 -5 0 -3 1 -22", "X - Y = 33 -5 0 -3 1 -22"], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["The ordered pair of numbers (X, Y) which is a solution to all the equations is the solution to the system of equations."], "jumps": ["P1040", "P1020"]}, {"id": "P1032", "text": ["The ordered pair of numbers (X, Y) which is a solution to all the equations is the solution to the system of equations.", "X + Y = 55 -5 0 -3 1 -22", "X - Y = 33 -5 0 -3 1 -22"], "jumps": ["P1040", "P1020"]}, {"id": "P1035", "text": ["ORDERED PAIR - An ordered pair is a set of two numbers which is a solution to an equation or define the location of a point on a graph. The first number of the ordered pair is the X value and the second number is the Y value."], "jumps": []}, {"id": "P1040", "text": ["Let's see how this system of equations is solved by graphing."], "jumps": ["P1050", "P1032"]}, {"id": "P1050", "text": ["Start by graphing the first equation in the system of equations.", "X Y -2 -5 0 -3 1 -2", "X - Y = 33 -5 0 -3 1 -22", "X + Y = 55 -5 0 -3 1 -22"], "jumps": ["P1060", "P1032"]}, {"id": "P1060", "text": ["Now graph the next equation on the same coordinate system.", "X - Y = 33 -5 0 -3 1 -22", "X + Y = 55 -5 0 -3 1 -22", "X Y 0 5 3 2 5 0"], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["The solution to the system of equations is the point where the lines intersect.", "X + Y = 55 -5 0 -3 1 -22", "(4,1) Y -2 -5 0 -3 1 -2"], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["Checking the results verifies the solution.", "X - Y = 3 X + Y = 5 4 - 1 = 3 4 + 1 = 55"], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["Here is another example.", "Here is another example.here...............................", "2X - Y = 4 X - 2Y = 2 2(2) - 0 = 4 2 - 2(0) = 2 .", "(2,0) Y -2 -5 0 -3 1 -2", "2X - Y = 4 -5 0 -3 1 -22", "X - 2Y = 2 -5 0 -3 1 -22"], "jumps": ["P1100", "P1050"]}, {"id": "P1100", "text": ["Type in the solution to this system of equations.", "Type in the solution to this system of equations...........", "3X - 2Y = 3 2X + Y = -5 3Y + 6X = -6"], "jumps": ["P1090"]}, {"id": "P1101", "text": [], "jumps": []}, {"id": "P1102", "text": ["Graph the equations using these coordinates. The solution to the system of equations is the point where the lines intersect.", "Graph the equations using these coordinates. The solution to the system of equations is the point where the lines intersect.m", "2X + Y = -55 5 -5 0 -3 1 -22"], "jumps": []}, {"id": "P1103", "text": ["Your graph should look like this. The solution to the system of equations is the point where the lines intersect.", "2X + Y = -5 -5 0 -3 1 -22"], "jumps": []}, {"id": "P1107", "text": ["The graphs of the equations should have intersected at the point with coordinates (-1,-3)."], "jumps": ["P1110", "P1100"]}, {"id": "P1110", "text": ["Type in the solution to this system of equations.", "Type in the solution to this system of equations..........."], "jumps": ["P1100"]}, {"id": "P1117", "text": ["The graphs of the equations should have intersected at the point with coordinates (2,0).", "The graphs of the equations should have intersected at the point with coordinates (2,0)..."], "jumps": ["P1120", "P1110"]}, {"id": "P1120", "text": ["One of three conditions will result when a system of equations is solved by graphing.", "2X + Y = -5 -5 0 -3 1 -22"], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["We have already seen the first condition when the lines intersect. The point of intersection is the solution to the system."], "jumps": ["P1135", "P1120"]}, {"id": "P1135", "text": ["The system of equations is called consistent for this condition."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["Two lines will intersect at exactly one point whenever the slope of one line is different from the slope of the other."], "jumps": ["P1150", "P1120"]}, {"id": "P1142", "text": ["Two lines will intersect at exactly one point whenever the slope\nof one line is different from the slope of the other.", "Two lines will intersect at exactly one point whenever the slope of one line is different from the slope of the other.1032\" go to page \"p1035\" END of one line is different from the slope of the other.", "2X + Y = -5 -5 0 -3 1 -22"], "jumps": ["P1150", "P1120"]}, {"id": "P1145", "text": ["SLOPE - Recall the slope-intercept form, Y = mX + b where m is the slope and b is the Y-intercept. Rewriting the equations into this form shows that the slopes of lines are different."], "jumps": []}, {"id": "P1150", "text": ["If the lines are parallel then they will not intersect and there is no solution to the system of equations.", "2X + Y = -5 -5 0 -3 1 -22"], "jumps": ["P1155", "P1142"]}, {"id": "P1155", "text": ["The system of equations is called inconsistent for this condition.", "The system of equations is called inconsistent for this condition.no solution to the system of equations."], "jumps": ["P1160", "P1142"]}, {"id": "P1160", "text": ["Parallel lines have the same slopes but different Y-intercepts."], "jumps": ["P1170", "P1142"]}, {"id": "P1162", "text": ["Parallel lines have the same slopes but different Y-intercepts.", "2X + Y = -5 -5 0 -3 1 -22"], "jumps": ["P1170", "P1142"]}, {"id": "P1165", "text": ["SLOPES - Recall the slope-intercept form, Y=mX+b where m is the slope and b is the Y-intercept. Rewriting the equations into this form shows that the slopes of lines are the same."], "jumps": []}, {"id": "P1170", "text": ["The third condition results when one line is graphed directly on top of another. The slope and Y-intercepts are the same."], "jumps": ["P1180", "P1162"]}, {"id": "P1180", "text": ["Since coinciding lines intersect at many points, there are an infinite number of solutions. The system of equations is dependent."], "jumps": ["P1190", "P1162"]}, {"id": "P1190", "text": ["Dependent systems of equations have coefficient values that are multiples of each other."], "jumps": ["P1200", "P1162", "P1195"]}, {"id": "P1192", "text": ["Dependent systems of equations have coefficient values that are multiples of each other.", "2X + Y = -5 -5 0 -3 1 -22"], "jumps": ["P1200", "P1162", "P1195"]}, {"id": "P1195", "text": ["1. 2(3X - 2Y) = (3)2 2. 6X - 4Y = 6", "MULTIPLE VALUES - If each term in the first equation is multiplied by 2 the result is the second equation."], "jumps": []}, {"id": "P1197", "text": ["MULTIPLE VALUES - All of the equations below have the same line for their graph. Notice the values of the coefficients.", "MULTIPLE VALUES - All of the equations below have the same line for their graph. Notice the values of the coefficients........."], "jumps": []}, {"id": "P1200", "text": ["Which condition describes this systems of equations?", "Which condition describes this systems of equations?......."], "jumps": ["P1192"]}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1202", "text": ["Graph the system of equations and compare it to these three conditions. Also look at the coefficients in the equations and the slopes of the lines."], "jumps": []}, {"id": "P1210", "text": ["Which condition describes this system of equations?", "Which condition describes this system of equations?........"], "jumps": ["P1200"]}, {"id": "P1211", "text": [], "jumps": []}, {"id": "P1212", "text": ["Graph the system of equations and compare it to these three conditions. Also look at the coefficients in the equations and the slopes of the lines."], "jumps": []}, {"id": "P1699", "text": ["The following 10 questions give you an opportunity to sol 1799", "text": ["You have completed the Drill and Practice. You are about to return to the objective menu."], "jumps": []}, {"id": "P1800", "text": [], "jumps": []}, {"id": "P1801", "text": [], "jumps": []}, {"id": "P1805", "text": ["ENTERING RESULTS - Enter ordered pair solutions using parentheses with a comma between the X and Y values, (X,Y) . Enter no solution or inconsistent for parallel lines. Enter coinciding or dependent for graphs of the same line."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on systems of equations by Graphing.  Please review the key points.", "This completes the information on systems of equations by Graphing. Please review the key points."], "jumps": []}, {"id": "P1920", "text": ["1.  Two or more equations considered together form a system of       equations.", "1. Two or more equations considered together form a system of equations.", "X + Y = 55 -5 0 -3 1 -22", "X - Y = 33 -5 0 -3 1 -22"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  The solution is the ordered pair of numbers which satisfies all        the equations.", "2. The solution is the ordered pair of numbers which satisfies all the equations."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The solution is found by graphing the equations and finding           the point of intersection.", "3. The solution is found by graphing the equations and finding the point of intersection.", "2X - Y = 4 X - 2Y = 2 2(2) - 0 = 4 2 - 2(0) = 2 .", "(2,0) Y -2 -5 0 -3 1 -2", "2X - Y = 4 -5 0 -3 1 -22", "X - 2Y = 2 -5 0 -3 1 -22"], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["4.  Remember these three conditions.", "4. Remember these three conditions........................", "2X + Y = -5 -5 0 -3 1 -22"], "jumps": ["P1999", "P1940"]}, {"id": "P1999", "text": ["You are about to return to the objective menu.", "You are about to return to the objective menu.ut to return to the Objective Menu."], "jumps": []}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["Solving a system of equations by graphing can be time consuming.", "X + Y = 55 -5 0 -3 1 -22", "X - Y = 33 -5 0 -3 1 -22"], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["Another useful method is to substitute one equation into the other. Let's see how this is done."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["First, choose an equation and solve for one of the variables.", "X - Y = 3 X + Y = 5 4 - 1 = 3 4 + 1 = 5...", "1. X - Y + Y = 3 + Y 2. X = 3 + Y 3. (3 + Y) + Y = 5 4. 3 + 2Y = 5 5. Y = 111111111", "1. X + 1 = 5 2. X = 4 3. (3 + Y) + Y = 5 4. 3 + 2Y = 5 5. Y = 1= 1 Y = 1", "X + Y = 55 -5 0 -3 1 -22", "X - Y = 33 -5 0 -3 1 -22"], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["We solved for X using the first equation but you may use the other equation or solve for Y instead.", "1. X - Y + Y = 3 + Y 2. X = 3 + Y 3. (3 + Y) + Y = 5 4. 3 + 2Y = 5 5. Y = 111111111", "X - Y = 33 -5 0 -3 1 -22"], "jumps": ["P2060", "P2040", "P2055"]}, {"id": "P2052", "text": ["We solved for X using the first equation but you may use the other equation or solve for Y instead.", "1. X - Y + Y = 3 + Y 2. X = 3 + Y 3. (3 + Y) + Y = 5 4. 3 + 2Y = 5 5. Y = 111111111", "X - Y = 33 -5 0 -3 1 -22", "X - Y = 3 X + Y = 5 4 - 1 = 3 4 + 1 = 5...", "1. X + 1 = 5 2. X = 4 3. (3 + Y) + Y = 5 4. 3 + 2Y = 5 5. Y = 1= 1 Y = 1", "X + Y = 55 -5 0 -3 1 -22"], "jumps": ["P2060", "P2040", "P2055"]}, {"id": "P2055", "text": ["Y = X + 3 X = 3 + Y 3. (3 + Y) + Y = 5 4. 3 + 2Y = 5 5. Y = 1= 1 Y = 1", "X - Y = 35 -5 0 -3 1 -22", "X + Y = 55 -5 0 -3 1 -22", "SOLVING FOR VARIABLES - Either equations may be solved for X or Y. As equations become more complex, one equation may be easier to use than the other."], "jumps": []}, {"id": "P2060", "text": ["Now substitute this expression into the other equation.", "X - Y = 33 -5 0 -3 1 -22"], "jumps": ["P2070", "P2052"]}, {"id": "P2070", "text": ["The X in the second equation is replaced by the expression 3+Y. The equation now has only one variable.", "1. X - Y + Y = 3 + Y 2. X = 3 + Y 3. (3 + Y) + Y = 5 4. 3 + 2Y = 5 5. Y = 111111111", "X + Y = 553 -5 0 -3 1 -22"], "jumps": ["P2080", "P2052"]}, {"id": "P2080", "text": ["Solve for Y.", "1. X - Y + Y = 3 + Y 2. X = 3 + Y 3. (3 + Y) + Y = 5 4. 3 + 2Y = 5 5. Y = 111111111"], "jumps": ["P2090", "P2052"]}, {"id": "P2090", "text": ["Substitute the Y value into either equation to find the X value.", "1. X + 1 = 5 2. X = 4 3. (3 + Y) + Y = 5 4. 3 + 2Y = 5 5. Y = 1= 1 Y = 1"], "jumps": ["P2100", "P2052"]}, {"id": "P2100", "text": ["Always check your solutions by placing them into the original equations.", "X - Y = 3 X + Y = 5 4 - 1 = 3 4 + 1 = 5..."], "jumps": ["P2110", "P2052"]}, {"id": "P2110", "text": ["Here is another example.  Always remember to check your answers.", "Here is another example. Always remember to check your answers.", "1. 4X - Y - 4X = 2 - 4X 2. Y = 4X - 2 3. 3X - 5(4X - 2) = 1 4. 3X - 20X + 10 = 1 5. 9 17", "1. 9 17 2. 2 177777 5 5. Y = 1= 1 Y = 1", "4X - Y = 2 -5 0 -3 1 -22", "3X - 5Y = 1 -5 0 -3 1 -22"], "jumps": ["P2120", "P2052", "P2115"]}, {"id": "P2115", "text": ["3X - 5Y = 1 4X - Y = 2", "Check Answer - Check your results by placing them into the original equations and verifying that the equations are true."], "jumps": []}, {"id": "P2120", "text": ["Trying to find solutions like these using the graphing method would be very difficult."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["What is the solution to this system of equations?", "What is the solution to this system of equations?..........", "-47 -8 44 , 11 $Incorrect2: ( -47/44, -8/11)", "-8 23 11 , 11 $Incorrect2: ( -47/44, -8/11)"], "jumps": ["P2110"]}, {"id": "P2131", "text": [], "jumps": []}, {"id": "P2132", "text": ["Follow these steps to solve a system of equations using substitution.", "1. Choose an equation and solve for one of the variables 2. Substitute the expression into the other equation 3. Solve for the variable in the new equation 4. Substitute this value for the other variable 5. Always check your results using the original equations", "Y = 4X + 5 2X + 5(4X + 5) = 9 22X = 9 - 25"], "jumps": []}, {"id": "P2140", "text": ["Type in the solution to this system of equations.", "Type in the solution to this system of equations..........."], "jumps": ["P2130"]}, {"id": "P2147", "text": ["The graphs of the equations should have intersected at the point with coordinates (1,7).", "The graphs of the equations should have intersected at the point with coordinates (1,7)..."], "jumps": ["P2150", "P2140"]}, {"id": "P2150", "text": ["When the first equation is substituted into the second equation we get a false statement instead of an X value.", "1. 2X + (-2X + 8) = -5 2. 2X - 2X + 8 = -5 3. 8 = -5X - 2) = 1- 20X + 10 = 1 5. 9 17", "2X + Y = -555 -5 0 -3 1 -22", "Y = -2X + 8 1 -5 0 -3 1 -22"], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["Rewriting both equations in the slope-intercept form, Y=mX+b, shows that the slopes are the same but the Y-intercepts are different.", "2X + Y = -555 -5 0 -3 1 -22", "1. 2X + (-2X + 8) = -5 2. 2X - 2X + 8 = -5 3. 8 = -5X - 2) = 1- 20X + 10 = 1 5. 9 17"], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["Graphing the equations would show parallel lines. This system of equations is inconsistent and has no solution.", "Y = -2X + 8 1 -5 0 -3 1 -22", "2X + Y = -555 -5 0 -3 1 -22"], "jumps": ["P2180", "P2150"]}, {"id": "P2180", "text": ["Here is another example of an inconsistent system of equations.", "1. 12 + 6Y 5 2. 12 + 6Y 5 3. 12 + 6Y - 6Y = 3 4. 12 = 33333", "5 1 6 2 5 6666666 6 66"], "jumps": ["P2190", "P2150"]}, {"id": "P2190", "text": ["Try rewriting the equations in slope-intercept form whenever you get a false statement to check if the lines are parallel."], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["Something different happens when trying to solve a dependent system of equations.", "1. 3(3Y + 7) - 9Y = 21 2. 9Y + 21 "P2930", "P2001"]}, {"id": "P2930", "text": ["2.  A consistent system of equations will result in an ordered pair       solution.", "2. A consistent system of equations will result in an ordered pair solution."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3.  An inconsistent system of equations will result in a false                 statement instead of a value for the variable.", "3. An inconsistent system of equations will result in a false statement instead of a value for the variable.", "1. 2X + (-2X + 8) = -5 2. 2X - 2X + 8 = -5 3. 8 = -5X - 2) = 1- 20X + 10 = 1 5. 9 17", "2X + Y = -555 -5 0 -3 1 -22", "Y = -2X + 8 1 -5 0 -3 1 -22"], "jumps": ["P2950", "P2920"]}, {"id": "P2950", "text": ["4.  An inconsistent system of equations has no solution.                       Rewriting the equations reveals the same slopes but different        Y-intercepts.", "4. An inconsistent system of equations has no solution. Rewriting the equations reveals the same slopes but different Y-intercepts.."], "jumps": ["P2960", "P2940"]}, {"id": "P2960", "text": ["5.  Rewriting the equations for a dependent system of equations        reveals identical slopes and Y-intercepts.", "5. Rewriting the equations for a dependent system of equations reveals identical slopes and Y-intercepts.", "1. 3(3Y + 7) - 9Y = 21 2. 9Y + 21 - 9Y = 21 3. 9Y - 9Y = 21 - 21 4. 0 = 0000000 12 + 6Y - 6Y = 3 4. 12 = 33333", "1 7 3 3 1 7 3 3 6 66"], "jumps": ["P2999", "P2940"]}, {"id": "P2999", "text": ["You are about to return to the objective menu.", "You are about to return to the objective menu.ut to return to the Objective Menu."], "jumps": []}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3020", "text": ["The purpose of the addition method is to eliminate one of the variables by adding the equations together.", "X + Y = 55 -5 0 -3 1 -22", "X - Y = 33 -5 0 -3 1 -22"], "jumps": ["P3001"]}, {"id": "P3030", "text": ["Let's see how this system of equations is solved by addition."], "jumps": ["P3020"]}, {"id": "P3040", "text": ["The addition method is based on the Addition Property.", "The addition method is based on the Addition Property......", "rX - Y = 3 +X + Y = 5 2X = 8"], "jumps": ["P3020"]}, {"id": "P3045", "text": ["ADDITION PROPERTY - The addition property states that adding the same quantities to both sides of an equation does not change the equality of the equation.", "If A = B then A + C = B + C If A = B and C = D then A + C = B + DD"], "jumps": []}, {"id": "P3050", "text": ["Adding the two equations eliminates the Y variable because they have opposite signs.", "rX - Y = 3 +X + Y = 5 2X = 8"], "jumps": ["P3040"]}, {"id": "P3060", "text": ["The result is an equation with only one variable, X.", "rX - Y = 3 +X + Y = 5 2X = 8"], "jumps": ["P3040"]}, {"id": "P3070", "text": ["Solve for X.", "rX - Y = 3 +X + Y = 5 2X = 8"], "jumps": ["P3040"]}, {"id": "P3080", "text": ["Substitute the X value into either one of the original equations to find the Y value."], "jumps": ["P3040"]}, {"id": "P3090", "text": ["The solution is (4,1).  Always remember to check the results.", "The solution is (4,1). Always remember to check the results."], "jumps": ["P3040", "P3095"]}, {"id": "P3092", "text": ["The solution is (4,1).  Always remember to check the results.", "The solution is (4,1). Always remember to check the results.", "rX - Y = 3 +X + Y = 5 2X = 8"], "jumps": ["P3040", "P3095"]}, {"id": "P3095", "text": ["(4,1) X - Y = 3 X + Y = 5 4 - 1 = 3 4 + 1 = 5", "CHECKING RESULTS - Always remember to check the results by placing the answer into the original equations and verifying that the equations are true."], "jumps": []}, {"id": "P3100", "text": ["Sometimes the variables have opposite signs but the coefficients are not the same.", "1. 3(2Y + X) = (-1)3 2. 5Y - 3X = 1 + 6 + 3X = -3 11Y r = -222", "1. 11Y = -2 2. -2 11", "1. -2 11 2. -21 3333333333331Y r = -222"], "jumps": ["P3092"]}, {"id": "P3110", "text": ["Both sides of the second equation are multiplied by 3 to change the coefficient of the X term.", "1. 3(2Y + X) = (-1)3 2. 5Y - 3X = 1 + 6 + 3X = -3 11Y r = -222"], "jumps": ["P3100"]}, {"id": "P3120", "text": ["The two equations are now added together.", "1. 3(2Y + X) = (-1)3 2. 5Y - 3X = 1 + 6 + 3X = -3 11Y r = -222", "6 + 3X = -3 11Y r = -2 1 + 6 + 3X = -3 11Y r = -222"], "jumps": ["P3100"]}, {"id": "P3130", "text": ["The result is an equation with only one variable, Y.", "1. 3(2Y + X) = (-1)3 2. 5Y - 3X = 1 + 6 + 3X = -3 11Y r = -222"], "jumps": ["P3100"]}, {"id": "P3140", "text": ["Solve for Y and substitute the Y value into either one of the original equations to find the X value.", "1. 3(2Y + X) = (-1)3 2. 5Y - 3X = 1 + 6 + 3X = -3 11Y r = -222", "1. 11Y = -2 2. -2 11", "1. -2 11 2. -21 3333333333331Y r = -222"], "jumps": ["P3150", "P3100"]}, {"id": "P3150", "text": ["Checking the answers will verify the solution."], "jumps": ["P3160", "P3100"]}, {"id": "P3160", "text": ["Notice how both equations are multiplied by different numbers in order to get the same coefficient.", "1. 3(X - 2Y) = (-5)3 2(5X + 3Y) = (1)2 2. 3X - 6Y = -15 + 10X + 6Y = 2 13X = -1333", "1. 13X = -13 2. X = -1 -2 11", "1. -1 - 2Y = -5 2. Y = 2 -21 33 3333333333331Y r = -222"], "jumps": ["P3170", "P3100"]}, {"id": "P3170", "text": ["The same system of equations can be solved by multiplying the first equation by -5 and adding.", "1. -5(X - 2Y) = (-5)-5 2. -5X + 10Y = 25 + 5X + 3Y = 1 r 13Y = 26", "1. 13Y = 26 2. Y = 211 -2 11", "1. X - 2(2) = -5 2. X = -1 -21 33 3333333333331Y r = -222"], "jumps": ["P3180", "P3160"]}, {"id": "P3180", "text": ["Each system of equations may be solved many different ways. Select the approach which seems easiest to you.", "1. -5(X - 2Y) = (-5)-5 2. -5X + 10Y = 25 + 5X + 3Y = 1 r 13Y = 26"], "jumps": ["P3190", "P3160"]}, {"id": "P3190", "text": ["Solve.", "Solve.n the solution.ion is typed.........................."], "jumps": ["P3160"]}, {"id": "P3192", "text": ["You tried to subtract the equations instead of add.", let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
