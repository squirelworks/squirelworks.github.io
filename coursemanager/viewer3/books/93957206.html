const book = {"title": "93957206", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . .", "Title: POSITION TRANSDUCER OPERATIONasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": ["Hello, this lesson is about:s about: about:"], "jumps": []}, {"id": "P100", "text": ["w Observe the operation of an increment position sensor........", "w Observe the operation of an encoder position sensor. w Measure the output signals in an encoder position sensor."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. 1/8 inch slotted screwdriver XXXXXXXXXXnt", "4. Nida Experiment Card PC130 - 257 (optional)"], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will use an encoder wheel position sensor to determine position."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["As an optional part of the lesson, you will use an increment wheel position sensor to determine position."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["These methods of position sensing are very common."], "jumps": ["P430", "P400"]}, {"id": "P14070", "text": ["The resolution of the wheel is 22.5 degrees per mark.  Note that the resolution of the encoder is also 22.5.  Where 2 to the N power equals 16 because there are four tracks (not counting the strobe track).", "The resolution of the wheel is 22.5 degrees per mark. Note that the resolution of the encoder is also 22.5. Where 2 to the N power equals 16 because there are four tracks (not counting the strobe track)."], "jumps": ["P14080", "P14060"]}, {"id": "P440", "text": ["Of course, the encoder and increment position sensors are digital."], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["Let's begin the lesson on POSITION TRANSDUCER OPERATION..................."], "jumps": ["P400"]}, {"id": "P14060", "text": ["Type in the resolution of the increment wheel to tenths.", "Type in the resolution of the increment wheel to tenths................) in a variable.able.le."], "jumps": ["P14050", "P14062", "P14065"]}, {"id": "P14240", "text": ["Type in the two digit display on PC130-257.\n(Note that the MSD is the LED above Q1 and the LSD is the LED above Q2.)", "Type in the two digit display on PC130-257. (Note that the MSD is the LED above Q1 and the LSD is the LED above Q2.)))"], "jumps": ["P14230", "P14242"]}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1020", "text": ["In this experiment, you will observe the operation of an encoder wheel sensor and determine its position."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["This position sensor is manually operated, you will act as the prime mover.", "Pick up the PC130-256 card and examine it.", "Pick up the PC130-256 card and examine it.................."], "jumps": ["P1040", "P1020", "P1050"]}, {"id": "P1050", "text": ["Locate the wheel. Notice that it has 16 positions, 0 through F. These numbers are for you to visually determine position.", "Look underneath the wheel on the left hand side.  You should be able to see the sensors.", "Look underneath the wheel on the left hand side. You should be able to see the sensors."], "jumps": ["P1060", "P1040", "P1070"]}, {"id": "P1070", "text": ["The sensors used are photoreflectors.", "You should also be able to see light and dark areas around the wheel on the reverse side."], "jumps": ["P1080", "P1040", "P1090"]}, {"id": "P1090", "text": ["These areas absorb or reflect light and represent the code."], "jumps": ["P1100", "P1040"]}, {"id": "P1100", "text": ["Locate the IC's on the card during the following description.  To view the schematic, select the schematic button.", "Locate the IC's on the card during the following description. To view the schematic, select the schematic button."], "jumps": ["P1110", "P1040", "P9002"]}, {"id": "P1110", "text": ["There are five photosensors on the card, four for each number track and one for the strobe track, PS1 through PS5.  The sensors are located underneath the wheel on the left hand side.", "There are five photosensors on the card, four for each number track and one for the strobe track, PS1 through PS5. The sensors are located underneath the wheel on the left hand side."], "jumps": ["P1120", "P1100", "P9002"]}, {"id": "P1120", "text": ["The outputs of the five photosensors are shaped by the schmitt triggers in the inverters of IC2.  IC2 is located underneath the wheel towards the bottom of the card.", "The outputs of the five photosensors are shaped by the schmitt triggers in the inverters of IC2. IC2 is located underneath the wheel towards the bottom of the card."], "jumps": ["P1130", "P1110", "P9002"]}, {"id": "P1130", "text": ["The four outputs form the number tracks are first applied to IC1, a seven segment LED driver.  IC1 is located in the upper center of the card.", "The four outputs form the number tracks are first applied to IC1, a seven segment LED driver. IC1 is located in the upper center of the card."], "jumps": ["P1140", "P1120", "P9002"]}, {"id": "P1140", "text": ["The output of the driver is applied to DS1, a seven segment LED. The LED will indicate the position of the wheel.  DS1 is located in the upper right of the card.", "The output of the driver is applied to DS1, a seven segment LED. The LED will indicate the position of the wheel. DS1 is located in the upper right of the card."], "jumps": ["P1150", "P1130", "P9002"]}, {"id": "P1150", "text": ["The outputs (all five) of the inverters are also applied to IC3, a latch.  IC3 is located in the lower right of the card.", "The outputs (all five) of the inverters are also applied to IC3, a latch. IC3 is located in the lower right of the card."], "jumps": ["P1160", "P1140", "P9002"]}, {"id": "P1160", "text": ["The latch is enabled by the strobe pulse.  This means that on each strobe, the data from the number tracks will be latched into Q0 through Q3 outputs.", "The latch is enabled by the strobe pulse. This means that on each strobe, the data from the number tracks will be latched into Q0 through Q3 outputs."], "jumps": ["P1170", "P1150", "P9002"]}, {"id": "P1170", "text": ["The outputs of the latch, which are delayed by one position, are applied to the A inputs of IC4, a comparator IC.  IC4 is located beneath the wheel on the right hand side.", "The outputs of the latch, which are delayed by one position, are applied to the A inputs of IC4, a comparator IC. IC4 is located beneath the wheel on the right hand side."], "jumps": ["P1180", "P1160", "P9002"]}, {"id": "P1180", "text": ["The B inputs to IC4 are the outputs of the four number tracks directly."], "jumps": ["P1190", "P1170", "P9002"]}, {"id": "P1190", "text": ["IC4 then compares the two inputs, the current position and the old position.  The output of the comparator indicates if the wheel is turning clockwise (A>B) or counter clockwise (A<B).", "IC4 then compares the two inputs, the current position and the old position. The output of the comparator indicates if the wheel is turning clockwise (A>B) or counter clockwise (A<B)."], "jumps": ["P1200", "P1180", "P9002"]}, {"id": "P1200", "text": ["The result of the comparison is indicated by LEDs DS2 (red) or DS3 (green) through IC5, and an amplifier.  IC5 is located just below DS2 and DS3.", "The result of the comparison is indicated by LEDs DS2 (red) or DS3 (green) through IC5, and an amplifier. IC5 is located just below DS2 and DS3."], "jumps": ["P1210", "P1190", "P9002"]}, {"id": "P1210", "text": ["Being able to detect the direction, of motion is one advantage the encoder wheel has over the increment wheel.  An increment wheel has no method of determining direction since only marks are counted.", "Being able to detect the direction, of motion is one advantage the encoder wheel has over the increment wheel. An increment wheel has no method of determining direction since only marks are counted.."], "jumps": ["P1220", "P1200", "P9002"]}, {"id": "P1220", "text": ["Let's start the experiment!", "Let's start the experiment!e..............................."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P1220"]}, {"id": "P1240", "text": ["2.  Set the Voltmeter switch to Positive. \n3.  Set Positive Supply Voltage to 15.  The  Test Console's                     voltage meter should indicate 15 volts.", "2. Set the Voltmeter switch to Positive. 3. Set Positive Supply Voltage to 15. The Test Console's voltage meter should indicate 15 volts......"], "jumps": ["P1230"]}, {"id": "P1250", "text": ["4.  Remove the shaft screws from the wheel and observe the               reverse side.", "4. Remove the shaft screws from the wheel and observe the reverse side."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["5.  Insert PC130-256 into the PC1 position of the test console.", "5. Insert PC130-256 into the PC1 position of the test console."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["The strobe track is the outside track and is followed by the LSB track.  The MSB track is closest to the center.", "The strobe track is the outside track and is followed by the LSB track. The MSB track is closest to the center."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["What type of code is used?", "What type of code is used?s typed.........................."], "jumps": ["P1270"]}, {"id": "P1281", "text": [], "jumps": []}, {"id": "P1282", "text": ["The Grey Code uses one digit changes between numbers.", "The Grey Code uses one digit changes between numbers......."], "jumps": []}, {"id": "P1283", "text": ["The BCD, or binary coded decimal, code does not use hexadecimal numbers.  The code is not BCD.", "The BCD, or binary coded decimal, code does not use hexadecimal numbers. The code is not BCD."], "jumps": []}, {"id": "P1290", "text": ["6.  Remount the wheel on PC130-256 card using the shaft                    screws.  Ensure that the numbers 0 through F are UP.", "6. Remount the wheel on PC130-256 card using the shaft screws. Ensure that the numbers 0 through F are UP."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["Let's see if the the card is set up to operate.", "Let's see if the the card is set up to operate............."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["7.  Place PC1 Power switch to ON.", "7. Place PC1 Power switch to ON.trol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P1300"]}, {"id": "P1320", "text": ["8.  Rotate the wheel so that the number 0 is next to the diode               symbol on the left hand side of the card.", "8. Rotate the wheel so that the number 0 is next to the diode symbol on the left hand side of the card."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["What number is shown on DS1?", "What number is shown on DS1?typed.........................."], "jumps": ["P1320"]}, {"id": "P1331", "text": [], "jumps": []}, {"id": "P1332", "text": ["You have not positioned the wheel correctly.  The sensors are reading a \"F''.  Rotate the wheel slightly counter clockwise until a \"0'' is displayed on the LED.", "You have not positioned the wheel correctly. The sensors are reading a \"F''. Rotate the wheel slightly counter clockwise until a \"0'' is displayed on the LED."], "jumps": []}, {"id": "P1333", "text": ["You have not positioned the wheel correctly.  The sensors are reading a \"1''.  Rotate the wheel slightly clockwise until a \"0'' is displayed on the LED.", "You have not positioned the wheel correctly. The sensors are reading a \"1''. Rotate the wheel slightly clockwise until a \"0'' is displayed on the LED."], "jumps": []}, {"id": "P1340", "text": ["3.  Slowly rotate the wheel CCW until the number \"1\" is displayed      in the LED.", "3. Slowly rotate the wheel CCW until the number \"1\" is displayed in the LED."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["Is DS2 or DS3 illuminated?", "Is DS2 or DS3 illuminated?s typed.........................."], "jumps": ["P1340"]}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1352", "text": ["DS3 should be illuminated since you rotated the wheel CCW.  If DS2 is on, you probably passed the number \"1'' to the number \"2'' and then rotated the wheel CW back to \"1''.  Start at \"0'' again and rotate the wheel CCW 10 \"1''.", "DS3 should be illuminated since you rotated the wheel CCW. If DS2 is on, you probably passed the number \"1'' to the number \"2'' and then rotated the wheel CW back to \"1''. Start at \"0'' again and rotate the wheel CCW 10 \"1''."], "jumps": []}, {"id": "P1360", "text": ["Continue to rotate the wheel counter clockwise while observing the seven segment LED readout."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["You should have observed that the position on the wheel matches the position indicated in DS1 and DS3 illuminated for all changes except F to 0, where DS2 illuminated. Even though the rotation is CCW, changing from F to 0 indicates a decrease which illuminates DS2, the circuit believes the wheel is rotating CW...."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["You should have observed that the position indicated in DS1 was incorrect at times. In this circuit, the strobe track is not used to enable the output display so, you will see transition errors. Note that the strobe pulse is used to enable the latch in IC3 so when DS2 or DS3 illuminates, the position indicated by DS1 was correct...."], "jumps": ["P1390", "P1370", "P9002"]}, {"id": "P1390", "text": ["5.  Rotate the wheel for a \"0\" indication in DS1.\n6.  Slowly rotate the wheel clockwise", "5. Rotate the wheel for a \"0\" indication in DS1. 6. Slowly rotate the wheel clockwise"], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["Is DS2 or DS3 illuminated?", "Is DS2 or DS3 illuminated?s typed.........................."], "jumps": ["P1390"]}, {"id": "P1401", "text": [], "jumps": []}, {"id": "P1402", "text": ["DS2 should be illuminated since you rotated the wheel CW.  If DS3 is on, you probably passed a number and then rotated the wheel CCW.  Be sure that you are rotating the wheel CW.", "DS2 should be illuminated since you rotated the wheel CW. If DS3 is on, you probably passed a number and then rotated the wheel CCW. Be sure that you are rotating the wheel CW."], "jumps": []}, {"id": "P1410", "text": ["You have seen the position sensor change a mechanical input to an electrical output.  DS1 indicates the position of the wheel which matches the printed positions of the wheel.  Now, let's measure signals in the circuit.", "You have seen the position sensor change a mechanical input to an electrical output. DS1 indicates the position of the wheel which matches the printed positions of the wheel. Now, let's measure signals in the circuit."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["TP1 through TP4 are the inverters outputs (photosensor outputs).  TP7 through TP10 are the outputs of the latch which time delay the position.  TP5 and TP6 are the comparator outputs.", "TP1 through TP4 are the inverters outputs (photosensor outputs). TP7 through TP10 are the outputs of the latch which time delay the position. TP5 and TP6 are the comparator outputs. PC130-256 Set Up"], "jumps": ["P1430", "P1410", "P1425"]}, {"id": "P1430", "text": ["1.  Set up the oscilloscope for dual channel, DC coupling, CH1            triggering, and a VOLT/DIV of 2.", "1. Set up the oscilloscope for dual channel, DC coupling, CH1 triggering, and a VOLT/DIV of 2."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["2.  Connect the CH1 probe to TP1, LSB output or 1 output.              3.  Rotate the wheel from \"0\" to \"F\".   Notice that the output is             HIGH for the positions of 1,3,5,7,9,B,D,F.", "2. Connect the CH1 probe to TP1, LSB output or 1 output. 3. Rotate the wheel from \"0\" to \"F\". Notice that the output is HIGH for the positions of 1,3,5,7,9,B,D,F."], "jumps": ["P1450", "P1430", "P1445"]}, {"id": "P1450", "text": ["4.  Connect the CH1 probe to TP2, the 2 output.\n5.  Rotate the wheel from \"0\" to \"F\".  Notice that the output is              HIGH for the positions of 2,3,6,7,A,B,E,F.", "4. Connect the CH1 probe to TP2, the 2 output. 5. Rotate the wheel from \"0\" to \"F\". Notice that the output is HIGH for the positions of 2,3,6,7,A,B,E,F."], "jumps": ["P1460", "P1440", "P1455"]}, {"id": "P1460", "text": ["6.  Connect the CH1 probe to TP3, the 4 output.\n7.  Rotate the wheel from \"0\" to \"F\".   Notice that the output is             HIGH for the positions of 4,5,6,7,C,D,E,F.", "6. Connect the CH1 probe to TP3, the 4 output. 7. Rotate the wheel from \"0\" to \"F\". Notice that the output is HIGH for the positions of 4,5,6,7,C,D,E,F."], "jumps": ["P1470", "P1450", "P1465"]}, {"id": "P1470", "text": ["8.  Connect the CH1 probe to TP4, the 8 output.\n9.  Rotate the wheel from \"0\" to \"F\".  Notice that the output is              HIGH for the positions of 8,9,A,B,C,D,E,F.", "8. Connect the CH1 probe to TP4, the 8 output. 9. Rotate the wheel from \"0\" to \"F\". Notice that the output is HIGH for the positions of 8,9,A,B,C,D,E,F."], "jumps": ["P1480", "P1460", "P1475"]}, {"id": "P1480", "text": ["The outputs on TP1 through TP4 match the marks on the wheel for an 8421 code.  The position sensor is changing a mechanical input to an electrical output.", "The outputs on TP1 through TP4 match the marks on the wheel for an 8421 code. The position sensor is changing a mechanical input to an electrical output."], "jumps": ["P1490", "P1470"]}, {"id": "P1490", "text": ["10.  Position the wheel so that the position \"7\" is indicated on                DS1.\n11.  Carefully rotate the wheel CCW to the position \"8\".", "10. Position the wheel so that the position \"7\" is indicated on DS1. 11. Carefully rotate the wheel CCW to the position \"8\"."], "jumps": ["P1495", "P1480"]}, {"id": "P1495", "text": ["12.  Using the oscilloscope, measure the levels on TP1 through            TP4.", "12. Using the oscilloscope, measure the levels on TP1 through TP4."], "jumps": ["P1500", "P1490"]}, {"id": "P1500", "text": ["What number do the HIGHs and LOWs represent?", "What number do the HIGHs and LOWs represent?..............."], "jumps": ["P1495"]}, {"id": "P1501", "text": [], "jumps": []}, {"id": "P1502", "text": ["The test points 1 through 4 monitor the output of the photosensors directly.  Be sure DS1 indicates \"8''.  TP1 through TP3 should be low and TP4 should be HIGH or 1000.", "The test points 1 through 4 monitor the output of the photosensors directly. Be sure DS1 indicates \"8''. TP1 through TP3 should be low and TP4 should be HIGH or 1000."], "jumps": []}, {"id": "P1507", "text": ["13.  Using the oscilloscope, measure the levels on TP7 through            TP10.", "13. Using the oscilloscope, measure the levels on TP7 through TP10."], "jumps": ["P1510", "P1500"]}, {"id": "P1510", "text": ["What number do the HIGHs and LOWs represent?", "What number do the HIGHs and LOWs represent?..............."], "jumps": ["P1507"]}, {"id": "P1511", "text": [], "jumps": []}, {"id": "P1512", "text": ["The test points TP7 through TP10 should have measured HIGH, HIGH, HIGH and LOW (7 or 0111)."], "jumps": []}, {"id": "P1515", "text": ["Ensure the wheel is at position 8.", "Ensure the wheel is at position 8.........................."], "jumps": ["P1520", "P1510"]}, {"id": "P1520", "text": ["Notice that TP's 1 through 4 indicate the current position, 8.  TP's 7 through 10 are the outputs of the latch which are the old position, 7.  These values are then applied to the comparator which illuminates the correct LED to indicate direction.", "Notice that TP's 1 through 4 indicate the current position, 8. TP's 7 through 10 are the outputs of the latch which are the old position, 7. These values are then applied to the comparator which illuminates the correct LED to indicate direction."], "jumps": ["P1530", "P1515", "P9002"]}, {"id": "P1530", "text": ["14.  Using the oscilloscope, connect the channel one probe to               TP4, the MSB output.                                 \n15.  Using the oscilloscope, connect the channel two probe to               Pin T, the strobe output.", "14. Using the oscilloscope, connect the channel one probe to TP4, the MSB output. 15. Using the oscilloscope, connect the channel two probe to Pin T, the strobe output."], "jumps": ["P1540", "P1520", "P1535"]}, {"id": "P1540", "text": ["16.  Rotate the wheel to position 7. \n17.  Slowly rotate the wheel CCW to position 8 while observing \n        the CH1 and CH2 traces.", "16. Rotate the wheel to position 7. 17. Slowly rotate the wheel CCW to position 8 while observing the CH1 and CH2 traces."], "jumps": ["P1550", "P1530"]}, {"id": "P1550", "text": ["You should have observed the CH1 trace (MSB) go high (8 position is 1000, LSB HIGH) before the strobe went HIGH."], "jumps": ["P1560", "P1540"]}, {"id": "P1560", "text": ["Since the MSB position is the shortest in length, the strobe is placed so the 8 track is in the correct position before the strobe pulse goes HIGH.  This ensures the 4 tracks are all in the correct number band.", "Since the MSB position is the shortest in length, the strobe is placed so the 8 track is in the correct position before the strobe pulse goes HIGH. This ensures the 4 tracks are all in the correct number band.."], "jumps": ["P1570", "P1550"]}, {"id": "P1570", "text": ["A simple addition to the LED driver's enable input from the strobe output would set up the circuit to use the strobe pulse."], "jumps": ["P1580", "P1560"]}, {"id": "P1580", "text": ["1.  Disconnect test equipment from the circuit.\n2.  Return the Test Console to the initial control settings.", "1. Disconnect test equipment from the circuit. 2. Return the Test Console to the initial control settings."], "jumps": ["P1570"]}, {"id": "P1590", "text": ["3.  Set the Test Console Power to OFF.", "3. Set the Test Console Power to OFF.F...................."], "jumps": ["P1580"]}, {"id": "P1600", "text": ["4.  Carefully remove PC130-256 card.\n5.  Return all equipment to its proper storage area.", "4. Carefully remove PC130-256 card. 5. Return all equipment to its proper storage area."], "jumps": ["P1910", "P1590"]}, {"id": "P13230", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P13220"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["In this experiment, you will observe the operation of an increment wheel position sensor."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["You will use the PC130-256 card as the position sensor along with the PC130-257 card that contains the increment position.", "The same code wheel is used but, the strobe track is used as the increment marks.  The output of the 8 track is also used as a reset pulse.", "The same code wheel is used but, the strobe track is used as the increment marks. The output of the 8 track is also used as a reset pulse."], "jumps": ["P2040", "P2020", "P2050"]}, {"id": "P2050", "text": ["Notice that there are sixteen marks on the strobe track, the increment track in this case."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["Type in the resolution of the increment wheel to tenths.", "Type in the resolution of the increment wheel to tenths................) in a variable.able.le."], "jumps": ["P2050", "P2062", "P2065"]}, {"id": "P2061", "text": [], "jumps": []}, {"id": "P2062", "text": ["Be sure you are entering the resolution correctly.", "Be sure you are entering the resolution correctly.tive sign.............."], "jumps": []}, {"id": "P2063", "text": ["You still have not determined the correct value for the resolution. You should have entered 22.5."], "jumps": ["P2070", "P2060"]}, {"id": "P2065", "text": ["RESOLUTION - The resolution of an increment wheel equals 360 divided by N where N is the number of marks (in this case, it is 16)."], "jumps": []}, {"id": "P2070", "text": ["The resolution of the wheel is 22.5 degrees per mark.  Note that the resolution of the encoder is also 22.5.  Where 2 to the N power equals 16 because there are four tracks (not counting the strobe track).", "The resolution of the wheel is 22.5 degrees per mark. Note that the resolution of the encoder is also 22.5. Where 2 to the N power equals 16 because there are four tracks (not counting the strobe track)."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["Now, let's look at the schematic.  To view the schematic select the schematic button.", "Now, let's look at the schematic. To view the schematic select the schematic button."], "jumps": ["P2090", "P2070", "P9003"]}, {"id": "P2090", "text": ["The strobe output of PC130-256 is routed to the PC130-257 card."], "jumps": ["P2100", "P2080", "P9003"]}, {"id": "P2100", "text": ["Each strobe pulse causes the LED driver, IC2 on PC130-257, to count up."], "jumps": ["P2110", "P2090", "P9003"]}, {"id": "P2102", "text": ["Each strobe pulse causes the LED driver, IC2 on PC130-257, to count up."], "jumps": ["P2110", "P2090", "P9003"]}, {"id": "P2110", "text": ["The output of the LED driver controls the two seven segment LEDs."], "jumps": ["P2120", "P2090", "P9003"]}, {"id": "P2112", "text": ["The output of the LED driver controls the two seven segment LEDs."], "jumps": ["P2120", "P2090", "P9003"]}, {"id": "P2120", "text": ["The seven segment LEDs will display numbers from 00 to 99 in decimal and then over to 00."], "jumps": ["P2130", "P2090", "P9003"]}, {"id": "P2122", "text": ["The seven segment LEDs will display numbers from 00 to 99 in decimal and then over to 00."], "jumps": ["P2130", "P2090", "P9003"]}, {"id": "P2130", "text": ["The track 8 pulse is used as a reset input to the LED driver."], "jumps": ["P2140", "P2090", "P9003"]}, {"id": "P2132", "text": ["The track 8 pulse is used as a reset input to the LED driver."], "jumps": ["P2140", "P2090", "P9003"]}, {"id": "P2140", "text": ["When the track 8 pulse goes from HIGH to LOW, the LED driver is reset if S2 is set to IN (if not, the LED driver does not reset except at count 99)."], "jumps": ["P2150", "P2090", "P9003"]}, {"id": "P2142", "text": ["When the track 8 pulse goes from HIGH to LOW, the LED driver is resent if S2 is set to IN (if not, the LED driver does not reset except at count 99)."], "jumps": ["P2150", "P2090", "P9003"]}, {"id": "P2150", "text": ["The HIGH to LOW transition of track 8 occurs when the wheel moves from \"F'' to \"0'' in the CCW direction and from \"8'' to \"7'' in the CW direction."], "jumps": ["P2160", "P2140", "P9003"]}, {"id": "P2152", "text": ["The HIGH to LOW transition of track 8 occurs when the wheel moves from \"F'' to \"0'' in the CCW direction and from \"8'' to \"7'' in the CW direction."], "jumps": ["P2160", "P2140", "P9003"]}, {"id": "P2160", "text": ["Let's start the experiment and observe the operation of an increment wheel position sensor."], "jumps": ["P2170", "P2090"]}, {"id": "P2170", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P2160"]}, {"id": "P2180", "text": ["2.  Set the Voltmeter switch to Positive. \n3.  Set Positive Supply Voltage to 15.  The Test Console's voltage       meter should indicate 15 volts.", "2. Set the Voltmeter switch to Positive. 3. Set Positive Supply Voltage to 15. The Test Console's voltage meter should indicate 15 volts."], "jumps": ["P2170"]}, {"id": "P2190", "text": ["4.  Insert PC130-256 into the PC1 position of the test console. \n5.  Insert PC130-257 into the PC2 position of the test console.", "4. Insert PC130-256 into the PC1 position of the test console. 5. Insert PC130-257 into the PC2 position of the test console."], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["6.  On PC130-257, set S1 to trailing edge and S2 to IN.", "6. On PC130-257, set S1 to trailing edge and S2 to IN. OTE S1 is not used in this experiment, it's for an output to another card. other card.", "S1 is not used in this experiment, it's for an output to another card. ."], "jumps": ["P2210", "P2190", "P2205"]}, {"id": "P2210", "text": ["7.  Place PC1 and PC2 DC Power switches to ON.", "7. Place PC1 and PC2 DC Power switches to ON. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2200"]}, {"id": "P2220", "text": ["The cards are now set up.  You will manually rotate the code wheel and observe the results on PC130-257.", "The cards are now set up. You will manually rotate the code wheel and observe the results on PC130-257."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["1.  Rotate the code wheel counter clockwise passing \"F\" and             stopping at \"0\".", "1. Rotate the code wheel counter clockwise passing \"F\" and stopping at \"0\"."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["Type in the two digit display on PC130-257.\n(Note that the MSD is the LED above Q1 and the LSD is the LED above Q2.)", "Type in the two digit display on PC130-257. (Note that the MSD is the LED above Q1 and the LSD is the LED above Q2.))"], "jumps": ["P2230", "P2242"]}, {"id": "P2241", "text": [], "jumps": []}, {"id": "P2242", "text": ["You did not enter the correct display on PC130-257.  Ensure you rotated the code wheel counter clockwise passing \"F'' and stopping on \"0''.", "You did not enter the correct display on PC130-257. Ensure you rotated the code wheel counter clockwise passing \"F'' and stopping on \"0''."], "jumps": []}, {"id": "P2243", "text": ["You still have not entered the correct number for the display on PC130-257.  You should have entered \"00''.", "You still have not entered the correct number for the display on PC130-257. You should have entered \"00''."], "jumps": ["P2250", "P2240"]}, {"id": "P2250", "text": ["You have reset the display card on PC130-257.  Remember, the 8 track on the code wheel is used for a reset input.  When the wheel passed \"F'', the 8 track output went from HIGH to LOW.", "You have reset the display card on PC130-257. Remember, the 8 track on the code wheel is used for a reset input. When the wheel passed \"F'', the 8 track output went from HIGH to LOW."], "jumps": ["P2260", "P2240", "P9002"]}, {"id": "P2260", "text": ["2.  Continue to slowly rotate the wheel counter clockwise from           \"0\" and observe the display on PC130-257.", "2. Continue to slowly rotate the wheel counter clockwise from \"0\" and observe the display on PC130-257."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["You should have seen the display on PC130-257 count up from 0."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["3.  Reset the display on PC130-257 by rotating the wheel CCW            passing \"F\" and stopping at \"0\".                  \n4.  Slowly rotate the wheel to \"4\".  The display on PC130-256 and       PC130-257 should indicate a 4.", "3. Reset the display on PC130-257 by rotating the wheel CCW passing \"F\" and stopping at \"0\". 4. Slowly rotate the wheel to \"4\". The display on PC130-256 and PC130-257 should indicate a 4."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["5.  Slowly rotate the wheel CW to \"0\".", "5. Slowly rotate the wheel CW to \"0\"......................"], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["What number is displayed on PC130-257?", "What number is displayed on PC130-257?....................."], "jumps": ["P2290"]}, {"id": "P2301", "text": [], "jumps": []}, {"id": "P2302", "text": ["The display on PC130-257 is incorrect.  Reset PC130-257 by rotating the wheel CCW past \"F'' and stopping at \"0''.  Slowly rotate the wheel CCW to \"4'' and then CW back to \"0''.", "The display on PC130-257 is incorrect. Reset PC130-257 by rotating the wheel CCW past \"F'' and stopping at \"0''. Slowly rotate the wheel CCW to \"4'' and then CW back to \"0''."], "jumps": []}, {"id": "P2310", "text": ["Notice that the display on PC130-257 continued to count up despite CW or CCW rotation."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["Remember, the increment wheel only counts marks.  It does not care what direction the wheel is rotated.", "Remember, the increment wheel only counts marks. It does not care what direction the wheel is rotated."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["In this case, the position of the card is \"0'' as indicated on PC130-256 (using the encoder) but, the increment circuit shows 8 on PC130-257.  The increment circuits are in error because the circuit was not reset before CW rotation.", "In this case, the position of the card is \"0'' as indicated on PC130-256 (using the encoder) but, the increment circuit shows 8 on PC130-257. The increment circuits are in error because the circuit was not reset before CW rotation.."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["Now, let's look at CW rotation of the wheel.", "Now, let's look at CW rotation of the wheel................"], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["1.  Reset the display on PC130-257 by rotating the wheel CCW            past \"F\" and stopping on \"0\".", "1. Reset the display on PC130-257 by rotating the wheel CCW past \"F\" and stopping on \"0\"."], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["2.  Slowly rotate the wheel CW past \"6\" and observe the display         on PC130-257.", "2. Slowly rotate the wheel CW past \"6\" and observe the display on PC130-257."], "jumps": ["P2370", "P2350"]}, {"id": "P2370", "text": ["You should have seen the display on PC130-257 count up. Further CW rotation caused the display to reset when the wheel passed \"8'' and moved to \"7''."], "jumps": ["P2380", "P2360"]}, {"id": "P2380", "text": ["Going CW, the 8 track produced a HIGH to LOW transition from \"8'' to \"7'' which reset the LEDs on PC130-257."], "jumps": ["P2390", "P2370"]}, {"id": "P2390", "text": ["You have seen how the increment wheel sensor operates in the CCW and CW direction.  Remember, an increment wheel must be reset after each rotation to get an accurate position indication.", "You have seen how the increment wheel sensor operates in the CCW and CW direction. Remember, an increment wheel must be reset after each rotation to get an accurate position indication."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["Now, let's see what happens if the reset input to the LED driver is disabled."], "jumps": ["P2410", "P2390"]}, {"id": "P2410", "text": ["1.  Place S2 on PC130-257 to OUT.", "1. Place S2 on PC130-257 to OUT..........................."], "jumps": ["P2420", "P2400", "P2415"]}, {"id": "P2420", "text": ["2.  Rotate the wheel both CW and CCW.  Notice the display on            PC130-257 counts up despite the direction and does not reset       when passing \"F\" CCW or \"8\" CW.", "2. Rotate the wheel both CW and CCW. Notice the display on PC130-257 counts up despite the direction and does not reset when passing \"F\" CCW or \"8\" CW."], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["3.  Continue rotating the wheel in either direction for at least 100         counts while observing the display on PC130-257.", "3. Continue rotating the wheel in either direction for at least 100 counts while observing the display on PC130-257."], "jumps": ["P2440", "P2420"]}, {"id": "P2440", "text": ["Type in the highest count reached by the display on PC130-257.", "Type in the highest count reached by the display on PC130-257............) in a variable.able.le."], "jumps": ["P2430", "P2442"]}, {"id": "P2441", "text": [], "jumps": []}, {"id": "P2442", "text": ["The highest count should be the capacity of the two seven segment LED decimal display."], "jumps": []}, {"id": "P2443", "text": ["You still have not entered the correct value.  You should have entered 99.", "You still have not entered the correct value. You should have entered 99."], "jumps": ["P2450", "P2440"]}, {"id": "P2450", "text": ["99 is the highest count.  The next pulse changes the output to 00.  Note that a reset pulse at 99 is not used.  The circuit automatically goes from 99 to 00.  If a third LED is used, the count would go to 100.", "99 is the highest count. The next pulse changes the output to 00. Note that a reset pulse at 99 is not used. The circuit automatically goes from 99 to 00. If a third LED is used, the count would go to 100."], "jumps": ["P2460", "P2440"]}, {"id": "P2460", "text": ["1.  Return the Test Console to their initial control settings.", "1. Return the Test Console to their initial control settings.............."], "jumps": ["P2450"]}, {"id": "P2470", "text": ["2.  Set the Test Console Power to OFF.", "2. Set the Test Console Power to OFF.F...................."], "jumps": ["P2460"]}, {"id": "P2480", "text": ["3.  Carefully remove PC130-256 and PC130-257 from the test               console.    \n4.  Return all equipment to its proper storage area.", "3. Carefully remove PC130-256 and PC130-257 from the test console. 4. Return all equipment to its proper storage area."], "jumps": ["P2910", "P2470"]}, {"id": "P13100", "text": ["Locate the IC's on the card during the following description.  To view the schematic, select the schematic button.", "This completes the experiment on INCREMENT POSITION SENSOR.", "Locate the IC's on the card during the following description. To view the schematic, select the schematic button.", "This completes the experiment on INCREMENT POSITION SENSOR...", "PC130-256 TEST CIRCUIT FOR BCD ENCODER", "PC130-257 TEST CIRCUIT OF INCREMENT WHEEL POSITION SENSOR"], "jumps": ["P13110", "P13040", "P9002"]}, {"id": "P13020", "text": ["In this experiment, you will observe the operation of an encoder wheel sensor and determine its position."], "jumps": ["P13030", "P1001"]}, {"id": "P13030", "text": ["This position sensor is manually operated, you will act as the prime mover.", "Pick up the PC130-256 card and examine it.", "Pick up the PC130-256 card and examine it.................."], "jumps": ["P13040", "P13020", "P13050"]}, {"id": "P13050", "text": ["Locate the wheel.  Notice that it has 16 positions, 0 through F. These numbers are for you to visually determine position.", "Locate the wheel. Notice that it has 16 positions, 0 through F. These numbers are for you to visually determine position."], "jumps": ["P13060", "P13040"]}, {"id": "P13060", "text": ["Look underneath the wheel on the left hand side.  You should be able to see the sensors.", "Look underneath the wheel on the left hand side. You should be able to see the sensors."], "jumps": ["P13070", "P13040"]}, {"id": "P13070", "text": ["The sensors used are photoreflectors."], "jumps": ["P13080", "P13040"]}, {"id": "P900", "text": ["You should also be able to see light and dark areas around the wheel on the reverse side."], "jumps": []}, {"id": "P13090", "text": ["These areas absorb or reflect light and represent the code."], "jumps": ["P13100", "P13040"]}, {"id": "P13290", "text": ["5.  Insert PC130-256 into the PC1 position of the test console.", "5. Insert PC130-256 into the PC1 position of the test console. the numbers 0 through F are UP."], "jumps": ["P13300", "P13280"]}, {"id": "P13110", "text": ["There are five photosensors on the card, four for each number track and one for the strobe track, PS1 through PS5.  The sensors are located underneath the wheel on the left hand side.", "There are five photosensors on the card, four for each number track and one for the strobe track, PS1 through PS5. The sensors are located underneath the wheel on the left hand side."], "jumps": ["P13120", "P13100", "P9002"]}, {"id": "P13120", "text": ["The outputs of the five photosensors are shaped by the schmitt triggers in the inverters of IC2.  IC2 is located underneath the wheel towards the bottom of the card.", "The outputs of the five photosensors are shaped by the schmitt triggers in the inverters of IC2. IC2 is located underneath the wheel towards the bottom of the card."], "jumps": ["P13130", "P13110", "P9002"]}, {"id": "P13130", "text": ["The four outputs form the number tracks are first applied to IC1, a seven segment LED driver.  IC1 is located in the upper center of the card.", "The four outputs form the number tracks are first applied to IC1, a seven segment LED driver. IC1 is located in the upper center of the card."], "jumps": ["P13140", "P13120", "P9002"]}, {"id": "P13140", "text": ["The output of the driver is applied to DS1, a seven segment LED. The LED will indicate the position of the wheel.  DS1 is located in the upper right of the card.", "The output of the driver is applied to DS1, a seven segment LED. The LED will indicate the position of the wheel. DS1 is located in the upper right of the card."], "jumps": ["P13150", "P13130", "P9002"]}, {"id": "P13150", "text": ["The outputs (all five) of the inverters are also applied to IC3, a latch.  IC3 is located in the lower right of the card.", "The outputs (all five) of the inverters are also applied to IC3, a latch. IC3 is located in the lower right of the card."], "jumps": ["P13160", "P13140", "P9002"]}, {"id": "P13160", "text": ["The latch is enabled by the strobe pulse.  This means that on each strobe, the data from the number tracks will be latched into Q0 through Q3 outputs.", "The latch is enabled by the strobe pulse. This means that on each strobe, the data from the number tracks will be latched into Q0 through Q3 outputs."], "jumps": ["P13170", "P13150", "P9002"]}, {"id": "P13170", "text": ["The outputs of the latch, which are delayed by one position, are applied to the A inputs of IC4, a comparator IC.  IC4 is located beneath the wheel on the right hand side.", "The outputs of the latch, which are delayed by one position, are applied to the A inputs of IC4, a comparator IC. IC4 is located beneath the wheel on the right hand side."], "jumps": ["P13180", "P13160", "P9002"]}, {"id": "P13180", "text": ["The B inputs to IC4 are the outputs of the four number tracks directly."], "jumps": ["P13190", "P13170", "P9002"]}, {"id": "P13190", "text": ["IC4 then compares the two inputs, the current position and the old position.  The output of the comparator indicates if the wheel is turning clockwise (A>B) or counter clockwise (A<B).", "IC4 then compares the two inputs, the current position and the old position. The output of the comparator indicates if the wheel is turning clockwise (A>B) or counter clockwise (A<B)."], "jumps": ["P13200", "P13180", "P9002"]}, {"id": "P13200", "text": ["The result of the comparison is indicated by LEDs DS2 (red) or DS3 (green) through IC5, and an amplifier.  IC5 is located just below DS2 and DS3.", "The result of the comparison is indicated by LEDs DS2 (red) or DS3 (green) through IC5, and an amplifier. IC5 is located just below DS2 and DS3."], "jumps": ["P13210", "P13190", "P9002"]}, {"id": "P13210", "text": ["Being able to detect the direction, of motion is one advantage the encoder wheel has over the increment wheel.  An increment wheel has no method of determining direction since only marks are counted.", "Being able to detect the direction, of motion is one advantage the encoder wheel has over the increment wheel. An increment wheel has no method of determining direction since only marks are counted.."], "jumps": ["P13220", "P13200", "P9002"]}, {"id": "P13220", "text": ["Let's start the experiment!", "Let's start the experiment!e..............................."], "jumps": ["P13230", "P13210"]}, {"id": "P13330", "text": ["What number is shown on DS1?", "What number is shown on DS1?typed.........................."], "jumps": ["P13320"]}, {"id": "P13580", "text": ["1.  Disconnect test equipment from the circuit.", "3.  Remove the shaft screws from the wheel and observe the               reverse side.", "1. Disconnect test equipment from the circuit.2. Set the Test Console controls to their initial control settings.", "3. Remove the shaft screws from the wheel and observe the reverse side."], "jumps": []}, {"id": "P13260", "text": ["4.  Rotate the wheel while viewing the underside.", "4. Rotate the wheel while viewing the underside. test console."], "jumps": ["P13270", "P13250"]}, {"id": "P13270", "text": ["The strobe track is the outside track and is followed by the LSB track.  The MSB track is closest to the center.", "The strobe track is the outside track and is followed by the LSB track. The MSB track is closest to the center."], "jumps": ["P13280", "P13260"]}, {"id": "P13280", "text": ["What type of code is used?", "What type of code is used?s typed.........................."], "jumps": ["P13270"]}, {"id": "P13281", "text": [], "jumps": []}, {"id": "P13282", "text": ["The Grey Code uses one digit changes between numbers.", "The Grey Code uses one digit changes between numbers......."], "jumps": []}, {"id": "P13283", "text": ["The BCD, or binary coded decimal, code does not use hexadecimal numbers.  The code is not BCD.", "The BCD, or binary coded decimal, code does not use hexadecimal numbers. The code is not BCD."], "jumps": []}, {"id": "P13340", "text": ["3.  Slowly rotate the wheel CCW until the number \"1\" is displayed       in the LED display.", "3. Slowly rotate the wheel CCW until the number \"1\" is displayed in the LED display."], "jumps": ["P13350", "P13330"]}, {"id": "P13300", "text": ["Let's see if the the card is set up to operate.", "Let's see if the the card is set up to operate............."], "jumps": ["P13310", "P13290"]}, {"id": "P13310", "text": ["1.  Press Enter to Set:  PC1 DC Power Switch - ON", "1. Press Enter to Set: PC1 DC Power Switch - ON.........."], "jumps": ["P13300"]}, {"id": "P13320", "text": ["2.  Rotate the wheel so that the number 0 is next to the diode               symbol on the left hand side of the card.", "2. Rotate the wheel so that the number 0 is next to the diode symbol on the left hand side of the card."], "jumps": ["P13330"]}, {"id": "P13910", "text": ["This completes the experiment on ENCODER POSITION SENSOR.", "This completes the experiment on ENCODER POSITION SENSOR....."], "jumps": ["P1001", "P13600"]}, {"id": "P13331", "text": [], "jumps": []}, {"id": "P13332", "text": ["You have not positioned the wheel correctly.  The sensors are reading a \"F''.  Rotate the wheel slightly counter clockwise until a \"0'' is displayed on the LED.", "You have not positioned the wheel correctly. The sensors are reading a \"F''. Rotate the wheel slightly counter clockwise until a \"0'' is displayed on the LED."], "jumps": []}, {"id": "P13333", "text": ["You have not positioned the wheel correctly.  The sensors are reading a \"1''.  Rotate the wheel slightly clockwise until a \"0'' is displayed on the LED.", "You have not positioned the wheel correctly. The sensors are reading a \"1''. Rotate the wheel slightly clockwise until a \"0'' is displayed on the LED."], "jumps": []}, {"id": "P13340", "text": ["3.  Slowly rotate the wheel CCW until the number \"1\" is displayed       in the LED.", "3. Slowly rotate the wheel CCW until the number \"1\" is displayed in the LED."], "jumps": ["P13350", "P13330"]}, {"id": "P13350", "text": ["Is DS2 or DS3 illuminated?", "Is DS2 or DS3 illuminated?s typed.........................."], "jumps": ["P13340"]}, {"id": "P13351", "text": [], "jumps": []}, {"id": "P13352", "text": ["DS3 should be illuminated since you rotated the wheel CCW.  If DS2 is on, you probably passed the number \"1'' to the number \"2'' and then rotated the wheel CW back to \"1''.  Start at \"0'' again and rotate the wheel CCW 10 \"1''.", "DS3 should be illuminated since you rotated the wheel CCW. If DS2 is on, you probably passed the number \"1'' to the number \"2'' and then rotated the wheel CW back to \"1''. Start at \"0'' again and rotate the wheel CCW 10 \"1''."], "jumps": []}, {"id": "P13360", "text": ["4.  Continue to rotate the wheel counter clockwise while                       observing the seven segment LED readout.", "4. Continue to rotate the wheel counter clockwise while observing the seven segment LED readout."], "jumps": ["P13370", "P13350"]}, {"id": "P13370", "text": ["You should have observed that the position on the wheel matches the position indicated in DS1 and DS3 illuminated for all changes except F to 0, where DS2 illuminated. Even though the rotation is CCW, changing from F to 0 indicates a decrease which illuminates DS2, the circuit believes the wheel is rotating CW...."], "jumps": ["P13380", "P13360"]}, {"id": "P13380", "text": ["You should have observed that the position indicated in DS1 was incorrect at times. In this circuit, the strobe track is not used to enable the output display so, you will see transition errors. Note that the strobe pulse is used to enable the latch in IC3 so when DS2 or DS3 illuminates, the position indicated by DS1 was correct...."], "jumps": ["P13390", "P13370", "P9002"]}, {"id": "P13390", "text": ["5.  Rotate the wheel for a \"0\" indication in DS1. \n6.  Slowly rotate the wheel clockwise", "5. Rotate the wheel for a \"0\" indication in DS1. 6. Slowly rotate the wheel clockwise"], "jumps": ["P13400", "P13380"]}, {"id": "P13400", "text": ["Is DS2 or DS3 illuminated?", "Is DS2 or DS3 illuminated?s typed.........................."], "jumps": ["P13390"]}, {"id": "P13401", "text": [], "jumps": []}, {"id": "P13402", "text": ["DS2 should be illuminated since you rotated the wheel CW.  If DS3 is on, you probably passed a number and then rotated the wheel CCW.  Be sure that you are rotating the wheel CW.", "DS2 should be illuminated since you rotated the wheel CW. If DS3 is on, you probably passed a number and then rotated the wheel CCW. Be sure that you are rotating the wheel CW."], "jumps": []}, {"id": "P13410", "text": ["You have seen the position sensor change a mechanical input to an electrical output.  DS1 indicates the position of the wheel which matches the printed positions of the wheel.  Now, let's measure signals in the circuit.", "You have seen the position sensor change a mechanical input to an electrical output. DS1 indicates the position of the wheel which matches the printed positions of the wheel. Now, let's measure signals in the circuit."], "jumps": ["P13420", "P13400"]}, {"id": "P13420", "text": ["TP1 through TP4 are the inverters outputs (photosensor outputs). TP7 through TP10 are the outputs of the latch which time delay the position.  TP5 and TP6 are the comparator outputs.", "TP1 through TP4 are the inverters outputs (photosensor outputs). TP7 through TP10 are the outputs of the latch which time delay the position. TP5 and TP6 are the comparator outputs. PC130-256 Set Upp"], "jumps": ["P13430", "P13410", "P13425"]}, {"id": "P13430", "text": ["1.  Set up the oscilloscope for dual channel, DC coupling, CH1           triggering, and a VOLT/DIV of 2.", "1. Set up the oscilloscope for dual channel, DC coupling, CH1 triggering, and a VOLT/DIV of 2."], "jumps": ["P13440", "P13420"]}, {"id": "P13440", "text": ["2.  Connect the CH1 probe to TP1, LSB output or 1 output. \n3.  Rotate the wheel from \"0\" to \"F\".   Notice that the output is             HIGH for the positions of 1,3,5,7,9,B,D,F.", "2. Connect the CH1 probe to TP1, LSB output or 1 output. 3. Rotate the wheel from \"0\" to \"F\". Notice that the output is HIGH for the positions of 1,3,5,7,9,B,D,F."], "jumps": ["P13450", "P13430", "P13445"]}, {"id": "P13450", "text": ["4.  Connect the CH1 probe to TP2, the 2 output. \n5.  Rotate the wheel from \"0\" to \"F\".   Notice that the output is             HIGH for the positions of 2,3,6,7,A,B,E,F.", "4. Connect the CH1 probe to TP2, the 2 output. 5. Rotate the wheel from \"0\" to \"F\". Notice that the output is HIGH for the positions of 2,3,6,7,A,B,E,F."], "jumps": ["P13460", "P13440", "P13455"]}, {"id": "P13460", "text": ["6.  Connect the CH1 probe to TP3, the 4 output. \n7.  Rotate the wheel from \"0\" to \"F\".   Notice that the output is             HIGH for the positions of 4,5,6,7,C,D,E,F.", "6. Connect the CH1 probe to TP3, the 4 output. 7. Rotate the wheel from \"0\" to \"F\". Notice that the output is HIGH for the positions of 4,5,6,7,C,D,E,F."], "jumps": ["P13470", "P13450", "P13465"]}, {"id": "P13470", "text": ["8.  Connect the CH1 probe to TP4, the 8 output. \n9.  Rotate the wheel from \"0\" to \"F\".   Notice that the output is             HIGH for the positions of 8,9,A,B,C,D,E,F.", "8. Connect the CH1 probe to TP4, the 8 output. 9. Rotate the wheel from \"0\" to \"F\". Notice that the output is HIGH for the positions of 8,9,A,B,C,D,E,F."], "jumps": ["P13480", "P13460", "P13475"]}, {"id": "P13480", "text": ["The outputs on TP1 through TP4 match the marks on the wheel for an 8421 code.  The position sensor is changing a mechanical input to an electrical output.", "The outputs on TP1 through TP4 match the marks on the wheel for an 8421 code. The position sensor is changing a mechanical input to an electrical output."], "jumps": ["P13490", "P13470"]}, {"id": "P13490", "text": ["10.  Position the wheel so that the position \"7\" is indicated on               DS1. \n11.  Carefully rotate the wheel CCW to the position \"8\".", "10. Position the wheel so that the position \"7\" is indicated on DS1. 11. Carefully rotate the wheel CCW to the position \"8\"."], "jumps": ["P13495", "P13480"]}, {"id": "P13495", "text": ["12.  Using the oscilloscope, measure the levels on TP1 through            TP4.", "12. Using the oscilloscope, measure the levels on TP1 through TP4."], "jumps": ["P13500", "P13490"]}, {"id": "P13500", "text": ["What number do the HIGHs and LOWs represent?", "What number do the HIGHs and LOWs represent?..............."], "jumps": ["P13495"]}, {"id": "P13501", "text": [], "jumps": []}, {"id": "P13502", "text": ["The test points 1 through 4 monitor the output of the photosensors directly.  Be sure DS1 indicates \"8''.  TP1 through TP3 should be low and TP4 should be HIGH or 1000.", "The test points 1 through 4 monitor the output of the photosensors directly. Be sure DS1 indicates \"8''. TP1 through TP3 should be low and TP4 should be HIGH or 1000."], "jumps": []}, {"id": "P13507", "text": ["13.  Using the oscilloscope, measure the levels on TP7 through            TP10.", "13. Using the oscilloscope, measure the levels on TP7 through TP10."], "jumps": ["P13510", "P13500"]}, {"id": "P13510", "text": ["What number do the HIGHs and LOWs represent?", "What number do the HIGHs and LOWs represent?..............."], "jumps": ["P13507"]}, {"id": "P13511", "text": [], "jumps": []}, {"id": "P13512", "text": ["The test points TP7 through TP10 should have measured HIGH, HIGH, HIGH and LOW (7 or 0111)."], "jumps": []}, {"id": "P13515", "text": ["Ensure the wheel is at position 8.", "Ensure the wheel is at position 8.........................."], "jumps": ["P13520", "P13510"]}, {"id": "P13520", "text": ["Notice that TP's 1 through 4 indicate the current position, 8.  TP's 7 through 10 are the outputs of the latch which are the old position, 7.  These values are then applied to the comparator which illuminates the correct LED to indicate direction.", "Notice that TP's 1 through 4 indicate the current position, 8. TP's 7 through 10 are the outputs of the latch which are the old position, 7. These values are then applied to the comparator which illuminates the correct LED to indicate direction."], "jumps": ["P13530", "P13515", "P9002"]}, {"id": "P13530", "text": ["14.  Using the oscilloscope, connect the channel one probe to               TP4, the MSB output.                                 \n15.  Using the oscilloscope, connect the channel two probe to               Pin T, the strobe output.", "14. Using the oscilloscope, connect the channel one probe to TP4, the MSB output. 15. Using the oscilloscope, connect the channel two probe to Pin T, the strobe output."], "jumps": ["P13540", "P13520", "P13535"]}, {"id": "P13540", "text": ["16.  Rotate the wheel to position 7. \n17.  Slowly rotate the wheel CCW to position 8 while observing              the CH1 and CH2 traces.", "16. Rotate the wheel to position 7. 17. Slowly rotate the wheel CCW to position 8 while observing the CH1 and CH2 traces."], "jumps": ["P13550", "P13530"]}, {"id": "P13550", "text": ["You should have observed the CH1 trace (MSB) go high (8 position is 1000, LSB HIGH) before the strobe went HIGH."], "jumps": ["P13560", "P13540"]}, {"id": "P13560", "text": ["Since the MSB position is the shortest in length, the strobe is placed so the 8 track is in the correct position before the strobe pulse goes HIGH.  This ensures the 4 tracks are all in the correct number band.", "Since the MSB position is the shortest in length, the strobe is placed so the 8 track is in the correct position before the strobe pulse goes HIGH. This ensures the 4 tracks are all in the correct number band.."], "jumps": ["P13570", "P13550"]}, {"id": "P13570", "text": ["A simple addition to the LED driver's enable input from the strobe output would set up the circuit to use the strobe pulse."], "jumps": ["P13560"]}, {"id": "P13600", "text": ["3.  Carefully remove PC130-256 card. \n4.  Return all equipment to its proper storage area.", "1.  Disconnect test equipment from the circuit.", "3. Carefully remove PC130-256 card. 4. Return all equipment to its proper storage area.", "1. Disconnect test equipment from the circuit.2. Set the Test Console controls to their initial control settings."], "jumps": ["P13910", "P13590"]}, {"id": "P13590", "text": ["2.  Set the Test Console Power to OFF.", "2. Set the Test Console Power to OFF.F.FF................................."], "jumps": []}, {"id": "P13600", "text": ["3.  Carefully remove PC130-256 card. \n4.  Return all equipment to its proper storage area.", "3. Carefully remove PC130-256 card. 4. Return all equipment to its proper storage area."], "jumps": ["P13910", "P13590"]}, {"id": "P13250", "text": ["s from the wheel and observe the reverse side.", "3. Tilt the circuit card for the best view of the underside of the wheel."], "jumps": ["P13260"]}, {"id": "P14020", "text": ["In this experiment, you will observe the operation of an increment wheel position sensor."], "jumps": ["P14030", "P2001"]}, {"id": "P14030", "text": ["You will use the PC130-256 card as the position sensor along with the PC130-257 card that contains the increment position.", "The same code wheel is used but, the strobe track is used as the increment marks.  The output of the 8 track is also used as a reset pulse.", "The same code wheel is used but, the strobe track is used as the increment marks. The output of the 8 track is also used as a reset pulse."], "jumps": ["P14040", "P14020", "P14050", "P"]}, {"id": "P14050", "text": ["Notice that there are sixteen marks on the strobe track, the increment track in this case."], "jumps": ["P14060", "P14040"]}, {"id": "P14180", "text": ["2.  Press Enter to set: Positive Supply Voltage - 15", "Type in the resolution of the increment wheel to tenths.", "2. Press Enter to set: Positive Supply Voltage - 15.......................", "Type in the resolution of the increment wheel to tenths................) in a variable.able.le."], "jumps": []}, {"id": "P14061", "text": [], "jumps": []}, {"id": "P14062", "text": ["Be sure you are entering the resolution correctly.", "Be sure you are entering the resolution correctly.........."], "jumps": []}, {"id": "P14063", "text": ["You still have not determined the correct value for the resolution. You should have entered 22.5."], "jumps": ["P14070", "P14060"]}, {"id": "P14065", "text": ["RESOLUTION - The resolution of an increment wheel equals 360 divided by N where N is the number of marks (in this case, it is 16)."], "jumps": []}, {"id": "P14070", "text": ["The resolution of the wheel is 22.5 degrees per mark.  Note that the resolution of the encoder is also 22.5.  Where 2 to the N power equals 16 because there are four tracks (not counting the strobe track).", "The resolution of the wheel is 22.5 degrees per mark. Note that the resolution of the encoder is also 22.5. Where 2 to the N power equals 16 because there are four tracks (not counting the strobe track)."], "jumps": ["P14080", "P14060"]}, {"id": "P14080", "text": ["Now, let's look at the schematic.  To view the schematic select the schematic button.", "Now, let's look at the schematic. To view the schematic select the schematic button."], "jumps": ["P14090", "P14070", "P9003"]}, {"id": "P14090", "text": ["The strobe output of PC130-256 is routed to the PC130-257 card."], "jumps": ["P14100", "P14080", "P9003"]}, {"id": "P14100", "text": ["Each strobe pulse causes the LED driver, IC2 on PC130-257, to count up."], "jumps": ["P14110", "P14090", "P9003"]}, {"id": "P14102", "text": ["Each strobe pulse causes the LED driver, IC2 on PC130-257, to count up."], "jumps": ["P14110", "P14090", "P9003"]}, {"id": "P14110", "text": ["The output of the LED driver controls the two seven segment LEDs."], "jumps": ["P14120", "P14090", "P9003"]}, {"id": "P14112", "text": ["The output of the LED driver controls the two seven segment LEDs."], "jumps": ["P14120", "P14090", "P9003"]}, {"id": "P14120", "text": ["The seven segment LEDs will display numbers from 00 to 99 in decimal and then over to 00."], "jumps": ["P14130", "P14090", "P9003"]}, {"id": "P14122", "text": ["The seven segment LEDs will display numbers from 00 to 99 in decimal and then over to 00."], "jumps": ["P14130", "P14090", "P9003"]}, {"id": "P14130", "text": ["The track 8 pulse is used as a reset input to the LED driver."], "jumps": ["P14140", "P14090", "P9003"]}, {"id": "P14132", "text": ["The track 8 pulse is used as a reset input to the LED driver."], "jumps": ["P14140", "P14090", "P9003"]}, {"id": "P14140", "text": ["When the track 8 pulse goes from HIGH to LOW, the LED driver is reset if S2 is set to IN (if not, the LED driver does not reset except at count 99)."], "jumps": ["P14150", "P14090", "P9003"]}, {"id": "P14142", "text": ["When the track 8 pulse goes from HIGH to LOW, the LED driver is resent if S2 is set to IN (if not, the LED driver does not reset except at count 99)."], "jumps": ["P14150", "P14090", "P9003"]}, {"id": "P14150", "text": ["The HIGH to LOW transition of track 8 occurs when the wheel moves from \"F'' to \"0'' in the CCW direction and from \"8'' to \"7'' in the CW direction."], "jumps": ["P14160", "P14140", "P9003"]}, {"id": "P14152", "text": ["The HIGH to LOW transition of track 8 occurs when the wheel moves from \"F'' to \"0'' in the CCW direction and from \"8'' to \"7'' in the CW direction."], "jumps": ["P14160", "P14140", "P9003"]}, {"id": "P14160", "text": ["Let's start the experiment and observe the operation of an increment wheel position sensor."], "jumps": ["P14170", "P14090"]}, {"id": "P14170", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P14160"]}, {"id": "P14210", "text": ["6.  Press Enter to set: PC1 DC Power Switch - ON\n                                         PC2 DC Power  Switch - ON", "6. Press Enter to set: PC1 DC Power Switch - ON PC2 DC Power Switch - ON"], "jumps": ["P14200"]}, {"id": "P14190", "text": ["3.  Insert PC130-256 into the PC1 position of the test console. \n4.  Insert PC130-257 into the PC2 position of the test console.", "3. Insert PC130-256 into the PC1 position of the test console. 4. Insert PC130-257 into the PC2 position of the test console."], "jumps": ["P14200"]}, {"id": "P14200", "text": ["5.  On PC130-257, set S1 to trailing edge and S2 to IN.", "5. On PC130-257, set S1 to trailing edge and S2 to IN.GRAPHICS TEXT) NOTE S1 is not used in this experiment, it's for an output to another card.", "S1 is not used in this experiment, it's for an output to another card. ."], "jumps": ["P14210", "P14190", "P14205"]}, {"id": "P14241", "text": [], "jumps": []}, {"id": "P14220", "text": ["The cards are now set up.  You will manually rotate the code wheel and observe the results on PC130-257.", "The cards are now set up. You will manually rotate the code wheel and observe the results on PC130-257."], "jumps": ["P14230"]}, {"id": "P14230", "text": ["1.  Rotate the code wheel counter clockwise passing \"F\" and             stopping at \"0\".", "1. Rotate the code wheel counter clockwise passing \"F\" and stopping at \"0\"."], "jumps": ["P14240", "P14220"]}, {"id": "P14440", "text": ["Type in the highest count reached by the display on PC130-257.", "Type in the highest count reached by the display on PC130-257..........) in a variable.able.le."], "jumps": ["P14430", "P14442"]}, {"id": "P14242", "text": ["You did not enter the correct display on PC130-257.  Ensure you rotated the code wheel counter clockwise passing \"F'' and stopping on \"0''.", "You did not enter the correct display on PC130-257. Ensure you rotated the code wheel counter clockwise passing \"F'' and stopping on \"0''."], "jumps": []}, {"id": "P14243", "text": ["You still have not entered the correct number for the display on PC130-257.  You should have entered \"00''.", "You still have not entered the correct number for the display on PC130-257. You should have entered \"00''."], "jumps": ["P14250", "P14240"]}, {"id": "P14250", "text": ["You have reset the display card on PC130-257.  Remember, the 8 track on the code wheel is used for a reset input.  When the wheel passed \"F'', the 8 track output went from HIGH to LOW.", "You have reset the display card on PC130-257. Remember, the 8 track on the code wheel is used for a reset input. When the wheel passed \"F'', the 8 track output went from HIGH to LOW."], "jumps": ["P14260", "P14240", "P9003"]}, {"id": "P14260", "text": ["2.  Continue to slowly rotate the wheel counter clockwise from            \"0\" and observe the display on PC130-257.", "2. Continue to slowly rotate the wheel counter clockwise from \"0\" and observe the display on PC130-257."], "jumps": ["P14270", "P14250"]}, {"id": "P14270", "text": ["You should have seen the display on PC130-257 count up from 0."], "jumps": ["P14280", "P14260"]}, {"id": "P14280", "text": ["3.  Reset the display on PC130-257 by rotating the wheel CCW            passing \"F\" and stopping at \"0\".                  \n4.  Slowly rotate the wheel to \"4\".  The display on PC130-256 and       PC130-257 should indicate a 4.", "3. Reset the display on PC130-257 by rotating the wheel CCW passing \"F\" and stopping at \"0\". 4. Slowly rotate the wheel to \"4\". The display on PC130-256 and PC130-257 should indicate a 4."], "jumps": ["P14290", "P14270"]}, {"id": "P14290", "text": ["5.  Slowly rotate the wheel CW to \"0\".", "5. Slowly rotate the wheel CW to \"0\"......................"], "jumps": ["P14300", "P14280"]}, {"id": "P14300", "text": ["What number is displayed on PC130-257?", "What number is displayed on PC130-257?....................."], "jumps": ["P14290"]}, {"id": "P14301", "text": [], "jumps": []}, {"id": "P14302", "text": ["The display on PC130-257 is incorrect.  Reset PC130-257 by rotating the wheel CCW past \"F'' and stopping at \"0''.  Slowly rotate the wheel CCW to \"4'' and then CW back to \"0''.", "The display on PC130-257 is incorrect. Reset PC130-257 by rotating the wheel CCW past \"F'' and stopping at \"0''. Slowly rotate the wheel CCW to \"4'' and then CW back to \"0''."], "jumps": []}, {"id": "P14310", "text": ["Notice that the display on PC130-257 continued to count up despite CW or CCW rotation."], "jumps": ["P14320", "P14300"]}, {"id": "P14320", "text": ["Remember, the increment wheel only counts marks.  It does not care what direction the wheel is rotated.", "Remember, the increment wheel only counts marks. It does not care what direction the wheel is rotated."], "jumps": ["P14330", "P14310"]}, {"id": "P14330", "text": ["In this case, the position of the card is \"0'' as indicated on PC130-256 (using the encoder) but, the increment circuit shows 8 on PC130-257.  The increment circuits are in error because the circuit was not reset before CW rotation.", "In this case, the position of the card is \"0'' as indicated on PC130-256 (using the encoder) but, the increment circuit shows 8 on PC130-257. The increment circuits are in error because the circuit was not reset before CW rotation.."], "jumps": ["P14340", "P14320"]}, {"id": "P14340", "text": ["Now, let's look at CW rotation of the wheel.", "Now, let's look at CW rotation of the wheel................"], "jumps": ["P14350", "P14330"]}, {"id": "P14350", "text": ["1.  Reset the display on PC130-257 by rotating the wheel CCW            past \"F\" and stopping on \"0\".", "1. Reset the display on PC130-257 by rotating the wheel CCW past \"F\" and stopping on \"0\"."], "jumps": ["P14360", "P14340"]}, {"id": "P14360", "text": ["2.  Slowly rotate the wheel CW past \"6\" and let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
