<script>
const book = {"title": "93955401", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: STEPPER MOTORS sdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Discuss theory of operation. w Discuss construction. w Describe Stepper Motor types.", "w Manually verify Stepper Motor operation. w Determine Stepper Motor pulses per revolution (PPR), stator cycle and the value of one step (in degrees)............"], "jumps": ["PPR"]}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "3. Nida Model 280 Rotating Machinery Trainer"], "jumps": []}, {"id": "P330", "text": ["Nida Model 280 Rotating Machinery Trainer"], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P350", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson you will learn about the Stepper Motor."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Stepper Motors are used for a variety of applications......"], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["These motors share some characteristics with both DC and AC motors."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["However, Stepper Motors differ from DC and AC Motors because they are truly digital motors."], "jumps": ["P440", "P410"]}, {"id": "P440", "text": ["Let's begin the lesson on STEPPER MOTORS.................................."], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Stepper Motors, unlike DC and AC Motors, are not Continuous Motors."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Stepper Motors and Synchro/Servos are classified as Incremental rotating machines."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Stepper motors move in small steps or increments..........."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The Stepper Motor is similar to the AC Motor because the input signal frequency controls the motor shaft RPM.", "AC and Stepper Motors RPMMMMMMMMMM"], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["The Stepper Motor operates on a digital input signal......."], "jumps": ["P1050"]}, {"id": "P1070", "text": ["A higher frequency digital input signal causes a Stepper Motor to run faster."], "jumps": ["P1060"]}, {"id": "P1080", "text": ["An AC Motor requires a continuous application of input cycles to establish rotor movement."], "jumps": ["P1090"]}, {"id": "P1090", "text": ["A Stepper Motor can have rotor movement with only one digital pulse applied."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["If a continuous pulse train is applied, a Stepper Motor will rotate continuously at a rate determined by the input pulse frequency."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["A Stepper Motor is classified as _______..................."], "jumps": ["P1090"]}, {"id": "P1111", "text": [], "jumps": []}, {"id": "P1112", "text": ["A Continuous Motor requires an input cycle to generate motor action. One pulse can cause an output on a Stepper Motor....."], "jumps": []}, {"id": "P1113", "text": ["A Stepper Motor is a digital motor requiring pulsed inputs, not an analog signal......."], "jumps": []}, {"id": "P1120", "text": ["A Stepper Motor has a permanent magnet (P.M.) rotor assembly stator windings."], "jumps": ["P1130", "P1110", "P"]}, {"id": "P1130", "text": ["Most Stepper Motors have 4 separate stator windings."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["These windings must be energized in a specific order to cause rotation of the rotor shaft."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["The rotor has raised nodes on its surface which are magnetized in an alternate N - S arrangement."], "jumps": ["P1160", "P1120"]}, {"id": "P1160", "text": ["When applying DC current to the stator windings, an electromagnetic field is generated, which interacts with the P.M. nodes."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["Similar to DC motor action, the rotor moves a specific distance.."], "jumps": ["P1180", "P1150"]}, {"id": "P1180", "text": ["The correlation between rotor nodes and stator coils is the distance of shaft movement per input pulse (energized stator coil).", "Correlation between Increment (step) and rotor/stator nodes"], "jumps": ["P1190", "P1150"]}, {"id": "P1190", "text": ["For a 50 node rotor with 4 stator windings, a single step equals:"], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["Activation of one stator field (one pulse) will displace the motor one quarter the distance between nodes in a 4 winding motor."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["After the rotor has moved due to the activated coil, the stator and rotor magnetic fields are in alignment."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["Once the rotor aligns to the magnetic field of a single stator field, further energization of that same field coil will have no effect on the rotor."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["To cause continuous or incremental rotation of the rotor, the stator fields must be sequentially activated from A through D."], "jumps": ["P1240", "P1210"]}, {"id": "P1240", "text": ["Each activated coil corresponds to one quarter distance between rotor nodes."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["If the sequence of coil activation (A-D) is maintained, rotor motion will continue."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["To accomplish clockwise rotation, sequential activation of coils A, B, C, D is required."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["The rotor follows the direction of field activation........"], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["To accomplish counter clockwise rotation, sequential activation of coils A, D, C, B is required."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["The rotor again follows the stator field activation........"], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["The rotor follows the stator field, much like an induction AC motor."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["A complete cycle of coil activation (pulses) corresponds to 4 steps or 22.5"], "jumps": ["P1320", "P1290"]}, {"id": "P1320", "text": ["Since a complete revolution corresponds to 360", "= 4 complete stator cycles for one complete revolution"], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["Since there are 4 steps per stator cycle, 16 pulses are required for 1 complete revolution."], "jumps": ["P1340", "P1320", "PPR"]}, {"id": "P1340", "text": ["The most important part of Stepper Motor action is the sequence in which the coils are activated."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["If a stator cycle is not completed, motor action will cease until pulses are resumed at the same place they ended."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["As an example, suppose 5 pulses are sent to the Stepper for CW rotation in the sequence A, B, C, D, A."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["The next sequence of pulses needed to continue rotation would be B, C, D, A, B."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["If a step was missed in the sequence, motor action would not continue until the sequence was resumed, starting at the pulse that was missed or the pulse that corresponds to CCW rotation."], "jumps": ["P1390", "P1360"]}, {"id": "P1390", "text": ["Assume B, D, A, B, C, was received rather than B, C, D, A, B."], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["At B the rotor would continue its CW rotation.............."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["At the next pulse, D, no rotor action would occur since pulse C was missed."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["At the next pulse, A, CCW rotation would occur since the last correctly received pulse was B."], "jumps": ["P1430", "P1400"]}, {"id": "P1430", "text": ["At the next pulse, B, CW rotation begins since the previous pulse was A."], "jumps": ["P1440", "P1400"]}, {"id": "P1440", "text": ["The final pulse C continues the original CW rotation."], "jumps": ["P1450", "P1400"]}, {"id": "P1450", "text": ["As you can see, two steps were missed by the pulses........"], "jumps": ["P1460", "P1400"]}, {"id": "P1460", "text": ["If a Stepper Motor has 100 rotor nodes and 5 stator pole windings, how many degrees is each step?"], "jumps": ["P1450", "P1465"]}, {"id": "P1461", "text": [], "jumps": []}, {"id": "P1462", "text": ["Remember: Try Again page..................................."], "jumps": []}, {"id": "P1465", "text": ["DEGREES PER STEP - To find the degrees per step use the formula below. N is the number of rotor poles and P is the number of stator poles."], "jumps": []}, {"id": "P1470", "text": ["If a Stepper Motor has 100 rotor nodes and 5 stator poles what is the PPR (Pulse per Revolution) of the motor?"], "jumps": ["P1460", "P1475", "Pulse"]}, {"id": "P1471", "text": [], "jumps": []}, {"id": "P1472", "text": ["Remember: Try Again page..................................."], "jumps": []}, {"id": "P1475", "text": ["PULSES PER REVOLUTION - To find the pulse per revolution use the following formula."], "jumps": []}, {"id": "P1480", "text": ["If a Stepper Motor has 100 rotor nodes and 5 stator poles, how many degrees apart are each stator poles for one revolution (360)?"], "jumps": ["P1470", "P1485"]}, {"id": "P1481", "text": [], "jumps": []}, {"id": "P1482", "text": ["Remember: Try Again page...................................", "1 stator cycle = # of poles ( in degrees )"], "jumps": []}, {"id": "P1485", "text": ["STATOR CYCLES - To find the number of degrees between stator poles use the formula below. P is the number of stator poles."], "jumps": []}, {"id": "P1490", "text": ["The stator pulse patterns discussed this far are called one phase energized since only one coil is activated at any instant of time."], "jumps": ["P1500", "P1480"]}, {"id": "P1500", "text": ["One phase step patterns cause the the Stepper Motor to jerk due to time delays between pulses."], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["One phase step patterns are used when a minimum of current is required from the power supply."], "jumps": ["P1520", "P1500"]}, {"id": "P1520", "text": ["When smooth motor operation is required, two phase energized step patterns are employed."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["In two phase step patterns, the next energized coil is turned on during the current step pulse."], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["In two phase step patterns, there is no time delay between pulses, resulting in jerk free operation."], "jumps": ["P1550", "P1520"]}, {"id": "P1550", "text": ["In two phase step patterns, the power supply must generate more current since two pulses are used in one time period."], "jumps": ["P1560", "P1520"]}, {"id": "P1560", "text": ["Both the one phase and two phase step patterns are defined as full step patterns where each energized coil corresponds to one full step."], "jumps": ["P1570", "P1550"]}, {"id": "P1570", "text": ["Another type of step pattern is called a half step pattern."], "jumps": ["P1580", "P1560"]}, {"id": "P1580", "text": ["In a half step pattern, 2 coils must be energized to establish one complete step."], "jumps": ["P1582", "P1570"]}, {"id": "P1582", "text": ["If only coil A is energized, rotor distance is 1/2 the distance traveled than if coils A and B were energized."], "jumps": ["P1590", "P1580"]}, {"id": "P1590", "text": ["In a Stepper Motor with 50 rotor nodes and 4 stator windings, each half step causes 0.9 of rotor rotation."], "jumps": ["P1600", "P1580"]}, {"id": "P1600", "text": ["PPR for the half step is 400. 100 stator cycles are required for one complete revolution of the rotor."], "jumps": ["P1610", "P1580"]}, {"id": "P1610", "text": ["As you may have guessed, all values are twice that of a full step pattern."], "jumps": ["P1620", "P1580"]}, {"id": "P1620", "text": ["Which type of step pattern generates the smoothest motor action?"], "jumps": ["P1580"]}, {"id": "P1621", "text": [], "jumps": []}, {"id": "P1622", "text": ["One phase step patterns have small time delays between pulses causing the Stepper Motor to jerk......"], "jumps": []}, {"id": "P1623", "text": ["Half step patterns do have overlapping pulses and are not the best for smooth motor operation......"], "jumps": []}, {"id": "P1630", "text": ["Which type of step pattern draws the most current from a power supply?"], "jumps": ["P1620"]}, {"id": "P1631", "text": [], "jumps": []}, {"id": "P1632", "text": ["A Half Step pattern has shorter pulse periods, which result in less current drawn from the power supply."], "jumps": []}, {"id": "P1633", "text": ["A One Phase step pattern has only one pulse activated at any one time period. This equates to less current draw."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on STEPPER MOTORS.LE........"], "jumps": ["P1001", "P1630"]}, {"id": "P1920", "text": ["1. Stepper Motors are classified as incremental motors and there are two distinct types."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. Stepper Motors, like AC Motors, are frequency sensitive where motor RPM is concerned."], "jumps": ["P1920"]}, {"id": "P1940", "text": ["3. A typical Stepper Motor has four independent stator poles and a rotor with nodes."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. Each energized coil corresponds to a particular rotary distance traveled. PPR is the number of pulses required for 360", "N = # of Rotor Nodes P = # of Stator Poles"], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. Coils must be energized in a particular sequence to generate either clockwise or counterclockwise rotor rotation."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6. One phase step patterns have a small time delay between pulses. Two phase step patterns have overlapping pulses. Both are full step patterns."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7. Half wave step patterns require twice as many pulses or stator cycles to complete 1 revolution since two pulses are required for one step."], "jumps": ["P1999", "P1970"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["In this experiment you will configure the 280 Rotating machinery trainer as a One phase full step Stepper Motor."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["You will manually step the motor and from this, verify proper stepper motor action."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["Finally, you will determine the value in degrees of 1 step, 1 stator cycle and the PPR of the stepper motor.", "N = # of Rotor Nodes P = # of Stator Poles"], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["Let's begin the experiment.e..............................."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["1. Set the 280 trainer to it's initial control settings.t's initial control settings."], "jumps": ["P2070", "P2050", "P22000"]}, {"id": "P2070", "text": ["2. Set the Test Console controls to their initial control settings........"], "jumps": ["P2060"]}, {"id": "P2080", "text": ["3. Insert PC130-286 into the PC3 position on the Test Console. console.2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2090"]}, {"id": "P2090", "text": ["4. Connect the 6 pin interconnect from the PC130-286 experiment card to the PC130-286 connector located on the 280 trainer. .................."], "jumps": ["P2080", "P"]}, {"id": "P2100", "text": ["5. Place the 130 power supply controls as follows: - Set the PC1 DC Switch to ON....", "5. Press enter to set the 130 Test Console controls as follows: ntrols as follows: t.......... ON + Power Supply... 24 Volts - Power Supply....15 Volts"], "jumps": ["P2090"]}, {"id": "P2110", "text": ["6. Press Enter to set PC3 DC Power - ON.", "6. Set the PC3 DC Power switch to ON.ON. 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": []}, {"id": "P2120", "text": ["At this time you have configured the 280 trainer as a stepper motor with PC130-286 serving as a controller for the motor."], "jumps": ["P2130"]}, {"id": "P2130", "text": ["7. Set PC130-286 switch S6 to Manual (down)..............."], "jumps": ["P2140", "P2120", "P2135"]}, {"id": "P2135", "text": ["MEASUREMENT SETUP - S6 to manual - (down)"], "jumps": []}, {"id": "P2140", "text": ["Notice that PC130-286 has four white push-buttons located on the lower portion of the card. Each push-button, when depressed, will energize a particular stator winding. Notice that these push-buttons are labeled 1 through 4."], "jumps": ["P2170", "P2130", "P2145"]}, {"id": "P2145", "text": [], "jumps": []}, {"id": "P2170", "text": ["The numbers 1 through 4 correspond to the stator windings of the stepper motor. Each energized coil corresponds to one full step."], "jumps": ["P2180", "P2140", "P2175"]}, {"id": "P2175", "text": [], "jumps": []}, {"id": "P2180", "text": ["8. Depress the push-buttons, one at a time, starting at 1 and ending at 4. This initializes the stepper motor."], "jumps": ["P2190", "P2170", "P2185"]}, {"id": "P2185", "text": [], "jumps": []}, {"id": "P2190", "text": ["9. While monitoring the flywheel on the 280 trainer, depress push-button number 1."], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["10. Depress push-buttons two through four (one at a time) and verify that the flywheel rotates in a CCW direction."], "jumps": ["P2210", "P2190", "P2205"]}, {"id": "P2205", "text": [], "jumps": []}, {"id": "P2210", "text": ["11. Since the last push-button depressed was four, depress it several more times and observe no additional rotation occurs."], "jumps": ["P2230", "P2200"]}, {"id": "P2230", "text": ["After the first energizing sequence, why wasn't there a change when coil 4 was energized?", "The stepper motor is trying to reverse direction.", "After being energized once, a coil can not be energized again.", "Energizing a coil more than once, out of sequence, has no effect on the motor."], "jumps": ["P2210"]}, {"id": "P2231", "text": [], "jumps": []}, {"id": "P2232", "text": ["Energizing the same coil twice causes a locked rotor and does not reverse shaft rotation direction."], "jumps": []}, {"id": "P2233", "text": ["A coil can be energized more times than once, it is the sequence of energizing that is the key."], "jumps": []}, {"id": "P2240", "text": ["You should have determined that energizing coil 4, out of sequence, caused a locked rotor condition since the stator nodes and rotor nodes were already aligned for that stator position."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["12. Depress the push-buttons in the following sequence 1,2,3,4,3,2,1 and observe the direction of motor rotation."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["You should have observed the motor shafts direction of rotation change."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["When activating the coils in the following sequence, (1,2,3,4,3,2, 1,) why did the direction of the shaft rotor change?", "Because the stepper motor skipped a step.", "Because the rotor followed the energized coils and the coils were energized in a reverse sequence."], "jumps": ["P2260"]}, {"id": "P2271", "text": [], "jumps": []}, {"id": "P2272", "text": ["All pulses were in sequence, the stepper motor will not skip a step."], "jumps": []}, {"id": "P2273", "text": [], "jumps": []}, {"id": "P2290", "text": ["13. Depress the push-buttons, one at a time, from one to four. This resets the rotation of the motor in a CCW direction."], "jumps": ["P2300", "P2270"]}, {"id": "P2300", "text": ["14. Place a heavy pencil mark on the flywheel at the point where it matches the magnetic pickup."], "jumps": ["P2310", "P2290", "P2305"]}, {"id": "P2305", "text": [], "jumps": []}, {"id": "P2310", "text": ["15. Begin the sequence of pulses (1 through 4) and count each sequence until the pencil mark has rotated a full 360"], "jumps": ["P2320", "P2300", "P2315"]}, {"id": "P2315", "text": [], "jumps": []}, {"id": "P2320", "text": ["How many sequences were required for the rotor to travel 1 revolution or 360"], "jumps": ["P2310"]}, {"id": "P2321", "text": [], "jumps": []}, {"id": "P2322", "text": ["Each sequence consists of depressing push-buttons one through four in that order. Reset the motor by performing the sequence once, align the pencil mark and magnetic pickup and repeat the sequences until the pencil mark has rotated back to the magnetic pickup............"], "jumps": []}, {"id": "P2330", "text": ["You should have determined that there were 50 sequences for the rotor to rotate 360", "or 1 revolution. Since each sequence corresponds to all four stator poles energized, each sequence represents one complete stator cycle."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["If 50 stator cycles were required for 360", "of rotor rotation and there are 4 stator pulses used on the motor, what is the PPR of the motor?"], "jumps": ["P2330"]}, {"id": "P2341", "text": [], "jumps": []}, {"id": "P2342", "text": ["Remember: Try Again page...................................", "PPR = # of stator cycles per revolution x # of stator poles.", "where # of stator cycles = 50 # of stator poles = 4"], "jumps": []}, {"id": "P2350", "text": ["What does each depressed push-button represent?............"], "jumps": ["P2340"]}, {"id": "P2351", "text": [], "jumps": []}, {"id": "P2352", "text": ["When a button is depressed a pulse is applied, which energizes the stator that steps the motor 1 step."], "jumps": []}, {"id": "P2360", "text": ["of rotor rotation, each step represents 1.8 of rotation."], "jumps": ["P2370", "P2350"]}, {"id": "P2370", "text": ["Based on your experimental results, how many nodes does the stepper motor rotor have?"], "jumps": ["P2360"]}, {"id": "P2371", "text": [], "jumps": []}, {"id": "P2372", "text": ["Remember: Try Again page...................................", "Where P = # of stator Poles (4) N = # of rotor nodes Step Rotation = 1.8"], "jumps": []}, {"id": "P2380", "text": ["1. Return the Test Console to the initial control settings................"], "jumps": ["P2370"]}, {"id": "P2390", "text": ["1. Return the Rotating Machinery trainer to initial control settings.", "2. Return the Rotating Machinery trainer to initial control settings.", "2. Return the Rotating Machinery trainer to initial control settings.2. Return the Rotating Machinery trainer to initial control settings."], "jumps": ["P2400", "P22000"]}, {"id": "P2400", "text": ["3. Turn Power OFF on the Test let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
