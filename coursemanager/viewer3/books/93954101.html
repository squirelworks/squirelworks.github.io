raction, multiplication and division..."], "jumps": ["P1090", "P1070", "P1100"]}, {"id": "P1100", "text": ["In the 19th century an Englishman named Babbage made the mechanical counting machine work with a Programmed Controller."], "jumps": ["P1130", "P1090"]}, {"id": "P1130", "text": ["The real advances in digital counting devices occurred in 1940 with the development of the ENIAC computer."], "jumps": ["P1150", "P1090"]}, {"id": "P1150", "text": ["The ENIAC was the first generation of the modern digital computer.  It used vacuum tubes that were big, expensive and unreliable.", "The ENIAC was the first generation of the modern digital computer. It used vacuum tubes that were big, expensive and unreliable."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["The second generation of digital computers replaced the vacuum tube with the transistor.  The transistor was small, inexpensive and reliable.", "The third generation of digital computer combined the transistor with new technology and created the integrated circuit (IC).", "The integrated circuit contains many transistors.", "The second generation of digital computers replaced the vacuum tube with the transistor. The transistor was small, inexpensive and reliable.", "The integrated circuit contains many transistors................."], "jumps": ["P1170", "P1130", "P1175", "P1160", "P1180"]}, {"id": "P1180", "text": ["The computer is not the only use for digital electronics.  There are many applications for digital circuits.", "The computer is not the only use for digital electronics. There are many applications for digital circuits."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["Most forms of communication equipment use digital circuits. Radio, TV, and satellites all use digital circuits.", "Most consumer products use digital circuits or microprocessors to control their operation.", "The world of digital electronics has come a long way from the Abacus.", "Most forms of communication equipment use let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
