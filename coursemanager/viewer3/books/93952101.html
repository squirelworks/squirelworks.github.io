ernation.  Remember the positive alternation is always above the zero base line.", "You touched the negative alternation. Remember the positive alternation is always above the zero base line."], "jumps": []}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1230", "text": ["Touch the positive alternation of this sine wave.", "Touch the positive alternation of this sine wave..........."], "jumps": []}, {"id": "P1225", "text": ["ALTERNATION - An AC alternation is either positive or negative.  One complete cycle of AC must contain 1 positive and 1negative alternation.", "ALTERNATION - An AC alternation is either positive or negative. One complete cycle of AC must contain 1 positive and 1negative alternation."], "jumps": ["P1223"]}, {"id": "P1223", "text": ["This sine wave completes one cycle of AC voltage and current.  One cycle of AC always completes two alternations.", "This sine wave completes one cycle of AC voltage and current. One cycle of AC always completes two alternations..."], "jumps": ["P1230", "P1190"]}, {"id": "P1220", "text": ["This sine wave completes one cycle of AC voltage and current.  One cycle of AC always completes two alternations.", "This sine wave completes one cycle of AC voltage and current. One cycle of AC always completes two alternations..."], "jumps": ["P1230"]}, {"id": "P1210", "text": ["The voltage changes polarity (d), and increases to negative 10 volts at the peak (e), then decreases to zero (f)."], "jumps": ["P1220", "P1190"]}, {"id": "P1200", "text": ["The AC sine wave starts at zero (a), increases to positive 10 volts at the peak (b), then decreases to zero (c)."], "jumps": ["P1210", "P1190"]}, {"id": "P1190", "text": ["Now, let's take a closer look at the AC sine wave.", "Now, let's take a closer look at the AC sine wave.........."], "jumps": ["P1200", "P1180"]}, {"id": "P1183", "text": ["This is a DC waveform.  No part of this wave goes above 0 volts.  Remember, an AC waveform must have a portion of the waveform in the positive ive and negative alternation."], "jumps": ["P1160", "P1130"]}, {"id": "P1156", "text": ["It is the change in direction and the crossing of the base line which causes the change in current direction (Alternating Current)."], "jumps": ["P1158", "P1130"]}, {"id": "P1154", "text": ["The waveform then changes direction and crosses the 0 volts base line.  The other portion of the waveform is below 0 volts or negative.", "The waveform then changes direction and crosses the 0 volts base line. The other portion of the waveform is below 0 volts or negative."], "jumps": ["P1156", "P1130"]}, {"id": "P1152", "text": ["In this example, the sine wave has a positive portion above the \n0 volts base line.", "In this example, the sine wave has a positive portion above the 0 volts base line.."], "jumps": ["P1154", "P1130"]}, {"id": "P1150", "text": ["The AC voltage of the circuit is shown on the graph.  This is an AC sine wave.", "The AC voltage of the circuit is shown on the graph. This is an AC sine wave."], "jumps": ["P1152", "P1130"]}, {"id": "P1140", "text": ["The reversing will occur many times per second.", "The reversing will occur many times per second.. The reversing will occur many times per second."], "jumps": ["P1150", "P1130"]}, {"id": "P1130", "text": ["In an AC circuit, current flows when the switch is closed.  Current flows in one direction, then reverses and flows in the other direction.", "In an AC circuit, current flows when the switch is closed. Current flows in one direction, then reverses and flows in the other direction."], "jumps": ["P1140", "P1090"]}, {"id": "P1120", "text": ["Voltage remains while the switch is closed.  When the switch is opened, current and voltage stop.", "Voltage remains while the switch is closed. When the switch is opened, current and voltage stop."], "jumps": ["P1130", "P1090"]}, {"id": "P1110", "text": ["The graph shows voltage immediately increases to 10 volts.  This is a DC square wave.", "The graph shows voltage immediately increases to 10 volts. This is a DC square wave."], "jumps": ["P1120", "P1090"]}, {"id": "P1100", "text": ["In a DC circuit, current flows when the switch is closed.", "In a DC circuit, current flows when the switch is closed..."], "jumps": ["P1110", "P1090"]}, {"id": "P1098", "text": ["The vertical scale below the base line represents negative voltage or current.", "The vertical scale below the base line represents negative voltage or current.................................................."], "jumps": ["P1090", "P1095"]}, {"id": "P1097", "text": ["The vertical scale above the base line represents positive voltage or current.", "The vertical scale above the base line represents positive voltage or current.................................................."], "jumps": ["P1098", "P1095"]}, {"id": "P1096", "text": ["The horizontal base line represents zero volts or current.  Time is represented by the dashed marks to the right.", "The horizontal base line represents zero volts or current. Time is represented by the dashed marks to the right..............."], "jumps": ["P1097", "P1095"]}, {"id": "P1095", "text": ["GRAPH - The graph is used to represent voltage and current in DC and AC circuits."], "jumps": ["P1096", "P1090"]}, {"id": "P1090", "text": ["Now let's look at DC and AC on a graph to show voltage and current in the circuit.", "Now let's look at DC and AC on a graph to show voltage and current in the circuit..."], "jumps": ["P1100", "P1053"]}, {"id": "P1080", "text": ["Like DC, AC always flows from positive to negative. As the voltage reverses, the current must also reverse.", "Like DC, AC always flows from negative to positive. As the voltage reverses, the current must also reverse."], "jumps": ["P1090", "P1053"]}, {"id": "P1070", "text": ["AC from the generator changes polarity many times a second.  As polarity changes, current direction changes.", "AC from the generator changes polarity many times a second. As polarity changes, current direction changes."], "jumps let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
