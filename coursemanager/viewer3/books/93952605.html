const book = {"title": "93952605", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . .", "Title: SERIES RESONANT CIRCUITSasd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Calculate and measure the resonant frequency in a LCR series circuit. w Observe the effects of voltage magnification. w Observe the values of Er, It, and Zt below resonance in a series LCR circuit.............."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P400", "text": ["In this section you will verify normal operation of LCR series resonant circuits by calculating and measuring the resonant frequency."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["You will also observe the characteristics of LCR series circuits at resonance:", "* Voltage Magnification * Total Impedance", "* Total Current * Voltage across Rdancece"], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Let's begin the lesson on SERIES RESONANCE OPERATION......................"], "jumps": ["P400"]}, {"id": "P900", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1020", "text": ["The purpose of this experiment is to demonstrate the normal operation of LCR resonant circuits."], "jumps": ["P1040"]}, {"id": "P1040", "text": ["Pick up the PC130-18A card. This card is used to demonstrate the operation of LCR series resonant circuits."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Compare the card with the schematic shown."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["Notice that there are four LCR series circuits.  S1, S2, S3, and S4 are used to select the circuit.", "Notice that there are four LCR series circuits. S1, S2, S3, and S4 are used to select the circuit."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["On the PC card, when a switch is to the left the circuit is open. When a switch is to the right, power is applied."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["In this experiment you will use circuit A only.  Circuits B, C, and D operate the same, only the values are different.  Let's start the experiment.", "In this experiment you will use circuit A only. Circuits B, C, and D operate the same, only the values are different. Let's start the experiment."], "jumps": ["P1090", "P1040"]}, {"id": "P1090", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P1040"]}, {"id": "P1100", "text": ["2.  Carefully plug PC130-18A into the Test Console PC1 position. \n3.  Place S1, S2, S3, and S4 to the left.", "2. Carefully plug PC130-18A into the Test Console PC1 position. 3. Place S1, S2, S3, and S4 to the left. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P1090", "P1105"]}, {"id": "P1105", "text": ["MEASUREMENT SETUP - S1, S2, S3, and S4 to the left (open)."], "jumps": []}, {"id": "P1110", "text": ["4.  Connect the function generator output to the Test Console's          INPUT BNC.", "4. Connect the function generator output to the Test Console's INPUT BNC..e PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P1100", "P1115"]}, {"id": "P1115", "text": ["BNC CONNECTION - Connect the Function Generator's Main Output BNC to the Test Console's Input BNC."], "jumps": []}, {"id": "P1120", "text": ["5.  Set up the oscilloscope to measure AC signals and zero the           trace.", "5. Set up the oscilloscope to measure AC signals and zero the trace.."], "jumps": ["P1130", "P1110", "P1125"]}, {"id": "P1125", "text": ["Center Trace at least 5 divisions above trace", "OSCILLOSCOPE SETUP - Trigger - CH1, AC, + Display Mode - CH1 CH1 - AC", "K, HK_,,_K,_K'',EK,,,,,'_,KEKZ;;XK98JO9[N=9N@N99U,,K,,EK", "'_K_'K'',K' QUK_,''KK}0;KK,KK__',K'K_K''KK'K_", "'_K_'KK',K_,,'_'',K,K', F;__KK,K, TK,,__,''KKK'", ",KK,,E:9 POOHPPP=70=07PUHP^UOOU=YOVP=PPPPOOPXOOOOXH9UO95P0P===TXZOOU1NIIPPPHPVGH5PSOPZXXOK;E", "a5T 55:s5 m5 ts55Tt T--|57s- Fss y 5 -VVFs5m--FFFmm5FFs---t-t t-| -s-ymV sGFt--ss5-", "7mty-5m--F-s- mVs t --FFy5V-|-F smst Vm--5sVt T-", ",,K;A:'K,57VGO;EEEOa>2OK9)1UE; VPKEE,'KK__K'KK'KKKKK'K_',_", "K';;_KE,KKKKE,KEEK,EKEEE OKKK-RL0;;E,;A ?PU;a", ";U;U;;UU;;;;;KEUW>< E__,K,K,',;_KKK,EKKK", "(O;KKK;;K,'EUEE;90H7Q55H5m5=V0T0HT5T=QHP=H5 TT=U;,,E__,_,K,'"], "jumps": ["PK", "PU77OK", "PO", "P", "PKKKKKK", "PEEE", "PA"]}, {"id": "P1130", "text": ["6.  Connect the CH1 probe to TP14 on PC130-18A.\n7.  Adjust the output of the function generator for 5 Vpp 10 kHz           sine wave as measured on PC130-18A TP14. \n8.  Adjust the TIME/DIV control as necessary to view at least two   \n      full cycles.", "6. Connect the CH1 probe to TP14 on PC130-18A. 7. Adjust the output of the function generator for 5 Vpp 10 kHz sine wave as measured on PC130-18A TP14. 8. Adjust the TIME/DIV control as necessary to view at least two full cycles..........."], "jumps": ["P1140", "P1120", "P1135"]}, {"id": "P1135", "text": [], "jumps": ["P1137", "P"]}, {"id": "P1137", "text": ["MEASUREMENT SETUP - Frequency - 1 Range - 10 k Output - 5 Vpp Function - sine wave"], "jumps": ["P1130", "P1135"]}, {"id": "P1140", "text": ["The experiment is now set up.  First we will calculate the resonant frequency of circuit A.", "The experiment is now set up. First we will calculate the resonant frequency of circuit A.."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["1.  Calculate the resonant frequency of circuit A. What is the                resonant frequency?  Round your answer to one decimal               place.", "1. Calculate the resonant frequency of circuit A. What is the resonant frequency? Round your answer to one decimal place..."], "jumps": ["P1140", "P1152", "P1155"]}, {"id": "P1151", "text": [], "jumps": []}, {"id": "P1152", "text": ["Your calculations are incorrect.  Ensure that you are using the formula and that you are taking the square root of powers of ten correctly.", "Your calculations are incorrect. Ensure that you are using the formula and that you are taking the square root of powers of ten correctly."], "jumps": []}, {"id": "P1153", "text": ["Your calculations are still incorrect.  You should have calculated approximately 50.4 kHz.", "Your calculations are still incorrect. You should have calculated approximately 50.4 kHz..", "1 1", "o = = 2p LC 2p (2.5 x 10-3)(.004 x 10-6) 1 1 = = = .504 x 105 2p .1 x 10-10 6.28 (.32 x 10-5) = 50.4 kHz"], "jumps": ["P1150"]}, {"id": "P1155", "text": ["RESONANT FREQUENCY - To calculate resonant frequency use this formula:"], "jumps": []}, {"id": "P1160", "text": ["Now, let's measure the resonant frequency of circuit A and compare it to the calculated value."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["To measure the resonant frequency, measure the voltage drop across the resistor, R1, and adjust the function generators frequency until Er1 is maximum.  Remember, Er is maximum in a LCR series circuit at resonance.", "To measure the resonant frequency, measure the voltage drop across the resistor, R1, and adjust the function generators frequency until Er1 is maximum. Remember, Er is maximum in a LCR series circuit at resonance."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["1.  Set switch S1 on PC130-18A to the right.  This applies power          to circuit A. \n2.  Connect the oscilloscopes CH1 probe to TP4 on PC130- 18A.         This measures the voltage across R1.", "1. Set switch S1 on PC130-18A to the right. This applies power to circuit A. 2. Connect the oscilloscopes CH1 probe to TP4 on PC130- 18A. This measures the voltage across R1.........", "MEASUREMENT SETUP - CH1 probe to TP4 S1 to the right (power applied)"], "jumps": ["P1190", "P1170", "P1185"]}, {"id": "P1190", "text": ["3.  Adjust the frequency of the function generator until the                    voltage drop across R1 is maximum as measured by the                 oscilloscope. Adjust the Time/Div control as necessary.", "3. Adjust the frequency of the function generator until the voltage drop across R1 is maximum as measured by the oscilloscope. Adjust the Time/Div control as necessary.", "NOTE Do not adjust the function generator below 10 kHz or above 100 kHz. - 5 CH2 Volt/Div - 5 Time/Div - 5 msec"], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["Once Er1 is maximum, the frequency indicated on the function generator is the resonant frequency. What is the measured resonant frequency of circuit A?"], "jumps": ["P1190", "P1202"]}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1202", "text": ["Your measured frequency is incorrect. Ensure that the voltage drop across R1 is maximum and that you are reading the frequency of the function generator correctly."], "jumps": []}, {"id": "P1203", "text": ["Your measured frequency is still incorrect. You should have measured approximately 50 kHz \u00b110%.", "Your measured frequency is still incorrect. You should have measured approximately 50 kHz"], "jumps": ["P1200"]}, {"id": "P1210", "text": ["Notice that your calculated frequency and the measured frequency are within \u00b110% of each other.", "Notice that your calculated frequency and the measured frequency are within"], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["The LCR circuit is operating normally at resonance."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["Before observing the characteristics of a resonant series circuit, there are two points to bring out.", "1) Effect of low impedance on test equipment. 2) Resistance of the coil in an inductor."], "jumps": ["P1240", "P1210"]}, {"id": "P1240", "text": ["The first point, effect of low impedance on test equipment, may reduce the output voltage of the function generator. This effect is easily seen using the oscilloscope."], "jumps": ["P1250", "P1230", "P1245"]}, {"id": "P1245", "text": ["LOW IMPEDANCE AT RESONANCE - At resonance, XL and XC cancel leaving only the value of R as the impedance. For circuit A at resonance impedance equals 100 W."], "jumps": []}, {"id": "P1250", "text": ["1.  Set the frequency of the function generator to 10 kHz. \n2.  Ensure switch S1 on PC130-18A is set to the right.  \n3.  Connect the oscilloscope to TP14 on PC130-18A.", "1. Set the frequency of the function generator to 10 kHz. 2. Ensure switch S1 on PC130-18A is set to the right. 3. Connect the oscilloscope to TP14 on PC130-18A..."], "jumps": ["P1260", "P1240", "P1255"]}, {"id": "P1255", "text": ["MEASUREMENT SETUP - S1 to the right (power applied) CH1 probe to TP14."], "jumps": ["P1257"]}, {"id": "P1257", "text": ["MEASUREMENT SETUP - Frequency - 1 Range - 10 k Output - 5 Vpp Function - sine wave"], "jumps": ["P1250", "P1255"]}, {"id": "P1260", "text": ["4.  Adjust the output voltage of the function generator to 5 Vpp. \n5.  Slowly increase the frequency of the function generator from        10 kHz to 90 kHz and observe the amplitude of the output               signal on the oscilloscope.  Adjust the TIME/DIV control as             necessary.", "4. Adjust the output voltage of the function generator to 5 Vpp. 5. Slowly increase the frequency of the function generator from 10 kHz to 90 kHz and observe the amplitude of the output signal on the oscilloscope. Adjust the TIME/DIV control as necessary."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["If the type of function generator you are using is sensitive to low impedance, you will notice that the output voltage of the generator is lower between 40 and 50 kHz."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["The effect is due to the output impedance of the function generator, normally 50 W, supplying voltage to a 100 W circuit that is at resonance."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["The second point, resistance of the coil in an inductor, causes the voltage drop across the series resistor NOT to EQUAL the applied voltage at resonance. This is also easily seen on the oscilloscope.", "The second point, resistance of the coil in an inductor, causes the voltage drop across the series resistor NOT to EQUAL the applied voltage at resonance. This is also easily seen on the oscilloscope..."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["1.  Set the output frequency of the function generator to                         resonance for circuit A, 50.4 kHz. \n2.  Ensure that the CH1 probe of the oscilloscope is still                         connected to TP14 on PC130-18A. \n3.  Adjust the output voltage of the function generator to 5 Vpp.", "1. Set the output frequency of the function generator to resonance for circuit A, 50.4 kHz. 2. Ensure that the CH1 probe of the oscilloscope is still connected to TP14 on PC130-18A. 3. Adjust the output voltage of the function generator to 5 Vpp."], "jumps": ["P1310", "P1290", "P1305"]}, {"id": "P1305", "text": ["MEASUREMENT SETUP - S1 to the right (power applied) CH1 probe to TP14"], "jumps": ["P1307"]}, {"id": "P1307", "text": ["MEASUREMENT SETUP - Frequency - 5.4 Range - 10 k Output - 5 Vpp Function - sine wave"], "jumps": ["P1300", "P1305"]}, {"id": "P1310", "text": ["4.  Connect the CH1 probe to TP4 on PC130-18A. This measures        the voltage drop across R1. Notice that the peak to peak                  voltage measurement is not 5 V as it should be for a LCR                series resonant circuit.", "4. Connect the CH1 probe to TP4 on PC130-18A. This measures the voltage drop across R1. Notice that the peak to peak voltage measurement is not 5 V as it should be for a LCR series resonant circuit...."], "jumps": ["P1320", "P1300", "P1315"]}, {"id": "P1315", "text": ["MEASUREMENT SETUP - CH1 probe to TP4."], "jumps": []}, {"id": "P1320", "text": ["The effect is due to the construction of inductors, the wire coil has resistance. This resistance is like a resistors resistance, it does not change with frequency."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["The resistance of inductors is small, between 10 to 150 W. However, compared to R1 at 100 W, the effect of the coil resistance is seen at resonance."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["In both effects, if the resistance of R1 is increased, say to 2 kW, the effects of low impedance on test equipment and on R1's voltage drop is reduced."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["Keeping these two points in mind, let's observe the characteristics of a series resonant circuit. Let's first look at voltage magnification."], "jumps": ["P1360", "P1330"]}, {"id": "P1360", "text": ["1.  Ensure that the function generator is set to 50.4 kHz at 5 Vpp         as measured at TP14 on PC130-18A.", "1. Ensure that the function generator is set to 50.4 kHz at 5 Vpp as measured at TP14 on PC130-18A."], "jumps": ["P1370", "P1350", "P1365"]}, {"id": "P1365", "text": ["MEASUREMENT SETUP - S1 to the right (power applied) CH1 probe to TP14"], "jumps": ["P1367"]}, {"id": "P1367", "text": ["MEASUREMENT SETUP - Frequency - 5.4 Range - 10 k Output - 5 Vpp Function - sine wave"], "jumps": ["P1360", "P1365"]}, {"id": "P1370", "text": ["2.  Remove the CH1 probe from TP14. \n3.  Set up the oscilloscope as follows: \n4.  Invert the CH2 input.", "2. Remove the CH1 probe from TP14. 3. Set up the oscilloscope as follows: 4. Invert the CH2 input...............", "Display - Add CH1 and CH2 DC, GND, AC - AC CH1 Volt/Div - 5 CH2 Volt/Div - 5 Time/Div - 5 msec"], "jumps": ["P1380", "P1360", "P1375"]}, {"id": "P1375", "text": ["OSCILLOSCOPE SETUP Time/Div - 5 msec Display Mode - ADD Sweep Mode - AUTO CH1 Volts/Div - 5 Trigger - CH1, AC, + CH2 Volts/Div - 5 CH1 - AC CH2 - ACCCCCCCC", "Center Trace at least 5 divisions above trace", "K, HK_,,_K,_K'',EK,,,,,'_,KEKZ;;XK98JO9[N=9N@N99U,,K,,EK", "'_K_'K'',K' QUK_,''KK}0;KK,KK__',K'K_K''KK'K_", "'_K_'KK',K_,,'_'',K,K', F;__KK,K, TK,,__,''KKK'", ",KK,,E:9 POOHPPP=70=07PUHP^UOOU=YOVP=PPPPOOPXOOOOXH9UO95P0P===TXZOOU1NIIPPPHPVGH5PSOPZXXOK;E", "a5T 55:s5 m5 ts55Tt T--|57s- Fss y 5 -VVFs5m--FFFmm5FFs---t-t t-| -s-ymV sGFt--ss5-", "7mty-5m--F-s- mVs t --FFy5V-|-F smst Vm--5sVt T-", ",,K;A:'K,57VGO;EEEOa>2OK9)1UE; VPKEE,'KK__K'KK'KKKKK'K_',_", "K';;_KE,KKKKE,KEEK,EKEEE OKKK-RL0;;E,;A ?PU;a", ";U;U;;UU;;;;;KEUW>< E__,K,K,',;_KKK,EKKK", "(O;KKK;;K,'EUEE;90H7Q55H5m5=V0T0HT5T=QHP=H5 TT=U;,,E__,_,K,'"], "jumps": ["PK", "PU77OK", "PO", "P", "PKKKKKK", "PEEE", "PA"]}, {"id": "P1380", "text": ["5.  Ensure that S1 is to the right on PC130-18A. \n6.  Place CH1 probe to TP2 on PC130-18A. \n7.  Place CH2 probe to TP3 on PC130-18A.", "5. Ensure that S1 is to the right on PC130-18A. 6. Place CH1 probe to TP2 on PC130-18A. 7. Place CH2 probe to TP3 on PC130-18A.", "MEASUREMENT SETUP - CH1 probe to TP2 CH2 probe to TP3"], "jumps": ["P1390", "P1370", "P1385"]}, {"id": "P1390", "text": ["The display on the oscilloscope illustrates the peak to peak voltage across capacitor C1.  Notice that it is approximately\n24 Vpp.  Remember, there is only 5 Vpp applied, this is voltage magnification.", "The display on the oscilloscope illustrates the peak to peak voltage across capacitor C1. Notice that it is approximately 24 Vpp. Remember, there is only 5 Vpp applied, this is voltage magnification."], "jumps": ["P1400", "P1380", "P1395"]}, {"id": "P1395", "text": ["VOLTAGE DROP ACROSS C1 - Voltage drop across C1 is displayed by adding CH1 to the inverted CH2 input of the oscilloscope. CH1 input is the voltage on the left side of C1. CH2 input is the voltage on the right side of C1. Subtracting the CH2 voltage from the CH1 voltage results in the voltage across C1."], "jumps": []}, {"id": "P1400", "text": ["8.  Move the CH2 probe to TP4 on PC130-18A. \n9.  Move the CH1 probe to TP3 on PC130-18A.", "8. Move the CH2 probe to TP4 on PC130-18A. 9. Move the CH1 probe to TP3 on PC130-18A.", "MEASUREMENT SETUP - CH1 probe to TP3 CH2 probe to TP4"], "jumps": ["P1410", "P1390", "P1405"]}, {"id": "P1410", "text": ["The display on the oscilloscope illustrates the peak to peak voltage across inductor L1. Notice that it is approximately\n25 Vpp.  Remember there is only 5 Vpp applied, this is voltage magnification.", "The display on the oscilloscope illustrates the peak to peak voltage across inductor L1. Notice that it is approximately 25 Vpp. Remember there is only 5 Vpp applied, this is voltage magnification."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["Also notice that the voltage is a little higher across the inductor (at resonance, El and Ec should be equal). The difference is due to the voltage drop of the coil."], "jumps": ["P1425", "P1410"]}, {"id": "P1425", "text": ["The reason El and Ec exceed Ea is because in the first half cycle, the magnetic field of the inductor stores the energy of the discharging capacitor, which adds to Ea."], "jumps": ["P1426", "P1420"]}, {"id": "P1426", "text": ["In the second half cycle, the stored energy in the inductor charges the capacitor, this again adds to Ea. Because of this, both El and  Ec are Higher than Ea.", "In the second half cycle, the stored energy in the inductor charges the capacitor, this again adds to Ea. Because of this, both El and Ec are Higher than Ea."], "jumps": ["P1427", "P1425"]}, {"id": "P1427", "text": ["Remember El and Ec are 180\u00ba out of phase and effectively cancel giving you Ea across the resistor.", "out of phase and effectively cancel giving you Ea across the resistor."], "jumps": ["P1430", "P1426"]}, {"id": "P1430", "text": ["Now, let's look at these resonant circuit characteristics.", "Now, let's look at these resonant circuit characteristics..", "- Voltage drop across R - Total Current - Total Impedance C, GND, AC - AC CH1 Volt/Div - 5 CH2 Volt/Div - 5 Time/Div - 5 msec"], "jumps": ["P1440", "P1427"]}, {"id": "P1440", "text": ["The best way to observe these characteristics is to construct a graph. The graph illustrates the effect of frequency on circuit values."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["Let's measure and graph the voltage drop across the resistor of circuit A, R1."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["1.  Remove CH1 and CH2 probes and return the oscilloscope              controls to display CH1 only.\n2.  Ensure that S1 is to the right on PC130-18A. \n3.  Ensure that the output of the function generator is 5 Vpp at             50.4 kHz as measured at TP14 on PC130-18A.", "1. Remove CH1 and CH2 probes and return the oscilloscope controls to display CH1 only. 2. Ensure that S1 is to the right on PC130-18A. 3. Ensure that the output of the function generator is 5 Vpp at 50.4 kHz as measured at TP14 on PC130-18A."], "jumps": ["P1470", "P1440", "P1465"]}, {"id": "P1465", "text": ["MEASUREMENT SETUP - Remove CH1 & CH2 oscilloscope probes, display CH1 only. S1 to the right (power applied) Function Generator connected to TP14"], "jumps": ["P1467"]}, {"id": "P1467", "text": ["MEASUREMENT SETUP - Frequency - 5.4 Range - 10 k Output - 5 Vpp Function - sine wave"], "jumps": ["P1460", "P1465"]}, {"id": "P1470", "text": ["4.  Connect CH1 probe to TP4 on PC130-18A. This measures the        voltage drop across R1.", "4. Connect CH1 probe to TP4 on PC130-18A. This measures the voltage drop across R1."], "jumps": ["P1480", "P1460", "P1475"]}, {"id": "P1475", "text": ["MEASUREMENT SETUP - CH1 probe to TP4."], "jumps": []}, {"id": "P1480", "text": ["Notice that the voltage drop is approximately 3.5 Vpp. On the graph a dot is place at the intersection of 3.5 V and 50 kHz."], "jumps": ["P1490", "P1470"]}, {"id": "P1490", "text": ["5.  Lower the frequency of function generator to 40 kHz.", "5. Lower the frequency of function generator to 40 kHz....", "NOTE Each time the function generators frequency is changed, check the voltage at TP14 for 5 Vpp. Adjust the output of the function generator if necessary. Be sure to return the CH1 probe back to TP4....."], "jumps": ["P1500", "P1480"]}, {"id": "P1500", "text": ["Notice that R1's voltage drop decreased to approximately \n1.3 Vpp.", "Notice that R1's voltage drop decreased to approximately 1.3 Vpp."], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["6.  Raise frequency of the function generator to 60 kHz.  Check          Ea at TP14.  Notice Er1 is approximately 1.6 Vpp.", "6. Raise frequency of the function generator to 60 kHz. Check Ea at TP14. Notice Er1 is approximately 1.6 Vpp."], "jumps": ["P1520", "P1500"]}, {"id": "P1520", "text": ["7.  Lower frequency of the function generator to 30 kHz.  Check         Ea at TP14.  Notice Er1 is approximately .6 Vpp.", "7. Lower frequency of the function generator to 30 kHz. Check Ea at TP14. Notice Er1 is approximately .6 Vpp."], "jumps": ["P1530", "P1500"]}, {"id": "P1530", "text": ["8.  Raise frequency of the function generator to 70 kHz.  Check           Ea at TP14.  Notice Er1 is approximately .9 Vpp.", "8. Raise frequency of the function generator to 70 kHz. Check Ea at TP14. Notice Er1 is approximately .9 Vpp."], "jumps": ["P1540", "P1500"]}, {"id": "P1540", "text": ["9.  Lower frequency of the function generator to 20 kHz. Check           Ea at TP14.  Notice Er1 is approximately .3Vpp.", "9. Lower frequency of the function generator to 20 kHz. Check Ea at TP14. Notice Er1 is approximately .3Vpp."], "jumps": ["P1550", "P1500"]}, {"id": "P1550", "text": ["10.  Raise frequency of the function generator to 80 kHz.  Check           Ea at TP14.  Notice Er1 is approximately .7 Vpp.", "10. Raise frequency of the function generator to 80 kHz. Check Ea at TP14. Notice Er1 is approximately .7 Vpp...."], "jumps": ["P1560", "P1500"]}, {"id": "P1560", "text": ["11.   Lower frequency of the function generator to 10 kHz.  Check          Ea at TP14. Notice Er1 is approximately .14 Vpp.", "11. Lower frequency of the function generator to 10 kHz. Check Ea at TP14. Notice Er1 is approximately .14 Vpp.."], "jumps": ["P1570", "P1500"]}, {"id": "P1570", "text": ["12.   Raise frequency of the function generator to 90 kHz.  Check           Ea at  TP14.  Notice Er1 is approximately .5 Vpp.", "12. Raise frequency of the function generator to 90 kHz. Check Ea at TP14. Notice Er1 is approximately .5 Vpp."], "jumps": ["P1580", "P1500"]}, {"id": "P1580", "text": ["Connecting the dots graphically illustrates that the voltage drop across R is maximum at resonance."], "jumps": ["P1590", "P1500"]}, {"id": "P1590", "text": ["Total circuit current can also be illustrated by a graph. Remember, current is the same in all points in a series circuit."], "jumps": ["P1600", "P1500"]}, {"id": "P1600", "text": ["The current through R1 equals the voltage across R1 divided by the resistance. Dividing Er1 by 100 gives total current."], "jumps": ["P1610", "P1590"]}, {"id": "P1610", "text": ["The graph vividly illustrates that total current is maximum at resonance."], "jumps": ["P1620", "P1600"]}, {"id": "P1620", "text": ["Total circuit impedance can also be illustrated by a graph. Remember Zt equals Ea divided by It."], "jumps": ["P1630", "P1600"]}, {"id": "P1630", "text": ["Dividing total current (from the current graph) into 5 Vpp gives total impedance."], "jumps": ["P1640", "P1620"]}, {"id": "P1640", "text": ["The graph graphically illustrates that total impedance is minimum at resonance."], "jumps": ["P1650", "P1630"]}, {"id": "P1650", "text": ["These graphs are important and will be used again in your studies of circuits called reactive filters."], "jumps": ["P1660", "P1630"]}, {"id": "P1660", "text": ["1.  Return the Test Console controls to the initial control settings.", "1. Return the Test Console controls to the initial control settings......."], "jumps": ["P1650"]}, {"id": "P1670", "text": ["2.  Set the Test Console Power to OFF.", "2. Set the Test Console Power to OFF.F...................."], "jumps": ["P1660"]}, {"id": "P1680", "text": ["3.  Disconnect and turn off all test equipment.\n4.  Carefully remove PC130-18A card. \n5.  Return all equipment to its proper storage area.", "3. Disconnect and turn off all test equipment. 4. Carefully remove PC130-18A card. 5. Return all equipment to its proper storage area........................."], "jumps": ["P1910", "P1670"]}, {"id": "P1910", "text": ["This completes the experiment on SERIES RESONANT OPERATION.", "This completes the experiment on SERIES RESONANT OPERATION.."], "jumps": ["P1680"]}, {"id": "P13020", "text": ["The purpose of this experiment is to demonstrate the normal operation of LCR resonant circuits."], "jumps": ["P13040"]}, {"id": "P13040", "text": ["Pick up the PC130-18A card. This card is used to demonstrate the operation of LCR series resonant circuits."], "jumps": ["P13050", "P13020"]}, {"id": "P13050", "text": ["Compare the card with the schematic shown."], "jumps": ["P13060", "P13040"]}, {"id": "P13060", "text": ["Notice that there are four LCR series circuits. S1, S2, S3, and S4 are used to select the circuit."], "jumps": ["P13070", "P13040"]}, {"id": "P13070", "text": ["On the PC card, when a switch is to the left the circuit is open.  When a switch is to the right, power is applied.", "On the PC card, when a switch is to the left the circuit is open. When a switch is to the right, power is applied."], "jumps": ["P13080", "P13040"]}, {"id": "P13080", "text": ["In this experiment you will use circuit A only. Circuits B, C, and D operate the same, only the values are different. Let's start the experiment."], "jumps": ["P13090", "P13040"]}, {"id": "P13090", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P13040"]}, {"id": "P13100", "text": ["2.  Carefully plug PC130-18A into the Test Console PC1 position.  3.  Place S1, S2, S3, and S4 to the left.", "2. Carefully plug PC130-18A into the Test Console PC1 position. 3. Place S1, S2, S3, and S4 to the left."], "jumps": ["P13110", "P13105"]}, {"id": "P13105", "text": ["MEASUREMENT SETUP - S1, S2, S3, and S4 to the left (open)."], "jumps": []}, {"id": "P13110", "text": ["4.  Connect the function generator output to the Test Consoles           INPUT BNC.", "4. Connect the function generator output to the Test Consoles INPUT BNC.."], "jumps": ["P13120", "P13100", "P13115"]}, {"id": "P13115", "text": ["BNC CONNECTION - Connect the Function Generator's Main Output BNC to the Test Console's Input Signal BNC."], "jumps": ["Pr", "P7"]}, {"id": "P13120", "text": ["5.  Set up the oscilloscope to measure AC signals and zero the           trace.", "5. Set up the oscilloscope to measure AC signals and zero the trace."], "jumps": ["P13130", "P13110", "P13125"]}, {"id": "P13125", "text": ["Center Trace at least 5 divisions above trace", "OSCILLOSCOPE SETUP - Trigger - CH1, AC, + Display Mode - CH1 CH1 - AC", "K, HK_,,_K,_K'',EK,,,,,'_,KEKZ;;XK98JO9[N=9N@N99U,,K,,EK", "'_K_'K'',K' QUK_,''KK}0;KK,KK__',K'K_K''KK'K_", "'_K_'KK',K_,,'_'',K,K', F;__KK,K, TK,,__,''KKK'", ",KK,,E:9 POOHPPP=70=07PUHP^UOOU=YOVP=PPPPOOPXOOOOXH9UO95P0P===TXZOOU1NIIPPPHPVGH5PSOPZXXOK;E", "a5T 55:s5 m5 ts55Tt T--|57s- Fss y 5 -VVFs5m--FFFmm5FFs---t-t t-| -s-ymV sGFt--ss5-", "7mty-5m--F-s- mVs t --FFy5V-|-F smst Vm--5sVt T-", ",,K;A:'K,57VGO;EEEOa>2OK9)1UE; VPKEE,'KK__K'KK'KKKKK'K_',_", "K';;_KE,KKKKE,KEEK,EKEEE OKKK-RL0;;E,;A ?PU;a", ";U;U;;UU;;;;;KEUW>< E__,K,K,',;_KKK,EKKK", "(O;KKK;;K,'EUEE;90H7Q55H5m5=V0T0HT5T=QHP=H5 TT=U;,,E__,_,K,'"], "jumps": ["PK", "PU77OK", "PO", "P", "PKKKKKK", "PEEE", "PA"]}, {"id": "P13130", "text": ["6. Connect the CH1 probe to TP14 on PC130-18A. 7. Adjust the output of the function generator for 5 Vpp 10 kHz sine wave as measured on PC130-18A TP14. 8. Adjust the TIME/DIV control as necessary to view at least two full cycles............."], "jumps": ["P13140", "P13120", "P13135"]}, {"id": "P13135", "text": [], "jumps": ["P13137"]}, {"id": "P13137", "text": ["MEASUREMENT SETUP - Frequency - 1 Range - 10 k Output - 5 Vpp Function - sine wave"], "jumps": ["P13130", "P13135"]}, {"id": "P13140", "text": ["The experiment is now set up. First we will calculate the resonant frequency of circuit A."], "jumps": ["P13150", "P13130"]}, {"id": "P13150", "text": ["1.  Calculate the resonant frequency of circuit A. What is the                resonant frequency? Round your answer to one decimal                place.", "1. Calculate the resonant frequency of circuit A. What is the resonant frequency? Round your answer to one decimal place."], "jumps": ["P13140", "P13155", "P13152"]}, {"id": "P13151", "text": [], "jumps": []}, {"id": "P13152", "text": ["Your calculations are incorrect. Ensure that you are using the formula and that you are taking the square root of powers of ten correctly."], "jumps": []}, {"id": "P13153", "text": ["Your calculations are still incorrect. You should have calculated approximately 50.4 kHz.", "1 1", "o = = 2p LC 2p (2.5 x 10-3)(.004 x 10-6) 1 1 = = = .504 x 105 2p .1 x 10-10 6.28 (.32 x 10-5) = 50.4 kHz"], "jumps": ["P13150"]}, {"id": "P13155", "text": ["RESONANT FREQUENCY - To calculate resonant frequency use this formula:"], "jumps": []}, {"id": "P13160", "text": ["Now, let's measure the resonant frequency of circuit A and compare it to the calculated value."], "jumps": ["P13170", "P13150"]}, {"id": "P13170", "text": ["To measure the resonant frequency, measure the voltage drop across the resistor, R1, and adjust the function generators frequency until Er1 is maximum. Remember, Er is maximum in a LCR series circuit at resonance."], "jumps": ["P13180", "P13160"]}, {"id": "P13180", "text": ["1.  Set switch S1 on PC130-18A to the right. This applies power           to circuit A.\n2.  Connect the oscilloscopes CH1 probe to TP4 on PC130-18A.          This measures the voltage across R1.", "1. Set switch S1 on PC130-18A to the right. This applies power to circuit A. 2. Connect the oscilloscopes CH1 probe to TP4 on PC130-18A. This measures the voltage across R1.", "MEASUREMENT SETUP - CH1 probe to TP4 S1 to the right (power applied)"], "jumps": ["P13190", "P13170", "P13185"]}, {"id": "P13190", "text": ["3.   Adjust the frequency of the function generator until the                    voltage drop across R1 is maximum as measured by the                 oscilloscope. Adjust the Time/Div control as necessary.", "3. Adjust the frequency of the function generator until the voltage drop across R1 is maximum as measured by the oscilloscope. Adjust the Time/Div control as necessary.", "NOTE Do not adjust the function generator below 10 kHz or above 100 kHz. - 5 CH2 Volt/Div - 5 Time/Div - 5 msec"], "jumps": ["P13200", "P13180"]}, {"id": "P13200", "text": ["Once Er1 is maximum, the frequency indicated on the function generator is the resonant frequency. What is the measured resonant frequency of circuit A?"], "jumps": ["P13190", "P13202"]}, {"id": "P13201", "text": [], "jumps": []}, {"id": "P13202", "text": ["Your measured frequency is incorrect. Ensure that the voltage drop across R1 is maximum and that you are reading the frequency of the function generator correctly."], "jumps": []}, {"id": "P13203", "text": ["Your measured frequency is still incorrect. You should have measured approximately 50 kHz \u00b110%.", "Your measured frequency is still incorrect. You should have measured approximately 50 kHz"], "jumps": ["P13200"]}, {"id": "P13210", "text": ["Notice that your calculated frequency and the measured frequency are within \u00b110% of each other.", "Notice that your calculated frequency and the measured frequency are within"], "jumps": ["P13220", "P13200"]}, {"id": "P13220", "text": ["The LCR circuit is operating normally at resonance."], "jumps": ["P13230", "P13210"]}, {"id": "P13230", "text": ["Before observing the characteristics of a resonant series circuit, there are two points to bring out.", "1) Effect of low impedance on test equipment. 2) Resistance of the coil in an inductor."], "jumps": ["P13240", "P13210"]}, {"id": "P13240", "text": ["The first point, effect of low impedance on test equipment, may reduce the output voltage of the function generator. This effect is easily seen using the oscilloscope."], "jumps": ["P13250", "P13230", "P13245"]}, {"id": "P13245", "text": ["ly the value of R as the impedance. For circuit", "LOW IMPEDANCE AT RESONANCE - At resonance, XL and XC cancel leaving only the value of R as the impedance. For circuit A at resonance impedance equals 100 W."], "jumps": []}, {"id": "P13250", "text": ["1.  Set the frequency of the function generator to 10 kHz.\n2.  Ensure switch S1 on PC130-18A is set to the right. \n3.  Connect the oscilloscope to TP14 on PC130-18A.", "1. Set the frequency of the function generator to 10 kHz. 2. Ensure switch S1 on PC130-18A is set to the right. 3. Connect the oscilloscope to TP14 on PC130-18A.", "MEASUREMENT SETUP - S1 to the right (power applied) CH1 probe to TP14."], "jumps": ["P13260", "P13240", "P13255", "P13257"]}, {"id": "P13257", "text": ["MEASUREMENT SETUP - Frequency - 1 Range - 10 k Output - 5 Vpp Function - sine wave"], "jumps": ["P13250", "P13255"]}, {"id": "P13260", "text": ["4.  Adjust the output voltage of the function generator to 5 Vpp.\n5.  Slowly increase the frequency of the function generator from        10 kHz to 90 kHz and observe the amplitude of the output               signal on the oscilloscope. Adjust the TIME/DIV control as              necessary.", "4. Adjust the output voltage of the function generator to 5 Vpp. 5. Slowly increase the frequency of the function generator from 10 kHz to 90 kHz and observe the amplitude of the output signal on the oscilloscope. Adjust the TIME/DIV control as necessary."], "jumps": ["P13270", "P13250"]}, {"id": "P13270", "text": ["If the type of function generator you are using is sensitive to low  impedance, you will notice that the output voltage of the generator is lower between 40 and 50 kHz.", "If the type of function generator you are using is sensitive to low impedance, you will notice that the output voltage of the generator is lower between 40 and 50 kHz.", "Display - Add CH1 and CH2 DC, GND, AC - AC CH1 Volt/Div - 5 CH2 Volt/Div - 5 Time/Div - 5 msec"], "jumps": ["P13280", "P13260"]}, {"id": "P13280", "text": ["The effect is due to the output impedance of the function generator, normally 50 W, supplying voltage to a 100 W circuit that is at resonance."], "jumps": ["P13290", "P13270"]}, {"id": "P13290", "text": ["The second point, resistance of the coil in an inductor, causes the voltage drop across the series resistor NOT to EQUAL the applied voltage at resonance. This is also easily seen on the oscilloscope.", "The second point, resistance of the coil in an inductor, causes the voltage drop across the series resistor NOT to EQUAL the applied voltage at resonance. This is also easily seen on the oscilloscope..."], "jumps": ["P13300", "P13280"]}, {"id": "P13300", "text": ["1. Set the output frequency of the function generator to resonance for circuit A, 50.4 kHz. 2. Ensure that the CH1 probe of the oscilloscope is still connected to TP14 on PC130-18A. 3. Adjust the output voltage of the function generator to 5 Vpp..."], "jumps": ["P13310", "P13290", "P13305"]}, {"id": "P13305", "text": ["MEASUREMENT SETUP - S1 to the right (power applied) CH1 probe to TP14"], "jumps": ["P13307"]}, {"id": "P13307", "text": ["MEASUREMENT SETUP - Frequency - 5.4 Range - 10 k Output - 5 Vpp Function - sine wave"], "jumps": ["P13300", "P13305"]}, {"id": "P13310", "text": ["4.  Connect the CH1 probe to TP4 on PC130-18A. This measures        the voltage drop across R1. Notice that the peak to peak                  voltage measurement is not 5 V as it should be for a LCR                series resonant circuit.", "4. Connect the CH1 probe to TP4 on PC130-18A. This measures the voltage drop across R1. Notice that the peak to peak voltage measurement is not 5 V as it should be for a LCR series resonant circuit......"], "jumps": ["P13320", "P13300", "P13315"]}, {"id": "P13315", "text": [], "jumps": []}, {"id": "P13320", "text": ["The effect is due to the construction of inductors, the wire coil has resistance. This resistance is like a resistors resistance, it does not change with frequency."], "jumps": ["P13330", "P13310"]}, {"id": "P13330", "text": ["The resistance of inductors is small, between 10 to 150 W. However,  compared to R1 at 100 W, the effect of the coil resistance is seen at resonance.", "The resistance of inductors is small, between 10 to 150 W. However, compared to R1 at 100 W, the effect of the coil resistance is seen at resonance."], "jumps": ["P13340", "P13320"]}, {"id": "P13340", "text": ["In both effects, if the resistance of R1 is increased, say to 2 kW,  the effects of low impedance on test equipment and on R1's voltage drop is reduced.", "In both effects, if the resistance of R1 is increased, say to 2 kW, the effects of low impedance on test equipment and on R1's voltage drop is reduced."], "jumps": ["P13350", "P13330"]}, {"id": "P13350", "text": ["Keeping these two points in mind, let's observe the characteristics of a series resonant circuit. Let's first look at voltage magnification."], "jumps": ["P13360", "P13330"]}, {"id": "P13360", "text": ["1.  Ensure that the function generator is set to 50.4 kHz at 5 Vpp         as measured at TP14 on PC130-18A.", "1. Ensure that the function generator is set to 50.4 kHz at 5 Vpp as measured at TP14 on PC130-18A."], "jumps": ["P13370", "P13350", "P13365"]}, {"id": "P13365", "text": ["MEASUREMENT SETUP - S1 to the right (power applied) CH1 probe to TP14"], "jumps": ["P13367"]}, {"id": "P13367", "text": ["MEASUREMENT SETUP - Frequency - 5.4 Range - 10 k Output - 5 Vpp Function - sine wave"], "jumps": ["P13360", "P13365"]}, {"id": "P13370", "text": ["2.  Remove the CH1 probe from TP14. \n3.  Set up the oscilloscope as follows:  \n4.  Invert the CH2 input.", "2. Remove the CH1 probe from TP14. 3. Set up the oscilloscope as follows: 4. Invert the CH2 input.", "Display - Add CH1 and CH2 DC, GND, AC - AC CH1 Volt/Div - 5 CH2 Volt/Div - 5 Time/Div - 5 msec"], "jumps": ["P13380", "P13360", "P13375"]}, {"id": "P13375", "text": ["OSCILLOSCOPE SETUP Time/Div - 5 msec Display Mode - ADD Sweep Mode - AUTO CH1 Volts/Div - 5 Trigger - CH1, AC, + CH2 Volts/Div - 5 CH1 - AC CH2 - ACCCCCCCC", "Center Trace at least 5 divisions above trace", "K, HK_,,_K,_K'',EK,,,,,'_,KEKZ;;XK98JO9[N=9N@N99U,,K,,EK", "'_K_'K'',K' QUK_,''KK}0;KK,KK__',K'K_K''KK'K_", "'_K_'KK',K_,,'_'',K,K', F;__KK,K, TK,,__,''KKK'", ",KK,,E:9 POOHPPP=70=07PUHP^UOOU=YOVP=PPPPOOPXOOOOXH9UO95P0P===TXZOOU1NIIPPPHPVGH5PSOPZXXOK;E", "a5T 55:s5 m5 ts55Tt T--|57s- Fss y 5 -VVFs5m--FFFmm5FFs---t-t t-| -s-ymV sGFt--ss5-", "7mty-5m--F-s- mVs t --FFy5V-|-F smst Vm--5sVt T-", ",,K;A:'K,57VGO;EEEOa>2OK9)1UE; VPKEE,'KK__K'KK'KKKKK'K_',_", "K';;_KE,KKKKE,KEEK,EKEEE OKKK-RL0;;E,;A ?PU;a", ";U;U;;UU;;;;;KEUW>< E__,K,K,',;_KKK,EKKK", "(O;KKK;;K,'EUEE;90H7Q55H5m5=V0T0HT5T=QHP=H5 TT=U;,,E__,_,K,'"], "jumps": ["PK", "PU77OK", "PO", "P", "PKKKKKK", "PEEE", "PA"]}, {"id": "P13380", "text": ["5.  Ensure that S1 is to the right on PC130-18A.\n6.  Place CH1 probe to TP2 on PC130-18A.  \n7.  Place CH2 probe to TP3 on PC130-18A.", "5. Ensure that S1 is to the right on PC130-18A. 6. Place CH1 probe to TP2 on PC130-18A. 7. Place CH2 probe to TP3 on PC130-18A.", "MEASUREMENT SETUP - CH1 probe to TP2 CH2 probe to TP3"], "jumps": ["P13390", "P13370", "P13385"]}, {"id": "P13390", "text": ["The display on the oscilloscope illustrates the peak to peak voltage across capacitor C1. Notice that it is approximately 24 Vpp. Remember, there is only 5 Vpp applied, this is voltage magnification."], "jumps": ["P13400", "P13380", "P13395"]}, {"id": "P13395", "text": ["VOLTAGE DROP ACROSS C1 - Voltage drop across C1 is displayed by adding CH1 to the inverted CH2 input of the oscilloscope. CH1 input is the voltage on the left side of C1. CH2 input is the voltage on the right side of C1. Subtracting the CH2 voltage from the CH1 voltage results in the voltage across C1."], "jumps": []}, {"id": "P13400", "text": ["8.  Move the CH2 probe to TP4 on PC130-18A.\n9.  Move the CH1 probe to TP3 on PC130-18A.", "8. Move the CH2 probe to TP4 on PC130-18A. 9. Move the CH1 probe to TP3 on PC130-18A...", "MEASUREMENT SETUP - CH1 probe to TP3 CH2 probe to TP4"], "jumps": ["P13410", "P13390", "P13405"]}, {"id": "P13410", "text": ["The display on the oscilloscope illustrates the peak to peak voltage across inductor L1.  Notice that it is approximately 25 Vpp.  Remember there is only 5 Vpp applied, this is voltage magnification.", "The display on the oscilloscope illustrates the peak to peak voltage across inductor L1. Notice that it is approximately 25 Vpp. Remember there is only 5 Vpp applied, this is voltage magnification."], "jumps": ["P13420", "P13400"]}, {"id": "P13420", "text": ["Also notice that the voltage is a little higher across the inductor (at resonance, El and Ec should be equal). The difference is due to the voltage drop of the coil."], "jumps": ["P13425", "P13410"]}, {"id": "P13425", "text": ["The reason El and Ec exceed Ea is because in the first half cycle, the magnetic field of the inductor stores the energy of the discharging capacitor, which adds to Ea."], "jumps": ["P13426", "P13420"]}, {"id": "P13426", "text": ["In the second half cycle, the stored energy in the inductor charges the capacitor, this again adds to Ea. Because of this, both El and Ec are Higher than Ea."], "jumps": ["P13427", "P13425"]}, {"id": "P13427", "text": ["Remember El and Ec are 180\u00ba out of phase and effectively cancel giving you Ea across the resistor.", "out of phase and effectively cancel giving you Ea across the resistor."], "jumps": ["P13430", "P13426"]}, {"id": "P13430", "text": ["Now, let's look at these resonant circuit characteristics.", "Now, let's look at these resonant circuit characteristics..", "- Voltage drop across R - Total Current - Total Impedance C, GND, AC - AC CH1 Volt/Div - 5 CH2 Volt/Div - 5 Time/Div - 5 msec"], "jumps": ["P13440", "P13427"]}, {"id": "P13440", "text": ["The best way to observe these characteristics is to construct a graph. The graph illustrates the effect of frequency on circuit values."], "jumps": ["P13450", "P13430"]}, {"id": "P13450", "text": ["Let's measure and graph the voltage drop across the resistor of circuit A, R1."], "jumps": ["P13460", "P13440"]}, {"id": "P13460", "text": ["1.  Remove CH1 and CH2 probes and return the oscilloscope             controls to display CH1 only. \n2.  Ensure that S1 is to the right on PC130-18A. \n3.  Ensure that the output of the function generator is 5 Vpp at            50.4 kHz as measured at TP14 on PC130-18A.", "1. Remove CH1 and CH2 probes and return the oscilloscope controls to display CH1 only. 2. Ensure that S1 is to the right on PC130-18A. 3. Ensure that the output of the function generator is 5 Vpp at 50.4 kHz as measured at TP14 on PC130-18A."], "jumps": ["P13470", "P13440", "P13465"]}, {"id": "P13465", "text": ["MEASUREMENT SETUP - Remove CH1 & CH2 oscilloscope probes, display CH1 only. S1 to the right (power applied) Function Generator connected to TP14"], "jumps": ["P13467"]}, {"id": "P13467", "text": ["MEASUREMENT SETUP - Frequency - 5.4 Range - 10 k Output - 5 Vpp Function - sine wave"], "jumps": ["P13460", "P13465"]}, {"id": "P13470", "text": ["4.  Connect CH1 probe to TP4 on PC130-18A. This measures the        voltage  drop across R1.", "4. Connect CH1 probe to TP4 on PC130-18A. This measures the voltage drop across R1."], "jumps": ["P13480", "P13460", "P13475"]}, {"id": "P13475", "text": [], "jumps": []}, {"id": "P13480", "text": ["Notice that the voltage drop is approximately 3.5 Vpp. On the graph a dot is place at the intersection of 3.5 V and 50 kHz."], "jumps": ["P13490", "P13470"]}, {"id": "P13490", "text": ["5.  Lower the frequency of function generator to 40 kHz.", "5. Lower the frequency of function generator to 40 kHz....", "NOTE Each time the function generators frequency is changed, check the voltage at TP14 for 5 Vpp. Adjust the output of the function generator if necessary. Be sure to return the CH1 probe back to TP4....."], "jumps": ["P13500", "P13480"]}, {"id": "P13500", "text": ["Notice that R1's voltage drop decreased to approximately\n1.3 Vpp.", "Notice that R1's voltage drop decreased to approximately 1.3 Vpp.."], "jumps": ["P13510", "P13490"]}, {"id": "P13510", "text": ["6.  Raise frequency of the function generator to 60 kHz. Check           Ea at TP14. Notice Er1 is approximately 1.6 Vpp.", "6. Raise frequency of the function generator to 60 kHz. Check Ea at TP14. Notice Er1 is approximately 1.6 Vpp..."], "jumps": ["P13520", "P13500"]}, {"id": "P13520", "text": ["7.  Lower frequency of the function generator to 30 kHz. Check          Ea at TP14. Notice Er1 is approximately .6 Vpp.", "7. Lower frequency of the function generator to 30 kHz. Check Ea at TP14. Notice Er1 is approximately .6 Vpp.."], "jumps": ["P13530", "P13500"]}, {"id": "P13530", "text": ["8.  Raise frequency of the function generator to 70 kHz. Check           Ea at  TP14. Notice Er1 is approximately .9 Vpp.", "8. Raise frequency of the function generator to 70 kHz. Check Ea at TP14. Notice Er1 is approximately .9 Vpp...."], "jumps": ["P13540", "P13500"]}, {"id": "P13540", "text": ["9.  Lower frequency of the function generator to 20 kHz. Check          Ea at TP14. Notice Er1 is approximately .3Vpp.", "9. Lower frequency of the function generator to 20 kHz. Check Ea at TP14. Notice Er1 is approximately .3Vpp."], "jumps": ["P13550", "P13500"]}, {"id": "P13550", "text": ["10.  Raise frequency of the function generator to 80 kHz. Check            Ea at TP14. Notice Er1 is approximately .7 Vpp.", "10. Raise frequency of the function generator to 80 kHz. Check Ea at TP14. Notice Er1 is approximately .7 Vpp."], "jumps": ["P13560", "P13500"]}, {"id": "P13560", "text": ["11.  Lower frequency of the function generator to 10 kHz. Check           Ea at  TP14. Notice Er1 is approximately .14 Vpp.", "11. Lower frequency of the function generator to 10 kHz. Check Ea at TP14. Notice Er1 is approximately .14 Vpp."], "jumps": ["P13570", "P13500"]}, {"id": "P13570", "text": ["12.   Raise frequency of the function generator to 90 kHz. Check            Ea at TP14. Notice Er1 is approximately .5 Vpp.", "12. Raise frequency of the function generator to 90 kHz. Check Ea at TP14. Notice Er1 is approximately .5 Vpp."], "jumps": ["P13580", "P13500"]}, {"id": "P13580", "text": ["Connecting the dots graphically illustrates that the voltage drop  across R is maximum at resonance.", "Connecting the dots graphically illustrates that the voltage drop across R is maximum at resonance."], "jumps": ["P13590", "P13500"]}, {"id": "P13590", "text": ["Total circuit current can also be illustrated by a graph. Remember, current is the same in all points in a series circuit."], "jumps": ["P13600", "P13500"]}, {"id": "P13600", "text": ["The current through R1 equals the voltage across R1 divided by the resistance. Dividing Er1 by 100 gives total current."], "jumps": ["P13610", "P13590"]}, {"id": "P13610", "text": ["The graph vividly illustrates that total current is maximum at resonance."], "jumps": ["P13620", "P13600"]}, {"id": "P13620", "text": ["Total circuit impedance can also be illustrated by a graph. Remember Zt equals Ea divided by It."], "jumps": ["P13630", "P13600"]}, {"id": "P13630", "text": ["Dividing total current (from the current graph) into 5 Vpp gives total impedance."], "jumps": ["P13640", "P13620"]}, {"id": "P13640", "text": ["The graph graphically illustrates that total impedance is minimum at resonance."], "jumps": ["P13650", "P13630"]}, {"id": "P13650", "text": ["These graphs are important and will be used again in your studies of circuits called reactive filters."], "jumps": ["P13630"]}, {"id": "P13670", "text": ["1.  Set the Test Console Power to OFF.", "1. Set the Test Console Power to OFF.F.FF................................."], "jumps": []}, {"id": "P13680", "text": ["2.  Disconnect and turn off all test equipment.\n3.  Carefully remove PC130-18A card. \n4.  Return all equipment to its proper storage area.", "2. Disconnect and turn off all test equipment. 3. Carefully remove PC130-18A card. 4. Return all equipment to its proper storage area."], "jumps": ["P13910", "P13670"]}, {"id": "P13910", "text": ["This completes the experiment on SERIES RESONANT OPERATION.", "This completes the experiment on SERIES RESONANT OPERATION.."], "jumps": ["P13680"]}, {"id": "P10250", "text": ["A score of 100% indicates that the student has completed this lesson on Series Resonant Circuits. During this lesson the student used the PC130-18A experiment card, a function generator and an oscilloscope. The following behaviors identify the expected outcomes: * Calculate and measure the resonant frequency in a LCR let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
