 constant into two constants, n1 and n2.   n1 is the  refraction index for the first medium and n2 is the refraction index for the second medium.", "Snell's law can be manipulated to result in an additional equivalent equation. This additional equation breaks up the original constant into two constants, n1 and n2. n1 is the refraction index for the first medium and n2 is the refraction index for the second medium."], "jumps": ["P1330", "P1300"]}, {"id": "P1340", "text": ["An interesting phenomenon occurs when light travels through a high refractive index medium and reaches the boundary of a low refractive index medium at a steep angle.  Let's use the example of shining a beam of light through a cube of zinc crown glass into the surrounding air.", "An interesting phenomenon occurs when light travels through a high refractive index medium and reaches the boundary of a low refractive index medium at a steep angle. Let's use the example of shining a beam of light through a cube of zinc crown glass into the surrounding air.", "Light Source Light Beam Glass Cube", "Refractive Index Values Zinc Crown Glass 1.53 Air (Dry, 1 atm) 1.003"], "jumps": ["P1350", "P1300"]}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: INTRODUCTION TO FIBER OPTICSfasfd asdf asdf sadf"], "jumps": []}, {"id": "P1300", "text": ["The ray that travels away from the point of incidence through the new medium is called the refracted ray.  The angle created by the  refracted ray and the normal line is called the angle of refraction,  labeled f in this example.", "The ray that travels away from the point of incidence through the new medium is called the refracted ray. The angle created by the refracted ray and the normal line is called the angle of refraction, labeled f in this example."], "jumps": ["P1310", "P1290"]}, {"id": "P1284", "text": ["The law of reflection states that the angle of reflectance is equal to the angle of incidence.  This means that if we know the angle at which a ray strikes a reflective medium then we can predict the angle at which the ray will reflect.", "The law of reflection states that the angle of reflectance is equal to the angle of incidence. This means that if we know the angle at which a ray strikes a reflective medium then we can predict the angle at which the ray will reflect.", "Law of Reflectance qincidence = qreflectance"], "jumps": ["P1290", "P1280"]}, {"id": "P1310", "text": ["The law of refraction is called Snell's law.  This law states that the ratio of the sine of the angle of incidence to the sine of the    angle of refraction equals a constant.", "The law of refraction is called Snell's law. This law states that the ratio of the sine of the angle of incidence to the sine of the angle of refraction equals a constant."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["Snell's law can be manipulated to result in an additional equivalent equation.  This additional equation breaks up the original constant into two constants, n1 and n2.  n1 is the  refraction index for the first medium and n2 is the refraction index for the second medium.", "Snell's law can be manipulated to result in an additional equivalent equation. This additional equation breaks up the original constant into two constants, n1 and n2. n1 is the refraction index for the first medium and n2 is the refraction index for the second medium."], "jumps": ["P1330", "P1300"]}, {"id": "P1381", "text": [], "jumps": []}, {"id": "P1260", "text": ["Reflected light may scatter or maintain a unidirectional beam. The object's composition and surface texture as well as the angle of the light beam will determine how the light reflects off the surface."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["Light signals move through a fiber optic cable by reflecting off the cable's inner surface.  Fiber optic systems are concerned with how the light reflects within the cable.  Maintaining a unidirectional beam and understanding reflection angles are important for preserving the signal's integrity.", "Light signals move through a fiber optic cable by reflecting off the cable's inner surface. Fiber optic systems are concerned with how the light reflects within the cable. Maintaining a unidirectional beam and understanding reflection angles are important for preserving the signal's integrity."], "jumps": ["P1280", "P1260"]}, {"id": "P1325", "text": ["MEDIUM INDEX Air (Dry, 1 atm) 1.0003 Water (Distilled) 1.33 Ethyl Alcohol 1.36 Magnesium Fluoride 1.39 Fused Silica 1.46 Glycerol 1.47 Zinc Crowned Glass 1.53 Crystal Quartz 1.55 Optical Glass 1.50 - 1.80 Sapphire 1.77 Diamond 2.42 1.77 Diamond 2.42", "Refractive Index Values of some mediums with Wavelengths near 500 nm INDEX Air (Dry, 1 atm) 1.0003 Water (Distilled) 1.33 Ethyl Alcohol 1.36 Magnesium Fluoride 1.39 Fused Silica 1.46 Glycerol 1.47 Zinc Crowned Glass 1.53 Crystal Quartz 1.55 Optical Glass 1.50 - 1.80 Sapphire 1.77 Diamond 2.42", "REFRACTION INDEX - Different mediums have a different affect on the speed of light and, therefore, the refraction of light. The refraction index is a number that comes from the ratio of the speed of light in a vacuum to the speed of light in a certain medium."], "jumps": ["P1322"]}, {"id": "P1282", "text": ["A ray traveling away from the boundary is called a reflected ray. The angle created by a reflected ray and the normal line is    called the angle of reflectance, labeled r in this example.", "A ray traveling away from the boundary is called a reflected ray. The angle created by a reflected ray and the normal line is called the angle of reflectance, labeled r in this example."], "jumps": ["P1284", "P1280"]}, {"id": "P1230", "text": ["If most of the ray reflects, we say that the medium reflects light.  If most of the ray refracts, we say the medium transmits light or      allows light to pass through it.  For example, a mirror reflects        light, a prism refracts light, and clear water both reflects and       refracts light.", "If most of the ray reflects, we say that the medium reflects light. If most of the ray refracts, we say the medium transmits light or allows light to pass through it. For example, a mirror reflects light, a prism refracts light, and clear water both reflects and refracts light."], "jumps": ["P1240", "P1220"]}, {"id": "P1360", "text": ["What actually happens is the light is reflected back into the high refractive index medium. This phenomenon is called total internal reflection and is the basis of operation for light moving through a fiber optic cable."], "jumps": ["P1370", "P1340"]}, {"id": "P1371", "text": [], "jumps": []}, {"id": "P1173", "text": ["An proton is not a single bit of light energy.  A proton has mass, a positive charge, and is found in the nucleus of an atom.", "An proton is not a single bit of light energy. A proton has mass, a positive charge, and is found in the nucleus of an atom."], "jumps": []}, {"id": "P1240", "text": ["In addition to reflection and refraction, all materials absorb some light.  However, some of the ray is still reflected and refracted       even if the material seems to absorb all the light and appears dark.", "In addition to reflection and refraction, all materials absorb some light. However, some of the ray is still reflected and refracted even if the material seems to absorb all the light and appears dark."], "jumps": ["P1250", "P1220"]}, {"id": "P1250", "text": ["The operation of a fiber optic system depends upon the reflection, refraction, and absorption of light.  Let's take a closer look at reflection.", "The operation of a fiber optic system depends upon the reflection, refraction, and absorption of light. Let's take a closer look at reflection."], "jumps": ["P1260", "P1220"]}, {"id": "P2960", "text": ["5.   Fiber optic systems, like anything else, have advantages and        disadvantages.  Under most circumstances, the advantages          of a fiber optic system far outweigh the disadvantages.", "5. Fiber optic systems, like anything else, have advantages and disadvantages. Under most circumstances, the advantages of a fiber optic system far outweigh the disadvantages.", "Advantages 1. Fiber optic transmission mediums have much larger information carrying capacity than any other medium. 2. Low Signal Loss 3. The small size fiver optic cables are beneficial applications where space is at a premium. 4. Fiber optic cables are light weight with a high information carrying capacity. 5. Optical fibers do not radiate nor pick up electromagnetic radiation unlike copper wires. 6. Security Tapping a fiber is possible only by tampering with individual fibers and is likely to be detectable. 7. System Flexibilityyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy", "Limitations 1. Difficulty of handling some fiber optic cables. 2. Low efficiency and low power of optical sources. 3. Nonlinearity of optical sources and detectors limit analog applications. 4. Need for additional wires in a cable when interfacing with electrical supplies."], "jumps": ["P2999", "P2950"]}, {"id": "P1170", "text": ["A single bit of light energy is called _______", "A single bit of light energy is called _______............."], "jumps": ["P1160"]}, {"id": "P1220", "text": ["Light is understood to travel in straight lines called rays.  Some of the ray reflects and some refracts when the ray reaches the boundary between two different mediums.", "Light containing a single color is called monochromatic light and light containing two or more colors is called polychromatic light.  Different colors of light may also result by combining different       wavelengths.  The resultant light may appear to be made of one color but it is really polychromatic.", "Light is understood to travel in straight lines called rays. Some of the ray reflects and some refracts when the ray reaches the boundary between two different mediums.", "Light containing a single color is called monochromatic light and light containing two or more colors is called polychromatic light. Different colors of light may also result by combining different wavelengths. The resultant light may appear to be made of one color but it is really polychromatic."], "jumps": ["P1230", "P1180"]}, {"id": "P1070", "text": ["Light both reflects and refracts when it encounters water.   A person in a boat sees the light reflecting off the water's surface,    but the light also passes through the water at an angle.", "Light both reflects and refracts when it encounters water. A person in a boat sees the light reflecting off the water's surface, but the light also passes through the water at an angle."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["We recognize all these characteristics of light, but what exactly is light?  Is it a stream of particles or a visible wave?  How is light produced?  Let's learn the answers.", "We recognize all these characteristics of light, but what exactly is light? Is it a stream of particles or a visible wave? How is light produced? Let's learn the answers.", "separates into the different wavelengths that make up the light. Each wavelength appears as a different color. We see sunlight as white, yet it really contains all colors."], "jumps": ["P1090", "P1040"]}, {"id": "P1280", "text": ["A ray traveling from the source toward the boundary is called an incident ray.  The angle created by an incident ray and the line       normal to the point of incidence is called the angle of incidence,   labeled i in this example.", "A ray traveling from the source toward the boundary is called an incident ray. The angle created by an incident ray and the line normal to the point of incidence is called the angle of incidence, labeled i in this example."], "jumps": ["P1282", "P1260"]}, {"id": "P340", "text": [], "jumps": []}, {"id": "P1090", "text": ["Two different theories described light's physical composition until this century. One theory stated that light was a particle stream. The other stated that light was a wave which transferred energy without transporting matter, like a sound wave. Each theory became the primary belief during different historical periods."], "jumps": ["P1100", "P1040"]}, {"id": "P301", "text": [], "jumps": ["P400", "P300"]}, {"id": "P1105", "text": ["10-12 10-11 10-10 10-9 10-8 10-7 10-6 10-5 10-4 10-3 10-2 10-1 1 10 102 103 104 105 106 107 108 109 1010 1011 1012", "ELECTROMAGNETIC RADIATION - Electromagnetic radiation is a combination of electrical and magnetic waves which travel at right angles to each other."], "jumps": ["P1102"]}, {"id": "P1140", "text": ["This extra energy is absorbed by the electrons and allows them to jump to a higher orbit.  The electrons release the absorbed energy as photons when they return to their normal orbit.", "This extra energy is absorbed by the electrons and allows them to jump to a higher orbit. The electrons release the absorbed energy as photons when they return to their normal orbit."], "jumps": ["P1150", "P1130"]}, {"id": "P410", "text": ["The idea of sending signals with light has been used for centuries.  Sunlight was reflected off a mirror in a certain pattern in order to convey a message.  Information could be transmitted over hundreds of miles using this method.", "The idea of sending signals with light has been used for centuries. Sunlight was reflected off a mirror in a certain pattern in order to convey a message. Information could be transmitted over hundreds of miles using this method."], "jumps": ["P420", "P400"]}, {"id": "P1160", "text": ["Light is ____ let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
