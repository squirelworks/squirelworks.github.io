const book = {"title": "9395B303", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: PCM CIRCUIT TROUBLESHOOTING fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Determine if a PCM transmitter and receiver system is operating correctly. w Identify the faulted component in a malfunctioning PCM transmitter and receiver system.................................."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 488 Multimeter ator XXXXXnt"], "jumps": []}, {"id": "P13032", "text": ["The signal on IC7 pin 6 is correct, output of amplifier.  The amplifier is not faulted.", "The signal on IC7 pin 6 is correct, output of amplifier. The amplifier is not faulted."], "jumps": []}, {"id": "P13060", "text": ["The computer will now remove the fault.  Check the output of the receiver on PC130-327 TP11 and verify the PCM system is operating correctly.", "The computer will now remove the fault. Check the output of the receiver on PC130-327 TP11 and verify the PCM system is operating correctly."], "jumps": ["P13044"]}, {"id": "P340", "text": [], "jumps": []}, {"id": "P341", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will troubleshoot faults in a PCM transmitter and receiver system."], "jumps": ["P410", "P301"]}, {"id": "P410", "text": ["Troubleshooting PCM systems is not difficult due to the use of digital chips."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Measuring the input and output signals of a chip determines if the chip is faulted. That's all there is to it!"], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["However, due to the vast number of chips used in a PCM system, and the few discrete components used, you need a plan in order to isolate a problem in a circuit."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["After the fault has been isolated to the transmitter or receiver, and then isolated to a particular circuit, you can then use all       your previously learned digital troubleshooting techniques to        identify the failed chip or component.", "After the fault has been isolated to the transmitter or receiver, and then isolated to a particular circuit, you can then use all your previously learned digital troubleshooting techniques to identify the failed chip or component."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["Let's begin the lesson on PCM CIRCUIT TROUBLESHOOTING....................."], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1020", "text": ["In this experiment, you will locate the failed chip or component in a PCM transmitter and receiver system."], "jumps": ["P1040", "P1001"]}, {"id": "P1040", "text": ["The transmitter is located on the PC130-326 card.", "The transmitter is located on the PC130-326 card...........", "Parallel-In Serial-out Shift RegisterrrrrrrrrrrrrRegister", "Output Multiplexer Multiplexer Output Multiplexer r"], "jumps": ["P1050", "P1020", "P1045"]}, {"id": "P1050", "text": ["The transmitter consists of amplifier, A/D converter, P/S converter, Output Multiplexer and Timer/Sync Bit Generator circuits."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["The receiver is located on the PC130-327 card.", "The receiver is located on the PC130-327 card.............."], "jumps": ["P1070", "P1040", "P1065"]}, {"id": "P1070", "text": ["The receiver consists of amplifiers, S/P converter, D/A converter, Sync Bit Detector and Timing circuits."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["To locate a faulted chip, you must first determine if the PCM system is operating correctly."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["This is accomplished by making one simple oscilloscope measurement.  Measure the input to the transmitter and the output of the receiver.", "This is accomplished by making one simple oscilloscope measurement. Measure the input to the transmitter and the output of the receiver."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["If the output signal matches the input signal, the PCM system is operating correctly."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["If you do not have a good signal on the output of the receiver, the system is faulted."], "jumps": ["P1120", "P1080"]}, {"id": "P1120", "text": ["Once you have determined that the PCM system is not operating correctly, you must then isolate the fault to either the transmitter, transmission medium or receiver."], "jumps": ["P1130", "P1080"]}, {"id": "P1130", "text": ["This is accomplished by making two simple oscilloscope measurements."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["First, measure the output of the transmitter."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["If a PCM signal is present, the transmitter circuit must be operating correctly."], "jumps": ["P1160", "P1120"]}, {"id": "P1160", "text": ["If the PCM signal is not present, the transmitter is faulted."], "jumps": ["P1170", "P1120"]}, {"id": "P1170", "text": ["Second, measure the input to the receiver.  You already know that the receiver has a bad output or you would not be troubleshooting the system.", "Second, measure the input to the receiver. You already know that the receiver has a bad output or you would not be troubleshooting the system."], "jumps": ["P1180", "P1120"]}, {"id": "P1180", "text": ["If an attenuated PCM signal is not present on the input, the fault is in the transmission medium."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["If an attenuated PCM signal is present on the output, the fault is in the receiver."], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["If the fault is in the transmission medium, checking out the antenna or transmission cables will normally locate the failure."], "jumps": ["P1210", "P1170"]}, {"id": "P1210", "text": ["If the fault is in the transmitter, oscilloscope measurements will isolate the fault to circuit.", "Parallel-In Serial-out Shift RegisterrrrrrrrrrrrrRegister", "Output Multiplexer Multiplexer Output Multiplexer r"], "jumps": ["P1220", "P1170"]}, {"id": "P1220", "text": ["If the fault is in the receiver, oscilloscope measurements will isolate the fault to a circuit."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["Once the circuit has been located, further oscilloscope or multimeter measurements will locate the fault to a particular chip  or component.  Let's start the experiment.", "PC130-326 SCHEMATIC - Transmitter", "Once the circuit has been located, further oscilloscope or multimeter measurements will locate the fault to a particular chip or component. Let's start the experiment."], "jumps": ["P1240", "P1220", "P1235", "P1236", "P1230"]}, {"id": "P1240", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P1230"]}, {"id": "P1250", "text": ["2.  Place PC130-326 into the test console PC2 position. \n3.  Place PC130-284 into the test console PC3 position.", "2. Place PC130-326 into the test console PC2 position. 3. Place PC130-284 into the test console PC3 position. 3 Speaker switch to ON........................................."], "jumps": ["P1240"]}, {"id": "P1270", "text": ["4.  Set the Positive Supply Control to 15.\n5.  Set the Negative Supply Control to 15.  The Voltmeter on the          130A should indicate 15 volts.", "4. Set the Positive Supply Control to 15. 5. Set the Negative Supply Control to 15. The Voltmeter on the 130A should indicate 15 volts."], "jumps": ["P1250"]}, {"id": "P1280", "text": ["6.  On PC130-326, set switches S1 to DC and S2 to READOUT. \n7.  On PC130-284, set switch S1 to 15.", "6. On PC130-326, set switches S1 to DC and S2 to READOUT. 7. On PC130-284, set switch S1 to 15."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["8.  Connect the 8 pin ribbon cable (twisted) from J1 on \n     PC130 - 326 to J1 on PC130-284.  Ensure that the top wire               from PC130-326 connects to the bottom connector on PC130-       284.", "8. Connect the 8 pin ribbon cable (twisted) from J1 on PC130 - 326 to J1 on PC130-284. Ensure that the top wire from PC130-326 connects to the bottom connector on PC130- 284."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["9.  Connect the MAIN output of the function generator to the                 PC1 OUTPUT BNC.\n10.  On the function generator, set the controls as follows:", "9. Connect the MAIN output of the function generator to the PC1 OUTPUT BNC. 10. On the function generator, set the controls as follows: OUT b. FUNCTION switches - all OUT c. SYM control - disabled, pushed in d. TRIGGER PHASE - fully CW e. DC OFFSET - enabled, pulled out", "a. RANGE switches - all out b. FUNCTION switches - all out c. SYM control - disabled, pushed in d. TRIGGER PHASE - fully CW e. DC OFFSET - enabled, pulled outdemodulator. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor.", "FUNCTION GENERATOR - SYM - disabled, pushed IN Range - all OUT Function - all OUT DC offset - enabled, pulled OUT Trigger Phase - fully CW"], "jumps": ["P1310", "P1290", "P1305"]}, {"id": "P1310", "text": ["11.  Place PC2 and PC3 DC Power switches to ON.", "11. Place PC2 and PC3 DC Power switches to ON.130A - Set the PC1 DC Switch to ON...."], "jumps": ["P1300"]}, {"id": "P1320", "text": ["12.  Using a frequency counter if available (if not use an                           oscilloscope), adjust R7 on PC130-326 for a 180 kHz 1 kHz             signal at the FRAME CLOCK TP.  If frequency is 0 Hz, turn               PC2 POWER OFF and back ON.  Note that the Nida 440                    function generator has a built in frequency counter.", "12. Using a frequency counter if available (if not use an oscilloscope), adjust R7 on PC130-326 for a 180 kHz 1 kHz signal at the FRAME CLOCK TP. If frequency is 0 Hz, turn PC2 POWER OFF and back ON. Note that the Nida 440 function generator has a built in frequency counter."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["13.  Using a digital voltmeter, adjust the DC OFFSET control on             the function generator for a +10.00 volt measurement on                  PC130-326 INPUT TP.", "13. Using a digital voltmeter, adjust the DC OFFSET control on the function generator for a +10.00 volt measurement on PC130-326 INPUT TP."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["14.  Adjust PC130-326 R10 fully CCW.  The LED display on                     PC130-284 should indicate 00000000.", "14. Adjust PC130-326 R10 fully CCW. The LED display on PC130-284 should indicate 00000000."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["15.  Slowly adjust PC130-326 R10 CW until the LEDs on PC130-            284 JUST indicate 11111111.  Adjusting R10 past where the            display just indicates 11111111 will saturate the A/D                          converter.  Analog input voltages less than 10 volts would              then cause a 11111111 output.", "15. Slowly adjust PC130-326 R10 CW until the LEDs on PC130- 284 JUST indicate 11111111. Adjusting R10 past where the display just indicates 11111111 will saturate the A/D converter. Analog input voltages less than 10 volts would then cause a 11111111 output."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["16.  Place PC2 and PC3 DC Power switches to OFF.  The PCM              transmitter is now set up and aligned for analog                                 information signals from 0 Hz to 10 kHz at levels up to 10                Vpp.", "16. Place PC2 and PC3 DC Power switches to OFF. The PCM transmitter is now set up and aligned for analog information signals from 0 Hz to 10 kHz at levels up to 10 Vpp."], "jumps": ["P1350"]}, {"id": "P1370", "text": ["17.  Remove the 8 pin ribbon cable (twisted) between PC130-326         and PC130-284.                                                        \n18.  Remove PC130-284 from the PC3 position.", "17. Remove the 8 pin ribbon cable (twisted) between PC130-326 and PC130-284. 18. Remove PC130-284 from the PC3 position."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["19.  Install PC130-327 into the PC3 position.", "19. Install PC130-327 into the PC3 position..............."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["20.  On PC130-326, set switch S2 to OUTPUT and adjust R14 to             mid position.                                                       \n21.  On PC130-327, set switch S1 to DC/AC.", "20. On PC130-326, set switch S2 to OUTPUT and adjust R14 to mid position. 21. On PC130-327, set switch S1 to DC/AC."], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["22.  Place PC2 and PC3 DC Power switches to ON.  The PCM                 transmitter and receiver are now set up.  The transmitter is              aligned but the receiver is not.", "22. Place PC2 and PC3 DC Power switches to ON. The PCM transmitter and receiver are now set up. The transmitter is aligned but the receiver is not."], "jumps": ["P1390"]}, {"id": "P1410", "text": ["23. Using a frequency counter if available (if not use an oscilloscope), adjust R7 on PC130-327 for a 180 kHz signal at the RxCLOCK TP. If frequency is 0 Hz on PC130-326 or PC130-327, turn PC2/PC3 Power OFF and then ON. Note that the Nida 440 function generator has a built in frequency counter."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["24.  On the oscilloscope, set the controls as follows:", "24. On the oscilloscope, set the controls as follows: lt/Div CH1 and CH2 - as needed b. Time/Div - 2 s c. Triggering - EXT, AC, -(negative) d. Display - dual", "a. Volt/Div CH1 and CH2 - as needed b. Time/Div - 2 y s c. Triggering - EXT, AC, -(negative) d. Display - dual - dual r. C. That you constructed the AM demodulator circuit correctly. D. Last, see your instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor."], "jumps": ["P1430", "P1410", "P1425"]}, {"id": "P1425", "text": ["OSCILLOSCOPE SETUP - Volt/Div CH1- as needed Triggering - AC Volt/Div CH2 - as needed Display - dual Triggering - Negative Time/Div - 2 s Triggering - EXT"], "jumps": []}, {"id": "P1430", "text": ["25.  Connect the external trigger of the oscilloscope to the SYNC          TP on PC130-326 - THE MODULATOR CARD IN THE PC2                POSITION.             \n26.  Connect CH1 to TP2 on PC130-327.\n27.  Adjust the DC OFFSET of the function generator fully CCW.", "25. Connect the external trigger of the oscilloscope to the SYNC TP on PC130-326 - THE MODULATOR CARD IN THE PC2 POSITION. 26. Connect CH1 to TP2 on PC130-327. 27. Adjust the DC OFFSET of the function generator fully CCW."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["28.  Adjust the Time/Div variable control to display one complete           frame from the transmitter card.", "28. Adjust the Time/Div variable control to display one complete frame from the transmitter card."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["29.  Adjust the DC OFFSET control on the function generator so           that there is one HIGH pulse in the center of the oscilloscope         display with a LOW pulse followed by a HIGH pulse on each           side.", "29. Adjust the DC OFFSET control on the function generator so that there is one HIGH pulse in the center of the oscilloscope display with a LOW pulse followed by a HIGH pulse on each side."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["30.  Connect the CH2 probe to TP5 on PC130-327.", "30. Connect the CH2 probe to TP5 on PC130-327............."], "jumps": ["P1470", "P1450"]}, {"id": "P1470", "text": ["31.  While viewing the CH2 waveform, adjust PC130-327 R4 for a           +5 volt narrow pulse on the trailing edge of the SYNC pulse            (CH1) as shown.", "31. While viewing the CH2 waveform, adjust PC130-327 R4 for a +5 volt narrow pulse on the trailing edge of the SYNC pulse (CH1) as shown."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["32.  Connect the CH2 probe to TP4 on PC130-327.\n33.  Using the alligator to alligator jumper, short the +5V TP to                TP3 (TEST) on PC130-327.", "32. Connect the CH2 probe to TP4 on PC130-327. 33. Using the alligator to alligator jumper, short the +5V TP to TP3 (TEST) on PC130-327."], "jumps": ["P1490", "P1470"]}, {"id": "P1490", "text": ["34.  While viewing the CH2 waveform, adjust PC130-327 R5 so no         pulse is present on the trailing edge of the SYNC pulse (CH1)         as shown.", "34. While viewing the CH2 waveform, adjust PC130-327 R5 so no pulse is present on the trailing edge of the SYNC pulse (CH1) as shown."], "jumps": ["P1500", "P1480"]}, {"id": "P1500", "text": ["35.  Remove the jumper between the +5V TP and TP3 on PC130-           327. \n36.  Connect the CH2 probe to TP6 (SYNC) on PC130-327.", "35. Remove the jumper between the +5V TP and TP3 on PC130- 327. 36. Connect the CH2 probe to TP6 (SYNC) on PC130-327."], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["37.  While viewing the CH2 waveform, adjust PC130-327 R6 so               that there is only pulse as close as possible to the trailing               edge of  the SYNC pulse (CH1) as shown.", "37. While viewing the CH2 waveform, adjust PC130-327 R6 so that there is only pulse as close as possible to the trailing edge of the SYNC pulse (CH1) as shown."], "jumps": ["P1520", "P1500"]}, {"id": "P1520", "text": ["38.  While observing the CH2 trace on the oscilloscope, vary the           DC OFFSET control on the function generator to produce               data sets from 00000000 to 11111111.", "38. While observing the CH2 trace on the oscilloscope, vary the DC OFFSET control on the function generator to produce data sets from 00000000 to 11111111."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["Did one and only one sync bit remain in the correct position for each different data set?"], "jumps": ["P1520"]}, {"id": "P1531", "text": [], "jumps": []}, {"id": "P1532", "text": ["The adjustments to the sync bit detector are not completely correct.  You must repeat the procedure, it may take two or three attempts.  If you can not align the detector after three times, see your instructor.", "The adjustments to the sync bit detector are not completely correct. You must repeat the procedure, it may take two or three attempts. If you can not align the detector after three times, see your instructor. (GRAPHICS TEXT) Touch to go back to the beginning of the sync bit detector alignment. Touching will take you back to the question but, if the sync bit detector is not aligned correctly, you will not get satisfactory results in the rest of the experiment.", "Touch to go back to the beginning of the sync bit detector alignment. Touching will take you back to the question but, if the sync bit detector is not aligned correctly, you will not get satisfactory results in the rest of the experiment. instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor."], "jumps": ["P1530", "P1450"]}, {"id": "P1540", "text": ["The sync bit detector and timing circuit are operating correctly."], "jumps": ["P1550", "P1530"]}, {"id": "P1550", "text": ["39.  Connect a digital voltmeter to the INPUT TP on PC130-326. 40.  Adjust the OFFSET control on the function generator for a              +10.0 reading at the INPUT TP on PC130-326.", "39. Connect a digital voltmeter to the INPUT TP on PC130-326. 40. Adjust the OFFSET control on the function generator for a +10.0 reading at the INPUT TP on PC130-326."], "jumps": ["P1560", "P1540"]}, {"id": "P1560", "text": ["41.  Connect the oscilloscope, CH1 set to measure DC using                  CH1 triggering, to TP9 on PC130-327.\n42.  Adjust R9 for as close to +10.00 volts as you can.  If signal is           not a DC level as viewed, slightly vary the level control, R14,           on PC130-326.", "41. Connect the oscilloscope, CH1 set to measure DC using CH1 triggering, to TP9 on PC130-327. 42. Adjust R9 for as close to +10.00 volts as you can. If signal is not a DC level as viewed, slightly vary the level control, R14, on PC130-326.............."], "jumps": ["P1570", "P1550"]}, {"id": "P1570", "text": ["43.  Disconnect the multimeter. \n44.  Connect the CH1 probe to the INPUT TP on PC130-326.          45.  Connect the CH2 probe to TP11 on PC130-327.", "43. Disconnect the multimeter. 44. Connect the CH1 probe to the INPUT TP on PC130-326. 45. Connect the CH2 probe to TP11 on PC130-327."], "jumps": ["P1580", "P1560"]}, {"id": "P1580", "text": ["46.  Vary the DC output voltage from the function generator.  You         are viewing the analog input signal to the PCM modulator,              CH1, and the analog output signal of the PCM demodulator,           CH2.  They should be changing together.", "46. Vary the DC output voltage from the function generator. You are viewing the analog input signal to the PCM modulator, CH1, and the analog output signal of the PCM demodulator, CH2. They should be changing together."], "jumps": ["P1590", "P1570"]}, {"id": "P1590", "text": ["The PCM system is operating correctly, changing analog to digital, changing parallel to serial, transmitting PCM, receiving PCM, changing serial to parallel and changing digital to analog."], "jumps": ["P1600", "P1580"]}, {"id": "P1600", "text": ["During the troubleshooting of the PCM system, you could use DC input voltages to check out the system.  However, this would require calculations such as:", "During the troubleshooting of the PCM system, you could use DC input voltages to check out the system. However, this would require calculations such as: * Quantization level * Quantization level voltage spacing * Levels for the DC input voltage * Converting to binary", "* Quantization level * Quantization level voltage spacing * Levels for the DC input voltage * Converting to binaryo the question but, if the sync bit detector is not aligned correctly, you will not get satisfactory results in the rest of the experiment. instructor.tructor.ur instructor.r instructor.llator begins to oscillate. E. Last, see your instructor."], "jumps": ["P1610", "P1590"]}, {"id": "P1610", "text": ["A better method is to input an AC signal that will produce a recognizable pattern in the PCM data.  In this way, just looking at  the PCM signal will indicate that the system is operating correctly.", "A better method is to input an AC signal that will produce a recognizable pattern in the PCM data. In this way, just looking at the PCM signal will indicate that the system is operating correctly."], "jumps": ["P1620", "P1600"]}, {"id": "P1620", "text": ["This is the method that you will use.  You will input a low frequency triangle waveform.  The PCM data should then appear to count up from 00000000 to 11111111 on the raising portion and count down from 11111111 to 00000000 on the failing portion of the triangle wave.", "This is the method that you will use. You will input a low frequency triangle waveform. The PCM data should then appear to count up from 00000000 to 11111111 on the raising portion and count down from 11111111 to 00000000 on the failing portion of the triangle wave."], "jumps": ["P1630", "P1610"]}, {"id": "P1630", "text": ["1.  Place S1 on PC130-326 to AC.\n2.  Select the triangle output of the function generator.               \n3.  Select 1 Hz output frequency from the function generator.         4.  Set the output amplitude of the function generator to 10 Vpp           from 0 V to +10 V as seen on CH1, use the DC offset.", "1. Place S1 on PC130-326 to AC. 2. Select the triangle output of the function generator. 3. Select 1 Hz output frequency from the function generator. 4. Set the output amplitude of the function generator to 10 Vpp from 0 V to +10 V as seen on CH1, use the DC offset."], "jumps": ["P1640", "P1620"]}, {"id": "P1640", "text": ["The information output signal of the receiver should be the same as the information input signal to the transmitter."], "jumps": ["P1650", "P1630"]}, {"id": "P1650", "text": ["5.  Move the CH1 probe to the PC130-326 OUTPUT TP. \n6.  Move the CH2 probe to the PC130-327 INPUT TP.", "5. Move the CH1 probe to the PC130-326 OUTPUT TP. 6. Move the CH2 probe to the PC130-327 INPUT TP."], "jumps": ["P1660", "P1640"]}, {"id": "P1660", "text": ["7.  Use external triggering for the oscilloscope from the PC                  130-  326 SYNC TP.  You should be viewing the PCM data.               Notice that it is counting up and counting down.  This is a               quick way to determine if the transmitter is operating e system.", "Second, measure the input to the receiver. You already know that the receiver has a bad output or you would not be troubleshooting the system."], "jumps": ["P9180", "P9120"]}, {"id": "P9180", "text": ["If an attenuated PCM signal is not present on the input, the fault is in the transmission medium."], "jumps": ["P9190", "P9170"]}, {"id": "P9190", "text": ["If an attenuated PCM signal is present on the output, the fault is in the receiver."], "jumps": ["P9200", "P9170"]}, {"id": "P9200", "text": ["If the fault is in the transmission medium, checking out the antenna or transmission cables will normally locate the failure."], "jumps": ["P9210", "P9170"]}, {"id": "P9210", "text": ["If the fault is in the transmitter, oscilloscope measurements will isolate the fault to circuit.", "Parallel-In Serial-out Shift RegisterrrrrrrrrrrrrRegister", "Output Multiplexer Multiplexer Output Multiplexer r"], "jumps": ["P9220", "P9170"]}, {"id": "P9220", "text": ["If the fault is in the receiver, oscilloscope measurements will isolate the fault to a circuit."], "jumps": ["P9230", "P9210"]}, {"id": "P9230", "text": ["Once the circuit has been located, further oscilloscope or multimeter measurements will locate the fault to a particular chip  or component.  Let's start the experiment.", "Once the circuit has been located, further oscilloscope or multimeter measurements will locate the fault to a particular chip or component. Let's start the experiment."], "jumps": ["P9240", "P9220"]}, {"id": "P9240", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P9230"]}, {"id": "P9250", "text": ["2.  Carefully Plug PC130-326 into the test console PC2 position.\n3.  Carefully Plug PC130-327 into the test console PC3 position.", "4. Press Enter to Set: Positive Supply Voltage to 15.", "2. Carefully Plug PC130-326 into the test console PC2 position. 3. Carefully Plug PC130 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
