: "P410", "text": ["Pulse RADAR systems are divided into two types depending on their use. These two types are Search RADAR and Tracking RADAR.sonal lives in ways ranging from microwave ovens, x ray and weather equipment to police speed detection system..."], "jumps": ["P400", "P420"]}, {"id": "P420", "text": ["RADAR is the extremely critical facet of military weapons systems. RADAR's provide both initial detection and tracking information required to successfully engage an object."], "jumps": ["P410", "P", "PD", "PA", "PAY"]}, {"id": "P430", "text": ["Let's begin the lesson on BASIC RADAR OPERATION..........................."], "jumps": ["P410"]}, {"id": "P1910", "text": ["This completes the experiment on BASIC RADAR OPERATION....."], "jumps": ["P1650", "P1001"]}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1020", "text": ["1. Sweep Generator 2. Video Amplifier 3. Simulated RADAR System Simulated radar system", "This experiment gives you the opportunity to observe the operation of: 1. Radar timing circuit 2. Sweep generator 3. Video amplifier 4. Simulated radar system"], "jumps": ["P1001", "P1030"]}, {"id": "P1030", "text": ["This is a basic RADAR indicator block diagram. RADAR indicator block diagram."], "jumps": ["P1020"]}, {"id": "P1035", "text": ["Refer to the schematic of PC130-231 throughout the remainder of this lesson. The schematic and test point waveforms are available at any time by pressing Ctrl S."], "jumps": ["P1030", "P1040"]}, {"id": "P1040", "text": ["In this experiment you will recognize the RADAR indicator blocks on the PC130-231 experiment card. U3 represents the Synchro Amplifier, Timer, Range Mark Generator, and Video Amplifier. U3 also provides a target generator for simulation purposes."], "jumps": ["P1030"]}, {"id": "P1050", "text": ["In an actual RADAR system a target generator would not be used except, perhaps, in testing the RADAR system. U2 represents the Sweep Generator."], "jumps": ["P1040"]}, {"id": "P1060", "text": ["The PC130-231 card will allow you to simulate a simple A Scan display. This type of display is commonly used in military applications, particularly in weapons control systems. It has the ability of providing the target range as well as the relative strength of a returned echo."], "jumps": ["P1040"]}, {"id": "P1070", "text": ["The most important aspect of any RADAR system is timing. The purpose of the timing section is to synchronize the entire RADAR system. No RADAR can operate properly unless system timing is accurate..."], "jumps": ["P1060"]}, {"id": "P1080", "text": ["The modulator, transmitter, antenna and display must be triggered to ensure that the system is operable."], "jumps": ["P1070"]}, {"id": "P1090", "text": ["Master timing for the circuit is provided by the main timer U3A and associated circuitry. These components form an oscillator. A Schmitt trigger converts a sawtooth waveform into a squarewave. The output from the main timer provides the timing for the other sections that comprise the RADAR simulator..."], "jumps": ["P1080"]}, {"id": "P1100", "text": ["C2 and R2 determine the length of time for the output of the main timer, while U3B inverts the signal to a squarewave pulse. The function of this section is to produce a squarewave output with a fixed width for use as a timing pulse. All other functions in the RADAR simulator are triggered by the leading edge of this pulse..."], "jumps": ["P1090"]}, {"id": "P1110", "text": ["The sweep amplifier (U2) produces a sawtooth waveform that is used to drive the electron beam across the face of the RADAR indicator. The sawtooth wave is based on the charge/discharge time of capacitors C3 and C4..."], "jumps": ["P1090"]}, {"id": "P1120", "text": ["The sawtooth is started by the inverted timing pulse. The low pulse discharges the capacitors. After the pulse, the capacitors are allowed to charge. The charging action of the capacitors are amplified by U2..."], "jumps": ["P1110"]}, {"id": "P1130", "text": ["R9, the ramp adj potentiometer controls the charge rate of the capacitors. The charge rate determines the slope of the sweep."], "jumps": ["P1110"]}, {"id": "P1140", "text": ["A Range Mark Generator and Amplifier produce repetitive marks that appear at fixed distances on the sweep of the indicator. Range marks provide the operator with an indication of distance to the target under surveillance..."], "jumps": ["P1110", "P1150"]}, {"id": "P1150", "text": ["Range marks appear as intensified lines on the face of the CRT. The number of range marks appearing on the Indicator is dependent upon the length or range of the sweep."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["The sweep on a RADAR indicator can represent distances anywhere from 1 mile to 300 miles. As an example, if the sweep represented 20 miles, the range marks may appear every mile or every 5 miles..."], "jumps": ["P1150", "P1170"]}, {"id": "P1170", "text": ["The Range Mark Generator is formed by an oscillator and a counter. The frequency of the oscillator is controlled by the Range Adjust Potentiometer (R10). The counter is reset by the main timer and provides equally spaced output pulses. The pulses, or range marks are applied to the Video Amplifier to be mixed with the rest of the RADAR video."], "jumps": ["P1150", "P1172"]}, {"id": "P1172", "text": ["The Echo Position produces a video pulse that will represent the video returned by a target."], "jumps": ["P1150", "P1180"]}, {"id": "P1180", "text": ["The function of the Video Amplifier is to amplify RADAR video from the receiver, range marks from the Range Mark Generator, and any other video signals that a particular system may require."], "jumps": ["P1190", "P1172"]}, {"id": "P1190", "text": ["U3D inverts the pulse and changes it to a square wave. While R12 is used to simulate the Echo Amplifier."], "jumps": ["P1180", "P1200"]}, {"id": "P1200", "text": ["Diode D3 and capacitor C10 mix the two videos together for application to the display. The resulting A Scan representation is applied to the oscilloscope for viewing."], "jumps": ["P1180", "P1210"]}, {"id": "P1210", "text": ["Refer to the schematic of PC130-231 throughout the remainder of this lesson. The schematic and test point waveforms are available at any time by pressing Ctrl S."], "jumps": ["P1200", "P1220"]}, {"id": "P1220", "text": ["1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P1210"]}, {"id": "P1230", "text": ["2. Carefully plug PC130-231 into the Test Console PC1 position. to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P1220"]}, {"id": "P1240", "text": ["3. Set the Positive Supply Control to 5. Set the Negative Supply Control to 5. The Voltmeter on the 130A should indicate 5 Volts."], "jumps": ["P1230"]}, {"id": "P1250", "text": ["A. Power on B. Trigger input to channel 1 C. Sweep to 0.1 ms/Div D. Connect probe to channel 1 input E. Connect probe to channel 2 input F. Display mode to dual G. Channel input select to DC H. Sweep mode to auto I. Adjust the sweep position to center the trace J. Select channels 1 and 2 Volts/Div to 2V", "4. Adjust the oscilloscope as follows: Power on B. Trigger input to channel 1 C. Sweep to .1 ms/cm D. Connect probe to channel 1 input E. Connect probe to channel 2 input F. Display mode to dual"], "jumps": ["P1240", "P1260"]}, {"id": "P1260", "text": ["5. Set the PC1 DC Switch to ON.ntrol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P1250"]}, {"id": "P1270", "text": ["6. Set echo position (R8), ramp adjust (R9), range adjust (R10), and echo amp (R12) potentiometers mid-range.."], "jumps": []}, {"id": "P1280", "text": ["7. This experiment card uses a Schmitt trigger (U3) for the main timer, Sync System, Range Mark Generator, Video Amplifier and the Echo Position. nnect channel 1 of the oscilloscope to U3, pin 1. PC1 position pin 1 is connected to U3 through pin 1....h pin 1."], "jumps": ["P1270", "P1310"]}, {"id": "P1310", "text": ["8. Connect channel 2 of the oscilloscope to pin 3 of the U3 chip using TP2. Capacitor C2 changes the input waveform to remain at a high signal for a longer duration. Notice the waveform now has a low pulse."], "jumps": ["P1280", "P1320"]}, {"id": "P1320", "text": ["9. Connect channel 1 of the oscilloscope to Pin 4, U3, using TP3. U3B converts the signal into an inverted squarewave pulse. The time interval from the leading edge of the first pulse to the leading edge of the second pulse is the Pulse Repetition Time (PRT) for the RADAR."], "jumps": ["P1310", "P1330", "PRT"]}, {"id": "P1330", "text": ["10. The Sync System pulse is felt at the Sweep Generator, Echo Position and the Range Mark Generator. However, the pulse must be inverted for the Sweep Generator and Echo Position sections. nnect channel 1 of the oscilloscope to U3 pin 10 using TP4. Notice that the signal at TP3 has been inverted by to U3, pin 10, using TP4. Notice that the signal at TP3 has been inverted by U3E."], "jumps": ["P1310", "P1331"]}, {"id": "P1331", "text": ["11. Connect channel 2 of the oscilloscope to U3 Pin 10 using TP4. Notice that the signal from TP3 has been inverted by U3E.in 10, using TP4. Notice that the signal at TP3 has been inverted by U3E...E."], "jumps": ["P1310", "P1340"]}, {"id": "P1340", "text": ["12. The pulse is used to synchronize the discharge of the sweep generator capacitors C3 and C4. Between pulses, the capacitors charge until the low pulse signal occurs, then the capacitors discharge. Connect channel 2 of the oscilloscope to U2, pin 3, using TP5."], "jumps": ["P1310", "P1350"]}, {"id": "P1350", "text": ["13. The sweep sawtooth must be properly adjusted for operation. Observe the sweep sawtooth waveform from the sweep generator by connecting the oscilloscope channel 2 to U2, pin 6, using TP6.P6."], "jumps": ["P1310", "P1360"]}, {"id": "P1360", "text": ["14. While observing the output of the Sweep Generator, adjust the ramp adj R9 until a clean sawtooth waveform with maximum amplitude is formed.."], "jumps": ["P1310", "P1370"]}, {"id": "P1370", "text": ["15. The sync pulse is also utilized at the Echo Position section. The pulse is used to synchronize the discharge of the Echo Position capacitor, C14. Connect channel 2 of the oscilloscope to TP9. ope to TP9 and channel 2 to U3, pin 13, using TP7..."], "jumps": ["P1310", "P1380"]}, {"id": "P1380", "text": ["16. While observing the Echo Position waveform, adjust the Echo Position Potentiometer (R8). After you have observed the waveform and the effect that R8 has on it, return R8 to mid-range.e."], "jumps": ["P1310", "P1410"]}, {"id": "P1410", "text": ["17. Observe how the Video Amplifier inverter affects the waveform. Move channel 2 of the oscilloscope to TP10. While observing the echo at TP10, adjust R12. Leave R12 at mid-range....."], "jumps": ["P1310", "P1420"]}, {"id": "P1420", "text": ["18. While observing the Video Amplifier output at TP10, adjust the Echo Amplifier control, R12 for 2 Vpp. observed the waveform and the effect that R12 has on it, return R12 to mid-range.."], "jumps": ["P1310", "P1430"]}, {"id": "P1430", "text": ["Time/Div - 2 mS Channel 1 Volts/Div - 0.2 Volts Channel 2 Volts/Div - 2 Volts Channel 1 Input - DC Channel 2 Input - DC Display mode - Dual Slope - + Coupling - AC Source - CH1H1H1111H1CH1CH1CH1CH1CH1CH1CH1CH1111", "19. Up till now, you have viewed how the horizontal (X) and vertical (Y) inputs are generated. Next, you will observe the Range Mark Generator. Set the oscilloscope to the following settings:: 1 Volts/Div .2 Volts C. Channel 2 Volts/Div .2 Volts D. Channel 1 Input DC E. Channel 2 Input DC F. Display mode Dual G. Slope + H. Coupling AC I. Source CH11111"], "jumps": ["P1310", "P1440"]}, {"id": "P1440", "text": ["20. Connect channel 1 of the oscilloscope to U3, pin 5, using TP11. Connect channel 2 of the oscilloscope to U3, pin 6, using TP12."], "jumps": ["P1430", "P1450"]}, {"id": "P1450", "text": ["21. While observing channel 1 and 2 of the oscilloscope, adjust the Range Adjust Potentiometer (R10). After you observe the waveforms, connect the counter to TP12 and adjust R10 until the counter reads approximately 300 kHz..z.."], "jumps": ["P1440", "P1460"]}, {"id": "P1460", "text": ["Time/Div - 20 mS Channel 1 Volts/Div - 5 Volts Channel 2 Volts/Div - 5 Volts Channel 1 Input - DC Channel 2 Input - DC Display mode - Dual Slope - + Coupling - AC Source - CH1H1H1111111 CH1 CH1 CH1 CH1 CH1 CH1 CH1 CH1 CH1111", "22. The waveform is then applied to the circuit counter (U1) through the clock input (pin 10). Adjust the oscilloscope as follows::"], "jumps": ["P1440", "P1470"]}, {"id": "P1470", "text": ["23. Connect channel 1 of the oscilloscope to the counter output (U1 pin 2) using TP13. Adjust R10 until the oscilloscope display looks similar to the one shown below."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["24. The signal from the sync system is used to reset the counter and keep the circuit in sync. Connect channel 2 of the oscilloscope to the sync system pulse using TP3."], "jumps": ["P1470", "P1490"]}, {"id": "P1490", "text": ["25. While observing the output of the range mark generator, adjust the range adjust potentiometer (R10). Notice how the waveform is referenced by the reset signal from the sync system..."], "jumps": ["P1500", "P1480"]}, {"id": "P1500", "text": ["Time/Div - X-Y Channel 1 Volts/Div - 50 mV Channel 2 Volts/Div - 50 mV Display mode - X-Y X-Y X-Y X-Y", "26. Now that you have seen the individual sections of the circuit, let's look at the system as a whole. Set the oscilloscope as follows: raphics Text) A. Time/Div X-Y B. Channel 1 Volts/Div 50 mV C. Channel 2 Volts/Div 50 mV D. Display mode X-Y"], "jumps": ["P1490", "P1510"]}, {"id": "P1510", "text": ["27. Connect channel 1 of the oscilloscope to X using TP6. Connect channel 2 of the oscilloscope to Y using TP14."], "jumps": ["P1500", "P1520"]}, {"id": "P1520", "text": ["28. With a BNC to alligator cable, connect the Z-axis input located on the rear of the oscilloscope, to PC130-231, Z output, using TP3."], "jumps": ["P1510", "P1530"]}, {"id": "P1530", "text": ["29. You have just configured the oscilloscope to act as an A Scan RADAR indicator. Your signal should look like the one below. Channel 1 volts/div controls adjust the length of the sweep. Channel 2 volts/div controls the overall amplitude. Target Range Marks 12.36sec"], "jumps": ["P1510", "P1540"]}, {"id": "P1535", "text": ["A. Channel 1 input is TP6 B. Channel 2 input is TP14 C. The oscilloscope Horizontal circuit is set for X-Y. D. Ensure the Volts/Div controls for both channels are set to 50 millivolts. E. Try viewing only channel 2 in the X-Y mode.", "If the display is incorrect, verify the following:........."], "jumps": []}, {"id": "P1540", "text": ["A. Adjust PC130-231 ramp adjust (R9) until the sweep fill the screen horizontally. B. Adjust PC130-231 range adjust (R10) to increase or decrease the distance between the range marks. C. Adjust PC130-231 echo amp (R12) until the target pulse is 3 divisions high. D. Adjust PC130-231 echo position (R8) to move the target on the screen.", "30. The oscilloscope display can be adjusted as described below. mp adjust (R9) until the sweep fill the screen horizontally. B. Adjust PC130-231 range adjust (R10) to increase or decrease the distance between the range marks. C. Adjust PC130-231 echo amp (R12) until the target pulse is 3 divisions high....."], "jumps": ["P1530", "P1550"]}, {"id": "P1550", "text": ["31. While observing the oscilloscope display, adjust PC130-231, echo position (R8), to move the simulated RADAR target across the screen. Notice how it is possible to estimate range by using the range marks as a guide....."], "jumps": ["P1540", "P1560"]}, {"id": "P1560", "text": ["32. The computer will now insert a fault into the simulated RADAR system........... lative strength of a returned echo."], "jumps": ["P13040", "P13070"]}, {"id": "P13070", "text": ["The most important aspect of any RADAR system is timing. The purpose of the timing section is to synchronize the entire RADAR system. No RADAR can operate properly unless system timing is accurate..."], "jumps": ["P13080", "P13060"]}, {"id": "P13080", "text": ["The modulator, transmitter, antenna and display must be triggered to ensure that the system is operable."], "jumps": ["P13070", "P13090"]}, {"id": "P13090", "text": ["Master timing for the circuit is provided by the main timer U3A and associated circuitry. These components form an oscillator. A Schmitt trigger converts a sawtooth waveform into a squarewave. The output from the main timer provides the timing for the other sections that comprise the RADAR simulator..."], "jumps": ["P13100", "P13080"]}, {"id": "P13095", "text": ["SCHMITT TRIGGER - A bistable circuit that converts an input waveform of any shape and amplitude into squarewave pulses of constant amplitude..."], "jumps": []}, {"id": "P13100", "text": ["C2 and R2 determine the length of time for the output of the main timer, while U3B inverts the signal to a squarewave pulse. The function of this section is to produce a squarewave output with a fixed width for use as a timing pulse. All other functions in the RADAR simulator are triggered by the leading edge of this pulse..."], "jumps": ["P13090", "P13110"]}, {"id": "P13110", "text": ["The sweep amplifier (U2) produces a sawtooth waveform that is used to drive the electron beam across the face of the RADAR indicator. The sawtooth wave is based on the charge/discharge time of capacitors C3 and C4..."], "jumps": ["P13120", "P13090"]}, {"id": "P13120", "text": ["The sawtooth is started by the inverted timing pulse. The low pulse discharges the capacitors. After the pulse, the capacitors are allowed to charge. The charging action of the capacitors are amplified by U2..."], "jumps": ["P13110", "P13130"]}, {"id": "P13130", "text": ["R9, the ramp adj potentiometer controls the charge rate of the capacitors. The charge rate determines the slope of the sweep."], "jumps": ["P13110", "P13140"]}, {"id": "P13140", "text": ["A Range Mark Generator and Amplifier produce repetitive marks that appear at fixed distances on the sweep of the Indicator. Range marks provide the operator with an indication of distance to the target under surveillance..."], "jumps": ["P13110", "P13150"]}, {"id": "P13150", "text": ["Range marks appear as intensified lines on the face of the CRT. The number of range marks appearing on the Indicator is dependant upon the length or range of the sweep."], "jumps": ["P13160", "P13140"]}, {"id": "P13160", "text": ["The sweep on a RADAR indicator can represent distances anywhere from 1 mile to 300 miles. As an example, if the sweep represented 20 miles, the range marks may appear every mile or every 5 miles..."], "jumps": ["P13150", "P13170"]}, {"id": "P13170", "text": ["The Range Mark Generator is formed by an oscillator and a counter. The frequency of the oscillator is controlled by the Range Adjust Potentiometer (R10). The counter is reset by the main timer and provides equally spaced output pulses. The pulses, or range marks are applied to the Video Amplifier to be mixed with the rest of the RADAR video....."], "jumps": ["P13150", "P13172"]}, {"id": "P13172", "text": ["The Echo Position produces a video pulse that will represent the video returned by a target."], "jumps": ["P13150", "P13180"]}, {"id": "P13180", "text": ["The function of the Video Amplifier is to amplify RADAR video from the receiver, range marks from the Range Mark Generator, and any other video signals that a particular system may require."], "jumps": ["P13190", "P13172"]}, {"id": "P13190", "text": ["U3D inverts the pulse and changes it to a squarewave.  While R12 is used to simulate the Echo Amplifier.", "U3D inverts the pulse and changes it to a squarewave. While R12 is used to simulate the Echo Amplifier."], "jumps": ["P13180", "P13200"]}, {"id": "P13200", "text": ["Diode D3 and capacitor C10 mix the two videos together for application to the display. The resulting A Scan representation is applied to the oscilloscope for viewing."], "jumps": ["P13180", "P13210"]}, {"id": "P13210", "text": ["Refer to the schematic of PC130-231 throughout the remainder of this lesson. The schematic and test point waveforms are available at any time by pressing Ctrl S."], "jumps": ["P13200", "P13220"]}, {"id": "P13220", "text": ["1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13210"]}, {"id": "P13230", "text": ["2. Carefully plug PC130-231 into the Test Console PC1 position."], "jumps": ["P13240"]}, {"id": "P13240", "text": ["3. Press Enter to Set: Positive & Negative Supply Control - 5............."], "jumps": ["P13230"]}, {"id": "P13250", "text": ["A. Power on B. Trigger input to channel 1 C. Sweep to 0.1 ms/Div D. Connect probe to channel 1 input E. Connect probe to channel 2 input F. Display mode to dual G. Channel input select to DC H. Sweep mode to auto I. Adjust the sweep position to center the trace J. Select channels 1 and 2 Volts/Div to 2V", "4. Adjust the oscilloscope as follows: . Power on B. Trigger input to channel 1 C. Sweep to .1 ms/cm D. Connect probe to channel 1 input E. Connect probe to channel 2 input F. Display mode to dual"], "jumps": ["P13260"]}, {"id": "P13260", "text": ["5. Press Enter to Set: PC1 DC Power Switch - ON..........................."], "jumps": ["P13250"]}, {"id": "P13270", "text": ["6. Set echo position (R8), ramp adjust (R9), range adjust (R10), and echo amp (R12) potentiometers mid-range."], "jumps": []}, {"id": "P13280", "text": ["7. This experiment card uses a Schmitt trigger (U3) for the main timer, Sync System, Range Mark Generator, Video Amplifier and the Echo Position. annel 1 of the oscilloscope to U3, pin 1. PC1 position pin I is connected to U3 through pin 1..."], "jumps": ["P13270", "P13310"]}, {"id": "P13310", "text": ["8. Connect channel 2 of the oscilloscope to pin 3 of the U3 chip using TP2. Capacitor C2 changes the input waveform to remain at a high signal for a longer duration. Notice the waveform now has a low pulse."], "jumps": ["P13280", "P13320"]}, {"id": "P13320", "text": ["9. Connect channel 1 of the oscilloscope to Pin 4, U3, using TP3. U3B converts the signal into an inverted squarewave pulse. The time interval from the leading edge of the first pulse to the leading edge of the second pulse is the Pulse Repetition Time (PRT) for the RADAR.."], "jumps": ["P13310", "P13330", "PRT"]}, {"id": "P13330", "text": ["10. The Sync System pulse is felt at the Sweep Generator, Echo Position and the Range Mark Generator. However, the pulse must be inverted for the Sweep Generator and Echo Position sections. ns. g TP4. Notice that the signal at TP3 has been inverted by to U3, pin 10, using TP4. Notice that the signal at TP3 has been inverted by U3E....."], "jumps": ["P13310", "P13331"]}, {"id": "P13331", "text": ["11. Connect channel 2 of the oscilloscope to U3 Pin 10 using TP4. Notice that the signal from TP3 has been inverted by U3E.10, using TP4. Notice that the signal at TP3 has been inverted by U3E. pin 10 using TP4. Notice that the signal at TP3 has been inverted by to U3, pin 10, using TP4. Notice that the signal at TP3 has been inverted by U3E....."], "jumps": ["P13310", "P13340"]}, {"id": "P13340", "text": ["12. The pulse is used to synchronize the discharge of the sweep generator capacitors C3 and C4. Between pulses, the capacitors charge until the low pulse signal occurs, then the capacitors discharge. Connect channel 2 of the oscilloscope to U2, pin 3, using TP5."], "jumps": ["P13310", "P13350"]}, {"id": "P13350", "text": ["13. The sweep sawtooth must be properly adjusted for operation. Observe the sweep sawtooth waveform from the sweep generator by connecting the oscilloscope channel 2 to U2, pin 6, using TP6."], "jumps": ["P13310", "P13360"]}, {"id": "P13360", "text": ["14. While observing the output of the Sweep Generator, adjust the ramp adj R9 until a clean sawtooth waveform with maximum amplitude is formed.."], "jumps": ["P13310", "P13370"]}, {"id": "P13370", "text": ["15. The sync pulse is also utilized at the Echo Position section. The pulse is used to synchronize the discharge of the Echo Position capacitor, C14. Connect channel 2 of the oscilloscope to TP9. l 2 to U3, pin 13, using TP7.0"], "jumps": ["P13310", "P13380"]}, {"id": "P13380", "text": ["16. While observing the Echo Position waveform, adjust the Echo Position Potentiometer (R8). After you have observed the waveform and the effect that R8 has on it, return R8 to approximately mid-range with at least 2 pulses visible."], "jumps": ["P13410", "P13310"]}, {"id": "P13410", "text": ["17. Observe how the Video Amplifier inverter affects the waveform. Move channel 2 of the oscilloscope to TP10. While observing the echo at TP10, adjust R12. Leave R12 at mid-range.....ut using TP10."], "jumps": ["P13310", "P13420"]}, {"id": "P13420", "text": ["18. While observing the Video Amplifier output at TP10, adjust the Echo Amplifier control, R12 for 2 V. just the echo amp potentiometer (R12). After you have observed the waveform and the effect that R12 has on it, return R12 to mid-range........."], "jumps": ["P13310", "P13430"]}, {"id": "P13430", "text": ["Time/Div - 2 mS Channel 1 Volts/Div - 0.2 Volts Channel 2 Volts/Div - 2 Volts Channel 1 Input - DC Channel 2 Input - DC Display mode - Dual Slope - + Coupling - AC Source - CH1H1H1111H1CH1CH1CH1CH1CH1CH1CH1CH1111", "19. Up till now, you have viewed how the horizontal (X) and vertical (Y) inputs are generated. Next, you will observe the Range Mark Generator. Set the oscilloscope to the following settings::iv .2 Volts C. Channel 2 Volts/Div .2 Volts D. Channel 1 Input DC"], "jumps": ["P13310", "P13440"]}, {"id": "P13440", "text": ["20. Connect channel 1 of the oscilloscope to U3, pin 5, using TP11. Connect channel 2 of the oscilloscope to U3, pin 6, using TP12."], "jumps": ["P13430", "P13450"]}, {"id": "P13450", "text": ["21. While observing channel 1 and 2 of the oscilloscope, adjust the Range Adjust Potentiometer (R10). After you observe the waveforms, connect the counter to TP12 and adjust R10 until the counter reads approximately 300 kHz..................."], "jumps": ["P13440", "P13460"]}, {"id": "P13460", "text": ["Time/Div - 20 mS Channel 1 Volts/Div - 5 Volts Channel 2 Volts/Div - .5 Volts Channel 1 Input - DC Channel 2 Input - DC Display mode - Dual Slope - + Coupling - AC Source - CH11H1 CH1 CH1 CH1 CH1 CH1 CH1 CH1111", "22. The waveform is then applied to the circuit counter (U1) through the clock input (pin 10). Adjust the oscilloscope as follows: l 2 Volts/Div .5 Volts D. Channel 1 Input DC E. Channel 2 Input DC"], "jumps": ["P13440", "P13470"]}, {"id": "P13470", "text": ["23. Connect channel 1 of the oscilloscope to the counter output (U1 pin 2) using TP13. Adjust R10 until the oscilloscope display looks similar to the one shown below."], "jumps": ["P13480", "P13460"]}, {"id": "P13480", "text": ["24. The signal from the sync system is used to reset the counter and keep the circuit in sync. Connect channel 2 of the oscilloscope to the sync system pulse using TP3."], "jumps": ["P13470", "P13490"]}, {"id": "P13490", "text": ["25. While observing the output of the Range Mark Generator, adjust the range adjust potentiometer (R10). Notice how the waveform is referenced by the reset signal from the sync system....."], "jumps": ["P13500", "P13480"]}, {"id": "P13500", "text": ["Time/Div - X-Y Channel 1 Volts/Div - 50 mV Channel 2 Volts/Div - 50 mV Display mode - X-Y X-Y X-Y X-Y", "26. Now that you have seen the individual sections of the circuit, let's look at the system as a whole. Set the oscilloscope as follows: hannel 2 Volts/Div 50 mV D. Display mode X-Y"], "jumps": ["P13490", "P13510"]}, {"id": "P13510", "text": ["27. Connect channel 1 of the oscilloscope to X using TP6. Connect channel 2 of the oscilloscope to Y using TP14."], "jumps": ["P13520", "P13500"]}, {"id": "P13520", "text": ["28. With a BNC to alligator cable, connect the Z-axis input located on the rear of the oscilloscope, to PC130-231, Z output, using TP3."], "jumps": ["P13510", "P13530"]}, {"id": "P13530", "text": ["29. You have just configured the oscilloscope to act as an A Scan RADAR indicator. Your signal should look like the one below. Channel 1 volts/div controls adjust the length of the sweep. Channel 2 volts/div controls the overall amplitude."], "jumps": ["P13510", "P13540"]}, {"id": "P13535", "text": ["A. Channel 1 input is TP6 B. Channel 2 input is TP14 C. The oscilloscope Horizontal circuit is set for X-Y. D. Ensure the Volts/Div controls for both channels are set to 50 millivolts. E. Try viewing only channel 2 in the X-Y mode.", "If the display is incorrect, verify the following:........."], "jumps": []}, {"id": "P13540", "text": ["A. Adjust PC130-231 ramp adjust (R9) until the sweep fill the screen horizontally. B. Adjust PC130-231 range adjust (R10) to increase or decrease the distance between the range marks. C. Adjust PC130-231 echo amp (R12) until the target pulse is 3 divisions high. D. Adjust PC130-231 echo position (R8) to move the target on the screen.", "30. The oscilloscope display can be adjusted as described below. ramp adjust (R9) until the sweep fill the screen horizontally. B. Adjust PC130-231 range adjust (R10) to increase or decrease the distance between the range marks. C. Adjust PC130-231 echo amp (R12) until the target pulse is 3 divisions high..."], "jumps": ["P13530", "P13550"]}, {"id": "P13550", "text": ["31. While observing the oscilloscope display, adjust PC130-231, echo position (R8), to move the simulated RADAR target across the screen. Notice how it is possible to estimate range by using the range marks as a guide."], "jumps": ["P13540", "P13560"]}, {"id": "P13560", "text": ["32. The computer will now insert a fault into the simulated RADAR system..........."], "jumps": ["P13550"]}, {"id": "P13570", "text": ["Echo position not sending correct signal.", "What symptoms are indicated by the RADAR system?..........."], "jumps": []}, {"id": "P13571", "text": [], "jumps": []}, {"id": "P13572", "text": ["There is a fault in the system. Examine the return signal to verify that it is correct."], "jumps": []}, {"id": "P13573", "text": ["Examine the return signal to verify that it is correct....."], "jumps": []}, {"id": "P13580", "text": ["Now that you have established the symptom(s), isolate the problem to a component. What is the faulted component?"], "jumps": ["P13570"]}, {"id": "P13581", "text": [], "jumps": []}, {"id": "P13582", "text": ["This is not the faulted component. Check to see if C9 is good."], "jumps": []}, {"id": "P13590", "text": ["The computer will now remove the fault and insert a new one. What are the symptoms?"], "jumps": ["P13580"]}, {"id": "P13591", "text": [], "jumps": []}, {"id": "P13592", "text": ["You should notice that the range marks are missing........."], "jumps": []}, {"id": "P13600", "text": ["Now that you have established the symptom(s), isolated the problem to the component. What is the faulted component?"], "jumps": []}, {"id": "P13601", "text": [], "jumps": []}, {"id": "P13602", "text": ["Check C10 and R13 to see if they are faulted..............."], "jumps": []}, {"id": "P13610", "text": ["The computer will now remove the fault and insert a new one. What are the symptoms?"], "jumps": ["P13600"]}, {"id": "P13611", "text": [], "jumps": []}, {"id": "P13612", "text": ["You should notice that there is no vertical or horizontal display."], "jumps": []}, {"id": "P13620", "text": ["Now that you have established the symptom(s), isolate the problem to the component. What is the faulted component?"], "jumps": []}, {"id": "P13621", "text": [], "jumps": []}, {"id": "P13622", "text": ["Check C1 and R1 to see if they are faulted................."], "jumps": []}, {"id": "P13640", "text": ["33. Set the Console Power Switch to OFF.F................................."], "jumps": []}, {"id": "P13650", "text": ["34. Disconnect and turn all test equipment off. Return all equipment to the proper storage location."], "jumps": ["P13640", "P13910"]}, {"id": "PINFO", "text": ["09-02-00 Converted from SAM to toolbook. frieda 09-11-00 Text and Branching. frieda 10-11-00 Graphics added. Richard S. 10-18-00 Reviewed - lisa 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Changes to graphics. Alexis 01-14-02 Converted to Phase II format. jay 02-15-02 review - rs 03-04-02 Phil Miller changes (P1040) - lisa 03-05-03 Review - lisa 05-08-02 Changes from phil miller - lisa 09-24-02 changed p1330 graphic from \"1 Nautical mile = 6080 feet = 2026.6 yards/microsecond\" to \"1 Nautical mile = 6080 feet = 2026.6 yards\" per phil miller. frieda 11-01-02 P1020, changed \"distance and direction\" to \"velocity and location\". P1020, 1032, 1035, 1036, 1037, 1610, 1662, 1732, 1733, 2290, and 2870, Flipped graphic so the True Bearing line is going clockwise from True North to Line of sight. - Dino, Penny & GLK 11-05-02 P1200 changed statue to statute. Lydia 11-14-02 P1380 changed pulse repetition rate to pulse repetition time. Lydia", "11-21-03 Converted from 9395TD01 saved as 9395TD02 experiment only - frieda 11-24-03 Made changes to experimant per ray. - patty 11-26-03 Reviewed lesson with trainers and made corrections. frieda 12-03-03 Made corrections to P13172 capitol, P13331 changed text , added 4 more rollover waves to page P5000 -assigned by ray -patty 01-21-04 P13095 added this page to define schmitt trigger. P13380 added \"approximately mid-range with at least 2 pulses visible\" to end of sentence. P13420 removed pp from Vpp. P13460 changed 5 volts to .5 volts in channel 2 oscilloscope list. P13470 changed pulse width in graphic. P13610 changed F110 to F113. frieda 07-14-04 P1910, P13910 added eox - patty", "11-21-03 Converted from 9395TD01 saved as 9395TD02 experiment only - frieda 11-24-03 Made changes to experimant per ray. - patty 11-26-03 Reviewed lesson with trainers and made corrections. frieda 12-03-03 Made corrections to P13172 capitol, P13331 changed text , added 4 more rollover waves to page P5000 -assigned by ray -patty 01-21-04 P13095 added this page to define schmitt trigger. P13380 added \"approximately mid-range with at least 2 pulses visible\" to end of sentence. P13420 removed pp from Vpp. P13460 changed 5 volts to .5 volts in channel 2 oscilloscope list. P13470 changed pulse width in graphic. P13610 changed F110 to F113. frieda"], "jumps": ["P1040"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P13910", "text": ["This completes the experiment on BASIC RADAR OPERATION....."], "jumps": ["P13650", "P1001"]}]};
let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
