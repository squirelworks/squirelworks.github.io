const book = {"title": "93953201", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: INTRODUCTION TO TRANSISTORS fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe the purpose of DC bias in transistors. w Describe NPN transistor bias. w Describe PNP transistor bias.", "w Describe the purpose of a Transistor. w Describe types of transistors. w Identify transistor schematic symbols. w Identify leads on transistors."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["The transistor has revolutionized electronics."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Before the transistor, the computer consisted of thousands of vacuum tubes, costing millions of dollars and filling a large room."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Due to the transistor, the very same computing capability now fits on a desk and costs much less."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["Transistors are solid state devices constructed similar to diodes."], "jumps": ["P435", "P440", "P420"]}, {"id": "P435", "text": ["SOLID STATE DEVICE - A solid state device is an electronic component which operates by the movement of electrons within a solid piece of semiconductor material. Solid state devices replaced vacuum tubes.", "SOLID STATE DEVICE - A solid state device is an electronic component which operates by the movement of charges within a solid piece of semiconductor material. Solid state devices replaced vacuum tubes."], "jumps": []}, {"id": "P440", "text": ["Let's begin the lesson on INTRODUCTION TO TRANSISTORS....................."], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["There are very few circuits that do not use transistors.", "There are very few circuits that do not use transistors...."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Transistors are used as:\n - amplifiers       \n - oscillators  \n - electronic switches", "Transistors are used as: - amplifiers - oscillators - electronic switches sssssssssssssssssssssssss"], "jumps": ["P1040", "P1020"]}, {"id": "P1035", "text": ["OSCILLATOR - An oscillator is a circuit that produces an AC frequency. The function generator uses many oscillators to produce all the outputs that are available for use."], "jumps": ["P1038"]}, {"id": "P1036", "text": ["ELECTRONIC SWITCH - An electronic switch is a circuit that controls the direction of current flow, the same as mechanical switches. Electronic switches are found in many digital circuits."], "jumps": ["P1038"]}, {"id": "P1037", "text": ["AMPLIFIER - Amplifiers are electronic circuits that amplify. Amplify is to increase or provide gain. Recall that transformers step up voltage, but there is no power gain. Amplifiers increase power."], "jumps": ["P1038"]}, {"id": "P1038", "text": ["Transistors are used as: \n - amplifiers       \n - oscillators  \n - electronic switches", "Transistors are used as: - amplifiers - oscillators - electronic switches - electronic switches"], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The purpose of a transistor is to control signals. Transistors control a large signal with a small signal.", "Small signal controls a large signal", "Little force controls a large forcelll", "High Pressureee force a large forcelll"], "jumps": ["P1050", "P1038"]}, {"id": "P1050", "text": ["The word TRANSISTOR is derived from the words TRANSfer and resISTOR. These two words best describe transistor operation."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["A transistor transfers its internal resistance from a low resistance (LOW R) in the emitter-base circuit to a much higher resistance (HIGH R) in the collector-base circuit.", "A transistor transfers its internal resistance from a low resistance (LOW R) in the emitter-base circuit to a much higher resistance (HIGH R) in the collector-base circuit..............................................................................................."], "jumps": ["P1065", "P1050"]}, {"id": "P1065", "text": ["We can view the internal make-up of a transistor as two diodes placed back to back.", "We can view the internal make-up of a transistor as two diodes placed back to back.pa diodesThe word TRANSISTOR is derived from the words TRANSfer and resISTOR. These two words best describe transistor operation."], "jumps": ["P1066", "P1050"]}, {"id": "P1066", "text": ["If we remember our diode theory correctly, a forward biased diode has a lower resistance than a reversed biased diode.", "If we remember our diode theory correctly, a forward biased diode has a lower resistance than a reversed biased diode.w the internal make-up of a transistor as two diodes placed back to back.........or operation."], "jumps": ["P1070", "P1065"]}, {"id": "P1070", "text": ["Transistors are solid state devices constructed from N type and  P type materials just like diodes.", "Transistors are solid state devices constructed from N type and P type materials just like diodes...."], "jumps": ["P1080", "P1066"]}, {"id": "P1075", "text": ["N TYPE MATERIAL - N type material is a semiconductor (four electrons in the outermost orbit) with impurities added. The impurities have five electrons in the outermost orbit. This produces free electrons that move throughout the N material..."], "jumps": []}, {"id": "P1076", "text": ["P TYPE MATERIAL - P type material is a semiconductor (four electrons in the outermost orbit) with impurities added. The impurities have three electrons in the outermost orbit. This produces holes that move throughout the P material..."], "jumps": []}, {"id": "P1080", "text": ["Unlike diodes, transistors have three elements with two PN junctions."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["The arrangement of the elements determine the type of transistor."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["Each element is named and performs a specific function.  Each element is either N or P type material.", "Each element is named and performs a specific function. Each element is either N or P type material."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["The EMITTER is heavily doped so it produces (emits) a large number of current carriers inside the semiconductor material.                                            CURRENT CARRIERS \n                                Electrons in N type material \n                                   Holes in P type material", "The EMITTER is heavily doped so it produces (emits) a large number of current carriers inside the semiconductor material. CURRENT CARRIERS Electrons in N type material Holes in P type material"], "jumps": ["P1120", "P1100"]}, {"id": "P1112", "text": ["it produces (emits) a large number of current carriers inside the semiconductor material. CURRENT CARRIERS Electrons in N type material Holes in P type material", "The EMITTER is heavily doped so it produces (emits) a large number of current carriers inside the semiconductor material. CURRENT CARRIERS Electrons in N type material Holes in P type materiallllllllllllllllllllllllllllllllllllllllll"], "jumps": ["P1116", "P1117", "P1120", "P1100"]}, {"id": "P1115", "text": ["DOPED - Doping is adding impurities to a piece of pure semiconductor material that has four electrons in the outer most orbit. The doping produces N or P type material depending on if the impurity has five or three electrons in the outer most orbit."], "jumps": ["P1112"]}, {"id": "P1116", "text": ["ELECTRON CURRENT CARRIERS - Inside N type material there are free electrons. When a voltage is placed across the material, all the electrons move in the same direction producing current flow, electrons carry the current."], "jumps": ["P1112"]}, {"id": "P1117", "text": ["HOLE CURRENT CARRIERS - Inside P type material there are holes. When voltage is applied to the material all the holes move in the same direction producing current flow, holes carry the current. Remember, as holes move one way electrons move the other way."], "jumps": ["P1112"]}, {"id": "P1120", "text": ["The BASE is very thin and lightly doped.  Its construction allows most of the current carriers to pass from the emitter to the collector.", "The BASE is very thin and lightly doped. Its construction allows most of the current carriers to pass from the emitter to the collector.."], "jumps": ["P1130", "P1112"]}, {"id": "P1130", "text": ["The COLLECTOR is moderately doped.  It collects the current carriers from the base. The collector is the largest of the 3 areas because it has to dissipate most of the heat generated.", "The COLLECTOR is moderately doped. It collects the current carriers from the base. The collector is the largest of the 3 areas because it has to dissipate most of the heat generated."], "jumps": ["P1140", "P1112"]}, {"id": "P1140", "text": ["What type of current carriers are in P type material?", "What type of current carriers are in P type material?......"], "jumps": ["P1112"]}, {"id": "P1141", "text": [], "jumps": []}, {"id": "P1142", "text": ["The P type material has a missing electron in each impure atom, this creates holes. Holes move and are the current carriers in P type material."], "jumps": []}, {"id": "P1150", "text": ["Which element in a transistor is used to produce a large number of current carriers?"], "jumps": ["P1140"]}, {"id": "P1151", "text": [], "jumps": []}, {"id": "P1152", "text": ["The base is thin and lightly doped so most of the current carriers are passed on."], "jumps": []}, {"id": "P1153", "text": ["The collector is large and moderately doped to collect most of the current carriers."], "jumps": []}, {"id": "P1160", "text": ["Which element in a transistor is used to pass most of the current carriers?"], "jumps": ["P1150"]}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1162", "text": ["The emitter is heavily doped so it produces many current carriers."], "jumps": []}, {"id": "P1163", "text": ["The collector is large and moderately doped to collect most of the current carriers."], "jumps": []}, {"id": "P1170", "text": ["The schematic symbol for a transistor is the emitter and collector connected to the base, with an arrow on the emitter."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["The direction of the arrow on the emitter indicates a NPN or PNP transistor."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["If the arrow points IN, the transistor is PNP."], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["If the arrow points OUT, the transistor is NPN."], "jumps": ["P1210", "P1170"]}, {"id": "P1210", "text": ["The reference designation for transistors is the letter Q."], "jumps": ["P1220", "P1170"]}, {"id": "P1220", "text": ["Transistors are marked with identification numbers.", "Transistors are marked with identification numbers........."], "jumps": ["P1230", "P1170"]}, {"id": "P1230", "text": ["The 2 indicates a transistor (two PN junctions). The N indicates a solid state component. The last digits identify the type of transistor."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["Touch the COLLECTOR on this transistor.", "Touch the COLLECTOR on this transistor....................."], "jumps": ["P1220"]}, {"id": "P1241", "text": [], "jumps": []}, {"id": "P1242", "text": ["You touched the emitter. Remember, the emitter has an arrow.", "You touched the emitter. Remember, the emitter has an arrow.."], "jumps": []}, {"id": "P1243", "text": ["You touched the base. Remember, the base in connected to both the emitter and collector."], "jumps": []}, {"id": "P1250", "text": ["Touch the PNP transistor.", "Touch the PNP transistor.is typed.........................."], "jumps": ["P1240"]}, {"id": "P1251", "text": [], "jumps": []}, {"id": "P1252", "text": ["You touched a NPN transistor. Remember, the arrow of an NPN transistor  is NOT POINTING IN.", "You touched a NPN transistor. Remember, the arrow of an NPN transistor is NOT POINTING IN.NTING IN.."], "jumps": []}, {"id": "P1253", "text": ["You touched a diode.  Remember, a transistor has three elements and a diode has two elements.", "You touched a diode. Remember, a transistor has three elements and a diode has two elements."], "jumps": []}, {"id": "P1260", "text": ["Identifying the leads on a transistor is very simple.", "Identifying the leads on a transistor is very simple......."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["Most transistors leads are arranged in a semicircle. The base lead is in the middle."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["The emitter is on the left or next to a tab when the semicircle is up."], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["The collector is on the right when the semicircle is up."], "jumps": ["P1300", "P1260"]}, {"id": "P1300", "text": ["Power transistors are different. The collector is connected to the metal case of the transistor."], "jumps": ["P1310", "P1260"]}, {"id": "P1310", "text": ["Touch the base on this transistor.", "Touch the base on this transistor.........................."], "jumps": ["P1300"]}, {"id": "P1311", "text": [], "jumps": []}, {"id": "P1312", "text": ["You touched the emitter. The transistor is shown with the semicircle down, the emitter is to the right of the center.", "You touched the emitter. The transistor is shown with the semicircle down, the emitter is to the right of the center.r."], "jumps": []}, {"id": "P1313", "text": ["You touched the collector. The transistor is shown with the semicircle down, the collector is to the left of the center.", "You touched the collector. The transistor is shown with the semicircle down, the collector is to the left of the center.r."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on THE TRANSISTOR.", "This completes the information on THE TRANSISTOR.LE........"], "jumps": ["P1001", "P1310"]}, {"id": "P1920", "text": ["1.  Transistors are used as: \n      - Amplifiers   \n      - Oscillators  \n      - Electronic switches", "1. Transistors are used as: - Amplifiers - Oscillators - Electronic switchesssssssssssssssssssssssssssssssssssssssssssssssssssss"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Transistors control a large signal with a small signal.", "2. Transistors control a large signal with a small signal.", "Small signal controls a large signal", "Little force controls a large forcelll", "High Pressureee force a large forcelll"], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  There are two types of transistors:", "3. There are two types of transistors:......................"], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  The schematic symbol for each type of transistor is different.          The reference designation is Q.", "4. The schematic symbol for each type of transistor is different. The reference designation is Q."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  The emitter produces current carriers. \n     - Electrons in N type material   \n     - Holes in P type material", "5. The emitter produces current carriers. - Electrons in N type material - Holes in P type materiallllllllllll"], "jumps": ["P1962", "P1950"]}, {"id": "P1962", "text": ["6.  The base allows most of the current carriers to pass to the              collector.", "6. The base allows most of the current carriers to pass to the collector."], "jumps": ["P1980", "P1950"]}, {"id": "P1970", "text": ["8.  The leads of a transistor are identified by lead placement.", "8. The leads of a transistor are identified by lead placement."], "jumps": ["P1999", "P1950"]}, {"id": "P1980", "text": ["7.  The collector receives most of the current carriers.", "7. The collector receives most of the current carriers."], "jumps": ["P1970", "P1950"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu..."], "jumps": ["P1001", "P1970"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["There are two types of signals applied to transistors.", "There are two types of signals applied to transistors......"], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["The input is the signal that is changed to produce an output. Input signals are either AC or DC."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["The bias is the signal that allows the transistor to operate.  Bias signals are DC voltages.", "The bias is the signal that allows the transistor to operate. Bias signals are DC voltages."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["The transistor must be biased with a DC voltage before use."], "jumps": ["P2060", "P2020"]}, {"id": "P2060", "text": ["Transistor bias is accomplished by forward biasing the emitter to base PN junction (EB) and reverse biasing the collector to base PN junction (CB)."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["Biasing is opposite for NPN and PNP transistors. Let's first look at NPN transistor biasing. Remember, input and output signals are not considered."], "jumps": ["P2080", "P2050"]}, {"id": "P2080", "text": ["Placing a positive voltage on the base and a negative voltage on the emitter forward biases the emitter to base (EB) PN junction, low resistance junction."], "jumps": ["P2091", "P2090", "P2070"]}, {"id": "P2085", "text": ["LOW RESISTANCE JUNCTION - Transistors transfer a low resistance to a high resistance. Recall from the diode lessons that a forward biased PN junction offers very little opposition to current flow, has a low resistance."], "jumps": []}, {"id": "P2090", "text": ["Current flows through the forward biased BE junction. This current is called Ib."], "jumps": ["P2100", "P2080"]}, {"id": "P2091", "text": ["Current flows through the forward biased BE junction. This current is called Ib."], "jumps": ["P2101", "P2080"]}, {"id": "P2100", "text": ["Placing a large positive voltage on the collector reverse biases the collector to base PN junction, high resistance junction.", "Placing a large positive voltage on the collector reverse biases the collector to base PN junction, high resistance junction.."], "jumps": ["P2110", "P2080"]}, {"id": "P2101", "text": ["Placing a large positive voltage on the collector reverse biases the collector to base PN junction, high resistance junction.", "Placing a large positive voltage on the collector reverse biases the collector to base PN junction, high resistance junction.."], "jumps": ["P2111", "P2080"]}, {"id": "P2105", "text": ["HIGH RESISTANCE JUNCTION - Transistors transfer a low resistance to a high resistance. Recall from the diode lessons that a reverse biased PN junction offers very high opposition to current flow, has a high resistance."], "jumps": []}, {"id": "P2107", "text": ["Placing a large positive voltage on the collector reverse biases the collector to base PN junction, high resistance junction.", "Placing a large positive voltage on the collector reverse biases the collector to base PN junction, high resistance junction.."], "jumps": ["P2110", "P2080"]}, {"id": "P2108", "text": ["Placing a large positive voltage on the collector reverse biases the collector to base PN junction, high resistance junction.", "Placing a large positive voltage on the collector reverse biases the collector to base PN junction, high resistance junction.."], "jumps": ["P2111", "P2080"]}, {"id": "P2110", "text": ["Current does not flow from the base to the collector, the PN junction is reverse biased."], "jumps": ["P2120", "P2107"]}, {"id": "P2111", "text": ["Current does not flow from the base to the collector, the PN junction is reverse biased."], "jumps": ["P2121", "P2108"]}, {"id": "P2120", "text": ["Current does flow from the emitter to the collector (Ic). This is what makes transistors different from two diodes connected end to end."], "jumps": ["P2130", "P2107"]}, {"id": "P2121", "text": ["Current does flow from the collector to the emitter (Ic). This is what makes transistors different from two diodes connected end to end."], "jumps": ["P2131", "P2108"]}, {"id": "P2130", "text": ["Current flows from the emitter to the collector because the base is thin and lightly doped."], "jumps": ["P2140", "P2107"]}, {"id": "P2131", "text": ["Current flows from the collector to the emitter because the base is thin and lightly doped."], "jumps": ["P2140", "P2108"]}, {"id": "P2140", "text": ["The base can not use all the current carriers from the heavily doped emitter. The current carriers (electrons in NPN transistors) are attracted to the positive voltage on the collector."], "jumps": ["P2151", "P2150", "P2108", "P2107"]}, {"id": "P2150", "text": ["Total current flowing through the transistor circuit (Ie) is found by: Ie = Ib + Ic"], "jumps": ["P2160", "P2107"]}, {"id": "P2151", "text": ["Total current flowing through the transistor circuit (Ie) is found by: Ie = Ib + Ic"], "jumps": ["P2160", "P2108"]}, {"id": "P2160", "text": ["As long as the EB junction is forward biased and the CB junction is reverse biased, the transistor is operating."], "jumps": ["P2170", "P2108", "P2107"]}, {"id": "P2170", "text": ["In an operating NPN transistor which PN junction is forward biased and which PN junction is reverse biased?"], "jumps": ["P2108", "P2107"]}, {"id": "P2171", "text": [], "jumps": []}, {"id": "P2172", "text": ["The emitter to base PN junction is forward biased. Remember, the emitter is heavily doped to produce current carriers that flow to the base. This is accomplished by forward biasing  the emitter to base PN junction.", "The emitter to base PN junction is forward biased. Remember, the emitter is heavily doped to produce current carriers that flow to the base. This is accomplished by forward biasing the emitter to base PN junction."], "jumps": []}, {"id": "P2173", "text": ["There is no EC, emitter to  collector, PN junction.", "There is no EC, emitter to collector, PN junction........."], "jumps": []}, {"id": "P2180", "text": ["The polarity of the bias voltages are different in PNP transistors."], "jumps": ["P2191", "P2190", "P2170"]}, {"id": "P2190", "text": ["The base to emitter PN junction is forward biased by placing a negative voltage on the base and a positive voltage on the emitter."], "jumps": ["P2200", "P2180"]}, {"id": "P2191", "text": ["The base to emitter PN junction is forward biased by placing a negative voltage on the base and a positive voltage on the emitter."], "jumps": ["P2201", "P2180"]}, {"id": "P2200", "text": ["The collector to base PN junction is reverse biased by placing a negative voltage on the collector."], "jumps": ["P2210", "P2190"]}, {"id": "P2201", "text": ["The collector to base PN junction is reverse biased by placing a negative voltage on the collector."], "jumps": ["P2211", "P2191"]}, {"id": "P2210", "text": ["The direction of current through verse biased, the transistor is operating."], "jumps": ["P2240", "P2223", "P2222"]}, {"id": "P2240", "text": ["In an operating PNP transistor, which PN junction is forward biased and which PN junction is reverse biased?"], "jumps": ["P2223", "P2222"]}, {"id": "P2241", "text": [], "jumps": []}, {"id": "P2242", "text": ["The emitter to base PN junction is forward biased. Remember, the emitter is heavily doped to produce current carriers that flow to the base. This is accomplished by forward biasing the emitter to base PN junction in both PNP and NPN transistors."], "jumps": []}, {"id": "P2243", "text": ["The transistor does not have an EC, emitter to collector PN junction.", "The transistor does not have an EC, emitter to collector PN junction.........."], "jumps": []}, {"id": "P2250", "text": ["In a NPN transistor, the base DC bias voltage must be", "In a NPN transistor, the base DC bias voltage must be......"], "jumps": ["P2240"]}, {"id": "P2251", "text": [], "jumps": []}, {"id": "P2252", "text": ["Placing a negative voltage on the P type base reverse biases the base to emitter PN junction."], "jumps": []}, {"id": "P2253", "text": ["Placing a positive voltage on the P type base forward biases the base to collector PN junction."], "jumps": []}, {"id": "P2260", "text": ["In a PNP transistor, the base DC bias voltage must be", "In a PNP transistor, the base DC bias voltage must be......"], "jumps": ["P2250"]}, {"id": "P2261", "text": [], "jumps": []}, {"id": "P2262", "text": ["Placing a positive voltage on the N type base reverse biases the base to emitter PN junction."], "jumps": []}, {"id": "P2263", "text": ["Placing a negative voltage on the N type base forward biases the base to collector PN junction."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on TRANSISTOR BIAS.", "This completes the information on TRANSISTOR BIAS.E........"], "jumps": ["P2001", "P2260"]}, {"id": "P2920", "text": ["1.  There are two types of signals applied to transi let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
