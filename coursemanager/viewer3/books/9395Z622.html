const book = {"title": "9395Z622", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: FLIGHT LINE SAFTEY asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": ["# #\" #& \"\"# &\"###2' &2#&.22&# 25--283-.#285255232/238882-.-5:38832222882282-213:22::82-22225:8-33-22282232.22258558.5822385:235:222283538::2585582::2:", "&&#&# #/2.#.& -8 \"#.-&23..22'/.#212&-2258\"588:52", "### ## /# #/&# \" \"/##\"#/&//..#/..&/28.&...&824/&.88-8588..2222858852.28:582228588358282228258.888:825:583.8828::8228828588828583:35558.555.85::88::85588:88:5555::38::85:::5:5:52::85::88::", ":85:855::83:5:5.5:55:855:52.5:5283822242348522...252...2..82/.4..22//2./..##/.8.#&./#&/..##// ##\",##/## #. / /& # ## ## ## ## ## \" #/# ## /# ## #.\" ./ #//###,//.&/#.\"#/.##/./#&/2.&/.../&//....//&2222.2/252.&28.8522582.824828828::255:::5:", "/,,,,,,,,,,,,,/, ,, ,,,,,,6, ,,,6,,, ,,,,,//6//6,,,,/6/,,,/,4/,,/6/4494,,494/6846446/4884664;44;889448489888<8648<<8;44;88988<88948;98<44<;:<44<<8;44<48<<8;48<48<88;48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["1. Personal Protection Enter objective 1 line item 2 here. item 2 here.e.e.", "2. Flight Line Operationsnter objective 1 line item 2 here. item 2 here.e.e.", "w Describe the personal protection required when working on an aircraft flight line....", "w Describe and identify flight line ground support equipment. w Demonstrate the procedures and safety precautions on an aircraft flight line. w Identify the danger zones associated with aircraft movement and operations."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson you will learn about the dangers and safety practices necessary while working in and around an aircraft flight line or otherwise called the Ramp."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["The hazards associated with aircraft ramps, have the potential to seriously injure you."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Flight line or ramp hazards vary in seriousness. They can be from small puncture wounds from safety wire to fatal injuries resulting from inattention to the surroundings, or failing to follow manufacturers established instructions and procedures..."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Aviation Maintenance Technicians (AMT's) have an enormous responsibility for ensuring that all aircraft remain airworthy. This all begins with safety for you as the technician, for your co-workers, customers, and the equipment..."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Safety prevention is inexpensive compared to the cost of an injury or death."], "jumps": ["P490", "P430"]}, {"id": "P490", "text": ["Let's begin our lesson on FLIGHT LINE SAFETY.............................."], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The first line of defense against aviation hazards is Personal Protection. Life threatening, or life altering, hazards are inherent with the aviation industry and it is everyone's responsibility to maintain a safe workforce..."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["The AMT is offered numerous opportunities to protect themselves while in the workforce. This can be in the form of actual safety equipment that is worn on your body, to written safety literature from the regulatory authorities, commercial vendors, military, and employers..."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Personal protection must be worn in order for it to keep you safe. It will not help you if it is stuck in a locker or toolbox. Let's start out with what we can do to protect our eyes."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["You must always be cognizant of your eye safety. Safety glasses are your number one defense against eye injury."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["There are many eye hazards that you need to be aware of. Here are just some of them: st, dirt, rocks, and foreign objects that are blown around by jet exhaust and propeller or rotor wash. * Aircraft system fluids that is accidentally spilled or sprayed. * Dropped tools from high levels. * Cut safety wire. * Power and pneumatic tool chips and shavings. * Sharp and pointed edges on the aircraft and engine.....", "Dust, dirt, rocks, and foreign objects that are blown around by jet exhaust and propeller or rotor wash. * Aircraft system fluids that is accidentally spilled or sprayed. Dropped tools from high levels. Cut safety wire. Power and pneumatic tool chips and shavings. Sharp and pointed edges on the aircraft and engine."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["The big question to ask is why doesn't more people wear safety glasses? The answer seems to be because the majority of safety glasses made have a one size fit all mentality and they are uncomfortable...", "V( ~<a5599999:::::::22222222222222222:::9995"], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["It is very important that you find a pair that fits you properly, is comfortable to wear, and you feel they look good on you. Doing these three things will make wearing the safety glasses feel more normal, and in the long run, your eyes will thank you..."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["Another hazard that you need to be aware of concerns how you dress while performing maintenance on an aircraft."], "jumps": ["P1100", "P1070"]}, {"id": "P1100", "text": ["In aviation, you will be required to remove all jewelry (rings, bracelets, watches, necklaces, etc.) prior to working on an aircraft. This is a practice that also should be carried over to your home life when working with machinery."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["Many technicians have lost their fingers, had their arms or head pulled in rotating components, or was electrocuted when their ring or watch touched an electrical circuit. Don't take a chance. Remove your jewelry prior to working on any aircraft or machinery..."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["Long sleeve or baggy clothing has no place around machinery. Baggy clothing can be caught and wrapped around moving components or protruding objects;. and cause physical injuries."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["The one item that you can use to protect your eyes is/are the _______"], "jumps": ["P1120"]}, {"id": "P1131", "text": [], "jumps": []}, {"id": "P1132", "text": ["These may keep your eyes comfortable, but will not help is an object is coming at you at a high rate of speed. The correct answer is safety glasses."], "jumps": []}, {"id": "P1133", "text": ["Tempered glass is used in showers, cars, and some home windows. The correct answer is safety glasses."], "jumps": []}, {"id": "P1140", "text": ["What personal items must be removed when working on the hangar deck or flight line?"], "jumps": ["P1130"]}, {"id": "P1141", "text": [], "jumps": []}, {"id": "P1142", "text": ["Car keys may be kept in your pocket. The correct answer is jewelry and watches."], "jumps": []}, {"id": "P1143", "text": ["It is recommended that you wear eye protection, preferably safety glasses. The correct answer is jewelry and watches."], "jumps": []}, {"id": "P1150", "text": ["Another area of concern is with the inherent noise that is produced by aircraft. There should be warning placards in any area where the noise level exceeds 94db. If a person cannot understand you from two feet away in a normal voice, there is a good chance that the noise level exceeds the 94db..."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["You should have hearing protection available anytime you are exposed to noise levels above the 94db. This can be in the form of earplugs, earmuffs, or a combination of the two."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["Most individuals never realize they are losing their hearing until it is too late. Once you lose your hearing, it is gone for good. You should have your hearing protection with you at all times."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["As in any industrial complex, safety shoes should be worn by all AMT's. When picking out a pair of steel or composite toed shoes, ensure that the soles are resilient to petroleum products such as fuels and lubricants. Spilled fluids occur on a daily basis and traction from your work shoes is very important..."], "jumps": ["P1190", "P1170", "Pzzz"]}, {"id": "P1190", "text": ["Hard hats are not normally worn while working on aircraft. They should be worn however anytime heavy aircraft components are being lifted over your head with a hoist during the removal or installation process..."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["The chemicals in use today within the aviation industry can have long term affects on your health if inhaled into your lungs or absorbed through the skin."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["Chemicals that evaporate quickly should be used with extreme caution. Special masks that can remove the chemical residue from the air must be worn when there is any doubt as to the safety precautions prescribed in the MSDS..."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["Use Latex gloves to protect your hands while working with chemicals."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["The proper hearing protection constitutes _______.........."], "jumps": ["P1220"]}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1232", "text": ["You really need more than just earplugs on the flight line."], "jumps": []}, {"id": "P1233", "text": ["You really need more than just earmuffs on the flight line."], "jumps": []}, {"id": "P1240", "text": ["What safety device is required when using chemicals that evaporate quickly?", "Special mask that removes chemicals from the air."], "jumps": ["P1230"]}, {"id": "P1241", "text": [], "jumps": []}, {"id": "P1242", "text": ["The paper mask will not protect you against strong chemicals."], "jumps": []}, {"id": "P1243", "text": ["While safety shoes are required while working on the flight line, shop, and hangar; a special mask is needed that removes chemicals from the air."], "jumps": []}, {"id": "P1250", "text": ["What should be taken into consideration when picking out a pair of safety glasses?", "Polarized lenses, proper fit, and you feel they look good on you.", "Non-polarized lenses, comfortable to wear, and proper fit.", "Proper fit, is comfortable to wear, and you feel they look good on you."], "jumps": ["P1240"]}, {"id": "P1251", "text": [], "jumps": []}, {"id": "P1252", "text": ["Polarized lenses are not safety glasses...................."], "jumps": []}, {"id": "P1253", "text": ["Non-polarized lenses are not safety glasses................"], "jumps": []}, {"id": "P1260", "text": ["Hearing protection is mandatory when the noise level reaches _______db."], "jumps": ["P1250"]}, {"id": "P1261", "text": [], "jumps": []}, {"id": "P1262", "text": ["You should have hearing protection available anytime you are exposed to noise levels above the 94db."], "jumps": []}, {"id": "P1910", "text": ["This concludes the information on PERSONAL PROTECTION......"], "jumps": ["P1001", "P1260"]}, {"id": "P1920", "text": ["1. Personal protection is your number one line of defense against personal injuries in aviation. es. * Remove all jewelry and watches. * Do not wear baggy clothes.", "Wear safety glasses. * Remove all jewelry and watches. Do not wear baggy clothes. wer and pneumatic tool chips and shavings. Sharp and pointed edges on the aircraft and engine.on the aircraft and engine.and pointed edges on the aircraft and engine.nd pneumatic tool chips and shavings. Sharp and pointed edges on the aircraft and engine."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. You should wear a special mask with cartridges that remove chemicals from the air anytime you are working with chemicals that evaporate quickly or are considered dangerous according to the MSDS."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. You should always wear safety shoes that are resistant to petroleum while working in the shop, hangar, or flight line."], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["4. Wear hard hats when heavy equipment is hoisted over your head."], "jumps": ["P1960", "P1920"]}, {"id": "P1960", "text": ["5. Wear Latex gloves and a filter mask when working with hazardous chemicals."], "jumps": ["P1999", "P1920"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1960"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["The AMT on the flight line will be exposed to numerous types of Ground Support Equipment, more commonly known as GSE."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["Just as the name implies, this equipment is used to support aircraft while on the ground, and aircraft require a plethora of specialized equipment in order to perform its day-to-day operations. Let's look at some of the more common pieces of equipment that you will come in contact with..."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["The most common or universal piece of GSE is the tow tractor, or more commonly known as the tug or mule. It is used to tow aircraft and GSE on the flight line and in hangars."], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["Tow tractors are specialized pieces of GSE. The have powerful engines and have a gear reduction that allows them to pull heavy loads."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["The tow tractors are categorized by the amount of weight they can pull, environmental conditions they will operate in, and by their turning radius."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["It is very important that one not attempt to tow anything heavier than the tow tractor is rated for. Premature transmission failure and the reduced ability to stop the tow are two of the main reasons not to exceed the rated tow weight..."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["All motorized ground support is limited to a maximum speed of 15 mph on an open ramp, and 5 mph around aircraft."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["e discussion text here...............................", "The aircraft tow bar is used to connect the aircraft to the tow tractor. There are numerous types of tow bars with each one made specifically for a type of aircraft. The NT4 or universal tow bar can tow numerous types of aircraft up to 90,000 pounds..."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["e discussion text here...............................", "Some aircraft will need a special piece of GSE to start the engines or run electrical systems. The most common types are the Air Starter or Puffer, and the power cart."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["e discussion text here...............................", "The air starter has a small jet engine that is attached to a trailer and enclosed in a metal box. The engine produces high volume and high pressure air that is transferred to the aircraft starting port by a hose..."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["Air starters are known to reach a noise level above 140db; so hearing protection is mandatory. fire extinguisher must be close to the piece of equipment in case of an emergency. * Never engage the air valve that allows the air to flow to the aircraft until the coupling on the aircraft is attached and secure and the pilot or maintenance personnel in the cockpit have given their permission. * The air starter should be left hooked up to the tow tractor in case on an emergency.....", "A fire extinguisher must be close to the piece of equipment in case of an emergency. Never engage the air valve that allows the air to flow to the aircraft until the coupling on the aircraft is attached and secure and the pilot or maintenance personnel in the cockpit have given their permission. The air starter should be left hooked up to the tow tractor in case on an emergency."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["e discussion text here...............................", "The electrical power cart is used to provide electrical power to the aircraft. This reduces the risk of having a dead battery when electrical power is needed for engine starts or maintenance."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["Electrical power carts have either diesel (more often) or gas (less often) engines that drives a large generator. They can provide both AC and DC power to the aircraft through 50-foot heavy cables. A special male adapter plug is inserted into the receptacle in the side of the airframe.....", "s KK K KKKKK KKKKKKKKKKKKKttXXXttKK ssssss | g", "3333 3 gggs s KKKKK XKK KKK K KKKKKKKKXXXXXtK", "s KK K KKKKK KX KKKK ss sssszzgzzz =gggzss s K KttXXStKXXKKKXXXt", "=z 3|||zg s KKKKXSXtXXXSSSXSXXXXX"], "jumps": ["P2150", "P2130", "P"]}, {"id": "P2150", "text": ["e discussion text here...............................", "The electrical power cart should be parked the cables length from the aircraft. It also produces noise levels exceeding 120db and hearing protection is mandatory."], "jumps": ["P2160", "P2130"]}, {"id": "P2160", "text": ["e discussion text here...............................", "Hydraulic test stands, more commonly known as the Hydraulic Jenny, provide hydraulic pressure to the aircraft's hydraulic system for accomplishing maintenance and tests. These units run at very high pressures and should only be used by qualified personnelll"], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["e discussion text here...............................", "The Air Conditioning unit provides cool air to the aircraft. This is used strictly for comfort of the maintenance technicians performing maintenance inside of the aircraft and is more common in hotter climates.."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["e discussion text here...............................", "Aircraft servicing vehicles come in numerous shapes, sizes, purposes, and configurations. The most common of these are the fuel, lubrication, and sanitation vehicles."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["As the name applies, the fuel truck will either fuel or defuel the aircraft. Most fuel trucks are run through contractors that supply fuel to an airport. Some smaller airfields will require the AMT to drive the fuel truck to the aircraft...", "/e'x0EE7& .EEEEE.0.7s(c/--33-3-33-3-d///r+/", "d-33-///-3333333-3k-+++/rddk--h-kkrhPQ y&", "~ s& u#//rr//////---------/d/-/dddr----///+////-//r//rrh-/-----------r++rr/r+rrrr-h`B", "4ys & ue/////rrr//h-----/-/--d////d///////////-///-drddd3-d/dd----///+rrrrr/rrrrhrF", "s xze/-//rr/+/r///--//--d//-/d--/------------------d--------//+++++rr-3+rr/hrF", "*' sss ue/rrr-/r//+////-------d//---------------d//d--------///rr//r/r/+rrrrrh+P", "vvvvvvyssvvvssvtssssssssssss s s & ! ss & x#", "\"' ttvvvvvsssvvtvtvvtvvtttvtttvtttvvvssvsssss ss s& s", "#:E Phr-drrrr/r//-----/----/--///++r++r+++", "70..&&&0...]0000000000000 0&&& &&&&& swwu[", "ttttttttvtttttvvvytvtvvsssvsvvssssssss s"], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["e discussion text here...............................", "Fuel trucks should always park perpendicular to the aircraft when fueling. This allows an emergency egress path for the truck in case of a fire. Fuel trucks are also limited to the 5 mph and 10 mph speed limits we spoke of earlier in this lesson.."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["e discussion text here...............................", "Servicing trucks will normally contain the lubrications, air, and the different greases required on the aircraft. These include the engine oil, hydraulic fluids, and consumables such as rags and brushes.."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["e discussion text here...............................", "There are numerous specialized tools that are designed for a specific aircraft that can be considered ground support equipment. Fixtures and tools to remove components from the aircraft, special jacking pads, and test equipment are just a few of the examples of these special tools..."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["The last piece of ground support equipment that we need to cover is the check stands. The check stand is used to work on areas too high to reach, or on areas that could be considered unstable..."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["e discussion text here...............................", "Some check stands are manufactured to a set shape and size for performing major maintenance on the aircraft. Others are portable and adjustable in height and have wheels for mobility."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["Ground Support Equipment is used to _______................"], "jumps": ["P2230"]}, {"id": "P2251", "text": [], "jumps": []}, {"id": "P2252", "text": ["Just as the name implies, this equipment is used to support aircraft while on the ground."], "jumps": []}, {"id": "P2260", "text": ["The most common or universal piece of GSE is the _______..."], "jumps": ["P2250"]}, {"id": "P2261", "text": [], "jumps": []}, {"id": "P2262", "text": ["Fuel trucks are used to either refuel or defuel an aircraft."], "jumps": []}, {"id": "P2263", "text": ["An electrical power cart is used to provide electrical power to the aircraft."], "jumps": []}, {"id": "P2270", "text": ["The AMT must always be on the look out for hidden dangers. The basic ingredient to aviation flight line and shop safety is good house keeping."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["The Occupational, Health, and Safety Administration (OSHA) are the federal regulatory authority that sets the personal and industrial safety standards that the AMT must comply with."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["The Federal Aviation Administration (FAA) sets and enforces all aviation standards and regulations with regard to aircraft operations and movement within the United States."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["Cleanliness of your workspace is very important. Tripping, slipping, cutting, etc., hazards are averted by picking up items and wiping up spills. Let's be a little more specific."], "jumps": ["P2310", "P2280"]}, {"id": "P2310", "text": ["Here are a few items to think about when involved with shop and flight line safety.hat about that overflowing trashcan with all those rags soaked with oil, grease, and fuel? * Are they stored in a metal trashcan with a self-closing lid? * Is the material on those rags considered hazardous material in accordance with the Environmental Protection Agency (EPA)? * Is the trash properly emptied daily considering some of the rags may have hazardous material on them? * Are tools, parts, and consumables returned to their proper storage location after use? * Are tools accounted for after each maintenance task to prevent one from being left in or on an aircraft? These are just a few of the questions you need to ask yourself daily.....", "What about that overflowing trashcan with all those rags soaked with oil, grease, and fuel? Are they stored in a metal trashcan with a self-closing lid? Is the material on those rags considered hazardous material in accordance with the Environmental Protection Agency (EPA)? Is the trash properly emptied daily considering some of the rags may have hazardous material on them? Are tools, parts, and consumables returned to their proper storage location after use? Are tools accounted for after each maintenance task to prevent one from being left in or on an aircraft? estions you need to ask yourself daily."], "jumps": ["P2320", "P2310"]}, {"id": "P2320", "text": ["Chemicals present their own unique and hidden dangers. We are exposed to all types of chemicals on a daily basis. How do you know if the product is dangerous?"], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["All employers are mandated to have a Material Safety Data Sheet (MSDS) for every chemical that is stored or used within the premises. Chemicals can be considered anything from fuel, oil, or grease, to the liquid hand soap that is by the sink..."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["e discussion text here...............................", "The MSDS' contain a wealth of information on the health risks and proper use each chemical. To start with, ensure that you always wear latex gloves when handling all fuels and oils."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["After cleanliness, comes your own personal safety. Proper lighting in your workplace will allow you to see exactly what you are doing. This includes inside the shop as well as on the flight line..."], "jumps": ["P2360", "P2330"]}, {"id": "P2360", "text": ["Dark corners, burnt out light bulbs in the overhead as well as on machinery equipped with them are invitations to get hurt."], "jumps": ["P2370", "P2350"]}, {"id": "P2370", "text": ["Shop machinery can create all kinds of unseen hazards. It is a requirement that no safety guard be removed or safety equipment overridden on any machinery. It is there for YOUR safety as well as those around you..."], "jumps": ["P2380", "P2360"]}, {"id": "P2380", "text": ["Everyone knows that we all breathe air. But, when you take that air and put it under pressure, it can become a deadly weapon."], "jumps": ["P2390"]}, {"id": "P2390", "text": ["Compressed air is used extensively in aviation shops and on the flight line to operate all types of productive and time saving tools.", "KKKKGG 1 GGGGeeu", "eeeeKGG GG G G G GGGGGe", "uuuueeKeKGGG G GG GGG GGGGGGGGGGGG", "uuuuuuuueeKKKGGG GGGGGGGGGGGGGGGGGGGGGe", "************************************?***??**?******?***???????Qu 1", "****```***`********************************************????O???Qu 1"], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["You should always inspect all tools and equipment before you use them. Here are some key areas to be aware of with compressed air and air tools: * Equipment and tools wear out. They do not last forever. * Air hoses are pulled across the work area and are chaffed through the protective covering. Worn hoses can blow apart and whip back and forth uncontrollably. * The quick disconnect fittings are dropped on the ground and damaged. This can cause the fittings to depart the hose without warning. * Dust and dirt become lodged in the end of hoses and exhaust ports on air tools. The material can be discharged at a high rate of speed. * Compressor tanks will corrode on the inside if the condensation is not drained daily. The corrosion or rust will be expelled out through the hose like a bullet, or sent through the tool and damage it. * Never aim compressed air at another person. * Never use compressed air to blow the dust off of tools or yourself...", "* Equipment and tools wear out. They do not last forever. Air hoses are pulled across the work area and are chaffed through the protective covering. Worn hoses can blow apart and whip back and forth uncontrollably. * The quick disconnect fittings are dropped on the ground and damaged. This can cause the fittings to depart the hose without warning. Dust and dirt become lodged in the end of hoses and exhaust ports on air tools. The material can be discharged at a high rate of speed. Compressor tanks will corrode on the inside if the condensation is not drained daily. The corrosion or rust will be expelled out through the hose like a bullet, or sent through the tool and damage it. Never aim compressed air at another person. Never use compressed air to blow the dust off of tools or yourself..lf."], "jumps": ["P2410", "P2390"]}, {"id": "P2410", "text": ["Speaking of tools, the AMT will become intimately familiar with many types of normal and special tools in the performance of maintenance."], "jumps": ["P2420", "P2390"]}, {"id": "P2420", "text": ["Everything from the simple screwdriver to the largest maintenance check stand or aircraft towing tractor (tug or mule) has a purpose. Safety always involves using the right tool for the right job. Do not improvise..."], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["By their design, aircraft can be dangerous pieces of equipment. High speed moving parts, sharp and jagged corners, and heavy equipment, must all be a part of your awareness."], "jumps": ["P2440", "P2420"]}, {"id": "P2440", "text": ["While in a hangar, the AMT should install all aircraft protective covers and place safety cones around dangerous areas of the aircraft.", ".$777$D $22$2 2>> .o .. 4 4444MM"], "jumps": ["P2450", "P2430"]}, {"id": "P2450", "text": ["The basic ingredient of shop safety is _______.............", "throwing all empty chemical containers into the trashcan."], "jumps": ["P2430"]}, {"id": "P2451", "text": [], "jumps": []}, {"id": "P2452", "text": ["The trash should be emptied daily.........................."], "jumps": []}, {"id": "P2453", "text": ["All chemicals should be disposed of properly in accordance with local approved standards."], "jumps": []}, {"id": "P2460", "text": ["Air compressors must have the condensation-drained _______."], "jumps": ["P2450"]}, {"id": "P2461", "text": [], "jumps": []}, {"id": "P2462", "text": ["Condensation should be drained daily to prevent compressor tanks from corroding on the inside."], "jumps": []}, {"id": "P2470", "text": ["The aircraft ramp can be a very busy location. At any one time, numerous operational missions could be going on at the same time."], "jumps": ["P2480", "P2460"]}, {"id": "P2480", "text": ["Whether you are a taxi director, wing or tail walker, tow tractor driver, or passenger; you must constantly be aware of the hidden dangers of operating aircraft and vehicular traffic.", "V* %?)??????????YY??))))))))))))))))?YYYYYYYYYYYYYYYYYttttttt&tt&&t"], "jumps": ["P2490", "P2470"]}, {"id": "P2490", "text": ["Some of these ideas may appear to be common sense, but people are killed every year because of inattention."], "jumps": ["P2500", "P2480"]}, {"id": "P2500", "text": ["Always approach and depart an operating aircraft within the vision of the pilot. NEVER approach or depart a rotary wing aircraft toward the tail rotor."], "jumps": ["P2510", "P2480"]}, {"id": "P2510", "text": ["Rotating propellers, propeller wash, rotor blades, jet intakes and exhausts are just some of the reasons to be aware of the activity going on around you."], "jumps": ["P2520", "P2500"]}, {"id": "P2520", "text": ["Safety glasses and hearing protection are required around all operating aircraft because of the danger of rocks and other debris being blown around and the high noise levels of aircraft flight lines..."], "jumps": ["P2530", "P2510"]}, {"id": "P2530", "text": ["e discussion text here...............................", "Everyone should stay clear of the propeller and engine exhaust anytime a propeller driven aircraft is started. Personnel have become fixated upon a rotating propeller and accidentally walked right into the rotating blades to get the aircraft chocks..."], "jumps": ["P2540", "P2520"]}, {"id": "P2540", "text": ["e discussion text here...............................", "Once a propeller driven aircraft is started, a powerful propeller wash is developed that can blow a person or unsecured GSE (Ground Support Equipment) around."], "jumps": ["P2550", "P2530"]}, {"id": "P2550", "text": ["e discussion text here...............................", "Jet engine aircraft pose their own unique dangers. A very strong suction is located at the intake of the engine. An unknowing person could be sucked right into an operating engine from 25 feet away and at up to 45 degrees from the engine inlet..."], "jumps": ["P2560", "P2540"]}, {"id": "P2560", "text": ["Because of this suction, you should not wear a hat or have any lose rags or objects on your person that could be sucked into the intake."], "jumps": ["P2570", "P2550"]}, {"id": "P2570", "text": ["Enter the discussion text here...............................", "Jet exhaust is very hot and is considered dangerous up to 200 feet behind an operating engine. The temperature at 200 feet could be more than 100 degrees F. Needless to say, the high speed of the exhaust combined with any foreign objects on the ramp could become dangerous projectiles. Another reason for wearing safety glasses!!!!!!"], "jumps": ["P2580", "P2550"]}, {"id": "P2580", "text": ["e discussion text here...............................", "Jet engines also produce a very high whine type noise. Decibel levels over 140db can be reached with most jet engines. This is another reason that hearing protection is mandatory."], "jumps": ["P2590", "P2550"]}, {"id": "P2590", "text": ["Always approach and depart an aircraft _______............."], "jumps": ["P2580"]}, {"id": "P2591", "text": [], "jumps": []}, {"id": "P2592", "text": ["The pilot cannot see you and could possibly injure you by moving the aircraft or applying power to the engines."], "jumps": []}, {"id": "P2600", "text": ["The biggest danger from the intake of a jet engine is _______"], "jumps": ["P2590"]}, {"id": "P2601", "text": [], "jumps": []}, {"id": "P2602", "text": ["While sharp edges are dangerous, the correct answer is suction."], "jumps": []}, {"id": "P2603", "text": ["Prolonged exposure to noise can cause hearing loss........."], "jumps": []}, {"id": "P2910", "text": ["This concludes our lesson on the FLIGHT LINE OPERATIONS...."], "jumps": ["P2001"]}, {"id": "P2920", "text": ["* The most common or universal piece of GSE is the tow tractor. * Air starters are used to start some types of aircraft engines. Electrical power carts are used to supply the aircraft with AC and/or DC power.....", "1. Ground Support Equipment is used to support aircraft while on the ground.common or universal piece of GSE is the tow tractor. * Air starters are used to start some types of aircraft engines. * Electrical power carts are used to supply the aircraft with AC and/or DC power..."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2. Other pieces of GSE and their purposes are:Hydraulic Jenny's supply hydraulic power to the aircraft systems for maintenance or tests. * Air conditioning units provide cool air to the technicians performing maintenance inside the aircraft. * Fuel trucks are use to either refuel or defuel an aircraft. * Check stands provide a maintenance platform to work from while performing aircraft maintenance.", "Hydraulic Jenny's supply hydraulic power to the aircraft systems for maintenance or tests. * Air conditioning units provide cool air to the technicians performing maintenance inside the aircraft. * Fuel trucks are use to either refuel or defuel an aircraft. * Check stands provide a maintenance platform to work from while performing aircraft maintenance.."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3. Good housekeeping is the first step of shop and flight line safety... hazardous chemicals and dispose of them properly. * The MSDS is designed to provide the user of chemicals with all of the pertinent information regarding its side effects, and usage.", "* Be aware of hazardous chemicals and dispose of them properly. * The MSDS is designed to provide the user of chemicals with all of the pertinent information regarding its side effects, and usage.e effects, and usage."], "jumps": ["P2950", "P2930"]}, {"id": "P2950", "text": ["4. Shop safety concerns: Proper lighting of all shop spaces and equipment. * Do not remove any equipment safety guards. * Be extremely careful with high-pressure air. * Utilize the right tool for the right job.", "Proper lighting of all shop spaces and equipment. * Do not remove any equipment safety guards. * Be extremely careful with high-pressure air. * Utilize the right tool for the right job."], "jumps": ["P2960", "P2940"]}, {"id": "P2960", "text": ["5. When working around aircraft, you should:::ways approach and depart an operating aircraft within the vision of the pilot. * Never approach or depart a rotary wing aircraft toward the tail rotor. * Safety glasses and hearing protection are required around all operating aircraft", "Always approach and depart an operating aircraft within the vision of the pilot. Never approach or depart a rotary wing aircraft toward the tail rotor. Safety glasses and hearing protection are required around all operating aircraftt"], "jumps": ["P2970", "P2950"]}, {"id": "P2970", "text": ["6. Jet engines have their own safety concerns:::::craft jet engines have a very strong suction from their intakes, up to 45 degrees from the sides and up to 25 feet in front. * Jet exhaust can have extreme temperatures up to 200 feet aft of the exhaust nozzle. * Decibel levels of over 140db's can be reached with most jet engines. Hearing protection is mandatory.", "Aircraft jet engines have a very strong suction from their intakes, up to 45 degrees from the sides and up to 25 feet in front. Jet exhaust can have extreme temperatures up to 200 feet aft of the exhaust nozzle. Decibel levels of over 140db's can be reached with most jet engines. Hearing protection is mandatory.ry."], "jumps": ["P2999", "P2960"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": []}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["What is the best defense against eye injuries while working in a shop or on the flight line?"], "jumps": []}, {"id": "P10211", "text": ["At what sound decibel level is hearing required?"], "jumps": []}, {"id": "P10212", "text": ["What personal safety equipment is required to be worn on all aircraft flight lines?"], "jumps": []}, {"id": "P10213", "text": ["What type of shoe should be worn while working on aircraft?"], "jumps": []}, {"id": "P10214", "text": ["Wearing _____ clothing can cause personal injury."], "jumps": []}, {"id": "P10215", "text": ["during hoisting evolutions when components are hoisted above. ur head"], "jumps": []}, {"id": "P10216", "text": [], "jumps": []}, {"id": "P10217", "text": ["What is required to be removed prior to working on aircraft?"], "jumps": []}, {"id": "P10218", "text": ["What should the AMT use when handling petroleum products?"], "jumps": []}, {"id": "P10219", "text": ["Hearing protection is required when a conversation between two individuals in a normal voice, cannot be understood from ______ feet apart."], "jumps": []}, {"id": "P10220", "text": ["The basic ingredient of aviation shop and flight line safety is _____."], "jumps": []}, {"id": "P10221", "text": ["Which federal entity is responsible for setting the safety standards in the work place?"], "jumps": []}, {"id": "P10222", "text": ["What type of trashcan must rags soaked with oil, grease, and fuel be stored in?", "Petroleum resistant plastic container with a self-closing lid.", "Petroleum resistant plastic container with a removable lid."], "jumps": []}, {"id": "P10223", "text": ["Which Federal Agency defines and regulates hazardous materials?"], "jumps": []}, {"id": "P10224", "text": ["How often must you empty trashcans with hazardous materials?"], "jumps": []}, {"id": "P10225", "text": ["Which document would you refer to for information of safety on consumables used within your workspace?"], "jumps": []}, {"id": "P10226", "text": ["Changing the drill chuck from a 1/4 to a 1/2", "Changing the drill chuck from a 1/4 to a 1/2.", "Removing metal shavings from a milling machine with a foxtail brush.", "Using compressed air at the maximum pressure.", "Which of the below items is considered illegal when working with shop tools?", "Removing the grinding wheel guard in order to grind oversize material."], "jumps": []}, {"id": "P10227", "text": ["Compressors should have all condensation removed from the tank _____.", "only when the water indicator is pointing at full"], "jumps": []}, {"id": "P10228", "text": ["Which direction should a debarking passenger not go when departing a rotary-wing aircraft?"], "jumps": []}, {"id": "P10229", "text": ["The powerful wind from a turning propeller is called?"], "jumps": []}, {"id": "P10230", "text": ["Always approach an operating aircraft _____."], "jumps": []}, {"id": "P10231", "text": ["The danger area in front of a jet engine extends out approximately _____ feet."], "jumps": []}, {"id": "P10232", "text": ["The main danger with the inlet of a running jet engine is _____."], "jumps": []}, {"id": "P10233", "text": ["_____ are required when working around operating jet engines?"], "jumps": []}, {"id": "P10234", "text": ["Hot jet exhaust can have temperatures exceeding 100 degrees F. up to _____ feet behind the aircraft."], "jumps": []}, {"id": "P10235", "text": ["Dangers of the jet engine intake can extend out to _____ degrees."], "jumps": []}, {"id": "P10236", "text": ["Which of the below items is inherent with an operating jet engine?", "Hot exhaust up to maximum of 100 feet behind an operating engine."], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to __________"], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "PQINFO", "text": ["Page # Test# Question# HelpPage # 10210 1 110 P1050 10211 1 111 P1160 10212 1 112 30000 10213 1 113 P1180 10214 1 114 P1120 10215 1 115 P1190 10216 1 116 P1170 10217 1 117 P1110 10218 1 118 P1220 10219 1 119 P1150 10220 2 120 P2270 10221 2 121 P2280 10222 2 122 P2300 10223 2 123 P2310 10224 2 124 P2300 10225 2 125 P2330 10226 2 126 P2370 10227 2 127 P2400 10228 2 128 P2570 10229 2 129 P2540 10230 2 130 P2500 10231 2 131 P2550 10232 2 132 P2550 10233 2 133 P2520 10234 2 134 P2570 10235 2 135 P2550 10236 2 136 P2520 136 P2520 136 P2520 136 P2520 30000 10239 2 139 30000 1 10242 10243 10244 10245 10246 10247 10248 10249", "Page # Test# Question# HelpPage # 10210 1 110 P1050 10211 1 111 P1160 10212 1 112 30000 10213 1 113 P1180 10214 1 114 P1120 10215 1 115 P1190 10216 1 116 P1170 10217 1 117 P1110 10218 1 118 P1220 10219 1 119 P1150 10220 2 120 P2270 10221 2 121 P2280 10222 2 122 P2300 10223 2 123 P2310 10224 2 124 P2300 10225 2 125 P2330 10226 2 126 P2370 10227 2 127 P2400 10228 2 128 P2570 10229 2 129 P2540 10230 2 130 P2500 10231 2 131 P2550 10232 2 132 P2550 10233 2 133 P2520 10234 2 134 P2570 10235 2 135 P2550 10236 2 136 P2520"], "jumps": []}, {"id": "PINFO", "text": ["06-16-03 Converted from storyboard - Pattyy"], "jumps": []}]};
let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
