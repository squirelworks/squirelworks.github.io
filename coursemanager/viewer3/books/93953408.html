 the FET is open."], "jumps": []}, {"id": "P100", "text": ["w Identify faulty FET amplifier operation. w Determine the faulty component in a faulted FET amplifier......."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 480, 488 or Equivalent XXXXXnt"], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will determine if a FET amplifier circuit is faulted and if so, what the fault is."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["You will practice troubleshooting a FET amplifier for many typical faults that commonly occur."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Measuring and comparing the input to the output quickly determines if the circuit is operating correctly."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Signal tracing can identify many faulted components.", "A faulted FET can be confirmed by measuring the resistance of the junctions between the gate to source and gate to drain."], "jumps": ["P440", "P400", "P450"]}, {"id": "P450", "text": ["Let's begin the lesson on FET AMPLIFIER TROUBLESHOOTING PRACTICE............"], "jumps": ["P440"]}, {"id": "P11040", "text": ["4. Using an analog meter or digital meter with a diode test \n    function, check the Gate to Source (TP3 - TP4) of Q1 in forward     and reverse bias conditions by changing the lead polarities.\n    Do you measure a forward bias condition for one lead polarity \n    and reverse bias for the other lead polarity?", "4. Using an analog meter or digital meter with a diode test function, check the Gate to Source (TP3 - TP4) of Q1 in forward and reverse bias conditions by changing the lead polarities. Do you measure a forward bias condition for one lead polarity and reverse bias for the other lead polarity????????"], "jumps": ["P11045"]}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1020", "text": ["The purpose of this experiment is to give you practice in determining if a FET amplifier circuit is operating normally. If the circuit is faulted, you will determine the faulty component and verify correct operation when the computer repairs the circuit."], "jumps": ["P1040", "P1001"]}, {"id": "P1040", "text": ["Pick up the PC130-49 card. The purpose of this card is to give you practice in troubleshooting FET amplifier circuits."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Compare the components on the card with the schematic shown."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["Recall that this circuit is a common source FET amplifier."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["Q1 is a N channel FET with a Gm of 2 mmhos. Rd is 3.9 kohms, so the calculated gain is 7.8."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["The input signal is applied through a voltage divider, Ein is measured at TP2.  Let's start the experiment.", "The input signal is applied through a voltage divider, Ein is measured at TP2. Let's start the experiment."], "jumps": ["P1090", "P1040"]}, {"id": "P1090", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P1040"]}, {"id": "P1100", "text": ["2.  Carefully plug PC130-49 into the Test Console PC2 position. \n3.  Adjust R6 on PC130-49 fully CW. This unloads the amplifier.", "2. Carefully plug PC130-49 into the Test Console PC2 position. 3. Adjust R6 on PC130-49 fully CW. This unloads the amplifier.er switch to ON........................................."], "jumps": ["P1090"]}, {"id": "P1110", "text": ["4.  Set the Positive Supply Voltage to 12. \n5.  Turn PC2 DC Power switch ON.", "4. Set the Positive Supply Voltage to 12. 5. Turn PC2 DC Power switch ON. to ON...."], "jumps": ["P1100"]}, {"id": "P1120", "text": ["6.  Connect the function generator to the Test Console PC1                 Output BNC.", "6. Connect the function generator to the Test Console PC1 Output BNC. TE PC1 output BNC connection is between PIN T on PC1 and PIN E on PC2. Applying an input to this BNC applies a signal to PC2 PIN E, the card input.", "PC1 output BNC connection is between PIN T on PC1 and PIN E on PC2. Applying an input to this BNC applies a signal to PC2 PIN E, the card input..."], "jumps": ["P1130", "P1110", "P1125"]}, {"id": "P1125", "text": ["BNC CONNECTION - Connect the Function Generator's Main Output BNC to the Test Console's Output BNC."], "jumps": []}, {"id": "P1130", "text": ["7.  Adjust the function generator's frequency for a 1 kHz sine               wave output. \n8.  Adjust the function generator's amplitude for a 6 Vpp output           measured with an oscilloscope at PC130-49 Pin E.", "7. Adjust the function generator's frequency for a 1 kHz sine wave output. 8. Adjust the function generator's amplitude for a 6 Vpp output measured with an oscilloscope at PC130-49 Pin E..."], "jumps": ["P1140", "P1120", "P1135"]}, {"id": "P1135", "text": ["MEASUREMENT SETUP - Carefully place the oscilloscope probe to Pin E."], "jumps": []}, {"id": "P1140", "text": ["9.  Measure the input amplitude at TP2 on PC130-49.  \n     Enter the measured value.", "9. Measure the input amplitude at TP2 on PC130-49. Enter the measured value.............", "If your answer is less than one, enter \"0.\" before your answer.."], "jumps": ["P1130", "P1142"]}, {"id": "P1141", "text": [], "jumps": []}, {"id": "P1142", "text": ["Your answer is not acceptable. Ensure that the input signal is 6 Vpp at 1 kHz as measured on PIN E on PC130-49. Then ensure that you are measuring TP2 on PC130-49 as the input to the amplifier."], "jumps": []}, {"id": "P1143", "text": ["Your answer is still incorrect. You should have measured about 0.42 Vpp at TP2 on PC130-49. If you are unable to obtain this reading, check with your instructor."], "jumps": ["P1140"]}, {"id": "P1150", "text": ["11.  Measure the output amplitude at TP7 on PC130-49.  Enter the        measured value.", "11. Measure the output amplitude at TP7 on PC130-49. Enter the measured value.e.able.le."], "jumps": ["P1140", "P1152"]}, {"id": "P1151", "text": [], "jumps": []}, {"id": "P1152", "text": ["Your answer is not acceptable. Ensure that the input signal is 6 Vpp at 1 kHz as measured on PIN E on PC130-49. Also ensure that R6 is fully clockwise."], "jumps": []}, {"id": "P1153", "text": ["Your answer is still incorrect. You should have measured about 3.3 Vpp at TP7 on PC130-49. If you are unable to obtain this reading, check with your instructor."], "jumps": ["P1150"]}, {"id": "P1160", "text": ["The measured gain of the FET amplifier agrees with the calculated gain within \u00b110%.", "The measured gain of the FET amplifier agrees with the calculated gain within"], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["The FET amplifier is functioning normally.  The computer may now insert a fault into the circuit.", "The FET amplifier is functioning normally. The computer may now insert a fault into the circuit."], "jumps": ["P1160"]}, {"id": "P2000", "text": ["1.  Measure the input (PC130-49 TP2) and output (PC130-49 TP7)       of the FET amplifier.\n     Is the amplifier operating normally?", "1. Measure the input (PC130-49 TP2) and output (PC130-49 TP7) of the FET amplifier. Is the amplifier operating normally? ram = SCAN FTR 0 F2 07"], "jumps": ["P2005", "PC130"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2002", "text": ["You should not measure a correct output from the amplifier. The computer has inserted a fault into the circuit which causes an incorrect output."], "jumps": []}, {"id": "P2005", "text": ["FET AMPLIFIER - To determine normal operation of a common source FET amplifier, compare measured gain with calculated gain. The output signal should also be inverted (shifted 180 degrees) from the input."], "jumps": []}, {"id": "P20 h resistance or zero current flow for both lead polarities indicating that the Gate to Drain junction of the FET is open.", "FET JUNCTION TEST - The following graphic shows analog ohmmeter indications for correct FET operation."], "jumps": []}, {"id": "P2060", "text": ["Your  measurements confirm that the Gate to Drain\n      junction of the FET is open. The computer will now replace            Q1. \n6.  Set PC2 DC Power to ON.", "Your measurements confirm that the Gate to Drain junction of the FET is open. The computer will now replace Q1. 6. Set PC2 DC Power to ON."], "jumps": ["P2050"]}, {"id": "P2070", "text": ["1.  Measure the input (PC130-49 TP2) and output (PC130-49 TP7)       of the FET amplifier.\n     Is the amplifier operating normally?", "1. Measure the input (PC130-49 TP2) and output (PC130-49 TP7) of the FET amplifier. Is the amplifier operating normally??"], "jumps": ["P2060", "P2075", "PC130"]}, {"id": "P2071", "text": [], "jumps": []}, {"id": "P2072", "text": ["You should measure a correct output from the amplifier. The computer has removed the fault.  Measured gain should match your calculated gain.", "You should measure a correct output from the amplifier. The computer has removed the fault. Measured gain should match your calculated gain."], "jumps": []}, {"id": "P2075", "text": ["FET AMPLIFIER - To determine normal operation of a common source FET amplifier, compare measured gain with calculated gain. The output signal should also be inverted (shifted 180 degrees) from the input."], "jumps": []}, {"id": "P2080", "text": ["Congratulations! You correctly identified the faulty component in a  FET amplifier and confirmed normal operation when the component was replaced.", "Congratulations! You correctly identified the faulty component in a FET amplifier and confirmed normal operation when the component was replaced."], "jumps": ["P2070"]}, {"id": "P3000", "text": ["1.  Measure the input (PC130-49 TP2) and output (PC130-49 TP7)       of the FET ampli let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
