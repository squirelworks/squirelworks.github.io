const book = {"title": "93955604", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . ."], "jumps": []}, {"id": "P1", "text": ["Title: DC COMPOUND MOTORS asdf asd fasfd asdf asdf sadf", "Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe the characteristics of a DC Compound motor. w Discuss the Short Shunt and Long Shunt Compound motor. w Describe aiding and opposing field action in a DC Compound motor."], "jumps": []}, {"id": "P300", "text": ["In this lesson, you will learn about DC Compound motors.", "The Compound motor is the third type of DC motor under investigation."], "jumps": ["P300", "P410", "P420", "P400"]}, {"id": "P420", "text": ["Let's begin the lesson on DC COMPOUND MOTORS.............................."], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["A DC Compound motor consists of a Shunt Field coil and a Series Field coil."], "jumps": ["P1001", "P1030"]}, {"id": "P1030", "text": ["The combination of the Series and Shunt field coils provides the magnetic field for the armature."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The compound motor represents a compromise between the characteristics of Series and Shunt motors."], "jumps": ["P1030", "P1050"]}, {"id": "P1050", "text": ["The Series motor exhibits a higher starting torque than the Shunt motor."], "jumps": ["P1040", "P1060"]}, {"id": "P1060", "text": ["On the other hand, the Shunt motor exhibits higher torque at higher RPM."], "jumps": ["P1050", "P1070"]}, {"id": "P1070", "text": ["Start Low RPM Moderate Torque", "Run High RPM Moderate Torque", "The Compound Motor's start and run torque is between the high and low torque of the Series and Shunt Motors."], "jumps": ["P1050", "P1080"]}, {"id": "P1080", "text": ["The Compound Motor has lower starting torque but higher running torque than the Series Motor."], "jumps": ["P1070", "P1090"]}, {"id": "P1090", "text": ["The Compound Motor has higher starting and lower running torque than the Shunt Motor."], "jumps": ["P1070", "P1120"]}, {"id": "P1120", "text": ["Power out = RPM x Torque x (0.1047) = Ft", "The best way to visualize the compromise is to examine the formula for output power."], "jumps": ["P1070", "P1130"]}, {"id": "P1130", "text": ["A Compound motor's torque and RPM make its power output characteristic more constant."], "jumps": ["P1120", "P1140"]}, {"id": "P1140", "text": ["The basic characteristics of the Compound DC motor remain the same."], "jumps": ["P1120", "P1150"]}, {"id": "P1150", "text": ["A Compound Motor incorporates the characteristics of _______"], "jumps": ["P1120"]}, {"id": "P1151", "text": [], "jumps": []}, {"id": "P1152", "text": ["Start Low RPM Moderate Torque", "Run High RPM Moderate Torque", "The Compound motor incorporates the characteristics of both the Series and Shunt motors."], "jumps": []}, {"id": "P1160", "text": ["The Compound motors starting torque is _______............."], "jumps": ["P1150"]}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1162", "text": ["The Compound Motor has less running torque than a Shunt motor. Compound Motor Shunt Motor Start Low RPM Moderate Torque Start Low RPM Low Torque Run High RPM Moderate RPM Run High RPM High Torque"], "jumps": []}, {"id": "P1170", "text": ["The Compound motor incorporates simultaneous Shunt and Series field connections."], "jumps": ["P1160", "P1180"]}, {"id": "P1180", "text": ["There are two possible ways to configure a DC Compound motor."], "jumps": ["P1170", "P1190"]}, {"id": "P1190", "text": ["The Long Shunt Compound motor has the shunt coil connected across the series coil and armature."], "jumps": ["P1180", "P1200"]}, {"id": "P1200", "text": ["In this type of Compound motor, the Armature Current (I ) and the Series Field current (I ) are the same."], "jumps": ["P1190", "P1210"]}, {"id": "P1210", "text": ["The shunt coil voltage is the same as the sum of the armature voltage and the series coil voltage, or the applied voltage."], "jumps": ["P1190", "P1220"]}, {"id": "P1220", "text": ["The Short Shunt Compound motor has a coil in series with the Armature (series coil) and a coil connected in parallel with the armature only (Shunt coil)."], "jumps": ["P1190", "P1230"]}, {"id": "P1230", "text": ["In this type of Compound motor, the Series Coil Current (I ) is the sum of the Shunt Coil Current (I ) and the Armature Current (I )."], "jumps": ["P1220", "P1240"]}, {"id": "P1240", "text": ["The shunt coil voltage (V ) is the same as the armature coil voltage (V )."], "jumps": ["P1220", "P1250"]}, {"id": "P1250", "text": ["As with all DC motors, locked rotor torque is the product of the armature current, field current and the constant."], "jumps": ["P1220", "P1260"]}, {"id": "P1260", "text": ["In a Compound motor, I is a function of both the Series (SER) and Shunt (SH) fields."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["Because a Compound motor utilizes both field coils, each coil contributes to flux generation in the armature."], "jumps": ["P1260", "P1310"]}, {"id": "P1280", "text": ["Maximum motor performance occurs when the coil fields are additive."], "jumps": ["P1430", "P1290"]}, {"id": "P1290", "text": ["Additive fields are similar to two magnets aligned in a N-N or S-S position. A magnetic field is developed around the magnetic pair."], "jumps": ["P1280", "P1300"]}, {"id": "P1300", "text": ["Subtractive fields are similar to two magnets aligned in a N-S position. A magnetic field is developed between the magnets."], "jumps": ["P1280", "P1440"]}, {"id": "P1310", "text": ["Which formula best describes how torque is calculated in a Compound Field motor?"], "jumps": ["P1260"]}, {"id": "P1311", "text": [], "jumps": []}, {"id": "P1312", "text": ["I x I x K is used to calculate torque of Series and Shunt motors. A Compound motor uses Series and Shunt field coils. They must be accounted for when solving for torque."], "jumps": []}, {"id": "P1313", "text": ["I x I x K does not take into consideration the series field."], "jumps": []}, {"id": "P1320", "text": ["Circuit analysis of the DC Shunt motor is no more complicated than the Shunt or Series motor."], "jumps": ["P1310", "P1330"]}, {"id": "P1330", "text": ["Let's look at the locked rotor conditions:", "The circuit values are as shown. lect a circuit to see calculations."], "jumps": ["P1320", "P1340", "P1350"]}, {"id": "P1345", "text": ["ser ser ser arm ser arm sh sh sh", "E = I x R = 0.833 x 5 = 4.2V E = I x R = 0.833 x 25 = 20.8V E = I x R = 0.25 x 100 = 25V"], "jumps": []}, {"id": "P1348", "text": ["ser arm sh sh sh sh sh sh sh", "ser ser ser sh sh sh sh sh sh", "I = 1A E = I x R = 1 X 5 = 5V E = E - E = 25 -5 =20 E = E - E = 25 - 5 = 20", "Calculations are performed using Ohm's and Kirchhoff's Law. There is no inductive reactance since the applied voltage is DC."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["Notice that the torque produced is almost the same for the two motors, I x I x I x K(1)."], "jumps": ["P1340", "P1370"]}, {"id": "P1370", "text": ["Because the Compound motor has high I current through the series coil its starting torque is higher than a DC Shunt motor."], "jumps": ["P1340", "P1380"]}, {"id": "P1380", "text": ["As the shunt coil loads the armature E decreases. This is why the start torque is less than a DC Series motor's."], "jumps": ["P1340", "P1390"]}, {"id": "P1390", "text": ["Analyze the circuit values of a rotating Compound Motor Shaft.", "The circuit values are as shown. Select a circuit to see calculations."], "jumps": ["P1400", "P1340", "P1410", "P1390"]}, {"id": "P1404", "text": ["ser ser ser arm arm arm sh sh x 100 = 25V = 0.25 x 100 = 25V 25V 25VV 0.25 x 100 = 25V25V 25VVV", "E = I x R = 0.5 x 5 = 2.5V E = I x R = 0.5 x 25 = 12.5V CEMF = 10V (given) E = I x R = 0.25 x 100 = 25V"], "jumps": []}, {"id": "P1406", "text": ["Equation 1, Loop 1 = 5I1 + 25I2 + 10 - 25 5I1 + 25I2 = 15 Equation 2, Loop 2 = 5I1 + 100I3 - 25 5I1 + 100I3 = 25 Equation 3 = I3 = I1 - I2", "SHORT SHUNT CALCULATIONS - Short Shunt calculations require the use of Kirchoff's Voltage and Current Laws. One method is shown below."], "jumps": ["P1407"]}, {"id": "P1407", "text": ["Equation #1, 5I1 + 25I2 = 15 Equation #2, 5I1 + 100I3 = 25 Equation #3 = I3 = I3 - I222222222222222222222222222222222222 = I3 = I3 - I22222 I22222222222222222222222222222222222222 = I3 = I3 - I2- I2I3 - I2", "Multiply Equation #1 by 21 21 (5I1 + 25I2) = 21 (15) 105I1 + 525I2 = 315 (Eq #5) I2- I222222222222222222222222222222222222 = I3 = I3 - I22222 I22222222222222222222222222222222222222 = I3 = I3 - I2- I2I3 - I2", "Substitute Equation #3 into Equation #2 5I1 + 100( I1 - I2) = 25 5I1 + 100I1 - 100I2 = 25 105I1 - 100I2 = 25 (Eq #5)on2222222 = I3 = I3 - I22222 I22222222222222222222222222222222222222 = I3 = I3 - I2- I2I3 - I2", "Subtract Equation #4 from Equation #5 105I1 + 525I2 = 315 (Eq #5) - 105I1 + 100I2 = -(25) (Eq #4) fI1 + 625I2 = 290 (Eq #6)5)22 = I3 = I3 - I22222 I2222222222222  voltage to be felt over the armature. This is why armature current does not stay the same."], "jumps": []}, {"id": "P1460", "text": ["What would occur if a DC Compound motor has the Series & Shunt Fields connected in a subtractive manner?"], "jumps": ["P1450"]}, {"id": "P1461", "text": [], "jumps": []}, {"id": "P1462", "text": ["Connecting the fields subtractive is not configuring the motor in the most effective manner. You would see a difference in motor performance."], "jumps": []}, {"id": "P1463", "text": ["Subtractive fields will reduce the magnetic field that the armature is in. The motor would not run faster."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on THEORY OF OPERATION......"], "jumps": ["P1460", "P1001"]}, {"id": "P1920", "text": ["1. A Compound motor has many of the characteristics of a Series and Shunt motor. C Compound Motor Series Shunt"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["Start Low RPM Moderate Torque", "Run High RPM Moderate Torque", "2. A Compound motor has a higher starting torque than a Shunt motor but a lower starting torque than a Series motor. Motor Start Low RPM Moderate Torque Run High RPM Moderate Torque Series Motor Shunt Motor Start Low RPM High Torque Start Low RPM Low Torque"], "jumps": ["P1920", "P1950"]}, {"id": "P1950", "text": ["3. There are two types of DC Compound motors. Compound Motor Configuration Long Short Shunt Shunt"], "jumps": ["P1930", "P1960"]}, {"id": "P1960", "text": ["4. The Short Shunt Compound motor has the shunt coil in parallel to the armature only. Ish IA"], "jumps": ["P1950", "P1970"]}, {"id": "P1970", "text": ["5. The Long Shunt Compound motor has the shunt coil placed across the series coil and armature. t + Iser VT Ish A"], "jumps": ["P1960", "P1980"]}, {"id": "P1980", "text": ["6. Maximum Compound motor performance is achieved with the field coils connected additively."], "jumps": ["P1970", "P1999"]}, {"id": "P1999", "text": ["You have completed the Summ let i = 0;

function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
