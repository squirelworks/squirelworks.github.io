nt reverses direction when the capacitor discharges."], "jumps": ["P1160", "P1142"]}, {"id": "P1160", "text": ["So far, we have looked at an RC circuit with a square wave applied . The RC time constant allowed the capacitor to fully charge and discharge at the instant frequency changed. What happens if the RC time constant or the frequency changes?rge exactly. What happens if the RC time constant or the frequency changes?"], "jumps": ["P1170", "P1142"]}, {"id": "P1170", "text": ["If the time constant is short, compared to the input frequency, the capacitor fully charges before the applied voltage drops to 0 V.", "If the time constant is short, compared to the input frequency, the capacitor fully charges before the applied voltage drops to 0 V.short time constant is no more than one fifth of the applied voltage. ed voltage."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["Since the time constant is short, the capacitor charges quickly. This happens in a small amount of time compared to the frequency of the input voltage.", "Since the time constant is short, the capacitor charges quickly. This happens in a small amount of time compared to the frequency of the input voltage.tage.ency.."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["Ic goes from maximum to minimum in this same short period of time.", "Ic goes from maximum to minimum in this same short period of time.."], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["For the remainder of the time Ea is applied, the voltage across the capacitor equals the applied voltage."], "jumps": ["P1210", "P1170"]}, {"id": "P1210", "text": ["While the capacitor is fully charged, current is minimum since Ea doesn't have to provide charging current."], "jumps": ["P1220", "P1170"]}, {"id": "P1220", "text": ["When the applied voltage drops to zero, the capacitor begins to  discharge quickly due to the short time constant.", "When the applied voltage drops to zero, the capacitor begins to discharge quickly ss C1."], "jumps": ["P1380", "P1330"]}, {"id": "P1370", "text": ["It should be noted that the capacitive reactance formula  \nXc = 1/(2p\u0083C) only applies to sine waves.", "It should be noted that the capacitive reactance formula Xc = 1/(2p"], "jumps": ["P1375", "P1330"]}, {"id": "P1375", "text": ["Remember that for sine waves, capacitive current leads voltage by 90\u00ba.", "Remember that for sine waves, capacitive current leads voltage by 90"], "jumps": ["P1335", "P1330"]}, {"id": "P1380", "text": ["There are many useful applications for RC circuits. A camera uses an  RC circuit to fire a flash bulb.", "There are many useful applications for RC circuits. A camera uses an RC circuit to fire a flash bulb."], "jumps": ["P1390", "P1330"]}, {"id": "P1390", "text": ["With S1 in the charge position, C1 charges through R1.  It takes 5 time constants (2 seconds) to charge to the applied voltage.", "With S1 in the charge position, C1 charges through R1. It takes 5 time constants (2 seconds) to charge to the applied voltage."], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["The charging current is maximum at the beginning of charge.  Since the capacitor appears as a short the first instant, maximum current is 2 mA.", "The charging current is maximum at the beginning of charge. Since the capacitor appears as a short the first instant, maximum current is 2 mA."], "jumps": ["P1410", "P1380"]}, {"id": "P1410", "text": ["When the shutter is opened, S1 allows C1 to discharge through the flashbulb. Its resistance is low compared to R1. The RC time constant is very short."], "jumps": ["P1420", "P1380"]}, {"id": "P1420", "text": ["It takes 5 time constants (0.001 seconds) for C1 to discharge through the small resistance of the bulb."], "jumps": ["P1430", "P1380"]}, {"id": "P1430", "text": ["Notice the extremely high current that is produced at the beginning of discharge. The battery in a camera is only capable of supplying low current."], "jumps": ["P1440", "P1380"]}, {"id": "P1440", "text": ["Another application of the RC time constant is found in coupling capacitors."], "jumps": ["P1450", "P1380"]}, {"id": "P1450", "text": ["Coupling capacitors are used to pass only the AC component of pulsating DC."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["In this circuit, the input is a 10 Vpp signal \"riding\" on a 5 VDC level."], "jumps": ["P1470", "P1440"]}, {"id": "P1470", "text": ["C1 will charge to the average DC level of 5 VDC. If the input remains at this level, no current flows and  as a result, the voltage drop across R1 is zero.", "C1 will charge to the average DC level of 5 VDC. If the input remains at this level, no current flows and as a result, the voltage drop across R1 is zero.", "C1 will charge to the average DC level of 5 VDC. If the input remains at this level, there is no flow of charge and as a result, the voltage drop across R1 is zero.", "C1 will charge to the average DC level of 5 VDC. If the input remains at this level, no current flows and as a result, the voltage drop across R1 is zero. g"], "jumps": ["P1480", "P1440"]}, {"id": "P1480", "text": ["If the input increases or decreases, charge or discharge current will result. Since these currents are in opposite directions, AC is the result across R1."], "jumps": ["P1490", "P1440"]}, {"id": "P1490", "text": ["All of the AC component and none of the DC component is dropped across R1. All of the DC component and none of the AC component is dropped across C1."], "jumps": ["P1500", "P1440"]}, {"id": "P1500", "text": ["For coupling capacitors to work, a long time constant is required so that C1 has little time to charge and discharge with input variations (AC component).", "For coupling capacitors to work, a long time constant is required so that C1 has little time to charge and discharge with input variations (AC component)..nt)."], "jumps": ["P1510", "P1440"]}, {"id": "P1510", "text": ["A short time constant would cause C1 to have capacitive reactance and s let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
