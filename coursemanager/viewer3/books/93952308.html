....................................."], "jumps": ["P14440"]}, {"id": "P14440", "text": ["10.  Decrease R4 on PC130-13 to minimum.  Notice the phase               difference approaches 90 degrees.  The inductive branch                becomes almost all inductive.", "10. Decrease R4 on PC130-13 to minimum. Notice the phase difference approaches 90 degrees. The inductive branch becomes almost all inductive."], "jumps": ["P14450", "P14430"]}, {"id": "P14430", "text": ["9.  Increase R4 on PC130-13 to maximum.  Notice the phase                difference approaches 0 degrees.  The inductive branch                  becomes almost all resistive.", "9. Increase R4 on PC130-13 to maximum. Notice the phase difference approaches 0 degrees. The inductive branch becomes almost all resistive."], "jumps": ["P14440", "P14420"]}, {"id": "P14420", "text": ["7.  Return the function generator frequency to 50 kHz.\n8.  Set S5 DOWN on PC130-13.  Notice that the phase difference          increased.  L4 is removed from the circuit.   Inductance                    increased which increased XL.  The inductive branch                       becomes more inductive.", "7. Return the function generator frequency to 50 kHz. 8. Set S5 DOWN on PC130-13. Notice that the phase difference increased. L4 is removed from the circuit. Inductance increased which increased XL. The inductive branch becomes more inductive."], "jumps": ["P14430", "P14410"]}, {"id": "P14410", "text": ["A lower frequency than 50 kHz decreases XL.  The inductive branch starts to become pure resistive and the phase difference between the two branches in the parallel circuit approaches \n0 degrees.", "A lower frequency than 50 kHz decreases XL. The inductive branch starts to become pure resistive and the phase difference between the two branches in the parallel circuit approaches 0 degrees."], "jumps": ["P14420", "P14400"]}, {"id": "P14400", "text": ["A higher frequency than 50 kHz increases XL.  The inductive branch starts to become nce approaches 90 degrees. The inductive branch becomes almost all inductive."], "jumps": ["P13450", "P13430"]}, {"id": "P13430", "text": ["9.  Increase R4 on PC130-13 to maximum.  Notice the phase                difference approaches 0 degrees.  The inductive branch                  becomes almost all resistive.", "9. Increase R4 on PC130-13 to maximum. Notice the phase difference approaches 0 degrees. The inductive branch becomes almost all resistive."], "jumps": ["P13440", "P13420"]}, {"id": "P13420", "text": ["7.  Return the function generator frequency to 50 kHz.\n8.  Set S5 DOWN on PC130-13.  Notice that the phase difference          increased.  L4 is removed from the circuit.   Inductance                    increased which increased XL.  The inductive branch                       becomes more inductive.", "7. Return the function generator frequency to 50 kHz. 8. Set S5 DOWN on PC130-13. Notice that the phase difference increased. L4 is removed from the circuit. Inductance increased which increased XL. The inductive branch becomes more inductive."], "jumps": ["P13430", "P13410"]}, {"id": "P13410", "text": ["A lower frequency than 50 kHz decreases XL.  The inductive branch starts to become pure resistive and the phase difference between the two branches in the parallel circuit approaches 0 degrees.", "A lower frequency than 50 kHz decreases XL. The inductive branch starts to become pure resistive and the phase difference between the two branches in the parallel circuit approaches 0 degrees..."], "jumps": ["P13420", "P13400"]}, {"id": "P13400", "text": ["A higher frequency than 50 kHz increases XL.  The inductive branch starts to become pure inductive and the phase difference between the two branches in the parallel circuit approaches 90 degrees.", "A higher frequency than 50 kHz increases XL. The inductive branch starts to become pure inductive and the phase difference between the two branches in the parallel circuit approaches 90 degrees..."], "jumps": ["P1341  and the phase difference between the two branches in the parallel circuit approaches \n90 degrees.", "A higher frequency than 50 kHz increases XL. The inductive branch starts to become pure inductive and the phase difference between the two branches in the parallel circuit approaches 90 degrees."], "jumps": ["P1410", "P1390"]}, {"id": "P1390", "text": ["6.  Vary the frequency on the function generator.  Notice that the         phase difference changes.  You are changing the value of XL         which changes IL.  When IL changes due to frequency                    change, total current also changes.", "6. Vary the frequency on the function generator. Notice that the phase difference changes. You are changing the value of XL which changes IL. When IL changes due to frequency change, total current also changes..."], "jumps": ["P1400", "P1380"]}, {"id": "P1380", "text": ["5.  Place CH2 probe to TP6. Use TP1 as oscilloscope ground.             Notice the zero crossing points on the oscilloscope display.          This indicates the overall phase difference in the circuit.", "5. Place CH2 probe to TP6. Use TP1 as oscilloscope ground. Notice the zero crossing points on the oscilloscope display. This indicates the overall phase difference in the circuit."], "jumps": ["P1390", "P1370"]}, {"id": "P1370", "text": ["2.  Place CH1 probe on TP2. Use TP1 as oscilloscope ground.       3.  Adjust the Time/Div variable control to display one complete          cycle.     \n4.  Adjust the trigger level control so that T0 equals 0 volts.", "2. Place CH1 probe on TP2. Use TP1 as oscilloscope ground. 3. Adjust the Time/Div variable control to display one complete cycle. 4. Adjust the trigger level control so that T0 equals 0 volts. ime/Div = 1", "sec Volts/Div CH1 = 1 AC T0 = 0 V Volts/Div CH2 = 1 AC CH1 - TP222222222222222222222222222222222222222222222222222222222222222222222", "Time/Div = 2 msec Volts/Div CH1 = 1 AC Volts/Div CH2 = 1 AC CH1 - TP222222222222"], "jumps": ["P1380", "P1360" let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
