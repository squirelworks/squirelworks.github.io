s located within the Transmitter section.", "This card is located within the Transmitter section..........", "Signal Generator Time Division Multiplexer Fiber Optic Transmitterrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr", "Fiber Optic Receiver Time Division Demultiplexer Audio Driverrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr"], "jumps": []}, {"id": "P2337", "text": ["RECEIVER CONSOLE SPEAKER SWITCH - Set the Receiver Test Console SPEAKER switch to ON. Adjust the VOLUME control on PC130-303 to a comfortable level."], "jumps": ["P2330", "P2335"]}, {"id": "P1270", "text": ["Which type of multiplexing divides the input signals into time segments and is the most commonly used method in fiber optics?"], "jumps": ["P1800"]}, {"id": "P1130", "text": ["What area of signal processing involves removing noise and separating signals from one another?"], "jumps": ["P1060"]}, {"id": "P1140", "text": ["Which area of signal processing involves combining numerous information signals?"], "jumps": ["P1130"]}, {"id": "P1100", "text": ["Modulation is the process of modifying a carrier wave so it has some of the characteristics of another signal.  This process allows information to be encoded onto the carrier wave. Demodulation is the reverse of modulation.", "Modulation is the process of modifying a carrier wave so it has some of the characteristics of another signal. This process allows information to be encoded onto the carrier wave. Demodulation is the reverse of modulation."], "jumps": ["P1110", "P1060"]}, {"id": "P1110", "text": ["Multiplexing is a process that allows several information signals to be transmitted over the same waveguide simultaneously. Separating the multiplexed signal into its original parts is demultiplexing."], "jumps": ["P1120", "P1060"]}, {"id": "P1070", "text": ["Amplification increases the signal's amplitude to a usable level."], "jumps": ["P1080", "P1060"]}, {"id": "P1160", "text": ["AM stands for amplitude modulation.  AM adjusts the amplitude of the carrier signal to reflect the information signal.  This method is used for AM radio.", "AM stands for amplitude modulation. AM adjusts the amplitude of the carrier signal to reflect the information signal. This method is used for AM radio."], "jumps": ["P1170", "P1150"]}, {"id": "P1250", "text": ["Frequency-division multiplexing (FDM) combines the frequencies of the signals.  Each input signal must operate within a specified frequency range in order to demultiplex the signals properly.  The uniqueness of the individual input signals may be lost if the frequencies are too close to each other.", "Frequency-division multiplexing (FDM) combines the frequencies of the signals. Each input signal must operate within a specified frequency range in order to demultiplex the signals properly. The uniqueness of the individual input signals may be lost if the frequencies are too close to each other."], "jumps": ["P1260", "P1220"]}, {"id": "P13180", "text": ["9.  Connect an alligator-to-alligator jumper cable from the 2000            Hz - TP of PC130-322 to TP4 of PC130-305.  \n10.  Set R22, R23, R24, and R25 of PC130-305 to mid-range.", "9. Connect an alligator-to-alligator jumper cable from the 2000 Hz - TP of PC130-322 to TP4 of PC130-305. 10. Set R22, R23, R24, and R25 of PC130-305 to mid-range."], "jumps": ["P13190", "P13185"]}, {"id": "P13216", "text": ["How many of the generated signals to be transmitted are shown on the TDM multiplexed frame?", "We know that a fiber optic system takes an electrical input signal, changes the signal to light, transmits the light over a fiber optic    cable, and then changes the light back into an output signal.", "We know that a fiber optic system takes an electrical input signal, changes the signal to light, transmits the light over a fiber optic cable, and then changes the light back into an output signal."], "jumps": ["P13211"]}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", " let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
