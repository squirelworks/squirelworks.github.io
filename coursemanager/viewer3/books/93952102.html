const book = {"title": "93952102", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: GENERATING ELECTRICITYf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Calculate peak, peak-to-peak, average, and RMS values. w Identify in and out of phase. w Identify magnitude and degree of an AC wave using vectors.......", "w Explain the operation of an AC generator. w Identify values of voltage and current at various electrical degrees.", "w Define the characteristics of induction. w Determine magnitude and polarity of voltage produced in a magnetic field."], "jumps": ["P300", "P10"]}, {"id": "P300", "text": [], "jumps": ["P400", "P100"]}, {"id": "P400", "text": ["Alternating Current is one of the most useful phenomena known to man.", "Alternating Current is one of the most useful phenomena known to man.. known to man."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Most people know that turning a switch from off to on will light a lamp."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["What most people don't know is how AC is generated."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["To be a technician, you must know how AC is generated.", "To be a technician, you must know how AC is generated......"], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Learning how magnetism and AC are related will help you calculate values.", "Learning how magnetism and AC are related will help you calculate values. = f f"], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["Let's begin the lesson on GENERATING ELECTRICITY.........................."], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": ["P450"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Induction is the generation of AC current by changing a magnetic field (flux variation).", "Induction is the generation of AC current by changing a magnetic field (flux variation).."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["If the flux variation is low, induction is low and only a small amount of current is produced."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["If the flux variation is high, induction is high and a larger amount of current is produced.", "You learned in DC that magnets produce a magnetic field.", "You learned in DC that magnets produce a magnetic field...."], "jumps": ["P1050", "P1020", "P1060"]}, {"id": "P1060", "text": ["When two unlike poles are brought together a pulling force is generated."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["When two like poles are brought together a pushing force is generated."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["The force produced by a magnetic field is measured in the density of flux lines developed."], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["More flux lines create a stronger magnetic field and allow for higher induction."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["Fewer flux lines create a weaker magnetic field and allow for lower induction."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["In order to induce current, three things are required:  \n                                      - a conductor \n                                      - a magnetic field\n                                      - relative motion", "In order to induce current, three things are required: - a conductor - a magnetic field - relative motion..."], "jumps": ["P1120", "P1080"]}, {"id": "P1120", "text": ["Current is induced by moving a conductor through a stationary magnetic field. - a conductor - a magnetic field - relative motion...", "Current can also be induced by moving a magnetic field around a stationary conductor. - a conductor - a magnetic field - relative motion..."], "jumps": ["P1130", "P1110", "P1140", "P1120"]}, {"id": "P1140", "text": ["Wire is a common conductor.  Placing a wire into a magnetic field produces a small electrical current.", "Wire is a common conductor. Placing a wire into a magnetic field produces a small electrical current."], "jumps": ["P1150", "P1110"]}, {"id": "P1150", "text": ["Moving the wire through the magnetic field disturbs the flux lines and creates a larger current."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["The magnetic field produced expands outward from the center of the conductor."], "jumps": ["P1171", "P1170", "P1140"]}, {"id": "P1170", "text": ["Use the left-hand rule to determine the direction of the magnetic field around the conductor.", "Use the left-hand rule to determine the direction of the magnetic field around the conductor.."], "jumps": ["P1180", "P1140"]}, {"id": "P1171", "text": ["Use the right-hand rule to determine the direction of the magnetic field around the conductor."], "jumps": ["P1180", "P1140"]}, {"id": "P1172", "text": ["Use the left-hand rule to determine the direction of the magnetic field around the conductor.", "Use the left-hand rule to determine the direction of the magnetic field around the conductor.."], "jumps": ["P1180", "P1140"]}, {"id": "P1173", "text": ["Use the right-hand rule to determine the direction of the magnetic field around the conductor."], "jumps": ["P1180", "P1140"]}, {"id": "P1175", "text": ["LEFT-HAND RULE - The left hand rule says to grasp the conductor with the left hand, pointing the thumb in the direction of current flow. Your fingers will fold around the conductor in the direction of the flux lines."], "jumps": []}, {"id": "P1176", "text": ["RIGHT-HAND RULE - The right hand rule says to grasp the conductor with the right hand, pointing the thumb in the direction of current. Your fingers will fold around the conductor in the direction of the flux lines."], "jumps": []}, {"id": "P1180", "text": ["Which conductor's flux lines are moving in the correct direction?"], "jumps": ["P1173", "P1172"]}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1182", "text": ["Remember the left hand rule. Grasp the conductor with the left hand pointing the thumb in the direction of current flow.  Your fingers will fold around the conductor in the direction of the flux lines.", "Remember the left hand rule. Grasp the conductor with the left hand pointing the thumb in the direction of current flow. Your fingers will fold around the conductor in the direction of the flux lines."], "jumps": []}, {"id": "P1183", "text": ["Remember the right hand rule. Grasp the conductor with the right hand pointing the thumb in the direction of current.  Your fingers will fold around the conductor in the direction of the flux lines.", "Remember the right hand rule. Grasp the conductor with the right hand pointing the thumb in the direction of current. Your fingers will fold around the conductor in the direction of the flux lines.ines."], "jumps": []}, {"id": "P1190", "text": ["Induction occurs when _______", "a conductor passes through a magnetic field.", "Induction occurs when _______prefix........................"], "jumps": []}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1192", "text": ["Induction is caused when a conductor is passed through flux lines.  Removing flux lines will stop induction.", "Induction is caused when a conductor is passed through flux lines. Removing flux lines will stop induction."], "jumps": []}, {"id": "P1193", "text": ["Remember, three things are required for induction to occur. A conductor is needed and a magnetic field is needed.", "Remember, three things are required for induction to occur. A conductor is needed and a magnetic field is needed.d."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on INDUCTION.", "This completes the information on INDUCTION.1 TITLE........"], "jumps": ["P1001", "P1190"]}, {"id": "P1920", "text": ["1.  Induction is the varying magnetic flux in a magnetic field for \n     the purposes of generating AC current.", "1. Induction is the varying magnetic flux in a magnetic field for the purposes of generating AC current. rent."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  If the flux variation is low, induction is low and only a small             amount of current is produced.", "2. If the flux variation is low, induction is low and only a small amount of current is produced.."], "jumps": ["P1940"]}, {"id": "P1940", "text": ["3.  If the flux variation is high, induction is high and a larger                  amount of current is produced.", "3. If the flux variation is high, induction is high and a larger amount of current is produced."], "jumps": ["P1999", "P1920"]}, {"id": "P1999", "text": ["You have completed the Summary.\n You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1920"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["AC power is generated by moving a conductor through a magnetic field."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["When the conductor and magnetic field are stationary, no voltage is developed."], "jumps": ["P2050"]}, {"id": "P2050", "text": ["Moving either the conductor or the magnetic field will produce voltage in the conductor."], "jumps": ["P2060", "P2020"]}, {"id": "P2060", "text": ["In this example the conductor is moved through a stationary magnetic field."], "jumps": ["P2070", "P2020"]}, {"id": "P2070", "text": ["The 360\u00ba circle graph and the sine wave line graph are provided to help you visualize the operation.", "circle graph and the sine wave line graph are provided to help you visualize the operation."], "jumps": ["P2080", "P2020"]}, {"id": "P2080", "text": ["Rotating the conductor 1/4 turn cuts the maximum number of flux lines.  The induced voltage is 10 volts.", "Rotating the conductor 1/4 turn cuts the maximum number of flux lines. The induced voltage is 10 volts."], "jumps": ["P2090", "P2020"]}, {"id": "P2090", "text": ["The circle graph indicates the conductor is at the 90\u00ba position. The line graph shows a positive 1/4 cycle sine wave.", "The circle graph indicates the conductor is at the 90", "position. The line graph shows a positive 1/4 cycle sine wave."], "jumps": ["P2100", "P2020"]}, {"id": "P2100", "text": ["As the conductor rotates 1/2 turn, fewer flux lines are cut.  The induced voltage reduces to 0 volts.", "As the conductor rotates 1/2 turn, fewer flux lines are cut. The induced voltage reduces to 0 volts."], "jumps": ["P2110", "P2020"]}, {"id": "P2110", "text": ["The graph shows that voltage is zero at 0\u00ba and 180\u00ba.", "The graph shows that voltage is zero at 0"], "jumps": ["P2120", "P2020"]}, {"id": "P2120", "text": ["Continuing the rotation 3/4 turns induces 10 volts again.  Notice however, the polarity is negative.", "Continuing the rotation 3/4 turns induces 10 volts again. Notice however, the polarity is negative."], "jumps": ["P2130", "P2020"]}, {"id": "P2130", "text": ["The graph shows that voltage is maximum at 90\u00ba and 270\u00ba.", "The graph shows that voltage is maximum at 90"], "jumps": ["P2140", "P2020"]}, {"id": "P2140", "text": ["Completing 1 full rotation or one cycle reduces the voltage to 0 volts again."], "jumps": ["P2150", "P2020"]}, {"id": "P2150", "text": ["Note that one complete rotation developed one complete sine wave."], "jumps": ["P2160", "P2020"]}, {"id": "P2160", "text": ["If one rotation occurs each second, what is the frequency of this sine wave?"], "jumps": []}, {"id": "P2161", "text": [], "jumps": []}, {"id": "P2162", "text": ["Remember, the frequency of a sine wave is determined by the number of cycles that occur in 1 second.  If only 1 cycle occurs, then the frequency is 1 Hz.", "Remember, the frequency of a sine wave is determined by the number of cycles that occur in 1 second. If only 1 cycle occurs, then the frequency is 1 Hz."], "jumps": []}, {"id": "P2164", "text": ["FREQUENCY - Frequency is determined by the number of cycles that occur in one second. In this example 3 cycles occur in 1 second producing a frequency of 3 Hz."], "jumps": []}, {"id": "P2170", "text": ["As the generator rotates faster more cycles per second are developed.  The frequency increases as cycles increase.", "As the generator rotates faster more cycles per second are developed. The frequency increases as cycles increase."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["Slowing the generator's rotation decreases the cycles per second and lowers the frequency."], "jumps": ["P2181"]}, {"id": "P2181", "text": ["Some sine waves are not generated beginning at 0\u00ba.  These are non- standard cycle waves.", "Some sine waves are not generated beginning at 0"], "jumps": ["P2183", "P2170"]}, {"id": "P2183", "text": ["For example, a wave beginning at 90\u00ba will complete a 360\u00ba cycle at 90\u00ba.  This is a non-standard cycle."], "jumps": ["P2185", "P2181"]}, {"id": "P2185", "text": ["A wave beginning at 135\u00ba will complete a 360\u00ba cycle at 135\u00ba.  This also is a non-standard cycle."], "jumps": ["P2187", "P2181"]}, {"id": "P2187", "text": ["Select the non-standard cycle beginning at 90\u00ba.", "Select the non-standard cycle beginning at 90"], "jumps": []}, {"id": "P2189", "text": [], "jumps": []}, {"id": "P2190", "text": ["There are four methods used to describe AC voltage or current represented in a sine wave."], "jumps": ["P2200", "P2194"]}, {"id": "P2192", "text": ["Remember, the waveform must complete a cycle of 360\u00ba starting and ending at 90\u00ba.", "Remember, the waveform must complete a cycle of 360"], "jumps": []}, {"id": "P2194", "text": ["Select the non-standard cycle beginning at 135\u00ba.", "Select the non-standard cycle beginning at 135"], "jumps": ["P2187"]}, {"id": "P2196", "text": [], "jumps": []}, {"id": "P2197", "text": ["Remember, the waveform must complete a cycle of 360\u00ba starting and ending 135\u00ba.", "Remember, the waveform must complete a cycle of 360"], "jumps": []}, {"id": "P2200", "text": ["The two simplest methods are; peak value and peak-to-peak value."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["Peak voltage of this sine wave is 10.  Peak is determined by the highest positive or negative voltage obtained.", "Peak voltage of this sine wave is 10. Peak is determined by the highest positive or negative voltage obtained."], "jumps": ["P2220", "P2190"]}, {"id": "P2220", "text": ["The peak-to-peak value of this sine wave is determined by doubling the peak value."], "jumps": ["P2230", "P2190"]}, {"id": "P2230", "text": ["Two other methods are Average and RMS.  These values state the usable amount of voltage being produced.", "Two other methods are Average and RMS. These values state the usable amount of voltage being produced."], "jumps": ["P2190"]}, {"id": "P2240", "text": ["Average value is calculated using the sum of all angles contained in 180\u00ba.  The constant 0.637 is used.", "Average value is calculated using the sum of all angles contained in 180"], "jumps": ["P2250", "P2190"]}, {"id": "P2250", "text": ["Average is determined by multiplying .637 x the peak value of the sine wave.  In this example .637 x 10 = 6.37 volts.", "Average is determined by multiplying .637 x the peak value of the sine wave. In this example .637 x 10 = 6.37 volts."], "jumps": ["P2260", "P2190"]}, {"id": "P2260", "text": ["The most common method used in describing the voltage of a sine wave is RMS. RMS equals .707 x the peak value.."], "jumps": ["P2270", "P2190"]}, {"id": "P2265", "text": ["ROOT-MEAN-SQUARE (RMS) - The most common calculation is Root-Mean-Square. This is a comparison between the power generated in an AC signal with that of an equivalent DC voltage."], "jumps": []}, {"id": "P2270", "text": ["What is the RMS value for this sine wave?", "What is the RMS value for this sine wave?.................."], "jumps": []}, {"id": "P2271", "text": [], "jumps": []}, {"id": "P2272", "text": ["The average voltage is 6.37 volts.  RMS is calculated by multiplying 0.707 x the peak voltage.", "The average voltage is 6.37 volts. RMS is calculated by multiplying 0.707 x the peak voltage.."], "jumps": []}, {"id": "P2273", "text": ["The peak voltage is 10 volts.  RMS is calculated by multiplying 0.707 x peak voltage.", "The peak voltage is 10 volts. RMS is calculated by multiplying 0.707 x peak voltage."], "jumps": []}, {"id": "P2278", "text": ["RMS FORMULA - RMS equals 0.707 times the peak value of the sine wave. This sine wave has a peak value of 10 volts."], "jumps": []}, {"id": "P2280", "text": ["Select the positive half cycle of this sine wave.", "Select the positive half cycle of this sine wave..........."], "jumps": []}, {"id": "P2281", "text": [], "jumps": []}, {"id": "P2282", "text": ["You selected the negative half cycle.  Note, that the positive half cycle is above the zero base line.", "You selected the negative half cycle. Note, that the positive half cycle is above the zero base line."], "jumps": []}, {"id": "P2290", "text": ["What is the RMS value of this sine wave?", "What is the RMS value of this sine wave?..................."], "jumps": []}, {"id": "P2291", "text": [], "jumps": []}, {"id": "P2292", "text": ["You multiplied 0.707 times the peak-to-peak voltage.  RMS is determined by multiplying 0.707 x the peak voltage.", "You multiplied 0.707 times the peak-to-peak voltage. RMS is determined by multiplying 0.707 x the peak voltage.."], "jumps": []}, {"id": "P2293", "text": ["You calculated the average value.  RMS is determined by multiplying 0.707 x the peak voltage.", "You calculated the average value. RMS is determined by multiplying 0.707 x the peak voltage."], "jumps": []}, {"id": "P2297", "text": ["RMS FORMULA - RMS equals 0.707 times the peak value of the sine wave. This sine wave has a peak value of 10 volts."], "jumps": ["P2290"]}, {"id": "P2300", "text": ["What is the average value of this sine wave?", "What is the average value of this sine wave?..............."], "jumps": []}, {"id": "P2301", "text": [], "jumps": []}, {"id": "P2302", "text": ["You calculated the RMS value.  Average is determined by multiplying 0.637 x the peak value.", "You calculated the RMS value. Average is determined by multiplying 0.637 x the peak value."], "jumps": []}, {"id": "P2303", "text": ["You multiplied 0.637 and the peak-to-peak value.  Average is determined by multiplying 0.637 times the peak value.", "You multiplied 0.637 and the peak-to-peak value. Average is determined by multiplying 0.637 times the peak value."], "jumps": []}, {"id": "P2307", "text": ["AVERAGE FORMULA - AVG equals 0.637 times the peak value of the sine wave. This sine wave has a peak value of 10 volts."], "jumps": []}, {"id": "P2310", "text": ["What is the Peak value of this sine wave?", "What is the Peak value of this sine wave?.................."], "jumps": []}, {"id": "P2311", "text": [], "jumps": []}, {"id": "P2312", "text": ["You selected the peak-to-peak voltage.  Remember, the peak value is determined by the highest positive or negative point.", "You selected the peak-to-peak voltage. Remember, the peak value is determined by the highest positive or negative point."], "jumps": []}, {"id": "P2313", "text": ["Remember, the peak value is determined by the highest positive or negative point."], "jumps": []}, {"id": "P2317", "text": ["PEAK VOLTAGE - Peak voltage is equal to the maximum positive or maximum negative value of the sine wave."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on GENERATING AC VOLTAGE.", "This completes the information on GENERATING AC VOLTAGE...."], "jumps": ["P2001", "P2310"]}, {"id": "P2920", "text": ["1.  AC power is generated by moving a conductor through a                magnetic field.", "1. AC power is generated by moving a conductor through a magnetic field."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2.  When the conductor and magnetic field are stationary, no                voltage is developed.", "3.  Moving either the conductor or the magnetic field will produce       voltage in the conductor.", "2. When the conductor and magnetic field are stationary, no voltage is developed..", "3. Moving either the conductor or the magnetic field will produce voltage in the conductor."], "jumps": ["P2940", "P2999"]}, {"id": "P2999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu..."], "jumps": ["P2001", "P2940"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3020", "text": ["Sine wave calculations include; peak, peak-to-peak, average and RMS."], "jumps": ["P3030", "P3001"]}, {"id": "P3030", "text": ["Peak voltage is measured from the baseline to the most positive or negative point on the sine wave."], "jumps": ["P3040", "P3020"]}, {"id": "P3040", "text": ["The peak-to-peak voltage is measured from the most positive point to the most negative point on the sine wave."], "jumps": ["P3050", "P3030"]}, {"id": "P3050", "text": ["Select the sine wave with a peak-to-peak value of 30 volts.", "Select the sine wave with a peak-to-peak value of 30 volts. t#: 3 Quest#: 40"], "jumps": []}, {"id": "P3051", "text": [], "jumps": []}, {"id": "P3052", "text": ["Remember that peak-to-peak voltage is the voltage from the most positive to the most negative point on a sine wave.", "Remember that peak-to-peak voltage is the voltage from the most positive to the most negative point on a sine wave.."], "jumps": []}, {"id": "P3060", "text": ["The sine wave is actually many instantaneous voltage values. There are an infinite number of values within one complete cycle.", "The sine wave is actually many instantaneous voltage values. There are an infinite number of values within one complete cycle.any different values from 0"], "jumps": ["P3070", "P3050"]}, {"id": "P3070", "text": ["In this circuit E is 170 Vpk. You must multiply 170 x 0.637 to find \nE (average).", "In this circuit E is 170 Vpk. You must multiply 170 x 0.637 to find E (average)."], "jumps": ["P3080", "P3060"]}, {"id": "P3080", "text": ["What is the average voltage of this AC circuit.", "What is the average voltage of this AC circuit............."], "jumps": []}, {"id": "P3081", "text": [], "jumps": []}, {"id": "P3082", "text": ["Remember, the average voltage is equal to 0.637 times the peak voltage."], "jumps": []}, {"id": "P3087", "text": ["AVERAGE FORMULA - AVG equals 0.637 times the peak value of the sine wave. This sine wave has a peak value of 10 volts."], "jumps": []}, {"id": "P3090", "text": ["The most common calculation is Root-Mean-Square (RMS).", "The most common calculation is Root-Mean-Square (RMS). is is a comparison between AC and DC values."], "jumps": ["P3100", "P3080"]}, {"id": "P3100", "text": ["For example, 120 VAC RMS is equivalent to 120 VDC."], "jumps": ["P3110", "P3090"]}, {"id": "P3110", "text": ["Stated differently AC is only  70.7% as effective as DC.", "Stated differently AC is only 70.7% as effective as DC."], "jumps": ["P3120", "P3090"]}, {"id": "P3120", "text": ["The formula is E (RMS) = 0.707 x E (peak)."], "jumps": ["P3130", "P3090"]}, {"id": "P3130", "text": ["What is the RMS voltage of this AC circuit.", "What is the RMS voltage of this AC circuit................."], "jumps": []}, {"id": "P3131", "text": [], "jumps": []}, {"id": "P3132", "text": ["E (RMS) = 0.707 X 300 or 212 VAC.  This indicates that 300 VAC is only as effective as 212 VDC.", "E (RMS) = 0.707 X 300 or 212 VAC. This indicates that 300 VAC is only as effective as 212 VDC."], "jumps": []}, {"id": "P3137", "text": ["RMS FORMULA - RMS equals 0.707 times the peak value of the sine wave. This sine wave has a peak value of 10 volts."], "jumps": []}, {"id": "P3140", "text": ["Now let's look at the phase angle of two sine waves.", "Now let's look at the phase angle of two sine waves........"], "jumps": ["P3150", "P3130"]}, {"id": "P3150", "text": ["Wave A starts at 0\u00ba and wave B starts at 90\u00ba.  Wave A is described as leading wave B by 90\u00ba.", ". Wave A is described as leading wave B by 90"], "jumps": ["P3160", "P3140"]}, {"id": "P3160", "text": ["Wave B can also be described as lagging wave A by 90\u00ba.", "Wave B can also be described as lagging wave A by 90"], "jumps": ["P3170"]}, {"id": "P3170", "text": ["The amount by which waveforms lead or lag one another is called phase angle."], "jumps": ["P3180", "P3140"]}, {"id": "P3180", "text": ["These two waveforms are said to be 90\u00ba  \"out of phase\"."], "jumps": ["P3190", "P3140"]}, {"id": "P3190", "text": ["How many degrees does waveform A lead waveform B?", "How many degrees does waveform A lead waveform B?.........."], "jumps": ["P3140"]}, {"id": "P3191", "text": [], "jumps": []}, {"id": "P3192", "text": ["If wave A starts at 0\u00ba and wave B starts at 120\u00ba then wave B lags A by 120\u00ba."], "jumps": ["P3190"]}, {"id": "P3200", "text": ["Waveforms that are 180\u00ba out of phase have peaks of opposite polarity occurring at the same time.", "out of phase have peaks of opposite polarity occurring at the same time."], "jumps": ["P3210", "P3190"]}, {"id": "P3210", "text": ["If waveforms A and B start at the same time, the waves are in phase.  The peaks occur at the same time.", "If waveforms A and B start at the same time, the waves are in phase. The peaks occur at the same time."], "jumps": ["P3220", "P3200"]}, {"id": "P3220", "text": ["These phase relationships can be expressed using vectors.  Vectors are another type of graph used to explain AC voltage or current.", "These phase relationships can be expressed using vectors. Vectors are another type of graph used to explain AC voltage or current."], "jumps": ["P3230", "P3210"]}, {"id": "P3230", "text": ["The length of a vector represents the magnitude or the amount of peak voltage or current."], "jumps": ["P3240", "P3220"]}, {"id": "P3240", "text": ["A sine wave with a peak value of 5 volts is represented by a vector 5 units long."], "jumps": ["P3250", "P3220"]}, {"id": "P3250", "text": ["The direction represents the phase or the degree at which the sine wave is being monitored."], "jumps": ["P3260", "P3220"]}, {"id": "P3260", "text": ["This vector represents the sine wave at 135\u00ba with a peak voltage of 5 volts.", "This vector represents the sine wave at 135"], "jumps": ["P3270", "P3220"]}, {"id": "P3270", "text": ["This vector represents the sine wave at 270\u00ba.", "This vector represents the sine wave at 270"], "jumps": ["P3280", "P3220"]}, {"id": "P3280", "text": ["The phase angle of two waveforms is expressed using two vectors called Phasors.", "The phase angle of two waveforms is expressed using two vectors called Phasors.."], "jumps": ["P3282", "P3220"]}, {"id": "P3282", "text": ["Phasor notation requires that one waveform be chosen as the reference and placed at the 0\u00ba point.  Here,  waveform A is the reference.", "Phasor notation requires that one waveform be chosen as the reference and placed at the 0", let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
