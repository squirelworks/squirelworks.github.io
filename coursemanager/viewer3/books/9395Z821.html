d": "P10236", "text": ["Use a hydrometer to check the specific gravity of the electrolyte.", "How do you determine the state of charge of a NICAD battery?", "Use a multimeter to check the DC terminal voltage.", "Use a ammeter to determine the load current.", "Discharge the battery at a constant current rate while monitoring its time to full discharge."], "jumps": []}, {"id": "P10237", "text": ["What causes Thermal Runaway in a NICAD battery?", "Rapid battery drain followed by a strong voltage charge", "Rapid battery discharge followed by equalization"], "jumps": []}, {"id": "P10238", "text": ["Stop charging immediately and monitor for Thermal Runaway.", "During the charging cycle of a NICAD battery, you observe that the case temperature is heating up too rapidly. What should you do?", "Nothing, this is normal during charging.", "Evacuate the area and continue charging the battery."], "jumps": []}, {"id": "P10239", "text": ["What can be done to prevent Memory Effect in NICAD batteries.", "Deep Cycle the battery on a regular schedule", "Perform topping charges every time the battery is used", "Nothing can be done to prevent the Memory Effect"], "jumps": []}, {"id": "P10240", "text": ["Alternating between two NICAD batteries on an aircraft", "What is the meaning of the term Deep Cycling?", "Using the battery in emergency situations only", "Completely discharging the battery, equalizing, and fully recharging.", "Regularly discharging the battery by 20% and recharging it to full charge"], "jumps": []}, {"id": "P10241", "text": ["The different metals used in the batteries will cause electrolysis.", "NICAD and Lead Acid battery shops should not be near each other because _______", "Normally the aircraft they support are not located near each other.", "The hangar electrical power cannot sustain two battery shops located together.", "The electrolyte solution for each battery is diametrically opposed and will cause damage to both types of batteries."], "jumps": []}, {"id": "P10242", "text": ["The neutralizing solution for a lead acid battery spill is _______", "Baking Soda (bicarbonate of soda) and water."], "jumps": []}, {"id": "P10243", "text": ["The electrolyte for a NICAD Battery has just been spilled in the shop. What solution must be used to neutralize the spill before rinsing the area?", "Lemon juice, vinegar, or a solution of 3% acetic acid and water"], "jumps": []}, {"id": "P10244", "text": ["To ensure proper ventilation in the battery shop, the air must be completely exchanged _______ times per hour.", "Not a concern as long as the door is left open during battery servicing"], "jumps": []}, {"id": "P10245", "text": ["Which of the following servicing conditions should met at all times in the battery shop?", "Never use a wire brush for cleaning battery tops.", "All of the above are servicing conditions."], "jumps": []}, {"id": "P10246", "text": ["What is the recommended fire extinguisher in a battery shop?"], "jumps": []}, {"id": "P10247", "text": ["When removing a battery with positive and negative terminal leads, which lead should be disconnected first?"], "jumps": []}, {"id": "P10248", "text": ["When should the electrolyte level in a NICAD battery be adjusted?", "During the end of a Deep Cycle discharge"], "jumps": []}, {"id": "P10249", "text": ["When the electrolyte temperature is between 70", "When should a temperature correction be used when checking the specific gravity level of a lead acid battery?", "When the temperature of the electrolyte is 80"], "jumps": []}, {"id": "P10250", "text": ["When preparing a new battery for its initial charge, the electrolyte must be mixed and added to the battery cells. How is the electrolyte mixed?"], "jumps": []}, {"id": "P10251", "text": ["Burnt marks or pitting on the connections.", "One sure sign that the metal links on a NICAD battery were not torqued properly would be _______", "Spring washers missing form under the hardware."], "jumps": []}, {"id": "P10252", "text": ["Determines the correct level of the electrolyte.", "What is the purpose of the Capacity Check when servicing a NICAD battery?", "Determines how much current is available at the terminals.", "Determines the state of charge of the battery.", "Determines if the hardware was torqued correctly."], "jumps": []}, {"id": "P10253", "text": ["In order to pass the Capacity Check, what must be the condition of the NICAD battery cells after 1 hour of discharge?"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped 20 questions. Do you want to __________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is 0%. Do you want to __________"], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "PINFO", "text": ["10-31-03 Converted from sty to tbk. frieda 11-02-03 Prepared lesson for graphics. frieda"], "jumps": []}, {"id": "PQINFO", "text": ["Page # Test# Question# HelpPage # 10210 1 110 410 10211 1 111 1350 10212 1 112 410 10213 1 113 1310 10214 1 114 1420 10215 1 115 1420 10216 1 116 1080 10217 1 117 1110 10218 1 118 1110 10219 1 119 1110 10220 1 120 1110 10221 1 121 1160 10222 1 122 1160 10223 1 123 1180 10224 1 124 1180 10225 1 125 1230 10226 1 126 1290 10227 1 127 1320 10228 1 128 2400 10229 1 129 1310 10230 1 130 1310 10231 1 131 1430 10232 1 132 1390 10233 1 133 2520 10234 1 134 2570 10235 1 135 2550 10236 1 136 1480 10237 1 137 1310 10238 1 138 1430 10239 1 139 1390 10240 2 140 1570 & 2720 10241 2 141 2020 10242 2 142 2180 10243 2 143 2190 10244 2 144 2050 10245 2 145 2090 10246 2 146 2240 10247 2 147 2330 10248 2 148 2830 10249 2 149 2410 10250 2 150 2520 10251 2 151 2640 10252 2 152 2690 10253 2 153 2690"], "jumps": []}, {"id": "P1290", "text": ["A fully charged Lead Acid battery will not freeze in moderately cold temperatures since its electrolyte is mostly acid, however, as the battery discharges, it is more susceptible to freezing as the percentage of the electrolyte solution becomes less acidic and more watery...", "As the battery discharges, it is more susceptible to freezing...."], "jumps": ["P1300", "P1270"]}, {"id": "P1310", "text": ["The charge of lead-acid battery can be determined by measuring the specific gravity of the electrolyte in each cell. The electrolyte in a fully charged cell will have a specific gravity of approximately 1.285 or greater while the electrolyte in a fully discharged cell will have a specific gravity of 1.150 or less..."], "jumps": ["P1320", "P1300"]}, {"id": "P1390", "text": ["The positive plate of a NICAD cell is made up of nickel-hydroxide. The negative plate is made up of cadmium-hydroxide. The reactant chemical in NICAD batteries is potassium hydroxide and water...."], "jumps": ["P1400", "P1360"]}, {"id": "P1410", "text": ["In a NICAD battery, each cell is contained in its own individual case. A vent cap on top of the cell allows gases to escape when internal pressure reaches 6 psi. Under 6 psi, the cap remains air tight to prevent accidental electrolyte leakage. The cap can be removed for servicing the cell..."], "jumps": ["P1420", "P1390"]}, {"id": "P1420", "text": ["The operation of a NICAD battery during charging and use is similar to the lead-acid. During normal use the electrons flow from the negative plates through the circuit to the positive plates and during charging, electrons are forced back to the negative plates..."], "jumps": ["P1430", "P1390"]}, {"id": "P1450", "text": ["Besides their light weight and no corrosive fume advantages, some additional advantages of NICAD batteries include; they can withstand a lot of vibration without failing, an idle NICAD can keep its charge almost indefinitely, and extreme cold temperatures do not cause battery damage...", "Extreme cold temperatures do not cause battery damage."], "jumps": ["P1460", "P1440"]}, {"id": "P1480", "text": ["Since the NICAD battery maintains a constant voltage for most of its charge life, you cannot determine the battery's state of charge by taking a voltage reading or testing the electrolyte. To determine the state of charge of a NICAD, you must discharge the battery at a known current rate and monitor the time to full discharge....."], "jumps": ["P1490", "P1460"]}, {"id": "P1601", "text": [], "jumps": []}, {"id": "P2480", "text": ["The aircraft maintains the battery's charge using the constant voltage method. It simply provides a voltage that is higher than the unloaded battery voltage. This forces the positive plates of the battery to give up electrons to the negative plate..."], "jumps": ["P2490", "P2470"]}, {"id": "P2500", "text": ["In the battery shop, you will more than likely use the constant current method. With this method, several batteries can be linked in series and charged simultaneously. The batteries can be in different states of discharge, however, they must be all rated (Ah rating) the same..."], "jumps": ["P2510", "P2490"]}, {"id": "P2752", "text": ["Any cell that has dropped below 0.95 volts during the 1 hour check is cause for failure. The battery must be fully recharged and another Capacity Check conducted."], "jumps": []}, {"id": "P2001", "text": ["AIRCRAFT BATTERY SERVICINGyyyyyyyyid Battery Maintenance (branch to P2300) NICAD Battery Maintenance (branch to P2600) Summary", "AIRCRAFT BATTERY SERVICING Lead Acid Battery Maintenance (branch to P2300) NICAD Battery Maintenance (branch to P2600) Summary"], "jumps": []}]};
let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
