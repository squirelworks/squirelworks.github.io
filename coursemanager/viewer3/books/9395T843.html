const book = {"title": "9395T843", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: INTERFACING WITH THE 8086 MICROPROCESSORsdf sadf"], "jumps": []}, {"id": "P10", "text": ["INTERFACING WITH THE 8086 MICROPROCESSOR"], "jumps": []}, {"id": "P100", "text": ["1. Interfacing with the 8086 Microprocessor", "w Observe the operation of an input/output device as it is used in a microprocessor system.....", "w Describe the connection of input/output devices attached to the 8086. w Understand the different types of input/output devices connected to a microprocessor."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Experiment Card PC130 - 411 XXXXXXnt"], "jumps": []}, {"id": "P301", "text": [], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P350", "text": [], "jumps": []}, {"id": "P360", "text": [], "jumps": []}, {"id": "P400", "text": ["Without input or output devices, a microprocessor system has no way of communicating with the outside world."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["There are numerous input and output devices available today to solve this problem."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["In this lesson, we are going to look at how IO (input/output) devices are connected to the 8086, the different types of devices, and examples of their implementation."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Let's begin the lesson on INTERFACING WITH THE 8086 MICROPROCESSOR.........."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": ["INTERFACING WITH 8086 MICROPROCESSOR"], "jumps": []}, {"id": "P1040", "text": ["In the previous lesson we looked at the connection of memory to the 8086 microprocessor.  The connection of IO devices is very similar to the connection of memory.", "In the previous lesson we looked at the connection of memory to the 8086 microprocessor. The connection of IO devices is very similar to the connection of memory.", "Address, Data Demultiplexing, and Buffering Signalssss"], "jumps": ["P1001", "P1050"]}, {"id": "P1050", "text": ["Let's look at the signals necessary for the connection of the IO to the 8086.  The graphic below shows only the signals used to connect the 8086 microprocessor to the IO.", "Let's look at the signals necessary for the connection of the IO to the 8086. The graphic below shows only the signals used to connect the 8086 microprocessor to the IO."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["Many of these signals are used for memory circuit connections. As far as connecting to the 8086, the connections are very similar.  The main difference is how they are accessed through assembly code.", "Many of these signals are used for memory circuit connections. As far as connecting to the 8086, the connections are very similar. The main difference is how they are accessed through assembly code."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["Notice there are only 16 address lines used.  The 8086 was designed to only allow the use of 65536 IO devices.  Since most computers do not use more than 100 devices, it is rare that an IO address requires a segment.", "Notice there are only 16 address lines used. The 8086 was designed to only allow the use of 65536 IO devices. Since most computers do not use more than 100 devices, it is rare that an IO address requires a segment."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["Also provided to IO devices are 16 data lines used to transfer information.  The direction of data transfer from IO to the microprocessor is controlled by the WR and RD pins just as memory is.", "Also provided to IO devices are 16 data lines used to transfer information. The direction of data transfer from IO to the microprocessor is controlled by the WR and RD pins just as memory is."], "jumps": ["P1090", "P1040"]}, {"id": "P1090", "text": ["The ASTB pin is used for the address latches and the BUFEN and BUF/R/W for the address buffers.  The IO/M pin is what selects between IO and memory.  When this pin is low, it indicates that IO is being accessed.", "The ASTB pin is used for the address latches and the BUFEN and BUF/R/W for the address buffers. The IO/M pin is what selects between IO and memory. When this pin is low, it indicates that IO is being accessed."], "jumps": ["P1100", "P1040"]}, {"id": "P1100", "text": ["IO is arranged in the same way as memory chips.  Each address combination of the 8086 address lines can be used by a different  device.  Most devices will take a range of addresses, not just one.", "IO is arranged in the same way as memory chips. Each address combination of the 8086 address lines can be used by a different device. Most devices will take a range of addresses, not just one."], "jumps": ["P1110", "P1040"]}, {"id": "P1110", "text": ["These different addresses use different functions of the device. When we look at the operation of the parallel port IO device we     will see this type of setup.  The graphic below shows the connection of a few IO devices to an 8086 microprocessor.", "These different addresses use different functions of the device. When we look at the operation of the parallel port IO device we will see this type of setup. The graphic below shows the connection of a few IO devices to an 8086 microprocessor."], "jumps": ["P1120", "P1040"]}, {"id": "P1120", "text": ["Now that you understand the basic memory connection of IO circuits, which is very similar to the way memory is connected, let's look at different devices connected to the 8086."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["IO devices fall into one of three categories: input, output, or input/output devices.  They are further categorized as being either fixed or removable devices.", "IO devices fall into one of three categories: input, output, or input/output devices. They are further categorized as being either fixed or removable devices."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["Fixed IO devices are permanently connected to the system.  Removable IO devices are connected to a microprocessor through a special universal connection port.  These ports are designed for many different types of IO.", "Fixed IO devices are permanently connected to the system. Removable IO devices are connected to a microprocessor through a special universal connection port. These ports are designed for many different types of IO."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["Examples of fixed IO devices are the keyboard and display of the Nida 8086 trainer.  Removable IO devices would be connected to either the serial or parallel or ports.", "Examples of fixed IO devices are the keyboard and display of the Nida 8086 trainer. Removable IO devices would be connected to either the serial or parallel or ports."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["Let's look at an example of each type of device to understand their communication with the microprocessor."], "jumps": ["P1170", "P1130"]}, {"id": "P1170", "text": ["Input devices allow information to be sent to the microprocessor or to control it in some fashion.   A keyboard, for example, can be used to select options, program new instructions, or make modifications to old programs.", "Input devices allow information to be sent to the microprocessor or to control it in some fashion. A keyboard, for example, can be used to select options, program new instructions, or make modifications to old programs."], "jumps": ["P1180", "P1130"]}, {"id": "P1180", "text": ["Input devices include: a mouse, lightpen, trackball, scanner, or keyboard, to name a few.  The only \"Input Only\" device on the 8086 microprocessor trainer is the keyboard.", "Input devices include: a mouse, lightpen, trackball, scanner, or keyboard, to name a few. The only \"Input Only\" device on the 8086 microprocessor trainer is the keyboard."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["Input means that the device does not provide any outputs to the user.  To better understand the operation of an input device, let's look at the actual circuitry used to control the keyboard in the 8086  microprocessor trainer.", "Input means that the device does not provide any outputs to the user. To better understand the operation of an input device, let's look at the actual circuitry used to control the keyboard in the 8086 microprocessor trainer."], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["The keyboard has been broken down into five main sections: the keyboard matrix, the keyboard latch, the keyboard buffer, the key decoding circuit, and the control circuit.  Below is the block diagram of the keyboard and its associated circuitry.", "The keyboard has been broken down into five main sections: the keyboard matrix, the keyboard latch, the keyboard buffer, the key decoding circuit, and the control circuit. Below is the block diagram of the keyboard and its associated circuitry."], "jumps": ["P1210", "P1170"]}, {"id": "P1210", "text": ["Let's start by looking at the keyboard key matrix.", "KEYBOARD MATRIX\nThe keyboard matrix is an arrangement of horizontal and vertical wires with switches connected across them.", "Let's start by looking at the keyboard key matrix. oard matrix, buffer and the key decoding circuit. Let's start by looking at the keyboard key matrix.", "KEYBOARD MATRIX The keyboard matrix is an arrangement of horizontal and vertical wires with switches connected across them."], "jumps": ["P1220", "P1200", "P1230"]}, {"id": "P1230", "text": ["Pressing any one key connects two wires, one horizontal and one vertical.  Each key has its own connection making them unique to one another.", "Pressing any one key connects two wires, one horizontal and one vertical. Each key has its own connection making them unique to one another."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["By sending a signal through a horizontal wire, the vertical wires can be looked at to see which key in that row was pressed, if any.  This brings us to the next circuit, the keyboard latch.", "KEYBOARD LATCH\nThe keyboard latch is an 8-bit latch connected to the 8 horizontal connections of the keyboard key matrix.", "By sending a signal through a horizontal wire, the vertical wires can be looked at to see which key in that row was pressed, if any. This brings us to the next circuit, the keyboard latch.", "KEYBOARD LATCH The keyboard latch is an 8-bit latch connected to the 8 horizontal connections of the keyboard key matrix."], "jumps": ["P1250", "P1220", "P1260"]}, {"id": "P1260", "text": ["The output of a latch is the last input present when the clock pulse came through.  The data bus of the 8086 is used to send and receive signals from the keyboard circuitry.", "The output of a latch is the last input present when the clock pulse came through. The data bus of the 8086 is used to send and receive signals from the keyboard circuitry."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["Since we cannot send and receive at the same time, a latch provides a way of holding a previous set of signals from the data bus to allow the results of these applied signals to be read.", "When a key is pressed, a program in the microprocessor sets the latch to output all highs to all horizontal lines, except for one, which it sets to low.  The program then checks to see if that low is present on any of the vertical lines.", "When a key is pressed, a program in the microprocessor sets the latch to output all highs to all horizontal lines, except for one, which it sets to low. The program then checks to see if that low is present on any of the vertical lines."], "jumps": ["P1280", "P1250", "P1290"]}, {"id": "P1290", "text": ["If none are found, the horizontal line is set to high and the next one is set to low.  The process or loop in which each line is repeatedly set and tested is known as polling.", "If none are found, the horizontal line is set to high and the next one is set to low. The process or loop in which each line is repeatedly set and tested is known as polling........................"], "jumps": ["P1300", "P1250"]}, {"id": "P1300", "text": ["It is important to note that a program in the microprocessor performs many steps in controlling the keyboard, not just the        associated circuitry.  This program is contained within the monitor program used by the 8086 microprocessor.", "It is important to note that a program in the microprocessor performs many steps in controlling the keyboard, not just the associated circuitry. This program is contained within the monitor program used by the 8086 microprocessor."], "jumps": ["P1310", "P1250"]}, {"id": "P1310", "text": ["KEYBOARD BUFFER\nThe five vertical lines of the keyboard matrix are connected to the first five inputs of the keyboard buffer.  Notice also that each of the five lines are connected to Vcc through a resistor.", "KEYBOARD BUFFER The five vertical lines of the keyboard matrix are connected to the first five inputs of the keyboard buffer. Notice also that each of the five lines are connected to Vcc through a resistor."], "jumps": ["P1320", "P1250"]}, {"id": "P1320", "text": ["When none of the keys are being pressed on the keyboard, there is a HIGH signal on each of the vertical lines.  This is because +5V is connected to each line through a resistor.", "When none of the keys are being pressed on the keyboard, there is a HIGH signal on each of the vertical lines. This is because +5V is connected to each line through a resistor."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["If a key is pressed on a row where the horizontal line is HIGH, then a HIGH will be connected to the associated vertical line and to the buffer.  This condition would cause the microprocessor not to be able to recognize the keystroke.", "If a key is pressed on a row where the horizontal line is HIGH, then a HIGH will be connected to the associated vertical line and to the buffer. This condition would cause the microprocessor not to be able to recognize the keystroke."], "jumps": ["P1340", "P1310"]}, {"id": "P1340", "text": ["If a key is pressed on a row where the horizontal line is LOW, then a LOW will be connected to the bottom of the resistor and to the buffer.  The resistor has to be large enough to allow all of +5V to be dropped across it without damage.", "If a key is pressed on a row where the horizontal line is LOW, then a LOW will be connected to the bottom of the resistor and to the buffer. The resistor has to be large enough to allow all of +5V to be dropped across it without damage............"], "jumps": ["P1350", "P1310"]}, {"id": "P1350", "text": ["Without the resistor, +5V would be connected to ground, damaging the power source.", "KEY DECODING CIRCUIT\nThe key decoding circuit, as shown below, only allows the microprocessor to register the pressed key once before generating the needed interrupt signal.  While the key is being held down it doesn't allow its circuits to reset.", "KEY DECODING CIRCUIT The key decoding circuit, as shown below, only allows the microprocessor to register the pressed key once before generating the needed interrupt signal. While the key is being held down it doesn't allow its circuits to reset."], "jumps": ["P1360", "P1310", "P1370"]}, {"id": "P1370", "text": ["This low condition indicates a pressed key to the microprocessor.  At this point you are probably wondering if, when a key is pressed, is there a possibility that the horizontal line may not go low during that time?", "This low condition indicates a pressed key to the microprocessor. At this point you are probably wondering if, when a key is pressed, is there a possibility that the horizontal line may not go low during that time?"], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["No need to worry.  The process of making each line low, one at a time, happens approximately 40 times a second.  When you press a key the microprocessor will be able to be notified many times.", "No need to worry. The process of making each line low, one at a time, happens approximately 40 times a second. When you press a key the microprocessor will be able to be notified many times."], "jumps": ["P1390", "P1360"]}, {"id": "P1390", "text": ["This brings up another important point: will not the microprocessor think that the key was pressed many times?", "The key decoding circuit only allows the microprocessor to register the key you've pressed once.  While the key is being held down it doesn't allow its circuits to reset.", "This brings up another important point: will not the microprocessor think that the key was pressed many times? hen you press a key, the microprocessor will be notified many times.", "The key decoding circuit only allows the microprocessor to register the key you've pressed once. While the key is being held down it doesn't allow its circuits to reset."], "jumps": ["P1400", "P1360", "P1410"]}, {"id": "P1410", "text": ["All of the components of the key decoding circuit are contained within an IC known as a GAL (Generic Array Logic).  This IC can be programmed to represent many different logic circuits connected in a multitude of ways.", "All of the components of the key decoding circuit are contained within an IC known as a GAL (Generic Array Logic). This IC can be programmed to represent many different logic circuits connected in a multitude of ways."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["The purpose for using this IC is to save room on the circuit cards.  If individual IC's were used for all the logic components of the GAL, it would take up much more room.", "The purpose for using this IC is to save room on the circuit cards. If individual IC's were used for all the logic components of the GAL, it would take up much more room."], "jumps": ["P1430", "P1400"]}, {"id": "P1430", "text": ["The D type flip-flop in the GAL representation schematic sets and notifies the microprocessor when a key is depressed.  The flip-flop resets when the key is released.  The combination logic used in determining whether a key has been pressed or released is also contained within the GAL.", "CONTROL CIRCUIT\nThis is the last section of the keyboard circuits.  This circuit is controlled by the microprocessor which in turn controls all functions of the keyboard circuitry.", "The D type flip-flop in the GAL representation schematic sets and notifies the microprocessor when a key is depressed. The flip-flop resets when the key is released. The combination logic used in determining whether a key has been pressed or released is also contained within the GAL.fffffffffff", "CONTROL CIRCUIT This is the last section of the keyboard circuits. This circuit is controlled by the microprocessor which in turn controls all functions of the keyboard circuitry. The three main control signals applied by the microprocessor are: IOCS1, A2, and WR. RD, the other control signal required for reading the keyboard, is applied directly to pin 19 of the keyboard buffer."], "jumps": ["P1440", "P1400", "P1445"]}, {"id": "P1445", "text": ["The three main control signals applied by the microprocessor are: IOCS1, A2, and WR.  RD, the other control signal required for reading the keyboard, is applied directly to pin 19 of the keyboard buffer.", "The three main control signals applied by the microprocessor are: IOCS1, A2, and WR. RD, the other control signal required for reading the keyboard, is applied directly to pin 19 of the keyboard buffer.ol signals applied by the microprocessor are: IOCS1, A2, and WR. RD, the other control signal required for reading the keyboard, is applied directly to pin 19 of the keyboard buffer."], "jumps": ["P1450", "P1440"]}, {"id": "P1450", "text": ["These four lines tell the circuit to be active, inactive, reading or writing, just to name a few.  The output of the IO chip select      circuitry is connected to the keyboard control circuit.  This way, only  the keyboard will be active when the microprocessor is reading or writing data to this device.", "These four lines tell the circuit to be active, inactive, reading or writing, just to name a few. The output of the IO chip select circuitry is connected to the keyboard control circuit. This way, only the keyboard will be active when the microprocessor is reading or writing data to this device."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["The IO chip select is actually combined with the memory chip select in the 8086 circuitry. The IO/M signal is the important signal which distinguishes between memory and IO."], "jumps": ["P1470", "P1440"]}, {"id": "P1470", "text": ["As you can see, there are many different sections to even a simple input device.  The actual complexity of an input device will depend on its purpose.", "As you can see, there are many different sections to even a simple input device. The actual complexity of an input device will depend on its purpose."], "jumps": ["P1480", "P1440"]}, {"id": "P1480", "text": ["If the keyboard had consisted of only one key it would have probably been connected directly to the microprocessor and that would have been the entire circuit."], "jumps": ["P1490", "P1440"]}, {"id": "P1490", "text": ["Now that we have looked at an input device, let's look at an output device."], "jumps": ["P1500", "P1440"]}, {"id": "P1500", "text": ["While input devices allow you to input information into a microprocessor system, output devices allow you to see or receive feedback from the microprocessor about operations, data, or performance.", "While input devices allow you to input information into a microprocessor system, output devices allow you to see or receive feedback from the microprocessor about operations, data, or performance................."], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["An output device could be a printer, phone line, or display of some sort.  Many microprocessor systems have outputs to monitors, or LCD displays.", "An output device could be a printer, phone line, or display of some sort. Many microprocessor systems have outputs to monitors, or LCD displays."], "jumps": ["P1520", "P1490"]}, {"id": "P1520", "text": ["To get a better understanding of output devices, let's look at the operation of the LCD display of the 8086 microprocessor trainer."], "jumps": ["P1530", "P1490"]}, {"id": "P1530", "text": ["LCD is an acronym which stands for Liquid Crystal Display, which also describes the technique of how the display works.  A liquid crystal display has an actual liquid crystal in between two pieces of glass.", "LCD is an acronym which stands for Liquid Crystal Display, which also describes the technique of how the display works. A liquid crystal display has an actual liquid crystal in between two pieces of glass."], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["Transparent, conductive materials are used to apply voltage to the liquid crystal.  When voltage is applied, the crystals in the liquid scatter and do not allow light to pass through the glass.", "Transparent, conductive materials are used to apply voltage to the liquid crystal. When voltage is applied, the crystals in the liquid scatter and do not allow light to pass through the glass."], "jumps": ["P1550", "P1520"]}, {"id": "P1550", "text": ["In the rear portion of the glass, holding the liquid crystal, a reflective surface shines light backwards through the glass          illuminating the characters.", "In the rear portion of the glass, holding the liquid crystal, a reflective surface shines light backwards through the glass illuminating the characters."], "jumps": ["P1560", "P1520"]}, {"id": "P1560", "text": ["The LCD unit, like the one on the PC130-404 card, has fourteen pins and its own processor for interfacing with the 8086 microprocessor.  The self contained processor, under the control of the 8086 microprocesor, drives the LCD and provides all functions necessary for proper display.", "The LCD unit, like the one on the PC130-404 card, has fourteen pins and its own processor for interfacing with the 8086 microprocessor. The self contained processor, under the control of the 8086 microprocesor, drives the LCD and provides all functions necessary for proper display."], "jumps": ["P1570", "P1520"]}, {"id": "P1570", "text": ["Vss and Vdd are used to power the LCD module.  The capacitor between them is used to protect the circuit from voltages spikes. Vcc is used to set the intensity of the display.", "Vss and Vdd are used to power the LCD module. The capacitor between them is used to protect the circuit from voltages spikes. Vcc is used to set the intensity of the display."], "jumps": ["P1580", "P1520"]}, {"id": "P1580", "text": ["You can see that this pin is connected to a potentiometer with one side connected to 5 volts and the other to ground.   Adjusting the potentiometer will adjust the display intensity.", "You can see that this pin is connected to a potentiometer with one side connected to 5 volts and the other to ground. Adjusting the potentiometer will adjust the display intensity."], "jumps": ["P1590", "P1520"]}, {"id": "P1590", "text": ["The next three connections of the LCD module are control lines. The control lines are the RS (register Select), R/W (Read/Not Write) and the E (Enable) pins.  There are two types of memory within the display unit; character memory and display memory.", "The next three connections of the LCD module are control lines. The control lines are the RS (register Select), R/W (Read/Not Write) and the E (Enable) pins. There are two types of memory within the display unit; character memory and display memory."], "jumps": ["P1600", "P1520"]}, {"id": "P1600", "text": ["Character memory holds all the information about the displayable characters and the user definable characters.  User definable characters means that you can assign them to whatever function you want.", "Character memory holds all the information about the displayable characters and the user definable characters. User definable characters means that you can assign them to whatever function you want."], "jumps": ["P1610", "P1520"]}, {"id": "P1610", "text": ["Character memory is split into two sections; RAM and ROM.  The character RAM, also known as the CG RAM, holds all of the user   defined character codes.  If you create your own characters you   must reload them into the display every time you turn the display module on.", "Character memory is split into two sections; RAM and ROM. The character RAM, also known as the CG RAM, holds all of the user defined character codes. If you create your own characters you must reload them into the display every time you turn the display module on..............."], "jumps": ["P1620", "P1520"]}, {"id": "P1620", "text": ["This is because, the CG memory space is RAM which is erased every time power is removed from the system.  The character ROM, known as the CG ROM, holds all the permanent information about the predefined unchangeable characters of the display module.", "This is because, the CG memory space is RAM which is erased every time power is removed from the system. The character ROM, known as the CG ROM, holds all the permanent information about the predefined unchangeable characters of the display module."], "jumps": ["P1630", "P1520"]}, {"id": "P1630", "text": ["Data books written about the displays will illustrate the predefined characters, how they are organized, and also indicate which characters can be changed."], "jumps": ["P1640", "P1520"]}, {"id": "P1640", "text": ["The display RAM, known as the DD RAM, is used to hold the current information that is being displayed on the LCD screen. There isn't any DD ROM because it isn't necessary."], "jumps": ["P1650", "P1520"]}, {"id": "P1650", "text": ["All areas of the screen are fully programmable.  The last eight lines of the display module connections are data lines.  These       lines are used to input information to the display module.", "All areas of the screen are fully programmable. The last eight lines of the display module connections are data lines. These lines are used to input information to the display module."], "jumps": ["P1660", "P1520"]}, {"id": "P1660", "text": ["Now that we have looked at the input and output devices, let's look at some common circuits which employ both methods of communication, input and output."], "jumps": ["P1670", "P1520"]}, {"id": "P1670", "text": ["The two most common forms of input/output are the serial and parallel ports.  Ports are connectors in a system used to interface external devices.  External devices could be modems, printers,    scanners, ect.", "The two most common forms of input/output are the serial and parallel ports. Ports are connectors in a system used to interface external devices. External devices could be modems, printers, scanners, ect."], "jumps": ["P1680", "P1660"]}, {"id": "P1680", "text": ["An I/O port allows you to hook up any these using a standardized protocol, either serial or parallel.  There are other types of standard connections, however, they are not a part of this 8086 system.", "An I/O port allows you to hook up any these using a standardized protocol, either serial or parallel. There are other types of standard connections, however, they are not a part of this 8086 system."], "jumps": ["P1690", "P1660"]}, {"id": "P1690", "text": ["Only the most common types of ports have been integrated into the system."], "jumps": ["P1700", "P1660"]}, {"id": "P1700", "text": ["The names serial and parallel describe the type of communication that occurs.  Serial connections require, at a minimum, three connections for two-way communication: send, receive, and ground.", "The names serial and parallel describe the type of communication that occurs. Serial connections require, at a minimum, three connections for two-way communication: send, receive, and ground. nd."], "jumps": ["P1710", "P1660"]}, {"id": "P1710", "text": ["In some systems more connections are provided for certain types of control and protection.  However, in most cases these types of signals aren't needed.  Serial indicates that, at any given time, only one data bit can be sent.", "In some systems more connections are provided for certain types of control and protection. However, in most cases these types of signals aren't needed. Serial indicates that, at any given time, only one data bit can be sent."], "jumps": ["P1720", "P1700"]}, {"id": "P1720", "text": ["If you were sending 8-bits of data, it would take 8 sends to completely transmit the bits.  The advantage of serial communications is that it only requires a few wires, so it's well adapted for telephone transmission.", "If you were sending 8-bits of data, it would take 8 sends to completely transmit the bits. The advantage of serial communications is that it only requires a few wires, so it's well adapted for telephone transmission."], "jumps": ["P1730", "P1700"]}, {"id": "P1730", "text": ["Parallel communication, used mostly with printers, is the sending of many bits at once.  Normally, 8-bits are sent, each on their own line.  Additional lines are also provided for control and protection.", "Parallel communication, used mostly with printers, is the sending of many bits at once. Normally, 8-bits are sent, each on their own line. Additional lines are also provided for control and protection."], "jumps": ["P1740", "P1700"]}, {"id": "P1740", "text": ["The parallel port is faster than the serial port because of this simultaneous transfer of data. This increased speed however, comes at a cost. Increased cost for multiple conductor cable, more complex circuitry, and signal degradation as cable lengths increase, all combine to limit the length of parallel data cables to lengths shorter than serial data cables."], "jumps": ["P1745", "P1730"]}, {"id": "P1745", "text": ["Frequently, printers are located close to the computer making the use of the parallel port for interconnection ideal.  On some systems the parallel port is called the printer port, on others it is called LPT.", "Frequently, printers are located close to the computer making the use of the parallel port for interconnection ideal. On some systems the parallel port is called the printer port, on others it is called LPT. to allow it to travel longer distances."], "jumps": ["P1750", "P1730"]}, {"id": "P1750", "text": ["In some situations, certain devices need the speed of the parallel port and the distance of the serial port.  Special devices exist that can amplify the signals of the parallel port allowing them to travel greater distances.", "In some situations, certain devices need the speed of the parallel port and the distance of the serial port. Special devices exist that can amplify the signals of the parallel port allowing them to travel greater distances."], "jumps": ["P1760", "P1730"]}, {"id": "P1760", "text": ["The table below shows the pin-out for an advanced serial port and an advanced parallel port normally found in personal computers."], "jumps": ["P1761", "P1730"]}, {"id": "P1761", "text": ["The table below shows the pin-out for an advanced serial port and an advanced parallel port normally found in personal computers.", "In the next experiment, we will look at the operation of the parallel port.  By looking at the parallel port, you will see some of the characteristics that are important regarding input and output.", "In the next experiment, we will look at the operation of the parallel port. By looking at the parallel port, you will see some of the characteristics that are important regarding input and output."], "jumps": ["P1780", "P1760", "P1785", "P"]}, {"id": "P1785", "text": ["Another type of I/O device, which hasn't been implemented into the 8086 system you are using, is networking.  It hasn't been implemented because this trainer does not need to be networked, however, the principle is important.", "Another type of I/O device, which hasn't been implemented into the 8086 system you are using, is networking. It hasn't been implemented because this trainer does not need to be networked, however, the principle is important."], "jumps": ["P1790", "P1780"]}, {"id": "P1790", "text": ["Networking is the connection of many computers together to provide interaction with resources and users.  There are  many different types of protocols and configurations, however, their main purpose is the same.", "Networking is the connection of many computers together to provide interaction with resources and users. There are many different types of protocols and configurations, however, their main purpose is the same."], "jumps": ["P1800", "P1780"]}, {"id": "P1800", "text": ["Computers connected to the Internet are connected through some sort of networking device.  Computer programs are designed to allow many different computers to have their I/O ports connected together.", "Computers connected to the Internet are connected through some sort of networking device. Computer programs are designed to allow many different computers to have their I/O ports connected together."], "jumps": ["P1810", "P1780"]}, {"id": "P1810", "text": ["If one computer sends information, each of the other computers on a network can look to see if they are supposed to read that data."], "jumps": ["P1820", "P1780"]}, {"id": "P1820", "text": ["As the Internet grows larger and larger, communication ports may change to accommodate the different needs associated with this type of communication."], "jumps": ["P1830", "P1780"]}, {"id": "P1830", "text": ["However, the principles of their operation will closely relate to the most common interface ports, serial and parallel."], "jumps": ["P1840", "P1780"]}, {"id": "P1840", "text": ["Which of the following is just an input device?", "Which of the following is just an input device?............"], "jumps": ["P1780"]}, {"id": "P1841", "text": [], "jumps": []}, {"id": "P1842", "text": ["The display is only an output device.  Remember, an input device provides some sort of input to the microprocessor.", "The display is only an output device. Remember, an input device provides some sort of input to the microprocessor."], "jumps": []}, {"id": "P1843", "text": ["While the parallel port can be an input, it is also an output. This question asked which device is JUST an input device."], "jumps": []}, {"id": "P1850", "text": ["Which of the following is an input and an output device?", "Which of the following is an input and an output device?..."], "jumps": ["P1840"]}, {"id": "P1851", "text": [], "jumps": []}, {"id": "P1852", "text": ["While the display is an output device, it is NOT an input device also."], "jumps": []}, {"id": "P1853", "text": ["While the keyboard is an input device, it is NOT an output device also."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on INTERFACING WITH 8086 MICROPROCESSOR."], "jumps": ["P1001", "P1850"]}, {"id": "P1920", "text": ["1.  I/O allows a microprocessor to input and output data with the        world around it.  Without the I/O ability, a microprocessor is            useless.", "1. I/O allows a microprocessor to input and output data with the world around it. Without the I/O ability, a microprocessor is useless."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Some examples of common I/O are: a Network Adapter, a                Serial Port, a Parallel Port, a Keyboard, or an LCD Display.", "2. Some examples of common I/O are: a Network Adapter, a Serial Port, a Parallel Port, a Keyboard, or an LCD Display."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  I/O is connected to a microprocessor system through the                address and data and control lines, just like memory.  Certain        address values will enable each I/O device individually.  The           difference in connections involves the use of the M/IO pin and       not using pins A16 through A19.", "3. I/O is connected to a microprocessor system through the address and data and control lines, just like memory. Certain address values will enable each I/O device individually. The difference in connections involves the use of the M/IO pin and not using pins A16 through A19."], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["4.  The 8086 keyboard has been broken down into five main                sections: the keyboard key matrix, the keyboard latch, the              keyboard buffer, the key decoding circuit, and the control               circuit.", "4. The 8086 keyboard has been broken down into five main sections: the keyboard key matrix, the keyboard latch, the keyboard buffer, the key decoding circuit, and the control circuit."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  LCD's are normally pre-built modules containing a processor        designed to control the LCD.", "5. LCD's are normally pre-built modules containing a processor designed to control the LCD. o"], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  Serial ports need a minimum of three connections for bi-                 directional communication: send, receive, and ground.", "6. Serial ports need a minimum of three connections for bi- directional communication: send, receive, and ground."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7.  Serial Ports are slower than parallel ports, however, they can         span greater cable lengths.  Parallel ports have nine wires at          a minimum, 8 data lines and a ground.", "7. Serial Ports are slower than parallel ports, however, they can span greater cable lengths. Parallel ports have nine wires at a minimum, 8 data lines and a ground."], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["8.  Parallel ports are faster than serial ports, however, the cables        are restricted to shorter distances and the cable can be more         expensive since six more wires are required.", "8. Parallel ports are faster than serial ports, however, the cables are restricted to shorter distances and the cable can be more expensive since six more wires are required."], "jumps": ["P1999", "P1980"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2040", "text": ["In this experiment, you will gain hands-on experience with one of the most commonly used I/O port used, the parallel port.  While parallel ports may differ from machine to machine, their basic operation is the same.", "In this experiment, you will gain hands-on experience with one of the most commonly used I/O port used, the parallel port. While parallel ports may differ from machine to machine, their basic operation is the same."], "jumps": ["P2050", "P2001"]}, {"id": "P2050", "text": ["By understanding and using a parallel port, basic principles about I/O communication with a microprocessor can be seen."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["At anytime during this experiment you can view the schematics by pressing Ctrl+S.  Let's begin the experiment on the operation of the 8086 microprocessor.", "At anytime during this experiment you can view the schematics by pressing Ctrl+S. Let's begin the experiment on the operation of the 8086 microprocessor."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2060"]}, {"id": "P2080", "text": ["2. Insert the following 130 experiment cards on the test console. a. Insert PC130-410 8086 Microprocessor card in the PC1 position. b. Insert PC130-411 8086 Decoder/Memory card in the PC2 position. c. Insert PC130-401 I/O card in the PC3 position."], "jumps": ["P2085", "P2070"]}, {"id": "P2085", "text": ["3.  Place the PC130-404 Keyboard and Display card in front of            the test console between the PC2 and PC3 positions.", "3. Place the PC130-404 Keyboard and Display card in front of the test console between the PC2 and PC3 positions."], "jumps": ["P2090", "P2080"]}, {"id": "P2090", "text": ["4. Connect four experiment cards with the ribbon cables as follows: a. Using the 50 pin ribbon cable, connect PC130-410 J1 to PC130-411 J1. b. Using the short 20 pin ribbon cable, connect PC130-411 J2 to PC130-401 J1. c. Using the long 20 pin ribbon cable, connect PC130-401 J2 to PC130-404 J1.", "The Ribbon Cables must be installed in the proper orientation. Note that each cable has a red stripe on one side. This stripe indicates pin 1. On the Experiment Cards, the numeral 1 or 2 indicates the end of the connector with the 1 pin. Attach the cables to the connectors such that the red stripe is at the end of the connector with the numeral 1 or 2.", "The Ribbon Cables must be installed in the proper orientation. Note that each cable has a red stripe on one side. This stripe indicates pin 1. On the Experiment Cards, the numeral 1 or 2 indicates the end of the connector with the 1 pin. Attach the cables to the connectors such that the red stripe is at the end of the connector with the numeral 1 or 2..", "CAUTION -400 card has its own chassis."], "jumps": ["P2100", "P2085"]}, {"id": "P2100", "text": ["5.  Set the Positive Supply Control to 5V.", "5. Set the Positive Supply Control to 5V.12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2090"]}, {"id": "P2120", "text": ["6.  Press the PC3 DC Power switch to ON.", "6. Press the PC3 DC Power switch to ON.o 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2100"]}, {"id": "P2125", "text": ["7.  Press the PC2 DC Power switch to ON.", "7. Press the PC2 DC Power switch to ON.. 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2120"]}, {"id": "P2130", "text": ["8.  Press the PC1 DC Power switch to ON.", "8. Press the PC1 DC Power switch to ON.o 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2125"]}, {"id": "P2135", "text": ["9. The microprocessor system is now assembled and operating. You should see the message \"NIDA Corporation Intel 8086 Vx.x NIDA:\" in the LCD display on the PC130-404 card. If the message is dim or blank, try adjusting the Display Intensity potentiometer R1 on the PC130-404 card using a small screwdriver. If you still cannot see the message, see your instructor for assistance.", "The \"Vx.x\" in the display of the LCD indicates the version of the monitor program you are using. This experiment is written for all versions of the monitor program. If, at any time during the experiment, you short some of the IC pins together while observing the signals, press the reset button. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run the program before proceeding with your measurements.ts."], "jumps": ["P2140", "P2130"]}, {"id": "P2140", "text": ["COMMUNICATING WITH THE PARALLEL PORT\nThis experiment has two sections.  In the first section we are going to observe communication with the parallel port, and then write data to it.", "COMMUNICATING WITH THE PARALLEL PORT This experiment has two sections. In the first section we are going to observe communication with the parallel port, and then write data to it."], "jumps": ["P2150", "P2135"]}, {"id": "P2150", "text": ["In the second section, we are going to read the data from the parallel port, which should be the same as that which was written to it."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["The system should now be functioning properly.  Remember from earlier reading that the I/O ports are used the same way as memory.  Certain address values will allow the processor to communicate with the parallel port.", "The system should now be functioning properly. Remember from earlier reading that the I/O ports are used the same way as memory. Certain address values will allow the processor to communicate with the parallel port."], "jumps": ["P2170", "P2140"]}, {"id": "P2170", "text": ["The first program that you are going to enter will demonstrate continuous writing to the parallel port.  It is important to realize    a pause has been added in the program so that the human eye can see the change in the data.", "Without the pause, the 8086 operates so quickly, all you would see is the port's output LED's illuminated.", "The first program that you are going to enter will demonstrate continuous writing to the parallel port. It is important to realize a pause has been added in the program so that the human eye can see the change in the data."], "jumps": ["P2180", "P2160", "P2190"]}, {"id": "P2190", "text": ["The 8086 microprocessor trainer has three parallel ports: A, B, and C.  In this lesson we are only going to write to and read from  port A.", "The 8086 microprocessor trainer has three parallel ports: A, B, and C. In this lesson we are only going to write to and read from port A."], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["10.  Press the RESET button on the PC130-410 card.  You will be          entering a program into memory for execution by the 8086              microprocessor.  Press the HELP button for a brief                            summary on entering programs into the 8086.", "10. Press the RESET button on the PC130-410 card. You will be entering a program into memory for execution by the 8086 microprocessor. Press the HELP button for a brief summary on entering programs into the 8086."], "jumps": ["P2210", "P2180", "P2205"]}, {"id": "P2205", "text": ["INSTRUCTIONS FOR ENTERING PROGRAMS: 1. Press EDIT on the PC130-404 Keyboard & Display experiment card and enter the desired SEGMENT or OFFSET. A SEGMENT such as 1000 may be entered as 1000:, 1000:0, or 1000:0000. An OFFSET such as 1000 may be entered as 1000, :1000, or 0000:1000. 2. Press ENTER after the desired SEGMENT or OFFSET has been entered. The display will now show the SEGMENT at the top of the display along with OFFSET and store OPCODE at the bottom of the display. NOTE: Every time you enter an OPCODE and press ENTER, you automatically move to the next OFFSET. Additionally, there are three things that can be done at any SEGMENT and OFFSET: Enter a new value and press ENTER, press the down arrow to move to the next OFFSET, or press the up arrow to move to the previous OFFSET. 3. Enter all of the desired OPCODES for the program remembering to press ENTER after each. 4. After all OPCODES of the program have been entered, press the STOP key. 5. The program has now been stored in memory. To verify the program has been stored correctly, press the DISPLAY R.M. key, enter the starting address of the program, and press ENTER. All OPCODES for that location, as well for the next 17 locations, will be displayed. p orders and checks automobile prior to delivery. Advertising and telephone marketing may be required at slow times. Environment - Clean well lighted showroom or outside on a lot. Evenings, days and weekends. Requirements - Must be able to maintain a pleasant attitude with people under stressful conditions. Good personal appearance and manners are important."], "jumps": []}, {"id": "P2210", "text": ["11.  Enter the following program into memory starting at offset               location \"1000\".  (EDIT, 1000, enter OPCODE values with an           ENTER after each, and then press STOP.)", "11. Enter the following program into memory starting at offset location \"1000\". (EDIT, 1000, enter OPCODE values with an ENTER after each, and then press STOP.)", "Moves the value 0200 into the DX register which points to the A parallel port. Moves the value 0001 into BX which will be used in two ways to decrement counters. Move the value FF into the lower portion of the accumulator. Move value in AL to IO at DX Move the value FFFF into CX which will be used as a delay so you can see LEDs change. eturns to the 8051 monitor program.", "MOV DX, 0200h MOV BX,0001h MOV AL, 0FFh OUT DX, AL MOV CX, 0FFFFhTTTTTTTTTTTTTTTTTTTTTTTTT"], "jumps": ["P2215", "P2200"]}, {"id": "P2215", "text": ["Subtract 0001H from delay register. If result of subtract is 0 then continue, if not jump to 100C. Subtract 01H from the AL register which we will be sending to IO. If result of subtract is zero then jump to 1006 to reset AL. Jump to 1008 which will send AL to the output port again. h will be used as a delay so you can see LEDs change. eturns to the 8051 monitor program.", "SUB CX, BX JNZ 0FCh SUB AL, BH JZ 0F2h JMP 0F2h"], "jumps": ["P2220", "P2210"]}, {"id": "P2220", "text": ["12.  Run the program you just entered.  This is done by pressing          the RUN key an entering the starting address of the                           program, \"1000\".", "12. Run the program you just entered. This is done by pressing the RUN key an entering the starting address of the program, \"1000\"."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["Observe the parallel port A and see if the LEDs are changing in a decrementing binary sequence.  If this is not the output, check your code or ask your instructor for assistance.", "Observe the parallel port A and see if the LEDs are changing in a decrementing binary sequence. If this is not the output, check your code or ask your instructor for assistance."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["Let's discuss the operation of the program.  Do not concern yourself with the actual syntax of the assembly language, the general procedure will be discussed.", "Let's discuss the operation of the program. Do not concern yourself with the actual syntax of the assembly language, the general procedure will be discussed."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["In order to access IO devices in IO addresses greater than 256, the address of the IO device must be placed in the DX register before the OUT or IN instructions are used.  The first line places the IO address of the parallel port A, 0200.", "In order to access IO devices in IO addresses greater than 256, the address of the IO device must be placed in the DX register before the OUT or IN instructions are used. The first line places the IO address of the parallel port A, 0200.", "Moves the value 0200 into the DX register which points to the A parallel port. Moves the value 0001 into BX which will be used in two ways to decrement counters. Move the value FF into the lower portion of the accumulator. Move value in AL to IO at DX Move the value FFFF into CX which will be used as a delay so you can see LEDs change. s to the 8051 monitor program.", "MOV DX, 0200h MOV BX,0001h MOV AL, 0FFh OUT DX, AL MOV CX, 0FFFFhTTTTTTTTTTTTTTTTTTTTTTTTT"], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["The second instructions will be used as a decrement value for both subtractions in the program.  The next line moves the value FF into the lower portion of the accumulator register.", "The second instructions will be used as a decrement value for both subtractions in the program. The next line moves the value FF into the lower portion of the accumulator register."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["Remember, FF in binary is 11111111. The next line moves the value stored in the lower portion of the accumulator to the IO device address stored in DX. An IO address is commonly referred to as a port."], "jumps": ["P2280", "P2250"]}, {"id": "P2280", "text": ["After this, the next three lines count down from FFFF to 0000 to provide a delay so that you may see the actual changes of data on the parallel port.  The next line subtracts from the value that we are sending to the parallel port.", "After this, the next three lines count down from FFFF to 0000 to provide a delay so that you may see the actual changes of data on the parallel port. The next line subtracts from the value that we are sending to the parallel port.", "Move the value FFFF into CX which will be used as a delay so you can see LEDs change. Subtract 0001H from delay register. If result of subtract is 0 then continue, if not jump to 100C. Subtract 01H from the AL register which we will be sending to IO. Move the value FFFF into CX which will be used as a delay so you can see LEDs change. eturns to the 8051 monitor program.", "MOV CX, 0FFFFh SUB CX, BX JNZ 0FCh SUB AL, BH DX, AL MOV CX, 0FFFFhTTTTTTTTTTTTTTTTTTTTTTTTT"], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["After the subtraction, the next instruction looked at the flags to see if the result was zero.  If it was, then the program jumps back  to where we placed FF into the lower portion of the accumulator and continues executing from there.", "After the subtraction, the next instruction looked at the flags to see if the result was zero. If it was, then the program jumps back to where we placed FF into the lower portion of the accumulator and continues executing from there.", "Subtract 01H from the AL register which we will be sending to IO. If result of subtract is zero then jump to 1006 to reset AL. Jump to 1008 which will send AL to the output port again. zero then jump to 1006 to reset AL. Jump to 1008 which will send AL to the output port again. h will be used as a delay so you can see LEDs change. eturns to the 8051 monitor program.", "SUB AL, BH JZ 0F2h JMP 0F2hhhhhhhhhhh JMP 0F2hMP 0F2h"], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["If the value was not zero, then the instruction after this one jumps to the out instruction.  This program is an endless loop which displays the count from FFFF to 0001 over and over.", "If the value was not zero, then the instruction after this one jumps to the out instruction. This program is an endless loop which displays the count from FFFF to 0001 over and over."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["This is just a basic example of sending data to a parallel port.  To be more useful, let's send a byte of data to the parallel port and     then read it from the parallel port.", "This is just a basic example of sending data to a parallel port. To be more useful, let's send a byte of data to the parallel port and then read it from the parallel port."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["13.  Enter the following program into memory starting at \"1000\".          (EDIT, 1000, enter values with an ENTER after each on,                    STOP.)", "13. Enter the following program into memory starting at \"1000\". (EDIT, 1000, enter values with an ENTER after each on, STOP.)", "MOV DX ,0002h MOV AL ,0A5h OUT DX ,AL IN AL ,DX INT 01Ch", "Moves the value 0002h into the DX register which points to the A Parallel port. Moves the value 0A5h into AL which will be sent to port A. Move value in AL to IO at DX Read value from IO "P13040"]}, {"id": "P13070", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13060"]}, {"id": "P13080", "text": ["2. Insert the following 130 experiment cards on the test console. a. Insert PC130-410 8086 Microprocessor card in the PC1 position. b. Insert PC130-411 8086 Decoder/Memory card in the PC2 position. c. Insert PC130-401 I/O card in the PC3 position."], "jumps": []}, {"id": "P13085", "text": ["3.  Place the PC130-404 Keyboard and Display card in front of            the test console between the PC2 and PC3 positions.", "3. Place the PC130-404 Keyboard and Display card in front of the test console between the PC2 and PC3 positions."], "jumps": ["P13090", "P13080"]}, {"id": "P13090", "text": ["4. Connect four experiment cards with the ribbon cables as follows: a. Using the 50 pin ribbon cable, connect PC130-410 J1 to PC130-411 J1. b. Using the short 20 pin ribbon cable, connect PC130-411 J2 to PC130-401 J1. c. Using the long 20 pin ribbon cable, connect PC130-401 J2 to PC130-404 J1.", "The Ribbon Cables must be installed in the proper orientation. Note that each cable has a red stripe on one side. This stripe indicates pin 1. On the Experiment Cards, the numeral 1 or 2 indicates the end of the connector with the 1 pin. Attach the cables to the connectors such that the red stripe is at the end of the connector with the numeral 1 or 2.", "The Ribbon Cables must be installed in the proper orientation. Note that each cable has a red stripe on one side. This stripe indicates pin 1. On the Experiment Cards, the numeral 1 or 2 indicates the end of the connector with the 1 pin. Attach the cables to the connectors such that the red stripe is at the end of the connector with the numeral 1 or 2..", "CAUTION -400 card has its own chassis."], "jumps": ["P13100", "P13085"]}, {"id": "P13100", "text": ["5.  Press enter to set: Positive Supply Voltage -  5", "5. Press enter to set: Positive Supply Voltage - 5......................."], "jumps": ["P13090"]}, {"id": "P13110", "text": ["6.  Press enter to set: PC3 DC Power Switch - ON", "6. Press enter to set: PC3 DC Power Switch - ON..........................."], "jumps": []}, {"id": "P13120", "text": ["7.  Press enter to set: PC2 DC Power Switch - ON", "7. Press enter to set: PC2 DC Power Switch - ON..........................."], "jumps": []}, {"id": "P13130", "text": ["8.  Press enter to set: PC1 DC Power Switch - ON", "8. Press enter to set: PC1 DC Power Switch - ON..........................."], "jumps": []}, {"id": "P13135", "text": ["9. The microprocessor system is now assembled and operating. You should see the message \"NIDA Corporation Intel 8086 Vx.x NIDA:\" in the LCD display on the PC130-404 card. If the message is dim or blank, try adjusting the Display Intensity potentiometer R1 on the PC130-404 card using a small screwdriver. If you still cannot see the message, see your instructor for assistance.", "The \"Vx.x\" in the display of the LCD indicates the version of the monitor program you are using. This experiment is written for all versions of the monitor program. If, at any time during the experiment, you short some of the IC pins together while observing the signals, press the reset button. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run the program before proceeding with your measurements.ts."], "jumps": ["P13140"]}, {"id": "P13140", "text": ["COMMUNICATING WITH THE PARALLEL PORT\nThis experiment has two sections.  In the first section we are going to observe communication with the parallel port, and then write data to it.", "COMMUNICATING WITH THE PARALLEL PORT This experiment has two sections. In the first section we are going to observe communication with the parallel port, and then write data to it."], "jumps": ["P13150", "P13135"]}, {"id": "P13150", "text": ["In the second section, into memory for execution by the 8086 microprocessor. Press the HELP button for a brief summary on entering programs into the 8086."], "jumps": ["P13180", "P13205", "P13210"]}, {"id": "P13205", "text": ["INSTRUCTIONS FOR ENTERING PROGRAMS: 1. Press EDIT on the PC130-404 Keyboard & Display experiment card and enter the desired SEGMENT or OFFSET. A SEGMENT such as 1000 may be entered as 1000:, 1000:0, or 1000:0000. An OFFSET such as 1000 may be entered as 1000, :1000, or 0000:1000. 2. Press ENTER after the desired SEGMENT or OFFSET has been entered. The display will now show the SEGMENT at the top of the display along with OFFSET and store OPCODE at the bottom of the display. NOTE: Every time you enter an OPCODE and press ENTER, you automatically move to the next OFFSET. Additionally, there are three things that can be done at any SEGMENT and OFFSET: Enter a new value and press ENTER, press the down arrow to move to the next OFFSET, or press the up arrow to move to the previous OFFSET. 3. Enter all of the desired OPCODES for the program remembering to press ENTER after each. 4. After all OPCODES of the program have been entered, press the STOP key. 5. The program has now been stored in memory. To verify the program has been stored correctly, press the DISPLAY R.M. key, enter the starting address of the program, and press ENTER. All OPCODES for that location, as well for the next 17 locations, will be displayed. p orders and checks automobile prior to delivery. Advertising and telephone marketing may be required at slow times. Environment - Clean well lighted showroom or outside on a lot. Evenings, days and weekends. Requirements - Must be able to maintain a pleasant attitude with people under stressful conditions. Good personal appearance and manners are important."], "jumps": []}, {"id": "P13210", "text": ["11.  Enter the following program into memory starting at offset               location \"1000\".  (EDIT, 1000, enter OPCODE values with an           ENTER after e let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
