1040"]}, {"id": "P1060", "text": ["4.  Carefully place the PC130-15 into the Test Console PC1                   position.", "4. Carefully place the PC130-15 into the Test Console PC1 position. SCAN FTR 0 C1 00"], "jumps": ["P1050"]}, {"id": "P1065", "text": ["EXPERIMENT CARD PLACEMENT - PC130-15 shown in PC1 position."], "jumps": ["P1060"]}, {"id": "P1070", "text": ["5.  Set PC130-15 switches S1 through S5 to DOWN.", "5. Set PC130-15 switches S1 through S5 to DOWN. ION DO NOT set PC130-15 S5 UP when PC1 DC Power is applied. S5 is used to discharge the capacitors and will short the + DC power supply to ground unless PC DC Power is OFF.", "DO NOT set PC130-15 S5 UP when PC1 DC Power is applied. S5 is used to discharge the capacitors and will short the + DC power supply to ground unless PC DC Power is OFF."], "jumps": ["P1080", "P1060"]}, {"id": "P1075", "text": ["SWITCH POSITIONS - S1 through S5 DOWN (open)."], "jumps": ["P1070"]}, {"id": "P1080", "text": ["6.  Turn PC1 DC Power switch to ON.", "6. Turn PC1 DC Power switch to ON........................................."], "jumps": ["P1070"]}, {"id": "P1090", "text": ["7.  Adjust the Positive Supply Voltage for a reading of 10 volts on      your multimeter.", "7. Adjust the Positive Supply Voltage for a reading of 10 volts on your multimeter. Adjust the Positive Supply Voltage for a reading of 10 volts on your multimeter."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["The experiment is now set up.  Let's use a multimeter to observe the charging and discharging of a capacitor.", "The experiment is now set up. Let's use a multimeter to observe the charging and discharging of a capacitor."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["1.  Connect your multimeter across capacitor C3.   \n2.  Set the multimeter range to 10 volts.", "1. Connect your multimeter across capacitor C3. 2. Set the multimeter range to 10 volts."], "jumps": ["P1120", "P1100"]}, {"id": "P1115", "text": ["LEAD PLACEMENT - To measure C3, place test leads across TP1 and TP4."], "jumps": ["P1110"]}, {"id": "P1120", "text": ["3.  While observing the meter, place S3 to UP on PC130-15.                   Notice how long it took for C3 to charge to 10 volts. The RC            time constant equals 2.2 seconds.  It takes 11 seconds for C3        to fully charge.", "3. While observing the meter, place S3 to UP on PC130-15. Notice how long it took for C3 to charge to 10 volts. The RC time constant equals 2.2 seconds. It takes 11 seconds for C3 to fully charge. isconnect the multimeter."], "jumps": ["P1130", "P1110"]}, {"id": "P1125", "text": ["LEAD PLACEMENT - S3 Up (Closed), Place test leads across TP1 and TP4."], "jumps": ["P1120"]}, {"id": "P1127", "text": ["CALCULATING RC TIME CONSTANT - It takes 5 TCs to fully charge a capacitor. One time constant for C3 is 2.2 seconds, so it takes 11 seconds for C3 to charge.", "TC = R x C = 10 k x 220 MFD = 1000 x .000220 = 2.2 seconds"], "jumps": ["P1120"]}, {"id": "P1130", "text": ["Now, let's observe the discharging of a capacitor. \n4.  Disconnect the meter and set the PC1 DC switch to OFF.", "Now, let's observe the discharging of a capacitor. 4. Disconnect the meter and set the PC1 DC switch to OFF. The multimeter must be disconnected. If not, the capacitor will discharge through the meter.", "The multimeter must be disconnected. If not, the capacitor will discharge through the meter.k"], "jumps": ["P1120"]}, {"id": "P1140", "text": ["5.  While observing the meter, quickly connect the multimeter              across C3 and place S5 to UP on PC130-15.  Notice that C3            discharges in about 11 seconds.  Disconnect the multimeter.", "5. While observing the meter, quickly connect the multimeter across C3 and place S5 to UP on PC130-15. Notice that C3 discharges in about 11 seconds. Disconnect the multimeter."], "jumps": ["P1150", "P1130"]}, {"id": "P1145", "text": ["LEAD PLACEMENT - S3 and S5 Up (Closed), Place leads across TP1 and TP4."], "jumps": ["P1140"]}, {"id": "P1150", "text": ["6.  Place S3 and S5 to DOWN position on PC130-15. \n     Calculate the RC time constant for C1 on PC130-15.", "6. Place S3 and S5 to DOWN position on PC130-15. Calculate the RC time constant for C1 on PC130-15."], "jumps": ["P1140"]}, {"id": "P1151", "text": [], "jumps": ["P1150"]}, {"id": "P1152", "text": ["Your calculation is off.  Remember, multiply the resistance, in ohms, times the capacitance, in farads.", "Your calculation is off. Remember, multiply the resistance, in ohms, times the capacitance, in farads. TC = R x C"], "jumps": ["P1150"]}, {"id": "P1153", "text": ["The capacitor fully charges or discharges in .05 seconds (5 time constants).  Calculate the value for 1 time constant.", "The capacitor fully charges or discharges in .05 seconds (5 time constants). Calculate the value for 1 time constant. TC = R x C"], "jumps": ["P1150"]}, {"id": "P1155", "text": ["CALCULATING RC TIME CONSTANTS - Multiply the resistance, in ohms, times the capacitance, in farads."], "jumps": ["P1150"]}, {"id": "P1160", "text": ["Notice C1 has a shorter time constant than C3. C1 takes approximately .05 seconds to charge or discharge. You must be quick to observe the charge or discharge cycle of C1.", "Notice C1 has a shorter time constant than C3. C1 takes approximately .05 seconds to charge or discharge. You must be quick to observe the charge or discharge cycle of C1. Time Constant C3 Time Constant TC = 1 k", "F = 1000 x .000010 = 10,000 x .000220 = .01 seconds = 2.2 secondsss", "C1 Time Constant TC = 1 kW x 10 mF = 1000 x .000010 = .01 seconds", "C3 Time Constant TC = 10 kW x 220 mF = 10,000 x .000220 = 2.2 seconds"], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["7.  Turn PC1 DC Power switch to ON.", "7. Turn PC1 DC Power switch to ON. AUTION Make sure PC130-15 switch S5 is DOWN.", "Make sure PC130-15 switch S5 is DOWN...ower is applied. S5 is used to discharge the capacitors and will short the + DC power supply to ground unless PC l control settings.", "1. Set the Test Console Controls to their initial control settings........"], "jumps": ["P13030"]}, {"id": "P13050", "text": ["2.  Press Enter to set: Positive Supply Voltage - 12", "2. Press Enter to set: Positive Supply Voltage - 12......................."], "jumps": []}, {"id": "P13060", "text": ["3.  Carefully place the PC130-15 into the Test Console PC1                   position.", "3. Carefully place the PC130-15 into the Test Console PC1 position."], "jumps": ["P13070"]}, {"id": "P13065", "text": ["EXPERIMENT CARD PLACEMENT - PC130-15 shown in PC1 position."], "jumps": ["P13060"]}, {"id": "P13070", "text": ["4.  Set PC130-15 switches S1 through S5 to DOWN.", "4. Set PC130-15 switches S1 through S5 to DOWN. UTION DO NOT set PC130-15 S5 UP when PC1 DC Power is applied. S5 is used to discharge the capacitors and will short the + DC power supply to ground unless PC DC Power is OFF.", "DO NOT set PC130-15 S5 UP when PC1 DC Power is applied. S5 is used to discharge the capacitors and will short the + DC power supply to ground unless PC DC Power is OFF."], "jumps": ["P13080", "P13060"]}, {"id": "P13075", "text": ["SWITCH POSITIONS - S1 through S5 DOWN (open)."], "jumps": ["P13070"]}, {"id": "P13080", "text": ["5.  Press Enter to set: PC1 DC Power Switch - ON", "5. Press Enter to set: PC1 DC Power Switch - ON..........................."], "jumps": ["P13070"]}, {"id": "P13100", "text": ["The experiment is now set up. Let's use a multimeter to observe the charging and discharging of a capacitor."], "jumps": ["P13110"]}, {"id": "P13110", "text": ["1.  Connect your multimeter across capacitor C3.   \n2.  Set the multimeter range to 30 volts.", "1. Connect your multimeter across capacitor C3. 2. Set the multimeter range to 30 volts."], "jumps": ["P13120", "P13100"]}, {"id": "P13115", "text": ["LEAD PLACEMENT - To measure C3, place test leads across TP1 and TP4."], "jumps": ["P13110"]}, {"id": "P13120", "text": ["3.  While observing the meter, place S3 to UP on PC130-15.                  Notice how long it took for C3 to charge to 12 volts. The RC            time constant equals 2.2 seconds.  It takes 11 seconds for C3        to fully charge.", "3. While observing the meter, place S3 to UP on PC130-15. Notice how long it took for C3 to charge to 12 volts. The RC time constant equals 2.2 seconds. It takes 11 seconds for C3 to fully charge. Disconnect the multimeter."], "jumps": ["P13130", "P13110"]}, {"id": "P13125", "text": ["LEAD PLACEMENT - S3 Up (Closed), Place test leads across TP1 and TP4."], "jumps": ["P13120"]}, {"id": "P13127", "text": ["CALCULATING RC TIME CONSTANT - It takes 5 TCs to fully charge a capacitor. One time constant for C3 is 2.2 seconds, so it takes 11 seconds for C3 to charge.", "TC = R x C = 10 k x 220 MFD = 1000 x .000220 = 2.2 seconds"], "jumps": ["P13120"]}, {"id": "P13130", "text": ["Now, let's observe the discharging of a capacitor.   \n4.  Disconnect the meter.   \n5.  Press enter to set: PC1 DC Power Switch - OFF", "Now, let's observe the discharging of a capacitor. 4. Disconnect the meter. 5. Press enter to set: PC1 DC Power Switch - OFF The multimeter must be disconnected. If not, the capacitor will discharge through the meter.", "The multimeter must be disconnected. If not, the capacitor will discharge through the meter."], "jumps": ["P13120"]}, {"id": "P13140", "text": ["6.  While observing the meter, quickly connect the multimeter              across C3 and place S5 to UP on PC130-15. Notice that C3             discharges in about 11 seconds.  Disconnect the multimeter.", "6. While observing the meter, quickly connect the multimeter across C3 and place S5 to UP on PC130-15. Notice that C3 discharges in about 11 seconds. Disconnect the multimeter."], "jumps": ["P13150"]}, {"id": "P13145", "text": ["LEAD PLACEMENT - S3 and S5 Up (Closed), Place leads across TP1 and TP4."], "jumps": ["P13140"]}, {"id": "P13150", "text": ["7.  Place S3 and S5 to DOWN position on PC130-15. \n     Calculate the RC time constant for C1 on PC130-15.", "7. Place S3 and S5 to DOWN position on PC130-15. Calculate the RC time constant for C1 on PC130-15."], "jumps": ["P13140"]}, {"id": "P13151", "text": [], "jumps": []}, {"id": "P13152", "text": ["Your calculation is off. Remember, multiply the resistance, in ohms, times the capacitance, in farads.", "Your calculation is off. Remember, multiply the resistance, in ohms, times the capacitance, in farads. TC = R x C"], "jumps": ["P13150"]}, {"id": "P13153", "text": ["The capacitor fully charges or discharges in .05 seconds (5 time constants). Calculate the value for 1 time constant.", "The capacitor fully charges or discharges in .05 seconds (5 time constants). Calculate the value for 1 time constant. TC = R x C"], "jumps": ["P13150"]}, {"id": "P13155", "text": ["CALCULATING RC TIME CONSTANTS - Multiply the resistance, in ohms, times the capacitance, in farads. TC = R x C"], "jumps": ["P13150"]}, {"id": "P13160", "text": ["Notice C1 has a shorter time constant than C3. C1 takes approximately .05 seconds to charge or discharge. You must be quick to observe the charge or discharge cycle of C1.", "Notice C1 has a shorter time constant than C3. C1 takes approximately .05 seconds to charge or discharge. You must be quick to observe the charge or discharge cycle of C1. C1 Time Constant C3 Time Constant TC = 1 k", "F = 1000 x .000010 = 10,000 x .000220 = .01 seconds = 2.2 seconds", "C1 Time Constant TC = 1 kW x 10 mF = 1000 x .000010 = .01 seconds", "C3 Time Constant TC = 10 kW x 220 mF = 10,000 x .000220 = 2.2 seconds"], "jumps": ["P13170", "P13150"]}, {"id": "P13170", "text": ["8.  Press Enter to set: PC1 DC Power Switch - ON", "8. Press Enter to set: PC1 DC Power Switch - ON CAUTION Make sure PC130-15 switch S5 is DOWN.", "Make sure PC130-15 switch S5 is DOWN...ower is applied. S5 is used to discharge the capacitors and will short the + DC power supply to ground unless PC DC Power is OFF."], "jumps": ["P13160"]}, {"id":  Enter to set: Voltage Select - 12", "2. Press Enter to set: Voltage Select - 12222222222......................."], "jumps": []}, {"id": "P14060", "text": ["3.  Carefully place the PC130-15 into the Test Console PC                      position.", "3. Carefully place the PC130-15 into the Test Console PC position."], "jumps": ["P14070"]}, {"id": "P14070", "text": ["4.  Set PC130-15 switches S1 through S5 to DOWN.", "4. Set PC130-15 switches S1 through S5 to DOWN. UTION DO NOT set PC130-15 S5 UP when PC1 DC Power is applied. S5 is used to discharge the capacitors and will short the + DC power supply to ground unless PC DC Power is OFF.", "DO NOT set PC130-15 S5 UP when DC Power is applied. S5 is used to discharge the capacitors and will short the + DC power supply to ground unless DC Power is OFF........"], "jumps": ["P14080", "P14060"]}, {"id": "P14075", "text": ["SWITCH POSITIONS - S1 through S5 DOWN (open)."], "jumps": ["P14070"]}, {"id": "P14080", "text": ["5.  Press Enter to set: DC Power - ON", "5. Press Enter to set: DC Power - ONNNNNNNNNNNN..........................."], "jumps": ["P14070"]}, {"id": "P14100", "text": ["The experiment is now set up.  Let's use a multimeter to observe the charging and discharging of a capacitor.", "The experiment is now set up. Let's use a multimeter to observe the charging and discharging of a capacitor."], "jumps": ["P14110"]}, {"id": "P14110", "text": ["1.  Connect your multimeter across capacitor C3.   \n2.  Set the multimeter range to 30 volts.", "1. Connect your multimeter across capacitor C3. 2. Set the multimeter range to 30 volts."], "jumps": ["P14120", "P14100"]}, {"id": "P14115", "text": ["LEAD PLACEMENT - To measure C3, place test leads across TP1 and TP4."], "jumps": ["P14110"]}, {"id": "P14120", "text": ["3.  While observing the meter, place S3 to UP on PC130-15.                  Notice how long it took for C3 to charge to 12 volts. The RC            time constant equals 2.2 seconds.  It takes 11 seconds for C3        to fully charge.", "3. While observing the meter, place S3 to UP on PC130-15. Notice how long it took for C3 to charge to 12 volts. The RC time constant equals 2.2 seconds. It takes 11 seconds for C3 to fully charge. Disconnect the multimeter."], "jumps": ["P14130", "P14110"]}, {"id": "P14125", "text": ["LEAD PLACEMENT - S3 Up (Closed), Place test leads across TP1 and TP4."], "jumps": ["P14120"]}, {"id": "P14127", "text": ["CALCULATING RC TIME CONSTANT - It takes 5 TCs to fully charge a capacitor. One time constant for C3 is 2.2 seconds, so it takes 11 seconds for C3 to charge.", "TC = R x C = 10 k x 220 MFD = 1000 x .000220 = 2.2 seconds"], "jumps": ["P14120"]}, {"id": "P14130", "text": ["Now, let's observe the discharging of a capacitor.   \n4.  Disconnect the meter.   \n5.  Press enter to set: DC Power - OFF", "Now, let's observe the discharging of a capacitor. 4. Disconnect the meter. 5. Press enter to set: DC Power - OFF The multimeter must be disconnected. If not, the capacitor will discharge through the meter.", "The multimeter must be disconnected. If not, the capacitor will discharge through the meter."], "jumps": ["P14120"]}, {"id": "P14140", "text": ["6.  While observing the meter, quickly connect the multimeter              across C3 and place S5 to UP on PC130-15. Notice that C3             discharges in about 11 seconds.  Disconnect the multimeter.", "6. While observing the meter, quickly connect the multimeter across C3 and place S5 to UP on PC130-15. Notice that C3 discharges in about 11 seconds. Disconnect the multimeter."], "jumps": ["P14150"]}, {"id": "P14145", "text": ["LEAD PLACEMENT - S3 and S5 Up (Closed), Place leads across TP1 and TP4."], "jumps": ["P14140"]}, {"id": "P14150", "text": ["7.  Place S3 and S5 to DOWN position on PC130-15. \n     Calculate the RC time constant for C1 on PC130-15.", "7. Place S3 and S5 to DOWN position on PC130-15. Calculate the RC time constant for C1 on PC130-15."], "jumps": ["P14140"]}, {"id": "P14151", "text": [], "jumps": []}, {"id": "P14152", "text": ["Your calculation is off. Remember, multiply the resistance, in ohms, times the capacitance, in farads.", "Your calculation is off. Remember, multiply the resistance, in ohms, times the capacitance, in farads. TC = R x C"], "jumps": ["P14150"]}, {"id": "P14153", "text": ["The capacitor fully charges or discharges in .05 seconds (5 time constants). Calculate the value for 1 time constant.", "The capacitor fully charges or discharges in .05 seconds (5 time constants). Calculate the value for 1 time constant. TC = R x C"], "jumps": ["P14150"]}, {"id": "P14155", "text": ["CALCULATING RC TIME CONSTANTS - Multiply the resistance, in ohms, times the capacitance, in farads. TC = R x C"], "jumps": ["P14150"]}, {"id": "P14160", "text": ["Notice C1 has a shorter time constant than C3. C1 takes approximately .05 seconds to charge or discharge. You must be quick to observe the charge or discharge cycle of C1.", "Notice C1 has a shorter time constant than C3. C1 takes approximately .05 seconds to charge or discharge. You must be quick to observe the charge or discharge cycle of C1. C1 Time Constant C3 Time Constant TC = 1 k", "F = 1000 x .000010 = 10,000 x .000220 = .01 seconds = 2.2 seconds", "C1 Time Constant TC = 1 kW x 10 mF = 1000 x .000010 = .01 seconds", "C3 Time Constant TC = 10 kW x 220 mF = 10,000 x .000220 = 2.2 seconds"], "jumps": ["P14170", "P14150"]}, {"id": "P14170", "text": ["8.  Press Enter to set: DC Power - ON", "8. Press Enter to set: DC Power - ON CAUTION Make sure PC130-15 switch S5 is DOWN.", "Make sure PC130-15 switch S5 is DOWN...ower is applied. S5 is used to discharge the capacitors and will short the + DC power supply to ground unless PC DC Power is OFF."], "jumps": ["P14160"]}, {"id": "P14180", "text": ["9.  Connect multimeter across C1 on PC130-15. \n10.  While observing the meter, place S1 to UP on PC130-15.                   Notice the meter cannot move as fast as the capacitor document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
</body>
</html>
