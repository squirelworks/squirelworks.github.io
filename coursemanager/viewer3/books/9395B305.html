const book = {"title": "9395B305", "pages": [{"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 11-29-99 Converted from storyboard to toolbook. frieda 12-22-99 Text & Branching - lisa 02-16-00 Completed graphics. ben 03--22-00 tested lesson-John Ayala 03-23-00 Reviewed. frieda 07-14-00 Converted to ToolBook 7.1 format. jay 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-07-02 Checked for convertion errors. John Ayala 05-02-02 Review - lisa 03-25-03 Changed variagle resistor labeling from R6 to R1 in exp starting @p14040 - james 03-25-03 Changed the same in 130A lesson portion - Dean 11-05-03 P13310, placed +/- between 36kHz 1kHz P14210, added \"Place PC130-333 into test console PC3 position\" - Dean", "07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 11-29-99 Converted from storyboard to toolbook. frieda 12-22-99 Text & Branching - lisa 02-16-00 Completed graphics. ben 03--22-00 tested lesson-John Ayala 03-23-00 Reviewed. frieda 07-14-00 Converted to ToolBook 7.1 format. jay 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-07-02 Checked for convertion errors. John Ayala 05-02-02 Review - lisa 03-25-03 Changed variagle resistor labeling from R6 to R1 in exp starting @p14040 - james"], "jumps": []}, {"id": "P14910", "text": ["This completes the experiment on DM RECEIVER CIRCUITS.", "This completes the experiment on DM RECEIVER CIRCUITS......"], "jumps": ["P2001", "P14580"]}, {"id": "P14580", "text": ["2.  Disconnect all test equipment. \n3.  Carefully remove experiment cards. \n4.  Return all equipment to the designated storage areas.", "2. Disconnect all test equipment. 3. Carefully remove experiment cards. 4. Return all equipment to the designated storage areas."], "jumps": ["P14910", "P14570"]}, {"id": "P14570", "text": ["1.  Set the Test Console Power to OFF.", "1. Set the Test Console Power to OFF.F.FF................................."], "jumps": []}, {"id": "P14550", "text": ["The waveforms on TPs 2, 3, 4, and 5 (along with the input signal on TP1 and the output signal on TP6) will be important to remember when troubleshooting the circuit."], "jumps": ["P14540"]}, {"id": "P14549", "text": ["Volt/Div = .1 Time/Div = .2mS Coupling = AC"], "jumps": []}, {"id": "P14548", "text": ["Volt/Div = .1 Time/Div = .2mS Coupling = AC"], "jumps": []}, {"id": "P14547", "text": ["Volt/Div = 5 Time/Div = - Coupling = DCC"], "jumps": []}, {"id": "P14546", "text": ["TP2 - Clock input to demodulator, 36 kHz, 10 Vpp Square wave.", "Volt/Div = 5 Time/Div = 5mS Coupling = DC", "MEASUREMENT SETUP - Measure following TPs on PC130-333."], "jumps": ["P", "Pd"]}, {"id": "P14540", "text": ["12.  Finally, measure the following TPs using CH1 of the                         oscilloscope.", "12. Finally, measure the following TPs using CH1 of the oscilloscope. TP2 - clock input to demodulator TP3 - Filter signal TP4 - RC time constant waveform TP5 - Filter signal"], "jumps": ["P14550", "P14530"]}, {"id": "P14530", "text": ["11.  Adjust R1 so that you have an output signal on CH2.", "11. Adjust R1 so that you have an output signal on CH2....", "9. Return the output frequency of the function generator to 1 kHz. 10. Vary PC130-333 R1. Notice that you either have an output signal or you don't. R1 changes the amplitude of the DM signal and amplitude levels are not used, only changes in amplitude."], "jumps": ["P14540", "P14520", "P14530", "P14510"]}, {"id": "P14510", "text": ["8.  Increase and decrease the frequency output of the function           generator.  Notice that above 4 kHz, you do not have an                   output signal on CH2.  Remember, the system is set up for              voice signals between 400 Hz and 4 kHz.", "8. Increase and decrease the frequency output of the function generator. Notice that above 4 kHz, you do not have an output signal on CH2. Remember, the system is set up for voice signals between 400 Hz and 4 kHz."], "jumps": ["P14520", "P14500"]}, {"id": "P14500", "text": ["The noise can be filtered but, also recall that DM systems are used mostly for voice communication and an exact reproduction of the input signal is not critical in the demodulator."], "jumps": ["P14510", "P14490"]}, {"id": "P14490", "text": ["Recalling that a constant analog input to a DM modulator produces a toggling output signal, the toggling DM signal when demodulated produces noise."], "jumps": ["P14500", "P14480"]}, {"id": "P14480", "text": ["During the peaks, the amplitude of the input signal to the modulator is not changing, a constant level."], "jumps": ["P14490", "P14470"]}, {"id": "P14470", "text": ["The demodulator circuit is operating correctly.  Notice the noise around the peaks of the demodulator output signal on CH2.", "The demodulator circuit is operating correctly. Notice the noise around the peaks of the demodulator output signal on CH2."], "jumps": ["P14480", "P14460"]}, {"id": "P14462", "text": ["The output of the demodulator should be a 1 kHz sine wave signal. If not, check that the signal on PC130-333 TP2 is 36 kHz and that the output of the modulator, PC130-332, is correct.", "The output of the demodulator should be a 1 kHz sine wave signal. If not, check that the signal on PC130-333 TP2 is 36 kHz and that the output of the modulator, PC130-332, is correct....."], "jumps": []}, {"id": "P14461", "text": [], "jumps": []}, {"id": "P14460", "text": ["Is the signal on CH2 a 1 kHz sine wave signal (there may be noise)?"], "jumps": ["P14450"]}, {"id": "P14450", "text": ["7.  Compare the analog input signal of the modulator (CH1) to the      analog output signal of the demodulator (CH2).", "6.  Connect the CH2 probe to TP6 on PC130-333.  This is the               analog output of the demodulator.", "7. Compare the analog input signal of the modulator (CH1) to the analog output signal of the demodulator (CH2).", "6. Connect the CH2 probe to TP6 on PC130-333. This is the analog output of the demodulator."], "jumps": ["P14460", "P14440", "P14450", "P14430"]}, {"id": "P14430", "text": ["5.  Connect the CH1 probe to TP1 on PC130-332.  This is the                input information signal to the modulator.", "5. Connect the CH1 probe to TP1 on PC130-332. This is the input information signal to the modulator."], "jumps": ["P14440", "P14420"]}, {"id": "P14420", "text": ["4.  On the oscilloscope, set the controls as follows:", "3.  Using the oscilloscope, measure the signal on PC130-333 TP1      and adjust R1 for a 8 Vpp signal.  This adjusts the incoming           DM signal so that the demodulator is not overdriven.", "4. On the oscilloscope, set the controls as follows: lt/Div CH1 - 0.5 Volt/Div CH2 - 0.05 Time/Div - 0.1 ms Triggering - CH1, AC, + Display - Dual", "Volt/Div CH1 - 0.5 Volt/Div CH2 - 0.05 Time/Div - 0.1 ms Triggering - CH1, AC, + Display - Dualll - Duallll", "3. Using the oscilloscope, measure the signal on PC130-333 TP1 and adjust R1 for a 8 Vpp signal. This adjusts the incoming DM signal so that the demodulator is not overdriven."], "jumps": ["P14430", "P14410", "P14420", "P14400"]}, {"id": "P14400", "text": ["The DM signal on PC130-333 pin E indicates that the modulator circuit is operating correctly and the transmitted signal is reaching the receiver."], "jumps": ["P14410", "P14390"]}, {"id": "P14392", "text": ["Something in the modulator, PC130-332, is incorrect, you should be receiving a DM signal in PC130-333 pin E.  Check that the function generator is outputting a 1 kHz, 1 Vpp signal on PC130-332 TP1 and that the output of the clock for the modulator is 36 kHz at PC130-332 TP2.  As a last resort, check with your instructor.", "Something in the modulator, PC130-332, is incorrect, you should be receiving a DM signal in PC130-333 pin E. Check that the function generator is outputting a 1 kHz, 1 Vpp signal on PC130-332 TP1 and that the output of the clock for the modulator is 36 kHz at PC130-332 TP2. As a last resort, check with your instructor....................."], "jumps": []}, {"id": "P14391", "text": [], "jumps": []}, {"id": "P14390", "text": ["2.  Measure the signal on PC130-333 Pin E.  Is the input signal to        the demodulator circuit a DM signal?", "2. Measure the signal on PC130-333 Pin E. Is the input signal to the demodulator circuit a DM signal?"], "jumps": ["P14380"]}, {"id": "P14380", "text": ["1.  Ensure that the function generator is applying a 1 kHz, 1 Vpp        signal as measured on PC130-332 TP1.", "1. Ensure that the function generator is applying a 1 kHz, 1 Vpp signal as measured on PC130-332 TP1."], "jumps": ["P14390", "P14370"]}, {"id": "P14370", "text": ["The receiver is now aligned to the same sample rate as was used in the modulator.  The demodulator circuit will change the DM signal back to the analog signal that was input to the modulator. With the use of the oscilloscope, examine the signal.", "6.  Using a frequency counter if available (use an oscilloscope if        not), adjust R2 on PC130-333 for a 36 kHz 1 kHz signal as               measured on TP2.  Note that the Nida 440 function generator         has a built-in frequency counter.", "The receiver is now aligned to the same sample rate as was used in the modulator. The demodulator circuit will change the DM signal back to the analog signal that was input to the modulator. With the use of the oscilloscope, examine the signal...........", "6. Using a frequency counter if available (use an oscilloscope if not), adjust R2 on PC130-333 for a 36 kHz 1 kHz signal as measured on TP2. Note that the Nida 440 function generator has a built-in frequency counter."], "jumps": ["P14380", "P14360", "P14370"]}, {"id": "P14350", "text": ["5.  Press Enter to set: PC2 DC Power Switch - ON \n                                          PC3 DC Power Switch - ON", "4.  On PC130-333, set R1 and R2 to mid position.", "5. Press Enter to set: PC2 DC Power Switch - ON PC3 DC Power Switch - ON", "4. On PC130-333, set R1 and R2 to mid position............"], "jumps": ["P14340", "P14350"]}, {"id": "P14220", "text": ["3.  Press Enter to set: Positive Supply Voltage - 12", "3. Press Enter to set: Positive Supply Voltage - 12......................."], "jumps": ["P14210"]}, {"id": "P14210", "text": ["test console PC2 position. Place PC130-333 into the tes", "2. Place PC130-332 into the test console PC2 position. Place PC130-333 into the test console PC3 position..."], "jumps": ["P14220"]}, {"id": "P14200", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P14190"]}, {"id": "P14190", "text": ["Let's start the experiment.", "Let's start the experiment.OTE The DM Transmitter circuit cards must be aligned as per the DM Transmitter experiment before entering the DM Experiment. If you have not aligned these circuit cards or are unsure whether they are aligned return to the Lesson Menu, select DM Transmitter Operation and align the circuit cards.", "The DM Transmitter circuit cards must be aligned as per the DM Transmitter experiment before entering the DM Experiment. If you have not aligned these circuit cards or are unsure whether they are aligned return to the lesson menu, select DM Transmitter Operation and align the circuit cards...", "NOTEEEThe DM Transmitter circuit cards must be aligned as per the DM Transmitter experiment before entering the DM Experiment. If you have not aligned these circuit cards or are unsure whether they are aligned return to the lesson menu, select DM Transmitter Operation and align the circuit cards."], "jumps": ["P14200", "P14150"]}, {"id": "P14180", "text": ["Match up the other components on the card to the schematic."], "jumps": ["P14190", "P14150"]}, {"id": "P14170", "text": ["TP1 is the DM signal input test point and TP6 is the recovered analog information signal test point."], "jumps": ["P14180", "P14150"]}, {"id": "P14160", "text": ["R1 adjusts the input level and R2 sets the sample rate to match the modulator.", "Now, pick up the PC130-333 card and compare to the schematic."], "jumps": ["P14170", "P14150", "P14160", "P14140"]}, {"id": "P14140", "text": ["For a detailed analysis of the external circuits, refer to a manufacturer's data book on the MC3418 chip."], "jumps": ["P14150", "P14050"]}, {"id": "P14130", "text": ["Note that the external circuits are almost identical to the ones used in the modulator.  Of course, the frequencies used are the same so the external circuits are the same.", "Note that the external circuits are almost identical to the ones used in the modulator. Of course, the frequencies used are the same so the external circuits are the same."], "jumps": ["P14140", "P14050"]}, {"id": "P14120", "text": ["The other components and IC1 chip connections are for the normal operation of the demodulator for the frequencies that are used in this experiment."], "jumps": ["P14130", "P14050"]}, {"id": "P14110", "text": ["The demodulator chip is set up to operate using digital signals with a ground, or a LOW, on pin 15."], "jumps": ["P14120", "P14050"]}, {"id": "P14100", "text": ["Pin 8 is grounded since a single power source is used and\npin 16 is connected to +12 volts.", "Pin 8 is grounded since a single power source is used and pin 16 is connected to +12 volts."], "jumps": ["P14110", "P14050"]}, {"id": "P14090", "text": ["The clock frequency from IC2c and IC2b is applied to pin 14."], "jumps": ["P14100", "P14050"]}, {"id": "P14080", "text": ["The RC time constant of the integrator is produced by R7 and C4 connected between pins 6 and 7 and are the same values used in the modulator."], "jumps": ["P14090", "P14050"]}, {"id": "P14070", "text": ["The output of the integrator, recovered information signal, is taken from pin 7 through R5."], "jumps": ["P14080", "P14050"]}, {"id": "P14060", "text": ["Recall that the DM signal was inverted in the modulator so it has to be inverted again in the demodulator."], "jumps": ["P14070", "P14050"]}, {"id": "P14050", "text": ["The DM signal is applied to pin 13 of IC1, the demodulator, through R1, level control, and IC2a, an inverter.", "The receiver circuit is contained on PC130-333 and consists of the components necessary to support the MC3418 CVSD demodulator chip."], "jumps": ["P14060", "P14040", "P14050", "P14020"]}, {"id": "P14020", "text": ["In this experiment, you will observe the operation and measure signals in a typical DM receiver circuit."], "jumps": ["P14040", "P2001"]}, {"id": "P13910", "text": ["This completes the experiment on DM TRANSMITTER CIRCUITS.", "This completes the experiment on DM TRANSMITTER CIRCUITS..."], "jumps": ["P1001", "P13510"]}, {"id": "P13510", "text": ["2.  Disconnect all test equipment. \n3.  Carefully remove experiment cards.\n4.  Return all equipment to the designated storage areas.", "2. Disconnect all test equipment. 3. Carefully remove experiment cards. 4. Return all equipment to the designated storage areas."], "jumps": ["P13910", "P13500"]}, {"id": "P13500", "text": ["1.  Set the Test Console Power to OFF.", "1. Set the Test Console Power to OFF.F.FF................................."], "jumps": []}, {"id": "P13480", "text": ["The waveforms on TPs 2, 3, 5 and 6 (along with the input signal on TP1 and the output signal on TP4) will be important to remember when troubleshooting the circuit."], "jumps": ["P13470"]}, {"id": "P13479", "text": ["Volt/Div = .1 Time/Div = .2mS Coupling = AC"], "jumps": []}, {"id": "P13478", "text": ["TP5 - RC time constant waveform, Triangle.", "Volt/Div = .5 Time/Div = .2mS Coupling = AC"], "jumps": []}, {"id": "P13477", "text": ["Volt/Div = 1 Time/Div = - Coupling = DCC"], "jumps": []}, {"id": "P13476", "text": ["TP2 - Clock input to modulator. CLOCK, 36 kHz, 10 Vpp Squarewave.", "Volt/Div = 5 Time/Div = 5ms Coupling = DC", "MEASUREMENT SETUP - Measure the following TPs using CH1."], "jumps": []}, {"id": "P13470", "text": ["12.  Finally, measure the following TPs using CH1 of the                         oscilloscope.", "10.  Set R1 on PC130-332 back to mid position. \n11.  Ensure that the analog information input signal from the                  function generator is 1 kHz, 1 Vpp sine wave.", "12. Finally, measure the following TPs using CH1 of the oscilloscope. ulator TP3 - Filter signal TP5 - RC time constant waveform TP6 - Filter signal]", "10. Set R1 on PC130-332 back to mid position. 11. Ensure that the analog information input signal from the function generator is 1 kHz, 1 Vpp sine wave."], "jumps": ["P13480", "P13460", "P13470", "P13450"]}, {"id": "P13450", "text": ["You may not see much change.  However, if the signal input is too large, the demodulator circuit will be overdriven and produce distorted output signals.", "8.  Return the frequency output of the function generator to \n     1 kHz. \n9.  While observing the input and output signals of the                           modulator, vary R1 on PC130-332 to change the amplitude             of the analog information input signal.", "You may not see much change. However, if the signal input is too large, the demodulator circuit will be overdriven and produce distorted output signals.", "8. Return the frequency output of the function generator to 1 kHz. 9. While observing the input and output signals of the modulator, vary R1 on PC130-332 to change the amplitude of the analog information input signal."], "jumps": ["P13460", "P13440", "P13450", "P13430"]}, {"id": "P13430", "text": ["The card is set up and designed for frequencies between 400 Hz and 4 kHz.  Notice what happens to the modulated signal when the function generator exceeds these frequencies limits.", "The card is set up and designed for frequencies between 400 Hz and 4 kHz. Notice what happens to the modulated signal when the function generator exceeds these frequencies limits."], "jumps": ["P13440", "P13420"]}, {"id": "P13420", "text": ["7.  While observing the input and output signals of the                           modulator, vary the frequency of the function generator above      and below 1 kHz.", "7. While observing the input and output signals of the modulator, vary the frequency of the function generator above and below 1 kHz."], "jumps": ["P13430", "P13410"]}, {"id": "P13410", "text": ["6.  Return the output waveform of the function generator to a              sine wave.", "6. Return the output waveform of the function generator to a sine wave."], "jumps": ["P13420", "P13400"]}, {"id": "P13400", "text": ["The CVSD delta modulator circuit is operating correctly producing a HIGH or LOW output for amplitude changes in the analog input signal."], "jumps": ["P13410", "P13390"]}, {"id": "P13392", "text": ["You should see that when the analog input signal, CH1 is increasing, the DM output signal, CH2 is HIGH.  You may have trouble seeing this but, looking real close will confirm the operation of the circuit as you have learned.", "You should see that when the analog input signal, CH1 is increasing, the DM output signal, CH2 is HIGH. You may have trouble seeing this but, looking real close will confirm the operation of the circuit as you have learned......"], "jumps": []}, {"id": "P13391", "text": [], "jumps": []}, {"id": "P13390", "text": ["Looking closely at the CH1 and CH2 traces, what level is the DM output signal when the analog input signal is increasing?"], "jumps": ["P13380"]}, {"id": "P13380", "text": ["5.  Change the output waveform of the function generator to                triangle.  You should be able to see the HIGH and LOW levels        (CH2) match up to the analog input signal (CH1) a little better.", "5. Change the output waveform of the function generator to triangle. You should be able to see the HIGH and LOW levels (CH2) match up to the analog input signal (CH1) a little better."], "jumps": ["P13390", "P13370"]}, {"id": "P13370", "text": ["Notice that CH2 will not sync.  Remember, a sync pulse is not used in delta modulation.  However, you can get a general idea of the levels that are being generated from the collection of the HIGH and LOW scrolling signal.", "Notice that CH2 will not sync. Remember, a sync pulse is not used in delta modulation. However, you can get a general idea of the levels that are being generated from the collection of the HIGH and LOW scrolling signal."], "jumps": ["P13380", "P13360"]}, {"id": "P13360", "text": ["4.  Compare the analog input signal seen on CH1 to the digital            output signal seen on CH2.", "3.  Connect the CH2 probe to PC130-332 TP4.  This is the digital          DM signal output of the modulator.", "2.  Connect the CH1 probe to PC130-332 TP1.  This is the analog        information input signal.", "4. Compare the analog input signal seen on CH1 to the digital output signal seen on CH2.", "3. Connect the CH2 probe to PC130-332 TP4. This is the digital DM signal output of the modulator.", "2. Connect the CH1 probe to PC130-332 TP1. This is the analog information input signal."], "jumps": ["P13370", "P13350", "P13360", "P13340", "P13330"]}, {"id": "P13330", "text": ["1.  Set up the oscilloscope as follows:", "1. Set up the oscilloscope as follows: lt/Div CH1 - 0.5 Volt/Div CH2 - 5 Time/Div - 0.2 ms Triggering - CH1, AC, + AC, GND, DC - DC Display - Dual", "Volt/Div CH1 - 0.5 Volt/Div CH2 - 5 Time/Div - 0.2 ms Triggering - CH1, AC, + AC, GND, DC - DC Display - Dual"], "jumps": ["P13340", "P13320"]}, {"id": "P13320", "text": ["The modulator card is now aligned and is generating a delta modulated signal from the analog information signal.  Let's look at this signal.", "1.  Using a frequency counter if available (if not use an                          oscilloscope), adjust R2 on PC130-332 for a 36 kHz\n    (+/-  1 kHz) signal as measured on TP2.  Note that the \n    Nida 440 function generator has a built in frequency counter.", "The modulator card is now aligned and is generating a delta modulated signal from the analog information signal. Let's look at this signal.", "1. Using a frequency counter if available (if not use an oscilloscope), adjust R2 on PC130-332 for a 36 kHz (+/- 1 kHz) signal as measured on TP2. Note that the Nida 440 function generator has a built in frequency counter."], "jumps": ["P13330", "P13310", "P13320", "P13300"]}, {"id": "P13300", "text": ["The MC3418 chip has a built in divider for establishing the clock frequency.  Therefore, in the experiment, you will set the frequency input to the chip at 36 kHz.", "The MC3418 chip has a built in divider for establishing the clock frequency. Therefore, in the experiment, you will set the frequency input to the chip at 36 kHz."], "jumps": ["P13310", "P13290"]}, {"id": "P13290", "text": ["Now, knowing the minimum sample rate, 8 kHz, you would assume that you set the clock frequency of the same rate. However this is not the case."], "jumps": ["P13300", "P13280"]}, {"id": "P13287", "text": ["You still have not calculated the correct bandwidth.  You should have come up with 8 kHz, the sample rate.", "You still have not calculated the correct bandwidth. You should have come up with 8 kHz, the sample rate."], "jumps": ["P13290", "P13280"]}, {"id": "P13285", "text": ["BANDWIDTH - The bandwidth of a DM system equals the sample rate."], "jumps": []}, {"id": "P13282", "text": ["The bandwidth in a DM system equals the minimum sample rate. Recalculate the bandwidth."], "jumps": []}, {"id": "P13281", "text": [], "jumps": []}, {"id": "P13280", "text": ["Using a sample rate of 8 kHz, calculate and type in the minimum bandwidth of the system.", "Using a sample rate of 8 kHz, calculate and type in the minimum bandwidth of the system..able.le."], "jumps": ["P13270", "P13285", "P13282"]}, {"id": "P13277", "text": ["You still have not calculated the correct sample rate.  You should have come up with 8 kHz, or 2 times 4 kHz.", "You still have not calculated the correct sample rate. You should have come up with 8 kHz, or 2 times 4 kHz."], "jumps": ["P13280", "P13270"]}, {"id": "P13275", "text": ["SAMPLE RATE - The minimum sample rate is the Nyquist rate which is two times the highest information signal frequency."], "jumps": []}, {"id": "P13272", "text": ["The minimum sample frequency is the Nyquist rate which is twice the highest information signal frequency, or twice 4 kHz. Recalculate the sample rate.", "The minimum sample frequency is the Nyquist rate which is twice the highest information signal frequency, or twice 4 kHz. Recalculate the sample rate......"], "jumps": []}, {"id": "P13271", "text": [], "jumps": []}, {"id": "P13270", "text": ["The DM modulator has external circuits designed for information signals between 400 Hz and 4 kHz.  Calculate and type in the minimum sample frequency that can be used?", "The DM modulator has external circuits designed for information signals between 400 Hz and 4 kHz. Calculate and type in the minimum sample frequency that can be used?????????????????????????????????????"], "jumps": ["P13260", "P13272", "P13275"]}, {"id": "P13260", "text": ["The DM modulator circuit is now set up.  The function generator is applying a 1 kHz analog information signal which will be delta   modulated when aligned.  Let's align the modulator.", "The DM modulator circuit is now set up. The function generator is applying a 1 kHz analog information signal which will be delta modulated when aligned. Let's align the modulator."], "jumps": ["P13270"]}, {"id": "P13250", "text": ["7.  Press Enter to set: PC2 DC Power Switch - ON", "6.  On the function generator, set the output for a 1 kHz, 1 Vpp            sine wave signal as measured on PC130-332 TP1.", "7. Press Enter to set: PC2 DC Power Switch - ON...........................", "6. On the function generator, set the output for a 1 kHz, 1 Vpp sine wave signal as measured on PC130-332 TP1."], "jumps": ["P13240", "P13250", "P13230"]}, {"id": "P13235", "text": ["MEASUREMENT SETUP - Connect Function Generator to the Test Console"], "jumps": []}, {"id": "P1235", "text": ["BNC CONNECTION - Connect the Function Generator's Main Output BNC to the Test Console's Output BNC."], "jumps": []}, {"id": "P13230", "text": ["5.  Connect the MAIN output of the function generator to the PC1       OUTPUT BNC.  The function generator is used as the analog          information source.", "4.  On PC130-332, set R1 and R2 to mid position.", "5. Connect the MAIN output of the function generator to the PC1 OUTPUT BNC. The function generator is used as the analog information source.", "4. On PC130-332, set R1 and R2 to mid position............"], "jumps": ["P13240", "P13220", "P13235", "P13230"]}, {"id": "P13210", "text": ["3.  Press Enter to set: Positive Supply Voltage - 12", "3. Press Enter to set: Positive Supply Voltage - 12......................."], "jumps": ["P13200"]}, {"id": "P13200", "text": ["2.  Place PC130-332 into the test console PC2 position.", "2. Place PC130-332 into the test console PC2 position....."], "jumps": []}, {"id": "P13190", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13180"]}, {"id": "P13180", "text": ["Let's start the experiment.", "Let's start the experiment.e..............................."], "jumps": ["P13190", "P13140"]}, {"id": "P13170", "text": ["Match up the other components on the card to the schematic."], "jumps": ["P13180", "P13140"]}, {"id": "P13160", "text": ["TP1 is the analog input signal test point and TP4 is the DM output signal test point."], "jumps": ["P13170", "P13140"]}, {"id": "P13150", "text": ["R1 adjusts the input level and R2 sets the sample rate.", "Now, pick up the PC130-332 card and compare to the schematic."], "jumps": ["P13160", "P13140", "P13150", "P13050"]}, {"id": "P13130", "text": ["For a detailed analysis of the external circuits, refer to a manufacturer's data book on the MC3418 chip."], "jumps": ["P13140", "P13050"]}, {"id": "P13120", "text": ["The other components and IC1 chip connections are for the normal operation of the modulator for the frequencies that are used in this experiment."], "jumps": ["P13130", "P13050"]}, {"id": "P13110", "text": ["The modulator chip is set up to operate using analog inputs with +12 volts, or a HIGH on pin 15."], "jumps": ["P13120", "P13050"]}, {"id": "P13100", "text": ["Pin 8 is grounded since a single power source is used and pin 16 is connected to +12 volts."], "jumps": ["P13110", "P13050"]}, {"id": "P13090", "text": ["The output of the modulator is taken from pin 9 through an inverter, IC2a."], "jumps": ["P13100", "P13050"]}, {"id": "P13080", "text": ["The RC time constant of the integrator is produced by R11 and C4 connected between pins 6 and 7."], "jumps": ["P13090", "P13050"]}, {"id": "P13070", "text": ["The clock signal, or sample rate, is produced by IC2c and IC2b and applied to pin 14 of IC1."], "jumps": ["P13080", "P13050"]}, {"id": "P13060", "text": ["The output of the integrator, pin 7, is coupled to the comparator, pin 2, through R12."], "jumps": ["P13070", "P13050"]}, {"id": "P13050", "text": ["The analog input is applied to pin 1 of IC1, the modulator, through R1, level control, and C1, coupling capacitor.", "The transmitter circuit is contained on PC130-332 and consists of the components necessary to support the MC3418 CVSD modulator chip."], "jumps": ["P13060", "P13040", "P13050", "P13020"]}, {"id": "P13020", "text": ["In this experiment, you will observe the operation and measure signals in a typical DM transmitter circuit."], "jumps": ["P13040", "P1001"]}, {"id": "P2910", "text": ["This completes the experiment on DM RECEIVER CIRCUITS.", "This completes the experiment on DM RECEIVER CIRCUITS......"], "jumps": ["P2001", "P2580"]}, {"id": "P2580", "text": ["3.  Disconnect all test equipment.\n4.  Carefully remove experiment cards.                          \n5.  Return all equipment to the designated storage areas.", "3. Disconnect all test equipment. 4. Carefully remove experiment cards. 5. Return all equipment to the designated storage areas."], "jumps": ["P2910", "P2570"]}, {"id": "P2570", "text": ["2.  Set the Test Console Power to OFF.", "2. Set the Test Console Power to OFF.F...................."], "jumps": ["P2560"]}, {"id": "P2560", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": ["P2550"]}, {"id": "P2550", "text": ["The waveforms on TPs 2, 3, 4, and 5 (along with the input signal on TP1 and the output signal on TP6) will be important to remember when troubleshooting the circuit."], "jumps": ["P2560", "P2540"]}, {"id": "P2549", "text": ["Volt/Div = .1 Time/Div = .2mS Coupling = AC"], "jumps": []}, {"id": "P2548", "text": ["Volt/Div = .1 Time/Div = .2mS Coupling = AC"], "jumps": []}, {"id": "P2547", "text": ["Volt/Div = 5 Time/Div = - Coupling = DCC"], "jumps": []}, {"id": "P2546", "text": ["TP2 - Clock input to demodulator, 36 kHz, 10 Vpp Square wave.", "Volt/Div = 5 Time/Div = 5mS Coupling = DC", "MEASUREMENT SETUP - Measure following TPs on PC130-333."], "jumps": ["P", "Pd"]}, {"id": "P2540", "text": ["12.  Finally, measure the following TPs using CH1 of the                         oscilloscope.", "12. Finally, measure the following TPs using CH1 of the oscilloscope. odulator TP3 - Filter signal TP4 - RC time constant waveform TP5 - Filter signal"], "jumps": ["P2550", "P2530"]}, {"id": "P2530", "text": ["11.  Adjust R1 so that you have an output signal on CH2.", "11. Adjust R1 so that you have an output signal on CH2....", "9. Return the output frequency of the function generator to 1 kHz. 10. Vary PC130-333 R1. Notice that you either have an output signal or you don't. R1 changes the amplitude of the DM signal and amplitude levels are not used, only changes in amplitude."], "jumps": ["P2540", "P2520", "P2530", "P2510"]}, {"id": "P2510", "text": ["8.  Increase and decrease the frequency output of the function           generator. Notice that above 4 kHz, you do not have an output      signal on CH2.  Remember, the system is set up for voice                signals between 400 Hz and 4 kHz.", "8. Increase and decrease the frequency output of the function generator. Notice that above 4 kHz, you do not have an output signal on CH2. Remember, the system is set up for voice signals between 400 Hz and 4 kHz."], "jumps": ["P2520", "P2500"]}, {"id": "P2500", "text": ["The noise can be filtered but, also recall that DM systems are used mostly for voice communication and an exact reproduction of the input signal is not critical in the demodulator."], "jumps": ["P2510", "P2490"]}, {"id": "P2490", "text": ["Recalling that a constant analog input to a DM modulator produces a toggling output signal, the toggling DM signal when demodulated produces noise."], "jumps": ["P2500", "P2480"]}, {"id": "P2480", "text": ["During the peaks, the amplitude of the input signal to the modulator is not changing, a constant level."], "jumps": ["P2490", "P2470"]}, {"id": "P2470", "text": ["The demodulator circuit is operating correctly.  Notice the noise around the peaks of the demodulator output signal on CH2.", "The demodulator circuit is operating correctly. Notice the noise around the peaks of the demodulator output signal on CH2."], "jumps": ["P2480", "P2460"]}, {"id": "P2462", "text": ["The output of the demodulator should be a 1 kHz sine wave signal.  If not, check that the signal on PC130-333 TP2 is 36 kHz and that the output of the modulator, PC130-332, is correct.", "The output of the demodulator should be a 1 kHz sine wave signal. If not, check that the signal on PC130-333 TP2 is 36 kHz and that the output of the modulator, PC130-332, is correct...."], "jumps": []}, {"id": "P2461", "text": [], "jumps": []}, {"id": "P2460", "text": ["Is the signal on CH2 a 1 kHz sine wave signal (there may be noise)?"], "jumps": ["P2450"]}, {"id": "P2450", "text": ["7.  Compare the analog input signal of the modulator (CH1) to the      analog output signal of the demodulator (CH2).", "6.  Connect the CH2 probe to TP6 on PC130-333.  This is the               analog output of the demodulator.", "7. Compare the analog input signal of the modulator (CH1) to the analog output signal of the demodulator (CH2).", "6. Connect the CH2 probe to TP6 on PC130-333. This is the analog output of the demodulator."], "jumps": ["P2460", "P2440", "P2450", "P2430"]}, {"id": "P2430", "text": ["5.  Connect the CH1 probe to TP1 on PC130-332.  This is the               input information signal to the modulator.", "5. Connect the CH1 probe to TP1 on PC130-332. This is the input information signal to the modulator."], "jumps": ["P2440", "P2420"]}, {"id": "P2420", "text": ["4.  On the oscilloscope, set the controls as follows:", "3.  Using the oscilloscope, measure the signal on PC130-333 TP1      and adjust R1 for a 8 Vpp signal.  This adjusts the incoming           DM signal so that the demodulator is not overdriven.", "4. On the oscilloscope, set the controls as follows:......", "Volt/Div CH1 - 0.5 Volt/Div CH2 - 0.05 Time/Div - 0.1 ms Triggering - CH1, AC, + Display - Dualll - Duallll", "3. Using the oscilloscope, measure the signal on PC130-333 TP1 and adjust R1 for a 8 Vpp signal. This adjusts the incoming DM signal so that the demodulator is not overdriven."], "jumps": ["P2430", "P2410", "P2420", "P2400"]}, {"id": "P2400", "text": ["The DM signal on PC130-333 pin E indicates that the modulator circuit is operating correctly and the transmitted signal is        reaching the receiver.", "The DM signal on PC130-333 pin E indicates that the modulator circuit is operating correctly and the transmitted signal is reaching the receiver."], "jumps": ["P2410", "P2390"]}, {"id": "P2392", "text": ["Something in the modulator, PC130-332, is incorrect, you should be receiving a DM signal in PC130-333 pin E.  Check that the function generator is outputting a 1 kHz, 1 Vpp signal on PC130-332 TP1 and that the output of the clock for the modulator is 36 kHz at PC130-332 TP2.  As a last resort, check with your instructor.", "Something in the modulator, PC130-332, is incorrect, you should be receiving a DM signal in PC130-333 pin E. Check that the function generator is outputting a 1 kHz, 1 Vpp signal on PC130-332 TP1 and that the output of the clock for the modulator is 36 kHz at PC130-332 TP2. As a last resort, check with your instructor......................"], "jumps": []}, {"id": "P2391", "text": [], "jumps": []}, {"id": "P2390", "text": ["2.  Measure the signal on PC130-333 Pin E.  Is the input signal to        the demodulator circuit a DM signal?", "2. Measure the signal on PC130-333 Pin E. Is the input signal to the demodulator circuit a DM signal?"], "jumps": ["P2380"]}, {"id": "P2380", "text": ["1.  Ensure that the function generator is applying a 1 kHz, 1 Vpp        signal as measured on PC130-332 TP1.", "1. Ensure that the function generator is applying a 1 kHz, 1 Vpp signal as measured on PC130-332 TP1."], "jumps": ["P2390", "P2370"]}, {"id": "P2370", "text": ["The receiver is now aligned to the same sample rate as was used in the modulator.  The demodulator circuit will change the DM signal back to the analog signal that was input to the modulator. With the use of the oscilloscope, examine the signal.", "6.  Using a frequency counter if available (use an oscilloscope if        not), adjust R2 on PC130-333 for a 36 kHz 1 kHz signal as               measured on TP2.  Note that the Nida 440 function generator         has a built-in frequency counter.", "The receiver is now aligned to the same sample rate as was used in the modulator. The demodulator circuit will change the DM signal back to the analog signal that was input to the modulator. With the use of the oscilloscope, examine the signal.", "6. Using a frequency counter if available (use an oscilloscope if not), adjust R2 on PC130-333 for a 36 kHz 1 kHz signal as measured on TP2. Note that the Nida 440 function generator has a built-in frequency counter..."], "jumps": ["P2380", "P2360", "P2370", "P2350"]}, {"id": "P2350", "text": ["5.  Place PC2 and PC3 DC Power switches to ON.", "4.  On PC130-333, set R1 and R2 to mid position.", "5. Place PC2 and PC3 DC Power switches to ON. 130A - Set the PC1 DC Switch to ON....", "4. On PC130-333, set R1 and R2 to mid position............"], "jumps": ["P2340", "P2350", "P2220"]}, {"id": "P2220", "text": ["3.  Set the Positive Supply Control to 12. The Voltmeter on the            130A should indicate 12 Volts.", "3. Set the Positive Supply Control to 12. The Voltmeter on the 130A should indicate 12 Volts."], "jumps": ["P2210"]}, {"id": "P2210", "text": ["2.  Place PC130-332 into the test console PC2 position.", "2. Place PC130-332 into the test console PC2 position. C switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2200"]}, {"id": "P2200", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2190"]}, {"id": "P2190", "text": ["Let's start the experiment.", "Let's start the experiment. The DM Transmitter circuit cards must be aligned as per the DM Transmitter experiment before entering the DM Experiment. If you have not aligned these circuit cards or are unsure whether they are aligned return to the Lesson Menu, select DM Transmitter Operation and align the circuit cards.", "The DM Transmitter circuit cards must be aligned as per the DM Transmitter experiment before entering the DM Experiment. If you have not aligned these circuit cards or are unsure whether they are aligned return to the lesson menu, select DM Transmitter Operation and align the circuit cards...", "NOTEEEThe DM Transmitter circuit cards must be aligned as per the DM Transmitter experiment before entering the DM Experiment. If you have not aligned these circuit cards or are unsure whether they are aligned return to the lesson menu, select DM Transmitter Operation and align the circuit cards."], "jumps": ["P2200", "P2150"]}, {"id": "P2180", "text": ["Match up the other components on the card to the schematic."], "jumps": ["P2190", "P2150"]}, {"id": "P2170", "text": ["TP1 is the DM signal input test point and TP6 is the recovered analog information signal test point."], "jumps": ["P2180", "P2150"]}, {"id": "P2160", "text": ["R1 adjusts the input level and R2 sets the sample rate to match the modulator.", "Now, pick up the PC130-333 card and compare to the schematic."], "jumps": ["P2170", "P2150", "P2160", "P2050"]}, {"id": "P2140", "text": ["For a detailed analysis of the external circuits, refer to a manufacturer's data book on the MC3418 chip."], "jumps": ["P2150", "P2050"]}, {"id": "P2130", "text": ["Note that the external circuits are almost identical to the ones used in the modulator.  Of course, the frequencies used are the same so the external circuits are the same.", "Note that the external circuits are almost identical to the ones used in the modulator. Of course, the frequencies used are the same so the external circuits are the same."], "jumps": ["P2140", "P2050"]}, {"id": "P2120", "text": ["The other components and IC1 chip connections are for the normal operation of the demodulator for the frequencies that are used in this experiment."], "jumps": ["P2130", "P2050"]}, {"id": "P2110", "text": ["The demodulator chip is set up to operate using digital signals with a ground, or a LOW, on pin 15."], "jumps": ["P2120", "P2050"]}, {"id": "P2100", "text": ["Pin 8 is grounded since a single power source is used and\npin 16 is connected to +12 volts.", "Pin 8 is grounded since a single power source is used and pin 16 is connected to +12 volts."], "jumps": ["P2110", "P2050"]}, {"id": "P2090", "text": ["The clock frequency from IC2c and IC2b is applied to pin 14."], "jumps": ["P2100", "P2050"]}, {"id": "P2080", "text": ["The RC time constant of the integrator is produced by R7 and C4 connected between pins 6 and 7 and are the same values used in the modulator."], "jumps": ["P2090", "P2050"]}, {"id": "P2070", "text": ["The output of the integrator, recovered information signal, is taken from pin 7 through R5."], "jumps": ["P2080", "P2050"]}, {"id": "P2060", "text": ["Recall that the DM signal was inverted in the modulator so it has to be inverted again in the demodulator."], "jumps": ["P2070", "P2050"]}, {"id": "P2050", "text": ["The DM signal is applied to pin 13 of IC1, the demodulator, through R1, level control, and IC2a, an inverter.", "The receiver circuit is contained on PC130-333 and consists of the components necessary to support the MC3418 CVSD demodulator chip."], "jumps": ["P2060", "P2040", "P2050", "P2020"]}, {"id": "P2020", "text": ["In this experiment, you will observe the operation and measure signals in a typical DM receiver circuit."], "jumps": ["P2040", "P2001"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1910", "text": ["This completes the experiment on DM TRANSMITTER CIRCUITS.", "This completes the experiment on DM TRANSMITTER CIRCUITS..."], "jumps": ["P1001", "P1510"]}, {"id": "P1510", "text": ["3.  Disconnect all test equipment. \n4.  Carefully remove experiment cards.                           \n5.  Return all equipment to the designated storage areas.", "3. Disconnect all test equipment. 4. Carefully remove experiment cards. 5. Return all equipment to the designated storage areas."], "jumps": ["P1910", "P1500"]}, {"id": "P1500", "text": ["2.  Set the Test Console Power to OFF.", "2. Set the Test Console Power to OFF.F...................."], "jumps": ["P1490"]}, {"id": "P1490", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": ["P1480"]}, {"id": "P1480", "text": ["The waveforms on TPs 2, 3, 5 and 6 (along with the input signal on TP1 and the output signal on TP4) will be important to remember when troubleshooting the circuit."], "jumps": ["P1490", "P1470"]}, {"id": "P1479", "text": ["Volt/Div = .1 Time/Div = .2mS Coupling = AC"], "jumps": []}, {"id": "P1478", "text": ["TP5 - RC time constant waveform, Triangle.", "Volt/Div = .5 Time/Div = .2mS Coupling = AC"], "jumps": []}, {"id": "P1477", "text": ["Volt/Div = 1 Time/Div = - Coupling = DCC"], "jumps": []}, {"id": "P1476", "text": ["TP2 - Clock input to modulator. CLOCK, 36 kHz, 10 Vpp Squarewave.", "Volt/Div = 5 Time/Div = 5ms Coupling = DC", "MEASUREMENT SETUP - Measure the following TPs using CH1."], "jumps": ["P"]}, {"id": "P1470", "text": ["12.  Finally, measure the following TPs using CH1 of the                         oscilloscope.", "10.  Set R1 on PC130-332 back to mid position. \n11.  Ensure that the analog information input signal from the                 function generator is 1 kHz, 1 Vpp sine wave.", "12. Finally, measure the following TPs using CH1 of the oscilloscope. TP2 - clock input to modulator TP3 - Filter signal TP5 - RC time constant waveform TP6 - Filter signal", "10. Set R1 on PC130-332 back to mid position. 11. Ensure that the analog information input signal from the function generator is 1 kHz, 1 Vpp sine wave."], "jumps": ["P1480", "P1460", "P1470", "P1450"]}, {"id": "P1450", "text": ["You may not see much change.  However, if the signal input is too large, the demodulator circuit will be overdriven and produce distorted output signals.", "8.  Return the frequency output of the function generator to\n     1 kHz. \n9.  While observing the input and output signals of the                           modulator, vary R1 on PC130-332 to change the amplitude of         the analog information input signal.", "You may not see much change. However, if the signal input is too large, the demodulator circuit will be overdriven and produce distorted output signals.", "8. Return the frequency output of the function generator to 1 kHz. 9. While observing the input and output signals of the modulator, vary R1 on PC130-332 to change the amplitude of the analog information input signal."], "jumps": ["P1460", "P1440", "P1450", "P1430"]}, {"id": "P1430", "text": ["The card is set up and designed for frequencies between 400 Hz and 4 kHz.  Notice what happens to the modulated signal when the function generator exceeds these frequencies limits.", "The card is set up and designed for frequencies between 400 Hz and 4 kHz. Notice what happens to the modulated signal when the function generator exceeds these frequencies limits."], "jumps": ["P1440", "P1420"]}, {"id": "P1420", "text": ["7.  While observing the input and output signals of the                           modulator, vary the frequency of the function generator above      and below 1 kHz.", "7. While observing the input and output signals of the modulator, vary the frequency of the function generator above and below 1 kHz."], "jumps": ["P1430", "P1410"]}, {"id": "P1410", "text": ["6.  Return the output waveform of the function generator to a              sine wave.", "6. Return the output waveform of the function generator to a sine wave."], "jumps": ["P1420", "P1400"]}, {"id": "P1400", "text": ["The CVSD delta modulator circuit is operating correctly producing a HIGH or LOW output for amplitude changes in the analog input signal."], "jumps": ["P1410", "P1390"]}, {"id": "P1392", "text": ["You should see that when the analog input signal, CH1 is increasing, the DM output signal, CH2 is HIGH.  You may have trouble seeing this but, looking real close will confirm the operation of the circuit as you have learned.", "You should see that when the analog input signal, CH1 is increasing, the DM output signal, CH2 is HIGH. You may have trouble seeing this but, looking real close will confirm the operation of the circuit as you have learned......"], "jumps": []}, {"id": "P1391", "text": [], "jumps": []}, {"id": "P1390", "text": ["Looking closely at the CH1 and CH2 traces, what level is the DM output signal when the analog input signal is increasing?"], "jumps": ["P1380"]}, {"id": "P1380", "text": ["5.  Change the output waveform of the function generator to                triangle.  You should be able to see the HIGH and LOW levels         (CH2) match up to the analog input signal (CH1) a little better.", "5. Change the output waveform of the function generator to triangle. You should be able to see the HIGH and LOW levels (CH2) match up to the analog input signal (CH1) a little better."], "jumps": ["P1390", "P1370"]}, {"id": "P1370", "text": ["Notice that CH2 will not sync. Remember, a sync pulse is not used in delta modulation.  However, you can get a general idea of the levels that are being generated from the collection of the HIGH and LOW scrolling signal.", "Notice that CH2 will not sync. Remember, a sync pulse is not used in delta modulation. However, you can get a general idea of the levels that are being generated from the collection of the HIGH and LOW scrolling signal."], "jumps": ["P1380", "P1360"]}, {"id": "P1360", "text": ["4.  Compare the analog input signal seen on CH1 to the digital            output signal seen on CH2.", "3.  Connect the CH2 probe to PC130-332 TP4.  This is the digital         DM signal output of the modulator.", "2.  Connect the CH1 probe to PC130-332 TP1.  This is the analog        information input signal.", "4. Compare the analog input signal seen on CH1 to the digital output signal seen on CH2.", "3. Connect the CH2 probe to PC130-332 TP4. This is the digital DM signal output of the modulator.", let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
