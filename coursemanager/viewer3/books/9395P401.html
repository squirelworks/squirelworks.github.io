const book = {"title": "9395P401", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: THE NETWORKsdf sdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": ["# #\" #& \"\"# &\"###2' &2#&.22&# 25--283-.#285255232/238882-.-5:38832222882282-213:22::82-22225:8-33-22282232.22258558.5822385:235:222283538::2585582::2:", "&&#&# #/2.#.& -8 \"#.-&23..22'/.#212&-2258\"588:52", "### ## /# #/&# \" \"/##\"#/&//..#/..&/28.&...&824/&.88-8588..2222858852.28:582228588358282228258.888:825:583.8828::8228828588828583:35558.555.85::88::85588:88:5555::38::85:::5:5:52::85::88::", ":85:855::83:5:5.5:55:855:52.5:5283822242348522...252...2..82/.4..22//2./..##/.8.#&./#&/..##// ##\",##/## #. / /& # ## ## ## ## ## \" #/# ## /# ## #.\" ./ #//###,//.&/#.\"#/.##/./#&/2.&/.../&//....//&2222.2/252.&28.8522582.824828828::255:::5:", "/,,,,,,,,,,,,,/, ,, ,,,,,,6, ,,,6,,, ,,,,,//6//6,,,,/6/,,,/,4/,,/6/4494,,494/6846446/4884664;44;889448489888<8648<<8;44;88988<88948;98<44<;:<44<<8;44<48<<8;48<48<88;48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["1. Evolution of the Networkr objective 1 line item 2 here. item 2 here.e.e.", "2. Network Configurationster objective 1 line item 2 here. item 2 here.e.e.", "w Explain how the network evolved. w Recognize the difference between LAN, MAN, WAN, and Internet.", "w Identify a Client/Server network. w Identify a Peer-to-Peer network. w Identify common network topologies. w Understand user accounts and access rights."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["Today it is impractical to think of a computer that is not connected to a network. A home PC with internet access is part of a network. Networking is all about communications and the sharing of resources.", "While the Internet is one large network spanning the globe, the network covered here will be an office, building or campus (group of buildings).king is all about communications and the sharing of resources."], "jumps": ["P410", "P300", "P420", "P400"]}, {"id": "P420", "text": ["Network engineering, maintenance, and operation are professional fields in the telecommunications and computer industries. ve used these buzz words before without actually knowing the true meaning or context..."], "jumps": ["P400", "P422"]}, {"id": "P422", "text": ["As the industries have merged, networking knowledge and experience has become part of the baseline occupational skill set."], "jumps": ["P424", "P400"]}, {"id": "P424", "text": ["You need to have networking knowledge to be a software engineer or a microwave technician..."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["In this lesson, you will be presented with the basics of networking and acquire some of the industry \"buzz words\". You may have used these buzz words before without actually knowing the true meaning or context..."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["The lesson also covers the common network configurations that you may have at home, school, or work."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["Let's begin the lesson on THE NETWORK.E..................................."], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Communications networks have been in existence as long as the telegraph. dio technology added a new dimension, called wireless, to the network."], "jumps": ["P1022", "P1001"]}, {"id": "P1022", "text": ["Radio technology added a new dimension, called wireless, to the network...Radio technology added a new dimension, called wireless, to the network.", "\"Tele\" means distance, and the greater the distance, the more room there is for network participants (called nodes). Telephone is the ideal example of a communications network. Eventually data communications entered the picture..."], "jumps": ["P1030", "P1020", "P1040"]}, {"id": "P1040", "text": ["The original mainframe computers, like the IBM 360 developed in 1964, had user terminals connected to it so that a number of programmers could access the computer from convenient locations in the building..."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["The \"360\" designation implied \"full circle\" computing; business, scientific, etc. 360 also implied a full circle of access, main frame as the hub, wires as the spokes, and terminals as the wheel."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["What was the first communications network?................."], "jumps": ["P1040"]}, {"id": "P1061", "text": [], "jumps": []}, {"id": "P1062", "text": ["Radio added the wireless dimension to communications networks.", "Telephone is the most recognizable network, but not the first."], "jumps": []}, {"id": "P1070", "text": ["As the need to access the main frame increased, more terminals were needed. Remote Job Entry (RJE) devices and software were soon developed to allow clusters of terminals to be interconnected...", "With the advent of the personal computer, the terminals were no longer \"dumb\", computing power and memory storage could be shared. Mass memory units, printers, scanners, and other peripheral devices could be connected...."], "jumps": ["P1080", "P1060", "P1090", "P1070"]}, {"id": "P1090", "text": ["A method of controlling data transfers was also needed. During the 1970s, a concept called Ethernet was born. The term Ethernet was developed from luminiferous ether, a substance believed to exist in space that was responsible for the transport of electromagnetic energy in a vacuum..."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["In 1994, there were 50 million Ethernet connected computers. Today, there are over 200 million. Ethernet has become the most popular LAN standard, in part because it was the first, and it was less complex than competing systems..."], "jumps": ["P1120", "P1080"]}, {"id": "P1120", "text": ["Networks are classified mainly by size, topology and number of nodes. nodes. types of networks exist today, the Local Area network (LAN), Metropolitan Area Network (MAN), and the Wide Area Network (WAN)...", "Three types of networks exist today, the Local Area Network (LAN), Metropolitan Area Network (MAN), and the Wide Area Network (WAN). (LAN), Metropolitan Area Network (MAN), and the Wide Area Network (WAN)..."], "jumps": ["P1122", "P1080", "P1130"]}, {"id": "P1130", "text": ["What device was introduced to make the \"dumb\" terminal obsolete?"], "jumps": ["P1120"]}, {"id": "P1131", "text": ["Ethernet is a LAN standard that supports devices..........."], "jumps": []}, {"id": "P1133", "text": ["Remote Job Entry or RJE was used with \"dumb\" terminals only."], "jumps": []}, {"id": "P1140", "text": ["A LAN may be confined to a single building, or even a room within a building. A LAN campus is a network extending to a number of buildings, like a small town or industrial compound."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["LANs are local networks, but there may be hundreds of nodes in the LAN. LANs may be interconnected to form MANs.."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["MANs are generally established by interconnecting LANs with wire and/or wireless links. Telephone lines, cable, fiber optics, microwave radio, unidirectional radio, and satellite may be employed to connect the MAN...", "A WAN is obviously the largest and most diverse network. WANs cross international boundaries and cross the oceans. The World Wide Web (www) is a WAN of incredible proportions."], "jumps": ["P1170", "P1150", "P1180", "P1160"]}, {"id": "P1180", "text": ["The Internet exists because of networks. When you access the internet with your personal computer, you become a node in the Internet network."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["The Internet is a vast array of different networks; all nodes are interconnected using hardware and software. Ethernet alone cannot meet all interface requirements. Internet and Ethernet are different entities, and the terms are not interchangeable..."], "jumps": ["P1210", "P1180"]}, {"id": "P1210", "text": ["The more nodes a network has, the more likely it is to have problems. Problems include slow data transfer rates, hardware failures, software troubles, and security violations. Networks require maintenance and management..."], "jumps": ["P1220", "P1190"]}, {"id": "P1220", "text": ["The World Wide Web may be compared to what type of network?"], "jumps": ["P1210"]}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1222", "text": ["Local area networks are generally not considered world wide."], "jumps": []}, {"id": "P1223", "text": ["Metropolitan area networks are usually considered to be restricted to the confines of a city, hence the title metropolitan."], "jumps": []}, {"id": "P1230", "text": ["In order to communicate through a network, a node computer must have physical interface with the network. The most common method is to have a dedicated network communication circuit that has an interface jack and required electronic circuits..."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["The interface circuit is usually mounted on a removable circuit card called a Network Interface Card (NIC). The type of card depends on the LAN specifications. 10/100 Base-T Fast Ethernet is a very popular specification..."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["A Fast Ethernet NIC typically has an 8-pin jack and a link indicator light. When the light is illuminated, the NIC is physically connected to an Ethernet plug.", "Network interface is also possible with Token Ring, various modems (modulator/demodulators), fiber optics, and other interface standards. For the purposes of training, the Ethernet NIC will provide the connection between the computer and the LAN cable..."], "jumps": ["P1260", "P1240", "P1910", "P1250"]}, {"id": "P1910", "text": ["This completes the information on EVOLUTION OF THE NETWORK.", "1. Networking is the process of communicating and sharing resources. Computer network knowledge and skill are essential for people in the telecommunications and computer industries.."], "jumps": ["P1001", "P1260", "P1930"]}, {"id": "P1930", "text": ["2. The telegraph is acknowledged as the first communications network and the IBM 360 terminal cluster is acknowledged as the first data communications.", "3. Computer networks are categorized mainly by size: * LAN - Local Area Network * MAN - Metropolitan Area Network * WAN - Wide Area Networkkk"], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. Ethernet is the most popular network connection standard. Network Interface Cards (NICs) provide the interface between the computer and the LAN connection."], "jumps": ["P1999", "P1940"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1950"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["Network computers are configured with the software and hardware necessary to perform assigned tasks. Your home computer probably has an Internet browser, Network configuration utilities, and modem software. These are typical software packages based on average customer requirements. requirements....", "Hardware- wise, the average home computer has a modem for dial-up Internet connections, and may have an Ethernet NIC. If it has one, the NIC may provide the Internet connection, as well as connection to the household LAN."], "jumps": ["P2030", "P2001", "P2040", "P2020"]}, {"id": "P2040", "text": ["In the work or home business environment, the computer is referred to as a \"workstation\". A workstation usually has specialized software designed or procured to meet business plan objectives. Computer graphics, programmable logic, engineering applications, and inventory control data bases, to name a few....", "The workstation is a \"client\" of the network when connected to the network. The network has peripheral devices that support the workstation. Data storage, printer services, electronic mail, and Internet access are examples of network provided services..."], "jumps": ["P2050", "P2030", "P2060", "P2040"]}, {"id": "P2060", "text": ["The network is controlled by a \"server\". The server is a special type of computer which has a special processor, large memory, high data storage capability, and sophisticated interface subsystem...", "The \"client/server\" relationship involves resource sharing and data flow control. The server is like a traffic cop and a librarian combined."], "jumps": ["P2070", "P2050", "P2080", "P2060"]}, {"id": "P2080", "text": ["Electronic mail, voice mail, fax, intranet (internal Internet), multi-media, teleconferencing, software applications, and other services may also be provided by the server. The client taps into the wealth of server capabilities, and may share some of its own resources as well.", "A client workstation may be connected to a dedicated color printer, for example. Other network workstations can access the color printer via the server."], "jumps": ["P2090", "P2070", "P2110", "P2080"]}, {"id": "P2110", "text": ["The Client/Server configuration is a common LAN layout. But sometimes a simpler configuration is used to meet the communications and service requirements of the network. rsonal computers may be configured to operate as a network without a dedicated server..."], "jumps": ["P2120", "P2090"]}, {"id": "P2120", "text": ["ith two or more nodes with or without peripheral devices. A good example would be a household.", "Personal computers may be configured to operate as a network without a dedicated server. This is called a Peer-to-Peer LAN. In this configuration, a LAN is formed with two or more nodes with or without peripheral devices. A good example would be a household.would be a household.", "A home has the following network nodes: (2) Personal Computers, (1) Printer, and (1) scanner. Both computers have Internet access with modems using a common phone line. One computer has the printer connected and the other has the scanner connected..."], "jumps": ["P2130", "P2110", "P2140", "P2120"]}, {"id": "P2140", "text": ["To make a peer-to-peer network in this example, all that is needed is the software, network interface cards, a hub, and cabling. Now the computers can share peripheral devices.", "The minimum peer-to-peer network has two nodes, although there may be more. A computer outfit with printer, scanner, digital camera, and external disk drive is just a computer with a selection of peripheral devices until it is connected to another..."], "jumps": ["P2150", "P2130", "P2160", "P2140"]}, {"id": "P2160", "text": ["Networks are designed based on virtual and physical requirements. The virtual requirements are satisfied by software. The physical requirements are met with wires, connectors, hubs, routers, switches, and bridges...."], "jumps": ["P2170", "P2150", "Physical"]}, {"id": "P2170", "text": ["Before physical components are procured, the topology must be determined. \"Topology\" refers to the \"shape\" of the network, and includes which components are present and how they are connected."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["Which of the following devices is required to form a peer-to-peer network?????"], "jumps": ["P2170"]}, {"id": "P2181", "text": [], "jumps": []}, {"id": "P2182", "text": ["The Mainframe computer did not use the LAN layout..........", "The server is required by all networks.orks.---............"], "jumps": []}, {"id": "P2190", "text": ["Point-to-Point topology is the simplest and most practical topology. Node A is connected to Node B by a transmission line. This transmission line could be any signal conductor; wire, microwave, fiber optic, laser, to name the predominant types...."], "jumps": ["P2210", "P2180"]}, {"id": "P2210", "text": ["Point-to-point is a classic peer-to-peer topology for obvious reasons. The example of the home network used point-to-point topology."], "jumps": ["P2220", "P2190"]}, {"id": "P2220", "text": ["Point-to-Multipoint or Star Topology has one node connected to several nodes on independent transmission lines. Star topology is the basis of a satellite network. The \"C\" node is the satellite and the other nodes are earth based..."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["Star topology is also fundamental in cellular telephone networks and microwave distribution systems. The main thing to remember about the star topology is that nodes D, E, F, and G must communicate through node C..."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["Terrestrial (earth based) Star topology is the architecture of Ethernet. In fact, Ethernet was developed to support star topology. Star topology is often supported by additional hardware devices, like multiport hubs. Node C could be a four-port hub..."], "jumps": ["P2250", "P2220"]}, {"id": "P2250", "text": ["Multidrop or Multipoint topology is similar to star topology except a single line is shared by the nodes. The primary node controls line utilization through a process called \"Polling\". The secondary nodes may be located far apart geographically."], "jumps": ["P2260", "P2220"]}, {"id": "P2260", "text": ["Polling is an abbreviated form of data communications. A poll is a control message that is sent to see \"if anybody's home\". This is much more effective than sending a complete message, then waiting for a response..."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["Multidrop topology is used by telephone networks. The controlling node would be a Local Exchange Carrier (LEC). The LEC might even share the line with other LECs, depending on the business agreement..."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["What topology is regularly associated with Ethernet?......."], "jumps": ["P2270"]}, {"id": "P2281", "text": [], "jumps": []}, {"id": "P2282", "text": ["Point-to-point is so basic that just about any LAN standard can meet the requirements..."], "jumps": []}, {"id": "P2283", "text": ["Multidrop is more of a telephone type network.............."], "jumps": []}, {"id": "P2290", "text": ["Bus topology is a peer-to-peer system. The computer uses this type of connection internally to transmit and receive data from the various cards. The bus is terminated on both ends and each node is connected to the bus using a bus coupler..."], "jumps": ["P2310", "P2280"]}, {"id": "P2310", "text": ["The greatest advantage to the bus topology is the ease of troubleshooting and repair. Nodes can be quickly physically isolated and terminators can be installed to bypass bad nodes. New nodes may be added with minimal wiring manipulation..."], "jumps": ["P2320", "P2290"]}, {"id": "P2320", "text": ["Ring Topology or Token Ring is one of the earliest topologies in networking. Not only is the topology shaped like a ring, but a virtual token had to be obtained by a node computer to enable communications..."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["Ring topology nodes were directly connected together in series and no terminators or couplers were required. Token Ring networks are for the most part obsolete."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["Tree topology is a hierarchical architecture with the head end shown at the top of the hierarchy and far end shown at the bottom. Hierarchical refers to status; king and subjects, server and users, primary and secondary, etc.."], "jumps": ["P2350", "P2320"]}, {"id": "P2350", "text": ["Tree topology is supported by cabling trunks. A trunk is a common set of switched lines. The trunks are unique to each hub. Data at the head end must be addressed to a trunk line before it can reach a destination node..."], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["Tree topology is best represented in a telephone network. The phone number is 555-3456; head end (exchange) 555, trunk 34, node 56 or some combination."], "jumps": ["P2370", "P2350"]}, {"id": "P2370", "text": ["Mesh topology is the most advanced topology, primarily because it is principally virtual. Generally speaking, the mesh topology is made up of virtual switches and links, and each node is connected to another with a dedicated line..."], "jumps": ["P2380", "P2350"]}, {"id": "P2380", "text": ["Usually illustrated as a cloud, the network itself is a changing virtual mesh that exists in the software of the nodes and/or switching devices. Frame Relay and Asynchronous Transfer Mode (ATM) networks are two of the more popular technologies..."], "jumps": ["P2390", "P2370"]}, {"id": "P2390", "text": ["The resources available to network nodes are variable, depending on the most basic principle of information security: AUTHORIZATION. Data capacity is another significant factor.", "If all users had maximum network utilization capacity, the network might not be able to fulfill minimum requirements. For example, if all users were using the same print simultaneously, the print jobs would get done, but it would take a long time..."], "jumps": ["P2410", "P2380", "P2420", "P2390"]}, {"id": "P2420", "text": ["Users are given network accounts. Like a bank account, access is controlled by a Personal Identification Number (PIN) or account number. The account is usually displayed as a map or chart of symbols. Each symbol represents a capability. Back: P241000"], "jumps": ["P2430", "PIN"]}, {"id": "P2430", "text": ["For example, a user with full rights and permissions may be able to see the entire LAN on the screen, including other users and peripheral devices. A lower level user may only see his or her own workstation..."], "jumps": ["P2440", "P2410"]}, {"id": "P2440", "text": ["Access to software may be controlled by separate login and passwords. The server may even contain downloadable software."], "jumps": ["P2450", "P2430"]}, {"id": "P2450", "text": ["What is the basic principle of network access control?....."], "jumps": ["P2440"]}, {"id": "P2451", "text": [], "jumps": []}, {"id": "P2452", "text": ["Node hierarchy may be a consideration, but not the basic principle..."], "jumps": []}, {"id": "P2453", "text": ["Client/Server relationship relates to network requirements other than access control.", "Access rights and user accounts are controlled by the network administrator. User accounts are usually monitored to ensure adequate security and availability of data......y of data."], "jumps": ["P2910", "P2450"]}, {"id": "P2910", "text": ["This completes the information on NETWORK CONFIGURATIONS...", "1. Client/Server and Peer-to-Peer are the predominant network configurations.", "From: Sally@office.com Subject: Hey there!! Data: Fri, 11 Oct 2000 05:11:01 Hey John, this is just a test! -Sally , Sally"], "jumps": ["P2001", "P2460", "P2930"]}, {"id": "P2930", "text": ["2. Topology described the architecture of the network's physical layout."], "jumps": []}, {"id": "P2940", "text": let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
