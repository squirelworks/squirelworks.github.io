"In this circuit, the voltage drops are Er1 = 60 V and Ec1 = 80 V.", "E ER1 = It x R1 It = = 2 Amps Zt EC1 = It x Xc1", "Er1 = 2A x 30 W = 60 V Ec1 = 2A x 40 W = 80 V"], "jumps": ["P1540", "P1470"]}, {"id": "P1520", "text": ["Once total current is determined, voltage drops are calculated.", "E ER1 = It x R1 It = = 2 Amps Zt EC1 = It x Xc1", "100 V It = 50 W = 2 Amps"], "jumps": ["P1530", "P1470"]}, {"id": "P1510", "text": ["In this circuit, total current equals 2 Amps.", "100 V It = 50 W = 2 Amps"], "jumps": ["P1520", "P1470"]}, {"id": "P1500", "text": ["Total impedance (Zt) replaces R in the Ohm's Law formula in an RC circuit.", "Zt = 302 + 402 = 900 + 1600 = 2500 = 50 W"], "jumps": ["P1510", "P1470"]}, {"id": "P1490", "text": ["In this circuit Zt equals 50 ohms.", "Zt = 302 + 402 = 900 + 1600 = 2500 = 50 W"], "jumps": ["P1500", "P1470"]}, {"id": "P1480", "text": ["The formula for total impedance (Zt) is:"], "jumps": ["P1490", "P1470"]}, {"id": "P1470", "text": ["The combined opposition to current flow from the resistor and capacitor is called impedance (Z). The unit of measure is ohms."], "jumps": ["P1480", "P1430"]}, {"id": "P1440", "text": ["The capacitor and resistor act like two people pushing on an object at right angles. The total force is not the sum of the individual forces."], "jumps": ["P1470", "P1430"]}, {"id": "P1435", "text": ["If the resistor and capacitor opposed current in the same direction, they could be added, but they do not."], "jumps": ["P1440", "P1430"]}, {"id": "P1430", "text": ["For example, if two people push on an object in the same direction (in phase), the total force equals the sum of the two forces."], "jumps": ["P1435", "P1420"]}, {"id": "P1420", "text": ["Comparing the resistance and capacitance graphs illustrate why R and Xc cannot be added directly. They oppose current flow at right angles (90 degrees).", "Comparing the resistance and capacitance graphs illustrate why R and Xc cannot be added directly. They oppose current flow at right angles (90 degrees).."], "jumps": ["P1430", "P1390"]}, {"id": "P1410", "text": ["To help remember this relationship, remember the word ICE.  Current (I) in a capacitive circuit (C) is before voltage (E).  Current leads voltage.", "To help remember this relationship, remember the word ICE. Current (I) in a capacitive circuit (C) is before voltage (E). Current leads voltage."], "jumps": ["P1420", "P1390"]}, {"id": "P1390", "text": ["Voltage and current are not in phase. Combining the graphs shows current leading voltage by 90 degrees in a capacitive circuit."], "jumps": ["P1410", "P1360"]}, {"id": "P1380", "text": ["As voltage decreases, the capacitor discharges and current flow increases in the opposite direction."], "jumps": ["P1390", "P1360"]}, {"id": "P1370", "text": ["As voltage increases, current decreases."], "jumps": ["P1380", "P1360"]}, {"id": "P1360", "text": ["In a pure AC capacitive circuit, current is maximum when the voltage across the capacitor is minimum."], "jumps": ["P1370", "P1350"]}, {"id": "P1350", "text": ["Combining the graphs shows the phase relationship of current and voltage in an AC series resistive circuit."], "jumps": ["P1360", "P1320"]}, {"id": "P1340", "text": ["Voltage and current are in phase."], "jumps": ["P1350", "P1320"]}, {"id": "P1330", "text": ["As current increases, a voltage drop is developed across the resistor."], "jumps": ["P1340", "P1320"]}, {"id": "P1320", "text": ["In a pure AC resistive circuit, when current is zero, no voltage drop develops across the resistor."], "jumps": ["P1330", "P1300"]}, {"id": "P1310", "text": ["R and Xc are not exactly the same quantity. R and Xc oppose current flow differently.", "R and Xc are not exactly the same quantity. R and Xc oppose current differently.", "R and Xc are not exactly the same quantity. R and Xc oppose current flow differently. $Back:P1300"], "jumps": ["P1320"]}, {"id": "P1300", "text": ["In an RC series circuit, Xc and R cannot be directly added even though both valu let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
