browser will be asking the server for the default page on that web site, usually that is an \"index.html\"..."], "jumps": ["P1210", "P1140"]}, {"id": "P1450", "text": ["Web site tools generally look up information. The most popular are the web page search engines. However, some of these engines can search more than just web pages. Electronic companies may have a utility where you can search through the parts they carry..."], "jumps": ["P1460", "P1410"]}, {"id": "P1950", "text": ["4. Many sites on the Internet contain search engines to find web pages with your interests."], "jumps": ["P1999", "P1920"]}, {"id": "P1090", "text": ["When selecting an on-line service, it is important to discuss which browsers you can use. Some services do not use all of the different types of browsers that are available.", "When you subscribe to an on-line service, they usually provide a web browser, or instruct you on where to get one."], "jumps": ["P1100", "P1070"]}, {"id": "P1070", "text": ["Before you can begin web surfing, a term used to describe the use of the World Wide Web, you need a web browser and a connection to the Internet."], "jumps": ["P1080", "P1060"]}, {"id": "P1270", "text": ["Once a valid URL has been entered, the web browser will contact the machine containing the web page. After contact has been established, the web page and all associated images will be transferred to your machine..."], "jumps": ["P1280", "P1240"]}, {"id": "P1300", "text": ["Most pages containing items other than text and graphics, like Java applets, will have instructions on how to use them."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["Links are normally underlined or in differently colored text that will send you to a different web page. The Back and Next buttons will allow you to navigate through the pages that you have already viewed..."], "jumps": ["P1320", "P1290"]}, {"id": "P1470", "text": ["Searching for web pages is probably the most common web tool used. There are many different search engines like America OnLine's Webcrawler, Excite, Lycos, Yahoo, Google, and AltaVista just to name a few with many more being added every day.very day.y..."], "jumps": ["P1480", "P1450"]}, {"id": "P2183", "text": ["DOC files were discussed earlier in this lesson. They don't actually have to be Microsoft Word files, however, they are not a basic data type understood by web browsers. The World Wide Web uses HTML and certain types of graphic files."], "jumps": []}, {"id": "P1040", "text": ["The most important tool for using the World Wide Web is a web browser. Each type has its own features to make it useful."], "jumps": ["P1050", "P1001"]}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P460", "text": ["Let's begin the lesson on THE WORLD WIDE WEB.............................."], "jumps": ["P430"]}, {"id": "P1120", "text": ["When a commercial advertises an Internet address on the television, like http://Business.com/Business.html, this is what you would enter into the URL field of the web browser.", "In this lesson we will look at how to use the World Wide Web, what kinds of tools are at your disposal, and an explanation of their terminology."], "jumps": ["P1130", "P1100", "P450", "P430"]}, {"id": "P430", "text": ["The World Wide Web is accessed daily by millions of people to get information and ideas on just about anything you can imagine."], "jumps": ["P440", "P420"]}, {"id": "P1150", "text": ["Some web browsers will work like a graphical FTP connection. FTP will be covered in a later lesson.", "Have you ever noticed a television commercial display an Internet address for a popular product? If you look, you will see more of them.", "\"Excellence in Computer Based Training.\""], "jumps": ["P1160", "P1140"]}, {"id": "P1410", "text": ["Also, they allow you to create bookmarks of your favorite web pages. These bookmarks can be selected anytime to go back to those sites if their URLs have been saved."], "jumps": ["P1420", "P1390"]}, {"id": "P1430", "text": ["Most browsers come with documentation that will describe the features they offer and how the features are used. Web browser developers are in continuous competition , and features change constantly."], "jumps": ["P1440", "P1410"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P2182", "text": ["VRML data is not a web browser specific data type. This is a plug-in application data type developed much later than HTML pages. The World Wide Web uses HTML and certain types of graphic files."], "jumps": []}, {"id": "PINFO", "text": ["12-08-00 Coverted from SAM to toolbook. frieda 12-08-00 Text and Branching. frieda 12-12-00 Graphics by Richard S. 12-19-00 Review - lisa 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay", "12-08-00 Coverted from SAM to toolbook. frieda 12-08-00 Text and Branching. frieda 12-12-00 Graphics by Richard S. 12-19-00 Review - lisa 07-19-01 Converted to ToolBook 8.1 format. jay"], "jumps": []}, {"id": "P450", "text": ["When you are finished, you will have the knowledge to use the World Wide Web effectively."], "jumps": ["P460", "P430"]}, {"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P1130", "text": ["After you have entered this, the web browser will send out messages on the Internet to find Business.com."], "jumps": ["P1140", "P1120"]}, {"id": "P440", "text": ["In this lesson we will look at how to use the World Wide Web, what kinds of tools are at your disposal, and an explanation 200", "P1140"]}, {"id": "P1210", "text": ["Finally, you can specify an actual page to go to on the web. These are all basic uses of the URL. Advanced features will not be covered in this lesson. They are not needed for general World Wide Web use.."], "jumps": ["P1220", "P1140"]}, {"id": "P410", "text": ["With home pages, graphics, information and multimedia, the World Wide Web contains an immense amount of data."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Have you ever noticed a television commercial display an Internet address for a popular product? If you look, you will see more of them.", "\"Excellence in Computer Based Training.\""], "jumps": ["P430", "P400"]}, {"id": "P1110", "text": ["URL stands for Uniform Resource Locator. Every site on the World Wide Web has a URL that is unique to any other site."], "jumps": ["P1120", "P1100"]}, {"id": "P1060", "text": ["Web browsers do all the work for you, just tell them where to go. Once they know an address, they grab all the text and multimedia that Internet site has to offer."], "jumps": ["P1070", "P1040"]}, {"id": "P1100", "text": ["The basic web browser contains a URL text field, a window and a variety of buttons."], "jumps": ["P1110", "P1070"]}, {"id": "P1140", "text": ["Let's examine what a URL contains. The first item is the protocol, HTTP. HTTP stands for HyperText Transfer Protocol. Another protocol that can be specified in some web browsers is FTP, File Transfer Protocol..."], "jumps": ["P1150", "P1100"]}, {"id": "P1230", "text": ["HTML is the hypertext markup language used on the Internet for making pages. HTML pages will be covered in a later lesson that will actually describe how to make them.", "<html> <head> <title> Nida </title> </head> <img stc = \"nida.gif\"> <p> Welcome! </p> </body>"], "jumps": ["P1240", "P1220", "P"]}, {"id": "P1080", "text": ["When you subscribe to an on-line service, they usually provide a web browser, or instruct you on where to get one.", "\"You have successfully passed the assessment"], "jumps": ["P1090", "P1070"]}, {"id": "P2280", "text": ["Examples would be questionnaires or search engines. Both use CGI scripts to take your input and to get the information you need."], "jumps": ["P2290", "P2260"]}, {"id": "P2340", "text": ["In this lesson you have been introduced to the World Wide Web; its functions, and some of the tools used to control it."], "jumps": ["P2350", "P2330"]}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P1330", "text": ["This example shows how to select the link to the next web page or go back to the previous page."], "jumps": ["P1340", "P1290"]}, {"id": "P1340", "text": ["Links can also instruct your web browser to bring up an internal mail tool that will allow you to send e-mail to someone from the web page."], "jumps": ["P1350", "P1330"]}, {"id": "P1460", "text": ["A CD-ROM company may allow you to search through the descriptions of hundreds of titles. The possibilities are endless."], "jumps": ["P1470", "P1450"]}, {"id": "P400", "text": ["The most powerful and popular feature of the Internet is the World Wide Web or WWW."], "jumps": ["P410", "P300"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P2181", "text": [], "jumps": []}, {"id": "P1050", "text": ["Two popular web browsers are Netscape Navigator and Microsoft Internet Explorer.and Spry Mosaic.", "# #\" #& \"\"# &\"###2' &2#&.22&# 25--283-.#285255232/238882-.-5:38832222882282-213:22::82-22225:8-33-22282232.22258558.5822385:235:222283538::2585582::2:", "&&#&# #/2.#.& -8 \"#.-&23..22'/.#212&-2258\"588:52", "### ## /# #/&# \" \"/##\"#/&//..#/..&/28.&...&824/&.88-8588..2222858852.28:582228588358282228258.888:825:583.8828::8228828588828583:35558.555.85::88::85588:88:5555::38::85:::5:5:52::85::88::", ":85:855::83:5:5.5:55:855:52.5:5283822242348522...252...2..82/.4..22//2./..##/.8.# let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
