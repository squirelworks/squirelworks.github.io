const book = {"title": "93953607", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: SCHMITT TRIGGER OPERATIONsd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe the purpose of a Schmitt Trigger. w Identify and describe Schmitt Trigger circuits.", "w Measure the input and output waveforms of a Schmitt Trigger. w Recognize normal operation of a Schmitt Trigger with various inputs.."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson you will learn about the Schmitt Trigger."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["A Schmitt Trigger converts an input waveform of any shape and amplitude into square wave pulses of constant amplitude."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Because of this function, Schmitt triggers are often called Squaring Amplifiers or Level Detectors."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["The \"clean\" output can be used as the input to other circuits that would not have accepted the irregular input."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on SCHMITT TRIGGER OPERATION......................."], "jumps": ["P400"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P13160", "text": ["4.  Increase the amplitude of the function generator to 20 Vpp.            Did the output pulses become longer or shorter?", "4. Increase the amplitude of the function generator to 20 Vpp. Did the output pulses become longer or shorter?????"], "jumps": ["P13140"]}, {"id": "P1030", "text": ["Each pulse is of the same duration (5 time intervals). At T1, the input is zero and the output is zero. This is the static condition of the circuit."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["At T2, the input begins to increase in amplitude. However, the output remains at zero."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["At T3, the input reaches the upper threshold level of the Schmitt trigger and the output immediately goes high."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["For this particular Schmitt trigger, the upper threshold level is 2.5 volts."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["As long as the input remains above 2.5 V, the output will continue to be high."], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["At T4, the input drops below the upper threshold level. This causes the output to immediately drop to zero."], "jumps": ["P1090", "P1020"]}, {"id": "P1090", "text": ["If the input signal remains below 2.5 V the output continues to be zero."], "jumps": ["P1100", "P1020"]}, {"id": "P1100", "text": ["No matter what the shape of the input signal, the output is high anytime the input exceeds the threshold."], "jumps": ["P1110", "P1020"]}, {"id": "P1110", "text": ["The output is low anytime the input signal is below the threshold."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["This simple block diagram illustrates the operation of a Schmitt trigger."], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["The voltage divider determines the upper threshold level of the circuit."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["Once the threshold is reached, Q1 starts to become saturated (zero output). This begins to place Q2 in cutoff (high output)."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["As Q2 begins to reach cutoff, feedback from Q2 drives Q1 deeper into saturation which places Q2 further towards cutoff."], "jumps": ["P1160", "P1120"]}, {"id": "P1160", "text": ["This process happens incredibly fast. As a result, the output of Q2 goes high immediately when the upper threshold level is reached."], "jumps": ["P1170", "P1120"]}, {"id": "P1170", "text": ["This is an actual Schmitt Trigger circuit. Notice the voltage divider at the input.", "This is an actual Schmitt Trigger circuit. Notice the voltage divider at the input.."], "jumps": ["P1175", "P1120"]}, {"id": "P1175", "text": ["In the static condition (no input), Q1 is OFF. This allows Vcc to forward bias Q2."], "jumps": ["P1180", "P1170"]}, {"id": "P1180", "text": ["When Q2 is forward biased, a voltage divider is formed by R6 and R8. About .26 volts is dropped across R6. This produces a low output from the circuit."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["The .26 volts (a small positive bias) is present on the emitter of Q1."], "jumps": ["P1195", "P1170"]}, {"id": "P1195", "text": ["When the input exceeds the threshold, Q1 begins to conduct. The voltage on the collector decreases to a level insufficient to forward bias Q2."], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["Since Q2 is at cutoff, the output is Vcc."], "jumps": ["P1205", "P1170"]}, {"id": "P1205", "text": ["With Q2 OFF, the voltage divider of (R6 and R8) for all practical purposes, no longer exists. The voltage that was present across R6, when Q2 was ON, has been substantially reduced."], "jumps": ["P1207", "P1170"]}, {"id": "P1207", "text": ["Without the small positive bias contributed by R6 to the emitter of Q1, Q1 conducts harder."], "jumps": ["P1209", "P1170"]}, {"id": "P1209", "text": ["The harder Q1 conducts, the more Q2 is driven to cutoff. The more Q2 is driven to cutoff, the harder Q1 conducts."], "jumps": ["P1210", "P1170"]}, {"id": "P1210", "text": ["Feedback is the key to Schmitt Trigger operation. It assures very short rise and fall times of the output.", "Feedback is the key to Schmitt Trigger operation. It assures very short rise and fall times of the output.."], "jumps": ["P1220", "P1170"]}, {"id": "P1215", "text": ["RISE AND FALL TIMES - Rise and fall time is the time interval between the 10% point and the 90% point on the edge of a pulse."], "jumps": []}, {"id": "P1212", "text": ["Feedback is the key to Schmitt Trigger operation. It assures very short rise and fall times of the output.", "Feedback is the key to Schmitt Trigger operation. It assures very short rise and fall times of the output.."], "jumps": ["P1220", "P1170"]}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1910", "text": ["This completes the information on SCHMITT TRIGGER.", "This completes the information on SCHMITT TRIGGER.E........"], "jumps": ["P1001", "P1220"]}, {"id": "P1220", "text": ["Which output is correct for the input to this Schmitt trigger?"], "jumps": ["P1212"]}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1222", "text": ["Your answer shows the output high at T2. Notice the input is not above the threshold at T2."], "jumps": []}, {"id": "P1223", "text": ["Your answer shows the output high only at T4. Notice the input is above the threshold at T3 also."], "jumps": []}, {"id": "P13050", "text": ["Compare the components on PC130-47N to the schematic shown."], "jumps": ["P13060", "P13040"]}, {"id": "P1920", "text": ["1.  Schmitt Triggers change input signals of any shape amplitude       into square wave pulses of constant amplitude.", "1. Schmitt Triggers change input signals of any shape amplitude into square wave pulses of constant amplitude.."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  The input must reach an upper threshold level for the output          to go high.", "2. The input must reach an upper threshold level for the output to go high."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Any time the input is below the threshold, the output is low.", "3. Any time the input is below the threshold, the output is low."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  Schmitt Triggers use feedback to ensure short rise and fall              times of the output signal.", "4. Schmitt Triggers use feedback to ensure short rise and fall times of the output signal."], "jumps": ["P1999", "P1930"]}, {"id": "P1999", "text": ["You have completed the Summary.  You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1950"]}, {"id": "P10213", "text": ["A Schmitt trigger produces a low output when _______og chased him over the fence? X XXXX", "the input is above the threshold level.oint arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "the input changes from a high to low condition.al. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "the input is below the threshold level.oint arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor.", "Page id 879 of Book \"C:\\Dev2000\\Lessons\\93953607.tbk\""], "jumps": []}, {"id": "P2020", "text": ["In this experiment, you will apply different shaped input waves to a  Schmitt trigger. The output will be observed for different input  amplitudes and the upper threshold varied.", "In this experiment, you will apply different shaped input waves to a Schmitt trigger. The output will be observed for different input amplitudes and the upper threshold varied."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["Pick up the PC130-47N card. The purpose of this card is to demonstrate the operation of a Schmitt trigger."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["Compare the components on PC130-47N to the schematic shown."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["R3 effectively adjusts the upper threshold level by adjusting the base bias for Q2 just as R1 and R10 determine Q1's base bias."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["1. Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........."], "jumps": ["P2040"]}, {"id": "P2080", "text": ["2.  Carefully plug PC130-47N into the Test Console PC2 position.  3.  Rotate PC130-47N R3 to the mid position (arrow pointing up).", "2. Carefully plug PC130-47N into the Test Console PC2 position. 3. Rotate PC130-47N R3 to the mid position (arrow pointing up).."], "jumps": ["P2100", "P2070", "P2085"]}, {"id": "P2085", "text": ["MEASUREMENT SETUP - Carefully turn R3 to mid position (arrow up)."], "jumps": []}, {"id": "P2100", "text": ["4.  Set the Positive Supply Voltage to 12.\n5.  Turn PC2 DC Power switch to ON.", "4. Set the Positive Supply Voltage to 12. 5. Turn PC2 DC Power switch to ON.. ON...."], "jumps": ["P2080"]}, {"id": "P2110", "text": ["6.  Connect the Function Generator output to the PC1 BNC                  output Connector. \n7.  Set the Function Generator for a 2 kHz, 10 Vpp, triangle wave        output as measured at TP2 with your oscilloscope.", "6. Connect the Function Generator output to the PC1 BNC output Connector. 7. Set the Function Generator for a 2 kHz, 10 Vpp, triangle wave output as measured at TP2 with your oscilloscope...."], "jumps": ["P2120", "P2100", "P2115"]}, {"id": "P2115", "text": ["BNC CONNECTION - Connect the Function Generator's Main Output BNC to the Test Console's Output BNC."], "jumps": []}, {"id": "P2120", "text": ["The experiment is now setup. Let's check this Schmitt trigger for normal operation."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["1.  Ensure that the CH1 oscilloscope probe is on TP2.\n2.  Place the CH2 oscilloscope probe to the output (TP8) of the           Schmitt trigger.", "1. Ensure that the CH1 oscilloscope probe is on TP2. 2. Place the CH2 oscilloscope probe to the output (TP8) of the Schmitt trigger."], "jumps": ["P2140", "P2120", "P2135"]}, {"id": "P2135", "text": ["MEASUREMENT SETUP - Place CH1 probe on TP2. Place CH2 probe on TP8."], "jumps": []}, {"id": "P2140", "text": ["3.  Adjust the oscilloscope controls to obtain the display shown         below.", "3. Adjust the oscilloscope controls to obtain the display shown below...", "You may have to adjust R3 on PC130-47N slightly as component tolerances make each card slightly different.", "'}:5 t0H( 9E}A9As5/GA}A;aEAA}EAKE;AAaAE;A}AEAU;aA};aEAEA;EAAAEA;E;AaA", "EUaa 555G7EEEa::Ts1TA;;AA;EEA;AAa9:AAE;E;;;UaAA;AEEA;aA};AA9aAA}}};E;AA9E}9AA;}AAEaaA;AEAEaAAEEaAAA9EEAAA}EAE;aEEEAU;EE;Ea;}", "EK,,L17;UT9;EK;,=17=9EK;AaTs a7(aEAEas5:9<5", "mzF(tt-FsFF-cmzssttst|t--yTmVstys|tytts sm t syst", ";EaTTy55F }Aaas= yjm;AEEAA T_}zc(GGFGVVVccVcVVlllGLVs-FFccclFm--jz5(-VFzmmm(ctmmlmzzzFFFFFzmmmctmFmsmmtcVmt5mzzl-zFmmFmtz", "KT[Qa9mFKKaa 5TL:EAa95 |9/:}EAEAALA_l>lz(lllFmV-V/czzFzFz/cVmcc--F(GlzFVllWmzzm(mzm(FzmpcF(zmFlzFmmlz-llplcmV-z-mcjsFV`zltmlzFVz-tVczFFtcmVmzlFz(mmzFmzFzmFl/VtmtVFmzmVcmmsVc let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
