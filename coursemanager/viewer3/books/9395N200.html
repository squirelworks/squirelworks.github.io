here. item 2 here.e.e."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P310", "text": [], "jumps": []}, {"id": "P400", "text": ["The purpose of this lesson is to introduce you to the functions and operation of the Rockwell RSLogix 500 software."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["The RSLogix software is used to create, manage, and implement ladder logic program files for the SLC 500 PLC in the Nida PLC Trainer. After you have learned how to effectively use the RSLogix software, creating ladder logic programs will be fast and effective....."], "jumps": ["P400", "P420"]}, {"id": "P420", "text": ["After you have learned how to effectively use the RSLogix software, creating ladder logic programs will be fast and effective....."], "jumps": ["P400", "P430"]}, {"id": "P430", "text": ["In this lesson, you use interactive simulation of the RSLogix software..."], "jumps": ["P400", "P440"]}, {"id": "P440", "text": ["It is important to note that the basics of the RSLogix software are covered. For more advanced operation, please refer to the RSLogix software manual...."], "jumps": ["P400", "P450"]}, {"id": "P450", "text": ["Let's begin the lesson on RSLOGIX FAMILIARIZATION........................."], "jumps": ["P400"]}, {"id": "P900", "text": ["4. Transferring Files to and from the PLC", "2. Creating and Editing Ladder Program Files"], "jumps": ["P450"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The RSLogix Program is being simulated and only the function being discussed will be active. Follow the instructions carefully.."], "jumps": ["P1030"]}, {"id": "P1030", "text": ["The display shown below is the \"Main Window\" and will appear any time you enter the RSLogix program. Observe the listed information....."], "jumps": ["P1020", "P1040"]}, {"id": "P1040", "text": ["Three types of files that are discussed: processor, program, and data files."], "jumps": ["P1020", "P1050"]}, {"id": "P1050", "text": ["Processor files are files sent to the PLC via an RS-232 Serial Port. A processor file contains both program and data files.."], "jumps": ["P1020", "P1060"]}, {"id": "P1060", "text": ["Processor files contain user instructions, data, configurations, and can be transferred from a computer to a PLC or vice versa."], "jumps": ["P1020", "P1070"]}, {"id": "P1070", "text": ["Some PLC systems use modems to communicate with distant PLC's."], "jumps": ["P1020", "P1080"]}, {"id": "P1080", "text": ["Program files contain three program types: the system program, main ladder program, and the subroutine ladder program. These three programs are required for every processor file."], "jumps": ["P1020", "P1090"]}, {"id": "P1090", "text": ["You can have anywhere from 3 to 255 program files. File 0 is reserved for the system program; files 1 and 2 are for the main ladder program; and files 3 through 255 are for the subroutine programs.."], "jumps": ["P1080", "P1100"]}, {"id": "P1100", "text": ["The system program contains I/O configuration, the processor type and name, and other system oriented information."], "jumps": ["P1080", "P1110"]}, {"id": "P1110", "text": ["The main ladder program contains user program instructions that tell the processor how to operate."], "jumps": ["P1080", "P1120"]}, {"id": "P1120", "text": ["Subroutine ladder programs are short segments of program code that can be retrieved (called) from the parent program for the purpose of performing repetitive operations."], "jumps": ["P1080", "P1130"]}, {"id": "P1130", "text": ["Data files contain information used by the main and subroutine ladder programs. As with the program files, certain data files have pre-defined types."], "jumps": ["P1080", "P1140"]}, {"id": "P1140", "text": ["0 - output data 3 - bit data 6 - control data 1 - input data 4 - timer data 7 - integer data 2 - status data 5 - counter data 8 - system dataaaaaaaaaaaa", "The pre-defined types are the first 9 files: 0 - output data 3 - bit data 6 - control data 1 - input figuration box click on the \"X\" at the top right hand corner.f theeon box.."], "jumps": ["P1310"]}, {"id": "P1340", "text": ["To drop down the file menu, click file on the top task bar ."], "jumps": ["P1350"]}, {"id": "P1350", "text": ["Click Save to save the project.s djf;dfjdf"], "jumps": []}, {"id": "P1360", "text": ["The Save Program AS dialog box will appear. Check the filename (NIDA1) and click Save in the dialog box..."], "jumps": []}, {"id": "P1370", "text": ["A pop-up window will display, asking if you want to replace the existing file. To save the file click Yes."], "jumps": []}, {"id": "P1380", "text": ["No this one? replace the existing file DA1'.", "Yes this one? replace the existing file DA1'.", "Would you like to replace the existing file DA1'.", "with this one? replace the existing file DA1'.", "Confirm File Replace ntains a file named 'NIDA1'.", "This folder already contains a file named 'NIDA1'.", "After saving the I/O configuration, the project file is verified for compatibility between modules. The verify icon looks like a computer with a green check mark. It's located to the right of the white pull-down menu on the second task bar. Click on the verify icon..n..."], "jumps": ["P1910"]}, {"id": "P1910", "text": ["This completes the information on CREATING & CONFIGURING FILES."], "jumps": ["P1380", "P1001"]}, {"id": "P1920", "text": ["1. The PLC uses three different types of files: processor, program, and data. Processor files contain both program and data files."], "jumps": ["P1001", "P1930"]}, {"id": "P1930", "text": ["2. Program files consist of a system file, main ladder program, and many subroutine ladder programs."], "jumps": ["P1920", "P1940"]}, {"id": "P1940", "text": ["3. Data files consist of any of the 8 basic data file types: output data, input data, status data, bit data, timer data, counter data, control data, and integer data."], "jumps": ["P1920", "P1950"]}, {"id": "P1950", "text": ["4. The configuration of the PLC processor file is essential for proper operation of the RSLogix software."], "jumps": ["P1920", "P1999"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1950", "P1001"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["Once you have created a processor file, the next step is creating the program and data files as needed. e project window (left window) must be active to modify the project. Click on the project window title bar...."], "jumps": ["P2022"]}, {"id": "P2022", "text": ["The project window (left window) must be active to modify the project. Click on the project window title bar..."], "jumps": ["P2030"]}, {"id": "P2030", "text": ["Now that the project window is active, click File on the main window task bar to display the file menu..."], "jumps": ["P2040"]}, {"id": "P2040", "text": ["To modify the ladder programs, the select program files dialog box must be displayed. To display this dialog box, click on Program Files....."], "jumps": ["P2050"]}, {"id": "P2050", "text": ["In the Select Program File dialog box, notice that File 2 is a ladder file. This is the main ladder program. All additional ladder files will be a subroutine...."], "jumps": ["P2060"]}, {"id": "P2060", "text": ["Remember, a subroutine is a small section of program code that is called in various locations in the main ladder program. Let's change the name of our main ladder program....."], "jumps": ["P2070"]}, {"id": "P2070", "text": ["Select the main ladder program by clicking once over the file 2 line. Click on the file 2 line..."], "jumps": []}, {"id": "P2080", "text": ["To allow changes to the file name and description, the file properties are accessed. Click on the properties button....."], "jumps": ["P2082"]}, {"id": "P2082", "text": ["It is a good practice to use titles that are descriptive of the file's contents. File names are limited to a maximum of 10 charcters.......name is 10.........................ximum characters limit in a name is 10....", "A good file name for a process that controls a motor is MOTORCNTRL.TORCNTRL. for a process that controls a motor."], "jumps": ["P2090"]}, {"id": "P2090", "text": ["Your response must be exact. Be sure to use upper case letters.", "Let's name the LAD program file MOTORCNTRL. Type MOTORCNTRL in the name text box, press <ENTER>, then click the OK button.button.e descriptive of the file's contents. The maximum characters limit in a name is 10...."], "jumps": []}, {"id": "P2100", "text": ["The purpose of the file name chosen is to describe the ladder program about to be created. This ladder program waits for an input from a switch and, when received, begins evaluating a subroutine program....."], "jumps": ["P2110"]}, {"id": "P2110", "text": ["The subroutine causes a 5 second delay and then allows the PLC's motor to spin. Click on Create New to create the new ladder file...."], "jumps": ["P2120"]}, {"id": "P2120", "text": ["Your response must be exact. Be sure to use upper case letters.", "Your file name has changed. It should be MOTOR_OP.", "Just as with the main ladder program, we are going to change (add) the name of the file. Type the name MOTOR_OP press <ENTER > and click OK.OK.OK."], "jumps": []}, {"id": "P2130", "text": ["If you ever want to delete a file, select the file by clicking on the line of the file and click on the delete button. Remember, once a file is deleted, it is destroyed forever...."], "jumps": ["P2140"]}, {"id": "P2140", "text": ["We are now ready to edit the ladder program files, and need to view the contents of file 2 (MOTORCNTRL). This is done using the monitor function. Click on the file 2 line and then click on the monitor button......ton.nitor button."], "jumps": []}, {"id": "P2150", "text": ["In the right window you will see the end rung. At this time, no other rungs exist in the ladder program. The right window title bar displays the ladder number and program name..."], "jumps": ["P2160"]}, {"id": "P2160", "text": ["The rung number is highlighted on the left side of the rung..."], "jumps": ["P2170"]}, {"id": "P2170", "text": ["In our program, the two inputs on the 5050-1 card will latch and unlatch a bit in one of the data files. When this bit is NOT set, we must verify that the timer is reset and that the motor is not in operation."], "jumps": ["P2150", "P2180"]}, {"id": "P2180", "text": ["When the bit is set, a subroutine within the program initiates the timer and begins the motor running once the timer reaches a given preset value."], "jumps": ["P2170", "P2190"]}, {"id": "P2190", "text": ["Let's begin editing our main ladder program. Double click on the new rung icon above the USER tab."], "jumps": []}, {"id": "P2200", "text": ["Notice the new rung in our program. The small e's next to the rung number indicate that this rung is under edit and has not been verified or compiled....."], "jumps": ["P2210"]}, {"id": "P2210", "text": ["The next step is to insert an instruction into the highlighted rung, which is the rung we just added..."], "jumps": ["P2220"]}, {"id": "P2220", "text": ["Above the window, you can see the different types of instructions that can be inserted into this rung. Let's make this rung set the bit when the start button is pressed. Click on the bit tab to select the bit instrs...ons..."], "jumps": []}, {"id": "P2230", "text": ["Some programs include instruction icons in the user tab, while others do not. We will go between the user and bit tabs for a better understanding of all programs.ams....."], "jumps": ["P2240"]}, {"id": "P2240", "text": ["The XIC ladder logic command means examine if closed. When the switch is closed, the rest of this rung will be examined. Double-click on the XIC icon."], "jumps": []}, {"id": "P2241", "text": ["Double-click on the question mark and a text box should appear."], "jumps": []}, {"id": "P2250", "text": ["Your response must be exact. When entering letters be sure to use upper case.", "kmust be exact. When entering letters be sure", "Next you need to add the bit address of the input switch. The location you will enter is the start switch for the 5050-1 card. Type I:0/0 and press <ENTER>...ation is the start switch of the 5050-1 card....."], "jumps": []}, {"id": "P2260", "text": ["Now we need to add the instruction to latch the bit (set to high) if the start button is pressed. Remember, this bit is located in a data file and will be created automatically by the RSLogix program...."], "jumps": ["P2270"]}, {"id": "P2270", "text": ["The OTL instruction is known as the output latch instruction. Double-click on the OTL icon..."], "jumps": []}, {"id": "P2271", "text": ["Double-click on the question mark...output latch instruction. Click on the OTL icon.."], "jumps": []}, {"id": "P2280", "text": ["Your response must be exact. When entering letters be sure to use upper case.", "jmust be exact. When entering letters be sure", "Let's set the bit address. Type B3/0 and press <ENTER>. in the data files the bit file was File 3. We just used one of the bit locations from File 3...."], "jumps": []}, {"id": "P2290", "text": ["Recall, in the data files the bit file was File 3. We just used one of the bit locations from File 3."], "jumps": ["P2300"]}, {"id": "P2300", "text": ["Now that we have finished configuring this rung, we need to verify our rung and accept it into the ladder program. Click on the Verify File icon.....", "You could use this icon and verify the entire project.roject..NTRL.TORCNTRL. for a process that controls a motor."], "jumps": []}, {"id": "P2310", "text": ["Notice the edit \"e's\" on the rung are now gone. This means that the program has compiled the rung, no errors were found, and the rung is no longer in edit mode....."], "jumps": ["P2320"]}, {"id": "P2320", "text": ["Now we need to add the rest of the rungs for our ladder program. Click on the end rung number to select this rung....."], "jumps": []}, {"id": "P2330", "text": ["Click on the user tab and then double-click on the new rung icon."], "jumps": []}, {"id": "P2340", "text": ["Click on the bit tab and then double-click on the XIC icon..."], "jumps": ["P2341"]}, {"id": "P2341", "text": ["Double-click on the question mark and a text field will appear.r."], "jumps": []}, {"id": "P2350", "text": ["Your response must be exact. When entering letters be sure to use upper case.", "Let's select an input to monitor. Type I:0/1 and press <ENTER>.ER>.............................."], "jumps": []}, {"id": "P2360", "text": ["Now we need to add the instruction to unlatch the bit (set to low) if the stop button is pressed. The instruction used is known as the output unlatch, OTU. Double-click on the output unlatch icon.............con."], "jumps": []}, {"id": "P2361", "text": ["Double-click on the question mark.and a text field should appear."], "jumps": []}, {"id": "P2370", "text": ["Your response must be exact. When entering letters be sure to use upper case.", "jmust be exact. When entering letters be sure", "B3/0 is the bit that we are using in our ladder program. It is located in data File 3, as indicated in the bit description. Type B3/0 and press <ENTER>."], "jumps": []}, {"id": "P2380", "text": ["The rung we just created monitors the stop button on the 5050-1 card and unlatches the bit (set to zero) if the button is pressed. Click on the Verify File icon.pile the rung we just createdNow that we have finished configuring this rung, we need to verify our rung and accept it into the ladder program. Click on the Verify file icon.."], "jumps": []}, {"id": "P2390", "text": ["The next rung checks the status of the bit and evaluates the subroutine if latched. Click on the end rung number to select the end rung...."], "jumps": []}, {"id": "P2400", "text": ["Click on the user tab. Add a new rung. Click on the new rung icon.to .rung.."], "jumps": []}, {"id": "P2402", "text": ["Add a new rung. Double-click on the new rung icon..e new rung icon.to .rung.."], "jumps": []}, {"id": "P2410 he bit is latched..."], "jumps": ["P2550"]}, {"id": "P2550", "text": ["The last rung of the program sets the timer to zero when the stop button is pressed. The RES (reset) instruction is used to reset the timer to zero in the pre-defined data file, File 4....."], "jumps": ["P2560"]}, {"id": "P2560", "text": ["Select the end rung.by clicking on the end rung number..."], "jumps": []}, {"id": "P2570", "text": ["Click on the left-arrow next to the instruction bar to until the user tab is displayed then click the user tab. . on the [ ] icon to insert a new rung...."], "jumps": []}, {"id": "P2571", "text": ["Double-click on the new rung icon..nsert a new rung............a new rung. user tab. Click on the user tab and click on the [ ] icon to insert a new rung...."], "jumps": ["P2580"]}, {"id": "P2580", "text": ["Click on the bit tab. Click on the XIC icon to add an examine-if-closed instruction..tion.on.ion.."], "jumps": []}, {"id": "P2581", "text": ["To add an examine-if-closed instruction double-click on the XIC icon.if-closed instruction.on.ion.."], "jumps": []}, {"id": "P2582", "text": ["Double click on the ?.C icon to add an examine-if-closed instruction..f-closed instruction.on.ion.."], "jumps": []}, {"id": "P2590", "text": ["Your response must be exact. When entering letters be sure to use upper case.", "must be exact. When entering letters be sure", "Type \"I:0/1\" and press <ENTER>...s djf;dfjdf"], "jumps": []}, {"id": "P2600", "text": ["Now we need to add a reset (RES) instruction. Click on the Timer/Counter tab. nd then click on RES.."], "jumps": []}, {"id": "P2601", "text": ["Double-click on the RES icon... and then click on RES. the Timer/Counter tab. and then click on RES..", "TON TOF RTO CTU CTD RES HSC"], "jumps": []}, {"id": "P2602", "text": ["Double-click on the ?..S icon now.d then click on RES. the Timer/Counter tab. and then click on RES.."], "jumps": []}, {"id": "P2610", "text": ["Your response must be exact. When entering letters be sure to use upper case.", "must be exact. When entering letters be sure", "Type \"T4:0\" and press <ENTER>...ds djf;dfjdf", "TON TOF RTO CTU CTD RES HSC"], "jumps": []}, {"id": "P2620", "text": ["Click on the verify file icon to process the changes to the program ladder. This checks for syntax and logical errors that normally occur.... occur."], "jumps": []}, {"id": "P2625", "text": ["Syntax - refers to special rules that govern the structure of a programming language. Each programming language only allows a specified format for characters, words, graphics, etc. to be used."], "jumps": []}, {"id": "P2630", "text": ["We have finished creating the main ladder program. It is important to note that the ladder can be modified at any time.....", "TON TOF RTO CTU CTD RES HSC"], "jumps": ["P2640"]}, {"id": "P2640", "text": ["The next step is to create the subroutine ladder program for the processor file..."], "jumps": ["P2650"]}, {"id": "P2650", "text": ["Click on the project title bar to select the project. Remember, this title bar is left of the ladder window title bar....."], "jumps": []}, {"id": "P2660", "text": ["Select the ladder 3 instructions by double-clicking on the line containing the ladder 3 name. Double-click on LAD 3-MOTOR_OP....."], "jumps": []}, {"id": "P2670", "text": ["Creating rung instructions for subroutines is the same as for the main ladder program..."], "jumps": ["P2680"]}, {"id": "P2680", "text": ["Create a new rung by clicking on the user tab and then double-clicking on the new rung icon.."], "jumps": []}, {"id": "P2690", "text": ["A time-on instruction is used on this rung. Click on the Timer/Counter tab and then double-click on the TON (time-on) icon."], "jumps": []}, {"id": "P2700", "text": ["Your response must be exact. When entering letters be sure to use upper case.", "must be exact. When entering letters be sure", "Certain values are required for the timer. Timer ON is being used in data File 4. To enter this information, Double-click on ? and then type \"T4:0\" and press <ENTER>.."], "jumps": []}, {"id": "P2710", "text": ["You have not selected 0.01 from the list.", "We will set the timer to count in increments of 0.01 seconds. Select 0.01 from the drop-down menu and press <ENTER>...."], "jumps": []}, {"id": "P2720", "text": ["For 5 seconds at a time base of 0.01 seconds, we need the preset value set to 500. Type \"500\" and press <ENTER>....."], "jumps": []}, {"id": "P2730", "text": ["The starting value should be zero and put in the accumulator. Type \"0\" and press <ENTER>.."], "jumps": []}, {"id": "P2740", "text": ["\"Accum\" stands for the accumulator. This is where the timer counting occurs. If we had stored a value of 100 in the accumulator rather than zero, it would only count for 4 seconds..."], "jumps": ["P2750"]}, {"id": "P2750", "text": ["Create a new rung by clicking on the user tab and then double-clicking on the new rung icon."], "jumps": []}, {"id": "P2760", "text": ["Add an examine-if-closed instruction to the new rung. Click on the bit tab and double-click on the XIC icon."], "jumps": ["P2770"]}, {"id": "P2770", "text": ["Your response must be exact. When entering letters be sure to use upper case.", "must be exact. When entering letters be sure", "To tell the XIC instruction that the timer has finished counting, a done-bit is added. Type \"T4:0/DN\" and press <ENTER>....."], "jumps": []}, {"id": "P2780", "text": ["Click the right-arrow next to the instruction bar until the Move/Logical tab is displayed then click the Move/Logical tab. b. ab. insert a move instruction....."], "jumps": []}, {"id": "P2781", "text": ["Insert a move instruction. To do this double-click on the Move icon. n. on. . Click on the Move/Logical tab and insert a move instruction.....", "MOV MVM AND OR XOR NOT CLR"], "jumps": []}, {"id": "P2790", "text": ["Your response must be exact. Be sure your answer is all digits.", "Click on the typing area for Move Source. Type \"10000\" and press <ENTER>.hen type O:2.0 and press <ENTER>. r after the timer has finished counting....."], "jumps": []}, {"id": "P2791", "text": ["Your response must be exact. Be sure to use upper case letters.", "he Destination area. Type O:2.0 and press <ENTER>. I", "Now enter the instruction that sends the voltage to the motor after the timer has finished counting. Click on the Destination area. Type O:2.0 and press <ENTER>."], "jumps": []}, {"id": "P2800", "text": ["This is the last rung of the subroutine. The purpose of this rung is to start the motor after the timer has finished counting. The T4:0/DN is the DN (done) bit of the timer....."], "jumps": ["P2810"]}, {"id": "P2810", "text": ["The done-bit is set after the timer has finished counting to the preset value. The move instruction is going to send 10 volts to the motor (dest. O:2.0). The 10000 is 10000 x .0001 V (1mV) which equals 10V..........."], "jumps": ["P2820"]}, {"id": "P2820", "text": ["Now that our subroutine program is complete, we need to verify and save it. Click on the verify program icon. Click File on the top task bar to drop down the file menu, then click Save to store the project."], "jumps": []}, {"id": "P2830", "text": ["If a revision note window is displayed, click on OK..."], "jumps": []}, {"id": "P2840", "text": ["The ladder logic programs are complete. The steps we followed should always be used in creating ladder logic programs. Additional commands are available, but will not be discussed....."], "jumps": ["P2850"]}, {"id": "P2850", "text": ["The last items we need to examine are the data files. Data files contain information that ladder program files use to perform actions. To access the data files, click on the project window title bar. Back: P28400000"], "jumps": ["P2860"]}, {"id": "P2860", "text": ["We are going to look at the timer data in File 4, or \"T4\". Scroll down the project window list until you reach T4-TIMER in the data files folder. Double-click on the page icon just to the left of the text \"T4-TIMER\"....."], "jumps": []}, {"id": "P2870", "text": ["This is the data that we set in the subroutine ladder program file. Remember, the first 9 files have pre-defined data types. Click on the Data File close icon (X in the upper right hand corner) to close the box....."], "jumps": []}, {"id": "P2880", "text": ["While not active in this simulation, the other data files in the current processor file are viewed by clicking on another icon in the data files folder....."], "jumps": ["P2890"]}, {"id": "P2890", "text": ["There are many steps involved in creating the ladder program files. The best way to create good ladder logic programs is to make them on paper first, and then put them into the RSLogix software.SLogix software....."], "jumps": ["P2910"]}, {"id": "P2910", "text": ["This completes the information on CREATING & EDITING LADDER PROGRAM FILES."], "jumps": ["P2001"]}, {"id": "P2920", "text": ["1. It is good programming practice to use file names representing the process they will be performing. r example MOTORCNTRL for a process that controls a motor.", "A good file name for a process that controls a motor is MOTORCNTRL.TORCNTRL. for a process that controls a motor."], "jumps": ["P2930"]}, {"id": "P2930", "text": ["2. For ease of programming a ladder file, start at the top rung and work toward the end rung, one rung at a time. This method is used to help ensure a rung is not left out of the ladder program file."], "jumps": ["P2940"]}, {"id": "P2940", "text": ["3. In most cases, data files are created automatically when referenced by a program file. For example, the instruction OTL B3/0 (output latch) creates data in the third file and latch the zero bit..."], "jumps": ["P2999", "P2930"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2940", "P2001"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3020", "text": ["Before you learn how to transfer programs to the PLC, it is important to understand the communications link and the PLC's modes of operation. The PLC must be linked to the computer and in the proper mode for proper operation."], "jumps": ["P3030", "P3001"]}, {"id": "P3030", "text": ["The communications link must be established prior to monitoring or transferring data between the computer and the SLC-500 PLC."], "jumps": ["P3020"]}, {"id": "P3040", "text": ["There are several processor modes for the SLC-500 PLC. We will discuss two of these modes: off-line and remote run."], "jumps": ["P3020"]}, {"id": "P3050", "text": ["In the program mode, processor files can be transferred to/from the PLC from the computer. In this mode, no program execution is performed."], "jumps": ["P3040"]}, {"id": "P3060", "text": ["In run mode, ladder programs are executed and their output can be monitored. It is important to note that ladder program files cannot be modified while in run mode."], "jumps": ["P3040"]}, {"id": "P3070", "text": ["In run mode, however, you can modify the processor data files, which is very helpful when fine-tuning a ladder program. You can also transfer a processor file from the PLC to the computer."], "jumps": ["P3040"]}, {"id": "P3080", "text": ["Let's see how to change the processor's mode. First we will establish a communications link between the computer and the PLC."], "jumps": ["P3040"]}, {"id": "P3090", "text": ["If the processor isn't connected properly and the communications link program is not running, the RSLogix software will not be able to communicate with the PLC."], "jumps": ["P3080"]}, {"id": "P3100", "text": ["Communication is necessary to transfer information to and from the PLC processor. We will simulate the communication."], "jumps": ["P3080"]}, {"id": "P3110", "text": ["When communicating between the computer and the PLC, power must be applied to the PLC. For purposes of our simulation, we will stipulate that power has been applied to the PLC.."], "jumps": ["P3080"]}, {"id": "P3120", "text": ["First, we need to start the RSLinx communication software to allow us to communicate between the computer and the PLC. Double-click on the RSLinx icon...."], "jumps": []}, {"id": "P3130", "text": ["The RSLinx program window is displayed. In the right window, an icon labeled AB_PIC-1 DH-485 should be displayed. Double-click on this icon...."], "jumps": []}, {"id": "P3140", "text": ["Two icons will be displayed in the right window. One icon (looks like a computer) is labeled 00 RSI-PIC and the other (looks like an SLC-500) is labeled 01 PLC001....."], "jumps": []}, {"id": "P3150", "text": ["The 01 PLC001 label represents the name of the program in the processor. If another program were loaded in the PLC processor, its name would be displayed....."], "jumps": []}, {"id": "P3160", "text": ["If the SLC-500 (01 PLC001) icon has a red \"X\" over it, then the communications program was unable to find it. When this occurs, the main cause is power not applied to the PLC...."], "jumps": []}, {"id": "P3170", "text": ["When both the computer and SLC-500 icons are communicating properly (without a red \"X\" on the SLC-500), then click on the upper \"_\" mark at the top right hand corner to minimize....."], "jumps": []}, {"id": "P3175", "text": ["Minimizing a program reduces the window to a button on the task bar and allows the program to continue running while the user is working on another program or task."], "jumps": []}, {"id": "P3180", "text": ["Now that you have communication between your PLC and the computer, start the RSLogix software by double-clicking on the RSLogix icon found on the computer desktop.."], "jumps": []}, {"id": "P3190", "text": ["Now that we have established communications between the computer and the SLC-500, let's see how to change the processor's mode....."], "jumps": ["P3200"]}, {"id": "P3200", "text": ["First, we will change the processor's mode to program. The PLC must be attached to your computer while you are performing this operation....."], "jumps": ["P3210"]}, {"id": "P3210", "text": ["The RSLogix window is displayed. Now let's go on-line to the program mode. Click on the down-arrow to the right of the text OFF-LINE."], "jumps": []}, {"id": "P3220", "text": ["A drop-down box is displayed. Click on Go On-line to go to the program mode.."], "jumps": []}, {"id": "P3230", "text": ["At this time, the RSLogix software will read the contents of the PLC memory. If the current processor file contained within the PLC is contained on the computer, it will be made the active processor file...."], "jumps": ["P3240"]}, {"id": "P3240", "text": ["If the file does not exist on your computer, you will be prompted with an option to create a new file on the computer from the PLC information. It is not necessary to save the current processor file to the computer...."], "jumps": ["P3250"]}, {"id": "P3250", "text": ["The processor status box tells you the current mode of the PLC processor. In our case, the current mode is REMOTE PROG mode. Highlighted by the cyan box. ed box."], "jumps": ["P3260"]}, {"id": "P3260", "text": ["Remember, in this mode we can transfer processor data files to and from the PLC..."], "jumps": ["P3270"]}, {"id": "P3270", "text": ["Now, let's change to the run mode. Click on the down-arrow next to the processor status box again.."], "jumps": []}, {"id": "P3280", "text": ["A drop-down box is displayed. Click on Run to go to the run mode..."], "jumps": []}, {"id": "P3290", "text": ["A processor change mode confirmation box appears. Click on Yes..."], "jumps": []}, {"id": "P3300", "text": ["The mode has now been changed to the RUN mode. Highlighted by the green box."], "jumps": ["P3310"]}, {"id": "P3310", "text": ["In run mode, the processor status box indicates \"REMOTE RUN\" for run mode. Run mode will begin immediate evaluation of the ladder program files in the PLC memory...."], "jumps": ["P3320"]}, {"id": "P3320", "text": ["Now, let's change back to the program mode. Click on the down-arrow again.."], "jumps": []}, {"id": "P3330", "text": ["Click on Program in the drop-down box...dfjdf"], "jumps": ["PB"]}, {"id": "P3340", "text": ["A processor change-mode confirmation box appears. Click on Yes..."], "jumps": []}, {"id": "P3350", "text": ["The mode has now been changed back to the PROG (program) mode..."], "jumps": ["P3360"]}, {"id": "P3360", "text": ["As you can see, the PLC's mode of operation is important depending on the function you want to perform. Without being in the correct mode, certain operations cannot be performed."], "jumps": ["P3370", "P3320"]}, {"id": "P3370", "text": ["In the next objective, you will see how to transfer a file to the PLC."], "jumps": ["P3910", "P3360"]}, {"id": "P3910", "text": ["This completes the information on CHANGING THE PLC PROCESSOR MODE."], "jumps": ["P3001", "P3370"]}, {"id": "P3920", "text": ["1. The two important modes of operation are: program mode and run mode."], "jumps": ["P3001", "P3930"]}, {"id": "P3930", "text": ["2. In the program mode, files can be transferred to and from the PLC, and both data and program files can be modified."], "jumps": ["P3940", "P3920"]}, {"id": "P3940", "text": ["3. In run mode, evaluation of the processor file in the PLC memory begins immediately. Data files can be modified in this mode, but not program files."], "jumps": ["P3999", "P3930"]}, {"id": "P3999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P3001", "P3940"]}, {"id": "P4001", "text": [], "jumps": []}, {"id": "P4020", "text": ["Prior to transferring files, the communications channel using the RSLinx program must be functioning."], "jumps": ["P4001"]}, {"id": "P4030", "text": ["To transfer the project files to/from the PLC, the download or upload modes are used."], "jumps": ["P4020"]}, {"id": "P4040", "text": ["In download mode, processor files are transferred to the PLC from the computer. In this mode, no program execution is being performed."], "jumps": ["P4030"]}, {"id": "P4050", "text": ["In upload mode, proce as restoring the program....."], "jumps": []}, {"id": "P4150", "text": ["Let's open the project file we created. Click on the open folder icon..."], "jumps": []}, {"id": "P4155", "text": ["The open folder icon allows the user to easily open existing project files. Start second line here."], "jumps": []}, {"id": "P4160", "text": ["The Open/Import window will display a listing of the RSLogix projects. Remember, the NIDA1 project contains the processor files that we created. Click on the NIDA1.rss icon...."], "jumps": []}, {"id": "P4170", "text": ["Click on Open to access the NIDA project...df"], "jumps": []}, {"id": "P4180", "text": ["Both windows are updated with the NIDA1 project information. To download the program files to the PLC, click on the down-arrow next to the box labeled OFF-LINE...."], "jumps": []}, {"id": "P4190", "text": ["In the drop-down list, click on Download...df"], "jumps": []}, {"id": "P4200", "text": ["A revision note window will display. Click on OK..."], "jumps": []}, {"id": "P4210", "text": ["A download confirmation box asking if you want to proceed with the download will display. Click on Yes..."], "jumps": []}, {"id": "P4220", "text": ["A remote run confirmation box opens, asking if you want to switch to remote program mode. Click on Yes..."], "jumps": []}, {"id": "P4230", "text": ["The downloading processor image box displays showing that the program is being transferred to the PLC. A confirmation box then appears to change back to run mode. Click on Yes...."], "jumps": []}, {"id": "P4240", "text": ["Notice that the processor status box shows OFF-LINE. Let's go on-line and to the remote run mode. Click Yes on the on-line confirmation box.."], "jumps": []}, {"id": "P4250", "text": ["The program file has been successfully transferred to the PLC. The windows are displaying the new contents of the PLC memory with the information from the NIDA1 project files....."], "jumps": ["P4260"]}, {"id": "P4260", "text": ["At this time you can begin running the ladder logic program..."], "jumps": ["P4270"]}, {"id": "P4270", "text": ["Let's transfer a copy of the program in the processor to the computer using the upload mode..."], "jumps": ["P4280"]}, {"id": "P4280", "text": ["Remember, the RSLinx communication program and the RSLogix program must be running prior to transferring files from the PLC to the computer....."], "jumps": ["P4330"]}, {"id": "P4290", "text": ["To upload a copy of the PLC program to the computer, click on the down-arrow next to the box labeled OFF-LINE.N.."], "jumps": []}, {"id": "P4300", "text": ["In the drop-down list, click on Upload...fjdf"], "jumps": []}, {"id": "P4310", "text": ["The Uploading Processor Image box displays showing that the program is being transferred from the PLC to the computer. A confirmation box then appears asking if you want to go on-line. Click on Yes...."], "jumps": []}, {"id": "P4320", "text": ["The mode reverts back to run mode as shown by the processor status box containing REMOTE RUN..."], "jumps": ["P4330"]}, {"id": "P4330", "text": ["The program file has been successfully transferred from the PLC to the computer. The windows should display the contents of the PLC memory....."], "jumps": ["P4340"]}, {"id": "P4340", "text": ["We have covered only the essentials of the RSLogix software. For more information regarding the operation and commands of the RSLogix and RSLinx software, click Help on the top task bar."], "jumps": ["P4910", "P4270"]}, {"id": "P4910", "text": ["This completes the information on TRANSFERRING FILES TO AND FROM THE PLC."], "jumps": ["P4001", "P4340"]}, {"id": "P4920", "text": ["1. The communications channel and the RSLinx program must be functioning prior to transferring files."], "jumps": ["P4930", "P4001"]}, {"id": "P4930", "text": ["es to and from the PLC, no program execution can be performed.", "2. While transferring files to and from the PLC, no program execution can be performed."], "jumps": ["P4940", "P4920"]}, {"id": "P4940", "text": ["3. Use the download mode to transfer processor files to the PLC from the computer."], "jumps": ["P4950", "P4930"]}, {"id": "P4950", "text": ["4. Use the upload mode to transfer processor files from the PLC to the computer."], "jumps": ["P4960", "P4930"]}, {"id": "P4960", "text": ["5. For more information about the operation and commands of the RSLogix and RSLinx software, click Help on the top task bar."], "jumps": ["P4999", "P4930"]}, {"id": "P4999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P4960"]}, {"id": "PINFO", "text": ["02-28-02 Converted from sty to tbk. frieda 04-26-02 Graphics a", "02-28-02 Converted from sty to tbk. frieda 04-26-02 Graphics added- Obj. 1 Alexis, Obj. 2 James, Obj. 3-4 Jeff 04-30-02 Reviewed & wrote down corrections to be made. frieda 06-12-02 Made changes as per Dino's review. -Penny 06-17-02 Made changes as per Dino's final review. -Penny 06-18-02 Made changes as per Dino's final inspection. -Penny 06-26-02 Review - lisa"], "jumps": []}]};
let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
