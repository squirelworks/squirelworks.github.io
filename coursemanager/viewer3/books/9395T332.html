<script>
const book = {"title": "9395T332", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: PROPORTIONAL, INTEGRAL, AND DERIVATIVE CONTROL SYSTEM"], "jumps": []}, {"id": "P10", "text": ["PROPORTIONAL, INTEGRAL, AND DERIVATIVE CONTROL SYSTEM"], "jumps": []}, {"id": "P100", "text": ["1. Basic Motor Control Modes..ntrol modes.ine item 2 here. item 2 here.e.e.", "w Identify the principles of Proportional and Derivative control. w Identify the principles of Proportional and Integral control. w Identify the principles of Proportional, Integral, and Derivative control..."], "jumps": []}, {"id": "P300", "text": ["In this lesson, the principles and operation of Proportional, Integral, and Derivative control circuits are introduced.trol circuits.", "Proportional control, integral control, and derivative control are used in automated systems to maintain optimum performance.", "A correlation between proportional control and derivative control is introduced, followed by a correlation between proportional control and integral control.", "Then the proportional, integral, and derivative (PID) control system is considered as a whole.le."], "jumps": ["PID"]}, {"id": "P440", "text": ["Let's begin the lesson on PROPORTIONAL, INTEGRAL AND DERIVATIVE CONTROL SYSTEM..."], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": ["The field of Industrial Controls often employs factors such as position, temperature, pressure, or flow to maintain a certain value.", "Customarily, the means used to maintain this desired value is some type of actuating device. Actuating devices require input signals for drive and control.", "The input signals control the time and the direction of the actuating device movement.", "Although a process can be controlled manually, efficiency is gained by the use of an automated control system. These systems monitor a process continuously, and they quickly react to any changes in the process..."], "jumps": ["P1001"]}, {"id": "P1060", "text": ["Regardless of the type of controller system used, all controller systems require two inputs, the set point (Sp) and the process variable (Pv).", "The optimum performance reference setting provided by the system operator.", "The actual measured performance provided by sensors in the control circuitry."], "jumps": ["Pv"]}, {"id": "P1070", "text": ["An automated control system detects the actual performance value, compares the detected value to the set point value, and adjusts the process to the set point value. Proper performance of a process is achieved when the desired (set point) value is maintained..."], "jumps": []}, {"id": "P1080", "text": ["One of the most recognized automated control systems is the proportional, integral, and derivative (PID) control system."], "jumps": ["PID"]}, {"id": "P1090", "text": ["The PID control system is quick acting and corrective. It uses a set point as a reference to adjust the process for optimum operation. After the set point is established, the recovery time is adjusted to maximize the control function of the system..."], "jumps": []}, {"id": "P1100", "text": ["An excessively long recovery time might not maintain the process in a smooth manner, and too short a recovery time can cause the controller to attempt to over-control if the system cannot react fast enough for correction..."], "jumps": []}, {"id": "P1110", "text": ["A midpoint between a quick response time and operational capabilities of the process must be established. The proportional, integral, and derivative control system permits achieving the midpoint between a quick response time and the process capabilities..."], "jumps": []}, {"id": "P1120", "text": ["The PID controller compares the set point value and a measured value from the process and then responds to the difference of these two values. The reaction by the controller for each response is based upon the proportional, integral, and derivative values established..."], "jumps": []}, {"id": "P1130", "text": ["Examining the automatic control progression, we begin at the process portion. The process operates within certain parameters. These parameters, known as process variables, are sent to the measurement system..."], "jumps": []}, {"id": "P1140", "text": ["When the process variables are changed due to an increased load or other outside influence, the measured values change. The controller compares these measured values against the set point values..."], "jumps": []}, {"id": "P1150", "text": ["When the process variables and set point values are different, the controller processes the difference between the signals as an error or actuator signal. If the process variable is lower or higher in value than the set point value, the controller sends an actuator signal to the actuator..."], "jumps": []}, {"id": "P1170", "text": ["On the other hand, when two set points are used, a set point band is established. The set point band allows the process to vary slightly without an error signal being produced; so fewer actuator signals are developed in order to increase stability in the process..."], "jumps": []}, {"id": "P1180", "text": ["As long as the process is operating within the predetermined range of parameters, the controller distinguishes no difference from the set point values and the process variable values. Thus, the controller will not recognize any error between these two values, and no correction signal is generated..."], "jumps": []}, {"id": "P1190", "text": ["Process variables (P ) are the measured values of the process. As outside influences, such as a load, are added to the process, the process variables change in value. The process will have optimum values established for proper operation, against which the process variables are compared."], "jumps": ["P"]}, {"id": "P1200", "text": ["An optimum operating parameter (set point) of the process is compared to an actual operating parameter (process variable), and an error signal is developed. This error signal is enhanced by one or more control modes for use by the actuating device..."], "jumps": []}, {"id": "P1210", "text": ["What is the set point?tion is typed........................", "The set point is the actual measured performance value.", "The set point is provided by the operator and is the optimum performance setting."], "jumps": ["P1200"]}, {"id": "P1211", "text": [], "jumps": []}, {"id": "P1212", "text": ["The set point is set by the operator of the system........."], "jumps": []}, {"id": "P1220", "text": ["What is the process variable? typed........................", "The process variable is provided by the operator and is the optimum performance setting.", "The process variable is the error signal.", "The process variable is the actual measured performance value."], "jumps": ["P1210"]}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1222", "text": ["The process variable is the measured performance value....."], "jumps": []}, {"id": "P1230", "text": ["Proportional control is similar to the setting of a lever (throttle) to obtain a constant process variable signal with no change in loading characteristics. In other words, the output is proportional to the error signal..."], "jumps": ["P1240"]}, {"id": "P1235", "text": ["Proportional Control Mode - Uses an adjustable gain as the means to increase the rise time and to manage the error signals. The proportional control senses an error between the set point and the process variable signal..."], "jumps": []}, {"id": "P1240", "text": ["Proportional control modes also produce an actuator signal that is amplified and sent to the actuator. The actuator operates only when it senses an actuator signal produced by an error signal."], "jumps": ["P1230"]}, {"id": "P1250", "text": ["The proportional control system operates by sensing an error (offset) between the set point (S ) and the process variable (P ). The equation for proportional error is::::"], "jumps": ["P"]}, {"id": "P1260", "text": ["The proportional control system will use an adjustable gain for the feedback control loop. The equation for the proportional feedback control loop is:"], "jumps": []}, {"id": "P1270", "text": ["The output of a proportional control system will be at some level other than 0% and 100%, and it uses a predetermined value (set point) to compare to the process variable signal. This set point is normally centered in a range of control known as the Proportional Band..."], "jumps": ["P1280"]}, {"id": "P1275", "text": ["Proportional Band - is a region extending on both sides of the set point (S ) where the process variable (P ) is being controlled. This band is the operating range of the process, and it represents the output (gain) from the proportional controller.."], "jumps": ["P"]}, {"id": "P1280", "text": ["The controller's gain is lowest (0%) when the process is at maximum, and highest (100%) when the process is at minimum. At optimum operation (specific speed and load for the motor controller), both S and P are centered within the proportional band."], "jumps": ["P1270"]}, {"id": "P1290", "text": ["When a load is applied, P drops toward minimum (Min), i.e., speed decreases. When the controller senses this, it increases the proportional output (increasing motor speed) and, at the same time, shifts the proportional band toward maximum.."], "jumps": []}, {"id": "P1300", "text": ["Changing the proportional band tricks the controller into increasing the proportional output even more, which brings P near S faster.."], "jumps": []}, {"id": "P1310", "text": ["When the proportional band is too narrow, oscillations will result around the set point. This narrow band permits P to reach high control levels since the 100% and 0% output levels are too close together. This causes P to overshoot S prior to the second error signal being developed by the controller."], "jumps": []}, {"id": "P1320", "text": ["When the second error signal from the controller is applied, another P overshoot of S occurs. Overshooting continues and causes P to act as if it is in a search mode by producing continuous error signals from the controller, causing oscillations around the set point.."], "jumps": []}, {"id": "P1330", "text": ["These oscillations show that a narrow proportional band produces short recovery times. An excessively short recovery time causes the process to become unstable because the control system is continuously reacting to a difference between P and S ."], "jumps": []}, {"id": "P1340", "text": ["When the proportional band is too wide, the control process will respond slowly. With each subsequent error signal from the controller applied, the P will barely move toward S . This causes numerous controller responses to bring P back to S ."], "jumps": []}, {"id": "P1350", "text": ["What happens when the proportional band is too narrow?.....", "The control process responds slowly and performance is hampered.", "The set point moves out of range with the process variable.", "The control process constantly oscillates around the set point."], "jumps": ["P1340"]}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1352", "text": ["With a narrow proportional band the system is constantly oscillating around the set point."], "jumps": []}, {"id": "P1360", "text": ["With only proportional control, the controller will be unable to bring the process variable to the set point; some type of manual adjustment or manual reset is required. Proportional control increases the rise time, overshoot, and steady-state error (e ), although it reduces the settling time."], "jumps": ["P1370"]}, {"id": "P1365", "text": ["Steady-state - Is the condition where the values of a circuit have settled and tend to remain constant. The steady-state error (e ) indicates the difference between the optimum value (set point value) and the process variable."], "jumps": []}, {"id": "P1370", "text": ["A reset is needed to bring the signal level back to the original level or set point value. To automatically reset the controller whenever there is an error, another function is added. This added function is identified as the Integral (reset) Control mode..."], "jumps": ["P1380", "P1360"]}, {"id": "P1375", "text": ["Integral Control - To maintain, through compensation, a constant process variable signal regardless of loading characteristics. Integral action takes place anytime there is a deviation between the set point and process variable. The elimination of steady-state error is accomplished by the use of integral control...ontrol."], "jumps": []}, {"id": "P1380", "text": ["The elimination of steady-state error is accomplished by the use of integral control. Reset values are established in either repeats per minute (r/m) or minutes per repeat (m/r). Remember that repeats per minute is the inverse of minutes per repeat..."], "jumps": ["P1370"]}, {"id": "P1390", "text": ["A value in repeats per minute describes how many resets are initiated per minute and is known as the reset rate. Repeats per minute is the unit used for a system that requires many resets in a short amount of time for proper operation of the process..."], "jumps": []}, {"id": "P1400", "text": ["In contrast, the value of minutes per repeat is the number of minutes that go by before a reset is initiated and is known as the reset time. Minutes per repeat is the unit used for systems that need very few resets for proper operation of the process..."], "jumps": []}, {"id": "P1410", "text": ["Integral action is used to reduce the set point minus the process value (S - P ) to zero. Integral control is summarized in the illustration, which shows a closed-loop system with a step error present. The output is a scaled output of the error."], "jumps": []}, {"id": "P1420", "text": ["When the error is a constant offset error, the integral signal will ramp. This ramping signal will reduce the error by causing the actuator signal to change."], "jumps": []}, {"id": "P1430", "text": ["When the error reaches zero, there will be a steady integral signal. This steady integral signal will bring the error to zero in the steady-state."], "jumps": []}, {"id": "P1440", "text": ["To eliminate problems during the startup cycle of the process, the automatic reset (integral) is normally disabled. Disabling the reset during startup allows the process to reach the normal operating value without damage to any part of the process....."], "jumps": []}, {"id": "P1450", "text": ["Four factors determine how much reset effect will occur. These four factors are:.............................................................................................."], "jumps": []}, {"id": "P1460", "text": ["What is the inverse of repeats per minute?................."], "jumps": ["P1450"]}, {"id": "P1461", "text": [], "jumps": []}, {"id": "P1462", "text": ["The opposite of repeats per minute can only be minutes per repeat."], "jumps": []}, {"id": "P1470", "text": ["Derivative Control compensates for a changing process variable signal by inhibiting rapid changes in the output signal. Derivative action is based on the mathematical term known as acceleration. Derivative action takes place only when the process variable input changes..."], "jumps": ["P1480", "P1460"]}, {"id": "P1475", "text": ["Derivative Control - An action that enables the stabilization of a controlled process. Stabilization is achieved by derivative control improving the overshoot of the control signal. Derivative control anticipates an action by observing how rapidly the change is occurring (rate of change).).."], "jumps": []}, {"id": "P1480", "text": ["Proportional Derivative (PD) Control combines proportional action and derivative action....oportional + derivative)."], "jumps": ["P1490", "P1470", "PD"]}, {"id": "P1485", "text": ["Proportional Derivative (PD) Control - Can anticipate the direction of error. Overshoot is predicted by the derivative control and compensation is observed through the PD action..on..", "oJ *Ii8 J.^ \\"], "jumps": ["PD"]}, {"id": "P1490", "text": ["The proportional derivative control acts anytime the process deviates, such as at the beginning or end of the process or when a variation occurs in the rate."], "jumps": ["P1480"]}, {"id": "P1500", "text": ["The fundamental nature of the proportional-derivative action is equivalent to a throttling control system with accelerated correction."], "jumps": []}, {"id": "P1510", "text": ["As the throttle is increased or decreased, the derivative action has an effect on the output signal. When the throttle ceases movement, the derivative action has minimal effect on the output."], "jumps": []}, {"id": "P1520", "text": ["The plot of the proportional derivative (PD) control shows that the action of the derivative controller reduces the overshoot and settling time, while having a minimal effect on the rise time and steady-state error..."], "jumps": ["PD"]}, {"id": "P1530", "text": ["The proportional derivative is faster reacting to overshoot and settles to the steady rate much faster than the proportional only control after startup. It also settles faster after changes in the loading or speed..."], "jumps": []}, {"id": "P1540", "text": ["Compare the differences on the plot at locations a, b, and c between the proportional derivative and the proportional only controllers. The proportional derivative signal peaks at a lower value and the overshoot seen in the proportional signal is less than the proportional derivative output signal..."], "jumps": []}, {"id": "P1550", "text": ["Proportional Integral (PI) Control combines proportional action and integral action..........................."], "jumps": ["P1560", "PI"]}, {"id": "P1555", "text": ["Proportional Integral (PI) Control - Corrects for any offset automatically over time by shifting the proportional band. The operator can adjust how fast the reset tries to correct for an offset. The proportional integral control procedure eliminates the need for the operator to continuously reset for the offset...fset.fset."], "jumps": ["PI"]}, {"id": "P1560", "text": ["During the startup cycle, the Proportional-Integral automatic reset is disabled to allow the process to reach the normal operating value without system damage. Automatic reset is normally disabled when the process is outside the range of the proportional band..."], "jumps": ["P1550"]}, {"id": "P1570", "text": ["This is a single output with a 10% proportional band and a set point of 500. The set point (S ) is centered in the range of the proportional band. Notice that the process variable (P ) is outside the range of the proportional band (PB)."], "jumps": ["P", "PB"]}, {"id": "P1580", "text": ["When the process variable is outside the range of the proportional band, the integral (automatic reset) control is disabled."], "jumps": []}, {"id": "P1590", "text": ["As the process variable enters the lower range of the proportional band the proportional band moves in a higher direction towards Max. This movement causes the output of the proportional band to increase slightly towards the 100% level. Notice that the set point remains at a constant value..."], "jumps": []}, {"id": "P1600", "text": ["Here is the process variable as it approaches the set point. Note the proportional band continues to move in a higher direction, causing the output to increase more towards the 100% level."], "jumps": []}, {"id": "P1610", "text": ["This also is what the initial integral (automatic reset) action would be if a load were placed on the process. The process variable has shifted below the set point (loading the process)."], "jumps": []}, {"id": "P1620", "text": ["As the process variable passes the set point in a given direction, the proportional band moves in the opposite direction. The proportional band moving in the opposite direction drives the output to less than the 50% level, which, in turn, causes the process variable to also move in the opposite direction..."], "jumps": []}, {"id": "P1630", "text": ["The movement of the proportional band equalizes the values of the process variable and the set point. The process variable and set point are, once again, balanced, and the proportional and integral actions end..."], "jumps": []}, {"id": "P1640", "text": ["The steady-state error is eliminated by means of proportional-integral control. Notice that the value of the proportional + integral signal has reached the set point value.alue."], "jumps": []}, {"id": "P1650", "text": ["Rise time is degraded by integral action and is a direct result of the integral signal reaching peak value at time T versus the proportional value reaching peak shortly after time T ."], "jumps": []}, {"id": "P1660", "text": ["Overshoot is decreased by integral action. The proportional + integral signal overshoot at time T is slightly larger and has a longer duration than the same overshoot by the proportional signal.."], "jumps": []}, {"id": "P1670", "text": ["Proportional Integral Derivative (PID) Control combines proportional action, integral action, and derivative action....oportional + integral + derivative).."], "jumps": ["P1680", "PID"]}, {"id": "P1675", "text": ["Proportional Integral Derivative (PID) Control - Functions combined the output values can be other than 0% or 100%. Proportional control improves rise time. Integral control eliminates steady-state error. Derivative control reduces overshoot.oot...reduces overshoot."], "jumps": ["PID"]}, {"id": "P1680", "text": ["Proportional action compares the set point value to the process variable and uses the difference between these two values as an error signal. An adjustable gain is used that manages the error signal to produce an actuator signal..."], "jumps": ["P1670"]}, {"id": "P1690", "text": ["Integral action enables a large gain at low frequencies. This action results in eliminating offset and reducing instability caused by load changes."], "jumps": []}, {"id": "P1700", "text": ["For derivative action combined with integral action, the derivative time constant should be much shorter than the integral (automatic reset) time constant value."], "jumps": []}, {"id": "P1710", "text": ["Notice the different effects on the input signal resulting from the combination of proportional, integral, and derivative action. The proportional only signal has a good rise time but shows a dramatic overshoot and does not reach the set point value..."], "jumps": []}, {"id": "P1720", "text": ["The proportional derivative (PD) signal reduces the overshoot but does not aid in reaching the set point value."], "jumps": ["PD"]}, {"id": "P1730", "text": ["The proportional integral (PI) signal reaches the set point value but degrades the rise time."], "jumps": ["PI"]}, {"id": "P1740", "text": ["Only when all three-control signals are combined are the individual benefits maximized while the shortcomings inherent to each control signal are reduced."], "jumps": []}, {"id": "P1750", "text": ["Which system provides the most accurate and fastest control?"], "jumps": ["P1740"]}, {"id": "P1751", "text": [], "jumps": []}, {"id": "P1752", "text": ["Only when all three-control signals are combined are the individual benefits maximized while the shortcomings inherent to each control signal are reduced."], "jumps": []}, {"id": "P1910", "text": ["You have completed the information on PID CONTROL SYSTEMS..", "1. Industrial process values are maintained by means of some form of actuating device.."], "jumps": ["P1001", "P1750"]}, {"id": "P1930", "text": ["2. Automated control systems are quicker, more reliable, and more accurate than manual controls.."], "jumps": []}, {"id": "P1940", "text": ["3. The set point is the optimum operating parameter, or a reference to which an operator adjusts the process to obtain the optimum operation..."], "jumps": []}, {"id": "P1950", "text": ["4. The process variable is the actual operating parameter or actual measured value in the process.."], "jumps": []}, {"id": "P1960", "text": ["5. The proportional band is the region on each side of the set point where the controller is managing the process."], "jumps": []}, {"id": "P1970", "text": ["6. The proportional control mode uses an adjustable gain as the means to increase the rise time and to manage the error signal."], "jumps": ["P1975", "P1960"]}, {"id": "P1975", "text": ["7. PD control reduces the overshoot but does not aid in reaching the set point value."], "jumps": []}, {"id": "P1980", "text": ["8. PI control allows the set point value to be reached, but the rise time is degraded..."], "jumps": []}, {"id": "P1990", "text": ["9. PID control is used as a band-pass or band reject filter. With its fast rise time and low overshoot, it reaches the set point value."], "jumps": ["P1999"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1990"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P1 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;

    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);

  for (const line of page.text) {

    stage.appendChild(p);
  }
  if (page.jumps.length) {

      b.textContent = id;
      b.addEventListener("click", () => go(id));

  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
