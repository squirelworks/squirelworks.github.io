"jumps": []}, {"id": "P10218", "text": ["Flipping switches, disconnecting cables, and desoldering.", "How are components isolated for troubleshooting in a synchro system? w"], "jumps": []}, {"id": "P10217", "text": ["None tracking, they are in random positions.", "All of them track together but the torque is very low. ter.", "A rotor is open on the transmitter in a synchro system. How are the receivers arranged?"], "jumps": []}, {"id": "P10216", "text": ["Only those devices electrically next to the receiver.", "A shorted stator winding on a receiver affects what devices? k"], "jumps": []}, {"id": "P10215", "text": ["When troubleshooting a synchro system, how is a multimeter used? k"], "jumps": []}, {"id": "P10214", "text": ["Only one receiver in a multi-receiver synchro system does not track the transmitter with the other receivers. It remains at 60 degrees. What is the likely cause?"], "jumps": []}, {"id": "P10213", "text": ["The receiver rotor locks up on the good windings.", "The receiver rotor is always 120 degrees out of correspondence.", "The receiver rotor is always 180 degrees out of correspondence.", "The receiver rotor follows the transmitter rotor.", "Which is the symptom of a shorted receiver stator winding?"], "jumps": []}, {"id": "P10212", "text": ["What is the first step in troubleshooting synchro systems? o"], "jumps": []}, {"id": "P10211", "text": ["What is the most likely defect in the system where the dials of the TX and TR rotate in opposite directions? defect in the system?"], "jumps": []}, {"id": "P10210", "text": ["The fuse is open that supplies power to the synchro system. What is the most likely defect in the system?"], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1940", "P1001"]}, {"id": "P1940", "text": ["3. The following table shows the effects of troubleshooting the stator. Device Winding All TR/CT track to the good stator windings TX Stator Shorted One TR/CT tracks to the good stator windings TR/CT Stator Shorted All TR/CT track to the good stator windings TX Stator Open One TR/CT tracks to the good stator windings TR/CT Stator Open All TR/CT track 120", "from TX TX Stator Reversed One TR/CT track 120"], "jumps": []}, {"id": "P1930", "text": ["2. The following table shows the effects of troubleshooting the rotor. Device Winding System dead, fuse open TX Rotor Shorted System dead, fuse open TR Rotor Shorted TR/CT track each other, TX has no effect TX Rotor Open One TR/CT will not track TR/CT Rotor Open All TR/CT track 180", "out of correspondence TX Rotor Reversed One TR/CT tracks 180", "out of correspondence TR/CT Rotor Reverseddddd"], "jumps": []}, {"id": "P1920", "text": ["1. There are 4 steps to troubleshooting synchro failures:.."], "jumps": ["P1930", "P1001"]}, {"id": "P1910", "text": ["You have completed the information on TROUBLESHOOTING SYNCHRO SYSTEMS."], "jumps": ["P1001", "P1330"]}, {"id": "P1330", "text": ["Mistakenly reversing the stator leads during repair can be confusing and mislead the technician into the belief that the replacement component is defective since the system is still inoperative after the repairs were performed..."], "jumps": []}, {"id": "P1320", "text": ["Like shorts on transmitters, Opens in the stator winding of a transmitter will require isolation and testing with the ohmmeter since the entire system is affected."], "jumps": []}, {"id": "P1310", "text": ["An open stator winding will give a symptom similar to a shorted stator winding. An open stator winding on a transmitter will affect all devices in the system but an open stator winding on a receiver will affect only the single defective receiver..."], "jumps": []}, {"id": "P1300", "text": ["Isolating the devices and testing with an ohmmeter is the best way to determine the device with the shorted stator winding. If the shorted stator is a receiver it may be isolated from the system and the remaining devices in the system will return to normal operation..."], "jumps": []}, {"id": "P1290", "text": ["A shorted stator winding will cause all the devices in the system to point in one direction with the transmitter causing little rotational change. The key point to remember is that all the rotors will point toward the good stator field axis and not the bad stator field axis..."], "jumps": []}, {"id": "P1280", "text": ["The only other electrical problem found with rotors is caused by reversing the leads during the repair. The rotor of the affected device will track in the same direction of rotation but will be exactly 180 degrees out of correspondence with all other devices at all times..."], "jumps": []}, {"id": "P1270", "text": ["An open rotor in a transmitter will affect the entire system. The receivers will attempt to track each other but the torque will be very poor. their rotational position."], "jumps": []}, {"id": "P1260", "text": ["An open rotor condition is easier to troubleshoot since power can be applied to the system. An open rotor in a receiver will affect only the single device."], "jumps": []}, {"id": "P1250", "text": ["In a shorted rotor condition an ohmmeter measurement on the rotor leads should measure very close to zero ohms. When the device with the shorted rotor is removed from the circuit the resistance in the overall circuit should go up..."], "jumps": []}, {"id": "P1240", "text": ["Rotor faults can be either shorted, opened or reversed conditions. A shorted rotor will blow the fuse or circuit breaker for the synchro system. Any time the fuse or circuit breaker has opened, always suspect a shorted rotor."], "jumps": []}, {"id": "P1230", "text": ["We'll next discuss rotor winding and stator winding failures in transmitters and receivers. The troubleshooting steps are the same regardless of the type of synchro system, torque or control. Transmitter troubleshooting is the same for TX, CX, TDX, and CDX devices. Receiver troubleshooting includes TR and CT devices....."], "jumps": []}, {"id": "P1220", "text": ["Finally, test the suspected components with an ohmmeter...."], "jumps": []}, {"id": "P1210", "text": ["Removal of a component can be as easy as flipping a switch or removing a cable connection. Desoldering may be necessary in some applications."], "jumps": []}, {"id": "P1200", "text": ["Transmitter and receiver rotor windings are connected in parallel. Stator windings are also connected in parallel. Detecting a shorted or open condition is very difficult unless the components are isolated..."], "jumps": []}, {"id": "P1190", "text": ["Disconnect the power and lock out the electrical panel, place warning labels on the equipment, or perform any other appropriate and accepted method of ensuring your safety. This is the most important step..."], "jumps": []}, {"id": "P1180", "text": ["Sometimes the reported problem and the actual symptom are unrelated. Always test the equipment yourself to confirm the symptom. Try every function of the circuit to help with the diagnostics..."], "jumps": []}, {"id": "P1172", "text": ["While the symptoms of failed synchro components vary, the steps to diagnose the defect are always the same."], "jumps": []}, {"id": "P1170", "text": ["De-energize the synchro circuit and connect the meter from S1 to S3. Energize the circuit and adjust the stator until the meter reads as close to zero volts as possible. This is the fine electrical zero setting. De-energize the synchro circuit and reattach the synchro connections. VAC (15 VAC for a 26 VAC synchro)."], "jumps": []}, {"id": "P1169", "text": ["Should the voltmeter read 193 volts the rotor is at 180 degrees. Correct this problem by rotating the synchro 180 degrees and measure the voltage again for approximately 37 VAC. The synchro is now approximately on electrical zero.....tator until the voltmeter reads approximately 37 VAC (15 VAC for a 26 VAC synchro)."], "jumps": []}, {"id": "P1168", "text": ["If not performed in the previous step, de-energize the synchro circuit and disconnect the stator leads. Set the voltmeter to the highest scale and connect it to the circuit at R1 and S1. Energize the synchro circuit and rotate the stator until the voltmeter reads approximately 37 VAC (15 VAC for a 26 VAC synchro)..."], "jumps": []}, {"id": "P1166", "text": ["First carefully set the unit accurately to 0 degrees or on its reference position. If zeroing a TR, it is necessary to disconnect the stator leads before setting the rotor to zero. Securing the dial to 0 degrees may also be necessary..., CX, or TR is the same because they are electrically and functionally similar."], "jumps": []}, {"id": "P1164", "text": ["Before zeroing, ensure that the synchros are isolated from the rest of the system by removing the stator leads. This prevents mutual synchro stator fields from introducing errors while zeroing the synchro. The zeroing procedure for a TX, CX, or TR is the same because they are electrically and functionally similar."], "jumps": []}, {"id": "P1162", "text": ["The most accurate method of zeroing torque synchros is the AC voltmeter method. The first step is the coarse or approximate setting which ensures that the synchro alignment is with the zero degree point not the 180 degree point. Secondly, the fine zeroing step ensures the synchro is as close to zero as possible.."], "jumps": []}, {"id": "P1160", "text": ["Many synchro systems are also used in radar control applications producing lethal energies. Make sure to take all safety precautions when servicing synchro systems. Electrical panel lockouts and equipment tagging should always be used..."], "jumps": []}, {"id": "P1150", "text": ["All synchros operate on AC voltage. The two most common are 26 V and 115 V. The AC voltage is either 60 Hz or 400 Hz. 400 Hz synchros are more common due to their smaller size and accuracy..acy...s the most common frequency."], "jumps": []}, {"id": "P1140", "text": ["A synchro system requires one transmitter and at least one receiver or control transformer. More than one receiver or control transformer may be a part of the system as more than one assembly may be controlled by the same transmitter..."], "jumps": []}, {"id": "P1130", "text": ["Sometimes errors occur during the repair of the system with loose or reversed connections. This can easily occur as the connections are sometimes weathered or faded."], "jumps": []}, {"id": "P1120", "text": ["Most in-service failures of synchro systems can be found by looking for a short or an open condition. These could be a shorted or open rotor winding, stator winding, or a poor connection on an interconnecting cable..."], "jumps": ["P1110"]}, {"id": "P1114", "text": ["The control differential transmitter is the same as the torque differential transmitter."], "jumps": []}, {"id": "P1113", "text": ["The control transmitter is equal to the torque transmitter."], "jumps": []}, {"id": "P1112", "text": ["The servo amplifier is a part of the servo system.........."], "jumps": []}, {"id": "P1111", "text": [], "jumps": []}, {"id": "P1110", "text": ["Which control system component is most like a torque receiver?ceiver?"], "jumps": ["P1100"]}, {"id": "P1100", "text": ["Often components used in synchro systems work in a harsher environment than other electronic circuits. Failures of systems using electro-mechanical devices can also be expected at a higher than normal rate due to the nature of the circuitry..."], "jumps": []}, {"id": "P1090", "text": ["Every device in a synchro system is electro-mechanical, either converting a physical movement to an electrical signal or converting an electrical signal to a physical movement. Each device in a synchro system also incorporates slip-rings with brushes on the rotor..."], "jumps": []}, {"id": "P1080", "text": ["The rotational position of the rotor provides error correction signals that are applied to the servo system, thus maintaining the load's position as assigned by the control transmitter."], "jumps": []}, {"id": "P1070", "text": ["In a control synchro system the control transformer, CT, is mechanically coupled to the assembly, the load. The servo system responds to the position settings of the control transmitter, moving the assembly and the control transformer rotor to the desired position..."], "jumps": []}, {"id": "P1060", "text": ["In a torque synchro system the receiver, TR, provides the mechanical motion.."], "jumps": []}, {"id": "P1050", "text": ["When moving a large assembly a servosystem and a control system is used comprised of a transmitter (CX), a differential transmitter (CDX), and a control transformer (CT)............."], "jumps": []}, {"id": "P1040", "text": ["Should positional correction be required a differential transmitter (TDX) is added to the circuit. This allows position offset for compass headings or bearings."], "jumps": []}, {"id": "P1030", "text": ["In its simplest form the torque synchro system consists of a transmitter (TX) and a receiver (TR). Mechanical movement applied to the transmitter rotor is converted to electrical signals which are used by the receiver to duplicate the motion of the transmitter."], "jumps": []}, {"id": "P1020", "text": ["The basic synchro system converts mechanical movement into an electrical signal which is then used to duplicate the mechanical movement at another location."], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": ["P470"]}, {"id": "P470", "text": ["Let's begin the lesson on TROUBLESHOOTING SYNCHRO SYSTEMS..................."], "jumps": []}, {"id": "P460", "text": ["These are just a few examples of the areas where you will find synchro systems."], "jumps": []}, {"id": "P450", "text": ["Large ships use synchros to control rudder positioning....."], "jumps": []}, {"id": "P440", "text": ["The space shuttle uses synchros to control the movement of its robotic arm."], "jumps": []}, {"id": "P430", "text": ["The satellite systems are also controlled by synchros.of its robotic arm."], "jumps": []}, {"id": "P420", "text": ["Tanks use synchros to control the movement of gun turrets.."], "jumps": []}, {"id": "P410", "text": ["Synchros are widely used in military and industrial applications."], "jumps": []}, {"id": "P400", "text": ["This lesson familiarizes you with the operation of the synchro troubleshooting.ing."], "jumps": ["P300", "P410"]}, {"id": "P300", "text": [], "jumps": []}, {"id": "P100", "text": ["w Recognize symptoms of rotor winding failures in synchro systems. w Recognize symptoms of stator winding failures in synchro systems. w Demonstrate knowledge of the troubleshooting methods and techniques in repairing synchro systems.", "1. Troubleshooting Synchro Systemstive 1 line item 2 here. item 2 here.e.e."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P1", "text": ["Title: TROUBLESHOOTING SYNCHRO SYSTEMSfd asdf asdf sadf", "Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
