ontracts. A rotor current is generated by the principle of induction."], "jumps": ["P1940", "P1960"]}, {"id": "P1940", "text": ["Cross Section of 4 - pole 2 phase AC induction motor", "3. AC motor action is caused by a rotating stator magnetic field. This field is induced by stator current (1 and 2)."], "jumps": ["P1930", "P1950"]}, {"id": "P1930", "text": ["2. Induction motor rotors are commonly called squirrel cage rotors due to their distinct appearance. orting Ring Shaft AC Induction Motor Rotor Construction"], "jumps": ["P1920", "P1940"]}, {"id": "P1920", "text": ["1.  AC induction motors are continuous rotating machines that           require alternating current as an input.", "1. AC induction motors are continuous rotating machines that require alternating current as an input. chinery Motor Incremental Continuous DC AC"], "jumps": ["P1001", "P1930"]}, {"id": "P1910", "text": ["This completes the information on AC MOTORS.1 TITLE........"], "jumps": ["P1720", "P1001"]}, {"id": "P1830", "text": ["This is an important concept when discussing loaded and unloaded AC motor characteristics."], "jumps": ["P1720", "P1910"]}, {"id": "P1820", "text": ["No current is produced and the torque is zero."], "jumps": ["P1720", "P1830"]}, {"id": "P1810", "text": ["If the rotor is turning at the same RPM as the stator's magnetic field, there is no relative motion between the rotating stator field and conductor (rotor).?"], "jumps": ["P1720", "P1820"]}, {"id": "P1800", "text": ["This produces maximum current and maximum torque."], "jumps": ["P1720", "P1810"]}, {"id": "P1790", "text": ["If the rotor is locked (no rotation), there is maximum relative motion between the rotating stator field and the conductor (rotor)."], "jumps": ["P1720", "P1800"]}, {"id": "P1780", "text": ["Rotor current depends on the relative motion between the stator's magnetic field and the conductor (rotor)."], "jumps": ["P1720", "P1790"]}, {"id": "P1770", "text": ["Remember, torque and current are proportional. The higher the current, the higher the torque."], "jumps": ["P1720", "P1780"]}, {"id": "P1760", "text": ["Compared to its input current, the output current of a motor is larger."], "jumps": ["P1720", "P1770"]}, {"id": "P1755", "text": ["The primary to secondary winding ratio will have a significant effect on current."], "jumps": ["P1720", "P1760"]}, {"id": "P1750", "text": ["A step down transformer has less voltage and more current on the secondary than the primary."], "jumps": ["P1720", "P1755"]}, {"id": "P1740", "text": ["An equivalent electrical drawing of the stator and rotor is a step down transformer."], "jumps": ["P1720", "P1750"]}, {"id": "P1730", "text": ["Sometimes the stator is called the primary and the rotor is called the secondary."], "jumps": ["P1720", "P1740"]}, {"id": "P1720", "text": ["This is identical to transformer action. condary (Rotor) Primary Primary Secondary (Stator) (Stator) (Rotor) Electrical"], "jumps": ["P1700", "P1730"]}, {"id": "P1710", "text": ["Since there is no electrical connection between the stator and rotor, the magnetic field of the stator induces voltage in the rotor coils."], "jumps": ["P1700", "P1720"]}, {"id": "P1700", "text": ["In the AC induction motor, the inductor (stator) is very close to the conductor (rotor). r). otor)."], "jumps": ["P1690", "P1710"]}, {"id": "P1692", "text": ["Remember, Field RPM equals synchronous speed and Shaft RPM equals the motors output Shaft speed or; SLIP SPEED FORMULA SLIP SPEED = FIELD RPM - SHAFT SPEED = 1200 - 1000 Field RPM = 1200 Shaft Speed = 1000"], "jumps": []}, {"id": "P1691", "text": [], "jumps": []}, {"id": "P1690", "text": ["If the synchronous speed of a motor is 1200 RPM and the motor's output shaft is rotating at 1000 RPM, what is the slip speed?"], "jumps": ["P1680"]}, {"id": "P1682", "text": ["Field RPM = Synchronous Speed =", "Remember, N equals the number of Pole Pairs per phase. In this case, there are 4 Pole Pairs or; FIELD RPM = SYNCHRONOUS SPEED 60() 60() Field RPM = Synchronous Speed = N N 60(60)"], "jumps": []}, {"id": "P1681", "text": [], "jumps": []}, {"id": "P1680", "text": ["A 1 phase 4 pole induction motor is operated at 60 Hz. What is the synchronous speed of the motor?"], "jumps": ["P1670"]}, {"id": "P1670", "text": ["Since synchronous speed is field RPM and slip speed is slip RPM, the motor's output shaft (shaft RPM) is rotating at 1700 RPM. AFT RPM = FIELD RPM - SLIP RPM = Synchronous Speed - Slip Speed = 1800 RPM - 100 RPM Motors Output Shaft = 1700 RPM"], "jumps": ["P1660", "P1680"]}, {"id": "P1660", "text": ["Shaft RPM = - Slip RPMM", "As an example of shaft speed, assume the motor's synchronous speed is 1800 RPM with a slip speed of 100 RPM. How fast is the motors output shaft spinning? Shaft RPM Formula Shaft RPM = Field RPM - Slip RPM 60 () Shaft RPM = - Slip RPM"], "jumps": ["P1650", "P1670"]}, {"id": "P1650", "text": ["Field RPM = - Slip RPMM", "= Frequency of input (Hz) RPMM", "N = # pf Pole Pairs RPMM", "Since the rotor is always trying to catch up or synchronize with the stator field RPM, the field RPM is commonly called the Synchronous Speed of the armature. eld RPM = Synchronous Speed 60 () = frequency of input (Hz) Field RPM = N N = # of Pole Pairs"], "jumps": ["P1640", "P1660"]}, {"id": "P1640", "text": ["Shaft RPM = - Slip RPMM", "Shaft RPM can be calculated since it is the difference between the Field RPM and the Slip RPM. Shaft RPM Formula Shaft RPM = Field RPM - Slip RPM 60 () Shaft RPM = - Slip RPM N"], "jumps": ["P1630", "P1650"]}, {"id": "P1630", "text": ["How fast the rotor actually rotates is termed shaft speed.."], "jumps": ["P1640", "P1610"]}, {"id": "P1620", "text": ["This is called slip RPM because the rotor slips or lags behind the stator magnetic field."], "jumps": ["P1610", "P1630"]}, {"id": "P1610", "text": ["The rotor's RPM always lags behind the stator's magnetic field RPM."], "jumps": ["P1600", "P1620"]}, {"id": "P1600", "text": ["Due to magnetic attraction, the rotor attempts to follow the stator (in rotation)."], "jumps": ["P1590"]}, {"id": "P1590", "text": ["If the input sine wave has a frequency of 60 Hz and the motor has 4 stator poles, the field RPM equals 1800. Remember you must divide the number of stator poles by 2 to determine the number of pole pairs."], "jumps": []}, {"id": "P1580", "text": ["= Frequency of Input (Hz) N= # of pole Pairs", "Field RPM can easily be calculated. There are 60 seconds in a minute, the only constant in the formula. of Pole Pairs"], "jumps": ["P1560", "P1590"]}, {"id": "P1570", "text": ["How fast the stator magnetic field rotates is known as the Field Speed or Field RPM."], "jumps": ["P1560", "P1580"]}, {"id": "P1560", "text": ["The stator magnetic field rotates from pole pair to pole pair."], "jumps": ["P1550", "P1570"]}, {"id": "P1553", "text": ["A stator magnetic field induces a rotor current not a rotor magnetic field."], "jumps": []}, {"id": "P1552", "text": ["Stator current induces a magnetic field...................."], "jumps": []}, {"id": "P1551", "text": [], "jumps": []}, {"id": "P1550", "text": ["What produces a rotor magnetic field in an induction motor?"], "jumps": ["P1540"]}, {"id": "P1543", "text": ["Stator current induces a stator magnetic field, but will not induce rotor current."], "jumps": []}, {"id": "P1542", "text": ["Stator voltage is related to stator current only. The voltage cannot induce a rotor current."], "jumps": []}, {"id": "P1541", "text": [], "jumps": []}, {"id": "P1540", "text": ["What induces current in the rotor of an induction motor?..."], "jumps": ["P1510"]}, {"id": "P1530", "text": ["Due to the attraction of the stator field and the rotor field, motor action occurs."], "jumps": ["P1510", "P1540"]}, {"id": "P1520", "text": ["As the stator field changes, the rotor field follows due to this attraction."], "jumps": ["P1510"]}, {"id": "P1510", "text": ["The induced magnetic field in the rotor is attracted to the stator magnetic field."], "jumps": ["P1490"]}, {"id": "P1500", "text": ["The induced currents in the rotor will induce a magnetic field in the rotor."], "jumps": ["P1490", "P1510"]}, {"id": "P1490", "text": ["All squirrel cage rotors have induced current flow through the connecting rods via the shorting rings."], "jumps": ["P1460", "P1500"]}, {"id": "P1480", "text": ["This is how the motor derives it's name, the AC induction motor."], "jumps": ["P1460", "P1490"]}, {"id": "P1470", "text": ["Because of expanding and contracting stator magnetic fields, rotor current is induced. This is due to induction."], "jumps": ["P1460", "P1480"]}, {"id": "P1460", "text": ["The changing amplitude of the waveforms cause the stator magnetic fields to constantly expand and contract, as well as rotate."], "jumps": []}, {"id": "P1450", "text": ["At time T4, each waveform has completed one cycle and the process begins again."], "jumps": ["P1370"]}, {"id": "P1440", "text": ["Because 1 is negative, it corresponds to a reversed polarity magnetic field on the connected stator poles."], "jumps": ["P1370", "P1450"]}, {"id": "P1430", "text": ["At time T3, 2 is zero and 1 is at it's maximum negative value."], "jumps": ["P1370", "P1440"]}, {"id": "P1420", "text": ["Because 2 is negative, it corresponds to a reversed polarity magnetic field on the connected stator poles."], "jumps": ["P1370", "P1430"]}, {"id": "P1410", "text": ["At time T2, 1 is zero and 2 now has it's maximum negative value."], "jumps": ["P1370", "P1420"]}, {"id": "P1400", "text": ["Since 1 current is maximum, a magnetic field is developed across the poles connected to 1."], "jumps": ["P1370", "P1410"]}, {"id": "P1390", "text": ["At line T1, 2 is zero and 1 is maximum. This corresponds to maximum 1 current and minimum 2 current."], "jumps": ["P1370", "P1400"]}, {"id": "P1380", "text": ["Since 2 current is maximum, a magnetic field is developed across the poles connected to 2."], "jumps": ["P1370", "P1390"]}, {"id": "P1370", "text": ["T0 T1 T2 T3 T4 T5", "Initially, 1 is at its zero crossing point, while 2 is at maximum."], "jumps": ["P1352", "P1380"]}, {"id": "P1360", "text": ["These stator currents (not voltages) cause pulsating magnetic fields that rotate in a circle around the rotor."], "jumps": ["P1352", "P1370"]}, {"id": "P1355", "text": ["PURELY INDUCTIVE- The ability for the stator to produce the largest possible magnetic field (maximum power) across it, without having any resistance. This resistance would cause some of the power to be dissipated in the form of heat."], "jumps": []}, {"id": "P1352", "text": ["If you consider the stator windings to be purely inductive, stator currents will also be 90 degrees out of phase."], "jumps": ["P1340", "P1360"]}, {"id": "P1350", "text": ["If you consider the stator windings to be purely inductive, stator currents will also be 90 degrees out of phase."], "jumps": ["P1340", "P1360"]}, {"id": "P1340", "text": ["The two sine waves are applied to different pole pairs (2 poles) of the induction motor."], "jumps": ["P1330", "P1350"]}, {"id": "P1330", "text": ["T0 T1 T2 T3 T4 T5", "To understand an actual AC induction motor, consider two sine waves, 90"], "jumps": ["P1300", "P1340"]}, {"id": "P1320", "text": ["The rotor of an AC induction motor is not a magnet."], "jumps": ["P1300", "P1330"]}, {"id": "P1310", "text": ["The stators of an AC induction motor are fixed and do not rotate."], "jumps": ["P1300", "P1320"]}, {"id": "P1300", "text": ["An actual AC inductor motor is slightly more complicated than three moving magnets."], "jumps": ["P1310", "P1290"]}, {"id": "P1290", "text": ["If this rotation could be maintained, motor action would then exist."], "jumps": ["P1240", "P1300"]}, {"id": "P1280", "text": ["If the rotor magnet keeps pace with the stator magnets, then the magnets are said to be synchronized."], "jumps": ["P1240", "P1290"]}, {"id": "P1270", "text": ["The rotor will rotate around the pivot point."], "jumps": ["P1280", "P1240"]}, {"id": "P1260", "text": ["Attracted forces between the two magnets cause the rotor magnet to follow."], "jumps": ["P1240", "P1270"]}, {"id": "P1250", "text": ["Assume that the outside magnets (stator magnets) rotate and that the distance between the two magnets is small."], "jumps": ["P1240", "P1260"]}, {"id": "P1240", "text": ["To understand AC motor action, let's use 3 moving magnets: 2 stators and 1 rotor."], "jumps": ["P1230", "P1250", "Pivot"]}, {"id": "P1230", "text": ["If an AC induction motor has only one field in the stator, how can motor action occur?"], "jumps": ["P1220", "P1240"]}, {"id": "P1220", "text": ["The only field induced in an AC motor is a result of the windings around the pole pieces."], "jumps": ["P1210", "P1230"]}, {"id": "P1210", "text": ["Since an AC induction motor's rotor has no commutator, brushes or applied voltage source, it cannot generate a field."], "jumps": ["P1200", "P1220"]}, {"id": "P1203", "text": ["The commutator and brushes are common to a DC motor only..."], "jumps": []}, {"id": "P1202", "text": ["A stator is common to both DC and AC motors and works with the rotor to generate motor action."], "jumps": []}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1200", "text": ["Which part listed below is used in AC motors only?........."], "jumps": ["P1180"]}, {"id": "P1190", "text": ["In both motor types, the field windings are placed on pole pieces to generate a magnetic field."], "jumps": ["P1180", "P1200"]}, {"id": "P1180", "text": ["The stator of an AC motor is similar to the stator of a DC motor."], "jumps": ["P1150", "P1190"]}, {"id": "P1170", "text": ["The squirrel cage rotor requires no commutator or brush assembly. This reduces cost, maintenance and sparking."], "jumps": ["P1150", "P1180"]}, {"id": "P1160", "text": ["The squirrel cage rotor is simpler and less expensive to manufacture than the DC rotor."], "jumps": ["P1150", "P1170"]}, {"id": "P1150", "text": ["AC rotors (inductor type) have a distinct appearance and are often referred to as squirrel cage rotors."], "jumps": ["P1140" let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
