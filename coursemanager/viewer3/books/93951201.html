 RELAYS and METERS...................."], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Magnetism is a force that attracts or repels certain types of metal objects.ssssssss"], "jumps": []}, {"id": "P1030", "text": ["Two common permanent magnets are::........................."], "jumps": []}, {"id": "P1035", "text": ["PERMANENT MAGNET - A magnet that retains its ability to attract metal objects indefinitely is called a permanent magnet."], "jumps": []}, {"id": "P1040", "text": ["To understand magnetism we need to look at the characteristics of a magnet. Let's use the bar magnet as an example. ."], "jumps": []}, {"id": "P1050", "text": ["Each end of the bar magnet has a pole. One end is the north pole and the other end is the south pole.............."], "jumps": []}, {"id": "P1060", "text": ["All magnets have lines of force called flux lines. Note, the flux lines leave the north pole and enter the south pole of the magnet."], "jumps": []}, {"id": "P1070", "text": ["The flux lines form a magnetic field around the magnet."], "jumps": []}, {"id": "P1075", "text": ["MAGNETIC FIELD - A magnetic field is the region around a magnet in which the effects of magnetic forces are observable. Metal filings on a piece of paper will align when a magnet is placed under the paper.", "Metal Filings aligned to magnetic field."], "jumps": []}, {"id": "P1080", "text": ["The more flux lines a magnet has, the stronger the magnetic field."], "jumps": []}, {"id": "P1090", "text": ["The stronger the magnetic field, the more work or attraction the magnet can perform."], "jumps": []}, {"id": "P1100", "text": ["The two rules of magnetism are:............................"], "jumps": []}, {"id": "P1110", "text": ["These two rules explain how magnets and magnetic force are used to perform work............"], "jumps": []}, {"id": "P1120", "text": ["For example, if the north and south poles of two magnets are brought together, a magnetic attraction occurs."], "jumps": []}, {"id": "P1130", "text": ["The flux lines of each magnet combine causing the magnets to come together and become one magnet."], "jumps": []}, {"id": "P1131", "text": [], "jumps": []}, {"id": "P1150", "text": ["If the south poles of two magnets are brought together, the flux lines of the two magnets will repel each other."], "jumps": []}, {"id": "P1152", "text": [], "jumps": []}, {"id": "P1170", "text": ["What happens to other materials when they are placed in a magnetic field? Do they become magnets, too???????????"], "jumps": []}, {"id": "P1180", "text": ["All materials fit into two categories:..................."], "jumps": []}, {"id": "P1190", "text": ["Non-magnetic material is not affected by flux lines or magnetic force. Examples are:"], "jumps": []}, {"id": "P1200", "text": ["Placing a magnet close to a piece of glass will not attract or repel the glass."], "jumps": []}, {"id": "P1210", "text": ["Magnetic material is affected by flux lines and magnetic force. Examples are:"], "jumps": []}, {"id": "P1220", "text": ["Placing a magnet close to a piece of steel causes the steel to be attracted to the magnet.tttttttttttt"], "jumps": []}, {"id": "P1230", "text": ["The reason magnetic materials are effected is because they are permeable..............."], "jumps": []}, {"id": "P1232", "text": ["The reason magnetic materials are effected is because they are permeable..............."], "jumps": []}, {"id": "P1235", "text": ["PERMEABILITY - Permeability is a term used to describe the willingness of a material to become magnetized. Being permeable means that the flux lines can penetrate the material."], "jumps": []}, {"id": "P1240", "text": ["Being permeable causes the magnetic material to become a temporary magnet. The material's ability to hold the magnetic field is determined by its retentivity.............................."], "jumps": []}, {"id": "P1245", "text": ["RETENTIVITY - Retentivity is the ability of a material to retain its magnetism after the magnetizing force has been removed."], "jumps": []}, {"id": "P1250", "text": ["Magnets and magnetic material working together is the reason many electronic devices work."], "jumps": []}, {"id": "P1260", "text": ["In the next objective we will discuss how magnets are used as electromagnets."], "jumps": []}, {"id": "P1300", "text": ["Label the north and south poles of this magnet............."], "jumps": []}, {"id": "P1301", "text": [], "jumps": []}, {"id": "P1302", "text": ["Remember, flux lines leave the north pole and enter the south pole..."], "jumps": []}, {"id": "P1307", "text": ["You should have entered North for the left side and South for the right."], "jumps": []}, {"id": "P1310", "text": ["Which set of magnets will attract each other?............."], "jumps": []}, {"id": "P1311", "text": [], "jumps": []}, {"id": "P1312", "text": ["Remember, the two rules of magnetism are: * unlike poles attract * like poles repel"], "jumps": []}, {"id": "P1320", "text": ["Select the non-magnetic material..........................."], "jumps": []}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1322", "text": ["You selected the magnetic material. Magnetic material will be affected by flux lines and magnetic force. Non-magnetic material will not be affected."], "jumps": []}, {"id": "P1900", "text": [], "jumps": []}, {"id": "P1910", "text": ["This completes the information on MAGNETISM. ITLE........"], "jumps": []}, {"id": "P1920", "text": ["1. Magnetism is a force that attracts or repels certain types of metal objects. metal objects....."], "jumps": []}, {"id": "P1930", "text": ["2. All magnets have a north and south pole. ............."], "jumps": []}, {"id": "P1940", "text": ["3. Flux lines form a magnetic field around magnets, moving from the north pole to the south pole outside the magnet............."], "jumps": []}, {"id": "P1950", "text": ["4. The two rules of magnetism are: ......................."], "jumps": []}, {"id": "P1960", "text": ["5. Non-Magnetic material is neither attracted nor repelled by a magnet."], "jumps": []}, {"id": "P1970", "text": ["6. Magnetic material is affected by the flux lines of a magnet and takes on the characteristics of a magnet......."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu. e Objective Menu. he Objective Menu."], "jumps": []}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2030", "text": ["Electromagnetism is a man-made form of magnetism.........."], "jumps": []}, {"id": "P2031", "text": [], "jumps": []}, {"id": "P2040", "text": ["Electromagnets are made by applying electricity to magnetic materials..........."], "jumps": []}, {"id": "P2041", "text": [], "jumps": []}, {"id": "P2050", "text": ["The principles of electromagnetism are used in almost every electronic circuit you will work with."], "jumps": []}, {"id": "P2060", "text": ["Let's look at the basic characteristics of electromagnets.w"], "jumps": ["P2070"]}, {"id": "P2070", "text": ["When electric current passes through a conductor, a small circular magnetic field is generated called magnetomotive force."], "jumps": ["P2080"]}, {"id": "P2080", "text": ["The magnetic force is strongest close to the conductor."], "jumps": ["P2070"]}, {"id": "P2090", "text": ["Which magnet's flux lines are moving in the right direction?"], "jumps": ["P2080"]}, {"id": "P2091", "text": [], "jumps": []}, {"id": "P2092", "text": ["Flux lines move from north to south outside the magnet. This magnet's flux lines are moving from the south pole to the north pole."], "jumps": []}, {"id": "P2093", "text": ["This magnet's flux lines are not moving correctly. Remember, a magnet's flux lines will leave one pole and enter the opposite pole."], "jumps": []}, {"id": "P2100", "text": ["Inside a magnet, flux lines move from S to N."], "jumps": ["P2110"]}, {"id": "P2110", "text": ["In electromagnets, the Left Hand Rule is used to determine the direction of flux lines.", "In electromagnets, the Right Hand Rule is used to determine the direction of flux lines."], "jumps": ["P2120", "P2115"]}, {"id": "P2115", "text": ["RIGHT HAND RULE - Place the right hand so that the thumb points in the direction of current. The curled fingers point in the direction of the flux lines.", "LEFT HAND RULE - Place the left hand so that the thumb points in the direction of current flow. The curled fingers point in the direction of the flux lines."], "jumps": []}, {"id": "P2120", "text": ["A single piece of straight wire will not create a very strong magnetic field.........."], "jumps": ["P2110"]}, {"id": "P2130", "text": ["A wire containing many loops creates a strong magnetic field."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["The closer the loops are to each other the stronger the magnetic field becomes."], "jumps": ["P2150"]}, {"id": "P2150", "text": ["If the wire is wrapped around a core of steel or other magnetic material, the strongest magnetic field is developed. ."], "jumps": ["P2140"]}, {"id": "P2151", "text": [], "jumps": ["P2150"]}, {"id": "P2160", "text": ["The electromagnet's strength is determined by the construction of the magnet and by the amount of current passing through the conductor.............................."], "jumps": ["P2150"]}, {"id": "P2161", "text": [], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["Which electromagnet will produce the largest magnetic field??"], "jumps": ["P2150"]}, {"id": "P2171", "text": [], "jumps": []}, {"id": "P2172", "text": ["Remember, an electromagnet with more loops and a greater current will produce a larger magnetic field."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on ELECTROMAGNETISM........."], "jumps": ["P2170"]}, {"id": "P2920", "text": ["1. Electromagnetism is a man-made magnetism using electricity."], "jumps": []}, {"id": "P2921", "text": [], "jumps": ["P2930"]}, {"id": "P2930", "text": ["2. Current passing through a conductor creates a magnetomotive force or magnetic field........."], "jumps": ["P2940"]}, {"id": "P2940", "text": ["3. The right hand rule is used to determine direction of flux lines.", "3. The left hand rule is used to determine direction of flux lines.."], "jumps": ["P2950", "P2930"]}, {"id": "P2950", "text": ["4. Placing loops in the conductor or wrapping the conductor around a core increases the magnetic field......"], "jumps": ["P2940"]}, {"id": "P2960", "text": ["5. Magnetic field strength is determined by: - the number of coil windings. - the distance between windings. - the amount of current. - composition of the core."], "jumps": ["P2950"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": []}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3030", "text": ["Electromagnets are useful because their magnetic properties can be turned on and off."], "jumps": ["P3040"]}, {"id": "P3040", "text": ["Let's look at three uses for electromagnets in electronics:"], "jumps": []}, {"id": "P3050", "text": ["The relay uses an electromagnet to attract the metal arm of a switch.........."], "jumps": ["P3040"]}, {"id": "P3060", "text": ["If the switch is normally open, energizing the relay closes the switch........."], "jumps": []}, {"id": "P3070", "text": ["If the switch is normally closed, energizing the relay opens the switch."], "jumps": []}, {"id": "P3071", "text": [], "jumps": ["P3080"]}, {"id": "P3080", "text": ["In this circuit, when S1 closes, the relay's electromagnet energizes. The magnetic field attracts the arm of S2."], "jumps": ["P3085"]}, {"id": "P3081", "text": ["In this circuit, when S1 closes, the relay's electromagnet energizes. The magnetic field attracts the arm of S2."], "jumps": []}, {"id": "P3085", "text": ["ENERGIZED - An electromagnet is energized when current flows through the coil and a magnetic field is developed around it.........................................................."], "jumps": []}, {"id": "P3090", "text": ["When S2 closes, the circuit containing the light is complete and the bulb illuminates."], "jumps": ["P3080"]}, {"id": "P3100", "text": ["When S1 is opened, the electromagnet de-energizes. This causes S2 to open.........."], "jumps": ["P3080"]}, {"id": "P3110", "text": ["When S2 opens, the circuit containing the light is broken, and the light turns off."], "jumps": ["P3080"]}, {"id": "P3120", "text": ["If the relay is energized which circuit is operating correctly?"], "jumps": ["P3080", "P3122"]}, {"id": "P3121", "text": [], "jumps": []}, {"id": "P3122", "text": ["If the switch is normally closed, energizing the relay causes the switch to open. The light should go out........"], "jumps": []}, {"id": "P3130", "text": ["Another use for electromagnets is the electromagnetic circuit breaker."], "jumps": ["P3140"]}, {"id": "P3140", "text": ["Note, when S2 is closed, current will flow through CB1. ."], "jumps": ["P3130"]}, {"id": "P3150", "text": ["When the circuit operates normally only a very small magnetic field develops in the circuit breaker."], "jumps": ["P3140"]}, {"id": "P3160", "text": ["The magnetic field is not strong enough to attract the metal arm."], "jumps": ["P3140"]}, {"id": "P3170", "text": ["If the circuit has a problem and current increases, the magnetic field of CB1 increases."], "jumps": ["P3140"]}, {"id": "P3180", "text": ["If CB1 develops a large enough magnetic field, the arm will be attracted, opening the circuit."], "jumps": ["P3140"]}, {"id": "P3190", "text": ["The circuit breaker is used to protect the circuit from excessive amounts of current.", "The circuit breaker is used to protect the circuit from excessive amounts of current flow.", "The circuit breaker is used to protect the circuit from excessive amounts of current.flow. amounts of current flow."], "jumps": ["P3200", "P3140"]}, {"id": "P3200", "text": ["Select the circuit breaker in this circuit. ..........."], "jumps": ["P3140", "P3204", "P3202" let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
