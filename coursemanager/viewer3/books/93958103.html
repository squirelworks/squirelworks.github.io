const book = {"title": "93958103", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: MICROWAVE TRANSMITTERSf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe the operation of typical microwave transmitters. w Describe the operation of the transmitter in the Nida Model 330 Microwave Trainer. e Trainer. Trainer.", "w Observe and trace signals through a basic microwave transmitter.. Trainer.."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 440 Function Generator XXXXXnt"], "jumps": []}, {"id": "P301", "text": [], "jumps": []}, {"id": "P330", "text": [], "jumps": ["PPNLYUNA"]}, {"id": "P331", "text": [], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about the circuits that make up a microwave transmitter."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["The purpose of a microwave communication system is to: \n\nProcess, Transmit, Receive and Interface Information to the user.", "The purpose of a microwave communication system is to: Process, Transmit, Receive and Interface Information to the user."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["The transmitter section contains: Information Processor, Oscillator & Modulator, Transmitter, Waveguide System and Antenna System.", "The transmitter section contains: Information Processor, Oscillator & Modulator, Transmitter, Waveguide System and Antenna System................"], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["These sections are common to all microwave transmitters; however, the circuits used can be different."], "jumps": ["P440", "P410"]}, {"id": "P440", "text": ["Let's begin the lesson on MICROWAVE TRANSMITTERS.........................."], "jumps": ["P410"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["This is a block diagram of a typical microwave transmitter."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["At first glance, it may appear that it does not contain all the necessary stages that a transmitter must have."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["But it does!  Let's cover each stage starting with the information processor.  \n*  Information Processor        *  Oscillator/Modulator\n*  Transmitter                             *  Waveguide System\n*  Antenna System", "But it does! Let's cover each stage starting with the information processor. * Information Processor * Oscillator/Modulator * Transmitter * Waveguide System * Antenna System"], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The information processor makes the information suitable for transmission."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["The audio amplifier, audio oscillator and the external input make up the information processor in this basic system."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["Either an external signal (any type of signal, multiplexed or not) or the output of the audio oscillator (used if an external signal     is not available) is routed to the audio amplifier.", "Either an external signal (any type of signal, multiplexed or not) or the output of the audio oscillator (used if an external signal is not available) is routed to the audio amplifier."], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["The audio amplifier boosts the signal and sends it to the DRO as a modulation signal."], "jumps": ["P1090", "P1020"]}, {"id": "P1090", "text": ["The oscillator/modulator is contained on the waveguide system.\n*  Information Processor        *  Oscillator/Modulator\n*  Transmitter                             *  Waveguide System\n*  Antenna System", "The oscillator/modulator is contained on the waveguide system. * Information Processor * Oscillator/Modulator * Transmitter * Waveguide System * Antenna System"], "jumps": ["P1100", "P1020"]}, {"id": "P1100", "text": ["The oscillator is located in the DRO and generates the microwave frequency."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["Power for the DRO is applied from the power supply."], "jumps": ["P1120", "P1090"]}, {"id": "P1120", "text": ["The modulator is also located in the DRO and modulates the carrier frequency with the signal output from the audio amplifier."], "jumps": ["P1130", "P1090"]}, {"id": "P1130", "text": ["The entire diagram is normally considered the transmitter.\n*  Information Processor        *  Oscillator/Modulator\n*  Transmitter                             *  Waveguide System\n*  Antenna System", "The entire diagram is normally considered the transmitter. * Information Processor * Oscillator/Modulator * Transmitter * Waveguide System * Antenna System"], "jumps": ["P1140", "P1090"]}, {"id": "P1140", "text": ["However, it is the DRO that funnels the modulated microwave frequency down the waveguide to the antenna."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["The waveguide system receives the modulated RF energy from the DRO and passes it to the antenna.       \n*  Information Processor        *  Oscillator/Modulator\n*  Transmitter                             *  Waveguide System\n*  Antenna System", "The waveguide system receives the modulated RF energy from the DRO and passes it to the antenna. * Information Processor * Oscillator/Modulator * Transmitter * Waveguide System * Antenna System"], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["Waveguides are used as conductors when the RF is in the microwave range due to high losses of wire conductors."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["The antenna system directs the microwave energy to the receiver.\n*  Information Processor        *  Oscillator/Modulator\n*  Transmitter                             *  Waveguide System\n*  Antenna System", "The antenna system directs the microwave energy to the receiver. * Information Processor * Oscillator/Modulator * Transmitter * Waveguide System * Antenna System"], "jumps": ["P1180", "P1150"]}, {"id": "P1180", "text": ["Where is the modulator for the transmitter located?", "Where is the modulator for the transmitter located?........"], "jumps": []}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1182", "text": ["The modulator is part of a component that is mounted on the waveguide.  It is not located in the waveguide.", "The modulator is part of a component that is mounted on the waveguide. It is not located in the waveguide.."], "jumps": []}, {"id": "P1183", "text": ["The power supply applies power to the DRO.  The modulator is not in the power supply.", "The power supply applies power to the DRO. The modulator is not in the power supply."], "jumps": []}, {"id": "P1190", "text": ["Which block supplies the modulating signal?", "Which block supplies the modulating signal?................"], "jumps": ["P1180"]}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1192", "text": ["The audio oscillator is used to generate a signal if an external input is not available.  The audio oscillator does not modulate the carrier signal directly.", "The audio oscillator is used to generate a signal if an external input is not available. The audio oscillator does not modulate the carrier signal directly...."], "jumps": []}, {"id": "P1193", "text": ["The power supply supplies power to the DRO.  It does not apply the modulating signal.", "The power supply supplies power to the DRO. It does not apply the modulating signal.."], "jumps": []}, {"id": "P1200", "text": ["The schematic shown illustrates typical electronic circuits used in a microwave transmitter."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["This circuit is located on PC130-307 in the Nida Model 330 Microwave Trainer."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["The power supply receives \u00b115 VDC,  generates \u00b16 VDC and a variable positive 8 to 12 VDC.", "6 VDC and a variable positive 8 to 12 VDC."], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["IC5 is a variable regulator that produces 8 to 12 VDC for the DRO. R19 controls the output voltage."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["TP5 is used for monitoring the DRO voltage and J2 is the PC card connector."], "jumps": ["P1250", "P1220"]}, {"id": "P1250", "text": ["CR3 and CR4 are zener diode regulators that produce the 6 VDC used to supply power to the audio amplifier."], "jumps": ["P1260", "P1220"]}, {"id": "P1260", "text": ["Test points are provided to monitor the 6 VDC."], "jumps": ["P1270", "P1220"]}, {"id": "P1270", "text": ["The 15 VDC input power is also used as power to the audio oscillator.  Test points for monitoring are provided.", "The 15 VDC input power is also used as power to the audio oscillator. Test points for monitoring are provided."], "jumps": ["P1280", "P1220"]}, {"id": "P1280", "text": ["The audio oscillator circuit is formed by IC1, IC2 and IC3.", "6 5 4 7 2 IC1 8 3 10 11 122"], "jumps": ["P1290", "P1220"]}, {"id": "P1290", "text": ["IC1 produces two outputs, a sine wave and a triangular wave at \n1 kHz.  Power for IC1 is +15 VDC.", "IC1 produces two outputs, a sine wave and a triangular wave at 1 kHz. Power for IC1 is +15 VDC."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["IC2 and IC3 are operational amplifiers for the two outputs of IC1. Power for IC1 and IC2 is \u00b115 VDC.", "IC2 and IC3 are operational amplifiers for the two outputs of IC1. Power for IC1 and IC2 is"], "jumps": ["P1310", "P1280"]}, {"id": "P1310", "text": ["Output test points are provided using the waveform symbol for identification."], "jumps": ["P1320", "P1280"]}, {"id": "P1320", "text": ["IC4 is an audio amplifier with an output gain control and DC offset control.  Power for IC4 is \u00b16 VDC.", "IC4 is an audio amplifier with an output gain control and DC offset control. Power for IC4 is"], "jumps": ["P1330", "P1280"]}, {"id": "P1330", "text": ["The input to the audio amplifier is either the external input or the sine wave output of IC2.  S1 selects the input.", "The input to the audio amplifier is either the external input or the sine wave output of IC2. S1 selects the input."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["Notice that S1 is also used on the output of IC4.  Selection is either the output of IC4 or the triangular wave.", "Notice that S1 is also used on the output of IC4. Selection is either the output of IC4 or the triangular wave."], "jumps": ["P1350", "P1320"]}, {"id": "P1350", "text": ["The PC card output is routed to the DRO as a modulation signal via J1.  TP4 is used to monitor the output signal.", "The PC card output is routed to the DRO as a modulation signal via J1. TP4 is used to monitor the output signal."], "jumps": ["P1360", "P1320"]}, {"id": "P1360", "text": ["The external input signal is limited by CR1 and CR2, and filtered by C3 and C4.  This forms the low pass filter.", "The external input signal is limited by CR1 and CR2, and filtered by C3 and C4. This forms the low pass filter."], "jumps": ["P1370", "P1320"]}, {"id": "P1370", "text": ["The low pass filter allows frequencies between 50 Hz and 6 MHz to pass.  The external input can be audio, video, digital or a combination of all three.", "The low pass filter allows frequencies between 50 Hz and 6 MHz to pass. The external input can be audio, video, digital or a combination of all three."], "jumps": ["P1375", "P1360"]}, {"id": "P1375", "text": ["Notice that C3 and C4 block frequencies less than 50 Hz, also performing as coupling capacitors in block DC current flow."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["Remember, different microwave transmitters may use different circuits.  This is a typical circuit.", "Remember, different microwave transmitters may use different circuits. This is a typical circuit."], "jumps": ["P1390", "P1360"]}, {"id": "P1390", "text": ["What are the two internally generated signals available at the output of the audio oscillator circuit?"], "jumps": ["P1380"]}, {"id": "P1391", "text": [], "jumps": []}, {"id": "P1392", "text": ["The oscillator, IC1, does not generate a squarewave.", "The oscillator, IC1, does not generate a squarewave........"], "jumps": []}, {"id": "P1400", "text": ["What are the range of voltages available for the DRO?", "What are the range of voltages available for the DRO?......"], "jumps": ["P1390"]}, {"id": "P1401", "text": [], "jumps": []}, {"id": "P1402", "text": ["\u00b115 VDC is used to power the audio oscillator circuitry.", "15 VDC is used to power the audio oscillator circuitry...."], "jumps": []}, {"id": "P1403", "text": ["\u00b16 VDC is used to power the audio generator circuitry.", "6 VDC is used to power the audio generator circuitry......"], "jumps": []}, {"id": "P1410", "text": ["What frequencies does the low pass filter block?", "What frequencies does the low pass filter block?..........."], "jumps": []}, {"id": "P1411", "text": [], "jumps": []}, {"id": "P1412", "text": ["Blocking signals between 50 Hz and 6 MHz would block the entire audio and video frequency range."], "jumps": []}, {"id": "P1413", "text": ["Note that there is a filter on the external input line.  Signals will be filtered.", "Note that there is a filter on the external input line. Signals will be filtered."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on MICROWAVE TRANSMITTERS.", "This completes the information on MICROWAVE TRANSMITTERS..."], "jumps": ["P1001", "P1410"]}, {"id": "P1920", "text": ["1.  Microwave communications systems: Process, Transmit,               Receive and Interface Information to the user.", "1. Microwave communications systems: Process, Transmit, Receive and Interface Information to the user.", "Block Diagram of Basic Microwave of a Communication System"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  A basic microwave transmitter processes information,                     generates the carrier frequency, modulates the carrier                      frequency and transmits RF microwave signals to a receiver.", "2. A basic microwave transmitter processes information, generates the carrier frequency, modulates the carrier frequency and transmits RF microwave signals to a receiver."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The waveguide system includes the DRO, waveguide and              antenna.", "3. The waveguide system includes the DRO, waveguide and antenna."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  The electronic circuitry includes a power supply and signal            processor circuits.", "4. The electronic circuitry includes a power supply and signal processor circuits."], "jumps": ["P1960", "P1930"]}, {"id": "P1960", "text": ["5.  The Nida microwave circuitry is contained on one PC card,            PC130-307.", "5. The Nida microwave circuitry is contained on one PC card, PC130-307."], "jumps": ["P1970", "P1930"]}, {"id": "P1970", "text": ["6.  The audio oscillator generates internal signal for modulating         the carrier frequency.", "6. The audio oscillator generates internal signal for modulating the carrier frequency.", "6 5 4 7 2 IC1 8 3 10 11 122"], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7.  The audio amplifier boosts the signal before being sent to the       DRO.", "7. The audio amplifier boosts the signal before being sent to the DRO.."], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["8.  The power supply applies \u00b115 VDC and \u00b16 VDC to IC's.  It also      applies 8 to 12 VDC to the DRO.", "6 VDC to IC's. It also applies 8 to 12 VDC to the DRO."], "jumps": ["P1999", "P1980"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1990"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["The purpose of this experiment is to observe the operation of a typical microwave transmitter."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["Pick up the PC card PC130-307.  It contains the electronic circuits for a microwave transmitter.", "Pick up the PC card PC130-307. It contains the electronic circuits for a microwave transmitter."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["Compare the card with the schematic shown."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["The circuit contains one switch and three trim potentiometers. Locate them on the card."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["Locate the audio oscillator, IC1, IC2 and IC3."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["Locate the audio amplifier, IC4."], "jumps": ["P2090", "P2040"]}, {"id": "P2090", "text": ["Locate the IC voltage regulator, IC5 (just above the DRO VOLT ADJ potentiometer)."], "jumps": ["P2100", "P2040"]}, {"id": "P2100", "text": ["Familiarize yourself with the test points on the card.  Now, let's start the experiment.", "Familiarize yourself with the test points on the card. Now, let's start the experiment."], "jumps": ["P2105", "P2040"]}, {"id": "P2105", "text": ["You have previously selected the dual trainer setup. You must exit and restart this lesson.", "Before we start the experiment, please choose the trainer configuration you will be using. If you are unsure, ask your instructor. Model 330 microwave trainer are given in HELP frames. Also, the Nida Model 130A Test Console's controls and settings are given in HELP frames."], "jumps": ["P2040"]}, {"id": "P2110", "text": ["1.  Set the Test Console to its Initial Control Settings.", "1. Set the Test Console to its Initial Control Settings. te one console as the transmitter console and the other the receiver console. DO NOT connect the computer's RS-232 cable to either Test Console at this time."], "jumps": ["P2100"]}, {"id": "P2120", "text": ["2.  Assemble the Nida Model 330 Microwave Trainer if not                     previously assembled.", "2. Assemble the Nida Model 330 Microwave Trainer if not previously assembled."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["3.  Install PC130-307 into PC1 position.\n4.  Install PC130-308 into PC3 position.", "3. Install PC130-307 into PC1 position. 4. Install PC130-308 into PC3 position..f the Test Console.of the Test Console..t previously configured."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["5.  Set the Negative Supply Voltage to 15.\n6.  Set the Positive Supply Voltage to 15.\n     The Test Console's Voltage Meter should indicate 15 volts.", "5. Set the Negative Supply Voltage to 15. 6. Set the Positive Supply Voltage to 15. The Test Console's Voltage Meter should indicate 15 volts.lignment - Interface connection"], "jumps": ["P2130"]}, {"id": "P2145", "text": ["7.  Set PC1 and PC3 DC power ON.", "7. Set PC1 and PC3 DC power ON. t the microwave trainer to the PC cards and make circuit alignments if required. Select one of the options below if you need alignment procedure instructions ."], "jumps": ["P2140"]}, {"id": "P2147", "text": ["8.  Connect the microwave trainer to the PC cards and make \n     circuit alignments if required.  Select one of  the options below \n     if you need alignment procedure instructions .", "8. Connect the microwave trainer to the PC cards and make circuit alignments if required. Select one of the options below if you need alignment procedure instructions . ocedure instructions ."], "jumps": ["P2145"]}, {"id": "P2150", "text": ["The experiment is now set up.  Let's observe basic microwave transmitter operation.", "The experiment is now set up. Let's observe basic microwave transmitter operation."], "jumps": ["P2155", "P2147"]}, {"id": "P2155", "text": ["1. Set the oscilloscope controls as follows: The Horizontal sweep of each channel should be adjusted to view CH1 signal on the upper portion of the grid and CH2 signal on the lower portion. Sweep Mode - Auto Volts/Div CH2 - 1 AC Slope - + Vert Mode - Dual Coupling - AC Sweep Var - Fully CW Source - CH1 Time/Div - .5 msec", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "Volts/Div CH1 - 1 AC Sweep Mode - Auto Volts/Div CH2 - 1 AC Slope - + Vert Mode - Dual Coupling - AC Sweep Var - Fully CW Source - CH1 Time/Div - .5 mSec M input jackkkkkkkkkkkjackkkkkkkkkkkkkk"], "jumps": ["P2160", "P2150"]}, {"id": "P2160", "text": ["2.  Place the three position lever switch on PC130-307 to the                SINE WAVE position.", "2. Place the three position lever switch on PC130-307 to the SINE WAVE position."], "jumps": ["P2162", "P2155"]}, {"id": "P2162", "text": ["3.  Connect the oscilloscope CH1 to the Output TP on PC130-307.\n4.  Connect CH2 to the Output TP on PC130-308.                                     Compare the two signals.  They should be approximately the         same.", "3. Connect the oscilloscope CH1 to the Output TP on PC130-307. 4. Connect CH2 to the Output TP on PC130-308. Compare the two signals. They should be approximately the same."], "jumps": ["P2170", "P2160"]}, {"id": "P2170", "text": ["5.  Trace the sine wave signal from the output of IC1 (oscillator            IC, pin 2) to the Op Amp IC2 (input, pin 3; output TP).", "5. Trace the sine wave signal from the output of IC1 (oscillator IC, pin 2) to the Op Amp IC2 (input, pin 3; output TP).", "6 5 4 7 2 IC1 8 3 10 11 122"], "jumps": ["P2180", "P2162"]}, {"id": "P2180", "text": ["6.  Continue tracing the sine wave signal to the audio amplifier            IC4 (input, pin 8; output, pin 5) to TP4.", "6. Continue tracing the sine wave signal to the audio amplifier IC4 (input, pin 8; output, pin 5) to TP4."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["When the three position lever switch is in the SINE WAVE position, a 1 kHz sine wave signal is sent to the DRO as a modulation signal."], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["7.  Place the three position lever switch on PC130-307 to the                TRIANGULAR WAVE position.", "7. Place the three position lever switch on PC130-307 to the TRIANGULAR WAVE position."], "jumps": ["P2210", "P2180"]}, {"id": "P2210", "text": ["8.  Use an oscilloscope and trace the triangular signal from the            audio oscillator (IC1, pin 3) to the output test point.", "8. Use an oscilloscope and trace the triangular signal from the audio oscillator (IC1, pin 3) to the output test point."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["When the three position lever switch is in the TRIANGULAR WAVE position, a 1 kHz triangular wave is sent from IC3 to the DRO, bypassing the audio amplifier."], "jumps": ["P2230", "P2200"]}, {"id": "P2230", "text": ["9.  Place the three position lever switch on PC130-307 to the IN           position.\n     Do you see a signal at the receiver?", "9. Place the three position lever switch on PC130-307 to the IN position. Do you see a signal at the receiver?"], "jumps": ["P2200"]}, {"id": "P2231", "text": [], "jumps": []}, {"id": "P2232", "text": ["You should not see a signal.  There is no external modulation signal being sent to the DRO.", "You should not see a signal. There is no external modulation signal being sent to the DRO.."], "jumps": []}, {"id": "P2240", "text": ["10.  Connect the function generator setup for a 2 kHz 1 Vpp sine           wave output to the PC1 input connector.  Use a BNC to BNC          cable.\n        Do you see a signal at the receiver?", "10. Connect the function generator setup for a 2 kHz 1 Vpp sine wave output to the PC1 input connector. Use a BNC to BNC cable. Do you see a signal at the receiver?"], "jumps": ["P2230"]}, {"id": "P2241", "text": [], "jumps": []}, {"id": "P2242", "text": ["You should see a signal.  Check the operation of the function generator and ensure that it is connected to the IN test point on    PC130-307.", "You should see a signal. Check the operation of the function generator and ensure that it is connected to the IN test point on PC130-307.."], "jumps": []}, {"id": "P2250", "text": ["11.  Using an oscilloscope, trace the function generator's input             from the IN test point to the output test point .", "11. Using an oscilloscope, trace the function generator's input from the IN test point to the output test point ."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["12.  Place and leave the CH1 probe on the output.\n13.  Verify the action of the low pass filter by observing the                     output signal while placing the function generator's                          frequency below and above the filter cutoff points (below\n        50 Hz, above 6 MHz).", "12. Place and leave the CH1 probe on the output. 13. Verify the action of the low pass filter by observing the output signal while placing the function generator's frequency below and above the filter cutoff points (below 50 Hz, above 6 MHz)."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["14.  Set the function generator's frequency back to 2 kHz.\n15.  Vary the audio amplifier's offset and output gain                                 potentiometers and observe the effects on the output signal.", "14. Set the function generator's frequency back to 2 kHz. 15. Vary the audio amplifier's offset and output gain potentiometers and observe the effects on the output signal."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["16.  Place the three position lever switch to the SINE WAVE                   position.\n17.  Vary the audio amplifier's offset and output gain                                potentiometers and observe the effects on the output signal.", "16. Place the three position lever switch to the SINE WAVE position. 17. Vary the audio amplifier's offset and output gain potentiometers and observe the effects on the output signal."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["18.  Place the three position lever switch to the TRIANGULAR               position.\n19.  Vary the audio amplifier's offset and output gain                                potentiometers and observe the effects on the output signal.", "18. Place the three position lever switch to the TRIANGULAR position. 19. Vary the audio amplifier's offset and output gain potentiometers and observe the effects on the output signal."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["Did the offset and output gain potentiometers affect the output signal for a triangular wave?"], "jumps": ["P2290"]}, {"id": "P2301", "text": [], "jumps": []}, {"id": "P2302", "text": ["The potentiometer for the offset and output gain should not have affected the output signal."], "jumps": []}, {"id": "P2310", "text": ["Remember, the output of IC3, triangular wave, bypasses the audio amplifier and is routed directly to the DRO when the three position lever switch is in the TRIANGULAR position."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["One of the three possible signals is routed by the action of the three position lever switch to the DRO as a modulation signal."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["The PC card's output signal frequency modulates the 10.5 GHz carrier signal generated in the DRO and is funnelled down the waveguide to the antenna."], "jumps": ["P2350", "P2310"]}, {"id": "P2350", "text": ["The only other input to the DRO is its operating power developed by the power supply on the PC130-307 card."], "jumps": ["P2360", "P2310"]}, {"id": "P2360", "text": ["20.  Adjust the DRO input voltage by rotating R19 on PC130-307.          Observe the signal on the receiver as you adjust R19.", "20. Adjust the DRO input voltage by rotating R19 on PC130-307. Observe the signal on the receiver as you adjust R19. R19."], "jumps": ["P2370", "P2310"]}, {"id": "P2370", "text": ["When R19 is rotated fully CW or fully CCW, the operation of the DRO is not up to specifications.  You may see a decrease in the received signal.", "When R19 is rotated fully CW or fully CCW, the operation of the DRO is not up to specifications. You may see a decrease in the received signal."], "jumps": ["P2360", "PA225"]}, {"id": "P2380", "text": ["1. Return the Test Console to its initial control settings."], "jumps": ["P2370"]}, {"id": "P2390", "text": ["2.  Set the Test Console Power to OFF.", "2. Set the Test Console Power to OFF........................."], "jumps": ["P2380"]}, {"id": "P2400", "text": ["3.  Carefully remove PC130-307 and PC130-308.  \n4.  Disassemble the Model 330 microwave trainer.\n5.  Return all equipment to its proper storage area.", "3. Carefully remove PC130-307 and PC130-308. 4. Dis let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
