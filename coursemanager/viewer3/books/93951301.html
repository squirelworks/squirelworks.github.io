": "P420", "text": ["Let's begin the lesson on OHM'S LAW.TLE..................................."], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1040", "text": ["Ohm's law states the relationship of three electrical quantities:"], "jumps": []}, {"id": "P1045", "text": ["VOLTAGE - Voltage is the electrical pressure of charge or force that makes charge flow in a circuit. As voltage increases, current also increases, provided resistance stays the same.", "VOLTAGE - Voltage is the electrical pressure or force that makes current flow in a circuit. As voltage increases, current also increases, provided resistance stays the same."], "jumps": []}, {"id": "P1046", "text": ["CURRENT - Current is the flow of electrons through an electrical circuit. Current flow increases as voltage increases and decreases as resistance increases.", "CURRENT - Current is the flow of electric charge through an electrical circuit. Current increases as voltage increases and decreases as resistance increases."], "jumps": []}, {"id": "P1047", "text": ["RESISTANCE - Resistance is the opposition to current flow. As resistance increases, current decreases, provided voltage stays the same.", "RESISTANCE - Resistance is the opposition to current. As resistance increases, current decreases, provided voltage stays the same."], "jumps": []}, {"id": "P1050", "text": ["Unit of Quantity Symbol Measure Symbol Voltage E or V Volt V Current I Ampere A Resistance R Ohm WWWWWWWWWW", "Each quantity is represented by a symbol. ................"], "jumps": []}, {"id": "P1060", "text": ["Unit of Quantity Symbol Measure Symbol Voltage E or V Volt V Current I Ampere A Resistance R Ohm WWWWWWWWWW/", "Each quantity is assigned a unit of measure."], "jumps": []}, {"id": "P1070", "text": ["Unit of Quantity Symbol Measure Symbol Voltage E or V Volt V Current I Ampere A Resistance R Ohm WWWWWWWWWWo", "Each unit of measure is also represented by a symbol."], "jumps": [ ok at the formulas one by one."], "jumps": []}, {"id": "P1180", "text": ["Current equals voltage divided by resistance. You can solve for current (I) if you know voltage (V) and resistance (R)."], "jumps": []}, {"id": "P1190", "text": ["Resistance equals voltage divided by current. You can solve for resistance (R) if you know voltage (V) and current (I).............."], "jumps": []}, {"id": "P1200", "text": ["Voltage equals current times resistance. You can solve for voltage (V) if you know current (I) and resistance (R)."], "jumps": []}, {"id": "P1210", "text": ["Remember, you can find any one unknown electrical quantity if you know the other two quantities.sssssssssss"], "jumps": []}, {"id": "P1220", "text": ["Which formula is used to find resistance? ................"], "jumps": []}, {"id": "P1221", "text": ["This formula solves for current and is used when you know the values for voltage and resistance."], "jumps": []}, {"id": "P1222", "text": [], "jumps": []}, {"id": "P1223", "text": ["This formula solves for voltage and is used when you know the values for current and resistance."], "jumps": []}, {"id": "P1230", "text": ["Which formula is used to find voltage?????????"], "jumps": []}, {"id": "P1231", "text": ["This formula solves for current and is used when you know the values for voltage and resistance.................."], "jumps": []}, {"id": "P1232", "text": ["This formula solves for resistance and is used when you know the values for voltage and current."], "jumps": []}, {"id": "P1233", "text": [], "jumps": []}, {"id": "P1240", "text": ["The Ohm's law formulas may be easier to remember if you use the VIR circle..........."], "jumps": ["P"]}, {"id": "P1241", "text": ["Notice, that the V is above I and R in the circle and V is always on top in the formulas..........."], "jumps": []}, {"id": "P1250", "text": ["Place your finger over I in the circle. Notice, I makes the left-hand side of the formula..................."], "jumps": ["P"]}, {"id": "P1260", "text of power."], "jumps": []}, {"id": "P2055", "text": ["Work = Power x Time I R I IIIII", "Work Power = Time I R I IIIII", "WORK - Work is done when a body moves in response to an applied force. Power is the time rate of doing work. You can see how power and work are related by these two formulas:"], "jumps": []}, {"id": "P2060", "text": ["You know that voltage is the force that makes current flow in a circuit and that resistance is the opposition to current flow. Something you might not know is that current passing through resistance generates heat.", "You know that voltage is the force that makes charge flow in a circuit and that resistance is the opposition to current. Something you might not know is that current passing through resistance generates heat. eat."], "jumps": []}, {"id": "P2070", "text": ["A light bulb and a resistor both provide resistance to current flow. They both also produce heat. Work is done in both cases. The light bulb's work produces light. The resistor's work produces heat. ,", "A light bulb and a resistor both provide resistance to current. They both also produce heat. Work is done in both cases. The light bulb's work produces light. The resistor's work produces heat. t."], "jumps": []}, {"id": "P2080", "text": ["Benefits from the light bulb's work are easy to see: light is useful to us. Benefits from the resistor's work are not easy to see since all a resistor produces is heat."], "jumps": []}, {"id": "P2081", "text": ["This dissipation, or giving off of heat, is what makes resistors useful."], "jumps": []}, {"id": "P2082", "text": ["This dissipation, or giving off of heat, is what makes resistors useful.............."], "jumps": []}, {"id": "P2085", "text": ["DISSIPATION - When current flows through a resistor, heat is developed. The amount of heat developed will depend on the size of resistor. The giving-off of heat is called dissipation.", "DISSIPATION - When current passes through a resistor, heat is developed. The amount of heat developed will depend on the size of resistor. The giving-off of heat is called dissipation."], "jumps": []}, {"id": "P2090", "text": ["You need to be able to determine how much power is used by a circuit. To do this, you need to know the unit of measure for power--the WATT.", "Unit of Quantity Symbol Measure Symbol Power P Watt W Voltage E or V Volt V Current I Ampere A Resistance R Ohm WWW"], "jumps": []}, {"id": "P2095", "text": ["POWER - Power is the amount of work performed by an electrical circuit. The unit of measure for power is the watt."], "jumps": []}, {"id": "P2096", "text": ["VOLTAGE - Voltage is the electrical pressure or force that makes current flow in a circuit. As voltage increases, current also increases, provided resistance stays the same.", "VOLTAGE - Voltage is the electrical pressure of charge or force that makes charge flow in a circuit. As voltage increases, current also increases, provided resistance stays the same."], "jumps": []}, {"id": "P2097", "text": ["CURRENT - Current is the flow of electrons through an electrical circuit. Current flow increases as voltage increases and decreases as resistance increases.", "CURRENT - Current is the flow of electric charge through an electrical circuit. Current increases as voltage increases and decreases as resistance increases."], "jumps": []}, {"id": "P2098", "text": ["RESISTANCE - Resistance is the opposition to current flow. As resistance increases, current decreases provided voltage stays the same.", "RESISTANCE - Resistance is the opposition to current. As resistance increases, current decreases, provided voltage stays the same."], "jumps": []}, {"id": "P2100", "text": ["As stated at the beginning of this objective, power is directly proportional to voltage. One watt of power is used when 1 volt moves 1 amp. This means power equals voltage times current."], "jumps": ["P2110"]}, {"id": "P2110", "text": ["Using the power formula P = VI, determine power in this circuit. line of text."], "jumps": []}, { let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
