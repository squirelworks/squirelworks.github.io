<script>
const book = {"title": "9395TD10", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: RADAR AUXILIARY SYSTEMS asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["1. Introduction to RADAR Dry Air Systems line item 2 here. item 2 here.e.e.", "2. Introduction to RADAR Cooling Systems line item 2 here. item 2 here.e.e.", "w Define terms, abbreviations and symbols used with RADAR Dry Air systems. w Describe the function, operational characteristics of RADAR Dry Air systems...ssss", "w Define terms, abbreviations and symbols used with RADAR Cooling systems. w Describe the function, operational characteristics of RADAR Cooling systems......."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["This lesson will help you understand RADAR Auxiliary Systems."], "jumps": []}, {"id": "P410", "text": ["For optimum operation of search or fire control RADAR sets, waveguides used in both high and low power areas of the RADAR require pressurization with dry air."], "jumps": []}, {"id": "P420", "text": ["Most electronic equipment generates sufficient heat to require some form of cooling to maintain normal operation."], "jumps": []}, {"id": "P430", "text": ["In liquid cooling heat exchangers, heat absorbed by the distilled water flowing through the electronic equipment is transferred to the primary cooling system."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["Let's begin the lesson on RADAR AUXILIARY SYSTEMS........................."], "jumps": ["P430"]}, {"id": "P900", "text": ["1. Introduction to RADAR Dry Air Systems", "2. Introduction to RADAR Cooling Systems"], "jumps": ["P440"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["For optimum operation of RADAR sets, waveguides used in both high power and low power areas of the RADAR require pressurization with dry air. Pressurized dry air is used to increase the dielectric constant inside the waveguide to prevent RF energy from arcing."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Arcing can damage the inside of a waveguide and allow damaging RF energy to reflect back to the transmitter tube. Dry air pressure used in high power waveguides is around 25 to 35 psi, while low power systems use 1 to 8 psi. Pressurized dry air prevents corrosion, contamination and the collection of moisture and oil..."], "jumps": []}, {"id": "P1040", "text": ["Several methods can be used to remove excess moisture from the air. One method is by freezing the air with refrigerant such as Freon. Adsorption is the second method to pass the air through a desiccant that adsorbs the moisture..."], "jumps": ["P1050", "P1030"]}, {"id": "P1045", "text": ["ADSORPTION - is a surface and a molecular phenomenon. Mobile gaseous and liquid atoms or molecules are attracted to the surface of any solid because of unbalanced forces existing at the surface...."], "jumps": []}, {"id": "P1050", "text": ["Some dry air systems use a combination of the two methods. The central dry air system is usually located in the main engineering space and consists of a low-pressure air compressor (100 psi) and two dehydrators..."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["There are three types of dehydrators. Type 1 dehydrators use refrigerant to remove the majority of the water and oil in both liquid and gaseous form from the air. Type 1, will always be the first of the two dehydrators used in the central dry air system..."], "jumps": ["P1070"]}, {"id": "P1070", "text": ["After leaving the Type 1 dehydrator, air is processed by either a Type 2 (desiccant) or Type 3 (combination) dehydrator to remove the last traces of moisture and becomes electronic dry air."], "jumps": []}, {"id": "P1080", "text": ["Electronic dry air is then sent to the individual equipment rooms throughout the ship, where equipment desiccant air dryers continue the drying process. As the air passes through the desiccant, moisture is adsorbed..."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["The drier the air becomes, the lower its dew point. Dew point is the temperature at which vapor begins to collect on a surface as liquid, at atmospheric pressure. Ideally, the dew point in the equipment waveguides, should be kept below - 40 degree Fahrenheit.."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["Air from the ship's compressor is often contaminated with water and oil in the form of vapor and liquid. Dehydrators must remove all contamination caused by the compression and lubrication of the air before it is sent to the electronic equipment..."], "jumps": ["P1110"]}, {"id": "P1110", "text": ["The operation of the air dryer is as follows: the inlet air is checked on the pressure gauge for a minimum air pressure (typically 80 psi). Inlet pressure that is too low inhibits the operation of the fluid separator...."], "jumps": []}, {"id": "P1120", "text": ["The fluid separator extracts most of the free liquids from the air-stream. However, some oil and water mist (extremely fine droplets), may remain."], "jumps": ["P1130", "PPPPPPPPPPPPP"]}, {"id": "P1130", "text": ["After the fluid separator, a telltale oil filter uses a combination mechanical and absorption process to remove the remaining oil. The oil and liquid are collected and automatically discharged under pressure via the dump traps."], "jumps": ["P1140", "P1120"]}, {"id": "P1135", "text": ["ABSORPTION - Process of soaking up a liquid ( the same way that a sponge absorbs liquid into its pores)ts pores)"], "jumps": []}, {"id": "P1140", "text": ["As the oil is absorbed, the material in the transparent absorbing column changes color from pink to deep red. The absorbing material should be discarded and replaced before it reaches the red line in the column..."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["At this point, liquid oil, liquid water, and some oil vapor, have been removed from the air. However, the air in most cases is still saturated with water vapor and contaminated with oil vapor."], "jumps": []}, {"id": "P1160", "text": ["The pressure regulator reduces the air pressure and holds it constant. The wet air passes through the purifier-dehydrator, which cleans and adsorbs the remaining moisture."], "jumps": []}, {"id": "P1170", "text": ["The dehydrator has two chambers through which the air passes alternately. While one chamber is removing vapor from the air, a small portion of the dried air is routed through the second chamber to purge it of all remaining vapors..."], "jumps": []}, {"id": "P1180", "text": ["The dust filter, removes any desiccant or other dust particles that might otherwise be carried along in the dry air-stream. A flow limiter is used at the outlet to prevent the electronic equipment from exceeding the capacity of the dryer..."], "jumps": []}, {"id": "P1190", "text": ["The operation of the desiccant air dryer can be bypassed by changing the position of the selector valve. With the selector valve in the position shown, all air is routed through the dryer."], "jumps": ["P1200"]}, {"id": "P1200", "text": ["The fluid separator and dump trap consists of two interconnected assemblies; the separator and the automatic trap. The unit contains a welded metal tank with input and output ports, a pressure gauge, a dump trap, and a sump drain port.."], "jumps": []}, {"id": "P1210", "text": ["Centrifugal forces within the tank extract droplets of liquid, which collect at the bottom of the tank and drain into the dump trap. A connected linkage float controls the liquid level in the dump trap by opening an closing a waste line valve to allow fluid to be periodically blown out..."], "jumps": []}, {"id": "P1220", "text": ["The telltale oil filter and dump trap were designed specifically to remove oil from compressed air and indicate by color the state of the oil removing material."], "jumps": []}, {"id": "P1230", "text": ["The oil absorbing element contained in a transparent tube, changes color from pink to dark red as it absorbs oil. Before the color change reaches a red line indicator, the filter element should be replaced..."], "jumps": []}, {"id": "P1240", "text": ["As in the liquid separator, a connected linkage float controls the liquid level in the dump trap by opening and closing a waste line valve to allow fluid to be periodically blown out."], "jumps": []}, {"id": "P1250", "text": ["The pressure regulator is a diaphragm operated, pressure-reducing valve. The diaphragm position governs the valve opening, maintaining a constant reduced output pressure."], "jumps": []}, {"id": "P1260", "text": ["The desired output pressure is developed in the air dome of the regulator. The 0 to 100 psi meter constantly monitors air dome pressure. This pressure is factory adjusted to 80 psi, which is the recommended inlet pressure to the dehydrator unit...."], "jumps": []}, {"id": "P1270", "text": ["Radical changes in the air dome pressure are usually traced to the valve and valve seat, or to the diaphragm and O-rings being worn or deteriorated."], "jumps": []}, {"id": "P1280", "text": ["What component in the dry air system changes color to indicate an element change is required?"], "jumps": ["P1270"]}, {"id": "P1281", "text": [], "jumps": []}, {"id": "P1282", "text": ["The liquid separator doesn't contain a replaceable filter element."], "jumps": []}, {"id": "P1283", "text": ["The pressure regulator is a sealed factory adjusted unit..."], "jumps": []}, {"id": "P1290", "text": ["The dehydrator consists of two desiccant chambers filled with desiccant in the form of small spheres. The desiccant chambers are supported by the manifold and are connected to the manifold by internal air passages..."], "jumps": ["P1280"]}, {"id": "P1300", "text": ["Dry air is needed for reactivation of the desiccant chambers. The oil and water that are removed from the desiccant are discharged at the bottom of the chamber through the purge muffler."], "jumps": []}, {"id": "P1310", "text": ["The most important single aspect of maintaining the dehydrator is to ensure proper operation of the automatic traps on the fluid separator and the telltale oil filter units. If the traps fail, the accumulated liquids can back up into the air lines and pass into the dehydrator..."], "jumps": []}, {"id": "P1320", "text": ["If this happens, the entire dry air system will be contaminated and you will have to completely disassemble and clean the fluid separator, telltale oil filter, both dump traps, the pressure regulator, the dehydrator, and all the interconnecting piping and replace the filters..."], "jumps": ["P1910"]}, {"id": "P1910", "text": ["You have completed the information on INTRODUCTION TO RADAR DRY AIR SYSTEMS."], "jumps": ["P1001", "P1320"]}, {"id": "P1920", "text": ["1. For optimum operation of search or fire control RADAR sets, waveguides used in both high and low power areas of the RADAR require pressurization with dry air. Dry air is used to increase the dielectric constant inside the waveguide to prevent RF energy arcing..........."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. Air from the ship's compressor is often contaminated with water and oil in the form of vapor and liquid. Dehydrators must remove all contamination caused by the compression and lubrication of the air before it is sent to the electronic equipment.."], "jumps": []}, {"id": "P1940", "text": ["3. The operation of the air dryer is as follows: the inlet air is checked on the pressure gauge for a minimum air pressure (typically 80 psi). Inlet pressure that is too low inhibits the operation of the fluid separator...."], "jumps": []}, {"id": "P1950", "text": ["4. As the oil is absorbed, the material in the transparent absorbing column changes color from pink to deep red. The absorbing material should be discarded and replaced before it reaches the red line in the column. ;Courier New (Arabic);Courier New Baltic;As the oil is absorbed, the material in the transparent absorbing column changes color from pink to deep red. The absorbing material should be discarded and replaced before it reaches the red line in the column."], "jumps": []}, {"id": "P1960", "text": ["5. The desired output pressure is developed in the air dome of the regulator. The 0 to 100 psi meter constantly monitors air dome pressure. This pressure is factory adjusted to 80 psi, which is the recommended inlet pressure to the dehydrator unit. c;The desired output pressure is developed in the air dome of the regulator. The 0 to 100-psig meter constantly monitors air dome pressure. This pressure is factory adjusted to 80 psi, which is the recommended inlet pressure to the dehydrator unit."], "jumps": []}, {"id": "P1970", "text": ["6. Radical changes in the air dome pressure are usually traced to the valve and valve seat, or to the diaphragm and O-rings being worn or deteriorated. 0 ted. $Note: graphic P1270 ier New Greek;Courier New Tur;Courier New (Hebrew);Courier New (Arabic);Courier New Baltic;Radical changes in the air dome pressure are usually traced to the valve and valve seat, or to the diaphragm and O-rings being worn or deteriorated. $Note: graphic P1270"], "jumps": []}, {"id": "P1980", "text": ["7. The most important single aspect of maintaining the dehydrator is to ensure proper operation of the automatic traps on the fluid separator and the telltale oil filter units. If the traps fail, the accumulated liquids can back up into the air lines and pass into the dehydrator.."], "jumps": []}, {"id": "P1990", "text": ["8. If the dump traps fail, the entire dry air system will be contaminated and you will have to completely disassemble and clean the fluid separator, telltale oil filter, both dump traps, the pressure regulator, the dehydrator, and all the interconnecting piping and replace the filters."], "jumps": ["P1999", "P1980"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1990"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["Most electronic equipment generates sufficient heat to require some form of cooling to maintain normal operation. Excessive heat must be removed to prevent changes in equipment operating parameters or prevent an electrical/mechanical failure of individual parts..al parts..."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["Our discussion highlights five methods of equipment cooling. These are: convection, forced-air, air-to-air, air-to-liquid and liquid cooling."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["In convection cooling, the warm air from the heated equipment rises through the outlet openings and replaces it with cooler air from the inlet openings."], "jumps": []}, {"id": "P2050", "text": ["The convection method, is limited in its cooling effect, relies on natural air flow and requires the equipment to be in an open enclosure without air filters. A finned heat sink is usually added to increase the surface area of the part to allow more heat to be transferred to the air..."], "jumps": []}, {"id": "P2060", "text": ["Silicone grease is usually applied between the component and the heat sink for better thermo-transfer. The heat sink must be kept free of any dirt or dust, which would act as an insulator."], "jumps": []}, {"id": "P2070", "text": ["Forced-air can be combined with convection cooling to dramatically increase the dissipation of heat. A blower is used to draw cool air in and exhaust hot air out of the equipment enclosure. An air filter is provided at the inlet to prevent dirt and dust from collecting on the internal components..."], "jumps": []}, {"id": "P2080", "text": ["Some electronic equipment enclosures are hermetically sealed to prevent the entrance of moisture. Air-to-air heat exchangers are used to prevent internal air from mixing with outside ambient air and still allow cooling to take place..."], "jumps": ["P2090", "P2070"]}, {"id": "P2085", "text": ["HERMETIC SEALING - the evacuating and sealing of an equipment enclosure to make it airtight.ke it airtight."], "jumps": []}, {"id": "P2090", "text": ["Air moving past the heat producing part absorbs heat and is forced through a heat exchanger by an internal blower. An external blower removes the heat from the heat exchanger by forcing cool outside air through it..."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["Air-to-liquid cooling is similar to air-to-air. The internal blower still circulates air past the heat producing part and through a heat exchanger, but a liquid coolant circulating through the heat exchanger removes the heat..."], "jumps": []}, {"id": "P2110", "text": ["Air-to-liquid cooling systems usually employ built-in safety devices to shut down the equipment during failures to prevent overheating. Sensors monitor liquid flow, liquid temperature, and inoperative circulating fans and reduced heat exchanger efficiency..."], "jumps": []}, {"id": "P2120", "text": ["Liquid cooling systems are more complex and are used in large equipment installations, such as RADAR transmitters. A typical liquid cooling system is composed of a primary and secondary coolant systems..."], "jumps": []}, {"id": "P2130", "text": ["The primary system provides the initial source of cooling water that can be either seawater or chilled water from the ships air-conditioning plant, or a combination of both."], "jumps": []}, {"id": "P2140", "text": ["The secondary system transfers the heat load from the electronic equipment to the primary system. The coolant normally used in the secondary system is ultra-pure and demineralized distilled water..."], "jumps": []}, {"id": "P2150", "text": ["There are three types of liquid cooling systems used to cool large heat producing electronics systems. ype II - SW/DW heat exchanger with Chilled Water/Distilled Water (CW/DW) heat exchanger standby. *Type III - CW/DW heat exchanger with a CW/DW heat exchanger standby...", "Type I: Seawater/Distilled Water (SW/DW) Heat Exchanger With SW/DW Heat Exchanger Standby Type II: SW/DW Heat Exchanger With Chilled Water/Distilled Water (CW/DW) Heat Exchanger Standby. Type III: CW/DW Heat Exchanger With A CW/DW Heat Exchanger Standby."], "jumps": []}, {"id": "P2160", "text": ["Liquid cooling systems are composed of piping, valves, regulators, heat exchangers, strainers, circulating pumps, expansion tanks, gauges, and a demineralizer. Some systems use specialized electronic components to monitor cooling water temperature.."], "jumps": []}, {"id": "P2170", "text": ["In the Type I primary cooling system, seawater is pumped by a seawater circulating pump through a duplex strainer (to remove all debris), through the heat exchanger and discharged overboard back into the sea. Seawater systems are open loop or one-pass systems..."], "jumps": []}, {"id": "P2180", "text": ["Another means of providing seawater is through the ship's firemain. The seawater from the firemain is passed through a duplex strainer (to remove all debris), through the heat exchanger and discharged overboard back into the sea..."], "jumps": []}, {"id": "P2190", "text": ["In an emergency, a 1 1/2 -inch fire hose can be connected from an alternate portion of the ship's firemain or from a portable pump rigged by the ship's repair party."], "jumps": []}, {"id": "P2200", "text": ["Depending on the type of cooling system, chilled water taken from the air conditioning system can be used as a normal or backup source of cooling for the primary and secondary cooling systems..."], "jumps": []}, {"id": "P2210", "text": ["The chilled water flows through the tubes of the heat exchanger (chilled water to distilled water), a flow regulator, and back to the chilled water system. The chilled water system is a closed-loop system because the water is recirculated..."], "jumps": []}, {"id": "P2220", "text": ["The secondary cooling system is designed to transfer heat from the electronic equipment being cooled to the primary cooling system. Distilled water (DW) is passed through the electronic equipment to pick up the generated heat, and back to the heat exchanger to transfer the heat to the chilled water..."], "jumps": []}, {"id": "P2230", "text": ["The secondary cooling system is comprised of a distilled water circulating pump, a compression or gravity feed expansion tank, the electronic equipment plumbing, a demineralizer, a temperature control valve, monitoring equipment with alarms, and a heat exchanger which is shared with the primary system..."], "jumps": []}, {"id": "P2240", "text": ["Depending on the system, either Seawater to Distilled water (SW/DW) or Chilled water to Distilled water (CW/DW) is passed through the normal or standby heat exchangers to absorb the heat from the distilled water..."], "jumps": []}, {"id": "P2250", "text": ["The temperature regulating valve partially bypasses distilled water around the SW/DW or CW/DW heat exchanger so that a constant water temperature is supplied to the electronic equipment..."], "jumps": []}, {"id": "P2260", "text": ["As the temperature in the distilled water increases, the temperature regulator directs more water to the heat exchanger and less to the bypass line."], "jumps": []}, {"id": "P2270", "text": ["Equipment heat is transferred by a continuous closed loop coolant flow from the distilled water circulating pump through the heat exchanger, to the electronic equipment systems and back to the suction side of the pump.p"], "jumps": []}, {"id": "P2280", "text": ["The expansion tank in the DW system maintains positive pressure on the circulating pump, compensates for changes in coolant volume, vents air from the system and provides makeup coolant to compensate for minor losses due to leakage..."], "jumps": []}, {"id": "P2290", "text": ["When the expansion tank is located above the highest point in the secondary system and vented to the atmosphere, it is called a gravity tank. The tank is provided with a site glass to check the level of water in the tank ..."], "jumps": []}, {"id": "P2300", "text": ["If the expansion tank is below the highest point, it is a compression tank, because it requires an air charge on the tank for proper operation. A low-level alarm switch is usually set at 20 percent tank capacity to alert operators of a possible coolant leak."], "jumps": []}, {"id": "P2310", "text": ["The demineralizer is designed to remove dissolved metals, carbon dioxide, and oxygen. In addition, a submicron filter is installed at the output of the demineralizer to prevent chemical carry over and remove existing solids..."], "jumps": []}, {"id": "P2320", "text": ["Standby circulating pumps and heat exchangers provide redundancy during system failures in order to maintain the operation of critical electronic sensors,"], "jumps": []}, {"id": "P2330", "text": ["Liquid cooling systems use heat exchangers of the shell and tube type. The primary cooling water will flow through the tubes and the secondary cooling water will flow around the baffles through the shell..."], "jumps": []}, {"id": "P2340", "text": ["Two types of heat exchangers are used; the single pass and double pass. In both types, the primary coolant flows through the tubes and the secondary coolant flows through the shell."], "jumps": []}, {"id": "P2350", "text": ["The single pass is a more efficient heat exchanger than the double pass because the primary water flows through the heat exchanger only once. In the double pass, the primary absorbs heat effectively on the first pass and hardly absorbs any additional heat on the return pass through the tubes...."], "jumps": []}, {"id": "P2360", "text": ["Double tube sheets are used at both ends of a tube bundle. A void space between the sheets prevents contamination of the distilled water and permits monitoring of water loss due to tube leakage. Any leakage detected at the telltale drains indicates a tube or tube joint failure..."], "jumps": []}, {"id": "P2370", "text": ["The type of water leaking into the telltale drains indicates whether the failure is in the primary or secondary cooling system. When any leakage is detected, the heat exchanger should be serviced to prevent the total loss of the secondary coolant..."], "jumps": []}, {"id": "P2380", "text": ["A tube leak could allow all of the secondary distilled water to enter the primary loop, causing the secondary loop to run dry and overheat the vital electronic equipment."], "jumps": ["P2390", "P2370"]}, {"id": "P2390", "text": ["What type of cooling system is used in hermetically sealed enclosures?"], "jumps": ["P2380"]}, {"id": "P2391", "text": [], "jumps": []}, {"id": "P2392", "text": ["Convection cooling systems depend on open enclosures to allow warm air to rise and draw in cooler air from below."], "jumps": []}, {"id": "P2393", "text": ["Forced air-cooling systems use a blower to pass cooler air through the enclosure and over the electronic parts."], "jumps": []}, {"id": "P2400", "text": ["What type of liquid cooling system uses chilled water for both normal and standby heat exchangers?"], "jumps": ["P2390"]}, {"id": "P2401", "text": [], "jumps": []}, {"id": "P2402", "text": ["Type 1 liquid cooling systems use Seawater to Distilled water for both normal and standby heat exchangers.", "Type I: Seawater/Distilled Water (SW/DW) Heat Exchanger With SW/DW Heat Exchanger Standby Type II: SW/DW Heat Exchanger With Chilled Water/Distilled Water (CW/DW) Heat Exchanger Standby. Type III: CW/DW Heat Exchanger With A CW/DW Heat Exchanger Standby."], "jumps": []}, {"id": "P2403", "text": ["Type 2 liquid cooling systems use Seawater to Distilled water for the normal heat exchanger.", "Type I: Seawater/Distilled Water (SW/DW) Heat Exchanger With SW/DW Heat Exchanger Standby Type II: SW/DW Heat Exchanger With Chilled Water/Distilled Water (CW/DW) Heat Exchanger Standby. Type III: CW/DW Heat Exchanger With A CW/DW Heat Exchanger Standby."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on the INTRODUCTION TO RADAR COOLING SYSTEMS."], "jumps": ["P2001", "P2400"]}, {"id": "P2920", "text": ["1. Most electronic equipment generates sufficient heat to require some form of cooling to maintain normal operation. Excessive heat must be removed to prevent changes in equipment operating parameters or prevent an electrical/mechanical failure of individual parts.ts."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2. Our discussion highlights five methods of equipment cooling. These are: convection, forced-air, air-to-air, air-to-liquid and liquid cooling."], "jumps": []}, {"id": "P2940", "text": ["3. Some electronic equipment enclosures are hermetically sealed to prevent the entrance of moisture. Air-to-air heat exchangers are used to prevent internal air from mixing with outside ambient air and still allow cooling to take place."], "jumps": []}, {"id": "P2950", "text": ["4. There are three types of liquid cooling systems used to cool large heat producing electronics systems. ype II - SW/DW heat exchanger with Chilled Water/Distilled Water (CW/DW) heat exchanger standby. *Type III - CW/DW heat exchanger with a CW/DW heat exchanger standby.", "Type I: Seawater/Distilled Water (SW/DW) Heat Exchanger With SW/DW Heat Exchanger Standby Type II: SW/DW Heat Exchanger With Chilled Water/Distilled Water (CW/DW) Heat Exchanger Standby. Type III: CW/DW Heat Exchanger With A CW/DW Heat Exchanger Standby."], "jumps": []}, {"id": "P2960", "text": ["5. In the Type I primary cooling system, seawater is pumped by a seawater circulating pump through a duplex strainer (to remove all debris), through the heat exchanger and discharged overboard back into the sea. Seawater systems are open loop or one-pass systems."], "jumps": []}, {"id": "P2970", "text": ["6. The secondary cooling system is designed to transfer heat from the electronic equipment being cooled to the primary cooling system. Distilled water (DW) is passed through the electronic equipment to pick up the generated heat, and back to the heat exchanger to transfer the heat to the chilled water.."], "jumps": []}, {"id": "P2980", "text": ["7. The expansion tank in the DW system compensates for changes in the coolant volume by providing a source of makeup water in the event of a secondary system leak."], "jumps": ["P2990", "P2920"]}, {"id": "P2990", "text": ["8. Liquid cooling systems use heat exchangers of the shell and tube type. The primary cooling water will flow through the tubes and the secondary cooling water will flow around the baffles through the shell..."], "jumps": ["P2999", "P2980"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2990"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": [ e is required?"], "jumps": []}, {"id": "P10219", "text": ["What component of the dry air system contains two desiccant chambers?"], "jumps": []}, {"id": "P10220", "text": ["What is the least efficient type of equipment cooling?"], "jumps": []}, {"id": "P10221", "text": ["Why are some equipment enclosures hermetically sealed?", "Keep dust and debris out of the enclosure."], "jumps": []}, {"id": "P10222", "text": ["The _______ system provides the initial source of cooling water that can either be seawater or chilled water."], "jumps": []}, {"id": "P10223", "text": ["The _______ system transfers the heat load from the electronic equipment."], "jumps": []}, {"id": "P10224", "text": ["A Type 1 liquid cooling system uses the following heat exchanger combinations."], "jumps": []}, {"id": "P10225", "text": ["What is the purpose of the duplex strainer in liquid cooling systems?"], "jumps": []}, {"id": "P10226", "text": ["What system provides the chilled water for the liquid cooling systems?"], "jumps": []}, {"id": "P10227", "text": ["What component of a liquid cooling system partially bypasses distilled water around the SW/DW or CW/DW heat exchanger?"], "jumps": []}, {"id": "P10228", "text": ["What component maintains a constant positive pressure on the circulating pump, compensates for changes in coolant volume, vents air from the system and provides makeup coolant to compensate for losses due to leakage? ge?"], "jumps": []}, {"id": "P10229", "text": ["What heat exchanger is more efficient in removing heat from the secondary distilled water system?"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10303", "text": ["Th let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
