<script>
const book = {"title": "9395N205", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: COMPARISON INSTRUCTIONS asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Understand the concepts of comparison instructions. w Describe the operation of comparison instructions.", "w Demonstrate the usage of comparison instructions using Allen Bradely APS software....", "w Demonstrate the usage of comparison instructions using Rockwell RSLOGIX software..."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P310", "text": [], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, we will look at the operation and usage of comparison instructions. Comparison instructions allow you to compare data in the PLC memory."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Comparing data is very useful when decisions need to be made in a ladder logic program. This data could be from inputs, timers, counters, or any other data-generating source."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["In the experiment, you will enter a ladder logic program to demonstrate the operation of comparison instructions."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Let's begin the lesson on COMPARISON INSTRUCTIONS........................."], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1040", "text": ["In ladder logic programming, you may need to make comparisons of data items within the data files. There are many different types of comparison instructions."], "jumps": ["P1050", "P1001"]}, {"id": "P1050", "text": ["The list below shows the comparison instructions used by many PLCs. We will examine each of these instructions to see how they compare data and what type of output they provide.", "= EQU Equal = NEQ Not Equal < LES Less Than <= LEQ Less Than or Equal > GRT Greater Than >= GEQ Greater Than or Equal MEQ Masked Comparison for Equal LIM Limit Test"], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["This is the Equal (EQ) instruction. This instruction takes two parameters, source A and source B. Both A and B are word values. Remember, a word is 16 bits long. If any two bits in A and B don't match, they are not equal...", "Source A Source B Result 10110110 11111111 False 10110110 10110110 True"], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["Source A is a word address in a data file. In other words, you specify the location of a word in memory that you want to use for a comparison. Source B can be either a word address in memory or the actual value you want to use...", "Source A Source B Result 10110110 11111111 False 10110110 10110110 True"], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["The advantage of using word addresses in memory is that you can change the comparison value if you want. If you enter the comparison value directly, you will not be able to change it in your ladder logic evaluation...", "Source A Source B Result 10110110 11111111 False 10110110 10110110 True"], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["The EQU instruction, like all comparison instructions, is entered into the left side of a ladder logic program rung. These instructions affect the logic path used by operation instructions on the right side of a rung..."], "jumps": ["P1100", "P1060"]}, {"id": "P1100", "text": ["If the two word values are not equal, the logic path through the instruction remains false. If they are equal, there will be a true logic path through the instruction.."], "jumps": ["P1110", "P1060"]}, {"id": "P1110", "text": ["The next instruction we are going to look at is the Not Equal (NEQ) instruction. This instruction requires the same parameters as the EQU instruction, source A and source B."], "jumps": ["P1120", "P1060"]}, {"id": "P1120", "text": ["This instruction works exactly opposite of the EQU instruction. If source A and source B do not equal each other, a true logic path exists. If they are equal, the logic path remains false."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["This is the Less Than (LES) instruction. Again, this comparison instruction requires the same parameters, source A and source B. The instruction provides a true logic path if the value in A is less than the value in B..."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["If the value in A is equal to or greater than B, the logic path will be false. It is important to note that this instruction has a range of true results and a range of false results."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["The next instruction is the Less Than or Equal (LEQ) instruction. This instruction is a combination of the EQU and LES instructions shown below. If A is less than or equal to B, a true logic path exists..."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["The Greater Than (GRT) instruction decides if the value of A is greater than the value of B. If A is greater, a true logic path will exist. If the value is less than or equal to the value of B, the logic path is false..."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["This instruction is the Greater Than or Equal (GEQ) instruction. Just like the LEQ instruction, this instruction is a combination of EQU and GRT. The diagram below shows this combination.", "GREATER THAN or EQUAL Source A Source B"], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["If the value in A is greater than or equal to the value in B, a true logic path will exist. If the value is less than B, the logic path is false."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["This instruction is the Masked Comparison for Equal (MEQ) instruction. It works similar to the EQU instruction, except for the fact that certain bits can be \"masked\" out.", "MASKED EQUAL Source Mask Compareurce B", "Binary Hex Binary Hex 1010 A 1010 A 1100 C 0011 3 0010 2 0010 2 False True", "Remember, This Instruction Actually uses 16 BIT Values, not 4."], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["In more general terms, masking is a process for comparing only certain bits. This instruction requires three parameters: a source, a mask, and a compare. The source is the word you would like to compare..."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["The mask contains a hexadecimal value that represents the bits you would like to test. Any ones in the mask will be tested; any zeros will not. This mask works in the same manner as the ones described in the lesson on I/O instructions..."], "jumps": ["P1220", "P1190"]}, {"id": "P1220", "text": ["The compare parameter is the word location or actual data that you want to compare to the source. If the source bits that have a one in the mask are the same as those bits in the compare, a true logic path is allowed..."], "jumps": ["P1230", "P1190"]}, {"id": "P1230", "text": ["If any of the bits that have a one in the mask are not the same, the logic path will be false. The diagram below illustrates the usage of a mask and an example of its results."], "jumps": ["P1240", "P1190"]}, {"id": "P1240", "text": ["The last instruction that we are going to look at is the Limit Test (LIM) instruction. This instruction looks to see if a data value is within or outside a certain range, depending on how you use the instruction...", "LIMIT TEST Low Lim Test High Limmm High Limm"], "jumps": ["P1250", "P1190"]}, {"id": "P1250", "text": ["This instruction requires three parameters: Low Limit, Test, and High Limit. The low and high limits set the range for the test. The test parameter is the value you are evaluating to see if it's within a specific range.."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["Both the low limit and high limit can have word addresses or actual values in them. Remember, if you use word addresses, you can change the values at those word locations in your ladder logic code while it is being evaluated..."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["If the low limit value is less than the high limit value, the instruction tests to see if the test value is within a range. If that value is within the range, a true logic path exists.", "Low Limit 4 High Limit 10 False True Falseeeeee"], "jumps": ["P1280", "P1240"]}, {"id": "P1280", "text": ["The diagram below shows which value will make a true logic path and which will make a false one for a hypothetical limit test case.", "Low Limit 4 High Limit 10 False True Falseeeeee"], "jumps": ["P1290", "P1240"]}, {"id": "P1290", "text": ["If the low limit value is higher than the high limit value, the instruction tests to see if the test data is outside of the specified range. Again, the diagram below shows an example of this case.", "Low Limit 10 High Limit 4 False True Falseeeee"], "jumps": ["P1300", "P1240"]}, {"id": "P1300", "text": ["We have examined the different types of comparison instructions. Using them together can provide an endless number of comparison possibilities.", "LESS THAN Source A: N7:0 Source B: 06", "GREATER THAN or EQUAL Source A: N7:0 Source B: 02", "NOT EQUAL Source A: N7:1 Source B: 03ource B: 02", "NOT EQUAL Source A: N7:1 Source B: 05ource B: 02", "Note: Remember values specified are in hex."], "jumps": ["P1310", "P1240"]}, {"id": "P1310", "text": ["Below are examples of comparison instruction combinations. Under the rung logic, you can see the range of values that can provide a true logic path."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["The contents of source A and source B are shown below in both binary and hexadecimal form. Determine the logic path of the given comparison instruction.", "NOT EQUAL Source A N7.0 Source B N7.1"], "jumps": ["P1300"]}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1322", "text": ["Remember, if the value in source A is not equal to the value in source B, the logic path is true.", "NOT EQUAL Source A N7.0 Source B N7.1"], "jumps": []}, {"id": "P1330", "text": ["The contents of source A and source B are shown below in both binary and hexadecimal form. Determine the logic path of the given comparison instruction.", "LESS THAN or EQUAL Source A N7.4 Source B N7.2"], "jumps": ["P1320"]}, {"id": "P1331", "text": [], "jumps": []}, {"id": "P1332", "text": ["Remember, if the value in source A is not less than or equal to the value in source B, the logic path is false.", "LESS THAN or EQUAL Source A N7.4 Source B N7.2"], "jumps": []}, {"id": "P1910", "text": ["This completes the information on COMPARISON INSTRUCTIONS...."], "jumps": ["P1001", "P1330"]}, {"id": "P1920", "text": ["1. The Equal (EQU) instruction is used to test if two data values are equal. If both values are equal, a true logic path results; otherwise, the logic path is false.", "Source A Source B Result 10110110 11111111 False 10110110 10110110 True"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. The Not Equal (NEQ) instruction is used to test if two data values are not equal. If the values are not equal, a true logic path results; otherwise, the logic path is false."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. The Less Than (LES) instruction is used to test if a data value is less than another data value. If the first specified data value is less than the second data value, a true logic path results; otherwise, the logic path is false."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. The Less Than or Equal (LEQ) instruction is used to test if a data value is less than or equal to another data value. If the first specified data value is less than or equal to the second data value, a true logic path exists; otherwise, the logic path is false."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. The Greater Than (GRT) instruction is used to test if a data value is greater than another data value. If the first specified data value is greater than the second value, a true logic path exists; otherwise, the logic path is false."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6. The Greater Than or Equal (GEQ) instruction is used to test if a data value is greater than or equal to another data value. If the first specified data value is greater than or equal to the second value, a true logic path exists; otherwise the logic path is false.", "GREATER THAN or EQUAL Source A Source B"], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7. The Masked Comparison for Equal (MEQ) instruction is used to test if specific bits of a data value are equal to those bits of another data value. sk is used to determine which bits are to be compared; one is to compare and zero is to ignore. If all bits of the first data value with one in the mask are equal to the second data value, a true logic path exists; otherwise, the logic path is false.", "MASKED EQUAL Source Mask Compareurce B", "Binary Hex Binary Hex 1010 A 1010 A 1100 C 0011 3 0010 2 0010 2 False True", "Remember, This Instruction Actually uses 16 BIT Values, not 4."], "jumps": ["P1982", "P1970"]}, {"id": "P1982", "text": ["A mask is used to determine which bits are to be compared; one is to compare and zero is to ignore. If all bits of the first data value with one in the mask are equal to the second data value, a true logic path exists; otherwise, the logic path is false....................................."], "jumps": []}, {"id": "P1990", "text": ["8. The Limit Test (LIM) instruction is used to see if a data value is within a specified range based on the instruction parameters. If the low limit is higher than the high limit, you want to see if the value is outside the range.", "LIMIT TEST Low Lim Test High Limmm High Limm"], "jumps": ["P1995", "P1980"]}, {"id": "P1995", "text": ["9. If the low limit is lower than the high limit, you want to see if the value is within the range. Depending on which comparison you are making, the logic path will be true if the value is within range."], "jumps": ["P1999", "P1990"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1995"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2040", "text": ["In this experiment, you will program the PLC Trainer to use some of the comparison instructions that you have learned earlier in this lesson.", "= EQU Equal = NEQ Not Equal < LES Less Than <= LEQ Less Than or Equal > GRT Greater Than >= GEQ Greater Than or Equal MEQ Masked Comparison for Equal LIM Limit Test"], "jumps": ["P2050", "P2001"]}, {"id": "P2050", "text": ["You must create a new processor program and make the appropriate configurations as you did in the lesson on bit instructions before actually beginning the ladder logic programming..."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["1. Connect the 5050 interface cable between the Nida Model 5050 PLC Trainer and the computer which has the APS software."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["2. Start the APS software by performing the following commands at the DOS prompt of the computer which has the APS software and is attached to the PLC Trainer. a. Type 'CD \\IPDS\\ATTACH\\SLC500' and press enter. b. Type 'APS' and press enter."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["If the software did not start, see your instructor for assistance. These instructions are for default installation of the APS software and may differ from your installation."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["3. Set up a new processor file and begin editing the ladder logic program. If you need help on configuring and setting up the PLC APS software, select the help button below."], "jumps": ["P2100", "P2080", "P2095"]}, {"id": "P2095", "text": ["Follow these steps to set up the APS software for ladder logic program entry and evaluation:", "1. From the main menu, select F4 [ OFFLINE CONFIG ] and then F6 [ CREATE ]. Enter a file name and press enter. You must use a filename that does not already exist and one ten characters or less. Do not forget your file name. 2. Using the up and down arrow keys, adjust the PROCESSOR box until '1747-L20C/F 12-DC SNK 8-RLY' is highlighted by the cursor bar. Press F2 [ SELECT PROC ] to select this processor. 3. Now we will select th I/O modules attached to the PLC. Press F5 [ CONFIGR I/O ]. 4. Press F4 [ MODIFY RACKS ] and then F1 [ RACK 1 ]. Rack 1 is the backplane that the other two modules will attach to. Use the cursor bar and select '1746-A2 2-slot Backplane' and press enter. 5. Use the arrow keys to highlight '*1' (Slot 1) with the cursor bar and press F5 [ MODIFY SLOT ]. Using the arrow keys again, highlight '1746-IG16 16-Input [ TTL ] (Sink) 5 VDC' and press F2 [ SELECT MODULE ]. 6. Use the arrow keys to highlight '*2' (Slot 2) with the cursor bar and press F5 [ MODIFY SLOT ]. Using the arrow keys again, highlight '1746-NI04V Analog Comb. 2 In & 2 Voltage Out' and press F2 [ SELECT MODULE ]. 7. Select F8 [ EXIT ] and F8 [ SAVE & EXIT ] and then F8 [ ACCEPT ]. 8. Press F3 [ OFFLINE PRG/DOC ] and then F1 [ PROCSSR FUNCTNS ]. We are going to change the name of our ladder logic file to be more descriptive of what it does. 9. Using the cursor bar, select File 2 and press F4 [ CHANGE FL. NAME] Enter 'C_TEST' and press return. The name should appear in the Name column for file 2. 10. We are now ready to edit the ladder program file. Using the arrow keys, highlight File 2 and press F8 [ MONITOR FILE ]. 11. To began editing, press F10 [ EDIT ]..."], "jumps": []}, {"id": "P2100", "text": ["The program shown below is the ladder logic program you are going to enter to demonstrate some of the comparison instructions that you learned in the first part of this lesson."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["Before we actually enter the program into the PLC APS software, let's look at what the program should do. This will help us understand if the program is operating properly when we are testing it..."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["On the 5050-1 PC card, there are three switches that we will use for this program: two push button switches and a slide switch. In our program, we have two counters. We are using compare instructions to compare the counter values.."], "jumps": ["P2130", "P2100"]}, {"id": "P2130", "text": ["The START and STOP push buttons are used to increment or decrement the counter. The slide switch controls which counter the START and STOP buttons change."], "jumps": ["P2140", "P2100"]}, {"id": "P2140", "text": ["The first rung of the ladder logic program checks to see if the START button, which is attached to input 0, is pushed in (high) and that the slide switch is in the on position. If the conditions are met, counter 0 is incremented with the CTU instruction..."], "jumps": ["P2150", "P2100"]}, {"id": "P2150", "text": ["Notice that the preset value is zero. We are not counting to a particular number, so the done bit has no meaning for us. For convenience, we have set the preset to zero to remind us we do not need the done bit.........."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["The next rung looks for the STOP button to be pushed in and the slide switch to be in the on, or right, position. If a true logic path can be traced through these instructions, counter 0 will be decremented by 1..."], "jumps": ["P2170", "P2140"]}, {"id": "P2170", "text": ["Rung 3 looks to see if the START button is pressed in and the slide switch is in the off, or left, position. If there is a true logic path through these bit instructions, counter 1 will be incremented by 1..."], "jumps": ["P2180", "P2140"]}, {"id": "P2180", "text": ["Rung 4 looks to see if the STOP button is pressed, and the slide switch is in the off position. If there is a true logic path through these bit instructions, counter 1 will be decremented by 1. s START and STOP increment, decrementing counter 1..."], "jumps": ["P2181", "P2140"]}, {"id": "P2181", "text": ["Remember, slide switch ON means START increments and STOP decrements counter 0. Slide switch OFF means START increments and STOP decrements counter 1.ctions, counter 1 will be decremented by 1. s START and STOP increment, decrementing counter 1..."], "jumps": ["P2190", "P2140"]}, {"id": "P2190", "text": ["In the next rung, we have the Less Than (LES) instruction. This instruction compares the accumulator of counter 0 and the accumulator of counter 1. Recall that the accumulator is the second word of a counter data file..."], "jumps": ["P2200", "P2140"]}, {"id": "P2200", "text": ["If the accumulator of counter 0 is less than counter 1, the next instruction, output enable, will turn on LED 0. The LED will only remain on while there is a true logic path through the LES instruction..."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["Rung 6 uses the Equal (EQU) instruction. Again, counter 0 accumulator and counter 1 accumulator are compared. While they are equal, LED 1 will be illuminated."], "jumps": ["P2220", "P2190"]}, {"id": "P2220", "text": ["Finally, in the last rung, we are using the Greater Than (GRT) instruction. In this case, if the value in the counter 0 accumulator is greater than the value in the counter 1 accumulator, LED 2 will be illuminated..."], "jumps": ["P2230", "P2190"]}, {"id": "P2230", "text": ["When we modify the counter values using the switches of the 5050-1 card, we can observe the states of the LES, EQU, and GRT based on the input words to the instructions."], "jumps": ["P2240", "P2190"]}, {"id": "P2240", "text": ["Let's enter the ladder logic program......................."], "jumps": ["P2250", "P2190"]}, {"id": "P2250", "text": ["Each rung will be presented in order for you to type it into the APS software. If you are having trouble, a help button will give you a list of steps to enter the instruction. Try to do as much as possible on your own...."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["4. Enter Rung 1 shown below...............................", "Count up Counter C5 : 0 Accum 0 Preset 0"], "jumps": ["P2270", "P2240", "P2265"]}, {"id": "P2265", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, XIC and then enter I:0/0. 3. Select BIT, XIC and enter I:0/2. 4. Select TIMER/COUNTER, CTU, and enter C5:0, 0 and 0. 5. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2270", "text": ["5. Enter Rung 2 shown below...............................", "Count down Counter C5 : 0 Accum 0 Preset 0"], "jumps": ["P2280", "P2260", "P2275"]}, {"id": "P2275", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, XIC and then enter I:0/1. 3. Select BIT, XIC and enter I:0/2. 4. Select TIMER/COUNTER, CTD, and enter C5:0, 0 and 0. 5. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2280", "text": ["6. Enter Rung 3 shown below...............................", "Count up Counter C5 : 1 Accum 0 Preset 0"], "jumps": ["P2290", "P2270", "P2285"]}, {"id": "P2285", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, XIC and then enter I:0/0. 3. Select BIT, XIO and enter I:0/2. 4. Select TIMER/COUNTER, CTU, and enter C5:1, 0 and 0. 5. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2290", "text": ["7. Enter Rung 4 shown below...............................", "Count down Counter C5 : 1 Accum 0 Preset 0"], "jumps": ["P2300", "P2280", "P2295"]}, {"id": "P2295", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, XIC and then enter I:0/1. 3. Select BIT, XIO and enter I:0/2. 4. Select TIMER/COUNTER, CTD, and enter C5:1, 0 and 0. 5. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2300", "text": ["Less than Source A C5: 0.2 Source B C5: 1.2", "8. Enter Rung 5 shown below..............................."], "jumps": ["P2310", "P2290", "P2305"]}, {"id": "P2305", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, COMPARE, LES and then enter C5:0.2 and C5:1.2. 3. Select BIT, OTE and enter O:0/0. 4. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2310", "text": ["9. Enter Rung 6 shown below...............................", "Equal Source A C5: 0.2 Source B C5: 1.2 1.2"], "jumps": ["P2320", "P2300", "P2315"]}, {"id": "P2315", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, COMPARE, EQU and then enter C5:0.2 and C5:1.2. 3. Select BIT, OTE and enter O:0/1. 4. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2320", "text": ["10. Enter Rung 7 shown below..............................", "Greater than Source A C5: 0.2 Source B C5: 1.2"], "jumps": ["P2340", "P2310", "P2325"]}, {"id": "P2325", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, COMPARE, GRT and then enter C5:0.2 and C5:1.2. 3. Select BIT, OTE and enter O:0/2. 4. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2340", "text": ["Now that the program is entered, we need to load it into the PLC and test it. Make sure that you have accepted the last rung of the program."], "jumps": ["P2350", "P2320"]}, {"id": "P2350", "text": ["11. Set the PLC Trainer to the initial control settings...", "Main Power ON DC Power ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF"], "jumps": ["P2340"]}, {"id": "P2365", "text": ["INITIAL CONTROL SETTING - Main Power ON, DC Power ON, Monitor ON, Process Selector OFF, +DC Voltage Select 5V, PC1 & PC2 Power OFF.FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF"], "jumps": []}, {"id": "P2360", "text": ["12. Place the PC5050-1 card in the PC1 position..........."], "jumps": ["P2370", "P2350", "P2365"]}, {"id": "P2365", "text": ["PC CARD PLACEMENT - Align the connectors on the PC5050-1 card with the pins for the PC1 position on the Nida Model 5050 PLC trainer. Gently push down on the PC5050-1 card."], "jumps": []}, {"id": "P2370", "text": ["13. Set the PLC Trainer controls as follows:..............", "+DC Voltage Select 24V PC1 Power ON ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF"], "jumps": ["P2360", "P2375"]}, {"id": "P2375", "text": ["PLC TRAINER CONTROLS - Turn the +DC Voltage Select dial fully CW to the 24V position. Push the PC1 Power switch up to the ON position."], "jumps": []}, {"id": "P2410", "text": ["The trainer has been turned on and set up to send the program to the trainer."], "jumps": ["P2420", "P2370"]}, {"id": "P2420", "text": ["14. Press F1 [SAVE/GO ONLINE]. If the file exists, you will be asked if you would like to overwrite it. Press F8 [YES]. If the processor is not in program mode, the APS software will ask you if it can switch to that mode. Press F8 [YES]."], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["15. Once the program has been sent, the APS software will ask you if you would like to switch to run mode. Again, press F8 [YES]."], "jumps": ["P2440", "P2420"]}, {"id": "P2440", "text": ["The program you entered is now running. Try out the START and STOP buttons and the POWER slide switch. Observe how the LEDs change based on the values in the counters. The APS software shows the value in the counters while they are active..."], "jumps": ["P2450", "P2430"]}, {"id": "P2450", "text": ["As you can see, when counter 0 equals counter 1, LED 1 is on. If counter 0 is less than counter 1, LED 0 is on. When counter 0 is greater than counter 1, LED 2 is on."], "jumps": ["P2460", "P2440"]}, {"id": "P2460", "text": ["This completes the demonstration of comparison instructions. Feel free to create your own ladder logic and enter it into the APS software. It is easier to write your logic on paper first and then enter it into the software..."], "jumps": ["P2470", "P2450"]}, {"id": "P2470", "text": ["If you want to edit your program, select EDIT and edit DISK PROGRAM. Then follow the same steps to send the program to the PLC Trainer. The inputs and outputs are listed below.", "I :0/0 Start Switch O :0/0 Led 0 O :0/4 Led 4 I :0/1 Stop Switch O :0/1 Led 1 O :0/5 Led 5 I :0/2 Power Switch O :0/2 Led 2 O :0/6 Led 6 O :0/3 Led 3 O :0/7 Led 74"], "jumps": ["P2480", "P2460"]}, {"id": "P2480", "text": ["16. Press F3 [EXIT] or ESC and then F3 depending on where you left off in the APS software. Now select F3 [RETURN TO MENU] and then F10 [EXIT SYSTEM]."], "jumps": ["P2490", "P2470"]}, {"id": "P2490", "text": ["17. Return the PLC Trainer to the initial control settings.", "Main Power ON DC Power ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF"], "jumps": ["P2480"]}, {"id": "P2500", "text": ["18. Turn OFF the PLC Trainer's main power switch.........."], "jumps": ["P2490"]}, {"id": "P2510", "text": ["19. Return all PC cards and test equipment to their proper storage location."], "jumps": ["P2910", "P2500"]}, {"id": "P2910", "text": ["This completes the experiment on COMPARISON INSTRUCTIONS....."], "jumps": ["P2001", "P2510"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3020", "text": ["iscussion starts here............................", "In this experiment, we are going to program the PLC Trainer to use some of the comparison instructions that you have learned in this lesson."], "jumps": ["P3030", "P3001"]}, {"id": "P3030", "text": ["Before actually beginning the ladder logic programming, you must create a new processor program and make the appropriate configurations as you did in the lesson on bit instructions programming..."], "jumps": ["P3020"]}, {"id": "P3040", "text": ["Before we can actually program the PLC, we need to make sure that the software and interface are set up and operating properly."], "jumps": ["P3020"]}, {"id": "P3050", "text": ["1. Ensure the 5050 interface cable is connected between the Nida Model 5050 PLC Trainer and the computer which has the RSLinx and RSLogix software..."], "jumps": ["P3020"]}, {"id": "P3060", "text": ["2. Turn on the 5050 PLC Trainer..........................."], "jumps": ["P3050"]}, {"id": "P3070", "text": ["3. Start the RSLinx communication software by double-clicking on the RSLinx icon that is on the computer desktop that has the RSLinx software and is attached to the PLC Trainer. If the software did not start, see your instructor for assistance.."], "jumps": ["P3060"]}, {"id": "P3080", "text": ["4. Now we need to know if the computer and PLC Trainer are communicating. In the right window, double-click on the AB_PIC-1 DH-485 icon..."], "jumps": ["P3070"]}, {"id": "P3090", "text": ["5. Make sure that the PLC icon does not have a red X over it. If a red X is present, make sure the PLC Trainer is turned on and connected. If the PLC is still not active, see your instructor for assistance."], "jumps": ["P3070"]}, {"id": "P3100", "text": ["6. Click on the minimize button. This is the \"_ \" in the upper right- hand corner of the window..........."], "jumps": ["P3090"]}, {"id": "P3110", "text": ["7. Start the RSLogix software by double-clicking on the RSLogix icon the computer's desktop, which has the RSLogix software and is attached to the PLC Trainer. If the software did not start, see your instructor for assistance.."], "jumps": ["P3100"]}, {"id": "P3120", "text": ["8. Click on the maximize button to bring the window to full size. This is the button just to the right of the minimize button."], "jumps": ["P3110"]}, {"id": "P3130", "text": ["9. Set up a new processor file and begin editing the ladder logic program. If you need help on configuring and setting up the PLC RSLogix software, select the help button below."], "jumps": ["P3120", "P3135"]}, {"id": "P3135", "text": ["Follow these steps to set up the RSLogix software for ladder logic program entry and evaluation: 1. From the standard toolbar, click on the NEW icon (icon looks like a piece of paper). 2. Enter a file name in the processor name text box. You must choose a name that does not already exist and is less than ten characters in length. Do not forget this file name. 3. Now that we have entered a filename, we will need to select the PLC type and the different I/O modules that we have attached to the system. In the case of the Nida PLC Trainer, there are two extra modules: a TTL module and an analog module. 4. At the bottom of the select processor type window, AB_PIC-1 should be displayed in the driver text box. If not displayed, click on the down-arrow and select AB_PIC-1. 5. Using the listbox scroll bar arrows, scroll until 1747-L20C/F 12-DC SNK In, 8-RLY Out is displayed. Click on this PLC processor and then click on OK. 6. Two windows should appear. The left window is the project window and displays the project files. The right window is the ladder window and displays the selected ladder program. LAD2 should be displayed in the ladder window title bar. 7. Now you need to select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 8. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. 9. In the right window scroll down and double-click on the 1746-IG16 16-Input (TTL-SOURCE) 5VDC module name to transfer the module information to the left window for the #1 slot of the PLC. 10. In the right window scroll down and double click on the 1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out module name to transfer the module information to the left window for the #2 slot of the PLC. 11. Save the configuration settings by clicking on the I/O configuration close button. This button is the X in top right-hand corner of the I/O configuration window. 12. The processor section of your file is complete. You are now at the main window and should see the end ladder in the ladder window.", "1. From the standard toolbar, click on the NEW icon (icon looks like a piece of paper). 2. Enter a file name in the processor name text box. You must choose a name that does not already exist and is less than ten characters in length. Do not forget this file name. 3. Now that we have entered a filename, we will need to select the PLC type and the different I/O modules that we have attached to the system. In the case of the Nida PLC Trainer, there are two extra modules: a TTL module and an analog module. 4. At the bottom of the select processor type window, AB_PIC-1 should be displayed in the driver text box. If not displayed, click on the down-arrow and select AB_PIC-1. 5. Using the listbox scroll bar arrows, scroll until 1747-L20C/F 12-DC SNK In, 8-RLY Out is displayed. Click on this PLC processor and then click on OK. . Two windows should appear. The left window is the project window and displays the project files. The right window is the ladder window and displays the selected ladder program. LAD2 should be displayed in the ladder window title bar. 7. Now you need to select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 8. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. 9. In the right window scroll down and double-click on the 1746-IG16 16-Input (TTL-SOURCE) 5VDC module name to transfer the module information to the left window for the #1 slot of the PLC. 10. In the right window scroll down and double click on the 1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out module name to transfer the module information to the left window for the #2 slot of the PLC. 11. Save the configuration settings by clicking on the I/O configuration close button. This button is the X in top right-hand corner of the I/O configuration window. 12. The processor section of your file is complete. You are now at the main window and should see the end ladder in the ladder window."], "jumps": []}, {"id": "P3136", "text": ["5. Using the listbox scroll bar arrows, scroll until 1747-L20C/F 12-DC SNK In, 8-RLY Out is displayed. Click on this PLC processor and then click on OK. 6. Two windows should appear. The left window is the project window and displays the project files. The right window is the ladder window and displays the selected ladder program. LAD2 should be displayed in the ladder window title bar. 7. Now you need to select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 8. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. information to the left window for the #1 slot of the PLC.", "Follow these steps to set up the RSLogix software for ladder logic program entry and evaluation: From the standard toolbar, click on the NEW icon (icon looks like a piece of paper). 2. Enter a file name in the processor name text box. You must choose a name that does not already exist and is less than ten characters in length. Do not forget this file name. 3. Now that we have entered a filename, we will need to select the PLC type and the different I/O modules that we have attached to the system. In the case of the Nida PLC Trainer, there are two extra modules: a TTL module and an analog module. 4. At the bottom of the select processor type window, AB_PIC-1 should be displayed in the driver text box. If not displayed, click on the down-arrow and select AB_PIC-1. 5. Using the listbox scroll bar arrows, scroll until 1747-L20C/F 12-DC SNK In, 8-RLY Out is displayed. Click on this PLC processor and then click on OK. 6. Two windows should appear. The left window is the project window and displays the project files. The right window is the ladder window and displays the selected ladder program. LAD2 should be displayed in the ladder window title bar. 7. Now you need to select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 8. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. 9. In the right window scroll down and double-click on the 1746-IG16 16-Input (TTL-SOURCE) 5VDC module name to transfer the module information to the left window for the #1 slot of the PLC. 10. In the right window scroll down and double click on the 1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out module name to transfer the module information to the left window for the #2 slot of the PLC. 11. Save the configuration settings by clicking on the I/O configuration close button. This button is the X in top right-hand corner of the I/O configuration window. 12. The processor section of your file is complete. You are now at the main window and should see the end ladder in the ladder window..."], "jumps": []}, {"id": "P3137", "text": ["9. In the right window scroll down and double-click on the 1746-IG16 16- Input (TTL-SOURCE) 5VDC module name to transfer the module information to the left window for the #1 slot of the PLC. 10. In the right window scroll down and double click on the 1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out module name to transfer the module information to the left window for the #2 slot of the PLC. 11. Save the configuration settings by clicking on the I/O configuration close button. This button is the X in top right-hand corner of the I/O configuration window. 12. The processor section of your file is complete. You are now at the main window and should see the end ladder in the ladder window.", "Follow these steps to set up the RSLogix software for ladder logic program entry and evaluation: From the standard toolbar, click on the NEW icon (icon looks like a piece of paper). 2. Enter a file name in the processor name text box. You must choose a name that does not already exist and is less than ten characters in length. Do not forget this file name. 3. Now that we have entered a filename, we will need to select the PLC type and the different I/O modules that we have attached to the system. In the case of the Nida PLC Trainer, there are two extra modules: a TTL module and an analog module. 4. At the bottom of the select processor type window, AB_PIC-1 should be displayed in the driver text box. If not displayed, click on the down-arrow and select AB_PIC-1. 5. Using the listbox scroll bar arrows, scroll until 1747-L20C/F 12-DC SNK In, 8-RLY Out is displayed. Click on this PLC processor and then click on OK. 6. Two windows should appear. The left window is the project window and displays the project files. The right window is the ladder window and displays the selected ladder program. LAD2 should be displayed in the ladder window title bar. 7. Now you need to select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 8. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. 9. In the right window scroll down and double-click on the 1746-IG16 16-Input (TTL-SOURCE) 5VDC module name to transfer the module information to the left window for the #1 slot of the PLC. 10. In the right window scroll down and double click on the 1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out module name to transfer the module information to the left window for the #2 slot of the PLC. 11. Save the configuration settings by clicking on the I/O configuration close button. This button is the X in top right-hand corner of the I/O configuration window. 12. The processor section of your file is complete. You are now at the main window and should see the end ladder in the ladder window..."], "jumps": []}, {"id": "P3140", "text": ["The program below is the ladder logic program you are going to enter to demonstrate some of the comparison instructions that you learned in the first part of this lesson."], "jumps": ["P3150", "P3130"]}, {"id": "P3150", "text": ["Before we actually begin entering the program into the PLC RSLogix software, let's look at what the program should do. This will help us understand if the program is operating properly when we are testing it..."], "jumps": ["P3160", "P3140"]}, {"id": "P3160", "text": ["On the 5050-1 PC card, there are three switches that we will use for this program: two push button switches and a slide switch. In out program, we have two counters. We are using compare instructions to compare the counter values.."], "jumps": ["P3170", "P3140"]}, {"id": "P3170", "text": ["The START and STOP push buttons are used to increment or decrement the counter. The slide switch controls which counter the START and STOP buttons change."], "jumps": ["P3180", "P3140"]}, {"id": "P3180", "text": ["The first rung of the ladder logic program checks to see if the START button, which is attached to input 0, is pushed in (high) and that the slide switch is in the on position. If the conditions are met, counter 0 is incremented with the CTU instruction.."], "jumps": ["P3190", "P3140"]}, {"id": "P3190", "text": ["Notice that the preset value is zero. We are not counting to a particular number, so the done bit has no meaning for us. For convenience, we have set the preset to zero to remind us we do not need the done bit.."], "jumps": ["P3200", "P3180"]}, {"id": "P3200", "text": ["The next rung looks for the STOP button to be pushed in and the slide switch to be in the on, or right position. If a true logic path can be traced through these instructions, counter 0 will be decremented by 1.."], "jumps": ["P3210", "P3180"]}, {"id": "P3210", "text": ["Rung 3 looks to see if the START button is pressed, and the slide switch is in the off, or left, position. If there is a true logic path through these bit instructions, counter 1 will be incremented by 1."], "jumps": ["P3220", "P3180"]}, {"id": "P3220", "text": ["Rung 4 looks to see if the STOP button is pressed, and the slide switch is in the off position. If there is a true logic path through these bit instructions, counter 1 will be decremented by 1."], "jumps": ["P3230", "P3180"]}, {"id": "P3230", "text": ["Remember, slide switch ON means START increments and STOP decrements counter 0. Slide switch OFF means START increments and STOP decrements counter 1."], "jumps": ["P3240", "P3180"]}, {"id": "P3240", "text": ["In the next rung, we have the Less Than (LES) instruction. This instruction compares the accumulator of counter 0 and the accumulator of counter 1. Recall that the accumulator is the second word of a counter data file.."], "jumps": ["P3250", "P3230"]}, {"id": "P3250", "text": ["If the accumulator of counter 0 is less than counter 1, the next instruction, output enable, will turn on LED 0. The LED will only remain on while there is a true logic path through the LES instruction..."], "jumps": ["P3260", "P3240"]}, {"id": "P3260", "text": ["Rung 6 uses the Equal (EQU) instruction. Again, counter 0 accumulator and counter 1 accumulator are compared. While they are equal, LED 1 will be illuminated."], "jumps": ["P3270", "P3240"]}, {"id": "P3270", "text": ["Finally, in the last rung, we are using the Greater Than (GRT) instruction. In this case, if the value in the counter 0 accumulator is greater than the value in the counter 1 accumulator, LED 2 will be illuminated.."], "jumps": ["P3280", "P3240"]}, {"id": "P3280", "text": ["When we modify the counter values using the switches of the 5050-1 card, we can observe the states of the LES, EQU, and GRT based on the input words to the instructions."], "jumps": ["P3290", "P3240"]}, {"id": "P3290", "text": ["Let's enter the ladder logic program......................."], "jumps": ["P3300", "P3240"]}, {"id": "P3300", "text": ["Each rung will be presented in order for you to type it into the RSLogix software. If you are having trouble, a help button will give you a list of steps to enter the instruction. Try to do as much as possible on your own."], "jumps": ["P3310", "P3290"]}, {"id": "P3310", "text": ["10. Enter rung 1 shown below..............................", "Count up Counter C5 : 0 Accum 0 Preset 0 0"], "jumps": ["P3320", "P3290", "P3315"]}, {"id": "P3315", "text": ["1. Add a rung. Highlight the number to the left of the end rung to select the end rung. Click on the user tab. Click on the new rung icon. 2. Add an XIC instruction to the new rung. Click on the bit tab, and then click on the XIC icon. Type I:0/0 and press <ENTER>. 3. Add another XIC Instruction. Click on the XIC icon. Type I:0/2 and press <ENTER>. 4. Add a CTU instruction. Click on the timer/counter tab, and then click on CTU. For the counter, type C5:0 and press <ENTER>. For the accumulator type 0 and press <ENTER>. For the preset, type 0 and press <ENTER>. 5. Verify the rung. Click on the verify icon ( looks like a computer with a green check mark over it.", "RUNG 111ng. Highlight the number to the left of the end rung to select the end rung. Click on the user tab. Click on the new rung icon. 2. Add an XIC instruction to the new rung. Click on the bit tab, and then click on the XIC icon. Type I:O/O and press <ENTER>. 3. Add another XIC Instruction. Click on the XIC icon. Type I:O/2 and press <ENTER>. 4. Add a CTU instruction. Click on the timer/counter tab, and then click on CTU. For the counter, type C5:O and press <ENTER>. For the accumulator type O and press <ENTER>. For the preset, type O and press <ENTER>. 5. Verify the rung. Click on the verify icon ( looks like a computer with a green check mark over it."], "jumps": []}, {"id": "P3320", "text": ["11. Enter rung 2 shown below..............................", "Count down Counter C5 : 0 Accum 0 Preset 0"], "jumps": ["P3330", "P3310", "P3325"]}, {"id": "P3325", "text": ["1. Add a rung. Highlight the number to the left of the end rung to select the end rung. Click on the user tab. Click on the new rung icon. 2. Add an XIC instruction to the new rung. Click on the bit tab, and then click on the XIC icon. Type I:0/1 and press <ENTER>. 3. Add another XIC Instruction. Click on the XIC icon. Type I:0/2 and press <ENTER>. 4. Add a CTU instruction. Click on the timer/counter tab, and then click on CTU. For the counter, type C5:0 and press <ENTER>. For the accumulator type 0 and press <ENTER>. For the preset, type 0 and press <ENTER>. 5. Verify the rung. Click on the verify icon ( looks like a computer with a green check mark over it."], "jumps": []}, {"id": "P3330", "text": ["12. Enter rung 3 shown below..............................", "Count up Counter C5 : 1 Accum 0 Preset 0 0"], "jumps": ["P3340", "P3320", "P3335"]}, {"id": "P3335", "text": ["1. Add a rung. Highlight the number to the lator type 0 and press <ENTER>. For the preset, type 0 and press <ENTER>. 5. Verify the rung. Click on the verify icon ( looks like a computer with a green check mark over it."], "jumps": []}, {"id": "P3350", "text": ["14. Enter rung 5 shown below..............................", "Less than Source A C5: 0.2 Source B C5: 1.2"], "jumps": ["P3360", "P3340", "P3355"]}, {"id": "P3355", "text": ["1. Add a rung. Highlight the number to the left of the end rung to select the end rung. Click on the user tab. Click on the new rung icon. 2. Add an LES instruction. Click on the compare tab, and then click on LES. For Source A, type C5:0.2 and press <ENTER>. Notice that the 0.2 changes to 0.ACC, which tells you that this source is using accumulator 0. For Source B, type C5:1.2 and press <ENTER>. Notice that the 1.2 changes to 1.ACC, which tells you that this source is using accumulator 1. 3. Add an OTE instruction. Click on the bit tab, and then click on the OTE icon. Type O:0/0 and press <ENTER>. 4. Verify the rung. Click on the verify icon (Looks like a computer with a green check mark over it)."], "jumps": []}, {"id": "P3360", "text": ["15. Enter rung 6 shown below..............................", "Equal Source A C5: 0.2 Source B C5: 1.2 1.2"], "jumps": ["P3370", "P3350", "P3365"]}, {"id": "P3365", "text": ["1. Add a rung. Highlight the number to the left of the end rung to select the end rung. Click on the user tab. Click on the new rung icon. 2. Add an EQU instruction. Click on the compare tab, and then click on EQU. For Source A, type C5:0.2 and press <ENTER>. Notice that the 0.2 changes to 0.ACC, which tells you that this source is using accumulator 0. For Source B, type C5:1.2 and press <ENTER>. Notice that the 1.2 changes to 1.ACC, which tells you that this source is using accumulator 1. 3. Add an OTE instruction. Click on the bit tab, and then click on the OTE icon. Type O:0/1 and press <ENTER>. 4. Verify the rung. Click on the verify icon (Looks like a computer with a g  Voltage Select 24V PC1 Power ON ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF"], "jumps": ["P3400", "P3415"]}, {"id": "P3415", "text": ["PLC TRAINER CONTROLS - Turn the +DC Voltage Select dial full CW to the 24V position. The PC1 Power switch down to the OFF position."], "jumps": []}, {"id": "P3420", "text": ["The trainer has been turned on and set up for us to send our program to the trainer. Let's send out program to the trainer."], "jumps": ["P3430", "P3410"]}, {"id": "P3430", "text": ["20. Save the project. Click on File, and then Save. Select OK from the revision note dialog box that may pop-up.."], "jumps": ["P3440", "P3420"]}, {"id": "P3440", "text": ["21. Click on the down-arrow button to the right of the processor status box which contains the text OFFLINE, then select download from the menu. Click on OK if the revision note dialog box pops-up.."], "jumps": ["P3450", "P3430"]}, {"id": "P3450", "text": ["22. A confirmation box will display asking if you want to proceed with the download. Click on yes."], "jumps": ["P3460", "P3430"]}, {"id": "P3460", "text": ["23. A confirmation box will display asking if you want to switch to program mode. Click on yes."], "jumps": ["P3470", "P3430"]}, {"id": "P3470", "text": ["24. After the program is downloaded. A confirmation box will display asking if you want to change back to run mode. Click on yes."], "jumps": ["P3480", "P3430"]}, {"id": "P3480", "text": ["25. A confirmation box will display asking if you want to go online. Click on yes."], "jumps": ["P3490", "P3430"]}, {"id": "P3490", "text": ["The program you have entered is now running. Try out the START and STOP buttons and the POWER slide switch. Observe how the LEDs change based on the values in the counters. The RSLogix software shows the value in the counters while they are active..."], "jumps": ["P3500", "P3430"]}, {"id": "P3500", "text": ["As you can see, when counter 0 equals counter 1, LED 1 is on. If counter 0 is less than counter 1, LED 0 is on. When counter 0 is greater than counter 1, LED 2 is on."], "jumps": ["P3510", "P3490"]}, {"id": "P3510", "text": ["This completes the demonstration of the comparison instructions. Feel free to create you own ladder logic and enter it into the RSLogix software. It is easier to write your logic on paper first and then enter it into the software."], "jumps": ["P3520", "P3490"]}, {"id": "P3520", "text": ["If you want to edit your program, use the tabs and instructions for the ladder (right) window. Then follow the same steps to send the program to the PLC trainer. The inputs and outputs are listed below.", "I :0/0 Start Switch O :0/0 Led 0 O :0/4 Led 4 I :0/1 Stop Switch O :0/1 Led 1 O :0/5 Led 5 I :0/2 Power Switch O :0/2 Led 2 O :0/6 Led 6 O :0/3 Led 3 O :0/7 Led 74"], "jumps": ["P3530", "P3490"]}, {"id": "P3530", "text": ["26. Click on File and then click on Close from the menu..."], "jumps": ["P3540", "P3520"]}, {"id": "P3540", "text": ["27. Return the PLC trainer to the initial control settings.", "Main Power ON DC Power ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF"], "jumps": ["P3530", "P3405"]}, {"id": "P3550", "text": ["28. Turn off the PLC trainer's main power switch..........."], "jumps": ["P3540"]}, {"id": "P3560", "text": ["29. Return all PC cards and test equipment to their proper storage location."], "jumps": ["P3910", "P3550"]}, {"id": "P3910", "text": ["This completes the experiment on COMPARISON INSTRUCTIONS....."], "jumps": ["P3001", "P3560"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have alrea let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
