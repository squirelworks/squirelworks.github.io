equency non-sinusoidal waveforms are produced."], "jumps": []}, {"id": "P1080", "text": ["In this example we will combine the fundamental frequency and the harmonic frequencies to produce a square wave."], "jumps": []}, {"id": "P1090", "text": ["The fundamental frequency of this sine wave is 1 Hz. The square wave is developed using only the odd harmonics.", "Fundamental Frequency = 1 Hz 3rd Harmonic = 3 Hz3rd Harmonic = 3 Hz"], "jumps": []}, {"id": "P1100", "text": ["Begin by adding the 3rd harmonic frequency to the fundamental frequency at T1 to produce the voltage of the square wave."], "jumps": []}, {"id": "P1103", "text": ["Begin by adding the 3rd harmonic frequency to the fundamental frequency at T1 to produce the voltage of the square wave.", "Fundamental Frequency = 1 Hz 3rd Harmonic = 3 Hz3rd Harmonic = 3 Hz"], "jumps": []}, {"id": "P1105", "text": ["ADDING WAVEFORMS - Add the 3rd harmonic waveform with the fundamental frequency. At T1 the voltage of the fundamental frequency is 1.5 V. The voltage of the 3rd harmonic is 1.5 V producing 3 V at T1.", "Fundamental Frequency = 1 Hz 3rd Harmonic = 3 Hz3rd Harmonic = 3 Hz"], "jumps": []}, {"id": "P1110", "text": ["The 3rd harmonic frequency is then added to the fundamental frequency to produce the square wave at T2."], "jumps": []}, {"id": "P1120", "text": ["At T3, adding the two frequencies produces the rest of the positive half cycle for the square wave."], "jumps": []}, {"id": "P1130", "text": ["Adding only two frequencies produces a less than perfect square wave. The square wave can be flattened by adding additional harmonics."], "jumps": []}, {"id": "P1140", "text": ["Adding the 5th harmonic frequency will cause the center of the waveform to dip less."], "jumps": []}, {"id": "P1150", "text": ["The square wave becomes more pronounced as more and more odd harmonics are added to the waveform."], "jumps": []}, {"id": "P1160", "text": ["Adding different selected harmonics to the fundamental frequency can produce o let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
