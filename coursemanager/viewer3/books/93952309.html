uit changed value. Predicted: 2.8 mA Measured: .78 mA"], "jumps": ["P1110", "P1060"]}, {"id": "P1110", "text": ["Resistance measurements determine which component changed value."], "jumps": ["P1120", "P1060"]}, {"id": "P1120", "text": ["Measure the resistance of R2 by opening S1 and S2.", "Measure the resistance of R2 by opening S1 and S2...E A multimeter cannot measure XL.", "A multimeter cannot measure XL. the resistance of L2. If low, L2 is not shorted. If 0, L2 is shorted. d."], "jumps": ["P1130", "P1060"]}, {"id": "P1130", "text": ["The meter indicates that R2 has changed value.  The fault is R2.", "The meter indicates that R2 has changed value. The fault is R2."], "jumps": ["P1140", "P1060"]}, {"id": "P1140", "text": ["If the meter indicates that R2 has not changed value, then the fault is L2."], "jumps": ["P1150", "P1060"]}, {"id": "P1150", "text": ["Remember, a changed value component changes Zt and It."], "jumps": ["P1165", "P1060"]}, {"id": "P1165", "text": ["Select a faulted component and observe the change in circuit values.  Select NEXT when finished.", "Select a faulted component and observe the change in circuit values. Select NEXT when finished. Measured: Predicted: 2.8 mA Measured:"], "jumps": ["P1530", "P1060", "P1170", "P1260", "P1350", "P1440", "P1070"]}, {"id": "P1170", "text": ["A branch with an open resistor does not allow current flow.", "A branch with an open resistor does not allow current flow. edicted: 3.6 mA 20.0 V Measured: 0.0 mA 14.0 V Predicted: 2.8 mA Measured: 2.8 mA"], "jumps": ["P1180", "P1060"]}, {"id": "P1180", "text": ["Measuring the voltage drops shows that the current value in the L1, R1 branch is not correct.", "Measuring the voltage drops shows that the current value in the L1, R1 branch is not correct. Predicted: 3.6 mA Measured: 0.0 mA"], "jumps": ["P1190", "P1060"]}, {"id": "P1190", "text": ["However, voltage measurements can not determine if R1 is open or if L1 is shorted.", "However, voltage measurements can not deter or an RL parallel circuit are open, short, and changed value."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  A changed value component changes current in that branch.        Voltage drops indicate the current.", "2. A changed value component changes current in that branch. Voltage drops indicate the current."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. An open breaks the circuit and no current flows. When the inductor is open 0 volts is measured across the resistor in that branch. When the resistor is open the applied voltage is measured across the open resistor."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  A short eliminates the component from the circuit.  The                    applied voltage is measured across R2.", "4. A short eliminates the component from the circuit. The applied voltage is measured across R2. Measured: 4.0 mA"], "jumps": ["P1999", "P1930"]}, {"id": "P1999", "text": ["You have completed the Summary.  You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1930"]}, {"id": "P13105", "text": ["BNC CONNECTION - Connect the Function Generator's Main Output BNC to the Test Console's Input Signal BNC."], "jumps": ["P13100"]}, {"id": "P2020", "text": ["This experiment demonstrates the effects of open and shorted  components on the operation of an RL parallel circuit.  You will apply an AC input voltage and measure circuit values to  recognize faulty circuit operation.", "This experiment demonstrates the effects of open and shorted components on the operation of an RL parallel circuit. You will apply an AC input voltage and measure circuit values to recognize faulty circuit operation."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["Pick up the PC130-16B card.  It has four RL series circuits labeled A, B, C, and D.", "Pick up the PC130-16B card. It has four RL series circuits labeled A, B, C, and D."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["Placing S1 and S2 IN makes an RL parallel circuit."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["You will use circuit A and B throughout the experiment.  Let's begin.", "You will use circuit A and B throughout the experiment. Let's begin."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["1. Set the Test Console controls to the initial control settings."], "jumps": []}, {"id": "P2080", "text": ["2.  Carefully plug PC130-16B into the Test Console PC1 position.", "2. Carefully plug PC130-16B into the Test Console PC1 position."], "jumps": ["P2070"]}, {"id": "P2085", "text": ["EXPERIMENT CARD PLACEMENT - PC130-16B shown in PC1 position."], "jumps": ["P2080"]}, {"id": "P2090", "text": ["3.  Set S3 and S4 to the LEFT on PC130-16B.  \n4.  Set S1 and S2 to the RIGHT on PC130-16B.", "3. Set S3 and S4 to the LEFT on PC130-16B. 4. Set S1 and S2 to the RIGHT on PC130-16B."], "jumps": ["P2100", "P2080"]}, {"id": "P2095", "text": ["SWITCH POSITIONS S1 - RIGHT (closed) S3 - LEFT (open) S2 - RIGHT (closed) S4 - LEFT (open)"], "jumps": []}, {"id": "P2100", "text": ["5.  Connect the Function Generator output to the INPUT BNC on         the Test Console.\n6.  Adjust the Function Generator for a 64 kHz sine wave output.", "5. Connect the Function Generator output to the INPUT BNC on the Test Console. 6. Adjust the Function Generator for a 64 kHz sine wave output."], "jumps": ["P2110", "P2090"]}, {"id": "P2105", "text": [], "jumps": ["P2100"]}, {"id": "P2110", "text": ["7. Measure Ea across TP10 and TP1 using your multimeter. Adjust the Function Generator output level for 5 volts.", "Throughout the rest of the lesson the discussion will refer to multimeter lead placement. If using an oscilloscope select the help button below.", "7. Adjust the Function Generator output level for 5 Vrms as measured by an analog meter. If measuring with an oscilloscope adjust the Function Generator output 5Vpp. This is E let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
