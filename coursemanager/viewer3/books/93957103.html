 V, CH2 Volts/Div - .2V, Display - Dual"], "jumps": []}, {"id": "P3110", "text": ["10.  Disconnect the fiberoptic cable from the photocell.  The\n       100 Hz signal is no longer present at the output of the                       photocell.  This proves that the light signal is causing the                photocell to operate.", "10. Disconnect the fiberoptic cable from the photocell. The 100 Hz signal is no longer present at the output of the photocell. This proves that the light signal is causing the photocell to operate.."], "jumps": ["P3100"]}, {"id": "P3120", "text": ["11.  Connect the fiberoptic cable to the photodiode housing.\n12.  Move the CH2 probe to TP14.", "11. Connect the fiberoptic cable to the photodiode housing. 12. Move the CH2 probe to TP14.", "OSCILLOSCOPE CONNECTION - Fiberoptic cable connected between DS1 and PD1. CH1 - TP7 CH2 - TP14"], "jumps": ["P3110", "P3125", "P"]}, {"id": "P3130", "text": ["The output of the photodiode is also the 100 Hz signal.  If clipping occurs, reduce the output amplitude of the function generator.", "The output of the photodiode is also the 100 Hz signal. If clipping occurs, reduce the output amplitude of the function generator."], "jumps": ["P3120"]}, {"id": "P3140", "text": ["13.  Connect the fiberoptic cable to the photovoltaic housing. \n14.  Place S8 to P.VOLT.", "13. Connect the fiberoptic cable to the photovoltaic housing. 14. Place S8 to P.VOLT.", "FIBEROPTIC CONNECTION - Fiberoptic cable connected between DS1 and PV1. S8 - P. Volt"], "jumps": ["P3150", "P3130", "P3145", "P"]}, {"id": "P3150", "text": ["The output of the photovoltaic is also the 100 HZ signal.  If clipping occurs, reduce the output amplitude of the function generator.", "The output of the photovoltaic is also the 100 HZ signal. If clipping occurs, reduce the output amplitude of the function generator."], "jumps": ["P3160", "P3140"]}, {"id": "P3160", "text": ["15.  Move the fiberoptic cable to the phototransistor housing. \n16.  Move the CH2 probe to TP15.", "15. Move the fiberoptic cable to the phototransistor housing. 16. Move the CH2 probe to TP15.", "FIBEROPTIC CONNECTION - Fiberoptic cable connected between DS1 and PT1. CH2 Probe - TP15"], "jumps": ["P3170", "P3150", "P3165", "P"]}, {"id": "P3170", "text": ["The output of the phototransistor is also the 100 Hz signal.  If clipping occurs, reduce the output amplitude of the function generator.  Adjusting the potentiometer will reduce or increase the amount of clipping on the output waveform.", "The output of the phototransistor is also the 100 Hz signal. If clipping occurs, reduce the output amplitude of the function generator. Adjusting the potentiometer will reduce or increase the amount of clipping on the output waveform."], "jumps": ["P3180", "P3160"]}, {"id": "P3180", "text": ["If time allows, place S2 through S5 to IN and connect other light sources to the four light receivers.  You may vary the frequency output of the function generator.  Remember, S8 selects between the photodiode and photovoltaic.", "If time allows, place S2 through S5 to IN and connect other light sources to the four light receivers. You may vary the frequency output of the function generator. Remember, S8 selects between the photodiode and photovoltaic.."], "jumps": ["P3190", "P3170"]}, {"id": "P3190", "text": ["1.  Disconnect the fiberoptic cable and oscilloscope probes from       the circuit.", "1. Disconnect the fiberoptic cable and oscilloscope probes from the circuit."], "jumps": ["P3200", "P3180"]}, {"id": "P3200", "text": ["2.  Return the test console controls to their Initial Control                      Settings.", "2. Return the test console controls to their Initial Control Settings."], "jumps": ["P3190"]}, {"id": "P3210", "text": ["3.  Remove PC130-251 from the PC1 position.", "3. Remove PC130-251 from the PC1 position................."], "jumps": ["P3220", "P3200"]}, {"id": "P3220", "text": ["4.  Turn the Test Console Power to OFF. \n5.  Return all equipment to the designated storage areas.", "4. Turn the Test Console Power to OFF. 5. Return all equipment to the designated storage areas."], "jumps": ["P3210"]}, {"id": "P1562", "text": ["Your voltage measurement is not within the acceptable limits. Connect the ampmeter between TP6 and ground, make sure that S4 is in the IN position,S6 in the MOD position, and that you are reading around 0.2 mA on the ammeter before again measuring the voltage at TP4."], "jumps": []}, {"id": "P13030", "text": ["The light transmitters are mounted on the left hand side of the PC130-251experiment card, labeled DS1 through DS5.", "The light transmitters are mounted on the left hand side of the PC130-251experiment card, labeled DS1 through DS5.."], "jumps": ["P13040", "P13020"]}, {"id": "P13050", "text": ["Each light transmitter has a separate power switch, S1 through S5."], "jumps": ["P13060", "P13030"]}, {"id": "PINFO", "text": ["Each light transmitter has a separate power switch, S1 through S5.", "07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 10-06-99 Converted from storyboard to toolbook. frieda 10-07-99 Text and Branching. frieda 10-12-99 graphics. ben 01-20-00 reviewed and fixed. debbie 01-27-00 Graphics corrections. doan 03-01-00 Changes as per Dean - lisa 03-10-00 Reviewed - lisa 07-14-00 Converted to ToolBook 7.1 format. jay 09-25-00 P420, touched up graphics of LEDs and incandesent lamp. P1030, 13030, touched up schematic symbols of LEDs . -Penny 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 05-21-02 made corrections to text - patty 06-07-02 Review - lisa 07-23-02 Changed P14720 text box current to voltage - lisa 06-16-04 P14360, changed branching so that next page is P14370. P14410, changed branching so that back goes to P14400. -Penny 06-21-04 P14350, removed script that removed student control of the test console. P14370, added script to remove student control of the test console on button Next. P14360, 2360, 14362, 2363, 14363, 2363, changed all sentences to read in the past tense. First sentences were written in present second sentence written in past. Also changed first 2 distractors to be in past tense to match third distractor and question stem. -Penny 07-08-04 P1910, P3910, P13910, P15910 Added end of experiment script per jay. frieda 07-10-04 P1910, P3910, P13910, P15910 Added additional end of experiment script per jay. patty 11-01-04 Reviewed & changed for technical accuracy. Daveeeeeeeeee"], "jumps": []}, {"id": "P13060", "text": ["S6 controls the type of input that can be applied to the transmitters."], "jumps": ["P13070", "P13030"]}, {"id": "P13070", "text": ["When set to FIXED, a ground is applied to the cathodes of DS1 through DS4."], "jumps": ["P13080", "P13030"]}, {"id": "P13080", "text": ["In this setting, the DC voltage to each transmitter is fixed and the transmitters produce a steady light output.", "In this setting, the DC voltage to each transmitter is fixed and the transmitters produce a steady light output.........."], "jumps": ["P13090", "P13030"]}, {"id": "P13090", "text": ["When S6 is set to MOD, an external signal source can be connected to TP7 and used to modulate the light transmitters."], "jumps": ["P13100", "P13030"]}, {"id": "P1910", "text": ["This completes the experiment on LIGHT TRANSMITTERS.", "Now, pick up the PC130-251 card.", "This completes the experiment on LIGHT TRANSMITTERS........", "Now, pick up the PC130-251 card............................"], "jumps": ["P1001", "P1690", "P13120", "P13030", "P"]}, {"id": "P13120", "text": ["The five black housings hold the light transmitters and are used to connect the fiberoptic cable."], "jumps": ["P13130", "P13110"]}, {"id": "P13130", "text": ["Note that the red LED is the top light source and the incandescent lamp is the bottom light source."], "jumps": ["P13140", "P13110"]}, {"id": "P13140", "text": ["Switches S1 through S5 are the power switches to each light transmitter."], "jumps": ["P13150", "P13110"]}, {"id": "P13150", "text": ["S6 is located on the bottom left of the card."], "jumps": ["P13160", "P13110"]}, {"id": "P13160", "text": ["Let's start the experiment!", "Let's start the experiment!e..............................."], "jumps": ["P13170", "P13110"]}, {"id": "P13170", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P13160"]}, {"id": "P13180", "text": ["2.  Press Enter to Set: Positive Supply Voltage - 15", "2. Press Enter to Set: Positive Supply Voltage - 15......................."], "jumps": []}, {"id": "P13190", "text": ["3.  Carefully plug PC130-251 into the Test Console PC1 position.", "3. Carefully plug PC130-251 into the Test Console PC1 position."], "jumps": ["P13200"]}, {"id": "P13200", "text": ["4.  On PC130-251, set the controls as follows: \n     S1 through S5 - Out, to the left \n     S6 - FIXED\n     S7 through S9 - to the left", "4. On PC130-251, set the controls as follows: S1 through S5 - Out, to the left S6 - FIXED S7 through S9 - to the left", "PC130-251 SETUP- S1 through S5 - OUT S6 - FIXED S7 through S9 - LEFT"], "jumps": ["P13210", "P13190", "P13205", "P"]}, {"id": "P13210", "text": ["5.  Press Enter to Set: PC1 DC Power Switch - ON", "5. Press Enter to Set: PC1 DC Power Switch - ON..........................."], "jumps": ["P13200"]}, {"id": "P13220", "text": ["The light transmitters are now set up to operate.  Let's turn each one on separately and observe the results.", "The light transmitters are now set up to operate. Let's turn each one on separately and observe the results."], "jumps": ["P13230"]}, {"id": "P13230", "text": ["1.  Place S1 on PC130-251 to IN, to the right. \n2.  Observe the light by looking straight down into the housing of      DS1.", "1. Place S1 on PC130-251 to IN, to the right. 2. Observe the light by looking straight down into the housing of DS1.", "PC130-251 SETUP - Place S1 to the IN position. Observe the light by looking straight down into the housing of DS1."], "jumps": ["P13240", "P13220", "P13235"]}, {"id": "P13240", "text": ["What color is DS1 emitting?", "What color is DS1 emitting? typed.........................."], "jumps": ["P13230"]}, {"id": "P13241", "text": [], "jumps": []}, {"id": "P13242", "text": ["Ensure that switch S1, the top left switch on the card, is placed to the IN position.  DS1 should NOT be emitting green light.", "Ensure that switch S1, the top left switch on the card, is placed to the IN position. DS1 should NOT be emitting green light."], "jumps": []}, {"id": "P13243", "text": ["Ensure that switch S1, the top left switch on the card, is placed to the IN position.  DS1 should NOT be emitting amber light.", "Ensure that switch S1, the top left switch on the card, is placed to the IN position. DS1 should NOT be emitting amber light."], "jumps": []}, {"id": "P13244", "text": ["Ensure that switch S1, the top left switch on the card, is placed to the IN position.  DS1 should NOT be emitting white light.", "Ensure that switch S1, the top left switch on the card, is placed to the IN position. DS1 should NOT be emitting white light."], "jumps": []}, {"id": "P13245", "text": ["Ensure that switch S1, the top left switch on the card, is placed to the IN position.  DS1 should be emitting visible light.", "Ensure that switch S1, the top left switch on the card, is placed to the IN position. DS1 should be emitting visible light..t."], "jumps": []}, {"id": "P13250", "text": ["3.  Place S1 to OUT and S2 to IN on the PC130-251. \n4.  Observe the light by looking straight down into the housing of      DS2.", "3. Place S1 to OUT and S2 to IN on the PC130-251. 4. Observe the light by looking straight down into the housing of DS2.", "PC130-251 SETUP - S1 - Out S2 - In"], "jumps": ["P13260", "P13240", "P13255"]}, {"id": "P13260", "text": ["What color is DS2 emitting?", "What color is DS2 emitting? typed.........................."], "jumps": ["P13250"]}, {"id": "P13261", "text": [], "jumps": []}, {"id": "P13262", "text": ["Ensure that switch S2, second from the top left switch on the card, is placed to the IN position.  DS2 should NOT be emitting red light.", "Ensure that switch S2, second from the top left switch on the card, is placed to the IN position. DS2 should NOT be emitting red light."], "jumps": []}, {"id": "P13263", "text": ["Ensure that switch S2, second from the top left switch on the card, is placed to the IN position.  DS2 should NOT be emitting amber light.", "Ensure that switch S2, second from the top left switch on the card, is placed to the IN position. DS2 should NOT be emitting amber light."], "jumps": []}, {"id": "P13264", "text": ["Ensure that switch S2, second from the top left switch on the card, is placed to the IN position.  DS2 should NOT be emitting white light.", "Ensure that switch S2, second from the top left switch on the card, is placed to the IN position. DS2 should NOT be emitting white light."], "jumps": []}, {"id": "P13265", "text": ["Ensure that switch S2, second from the top left switch on the card, is placed to the IN position.  DS2 should be emitting visible light.", "Ensure that switch S2, second from the top left switch on the card, is placed to the IN position. DS2 should be emitting visible light."], "jumps": []}, {"id": "P13270", "text": ["5.  Place S2 to OUT and S3 to IN on PC130-251. \n6.  Observe the light by looking straight down into the housing of      DS3.", "5. Place S2 to OUT and S3 to IN on PC130-251. 6. Observe the light by looking straight down into the housing of DS3.", "PC130-251 SETUP - S2 - Out S3 - In"], "jumps": ["P13280", "P13260", "P13275"]}, {"id": "P13280", "text": ["What color is DS3 emitting?", "What color is DS3 emitting? typed.........................."], "jumps": ["P13270"]}, {"id": "P13281", "text": [], "jumps": []}, {"id": "P13282", "text": ["Ensure that switch S3, third from the top left switch on the card, is placed to the IN position.  DS3 should NOT be emitting red light.", "Ensure that switch S3, third from the top left switch on the card, is placed to the IN position. DS3 should NOT be emitting red light."], "jumps": []}, {"id": "P13283", "text": ["Ensure that switch S3, third from the top left switch on the card, is placed to the IN position.  DS3 should NOT be emitting green light.", "Ensure that switch S3, third from the top left switch on the card, is placed to the IN position. DS3 should NOT be emitting green light."], "jumps": []}, {"id": "P13284", "text": ["Ensure that switch S3, third from the top left switch on the card, is placed to the IN position.  DS3 should NOT be emitting white light.", "Ensure that switch S3, third from the top left switch on the card, is placed to the IN position. DS3 should NOT be emitting white light."], "jumps": []}, {"id": "P13285", "text": ["Ensure that switch S3, third from the top left switch on the card, is placed to the IN position.  DS3 should be emitting visible light.", "Ensure that switch S3, third from the top left switch on the card, is placed to the IN position. DS3 should be emitting visible light."], "jumps": []}, {"id": "P13290", "text": ["7.  Place S3 to OUT on the PC130-251.  The three LEDs that you         observed produce photometric energy, light that you can see.", "7. Place S3 to OUT on the PC130-251. The three LEDs that you observed produce photometric energy, light that you can see.."], "jumps": ["P13300", "P13280", "P13295"]}, {"id": "P13300", "text": ["8.  Place S4 on PC130-251 to IN.  \n9.  Observe the light by looking straight down into the housing of      DS4.", "8. Place S4 on PC130-251 to IN. 9. Observe the light by looking straight down into the housing of DS4."], "jumps": ["P13310", "P13290", "P13305"]}, {"id": "P13310", "text": ["What color is DS4 emitting?", "What color is DS4 emitting? typed.........................."], "jumps": ["P13300"]}, {"id": "P13311", "text": [], "jumps": []}, {"id": "P13312", "text": ["Ensure that switch S4, second from the bottom left switch on the card, is placed to the IN position.  DS4 should NOT be emitting red light.", "Ensure that switch S4, second from the bottom left switch on the card, is placed to the IN position. DS4 should NOT be emitting red light."], "jumps": []}, {"id": "P13313", "text": ["Ensure that switch S4, second from the bottom left switch on the card, is placed to the IN position.  DS4 should NOT be emitting green light.", "Ensure that switch S4, second from the bottom left switch on the card, is placed to the IN position. DS4 should NOT be emitting green light."], "jumps": []}, {"id": "P13314", "text": ["Ensure that switch S4, second from the bottom left switch on the card, is placed to the IN position.  DS4 should NOT be emitting amber light.", "Ensure that switch S4, second from the bottom left switch on the card, is placed to the IN position. DS4 should NOT be emitting amber light."], "jumps": []}, {"id": "P13315", "text": ["Ensure that switch S4, second from the bottom left switch on the card, is placed to the IN position.  DS4 should NOT be emitting white light.", "Ensure that switch S4, second from the bottom left switch on the card, is placed to the IN position. DS4 should NOT be emitting white light."], "jumps": []}, {"id": "P13320", "text": ["10.  Place S4 to OUT on PC130-251.\n       The DS4 LED is producing radiometric energy, your eyes                can not see this type of light.  In the experiment, you will see          that DS4 is really producing energy.", "10. Place S4 to OUT on PC130-251. The DS4 LED is producing radiometric energy, your eyes can not see this type of light. In the experiment, you will see that DS4 is really producing energy.............."], "jumps": ["P13330", "P13310", "P13325"]}, {"id": "P13330", "text": ["11.  Place S5 on PC130-251 to IN. \n12.  Observe the light by looking straight down into the housing            of DS5.", "11. Place S5 on PC130-251 to IN. 12. Observe the light by looking straight down into the housing of DS5."], "jumps": ["P13340", "P13320", "P13335"]}, {"id": "P13340", "text": ["What color is DS5 emitting?", "What color is DS5 emitting? typed.........................."], "jumps": ["P13330"]}, {"id": "P13341", "text": [], "jumps": []}, {"id": "P13342", "text": ["Ensure that switch S5, bottom left switch on the card, is placed to the IN position.  DS5 should NOT be emitting red light.", "Ensure that switch S5, bottom left switch on the card, is placed to the IN position. DS5 should NOT be emitting red light."], "jumps": []}, {"id": "P13343", "text": ["Ensure that switch S5, bottom left switch on the card, is placed to the IN position.  DS5 should NOT be emitting green light.", "Ensure that switch S5, bottom left switch on the card, is placed to the IN position. DS5 should NOT be emitting green light."], "jumps": []}, {"id": "P13344", "text": ["Ensure that switch S5, bottom left switch on the card, is placed to the IN position.  DS5 should NOT be emitting amber light.", "Ensure that switch S5, bottom left switch on the card, is placed to the IN position. DS5 should NOT be emitting amber light."], "jumps": []}, {"id": "P13345", "text": ["Ensure that switch S5, bottom left switch on the card, is placed to the IN position.  DS5 should be emitting visible light.", "Ensure that switch S5, bottom left switch on the card, is placed to the IN position. DS5 should be emitting visible light."], "jumps": []}, {"id": "P13350", "text": ["13.  Place S5 to OUT on PC130-251.\n       The incandescent lamp is producing both photometric and            radiometric energy.  The wavelengths that are produced                  cause the lamp to emit white light, all light frequencies.", "13. Place S5 to OUT on PC130-251. The incandescent lamp is producing both photometric and radiometric energy. The wavelengths that are produced cause the lamp to emit white light, all light frequencies........"], "jumps": ["P13360", "P13340", "P13355"]}, {"id": "P13360", "text": ["Now that you have seen the outputs of various light transmitters, let's measure the required voltage to overcome the barrier potential in the LEDs."], "jumps": ["P13370", "P13350"]}, {"id": "P13370", "text": ["To overcome the barrier potential of a silicon diode approximately 0.6 VDC is required.  A germanium diode requires around 0.3 VDC.", "To overcome the barrier potential of a silicon diode approximately 0.6 VDC is required. A germanium diode requires around 0.3 VDC."], "jumps": ["P13375", "P13360"]}, {"id": "P13375", "text": ["The voltage values shown are for the LEDs used by PC130-251. Light emitting diodes are widely varied in size and electrical characteristics."], "jumps": ["P13380", "P13360"]}, {"id": "P13380", "text": ["1.  Ensure S1 through S5 are OUT on PC130-251.", "1. Ensure S1 through S5 are OUT on PC130-251. o the MOD position."], "jumps": ["P13400", "P13360", "P13385"]}, {"id": "P13400", "text": ["2.  Connect a DC voltmeter to the ground TP and TP1 on \n      PC130-251.", "2. Connect a DC voltmeter to the ground TP and TP1 on PC130-251."], "jumps": ["P13410", "P13380", "P13405"]}, {"id": "P1100", "text": ["Current flow can also be measured with S6 in the MOD position by inserting an ampmeter in the circuit between TP7 and ground."], "jumps": ["P1110", "P1030"]}, {"id": "P14790", "text": ["7.  Using the multimeter set to measure voltage, connect the red        probe to the top lead of R10.  Leave the black probe at the \n     ground TP.  Use alligator clips; the connection will remain \n     during the testing of the phototransistor.", "7. Using the multimeter set to measure voltage, connect the red probe to the top lead of R10. Leave the black probe at the ground TP. Use alligator clips; the connection will remain during the testing of the phototransistor.", "AMMETER CONNECTION - Connect ammeter between TP7 and ground."], "jumps": ["P14800", "P14780", "P14795"]}, {"id": "P13410", "text": ["3.  Place S1 to IN on PC130-251.\n     This allows the meter to read the voltage drop developed                across DS1.", "3. Place S1 to IN on PC130-251. This allows the meter to read the voltage drop developed across DS1."], "jumps": ["P13430", "P13400", "P13415", "P"]}, {"id": "P13430", "text": ["Type in the measured voltage for DS1.", "Type in the measured voltage for DS1.3 tries, storing numeric answer (5) in a variable.able.le."], "jumps": ["P13410", "P13435", "P13432"]}, {"id": "P13431", "text": [], "jumps": []}, {"id": "P13432", "text": ["Your voltage measurement is not within the acceptable limits. Ensure that you are reading around 1.75 volts on the multimeter and that S1 on PC130-251 is to the IN position."], "jumps": []}, {"id": "P13433", "text": ["You still have not measured the correct voltage.  You should have measured around 1.75 volts.", "You still have not measured the correct voltage. You should have measured around 1.75 volts.", "MULTIMETER SETUP - Connect multimeter between TP1 and ground."], "jumps": ["P13430", "PutVar", "P"]}, {"id": "P13440", "text": ["4.  Place S1 Out and S2 In.\n     This connects DS2 to the power source.", "4. Place S1 Out and S2 In. This connects DS2 to the power source.................", "PC130-251 SETUP - S1 - Out S2 - In"], "jumps": ["P13460", "P13430", "P13445"]}, {"id": "P13460", "text": ["5.  Using the multimeter, measure the voltage across the green           LED from TP2  to ground.  When typing in your answer round        to the nearest tenth.  Type in the measured voltage for DS2?", "5. Using the multimeter, measure the voltage across the green LED from TP2 to ground. When typing in your answer round to the nearest tenth. Type in the measured voltage for DS2??"], "jumps": ["P13440", "P13465", "P13462"]}, {"id": "P13461", "text": [], "jumps": []}, {"id": "P13462", "text": ["Your voltage measurement is not within the acceptable limits. Ensure that S2 on PC130-251 is set to the IN position."], "jumps": []}, {"id": "P13463", "text": ["You still have not measured the correct voltage.  You should have measured around 2.2 volts.", "You still have not measured the correct voltage. You should have measured around 2.2 volts.", "MULTIMETER SETUP - Connect multimeter between TP2 and ground."], "jumps": ["P13460", "PutVar", "P"]}, {"id": "P13470", "text": ["6.  Place S2 to OUT and S3 to IN on PC130-251.\n     This connects DS3 to the power source.", "6. Place S2 to OUT and S3 to IN on PC130-251. This connects DS3 to the power source...........", "PC130-251 SETUP - S2 - Out S3 - In"], "jumps": ["P13490", "P13460", "P13475"]}, {"id": "P13490", "text": ["7.  Using the multimeter, measure the voltage across the amber           LED from TP3 to ground.  When typing in your answer round         to the nearest tenth.  Type in the measured voltage for DS3?", "7. Using the multimeter, measure the voltage across the amber LED from TP3 to ground. When typing in your answer round to the nearest tenth. Type in the measured voltage for DS3??"], "jumps": ["P13470", "P13495", "P13492"]}, {"id": "P13491", "text": [], "jumps": []}, {"id": "P13492", "text": ["Your voltage measurement is not within the acceptable limits. Ensure that S3 on PC130-251 is set to the IN position."], "jumps": []}, {"id": "P13493", "text": ["You still have not measured the correct voltage.  You should have measured around 2.0 volts.", "You still have not measured the correct voltage. You should have measured around 2.0 volts.", "MULTIMETER SETUP - Connect multimeter between TP3 and ground."], "jumps": ["P13490", "PutVar"]}, {"id": "P13500", "text": ["8.  Place S3 to OUT on PC130-251.\n     You have measured the voltage drop across the three                      photometric LEDs.  Let's compare them.", "8. Place S3 to OUT on PC130-251. You have measured the voltage drop across the three photometric LEDs. Let's compare them..............."], "jumps": ["P13510", "P13490", "P13505"]}, {"id": "P13510", "text": ["Notice the different voltage drops for each of the LEDs.", "Notice the different voltage drops for each of the LEDs.drop. drop. DS1 = @%20 volts DS2 = @%21 volts DS3 = @%22 volts", "Vk(DS1) = Vk(DS2) = Vk(DS3) = @%22 volts 22 volts %22 volts", "1.0 V %22 volts 2 volts @%22 volts 22 volts 22 volts", "1.0 V %22 volts 22 volts @%22 volts 22 volts 22 volts"], "jumps": ["P13520", "P13500"]}, {"id": "P13520", "text": ["However, they are all above the voltage drops found in silicon and germanium diodes (approximately 0.6 and 0.3 volts, respectively)."], "jumps": ["P13530", "P13510"]}, {"id": "P13530", "text": ["Now, lets examine the infrared LED.  Remember, infrared (IR) LEDs do not produce visible light.", "Now, lets examine the infrared LED. Remember, infrared (IR) LEDs do not produce visible light."], "jumps": ["P13540", "P13510"]}, {"id": "P13540", "text": ["Ensure that S1 through S5 are OUT on PC130-251."], "jumps": ["P13550", "P13530"]}, {"id": "P13550", "text": ["2.  Place S4 on PC130-251 to IN.", "2. Place S4 on PC130-251 to IN............................"], "jumps": ["P13560", "P13540"]}, {"id": "P13560", "text": ["3.  Using the multimeter, measure the voltage across the IR LED        from TP4 to ground.  When typing in your answer round to the      nearest tenth.  Type in the measured voltage for DS4.", "3. Using the multimeter, measure the voltage across the IR LED from TP4 to ground. When typing in your answer round to the nearest tenth. Type in the measured voltage for DS4."], "jumps": ["P13550", "P13565", "P13562"]}, {"id": "P13561", "text": [], "jumps": []}, {"id": "P13562", "text": ["Your voltage measurement is not within the acceptable limits. Ensure that S4 on PC130-251 is set to the IN position."], "jumps": []}, {"id": "P13563", "text": ["You still have not measured the correct voltage.  You should have measured around 1.0 volts.", "You still have not measured the correct voltage. You should have measured around 1.0 volts.", "MULTIMETER CONNECTION - Connect multimeter between TP4 and ground."], "jumps": ["P13560", "PutVar"]}, {"id": "P13570", "text": ["4.  Place S4 to OUT on PC130-251.", "4. Place S4 to OUT on PC130-251..........................."], "jumps": ["P13580", "P13560"]}, {"id": "P13580", "text": ["Notice that the infrared LED has the lowest voltage drop of the luminescent light transmitters.", "Notice that the infrared LED has the lowest voltage drop of the luminescent light transmitters. DS1 = @%20 volts DS2 = @%21 volts DS3 = @%22 volts DS4 = @%23 volts", "Vk(DS1) = Vk(DS2) = Vk(DS3) = Vk(DS4) = volts %22 volts", "1.0 V %22 volts 2 volts @%22 volts 22 volts 22 volts", "1.0 V %22 volts 22 volts @%22 volts 22 volts 22 volts"], "jumps": ["P13590", "P13570"]}, {"id": "P13590", "text": ["But, the voltage drop of DS4 is still above standard diodes."], "jumps": ["P13600", "P13580"]}, {"id": "P13600", "text": ["Last, let's look at the incandescent lamp, DS5.", "Last, let's look at the incandescent lamp, DS5............."], "jumps": ["P13610", "P13580"]}, {"id": "P13610", "text": ["1.  Ensure that S1 through S5 are OUT on PC130-251.", "1. Ensure that S1 through S5 are OUT on PC130-251."], "jumps": ["P13620", "P13600"]}, {"id": "P13620", "text": ["2.  Place S5 to IN on PC130-251.", "2. Place S5 to IN on PC130-251............................"], "jumps": ["P13630", "P13610"]}, {"id": "P13630", "text": ["3.  Using the multimeter, measure the voltage across DS5 from            TP5 to ground.", "3. Using the multimeter, measure the voltage across DS5 from TP5 to ground.", "MULTIMETER CONNECTION - Connect multimeter between TP5 and ground."], "jumps": ["P13640", "P13620", "P13635"]}, {"id": "P13640", "text": ["Notice that the incandescent drops mainly all the applied voltages.  That's because the lamp is not a diode.", "Notice that the incandescent drops mainly all the applied voltages. That's because the lamp is not a diode."], "jumps": ["P13670", "P13630"]}, {"id": "P13670", "text": ["1.  Disconnect test equipment from the circuit.", "1. Disconnect test equipment from the circuit.settings...................."], "jumps": ["P13640"]}, {"id": "P13680", "text": ["2.  Turn main console Power to OFF.", "2. Turn main console Power to OFF. OFF.FF................................."], "jumps": []}, {"id": "P13690", "text": ["3.  Remove PC130-251 from the test console. \n4.  Return all equipment to the designated storage areas.", "3. Remove PC130-251 from the test console. 4. Return all equipment to the designated storage areas."], "jumps": ["P13910", "P13680"]}, {"id": "P14430", "text": ["to P.DIODE. 2. Press Enter to disable the Negative Po This isolates PD1 for testing.", "1. Place S8 on PC130-251 to P.DIODE. 2. Press Enter to set the Negative Power Supply - 0. This disables Q2 and isolates PD1 for testing."], "jumps": ["P14440", "P14420", "P14435"]}, {"id": "P14020", "text": ["In this experiment, you will observe the operation and measure the characteristics of typical light receivers.", "The light receivers are mounted on the right hand side of the PC130-251 experiment card."], "jumps": ["P14030", "P2001", "P14040", "P14020", "P"]}, {"id": "P14040", "text": ["The photocell circuit consists of PC1 and a common collector amplifier Q1."], "jumps": ["P14050", "P14030"]}, {"id": "P14050", "text": ["Switch S7 isolates the photocell when in the TEST position."], "jumps": ["P14060", "P14040"]}, {"id": "P14060", "text": ["The photodiode and photovoltaic circuit consist of PD1, PV1, and Q2."], "jumps": ["P14070", "P14040"]}, {"id": "P14070", "text": ["S8 selects which light receiver is connected to the amplifier.  It also is used for isolation purposes.", "S8 selects which light receiver is connected to the amplifier. It also is used for isolation purposes."], "jumps": ["P14080", "P14060"]}, {"id": "P14080", "text": ["The phototransistor circuit consists of PT1 and Q3.", "The phototransistor circuit consists of PT1 and Q3........."], "jumps": ["P14090", "P14060"]}, {"id": "P14090", "text": ["S9 isolates the light receiver when in the TEST position.  R10 controls sensitivity.", "Now, pick up the PC130-251 card.", "S9 isolates the light receiver when in the TEST position. R10 controls sensitivity.", "Now, pick up the PC130-251 card............................"], "jumps": ["P14100", "P14080", "P14110", "P"]}, {"id": "P14110", "text": ["The four black housings on the right hold the light receivers.  They are also used for the fiberoptic connection.", "The four black housings on the right hold the light receivers. They are also used for the fiberoptic connection."], "jumps": ["P14120", "P14100"]}, {"id": "P14160", "text": ["The grip is where you place your fingers to insert and remove the cable from the connectors on the PC card."], "jumps": ["P14170", "P14100"]}, {"id": "P14170", "text": ["Always use the grip to prevent damage to the cable when inserting and removing the cable."], "jumps": ["P14180", "P14160"]}, {"id": "P14180", "text": ["The lock is used to snap and hold the probe in the connector."], "jumps": ["P14190", "P14160"]}, {"id": "P14760", "text": ["2.  Firmly snap one end of the fiberoptic cable into the                           phototransistor housing,  bottom right housing.\n3.  Firmly snap the other end of the fiberoptic cable into the DS1,        red LED, housing.", "2. Firmly snap one end of the fiberoptic cable into the phototransistor housing, bottom right housing. 3. Firmly snap the other end of the fiberoptic cable into the DS1, red LED, housing."], "jumps": ["P14770", "P14750", "P14765"]}, {"id": "P14800", "text": ["The voltmeter is connected across R11, the 1 Kohm emitter resistor for PT1.  R11 is used as a sampling resistor to measure current. Remember, when emitter and collector current increase, the voltage drop across R11 will increase and vice versa.", "The voltmeter is connected across R11, the 1 Kohm emitter resistor for PT1. R11 is used as a sampling resistor to measure current. Remember, when emitter and collector current increase, the voltage drop across R11 will increase and vice versa."], "jumps": ["P14810", "P14790"]}, {"id": "P14820", "text": ["9.  Place S1 on PC130-251 IN, to the right.", "9. Place S1 on PC130-251 IN, to the right................."], "jumps": ["P14830", "P14810", "P14825"]}, {"id": "P14861", "text": [], "jumps": []}, {"id": "P14200", "text": ["Let's start the experiment!", "Let's start the experiment!e..............................."], "jumps": ["P14210", "P14190"]}, {"id": "P14210", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P14200"]}, {"id": "P14220", "text": ["2.  Press Enter to Set: Positive and Negative Supply Voltages- 15", "2. Press Enter to Set: Positive and Negative Supply Voltages- 155........."], "jumps": []}, {"id": "P14240", "text": ["3.  Insert PC130-251 into the PC1 connectors on the test                       console.", "3. Insert PC130-251 into the PC1 connectors on the test console."], "jumps": ["P14250"]}, {"id": "P14250", "text": ["4.  Set the switches on PC130-251 as follows:\n     S1 through S5 - Out\n     S6 - fixed \n     S7 through S9 - to the left", "4. Set the switches on PC130-251 as follows: S1 through S5 - Out S6 - fixed S7 through S9 - to the left", "PC130-251 SETUP - S1 through S5 - OUT, to the left S6 - Fixed S7 through S9 - to the left"], "jumps": ["P14260", "P14240", "P14255"]}, {"id": "P14260", "text": ["5.  Press Enter to Set: PC1 DC Power Switch - ON", "5. Press Enter to Set: PC1 DC Power Switch - ON..........................."], "jumps": ["P14250"]}, {"id": "P14270", "text": ["The light transmitters and light receivers are now set up to operate.  Let's measure the characteristics of a photocell first. Remember, a photocell changes resistance according to the intensity of light received.", "The light transmitters and light receivers are now set up to operate. Let's measure the characteristics of a photocell first. Remember, a photocell changes resistance according to the intensity of light received.."], "jumps": ["P14280"]}, {"id": "P14280", "text": ["6.  Ensure S7 is set to TEST, to the left. \n7.  Set the multimeter to measure high resistance (20 MW range          on the Nida 488 multimeter), using alligator clips connect the         probes to TP8 and ground.", "6. Ensure S7 is set to TEST, to the left. 7. Set the multimeter to measure high resistance (20 MW range on the Nida 488 multimeter), using alligator clips connect the probes to TP8 and ground."], "jumps": ["P14290", "P14270"]}, {"id": "P14290", "text": ["With S7 set to test, the photocell is isolated from the circuit.  With the multimeter connected between TP8 and ground, it will measure the resistance of PC1.", "With S7 set to test, the photocell is isolated from the circuit. With the multimeter connected between TP8 and ground, it will measure the resistance of PC1."], "jumps": ["P14300", "P14280"]}, {"id": "P14300", "text": ["8.  Firmly snap one end of the fiberoptic cable into the photocell         housing, top housing. \n9.  Firmly snap the other end of the fiberoptic cable into the DS1,        red LED, housing.", "8. Firmly snap one end of the fiberoptic cable into the photocell housing, top housing. 9. Firmly snap the other end of the fiberoptic cable into the DS1, red LED, housing.", "FIBEROPTIC CONNECTION - Fiberoptic cable between DS1 and PC1."], "jumps": ["P14310", "P14280", "P14305"]}, {"id": "P14310", "text": ["Notice that the ohmmeter is measuring a very high resistance, an open.  With S1 on PC130-251 OUT, no light is being transmitted. The light receiver is not receiving light, or a dark condition.", "Notice that the ohmmeter is measuring a very high resistance, an open. With S1 on PC130-251 OUT, no light is being transmitted. The light receiver is not receiving light, or a dark condition."], "jumps": ["P14320", "P14300"]}, {"id": "P14320", "text": ["10.  Place S1 on PC130-251 to IN, to the right. \n11.  Lower the OHMS range of the multimeter.", "10. Place S1 on PC130-251 to IN, to the right. 11. Lower the OHMS range of the multimeter."], "jumps": ["P14330", "P14310", "P14325"]}, {"id": "P14330", "text": ["12.  Observe the ohmmeter reading.\n        Notice that the resistance decreased from an open to a                    measurable value.  The photocell is receiving light.", "12. Observe the ohmmeter reading. Notice that the resistance decreased from an open to a measurable value. The photocell is receiving light.................."], "jumps": ["P14340", "P14320"]}, {"id": "P14340", "text": ["13.  Press Enter to Set: Positive and Negative  Supply Voltages- 0", "13. Press Enter to Set: Positive and Negative Supply Voltages- 0........."], "jumps": ["P14330"]}, {"id": "P14350", "text": ["14.  Step the Positive Power Supply while observing the                          ohmmeter.\n        This increases the voltage applied to the light transmitter,               red LED, which increases its intensity.", "14. Step the Positive Power Supply while observing the ohmmeter. This increases the voltage applied to the light transmitter, red LED, which increases its intensity.............."], "jumps": []}, {"id": "P14360", "text": ["As the intensity of the red LED increased, what happened to the resistance of the photocell?"], "jumps": []}, {"id": "P14361", "text": [], "jumps": []}, {"id": "P14362", "text": ["When the voltage applied to the red LED increased, the light output increased.  The resistance of the photocell did not increase.", "When the voltage applied to the red LED increased, the light output increased. The resistance of the photocell did not increase."], "jumps": []}, {"id": "P14363", "text": ["When the voltage applied to the red LED increased, the light output increased.  The resistance of the photocell did not stay the same.", "When the voltage applied to the red LED increased, the light output increased. The resistance of the photocell did not stay the same."], "jumps": []}, {"id": "P14150", "text": ["The fiberoptic cable is made of fibers that reflect light.  Light entering one end of the cable is reflected to the other end, light transmission.", "The fiberoptic cable is made of fibers that reflect light. Light entering one end of the cable is reflected to the other end, light transmission."], "jumps": ["P14160", "P14100"]}, {"id": "P14380", "text": ["16.  Place S1 through S5 on PC130-251 to IN.  This energizes all            five light transmitters.", "16. Place S1 through S5 on PC130-251 to IN. This energizes all five light transmitters."], "jumps": ["P14390", "P14385"]}, {"id": "P14390", "text": ["17.  While observing the ohmmeter, connect the fiberoptic cable           to each of the five light transmitters, DS1 through DS5.                     Note the resistance reading of the photocell for each light               transmitter.  The IR LED has a high resistance reading and             you will have to change the range of the ohmmeter.", "17. While observing the ohmmeter, connect the fiberoptic cable to each of the five light transmitters, DS1 through DS5. Note the resistance reading of the photocell for each light transmitter. The IR LED has a high resistance reading and you will have to change the range of the ohmmeter.."], "jumps": ["P14400", "P14380"]}, {"id": "P14400", "text": ["Which light source is the photocell most sensitive to; that is, which source measures the least resistance?", "Which light source is the photocell most sensitive to; that is, which source measures the least resistance?????"], "jumps": ["P14390"]}, {"id": "P14401", "text": [], "jumps": []}, {"id": "P14402", "text": ["The resistance of the photocell when connected to the red LED is higher than when connected to another light source.  The photocell does not have the highest sensitivity to red.", "The resistance of the photocell when connected to the red LED is higher than when connected to another light source. The photocell does not have the highest sensitivity to red."], "jumps": []}, {"id": "P14403", "text": ["The resistance of the photocell when connected to the green LED is higher than when connected to another light source.  The photocell does not have the highest sensitivity to green.", "The resistance of the photocell when connected to the green LED is higher than when connected to another light source. The photocell does not have the highest sensitivity to green."], "jumps": []}, {"id": "P14404", "text": ["The resistance of the photocell when connected to the amber LED is higher than when connected to another light source.  The photocell does not have the highest sensitivity to amber.", "The resistance of the photocell when connected to the amber LED is higher than when connected to another light source. The photocell does not have the highest sensitivity to amber."], "jumps": []}, {"id": "P14405", "text": ["The resistance of the photocell when connected to the IR LED is higher than when connected to another light source.  The photocell does not have the highest sensitivity to infrared.", "The resistance of the photocell when connected to the IR LED is higher than when connected to another light source. The photocell does not have the highest sensitivity to infrared."], "jumps": []}, {"id": "P14410", "text": ["15.  Disconnect the multimeter and fiberoptic cable from the                  circuit.  \n 16.  Place S1 through S5 on PC130-251 to OUT.", "15. Disconnect the multimeter and fiberoptic cable from the circuit. 16. Place S1 through S5 on PC130-251 to OUT."], "jumps": ["P14420", "P14400"]}, {"id": "P14420", "text": ["The next light receiver to test is the photodiode.  Remember, a photodiode changes its current flow according to the intensity of the light.", "The next light receiver to test is the photodiode. Remember, a photodiode changes its current flow according to the intensity of the light."], "jumps": ["P14430", "P14410"]}, {"id": "P14710", "text": ["12.  While observing the voltmeter, connect the fiberoptic cable             to each of the 4 LED transmitters, DS1 through DS4.", "12. While observing the voltmeter, connect the fiberoptic cable to each of the 4 LED transmitters, DS1 through DS4.", "PC130-251 SETUP - S8 to P.Diodeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"], "jumps": ["P14720", "P14700", "P"]}, {"id": "P14440", "text": ["3.  Using the multimeter set to measure voltage, connect the red        probe to TP13 and the black probe to the ground TP.  Use               alligator clips, the connection will remain during the testing of       the photodiode.", "3. Using the multimeter set to measure voltage, connect the red probe to TP13 and the black probe to the ground TP. Use alligator clips, the connection will remain during the testing of the photodiode.", "MULTIMETER CONNECTIONS - Red probe - TP13 Black probe - Ground"], "jumps": ["P14450", "P14430", "P14445", "P"]}, {"id": "P14450", "text": ["The voltmeter is connected across R7.  This will give an indication of the current produced by the photodiode. Remember, if current increases, the voltage drop across R7 will increase and vice versa.", "The voltmeter is connected across R7. This will give an indication of the current produced by the photodiode. Remember, if current increases, the voltage drop across R7 will increase and vice versa.."], "jumps": ["P14460", "P14440"]}, {"id": "P14460", "text": ["4.  Firmly snap one end of the fiberoptic cable into the                           photodiode housing, second from top. \n5.  Firmly snap the other end of the fiber fiberoptic cable into the        DS1, red LED, housing.", "4. Firmly snap one end of the fiberoptic cable into the photodiode housing, second from top. 5. Firmly snap the other end of the fiber fiberoptic cable into the DS1, red LED, housing.", "FIBEROPTIC CONNECTION - Fiberoptic cable betwee let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
