e LED illuminates, the               applied voltage is sufficient to overcome the barrier potential.", "11. Move S6 to MOD. Connect the ammeter between TP6 and ground. Slowly adjust the Positive Voltage control clockwise until the green just begins to LED illuminate. You should be measuring around 0.2 mA. When the LED illuminates, the applied voltage is sufficient to overcome the barrier potential............................", "When the LED illuminates, the applied voltage is sufficient to overcome the barrier potential..........................."], "jumps": ["P1460", "P1440"]}, {"id": "P301", "text": [], "jumps": []}, {"id": "P331", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will observe the operation of typical light transmitters and receivers."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["In the first part of the experiment, you will measure the voltage and current characteristics of photometric and radiometric light transmitters."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["You will use luminescent red, green, amber, & infrared LEDs, and  an incandescent lamp.", "You will use luminescent red, green, amber, & infrared LEDs, and an incandescent lamp.."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["In the second part of the experiment, you will measure the characteristics of light receivers."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["You will use a photocell, photodiode, photovoltaic, and phototransistor."], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["Finally, you will apply an analog signal to a light transmitter and see the results on the output of a light receiver."], "jumps": ["P470", "P440"]}, {"id": "P470", "text": ["Let's Begin the Lesson on LIGHT TRANSDUCER OPERATION......................"], "jumps": ["P440"]}, {"id": "P2900", "text": ["Which light source is the phototransistor least sensitive to; that is, which source measures the lowest current?"], "jumps": ["P2890"]}, {"id": "P14120", "text": ["In this part of the experiment, you will connect different light transmitters to the light receivers using the fiberoptic cable."], "jumps": ["P14130", "P14100"]}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1020", "text": ["In this experiment, you will observe the operation and measure signals in typical light transmitters."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["The light transmitters are mounted on the left hand side of the PC130-251 experiment card, labeled DS1 through DS5."], "jumps": ["P1020", "P1040"]}, {"id": "P15170", "text": ["The output of the phototransistor is also the 100 Hz signal but a series of positive-going pulses as the phototransistor conducts only when forward biased.  Adjust the potentiometer to reduce or increase the amount of clipping on the output waveform.", "The output of the phototransistor is also the 100 Hz signal but a series of positive-going pulses as the phototransistor conducts only when forward biased. Adjust the potentiometer to reduce or increase the amount of clipping on the output waveform........."], "jumps": ["P15180", "P15160"]}, {"id": "P1050", "text": ["Each light transmitter has a separate power switch, S1 through S5."], "jumps": ["P1060", "P1030"]}, {"id": "P1060", "text": ["S6 controls the type of input that can be applied to the transmitters."], "jumps": ["P1070", "P1030"]}, {"id": "P1070", "text": ["When set to FIXED, a ground is applied to the cathodes of DS1 through DS4."], "jumps": ["P1080", "P1030"]}, {"id": "P1080", "text": ["In this setting, the DC voltage to each transmitter is fixed and the transmitters produce a steady light output.", "In this setting, the DC voltage to each transmitter is fixed and the transmitters produce a steady light output....."], "jumps": ["P1090", "P1030"]}, {"id": "P1090", "text": ["When S6 is set to MOD, an external signal source can be connected to TP7 and used to modulate the light transmitters."], "jumps": ["P1100", "P1030"]}, {"id": "P15910", "text": ["This completes the experiment on LIGHT RECEIVERS.", "Now, pick up the PC130-251 card.", "This completes the experiment on LIGHT RECEIVERS.LE........", "Now, pick up the PC130-251 card............................"], "jumps": ["P2001", "P15220", "P1120", "P1030", "P"]}, {"id": "P1120", "text": ["The five black housings hold the light transmitters and are used to connect the fiberoptic cable."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["Note that the red LED is the top light source and the incandescent lamp is the bottom light source."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["Switches S1 through S5 are the power switches to each light transmitter."], "jumps": ["P1150", "P1110"]}, {"id": "P1150", "text": ["S6 is located on the bottom left of the card."], "jumps": ["P1160", "P1110"]}, {"id": "P1160", "text": ["Let's start the experiment!", "Let's start the experiment!e..............................."], "jumps": ["P1170", "P1110"]}, {"id": "P1170", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P1160"]}, {"id": "P1180", "text": ["2.  Set Voltmeter switch to positive. \n3.  Set the Positive supply voltage to 15 volts.", "2. Set Voltmeter switch to positive. 3. Set the Positive supply voltage to 15 volts."], "jumps": ["P1170"]}, {"id": "P1190", "text": ["4.  Carefully plug PC130-251 into the Test Console PC1 position.", "4. Carefully plug PC130-251 into the Test Console PC1 position. to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P1180"]}, {"id": "P1200", "text": ["5.  On PC130-251, set the controls as follows:\n     S1 through S5 - Out, to the left \n     S6 - FIXED \n     S7 through S9 - to the left", "5. On PC130-251, set the controls as fol age to 0 volts. This applies 0 volts to the light transmitters.."], "jumps": ["P1380"]}, {"id": "P1400", "text": ["5.  Connect an ammeter between the ground TP and TP6 on \n     PC130-251.  Connect the red lead to TP6 and the black\n     lead to ground.", "5. Connect an ammeter between the ground TP and TP6 on PC130-251. Connect the red lead to TP6 and the black lead to ground....he rest of the experiment.", "PC130-251 SETUP - S2 - Out S3 - In S6 - Mod"], "jumps": ["P1410", "P1390", "P1405"]}, {"id": "P1410", "text": ["6.  Place S1 to IN on PC130-251.  This connects DS1, the red               LED, to the power source.", "6. Place S1 to IN on PC130-251. This connects DS1, the red LED, to the power source."], "jumps": ["P1420", "P1400", "P1415"]}, {"id": "P1420", "text": ["7.  Slowly adjust the Positive Voltage control clockwise until the        red LED just begins to illuminate.  You should be measuring          around 0.4 mA.  When the LED illuminates, the applied voltage      is sufficient to overcome the barrier potential.", "7. Slowly adjust the Positive Voltage control clockwise until the red LED just begins to illuminate. You should be measuring around 0.4 mA. When the LED illuminates, the applied voltage is sufficient to overcome the barrier potential.................................."], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["8.  Next, move S6 to the FIXED position and measure the voltage \n     across the red LED from TP1 to TP6.  When typing in your \n     answer round to the nearest tenth.  Type in the measured \n     voltage, Vk, for DS1.", "8. Next, move S6 to the FIXED position and measure the voltage across the red LED from TP1 to TP6. When typing in your answer round to the nearest tenth. Type in the measured voltage, Vk, for DS1.............."], "jumps": ["P1420", "P1432", "P1435"]}, {"id": "P1431", "text": [], "jumps": []}, {"id": "P1470", "text": ["13.  Return the Positive Voltage control to fully counter-                          clockwise.\n14.  Place S2 to OUT and S3 to IN on PC130-251.  Move S6 to\n       MOD and connect the ammeter between TP6 and ground.\n       The next measurement will be DS3.", "13. Return the Positive Voltage control to fully counter- clockwise. 14. Place S2 to OUT and S3 to IN on PC130-251. Move S6 to MOD and connect the ammeter between TP6 and ground. The next measurement will be DS3......................................."], "jumps": ["P1460", "P1475", "P1480"]}, {"id": "P1433", "text": ["You still have not measured the correct Vk voltage.  You should have measured around 1.5 volts.", "You still have not measured the correct Vk voltage. You should have measured around 1.5 volts....", "MULTIMETER SETUP - Connect multimeter between TP1 and TP6."], "jumps": ["P1430"]}, {"id": "P1440", "text": ["9.  Return the Positive Voltage control to fully counter-                          clockwise. \n10.  Place S1 to OUT and S2 to IN on PC130-251.  This connects           DS2 to the power source.", "9. Return the Positive Voltage control to fully counter- clockwise. 10. Place S1 to OUT and S2 to IN on PC130-251. This connects DS2 to the power source.....", "PC130-251 SETUP - S1 - Out S2 - In"], "jumps": ["P1450", "P1430", "P1445"]}, {"id": "P1610", "text": ["1.  Ensure that S1 through S5 are OUT on PC130-251. \n2.  Move S6 to MOD.  Connect the ammeter between TP6 and              ground TP.", "1. Ensure that S1 through S5 are OUT on PC130-251. 2. Move S6 to MOD. Connect the ammeter between TP6 and ground TP."], "jumps": ["P1620", "P1600"]}, {"id": "P1460", "text": ["12.  Move S6 to FIXED and measure the voltage across the green\n       LED from TP2 to TP6.  When typing in your answer round to \n       the nearest tenth.  Type in the measured voltage, Vk, for DS2.", "12. Move S6 to FIXED and measure the voltage across the green LED from TP2 to TP6. When typing in your answer round to the nearest tenth. Type in the measured voltage, Vk, for DS2...................................... measured the correct Vk voltage.  You should have measured around 1.8 volts.", "PC130-251 SETUP - Connect multimeter between TP3 and TP6.", "You still have not measured the correct Vk voltage. You should have measured around 1.8 volts."], "jumps": ["P1490"]}, {"id": "P1500", "text": ["17.  Place S3 to OUT on PC130-251. \n18.  Return the Positive Voltage control fully counterclockwise.             You have measured the voltage necessary to overcome the           barrier potential of the three photometric LEDs.  Let's                       compare them.", "17. Place S3 to OUT on PC130-251. 18. Return the Positive Voltage control fully counterclockwise. You have measured the voltage necessary to overcome the barrier potential of the three photometric LEDs. Let's compare them..."], "jumps": ["P1490", "P1505", "P1510"]}, {"id": "P1510", "text": ["Notice that each different color of LED has a different VK value.", "Notice that each different color of LED has a different VK value. (DS1) = @%20 volts Vk(DS2) = @%21 volts Vk(DS3) = @%22 volts", "Vk(DS1) = Vk(DS2) = Vk(DS3) = @%22 volts 22 volts %22 volts", "1.0 V %22 volts 2 volts @%22 volts 22 volts 22 volts", "1.0 V %22 volts 22 volts @%22 volts 22 volts 22 volts"], "jumps": ["P1520", "P1500"]}, {"id": "P1520", "text": ["However, they are all above the Vk needed for silicon and germanium diodes (approximately 0.6 and 0.3 volts)."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["Now, let's examine the infrared LED.  Remember, infrared (IR) LEDs do not produce visible light.", "Now, let's examine the infrared LED. Remember, infrared (IR) LEDs do not produce visible light..."], "jumps": ["P1540", "P1510"]}, {"id": "P1540", "text": ["1.  Ensure that S1 through S5 are OUT on PC130-251. \n2.  Connect the ampmeter between TP6 and ground TP. Move S6\n     to  the MOD position.", "1. Ensure that S1 through S5 are OUT on PC130-251. 2. Connect the ampmeter between TP6 and ground TP. Move S6 to the MOD position."], "jumps": ["P1550", "P1530"]}, {"id": "P1550", "text": ["3.  Place S4 on PC130-251 to IN. \n4.  Slowly adjust the Positive Voltage control clockwise until the        ammeter reads 0.2 mA.", "3. Place S4 on PC130-251 to IN. 4. Slowly adjust the Positive Voltage control clockwise until the ammeter reads 0.2 mA."], "jumps": ["P1560", "P1540"]}, {"id": "P1560", "text": ["5.  Move S6 to FIXED.  Measure the voltage across the IR LED \n     from TP4 to TP6.  When typing in your answer round to the \n     nearest tenth.  Type in the measured voltage, Vk, for DS4.", "5. Move S6 to FIXED. Measure the voltage across the IR LED from TP4 to TP6. When typing in your answer round to the nearest tenth. Type in the measured voltage, Vk, for DS4.........................."], "jumps": ["P1550", "P1562", "P1565"]}, {"id": "P1561", "text": [], "jumps": []}, {"id": "P1492", "text": ["Your voltage measurement is not within the acceptable limits. Connect the ammeter between TP6 and ground, make sure that S3 is in the IN position, S6 on MOD, and that you are reading around 0.2 mA on the ammeter before again measuring the voltage at TP3.", "Your voltage measurement is not within the acceptable limits. Connect the ammeter between TP6 and ground, make sure that S3 is in the IN position, S6 on MOD, and that you are reading around 0.2 mA on the ammeter before again measuring the voltage at TP3.."], "jumps": []}, {"id": "P1563", "text": ["You still have not measured the correct Vk voltage.  You should have measured around 1.0 volts.", "You still have not measured the correct Vk voltage. You should have measured around 1.0 volts.", "MULTIMETER CONNECTION - Connect multimeter between TP4 and TP6."], "jumps": ["P1560"]}, {"id": "P1570", "text": ["6.  Place S4 to OUT on PC130-251. \n7.  Return the Positive Voltage control fully counterclockwise.", "6. Place S4 to OUT on PC130-251. 7. Return the Positive Voltage control fully counterclockwise."], "jumps": ["P1580", "P1560"]}, {"id": "P1580", "text": ["Notice that the infrared LED has the lowest Vk of the luminescent light transmitters.", "Notice that the infrared LED has the lowest Vk of the luminescent light transmitters. Vk(DS1) = @%20 volts Vk(DS2) = @%21 volts Vk(DS3) = @%22 volts @%23 volts 23 volts", "Vk(DS1) = Vk(DS2) = Vk(DS3) = Vk(DS4) = volts %22 volts", "1.0 V %22 volts 2 volts @%22 volts 22 volts 22 volts", "1.0 V %22 volts 22 volts @%22 volts 22 volts 22 volts"], "jumps": ["P1570"]}, {"id": "P1590", "text": ["But, the Vk of DS4 is still above standard diodes."], "jumps": ["P1600", "P1580"]}, {"id": "P1600", "text": ["Last, let's look at the incandescent lamp, DS5.", "Last, let's look at the incandescent lamp, DS5............."], "jumps": ["P1610", "P1580"]}, {"id": "P1610", "text": ["1.  Ensure that S1 through S5 are OUT on PC130-251. \n2.  Ensure that the ammeter is still connected between TP7 and          ground TP.", "1. Ensure that S1 through S5 are OUT on PC130-251. 2. Ensure that the ammeter is still connected between TP7 and ground TP."], "jumps": ["P1620", "P1600"]}, {"id": "P1620", "text": ["3.  Place S5 to IN on PC130-251. \n4.  Slowly adjust the Positive Voltage control clockwise while              observing the ammeter.", "3. Place S5 to IN on PC130-251. 4. Slowly adjust the Positive Voltage control clockwise while observing the ammeter."], "jumps": ["P1630", "P1610"]}, {"id": "P1630", "text": ["Notice that current flows immediately.  An incandescent lamp is not a diode.", "Notice that current flows immediately. An incandescent lamp is not a diode."], "jumps": ["P1640", "P1620"]}, {"id": "P1640", "text": ["5.  Move S6 to FIXED and measure the voltage across DS5 from\n     TP5 to TP6.", "5. Move S6 to FIXED and measure the voltage across DS5 from TP5 to TP6.", "MULTIMETER CONNECTION - Connect multimeter between TP5 and TP6."], "jumps": ["P1650", "P1630", "P1645"]}, {"id": "P1650", "text": ["6.  Slowly adjust the Positive Voltage control while observing the      voltmeter.  Compare the voltmeter reading with the voltmeter         reading on the test console.", "6. Slowly adjust the Positive Voltage control while observing the voltmeter. Compare the voltmeter reading with the voltmeter reading on the test console.."], "jumps": ["P1660", "P1640"]}, {"id": "P1660", "text": ["Notice that most of the applied voltage is dropped across the lamp.  This is different from the LED where only Vk is dropped. An incandescent lamp and LED operate different, but they both produce light.", "Notice that most of the applied voltage is dropped across the lamp. This is different from the LED where only Vk is dropped. An incandescent lamp and LED operate different, but they both produce light.."], "jumps": ["P1670", "P1650"]}, {"id": "P1670", "text": ["1.  Disconnect test equipment from the circuit. \n2.  Return the test console controls to their Initial Control                      Settings.", "1. Disconnect test equipment from the circuit. 2. Return the test console controls to their Initial Control Settings."], "jumps": ["P1660"]}, {"id": "P1680", "text": ["3.  Turn main console Power to OFF.", "3. Turn main console Power to OFF. OFF...................."], "jumps": ["P1670"]}, {"id": "P1690", "text": ["4.  Remove PC130-251 from the test  console. \n5.  Return all equipment to the designated storage areas.", "4. Remove PC130-251 from the test console. 5. Return all equipment to the designated storage areas."], "jumps": ["P1910", "P1680"]}, {"id": "P1462", "text": ["Your voltage measurement is not within the acceptable limits. Connect the ammeter between TP6 and ground, make sure that S2 is in the IN position, S6 in MOD, and that you are reading around 0.4 mA on the ammeter before again measuring the voltage at TP2.", "Your voltage measurement is not within the acceptable limits. Connect the ammeter between TP6 and ground, make sure that S2 is in the IN position, S6 in MOD, and that you are reading around 0.4 mA on the ammeter before again measuring the voltage at TP2.."], "jumps": []}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["In this experiment, you will observe the operation and measure the characteristics of typical light receivers.", "The light receivers are mounted on the right hand side of the PC130-251 experiment card."], "jumps": ["P2030", "P2001", "P2040", "P2020", "P"]}, {"id": "P2040", "text": ["The photocell circuit consists of PC1 and a common collector amplifier Q1."], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["Switch S7 isolates the photocell when in the TEST position."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["The photodiode and photovoltaic circuit consist of PD1, PV1, and Q2."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["S8 selects which light receiver is connected to the amplifier.  It also is used for isolation purposes.", "S8 selects which light receiver is connected to the amplifier. It also is used for isolation purposes."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["The phototransistor circuit consists of PT1 and Q3.", "The phototransistor circuit consists of PT1 and Q3........."], "jumps": ["P2090", "P2060"]}, {"id": "P2090", "text": ["S9 isolates the light receiver when in the TEST position.  R10 controls sensitivity.", "Now, pick up the PC130-251 card.", "S9 isolates the light receiver when in the TEST position. R10 controls sensitivity.", "Now, pick up the PC130-251 card............................"], "jumps": ["P2100", "P2080", "P2110", "P"]}, {"id": "P2110", "text": ["The four black housing on the right hold the light receivers.  They are also used for the fiberoptic connection.", "The four black housing on the right hold the light receivers. They are also used for the fiberoptic connection."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["In this part of the experiment, you will connect different light transmitters to the light receivers using the fiberoptic cable."], "jumps": ["P2130", "P2100"]}, {"id": "P2130", "text": ["The photocell is the top light receiver and the phototransistor is the bottom light receiver."], "jumps": ["P2150", "P2100"]}, {"id": "P2150", "text": ["The fiberoptic cable is made of fibers that reflect light.  Light entering one end of the cable is reflected to the other end, light transmission.", "The fiberoptic cable is made of fibers that reflect light. Light entering one end of the cable is reflected to the other end, light transmission."], "jumps": ["P2160", "P2100"]}, {"id": "P2160", "text": ["The grip is where you place your fingers to insert and remove the cable from the connectors on the PC card."], "jumps": ["P2170", "P2100"]}, {"id": "P2170", "text": ["Always use the grip to prevent damage to the cable when inserting and removing the cable."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["The lock is used to snap and hold the probe in the connector."], "jumps": ["P2190", "P2160"]}, {"id": "P2190", "text": ["The probe houses the end of the fiber cable.  Look at the end of the probe and you can see the fibers.", "The probe houses the end of the fiber cable. Look at the end of the probe and you can see the fibers."], "jumps": ["P2200", "P2160"]}, {"id": "P2200", "text": ["Let's start the experiment!", "Let's start the experiment!e..............................."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P2200"]}, {"id": "P2220", "text": ["2.  Set the Voltmeter switch to Positive. \n3.  Set the Positive Voltage control to 15 volts.", "2. Set the Voltmeter switch to Positive. 3. Set the Positive Voltage control to 15 volts."], "jumps": ["P2210"]}, {"id": "P2240", "text": ["4.  Insert PC130-251 into the PC1 connectors on the test console.", "4. Insert PC130-251 into the PC1 connectors on the test console."], "jumps": ["P2250", "P2220"]}, {"id": "P2250", "text": ["5.  Set the switches on PC130-251 as follows: \n     S1 through S5 - Out  \n     S6 - fixed \n     S7 through S9 - to the left", "5. Set the switches on PC130-251 as follows: S1 through S5 - Out S6 - fixed S7 through S9 - to the left", "PC130-251 SETUP - S1 through S5 - OUT, to the left S6 - Fixed S7 through S9 - to the left"], "jumps": ["P2260", "P2240", "P2255"]}, {"id": "P2260", "text": ["6.  Place the PC1 Power switch to ON.", "6. Place the PC1 Power switch to ON. to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2250"]}, {"id": "P2270", "text": ["The light transmitters and light receivers are now set up to operate.  Let's measure the characteristics of a photocell first. Remember, a photocell changes resistance according to the intensity of light received.", "The light transmitters and light receivers are now set up to operate. Let's measure the characteristics of a photocell first. Remember, a photocell changes resistance according to the intensity of light received.."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["7.  Ensure S7 is set to TEST, to the left. \n8.  Set the multimeter to measure high resistance (20 M range on        the Nida 488 multimeter), using alligator clips connect the               probes to TP8 and ground.", "7. Ensure S7 is set to TEST, to the left. 8. Set the multimeter to measure high resistance (20 M range on the Nida 488 multimeter), using alligator clips connect the probes to TP8 and ground."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["With S7 set to test, the photocell is isolated from the circuit.  With the multimeter connected between TP8 and ground, it will measure the resistance of PC1.", "With S7 set to test, the photocell is isolated from the circuit. With the multimeter connected between TP8 and ground, it will measure the resistance of PC1."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["9.  Firmly snap one end of the fiberoptic cable into the photocell         housing, top housing.  \n10.  Firmly snap the other end of the fiberoptic cable into the                 DS1, red LED, housing.", "9. Firmly snap one end of the fiberoptic cable into the photocell housing, top housing. 10. Firmly snap the other end of the fiberoptic cable into the DS1, red LED, housing.", "FIBEROPTIC CONNECTION - Fiberoptic cable between DS1 and PC1."], "jumps": ["P2310", "P2280", "P2305"]}, {"id": "P2310", "text": ["Notice that the ohmmeter is measuring a very high resistance, an open.  With S1 on PC130-251 OUT, no light is being transmitted. The light receiver is not receiving light, this is a dark condition.", "Notice that the ohmmeter is measuring a very high resistance, an open. With S1 on PC130-251 OUT, no light is being transmitted. The light receiver is not receiving light, this is a dark condition..."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["11.  Place S1 on PC130-251 to IN, to the right. \n12.  Lower the OHMS range of the multimeter.", "11. Place S1 on PC130-251 to IN, to the right. 12. Lower the OHMS range of the multimeter."], "jumps": ["P2330", "P2310", "P2325"]}, {"id": "P2330", "text": ["13.  Observe the ohmmeter reading.  Notice that the resistance             decreased from an open to a measurable value.  The                         photocell is receiving light.", "13. Observe the ohmmeter reading. Notice that the resistance decreased from an open to a measurable value. The photocell is receiving light.."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["14.  Place the Voltmeter Switch to positive. \n15.  Rotate the Positive Voltage control fully counterclockwise.", "14. Place the Voltmeter Switch to positive. 15. Rotate the Positive Voltage control fully counterclockwise. eaker switch to ON........................................."], "jumps": ["P2330"]}, {"id": "P2350", "text": ["16.  Slowly rotate the Positive Voltage control clockwise while               observing the ohmmeter.  This increases the voltage applied         to the light transmitter, red LED, which increases its intensity.", "16. Slowly rotate the Positive Voltage control clockwise while observing the ohmmeter. This increases the voltage applied to the light transmitter, red LED, which increases its intensity."], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["As the intensity of the red LED increased, what happened to the resistance of the photocell?"], "jumps": ["P2350"]}, {"id": "P2361", "text": [], "jumps": []}, {"id": "P2362", "text": ["When the voltage applied to the red LED increased, the light output increased.  The resistance of the photocell did not increase.", "When the voltage applied to the red LED increased, the light output increased. The resistance of the photocell did not increase."], "jumps": []}, {"id": "P2363", "text": ["When the voltage applied to the red LED increased, the light output increased.  The resistance of the photocell did not stay the same.", "When the voltage applied to the red LED increased, the light output increased. The resistance of the photocell did not stay the same."], "jumps": []}, {"id": "P2370", "text": ["17.  Return the Positive Voltage control to 15 volts.", "17. Return the Positive Voltage control to 15 volts. C switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2360"]}, {"id": "P2380", "text": ["18.  Place S1 through S5 on PC130-251 to IN.  This energizes all            five light transmitters.", "18. Place S1 through S5 on PC130-251 to IN. This energizes all five light transmitters."], "jumps": ["P2390", "P2370", "P2385"]}, {"id": "P2390", "text": ["19.  While observing the ohmmeter, connect the fiberoptic cable           to each of the five light transmitters, DS1 through DS5.  Note          the resistance reading of the photocell for each light                         transmitter.  The IR LED has a high resistance reading and             you will have to change the range of the ohmmeter.", "19. While observing the ohmmeter, connect the fiberoptic cable to each of the five light transmitters, DS1 through DS5. Note the resistance reading of the photocell for each light transmitter. The IR LED has a high resistance reading and you will have to change the range of the ohmmeter."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["Which light source is the photocell most sensitive to; that is, which source measures the least resistance?", "Which light source is the photocell most sensitive to; that is, which source measures the least resistance?????"], "jumps": ["P2390"]}, {"id": "P2401", "text": [], "jumps": []}, {"id": "P2402", "text": ["The resistance of the photocell when connected to the red LED is higher than when connected to another light source.  The photocell does not have the highest sensitivity to red.", "The resistance of the photocell when connected to the red LED is higher than when connected to another light source. The photocell does not have the highest sensitivity to red."], "jumps": []}, {"id": "P2403", "text": ["The resistance of the photocell when connected to the green LED is higher than when connected to another light source.  The photocell does not have the highest sensitivity to green.", "The resistance of the photocell when connected to the green LED is higher than when connected to another light source. The photocell does not have the highest sensitivity to green."], "jumps": []}, {"id": "P2404", "text": ["The resistance of the photocell when connected to the amber LED is higher than when connected to another light source.  The photocell does not have the highest sensitivity to amber.", "The resistance of the photocell when connected to the amber LED is higher than when connected to another light source. The photocell does not have the highest sensitivity to amber."], "jumps": []}, {"id": "P2405", "text": ["The resistance of the photocell when connected to the IR LED is higher than when connected to another light source.  The photocell does not have the highest sensitivity to infrared.", "The resistance of the photocell when connected to the IR LED is higher than when connected to another light source. The photocell does not have the highest sensitivity to infrared."], "jumps": []}, {"id": "P2410", "text": ["18.  Disconnect the multimeter and fiberoptic cable from the                   circuit. \n19.  Place S1 through S5 on PC130-251 to OUT.", "18. Disconnect the multimeter and fiberoptic cable from the circuit. 19. Place S1 through S5 on PC130-251 to OUT."], "jumps": ["P2420", "P2370"]}, {"id": "P2420", "text": ["The next light receiver to test is the photodiode.  Remember, a photodiode changes its current flow according to the intensity of the light.", "The next light receiver to test is the photodiode. Remember, a photodiode changes its current flow according to the intensity of the light."], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["1.  Place S8 on PC130-251 to P.DIODE. \n2.  Ensure the negative power supply is OFF.  This isolates PD1\n     for testing.", "1. Place S8 on PC130-251 to P.DIODE. 2. Ensure the negative power supply is OFF. This isolates PD1 for testing..", "PC130-251 SETUP - S8 to P.Diodeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"], "jumps": ["P2440", "P2420", "P2435", "P"]}, {"id": "P2440", "text": ["3.  Using the multimeter set to measure voltage, connect the red        probe to TP13 and the black probe to the ground TP.  Use               alligator clips, the connection will remain during the testing            of the photodiode.", "3. Using the multimeter set to measure voltage, connect the red probe to TP13 and the black probe to the ground TP. Use alligator clips, the connection will remain during the testing of the photodiode.", "MULTIMETER CONNECTIONS - Red probe - TP13 Black probe - Ground"], "jumps": ["P2450", "P2430", "P2445", "P"]}, {"id": "P2450", "text": ["The voltmeter is connected across R7.  This will give an indication of the current produced by the photodiode. Remember, if current increases, the voltage drop across R7 will increase and vice versa.", "The voltmeter is connected across R7. This will give an indication of the current produced by the photodiode. Remember, if current increases, the voltage drop across R7 will increase and vice versa.."], "jumps": ["P2460", "P2440"]}, {"id": "P2460", "text": ["4.  Firmly snap one end of the fiberoptic cable into the                           photodiode housing, second from top.\n5.  Firmly snap the other end of the fiberoptic cable into the DS1,        red LED, housing.", "4. Firmly snap one end of the fiberoptic cable into the photodiode housing, second from top. 5. Firmly snap the other end of the fiberoptic cable into the DS1, red LED, housing.", "FIBEROPTIC CONNECTION - Fiberoptic cable between DS1 and PD1."], "jumps": ["P2470", "P2440", "P2465", "P"]}, {"id": "P2470", "text": ["Notice that the voltmeter is measuring a very small voltage, \nclose to 0 volts, which indicates no current flow.  With S1 on\nPC130-251 OUT, no light is being transmitted.  The light receiver is not receiving light, this is a dark condition.", "Notice that the voltmeter is measuring a very small voltage, close to 0 volts, which indicates no current flow. With S1 on PC130-251 OUT, no light is being transmitted. The light receiver is not receiving light, this is a dark condition."], "jumps": ["P2480", "P2460"]}, {"id": "P2480", "text": ["6.  Place S1 on PC130-251 to IN, to the right.", "6. Place S1 on PC130-251 to IN, to the right."], "jumps": ["P2490", "P2470", "P2485", "P"]}, {"id": "P2490", "text": ["7.  Observe the voltmeter reading.  Notice that the voltage                      increased.  This indicates that current through the                             photodiode increased.  The photodiode is receiving light.", "7. Observe the voltmeter reading. Notice that the voltage in light receivers can send and receive an analog signal (information)."], "jumps": ["P3020", "P3000"]}, {"id": "P3020", "text": ["1. Set the switches on PC130-251 as follows: S1 - IN S2 through S5 - OUT S6 - MOD S7 and S9 - OPERATE S8 - P.DIODE", "PC130-251 SETUP - S1 - IN S2 through S5 - OUT S6 - MOD S7 and S9 - OPERATE S8 - P.DIODE"], "jumps": ["P3030", "P3010", "P3025", "P"]}, {"id": "P3030", "text": ["2.  Adjust the Negative Voltage control to -10 volts. \n3.  Adjust the Positive Voltage control to +10 volts.", "2. Adjust the Negative Voltage control to -10 volts. 3. Adjust the Positive Voltage control to +10 volts. itch to ON........................................."], "jumps": ["P3020"]}, {"id": "P3040", "text": ["4.  Connect the main output of the function generator to the                  INPUT SIGNAL BNC.  This connects the output of the                       function generator to TP7 on PC130-251.", "4. Connect the main output of the function generator to the INPUT SIGNAL BNC. This connects the output of the function generator to TP7 on PC130-251........", "FUNCTION GENERATOR CONNECTION - Main output of function generator to INPUT SIGNAL BNC."], "jumps": ["P3030", "P3045"]}, {"id": "P3050", "text": ["5.  Set the output of the function generator to a 100 Hz sine wave       signal at mid amplitude.", "5. Set the output of the function generator to a 100 Hz sine wave signal at mid amplitude."], "jumps": ["P3040"]}, {"id": "P3060", "text": ["6.  Firmly snap one end of the fiberoptic cable into the photocell         housing, top right housing. \n7.  Firmly snap the other end of the fiberoptic cable into the DS1,        red LED, housing.", "6. Firmly snap one end of the fiberoptic cable into the photocell housing, top right housing. 7. Firmly snap the other end of the fiberoptic cable into the DS1, red LED, housing.", "FIBEROPTIC CONNECTION - Fiberoptic cable connected between DS1 and PC1."], "jumps": ["P3050", "P3065", "P"]}, {"id": "P3070", "text": ["The 100 Hz
