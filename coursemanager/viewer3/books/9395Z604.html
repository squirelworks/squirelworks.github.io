<script>
const book = {"title": "9395Z604", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: AIRCRAFT POWERPLANTSsdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Understand the fundamentals of propellers.", "w Describe the principles and operation of internal combustion engines.", "w Describe the principles and operation of jet propulsion engines.............."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["Aircraft power plants are made of mechanical components."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Different configurations and types of mechanical parts determine the engine classification."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["The aircraft reciprocating engine has remained basically the same since the Wright Brothers flew their first powered airplane in 1903."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["The engines then and now use cylinders, pistons, valves, camshafts, and crankshafts."], "jumps": ["P440", "P420", "P"]}, {"id": "P440", "text": ["Gas turbine engines were introduced to the world of aviation in Germany August 27, 1939."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["Let's begin the lesson on AIRCRAFT POWERPLANTS............................"], "jumps": ["P440"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The reciprocating engine is made of mechanical and non-mechanical parts.", "Mechanical Valves Pistons Camshaft Crankshaft Connecting Rod", "Non Mechanical Cylinder Manifold Engine Block Cylinder Headng Rod"], "jumps": ["P1025", "P1001"]}, {"id": "P1025", "text": ["Mechanical parts are moving parts.  The engines mechanical parts are listed below.", "Mechanical parts are moving parts. The engines mechanical parts are listed below."], "jumps": ["P1030", "P1020"]}, {"id": "P1030", "text": ["Non-mechanical parts are components that do not move.  The non-mechanical parts are listed below.  Let's examine the engine parts.", "The engine block is a non-mechanical component.  It supports mechanical parts and holds the engine cylinders.", "The cylinders are also called combustion chambers.  These are non-mechanical components that are bolted to the engine block.  Cylinders are a round sleeve with cooling fins.", "Non-mechanical parts are components that do not move. The non-mechanical parts are listed below. Let's examine the engine parts.", "The engine block is a non-mechanical component. It supports mechanical parts and holds the engine cylinders.", "The cylinders are also called combustion chambers. These are non-mechanical components that are bolted to the engine block. Cylinders are a round sleeve with cooling fins."], "jumps": ["P1040", "P1020", "P1050", "P1060"]}, {"id": "P1060", "text": ["Each cylinder has a piston inside.  Pistons are moving or mechanical parts.  Pressure in the combustion chamber moves the piston up and down.  This type of straight up and down movement is called linear motion.", "Each cylinder has a piston inside. Pistons are moving or mechanical parts. Pressure in the combustion chamber moves the piston up and down. This type of straight up and down movement is called linear motion."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["The pistons are linked to a connecting rod which fastens them to a crankshaft.  The connecting rods and crankshaft are also considered mechanical.", "The pistons are linked to a connecting rod which fastens them to a crankshaft. The connecting rods and crankshaft are also considered mechanical."], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["The crankshaft is attached to the lower end of the connecting rod.  The pistons up and down movement cause the crankshaft to move in a rotary motion.", "The crankshaft is attached to the lower end of the connecting rod. The pistons up and down movement cause the crankshaft to move in a rotary motion."], "jumps": ["P1100", "P1070"]}, {"id": "P1100", "text": ["The arrangement converts the linear movement of the piston to rotational movement of the crankshaft.  The crankshaft delivers the power to rotate the propeller.", "The arrangement converts the linear movement of the piston to rotational movement of the crankshaft. The crankshaft delivers the power to rotate the propeller."], "jumps": ["P1110", "P1070"]}, {"id": "P1110", "text": ["Valves open and close making them mechanical components.", "Valves open and close making them mechanical components...."], "jumps": ["P1120", "P1070"]}, {"id": "P1120", "text": ["The intake valves let the air-fuel mixture, from the fuel system, flow into the combustion chamber."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["The exhaust valve opens to allow the burned gases to escape the combustion chamber as the piston moves upward."], "jumps": ["P1150", "P1110"]}, {"id": "P1150", "text": ["A camshaft is a rotating shaft that turns at 1/2 of the engines speed.  It is used to drive other engine components such as the    magneto, fuel pump and valves.  Since the camshaft is rotating and turning it is mechanical.", "A camshaft is a rotating shaft that turns at 1/2 of the engines speed. It is used to drive other engine components such as the magneto, fuel pump and valves. Since the camshaft is rotating and turning it is mechanical."], "jumps": ["P1160", "P1110"]}, {"id": "P1160", "text": ["The camshaft is driven by the crankshaft.  Because of this, the camshaft opens and closes the valves at the correct time and        sequence.", "The camshaft is driven by the crankshaft. Because of this, the camshaft opens and closes the valves at the correct time and sequence."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["What component joins the pistons to the crankshaft?", "What component joins the pistons to the crankshaft?........"], "jumps": ["P1150"]}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1172", "text": ["The pistons are not directly mounted to the crankshaft.", "The pistons are not directly mounted to the crankshaft....."], "jumps": []}, {"id": "P1173", "text": ["The camshaft is a rotating shaft that drives the fuel pump and magnetos."], "jumps": []}, {"id": "P1180", "text": ["What mechanism opens and closes the valves?", "What mechanism opens and closes the valves?................"], "jumps": ["P1170"]}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1182", "text": ["The crankshaft is moved by the pistons and is used to drive the camshaft and propeller."], "jumps": []}, {"id": "P1183", "text": ["Cylinders are located in the engine block and contain the pistons."], "jumps": []}, {"id": "P1190", "text": ["The cylinder head is bolted through the cylinder to the block and contains the engine valves and spark plugs."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["The spark plug is located at the top of the cylinder in the cylinder head and is used for igniting the air-fuel mixture."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["The intake manifold provides a passage way from the fuel system (carburetor) to the intake valves located in the engine head."], "jumps": ["P1220", "P1190"]}, {"id": "P1220", "text": ["The exhaust manifold provides a passage way from the exhaust valves to a common exhaust pipe."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["Now that you have seen the components of the internal combustion engine, lets put it in motion to get a better understanding of how it works."], "jumps": ["P1240", "P1210"]}, {"id": "P1240", "text": ["The piston moves downward drawing in the air-fuel mixture from the intake manifold through the open intake valve.  This is called the intake stroke.", "The piston moves downward drawing in the air-fuel mixture from the intake manifold through the open intake valve. This is called the intake stroke."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["The movement of the piston rotates the crankshaft and the crankshaft rotates the camshaft.  When the piston reaches the bottom, the camshaft closes the intake valve.", "The movement of the piston rotates the crankshaft and the crankshaft rotates the camshaft. When the piston reaches the bottom, the camshaft closes the intake valve."], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["The piston moves upward and compresses the air-fuel mixture. This is called the compression stroke."], "jumps": ["P1270", "P1230"]}, {"id": "P1270", "text": ["Just as the piston reaches the top of the cylinder the spark plug ignites the fuel.  The piston is pushed towards the bottom by the  expanding burning fuel. This is called the power stroke.", "Just as the piston reaches the top of the cylinder the spark plug ignites the fuel. The piston is pushed towards the bottom by the expanding burning fuel. This is called the power stroke."], "jumps": ["P1280", "P1230"]}, {"id": "P1280", "text": ["When the piston is at the bottom and starts to move upward, the camshaft opens the exhaust valve and allows the burned gases to be vented.  This is called the exhaust stroke.", "Since most engines have more than one cylinder, the power stroke of each cylinder is sequenced in order to keep the crankshaft rotating continuously.", "When the piston is at the bottom and starts to move upward, the camshaft opens the exhaust valve and allows the burned gases to be vented. This is called the exhaust stroke."], "jumps": ["P1290", "P1230", "P1300"]}, {"id": "P1300", "text": ["So far we have looked at in-line horizontally-opposed reciprocating engines which are typical in small general aviation aircraft.", "So far we have looked at in-line horizontally-opposed reciprocating engines which are typical in small general aviation aircraft.ronger, lighter metals make the engine last longer."], "jumps": ["P1310", "P1230"]}, {"id": "P1310", "text": ["To get more power from these engines, more cylinders need to be added. Adding cylinders requires a larger engine block which adds considerable weight to the engine.ne last longer."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["Radial engines were invented as a way of adding additional cylinders without increasing the weight. Radial engines have an odd number of cylinders mounted on a small cicrcular crankcase, like spokes on a wagon wheel..."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["9 cylinder radial engines can produce up to 1,000 horsepower and are capable of powering large aircraft."], "jumps": ["P1340", "P1320", "P", "P4", "PZ", "PP"]}, {"id": "P1340", "text": ["Adding more rows of cylinders to a radial engine does not significantly increase the weight of the engine."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["Internally, pistons on a radial engine are attached to a master rod with link rods. The number one piston is usually attached to the master rod and all the other pistons are connected to the number one rod via link rods.."], "jumps": ["P1360", "P1340", "P0", "P"]}, {"id": "P1360", "text": ["Like the in-line engine, radial engines have pushrods, cams, and valves to direct the fuel / air mixture into the cylinder and the exhaust gasses out of the cylinders. Radial engine operation is quite similar to in-line engines..."], "jumps": ["P1370", "P1350", "P0", "P"]}, {"id": "P1370", "text": ["Advances in technology have improved the engine. Ignition and fuel systems are designed better, making them more efficient and stronger. Lighter metals make the engine last longer."], "jumps": ["P1910", "P1360", "P"]}, {"id": "P1910", "text": ["This completes the information on RECIPROCATING ENGINES.", "This completes the information on RECIPROCATING ENGINES.NES."], "jumps": ["P1001", "P1300"]}, {"id": "P1920", "text": ["1.  The piston is the moving component in the combustion                   chamber which is linked to the connecting rod.  It moves in an       up and down motion, this is one of the many things that help         the engine run.", "1. The piston is the moving component in the combustion chamber which is linked to the connecting rod. It moves in an up and down motion, this is one of the many things that help the engine run."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  The intake valves let the air-fuel mixture, from the fuel system,        flow into the combustion chamber.  The exhaust valve opens        to allow the burned gases to escape the combustion chamber       as the piston moves upward.", "2. The intake valves let the air-fuel mixture, from the fuel system, flow into the combustion chamber. The exhaust valve opens to allow the burned gases to escape the combustion chamber as the piston moves upward."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  A camshaft is a rotating shaft that turns at 1/2 of the engines          speed.  It is used to drive other engine components such as           the magneto, fuel pump and valves.", "3. A camshaft is a rotating shaft that turns at 1/2 of the engines speed. It is used to drive other engine components such as the magneto, fuel pump and valves."], "jumps": ["P1999", "P1930"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1940"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["If a toy balloon was inflated and released, it would fly through the air till it was completely deflated.  This is a simple form of jet propulsion.", "If a toy balloon was inflated and released, it would fly through the air till it was completely deflated. This is a simple form of jet propulsion."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["The air in the balloon is under pressure and forced to exit a small opening.  When the air is forced through the small opening the      balloon is pushed in the opposite direction.", "The air in the balloon is under pressure and forced to exit a small opening. When the air is forced through the small opening the balloon is pushed in the opposite direction."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["Newton's law best describes the reaction of the balloon and the development of jet propulsion.", "For every action, there is an equal and opposite reaction.", "Newton's law best describes the reaction of the balloon and the development of jet propulsion. (GRAPHIC TEXT) or every action, there is an equal and opposite reaction."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["If a conventional engine and propeller are enclosed in a case that has a more narrow exit than entry, the air flow is forced through a smaller opening causing propulsion."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["Today's gas turbine engines use one of two air compressor types to force air through the casing; centrifugal and axial compressors."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["The term centrifugal means the air is being compressed by centrifugal force.  The air enters the center of the impeller and is thrown outward towards the jet casing.", "The term centrifugal means the air is being compressed by centrifugal force. The air enters the center of the impeller and is thrown outward towards the jet casing."], "jumps": ["P2076", "P2060"]}, {"id": "P2075", "text": ["CENTRIFUGAL FORCE - A force that pulls or impels objects out from the center of rotation. When a car travels around a curve it is pulled to the outside of the curve, this is caused by centrifugal force."], "jumps": []}, {"id": "P2076", "text": ["The compressed air coming from the compressor is mixed with fuel and ignited initially by an ignitor plug in the combustion chamber. Once the fuel is firstignited, it maintains its own ignition..."], "jumps": ["P2080", "P2070"]}, {"id": "P2080", "text": ["Burning fuel expands rapidly and is forced out of the combustion chamber creating a high pressure of gases in the engine."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["The narrow exhaust chamber directs the high pressure gases to the rear of the engine at a high velocity (high speed)."], "jumps": ["P2100", "P2070"]}, {"id": "P2100", "text": ["To drive the centrifugal-flow compressor a turbine is placed at a point where the high pressure gases start to enter the exhaust chamber."], "jumps": ["P2110", "P2070"]}, {"id": "P2110", "text": ["The high velocity gases cross over the turbine blades and cause the turbines to rotate.  This works much like the wind driving a windmill.", "The high velocity gases cross over the turbine blades and cause the turbines to rotate. This works much like the wind driving a windmill."], "jumps": ["P2120", "P2070"]}, {"id": "P2120", "text": ["A row of stationary fins called nozzle vanes direct the gases into the turbine blades."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["The cup of the blades catch the fast moving gases and pushes them away.  This action is similar to the way a sail of a boat is pushed by the wind.", "The cup of the blades catch the fast moving gases and pushes them away. This action is similar to the way a sail of a boat is pushed by the wind."], "jumps": ["P2140", "P2110"]}, {"id": "P2140", "text": ["The turbine may have more than one set of turbine blades, called stages.  A set of nozzle vanes are positioned before each stage.", "The turbine may have more than one set of turbine blades, called stages. A set of nozzle vanes are positioned before each stage."], "jumps": ["P2150", "P2110"]}, {"id": "P2150", "text": ["Newton's law states for every action, there is an equal and opposite reaction."], "jumps": ["P2140"]}, {"id": "P2151", "text": [], "jumps": []}, {"id": "P2152", "text": [], "jumps": []}, {"id": "P2160", "text": ["What increases the gas pressure in the gas turbine engine?", "What increases the gas pressure in the gas turbine engine?."], "jumps": ["P2150"]}, {"id": "P2161", "text": [], "jumps": []}, {"id": "P2162", "text": ["The turbine is used to drive the air compressor.  The turbine has a set of fixed nozzle vanes to direct the gases into the turbine stage or stages.", "The turbine is used to drive the air compressor. The turbine has a set of fixed nozzle vanes to direct the gases into the turbine stage or stages."], "jumps": []}, {"id": "P2170", "text": ["The axial-flow gas turbine engine uses a turbine fan (compressor) to draw air into the casing.  The air flow remains in a relatively straight path in line with the axis of the engine.", "The axial-flow gas turbine engine uses a turbine fan (compressor) to draw air into the casing. The air flow remains in a relatively straight path in line with the axis of the engine."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["The inlet pressure of the axial flow engine is greater than the centrifugal-flow, because of the ability to have more than one stage of turbine fans."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["Compressor blades are larger and are at more of an angle than the turbine blades used to drive the compressor."], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["Just like the centrifugal-flow, the axial-flow forces air into the combustion chamber with the burning fuel."], "jumps": ["P2210", "P2180"]}, {"id": "P2210", "text": ["The high pressure gas is exhausted through the drive turbine or turbines to drive the compressor."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["So far we have used a turbojet engine to study the principles of gas turbine engines.  There are many other variations of gas turbine engines manufactured today. The most common are; turbofan, turboprop, and turboshaft.", "So far we have used a turbojet engine to study the principles of gas turbine engines. There are many other variations of gas turbine engines manufactured today. The most common are; turbofan, turboprop, and turboshaft."], "jumps": ["P2910", "P2200"]}, {"id": "P2230", "text": ["Turbofan engines, like turbojet engines, producethrust by accelerating a mass of air. Turbofan engines have large blades in the first section of the compressor that act like a propeller. The large blades accelerate the majority of the air around the engine whiledirecting a small portion into the compressor. These engines are much more efficient than turbojet engines."], "jumps": ["P2240", "P2220", "P", "PJ", "PP", "PP6", "P6", "P66", "PP66"]}, {"id": "P2240", "text": ["Turboprop and turboshaft engines produce torque to drive propellers or helicopter rotors. They do this through a reduction gear box attached to a power turbine. The power turbine is located in the exhaust path of the engine and is turned by the escaping gases from the combustion chamber."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["The advantage of all gas turbine engines over reciprocating engines their power to weight ratio. Typical gas turbine engines can produce almost eight horsepower per pound MORE than reciprocating engines. This makes gas turbine engines the prime choice amongaircraft manufacturers and owners."], "jumps": ["P2910", "P2240", "P"]}, {"id": "P2910", "text": ["This completes the information on GAS TURBINE ENGINES.", "This completes the information on GAS TURBINE ENGINES.ES..."], "jumps": ["P2001", "P2220"]}, {"id": "P2920", "text": ["1.  Jet propulsion is created by enclosing a conventional engine         and propeller in a case that has a narrower backside.  This             forces entering air through a smaller exit.", "1. Jet propulsion is created by enclosing a conventional engine and propeller in a case that has a narrower backside. This forces entering air through a smaller exit. For every action, there is an equal and opposite reaction.", "For every action, there is an equal and opposite reaction."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2.  The term centrifugal means the air is being compressed by             centrifugal force.  The air enters the center of the impeller and        is thrown outward towards the jet casing.", "2. The term centrifugal means the air is being compressed by centrifugal force. The air enters the center of the impeller and is thrown outward towards the jet casing."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3.  Burning fuel is sprayed into the chamber with the large                    volume of air creating a high pressure of gases in the engine.", "3. Burning fuel is sprayed into the chamber with the large volume of air creating a high pressure of gases in the engine. )"], "jumps": ["P2950", "P2930"]}, {"id": "P2950", "text": ["4.  To drive the compressor a turbine is placed at a point where           the high pressure gases start to enter the exhaust chamber.", "4. To drive the compressor a turbine is placed at a point where the high pressure gases start to enter the exhaust chamber."], "jumps": ["P2960", "P2940"]}, {"id": "P2960", "text": ["5.  The turbine may have more than one set of turbine blades,              called stages.  A set of nozzle vanes are positioned before              each stage.", "5. The turbine may have more than one set of turbine blades, called stages. A set of nozzle vanes are positioned before each stage."], "jumps": ["P2970", "P2940"]}, {"id": "P2970", "text": ["6.  The axial-flow engine uses a turbine fan (compressor) to draw       air into the casing.  The air flow remains in a relatively straight       path in line with the axis of the engine.", "6. The axial-flow engine uses a turbine fan (compressor) to draw air into the casing. The air flow remains in a relatively straight path in line with the axis of the engine."], "jumps": ["P2999", "P2960"]}, {"id": "P2999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2970"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3020", "text": ["Internal combustion and turbo propeller jet engines need a propeller to utilize the engine power required to pull the aircraft through the air."], "jumps": ["P3030", "P3001"]}, {"id": "P3030", "text": ["The propeller normally consists of two or more blades and a central hub.  The hub attaches the blades to the engine crankshaft.", "The propeller normally consists of two or more blades and a central hub. The hub attaches the blades to the engine crankshaft."], "jumps": ["P3020"]}, {"id": "P3040", "text": ["The propeller blade has an airfoil shape similar to that of an aircraft wing and is considered to be a small rotating wing."], "jumps": ["P3030"]}, {"id": "P3050", "text": ["Air flows around the blade just as it flows around the wing of an aircraft, except the wing is lifted upward while the propeller blade is thrust forward."], "jumps": ["P3040"]}, {"id": "P3051", "text": ["There are five forces that act on the rotating propeller; Centrifugal, Torque Bending, Thrust Bending, Aerodynamic Twisting, and Centrifugal Twisting."], "jumps": ["P3040"]}, {"id": "P3052", "text": ["Centrifugal force is a physical force that tends to throw the rotating propeller blades away from the hub."], "jumps": ["P3051"]}, {"id": "P3053", "text": ["Torque bending force in the form of air resistance, bends the propeller blades opposite to the direction of rotation."], "jumps": ["P3051"]}, {"id": "P3054", "text": ["Thrust bending force is the thrust load that tends to bend propeller blades forward as the aircraft is pulled through the air."], "jumps": ["P3051"]}, {"id": "P3055", "text": ["Aerodynamic twisting force tends to turn the blades to a high blade angle."], "jumps": ["P3051"]}, {"id": "P3056", "text": ["Centrifugal twisting force being greater than the aerodynamic twisting force tries to force the blades toward a low blade angle."], "jumps": ["P3051"]}, {"id": "P3057", "text": ["A propeller must withstand severe stresses, which are greater near the hub, caused by centrifugal force and thrust.  As RPM increases the stresses are increased in proportion.", "A propeller must withstand severe stresses, which are greater near the hub, caused by centrifugal force and thrust. As RPM increases the stresses are increased in proportion."], "jumps": ["P3051"]}, {"id": "P3058", "text": ["The blade face is subject to centrifugal force and tension from bending.  This makes it very important that the blade face is free of scratches or nicks as these could have very serious consequences.", "The blade face is subject to centrifugal force and tension from bending. This makes it very important that the blade face is free of scratches or nicks as these could have very serious consequences."], "jumps": ["P3051"]}, {"id": "P3059", "text": ["The blade must also be rigid enough to prevent fluttering. Fluttering is a vibration in the ends of the blades which cause them to twist back and forth quickly."], "jumps": ["P3051"]}, {"id": "P3060", "text": ["Fluttering makes a distinctive noise often mistaken for exhaust noise.  Constant vibration weakens the blades and eventually causes failure.", "Fluttering makes a distinctive noise often mistaken for exhaust noise. Constant vibration weakens the blades and eventually causes failure."], "jumps": ["P3051"]}, {"id": "P3061", "text": ["When an airplane moves through the air a drag force is created. The drag opposes the forward motion of the aircraft."], "jumps": ["P3051"]}, {"id": "P3062", "text": ["To accomplish flight on a level path a force greater than the drag acting forward must be present.  This force is called thrust.", "To accomplish flight on a level path a force greater than the drag acting forward must be present. This force is called thrust."], "jumps": ["P3061"]}, {"id": "P3063", "text": ["The work done by thrust is equal to the thrust times the distance the plane moves."], "jumps": ["P3061"]}, {"id": "P3064", "text": ["Power expended by the thrust is equal to the thrust times the airplanes velocity."], "jumps": ["P3061"]}, {"id": "P3065", "text": ["The airplane engine supplies brake horsepower through a rotating shaft.  The propeller converts it to thrust horsepower.", "The airplane engine supplies brake horsepower through a rotating shaft. The propeller converts it to thrust horsepower.", "Rotational Force is converted to Forward Thrust Force."], "jumps": ["P3061"]}, {"id": "P3066", "text": ["Propeller efficiency is the ratio of thrust horsepower to brake horsepower.  The symbol used for propeller efficiency is the Greek letter e (eta).", "Propeller efficiency is the ratio of thrust horsepower to brake horsepower. The symbol used for propeller efficiency is the Greek letter e (eta)."], "jumps": ["P3065"]}, {"id": "P3067", "text": ["Propeller efficiency varies from 50% to 87% depending on the amount of propeller slip."], "jumps": ["P3065"]}, {"id": "P3070", "text": ["Propeller slip is the difference between the geometric pitch or angle of the propeller and its effective pitch."], "jumps": ["P3065"]}, {"id": "P3072", "text": ["For any single revolution of the propeller, the amount of air handled depends on the blade angle.  The blade angle determines how big a bite of air the propeller takes.", "For any single revolution of the propeller, the amount of air handled depends on the blade angle. The blade angle determines how big a bite of air the propeller takes. (GRAPHIC TEXT) a = Angle of attack (angle formed by relative wind and chord", "a = Angle of attack (angle formed by relative wind and chord b = Pitch or blade angle"], "jumps": ["P3070"]}, {"id": "P3073", "text": ["This makes the blade angle an excellent way of adjusting load on the propeller to control the engine RPM and the angle of attack of the propeller."], "jumps": ["P3072"]}, {"id": "P3074", "text": ["Low blade angle keeps the angle of attack small and efficient with respect to the relative wind.  It also allows the propeller to handle a smaller mass of air per revolution.", "Low blade angle keeps the angle of attack small and efficient with respect to the relative wind. It also allows the propeller to handle a smaller mass of air per revolution."], "jumps": ["P3072"]}, {"id": "P3075", "text": ["The light load created by the low blade angle allows the engine to turn at high RPM and convert the maximum amount of fuel into heat energy in a given time."], "jumps": ["P3072"]}, {"id": "P3076", "text": ["The high RPM also creates maximum thrust required for takeoff. Although the mass of air handled per revolution is small, the          revolutions per minute are many, the slipstream velocity is high and with low airplane speed the thrust is maximum.", "The high RPM also creates maximum thrust required for takeoff. Although the mass of air handled per revolution is small, the revolutions per minute are many, the slipstream velocity is high and with low airplane speed the thrust is maximum."], "jumps": ["P3072"]}, {"id": "P3080", "text": ["After liftoff and as airplane speed increases a high blade angle or pitch keeps the angle of attack small and efficient with respect to  the relative wind.", "After liftoff and as airplane speed increases a high blade angle or pitch keeps the angle of attack small and efficient with respect to the relative wind."], "jumps": ["P3072"]}, {"id": "P3081", "text": ["High blade angle increases the mass of air handled per revolution.  This decreases engine RPM, reducing fuel consumption and engine wear and keeps thrust at a maximum.", "High blade angle increases the mass of air handled per revolution. This decreases engine RPM, reducing fuel consumption and engine wear and keeps thrust at a maximum."], "jumps": ["P3072"]}, {"id": "P3082", "text": ["For climbing after takeoff, the power output or RPM of the engine is reduced by decreasing the engine manifold pressure and increasing the blade angle."], "jumps": ["P3072"]}, {"id": "P3083", "text": ["The angle of attack is kept small by the increase in blade angle."], "jumps": ["P3072"]}, {"id": "P3084", "text": ["The greater mass of air handled per second in this case is more than offset by the lower slipstream velocity and increase in airspeed."], "jumps": ["P3072"]}, {"id": "P3085", "text": ["When the airplane is in level flight and at cruising altitude less power is required."], "jumps": ["P3072"]}, {"id": "P3086", "text": ["The engine power or RPM is reduced by lowering the manifold pressure and increasing the blade angle.  This is the same process as that used for climbing after takeoff.", "The engine power or RPM is reduced by lowering the manifold pressure and increasing the blade angle. This is the same process as that used for climbing after takeoff."], "jumps": ["P3072"]}, {"id": "P3090", "text": ["Engineers design propellers to obtain the maximum performance from the power delivered by the engine under all conditions, such as takeoff, climb, cruising, and high speeds.", "Engineers design propellers to obtain the maximum performance from the power delivered by the engine under all conditions, such as takeoff, climb, cruising, and high speeds. (GRAPHIC TEXT) Flight Condition Blade Angle Angle of Attack Engine RPM Takeoff Low Small High After Liftoff Higher Small Decreases Climbing Higher Small Decreases", "Flight Condition Blade Angle Angle of Attack Engine RPM Takeoff Low Small High After Liftoff Higher Small Decreases Climbing Higher Small Decreases Cruising Higher Small Decreases"], "jumps": ["P3072"]}, {"id": "P3091", "text": ["Blade angle is usually measured in degrees.  It is the angle between the chord of the blade and the plane of rotation.", "a = Angle of attack (angle formed by relative wind and chord b = Pitch or blade angle", "Blade angle is usually measured in degrees. It is the angle between the chord of the blade and the plane of rotation."], "jumps": ["P3090"]}, {"id": "P3100", "text": ["An increase in blade angle _______", "An increase in blade angle _______.........................", "increases the angle of attack and decreases RPM."], "jumps": ["P3091"]}, {"id": "P3101", "text": [], "jumps": []}, {"id": "P3102", "text": ["The angle of attack should be kept small with respect to the relative wind."], "jumps": []}, {"id": "P3103", "text": ["Increased blade angle will reduce engine speed because the air mass handled per revolution is increased."], "jumps": []}, {"id": "P3110", "text": ["All propellers are classified under four general types.", "All propellers are classified under four general types. RAPHIC TEXT) Fixed Pitch Constant Pitch Adjustable Pitch Controllable Pitch", "Fixed Pitch Constant Pitch Adjustable Pitch Controllable Pitch"], "jumps": ["P3100"]}, {"id": "P3120", "text": ["The fixed pitch propeller is used of light aircraft.  It normally has two blades and one blade pitch.  They are often made of wood,     aluminum alloy or steel.", "The fixed pitch propeller is used of light aircraft. It normally has two blades and one blade pitch. They are often made of wood, aluminum alloy or steel."], "jumps": ["P3110"]}, {"id": "P3130", "text": ["The adjustable pitch propeller is constructed of aluminum alloy or steel and has two or more blades.  The blade pitch is set when the aircraft is on the ground with the engine off.", "The adjustable pitch propeller is constructed of aluminum alloy or steel and has two or more blades. The blade pitch is set when the aircraft is on the ground with the engine off."], "jumps": ["P3120"]}, {"id": "P3140", "text": ["The adjustment is accomplished by repositioning the blades inside the split center hub."], "jumps": ["P3150", "P3130"]}, {"id": "P3150", "text": ["The controllable pitch propeller has a pitch changing mechanism that can be operated manually, hydraulically or electrically.  The pilot is able to change the blade pitch during flight with the engine running.", "The controllable pitch propeller has a pitch changing mechanism that can be operated manually, hydraulically or electrically. The pilot is able to change the blade pitch during flight with the engine running."], "jumps": ["P3160", "P3130"]}, {"id": "P3160", "text": ["Normally the propeller is constructed of more than two blades and made of aluminum alloy, steel or a resin bonded material."], "jumps": ["P3170", "P3150"]}, {"id": "P3170", "text": ["A constant speed propeller has a hydraulically or electrically operated pitch mechanism which is controlled by an engine speed governor."], "jumps": ["P3175", "P3150"]}, {"id": "P3175", "text": ["The pilot sets the engine speed and the pitch mechanism automatically adjusts, controlling the pitch to keep the engine RPM from changing."], "jumps": ["P3180", "P3170"]}, {"id": "P3180", "text": ["When the airplane dives, the forward speed increases.  Reducing both lift and drag, causing the propeller to increase in speed.", "When the airplane dives, the forward speed increases. Reducing both lift and drag, causing the propeller to increase in speed."], "jumps": ["P3190", "P3170"]}, {"id": "P3190", "text": ["When the aircraft goes into a climb, the lift and drag is increased causing the propeller to decrease in speed."], "jumps": ["P3200", "P3180"]}, {"id": "P3200", "text": ["The constant speed or controlled pitch propellers would be used to maintain a certain speed during any condition."], "jumps": ["P3210", "P3180"]}, {"id": "P3210", "text": ["What type of propeller automatically maintains a set engine speed during changing conditions?"], "jumps": ["P3200"]}, {"id": "P3211", "text": [], "jumps": []}, {"id": "P3212", "text": ["The fixed pitch does not have the ability to be adjusted.", "The fixed pitch does not have the ability to be adjusted..."], "jumps": []}, {"id": "P3213", "text": ["Adjustable pitch settings are adjusted on the ground when the engine is not running."], "jumps": []}, {"id": "P3214", "text": ["The pilot is able to adjust controllable blade pitch during flight while the engines are running."], "jumps": []}, {"id": "P3220", "text": ["Feathering refers to the operation of rotating the blades of a propeller to a position of no drag for the purpose of stopping      rotation.", "Feathering refers to the operation of rotating the blades of a propeller to a position of no drag for the purpose of stopping rotation."], "jumps": ["P3230", "P3210"]}, {"id": "P3230", "text": ["This is helpful for creating less resistance and disturbance to air flow over the aircraft's wings during engine failure."], "jumps": ["P3240", "P3220"]}, {"id": "P3240", "text": ["If the failed engine is allowed to rotate, the engine could vibrate loose or overheat and set fire to the aircraft."], "jumps": ["P3910", "P3220"]}, {"id": "P3910", "text": ["This completes the information on PROPELLER FUNDAMENTALS.", "This completes the information on PROPELLER FUNDAMENTALS..."], "jumps": ["P3001", "P3240"]}, {"id": "P3920", "text": ["1.  An aircraft propeller has two or more blades attached to the           engine shaft by the hub.", "1. An aircraft propeller has two or more blades attached to the engine shaft by the hub."], "jumps": ["P3930", "P3001"]}, {"id": "P3930", "text": ["2.  The propellers are affected by 5 different types of force.", "2. The propellers are affected by 5 different types of force."], "jumps": ["P3940", "P3920"]}, {"id": "P3940", "text": ["3.  Blade angle is used to adjust engine RPM and the load on the       propeller.", "3. Blade angle is used to adjust engine RPM and the load on the propeller.", "a = Angle of attack (angle formed by relative wind and chord b = Pitch or blade angle"], "jumps": ["P3950", "P3930"]}, {"id": "P3950", "text": ["4.  The blade angle of fixed propellers can not be adjusted while         adjustable propeller blade angles can.", "4. The blade angle of fixed propellers can not be adjusted while adjustable propeller blade angles can."], "jumps": ["P3960", "P3940"]}, {"id": "P3960", "text": ["5.  Controllable propellers allow pitch adjustments to be made            during flight.", "5. Controllable propellers allow pitch adjustments to be made during flight."], "jumps": ["P3970", "P3950"]}, {"id": "P3970", "text": ["6.  Constant speeds can be maintained by the constant speed            propeller.", "6. Constant speeds can be maintained by the constant speed propeller."], "jumps": ["P3999", "P3960"]}, {"id": "P3999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P3001", "P3970"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempte let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
