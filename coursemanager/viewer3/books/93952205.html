const book = {"title": "93952205", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: INTRODUCTION TO THE FREQUENCY COUNTERf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Identify the controls of a Frequency Counter and their purpose.", "w Describe the purpose of a Frequency Counter. w Describe the 4 major functions a Frequency Counter performs. w Determine the quantity measured from the display."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["When troubleshooting electronic equipment, a technician must measure many different quantities."], "jumps": []}, {"id": "P410", "text": ["These measurements such as voltage, current, and resistance are compared to calculated values to determine correct operation...n.tion."], "jumps": []}, {"id": "P420", "text": ["One important quantity a technician must often know is frequency. A frequency counter measures the frequency of many different types of signals..........."], "jumps": []}, {"id": "P430", "text": ["A doctor uses a watch to count a patient's pulse rate. This shows how many times his heart beats every minute."], "jumps": []}, {"id": "P440", "text": ["A technician uses a frequency counter to check the frequency of a circuit. This indicates how many cycles or pulses occur in one second........................"], "jumps": []}, {"id": "P450", "text": ["Let's begin the lesson on INTRODUCTION TO FREQUENCY COUNTER................."], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Frequency Counters are part of a large group of tools called Electronic Test Equipment............."], "jumps": []}, {"id": "P1025", "text": ["ELECTRONIC TEST EQUIPMENT - Electronic Test Equipment is designed to measure or test specific functions in electronic circuits. A few types of test equipment are: are: nt are:", "Test Equipment Function Tested Function Generator AC circuits Frequency Counter AC Frequency Oscilloscope Voltage, Time Multimeter E, I and R"], "jumps": []}, {"id": "P1030", "text": ["The frequency counter is a tool that performs four major functions. Let's start with Frequency.........."], "jumps": []}, {"id": "P1040", "text": ["The Frequency function is the most common use for a frequency counter. In this mode, it determines the frequency of a waveform... a waveform."], "jumps": []}, {"id": "P1045", "text": ["FREQUENCY - Frequency is the number of times something occurs within a particular period of time. The frequency of a waveform is the number of pulses or cycles that occur in one second..............................................."], "jumps": []}, {"id": "P1047", "text": ["The waveform can be DC pulses or an AC signal. By measuring the frequency of a signal, actual values are compared to calculated values and correct operation verified. ."], "jumps": []}, {"id": "P1050", "text": ["The signal can be various types of AC waveforms or pulsating DC."], "jumps": []}, {"id": "P1052", "text": [], "jumps": []}, {"id": "P1053", "text": [], "jumps": []}, {"id": "P1054", "text": [], "jumps": []}, {"id": "P1060", "text": ["For DC signals, the display indicates the number of pulses that occur in one second."], "jumps": []}, {"id": "P1063", "text": ["The display gives a readout in Kilohertz or in Megahertz as indicated by the annunciators and must be multiplied by 1,000 or 1,000,000."], "jumps": []}, {"id": "P1065", "text": ["The display gives a readout in Kilohertz or in Megahertz as indicated by the annunciators and must be multiplied by 1,000 or 1,000,000."], "jumps": []}, {"id": "P1067", "text": ["ANNUNCIATORS - Annunciators are LEDS that indicate which factor the reading on the display must be multiplied by."], "jumps": []}, {"id": "P1070", "text": ["For AC signals, the display indicates the number of cycles that occur in one second."], "jumps": []}, {"id": "P1080", "text": ["For a 10 Hz AC signal, one cycle takes place every 1/10 of a second. For a DC signal, one pulse takes place every 1/10 of a second."], "jumps": []}, {"id": "P1090", "text": ["The time it takes to complete one cycle is called the Period. Let's look at this function of the frequency counter."], "jumps": []}, {"id": "P1100", "text": ["In the Period function, the frequency counter displays the time for one cycle."], "jumps": []}, {"id": "P1110", "text": ["For example, a 60 Hz sine wave contains 60 cycles in one second. Each cycle takes 1/60 or .0166667 of a second. T = 1"], "jumps": []}, {"id": "P1120", "text": ["The period is indicated in microseconds (mS) on the display and must be divided by 1,000,000 to obtain time in seconds. nds."], "jumps": []}, {"id": "P1130", "text": ["is frequency and T is the period or time for one cycle.", "= = = 60 Hz T .0166667"], "jumps": []}, {"id": "P1140", "text": ["What is the period indicated on the display? .............."], "jumps": []}, {"id": "P1142", "text": [], "jumps": []}, {"id": "P1143", "text": ["Remember, the time indicated on the display is in microseconds. To convert to seconds, multiply by .000001."], "jumps": []}, {"id": "P1150", "text": ["What is the frequency indicated on the display? ......."], "jumps": []}, {"id": "P1152", "text": [], "jumps": []}, {"id": "P1153", "text": ["Remember, the frequency indicated on the display is in kilohertz. To convert to hertz, multiply by 1,000. 0."], "jumps": []}, {"id": "P1160", "text": ["The next function the frequency counter performs is Totalize."], "jumps": []}, {"id": "P1170", "text": ["In the Totalize function, the frequency counter counts the total number of cycles or pulses that are received for as long as the input is connected."], "jumps": []}, {"id": "P1180", "text": [], "jumps": []}, {"id": "P1190", "text": ["If a 10 Hz signal is then applied for 1 second, the counter receives 10 pulses and increments 10 times."], "jumps": []}, {"id": "P1200", "text": ["Even if the signal is removed, the display still indicates the total number of pulses the counter received......."], "jumps": []}, {"id": "P1205", "text": ["The reading on the display does not have to be multiplied or divided. It is the actual number of pulses or cycles."], "jumps": []}, {"id": "P1207", "text": ["The display will indicate an overflow if the count exceeds 99,999,999."], "jumps": []}, {"id": "P1210", "text": ["In the Totalize function, if the frequency counter's display is initially at 0, and a 100 Hz signal is applied for 2 seconds and removed, which is the correct display?"], "jumps": []}, {"id": "P1212", "text": [], "jumps": []}, {"id": "P1213", "text": ["With a 100 Hz signal applied for two seconds, the display increments by 100 each second. The display stops incrementing when the signal is removed."], "jumps": []}, {"id": "P1220", "text": ["The last major function of a frequency counter is Check...."], "jumps": []}, {"id": "P1230", "text": ["In the Check function, overall operation of the frequency counter is verified.", "60 Hz Function Generatorrrrrrrrrrrr"], "jumps": []}, {"id": "P1240", "text": ["An internal oscillator provides a known reference signal for the frequency counter to measure."], "jumps": []}, {"id": "P1245", "text": ["OSCILLATOR - An oscillator produces a frequency or frequencies determined by components in the circuit. Some oscillators use a device called a crystal that oscillates at a specific frequency. A function generator is a variable oscillator capable of producing many different frequencies. 3"], "jumps": []}, {"id": "P1250", "text": ["When performing Check, the frequency counter displays the frequency of the internal oscillator."], "jumps": []}, {"id": "P1260", "text": ["The check mode disables the kHz and MHz annunciators. However, the reading is always in kHz and must be multiplied by 1000."], "jumps": []}, {"id": "P1270", "text": ["The displayed frequency should always match the internal oscillator frequency as indicated in the operator's manual supplied with the frequency counter."], "jumps": []}, {"id": "P1280", "text": ["The operator's manual states an internal oscillator frequency of 1 MHz. Is the frequency counter operating correctly in the check mode of operation?"], "jumps": []}, {"id": "P1282", "text": [], "jumps": []}, {"id": "P1283", "text": ["In the Check mode the annunciator lights do not illuminate. The display should read 1000. It is multiplied by 1000 for the correct oscillator frequency of 1 MHz...................."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on THE FREQUENCY COUNTER...."], "jumps": []}, {"id": "P1920", "text": ["1. The frequency counter performs four major functions. Start second line here."], "jumps": []}, {"id": "P1930", "text": ["2. The FREQUENCY function measures the number of cycles or pulses that occur in one second."], "jumps": []}, {"id": "P1940", "text": ["3. The PERIOD function measures the time it takes for one complete cycle of a waveform............"], "jumps": []}, {"id": "P1950", "text": ["4. The TOTALIZE function counts the total number of pulses received by the frequency counter."], "jumps": []}, {"id": "P1960", "text": ["5. The CHECK function verifies correct operation of the frequency counter."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": []}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["The frequency counter has many controls, switches, and indicators that are used to make correct measurements."], "jumps": []}, {"id": "P2030", "text": ["The power switch applies power to the frequency counter. It must be depressed to turn the unit on........"], "jumps": []}, {"id": "P2040", "text": ["Signals are applied to either the \"A\" or \"B\" input depending on the frequency of the signal measured."], "jumps": []}, {"id": "P2045", "text": ["The A input is used for frequencies from 10 Hz to 100 MHz. The 10 MHz or 100 MHz switch selects the range for this input."], "jumps": []}, {"id": "P2050", "text": ["The B input is used for frequencies from 100 MHz to 1 GHz. The 1GHz range switch must be selected for this input."], "jumps": []}, {"id": "P2060", "text": ["Function switches select between Check, Totalize, Period, and Frequency ranges."], "jumps": []}, {"id": "P2070", "text": ["A digital display is used to indicate the quantity measured."], "jumps": []}, {"id": "P2080", "text": ["Three gate time selections provide adjustable resolution and change the time required to update the display."], "jumps": []}, {"id": "P2085", "text": ["RESOLUTION - Resolution is the accuracy in which a measurement is made. On the frequency counter, different gate selections provide different degrees of accuracy. They determine how many decimal places the measured frequency is carried out."], "jumps": []}, {"id": "P2087", "text": ["UPDATING THE DISPLAY - Frequency is measured by taking a sample of the waveform for a period of time. At the end of each time period, the frequency is indicated or updated on the display. The time it takes to update the display is determined by the gate time. by the gate time. by the gate time. ime."], "jumps": []}, {"id": "P2090", "text": ["A Hold function retains the reading on the display for an indefinite period of time.........."], "jumps": []}, {"id": "P2100", "text": ["The display is cleared of any previous data by momentarily depressing Reset."], "jumps": []}, {"id": "P2110", "text": ["The attenuation function reduces the input signal by a factor of 20."], "jumps": []}, {"id": "P2120", "text": ["The Low Pass filter eliminates unwanted high frequencies that can cause inaccurate measurements............."], "jumps": []}, {"id": "P2130", "text": ["What control keeps the reading fixed on the display?......."], "jumps": []}, {"id": "P2132", "text": [], "jumps": []}, {"id": "P2133", "text": ["Gate time determines the resolution of the measurement."], "jumps": []}, {"id": "P2135", "text": ["Attenuation reduces the signal by a factor of 20."], "jumps": []}, {"id": "P2140", "text": ["What is the function of the two inputs on the frequency counter?", "Input A measures DC signals and Input B measures AC signalsssss.", "Input A measures 10 Hz to 100 MHz and Input B measures 100 MHz to 1 GHz............", "Input A measures positive signals and Input B measures negative signals..........."], "jumps": []}, {"id": "P2142", "text": [], "jumps": []}, {"id": "P2143", "text": ["AC and DC signals can both be measured with the same input."], "jumps": []}, {"id": "P2145", "text": ["Positive and negative signals can both be measured with the same input."], "jumps": []}, {"id": "P2150", "text": ["Which control blocks unwanted high frequencies? ........."], "jumps": []}, {"id": "P2152", "text": [], "jumps": []}, {"id": "P2153", "text": ["The 100 MHz switch is used to select the range for the A input."], "jumps": []}, {"id": "P2155", "text": ["The attenuation control reduces the input by a factor of 20."], "jumps": []}, {"id": "P291 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
