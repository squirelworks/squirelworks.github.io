debbie 07-14-00 Converted to ToolBook 7.1 format. jay 10-27-00 Add Monitor Pro code to quiz pages. jay 11-29-00 Added HelpPage inforamtion and new random gen. script. -Penny 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 12-04-03 P1925, changed \"Off\" to \"OFF\". Added a period after \"devices\" and capped \"The\". Breaking run on into 2 sentences. P1940, changed \"PUTs\" and \"SCRs\" in second sentence to \"PUT's\" and \"SCR's\". P1960, changed \"PUTs\" in second and third sentence to \"PUT's\" and \"SCR's\". P10213, changed \"a\" to \"a/an\". -Penny"], "jumps": []}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1925", "text": ["2. This PN junction controls the ON and OFF states of the\n    devices.  The gate is always biased positive with respect to the\n    cathode.", "2. This PN junction controls the ON and OFF states of the devices. The gate is always biased positive with respect to the cathode."], "jumps": ["P1930", "P1920"]}, {"id": "P1950", "text": ["5. The main difference between a UJT and the PUT is that the              peak voltage (Vp) of the PUT can be controlled. The voltage-          current characteristics of both devices are identical.", "5. The main difference between a UJT and the PUT is that the peak voltage (Vp) of the PUT can be controlled. The voltage- current characteristics of both devices are identical."], "jumps": ["P1960", "P1940"]}, {"id": "P1210", "text": ["Due to its four-layer construction the PUT is capable of supplying higher amplitude triggering pulses than the UJT, and can trigger SCRs with high current ratings."], "jumps": ["P1220", "P1190"]}, {"id": "P1220", "text": ["The primary advantage of the PUT is that its electrical characteristics can be controlled, making it a versatile device, which is more sensitive and responds faster than a UJT."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["Why is the PUT an ideal device for long period timer circuits?"], "jumps": ["P1220"]}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1205", "text": ["Since gate-to-anode leakage current adds to the capacitor charging current and alters the output frequency, a low gate-to-anode leakage current is essential."], "jumps": ["P1210", "P1190"]}, {"id": "P1910", "text": ["This completes the information on PROGRAMMABLE UNIJUNCTION TRANSISTORS."], "jumps": ["P1001", "P1230"]}, {"id": "P1172", "text": ["The parallel equivalent of R3 and R4 or (Rg), is considered present at the gate of the PUT. For any given value of Ea, both Ip and Iv will decrease as Rg increases."], "jumps": ["P1180", "P1170"]}, {"id": "P1170", "text": ["The relationship between the voltage divider network of R3 and R4 can be simplified by relating Ip and Iv to the combined values of R3 and R4."], "jumps": ["P1172", "P1160"]}, {"id": "P1182", "text": ["The actual resistor values control Ip and Iv for a given Ea."], "jumps": []}, {"id": "P1180", "text": ["What does the ratio of the voltage divider resistors of the PUT relaxation oscillator control?"], "jumps": ["P1170"]}, {"id": "P1200", "text": ["The PUT is an ideal device for long period timer circuits, because it has a low gate-to-anode leakage current."], "jumps": ["P1205", "P1190"]}, {"id": "P1155", "text": ["Decreasing Vp causes C1 to charge to a lower voltage before the PUT can turn \"ON\", which decreases the time required to generate the sawtooth and increases the frequency.", "If R4 remains constant while R3 increases, the gate voltage will decrease causing Vp to decrease."], "jumps": ["P1160", "P1100"]}, {"id": "P1162", "text": ["However, the peak current (Ip) and valley current (Iv) both depend on the values of R3 and R4 and the source voltage (Ea). The actual resistor values determine the PUTs Ip and Iv for any given Ea.", "However, the peak current (Ip) and valley current (Iv) both depend on the values of R3 and R4 and the source voltage (Ea). The actual resistor values determine the PUTs Ip and Iv for any given Ea..."], "jumps": ["P1170", "P1160"]}, {"id": "P1190", "text": ["Additional PUT applications include low cost timers and oscillators, long period timers, SCR triggers and level detector."], "jumps": []}, {"id": "P1232", "text": ["The gate-to-anode leakage current adds to the capacitor charging current and causes the capacitor to charge for a longer period before reaching Vp."], "jumps": []}, {"id": "P1960", "text": ["6. The ratio of R3 and R4, not their individual values, programs           the intrinsic standoff ratio of the PUT, which controls the                 PUT's Vp value. The actual resistor values determine the\n     PUT's Ip and Iv for any given Ea.", "The PUT is an ideal device for long period timer circuits, because it has a low gate-to-anode leakage current.", "6. The ratio of R3 and R4, not their individual values, programs the intrinsic standoff ratio of the PUT, which controls the PUT's Vp value. The actual resistor values determine the PUT's Ip and Iv for any given Ea......"], "jumps": ["P1970", "P1950"]}, {"id": "P1095", "text": ["The voltage-current characteristics of both devices are identical."], "jumps": ["P1100", "P1090"]}, {"id": "P1110", "text": ["The gate is biased to a desired voltage with an external voltage divider. When the anode voltage exceeds the \"programmed\" level (Vp) or (Vg +0.7 V) the PUT turns ON."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["In the PUT relaxation oscillator, the gate is biased at +9 V by the voltage divider R3 and R4."], "jumps": ["P1122", "P1100"]}, {"id": "P1122", "text": ["When power is applied, the PUT is OFF and C1 charges toward +18 V through R1."], "jumps": ["P1123", "P1100"]}, {"id": "P1080", "text": ["The ratio sets the firing voltage Vp. Large intrinsic standoff ratio variations cause the UJTs output frequency to vary from its designed frequency.", "As Ie increases, the device's negative resistance characteristic causes Ve to decrease until the UJT turns \"OFF\" at Ve equals Vv (Valley Voltag let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
