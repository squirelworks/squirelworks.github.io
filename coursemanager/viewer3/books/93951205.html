2160"]}, {"id": "P2170", "text": ["When the switch is closed, current will not flow through the meter. This is an overlay page."], "jumps": ["P2180", "P2160"]}, {"id": "P2160", "text": ["Some circuits use switches to open the circuit to make a current measurement. Enter the discussion text here."], "jumps": ["P2170", "P2150"]}, {"id": "P2150", "text": ["If the test leads are reversed, a digital meter will measure a negative value of current. Ignore the negative sign, the value is correct. Enter the discussion text here."], "jumps": ["P2160", "P2140"]}, {"id": "P2145", "text": ["If analog meter's needle moves to the left, off the scale while measuring current, reverse test leads."], "jumps": ["P2150", "P2140"]}, {"id": "P2140", "text": ["If the test leads are reversed an analog meter's needle moves to the left, off the scale. Enter the discussion text here."], "jumps": ["P2080"]}, {"id": "P2130", "text": ["Always place the black test lead at a point less positive than the red test lead. This is an overlay page."], "jumps": ["P2140", "P2080"]}, {"id": "P2120", "text": ["Always place the red test lead at a point that is more positive than the black test lead. This is an overlay page."], "jumps": ["P2080"]}, {"id": "P2110", "text": ["In order for current to flow through the meter, the circuit must be broken (opened) and the meter inserted. This is an overlay page.", "In order for charge to flow through the meter, the circuit must be broken (opened) and the meter inserted. This is an overlay page."], "jumps": ["P2080"]}, {"id": "P2100", "text": ["Remember, current is the flow of charge. The charge must flow through the meter.", "Remember, current is the flow of electrons. The electrons must flow through the meter.", "Remember, current is the flow of electrons. The electrons must flow through the meter. This is an overlay page."], "jumps": ["P2110", "P2080"]}, {"id": "P2090", "text": ["Your multimeter must be placed \"IN\" the circuit to measure current. This is an overla document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
</body>
</html>
