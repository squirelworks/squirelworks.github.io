<script>
const book = {"title": "93952803", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . .", "Title: TROUBLESHOOTING RELAYS AND SWITCHESsdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe typical faults in relays. w Describe relay troubleshooting procedures.", "w Recognize that a relay circuit is faulted. w Identify the fault in a faulted relay circuit."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "4. Nida Model 480, 488 Multimeter or Equivalent"], "jumps": []}, {"id": "P330", "text": ["In this lesson you will learn about troubleshooting relay circuits."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Locating faults in relay circuits may at first seem complex."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["However, tracing input signals from the beginning through each relay to the output makes finding faults easy."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Remember, relays are nothing more than magnetically operated switches."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Relay schematics show the de-energized state."], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["Let's begin the lesson on TROUBLESHOOTING RELAYS AND SWITCHES..............."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": ["P450"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Relays are one of the most dependable electromechanical devices in use.", "Physical Appearance of a Relayyyyyyyyyyyyy"], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["However, like any other electronic component, relays occasionally wear out or become inoperative."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Most relays can not be repaired, they are contained in a sealed housing or cover. If a sealed relay fails, all you can do is replace it."], "jumps": ["P1060", "P1020", "P5", "P"]}, {"id": "P1060", "text": ["If a non-sealed relay fails, it may be repairable, depending on the type of fault."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["The following common relay faults require corrective action to be taken.", "Faulted Magnetic Coils Faulted Contacts"], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["Of course, the corrective action for faulted sealed relays is to replace the entire relay."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["Let's cover faulted magnetic coils first.", "The magnetic core is a soft iron cylinder or ferrite material that has a wire wrapped around it, much like an inductor, this is called the coil.  Coil windi", "The coil opens or shorts.  In either case coil windings cannot be repaired.", "Faulted Magnetic Coils Faulted Contacts", "The magnetic core is a soft iron cylinder or ferrite material that has a wire wrapped around it, much like an inductor, this is called the coil. Coil windi)", "The magnetic core is a soft iron cylinder or ferrite material that has a wire wrapped around it, much like an inductor, this is called the coil. Magnetic coils are part of the relay that is not repairable.", "The coil opens or shorts. In either case coil windings cannot be repaired."], "jumps": ["P1100", "P1070", "P1110", "P1120"]}, {"id": "P1120", "text": ["If the coil is open, current does not flow and no magnetic field is produced. The relay will not energize."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["If the coil is shorted, current flows but, the strength of the magnetic field is reduced. The relay will not energize.", "An ohmmeter check can quickly determine an open or shorted coil."], "jumps": ["P1140", "P1110", "P1150"]}, {"id": "P1150", "text": ["The resistance of a good coil should measure above 0 ohms and below infinity ohms."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["An open coil will measure infinity. A shorted coil will measure 0 ohms."], "jumps": ["P1170", "P1140"]}, {"id": "P1170", "text": ["In most relays, the coil can not be replaced. For an open or shorted coil you must replace the entire relay."], "jumps": ["P1180", "P1140"]}, {"id": "P1180", "text": ["The second common fault is failed contacts.", "The second common fault is failed contacts.................", "Faulted Magnetic Coils Faulted Contacts"], "jumps": ["P1190", "P1140"]}, {"id": "P1190", "text": ["A faulted common terminal prevents the relay from passing an input signal when de-energized or energized."], "jumps": ["P1180"]}, {"id": "P1200", "text": ["A faulted normally closed contact prevents an output when the relay is de-energized. The relay operates correctly when energized."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["A faulted normally opened contact prevents an output when the relay is energized. The relay operates correctly when de-energized.", "A voltmeter can quickly determine if the contacts of a relay are faulted."], "jumps": ["P1220", "P1200", "P1230", "P1210"]}, {"id": "P1230", "text": ["Measure the input voltage, the set of contacts that are made should also measure the value of the input voltage."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["If not, the contacts are faulted."], "jumps": ["P1250", "P1220"]}, {"id": "P1250", "text": ["Sometimes, non-sealed relay contacts can be repaired, depending on the type of failure."], "jumps": ["P1260", "P1220"]}, {"id": "P1260", "text": ["Coned and Cratered Contacts - When current flows in one direction through a relay, the contacts may become coned and cratered.", "Coned and Cratered Contacts - When current travels in one direction through a relay, the contacts may become coned and cratered."], "jumps": ["P1270", "P1220"]}, {"id": "P1270", "text": ["The crater is formed by the transfer of the metal of one contact to the other. The deposit being in the form of a cone."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["Coned and cratered contacts must be replaced. Replace the entire relay if the contacts can not be replaced."], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["Burned and Pitted Contacts - \nUnder normal operating conditions, most relay contacts spark slightly when connected or disconnected.", "Burned and Pitted Contacts - Under normal operating conditions, most relay contacts spark slightly when connected or disconnected."], "jumps": ["P1300", "P1260"]}, {"id": "P1300", "text": ["This causes some minor burning and pitting of the contacts."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["Eventually, the contacts will fail."], "jumps": ["P1312", "P1290"]}, {"id": "P1312", "text": ["Pitting of the contacts actually reduces their size and can prevent current flow from one contact to another."], "jumps": ["P1320", "P1290"]}, {"id": "P1320", "text": ["Burned material on the contacts can be removed (in non-sealed relays) by using a Contact Burnishing Tool."], "jumps": ["P1330", "P1312"]}, {"id": "P1330", "text": ["Other atmospheric contaminates, like dirt, can also be removed by using the contact burnishing tool."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["DO NOT use sandpaper or emery cloth to clean contacts in relays. The contacts may be damaged or bent."], "jumps": ["P1350", "P1320"]}, {"id": "P1350", "text": ["Note, some relays use rounded contacts to prevent dust build up and to penetrate any film that collects."], "jumps": ["P1360", "P1320"]}, {"id": "P1360", "text": ["Avoid flattening or otherwise altering the contact's rounded surface with the Burnishing tool."], "jumps": ["P1380", "P1350"]}, {"id": "P1380", "text": ["After using the burnishing tool to smooth the surface of the contact, use a gap tool to adjust contact clearance or gap settings."], "jumps": ["P1390", "P1350"]}, {"id": "P1390", "text": ["Misuse -  If too high of a voltage or current is applied to a relay, the relay can fail.", "Misuse - If too high of a voltage or current is applied to a relay, the relay can fail.", "COMMON and NORMALLY OPEN CONTACTS ARE FUSED TOGETHER", "WHEN RELAY IS DE-ENERGIZED CONTACTS WILL NOT SEPERATE", "COIL ENERGIZING VOLTAGE and CURRENT ARE TOO HIGH TE"], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["The coil can open, short or the contacts can be destroyed.", "The coil can open, short or the contacts can be destroyed.m"], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["Never exceed the voltage and current rating listed on the relay!"], "jumps": ["P1420", "P1390"]}, {"id": "P1420", "text": ["Current flowing through a relay's contacts in one direction can only cause what type of failure?", "Current traveling through a relay's contacts in one direction can only cause what type of failure?", "\"Current traveling through a relay's contacts", "Current flowing through a relay's contacts in one direction can only cause what type of failure?e?"], "jumps": ["P1390"]}, {"id": "P1421", "text": [], "jumps": []}, {"id": "P1422", "text": ["Burned and pitted contact failures are caused by the contacts sparking when connected and disconnected."], "jumps": []}, {"id": "P1423", "text": ["Misuse failures are caused by applying higher than rated voltages and currents.", "COMMON and NORMALLY OPEN CONTACTS ARE FUSED TOGETHER", "WHEN RELAY IS DE-ENERGIZED CONTACTS WILL NOT SEPERATE", "COIL ENERGIZING VOLTAGE and CURRENT ARE TOO HIGH TE"], "jumps": []}, {"id": "P1430", "text": ["What type of tool should you use to clean contacts in relays?"], "jumps": ["P1420"]}, {"id": "P1431", "text": [], "jumps": []}, {"id": "P1432", "text": ["Sandpaper can bend or damage the contacts.", "Sandpaper can bend or damage the contacts.................."], "jumps": []}, {"id": "P1433", "text": ["Emery cloth can bend or damage the contacts.", "Emery cloth can bend or damage the contacts................"], "jumps": []}, {"id": "P1440", "text": ["What corrective action is taken when sealed relays fail?", "What corrective action is taken when sealed relays fail?..."], "jumps": ["P1430"]}, {"id": "P1441", "text": [], "jumps": []}, {"id": "P1442", "text": ["The coil of a relay can not normally be repaired in sealed or non-sealed relays."], "jumps": []}, {"id": "P1443", "text": ["The contacts can only be repaired in some non-sealed relays."], "jumps": []}, {"id": "P1450", "text": ["The troubleshooting procedure for relays is very simple and only requires the use of a multimeter."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["If a relay is suspected to be faulted, a two step procedure should be followed:\n                                           1) Check Inputs \n                                           2) Check Outputs", "If a relay is suspected to be faulted, a two step procedure should be followed: 1) Check Inputs 2) Check Outputs"], "jumps": ["P1470", "P1450"]}, {"id": "P1470", "text": ["The inputs are checked first, without the correct inputs, the operation of the relay will not be correct.", "Check that the energizing voltage is present when it should be."], "jumps": ["P1480", "P1450", "P1490"]}, {"id": "P1490", "text": ["If not present, troubleshoot the circuit preceding the relay."], "jumps": ["P1500", "P1480"]}, {"id": "P1500", "text": ["Check to see that the input voltage is present."], "jumps": ["P1510", "P1480"]}, {"id": "P1510", "text": ["Relays with two inputs require that both be checked."], "jumps": ["P1511", "P1480"]}, {"id": "P1511", "text": ["If not present, troubleshoot the circuit preceding the relay."], "jumps": ["P1530", "P1480"]}, {"id": "P1520", "text": ["If not present, troubleshoot the circuit preceding the relay.", "If the inputs are different types of AC signals, an oscilloscope can be used to check them.", "K, HK_,,_K,_K'',EK,,,,,'_,KEKZ;;XK98JO9[N=9N@N99U,,K,,EK", "'_K_'K'',K' QUK_,''KK}0;KK,KK__',K'K_K''KK'K_", "'_K_'KK',K_,,'_'',K,K', F;__KK,K, TK,,__,''KKK'", ",KK,,E:9 POOHPPP=70=07PUHP^UOOU=YOVP=PPPPOOPXOOOOXH9UO95P0P===TXZOOU1NIIPPPHPVGH5PSOPZXXOK;E", "a5T 55:s5 m5 ts55Tt T--|57s- Fss y 5 -VVFs5m--FFFmm5FFs---t-t t-| -s-ymV sGFt--ss5-", "7mty-5m--F-s- mVs t --FFy5V-|-F smst Vm--5sVt T-", ",,K;A:'K,57VGO;EEEOa>2OK9)1UE; VPKEE,'KK__K'KK'KKKKK'K_',_", "K';;_KE,KKKKE,KEEK,EKEEE OKKK-RL0;;E,;A ?PU;a", ";U;U;;UU;;;;;KEUW>< E__,K,K,',;_KKK,EKKK", "(O;KKK;;K,'EUEE;90H7Q55H5m5=V0T0HT5T=QHP=H5 TT=U;,,E__,_,K,'"], "jumps": ["P1530", "P1480", "P1540", "PK", "PU77OK", "PO", "P", "PKKKKKK", "PEEE", "PA"]}, {"id": "P1540", "text": ["Once the inputs are known to be correct, check the output when the relay is de-energized and energized.", "In a relay configured for one output, the common terminal is checked when de-energized."], "jumps": ["P1550", "P1530", "P1560", "P1540"]}, {"id": "P1560", "text": ["Then checked when it is energized.", "In a relay configured for two outputs, both the contacts are checked when de-energized."], "jumps": ["P1570", "P1550", "P1580"]}, {"id": "P1580", "text": ["Then again when it is energized."], "jumps": ["P1590", "P1570"]}, {"id": "P1590", "text": ["If the outputs are incorrect, the relay is faulted. Replace or repair the relay.", "Note that if the outputs are AC signals, an oscilloscope can be used to measure them.", "Is this relay faulted?", "K, HK_,,_K,_K'',EK,,,,,'_,KEKZ;;XK98JO9[N=9N@N99U,,K,,EK", "'_K_'K'',K' QUK_,''KK}0;KK,KK__',K'K_K''KK'K_", "'_K_'KK',K_,,'_'',K,K', F;__KK,K, TK,,__,''KKK'", ",KK,,E:9 POOHPPP=70=07PUHP^UOOU=YOVP=PPPPOOPXOOOOXH9UO95P0P===TXZOOU1NIIPPPHPVGH5PSOPZXXOK;E", "a5T 55:s5 m5 ts55Tt T--|57s- Fss y 5 -VVFs5m--FFFmm5FFs---t-t t-| -s-ymV sGFt--ss5-", "7mty-5m--F-s- mVs t --FFy5V-|-F smst Vm--5sVt T-", ",,K;A:'K,57VGO;EEEOa>2OK9)1UE; VPKEE,'KK__K'KK'KKKKK'K_',_", "K';;_KE,KKKKE,KEEK,EKEEE OKKK-RL0;;E,;A ?PU;a", ";U;U;;UU;;;;;KEUW>< E__,K,K,',;_KKK,EKKK"], "jumps": ["P1600", "P1570", "P1610"]}, {"id": "P1611", "text": ["Notice that there is no energizing voltage applied to the relay even though S1 is closed. The fault is not the relay.", "Is this relay faulted?", "Is this relay faulted?on is typed.........................."], "jumps": ["P1610"]}, {"id": "P1621", "text": ["Notice that there is energizing voltage applied to the relay. The relay should be energized and the Normally Open contact should be making contact with the Common contact."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on RELAY CIRCUIT FAULTS.", "This completes the information on RELAY CIRCUIT FAULTS....."], "jumps": ["P1001", "P1620"]}, {"id": "P1920", "text": ["1.  Most relays can not be repaired because they are sealed.                 Faulted sealed relays are entirely replaced.", "1. Most relays can not be repaired because they are sealed. Faulted sealed relays are entirely replaced."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Non-sealed relays can be repaired depending on the type of           fault.", "3.   A common fault in a relay is a failed coil. The coil is either                opened or shorted.", "2. Non-sealed relays can be repaired depending on the type of fault.", "3. A common fault in a relay is a failed coil. The coil is either opened or shorted."], "jumps": ["P1940", "P1920", "P1950", "P1930"]}, {"id": "P1950", "text": ["4.   A common fault in a relay is failed contacts. They can be                 coned / cratered and / or burned / pitted.", "4. A common fault in a relay is failed contacts. They can be coned / cratered and / or burned / pitted."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  Misuse can also cause a relay to fail.", "5. Misuse can also cause a relay to fail..................", "COMMON and NORMALLY OPEN CONTACTS ARE FUSED TOGETHER", "WHEN RELAY IS DE-ENERGIZED CONTACTS WILL NOT SEPERATE", "COIL ENERGIZING VOLTAGE and CURRENT ARE TOO HIGH TE"], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  Troubleshooting a relay requires checking the inputs and                outputs with a multimeter or oscilloscope.", "7.  If the inputs are incorrect, troubleshoot the circuit preceding           the relay.", "6. Troubleshooting a relay requires checking the inputs and outputs with a multimeter or oscilloscope.", "7. If the inputs are incorrect, troubleshoot the circuit preceding the relay."], "jumps": ["P1980", "P1960", "P1970", "P1990"]}, {"id": "P1990", "text": ["8. If the inputs are correct and the outputs are incorrect, the relay is faulted......"], "jumps": ["P1980", "P1999"]}, {"id": "P1999", "text": ["You have completed the Summary.  You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["The purpose of this experiment is to troubleshoot a defective relay circuit. Three relays are used to control the signal flow through a circuit to illuminate different lamps.", "Pick up the PC130-84B card. This card is used to demonstrate relay faults."], "jumps": ["P2040", "P2001", "P2050", "P2020"]}, {"id": "P2050", "text": ["Compare the card with the schematic shown."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["Operation can be easily determined by observing the LEDs."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["Only one LED illuminates for any of the combinations of K1 through K3 being energized or de-energized."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["A fault is detected when the correct LED fails to illuminate. Let's start the experiment."], "jumps": ["P2090", "P2040"]}, {"id": "P2090", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2040"]}, {"id": "P2100", "text": ["2.  Carefully plug PC130-84B into the Test Console PC2 position. \n3.  Place PC130-84B switches S1 and S2 to OFF.", "2. Carefully plug PC130-84B into the Test Console PC2 position. 3. Place PC130-84B switches S1 and S2 to OFF... the PC3 Speaker switch to ON........................................."], "jumps": ["P2090", "P2105"]}, {"id": "P2105", "text": ["MEASUREMENT SETUP - Set S1 and S2 to the OFF position"], "jumps": []}, {"id": "P2110", "text": ["4.  Set the Voltmeter Switch to Positive. \n5.  Set the Positive Supply  Voltage to 12. \n      The Test Console's Voltage Meter should indicate 12 volts.", "4. Set the Voltmeter Switch to Positive. 5. Set the Positive Supply Voltage to 12. The Test Console's Voltage Meter should indicate 12 volts......."], "jumps": ["P2100"]}, {"id": "P2120", "text": ["6.  Set the Voltmeter Switch to Negative. \n7.  Set the Negative Supply Voltage to 12. \n      The Test Console's Voltage Meter  should indicate 12 volts.", "6. Set the Voltmeter Switch to Negative. 7. Set the Negative Supply Voltage to 12. The Test Console's Voltage Meter should indicate 12 volts........................."], "jumps": ["P2110"]}, {"id": "P2130", "text": ["8.  Set PC2 DC Power switch to ON.", "8. Set PC2 DC Power switch to ON.ol to 12. 130A - Set the PC1 DC switch to ON. 130A - Set the PC2 AC switch to ON. 130A - Set the PC3 Speaker switch to ON.."], "jumps": ["P2120"]}, {"id": "P2140", "text": ["Type in the reference designator for the LED that is illuminated.", "Type in the reference designator for the LED that is illuminated...................."], "jumps": ["P2142"]}, {"id": "P2141", "text": [], "jumps": []}, {"id": "P2142", "text": ["Look at the card, one of the LEDs is ON, glowing red. Type in the component designator below the illuminated LED."], "jumps": []}, {"id": "P2143", "text": ["You still did not type in the correct LED designator. L1 should be illuminated. If NOT, check switches S1 and S2 in the OFF position and that you are NOT pushing in S3. Then check with your instructor.", "You still did not type in the correct LED designator. L1 should be illuminated. If NOT, check switches S1 and S2 in the OFF position and that you are NOT pushing in S3. Then check with your instructor..."], "jumps": ["P2150", "P2140"]}, {"id": "P2150", "text": ["The experiment is setup. Let's first check that all the relays are operating correctly before inserting a fault."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["1.  Place the following switches in the position indicated and               check that the appropriate LED illuminates.", "1. Place the following switches in the position indicated and check that the appropriate LED illuminates.inates.", "Switch LED ON S1 OFF S2 OFF S3 RELEASED L1 S1 ON S2 OFF S3 RELEASED L2 S1 OFF S2 ON S3 RELEASED L3 S1 ON S2 ON S3 RELEASED L4 S1 OFF S2 OFF S3 PRESSED L5 S1 ON S2 OFF S3 PRESSED L6 S1 OFF S2 ON S3 PRESSED L7 S1 ON S2 ON S3 PRESSED L8"], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["Did the LEDs illuminate correctly for each switch position?"], "jumps": ["P2160"]}, {"id": "P2171", "text": [], "jumps": []}, {"id": "P2172", "text": ["There are no faults in the circuit. The LEDs should have illuminated correctly for each switch position. Check that you followed the sequence given. Then check with your instructor."], "jumps": []}, {"id": "P2180", "text": ["The computer may now insert a fault.  If a fault is discovered, use the two step troubleshooting method to locate the fault.", "The computer may now insert a fault. If a fault is discovered, use the two step troubleshooting method to locate the fault. ternal program = SCAN FTR 0 F2 05........................."], "jumps": ["P2170"]}, {"id": "P2190", "text": ["2.  Place the following switches in the position indicated and               check that the appropriate LED illuminates.", "2. Place the following switches in the position indicated and check that the appropriate LED illuminates.", "Switch LED ON S1 OFF S2 OFF S3 RELEASED L1 S1 ON S2 OFF S3 RELEASED L2 S1 OFF S2 ON S3 RELEASED L3 S1 ON S2 ON S3 RELEASED L4 S1 OFF S2 OFF S3 PRESSED L5 S1 ON S2 OFF S3 PRESSED L6 S1 OFF S2 ON S3 PRESSED L7 S1 ON S2 ON S3 PRESSED L8"], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["Did the LEDs illuminate correctly for each switch position?"], "jumps": ["P2190"]}, {"id": "P2201", "text": [], "jumps": []}, {"id": "P2202", "text": ["There is a fault in the circuit.   L5 through L8 did not illuminate.", "There is a fault in the circuit. L5 through L8 did not illuminate."], "jumps": []}, {"id": "P2210", "text": ["You probably noticed that when S3 was PRESSED, K3 did not energize. You did not hear the \"click\"."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["However, don't assume that K3 is bad and replace it  (K3 is sealed and if K3 is bad the only corrective action is to replace the relay).  Remember the two step troubleshooting procedure!", "However, don't assume that K3 is bad and replace it (K3 is sealed and if K3 is bad the only corrective action is to replace the relay). Remember the two step troubleshooting procedure!"], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["Relay troubleshooting procedure:", "3.  Measure the voltage at TP9 with S3 PRESSED and                            RELEASED.", "Relay troubleshooting procedure:...........................", "Check Inputs Check Outputs LED ON S1 OFF S2 OFF S3 RELEASED L1 S1 ON S2 OFF S3 RELEASED L2 S1 OFF S2 ON S3 RELEASED L3 S1 ON S2 ON S3 RELEASED L4 S1 OFF S2 OFF S3 PRESSED L5 S1 ON S2 OFF S3 PRESSED L6 S1 OFF S2 ON S3 PRESSED L7 S1 ON S2 ON S3 PRESSED L8", "3. Measure the voltage at TP9 with S3 PRESSED and RELEASED."], "jumps": ["P2240", "P2220", "P2250", "P2230", "P2245"]}, {"id": "P2245", "text": ["MEASUREMENT SETUP - Measure the voltage at TP9 with S3 pressed and released."], "jumps": []}, {"id": "P2250", "text": ["You should have measured 0 V when S3 is RELEASED and \n+12 V when S3 is PRESSED. Is the energizing voltage correct to K3?", "You should have measured 0 V when S3 is RELEASED and +12 V when S3 is PRESSED. Is the energizing voltage correct to K3?"], "jumps": ["P2240"]}, {"id": "P2251", "text": ["Ensure you are measuring TP9 with S3 ON and OFF.  Both should read 0 V. \nNOTE: S3 ON pressed; S3 OFF released.", "Since the energizing voltage is not present when S3 is PRESSED, the fault must be before the relay.", "4.  Measure the voltage at TP2 +12V.  Is +12V present on the card?", "Ensure you are measuring TP9 with S3 ON and OFF. Both should read 0 V. NOTE: S3 ON pressed; S3 OFF released...", "4. Measure the voltage at TP2 +12V. Is +12V present on the card?"], "jumps": ["P2250", "P2260", "P2275"]}, {"id": "P2271", "text": ["Insure that you are measuring the +12V test point.", "Insure that you are measuring the +12V test point.........."], "jumps": []}, {"id": "P2275", "text": ["Since there is +12V applied to the card, the probable fault is that there is a break in the conductor to the core of K3.", "MEASUREMENT SETUP - Measure the voltage at +12 V TP."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["The computer will now repair the fault. The final step is to check  that the repair corrected the fault.", "The computer will now repair the fault. The final step is to check that the repair corrected the fault. External program = SCAN FTR 0 C2 00o ON........................................."], "jumps": ["P2280"]}, {"id": "P2300", "text": ["5.  Place the following switches in the position indicated and               check that the appropriate LED illuminates.", "5. Place the following switches in the position indicated and check that the appropriate LED illuminates.", "Switch LED ON S1 OFF S2 OFF S3 RELEASED L1 S1 ON S2 OFF S3 RELEASED L2 S1 OFF S2 ON S3 RELEASED L3 S1 ON S2 ON S3 RELEASED L4 S1 OFF S2 OFF S3 PRESSED L5 S1 ON S2 OFF S3 PRESSED L6 S1 OFF S2 ON S3 PRESSED L7 S1 ON S2 ON S3 PRESSED L8"], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["Is the relay circuit operating correctly?", "Is the relay circuit operating correctly?.................."], "jumps": ["P2300"]}, {"id": "P2311", "text": [], "jumps": []}, {"id": "P2312", "text": ["The fault has been corrected. You should have observed the LEDs illuminate correctly for all of the switch positions."], "jumps": []}, {"id": "P2320", "text": ["Now, let's try another problem. The computer will insert the fault.", "Now, let's try another problem. The computer will insert the fault. ternal program = SCAN FTR 0 F2 07 ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2310"]}, {"id": "P2330", "text": ["1.  Place the following switches in the position indicated and               check  that the appropriate LED illuminates.", "1. Place the following switches in the position indicated and check that the appropriate LED illuminates.", "Switch LED ON S1 OFF S2 OFF S3 RELEASED L1 S1 ON S2 OFF S3 RELEASED L2 S1 OFF S2 ON S3 RELEASED L3 S1 ON S2 ON S3 RELEASED L4 S1 OFF S2 OFF S3 PRESSED L5 S1 ON S2 OFF S3 PRESSED L6 S1 OFF S2 ON S3 PRESSED L7 S1 ON S2 ON S3 PRESSED L8"], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["Is the relay circuit operating correctly?", "Is the relay circuit operating correctly?.................."], "jumps": ["P2330"]}, {"id": "P2341", "text": [], "jumps": []}, {"id": "P2342", "text": ["There is a fault in the circuit.  The LEDs did not illuminate correctly for all the switch positions.", "Which relay appears to be operating incorrectly?", "There is a fault in the circuit. The LEDs did not illuminate correctly for all the switch positions.", "Which relay appears to be operating incorrectly?..........."], "jumps": ["P2340"]}, {"id": "P2351", "text": [], "jumps": []}, {"id": "P2352", "text": ["Place S1 to on, notice that L2 illuminates as it should. When all switches are OFF, L1 is illuminated as it should. K1 is operating correctly."], "jumps": []}, {"id": "P2353", "text": ["Push S3 to ON with S1 and S2 OFF, L5 illuminates as it should. Release S3 to OFF with S1 and S2 OFF, L1 illuminates as it should. K3 is operating correctly.", "2.  Measure the energizing voltage at TP5 when S2 is OFF and            ON.  Is the energizing voltage correct?", "Push S3 to ON with S1 and S2 OFF, L5 illuminates as it should. Release S3 to OFF with S1 and S2 OFF, L1 illuminates as it should. K3 is operating correctly.-", "2. Measure the energizing voltage at TP5 when S2 is OFF and ON. Is the energizing voltage correct??"], "jumps": ["P2350"]}, {"id": "P2361", "text": ["You should measure 0V when S2 is OFF and +12V when S2 is ON.", "3.  Measure the input voltage to K2 at TP7 with K1 energized and       de-energized.  Is the input voltage correct?", "You should measure 0V when S2 is OFF and +12V when S2 is ON..", "3. Measure the input voltage to K2 at TP7 with K1 energized and de-energized. Is the input voltage correct??"], "jumps": ["P2360"]}, {"id": "P2371", "text": ["You should have measured +12V when K1 is de-energized and \n-12V when K1 is energized.  This is the correct input.", "You should have measured +12V when K1 is de-energized and -12V when K1 is energized. This is the correct input."], "jumps 10", "text": ["You probably noticed that when S3 was PRESSED, K3 did not energize.  You did not hear the \"click\".", "You probably noticed that when S3 was PRESSED, K3 did not energize. You did not hear the \"click\"."], "jumps": ["P13220", "P13200"]}, {"id": "P13220", "text": ["However, don't assume that K3 is bad and replace it (K3 is sealed and if K3 is bad the only corrective action is to replace the relay).  Remember the two step troubleshooting procedure!", "However, don't assume that K3 is bad and replace it (K3 is sealed and if K3 is bad the only corrective action is to replace the relay). Remember the two step troubleshooting procedure!"], "jumps": ["P13230", "P13210"]}, {"id": "P13230", "text": ["Relay troubleshooting procedure:", "3.  Measure the voltage at TP9 with S3 PRESSED and                            RELEASED.", "Relay troubleshooting procedure:...........................", "Check Inputs Check Outputs LED ON S1 OFF S2 OFF S3 RELEASED L1 S1 ON S2 OFF S3 RELEASED L2 S1 OFF S2 ON S3 RELEASED L3 S1 ON S2 ON S3 RELEASED L4 S1 OFF S2 OFF S3 PRESSED L5 S1 ON S2 OFF S3 PRESSED L6 S1 OFF S2 ON S3 PRESSED L7 S1 ON S2 ON S3 PRESSED L8", "3. Measure the voltage at TP9 with S3 PRESSED and RELEASED."], "jumps": ["P13240", "P13220", "P13250", "P13230", "P13245"]}, {"id": "P13245", "text": ["MEASUREMENT SETUP - Measure the voltage at TP9 with S3 pressed and released."], "jumps": []}, {"id": "P13250", "text": ["You should have measured 0 V when S3 is RELEASED and\n+12 V when S3 is PRESSED.  Is the energizing voltage correct to  K3?", "You should have measured 0 V when S3 is RELEASED and +12 V when S3 is PRESSED. Is the energizing voltage correct to K3???"], "jumps": ["P13240"]}, {"id": "P13251", "text": ["Ensure you are measuring TP9 with S3 ON and OFF.  Both should read 0 V. \nNOTE: S3 ON pressed; S3 OFF released.", "Since the energizing voltage is not present when S3 is PRESSED, the fault must be before the relay.", "4.  Measure the voltage at TP2 +12V.  Is +12V let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
