tt"], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P350", "text": [], "jumps": ["P"]}, {"id": "P360", "text": [], "jumps": []}, {"id": "P370", "text": ["TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT"], "jumps": []}, {"id": "P380", "text": ["This lesson introduces the student to the principles and operation of motion detection devices, including linear, rotary, and optical motion concepts.", "Within the field of industrial controls, inputs to circuits originate from various environments, such as light, heat, motion, pressure and humidity."], "jumps": ["P301", "P410"]}, {"id": "P420", "text": ["Industrial controls require accurate detection sensors to measure rotary (circular) and linear (straight) motion. As in electronics, the rate of change associated with motion is an important concept...", "Secondary Motion (effect)) (effect)", "Primary Motion (cause)))))) (effect)"], "jumps": []}, {"id": "P430", "text": ["Motion detectors must convert rate of change in motion to rate of change of electrical parameters, such as resistance, voltage and frequency."], "jumps": ["P"]}, {"id": "P440", "text": ["Let's begin the lesson on MOTION DETECTION................................"], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": ["P430"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["There are various terms and concepts relating to motion that must be understood when studying motion detector circuits. The velocity of an object is the rate of change-of-distance the object exhibits in a particular direction...", "Where: D = distance between two points T = time at position indicatedd"], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["If an object has moved from point A to X, then to find the velocity (v), one needs only to know the time required to move between the points.", "Where: D = distance between two points T = time at position indicatedd"], "jumps": []}, {"id": "P1040", "text": ["The average velocity can be calculated by dividing the change in distance ( D), by the change in time ( T). For example, if the D equals 10 feet and the T equals 2 seconds, the object has a velocity of 5 feet per second."], "jumps": []}, {"id": "P1050", "text": ["The average velocity between two points may be further analyzed at points of equal distance to see if the velocity is the same or different from the average. In this example, the average velocity is also the fixed velocity...", "V = V = V = V = 2.5ft", "0.5ft sec = 5 ft/sec =ft/sect/sect/sect/secft/secft/sec"], "jumps": []}, {"id": "P1060", "text": ["In many cases, the velocity of an object will accelerate (increase) or decelerate (decrease) between two points."], "jumps": []}, {"id": "P1070", "text": ["Notice, that in equal time increments an object can move unequal distances between points A and X. By definition, acceleration is a change in velocity and may be determined between two points with the following formula...W", "a = acceleration v 2 = ending velocity in unit/sec v 1 = starting velocity in units/sec DT = change in time v 1 and v 2 tssurements"], "jumps": []}, {"id": "P1080", "text": ["Looking at the acceleration of an object between points A and X you will notice that the velocity at A, started at (0 ft/sec) increased at point X to (8 ft/sec).", "V inst = ( + a T inst) + V A ) === ) == ) ==", "* T inst) + V A T inst) + V A ) === ) == ) ==Q"], "jumps": []}, {"id": "P1090", "text": ["Looking at the deceleration of an object between points A and X you will notice that the velocity at A, started at (8 ft/sec) decreased at point X to (0 ft/sec).", "* T inst) + V A T inst) + V A ) === ) == ) =="], "jumps": []}, {"id": "P1100", "text": ["Notice that acceleration is (+) for increasing velocity, but (-) for decreasing velocity. As with velocity measurements, acceleration can be measured and analyzed at different increments...", "Vinst = VA + ( - a Tinst) A === ) == ) ==", "* T inst) + V A T inst) + V A ) === ) == ) ==", "Vinst = ( + a Tinst) + VA ) === ) == ) ==U", "* T inst) + V A T inst) + V A ) === ) == ) ==u"], "jumps": []}, {"id": "P1110", "text": ["When the acceleration at all points is fixed between two points, it is called linear acceleration. To find the instantaneous velocity (V ) at any particular time from an initial velocity (V ) use the following procedure.", "Vinst = ( + a Tinst) + VA ) === ) == ) ==", "inst inst) + V A T inst) + V A ) === ) == ) ==5", "* T inst) + V A T inst) + V A ) === ) == ) ==", "Anst inst) + V A T inst) + V A ) === ) == ) =="], "jumps": []}, {"id": "P1120", "text": ["The velocity at any point in time after T , for example at 2.5 seconds would be 5 feet per second....", "Vinst = + 0 ft / sec = + = 5 ft seccccccccccccc"], "jumps": []}, {"id": "P1130", "text": ["Notice when solving for instantaneous deceleration velocity at any particular time from an initial velocity (V ), the velocity at time 2.5 seconds would be 3 feet per second...", "Vinst = VA + ( - a Tinst) === ) == ) ==", "* T inst) + V A T inst) + V A ) === ) == ) ==A", "Anst inst) + V A T inst) + V A ) === ) == ) =="], "jumps": []}, {"id": "P1140", "text": ["Linear acceleration means velocity is increasing at a linear rate in time. The distance (D ) an object travels during linear acceleration is expressed in the following formula.", "* T inst) + V A T inst) + V A ) === ) == ) =="], "jumps": []}, {"id": "P1150", "text": ["Anst inst) + V A T inst) + V A ) === ) == ) ==e", "However, if the initial velocity (V ) is equal to zero the following equation can be used to solve for distance in linear acceleration of the object (D ).", "AXst inst) + V A T inst) + V A ) === ) == ) =="], "jumps": []}, {"id": "P1160", "text": ["The equation for linear acceleration from zero velocity indicates that distance travels in proportion to the square of the time. For example during acceleration, the distance traveled from point A in 3 seconds is equal to 9 feet...", "D = x 3 sec2 = x x 3 sec2 = x x 32 x sec 2 = 9 ft"], "jumps": []}, {"id": "P1170", "text": ["Graphical analysis of velocity and distance of an object is shown below. Notice with a fixed velocity, the distance traveled per time increment is constant but varies with acceleration or deceleration...", "Linear Acceleration (Increasing Velocity)", "Linear Acceleration (Decreasing Velocity)", "Linear motion can be converted to circular motion, or circular motion may be converted to linear motion. Our discussion in motor control systems will look at circular motion.", "Secondary Motion (effect)) (effect)", "Primary Motion (cause)))))) (effect)", "Secondary Motion (effect))) (effect)", "When converting to circular motion (or vice versa), it is important to remember that a point on a circular surface will exhibit identical velocity, acceleration, and distance traveled as a linear surface contact with its circumference...", "The only difference is that the two motions take different paths: one a straight line, the other a circular path. Conversions of linear to circular motion are popular in industrial controls, as circular motion is easier and cheaper to sense...", "When studying circular motion, whether direct shaft or indirect from rack and pinion, rotational motion and run out are two parameters, which must be understood.", "The rotational motion of a circular surface is usually expressed in RPM (rotations per minute) which is relative motion; whereas, run out is the distance traveled from a point on the circumference of the circular object in a given time period..."], "jumps": []}, {"id": "P1230", "text": ["Run out is usually expressed as a rate, such as feet per second, or inches per minute and is a measure of velocity of a rotating point. Run out rate (ROR) and total run out distance (ROD) are defined in the following formulas...", "ROR = RPM Circumference = RPM 2prrr"], "jumps": []}, {"id": "P1240", "text": ["In this example, a common shaft drives two friction wheels in contact with two separate surfaces. As the shaft rotates, the wheels move on each surface at different rates.", "Runout and RPM in Circular to Linear System"], "jumps": []}, {"id": "P1250", "text": ["The circular motion of points A and B will cause linear motion of the two surfaces which will equal the motion parameters of points A and B (velocity, acceleration and distance). Given the following parameters let's solve for ROR and ROD...", "RPM = 60 rA = 1\" rB = 2\" T = 2 minutess", "60 rotation 2(3.14) (1 in) min rotation", "= x 6.28 in = 376.8 inches / minute", "= x 2 min = 753.6 inchesss"], "jumps": []}, {"id": "P1260", "text": ["A fixed RPM will cause various ROR and ROD depending on the circumference. The plates demonstrate run out, as the plates will run out from under the wheels in a straight line equal to the distance a surface point on the wheel travels in a circle...", "RPM = 60 rA = 1\" rB = 2\" T = 2 minutess", "= x 2 min = 1057.2 inchess", "60 rotation 2(3.14) (2 in) min rotation", "= x 12.56 in = 753.6 inches / minute"], "jumps": []}, {"id": "P1270", "text": ["When the acceleration at all points is fixed between two points, it is called _______ acceleration."], "jumps": ["P1260"]}, {"id": "P1271", "text": [], "jumps": []}, {"id": "P1272", "text": ["Acceleration is a rate of change of velocity..............."], "jumps": []}, {"id": "P1280", "text": ["Motion sensors are only concerned with an object's rate of change and not position in space. For this reason, nearly all motion sensors are frequency devices, where output frequency is proportional to rate of change of motion..."], "jumps": ["P1270"]}, {"id": "P1290", "text": ["The most popular motion sensors used in industry are the photo reflector, photo interrupter, and magnetic pickup. The devices sense surfaces, which repeatedly change during time intervals."], "jumps": []}, {"id": "P1300", "text": ["The motion of the photo interrupter surface must repeatedly make and break the light connection between the emitter and receiver. The motion of the photo reflector surface, allows light to reflect back to the receiver..."], "jumps": []}, {"id": "P1310", "text": ["The magnetic pickup establishes a stationary field through a coil, called bias. When a moving magnetic material surface passes through the field, flux increases. The changing field will induce a current in the coil each time the surface moves..."], "jumps": []}, {"id": "P1320", "text": ["Various surfaces are used on motion sensors. Repetitive surface changes occur as these surfaces move past the sensors, causing a pulse train at the outputs (optical receiver or coil) at the same rate as the motion..."], "jumps": []}, {"id": "P1330", "text": ["The photo interrupter requires a surface that will alternately make and break the light path between emitter and receiver. It can be of any material that will block light."], "jumps": []}, {"id": "P1340", "text": ["The photo reflector sensor requires a surface that will alternately reflect and absorb (or pass) light. It must be of reflective material with holes or openings that will allow the light to pass without reflection..."], "jumps": []}, {"id": "P1350", "text": ["The magnetic pickup requires a surface with changing magnetic permeability to change the bias, such as the presence or absence of a gear tooth near the pickup head. Sometimes small magnets are mounted on the moving surface..."], "jumps": []}, {"id": "P1360", "text": ["The correlation of motion to frequency is accomplished by the moving surface and the sensor. The motion sensor correlates change in velocity to a frequency."], "jumps": []}, {"id": "P1370", "text": ["The motion sensor and surface pair can be a combination of any type. As the surface moves in front of an optical interrupter with a slotted disk, the interrupter alternately senses absence and presence of light..."], "jumps": []}, {"id": "P1380", "text": ["As velocity is a function of distance and time, the frequency can be determined by first solving for velocity.", "v = and = F so v = D x FFFF", "Where: v = velocity of motion D = distance between interrupter mark T = observed cycle time"], "jumps": []}, {"id": "P1390", "text": ["It is difficult to measure velocity directly from a waveform, as calculations are required. The purpose of sensor circuits is to convert the pulse train output of a sensor directly to an analog or digital readout..."], "jumps": []}, {"id": "P1400", "text": ["The simplest motion circuit converts velocity to analog DC. In this circuit, velocity is proportional to a DC voltage or current. The integrated circuit below performs this function."], "jumps": []}, {"id": "P1410", "text": ["The motion sensor and surface pair can be a combination of any type. As the surface moves in front of an optical interrupter with a slotted disk, the interrupter alternately senses absence and presence of light..."], "jumps": []}, {"id": "P1420", "text": ["The interrupter uses an LED phototransistor. The LED is properly biased by +Vcc and R1. The phototransistor is a biased common emitter, zero base bias. As the disk interrupts Q1 (light), Q1 collector outputs a pulse train..."], "jumps": []}, {"id": "P1430", "text": ["The pulse train is wave shaped by A1 for the input to A2. The frequency to voltage (F/V) converter is an MSI chip that outputs a DC voltage in proportion to input frequency in V /Hz. This ratio is called conversion factor or CF."], "jumps": []}, {"id": "P1440", "text": ["The DC output of the frequency to voltage (F/V) converter chip may be read directly on a DC meter calibrated in distance per second.", "v = and = F so v = D x FFFF", "v = D x = x Vouttttt"], "jumps": []}, {"id": "P1450", "text": ["Because the distance (D) between the interrupter slots, and the conversion factor of the F/V chip do not change, (D", "CF) is a constant, and V is a function of velocity in units per second.", "v = D x = x Vouttttt", "Vout = CF x F = x 2 kHz = 2V", "V = x Vout = x 2 V = x x 2 V = 10 in / sec x 2 V = 20 in / secccccccccccccc", "0.01 in 1V 1 kHz k"], "jumps": []}, {"id": "P1460", "text": ["Given, F = 2 kHz, D = 0.01 between slots, and CF = 1 V/1 kHz, then V equals 2 volts and the velocity equals 20 inches per second. Therefore, one volt of V corresponds to 10 inches per second of system velocity...", "v = D x = x Vouttttt", "Vout = CF x F = x 2 kHz = 2V", "V = x Vout = x 2 V = x x 2 V = 10 in / sec x 2 V = 20 in / secccccccccccccc", "0.01 in 1V 1 kHz k"], "jumps": []}, {"id": "P1470", "text": ["Remembering that acceleration is a change of velocity in time, the output of the circuit is a DC voltage proportional to velocity. If velocity changes, V will change.."], "jumps": []}, {"id": "P1480", "text": ["In the case of linear acceleration, V will ramp up if acceleration is (+) or ramp down if acceleration is (-). In all cases, V is proportional to acceleration."], "jumps": []}, {"id": "P1490", "text": ["A differentiator is an electrical circuit that will sense a changing voltage but disregard absolute values. With (V 1) as the input, the output of the differentiator (A3) develops a DC voltage proportional to acceleration.."], "jumps": []}, {"id": "P1500", "text": ["Notice that an output from A3 only occurs if the A2 output changes. Based on differential theory, the rate of change of V determines the shape and magnitude of V . The linear input change will cause a fixed DC output.."], "jumps": []}, {"id": "P1510", "text": ["To help understand the operations illustrated, let's solve for acceleration and calculate the differentiator conversion factor given these parameters.", "D = 0.01\" F changes from 1 kHZ to 2 kHZ in 1 second F/V conversion factor = 1 V/ 1 kHZ RF = 1 MW C = m"], "jumps": []}, {"id": "P1520", "text": ["The F/V chip A2 output is a DC voltage (V 1) in proportion to F . Given that F will change from 1 kHz to 2 kHz in one second, V 1 will change from 2 volts at 1 kHz inch to 4 volts at 2 kHz inch...", "D = 0.01\" F changes from 1 kHZ to 2 kHZ in 1 second F/V conversion factor = 1 V/ 1 kHZ RF = 1 MW C = m"], "jumps": []}, {"id": "P1530", "text": ["If V 1 changes from 2 volts to 4 volts, the velocity changes from 20 inches per second at 1 kHz inch to 40 inches per second at 2 kHz inch and the acceleration equals 20 in/sec .", "D = 0.01\" F changes from 1 kHZ to 2 kHZ in 1 second F/V conversion factor = 1 V/ 1 kHZ RF = 1 MW C = m"], "jumps": []}, {"id": "P1540", "text": ["The integrator output V , will react to the V change of 2 volts in one second according to the operational amplifier differentiator action and the -V value will be proportional to acceleration.", "D = 0.01\" F changes from 1 kHZ to 2 kHZ in 1 second F/V conversion factor = 1 V/ 1 kHZ RF = 1 MW C = m"], "jumps": []}, {"id": "P1550", "text": ["The -V value is proportional to acceleration where there is a -2-volt output for an acceleration of 20 in/sec . Therefore, the differentiator has a conversion factor of -1 volt per 10 in/sec of acceleration...", "Vout = x (RF) CIN = x (1W) (1m"], "jumps": []}, {"id": "P1560", "text": ["The sensing of rotary motion in RPM is perhaps the most popular application of motion sensors. Velocity in this application is relative and not absolute, as without a known circumference, run out or circular motion in distance per revolution cannot be computed..."], "jumps": []}, {"id": "P1570", "text": ["This rotary motion application uses the same velocity sensing circuit as before, except the velocity (v) and RPM are directly proportional. One circuit may perform both functions by simply connecting two F/V chips to the buffer output, with one scaled for velocity and the other for RPM..."], "jumps": []}, {"id": "P1580", "text": ["In measuring RPM, the distance (D) between the sensing edges is unimportant; it is only the number (N) of sensing marks which occur for each revolution (F ) of the rotating object that is significant..", "RPM = RPS x 60 = x 60 Rearranging: RPM = FIN xxxxxxxxxxxxxxx"], "jumps": []}, {"id": "P1590", "text": ["Using our rotary motion circuit, we can calculate the revolutions per minute (RPM) in correlation to the voltage output of the F/V converter chip.", "60 sensor marks / revolution of the shaft F /V chip = 1 V / 1 kHz Vout of F / V chip = 2 V", "RPM = 2 V x = 2 V x x = 2 V x 1 x 1k = 200000000"], "jumps": []}, {"id": "P1600", "text": ["With V equal to 2 volts for an RPM equaling 2000, then the circuit converts 1 volt to 1000 RPM. The voltmeter scale could be calibrated in this ratio to read k RPM directly."], "jumps": []}, {"id": "P1610", "text": ["The velocity of a point on a rotating disk is not affected by _______"], "jumps": ["P1600"]}, {"id": "P1611", "text": [], "jumps": []}, {"id": "P1612", "text": ["RPM and Run out Rate affect the velocity of a point on a rotating disk.", "Runout and RPM in Circular to Linear System"], "jumps": []}, {"id": "P1620", "text": ["A motion detector circuit will not sense one of the following parameters."], "jumps": ["P1610"]}, {"id": "P1621", "text": [], "jumps": []}, {"id": "P1622", "text": ["Velocity and acceleration can be calculated from a motion detector circuit."], "jumps": []}, {"id": "P1910", "text": ["You have completed the information on MOTION DETECTION....."], "jumps": ["P1620", "P1001"]}, {"id": "P1920", "text": ["1. There are various terms and concepts relating to motion that must be understood when studying motion detector circuits. The velocity of an object is the rate of change-of-distance the object exhibits in a particular direction...", "Where: D = distance between two points T = time at position indicatedd"], "jumps": ["P1001", "P1930"]}, {"id": "P1930", "text": ["2. The equation for linear acceleration from zero velocity indicates that distance travels in proportion to the square of the time. For example during acceleration, the distance traveled from point A in 3 seconds is equal to 9 feet....", "D = x 3 sec2 = x x 3 sec2 = x x 32 x sec 2 = 9 ft", "3. When converting to circular motion (or vice versa), it is important to remember that a point on a circular surface will exhibit identical velocity, acceleration, and distance traveled as a linear surface contact with its circumference...", "Primary Motion (cause)))))) (effect)", "Secondary Motion (effect)) (effect)", "Secondary Motion (effect))) (effect)", "4. The rotational motion of a circular surface is usually expressed in RPM (rotations per minute) which is relative motion; whereas, run out is the distance traveled from a point on the circumference of the circular object in a given time period."], "jumps": []}, {"id": "P1960", "text": ["5. The most popular motion sensors used in industry are the photo reflector, photo interrupter, and magnetic pickup. The devices sense surfaces, which repeatedly change during time intervals..."], "jumps": []}, {"id": "P1970", "text": ["6. A differentiator is an electrical circuit that will sense a changing voltage but disregard absolute values. With (V 1) as the input, the output of the differentiator (A3) develops a DC voltage proportional to acceleration."], "jumps": []}, {"id": "P1980", "text": ["7. The sensing of rotary motion in RPM is perhaps the most popular application of motion sensors. Velocity in this application is relative and not absolute, as without a known circumference, run out or circular motion in distance per revolution cannot be computed.", "Vout = x (RF) CIN = x (1W) (1m"], "jumps": []}, {"id": "P1990", "text": ["8. In measuring RPM, the distance (D) between the sensing edges is unimportant; it is only the number (N) of sensing marks, which occur for each revolution (F ) of the rotating object that is significant."], "jumps": ["P1999"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1990", "P1001"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text"       b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
</body>
