const book = {"title": "93954401", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Title: INTRODUCTION TO FLIP-FLOPSd fasfd asdf asdf sadf", "Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P10", "text": ["INTRODUCTION TO LATCHES AND FLIP-FLOPSSS"], "jumps": []}, {"id": "P100", "text": ["w Describe the operation of RS and RS latches. w Identify the RS and RS latch truth table. w Describe the race condition in the RS and RS latch.hhhhhhhhhhhhhh", "w Identify the difference between a sequential and a combinational circuit. w Recognize a SET and RESET condition. w Understand basic flip-flop operation.....", "2. THE RS AND RS LATCHLATCHer objective 1 line item 2 here. item 2 here.e.e.", "1. SEQUENTIAL CIRCUITS Enter objective 1 line item 2 here. item 2 here.e.e."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P1206", "text": ["The NAND gate active-LOW input RS latch can be constructed with alternate logic gate equivalents.ted with negative-OR gates.n the gates. gates.es...........ween them is that the flip-flop has a separate input for a clock pulse, while the latch operates without a clock...", "Circuits that store information are important to a multitude of devices ranging from pocket calculators to VCRs to computers."], "jumps": ["P1210", "P1204", "P420", "P400"]}, {"id": "P420", "text": ["There are several components used by these devices to store information.............................", "* Flip-Flops * Latches * Magnetic Core Memory"], "jumps": ["P410", "P430"]}, {"id": "P1192", "text": ["A latch changes states when its inputs are changed. A flip-flop changes states when the clock pulse is changed.es..................ses the output of the bistable multivibrator to flip and flop). arate input for a clock pulse, while the latch operates without a clock..."], "jumps": ["P1200", "P1190"]}, {"id": "P440", "text": ["Let's begin the lesson on INTRODUCTION TO LATCHES AND FLIP-FLOPS............"], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Combinational Sequential Magnetic Core Memoryy", "Digital circuits can be classified in two categories. The difference between the two is the way that they produce outputs."], "jumps": ["P1001", "P1030"]}, {"id": "P1030", "text": ["Combinational circuits produce outputs only when an input is applied. They are composed of logic gates that have no feedback from output to input."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["When the input is removed, the output stops."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["As a result, combinational circuits cannot store information."], "jumps": ["P1030", "P1060"]}, {"id": "P430", "text": ["This lesson concentrates on latches and flip-flops...........p-flops..lip-flops."], "jumps": ["P440", "P410"]}, {"id": "P430", "text": ["This lesson concentrates on latches and flip-flops...........p-flops..lip-flops."], "jumps": ["P440", "P410"]}, {"id": "P1208", "text": ["Flip-flops are constructed of many logic gates and there are several different gate configurations used to create storage flip-flops....he gates............ween them is that the flip-flop has a separate input for a clock pulse, while the latch operates without a clock..."], "jumps": ["P1210", "P1200"]}, {"id": "P1070", "text": ["The circuit below is nothing more than a single OR gate with its output tied to one input leg. The other input leg is tied to a switch. The switch is used to apply either ground or 5 volts......."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["The line tying the output to the input is called a feedback line. The purpose of the feedback line is to provide a path for the output of the gate to be returned to the input.owing the gate to \"remember\" its previous output. Its purpose is to provide a path for the output of the gate to be applied to the gate's input..."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["You may recall that feedback is used in other areas of electronics such as operational amplifiers, where it regulates the output of the amplifier."], "jumps": ["P1100", "P1070"]}, {"id": "P1100", "text": ["In a sequential circuit the feedback line is the defining factor. It allows the gate to \"remember\" its previous output. It is the defining factor efining factor factor in a sequential circuit.ential circuit.ential circuit.."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["Let's examine the operation of this sequential circuit, following OR gate logic (any HIGH in equals a HIGH out). gates that any HIGH input produces a HIGH output."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["Step 1: A HIGH is applied to the input side of the OR gate.. If we remove the input, the feedback line supplies the HIGH from the output, forcing the gate's output to remain HIGH even with the input removed. The gate \"remembers\" its previous state...", "When a HIGH is applied to the input....."], "jumps": ["P1121", "P1110"]}, {"id": "P1020", "text": ["Combinational Sequential Magnetic Core Memoryy", "Digital circuits can be classified in two categories. The difference between the two is the way that they produce outputs.", "remain HIGH even with the input removed. The gate \"remembers\" its previous state...", "When a HIGH is applied to the input....."], "jumps": ["P1001", "P1030"]}, {"id": "P1122", "text": ["Step 3: The HIGH output is fed back into the OR gate by way of the feedback line... which keeps the gate's output hig HIGH from the output, forcing the gate's output to remain HIGH even with the input removed. The gate \"remembers\" its previous state...", "...the output of the OR gate goes high.", "When a HIGH is applied to the input.....", "The feedback loop applies the HIGH output to the OR gate's input.input."], "jumps": ["P1123", "P1121"]}, {"id": "P1123", "text": ["Step 4: The output of the OR gate remains HIGH even if the input is removed, due to the feedback line continuously feeding the HIGH input back into the gate...output to remain HIGH even with the input removed. The gate \"remembers\" its previous state...", "...the output of the OR gate remains high...he feedback line"], "jumps": ["P1124", "P1122"]}, {"id": "P1124", "text": ["To summarize, when a HIGH is applied to the input, the feedback line sustains a HIGH output by keeping a HIGH on one input.put.s the HIGH from the output, forcing the gate's output to remain HIGH even with the input removed. The gate \"remembers\" its previous state."], "jumps": ["P1130", "P1123"]}, {"id": "P1130", "text": ["If the gate's only purpose were to go HIGH at some given moment in time and remain that way forever, this circuit would be very effective."], "jumps": ["P1124", "P1140"]}, {"id": "P1140", "text": ["Unfortunately, most electronic circuits require a way to easily switch from one output to another on demand."], "jumps": ["P1124", "P1150"]}, {"id": "P1192", "text": ["A latch changes states when its inputs are changed. A flip-flop can only change states when the clock pulse is changed.............ses the output of the bistable multivibrator to flip and flop). arate input for a clock pulse, while the latch operates without a clock..."], "jumps": ["P1200", "P1190"]}, {"id": "P1160", "text": ["Which circuit uses a feedback line to maintain an output after the input is removed???"], "jumps": ["P1150"]}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1162", "text": ["Combinational circuits are composed of logic gates that have no feedback from output to input..."], "jumps": []}, {"id": "P1163", "text": ["Analog circuits are not digital; they use solid-state components, such as transistors, in their circuitry."], "jumps": []}, {"id": "P1170", "text": ["Circuits composed of logic gates that have no feedback lines are called _______"], "jumps": ["P1160"]}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1172", "text": ["Sequential circuits use feedback lines that enable them to store or \"remember\" information."], "jumps": []}, {"id": "P1173", "text": ["There is no such thing as a symmetrical circuit............"], "jumps": []}, {"id": "P1180", "text": ["output of a gate back to an input.n input.", "output of one gate to the output of another gate.er gate.", "Feedback lines are used to tie the _______................."], "jumps": ["P1170"]}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1182", "text": ["Remember, a feedback line allows the gate to \"remember\" its previous output. The feedback line is the defining factor in a sequential circuit..........................................................................................cuit.."], "jumps": []}, {"id": "P1280", "text": ["Due to their circuit complexity, flip-flops are almost never drawn out as a logic diagram. Rather, like latches, they are represented by a logic symbol with the labeled inputs and outputs defining their type..g their type...........g their type."], "jumps": ["P1290", "P1272"]}, {"id": "P1215", "text": ["Complement - Inversion. Low is the complement of High, and zero is the complement of one.aaaaaa", "nimations on P2260 and 2290, inserted graphic of cars on p2940 and P2980. Jeff Hatcher 05-19-03 Released Lesson. -Penny"], "jumps": ["P1210"]}, {"id": "P1195", "text": ["BISTABLE - Having two stable states. For example, the latch's states are 1 and 0.d 0.ine here.ond line here."], "jumps": []}, {"id": "P1200", "text": ["The basic latch is constructed of two gates (either NOR or NAND gates or their equivalents) with the feedback lines cross-coupled between the gates.........ween them is that the flip-flop has a separate input for a clock pulse, while the latch operates without a clock..."], "jumps": ["P1202", "P1192"]}, {"id": "P1202", "text": ["An active-HIGH input RS latch is constructed of two NOR gates. LOW input RS latch is constructed of two NAND gates.en the gates. gates.es...........ween them is that the flip-flop has a separate input for a clock pulse, while the latch operates without a clock..."], "jumps": ["P1204", "P1200"]}, {"id": "P1204", "text": ["An active-LOW input RS latch is constructed of two NAND gates.. Active-LOW input RS latch is constructed of two NAND gates.en the gates. gates.es...........ween them is that the flip-flop has a separate input for a clock pulse, while the latch operates without a clock..."], "jumps": ["P1206", "P1202"]}, {"id": "P1950", "text": ["4. Flip-flops use clock signals to change states; latches do not. ..........................."], "jumps": ["P1960", "P1940"]}, {"id": "P1190", "text": ["Now let's discuss latches and flip-flops. Even though latches and flip-flops are both used as memory devices, and both are bistable, they are different. The biggest difference between them is how they change from one state to another.......her..............., while the latch operates without a clock.lock................................................................"], "jumps": ["P1192", "P1180"]}, {"id": "PINFO", "text": ["12-11-02 Converted from sty to tbk (this copy is to replace original 4401. frieda 12-16-02 Text and Branching completed. frieda 12-17-02 Graphics. frieda 12-18-02 Completed graphics without animation and ran lesson. frieda 12-20-02 ran and checked lesson. frieda 01-02-03 Animation P1040, animation P1060, animation P1120, animation P2230, added people to cars on P2180, animations on P2260 and 2290, inserted graphic of cars on p2940 and P2980. Jeff Hatcher 05-19-03 Released Lesson. -Penny 07-31-03 P1160, changed text from \"Which circuit uses a feedback line?\" to \"Which circuit uses a feedback line to maintain an output after that the input is removed?' P1163, changed text from \"Analog circuits are not digital; they use solid-state components, such as transistors, in ciruitry.\" to \"Analog circuits may use feedback but will not maintain an output after the input is removed. P1206, changed text from \"...negative-or..\" to \"alternate logic\" - Dean 12-05-03 P1950, replaced comma with a semi-colon. P1960, changed \"They are\" to \"It is\". -Penny", "circuits may use feedback but will not maintain an output after the input is removed. P1206, changed text from \"...negative-or..\" to \"alternate logic\" - Dean"], "jumps": []}, {"id": "P1220", "text": ["A more sophisticated flip-flop is designed to prevent Q and Q from ever being the same state. Latches, on the other hand, can have the same outputs. This can cause problems, as we will see..."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["When a latch's Q output is HIGH and its Q output is LOW, the latch is considered SET. This output state is also referred to as the HIGH or 1 state. e normal output, Q=1. ormal output, Q=1."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["When a latch's Q output is LOW and its Q output is HIGH, the latch is considered RESET. This output state is also referred to as the LOW or 0 state."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["These two output states coincide with the \"S\" (SET) and \"R\" (RESET) inputs. en the output state is said to be HIGH, it means there is a 1 present on the normal (Q) output. This is also referred to as SET. he output states of latches and flip-flops are: SET, HIGH and Q = 1 or RESET, LOW and Q = 1"], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["On the occasion that both outputs are the same, the terms most frequently used for the output condition are: \"ILLEGAL\", \"UNDESIRED\", and \"INVALID\". In this lesson, we will use \"INVALID.\"his lesson, we will use \"invalid.\""], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["Schematically, latches are indicated by either a logic diagram of the circuit (the two cross-coupled gates) or a logic symbol (rectangular box)....)..box)................"], "jumps": ["P1272", "P1260"]}, {"id": "P1272", "text": ["Compare the logic diagram to the logic symbol and notice the letters \"R\" and \"S\" are opposite each other. Reversing the letters on the logic diagram keeps Q and Q in the same positions as the logic symbol.he logic symbol.l."], "jumps": ["P1280", "P1270"]}, {"id": "P1274", "text": ["Latches are referred to as having either active-HIGH or active-LOW inputs. \"S\" are opposite each other. Reversing the letters on the logic diagram keeps Q and Q in the same positions as the logic symbol.he logic symbol.l."], "jumps": ["P1280", "P1270"]}, {"id": "P1150", "text": ["In order to accommodate this requirement, latches and flip-flops were developed.oped."], "jumps": ["P1160", "P1124"]}, {"id": "P1290", "text": ["When the output condition of a latch or flip-flop has Q HIGH and Q LOW, the device is considered ____________"], "jumps": ["P1280"]}, {"id": "P1291", "text": [], "jumps": []}, {"id": "P1292", "text": ["When SET, Q is HIGH and Q is LOW..........................."], "jumps": []}, {"id": "P1293", "text": ["This condition has both outputs the same..................."], "jumps": []}, {"id": "P1300", "text": ["Latches are made from cross-coupling two gates, which are either _______ or _______ or their equivalents."], "jumps": ["P1290"]}, {"id": "P1301", "text": [], "jumps": []}, {"id": "P1302", "text": ["XOR gates are not used in the construction of a latch......"], "jumps": []}, {"id": "P1303", "text": ["AND gates are not used in the construction of a latch......"], "jumps": []}, {"id": "P1310", "text": ["26 + 25 + 22 + 21 + 20 64 + 32 + 4 + 2 + 1 103 !", "Because latches and flip-flops are used extensively in digital circuits in the form of registers, counters and memory circuits, having a firm grasp of their operations will greatly assist you in your digital studies..."], "jumps": ["P1300", "P1910"]}, {"id": "P1910", "text": ["This completes the information on SEQUENTIAL CIRCUITS......"], "jumps": ["P1310", "P1001"]}, {"id": "P1920", "text": ["1. Sequential circuits are circuits in which the output logic state and sequence of operations is dependent on both past and present input conditions. This behavior is a result of using feedback from output to input..."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. The purpose of the feedback line is to provide a path for the output of a gate to be returned to the input, allowing the gate to \"remember\" its previous state.."], "jumps": ["P1920", "P1940"]}, {"id": "P1940", "text": ["3. Latches are constructed by using feedback lines to cross- couple two gates."], "jumps": ["P1950", "P1920"]}, {"id": "P1210", "text": ["Latches and flip-flops have two outputs, designated as Q and Q (spoken as either \"Q NOT\" or \"NOT Q\"). Ideally, the output state of Q and Q should be opposite at all times. Also known as complementary outputs. gned to prevent Q and Q from ever being the same state..ck..."], "jumps": ["P1220", "P1206", "P1215"]}, {"id": "P1960", "text": ["5. A latch or flip-flop is considered SET when its Q output is HIGH and its Q is LOW. It is considered RESET when its Q output is LOW and Q is HIGH."], "jumps": ["P1999", "P1950"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1960", "P1001"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["The RS latch is constructed of two cross-coupled NOR gates. The feedback lines extend from the outputs of each gate and connect to an input leg of the opposite gate."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["The two inputs are SET (S) and RESET (R) and the two outputs are Q and Q. Remember that when the latch is SET it means that Q is 1 and Q is 0. When the latch is RESET, Q is 0 and Q is 1."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["To understand the operation of the RS latch we will examine all of its possible input combinations."], "jumps": ["P2020", "P2050"]}, {"id": "P2050", "text": ["When power is first applied, the latch will normally assume some output condition, meaning Q will either be HIGH or it will be LOW, and Q will be the inverse of Q.f Q................."], "jumps": ["P2060", "P2020"]}, {"id": "P2060", "text": ["For simplicity, assume the latch will have no output. As we step through its operations, we will fill in its truth table. not change. This condition is labeled in the truth table as NO CHANGE."], "jumps": ["P2070", "P2020"]}, {"id": "P2070", "text": ["The first inputs applied are S = 0 and R = 0. Since the inputs of a NOR gate need a HIGH input to produce a LOW output, the outputs of the latch do not change. This condition is labeled in the truth table as \"NO CHANGE\". If the flip-flop had started in the RESET state, it would stay in the RESET state with this input."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["The next inputs are S = 0 and R = 1. This is the RESET input. As soon as the HIGH is applied to the top NOR gate, the Q output goes LOW.ally goes LOW."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["The LOW is sent via the feedback line to the upper leg of the bottom NOR gate. With two LOW inputs, the Q output goes HIGH, placing the latch in a RESET condition.. in a RESET condition."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["Notice that if the HIGH is now removed from the RESET input, the latch will not change - it will, in effect, remember its last state....."], "jumps": ["P2080", "P2110"]}, {"id": "P2110", "text": ["The next inputs are S = 1 and R = 0. This is the SET input. When a HIGH is applied to the lower NOR gate, the output goes LOW."], "jumps": ["P2120", "P2080"]}, {"id": "P2120", "text": ["That LOW is then transferred to the upper gate through the feedback line, putting two LOWs on the upper gate. This forces the Q output HIGH and that, in turn, places the latch in the SET condition."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["1 1 0 0 (INVALID)", "The last input combination is S = 1 and R = 1. This is the INVALID input condition. In this state, both NOR gates receive a HIGH input. This forces Q and Q LOW.. output LOWs.OWs."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["These inputs are considered invalid because it is like wanting a light turned on and off simultaneously. Or, viewed another way, a two-way switch that has the same result regardless of the position......"], "jumps": ["P2130", "P2150"]}, {"id": "P2150", "text": ["The RS latch is made from two cross-coupled ________......."], "jumps": ["P2130"]}, {"id": "P2151", "text": [], "jumps": []}, {"id": "P2152", "text": ["Two cross-coupled NAND gates makes an RS latch............."], "jumps": []}, {"id": "P2153", "text": ["XNOR gates are never used to construct a latch............."], "jumps": []}, {"id": "P2160", "text": ["Which input condition will cause the output condition of an RS latch to be INVALID..............................................."], "jumps": ["P2150"]}, {"id": "P2161", "text": [], "jumps": []}, {"id": "P2162", "text": ["This is the NO CHANGE state................................", "1 1 0 0 VALID)"], "jumps": []}, {"id": "P2163", "text": ["This input combination will place the latch in a SET condition.", "1 1 0 0 VALID)"], "jumps": []}, {"id": "P2170", "text": ["S R Q Q 0 0 0 1 1 0 1 1 1 1111111111111111", "Fill in the truth table's missing values......................nswers (1, 2, buckle, shoes).."], "jumps": ["P2160"]}, {"id": "P2173", "text": ["S R Q Q 0 0 0 1 1 0 1 1 1 1111111111111111", "Your answers are still incorrect. Your responses should have been:"], "jumps": ["P2170", "P2180"]}, {"id": "P2180", "text": ["The biggest problem associated with an RS latch is known as the RACE condition."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["Under normal operating conditions, this problem will never occur, but it can occur as an indirect result of placing the INVALID input combination on the latch."], "jumps": ["P2180", "P2200"]}, {"id": "P2200", "text": ["1 1 0 0 (INVALID)", "Suppose the S = 1 and R = 1 inputs are applied to an RS latch. We know the outputs will be Q = 0 and Q = 0. That, in itself, is not a good thing, but the outputs are predictable."], "jumps": ["P2210", "P2180"]}, {"id": "P2210", "text": ["What makes the INVALID input combination so undesirable is that it sets up the latch for what is called RACE condition."], "jumps": ["P2200", "P2220"]}, {"id": "P2220", "text": ["RACE condition is when the two gates are both trying to go HIGH at the same time and literally race against each other until one of them goes HIGH first, latching the other gate LOW. The problem is that it's entirely unpredictable..."], "jumps": ["P2200", "P2230"]}, {"id": "P2360", "text": ["The RS latch can be constructed using two cross-coupled NAND gates (commonly represented by equivalent NANDs) and when this is done, the latch is called an RS latch or simply a NAND latch........"], "jumps": ["P2370", "P2350"]}, {"id": "P400", "text": ["This lesson introduces a class of circuits designed to store information, even when the input is removed. In a sense, they \"remember\" their last input."], "jumps": ["P300", "P410"]}, {"id": "P2170", "text": ["S R Q Q 0 0 0 1 1 0 1 1 1 1111111111111111", "Fill in the truth table's missing values......................nswers (1, 2, buckle, shoes).."], "jumps": ["P2160"]}, {"id": "P2530", "text": ["When the device is drawn on a schematic using gates, the identification comes from the gate symbol itself, be it a conventional NAND or its equivalent.", "It was the problem of the RACE condition that spawned the term \"undetermined\" used on the truth table for the INVALID input condition. As you can see the INVALID input condition produces only Q = 0 and Q = 0, but it is the setup for the RACE condition.."], "jumps": ["P2540", "P2520", "P2250", "P2230"]}, {"id": "P2250", "text": ["One of the driving forces behind the development of the RS latch was to create a \"bounceless\" electronic switch with the ability to switch between HIGH and LOW without the contact bounce inherent in mechanical switches..."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["When a mechanical switch is operated, there is always some degree of contact bounce. The diagram below shows the effect of the bounce on a digital signal.W without the contact bounce inherent in mechanical switches..."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["Notice that switching from one position to the other actually produces several voltage spikes before the switch contact comes to rest. While the period of bounce may only last a few milliseconds, in digital circuits this is an eternity of havoc.avoc..."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["When a latch is employed, the effect of contact bounce is eliminated. Let's look at an example. This switch is in its normal position, holding the latch in a RESET condition."], "jumps": ["P2290", "P2260"]}, {"id": "P2290", "text": ["When the switch is moved, it applies 5 volts to the S input. The switch will still bounce, but the latch will become SET during the very first contact of the switch. All successive bounces will be ignored because the device has already latched into the SET condition.ssive bounces will be ignored because the device has already latched into the SET condition."], "jumps": ["P2310", "P2280"]}, {"id": "P2310", "text": ["In digital circuitry, this is one of the most useful purposes for the RS latch.."], "jumps": ["P2290", "P2320"]}, {"id": "P2320", "text": ["INVALID input state is followed by the NO CHANGE input state.ate.", "NO CHANGE condition is followed by the INVALID input state.ate.", "set condition is followed by the INVALID input state.ate.", "In the RS latch, RACE condition occurs when the _______...."], "jumps": ["P2290"]}, {"id": "P2321", "text": [], "jumps": []}, {"id": "P2322", "text": ["This event will only drive the two outputs LOW............."], "jumps": []}, {"id": "P2330", "text": ["One of the most useful purposes for the RS latch is as a _______"], "jumps": ["P2320"]}, {"id": "P2331", "text": [], "jumps": []}, {"id": "P2332", "text": ["RS latches are not used for this purpose..................."], "jumps": []}, {"id": "P2340", "text": ["With the inputs on the latch as shown, what is the output condition?"], "jumps": ["P2330"]}, {"id": "P2341", "text": [], "jumps": []}, {"id": "P2342", "text": ["The SET condition requires S = 1 and R = 0................."], "jumps": []}, {"id": "P2343", "text": ["The INVALID condition requires S = 1 and R = 1............."], "jumps": []}, {"id": "P2350", "text": ["RS latches are a fairly common device found in digital circuitry and are an important subject for technicians to understand. Memorizing the simple truth table is a worthwhile endeavor."], "jumps": ["P2360", "P2340"]}, {"id": "P1150", "text": ["In order to accommodate this requirement, latches and flip-flops were developed.oped.", "EQUIVALENT NANDS - By connecting the right number of NAND or NOR gates together the behavior of any other gate can be duplicated. NAND and NOR gates are said to be universal. e when the right number of gates are connected. They are said to be universal. id to be universal."], "jumps": ["P1160", "P1124"]}, {"id": "P2370", "text": ["Their operation is the same as the NOR latch, but the logic is reversed."], "jumps": ["P2360", "P2380"]}, {"id": "P2380", "text": ["Since the SET and RESET inputs in the NAND latch are active LOW, it is often schematically depicted using the equivalent NAND gates. It also makes examination of the latch easier to follow in this form..."], "jumps": ["P2390", "P2360"]}, {"id": "P2390", "text": ["The two inputs are Set NOT(S) and Reset NOT (R) and the two outputs are Q and Q. Remember that when the latch is SET it means that Q =1 and Q = 0. When the latch is RESET, Q = 0 and Q = 1. This much doesn't change..........."], "jumps": ["P2380", "P2400"]}, {"id": "P2400", "text": ["Since the NAND latch works opposite from the NOR latch, we'll begin analysis from the bottom of the truth table."], "jumps": ["P2380", "P2410"]}, {"id": "P2410", "text": ["When the input condition of R=1 and S=1 is applied to the latch there is no change or hold condition. Since both inputs are inhibited, they are active low. This results in no action occurring in the latch. This is the NO CHANGE or HOLD state...te..te."], "jumps": ["P2420", "P2380"]}, {"id": "P2420", "text": ["The next input combination is S = 1 and R = 0. This is the RESET input. As soon as the LOW is applied to the bottom NAND gate, its output automatically goes HIGH. The HIGH is sent via the feedback line to the bottom leg of the upper NAND gate."], "jumps": ["P2430", "P2380"]}, {"id": "P2430", "text": ["With two HIGH inputs, the upper NAND gate goes LOW. The LOW on the output of the upper NAND gate feeds back to the lower gate, latching in a RESET condition."], "jumps": ["P2420", "P2440"]}, {"id": "P2440", "text": ["The next input combination is S = 0 and R = 1. This is the SET input. As soon as the LOW is applied to the upper NAND gate, the output goes HIGH. The HIGH is sent via the feedback line to the upper leg of the lower NAND gate."], "jumps": ["P2450", "P2420"]}, {"id": "P2450", "text": ["With two HIGH inputs, the lower NAND gate goes LOW. The LOW on the output of the lower NAND gate feeds back to the upper gate, latching in a SET condition.?"], "jumps": ["P2440", "P2460"]}, {"id": "P2460", "text": ["The last input combination is S = 0 and R = 0. This is the INVALID input condition. In this state, both NAND gates receive a LOW input. This forces both gates to output HIGHs."], "jumps": ["P2470", "P2440"]}, {"id": "P2470", "text": ["Just as with the RS latch, this output condition is INVALID and should be avoided for the same reasons."], "jumps": ["P2460", "P2480"]}, {"id": "P2480", "text": ["The SET condition for an RS latch requires which inputs??????"], "jumps": ["P2460"]}, {"id": "P2481", "text": [], "jumps": []}, {"id": "P2482", "text": ["This input combination creates an INVALID output condition."], "jumps": []}, {"id": "P2483", "text": ["This input combination creates a RESET output condition...."], "jumps": []}, {"id": "P2490", "text": ["The RS latch is constructed using two cross-coupled _______"], "jumps": ["P2480"]}, {"id": "P2491", "text": [], "jumps": []}, {"id": "P2492", "text": ["This configuration makes an RS Latch......................."], "jumps": []}, {"id": "P2493", "text": ["Latches are never constructed from inverters..............."], "jumps": []}, {"id": "P2500", "text": ["The RS latch experiences RACE condition just as in the RS latch. The difference is that the RACE condition is brought about by placing two LOWs on the inputs followed by two HIGHs......."], "jumps": ["P2490", "P2510"]}, {"id": "P2510", "text": ["This is exactly the opposite of the RS latch, but equally problematic. An unpredictable output is never a welcome condition in any electronic device."], "jumps": ["P2500", "P2520"]}, {"id": "P2520", "text": ["The schematic symbol for the RS latch is the same as the RS latch except for the presence of the state indicators (bubbles) on the inputs, or NOT signs over the S and the R. Often, the symbol will be drawn using both types of identifiers........"], "jumps": ["P2500", "P2530"]}, {"id": "P2530", "text": ["When the device is drawn on a schematic using gates, the identification comes from the gate symbol itself, be it a conventional NAND or its equivalent."], "jumps": ["P2540", "P2520"]}, {"id": "P2540", "text": ["The RS latches (NAND & NOR) are commonly found in integrated circuit packages, usually dual (two) or quad (four) per IC."], "jumps": ["P2530", "P2550"]}, {"id": "P2550", "text": ["In packaged forms the inputs and outputs are numbered as shown below."], "jumps": ["P2540", "P2560"]}, {"id": "P2560", "text": ["In most instances, the choice of which type of latch to use is more a matter of convenience for the engineer designing the circuit than anything else. Both devices perform the same function and can normally be used interchangeably..."], "jumps": ["P2570", "P2550"]}, {"id": "P2570", "text": ["This is not to say that a NOR gate latch in an existing circuit can be replaced by a NAND gate latch -- components would be going HIGH when they should be LOW, etc., causing some truly bizarre results! But either type could be easily engineered into a circuit..."], "jumps": ["P2560", "P2910"]}, {"id": "P2800", "text": [], "jumps": []}, {"id": "P2801", "text": [], "jumps": []}, {"id": "P2910", "text": ["This completes the information on RS & RS LATCHES.........."], "jumps": ["P2560", "P2001"]}, {"id": "P2920", "text": ["1. The RS latch is constructed by cross-coupling two NOR gates."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2. The truth table for the RS latch is:..................."], "jumps": ["P2920", "P2940"]}, {"id": "P2940", "text": ["3. RACE condition in the RS latch occurs when the INVALID input is followed by a NO CHANGE input."], "jumps": ["P2950", "P2930"]}, {"id": "P2950", "text": ["4. The RS latch is constructed by cross-coupling two NAND gates."], "jumps": ["P2960", "P2940"]}, {"id": "P2960", "text": ["5. The truth table for the RS latch is:coupling two NAND gates.5"], "jumps": ["P2970", "P2950"]}, {"id": "P2970", "text": ["6. The RS and RS latches are commonly used as contact bounce eliminators........"], "jumps": ["P2980", "P2950"]}, {"id": "P2980", "text": ["7. RACE condition in the RS latch occurs when the INVALID input (two LOWs) is followed by a NO CHANGE input (two HIGHs)."], "jumps": ["P2999", "P2970"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2980", "P2001"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["composed of logic gates that use feedback from output to input.", "composed of logic gates that have no feedback from output to input.", "that combine digital and analog circuits. !", "Combinational circuits are circuits_______"], "jumps": []}, {"id": "P10211", "text": ["in which the output logic states and sequence of operations is dependent on both past and present input conditions. itions.", "that are connected in a logical sequence. uence. H", "that have two outputs that are always the same. e same.", "composed of logic gates that have no feedback from output to input. input. l", "Sequential circuits are circuits _______"], "jumps": []}, {"id": "P10212", "text": ["continue to operate after power is removed.", "only produce an output when an input is applied. a", "store their output even after the input is removed."], "jumps": []}, {"id": "P10213", "text": ["When a feedback line is used in a logic (digital) circuit, it is called a/an _______ q", "When a feedback line is used in a logic (digital) circuit, it is called a / an _______"], "jumps": []}, {"id": "P10214", "text": ["Circuits composed of logic gates that have no feedback lines are called _______"], "jumps": []}, {"id": "P10215", "text": ["provide a path for the output to return to the input.", "The purpose of the feedback line is _______", "The purpose of the feedback line is to _______"], "jumps": []}, {"id": "P10216", "text": ["tie the output of a gate to one of its inputs or an input of another gate.", "tie the output of one gate to the output of another."], "jumps": []}, {"id": "P10217", "text": ["Both latches and flip-flops have two outputs, designated as _______"], "jumps": []}, {"id": "P10218", "text": [], "jumps": []}, {"id": "P10219", "text": ["When a latch has its Q output HIGH and its Q output LOW, the latch is considered _______"], "jumps": []}, {"id": "P10220", "text": ["When a latch has its Q output LOW and its Q output HIGH, the latch is considered _______"], "jumps": []}, {"id": "P10221", "text": ["Which is NOT a term used to describe a latch that has both its outputs the same?"], "jumps": []}, {"id": "P10222", "text": ["When the output condition of a latch or flip-flop has Q LOW and Q HIGH, the device output is considered _______ O"], "jumps": []}, {"id": "P10223", "text": ["In the RS latch (NOR), when two LOWs are applied to the inputs the latch is in a _______condition. ;", "In the RS latch (NOR), when two LOWs are applied to the inputs the latch is in a/an _______condition."], "jumps": []}, {"id": "P10224", "text": ["Latches are made by cross-coupling two gates, which are either _______ or _______ gates or their equivalents."], "jumps": []}, {"id": "P10225", "text": ["running feedback line from the outputs to all the inputs.", "tying together the outputs of two gates.", "using feedback lines to cross-couple two gates.", "running feedback lines from the outputs to all the inputs."], "jumps": []}, {"id": "P10226", "text": ["In the truth table below, from top to bottom, the missing quantities are _______"], "jumps": []}, {"id": "P10227", "text": ["Which truth table is correct for an active-LOW input RS latch? the missing quantities are _______"], "jumps": []}, {"id": "P10228", "text": ["Which truth table is correct for an active-HIGH input RS latch?"], "jumps": []}, {"id": "P10229", "text": ["What are the missing quantities for Q and Q. quantities for Q and Q. ____ g"], "jumps": []}, {"id": "P10230", "text": [], "jumps": []}, {"id": "P10231", "text": ["In an RS latch, which inputs will cause an INVALID output condition?for this RS latch??"], "jumps": []}, {"id": "P10232", "text": ["In an RS latch, which inputs will cause a RESET output condition?"], "jumps": []}, {"id": "P10233", "text": ["In an RS latch, which inputs will cause a SET output condition?"], "jumps": []}, {"id": "P10234", "text": ["two HIGH inputs are followed by two LOW inputs.", "R = 0, S = 1 is followed by R = 1, S = 0.", "R = 1, S = 0 is followed by R = 0, S = 1.", "two LOW inputs are followed by two HIGH inputs.", "In an RS latch, RACE condition can occur when _______", "In an RS latch, a RACE condition can occur when _______________"], "jumps": []}, {"id": "P10235", "text": ["two HIGH inputs are followed by two LOW inputs.", "R = 0, S = 1 is followed by R = 1, S = 0.", "R = 1, S = 0 is followed by R = 0, S = 1.", "two LOW inputs are followed by two HIGH inputs.", "In an RS latch, a RACE condition can occur when ______________", "In an RS latch, a RACE condition can occur when _______________"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to _________"], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "PINFO", "text": ["12-11-02 Converted from sty to tbk (this copy is to replace original 4401. frieda 12-16-02 Text and Branching completed. frieda 12-17-02 Graphics. frieda 12-18-02 Completed graphics without animation and ran lesson. frieda 12-20-02 ran and checked lesson. frieda 01-02-03 Animation P1040, animation P1060, animation P1120, animation P2230, added people to cars on P2180, animations on P2260 and 2290, inserted graphic of cars on p2940 and P2980. Jeff Hatcher"], "jumps": []}, {"id": "PQINFO", "text": ["Page # Test# Question# HelpPage # 10210 1 110 1030 10211 1 111 1060 10212 1 112 1030 10213 1 113 1060 10214 1 114 1030 10215 1 115 1100 10216 1 116 1100 10217 1 117 1190,1210 10218 1 118 1190,1210 10219 1 119 1230 10220 1 120 1230 10221 1 121 1230 10222 1 122 1230 10223 2 123 2020,2070 10224 2 124 2020 10225 2 125 2020 10226 2 126 2020,2070 10227 2 127 2380 10228 2 128 2020 10229 2 129 2380 10230 2 130 2020 10231 2 131 2120 10232 2 132 2020 10233 2 133 2020 10234 2 134 2200 10235 2 135 2440", "Page # Test# Question# HelpPage # 10210 1 110 1030 10211 1 111 1060 10212 1 112 1030 10213 1 113 1060 10214 1 114 1030 10215 1 115 1100 10216 1 116 1100 10217 1 117 1190,1210 10218 1 118 1190,1210 10219 1 119 1230 10220 1 120 1230 10221 1 121 1230 10222 1 122 1230 10223 2 123 2020,2070 10224 2 124 2020 10225 2 125 2020 10226 2 126 2020,2070 10227 2 127 2380 10228 2 128 2020 10229 2 129 2380 10230 2 130 2020 10231 2 131 2120 10232 2 132 2020 10233 2 133 2020 10234 2 134 2200 10235 2 135 2440 244 10245 10246 10247 10248 10249 137 30000 10238 3 138 30000 10239 3 139 30000 10240 10241 10242 10243 10244 10245 10246 10247 10248 10249"], "jumps": []}, {"id": "P1121", "text": ["Step 2: The output of the OR gate goes HIGH.tput goes HIGH. If we remove the input, the feedback line supplies the HIGH from the output, forcing the gate's output to remain HIGH even with the input removed. The gate \"remembers\" its previous state...", "When a HIGH is applied to the input.....", "...the output of the OR gate goes high...."], "jumps": ["P1122", "P1120"]}, {"id": "P2230", "text": ["RACE condition will occur if an INVALID input (S = 1 and R = 1) is changed instantly to the NO CHANGE (S = 0 and R = 0) condition.", "1 1 0 0 (INVALID)"], "jumps": ["P2200"]}, {"id": "P1060", "text": ["Sequential circuits also produce an output when an input is applied, but these circuits will retain the output after the input is removed. Basically, they \"remember\" their last input condition. Let's examine how this works..."], "jumps": ["P1070", "P1030"]}, {"id": "P1163", "text": ["Analog circuits may use feedback but will not maintain an output after the input is removed. ?????????digital; they use solid-state components, such as transistors, in their circuitry. Which circuit uses a feedback line to maintain an output after the input is removed?"], "jumps": []}]};
let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
