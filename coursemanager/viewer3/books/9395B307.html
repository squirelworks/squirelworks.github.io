<script>
const book = {"title": "9395B307", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: FREQUENCY SHIFT KEYING (FSK)fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe Frequency Shift Keying. w Describe the characteristics of FSK signals.", "w Describe a typical FSK demodulator circuit. w Describe the NE565 and NE567 PLL integrated circuits.........", "w Describe a typical FSK modulator circuit. w Describe the MC14066 analog switch and ICL8038 VCO integrated circuits."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you are taught another method of digital signal processing and the circuits that modulate and demodulate."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["The method is called Frequency Shift Keying, FSK for short."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["The name FSK is from how the method originally was produced, the keying (turning on and off) of a transmitter for the telegraph and teletype."], "jumps": ["P400", "P430"]}, {"id": "P430", "text": ["In fact, FSK was developed long before digital circuits existed."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["Telegraph and teletype signals consisted of \"MARKs\" and \"SPACEs\", which are similar to HIGHs and LOWs in digital circuits."], "jumps": ["P450", "P420"]}, {"id": "P450", "text": ["The MARKs and SPACEs were then used to frequency modulator (FM) with an analog carrier signal."], "jumps": ["P460", "P420"]}, {"id": "P460", "text": ["Then in the demodulator, the FM signal was changed back into MARKs and SPACEs."], "jumps": ["P470", "P420"]}, {"id": "P470", "text": ["Today, the concept of FSK is the same.", "Today, the concept of FSK is the same......................"], "jumps": ["P480", "P420"]}, {"id": "P480", "text": ["Except that MARKs and SPACEs are replaced with HIGHs and LOWs, and the vacuum tube discrete circuits are replaced with integrated digital circuits."], "jumps": ["P490", "P470"]}, {"id": "P490", "text": ["Even though FSK is an old method of signal processing, it is still widely used in the military, commercial news services, and computer MODEMS.  If it works, don't fix it!", "Even though FSK is an old method of signal processing, it is still widely used in the military, commercial news services, and computer MODEMS. If it works, don't fix it!"], "jumps": ["P495", "P470"]}, {"id": "P495", "text": ["Let's begin the lesson on FREQUENCY SHIFT KEYING (FSK)...................."], "jumps": ["P490"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1015", "text": ["Frequency Shift Keying is a signal processing technique that uses a digital signal to frequency modulate an analog carrier signal."], "jumps": ["P1020", "P1001"]}, {"id": "P1020", "text": ["The digital information signal can be any type."], "jumps": ["P1030", "P1015"]}, {"id": "P1030", "text": ["Straight digital, PCM, or DM signals can be used.  This includes any synchronization, start, or stop pulses.", "Straight digital, PCM, or DM signals can be used. This includes any synchronization, start, or stop pulses."], "jumps": ["P1040", "P1015"]}, {"id": "P1040", "text": ["No matter what type of digital information is used, the signals are either HIGH or LOW."], "jumps": ["P1050", "P1015"]}, {"id": "P1050", "text": ["Thus, the FM signal that is developed only has two frequency variations."], "jumps": ["P1060", "P1015"]}, {"id": "P1060", "text": ["One frequency change above the FM signal represents a HIGH and another frequency change below the FM signal represent a low."], "jumps": ["P1070", "P1015"]}, {"id": "P1070", "text": ["And note that the system is digital even though the carrier signal is analog."], "jumps": ["P1080", "P1015"]}, {"id": "P1080", "text": ["What method of signal processing is similar to FSK?", "What method of signal processing is similar to FSK?........"], "jumps": ["P1015"]}, {"id": "P1081", "text": [], "jumps": []}, {"id": "P1082", "text": ["AM is amplitude modulation.  An information signal changes the amplitude of a carrier signal.  FSK does not operate in this manner.", "AM is amplitude modulation. An information signal changes the amplitude of a carrier signal. FSK does not operate in this manner."], "jumps": []}, {"id": "P1083", "text": ["PCM is pulse code modulation.  A digital pulse train is developed from the information signal.  FSK does not operate in this manner.", "As stated, the FSK signal is a frequency modulated signal.", "PCM is pulse code modulation. A digital pulse train is developed from the information signal. FSK does not operate in this manner.", "As stated, the FSK signal is a frequency modulated signal.."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["And because the information signal is digital, the FSK signal contains only three frequencies."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["One frequency is the center frequency, or fc."], "jumps": ["P1120", "P1090"]}, {"id": "P1120", "text": ["It is generated when no information signal is used.  Not shown in the FSK signal.", "It is generated when no information signal is used. Not shown in the FSK signal."], "jumps": ["P1130", "P1090"]}, {"id": "P1130", "text": ["The second frequency, fmax, is above fc."], "jumps": ["P1140", "P1090"]}, {"id": "P1140", "text": ["It is normally generated when the information signal is a \"1\" or a HIGH level."], "jumps": ["P1150", "P1090"]}, {"id": "P1150", "text": ["Note that a \"0\" or LOW information signal could produce the higher frequency, it depends on the system."], "jumps": ["P1160", "P1090"]}, {"id": "P1160", "text": ["The third signal, fmin, is below fc."], "jumps": ["P1170", "P1090"]}, {"id": "P1170", "text": ["It is normally generated when the information signal is \"0\" or a LOW level."], "jumps": ["P1180", "P1090"]}, {"id": "P1180", "text": ["Note that a \"1\" or HIGH information signal could produce the lower frequency, it depends on the system."], "jumps": ["P1190", "P1090"]}, {"id": "P1190", "text": ["What type of information signal produces fc in a FSK system?"], "jumps": ["P1090"]}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1192", "text": ["An information signal frequency modulates the carrier signal.   Normally, the HIGH information signal increases fc.", "An information signal frequency modulates the carrier signal. Normally, the HIGH information signal increases fc."], "jumps": []}, {"id": "P1193", "text": ["An information signal frequency modulates the carrier signal.  Normally, the LOW information signal decreases fc.", "An information signal frequency modulates the carrier signal. Normally, the LOW information signal decreases fc."], "jumps": []}, {"id": "P1200", "text": ["Although FSK is similar to FM, it does have one difference."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["Recall that FM changes the carrier signal FREQUENCY in accordance with the AMPLITUDE of the information signal."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["The greater the amplitude level, the greater the frequency change.  There is an infinite number of different amplitude and frequency changes.", "The greater the amplitude level, the greater the frequency change. There is an infinite number of different amplitude and frequency changes."], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["FSK does make frequency changes for amplitude changes but for only two amplitudes.", "FSK does make frequency changes for amplitude changes but for only two amplitudes..", "fc- fc+ fc- fc+ fc- fc- fc- fc+++"], "jumps": ["P1240", "P1200"]}, {"id": "P1240", "text": ["Amplitude variations of a HIGH pulse and amplitude variations of a LOW pulse do not effect the amount of frequency change."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["Therefore, the amount of frequency variation produced by a HIGH or LOW level is not dependent on the actual level.  Only if the signal is HIGH or LOW.", "Therefore, the amount of frequency variation produced by a HIGH or LOW level is not dependent on the actual level. Only if the signal is HIGH or LOW."], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["In other words noise, amplitude variations, does not effect a FSK system unless the noise changes a LOW to a HIGH or a HIGH to a LOW."], "jumps": ["P1270", "P1230"]}, {"id": "P1270", "text": ["Last, let's talk about the characteristics of FSK systems.", "Last, let's talk about the characteristics of FSK systems.."], "jumps": ["P1280", "P1230"]}, {"id": "P1280", "text": ["Since FSK signals are FM signals with only two frequency shifts, the characteristics are a lot less complex than for analog FM signals."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["Let's start off with the frequency of the carrier signal."], "jumps": ["P1300", "P1270"]}, {"id": "P1300", "text": ["The carrier frequency must be higher than the information signal frequency for FSK to operate correctly."], "jumps": ["P1310", "P1270"]}, {"id": "P1310", "text": ["If it was not, the information signal could change from HIGH to LOW or LOW to HIGH during the time of one carrier cycle."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["This would cause an incorrect frequency shift of the FSK signal."], "jumps": ["P1330", "P1300"]}, {"id": "P1330", "text": ["The information would be lost!"], "jumps": ["P1340", "P1300"]}, {"id": "P1340", "text": ["As a general rule, the carrier frequency must be at least five times the highest information or modulating signal frequency."], "jumps": ["P1350", "P1300"]}, {"id": "P1350", "text": ["This ensures that for each information bit, or data bit, there is around five cycles of the carrier signal frequency, either higher or lower than fc."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["The number of cycles for each data bit is important in the demodulator for determining if the signal is HIGH or LOW."], "jumps": ["P1370", "P1340"]}, {"id": "P1370", "text": ["Having less than around five cycles for each data bit, the demodulator would not be able to determine the frequency and could not recover the HIGH or LOW data bit."], "jumps": ["P1380", "P1340"]}, {"id": "P1380", "text": ["What is the minimum carrier frequency in a FSK system that uses information signal up to 10 kHz?"], "jumps": ["P1340", "P1385"]}, {"id": "P1381", "text": [], "jumps": []}, {"id": "P1382", "text": ["You divided the highest information signal frequency by 5.  You should have multiplied.", "You divided the highest information signal frequency by 5. You should have multiplied."], "jumps": []}, {"id": "P1383", "text": ["10 kHz is the highest information signal frequency, fc must be higher."], "jumps": []}, {"id": "P1385", "text": ["MINIMUM fc - The minimum carrier frequency in a FSK system must be at least 5 times the highest information signal frequency."], "jumps": []}, {"id": "P1390", "text": ["The second characteristic of FSK signals is Bandwidth.", "The second characteristic of FSK signals is Bandwidth......"], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["The bandwidth of a FSK system is always the highest frequency in the FSK signal."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["For example, if the bandwidth of a FSK system was set to fc, a modulated carrier signal would contain fmin for LOW information signals and fmax for HIGH information signals."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["Since fmax is a higher frequency than fc, the frequency shift for HIGH information would be lost if BW is set to fc."], "jumps": ["P1430", "P1400"]}, {"id": "P1430", "text": ["Also, if the bandwidth of the system was set to fmin (frequency shift for LOW information), the frequencies of fc and fmax (frequency shift of HIGH information) would be lost."], "jumps": ["P1440", "P1400"]}, {"id": "P1440", "text": ["If a FSK system has a carrier signal of 100 kHz and uses 1 kHz frequency changes, what is the bandwidth of the system?"], "jumps": ["P1400", "P1445"]}, {"id": "P1441", "text": [], "jumps": []}, {"id": "P1442", "text": ["99 kHz is the frequency that represents LOW information signals. Since the system uses two higher frequencies, the bandwidth cannot be set to fmin.", "99 kHz is the frequency that represents LOW information signals. Since the system uses two higher frequencies, the bandwidth cannot be set to fmin..."], "jumps": []}, {"id": "P1443", "text": ["100 kHz is the carrier frequency that represents no information transmitted. Since the system uses one higher frequency, the bandwidth cannot be set to fc."], "jumps": []}, {"id": "P1445", "text": ["BANDWIDTH - The bandwidth of a FSK system is the highest frequency in the FSK signal."], "jumps": []}, {"id": "P1450", "text": ["The last characteristic is noise.", "The last characteristic is noise..........................."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["As brought out, noise does not effect a FSK system.", "As brought out, noise does not effect a FSK system.........", "fc- fc+ fc- fc+ fc- fc- fc- fc+++"], "jumps": ["P1470", "P1450"]}, {"id": "P1470", "text": ["First, amplitude variations in the digital data does not effect the resultant frequency shifts in the FSK signal."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["Second, noise picked up in the transmission of the FSK signal can be eliminated by limiters in the demodulator, just like in FM demodulators."], "jumps": ["P1490", "P1460"]}, {"id": "P1490", "text": ["So, is a FSK signal completely free from noise? NO."], "jumps": ["P1500", "P1480"]}, {"id": "P1500", "text": ["The noise that may be in a FSK system is from circuits before and after the FSK modulator and demodulator."], "jumps": ["P1510", "P1480"]}, {"id": "P1510", "text": ["If a A/D and D/A converter is used, quantization noise is added, just like in a PCM system."], "jumps": ["P1520", "P1500"]}, {"id": "P1520", "text": ["Also, if a Delta Modulation system is used, noise is added."], "jumps": ["P1530", "P1500"]}, {"id": "P1530", "text": ["To sum up, noise in a FSK system is not due to the FSK system, but due to other systems that may be required for system operation."], "jumps": ["P1540", "P1500"]}, {"id": "P1540", "text": ["As you have seen, FSK is a simple version of FM that uses digital information signals."], "jumps": ["P1910", "P1500"]}, {"id": "P1910", "text": ["This completes the information on FSK SIGNALS.", "This completes the information on FSK SIGNALS.TITLE........"], "jumps": ["P1540"]}, {"id": "P1920", "text": ["1.  Frequency Shift Keying is a signal processing technique that        uses digital signals.", "1. Frequency Shift Keying is a signal processing technique that uses digital signals.."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  The FSK signal is a frequency modulated analog signal that           frequency changes indicate HIGHs and LOWs.", "3.  There are three frequencies in a FSK signal.\n      fmin - lower frequency to indicate LOWs (or HIGHs)\n      fc - center frequency to indicate no information signal\n      fmax - higher frequency to indicate HIGHs (or LOWs)", "2. The FSK signal is a frequency modulated analog signal that frequency changes indicate HIGHs and LOWs.", "3. There are three frequencies in a FSK signal. fmin - lower frequency to indicate LOWs (or HIGHs) fc - center frequency to indicate no information signal fmax - higher frequency to indicate HIGHs (or LOWs)))))))"], "jumps": ["P1940", "P1920", "P1950", "P1930"]}, {"id": "P1950", "text": ["4.  The carrier signal must be at least five times the highest                  information signal frequency or 5 times the modulating                    frequency.", "4. The carrier signal must be at least five times the highest information signal frequency or 5 times the modulating frequency."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  The bandwidth of a FSK system is the highest frequency in            the FSK signal, or fmax.", "5. The bandwidth of a FSK system is the highest frequency in the FSK signal, or fmax."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  Noise introduced into the FSK signal does not effect the                 system.", "6. Noise introduced into the FSK signal does not effect the system.", "fc- fc+ fc- fc+ fc- fc- fc- fc+++"], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7.  The only noise in a FSK system is the noise introduced by             other signal processing techniques.", "7. The only noise in a FSK system is the noise introduced by other signal processing techniques."], "jumps": ["P1999", "P1970"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1980"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2015", "text": ["FSK modulators normally use integrated circuits.", "FSK modulators normally use integrated circuits............"], "jumps": ["P2020", "P2001"]}, {"id": "P2020", "text": ["However, FSK has been around a long time and you will find FSK circuits that use vacuum tubes and discrete transistor circuits."], "jumps": ["P2030", "P2015"]}, {"id": "P2030", "text": ["No matter the type of FSK modulator circuit used, they all operate the same."], "jumps": ["P2040", "P2015"]}, {"id": "P2040", "text": ["A FSK modulator has two basic circuits.", "A FSK modulator has two basic circuits....................."], "jumps": ["P2050", "P2015"]}, {"id": "P2050", "text": ["The switching circuit is used to produce three separate voltages from the digital information signal."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["The voltages represent HIGH, LOW and no information inputs to the modulators."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["The output of the switching circuit is then applied to a FM modulator circuit."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["Many types of switching circuits can be used.  A typical switching circuit used in newer FSK systems is in integrated circuit form.", "Many types of switching circuits can be used. A typical switching circuit used in newer FSK systems is in integrated circuit form."], "jumps": ["P2090", "P2040"]}, {"id": "P2090", "text": ["The switch has three connections, IN, OUT, and CONTROL."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["With the CONTROL input LOW, the switch is OPEN."], "jumps": ["P2110", "P2080"]}, {"id": "P2110", "text": ["With the CONTROL input HIGH, the switch is CLOSED."], "jumps": ["P2120", "P2080"]}, {"id": "P2120", "text": ["One example of an integrated circuit switch is the MC14066 quad analog transmission gate."], "jumps": ["P2130", "P2080"]}, {"id": "P2130", "text": ["It has four separate switches along with the power and ground connections."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["You will see how the switches are used to produce the three voltages in the FSK circuit operation lesson."], "jumps": ["P2150", "P2120"]}, {"id": "P2150", "text": ["What is the output of the FSK modulator's switching circuit?"], "jumps": ["P2120"]}, {"id": "P2151", "text": [], "jumps": []}, {"id": "P2152", "text": ["fmin, fc, and fmax are the FM signals that the entire modulator produces.  They are not the output of the switching circuit.", "fmin, fc, and fmax are the FM signals that the entire modulator produces. They are not the output of the switching circuit."], "jumps": []}, {"id": "P2153", "text": ["Digital signals are the input to the FSK modulator.  They are not the output of the switching circuit.", "Digital signals are the input to the FSK modulator. They are not the output of the switching circuit."], "jumps": []}, {"id": "P2160", "text": ["The FM modulator circuit receives the three signals from the switching circuit and generates the FSK signal."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["The FM modulator produces fmin for LOW information, fc for no information, and fmax for HIGH information."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["Any type of FM modulator will work, reactance -- varactor, VCO, etc."], "jumps": ["P2190", "P2160"]}, {"id": "P2190", "text": ["In newer FSK modulators, integrated circuit VCOs ( Voltage Controlled Oscillators ) are normally used."], "jumps": ["P2200", "P2160", "P2195"]}, {"id": "P2192", "text": ["VCOs ( Voltage Controlled Osciare normally used.", "In newer FSK modulators, integrated circuit VCOs ( Voltage Controlled Oscillators ) are normally used."], "jumps": ["P2200", "P2160", "P2195"]}, {"id": "P2195", "text": ["VCO CIRCUITS - A varactor diode parallel to the oscillator's tank circuit. As the reverse bias voltage changes across the diode, the diode's capacitance changes which changes the oscillator's frequency.It exhibits capacitance when reversed biased and the amount of capacitance depends on the amount of reverse bias.s on the amount of reverse bias....capacitance depends on the amount of reverse bias.se bias."], "jumps": []}, {"id": "P2200", "text": ["An example of an IC VCO is the ICL8038.  It is similar to the NE566 VCO you studied in the FM lessons.", "An example of an IC VCO is the ICL8038. It is similar to the NE566 VCO you studied in the FM lessons."], "jumps": ["P2210", "P2160"]}, {"id": "P2210", "text": ["The advantage to the ICL8038 over the NE566 is that it is more controllable."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["Pins 6 and 11 allow for dual power sources. Pin 11 is grounded when one power source is used."], "jumps": ["P2230", "P2200"]}, {"id": "P2230", "text": ["The input to the VCO is applied to pin 8 and is limited to signals between 0.001 and 300 kHz."], "jumps": ["P2235", "P2200"]}, {"id": "P2235", "text": ["The input frequency is limited due to the maximum output frequency of the ICL8038 VCO."], "jumps": ["P2240", "P2200"]}, {"id": "P2240", "text": ["Since 300 kHz is the limit, what is the approximate maximum carrier frequency of the VCO used in FSK systems?"], "jumps": ["P2200", "P2245"]}, {"id": "P2241", "text": [], "jumps": []}, {"id": "P2242", "text": ["300 kHz is the maximum information signal frequency that can be applied to the input of the VCO.  In FSK systems, the carrier signal is always higher.", "300 kHz is the maximum information signal frequency that can be applied to the input of the VCO. In FSK systems, the carrier signal is always higher."], "jumps": []}, {"id": "P2243", "text": ["60 kHz is 300 kHz divided by 5.  In FSK systems, the carrier signal is normally five times greater than the highest modulating frequency.", "60 kHz is 300 kHz divided by 5. In FSK systems, the carrier signal is normally five times greater than the highest modulating frequency."], "jumps": []}, {"id": "P2245", "text": ["CARRIER SIGNAL - In FSK systems, the carrier frequency is normally five times the highest information signal."], "jumps": []}, {"id": "P2250", "text": ["The output of the VCO is on pins 2, 3, or 9. There are three available outputs of sine, square, and triangle waveforms."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["The center frequency of the chip is determined by the value of a capacitor connected to pin 10."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["Pins 4 and 5, when used, connect to resistors that control the duty cycle of the output signal.", "Pins 4 and 5, when used, connect to resistors that control the duty cycle of the output signal.."], "jumps": ["P2280", "P2250", "P2272", "P2275"]}, {"id": "P2272", "text": ["Pins 4 and 5, when used, connect to resistors that control the duty cycle of the output signal.", "Pins 4 and 5, when used, connect to resistors that control the duty cycle of the output signal.."], "jumps": ["P2275", "P2280", "P2250"]}, {"id": "P2275", "text": ["DUTY CYCLE - The duty cycle of a waveform is the ratio of the ON/OFF, POSITIVE/NEGATIVE, or INCREASE/DECREASE times."], "jumps": []}, {"id": "P2280", "text": ["Last, pins 1 and 12 connect to components that control the symmetry of the sine wave output."], "jumps": ["P2290", "P2250"]}, {"id": "P2290", "text": ["You will see how the external circuits are connected to the VCO in the FSK circuit operation lesson."], "jumps": ["P2300", "P2250"]}, {"id": "P2300", "text": ["What is the output of a FSK modulator's FM circuit?", "What is the output of a FSK modulator's FM circuit?........"], "jumps": ["P2250"]}, {"id": "P2301", "text": [], "jumps": []}, {"id": "P2302", "text": ["Digital signals are the input to the FSK modulator.  They are not the output of the FM circuit.", "Digital signals are the input to the FSK modulator. They are not the output of the FM circuit."], "jumps": []}, {"id": "P2303", "text": ["A voltage level is used to control the FM frequency and is the output of the switching circuit."], "jumps": []}, {"id": "P2310", "text": ["Which pin/pins on the ICL8038 VCO sets up fc?", "Which pin/pins on the ICL8038 VCO sets up fc?.............."], "jumps": ["P2300"]}, {"id": "P2311", "text": [], "jumps": []}, {"id": "P2312", "text": ["Pins 4 and 5, when used, control the duty cycle of the output signals."], "jumps": []}, {"id": "P2313", "text": ["Pin 12, along with pin 1, is used to control the symmetry of the sine wave output signal."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on FSK MODULATOR CIRCUITS.", "This completes the information on FSK MODULATOR CIRCUITS..."], "jumps": ["P2310"]}, {"id": "P2920", "text": ["1.  FSK modulators contain two major circuits.", "1. FSK modulators contain two major circuits.line here...."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2.  The switching circuit changes the digital information signal            into three voltages, one for a HIGH and LOW and one that               represents no information input.", "2. The switching circuit changes the digital information signal into three voltages, one for a HIGH and LOW and one that represents no information input."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3.  The FM modulator receives the three voltage levels and                   outputs one of three frequencies, fmin, fc, and fmax.", "3. The FM modulator receives the three voltage levels and outputs one of three frequencies, fmin, fc, and fmax."], "jumps": ["P2950", "P2920"]}, {"id": "P2950", "text": ["4.  The switch circuit may use a MC14066 quad analog                          transmission gate.", "4. The switch circuit may use a MC14066 quad analog transmission gate."], "jumps": ["P2960", "P2920"]}, {"id": "P2960", "text": ["5.  The FM modulator may use a ICL8038 VCO.", "5. The FM modulator may use a ICL8038 VCO................."], "jumps": ["P2999", "P2950"]}, {"id": "P2999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2960"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3015", "text": ["FSK demodulators normally use integrated circuits.", "FSK demodulators normally use integrated circuits.........."], "jumps": ["P3020", "P3001"]}, {"id": "P3020", "text": ["And, as in FSK modulators, FSK demodulators can be found constructed from vacuum tube circuits and discrete transistor circuits."], "jumps": ["P3030", "P3015"]}, {"id": "P3030", "text": ["However, they all operate the same."], "jumps": ["P3015"]}, {"id": "P3040", "text": ["A FSK demodulator has two basic circuits.", "A FSK demodulator has two basic circuits..................."], "jumps": ["P3015"]}, {"id": "P3050", "text": ["The FM demodulator circuit is used to change the FSK signal to HIGHs and LOWs associated with fmin and fmax."], "jumps": ["P3040"]}, {"id": "P3060", "text": ["Many types of FM demodulators can be used such as the slope, discriminator, ratio, phase lock loop (PLL), etc."], "jumps": ["P3040", "PLL"]}, {"id": "P3070", "text": ["In newer FSK demodulators, integrated circuit PLLs are normally used.", "In newer FSK demodulators, integrated circuit PLLs are normally used..."], "jumps": ["P3080", "P3040", "P3072", "P3075"]}, {"id": "P3072", "text": ["In newer FSK demodulators, integrated circuit PLLs are normally used.", "In newer FSK demodulators, integrated circuit PLLs are normally used..."], "jumps": ["P3080", "P3040", "P3075"]}, {"id": "P3075", "text": ["PHASE LOCK LOOP (PLL) CIRCUITS - PLL circuits use a phase comparator that compares the FM input signal to the output of a VCO. Any difference in the two signals is sent out of an amplitude level (demodulated FM signal) and used to control the frequency of the VCO."], "jumps": ["PLL"]}, {"id": "P3080", "text": ["An example of an IC PLL is the NE565.  Yes, it is the same one used in the FM lessons.", "An example of an IC PLL is the NE565. Yes, it is the same one used in the FM lessons."], "jumps": ["P3040"]}, {"id": "P3090", "text": ["Pins 4 and 5 are connected as in any FM demodulator."], "jumps": ["P3080"]}, {"id": "P3100", "text": ["But, that's where the similarities end.  The chip is configured differently in FSK circuits than in FM circuits.", "But, that's where the similarities end. The chip is configured differently in FSK circuits than in FM circuits."], "jumps": ["P3080"]}, {"id": "P3110", "text": ["First, both inputs are used, pins 2 and 3."], "jumps": ["P3080"]}, {"id": "P3120", "text": ["Second, both outputs are used, pins 6 and 7."], "jumps": ["P3080"]}, {"id": "P3130", "text": ["Also, the FSK demodulator has filters added to the outputs to ensure that the output is HIGH or LOW only."], "jumps": ["P3080"]}, {"id": "P3140", "text": ["You will see how the external circuits are connected to the PLL in the FSK circuit operating lesson."], "jumps": ["P3150", "P3080"]}, {"id": "P3150", "text": ["What is the output of the FSK demodulator's FM circuit?", "What is the output of the FSK demodulator's FM circuit?...."], "jumps": ["P3080"]}, {"id": "P3151", "text": [], "jumps": []}, {"id": "P3152", "text": ["fmin, fc, and fmax are the inputs to the FSK demodulator.  They are not the output of the FM demodulator circuit.", "fmin, fc, and fmax are the inputs to the FSK demodulator. They are not the output of the FM demodulator circuit."], "jumps": []}, {"id": "P3153", "text": ["An output of one of three voltage levels is used in the FSK modulator to produce fmin, fc, and fmax."], "jumps": []}, {"id": "P3160", "text": ["What is the primary difference between using the NE565 in FM systems or FSK systems?"], "jumps": ["P3150"]}, {"id": "P3161", "text": [], "jumps": []}, {"id": "P3162", "text": ["The R and C inputs must be used whenever the NE565 PLL circuit is used.  It sets up the center frequency of the chip.", "The R and C inputs must be used whenever the NE565 PLL circuit is used. It sets up the center frequency of the chip."], "jumps": []}, {"id": "P3163", "text": ["Pins 4 and 5 must be connected whenever the NE565 PLL circuit is used.  They connect the output of the VCO to the input of the comparator.", "Pins 4 and 5 must be connected whenever the NE565 PLL circuit is used. They connect the output of the VCO to the input of the comparator."], "jumps": []}, {"id": "P3170", "text": ["The fc detector circuit is used to recognize the presence of the carrier signal."], "jumps": ["P3180", "P3160"]}, {"id": "P3180", "text": ["This is very important in FSK demodulators."], "jumps": ["P3190", "P3170"]}, {"id": "P3190", "text": ["Recall that when no information signal is sent, the FSK modulator sends the carrier signal, fc."], "jumps": ["P3200", "P3170"]}, {"id": "P3200", "text": ["When the fc signal is received in the FSK receiver, the signal is demodulated in the FM demodulator circuit."], "jumps": ["P3210", "P3170"]}, {"id": "P3210", "text": ["However, the FM demodulator is designed to demodulate fmin to a LOW and fmax to a HIGH."], "jumps": ["P3220", "P3170"]}, {"id": "P3220", "text": ["fc is demodulated into something, but what?  A HIGH or a LOW or something in between?", "fc is demodulated into something, but what? A HIGH or a LOW or something in between?"], "jumps": ["P3230", "P3170"]}, {"id": "P3230", "text": ["Whatever the case, it will be incorrect.  The output of the demodulator should not be a digital pulse when no information signal is sent.", "Whatever the case, it will be incorrect. The output of the demodulator should not be a digital pulse when no information signal is sent."], "jumps": ["P3240", "P3170"]}, {"id": "P3240", "text": ["Using the fc detector circuit, you can tell if the carrier signal was transmitted or not."], "jumps": ["P3250", "P3170"]}, {"id": "P3250", "text": ["If fc was not transmitted, the output of the fc detector circuit is HIGH (or, depending on chip, a LOW)."], "jumps": ["P3260", "P3240"]}, {"id": "P3260", "text": ["The HIGH is used to enable the output of the FM demodulator or is used in an indicator (turning the indicator off or on indicating fc was not received)."], "jumps": ["P3270", "P3240"]}, {"id": "P3270", "text": ["If fc was transmitted, the output of the fc detector circuit is LOW (or, depending on chip, a HIGH)."], "jumps": ["P3280", "P3240"]}, {"id": "P3280", "text": ["The LOW can be used to disable the output of the FM demodulator or used in an indicator (turning the indicator on or off indicating fc was received)."], "jumps": ["P3290", "P3240"]}, {"id": "P3290", "text": ["The fc detector circuit is used to indicate that the demodulated output is either information or no information."], "jumps": ["P3300", "P3240"]}, {"id": "P3300", "text": ["Again, a PLL circuit works great for this type of circuit.", "Again, a PLL circuit works great for this type of circuit.."], "jumps": ["P3310", "P3240"]}, {"id": "P3310", "text": ["In this case, a less complex PLL circuit is used, a NE567 tone decoder IC (VCO remains at a constant frequency)."], "jumps": ["P3320", "P3300", "P3312", "P3315"]}, {"id": "P3312", "text": ["In this case, a less complex PLL circuit is used, a NE567 tone decoder IC (VCO remains at a constant frequency)."], "jumps": ["P3320", "P3300", "P3315"]}, {"id": "P3315", "text": ["TONE DECODER PLL - The tone decoder uses a set VCO frequency and only outputs a HIGH or LOW, depending on if the input frequency is equal to the VCO frequency or not."], "jumps": []}, {"id": "P3320", "text": ["Power is applied to pin 4 and the chip's ground is on pin 7."], "jumps": ["P3330", "P3300"]}, {"id": "P3330", "text": ["The components connected to pins 5 and 6 determine the chip's center frequency or VCO frequency, which is set to fc."], "jumps": ["P3340", "P3300"]}, {"id": "P3340", "text": ["The FM signal input is applied to pin 3 and a HIGH or LOW output is taken from pin 8."], "jumps": ["P3350", "P3300"]}, {"id": "P3350", "text": ["When the FM signal input is the same as the chip's center frequency, a LOW is generated on pin 8 in this chip."], "jumps": ["P3360", "P3300"]}, {"id": "P3360", "text": ["In other words there is no difference between the internal VCO frequency and the FM signal input indicating fc was transmitted, no information."], "jumps": ["P3370", "P3350", "P3362", "P3365"]}, {"id": "P3362", "text": ["In other words there is no difference between the internal VCO frequency and the FM signal input indicating fc was transmitted, no information."], "jumps": ["P3370", "P3350", "P3365"]}, {"id": "P3365", "text": ["PLL CIRCUIT - When the VCO frequency equals the input frequency, the output of the phase comparator is 0. The 0 is sent out from the PLL circuit as a LOW."], "jumps": []}, {"id": "P3370", "text": ["When the FM signal input is not the same as the chip's center frequency, a HIGH is generated on pin 8 in this chip."], "jumps": ["P3380", "P3350"]}, {"id": "P3380", "text": ["In other words there is a difference between the internal VCO frequency and the FM signal input indicating that fmin or fmax was transmitted."], "jumps": ["P3390", "P3350", "P3382", "P3385"]}, {"id": "P3382", "text": ["In other words there is a difference between the internal VCO frequency and the FM signal input indicating that fmin or fmax was transmitted."], "jumps": ["P3390", "P3350", "P3385"]}, {"id": "P3385", "text": ["PLL CIRCUIT - When the VCO frequency does not equal the input frequency, the output of the phase comparator is a DC signal. In this simplified PLL circuit, the DC signal is only positive (no distinction between frequencies < or > than the VCO frequency) and the output signal does not changed the VCO frequency.cy.uency."], "jumps": []}, {"id": "P3390", "text": ["Last, pins 1 and 2 are used for filters."], "jumps": ["P3400", "P3350"]}, {"id": "P3400", "text": ["You will see how the external circuits are connected to the fc detector in the FSK circuit operating lesson."], "jumps": ["P3410", "P3350"]}, {"id": "P3410", "text": ["What type of circuit must be used in a FSK demodulator because fmin, fc, and fmax are changed into digital pulses?"], "jumps": ["P3350"]}, {"id": "P3411", "text": [], "jumps": []}, {"id": "P3412", "text": ["The FM demodulator circuit in FSK systems can not distinguish between the frequencies in the FSK signal.  Whatever the frequency input to the FM demodulator, it will be demodulated.", "The FM demodulator circuit in FSK systems can not distinguish between the frequencies in the FSK signal. Whatever the frequency input to the FM demodulator, it will be demodulated."], "jumps": []}, {"id": "P3413", "text": ["The VCO is primarily used in the FSK modulator circuit and in PLL  circuits.  It cannot distinguish between the frequencies in the FSK signal.", "The VCO is primarily used in the FSK modulator circuit and in PLL circuits. It cannot distinguish between the frequencies in the FSK signal."], "jumps": []}, {"id": "P3420", "text": ["In the NE567 PLL circuit, a LOW output indicates which frequency in a FSK system?"], "jumps": ["P3410"]}, {"id": "P3421", "text": [], "jumps": []}, {"id": "P3422", "text": ["The NE567 circuit is set up for a center frequency of fc.  When fmin is inputted, the output is not LOW, there is a difference in the signals.", "The NE567 circuit is set up for a center frequency of fc. When fmin is inputted, the output is not LOW, there is a difference in the signals."], "jumps": []}, {"id": "P3423", "text": ["The NE567 circuit is set up for a center frequency of fc.  When fmax is inputted, the output is not LOW, there is a difference in the signals.", "The NE567 circuit is set up for a center frequency of fc. When fmax is inputted, the output is not LOW, there is a difference in the signals.."], "jumps": []}, {"id": "P3910", "text": ["This completes the information on FSK DEMODULATOR CIRCUITS.", "This completes the information on FSK DEMODULATOR CIRCUITS..."], "jumps": ["P3420"]}, {"id": "P3920", "text": ["1.  FSK demodulators contain two major circuits.", "1. FSK demodulators contain two major circuits.ne here...."], "jumps": ["P3930", "P3001"]}, {"id": "P3930", "text": ["2.  The FM demodulator changes the frequency shifted signals           into HIGHs and LOWs.", "2. The FM demodulator changes the frequency shifted signals into HIGHs and LOWs."], "jumps": ["P3940", "P3920"]}, {"id": "P3940", "text": ["3.  The fc detector circuit recognizes if the input is the carrier              signal.", "3. The fc detector circuit recognizes if the input is the carrier signal."], "jumps": ["P3950", "P3920"]}, {"id": "P3950", "text": ["4.  The output of the fc detector is used to indicate that the                   output of the FM modulator is information of no information.", "4. The output of the fc detector is used to indicate that the output of the FM modulator is information of no information."], "jumps": ["P3960", "P3920"]}, {"id": "P3960", "text": ["5.  The FM demodulator may use a NE565 PLL FM demodulator          chip.", "5. The FM demodulator may use a NE565 PLL FM demodulator chip."], "jumps": ["P3970", "P3920"]}, {"id": "P3970", "text": ["6.  The fc detector may use a NE567 tone decoder chip set to fc.", "6. The fc detector may use a NE567 tone decoder chip set to fc."], "jumps": ["P3999", "P3960"]}, {"id": "P3999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P3970"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": [], "jumps": []}, {"id": "P10211", "text": ["Amplitude modulating a digital signal with an analog signal", "Frequency modulating a digital signal with an analog signal", "Frequency modulating an analog signal with a digital signal", "Amplitude modulating an analog signal with a digital signal"], "jumps": []}, {"id": "P10212", "text": ["HIGH and LOW levels in the information signal", "Frequency changes in the information signal", "Amplitude levels in the information signal"], "jumps": []}, {"id": "P10213", "text": ["How many frequencies are used in a FSK signal?"], "jumps": []}, {"id": "P10214", "text": ["If the information signal is not present, what is the frequency of the FSK signal?"], "jumps": []}, {"id": "P10215", "text": ["If the information signal is HIGH, what is the normal frequency of the FSK signal?"], "jumps": []}, {"id": "P10216", "text": ["If the information signal is LOW, what is the normal frequency of the FSK signal?"], "jumps": []}, {"id": "P10217", "text": ["What type of noise does a FSK system produce by itself?"], "jumps": []}, {"id": "P10218", "text": ["What is the minimum carrier frequency required in a FSK system using information signals ranging from 1 kHz to 6 kHz?"], "jumps": []}, {"id": "P10219", "text": ["What is the bandwidth of a FSK system that has a fc of 10 kHz and uses"], "jumps": []}, {"id": "P10220", "text": ["What type of circuits do typical FSK modulators consist of?"], "jumps": []}, {"id": "P10221", "text": ["What type of information inputs are required in a FSK modulator circuit?"], "jumps": []}, {"id": "P10222", "text": ["What are the outputs of the FSK modulator circuit?"], "jumps": []}, {"id": "P10223", "text": ["What is the purpose of the switching circuit in a FSK modulator? ?", "Change digital input into three voltage levels !", "Change analog input into three voltage levels"], "jumps": []}, {"id": "P10224", "text": ["What is the purpose of the FM modulator in a FSK modulator?", "Change digital input into three voltage levels", "Change analog input into three voltage levels"], "jumps": []}, {"id": "P10225", "text": ["If the CONTROL input to an IC switch is HIGH, what is the condition of the switch?"], "jumps": []}, {"id": "P10226", "text": ["Which pins would be used to configure switch c in the MC14066 quad analog transmission gate IC?"], "jumps": []}, {"id": "P10227", "text": ["In a typical FSK modulator, what type of FM modulator does the switching circuit drive?"], "jumps": []}, {"id": "P10228", "text": ["Normally, what is the output of the FSK modulator if the input is HIGH?"], "jumps": []}, {"id": "P10229", "text": ["Normally, what is the output of the FSK modulator if an input is not applied?"], "jumps": []}, {"id": "P10230", "text": ["What type of circuits do typical FSK demodulators consist of?"], "jumps": []}, {"id": "P10231", "text": ["What is the input to a FSK demodulator circuit?"], "jumps": []}, {"id": "P10232", "text": ["What is the output of a FSK demodulator circuit?"], "jumps": []}, {"id": "P10233", "text": ["What is the purpose of the fc Detector circuit in a FSK demodulator?", "To indicate or turn OFF the demodulator when fmin or fmax is received.", "To indicate or turn OFF the demodulator when fc is received. Y", "To demodulate the FM signal into fmin, fc, or fmax.", "To demodulate the FM signal into HIGHs and LOWs."], "jumps": []}, {"id": "P10234", "text": ["Normally, what is the output of the FSK demodulator when the input signal is fc? 9"], "jumps": []}, {"id": "P10235", "text": ["Normally, what is the output of the FSK demodulator when the input signal is fmax?"], "jumps": []}, {"id": "P10236", "text": ["How is the fc Detector PLL circuit different from the FM Demodulator PLL circuit?", "The output of the VCO is not connected to the comparator"], "jumps": []}, {"id": "P10237", "text": ["In a typical FSK demodulator, what is the circuit action when fc is received?", "fc is demodulated and used as an output signal", "fc is demodulated but not used as an output signal"], "jumps": []}, {"id": "P10238", "text": ["What is the output of the NE567 fc Detector circuit if fmin is received in the FSK demodulator?", "HIGH, indicating that the demodulator output is HIGH.", "LOW, indicating that the demodulator output is LOW.", "HIGH, indicating fc has not been received. i", "LOW, indicating fc has not been received."], "jumps": []}, {"id": "P10239", "text": ["In a FSK demodulator, why is the output of the FM demodulator circuit filtered?"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is 100%. Do you want to _________"], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 11-29-99 Converted from storyboard to toolbook. frieda 12-23-99 Text and branching. debbie 02-17-00 Graphics. doan 03-15-00 Lesson Checklist by Chris 07-14-00 Converted to ToolBook 7.1 format. jay 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-07-02 Checked for convertion errors. John Ayala 03-25-02 Changed script on quiz menu buttons so that experiment questions can be disregarded. -Penny 05-02-02 Review - lisa"], "jumps": []}]};

  if (page.jumps.length) {

      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
</body>
