const book = {"title": "9395B403", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: TDM CIRCUIT TROUBLESHOOTING fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Determine if a TDM transmitter and receiver system is operating correctly. w Identify the faulted component in a malfunctioning TDM transmitter and receiver system."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 440 Function Generator XXXXXnt"], "jumps": []}, {"id": "P301", "text": [], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will troubleshoot faults in a TDM transmitter and receiver system."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["The same process that is used to troubleshoot modulating signal processing systems is used to troubleshoot multiplexing signal processing systems."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["In fact, all transmitter and receiver systems use the same method."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["You find out if the receiver's output signal is correct.  If not, you locate the fault to the transmitter or receiver.", "You find out if the receiver's output signal is correct. If not, you locate the fault to the transmitter or receiver."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Then, you do detailed fault isolation."], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["Let's begin the lesson on TDM CIRCUIT TROUBLESHOOTING....................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1020", "text": ["In this experiment, you will locate the failed chip or component in a TDM transmitter and receiver system."], "jumps": ["P1040", "P1001"]}, {"id": "P1040", "text": ["The transmitter is located on the PC130-305 card.", "The transmitter is located on the PC130-305 card..........."], "jumps": ["P1050", "P1020", "P1045"]}, {"id": "P1050", "text": ["The transmitter consists of the components necessary to time multiplex information signals."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["The receiver is located on the PC130-306 card.", "The receiver is located on the PC130-306 card.............."], "jumps": ["P1070", "P1040", "P1065"]}, {"id": "P1070", "text": ["The receiver consists of the components necessary to demultiplex TDM signals."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["To locate a faulted chip or support component, you must first determine if the TDM system is operating correctly."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["To do this, you check each input signal to the transmitter against each output signal of the receiver."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["If one or more of the output signals are incorrect, then the system is faulted."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["If the system is faulted, you determine if the transmitter or receiver is causing the problem."], "jumps": ["P1120", "P1080"]}, {"id": "P1120", "text": ["If the output of the transmitter is bad, the multiplexer circuits are faulted."], "jumps": ["P1130", "P1080"]}, {"id": "P1130", "text": ["If the output of the transmitter is good, the fault is in the transmission medium or receiver."], "jumps": ["P1140", "P1080"]}, {"id": "P1140", "text": ["If the input to the receiver is bad, the fault is in the transmission medium."], "jumps": ["P1150", "P1080"]}, {"id": "P1150", "text": ["If the input to the receiver is good, the demultiplexer circuits are faulted."], "jumps": ["P1160", "P1080"]}, {"id": "P1160", "text": ["Once the fault has been located, further oscilloscope or multimeter measurements will locate the fault to a particular chip or component.  Remember, use an analog multimeter to check out a transistor.  Let's start the experiment.", "Once the fault has been located, further oscilloscope or multimeter measurements will locate the fault to a particular chip or component. Remember, use an analog multimeter to check out a transistor. Let's start the experiment."], "jumps": ["P1170", "P1080"]}, {"id": "P1170", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P1160"]}, {"id": "P1180", "text": ["2.  Insert PC130-322 into the PC1 connectors on the test console. 3.  Insert PC130-305 into the PC2 connectors on the test console. 4.  Insert PC130-306 into the PC3 connectors on the test console.", "2. Insert PC130-322 into the PC1 connectors on the test console. 3. Insert PC130-305 into the PC2 connectors on the test console. 4. Insert PC130-306 into the PC3 connectors on the test console."], "jumps": ["P1170"]}, {"id": "P1190", "text": ["5.  On PC130-322, set the controls to mid position. \n6.  On PC130-305, set the controls to mid position. \n7.  On PC130-306, set the controls to mid position.", "5. On PC130-322, set the controls to mid position. 6. On PC130-305, set the controls to mid position. 7. On PC130-306, set the controls to mid position. ......"], "jumps": ["P1180", "P1200"]}, {"id": "P1200", "text": ["8.  Set the Positive Supply Control to 15.  The Voltmeter on the           130A should indicate 15 Volts.", "8. Set the Positive Supply Control to 15. The Voltmeter on the 130A should indicate 15 Volts."], "jumps": ["P1190"]}, {"id": "P1210", "text": ["9.  Set the Negative Supply Control to 15.  The Voltmeter on the          130A should indicate 15 Volts.", "9. Set the Negative Supply Control to 15. The Voltmeter on the 130A should indicate 15 Volts."], "jumps": ["P1200"]}, {"id": "P1220", "text": ["10.  Set the PC1 DC Switch to ON.", "11.  Using the oscilloscope, measure the 500, 1000, 1500 and                 2000 Hz TPs on PC130-322 and adjust each channel                         controls as follows: \n        a. Adjust DIST for a sine wave output at 2 Vpp.\n        b. Adjust GAIN for a 0.5 Vpp signal.", "10. Set the PC1 DC Switch to ON.trol to 12. 130A - Set the PC1 DC Switch to ON....", "11. Using the oscilloscope, measure the 500, 1000, 1500 and 2000 Hz TPs on PC130-322 and adjust each channel controls as follows: a. Adjust DIST for a sine wave output at 2 Vpp. b. Adjust GAIN for a 0.5 Vpp signal."], "jumps": ["P1210", "P1240", "P1220"]}, {"id": "P1240", "text": ["12.  Using an alligator to alligator jumper, connect the 2000 Hz TP         on PC130-322 to TP4 on PC130-305.", "13.  Using the oscilloscope, measure the signals on PC130-305             TP1, TP2, TP3 and TP4.  Ensure you have 0.5 Vpp signals on         TP1, TP2, TP3 and TP4 of PC130-305 before continuing.  The          information source card is set up.", "12. Using an alligator to alligator jumper, connect the 2000 Hz TP on PC130-322 to TP4 on PC130-305.", "MEASUREMENT SETUP - Using alligator to alligator jumper, connect the 2000 Hz TP on PC130-322 to TP4 on PC130-305.", "13. Using the oscilloscope, measure the signals on PC130-305 TP1, TP2, TP3 and TP4. Ensure you have 0.5 Vpp signals on TP1, TP2, TP3 and TP4 of PC130-305 before continuing. The information source card is set up."], "jumps": ["P1250", "P1230", "P1245", "P1260", "P1240"]}, {"id": "P1260", "text": ["1.  Set the PC2 DC Switch to ON.", "1. Set the PC2 DC Switch to ON.ntrol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P1250"]}, {"id": "P1270", "text": ["2.  Using the oscilloscope, measure and adjust the following for         a 3 Vpp signal on PC130-305:", "2. Using the oscilloscope, measure and adjust the following for a 3 Vpp signal on PC130-305::", "a. TP5, adjust R22 b. TP6, adjust R23 c. TP7, adjust R24 d. TP8, adjust R25", "MEASUREMENT SETUP - On PC130-305 measure and adjust the following: TP5 - adjust R22 TP7 - adjust R24 TP6 - adjust R23 TP8 - adjust R25"], "jumps": ["P1280", "P1260", "P1275"]}, {"id": "P1280", "text": ["3.  Using the internal frequency counter of the function generator      or a separate frequency counter if available (if not use an                oscilloscope) adjust R15 for a 200 kHz \u00b15 kHz signal on TP12        of PC130-305.", "3. Using the internal frequency counter of the function generator or a separate frequency counter if available (if not use an oscilloscope) adjust R15 for a 200 kHz", "5 kHz signal on TP12 of PC130-305.", "MEASUREMENT SETUP - On PC130-305 measure TP12 and adjust R15."], "jumps": ["P1290", "P1270", "P1285"]}, {"id": "P1290", "text": ["4.  Set the oscilloscope controls as follows:", "4. Set the oscilloscope controls as follows:..............", "a. Volt/Div - .1 (use a X10 probe) b. Time/Div - 5 ms c. Triggering - CH1, AC, Negative d. Coupling - DC"], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["5.  Place the AC/GND/DC switch to GND and position the CH1              trace in the center of the screen. \n6.  Place the AC/GND/DC switch to DC.", "5. Place the AC/GND/DC switch to GND and position the CH1 trace in the center of the screen. 6. Place the AC/GND/DC switch to DC."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["7.  Connect the CH1 probe to PC130-305 TP9. \n8.  Adjust PC130-305 R17, R22, R23, R24 and R25 in addition to          PC130-322 Dist. and Gain controls until the signal resembles         the one shown below.  Use the Time/Div Variable signal to              adjust the signal to be in line with the divisions of the scope.", "7. Connect the CH1 probe to PC130-305 TP9. 8. Adjust PC130-305 R17, R22, R23, R24 and R25 in addition to PC130-322 Dist. and Gain controls until the signal resembles the one shown below. Use the Time/Div Variable signal to adjust the signal to be in line with the divisions of the scope.", "MEASUREMENT SETUP - On PC130-305 measure TP9 and adjust R17, R22, R23, R24 and R25"], "jumps": ["P1320", "P1300", "P1315"]}, {"id": "P1320", "text": ["Verify that the TDM multiplexer is operating correctly.  The multiplexer circuit is set up.  If not touch HELP.", "Verify that the TDM multiplexer is operating correctly. The multiplexer circuit is set up. If not touch HELP."], "jumps": ["P1330", "P1310", "P1325"]}, {"id": "P1322", "text": ["Verify that the TDM multiplexer is operating correctly.  The multiplexer circuit is set up.  If not touch HELP.", "Verify that the TDM multiplexer is operating correctly. The multiplexer circuit is set up. If not touch HELP."], "jumps": ["P1330", "P1310", "P1325"]}, {"id": "P1325", "text": ["Touch if you made adjustments and now have the TDM multiplexer circuit operating correctly. Touch to return to the multiplexer alignment procedures.............................................", "MULTIPLEXER ALIGNMENT - If the multiplexer circuit on PC130-305 is not set up correctly, DO NOT go on until the transmitter is aligned."], "jumps": []}, {"id": "P1330", "text": ["1.  Set the PC3 DC Switch to ON.", "2.  Connect CH1 X10 probe to PC130-306 TP1.  Verify that the             TDM signal is present on the input to the demultiplexer.              3.  Connect CH2 X10 probe to PC130-306 TP3.", "1. Set the PC3 DC Switch to ON.ntrol to 12. 130A - Set the PC1 DC Switch to ON....", "2. Connect CH1 X10 probe to PC130-306 TP1. Verify that the TDM signal is present on the input to the demultiplexer. 3. Connect CH2 X10 probe to PC130-306 TP3."], "jumps": ["P1320", "P1350", "P1330", "P"]}, {"id": "P1350", "text": ["4.  Adjust PC130-306 R7 so that the reset pulse occurs on the             leading edge of the sync pulse as shown.", "5.  Using the internal frequency counter in the function generator      or a separate frequency counter if available (if not use an                oscilloscope), adjust PC130-306 R10 for a 1.5 MHz +5 kHz               signal as measured on TP5.", "4. Adjust PC130-306 R7 so that the reset pulse occurs on the leading edge of the sync pulse as shown.", "MEASUREMENT SETUP - On PC130-306 adjust R7", "5. Using the internal frequency counter in the function generator or a separate frequency counter if available (if not use an oscilloscope), adjust PC130-306 R10 for a 1.5 MHz +5 kHz signal as measured on TP5."], "jumps": ["P1360", "P1340", "P1355", "P1370", "P1350"]}, {"id": "P1370", "text": ["6.  Using the dual display mode on the oscilloscope, measure,            compare and adjust (if needed) the following on PC130-305            and PC130-306.", "6. Using the dual display mode on the oscilloscope, measure, compare and adjust (if needed) the following on PC130-305 and PC130-306. 30-305 TP1 and CH2 PC130-306 TP10. Adjust PC130-306 R26 to match input to output. b. CH1 PC130-305 TP2 and CH2 PC130-306 TP11. Adjust PC130-306 R27 to match input to output.", "If jagged portions of the waveform exist, try adjusting R7 (CW and CCW). This changes the location of the reset pulse.", "a. CH1 PC130-305 TP1 and CH2 PC130-306 TP10. Adjust PC130-306 R26 to match input to output. b. CH1 PC130-305 TP2 and CH2 PC130-306 TP11. Adjust PC130-306 R27 to match input to output."], "jumps": ["P1380", "P1360", "P1375"]}, {"id": "P1380", "text": ["7.  Using the dual display mode on the oscilloscope, measure,            compare, and adjust (if needed) the following on PC130-305           and PC130-306.", "7. Using the dual display mode on the oscilloscope, measure, compare, and adjust (if needed) the following on PC130-305 and PC130-306.", "a. CH1 PC130-305 TP3 and CH2 PC130-306 TP12. Adjust PC130-306 R28 to match input to output. b. CH1 PC130-305 TP4 and CH2 PC130-306 TP13. Adjust PC130-306 R29 to match input to output."], "jumps": ["P1390", "P1370", "P1385"]}, {"id": "P1390", "text": ["Do the analog information signals out of the demultiplexer, PC130-306, match the signals applied to the multiplexer, \nPC130-305?", "Do the analog information signals out of the demultiplexer, PC130-306, match the signals applied to the multiplexer, PC130-305?"], "jumps": ["P1380"]}, {"id": "P1391", "text": [], "jumps": []}, {"id": "P1392", "text": ["The system is not set up correctly.  You need to check the alignment of the receiver.", "The system is not set up correctly. You need to check the alignment of the receiver.", "Touch to return to the receiver alignment. Touching takes you back to the question but, if the receiver is not aligned correctly, you will not get satisfactory results in the troubleshooting problems."], "jumps": []}, {"id": "P1400", "text": ["The TDM system is operating correctly, the four analog inputs are multiplexed and sent to the receiver.  Then the one TDM signal is demultiplexed and four outputs are available.", "The TDM system is operating correctly, the four analog inputs are multiplexed and sent to the receiver. Then the one TDM signal is demultiplexed and four outputs are available."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["Notes for troubleshooting: \n1.  When checking the inputs to the transmitter and outputs of             the receiver, check all four signals.\n2.  When checking the output of the transmitter and input to the          receiver, check for the TDM signal.", "Notes for troubleshooting: 1. When checking the inputs to the transmitter and outputs of the receiver, check all four signals. 2. When checking the output of the transmitter and input to the receiver, check for the TDM signal."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["The computer will now insert a fault, or insert no fault, into the TDM system.  You are to determine if the system is operating correctly, and if not, you are to locate the fault to the transmitter or receiver, to the circuit, and then to the most probable chip or component.", "The computer will now insert a fault, or insert no fault, into the TDM system. You are to determine if the system is operating correctly, and if not, you are to locate the fault to the transmitter or receiver, to the circuit, and then to the most probable chip or component."], "jumps": ["P1410"]}, {"id": "P1430", "text": ["Would you like to try another troubleshooting experiment?", "Would you like to try another troubleshooting experiment? No"], "jumps": []}, {"id": "P1440", "text": ["You have completed all the troubleshooting experiments for this lesson.  If you would like to try the troubleshooting experiments again, select TDM CIRCUIT TROUBLESHOOTING from the Lesson Menu.", "You have completed all the troubleshooting experiments for this lesson. If you would like to try the troubleshooting experiments again, select TDM CIRCUIT TROUBLESHOOTING from the Lesson Menu."], "jumps": []}, {"id": "P1450", "text": ["1. Return the Test Console to the initial control settings. nter the discussion text here."], "jumps": []}, {"id": "P1460", "text": ["Disconnect test equipment. \n     Carefully remove PC cards.                     \n     Return all equipment to its proper storage area.", "Disconnect test equipment. Carefully remove PC cards. Return all equipment to its proper storage area.torage area."], "jumps": []}, {"id": "P1470", "text": ["Set the Test Console Power OFF. Carefully remove the PC cards from the test console. Return all equipment to its proper storage area. .."], "jumps": []}, {"id": "P1910", "text": ["This completes the experiment on TDM CIRCUIT TROUBLESHOOTING."], "jumps": ["P1001", "P1470"]}, {"id": "P2000", "text": ["The TDM system may or may not be faulted, you must check using the oscilloscope."], "jumps": ["P2010"]}, {"id": "P2010", "text": ["1. Measure the input signals to the transmitter on PC130-305 TPs     and the output signals of the receiver on PC130-306 TPs to            determine if the TDM system is operating correctly.  Is the TDM      system operating correctly?", "1. Measure the input signals to the transmitter on PC130-305 TPs and the output signals of the receiver on PC130-306 TPs to determine if the TDM system is operating correctly. Is the TDM system operating correctly?"], "jumps": ["P2000"]}, {"id": "P2011", "text": [], "jumps": []}, {"id": "P2012", "text": ["The output signal of the receiver for channel 2 is incorrect, zero volts.  It does match the input signal to the transmitter however,  the input should be a 1000 Hz signal for channel 2.  The TDM system is not operating correctly.", "The output signal of the receiver for channel 2 is incorrect, zero volts. It does match the input signal to the transmitter however, the input should be a 1000 Hz signal for channel 2. The TDM system is not operating correctly."], "jumps": []}, {"id": "P2020", "text": ["2.  Determine if the transmitter, transmission medium or receiver        is faulted by measuring the signals on PC130-305 TP9 and on       PC130-306 TP1.  Is the transmitter, transmission medium or            receiver faulted?", "2. Determine if the transmitter, transmission medium or receiver is faulted by measuring the signals on PC130-305 TP9 and on PC130-306 TP1. Is the transmitter, transmission medium or receiver faulted?"], "jumps": ["P2010"]}, {"id": "P2021", "text": [], "jumps": []}, {"id": "P2022", "text": ["The TDM output signal of the transmitter is missing the channel 2 information.  The transmission medium is not faulted.", "The TDM output signal of the transmitter is missing the channel 2 information. The transmission medium is not faulted."], "jumps": []}, {"id": "P2023", "text": ["The TDM output signal of the transmitter is missing the channel 2 information.  The receiver is not faulted.", "The TDM output signal of the transmitter is missing the channel 2 information. The receiver is not faulted."], "jumps": []}, {"id": "P2030", "text": ["3.  Determine the faulted circuit in the transmitter by measuring          the signals on the IC pins and TPs of PC130-305.  Which                  circuit in the transmitter is faulted?", "3. Determine the faulted circuit in the transmitter by measuring the signals on the IC pins and TPs of PC130-305. Which circuit in the transmitter is faulted?"], "jumps": ["P2020"]}, {"id": "P2031", "text": ["The output signal on TP9 of the multiplexer is correct for the sync pulse and three of the four information signals. The multiplexer is not faulted.", "The output signal on TP9 of the multiplexer is correct for the sync pulse and three of the four information signals. The control/clock circuits are not faulted."], "jumps": []}, {"id": "P2040", "text": ["Which IC or component is most likely to cause the fault?", "Which IC or component is most likely to cause the fault?..."], "jumps": ["P2030"]}, {"id": "P2041", "text": ["The input to IC1 on pin 5 for channel 2 is zero.  The op-amp can not operate with an incorrect input.", "The signal is not present to the input of C4.  Look for the signal at the input of the amplifier.", "Congratulations, you determined that the fault is C3 grounded.", "The input to IC1 on pin 5 for channel 2 is zero. The op-amp can not operate with an incorrect input.", "The signal is not p "Which IC or component is most likely to cause the fault?", "Which IC or component is most likely to cause the fault?..."], "jumps": ["P5030"]}, {"id": "P5041", "text": ["IC2 is the clock, and the signal on TP5 is correct.  IC2 is not faulted.", "R15 can be verified as operational by measuring the output of IC2 pin 4 while adjusting R15.", "Congratulations, you determined that IC3 is faulted.", "IC2 is the clock, and the signal on TP5 is correct. IC2 is not faulted.", "Congratulations, you determined that IC3 is faulted........"], "jumps": ["P5050", "P5040"]}, {"id": "P5050", "text": ["In this case, the ground pin (8) has had the ground removed."], "jumps": ["P5060", "P5044"]}, {"id": "P5060", "text": ["The computer will now remove the fault. Check the output of the transmitter on the PC130-305 channel TPs and verify the TDM system is operating correctly."], "jumps": ["P5044"]}, {"id": "P6000", "text": ["The TDM system may or may not be faulted, you must check using the oscilloscope."], "jumps": []}, {"id": "P6010", "text": ["1.  Measure the input signals to the transmitter on PC130-305              TPs and the output signals of the receiver on PC130-306 TPs         to determine if the TDM system is operating correctly.  Is the           TDM system operating correctly?", "1. Measure the input signals to the transmitter on PC130-305 TPs and the output signals of the receiver on PC130-306 TPs to determine if the TDM system is operating correctly. Is the TDM system operating correctly?"], "jumps": ["P6000"]}, {"id": "P6011", "text": [], "jumps": []}, {"id": "P6012", "text": ["The output signals of the receiver matches the input signals to the transmitter.  The TDM system is operating correctly.", "The output signals of the receiver matches the input signals to the transmitter. The TDM system is operating correctly."], "jumps": []}, {"id": "P6020", "text": ["Congratulations, you determined that the TDM system has no faults."], "jumps": ["P6010"]}, {"id": "P9020", "text": ["In this experiment, you will locate the failed chip or component in a TDM transmitter and receiver system."], "jumps": ["P9040", "P1001"]}, {"id": "P9040", "text": ["The transmitter is located on the PC130-305 card.", "The transmitter is located on the PC130-305 card..........."], "jumps": ["P9050", "P9020", "P9045"]}, {"id": "P9050", "text": ["The transmitter consists of the components necessary to time multiplex information signals."], "jumps": ["P9060", "P9040"]}, {"id": "P9060", "text": ["The receiver is located on the PC130-306 card.", "The receiver is located on the PC130-306 card.............."], "jumps": ["P9070", "P9040", "P9065"]}, {"id": "P9070", "text": ["The receiver consists of the components necessary to demultiplex TDM signals."], "jumps": ["P9080", "P9060"]}, {"id": "P9080", "text": ["To locate a faulted chip or support component, you must first determine if the TDM system is operating correctly."], "jumps": ["P9090", "P9060"]}, {"id": "P9090", "text": ["To do this, you check each input signal to the transmitter against each output signal of the receiver."], "jumps": ["P9100", "P9080"]}, {"id": "P9100", "text": ["If one or more of the output signals are incorrect, then the system is faulted."], "jumps": ["P9110", "P9080"]}, {"id": "P9110", "text": ["If the system is faulted, you determine if the transmitter or receiver is causing the problem."], "jumps": ["P9120", "P9080"]}, {"id": "P9120", "text": ["If the output of the transmitter is bad, the multiplexer circuits are faulted."], "jumps": ["P9130", "P9080"]}, {"id": "P9130", "text": ["If the output of the transmitter is good, the fault is in the transmission medium or receiver."], "jumps": ["P9140", "P9080"]}, {"id": "P9140", "text": ["If the input to the receiver is bad, the fault is in the transmission medium."], "jumps": ["P9150", "P9080"]}, {"id": "P9150", "text": ["If the input to the receiver is good, the demultiplexer circuits are faulted."], "jumps": ["P9160", "P9080"]}, {"id": "P9160", "text": ["Once the fault has been located, further oscilloscope or multimeter measurements will locate the fault to a particular chip or component.  Remember, use an analog multimeter to check out a transistor.  Let's start the experiment.", "Once the fault has been located, further oscilloscope or multimeter measurements will locate the fault to a particular chip or component. Remember, use an analog multimeter to check out a transistor. Let's start the experiment."], "jumps": ["P9170", "P9080"]}, {"id": "P9170", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P9160"]}, {"id": "P9180", "text": ["2.  Press Enter to set: Positive Supply Voltage - 15", "2. Press Enter to set: Positive Supply Voltage - 15......................."], "jumps": []}, {"id": "P9190", "text": ["3.  Press Enter to set: Negative Supply Voltage - 15", "3. Press Enter to set: Negative Supply Voltage - 15......................."], "jumps": []}, {"id": "P9200", "text": ["4.  Insert PC130-322 into the PC1 connectors on the test console. 5.  Insert PC130-305 into the PC2 connectors on the test console. 6.  Insert PC130-306 into the PC3 connectors on the test console.", "4. Insert PC130-322 into the PC1 connectors on the test console. 5. Insert PC130-305 into the PC2 connectors on the test console. 6. Insert PC130-306 into the PC3 connectors on the test console."], "jumps": ["P9210"]}, {"id": "P9210", "text": ["7.  On PC130-322, set the controls to mid position. \n8.  On PC130-305, set the controls to mid position. \n9.  On PC130-306, set the controls to mid position.", "7. On PC130-322, set the controls to mid position. 8. On PC130-305, set the controls to mid position. 9. On PC130-306, set the controls to mid position."], "jumps": ["P9220", "P9200"]}, {"id": "P9220", "text": ["10.  Press Enter to set: PC1 DC Power Switch - ON", "11.  Using the oscilloscope, measure the 500, 1000, 1500 and                 2000 Hz TPs on PC130-322 and adjust each channel                         controls as follows: \n        a. Adjust DIST for a sine wave output at 2 Vpp.\n        b. Adjust GAIN for a 0.5 Vpp signal.", "10. Press Enter to set: PC1 DC Power Switch - ON..........................", "11. Using the oscilloscope, measure the 500, 1000, 1500 and 2000 Hz TPs on PC130-322 and adjust each channel controls as follows: a. Adjust DIST for a sine wave output at 2 Vpp. b. Adjust GAIN for a 0.5 Vpp signal."], "jumps": ["P9210", "P9240"]}, {"id": "P9240", "text": ["12.  Using an alligator to alligator jumper, connect the 2000 Hz TP         on PC130-322 to TP4 on PC130-305.", "13.  Using the oscilloscope, measure the signals on PC130-305             TP1, TP2, TP3 and TP4.  Ensure you have 0.5 Vpp signals on         TP1, TP2, TP3 and TP4 of  PC130-305 before continuing.                 The information source card is set up.", "12. Using an alligator to alligator jumper, connect the 2000 Hz TP on PC130-322 to TP4 on PC130-305.", "MEASUREMENT SETUP - Using alligator to alligator jumper, connect the 2000 Hz TP on PC130-322 to TP4 on PC130-305.", "13. Using the oscilloscope, measure the signals on PC130-305 TP1, TP2, TP3 and TP4. Ensure you have 0.5 Vpp signals on TP1, TP2, TP3 and TP4 of PC130-305 before continuing. The information source card is set up."], "jumps": ["P9250", "P9230", "P9245", "P9260", "P9240"]}, {"id": "P9260", "text": ["1.  Press Enter to set: PC2 DC Power Switch - ON", "1. Press Enter to set: PC2 DC Power Switch - ON..........................."], "jumps": ["P9250"]}, {"id": "P9270", "text": ["2.  Using the oscilloscope, measure and adjust the following for         a 3 Vpp signal on PC130-305:", "2. Using the oscilloscope, measure and adjust the following for a 3 Vpp signal on PC130-305::", "a. TP5, adjust R22 b. TP6, adjust R23 c. TP7, adjust R24 d. TP8, adjust R25", "MEASUREMENT SETUP - On PC130-305 measure and adjust the following: TP5 - adjust R22 TP7 - adjust R24 TP6 - adjust R23 TP8 - adjust R25"], "jumps": ["P9280", "P9275"]}, {"id": "P9280", "text": ["3.  Using the internal frequency counter of the function generator      or a separate frequency counter if available (if not use an                oscilloscope) adjust R15 for a 200 kHz \u00b15 kHz signal on TP12        of PC130-305.", "3. Using the internal frequency counter of the function generator or a separate frequency counter if available (if not use an oscilloscope) adjust R15 for a 200 kHz", "5 kHz signal on TP12 of PC130-305.", "MEASUREMENT SETUP - On PC130-305 measure TP12 and adjust R15."], "jumps": ["P9290", "P9270", "P9285"]}, {"id": "P9290", "text": ["4.  Set the oscilloscope controls as follows:", "4. Set the oscilloscope controls as follows:..............", "a. Volt/Div - .1 (use a X10 probe) b. Time/Div - 5 ms c. Triggering - CH1, AC, Negative d. Coupling - DC"], "jumps": ["P9300", "P9280"]}, {"id": "P9300", "text": ["5.  Place the AC/GND/DC switch to GND and position the CH1              trace in the center of the screen.  \n6.  Place the AC/GND/DC switch to DC.", "5. Place the AC/GND/DC switch to GND and position the CH1 trace in the center of the screen. 6. Place the AC/GND/DC switch to DC."], "jumps": ["P9310", "P9290"]}, {"id": "P9310", "text": ["7.  Connect the CH1 probe to PC130-305 TP9.\n8.  Adjust PC130-305 R17, R22, R23, R24 and R25 in addition to          PC130-322 Dist. and Gain controls until the signal resembles         the one shown below.  Use the Time/Div Variable signal to              adjust the signal to be in line with the divisions of the scope.", "7. Connect the CH1 probe to PC130-305 TP9. 8. Adjust PC130-305 R17, R22, R23, R24 and R25 in addition to PC130-322 Dist. and Gain controls until the signal resembles the one shown below. Use the Time/Div Variable signal to adjust the signal to be in line with the divisions of the scope.", "MEASUREMENT SETUP - On PC130-305 measure TP9 and adjust R17, R22, R23, R24 and R25."], "jumps": ["P9320", "P9300", "P9315"]}, {"id": "P9320", "text": ["Verify that the TDM multiplexer is operating correctly.  The multiplexer circuit is set up.  If not touch HELP.", "Verify that the TDM multiplexer is operating correctly. The multiplexer circuit is set up. If not touch HELP."], "jumps": ["P9330", "P9310", "P9325"]}, {"id": "P9322", "text": ["Verify that the TDM multiplexer is operating correctly. The multiplexer circuit is set up.  If not touch HELP.", "Verify that the TDM multiplexer is operating correctly. The multiplexer circuit is set up. If not touch HELP."], "jumps": ["P9330", "P9310", "P9325"]}, {"id": "P9325", "text": ["Touch if you made adjustments and now have the TDM multiplexer circuit operating correctly. Touch to return to the multiplexer alignment procedures.............................................", "MULTIPLEXER ALIGNMENT - If the multiplexer circuit on PC130-305 is not set up correctly, DO NOT go on until the the transmitter is aligned."], "jumps": []}, {"id": "P9330", "text": ["1.  Press Enter to set: PC3 DC Power Switch - ON", "2.  Connect CH1 X10 probe to PC130-306 TP1.  Verify that the              TDM signal is present on the input to the demultiplexer.             3.  Connect CH2 X10 probe to PC130-306 TP3.", "1. Press Enter to set: PC3 DC Power Switch - ON...........................", "2. Connect CH1 X10 probe to PC130-306 TP1. Verify that the TDM signal is present on the input to the demultiplexer. 3. Connect CH2 X10 probe to PC130-306 TP3."], "jumps": ["P9322", "P9350"]}, {"id": "P9350", "text": ["4.  Adjust PC130-306 R7 so that the reset pulse occurs on the              leading edge of the sync pulse as shown.", "5.  Using the internal frequency counter in the function generator      or a separate frequency counter if available (if not use an                oscilloscope), adjust PC130-306 R10 for a 1.5 MHz \u00b15 kHz               signal as measured on TP5.", "4. Adjust PC130-306 R7 so that the reset pulse occurs let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
