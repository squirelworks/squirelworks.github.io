ing the value of Xc which changes Ic. When Ic changes, total current also changes."], "jumps": ["P14400", "P14380"]}, {"id": "P14400", "text": ["A higher frequency than 20 kHz decreases Xc.  The capacitive branch starts to become pure resistive and the phase difference between the two branches in the parallel circuit approaches 0 degrees.", "A higher frequency than 20 kHz decreases Xc. The capacitive branch starts to become pure resistive and the phase difference between the two branches in the parallel circuit approaches 0 degrees."], "jumps": ["P14410", "P14390"]}, {"id": "P14410", "text": ["Frequencies below 20 kHz increase Xc.  The capacitive branch comes closer to pure capacitive.  The phase difference between the two branches in the parallel circuit approaches 90 degrees.", "Frequencies below 20 kHz increase Xc. The capacitive branch comes closer to pure capacitive. The phase difference between the two branches in the parallel circuit approaches 90 degrees."], "jumps": ["P14420", "P14400"]}, {"id": "P14420", "text": ["7.  Return the function generator frequency to 20 kHz.      \n8.  Set S4 DOWN on PC130-12.  Notice, the phase difference                 increased. Capacitance decreased which increased Xc.", "7. Return the function generator frequency to 20 kHz. 8. Set S4 DOWN on PC130-12. Notice, the phase difference increased. Capacitance decreased which increased Xc."], "jumps": ["P14430", "P14410"]}, {"id": "P14430", "text": ["9.  Increase R4 to maximum resistance.  Notice, the phase                    difference approaches 0 degrees.  The capacitive branch                becomes almost all resistive.", "9. Increase R4 to maximum resistance. Notice, the phase difference approaches 0 degrees. The capacitive branch becomes almost all resistive."], "jumps": ["P14440", "P14420"]}, {"id": "P14440", "text": ["10.  Decrease R4 to minimum resistance.  The phase difference            approaches 90 degrees.  The capacitive branch becomes               almost all capacitive.", "10. Decrease R4 to minimum resistance. The phase difference approaches 90 degrees. The capacitive branch becomes almost all capacitive."], "jumps": ["P14450", "P14430"]}, {"id": "P14450", "text": ["Remember in an RC parallel circuit:\n- Current leads voltage by 90\u00ba in a capacitor (ICE).                        \n- Voltage is the same across the parallel circuit branches.", "Remember in an RC parallel circuit: - Current leads voltage by 90", "in a capacitor (ICE). - Voltage is the same across the parallel circuit branches."], "jumps": ["P14460", "P14440"]}, {"id": "P14460", "text": ["Remember in an RC parallel circuit: \n- R and Xc oppose current differently.        \n- Ir and Ic are not in phase.", "Remember in an RC parallel circuit: - R and Xc oppose current differently. - Ir and Ic are not in phase."], "jumps": ["P14450"]}, {"id": "P14480", "text": ["1.  Place Console Power to OFF.", "1. Place Console Power to OFF.h to OFF.FF................................."], "jumps": []}, {"id": "P14490", "text": ["2.  Disconnect all test equipment.            \n3.  Carefully remove PC130-12.                                             \n4.  Return all equipment to its proper storage area.", "2. Disconnect all test equipment. 3. Carefully remove PC130-12. 4. Return all equipment to its proper storage area."], "jumps": ["P14910", "P14480"]}, {"id": "P14910", "text": ["This completes the experiment on RC PARALLEL CIRCUIT OPERATION."], "jumps": ["P14490"]}, {"id": "P15000", "text": ["SOLVING BRANCH CURRENTS - A. Resistive branch (Ir):", "1. Find Rt. Rt = R1 + R2 2. Solve for current. Ea Ir = Rt. Calculate Z. Z = R2 + Xct222222222"], "jumps": ["P15002", "P14190"]}, {"id": "P15002", "text": ["SOLVING BRANCH CURRENTS - B. Capacitive branch (Ic):", "1. Total Capacitance 2. Total capacitive reactance 3. Total resistance 4. Total impedance 5. Total current", "1. Total Capacitance 2. Total capacitive reactance 3. Total resistance 4. Total impedance 5. Total current current     const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
