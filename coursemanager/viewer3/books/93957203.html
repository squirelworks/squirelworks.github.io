nterrupter and reflector.i"], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["In the first part of the experiment, you will measure RPM and velocity directly from a sensor."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Then you will measure RPM and velocity from a sensor circuit that uses a F/V chip."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["In the optional second part of the experiment, you will use an oscilloscope and observe acceleration and deceleration."], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["Let's begin the lesson on MOTION TRANSDUCER OPERATION....................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1020", "text": ["In this experiment, you will observe the operation of motion sensors and measure the RPM and velocity.", "The motion sensors are mounted on the PC130-255 experiment card.  Pick up the card and examine it.", "The motion sensors are mounted on the PC130-255 experiment card. Pick up the card and examine it."], "jumps": ["P1030", "P1001", "P1040", "P1020"]}, {"id": "P1040", "text": ["The disk is rotated by a small DC motor, this produces motion."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["On the disk are holes and dark areas that are used by the different motion sensors."], "jumps": ["P1060", "P1030"]}, {"id": "P1060", "text": ["Locate PS1 on the card.  This is the photoreflector sensor and is only on one side of the disk.", "Locate PS1 on the card. This is the photoreflector sensor and is only on one side of the disk."], "jumps": ["P1070", "P1030"]}, {"id": "P1070", "text": ["It uses the dark and silver areas on the disk to detect motion."], "jumps": ["P1080", "P1030"]}, {"id": "P1080", "text": ["The dark areas WILL NOT reflect light, the silver areas WILL reflect light."], "jumps": ["P1090", "P1030"]}, {"id": "P1090", "text": ["Now, locate PS2 on the card."], "jumps": ["P1100", "P1030"]}, {"id": "P1100", "text": ["PS2 is the photointerrupter sensor.  The light transmitter is on one side of the disk and the light receiver is on the other side.", "PS2 is the photointerrupter sensor. The light transmitter is on one side of the disk and the light receiver is on the other side."], "jumps": ["P1110", "P1030"]}, {"id": "P1110", "text": ["It uses the holes and the absence of holes to detect motion."], "jumps": ["P1120", "P1030"]}, {"id": "P1120", "text": ["Note that the schematic of the entire card may be viewed by selecting the schematic button anytime it is indicated on your screen.", "The disk motor circuit consists of three switches that set up a DC output voltage to the motor through IC2 and IC3."], "jumps": ["P1130", "P1030", "P1140", "P1120"]}, {"id": "P1140", "text": ["IC2 is a chip that changes digital inputs to analog.  Switches S1 through S3 input digital data (000 to 111) and the output is a DC voltage on pin 8.", "IC2 is a chip that changes digital inputs to analog.  Switches S1 through S3 input digital data (000 to 111) and the output is a DC voltage on pin 8.", "IC2 is a chip that changes digital inputs to analog. Switches S1 through S3 input digital data (000 to 111) and the output is a DC voltage on pin 8.", "IC2 is a chip that changes digital inputs to analog. Switches S1 through S3 input digital data (000 to 111) and the output is a DC voltage on pin 8.."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["The output of IC2 is amplified by IC3 and applied to the motor.", "The output of IC2 is amplified by IC3 and applied to the motor."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["As the switches are placed to IN, from 000 to 111, the motor will rotate the disk faster.", "As the switches are placed to IN, from 000 to 111, the motor will rotate the disk faster."], "jumps": ["P1170", "P1130"]}, {"id": "P1170", "text": ["The output of the photointerrupter, PS2, does not use me values.", "Note that both motion sensors produced approximately the same values. nterrupter Reflector RPM @%10 @%12 V @%11 in/sec @%13 in/Sec"], "jumps": ["P1740", "P1720"]}, {"id": "P1740", "text": ["The only difference is the formulas used by the sensors. Because one sensor used a F/V circuit and the other did not the formulas were different."], "jumps": ["P1750", "P1730"]}, {"id": "P1750", "text": ["11.  If time permits, set S1 through S3 on PC130-255 to various             positions and determine RPM and V.", "11. If time permits, set S1 through S3 on PC130-255 to various positions and determine RPM and V.", "D = .625 N = 15 CF = .0024 Eout = Measured at Vout TP"], "jumps": ["P1760", "P1730"]}, {"id": "P1760", "text": ["1.  Return S1, S2 and S3 on PC130-255 to OUT, to the right.             2.  Disconnect the test equipment from the circuit.", "1. Return S1, S2 and S3 on PC130-255 to OUT, to the right. 2. Disconnect the test equipment from the circuit."], "jumps": ["P1770", "P1750", "P1765"]}, {"id": "P1770", "text": ["3.  Return the Test Console to their initial control settings.", "3. Return the Test Console to their initial control settings.............."], "jumps": ["P1760"]}, {"id": "P1780", "text": ["4.  Set the Test Console Power to OFF.", "4. Set the Test Console Power to OFF.F...................."], "jumps": ["P1770"]}, {"id": "P1790", "text": ["5.  Carefully remove PC130-255 card. \n6.  Return all equipment to its proper storage area.", "5. Carefully remove PC130-255 card. 6. Return all equipment to its proper storage area."], "jumps": ["P1910", "P1780"]}, {"id": "P13280", "text": ["6.  Press Enter to set: PC1 DC Power Switch - ON", "This completes the experiment on RPM AND VELOCITY.", "6. Press Enter to set: PC1 DC Power Switch - ON...........................", "This completes the experiment on RPM AND VELOCITY.E........"], "jumps": ["P13270"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["In this experiment, you will observe and measure acceleration and deceleration as detected by a motion sensor."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["You will use the photoreflector sensor along with the F/V circuit."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["Notice that the circuit does not have a differentiator circuit."], "jumps": ["P2050", "P2030"]}, {"id": "P2042", "text": ["Notice that the circuit does not have a differentiator circuit."], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["So, you will use the oscilloscope to observe the increase and decrease in E      of A1 to determine acceleration and deceleration.", "So, you will use the oscilloscope to observe the increase and decrease in E of A1 to determine acceleration and deceleration."], "jumps": ["P2060", "P2030"]}, {"id": "P2052", "text": ["So, you will use the oscilloscope to observe the increase/decrease in E     of IC1 to determine acceleration/deceleration.", "So, you will use the oscilloscope to observe the increase/decrease in E of IC1 to determine acceleration/deceleration."], "jumps": ["P2060", "P2030"]}, {"id": "P2060", "text": ["Because the measurements made are very close it is important to ensure proper oscilloscope settings.  If you have trouble, see your instructor.", "Because the measurements made are very close it is important to ensure proper oscilloscope settings. If you have trouble, see your instructor."], "jumps": ["P2070", "P2030"]}, {"id": "P2062", "text": ["Because the measurements made are very close it is important to ensure proper oscilloscope settings.  If you have trouble, see your instructor.", "Because the measurements made are very close it is important to ensure proper oscilloscope settings. If you have trouble, see your instructor."], "jumps": ["P2070", "P2030"]}, {"id": "P2070", "text": ["Let's start the experiment!", "Let's start the experiment!e..............................."], "jumps": ["P2080", "P2030"]}, {"id": "P2080", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P2070"]}, {"id": "P2090", "text": ["2.  Set the Voltmeter switch to Positive. \n3.  Set Positive Supply Voltage to 15.  The Test Console's voltage      meter should  indicate 15 volts.", "2. Set the Voltmeter switch to Positive. 3. Set Positive Supply Voltage to 15. The Test Console's voltage meter should indicate 15 volts."], "jumps": ["P2080"]}, {"id": "P2100", "text": ["4.  Set the Voltmeter switch to Negative. \n5.  Set Negative Supply Voltage to 15.  The Test Console's                    voltage meter should indicate -15 volts.", "4. Set the Voltmeter switch to Negative. 5. Set Negative Supply Voltage to 15. The Test Console's voltage meter should indicate -15 volts."], "jumps": ["P2090"]}, {"id": "P2110", "text": ["6.  Insert PC130-255 into the PC1 position of the test console.", "6. Insert PC130-255 into the PC1 position of the test console."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["7.  On PC130-255, set S1, S2 and S3 to OUT, the right.", "7. On PC130-255, set S1, S2 and S3 to OUT, the right."], "jumps": ["P2130", "P2110", "P2125"]}, {"id": "P2130", "text": ["8.  Place PC1 DC Power switch to ON.", "8. Place PC1 DC Power switch to ON.l to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2120"]}, {"id": "P2140", "text": ["Recall that acceleration and deceleration is calculated as the change in velocity divided by the change in time."], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["To determine acceleration and deceleration, you determine the change in velocity then measure the change in time using an oscilloscope."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["The change in velocity will be from 0 inches per sec (disk not moving) to the velocity when S1 is IN.", "The change in velocity will be from 0 inches per sec (disk not moving) to the velocity when S1 is IN. Recall from the first part of the experiment that this was approximately 75 in/sec.", "Recall from the first part of the experiment that this was approximately 75 in/sec."], "jumps": ["P2170", "P2140"]}, {"id": "P2170", "text": ["The change in velocity is 75 in/sec.  All that is left to do is to measure the change in time.", "The change in velocity is 75 in/sec. All that is left to do is to measure the change in time."], "jumps": ["P2180", "P2140"]}, {"id": "P2180", "text": ["1.  Set the oscilloscope controls as follows:", "1. Set the oscilloscope controls as follows:OLT/DIV - .1 TIME/DIV - .2 sec. TRIGGERING - CH1, DC, + COUPLING - DC", "VOLT/DIV - .1 TIME/DIV - .2 sec. TRIGGERING - CH1, DC, + COUPLING - DC C"], "jumps": ["P2190", "P2170", "P2185"]}, {"id": "P2185", "text": ["CH1 AC, GND, DC - DC CH1 VOLTS/DIV - .1V Display - CH1", "Trigger Source - CH1 Trigger Coupling - DC Trigger Slope - + Time/Div - .2 Sec."], "jumps": []}, {"id": "P2190", "text": ["2.  Set the trace 0 V reference to the bottom of the screen.", "2. Set the trace 0 V reference to the bottom of the screen."], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["3.  Connect the channel one probe to the Vout output.", "3. Connect the channel one probe to the Vout output........."], "jumps": ["P2210", "P2190", "P2205"]}, {"id": "P2210", "text": ["4.  Place S1 on PC130-255 to ON, the left, and observe the trace          on the oscilloscope.  Notice that the trace moves up to about \n     3 divisions or .3 V's.", "4. Place S1 on PC130-255 to ON, the left, and observe the trace on the oscilloscope. Notice that the trace moves up to about 3 divisions or .3 V's."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["As the trace moves up, the disk is accelerating.  When the trace steadies, the disk has a constant velocity.", "As the trace moves up, the disk is accelerating. When the trace steadies, the disk has a constant velocity."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["The time it takes for the trace to go from 0V (0 in/sec) to 0.3V \n(75 in/sec) is the time change needed to calculate acceleration.", "The time it takes for the trace to go from 0V (0 in/sec) to 0.3V (75 in/sec) is the time change needed to calculate acceleration."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["Now, let's measure that time.", "Now, let's measure that time..............................."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["5.  Place S1 on PC130-255 to OUT, to the right.  Wait until the disk      stops rotating.", "5. Place S1 on PC130-255 to OUT, to the right. Wait until the disk stops rotating."], "jumps": ["P2260", "P2240", "P2255"]}, {"id": "P2260", "text": ["To determine the time, you count the number of divisions from the time that S1 is turned ON to the time that Eout reaches \n0.3 volts.", "To determine the time, you count the number of divisions from the time that S1 is turned ON to the time that Eout reaches 0.3 volts. ch division equals 0.2 seconds (as set by the TIME/DIV control) and one entire sweep equals 2 seconds (0.2 x 10). x 10).", "Each division equals 0.2 seconds (as set by the TIME/DIV control) and one entire sweep equals 2 seconds (0.2 x 10)."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["6.  When the trace first starts its left to right movement, place                PC130-255 S1 IN, to the left, and determine the time it takes for       Eout to reach 0.3 V.", "6. When the trace first starts its left to right movement, place PC130-255 S1 IN, to the left, and determine the time it takes for Eout to reach 0.3 V."], "jumps": ["P2280", "P2260", "P2275"]}, {"id": "P2280", "text": ["7.  Repeat the time measuring process by placing S1 to OUT,              waiting until the disk stops, and then when the trace starts its        left to right sweep,  place S1 to IN.                         \n     Arrive at an average time, or D T.", "7. Repeat the time measuring process by placing S1 to OUT, waiting until the disk stops, and then when the trace starts its left to right sweep, place S1 to IN. Arrive at an average time, or D T."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["You should have measured approximately 4 seconds for the trace to go from 0 V to 0.3 V, 2 sweeps."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["Using the time you measured as delta T, calculate and type in the acceleration rounded to tenths."], "jumps": ["P2290", "P2302"]}, {"id": "P2301", "text": [], "jumps": []}, {"id": "P2302", "text": ["You did not type in the correct acceleration.  Determining the change in time takes careful oscilloscope use.  Be sure you are determining the time from 0 V to 0.3 V correctly.", "You did not type in the correct acceleration. Determining the change in time takes careful oscilloscope use. Be sure you are determining the time from 0 V to 0.3 V correctly."], "jumps": []}, {"id": "P2303", "text": ["You still have not determined the correct acceleration.  You should have came up with around 18.8 in/sec/sec.", "You still have not determined the correct acceleration. You should have came up with around 18.8 in/sec/sec."], "jumps": ["P2300"]}, {"id": "P2310", "text": ["Now, let's measure deceleration.  You will use the same process, except you will measure the time it takes for the disk to stop rotating.", "Now, let's measure deceleration. You will use the same process, except you will measure the time it takes for the disk to stop rotating."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["8.  Ensure that PC130-255 S1 is IN, to the left and the trace on the      oscilloscope indicates approximately 0.3 volts.", "8. Ensure that PC130-255 S1 is IN, to the left and the trace on the oscilloscope indicates approximately 0.3 volts."], "jumps": ["P2330", "P2310", "P2325"]}, {"id": "P2330", "text": ["9.  When the trace first starts its left to right movement, place                PC130-255 S1 OUT, the right, and determine the time it takes          for E      to reach 0 V.", "9. When the trace first starts its left to right movement, place PC130-255 S1 OUT, the right, and determine the time it takes for E to reach 0 V."], "jumps": ["P2340", "P2320", "P2335"]}, {"id": "P2340", "text": ["10.  Repeat the time measuring process by placing S1 to IN,                   waiting until the disk reaches a steady velocity, and then                 when the trace starts its left to right sweep, place S1 to OUT.          Arrive at an average time, or DT.", "10. Repeat the time measuring process by placing S1 to IN, waiting until the disk reaches a steady velocity, and then when the trace starts its left to right sweep, place S1 to OUT. Arrive at an average time, or DT."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["This time, you should have measured about 3 seconds for the trace to get from 0.3 V to 0 B, 1.5 sweeps."], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["Using the time you measured as delta T, calculate and type in the deceleration rounded to tenths."], "jumps": ["P2350", "P2362"]}, {"id": "P2361", "text": [], "jumps": []}, {"id": "P2362", "text": ["You did not type in the correct deceleration.  Determining the change in time takes careful oscilloscope use.  Be sure you are determining the time from 0.3 V to 0 V correctly.", "You did not type in the correct deceleration. Determining the change in time takes careful oscilloscope use. Be sure you are determining the time from 0.3 V to 0 V correctly."], "jumps": []}, {"id": "P2363", "text": ["You still have not determined the correct deceleration.  You should have came up with around 25 in/sec/sec.", "You still have not determined the correct deceleration. You should have came up with around 25 in/sec/sec."], "jumps": ["P2360"]}, {"id": "P2370", "text": ["Note the acceleration and deceleration.", "Note the acceleration and deceleration. celeration = @%14 in/sec/sec Deceleration = @%15 in/sec/sec"], "jumps": ["P2380", "P2360"]}, {"id": "P2380", "text": ["The values are close, but not exactly the same."], "jumps": ["P2390", "P2370"]}, {"id": "P2390", "text": ["1.  Disconnect test equipment from the circuit. \n2.  Return the Test Console to their initial control settings.", "1. Disconnect test equipment from the circuit. 2. Return the Test Console to their initial control settings."], "jumps": ["P2370"]}, {"id": "P2400", "text": ["3.  Set the Test Console Power to OFF."], "jumps": ["P2390"]}, {"id": "P2410", "text": ["4.  Carefully remove PC130-255 card. \n5.  Return all equipment to its proper storage area.", "4. Carefully remove PC130-255 card. 5. Return all equipment to its proper storage area."], "jumps": ["P2910", "P2400"]}, {"id": "P13550", "text": ["3.  Remove the oscilloscope and connect the multimeter to the            V     TP and ground.", "3. Remove the oscilloscope and connect the multimeter to the V TP and ground."], "jumps": ["P13560", "P13540", "P13555"]}, {"id": "P13020", "text": ["In this experiment, you will observe the operation of motion sensors and measure the RPM and velocity.", "The motion sensors are mounted on the PC130-255 experiment card.  Pick up the card and examine it.", "The motion sensors are mounted on the PC130-255 experiment card. Pick up the card and examine it.."], "jumps": ["P13030", "P1001", "P13040", "P13020"]}, {"id": "P13040", "text": ["The disk is rotated by a small DC motor, this produces motion."], "jumps": ["P13050", "P13030"]}, {"id": "P13050", "text": ["On the disk are holes and dark areas that are used by the different motion sensors."], "jumps": ["P13060", "P13030"]}, {"id": "P13060", "text": ["Locate PS1 on the card.  This is the photoreflector sensor and is only on one side of the disk.", "Locate PS1 on the card. This is the photoreflector sensor and is only on one side of the disk."], "jumps": ["P13070", "P13030"]}, {"id": "P13070", "text": ["It uses the dark and silver areas on the disk to detect motion."], "jumps": ["P13080", "P13030"]}, {"id": "P13080", "text": ["The dark areas WILL NOT reflect light, the silver areas WILL reflect light."], "jumps": ["P13090", "P13030"]}, {"id": "P13090", "text": ["Now, locate PS2 on the card."], "jumps": ["P13100", "P13030"]}, {"id": "P13100", "text": ["PS2 is the photointerrupter sensor.  The light transmitter is on one side of the disk and the light receiver is on the other side.", "PS2 is the photointerrupter sensor. The light transmitter is on one side of the disk and the light receiver is on the other side."], "jumps": ["P13110", "P13030"]}, {"id": "P13110", "text": ["It uses the holes and the absence of holes to detect motion."], "jumps": ["P13120", "P13030"]}, {"id": "P13120", "text": ["Note that the schematic of the entire card may be viewed by selecting the schematic button anytime it is indicated on your screen.", "The disk motor circuit consists of three switches that set up a DC output voltage to the motor through IC2 and IC3."], "jumps": ["P13130", "P13030", "P13140", "P13120"]}, {"id": "P13140", "text": ["IC2 is a chip that changes digital inputs to analog.  Switches S1 through S3 input digital data (000 to 111) and the output is a DC voltage on pin 8.", "IC2 is a chip that changes digital inputs to analog.  Switches S1 through S3 input digital data (000 to 111) and the output is a DC voltage on pin 8.", "IC2 is a chip that changes digital inputs to analog. Switches S1 through S3 input digital data (000 to 111) and the output is a DC voltage on pin 8."], "jumps": ["P13150", "P13130"]}, {"id": "P13150", "text": ["The output of IC2 is amplified by IC3 and applied to the motor.", "The output of IC2 is amplified by IC3 and applied to the motor.", "The output of IC2 is amplified by IC3 and applied to the motor..."], "jumps": ["P13160", "P13130"]}, {"id": "P13160", "text": ["As the switches are placed to IN, from 000 to 111, the motor will rotate the disk faster.", "As the switches are placed to IN, from 000 to 111, the motor will rotate the disk faster."], "jumps": ["P13170", "P13130"]}, {"id": "P13170", "text": ["The output of the photointerrupter, PS2, does not use a F/V chip. The output is shaped by IC4 and sent to TP8."], "jumps": ["P13180", "P13162"]}, {"id": "P13180", "text": ["To find RPM and ROR (velocity), you will use these formulas:"], "jumps": ["P13190", "P13170"]}, {"id": "P13190", "text": ["The photoreflector circuit uses a F/V chip, it changes frequency to voltage."], "jumps": ["P13200", "P13180"]}, {"id": "P13200", "text": ["The output of the sensor is cleaned and shaped by two of the schmitt triggers inverters of IC4, and applied to the F/V chip IC1."], "jumps": ["P13210", "P13190"]}, {"id": "P13202", "text": ["The output of the sensor is cleaned and shaped by two of the schmitt triggers inverters of IC4, and applied to the F/V chip IC1."], "jumps": ["P13210", "P13190"]}, {"id": "P13210", "text": ["To find RPM and velocity, you will use the formulas you learned in the motion circuit lesson:", "RPM = Eout x 60/(N x CF) V = Eout x D/CF"], "jumps": ["P13220", "P13202"]}, {"id": "P13220", "text": ["Let's start the experiment!", "Let's start the experiment!e..............................."], "jumps": ["P13230", "P13210"]}, {"id": "P13230", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P13220"]}, {"id": "P13240", "text": ["2.  Press Enter to set:  Positive Supply Voltage - 15", "2. Press Enter to set: Positive Supply Voltage - 155....................."], "jumps": []}, {"id": "P13250", "text": ["3.  Press Enter to set:  Negative Supply Voltage - 15", "3. Press Enter to set: Negative Supply Voltage - 155"], "jumps": []}, {"id": "P13260", "text": ["4.  Insert PC130-255 into the PC1 position of the test console.", "4. Insert PC130-255 into the PC1 position of the test console."], "jumps": ["P13270"]}, {"id": "P13270", "text": ["5. let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
