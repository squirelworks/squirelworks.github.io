const book = {"title": "9395N105", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: PLC TRAINER FAMILIARIZATION fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Identify an experiment card. w Describe insertion and removal procedures.", "w Identify the power requirements for the Nida Model 5050 PLC trainer.", "w Recognize trainer controls, switches, and indicating devices...", "w Perform procedures to start an experiment. w Insert and remove an experiment card. w Perform procedures to end an experiment."], "jumps": ["P300", "P100"]}, {"id": "P300", "text": [], "jumps": []}, {"id": "P310", "text": [], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P400", "text": ["The Nida Model 5050 PLC trainer introduces the student to the basic concepts of programmable logic controllers."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["The PLC trainer consists of: 5050 PLC Trainer - PC5050 Experiment Cards - Computer Lessons - Lab/Text Lessons", "- 5050 PLC Trainer - PC5050 Experiment Cards - Computer Lessons - Lab/Text Lessonsssss"], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["The Nida Model 5050 trainer demonstrates the SLC 500 PLC capabilities..."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["The trainer provides the necessary voltages to perform experiments and the circuitry to fault circuits."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["The SLC 500 is an industry standard programmable logic controller..."], "jumps": ["P450", "P420"]}, {"id": "P450", "text": ["The PC5050-1 Process Control card simulates a factory operator console."], "jumps": ["P460", "P440"]}, {"id": "P460", "text": ["The PC5050-2 Heater Process card simulates a factory hot water tank system."], "jumps": ["PQL"]}, {"id": "P470", "text": ["A multimeter is used to test and set PC5050-2 Heater Process card voltages."], "jumps": ["P480", "P460"]}, {"id": "P480", "text": ["The computer lessons guide you step-by-step through difficult material and provide you with help when needed."], "jumps": ["P490", "P470"]}, {"id": "P490", "text": ["The computer monitors all CAI experiments so that no harm comes to you or your equipment."], "jumps": ["P500", "P480"]}, {"id": "P500", "text": ["Remember, the main purpose for the Nida 5050 PLC trainer is to give you the best training possible.", "NIDA Trainer Model 5050 MFG By NIDA Corp. A Corp. rp. Serial # 12345 Date of MGD. 1920"], "jumps": ["P510", "P480"]}, {"id": "P510", "text": ["Let's begin the lesson on PLC TRAINER FAMILIARIZATION....................."], "jumps": ["P500"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The Nida Model 5050 PLC trainer uses either 115 volt 60 Hz or 220 volt 50 Hz input power."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Locate the rear panel on the Nida 5050 PLC trainer."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Primary power requirements are shown on the rear panel label. Use a screwdriver to switch from 220 to 110 VAC."], "jumps": ["P1050", "P1020", "PrN"]}, {"id": "P1050", "text": ["Fuse F1 inside the rear panel protects the trainer from excess primary power current drain."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["Notice the serial ports, 25 pin and 9 pin on the lower right side panel."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["The 9 pin port is where you plug in the external computer. Ensure that your trainer is connected to the computer you are using."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["If your trainer is not connected, see your instructor for assistance."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["The 25 pin serial port is utilized to reprogram the SLC 500 EEPROM ladder logic program."], "jumps": ["P1100", "P1060"]}, {"id": "P1100", "text": ["If you do not know what primary power your trainer requires, where do you check?"], "jumps": ["P1060"]}, {"id": "P1101", "text": [], "jumps": []}, {"id": "P1102", "text": ["The power switch does not indicate the required primary input power."], "jumps": []}, {"id": "P1103", "text": ["The power cord does not indicate the required primary input power."], "jumps": []}, {"id": "P1110", "text": ["If you have any further questions about the trainer primary power requirements, ask your instructor."], "jumps": ["P1910", "P1100"]}, {"id": "P1910", "text": ["This completes the information on POWER REQUIREMENTS......."], "jumps": ["P1001", "P1110"]}, {"id": "P1920", "text": ["1. Your Nida Model 5050 PLC trainer must be connected to the correct primary power."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. The label identifies the correct power requirements."], "jumps": ["P1940", "P1920", "PrN"]}, {"id": "P1940", "text": ["3. Fuse F1 protects the trainer from excess primary power current drain."], "jumps": ["P1999", "P1920"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1920"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["The Nida Model 5050 PLC trainer is divided into two parts.."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["The two panels are the control and display panel, and the PC card connector panel."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["The control and display panel contains the controls and indicators necessary to operate the trainer."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["The main power switch is a rocker action push on push off switch."], "jumps": ["P2070", "P2020"]}, {"id": "P2070", "text": ["When the trainer is plugged in and the top portion of the switch is pushed in, power is applied to the trainer and the switch will illuminate."], "jumps": ["P2080", "P2020"]}, {"id": "P2080", "text": ["The control panel contains an LED display and motor wheel.."], "jumps": ["P2090", "P2020"]}, {"id": "P2090", "text": ["The motor wheel provides a visual indication of PLC logic control of an analog device."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["The LED display has 8 red LEDs which provide a visual indication of PLC logic control."], "jumps": ["P2110", "P2080"]}, {"id": "P2110", "text": ["The SLC 500 PLC is an industry standard PLC which controls the simulated factory process.s."], "jumps": ["P2120", "P2080"]}, {"id": "P2120", "text": ["The SLC 500 PLC includes a central processing unit, extended communication capability, twelve input, and eight output relays..."], "jumps": ["P2125", "P2110"]}, {"id": "P2125", "text": ["TTL input module with 16 channels and an analog module with 2 input and 2 output channels."], "jumps": ["P2130", "P2120"]}, {"id": "P2130", "text": ["The ladder logic program is loaded into the CPU EEPROM via the external communication port."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["The SLC 500 PLC has an attached two slot expansion rack to support the TTL input and analog input modules..."], "jumps": ["P2150", "P2120"]}, {"id": "P2150", "text": ["The TTL input module has 16 input channels to provide discrete inputs to the PLC. Analog Module TTL Input Module"], "jumps": ["P2160", "P2120"]}, {"id": "P2160", "text": ["The analog module has 2 input and 2 output channels to allow the PLC to control analog devices. Analog Module TTL Input Module"], "jumps": ["P2170", "P2120"]}, {"id": "P2170", "text": ["The SLC 500 has 5 diagnostic LEDs, 12 relay input, 8 relay output, 16 TTL input indicators and an analog power indicator...", "Power PC Run CPU Fault Forced I/O Bat. Low"], "jumps": ["P2180", "P2120"]}, {"id": "P2180", "text": [], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["The power LED indicates that the processor has power applied."], "jumps": ["P2200", "P2170"]}, {"id": "P2200", "text": ["The PC run LED indicates the processor is in the run mode."], "jumps": ["P2210", "P2170"]}, {"id": "P2210", "text": ["The CPU FAULT LED indicates the processor detected a CPU or expansion memory error."], "jumps": ["P2220", "P2170"]}, {"id": "P2220", "text": ["The forced I/O indicates one or more I/O addresses have been forced on or off."], "jumps": ["P2230", "P2170"]}, {"id": "P2230", "text": ["The battery low LED alerts you when the battery should be replaced. (Note: Battery is optional and not normally installed.)"], "jumps": ["P2240", "P2170"]}, {"id": "P2240", "text": ["The relay, TTL and analog I/O status indicators illuminate when their circuits are energized.", "Power PC Run CPU Fault Forced I/O Bat. Low"], "jumps": ["P2250", "P2170"]}, {"id": "P2250", "text": ["The analog module power LED indicates that power is applied to the module."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["The SLC 500 relay, TTL and analog module terminals connect the PLC to the trainer..."], "jumps": ["P2270", "P2240"]}, {"id": "P2270", "text": ["The DC power, monitor and process selector switch control power and select lesson experiments."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["The DC power switch controls all DC power to the trainer. The yellow LED illuminates when power has activated."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["The monitor switch controls power to the monitor, and LED display. A yellow light illuminates when activated."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["The process selector initiates a trainer self-test and select lesson experiment programs during lab/text manual operation."], "jumps": ["P2310", "P2280"]}, {"id": "P2310", "text": ["Rotating the process selector to position two with main power on will initiate the self-test."], "jumps": ["P2320", "P2280"]}, {"id": "P2320", "text": ["The LED display and relay output lights sequentially illuminate and the motor wheel spins when initiated."], "jumps": ["P2330", "P2280"]}, {"id": "P2330", "text": ["The LED display and relay output lights 1 and 4 will stay illuminated and the motor wheel stops after a successful self-test."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["Turning the process selector to position one resets the trainer during hardcopy lab/text manual operation."], "jumps": ["P2350", "P2320"]}, {"id": "P2350", "text": ["The process selector switch must be off during CAI lessons for proper operation of the trainer."], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["The power, relay, TTL and analog test points provide access to all SLC 500 I/O circuits and DC power voltages..."], "jumps": ["P2380", "P2340"]}, {"id": "P2380", "text": ["You have covered all the controls on the control and display panel, now let's look at the PC card connector panel."], "jumps": ["P2390", "P2360"]}, {"id": "P2390", "text": ["The PC card connector panel contains PC card connectors, power supply and DC voltage select for the experiment cards."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["The panel is divided into two sections, PC1 and PC2........", "12 V 5 V 24 V + DC Voltage Selectct"], "jumps": ["P2410", "P2380"]}, {"id": "P2410", "text": ["Note up to two experiment cards can be used at one time."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["The PC card connectors are used to mount the printed circuit cards to the trainer."], "jumps": ["P2430", "P2400"]}, {"id": "P2430", "text": ["PC1 has 24 pins in groups of 6 and PC2 has 36 pins in groups of 6. Each pin plugs into corresponding receptacles on the experiment cards."], "jumps": ["P2440", "P2400"]}, {"id": "P2440", "text": ["The pins supply DC power to the PC cards, interface to SLC 500 I/O's and allow faults to be inserted."], "jumps": ["P2450", "P2400"]}, {"id": "P2450", "text": ["The PC1 and PC2 power switches control the application of DC power to the connector panels."], "jumps": ["P2460", "P2400"]}, {"id": "P2460", "text": ["The toggle switches apply 5, 12 and 24 VDC to PC1 and PC2."], "jumps": ["P2470", "P2400"]}, {"id": "P2470", "text": ["The +DC voltage select controls the +DC voltage applied to the experiment cards.", "12 V 5 V 24 V + DC Voltage Selectct"], "jumps": ["P2480", "P2400"]}, {"id": "P2480", "text": ["The rotary switch selects 5, 12 or 24 volts."], "jumps": ["P2490", "P2470"]}, {"id": "P2490", "text": ["The input connector allows external equipment to be connected to the trainer.", "12 V 5 V 24 V + DC Voltage Selectct"], "jumps": ["P2500", "P2470"]}, {"id": "P2500", "text": ["The connector is a bayonet (BNC) connector. Equipment like a signal generator is connected to the BNC."], "jumps": ["P2510", "P2490"]}, {"id": "P2510", "text": ["The output connector provides access to output signals from experiment cards at PC1."], "jumps": ["P2520", "P2490"]}, {"id": "P2520", "text": ["The output connector is a BNC connector like the input connector."], "jumps": ["P2530", "P2490"]}, {"id": "P2530", "text": ["PC power switches control the application of _______......."], "jumps": ["P2490"]}, {"id": "P2531", "text": [], "jumps": []}, {"id": "P2532", "text": ["The PC power switch does apply positive DC power, but that's not all."], "jumps": []}, {"id": "P2533", "text": ["The PC power switch does apply negative DC power, but that's not all."], "jumps": []}, {"id": "P2534", "text": ["The PC cards do not use AC power..........................."], "jumps": []}, {"id": "P2540", "text": ["If you cannot remember all the controls, switches and indicators, don't worry. The CAI lessons give you help on switch location and operation."], "jumps": ["P2910", "P2530"]}, {"id": "P2910", "text": ["This completes the information on CONTROLS AND INDICATORS.."], "jumps": ["P2001", "P2540"]}, {"id": "P2920", "text": ["1. The trainer is divided into two parts. The control and display panel and the PC card connector panel. Control and Display PC Card Connector Panel"], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2. The main power, DC power, monitor and process selector control power and lesson selection."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3. There are two PC positions, PC1 and PC2. Card Connector Panel"], "jumps": ["P2950", "P2920"]}, {"id": "P2950", "text": ["4. The PC power switches apply DC power to PC1 and PC2....", "12 V 5 V 24 V + DC Voltage Selectct"], "jumps": ["P2960", "P2920"]}, {"id": "P2960", "text": ["5. The +DC voltage select sets the +DC voltage applied to PC1 and PC2."], "jumps": ["P2999", "P2950"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2950"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3020", "text": ["Experiment cards simulate factory operator control stations and equipment processes."], "jumps": ["P3030", "P3001"]}, {"id": "P3030", "text": ["The trainer uses two experiment cards. PC1 uses the PC5050-1 Process Control card."], "jumps": ["P3020"]}, {"id": "P3040", "text": ["PC2 uses the PC5050-2 Heater Process card.................."], "jumps": ["P3020", "PQL"]}, {"id": "P3050", "text": ["The cards are constructed from fiberglass for strength and durability."], "jumps": ["P3040"]}, {"id": "P3060", "text": ["Handle the cards with care so that circuits and connector pins are not damaged."], "jumps": ["P3050"]}, {"id": "P3070", "text": ["By using receptacles on the experiment cards, trainer voltages and circuit connections are made by way of the PC connectors."], "jumps": ["P3050"]}, {"id": "P3080", "text": ["Remember, never insert or remove a PC card from the trainer when power is applied to the PC position."], "jumps": ["P3070"]}, {"id": "P3090", "text": ["The procedures are very simple for inserting and removing PC cards. Please follow the instructions to prevent bodily harm and pin breakage."], "jumps": ["P3070"]}, {"id": "P3100", "text": ["PC CARD INSERTION 1. Pick up PC5050-1 with both hands."], "jumps": ["P3090"]}, {"id": "P3110", "text": ["2. Align the PC5050-1 receptacles with the pins on PC1. periment Card Receptacles Test Console Connectors"], "jumps": ["P3100"]}, {"id": "P3120", "text": ["Be sure you keep the top edge of the PC card parallel with pins G through R. Keep the two sides of the card parallel with pins A through F and S through X."], "jumps": ["P3110"]}, {"id": "P3130", "text": ["3. Using firm even pressure from both hands, gently press PC5050-1 into place on the trainer."], "jumps": ["P3110"]}, {"id": "P3140", "text": ["The following steps show you the correct procedure for removing a PC card. Remember the power must be off.", "12 V 5 V 24 V + DC Voltage Selectct"], "jumps": ["P3150", "P3130"]}, {"id": "P3150", "text": ["1. Grasp PC5050-1 with both hands.........................", "12 V 5 V 24 V + DC Voltage Selectct"], "jumps": ["P3160", "P3140"]}, {"id": "P3160", "text": ["2. Gently rock PC5050-1 as you lift it from the PC connectors until the receptacles are clear of all trainer pins."], "jumps": ["P3910", "P3150"]}, {"id": "P3910", "text": ["This completes the information on EXPERIMENT CARDS........."], "jumps": ["P3001", "P3150"]}, {"id": "P3920", "text": ["1. Experiment cards simulate factory operator control stations and equipment processes."], "jumps": ["P3930", "P3001"]}, {"id": "P3930", "text": ["2. Never insert or remove PC cards with power applied to the PC position......."], "jumps": ["P3940", "P3920"]}, {"id": "P3940", "text": ["3. Always use two hands when inserting or removing a PC card from the trainer."], "jumps": ["P3999", "P3930"]}, {"id": "P3999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P3001", "P3930"]}, {"id": "P4001", "text": [], "jumps": []}, {"id": "P4020", "text": ["In this experiment you will learn how to set the trainer up to run an experiment. You will also correctly insert and remove a PC card."], "jumps": ["P4001"]}, {"id": "P4030", "text": ["The beginning and ending steps in this experiment are the procedures that you should follow each time you start and when you finish any of the experiments in this course."], "jumps": ["P4020"]}, {"id": "P4040", "text": ["1. Perform a visual inspection of the trainer............."], "jumps": ["P4020"]}, {"id": "P4050", "text": ["In step 1 you are looking for the obvious problems. Check: r bent or broken controls, switches, and connectors. * To see that all knobs are tight on their shafts and line up with their OFF positions. * Power cord for dents, nicks, or any other damage...", "* For bent or broken controls, switches, and connectors. * To see that all knobs are tight on their shafts and line up with their OFF positions. * Power cord for dents, nicks, or any other damage..."], "jumps": ["P4040"]}, {"id": "P4060", "text": ["If any defects are noted, contact your instructor."], "jumps": ["P4050"]}, {"id": "P4070", "text": ["2. Ensure that the trainer is plugged into the correct power source and connected to the computer."], "jumps": ["P4050"]}, {"id": "P4080", "text": ["If required, plug the Trainer into the correct power source and connect it to the computer."], "jumps": ["P4070"]}, {"id": "P4090", "text": ["You have just set up the Trainer to perform an experiment. Most lessons will not tell you to perform a visual inspection or to plug in the Trainer to a power source and to the external computer. You do it on your own..."], "jumps": ["P4070"]}, {"id": "P4100", "text": ["3. Place the PC5050-1 card in the PC1 position............"], "jumps": ["P4090", "P4105"]}, {"id": "P4105", "text": ["Align the connectors on the PC5050-1 card with the pins for the PC1 position on the Nida Model 5050 PLC trainer. Gently push down on the card."], "jumps": []}, {"id": "P4110", "text": ["4. Set the PLC trainer to the initial control settings. n Power ON DC Power ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFF", "Main Power DC Power Monitor Process Selector +DC Voltage Select PC1 & PC2 Power OFFOFF OFFOFFOFFFFFFFFFF", "ON ON ON OFF 5 V OFF OFFFF OFF OFF 5 V OFFFF 5 V OFF"], "jumps": ["P4100"]}, {"id": "P4115", "text": ["INITIAL CONTROL SETTING - Main Power ON, DC Power ON, Monitor ON, Process Selector OFF, +DC Voltage Select 5V, PC1 & PC2 Power OFF."], "jumps": []}, {"id": "P4120", "text": ["5. Set the PLC trainer controls as follows: C Voltage Select 24V PC1 Power ON", "+DC Voltage Select 24 V PC1 Power ONN"], "jumps": ["P4110", "P4125"]}, {"id": "P4125", "text": ["PLC TRAINER CONTROLS - Turn the +DC Voltage Select dial fully CW to the 24V position. Push the PC1 Power switch up to the ON position."], "jumps": []}, {"id": "P4130", "text": ["6. Set the PC5050-1 Process Control Card as follows: wer Switch ON Analog Control Switch ON", "Power Switch ON Analog Control Switch ONN"], "jumps": ["P4120", "P4135"]}, {"id": "P4135", "text": ["Set the Power switch to ON and the Analog Control switch to ON."], "jumps": []}, {"id": "P4140", "text": ["7. Watch the status lights on the PLC trainer and watch the LED's on the PC5050-1 card as you press and release the start button on the PC5050-1 card."], "jumps": ["P4130", "P4145"]}, {"id": "P4145", "text": ["Watch the status lights on the PLC trainer panel as you press and release the start button on the PC5050-1 card."], "jumps": ["P4140"]}, {"id": "P4146", "text": ["Watch the run and stop LED's as you press and release the start button."], "jumps": ["P4145"]}, {"id": "P4150", "text": ["8. Watch the status lights on the PLC trainer and watch the LED's on the PC5050-1 card as you press and release the stop button on the PC5050-1 card."], "jumps": ["P4140", "P4155"]}, {"id": "P4155", "text": ["Watch the status lights on the PLC trainer panel as you press and release the stop button on the PC5050-1 card."], "jumps": ["P4150"]}, {"id": "P4156", "text": ["Watch the run and stop LED's as you press and release the stop button."], "jumps": ["P4155"]}, {"id": "P4170", "text": ["9. Return the PLC trainer to the initial control settings. in Power ON DC Power ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFF", "Main Power DC Power Monitor Process Selector +DC Voltage Select PC1 & PC2 Power OFFOFF OFFOFFOFFFFFFFFFF", "ON ON ON OFF 5 V OFF OFFFF OFF OFF 5 V OFFFF 5 V OFF"], "jumps": ["P4150"]}, {"id": "P4180", "text": ["10. Turn OFF the PLC trainer's main power switch.........."], "jumps": ["P4170"]}, {"id": "P4190", "text": ["11. Return all PC cards and test equipment to their proper storage locations."], "jumps": ["P4200", "P4180"]}, {"id": "P4200", "text": ["Notice that the steps for ending the experiment are the same as starting except in reverse."], "jumps": ["P4210", "P4190"]}, {"id": "P4210", "text": ["This ensures that the Trainer is in an initial control setting. It is a good practice to always set the Trainer controls this way when not in use."], "jumps": ["P4910", "P4200"]}, {"id": "P4910", "text": ["This completes the experiment on PLC TRAINER FAMILIARIZATION."], "jumps": ["P4001", "P4210"]}, {"id": "P10001", "text": ["You have already attempt let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
