<script>
const book = {"title": "93958108", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: SEMICONDUCTOR MICROWAVE DEVICESfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe the basic theory of operation of Varactor Diodes, Tunnel Diodes, Gunn Diodes and DROs.......", "w Describe the limitations of Bipolar and Field Effect Transistors at microwave frequencies. w Describe methods to minimize limitations in Bipolar and Field Effect Transistors at microwave frequencies."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["This lesson introduces you to the types of semiconductor components used in microwave circuits."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["As in vacuum tubes, semiconductor devices also have limitations when operated in the microwave frequency range."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["However, as the technology of solid state devices improves, more and more microwave circuits are using semiconductor devices."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["With special manufacturing techniques and special types of semiconductors, conventional semiconductor limitations are reduced.", "With special manufacturing techniques and special types of semiconductors, conventional semiconductor limitations are reduced. ."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on SEMICONDUCTOR MICROWAVE DEVICES..................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Bipolar and Field Effect transistors are used in microwave circuits for the same purposes as conventional circuits."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["The transistors (bipolar and FET) operate the same in microwave circuits."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["However, there are characteristics in transistors that decrease the efficiency of the device as frequency increases."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Since microwaves are high frequency, these characteristics become increasingly important."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["The characteristics that limit a transistor's efficiency at microwave frequencies are:\n- Interelectrode Capacitance    - Lead Inductance    - Transit Time", "The characteristics that limit a transistor's efficiency at microwave frequencies are: - Interelectrode Capacitance - Lead Inductance - Transit Time"], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["Let's discuss interelectrode capacitance first.\n\n- Interelectrode Capacitance    - Lead Inductance    - Transit Time", "Let's discuss interelectrode capacitance first. - Interelectrode Capacitance - Lead Inductance - Transit Time"], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["As in vacuum tubes, the electrodes in a transistor act as the plates of a capacitor."], "jumps": ["P1090", "P1020"]}, {"id": "P1090", "text": ["This capacitance is very small; however at high frequencies, it can ground signals (Cce, Cbe) and cause feedback (Ccb)."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["For example, a 3.2 pF collector to emitter (or source to drain) capacitance at 1 kHz has an Xc of 50 MW.", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "CCC Gunn Diode DRO next. If there is absolutely no output signal present touch HELP. LP. HELP. input jack Black test Lead ............ COMM input jackput jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk"], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["At 1 GHz, the collector to emitter reactance is 50 ohms."], "jumps": ["P1120", "P1080"]}, {"id": "P1120", "text": ["In addition to the electrode's capacitance, the semiconductor's  PN junctions produce a capacitance.", "In addition to the electrode's capacitance, the semiconductor's PN junctions produce a capacitance."], "jumps": ["P1130", "P1080"]}, {"id": "P1130", "text": ["The capacitance depends on the width of the junction which in turn depends on the bias."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["The effects of interelectrode capacitance and PN junction capacitance are reduced by using small elements in the transistors."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["Using small values of bias voltage to decrease the PN junction size also reduces interelectrode capacitance."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["The second limiting characteristic is lead inductance.\n\n- Interelectrode Capacitance    - Lead Inductance    - Transit Time", "The second limiting characteristic is lead inductance. - Interelectrode Capacitance - Lead Inductance - Transit Time"], "jumps": ["P1170", "P1140"]}, {"id": "P1170", "text": ["As in vacuum tubes, lead inductance is caused by the conductors (leads) of the transistor acting as an inductor. This is due to the skin effect at high frequencies."], "jumps": ["P1180", "P1160", "P1175"]}, {"id": "P1175", "text": ["SKIN EFFECT - At high frequencies, current flows on the outer surfaces of a conductor only, not thru the wire."], "jumps": []}, {"id": "P1178", "text": ["The current flow actually circles the conductor, just like current flow through a coil.  This produces inductance.", "The current flow actually circles the conductor, just like current flow through a coil. This produces inductance.............."], "jumps": []}, {"id": "P1180", "text": ["This inductance is very small; however it can attenuate input and output signals at high frequencies."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["For example, a 3.2 mH base (or source) inductance at 1 kHz has an XL of .02 ohms.", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "LCC Gunn Diode DRO next. If there is absolutely no output signal present touch HELP. LP. HELP. input jack Black test Lead ............ COMM input jackput jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk"], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["At 1 GHz, the base reactance changes to 20 kW.", "At 1 GHz, the base reactance changes to 20 kW.s."], "jumps": ["P1210", "P1170"]}, {"id": "P1210", "text": ["The effects of lead inductance are reduced by making the leads as short as possible and by using special types of connectors."], "jumps": ["P1220", "P1170"]}, {"id": "P1220", "text": ["The last limiting characteristic is transit time.\n\n- Interelectrode Capacitance    - Lead Inductance    - Transit Time", "The last limiting characteristic is transit time. - Interelectrode Capacitance - Lead Inductance - Transit Time"], "jumps": ["P1230", "P1170"]}, {"id": "P1230", "text": ["Transit time is the time it takes for current carriers to travel through the elements."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["Transit time causes phase shifts between the input and output signals.  This is unacceptable in oscillators.", "Transit time causes phase shifts between the input and output signals. This is unacceptable in oscillators."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["Power losses are also caused and are unacceptable in amplifiers."], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["The major time delays encountered are:", "The major time delays encountered are:.....................", "- Charging time of emitter to base junction.....", "- Current carrier transit time thru to collector PN junction.....", "- Current carrier transit time thru the base....e.or PN junction."], "jumps": ["P1270", "P1230"]}, {"id": "P1270", "text": ["The emitter to base charging time is minimized by using interdigital finger construction."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["The area for current flow is determined by the length of the fingers.  The more area, more current flow, and less charging time.", "The area for current flow is determined by the length of the fingers. The more area, more current flow, and less charging time."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["Also, emitter to base capacitance is reduced by making the fingers as narrow as possible."], "jumps": ["P1300", "P1270"]}, {"id": "P1300", "text": ["Base transit time is reduced by making the base width as small as possible."], "jumps": ["P1310", "P1270"]}, {"id": "P1310", "text": ["Transit time through the base to collector PN junction is reduced by controlling the thickness of the junction using small bias voltages."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["Also, in Field Effect transistors only, gallium arsenide is used instead of silicon or germanium."], "jumps": ["P1330", "P1300", "P1325"]}, {"id": "P1325", "text": ["GALLIUM ARSENIDE - Gallium arsenide is another type of semiconductor material. A manufacturing process using gallium arsenide has not been developed for the bipolar transistor."], "jumps": []}, {"id": "P1330", "text": ["Gallium arsenide has higher ion mobility than silicon or germanium which reduces transit time."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["Which characteristic of a transistor can attenuate an input signal at high frequencies?"], "jumps": ["P1320"]}, {"id": "P1341", "text": [], "jumps": []}, {"id": "P1342", "text": ["Interelectrode capacitance causes feedback, Ccb, and can short signals to ground, Cbe and Cce."], "jumps": []}, {"id": "P1343", "text": ["Transit time causes phase shifts and low output power.", "Transit time causes phase shifts and low output power......"], "jumps": []}, {"id": "P1350", "text": ["Transit time is reduced by using interdigital fingers, _______", "Transit time is reduced by using interdigital fingers, _______.ital fingers _______.", "increasing Vcc, and making the base thinner.rrd making the base thinner..", "and increasing Vcc.fingers and increasing Vcc.", "and making the base thinner.rd making the base thinner."], "jumps": ["P1340"]}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1352", "text": ["Increasing Vcc increases bias which increases the PN junction and increases transit time.", "Increasing Vcc increases bias which increases the PN junction and increases transit time..e...reases transit time."], "jumps": []}, {"id": "P1360", "text": ["How does using gallium arsenide reduce transit time?", "How does using gallium arsenide reduce transit time?......."], "jumps": ["P1350"]}, {"id": "P1361", "text": [], "jumps": []}, {"id": "P1362", "text": ["The thickness of the base does not depend on the type of material used, only the manufacturing process."], "jumps": []}, {"id": "P1363", "text": ["The level of Vcc does not depend on the type of material used."], "jumps": ["P20"]}, {"id": "P1910", "text": ["This completes the information on TRANSISTORS AND FETs.", "This completes the information on TRANSISTORS AND FETs....."], "jumps": ["P1360"]}, {"id": "P1920", "text": ["1.  The three characteristics that limit transistor efficiency are:", "1. The three characteristics that limit transistor efficiency are:", "- Interelectrode Capacitance - Lead Inductance - Transit Time"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Interelectrode capacitance is caused by the elements in a               transistor acting as the plates of a capacitor.", "2. Interelectrode capacitance is caused by the elements in a transistor acting as the plates of a capacitor."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Interelectrode capacitance is reduced by decreasing the                 element's size and using low values of Vcc.", "3. Interelectrode capacitance is reduced by decreasing the element's size and using low values of Vcc."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  Lead inductance is caused by skin effects that occur at high          frequencies.", "4. Lead inductance is caused by skin effects that occur at high frequencies.", "Current flow thru wire at high frequencies"], "jumps": ["P1960", "P1930"]}, {"id": "P1960", "text": ["5.  Lead inductance is reduced by using short leads and special        purpose connectors.", "5. Lead inductance is reduced by using short leads and special purpose connectors."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  Transit time is the time for current carriers to travel through an      element.", "6. Transit time is the time for current carriers to travel through an element.", "- Charging time of emitter to base junction.....", "- Current carrier transit time thru to collector PN junction.....", "- Current carrier transit time thru the base....e.or PN junction."], "jumps": ["P1980", "P1950"]}, {"id": "P1980", "text": ["7.  Transit time is reduced by using interdigital fingers, small               elements, and low values of Vcc.", "7. Transit time is reduced by using interdigital fingers, small elements, and low values of Vcc."], "jumps": ["P1999", "P1970"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1980"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["Along with Bipolar and Field Effect transistors, special types of semiconductor devices have been developed for microwave application.", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "Varactor Diode Tunnel Diode Gunn Diode DRO next. If there is absolutely no output signal present touch HELP. LP. HELP. input jack Black test Lead ............ COMM input jackput jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk"], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["Let's start with the varactor diode.", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "Varactor Diode Tunnel Diode Gunn Diode DRO next. If there is absolutely no output signal present touch HELP. LP. HELP. input jack Black test Lead ............ COMM input jackput jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk"], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["Varactor diodes are used as microwave amplifiers and oscillators.  Remember, an amplifier can be changed into an oscillator by adding feedback.", "Varactor diodes are used as microwave amplifiers and oscillators. Remember, an amplifier can be changed into an oscillator by adding feedback."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["Varactors operate identical to conventional diodes except the PN junction capacitance is used to produce amplification."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["The small capacitance formed by the PN junction produces a significant reactance at microwave frequencies."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["Note that at frequencies below the microwave range, the PN junction capacitance has no effect."], "jumps": ["P2080", "P2050"]}, {"id": "P2080", "text": ["Changing the reverse bias level changes the capacitance of the PN junction, which changes Xc.", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "CCC Gunn Diode DRO next. If there is absolutely no output signal present touch HELP. LP. HELP. input jack Black test Lead ............ COMM input jackput jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk"], "jumps": ["P2090", "P2050"]}, {"id": "P2090", "text": ["The effect is that a small change in reverse bias voltage, input, has a large change in reverse current flow, output."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["The varactor uses a change in reactance to amplify.  Remember the transistor uses resistance changes.", "The varactor uses a change in reactance to amplify. Remember the transistor uses resistance changes."], "jumps": ["P2110", "P2080"]}, {"id": "P2110", "text": ["The next special microwave semiconductor device is the tunnel diode.", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "Varactor Diode Tunnel Diode Gunn Diode DRO next. If there is absolutely no output signal present touch HELP. LP. HELP. input jack Black test Lead ............ COMM input jackput jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk"], "jumps": ["P2120", "P2080"]}, {"id": "P2120", "text": ["The tunnel diode is a diode that operates as an amplifier or oscillator at microwave frequencies."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["Tunnel diodes are PN junction devices with a very high concentration of impurities in both the P and N regions."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["The high concentration of impurities produces a thin PN junction barrier that causes tunnel diodes to operate differently than conventional diodes."], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["Recall that a conventional diode, when forward biased, produces a linear raise in current flow after the barrier potential voltage has been exceeded."], "jumps": ["P2160", "P2130"]}, {"id": "P2160", "text": ["Tunnel diodes have a sharp increase in current flow followed by a non-linear decrease in current flow before the barrier potential voltage is reached."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["The flow is due to the thin PN junction.  Electrons \"tunnel\" through the junction barrier causing current.", "The flow is due to the thin PN junction. Electrons \"tunnel\" through the junction barrier causing current."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["From points A to B, the tunneling increases causing current to increase."], "jumps": ["P2190", "P2160"]}, {"id": "P2190", "text": ["From points B to C, the tunneling decreases causing current to decrease."], "jumps": ["P2200", "P2160"]}, {"id": "P2200", "text": ["After the barrier potential voltage is reached, the tunnel diode operates as a conventional diode with a linear change in current flow."], "jumps": ["P2210", "P2160"]}, {"id": "P2210", "text": ["It is the area between points B and C, which is non-linear, that gives the tunnel diode amplification properties."], "jumps": ["P2220", "P2160"]}, {"id": "P2220", "text": ["Biasing a tunnel diode between points B and C allows a small change in bias voltage, input, to produce a large change in current flow, output."], "jumps": ["P2230", "P2160"]}, {"id": "P2230", "text": ["Also note that as voltage increases, current decreases.  This action produces what is called negative resistance in the area between points B and C.", "Also note that as voltage increases, current decreases. This action produces what is called negative resistance in the area between points B and C."], "jumps": ["P2240", "P2160"]}, {"id": "P2240", "text": ["The next special microwave semiconductor device is the Gunn diode.", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "Varactor Diode Tunnel Diode Gunn Diode DRO next. If there is absolutely no output signal present touch HELP. LP. HELP. input jack Black test Lead ............ COMM input jackput jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk"], "jumps": ["P2250", "P2160"]}, {"id": "P2250", "text": ["Gunn diodes are used as microwave amplifiers and oscillators."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["Gunn diodes are not actually diodes.  They consist of one element, of N type material.", "Gunn diodes are not actually diodes. They consist of one element, of N type material.rial."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["A more appropriate name for a Gunn diode is a transfer electron device.  Let's see why.", "A more appropriate name for a Gunn diode is a transfer electron device. Let's see why.."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["Placing a voltage across N type material you would expect current to flow at a linear rate as voltage is increased."], "jumps": ["P2290", "P2260"]}, {"id": "P2290", "text": ["However, this is not the case when the semiconductor material is gallium arsenide. Indium phosphide, cadmium telluride, and indium arsenide can also be used."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["A small bias voltage produces an increase in current flow.  The electrons move from the negative potential to the positive potential.", "A small bias voltage produces an increase in current flow. The electrons move from the negative potential to the positive potential."], "jumps": ["P2310", "P2280"]}, {"id": "P2310", "text": ["The voltage applied gives the electrons energy to move through the material."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["Increasing the bias voltage further decreases current flow."], "jumps": ["P2330", "P2300"]}, {"id": "P2330", "text": ["The increase in voltage gives the electrons enough energy to move to a higher orbit in the atoms, they no longer move through the material."], "jumps": ["P2340", "P2300"]}, {"id": "P2340", "text": ["The electrons are transferred from one orbit to another, hence transfer electron device.", "The electrons are transferred from one orbit to another, hence transfer electron device.."], "jumps": ["P2350", "P2300"]}, {"id": "P2350", "text": ["Now, when the bias voltage is increased still further, current flow resumes."], "jumps": ["P2360", "P2300"]}, {"id": "P2360", "text": ["The additional energy, which is no longer required to transfer electrons, causes the electrons to move through the material again."], "jumps": ["P2370", "P2300"]}, {"id": "P2370", "text": ["Notice that there is an area of negative resistance as in the tunnel diode.", "Notice that there is an area of negative resistance as in the tunnel diode. diode."], "jumps": ["P2380", "P2300"]}, {"id": "P2380", "text": ["Biasing the piece of N type gallium arsenide in the center of this region produces amplification."], "jumps": ["P2390", "P2370"]}, {"id": "P2390", "text": ["The last semiconductor microwave device is the DRO.", "The last semiconductor microwave device is the DRO.........", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "Varactor Diode Tunnel Diode Gunn Diode DRO next. If there is absolutely no output signal present touch HELP. LP. HELP. input jack Black test Lead ............ COMM input jackput jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk"], "jumps": ["P2400", "P2370"]}, {"id": "P2400", "text": ["A DRO is what you used to generate the microwave frequency in the Nida Model 330 Microwave Trainer."], "jumps": ["P2410", "P2390"]}, {"id": "P2410", "text": ["It is a Dielectric Resonant Oscillator that contains an oscillator and mixer."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["The DRO centers around a microwave FET built onto a microwave strip line, conductor, in a cavity."], "jumps": ["P2430", "P2400"]}, {"id": "P2430", "text": ["A dielectric resonator, a piece of dielectric material that acts as a cavity resonator for the FET, is placed across two of the FET's strip lines."], "jumps": ["P2440", "P2420"]}, {"id": "P2440", "text": ["The dielectric resonator forces the FET to oscillate at its natural frequency, which is largely dependent on the physical size."], "jumps": ["P2460", "P2420"]}, {"id": "P2460", "text": ["Also, the distance between the cavity and the dielectric resonator have an effect on the resonant frequency."], "jumps": ["P2470", "P2420"]}, {"id": "P2470", "text": ["The benefits of this effect are attained by placing an adjustable disc above the resonator, enabling frequency tuning up to 1 GHz."], "jumps": ["P2480", "P2420"]}, {"id": "P2480", "text": ["Frequency modulation (\u00b13 MHz) can be accomplished by varying the operating voltage.", "3 MHz) can be accomplished by varying the operating voltage."], "jumps": ["P2490", "P2420"]}, {"id": "P2490", "text": ["Also, frequency modulation can be accomplished by varying the intensity of an infrared emitting diode (IRED)."], "jumps": ["P2500", "P2420"]}, {"id": "P2500", "text": ["The FET is sensitive to infrared light.  When placing an IRED close to the FET, an AC input signal frequency modulates the oscillator's base frequency.", "The FET is sensitive to infrared light. When placing an IRED close to the FET, an AC input signal frequency modulates the oscillator's base frequency."], "jumps": ["P2510", "P2420"]}, {"id": "P2510", "text": ["The output of the oscillator mixer is then fed to the waveguide."], "jumps": ["P2520", "P2420"]}, {"id": "P2520", "text": ["Which type of semiconductor device uses the capacitance of the PN junction to produce microwaves?"], "jumps": ["P2420"]}, {"id": "P2521", "text": [], "jumps": []}, {"id": "P2522", "text": ["Tunnel diodes use the negative resistance caused by electrons tunneling through the PN junction to produce microwaves."], "jumps": []}, {"id": "P2523", "text": ["Gunn diodes use the transfer electron effect to produce microwaves."], "jumps": []}, {"id": "P2530", "text": ["Which type of microwave generating device uses the transfer electron effect?"], "jumps": ["P2520"]}, {"id": "P2531", "text": [], "jumps": []}, {"id": "P2532", "text": ["The varactor uses capacitance in the PN junction to generate microwaves."], "jumps": []}, {"id": "P2533", "text": ["Tunnel diodes use the negative resistance caused by electrons tunneling through the PN junction to produce microwaves."], "jumps": []}, {"id": "P2540", "text": ["What type of semiconductor device does a DRO use?", "What type of semiconductor device does a DRO use?.... let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
