s hearing ability.", "A Technician uses known input signals to check a circuits ability to operate.........."], "jumps": []}, {"id": "P450", "text": ["Let's begin the lesson on INTRODUCTION TO THE FUNCTION GENERATOR............"], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": ["Function Generators are part of a large group of tools called Electronic Test Equipment............"], "jumps": []}, {"id": "P1025", "text": ["ELECTRONIC TEST EQUIPMENT - Electronic test equipment is designed to measure or test specific functions in electronic circuits. A few types of test equipment are:", "Test Equipment Function Tested Function Generator AC Circuits Frequency Counter Frequency Oscilloscope Voltage, Frequency Multimeter E, I, and RRRR"], "jumps": []}, {"id": "P1030", "text": ["The function generator is a tool used to produce accurate AC signals. signals."], "jumps": []}, {"id": "P1040", "text": ["These AC signals are then used as inputs to circuits. With a known input, circuit values can be calculated, measured, and checked."], "jumps": []}, {"id": "P1050", "text": ["A display is used to indicate the frequency of the output signal."], "jumps": []}, {"id": "P1060", "text": ["Controls and switches are used to select and modify the output signal."], "jumps": []}, {"id": "P1070", "text": ["The function generator produces these types of waveforms: - Square - Triangle - Ramp - Pulse --------------", "Sine - Square - Triangle - Ramp - Pulse --"], "jumps": []}, {"id": "P1080", "text": ["The frequency of the chosen output signal is adjustable from less than 1 Hz to tens of MHz. ..Hz 1 kHz 1 MHzzzzzzzzzzzzzzzz", "1 Hz 1 kHz 1 MHz Ramp - Pulse --"], "jumps": []}, {"id": "P1090", "text": ["The amplitude of the output signal is adjustable from less than 1 mVpp to 10 Vpp. .05 Vpp 5 Vpp 5 mVpp", ".05 Vpp 5 Vpp 5 mVpp mp - Pulse --"], "jumps": []}, {"id": "P1100", "text": ["The amount of DC voltage added to the AC waveform is adjustable up to +10 volts.", ".05 Vpp 5 Vpp 5 mVpp mp - Pulse --"], "jumps": []}, {"id": "P1110", "text": ["The symmetry of the output signal is adjustable. on-Symmetrical Symmetrical Non-Symmetrical", "Non-Symmetrical Symmetrical Non-Symmetricaltrical Non-Symmetrical Pulse --"], "jumps": []}, {"id": "P1115", "text": ["SYMMETRY - Symmetry is an exact correspondence between the opposite halves of a figure or pattern. Half of something is the mirror image of the other half. This sine wave is symmetrical. The negative half is the mirror image of the positive half.", "Non-Symmetrical Symmetrical Non-Symmetricaltrical Non-Symmetrical Pulse --", "The symmetry of the output signal is adjustable. on-Symmetrical Symmetrical Non-Symmetrical"], "jumps": []}, {"id": "P1120", "text": ["The output signal can also be modulated. put Signal Modulating Signal Output Signal Amplitude - Frequency -", "Input Signal Modulating Signal Output Signal Amplitude - Frequency ------- Pulse --", "AM or FM modulation using sine, square, or triangle signals are available. Input Signal Modulating Signal Output Signal Amplitude - Frequency -"], "jumps": []}, {"id": "P1135", "text": ["MODULATED - The term modulate means to change or regulate the intensity, pitch, amplitude, frequency, or tone. A low frequency signal is often used to modulate the output signal (modulating signal). The high frequency signal is called the carrier. Radio and television use modulated signals...", "The output signal can also be modulated. put Signal Modulating Signal Output Signal Amplitude - Frequency -", "Input Signal Modulating Signal Output Signal Amplitude - Frequency ------- Pulse --"], "jumps": []}, {"id": "P1140", "text": ["AM or FM modulation using sine, square, or triangle signals are available. Input Signal Modulating Signal Output Signal Amplitude - Frequency -", "Input Signal Modulating Signal Output Signal Amplitude - Frequency ------- Pulse --"], "jumps": []}, {"id": "P1145", "text": ["AM - AM is the abbreviation for Amplitude Modulation. The amplitude of the carrier signal is changed using a low frequency modulating signal. AM radio uses amplitude modulation. Input Signal + Modulating Signal = Output Signal", "Input Signal + Modulating = Output Signal"], "jumps": []}, {"id": "P1147", "text": ["FM - FM is the abbreviation for Frequency Modulation. The frequency of the carrier signal is changed by the low frequency modulating signal. FM radio uses frequency modulation. nput Signal + Modulating Signal = Output Signalllllllllllllllllllllllllllllllllllllllllll", "Input Signal + Modulating = Output Signal"], "jumps": []}, {"id": "P1150", "text": ["What is a function generator used for?....................."], "jumps": []}, {"id": "P1151", "text": ["An oscilloscope is used to measure signals, not a Function Generator. eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee Circuit Oscilloscopeion Generator Circuit Oscilloscopeeeeeeeeeeeeeeeeeeeeeeeeeeee"], "jumps": []}, {"id": "P1910", "text": ["This completes the information on THE FUNCTION GENERATOR.", "1. Function Generators are used to produce AC signals. Start second line here."], "jumps": []}, {"id": "P1930", "text": ["2. Function Generators produce: Square - Triangle - Ramp - Pluse -------", "Sine - Square - Triangle - Ramp - Pulse --"], "jumps": []}, {"id": "P1940", "text": ["3. Frequency and amplitude of the output signal is adjustable. Hz 1 kHz 1 MHz", "1 Hz 1 kHz 1 MHz Ramp - Pulse --"], "jumps": []}, {"id": "P1950", "text": [".05 Vpp 5 Vpp 5 mVpp mp - Pulse --", "3. Frequency and amplitude of the output signal is adjustable. Hz 1 kHz 1 MHz"], "jumps": []}, {"id": "P1960", "text": ["4. DC offset and symmetry of the output waveform is adjustable. Non-Symmetrical Symmetrical Non-Symmetrical", "Non-Symmetrical Symmetrical Non-Symmetricaltrical Non-Symmetrical Pulse --"], "jumps": []}, {"id": "P1970", "text": ["5. The output waveform can be modulated. nput Signal Modulating Signal Output Signal Amplitude - Frequency", "Input Signal Modulating Signal Output Signal Amplitude - Frequency ------- Pulse --"], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": []}, {"id": "P2001", "text": ["Function Generators have two major sections: equency Modulation"], "jumps": []}, {"id": "P2030", "text": ["Let's start with the frequency section. Frequency Modulation", "The frequency section selects the type of signal, frequency, amplitude, DC offset, and symmetry of the output."], "jumps": []}, {"id": "P2050", "text": ["This section consists of the function, range, and amplitude controls. There are two outputs and one input. isplay Range Frequency Section Function Frequency Amplitude Power DC Offset Symmetry Display Controls Input (EXT CNT) Outputs Trigger Phaseeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"], "jumps": []}, {"id": "P2060", "text": ["The FUNCTION switches select the type of signal output: sine, square, and triangle. e."], "jumps": []}, {"id": "P2070", "text": ["The symmetry control changes the waveform. For example, a triangle wave can be changed to a ramp or the square wave to a pulse."], "jumps": []}, {"id": "P2080", "text": ["The RANGE switches are used as multipliers for the FREQUENCY dial. The range is from .1 Hz to 1 MHz."], "jumps": []}, {"id": "P2090", "text": ["The FREQUENCY dial varies the frequency output from .1 to 13. The value on the frequency dial is multiplied by the range switch to determine frequency. The RANGE switches are used as multipliers for the FREQUENCY dial. The range is from .1 Hz to 1 MHz."], "jumps": []}, {"id": "P2100", "text": ["The DISPLAY indicates the frequency in kHz. It is a frequency counter. counter."], "jumps": []}, {"id": "P2110", "text": ["The GATE SELECT changes the time that the display is updated and the position of the decimal point on the display."], "jumps": []}, {"id": "P2120", "text": ["The INT/EXT (internal/external) selects which frequency is displayed..ayed........." let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
