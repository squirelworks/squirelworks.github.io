const book = {"title": "9395T803", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: REGISTERS AND MEMORYsdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P13064", "text": ["6.  Press Enter to set: PC2 DC Power Switch - ON", "6. Press Enter to set: PC2 DC Power Switch - ON..........................."], "jumps": []}, {"id": "P13040", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings..........", "ne the types of external memory. w Explain the connections and control of memory in the 68000 microprocessor.", "w Observe the contents of registers in the 68000. w Observe the contents of external memory to the 68000.........", "w Define the purpose and usage of the internal registers. w Understand the operation of the user and supervisor stacks."], "jumps": ["P13020"]}, {"id": "P301", "text": [], "jumps": []}, {"id": "P13100", "text": ["9.  Press the DISPLAY R.M./RECALL key on the 68000 keyboard.       After pressing the key, a small menu should be displayed.               The menu shows the different functions you can select.", "9. Press the DISPLAY R.M./RECALL key on the 68000 keyboard. After pressing the key, a small menu should be displayed. The menu shows the different functions you can select.", "1 - Display Registers 2 - Display Memory Enter Choice:______"], "jumps": ["P13110", "P13090"]}, {"id": "P13066", "text": ["7.  Press Enter to set: PC1 DC Power Switch - ON", "7. Press Enter to set: PC1 DC Power Switch - ON..........................."], "jumps": []}, {"id": "P341", "text": [], "jumps": []}, {"id": "P342", "text": [], "jumps": []}, {"id": "P343", "text": [], "jumps": []}, {"id": "P400", "text": ["A microprocessor without registers or memory would be similar to a car without wheels; it just couldn't do anything.  Registers give the microprocessor the ability to temporarily store, retrieve and manipulate data as the need arrives.", "A microprocessor without registers or memory would be similar to a car without wheels; it just couldn't do anything. Registers give the microprocessor the ability to temporarily store, retrieve and manipulate data as the need arrives."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["All microprocessors have some amount of internal registers.  The more numerous and specialized the registers are, the more efficiently the microprocessor can operate.", "Memory enhances a microprocessor's efficiency by providing a large capacity storage area.  The more memory that a processor has to source data from, the faster its operations can be.", "All microprocessors have some amount of internal registers. The more numerous and specialized the registers are, the more efficiently the microprocessor can operate.", "Memory enhances a microprocessor's efficiency by providing a large capacity storage area. The more memory that a processor has to source data from, the faster its operations can be."], "jumps": ["P420", "P400", "P430"]}, {"id": "P430", "text": ["Most programs today are large and cumbersome.  If the amount of memory available cannot store the entire program, the CPU must stop execution while more data is sourced from a hard drive, floppy disk or other storage device.  This, of course, slows down the processor.", "Most programs today are large and cumbersome. If the amount of memory available cannot store the entire program, the CPU must stop execution while more data is sourced from a hard drive, floppy disk or other storage device. This, of course, slows down the processor."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["The uses, types and benefits of registers and memory will become clear as you progress through this lesson.", "Rom? Address? Register Instructions? Ram? Stack? Program Counter? Stack...."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["Let's begin the lesson on REGISTERS AND MEMORY............................"], "jumps": ["P440"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["An internal register is a memory location inside the microprocessor used to temporarily store data the CPU may be working with.  There are many registers within the 68000, however, only certain numbers are available to the programmer. The chart below lists the 19 registers we will discuss.", "An internal register is a memory location inside the microprocessor used to temporarily store data the CPU may be working with. There are many registers within the 68000, however, only certain numbers are available to the programmer. The chart below lists the 19 registers we will discuss."], "jumps": ["P1030", "P1001", "PC"]}, {"id": "P1030", "text": ["The registers inside the 68000 are used for a variety of purposes. The address and data registers work like a scratch pad. Data from memory is placed in the registers and can then be evaluated by the microprocessor. Compared to external memory, all operations performed on internal registers are very fast."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The address registers are 32-bit memory locations used to store address values.  The values can be used to \"point\" to locations in memory.  There are nine address registers in the 68000: A0 through A6 and two additional registers accessed through A7.", "The address registers are 32-bit memory locations used to store address values. The values can be used to \"point\" to locations in memory. There are nine address registers in the 68000: A0 through A6 and two additional registers accessed through A7."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Addresses are important because instructions use their contents to access external memory or I/O ports.  These registers can store either word or longword length address values.", "Addresses are important because instructions use their contents to access external memory or I/O ports. These registers can store either word or longword length address values."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["The first 7 registers, A0-A6, are general purpose address registers, normally used to store address values needed to perform instructions.  These registers are accessed in either user or supervisor modes.", "The first 7 registers, A0-A6, are general purpose address registers, normally used to store address values needed to perform instructions. These registers are accessed in either user or supervisor modes."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["The last two registers are stack pointers and are accessed through A7.  In the supervisor mode, A7 is the supervisor stack pointer.  In the user mode A7 becomes the user stack pointer. They are actually two separate registers but they are both A7 by name.  Mode determines which register is accessed.", "The last two registers are stack pointers and are accessed through A7. In the supervisor mode, A7 is the supervisor stack pointer. In the user mode A7 becomes the user stack pointer. They are actually two separate registers but they are both A7 by name. Mode determines which register is accessed."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["The two stack pointers require two independent stacks.  The benefit here is that the supervisor stack remains unchanged in the user mode and vice-versa.  The operation and purpose of the stack will be discussed later in this lesson.", "The two stack pointers require two independent stacks. The benefit here is that the supervisor stack remains unchanged in the user mode and vice-versa. The operation and purpose of the stack will be discussed later in this lesson."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["Data registers are 32-bit memory locations used to store various sized portions of data.  The data is used by instructions for multiple purposes.  The eight internal data registers in the 68000 are shown below.", "Data registers are 32-bit memory locations used to store various sized portions of data. The data is used by instructions for multiple purposes. The eight internal data registers in the 68000 are shown below."], "jumps": ["P1100", "P1060", "PC"]}, {"id": "P1100", "text": ["Data registers are important because certain instructions require that some of the values being worked will be in one or more of the registers.  The primary advantage to the data registers is speed.  It takes much longer for the CPU to access data from external memory.", "Data registers are important because certain instructions require that some of the values being worked will be in one or more of the registers. The primary advantage to the data registers is speed. It takes much longer for the CPU to access data from external memory."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["The data registers can store byte, word, or longword sized data. Knowing the size of the data you store is important.  If you stored two byte size values in two registers and subtracted them using the word version of the subtract instruction, eight extra bits would be subtracted!  The result, of course, would be wrong.", "The data registers can store byte, word, or longword sized data. Knowing the size of the data you store is important. If you stored two byte size values in two registers and subtracted them using the word version of the subtract instruction, eight extra bits would be subtracted! The result, of course, would be wrong."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["The program counter (PC) is a 32-bit register that holds the address value of the next instruction to be performed.  The program counters use only longword data.  While a program is being executed, the program counter is automatically incremented to the new instruction by the CPU.", "The program counter (PC) is a 32-bit register that holds the address value of the next instruction to be performed. The program counters use only longword data. While a program is being executed, the program counter is automatically incremented to the new instruction by the CPU."], "jumps": ["P1130", "P1100", "PC"]}, {"id": "P1130", "text": ["The process of incrementing the program counter occurs during the time that the previous instruction is being executed.  This eliminates any delay that the CPU would otherwise have.", "The process of incrementing the program counter occurs during the time that the previous instruction is being executed. This eliminates any delay that the CPU would otherwise have."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["Interrupts change the value of the program counter to a program location associated with the interrupt.  When an interrupt is called, the current program counter value is stored on the stack. The interrupt vector value is loaded into the PC and the CPU begins evaluation of this new program at the new address.", "Interrupts change the value of the program counter to a program location associated with the interrupt. When an interrupt is called, the current program counter value is stored on the stack. The interrupt vector value is loaded into the PC and the CPU begins evaluation of this new program at the new address."], "jumps": ["P1150", "P1130", "P1145"]}, {"id": "P1141", "text": ["Interrupts change the value of the program counter to a program location associated with the interrupt.  When an interrupt is called, the current program counter value is stored on the stack. The interrupt vector value is loaded into the PC and the CPU begins evaluation of this new program at the new address.", "Interrupts change the value of the program counter to a program location associated with the interrupt. When an interrupt is called, the current program counter value is stored on the stack. The interrupt vector value is loaded into the PC and the CPU begins evaluation of this new program at the new address."], "jumps": ["P1150", "P1130", "P1145"]}, {"id": "P1145", "text": ["The stack is a block of external memory used for short term storage. Stack operations will be discussed in detail later in this lesson."], "jumps": []}, {"id": "P1150", "text": ["When the program finishes, the CPU loads the original program counter value from the stack and begins executing the original program where it left off before the interrupt.  When the CPU looks at the address that the PC is pointing to, it loads the instruction at that address into the instruction register.", "When the program finishes, the CPU loads the original program counter value from the stack and begins executing the original program where it left off before the interrupt. When the CPU looks at the address that the PC is pointing to, it loads the instruction at that address into the instruction register."], "jumps": ["P1160", "P1141"]}, {"id": "P1160", "text": ["The CPU then evaluates the instruction. Instructions must always be loaded into the instruction register before they can be evaluated.  The instruction register was not shown on the list of internal registers in the 68000 because it is not user-loadable.", "The CPU then evaluates the instruction. Instructions must always be loaded into the instruction register before they can be evaluated. The instruction register was not shown on the list of internal registers in the 68000 because it is not user-loadable."], "jumps": ["P1170", "P1141"]}, {"id": "P1170", "text": ["Don't forget that while the CPU is evaluating an instruction, it is also incrementing the program counter.  The number of  increments required depends on the data following the instruction currently being evaluated.", "Don't forget that while the CPU is evaluating an instruction, it is also incrementing the program counter. The number of increments required depends on the data following the instruction currently being evaluated."], "jumps": ["P1180", "P1141"]}, {"id": "P1180", "text": ["The status register is a 16-bit register that provides the status of the CPU and the results of the last executed instruction. Although the register is 16-bits long, only 10-bits are actually used.  The status register is illustrated below, note bits 14, 12, 11, 7, 6, and 5 are blank.  They are the unused bits.", "The status register is a 16-bit register that provides the status of the CPU and the results of the last executed instruction. Although the register is 16-bits long, only 10-bits are actually used. The status register is illustrated below, note bits 14, 12, 11, 7, 6, and 5 are blank. They are the unused bits.", "S M u o p d e e r v i s o r", "I M n a t s e k r r u p t"], "jumps": ["P1190", "P1141"]}, {"id": "P1190", "text": ["Some microprocessor systems refer to the status register as a flag register because the bits stored in the register act as flags to inform the CPU that particular conditions exist or do not exist."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["The high 8 bits of the register are known as the system byte. Within the system byte there are five used bits.  Bit 15 (T) is known as the Trace Mode bit.  The Trace Mode bit is used for  debugging software running on the 68000.  When the Trace Mode bit is high, Trace Mode is active.", "The high 8 bits of the register are known as the system byte. Within the system byte there are five used bits. Bit 15 (T) is known as the Trace Mode bit. The Trace Mode bit is used for debugging software running on the 68000. When the Trace Mode bit is high, Trace Mode is active."], "jumps": ["P1210", "P1180"]}, {"id": "P1201", "text": ["The high 8 bits of the register are known as the system byte.  Within the system byte there are five used bits.  Bit 15 (T) is known as the Trace Mode bit.  The Trace Mode bit is used for  debugging software running on the 68000.  When the Trace Mode bit is high, Trace Mode is active.", "The high 8 bits of the register are known as the system byte. Within the system byte there are five used bits. Bit 15 (T) is known as the Trace Mode bit. The Trace Mode bit is used for debugging software running on the 68000. When the Trace Mode bit is high, Trace Mode is active.", "S M u o p d e e r v i s o r", "I M n a t s e k r r u p t"], "jumps": ["P1210", "P1180"]}, {"id": "P1205", "text": ["DEBUGGING - Debugging is a term used to describe the process of finding and correcting or eliminating sections of programs that are not working properly. The word \"bug\" refers to a fault in the program causing problems."], "jumps": []}, {"id": "P1210", "text": ["Bit 13 (S) is the Supervisor Mode bit. It is used to set the mode of the processor.  When the bit is set to high, the processor is in the supervisor mode.  When the bit is low, the system is in the user     mode.", "Bit 13 (S) is the Supervisor Mode bit. It is used to set the mode of the processor. When the bit is set to high, the processor is in the supervisor mode. When the bit is low, the system is in the user mode."], "jumps": ["P1220", "P1201"]}, {"id": "P1220", "text": ["The last three bits of the system byte, 10, 9 and 8, are the Interrupt Mask bits (I  , I  , and I  ).  The interrupt mask bits are used to turn off the operation of certain interrupts.  Masking is a term used to describe the process of both isolating or hiding individual bits of data.", "The last three bits of the system byte, 10, 9 and 8, are the Interrupt Mask bits (I , I , and I ). The interrupt mask bits are used to turn off the operation of certain interrupts. Masking is a term used to describe the process of both isolating or hiding individual bits of data."], "jumps": ["P1230", "P1201"]}, {"id": "P1230", "text": ["The process of isolating individual bits is important when changing bits in the status register.  In the experiment portion of this lesson you will learn how to mask bits through the use of the processors logic functions.", "The process of isolating individual bits is important when changing bits in the status register. In the experiment portion of this lesson you will learn how to mask bits through the use of the processors logic functions."], "jumps": ["P1240", "P1201"]}, {"id": "P1240", "text": ["The second type of masking (hiding bits) refers to the operation of the Interrupt Masks.  Setting one or more of the Interrupt Mask bits disables certain interrupts in the system.  The only interrupt that cannot be turned off is interrupt condition 7.", "The second type of masking (hiding bits) refers to the operation of the Interrupt Masks. Setting one or more of the Interrupt Mask bits disables certain interrupts in the system. The only interrupt that cannot be turned off is interrupt condition 7."], "jumps": ["P1250", "P1201"]}, {"id": "P1250", "text": ["Interrupts are disabled by the number value represented by the Interrupt Mask bits.  In other words, placing 011 (3 in decimal) in\nI  , I  , and I   results in 1 and 0 being disabled, while 2 is enabled.  All zeros (000) enables all interrupts.", "Interrupts are disabled by the number value represented by the Interrupt Mask bits. In other words, placing 011 (3 in decimal) in I , I , and I results in 1 and 0 being disabled, while 2 is enabled. All zeros (000) enables all interrupts."], "jumps": ["P1260", "P1201"]}, {"id": "P1260", "text": ["The lower 8 bits of the status register is known as the user byte.  Only the first five bits (0-4) are used, bits 5, 6 and 7 are inactive.  It should be known that all unused bits in the status register are kept at a logic low level, that is, 0's are stored in those bit positions of the register.", "The lower 8 bits of the status register is known as the user byte. Only the first five bits (0-4) are used, bits 5, 6 and 7 are inactive. It should be known that all unused bits in the status register are kept at a logic low level, that is, 0's are stored in those bit positions of the register.", "S M u o p d e e r v i s o r", "I M n a t s e k r r u p t"], "jumps": ["P1270", "P1201"]}, {"id": "P1270", "text": ["Bit 4 is the Extend bit (X).  The Extend bit is used during certain arithmetic operations and also affects the result of certain address oriented functions.", "Bit 4 is the Extend bit (X). The Extend bit is used during certain arithmetic operations and also affects the result of certain address oriented functions."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["Bit 3 is the Negative bit (N).  The Negative bit is set if the most significant digit in the result of an arithmetic or logic operation is high (1).  This indicates that the number represents a negative value.  Negative numbers are encoded into data using two's compliment.", "Bit 3 is the Negative bit (N). The Negative bit is set if the most significant digit in the result of an arithmetic or logic operation is high (1). This indicates that the number represents a negative value. Negative numbers are encoded into data using two's compliment."], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["Bit 2 is the Zero bit (Z).  This bit is set when the result of an operation results in zero.  For example, if 11001000 were subtracted from 11001000 the result would be 00000000 and bit 2 in the status register would then be set high (1).", "Bit 2 is the Zero bit (Z). This bit is set when the result of an operation results in zero. For example, if 11001000 were subtracted from 11001000 the result would be 00000000 and bit 2 in the status register would then be set high (1)."], "jumps": ["P1300", "P1260"]}, {"id": "P1300", "text": ["Bit 1 is the Overflow or Validity bit (V). Both names describe the contents of the bit and for our purposes are synonymous. This bit is useful in evaluating arithmetic operations with 2's compliment numbers which can result in products larger than the encoded number space. The Overflow bit is used to indicate this."], "jumps": ["P1310", "P1260"]}, {"id": "P1310", "text": ["Bit 0 is the Carry bit (C).  The carry bit is used in many arithmetic operations. In addition, the Carry bit indicates a carry from the left-most addition of the bits.  This carry can then be incorporated into the next addition if necessary.", "Bit 0 is the Carry bit (C). The carry bit is used in many arithmetic operations. In addition, the Carry bit indicates a carry from the left-most addition of the bits. This carry can then be incorporated into the next addition if necessary."], "jumps": ["P1320", "P1260"]}, {"id": "P1320", "text": ["The Carry bit can also be used to branch to different segments of code based on its value.  When subtracting, the Carry bit indicates a borrow from the left-most subtraction of bits.  Again, the Carry bit may be used in further subtractions when applicable.", "The Carry bit can also be used to branch to different segments of code based on its value. When subtracting, the Carry bit indicates a borrow from the left-most subtraction of bits. Again, the Carry bit may be used in further subtractions when applicable."], "jumps": ["P1450", "P1260"]}, {"id": "P1330", "text": ["In microprocessors, a stack is a block of continuous memory locations, accessed by a pointer and used to store temporary data.  The stacks are located in RAM since they must be available to the user.  The memory map below illustrates how the stacks are arranged in the 68000.", "In microprocessors, a stack is a block of continuous memory locations, accessed by a pointer and used to store temporary data. The stacks are located in RAM since they must be available to the user. The memory map below illustrates how the stacks are arranged in the 68000."], "jumps": ["P1340", "P1460"]}, {"id": "P1340", "text": ["Space allocated to the stacks must never be employed for other purposes.  If you write data to a stack, information previously stored there will be lost.  The significance of this will become apparent as you learn more about stack operations.", "Space allocated to the stacks must never be employed for other purposes. If you write data to a stack, information previously stored there will be lost. The significance of this will become apparent as you learn more about stack operations."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["Stacks are accessed through the use of a stack pointer.  The stack pointer contains an address which points to a location within the stack.  In the 68000, there are two predefined stacks, the supervisor stack and the user stack; both are accessible through the A7 register.", "Stacks are accessed through the use of a stack pointer. The stack pointer contains an address which points to a location within the stack. In the 68000, there are two predefined stacks, the supervisor stack and the user stack; both are accessible through the A7 register."], "jumps": ["P1360", "P1330"]}, {"id": "P1360", "text": ["The size of any stack depends on the needs and limitations of the system.  The microprocessor, by itself, cannot tell you if you exceed the capacity of your stack.  The programmer must make provisions to monitor the contents of the stack they are using.", "The size of any stack depends on the needs and limitations of the system. The microprocessor, by itself, cannot tell you if you exceed the capacity of your stack. The programmer must make provisions to monitor the contents of the stack they are using."], "jumps": ["P1370", "P1330"]}, {"id": "P1370", "text": ["The stack works on a last-in-first-out (LIFO) basis.  This means that if you issue an instruction to get information from the stack, the first data (or address) you receive will be the last data (or          address) that you put on the stack.", "The stack works on a last-in-first-out (LIFO) basis. This means that if you issue an instruction to get information from the stack, the first data (or address) you receive will be the last data (or address) that you put on the stack."], "jumps": ["P1380", "P1330"]}, {"id": "P1380", "text": ["Let's say you are using the 68000 in the user mode with the stack pointer indicating the memory location 10804.  You execute an instruction that takes a copy of D1 and places it on the stack. The first thing the CPU does is decrement the stack pointer to the next available memory location.", "Let's say you are using the 68000 in the user mode with the stack pointer indicating the memory location 10804. You execute an instruction that takes a copy of D1 and places it on the stack. The first thing the CPU does is decrement the stack pointer to the next available memory location."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["Depending on the size of the last stored data, it will be decremented either 2 or 4 locations.  The stack pointer is now pointing to the location where the microprocessor will copy the value of the D1 data.  The processor then copies the value of D1 to this location.", "Depending on the size of the last stored data, it will be decremented either 2 or 4 locations. The stack pointer is now pointing to the location where the microprocessor will copy the value of the D1 data. The processor then copies the value of D1 to this location."], "jumps": ["P1400", "P1370"]}, {"id": "P1400", "text": ["The stack pointer then stays at the starting position of the last pushed data.  Pushed is a term that means putting data on the stack.  The stack pointer's position is automatically selected by the microprocessor as the need arises.", "The stack pointer then stays at the starting position of the last pushed data. Pushed is a term that means putting data on the stack. The stack pointer's position is automatically selected by the microprocessor as the need arises."], "jumps": ["P1410", "P1370"]}, {"id": "P1410", "text": ["This is what makes the stack such an effective tool in temporary memory storage.  By using the stack, address values do not need to be remembered, only the actual contents.", "This is what makes the stack such an effective tool in temporary memory storage. By using the stack, address values do not need to be remembered, only the actual contents."], "jumps": ["P1420", "P1370"]}, {"id": "P1420", "text": ["Because the stack is a LIFO system, if you store another value on the stack, you will not be able to retrieve the D1 data without first popping the last data placed on the stack.  Pop or popping is a term that means data is being taken from the stack.", "Because the stack is a LIFO system, if you store another value on the stack, you will not be able to retrieve the D1 data without first popping the last data placed on the stack. Pop or popping is a term that means data is being taken from the stack....-"], "jumps": ["P1430", "P1370"]}, {"id": "P1430", "text": ["When you pop data from the stack, the processor does two things.  First, it copies the data being pointed at to a location you specify.  Second, the processor increments the stack pointer to the next data location.  You can see from the illustration the direction that the stack fills.", "When you pop data from the stack, the processor does two things. First, it copies the data being pointed at to a location you specify. Second, the processor increments the stack pointer to the next data location. You can see from the illustration the direction that the stack fills."], "jumps": ["P1440", "P1370"]}, {"id": "P1440", "text": ["As you copy more and more data to the stack, it fills from a high value memory location to a low value memory location.  After you push data to the stack, the only thing that changes is the value of the stack pointer, the data is not changed until enough data is copied to the stack to overwrite it.", "As you copy more and more data to the stack, it fills from a high value memory location to a low value memory location. After you push data to the stack, the only thing that changes is the value of the stack pointer, the data is not changed until enough data is copied to the stack to overwrite it."], "jumps": ["P1910", "P1370"]}, {"id": "P1450", "text": ["The status register is 16 bits long but only ____ bits are used.", "The status register is 16 bits long but only ____ bits are used........) in a variable.able.le."], "jumps": ["P1452"]}, {"id": "P1451", "text": [], "jumps": []}, {"id": "P1452", "text": ["Remember, bits 14, 12, 11, 7, 6 and 5 are blank in the 16 bit status register."], "jumps": []}, {"id": "P1457", "text": ["The correct answer should be 10 even though the register is 16 bits long, only 10 bits are actually used."], "jumps": ["P1460", "P1450"]}, {"id": "P1460", "text": ["The register that holds the next instruction to be performed is\nthe _______", "The register that holds the next instruction to be performed is the _______"], "jumps": ["P1450"]}, {"id": "P1461", "text": [], "jumps": []}, {"id": "P1462", "text": ["Address registers are 32 bit memory locations used to store address values."], "jumps": []}, {"id": "P1463", "text": ["Data registers are 32 bit memory locations used to store various sized portions of data."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on THE 68000 REGISTERS.", "This completes the information on THE 68000 REGISTERS......"], "jumps": ["P1370"]}, {"id": "P1920", "text": ["1.  An internal register is a memory location inside the                            microprocessor used to temporarily store data that the                    microprocessor may be working with.", "1. An internal register is a memory location inside the microprocessor used to temporarily store data that the microprocessor may be working with. s"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  In the 68000 microprocessor, there are 19 registers that are            accessible to the user: 7 address registers, 2 stack pointers, 8       data registers, the program counter and the status registers.          All but the status register are 32-bit registers.", "2. In the 68000 microprocessor, there are 19 registers that are accessible to the user: 7 address registers, 2 stack pointers, 8 data registers, the program counter and the status registers. All but the status register are 32-bit registers."], "jumps": ["P1940", "P1920", "PC"]}, {"id": "P1940", "text": ["3.  Address registers are important because instructions use              their contents to access external memory or I/O.  These                    registers can store either word or longword address values.", "3. Address registers are important because instructions use their contents to access external memory or I/O. These registers can store either word or longword address values."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  Data registers are important because certain instructions                require that some of the values being worked with must be in        one of the data registers.  An advantage of using the data                registers is speed.  Data registers can store byte, word or                longword data.", "4. Data registers are important because certain instructions require that some of the values being worked with must be in one of the data registers. An advantage of using the data registers is speed. Data registers can store byte, word or longword data."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  The program counter holds the address value of the next                 instruction to be evaluated.", "5. The program counter holds the address value of the next instruction to be evaluated."], "jumps": ["P1970", "P1940"]}, {"id": "P1970", "text": ["6.  The status register is a 16-bit register used to provide the                status of the CPU and the results of the last executed                       instruction.  While the status register is 16-bits long, only 10 of      the bits are used.", "6. The status register is a 16-bit register used to provide the status of the CPU and the results of the last executed instruction. While the status register is 16-bits long, only 10 of the bits are used."], "jumps": ["P1980", "P1940"]}, {"id": "P1980", "text": ["7.  Debugging is a term used to describe the process of finding,         correcting or eliminating sections of code that are not working      properly.  The term \"bug\" refers to a fault in the program                 causing it not to work properly.  This terminology is used for          hardware problems as well.", "7. Debugging is a term used to describe the process of finding, correcting or eliminating sections of code that are not working properly. The term \"bug\" refers to a fault in the program causing it not to work properly. This terminology is used for hardware problems as well."], "jumps": ["P1985", "P1940"]}, {"id": "P1985", "text": ["8.  A stack is a group of continuous memory locations accessed        by a pointer and used to store temporary data.  Space                      allocated for the stack must not be used for other purposes.          In the 68000, there  are two predefined stacks; supervisor and       user.", "8. A stack is a group of continuous memory locations accessed by a pointer and used to store temporary data. Space allocated for the stack must not be used for other purposes. In the 68000, there are two predefined stacks; supervisor and user."], "jumps": ["P1990", "P1980"]}, {"id": "P1990", "text": ["9.  Stacks work on a last-in-fist-out (LIFO) basis.  This means that        the last data stored on the stack will be the first data available        for removal.", "9. Stacks work on a last-in-fist-out (LIFO) basis. This means that the last data stored on the stack will be the first data available for removal."], "jumps": ["P1995", "P1985"]}, {"id": "P1995", "text": ["10.  Push is a term used to describe the process of putting                      information on the stack.  Pop is a term used to describe the          process of taking information off the stack.", "10. Push is a term used to describe the process of putting information on the stack. Pop is a term used to describe the process of taking information off the stack."], "jumps": ["P1999", "P1990"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1990"]}, {"id": "P2001", "text": ["Memory is physically located outside the microprocessor and is a collection of continuous storage locations, each with their own address.  Memory is used to store information including data,        addresses and stacks.  Memory locations comprise 8 bits.  Each bit is referred to as a memory cell which is either high or low.", "Memory is physically located outside the microprocessor and is a collection of continuous storage locations, each with their own address. Memory is used to store information including data, addresses and stacks. Memory locations comprise 8 bits. Each bit is referred to as a memory cell which is either high or low."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["Memory is normally classified in two categories: ROM and RAM.  Microprocessors normally use both types for their operations.", "Memory is normally classified in two categories: ROM and RAM. Microprocessors normally use both types for their operations."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["The first type of memory we will examine is RAM.  The word RAM is an acronym for Random Access Memory.  This type of memory can be read from or written to.  It is also considered volatile memory because when power is removed from the system, any information stored in RAM will be lost.", "The first type of memory we will examine is RAM. The word RAM is an acronym for Random Access Memory. This type of memory can be read from or written to. It is also considered volatile memory because when power is removed from the system, any information stored in RAM will be lost."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["RAM is available in two basic types, static RAM (SRAM) and dynamic RAM (DRAM).  The NIDA 68000 card set uses 65 kbytes of SRAM.", "RAM is available in two basic types, static RAM (SRAM) and dynamic RAM (DRAM). The NIDA 68000 card set uses 65 kbytes of SRAM."], "jumps": ["P2060", "P2020"]}, {"id": "P2060", "text": ["Static RAM stores information in flip/flops.  As you learned in flip/flop theory, data stored on the output of a flip/flop remains constant until it is either deliberately changed or until the power to the chip is removed.", "Static RAM stores information in flip/flops. As you learned in flip/flop theory, data stored on the output of a flip/flop remains constant until it is either deliberately changed or until the power to the chip is removed."], "jumps": ["P2070", "P2020"]}, {"id": "P2070", "text": ["Dynamic RAM stores information in the form of charges on capacitors.  A charged capacitor equates to a logic 1, while a discharged capacitor equates to a logic 0.  Capacitors will only hold a charge for a finite period and so must be refreshed (recharged) in order to \"remember\" information.", "Dynamic RAM stores information in the form of charges on capacitors. A charged capacitor equates to a logic 1, while a discharged capacitor equates to a logic 0. Capacitors will only hold a charge for a finite period and so must be refreshed (recharged) in order to \"remember\" information."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["Static RAM is more expensive than dynamic RAM, but static RAM is more cost effective because refresh cycles are not needed. When refresh cycles occur, the processor must stop whatever it's doing; this, of course, slows down overall CPU operations. Consequently, static RAM is the most popular of the two."], "jumps": ["P2085", "P2070"]}, {"id": "P2085", "text": ["Static RAM stores data in _______", "Static RAM stores data in _______.........................."], "jumps": ["P2080"]}, {"id": "P2086", "text": [], "jumps": []}, {"id": "P2087", "text": ["Dynamic RAM stores information in the form of charges on capacitors."], "jumps": []}, {"id": "P2090", "text": ["There are two SRAM chips (U5 and U6) on the PC130-403 card. Each one is a 84256C SRAM, 10 nanosecond memory chips. The memory size of each chip is 8 x 32,768. Together the chips provide the system with 64 kbytes of RAM. 64 k is a standard convention used to identify memory size, even though the actual size is 65,563.", "10 9 8 7 6 5 4 3 25 24 21 23 2 26 1 20 22 27"], "jumps": ["P2100", "P2085"]}, {"id": "P2100", "text": ["Since the 68000 data bus is 16 bit, each of the Ram chips are 8 bit; half the data bus lines connect to one chip and half go to the other.  The chip attached to D0-D7 is referred to as the lower RAM while the chip attached to D8-D15 is referred to as the upper RAM.", "When the 68000 is first turned on (booted-up), it depends on some sort of instruction code to begin operations.  These initializing instructions are called the monitor program.  Monitor programs normally perform a small diagnostic check on the CPU, memory and I/O and set the system for use.", "Since the 68000 data bus is 16 bit, each of the Ram chips are 8 bit; half the data bus lines connect to one chip and half go to the other. The chip attached to D0-D7 is referred to as the lower RAM while the chip attached to D8-D15 is referred to as the upper RAM.", "When the 68000 is first turned on (booted-up), it depends on some sort of instruction code to begin operations. These initializing instructions are called the monitor program. Monitor programs normally perform a small diagnostic check on the CPU, memory and I/O and set the system for use."], "jumps": ["P2110", "P2090", "P2120"]}, {"id": "P2120", "text": ["Since the monitor program begins at power-up (or whenever the system is reset) it could never be stored in RAM because RAM is volatile.  Microprocessors must store their monitor programs in ROM whose content is unaffected by the removal of power. Therefore, ROM is considered to be nonvolatile.", "Since the monitor program begins at power-up (or whenever the system is reset) it could never be stored in RAM because RAM is volatile. Microprocessors must store their monitor programs in ROM whose content is unaffected by the removal of power. Therefore, ROM is considered to be nonvolatile."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["The basic ROM chip is programmed by the manufacturer and cannot be changed.  This is acceptable in applications where there will never be a reason to change the programming, but those applications are limited.", "The basic ROM chip is programmed by the manufacturer and cannot be changed. This is acceptable in applications where there will never be a reason to change the programming, but those applications are limited.."], "jumps": ["P2140", "P2110"]}, {"id": "P2140", "text": ["Since a chip manufacturer doesn't necessarily know the exact use that an equipment manufacturer may require, Programmable ROM (PROM) are produced.  PROM's give an equipment manufacturer the option of programming the IC to do exactly what is needed. But even this has its shortfalls.", "Since a chip manufacturer doesn't necessarily know the exact use that an equipment manufacturer may require, Programmable ROM (PROM) are produced. PROM's give an equipment manufacturer the option of programming the IC to do exactly what is needed. But even this has its shortfalls."], "jumps": ["P2150", "P2130", "PROM"]}, {"id": "P2150", "text": ["Mistakes are made and chips may need to be reprogrammed. The solution is the Erasable Programmable ROM (EPROM). PROM's can be programmed once; EPROM's can be erased and reprogrammed as often as needed. This provides the equipment manufacturer with the latitude to tailor their product as they see fit."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["EPROM's are recognized by a window present on the IC's surface. This window allows UV light to be directed to the semiconductor material which erases any program stored in the chip. The chip is then reprogrammed electrically. Most programmed EPROM's have their window covered to prevent accidental erasure."], "jumps": ["P2170", "P2150"]}, {"id": "P2161", "text": ["EPROM's are recognized by a window present on the IC's surface. This window allows UV light to be directed to the semiconductor material which erases any program stored in the chip. The chip is then reprogrammed electrically. Most programmed EPROM's have their window covered to prevent accidental erasure."], "jumps": ["P2170", "P2150"]}, {"id": "P2165", "text": ["UV LIGHT - UV light is ultraviolet light and is invisible to the human eye. UV light is of a much higher frequency (roughly 10 ) and is able to penetrate semiconductor material giving electrons additional energy to tunnel through the insulating layers. This discharges the capacitors in the memory array."], "jumps": []}, {"id": "P2170", "text": ["There are other erasable PROM's like the Electrically Erasable PROM (EEPROM's) which do not require UV light to erase the contents of their memory, only DC voltages.  EEPROM's are also known as EAPROM's; the EA being an abbreviation for electrically alterable.", "There are other erasable PROM's like the Electrically Erasable PROM (EEPROM's) which do not require UV light to erase the contents of their memory, only DC voltages. EEPROM's are also known as EAPROM's; the EA being an abbreviation for electrically alterable."], "jumps": ["P2180", "P2161"]}, {"id": "P2180", "text": ["The major benefit to this type of PROM is that it doesn't need to be removed from the circuit to be reprogrammed.  Additionally, the entire contents of the chip's memory need not be erased, only desired sections.", "The major benefit to this type of PROM is that it doesn't need to be removed from the circuit to be reprogrammed. Additionally, the entire contents of the chip's memory need not be erased, only desired sections."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["EPROM's require a \"PROM Burner\" to erase and reprogram the chip.  The term \"burn\" derives from the UV radiation used in the erasure process.  PROM burners, like the one below, are small devices with a chip socket that is attached to a computer which sends information into the chip's memory.", "EPROM's require a \"PROM Burner\" to erase and reprogram the chip. The term \"burn\" derives from the UV radiation used in the erasure process. PROM burners, like the one below, are small devices with a chip socket that is attached to a computer which sends information into the chip's memory."], "jumps": ["P2200", "P2170"]}, {"id": "P2200", "text": ["The NIDA 68000 card set has 64 kbytes of ROM (EPROM).  There are two 27C256 EPROM chips designated as U3 and U4 on the PC130-403 card.  The storage space on each of these chips is 8 bits x 32,768.  The two chips are addressed as the low and high order bytes, just like RAM.", "The NIDA 68000 card set has 64 kbytes of ROM (EPROM). There are two 27C256 EPROM chips designated as U3 and U4 on the PC130-403 card. The storage space on each of these chips is 8 bits x 32,768. The two chips are addressed as the low and high order bytes, just like RAM.", "10 9 8 7 6 5 4 3 25 24 21 23 2 26 27 20 22 1"], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["You have examined the different kinds of memory in the 68000; now look at the pin-outs for the ROM and RAM. Both of the memory chips shown have three major sets of pins: data, address and control. There are 15 address lines (ADD0-ADD14). Only 15 address lines are needed to address 32,768 bytes of memory."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["The 15 address lines of each memory chip attach directly to the 68000 address lines A1-A16.  Remember that A0 is not available because it is used internally by the CPU.", "The 15 address lines of each memory chip attach directly to the 68000 address lines A1-A16. Remember that A0 is not available because it is used internally by the CPU."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["There are 8 data lines (D0-D7) on each chip. Since the microprocessor has a 16 bit data bus, two chips are required to connect all the lines of the bus and are designated as the upper and lower RAM and ROM. The upper RAM and ROM connect to D8-D15 on the data bus, while the lower RAM and ROM connect to D0-D7."], "jumps": ["P2240", "P2210"]}, {"id": "P2240", "text": ["The 62256 RAM chip has five control pins which include Vcc , Ground, chip enable, write enable and output enable.  All 3 enable pins are active low.  Whenever data is read from RAM, a low is applied by the microprocessor to the chip enable pin of the RAM chip(s) being accessed.", "The 62256 RAM chip has five control pins which include Vcc , Ground, chip enable, write enable and output enable. All 3 enable pins are active low. Whenever data is read from RAM, a low is applied by the microprocessor to the chip enable pin of the RAM chip(s) being accessed."], "jumps": ["P2250", "P2210"]}, {"id": "P2250", "text": ["Having the chip enable prevents more than one chip from trying to write to the same bus lines at the same time.  The output enable pin is used to output data from a selected address to the data lines of the chip.  If the signal is high, data will not be written from RAM to the data lines of the RAM chip.", "Having the chip enable prevents more than one chip from trying to write to the same bus lines at the same time. The output enable pin is used to output data from a selected address to the data lines of the chip. If the signal is high, data will not be written from RAM to the data lines of the RAM chip."], "jumps": ["P2260", "P2210"]}, {"id": "P2260", "text": ["Writing data control is provided by the write enable pin.  When data is present on the 68000 data bus, it will be written to the RAM chip when a low is present on the write enable pin.  The location the data is written to depends on the value of A1-A15 address lines.", "Writing data control is provided by the write enable pin. When data is present on the 68000 data bus, it will be written to the RAM chip when a low is present on the write enable pin. The location the data is written to depends on the value of A1-A15 address lines."], "jumps": ["P2270", "P2210"]}, {"id": "P2270", "text": ["The 27256 EPROM chips also have 5 control pins: Chip Enable, Output Enable, V   , V   , and Ground. As with the RAM chips, the ROM enable are active low and function the same as the RAM chips.  The difference between them is the Write Enable and Vpp pins.", "The 27256 EPROM chips also have 5 control pins: Chip Enable, Output Enable, V , V , and Ground. As with the RAM chips, the ROM enable are active low and function the same as the RAM chips. The difference between them is the Write Enable and Vpp pins."], "jumps": ["P2280", "P2210"]}, {"id": "P2280", "text": ["Since data cannot be written to ROM, there is no need for a Write Enable pin. The V    pin uses the same power source (5 volts) as the V    pin except when the chip is installed on the PROM burner.", "Since data cannot be written to ROM, there is no need for a Write Enable pin. The V pin uses the same power source (5 volts) as the V pin except when the chip is installed on the PROM burner.", "The connection of memory (PC130-403) to the 68000 system is shown below. Portions of the circuitry from the PC130-468 card have been overlaid on the 403 schematic for convenience and clarification purposes. It should be remembered that components in the highlighted area are not physically on the PC130-403 card."], "jumps": ["P2290", "P2210", "P2300", "PC130"]}, {"id": "P2300", "text": ["The 4013 chip (center of the highlighted area) is the second flip/flop of the chip used in the reset circuit. This flip/flop supplies the data acknowledge signal needed by the microprocessor. Some memory chips provide this signal for the system and can be connected directly to the data acknowledge pin."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["In the NIDA 68000 system the memory chips do not provide this signal.  Without it, the processor has no way of knowing that data transfer was complete.  Remember, the data acknowledge pin allows you to keep the processor from continuing until a memory chip completes its operations.", "In the NIDA 68000 system the memory chips do not provide this signal. Without it, the processor has no way of knowing that data transfer was complete. Remember, the data acknowledge pin allows you to keep the processor from continuing until a memory chip completes its operations."], "jumps": ["P2320", "P2290"]}, {"id": "P2320", "text": ["The data acknowledge signal is triggered by the address strobe signal of the 68000.  When the address strobe signal goes low, it is indicating that the address on the address line is valid.  This, along with other signals, indicates to the appropriate RAM, ROM, or I/O to the address bus.", "The data acknowledge signal is triggered by the address strobe signal of the 68000. When the address strobe signal goes low, it is indicating that the address on the address line is valid. This, along with other signals, indicates to the appropriate RAM, ROM, or I/O to the address bus."], "jumps": ["P2330", "P2290"]}, {"id": "P2330", "text": ["The address strobe low signal is applied to the input of the flip/flop. This causes Q to go low and indicates that the data transfer is complete. Q connects directly to the data acknowledge pin of the 68000. When the address strobe goes high, the input to D goes high, which causes the data acknowledge pin to go high."], "jumps": ["P2340", "P2290"]}, {"id": "P2340", "text": ["The signals produced by the flip/flop are also used with the read/write signals of the 68000. While the 68000 microprocessor read/write signal is a single signal, the RAM chips we are using require separate active low read and write signals. To accommodate this, the system uses three NAND gates from the 74HC00 chip."], "jumps": ["P2350", "P2290"]}, {"id": "P2350", "text": ["Notice that the inputs to gate C are tied to one source.  This configuration causes the gate to operate like an Inverter.  Gates B and D are used to produce the active low read and write signals.  The output of the 68000 read/write pin is applied to one input of gate A to one input of gate B.", "These two lines will always be opposite of each other because of the inverting action of gate C.  This will allow only the read or the write signal to be active at any given time, not both.  The second   input to gates B and D is the signal from the Q Not output of the flip/flop.", "Notice that the inputs to gate C are tied to one source. This configuration causes the gate to operate like an Inverter. Gates B and D are used to produce the active low read and write signals. The output of the 68000 read/write pin is applied to one input of gate A to one input of gate B.", "These two lines will always be opposite of each other because of the inverting action of gate C. This will allow only the read or the write signal to be active at any given time, not both. The second input to gates B and D is the signal from the Q Not output of the flip/flop."], "jumps": ["P2360", "P2290", "P2370"]}, {"id": "P2370", "text": ["When this signal is high (caused by the address strobe low) it supplies a high input to both B and D.  If the processor read/write line is high, a high will be applied to the first input of gate D and a low to the first input of gate B.  This produces a high/high condition on the inputs of D and drive the output low.", "When this signal is high (caused by the address strobe low) it supplies a high input to both B and D. If the processor read/write line is high, a high will be applied to the first input of gate D and a low to the first input of gate B. This produces a high/high condition on the inputs of D and drive the output low."], "jumps": ["P2380", "P2360"]}, {"id": "P2380", "text": ["This is the active low read signal. If the read/write signal had been low, the opposite conditions would have occurred and the write signal would be low.  Remember, the address strobe must be low for a read or write signal to be generated by the NAND gates.", "Above the 68000 on the PC130-468 card are two 74HC245 octal bus transceivers with tri-state outputs.  Translating their functional title, we can say that they are basically buffers whose primary purpose is to increase the strength of the signals from the data lines.", "Data signals are weakened as they pass through cables and PC board connections.  At times, they can attenuate to the degree that they are unable to provide proper voltage conditions for a high signal.  The buffer output is much more powerful than the data line drivers in the 68000.", "This is the active low read signal. If the read/write signal had been low, the opposite conditions would have occurred and the write signal would be low. Remember, the address strobe must be low for a read or write signal to be generated by the NAND gates.", "Above the 68000 on the PC130-468 card are two 74HC245 octal bus transceivers with tri-state outputs. Translating their functional title, we can say that they are basically buffers whose primary purpose is to increase the strength of the signals from the data lines.", "Data signals are weakened as they pass through cables and PC board connections. At times, they can attenuate to the degree that they are unable to provide proper voltage conditions for a high signal. The buffer output is much more powerful than the data line drivers in the 68000."], "jumps": ["P2390", "P2360", "P2400", "P2410"]}, {"id": "P2410", "text": ["Address lines don't need a buffer because they are a stronger signal than the data lines.  Buffers allow data transfer in both directions but not at the same time.  Data transfer direction is controlled by the direction pin which is connected directly to the read/write pin of the 68000.", "Address lines don't need a buffer because they are a stronger signal than the data lines. Buffers allow data transfer in both directions but not at the same time. Data transfer direction is controlled by the direction pin which is connected directly to the read/write pin of the 68000."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["When a high is present, indicating a read condition, the direction signal instructs the buffers to allow data transfer from the A side to the B side.  If a write condition was present, the opposite          operation would have occurred.", "When a high is present, indicating a read condition, the direction signal instructs the buffers to allow data transfer from the A side to the B side. If a write condition was present, the opposite operation would have occurred."], "jumps": ["P2430", "P2400"]}, {"id": "P2430", "text": ["The enable input G enables the operation of the buffers.  The state indicator (the little circle) on the pin indicates that the pin is active low.  If the buffers are not activated, data transfer does not occur in either direction.", "The enable input G enables the operation of the buffers. The state indicator (the little circle) on the pin indicates that the pin is active low. If the buffers are not activated, data transfer does not occur in either direction."], "jumps": ["P2440", "P2400"]}, {"id": "P2440", "text": ["The enable signal is controlled by the address strobe signal. When the address is correct, the buffers allow data to be transferred through the bus.  Remember, the actual direction of transfer is dependent on the read/write signal.", "The enable signal is controlled by the address strobe signal. When the address is correct, the buffers allow data to be transferred through the bus. Remember, the actual direction of transfer is dependent on the read/write signal."], "jumps": ["P2450", "P2400"]}, {"id": "P2450", "text": ["The 74HC138 chip is a 3 line to 8 line decoder.  The IC, configured as it is, in the NIDA 68000 system is known as a Chip Select.  The operation of this IC directly corresponds to the layout of a memory map.  Understanding the operation of this IC is important to your overall comprehension of the 68000 system.", "The 74HC138 chip is a 3 line to 8 line decoder. The IC, configured as it is, in the NIDA 68000 system is known as a Chip Select. The operation of this IC directly corresponds to the layout of a memory map. Understanding the operation of this IC is important to your overall comprehension of the 68000 system."], "jumps": ["P2460", "P2400"]}, {"id": "P2460", "text": ["The three address lines (A16, A17, and A18) feed to the 74HC138's A, B, and C inputs. The other address lines A1-A15 are committed to the RAM and ROM chips. Remember that the 68000 reserves the A0 line to determine whether ROM and RAM is being accessed. This is why the A1 line feeds to the A0 pin on the memory chips."], "jumps": ["P2470", "P2450"]}, {"id": "P2470", "text": ["The A, B, and C inputs of the decoder take a binary value from the address lines and provide a single low to one and only one output at any given time.  The decoder's outputs are used to turn on individual chips like RAM, ROM or I/O devices.", "The A, B, and C inputs of the decoder take a binary value from the address lines and provide a single low to one and only one output at any given time. The decoder's outputs are used to turn on individual chips like RAM, ROM or I/O devices."], "jumps": ["P2480", "P2450"]}, {"id": "P2480", "text": ["Two of the chip select signals (decoder outputs) are used for memory and three are used for I/O. Outputs 10, 9 and 7 of the decoder are not used. Since the upper and lower memory chips do not write to the same data lines, both the upper and lower memory chips (ROM or RAM) can be enabled from the same signal."], "jumps": ["P2490", "P2450"]}, {"id": "P2490", "text": ["When A16, 17, and 18 are low, ROM Select is low and enables ROM. The address range for ROM is 00000000h - 0000FFFFh. The next address value 00010000h sets A16 high disabling ROM and enabling RAM. The address range for RAM is 00010000h - 0001FFFFh. Any values above this turn on different I/O chips used in the system."], "jumps": ["P2500", "P2450"]}, {"id": "P2500", "text": ["The last three inputs of the decoder (G1, G2A, and G2B) are actually enable pins.  Two of them are active low and the other is active high.  As configured G1 and G2B are permanently enabled while G2A is tied to the address strobe.  When the address is valid, the chip select (decoder) is enabled.", "The last three inputs of the decoder (G1, G2A, and G2B) are actually enable pins. Two of them are active low and the other is active high. As configured G1 and G2B are permanently enabled while G2A is tied to the address strobe. When the address is valid, the chip select (decoder) is enabled."], "jumps": ["P2505", "P2450"]}, {"id": "P2505", "text": ["Address lines do not need a buffer because they _______", "Address lines do not need a buffer because they _______....", "are weakened as they pass through cables.", "are a stronger signal than the data lines."], "jumps": ["P2450"]}, {"id": "P2506", "text": [], "jumps": []}, {"id": "P2507", "text": ["Data signals are weakened as they pass through cables not address."], "jumps": []}, {"id": "P2508", "text": ["Buffers allow data transfer in both directions but not at the same time.", "The 74HC32 is a Quad OR Gate chip. The OR gate outputs are attached to the chip enables of the four memory chips. The inputs to the OR gates come from the chip select and from the upper and lower data strobes from the microprocessor. The UDS and LDS access only the upper and lower portions of memory."], "jumps": ["P2520", "P2505"]}, {"id": "P2520", "text": ["The bottom legs of OR gates A and B are controlled by the ROM select pin of the decoder.  The bottom legs of OR gates C and D are controlled by the RAM select pin.  The UDS line feeds the top legs of OR gates A and C (high order bytes) while the LDS line feeds the top legs of OR gates B and D (low order bytes).", "The bottom legs of OR gates A and B are controlled by the ROM select pin of the decoder. The bottom legs of OR gates C and D are controlled by the RAM select pin. The UDS line feeds the top legs of OR gates A and C (high order bytes) while the LDS line feeds the top legs of OR gates B and D (low order bytes)."], "jumps": ["P2530", "P2510"]}, {"id": "P2530", "text": ["For any memory to be active, both the chip select and the associated data strobe must be low.  If one of the two signals goes high, the OR gate goes high which disables the chip.  The control of the upper and lower data strobes is performed automatically by the microprocessor.", "For any memory to be active, both the chip select and the associated data strobe must be low. If one of the two signals goes high, the OR gate goes high which disables the chip. The control of the upper and lower data strobes is performed automatically by the microprocessor."], "jumps": ["P2540", "P2510"]}, {"id": "P2540", "text": ["Timing and control is very important in any microprocessor system and is especially important to the operation of memory.  Understanding the operation and organization of memory allows you to understand how and when it is accessed by a microprocessor system.", "Timing and control is very important in any microprocessor system and is especially important to the operation of memory. Understanding the operation and organization of memory allows you to understand how and when it is accessed by a microprocessor system."], "jumps": ["P2910", "P2510"]}, {"id": "P2910", "text": ["This completes the information on THE 68000 MEMORY.", "1.  Memory is classified in two categories: ROM and RAM.                    Microprocessors normally use both types for their operations.", "This completes the information on THE 68000 MEMORY.........", "1. Memory is classified in two categories: ROM and RAM. Microprocessors normally use both types for their operations."], "jumps": ["P2540", "P2930", "P2001"]}, {"id": "P2930", "text": ["2.  RAM (Random Access Memory) is considered volatile memory      because when power is removed from the system, any                    information stored in RAM will be lost.", "2. RAM (Random Access Memory) is considered volatile memory because when power is removed from the system, any information stored in RAM will be lost."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3.  RAM is available in two basic types, static RAM (SRAM) and           dynamic RAM (DRAM). Static RAM stored information in                   flip/flops.  Dynamic RAM stored information in the form of                charges in  capacitors.", "3. RAM is available in two basic types, static RAM (SRAM) and dynamic RAM (DRAM). Static RAM stored information in flip/flops. Dynamic RAM stored information in the form of charges in capacitors."], "jumps": ["P2950", "P2920"]}, {"id": "P2950", "text": ["4.  Microprocessors must store their monitor programs in ROM          whose content is unaffected by the removal of power.  ROM is       considered to be nonvolatile.", "5.  The 15 address lines of each memory chip attach directly to            the 68000 address lines A1-A16.  Remember that A0 is not               available because it is used internally by the CPU.", "4. Microprocessors must store their monitor programs in ROM whose content is unaffected by the removal of power. ROM is considered to be nonvolatile.", "5. The 15 address lines of each memory chip attach directly to the 68000 address lines A1-A16. Remember that A0 is not available because it is used internally by the CPU."], "jumps": ["P2960", "P2940", "P2970", "P2950"]}, {"id": "P2970", "text": ["6. There are 8 data lines (D0-D7) on each chip. Since the microprocessor has a 16 bit data bus, two chips are required to connect all the lines of the bus and are designated as the upper and lower RAM and ROM. The upper RAM and ROM connect to D8-D15 on the data bus, while the lower RAM and ROM connect to D0-D7."], "jumps": ["P2980", "P2960"]}, {"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 02-02-00 Text & Branching - lisa 02-17-00 Graphics (some) - lisa 02-17-00 Ran experiment. frieda 02-23-00 Fixed Background info - lisa 03-07-00 Graphics-John Ayala 03-14-00 CAI lesson check & add graphics by Chris 05-26-00 Question format. - Penny 07-14-00 Converted to ToolBook 7.1 format. jay 07-21-00 Fixed page p333. damian 10-27-00 Add Monitor Pro code to quiz pages. jay 12-04-00 Added HelpPage information and new random gen. script. Changed caption of Main Window Viewer from Nida Corporation - Format to Nida Corporation - Registers and Memory. -Penny 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-1102 Checked for convertion errors John Ayala 06-17-02 Review - lisa 02-14-03 P10002 - P10004 changed page name from Q10002-Q10004. Lydia", "07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 02-02-00 Text & Branching - lisa 02-17-00 Graphics (some) - lisa 02-17-00 Ran experiment. frieda 02-23-00 Fixed Background info - lisa 03-07-00 Graphics-John Ayala 03-14-00 CAI lesson check & add graphics by Chris 05-26-00 Question format. - Penny 07-14-00 Converted to ToolBook 7.1 format. jay 07-21-00 Fixed page p333. damian 10-27-00 Add Monitor Pro code to quiz pages. jay 12-04-00 Added HelpPage information and new random gen. script. Changed caption of Main Window Viewer from Nida Corporation - Format to Nida Corporation - Registers and Memory. -Penny 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-1102 Checked for convertion errors John Ayala 06-17-02 Review - lisa 02-14-03 P10002 - P10004 changed page name from Q10002-Q10004. Lydia 02-28-03 Changed text on P2230 from \"...while the upper RAM and ROM connect to D0-D7\" to \"...while the lower RAM and ROM connect to D0-D7\". mary 09-29-03 P10223, changed correct from \"b\" to \"d\" - dean 07-08-04 P3910, 13910 added eox script - patty 03-07-05 P3110-P3130,P13110 - P13130 - changed data under N from \"0\" to \"1\". P13220 - changed \" V.1\" to \"V.X\" - Dean 03-08-05 P2970, chg'd text from \"The upper RAM and ROM connect to D8-D15 on the data bus, while the upper RAM and ROM connect to D0-D7.\" to \"The upper RAM and ROM connect to D8-D15 on the data bus, while the lower RAM and ROM connect to D0-D7.\" - Dean"], "jumps": []}, {"id": "P2990", "text": ["8.  The 27256 EPROM chips also have five control pins: Vpp , Vcc ,        Ground, Chip Enable and Output Enable.  As with the RAM             chips the ROM enable pins are active low.", "8. The 27256 EPROM chips also have five control pins: Vpp , Vcc , Ground, Chip Enable and Output Enable. As with the RAM chips the ROM enable pins are active low."], "jumps": ["P2999", "P2960"]}, {"id": "P2999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": []}, {"id": "P3001", "text": ["In this experiment you will become familiar with the registers and memory of the 68000 microprocessor system.  You will also be introduced to different functions of the 68000 monitor program which allows the observation and manipulation of registers and memory.", "2.  Carefully insert the PC130-468 card into the PC1 position, the         PC130-403 card into the PC2 position, the PC130-401 card              into the PC3 position and place the PC130-404 card in front of       the test console.", ". The experiment in this lesson is not setup to use the selected trainer.", "In this experiment you will become familiar with the registers and memory of the 68000 microprocessor system. You will also be introduced to different functions of the 68000 monitor program which allows the observation and manipulation of registers and memory.", "2. Carefully insert the PC130-468 card into the PC1 position, the PC130-403 card into the PC2 position, the PC130-401 card into the PC3 position and place the PC130-404 card in front of the test console."], "jumps": ["P3030", "P3001", "P3040"]}, {"id": "P3040", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P3020"]}, {"id": "P3050", "text": ["3.  Connect the 50 pin cable from J1, PC130-468 to J1, PC130-             403.  Connect the 20 pin short cable from J2, PC130-403 to J1,       PC130-401.  Connect the 20 pin long cable from J2, PC130-401      to J1, PC130-404.  Remember to keep the red side of the cable       aligned with the pin 1 label on the card.", "3. Connect the 50 pin cable from J1, PC130-468 to J1, PC130- 403. Connect the 20 pin short cable from J2, PC130-403 to J1, PC130-401. Connect the 20 pin long cable from J2, PC130-401 to J1, PC130-404. Remember to keep the red side of the cable aligned with the pin 1 label on the card."], "jumps": ["P3030"]}, {"id": "P3060", "text": ["4.  Set the Positive Supply Voltage to 5 volts.", "4. Set the Positive Supply Voltage to 5 volts.130A - Set the PC1 DC Switch to ON...."], "jumps": ["P3050"]}, {"id": "P3062", "text": ["5.  Turn PC3 DC Power switch to ON.", "5. Turn PC3 DC Power switch to ON........................................."], "jumps": ["P3060"]}, {"id": "P3064", "text": ["6.  Turn PC2 DC Power switch to ON.", "6. Turn PC2 DC Power switch to ON........................................."], "jumps": ["P3062"]}, {"id": "P3066", "text": ["7.  Turn PC1 DC Power switch to ON.", "7. Turn PC1 DC Power switch to ON........................................."], "jumps": ["P3064"]}, {"id": "P3070", "text": ["The system should now be functioning properly with the display as shown below."], "jumps": ["P3066"]}, {"id": "P3080", "text": ["Recall that the registers are internal memory locations used for a variety of purposes in microprocessor operation.  Programs used on the 68000, or any microprocessor, greatly rely on registers during normal operation.", "8.  Press the RESET button on the PC130-468 card.", "Recall that the registers are internal memory locations used for a variety of purposes in microprocessor operation. Programs used on the 68000, or any microprocessor, greatly rely on registers during normal operation.", "8. Press the RESET button on the PC130-468 card..........."], "jumps": ["P3070", "P3080"]}, {"id": "P3100", "text": ["9.  Press the DISPLAY R.M./RECALL key on the 68000 keyboard.       After pressing the key, a small menu should be displayed.               The menu shows the different functions you can select.", "9. Press the DISPLAY R.M./RECALL key on the 68000 keyboard. After pressing the key, a small menu should be displayed. The menu shows the different functions you can select.", "1 - Display Registers 2 - Display Memory"], "jumps": ["P3090"]}, {"id": "P3110", "text": ["10. Press the \"1\" key on the 68000 keyboard. The display on the screen is the Status Register, Program Counter and Stack Pointer. The Status Register is displayed in binary and the other two in hexadecimal. Recall the Status Register doesn't represent a single data item, instead, each bit represents a condition.", "T S 2 1 0 X N Z V C 0 0 1 0 0 0 0 0 1 0 PC : 00000558 SP: 000103FCCC"], "jumps": ["P3100"]}, {"id": "P3120", "text": ["Reading the Status Register in hex would make it more difficult to evaluate.  The Program Counter and Stack Pointer contain address locations which are easier to follow in hex.  The Status Register Bits are identified by letters and numbers above the binary values.  The unused bits are not shown!", "Reading the Status Register in hex would make it more difficult to evaluate. The Program Counter and Stack Pointer contain address locations which are easier to follow in hex. The Status Register Bits are identified by letters and numbers above the binary values. The unused bits are not shown!"], "jumps": ["P3100"]}, {"id": "P3130", "text": ["The second register shown is the Program Counter which indicates the address of the next instruction.  Evaluating the address determines that the program is running from ROM.  The last register is the Stack Pointer which is dependent on the mode of operation.  The Status Register indicates Supervisor Mode.", "The second register shown is the Program Counter which indicates the address of the next instruction. Evaluating the address determines that the program is running from ROM. The last register is the Stack Pointer which is dependent on the mode of operation. The Status Register indicates Supervisor Mode."], "jumps": ["P3100"]}, {"id": "P3140", "text": ["11.  Press the \"Down Arrow\" key on the 68000 keyboard.  The              display should have advanced to another set of registers.               These are the first two address and data registers.  The                    contents of the register may vary from the example shown.", "11. Press the \"Down Arrow\" key on the 68000 keyboard. The display should have advanced to another set of registers. These are the first two address and data registers. The contents of the register may vary from the example shown.", "DO : 00000001 AO : 00002E2A D1 : 00000C00 A1 : 00040004"], "jumps": ["P3150", "P3100"]}, {"id": "P3150", "text": ["12. Press the \"Down Arrow\" key on the 68000 keyboard four more times. The display should have advanced through all the registers. The last two data and address registers should be displayed. If not, press the down arrow a few more times. Notice that A7 is the same as the Stack Pointer that's because A7 is the Stack Pointer.", "D6 : FFFFFFFF A6 : FFFFFFFF D7 : FFFFFFFF A7 : 000103FC"], "jumps": ["P3160", "P3100"]}, {"id": "P3160", "text": ["13.  Press the \"Up Arrow\" key on the 68000 keyboard five times.          The display should have advanced back to the beginning of           the register list.  If you are not back to the beginning, press             the key a few more times.  Before examining memory                        operations we will first take a look at Masking.", "13. Press the \"Up Arrow\" key on the 68000 keyboard five times. The display should have advanced back to the beginning of the register list. If you are not back to the beginning, press the key a few more times. Before examining memory operations we will first take a look at Masking.", "T S 2 1 0 X N Z V C 0 0 1 0 0 0 0 0 1 0 PC : 00000558 SP: 000103FCCC"], "jumps": ["P3170", "P3100"]}, {"id": "P3170", "text": ["Masking is used to change bits in a data word or longword without affecting other bits in the word.  There are three logic functions used in masking: AND, OR and XOR.  The AND function is used to set bits to zero, the OR function to set bits to one and XOR to invert bits.", "Masking is used to chang
