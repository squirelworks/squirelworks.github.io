test). 2. Check the gate-to-drain junction (TP3 to TP4). Infinity ohms (ohmmeter) or no current flow (diode test)."], "jumps": []}, {"id": "P14412", "text": ["Remember, you should measure infinity resistance or no current flow across the gate to the source or drain and measure between 0 and infinity or some current flow from the source to drain.", "Remember, you should measure infinity resistance or no current flow across the gate to the source or drain and measure between 0 and infinity or some current flow from the source to drain..."], "jumps": []}, {"id": "P14411", "text": [], "jumps": []}, {"id": "P14410", "text": ["Is the transistor operating correctly?", "Is the transistor operating correctly?....................."], "jumps": ["P14415"]}, {"id": "P14400", "text": ["1.  Press Enter to Set: PC1 DC Power Switch - OFF", "1. Press Enter to Set: PC1 DC Power Switch - OFF.........................."], "jumps": ["P14390"]}, {"id": "P14395", "text": ["Vcc - Measure for Vcc at TP7 on PC130-50. It should be a smooth +12 volts."], "jumps": []}, {"id": "P14392", "text": ["Ensure you are measuring for DC volts at TP7.", "Ensure you are measuring for DC volts at TP7..............."], "jumps": []}, {"id": "P14391", "text": [], "jumps": []}, {"id": "P14390", "text": ["Is Vcc present?", "Is Vcc present? question is typed.........................."], "jumps": ["P14380", "P14395"]}, {"id": "P14382", "text": ["The measured output signal at TP6 is not correct.", "The measured output signal at TP6 is not correct..........."], "jumps": []}, {"id": "P14381", "text": [], "jumps": []}, {"id": "P14380", "text": ["Is the crystal oscillator operating correctly?", "Is the crystal oscillator operating correctly?............."], "jumps": ["P14365"]}, {"id": "P14370", "text": ["The crystal oscillator has been repaired. Let's try one more fault.  The computer will insert the malfunction.", "The crystal oscillator has been repaired. Let's try one more fault. The computer will insert the malfunction."], "jumps": ["P14360"]}, {"id": "P14365", "text": ["NORMAL OPERATION - Measure the output frequency at TP6 and compare to the frequency of the crystal."], "jumps": []}, {"id": "P14362", "text": ["Check that you are using your test equipment correctly. You should have measured 1 MHz at TP6 which is the correct frequency."], "jumps": []}, {"id": "P14361", "text": [], "jumps": []}, {"id": "P14360", "text": ["3.  Repeat step 1 and check for normal operation of the oscillator       circuit. \n     Is the Crystal oscillator operating correctly?", "3. Repeat step 1 and check for normal operation of the oscillator circuit. Is the Crystal oscillator operating correctly?"], "jumps": ["P14365"]}, {"id": "P14350", "text": ["1.  Ensure that the ohmmeter is not connected to the circuit.\n2.  Press Enter to Set: PC1 DC Power Switch - ON", "1. Ensure that the ohmmeter is not connected to the circuit. 2. Press Enter to Set: PC1 DC Power Switch - ONN"], "jumps": []}, {"id": "P14340", "text": ["L1 appears to be open because you measured infinity ohms across TP4 and TP7. The computer will now replace L1."], "jumps": ["P14330"]}, {"id": "P14334", "text": ["Check your ohms reading across TP4 and TP7. You should have measured infinity ohms. This does not indicated a shorted L1."], "jumps": []}, {"id": "P14333", "text": ["Check your ohms reading across TP1 and TP3. You should have measured  approximately 1 MW. This does not indicate an open R1.", "Check your ohms reading across TP1 and TP3. You should have measured approximately 1 MW. This does not indicate an open R1.."], "jumps": []}, {"id": "P14332", "text": ["Check your ohms reading across TP1 and TP3. You should have measured  approximately 1 MW. This does not indicate a short across R1 or C1.", "Check your ohms reading across TP1 and TP3. You should have measured approximately 1 MW. This does not indicate a short across R1 or C1.."], "jumps": []}, {"id": "P14331", "text": [], "jumps": []}, {"id": "P14330", "text": ["Which component is faulted?", "Which component is faulted? typed.........................."], "jumps": []}, {"id": "P14326", "text": ["L1 (TP4 to TP7) - An open L gives an infinity ohms reading. A shorted L gives a 0 ohm reading."], "jumps": []}, {"id": "P14325", "text": ["R1 (TP3 to TP1) and C1 (TP3 to TP1) - Since R1 and C1 are in parallel, a short in any component will give a 0 ohms reading. An open C can not be determined. An open R will give infinity ohms reading."], "jumps": []}, {"id": "P14320", "text": ["R1 - Open or Short C1 - Short L1 - Open or Short", "4. Step 4, check the feedback circuit. Since power is already OFF (the computer will isolate components for you), use a multimeter to check: R1 & C1 - TP1 to TP3 L1 - TP4 to TP7"], "jumps": ["P14310", "P14325"]}, {"id": "P14315", "text": ["SEMICONDUCTOR CHECK OUT - Check the Gate-to-Source and Gate-to-Drain junctions. Infinite resistance or no current flow should be measured in both polarities. Some resistance or current flow should be measured between the source and drain."], "jumps": []}, {"id": "P14312", "text": ["Check Q1 junctions again. You should read infinity or no current flow between the gate and the other two elements and some value of resistance or current flow between the source and drain.", "Check Q1 junctions again. You should read infinity or no current flow between the gate and the other two elements and some value of resistance or current flow between the source and drain.M"], "jumps": []}, {"id": "P14311", "text": [], "jumps": []}, {"id": "P14310", "text": ["Is the semiconductor component operating correctly? (Infinity between gate and source or drain, resistance between source and drain).", "Is the semiconductor component operating correctly? (Infinity or no current flow between gate and source or drain, resistance or current flow between source and drain)."], "jumps": ["P14300", "P14315"]}, {"id": "P14305", "text": ["MEASUREMENT SETUP - Q1 - Gate to Source - TP3 to TP2 - Gate to Drain - TP3 to TP4 - Source to Drain - TP2 to TP4"], "jumps": []}, {"id": "P14300", "text": ["Test the junctions of Q1 using an analog multimeter set to the X10  or X100 range or a digital meter using the diode test mode.", "Test the junctions of Q1 using an analog multimeter set to the X10 or X100 range or a digital meter using the diode test mode.", "Q1 Gate to Source, TP3 to TP2 Gate to Drain, TP3 to TP4 Source to Drain, TP2 to TP4"], "jumps": ["P14310", "P14280", "P14305"]}, {"id": "P14290", "text": ["Also, check the source to drain. You should measure some value, not 0 (short) or infinity (open).  The lead polarity should", "Also, check the source to drain. You should measure some value, not 0 (short) or infinity (open). The lead polarity should", "Also, check the source to drain. You should measure some value, not 0 (short) or infinity (open). The lead polarity should make no difference..."], "jumps": ["P14300", "P14280"]}, {"id": "P14280", "text": ["Using an ohmmeter you should measure high resistance regardless of the polarities of the meter leads. The diode mode of a digital meter should indicate no current flow in either direction. Any low measurement using either testing method is an indication of a faulty device."], "jumps": ["P14290", "P14240"]}, {"id": "P14270", "text": ["To check out this type of FET, you check for shorts between the gate and the source/drain elements.  Shorts are the most common fault.", "To check out this type of FET, you check for shorts between the gate and the source/drain elements. Shorts are the most common fault."], "jumps": ["P14280", "P14240"]}, {"id": "P14260", "text": ["The space indicates that there is an insulator between the gate and the source or drain elements. The FET is an insulated gate FET."], "jumps": ["P14270", "P14240"]}, {"id": "P14250", "text": ["It is not a standard FET. It is a MOSFET, notice the space between the gate and the source or drain in the schematic symbol."], "jumps": ["P14260", "P14240"]}, {"id": "P14240", "text": ["The transistor used in this oscillator can not be checked using an ohmmeter."], "jumps": ["P14250"]}, {"id": "P14230", "text": ["3.  Step 3, check the semiconductor components.\n4.  Press Enter to Set: PC1 DC Power Switch - OFF", "3. Step 3, check the semiconductor components. 4. Press Enter to Set: PC1 DC Power Switch - OFF"], "jumps": ["P14220"]}, {"id": "P14222", "text": ["Ensure that you're using your test equipment correctly. You should  have measured +12 volts DC on TP7.", "Ensure that you're using your test equipment correctly. You should have measured +12 volts DC on TP7."], "jumps": []}, {"id": "P14221", "text": [], "jumps": []}, {"id": "P14220", "text": ["Is Vcc present?", "Is Vcc present? question is typed.........................."], "jumps": ["P14210"]}, {"id": "P14210", "text": ["2.  Step 2, check for Vcc. Measure the voltage at PC130-50 TP7           with a  multimeter or use an oscilloscope set to measure DC.", "2. Step 2, check for Vcc. Measure the voltage at PC130-50 TP7 with a multimeter or use an oscilloscope set to measure DC."], "jumps": ["P14220", "P14200"]}, {"id": "P14205", "text": ["NORMAL OPERATION - The measured output signal should be within", "10% of the frequency indicated on the crystal, 1 MHz."], "jumps": []}, {"id": "P14202", "text": ["You should have measured no output signal at TP6. This indicates the circuit is not operating correctly."], "jumps": []}, {"id": "P14201", "text": [], "jumps": []}, {"id": "P14200", "text": ["Is the Crystal oscillator circuit working correctly?", "Is the Crystal oscillator circuit working correctly?......."], "jumps": ["P14190", "P14205"]}, {"id": "P14190", "text": ["1.  Step 1, check for normal operation. Measure the frequency of        the output signal at TP6 on PC130-50.", "1. Step 1, check for normal operation. Measure the frequency of the output signal at TP6 on PC130-50."], "jumps": ["P14200"]}, {"id": "P14180", "text": ["The Crystal oscillator circuit is operating normally. The computer will now insert a fault."], "jumps": ["P14170"]}, {"id": "P14172", "text": ["Ensure you are using your test equipment correctly. The  \n      frequency measured at TP6 should be 1 Mhz.  Ensure the \n      oscilloscope probe is set to X10 to reduce circuit loading \n      and R3 is fully CW.", "Ensure you are using your test equipment correctly. The frequency measured at TP6 should be 1 Mhz. Ensure the oscilloscope probe is set to X10 to reduce circuit loading and R3 is fully CW."], "jumps": []}, {"id": "P14171", "text": [], "jumps": []}, {"id": "P14170", "text": ["Is the oscillator operating correctly within \u00b110% of 1 MHz?", "Is the oscillator operating correctly within"], "jumps": ["P14162"]}, {"id": "P14165", "text": ["MEASUREMENT SETUP - Measure the frequency at TP6."], "jumps": []}, {"id": "P14162", "text": ["1.  Measure the frequency at TP6 on PC130-50. Use an                          oscilloscope or frequency counter if one is available.", "1. Measure the frequency at TP6 on PC130-50. Use an oscilloscope or frequency counter if one is available.."], "jumps": ["P14170", "P14150", "P14165"]}, {"id": "P14160", "text": ["1.  Measure the frequency at TP6 on PC130-50. Use an                          oscilloscope or frequency counter if one is available.", "1. Measure the frequency at TP6 on PC130-50. Use an oscilloscope or frequency counter if one is available."], "jumps": ["P14170", "P14150", "P14165"]}, {"id": "P14150", "text": ["The frequency indicated on the top of the crystal is 1.000 MHz. If the oscillator is functioning normally, this frequency should be on TP6. If no output is present ensure R3 is fully CW and the oscilloscope probe is set to X10 to reduce circuit loading."], "jumps": ["P14160"]}, {"id": "P14140", "text": ["5.  Press Enter to Set: PC1 DC Power Switch - ON \n     The experiment is now setup. Let's verify normal operation              before inserting a fault.", "5. Press Enter to Set: PC1 DC Power Switch - ON The experiment is now setup. Le ..............."], "jumps": ["P3410"]}, {"id": "P3416", "text": ["TRANSISTOR OPERATION 3. Check the source-to-drain junction (TP2 to TP4). Between 0 and infinite resistance or some current flow....................."], "jumps": []}, {"id": "P3415", "text": ["TRANSISTOR OPERATION 1. Check the gate-to-source junction (TP3 to TP2). Infinity ohms (ohmmeter) or no current flow (diode test). 2. Check the gate-to-drain junction (TP3 to TP4). Infinity ohms (ohmmeter) or no current flow (diode test)."], "jumps": []}, {"id": "P3412", "text": ["Remember, you should measure infinity resistance or no current flow across the gate to the source or drain and measure between 0 and infinity or some current flow from the source to drain."], "jumps": []}, {"id": "P3411", "text": [], "jumps": []}, {"id": "P3410", "text": ["Is the transistor operating correctly?", "Is the transistor operating correctly?....................."], "jumps": ["P3400", "P3415"]}, {"id": "P3400", "text": ["1.  Turn PC1 DC Power switch to OFF.", "1. Turn PC1 DC Power switch to OFF.l to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P3390"]}, {"id": "P3395", "text": ["Vcc - Measure for Vcc at TP7 on PC130-50. It should be a smooth +12 volts."], "jumps": []}, {"id": "P3392", "text": ["Ensure you are measuring for DC volts at TP7.", "Ensure you are measuring for DC volts at TP7..............."], "jumps": []}, {"id": "P3391", "text": [], "jumps": []}, {"id": "P3390", "text": ["Is Vcc present?", "Is Vcc present? question is typed.........................."], "jumps": ["P3380", "P3395"]}, {"id": "P3382", "text": ["The measured output signal at TP6 is not correct.", "The measured output signal at TP6 is not correct..........."], "jumps": []}, {"id": "P3381", "text": [], "jumps": []}, {"id": "P3380", "text": ["Is the crystal oscillator operating correctly?", "Is the crystal oscillator operating correctly?............."], "jumps": ["P3370", "P3365"]}, {"id": "P3370", "text": ["The crystal oscillator has been repaired. Let's try one more fault. The computer will insert the malfunction.", "The crystal oscillator has been repaired. Let's try one more fault. The computer will insert the malfunction. ternal program = SCAN FTR 0 F1 07........................................"], "jumps": ["P3360"]}, {"id": "P3365", "text": ["NORMAL OPERATION - Measure the output frequency at TP6 and compare to the frequency of the crystal."], "jumps": []}, {"id": "P3362", "text": ["Check that you are using your test equipment correctly. You should have measured 1 MHz at TP6 which is the correct frequency."], "jumps": []}, {"id": "P3361", "text": [], "jumps": []}, {"id": "P3360", "text": ["3.  Repeat step 1 and check for normal operation of the oscillator       circuit.\n     Is the Crystal oscillator operating correctly?", "3. Repeat step 1 and check for normal operation of the oscillator circuit. Is the Crystal oscillator operating correctly??"], "jumps": ["P3350", "P3365"]}, {"id": "P3350", "text": ["1.  Ensure that the ohmmeter is not connected to the circuit.\n2.  Turn PC1 DC Power switch to ON.", "1. Ensure that the ohmmeter is not connected to the circuit. 2. Turn PC1 DC Power switch to ON."], "jumps": ["P3340"]}, {"id": "P3340", "text": ["L1 appears to be open because you measured infinity ohms across TP4 and TP7. The computer will now replace L1.", "L1 appears to be open because you measured infinity ohms across TP4 and TP7. The computer will now replace L1. ternal program = SCAN FTR 0 C1 00......................................."], "jumps": ["P3330"]}, {"id": "P3334", "text": ["Check your ohms reading across TP4 and TP7. You should have measured  infinity ohms. This does not indicated a shorted L1.", "Check your ohms reading across TP4 and TP7. You should have measured infinity ohms. This does not indicated a shorted L1."], "jumps": []}, {"id": "P3333", "text": ["Check your ohms reading across TP1 and TP3. You should have measured approximately 1 M W. This does not indicate an open R1.", " correctly."], "jumps": []}, {"id": "P2301", "text": ["Is the RC Phase Shift oscillator operating correctly (\u00b110% of 1.06 kHz)?", "Is the RC Phase Shift oscillator operating correctly ("], "jumps": ["P2290"]}, {"id": "P2290", "text": ["1.  Turn PC1 DC Power switch to ON. \n2.  Measure the output signal at TP10 on PC130-37.", "1. Turn PC1 DC Power switch to ON. 2. Measure the output signal at TP10 on PC130-37."], "jumps": ["P2280"]}, {"id": "P2280", "text": ["To ensure that there are no other faults and the oscillator circuit is fully functional, perform the normal check of the circuit."], "jumps": ["P2290", "P2260"]}, {"id": "P2270", "text": ["The computer will now replace Q1.", "The computer will now replace Q1. ernal program = SCAN FTR 0 C1 00 ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2260"]}, {"id": "P2260", "text": ["You measured an open on Q1's base-to-emitter junction. Q1 is faulted."], "jumps": ["P2270", "P2250"]}, {"id": "P2252", "text": ["Q2 should have checked out OK. Check Q1 again!", "Q2 should have checked out OK. Check Q1 again!!!!!!!!!!!!.."], "jumps": []}, {"id": "P2251", "text": ["Which semiconductor component is faulted?", "Which semiconductor component is faulted?.................."], "jumps": ["P2240"]}, {"id": "P2245", "text": ["SEMICONDUCTOR CHECK OUT - Using an ohmmeter or a diode tester in a digital meter check the Base-to-emitter and Base-to-Collector junctions for forward and reverse bias operation."], "jumps": []}, {"id": "P2242", "text": ["Check the Q1 junctions again. Remember, you will read a low  resistance or current flow in one direction when forward biased and a low resistance or no current flow when reverse biased when the multimeter leads are reversed.", "Check the Q1 junctions again. Remember, you will read a low resistance or current flow in one direction when forward biased and a low resistance or no current flow when reverse biased when the multimeter leads are reversed............................................................."], "jumps": []}, {"id": "P2241", "text": ["Do the semiconductor components operate correctly?", "Do the semiconductor components operate correctly?.........", "MEASUREMENT SETUP - Q1 - Base to emitter - TP6 to TP2 Base to collector - TP6 to TP7 Q2 - Base to emitter - TP8 to TP9 Base to Collector - TP8 to TP11"], "jumps": ["P2230", "P2245"]}, {"id": "P2230", "text": ["Measure the forward and reverse biased resistance of Q1 and Q2 using an analog multimeter set to the X10 or X100 range or.", "Measure the forward and reverse biased resistance of Q1 and Q2 using an analog multimeter set to the X10 or X100 range or. 3", "Q1 Base to emitter, TP6 to TP2 Base to collector, TP6 to TP7 Q2 Base to emitter, TP8 to TP9 Base to collector, TP8 to TP11 hgjhsdgfjhagsdfhgashghsdg dfmsdfbdfk dbfnbasdmfbmdbf sdjfbmdfd njjdfhajshfd nsmdfnaksndfj sdfbjksdbf dfshd", "Measure the forward and reverse biased resistance of Q1 and Q2 using an analog multimeter set to the X10 or X100 range or a digital meter set to test diode junctions."], "jumps": ["P2240", "P2220", "P2235"]}, {"id": "P2220", "text": ["3.  Step 3, check the semiconductor components. \n     Place PC1 DC Power switch to OFF.", "3. Step 3, check the semiconductor components. Place PC1 DC Power switch to OFF.."], "jumps": ["P2210"]}, {"id": "P2212", "text": ["Ensure that you are using your test equipment correctly. You should have measured +12 volts DC on TP11."], "jumps": []}, {"id": "P2211", "text": ["Is Vcc present?", "Is Vcc present? question is typed.........................."], "jumps": ["P2200"]}, {"id": "P2200", "text": ["2.  Step 2, check for Vcc. \n     Measure the voltage at PC130-37 TP11 with a multimeter or             use an oscilloscope set up to measure DC.", "2. Step 2, check for Vcc. Measure the voltage at PC130-37 TP11 with a multimeter or use an oscilloscope set up to measure DC."], "jumps": ["P2210", "P2190"]}, {"id": "P2195", "text": ["NORMAL OPERATION - The measured output signal should be within", "10% of the calculated output frequency of 1.06 kHz."], "jumps": []}, {"id": "P2192", "text": ["You should have measured no output signal at TP10. This indicates that the circuit is not operating correctly!"], "jumps": []}, {"id": "P2191", "text": ["Is the RC Phase Shift oscillator circuit working correctly?"], "jumps": ["P2180", "P2195"]}, {"id": "P2180", "text": ["1.  Step 1, check for normal operation. Measure the frequency of         the output signal at TP10 on PC130-37 using an oscilloscope \n      with a X10 probe or a frequency counter.", "1. Step 1, check for normal operation. Measure the frequency of the output signal at TP10 on PC130-37 using an oscilloscope with a X10 probe or a frequency counter."], "jumps": ["P2190", "P2170"]}, {"id": "P2170", "text": ["The circuit is operating correctly. Now the computer will insert a fault.", "The circuit is operating correctly. Now the computer will insert a fault. External program = SCAN FTR 0 F1 059. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2160"]}, {"id": "P2165", "text": ["Formula Value Where: R1 = R1B + R1A = 10 kW R2 = R2 = 10 kW R3 = R3 = 10 kW C1 = C1A = .005 mF C2 = C2 = .005 mF C3 = C3 = .005 mF", "CALCULATED FREQUENCY - Use one of these two formulas: 1 1", "= 2p(R1 x C1) + (R2 x C2) + (R3 x C3) 3 (2pRc)"], "jumps": []}, {"id": "P2162", "text": ["Your measured frequency should be \u00b110% of the calculated frequency for normal operation of the oscillator circuit.", "10% of the calculated frequency for normal operation of the oscillator circuit."], "jumps": []}, {"id": "P2161", "text": ["Is the measured frequency \u00b110% of 1.06 kHz (the calculated frequency)?", "10% of 1.06 kHz (the calculated frequency)?"], "jumps": ["P2150", "P2165"]}, {"id": "P2155", "text": ["MEASUREMENT SETUP - Measure the frequency output at TP10."], "jumps": []}, {"id": "P2150", "text": ["1.  Measure the frequency output at PC130-37 TP10. You may             use an oscilloscope with a X10 probe or a frequency counter \n     (if available).", "1. Measure the frequency output at PC130-37 TP10. You may use an oscilloscope with a X10 probe or a frequency counter (if available)."], "jumps": ["P2160", "P2145", "P2155"]}, {"id": "P2145", "text": ["7.  Turn PC1 DC Power switch to ON.  \n     The experiment is now setup. Let's check this RC Phase Shift       oscillator for normal operation.", "7. Turn PC1 DC Power switch to ON. The experiment is now setup. Let's check this RC Phase Shift oscillator for normal operation....................."], "jumps": ["P2140"]}, {"id": "P2140", "text": ["6.  Set the Positive Supply Voltage to 12.", "6. Set the Positive Supply Voltage to 12.................................."], "jumps": ["P2130"]}, {"id": "P2130", "text": ["5.  Using your multimeter, adjust R1B for a reading of 10 kW as           measured across TP4 and TP1.", "5. Using your multimeter, adjust R1B for a reading of 10 kW as measured across TP4 and TP1..", "MEASUREMENT SETUP - S1 to the F2 position Rotate R10 to mid range (arrow pointing to the right)"], "jumps": ["P2140", "P2120"]}, {"id": "P2120", "text": ["3.  Place S1 on PC130-37 to the F2 position.\n4.  Rotate R10 on PC130-37 to mid range (arrow pointing to the           right).", "3. Place S1 on PC130-37 to the F2 position. 4. Rotate R10 on PC130-37 to mid range (arrow pointing to the right)."], "jumps": ["P2130", "P2110", "P2125"]}, {"id": "P2110", "text": ["2.  Carefully plug PC130-37 into the Test Console PC1 position.", "2. Carefully plug PC130-37 into the Test Console PC1 position."], "jumps": ["P2120", "P2100"]}, {"id": "P2100", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P2040"]}, {"id": "P2090", "text": ["R10  is a variable resistor that is used to adjust the output amplitude of  the buffer amp. Let's start the experiment.", "R10 is a variable resistor that is used to adjust the output amplitude of the buffer amp. Let's start the experiment."], "jumps": ["P2100", "P2040"]}, {"id": "P2080", "text": ["R1B is a variable resistor that is used to vary the resistance of the first RC lead network, changing the frequency."], "jumps": ["P2090", "P2040"]}, {"id": "P2070", "text": ["The different value capacitors change the frequency of the oscillator."], "jumps": ["P2080", "P2040"]}, {"id": "P2060", "text": ["Note that S1 selects between two capacitors, C1A and C1B."], "jumps": ["P2070", "P2040"]}, {"id": "P2050", "text": ["Compare the card with the schematic shown."], "jumps": ["P2060", "P2040"]}, {"id": "P2040", "text": ["Pick up the PC130-37 card. This card is used to demonstrate typical faults in an RC Phase Shift oscillator."], "jumps": ["P2050", "P2030"]}, {"id": "P2030", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["The purpose of this experiment is to demonstrate troubleshooting RC Phase Shift oscillator circuits."], "jumps": ["P2030", "P2001"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary.  \nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1920"]}, {"id": "P1960", "text": ["5. Last, check the output circuit."], "jumps": ["P1999", "P1920"]}, {"id": "P1950", "text": ["4. Then check the feedback circuit with an ohmmeter."], "jumps": ["P1960", "P1920"]}, {"id": "P1940", "text": ["3.  Then with power OFF, check the semiconductor components.", "3. Then with power OFF, check the semiconductor components."], "jumps": ["P1950", "P1920"]}, {"id": "P1930", "text": ["2.  If an oscillator is faulted, check Vcc to ensure correct supply         voltage.", "2. If an oscillator is faulted, check Vcc to ensure correct supply voltage."], "jumps": ["P1940", "P1920"]}, {"id": "P1920", "text": ["1.  Most faults in sine wave oscillator circuits cause no output             from the circuit.", "1. Most faults in sine wave oscillator circuits cause no output from the circuit."], "jumps": ["P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on SINE WAVE OSCILLATOR FAULTS."], "jumps": ["P1001", "P1300"]}, {"id": "P1303", "text": ["The output circuit is checked after the feedback circuit. The output circuit is the last circuit to be checked."], "jumps": []}, {"id": "P1302", "text": ["The feedback circuit is checked after Vcc is checked. Remember, if  Vcc is not present, the entire circuit will not operate.", "The feedback circuit is checked after Vcc is checked. Remember, if Vcc is not present, the entire circuit will not operate."], "jumps": []}, {"id": "P1301", "text": [], "jumps": []}, {"id": "P1300", "text": ["Before a semiconductor is checked, check the _______", "Before a semiconductor is checked, check the _______......."], "jumps": ["P1290"]}, {"id": "P1293", "text": ["Semiconductors are checked by forward measuring resistance, a voltmeter only measures voltage.", "Semiconductors are checked by alternately forward biasing and reverse biasing the junction while monitoring for resistance or current flow to change during the process. Volt meters only measure voltage....................................."], "jumps": []}, {"id": "P1292", "text": ["Remember, to check a semiconductor for correct operation, you use a multimeter or ohmmeter to measure the base-to emitter and base-to-collector junctions and circuit power can not be ON as the meter internal battery must be used."], "jumps": []}, {"id": "P1291", "text": [], "jumps": []}, {"id": "P1290", "text": ["When checking the operation of a semiconductor, you must\n_______", "When checking the operation of a semiconductor, you must _______"], "jumps": ["P1270"]}, {"id": "P1270", "text": ["Use this troubleshooting method as a guide to help you troubleshoot sine wave oscillator circuits. This is not the only method, and you may develop your own techniques as you become a proficient troubleshooter.", "Use this troubleshooting method as a guide to help you troubleshoot sine wave oscillator circuits. This is not the only method, and you may develop your own techniques as you become a proficient troubleshooter...", "1. Output 2. Vcc 3. Semiconductors 4. Feedback circuit 5. Output circuits"], "jumps": ["P1290", "P1260"]}, {"id": "P1260", "text": ["Resistance measurements will isolate the fault to a component."], "jumps": ["P1270", "P1230"]}, {"id": "P1250", "text": ["Remember, if a transistor is in the output circuit, it has already been checked."], "jumps": ["P1260", "P1230"]}, {"id": "P1240", "text": ["If the feedback circuit is not faulted, then check the output circuit."], "jumps": ["P1250", "P1230"]}, {"id": "P1230", "text": ["If the feedback circuit is faulted, replace the faulted component and check for normal operation."], "jumps": ["P1240", "P1180"]}, {"id": "P1220", "text": ["To check the crystal, replace it and then check for normal operation."], "jumps": ["P1230", "P1180"]}, {"id": "P1210", "text": ["In Crystal controlled oscillators, all the components can be checked, as in a RC Phase Shift oscillator, except the crystal.", "In Crystal controlled oscillators, all the components can be checked, as in a RC Phase Shift oscillator, except the crystal.U", "In Crystal controlled oscillators, all the components can be checked, as in an RC Phase Shift oscillator, except the crystal."], "jumps": ["P1220", "P1180"]}, {"id": "P1200", "text": ["Open capacitors can only be detected by testing with an RCL bridge or replacing the capacitors one at a time."], "jumps": ["P1210", "P1180"]}, {"id": "P1190", "text": ["Due to the construction of the circuit, the resistors are isolated by the capacitors."], "jumps": ["P1200", "P1180"]}, {"id": "P1180", "text": ["In the RC Phase Shift oscillator, resistance measurements determine open, shorted or changed value resistors and shorted capacitors."], "jumps": ["P1190", "P1160"]}, {"id": "P1170", "text": ["If the transistor checks out good,  then check the feedback circuit.", "If the transistor checks out good, then check the feedback circuit."], "jumps": ["P1180", "P1160"]}, {"id": "P1160", "text": ["If the transistor checks out bad, replace the transistor and check for normal operation."], "jumps": ["P1170", "P1152"]}, {"id": "P1155", "text": ["LEAD POLARITY - A low resistance reading is obtained when the transistor is forward biased and using an analog meter. A digital meter in the diode test mode will indicate current flow when forward biased. Power must be removed as the meter's internal battery is the power source."], "jumps": []}, {"id": "P1152", "text": ["And low resistance or current flow with the leads reversed. The actual polarity of the leads when performing the test is not important. But each junction should show low resistance or allow current flow when forward biased and high resistance or no current flow when reverse biased."], "jumps": ["P1160", "P1110", "P1155"]}, {"id": "P1150", "text": ["And low resistance or cthe other way. The actual polarity is not important. The fact that you get two different readings is.", "And low resistance or current flow with the leads reversed. The actual polarity of the leads when performing the test is not important. But each junction should show low resistance or allow current flow when forward biased and high resistance or no current flow when reverse biased.."], "jumps": ["P1160", "P1110", "P1155"]}, {"id": "P1140", "text": ["The same test holds true for the Base-to-Collector junction.  High resistance or no current flow with the leads in one pway.", "The same test holds true for the Base-to-Collector junction. High resistance or no current flow with the leads in one pway.", "The same test holds true for the Base-to-Collector junction. High resistance or no current flow with the leads in one position.,.."], "jumps": ["P1150", "P1110"]}, {"id": "P1130", "text": ["And the junction should read low resistance (analog) or currfor the opposite lead  polarity.", "And the junction should read low resistance (analog) or currfor the opposite lead polarity.", "And the junction should read low resistance (analog) or current flow (digital) when the lead polarity is reversed......"], "jumps": ["P1140", "P1110"]}, {"id": "P1120", "text": ["Using an analog meter the Base-to-Emitter junction should read a high resistance for one lead polarity. Using a digital meter in the diode test mode the meter should indicate no current flow in one direction."], "jumps": ["P1130", "P1110"]}, {"id": "P1110", "text": ["To check a transistor, disconnect power and perform measurements using a multimeter. An analog meter set to the resistance RX10 or RX100 scale, or the diode test function of a digital meter will verify the condition of the device."], "jumps": ["P1120", "P1070"]}, {"id": "P1100", "text": ["Remember, the amplifier circuit is normally a transistor and the output circuit may contain a transistor amplifier."], "jumps": ["P1110", "P1070"]}, {"id": "P1090", "text": ["If Vcc is present, the next step is to check the semiconductor components."], "jumps": ["P1100", "P1070"]}, {"id": "P1080", "text": ["If Vcc is not present, troubleshoot the power supply for the oscillator."], "jumps": ["P1090", "P1070"]}, {"id": "P1070", "text": ["Once you have measured the output of the circuit and determined it to be incorrect, measure Vcc to ensure correct supply voltage."], "jumps": ["P1080", "P1020"]}, {"id": "P1060", "text": ["Since many different faults could cause the same symptoms, a basic troubleshooting method is needed."], "jumps": ["P1070", "P1020"]}, {"id": "P1050", "text": ["Usually, an interruption anywhere in the oscillator results in no output."], "jumps": ["P1060", "P1020"]}, {"id": "P1040", "text": ["Incorrect Vcc, a malfunctioning amplifier, or a malfunctioning feedback circuit causes the signal at point B to be incorrect."], "jumps": ["P1050", "P1020"]}, {"id": "P1030", "text": ["For example, an incorrect signal at point B could be caused by a number of faults."], "jumps": ["P1040", "P1020"]}, {"id": "P1020", "text": ["Because Oscillators use a feedback loop, they can be difficult to troubleshoot."], "jumps": ["P1030", "P1001"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P440", "text": ["Let's begin the lesson on SINE WAVE OSCILLATOR TROUBLESHOOTING EXPERIMENT II."], "jumps": ["P400"]}, {"id": "P430", "text": ["An incorrect waveform indicates that the circuit is faulted."], "jumps": ["P440", "P400"]}, {"id": "P420", "text": ["Measuring the output signal with an oscilloscope will determine if the circuit is operating normally."], "jumps": ["P430", "P400"]}, {"id": "P410", "text": ["Both oscillators change the DC supply voltage into an AC voltage of a specific frequency."], "jumps": ["P420", "P400"]}, {"id": "P400", "text": ["In this lesson, you will troubleshoot a faulted RC Phase Shift and Crystal controlled oscillator."], "jumps": ["P410", "P300"]}, {"id": "P335", "text": [], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 480, 488, or Equivalent XXXXnt"], "jumps": []}, {"id": "P100", "text": ["w Describe typical faults in RC Phase Shift and Crystal oscillators. w Describe RC Phase Shift and Crystal oscillator troubleshooting procedures.", "1. RC Phase Shift and Crystal Oscillator Faults", "w Recognize that an RC Phase Shift Oscillator is faulted. w Identify the faulted component in an RC Phase Shift Oscillator.", "w Recognize that a Crystal Oscillator is faulted. w Identify the faulted component in a Crystal Oscillator................."], "jumps": []}, {"id": "P10
