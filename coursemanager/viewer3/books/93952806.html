const book = {"title": "93952806", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . .", "Title: ELECTRICAL CIRCUITS TROUBLESHOOTINGsdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["2. Electrical Circuit Troubleshooting Experiment", "w Recognize that an electrical circuit is faulted. w Identify the fault in a faulted electrical circuit.", "w Describe typical faults in an electrical circuit. w Describe electrical circuit troubleshooting procedures."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "5. Alligator to Alligator Jumper rator rator n Generator", "6. Nida Model 470 Oscilloscope XXXXXXXnt"], "jumps": []}, {"id": "P301", "text": [], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P335", "text": ["In this lesson you will learn about troubleshooting electrical circuits."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Locating faults in this circuit may seem complex."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["However, using the four step troubleshooting procedure that you learned in DC circuits makes finding faults easy."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["The size and complexity of the circuit does not change the troubleshooting process."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on ELECTRICAL CIRCUITS TROUBLESHOOTING..............."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": ["P440"]}, {"id": "P1001", "text": ["The most common faults in an electrical circuit is an open or shorted component."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["You have learned  the circuit effects of opened or shorted resistors, capacitors, inductors, transformers and relays.", "You have learned the circuit effects of opened or shorted resistors, capacitors, inductors, transformers and relays."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Basically, what is the effect of an opened component?", "Basically, what is the effect of an opened component? an opened component?", "Eliminates the component from the circuit."], "jumps": ["P1020"]}, {"id": "P1041", "text": [], "jumps": []}, {"id": "P1042", "text": ["An opened component is not eliminated from the circuit. Think about what happens to current flow through an opened resistor.", "An opened component is not eliminated from the circuit. Think about what happens to current through an opened resistor.", "An opened component is not eliminated from the circuit. Think about what happens to current flow through an opened resistor.."], "jumps": []}, {"id": "P1043", "text": ["An opened component does not increase or decrease resistance, a changed value component does.  However, you can say that an opened component does increase resistance to infinity!", "An opened component does not increase or decrease resistance, a changed value component does. However, you can say that an opened component does increase resistance to infinity!!!"], "jumps": []}, {"id": "P1050", "text": ["Basically, what is the effect of a shorted component?", "Basically, what is the effect of a shorted component?......", "Eliminates the component from the circuit."], "jumps": ["P1040"]}, {"id": "P1051", "text": [], "jumps": []}, {"id": "P1052", "text": ["A shorted component does not prevent current flow, it allows maximum current flow.", "A shorted component does not prevent current, it allows maximum current."], "jumps": []}, {"id": "P1053", "text": ["A shorted component does not increase or decrease resistance, a changed value component does.  However, you can say that a shorted component does decrease resistance to zero!", "The only component faults that you have not studied are the diode and LED.", "A shorted component does not increase or decrease resistance, a changed value component does. However, you can say that a shorted component does decrease resistance to zero!"], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["If a diode or LED opens, current flow is prevented like any other opened component.", "If a diode or LED opens, current is prevented like any other opened component."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["The CRs will not allow a voltage to be developed at TP4.  If one CR is open, the pulsating DC will be missing one cycle.", "The CRs will not allow a voltage to be developed at TP4. If one CR is open, the pulsating DC will be missing one cycle."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["The LEDs will not illuminate if opened."], "jumps": ["P1100", "P1060"]}, {"id": "P1100", "text": ["A shorted diode or LED acts as if the component was not in the circuit."], "jumps": ["P1110", "P1060"]}, {"id": "P1110", "text": ["A shorted CR would allow current flow to TP4 in both directions. The AC would not be converted to pulsating DC.", "A shorted CR would allow current to reach TP4 from both directions. The AC would not be converted to pulsating DC."], "jumps": ["P1120", "P1060"]}, {"id": "P1120", "text": ["A LED would not illuminate if shorted.", "Finding the faulty component in this large circuit would be difficult if you did not follow a logical procedure."], "jumps": ["P1130", "P1060", "P1140"]}, {"id": "P1140", "text": ["The four step procedure that you have learned can be used.", "The four step procedure that you have learned can be used.m"], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["Step 1. Analyze the Circuit.  \n              Find out if the circuit is operating correctly.", "To determine if the circuit operates correctly, you measure the output voltages on TP10 and observe the LEDs.", "Step 1. Analyze the Circuit. Find out if the circuit is operating correctly."], "jumps": ["P1160", "P1130", "P1170", "P1150"]}, {"id": "P1170", "text": ["With K1 de-energized, TP10 should measure an AC voltage and I2 should be illuminated.", "With K1 de-energized, TP10 should measure an AC voltage and I2 should be illuminated.."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["With K1 energized, TP10 should measure a DC voltage and I1 should be illuminated."], "jumps": ["P1190", "P1160"]}, {"id": "P1190", "text": ["Also,  I3 intensity should change when the frequency of the input changes.  The highest intensity is at resonance.", "Also, I3 intensity should change when the frequency of the input changes. The highest intensity is at resonance."], "jumps": ["P1200", "P1160"]}, {"id": "P1200", "text": ["If these conditions are met, the circuit is operating correctly."], "jumps": ["P1210", "P1160"]}, {"id": "P1210", "text": ["If not, then the circuit is faulted.  Proceed to step 2.", "If not, then the circuit is faulted. Proceed to step 2."], "jumps": ["P1220", "P1160"]}, {"id": "P1220", "text": ["Step 2. Recheck the Setup.\n              Look for obvious faults in your circuit setup.", "If the AC input voltage is not present, then there is no way that the circuit can operate correctly.", "Step 2. Recheck the Setup. Look for obvious faults in your circuit setup."], "jumps": ["P1230", "P1160", "P1240", "P1220"]}, {"id": "P1240", "text": ["If your set up is correct and the circuit is still faulted, proceed to step 3."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["Step 3. Measure and test the circuit. \n              Determine the possible fault or faults by making circuit                     measurements.", "Use the schematic of the circuit and make measurements using test equipment.", "Step 3. Measure and test the circuit. Determine the possible fault or faults by making circuit measurements."], "jumps": ["P1260", "P1230", "P1270", "P1250"]}, {"id": "P1270", "text": ["Use all the information gathered as a guide to circuit measurements."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["The voltage at TP10 is: \n- correct with K1 de-energized\n- incorrect with K1 energized", "The voltage at TP10 is: - correct with K1 de-energized - incorrect with K1 energizeddd"], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["There is no need to measure signals from TP1 in circuit 1 to TP5 in circuit 2."], "jumps": ["P1300", "P1260"]}, {"id": "P1300", "text": ["Check to see if K1 is faulted and if K1 is receiving the energizing  voltage when circuit 2 S1 is depressed.", "Check to see if K1 is faulted and if K1 is receiving the energizing voltage when circuit 2 S1 is depressed."], "jumps": ["P1310", "P1260"]}, {"id": "P1310", "text": ["Once you have identified an incorrect signal or voltage, determine why the signal or voltage is incorrect."], "jumps": ["P1320", "P1260"]}, {"id": "P1320", "text": ["Example: \n- incorrect voltage at TP4 circuit 2 \n- correct voltage at TP6 circuit 1", "Example: - incorrect voltage at TP4 circuit 2 - correct voltage at TP6 circuit 11111111111111111111111111"], "jumps": ["P1330", "P1260"]}, {"id": "P1330", "text": ["This indicates the fault is in the circuit between these two test points."], "jumps": ["P1340", "P1260"]}, {"id": "P1340", "text": ["Resistance measurements will determine which component is bad."], "jumps": ["P1350", "P1260"]}, {"id": "P1350", "text": ["Remember, there could be an open or short in the wiring from circuit 1 TP6 to circuit 2 TP4."], "jumps": ["P1360", "P1260"]}, {"id": "P1360", "text": ["Once you have found a probable fault, proceed to step 4."], "jumps": ["P1370", "P1260"]}, {"id": "P1370", "text": ["Step 4. Double-check the results.  \n              Verify the possible fault(s) that could cause the                                   symptoms discovered in step 1.", "Redraw the circuit with the possible fault included.  Can this fault cause the problem?", "Step 4. Double-check the results. Verify the possible fault(s) that could cause the symptoms discovered in step 1...", "Redraw the circuit with the possible fault included. Can this fault cause the problem?"], "jumps": ["P1380", "P1260", "P1390", "P1370"]}, {"id": "P1390", "text": ["If the answer is yes, you have located the fault."], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["Repair the fault and repeat step 1.  This ensures that the circuit has no other faults and is fully functional.", "Repair the fault and repeat step 1. This ensures that the circuit has no other faults and is fully functional."], "jumps": ["P1410", "P1380"]}, {"id": "P1410", "text": ["In which step of the four step troubleshooting procedure is a fault repaired?"], "jumps": ["P1380"]}, {"id": "P1411", "text": [], "jumps": []}, {"id": "P1412", "text": ["Step 1 is where you determine if the circuit is operating correctly."], "jumps": []}, {"id": "P1413", "text": ["Step 2 is where you check your setup.", "Step 2 is where you check your setup......................."], "jumps": []}, {"id": "P1414", "text": ["Step 3 is where you make measurements to determine possible faults."], "jumps": []}, {"id": "P1420", "text": ["In which step of the four step troubleshooting procedure is the operation of a circuit determined?"], "jumps": ["P1410"]}, {"id": "P1421", "text": [], "jumps": []}, {"id": "P1422", "text": ["Step 2 is where you check your setup.", "Step 2 is where you check your setup......................."], "jumps": []}, {"id": "P1423", "text": ["Step 3 is where you make measurements to determine possible faults."], "jumps": []}, {"id": "P1424", "text": ["Step 4 is where you double-check your results and repair the fault."], "jumps": []}, {"id": "P1430", "text": ["In which step of the four step troubleshooting procedure is a possible fault identified?"], "jumps": ["P1420"]}, {"id": "P1431", "text": [], "jumps": []}, {"id": "P1432", "text": ["Step 1 is where you determine if the circuit is operating correctly."], "jumps": []}, {"id": "P1433", "text": ["Step 2 is where you check your setup.", "Step 2 is where you check your setup......................."], "jumps": []}, {"id": "P1434", "text": ["Step 4 is where you double-check your results and repair the fault."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on ELECTRICAL CIRCUIT FAULTS.", "1.  Opens and shorts are typical faults in electrical circuits.", "1. Opens and shorts are typical faults in electrical circuits."], "jumps": ["P1001", "P1430", "P1930"]}, {"id": "P1930", "text": ["2.  Diodes and LEDs faults are the same as any component.", "2. Diodes and LEDs faults are the same as any component."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["4.  In step 3, the fault is located by finding where a signal goes            bad.", "3. Use the four step troubleshooting method.", "1. Analyze the circuit. 2. Check the set up. 3. Measure and test. 4. Double check your results.", "4. In step 3, the fault is located by finding where a signal goes bad."], "jumps": ["P1950", "P1920", "P1960", "P1940"]}, {"id": "P1960", "text": ["5.  Resistance measurements can be used to find the faulty                 component.", "5. Resistance measurements can be used to find the faulty component."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  The circuit wiring may also cause the fault.", "6. The circuit wiring may also cause the fault."], "jumps": ["P1999", "P1960"]}, {"id": "P1999", "text": ["You have completed the Summary.  You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1970"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["The purpose of this experiment is to troubleshoot a defective electrical circuit.  The circuit consists of two PC cards.", "Pick up the PC130-82 and PC130-83 cards.  You will troubleshoot these cards.                                                                                          Select a highlighted test point to observe the signal.", "Compare the cards with the schematic shown.", "PC130-82 contains the components that make up circuit 1.", "PC130-83 contains the components that make up circuit 2 and 3.", "In this experiment, you will not be directed to use the test equipment to make your measurements.", "The purpose of this experiment is to troubleshoot a defective electrical circuit. The circuit consists of two PC cards.", "Pick up the PC130-82 and PC130-83 cards. You will troubleshoot these cards. Select a highlighted test point to observe the signal.", "'}:5 t0H( 9E}A9As5/GA}A;aEAA}EAKE;AAaAE;A}AEAU;aA};aEAEA;EAAAEA;E;AaA", "EUaa 555G7EEEa::Ts1TA;;AA;EEA;AAa9:AAE;E;;;UaAA;AEEA;aA};AA9aAA}}};E;AA9E}9AA;}AAEaaA;AEAEaAAEEaAAA9EEAAA}EAE;aEEEAU;EE;Ea;}", "EK,,L17;UT9;EK;,=17=9EK;AaTs a7(aEAEas5:9<5", "mzF(tt-FsFF-cmzssttst|t--yTmVstys|tytts sm t syst"], "jumps": ["P2040", "P2001", "P2050", "P2020", "P2060", "P2070", "P2080", "P2100"]}, {"id": "P2100", "text": ["The schematic shows voltage signals and levels.  R4 and R6 in circuit 1 are variable.", "The schematic shows voltage signals and levels. R4 and R6 in circuit 1 are variable."], "jumps": ["P2110", "P2040"]}, {"id": "P2110", "text": ["The AC voltages are given in peak to peak values.", "The AC voltages are given in peak to peak values..........."], "jumps": ["P2120", "P2040"]}, {"id": "P2120", "text": ["Convert to RMS or average if using a multimeter.", "Convert to RMS or average if using a multimeter............"], "jumps": ["P2130", "P2110", "P2125"]}, {"id": "P2125", "text": ["RMS or AVERAGE - The multimeter that you are using may indicate RMS or average values for AC voltages. Check to see which one your multimeter uses."], "jumps": []}, {"id": "P2130", "text": ["Let's start the experiment.", "Let's start the experiment.e..............................."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["1.  Set the test console controls to their initial control settings.", "1. Set the test console controls to their initial control settings........"], "jumps": ["P2130"]}, {"id": "P2150", "text": ["2.  Carefully plug PC130-82 into the test console PC1 position. \n3.  Carefully plug PC130-83 into the test console PC2 position.", "2. Carefully plug PC130-82 into the test console PC1 position. 3. Carefully plug PC130-83 into the test console PC2 position.er switch to ON........................................."], "jumps": ["P2140"]}, {"id": "P2160", "text": ["4.  On PC130-82:", "4. On PC130-82: ernal program = SCAN FTR 0 F1 04 External program = SCAN FTR 0 F1 14 External program = SCAN FTR 0 F2 04 Speaker switch to ON.........................................", "A. Set switch S1 to inductive IND, (UP). B. Adjust R4 fully CW. C. Adjust R6 to mid range....."], "jumps": ["P2150"]}, {"id": "P2170", "text": ["5.  Connect the output of the function generator to PC2 OUTPUT        BNC. \n6.  Using the oscilloscope, set the function generator for a 1KHz        sine wave at 8 to Vpp.", "5. Connect the output of the function generator to PC2 OUTPUT BNC. 6. Using the oscilloscope, set the function generator for a 1KHz sine wave at 8 to Vpp..."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["7.  Place PC1 AC switch to ON.", "7. Place PC1 AC switch to ON.............................................."], "jumps": ["P2170"]}, {"id": "P2190", "text": ["Which LED is illuminated?", "Which LED is illuminated?is typed.........................."], "jumps": ["P2180", "P2195"]}, {"id": "P2191", "text": [], "jumps": []}, {"id": "P2192", "text": ["I1 only illuminates when K1 is energized indicating a DC output. On PC130-83, ensure that S1 is not depressed.  Press and release S2, K1 should not be energized.", "I1 only illuminates when K1 is energized indicating a DC output. On PC130-83, ensure that S1 is not depressed. Press and release S2, K1 should not be energized.."], "jumps": []}, {"id": "P2193", "text": ["I3 only illuminates around the resonant frequency of L1 and C1. 1 kHz is not the resonant frequency of L1 and C1.  Ensure that the function generator is set to 1 kHz.", "I3 only illuminates around the resonant frequency of L1 and C1. 1 kHz is not the resonant frequency of L1 and C1. Ensure that the function generator is set to 1 kHz."], "jumps": []}, {"id": "P2195", "text": ["- PC130-82 S1 set to IND - PC130-82 R4 fully CW - PC130-82 R6 mid range - PC1 AC switch in ON.", "MEASUREMENT SETUP - If none of the three LEDs are illuminated, there is a problem in your setup. Check that your setup is correct."], "jumps": []}, {"id": "P2200", "text": ["The circuit is setup.  Now, let's check to see if it is operating correctly before inserting a fault.", "1.  Measure the voltage at PC130-83 TP10 when K1 is\n     de-energized and energized.", "The circuit is setup. Now, let's check to see if it is operating correctly before inserting a fault.", "1. Measure the voltage at PC130-83 TP10 when K1 is de-energized and energized........ and energized."], "jumps": ["P2210", "P2190", "P2220", "P2200", "P2215"]}, {"id": "P2215", "text": ["MEASUREMENT SETUP - Carefully measure the output voltage at TP10."], "jumps": []}, {"id": "P2220", "text": ["2. Observe that the correct LED illuminates when K1 is\n    de-energized and energized.", "2. Observe that the correct LED illuminates when K1 is de-energized and energized..... and energized.."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["3.  Check I3's intensity as the frequency output of the function            generator changes.", "3. Check I3's intensity as the frequency output of the function generator changes."], "jumps": ["P2240", "P2220", "P2235"]}, {"id": "P2235", "text": ["MEASUREMENT SETUP - I3's intensity increases around 31.8 kHz.."], "jumps": []}, {"id": "P2240", "text": ["Is the circuit operating correctly?", "Is the circuit operating correctly?........................"], "jumps": ["P2230", "P2245"]}, {"id": "P2241", "text": [], "jumps": []}, {"id": "P2242", "text": ["The circuit should be operating correctly.  DC output and I2 illuminated when K1 is de-energized and I1 illuminated when K1 is energized.", "The circuit should be operating correctly. DC output and I2 illuminated when K1 is de-energized and I1 illuminated when K1 is energized."], "jumps": []}, {"id": "P2245", "text": ["- K1 de-energized; I2 illuminated; TP10 signal, AC - K1 energized; I1 illuminated; TP10 signal, DC - I3 brightest around 31.8 kHz - PC1 AC switch in ON."], "jumps": []}, {"id": "P2250", "text": ["Now that you know the circuit is working correctly, the computer may insert a fault.  Follow the four step troubleshooting procedures.", "Step 1. Analyze the circuit  \n              Measure the signal at PC130-83 TP10 and observe the                      LEDs when K1 is de-energized and energized.", "Now that you know the circuit is working correctly, the computer may insert a fault. Follow the four step troubleshooting procedures. External program = SCAN FTR 0 F1 13...............", "Step 1. Analyze the circuit Measure the signal at PC130-83 TP10 and observe the LEDs when K1 is de-energized and energized."], "jumps": ["P2240", "P2270", "P2250"]}, {"id": "P2270", "text": ["2.  Vary the frequency of the function generator and observe I3.", "2. Vary the frequency of the function generator and observe I3."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["Is the circuit operating correctly?", "Is the circuit operating correctly?........................"], "jumps": ["P2270", "P2245"]}, {"id": "P2281", "text": [], "jumps": []}, {"id": "P2282", "text": ["The circuit is faulted.  Check the voltage at PC130-83 TP10 when K1 is energized.  You should have measured 0V.", "The circuit is faulted. Check the voltage at PC130-83 TP10 when K1 is energized. You should have measured 0V."], "jumps": []}, {"id": "P2300", "text": ["Is the output correct at PC130-83 TP10 when K1 is de-energized and I2 illuminated?"], "jumps": ["P2280"]}, {"id": "P2301", "text": [], "jumps": []}, {"id": "P2302", "text": ["You should have measured an AC signal, at TP10 when K1 is\nde-energized and I2 should be illuminated.", "You should have measured an AC signal, at TP10 when K1 is de-energized and I2 should be illuminated.."], "jumps": []}, {"id": "P2310", "text": ["Did K1 energize when PC130-83 S1 was depressed, did you hear a click and did the correct LED illuminate?"], "jumps": ["P2300"]}, {"id": "P2311", "text": [], "jumps": []}, {"id": "P2312", "text": ["You should have heard a click from the relay when S1 was depressed."], "jumps": []}, {"id": "P2320", "text": ["Was the output at PC130-83 TP10 correct when K1 was energized?"], "jumps": ["P2310"]}, {"id": "P2321", "text": [], "jumps": []}, {"id": "P2322", "text": ["You should have measured 0 V at TP10 when K1 was energized.", "Since the output at TP10 is incorrect proceed to step 2.", "Since the output at TP10 is incorrect proceed to step 2...."], "jumps": ["P2320"]}, {"id": "P2340", "text": ["Step 2. Check the setup:  \n              1. Ensure that your setup is correct.", "Step 2. Check the setup: 1. Ensure that your setup is correct.", "- PC1 AC switch to ON - P , TP5 to ground..."], "jumps": ["P2432", "P2470", "P2450"]}, {"id": "P2470", "text": ["Is R2 shorted, measures 0 ohms?", "Is R2 shorted, measures 0 ohms?ed.........................."], "jumps": ["P2460"]}, {"id": "P2471", "text": [], "jumps": []}, {"id": "P2472", "text": ["You should have measured 4.7 kW. This is a correct measurement.", "This indicates that R1 is open.  If you measured the resistance of R1 you would measure approximately 5.9 kohms.", "This indicates that R1 is open. If you measured the resistance of R1 you would measure approximately 5.9 kohms."], "jumps": ["P2490", "P2470"]}, {"id": "P2490", "text": ["An open R1 would measure infinity and a good R1 would measure 470 ohms."], "jumps": ["P2500", "P2480"]}, {"id": "P2500", "text": ["The reading is due to alternate current paths.  R1 can't be isolated without de-soldering.", "The reading is due to alternate current paths. R1 can't be isolated without de-soldering."], "jumps": ["P2510", "P2480"]}, {"id": "P2510", "text": ["However, since R2 measured correctly, R1 has to be open.  Proceed to step 4.", "Step 4. Double-check results. \n              Place an open R1 in the circuit.", "However, since R2 measured correctly, R1 has to be open. Proceed to step 4.", "Step 4. Double-check results. Place an open R1 in the circuit."], "jumps": ["P2520", "P2480", "P2530"]}, {"id": "P2530", "text": ["Can an open R1 cause the symptoms that you saw in step 1?", "Can an open R1 cause the symptoms that you saw in step 1?.."], "jumps": ["P2520"]}, {"id": "P2531", "text": [], "jumps": []}, {"id": "P2532", "text": ["If R1 is open, the DC voltage to the second sets of contacts are not present.  The output of K1 would be 0 V when K1 is energized.", "If R1 is open, the DC voltage to the second sets of contacts are not present. The output of K1 would be 0 V when K1 is energized."], "jumps": []}, {"id": "P2540", "text": ["The computer will now replace R1.  \n1.  Place PC1 AC Switch to ON.", "The computer will now replace R1. 1 t an alligator to alligator cable between the ground TP and pin H on PC130-82. If a receptacle is present on pin H, no jumper is required."], "jumps": ["P13155"]}, {"id": "P13155", "text": ["MEASUREMENT SETUP - Connect an alligator to alligator cable between the ground TP and Pin H on PC130-82."], "jumps": []}, {"id": "P13160", "text": ["5.  On PC130-82:", "5. On PC130-82: ernal program = 130E FLT 0 F2 04 S External program = 130E FLT 0 F1 04 S", "A. Set switch S1 to inductive IND, (UP). B. Adjust R4 fully CW. C. Adjust R6 to mid range....."], "jumps": ["P13150"]}, {"id": "P13170", "text": ["6.  Connect the output of the function generator to PC2 OUTPUT        BNC. \n7.  Using the oscilloscope, set the function generator for a 1KHz        sine wave at 8 to Vpp.", "6. Connect the output of the function generator to PC2 OUTPUT BNC. 7. Using the oscilloscope, set the function generator for a 1KHz sine wave at 8 to Vpp...."], "jumps": ["P13180"]}, {"id": "P13180", "text": ["8.  Press Enter to Set: PC1 AC Power Switch - ON", "8. Press Enter to Set: PC1 AC Power Switch - ON..........................."], "jumps": ["P13170"]}, {"id": "P13190", "text": ["Which LED is illuminated?", "Which LED is illuminated?is typed.........................."], "jumps": ["P13195"]}, {"id": "P13191", "text": [], "jumps": []}, {"id": "P13192", "text": ["I1 only illuminates when K1 is energized indicating a DC output. On PC130-83, ensure that S1 is not depressed.  Press and release S2, K1 should not be energized.", "I1 only illuminates when K1 is energized indicating a DC output. On PC130-83, ensure that S1 is not depressed. Press and release S2, K1 should not be energized."], "jumps": []}, {"id": "P13193", "text": ["I3 only illuminates around the resonant frequency of L1 and C1. 1 kHz is not the resonant frequency of L1 and C1.  Ensure that the function generator is set to 1 kHz.", "I3 only illuminates around the resonant frequency of L1 and C1. 1 kHz is not the resonant frequency of L1 and C1. Ensure that the function generator is set to 1 kHz."], "jumps": []}, {"id": "P13195", "text": ["- PC130-82 S1 set to IND - PC130-82 R4 fully CW - PC130-82 R6 mid range - PC1 AC switch in ON.", "MEASUREMENT SETUP - If none of the three LEDs are illuminated, there is a problem in your setup. Check that your setup is correct."], "jumps": []}, {"id": "P13200", "text": ["The circuit is setup.  Now let's check to see if it is operating correctly before inserting a fault.", "1.  Measure the voltage at PC130-83 TP10 when K1 is\n     de-energized and energized.", "The circuit is setup. Now let's check to see if it is operating correctly before inserting a fault..", "1. Measure the voltage at PC130-83 TP10 when K1 is de-energized and energized...gized and energized."], "jumps": ["P13210", "P13190", "P13220", "P13200", "P13215"]}, {"id": "P13215", "text": ["MEASUREMENT SETUP - Carefully measure the output voltage at TP10."], "jumps": []}, {"id": "P13220", "text": ["2.  Observe that the correct LED illuminates when K1 is\n     de-energized and energized.", "2. Observe that the correct LED illuminates when K1 is de-energized and energized..................."], "jumps": ["P13230", "P13210"]}, {"id": "P13230", "text": ["3.  Check I3's intensity as the frequency output of the function            generator changes.", "3. Check I3's intensity as the frequency output of the function generator changes."], "jumps": ["P13240", "P13220", "P13235"]}, {"id": "P13235", "text": ["MEASUREMENT SETUP - I3's intensity increases around 31.8 kHz.."], "jumps": []}, {"id": "P13240", "text": ["Is the circuit operating correctly?", "Is the circuit operating correctly?........................"], "jumps": ["P13230", "P13245"]}, {"id": "P13241", "text": [], "jumps": []}, {"id": "P13242", "text": ["The circuit should be operating correctly.  DC output and I2 illuminated when K1 is de-energized and I1 illuminated when K1 is energized.", "The circuit should be operating correctly. DC output and I2 illuminated when K1 is de-energized and I1 illuminated when K1 is energized."], "jumps": []}, {"id": "P13245", "text": ["- K1 de-energized; I2 illuminated; TP10 signal, AC - K1 energized; I1 illuminated; TP10 signal, DC - I3 brightest around 31.8 kHz - PC1 AC switch in ON."], "jumps": []}, {"id": "P13250", "text": ["Now that you know the circuit is working correctly, the computer may insert a fault.  Follow the four step troubleshooting procedures.", "Now that you know the circuit is working correctly, the computer may insert a fault. Follow the four step troubleshooting procedures.", "Step 1. Analyze the circuit Measure the signal at PC130-83 TP10 and observe the LEDs when K1 is de-energized and energized................."], "jumps": ["P13240", "P13270"]}, {"id": "P13270", "text": ["2.  Vary the frequency of the function generator and observe I3.", "2. Vary the frequency of the function generator and observe I3."], "jumps": ["P13280", "P13260"]}, {"id": "P13280", "text": ["Is the circuit operating correctly?", "Is the circuit operating correctly?........................"], "jumps": ["P13270", "P13245"]}, {"id": "P13281", "text": [], "jumps": []}, {"id": "P13282", "text": ["The circuit is faulted. Check the voltage at PC130-83 TP10 when K1 is energized.  You should have measured 0 V.", "The circuit is faulted. Check the voltage at PC130-83 TP10 when K1 is energized. You should have measured 0 V."], "jumps": []}, {"id": "P13300", "text": ["Is the output correct at PC130-83 TP10 when K1 is de-energized and I2 illuminated?"], "jumps": ["P13280"]}, {"id": "P13301", "text": [], "jumps": []}, {"id": "P13302", "text": ["You should have measured an AC signal, at TP10 when K1 is\nde-energized and I2 should be illuminated.", "You should have measured an AC signal, at TP10 when K1 is de-energized and I2 should be illuminated.."], "jumps": []}, {"id": "P13310", "text": ["Did K1 energize when PC130-83 S1 was depressed, did you hear a click and did the correct LED illuminate?"], "jumps": ["P13300"]}, {"id": "P13311", "text": [], "jumps": []}, {"id": "P13312", "text": ["You should have heard a click from the relay when S1 was depressed."], "jumps": []}, {"id": "P13320", "text": ["Was the output at PC130-83 TP10 correct when K1 was energized?"], "jumps": ["P13310"]}, {"id": "P13321", "text": [], "jumps": []}, {"id": "P13322", "text": ["You should have measured 0 V at TP10 when K1 was energized.", "Since the output at TP10 is incorrect proceed to step 2.", "Since the output at TP10 is incorrect proceed to step 2...."], "jumps": ["P13340", "P13320"]}, {"id": "P13340", "text": ["Step 2. Check the setup: \n              1. Ensure that your setup is correct.", "Step 2. Check the setup: 1. Ensure that your setup is correct.", "- PC1 AC switch to ON - PC130-82 S1 to IND - PC130-82 R4 fully CW - PC130-82 R6 mid rangeN..N."], "jumps": ["P13350", "P13330"]}, {"id": "P13350", "text": ["Is your setup correct?", "Is your setup correct?on is typed.........................."], "jumps": ["P13340"]}, {"id": "P13351", "text": ["The computer did insert a fault. Proceed to step 3. PC130-82 R6 mid range - PC1 AC switch in ON."], "jumps": []}, {"id": "P13352", "text": ["Correct the setup and then repeat step 1, and ensure that a problem still exists.", "Step 3. Measure and test the circuit. \n              At this point, you know that K1 energizes and\n             de-energizes. Also that the bottom contacts operate                          correctly.", "- PC1 AC switch to ON - PC130-82 S1 to IND - PC130-82 R4 fully CW - PC130-82 R6 mid range - Analyze the circuit", "Step 3. Measure and test the circuit. At this point, you know that K1 energizes and de-energizes. Also that the bottom contacts operate correctly......................................"], "jumps": ["P13370", "P13350"]}, {"id": "P13370", "text": ["You also know that the output at TP10 is correct when K1 is\nde-energized and incorrect when K1 is energized.", "You also know that the output at TP10 is correct when K1 is de-energized and incorrect when K1 is energized.."], "jumps": ["P13380", "P13360"]}, {"id": "P13380", "text": ["1.  Measure the DC voltage input to K1 at PC130-83 TP4.  If the            DC voltage is present, the probable fault is K1.  If the DC                  voltage is not present, the probable fault is in PC130-82.", "What is the probable fault?", "1. Measure the DC voltage input to K1 at PC130-83 TP4. If the DC voltage is present, the probable fault is K1. If the DC voltage is not present, the probable fault is in PC130-82.", "What is the probable fault? typed.........................."], "jumps": ["P13390", "P13360"]}, {"id": "P13391", "text": [], "jumps": []}, {"id": "P13392", "text": ["You should have measured 0V at TP4.  This is a incorrect input voltage to K1.", "2.  Measure the voltage at PC130-82 TP5.  Note that the                          energizing voltage is applied to K1 so there must be voltage          at PC130-82 TP6.", "You should have measured 0V at TP4. This is a incorrect input voltage to K1.", "2. Measure the voltage at PC130-82 TP5. Note that the energizing voltage is applied to K1 so there must be voltage at PC130-82 TP6.."], "jumps": ["P13410", "P13390", "P13405"]}, {"id": "P13405", "text": ["MEASUREMENT SETUP - Carefully measure the voltage at TP5."], "jumps": []}, {"id": "P13410", "text": ["3.  Notice that there is 0 V at TP5.  Measure the voltage at TP6 to         confirm that the DC voltage is available to R1 and R2.", "3. Notice that there is 0 V at TP5. Measure the voltage at TP6 to confirm that the DC voltage is available to R1 and R2........."], "jumps": ["P13420", "P13400"]}, {"id": "P13420", "text": ["With TP6 measuring the correct voltage and TP5 measuring 0 V, R1 could be open or R2 could be shorted."], "jumps": ["P13430", "P13400"]}, {"id": "P13430", "text": ["4.  Measure the voltage drop across R1 and R2 to confirm the             possible faults.", "4.  Measure the voltage drop across R1 and R2 to confirm the             possible faults.", "4. Measure the voltage drop across R1 and R2 to confirm the possible faults."], "jumps": ["P13440", "P13400", "P13435"]}, {"id": "P13435", "text": ["R1 - TP6 and TP5 R2 - TP5 and Ground TP - PC130-82 R4 fully CW - PC130-82 R6 mid rangeN..N.", "VOLTAGE DROPS - To measure the voltage drops of R1 and R2, use the following test points:"], "jumps": []}, {"id": "P13440", "text": ["You should have measured the applied voltage across R1 and \n0 V across R2.", "You should have measured the applied voltage across R1 and 0 V across R2."], "jumps": ["P13450", "P13432"]}, {"id": "P13450", "text": ["5.  Press Enter to set: PC1 AC Power Switch - OFF", "6.  Measure the resistance of PC130-82 R2, TP5 to ground.", "5. Press Enter to set: PC1 AC Power Switch - OFF..........................", "6. Measure the resistance of PC130-82 R2, TP5 to ground..."], "jumps": ["P13432", "P13470"]}, {"id": "P13470", "text": ["Is R2 shorted, measures 0 ohms?", "Is R2 shorted, measures 0 ohms?ed.........................."], "jumps": ["P13460"]}, {"id": "P13471", "text": [], "jumps": []}, {"id": "P13472", "text": ["You should have measured 4.7 kW.  This is a correct measurement.", "This indicates that R1 is open.  If you measured the resistance of R1 you would measure approximately 5.9 kohms.", "You should have measured 4.7 kW. This is a correct measurement.", "This indicates that R1 is open. If you measured the resistance of R1 you would measure approximately 5.9 kohms."], "jumps": ["P13490", "P13470"]}, {"id": "P13490", "text": ["An open R1 would measure infinity and a good R1 would measure 470 ohms."], "jumps": ["P13500", "P13480"]}, {"id": "P13500", "text": ["The reading is due to alternate current paths.  R1 can't be isolated without de-soldering.", "The reading is due to alternate current paths. R1 can't be isolated without de-soldering."], "jumps": ["P13510", "P13480"]}, {"id": "P13510", "text": ["However, since R2 measured correctly, R1 has to be open.  Proceed to step 4.", "Step 4. Double-check results. \n              Place an open R1 in the circuit.", "However, since R2 measured correctly, R1 has to be open. Proceed to step 4.", "Step 4. Double-check results. Place an open R1 in the circuit."], "jumps": ["P13520", "P13480", "P13530"]}, {"id": "P13530", "text": ["Can an open R1 cause the symptoms that you saw in step 1?", "Can an open R1 cause the symptoms that you saw in step 1?.."], "jumps": ["P13520"]}, {"id": "P13531", "text": [], "jumps": []}, {"id": "P13532", "text": ["If R1 is open, the DC voltage to the second sets of contacts are not present.  The output of K1 would be 0 V when K1 is energized.", "If R1 is open, the DC voltage to the second sets of contacts are not present. The output of K1 would be 0 V when K1 is energized."], "jumps": []}, {"id": "P13540", "text": ["1.  Press Enter to set: PC1 AC Power Switch - ON", "1. Press Enter to set: PC1 AC Power Switch - ON..........................."], "jumps": ["P13530"]}, {"id": "P13550", "text": ["2.  Repeat Step 1, analyze the circuit.  Is the circuit operating               correctly?", "2. Repeat Step 1, analyze the circuit. Is the circuit operating correctly??"], "jumps": ["P13245"]}, {"id": "P13551", "text": [], "jumps": []}, {"id": "P13552", "text": ["The fault in the circuit has been removed.  Check the output at PC130-83 TP10 and the LEDs.  They should indicate correctly.", "The fault in the circuit has been removed. Check the output at PC130-83 TP10 and the LEDs. They should indicate correctly."], "jumps": []}, {"id": "P13560", "text": ["The computer will now place another fault into the circuit.  You will not be directed through the fault - it's up to you to locate it!", "The computer will now place another fault into the circuit. You will not be directed through the fault - it's up to you to locate it!"], "jumps": ["P13550"]}, {"id": "P13570", "text": ["Step 1, is the circuit operating correctly?", "Step 1, is the circuit operating correctly?................"], "jumps": ["P13245"]}, {"id": "P13571", "text": [], "jumps": []}, {"id": "P13572", "text": ["There is a fault in the circuit.  Check your indications again.", "There is a fault in the circuit. Check your indications again."], "jumps": []}, {"id": "P13580", "text": ["2.  Step 2, is your setup correct?", "2. Step 2, is your setup correct?........................."], "jumps": ["P13570", "P13585"]}, {"id": "P13581", "text": [], "jumps": []}, {"id": "P13582", "text": ["Correct your setup and recheck circuit operation.  There should still be a fault in the circuit.", "Correct your setup and recheck circuit operation. There should still be a fault in the circuit."], "jumps": []}, {"id": "P13585", "text": ["3.  Step 3, measure and test the circuit.  What is the probable               fault?", "- PC1 AC switch to ON - PC130-82 S1 to IND - PC130-82 R4 fully CW - PC130-82 R6 mid rangeN..N.", "3. Step 3, measure and test the circuit. What is the probable fault???"], "jumps": ["P13580"]}, {"id": "P13591", "text": [], "jumps": []}, {"id": "P13592", "text": ["If K1 was faulted, there would be no DC voltage on PC130-83 TP3 when K1 was de-energized.  TP1 measured the correct voltage and TP3 measured the correct voltage.", "If K1 was faulted, there would be no DC voltage on PC130-83 TP3 when K1 was de-energized. TP1 measured the correct voltage and TP3 measured the correct voltage."], "jumps": []}, {"id": "P13593", "text": ["If S1 was faulted, K1 would probably not energize.  The operation of the circuit is correct when K1 is energized.  The fault is in the circuit when K1 is de-energized.", "If S1 was faulted, K1 would probably not energize. The operation of the circuit is correct when K1 is energized. The fault is in the circuit when K1 is de-energized."], "jumps": []}, {"id": "P13600", "text": ["4.  Step 4, can the probable fault cause the symptoms found in           step 1?", "4. Step 4, can the probable fault cause the symptoms found in step 1??"], "jumps": ["P13590"]}, {"id": "P13601", "text": [], "jumps": []}, {"id": "P13602", "text": ["The output signals at TP10 were correct for K1 de-energized and energized, only the AC LED did not illuminate.  A bad I2 would cause this condition.", "The output signals at TP10 were correct for K1 de-energized and energized, only the AC LED did not illuminate. A bad I2 would cause this condition."], "jumps": []}, {"id": "P13610", "text": ["The computer will now replace I2.", "The computer will now replace I2..........................................."], "jumps": ["P13600"]}, {"id": "P13620", "text": ["Is the circuit working correctly?", "Is the circuit working correctly?.........................."], "jumps": ["P13245"]}, {"id": "P13621", "text": [], "jumps": []}, {"id": "P13622", "text": ["The fault has been removed, check your circuit measurements again."], "jumps": []}, {"id": "P13630", "text": ["Congratulations, you found and repaired the fault!", "Congratulations, you found and repaired the fault!tings...................."], "jumps": ["P13620"]}, {"id": "P13650", "text": ["1.  Set the test console Power to OFF.", "1. Set the test console Power to OFF.F.FF................................."], "jumps": []}, {"id": "P13660", "text": ["2.  Disconnect all test equipment. \n3.  Carefully remove PC130-82 and PC130-83.                     \n4.  Return all equipment to its proper storage area.", "2. Disconnect all test equipment. 3. Carefully remove PC130-82 and PC130-83. 4. Return all equipment to its proper storage area."], "jumps": ["P13910", "P13650"]}, {"id": "P13910", "text": ["This completes the experiment on ELECTRICAL CIRCUITS TROUBLESHOOTING."], "jumps": ["P2001", "P13660"]}, {"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-02-99 Converted steps 1 - 9. debbie 08-05-99 Trainer code. debbie 08-06-99 Convresion cleanup steps 10 thru 17. Penny 01-07-00 Added else statement to following pages: 1040, 1042, 1050, 1052, 1070, & 1110. debbie 07-14-00 Converted to ToolBook 7.1 forma let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
