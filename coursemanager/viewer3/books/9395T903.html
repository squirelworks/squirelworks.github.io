u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000X\u0001\u0000\u0000\u00cc\u0000&\u0001\u00a6\u0000e\u0001\u000f\u0000\u0000\u0000Next\u0000\u0000\u008f\u0001\u0010\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0012\u0000\u0011\u0000x\u001e\u0000\u0000\u0017\u0000\u0018\u0000\u00e5c\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00a7\u0001\u0011\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00b9\u0001\u0012\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000", "The PC130-438 is the Microprocessor and Phase Lock Loop (PLL) that provides the synthesized tuning and channel display."], "jumps": ["P400", "P420", "PLL"]}, {"id": "P420", "text": ["When manually tuned, the AM receiver need only consist of the PC130-439 and 440 circuit cards. All necessary components for AM Receiver operations are contained on these cards....."], "jumps": []}, {"id": "P430", "text": ["\u0000\u0000\u0000Back\u0000\u0000\u000b\u0001\u000b\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0000\f\u0000x\u001e\u0000\u0000\u0017\u0000\u0018\u0000\u00e5c\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000#\u0001\f\u0000\u0000\u0000ASYMI_UseRollover\u00005\u0001\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000O\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000X\u0001\u0000\u0000\u00cc\u0000&\u0001\u00a6\u0000e\u0001\u000f\u0000\u0000\u0000Next\u0000\u0000\u008f\u0001\u0010\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0012\u0000\u0011\u0000x\u001e\u0000\u0000\u0017\u0000\u0018\u0000\u00e5c\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00a7\u0001\u0011\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00b9\u0001\u0012\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000", "Since most modern receivers employ synthesized tuning, the PC130-438 card should be used to facilitate the technician's understanding of PLL theory and operations."], "jumps": ["P420", "P440"]}, {"id": "P440", "text": ["Faults may occur in any of the components on the PC130-438 card. U2 contains the phase lock loop electronics. The microprocessor has a paper label affixed to it."], "jumps": ["P430", "P450"]}, {"id": "P450", "text": ["The block diagram below depicts the primary sections of the AM receiver. All faultable portions of the receiver are shown. The station detector, however, will NOT be faulted. 440 card."], "jumps": ["P430", "P470"]}, {"id": "P470", "text": ["Let's begin the lesson on AM RECEIVER ANALYSIS............................"], "jumps": ["P450"]}, {"id": "P13180", "text": ["You are not measuring the correct frequency. Ensure: - test equipment setup is correct. - procedure is being performed correctly. - alignment prior to this measurement is correct.", "Now measure the oscillator's lower end. Rotate the manual tuning knob CCW while viewing the frequency counter readout. At approximately 1200 kHz slow down the CCW rotation. Note when the frequency counter reading drops to zero and enter this value below. ower limit. gs."], "jumps": ["P13172", "PutVar"]}, {"id": "P16010", "text": ["4. Press Enter to Set: PC1, PC2, PC3 and Speaker Switches - ON............"], "jumps": []}, {"id": "P17010", "text": ["4. Press Enter to Set: PC1, PC2, PC3 and Speaker Switches - ON............"], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Radio Frequency (RF) enters PC130-439 at the antenna input (TP1) which is actually an augmentation to the true antenna, L1.", "L1 is a part of the tuner which is comprised of L1 and D1. D1 is a capacitive diode (a varactor) whose capacitance is varied by the amount of reverse voltage applied to it."], "jumps": ["P1001", "P1030", "P1040", "P1020"]}, {"id": "P1040", "text": ["This voltage is determined by R9 when manually tuning the receiver..", "During microprocessor operation, this voltage is provided by the PLL (U2, pin13) on PC130-438.", "The receiver's overall frequency range is determined by R10. It should be adjusted to read 1.4 VDC at TP9."], "jumps": ["P1030", "P1050", "P1060", "P1070"]}, {"id": "P1070", "text": ["D2 and L2 make up an oscillator that is \"ganged\" together with the tuner by voltage only.", "The PLL issues a controlling voltage to D2 via Op Amp U2, which tunes the oscillator to the desired frequency. The desired frequency is 455kHz above the Tuned RF. kHz above the tuned RF."], "jumps": ["P1060", "P1080", "P1090"]}, {"id": "P1090", "text": ["The AM Front end converts the RF into IF. The received signal is boosted and returned to 455kHz higher than originally received. The new frequency signal is coupled through T1 and T2. T2 is tuned to a resonant frequency of 455kHz. The output of T2 is the signal intelligence at 455kHz plus sidebands (450 and 460 kHz)."], "jumps": ["P1080", "P1100"]}, {"id": "P1100", "text": ["The PLL receives feedback from T2 via Q2. received signal is only measurable in microvolts and is not of sufficient amplitude to be used, as is, by the receiver.", "The newly converted IF is sent to the IF amplifier via a ceramic filter X1. X1 passes 455kHz only. U1 amplifies the IF and sends it to the detector. U1 gain is controlled by the automatic gain control (AGC) circuit."], "jumps": ["P1080", "P1110", "P1130"]}, {"id": "P1130", "text": ["Heterodyning is the process that allows us to convert one frequency to another without losing the intelligence. r without losing the intelligence."], "jumps": ["P1080", "P1140"]}, {"id": "P1140", "text": ["The desired, resonant frequency is a modulated 455 kHz frequency that contains the intelligence from the original RF signal."], "jumps": ["P1130", "P1150"]}, {"id": "P1150", "text": ["However, as a product of the heterodyning process, other frequencies are created."], "jumps": ["P1130", "P1160"]}, {"id": "P1160", "text": ["455 KHz - Difference Freq. 945 KHz - Original RF 1400 KHz - VCO Ref. Freq. 2345 KHz - Sum Freq.", "There will be the two original frequencies as well as the sum and difference of those frequencies. The 455 kHz frequency, with its upper and lower sidebands, needs to be amplified. All other frequencies and harmonics are filtered out in the IF amplifier section.", "The heterodyning process that creates the desired IF also produces several unwanted frequencies. X1, U1, and T3 rid the receiver of all but 455kHz and sidebands."], "jumps": ["P1130", "P1170", "P1200"]}, {"id": "P1200", "text": ["The cleaned and amplified IF signal can be measured at TP7, which is the IF output to PC130-440."], "jumps": ["P1210", "P1170"]}, {"id": "P1210", "text": ["As mentioned, the 455 kHz IF signal contains the intelligence from the original tuned RF signal. In order for the intelligence to be usable, it must first be extracted from the 455 kHz IF. The AM Detector circuitry performs this job using the diode D1."], "jumps": ["P1220", "P1170"]}, {"id": "P1220", "text": ["D1 conducts only during the positive portion of the incoming IF signal. This removes the bottom half of the waveform. The filters that follow it remove the remaining modulation and frequencies as illustrated below."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["The capacitor C3 blocks the DC level that the detected signal rides on, leaving only the original intelligence to be amplified in the AF amplifier section."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["The detected audio signal is fed to the Station Detector, the Automatic Gain Control (AGC) and the Audio Amplifier."], "jumps": ["P1250", "P1220"]}, {"id": "P1250", "text": ["The Station Detector is controlled by the incoming signal and the variable resistor, R4. R4 is the threshold control that sets the voltage to the non-inverting (+) input of the comparator U2."], "jumps": ["P1260", "P1220"]}, {"id": "P1260", "text": ["When the inverting input (-) at pin 2 is more positive than the non-inverting input (+) at pin 3, the output goes low, properly biasing DS1, causing it to illuminate."], "jumps": ["P1250", "P1270"]}, {"id": "P1270", "text": ["The Automatic Gain Control (AGC) provides a stable output signal level from the IF amplifier circuit regardless of variations in the RF input."], "jumps": ["P1280", "P1250"]}, {"id": "P1280", "text": ["The variable resistor R8 is the AGC adjust that provides voltage to the inverting input (-) pin 2, U3. Pin 3 of U3 is the non-inverting input for the detected AM signal."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["The output of U3 is at pin 6 and can be measured at TP5. This voltage feeds back to PC130-439 at pin 5, U3, the IF amplifier. Any variation in the incoming RF signal causes U3 on PC130-440 to increase or decrease its output voltage."], "jumps": ["P1270", "P1300"]}, {"id": "P1300", "text": ["As mentioned previously, the detected audio signal also goes to the Audio Amplifier stage. While headsets could be used to listen to the signal without an audio amplifier, practicality suggests using a conventional speaker. Hence, the amplifier."], "jumps": ["P1310", "P1270"]}, {"id": "P1310", "text": ["The audio signal enters the AF amplifier (U1) at pin 3. The signal is then amplified and routed to the output at pin 5. Once amplified, the signal is of adequate amplitude to drive the speaker."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["The Phase Lock Loop theory has already been discussed in the previous lesson. One important fact to remember is that PLL circuitry is only active when the microprocessor is employed. ."], "jumps": ["P1300", "P1330"]}, {"id": "P1330", "text": ["With the tuning select switch on PC130-439 in the manual position, the PLL, microprocessor and related components are effectively removed from the receiver. A pinout of the PLL (U2) is shown below."], "jumps": ["P1320", "P1340"]}, {"id": "P1340", "text": ["Much of the phase-lock loop components shown in the block diagram are contained in the IC chip, U2 on the PC130-438 card. U2 is a nearly self-contained PLL that is directly governed by the microprocessor. y their VCO which is U2 on the PC130-439 card."], "jumps": ["P1330", "P1910"]}, {"id": "P1800", "text": [], "jumps": []}, {"id": "P1801", "text": [], "jumps": []}, {"id": "P1910", "text": ["This completes the information on SCHEMATIC ANALYSIS......."], "jumps": ["P1340"]}, {"id": "P1920", "text": ["1. When in manual tuning, the PLL, Microprocessor, and associated circuitry are effectively cut out of the circuit.", "2. The VCO's output is always 455 kHz higher than the incoming tuned RF.", "3. The received RF signal must be amplified because it is too small to be usable by the receiver.", "4. T1 and X1 are the primary resonant filters that allow only the 455 kHz frequency and the sidebands at 450 kHz and 460 kHz to pass into the IF amp, U3."], "jumps": ["P1001", "P1930", "P1940", "P1920", "P1950", "P1960"]}, {"id": "P1960", "text": ["5. In the AM Receiver, the detected intelligence is in the USB only. All other portions of the AM envelope are rejected."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6. AGC provides a stable output despite fluctuations in the tuned RF."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7. The AF amplifier is necessary to boost the audio signal to levels high enough to drive a speaker."], "jumps": ["P1999", "P1970"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1980", "P1001"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")", "= addObjectiveToPoolEX(1, \"110,1 be set to _______"], "jumps": []}, {"id": "P10219", "text": ["When the tuning select switch is in the PLL position, manual tuning is _______"], "jumps": []}, {"id": "P10220", "text": ["An oscillator's frequency range may be established by subtracting the low frequency limit from the _______"], "jumps": []}, {"id": "P10221", "text": ["The frequency at which Eout = 0.707 x Eout maximum is called the _______"], "jumps": []}, {"id": "P10222", "text": ["AGC DC voltage should rise and fall in accordance with the strength of the _______"], "jumps": []}, {"id": "P10223", "text": ["The bandwidth of the IF filter(s) should be approximately _______"], "jumps": []}, {"id": "P10224", "text": ["To establish gain in an IF stage as a voltage ratio, Eout is _______ Ein."], "jumps": []}, {"id": "P10225", "text": ["To establish gain in an IF stage in decibels, 20 LOG is multiplied by _______"], "jumps": []}, {"id": "P10226", "text": [], "jumps": []}, {"id": "P10227", "text": ["Of the two AGC types, _______ is the most common."], "jumps": []}, {"id": "P10228", "text": [], "jumps": []}, {"id": "P10229", "text": ["compensate for the inefficiency of the diodes PN junction.", "The low-pass filter following the Detector Diode is used to _______"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to _________"], "jumps": []}, {"id": "P10410", "text": ["The purpose of the local oscillator (the VCO) is to generate a signal to heterodyne with the desired incoming RF signal from the antenna. he desired incoming RF signal from the antenna."], "jumps": ["P13030", "P2001"]}, {"id": "P13030", "text": ["The incoming RF and the VCO signal meet at transformer T1. The resulting frequency is 455 kHz, which is connected to transformer T2. The center tap of T2 develops the PLL feedback signal. Both transformers are tunable for optimum frequency performance for the 455 kHz center frequency and sidebands."], "jumps": ["P13020", "P13040"]}, {"id": "P13040", "text": ["Since the RF signal may be any frequency in the range from 550 kHz to 1600 kHz, the VCO must be capable of generating a signal from 1005 kHz to 2055 kHz."], "jumps": ["P13020", "P13050"]}, {"id": "P13050", "text": ["In this experiment you will be analyzing the VCO and its associated circuitry. Let's start by establishing the VCO's frequency range. This is done by setting the VCO's upper and lower limits."], "jumps": ["P13020", "P13060"]}, {"id": "P13060", "text": ["1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13020"]}, {"id": "P13070", "text": ["2. Carefully place PC130-438 in PC1 position, PC130-439 in PC2 position and PC130-440 in PC3 position. Ensure Q1 is installed on the PC130-439 card."], "jumps": []}, {"id": "P17008", "text": ["3. Press Enter to Set: Positive Supply Voltage - 12......................."], "jumps": ["P17007"]}, {"id": "P13082", "text": ["3. Set the Positive Supply Voltage to 12.ltage - 12......................."], "jumps": ["P13070"]}, {"id": "P16008", "text": ["3. Press Enter to Set: Positive Supply Voltage - 12......................."], "jumps": ["P16007"]}, {"id": "P13092", "text": ["4. Set: PC1, PC2, PC3 and Speaker Switches - ONN Switches - ON............"], "jumps": []}, {"id": "P13094", "text": ["On PC130-439 set S1 to Manual. ust the Manual Tuning fully CW. PC130-440 set the Volume control fully CCW"], "jumps": []}, {"id": "P13096", "text": ["Connect the BNC to alligator cable between the function generator external counter (EXT CNTR ) jack and TP5..plastic hold down (L1). Connect the other BNC to alligator en adjusted, removal of Q1 permits the injection of a 455 kHz 50% modulated signal at the output of the VCO, allowing for a clear and stable signal. for a clear and stable signal."], "jumps": ["P2001"]}, {"id": "P15011", "text": ["1. Set the Test Console controls to the initial control settings..............trol settings."], "jumps": ["P15010"]}, {"id": "P15020", "text": ["2. Ensure PC130-438 is in the PC1 position, PC130-439 is in the PC2 position and PC130-440 is in the PC3 position. tuning control until a 1445 kHz is read by the counter. . w the signal on the oscilloscope. It may be"], "jumps": []}, {"id": "P15030", "text": ["3. Remove Q1 from the PC130-439 card. ion, PC130-439 in PC2 position and PC130-440 in PC3 position. t the manual tuning control until a 1445 kHz is read by the counter. . w the signal on the oscilloscope. It may be"], "jumps": []}, {"id": "P15040", "text": ["4. Ensure on the PC130-439 card, that S1 (Tuning select switch) is set to PLL and S2 (AGC switch) is set to OFF. e Q1 from the PC130-439 card. 1445 kHz is read by the counter. . w the signal on the oscilloscope. It may be"], "jumps": []}, {"id": "P15050", "text": ["5. Connect the function generator's main output to TP5 of the PC130-439 card. the 455 kHz modulated signal. trol until a 1445 kHz is read by the counter. . w the signal on the oscilloscope. It may be"], "jumps": []}, {"id": "P15060", "text": ["6. Connect the CH1 oscilloscope probe to TP7 (IF out) on the PC130-439 card."], "jumps": []}, {"id": "P15070", "text": ["Range - 1 MHz CH1 Volts/Div - .5 V (X1 probe) Function - Sine Wave 50 mV (X10 probe) Amplitude - Mid-Range Time/Div - 1 ms Frequency - 1 MHz Trigger Source - CH1 Counter Select - Internal (INT) Sweep Mode - Auto Modulation - AM Modulation Adjust Knob - Mid-Range Range - 10 kHz Frequency Adjust Knob - Mid-Range", "4040A FUNCTION GENERATOR Citizen Band Narrow Band FM Single Side-Band Independent Side-Band", "Frequency....................... 455 kHz Function.............. l attenutation if the signal amplitude is not 1.2 Vpp adjust T2 and T3 for maximum amplitude. Re-adjust the function generator modulation % and output level.", "Viewing the signal on the oscilloscope measured at TP7 of the PC130-439 card, adjust the function generators output level and modulation % controls alternately to obtain a 455 kHz 50 % signal of 1.2 Vpp (Emax). If there is not enough amplitude remove attenuation and re-adjust the output level and modulation % controls."], "jumps": ["P15120"]}, {"id": "P15120", "text": ["The setup is now complete and you may proceed to the rest of the experiments. It is recommended that the experiments be performed in sequence. However, if you are repeating any of the experiments you may choose to perform them in any order. Click next to go to the experiment menu page.o the experiment menu................."], "jumps": ["P15110"]}, {"id": "P16005", "text": ["The VCO Range experiment and Signal Injection Setup MUST be performed before continuing with this experiment. If they have not been completed successfully you will not be able to achieve the desired result in this experiment."], "jumps": []}, {"id": "P16006", "text": ["1. Set the Test Console controls to the initial control settings.........."], "jumps": []}, {"id": "P16007", "text": ["2. Ensure Q1 has been removed from the PC130-439 card. 130-440 in PC3 position. Ensure Q1 has been removed from the PC130-439 card."], "jumps": []}, {"id": "P18210", "text": ["This completes the experiment on AGC.MPLIFIER..LYSIS......."], "jumps": []}, {"id": "P16009", "text": ["3. Set the Positive Supply Voltage to 12.ltage - 12......................."], "jumps": ["P16007"]}, {"id": "P16202", "text": ["Ensure that you are measuring TP7 on PC130-439. Recheck the frequency input to TP5 and ensure it is 455 kHz", "0.2. by the frequency counter PC130-439....."], "jumps": []}, {"id": "P16011", "text": ["4. Set: PC1, PC2, PC3 and Speaker Switches - ONN Switches - ON............"], "jumps": []}, {"id": "P16015", "text": ["To obtain the correct results in the experiment the measured signal at TP5 and TP7 MUST be 50% 455 kHz 1.2 Vpp. You should return to the experiment menu and perform the Signal Injection Setup. prior to this measurement is correct.", "Is there a 455 kHz, 1.2 Vpp 50% modulated signal, injected at TP5 and measured at TP7on the PC130-439 card??????????and measured at TP7on the PC130-439 card present???", "Providing good selectivity in the IF amplifier stage of an AM receiver is a major goal of the designer and is the prime reason that resonant filters are used."], "jumps": ["P16015"]}, {"id": "P16030", "text": ["Ideally, these filters would pass all frequencies between 450 kHz and 460 kHz while rejecting all others. Notice the difference between the ideal response and the typical response."], "jumps": []}, {"id": "P16040", "text": ["The sides of the response curve are called \"skirts\" and the steeper the skirts the better the filter."], "jumps": ["P16030"]}, {"id": "P16050", "text": ["The bandwidth of a filter is determined by the distance in Hertz between the two half power points. A half power point is the frequency at which Eout = 0.707 x Eout maximum."], "jumps": ["P16030"]}, {"id": "P16060", "text": ["The half power points are located on either side of the center frequency. In the case of IF filters, the bandwidth should be at least 10 kHz. e output voltage at the 450 kHz and 460 kHz frequencies should not be less than 70% of the output voltage at 455 kHz."], "jumps": ["P16030"]}, {"id": "P16070", "text": ["5. Ensure on the PC130-439 card, that S1 (Tuning select switch) is set to PLL and S2 (AGC switch) is set to OFF. be at least 10 kHz. e output voltage at the 450 kHz and 460 kHz frequencies should not be less than 70% of the output voltage at 455 kHz."], "jumps": ["P16030"]}, {"id": "P16090", "text": ["0.2 kHz), 1.2 Vpp 50% modulated signal, injected at TP5 and measured at TP7 on the PC130-439 card present. on the PC130-439 card present?"], "jumps": ["P16030"]}, {"id": "P16130", "text": ["7. Adjust the function generator frequency control slowly to the left and right of center and observe the bandwidth of the receiver."], "jumps": []}, {"id": "P16140", "text": ["The bandwidth of the AM broadcast receiver is 10 kHz. As the frequency is changed 5 kHz on either side of the center frequency, a drastic change in signal level should be observed on the oscilloscope."], "jumps": []}, {"id": "P16180", "text": ["To determine the filter's bandwidth, first take the maximum voltage (without distortion) approximately 1.2 Vpp. This is Eout Max. Then multiply 0.707 times that figure approximately 0.85 Vpp. This is the voltage level for the half power points..oints..."], "jumps": []}, {"id": "P16200", "text": ["8. Slowly turn the frequency control of the function generator clockwise for the upper frequency and CCW for the lower frequency. Record the frequencies where the half power points occurr (approximately 0.85 Vpp).."], "jumps": []}, {"id": "P16201", "text": [], "jumps": []}, {"id": "P18008", "text": ["3. Press Enter to Set: Positive Supply Voltage - 12......................."], "jumps": ["P18007"]}, {"id": "P16207", "text": ["You should have measured a reading of approximately 460 kHz for the upper frequency and 450 kHz for the lower frequency.hen converted to IF. 5 kHz either side of 455 kHz is the same as 5 kHz either side of 1000 kHz. From this point on, IF will be used instead of RF."], "jumps": ["P16200", "PutVar"]}, {"id": "P16210", "text": ["By subtracting the lower frequency from the higher frequency, you determine the filter's actual bandwidth. As mentioned, it should be roughly 10 kHz. @%24 kHz - @%25 kHz @%26 kHzzzz"], "jumps": ["PutVar"]}, {"id": "P16220", "text": ["The result of this experiment should indicate that the filters in the IF section are blocking any frequency less than or greater than 5 kHz from the center frequency of 455 kHz. This leaves an IF bandwidth of approximately 10 kHz."], "jumps": []}, {"id": "P16230", "text": ["Since AM station assignments are 10 kHz apart, the accuracy of the IF filters is critical in a receiver's rating for selectivity."], "jumps": []}, {"id": "P16240", "text": ["This completes the experiment on IF RESPONSE...LYSIS......."], "jumps": []}, {"id": "P17005", "text": ["The VCO Range experiment and Signal Injection Setup MUST be performed before continuing with this experiment. If they have not been completed successfully you will not be able to achieve the desired result in this experiment."], "jumps": []}, {"id": "P17006", "text": ["1. Set the Test Console controls to the initial control settings.........."], "jumps": []}, {"id": "P17007", "text": ["2. Ensure Q1 has been removed from the PC130-439 card. 130-440 in PC3 position. Ensure Q1 has been removed from the PC130-439 card."], "jumps": []}, {"id": "P17008", "text": ["3. Press Enter to Set: Positive Supply Voltage - 12......................."], "jumps": ["P17007"]}, {"id": "P17009", "text": ["3. Set the Positive Supply Voltage to 12.ltage - 12......................."], "jumps": ["P17007"]}, {"id": "P18010", "text": ["4. Press Enter to Set: PC1, PC2, PC3 and Speaker Switches - ON............"], "jumps": []}, {"id": "P17012", "text": ["4. Set: PC1, PC2, PC3 and Speaker Switches - ONN Switches - ON............"], "jumps": []}, {"id": "P18080", "text": ["Because AGC voltage is supposed to vary in proportion to the tuned RF signal, it is only necessary to monitor the AGC voltage while tuning through a station. The AGC voltage should rise and fall in accordance with the strength of the station.", "Is there a 455 kHz, 1.2 Vpp 50% modulated signal, injected at TP5 and measured at TP7on the PC130-439 card? at TP5 and measured at TP7 on the PC130-439 card present, with Q1 removed????", "The gain of the IF amplifier(s) in a receiver determines the unit's sensitivity (the ability to detect and lock on to a weak signal).", "Some understanding of the amount of gain in a typical IF section is necessary for effective troubleshooting. The ability to work with gain in terms of either voltage ratio or dB level is a prerequisite to the study of radio communications."], "jumps": ["P18070"]}, {"id": "P17040", "text": ["Normally, the gain of an amplifier is the ratio of AC collector voltage to AC base voltage. In the case of transformer coupled stages, as in IF amplifiers, gain is calculated as the ratio of AC secondary voltage to AC primary voltage, or the base of one stage to the base of the next stage."], "jumps": []}, {"id": "P17050", "text": ["The gain of amplifier stages may be expressed either as a voltage ratio or as a decibel level, where: Gain dB = 20 LOG (Eo/Ein)."], "jumps": []}, {"id": "P17060", "text": ["Range - 1 MHz CH1 Volts/Div - .5 V (X1 probe) Function - Sine Wave 50 mV (X10 probe) Amplitude - Mid-Range Time/Div - 1 ms Frequency - 1 MHz Trigger Source - CH1 Counter Select - Internal (INT) Sweep Mode - Auto Modulation - AM Modulation Adjust Knob - Mid-Range Range - 10 kHz Frequency Adjust Knob - Mid-Range", "Product of Voltage Ratios t Citizen Band Narrow Band FM Single Side-Band Independent Side-Band", "Sum of dB Gains R roadcast Citizen Band Narrow Band FM Single Side-Band Independent Side-Band", "Av overall (dB) = (Av1) + (Av2) + (Av3) etc. 5 mV (X10 probe) Time/Div - 1 ms Trigger Source - CH1 Sweep Mode - Auto eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee Frequency Adjust Knob - Mid-Rangeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeecy Adjust Knob - Mid-Rangeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee Knob - Mid-Rangeee", "When several stages are cascaded, the overall gain is the product of the individual voltage ratios or, the sum of the individual dB gains. Product of Voltage Ratios Av = (Av1) x (Av2) x (Av3) etc. Sum of dB Gains Av overall (dB) = (Av1) + (Av2) + (Av3) etc.", "In this portion of the experiment you will learn how to measure individual and overall IF amplifier gain and how to compute and work with decibels. You will also learn what the typical gain of an IF amplifier is in AM radios."], "jumps": []}, {"id": "P17100", "text": ["Ensure oscilloscope probe is grounded to TP13. Set probe to X1 to measure the small signal.", "Ensure S1 is set to PLL and AGC is set to OFF. Measure the voltage on pin 4 of U1 on PC130-439. Record the value below. sent? decibels. You will also learn what the typical gain of an IF amplifier is in AM radios."], "jumps": ["P17102"]}, {"id": "P17101", "text": [], "jumps": []}, {"id": "P13200", "text": ["This completes the VCO range adjustment..E ADJUSTMENT......"], "jumps": ["P20000"]}, {"id": "P17107", "text": ["Your measurement is not within the acceptable range. The voltage at pin 4 of U1 on PC130-439 should be between 1 and 100 mVpp........................................................................................... above the value below. es in the settings."], "jumps": ["P13172", "PutVar"]}, {"id": "P17110", "text": ["Move the oscilloscope probe to TP7 (IF out) of PC130-439 and measure the signal. n the manual tuning knob CW until a reading on the frequency counter appears. Slowly turn the manual tuning knob CCW to 25 kHz above the value below. es in the settings."], "jumps": ["P17100"]}, {"id": "P17120", "text": ["Range - 1 MHz CH1 Volts/Div - .5 V (X1 probe) Function - Sine Wave 50 mV (X10 probe) Amplitude - Mid-Range Time/Div - 1 ms Frequency - 1 MHz Trigger Source - CH1 Counter Select - Internal (INT) Sweep Mode - Auto Modulation - AM Modulation Adjust Knob - Mid-Range Range - 10 kHz Frequency Adjust Knob - Mid-Range", "Eo TP7 1.) AV = AV = Ein U1, pin 4 4", "Eo TP7 2.) A (dB) = 20 LOG A (dB) = 20 x LOG Ein U1, pin 4", "Using the gain formulas below, calculate the voltage gain for the IF stage."], "jumps": []}, {"id": "P17130", "text": ["What is the average gain of the IF amplifier???? tion generator setup correctly. CH1 on TP1 (the anode of D1) and CH2 on TP2 (the cathode D1).he diode.ode.de.e diode...."], "jumps": ["P19190"]}, {"id": "P18090", "text": ["Let's analyze the AGC circuitry in the AM receiver. r."], "jumps": ["P18070"]}, {"id": "P18120", "text": ["Place S2 (AGC switch) to ON.t) is set to PLL and S2 (AGC switch) is Off. Is there a 455 kHz, 1.2 Vpp 50% modulated signal, injected at TP5 and measured at TP7 on the PC130-439 card present?"], "jumps": []}, {"id": "P18121", "text": ["Adjust R8 on the PC130-440 for 0.8 Vpp signal as measured at TP7 of the PC130-439 card."], "jumps": []}, {"id": "P18122", "text": ["Place the AGC switch to OFF.t) is set to PLL and S2 (AGC switch) is Off. Is there a 455 kHz, 1.2 Vpp 50% modulated signal, injected at TP5 and measured at TP7 on the PC130-439 card present?"], "jumps": []}, {"id": "P18123", "text": ["Use the output level on the function generator to adjust its output until the top and bottom portions of the waveform are just starting to saturate (clip).m are just starting to saturate (clip).."], "jumps": []}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P17180", "text": ["This completes the experiment on IF AMPLIFIER..LYSIS......."], "jumps": []}, {"id": "P16240", "text": ["This completes the experiment on IF RESPONSE...LYSIS.......", "Place the AGC switch to ON. Notice the AGC circuitry on the PC130-440 controls the signal amplitude that is fed back to the IF stage. (clip)... measured at TP7 on the PC130-439 card present?"], "jumps": []}, {"id": "P18130", "text": ["Connect the multimeter and the oscilloscope probe to TP8 on PC130-439 card."], "jumps": []}, {"id": "P18140", "text": ["The waveform displayed on the oscilloscope and the DC voltage on the multimeter is being fed back to the IF stage from the AGC on the PC130-440 card. The AC is undesired and the circuitry has been designed to remove as much of it as possible.", "R9 and C9 on PC130-440 and R5 and C14 on PC130-439 filter out most of the AC on the AGC feedback line. The remainder, around 40 mVpp is, for the most part is insignificant. The DC level is the important factor, as it controls the amount of gain correction needed for a stable output."], "jumps": []}, {"id": "P18160", "text": ["Increase the amplitude of the function generator. Observe the waveform displayed on the oscilloscope and the voltage on the multimeter."], "jumps": []}, {"id": "P18170", "text": ["As amplitude increased, the DC voltage _______..phabetic answer (North).................ble.le."], "jumps": ["P1800"]}, {"id": "P18171", "text": [], "jumps": []}, {"id": "P18177", "text": ["Your answer is still incorrect. As the amplitude increased the DC voltage increased....."], "jumps": ["P18170", "P18180"]}, {"id": "P18180", "text": ["Is the DC biasing ( - ) or ( + )?ith 3 tries, alphabetic answer (North).................ble.le."], "jumps": ["P1800"]}, {"id": "P18181", "text": [], "jumps": []}, {"id": "P18187", "text": ["Your answer is still incorrect. The DC biasing is positive or (+)."], "jumps": ["P18180", "P18190"]}, {"id": "P18190", "text": ["Notice that the DC voltage is positive. This is due to the direction of the AM detector diode, which is also why the positive or upper sideband of the IF was recovered rather than the negative."], "jumps": []}, {"id": "P18200", "text": ["Place the AGC switch to the OFF position. Notice that the DC voltage and waveform diminish. Without AGC, the IF amplifier has no reference signal and gain is constant. ns."], "jumps": []}, {"id": "P18210", "text": ["This completes the experiment on AGC.MPLIFIER..LYSIS......."], "jumps": []}, {"id": "P19005", "text": ["The VCO Range experiment and Signal Injection Setup MUST be performed before continuing with this experiment. If they have not been completed successfully you will not be able to achieve the desired result in this experiment."], "jumps": []}, {"id": "P19006", "text": ["1. Set the Test Console controls to the initial control settings.........."], "jumps": []}, {"id": "P19007", "text": ["2. Ensure Q1 has been removed from the PC130-439 card. 130-440 in PC3 position. Ensure Q1 has been removed from the PC130-439 card."], "jumps": ["P19008", "P19009"]}, {"id": "P19008", "text": ["3. Press Enter to Set: Positive Supply Voltage - 12......................."], "jumps": ["P19007"]}, {"id": "P19009", "text": ["3. Set the Positive Supply Voltage to 12.ltage - 12......................."], "jumps": ["P19007"]}, {"id": "P15120", "text": ["The setup is now complete and you may proceed to the rest of the experiments. It is recommended that the experiments be performed in sequence. However, if you are repeating any of the experiments you may choose to perform them in any order. Click next to go to the experiment menu page.o the experiment menu................."], "jumps": ["P15110"]}, {"id": "P19012", "text": ["4. Set: PC1, PC2, PC3 and Speaker Switches - ONN Switches - ON............"], "jumps": []}, {"id": "P19015", "text": ["Is there a 455 kHz, 1.2 Vpp 50% modulated signal, injected at TP5 and measured at TP7on the PC130-439 card? at TP5 and measured at TP7 on the PC130-439 card present, with Q1 removed???", "To obtain the correct results in the experiment the measured signal at TP5 and TP7 MUST be 50% 455 kHz 1.2 Vpp. You should return to the experiment menu and perform the Signal Injection Setup. prior to this measurement is correct."], "jumps": ["P19010", "P19012"]}, {"id": "P19020", "text": ["The next portion of the experiment will allow you to observe the actions of the AM Detector circuitry."], "jumps": ["P19015"]}, {"id": "P19030", "text": ["The purpose of the AM Detector circuit is to recover the original intelligence from the modulated carrier frequency."], "jumps": ["P19020"]}, {"id": "P19040", "text": ["The intelligence is carried in the upper and lower sidebands of the 455 kHz carrier which comprise the top and bottom boundaries of the AM envelope."], "jumps": ["P19020"]}, {"id": "P19050", "text": ["A low pass filter following the detector diode removes all of the IF signal except the USB. This is due to the fact that the diode is only conducting when the positive portion of the envelope is felt."], "jumps": []}, {"id": "P19060", "text": ["Simple AM detectors do not perform well under all conditions. At high modulation levels and/or high audio frequencies, distortion of the recovered audio begins to develop due to the time constant of the low-pass filter."], "jumps": []}, {"id": "P19070", "text": ["At low modulation levels, distortion is created by the detector diode because a finite voltage is required to forward bias the diode. o"], "jumps": []}, {"id": "P19080", "text": ["In lieu of this, detector diodes are always germanium because only 0.2 volts are required to forward bias the P-N junction, rather than 0.7 in silicon diodes."], "jumps": []}, {"id": "P19090", "text": ["Set S1 (tuning select) to PLL and S2 (AGC) ON. Is there a 455 kHz (", "0.2 kHz), 1.2 Vpp 50% modulated signal, injected at TP5 and measured at TP1 on the PC130-440 card present?", "To obtain the correct results in the experiment the measured signal at TP5 and TP7 MUST be 50% 455 kHz 1.2 Vpp. You should return to the experiment menu and perform the Signal Injection Setup. prior to this measurement is correct."], "jumps": []}, {"id": "P19140", "text": ["Connect the probe from CH1 of the oscilloscope to TP1 on PC130-440. This is the same signal as viewed at TP7 on the PC130-439 card. there a 455 kHz (+/- 0.2 kHz), 1.2 Vpp 50% modulated signal, injected at TP5 and measured at TP1 on the PC130-440 card present?"], "jumps": []}, {"id": "P19150", "text": ["Connect the probe from CH2 of the oscilloscope to TP2 on PC130-440. The upper sideband of the original IF signal should be displayed."], "jumps": []}, {"id": "P19160", "text": ["Refer to the schematics of the PC130-440 card. Note that TP1 is on the anode side of the diode, while TP2 is on the cathode. When the IF signal passes through the diode, all but the upper portion of the signal is rejected."], "jumps": []}, {"id": "P19170", "text": ["Notice that the signal from CH2 matches the USB of the IF signal. The intelligence has been extracted. The low pass filter removes any unwanted signals and harmonics. xtracted. The low pass filter removes any unwanted signals and harmonics."], "jumps": []}, {"id": "P19180", "text": ["Vary the frequency of the function generator and observe the results."], "jumps": []}, {"id": "P19190", "text": ["\u0000\u0000\u0000incorrect1\u0000\u00001\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000[\u0001\u000f\u0000\u0000\u0000 \u0000\u0002\u0000Norst Choiceett\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000q\u0001\u0010\u0000\u0000\u0000\u0001\u0000\u0001\u0000\u0000\u0000,\u0004\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000z\u0001\u0000\u0000\u00fc\u0000\u00be\u0004\u0012\u0002\u0087\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u00b1\u0001\u0012\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0014\u0000\u0013\u0000x\u001e\u0000\u0000\u0019\u0000\u001a\u0000\u00e5c\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00c9\u0001\u0013\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00db\u0001\u0014\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000\u00f5\u0001\u0015\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0019\u0002\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00be\u0004\u0002\u0000\u0000\u0000\\\u0006\u0003\u0000\u0000\u0000r\u0007\u0000\u0000\u0000\u0000\u0000\u00003\u0002\u0017\u0000\u0000", "Does the IF waveform and detected intelligence increase and decrease propo let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
