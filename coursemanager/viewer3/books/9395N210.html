const book = {"title": "9395N210", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: SEQUENCER INSTRUCTIONSf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Understand the concepts of the sequencer instructions. w Describe the operation of the sequencer instructions.", "w Demonstrate the usage of sequencer instructions using Allen Bradely APS software................", "w Demonstrate the usage of sequencer instructions using Rockwell RSLOGIX software.........."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P310", "text": [], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P331", "text": [], "jumps": []}, {"id": "P340", "text": [], "jumps": ["P", "P61"]}, {"id": "P400", "text": ["In this lesson, we are going to look at the sequencer instructions used by a PLC. Sequencer instructions can be very important to output devices that operate on a sequence of conditions."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Using the sequencer instructions, the PLC can direct the output devices to perform a cyclic chain of events. This is useful in an automated manufacturing environment where repetitive tasking is the bulk of the operations..."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["In the experiment, you will enter a ladder logic program that demonstrates the operation of the sequencer instructions. You will send a sequence of light patterns to the output port that controls the LEDs..."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Let's begin the lesson on SEQUENCER INSTRUCTIONS.........................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1040", "text": ["In this lesson, we will examine the sequencer instructions used by a PLC. First, let's discuss what a sequence is."], "jumps": ["P1050", "P1001"]}, {"id": "P1050", "text": ["A sequence is an ordered list of items. In this case, a sequence is a data file with words in it. Contained in the words is a pattern of events being directed to a particular output.", "open door get broom close door sweepeatures 2. Use The Programming Device 4. Consult Flow Charts", "0010 1010 1011 0001close door sweepeatures 2. Use The Programming Device 4. Consult Flow Charts"], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["For example, let's say you want to turn on one laser for one second, turn on a second laser for two seconds, and then wait three seconds until repeating the process. The smallest stipulated time interval is one second, so each sequence should last for one second..."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["To do this, timers are normally used to increment a sequence every second. After the timer is set up, we need to generate our sequence."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["Laser one is attached to output 0, bit 1 and laser two is attached to output 0, bit 3. These are the only bits that we will be using in the sequence. All other bits should remain zero."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["Now we need to determine the length of the sequence. Count up the total time and divide by the timer length. In our example, one second (for laser one) plus two seconds (for laser two) plus three seconds (for the delay) equals six seconds. Six seconds divided by one second equals a sequence length of six..."], "jumps": ["P1100", "P1060"]}, {"id": "P1100", "text": ["The first sequence data item contains only one high bit. This turns laser one on for one second. Remember, each sequence data item is to the output port once a second, based on our timer."], "jumps": ["P1110", "P1060"]}, {"id": "P1110", "text": ["The second and third data items have bit three set high, and all other bits off. This ensures that laser one is turned off and laser two is turned on for two seconds."], "jumps": ["P1120", "P1060"]}, {"id": "P1120", "text": ["The last three sequence data items have all bits set to zero. Because of this, both lasers will be off for three seconds."], "jumps": ["P1130", "P1060"]}, {"id": "P1130", "text": ["After you have reached the end of the sequence, the next output from the instruction will start back at the beginning of the sequence file. This cycle will continue until the sequence instruction settings are changed..."], "jumps": ["P1140", "P1060"]}, {"id": "P1140", "text": ["It is important to note that a timer does not need to be used. These instructions can be initiated by a series of met conditions."], "jumps": ["P1150", "P1060"]}, {"id": "P1150", "text": ["The three instructions listed below are the sequencer instructions that we will examine. Each of these instructions provide important features to sequencing a PLC.", "SQO - Sequencer Output SQC - Sequencer Compare SQL - Sequencer Loadamming Device 4. Consult Flow Charts"], "jumps": ["P1160", "P1060"]}, {"id": "P1160", "text": ["This is the Sequencer Output (SQO) instruction, the most important of the three sequencer instructions. Sequencer Output requires six parameters: file, mask, destination, control, length, and position...", "Sequencer Output File Mask Dest Control", "Word 15 13 8 0 Bit#s"], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["The file is the location of the sequencer data which will be sent to some specified destination. The Sequencer Output instruction uses 16-bits (1 word) at a time as a sequencer data item.."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["The next parameter is the mask. This indicates which bits you want sent to the destination. The value can be an actual value or a data element in memory."], "jumps": ["P1190", "P1160"]}, {"id": "P1190", "text": ["The destination (dest) is a word location where the sequenced data will be sent. In most cases, this will be an output data file."], "jumps": ["P1200", "P1160"]}, {"id": "P1200", "text": ["The control parameter indicates a data element in memory used to control the operation of the sequencer outputs. The data element contains three words. The first word contains status bits about the sequencing..."], "jumps": ["P1210", "P1160"]}, {"id": "P1210", "text": ["The second word indicates the length and current position of the sequencer file. Since these values can be modified, make sure you don't go outside a file range, to prevent errors from occurring..."], "jumps": ["P1220", "P1160"]}, {"id": "P1220", "text": ["The sequence status bits indicate different states of the sequencer instruction operation. The EN (enable bit) indicates that a low to high transition in the preceding logic path occurred which enabled the instruction to sequence once..."], "jumps": ["P1230", "P1160"]}, {"id": "P1230", "text": ["The DN (done bit) indicates that a sequence has occurred and is finished. The ER (error bit) indicates when there are errors in the parameter values to the instruction. This could be, for example, a negative length or position..."], "jumps": ["P1240", "P1160"]}, {"id": "P1240", "text": ["The last status bit, FD (found bit), is not used with this instruction. It is used with the next instruction we will examine, SQC."], "jumps": ["P1250", "P1160"]}, {"id": "P1250", "text": ["The length and position parameters are stored in the control data element. Again, the length is the number of words in the file you are sequencing. The position indicates the address location in the sequence data file. The maximum length is 255..."], "jumps": ["P1260", "P1160"]}, {"id": "P1260", "text": ["Remember, when a low to high transition occurs preceding this instruction, the enable bit is set. The position is incremented, the next word in the sequence data file is read and sent to the destination, the enable bit is set low, and the done bit is set high..."], "jumps": ["P1270", "P1160"]}, {"id": "P1270", "text": ["What is the maximum length that you can specify to the Sequencer Output (SQO) instruction?"], "jumps": ["P1160"]}, {"id": "P1271", "text": [], "jumps": []}, {"id": "P1272", "text": ["Remember, the maximum length is 255 words..................", "Word 15 13 8 0 Bit#s"], "jumps": []}, {"id": "P1280", "text": ["The next instruction that we are going to look at is the Sequencer Compare (SQC) instruction. This instruction is used to compare a current value with a value stored in memory or an input value...", "Sequencer Compare File Mask Dest Control", "Word 15 13 8 0 Bit#s"], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["Many devices provide data about the current status of the device. This is sometimes referred to as diagnostics. If you know all the different diagnostic words that a device can send you, you can put them all in a data file..."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["When the PLC reads the inputs, a Sequencer Compare instruction can be used to compare the input data to each of the items in the sequence data file one by one. The position value can then be used to determine what the next action is..."], "jumps": ["P1310", "P1280"]}, {"id": "P1310", "text": ["When a match is made between the input data and a word in the sequence data file, the found bit (FD) is set in the control data file. Notice that all the parameters are the same except destination has been replaced by source..."], "jumps": ["P1320", "P1280"]}, {"id": "P1320", "text": ["The source indicates the data element location that will be used in the comparison with the sequence data file elements. Normally, this is an input data file element but it does not have to be..."], "jumps": ["P1330", "P1280"]}, {"id": "P1330", "text": ["All other parameters work the same as for the SQO instruction. When this instruction is called (when the preceding logic goes from low to high), the position is incremented. The value from the source is sent through the mask and compared to the data element in the current position of the sequencer data file..."], "jumps": ["P1340", "P1280"]}, {"id": "P1340", "text": ["If they match, the found bit is set high, and the instruction is finished. The instruction will be used again until another low to high logic transition occurs."], "jumps": ["P1350", "P1280"]}, {"id": "P1350", "text": ["Which bit is set high when the source data word, through the mask, is equal to the currently pointed at data word in the sequencer file?"], "jumps": ["P1280"]}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1352", "text": ["Remember, it is the found bit (FD) that is set high when the source data value matches the current value pointed to in the sequencer data file.", "Sequencer Compare File Mask Dest Control", "Word 15 13 8 0 Bit#s"], "jumps": []}, {"id": "P1360", "text": ["The last instruction that we will examine is the Sequencer Load instruction (SQL). This instruction is used to load data into a sequencer file.", "Sequencer Compare File Mask Dest Control", "Word 15 13 8 0 Bit#s"], "jumps": ["P1380", "P1350"]}, {"id": "P1380", "text": ["The file parameter contains the sequencer data file to be modified. The source can be a file address, an I/O, a storage word address, or a program constant. The control, length, and position parameters work the same as for the SQO instruction..."], "jumps": ["P1390", "P1360"]}, {"id": "P1390", "text": ["When a low to high transition occurs before this instruction, the value at, or pointed to by, the source is moved into the current position of the sequencer data file and the position value is incremented..."], "jumps": ["P1400", "P1360"]}, {"id": "P1400", "text": ["Once the position value reaches the length, the position returns to zero. The instruction, when enabled again, will write a new value to the first position of the sequencer data file."], "jumps": ["P1420", "P1360"]}, {"id": "P1420", "text": ["Sequencer instructions are common in automation scenarios where the PLC performs a sequence of operations with the output device. As you become more familiar with the PLC, your experience with this instruction will grow...", "SQO - Sequencer Output SQC - Sequencer Compare SQL - Sequencer Loadamming Device 4. Consult Flow Charts"], "jumps": ["P1910", "P1360"]}, {"id": "P1910", "text": ["This completes the information on SEQUENCER INSTRUCTIONS....."], "jumps": ["P1001", "P1420"]}, {"id": "P1920", "text": ["1. The Sequencer Output (SQO) instruction is used to send a sequence of data files to a destination.", "Sequencer Output File Mask Dest Control", "Word 15 13 8 0 Bit#s"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. The Sequencer Compare (SQC) instruction is used to compare an input value with a sequence of data file elements. If a match is found, a bit will indicate this in the control word...", "Sequencer Compare File Mask Dest Control", "Word 15 13 8 0 Bit#s"], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. The Sequencer Load (SQL) instruction is used to load word data into a sequencer data file.", "Sequencer Compare File Mask Dest Control", "Word 15 13 8 0 Bit#s"], "jumps": ["P1999", "P1930"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1940"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2040", "text": ["In this experiment, you will program the PLC Trainer to use the sequencer instructions that you learned earlier in this lesson."], "jumps": ["P2050", "P2001"]}, {"id": "P2050", "text": ["You must create a new processor program and make the appropriate configurations."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["1. Connect the 5050 interface cable between the Nida Model 5050 PLC Trainer and the computer which has the APS software."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["2. Start the APS software by performing the following commands at the DOS prompt of the computer which has the APS software and is attached to the PLC Trainer. a. Type 'CD \\IPDS\\ATTACH\\SLC500' and press enter. b. Type 'APS' and press enter."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["If the software did not start, see your instructor for assistance. These instructions are for default installation of the APS software and may differ from your installation."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["3. Set up a new processor file and begin editing the ladder logic program. If you need help on configuring and setting up the PLC APS software, select the help button below."], "jumps": ["P2100", "P2080", "P2095"]}, {"id": "P2095", "text": ["Follow these steps to set up the APS software for ladder logic program entry and evaluation:", "1. From the main menu, select F4 [ OFFLINE CONFIG ] and then F6 [ CREATE ]. Enter a file name and press enter. You must use a filename that does not already exist and one ten characters or less. Do not forget your file name. 2. Using the up and down arrow keys, adjust the PROCESSOR box until '1747-L20C/F 12-DC SNK 8-RLY' is highlighted by the cursor bar. Press F2 [ SELECT PROC ] to select this processor. 3. Now we will select th I/O modules attached to the PLC. Press F5 [ CONFIGR I/O ]. 4. Press F4 [ MODIFY RACKS ] and then F1 [ RACK 1 ]. Rack 1 is the backplane that the other two modules will attach to. Use the cursor bar and select '1746-A2 2-slot Backplane' and press enter. 5. Use the arrow keys to highlight '*1' (Slot 1) with the cursor bar and press F5 [ MODIFY SLOT ]. Using the arrow keys again, highlight '1746-IG16 16-Input [ TTL ] (Sink) 5 VDC' and press F2 [ SELECT MODULE ]. 6. Use the arrow keys to highlight '*2' (Slot 2) with the cursor bar and press F5 [ MODIFY SLOT ]. Using the arrow keys again, highlight '1746-NI04V Analog Comb. 2 In & 2 Voltage Out' and press F2 [ SELECT MODULE ]. 7. Select F8 [ EXIT ] and F8 [ SAVE & EXIT ] and then F8 [ ACCEPT ]. 8. Press F3 [ OFFLINE PRG/DOC ] and then F1 [ PROCSSR FUNCTNS ]. We are going to change the name of our ladder logic file to be more descriptive of what it does. 9. Using the cursor bar, select File 2 and press F4 [ CHANGE FL. NAME] Enter 'T_C_TEST' and press return. The name should appear in the Name column for file 2. 10. We are now ready to edit the ladder program file. Using the arrow keys, highlight File 2 and press F8 [ MONITOR FILE ]. 11. To began editing, press F10 [ EDIT ].", "1. From the main menu, select F4 [ OFFLINE CONFIG ] and then F6 [ CREATE FILE ]. Enter a file name and press enter. You must use a filename that does not already exist and only ten characters or less. Do not forget your file name. 2. Using the up and down arrow keys, adjust the PROCESSOR box until '1747-L20C/F 12-DC SNK 8-RLY' is highlighted by the cursor bar. Press F2 [ SELECT PROC ] to select this processor. 3. Now we will select the I/O modules attached to the PLC. Press F5 [ CONFIGR I/O ]. 4. Press F4 [ MODIFY RACKS ] and then F1 [ RACK 1 ]. Rack 1 is the backplane that the other two modules will attach to. Use the cursor bar and select '1746-A2 2-slot Backplane' and press enter. 5. Use the arrow keys to highlight '*1' (Slot 1) with the cursor bar and press F5 [ MODIFY SLOT ]. Using the arrow keys again, highlight '1746-IG16 16-Input [ TTL ] (Sink) 5 VDC' and press F2 [ SELECT MODULE ]. 6. Use the arrow keys to highlight '*2' (Slot 2) with the cursor bar and press F5 [ MODIFY SLOT ]. Using the arrow keys again, highlight '1746-NI04V Analog Comb. 2 In & 2 Voltage Out' and press F2 [ SELECT MODULE ]. 7. Select F8 [ EXIT ] and F8 [ SAVE & EXIT ] and then F8 [ ACCEPT ]. 8. Press F3 [ OFFLINE PRG/DOC ] and then F1 [ PROCSSR FUNCTNS ]. We are going to change the name of our ladder logic file to be more descriptive of what it does. 9. Using the cursor bar, select File 2 and press F4 [ CHANGE FL. NAME] Enter 'S_TEST' and press return. The name should appear in the Name column for file 2. 10. We are now ready to edit the ladder program file. Using the arrow keys, highlight File 2 and press F8 [ MONITOR FILE ]. 11. To began editing, press F10 [ EDIT ]."], "jumps": []}, {"id": "P2100", "text": ["The program shown below is the ladder logic program you will enter to demonstrate the sequencer instructions that you learned in the first part of this lesson."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["Before you enter the program into the PLC APS software, let's look at what the program should do. This will help us understand if the program is operating properly when we test it."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["On the 5050-1 PC card, there is one switch that will be used for this program: the slide switch labeled \"power\", which is connected to I:0/2."], "jumps": ["P2130", "P2100"]}, {"id": "P2130", "text": ["The slide switch is used to set the PLC to perform one of two operations. This allows us to load the sequencer file data into a specific location at any time, or sequence the data to the output.ut."], "jumps": ["P2140", "P2100"]}, {"id": "P2140", "text": ["When the slide switch is in the left (OFF) position, three fill file instructions are used to place six words of information into six data words in file #B10 starting with word 1. Fill file is used since the second and third FLL instructions write data to multiple locations..."], "jumps": ["P2150", "P2100"]}, {"id": "P2150", "text": ["You may have noticed that this example is the same as the one discussed in the first part of this lesson. Laser one is attached to the first output bit and should be on for 1 second. Then, laser two (attached to output bit three) is on for 2 seconds. Finally, all outputs are off for three seconds..."], "jumps": ["P2160", "P2100"]}, {"id": "P2160", "text": ["When the slide switch is in the right (ON) position, the second and third rungs will be used. The second rung is a timer and is activated when the slide switch is in the right position. This timer counts for 1 second and then sets the done bit..."], "jumps": ["P2170", "P2100"]}, {"id": "P2170", "text": ["The third rung waits for the timer's done bit to be set. When this occurs, the timer resets, and the sequencer sends the next piece of sequential data. Every second, a new sequence data item is sent..."], "jumps": ["P2180", "P2100"]}, {"id": "P2180", "text": ["The operation of these instructions is straightforward. The example from the first section of the lesson was used to build your confidence in using the sequence instructions.", "SQO - Sequencer Output SQC - Sequencer Compare SQL - Sequencer Loadamming Device 4. Consult Flow Charts"], "jumps": ["P2190", "P2100"]}, {"id": "P2190", "text": ["In advanced systems, sequences can be very complex and varied based on the process requirements.", "SQO - Sequencer Output SQC - Sequencer Compare SQL - Sequencer Loadamming Device 4. Consult Flow Charts"], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": [], "jumps": ["P2210", "P2180"]}, {"id": "P2210", "text": ["Each rung is presented in order for you to type it into the APS software. If you are having trouble, a help button will give you a list of steps for entering the instruction. Try to do as much as possible on your own..."], "jumps": ["P2220", "P2180"]}, {"id": "P2220", "text": ["4. Enter Rung 1 shown below..............................."], "jumps": ["P2230", "P2180", "P2225"]}, {"id": "P2225", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, XIC and then enter I:0/2. 3. Select FILE, FLL,1, #B10:1 and 1. 4. Press ESC, BRANCH, INSERT BRANCH and TARGET C. 5. Select APPEND INSTR, FILE, FLL, 4, #B10:2, and 2. 6. Press ESC, BRANCH, INSERT BRANCH and TARGET B. 7. Select APPEND INSTR, FILE FLL, 0, #B10:4 and 3. 8. Press ESC and ACCEPT RUNG. 11. To begin editing, press F10 [ EDIT ]. 3. Now we will select the I/O modules attached to the PLC. Press F5 [ CONFIGR I/O ]. 4. Press F4 [ MODIFY RACKS ] and then F1 [ RACK 1 ]. Rack 1 is the backplane that the other two modules will attach to. Use the cursor bar and select '1746-A2 2-slot Backplane' and press enter. 5. Use the arrow keys to highlight '*1' (Slot 1) with the cursor bar and press F5 [ MODIFY SLOT ]. Using the arrow keys again, highlight '1746-IG16 16-Input [ TTL ] (Sink) 5 VDC' and press F2 [ SELECT MODULE ]. 6. Use the arrow keys to highlight '*2' (Slot 2) with the cursor bar and press F5 [ MODIFY SLOT ]. Using the arrow keys again, highlight '1746-NI04V Analog Comb. 2 In & 2 Voltage Out' and press F2 [ SELECT MODULE ]. 7. Select F8 [ EXIT ] and F8 [ SAVE & EXIT ] and then F8 [ ACCEPT ]. 8. Press F3 [ OFFLINE PRG/DOC ] and then F1 [ PROCSSR FUNCTNS ]. We are going to change the name of our ladder logic file to be more descriptive of what it does. 9. Using the cursor bar, select File 2 and press F4 [ CHANGE FL. NAME] Enter 'S_TEST' and press return. The name should appear in the Name column for file 2. 10. We are now ready to edit the ladder program file. Using the arrow keys, highlight File 2 and press F8 [ MONITOR FILE ]. 11. To begin editing, press F10 [ EDIT ]."], "jumps": []}, {"id": "P2230", "text": ["5. Enter Rung 2 shown below..............................."], "jumps": ["P2240", "P2220", "P2235"]}, {"id": "P2235", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, XIO and then enter I:0/2. 3. Select TIMER/COUNTER, TON and enter T4:0, 100 and 0. 4. Press ESC and ACCEPT RUNG..."], "jumps": []}, {"id": "P2240", "text": ["6. Enter Rung 3 shown below..............................."], "jumps": ["P2250", "P2230", "P2245"]}, {"id": "P2245", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, XIC and then enter T4:0/DN. 3. Select TIMER/COUNTER, RES and enter T4:0. 4. Press ESC, BRANCH, INSERT BRANCH and TARGET C. 5. Select APPEND INSTR, SHIFT/SEQUENCER, SQO and enter #B10:0, 05, O:0.0, R6:1. 6. Press ESC and ACCEPT RUNG. LE FLL, 0, #B10:4 and 3. 8. Press ESC and ACCEPT RUNG. . To begin editing, press F10 [ EDIT ]. 3. Now we will select the I/O modules attached to the PLC. Press F5 [ CONFIGR I/O ]. 4. Press F4 [ MODIFY RACKS ] and then F1 [ RACK 1 ]. Rack 1 is the backplane that the other two modules will attach to. Use the cursor bar and select '1746-A2 2-slot Backplane' and press enter. 5. Use the arrow keys to highlight '*1' (Slot 1) with the cursor bar and press F5 [ MODIFY SLOT ]. Using the arrow keys again, highlight '1746-IG16 16-Input [ TTL ] (Sink) 5 VDC' and press F2 [ SELECT MODULE ]. 6. Use the arrow keys to highlight '*2' (Slot 2) with the cursor bar and press F5 [ MODIFY SLOT ]. Using the arrow keys again, highlight '1746-NI04V Analog Comb. 2 In & 2 Voltage Out' and press F2 [ SELECT MODULE ]. 7. Select F8 [ EXIT ] and F8 [ SAVE & EXIT ] and then F8 [ ACCEPT ]. 8. Press F3 [ OFFLINE PRG/DOC ] and then F1 [ PROCSSR FUNCTNS ]. We are going to change the name of our ladder logic file to be more descriptive of what it does. 9. Using the cursor bar, select File 2 and press F4 [ CHANGE FL. NAME] Enter 'S_TEST' and press return. The name should appear in the Name column for file 2. 10. We are now ready to edit the ladder program file. Using the arrow keys, highlight File 2 and press F8 [ MONITOR FILE ]. 11. To begin editing, press F10 [ EDIT ]."], "jumps": []}, {"id": "P2250", "text": ["Now that we have finished entering the program, we need to load it into the PLC and test it. Ensure the last rung of the program has been accepted."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["7. Set the PLC Trainer to the initial control settings....", "Main Power ON DC Power ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF"], "jumps": ["P2250"]}, {"id": "P2265", "text": ["INITIAL CONTROL SETTING - Main Power ON, DC Power ON, Monitor ON, Process Selector OFF, +DC Voltage Select 5V, PC1 & PC2 Power OFF."], "jumps": []}, {"id": "P2270", "text": ["8. Place the PC5050-1 card in the PC1 position. 9. Set the power slide switch to ON (right position)."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["10. Set the PLC Trainer controls as follows:..............", "+DC Voltage Select 24V PC1 Power ON ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF"], "jumps": ["P2270", "P2285"]}, {"id": "P2285", "text": ["PLC TRAINER CONTROLS - Turn the +DC Voltage Select dial fully CW to the 24V position. Push the PC1 Power switch up to the ON position."], "jumps": []}, {"id": "P2320", "text": ["The trainer is now on and set up to receive the program. Let's send our program to the trainer."], "jumps": ["P2330", "P2280"]}, {"id": "P2330", "text": ["11. Press F1 [SAVE/GO ONLINE]. If the file exists, you will be asked if you would like to overwrite it. Press F8 [YES]. If the processor is not in program mode, the APS software will ask you if it can switch to that mode. Press F8 [YES]."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["12. Once the program has been sent, the APS software will ask you if you would like to switch to run mode. Again, press F8 [YES]."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["The program is now running. Set the slide switch to the left position."], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["You should now observe the sequence: output bit 0 on for one second, bit 2 on for two seconds, and all bits off for three seconds."], "jumps": ["P2370", "P2350"]}, {"id": "P2370", "text": ["This completes the demonstration of the sequencer instructions. Feel free to create your own ladder logic and enter it into the APS software. It is easier to write your logic on paper first and then enter it into the software...."], "jumps": ["P2380", "P2350"]}, {"id": "P2380", "text": ["If you want to edit your program, select EDIT and edit DISK PROGRAM. Then follow the same steps to send the program to the PLC Trainer. The inputs and outputs are listed below.", "I :0/0 Start Switch O :0/0 Led 0 O :0/4 Led 4 I :0/1 Stop Switch O :0/1 Led 1 O :0/5 Led 5 I :0/2 Power Switch O :0/2 Led 2 O :0/6 Led 6 O :0/3 Led 3 O :0/7 Led 74"], "jumps": ["P2390", "P2350"]}, {"id": "P2390", "text": ["13. Press F3 [EXIT] or ESC and then F3 depending on where you left off in the APS software. Now select F3 [RETURN TO MENU] and then F10 [EXIT SYSTEM]."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["14. Return the PLC Trainer to the initial control settings.", "Main Power ON DC Power ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF"], "jumps": ["P2390"]}, {"id": "P2410", "text": ["15. Turn OFF the PLC Trainer's main power switch.........."], "jumps": ["P2400"]}, {"id": "P2420", "text": ["16. Return all PC cards and test equipment to their proper storage location."], "jumps": ["P2910", "P2410"]}, {"id": "P2910", "text": ["This completes the experiment on SEQUENCER INSTRUCTIONS...."], "jumps": ["P2001", "P2420"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3020", "text": ["In this experiment, you will program the PLC Trainer to use the sequencer instructions that you have learned earlier in this lesson."], "jumps": ["P3030", "P3001"]}, {"id": "P3030", "text": ["You must create a new processor program and make the appropriate configurations."], "jumps": ["P3020"]}, {"id": "P3040", "text": ["1. Ensure the 5050 interface cable is connected between the Nida Model 5050 PLC Trainer and the computer which has the RSLinx and RSLogix software..."], "jumps": ["P3020"]}, {"id": "P3050", "text": ["2. Turn on the 5050 PLC Trainer..........................."], "jumps": ["P3040"]}, {"id": "P3060", "text": ["3. Start and set up the RSLinx communication software. If you need help on configuring and setting up the RSLinx software, select the help button below...."], "jumps": ["P3050", "P3065"]}, {"id": "P3065", "text": ["Follow these steps to start and set up the RSLinx software for communication between the computer and the PLC Trainer. 1. Start the RSLinx communication software by double-clicking the RSLinx icon on the computer that has the RSLinx software and is attached to the PLC Trainer. If the software did not start, see your instructor for assistance. 2. Now we need to know if the computer and PLC Trainer are communicating. In the right window, double-click on the AB_PIC-1 DH-485 icon. 3. Make sure that the PLC icon does not have a red \"X\" over it. If a red \"X\" is present, make sure the PLC Trainer is turned on and connected. If the PLC is still not active, see your instructor for assistance. 4. Click on the minimize button.", "1. Start the RSLinx communication software by double-clicking the RSLinx icon on the computer that has the RSLinx software and is attached to the PLC Trainer. If the software did not start, see your instructor for assistance. 2. Now we need to know if the computer and PLC Trainer are communicating. In the right window, double-click on the AB_PIC-1 DH-485 icon. 3. Make sure that the PLC icon does not have a red \"X\" over it. If a red \"X\" is present, make sure the PLC Trainer is turned on and connected. If the PLC is still not active, see your instructor for assistance. 4. Click on the minimize button. bar arrows, scroll until 1747-L20C/F 12-DC SNK In, 8-RLY Out is displayed. Click on this PLC processor and then click on OK. 6. Two windows should appear. The left window is the project window and displays the project files. The right window is the ladder window and displays the selected ladder program. LAD2 should be displayed in the ladder window title bar. 7. Now you need to select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 8. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. 9. In the right window scroll down and double-click on the 1746-IG16 16-Input (TTL-SOURCE) 5VDC module name to transfer the module information to the left window for the #1 slot of the PLC. 10. In the right window scroll down and double click on the 1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out module name to transfer the module information to the left window for the #2 slot of the PLC. 11. Save the configuration settings by clicking on the I/O configuration close button. This button is the X in top right-hand corner of the I/O configuration window. 12. The processor section of your file is complete. You are now at the main window and should see the end ladder in the ladder window."], "jumps": []}, {"id": "P3070", "text": ["4. Start the RSLogix software and set up a new processor file. If you have trouble, a help button will give you a list of steps for entering the instructions. Try to do as much as possible on your own."], "jumps": ["P3060", "P3075"]}, {"id": "P3075", "text": ["Follow these steps to start RSLogix and set up a new processor file: 1. Start the RSLogix software by double-clicking on the RSLogix icon on the computer, which has the RSLogix software and is attached to the PLC Trainer. If the software did not start, see your instructor for assistance. 2. Click on the maximize button. 3. From the standard toolbar, click on the NEW icon. 4. Enter a file name in the processor name text box. You must choose a name that does not already exist and is less than ten characters in length. Do not forget this file name. 5. Select the PLC type and the different I/O modules that we have attached to the system. In the case of the Nida PLC Trainer, there are two extra modules: a TTL module and an analog module. 6. At the bottom of the select processor type window, AB_PIC-1 should be displayed in the driver text box. If not displayed, click on the down-arrow and select AB_PIC-1. 7. Using the listbox scroll bar arrows, scroll until \"1747-L20C/F 12-DC SNK In, 8-RLY Out\" is displayed. Click on this PLC processor and then click on OK. 8. The project window (left) and the ladder window (right) will appear. LAD2 should be displayed in the ladder window title bar. 9. Select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 10. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. 11. Double-click on the \"1746-IG16 16-Input (TTL-SOURCE) 5VDC\" module name to transfer the module information to the left window for the #1 slot of the PLC. 12. Double click on the \"1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out\" module name to transfer the module information to the left window for the #2 slot of the PLC. 13. Save the configuration settings by clicking on the I/O configuration close button. This button is the \"X\" in top right-hand corner of the I/O configuration window. 14. The processor section of your file is complete. You are now at the main window and should see the \"end\" ladder in the ladder window.", "1. Start the RSLogix software by double-clicking on the RSLogix icon on the computer, which has the RSLogix software and is attached to the PLC Trainer. If the software did not start, see your instructor for assistance. 2. Click on the maximize button. 3. From the standard toolbar, click on the NEW icon. 4. Enter a file name in the processor name text box. You must choose a name that does not already exist and is less than ten characters in length. Do not forget this file name. 5. Select the PLC type and the different I/O modules that we have attached to the system. In the case of the Nida PLC Trainer, there are two extra modules: a TTL module and an analog module. At the bottom of the select processor type window, AB_PIC-1 should be displayed in the driver text box. If not displayed, click on the down-arrow and select AB_PIC-1. 7. Using the listbox scroll bar arrows, scroll until \"1747-L20C/F 12-DC SNK In, 8-RLY Out\" is displayed. Click on this PLC processor and then click on OK. 8. The project window (left) and the ladder window (right) will appear. LAD2 should be displayed in the ladder window title bar. 9. Select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 10. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. 11. Double-click on the \"1746-IG16 16-Input (TTL-SOURCE) 5VDC\" module name to transfer the module information to the left window for the #1 slot of the PLC. 12. Double click on the \"1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out\" module name to transfer the module information to the left window for the #2 slot of the PLC. 13. Save the configuration settings by clicking on the I/O configuration close button. This button is the \"X\" in top right-hand corner of the I/O configuration window. 14. The processor section of your file is complete. You are now at the main window and should see the \"end\" ladder in the ladder window."], "jumps": []}, {"id": "P3076", "text": ["Follow these steps to start RSLogix and set up a new processor file: 1. Start the RSLogix software by double-clicking on the RSLogix icon on the computer, which has the RSLogix software and is attached to the PLC Trainer. If the software did not start, see your instructor for assistance. 2. Click on the maximize button. 3. From the standard toolbar, click on the NEW icon. 4. Enter a file name in the processor name text box. You must choose a name that does not already exist and is less than ten characters in length. Do not forget this file name. 5. Select the PLC type and the different I/O modules that we have attached to the system. In the case of the Nida PLC Trainer, there are two extra modules: a TTL module and an analog module. 6. At the bottom of the select processor type window, AB_PIC-1 should be displayed in the driver text box. If not displayed, click on the down-arrow and select AB_PIC-1. 7. Using the listbox scroll bar arrows, scroll until \"1747-L20C/F 12-DC SNK In, 8-RLY Out\" is displayed. Click on this PLC processor and then click on OK. 8. The project window (left) and the ladder window (right) will appear. LAD2 should be displayed in the ladder window title bar. 9. Select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 10. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. 11. Double-click on the \"1746-IG16 16-Input (TTL-SOURCE) 5VDC\" module name to transfer the module information to the left window for the #1 slot of the PLC. 12. Double click on the \"1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out\" module name to transfer the module information to the left window for the #2 slot of the PLC. 13. Save the configuration settings by clicking on the I/O configuration close button. This button is the \"X\" in top right-hand corner of the I/O configuration window. 14. The processor section of your file is complete. You are now at the main window and should see the \"end\" ladder in the ladder window.", "6. At the bottom of the select processor type window, AB_PIC-1 should be displayed in the driver text box. If not displayed, click on the down-arrow and select AB_PIC-1. 7. Using the listbox scroll bar arrows, scroll until \"1747-L20C/F 12-DC SNK In, 8-RLY Out\" is displayed. Click on this PLC processor and then click on OK. 8. The project window (left) and the ladder window (right) will appear. LAD2 should be displayed in the ladder window title bar. 9. Select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 10. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8- RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted."], "jumps": []}, {"id": "P3077", "text": ["Follow these steps to start RSLogix and set up a new processor file: 1. Start the RSLogix software by double-clicking on the RSLogix icon on the computer, which has the RSLogix software and is attached to the PLC Trainer. If the software did not start, see your instructor for assistance. 2. Click on the maximize button. 3. From the standard toolbar, click on the NEW icon. 4. Enter a file name in the processor name text box. You must choose a name that does not already exist and is less than ten characters in length. Do not forget this file name. 5. Select the PLC type and the different I/O modules that we have attached to the system. In the case of the Nida PLC Trainer, there are two extra modules: a TTL module and an analog module. 6. At the bottom of the select processor type window, AB_PIC-1 should be displayed in the driver text box. If not displayed, click on the down-arrow and select AB_PIC-1. 7. Using the listbox scroll bar arrows, scroll until \"1747-L20C/F 12-DC SNK In, 8-RLY Out\" is displayed. Click on this PLC processor and then click on OK. 8. The project window (left) and the ladder window (right) will appear. LAD2 should be displayed in the ladder window title bar. 9. Select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 10. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. 11. Double-click on the \"1746-IG16 16-Input (TTL-SOURCE) 5VDC\" module name to transfer the module information to the left window for the #1 slot of the PLC. 12. Double click on the \"1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out\" module name to transfer the module information to the left window for the #2 slot of the PLC. 13. Save the configuration settings by clicking on the I/O configuration close button. This button is the \"X\" in top right-hand corner of the I/O configuration window. 14. The processor section of your file is complete. You are now at the main window and should see the \"end\" ladder in the ladder window.", "11. Double-click on the \"1746-IG16 16-Input (TTL-SOURCE) 5VDC\" module name to transfer the module information to the left window for the #1 slot of the PLC. 12. Double click on the \"1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out\" module name to transfer the module information to the left window for the #2 slot of the PLC. 13. Save the configuration settings by clicking on the I/O configuration close button. This button is the \"X\" in top right-hand corner of the I/O configuration window. 14. The processor section of your file is complete. You are now at the main window and should see the \"end\" ladder in the ladder window.hand corner of the I/O configuration window. 14. The processor section of your file is complete. You are now at the main window and should see the \"end\" ladder in the ladder window.................................................... Out\" module name to transfer the module information to the left window for the #2 slot of the PLC. 13. Save the configuration settings by clicking on the I/O configuration close button. This button is the \"X\" in top right-hand corner of the I/O configuration window. 14. The processor section of your file is complete. You are now at the main window and should see the \"end\" ladder in the ladder window."], "jumps": []}, {"id": "P3080", "text": ["The program shown below is the ladder logic program you will enter to demonstrate the sequencer instructions that you learned in the first part of this lesson."], "jumps": ["P3070"]}, {"id": "P3090", "text": ["Before you enter the program into the PLC RSLogix software, let's look at what the program should do. This will help us understand if the program is operating properly when we test it."], "jumps": ["P3080"]}, {"id": "P3100", "text": ["On the 5050-1 PC card, there is one switch that will be used for this program: the slide switch labeled \"power\", which is connected to I:0/2."], "jumps": ["P3080"]}, {"id": "P3110", "text": ["The slide switch is used to set the PLC to perform one of two operations. This allows us to load the sequencer file data into a specific location at any time, or sequence the data to the output."], "jumps": ["P3100"]}, {"id": "P3120", "text": ["When the slide switch is in the left (OFF) position, three fill file instructions are used to place six words of information into six data words in file #B10 starting with word 1. Fill file is used since the second and third FLL instructions write data to multiple locations..."], "jumps": ["P3110"]}, {"id": "P3130", "text": ["You may have noticed that this example is the same as the one discussed in the first part of this lesson. Laser one is attached to the first output bit and should be on for 1 second. Then, laser two (attached to output bit three) is on for 2 seconds. Finally, all outputs are off for three seconds..."], "jumps": ["P3110"]}, {"id": "P3140", "text": ["When the slide switch is in the right (ON) position, the second and third rungs will be used. The second rung is a timer and is activated when the slide switch is in the right position. This timer counts for 1 second and then sets the done bit..."], "jumps": ["P3150", "P3110"]}, {"id": "P3150", "text": ["The third rung waits for the timer's done bit to be set. When this occurs, the timer resets, and the sequencer sends the next piece of sequential data. Every second, a new sequence data item is sent..."], "jumps": ["P3160", "P3110"]}, {"id": "P3160", "text": ["The operation of these instructions is straightforward. The example from the first section of the lesson was used to build your confidence in using the sequence instructions.", "SQO - Sequencer Output SQC - Sequencer Compare SQL - Sequencer Loadamming Device 4. Consult Flow Charts"], "jumps": ["P3170", "P3110"]}, {"id": "P3170", "text": ["In advanced systems, sequences can be very complex and varied based on the process requirements."], "jumps": ["P3180", "P3160"]}, {"id": "P3180", "text": ["Let's enter the ladder logic program......................."], "jumps": ["P3190", "P3160"]}, {"id": "P3190", "text": ["Each rung is presented in order for you to type it into the RSLogix software. If you are having trouble, a help button will give you a list of steps for entering the instructions. Try to do as much as possible on your own..."], "jumps": ["P3200", "P3180"]}, {"id": "P3200", "text": ["5. Enter rung 1 shown below..............................."], "jumps": ["P3210", "P3180", "P3205"]}, {"id": "P3205", "text": ["RUNG 111ng. Highlight the number to the left of the end rung to select the end rung. Click on the user tab. Click on the new rung icon. 2. Add an XIC instruction. Click on the bit tab and then click on the XIC icon. Type I:0/2 and press <ENTER>. 3. Add an FLL instruction. Click on the file/misc tab (use the right arrow next the tabs to scroll to the file/misc tab) and then click on FLL. For source, type 1 and press <ENTER>. For destination, type #B10:1 and press <ENTER>. For length, type 1 and press <ENTER>. 4. Add a branch to the FLL instruction. On this rung click on the XIC instruction to select it. Click on the user tab, and then click on the rung branch icon. Grab the right side of the new branch and drag it to the right side of the FLL instruction. 5. Add a second FLL instruction to the new branch. Click on the bottom-left corner of the new branch. Click on the file/misc tab, and then click on the FLL icon. For source, type 4 and press <ENTER>. For destination, type #B10:2 and press <ENTER>. For length, type 2 and press <ENTER>. 6. Add another branch to the previous FLL instructions. On this rung click on the XIC instruction to select it. Click on the user tab, and then click on the rung branch icon. Grab the right side of the new branch and drag it to the right side of the first FLL instruction. 7. Add a third FLL instruction to the rung. Click on the bottom-left corner of the new branch. Click on the file/misc tab, and then click on the FLL icon. For source, type 0 and press <ENTER>. For destination, type #B10:4 and press <ENTER>. For length type 3 and press <ENTER>. 8. Verify the rung. Click on the verify icon.", "1. Add a rung. Highlight the number to the left of the end rung to select the end rung. Click on the user tab. Click on the new rung icon. 2. Add an XIC instruction. Click on the bit tab and then click on the XIC icon. Type I:0/2 and press <ENTER>. 3. Add an FLL instruction. Click on the file/misc tab (use the right arrow next to the tabs to scroll to the file/misc tab) and then click on FLL. For source, type 1 and press <ENTER>. For destination, type B10:1 and press <ENTER>. For length, type 1 and press <ENTER>. 4. Add a branch to the FLL instruction. On this rung click on the XIC instruction t OL SETTING - Main power ON, DC Power ON, Monitor ON, Process Selector OFF, +DC Voltage Select 5V, PC1 & PC2 Power OFF."], "jumps": []}, {"id": "P3260", "text": ["10. Set the PLC Trainer controls as follows:..............", "+DC Voltage Select 24V PC1 Power ON ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF"], "jumps": ["P3250", "P3265"]}, {"id": "P3265", "text": ["PLC TRAINER CONTROLS - Turn the +DC Voltage Select dial full CW to the 24V position. The PC1 Power switch down to the ON position.."], "jumps": []}, {"id": "P3270", "text": ["The trainer is now on and set up to receive the program. Let's send our program to the trainer."], "jumps": ["P3280", "P3260"]}, {"id": "P3280", "text": ["11. Save the project. Click on File, and then Save. Select OK from the revision note dialog box that may pop-up."], "jumps": ["P3290", "P3270"]}, {"id": "P3290", "text": ["12. Download the project to the PLC trainer and go to run mode. If you need help on downloading and setting run mode, select the help button below."], "jumps": ["P3300", "P3280", "P3295"]}, {"id": "P3295", "text": ["Follow these steps to download the project to the PLC trainer and go to run mode:", "1. Click on the down-arrow button to the right of the processor status box, which contains the text \"OFFLINE\", then select download from the menu. 2. Click on OK if the revision note dialog box pops-up. 3. A confirmation box will display asking if you want to proceed with the download. Click on yes. 4. A confirmation box will display asking if you want to switch to program mode. Click on yes. 5. After the program is downloaded. A confirmation box will display asking if you want to change back to run mode. Click on yes. 6. A confirmation box will display asking if you want to go online. Click on yes. istbox scroll bar arrows, scroll until 1747-L20C/F 12-DC SNK In, 8-RLY Out is displayed. Click on this PLC processor and then click on OK. 6. Two windows should appear. The left window is the project window and displays the project files. The right window is the ladder window and displays the selected ladder program. LAD2 should be displayed in the ladder window title bar. 7. Now you need to select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 8. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. 9. In the right window scroll down and double-click on the 1746-IG16 16-Input (TTL-SOURCE) 5VDC module name to transfer the module information to the left window for the #1 slot of the PLC. 10. In the right window scroll down and double click on the 1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out module name to transfer the module information to the left window for the #2 slot of the PLC. 11. Save the configuration settings by clicking on the I/O configuration close button. This button is the X in top right-hand corner of the I/O configuration window. 12. The processor section of your file is complete. You are now at the main window and should see the end ladder in the ladder window."], "jumps": []}, {"id": "P3300", "text": ["The program is now running. Set the slide switch to the left position."], "jumps": ["P3310", "P3290"]}, {"id": "P3310", "text": ["You should now observe the sequence: output bit 0 on for one second, bit 2 on for two seconds, and all bits off for three seconds."], "jumps": ["P3320", "P3300"]}, {"id": "P3320", "text": ["This completes the demonstration of the sequencer instructions. Feel free to create your own ladder logic and enter it into the RSLogix software. It is easier to write your logic on paper first and then enter it into the software...."], "jumps": ["P3330", "P3300"]}, {"id": "P3330", "text": ["If you want to edit your program, use the tabs and instructions for the ladder (right) window. Then follow the same steps to send the program to the PLC trainer. The inputs and outputs are listed below...", "I :0/0 Start Switch O :0/0 Led 0 O :0/4 Led 4 I :0/1 Stop Switch O :0/1 Led 1 O :0/5 Led 5 I :0/2 Power Switch O :0/2 Led 2 O :0/6 Led 6 O :0/3 Led 3 O :0/7 Led 74"], "jumps": ["P3340", "P3320"]}, {"id": "P3340", "text": ["13. Click on File and then click on Close from the menu..."], "jumps": ["P3350", "P3330"]}, {"id": "P3350", "text": ["14. Return the PLC trainer to the initial control settings.", "Main Power ON DC Power ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF"], "jumps": ["P3340", "P3255"]}, {"id": "P3360", "text": ["15. Turn off the PLC trainer's main power switch..........."], "jumps": ["P3370", "P3350"]}, {"id": "P3370", "text": ["16. Return all PC cards and test equipment to their proper storage location."], "jumps": ["P3910", "P3360"]}, {"id": "P3910", "text": ["This completes the experiment on SEQUENCER INSTRUCTIONS...."], "jumps": ["P3001", "P3370"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["Which bit indicates the Sequencer Output instruction is enabled?"], "jumps": []}, {"id": "P10211", "text": ["Which bit indicates the Sequencer Output instruction is done?"], "jumps": []}, {"id": "P1021 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
