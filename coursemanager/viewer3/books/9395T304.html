<script>
const book = {"title": "9395T304", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . .", "Title: AC MOTORS AND GENERATORSasd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Discuss general AC generator theory. w Describe generator construction. w Describe generator characteristics.", "w Describe motor theory of operation. w Describe AC motor construction. w Discuss terms and types of AC motors. w Discuss the equivalent model of an induction motor transformer."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about the operation of AC motors and generators.", "AC Voltage Input Mechanical Output", "Mechanical Input AC Voltage Output"], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Generators and electric motors perform opposite functions."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Motors convert an electrical input to a mechanical output.."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Generators convert a mechanical input to an electrical output."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["Using a motor to supply the mechanical input to a generator is one way that generators are driven."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["Motors drive components to produce motion and generators supply power that is not normally available."], "jumps": ["P460", "P440"]}, {"id": "P460", "text": ["AC motors and AC generators are types of rotating machinery."], "jumps": ["P470", "P450"]}, {"id": "P470", "text": ["As an electronic technician, you will be required to service equipment that uses AC motors and generators."], "jumps": ["P480", "P460"]}, {"id": "P480", "text": ["Let's begin the lesson on AC MOTORS AND GENERATORS........................"], "jumps": ["P460"]}, {"id": "P900", "text": [], "jumps": ["P480"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["AC motors, just like DC motors, are classified as continuous devices."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["DC motors have certain operating characteristics...........", "DC Motor Characteristics 1. High Starting Torque 2. Speed Control Capabilities 3. Large Starting Current"], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["When an application requires one or more of these features, a DC motor is usually used."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["When these features are not required, the AC motor is usually used."], "jumps": ["P1060", "P1030"]}, {"id": "P1060", "text": ["Since AC power is used in every home and office worldwide, the AC motor is the most popular device."], "jumps": ["P1070", "P1030"]}, {"id": "P1070", "text": ["Based on their construction, AC motors can be classified as universal, induction and synchronous... and synchronous."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["The universal motor is essentially a DC motor with stator windings (not permanent magnet). AC or DC can be applied to universal motors......."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["Synchronous motors are either large horse power or special application devices. seldom found by electronic technicians."], "jumps": ["P1100", "P1070"]}, {"id": "P1100", "text": ["Applications for AC induction motors include: machines, pumps, spindles and clocks."], "jumps": ["P1110", "P1070"]}, {"id": "P1110", "text": ["What are DC and AC motors classified?at type?.............."], "jumps": ["P1070"]}, {"id": "P1111", "text": [], "jumps": []}, {"id": "P1112", "text": ["Induction and synchronous motors are only classified as AC motors."], "jumps": []}, {"id": "P1120", "text": ["All motors require the same basic criteria for motor action to occur.", "Speed (RPM) Torque Counter Electromotive Force Loads Power Efficiency"], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["There are, however, some major differences between the DC and AC motor construction."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["AC motor rotors do not have turns of wire connected externally to a voltage source through a commutator assembly."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["AC rotors (inductor type) have a distinct appearance and are often referred to as squirrel cage rotors."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["The squirrel cage rotor is simpler and less expensive to manufacture than the DC rotor."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["The squirrel cage rotor requires no commutator or brush assembly. This reduces cost, maintenance and sparking."], "jumps": ["P1180", "P1150"]}, {"id": "P1180", "text": ["The stator of an AC motor is similar to the stator of a DC motor."], "jumps": ["P1190", "P1150"]}, {"id": "P1190", "text": ["In both motor types, the field windings are placed on pole pieces to generate a magnetic field."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["Which part listed below is used in AC motors only?........."], "jumps": ["P1180"]}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1202", "text": ["A stator is common to both DC and AC motors and works with the rotor to generate motor action."], "jumps": []}, {"id": "P1203", "text": ["The commutator and brushes are common to a DC motor only..."], "jumps": []}, {"id": "P1210", "text": ["Since an AC induction motor's rotor has no commutator, brushes or applied voltage source, it cannot generate a field."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["The only field induced in an AC motor is the result of the windings around the pole pieces."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["If an AC induction motor has only one field in the stator, how can motor action occur?"], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["To understand AC motor action, let's use 3 moving magnets: 2 stators and 1 rotor."], "jumps": ["P1250", "P1230", "Pivot"]}, {"id": "P1250", "text": ["Assume that the outside magnets (stator magnets) rotate and that the distance between the two magnets is small."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["Attracted forces between the two magnets cause the rotor magnet to follow."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["The rotor will rotate around the pivot point."], "jumps": ["P1280", "P1240"]}, {"id": "P1280", "text": ["If the rotor magnet keeps pace with the stator magnets, then the magnets are said to be synchronized."], "jumps": ["P1290", "P1240"]}, {"id": "P1290", "text": ["If this rotation could be maintained, motor action would then exist."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["An actual AC induction motor is slightly more complicated than three moving magnets."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["The stators of an AC induction motor are fixed and do not rotate."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["The rotor of an AC induction motor is not a magnet."], "jumps": ["P1330", "P1300"]}, {"id": "P1330", "text": ["To understand an actual AC induction motor, consider two sine waves, 90", "out of phase, labeled f1 and f2...bol) 2.bol) 2.................."], "jumps": ["P1340", "P1300"]}, {"id": "P1340", "text": ["The two sine waves are applied to different pole pairs (2 poles) of the induction motor."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["If you consider the stator windings to be purely inductive, stator currents will also be 90"], "jumps": ["P1360", "P1340"]}, {"id": "P1352", "text": ["If you consider the stator windings to be purely inductive, stator currents will also be 90", "PURELY INDUCTIVE - The ability for the stator to produce the largest possible magnetic field (maximum power) across it, without having any resistance. This resistance would cause some of the power to be dissipated in the form of heat."], "jumps": ["P1360", "P1340", "P1352"]}, {"id": "P1360", "text": ["These stator currents (not voltages) cause pulsating magnetic fields that rotate in a circle around the rotor."], "jumps": ["P1370", "P1352"]}, {"id": "P1370", "text": ["Initially, f1 is at its zero crossing point, while f2 is at maximum.ximum.aximum."], "jumps": ["P1380", "P1352"]}, {"id": "P1380", "text": ["Since f2 current is maximum, a magnetic field is developed across the poles connected to f2.mbol) 2.mbol) 2.."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["At line T1, f2 is zero and f1 is maximum. This corresponds to maximum f1 current and minimum f2 current.current..current..current...current."], "jumps": ["P1400", "P1370"]}, {"id": "P1400", "text": ["Since f1 current is maximum, a magnetic field is developed across the poles connected to f1.mbol) 1..mbol) 1.."], "jumps": ["P1410", "P1370"]}, {"id": "P1410", "text": ["At time T2, f1 is zero and f2 now has its maximum negative value.ve value.ve value."], "jumps": ["P1420", "P1370"]}, {"id": "P1420", "text": ["Because f2 is negative, it corresponds to a reversed polarity magnetic field on the connected stator poles..r poles."], "jumps": ["P1430", "P1370"]}, {"id": "P1430", "text": ["At time T3, f2 is zero and f1 is at its maximum negative value. value.e value."], "jumps": ["P1440", "P1370"]}, {"id": "P1440", "text": ["Because f1 is negative, it corresponds to a reversed polarity magnetic field on the connected stator poles.or poles."], "jumps": ["P1450", "P1370"]}, {"id": "P1450", "text": ["At time T4, each waveform has completed one cycle and the process begins again."], "jumps": ["P1460", "P1370"]}, {"id": "P1460", "text": ["The changing amplitude of the waveforms cause the stator magnetic fields to constantly expand and contract, as well as rotate."], "jumps": ["P1470", "P1370"]}, {"id": "P1470", "text": ["Because of expanding and contracting stator magnetic fields, rotor current is induced. This is due to induction."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["This is how the motor derives its name, the AC induction motor."], "jumps": ["P1490", "P1460"]}, {"id": "P1490", "text": ["All squirrel cage rotors have induced current flow through the connecting rods via the shorting rings."], "jumps": ["P1500", "P1460"]}, {"id": "P1500", "text": ["The induced currents in the rotor will induce a magnetic field in the rotor."], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["The induced magnetic field in the rotor is attracted to the stator magnetic field."], "jumps": ["P1520", "P1490"]}, {"id": "P1520", "text": ["As the stator field changes, the rotor field follows due to this attraction."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["Due to the attraction of the stator field and the rotor field, motor action occurs."], "jumps": ["P1540", "P1510"]}, {"id": "P1540", "text": ["What induces current in the rotor of an induction motor?..."], "jumps": ["P1510"]}, {"id": "P1541", "text": [], "jumps": []}, {"id": "P1542", "text": ["Stator voltage is related to stator current only. The voltage cannot induce a rotor current."], "jumps": []}, {"id": "P1543", "text": ["Stator current induces a stator magnetic field, but it will not induce rotor current."], "jumps": []}, {"id": "P1550", "text": ["What induces a rotor magnetic field in an induction motor?."], "jumps": ["P1540"]}, {"id": "P1551", "text": [], "jumps": []}, {"id": "P1552", "text": ["Stator current induces a magnetic field...................."], "jumps": []}, {"id": "P1553", "text": ["A stator magnetic field induces a rotor current not a rotor magnetic field."], "jumps": []}, {"id": "P1560", "text": ["The stator magnetic field rotates from pole pair to pole pair."], "jumps": ["P1570", "P1550"]}, {"id": "P1570", "text": ["How fast the stator magnetic field rotates is known as the Field Speed or Field RPM."], "jumps": ["P1580", "P1560"]}, {"id": "P1580", "text": ["Field RPM can easily be calculated.........................", "Field RPM Formula 60 x f Field RPM = N Where: 60 = # of seconds in a minute f = frequency of the AC input N = # of Pole Pairs"], "jumps": ["P1590", "P1560"]}, {"id": "P1590", "text": ["If the input sinewave has a frequency of 60 Hz and the motor has 4 stator poles, the field RPM equals 1800."], "jumps": ["P1600", "P1580", "P1595"]}, {"id": "P1595", "text": ["60 x f Field RPM = f = 60 N N = 4/2 = 2 = (pairs of poles) 60 x 60 = 2 3600 = 2 = 18000"], "jumps": []}, {"id": "P1600", "text": ["Due to magnetic attraction, the rotor attempts to follow the stator (in rotation)."], "jumps": ["P1610", "P1590"]}, {"id": "P1610", "text": ["The rotor's RPM always lags behind the stator's magnetic field RPM."], "jumps": ["P1620", "P1600"]}, {"id": "P1620", "text": ["This is called slip RPM because the rotor slips or lags behind the stator magnetic field."], "jumps": ["P1630", "P1610"]}, {"id": "P1630", "text": ["How fast the rotor actually rotates is termed shaft speed.."], "jumps": ["P1640", "P1610"]}, {"id": "P1640", "text": ["Shaft RPM can be calculated since it is the difference between the Field RPM and the Slip RPM.", "Shaft RPM Formula Shaft RPM = Field RPM - Slip RPM 60 (f) Shaft RPM = - Slip RPM N"], "jumps": ["P1650", "P1630"]}, {"id": "P1650", "text": ["Since the rotor is always trying to catch up or synchronize with the stator field RPM, the field RPM is commonly called the Synchronous Speed of the armature.", "Field RPM = Synchronous Speed 60 x f Field RPM = N Where: 60 = # of seconds in a minute f = frequency of the AC input N = # of Pole Pairs"], "jumps": ["P1660", "P1640"]}, {"id": "P1660", "text": ["As an example of shaft speed, assume the motor's synchronous speed is 1800 RPM with a slip speed of 100 RPM. How fast is the motor's output shaft spinning?", "Shaft RPM Formula Shaft RPM = Field RPM - Slip RPM 60 (f) Shaft RPM = - Slip RPM N"], "jumps": ["P1670", "P1650"]}, {"id": "P1670", "text": ["Since synchronous speed is field RPM and slip speed is slip RPM, the motor's output shaft (shaft RPM) is rotating at 1700 RPM.", "Shaft RPM = Field RPM - Slip RPM = Synchronous Speed - Slip Speed = 1800 RPM - 100 RPM Motors Output Shaft = 1700 RPMMMMMMMMMMMMMMMMMMMMM"], "jumps": ["P1680", "P1660"]}, {"id": "P1680", "text": ["A 1 phase 8 pole induction motor is operated at 60 Hz. What is the synchronous speed of the motor?"], "jumps": ["P1670"]}, {"id": "P1681", "text": [], "jumps": []}, {"id": "P1682", "text": ["Remember, N equals the number of Pole Pairs per phase. In this case, there are 4 Pole Pairs or:", "Field RPM = Synchronous Speed 60 x f 60 x f field RPM = Synchronous Speed = N N 60(60) 60 = # of seconds in a minute 4 f = Input frequency N = # of Pole Pairss"], "jumps": []}, {"id": "P1690", "text": ["If the synchronous speed of a motor is 1200 RPM and the motor's output shaft is rotating at 1000 RPM, what is the slip speed?"], "jumps": ["P1680"]}, {"id": "P1691", "text": [], "jumps": []}, {"id": "P1692", "text": ["Remember, Field RPM equals synchronous speed and Shaft RPM equals the motors output Shaft speed or:", "Slip Speed Formula Slip speed = Field RPM - Shaft Speed = 1200 - 1000 Field RPM = 1200 Shaft Speed = 1000"], "jumps": []}, {"id": "P1700", "text": ["In an AC induction motor, the inductor (stator) is very close to the conductor (rotor)."], "jumps": ["P1710", "P1690"]}, {"id": "P1710", "text": ["Since there is no electrical connection between the stator and rotor, the magnetic field of the stator induces voltage in the rotor nodes.."], "jumps": ["P1720", "P1700"]}, {"id": "P1720", "text": ["This is identical to transformer action...................."], "jumps": ["P1730", "P1700"]}, {"id": "P1730", "text": ["Sometimes the stator is called the primary and the rotor is called the secondary."], "jumps": ["P1740", "P1720"]}, {"id": "P1740", "text": ["An equivalent electrical drawing of the stator and rotor is a step down transformer."], "jumps": ["P1750", "P1720"]}, {"id": "P1750", "text": ["A step down transformer has less voltage and more current on the secondary than the primary."], "jumps": ["P1755", "P1720"]}, {"id": "P1755", "text": ["The primary to secondary winding ratio will have a significant effect on current."], "jumps": ["P1760", "P1720"]}, {"id": "P1760", "text": ["Compared to its input current, the output current of a motor is larger."], "jumps": ["P1770", "P1720"]}, {"id": "P1770", "text": ["Remember, torque and current are proportional. The higher the current, the higher the torque."], "jumps": ["P1780", "P1720"]}, {"id": "P1780", "text": ["Rotor current depends on the relative motion between the stator's magnetic field and the conductor (rotor)."], "jumps": ["P1790", "P1720"]}, {"id": "P1790", "text": ["If the rotor is locked (no rotation), there is maximum relative motion between the rotating stator field and the conductor (rotor)."], "jumps": ["P1800", "P1720"]}, {"id": "P1800", "text": ["This produces maximum current and maximum torque."], "jumps": ["P1810", "P1720"]}, {"id": "P1810", "text": ["If the rotor is turning at the same RPM as the stator's magnetic field, there is no relative motion between the rotating stator field and conductor (rotor)."], "jumps": ["P1820", "P1720"]}, {"id": "P1820", "text": ["No current is produced and the torque is zero."], "jumps": ["P1830", "P1720"]}, {"id": "P1830", "text": ["This is an important concept when discussing loaded and unloaded AC motor characteristics."], "jumps": ["P1910", "P1720"]}, {"id": "P1910", "text": ["This completes the information on AC MOTORS.1 TITLE........"], "jumps": ["P1001", "P1720"]}, {"id": "P1920", "text": ["1. AC induction motors are continuous rotating machines that require alternating current as an input."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. Induction motor rotors are commonly called squirrel cage rotors due to their distinct appearance."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. AC motor action is caused by a rotating stator magnetic field. This field is induced by stator current (f1 and f2).).ol) 2).", "Cross section of 4-pole 2 phase AC induction motorr"], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. The rotating stator magnetic field also expands and contracts. A rotor current is generated by the principle of induction."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. The rotor current induces a magnetic field which is attracted to the stator field causing motor action."], "jumps": ["P1970", "P1940"]}, {"id": "P1970", "text": ["6. Slip speed equals the Field RPM minus Shaft RPM..........", "Shaft RPM Formula Shaft RPM = Field RPM - Slip RPM 60 (f) Shaft RPM = - Slip RPM N", "Field RPM or Synchronous Speed The rotational speed of the stator's magnetic field. Shaft RPM or Shaft speed The rotational speed of the rotor."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7. The field RPM or synchronous speed can be determined by the frequency of the input AC current and the # of pole pairs of the motor.", "Field RPM Formula 60 x f Field RPM = N Where: 60 = # of seconds in a minute f = frequency of the AC input N = # of Pole Pairs"], "jumps": ["P1999", "P1970"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2015", "text": ["Generators change mechanical energy to electrical energy. They do this by operating on the principles of magnetism."], "jumps": ["P2020", "P2001"]}, {"id": "P2020", "text": ["The first principle of magnetism used in generators is: like magnetic poles repel and unlike magnetic poles attract."], "jumps": ["P2030", "P2015"]}, {"id": "P2030", "text": ["When two magnetic poles of the same potential are close together, the magnetic fields repel the magnets."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["When two magnetic poles of opposite potential are close together, the magnetic fields attract the magnets."], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["The second principle of magnetism used in generators is: when a conductor passes through a magnetic field, electric current is produced."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["When the conductor moves up through the magnetic field, current flow is produced."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["When the conductor moves down through the magnetic field, opposite current flow is produced."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["As long as these two principles are remembered, generator action is simple.", "Mechanical Input AC Voltage Output"], "jumps": ["P2090", "P2060"]}, {"id": "P2090", "text": ["What is produced when a conductor is passed through a magnetic field?"], "jumps": ["P2080"]}, {"id": "P2091", "text": [], "jumps": []}, {"id": "P2092", "text": ["The poles of a magnet have potential, north and south. The potential of the north and south poles is opposite."], "jumps": []}, {"id": "P2105", "text": ["AC generators perform the basic function of providing an alternating current to a load.", "Mechanical Input AC Voltage Output"], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["There are two basic types of generators:...................", "Revolving - Armature Revolving - Field"], "jumps": ["P2120", "P2090"]}, {"id": "P2120", "text": ["In a revolving-armature AC generator, the stator provides a stationary electromagnetic field.", "DC Battery (External Excitation for the stator field coils)", "Lines of force in the magnetic field travel north-to-south"], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["DC Battery (External Excitation for the stator field coils)", "The excitation current for the stator field coil windings comes from an external DC source."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["Lines of force in the magnetic field travel north-to-south", "The rotor (armature) rotates in the electromagnetic field, cutting across lines of force and producing the characteristic AC sine-wave output."], "jumps": ["P2150", "P2120", "P2145"]}, {"id": "P2142", "text": ["The rotor (armature) rotates in the electromagnetic field, cutting across lines of force and producing the characteristic AC sine-wave output.", "Lines of force in the magnetic field travel north-to-south", "DC Battery (External Excitation for the stator field coils)"], "jumps": ["P2145", "P2150", "P2120"]}, {"id": "P2145", "text": ["LINES OF FORCE - Imaginary lines used to designate directions in which electric or magnetic forces act in specific materials or air.", "Lines of force in the magnetic field travel north-to-south"], "jumps": ["P2142"]}, {"id": "P2150", "text": ["Alternating current constantly changes amplitude and periodically changes direction."], "jumps": ["P2160", "P2120"]}, {"id": "P2160", "text": ["position, the armature's motion is parallel to the magnetic field of the stator and no lines of force are cut..orce are cut."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["Since no lines of force are cut, no voltage is produced."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["position, movement is perpendicular to the lines of force..ines of force."], "jumps": ["P2200", "P2160"]}, {"id": "P2200", "text": ["The perpendicular movement of the armature cuts more and more lines of force. This action increases the voltage."], "jumps": ["P2210", "P2160"]}, {"id": "P2210", "text": ["position causes fewer and fewer lines of force to be cut..rce to be cut."], "jumps": ["P2230", "P2160"]}, {"id": "P2230", "text": ["The output voltage across the load in the external circuit reverses polarity with every 180"], "jumps": ["P2240", "P2160"]}, {"id": "P2240", "text": ["With no lines of force being cut at the 180", "position, motion is again parallel to the lines of force. No voltage is produced.ge is produced."], "jumps": ["P2250", "P2160"]}, {"id": "P2250", "text": ["As the armature continues to rotate towards 270", ", motion becomes perpendicular with the lines of force. This motion cuts through more and more lines of force.lines of force."], "jumps": ["P2260", "P2160"]}, {"id": "P2260", "text": ["This action increases the voltage output."], "jumps": ["P2280", "P2160"]}, {"id": "P2280", "text": ["Finally, as the armature's rotation approaches the 0/360", "position, fewer and fewer lines of force are cut and the voltage drops back to zero.s back to zero."], "jumps": ["P2290", "P2160"]}, {"id": "P2290", "text": ["The revolving-armature is used chiefly for low-power, low-voltage applications.", "DC Battery (External Excitation for the stator field coils)", "Lines of force in the magnetic field travel north-to-south"], "jumps": ["P2300", "P2160"]}, {"id": "P2300", "text": ["Its output is conducted through moving brushes and slip rings, which are subject to frictional wear and sparking (arc-over)."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["Arc-over can result in extensive damage to the generator and external circuitry."], "jumps": ["P2320", "P2290"]}, {"id": "P2320", "text": ["What level of voltage is produced in an AC generator when the armature movement is perpendicular to the stator field?"], "jumps": ["P2290"]}, {"id": "P2321", "text": [], "jumps": []}, {"id": "P2322", "text": ["No voltage is produced when the armature movement is parallel to the stator field, at 0, 180, and 360 degrees."], "jumps": []}, {"id": "P2323", "text": ["increments.arallel to the stator field, at 0, 180, and 360 degrees."], "jumps": []}, {"id": "P2330", "text": ["Now let's discuss the Revolving-Field generator............", "Revolving - Armature Revolving - Field"], "jumps": ["P2331", "P2320"]}, {"id": "P2331", "text": ["In the revolving-field AC generator, DC from a separate source is passed through field windings on the rotor via the slip rings and brushes."], "jumps": ["P2340", "P2330"]}, {"id": "P2340", "text": ["This arrangement provides for a rotating field of fixed polarity."], "jumps": ["P2350", "P2331"]}, {"id": "P2350", "text": ["This magnetic field extends outward from the ends of the rotor, sweeping across the armature windings of the stator."], "jumps": ["P2360", "P2331"]}, {"id": "P2360", "text": ["As the rotor turns, alternating voltages are induced in the armature windings, first of one polarity and then the other."], "jumps": ["P2370", "P2331"]}, {"id": "P2370", "text": ["The north and south poles of the rotor's magnetic field alternately cut across each armature winding."], "jumps": ["P2380", "P2331"]}, {"id": "P2380", "text": ["The AC output is taken from the stationary armature windings."], "jumps": ["P2390", "P2331"]}, {"id": "P2390", "text": ["There are no sliding contacts in the output circuitry to spark or arc-over. This feature allows high-voltage and high-power applications for revolving-field generators."], "jumps": ["P2400", "P2331"]}, {"id": "P2400", "text": ["The DC exciter voltages seldom exceed 250 VDC, minimizing the need for bulky rotor field coils and insulation. Revolving-field generators can produce very high output voltages."], "jumps": ["P2410", "P2331"]}, {"id": "P2410", "text": ["In the revolving-field AC generator, DC from a separate source is passed through the _______ via the slip rings and brushes."], "jumps": ["P2331"]}, {"id": "P2411", "text": [], "jumps": []}, {"id": "P2412", "text": ["DC exciter supplies direct current to maintain the alternator."], "jumps": []}, {"id": "P2413", "text": ["The output terminals are connected to the stationary armature windings. This is the generator's AC output."], "jumps": []}, {"id": "P2420", "text": ["Let's discuss the three types of power that AC generators or alternators produce; single phase, two phase and three phase."], "jumps": ["P2421", "P2410"]}, {"id": "P2421", "text": ["A single-phase alternator physically resembles a single-phase AC motor."], "jumps": ["P2430", "P2420"]}, {"id": "P2430", "text": ["The stator coils are connected in series, so the induced voltages in each coil are together and in phase."], "jumps": ["P2440", "P2421"]}, {"id": "P2440", "text": ["The output voltage is four times the voltage of any one winding and exhibits a single-phase sine-wave output wave form."], "jumps": ["P2450", "P2421"]}, {"id": "P2450", "text": ["While single-phase and two-phase alternators are common, three-phase alternators are most widely used. They are more efficient and are capable of developing more total usable power for a given generator size..."], "jumps": ["P2460", "P2440"]}, {"id": "P2460", "text": ["Three single-phase armature windings are spaced so that the voltage induced in each armature is 120", "apart or out of phase with the other armature voltages.ature voltages."], "jumps": ["P2470", "P2450"]}, {"id": "P2470", "text": ["apart and equal in amplitude. One complete revolution of the rotor translates to a 360", "phase difference in the output voltage.output voltage.output voltage."], "jumps": ["P2480", "P2450"]}, {"id": "P2480", "text": ["What is the phase difference between waveforms of a three-phase alternator?"], "jumps": ["P2470"]}, {"id": "P2481", "text": [], "jumps": []}, {"id": "P2482", "text": ["phase shifts because one complete rotor cycle equals 360", ").egree symbol)).egree symbol)).gree symbol)).gree symbol)).egree symbol)).egree symbol)).egree symbol)).", "1 Complete Revolution 3 x 120 = 360"], "jumps": []}, {"id": "P2483", "text": ["A three phase signal is separated by 120", ", the entire output of the generator translates to 360", "phase difference.ase difference.ase difference.", "1 Complete Revolution 3 x 120 = 360"], "jumps": []}, {"id": "P2490", "text": ["Three-phase alternators are more popular than single-phase alternators because they are more efficient for a given load requirement.."], "jumps": ["P2500", "P2480"]}, {"id": "P2500", "text": ["Three-phase alternators are smaller and lighter than single-phase alternators of equal power."], "jumps": ["P2510", "P2490"]}, {"id": "P2510", "text": ["Energy flow in a three-phase alternator is smoother than in a single-phase alternator."], "jumps": ["P2520", "P2490"]}, {"id": "P2520", "text": ["Three-phase alternators allow much more flexibility than a single-phase alternator."], "jumps": ["P2530", "P2490"]}, {"id": "P2530", "text": ["By using only one waveform of a three-phase alternator you have produced a single-phase output."], "jumps": ["P2540", "P2490"]}, {"id": "P2540", "text": ["Which type of alternator is more efficient?................"], "jumps": ["P2490"]}, {"id": "P2541", "text": [], "jumps": []}, {"id": "P2542", "text": ["A single-phase alternator uses massive, bulky windings to generate a lot of power on one waveform. A three-phase system requires much smaller windings."], "jumps": []}, {"id": "P2543", "text": ["A double or two-phase alternator would be more efficient than a single-phase but not as efficient as a three-phase."], "jumps": []}, {"id": "P2550", "text": ["In order to understand many of the terms used in three-phase power distribution systems, you must first know how the alternator windings are connected."], "jumps": ["P2551", "P2540"]}, {"id": "P2551", "text": ["These are two popular winding configurations used for alternator armatures."], "jumps": ["P2560", "P2550"]}, {"id": "P2560", "text": ["Three-phase systems are usually Wye connected."], "jumps": ["P2570", "P2550"]}, {"id": "P2570", "text": ["The term \"Wye\" is derived from the shape of the connection."], "jumps": ["P2580", "P2550"]}, {"id": "P2580", "text": ["One lead of each armature winding is connected together to a common or neutral line, which is usually grounded."], "jumps": ["P2590", "P2550"]}, {"id": "P2590", "text": ["The other three leads are called \"Phase Voltages\", labeled A, B and C."], "jumps": ["P2600", "P2580"]}, {"id": "P2600", "text": ["Since each phase has a common ground (neutral), any one phase can be used to power single-phase loads.", "Most high power transmission lines are three-phase Wye connected."], "jumps": ["P2610", "P2580", "P2620", "PrP", "P"]}, {"id": "P2620", "text": ["Your home appliances run on single-phase AC................"], "jumps": ["P2630", "P2610"]}, {"id": "P2630", "text": ["LINE VOLTAGE is the voltage between any two phases: A to B, B to C, and C to A."], "jumps": ["P2640", "P2620"]}, {"id": "P2640", "text": ["There is a simple conversion between line voltages and phase voltage.", "Wye Connection Line Voltage = Phase Voltage x 1.73 Line Current = Phase Current"], "jumps": ["P2650", "P2630"]}, {"id": "P2650", "text": ["The line and phase current of a Wye connected generator are equal to each other."], "jumps": ["P2660", "P2640"]}, {"id": "P2660", "text": ["The second type of three-phase power connection is called the \"Delta\" connection."], "jumps": ["P2670", "P2640"]}, {"id": "P2670", "text": ["The Delta connection has no neutral and uses three wires only."], "jumps": ["P2680", "P2660"]}, {"id": "P2680", "text": ["For a Delta connection, one end of two armature coils are connected together and the output is taken across any one phase."], "jumps": ["P2700", "P2660"]}, {"id": "P2700", "text": ["In a Delta connection the line and phase voltage are equal. The difference is in the line phase and current phase. To find the line current use the conversion factor 1.73 x Phase Current..", "Delta Connection Line Voltage = phase voltage Line Current = 1.73 x phase current"], "jumps": ["P2710", "P2680"]}, {"id": "P2710", "text": ["In most cases, the Wye connected transformers are used. So this is where the majority of our discussion will be focused."], "jumps": ["P2720", "P2700"]}, {"id": "P2720", "text": ["Formulas Line Voltage = Phase Voltage x 1.73 Phase Voltage = Line Voltage 1.73", "For a Wye connected system, the line voltage is found to be 208"], "jumps": ["P2710"]}, {"id": "P2721", "text": [], "jumps": []}, {"id": "P2722", "text": ["For a Wye connected power system, line voltage and phase voltage share the formula: Line Voltage = Phase Voltage x 1.73"], "jumps": []}, {"id": "P2728", "text": ["Let's discuss the loads on a Wye connected generator......."], "jumps": ["P2730", "P2720"]}, {"id": "P2730", "text": ["Most Wye connected systems utilize balanced Wye connected loads."], "jumps": ["P2740", "P2728"]}, {"id": "P2740", "text": ["Balanced means the resistor values are the same. This implies the voltage across each phase resistor is equal.", "R = Ra = Rb = Rc V Phase = Va = Vb = Vcccccccccccccc"], "jumps": ["P2750", "P2728"]}, {"id": "P2750", "text": ["Since current is determined by phase voltage and resistance, line current will equal phase current. Any difference results in neutral current.", "Phase V = Ia = Ib =Ic Phase RR", "R = Ra = Rb = Rc V Phase = Va = Vb = Vcccccccccccccc"], "jumps": ["P2760", "P2728"]}, {"id": "P2760", "text": ["A balanced load represents a safe circuit."], "jumps": ["P2910", "P2728"]}, {"id": "P2910", "text": ["This completes the information on AC GENERATORS.TLE........"], "jumps": ["P2001", "P2728"]}, {"id": "P2920", "text": ["1. All generators, in fact all rotating machinery, operate on the same principle: Magnetism."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2. There are two fundamental types of AC generators, Revolving- armature and Revolving-field..", "Revolving - armature Revolving - field"], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3. In a Revolving-field generator, DC from a separate source is passed through the field windings on the rotor via the slip rings and brushes. However, slip rings and brushes are not in the output circuitry, this design prevents arc-over."], "jumps": ["P2950", "P2930"]}, {"id": "P2950", "text": ["4. Single-phase, two-phase, and three-phase alternators are available. Three-phase is the most common, due to the low- cost, flexibility, and efficiency compared to DC generators of the same rating."], "jumps": ["P2960", "P2940"]}, {"id": "P2960", "text": ["5. Three-phase alternators may be connected in either a Wye or Delta configuration..'"], "jumps": ["P2970", "P2950"]}, {"id": "P2970", "text": ["6. In the Wye configuration, the line CURRENT is equal to the phase CURRENT, where in a Delta configuration, the line VOLTAGE is equal to the phase VOLTAGE."], "jumps": ["P2980", "P2960"]}, {"id": "P2980", "text": ["7. Balanced Wye systems, where line current equals phase current, will have neutral current if there is any difference in phase current. This makes a balanced load a safe circuit.", "Phase V = Ia = Ib = Ic Phase R", "R = Ra = Rb = Rc V Phase = Va = Vb = Vcccccccccccccc"], "jumps": ["P2999", "P2960"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P2001", "P2980"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your in let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
