ize the relay.", "To de-energize K1, depress S2. This breaks the current path."], "jumps": ["P1580", "P1540", "P1570"]}, {"id": "P1550", "text": ["When K1 is energized, the DC voltage from TP6 is applied to the magnetic core of K1.", "K1 also has a latching voltage.", "When K1 is energized the output voltage is DC and I1 is illuminated.", "When K1 is de-energized the output is an AC voltage and I2 illuminates.", "Remember, I1 and I2 are both light emitting diodes.  When current flows through them, they will light up.", "K1 also has a latching voltage.............................", "When K1 is de-energized the output is an AC voltage and I2 illuminates..", "Remember, I1 and I2 are both light emitting diodes. When current passes through them, they will light up.", "Remember, I1 and I2 are both light emitting diodes. When current flows through them, they will light up.", "When current passes through them, they will"], "jumps": ["P1560", "P1540", "P1550", "P1520", "P1530", "P1440"]}, {"id": "P1480", "text": ["When K1 is de-energized, the DC voltage is applied through the normally closed contacts to I2 and R2."], "jumps": ["P1490", "P1440"]}, {"id": "P1470", "text": ["The DC is applied through the common terminal to the normally open contacts of K1.  (The relay is shown in the energized state for signal tracing.)", "The DC is applied through the common terminal to the normally open contacts of K1. (The relay is shown in the energized state for signal tracing.)"], "jumps": ["P1480", "P1440"]}, {"id": "P1460", "text": ["The second path for the DC voltage is used as a latch voltage for K1 and illuminates one of two lamps."], "jumps": ["P1470", "P1440"]}, {"id": "P1450", "text": ["When S1 is depressed, the DC voltage is applied through K1 to the normally closed switch S2 then to ground.  K1 is energized.", "The energizing circuit for K1 flows thru S1.", "When S1 is depressed, the DC voltage is applied through K1 to the normally closed switch S2 then to ground. K1 is energized.", "The energizing circuit for K1 flows thru S1................"], "jumps": ["P1460", "P1440", "P1450", "P1430"]}, {"id": "P1433", "text": ["The switch is not a toggle switch.", "The switch is not a toggle switch.........................."], "jumps": []}, {"id": "P1432", "text": ["The switch is a push button but it is not open, S1 is normally open."], "jumps": []}, {"id": "P1431", "text": ["What type of switch is S2?", "What type of switch is S2?s typed.........................."], "jumps": ["P1420"]}, {"id": "P1423", "text": ["S1 is not a toggle switch.", "S1 is not a toggle switch.................................."], "jumps": []}, {"id": "P1422", "text": ["The switch is a push button, however the switch is not normally closed."], "jumps": []}, {"id": "P1421", "text": ["What type of switch is S1?", "What type of switch is S1?s typed.........................."], "jumps": ["P1380"]}, {"id": "P1410", "text": ["From TP1 in circuit 2, the DC voltage takes two paths.  Let's follow the voltage to the relay's magnetic core.", "From TP1 in circuit 2, the DC voltage takes two paths. Let's follow the voltage to the relay's magnetic core."], "jumps": ["P1420", "P1380"]}, {"id": "P1400", "text": ["Notice that R4 is variable and is used to adjust the DC level."], "jumps": ["P1410", "P1380"]}, {"id": "P1390", "text": ["The second path of the DC voltage is through the voltage divider of R3 and R4.", "Now, you can say that the output of both circuits is AC when K1 is de-energized and DC when K1 is energized."], "jumps": ["P1400", "P1380", "P1390", "P1370"]}, {"id": "P1373", "text": ["The common terminal is connected to TP10, and it is the output of  this circuit.", "The common terminal is connected to TP10, and it is the output of this circuit."], "jumps": []}, {"id": "P1372", "text": ["The normally closed contact of K1 is connected to the AC signal from TP7."], "jumps": []}, {"id": "P1371", "text": ["The output of the voltage divider is applied to which contacts of  K1?", "The output of the voltage divider is applied to which contacts of K1?"], "jumps": ["P1360"]}, {"id": "P1362", "text": ["Redrawing the circuit illustrates the type of circuit. Recall that the voltage is different at each point."], "jumps": []}, {"id": "P1361", "text": ["The first path is through R1 and R2. What type of circuit is R1 and R2?", "At TP6, the rectified and filtered pure DC is routed to two places."], "jumps": ["P1330", "P1350", "P1360"]}, {"id": "P1340", "text": ["Remember the signals at different points in a power supply. Touch a highlighted test point to observe the signal.", "Signals at test points: TP1 AC input signal, TP2 and TP3 Transformer AC 180", "out of phase, TP4 Pulsating DC, TP6 Pure DC............"], "jumps": ["P1350", "P1330", "P1340", "P1260"]}, {"id": "P1320", "text": ["A pure DC signal is the result at TP6."], "jumps": ["P1330", "P1260"]}, {"id": "P1310", "text": ["C1, C2, and L1 (or R0) eliminate the bumps, called ripple, on the DC voltage.  This is called filtering.", "C1, C2, and L1 (or R0) eliminate the bumps, called ripple, on the DC voltage. This is called filtering."], "jumps": ["P1320", "P1260"]}, {"id": "P1300", "text": ["There is no longer a negative alternation of the sine wave. This type of waveform is called pulsating DC."], "jumps": ["P1310", "P1260"]}, {"id": "P1290", "text": ["The result is that the negative alternations are removed and only the positive alternations remain."], "jumps": ["P1300", "P1260"]}, {"id": "P1280", "text": ["During time 2, CR1 conducts producing a voltage at TP4.  CR2 does not conduct.", "During time 2, CR1 conducts producing a voltage at TP4. CR2 does not conduct."], "jumps": ["P1290", "P1260"]}, {"id": "P1270", "text": ["During time 1, CR2 conducts producing a voltage at TP4.  CR1 does not conduct.", "During time 1, CR2 conducts producing a voltage at TP4. CR1 does not conduct."], "jumps": ["P1280", "P1260"]}, {"id": "P1260", "text": ["Looking at the circuit, when CR2 is forward biased CR1 is revers let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
