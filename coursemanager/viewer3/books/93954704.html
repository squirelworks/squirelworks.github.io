"P410", "text": ["If the adder output is selected, the distributor will furnish data to the adder only............................................................................."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["If the subtractor output is selected, the distributor will furnish data to the subtractor only..........................................."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["If the adder and subtractor circuits both require the same data, the distributor will demultiplex the input and furnish data to both of its outputs."], "jumps": ["P440", "P400"]}, {"id": "P431", "text": ["If both outputs are needed, the data is demultiplexed and applied to both outputs.", "If both outputs are needed, the data is demultiplexed and applied to both outputs.."], "jumps": ["P440", "P400"]}, {"id": "P435", "text": ["DEMULTIPLEX - Demultiplexing is the process of placing information from a single source to several output paths."], "jumps": ["P431"]}, {"id": "P440", "text": ["Let's begin the lesson on DATA DISTRIBUTOR CIRCUITS......................."], "jumps": ["P431"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The data distributor circuit used in this lesson has four inputs and four outputs.", "The data distributor circuit used in this lesson has four inputs and four outputs..."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Data is applied to the distributor circuit on the IN input. dress inputs can also be referred to as Select Lines..."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["A1 and A2 are the address inputs that control distribution of data to the outputs. Address inputs can also be referred to as Select Lines."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["00 connects output A, 01 connects output B, 10 connects output C and 11 connects output D.", "0 0 0 A 0 0 1 B 0 1 0 C 0 1 1 DDDDD"], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["The EN input enables inputs on the IN input. A low signal is required for distribution. If the EN input is high, the outputs will be low, regardless of any other input level."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["Outputs A, B, C and D are the outputs that are controlled by address inputs A1 and A2."], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["What output line is enabled for this data distributor?", "What output line is enabled for this data distributor?....."], "jumps": ["P1020"]}, {"id": "P1081", "text": [], "jumps": []}, {"id": "P1082", "text": ["Look at the address. The address input tells you which output line the input data is connected to."], "jumps": []}, {"id": "P1090", "text": ["What output line is enabled for this data distributor?E", "Which output line will be low, if the enable line is high????e outputs willWith a high on the enable line, the output lines will be ____?"], "jumps": ["P1080"]}, {"id": "P1091", "text": [], "jumps": []}, {"id": "P1092", "text": ["The enable input is high. None of the outputs are connected to the input.", "If the EN input is high, the outputs will be low, regardless of any other input level. is high, the outputs will be high, regardless of any other input level."], "jumps": []}, {"id": "P1100", "text": ["A demultiplexer accepts data, one bit at a time or in groups, on a\nsingle input line and distributes the accepted data to the appropriate output line, one line at a time.  This is accomplished by addressing one output line per time period, until each of the output lines have been addressed.", "A demultiplexer accepts data, one bit at a time or in groups, on a single input line and distributes the accepted data to the appropriate output line, one line at a time. This is accomplished by addressing one output line per time period, until each of the output lines have been addressed.."], "jumps": ["P1120", "P1090"]}, {"id": "P1101", "text": ["An example of a one bit input.ltiplexer accepts data, one bit at a time or in groups, on a single input line and distributes the accepted data to the ne line at a time. This is accomplished by addressing one output line per time period, until each of the output lines have been addressed.."], "jumps": ["P1102", "P1100"]}, {"id": "P1102", "text": ["An example of a four bit group input.. a time or in groups, on a single input line and distributes the accepted data to the appropriate output line, one line at a time. This is accomplished by addressing one output line per time period, until each of the output lines have been addressed.."], "jumps": ["P1103", "P1101"]}, {"id": "P1103", "text": ["An example of an 8 bit group input...... time or in groups, on a single input line and distributes the accepted data to the appropriate output line, one line at a time. This is accomplished by addressing one output line per time period, until each of the output lines have been addressed.."], "jumps": ["P1100", "P1102"]}, {"id": "P1120", "text": ["During T1, the counter is at 00 (A's address) and the input is connected to output A..."], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["During T2, the counter is at 01 (B's address) and the input is connected to output B..."], "jumps": ["P1140", "P1100"]}, {"id": "P1140", "text": ["During T3, the counter is at 10 (C's address) and the input is connected to output C.................................."], "jumps": ["P1150", "P1100"]}, {"id": "P1150", "text": ["During T4, the counter is at 11 (D's address) and the input is connected to output D................................"], "jumps": ["P1170", "P1100"]}, {"id": "P1170", "text": ["This data distributor circuit consists of three inverters and four \n4-input AND gates.", "This data distributor circuit consists of three inverters and four 4-input AND gates...................."], "jumps": ["P1180", "P1100"]}, {"id": "P1180", "text": ["A low ENABLE input places a high on each AND gate."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["An address of 00 places two highs on AND gate 1."], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["When three of the four inputs to gate 1 are high, its output will be equal to the level of its fourth input; in this case whatever data is on the IN input line."], "jumps": ["P1210", "P1170"]}, {"id": "P1210", "text": ["AND gates 2, 3 and 4 all have low inputs from the address.", "AND gates 2, 3 and 4 all have low inputs from the address./"], "jumps": ["P1220", "P1170"]}, {"id": "P1220", "text": ["An address of 01 places two highs on AND gate 2."], "jumps": ["P1230", "P1170"]}, {"id": "P1230", "text": ["When three of the four inputs to gate 2 are high, its output will be equal to the level of its fourth input. ......................................................................"], "jumps": ["P1240", "P1170"]}, {"id": "P1240", "text": ["AND gates 1, 3 and 4 all have low inputs from the address."], "jumps": ["P1250", "P1170"]}, {"id": "P1250", "text": ["Which AND gate is enabled with an address of 11?", "Which AND gate is enabled with an address of 11?..........."], "jumps": ["P1170"]}, {"id": "P1251", "text": [], "jumps": []}, {"id": "P1252", "text": ["An address of 11 places a low from A1 inverter to gates 1 and 3 and a low from A2 inverter to gates 1 and 2."], "jumps": []}, {"id": "P1260", "text": ["Which AND gate is enabled with an address of 10?", "Which AND gate is enabled with an address of 10?..........."], "jumps": ["P1250"]}, {"id": "P1261", "text": [], "jumps": []}, {"id": "P1262", "text": ["An address of 10 places a low from A1 to gates 2 and 4 and from A2 inverter to gates 1 and 2."], "jumps": []}, {"id": "P1270", "text": ["utor ICs normally have two sets of data distributor circuits with a common address input. Connecting both sec", "Data distributor ICs normally have two sets of data distributor circuits with a common address input. Connecting both sections together will allow designers to configure the distributor for different uses. Either a 3-line-to-8-line decoder or 1-line-to-8-line demultiplexer."], "jumps": ["P1910", "P1260"]}, {"id": "P1910", "text": ["This completes the information on DATA DISTRIBUTOR.", "This completes the information on DATA DISTRIBUTOR........."], "jumps": ["P1001", "P1270"]}, {"id": "P1920", "text": ["1. The data distributor circuit used in this lesson has four inputs        and four outputs.", "1. The data distributor circuit used in this lesson has four inputs and four outputs."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  IN is the data input. Inputs A1 and A2 are the address inputs          that connect the input to one of the four outputs when the              enable input is low.", "2. IN is the data input. Inputs A1 and A2 are the address inputs that connect the input to one of the four outputs when the enable input is low."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The output A, B, C or D is the data on the input.", "3. The output A, B, C or D is the data on the input."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. This data distributor circuit consists of three inverters and four \n     4-input AND gates.", "4. This data distributor circuit consists of three inverters and four 4-input AND gates............"], "jumps": ["P1999", "P1930"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.nu."], "jumps": ["P1001", "P1950"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["This experiment demonstrates the operation of a data distributor. You will enter data on one input line and measure the four outputs of the distributor to verify correct operation."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["Pick up the PC130-134 card. The purpose of this card is to demonstrate the operation of a data distributor circuit."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["The distributor IC receives one input from the 133 card. The outputs are taken from TPs A, B, C and D."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["The address input is either from the 133 card - when S3 is in AUTO..."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["Or from switches S1 and S2 - when S3 is in MAN. Let's start the experiment."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2040"]}, {"id": "P2090", "text": ["2.  Set the Voltmeter Switch to Positive. \n3.  Set the Positive Supply Voltage to 5. The Test Console's                  Voltage Meter should indicate 5 volts.", "2. Set the Voltmeter Switch to Positive. 3. Set the Positive Supply Voltage to 5. The Test Console's Voltage Meter should indicate 5 volts."], "jumps": ["P2080"]}, {"id": "P2100", "text": ["4. Carefully plug PC130-112 into the Test Console PC1 position. 5. Carefully plug PC130-133 into the Test Console PC2 position. 6. Carefully plug PC130-134 into the Test Console PC3 position."], "jumps": ["P2090"]}, {"id": "P2110", "text": ["7.  Set S1 and S2 to LO and S3 to PULSED on PC130-112.\n8.  Set S1 and S2 to 0 and S3 to MAN on PC130-133.\n9.  Set S1 and S2 to 0 and S3 to MAN on PC130-134.", "7. Set S1 and S2 to LO and S3 to PULSED on PC130-112. 8. Set S1 and S2 to 0 and S3 to MAN on PC130-133. 9. Set S1 and S2 to 0 and S3 to MAN on PC130-134. External program = SCAN FTR 0 F2 14"], "jumps": ["P2100", "P2115"]}, {"id": "P2115", "text": ["MEASUREMENT SETUP - PC130-133 - S1 and S2 set to 0 \n                                                                          S3 set to MAN \n                                                  PC130-134 - S1 and S2 set to 0\n  input to the DATA IN TP on PC130-134. The probe will remain on the DATA IN TP throughout this experiment. 13. Place a 1 to 1 probe from CH1 input to TP A on PC130-133. Look at CH1 and CH2 signals."], "jumps": ["P2150", "P2130", "P2145"]}, {"id": "P2145", "text": ["MEASUREMENT SETUP - PC130-133 - CH1 oscilloscope probe on TP A. PC130-134 - CH2 oscilloscope probe on the DATA IN TP."], "jumps": []}, {"id": "P2150", "text": ["14.  Set S1 to 1 on PC130-133.  \n15.  Place CH1 probe to TP B on PC130-133. The signals on CH1          and CH2  should be the same for address 00 at TP A and                 address 01 at TP B on PC130-133 when compared to the                 DATA IN TP on PC130-134.", "14. Set S1 to 1 on PC130-133. 15. Place CH1 probe to TP B on PC130-133. The signals on CH1 and CH2 should be the same for address 00 at TP A and address 01 at TP B on PC130-133 when compared to the DATA IN TP on PC130-134."], "jumps": ["P2160", "P2140", "P2155"]}, {"id": "P2155", "text": ["SETUP - If the indications in step 13 can not be obtained, check:-", "- PC130-112 in PC1, PC130-33 in PC2, PC130-134 in PC3. - S1 set to 1, S2 set to 0 and S3 set to MAN on PC130-133. - S1 ad S2 set to 0 ad S3 set t o MAN on PC130-134. - S3 set to pulsed on PC130-112.."], "jumps": []}, {"id": "P2160", "text": ["The experiment is now set up. Let's verify the operation of the data distributor circuit."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["With the manual address switches set to 00 on PC130-134, which output line will be enabled?"], "jumps": ["P2160"]}, {"id": "P2171", "text": [], "jumps": []}, {"id": "P2172", "text": ["With an address of 00 on PC130-134, the data distributor connects the input to output A."], "jumps": []}, {"id": "P2173", "text": ["For the data distributor circuit to select input C, an address of 10 is required."], "jumps": []}, {"id": "P2174", "text": ["For the data distributor circuit to select input D, an address of 11 is required."], "jumps": []}, {"id": "P2180", "text": ["1.  Place CH1 probe on TP A on PC130-134. \n     Do the signals on CH1 and  CH2 match?", "1. Place CH1 probe on TP A on PC130-134. Do the signals on CH1 and CH2 match?????????????"], "jumps": ["P2170", "P2185"]}, {"id": "P2181", "text": [], "jumps": []}, {"id": "P2182", "text": ["The signals should match. Ensure that you are measuring TP A with the CH1 probe and that CH2 probe is connected to the DATA IN TP on PC130-134. Use the vertical position control to overlay CH1 and CH2."], "jumps": []}, {"id": "P2185", "text": ["MATCHING OSCILLOSCOPE TRACES - Use the vertical position control on the oscilloscope to overlay CH1 and CH2 signals. If they match, the two signals will appear as one."], "jumps": []}, {"id": "P2190", "text": ["2.  Using CH1 probe, measure TPs B, C and D on PC130-134.              Notice that the signals do not match.", "2. Using CH1 probe, measure TPs B, C and D on PC130-134. Notice that the signals do not match."], "jumps": ["P2200", "P2180", "P2195"]}, {"id": "P2195", "text": ["The signals on TP B, C and D are high. The SN74155N Data Distributor chip uses NAND gates instead of AND gates."], "jumps": ["P2196", "P2190"]}, {"id": "P2196", "text": ["The input is inverted then inverted again at the output. With no input, the output is inverted to a high.", "The input is inverted then inverted again at the output. With no input, the output is inverted to a high......................."], "jumps": ["P2190", "P2195"]}, {"id": "P2200", "text": ["3.  Set switches S1 to 1 and S2 to 0 on PC130-134. With the                  manual address switches set to 01, which output line is                   enabled by the data distributor?", "3. Set switches S1 to 1 and S2 to 0 on PC130-134. With the manual address switches set to 01, which output line is enabled by the data distributor?"], "jumps": ["P2190", "P2205"]}, {"id": "P2201", "text": [], "jumps": []}, {"id": "P2202", "text": ["With an address of 01, the data distributor connects the input to ce that the signals do not match.", "2. Using CH1 probe, measure TPs B, C and D on PC130-134. Notice that the signals do not match."], "jumps": ["P13200", "P13180", "P13195"]}, {"id": "P13195", "text": ["The signals on TP B, C and D are high. The SN74155N Data Distributor chip uses NAND gates instead of AND gates."], "jumps": ["P13196", "P13190"]}, {"id": "P13196", "text": ["The input is inverted then inverted again at the output. With no input, the output is inverted to a high.", "The input is inverted then inverted again at the output. With no input, the output is inverted to a high. ....................."], "jumps": ["P13190", "P13195"]}, {"id": "P13200", "text": ["3.  Set switches S1 to 1 and S2 to 0 on PC130-134. With the                  manual address switches set to 01, which output line is                   enabled by the data distributor?", "3. Set switches S1 to 1 and S2 to 0 on PC130-134. With the manual address switches set to 01, which output line is enabled by the data distributor?"], "jumps": ["P13190", "P13205"]}, {"id": "P13201", "text": [], "jumps": []}, {"id": "P13202", "text": ["With an address of 01, the data distributor connects the input to output B."], "jumps": []}, {"id": "P13205", "text": ["SWITCH POSITIONS AND OSCILLOSCOPE CONNECTION"], "jumps": []}, {"id": "P13210", "text": ["4.  Place CH1 probe to TP B on PC130-134. \n     Do the signals on CH1 and CH2 match?", "4. Place CH1 probe to TP B on PC130-134. Do the signals on CH1 and CH2 match??????????????"], "jumps": ["P13200"]}, {"id": "P13211", "text": [], "jumps": []}, {"id": "P13212", "text": ["The signals should match. Ensure that you are measuring TP B with the CH1 probe and that CH2 probe is connected to the DATA IN TP on PC130-134. Use the vertical position control to overlay CH1 and CH2 signals."], "jumps": []}, {"id": "P13220", "text": ["5.  Using CH1 probe, measure TPs A, C and D on PC130-134.              Notice that the signals do not match.", "5. Using CH1 probe, measure TPs A, C and D on PC130-134. Notice that the signals do not match.."], "jumps": ["P13230", "P13210"]}, {"id": "P13230", "text": ["6.  Set switches S1 to 0 and S2 to 1 on PC130-134. With the                  manual address switches set to 10, which output line will be          enabled by the data distributor?", "6. Set switches S1 to 0 and S2 to 1 on PC130-134. With the manual address switches set to 10, which output line will be enabled by the data distributor??"], "jumps": ["P13220", "P13235"]}, {"id": "P13231", "text": [], "jumps": []}, {"id": "P13232", "text": ["With an address of 10, the data distributor connects output C to the input."], "jumps": []}, {"id": "P13235", "text": ["SWITCH POSITIONS AND OSCILLOSCOPE CONNECTION"], "jumps": []}, {"id": "P13240", "text": ["7.  Place CH1 probe to TP C on PC130-134. \n     Do the signals on CH1 and CH2 match?", "7. Place CH1 probe to TP C on PC130-134. Do the signals on CH1 and CH2 match??????????????"], "jumps": ["P13230"]}, {"id": "P13241", "text": [], "jumps": []}, {"id": "P13242", "text": ["The signals should match. Ensure that you are measuring TP C on PC130-134 with the CH1 probe and that CH2 probe is connected to the DATA IN TP on PC130-134. Use the vertical position control to overlay CH1 and CH2 signals."], "jumps": []}, {"id": "P13250", "text": ["8.  Using CH1 probe, measure TPs A, B and D on PC130-134.              Notice that the signals do not match.", "8. Using CH1 probe, measure TPs A, B and D on PC130-134. Notice that the signals do not match.."], "jumps": ["P13260", "P13240"]}, {"id": "P13260", "text": ["9.  Set switches S1 and S2 to 1 on PC130-134. With the manual           address switches set to 11, which output line will be enabled         by the data distributor?", "9. Set switches S1 and S2 to 1 on PC130-134. With the manual address switches set to 11, which output line will be enabled by the data distributor?"], "jumps": ["P13250", "P13265"]}, {"id": "P13261", "text": [], "jumps": []}, {"id": "P13262", "text": ["With an address of 11, the data distributor connects output D to the input."], "jumps": []}, {"id": "P13265", "text": ["SWITCH POSITIONS AND OSCILLOSCOPE CONNECTION"], "jumps": []}, {"id": "P13270", "text": ["10.  Place CH1 probe to TP D on PC130-134.\n       Do the signals on CH1 and CH2 match?", "10. Place CH1 probe to TP D on PC130-134. Do the signals on CH1 and CH2 match????????????"], "jumps": ["P13260"]}, {"id": "P13271", "text": [], "jumps": []}, {"id": "P13272", "text": ["The signals should match. Ensure that you are measuring TP D on PC130-134 with the CH1 probe and that CH2 probe is connected to the DATA IN TP on PC130-134. Use the vertical position control to overlay CH1 and CH2 signals."], "jumps": []}, {"id": "P13280", "text": ["11.  Using CH1 probe, measure TPs A, B and C on PC130-134.              Notice that the signals do not match.", "11. Using CH1 probe, measure TPs A, B and C on PC130-134. Notice that the signals do not match."], "jumps": ["P13290", "P13270"]}, {"id": "P13290", "text": ["12.  Set S3 to AUTO on PC130-133 and PC130-134. PC130-133              multiplexes the data and PC130-134 demultiplexes the data.", "12. Set S3 to AUTO on PC130-133 and PC130-134. PC130-133 multiplexes the data and PC130-134 demultiplexes the data."], "jumps": ["P13300", "P13280", "P13295"]}, {"id": "P13295", "text": ["MEASUREMENT SETUP - PC130-133 - Set S3 to AUTO. PC130-134 - Set S3 to AUTO."], "jumps": []}, {"id": "P13300", "text": ["13.  Place CH2 probe to TP A on PC130-134. \n14.  Place CH1 probe to TP A on PC130-133. Notice that CH1 and         CH2 signals match.", "13. Place CH2 probe to TP A on PC130-134. 14. Place CH1 probe to TP A on PC130-133. Notice that CH1 and CH2 signals match."], "jumps": ["P13310", "P13290", "P13305"]}, {"id": "P13305", "text": ["MEASUREMENT SETUP - PC130-133 - CH1 oscilloscope probe on TP A. PC130-134 - CH2 oscilloscope probe on TP A."], "jumps": []}, {"id": "P13310", "text": ["15.  Using CH1 probe, measure TPs B, C and D on PC130-133.              Notice that the signals do not match.", "15. Using CH1 probe, measure TPs B, C and D on PC130-133. Notice that the signals do not match."], "jumps": ["P13320", "P13300"]}, {"id": "P13320", "text": ["16.  Place CH1 probe to TP A on PC130-133.\n17.  Using CH2 probe, measure TPs A, B, C and D. Notice that the        only signal that matches is at TP A.", "16. Place CH1 probe to TP A on PC130-133. 17. Using CH2 probe, measure TPs A, B, C and D. Notice that the only signal that matches is at TP A...................."], "jumps": ["P13330", "P13310", "P13325"]}, {"id": "P13325", "text": ["MEASUREMENT SETUP - PC130-133 - CH1 oscilloscope probe on TPA. PC130-134 - CH2 oscilloscope probe on TPs, A, B, C, D."], "jumps": []}, {"id": "P13330", "text": ["18.  Verify that:", "18. Verify that:n text here...............................", "Input (133) B C D", "Output (133) B C D"], "jumps": ["P13340", "P13320"]}, {"id": "P13340", "text": ["Notice that the same counter is used for the data selector and data distributor address."], "jumps": []}, {"id": "P13350", "text": ["If the two circuits were not addressed the same, the data inputs to PC130-133 would not match the data output of PC130-134."], "jumps": ["P13340"]}, {"id": "P13370", "text": ["1.  Turn the Test Console Power OFF.", "1. Turn the Test Console Power OFF.OFF.FF................................."], "jumps": []}, {"id": "P13380", "text": ["2.  Disconnect the oscilloscope. \n3.  Carefully remove PC130-112, PC130-133 and PC130-134. \n4.  Return all equipment to its proper storage area.", "2. Disconnect the oscilloscope. 3. Carefully remove PC130-112, PC130-133 and PC130-134. 4. Return all equipment to its proper storage area."], "jumps": ["P13910", "P13370"]}, {"id": "P13910", "text": ["This completes the experiment on DATA DISTRIBUTOR.", "This completes the experiment on DATA DISTRIBUTOR.E........"], "jumps": ["P2001", "P13380"]}, {"id": "PINFO", "text": ["07-29-99 Converted to new question for let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
