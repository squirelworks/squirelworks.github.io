const book = {"title": "93953202", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: TRANSISTOR OPERATIONsdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe transistor cutoff and saturation. w Describe transistor alpha and beta. w Identify fixed, self and combinational biasing.", "w Measure alpha and beta. w Observe cutoff and saturation. w Measure collector current with varying load resistors................"], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "5. Nida Model 480, 488 Multimeter or Equivalent"], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P335", "text": [], "jumps": []}, {"id": "P400", "text": ["The level and type of biasing used affects transistor operation."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Too much positive bias on the base of an NPN transistor causes the transistor to lose its amplifying ability."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Too little positive bias on the base of an NPN transistor causes the transistor to stop conducting current."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["The actual bias voltage depends on the transistor and how the transistor is used in the circuit.", "Use NPN Bias PNP Bias Switch +3.0 V - 2.0 V Amplifier +6.0 V - 5.0 V Oscillator +1.0 V - 0.5 VVVVVVVVVVV0.5 VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV"], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Understanding the effects of different bias voltages on transistor operation is important.  Then various transistor circuits are learned.", "Understanding the effects of different bias voltages on transistor operation is important. Then various transistor circuits are learned."], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["Let's begin the lesson on TRANSISTOR OPERATION............................"], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": ["P450"]}, {"id": "P1001", "text": [], "jumps": ["P1920"]}, {"id": "P1020", "text": ["Transistors are unique in that collector current flows across the reverse biased collector base PN junction.", "Transistors are unique in that collector current flows across the reverse biased collector base PN junction.OTE: A NPN transistor is used for this discussion. Remember, NPN and PNP transistors operate the same, only the polarity of the bias voltages and the direction of current flow are opposite.........", "A NPN transistor is used for this discussion. Remember, NPN and PNP transistors operate the same,only the polarity of the bias voltages and the direction of current flow are opposite.", "A NPN transistor is used for this discussion. Remember, NPN and PNP transistors operate the same, only the polarity of the bias voltages and the direction of current flow are opposite."], "jumps": ["P1030", "P1001"]}, {"id": "P1021", "text": ["Transistors are unique in that collector current flows across the reverse biased collector base PN junction.", "Transistors are unique in that collector current flows across the reverse biased collector base PN junction.OTE: A NPN transistor is used for this discussion. Remember, NPN and PNP transistors operate the same, only the polarity of the bias voltages and the direction of current flow are opposite.........", "A NPN transistor is used for this discussion. Remember, NPN and PNP transistors operate the same,only the polarity of the bias voltages and the direction of current flow are opposite.", "A NPN transistor is used for this discussion. Remember, NPN and PNP transistors operate the same, only the polarity of the bias voltages and the direction of current flow are opposite."], "jumps": ["P1031", "P1001"]}, {"id": "P1030", "text": ["The amount of collector current is dependent on the base bias voltage or base current within certain limits.  Let's see why.", "The amount of collector current is dependent on the base bias voltage or base current within certain limits. Let's see why._"], "jumps": ["P1040", "P1020"]}, {"id": "P1031", "text": ["The amount of collector current is dependent on the base bias voltage or base current within certain limits.  Let's see why.", "The amount of collector current is dependent on the base bias voltage or base current within certain limits. Let's see why.C"], "jumps": ["P1040", "P1021"]}, {"id": "P1040", "text": ["The emitter to base PN junction is similar to a diode. Approximately 0.7 volts is needed to forward bias the junction (0.3 volts for a germanium transistor)."], "jumps": ["P1051", "P1050", "P1020"]}, {"id": "P1050", "text": ["Once the EB junction is forward biased and the CB junction is reverse biased, current flows.", "Once the EB junction is forward biased and the CB junction is reverse biased, current flows.O"], "jumps": ["P1060", "P1040"]}, {"id": "P1051", "text": ["Once the EB junction is forward biased and the CB junction is reverse biased, current flows."], "jumps": ["P1061", "P1040"]}, {"id": "P1060", "text": ["Remember, the base is thin and lightly doped. Most of the current carriers pass on to the collector. Base current is small."], "jumps": ["P1070", "P1040"]}, {"id": "P1061", "text": ["Remember, the base is thin and lightly doped.  Most of the current carriers to the emitter are supplied by the collector.  Base current is small.", "Remember, the base is thin and lightly doped. Most of the current carriers to the emitter are supplied by the collector. Base current is small."], "jumps": ["P1071", "P1040"]}, {"id": "P1070", "text": ["However, the collector current is large."], "jumps": ["P1080", "P1040"]}, {"id": "P1071", "text": ["However, the collector current is large."], "jumps": ["P1081", "P1040"]}, {"id": "P1080", "text": ["Remember, the collector is large and moderately doped and most of  the current carriers from the emitter are attracted to the collector.", "Remember, the collector is large and moderately doped and most of the current carriers from the emitter are attracted to the collector."], "jumps": ["P1090", "P1040"]}, {"id": "P1081", "text": ["Remember, the collector is large and moderately doped and most of  the positive charges in the emitter are from the collector. Remember also that negative charge (electron) flow is large through the collector.", "Remember, the collector is large and moderately doped and most of the positive charges in the emitter are from the collector. Remember also that negative charge (electron) flow is large through the collector...."], "jumps": ["P1091", "P1040"]}, {"id": "P1090", "text": ["Because there are a limited number of current carriers in the base, increasing base bias only slightly increases base current.", "Because there are a limited number of current carriers in the base, increasing base bias only slightly increases base current.."], "jumps": ["P1100", "P1040"]}, {"id": "P1091", "text": ["Because there are a limited number of current carriers in the base, increasing base bias only slightly increases base current.", "Because there are a limited number of current carriers in the base, increasing base bias only slightly increases base current.."], "jumps": ["P1101", "P1040"]}, {"id": "P1100", "text": ["The emitter is heavily doped and an increase in base voltage causes more current carriers to enter the base.  This causes collector current to increase significantly.", "The emitter is heavily doped and an increase in base voltage causes more current carriers to enter the base. This causes collector current to increase significantly."], "jumps": ["P1110", "P1090"]}, {"id": "P1101", "text": ["The emitter is heavily doped and an increase in base voltage causes more current carriers to flow from the base.  This causes collector current to increase significantly.", "The emitter is heavily doped and an increase in base voltage causes more current carriers to flow from the base. This causes collector current to increase significantly."], "jumps": ["P1111", "P1091"]}, {"id": "P1110", "text": ["Increasing the base bias too much causes the collector current to remain constant.  All the available current carriers in the emitter are used up.", "Increasing the base bias too much causes the collector current to remain constant. All the available current carriers in the emitter are used up."], "jumps": ["P1120", "P1090"]}, {"id": "P1111", "text": ["Increasing the base bias too much causes the collector current to remain constant.  All the available current carriers in the emitter are used up.", "Increasing the base bias too much causes the collector current to remain constant. All the available current carriers in the emitter are used up."], "jumps": ["P1120", "P1091"]}, {"id": "P1120", "text": ["The point when Ic no longer increases although base bias voltage increases is called saturation.  The transistor acts as a short between the collector and emitter.", "The point when Ic no longer increases although base bias voltage increases is called saturation. The transistor acts as a short between the collector and emitter."], "jumps": ["P1131", "P1130", "P1091", "P1090"]}, {"id": "P1130", "text": ["Decreasing the base bias has the opposite effect.", "Decreasing the base bias has the opposite effect..........."], "jumps": ["P1140", "P1090"]}, {"id": "P1131", "text": ["Decreasing the base bias has the opposite effect.", "Decreasing the base bias has the opposite effect..........."], "jumps": ["P1140", "P1091"]}, {"id": "P1140", "text": ["Decreasing the base bias below the forward bias level of the emitter base junction stops current flow altogether."], "jumps": ["P1150", "P1131", "P1130"]}, {"id": "P1150", "text": ["Since the base is more negative than the emitter, I   stops.   I stops because the current carriers can not enter the base.", "Since the base is more negative than the emitter, I stops. I stops because the current carriers can not enter the base..he base."], "jumps": ["P1160", "P1131", "P1130"]}, {"id": "P1160", "text": ["The point where I and I stop is called cutoff. The transistor acts as an open between the collector and emitter."], "jumps": ["P1170", "P1131", "P1130"]}, {"id": "P1170", "text": ["Graphing the base bias voltage and the collector current shows the cutoff and saturation points."], "jumps": ["P1180", "P1131", "P1130"]}, {"id": "P1180", "text": ["Notice that the collector bias voltage was not discussed.  This is because increasing VC has very little effect on Ic.", "Notice that the collector bias voltage was not discussed. This is because increasing VC has very little effect on Ic."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["As long as the collector to base PN junction is reverse biased, all the available current carriers in the base are attracted to the collector.", "As long as the collector to base PN junction is reverse biased, all the available negative charges in the base are attracted to the collector."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["What happens in a transistor when the saturation point is reached?"], "jumps": ["P1180"]}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1202", "text": ["The point where base current and collector current stop flowing is cutoff.  The emitter to base PN junction is reverse biased.", "The point where base current and collector current stop flowing is cutoff. The emitter to base PN junction is reverse biased."], "jumps": []}, {"id": "P1203", "text": ["Remember, the collector bias (VC) has very little effect on the collector current.  Only the base voltage increases or decreases Ic.", "Remember, the collector bias (VC) has very little effect on the collector current. Only the base voltage increases or decreases Ic."], "jumps": []}, {"id": "P1210", "text": ["What happens in a transistor when the base voltage reverse biases the emitter to base PN junction?"], "jumps": ["P1200"]}, {"id": "P1211", "text": [], "jumps": ["P1221", "P1220"]}, {"id": "P1212", "text": ["Saturation is the point when Ic does not increase even though base bias voltage increases.  Increasing the base voltage increases forward bias.", "Saturation is the point when Ic does not increase even though base bias voltage increases. Increasing the base voltage increases forward bias."], "jumps": []}, {"id": "P1213", "text": ["Remember, Vc has no effect on Ic or the base voltage.", "Remember, Vc has no effect on Ic or the base voltage......."], "jumps": []}, {"id": "P1220", "text": ["The three currents in a transistor are related, Kirchhoff's current law shows this relationship.  Remember, the small base current controls the larger collector current.", "The three currents in a transistor are related, Kirchhoff's current law shows this relationship. Remember, the small base current controls the larger collector current."], "jumps": ["P1230", "P1210"]}, {"id": "P1221", "text": ["The three currents in a transistor are related, Kirchhoff's current law shows this relationship.  Remember, the small base current controls the larger collector current.", "The three currents in a transistor are related, Kirchhoff's current law shows this relationship. Remember, the small base current controls the larger collector current."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["Although the actual values of the three currents are variable,  values depend on bias voltage levels and circuit operation.  The ratios of the currents are constant for each type of transistor.", "Although the actual values of the three currents are variable, values depend on bias voltage levels and circuit operation. The ratios of the currents are constant for each type of transistor."], "jumps": ["P1241", "P1240", "P1221", "P1220"]}, {"id": "P1240", "text": ["These ratios, called a (Alpha) and b (Beta), describe transistor operation under any condition and bias level."], "jumps": ["P1250", "P1221", "P1220"]}, {"id": "P1241", "text": ["These ratios, called a (Alpha) and b (Beta), describe transistor operation under any condition and bias level."], "jumps": ["P1250", "P1221", "P1220"]}, {"id": "P1250", "text": ["a (alpha) and b (beta) values for each transistor manufactured are given in transistor reference books.", "a (alpha) and b (beta) values for each transistor manufactured are given in transistor reference books..", "Some books list a as h FB and b as h FE FB and b as h FE"], "jumps": ["P1260", "P1241", "P1240"]}, {"id": "P1260", "text": ["a (alpha) is the ratio of collector current (Ic) to emitter current (Ie).", "a (alpha) is the ratio of collector current (Ic) to emitter current (Ie). Ic a = Ieeeeeeeeeeeeeeeeeeeeeeeeee", "a = eeeeeeeeeeeeeeeeeeeeeeeeee Iee Ieeeeeeeeeeeee Ieeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee", "Ic c a = Iee Ieeeeeeeeeeeee Ieeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee", "Ie c a = Iee Ieeeeeeeeeeeee Ieeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"], "jumps": ["P1270", "P1241", "P1240"]}, {"id": "P1270", "text": ["a (alpha) never exceeds 1, normal values range between 0.97 and 0.99.", "a (alpha) never exceeds 1, normal values range between 0.97 and 0.99. Ic a = Iee", "a = eeeeeeeeeeeeeeeeeeeeeeeeee Iee Ieeeeeeeeeeeee Ieeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee", "Ic c a = Iee Ieeeeeeeeeeeee Ieeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee", "Ie c a = Iee Ieeeeeeeeeeeee Ieeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"], "jumps": ["P1280", "P1241", "P1240"]}, {"id": "P1280", "text": ["b (beta) is the ratio of collector current (Ic) to base current (Ib).", "b (beta) is the ratio of collector current (Ic) to base current (Ib). bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb Ib Ib Ib Ibbb", "a = eeeeeeeeeeeeeeeeeeeeeeeeee Iee Ieeeeeeeeeeeee Ieeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee", "Ic c a = Iee Ieeeeeeeeeeeee Ieeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee", "Ie c a = Iee Ieeeeeeeeeeeee Ieeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee", "b = eeeeeeeeeeeeeeeeeeeeeeeeee Iee Ieeeeeeeeeeeee Ieeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee", "Ib c a = Iee Ieeeeeeeeeeeee Ieeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"], "jumps": ["P1290", "P1241", "P1240"]}, {"id": "P1290", "text": ["Beta values are larger than 1, Ib is always smaller than Ic.  Normal values range between 20 and 400.", "Beta values are larger than 1, Ib is always smaller than Ic. Normal values range between 20 and 400.."], "jumps": ["P1300", "P1241", "P1240"]}, {"id": "P1300", "text": ["Alpha is the ratio of _______.", "Alpha is the ratio of _______.ped.........................."], "jumps": ["P1241", "P1240"]}, {"id": "P1301", "text": [], "jumps": []}, {"id": "P1302", "text": ["The ratio is for b (beta).  b is the amount of control that the base current (Ib) has over the collector current (Ic).", "The ratio is for b (beta). b is the amount of control that the base current (Ib) has over the collector current (Ic)."], "jumps": []}, {"id": "P1303", "text": ["This is not a ratio dealing with collector current.  This ratio is called h (Gamma) and is not usually given.", "This is not a ratio dealing with collector current. This ratio is called h (Gamma) and is not usually given......"], "jumps": []}, {"id": "P1310", "text": ["The biasing of a transistor is shown using batteries.", "The biasing of a transistor is shown using batteries......."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["This is not very practical due to the different values of bias required for transistor operation.", "NPN PNP Use Bias Bias Switch +3V -2V Amplifier +6V -5V Oscillator +1V -.5VVVV"], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["To solve this problem, one power supply is used to generate Vcc.  Resistors are used to reduce Vcc to the correct bias levels.", "To solve this problem, one power supply is used to generate Vcc. Resistors are used to reduce Vcc to the correct bias levels."], "jumps": ["P1340", "P1310"]}, {"id": "P1340", "text": ["There are three types of basic bias circuits.  Let's start with fixed.", "There are three types of basic bias circuits. Let's start with fixed."], "jumps": ["P1350", "P1310"]}, {"id": "P1350", "text": ["In this fixed biased transistor, RL is a load resistor and Rb is the base bias resistor.  Note that Rb connects directly to Vcc.", "In this fixed biased transistor, RL is a load resistor and Rb is the base bias resistor. Note that Rb connects directly to Vcc."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["The value of the resistors drop +Vcc so that EB is forward biased and CB is reverse biased (a higher positive voltage on the collector than the base).", "The value of the resistors drop +Vcc so that EB is forward biased and CB is reverse biased (a higher positive voltage on the collector than the base).."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["The disadvantage of fixed biasing is that small changes in base  current, due to temperature changes, effect the voltage on the collector.", "The disadvantage of fixed biasing is that small changes in base current, due to temperature changes, effect the voltage on the collector.or.as."], "jumps": ["P1380", "P1350", "P1375"]}, {"id": "P1372", "text": ["The disadvantage of fixed biasing is that small changes in base  current, due to temperature changes, affect the voltage on the collector.", "The disadvantage of fixed biasing is that small changes in base current, due to temperature changes, affect the voltage on the collector.............."], "jumps": ["P1375", "P1380", "P1350"]}, {"id": "P1375", "text": ["TEMPERATURE CHANGES AND TRANSISTORS - Temperature is a form of energy. The amount of current carriers leaving the emitter of a transistor depends on the energy applied. If the transistor heated up, the number of current carriers increases due to the energy of the heat. Ic then increases.", "TEMPERATURE CHANGES AND TRANSISTORS - Temperature is a form of energy. The amount of current carriers entering the emitter of a transistor depends on the energy applied. If the transistor heated up, the number of current carriers increases due to the energy of the heat. Ic then increases."], "jumps": ["P1372"]}, {"id": "P1380", "text": ["The changes are small, but small voltage changes on the base cause large changes in collector current."], "jumps": ["P1390", "P1372"]}, {"id": "P1390", "text": ["If using a PNP transistor, change +Vcc to -Vcc.", "If using a PNP transistor, change +Vcc to -Vcc............."], "jumps": ["P1400", "P1372"]}, {"id": "P1400", "text": ["The temperature disadvantage is overcome by using self bias."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["In this self biased transistor, RL is a load resistor and Rb is the base bias resistor. Note that Rb is connected DIRECTLY to the collector."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["If collector current increases due to temperature, the voltage drop across RL increases, decreasing the voltage across Rb. This reduces base bias which reduces Ic back to normal."], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["The disadvantage of self bias is it reduces the control of the base bias over the collector current, b (beta)."], "jumps": ["P1440", "P1410"]}, {"id": "P1440", "text": ["If using a PNP transistor, change +Vcc to -Vcc.", "If using a PNP transistor, change +Vcc to -Vcc............."], "jumps": ["P1450", "P1410"]}, {"id": "P1450", "text": ["The disadvantage of fixed and self bias is overcome by using a  combination of fixed and self bias.", "The disadvantage of fixed and self bias is overcome by using a combination of fixed and self bias."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["There are many types of combination bias.  The voltage divider is the most widely used.", "There are many types of combination bias. The voltage divider is the most widely used."], "jumps": ["P1470", "P1450"]}, {"id": "P1470", "text": ["R1 and R2 form a voltage divider that fixed biases the base.  Note the base resistor connects directly to +Vcc.", "R1 and R2 form a voltage divider that fixed biases the base. Note the base resistor connects directly to +Vcc."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["R3 self biases the emitter.  The emitter voltage is determined by how much current is flowing through R3, which is controlled by the base voltage.", "R3 self biases the emitter. The emitter voltage is determined by how much current is flowing through R3, which is controlled by the base voltage.ses Ic. current which also decreases Ic."], "jumps": ["P1490", "P1460"]}, {"id": "P1490", "text": ["C1 is used to keep any AC input signal off the emitter.  This stabilizes the DC bias voltages.", "C1 is used to keep any AC input signal off the emitter. This stabilizes the DC bias voltages."], "jumps": ["P1500", "P1460"]}, {"id": "P1500", "text": ["If using a PNP transistor, change +Vcc to -Vcc.", "If using a PNP transistor, change +Vcc to -Vcc............."], "jumps": ["P1510", "P1460"]}, {"id": "P1510", "text": ["What type of DC biasing is used with this transistor circuit?"], "jumps": ["P1500"]}, {"id": "P1511", "text": [], "jumps": []}, {"id": "P1512", "text": ["In self biasing, the base resistor connects to Vcc after the load resistor."], "jumps": []}, {"id": "P1513", "text": ["Combination bias uses fixed and self bias.", "Combination bias uses fixed and self bias.................."], "jumps": []}, {"id": "P1520", "text": ["What type of DC biasing is used with this transistor circuit?"], "jumps": ["P1510"]}, {"id": "P1521", "text": [], "jumps": []}, {"id": "P1522", "text": ["In fixed biasing the base resistor connects directly to Vcc through the load resistor."], "jumps": []}, {"id": "P1523", "text": ["Combination bias uses fixed and self bias.", "Combination bias uses fixed and self bias.................."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on TRANSISTOR BIAS OPERATION."], "jumps": ["P1001", "P1520"]}, {"id": "P1920", "text": ["1.  In a transistor, the amount of collector current is dependent on\n     the base bias voltage (base current).", "1. In a transistor, the amount of collector current is dependent on the base bias voltage (base current)."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Increasing the base bias increases collector current.\n3.  Decreasing the base bias decreases collector current.", "2. Increasing the base bias increases collector current. 3. Decreasing the base bias decreases collector current."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["4.  Saturation - the point where an increase in base voltage does         not increase collector current.  \n5.  Cutoff - the point where the base bias reverse biases the EB           junction, Ib and Ic current flow stops.", "4. Saturation - the point where an increase in base voltage does not increase collector current. 5. Cutoff - the point where the base bias reverse biases the EB junction, Ib and Ic current flow stops........."], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["6.  Alpha and beta describe a transistor's operation using ratios\n     instead of real current values.", "6. Alpha and beta describe a transistor's operation using ratios instead of real current values.", "Alpha is the ratio of collector current to emitter current. Ie). ent to base current. current. bIbIb Ib Ib Ib", "Beta is the ratio of collector current to base current. t. Ie). ent to base current. current. bIbIb Ib Ib Ib"], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["7.  Fixed biasing drops Vcc to a level that forward biases the EB\n     junction and reverse biases the CB junction.  Fixed biasing is\n     temperature sensitive.", "7. Fixed biasing drops Vcc to a level that forward biases the EB junction and reverse biases the CB junction. Fixed biasing is temperature sensitive."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["8.  Self biasing uses the voltage across RL to supply base bias.\n     Self biasing is not temperature sensitive, but lowers the\n     transistor b.", "8. Self biasing uses the voltage across RL to supply base bias. Self biasing is not temperature sensitive, but lowers the transistor b.ta b."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["9.  Combination biasing uses both fixed and self biasing.  Voltage\n     divider is the most widely used.", "9. Combination biasing uses both fixed and self biasing. Voltage divider is the most widely used."], "jumps": ["P1999", "P1970"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["This experiment demonstrates the basic operation of an NPN and PNP transistor using two different experiment cards. You will place a transistor in a circuit and apply DC bias voltages. Voltage and current measurements are made to verify transistor operation.", "This experiment demonstrates the basic operation of an NPN and PNP transistor using two different experiment cards. You will place a transistor in a circuit and apply DC bias voltages. Voltage and current measurements are made to verify transistor operation..."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["Pick up the PC130-28 card.  This card demonstrates transistor operation.", "Pick up the PC130-28 card. This card demonstrates transistor operation."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["S4 selects between fixed resistors (R3, R4 or R5) and a variable resistor (R1 and R2) for base bias."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["S1 through S3 allow a current meter to be inserted into the circuit to measure Ib."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["S5 and S6 are normally closed.  Opening one at a time allows a current meter to be placed in the circuit to measure Ic (S6) or Ie (S5).", "S5 and S6 are normally closed. Opening one at a time allows a current meter to be placed in the circuit to measure Ic (S6) or Ie (S5)."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["S8 selects between +Vcc and -Vcc for NPN or PNP transistor operation."], "jumps": ["P2090", "P2040"]}, {"id": "P2090", "text": ["S7 selects between fixed bias and combination bias.  S7 set to \"R7 OUT\" is shown.", "S7 selects between fixed bias and combination bias. S7 set to \"R7 OUT\" is shown."], "jumps": ["P2100", "P2040"]}, {"id": "P2100", "text": ["Pick up the PC130-29 card.  This card demonstrates transistor bias operation.", "Pick up the PC130-29 card. This card demonstrates transistor bias operation."], "jumps": ["P2110", "P2040"]}, {"id": "P2110", "text": ["Switches S2, S3 and S4 select different load resistance for the collector of Q1."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["S5 selects -Vcc or +Vcc for PNP or NPN transistor operation."], "jumps": ["P2130", "P2100"]}, {"id": "P2130", "text": ["S1 selects between fixed bias or self bias."], "jumps": ["P2140", "P2100"]}, {"id": "P2140", "text": ["C1 and C2 are used for input and output signals.  They block any DC voltages from entering or leaving this circuit.  Let's start the experiment.", "C1 and C2 are used for input and output signals. They block any DC voltages from entering or leaving this circuit. Let's start the experiment."], "jumps": ["P2150", "P2100"]}, {"id": "P2150", "text": ["1.  Set the test console controls to the initial control settings.", "1. Set the test console controls to the initial control settings.........."], "jumps": ["P2100"]}, {"id": "P2160", "text": ["2.  Set the Voltmeter Switch to Positive. \n3.  Set the Positive Supply Voltage to 12.   \n     The test console's Voltage Meter should indicate 12 volts.", "2. Set the Voltmeter Switch to Positive. 3. Set the Positive Supply Voltage to 12. The test console's Voltage Meter should indicate 12 volts.................."], "jumps": ["P2150"]}, {"id": "P2165", "text": ["4.  Set the Voltmeter Switch to Negative. \n5.  Set the Negative Supply Voltage to 12.   \n     The test console's Voltage Meter should indicate 12 volts.", "4. Set the Voltmeter Switch to Negative. 5. Set the Negative Supply Voltage to 12. The test console's Voltage Meter should indicate 12 volts.................."], "jumps": ["P2160"]}, {"id": "P2170", "text": ["6.  Carefully plug PC130-28 into the test console PC1 position. \n7.  Carefully plug PC130-29 into the test console PC2 position.", "6. Carefully plug PC130-28 into the test console PC1 position. 7. Carefully plug PC130-29 into the test console PC2 position. : The two cards are used separately in this experiment. There is no connection between PC130-28 and PC130-29. External program = SCAN FTR 0 C1 0000", "The two cards are used separately in this experiment. There is no connection between PC130-28 and PC130-29...................................."], "jumps": ["P2165"]}, {"id": "P2180", "text": ["8.  Set switches on PC130-28 as follows:", "8. Set switches on PC130-28 as follows:...................", "S1, S2, S3 - DOWN (open) S4, S5, S6 - UP (closed) S7 - DOWN, (R7 out) S8 -RIGHT, NPN S8 - right, NPN S8 - right, NPN S8 - right, NPNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNN"], "jumps": ["P2190", "P2170", "P2185"]}, {"id": "P2185", "text": ["7 out) S8 - RIGHT, NPNNN", "SWITCH POSITIONS - S1, S2, S3 - DOWN (open) S4, S5, S6 - UP (closed) S7 - DOWN, (R7 out) S8 - RIGHT, NPN"], "jumps": []}, {"id": "P2190", "text": ["9.  Set switches on PC130-29 as follows:", "9. Set switches on PC130-29 as follows:...................", "S1 - UP, Vcc S2, S3, S4 - DOWN (open) S5 - RIGHT, NPNNN S5 - right, NPNopen) S5 - right, NPNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNN"], "jumps": ["P2200", "P2180", "P2195"]}, {"id": "P2195", "text": ["SWITCH POSITIONS - S1 - UP, Vcc S2, S3, S4 - DOWN (open) S5 - RIGHT, NPN"], "jumps": []}, {"id": "P2200", "text": ["The two experiment cards are now set up. Let's measure alpha, beta,  cutoff and saturation values for the transistors on\nPC130-28.", "The two experiment cards are now set up. Let's measure alpha, beta, cutoff and saturation values for the transistors on PC130-28.."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["1.  Ensure that one of these NPN transistors is in the socket for          Q1 on PC130-28; 2N3567, 2N3563, MPS918 or NTE123.", "1. Ensure that one of these NPN transistors is in the socket for Q1 on PC130-28; 2N3567, 2N3563, MPS918 or NTE123...............", "Place the PNP transistor (2N4248, 2N4249 or NTE159) into the spare socket...ce the (PNP) transistor (2N4248 or 2N4249) into the spare socket............................................"], "jumps": ["P2220", "P2200", "P2215", "PNP"]}, {"id": "P2215", "text": ["TRANSISTOR SOCKETS - Transistor sockets are designed to prevent placing a transistor into the socket incorrectly.", "To Remove Transistors: Gently grasp the transistor with the thumb and fore finger and pull straight up using a slight force.......orce.ight up using a slight force.s"], "jumps": ["P2216"]}, {"id": "P2216", "text": ["TRANSISTOR SOCKETS - Transistor sockets are designed to prevent placing a transistor into the socket incorrectly.", "TRANSISTOR SOCKETS - Transistor sockets are designed to prevent placing a transistor into the socket incorrectly. To Remove Transistors: Gently grasp the transistor with the thumb and forefinger and pull straight up using a slight force...................", "To Replace Transistors: Gently grasp the transistor with the thumb and fore finger. Align the pins of the transistor with the holes of the socket. Carefully push the transistor straight down into the socket................"], "jumps": []}, {"id": "P2220", "text": ["2.  Set S1 to UP on PC130-28. This is the circuit.", "2. Set S1 to UP on PC130-28. This is the circuit.........."], "jumps": ["P2230", "P2210", "P2225"]}, {"id": "P2225", "text": [], "jumps": []}, {"id": "P2230", "text": ["What type of biasing is used in this circuit?", "What type of biasing is used in this circuit?.............."], "jumps": ["P2220"]}, {"id": "P2231", "text": [], "jumps": []}, {"id": "P2232", "text": ["Self biasing takes the base bias voltage after the load resistor, directly from the collector.  If temperature changes cause Ic to increase, the voltage applied to the base decreases.", "Self biasing takes the base bias voltage after the load resistor, directly from the collector. If temperature changes cause Ic to increase, the voltage applied to the base decreases."], "jumps": []}, {"id": "P2233", "text": ["Combination bias uses a voltage divider on the base and self biases the emitter."], "jumps": []}, {"id": "P2240", "text": ["3.  Turn PC1 DC Power switch to ON.", "3. Turn PC1 DC Power switch to ON........................................."], "jumps": ["P2230"]}, {"id": "P2250", "text": ["4.  Measure the DC voltages on TP2 (base), TP7 (emitter), and TP8\n     (collector) to TP1 (ground).\n     What are the measured voltages?", "4. Measure the DC voltages on TP2 (base), TP7 (emitter), and TP8 (collector) to TP1 (ground). What are the measured voltages?"], "jumps": ["P2240", "P2255"]}, {"id": "P2251", "text": [], "jumps": []}, {"id": "P2252", "text": ["Your voltage measurements are not within the expected range of\nvalues.  Check:", "Your voltage measurements are not within the expected range of values. Check: itive Supply Voltage to 12 V Switch positions on PC130-28: S1, S4, S5, S6 - Up S2, S3, S7 - Down S8 - NPN Multimeter setup proper lead placement: Base (TP2,TP1) Emitter (TP7, TP1) Collector (TP8, TP1) ))))))))))))))))))))", "Positive Supply Voltage to 12V Switch positions on PC130-28: S1, S4, S5, S6 - Up S2, S3, S7 - Down S8 - NPN Multimeter setup Proper lead placement: Base (TP2, TP1) Emitter (TP7, TP1) Collector (TP8, TP1))1)))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))"], "jumps": []}, {"id": "P2257", "text": ["You should have measured approximately 0.4 to 0.8 for the DC\nvoltages on TP2 (base).  TP7 (emitter) 0.1, and TP8 (collector) 3.0\nto 11.4 to TP1 (ground).", "You should have measured approximately 0.4 to 0.8 for the DC voltages on TP2 (base). TP7 (emitter) 0.1, and TP8 (collector) 3.0 to 11.4 to TP1 (ground)."], "jumps": ["P2250"]}, {"id": "P2255", "text": ["Base - TP2, TP1 Emitter - TP7, TP1 Collector - TP8, TP1 11111111111111111111111111111111"], "jumps": []}, {"id": "P2260", "text": ["Is the emitter to base PN junction forward biased?\nEe =\nEb =\nEc =", "Is the emitter to base PN junction forward biased? Ee = Eb = Ec ===3333333333333333333333"], "jumps": ["P2250"]}, {"id": "P2261", "text": [], "jumps": []}, {"id": "P2262", "text": ["To forward bias a PN junction, the P material must be more positive than the N type material.  The base of NPN transistor is P and the emitter is N.  If Eb is more positive than Ee, then the emitter to base PN junction is forward biased.", "To forward bias a PN junction, the P material must be more positive than the N type material. The base of NPN transistor is P and the emitter is N. If Eb is more positive than Ee, then the emitter to base PN junction is forward biased."], "jumps": []}, {"id": "P2270", "text": ["Is the collector to base PN junction reverse biased?\nEe =\nEb =\nEc =", "Is the collector to base PN junction reverse biased? Ee = Eb = Ec ====== Ec = @%3VVVVV"], "jumps": ["P2260"]}, {"id": "P2271", "text": [], "jumps": []}, {"id": "P2272", "text": ["To reverse bias a PN junction, the P material must be more negative than the N type material.  The base of NPN transistor is P and the collector is N.  If Eb is more negative than Ec, then the collector  to base PN junction is reverse biased.", "To reverse bias a PN junction, the P material must be more negative than the N type material. The base of NPN transistor is P and the collector is N. If Eb is more negative than Ec, then the collector to base PN junction is reverse biased."], "jumps": []}, {"id": "P2280", "text": ["5.  Set your multimeter to measure DC current between TP3 and\n     TP2 on PC130-28.\n     Be aware of polarity.\n6.  Set S1 to DOWN on PC130-28 and measure the base current\n      with R3 as the R 23 in the           spare socket.", "3. Remove the NPN transistor (2N3567, 2N3563, MPS918 or NTE123) from Q1 and replace it with the PNP transistor (2N4248, 2N4249 or NTE159). 4. Place transistor 2N3567, 2N3563 , MPS918 or NTE123 in the spare socket."], "jumps": ["P2470", "P2450", "P2215"]}, {"id": "P2470", "text": ["5.  Place S8 to the LEFT, PNP, on PC130-28.\n6.  Turn PC1 DC Power switch to ON.", "5. Place S8 to the LEFT, PNP, on PC130-28. 6. Turn PC1 DC Power switch to ON."], "jumps": ["P2460"]}, {"id": "P2480", "text": ["7.  Measure the voltage between TP10 and ground.\n     You should measure approximately -12 volts.", "7. Measure the voltage between TP10 and ground. You should measure approximately -12 volts.."], "jumps": ["P2490", "P2470", "P2485"]}, {"id": "P2485", "text": ["S8 set to PNP. Neagative Supply Voltage set to 12. If unable to obtain -12 volts on TP10, check with your instructor.with your instructor.btain -12 volts on TP10, check with your instructor................................................", "PNP TRANSISTOR SET UP - For a PNP transistor to operate, the base must be negative in respect to the emitter. Also, the collector must be negative in respect to the base to reverse bias the CB junction. Ensure that Vcc is negative."], "jumps": []}, {"id": "P2490", "text": ["8.  Place switches S1, S4, S5 and S6 to UP on PC130-28.\n9.  Place switches S2, S3, S7 to DOWN on PC130-28.", "8. Place switches S1, S4, S5 and S6 to UP on PC130-28. 9. Place switches S2, S3, S7 to DOWN on PC130-28."], "jumps": ["P2500", "P2480", "P2495"]}, {"id": "P2495", "text": ["SWITCH POSITIONS - S1, S4, S5, S6 - UP (closed) S2, S3, S7 - DOWN (open) S8 - LEFT, PNPNP"], "jumps": []}, {"id": "P2500", "text": ["10.  Measure the emitter, base, and collector voltages.\n        Is the emitter to base PN junction forward biased and the\n        collector to base PN junction reverse biased?", "10. Measure the emitter, base, and collector voltages. Is the emitter to base PN junction forward biased and the collector to base PN junction reverse biased?"], "jumps": ["P2490"]}, {"id": "P2501", "text": [], "jumps": []}, {"id": "P2502", "text": ["You should have measured approximately:\n               Ee at - 0 V                    Eb at - 0.6 V                    Ec at - 5 V\nThe base is negative in respect to the emitter, forward biased.\nThe collector is negative in respect to the base, reverse biased.", "You should have measured approximately: Ee at - 0 V Eb at - 0.6 V Ec at - 5 V The base is negative in respect to the emitter, forward biased. The collector is negative in respect to the base, reverse biased..."], "jumps": []}, {"id": "P2510", "text": ["13.  Calculate and type in beta.\n        Ib =                   mA\n        Ic =                   mA", "13. Calculate and type in beta. Ib = mA Ic = mA AAAAAAAAAAAAAAAAAAAA"], "jumps": ["P2512"]}, {"id": "P2511", "text": [], "jumps": []}, {"id": "P2512", "text": ["Remember, beta equals the collector current divided by the base current.", "Remember, beta equals the collector current divided by the base current....", "Ic = mA Ib = mA", "Ic b = Ibbbbbbbbbbbbbbbbbbb"], "jumps": []}, {"id": "P2517", "text": ["Your answer should be approximately between 10 and 400.", "Your answer should be approximately between 10 and 400....."], "jumps": ["P2520", "P2510"]}, {"id": "P2520", "text": ["Remember, NPN and PNP transistors operate the same only the polarity of Vcc must be changed and the current flow is opposite."], "jumps": ["P2530", "P2510"]}, {"id": "P2530", "text": ["Now let's observe cutoff and saturation. \n1.  Remove multimeter and place S4, S5, S6, and S7 to DOWN of         PC130-28.     \n2.  Ensure S8 is set to left on PC130-28.", "Now let's observe cutoff and saturation. 1. Remove multimeter and place S4, S5, S6, and S7 to DOWN of PC130-28. 2. Ensure S8 is set to left on PC130-28. et to down connects R2 and the variable resistor R1 for Rb. The base bias of Q1 is varied by adjusting R1....................", "S4 set to down connects R2 and the variable resistor R1 for Rb. The base bias of Q1 is varied by adjusting R1. ......"], "jumps": ["P2540", "P2520", "P2535"]}, {"id": "P2535", "text": ["SWITCH POSITIONS - S4, S5, S6, S7 - DOWN (open) S8 - LEFT, PNP"], "jumps": []}, {"id": "P2540", "text": ["3.  Measure the voltage on the base of the transistor, TP2 on\n     PC130-28.\n4.  Vary R1 from minimum to maximum while observing the base\n     bias voltage.  Notice the voltage varies between 0 and about 6\n     volts.  This is the range of base bias.", "3. Measure the voltage on the base of the transistor, TP2 on PC130-28. 4. Vary R1 from minimum to maximum while observing the base bias voltage. Notice the voltage varies between 0 and about 6 volts. This is the range of base bias."], "jumps": ["P2550", "P2530", "P2545"]}, {"id": "P2545", "text": [], "jumps": []}, {"id": "P2550", "text": ["5.  Set R1 fully CCW, zero volts. \n6.  Set S5 to UP on PC130-28.   \n7.  Measure collector current.  Ensure S6 is down. \n     What is the measured current?", "5. Set R1 fully CCW, zero volts. 6. Set S5 to UP on PC130-28. 7. Measure collector current. Ensure S6 is down. What is the measured current????????????????????????????????"], "jumps": ["P2540", "P2552", "P2555"]}, {"id": "P2551", "text": [], "jumps": []}, {"id": "P2552", "text": ["Zero volts on the base of Q1 reverse biases the emitter to base PN junction.  Current will not flow.", "Zero volts on the base of Q1 reverse biases the emitter to base PN junction. Current will not flow."], "jumps": []}, {"id": "P2555", "text": [], "jumps": []}, {"id": "P2557", "text": ["Your current measurement should have been approximately 0 mA."], "jumps": ["P2560", "P2550"]}, {"id": "P2560", "text": ["Ic is zero because the base to emitter is reverse biased.\n8.  Set S6 to UP on PC130-28.\n9.  Measure the voltage across RL (TP10 and TP9) and across Q1\n     collector to emitter (TP8 to TP7).", "Ic is zero because the base to emitter is reverse biased. 8. Set S6 to UP on PC130-28. 9. Measure the voltage across RL (TP10 and TP9) and across Q1 collector to emitter (TP8 to TP7). re is 0 volts across RL and -12 volts across Q1. A transistor in cutoff acts like an open..........................................", "There is 0 volts across RL and -12 volts across Q1. A transistor in cutoff acts like an open...cross RL and -12 volts across Q1. A transistor in cutoff acts like an open..............................!"], "jumps": ["P2570", "P2550"]}, {"id": "P2570", "text": ["10.  Set S6 to DOWN and measure Ic current.\n11.  Slowly turn R1 CW to increase bias voltage.\n        STOP increasing R1 when current first begins to flow.", "10. Set S6 to DOWN and measure Ic current. 11. Slowly turn R1 CW to increase bias voltage. STOP increasing R1 when current first begins to flow."], "jumps": ["P2580", "P2560", "P2575"]}, {"id": "P2575", "text": ["LEAD PLACEMENT - S6 - DOWN (open) R1 - Rotate CW"], "jumps": []}, {"id": "P2580", "text": ["12.  Set S5 to DOWN on PC130-28.\n13.  Measure the voltage on the base of Q1.\n       Type in the measured voltage.", "12. Set S5 to DOWN on PC130-28. 13. Measure the voltage on the base of Q1. Type in the measured voltage."], "jumps": ["P2570", "P2582", "P2585"]}, {"id": "P2581", "text": [], "jumps": []}, {"id": "P2582", "text": ["Current flows in the base when the emitter to base PN junction is forward biased, usually less than 0.7 volts.  Be sure to stop rotating R1 as soon as current begins to flow.", "Current flows in the base when the emitter to base PN junction is forward biased, usually less than 0.7 volts. Be sure to stop rotating R1 as soon as current begins to flow."], "jumps": []}, {"id": "P2585", "text": [], "jumps": []}, {"id": "P2587", "text": ["Your current measurement should have been approximately 0.1 to 1.0  V.", "Your current measurement should have been approximately 0.1 to 1.0 V."], "jumps": ["P2580"]}, {"id": "P2590", "text": ["14.  Place S5 to UP on PC130-28.\n15.  Measure collector current, Ic. Ensure S6 is open.", "14. Place S5 to UP on PC130-28. 15. Measure collector current, Ic. Ensure S6 is open."], "jumps": ["P2600", "P2580", "P2595"]}, {"id": "P2595", "text": [], "jumps": []}, {"id": "P2600", "text": ["16. Turn R1 CW to increase Eb until Ic just stops increasing. Notice that R1 still has room to increase. Increasing R1 beyond a certain point does not increase Ic. The transistor is in saturation. Be sure to leave R1 at the position that Ic just stops increasing..."], "jumps": ["P2610", "P2590"]}, {"id": "P2610", "text": ["17.  Set S5 and S6 UP.\n18.  Measure the base voltage (TP2).\n       Type in the measured voltage.", "17. Set S5 and S6 UP. 18. Measure the base voltage (TP2). Type in the measured voltage."], "jumps": ["P2600", "P2612"]}, {"id": "P2611", "text": [], "jumps": []}, {"id": "P2612", "text": ["Your voltage measurement is not acceptable.  Be sure S5 and S6 are open.", "Your voltage measurement is not acceptable. Be sure S5 and S6 are open...."], "jumps": []}, {"id": "P2617", "text": ["Your voltage measurement should have been approximately 0.4 to 3 V.", "Your voltage measurement should have been approximately 0.4 to 3 V.."], "jumps": ["P2610"]}, {"id": "P2620", "text": ["Notice the range of bias voltage between cutoff and saturation.  1 to 2 volts is normal.  Your value may vary slightly depending on how close you set R1 for cutoff and for saturation.", "Notice the range of bias voltage between cutoff and saturation. 1 to 2 volts is normal. Your value may vary slightly depending on how close you set R1 for cutoff and for saturation."], "jumps": ["P2630", "P2610"]}, {"id": "P2630", "text": ["19. Place S5 and S6 to UP on PC130-28. 20. Rotate R1 fully CW or to MAX. 21. Measure the voltage across RL (TP10 to TP9) and Q1 (TP8 to TP1). Notice the voltage drop of RL is 12 volts and Q1 is 0 volts. Transistors in saturation act as shorts............."], "jumps": ["P2640", "P2620", "P2635"]}, {"id": "P2635", "text": [
