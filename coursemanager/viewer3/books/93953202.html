", "P13170", "P13185"]}, {"id": "P13185", "text": ["SWITCH POSITIONS - S1, S2, S3 - DOWN (open) S4, S5, S6 - UP (closed) S7 - DOWN, (R7 out) S8 - RIGHT, NPN"], "jumps": []}, {"id": "P13190", "text": ["6.  Set switches on PC130-29 as follows:", "6. Set switches on PC130-29 as follows:...................", "S1 - UP, Vcc S2, S3, S4 - DOWN (open) S5 - RIGHT, NPNNN S5 - right, NPNopen) S5 - right, NPNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNN"], "jumps": ["P13200", "P13180", "P13195"]}, {"id": "P13195", "text": ["SWITCH POSITIONS - S1 - UP, Vcc S2, S3, S4 - DOWN (open) S5 - RIGHT, NPN"], "jumps": []}, {"id": "P13200", "text": ["The two experiment cards are now set up.  Let's measure alpha, beta, cutoff and saturation values for the transistors on\nPC130-28.", "The two experiment cards are now set up. Let's measure alpha, beta, cutoff and saturation values for the transistors on PC130-28."], "jumps": ["P13210", "P13190"]}, {"id": "P13210", "text": ["1.  Ensure that one of these NPN transistors is in the socket for          Q1 on PC130-28; 2N3567, 2N3563, MPS918 or NTE123.", "1. Ensure that one of these NPN transistors is in the socket for Q1 on PC130-28; 2N3567, 2N3563, MPS918 or NTE123. .............", "Place the PNP transistor (2N4248, 2N4249 or NTE159) into the spare socket.lace the (PNP) transistor (2N4248 or 2N4249) into the spare socket............................................"], "jumps": ["P13220", "P13200", "P13215", "PNP"]}, {"id": "P13215", "text": ["TRANSISTOR SOCKETS - Transistor sockets are designed to prevent placing a transistor into the socket incorrectly.", "To Remove Transistors: Gently grasp the transistor with the thumb and fore finger and pull straight up using a slight force.......orce.ight up using a slight force."], "jumps": ["P13216"]}, {"id": "P13216", "text": ["TRANSISTOR SOCKETS - Transistor sockets are designed to prevent placing a transistor into the socket incorrectly.", "TRANSISTOR SOCKETS - Transistor sockets are designed to prevent placing a transistor into the socket incorrectly. To Remove Transistors: Gently grasp the transistor with the thumb and forefinger and pull straight up using a slight force...................", "To Replace Transistors: Gently grasp the transistor with the thumb and fore finger. Align the pins of the transistor with the holes of the socket. Carefully push the transistor straight down into the socket................"], "jumps": []}, {"id": "P13220", "text": ["2.  Set S1 to UP on PC130-28.  This is the circuit.", "2. Set S1 to UP on PC130-28. This is the circuit........."], "jumps": ["P13230", "P13210", "P13225"]}, {"id": "P13225", "text": [], "jumps": []}, {"id": "P13230", "text": ["What type of biasing is used in this circuit?", "What type of biasing is used in this circuit?.............."], "jumps": ["P13220"]}, {"id": "P13231", "text": [], "jumps": []}, {"id": "P13232", "text": ["Self biasing takes the base bias voltage after the load resistor, directly from the collector.  If temperature changes cause Ic to increase, the voltage applied to the base decreases.", "Self biasing takes the base bias voltage after the load resistor, directly from the collector. If temperature changes cause Ic to increase, the voltage applied to the base decreases."], "jumps": []}, {"id": "P13233", "text": ["Combination bias uses a voltage divider on the base and self biases the emitter."], "jumps": []}, {"id": "P13240", "text": ["3.  Press Enter to Set: PC1 DC Power Switch - ON", "3. Press Enter to Set: PC1 DC Power Switch - ON..........................."], "jumps": ["P13230"]}, {"id": "P13250", "text": ["4.  Measure the DC voltages on TP2 (base), TP7 (emitter), and TP8\n     (collector) to TP1 (ground).\n     What are the measured voltages?", "4. Measure the DC voltages on TP2 (base), TP7 (emitter), and TP8 (collector) to TP1 (ground). What are the measured voltages?"], "jumps": ["P13255"]}, {"id": "P13251", "text": [], "jumps": []}, {"id": "P13252", "text": ["Your voltage measurements are not within the expected range of\nvalues.  Check:", "Your voltage measurements are not within the expected range of values. Check:", "Positive Supply Voltage to 12V Switch positions on PC130-28: S1, S4, S5, S6 - Up S2, S3, S7 - Down S8 - NPN Multimeter set-up Proper lead placement: Base (TP2, TP1) Emitter (TP7, TP1) Collector (TP8, TP1)))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))"], "jumps": []}, {"id": "P13257", "text": ["You should have measured approximately 0.4 to 0.8 for the DC\nvoltages on TP2 (base). TP7 (emitter) 0, and TP8 (collector) 3.0 to\n11.3 to TP1 (ground).", "You should have measured approximately 0.4 to 0.8 for the DC voltages on TP2 (base). TP7 (emitter) 0, and TP8 (collector) 3.0 to 11.3 to TP1 (ground)."], "jumps": ["P13250"]}, {"id": "P13255", "text": ["Base - TP2, TP1 Emitter - TP7, TP1 Collector - TP8, TP1 11111111111111111111111111111111"], "jumps": []}, {"id": "P13260", "text": ["Is the emitter to base PN junction forward biased?\nEe =\nEb =\nEc =", "Is the emitter to base PN junction forward biased? Ee = Eb = Ec ===3333333333333333333333"], "jumps": ["P13250"]}, {"id": "P13261", "text": [], "jumps": []}, {"id": "P13262", "text": ["To forward bias a PN junction, the P material must be more\npositive than the N type material.  The base of NPN transistor is P\nand the emitter is N.  If Eb is more positive than Ee, then the\nemitter to base PN junction is forward biased.", "To forward bias a PN junction, the P material must be more positive than the N type material. The base of NPN transistor is P and the emitter is N. If Eb is more positive than Ee, then the emitter to base PN junction is forward biased."], "jumps": []}, {"id": "P13270", "text": ["Is the collector to base PN junction reverse biased?\nEe =\nEb =\nEc =", "Is the collector to base PN junction reverse biased? Ee = Eb = Ec ====== Ec = @%3VVVVV"], "jumps": ["P13260"]}, {"id": "P13271", "text": [], "jumps": []}, {"id": "P13272", "text": ["To reverse bias a PN junction, the P material must be more\nnegative than the N type material.  The base of NPN transistor is\nP and the collector is N.  If Eb is more negative than Ec, then the\ncollector to base PN junction is reverse biased.", "To reverse bias a PN junction, the P material must be more negative than the N type material. The base of NPN transistor is P and the collector is N. If Eb is more negative than Ec, then the collector to base PN junction is reverse biased."], "jumps": []}, {"id": "P13280", "text": ["5.  Set your multimeter to measure DC current between TP3 and\n     TP2 on PC130-28.\n     Be aware of polarity.\n6.  Set S1 to DOWN on PC130-28 and measure the base current\n     with R3 as the Rb resistor.", "5. Set your multimeter to measure DC current between TP3 and TP2 on PC130-28. Be aware of polarity. 6. Set S1 to DOWN on PC130-28 and measure the base current with R3 as the Rb resistor. ................."], "jumps": ["P13290", "P13270", "P13285"]}, {"id": "P13285", "text": [], "jumps": []}, {"id": "P13290", "text": ["What is the measured current, Ib?", "What is the measured current, Ib?ith 3 tries, storing numeric answer (5) in a variable.able.le."], "jumps": ["P13280", "P13292"]}, {"id": "P13291", "text": [], "jumps": []}, {"id": "P13292", "text": ["Your measurement is not acceptable.  Ensure PC130-28 S1 is DOWN or open.  Remember, to measure current the circuit must be broken and the meter inserted.  S1 DOWN breaks the circuit for Ib measurements.  Also, the current is very small.  Place the range on your multimeter to approximately 100 mA.", "Your measurement is not acceptable. Ensure PC130-28 S1 is DOWN or open. Remember, to measure current the circuit must be broken and the meter inserted. S1 DOWN breaks the circuit for Ib measurements. Also, the current is very small. Place the range on your multimeter to approximately 100 mA."], "jumps": []}, {"id": "P13297", "text": ["Your answer is still incorrect.  You should have entered a value of\napproximately 21 mA.", "Your answer is still incorrect. You should have entered a value of approximately 21 mA."], "jumps": ["P13290"]}, {"id": "P13300", "text": ["7.  Set S1 to UP on PC130-28 and remove the multimeter.\n8.  Place the multimeter across S6, TP8 and TP9.\n9.  Set S6 to DOWN and measure the collector current.", "7. Set S1 to UP on PC130-28 and remove the multimeter. 8. Place the multimeter across S6, TP8 and TP9. 9. Set S6 to DOWN and measure the collector current. ............."], "jumps": ["P13310", "P13290", "P13305"]}, {"id": "P13305", "text": ["LEAD PLACEMENT - S1 - UP (closed) S6 - DOWN (open)"], "jumps": []}, {"id": "P13310", "text": ["What is the measured current, Ic?", "What is the measured current, Ic?ith 3 tries, storing numeric answer (5) in a variable.able.le."], "jumps": ["P13300", "P13312"]}, {"id": "P13311", "text": [], "jumps": []}, {"id": "P13312", "text": ["Your measurement is not acceptable.  Ensure PC130-28 S1 and S5 are UP (closed).  Ensure PC130-28 S6 is DOWN.  Remember, to measure current the circuit must by broken and the meter\ninserted.  S6 DOWN breaks the circuit for Ic measurement.", "Your measurement is not acceptable. Ensure PC130-28 S1 and S5 are UP (closed). Ensure PC130-28 S6 is DOWN. Remember, to measure current the circuit must by broken and the meter inserted. S6 DOWN breaks the circuit for Ic measurement."], "jumps": []}, {"id": "P13317", "text": ["Your measured value for Ic is incorrect.  Depending on the transistor type, you should have measured a value close to one shown below.  Select the transistor type you are using for Q1on PC130-28 from the table below to continue.", "Your measured value for Ic is incorrect. Depending on the transistor type, you should have measured a value close to one shown below. Select the transistor type you are using for Q1on PC130-28 from the table below to continue."], "jumps": ["P13310", "PutVar"]}, {"id": "P13320", "text": ["10.  Set S6 to UP on PC130-28 and remove the multimeter.\n11.  Place the multimeter across S5, TP6 and TP7.\n12.  Set S5 DOWN and measure the emitter current.", "10. Set S6 to UP on PC130-28 and remove the multimeter. 11. Place the multimeter across S5, TP6 and TP7. 12. Set S5 DOWN and measure the emitter current. ............."], "jumps": ["P13330", "P13310", "P13325"]}, {"id": "P13325", "text": ["LEAD PLACEMENT - S6 - UP (closed) S5 - DOWN (open)"], "jumps": []}, {"id": "P13330", "text": ["What is the measured current, Ie?", "What is the measured current, Ie?ith 3 tries, storing numeric answer (5) in a variable.able.le."], "jumps": ["P13320", "P13332"]}, {"id": "P13331", "text": [], "jumps": []}, {"id": "P13332", "text": ["Your measurement is not acceptable.  Ensure PC130-28 S1 and S6 are UP (closed).  Ensure PC130-28 S5 is DOWN (open). Remember, to measure current the circuit must be broken and the meter inserted.  S5 DOWN  breaks the circuit for Ie measurement.", "Your measurement is not acceptable. Ensure PC130-28 S1 and S6 are UP (closed). Ensure PC130-28 S5 is DOWN (open). Remember, to measure current the circuit must be broken and the meter inserted. S5 DOWN breaks the circuit for Ie measurement."], "jumps": []}, {"id": "P13337", "text": ["Your measured value for Ie is incorrect.  Depending on the transistor type, you should have measured a value close to one shown below.  Select the transistor type you are using for Q1on PC130-28 from the table below to continue.", "Your measured value for Ie is incorrect. Depending on the transistor type, you should have measured a value close to one shown below. Select the transistor type you are using for Q1on PC130-28 from the table below to continue."], "jumps": ["P13330", "PutVar"]}, {"id": "P13340", "text": ["13.  Set S5 to UP on PC130-28 and remove the multimeter.\n       Compare the three currents.", "13. Set S5 to UP on PC130-28 and remove the multimeter. Compare the three currents./"], "jumps": ["P13350", "P13330"]}, {"id": "P13350", "text": ["Notice Ic and Ie measured very close to the same value.  Ie is actually          mA larger than Ic, but the small difference is hard to read on a multimeter.", "Notice Ic and Ie measured very close to the same value. Ie is actually mA larger than Ic, but the small difference is hard to read on a multimeter. ......"], "jumps": ["P13360", "P13340"]}, {"id": "P13360", "text": ["Calculating a (alpha) using the measured currents gives a value\nof 1.", "Calculating a (alpha) using the measured currents gives a value of 1."], "jumps": ["P13370", "P13340"]}, {"id": "P13370", "text": ["However, adding measured Ib to Ic and dividing the sum into Ic\ngives a more accurate value of a (alpha).  Your answer is\nprobably around 0.995.  Which is, for all practical purposes, 1.", "However, adding measured Ib to Ic and dividing the sum into Ic gives a more accurate value of a (alpha). Your answer is probably around 0.995. Which is, for all practical purposes, 1."], "jumps": ["P13380", "P13340"]}, {"id": "P13380", "text": ["Calculate the value for b (beta). What is the calculated beta?", "Calculate the value for b (beta). What is the calculated beta?answer (5) in a variable.able.le."], "jumps": ["P13340", "P13385", "P13382"]}, {"id": "P13381", "text": [], "jumps": []}, {"id": "P13382", "text": ["Remember, beta equals the collector current divided by the base current.", "Remember, beta equals the collector current divided by the base current....", "Ic = mA Ib = mA"], "jumps": []}, {"id": "P13385", "text": ["Ic b = Ibb", "BETA - b equals the collector current divided by the base current."], "jumps": []}, {"id": "P13387", "text": ["Your calculated value for beta should have been approximately", "Your calculated value for beta should have been approximately0.mA."], "jumps": ["P13380"]}, {"id": "P13390", "text": ["Remember, alpha and beta should be the same values even for\ndifferent biasing voltages and circuit operation.  Alpha and beta\nare ratios that describe a transistor operation under any\ncondition.", "Remember, alpha and beta should be the same values even for different biasing voltages and circuit operation. Alpha and beta are ratios that describe a transistor operation under any condition."], "jumps": ["P13400", "P13380"]}, {"id": "P13400", "text": ["Let's calculate b (beta) for different base biases and compare\nthem.  Alpha is always going to be around 1 and is not necessary\nto calculate for each bias voltage.", "Let's calculate b (beta) for different base biases and compare them. Alpha is always going to be around 1 and is not necessary to calculate for each bias voltage."], "jumps": ["P13810", "P13390"]}, {"id": "P13410", "text": ["3. Calculate and type in the beta.\n     Ib =           mA\n     Ic =           mA", "3. Calculate and type in the beta. Ib = mA Ic = mAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"], "jumps": ["P13412"]}, {"id": "P13411", "text": [], "jumps": []}, {"id": "P13412", "text": ["You should have calculated a value for beta very close to your previous answer of", "You should have calculated a value for beta very close to your previous answer of . Check:", "S1 - Down S5 - Up S2 - Up S6 - Down S3 - Down S7 - Down, (R7 out) S4 - Up S8 - NPN, (right)))))))))))))))))))))))))))))))))))))))))))))))))"], "jumps": []}, {"id": "P13417", "text": ["Your calculated answer for beta should be approximately", "Your calculated answer for beta should be approximately 10 to 600..."], "jumps": ["P13410"]}, {"id": "P13420", "text": ["6.  Calculate and type in beta.\n      Ib =                mA\n      Ic =                mA", "6. Calculate and type in beta. Ib = mA Ic = mAAAAAAAAAAAAAAAAAAAAAAAAAAAA"], "jumps": ["P13840", "P13422"]}, {"id": "P13421", "text": [], "jumps": []}, {"id": "P13422", "text": ["You should have calculated a value for beta very close to your previous answer of", "You should have calculated a value for beta very close to your previous answer of . Check::", "S1 - Down S5 - Up S2 - Down S6 - Down S3 - Up S7 - Down S4 - Up S8 - NPN, (right) S8 - NPN, (right))))))))))))))))))))))))))))))"], "jumps": []}, {"id": "P13427", "text": ["You should have calculated a beta of approximatelyyy..........................................."], "jumps": ["P13420"]}, {"id": "P13430", "text": ["Compare the beta values.", "Compare the beta values.here..............................."], "jumps": ["P13440", "P13420"]}, {"id": "P13440", "text": ["Your three beta values should be relatively close."], "jumps": ["P13445", "P13430"]}, {"id": "P13445", "text": ["Differences in beta values are due to slight changes in the transistor characteristics at different base currents and the accuracy of analog meter reading.", "Differences in beta values are due to slight changes in the transistor characteristics at different base currents and the accuracy of analog meter reading.............."], "jumps": ["P13450", "P13430"]}, {"id": "P13450", "text": ["Next, lets measure the beta of a PNP transistor. \n1.  Remove test equipment from the circuit.  \n2.  Press Enter to Set: PC1 DC Power Switch - OFF", "Next, lets measure the beta of a PNP transistor. 1. Remove test equipment from the circuit. 2. Press Enter to Set: PC1 DC Power Switch - OFFFFFFFFFFFFFF"], "jumps": ["P13430"]}, {"id": "P13460", "text": ["3. Remove the NPN transistor (2N3567, 2N3563, MPS918 or NTE123) from Q1 and replace it with the PNP transistor (2N4248 , 2N4249 or NTE159). 4. Place the NPN transistor (2N3567, 2N3563, MPS918 or NTE123) in the spare socket."], "jumps": ["P13470", "P13215"]}, {"id": "P13470", "text": ["5.  Place S8 to the LEFT, PNP, on PC130-28. \n6.  Press Enter to Set: PC1 DC Power Switch - ON", "5. Place S8 to the LEFT, PNP, on PC130-28. 6. Press Enter to Set: PC1 DC Power Switch - ON"], "jumps": ["P13460"]}, {"id": "P13480", "text": ["7.  Measure the voltage between TP10 and ground.\n     You should measure approximately -12 volts.", "7. Measure the voltage between TP10 and ground. You should measure approximately -12 volts."], "jumps": ["P13490", "P13485"]}, {"id": "P13485", "text": ["S8 set to PNP. Negative Supply Voltage set to 12. If unable to obtain -12 volts on TP10, check with your instructor..with your instructor.btain -12 volts on TP10, check with your instructor................................................", "PNP TRANSISTOR SET UP - For a PNP transistor to operate, the base must be negative in respect to the emitter. Also, the collector must be negative in respect to the base to reverse bias the CB junction. Ensure that Vcc is negative."], "jumps": []}, {"id": "P13490", "text": ["8.  Place switches S1, S4, S5 and S6 to UP on PC130-28.\n9.  Place switches S2, S3, S7 to DOWN on PC130-28.", "8. Place switches S1, S4, S5 and S6 to UP on PC130-28. 9. Place switches S2, S3, S7 to DOWN on PC130-28."], "jumps": ["P13500", "P13480", "P13495"]}, {"id": "P13495", "text": ["SWITCH POSITIONS - S1, S4, S5, S6 - UP (closed) S2, S3, S7 - DOWN (closed) S8 - LEFT, PNP"], "jumps": []}, {"id": "P13500", "text": ["10.  Measure the emitter, base, and collector voltages.\n       Is the emitter to base PN junction forward biased and the\n       collector to base PN junction reverse biased?", "10. Measure the emitter, base, and collector voltages. Is the emitter to base PN junction forward biased and the collector to base PN junction reverse biased??"], "jumps": ["P13490"]}, {"id": "P13501", "text": [], "jumps": []}, {"id": "P13502", "text": ["You should have measured approximately:\n               Ee at - 0 V                    Eb at - 0.6 V                    Ec at - 5 V\nThe base is negative in respect to the emitter, forward biased.\nThe collector is negative in respect to the base, reverse biased.", "You should have measured approximately: Ee at - 0 V Eb at - 0.6 V Ec at - 5 V The base is negative in respect to the emitter, forward biased. The collector is negative in respect to the base, reverse biased..."], "jumps": []}, {"id": "P13510", "text": ["13.  Calculate and type in beta.\n        Ib =                   mA\n        Ic =                   mA", "13. Calculate and type in beta. Ib = mA Ic = mA"], "jumps": ["P13512"]}, {"id": "P13511", "text": [], "jumps": []}, {"id": "P13512", "text": ["Remember, Beta equals the collector current divided by the base current.", "Remember, Beta equals the collector current divided by the base current....", "Ic = mA Ib = mA", "Ic b = Ibbbbbbbbbbbbbbbbbbb"], "jumps": []}, {"id": "P13517", "text": ["Your answer should be approximately between 10 and 400.", "Your answer should be approximately between 10 and 400....."], "jumps": ["P13520", "P13510"]}, {"id": "P13520", "text": ["Remember, NPN and PNP transistors operate the same only the\npolarity of Vcc must be changed and the current flow is\nopposite.", "Remember, NPN and PNP transistors operate the same only the polarity of Vcc must be changed and the current flow is opposite."], "jumps": ["P13530", "P13510"]}, {"id": "P13530", "text": ["Now let's observe cutoff and saturation.\n1.  Remove multimeter and place S4, S5, S6, and S7 to DOWN of         PC130-28.\n2.  Ensure S8 is set to left on PC130-28.", "Now let's observe cutoff and saturation. 1. Remove multimeter and place S4, S5, S6, and S7 to DOWN of PC130-28. 2. Ensure S8 is set to left on PC130-28. ..........................", "S4 set to down connects R2 and the variable resistor R1 for Rb. The base bias of Q1 is varied by adjusting R1. ......"], "jumps": ["P13540", "P13520", "P13535"]}, {"id": "P13535", "text": ["SWITCH POSITIONS - S4, S5, S6, S7 - DOWN (open) S8 - LEFT, PNP"], "jumps": []}, {"id": "P13540", "text": ["3.  Measure the voltage on the base of the transistor, TP2 on\n     PC130-28.\n4.  Vary R1 from minimum to maximum while observing the base\n     bias voltage.  Notice the voltage varies between 0 and about 6\n     volts.  This is the range of base bias.", "3. Measure the voltage on the base of the transistor, TP2 on PC130-28. 4. Vary R1 from minimum to maximum while observing the base bias voltage. Notice the voltage varies between 0 and about 6 volts. This is the range of base bias."], "jumps": ["P13550", "P13530", "P13545"]}, {"id": "P13545", "text": [], "jumps": []}, {"id": "P13550", "text": ["5.  Set R1 fully CCW, zero volts.\n6.  Set S5 to UP on PC130-28.\n7.  Measure collector current.  Ensure S6 is down.\n     What is the measured current?", "5. Set R1 fully CCW, zero volts. 6. Set S5 to UP on PC130-28. 7. Measure collector current. Ensure S6 is down. What is the measured current? ??????????????????????????????????"], "jumps": ["P13540", "P13555", "P13552"]}, {"id": "P13551", "text": [], "jumps": []}, {"id": "P13552", "text": ["Zero volts on the base of Q1 reverse biases the emitter to base\nPN junction.  Current will not flow.", "Zero volts on the base of Q1 reverse biases the emitter to base PN junction. Current will not flow."], "jumps": []}, {"id": "P13555", "text": [], "jumps": []}, {"id": "P13557", "text": ["Your current measurement should have been approximately 0 mA."], "jumps": ["P13560", "P13550"]}, {"id": "P13560", "text": ["Ic is zero because the base to emitter is reverse biased.\n8.  Set S6 to UP on PC130-28.\n9.  Measure the voltage across RL (TP10 and TP9) and across Q1\n     collector to emitter (TP8 to TP7).", "Ic is zero because the base to emitter is reverse biased. 8. Set S6 to UP on PC130-28. 9. Measure the voltage across RL (TP10 and TP9) and across Q1 collector to emitter (TP8 to TP7). ............................", "There is 0 volts across RL and -12 volts across Q1. A transistor in cutoff acts like an open...cross RL and -12 volts across Q1. A transistor in cutoff acts like an open.............................."], "jumps": ["P13570", "P13550"]}, {"id": "P13570", "text": ["10.  Set S6 to DOWN and measure Ic current.\n11.  Slowly turn R1 CW to increase bias voltage.\n        STOP increasing R1 when current first begins to flow.", "10. Set S6 to DOWN and measure Ic current. 11. Slowly turn R1 CW to increase bias voltage. STOP increasing R1 when current first begins to flow."], "jumps": ["P13580", "P13560", "P13575"]}, {"id": "P13575", "text": ["LEAD PLACEMENT - S6 - DOWN (open) R1- Rotate CW"], "jumps": []}, {"id": "P13580", "text": ["12.  Set S5 to DOWN on PC130-28.\n13.  Measure the voltage on the base of Q1.\n       Type in the measured voltage.", "12. Set S5 to DOWN on PC130-28. 13. Measure the voltage on the base of Q1. Type in the measured voltage."], "jumps": ["P13570", "P13585", "P13582"]}, {"id": "P13581", "text": [], "jumps": []}, {"id": "P13582", "text": ["Current flows in the base when the emitter to base PN junction is\nforward biased, usually less than 0.7 volts.  Be sure to stop\nrotating R1 as soon as current begins to flow.", "Current flows in the base when the emitter to base PN junction is forward biased, usually less than 0.7 volts. Be sure to stop rotating R1 as soon as current begins to flow."], "jumps": []}, {"id": "P13585", "text": [], "jumps": []}, {"id": "P13587", "text": ["Your current measurement should have been approximately 0.1 to 1.0 V."], "jumps": ["P13580"]}, {"id": "P13590", "text": ["14.  Place S5 to UP on PC130-28. \n15.  Measure collector current, Ic.  Ensure S6 is open.", "14. Place S5 to UP on PC130-28. 15. Measure collector current, Ic. Ensure S6 is open."], "jumps": ["P13600", "P13580", "P13595"]}, {"id": "P13595", "text": [], "jumps": []}, {"id": "P13600", "text": ["16.  Turn R1 CW to increase Eb until Ic just stops increasing.\n        Notice that R1 still has room to increase.  Increasing R1\n        beyond a certain point does not increase Ic.  The transistor is\n        in saturation.  Be sure to leave R1 at the position that Ic just\n        stops increasing.", "16. Turn R1 CW to increase Eb until Ic just stops increasing. Notice that R1 still has room to increase. Increasing R1 beyond a certain point does not increase Ic. The transistor is in saturation. Be sure to leave R1 at the position that Ic just stops increasing."], "jumps": ["P13610", "P13590"]}, {"id": "P13610", "text": ["17.  Set S5 and S6 UP.\n18.  Measure the base voltage (TP2).\n       Type in the measured voltage.", "17. Set S5 and S6 UP. 18. Measure the base voltage (TP2). Type in the measured voltage."], "jumps": ["P13600", "P13612"]}, {"id": "P13611", "text": [], "jumps": []}, {"id": "P13612", "text": ["Your voltage measurement is not acceptable.  Be sure S5 and S6 are open.", "Your voltage measurement is not acceptable. Be sure S5 and S6 are open...."], "jumps": []}, {"id": "P13617", "text": ["Your voltage measurement should have been approximately 0.4 to 3 V.", "Your voltage measurement should have been approximately 0.4 to 3 V.."], "jumps": ["P13610"]}, {"id": "P13620", "text": ["Notice the range of bias voltage between cutoff and saturation. 1\nto 2 volts is normal.  Your value may vary slightly depending on\nhow close you set R1 for cutoff and for saturation.", "Notice the range of bias voltage between cutoff and saturation. 1 to 2 volts is normal. Your value may vary slightly depending on how close you set R1 for cutoff and for saturation."], "jumps": ["P13630", "P13610"]}, {"id": "P13630", "text": ["19.  Place S5 and S6 to UP on PC130-28.\n20.  Rotate R1 fully CW or to MAX.\n21.  Measure the voltage across RL (TP10 to TP9) and Q1 (TP8 to\n        TP1).  Notice the voltage drop of RL is 12 volts and Q1 is 0\n        volts.  Transistors in saturation act as shorts.", "19. Place S5 and S6 to UP on PC130-28. 20. Rotate R1 fully CW or to MAX. 21. Measure the voltage across RL (TP10 to TP9) and Q1 (TP8 to TP1). Notice the voltage drop of RL is 12 volts and Q1 is 0 volts. Transistors in saturation act as shorts."], "jumps": ["P13640", "P13620", "P13635"]}, {"id": "P13635", "text": [], "jumps": []}, {"id": "P13640", "text": ["Last, let's use PC130-29 and observe the effect of different load\nresistors on Ic.  Remember, they should have very little effect.", "Last, let's use PC130-29 and observe the effect of different load resistors on Ic. Remember, they should have very little effect."], "jumps": ["P13650", "P13630"]}, {"id": "P13650", "text": ["ansistor 2N3567 (NPN) is in the socket for Q1 on PC130-29.", "Place the PNP transistor (2N4248, 2N4249 or NTE159) into the spare socket.......r 2N4248 or 2N4249 (PNP) into the spare socket.N4248 or 2N4249 (PNP) into the spare socket............................", "1. Ensure that the NPN transistor (2N3567, 2N3563, MPS918 or NTE123) is in the socket for Q1 on PC130-29."], "jumps": ["P13660", "P13640", "P13215", "PNP"]}, {"id": "P13660", "text": ["2.  Press Enter to Set: PC1 DC Power Switch - OFF \n                                          PC2 DC Power Switch - ON", "2. Press Enter to Set: PC1 DC Power Switch - OFF PC2 DC Power Switch - ONN"], "jumps": ["P13650"]}, {"id": "P13670", "text": ["3.  Measure the base bias voltage of Q1 on PC130-29 (TP3 to\n     TP1).\n4.  Adjust R3 for a voltage higher than 0.55 volts.  This applies the\n     base bias for the transistor.", "3. Measure the base bias voltage of Q1 on PC130-29 (TP3 to TP1). 4. Adjust R3 for a voltage higher than 0.55 volts. This applies the base bias for the transistor. epending upon the transistor."], "jumps": ["P13680", "P13675"]}, {"id": "P13675", "text": ["LEAD PLACEMENT - Adjust R3 for more than 0.55 volts."], "jumps": []}, {"id": "P13680", "text": ["5.  Set the multimeter to measure current.\n6.  Place S2 UP (closed).\n7.  Place the current meter in the circuit of R5.\n8.  Place S2 DOWN (open).  Measure current", "5. Set the multimeter to measure current. 6. Place S2 UP (closed). 7. Place the current meter in the circuit of R5. 8. Place S2 DOWN (open). Measure current ure current. Remember to place S2 UP before removing the meter from the circuit. 5. 9. Measure the current."], "jumps": ["P13690", "P13670", "P13685"]}, {"id": "P13685", "text": ["LEAD PLACEMENT - Place the ground (black) test lead on TP4 and the input (red) test lead to the bottom of R5."], "jumps": []}, {"id": "P13690", "text": ["What is the measured current for Ic, with R5 as RL?", "What is the measured current for Ic, with R5 as RL? your answer is less than 1 mA, type a \"0.\" before your answer."], "jumps": ["P13680", "P13692"]}, {"id": "P13691", "text": [], "jumps": []}, {"id": "P13692", "text": ["The measurement is not within the expected values.  Check:", "The measurement is not within the expected values. Check:n..............", "1. Eb more than 0.55 volts. 2. Multimeter across open switch S2, (bottom of R5 to TP4).)))))))))))))))))))))))))))))))))"], "jumps": []}, {"id": "P13697", "text": ["Your current measurement with R5 as RL should have been approximately 0 to 0.3 mA."], "jumps": ["P13690"]}, {"id": "P13700", "text": ["the circuit of R6. 12. Place S3 DOWN (open). What is the measured current for Ic with R6 as RL?", "9. Remember to place S2 UP (closed). Remove test leads. 10. Place S2 DOWN (open). 11. Place S3 UP (closed). Place the meter in the circuit of R6. 12. Place S3 DOWN (open). What is the measured current for Ic with R6 as RL?"], "jumps": ["P13690", "P13705", "P13702"]}, {"id": "P13701", "text": [], "jumps": []}, {"id": "P13702", "text": ["You should have measured a value for Ic very close to your previous answer of", "You should have measured a value for Ic very close to your previous answer of:::::::::::::::::::::::::::", "1. Eb more than 0.55 volts. 2. Multimeter across open switch S3, (bottom of R6 to TP4). (bottom of R6 to TP4))))))"], "jumps": []}, {"id": "P13705", "text": ["LEAD PLACEMENT - Place the meter's input (red) test lead to the bottom of R6 and the com (black) test lead on TP4 to measure the collector current when R6 is the load."], "jumps": []}, {"id": "P13707", "text": ["Your current measurement with R6 as RL should have been approximately 0.4 to 0.6 mA.", "Your current measurement with R6 as RL should have been approximately 0.4 to 0.6 mA..6 mA."], "jumps": ["P13700"]}, {"id": "P13710", "text": ["Place meter in the circ 16. Place S4 DOWN (closed). Place meter in the circuit of R7. What is the measured current for Ic, with R7 as RL?", "13. Place S3 UP (closed). Remove test leads. 14. Place S3 DOWN (open). 15. Place S4 UP (closed). Place meter in the circuit of R7. 16. Place S4 DOWN (open). What is the measured current for Ic, with R7 as RL? d current for Ic, with R7 as RL?"], "jumps": ["P13700", "P13712"]}, {"id": "P13711", "text": [], "jumps": []}, {"id": "P13712", "text": ["You should have measured for Ic very close to your previous answer of", "You should have measured for Ic very close to your previous answer of::::::::::::::::::::::::::", "1. Eb more than 0.55 volts. 2. Multimeter across open switch S4, (bottom of R7 to TP4).))))))))))))))))))))))))))))))))))))"], "jumps": []}, {"id": "P13717", "text": ["Your current measurement with R7as a RL should have been approximately 0.4 to 1.5 mA.", "Your current measurement with R7as a RL should have been approximately 0.4 to 1.5 mA... mA..."], "jumps": ["P13710"]}, {"id": "P13720", "text": ["17.  Place S4 UP (closed) and remove the meter from the circuit.\n\nNotice that the difference in current, Ic, is within a few milliamps for any value of RL.", "5.1 k ohm 10 k ohm 15 k ohm)))))))", "17. Place S4 UP (closed) and remove the meter from the circuit. Notice that the difference in current, Ic, is within a few milliamps for any value of RL."], "jumps": ["P13710"]}, {"id": "P13730", "text": ["Ic depends on the base bias voltage only."], "jumps": ["P13720"]}, {"id": "P13750", "text": ["1.  Set the test console Power OFF.", "1. Set the test console Power OFF. OFF.FF................................."], "jumps": []}, {"id": "P13760", "text": ["2.  Disconnect all test equipment. \n3.  Carefully remove PC130-28 and PC130-29.  \n4.  Return all equipment to its proper storage area.", "2. Disconnect all test equipment. 3. Carefully remove PC130-28 and PC130-29. 4. Return all equipment to its proper storage area................."], "jumps": ["P2910", "P13750"]}, nect meter across S3 (TP5 and TP2).  Check that\n     S1, S2, and S3 DOWN.  Type in the measured value.", "4. Measure the base current. Use R5 as Rb. Ensure S5 and S6 are UP. Connect meter across S3 (TP5 and TP2). Check that S1, S2, and S3 DOWN. Type in the measured value."], "jumps": ["P13410", "P13832"]}, {"id": "P13831", "text": [], "jumps": []}, {"id": "P13832", "text": ["Your answer is not acceptable.  Check:", "Your answer is not acceptable. Check: with a negative sign..............", "1. S5 and S6 - UP 2. S1, S2 and S3 - DOWN 3. Lead placement - TP5 and TP222"], "jumps": []}, {"id": "P13837", "text": ["You should have measured approximately 60 mA for Ib.", "You should have measured approximately 60 mA for Ib.sured 5.0mA."], "jumps": ["P13830"]}, {"id": "P13840", "text": ["5.  Measure the collector current.  Use R5 as Rb.  Ensure S3 and\n     S5 are UP.  Connect meter across S6 (TP8 and TP9).  Check\n     that S1, S2, and S6 are DOWN.  Type in the measured value.", "5. Measure the collector current. Use R5 as Rb. Ensure S3 and S5 are UP. Connect meter across S6 (TP8 and TP9). Check that S1, S2, and S6 are DOWN. Type in the measured value."], "jumps": ["P13830", "P13842"]}, {"id": "P13841", "text": [], "jumps": []}, {"id": "P13842", "text": ["Your answer is not acceptable.  Check:", "Your answer is not acceptable. Check: with a negative sign..............", "1. S3 and S5 - UP 2. S1, S2 and S6 - DOWN 3. Lead placement - TP8 and TP9"], "jumps": []}, {"id": "P13847", "text": ["Your measured value for Ic is incorrect. Depending on the transistor type, you should have measured a value close to one shown below. Select the transistor type you are using for Q1on PC130-28 from the table below to continue."], "jumps": ["PutVar"]}, {"id": "P13850", "text": ["11.  Measure the base current. Use R3 as Rb.  Ensure S5 and S6\n       are UP.  Connect meter across S1 (TP3 and TP2). Check that\n       S1, S2, and S3 are DOWN.  Type in the measured value.", "11. Measure the base current. Use R3 as Rb. Ensure S5 and S6 are UP. Connect meter across S1 (TP3 and TP2). Check that S1, S2, and S3 are DOWN. Type in the measured value."], "jumps": ["P13500", "P13852"]}, {"id": "P13851", "text": [], "jumps": []}, {"id": "P13852", "text": ["Your answer is not acceptable.  Check:", "Your answer is not acceptable. Check: with a negative sign..............", "1. S5 and S6 - UP 2. S1, S2 and S3 - DOWN 3. Lead placement - TP2 and TP3333333333333333333333333333333333"], "jumps": []}, {"id": "P13857", "text": ["You should have measured approximately 20 mA.", "You should have measured approximately 20 mA.ave measured 5.0mA."], "jumps": ["P13850"]}, {"id": "P13860", "text": ["12.  Measure the collector. Use R3 as Rb.  Ensure S1 and S5 are\n       UP.  Connect meter across S6 (TP8 and TP9).  Check that S2,\n       S3, and S6 are DOWN.  Type in the measured value.", "12. Measure the collector. Use R3 as Rb. Ensure S1 and S5 are UP. Connect meter across S6 (TP8 and TP9). Check that S2, S3, and S6 are DOWN. Type in the measured value."], "jumps": ["P13850", "P13862"]}, {"id": "P13861", "text": [], "jumps": []}, {"id": "P13862", "text": ["Your answer is not acceptable.  Check:", "Your answer is not acceptable. Check: with a negative sign..............", "1. S1 and S5 - UP 2. S2, S3 and S6 - DOWN 3. Lead placement - TP8 and TP999"], "jumps": []}, {"id": "P13867", "text": ["Your current measurement should have been approximately 6.5 mA.", "Your current measurement should have been approximately 6.5 mA..0mA."], "jumps": ["P13860"]}, {"id": "P14020", "text": ["This experiment demonstrates the basic operation of an NPN and PNP transistor using two different experiment cards.  You will place a transistor in a circuit and apply DC bias voltages. Voltage and current measurements are made to verify transistor operation.", "This experiment demonstrates the basic operation of an NPN and PNP transistor using two different experiment cards. You will place a transistor in a circuit and apply DC bias voltages. Voltage and current measurements are made to verify transistor operation.."], "jumps": ["P14040", "P2001"]}, {"id": "P14040", "text": ["Pick up the PC130-28 card.  This card demonstrates transistor operation.", "Pick up the PC130-28 card. This card demonstrates transistor operation."], "jumps": ["P14050", "P14020"]}, {"id": "P14050", "text": ["S4 selects between fixed resistors (R3, R4 or R5) and a variable resistor (R1 and R2) for base bias."], "jumps": ["P14060", "P14040"]}, {"id": "P14060", "text": ["S1 through S3 allow a current meter to be inserted into the circuit to measure Ib."], "jumps": ["P14070", "P14040"]}, {"id": "P14070", "text": ["S5 and S6 are normally closed. Opening one at a time allows a current meter to be placed in the circuit to measure Ic (S6) or Ie (S5)."], "jumps": ["P14080", "P14040"]}, {"id": "P14080", "text": ["S8 selects between +Vcc and -Vcc for NPN or PNP transistor operation."], "jumps": ["P14090", "P14040"]}, {"id": "P14090", "text": ["S7 selects between fixed bias and combination bias.  S7 set to \"R7 OUT\" is shown.", "S7 selects between fixed bias and combination bias. S7 set to \"R7 OUT\" is shown."], "jumps": ["P14100", "P14040"]}, {"id": "P14100", "text": ["Pick up the PC130-29 card.  This card demonstrates transistor bias operation.", "Pick up the PC130-29 card. This card demonstrates transistor bias operation."], "jumps": ["P14110", "P14040"]}, {"id": "P14110", "text": ["Switches S2, S3 and S4 select different load resistance for the collector of Q1."], "jumps": ["P14120", "P14100"]}, {"id": "P14120", "text": ["S5 selects -Vcc or +Vcc for PNP or NPN transistor operation."], "jumps": ["P14130", "P14100"]}, {"id": "P14130", "text": ["S1 selects between fixed bias or self bias."], "jumps": ["P14140", "P14100"]}, {"id": "P14140", "text": ["C1 and C2 are used for input and output signals.  They block any DC voltages from entering or leaving this circuit.  Let's start the experiment.", "C1 and C2 are 159) into the spare socket.lace the (PNP) transistor (2N4248 or 2N4249) into the spare socket............................................"], "jumps": ["P14220", "P14200", "P14215", "PNP"]}, {"id": "P14215", "text": ["TRANSISTOR SOCKETS - Transistor sockets are designed to prevent placing a transistor into the socket incorrectly.", "To Remove Transistors: Gently grasp the transistor with the thumb and fore finger and pull straight up using a slight force.......orce.ight up using a slight force."], "jumps": ["P14216"]}, {"id": "P14216", "text": ["TRANSISTOR SOCKETS - Transistor sockets are designed to prevent placing a transistor into the socket incorrectly.", "To Replace Transistors: Gently grasp the transistor with the thumb and fore finger. Align the pins of the transistor with the holes of the socket. Carefully push the transistor straight down into the socket................", "TRANSISTOR SOCKETS - Transistor sockets are designed to prevent placing a transistor into the socket incorrectly. To Remove Transistors: Gently grasp the transistor with the thumb and forefinger and pull straight up using a slight force..................."], "jumps": []}, {"id": "P14220", "text": ["2.  Set S1 to UP on PC130-28. This is the circuit.", "2. Set S1 to UP on PC130-28. This is the circuit.........."], "jumps": ["P14230", "P14210", "P14225"]}, {"id": "P14225", "text": [], "jumps": []}, {"id": "P14230", "text": ["What type of biasing is used in this circuit?", "What type of biasing is used in this circuit?.............."], "jumps": ["P14220"]}, {"id": "P14231", "text": [], "jumps": []}, {"id": "P14232", "text": ["Self biasing takes the base bias voltage after the load resistor, directly from the collector.  If temperature changes cause Ic to increase, the voltage applied to the base decreases.", "Self biasing takes the base bias voltage after the load resistor, directly from the collector. If temperature changes cause Ic to increase, the voltage applied to the base decreases."], " an the N type material.  The base of NPN transistor is P\nand the emitter is N.  If Eb is more positive than Ee, then the\nemitter to base PN junction is forward biased.", "To forward bias a PN junction, the P material must be more positive than the N type material. The base of NPN transistor is P and the emitter is N. If Eb is more positive than Ee, then the emitter to base PN junction is forward biased."], "jumps": []}, {"id": "P14270", "text": ["Is the collector to base PN junction reverse biased?\nEe =\nEb =\nEc =", "Is the collector to base PN junction reverse biased? Ee = Eb = Ec ====== Ec = @%3VVVVV"], "jumps": ["P14260"]}, {"id": "P14271", "text": [], "jumps": []}, {"id": "P14272", "text": ["To reverse bias a PN junction, the P material must be more\nnegative than the N type material.  The base of NPN transistor is\nP and the collector is N.  If Eb is more negative than Ec, then the\ncollector to base PN junction is reverse biased.", "To reverse bias a PN junction, the P material must be more negative than the N type material. The base of NPN transistor is P and the collector is N. If Eb is more negative than Ec, then the collector to base PN junction is reverse biased."], "jumps": []}, {"id": "P14280", "text": ["5.  Set your multimeter to measure DC current between TP3 and\n     TP2 on PC130-28.\n     Be aware of polarity.\n6.  Set S1 to DOWN on PC130-28 and measure the base current\n     with R3 as the Rb resistor.", "5. Set your multimeter to measure DC current between TP3 and TP2 on PC130-28. Be aware of polarity. 6. Set S1 to DOWN on PC130-28 and measure the base current with R3 as the Rb resistor. ................."], "jumps": ["P14290", "P14270", "P14285"]}, {"id": "P14285", "text": [], "jumps": []}, {"id": "P14290", "text": ["What is the measured current, Ib?", "What is the measured current, Ib?ith 3 tries, storing numeric answer (5) in a variable.able.le."], "jumps": ["P14280", "P14292"]}, {"id": "P14291", "text": [], "jumps": []}, {"id": "P14292", NP transistor (2N3567, 2N3563, MPS918 or                      NTE123) in the spare socket.", "3. Remove the NPN transistor (2N3567, 2N3563, MPS918 or NTE123) from Q1 and replace it with the PNP transistor (2N4248, 2N4249 or NTE159). 4. Place the PNP transistor (2N3567, 2N3563, MPS918 or NTE123) in the spare socket."], "jumps": ["P14470", "P14215"]}, {"id": "P14470", "text": ["5.  Place S8 to the LEFT, PNP, on PC130-28. \n6.  Press Enter to Set: DC Power Switch - ON", "5. Place S8 to the LEFT, PNP, on PC130-28. 6. Press Enter to Set: DC Power Switch - ON- ON"], "jumps": ["P14460"]}, {"id": "P14480", "text": ["7.  Measure the voltage between TP10 and ground.\n     You should measure approximately -12 volts.", "7. Measure the voltage between TP10 and ground. You should measure approximately -12 volts."], "jumps": ["P14490", "P14485"]}, {"id": "P14485", "text": ["S8 set to PNP. - Supply Voltage set to 12. If unable to obtain -12 volts on TP10, check with your instructor., check with your instructor.btain -12 volts on TP10, check with your instructor................................................", "PNP TRANSISTOR SET UP - For a PNP transistor to operate, the base must be negative in respect to the emitter. Also, the collector must be negative in respect to the base to reverse bias the CB junction. Ensure that Vcc is negative."], "jumps": []}, {"id": "P14490", "text": ["8.  Place switches S1, S4, S5 and S6 to UP on PC130-28.\n9.  Place switches S2, S3, S7 to DOWN on PC130-28.", "8. Place switches S1, S4, S5 and S6 to UP on PC130-28. 9. Place switches S2, S3, S7 to DOWN on PC130-28."], "jumps": ["P14500", "P14480", "P14495"]}, {"id": "P14495", "text": ["SWITCH POSITIONS - S1, S4, S5, S6 - UP (closed) S2, S3, S7 - DOWN (open) S8 - left, PNP"], "jumps": []}, {"id": "P14500", "text": ["10.  Measure the emitter, base, and collector voltages.\n       Is the emitter to base PN junction forward biased and the\n       collector to base PN junction reverse biased?", "10. Measure the emitter, base, and collector voltages. Is the emitter to base PN junction forward biased and the collector to base PN junction reverse biased??"], "jumps": ["P14490"]}, {"id": "P14501", "text": [], "jumps": []}, {"id": "P14502", "text": ["You should have measured approximately:\n               Ee at - 0 V                    Eb at - 0.6 V                    Ec at - 5 V\nThe base is negative in respect to the emitter, forward biased.\nThe collector is negative in respect to the base, reverse biased.", "You should have measured approximately: Ee at - 0 V Eb at - 0.6 V Ec at - 5 V The base is negative in respect to the emitter, forward biased. The collector is negative in respect to the base, reverse biased..."], "jumps": []}, {"id": "P14510", "text": ["13.  Calculate and type in beta.\n        Ib =                  mA\n        Ic =                  mA", "13. Calculate and type in beta. Ib = mA Ic = mA"], "jumps": ["P14512"]}, {"id": "P14511", "text": [], "jumps": []}, {"id": "P14512", "text": ["Remember, beta equals the collector current divided by the base current.", "Remember, beta equals the collector current divided by the base current....", "Ic = mA Ib = mA", "Ic b = Ibbbbbbbbbbbbbbbbbbb"], "jumps": []}, {"id": "P14517", "text": ["Your answer should be approximately between 10 and 400.", "Your answer should be approximately between 10 and 400....."], "jumps": ["P14520", "P14510"]}, {"id": "P14520", "text": ["Remember, NPN and PNP transistors operate the same only the\npolarity of Vcc must be changed and the current flow is\nopposite.", "Remember, NPN and PNP transistors operate the same only the polarity of Vcc must be changed and the current flow is opposite."], "jumps": ["P14530", "P14510"]}, {"id": "P14530", "text": ["Now let's observe cutoff and saturation.\n1.  Remove multimeter and place S4, S5, S6, and S7 to DOWN of         PC130-28.\n2.  Ensure S8 is set to left on PC130-28.", "Now let's observe cutoff and saturation. 1. Remove multimeter and place S4, S5, S6, and S7 to DOWN of PC130-28. 2. Ensure S8 is set to left on PC130-28. ..........................", "S4 set to down connects R2 and the variable resistor R1 for Rb. The base bias of Q1 is varied by adjusting R1. ......"], "jumps": ["P14540", "P14520", "P14535"]}, {"id": "P14535", "text": ["SWITCH POSITIONS - S4, S5, S6, S7 - DOWN (open) S8 - left, PNP"], "jumps": []}, {"id": "P14540", "text": ["3.  Measure the voltage on the base of the transistor, TP2 on\n     PC130-28.\n4.  Vary R1 from minimum to maximum while observing the base\n      bias voltage.  Notice the voltage varies between 0 and about 6\n      volts.  This is the range of base bias.", "3. Measure the voltage on the base of the transistor, TP2 on PC130-28. 4. Vary R1 from minimum to maximum while observing the base bias voltage. Notice the voltage varies between 0 and about 6 volts. This is the range of base bias."], "jumps": ["P14550", "P14530", "P14545"]}, {"id": "P14545", "text": [], "jumps": []}, {"id": "P14550", "text": ["5.  Set R1 fully CCW, zero volts.\n6.  Set S5 to UP on PC130-28.\n7.  Measure collector current.  Ensure S6 is down.\n     What is the measured current?", "5. Set R1 fully CCW, zero volts. 6. Set S5 to UP on PC130-28. 7. Measure collector current. Ensure S6 is down. What is the measured current? ??????????????????????????????????"], "jumps": ["P14540", "P14555", "P14552"]}, {"id": "P14551", "text": [], "jumps": []}, {"id": "P14552", "text": ["Zero volts on the base of Q1 reverse biases the emitter to base\nPN  junction.  Current will not flow.", "Zero volts on the base of Q1 reverse biases the emitter to base PN junction. Current will not flow."], "jumps": []}, {"id": "P14555", "text": [], "jumps": []}, {"id": "P14557", "text": ["Your current measurement should have been approximately 0 mA."], "jumps": ["P14560", "P14550"]}, {"id": "P14560", "text": ["Ic is zero because the base to emitter is reverse biased.\n8.  Set S6 to UP on PC130-28.\n9.  Measure the voltage across RL (TP10 and TP9) and across Q1\n     collector to emitter (TP8 to TP7).", "Ic is zero because the base to emitter is reverse biased. 8. Set S6 to UP on PC130-28. 9. Measure the voltage across RL (TP10 and TP9) and across Q1 collector to emitter (TP8 to TP7). ............................", "There is 0 volts across RL and -12 volts across Q1. A transistor in cutoff acts like an open....cross RL and -12 volts across Q1. A transistor in cutoff acts like an open.............................."], "jumps": ["P14570", "P14550"]}, {"id": "P14570", "text": ["10.  Set S6 to DOWN and measure Ic current.\n11.  Slowly turn R1 CW to increase bias voltage.\n        STOP increasing R1 when current first begins to flow.", "10. Set S6 to DOWN and measure Ic current. 11. Slowly turn R1 CW to increase bias voltage. STOP increasing R1 when current first begins to flow."], "jumps": ["P14580", "P14560", "P14575"]}, {"id": "P14575", "text": ["LEAD PLACEMENT - S6 - DOWN (open)\n                                         R1- Rotate CW", "LEAD PLACEMENT - S6 - DOWN (open) R1- Rotate CW"], "jumps": []}, {"id": "P14580", "text": ["12.  Set S5 to DOWN on PC130-28.\n13.  Measure the voltage on the base of Q1.\n       Type in the measured voltage.", "12. Set S5 to DOWN on PC130-28. 13. Measure the voltage on the base of Q1. Type in the measured voltage."], "jumps": ["P14570", "P14585", "P14582"]}, {"id": "P14581", "text": [], "jumps": []}, {"id": "P14582", "text": ["Current flows in the base when the emitter to base PN junction is\nforward biased, usually less than 0.7 volts.  Be sure to stop\nrotating R1 as soon as current begins to flow.", "Current flows in the base when the emitter to base PN junction is forward biased, usually less than 0.7 volts. Be sure to stop rotating R1 as soon as current begins to flow."], "jumps": []}, {"id": "P14585", "text": ["LEAD PLACEMENT - S5 - DOWN (open)"], "jumps": []}, {"id": "P14587", "text": ["Your current measurement should have been approximately 0.1 to 1.0 V."], "jumps": ["P14580"]}, {"id": "P14590", "text": ["14.  Place S5 to UP on PC130-28. \n15.  Measure collector current, Ic. Ensure S6 is open.", "14. Place S5 to UP on PC130-28. 15. Measure collector current, Ic. Ensure S6 is open."], "jumps": ["P14600", "P14580", "P14595"]}, {"id": "P14595", "text": [], "jumps": []}, {"id": "P14600", "text": ["16.  Turn R1 CW to increase Eb until Ic just stops increasing.\n        Notice that R1 still has room to increase.  Increasing R1\n        beyond a certain point does not increase Ic.  The transistor is\n        in saturation.  Be sure to leave R1 at the position that Ic just\n        stops increasing.", "16. Turn R1 CW to increase Eb until Ic just stops increasing. Notice that R1 still has room to increase. Increasing R1 beyond a certain point does not increase Ic. The transistor is in saturation. Be sure to leave R1 at the position that Ic just stops increasing."], "jumps": ["P14610", "P14590"]}, {"id": "P14610", "text": ["17.  Set S5 and S6 UP.\n18.  Measure the base voltage (TP2).\n       Type in the measured voltage.", "17. Set S5 and S6 UP. 18. Measure the base voltage (TP2). Type in the measured voltage."], "jumps": ["P14600", "P14612"]}, {"id": "P14611", "text": [], "jumps": []}, {"id": "P14612", "text": ["Your voltage measurement is not acceptable.  Be sure S5 and S6 are open.", "Your voltage measurement is not acceptable. Be sure S5 and S6 are open...."], "jumps": []}, {"id": "P14617", "text": ["Your voltage measurement should have been approximately 0.4 to 3 V.", "Your voltage measurement should have been approximately 0.4 to 3 V.."], "jumps": ["P14610"]}, {"id": "P14620", "text": ["Notice the range of bias voltage between cutoff and saturation.  1\nto 2 volts is normal.  Your value may vary slightly depending on\nhow close you set R1 for cutoff and for saturation.", "Notice the range of bias voltage between cutoff and saturation. 1 to 2 volts is normal. Your value may vary slightly depending on how close you set R1 for cutoff and for saturation."], "jumps": ["P14630", "P14610"]}, {"id": "P14630", "text": ["19.  Place S5 and S6 to UP on PC130-28.\n20.  Rotate R1 fully CW or to MAX.\n21.  Measure the voltage across RL (TP10 to TP9) and Q1 (TP8 to\n       TP1).  Notice the voltage drop of RL is 12 volts and Q1 is 0\n       volts.  Transistors in saturation act as shorts.", "19. Place S5 and S6 to UP on PC130-28. 20. Rotate R1 fully CW or to MAX. 21. Measure the voltage across RL (TP10 to TP9) and Q1 (TP8 to TP1). Notice the voltage drop of RL is 12 volts and Q1 is 0 volts. Transistors in saturation act as shorts."], "jumps": ["P14640", "P14620", "P14635"]}, {"id": "P14635", "text": [], "jumps": []}, {"id": "P14640", "text": ["Last, let's use PC130-29 and observe the effect of different load\nresistors on Ic.  Remember, they should have no effect.", "Last, let's use PC130-29 and observe the effect of different load resistors on Ic. Remember, they should have no effect."], "jumps": ["P14650", "P14630"]}, {"id": "P14650", "text": ["1.  Press Enter to Set: PC Power Switch - OFF", "1. Press Enter to Set: PC Power Switch - OFF C2 Power Switch - ONNON ONN"], "jumps": ["P14640"]}, {"id": "P14660", "text": ["2. Carefully remove PC130-28 from the test console. 3. Carefully plug PC130-29 into the test console PC position. 4. Set switches on PC130-29 as follows:", "S1 - UP, Vcc S2, S3, S4 - DOWN (open) S5 - RIGHT, NPNNN S5 - right, NPNopen) S5 - right, NPNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNN"], "jumps": ["P14670", "P14665"]}, {"id": "P14665", "text": ["SWITCH POSITIONS - S1 - UP, Vcc S2, S3, S4 - DOWN (open) S5 - RIGHT, NPN"], "jumps": []}, {"id": "P14670", "text": ["5.  Ensure that NPN transistor (2N3567, 2N3563) is in the socket for Q1 on\n     PC130-29.", "5. Ensure that NPN transistor (2N3567, 2N3563) is in the socket for Q1 on PC130-29.", "Place PNP transistor (2N4248, 2N4249 or NTE159 into the spare socket........istor 2N4248 or 2N4249 (PNP) into the spare socket.N4248 or 2N4249 (PNP) into the spare socket............................", "5. Ensure that NPN transistor (2N3567, 2N3563, MPS918 or NTE123) is in the socket for Q1 on PC130-29."], "jumps": ["P14672", "P14660", "P14215", "PNP"]}, {"id": "P14672", "text": ["6.  Measure the base bias voltage of Q1 on PC130-29 (TP3 to\n     TP1).\n7.  Adjust R3 for a voltage higher than 0.55 volts.  This applies the\n     base bias for the transistor.", "6. Measure the base bias voltage of Q1 on PC130-29 (TP3 to TP1). 7. Adjust R3 for a voltage higher than 0.55 volts. This applies the base bias for the transistor. epending upon the transistor."], "jumps": ["P14680", "P14677"]}, {"id": "P14677", "text": ["LEAD PLACEMENT - Adjust R3 for more than 0.55 volts."], "jumps": []}, {"id": "P14680", "text": ["8. Set the multimeter to measure current. 9. Place S2 UP (closed). 10. Place the current meter in the circuit of R5. 11. Place S2 DOWN (open). 12. Measure current. Remember to place S2 UP before removing the meter from the circuit. R5. 9. Measure the current."], "jumps": ["P14690", "P14672", "P14685"]}, {"id": "P14685", "text": ["LEAD PLACEMENT - Place the ground (black) test lead on TP4 and the input (red) test lead to the bottom of R5."], "jumps": []}, {"id": "P14690", "text": ["What is the measured current for Ic, with R5 as RL?", "What is the measured current for Ic, with R5 as RL? your answer is less than 1 mA, type a \"0.\" before your answer."], "jumps": ["P14680", "P14692"]}, {"id": "P14691", "text": [], "jumps": []}, {"id": "P14692", "text": ["The measurement is not within the expected values.  Check:", "The measurement is not within the expected values. Check:n..............", "1. Eb more than .55 volts. 2. Multimeter across open switch S2, (bottom of R5 to TP4).))))))))))))))))))))))))))))))))))"], "jumps": []}, {"id": "P14697", "text": ["Your current measurement with R5 as RL should have been approximately 0 to 0.3 mA.", "Your current measurement with R5 as RL should have been approximately 0 to 0.3 mA.."], "jumps": ["P14690"]}, {"id": "P14700", "text": ["13. Place S2 and S3 UP (closed). 14. Place the meter in the circuit of R6. 15. Place S3 DOWN (open). What is the measured current for Ic with R6 as RL?"], "jumps": ["P14690", "P14705", "P14702"]}, {"id": "P14701", "text": [], "jumps": []}, {"id": "P14702", "text": ["You should have measured a value for Ic very close to your previous answer of", "You should have measured a value for Ic very close to your previous answer of :::::::::::", "1. Eb more than .55 volts. 2. Multimeter across open switch S3, (bottom of R6 to TP4). (bottom of R6 to TP4))))))"], "jumps": []}, {"id": "P14705", "text": ["LEAD PLACEMENT - Place the meter's input (red) test lead to the bottom of R6 and the com (black) test lead on TP4 to measure the collector current when R6 is the load."], "jumps": []}, {"id": "P14707", "text": ["Your current measurement with R6 as RL should have been approximately 0.4 to 0.6 mA.", "Your current measurement with R6 as RL should have been approximately 0.4 to 0.6 mA..6 mA."], "jumps": ["P14700"]}, {"id": "P14710", "text": ["16. Place S3 and S4 UP (closed). 17. Place the meter in the circuit of R7. 18. Place S4 DOWN (open). What is the measured current for Ic, with R7 as RL? hat is the measured current for Ic, with R7 as RL?"], "jumps": ["P14700", "P14712"]}, {"id": "P14711", "text": [], "jumps": []}, {"id": "P14712", "text": ["You should have measured for Ic very close to your previous answer of", "You should have measured for Ic very close to your previous answer of . Check:", "1. Eb more than 0.55 volts. 2. Multimeter across open switch S4, (bottom of R7 to TP4).))))))))))))))))))))))))))))))))))))"], "jumps": []}, {"id": "P14717", "text": ["Your current measurement with R7as a RL should have been approximately 0.4 to 1.5 mA.", "Your current measurement with R7as a RL should have been approximately 0.4 to 1.5 mA... mA..."], "jumps": ["P14710" let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
