 a basic troubleshooting method is needed."], "jumps": ["P1020", "P1070"]}, {"id": "P1070", "text": ["Once you have measured the output of the circuit and determined it to be incorrect, measure Vcc to ensure correct supply voltage."], "jumps": ["P1020", "P1080"]}, {"id": "P1080", "text": ["If Vcc checks good, the next stage to suspect trouble is in the amplifier since it contains a semiconductor."], "jumps": ["P1020", "P1090"]}, {"id": "P1090", "text": ["To check the transistor in the amplifier, disconnect Vcc and perform continuity checks with an ohmmeter or use a digital meter's diode junction test............."], "jumps": ["P1020", "P1100"]}, {"id": "P10213", "text": ["Page id 879 of Book \"C:\\Dev2000\\Lessons\\93953506.tbk\"", "for Vcc........ce is d, and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor.", "amplifier........ is d, and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "output circuit........, and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "If the output of a Colpitts oscillator is zero, the next recommended troubleshooting step is to check _______"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is 100%. Do you want to _________"], "jumps": []}, {"id": "P1120", "text": ["The same test holds true for the Base-to-Collector junction. Remember, resistance is high one way, or no current flow."], "jumps": ["P1090", "P1130"]}, {"id": "P1130", "text": ["And a low resistance or current flow is the other way. The actual polarity or direction is not important. The fact that you get a distinct different reading with the leads reversed is the key."], "jumps": ["P1140", "P1090"]}, {"id": "P1140", "text": ["If the transistor in the amplifier checks good, the next stage to check is the feedback circuit."], "jumps": ["P1150", "P1090"]}, {"id": "P1150", "text": ["Resistance measurements indicate much about the condition of the feedback circuit."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["For example, anytime you measure zero ohms or infinite ohms across the resonant circuit, it is faulted."], "jumps": ["P1150", "P1170"]}, {"id": "P1170", "text": ["Measuring across each component determines open or shorted inductors and shorted capacitors."], "jumps": ["P1150", "P1180"]}, {"id": "P1180", "text": ["Open capacitors can only be detected by testing with an RCL bridge or replacing the capacitor and rechecking the output."], "jumps": ["P1150", "P1190"]}, {"id": "P1190", "text": ["Correct resistance measurements should be low and reflect the DC resistance of the inductors. The capacitors measure infinite DC resistance."], "jumps": ["P1150", "P1200"]}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1220", "text": ["Measuring the signal on the output side of the capacitor will determine if it is faulted."], "jumps": ["P1215", "P1230"]}, {"id": "P1230", "text": ["Measure the signal on the wiper of the potentiometer to determine if it is faulted. Measure resistance to confirm an open or shorted potentiometer."], "jumps": ["P1215", "P1240"]}, {"id": "P1200", "text": ["C1 open, or L1 or L2 shorted))))", "C1 shorted, or L1 and L2 shortedddC1 open) or", "What are the possible faults in this feedback circuit?....."], "jumps": ["P1150"]}, {"id": "P1201", "text": ["C1 open or L1 and L2 open would not cause a zero ohms reading (short) across the entire feedback circuit. it. ome resistance would be measured.", "C1 open, L1 shorted, or L2 shorted would not cause a zero ohms reading (short) across the entire feedback circuit.."], "jumps": []}, {"id": "P1215", "text": ["Assuming the output circuit is faulted, The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P3040", "text": ["Pick up the PC130-36 card. This card is used to demonstrate typical faults in a Colpitts oscillator."], "jumps": ["P3030"]}, {"id": "P3050", "text": ["Compare the card with the schematic shown."], "jumps": ["P3040"]}, {"id": "P3060", "text": ["Notice that S1 switches between two different inductors in the feedback circuit."], "jumps": ["P3040"]}, {"id": "P3070", "text": ["Two different frequencies are available by switching between the different inductors. Let's start the experiment."], "jumps": ["P3040"]}, {"id": "P3080", "text": ["1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P3040"]}, {"id": "P3090", "text": ["2. Carefully plug PC130-36 into the Test Console PC1 position. 3. Place PC130-36 S1 to the F2 position."], "jumps": ["P3095", "P3080"]}, {"id": "P3095", "text": ["MEASUREMENT SETUP - Place S1 to the F2 position."], "jumps": []}, {"id": "P3100", "text": ["4. Set the voltmeter switch to Positive. 5. Set Positive Supply Voltage to 12. The Test Console's voltmeter should indicate 12 volts. 6. Turn PC1 DC Power switch to ON..."], "jumps": ["P3090"]}, {"id": "P3110", "text": ["7. Set R3 and R4 on PC130-36 to mid position (R3 arrow to right, R4 arrow to left). The experiment is now set up. Let's verify correct operation."], "jumps": ["P3115", "P3100"]}, {"id": "P3115", "text": ["MEASUREMENT SETUP - R3 arrow to the right, R4 arrow to the left."], "jumps": []}, {"id": "P3120", "text": ["8. Calculate the frequency of this Colpitts oscillator using L2. Type in the calculated value. Round to two decimal places."], "jumps": ["P3110", "P3122", "P3125"]}, {"id": "P3121", "text": [], "jumps": []}, {"id": "P3122", "text": ["= 2pSLCL2 2pSLCC", "Your calculated value is not acceptable. Use the formula below and remember to observe proper metric notation."], "jumps": []}, {"id": "P3127", "text": ["Your answer is still inc  ["\u0000\u0000\u0000incorrect1\u0000\u00001\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000[\u0001\u000f\u0000\u0000\u0000 \u0000\u0002\u0000NOrst Choiceett\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000q\u0001\u0010\u0000\u0000\u0000\u0001\u0000\u0001\u0000\u0000\u0000,\u0004\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000z\u0001\u0000\u0000\u00fc\u0000\u00ba\u0004\u0012\u0002\u0087\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u00b1\u0001\u0012\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0014\u0000\u0013\u0000x\u001e\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00c9\u0001\u0013\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00db\u0001\u0014\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000\u00f5\u0001\u0015\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0019\u0002\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00ba\u0004\u0002\u0000\u0000\u0000V\u0006\u0003\u0000\u0000\u0000t\u0007\u0000\u0000\u0000\u0000\u0000\u00003\u0002\u0017\u0000\u0000", "2. Using your oscilloscope, measure Vcc at TP9. Is it a smooth +12 VDC voltage?"], "jumps": ["P3160"]}, {"id": "P3171", "text": [], "jumps": []}, {"id": "P3172", "text": ["The fault inserted by the computer does not affect the Vcc supply voltage."], "jumps": []}, {"id": "P3180", "text": ["Since Vcc is correct, the next troubleshooting step is to check the transistor in the amplifier. 3. Turn PC1 DC Power switch to OFF............."], "jumps": ["P3170"]}, {"id": "P3190", "text": ["4. Measure across the Base-to-Emitter junction of the transistor (TP4 - TP6). Reverse the leads and check it again. Is the Base- to-Emitter junction testing OK?????????????????????????????????????????????????????????????????????????????????????????????????????????"], "jumps": ["P3195", "P3180"]}, {"id": "P3191", "text": [], "jumps": []}, {"id": "P3192", "text": ["Check your resistance measurements across the transistor. You may have to use different ranges, but you should measure high resistance one way and low resistance the other."], "jumps": []}, {"id": "P3195", "text": ["TRANSISTOR CHECK - The Base-to-Emitter junction of Q1 should read high resistance for one lead polarity and low resistance for the other. You may have to use different ranges on the meter."], "jumps": []}, {"id": "P3200", "text": ["Checking the Base-to-Emitter junction of Q1 indicates Q1 is good. Let's check the Base-to Collector junction."], "jumps": ["P3190", "P3210"]}, {"id": "P3210", "text": ["5. Make checks across the Base-to-Collector junction of the transistor (TP4 - TP5). Reverse the leads and check it again. 6. Did the Base - to - Collector junction test OK?arity and low resistance for the other polarity???????????????????????????????"], "jumps": ["P3215", "P3200"]}, {"id": "P3211", "text": [], "jumps": []}, {"id": "P3215", "text": ["TRANSISTOR CHECK - The Base-to-Collector junction of Q1 should read high resistance for one lead polarity and low resistance for the other. You may have to use different ranges on the meter or switch to the diode test function of a digital meter.", "TRANSISTOR CHECK - The Base-to-Collector junction of Q1 should read high resistance for one lead polarity and low resistance for the other. You may have to use different ranges on the meter."], "jumps": []}, {"id": "P3230", "text": ["Your check of the Base-to-Collector junction of Q1 indicates that it is good. The transistor in the amplifier is functioning correctly."], "jumps": ["P3210", "P3240"]}, {"id": "P3240", "text": ["Since the transistor in the amplifier checks good, the next troubleshooting step is to check the feedback circuit."], "jumps": ["P3230", "P3250"]}, {"id": "P3250", "text": ["A resistance check of this feedback circuit should indicate the DC resistance of the inductor since the capacitors appear as an open."], "jumps": ["P3240", "P3260"]}, {"id": "P3260", "text": ["For the 10 mH inductor in this circuit, L2 has a DC resistance of about 75 ohms."], "jumps": ["P3250", "P3270"]}, {"id": "P3270", "text": ["\u0000\u0000\u0000incorrect1\u0000\u00001\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000[\u0001\u000f\u0000\u0000\u0000 \u0000\u0002\u0000NOrst Choiceett\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000q\u0001\u0010\u0000\u0000\u0000\u0001\u0000\u0001\u0000\u0000\u0000,\u0004\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000z\u0001\u0000\u0000\u00fc\u0000\u00ba\u0004\u0012\u0002\u0087\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u00b1\u0001\u0012\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0014\u0000\u0013\u0000x\u001e\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00c9\u0001\u0013\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00db\u0001\u0014\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000\u00f5\u0001\u0015\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0019\u0002\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00ba\u0004\u0002\u0000\u0000\u0000V\u0006\u0003\u0000\u0000\u0000t\u0007\u0000\u0000\u0000\u0000\u0000\u00003\u0002\u0017\u0000\u0000", "1. Measure the resistance of the feedback circuit from TP2-TP3. Does this resistance indicate the feedback circuit is faulted?"], "jumps": ["P3250"]}, {"id": "P3271", "text": [], "jumps": []}, {"id": "P3272", "text": ["The fault in the Colpitts oscillator is in t let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
