rcuit technology because building it is easy and the gate does not draw current like the base of a bipolar transistor."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["The MOSFET has many uses in low-power amplifiers and digital circuits, like microprocessors.  As MOSFET devices are developed smaller and smaller, their use in many circuits will surpass other more expensive devices, like BJTs.", "The MOSFET has many uses in low-power amplifiers and digital circuits, like microprocessors. As MOSFET devices are developed smaller and smaller, their use in many circuits will surpass other more expensive devices, like BJTs...", "Digital Inverter Circuit CMOS", "MOSFET AmplifierSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSS"], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["High voltages no matter the current can still damage MOSFETs.  That is why MOSFETs are considered electrostatic sensitive devices.", "High voltages no matter the current can still damage MOSFETs. That is why MOSFETs are considered electrostatic sensitive devices.", "CAUTION! OBSERVE PRECAUTIONS FOR HANDLING ELECTROSTATIC SENSITIVE DEVICES............"], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["Let's begin the lesson on MOSFETs.TITLE..................................."], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": ["P440"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["A MOSFET, as shown in the cross sectional view below consists of a source, gate, drain, an insulating layer, N doped regions, and a P doped region (the substrate).  Let's look at some of the different aspects of MOSFET devices.", "A MOSFET, as shown in the cross sectional view below consists of a source, gate, drain, an insulating layer, N doped regions, and a P doped region (the substrate). Let's look at some of the different aspects of MOSFET devices.."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["The gate of the MOSFET is not connected to any other part of the device.  So the input resistance to a MOSFET is very high.  The operation of the gate is similar to the operation of a capacitor.", "The gate of the MOSFET is not connected to any other part of the device. So the input resistance to a MOSFET is very high. The operation of the gate is similar to the operation of a capacitor."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Here the construction of both a N-channel and P-channel Enhancement-mode MOSFET is shown.  The type of channel a MOSFET uses, diffused or induced, is dictated by the source and drain doping types.  The channel is created by the voltage conditions of the gate.", "Here the construction of both a N-channel and P-channel Enhancement-mode MOSFET is shown. The type of channel a MOSFET uses, diffused or induced, is dictated by the source and drain doping types. The channel is created by the voltage conditions of the gate.te..of the gate..."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Look at the NMOS (N-Channel MOSFET) device, both the source and the drain are identical; this is how it should be in most MOSFET devices.  They are named differently for identification purposes.", "Look at the NMOS (N-Channel MOSFET) device, both the source and the drain are identical; this is how it should be in most MOSFET devices. They are named differently for identification purposes.."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["Above diffused N+ regions of the source and drain for the NMOS we have the oxide layer."], "jumps": ["P1070", "P1040"]}, {"id": "P1062", "text": ["Above diffused N+ regions of the source and drain for the NMOS we have the oxide layer."], "jumps": ["P1070", "P1040"]}, {"id": "P1065", "text": ["DIFFUSED - When the molecules of two or more substances are gradually mixed during thermal motion........................."], "jumps": []}, {"id": "P1070", "text": ["The oxide layer is formed when the wafer is heated in normal air.  Oxygen from the air and the silicon of the wafer combine to form a non-conductive material called silicon dioxide (SiO   ), also  known as the insulating layer.", "The oxide layer is formed when the wafer is heated in normal air. Oxygen from the air and the silicon of the wafer combine to form a non-conductive material called silicon dioxide (SiO ), also known as the insulating layer.."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["Portions of silicon dioxide are etched away with strong chemicals."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["Metal is deposited on top of the wafer."], "jumps": ["P1100", "P1070"]}, {"id": "P1100", "text": ["During another etching process masked areas prevent the metal from being removed directly over the source and drain diffused layer regions and the portion that forms the gate."], "jumps": ["P1110", "P1070"]}, {"id": "P1110", "text": ["The gate DOES NOT touch any other metal.  In many integrated circuits, the gate is actually poly silicon, otherwise known as poly, instead of metal.", "The gate DOES NOT touch any other metal. In many integrated circuits, the gate is actually poly silicon, otherwise known as poly, instead of metal. ere are various reasons why this is done, however, they are not important in this lesson..."], "jumps": ["P1120", "P1070"]}, {"id": "P1120", "text": ["What separates the metal gate electrode from the semiconductor substrate material of a MOSFET?"], "jumps": ["P1070"]}, {"id": "P1121", "text": [], "jumps": []}, {"id": "P1122", "text": ["The drain and source are separated from the gate electrode.  The drain and source do not separate the gate from the substrate material.", "The drain and source are separated from the gate electrode. The drain and source do not separate the gate from the substrate material..."], "jumps": []}, {"id": "P1130", "text": ["Let's look at the operation of the Enhancement-mode NMOS.  A voltage is applied to the gate that is large enough to overcome the threshold voltage of the device.  For most MOSFETs, this is around 1 volt.", "Let's look at the operation of the Enhancement-mode NMOS. A voltage is applied to the gate that is large enough to overcome the threshold voltage of the device. For most MOSFETs, this is around 1 volt.lt.around 1 volt."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["The voltage applied to the gate in this example is positive with respect to the source.  This strong positive voltage causes an attraction of negative charges in the channel between the source and the drain.", "The voltage applied to the gate in this example is positive with respect to the source. This strong positive voltage causes an attraction of negative charges in the channel between the source and the drain..in..."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["The threshold voltage is the point where the voltage applied to the gate causes the same number of positive and negative charges in the channel region.  Remember, with no voltage the channel is P-type which has an abundance of positive ions.", "The threshold voltage is the point where the voltage applied to the gate causes the same number of positive and negative charges in the channel region. Remember, with no voltage the channel is P-type which has an abundance of positive ions..."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["As we increase the gate voltage above the threshold, a phenomenon called inversion occurs.  Inversion occurs when the charge on the gate causes more negative ions in the channel than positive ions.  This makes the channel essentially N-type during this condition.", "As we increase the gate voltage above the threshold, a phenomenon called inversion occurs. Inversion occurs when the charge on the gate causes more negative ions in the channel than positive ions. This makes the channel essentially N-type during this condition."], "jumps": ["P1170", "P1130"]}, {"id": "P1170", "text": ["The size of the channel depends on the voltage applied to the gate.  Remember the gate draws NO current, only a voltage.  This is one advantage of using a MOSFET.", "The size of the channel depends on the voltage applied to the gate. Remember the gate draws NO current, only a voltage. This is one advantage of using a MOSFET."], "jumps": ["P1180", "P1130"]}, {"id": "P1180", "text": ["Since the channel is now the same material (N+) as the source and drain, current can flow from the source to the drain.  This current is known as the drain current and is dependent on the size of the channel.", "Since the channel is now the same material (N+) as the source and drain, current can flow from the source to the drain. This current is known as the drain current and is dependent on the size of the channel.."], "jumps": ["P1190", "P1130"]}, {"id": "P1190", "text": ["It is important to realize that the drain current and the source current are the same.  Since there are no other paths for current,  current in has to equal current out as stated in Kirchhoff's current law.", "It is important to realize that the drain current and the source current are the same. Since there are no other paths for current, current in has to equal current out as stated in Kirchhoff's current law.. current law."], "jumps": ["P1200", "P1130"]}, {"id": "P1200", "text": ["In a sense, a MOSFET is like a water spigot.  The gate is the handle, the source is the water supply and the drain is the water outlet.  Varying the handle of the spigot allows different amounts of  water or current to pass through the spigot.", "In a sense, a MOSFET is like a water spigot. The gate is the handle, the source is the water supply and the drain is the water outlet. Varying the handle of the spigot allows different amounts of water or current to pass through the spigot........"], "jumps": ["P1210", "P1130"]}, {"id": "P1210", "text": ["PMOSFETs operate somewhat the same as NMOSFETs.  The difference is the layout and the voltages used to make them operate.", "PMOSFETs operate somewhat the same as NMOSFE pplied surpasses the             threshold voltage.", "3. The Enhancement-mode MOSFET acts like a normally open switch. Current does not flow with zero voltage applied. Current does flow when the voltage applied surpasses the threshold voltage......."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  The Depletion-mode MOSFET acts like a normally closed                switch.  Current flows with zero voltage applied, and it                     reduces to zero current as we reach the pinch-off voltage.              The Depletion-mode MOSFET works the opposite of the                  Enhancement-mode MOSFET.", "4. The Depletion-mode MOSFET acts like a normally closed switch. Current flows with zero voltage applied, and it reduces to zero current as we reach the pinch-off voltage. The Depletion-mode MOSFET works the opposite of the Enhancement-mode MOSFET......"], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  The MOSFET device has several advantages over other                   devices that provide the same features.  The main                              disadvantage is the sensitivity of the MOSFET to Electrostatic       Discharge (ESD), which can render them inoperable.", "5. The MOSFET device has several advantages over other devices that provide the same features. The main disadvantage is the sensitivity of the MOSFET to Electrostatic Discharge (ESD), which can render them inoperable.gh Input Impedance. 3. High Output Gain. 4. Easy to Manufacture..."], "jumps": ["P1999", "P1950"]}, {"id": "P1999", "text": ["You have completed the Summary.  \nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1960"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["In the first section we looked at the basic operation of different types of MOSFET devices.  In this section we will look at some circuits that use MOSFET devices.", "In the first section we looked at the basic operation of different types of MOSFET devices. In this section we will look at some circuits that use MOSFET devices."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["MOSFET devices are used for the same applications as transistors in other circuits, like the Bipolar Junction Transistor (BJT).", "Amplifiers Active Loads Digital Circuits"], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["The most common applications are amplifiers and digital logic circuits.  Other applications include current mirrors and active loads.  We will look at a few common basic circuits utilizing MOSFETs.", "The most common applications are amplifiers and digital logic circuits. Other applications include current mirrors and active loads. We will look at a few common basic circuits utilizing MOSFETs..."], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["Compared here are common source MOSFET and a common emitter BJT amplifier.  Look at the graphs for both circuits.  They perform similar functions.", "Compared here are common source MOSFET and a common emitter BJT amplifier. Look at the graphs for both circuits. They perform similar functions."], "jumps": ["P2060", "P2030"]}, {"id": "P2060", "text": ["Although the curves on the graphs are not identical, the general shapes are the same.  Also notice that the circuits are identical except for the transistors themselves.", "Although the curves on the graphs are not identical, the general shapes are the same. Also notice that the circuits are identical except for the transistors themselves."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["While the input impedance, output impedance and gain are different for both circuits, the operation is the same.  Using your knowledge of a common emitter BJT configuration can predict the operation of the common source MOSFET configuration.", "While the input impedance, output impedance and gain are different for both circuits, the operation is the same. Using your knowledge of a common emitter BJT configuration can predict the operation of the common source MOSFET configuration..."], "jumps": ["P2080", "P2050"]}, {"id": "P2080", "text": ["Remember. The common emitter and common source amplifiers are used to provide a relatively high voltage gain."], "jumps": ["P2090", "P2050"]}, {"id": "P2090", "text": ["This MOSFET circuit is of a common gate configuration.  Again, notice the common base BJT equivalent circuit has been given.  These circuits perform similar functions.", "This MOSFET circuit is of a common gate configuration. Again, notice the common base BJT equivalent circuit has been given. These circuits perform similar functions."], "jumps": ["P2100", "P2050"]}, {"id": "P2100", "text": ["All of the characteristics for the  common base configuration can be applied to the common gate configuration.  Knowing this information makes analyzing circuits with both BJT and MOSFET stages much easier.", "All of the characteristics for the common base configuration can be applied to the common gate configuration. Knowing this information makes analyzing circuits with both BJT and MOSFET stages much easier.."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["Remember. The common base and common gate amplifiers are used for applications requiring low input impedance, high output impedance, and a current gain of less than one."], "jumps": ["P2120", "P2090"]}, {"id": "P2120", "text": ["The last type of amplifier we are going to look at is the common drain MOSFET amplifier, also known as a Source Follower.  Again, the BJT equivalent is shown, the common collector or emitter follower configuration.", "The last type of amplifier we are going to look at is the common drain MOSFET amplifier, also known as a Source Follower. Again, the BJT equivalent is shown, the common collector or emitter follower configuration..."], "jumps": ["P2130", "P2090"]}, {"id": "P2130", "text": ["These amplifiers are used as an impedance transformer.  They have high input impedance, low output impedance and a voltage gain that is close to one.  This means no gain, signal in equals signal out.", "These amplifiers are used as an impedance transformer. They have high input impedance, low output impedance and a voltage gain that is close to one. This means no gain, signal in equals signal out..."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["MOSFETs work much the same as bipolar transistors.", "MOSFETs work much the same as bipolar transistors.parently do, in fact, work like other transistors you have learned about previously.."], "jumps": ["P2150", "P2120"]}, {"id": "P2150", "text": ["Although BJTs and MOSFETs are similar circuits, both have characteristics that make them suitable for various circuit designs.", "Although BJTs and MOSFETs are similar circuits, both have characteristics that make them suitable for various circuit designs.designs.designs."], "jumps": ["P2160", "P2120"]}, {"id": "P2160", "text": ["What type of amplifier circuit is shown?", "What type of amplifier circuit is shown?..................."], "jumps": ["P2120"]}, {"id": "P2161", "text": [], "jumps": []}, {"id": "P2162", "text": ["Notice that the common lead to the input and the output voltage is the gate."], "jumps": []}, {"id": "P2170", "text": ["What type of amplifier circuit is shown?", "What type of amplifier circuit is shown?..................."], "jumps": ["P2160"]}, {"id": "P2171", "text": [], "jumps": []}, {"id": "P2172", "text": ["The common-collector is also called an emitter-follower. The emitter's voltage follows the input voltage.", "The common-collector is also called an emitter-follower. The emitter's voltage follows the input voltage........................................................................................."], "jumps": []}, {"id": "P2180", "text": ["While MOSFET devices are commonly used in analog applications, because of their inherent low-power consumption, they are particularly well-suited for digital electronics.", "While MOSFET devices are commonly used in analog applications, because of their inherent low-power consumption, they are particularly well-suited for digital electronics...........................................................................", "Digital Inverter Circuit CMOS", "MOSFET AmplifierSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSS"], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["Just like a BJT, a MOSFET can be used as a switch turned on by the voltage on the gate.  Shown below are the switching operations of both an NMOS and PMOS transistor for high and low inputs.", "Just like a BJT, a MOSFET can be used as a switch turned on by the voltage on the gate. Shown below are the switching operations of both an NMOS and PMOS transistor for high and low inputs..."], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["Both the PMOS and NMOS circuits are inverters.  Inverters change low voltage levels to high or high voltage levels to low.  The resistors in both circuits dissipate power and lower the voltage.", "Both the PMOS and NMOS circuits are inverters. Inverters change low voltage levels to high or high voltage levels to low. The resistors in both circuits dissipate power and lower the voltage...."], "jumps": ["P2210", "P2180"]}, {"id": "P2210", "text": ["Modern digital circuits use both the NMOS and PMOS transistors in pairs, known as CMOS or complementary MOSFETS.  With this type of circuit either the PMOS or the NMOS is on at a particular time.", "Modern digital circuits use both the NMOS and PMOS transistors in pairs, known as CMOS or complementary MOSFETS. With this type of circuit either the PMOS or the NMOS is on at a particular time...", "Digital Inverter Circuit CMOS"], "jumps": ["P2220", "P2180"]}, {"id": "P2220", "text": ["As the input switches from high to low, VDD or ground is presented at the output. This circuit does not need a resistor to dissipate power or lower voltage.  This makes CMOS logic circuits very popular in microprocessors.", "As the input switches from high to low, VDD or ground is presented at the output. This circuit does not need a resistor to dissipate power or lower voltage. This makes CMOS logic circuits very popular in microprocessors..."], "jumps": ["P2240", "P2210"]}, {"id": "P2240", "text": ["Below are a CMOS and TTL NAND gate circuit.  Notice the similarities of the two devices.  The diodes in both circuits are used for transistor protection.", "Below are a CMOS and TTL NAND gate circuit. Notice the similarities of the two devices. The diodes in both circuits are used for transistor protection. Go back to the previous page to identify the NAND gate section...", "CMOS NAND GateSSSSSSSSSSSSSSSSSSSSSSSSSSSSSS", "TTL NAND GateeSSSSSSSSSSSSSSSSSSSSSSSSSSSSSS"], "jumps": ["P2250", "P2210"]}, {"id": "P2250", "text": ["In this lesson some of the different applicatioins of MOSFET devices have been shown.  The MOSFET is a very popular device and is increasingly being used in more applications every day.", "CMOS NAND GateSSSSSSSSSSSSSSSSSSSSSSSSSSSSSS", "In this lesson some of the different applicatioins of MOSFET devices have been shown. The MOSFET is a very popular device and is increasingly being used in more applications every day..."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["Becoming more familiar with the use of MOSFETs will help in the understanding of inherent differences between them and other amplifier configurations. Mathematical analysis was not introduced to keep from masking the simplicity of their design.", "Becoming more familiar with the use of MOSFETs will help in the understanding of inherent differences between them and other amplifier configurations. Mathematical analysis was not introduced to keep from masking the simplicity of their design..."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["As a technician, understanding the circuit makes troubleshooting easier without performing complex calculations."], "jumps": ["P2280", "P2250"]}, {"id": "P2280", "text": ["Which type of inverter does not use a resistor to dissipate power or lower voltage?"], "jumps": ["P2250"]}, {"id": "P2281", "text": [], "jumps": []}, {"id": "P2282", "text": ["Both the NMOS and PMOS require resistors to dissipate power and lower voltage."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on MOSFET DEVICE APPLICATIONS."], "jumps": ["P2001", "P2280"]}, {"id": "P2920", "text": ["1.  MOSFET amplifiers work similarly to other transistor device           amplifiers.  The BJT common emitter configuration is                        compared with the MOSFET common source configuration.", "1. MOSFET amplifiers work similarly to other transistor device amplifiers. The BJT common emitter configuration is compared with the MOSFET common source configuration.."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2.  These common gate and common base amplifiers circuits               operate similarly with different input impedance, output                   impedance and gain values.", "2. These common gate and common base amplifiers circuits operate similarly with different input impedance, output impedance and gain values."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3.  The common collector (emitter follower) and the common               drain (source follower) amplifier configurations also are                   similar in operation.", "3. The common collector (emitter follower) and the common drain (source follower) amplifier configurations also are similar in operation........"], "jumps": ["P2950", "P2930"]}, {"id": "P2950", "text": ["4.  CMOS digital circuits are commonly used because they can            provide a range of high and low output voltage levels.", "4. CMOS digital circuits are commonly used because they can provide a range of high and low output voltage levels.", "Digital Inverter Circuit CMOS"], "jumps": ["P2999", "P2940"]}, {"id" let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
