ur instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.."], "jumps": ["P1001", "P1995"]}, {"id": "P1995", "text": ["9.  A solenoid is an electromagnetic switch with a movable core.        The core is called a plunger.", "9. A solenoid is an electromagnetic switch with a movable core. The core is called a plunger."], "jumps": ["P1999", "P1990"]}, {"id": "P1990", "text": ["8.   A thermal time delay relay uses a bimetallic element for the             common terminal.", "8. A thermal time delay relay uses a bimetallic element for the common terminal."], "jumps": ["P1995", "P1980"]}, {"id": "P1980", "text": ["7.  A latched relay uses one set of contacts to keep the relay                energized after the input voltage has been removed.", "7. A latched relay uses one set of contacts to keep the relay energized after the input voltage has been removed."], "jumps": ["P1990", "P1970"]}, {"id": "P1970", "text": ["6.  The schematic symbol for a relay is as shown and the                       reference designator is K.", "6. The schematic symbol for a relay is as shown and the reference designator is K."], "jumps": ["P1980", "P1960"]}, {"id": "P1960", "text": ["5.   A double pole relay uses a clapper and push rod.", "5. A double pole relay uses a clapper and push rod......."], "jumps": ["P1970", "P1950"]}, {"id": "P1950", "text": ["4.  Relays are constructed using a magnetic core, armature,                contacts, and spring.", "4. Relays are constructed using a magnetic core, armature, contacts, and spring."], "jumps": ["P1960", "P1940"]}, {"id": "P1941", "text": [], "jumps": ["P1950", "P1940"]}, {"id": "P1940", "text": ["3.  A CONTROL RELAY is a switch that directs signal flow.  It is            similar to a single pole double throw (SPDT) switch.", "3. A CONTROL RELAY is a switch that directs signal flow. It is similar to a single pole double throw (SPDT) switch."], "jumps": ["P1941", "P1930"]}, {"id": "P1932", "text": [], "jumps": ["P1940", "P1930"]}, {"id": "P1931", "text": [], "jumps": ["P1932", "P1930"]}, {"id": "P1930", "text": ["2.  A POWER RELAY is a switch that applies power to a circuit or       an electronic system. It is similar to a single pole single throw        (SPST) switch.", "2. A POWER RELAY is a switch that applies power to a circuit or an electronic system. It is similar to a single pole single throw (SPST) switch."], "jumps": ["P1931", "P1920"]}, {"id": "P1920", "text": ["1.  Relays are magnetically controlled switches.", "1. Relays are magnetically controlled switches.ne here....", "Relaycal Appearance of a Relayyyyyyyyyyyyy"], "jumps": ["P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on RELAYS.", "Relays and solenoids are both electromagnetic switches.", "This completes the information on RELAYS.VE 1 TITLE........", "Relays and solenoids are both electromagnetic switches....."], "jumps": ["P1001", "P1710"]}, {"id": "P1712", "text": ["A relay does have a core but, it does not move. It's core is stationary."], "jumps": []}, {"id": "P1711", "text": [], "jumps": []}, {"id": "P1710", "text": ["What is the main difference between a relay and a solenoid?", "If the core is placed near the coil, and the coil is energized, the core will try to center itself in the magnetic field that is created by the current carrying coil.", "The spring is used to return the plunger to it's original position when the magnetic field is removed by de-energizing the coil."], "jumps": ["P1690", "P1710", "P1670"]}, {"id": "P1680", "text": ["The plungers motion is due to the principles of magnetism. It is made of soft iron and reacts to the current passing through the coil when energized."], "jumps": ["P1670"]}, {"id": "P1670", "text": ["The movable metal core is called a plunger. Some plungers have electrical conductors with contacts attached to them and others have mechanical linkages attached."], "jumps": ["P1680", "P1630"]}, {"id": "P1660", "text": ["In a solenoid, when an energize voltage is applied to the coil around the core, the core moves."], "jumps": ["P1670", "P1630"]}, {"id": "P1650", "text": ["When an energize voltage is applied to the surrounding coil of a  relay's core, the core does not move, the armature does.", "When an energize voltage is applied to the surrounding coil of a relay's core, the core does not move, the armature does."], "jumps": ["P1660", "P1630"]}, {"id": "P1640", "text": ["The difference between a relay and solenoid is that, the core of a solenoid is movable and a relays core is stationary.", "Solenoids are closely related to relays, they are also an electromagnetic switch. Solenoids are used to make electrical connections and perform mechanical functions."], "jumps": ["P1650", "P1630", "P1640", "P1620"]}, {"id": "P1623", "text": ["The time delay relay could have latching but, it's main purpose is to delay the armature operation."], "jumps": []}, {"id": "P1622", "text": ["The basic relay has no means of keeping the relay energized after the input power has been removed."], "jumps": []}, {"id": "P1621", "text": [], "jumps": []}, {"id": "P1620", "text": ["What type of relay stays energized after removing the input voltage?"], "jumps": ["P1610"]}, {"id": "P1612", "text": ["Schematics do not normally show relays in the energized condition."], "jumps": []}, {"id": "P1611", "text": [], "jumps": []}, {"id": "P1610", "text": ["Relays are normally shown in what condition in schematics?", "Relays are normally shown in what condition in schematics?."], "jumps": ["P1600"]}, {"id": "P1603", "text": ["The core with one winding is a schematic symbol for the magnetic coil of a relay."], "jumps": []}, {"id": "P1602", "text": ["The zig-zag line is a schematic symbol for the magnetic coil of a relay."], "jumps": []}, {"id": "P1601", "text": [], "jumps": []}, {"id": "P1600", "text": ["Which of the following is not a schematic symbol for the magnetic core in a relay?"], "jumps": ["P1530"]}, {"id": "P1590", "text": ["Time delay relays are also used to POWER UP electronic systems. High voltage power is not applied until after the system has been turned ON for a brief amount of time."], "jumps": ["P1600", "P1530"]}, {"id": "P1580", "text": ["Time delays of 30 seconds to 90 seconds are common."], "jumps": ["P1590", "P1530"]}, {"id": "P1570", "text": ["When the heat is applied, one side of the element expands more rapidly than the other, causing the element to bend."], "jumps": ["P1580", "P1530"]}, {"id": "P1560", "text": ["The bimetallic element is made by layering two metals of different thermal rates."], "jumps": ["P1570", "P1530"]}, {"id": "P1550", "text": ["The heater raises the temperature of the bimetallic element."], "jumps": ["P1560", "P1530"]}, {"id": "P1540", "text": ["The energize voltage is applied to the heater."], "jumps": ["P1550", "P1530"]}, {"id": "P1530", "text": ["For example a thermal time delay relay operates by using a bimetallic element, common terminal and a heater."], "jumps": ["P1540", "P1525"]}, {"id": "P1525", "text": ["Time delay relays operate after a specific time delay from when the energize voltage has been applied."], "jumps": ["P1530", "P1480"]}, {"id": "P1520", "text": ["Latch relays are used to POWER UP electronic  systems.  Power is only applied in a sequence, and once the relay is energized, it stays energized until the latch voltage is removed.", "Latch relays are used to POWER UP electronic systems. Power is only applied in a sequence, and once the relay is energized, it stays energized until the latch voltage is removed."], "jumps": ["P1525", "P1480"]}, {"id": "P1510", "text": ["Removing the input voltage has no effect. The +12 V latch voltage from the second set of contacts keeps the relay energized.", "Removing the input voltage has no effect. The +12 V latch voltage from the second set of contacts keeps the relay energized.)"], "jumps": ["P1520", "P1480"]}, {"id": "P1500", "text": ["Applying an input voltage energizes the relay."], "jumps": ["P1510", "P1480"]}, {"id": "P1490", "text": ["As shown, the relay is de-energized and the common terminals are normally open."], "jumps": ["P1500", "P1480"]}, {"id": "P1480", "text": ["The latched relay uses one set of contacts to keep the relay energized, even after the energize voltage has been removed."], "jumps": ["P1490", "P1470"]}, {"id": "P1470", "text": ["In addition to the basic relay, there are two special types of  relays.", "In addition to the basic relay, there are two special types of relays."], "jumps": ["P1480", "P1460"]}, {"id": "P1460", "text": ["This is the schematic symbol for a three pole relay.", "This is the schematic symbol for a three pole relay........"], "jumps": ["P1470", "P1400"]}, {"id": "P1450", "text": ["This is the normally closed contact. Schematics show relays in the de-energized condition, this is when the common terminal makes contact with the normally closed contact."], "jumps": ["P1460", "P1400"]}, {"id": "P1440", "text": ["Notice the armature of the common terminal is touching one contact."], "jumps": ["P1450", "P1400"]}, {"id": "P1430", "text": ["The reference designator for relays is K."], "jumps": ["P1440", "P1400"]}, {"id": "P1420", "text": ["The contacts appear similar to the symbols used for switches."], "jumps": ["P1430", "P1400"]}, {"id": "P1410", "text": ["The magnetic core and coil are indicated by a zig-zag line or a core with one loop of wire."], "jumps": ["P1420", "P1400"]}, {"id": "P1400", "text": ["The schematic symbol for a relay is as shown.", "When the core is energized, the clapper moves to the right pushing the rod UP.", "The spring forces the clapper to the left. This pulls the push rod DOWN.", "The schematic symbol for a relay is as shown..............."], "jumps": ["P1410", "P1390"]}, {"id": "P1391", "text": [], "jumps": []}, {"id": "P1390", "text": ["How are the armatures in a double pole relay moved?", "How are the armatures in a double pole relay moved?........", "The push rod moving UP by the action of the spring.", "The push rod moving DOWN by the energizing of the magnetic coil.", "The push rod moving UP by the energizing of the magnetic coil."], "jumps": ["P1380"]}, {"id": "P1383", "text": ["The armature is the conductor between the common terminal and contacts C1 and C2."], "jumps": []}, {"id": "P1382", "text": ["C2 is the normally open contact. A double throw relay is changed to a single throw by leaving the normally closed contact open."], "jumps": []}, {"id": "P1381", "text": [], "jumps": []}, {"id": "P1380", "text": ["How is this relay used as a single pole, single throw switch?"], "jumps": ["P1370"]}, {"id": "P1373", "text": ["The pivot allows a change in direction of an applied force (by either the spring or the magnetic coil.)"], "jumps": []}, {"id": "P1372", "text": ["The armature is the conductor from the common terminal, it does not force the connection from the common terminal to the normal closed terminal."], "jumps": []}, {"id": "P1371", "text": [], "jumps": []}, {"id": "P1370", "text": ["Which part of a relay ensures, with no input power applied, that the common terminal connects to the normally closed contacts?"], "jumps": ["P1310"]}, {"id": "P1360", "text": ["When the input voltage is removed, the relay returns to its original position by action of the spring."], "jumps": ["P1370", "P1310"]}, {"id": "P1350", "text": ["The normally open contacts C2A and C2B are connected to the common terminals."], "jumps": ["P1360", "P1310"]}, {"id": "P1340", "text": ["When the relay is energized, the magnetic force overcomes the spring pressure and moves the clapper portion below the pivot pivot to the right, this moves the push rod and it's contacts       up.", "When the relay is energized, the magnetic force overcomes the spring pressure and moves the clapper portion below the pivot pivot to the right, this moves the push rod and it's contacts up..."], "jumps": ["P1310"]}, {"id": "P1330", "text": ["Notice that each set of contacts has a a separate common terminal and that the push rod is insulated from the contact sets."], "jumps": ["P1340", "P1310"]}, {"id": "P1320", "text": ["When de-energized, the clapper portion below the pivot point is pulled to the left by the spring, this causes the push rod to move DOWN. The push rod contacts are touching the normally closed contacts C1A and C1B.", "When de-energized, the clapper portion below the pivot point is pulled to the left by the spring, this causes the push rod to move DOWN. The push rod contacts are touching the normally closed contacts C1A and C1B..."], "jumps": ["P1330", "P1310"]}, {"id": "P1310", "text": ["A multi-pole relay operates the same but the armature is replaced by a clapper and push rod."], "jumps": ["P1320", "P1240"]}, {"id": "P1300", "text": ["Removing the small AC or DC input voltage de-magnetizes the core allowing the force of the spring to return the relay to its original position."], "jumps": ["P1310", "P1240"]}, {"id": "P1290", "text": ["If the relay is used as a control relay, C1 and C2 are connected to circuits. When the relay is energized the signal is present at circuit 2 connection, the relay is acting as a SPDT switch."], "jumps": ["P1300", "P1240"]}, {"id": "P1280", "text": ["If the relay is used as a power relay, C2 contact is connected to the circuit or equipment. The relay is acting as a SPST closed switch."], "jumps": ["P1290", "P1240"]}, {"id": "P1270", "text": ["The armature makes contact with C2."], "jumps": ["P1280", "P1240"]}, {"id": "P1260", "text": ["The magnetic field attracts the armature, overcoming the force of the spring."], "jumps": ["P1270", "P1240"]}, {"id": "P1250", "text": ["Current flowing through the windings around the core develop a magnetic field."], "jumps": ["P1260", "P1240"]}, {"id": "P1240", "text": ["Applying a small DC or AC voltage to the coil of the magnetic core energizes the relay."], "jumps": ["P1250", "P1190"]}, {"id": "P1230", "text": ["If the relay is used as a control relay, C1 contact is connected to a circuit. The relay is acting as a SPDT switch."], "jumps": ["P1240", "P1190"]}, {"id": "P1220", "text": ["If the relay is used as a power relay, C1 contact is left open, no circuit connection. The relay is acting as a SPST open switch."], "jumps": ["P1230", "P1190"]}, {"id": "P1210", "text": ["This makes a current path from the common terminal to C1."], "jumps": ["P1220", "P1190"]}, {"id": "P1200", "text": ["The spring applies pressure to the armature, forcing the armature to make contact with C1."], "jumps": ["P1210", "P1190"]}, {"id": "P1190", "text": ["In general, a relay consists of a magnetic coil, contacts, armature, and spring."], "jumps": ["P1200", "P1170"]}, {"id": "P1180", "text": ["The only difference is that power relays are larger, allowing them to handle higher levels of current."], "jumps": ["P1190", "P1170"]}, {"id": "P1170", "text": ["The construction and operation of power and control relays are the same."], "jumps": ["P1180", "P1160"]}, {"id": "P1162", "text": ["A control relay directs signal flow, they are not used to apply large amounts of power to circuits or electronic systems."], "jumps": []}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1160", "text": ["Which type of relay would be used to energize a large TV transmitter station?"], "jumps": ["P1150"]}, {"id": "P1153", "text": ["Poles describe how many current paths or circuits a switch can open or close.  Relays normally have from one to four poles.", "Poles describe how many current paths or circuits a switch can open or close. Relays normally have from one to four poles."], "jumps": []}, {"id": "P1152", "text": ["Throws describe how many stationary contacts a switch has. Relays normally use two throws."], "jumps": []}, {"id": "P1151", "text": [], "jumps": []}, {"id": "P1150", "text": ["What are the two types of relays?", "What are the two types of relays?.........................."], "jumps": ["P1130"]}, {"id": "P1142", "text": ["This control relay will direct 1500 Hz to the circuit when de-energized and 3000 Hz when energized."], "jumps": ["P1150", "P1130"]}, {"id": "P1141", "text": ["This power relay, for example, will not apply power to the equipment when de-energized and will apply power when energized."], "jumps": ["P1142", "P1130"]}, {"id": "P1140", "text": ["Most relays use double throw operation but, single throw operation can be achieved by leaving one contact open."], "jumps": ["P1141", "P1130"]}, {"id": "P1130", "text": ["Relays that have several sets of contacts are commonly used."], "jumps": ["P1140", "P1090"]}, {"id": "P1120", "text": ["The control relay directs signals."], "jumps": ["P1130", "P1090"]}, {"id": "P1110", "text": ["With a small energizing voltage applied, the relay is energized and the signals are directed to the normally open contacts."], "jumps": ["P1120", "P1090"]}, {"id": "P1100", "text": ["Without an applied voltage to the magnetic coil, the relay is de-energized and the signal is directed to the normally closed contacts."], "jumps": ["P1110", "P1090"]}, {"id": "P1095", "text": ["SINGLE POLE DOUBLE THROW SWITCH (SPDT) - A single pole switch is one that opens or closes one circuit or current path. A double throw switch is one that the arm or activator can connect to two different stationary contacts."], "jumps": []}, {"id": "P1091", "text": ["The relay contacts are called normally open (NO) and normally closed (NC). This refers to their state when the relay is de-energized."], "jumps": ["P1100", "P1090"]}, {"id": "P1090", "text": ["A Control Relay is a magnetically operated switch that directs signals.  Each set of contacts is similar to a single pole double throw switch (SPDT).", "A Control Relay is a magnetically operated switch that directs signals. Each set of contacts is similar to a single pole double throw switch (SPDT).."], "jumps": ["P1091", "P1070"]}, {"id": "P1080", "text": ["Heavy power cables and wires are used to transfer the high power from one place to another but the wires to the relay coil can be small."], "jumps": ["P1090", "P1070"]}, {"id": "P1074", "text": ["The small voltage used to energize relays makes large power transfers possible."], "jumps": ["P1080", "P1070"]}, {"id": "P1073", "text": ["The small voltage used to energize relays makes large power transfers possible."], "jumps": ["P1074", "P1070"]}, {"id": "P1072", "text": ["The small voltage used to energize relays makes large power transfers possible."], "jumps": ["P1073", "P1070"]}, {"id": "P1070", "text": ["The small voltage used to energize relays makes large power transfers possible."], "jumps": ["P1072", "P1040"]}, {"id": "P1060", "text": ["When a voltage is applied to the coil a magnetic field is produced and the relay is closed, operating like a closed switch. The relay is referred to as energized."], "jumps": ["P1070", "P1040"]}, {"id": "P1050", "text": ["When there is no voltage applied to the coil no magnetic field is produced and the relay is open, operating like an open switch. The relay is referred to as de-energized."], "jumps": ["P1060", "P1040"]}, {"id": "P1045", "text": ["SINGLE POLE SINGLE THROW (SPST) SWITCH - A single pole switch is one that opens or closes one circuit or current path. A single throw switch is a switch with only one moving arm and one stationary contact."], "jumps": []}, {"id": "P1042", "text": ["The magnetic coil opens and closes the contacts when voltage is applied to it or removed from it."], "jumps": ["P1050", "P1040"]}, {"id": "P1040", "text": ["They are similar to a single pole single throw switch (SPST) with one exception, they have a magnetic coil.", "They are similar to a single pole single throw switch (SPST) with one exception, they have a magnetic coil..."], "jumps": ["P1042", "P1032"]}, {"id": "P1035", "text": ["SWITCH - A switch is a device that is used to open or close electrical current paths, thereby either stopping the current flow or allowing the current to flow in an electrical circuit or through an electrical component.", "SWITCH - A switch is a device that is used to open or close electrical current paths, thereby either stopping the current or allowing the current in an electrical circuit or through an electrical component."], "jumps": ["P1031"]}, {"id": "P1032", "text": ["Power relays are used to apply power to a circuit or an electronic system."], "jumps": ["P1040", "P1031"]}, {"id": "P1031", "text": ["Relays are magnetically operated switches.", "Relaycal Appearance of a Relayyyyyyyyyyyyy", "Relays are magnetically operated switches.................."], "jumps": ["P1035", "P1032", "P1020"]}, {"id": "P1030", "text": ["Relays are magnetically operated switches."], "jumps": ["P1032", "P1020", "P1035"]}, {"id": "P1020", "text": ["Relays can be used for applying power to circuits or controlling signal flow.", "Relaycal Appearance of a Relayyyyyyyyyyyyy"], "jumps": ["P1030", "P1001"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P440", "text": ["Let's begin the lesson on RELAYS. TITLE..................................."], "jumps": ["P400"]}, {"id": "P430", "text": ["In fact, the telephone company is a major user of relays. Through the use of thousands of relays, you can call anyone in the world that has a phone."], "jumps": ["P440", "P400"]}, {"id": "P420", "text": ["Even though relays are being replaced by transistors, they are still used in many circuits where a transistor is not suited."], "jumps": ["P430", "P400"]}, {"id": "P410", "text": ["Relays are used in many electrical circuits for a variety of  purposes.", "Relays are used in many electrical circuits for a variety of purposes."], "jumps": ["P420", "P400"]}, {"id": "P400", "text": ["In this lesson you will learn about components called Relays.", "Relaycal Appearance of a Relayyyyyyyyyyyyy"], "jumps": ["P410", "P300"]}, {"id": "P300", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe the purpose and types of relays. w Describe basic relay construction and operation. w Identify the schematic symbol and reference designator for relays. w Describe the latched and time delay relay. w Describe a solenoid.........."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: RELAYSITLE sdf sdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "\"You have successfully passed the assessment", "You skipped X question(s). Do you want to _________", "The test is complete and your score is XX%. Do you want to _________", "You have successfully passed the assessment test!", "Are you sure you want to Bookmark the Lesson?", "Are you sure you want let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
