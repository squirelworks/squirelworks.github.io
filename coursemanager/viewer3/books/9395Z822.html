el 1 - 50 mV per division, AC Time/Division - 1 mS Scope Probe - X10", "SWITCH POSITION S1 OFF, to the left S3 OFF, Down CB1,CB2,CB3 RESET, Innn"], "jumps": []}, {"id": "P4350", "text": ["Press Enter to apply AC power to the PC130-735 card at PC1, and +12 VDC to the PC130-734 card at PC2."], "jumps": []}, {"id": "P4360", "text": ["Using the oscilloscope, monitor the simulated AC generator output. Connect CH1 to the anode of D1, and connect CH2 to the anode of D5. Set the oscilloscope as follows. TIME/DIV to 10 ms CHANNEL 1 DISPLAY MODE to DUAL AC/GND/DC TO AC TRIGGERING to AC VOLTS/DIV to 10V (x1 probe) SLOPE to + COUPLING to AC CHANNEL2 SOURCE to CH1 AC/GND/DC TO AC VOLTS/DIV to 10V (x1 probe)robe)))", "Channel 1 - 50 mV per division, AC Time/Division - 1 mS Scope Probe - X10", ", to the left S3 OFF, Down CB1,CB2,CB3 RESET, Innn", "TIME/DIV to 10 ms CHANNEL 1 DISPLAY MODE to DUAL AC/GND/DC TO AC TRIGGERING to AC VOLTS/DIV to 10V (x1 probe) SLOPE to + COUPLING to AC CHANNEL2 SOURCE to CH1 AC/GND/DC TO AC VOLTS/DIV to 10V (x1 probe)))be)"], "jumps": []}, {"id": "P4370", "text": ["Although most aircraft generators put out three-phase 115 VAC, our test console provides 14 VAC 180 degrees apart. Two half-wave rectifiers on the PC130-735, are utilized to convert the AC to DC, to power our power distribution system......"], "jumps": []}, {"id": "P4380", "text": ["Half-wave rectifiers D1,R1 and C1 for generator #1 and D5, R2 and C6 for generator #2 convert the generated AC into two DC outputs measured at PC130-735 TP1 and TP3.."], "jumps": []}, {"id": "P4390", "text": ["The two generators are zero adjusted by the Balance control potentiometer PC130-735, R4. Set your multimeter to read VDC and place the positive lead on PC130-735 TP2 and the negative lead on TP4. Adjust R4 for 0 VDC...."], "jumps": []}, {"id": "P4400", "text": ["PC130-735, R3 controls the regulated DC output of both generators. Because the test console provides the simulated battery voltage to PC130-734 TP5, the output of the generators needs to be adjusted higher than the battery voltage....."], "jumps": []}, {"id": "P4410", "text": ["Set the multimeter to VDC and connect it to PC130-735, TP2. Adjust the (Voltage Adjust) R3, until +13 VDC is measured at TP2. If the generators were properly zero adjusted, the voltage at TP4 should also read +13 VDC......"], "jumps": []}, {"id": "P4420", "text": ["Let's look at a basic power distribution system using the Generator 1 output from the PC130-735. Again, the test console DC power is utilized to simulate the aircraft battery. ction of PC130-734444"], "jumps": []}, {"id": "P4430", "text": ["The PC130-734 experiment card contains circuitry to represent one alternator input to a single BUS, with three circuit breakers feeding the Instrument Panel, Cabin Lights and Fasten Seat Belt lights. A Master Switch and solenoid, control battery and alternator power distribution....."], "jumps": []}, {"id": "P4440", "text": ["Set, S1 on PC130-735 to ON. This provides regulated power to the BUS, however the Master Switch relay must be energized to connect the alternator to the BUS....US."], "jumps": []}, {"id": "P4450", "text": ["Set, S1 (Master Switch) on PC130-734 to ON. The battery provides power to the BUS, energizing the Instrument Panel and Cabin Lights LED's. Lights LED'ss"], "jumps": []}, {"id": "P4460", "text": ["Press and hold the Engine Start switch, S2. The Starter, Alternator and Engine LED's should illuminate and the Battery LED should extinguish. Release the Engine Start switch, S2. The Starter LED should extinguish. LED'ssssss"], "jumps": []}, {"id": "P4470", "text": ["Notice, that the alternator is now supplying power to the BUS and it's associated loads. The battery, disconnected by the Master Switch Solenoid, is being charged by the alternator. strument Panel LED...."], "jumps": []}, {"id": "P4480", "text": ["Now let's adjust the generator output voltage lower than the battery voltage to see how the control circuitry reacts. While measuring the voltage at PC130-735 TP2, slowly adjust PC130-735 Voltage Adjust, R3 CCW until the Battery LED illuminates and the Alternator LED extinguishes.. Battery LED'ss"], "jumps": []}, {"id": "P4490", "text": ["Measure the output voltage at PC130-735, TP2. Notice, that the voltage reads less than the battery voltage provided by the test console, (approximately 12.2 VDC). With the alternator voltage lower than the battery, the control circuitry switches power distribution back to the battery. Battery LEDDDD"], "jumps": []}, {"id": "P4500", "text": ["Adjust PC130-735, R3, until the voltage at PC130-735, TP2, reads 13 VDC. Notice that the alternator LED illuminates and the battery LED extinguishes. The alternator is again supplying power to the BUS...."], "jumps": []}, {"id": "P4510", "text": ["The Generator Control Unit, (GCU), continuously monitors the generator output to ensure sufficient voltage is applied to the BUS. The Master Solenoid will not energize to unlatch the Battery unless the alternator is supplying voltage within specified limits....."], "jumps": []}, {"id": "P4520", "text": ["Press Enter to return all controls to their initial settings. consolenitial settings. n Tur;Times New Roman (Hebrew);Times New Roman (Arabic);Times New Roman Baltic;Courier New CE;Courier New Cyr;Courier New Greek;Courier New Tur;Courier New (Hebrew);Courier New (Arabic);Courier New Baltic;Press ENTER to return all controls to their initial settings."], "jumps": []}, {"id": "P4530", "text": ["Disconnect the test equipment from the circuit.it.nd rtund turn 1. Return all controls to their initial control settings. 19. Remove the red and black test leads from the circuit and turn off test equipment."], "jumps": []}, {"id": "P4540", "text": ["Carefully remove PC130-734 and PC130-735 cards.\". Carefully remove PC130-734 and PC130-735 cards."], "jumps": []}, {"id": "P4550", "text": ["Set the test console Power OFF.OFF..h to OFF. C switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": []}, {"id": "P4560", "text": ["Return all equipment to its proper storage area.rea.. C switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P4910"]}, {"id": "P4910", "text": ["This completes the DC GENERATOR EXPERIMENT. 3 TITLE........"], "jumps": ["P4001", "P4560"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["It breaks the current path so only the positive side of the sine wave is routed to the brush.", "How does a commutator change an AC generator into a DC generator?", "It allows current from one side of the loop to constantly be routed.", "It uses a full-wave rectifier only on the negative portion of the sine wave."], "jumps": []}, {"id": "P10211", "text": ["How can voltage be increased in a DC generator?", "Increase the speed of the rotating conductors.", "Increase the current to the magnetic field coils."], "jumps": []}, {"id": "P10212", "text": ["Which part of the DC Generator produces the electromagnetic field?"], "jumps": []}, {"id": "P10213", "text": ["What keeps the brushes in contact with the rotating commutator?"], "jumps": []}, {"id": "P10214", "text": ["Which type of DC Generator is most commonly used in General Aviation aircraft?"], "jumps": []}, {"id": "P10215", "text": ["The shifting of the magnetic field caused by current running through the armature is called?"], "jumps": []}, {"id": "P10216", "text": ["Which component of the DC Alternator produces the AC output sent to the rectifier?"], "jumps": []}, {"id": "P10217", "text": ["Transfers AC from the rotor to the rectifier.", "What is the purpose of the slip rings and brushes in a DC Alternator?", "Transfers AC from the stationary regulator to the rotor.", "Transfers AC from the stationary regulator to the commutator.", "Transfers DC from the stationary regulator to the rotor."], "jumps": []}, {"id": "P10218", "text": ["Which part of the DC Alternator system smoothes out the pulsating DC?"], "jumps": []}, {"id": "P10219", "text": ["How many diodes are used in a typical DC alternator rectifying circuit?"], "jumps": []}, {"id": "P10220", "text": ["The starter generator provides power to the AC power distribution system.", "What makes a starter generator unique from a standard DC generator?", "The starter generator has a start sequence commutator.", "The starter generator has an extra set of field windings that act like a motor.", "The starter generator has an extra rotor that acts like a motor."], "jumps": []}, {"id": "P10221", "text": ["What is the purpose of an aircraft Transformer Rectifier?", "Steps down AC power and converts it to DC.", "Steps down DC power and converts it to AC."], "jumps": []}, {"id": "P10222", "text": ["In a simple regulator, what happens to the output voltage of the generator when the field coil circuit resistance is increased?", "No effect on output voltage, field coil resistance only affects field current."], "jumps": []}, {"id": "P10223", "text": ["Field coil circuit resistance increases, field current decreases, output voltage decreases.", "What effects will compressing the carbon pile have on the output of the generator?", "Field coil circuit resistance decreases, field current increases, output voltage increases.", "Field coil circuit resistance decreases, field current decreases, output voltage decreases.", "Field coil circuit resistance increases, field current increases, output voltage increases."], "jumps": []}, {"id": "P10224", "text": ["Protects the generator output from becoming a motor during engine shutdown.", "What is the purpose of a Reverse Current Relay?", "Protects the generator field coils from transient over voltages.", "Closes the generator output circuit for starter generator operation.", "Protects the generator when the engine is reversed."], "jumps": []}, {"id": "P10225", "text": ["Sends a signal to increase the rotor RPM", "How does the regulator increase the DC alternator output?", "Decreases the DC directed to the rotor to decrease the magnetic field current.", "Sends a signal to decrease the rotor RPM.", "Increases the DC directed to the rotor to increase the magnetic field current."], "jumps": []}, {"id": "P10226", "text": ["Protects system from an over-voltage condition.", "What is NOT a function of the Alternator Control Unit?", "Protects the circuit from an over-frequency condition.", "Protects the alternator from a reverse current condition.", "Protects the starting circuitry. swer: B"], "jumps": []}, {"id": "P10227", "text": ["It protects the battery from excessive charging currents.", "Why does the GCU incorporate a time delay circuit during engine starts?", "It allows time for the start circuits to cool.", "It protects the magnetic field from reversing polarity.", "It protects the generator from excessive charging currents."], "jumps": []}, {"id": "P10228", "text": ["What is the maximum air pressure that can be safely used when using compressed air to remove the carbon and copper dust from a generator?"], "jumps": []}, {"id": "P10229", "text": ["What is the typical generator brush lifetime?"], "jumps": []}, {"id": "P10230", "text": ["What is the purpose of a growler when testing a generator?", "Detects shorts and opens in the field coil.", "Detects faulty brushes or excessive brush wear.", "Detects shorts and opens in the armature coil."], "jumps": []}, {"id": "P10231", "text": ["Brushes used beyond their recommended service life can cause?", "A voltage increase in the magnetic field coils."], "jumps": []}, {"id": "P10232", "text": ["Incorrect belt tension and gear coupling insert damage.", "What are two causes of alternator low power output?", "Gear coupling insert damage and open commutator.", "Incorrect belt tension and open commutator.", "Gear coupling insert damage and a broken drive belt."], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to __________"], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "PINFO", "text": ["08-16-04 Converted from storyboard. - patty 11-02-04 aDDED GR", "08-16-04 Converted from storyboard. - patty 11-05-04 Added graphics throughout lesson - patty and sarah 11-08-04 Reviewed lesson and ran exp. with trainer. frieda 11-11-04 Completed final changes and check. frieda"], "jumps": []}, {"id": "PQINFO", "text": ["Page # Test# Question# HelpPage # 10210 1 110 1150 10211 1 111 1200 10212 1 112 1240 10213 1 113 1280 10214 1 114 1360 10215 1 115 1410 10216 1 116 1510 10217 1 117 1530 10218 1 118 1620 10219 1 119 1610 10220 1 120 1690 10221 1 121 1750 10222 2 122 2070 10223 2 123 2130 10224 2 124 2160 10225 2 125 2240 10226 2 126 2280 10227 2 127 2290 10228 3 128 3100 10229 3 129 3120 10230 3 130 3310 10231 3 131 3230 10232 3 132 3270 10 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
