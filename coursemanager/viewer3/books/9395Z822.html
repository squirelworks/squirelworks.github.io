const book = {"title": "9395Z822", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ..", "Title: AIRCRAFT DC GENERATION SYSTEMSsfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["1. DC Generation DevicesEnter objective 1 line item 2 here. item 2 here.e.e.", "2. DC Generation Control Devicesjective 1 line item 2 here. item 2 here.e.e.", "w Identify the types of DC generation devices. w Describe the operation of a DC Generator, DC Alternator, Turbine Engine Starter-Generator, Converter, and Transformer Rectifier.", "w Describe the purpose and operation of Current Limiters, DC regulators, Reverse Current Relays (RCR), Generator Control Units (GCU), Alternator Control Units (ACU)...."], "jumps": []}, {"id": "P101", "text": ["3. DC Generation System Maintenance ve 1 line item 2 here. item 2 here.e.e.", "4. DC Generation Experiment t. s New Roman Cyr;Times New Roman Greek;Times New Roman Tur;Times New Roman (Hebrew);Times New Roman (Arabic);Times New Roman Baltic;Courier New CE;Courier New Cyr;Courier New Greek;Courier New Tur;Courier New (Hebrew);Courier New (Arabic);Courier New Baltic;DC Generation Experiment. @MS Mincho;Times New Roman CE;Times New Roman Cyr;Times New Roman Greek;Times New Roman Tur;Times New Roman (Hebrew);Times New Roman (Arabic);Times New Roman Baltic;Courier New CE;Courier New Cyr;Courier New Greek;Courier New Tur;Courier New (Hebrew);Courier New (Arabic);Courier New Baltic;DC Generation Experiment. @MS Mincho;Times New Roman CE;Times New Roman Cyr;Times New Roman Greek;Times New Roman Tur;Times New Roman (Hebrew);Times New Roman (Arabic);Times New Roman Baltic;Courier New CE;Courier New Cyr;Courier New Greek;Courier New Tur;Courier New (Hebrew);Courier New (Arabic);Courier New Baltic;DC Generation Experiment. @MS Mincho;Times New Roman CE;Times New Roman Cyr;Times New Roman Greek;Times New Roman Tur;Times New Roman (Hebrew);Times New Roman (Arabic);Times New Roman Baltic;Arial CE;Arial Cyr;Arial Greek;Arial Tur;Arial (Hebrew);Arial (Arabic);Arial Baltic;Courier New CE;Courier New Cyr;Courier New Greek;Courier New Tur;Courier New (Hebrew);Courier New (Arabic);Courier New Baltic;DC Generation Experiment. 4. DC Generation Experimentt", "w Identify common problems encountered in a DC Generation System and their typical fixes. w Describe the operation of a Twin-Engine Alternator System w Describe the purpose and operation of alternator load balancing..", "w Balance an alternator paralleling system. w Enter objective 2 line item 2 here.w Roman Tur;Times New Roman (Hebrew);Times New Roman (Arabic);Times New Roman Baltic;Balance an alternator paralleling system. w Enter objective 2 line item 2 here."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Experiment Card PC130-736erXXXXXXXXXXnt"], "jumps": []}, {"id": "P301", "text": ["8. Nida Model 470 Oscilloscope or equivalent"], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P341", "text": [], "jumps": []}, {"id": "P342", "text": [], "jumps": ["P"]}, {"id": "P343", "text": [], "jumps": []}, {"id": "P400", "text": ["All aircraft, whether a single engine General Aviation aircraft or a multi-engine air transport, require some type of power generation system to energize all of the electrical and electronic equipment on board."], "jumps": ["P301", "P410"]}, {"id": "P410", "text": ["Where battery power assists in getting the aircraft started, the power generation system sustains electrical power for the duration of the flight and recharges the battery.."], "jumps": []}, {"id": "P420", "text": ["In the lesson we will look at various systems that generate DC electrical power in an aircraft and learn how to keep them in top working order.."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Let's begin the lesson on AIRCRAFT DC GENERATION SYSTEMS...................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Magnets produce a magnetic field..........................."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["The force produced by the magnetic field is measured in the density of flux lines developed.5"], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The more flux lines the stronger the magnetic field and the higher the induction."], "jumps": []}, {"id": "P1050", "text": ["Moving a conductor through the stationary magnetic field can induce current.", "Rotating the magnetic field around a stationary conductor can also induce current."], "jumps": []}, {"id": "P1070", "text": ["Wire is a common conductor. Placing wire into a magnetic field produces a small electrical current. Moving the wire through the magnetic field disturbs the lines of flux and creates a larger current...", "Use the left-hand rule to determine the direction of the magnetic field around the conductor.."], "jumps": []}, {"id": "P1080", "text": ["Moving a conductor through a magnetic field generates Alternating current (AC)."], "jumps": []}, {"id": "P1090", "text": ["In this example of one rotation, rotating the conductor 1/4 turn cuts the maximum number of flux lines and induces a voltage."], "jumps": []}, {"id": "P1100", "text": ["As the conductor rotates 1/2 turn, fewer flux lines are cut. The induced voltage reduces to zero."], "jumps": []}, {"id": "P1110", "text": ["Continuing the rotation, 3/4 turns, again induces maximum voltage, however, the polarity is reversed."], "jumps": []}, {"id": "P1120", "text": ["Completing the rotation, the induced voltage returns to zero. This full rotation produces a sine wave."], "jumps": []}, {"id": "P1130", "text": ["Adding more conductors will create additional sine waves. 2140)"], "jumps": []}, {"id": "P1140", "text": ["DC generators are actually AC generators with some internal modifications. Instead of taking the current from the loops through slip rings and brushes producing a sine wave, the DC generator employs a mechanical rectifier called a commutator....."], "jumps": []}, {"id": "P1150", "text": ["A commutator consists of wedge shaped segments of copper that are insulated from touching each other by thin sheets of mica. The commutator is designed to accept the current produced in the loops at specific intervals, thus removing the negative side of the sine wave. remove negative side of the sine wave, zoom in on commutator and label mica between wedges and wedgesssss"], "jumps": []}, {"id": "P1160", "text": ["To demonstrate how this works, we will need a simple DC generator. When the loop is rotating clockwise and no lines of flux are being cut, the current is zero.. w/color"], "jumps": []}, {"id": "P1170", "text": ["As the green side of the loop begins to cut the lines of flux a positive current is produced and is routed to the green wedge of the commutator. The commutator transfers the current, via brushes to the output. When the loop reaches 180 degrees, again, no lines are cut and no current is present. th corresponding arc on the graphhhhh"], "jumps": []}, {"id": "P1180", "text": ["Continued loop rotation, cuts the lines of flux on the yellow side of the loop, producing a positive current. The yellow side commutator is in contact with the brush, which routes another positive pulse to the load. Notice that the brush is always in contact with the positive commutator wedge creating pulsing positive current flow....."], "jumps": []}, {"id": "P1182", "text": ["This action continues for each rotation...................."], "jumps": []}, {"id": "P1190", "text": ["Adding additional loops and commutator wedges will produce additional arcs. If we add enough conductors, we can produce a ripple effect at the peaks of the arcs. With enough conductors, a smooth DC output is produced. arcs 90 degrees out and highlight ripple in yellow. Enhance graphiccc"], "jumps": []}, {"id": "P1200", "text": ["Notice that increasing the number of conductors and wedges does not increase the voltage, however, increasing the field current will increase the output voltage. cs 90 degrees out and highlight ripple in yellow. Enhance graphiccc"], "jumps": []}, {"id": "P1210", "text": ["How does a commutator change an AC generator into a DC generator?", "It uses diodes to rectify the voltage. the voltage.ectify the voltage.oltage.ectify the voltage.ltage.y the voltage.e voltage.tify the voltage.y the voltage.e voltage.ctify the voltage.tify the voltage.of conductors.umber of conductors.uctors.onductors. of conductors.ctors.imes New Roman (Arabic);Times New Roman Baltic;Increase the number of conductors.ctors.f conductors.onductors.", "It allows current from one side of the loop to constantly be routed. routed.nstantly be routed.onstantly be routed.tly be routed.ntly be routed.tly be routed.ly be routed.tantly be routed. routed.nstantly be routed.tantly be routed. routed.ntly be routed.ly be routed.stantly be routed.e routed.tantly be routed.tly be routed.", "It breaks the current path so only the positive side of the sine wave is routed to the brush. routed. P1213"], "jumps": []}, {"id": "P1211", "text": [], "jumps": []}, {"id": "P1212", "text": ["Commutators do not use diodes to produce DC voltage........"], "jumps": []}, {"id": "P1213", "text": ["AC generators allow loop current to flow unobstructed, which produces a full sine wave."], "jumps": []}, {"id": "P1220", "text": ["How can voltage be increased in a DC generator?............", "Increase the number of conductors. P1222", "Increase the current to the magnetic field coils.", "Increase the speed of the rotating conductors. onductors. conductors. conductors. ing conductors. conductors. conductors. conductors. nductors. uctors. ctors. ctors. rs. s. rs. ctors. ctors. uctors. ;Arial Baltic;: Increase the speed of the rotating conductors. g conductors. uctors. onductors."], "jumps": ["P1210"]}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1222", "text": ["Increasing the number of conductors will smooth out the ripple DC, however, it will not increase the output voltage."], "jumps": []}, {"id": "P1223", "text": ["Increasing the speed of the rotation will increase the frequency, however, it will not increase the output voltage."], "jumps": []}, {"id": "P1230", "text": ["DC Generators are becoming less popular in today's aircraft due to the weight, price, and maintenance advantages of DC Alternators. You will, however, find DC Generators in older General Aviation aircraft, so it is important to know how they are constructed.....", "\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\ \\ \\\\\\ \\ \\ \\"], "jumps": ["P1220"]}, {"id": "P1240", "text": ["The main parts of a DC Generator are the Field Frame, Armature, Commutators, and brushes. The field frame, houses the field poles and field coils, which produce the magnetic field for the conductor...."], "jumps": []}, {"id": "P1250", "text": ["DC Generator field coils set up an electromagnetic field. Field coils can be set up as two poles opposite of each other, North and South, or four poles, North, South, North, and South at 90 degrees from each other..."], "jumps": []}, {"id": "P1260", "text": ["Field coils get their current to produce the magnetic field from an external source or the DC produced by the generator once it gets started. The type of generator determines the method used to set up field coil current. We will look at generator types later in this section....."], "jumps": []}, {"id": "P1270", "text": ["The armature contains the loops that cut through the field coil magnetic field. The armature assembly is made up of coils wound on an iron core, which are electrically and mechanically connected to the commutator. When the armature rotates, it cuts the lines of flux and produces a current flow......"], "jumps": []}, {"id": "P1280", "text": ["The commutator attached to the rotating armature, provides the proper routing of the positive voltage to the brushes. Carbon brushes ride on the commutator. They are held in place by springs to keep them in constant contact with the commutator. The brushes are electrically connected to the output connector......", "h\\\\\\hh h\\\\ZZ\\hh\\ h\\\\\\h??h??\\\\\\\\lll\\\\ZZmmmZZmmmmllmLLLDmDDDDDDDBBBDDDDDDBBD@@@@B", "hh6h \\6..666......6h....<<.....666\\\\\\\\\\\\\\\\\\<<<<.\\\\\\\\\\\\\\\\\\\\\\ZZZZZZ\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\ZZZZZZLLLLLDDLB!!!!!!!BBBDDBBBBBBB", "6hhhhhhhhh......6h6hhh...6...........6\\\\???h hhhh\\6.........<......<<<<<.....\\", "................h......<<<....Z\\\\\\ \\hhhhhh\\6......6\\.<....<<<<<<<<<<Z\\", "66...<<<<Z.ZZ<Z<L<LLLLL<\\\\LDLL!!!!!!!!!!!!!L )))'))", "<<<<<..<<<<<<<<......<<.6 \\<<<<<<L<<ZZL<Z\\ZLLLLLL!!!LL!!!!!!!!!!!!!!"], "jumps": []}, {"id": "P1290", "text": ["Which part of the DC Generator produces the electromagnetic field?", "Armature Armature ArmatureNew Armatureew Armature Armature New Armatureew Armatureaturees New Armaturec);Times ArmatureeArmaturel CE;Arial Armaturereek;Arial Armature ArmatureArial ArmatureArial Armaturermature"], "jumps": []}, {"id": "P1291", "text": [], "jumps": []}, {"id": "P1292", "text": ["Commutators route the positive voltage to the brushes......"], "jumps": []}, {"id": "P1293", "text": ["Armatures cut through the magnetic field to produce a voltage."], "jumps": []}, {"id": "P1300", "text": ["What keeps the brushes in contact with the rotating commutator?"], "jumps": ["P1290"]}, {"id": "P1301", "text": [], "jumps": []}, {"id": "P1302", "text": ["The field housing produces the magnetic lines of flux. -..."], "jumps": []}, {"id": "P1303", "text": ["An adjusting screw would not provide the ability for the brushes to float on the commutator."], "jumps": []}, {"id": "P1310", "text": ["There are three types of DC Generators: Series-Wound, Shunt- Wound, and Compound-Wound. The type of generator is dependent on how the field coil windings are connected to the external circuit. schematics yet)..."], "jumps": ["P1300"]}, {"id": "P1320", "text": ["A Series-Wound generator has a field winding that is connected in series with the external load. The field windings are made from large wire with few turns making the field magnetic strength dependent on current more than the number of turns....."], "jumps": []}, {"id": "P1330", "text": ["Since the current in the field winding increases and decreases with the load current, these generators are very hard to regulate and are not suitable for use in aircraft.."], "jumps": []}, {"id": "P1340", "text": ["A Shunt-Wound generator connects its field windings in parallel with the load. The field winding strength is dependent on the number of turns verses load current so the field windings are made from small wire wound numerous times....."], "jumps": []}, {"id": "P1350", "text": ["The parallel arrangement allows the load current to pass through the armature. The field rheostat in the parallel field circuit permits better regulation of the output."], "jumps": []}, {"id": "P1360", "text": ["The Compound-Wound generator is the most common DC Generator found on aircraft. It combines the characteristics of the Series Wound and the Shunt-Wound generators. Its field windings consist of few turns of large wire connected in parallel to the load....."], "jumps": []}, {"id": "P1370", "text": ["Which type of DC Generator is most commonly used in General Aviation aircraft?"], "jumps": []}, {"id": "P1371", "text": [], "jumps": []}, {"id": "P1372", "text": ["Series-wound generators are not found in General Aviation aircraft because they are difficult to regulate."], "jumps": []}, {"id": "P1373", "text": ["Although Shunt-wound generators can be found in some older GA aircraft, they are not the most popular DC Generator in general aviation."], "jumps": []}, {"id": "P1380", "text": ["Just as field coils set up a magnetic field for the armature to cut through, the current running through the armature also sets up a magnetic field. The armature field tends to distort or bend the magnetic field set up by the field coils. This distortion of the magnetic field is called Armature Reaction.", "I &&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&", "7 %777 %777 %777 %777 %777 %777 %777 M$", "7' !", "I &&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&", "I!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!! ,!!!!", "& $", "& I"], "jumps": ["P1370"]}, {"id": "P1390", "text": ["Commutator wedges are spaced so that during certain points in the rotation the brushes can touch two wedges. When the magnetic field is not distorted by armature reaction, no voltage is present at this point of rotation and the short across the wedges is harmless..."], "jumps": []}, {"id": "P1400", "text": ["However, when a load current is felt in the armature the Armature Reaction produces arcing and sparking across the wedges. The sparking causes pitting and premature failure of the commutator wedges...."], "jumps": []}, {"id": "P1410", "text": ["To compensate for the magnetic field distortion, Interpoles are used to help counter the shift caused by the Armature Reaction. Interpoles are small poles placed between the field coils. In a four-coil field frame, four interpoles are placed so they produce the same polarity as the next field coil in rotation....."], "jumps": []}, {"id": "P1420", "text": ["The interpole magnetic field strength varies with the load. When there is a large current demand on the generator, and a large field distortion, the interpole provides a large compensating field. When there is no load or a small load, the interpole provides zero or very little compensation. & E lines differently......."], "jumps": []}, {"id": "P1430", "text": ["The shifting of the magnetic field caused by current running through the armature is called?K"], "jumps": []}, {"id": "P1431", "text": [], "jumps": []}, {"id": "P1432", "text": ["Interpoles are used to counter the distortion of the magnetic field when current is flowing through the armature."], "jumps": []}, {"id": "P1433", "text": ["Although the magnetic field is distorted when current flows through the armature, Magnetic Distortion is not the correct name for that phenomena."], "jumps": []}, {"id": "P1440", "text": ["What is the purpose of Interpoles in a DC Generator?.......", "Reduces variations in the load current. 42 in the load current P1442 r New Baltic;Reduces variations in the load current P1442 ier New Baltic;Reduces variations in the load current P1442 c);Courier New Baltic;Reduces variations in the load current P1442 w Baltic;Reduces variations in the load current P1442 w Baltic;Reduces variations in the load current P1442 Reduces variations in the load current P1442", "Induces Armature Reaction as the load current increases. 443 current increases P1443 Armature Reaction as the load current increases P1443 ces Armature Reaction as the load current increases P1443 ltic;Induces Armature Reaction as the load current increases P1443 rmature Reaction as the load current increases P1443 mature Reaction as the load current increases P1443 action as the load current increases P1443", "Compensates for magnetic field distortion caused by the Armature Reaction. 1443"], "jumps": []}, {"id": "P1441", "text": [], "jumps": []}, {"id": "P1442", "text": ["The voltage regulator compensates for those load variations. lesson, compensates for those load variations.earn about later in this lesson, compensates for those load variations.."], "jumps": []}, {"id": "P1443", "text": ["The magnetic field set up by current moving through the armature induces armature reaction. Interpoles are designed to compensate for this reaction.."], "jumps": []}, {"id": "P1450", "text": ["We have spent a bit of time describing DC Generators, however, DC Alternators have become the most common device for producing DC voltage in today's general aviation aircraft."], "jumps": ["P1440"]}, {"id": "P1460", "text": ["You may find some very old aircraft still using a DC generator, however, trying to repair it or finding parts for those old systems can prove to be very difficult. Most owners of old aircraft are modifying their generator systems to incorporate a new alternator system....."], "jumps": []}, {"id": "P1470", "text": ["The advantages of a DC alternator over a DC generator are numerous. They have the ability to produce current at slower speeds due to their multiple sets of poles, they are much lighter than DC generators, and they use electronics to rectify the output which is much more efficient and reliable than the old mechanical rectifiers........"], "jumps": []}, {"id": "P1480", "text": ["The DC Alternator is actually a 3-phase AC generator except that instead of mechanically converting AC into DC like a generator, it electronically rectifies the AC into a DC output.."], "jumps": []}, {"id": "P1490", "text": ["The DC Alternator is made up of a drive shaft, stator, rotor, slip rings, and brushes. DSC01201)"], "jumps": []}, {"id": "P1500", "text": ["The drive shaft is connected to the engine though an accessory gearbox or a drive belt. The drive shaft contains the slip rings and rotor.."], "jumps": []}, {"id": "P1510", "text": ["The DC alternator frame bolted to the engine houses the stator. Unlike a DC generator, which uses the stator section for setting up the magnetic field, the stator of a DC alternator produces the three-phase AC output that is sent to the rectifier. show Y connected stator connection to rectifier....."], "jumps": []}, {"id": "P1520", "text": ["The rotor in a DC alternator is used to set up the magnetic field. It is made up of tightly wound coils that are connected in such a way to produce the magnetic poles. w Y connected stator connection to rectifier. , Add rotor connection to graphic from Z203, Pg 1330..."], "jumps": []}, {"id": "P1530", "text": ["The slip rings, located on the end of the drive shaft, receive DC excitation voltage from the regulator from the brushes and transfer it to the rotor. The brushes, which are stationary, ride on the slip rings maintaining constant electrical contact....."], "jumps": []}, {"id": "P1540", "text": ["Which component of the DC Alternator produces the AC output sent to the rectifier?"], "jumps": []}, {"id": "P1541", "text": [], "jumps": []}, {"id": "P1542", "text": ["The rotor provides the excitation magnetic field."], "jumps": []}, {"id": "P1543", "text": ["The rotating section of a DC Alternator is called the rotor and it produces the magnetic field."], "jumps": []}, {"id": "P1550", "text": ["What is the purpose of the slip rings and brushes in a DC Alternator?", "Transfers AC from the rotor to the rectifier. P1552", "Transfers AC from the stationary regulator to the rotor. P1553", "Transfers DC from the stationary regulator to the rotor."], "jumps": ["P1540"]}, {"id": "P1551", "text": [], "jumps": []}, {"id": "P1552", "text": ["The stator provides the AC power to the rectifier and since it is not rotating, it does not need slip rings and brushes to transfer the AC."], "jumps": []}, {"id": "P1553", "text": ["The rotor of DC alternator sets up the magnetic field and does not use AC for excitation."], "jumps": []}, {"id": "P1560", "text": ["Now that we know the parts of a DC alternator, let's take a closer look at how it works. When the engine or auxiliary power unit is started, the mechanical connection or drive belt from the engine or accessory gearbox drives the rotor of the alternator....."], "jumps": ["P1550"]}, {"id": "P1570", "text": ["The rotor begins to set up a rotating magnetic field using DC from the battery for initial excitement. Eventually DC from the voltage regulator is used for sustained excitement. The field current is sent to the rotor through the slip rings and brushes. rotor. Make stator graphic change as noted on graphicccc"], "jumps": []}, {"id": "P1580", "text": ["The rotating magnetic field is cut by the windings of the stator, which produces an AC output. The stator is designed so that 3 sets of windings, 120 degrees apart produce a 3-phase output..."], "jumps": []}, {"id": "P1590", "text": ["The 3-phase AC current produced by the stator is then rectified."], "jumps": []}, {"id": "P1600", "text": ["The rectifier changes AC to pulsating DC..................."], "jumps": []}, {"id": "P1610", "text": ["The rectifier circuit uses six (6) diodes in halfwave, fullwave and bridge rectifier configuration to change the AC into pulsating DC.", "The rectifier circuit uses six (6) diodes in halfwave, fullwave and bridge rectifier configuration to change the AC into pulsating DC..."], "jumps": ["P1620"]}, {"id": "P1612", "text": ["HALF WAVE RECTIFIER - The diode only conducts when forward biased. Thus only the positive alternation (half wave) of the sine wave reaches the load. AC is changed to Pulsating DC."], "jumps": []}, {"id": "P1613", "text": ["FULL WAVE RECTIFIER - The diode only conducts when forward biased but, each alternation (full wave) of the sine wave reaches the load due to the center tapped transformer and the two diodes. This changes AC to Pulsating DC...."], "jumps": []}, {"id": "P1614", "text": ["BRIDGE RECTIFIER - The diodes only conduct when forward biased but, each alternation (full wave) of the sine wave reaches the load due to the use of the four diodes (no center tapped transformer). This changes AC to Pulsating DC..."], "jumps": []}, {"id": "P1620", "text": ["Once the AC is changed to pulsating DC, it is filtered to produce pure DC."], "jumps": ["P1610"]}, {"id": "P1630", "text": ["Filters consist of a capacitor, a resistor and capacitor or an inductor and capacitor."], "jumps": ["P1640", "P1620"]}, {"id": "P1632", "text": ["CAPACITOR FILTER - The capacitor will charge up to the average voltage level of the applied pulsating DC. The charging and discharging of the capacitor when the pulsating DC is applied produces a smooth or filtered output....."], "jumps": []}, {"id": "P1633", "text": ["RESISTOR CAPACITOR FILTER - The two capacitors will charge up to the average voltage level of the applied pulsating DC. The charging and discharging of the capacitors through the resistor when the pulsating DC is applied produces a smooth or filtered output.."], "jumps": []}, {"id": "P1634", "text": ["INDUCTOR CAPACITOR FILTER - The two capacitors will charge up to the average voltage level of the applied pulsating DC. The charging and discharging of the capacitors through the inductor when the pulsating DC is applied produces a smooth or filtered output.."], "jumps": []}, {"id": "P1640", "text": ["Finally, the pure DC is applied to a voltage regulator. The voltage regulator maintains a constant voltage output as the load current requirement changes and provides continuous excitation to the rotor...."], "jumps": ["P1630"]}, {"id": "P1650", "text": ["Normally, a zener diode or transistor voltage regulator is used.", "Normally, a zener diode or transistor voltage regulator is used....."], "jumps": ["P1660", "P1640"]}, {"id": "P1652", "text": ["ZENER REGULATOR - The zener diode will produce a constant output voltage as long as the input voltage is above the zener diodes breakdown voltage. This is why changes in the output load have no effect on the output voltage; the zener changes its internal resistance....."], "jumps": []}, {"id": "P1653", "text": ["TRANSISTOR REGULATOR - The conduction of the transistor is changed to compensate for output voltage variation by comparing the output voltage with a reference voltage (set by the zener diode)...."], "jumps": []}, {"id": "P1660", "text": ["Which part of the DC Alternator system smoothes out the pulsating DC?"], "jumps": []}, {"id": "P1661", "text": [], "jumps": []}, {"id": "P1662", "text": ["The rectifier changes AC to pulsating DC..................."], "jumps": []}, {"id": "P1663", "text": ["The regulator maintains a constant voltage output by increasing or decreasing the magnetic field current as required."], "jumps": []}, {"id": "P1670", "text": ["How many diodes are used in a typical DC alternator rectifying circuit?"], "jumps": ["P1660"]}, {"id": "P1671", "text": [], "jumps": []}, {"id": "P1672", "text": ["Diodes are used to rectify the AC output to DC.DC.to rectify the AC output to DC."], "jumps": []}, {"id": "P1680", "text": ["Another type of DC Power Generation device is the Starter Generator. To save weight and space, many aircraft with turbine engines employ a generator that can also be used as a device to start the engine. Eliminating the need for two individual units reduces weight....."], "jumps": ["P1670"]}, {"id": "P1690", "text": ["Internally, a starter generator is the same as a standard DC generator with the exception of additional field windings. Most starter generators contain at least two sets of field windings and only one armature winding....."], "jumps": []}, {"id": "P1700", "text": ["During the start sequence, the extra set of series windings, internal to the generator, is used as a high torque motor to turn the engine. When the engine turbine reaches approximately 55% of its operating RPM, the motor windings are disconnected from the circuit....."], "jumps": ["P1710", "P1690"]}, {"id": "P1710", "text": ["Above 55% rpm, the starter generator switches to the generator mode allowing the parallel field windings to induce voltage into the armature. The voltage produced in the armature is then rectified through the commutator and regulated. winding. highlight generator output winding & fieldddd"], "jumps": []}, {"id": "P1720", "text": ["What makes a starter generator unique from a standard DC generator?", "The starter generator provides power to the AC power distribution system. P1722", "The starter generator has a start sequence commutator. P1723", "The starter generator has an extra set of field windings that act like a motor."], "jumps": []}, {"id": "P1721", "text": [], "jumps": []}, {"id": "P1722", "text": ["The starter generator generates DC power..................."], "jumps": []}, {"id": "P1723", "text": ["The commutator is the same in both the starter generator and a standard generator."], "jumps": []}, {"id": "P1730", "text": ["Most large, multi-engine aircraft use AC generators (or alternators). The AC Generator produces three-phase, 400 Hz, 115 Volt AC power for the aircraft systems. However, it is important to know that although large aircraft generate AC, they still have a requirement for DC power as well....."], "jumps": ["P1720"]}, {"id": "P1740", "text": ["A device used on aircraft to change AC power to DC power is called a Converter. Converters are not true generating devices because they require an input from a power generation source in order to operate, however, they do provide DC power...."], "jumps": []}, {"id": "P1750", "text": ["One type of converter is called the Transformer Rectifier (TR). The TR, changes AC power to DC power, and steps up or steps down the power as required. On an aircraft, the TR steps down and changes three-phase, 400 Hz, 115 Volt AC power into 28 volt DC power.."], "jumps": []}, {"id": "P1760", "text": ["The Transformer Rectifier has no moving parts other than a cooling fan so it is fairly lightweight and maintenance free. A TR enables large military and commercial aircraft to eliminate the use of heavier, high maintenance DC generation devices...."], "jumps": []}, {"id": "P1770", "text": ["The Transformer Rectifier operates much like the rectifier circuit on the DC alternator except that it also steps down the input voltage."], "jumps": []}, {"id": "P1780", "text": ["The TR receives 115 Volt AC power from the AC generation system. The first step in converting this power to DC power is to pass the input through a radio frequency (RF) filter. The filter reduces noise interference to the aircrafts avionics equipment...."], "jumps": []}, {"id": "P1790", "text": ["Next, the power must be reduced from the 115 volt input to 28 volts required for DC operation. This is accomplished by reducing the voltage through a wye-connected step-down transformer...."], "jumps": []}, {"id": "P1800", "text": ["The 28 volts is still AC at this point and needs to be rectified into DC. The rectifier section uses 12 diodes to change the AC into rippling DC. The center tapped Interphase Transformer is used to balance out the DC output. Call out Interphase Transformerrrr"], "jumps": []}, {"id": "P1810", "text": ["The last stage in the Transformer Rectifier is smoothing out the rippling DC. The output filter network takes the 4,800-hertz rippling DC and smoothes it out to almost a straight-line DC output..."], "jumps": []}, {"id": "P1820", "text": ["The fan is an important part of the TR. It keeps the transformers and rectifying circuits cool during power conversion. The fan is connected in parallel with the primary side of the step down transformer..."], "jumps": ["P1830", "P1810"]}, {"id": "P1830", "text": ["Point to the section of the Transformer Rectifier that steps down 115 AC power?to 28 volt DC power?"], "jumps": []}, {"id": "P1831", "text": [], "jumps": []}, {"id": "P1832", "text": ["This is the rectifier section, which changes 28 VAC to 28 VDC."], "jumps": []}, {"id": "P1833", "text": ["This is the DC ripple filter which smoothes out the 4800 Hz DC to straight-line DC."], "jumps": []}, {"id": "P1840", "text": ["What is the purpose of an aircraft Transformer Rectifier?..", "Steps down AC power and converts it to DC."], "jumps": ["P1830"]}, {"id": "P1841", "text": [], "jumps": []}, {"id": "P1842", "text": ["An Inverter changes DC to AC power........................."], "jumps": []}, {"id": "P1843", "text": ["This is part of the Transformer Rectifier's job, however, it does more than just convert AC to DC."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on DC GENERATION DEVICES...."], "jumps": ["P1001", "P1840"]}, {"id": "P1920", "text": ["1. DC generators produce DC power by rotating an armature through a fixed magnetic field and sending the induced AC voltage through a commutator to the voltage regulator. The commutator acts like a mechanical rectifier to change the induced AC power to DC power."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. There are three types of DC generators: Series-Wound, Shunt- Wound, and Compound-Wound. The type of field coil windings identifies them. Compound-Wound DC Generators are the most common type of aircraft generator......."], "jumps": []}, {"id": "P1940", "text": ["3. DC Alternators produce DC power through their stators to a solid-state rectifier. The rotor provides the rotating magnetic field that induces current in the stator. DC alternators are lighter and less expensive than DC generators and are the preferred choice in general aviation..."], "jumps": []}, {"id": "P1950", "text": ["The main parts of a DC Generator are the Field Frame, Armature, Commutators, and brushes. The field frame, houses the field poles and field coils, which produce the magnetic field for the conductor...."], "jumps": []}, {"id": "P1960", "text": ["5. A Starter Generator incorporates starter windings in the generator for engine starts. At approximately 55% engine RPM the starter section is disconnected and the generation section takes over. Starter Generators are used primarily on turbine engine aircraft."], "jumps": []}, {"id": "P1970", "text": ["6. A Converter changes AC power to DC power. The Transformer Rectifier (TR) steps down 115 volts AC to 28 volts AC and then rectifies the 28 volts AC to 28 volts DC. The TR provides DC power on large aircraft that utilize AC generator systems.."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1970"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2010", "text": ["Every aviator knows, that power is useless without control. Generated DC power needs to be controlled to ensure circuits are not damaged, aircraft DC systems run smoothly, and failures are kept to a minimum....."], "jumps": ["P2020", "P2001"]}, {"id": "P2020", "text": ["DC control devices are incorporated into the system to control DC power. These devices include current limiters, regulators, reverse current relays, generator control units, and alternator control units. DCP2020B (remove background), DCP2020C and DCP2020D (remove background)))"], "jumps": []}, {"id": "P2030", "text": ["The most basic of control devices is the Current Limiter. Technically, a current limiter is a large slow-blowing fuse designed to melt and open the generator output circuit if the current exceeds the systems rating for an extended period....."], "jumps": []}, {"id": "P2040", "text": ["Current limiters are usually located in the power distribution box of the aircraft and are inaccessible during flight. Once the current limiter melts, it must be replaced before the generator circuit will function again.. (leave backgrounds))"], "jumps": []}, {"id": "P2050", "text": ["Earlier, we discussed the voltage regulator as a means to control the output of a DC generator and DC alternator by controlling the strength of the magnetic field coil. Voltage regulators are the most common DC control devices in aircraft. DCP2050C, DCP21100000"], "jumps": []}, {"id": "P2060", "text": ["Prior to solid-state regulators, commonly used with today's DC alternators, DC generators used variable resistor type regulators. The operation of a variable resistor regulator is quite simple..."], "jumps": []}, {"id": "P2070", "text": ["If the output voltage is too high, the resistance in the field coil circuit is increased. The increase in resistance will decrease the current to the field coil causing a reduction in the magnetic field."], "jumps": []}, {"id": "P2080", "text": ["The reduced magnetic field will decrease the voltage producing capability of the armature resulting in a decrease in voltage at the output.."], "jumps": []}, {"id": "P2090", "text": ["To increase the generator output voltage, the regulator decreases the resistance of the field coil circuit, thus increasing the current to the field coil. The increase in current allows the armature to produce a higher voltage at the output....."], "jumps": []}, {"id": "P2100", "text": ["In a simple regulator, what happens to the output voltage of the generator when the field coil circuit resistance is increased?", "No effect on output voltage, field coil resistance only affects field current. P2103"], "jumps": ["P2090"]}, {"id": "P2101", "text": [], "jumps": []}, {"id": "P2102", "text": ["Remember Ohm's Law. If resistance increases, current decreases and the field strength will decrease providing less lines of flux to generate voltage.."], "jumps": []}, {"id": "P2103", "text": ["True, field coil resistance does affect field current, however, the field current is also going to affect the output voltage."], "jumps": []}, {"id": "P2110", "text": ["Older aircraft commonly used carbon pile regulators as the variable resistor. Carbon pile regulators are just that; a stack, or pile, of carbon wafers held together by a spring."], "jumps": ["P2100"]}, {"id": "P2120", "text": ["As the generator output voltage decreases, the solenoid, which uses the voltage to hold tension on the spring, relaxes. The spring is then allowed to compress the carbon wafers, reducing their resistance. The reduced resistance allows more current to flow to the magnetic field, which increases the output voltage. vvvvv"], "jumps": []}, {"id": "P2130", "text": ["As the output voltage increases, the solenoid pushes on the spring, which releases the tension on the carbon wafers. Less tension on the carbon pile increases the resistance and reduces the current flow to the field. The output voltage is reduced as the magnetic field is reduced......"], "jumps": []}, {"id": "P2140", "text": ["Carbon pile regulators must be mechanically adjusted to provide the correct generator output voltage. If the aircraft has more than one generator, the generators must be paralleled to ensure they provide equal voltage to the DC distribution system....."], "jumps": []}, {"id": "P2145", "text": ["Paralleling is the procedure to ensure that all generators in a multi-generator system have zero voltage difference between them. This ensures that all generators are providing the same voltage to the system...."], "jumps": []}, {"id": "P2150", "text": ["What effects will compressing the carbon pile have on the output of the generator?", "Field coil circuit resistance increases, field current decreases, output voltage decreases. P2152", "Field coil circuit resistance decreases, field current decreases, output voltage decreases. P2153", "Field coil circuit resistance decreases, field current increases, output voltage increases."], "jumps": ["P2140"]}, {"id": "P2151", "text": [], "jumps": []}, {"id": "P2152", "text": ["Compressing the carbon pile will decrease the resistance..."], "jumps": []}, {"id": "P2153", "text": ["If field coil resistance decreases, field current increases. Remember Ohm's Law."], "jumps": []}, {"id": "P2160", "text": ["If a DC generator has voltage applied to its output terminal, it will act like a motor and attempt to rotate. An inadvertent high voltage at a generators output during operation could be very damaging to the generator. To prevent the generator from becoming a motor, a Reverse Current Relay (RCR) device is used.."], "jumps": ["P2150"]}, {"id": "P2170", "text": ["Similar to diodes, Reverse Current Relays allow current to flow in one direction, but not in the other direction. The RCR is built with a voltage coil and current coil wound on the same iron core. The voltage coil is connected to the positive side of the generator output and ground......"], "jumps": []}, {"id": "P2180", "text": ["The current coil is connected in series with the generator output. This configuration allows the entire generator load current to pass through the current coil. A pair of contacts is placed where they can be controlled by the magnetic field of the iron core. The contacts are held open by a spring when the generator is not running. callout contacts, spring, and iron coreee"], "jumps": []}, {"id": "P2190", "text": ["When the generator reaches a voltage slightly higher than the battery voltage, the voltage coil energizes and closes the contacts, connecting the generator to the load. As long as the generator voltage remains higher than the battery voltage, the generator will remain connected......"], "jumps": ["P2200", "P2170"]}, {"id": "P2200", "text": ["When the generator slows down or stops, the battery voltage will cause current to start flowing toward the generator. When this happens, the current flow will be in a direction that creates a field opposing the field of the voltage winding. This weakens the iron core field and the spring opens the contacts......"], "jumps": []}, {"id": "P2210", "text": ["The RCR is especially important during engine shutdown to prevent the generator from motoring off of the battery voltage. You will find RCR's on older aircraft with DC generators.."], "jumps": []}, {"id": "P2220", "text": ["What is the purpose of a Reverse Current Relay?............", "Closes the generator output circuit for starter generator operation. P2222", "Protects the generator field coils from transient over voltages. P2223", "Protects the generator output from becoming a motor during engine shutdown."], "jumps": ["P2210"]}, {"id": "P2221", "text": [], "jumps": []}, {"id": "P2222", "text": ["The RCR is not used for starter generator operation........"], "jumps": []}, {"id": "P2223", "text": ["The RCR does not protect the generator field coils........."], "jumps": []}, {"id": "P2230", "text": ["As we discussed when exploring the operation of a DC alternator, control of an alternator output is accomplished through an alternator controller. The alternator controller is a regulator that uses solid-state devices to regulate the alternator output....."], "jumps": ["P2220"]}, {"id": "P2240", "text": ["To support heavy electrical load demands, the regulator increases the current to the rotor, which increases the magnetic field strength. The increase in field strength increases the lines of flux being cut by the stator resulting in an increase in AC output to the rectifier....."], "jumps": []}, {"id": "P2250", "text": ["The output from the rectifier passes through the regulator which senses when there is enough output to meet the load demand. The regulator readjusts the current to the rotor to maintain a constant output to the main DC system....."], "jumps": []}, {"id": "P2260", "text": ["In multi-engine aircraft, the alternator regulators are connected together so their internal circuits can monitor the output of the other alternator. The regulators make adjustments as necessary to maintain a zero voltage difference between the two alternator outputs....."], "jumps": []}, {"id": "P2270", "text": ["How does the regulator increase the DC alternator output?..", "Increases the DC directed to the rotor to increase the magnetic field current. magnetic field current. P2272", "Decreases the DC directed to the rotor to increase the magnetic field current.", "Sends a signal to decrease the rotor RPM."], "jumps": []}, {"id": "P2271", "text": [], "jumps": []}, {"id": "P2272", "text": ["Decreasing the DC to the rotor will reduce the magnetic field strength and decrease the alternator output."], "jumps": []}, {"id": "P2273", "text": ["The regulator does not control the speed of the rotor. The engine or auxiliary power unit determines the speed of the rotor."], "jumps": []}, {"id": "P2280", "text": ["The last two types of DC generation control devices we will cover are the Generator Control Unit (GCU) and Alternator Control Unit (ACU). Both of these devices are multifunctional. They contain voltage regulators, over-voltage protection, starting circuit protection, multi-generation balancing, and reverse current protection........"], "jumps": ["P2270"]}, {"id": "P2290", "text": ["The block diagram shows how one unit accomplishes all of these functions. The voltage regulator maintains a constant generator voltage under various loads and rotational speeds. A transistor circuit is used to control the strength of the generator field...."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["In case of a failure or during generator shutdown, the reverse current circuit prevents current from flowing back into the generator. If the GCU / ACU senses this condition, it will open the line contactor control thus isolating the generator..."], "jumps": []}, {"id": "P2310", "text": ["The start circuit protection incorporates a time delay circuit that reduces the generator output for the first several minutes after starting an engine to protect the battery from excessive charging currents...."], "jumps": []}, {"id": "P2320", "text": ["The over-voltage protection prevents excessive DC current from entering the main DC bus. If an over-voltage condition is sensed, the generator will be disconnected from the DC Power circuit. sectionnnn"], "jumps": []}, {"id": "P2330", "text": ["The voltage comparator compares the generator output voltage with the voltage on the main DC bus to determine if the generator is acting as a load on the system instead of a power source. It will interrupt the line contactor circuit if it finds a differential in voltage....."], "jumps": []}, {"id": "P2340", "text": ["What is NOT a function of the Alternator Control Unit?.....", "Protects system from an over-voltage condition. P2312", "Protects the alternator from a reverse current condition. P2313", "Protects the circuit from an over-frequency condition."], "jumps": []}, {"id": "P2341", "text": [], "jumps": []}, {"id": "P2342", "text": ["The ACU does provide over-voltage protection..............."], "jumps": []}, {"id": "P2343", "text": ["The ACU does protect the alternator from reverse current..."], "jumps": []}, {"id": "P2350", "text": ["Why does the GCU incorporate a time delay circuit during engine starts?", "It protects the battery from excessive charging currents. 2323", "It allows time for the start circuits to cool.", "It protects the magnetic field from reversing polarity.."], "jumps": ["P2340"]}, {"id": "P2351", "text": [], "jumps": []}, {"id": "P2352", "text": ["The start circuits will cool without a time delay from the GCU."], "jumps": []}, {"id": "P2353", "text": ["The GCU does not protect the magnetic field................"], "jumps": []}, {"id": "P2910", "text": ["This completes the information on DC GENERATION CONTROL DEVICES."], "jumps": ["P2001", "P2350"]}, {"id": "P2920", "text": ["1. DC control devices are incorporated into DC power generation systems to regulate output voltage and protect circuit components. DC control devices include current limiters, regulators, reverse current relays, generator control units and alternator control units..."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2. Current limiters are large current slow blowing fuses that protect the circuit by melting and opening the generator circuit in the event the current exceeds rated capacity for an extended period of time. Current limiters are located in the power distribution box and are inaccessible in flight.."], "jumps": []}, {"id": "P2940", "text": ["3. Voltage regulators are used to control the output voltage of the generator by controlling the strength of the generator's magnetic field coil. To increase output voltage the regulator provides more current to the field coil. To reduce output voltage, the regulator reduces current to the field coil.."], "jumps": []}, {"id": "P2950", "text": ["4. Simple regulators use variable resistors to adjust the current to the field coils while carbon pile regulators use stacked carbon wafers to increase or decrease field coil current. Compressing the carbon wafers reduces resistance while relaxing the wafers increases field control resistance."], "jumps": []}, {"id": "P2960", "text": ["5. Current applied to a DC generator output will potentially damage the generator or cause it to act as a motor. To prevent battery or bus current from reaching the generator a Reverse Current Relay (RCR) is used. The RCR employs a voltage coil and current coil to detect reverse current and remove the generator from the circuit...."], "jumps": []}, {"id": "P2970", "text": ["6. A DC alternator controller rectifies the alternator output to produce a smooth DC signal and provides voltage regulation by using a Solid-state circuit to control the field current to the alternator. As the output of the alternator increases beyond the specified output, the alternator controller decreases the field current to reduce the output. ncreasing the field strength will increase the alternator output."], "jumps": []}, {"id": "P2980", "text": ["7. Generator Control Units (GCU) and Alternator Control Units (ACU) combine all of the features of the current limiter, voltage regulator, reverse current relay, and alternator controller into one unit. Generator control units are replacing other devices because of their versatility and simplicity..."], "jumps": []}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2980"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3020", "text": ["As an Aviation Maintenance Technician you will be expected to maintain aircraft DC Power Generation systems and keep them in top running condition. rvicing, troubleshooting, and repair of any aircraft system should always be conducted in accordance with the appropriate aircraft and component publications...."], "jumps": ["P3030", "P3001"]}, {"id": "P3025", "text": ["Servicing, troubleshooting, and repair of any aircraft system should always be conducted in accordance with the appropriate aircraft and component publications..propriate maintenance manuals for the latest and correct procedures."], "jumps": ["P3020"]}, {"id": "P3030", "text": ["In this section we will look into some of the more common tasks of maintaining DC generation systems. Again, when working on an aircraft, always refer to the appropriate maintenance manuals for the latest and correct procedures."], "jumps": ["P3025"]}, {"id": "P3040", "text": ["Today, most generator internal maintenance is reserved for an overhaul shop that is familiar with the process of rebuilding generators. However, it is important to know when a DC generator is not working properly. st mechanics simply remove the bad generator and replace it with a new or rebuilt generator........"], "jumps": []}, {"id": "P3045", "text": ["Most mechanics simply remove the bad generator and replace it with a new or rebuilt generator.the process of rebuilding generators. However, it is important to know when a DC generator is not working properly. Most mechanics simply remove the bad generator and replace it with a new or rebuilt generator........"], "jumps": []}, {"id": "P3050", "text": ["Typically, generator overhaul shops replace worn or damaged bearings, commutators, brushes, and armatures. They will also test the generator for shorts, opens, and insulation breakdowns..", "h\\\\\\hh h\\\\ZZ\\hh\\ h\\\\\\h??h??\\\\\\\\lll\\\\ZZmmmZZmmmmllmLLLDmDDDDDDDBBBDDDDDDBBD@@@@B", "hh6h \\6..666......6h....<<.....666\\\\\\\\\\\\\\\\\\<<<<.\\\\\\\\\\\\\\\\\\\\\\ZZZZZZ\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\ZZZZZZLLLLLDDLB!!!!!!!BBBDDBBBBBBB", "6hhhhhhhhh......6h6hhh...6...........6\\\\???h hhhh\\6.........<......<<<<<.....\\", "................h......<<<....Z\\\\\\ \\hhhhhh\\6......6\\.<....<<<<<<<<<<Z\\", "66...<<<<Z.ZZ<Z<L<LLLLL<\\\\LDLL!!!!!!!!!!!!!L )))'))", "<<<<<..<<<<<<<<......<<.6 \\<<<<<<L<<ZZL<Z\\ZLLLLLL!!!LL!!!!!!!!!!!!!!"], "jumps": []}, {"id": "P3060", "text": ["There are several maintenance procedures designed for the technician to check the health of the generator. The first task is a visual inspection. Visually check these areas on the generator..."], "jumps": []}, {"id": "P3070", "text": ["Check the case for signs of overheating, damage, and security. Check the mounting hardware for cracks, corrosion, and damage. Ensure the proper torque is applied to all applicable hardware..."], "jumps": []}, {"id": "P3080", "text": ["Visually inspect all connections for cleanliness, broken or frayed wires, broken terminal lugs, clean solder joints and proper torque."], "jumps": []}, {"id": "P3090", "text": ["Check the cooling ducts for tears, security, signs of chafing, and ensure it is clear of obstructions."], "jumps": []}, {"id": "P3100", "text": ["When inspecting the interior of a generator, it is advisable to remove the copper and carbon dust that builds up on the generator with compressed air. For your safety, use less than 40 psi of air pressure when removing the dust. Always use a respirator and goggles when using compressed air. el \"40 psi Maximum\"\"\"\"\""], "jumps": []}, {"id": "P3110", "text": ["Simply removing a band cover that fits around the generator allows visual inspection of brushes and commutator. Check the commutator for burnt spots, pitting, or excessive wear. If any of these conditions exist, the generator should be replaced....."], "jumps": []}, {"id": "P3120", "text": ["The typical brush life for a generator ranges from 500 to 1000 hours. Brushes should be checked for cracks, chips, frayed leads, and wear. Many brushes incorporate a wear groove in order to help with inspection. The amount of wear groove visible indicates the service life remaining on the brush......"], "jumps": []}, {"id": "P3130", "text": ["Lifting up on the retaining spring and removing the brush from its holder can replace excessively worn brushes. A screw electrically connects the brushes. If you need to replace a brush, replace them all at the same time. excessive grooving...."], "jumps": []}, {"id": "P3140", "text": ["What is the maximum air pressure that can be safely used when using compressed air to remove the carbon and copper dust from a generator?"], "jumps": []}, {"id": "P3141", "text": [], "jumps": []}, {"id": "P3142", "text": ["You can use more than 4 psi of air pressure to clean generator parts."], "jumps": []}, {"id": "P3143", "text": ["400 psi of air pressure is too much and could cause bodily harm or damage to the generator."], "jumps": []}, {"id": "P3150", "text": ["During a generator inspection you visually inspect the brushes and find the brush wear as indicated in the picture. What can you say about the life remaining on the brush?", "This is a new brush and has a full service life ahead. P3152", "This brush has only 1/4 of its service life remaining. P3153", "This brush has half of its service life remaining."], "jumps": ["P3140"]}, {"id": "P3151", "text": [], "jumps": []}, {"id": "P3152", "text": ["A new brush would have its wear groove extending through the entire brush."], "jumps": []}, {"id": "P3153", "text": ["A brush with only 1/4 of its life remaining would only have a small wear groove left on it."], "jumps": []}, {"id": "P3160", "text": ["As we learned earlier, if your visual inspection reveals a damaged or worn generator, or your troubleshooting has verified that the generator is bad, you will most likely replace the generator with a new or rebuilt one and send the bad one to a shop that is certified to overhaul it....."], "jumps": ["P3150"]}, {"id": "P3170", "text": ["The Growler is a piece of equipment used in the generator overhaul shop to check the armature coil of generators for shorts and opens."], "jumps": []}, {"id": "P3180", "text": ["To detect a short, a hacksaw blade or metal strip is held above the armature as the armature is slowly rotated. If the blade vibrates a short circuit exists in the armature coil immediately under the blade...."], "jumps": []}, {"id": "P3190", "text": ["To detect on open, the blade is rubbed over the segments of the commutator to produce sparks. Slowly rotate the armature shorting out two segments of the commutator at a time. If the blade fails to produce sparks across two segments, the associated coil is open. sparking....."], "jumps": []}, {"id": "P3200", "text": ["What is the purpose of a growler when testing a generator? );Courier New Baltic;What is the purpose of a growler when testing a generator? imes New Roman Baltic;Courier New CE;Courier New Cyr;Courier New Greek;Courier New Tur;Courier New (Hebrew);Courier New (Arabic);Courier New Baltic;What is the purpose of a growler when testing a generator?", "Detects shorts and opens in the field coil.. field coil.the field coil.field coil.ield coil. field coil. field coil.he field coil..ts and opens in the field coil.ic;Detects shorts and opens in the field coil.", "Detects faulty brushes or excessive brush wear.rush wear", "Detects shorts and opens in the armature coil. and opens in the armature coil.etects shorts and opens in the armature coil.cts shorts and opens in the armature coil.Detects shorts and opens in the armature coil."], "jumps": ["P3190"]}, {"id": "P3201", "text": [], "jumps": []}, {"id": "P3202", "text": ["The growler is not used for detecting defects in the field coil."], "jumps": []}, {"id": "P3203", "text": ["The growler is not used for inspecting brushes............."], "jumps": []}, {"id": "P3210", "text": ["Alternators are the most popular DC power-generating device in general aviation and corporate aircraft. They are lightweight, easy to maintain, and have a very long service life compared to generators...."], "jumps": ["P3220", "P3200"]}, {"id": "P3220", "text": ["One reason for the long service life is that the brushes of an alternator ride on slip rings and not Commutators. The slip rings are smoother and provide little friction against the brushes.."], "jumps": []}, {"id": "P3230", "text": ["Since alternator brushes tend to last a long time they often get overlooked during the visual inspection of the alternator. Brushes that have worn beyond their service life limits can cause serious damage to slip rings.....", "S !?? ?! r ?S rd ?!r!rrS!!?!!???S", "S r !! ! rrrr! !S??SS ?!r !S?S", "!!!!!! rrr! ! ?!rr?? !! ! !?? !", "!!!! S !rr!? ?? d!!!r! ? ??? ? !", "!!! S! !!!!!d!!! !!rr!!! !!r!!!dv!! !!", "v!!d!?? ?? !!!! rr! SS ! ? ??r", "vvvvv! !!!dd!!!!!!!!??? ! S S??!!ddd!! !! !?!? ?????!S v", "!!dd!!!!rr!!!!!??? ???!r r ?????! ?!rr! !!! rr! ?", "!!!vXXvvdvdrrXXdddv!d!? ? !ddrrrrrr!!!!! !d!rrd!!! ! ? ? !!! !rr"], "jumps": []}, {"id": "P3240", "text": ["Alternator brushes are inspected and checked for service life in the same manner as generators. Anytime you are inspecting or electrically checking an alternator, you should check the service life limits of the brushes....."], "jumps": []}, {"id": "P3250", "text": ["Alternators can be either gear driven or belt driven. Gear driven alternators must be removed from the engine to check the gear coupling. The gear coupling has a rubber insert that is designed to shear in the event the alternator abruptly stops with the engine running...."], "jumps": []}, {"id": "P3260", "text": ["The rubber insert can become hard and brittle over time and cause a low alternator power output. The insert should be inspected whenever the alternator is removed from the engine mount. While the alternator is out, also check the alternator drive splines for excessive wear or damage..."], "jumps": []}, {"id": "P3270", "text": ["For belt driven alternators, check condition of the belt. Visually look for cracking or excessive wear and ensure that the belt is properly tensioned. Like a bad gear coupling, incorrect belt tension can cause low alternator power output....."], "jumps": []}, {"id": "P3280", "text": ["Visually inspecting the alternator case, connections, and ducting is similar to the generator inspection. Check these items for overheating, corrosion, distortion, and blockage."], "jumps": []}, {"id": "P3290", "text": ["Visual inspection of the other components in the DC generation system should be completed on a regularly scheduled basis in accordance with the proper maintenance manuals or maintenance procedure cards...."], "jumps": []}, {"id": "P3300", "text": ["Check for broken or frayed wires, loose terminals, evidence of overheating, and signs of corrosion. Ensure that each component is securely mounted and properly connected. Clean corrosion with approved electrical corrosion preventative compounds where appropriate....."], "jumps": ["P3310", "P3290"]}, {"id": "P3310", "text": ["Brushes used beyond their recommended service life can cause?", "A voltage increase in the magnetic field coils. P3313"], "jumps": []}, {"id": "P3311", "text": [], "jumps": []}, {"id": "P3312", "text": ["The stator is not connected to the brushes................."], "jumps": []}, {"id": "P3313", "text": ["The voltage to the rotor (magnetic field coils) would be reduced if the brushes were faulty."], "jumps": []}, {"id": "P3320", "text": ["What are two causes of alternator low power output?........", "Gear coupling insert damage and a broken drive belt. P3322", "Incorrect belt tension and open commutator. P3323", "Incorrect belt tension and gear coupling insert damage."], "jumps": ["P3310"]}, {"id": "P3321", "text": [], "jumps": []}, {"id": "P3322", "text": ["A broken drive belt would cause the alternator to stop turning. The stopped alternator would produce no power output."], "jumps": []}, {"id": "P3323", "text": ["Alternators do not have Commutators........................"], "jumps": []}, {"id": "P3330", "text": ["Now that we have discussed DC generation system inspection techniques, let's look into some common problems found in the DC generation system and identify the typical causes of those problems..."], "jumps": ["P3320"]}, {"id": "P3340", "text": ["Anyone who has owned an old Volkswagen can attest to the problem of DC generation system \"Noise\" coming from the radio speakers. Every time you step on the gas, the noise increases in pitch. Radio noise can be caused by several problems in the DC generation system. license here)))))"], "jumps": []}, {"id": "P3350", "text": ["In alternator systems, failing diodes or a bad stator could be the cause of the noise. A common troubleshooting technique to see if the diodes or stator is bad is the Reverse Polarity Check. It can be accomplished with the alternator still on the engine....."], "jumps": []}, {"id": "P3360", "text": ["Use an analog ohmmeter to check the resistance between the output terminal and ground. The positive meter lead should be on ground and the negative lead should be on the output terminal. If the diodes and stator are good the meter will read between 30 and 50 ohms. d lead on case and black lead on orange connector (on left side of generator)))))))"], "jumps": []}, {"id": "P3370", "text": ["If the meter reads less than 30 ohms, the stator or diodes are bad and the alternator should be replaced."], "jumps": []}, {"id": "P3380", "text": ["If the Reverse Polarity Check indicates that the alternator is good, the noise on the radio could be caused by loose or corroded ground or bonding connections, generation wiring located too close to radio antennas, or problems with the shielded wiring connections....."], "jumps": ["P3910", "P3370", "P"]}, {"id": "P3910", "text": ["This completes the information on DC GENERATION SYSTEM MAINTENANCE."], "jumps": ["P3001", "P3380"]}, {"id": "P3920", "text": ["1. As an Aviation Maintenance Technician, you will be expected to maintain aircraft DC Power Generation systems and keep them in top running condition. Servicing, troubleshooting, and repair of any aircraft system should always be conducted in accordance with the appropriate aircraft and component publications."], "jumps": ["P3930", "P3001"]}, {"id": "P3930", "text": ["2. There are several maintenance procedures designed for the technician to check the health of the generator. The first task is a visual inspection. Visually check these areas on the generator..."], "jumps": []}, {"id": "P3940", "text": ["3. When inspecting the interior of a generator, it is advisable to remove the copper and carbon dust that builds up on the generator with compressed air. For your safety, use less than 40 psi of air pressure when removing the dust. Always use a respirator and goggles when using compressed air.."], "jumps": []}, {"id": "P3950", "text": ["4. The typical brush life for a generator ranges from 500 to 1000 hours. Brushes should be checked for cracks, chips, frayed leads, and wear. Many brushes incorporate a wear groove in order to help with inspection. The amount of wear groove visible indicates the service life remaining on the brushh"], "jumps": []}, {"id": "P3960", "text": ["5. The Growler is one piece of equipment the generator overhaul shop will use to check the armature coil for shorts and opens."], "jumps": []}, {"id": "P3970", "text": ["6. Alternators can be either gear driven or belt driven. Gear driven alternators must be removed from the engine to check the gear coupling. The gear coupling has a rubber insert that is designed to shear in the event the alternator abruptly stops with the engine running."], "jumps": ["P3999", "P3960"]}, {"id": "P3999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P3001", "P3970"]}, {"id": "P4001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P4020", "text": ["This experiment introduces the student to the concepts of DC Power Generation."], "jumps": ["P4030", "P4001"]}, {"id": "P4030", "text": ["Basic DC generator action is based on the principle that by passing a conductor through a magnetic field, a current or voltage is produced. In other words, a DC generator is the opposite of a DC Motor...."], "jumps": []}, {"id": "P4040", "text": ["In a DC generator, the shaft is driven, causing a current output from the rotor windings, called an armature. As the armature is rotated, the coils (conductor) cuts the magnetic field produced by the permanent magnet stator. 4-----"], "jumps": []}, {"id": "P4050", "text": ["As the coils cut the magnetic field, current flowing in the armature flows through the load producing a voltage drop across the load resistor. The voltage developed across the load resistor of a single loop, dual pole DC generator resembles the output of a full wave rectifier. Note: 95901432 Fig 9. Single loop, Double pole, DC Generator outputtttt"], "jumps": []}, {"id": "P4060", "text": ["The peaks in the output voltage wave are caused by the rotation of the armature. Near the 0 and 180-degree positions, the armature motion is parallel to the field and no magnetic lines are cut to produce and output voltage. 4$Note: 95901432 Fig 9. Single loop, Double pole, DC Generator outputttt"], "jumps": []}, {"id": "P4070", "text": ["Near the 90 and 270-degree positions, armature motion is perpendicular to the magnetic field and the maximum lines are cut producing the maximum voltage. Most DC generators use several armature loops to produce a smooth DC output voltage.."], "jumps": []}, {"id": "P4080", "text": ["In a double loop, or four pole, DC generator, the two loops are 90 degrees displaced from each other. Since both loops are connected to the same commutator and brushes, the two waveforms combine to produce a smoother DC level output voltage..."], "jumps": []}, {"id": "P4090", "text": ["Most aircraft DC generators have from 12 to 24 armature loops and from 24 to 48 poles. As more loops are added, the DC output ripple decreases until nearly a pure DC voltage level results. very little ripple lineeee"], "jumps": []}, {"id": "P4100", "text": ["The motor-generator set used in this experiment is contained on PC130-180. M1 is a PM (permanent magnet) motor. Switch S1, controls the power source (Int / Ext) to the motor (M1).."], "jumps": []}, {"id": "P4110", "text": ["The voltage divider circuit made up of R8 / R2 / D1 / D2 applies regulated power to the rotor windings of M1. The mechanical output of M1 drives the permanent magnet DC Generator (M2) shaft by a connecting wheel.."], "jumps": []}, {"id": "P4120", "text": ["The output voltage of the generator is routed through S4, which allows the insertion of an ammeter across TP4 and TP5 for current measurements. Switch S5 places a fixed load on the generator, the LED illuminates when the load is applied. Switch S6, places a variable load R7, on the generator....."], "jumps": []}, {"id": "P4130", "text": ["We will be driving one of the generator inputs to the PC130-736 Split-Bus distribution experiment card from the DC Generator. An ammeter will be used to monitor the current levels as more load is placed on the generator....."], "jumps": []}, {"id": "P4140", "text": ["Set the test console controls to the initial settings.gs. Press enter for e"], "jumps": []}, {"id": "P4150", "text": ["Carefully plug PC130-180 into the test console PC1 position and PC130-736 into the PC3 position. Connect the alligator to alligator from DC generator output at PC130-180 TP5 to Generator 1 input at PC130-736, TP1. EN, down S6 OPEN, down POTENTIOMETER POSITION R7 and R8 MID RANGE", "SWITCH POSITION S1 INT, to the left S2 OPEN, to the left S3 OPEN, to the left S4 OPEN, to the left S5 OPEN, down S6 OPEN, down POTENTIOMETER POSITION R7 and R8 MID RANGE", "Channel 1 - 50 mV per division, AC Time/Division - 1 mS Scope Probe - X10", "S1 - either 400 or 1 kHz S2 - Sinewave S3 - Int...z S2 - Sinewave S3 - Int. Sinewave S3 - Int.e Probe - X10 - X10100000!"], "jumps": []}, {"id": "P4160", "text": ["On the PC180-736, set the card switches as follows: ITCH POSITION S1 NC , to the left S2 OFF, to the left S3 OFF, to the left S4 NC, down", "Channel 1 - 50 mV per division, AC Time/Division - 1 mS Scope Probe - X10", "SWITCH POSITION S1 NC , to the left S2 OFF, to the Left S3 OFF, to the left S4 NC, downnnnnnnnnnnn10100000"], "jumps": []}, {"id": "P4165", "text": ["Press Enter to Set: Positive Supply Voltage - 12 Negative Supply Voltage - 12. Set Negative Supply Voltage to 12.e Supply Voltage to 12.Voltage to 12. ly Voltage to 12."], "jumps": []}, {"id": "P4170", "text": ["Press Enter to set: PC3 DC switch - ON ltage to PC3. er switch to ON. #"], "jumps": []}, {"id": "P4180", "text": ["PC3, 12 VDC power will be used to simulate the aircraft battery. Set, switch S2, Battery, on the PC130-736 card to ON. Notice that power is applied to BUS 2, Essential Bus, Emergency Bus, and the AC Essential Bus. Essential Bus...."], "jumps": []}, {"id": "P4190", "text": ["The Fuel Pumps, Gyroscopes, Emergency Lights, and Instruments LED's should illuminate. Notice, with the BUS TIE switch to the No Connect (NC) position, no power is provided to BUS 1.. Lights, Instrumentsts"], "jumps": []}, {"id": "P4200", "text": ["Press Enter to set: PC1 DC switch - ON PC1 position. er switch to ON. #"], "jumps": ["P4190"]}, {"id": "P4210", "text": ["Let's look at the current flow from the output of the DC generator during various load conditions. Connect an ammeter with alligator clips on the meter leads, to PC130-180 TP4 and TP5. sitive lead TP4 with a ???"], "jumps": []}, {"id": "P4220", "text": ["Set, switch S3, on PC130-180 to ON. The DC Generator should begin to run and apply power to the Generator 1 input on PC130-736. Notice, the ammeter reads about 0.02 Amps, and the Generator 1, Taxi Lights and Rotating Beacon LED's illuminate......"], "jumps": []}, {"id": "P4230", "text": ["The PC130-180 DC Generator will simulate Generator 1and apply power to BUS 1. Notice, the Battery is still providing power to BUS 2, Essential BUS, Emergency BUS and the AC Essential BUS...."], "jumps": []}, {"id": "P4240", "text": ["Now that Engine 1 and Generator 1 are running within limits, we can connect BUS 2 by setting the Bus Tie switch PC130-736, S4, to the connect (C) position. Notice, the ammeter still reads approximately 0.02 Amps.."], "jumps": []}, {"id": "P4250", "text": ["Turn the Battery Switch S2 on PC130-736 to OFF. Notice, power to BUS 2, Essential BUS, Emergency BUS and the AC Essential BUS is now provided by Generator 1, and that the ammeter now reads approximately 0.03 Amps. Note: PC130-736, Highlight S2 Turn off the Battery LED..."], "jumps": []}, {"id": "P4260", "text": ["Let's connect the NON-ESS BUS, (Non Essential Bus) to Generator. Set switch S1, PC130-736 to the connect (C) position. Notice the Galley and Blower LED's illuminate and the ammeter reads approximately 0.04 Amps......"], "jumps": []}, {"id": "P4270", "text": ["Most aircraft electrical systems utilize a Master Switch Solenoid to control electrical power distribution. During a generator failure, the Battery Relay contacts would automatically close to connect the battery to the battery BUS.....", "\" ##################################################################################################################################################################################################################################################################################################################################################################################################################################################################\"!###\"!#\"!#", "\"\" ##################################################################################################################################################################################################################################################################################################################################################################################################################################################################\"\"\"\"!\"!#\"!", "# ############################################################################################################################################################################################## !######", "!## #############################################################################################################################################################################################", "### ############################################################################################################################################################################################", "####### ##########################################################################################################################################################################################", "\"\"\" \"!###########################################################################################################################################################################################################", "################################################################################################################################ #########\"", "####### #########################################################################################################################################################################################", "####### ########################################################################################################################################################################################", "## #####!\"!#####################################"], "jumps": []}, {"id": "P4280", "text": ["Let's insert a generator failure to the PC130-180 card. Notice all power was removed from the PC130-736 card. Simulate the battery relay contact closing by switching PC130-736, S2, Battery to ON.."], "jumps": []}, {"id": "P4290", "text": ["During a generator failure, the Bus Tie Breakers, (BTB) would automatically disconnect the bus ties. Simulate the BTB relay action by setting PC130-736 Bus Tie switch S4 to the (NC) position. Notice the battery is supplying only Essential and Emergency power......"], "jumps": []}, {"id": "P4300", "text": ["Generator 1 power has been restored to BUS 1, however the battery is still supplying BUS 2. Simulate the BTB re-energizing by placing PC130-736, S4 to Connect (C). Simulate the Master Solenoid energizing the battery relay by placing PC130-736, S2 to OFF..to OFF...."], "jumps": []}, {"id": "P4310", "text": ["Press Enter to set DC power switch to OFF. Remove the PC130-180 card and replace it with the PC130-735 at PC1. Remove the PC130-736 card from PC3. Place the PC130-734 card at PC2."], "jumps": []}, {"id": "P4320", "text": ["On the PC130-735, set switches S1 and S2 to OFF and potentiometers, R3 and R4, fully counter-clockwise (CCW)."], "jumps": []}, {"id": "P4330", "text": ["On the PC130-734, set the card switches as follows: ITCH POSITION S1 OFF, to the left S3 OFF, Down CB1,CB2,CB3 RESET, In", "Channel 1 - 50 mV per division, AC Time/Division - 1 mS Scope Probe - X10", "SWITCH POSITION S1 OFF, to the left S3 OFF, Down CB1,CB2,CB3 RESET, Innn"], "jumps": []}, {"id": "P4340", "text": ["The test console AC power will be used to simulate multi-engine generator power to the PC130-735 card. AC power is supplied to PC1, on pins (B and C) and (G and H). Pin G, represents generator 1 and Pin C, represents generator 2....", "Chann
