sistive devices mounted on one heat sink. The four heat sensors are also mounted on the heat sink.."], "jumps": ["P410", "P300", "P420", "P400"]}, {"id": "P420", "text": ["In the first part of the experiment, you will measure the resistance and voltage output of the four heat sensors at two different temperatures."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["You will verify negative and positive resistance coefficients of the TH and RTD sensors."], "jumps": ["P440", "P410"]}, {"id": "P440", "text": ["Along with observing the voltage output of the TC and TD sensors (the TD sensor is a current device but, you will measure the voltage output of an op-amp)."], "jumps": ["P450", "P410"]}, {"id": "P14230", "text": ["3.  Using the temperature probe, hold its sensor to the heat sink\n     near R3 on PC130-252 for 1 to 2 minutes until the temperature \n     stabilizes.", "3. Using the temperature probe, hold its sensor to the heat sink near R3 on PC130-252 for 1 to 2 minutes until the temperature stabilizes."], "jumps": ["P14240", "P14220"]}, {"id": "P13290", "text": ["3.  Place S9 to the TC position.  \n4.  Using an voltmeter, measure the voltage output at TP10 to              ground.  This is the reference ambient temperature output of\n     TC. Type in the voltage rounded to the nearest tenth.", "3. Place S9 to the TC position. 4. Using an voltmeter, measure the voltage output at TP10 to ground. This is the reference ambient temperature output of TC. Type in the voltage rounded to the nearest tenth......................"], "jumps": ["P13280", "P13295", "P13292"]}, {"id": "P14152", "text": ["Make sure you are reading resistance and the ohmmeter is connected to TP1 and TP2 on PC130-252.  The answer should not conta", "Make sure you are reading resistance and the ohmmeter is connected to TP1 and TP2 on PC130-252. The answer should not conta+", "If the temperature of your classroom is extremely hot or cold, you may not get the correct reading, see your instructor.", "Make sure you are reading resistance and the ohmmeter is connected to TP1 and TP2 on PC130-252. The answer should not contain fractions."], "jumps": []}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1020", "text": ["In this experiment, you will observe the operation and measure the resistance and voltage output of typical heat sensors at two temperatures."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["The heat generators are mounted on the PC130-252 experiment card."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The test console supplies positive and negative DC voltage to the heat generators."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["Each heat generator is switched by S1 through S5."], "jumps": ["P1060", "P1030"]}, {"id": "P1060", "text": ["S6 is used to supply the negative voltage in the MAN position or used to supply a variable voltage when in the AUTO position."], "jumps": ["P1070", "P1030"]}, {"id": "P13160", "text": ["Due to the small change ioutput, you will measure the voltage output of the 747 op-amp at TP10.  S9 selects the heat sensor that is connected to the op-amp.", "Due to the small change ioutput, you will measure the voltage output of the 747 op-amp at TP10. S9 selects the heat sensor that is connected to the op-amp.I", "Due to the small change in output due to temperature changes, you will measure the voltage output of the 747 op-amp at TP10. S9 selects the heat sensor that is connected to the op-amp..."], "jumps": ["P13170", "P13150"]}, {"id": "P1160", "text": ["Due to the small change in output due to temperature changes, you will measure the voltage output of the 747 op-amp at TP10. S9 selects the heat sensor that is connected to the op-amp."], "jumps": ["P1170", "P1150"]}, {"id": "P2150", "text": ["2.", "2. .................................................................................................................... ld have measured around 0.50 volts depending on the temperature of your classroom.."], "jumps": ["P1370"]}, {"id": "P1379", "text": ["7.  Place S9 to the D position. \n8.  Using a voltmeter, measure the voltage output at TP10 to                ground.  This is the heated output of TD.", "7. Place S9 to the D position. 8. Using a voltmeter, measure the voltage output at TP10 to ground. This is the heated output of TD."], "jumps": ["P1380", "P1370"]}, {"id": "P1380", "text": ["Type in the measured voltage round off to the nearest tenth of a volt.  The reading is negative.", "Type in the measured voltage round off to the nearest tenth of a volt. The reading is negative."], "jumps": ["P1370", "P1385", "P1382"]}, {"id": "P1381", "text": [], "jumps": []}, {"id": "P1382", "text": ["Make sure you are reading voltage and the voltmeter is connected to TP10 and ground on PC130-252.", "If the temperature of your classroom is extremely hot or cold, you may not get the correct reading, see your instructor.", "MULTIMETER SETUP - Connect the leads between ground and TP10."], "jumps": []}, {"id": "P1387", "text": ["You still have not measured the correct voltage. You should have measured around -7.8 volts depending on the temperature of your classroom."], "jumps": ["P1380"]}, {"id": "P1390", "text": ["You have measured the outputs of the four heat sensors when heated."], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["Now, let's compare the measurements.", "Now, let's compare the measurements........................"], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["Look at the ambient and heated outputs of the RTD."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["What happened to the output resistance as the temperature increased?"], "jumps": ["P1400"]}, {"id": "P1421", "text": [], "jumps": []}, {"id": "P1422", "text": ["Look at the resistance values, the heated value is not lower than the ambient value.  The output did not decrease.", "Look at the resistance values, the heated value is not lower than the ambient value. The output did not decrease."], "jumps": []}, {"id": "P1423", "text": ["Look at the resistance values, the heated value is not the same as the ambient value.  The output did not stay the same.", "Look at the resistance values, the heated value is not the same as the ambient value. The output did not stay the same."], "jumps": []}, {"id": "P1430", "text": ["The RTD operated according to theory, it has a positive resistance coefficient.  As temperature increases, the output resistance increases.", "The RTD operated according to theory, it has a positive resistance coefficient. As temperature increases, the output resistance increases."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["Now, look at the ambient and heated outputs of the TH.", "Now, look at the ambient and heated outputs of the TH......"], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["What happened to the output resistance as the temperature increased?"], "jumps": ["P1440"]}, {"id": "P1451", "text": [], "jumps": []}, {"id": "P1452", "text": ["Look at the resistance values, the heated value is not higher then the ambient value.  The output did not increase.", "Look at the resistance values, the heated value is not higher then the ambient value. The output did not increase.."], "jumps": []}, {"id": "P1453", "text": ["Look at the resistance values, the heated value is not the same as the ambient value.  The output did not stay the same.", "Look at the resistance values, the heated value is not the same as the ambient value. The output did not stay the same."], "jumps": []}, {"id": "P1460", "text": ["The TH operated according to theory, it has a negative resistance coefficient.  As temperature increases, the output resistance decreases.", "The TH operated according to theory, it has a negative resistance coefficient. As temperature increases, the output resistance decreases.."], "jumps": ["P1470", "P1450"]}, {"id": "P1470", "text": ["Finally, look at the voltage outputs of the TC and TD.", "Finally, look at the voltage outputs of the TC and TD......"], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["The TC produced a higher voltage (more positive) output when the temperature increased."], "jumps": ["P1490", "P1470"]}, {"id": "P1490", "text": ["The higher temperature caused more electrons to move to the opposite ends of the different metals producing a higher difference in potential."], "jumps": ["P1500", "P1470"]}, {"id": "P1500", "text": ["The TD produced a voltage in the negative direction.", "The TD produced a voltage in the negative direction.hen the temperature increased...eased......"], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["The higher temperature caused more leakage current to flow through the PN junction."], "jumps": ["P1520", "P1500"]}, {"id": "P1520", "text": ["Notice how the four heat sensors responded to the change in temperature."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["1.  Disconnect test equipment from the circuit.  \n2.  Return the Test Console controls to their initial control                     settings.", "1. Disconnect test equipment from the circuit. 2. Return the Test Console controls to their initial control settings."], "jumps": ["P1520"]}, {"id": "P1540", "text": ["3.  Set the Test Console Power to OFF.", "3. Set the Test Console Power to OFF.F...................."], "jumps": ["P1530"]}, {"id": "P1550", "text": ["4.  Carefully remove PC130-252 card.  \n5.  Return all equipment to its proper storage area.", "4. Carefully remove PC130-252 card. 5. Return all equipment to its proper storage area."], "jumps": ["P1910", "P1540"]}, {"id": "P13291", "text": ["This completes the experiment on HEAT TRANSDUCERS.", "This completes the experiment on HEAT TRANSDUCERS.E........"], "jumps": []}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text":  through S5 are DOWN.  \n9.  Place PC2 Power switch to ON.", "8. Ensure that S1 through S5 are DOWN. 9. Place PC2 Power switch to ON..", "If S1 through S5 are NOT DOWN, the heat generators will begin to heat. This will cause errors in measurements for this part of the experiment."], "jumps": ["P2100"]}, {"id": "P2120", "text": ["The heat generators are off and the circuits are set up.  You will first measure the temperature of the heat sink and the outputs of the heat sensors at ambient temperature.  Make sure S1 through S5 are down.  If power was applied to the heat generators, turn power off and wait 30 minutes before continuing.", "The heat generators are off and the circuits are set up. You will first measure the temperature of the heat sink and the outputs of the heat sensors at ambient temperature. Make sure S1 through S5 are down. If power was applied to the heat generators, turn power off and wait 30 minutes before continuing."], "jumps": ["P2130", "P2110"]}, {"id": "P14251", "text": [], "jumps": []}, {"id": "P2140", "text": ["Type in the measured temperature in fahrenheit.  Be accurate to the tenth of a degree.  This is the ambient temperature of the heat sink, around the room temperature.  Normally, this is about 78 degrees F.", "Type in the measured temperature in fahrenheit. Be accurate to the tenth of a degree. This is the ambient temperature of the heat sink, around the room temperature. Normally, this is about 78 degrees F................................."], "jumps": ["P2130", "P2800"]}, {"id": "P2141", "text": [], "jumps": []}, {"id": "P2147", "text": ["You still have not measured the correct resistance.  You should have measured around 80 degrees depending on the temperature of your classroom.", "You still have not measured the correct resistance. You should have measured around 80 degrees depending on the temperature of your classroom."], "jumps": ["PutVar"]}, {"id": "P14270", "text": ["6.  Place S9 to TC position.  \n7.  Using an voltmeter, measur let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
