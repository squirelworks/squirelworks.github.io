<script>
const book = {"title": "9395Z824", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ..........."], "jumps": []}, {"id": "P1", "text": ["Title: MULTI-ENGINE AIRCRAFT POWER DISTRIBUTION SYSTEMS", "Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P10", "text": ["MULTI-ENGINE AIRCRAFT POWER DISTRIBUTION SYSTEMS"], "jumps": []}, {"id": "P100", "text": ["w Observe the operation of a Split-Bus Distribution System. w Identify faults in a basic Split-Bus Distribution System.", "w Describe the operation of a parallel bus power distribution system. w Identify the components of a parallel bus power distribution system....", "w Describe the operation of a split-bus power distribution system. w Identify the components of a split-bus power distribution system....c", "3. Split-Bus Power Distribution Experimentline item 2 here. item 2 here.e.e.", "2. Parallel Bus Power Distributionctive 1 line item 2 here. item 2 here.e.e.", "1. Split-Bus Power Distributionbjective 1 line item 2 here. item 2 here.e.e."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P330", "text": [], "jumps": ["P"]}, {"id": "P331", "text": [], "jumps": []}, {"id": "P400", "text": ["Large multi-engine aircraft typically have a power generation device attached to each engine accessory drive section. Together, the power generation devices provide power to all of the electrical and electronic components throughout the aircraft."], "jumps": []}, {"id": "P410", "text": ["It would be very costly and dangerous to connect each electrical component directly to the power generation device."], "jumps": []}, {"id": "P420", "text": ["To reduce costs, lighten the aircraft, and provide efficient power; aircraft are designed with power distribution systems that safely route power to electrical and electronic systems throughout the aircraft..."], "jumps": []}, {"id": "P430", "text": ["In this lesson you will learn about the types of aircraft power distribution systems used in large multi-engine aircraft. You will be able to define how they are designed, identify system components and explain their purpose, and describe how each type of system operates..."], "jumps": []}, {"id": "P440", "text": ["Let's begin our lesson on MULTI- ENGINE AIRCRAFT POWER DISTRIBUTION SYSTEMS."], "jumps": ["P430"]}, {"id": "P900", "text": ["3. Split-Bus Power Distribution Experiment"], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Multi-engine aircraft generate power for all electrical and electronics systems using a generator or alternator mounted on each engine. The Power Distribution System routes power to all of the electrical and electronic components on the aircraft."], "jumps": []}, {"id": "P1030", "text": ["Basic power generation systems connect the engine power generation device to a main bus. From there, the power is distributed to the aircraft systems through circuit breakers, relays, and specialized busses..."], "jumps": []}, {"id": "P1040", "text": ["One type of Multi-engine power distribution system is the Split-bus Power Distribution system. This system is configured much like several independent basic generation systems. Each generating device powers its own distribution system. The various electrical systems are \"split\" between the independent busses....."], "jumps": []}, {"id": "P1050", "text": ["Split-bus power generation systems are very common on twin engine transport aircraft like the B737, B757, B767, B777, DC9, MD80, and A320."], "jumps": []}, {"id": "P1060", "text": ["The split bus distribution system connects each generator to one main bus, but never to both busses at the same time. This eliminates the need for generator paralleling since the two sources never power the same bus..."], "jumps": []}, {"id": "P1070", "text": ["Typically, number one (#1) loads are connected to the #1 Main Bus and number two (#2) loads are connected to the #2 Main Bus. For example, the #1 Flight Director system would be connected to the #1 bus..."], "jumps": []}, {"id": "P1080", "text": ["Common loads that do not have a second redundant system, such as Lighting, Landing Gear, and Radar systems are distributed between the two busses so that they draw equal loads from each bus..."], "jumps": []}, {"id": "P1090", "text": ["There are two classifications of power distribution busses; the Non-Shed Bus, often called the Essential bus, and the Shed Bus, often called the Non-essential bus. Non-essential busses are connected to the Main bus by Shed Relays..."], "jumps": []}, {"id": "P1100", "text": ["Before we learn about how a split-bus power distribution system works, let's look at some of the components that make up the system. As we learned, each split bus system is powered by a generator or alternator..."], "jumps": []}, {"id": "P1110", "text": ["In most large aircraft, an AC brushless generator provides the power. Each generator is connected to a constant speed drive system to ensure a frequency of 400 Hz."], "jumps": []}, {"id": "P1120", "text": ["Similar to the DC bus of small aircraft, the AC bus is an electrical power distribution point where several circuits are connected. It is often a solid metal strip having a number of terminals installed on it that allow connection to the circuits..."], "jumps": []}, {"id": "P1130", "text": ["The main distinction of an AC bus is that it has a bus bar for each phase of the AC signal. To keep block diagrams simple, drawings typically show the phases as one line with three slashes for three phase power and a line with one slash for single phase power. DC power will have no slashes..."], "jumps": []}, {"id": "P1140", "text": ["On modern split bus systems, a Generator Breaker (GB), connects the generator to the associated bus. GB 1 connects the #1 generator to the #1 Main bus and GB 2 connects the #2 generator to the #2 Main bus..."], "jumps": []}, {"id": "P1150", "text": ["The Generator Breaker is a heavy duty power relay used to control high voltages. The contacts of the generator breaker are thick so the GB is capable of handling high levels of current. The GB has three separate contacts, one for each phase, and uses low voltage DC to control it..."], "jumps": []}, {"id": "P1160", "text": ["The Generator Breaker, is controlled by the Generator Control Unit (GCU) and/or the Bus Controller. It automatically disconnects the generator from its associated bus during engine shutdown or generator failure.It can also disconnect the generator when commanded to do so from the pilot using a switch in the cockpit....."], "jumps": []}, {"id": "P1170", "text": ["The Generator Breaker can also disconnect the generator when commanded to do so from the pilot using a switch in the cockpit."], "jumps": ["P"]}, {"id": "P1180", "text": ["The Bus Tie Breakers (BTB) are primarily used to connect Main Bus #1 and Main Bus #2 to external power or auxiliary power unit power. On some aircraft split bus systems, the BTB is also used to connect the # 1 and # 2 busses together during a generator failure..."], "jumps": []}, {"id": "P1190", "text": ["Bus Tie Breakers are controlled by a bus controller or electrical panel switches in the cockpit.."], "jumps": []}, {"id": "P1200", "text": ["The two generators never power the same bus at the same time.", "Split Bus systems are in configured series.", "The Transfer Relay system provides automatic paralleling.", "Why don't generators on a Split Bus system have to be paralleled?"], "jumps": ["P1190"]}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1202", "text": ["The Transfer Relay does not provide a paralleling function."], "jumps": []}, {"id": "P1203", "text": ["Split Bus systems are parallel redundant systems..........."], "jumps": []}, {"id": "P1210", "text": ["What controls the Generator Breaker when an associated generator failure is imminent?"], "jumps": ["P1200"]}, {"id": "P1211", "text": [], "jumps": []}, {"id": "P1212", "text": ["The cockpit switch can manually open the GB and disconnect the generator, however, human response would not be quick enough to avoid electrical system damage associated with a failing generator."], "jumps": []}, {"id": "P1213", "text": ["The Transfer Relay System is used to regain power to the main busses after the GB has removed the faulty generator from the main bus. It does not control the GB."], "jumps": []}, {"id": "P1220", "text": ["The Transfer Relay is used in large multi-engine aircraft split bus power distribution systems to reconnect essential loads to a power source in the event the bus's associated generator fails.ails...", "WW )WWWWWWWW 'WWWWWWWWWWWWWWWWWWWWWWWWWW", "WWWW$(WW$(WW $ (5W//WW$(W3$$/2W//WW($$8W:$:W", "WW 8 823 (WW((' (WW) 'W',,(W) 32W) 8 JUU", "W) (WWWWWWWWWWWWWWWWWWWWWWW23 2WWWWWWWWW", "WWW'() WWWWW( 8WWWWWWWWWWWWWWWWWWWWWWWWWWWWW", "WWWWWWWWWWWWWWWWUUUWWWWWWWWWWWWWWWWWWWWWWWWW ,WWWWWWWWWWWWWWWWUUUWWWWWWWWWWWWWWWW", "4 *$WW,45WWWWWWWWWWWWWWWUUUWWWWWWWWWWWWWWWW", "'25$-:) )W' WWWWWWWWWWWWWWUUUWWWWWWWWWWWWWWWW", "WWWWWWWWWWWWWWWWUUUWW' :WWWWWWW) )WWWWWWWWWWWWWWWWWWWWWWWWWUUUWWWWWWWWWWWWWWWW", "WWWWWWWWWWWWWWWWUUUWWWW((WW((WW' )((W 'W((W23 8WW 'WW' (WW((WWUUUWWWWWWWWWWWWWWWW", "WWWWWWWWWWWWWWWWUUUWW ,, WW))W:')WWWW):WWW:'2WW"], "jumps": []}, {"id": "P1230", "text": ["We will look at Transfer Bus systems in detail in the next section."], "jumps": []}, {"id": "P1240", "text": ["Now that we have an understanding of the components of a split bus power distribution system, let's look at how a split bus power distribution system operates."], "jumps": ["P", "Pe", "PP", "PPP", "PXC", "PPi"]}, {"id": "P1250", "text": ["In today's aircraft, operation of the power distribution systems is completely automated. Gone are the days of the flight engineer, who was responsible for manually operating the power distribution system."], "jumps": []}, {"id": "P1260", "text": ["Large multi-engine aircraft are now designed to support a two person cockpit. Automation of the power distribution system control and fault detection allows for increased safety and dramatically decreases the cockpit workload.ically decreases the cockpit workload..."], "jumps": []}, {"id": "P1270", "text": ["Several types of automated split bus power distribution systems are currently in service. We will look at two of the most common types; the Line Contactor controlled and Transfer Bus split bus systems..."], "jumps": []}, {"id": "P1280", "text": ["During normal operation in the line contactor controlled system, the number 1 engine is started and brought up to speed. If the GCU senses the proper power generation output, it activates the Line Contactor and connects the generator to the distribution system..."], "jumps": []}, {"id": "P1290", "text": ["The sequence is duplicated on the #2 side as the #2 generator comes up to speed."], "jumps": []}, {"id": "P1300", "text": ["As long as both generators are functioning normally, all systems will be powered in this split bus configuration."], "jumps": []}, {"id": "P1310", "text": ["During a #1 engine failure the #1 GCU senses that the #1 Generator is not providing enough power. It immediately opens the #1 Line Contactor which opens the Shed Relay."], "jumps": []}, {"id": "P1320", "text": ["Instantaneously, the #2 generator begins powering the #1 Main Bus through the normally closed (power off) contacts of the #1 line contactor. To reduce the load on the #2 generator, notice that the shed relay has opened and removed the non-essential loads..."], "jumps": ["P"]}, {"id": "P1330", "text": ["To relieve additional loads on the #2 generator, the #1 Inverter could be selected. The non-essential shed bus loads will continue to be disabled."], "jumps": ["P"]}, {"id": "P1340", "text": ["From the #1 Generator through the energized #1 Line Contactor, de-energized External Power relay, and de-energized # 2 Line Contactor.", "From the #1 Generator through the energized #1 Line Contactor and the energized External Power relay, and the energized # 2 Line Contactor.", "From the #1 Generator through the de-energized #1 Line Contactor.", "If the #2 Generator failed, how would the #2 Main Bus get its power?"], "jumps": ["P1330"]}, {"id": "P1341", "text": [], "jumps": []}, {"id": "P1342", "text": ["The #1 Line Contactor is energized. As long as the #1 Generator is functioning properly, the GCU will energize the #1 Line Contactor."], "jumps": []}, {"id": "P1343", "text": ["The External Power Relay will not be energized while the aircraft is in the air and the external power unit is not connected."], "jumps": []}, {"id": "P1350", "text": ["De-energizing the shed relay and using an inverter", "De-energizing the shed relay and the 26 VAC Transformer", "Energizing the shed relay and using an inverter", "What are two methods of reducing the load during single generator operation?"], "jumps": ["P1340"]}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1352", "text": ["Energizing the shed relay would add additional loads to the already strained functioning generator."], "jumps": []}, {"id": "P1353", "text": ["You would not want to de-energize the 26 VAC transformer. That load usually powers critical instruments and avionics systems."], "jumps": []}, {"id": "P1360", "text": ["When an aircraft is on the ground and the engines are not running, power is typically provided by an external power source. The Line Contactor type Split Bus power distribution system uses a relay to connect the external power to both Main Busses..."], "jumps": []}, {"id": "P1370", "text": ["A shed bus override switch in the cockpit allows powering of the non-essential loads while connected to external power."], "jumps": ["P"]}, {"id": "P1380", "text": ["The Transfer Bus type split bus system utilizes Bus Tie Breakers (BTB) and Transfer Busses to distribute generated power throughout the aircraft.", "OOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOO3 3OOOOOOOOOOOOOOOOOOOO", "OOOOOOOOOOO3 3OOOOOOOOOOOOOOOOOOOO", "OOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOO 3OOOOOOOOOOOOOOOOOOOOO"], "jumps": []}, {"id": "P1390", "text": ["During normal Transfer Bus system operation, the GCU allows power to be supplied to associated transfer bus through the closed contacts of the Generator Breakers (GB) and the Transfer Relays...."], "jumps": []}, {"id": "P1400", "text": ["Since both generators are on line, power is also provided to the non-essential or shed bus through the Transfer Relays. As long as the generators are operating within normal parameters, the Transfer Bus system will continue to operate in this configuration..."], "jumps": []}, {"id": "P1410", "text": ["During an engine or generator failure the associated cockpit generator light would begin to flash red or otherwise give an indication of a failed generation system."], "jumps": []}, {"id": "P1420", "text": ["During a #2 generator failure, for example, the #2 GCU will sense a problem and disconnect the faulty generator from the power distribution system. It does this by removing DC control power from the #2 GB. At the same time, the #2 GCU will remove DC control power from the #2 Transfer Relay..."], "jumps": []}, {"id": "P1430", "text": ["Notice that when the #2 Transfer Relay opens, both non-essential busses lose power. The #2 non-essential bus loses power because its associated generator failed and #1 non-essential bus loses power by the opening of the #2 Transfer Relay..."], "jumps": []}, {"id": "P1440", "text": ["Instantaneously, when the #2 Transfer Bus opens, power from the #1 Main bus powers the #2 Transfer Bus through the normally closed (when un-powered) contacts of the #2 Transfer Relay. This happens in a micro-second from when the generator fails..."], "jumps": []}, {"id": "P1450", "text": ["The non-essential busses will continue to be disconnected until another power source is available. If in flight, the Auxiliary Power Unit (APU) can be started to provide power to the #2 side of the distribution system. Let's see how that works..."], "jumps": []}, {"id": "P1460", "text": ["When the APU is started and the APU GCU senses correct power, the APU GCU DC control power will close the APU GB and apply APU AC power to the #1 and #2 BTB's."], "jumps": []}, {"id": "P1470", "text": ["Once power reaches the #2 BTB, the bus controller will automatically close the #2 BTB and energize the #2 Transfer Relay. APU AC power will be routed to the #2 Main Bus and the #2 Transfer Busss"], "jumps": []}, {"id": "P1480", "text": ["As APU power is being routed to the #2 Transfer Bus, it is also making its way back to the #2 non-essential bus. Since the #2 Transfer Relay is once again energized, power is also restored to the #1 non-essential bus from the #1 Main Bus..."], "jumps": []}, {"id": "P1490", "text": ["On the ground, with engines shut down, the Transfer Bus Split Bus system can use either the APU or an External Power connection to power the aircraft systems. If External Power is used, the External Power Monitor ensures that the power from the external source is correct before allowing it on to the aircraft..."], "jumps": []}, {"id": "P1500", "text": ["If correct power is ready, a green light in the cockpit will illuminate. An \"Ext Pwr\" switch in the cockpit sends a signal to the bus controller which closes the #1 and #2 BTB's and energizes the #1 and #2 Transfer Relays. Power is then routed to all busses..."], "jumps": []}, {"id": "P1510", "text": ["Generators are not paralleled in a Split Bus system.", "To ensure that the frequency remains at 400 Hz.", "To ensure a balance of power on the bus.", "In a Split Bus Power Distribution System, why is it important to parallel the generators?"], "jumps": ["P1500"]}, {"id": "P1511", "text": [], "jumps": []}, {"id": "P1512", "text": ["In a split bus system, the generators never share a load so balancing is unimportant."], "jumps": []}, {"id": "P1513", "text": ["Constant speed drive units ensure that the frequency remains at 400 Hz, not the generators themselves."], "jumps": []}, {"id": "P1520", "text": ["Connect APU power to the failed bus in an emergency.", "Connect External Power to the APU Bus during ground operations.", "Transfer power from the #1 Main Bus to the #2 Main Bus in the event the #2 generator fails.", "In a Transfer Bus type Split Bus system, Bus Tie Breakers are used to ________."], "jumps": ["P1510"]}, {"id": "P1521", "text": [], "jumps": []}, {"id": "P1522", "text": ["As soon as a generator fails, the Transfer Relay provides power from the good Main Bus to the failed Transfer Bus. The BTB is not used in during a generator failure until the APU is bought on line. Then it provides power to the failed bus."], "jumps": []}, {"id": "P1523", "text": ["The APU does not have a separate bus system. The External Power provides power through the BTB's to both Main Busses, Transfer Busses and Non-essential Busses."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on SPLIT BUS POWER DISTRIBUTION."], "jumps": ["P1520", "P1001"]}, {"id": "P1920", "text": ["1. Multi-engine aircraft generate power for all electrical and electronic systems using alternators or generators mounted on each engine accessory gearbox. Typically, large commercial twin engine aircraft use a Split Bus Power Distribution system."], "jumps": ["P1001", "P1930"]}, {"id": "P1930", "text": ["2. A Split Bus Power Distribution System divides the loads evenly among both generators. Each generator is responsible for its own individual distribution bus system."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. There are many types of Split Bus systems, however, two types are most common; the Line Contactor Controlled Bus and the Transfer Bus systems..s own individual distribution bus system."], "jumps": ["P1930", "P1950"]}, {"id": "P1950", "text": ["4. Line Contactors are used in many Split bus Power Distribution Systems to distribute power to the main busses. and the Transfer Bus systems..s own individual distribution bus system."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. During normal operation the line contactors, controlled by the GCU, are closed to allow each generator to power an associated bus. When one generator fails, the line contactor automatically routes power from the good system to the failed system...."], "jumps": ["P1950", "P1980"]}, {"id": "P1970", "text": ["6. Transfer Bus Split Bus Power Distribution systems use Transfer Relays to route power to the Transfer and Non- Essential busses. When one generator fails, the Transfer Relay sheds non-essential loads and provides power from the good Main Bus to the failed Transfer Bus..."], "jumps": ["P1960", "P1980"]}, {"id": "P1980", "text": ["7. The APU can be started in flight to power the failed Transfer Bus through the Bus Tie Breaker (BTB). Once APU power is connected, non-essential loads can be brought back on line.."], "jumps": ["P1970", "P1999"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": []}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["Multi-engine aircraft with three or four engines, use a Parallel Bus distribution system. The DC10, L1011, B727, and early models of the B747 all use a parallel bus power distribution configuration."], "jumps": []}, {"id": "P2030", "text": ["Like the Split Bus system, during normal operations the Parallel Bus system ties each generator to a unique bus. The difference is that all busses are connected together.", "lllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllk jjjjjjjj$ #", "lllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllk jjjjjjjjj$ j.>jjjj$k3jjjjjkkkkk", "j0k##k jjjj+ k. #k jjjjjjjjjjjjjjjj#&lll", "kjjjjjjjjjjjjjjjj0 j3>3k??k>jjjjjjjjjjjj"], "jumps": []}, {"id": "P2040", "text": ["To connect all of the busses together, the Parallel Bus system employs a Tie Bus, also called the Synchronizing Bus. The Tie Bus is common to all generators so each generator must be at the same voltage, phase, and frequency at all times..."], "jumps": []}, {"id": "P1230", "text": ["We will look at Transfer Bus systems in detail in the next section."], "jumps": []}, {"id": "P2060", "text": ["During normal operation, each generator powers its own bus through the associated Generator Breaker (GB) and contributes to the Tie Bus through its Bus Tie Breaker (BTB)."], "jumps": []}, {"id": "P2070", "text": ["In the event that a generator fails, the Generator Control Unit (GCU), sensing the faulty condition, will open the (GB) for the faulty generator and isolate it from its bus."], "jumps": []}, {"id": "P2080", "text": ["Notice that the Bus Tie Breaker (BTB) for the #3 system does not open. It allows the Bus Tie power to continue powering the #3 Bus."], "jumps": []}, {"id": "P2090", "text": ["To relieve the remaining operational generators of the extra load, the crew can elect to start the APU and direct its generator output to assist in powering the Tie Bus. ."], "jumps": []}, {"id": "P2100", "text": ["When the APU generator is up to speed, the APU GCU will close the APU GB and add its power to the Tie Bus."], "jumps": []}, {"id": "P2110", "text": ["As with most aircraft power distribution systems, the pilot can elect to reduce the load on the system by turning off non-essential equipment or opening the shed bus. On some aircraft each generator bus will have a non-essential load shed bus connected to it and on other aircraft a single non-essential bus is connected to the Tie Bus....."], "jumps": []}, {"id": "P2120", "text": ["Another possible condition in a Parallel Bus system is a Bus short. If one of the individual busses senses a short to ground in any of its supporting systems, the associated GB and BTB will open isolating the bus from the rest of the distribution system..."], "jumps": []}, {"id": "P2130", "text": ["In a bus short condition, those system loads unique to the faulted bus cannot be recovered, even if the APU generator is brought on line."], "jumps": []}, {"id": "P2140", "text": ["Providing external power to an aircraft configured with a Parallel Bus system is very similar to the Split bus system. In fact, most service personal do not know which type of system is actually powering the aircraft when they connect external power...", ";^ q\"\"\"\"\"\"\"\")\"\"))\"))\")\"w)))w\"===w))wBVCA"], "jumps": ["PPPPCCA", "PP", "PPC", "PAG02", "P", "PI"]}, {"id": "P2150", "text": ["The External Power Monitor senses correct supplied power and will illuminate an Ext Pwr Ready light in the cockpit. When External Power is selected in the cockpit, the Ext Pwr Breaker and BTBs close routing external power to all busses..."], "jumps": []}, {"id": "P2160", "text": ["The generator breakers remain open isolating the generators from the external power. The non-essential loads can be powered by engaging the shed bus relay through a shed bus override switch in the cockpit..."], "jumps": []}, {"id": "P2170", "text": ["All generators are connected to a common bus and therefore must be balanced with each other to avoid being removed from the system.", "Only the main generators need to be paralleled. The APU generator does not because it is only used in emergencies.", "It is not necessary to parallel the generators since they each power a unique bus.", "Why is it important to parallel all generators in a Parallel Bus Distribution System?"], "jumps": ["P2160"]}, {"id": "P2171", "text": [], "jumps": []}, {"id": "P2172", "text": ["The generators do power a unique bus, however they are also connected to the Tie Bus which is a common bus."], "jumps": []}, {"id": "P2173", "text": ["The APU must be paralleled to the other generators as long as one of the main generators is powering the Tie Bus. An unparalleled APU generator could cause power problems and cause good generators to be removed from the system."], "jumps": []}, {"id": "P2180", "text": ["The pilot of an MD11 reports that during the flight the #1 Generator Breaker and the #1 Bus Tie Breaker opened. Despite starting the APU and reducing the non-essential loads, he could not recover the loads on the #1 bus. What would be the most likely cause of this problem???"], "jumps": ["P2170"]}, {"id": "P2181", "text": [], "jumps": []}, {"id": "P2182", "text": ["If the #1 Generator or #1 GCU failed, the Tie Bus would automatically connect to the #1 Bus. Starting the APU would also ensure adequate power."], "jumps": []}, {"id": "P2183", "text": ["If the #1 Bus Tie Breaker was faulty, the # 1 Generator would still be capable of powering the #1 Bus."], "jumps": []}, {"id": "P2190", "text": ["The Modified (Parallel) Split Bus distribution system is a hybrid of the Split Bus and Parallel Bus systems. This system is common on the newer 4 engine aircraft like the B747-400."], "jumps": ["Parallel"]}, {"id": "P2200", "text": ["The Modified Split Bus system is basically two parallel systems joined by a Split System Breaker. During normal operation left side generators are paralleled to each other, powering their own busses and Tie Bus 1 2...", "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb gdhhhhhhcghhhhhhhhh", "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb gdhhhhhhcghhhhhhhhhhhhhhh"], "jumps": []}, {"id": "P2210", "text": ["The right side generators are also paralleled to each other and power their own busses as well as the Tie Bus 3 4."], "jumps": ["P", "P6"]}, {"id": "P2220", "text": ["The two Tie Busses are connected by a Split System Breaker (SSB). When the SSB open, the two Tie Busses are independent. When the SSB is closed all four generators are paralleled..."], "jumps": ["P", "P6"]}, {"id": "P2230", "text": ["In the event of a generator failure, the associated GCU will open the GB for that generator. The paired generator then takes the load for both. At the same time, the associated Shed Relay will open and reduce the non-essential loads on that side..."], "jumps": []}, {"id": "P2240", "text": ["If both generators on one side fail, the Split System Breaker closes and provides power to both failed busses. The non-essential load on the good side would also be disconnected by the associated Shed Relay. If needed, the non-essential systems can be brought back online using the Shed Bus Override switch in the cockpit....."], "jumps": []}, {"id": "P2250", "text": ["The APU can be used to power the failed Tie Bus independently, reducing the load on the remaining two generators. APU power will be routed to the Tie Bus through the failed side SSB. Since the APU is never actually connected to the Tie Bus with the generators, it is not necessary to parallel the APU to the main busses....."], "jumps": []}, {"id": "P2257", "text": ["On the ground, the APU or External power can power both Tie Busses through the SSB when all generators are off line. Just like the other distribution systems, the APU GCU and the External Power Monitor will ensure the power is correct before applying it to the tie busses...", "qqqqqqqnpnqqpA 99 hpG So", "oo qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqnlnqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq", "oo qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq", "oo qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqplqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq", "oo qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqplqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqlp", "oo qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqplqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq", "oo qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq", "o qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqlp", "o qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqnp l", "oo qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqdp"], "jumps": []}, {"id": "P2260", "text": ["The #2 BTB remains closed and the #1 2 Tie Bus provides #1 Generator power to the #2 bus.", "The #2 BTB and #2 GB will open, isolating the #2 bus.", "The SSB will close and the #3 4 Tie Bus will provide power to the #2 bus.", "In the Modified Split Bus distribution system below, if the #2 generator fails, how does the #2 Bus continue providing power to its loads?"], "jumps": ["P2257"]}, {"id": "P2261", "text": [], "jumps": []}, {"id": "P2262", "text": ["The SSB will remain open as long as one generator is powering each Tie Bus."], "jumps": []}, {"id": "P2263", "text": ["Although the #2 GCU will open the #2 BG, the #2 BTB will remain closed connecting the #1 2 Tie Bus to the #2 Bus."], "jumps": []}, {"id": "P2270", "text": ["The pilot of a transatlantic flight reports to maintenance in France that the #4 Generator disconnected in flight and he could not get the #4 bus systems back on line, even after starting the APU and trying the Split Bus Breaker connection. What could cause this problem?"], "jumps": ["P2260"]}, {"id": "P2271", "text": [], "jumps": []}, {"id": "P2272", "text": ["If the #4 GCU failed, it would remove the #4 Generator from the system, however, the #4 bus would continue to be powered by the #3 4 Tie Bus."], "jumps": []}, {"id": "P2273", "text": ["If the #3 4 Tie Bus failed, the #4 Generator would still provide power to the #4 Bus."], "jumps": []}, {"id": "P2280", "text": ["Great Job! You remembered how a bus short looks on a Parallel Bus system. You will find that the Modified Split Bus system will experience the problems of both the Split Bus and Parallel Bus systems..."], "jumps": []}, {"id": "P2910", "text": ["You have completed the information on PARALLEL BUS POWER DISTRIBUTION."], "jumps": ["P2280", "P2001"]}, {"id": "P2920", "text": ["1. Parallel Bus Distribution Systems are utilized on large Multi- engine aircraft designed with 3 or 4 engine-driven generators. These aircraft include the DC10, L1011, B727, and early versions of the B747."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2. Like the Split Bus system, the Parallel Bus system ties each generator to an associated bus during normal operations. This bus is called the Tie Bus."], "jumps": []}, {"id": "P2940", "text": ["3. If a generator fails, the generator's GCU opens the Generator Breaker and removes it from its bus. The failed generator's bus is immediately powered by the remaining generators via the Tie Bus.."], "jumps": []}, {"id": "P2950", "text": ["4. The Tie Bus provides APU and external power to each bus during engine out operations. The Generator Breakers open during external power operations to protect the generators...", "YYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYY \\ DYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYY", "YYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYY \\ DYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYY"], "jumps": []}, {"id": "P2960", "text": ["5. If an individual bus experiences a short, both the Generator Breaker and the Bus Tie Breaker for that bus will open and isolate the fault from the generator and Tie Bus."], "jumps": []}, {"id": "P2970", "text": ["6. Four engine aircraft, such as the B747-400, are often designed with a Modified Split Bus power distribution system. The Modified Split Bus system combines the Split Bus and the Parallel Bus Systems."], "jumps": []}, {"id": "P2980", "text": ["7. During normal operations the #1 and #2 generators are paralleled together and power their individual busses and a shared Tie Bus. The #3 and #4 generators are paralleled together and power their individual busses and a shared Tie Bus that is isolated from the #1 and #2 Tie Bus."], "jumps": ["P", "P6"]}, {"id": "P2990", "text": ["8. If one generator fails, its paralleled generator will provide power to its bus. If both generators on a side fail, a Split System Breaker will open and provide power to both failed generators' busses."], "jumps": []}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2980", "P2001"]}, {"id": "P3001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P3020", "text": ["In this experiment, you will look at the basic operation of a Split- Bus Distribution system. By understanding this operation, troubleshooting of a faulty system can be quick and effective."], "jumps": ["P3030", "P3001"]}, {"id": "P3030", "text": ["The circuits are mounted on two circuit cards. The controls, components and indicators represent different sections of an aircraft Split-Bus system."], "jumps": ["P3020", "P3040"]}, {"id": "P3040", "text": ["Pick up and examine the PC130-735 card. This card is the AC to DC generator system which provides two balanced DC voltages. We will be using both voltage sources for this experiment..."], "jumps": []}, {"id": "P3050", "text": ["Switches S1 and S2 are used to turn on and off the output of the generators. The output we will be using is two 12 volt DC sources."], "jumps": ["P3060", "P3040"]}, {"id": "P3060", "text": ["The PC130-736 card is the Split-Bus Distribution system. Pick it up and examine it."], "jumps": ["P3040", "P3070"]}, {"id": "P3070", "text": ["There are seven different busses represented on this card. The bus to the far left is the battery bus. This bus connects the battery output to the generator 2 and emergency busses."], "jumps": ["P3080", "P3060"]}, {"id": "P3080", "text": ["S2 and S3 are the switches used to distribute the power from the battery. Remember, the battery should only be used to start the aircraft or when the aircraft generators fail."], "jumps": ["P3090", "P3060"]}, {"id": "P3090", "text": ["The next two busses, bus 1 and bus 2, are the generator busses. The input to these busses is the output from the generators. Notice that there is a switch between the two busses."], "jumps": ["P3060", "P3100"]}, {"id": "P3100", "text": ["In normal operation this switch should be in the NC (not connected) position. This in effect separates the two busses from each other."], "jumps": ["P3110", "P3060"]}, {"id": "P3110", "text": ["The only time the busses would need to be connected is if one of the generators became faulty and were disconnected from the system."], "jumps": ["P3120", "P3060"]}, {"id": "P3120", "text": ["Switch S1 is a non-essential disconnect switch. This removes all power from the non-essential loads. This is important when power is limited. Remember, the non-essential bus applies power to loads that are not necessary for safe flight."], "jumps": ["P3130", "P3060"]}, {"id": "P3130", "text": ["The second bus connects to the essential and emergency busses. This is the most important bus of the Split-Bus Distribution system. The battery switch connects or disconnects battery power to this bus."], "jumps": ["P3060", "P3140"]}, {"id": "P3140", "text": ["The emergency bus connects directly to the essential busses. This bus can be powered by the generator bus or directly from the battery through S3. If a generator bus becomes damaged, this is an alternate route for power."], "jumps": ["P3060", "P3150"]}, {"id": "P3150", "text": ["Also seen on the card are representations of DC to AC static inverters. Some loads on aircraft require AC power and these devices convert the DC to AC from the generator bus."], "jumps": ["P3060", "P3160"]}, {"id": "P3160", "text": ["Remember, all of the components on these cards are representations of aircraft relays and breakers which would be controlled in flight by a flight computer."], "jumps": ["P3060", "P3170"]}, {"id": "P3170", "text": [], "jumps": ["P3060", "P3180"]}, {"id": "P3180", "text": ["1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P3060"]}, {"id": "P3200", "text": ["2. Insert PC130-735 into the PC1 position. 3. Set S1 - OFF (down) S2 - OFF (down) R3 - Fully CCW R4 - Fully CCW"], "jumps": ["P3210"]}, {"id": "P3210", "text": ["4. Insert PC130-736 into the PC2 position. 5. Set S1 - C (right) S2 - OFF (left) S3 - OFF (left) S4 - NC (down)"], "jumps": ["P3200", "P3220"]}, {"id": "P3220", "text": ["6. Press Enter to Set: Positive Supply Voltage - 12......................."], "jumps": ["P3210"]}, {"id": "P3230", "text": ["7. Press Enter to Set: PC1 AC Power Switch - ON PC2 DC Power Switch - ON"], "jumps": []}, {"id": "P3240", "text": ["The next step is to set up the voltages from the AC to DC generator card. This is important for proper operation. This step will require a multimeter."], "jumps": ["P3250"]}, {"id": "P3250", "text": ["1. Set the multimeter to measure DC voltage and connect it from TP2 to TP4. The voltage represented on the multimeter indicates the difference in voltage between the two generators."], "jumps": ["P3255", "P3240", "P3260"]}, {"id": "P3255", "text": ["MEASUREMENT SETUP - Set the multimeter to DC voltage and connect it between TP2 and TP4."], "jumps": []}, {"id": "P3260", "text": ["The voltage will not be exactly zero, the lowest millivolt value obtained is acceptable.", "2. Adjust R4 until the multimeter indicates zero volts. This indicates that the voltages are identical. (Graphics Text) NOTE The voltage will not be exactly zero, the lowest millivolt value obtained is acceptable."], "jumps": ["P3250", "P3270"]}, {"id": "P3270", "text": ["Disconnect the ground lead from TP4 and connect it to ground. This voltage represents both voltages at their current level. 3. Adjust R3 for a 12 volt signal on the multimeter. Both voltages are now at 12 volts."], "jumps": ["P3260", "P3280"]}, {"id": "P3280", "text": ["The AC to DC generator card is now setup properly. Let's look at the operation of the Split-Bus system."], "jumps": ["P3270", "P3290"]}, {"id": "P3290", "text": ["1. Set S2 on PC130-736 to the ON (right) position. This applies voltage from the battery to the essential circuits of the aircraft. Remember, we need to start the engines first before generator power can be used."], "jumps": ["P3280", "P3300"]}, {"id": "P3300", "text": ["2. Set S1 and S2 of PC130-735 to the ON (up) position. The engines have now started and generator power is applied to all buses. At this time an actual aircraft battery would be charged with power from the generator."], "jumps": ["P3290", "P3310"]}, {"id": "P3310", "text": ["As you can see from the lights, all systems are being powered and there are no visible faults in the system. Let's fault one of the generators and observe the operation."], "jumps": ["P3300"]}, {"id": "P3320", "text": ["Notice that everything connected to the first bus has turned off. To apply power to this bus we need to connect the bus tie. 3. Set S4 to the UP (connected) position."], "jumps": ["P3330"]}, {"id": "P3330", "text": ["At this point power is being applied from the second generator to all busses. Since power is limited non-essential loads should be removed from the bus. 4. Set S1 to the left (not connected) position."], "jumps": ["P3310"]}, {"id": "P3340", "text": ["All power being used is from generator 2. Now let's see what happens if both generators fail."], "jumps": []}, {"id": "P3350", "text": ["Which source is supplying power to the bus?................"], "jumps": []}, {"id": "P3351", "text": [], "jumps": []}, {"id": "P3352", "text": ["By looking at the indicators on the card you can see that only the battery light is illuminated. This indicates that the battery is the only source supplying the bus."], "jumps": []}, {"id": "P3360", "text": ["5. Set S3 to ON, and set S2 to OFF........................"], "jumps": ["P3350", "P3370"]}, {"id": "P3370", "text": ["Now power is being applied to the emergency bus from the battery bus instead of through the generator bus. This is important for emergency situations where the generator bus can't be used."], "jumps": ["P3360", "P3380"]}, {"id": "P3380", "text": ["It is also important to note the diode connected from the generator bus to the essential load. A diode only allows power to flow in one direction."], "jumps": ["P3370", "P3390"]}, {"id": "P3390", "text": ["For this reason, the generator bus can power the essential loads, but the emergency power can't power the generator bus. This allows the emergency bus to be powered by multiple sources independently."], "jumps": ["P3400", "P3380"]}, {"id": "P3400", "text": ["Both of the generators should have become active again. The system is now being powered by the generators and the battery can be charged. 6. Set S2 to On, S3 to OFF and S1 to C."], "jumps": ["P3390"]}, {"id": "P3410", "text": ["Now the system is working properly. It is important to remember that these switches you have set manually would be controlled by a computer located in an aircraft."], "jumps": ["P3420"]}, {"id": "P3420", "text": ["Power can be limited when a generator failure(s) occur. This means only necessary loads receive power to extend the amount of time backup power can be used."], "jumps": ["P3430", "P3410"]}, {"id": "P3430", "text": ["We have seen how a power distribution system can be designed to control the flow of power effectively between sources and loads."], "jumps": ["P3410", "P3440"]}, {"id": "P3440", "text": ["Remember, this experiment has introduced you to the idea of a Split- Bus system. Most aircraft will have very intricate systems that run off of these same principles."], "jumps": ["P3410"]}, {"id": "P3460", "text": ["1. Set the Console Power Switch to OFF.FF................................."], "jumps": []}, {"id": "P3470", "text": ["2. Remove all test equipment connections. 3. Remove the PC130-735 and PC130-736 cards. 4. Return all equipment to the designated storage areas."], "jumps": ["P3460", "P3910"]}, {"id": "P3910", "text": ["This completes the experiment on SPLIT-BUS POWER DISTRIBUTION."], "jumps": ["P3001", "P3470"]}, {"id": "P5000", "text": [], "jumps": []}, {"id": "P1980", "text": ["7. The APU can be started in flight to power the failed Transfer Bus through the Bus Tie Breaker (BTB). Once APU power is connected, non-essential loads can be brought back on line.."], "jumps": ["P1970", "P1999"]}, {"id": "PINFO", "text": ["10-14-04 Converted sty to tbk. frieda 10-15-04 Inserted Experiment from lesson 9395Z202, checked text and branching and ran lesson with trainer. on-Essential busses connected to the Main Bus?"], "jumps": []}, {"id": "P10217", "text": ["#1, #2, and APU GB's open and BTB's closed", "#1 and #2 GB's open, APU GB closed, BTB's open", "#1 and #2 cockpit generator switches closed, BTB's open", "#1, #2 and APU GB's closed and BTB's closed", "What are the conditions for applying external power to a typical transfer bus type split bus distribution system?"], "jumps": []}, {"id": "P10224", "text": ["The APU can be started and connected directly to the faulty bus.", "The BTB for the bus will open, however, the associated generator will continue to power the bus.", "From the Tie Bus through the associated BTB.", "Power cannot be restored to a shorted bus until the faulty condition is repaired.", "In a Parallel Bus power distribution system, if a short is experienced on one of the busses, how is power restored to the faulty bus?"], "jumps": []}, {"id": "P10233", "text": ["When a Split-Bus Power Distribution system is under normal operation, can non-essential loads receive power?", "external power to a typical transfer bus type split bus distribution system?"], "jumps": []}, {"id": "P10213", "text": ["Essential (non-shed) and Non-Essential (shed) busses", "What two classifications of distribution busses are connected to the Main Bus in a typical Split Bus system? 9"], "jumps": []}, {"id": "P10219", "text": ["The non-essential loads cannot be brought back on line until the #1 generator fault is repaired", "The #1 Transfer Relay automatically brings the non-essential loads back on line when the #2 Main Bus is providing power to the #1 Transfer Bus", "Start the APU, close the APU GB, and close the #1 BTB", "Start the APU, close the APU GB, and close the #2 BTB", "On a Transfer Bus type power distribution system, during a #1 generator failure situation, how can non-essential loads be brought back on line?"], "jumps": []}, {"id": "P10220", "text": ["What component connects all busses together in a Parallel Bus type power distri let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
