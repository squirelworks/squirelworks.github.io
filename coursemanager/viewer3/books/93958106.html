const book = {"title": "93958106", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Title: ANTENNASLE sdf sdf asdf asd fasfd asdf asdf sadf", "Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Verify that microwave signals can be reflected.", "w Describe the basic construction and theory of operation of horn antennas. w Describe the basic construction and theory of operation of microwave reflectors. w Describe the basic construction and theory of operation of microwave lenses."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Reflector Plate 88 MultimeterXXXXXXXXXXnt"], "jumps": []}, {"id": "P301", "text": [], "jumps": []}, {"id": "P330", "text": [], "jumps": ["PPNLYUNA"]}, {"id": "P331", "text": [], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P341", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about microwave antennas."], "jumps": ["P300", "P410"]}, {"id": "P410", "text": ["Antennas are the devices used to radiate electromagnetic energy into space and pick up electromagnetic energy from space."], "jumps": ["P400", "P420"]}, {"id": "P420", "text": ["The basic principles of operation are the same for microwave antennas as they are for lower frequency antennas."], "jumps": ["P410", "P430"]}, {"id": "P430", "text": ["However, because of the short wavelength of microwaves, microwave antennas can be more readily designed for high gains and directivity."], "jumps": ["P410", "P440"]}, {"id": "P440", "text": ["Let's begin the lesson on ANTENNAS.ITLE..................................."], "jumps": ["P410"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Microwave antennas radiate electromagnetic energy from the waveguide into space - transmitting."], "jumps": ["P1001", "P1030"]}, {"id": "P1030", "text": ["They also pass electromagnetic energy to the waveguide from space - receiving."], "jumps": ["P1020", "P1040"]}, {"id": "P1040", "text": ["using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "Microwave antennas have the same characteristics as other antennas. Let's review these characteristics one at a time."], "jumps": ["P1030", "P1050"]}, {"id": "P1050", "text": ["One method to determine the efficiency of an antenna is to measure its ability to couple or radiate energy into space."], "jumps": ["P1040", "P1060"]}, {"id": "P1060", "text": ["This is called POWER GAIN or POWER RATIO."], "jumps": ["P1050", "P1070"]}, {"id": "P1070", "text": ["The power gain of an antenna is the ratio of its radiated power to that of a reference antenna using the same input signal."], "jumps": ["P1050", "P1080"]}, {"id": "P1080", "text": ["For example, if the radiated power of an antenna is twice that of the reference antenna, the antenna has a power gain of 2."], "jumps": ["P1050", "P1090"]}, {"id": "P1090", "text": ["The efficiency of an entire transmitting or receiving system depends largely on impedance matching between the waveguide, antenna and space. If the system is efficient, all the energy is transferred out of the system and into free space."], "jumps": ["P1050", "P1100"]}, {"id": "P1100", "text": ["using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "If it is not efficient, then some of the energy is reflected back up the waveguide. This energy is called a standing wave. Measuring the standing wave ratio gives the efficiency of the entire transmitting or receiving system..."], "jumps": ["P1050", "P1110"]}, {"id": "P1110", "text": ["The Voltage Standing Wave Ratio (VSWR) is obtained by comparing the voltage levels of the transmitted wave to the levels of the reflected wave at some particular point. The maximum reading divided by the minimum reading is the VSWR. The Current Standing Wave Ratio (ISWR) is handled in the same way....."], "jumps": ["P1050", "P1115"]}, {"id": "P1115", "text": ["using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "Directivity is the ability of an antenna to direct most of its power in a concentrated area.."], "jumps": ["P1050", "P1120"]}, {"id": "P1120", "text": ["An OMNIDIRECTIONAL antenna radiates and receives RF energy in all directions at one time. These antennas have low directivity.", "Uk~PfyKkyLm{N_rD]pB[lD^oG\\lFZjDfqLp{VoyQisKjtInxMp{PmxMisKhrJduLevMhyQj{ShwNapG_lA]j?_oCcsGdqH[h?Ua:[g@gqPoyXoqJikDmnIrsNszRszRepE^i>\\k;_n>guHjxK_nEYh?\\jD =9+;7*<8);7 83", ":;$?@1AD.>A/;?4@D3AD6DG:DH9CG6@D4>B1>C4AF6FB0@<%<7$;6#:5 72\".2"], "jumps": ["P1115", "P1130", "P"]}, {"id": "P1130", "text": ["Microwave antennas are normally directional. They have high directivity that concentrates power in one or two directions."], "jumps": ["P1120", "P1140"]}, {"id": "P1140", "text": ["A unidirectional antenna has its directivity in one direction and a bidirectional antenna has its directivity in two directions."], "jumps": ["P1120", "P1150"]}, {"id": "P1150", "text": ["Directional antennas increase power gain because the power is concentrated in a smaller space. Less power is required to cover the same distance."], "jumps": ["P1120", "P1160"]}, {"id": "P1160", "text": ["using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "Reciprocity is the ability of an antenna to act as a transmitting or receiving antenna."], "jumps": ["P1120", "P1170"]}, {"id": "P1170", "text": ["Antenna reciprocity is possible because the antenna characteristics are essentially the same regardless of whether the antenna is transmitting or receiving energy."], "jumps": ["P1160", "P1180"]}, {"id": "P1180", "text": ["Reciprocity allows most communication and RADAR systems to use one antenna for both receiving and transmitting."], "jumps": ["P1170", "P1190"]}, {"id": "P1190", "text": ["The efficiency of an ANTENNA is expressed in what terms?..."], "jumps": ["P1170"]}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1192", "text": ["The standing wave ratio gives the efficiency of the entire transmitting or receiving system."], "jumps": []}, {"id": "P1193", "text": ["Eout over Ein is the measure of voltage gain, not efficiency."], "jumps": []}, {"id": "P1200", "text": ["The efficiency of an entire receiving system is expressed in what terms?"], "jumps": ["P1190"]}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1202", "text": ["The power gain gives the efficiency of a transmitting or receiving antenna."], "jumps": []}, {"id": "P1203", "text": ["Eout over Ein is the measure of voltage gain, not efficiency."], "jumps": []}, {"id": "P1210", "text": ["A unidirectional antenna radiates power in _______........."], "jumps": ["P1200"]}, {"id": "P1211", "text": [], "jumps": []}, {"id": "P1212", "text": ["An antenna that radiates power in all directions is called an omnidirectional antenna."], "jumps": []}, {"id": "P1213", "text": ["An antenna that radiates power in two directions is called a bidirectional antenna."], "jumps": []}, {"id": "P1220", "text": ["The feed horn is the most commonly used antenna for microwaves......................"], "jumps": ["P1210", "P1230"]}, {"id": "P1230", "text": ["Horns are constructed in a variety of shapes and sizes. The shape and dimensions determine the electromagnetic field pattern."], "jumps": ["P1220", "P1240"]}, {"id": "P1240", "text": ["Horn antennas match the impedance of the waveguide to the impedance of space. This reduces standing waves and improves the efficiency of the system."], "jumps": ["P1220", "P1250"]}, {"id": "P1250", "text": ["The gradual expansion of the mouth provides the impedance matching."], "jumps": ["P1240", "P1260"]}, {"id": "P1260", "text": ["Horn antennas also direct the electromagnetic energy in one direction, unidirectional."], "jumps": ["P1240", "P1270"]}, {"id": "P1270", "text": ["This increases the power gain, or efficiency, of the antenna."], "jumps": ["P1240", "P1280"]}, {"id": "P1280", "text": ["Horn antennas have a very high reciprocity, that is, they can be used for transmitting or receiving."], "jumps": ["P1240", "P1290"]}, {"id": "P1290", "text": ["They are used primarily in microwave repeater stations."], "jumps": ["P1280", "P1300"]}, {"id": "P1300", "text": ["The antenna used with the Nida Model 330 Microwave Trainer is a horn that has a power gain of approximately 15 dB."], "jumps": ["P1280", "P1310"]}, {"id": "P1310", "text": ["Another type of microwave antenna is the parabolic reflector."], "jumps": ["P1300", "P1320"]}, {"id": "P1320", "text": ["It consists of a radiator (which can be a horn antenna) and a parabolic reflector called a dish."], "jumps": ["P1310", "P1330"]}, {"id": "P1330", "text": ["As a transmitting antenna, a microwave signal is placed at the focal point (F) by a radiator."], "jumps": ["P1310", "P1340"]}, {"id": "P1340", "text": ["The field departs the radiator and is reflected by the dish."], "jumps": ["P1330", "P1350"]}, {"id": "P1350", "text": ["Due to the shape (parabolic) of the dish, all paths from F to the reflector and to the line XY are of the same length."], "jumps": ["P1330", "P1360"]}, {"id": "P1360", "text": ["The result is a very narrow beam which increases the power gain and directivity over a simple horn antenna."], "jumps": ["P1330", "P1370"]}, {"id": "P1370", "text": ["As a receiving antenna, microwave signals that are directed to the dish are reflected to the focal point (F) or the radiator."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["This increases the signal level at the focal point."], "jumps": ["P1370", "P1390"]}, {"id": "P1390", "text": ["Very weak signals that normally could not be picked up by a simple horn antenna are easily received by a parabolic reflector antenna."], "jumps": ["P1370", "P1400"]}, {"id": "P1400", "text": ["Parabolic reflector antennas are used to cover long distances by placing all the available power into a very narrow beam."], "jumps": ["P1410", "P1370"]}, {"id": "P1410", "text": ["For example, communications between earth stations (like home TV dish antennas) and satellites cover long distances. Like a home TV dish antenna."], "jumps": ["P1400", "P1420"]}, {"id": "P1420", "text": ["using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "Orange-Peel Parabola Truncated Parabola Cylindrical Parabola", "There are also variations to the full parabolic reflector antennas that are used primarily in RADAR systems."], "jumps": ["P1410", "P1430"]}, {"id": "P1430", "text": ["The only difference in the antennas is the shape of the reflector."], "jumps": ["P1420", "P1440"]}, {"id": "P1440", "text": ["The orange-peel parabola is used where a highly directive pattern in the vertical plane and a somewhat broader pattern in the horizontal plane is desired."], "jumps": ["P1420", "P1450"]}, {"id": "P1450", "text": ["This pattern is desirable for height finding radar systems."], "jumps": ["P1440", "P1460"]}, {"id": "P1460", "text": ["The truncated parabola is a section of a full parabola....."], "jumps": ["P1440", "P1470"]}, {"id": "P1470", "text": ["Horizontally Truncated Reflector", "If the reflector is truncated (cut) so that it is shortened vertically, the radiated beam then spreads out vertically instead of being focused."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["However, the beam is narrow in the horizontal plane..lane."], "jumps": ["P1470", "P1490"]}, {"id": "P1490", "text": ["Because of the narrow horizontal pattern, this reflector is used to determine an object's bearing.", "The wide vertical beam allows objects at different altitudes to be detected without tilting the antenna."], "jumps": ["P1500", "P1470", "P1510", "P1490"]}, {"id": "P1510", "text": ["Vertically Truncated Reflectoror", "If the reflector is truncated so that it is shortened horizontally , the radiated beam spreads out horizontally."], "jumps": ["P1500", "P1520"]}, {"id": "P1520", "text": ["However, the beam is narrow in the vertical plane..lane."], "jumps": ["P1460", "P1530"]}, {"id": "P1530", "text": ["This type of reflector is used to determine elevation of objects due to the narrow vertical pattern."], "jumps": ["P1540", "P1510"]}, {"id": "P1540", "text": ["Such a fan-shaped beam is used to determine elevation very accurately. ithout rotating the antenna."], "jumps": ["P1550", "P1530"]}, {"id": "P1550", "text": ["The cylindrical parabola radiates a beam of energy that is wider in one dimension than the other."], "jumps": ["P1540", "P1560"]}, {"id": "P1560", "text": ["This type of antenna is used in search radar and ground control approach radar systems."], "jumps": ["P1550", "P1570"]}, {"id": "P1570", "text": ["Three Dimensional View of Parallel Plate Lense", "The last type of antenna we will cover is the lens antenna."], "jumps": ["P1550", "P1580"]}, {"id": "P1580", "text": ["Lens antennas convert radiated energy into a plane wave in a given direction by using a radiating source with a collimating lens."], "jumps": ["P1570", "P1590"]}, {"id": "P1590", "text": ["The radiating source is normally a horn radiator or a basic dipole antenna."], "jumps": ["P1570", "P1600"]}, {"id": "P1600", "text": ["The collimating lens forces all radial segments of the wavefront into parallel paths by changing the phase velocity of the electromagnetic energy."], "jumps": ["P1570", "P1610"]}, {"id": "P1610", "text": ["The velocity of electromagnetic energy through metals is not the same as in air. This means that, like light, when the electromagnetic energy encounters a boundary where it changes from one medium to another, it refracts..."], "jumps": ["P1570", "P1620"]}, {"id": "P1620", "text": ["Because of the concave construction of the lens, wavefronts arriving near the ends are refracted more than those arriving near the middle."], "jumps": ["P1570", "P1630"]}, {"id": "P1630", "text": ["There are many other types of microwave antennas. Most are similar to the horn, parabolic or lens antennas."], "jumps": ["P1570", "P1640"]}, {"id": "P1640", "text": ["What type of antenna is used to produce a beam that is narrow both vertically and horizontally?"], "jumps": ["P1630"]}, {"id": "P1641", "text": [], "jumps": []}, {"id": "P1642", "text": ["An orange-peel antenna has a highly directive beam in the vertical plane and a somewhat broader beam in the horizontal plane."], "jumps": []}, {"id": "P1643", "text": ["A truncated antenna uses part of the parabolic dish. It has either a narrow beam in the vertical plane or the horizontal plane, not both."], "jumps": []}, {"id": "P1650", "text": ["How is the impedance of the waveguide matched to space in a horn antenna?"], "jumps": ["P1640"]}, {"id": "P1651", "text": [], "jumps": []}, {"id": "P1652", "text": ["A reflector is added to a horn antenna to increase its directivity, or to make a narrow beam width."], "jumps": []}, {"id": "P1653", "text": ["A lens is added to a horn antenna to increase its directivity, or to make a narrow beam width."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on ANTENNAS. 1 TITLE........"], "jumps": ["P1650"]}, {"id": "P1920", "text": ["1. Microwave antennas radiate electromagnetic energy from the waveguide into space - transmitting."], "jumps": ["P1001", "P1930"]}, {"id": "P1930", "text": ["2. They receive electromagnetic energy to the waveguide from space - receiving.."], "jumps": ["P1920", "P1940"]}, {"id": "P1940", "text": ["using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "3. The characteristics of microwave antennas are the same as those of other lower frequency antennas."], "jumps": ["P1930", "P1950"]}, {"id": "P1950", "text": ["4. The most commonly used antenna for microwaves is the horn antenna. It has power gain and matches the waveguide impedance to space."], "jumps": ["P1940", "P1960"]}, {"id": "P1960", "text": ["5. Parabolic reflector antennas produce a very narrow beam in both planes.."], "jumps": ["P1950", "P1970"]}, {"id": "P1970", "text": ["6. Other types of reflector antennas are the truncated, orange- peel and cylindrical."], "jumps": ["P1960", "P1980"]}, {"id": "P1980", "text": ["7. The lens antenna focuses the radiated energy by varying its velocity through a collimating metallic strip."], "jumps": ["P1970", "P1999"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1980"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["The purpose of this experiment is to observe the operation of antennas."], "jumps": ["P2001", "P2040"]}, {"id": "P2040", "text": ["In this experiment you will reflect the microwave transmitted signal towards the receiver to simulate how a reflecting microwave antenna operates. The directivity of the transmitted signal is also observed."], "jumps": ["P2020", "P2070"]}, {"id": "P2070", "text": ["In this experiment you will use the flat reflector plate. Locate the flat reflector plate, part of the Nida Model 330 Basic Microwave Trainer."], "jumps": ["P2040", "P2080"]}, {"id": "P2080", "text": ["The flat reflector plate is used to demonstrate that microwave signals can be reflected."], "jumps": ["P2070", "P2090"]}, {"id": "P2090", "text": ["Although the reflectors used on most microwave antennas are parabolic shaped, a flat reflector still reflects microwave energy. gy."], "jumps": ["P2070", "P2100"]}, {"id": "P2100", "text": ["The principle is the same. Microwaves behave similar to light and can be reflected. Let's start the experiment."], "jumps": ["P2070", "P2105"]}, {"id": "P2105", "text": ["You have previously selected the dual trainer setup. You must exit and restart this lesson.", "Before we start the experiment, please choose the trainer configuration you will be using. If you are unsure, ask your instructor. Model 330 microwave trainer are given in HELP frames. Also, the Nida Model 130A Test Console's controls and settings are given in HELP frames."], "jumps": ["P2070"]}, {"id": "P2110", "text": ["1. Set the Test Console to its Initial Control Settings.signate one console as the transmitter console and the other the receiver console. DO NOT connect the computers RS-232 cable to either Test Console at this time."], "jumps": ["P2105"]}, {"id": "P2120", "text": ["2. Assemble the Nida Model 330 Microwave Trainer if not previously assembled."], "jumps": ["P2110", "P2130"]}, {"id": "P2130", "text": ["3. Install PC130-307 into PC1 position. 4. Install PC130-308 into PC3 position..rmal operation if not previously configured."], "jumps": ["P2120", "P2135"]}, {"id": "P2135", "text": ["5. Set the Negative Supply Voltage to 15. 6. Set the Positive Supply Voltage to 15. The Test Console's Voltage Meter should indicate 15 volts."], "jumps": ["P2130"]}, {"id": "P2140", "text": ["7. Set PC1 and PC3 DC power ON. t the microwave trainer to the PC cards and make circuit alignments if required. Select one of the options below if you need alignment procedure instructions ."], "jumps": ["P2135"]}, {"id": "P2145", "text": ["8. Connect the microwave trainer to the PC cards and make circuit alignments if required. Select one of the options below if you need alignment procedure instructions. ocedure instructions ."], "jumps": ["P2140"]}, {"id": "P2150", "text": ["The experiment is now set up. Let's observe the operation of antennas."], "jumps": ["P2145", "P2165"]}, {"id": "P2165", "text": ["using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "Volts/Div CH1 - 1 AC Sweep Mode - Auto Volts/Div CH2 - 1 AC Slope - + Vert Mode - Dual Coupling - AC Sweep Var - Fully CW Source - CH1 Time/Div - .5 mSec put jackkkkkkkkkkkjackkkkkkkkkkkkkk", "1. Set the oscilloscope controls as follows: The Horizontal sweep of each channel should be adjusted to view CH1 signal on the upper portion of the grid and CH2 signal on the lower portion."], "jumps": ["P2170"]}, {"id": "P2170", "text": ["2. Place the three position lever switch on PC130-307 to the Sine Wave position.."], "jumps": ["P2165", "P2172"]}, {"id": "P2172", "text": ["3. Connect the oscilloscope CH1 to the Output TP on PC130-307. 4. Connect CH2 to the Output TP on PC130-308. Compare the two signals. They should be approximately the same."], "jumps": ["P2170", "P2180"]}, {"id": "P2180", "text": ["\u0000\u0000\u0000incorrect1\u0000\u00001\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000[\u0001\u000f\u0000\u0000\u0000 \u0000\u0002\u0000Norst Choiceett\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000q\u0001\u0010\u0000\u0000\u0000\u0001\u0000\u0001\u0000\u0000\u0000,\u0004\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000z\u0001\u0000\u0000\u00fc\u0000\u00ba\u0004\u0012\u0002\u0087\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u00b1\u0001\u0012\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0014\u0000\u0013\u0000x\u001e\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00c9\u0001\u0013\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00db\u0001\u0014\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000\u00f5\u0001\u0015\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0019\u0002\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00ba\u0004\u0002\u0000\u0000\u0000V\u0006\u0003\u0000\u0000\u0000t\u0007\u0000\u0000\u0000\u0000\u0000\u00003\u0002\u0017\u0000\u0000", "Do you see a 1 kHz signal at the Output of the receiver Test Console?"], "jumps": ["P2172"]}, {"id": "P2181", "text": [], "jumps": []}, {"id": "P2182", "text": ["You should see the 1 kHz signal at the output of the receiver. If the 1 kHz signal is not present, check your setup. If after checking your setup, the tone is still not present, ask for assistance from your instructor..............."], "jumps": []}, {"id": "P2340", "text": ["5. Shift both the transmitter and receiver waveguide systems at least 45 degrees..."], "jumps": ["P2180", "P2350"]}, {"id": "P2350", "text": ["6. Observe the received signal (CH2). It should be absent or very noisy. Increase the angle of the waveguide systems if the signal is present."], "jumps": ["P2340", "P2360"]}, {"id": "P2360", "text": ["7. Using the flat reflector plate, position it between the two waveguide systems..."], "jumps": ["P2340", "P2370"]}, {"id": "P2370", "text": ["8. Adjust the position of the reflector plate until the signal reappears, as indicated on CH2 of the oscilloscope."], "jumps": ["P2360", "P2380"]}, {"id": "P2380", "text": ["The reflector plate is reflecting the transmitted signal towards the receiver."], "jumps": ["P2360", "P2390"]}, {"id": "P2390", "text": ["The reflector plate must be placed in the exact position to reflect the signals to the receiver."], "jumps": ["P2380", "P2400"]}, {"id": "P2400", "text": ["9. Keeping the reflector plate in the same position, rotate it up and down, and left and right from the transmitting horn antenna."], "jumps": ["P2380", "P2405"]}, {"id": "P2405", "text": ["Notice that the received signal decreases in level as the reflector plate rotates. This is demonstrating the directivity of the microwave signals from the horn transmitting antenna."], "jumps": ["P2380", "P2410"]}, {"id": "P2410", "text": ["Remember, the reflector's use of microwave antennas are parabolic and is used to focus the microwave energy."], "jumps": ["P2380", "PA225", "P2420"]}, {"id": "P2420", "text": ["1. Return the Test Console to its initial control settings. ment."], "jumps": ["P2410"]}, {"id": "P2430", "text": ["2. Set the Test Console Power to OFF......................"] scope controls as follows: The Horizontal sweep of each channel should be adjusted to view CH1 signal on the upper portion of the grid and CH2 signal on the lower portion."], "jumps": ["P13170"]}, {"id": "P13170", "text": ["2. Place the three position lever switch on PC130-307 to the Sine Wave position.."], "jumps": ["P13165", "P13172"]}, {"id": "P13172", "text": ["3. Connect the oscilloscope CH1 to the Output TP on PC130-307. 4. Connect CH2 to the Output TP on PC130-308. Compare the two signals. They should be approximately the same."], "jumps": ["P13170", "P13180"]}, {"id": "P13180", "text": ["\u0000\u0000\u0000incorrect1\u0000\u00001\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000[\u0001\u000f\u0000\u0000\u0000 \u0000\u0002\u0000Norst Choiceett\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000q\u0001\u0010\u0000\u0000\u0000\u0001\u0000\u0001\u0000\u0000\u0000,\u0004\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000z\u0001\u0000\u0000\u00fc\u0000\u00be\u0004\u0012\u0002\u0087\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u00b1\u0001\u0012\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0014\u0000\u0013\u0000x\u001e\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00c9\u0001\u0013\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00db\u0001\u0014\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000\u00f5\u0001\u0015\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0019\u0002\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00be\u0004\u0002\u0000\u0000\u0000\\\u0006\u0003\u0000\u0000\u0000|\u0007\u0000\u0000\u0000\u0000\u0000\u00003\u0002\u0017\u0000\u0000", "Do you see a 1 kHz signal at the Output of the receiver Test Console?"], "jumps": ["P13172"]}, {"id": "P13181", "text": [], "jumps": []}, {"id": "P13182", "text": ["You should see the 1 kHz signal at the output of the receiver. If the 1 kHz signal is not present, check your setup. If after checking your setup, the tone is still not present, ask for assistance from your instructor..............."], "jumps": []}, {"id": "P13340", "text": ["5. Shift both the transmitter and receiver waveguide systems at least 45 degrees..."], "jumps": ["P13180", "P13350"]}, {"id": "P13350", "text": ["6. Observe the received signal (CH2). It should be absent or very noisy. Increase the angle of the waveguide systems if the signal is present."], "jumps": ["P13340", "P13360"]}, {"id": "P13360", "text": ["7. Using the flat reflector plate, position it between the two waveguide systems..."], "jumps": ["P13340", "P13370"]}, {"id": "P13370", "text": ["8. Adjust the position of the reflector plate until the signal reappears, as indicated on CH2 of the oscilloscope."], "jumps": ["P13360", "P13380"]}, {"id": "P13380", "text": ["The reflector plate is reflecting the transmitted signal towards the receiver."], "jumps": ["P13360", "P13390"]}, {"id": "P13390", "text": ["The reflector plate must be placed in the exact position to reflect the signals to the receiver."], "jumps": ["P13380", "P13400"]}, {"id": "P13400", "text": ["9. Keeping the reflector plate in the same position, rotate it up and down, and left and right from the transmitting horn antenna."], "jumps": ["P13380", "P13405"]}, {"id": "P13405", "text": ["Notice that the received signal decreases in level as the reflector plate rotates. This is demonstrating the directivity of the microwave signals from the horn transmitting antenna."], "jumps": ["P13380", "P13410"]}, {"id": "P13410", "text": ["Remember, the reflector's use of microwave antennas are parabolic and is used to focus the microwave energy."], "jumps": ["P13380"]}, {"id": "P13430", "text": ["3. Set the Test Co let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
