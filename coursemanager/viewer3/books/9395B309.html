     demodulator is the same as the input to the modulator.", "7. Connect CH1 of the oscilloscope to PC130-328 Data in, TP1, and CH2 to PC130-329 Data out, TP6. Set the oscilloscope as necessary. Adjust R6 shift adjustment until the output of the demodulator is the same as the input to the modulator."], "jumps": ["P9330", "P9310"]}, {"id": "P9265", "text": ["16. To make viewing the modulated waveform easier, SYNC the function generator output with the oscilloscope.tor of your function generator to the TRIGGER IN connector of your oscilloscope. This will make it easier to view the modulated waveform."], "jumps": ["P9270", "P9260", "P9266"]}, {"id": "P9380", "text": ["The FSK system is operating correctly, changing the digital information signal to a FM signal and changing it back to a digital signal."], "jumps": ["P9390", "P9370"]}, {"id": "P9290", "text": ["Now we will setup the PC130-329 FSK Demodulator circuit.\n1.  Insert PC130-329 into the PC3 position.\n2.  Set all potentiometers to their mid position.", "20.  Adjust R2, the input level adjust, until a distinct change can            be seen in the frequency during the high and low conditions.         Adjust the oscilloscope trigger hold off and level as                           necessary.", "Now we will setup the PC130-329 FSK Demodulator circuit. 1. Insert PC130-329 into the PC3 position. 2. Set all potentiometers to their mid position.", "20. Adjust R2, the input level adjust, until a distinct change can be seen in the frequency during the high and low conditions. Adjust the oscilloscope trigger hold off and level as necessary."], "jumps": ["P9300", "P9280", "P9290", "P9270"]}, {"id": "P9310", "text": ["4.  Place PC130-328 S1 to the CONTINUOUS position.\n5.  Measure the signal on the PC130-329 IN TP using the                       oscilloscope.\n6.  Adjust PC130-328 (modulator card) R14 for a 1 Vpp signal.", "4. Place PC130-328 S1 to the CONTINUOUS position. 5. Measure the signal on the PC130-329 IN TP using e Function Generator's Main Output BNC to the Test Console's Output BNC."], "jumps": []}, {"id": "P1250", "text": ["13.  Disconnect the alligator to alligator jumper from the circuit.            DO NOT CONTINUE WITHOUT DOING THIS.\n14. Connect the MAIN output of the function generator to the PC1        OUTPUT BNC.", "13. Disconnect the alligator to alligator jumper from the circuit. DO NOT CONTINUE WITHOUT DOING THIS. 14. Connect the MAIN output of the function generator to the PC1 OUTPUT BNC.", "11. Using the alligator to alligator jumper, connect TP1 to the V+ test point. This allows us to set the high frequency of the modulator. 12. Using a frequency counter or an oscilloscope, set the frequency on TP6 to 1800 Hz, + 100 Hz, by adjusting the HI (R8) potentiometer. Be as close as possible."], "jumps": ["P1260", "P1240", "P1255", "P9250", "P9235"]}, {"id": "P9235", "text": ["10.  Using a frequency counter or an oscilloscope, set the                       frequency on TP6 to 1200 Hz, + 100 Hz, by adjusting the\n        LO (R6) potentiometer.  Be as close as possible.", "8.  Place S1 to CONTINUOUS.  \n  9.  Using an alligator to alligator jumper, connect TP1 to the                 GND test point. This ensures that a low condition is present           on the input.  This allows us to set the low frequency of the            modulator.", "6.  Place S1 to the CONTROL position.\n7.  Using a frequency counter or an oscilloscope, set the                       frequency on TP6 to 1500 Hz, + 100 Hz, by adjusting the                  carrier potentiometer.  Be as close as possible.", "10. Using a frequency counter or an oscilloscope, set the frequency on TP6 to 1200 Hz, + 100 Hz, by adjusting the LO (R6) potentiometer. Be as close as possible. z 100 Hz, by adjusting the HI (R8) potentiometer. Be as close as possible.", "8. Place S1 to CONTINUOUS. 9. Using an alligator to alligator jumper, connect TP1 to the GND test point. This ensures that a low condition is present on the input. This allows us to set the low frequency of the modulator. eter. Be as close as possible.", "6. Place S1 to the CONTROL position. 7. Using a frequency counter or an oscilloscope, set the frequency on TP6 to 1500 Hz, + 100 Hz, by adjusting the carrier potentiometer. Be as close as possible."], "jumps": ["P9240", "P9230", "P9235", "P9220"]}, {"id": "P9210", "text": ["5.  Press Enter to set: PC2 DC Power Switch - ON", "5. Press Enter to set: PC2 DC Power Switch - ON..........................."], "jumps": []}, {"id": "P9200", "text": ["4.  Press Enter to set: Positive Supply Voltage -  15", "4. Press Enter to set: Positive Supply Voltage - 15......................"], "jumps": ["P9190"]}, {"id": "P9190", "text": ["3.  On PC130-328, set all potentiometers to mid position.", "3. On PC130-328, set all potentiometers to mid position..."], "jumps": ["P9200", "P9180"]}, {"id": "P9180", "text": ["2.  Insert PC130-328 into the PC2 connectors on the test console.", "2. Insert PC130-328 into the PC2 connectors on the test console."], "jumps": ["P9190"]}, {"id": "P9250", "text": ["13.  Disconnect the alligator to alligator jumper from the circuit.             DO NOT CONTINUE WITHOUT DOING THIS.\n14.  Connect the MAIN output of the function generator to the                 PC1 OUTPUT BNC.", "13. Disconnect the alligator to alligator jumper from the circuit. DO NOT CONTINUE WITHOUT DOING THIS. 14. Connect the MAIN output of the function generator to the PC1 OUTPUT BNC."], "jumps": ["P9260", "P9240", "P9255"]}, {"id": "P9160", "text": ["Once the fault has been located, further oscilloscope or multimeter measurements will locate the fault to a particular chip or component.  Remember, use an analog multimeter to check out a transistor.  Let's start the experiment.", "Once the fault has been located, further oscilloscope or multimeter measurements will locate the fault to a particular chip or component. Remember, use an analog multimeter to check out a transistor. Let's start the experiment."], "jumps": ["P9170", "P9080"]}, {"id": "P9150", "text": ["If the input to the receiver is good, the demodulator circuits are faulted."], "jumps": ["P9160", "P9080"]}, {"id": "P9140", "text": ["If the input to the receiver is bad, the fault is in the transmission medium."], "jumps": ["P9150", "P9080"]}, {"id": "P9130", "text": ["If the output of the transmitter is good, the fault is in the transmission medium or receiver."], "jumps": ["P9140", "P9080"]}, {"id": "P9120", "text": ["If the output of the transmitter is faulted, the modulator circuits are causing the problem."], "jumps": ["P9130", "P9080"]}, {"id": "P9110", "text": ["If faulted, you determine if the transmitter or receiver is causing the problem."], "jumps": ["P9120", "P9080"]}, {"id": "P9100", "text": ["If you do not have a good signal on the output of the receiver, the system is faulted."], "jumps": ["P9110", "P9080"]}, {"id": "P9090", "text": ["If the digital input signal to the transmitter matches the digital output of the receiver, the system is OK, no faults."], "jumps": ["P9100", "P9080"]}, {"id": "P9080", "text": ["To locate a faulted chip or support component, you must first determine if the FSK system is operating correctly."], "jumps": ["P9090", "P9060"]}, {"id": "P9070", "text": ["The receiver consists of a NE565 PLL FM Demodulator and a NE567 PLL fc Detector."], "jumps": ["P9080", "P9060"]}, {"id": "P9060", "text": ["The receiver is located on the PC130-329 card.", "The receiver is located on the PC130-329 card.............."], "jumps": ["P9070", "P9040", "P9065"]}, {"id": "P9050", "text": ["The transmitter consists of the MC14066 Switch and the ICL8038 VCO."], "jumps": ["P9060", "P9040"]}, {"id": "P9040", "text": ["The transmitter is located on the PC130-328 card.", "The transmitter is located on the PC130-328 card..........."], "jumps": ["P9050", "P9020", "P9045"]}, {"id": "P9020", "text": ["In this experiment, you will locate the failed chip or component in a FSK transmitter and receiver system."], "jumps": ["P9040", "P1001"]}, {"id": "P6020", "text": ["Congratulations, you determined that the FSK system has no faults."], "jumps": ["P6010"]}, {"id": "P6012", "text": ["The output signal of the receiver matches the input signal to the transmitter.  The FSK system is operating correctly.", "The output signal of the receiver matches the input signal to the transmitter. The FSK system is operating correctly."], "jumps": []}, {"id": "P6011", "text": [], "jumps": []}, {"id": "P6010", "text": ["1.  Measure the input signal of the transmitter on PC130-328 TP1        and the output signal of the receiver on PC130-329 TP6 to               determine if the FSK system is operating correctly.   Is the FSK      system operating correctly?", "1. Measure the input signal of the transmitter on PC130-328 TP1 and the output signal of the receiver on PC130-329 TP6 to determine if the FSK system is operating correctly. Is the FSK system operating correctly?"], "jumps": ["P6000"]}, {"id": "P6000", "text": ["The FSK system may or may not be faulted, you must check using the oscilloscope."], "jumps": ["P6010"]}, {"id": "P5060", "text": ["The computer will now remove the fault.  Check the output of the receiver on PC130-329 TP6 and verify the FSK system is operating correctly.", "The computer will now remove the fault. Check the output of the receiver on PC130-329 TP6 and verify the FSK system is operating correctly."], "jumps": ["P5044"]}, {"id": "P5050", "text": ["In this case, the base of Q1 is grounded.", "Congratulations, you determined that Q1 is bad, 0 ohms resistance between the base and emitter in both directions.", "R13 is good.  Check the base to emitter resistance of Q1 using an analog multimeter.  It should be low in one direction and high in the other.", "R12 is good.  Check the base to emitter resistance of Q1 using an analog multimeter.  It should be low in one direction and high in the other.", "R13 is good. Check the base to emitter resistance of Q1 using an analog multimeter. It should be low in one direction and high in the other.", "R12 is good. Check the base to emitter resistance of Q1 using an analog multimeter. It should be low in one direction and high in the other.."], "jumps": ["P5060", "P5044", "P5050", "P5040"]}, {"id": "P5041", "text": [], "jumps": []}, {"id": "P5040", "text": ["Which IC or component is most likely to cause the fault?", "The fc detector circuit is good.  Place S1 on PC130-328 to CONTROL, the green LED will illuminate (be sure to place\nPC130-328 back to CONTINUOUS).", "The output signals of IC1 are correct (TP2 and TP3), square waves that are not filtered.  The FM demodulator is not faulted. Also the output signal on IC2 pin 6 is correct, filtered square wave.", "Which IC or component is most likely to cause the fault?...", "The fc detector circuit is good. Place S1 on PC130-328 to CONTROL, the green LED will illuminate (be sure to place PC130-328 back to CONTINUOUS).", "The output signals of IC1 are correct (TP2 and TP3), square waves that are not filtered. The FM demodulator is not faulted. Also the output signal on IC2 pin 6 is correct, filtered square wave."], "jumps": ["P5030"]}, {"id": "P5031", "text": [], "jumps": []}, {"id": "P5030", "text": ["3.  Determine the faulted circuit in the receiver by measuring the        signals on the IC pins and TPs of PC130-329.  Which circuit            in the receiver is faulted?", "3. Determine the faulted circuit in the receiver by measuring the signals on the IC pins and TPs of PC130-329. Which circuit in the receiver is faulted?"], "jumps": ["P5020"]}, {"id": "P5023", "text": ["The output signal from the transmitter and the input signal to the receiver are correct, a FM signal with two frequency shifts for HIGH and LOW inputs.  The transmission medium is not faulted.", "The output signal from the transmitter and the input signal to the receiver are correct, a FM signal with two frequency shifts for HIGH and LOW inputs. The transmission medium is not faulted."], "jumps": []}, {"id": "P5022", "text": ["The output signal from the transmitter is correct, a FM signal with two frequency shifts for HIGH and LOW inputs.  The transmitter is not faulted.", "The output signal from the transmitter is correct, a FM signal with two frequency shifts for HIGH and LOW inputs. The transmitter is not faulted."], "jumps": []}, {"id": "P5021", "text": [], "jumps": []}, {"id": "P5020", "text": ["2.  Determine if the transmitter, transmission medium or receiver        is faulted by measuring the signals on PC130-328 TP6 and on       PC130-329 TP IN and comparing to the data input on\n     PC130-328 TP1.  Is the transmitter, transmission medium or            receiver faulted?", "2. Determine if the transmitter, transmission medium or receiver is faulted by measuring the signals on PC130-328 TP6 and on PC130-329 TP IN and comparing to the data input on PC130-328 TP1. Is the transmitter, transmission medium or receiver faulted?"], "jumps": ["P5010"]}, {"id": "P5012", "text": ["The output signal of the receiver is incorrect, a steady +9 volts. The FSK system is not operating correctly."], "jumps": []}, {"id": "P5011", "text": [], "jumps": []}, {"id": "P5010", "text": ["1.  Measure the input signal of the transmitter on PC130-328 TP1        and the output signal of the receiver on PC130-329 TP6 to               determine if the FSK system is operating correctly.  Is the FSK       system operating correctly?", "1. Measure the input signal of the transmitter on PC130-328 TP1 and the output signal of the receiver on PC130-329 TP6 to determine if the FSK system is operating correctly. Is the FSK system operating correctly?"], "jumps": ["P5000"]}, {"id": "P5000", "text": ["The FSK system may or may not be faulted, you must check using the oscilloscope."], "jumps": ["P5010"]}, {"id": "P4060", "text": ["The computer will now remove the fault.  Check the output of the receiver on PC130-329 TP6 and verify the FSK system is operating let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
