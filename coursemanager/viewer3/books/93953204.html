const book = {"title": "93953204", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: COMMON EMITTER AMPLIFIERasd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe methods to determine class of operation. w Describe methods to determine voltage gain......................", "w Describe the operating characteristics of a common emitter amplifier. w Describe the purpose of individual components in a common emitter amplifier."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["This lesson teaches the common emitter amplifier circuit."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["This is a Common Emitter amplifier because the input is applied to the base, the output is taken from the collector, and the emitter is common."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["The common emitter amplifier is normally used as a power amplifier due to its properties.\nVoltage Gain - Medium   Current Gain - Medium   Power Gain - High     Input Resistance - Medium    Output Resistance - Medium", "The common emitter amplifier is normally used as a power amplifier due to its properties. Voltage Gain - Medium Current Gain - Medium Power Gain - High Input Resistance - Medium Output Resistance - Medium"], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Let's begin the lesson on COMMON EMITTER AMPLIFIER........................"], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["This is a typical common emitter amplifier circuit.", "This is a typical common emitter amplifier circuit........."], "jumps": ["P1025", "P1001"]}, {"id": "P1025", "text": ["For this discussion an NPN transistor is used.  Note that Vcc is positive.", "For this discussion an NPN transistor is used. Note that Vcc is positive."], "jumps": ["P1030", "P1020"]}, {"id": "P1030", "text": ["The amplifier's output is controlled by a small input signal."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The output signal is an amplified and inverted replica of the input signal."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["The amplifier has two basic circuits: \n1. Input  -    Base to Emitter  \n2. Output -  Emitter to Collector", "The amplifier has two basic circuits: 1. Input - Base to Emitter 2. Output - Emitter to Collectorrrrrrrrrrrrrrrrrrrrrrrr"], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["Note, the emitter is common to both circuits. \n1. Input  - Base to Emitter       \n2. Output - Emitter to Collector", "Note, the emitter is common to both circuits. 1. Input - Base to Emitter 2. Output - Emitter to Collector"], "jumps": ["P1075", "P1060"]}, {"id": "P1075", "text": ["This means that a change in one circuit affects the other circuit."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["A changing input signal changes the bias voltage on the base of the transistor."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["When the input signal increases, the bias voltage increases."], "jumps": ["P1100", "P1060"]}, {"id": "P1100", "text": ["An increase in bias voltage affects current flow in the emitter collector circuit. Current increases."], "jumps": ["P1110", "P1060"]}, {"id": "P1110", "text": ["When the input signal decreases, the bias voltage decreases."], "jumps": ["P1120", "P1060"]}, {"id": "P1120", "text": ["A decrease in bias voltage affects current flow in the emitter collector circuit.  Current decreases.", "A decrease in bias voltage affects current flow in the emitter collector circuit. Current decreases."], "jumps": ["P1130", "P1060"]}, {"id": "P1130", "text": ["The effects of a changing input signal are seen in a changing output signal."], "jumps": ["P1140", "P1060"]}, {"id": "P1140", "text": ["Note, an increasing input signal produces a decreasing output signal."], "jumps": ["P1150", "P1060"]}, {"id": "P1150", "text": ["A decreasing input signal produces an increasing output signal."], "jumps": ["P1160", "P1060"]}, {"id": "P1160", "text": ["A small input signal controlled a large output signal."], "jumps": ["P1170", "P1060"]}, {"id": "P1170", "text": ["In a common emitter amplifier, when the base voltage increases the emitter current _______"], "jumps": ["P1060"]}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1172", "text": ["When the base voltage increases, the forward biased emitter to base PN junction increases.  Emitter current will not decrease.", "When the base voltage increases, the forward biased emitter to base PN junction increases. Emitter current will not decrease."], "jumps": []}, {"id": "P1173", "text": ["When the base voltage increases, the forward biased emitter to base PN junction increases.  Emitter current will not stay the same.", "When the base voltage increases, the forward biased emitter to base PN junction increases. Emitter current will not stay the same."], "jumps": []}, {"id": "P1180", "text": ["In a common emitter amplifier, when emitter current increases the collector current _______"], "jumps": ["P1170"]}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1182", "text": ["When the emitter current increases, the collector attracts the current.  Collector current will not decrease.", "When the emitter current increases, the collector attracts the current. Collector current will not decrease."], "jumps": []}, {"id": "P1183", "text": ["When the emitter current increases, the collector attracts the current.  Collector current will not stay the same.", "When the emitter current increases, the collector attracts the current. Collector current will not stay the same."], "jumps": []}, {"id": "P1190", "text": ["Transistor bias is determined by R1, R2, R3, R4 and C1.", "Transistor bias is determined by R1, R2, R3, R4 and C1....."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["When an input signal is applied to the base of Q1, it's combined with the fixed bias voltage established by R1 and R2."], "jumps": ["P1205", "P1190"]}, {"id": "P1205", "text": ["R1 and R2 form a voltage divider that is operated by +Vcc.  A fixed bias is always present on the base of Q1.", "R1 and R2 form a voltage divider that is operated by +Vcc. A fixed bias is always present on the base of Q1..."], "jumps": ["P1210", "P1190"]}, {"id": "P1206", "text": ["VOLTAGE DIVIDER - A voltage divider reduces the voltage applied to the base of Q1. Without R2 when Vcc is first applied, there is no current flow yet and no voltage drop across R1. This allows the FULL VALUE of Vcc to be applied to the base of Q1 which could damage the transistor...voltage. The voltage at the top of R1 is Vcc. R2 reduces Vcc so the voltage at the bottom of R1 is less than Vcc. R2 drops the rest of the voltage."], "jumps": ["P1207", "P1208"]}, {"id": "P1207", "text": ["VOLTAGE DIVIDER - With R2, current flows through R2 and R1 even when Q1 is in cutoff. Base voltage (VB) will be significantly less than Vcc thus protecting the B-E junction from high voltage and stabilizing VB.VALUE of Vcc to be applied to the base of Q1 which could damage the transistor..e. The voltage at the top of R1 is Vcc. R2 reduces Vcc so the voltage at the bottom of R1 is less than Vcc. R2 drops the rest of the voltage."], "jumps": ["P1208", "P1206"]}, {"id": "P1208", "text": ["R1 and R2 form a voltage divider that is operated by +Vcc.  A fixed bias is always present on the base of Q1.", "R1 and R2 form a voltage divider that is operated by +Vcc. A fixed bias is always present on the base of Q1.."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["Any change in the fixed bias of  Q1 produces a predicted change at the output.", "Any change in the fixed bias of Q1 produces a predicted change at the output."], "jumps": ["P1220", "P1208"]}, {"id": "P1220", "text": ["Resistor R4 and bypass capacitor C1 provide self biasing or stability for the circuit."], "jumps": ["P1230", "P1208"]}, {"id": "P1230", "text": ["Normal operation of the amplifier produces heat.  Heat causes an unpredictable change at the output.", "Normal operation of the amplifier produces heat. Heat causes an unpredictable change at the output."], "jumps": ["P1240", "P1208"]}, {"id": "P1240", "text": ["R4 provides temperature stability by decreasing emitter current when current increases due to heat."], "jumps": ["P1250", "P1208"]}, {"id": "P1242", "text": ["R4 provides temperature stability by decreasing emitter current when current increases due to heat.", "R4 provides temperature stability by decreasing emitter current when current increases due to heat..."], "jumps": ["P1250", "P1208"]}, {"id": "P1245", "text": ["TEMPERATURE STABILITY - If the temperature of the transistor increases the emitter current increases. This causes the voltage drop across R4 to increase, decreasing the forward bias between the base and emitter decreasing emitter current."], "jumps": ["P1242"]}, {"id": "P1250", "text": ["C1 provides a path for any unwanted AC that is produced. This insures that the output signal is not affected.", "C1 provides a path for any unwanted AC that is produced. This insures that the output signal is not affected.."], "jumps": ["P1260", "P1242"]}, {"id": "P1252", "text": ["C1 provides a path for any unwanted AC that is produced. This insures that the output signal is not affected."], "jumps": ["P1260", "P1242"]}, {"id": "P1255", "text": ["UNWANTED AC - The value of the bypass capacitor allows a low reactance to the frequency of the input signal. The changing emitter voltage, due to the input signal, is shorted to ground."], "jumps": ["P1256", "P1252"]}, {"id": "P1256", "text": ["The bypass capacitor also has a high reactance to very low frequencies. This prevents a voltage change on the emitter, due to a temperature change, from being grounded. Temperature changes are normally slow or low frequency."], "jumps": []}, {"id": "P1260", "text": ["The output signal is determined by collector load resistor R3."], "jumps": ["P1270", "P1252"]}, {"id": "P1270", "text": ["When the emitter to collector current increases, more voltage drops across R3 and the output signal decreases."], "jumps": ["P1280", "P1252"]}, {"id": "P1280", "text": ["When current decreases, less voltage is dropped across R3 and the output signal increases."], "jumps": ["P1290", "P1252"]}, {"id": "P1290", "text": ["The result is a signal on the output that is a replica of the input signal except it is amplified and inverted."], "jumps": ["P1300", "P1252"]}, {"id": "P1300", "text": ["Now, let's add two important components to the amplifier circuit, C2 and C3."], "jumps": ["P1310", "P1252"]}, {"id": "P1310", "text": ["C2 is an input coupling capacitor that prevents any DC voltage from the input, from reaching the base of the transistor.", "C2 is an input coupling capacitor that prevents any DC voltage from the input, from reaching the base of the transistor.."], "jumps": ["P1320", "P1252"]}, {"id": "P1320", "text": ["C3 is an output coupling capacitor that prevents the DC bias on the collector from reaching the output."], "jumps": ["P1330", "P1252"]}, {"id": "P1330", "text": ["The coupling capacitors do not effect the bias voltages on Q1."], "jumps": ["P1340", "P1252"]}, {"id": "P1340", "text": ["Select the component (s) that establish the base bias.", "Select the component (s) that establish the base bias......"], "jumps": ["P1252"]}, {"id": "P1341", "text": [], "jumps": []}, {"id": "P1342", "text": ["You selected C2, the input coupling capacitor. C2 prevents DC  voltages from the input signal from reaching the transistor base.", "You selected C2, the input coupling capacitor. C2 prevents DC voltages from the input signal from reaching the transistor base."], "jumps": []}, {"id": "P1343", "text": ["You selected the collector load resistor. R3 develops the output signal and reverse biases the collector to base PN junction."], "jumps": []}, {"id": "P1344", "text": ["You selected the emitter biasing components. R4 is used for temperature stability and C1 places the emitter at AC ground."], "jumps": []}, {"id": "P1345", "text": ["You selected the output coupling capacitor. C3 is used to prevent the DC collector bias voltage from reaching the output."], "jumps": []}, {"id": "P1350", "text": ["Select the component that develops the output signal and reverse biases the collector to base PN junction."], "jumps": ["P1340"]}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1353", "text": ["You selected one of the components that establish base bias. R1 and R2 form a voltage divider."], "jumps": []}, {"id": "P1354", "text": ["You selected one of the emitter biasing components. R4 is used for temperature stability and C1 places the emitter at AC ground."], "jumps": []}, {"id": "P1360", "text": ["Select the output coupling capacitor.", "Select the output coupling capacitor......................."], "jumps": ["P1350"]}, {"id": "P1361", "text": [], "jumps": []}, {"id": "P1362", "text": ["You selected C2, the input coupling capacitor. C2 prevents DC  voltages from the input signal from reaching the transistor base.", "You selected C2, the input coupling capacitor. C2 prevents DC voltages from the input signal from reaching the transistor base."], "jumps": []}, {"id": "P1363", "text": ["You selected one of the components that establish base bias. R1 and R2 form a voltage divider."], "jumps": []}, {"id": "P1364", "text": ["You selected the collector load resistor. R3 develops the output signal and reverse biases the collector to base PN junction."], "jumps": []}, {"id": "P1365", "text": ["You selected one of the emitter biasing components. R4 is used for temperature stability and C1 places the emitter at AC ground."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on COMMON EMITTER AMPLIFIER.", "This completes the information on COMMON EMITTER AMPLIFIER..."], "jumps": ["P1001", "P1360"]}, {"id": "P1920", "text": ["1.  The common emitter amplifier has the input applied to the               base, the output is taken from the collector, and the emitter is        common.", "1. The common emitter amplifier has the input applied to the base, the output is taken from the collector, and the emitter is common."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  In a common emitter amplifier, a small AC input signal controls      a large inverted output signal.", "2. In a common emitter amplifier, a small AC input signal controls a large inverted output signal."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  C2 and C3 are coupling capacitors that pass AC and block DC.", "3. C2 and C3 are coupling capacitors that pass AC and block DC."], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["4.  R1 and R2 develop base bias. They form a voltage divider.", "4. R1 and R2 develop base bias. They form a voltage divider."], "jumps": ["P1960", "P1920"]}, {"id": "P1960", "text": ["5.  R4 and C1 provide self bias. R4 provides temperature stability       and C1 places the emitter at AC ground.", "5. R4 and C1 provide self bias. R4 provides temperature stability and C1 places the emitter at AC ground."], "jumps": ["P1970", "P1920"]}, {"id": "P1970", "text": ["6.  R3 is the collector load resistor that biases the collector and          develops the output signal.", "6. R3 is the collector load resistor that biases the collector and develops the output signal."], "jumps": ["P1999", "P1920"]}, {"id": "P1999", "text": ["You have completed the Summary.  You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1920"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["The class of operation and the voltage gain (Av) are needed to identify normal operation of a common emitter amplifier."], "jumps": ["P2030", "P2001", "P2025"]}, {"id": "P2025", "text": ["COMMON EMITTER AMPLIFIER CLASS OF OPERATION", "Class Base Bias Waveform A Above Cutoff Transistor conducts for the entire duration of input signal. > 0.6 V IN OUT B At Cutoff Transistor conducts for half of the input signal. = 0.6 V IN OUT C Below Cutoff Transistor conducts for less than half of the input signal. < 0.6 V IN OUTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT IN OUTTTTTN OUTTTTTTTTTTTTTTTTTTTTT IN OUT"], "jumps": []}, {"id": "P2030", "text": ["Class of operation is determined by the bias placed on the base of Q1 by R1 and R2.", "Class of operation is determined by the bias placed on the base of Q1 by R1 and R2.."], "jumps": ["P2040", "P2020", "P2025"]}, {"id": "P2032", "text": ["Class of operation is determined by the bias placed on the base of Q1 by R1 and R2."], "jumps": ["P2040", "P2020", "P2025"]}, {"id": "P2040", "text": ["The gain is determined by emitter resistor R4 and collector resistor R3."], "jumps": ["P2050", "P2032"]}, {"id": "P2050", "text": ["If class of operation and voltage gain are known, normal operation is determined by comparing input and output signals."], "jumps": ["P2060", "P2032"]}, {"id": "P2060", "text": ["For example, this is a class A common emitter with a gain of 100. The input to output comparison shows normal operation."], "jumps": ["P2070", "P2032"]}, {"id": "P2070", "text": ["The .9 V bias at Q1verifies class A.  Dividing Eout by Ein verifies Av.           \n                                                    Eout      1\n                                          Av =             =        = 100\n                                                     Ein        .01", "The .9 V bias at Q1verifies class A. Dividing Eout by Ein verifies Av. Eout 1 Av = = = 100 Ein .01"], "jumps": ["P2080", "P2032"]}, {"id": "P2080", "text": ["If the bias on Q1 is changed to .6 V, the class of operation becomes class B."], "jumps": ["P2090", "P2032"]}, {"id": "P2090", "text": ["The input to output comparison shows normal operation for a class B common emitter."], "jumps": ["P2100", "P2032"]}, {"id": "P2100", "text": ["The actual component values determine the class of operation and voltage gain."], "jumps": ["P2110", "P2032"]}, {"id": "P2110", "text": ["Let's calculate the base bias on Q1 to determine the class of operation."], "jumps": ["P2120", "P2032"]}, {"id": "P2120", "text": ["R1 and R2 form a voltage divider. The voltage between R1 and R2 is applied as Q1 bias voltage."], "jumps": ["P2130", "P2032", "P2125"]}, {"id": "P2122", "text": ["R1 and R2 form a voltage divider. The voltage between R1 and R2 is applied as Q1 bias voltage."], "jumps": ["P2130", "P2032", "P2125"]}, {"id": "P2125", "text": ["oltage between R1 and R2 or Er2. Remember, R1 and R2 form a voltage divider.", "CALCULATING Eb - The voltage on the base (Eb) equals the voltage between R1 and R2 or Er2. Remember, R1 and R2 form a voltage divider. Follow the steps below to find Eb.", "1. Find Rt RT = R1 + R2 = 100 kW + 7.5 kW = 107.5 kW", "3. Calculate Eb Er2 = It x R2 = .11 mA x 7.5 kW = .84 VAAAWWW"], "jumps": []}, {"id": "P2130", "text": ["Recall that .6 V is needed to forward bias the base to emitter PN junction."], "jumps": ["P2140", "P2122"]}, {"id": "P2140", "text": ["This common emitter is biased to .84 V or above cutoff. This value indicates class A operation."], "jumps": ["P2150", "P2122", "P2025"]}, {"id": "P2142", "text": ["This common emitter is biased to .84 V or above cutoff. This value indicates class A operation."], "jumps": ["P2150", "P2122", "P2025"]}, {"id": "P2150", "text": ["Determine the class of operation for this common emitter circuit."], "jumps": ["P2142", "P2155"]}, {"id": "P2151", "text": [], "jumps": []}, {"id": "P2152", "text": ["With .6 V on the base, the transistor is biased at cutoff. Class A operation requires the transistor to be biased above cutoff."], "jumps": []}, {"id": "P2153", "text": ["With .6 V on the base, the transistor is biased at cutoff. Class C operation requires the transistor to be biased below cutoff."], "jumps": []}, {"id": "P2155", "text": ["CALCULATING Eb - Follow the steps below to find Eb.", "1. Find Rt RT = R1 + R2 = 95 kW + 5 kW = 100 kWWWkWW", "3. Calculate Eb Er2 = It x R2 = It x 5 kW = .84 V V84 VAAAWWW"], "jumps": ["P2158"]}, {"id": "P2158", "text": ["COMMON EMITTER AMPLIFIER CLASS OF OPERATION", "Class Base Bias Waveform A Above Cutoff Transistor conducts for the entire duration of input signal. > 0.6 V IN OUT B At Cutoff Transistor conducts for half of the input signal. = 0.6 V IN OUT C Below Cutoff Transistor conducts for less than half of the input signal. < 0.6 V IN OUTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT IN OUTTTTTN OUTTTTTTTTTTTTTTTTTTTTT IN OUT"], "jumps": ["P2150", "P2155"]}, {"id": "P2160", "text": ["Once the class of operation is determined, the gain (Av) is found by comparing the input and output signals."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["The actual gain of a common emitter is determined by this formula.                          \n let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
