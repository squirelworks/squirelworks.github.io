const book = {"title": "9395Z108", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: AIRCRAFT INSTRUMENTSsdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": ["# #\" #& \"\"# &\"###2' &2#&.22&# 25--283-.#285255232/238882-.-5:38832222882282-213:22::82-22225:8-33-22282232.22258558.5822385:235:222283538::2585582::2:", "&&#&# #/2.#.& -8 \"#.-&23..22'/.#212&-2258\"588:52", "### ## /# #/&# \" \"/##\"#/&//..#/..&/28.&...&824/&.88-8588..2222858852.28:582228588358282228258.888:825:583.8828::8228828588828583:35558.555.85::88::85588:88:5555::38::85:::5:5:52::85::88::", ":85:855::83:5:5.5:55:855:52.5:5283822242348522...252...2..82/.4..22//2./..##/.8.#&./#&/..##// ##\",##/## #. / /& # ## ## ## ## ## \" #/# ## /# ## #.\" ./ #//###,//.&/#.\"#/.##/./#&/2.&/.../&//....//&2222.2/252.&28.8522582.824828828::255:::5:", "/,,,,,,,,,,,,,/, ,, ,,,,,,6, ,,,6,,, ,,,,,//6//6,,,,/6/,,,/,4/,,/6/4494,,494/6846446/4884664;44;889448489888<8648<<8;44;88988<88948;98<44<;:<44<<8;44<48<<8;48<48<88;48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Identify the classifications of aircraft instruments. w Define and describe basic aircraft instruments.", "w Describe the various operating principles of aircraft instruments.."], "jumps": []}, {"id": "P300", "text": ["This lesson discusses the instruments used in an airplane cockpit.  These instruments are used to inform the pilot or copilot of certain flight conditions such as; airspeed, altitude, engine temperature and fuel level.", "This lesson discusses the instruments used in an airplane cockpit. These instruments are used to inform the pilot or copilot of certain flight conditions such as; airspeed, altitude, engine temperature and fuel level."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Without these instruments a pilot would be flying blind, not knowing anything but what he can see through his windshield. Imagine trying to land a plane in the dark with no instruments."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["First we will discuss the various instruments of an aircraft and how they will assist the pilot.  Next, we will discuss the different    types of systems used to generate the information displayed by the instruments.", "First we will discuss the various instruments of an aircraft and how they will assist the pilot. Next, we will discuss the different types of systems used to generate the information displayed by the instruments."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["By understanding these principles a pilot can understand exactly what the reading of certain instruments indicate, and why a reading may or may not be accurate.  This is important when determining the accuracy of critical information.", "By understanding these principles a pilot can understand exactly what the reading of certain instruments indicate, and why a reading may or may not be accurate. This is important when determining the accuracy of critical information."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on AIRCRAFT INSTRUMENTS............................"], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["We will discuss five classifications of flight instruments.  While a certain instrument may be classified under one system, the            information may be used to determine information about another system.", "We will discuss five classifications of flight instruments. While a certain instrument may be classified under one system, the information may be used to determine information about another system.", "Flight Control System Fuel System Navigational System Mechanical System Propulsion System"], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["The Flight Control System is the first classification of instruments.  We will discuss nine types of instruments in this       classification.  These are the basic instruments, planes may have or less than the ones listed in the classification.", "The Rate of Climb Indicator, also known as the Vertical Velocity Indicator, is used to indicate the rate of climb or descent of an     aircraft.  When the aircraft is level the indicator should point       directly at the zero mark.  The indicator moves up for a climb and down for a descent.", "The Airspeed Indicator indicates the speed at which the aircraft is moving.  Differences in design are normally the unit of measure such as; miles per hour, knots or Mach.  Some Airspeed Indicators may show conditions in more than one unit.", "The Flight Control System is the first classification of instruments. We will discuss nine types of instruments in this classification. These are the basic instruments, planes may have or less than the ones listed in the classification.", "Rate of Climb Indicator Airspeed Indicator Altimeter Turn & Bank Indicator Turn Coordinator Angle-of-Attack Indicator Attitude Indicator Compass Heading Indicator", "The Rate of Climb Indicator, also known as the Vertical Velocity Indicator, is used to indicate the rate of climb or descent of an aircraft. When the aircraft is level the indicator should point directly at the zero mark. The indicator moves up for a climb and down for a descent.", "The Airspeed Indicator indicates the speed at which the aircraft is moving. Differences in design are normally the unit of measure such as; miles per hour, knots or Mach. Some Airspeed Indicators may show conditions in more than one unit."], "jumps": ["P1040", "P1020", "P1050", "P1060"]}, {"id": "P1060", "text": ["Airspeed Indicators that show conditions based on Mach are known as Mach Indicators.  A plane traveling at Mach 0.5 would be going half  the speed of sound.  Likewise, a plane traveling at Mach 2 would be going twice the speed of sound.", "Some Airspeed Indicators also contain an additional needle indicating maximum allowable airspeed.  This needle informs the pilot of the maximum speed he should take the plane. The maximum speed is a function of altitude, the higher you go the faster you can go.", "Airspeed Indicators that show conditions based on Mach are known as Mach Indicators. A plane traveling at Mach 0.5 would be going half the speed of sound. Likewise, a plane traveling at Mach 2 would be going twice the speed of sound.", "Some Airspeed Indicators also contain an additional needle indicating maximum allowable airspeed. This needle informs the pilot of the maximum speed he should take the plane. The maximum speed is a function of altitude, the higher you go the faster you can go."], "jumps": ["P1070", "P1050", "P1080", "P1060"]}, {"id": "P1080", "text": ["The construction of a basic Airspeed Indicator may not provide a very accurate indicated airspeed.  However, a True Airspeed Indicator uses an Air-Data computer to correct for ambient altitude and temperature effects which provides the actual speed of the aircraft.", "The Altimeter indicates the altitude of an aircraft based on pressure.  Three needles are normally used to indicate this value  like a clock.  The smallest needle represents 10,000 ft, the next     needle 1000 ft, and the last needle 100 ft.", "The construction of a basic Airspeed Indicator may not provide a very accurate indicated airspeed. However, a True Airspeed Indicator uses an Air-Data computer to correct for ambient altitude and temperature effects which provides the actual speed of the aircraft.", "The Altimeter indicates the altitude of an aircraft based on pressure. Three needles are normally used to indicate this value like a clock. The smallest needle represents 10,000 ft, the next needle 1000 ft, and the last needle 100 ft.", "10,000 ft. 1,000 ft. Barometric Pressure Setting", "100 ft.ft. 1,000 ft. Barometric Pressure Setting"], "jumps": ["P1090", "P1070", "P1100", "P1080"]}, {"id": "P1100", "text": ["There is a dial on the altimeter that is used to set the barometric pressure.  Without the barometric pressure set correctly the           altimeter will not give a correct reading.  Remember, \"high to low  look out below\".", "There is a dial on the altimeter that is used to set the barometric pressure. Without the barometric pressure set correctly the altimeter will not give a correct reading. Remember, \"high to low look out below\"."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["The barometric pressure can be obtained from a local station through the communications radio.  It is very important to continually check the barometric pressure, just a little bit off could mean thousands of feet.", "The barometric pressure can be obtained from a local station through the communications radio. It is very important to continually check the barometric pressure, just a little bit off could mean thousands of feet."], "jumps": ["P1120", "P1090"]}, {"id": "P1120", "text": ["The Turn-and-Bank Indicator, also known as the Turn-and-Slip or Needle and Ball Indicator, is used to help the pilot perform the  correct execution of a turn.  This type of indicator is rated by the    number of minutes required for a 180 degree turn.", "The Turn-and-Bank Indicator, also known as the Turn-and-Slip or Needle and Ball Indicator, is used to help the pilot perform the correct execution of a turn. This type of indicator is rated by the number of minutes required for a 180 degree turn.", "Turn Marker (also called dog house's)"], "jumps": ["P1130", "P1090"]}, {"id": "P1130", "text": ["The needle is used to indicate the planes change in the roll axis. When a turn is made, in either direction, the pilot should continue turning the plane until the needle is lined up with the marked         position.  The ball indicates if the plane is turning too sharply or    too broadly.", "The needle is used to indicate the planes change in the roll axis. When a turn is made, in either direction, the pilot should continue turning the plane until the needle is lined up with the marked position. The ball indicates if the plane is turning too sharply or too broadly."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["After positioning the plane properly as indicated by the Turn-and-Bank Indicator, the aircraft Clock is used to determine how many degrees the aircraft has turned.", "A Turn Coordinator is also used to assist the pilot in the correct execution of a turn.  The only differences between a Turn Coordinator and a Turn-and-Bank Indicator is their appearance and a few mechanical changes.  Their operation is the same.", "A Turn Coordinator is also used to assist the pilot in the correct execution of a turn. The only differences between a Turn Coordinator and a Turn-and-Bank Indicator is their appearance and a few mechanical changes. Their operation is the same."], "jumps": ["P1150", "P1120", "P1160", "P1140"]}, {"id": "P1160", "text": ["The Turn Coordinator has a picture of an airplane on the display. When the planes position to the markings and the ball is in the      center, the plane will make a 360 degree turn in the indicated time.", "The Turn Coordinator has a picture of an airplane on the display. When the planes position to the markings and the ball is in the center, the plane will make a 360 degree turn in the indicated time."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["When the ball is displaced the plane is not correctly positioned. The plane should be repositioned so the ball is in the center.  A      turn made by using the Turn Coordinator is known as a \"Standard- Rate Turn\".", "When the ball is displaced the plane is not correctly positioned. The plane should be repositioned so the ball is in the center. A turn made by using the Turn Coordinator is known as a \"Standard- Rate Turn\"."], "jumps": ["P1180", "P1150"]}, {"id": "P1180", "text": ["The Angle-of-Attack Indicator is used to display the local angle of attack.  This information helps the pilot during landing by             indicating the aircraft's attitude and speed of descent.  It also        provides a stall warning.", "The Attitude Indicator, also known as the Artificial Horizon, is used to show the pilot the position of the plane in reference to the ground below.  If the Attitude Indicator's plane isn't lined up with the horizon line, the plane will be climbing or descending.", "This indicator is especially important for night and low visibility flying where the horizon is difficult to see.  In the example below    the plane is ascending to the right.  The lines at the top of the       indicator represent the number of degrees of the turn.", "The Angle-of-Attack Indicator is used to display the local angle of attack. This information helps the pilot during landing by indicating the aircraft's attitude and speed of descent. It also provides a stall warning.", "The Attitude Indicator, also known as the Artificial Horizon, is used to show the pilot the position of the plane in reference to the ground below. If the Attitude Indicator's plane isn't lined up with the horizon line, the plane will be climbing or descending.", "This indicator is especially important for night and low visibility flying where the horizon is difficult to see. In the example below the plane is ascending to the right. The lines at the top of the indicator represent the number of degrees of the turn."], "jumps": ["P1190", "P1150", "P1200", "P1180", "P1210"]}, {"id": "P1210", "text": ["A Compass is used to indicate the direction of the plane.  This instrument is very reliable, except when it becomes close to the    earth's poles, or a sharp turn is attempted.  A compass illustrates the heading of a plane in degrees divided by 10, so 33 would be 330 degrees.", "A Compass is used to indicate the direction of the plane. This instrument is very reliable, except when it becomes close to the earth's poles, or a sharp turn is attempted. A compass illustrates the heading of a plane in degrees divided by 10, so 33 would be 330 degrees."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["The Heading Indicator is used when the reading from a compass may become unreliable.  The Heading Indicator does not initially determine the direction of the plane, it must be set when the plane is neither climbing nor descending.", "The Heading Indicator is used when the reading from a compass may become unreliable. The Heading Indicator does not initially determine the direction of the plane, it must be set when the plane is neither climbing nor descending."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["The Heading Indicator is set to the value of the compass, and checked every thirty minutes to see if it is still calibrated.  The     Heading Indicator is labeled much like the compass.  The plane on the instrument indicates the heading of the actual aircraft.", "The Heading Indicator is set to the value of the compass, and checked every thirty minutes to see if it is still calibrated. The Heading Indicator is labeled much like the compass. The plane on the instrument indicates the heading of the actual aircraft."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["Which of the following instruments could be used to accurately determine if an aircraft was climbing or descending?"], "jumps": ["P1220"]}, {"id": "P1241", "text": ["The Turn Coordinator does not deal with the altitude of the plane, it deals with helping the pilot turn the aircraft properly.  The Attitude Indicator will show the plane either climbing or descending.", "The Turn Coordinator does not deal with the altitude of the plane, it deals with helping the pilot turn the aircraft properly. The Attitude Indicator will show the plane either climbing or descending."], "jumps": []}, {"id": "P1243", "text": ["The Heading Indicator just shows the direction of the plane North, West, South, and East, not up and down.  The Attitude Indicator will show the plane either climbing or descending.", "The Heading Indicator just shows the direction of the plane North, West, South, and East, not up and down. The Attitude Indicator will show the plane either climbing or descending...."], "jumps": ["P"]}, {"id": "P1250", "text": ["The Fuel System is the second classification of instruments.  We will discuss two types of fuel systems instruments.  These are the basic instruments, planes may have more or less than the ones listed in this classification.", "The Fuel System is the second classification of instruments. We will discuss two types of fuel systems instruments. These are the basic instruments, planes may have more or less than the ones listed in this classification.", "Flight Control System Fuel System Navigational System Mechanical System Propulsion System", "Fuel Quantity Indicator Fuel Flow Meterrrtor Altimeter Turn & Bank Indicator Turn Coordinator Angle-of-Attack Indicator Attitude Indicator Compass Heading Indicator"], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["The Fuel Quantity Indicator tells the pilot how much fuel is left in the fuel tanks.  One indicator may be used for all tanks, or a separate indicator used for each tank.  The units of measure for most fuel quantity indicators is either the pound or the gallon.", "The Fuel Quantity Indicator tells the pilot how much fuel is left in the fuel tanks. One indicator may be used for all tanks, or a separate indicator used for each tank. The units of measure for most fuel quantity indicators is either the pound or the gallon."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["The Fuel Flow Meter is used to tell the pilot the rate at which the fuel is being used.  This kind of information can help the pilot        determine exactly how much longer his fuel supply could be used until it has been exhausted.", "The Fuel Flow Meter is used to tell the pilot the rate at which the fuel is being used. This kind of information can help the pilot determine exactly how much longer his fuel supply could be used until it has been exhausted."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["Most fuel systems also display fuel pressure, but this instrument is normally classified with the propulsion system instruments. Knowing the remaining fuel quantity, and the rate at which its being used is very important to a pilot."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["The Navigational System is the third classification of instruments.  We will discuss five types in this classification.        These again are just the basic instruments, planes may have more or less than the ones listed in this classification.", "A  Course Indicator is one of two instruments connected to the VOR Navigational Equipment.  This indicator shows many functions like selected course, current heading, course deviation and glide slope.", "The Navigational System is the third classification of instruments. We will discuss five types in this classification. These again are just the basic instruments, planes may have more or less than the ones listed in this classification.", "Flight Control System Fuel System Navigational System Mechanical System Propulsion System", "Course Indicator Radio Magnetic Indicator Range Indicator Radio Compass Bearing Ind. Plan Position Indicator", "A Course Indicator is one of two instruments connected to the VOR Navigational Equipment. This indicator shows many functions like selected course, current heading, course deviation and glide slope."], "jumps": ["P1300", "P1270", "P1310", "P1290"]}, {"id": "P1310", "text": ["This information aids the pilot, and possibly autopilot, in knowing the planes status in comparison to the desired status. For example, the Course Deviation Indicator tells the pilot how much he has deviated from his selected course."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["The Radio Magnetic Indicator is the second instrument connected to the Navigational Equipment.  This indicator shows the direction of  the VOR and ADF navigational headings compared to the actual heading of the aircraft.", "The Radio Magnetic Indicator is the second instrument connected to the Navigational Equipment. This indicator shows the direction of the VOR and ADF navigational headings compared to the actual heading of the aircraft."], "jumps": ["P1330", "P1300"]}, {"id": "P1330", "text": ["Some airplanes have a Range Indicator that tells the pilot how far they are from a certain transmitting station.  These indicators are  normally attached to Distance Measuring Equipment (DME). These Systems are mainly used in military aircraft.", "Some airplanes have a Range Indicator that tells the pilot how far they are from a certain transmitting station. These indicators are normally attached to Distance Measuring Equipment (DME). These Systems are mainly used in military aircraft."], "jumps": ["P1340", "P1300"]}, {"id": "P1340", "text": ["A Radio Compass Bearing Indicator is another type of direction indicator that is attached to the ADF Navigational Equipment. This indicator determines the heading compared to radio signals transmitted by radio beacons.", "A Plan Position Indicator is the last navigational instrument we will discuss.  It is normally located on military and more sophisticated aircraft utilizing radar.  This instrument provides a radar image of the terrain below.", "A Plan Position Indicator is the last navigational instrument we will discuss. It is normally located on military and more sophisticated aircraft utilizing radar. This instrument provides a radar image of the terrain below."], "jumps": ["P1350", "P1330", "P1360", "P1340"]}, {"id": "P1360", "text": ["Which of the following indicators is not connected to the VOR?"], "jumps": ["P1350"]}, {"id": "P1361", "text": ["Both the Radio Magnetic Indicator and the Course Indicator are attached to the VOR."], "jumps": []}, {"id": "P1370", "text": ["The Mechanical System is the fourth classification of instruments.  We will discuss two types in this classification. These again are just the basic instruments, planes may have more or less than the ones in this classification.", "There are many different types of hydraulic indicators.  These indicators represent the pressure associated with certain hydraulic systems of the aircraft.  The example below shows a hydraulic flap pressure gauge.", "The Mechanical System is the fourth classification of instruments. We will discuss two types in this classification. These again are just the basic instruments, planes may have more or less than the ones in this classification.", "Flight Control System Fuel System Navigational System Mechanical System Propulsion System", "Hydraulic Pressure Gauge De-Icing Pressure Gauge", "There are many different types of hydraulic indicators. These indicators represent the pressure associated with certain hydraulic systems of the aircraft. The example below shows a hydraulic flap pressure gauge."], "jumps": ["P1380", "P1360", "P1390", "P1370"]}, {"id": "P1390", "text": ["Along with hydraulic pressure gauges there may also be an indicator representing the position of the device being monitored.  These indicators may or may not be located in the same instrument.", "Along with hydraulic pressure gauges there may also be an indicator representing the position of the device being monitored. These indicators may or may not be located in the same instrument..........."], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["For planes with a de-icing system there is a gauge which indicates the current pressure of the boots.  It is important to note that many systems, other than the ones we have discussed, may have pressure gauges that are located in the cockpit.", "For planes with a de-icing system there is a gauge which indicates the current pressure of the boots. It is important to note that many systems, other than the ones we have discussed, may have pressure gauges that are located in the cockpit."], "jumps": ["P1410", "P1380"]}, {"id": "P1410", "text": ["The Propulsion System is the fifth classification of instruments. We will discuss six types in this classification.  These again are just the basic instruments, planes may have more or less than the ones listed in this classification.", "The Engine Gauge Unit is used to monitor certain pressure and temperature levels in the engine.  Most engine gauge units monitor fuel pressure, oil pressure, and oil temperature with three different indicators inside the unit.", "Tachometers are used to measure the speed at which the engine's crankshaft or main rotor assembly is spinning.  This measure of speed is in RPM's, or revolutions per minute.  With multi-engine aircraft, one tachometer may contain multiple needles to indicate each engines RPM.", "The Propulsion System is the fifth classification of instruments. We will discuss six types in this classification. These again are just the basic instruments, planes may have more or less than the ones listed in this classification.", "Flight Control System Fuel System Navigational System Mechanical System Propulsion System", "Engine Gauge Unit Tachometers Synchroscope Temperature Indicators Exhaust Gas Temp. Ind. Turbine Inlet Temp. Gauge", "The Engine Gauge Unit is used to monitor certain pressure and temperature levels in the engine. Most engine gauge units monitor fuel pressure, oil pressure, and oil temperature with three different indicators inside the unit.", "Tachometers are used to measure the speed at which the engine's crankshaft or main rotor assembly is spinning. This measure of speed is in RPM's, or revolutions per minute. With multi-engine aircraft, one tachometer may contain multiple needles to indicate each engines RPM."], "jumps": ["P1420", "P1400", "P1430", "P1410", "P1440"]}, {"id": "P1440", "text": ["A Synchroscope is used in an aircraft with more than one engine.  This instrument compares the speed of one engine to all others in the aircraft. If an engine is moving faster or slower it is adjusted to the proper speed.", "A Synchroscope is used in an aircraft with more than one engine. This instrument compares the speed of one engine to all others in the aircraft. If an engine is moving faster or slower it is adjusted to the proper speed."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["The display of a synchroscope indicates to the pilot if the engines being compared are faster or slower than the engines they are being compared too.  The engine used for comparison is known as the slave engine.", "The display of a synchroscope indicates to the pilot if the engines being compared are faster or slower than the engines they are being compared too. The engine used for comparison is known as the slave engine."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["Temperature Indicators are used to indicate the temperature of various sections of the aircraft.  Some temperature indicators        include carburetor air, free air, outside air and the cylinder head.   Let's look at two specific temperature indicators.", "Temperature Indicators are used to indicate the temperature of various sections of the aircraft. Some temperature indicators include carburetor air, free air, outside air and the cylinder head. Let's look at two specific temperature indicators."], "jumps": ["P1470", "P1440"]}, {"id": "P1470", "text": ["The Exhaust Gas Temperature Indicator, also known as the EGT, is used to monitor the temperature of the gas leaving the turbine. This gauge is normally used with gas turbine engine, and not with internal combustion engines."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["The Turbine Inlet Temperature Gauge, also known as the TIT, is used to monitor the temperature of the air entering the turbine. Again, this gauge is normally used with gas turbine engines, and not with internal combustion engines."], "jumps": ["P1490", "P1470"]}, {"id": "P1490", "text": ["Which indicator is used to control the speed of engines in a multi-engine airplane?"], "jumps": ["P1480"]}, {"id": "P1491", "text": [], "jumps": []}, {"id": "P1492", "text": ["Remember, it is the synchroscope which monitors the speed of the engines compared to one engine known as the slave engine.", "We have just covered the basic instruments of an aircraft. Most aircraft will have a combination of these instruments with additional instruments not mentioned. It is important to note that many instruments today are digital, however, an understanding of their original design is important to understand there operation."], "jumps": ["P1910", "P1490"]}, {"id": "P1910", "text": ["This completes the information on AIRCRAFT INSTRUMENTS.", "This completes the information on AIRCRAFT INSTRUMENTS....."], "jumps": ["P1001", "P1500"]}, {"id": "P1920", "text": ["1.  The Flight Control System is the first classification of                         instruments.  There are nine different types in this                              classification.", "1. The Flight Control System is the first classification of instruments. There are nine different types in this classification.", "Rate of Climb Indicator Airspeed Indicator Altimeter Turn & Bank Indicator Turn Coordinator Angle-of-Attack Indicator Attitude Indicator Compass Heading Indicator", "Flight Control System Fuel System Navigational System Mechanical System Propulsion System"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  The Fuel System is the second classification of instruments.           There are two different types in this classification.", "2. The Fuel System is the second classification of instruments. There are two different types in this classification.", "Flight Control System Fuel System Navigational System Mechanical System Propulsion System", "Fuel Quantity Indicator Fuel Flow Meterrrtor Altimeter Turn & Bank Indicator Turn Coordinator Angle-of-Attack Indicator Attitude Indicator Compass Heading Indicator"], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The Navigational System is the third classification of                         instruments.  There are five different types in this                               classification.", "3. The Navigational System is the third classification of instruments. There are five different types in this classification.", "Flight Control System Fuel System Navigational System Mechanical System Propulsion System", "Course Indicator Radio Magnetic Indicator Range Indicator Radio Compass Bearing Ind. Plan Position Indicator"], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  The Mechanical System is the fourth classification of                         instruments.  There are two different types in this                               classification.", "4. The Mechanical System is the fourth classification of instruments. There are two different types in this classification.", "Flight Control System Fuel System Navigational System Mechanical System Propulsion System", "Hydraulic Pressure Gauge De-Icing Pressure Gauge"], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  The Propulsion System is the fifth classification of                              instruments.  There are six different types in this                                 classification.", "5. The Propulsion System is the fifth classification of instruments. There are six different types in this classification.", "Flight Control System Fuel System Navigational System Mechanical System Propulsion System", "Engine Gauge Unit Tachometers Synchroscope Temperature Indicators Exhaust Gas Temp. Ind. Turbine Inlet Temp. Gauge"], "jumps": ["P1999", "P1950"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1960"]}, {"id": "P2001", "text": ["In this section we are going to look at the actual operation of certain types of instruments.  While there are many different types of systems using indicators, we will be looking at three of the most common, Pitot-Static system, Gyro system, and the Electronic Indicating systems.", "An instrument working off the Pitot-Static System is determined by pressure readings.  Pitot and Static are two types of pressure  measurement sensors located on the aircraft, in most cases in the wing or below the nose of the main body.", "Both of these pressures are attained from a Pitot-Static system head.  The Pitot represents the pressure of the air hitting the plane, and the Static represents the overall pressure of the current altitude.", "The most common instruments that use this system are the Airspeed Indicator, Altimeter and the Rate-of-Climb Indicator. Let's look at each of these and how they use one or both of the pressures from the Pitot-Static system.", "The Airspeed Indicator uses both Pitot and Static pressures. Inside the Airspeed Indicator is a device known as a diaphragm. The Pitot pressure is fed into the diaphragm and the Static pressure is fed into the space around the diaphragm.", "In this section we are going to look at the actual operation of certain types of instruments. While there are many different types of systems using indicators, we will be looking at three of the most common, Pitot-Static system, Gyro system, and the Electronic Indicating systems.", "An instrument working off the Pitot-Static System is determined by pressure readings. Pitot and Static are two types of pressure measurement sensors located on the aircraft, in most cases in the wing or below the nose of the main body.", "Both of these pressures are attained from a Pitot-Static system head. The Pitot represents the pressure of the air hitting the plane, and the Static represents the overall pressure of the current altitude."], "jumps": ["P2030", "P2001", "P2040", "P2020", "P2050", "P2060", "P2070"]}, {"id": "P2070", "text": ["If both pressures are the same, what would happen if the aircraft was not moving, the diaphragm would remain in a zero position. As a plane increases speed the pitot pressure increases expanding the diaphragm.", "If both pressures are the same, what would happen if the aircraft was not moving, the diaphragm would remain in a zero position. As a plane increases speed the pitot pressure increases expanding the diaphragm............", "This expansion pushes a small rod which in turn moves an assembly with a gear. The gears then change the indication of airspeed on the front of the indicator. The static pressure makes sure that both the instrument cavity and the diaphragm have the same initial pressure."], "jumps": ["P2080", "P2060", "P2090", "P"]}, {"id": "P2090", "text": ["Without the same initial pressure, the plane changing altitude would change the speed indication of the plane, remember, as you go up or down in a plane the atmospheric pressure changes.", "The Altimeter works similar to the Airspeed Indicator, it only uses the static pressure.  The undesirable effect if the initial pressures  were not balanced in the Airspeed Indicator.", "The Altimeter works similar to the Airspeed Indicator, it only uses the static pressure. The undesirable effect if the initial pressures were not balanced in the Airspeed Indicator."], "jumps": ["P2100", "P2060", "P2110"]}, {"id": "P2110", "text": ["In the Altimeter we want the pressures to change as we go up or down in the plane.  As the static pressure goes up and down it expands or compresses the diaphragm.  Notice that the diaphragm is sealed.", "In the Altimeter we want the pressures to change as we go up or down in the plane. As the static pressure goes up and down it expands or compresses the diaphragm. Notice that the diaphragm is sealed.", "As a plane increases its altitude the static pressure decreases. This decrease in static pressure causes the diaphragm to expand pushing the rod up. Again like the Airspeed Indicator, the rod moves an assembly with a gear which in turn moves another gear connected to the Altimeter needle."], "jumps": ["P2120", "P2100", "P2130"]}, {"id": "P2130", "text": ["It is important to note that the actual parts inside the instruments have been simplified, and some even removed to explain operation.  If an Altimeter had more than one needle, which most do, additional gears are required to control each needle.", "The Rate-of-Climb Indicator also uses just the static air pressure from the Pitot-Static System.  The static pressure is applied to both the instrument cavity and the diaphragm.  However, the change in pressure in the cavity will be slower because of a diffuser.", "It is important to note that the actual parts inside the instruments have been simplified, and some even removed to explain operation. If an Altimeter had more than one needle, which most do, additional gears are required to control each needle.", "The Rate-of-Climb Indicator also uses just the static air pressure from the Pitot-Static System. The static pressure is applied to both the instrument cavity and the diaphragm. However, the change in pressure in the cavity will be slower because of a diffuser."], "jumps": ["P2140", "P2100", "P2150"]}, {"id": "P2150", "text": ["It is necessary to slow down the pressure change so that a rate of change can be determined.  If a plane was increasing altitude the diaphragm would constantly be lowering in pressure while the cavity was lowering but at a slower rate.", "It is necessary to slow down the pressure change so that a rate of change can be determined. If a plane was increasing altitude the diaphragm would constantly be lowering in pressure while the cavity was lowering but at a slower rate.", "This temporary difference in pressure will cause the rod connected to the diaphragm to be pulled up, and the gear to change the position of the needle. After the plane has leveled off, the pressure will be constant and the diaphragm and cavity pressure will equalize, stabilizing the needle."], "jumps": ["P2160", "P2140", "P2170"]}, {"id": "P2170", "text": ["Some systems use a long curved tube (a bourdon tube) instead of a diaphragm.  As pressure increases within the tube it tries to curl out.  The change in the curve is used to change the position of a needle.", "Some systems use a long curved tube (a bourdon tube) instead of a diaphragm. As pressure increases within the tube it tries to curl out. The change in the curve is used to change the position of a needle."], "jumps": ["P2180", "P2140"]}, {"id": "P2180", "text": ["Which instrument uses both the pitot and static pressures to make readings?"], "jumps": ["P2170"]}, {"id": "P2181", "text": ["The Altimeter only uses static pressure for determining altitude.", "The Rate-of-Climb Indicator only uses static pressure for measuring the rate of change in altitude.", "The picture below illustrates the operation of a gyro.  The rotor is spinning at a constant rate.  As the structure holding the rotor        changes position, the rotor remains at its initial position.  This      due to gyroscopic inertia.", "The picture below illustrates the operation of a gyro. The rotor is spinning at a constant rate. As the structure holding the rotor changes position, the rotor remains at its initial position. This due to gyroscopic inertia.", "Structure Moves, gyro remains in same positionn"], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["Newton stated it as: \"A body in motion tends to move at a constant speed and direction unless disturbed by some external force\".  Let's look at the structure of our gyro one piece at a time.", "Newton stated it as: \"A body in motion tends to move at a constant speed and direction unless disturbed by some external force\". Let's look at the structure of our gyro one piece at a time....."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["The gyro rotor is the piece that will be constantly spinning.  The spinning may be accomplished by different methods like a vacuum, venturi or electrically.  The higher the speed the more resistance resistance in change of positions.", "The gyro rotor is the piece that will be constantly spinning. The spinning may be accomplished by different methods like a vacuum, venturi or electrically. The higher the speed the more resistance resistance in change of positions."], "jumps": ["P2220", "P2190"]}, {"id": "P2220", "text": ["Connecting the rotor to an instrument is a series of gimbals and a base.  The outer gimbal allows movement through one axis, the base another axis, and the inner gimbal is for the rotor to spin on.", "It is important to note that a gyro can only measure the change of two axis' at a time.  One axis must be used for the rotor to spin.      For example, that is why the Attitude Indicator only shows the roll and pitch axis' of rotation, not the yaw axis.", "Some common instruments that use the gyro system are the Turn-and- Bank Indicator, Turn Coordinator, Heading Indicator and again the Attitude Indicator.", "Since the Attitude Indicator is measuring the change of two axis', it requires two gimbals and a base.  One gimbal to spin, one for the roll axis, and the base for the pitch axis.  The Heading Indicator detects change in the yaw axis.", "Connecting the rotor to an instrument is a series of gimbals and a base. The outer gimbal allows movement through one axis, the base another axis, and the inner gimbal is for the rotor to spin on.", "It is important to note that a gyro can only measure the change of two axis' at a time. One axis must be used for the rotor to spin. For example, that is why the Attitude Indicator only shows the roll and pitch axis' of rotation, not the yaw axis.", "Since the Attitude Indicator is measuring the change of two axis', it requires two gimbals and a base. One gimbal to spin, one for the roll axis, and the base for the pitch axis. The Heading Indicator detects change in the yaw axis."], "jumps": ["P2230", "P2210", "P2240", "P2220", "P2250", "P2260"]}, {"id": "P2260", "text": ["Remember that the Heading Indicator is not a direction seeking instrument, and will slowly change heading due to undesired        conditions of a gyro.  These undesired conditions are known as   precession.", "Remember that the Heading Indicator is not a direction seeking instrument, and will slowly change heading due to undesired conditions of a gyro. These undesired conditions are known as precession."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["Precession is a change in direction of the rotor caused by forces applied to the system.  For example if you pushed a gimbal in one direction, the rotor will change positions in another gimbal.", "Precession is a change in direction of the rotor caused by forces applied to the system. For example if you pushed a gimbal in one direction, the rotor will change positions in another gimbal."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["Normally during flight these precession errors will be small, but necessary to correct.  This precession problem applies to Heading Indicators even under perfect conditions, and all instruments using gyros.", "Normally during flight these precession errors will be small, but necessary to correct. This precession problem applies to Heading Indicators even under perfect conditions, and all instruments using gyros."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["The last important characteristic of the gyro to discuss is their limits.  Today most instruments allow a greater range of motion and an automatic resetting method when the gyro has been spilled.  Spilled means that the gyro has changed position incorrectly and now gives incorrect indications.", "The last important characteristic of the gyro to discuss is their limits. Today most instruments allow a greater range of motion and an automatic resetting method when the gyro has been spilled. Spilled means that the gyro has changed position incorrectly and now gives incorrect indications."], "jumps": ["P2300", "P2270"]}, {"id": "P2300", "text": ["On older gyro instruments, the range of motion is much more limited, and their is no automatic resetting method when the gyro has spilled.  A pilot must use a recaging knob which will reset the gyro for correct indications.", "On older gyro instruments, the range of motion is much more limited, and their is no automatic resetting method when the gyro has spilled. A pilot must use a recaging knob which will reset the gyro for correct indications."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["How many axis' can the gyro below indicate a change in?", "How many axis' can the gyro below indicate a change in?...."], "jumps": ["P2300"]}, {"id": "P2311", "text": [], "jumps": []}, {"id": "P2312", "text": ["Remember, a gyro uses one gimbal for the rotor to spin on, and one gimbal for the first axis, and the base for the second axis. Also, a gyro can only indicate the change of up to two axis'.", "Remember, a gyro uses one gimbal for the rotor to spin on, and one gimbal for the first axis, and the base for the second axis. Also, a gyro can only indicate the change of up to two axis'..."], "jumps": []}, {"id": "P2320", "text": ["The last type of instrument we are going to look at is the Electronic Indicating Instruments.  There are two different types of electronic indicators we will be discussing, Synchro-indicating and Meter indicating.", "The last type of instrument we are going to look at is the Electronic Indicating Instruments. There are two different types of electronic indicators we will be discussing, Synchro-indicating and Meter indicating."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["A Synchro-Type indication system consists of a transmitter synchro and an indicating synchro.  As the transmitter changes position, it causes the identical changes in position on the indicator.  For example, the position of the flaps connected to a transmitter and sent to an indicator in the cockpit.", "A Synchro-Type indication system consists of a transmitter synchro and an indicating synchro. As the transmitter changes position, it causes the identical changes in position on the indicator. For example, the position of the flaps connected to a transmitter and sent to an indicator in the cockpit."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["The change in the indicators position is caused by the identical coil voltages of the transmitter synchro being sent to the indicator.  The most common type of synchro systems are D.C. selsyn, and magnesyn.", "The meter indication system uses a voltmeter to measure the change in voltage referenced to the voltage applied.  For example, the fuel level in some aircraft is monitored by a capacitance bridge circuit.  As the fuel increases, voltage develops across the voltmeter.", "The change in the indicators position is caused by the identical coil voltages of the transmitter synchro being sent to the indicator. The most common type of synchro systems are D.C. selsyn, and magnesyn.", "The meter indication system uses a voltmeter to measure the change in voltage referenced to the voltage applied. For example, the fuel level in some aircraft is monitored by a capacitance bridge circuit. As the fuel increases, voltage develops across the voltmeter."], "jumps": ["P2350", "P2330", "P2360", "P2340"]}, {"id": "P2360", "text": ["This voltage is then measured by a voltmeter which indicates the level of fuel in the fuel tank.  It is important to note that there are many different types of electronic circuits that use a voltmeter   to indicate the condition of the system they are monitoring.", "This voltage is then measured by a voltmeter which indicates the level of fuel in the fuel tank. It is important to note that there are many different types of electronic circuits that use a voltmeter to indicate the condition of the system they are monitoring."], "jumps": ["P2370", "P2350"]}, {"id": "P2370", "text": ["For example, there is the Wheatstone-Bridge meter circuit, which is used to indicate temperature measurements from a heat-sensitive element.  This is a very common circuit used for measuring temperature.", "For example, there is the Wheatstone-Bridge meter circuit, which is used to indicate temperature measurements from a heat-sensitive element. This is a very common circuit used for measuring temperature."], "jumps": ["P2380", "P2350"]}, {"id": "P2380", "text": ["Which of the following is not a type of Synchro indicating system?"], "jumps": ["P2370"]}, {"id": "P2381", "text": [], "jumps": []}, {"id": "P2382", "text": ["You have selected a Synchro-Type Indicator.", "It is important to realize that the scope of this section was to introduce some of the different types of instrument operations.     There are many other methods for instrument control that were not covered, however, their basic principles are the same.", "You have selected a Synchro-Type Indicator.................", "It is important to realize that the scope of this section was to introduce some of the different types of instrument operations. There are many other methods for instrument control that were not covered, however, their basic principles are the same."], "jumps": ["P2910", "P2380"]}, {"id": "P2910", "text": ["This completes the information on PRINCIPLES OF OPERATION.", "1.  An instrument working off the Pitot-Static system is                          determined by pressure readings.  The most common                      instruments that use this system are the Airspeed Indicator,           Altimeter and the Rate of Climb Indicator.", "2.  The picture below illustrates the operation of a gyro.  The                 most  instruments that use this system are the Attitude                     Indicator, Heading Indicator, Turn-and-Bank Indicator and the       Turn Coordinator.", "This completes the information on PRINCIPLES OF OPERATION..", "1. An instrument working off the Pitot-Static system is determined by pressure readings. The most common instruments that use this system are the Airspeed Indicator, Altimeter and the Rate of Climb Indicator.", "2. The picture below illustrates the operation of a gyro. The most instruments that use this system are the Attitude Indicator, Heading Indicator, Turn-and-Bank Indicator and the Turn Coordinator.", "Structure Moves, gyro remains in same positionn"], "jumps": ["P2001", "P2390", "P2930", "P2940", "P2920"]}, {"id": "P2940", "text": ["3.  We discussed two types of electronic indicators, Synchro               indicating and Meter indicating.  The flap position indicator is         Synchro indicating and a fuel quantity indicator is Meter                  indicating.", "3. We discussed two types of electronic indicators, Synchro indicating and Meter indicating. The flap position indicator is Synchro indicating and a fuel quantity indicator is Meter indicating."], "jumps": ["P2999", "P2930"]}, {"id": "P2999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
