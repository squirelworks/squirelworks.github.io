const book = {"title": "93956405", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ...", "Title: STABILIZED PLATFORMSsdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["2. Stabilized Platforms and Accelerometersw Roman Cyr;Times New Roman Greek;Times New Roman Tur;Times New Roman (Hebrew);Times New Roman (Arabic);Times New Stabilized Platforms and Accelerometersccelerometers", "1. Gyroscopesne Title Enter objective 1 line item 2 here. item 2 here.e.e.", "w Define the terms, abbreviations and symbols associated with stabilized platforms and accelerometers. w Describe the principles of operation of a stabilized platform.erms, abbreviations and symbols associated with stabilized platforms and accelerometers. w Describe the principles of operation of a stabilized platform.", "w Define the terms, abbreviations and symbols associated with gyros. w Describe the principles of operation of a gyroscope. w Describe the construction of a gyroscope."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["This lesson will help you understand Stabilized Platforms."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Stabilized platforms contain gyroscopes and accelerometers and are utilized in Ships Inertial Navigation Systems (SINS), aircraft Attitude Heading Reference Systems (AHRS) and Inertial Navigation Systems (INS)..."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["The gyroscope, commonly called a GYRO, has existed since the first electron was sent spinning on its axis. The Earth shows all the characteristics of a gyro, as it spins about its polar axis at over 1000 miles per hour at the Equator....."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Accelerometers provide a means for measuring changes in motion (acceleration/deceleration) for use in navigation and control systems."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["Let's begin the lesson on STABILIZED PLATFORMS............................"], "jumps": ["P430"]}, {"id": "P900", "text": ["2. Stabilized Platforms and Accelerometers"], "jumps": ["P430"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Any rapidly spinning object, a top, wheel, an airplane propeller, or a spinning projectile, is fundamentally a gyroscope. However, a gyroscope is really a mechanical device containing a spinning mass that is universally mounted..."], "jumps": ["P1030", "P1001"]}, {"id": "P1025", "text": ["Universally mounted- Spinning mass mounted so it can assume any position in space."], "jumps": []}, {"id": "P1030", "text": ["As you can see, a heavy wheel (rotor) is mounted so that its spin axis is free to turn in any direction. The wheel spins about axis X; it can turn about axis Y, and it can turn about axis Z."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Gyroscopes have two basic properties: rigidity and precession. Those properties are defined as follows:"], "jumps": ["P1050"]}, {"id": "P1050", "text": ["When any object is spinning rapidly, it tends to keep its axis pointed always in the same direction. A toy top is a good example. As long as the top is spinning fast, it stays balanced on its point..."], "jumps": []}, {"id": "P1060", "text": ["Due to the gyro effect, the spinning top resists the tendency of gravity to change the direction of its axis. Another example is a bicycle that is easier to balance at high speed than when it is barely moving..."], "jumps": []}, {"id": "P1070", "text": ["Note that it is easy to move the bicycle (gyro) as long as you keep the axis pointing in the same direction. The gyro resists only those forces that tend to change the direction of its axis."], "jumps": []}, {"id": "P1080", "text": ["As long as the rotor in the gyroscope top is spinning fast, it will stay balanced. This ability of a gyro to keep its axis fixed in space is called rigidity."], "jumps": ["P"]}, {"id": "P1090", "text": ["If you stop the gyro top and turn its axis horizontal, and then start it spinning again, balancing one end on a pivot, it won't fall. The top's axis will stay horizontal, resisting the tendency of gravity to change its direction..."], "jumps": []}, {"id": "P1100", "text": ["Although the gyro will resist the force that gravity applies to it, the gyro will still respond to that force. The gyro responds by moving its axis at a Right Angle to the Applied Force."], "jumps": []}, {"id": "P1110", "text": ["Gravity is pulling down on the horizontally mounted gyro. If the gyro rotor is turning in the direction shown, the force of gravity will tilt the axis 90", "away from the applied force. This is called Precession."], "jumps": []}, {"id": "P1120", "text": ["A gyro universally mounted is sometimes called a free gyro. Its components are rotor, inner gimbal, outer gimbal, and base or support."], "jumps": []}, {"id": "P1130", "text": ["Gimbals permit the spinning rotor to assume any position and retain that position when the support is tipped or repositioned. The support may be moved in all axes without the rotor position being disturbed..."], "jumps": []}, {"id": "P1140", "text": ["Gravity is a force that acts along parallel lines upon each particle of matter. The point, at which the resultant force is applied to a gyro, is called the Center of Gravity."], "jumps": []}, {"id": "P1150", "text": ["To have a balanced gyro, the center of gravity must be located at the intersection of the three axes (X, Y, and Z) of the gyro."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["Gyro rigidity is the strength with which a gyro resists any external force that would tilt its rotor spin axis. There are three factors that determine gyro rigidity."], "jumps": []}, {"id": "P1170", "text": ["Gyros are enclosed mechanical systems. The energy in the system is equal to the input energy. Thus, the rotor contains angular momentum, which is the energy required to spin the gyro. Angular momentum is a function of rotor weight and rotation..."], "jumps": []}, {"id": "P1180", "text": ["Let's look at the effect of weight distribution in gyro rotors. Take three rotors weighing the same. When the rotors rotate at the same speed, the largest of the three rotors, will have more rigidity than the rotors with less diameter..."], "jumps": []}, {"id": "P1190", "text": ["The smaller diameter rotors can be equally rigid by increasing the RPM or by shifting as much weight as possible to the outer rim. Rigidity is dependent upon both speed and distribution of weight..."], "jumps": []}, {"id": "P1200", "text": ["To provide useful information, the gyro's spin axis must have a starting reference, usually the surface of the earth. Once established, the gyro wheel is comparable to a plane of reference."], "jumps": []}, {"id": "P1210", "text": ["Knowing how a gyro operates, any movement about the \"Y\" and \"Z\" axis will have an effect on the \"X\" axis, developing equivalent output information. Heading, roll, and pitch can all be outputs of a stable element, or gyro..."], "jumps": []}, {"id": "P1220", "text": ["The term _______ means, the axis of rotation of the gyro wheel tends to remain in a fixed direction in space if no forces are applied."], "jumps": ["P1210"]}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1222", "text": ["The center of gravity is the point at which the resultant force is located at the intersection of the three axes of the gyro."], "jumps": []}, {"id": "P1223", "text": ["A Gyro will respond to an applied force by moving its axis at a right angle to the force."], "jumps": []}, {"id": "P1230", "text": ["Analyzing the motion of a gyroscope is accomplished by the following vector quantities: Spin, Torques and Precession."], "jumps": ["P1220"]}, {"id": "P1240", "text": ["A gyro can have different \"degrees of freedom\" depending on the number of gimbals in which it is supported and the way the gimbals are arranged. The term is an indication of the axes about which the rotor is free to precess..."], "jumps": []}, {"id": "P1250", "text": ["A gyro mounted in two gimbals has two degrees of freedom, but still spins about one axis. When using two gimbals, the gyro is universally mounted, free, or a two-degree of freedom gyro."], "jumps": []}, {"id": "P1260", "text": ["In a two-gimbal gyro, the force of gravity does not exert a torque to cause precession and the rotor, inner gimbal, and outer gimbal is balanced about the three axes."], "jumps": []}, {"id": "P1270", "text": ["The gyro wheel is mounted so it is free to have its spin axis pointed in any direction. Here the wheel rotates in a flat loop called the gyro case (inner gimbal). The gimbal ring itself turns on pivots (Y axis) that connect it to the fork (support)..."], "jumps": []}, {"id": "P1280", "text": ["Regardless of how the fork (support) is placed, the spinning gyro wheel is free to lie in any given plane. To show the effect of precession, we can push down on the gimbal ring at point A."], "jumps": []}, {"id": "P1290", "text": ["With the force applied to point A, you might expect the ring to tilt around the Y-Y axis. Instead, the gyro case will tilt about the Z-Z axis. The gyro will always precess at right angles to the direction of the applied force..."], "jumps": []}, {"id": "P1300", "text": ["If we continue to push on point A, the gyro case will keep turning until the spin axis of the gyro wheel is horizontal. At this point the gyro wheel will be spinning in the same direction in which the applied force is pushing..."], "jumps": []}, {"id": "P1310", "text": ["A gyro always precesses in a direction tending to line itself up so that its rotor spins in the same direction that the applied force is trying to turn it."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["In other words, the direction of spin chases the applied force. Precession stops, when the direction of spin and the applied force are in the same direction."], "jumps": []}, {"id": "P1330", "text": ["Let's compare the spin (X) axis in both figures. In view A, the spin axis is vertical. In view B, the spin axis has moved from the vertical to horizontal. $Back: P1320"], "jumps": []}, {"id": "P1340", "text": ["By applying the right amount of force at the right place, we have a method of \"aiming\" the spin axis so that it points to the desired specific fixed direction in space. The property of precession makes the property of rigidity useable..."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["A simple hand rule helps to determine the direction of the Spin Vector. Curve the fingers of your right hand in the direction in which the rotor is turning. Your thumb will point in the direction of the spin vector..."], "jumps": []}, {"id": "P1360", "text": ["There are two groups of \"two degree of freedom\" gyros......", "'''''':MM6*******JJJJ?[JQM[M6**6MQ:.11 !!:+?[FJM"], "jumps": []}, {"id": "P1370", "text": ["The spin axis of the gyro in a gyrocompass operates in a plane parallel to the earth's surface. Once set, it will continue to point north as long as no disturbing force causes it to precess out of the meridian plane..."], "jumps": []}, {"id": "P1380", "text": ["A free gyro maintains its spin axis fixed in space, not fixed to the earth's surface. If you were standing on the equator observing this gyro as the earth rotated, you would see that the gyro maintains its spin axis in the same direction..."], "jumps": []}, {"id": "P1390", "text": ["At point A, the viewer appears to be looking at the bottom of the gyro. Point B, six hours later, the viewer is looking at the side of the gyro. At point C, six more hours later, the viewer is looking at the top of the gyro..."], "jumps": []}, {"id": "P1400", "text": ["If the viewer continued to watch the gyro as the earth completed its revolution, it would have appeared that the gyro made one complete rotation, when in actuality, it remained fixed in space the entire time..."], "jumps": []}, {"id": "P1410", "text": ["The effect of the rotation of the earth on a free gyro is sometimes called Apparent drift, Apparent Precession, or Apparent Rotation."], "jumps": []}, {"id": "P1420", "text": ["A free gyro establishes a stable, unchanging reference in any plane (horizontal, vertical, or any specific position in between). The gyro-erecting system functions to establish the gyro at the desired position and helps keep it there..."], "jumps": []}, {"id": "P1430", "text": ["Gyro erecting systems must provide torques (forces) of sufficient magnitude and direction to precess the gyro so that its spin axis is brought to the desired position after the rotor is spinning at its operating speed..."], "jumps": []}, {"id": "P1440", "text": ["The erecting system must also provide torques to precess the gyro back to the required position at the proper rate and direction to cancel the effects of apparent drift and mechanical drift..."], "jumps": ["P1460", "P1430"]}, {"id": "P1450", "text": ["One of the common erection systems used for vertical gyros uses mercury as the element for sensing gyro position with respect to vertical. Mercury also provides the force to precess the gyro toward vertical when the gyro drifts..."], "jumps": []}, {"id": "P1460", "text": ["The system consists of two tanks of mercury fastened to opposite sides of the gyro case and connected by a small mercury tube. A small air tube is also connected between the tanks to prevent a vacuum from forming..."], "jumps": []}, {"id": "P1470", "text": ["If the spin axis tilts away from the vertical, the mercury will flow from one tank to the other. The added weight in the left tank provides the torque, which causes the gyro to precess 90"], "jumps": []}, {"id": "P1480", "text": ["To overcome this difficulty, the point where the torque is applied must be moved. The torque point is moved by causing the gimbal assembly to slowly and continuously rotate in the proper direction...."], "jumps": []}, {"id": "P1490", "text": ["Rate gyros are used in aircraft instrumentation, inertial navigation, and weapons control equipment to detect and measure angular rates of change. A rate gyro consists of a spinning rotor mounted in a single gimbal..."], "jumps": []}, {"id": "P1500", "text": ["A rate gyro has one degree of freedom and is free to tilt in only one direction. The rotor in a rate gyro is restrained from precessing by usually a spring arrangement."], "jumps": []}, {"id": "P1510", "text": ["The spring limits precession and returns the rotor to neutral position when there is no angular change-taking place. Remember, the amount of precession of a gyro is proportional to the force that causes the precession..."], "jumps": []}, {"id": "P1520", "text": ["If you attempt to change the gyro's plane of rotor spin by rotating the case about the input axis, the gyro will precess. Turning the gyro case has the same effect as applying a torque on the spin axis..."], "jumps": []}, {"id": "P1530", "text": ["The force applied at X, will cause the gyro to precess at right angles to the force, in the direction of rotor spin. Attempting to turn the case will cause the same result and the gyro will precess around the Y-Y axis.s"], "jumps": []}, {"id": "P1540", "text": ["Since the rate of precession is proportional to the applied force, the precession will increase by increasing the speed at which the gyro case is turning. This creates the rate gyro."], "jumps": []}, {"id": "P1550", "text": ["The faster the case turns, the more the gyro will precess. This characteristic of a gyro fulfills the need to sense the rate of motion about its input axis."], "jumps": []}, {"id": "P1560", "text": ["The angular rate has to have some type of restriction and a measurement device. Attaching springs to the cross arm of the output shaft, restrains the free precession and provides an output for measuring the angular rate..."], "jumps": []}, {"id": "P1570", "text": ["As the gyro precesses, it exerts a force against the springs that is proportional to the momentum of the spinning rotor and the applied force."], "jumps": []}, {"id": "P1580", "text": ["Rotating the gyro case at a speed corresponding to a horizontal force of two pounds at point F, will precess the gyro and cause the cross arm to pull upon spring B with a certain amount of force, say 1 pound..."], "jumps": []}, {"id": "P1590", "text": ["As you continue to turn the gyro case at this rate, the precession of the gyro will continually exert a pull on the spring. The gyro will precess until the one pound pull of the cross arm counterbalances the tension on the spring..."], "jumps": ["P1610", "P1580"]}, {"id": "P1600", "text": ["The tension on the spring will remain fixed as long as the gyro case continues to rotate at the same constant speed. Once the case stops moving, the force at F is removed and the gyro stops precessing..."], "jumps": []}, {"id": "P1610", "text": ["Once the gyro stops precessing, the force on the spring is removed and the cross arm and gyro return to the neutral position."], "jumps": []}, {"id": "P1620", "text": ["Rotating the gyro case at twice the rate will apply 4 pounds at point F, and a resulting 2 pound pull by the cross arm on spring A. The gyro will precess twice as far before the tension on the spring equals the pull on the cross arm..."], "jumps": []}, {"id": "P1630", "text": ["Remember, every \"rate\" gyro measures the rate of rotation about its input axis. Gyros and rate gyros used in modern weapon systems and inertial navigation systems are more complex but utilize the same principles of the basic gyro...", "?55555TTTTAAAAABB<<<<8888)))))) 33"], "jumps": []}, {"id": "P1640", "text": ["What direction will a gyro precess in response to an outside applied force?"], "jumps": ["P1630"]}, {"id": "P1641", "text": [], "jumps": []}, {"id": "P1642", "text": ["The gyro will precess perpendicular at right angles to the applied force."], "jumps": []}, {"id": "P1650", "text": ["What are rate gyros primarily used for?...................."], "jumps": ["P1640"]}, {"id": "P1651", "text": [], "jumps": []}, {"id": "P1652", "text": ["Accelerometers measure acceleration........................"], "jumps": []}, {"id": "P1653", "text": ["Bearing to Magnetic North or True North can be determined by a universally mounted gyro."], "jumps": []}, {"id": "P1910", "text": ["You have completed the information on GYROSCOPES.LE........"], "jumps": ["P1001", "P1650"]}, {"id": "P1920", "text": ["1. Any rapidly spinning object, a top, wheel, an airplane propeller, or a spinning projectile, is fundamentally a gyroscope. However, a gyroscope is really a mechanical device containing a spinning mass that is universally mounted."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. Gyroscopes have two basic properties: rigidity and precession. Those properties are defined as follows:"], "jumps": ["P1920"]}, {"id": "P1940", "text": ["3. Gyro rigidity is the strength with which a gyro resists any external force that would tilt its rotor spin axis. There are three factors that determine gyro rigidity......"], "jumps": []}, {"id": "P1950", "text": ["4. A gyro can have different \"degrees of freedom\" depending on the number of gimbals in which it is supported and the way the gimbals are arranged. The term is an indication of the axes about which the rotor is free to precess..."], "jumps": []}, {"id": "P1960", "text": ["5. In a two-gimbal gyro, the force of gravity does not exert a torque to cause precession and the rotor, inner gimbal, and outer gimbal are balanced about the three axes.."], "jumps": []}, {"id": "P1970", "text": ["6. A gyro always precesses in a direction tending to line itself up so that its rotor spins in the same direction that the applied force is trying to turn it."], "jumps": []}, {"id": "P1980", "text": ["7. Gyro erecting systems must provide torques (forces) of sufficient magnitude and direction to precess the gyro so that its spin axis is brought to the desired position after the rotor is spinning at its operating speed..."], "jumps": []}, {"id": "P1990", "text": ["8. Rate gyros are used in aircraft instrumentation, inertial navigation, and weapons control equipment to detect and measure angular rates of change. A rate gyro consists of a spinning rotor mounted in a single gimbal..."], "jumps": ["P1999"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1990"]}, {"id": "P10219", "text": ["What gyro characteristic provides the basis of the operation of a rate gyro?"], "jumps": []}, {"id": "P2020", "text": ["An accelerometer usually provides an indication in the form of a voltage that is proportional to the acceleration to which it is subjected. Accelerometer operation is based on the property of inertia..."], "jumps": ["P2030", "P2001"]}, {"id": "P2025", "text": ["Inertia - Newton's First Law of Motion states that an object at rest tends to stay at rest and an object in motion tends to stay in motion at the same speed and direction unless acted upon by an unbalanced force."], "jumps": []}, {"id": "P2030", "text": ["A simple demonstration of inertia happens every day in and automobile. Acceleration in the forward direction forces you back in the seat while deceleration from stopping throws you forward.."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["When your auto goes into a turn, you tend to move away from the direction of the turn. If we replace a human with a mass suspended in an elastic mounting system, any acceleration will cause a relative movement of the mass to the auto..."], "jumps": []}, {"id": "P2050", "text": ["The amount of displacement is directly proportional to the force causing acceleration. The direction of the mass movement will always be the opposite of the direction of acceleration."], "jumps": []}, {"id": "P2060", "text": ["Newton's Second Law of Motion, which states: \"When a body is acted on by force, its resulting acceleration is directly proportional to the force applied and inversely proportional to the mass of the body\"..."], "jumps": []}, {"id": "P2070", "text": ["When no force is present, the mass will be at rest and when a force causing acceleration is applied, the movement of the mass will lag in proportion to the acceleration force."], "jumps": []}, {"id": "P2080", "text": ["During acceleration the mass (you) lags the movement of the car, which you can feel by the force pressing you back into your seat. The harder the car accelerates the more you are pressed backwards..."], "jumps": []}, {"id": "P2090", "text": ["Once there is no more acceleration, your speed equals the speed of the car and you no longer feel pressed into your seat."], "jumps": []}, {"id": "P2100", "text": ["Accelerometers are principally used in navigation systems. The basic accelerometer consists of a mass that is free to slide along the sensitive axis within the case. Springs limit the movement of the mass..."], "jumps": []}, {"id": "P2110", "text": ["When the case accelerates, the mass, because of inertia, tends to remain stationary. This results in a relative movement of the mass with respect to the case."], "jumps": []}, {"id": "P2120", "text": ["When the stretch of the springs overcomes the inertia of the mass, the springs cause the mass to stop moving, with respect to the case."], "jumps": []}, {"id": "P2130", "text": ["The displacement of the mass, with respect to the case, is directly proportional to the acceleration of the case. When the case stops accelerating, the springs return the mass to its reference position..."], "jumps": []}, {"id": "P2140", "text": ["An oil damping fluid is used to keep the springs from causing the mass to overshoot and oscillate about the reference position."], "jumps": []}, {"id": "P2150", "text": ["When the mass is arranged or positioned vertical, gravity can move or attempt to move it, the accelerometer is sensitive to gravity. During testing, gravity can be used as a reference."], "jumps": []}, {"id": "P2160", "text": ["With the sensing axis vertical, the mass will be displaced by an amount equal to one \"G\", or one unit of gravity. When the axis is turned horizontal to the earth, the springs center the mass, and the output of the unit is zero..."], "jumps": []}, {"id": "P2170", "text": ["The E-transformer accelerometer consists of a mass, suspended from a calibrated leaf spring similar to a pendulum. The mass can pass across three poles of the laminated core."], "jumps": []}, {"id": "P2180", "text": ["As the mass moves and interacts with the three poles, it varies the magnetic field of the poles, producing an electrical output proportional to the amount and direction of movement."], "jumps": []}, {"id": "P2190", "text": ["The name \"E-transformer\" comes from the shape of the core. A case filled with damping liquid encloses the mass of the accelerometer. The damping fluid prevents the pendulum from oscillating..."], "jumps": []}, {"id": "P2200", "text": ["The E-transformer accelerometer can be positioned to detect acceleration in the desired geometric plane. When there is no acceleration, the pendulum remains centered and the output is zero..."], "jumps": []}, {"id": "P2210", "text": ["During acceleration, the mass swings in the opposite direction of that acceleration, causing an output from the E-transformer."], "jumps": []}, {"id": "P2220", "text": ["The amplitude of the swing of the pendulum is proportional to the amount of acceleration. The voltage output will indicate the amount of acceleration and its direction."], "jumps": []}, {"id": "P2230", "text": ["Pulse accelerometers are designed to provide an output signal in digital form, consisting of a series of pulses that indicate specific numbers. The pulse output is supplied directly to digital logic circuits..."], "jumps": []}, {"id": "P2240", "text": ["When velocity remains constant, the brush spring holds the mass at null, and the brush rests on the reset contact of the switch. As acceleration occurs the change in velocity causes the spring to compress..."], "jumps": []}, {"id": "P2250", "text": ["As the spring compresses, it allows the brush to move off the reset contact. If the acceleration is great enough, the brush will pass over the switch contacts for acceleration levels 1, 2, Reset, -1, and -2."], "jumps": []}, {"id": "P2260", "text": ["As the brush passes over each contact an output pulse is coupled to one of four counters. This advances the counter one-half count. The mass tends to assume the new velocity as acceleration decreases."], "jumps": []}, {"id": "P2270", "text": ["The counters will not advance the remaining half count until the brush once again touches the reset contact. This type of pulse output can record each time gravity forces have reached a predetermined level..."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["What physical property is accelerometer operation based upon?"], "jumps": ["P2270"]}, {"id": "P2281", "text": [], "jumps": []}, {"id": "P2282", "text": ["Gravity will effect the calibration of an accelerometer but operation is based upon Newton's Laws of Motion."], "jumps": []}, {"id": "P2283", "text": ["An applied force will effect a gyroscope, however accelerometers are used to sense changes in velocity."], "jumps": []}, {"id": "P2290", "text": ["What types of systems primarily use accelerometers?........"], "jumps": ["P2280"]}, {"id": "P2291", "text": [], "jumps": []}, {"id": "P2292", "text": ["RADAR Altimeters use RF energy to bounce off the earth to indicate aircraft altitude."], "jumps": []}, {"id": "P2293", "text": ["Electronic Countermeasures systems detect and re-transmit RF energy."], "jumps": []}, {"id": "P2300", "text": ["Aircraft and ships are constantly moving. While underway, ships pitch and roll, aircraft climb, dive, roll and yaw. Essential navigation, search RADAR antennas, directors, landing systems and weapons systems must remain stable..."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["The Shipboard Inertial Navigation System (SINS) in ships and the Inertial Navigation System (INS) or Attitude Heading Reference System (AHRS) in aircraft are the stable platforms that send alignment signals to the vital systems..."], "jumps": []}, {"id": "P2320", "text": ["The most common stabilized platforms are either Gimbalized, Strapdown or Ring Laser Gyro (RLG) inertial navigation systems. RLG INS is being retrofitted into all modern ships, commercial and military aircraft..."], "jumps": []}, {"id": "P2330", "text": ["The Gimbalized INS utilizes gyros and accelerometers mounted on a stable element supported by at least two gimbals. Pitch, roll and azimuth information is continuously sent to the RADAR antennas, directors, guns, missile launchers and ships heading indicators..."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["The Gimbalized systems are primarily mechanical systems, which require significant maintenance and damping circuits to overcome inherent drift and errors."], "jumps": []}, {"id": "P2350", "text": ["Many factors contribute to errors in a gimbalized system. Imperfections in gyros, accelerometers and computers and initial leveling misalignments are the most common errors."], "jumps": []}, {"id": "P2360", "text": ["The stable element contains two identical, two-degree-of-freedom gyroscopes mounted one on top of the other in a dumbbell configuration. The gyroscopes spin axes are horizontal and at right angles to each other..."], "jumps": []}, {"id": "P2370", "text": ["The primary data source of the inertial navigation system is the accelerometer. Three accelerometers are mounted on the stable element between the gyros along the X, Y and Z-axes."], "jumps": []}, {"id": "P2380", "text": ["The accelerometers provide output signals proportional to the total accelerations experienced along the X, Y and Z axes of the stable element. The accelerations produce vehicle velocities and changes in position..."], "jumps": ["P"]}, {"id": "P2390", "text": ["Integrators convert the measured acceleration to vehicle position information. By connecting the accelerometer outputs to integrators, the system can determine distance traveled in north-south and east-west directions."], "jumps": []}, {"id": "P2400", "text": ["The stable element leveling sequence begins with gimbal platform caging to allow the gyros to come up to speed. A computer performs a gyro synchronization test and examines the X accelerometer for minimum voltage output to indicate the platform is level and un-cages the gimbals..."], "jumps": []}, {"id": "P2410", "text": ["During Digital Coarse leveling, the angular difference between the stable element's (north-south) axis and true north are set to zero. When the absolute value of the velocity error signal is less than 1/2 ft/sec, fine leveling is started..."], "jumps": []}, {"id": "P2420", "text": ["Fine leveling takes at least 6 minutes, and the absolute values of the integrators and biases must represent a velocity error signal less than 1/4 ft/sec."], "jumps": []}, {"id": "P2430", "text": ["Gyro compassing and Calibration is a four-step, timed procedure to accomplish initial alignment and gimbalized systems can take up to 4 hours to complete. Upon alignment the gyro compass can supply full accuracy outputs.."], "jumps": []}, {"id": "P2440", "text": ["Pitch, roll and azimuth servo motors attached to each axis provide positional information to the ship or aircraft's RADAR antennas, directors, missile launchers, attitude and heading indicators..."], "jumps": []}, {"id": "P2450", "text": ["The Strapdown INS uses modern technologies in micro-machined silicon gyros and accelerometers and rigidly mounts them to the vehicle body. The body's fixed axes are a moving frame of reference as opposed to the gimbal frame of reference..."], "jumps": []}, {"id": "P2460", "text": ["The Strapdown INS systems gyros measure angular rate changes and the accelerometers measure changes in linear rate in terms of the vehicles fixed axes."], "jumps": []}, {"id": "P2470", "text": ["A navigation computer uses the gyro's angular and the accelerometers' linear information to calculate the vehicles three-dimensional motion."], "jumps": []}, {"id": "P2480", "text": ["The Ring Laser Gyro (RLG) INS is a Strapdown system, which has no reliance on a physical mechanism. The RLG is a triangular shaped silicon body with a gas filled cavity."], "jumps": []}, {"id": "P2490", "text": ["RLG INS systems have a cathode and two anodes, which are used to excite the gas and produce two laser beams traveling in opposite directions. Reflectors in each corner, reflect the lasers around the unit's body..."], "jumps": []}, {"id": "P2500", "text": ["While the RLG is at rest with no movement, the two laser beams travel the same distance, there will be no change in their frequency and they cancel each other out."], "jumps": []}, {"id": "P2510", "text": ["However, if the unit is moved (accelerated), one light beam will travel a greater distance to the detector than the other beam. The beam traveling the greater distance will have a lower frequency than the beam traveling the shorter distance..."], "jumps": []}, {"id": "P2520", "text": ["The RLG detector analyzes the frequency changes and sends the information to the computer, which translates the data into movement along its positioned axis."], "jumps": []}, {"id": "P2530", "text": ["By using three ring laser gyros and three accelerometers placed on the X, Y and Z axes, it is possible to interpret all movement of the ship or aircraft in space."], "jumps": []}, {"id": "P2540", "text": ["The Global Positioning System (GPS) is made up of a constellation of satellites that can be used to update the geometric global position of the SINS or RLG INS systems."], "jumps": ["P2560", "P2530"]}, {"id": "P2550", "text": ["The Earth centered X, Y and Z reference coordinates can be continuously downloaded to a receiver platform anywhere on, above or below the earth's surface."], "jumps": []}, {"id": "P2560", "text": ["Four GPS satellites are used to provide the receiver with X, Y and Z position and GPS time."], "jumps": []}, {"id": "P2570", "text": ["GPS navigation coordinates can be used to position the stable platforms of aircraft, ships and submarines. They can also provide navigation and location to automobiles, tanks, trucks and even a hiker in the woods..."], "jumps": []}, {"id": "P2580", "text": ["What stabilized platform is mostly mechanical and is susceptible to errors?"], "jumps": ["P2570"]}, {"id": "P2581", "text": [], "jumps": []}, {"id": "P2582", "text": ["The Ring Laser Gyro has no mechanical mechanism............"], "jumps": []}, {"id": "P2583", "text": ["The Strapdown INS uses micro-silicon gyros and accelerometers and is mounted directly to the vehicle."], "jumps": []}, {"id": "P2590", "text": ["What stabilized platform requires up to 4 hours to align?.."], "jumps": ["P2580"]}, {"id": "P2591", "text": [], "jumps": []}, {"id": "P2592", "text": ["The Laser Gyro INS requires no time for alignment.........."], "jumps": []}, {"id": "P2960", "text": ["5. The most common stabilized platforms are either Gimbalized, Strapdown or Ring Laser Gyro (RLG) inertial navigation systems. RLG INS is being retrofitted into all modern ships, commercial and military aircraft."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on STABILIZED PLATFORMS AND ACCELEROMETERS."], "jumps": ["P2001", "P2590"]}, {"id": "P2920", "text": ["1. An accelerometer usually provides an indication in the form of a voltage that is proportional to the acceleration to which it is subjected. Accelerometer operation is based on the property of inertia."], "jumps": []}, {"id": "P2930", "text": ["2. The basic accelerometer consists of a mass that is free to slide along the sensitive axis within the case. Springs limit the movement of the mass."], "jumps": []}, {"id": "P2940", "text": ["3. The E-transformer accelerometer consists of a mass, suspended from a calibrated leaf spring similar to a pendulum. The mass can pass across three poles of the laminated core...."], "jumps": []}, {"id": "P2950", "text": ["4. Aircraft and ships are constantly moving. While underway, ships pitch and roll, aircraft climb, dive, roll and yaw. Essential navigation, search RADAR antennas, directors, landing systems and weapons systems must remain stable....."], "jumps": []}, {"id": "P2960", "text": ["5. The most common stabilized platforms are either Gimbalized, Strapdown or Ring Laser Gyro (RLG) inertial navigation systems. RLG INS is being retrofitted into all modern ships, commercial and military aircraft."], "jumps": []}, {"id": "P2970", "text": ["6. The stable element contains two identical, two-degree-of- freedom gyroscopes mounted one on top of the other in a dumbbell configuration. The gyroscopes spin axes are horizontal and at right angles to each other."], "jumps": []}, {"id": "P2980", "text": ["7. The stable element leveling sequence begins with gimbal platform caging to allow the gyros to come up to speed. A computer performs a gyro synchronization test and examines the X accelerometer for minimum voltage output to indicate the platform is level and un-cages the gimbals."], "jumps": []}, {"id": "P2990", "text": ["8. RLG INS systems have a cathode and two anodes, which are used to excite the gas and produce two laser beams traveling in opposite directions. Reflectors in each corner, reflect the lasers around the unit's body.."], "jumps": ["P2999", "P2980"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2990"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["What gyro property causes the gyro to remain in a fixed position?"], "jumps": []}, {"id": "P10211", "text": ["What direction will a gyro precess in response to an outside force?"], "jumps": []}, {"id": "P10212", "text": ["How many gimbals are in a universally mounted gyro?"], "jumps": []}, {"id": "P10213", "text": ["What factors determine the rigidity of a gyro?", "Center of gravity, gimbals, and rotor rotation", "Rotor speed, rotor weight, and rotor shape"], "jumps": []}, {"id": "P10214", "text": ["What is the purpose of an erection system used with a gyro?", "To maintain the vertical or horizontal operation position"], "jumps": []}, {"id": "P10215", "text": ["A gyro universally mounted is sometimes called a _______ gyro. Its components are rotor, inner gimbal, outer gimbal, and base or support."], "jumps": []}, {"id": "P10216", "text": ["_______ permit the spinning rotor to assume any position and retain that position when the support is tipped or repositioned."], "jumps": []}, {"id": "P10217", "text": ["Since the rate of precession is proportional to the applied force, the precession will _______ by increasing the speed at which the gyro case is turning."], "jumps": []}, {"id": "P10218", "text": [], "jumps": []}, {"id": "P10210", "text": ["What gyro property causes the gyro to remain in a fixed position?"], "jumps": []}, {"id": "P10220", "text": ["What physical property is accelerometer operation based upon?"], "jumps": []}, {"id": "P10221", "text": ["What types of systems primarily use accelerometers?"], "jumps": []}, {"id": "P10222", "text": ["What type of accelerometer is designed to provide an output signal in digital form?"], "jumps": []}, {"id": "P10223", "text": ["What stabilized platform requires up to 4 hours to align?"], "jumps": []}, {"id": "P10224", "text": ["What stabilized platform is mostly mechanical and is susceptible to errors?"], "jumps": []}, {"id": "P10225", "text": ["What is the primary data source of the inertial navigation system?"], "jumps": []}, {"id": "P10226", "text": ["What component converts the measured acceleration from the accelerometers into velocities that represent vehicle position information?"], "jumps": []}, {"id": "P10227", "text": ["What will be the frequency change between the two beams in a ring laser gyro system with no measurable movement?"], "jumps": []}, {"id": "P10228", "text": ["What inertial navigation system uses modern technologies in micro-machined silicon gyros and accelerometers and rigidly mounts them to the vehicle body."], "jumps": []}, {"id": "P10229", "text": ["How many GPS satellites are used to provide an update to the X, Y and Z coordinates and the GPS time?"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to __________"], "jumps": []}, {"id": "P10410", "text": ["2. Stabilized Platforms And Accelerometers"], "jumps": []}, {"id": "PINFO", "text": ["02-12-04 Converted from sty file - patty 03-17-04 Completed g", "02-12-04 Converted from sty file - patty 03-17-04 Completed graphics. -Sarah 03-19-04 Reviewed lesson. frieda"], "jumps": []}, {"id": "PQINFO", "text": ["Page # Test# Question# HelpPage # 10210 1 110 1040 10211 1 111 1040 10212 1 112 1110 10213 1 113 1150 10214 1 114 1430 10215 1 115 1110 10216 1 116 1120 10217 1 117 1540 10218 1 118 1490 10219 1 119 1550 10220 2 120 2020 10221 2 121 2100 10222 2 122 2230 10223 2 124 2440 10224 2 125 2340 10225 2 126 2380 10226 2 127 2400 10227 2 128 2510 10228 2 129 2560 10229 2 130 2570 00 10231 3 131 30000 10232 3 132 30000 10233 3 133 30000 10234 3 134 30000 10235 3 135 30000 10236 3 136 30000 10237 3 137 30000 10238 3 138 30000 10239 3 139 30000 10240 10241 10242 10243 10244 10245 10246 10247 10248 10249 43 10244 10245 10246 10247 10248 10249", "Page # Test# Question# HelpPage # 10210 1 110 1040 10211 1 111 1040 10212 1 112 1110 10213 1 113 1150 10214 1 114 1430 10215 1 115 1110 10216 1 116 1120 10217 1 117 1540 10218 1 118 1490 10219 1 119 1550 10220 2 120 2020 10221 2 121 2100 10222 2 122 2230 10223 2 124 2440 10224 2 125 2340 10225 2 126 2380 10226 2 127 2400 10227 2 128 2510 10228 2 129 2560 10229 2 130 2570"], "jumps": []}, {"id": "P1230", "text": ["Analyzing the motion of a gyroscope is accomplished by the following vector quantities: Spin, Torques and Precession."], "jumps": ["P1220"]}, {"id": "P2030", "text": ["A simple demonstration of inertia happens every day in and automobile. Acceleration in the forward direction forces you back in the seat while deceleration from stopping throws you forward.."], "jumps": ["P2040", "P2020"]}, {"id": "P2593", "text": ["The Strapdown INS system requires only minutes to align. .."], "jumps": []}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P10226", "text": ["What component converts the measured acceleration from the accelerometers into velocities that represent vehicle position information?"], "jumps": []}, {"id": "P10224", "text": ["What stabilized platform is mostly mechanical and is susceptible to errors?"], "jumps": []}]};
let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
