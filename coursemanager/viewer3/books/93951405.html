const book = {"title": "93951405", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: THEVENIN'S THEOREM asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe the purpose of Thevenin's Theorem. w Describe the 6 step process in solving circuits using Thevenin's Theorem.", "w Thevenize a Series-Parallel Circuit. w Thevenize a Complex Circuit."], "jumps": []}, {"id": "P300", "text": [], "jumps": ["P400"]}, {"id": "P400", "text": ["In this lesson you will learn about Thevenin's Theorem, a method to solve complex circuits. Begin entering the Introduction.", "In this lesson you will learn about Thevenin's Theorem, a method to solve complex circuits."], "jumps": ["P410"]}, {"id": "P410", "text": ["Ohm's Law can be used for solving circuits like this, but if one component changes value, all circuit values must be recalculated. This is an overlay page."], "jumps": ["P420"]}, {"id": "P420", "text": ["This is where Thevenin's Theorem becomes useful. Large circuits are reduced to small Thevenin equivalent circuits. This is an overlay page."], "jumps": ["P400"]}, {"id": "P430", "text": ["Thevenin's Theorem works for many sources and components no matter how they are interconnected. This is an overlay page."], "jumps": []}, {"id": "P440", "text": ["Let's begin the lesson on THEVENIN'S THEOREM. ......................"], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The purpose of Thevenin's theorem is to reduce a complex circuit to a simple circuit when repeated calculations of the load resistor are required. Enter the discussion text here.", "When RL = 50 kW............Vab = ? When RL = 200 kW..........Vab = ? When RL = 500 kW..........Vab = ?"], "jumps": []}, {"id": "P1030", "text": ["For example, in this circuit voltage and current through the load can be calculated using Ohm's law. The process requires many calculations. This is an overlay page.", "Voltage across RL (VrL) = 2.22 V Current through RL (IrL) = 0.22 mA??????????????????????????????????????????????????????????????????"], "jumps": []}, {"id": "P1040", "text": ["When using Ohm's Law, if the value of RL is changed, you will have to recalculate the entire circuit to determine the new voltage and current on the load. This is an overlay page."], "jumps": ["P1050"]}, {"id": "P1050", "text": ["Using Thevenin's Theorem the complex circuit is reduced to a single source and a single resistance. This is an overlay page."], "jumps": ["P1060"]}, {"id": "P1060", "text": ["Then any value of load can be placed across terminals A and B. Circuit values are easily calculated. This is an overlay page.", "When RL = 50 kW.....Vab = 4.0 V When RL = 200 kW...Vab = 4.7 V When RL = 500 kW...Vab = 4.8 V ?????????"], "jumps": ["P1070"]}, {"id": "P1070", "text": ["Thevenin's Theorem states that the entire network connected to A and B can be replaced by a single voltage source (Vth) and a single series resistance (Rth). This is an overlay page."], "jumps": []}, {"id": "P1072", "text": ["Thevenin's Theorem states that the entire network connected to A and B can be replaced by a single voltage source (Vth) and a single series resistance (Rth). Enter the discussion text here."], "jumps": []}, {"id": "P1075", "text": ["NETWORK - A network is a combination of components, such as resistors, interconnected in any way. DEFINITION - The definition text starts here."], "jumps": []}, {"id": "P1080", "text": ["Vth is the open - circuit voltage across terminals A and B. In this example, Vth is measured across R2. With terminals A and B open there is no current flow through R3. This is an overlay page.7"], "jumps": ["P1072"]}, {"id": "P1090", "text": ["Rth is the open-circuit resistance across terminals A and B, but with all voltage sources bypassed. This is an overlay page."], "jumps": ["P1072"]}, {"id": "P1100", "text": ["There are 6 steps to Thevenizing and solving a circuit completely. This is an overlay page."], "jumps": ["P1110", "P1072"]}, {"id": "P1110", "text": ["Here is an example of a simple series-parallel circuit. Enter the discussion text here."], "jumps": ["P1072"]}, {"id": "P1120", "text": ["The first step in Thevenizing a circuit is to mentally disconnect the load resistor. This is an overlay page."], "jumps": ["P1110"]}, {"id": "P1130", "text": ["The second step is to find Vth across terminals A and B. This is an overlay page."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["The voltage across terminals A and B is the voltage drop across R2.This is an overlay page."], "jumps": ["P1150", "P1110"]}, {"id": "P1150", "text": ["Determine the voltage dropped across R2. Use the voltage divider formula. This is an overlay page.", "R2 12 W Vr2 = x V = x 72 V = 48 V R1 + R2 18 WWWWWWWWWWWWWWWWWWWWW"], "jumps": ["P1110"]}, {"id": "P1152", "text": ["Determine the voltage dropped across R2. Use the voltage divider formula. Enter the discussion text here.", "R2 12 W Vr2 = x V = x 72 V = 48 V R1 + R2 18 WWWWWWWWWWWWWWWWWWWWW"], "jumps": ["P1110"]}, {"id": "P1155", "text": ["VOLTAGE DIVIDER FORMULA - To find the voltage dropped across R2 use the following formula. formula.", "R2 Vr2 = x V R1 + R2 12 W = x 72 V 6 W + 12 W 12 W = x 72 V 18 W = 48 V"], "jumps": []}, {"id": "P1160", "text": ["The third step is to determine Rth. To do this you must mentally short the voltage supply. This is an overlay page."], "jumps": ["P1170", "P1152"]}, {"id": "P1170", "text": ["R1 and R2 are now in parallel and may be solved for by using the parallel resistance formula (product over the sum). This is an overlay page.", "R1 x R2 6 x 12 72 Rth = = = = 4 W R1 + R2 6 + 12 1888888888888888888888888888888888 181888"], "jumps": ["P1180", "P1152"]}, {"id": "P1180", "text": ["This is the Thevenized circuit. is is an overlay page."], "jumps": ["P1152"]}, {"id": "P1190", "text": ["It consists of the equivalent voltage (Vth), in series with the equivalent series resistance (Rth). This is an overlay page."], "jumps": ["P1152"]}, {"id": "P1200", "text": ["These Thevenin equivalents apply for any value of RL because RL was disconnected at the time of the calculations. This is an overlay page."], "jumps": ["P1210", "P1152"]}, {"id": "P1210", "text": ["The fourth step is to reconnect RL to terminals A and B. his is an overlay page."], "jumps": ["P1152"]}, {"id": "P1220", "text": ["The fifth step is to determine the voltage across the load, VrL. his is an overlay page."], "jumps": ["P1230", "P1152"]}, {"id": "P1230", "text": ["This is done by using the same voltage divider formula as before.is is an overlay page.", "RL 4 4 VrL = x Vth = = x 48 = 24 V Rth + RL 4 + 4 88 1818885"], "jumps": ["P1152"]}, {"id": "P1240", "text": ["The sixth and final step is to find the load current. This is done by taking the load voltage over the load resistance.", "VrL 24 IrL = = = 6 A RL 4 888888888888888888888888888888888 888888 8888888888888 181888"], "jumps": ["P1152"]}, {"id": "P1250", "text": ["The circuit has been completely solved using Thevenin's Theorem. This is an overlay page."], "jumps": ["P1152"]}, {"id": "P1260", "text": ["All of these answers could have been obtained by using Ohm's law. However it would mean doing many calculations. This is an overlay page."], "jumps": ["P1152"]}, {"id": "P1270", "text": ["By using Thevenin's Theorem the load resistor may be replaced with any value desired and the values for RL may be calculated easily. This is an overlay page."], "jumps": ["P1152"]}, {"id": "P1280", "text": ["Suppose the value of RL was changed to 8 ohms. The new values for IrL and VrL would be quickly obtained. This is an overlay page.", "8 W VrL = x 48 V = 32 V 12 W 4 4 12 S 4 888888888888888888888888888888888 888888 8888888888888 181888", "32 V IrL = = 4 A 8 W S 4 4 12 S 4 888888888888888888888888888888888 888888 8888888888888 181888"], "jumps": ["P1152"]}, {"id": "P1290", "text": ["A complete new solution would have to be obtained each time a new value was inserted for RL, in the original circuit. This is an overlay page."], "jumps": ["P1300", "P1152"]}, {"id": "P1300", "text": ["What is the first step in Thevenizing a circuit? This is where the question is typed."], "jumps": ["P1152"]}, {"id": "P1302", "text": [], "jumps": []}, {"id": "P1303", "text": ["Calculating Vth is the second step in Thevenizing a circuit and could not be calculated yet because RL is still in place. Enter the discussion text here."], "jumps": []}, {"id": "P1304", "text": ["Calculating Rth is the third step in Thevenizing a circuit and could not be calculated yet because RL is still in place. Enter the discussion text here."], "jumps": []}, {"id": "P1310", "text": ["Thevenin's theorem converts a network into a single source and a _________", "single resistance in parallel. and a single resistance in parallel.", "single resistance in series.ce and a single resistance in series.", "dual resistance in parallel. nd a dual resistance in parallel."], "jumps": []}, {"id": "P1312", "text": ["Thevenin's theorem does not convert a network into a single source and a single resistance in parallel."], "jumps": []}, {"id": "P1313", "text": [], "jumps": []}, {"id": "P1314", "text": ["Thevenin's theorem does not convert a network into a dual source and a dual resistance in parallel. Enter the discussion text here."], "jumps": []}, {"id": "P1320", "text": ["The Thevenin resistance is the _______ is where the question is typed.", "open circuit resistance across terminals A and B..", "closed circuit resistance across terminals A and B..."], "jumps": []}, {"id": "P1322", "text": [], "jumps": []}, {"id": "P1323", "text": ["The closed circuit resistance is the same as total circuit resistance and would include the load resistor. Enter the discussion text here."], "jumps": []}, {"id": "P1324", "text": ["The total circuit resistance does not exclude the load resistor. The load resistor is removed when calculating Thevenin's resistance. Enter the discussion text here."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on THEVENIN'S THEOREM. OBJECTIVE 1 TITLE."], "jumps": []}, {"id": "P1920", "text": ["1. Thevenin's Theorem reduces any network to a single voltage source in series with a single resistance. rst Objective summary."], "jumps": ["P1930"]}, {"id": "P1930", "text": ["2. Step 1 in Thevenizing a circuit is to mentally disconnect the load resistor. This is an overlay page."], "jumps": ["P1920"]}, {"id": "P1940", "text": ["3. Step 2, find the Thevenin voltage across terminals A and B. This is an overlay page.", "50 W Vth = x 75 V = 37.5 100 W 4 12 S 4 888888888888888888888888888888888 888888 8888888888888 181888"], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["4. Step 3, find the Thevenin resistance. s is an overlay page.", "50 W x 50 W 2500 W Rth = = = 25 W 50 W + 50 W 100 W88888888888888888888888 888888 8888888888888 181888"], "jumps": ["P1960", "P1920"]}, {"id": "P19 have used the voltage divider formula to solve for R2. Enter the discussion text here.", "R2 Vr2 = x V1 R1 + R2 18 S 18 S 18 SS"], "jumps": []}, {"id": "P2195", "text": ["CALCULATING Vr2 When solving for Vr2, use the following formula: g for Vr2, use the following formula: ?", "R2 Vr2 = x V1 R1 + R2 18 S 18 S 18 SS", "3 = x 84 12 + 3 18 S 18 S 18 SS", "3 = x 84 15 18 S 18 S 18 SS"], "jumps": []}, {"id": "P2200", "text": ["Now short out V1 and calculate the voltage dropped across the A and B terminals. Enter the discussion text here."], "jumps": ["P2210"]}, {"id": "P2210", "text": ["R1 is now across terminals A and B, calculate the voltage drop for R1. What is the voltage drop across R1? This is where the question is typed."], "jumps": []}, {"id": "P2211", "text": [], "jumps": []}, {"id": "P2212", "text": ["Your answer is incorrect, you should have used the voltage divider formula to solve for R1. Enter the discussion text here.", "R1 Vr1 = x V2 R1 + R2 18 S 18 S 18 SS"], "jumps": []}, {"id": "P2220", "text": ["Both V1 and V2 have -16.8 V dropped across the A and B terminals. Enter the discussion text here."], "jumps": ["P2230"]}, {"id": "P2270", "text": ["The next thing is to calculate the load voltage. This is an overlay page.", "Vth = - 33.6 V Rth = 2.4 k VL = IL =", "Since they both have the same potential, they are added. Therefore the Vth is - 33.6 V. This is an overlay page.", "Vth = - 33.6 V Rth = VL = IL ===="], "jumps": ["P2280"]}, {"id": "P2240", "text": ["The third step is to find Rth. Since there are two voltage sources both get shorted.", "Vth = - 33.6 V Rth = VL = IL ===="], "jumps": ["P2250"]}, {"id": "P2250", "text": ["R1 and R2 are now in parallel across terminals A and B. What is their combined resistance? This is where the question is typed."], "jumps": []}, {"id": "P2251", "text": [], "jumps": []}, {"id": "P2252", "text": ["Your answer is incorrect, you should have used the product over sum parallel resistance formula. Enter the discussion text h let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
