const book = {"title": "93953705", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I . ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ..", "Title: SCR CIRCUIT TROUBLESHOOTING EXPERIMENT asdf sadf"], "jumps": []}, {"id": "P10", "text": ["Hello, this lesson is about:s about: about:"], "jumps": []}, {"id": "P100", "text": ["w Describe typical faults in SCR trigger and power control circuits. w Describe SCR trigger and power control circuit troubleshooting procedures.", "1. SCR Trigger and Power Control Circuit Faults", "w Recognize that a SCR trigger circuit is faulted. w Identify the faulted component in an SCR trigger circuit.", "w Recognize that a SCR power control circuit is faulted. w Identify the faulted component in an SCR power control circuit.........."], "jumps": []}, {"id": "P1920", "text": ["1.  The most common fault in SCR circuits is a short or open               SCR.", "1. The most common fault in SCR circuits is a short or open SCR."], "jumps": ["P1930", "P1001"]}, {"id": "P1999", "text": ["You have completed the Summary.  You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1940"]}, {"id": "P301", "text": [], "jumps": ["P300"]}, {"id": "P330", "text": [], "jumps": []}, {"id": "P335", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson you will learn about troubleshooting SCR trigger and  power control circuits and you will troubleshoot faulted SCR trigger and power control circuits.", "In this lesson you will learn about troubleshooting SCR trigger and power control circuits and you will troubleshoot faulted SCR trigger and power control circuits."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Both circuits operate very similar, one uses DC voltage and the other uses AC voltage."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["The SCR's operate the same in both circuits. To produce current flow, the SCR must be forward biased and must have a gate current."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Voltage measurements quickly determine if the circuit is operating normally."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["An incorrect voltage measurement indicates that the circuit is faulted."], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["Let's begin the lesson on SCR CIRCUIT TROUBLESHOOTING EXPERIMENT............"], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P10214", "text": ["What resistance range is used when checking an SCR?a SCR?ased him over the fence? X XXXX", "X100ce A choice is d, and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "the highestthoice is d, and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "the midrangeeoice is d, and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor."], "jumps": []}, {"id": "P1020", "text": ["The most common fault in an SCR circuit is a failed semiconductor component, the SCR."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["The SCR may short or open, however the effect is the same - the voltage across the load will not be correct."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["A shorted SCR is ON all the time. In the DC circuit, you will not be able to turn power OFF to the load."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["In the AC circuit, there would not be any rectifying action or power control to the load."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["An open SCR stops current flow. No voltage is developed across the load in either circuit."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["However, be aware that any other component failures will cause the SCR to operate incorrectly."], "jumps": ["P1080", "P1020"]}, {"id": "P1100", "text": ["The test requires first checking the resistance of the SCR when forward and reverse biased without a gate signal.  High resi", "The test requires first checking the resistance of the SCR when forward and reverse biased without a gate signal. High resi", "The test requires first checking the resistance of the SCR when forward and reverse biased without a gate signal. High resistance should be measured in both directions."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["And checking the resistance when forward biased with a gate signal.  Current should flow fro", "And checking the resistance when forward biased with a gate signal. Current should flow fro", "And checking the resistance when forward biased with a gate signal. Current should flow from the cathode to the anode when forward biased by current applied to the gate."], "jumps": ["P1120", "P1100"]}, {"id": "P1150", "text": ["Now, place a jumper from the anode to the gate. A positive voltage applied to the anode will also be applied to the gate, f.", "Now, place a jumper from the anode to the gate. A positive voltage applied to the anode will also be applied to the gate, f.-", "Now, place a jumper from the anode to the gate. A positive voltage applied to the anode will also be applied to the gate, forward biasing the SCR."], "jumps": ["P1160", "P1120"]}, {"id": "P1110", "text": ["And checking the resistance when forward biased with a gate signal."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["First, check the resistance when the SCR is reverse biased. Remember, on some multimeters, the black lead is connected to the positive voltage source of the meter (Nida Model 480)."], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["Resistance should be very high when the SCR is reverse biased. A low resistance reading indicates a shorted SCR."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["Second, check the resistance when the SCR is forward biased, Again the reading should be high, the SCR is OFF.A low reading indicates a shorted condition."], "jumps": ["P1150", "P1120"]}, {"id": "P1160", "text": ["Connect the multimeter to forward bias the SCR. The reading should be low, the SCR turned ON. A high reading indicates an open SCR or reversed multimeter l.", "Connect the multimeter to forward bias the SCR. The reading should be low, the SCR turned ON. A high reading indicates an open SCR.", "Connect the multimeter to forward bias the SCR. The reading should be low, the SCR turned ON. A high reading indicates an open SCR or reversed multimeter l.S", "Connect the multimeter to forward bias the SCR. The reading should be low, the SCR turned ON. A high reading indicates an open SCR, reversed multimeter leads, or too high a range setting on the ohmmeter function or range switch."], "jumps": ["P1170", "P1120"]}, {"id": "P1170", "text": ["Last, with the multimeter's leads still connected, remove the jumper (removing the gate signal). The reading should remain low, the SCR remains ON."], "jumps": ["P1180", "P1120"]}, {"id": "P1180", "text": ["To check that the SCR turns OFF, remove one of the multimeter's test leads, then reconnect it. The resistance reading should be high."], "jumps": ["P1185", "P1120"]}, {"id": "P1185", "text": ["Removing the test lead interrupted anode current, the SCR turns OFF."], "jumps": ["P1190", "P1120"]}, {"id": "P1190", "text": ["What is the purpose of placing a jumper between the anode and gate when checking out an SCR?"], "jumps": ["P1120"]}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1192", "text": ["The SCR is forward biased by placing the positive voltage test lead on the anode and the negative voltage test lead on the cathode."], "jumps": []}, {"id": "P1193", "text": ["The SCR is reverse biased by placing the negative voltage test lead on the anode and the positive voltage test lead on the cathode."], "jumps": []}, {"id": "P1200", "text": ["What type of resistance reading would you expect when the SCR is forward biased with no gate signal applied?"], "jumps": ["P1190"]}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P14120", "text": ["The experiment card is now setup. Let's verify normal                      operation before inserting a fault. \n5.  Press Enter to set: PC1 AC Power Switch - ON", "The experiment card is now setup. Let's verify normal operation before inserting a fault. 5. Press Enter to set: PC1 AC Power Switch - ON"], "jumps": ["P14100"]}, {"id": "P1210", "text": ["What type of resistance reading would you expect when the SCR is forward biased with a gate signal applied?"], "jumps": ["P1200"]}, {"id": "P1211", "text": [], "jumps": []}, {"id": "P1212", "text": ["With a gate signal applied, the SCR is ON, acting like a short circuit. A low resistance reading is obtained."], "jumps": []}, {"id": "P1220", "text": ["The procedures to check an SCR CIRCUIT are simple.", "The procedures to check an SCR CIRCUIT are simple.........."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["1.  Determine the type of SCR circuit, trigger or power control.", "1. Determine the type of SCR circuit, trigger or power control."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["2.  Determine if the circuit has the correct applied voltage and             gate input signals. Use a multimeter or oscilloscope.", "2. Determine if the circuit has the correct applied voltage and gate input signals. Use a multimeter or oscilloscope."], "jumps": ["P1250", "P1220"]}, {"id": "P1250", "text": ["If the applied voltage and gate input signals are incorrect, troubleshoot the external signal path.", "If the applied voltage and gate input signals are incorrect, troubleshoot the external signal path....................................................."], "jumps": ["P1260", "P1220"]}, {"id": "P1260", "text": ["3.  If the applied voltage and gate input signals are correct, use           an analog multimeter to determine if the SCR is operating                correctly.", "3. If the applied voltage and gate input signals are correct, use an analog multimeter to determine if the SCR is operating correctly."], "jumps": ["P1270", "P1220"]}, {"id": "P1270", "text": ["4.  If  the SCR is bad, replace the SCR and retest the circuit. \n5.  If  the SCR is good, isolate the fault to one of the circuit                    components.", "4. If the SCR is bad, replace the SCR and retest the circuit. 5. If the SCR is good, isolate the fault to one of the circuit components......"], "jumps": ["P1280", "P1220"]}, {"id": "P1280", "text": ["Remember, SCR's are a lot like diodes. The only difference is that SCR's are gated ON."], "jumps": ["P1910", "P1220"]}, {"id": "P1910", "text": ["This completes the information on SCR CIRCUIT FAULTS.", "This completes the information on SCR CIRCUIT FAULTS......."], "jumps": ["P1001", "P1220"]}, {"id": "P1930", "text": ["2.  SCR's can be checked using an analog ohmmeter. The                   resistance is low only when forward biased and after a gate           signal has been applied.", "2. SCR's can be checked using an analog ohmmeter. The resistance is low only when forward biased and after a gate signal has been applied."], "jumps": ["P1940", "P1920"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1080", "text": ["To verify if an SCR is good or bad, an analog ohmmeter is required to completely test the d.", "You have completed the Summary.  You are about to return to the Objective Menu.", "To verify if an SCR is good or bad, an analog ohmmeter is required to completely test the device. The lowest range, RX1 if avaialable, should be used. A digital meter lacks sufficient power to forward bias the SCR for proper testing. Digital meters can only confirm shorted conditions.", "You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1090", "P1020"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["The purpose of this experiment is to use an ohmmeter to check out a SCR and then troubleshoot a faulted SCR trigger circuit.", "The purpose of this experiment is to use an ohmmeter to check out an SCR and then troubleshoot a faulted SCR trigger circuit."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "5. Nida Model 480 analog meter or Equivalent"], "jumps": []}, {"id": "P2040", "text": ["Pick up the PC130-52A card. The purpose of this card is to demonstrate troubleshooting SCR trigger circuits."], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["Compare the components on PC130-52A to the schematic shown."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["I1 is an incandescence lamp used as the load. Voltage measurements across the load do not have to be made, observe if the lamp is ON or OFF."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["R1 and R2 form the input circuit. R3, C1 and S2 form the reset circuit."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["S1 selects between a pulse trigger signal or a DC trigger signal. The DC signal is used in this experiment. Let's start the experiment."], "jumps": ["P2085", "P2040"]}, {"id": "P2085", "text": ["NOTE  \nOn some cards, resistor R4 is not present. Circuit operation is not affected, R4 is not in the circuit for this experiment.", "NOTE On some cards, resistor R4 is not present. Circuit operation is not affected, R4 is not in the circuit for this experiment."], "jumps": ["P2090", "P2040"]}, {"id": "P2090", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P2085"]}, {"id": "P2100", "text": ["2.  Carefully plug PC130-52A into the Test Console PC2 position.  3.  Set S1 on PC130-52A to the DC position and set S2 to                      OPERATE. \n4.  Adjust R2 on PC130-52A fully CCW.", "2. Carefully plug PC130-52A into the Test Console PC2 position. 3. Set S1 on PC130-52A to the DC position and set S2 to OPERATE. 4. Adjust R2 on PC130-52A fully CCW..."], "jumps": ["P2090", "P2105"]}, {"id": "P2105", "text": ["MEASUREMENT SETUP - Set S1 to the DC position and carefully rotate R2 fully CCW."], "jumps": []}, {"id": "P2110", "text": ["5.  Set the Positive Supply Voltage to 12.", "5. Set the Positive Supply Voltage to 12.................................."], "jumps": ["P2100"]}, {"id": "P2130", "text": ["6.  Turn PC2 DC Power switch ON. \n     The experiment card is now setup. Let's verify normal                      operation before inserting a fault.", "6. Turn PC2 DC Power switch ON. The experiment card is now setup. Let's verify normal operation before inserting a fault.."], "jumps": ["P2110"]}, {"id": "P2140", "text": ["1.  Rotate R2 fully CW. \n     Did the lamp illuminate?", "1. Rotate R2 fully CW. Did the lamp illuminate???...."], "jumps": ["P2130"]}, {"id": "P2141", "text": [], "jumps": []}, {"id": "P2142", "text": ["The lamp should have illuminated. R2 supplies current to the gate of the SCR. Check your card setup and if the lamp still does not illuminate, check with your instructor."], "jumps": []}, {"id": "P2150", "text": ["2.  Rotate R2 fully CCW. \n     Did the lamp extinguish?", "2. Rotate R2 fully CCW. Did the lamp extinguish?....."], "jumps": ["P2140"]}, {"id": "P2151", "text": [], "jumps": []}, {"id": "P2152", "text": ["The lamp should have stayed illuminated. Remember, once the SCR turns ON, the gate current is not needed to retain the SCR ON. Check with your instructor, you may have a faulted card."], "jumps": []}, {"id": "P2160", "text": ["3.  Place the Reset/Operate switch on PC130-52A to RESET and         back to OPERATE. \n     Did the lamp extinguish?", "3. Place the Reset/Operate switch on PC130-52A to RESET and back to OPERATE. Did the lamp extinguish?"], "jumps": ["P2150"]}, {"id": "P2161", "text": [], "jumps": []}, {"id": "P2162", "text": ["The lamp should have extinguished. Ensure that R2 is fully CCW and that you place S2 to reset. If the lamp still does not extinguish, check with your instructor."], "jumps": []}, {"id": "P2170", "text": ["The SCR trigger circuit is operating correctly. Now, let's use the ohmmeter test to verify that the SCR is good. The computer will isolate the SCR for you."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["1.  Turn the PC2 DC Power switch OFF. Remember, power must        be OFF to the circuit when making resistance measurements.", "1. Turn the PC2 DC Power switch OFF. Remember, power must be OFF to the circuit when making resistance measurements. External program = SCAN FTR 0 F2 100"], "jumps": ["P2170"]}, {"id": "P2190", "text": ["2.  Place the positive test lead (black lead on the Nida 480) to TP1      on PC130-52A, cathode of SCR1. \n3.  Place the negative test lead (red lead on the Nida 480) to TP4         on PC130-52A, anode of SCR1.", "2. Place the positive test lead (black lead on the Nida 480) to TP1 on PC130-52A, cathode of SCR1. 3. Place the negative test lead (red lead on the Nida 480) to TP4 on PC130-52A, anode of SCR1.", "You need to pay close attention to your meter lead potential when measuring SCR resistance. All meters do NOT have the same lead potential. For example, the black lead of some multimeters is connected to the positive voltage source of the meter giving this lead the positive potential. Some meters have a polarity switch that can be used to changed the lead potential. your meter and know the lead potential."], "jumps": ["P2200", "P2180", "P2195"]}, {"id": "P2195", "text": ["MULTIMETER LEAD PLACEMENT - Carefully connect the positive potential test lead to TP1, and the negative potential test lead to TP4. Multimeter set to RX1."], "jumps": []}, {"id": "P2200", "text": ["The SCR is reverse biased with no gate signal applied. Is the multimeter reading high or low ohms?"], "jumps": ["P2190"]}, {"id": "P2201", "text": [], "jumps": []}, {"id": "P2202", "text": ["You should not have measured low ohms when the SCR is reverse biased. Check your lead placement on the SCR and check on your meter which lead has the positive potential. The positive potential lead should be connected to TP1, cathode of the SCR.", "You should not have measured low ohms when the SCR is reverse biased. Check your lead placement on the SCR and check on your meter which lead has the positive potential. The positive potential lead should be connected to TP1, cathode of the SCR..."], "jumps": []}, {"id": "P2210", "text": ["4.  Reverse the test leads that are on TP4 and TP1. This will                 forward bias the SCR. \n     Do you measure high or low ohms?", "4. Reverse the test leads that are on TP4 and TP1. This will forward bias the SCR. Do you measure high or low ohms?"], "jumps": ["P2200"]}, {"id": "P2211", "text": [], "jumps": []}, {"id": "P2212", "text": ["You still should have measured high ohms. Even though the SCR is forward biased, there has been no current applied to the gate to turn the SCR ON."], "jumps": []}, {"id": "P2220", "text": ["5.  Place a jumper between TP4 and TP2 on the PC130-52A card.       This applies gate current to the SCR. Ensure the meter is still         connected.\n     Is the resistance reading high or low?", "5. Place a jumper between TP4 and TP2 on the PC130-52A card. This applies gate current to the SCR. Ensure the meter is still connected. Is the resistance reading high or low????"], "jumps": ["P2210", "P2225"]}, {"id": "P2221", "text": [], "jumps": []}, {"id": "P2222", "text": ["You should have measured a low resistance. The SCR is forward biased and the gate receives current flow from the jumper."], "jumps": []}, {"id": "P2225", "text": ["MULTIMETER LEAD PLACEMENT - Carefully connect the jumper to TP2 and TP4."], "jumps": []}, {"id": "P2230", "text": ["6.  Without removing the meter's test leads, remove the jumper            from TP4 to TP2. The meter should still measure low ohms.           Once the SCR is ON it stays ON until the anode current is                interrupted.", "6. Without removing the meter's test leads, remove the jumper from TP4 to TP2. The meter should still measure low ohms. Once the SCR is ON it stays ON until the anode current is interrupted..."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["7.  Disconnect the test lead from TP4. \n8.  Reconnect the test lead to TP4. The meter should now                     measure high ohms. Removing the test lead broke the current       path through the SCR and the SCR turns OFF. Measuring the        resistance of an SCR when OFF measures high ohms.", "7. Disconnect the test lead from TP4. 8. Reconnect the test lead to TP4. The meter should now measure high ohms. Removing the test lead broke the current path through the SCR and the SCR turns OFF. Measuring the resistance of an SCR when OFF measures high ohms."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["Now, the computer will insert a fault into the SCR trigger circuit.", "Now, the computer will insert a fault into the SCR trigger circuit. ternal program = SCAN FTR 0 C1 00 External program = SCAN FTR 0 F2 07to ON........................................."], "jumps": ["P2240"]}, {"id": "P2260", "text": ["1.  Remove the multimeter from the card.\n2.  Rotate R2 on PC130-52A fully CCW.  \n3.  Ensure that S2 on PC130-52A is set to operate. \n4.  Turn the PC2 DC power switch to ON.", "1. Remove the multimeter from the card. 2. Rotate R2 on PC130-52A fully CCW. 3. Ensure that S2 on PC130-52A is set to operate. 4. Turn the PC2 DC power switch to ON..."], "jumps": ["P2250"]}, {"id": "P2270", "text": ["5.  Check for normal operation of the SCR circuit.", "5. Check for normal operation of the SCR circuit..........", "Normal Operation of I1 Rotate R2 CW to illuminate I1 Rotate R2 fully CCW, I1 stays ON Place S2 to RESET, I1 goes out"], "jumps": ["P2280", "P2260", "P2275"]}, {"id": "P2275", "text": ["NORMAL OPERATION OF I1  \n                                  Rotate R2 CW to illuminate I1  \n                                  Rotate R2 fully CCW, I1 stays ON   \n                                  Place S2 to RESET, I1 goes out", "Rotate R2 CW to illuminate I1 Rotate R2 fully CCW, I1 stays ON", "NORMAL OPERATION OF I1 Rotate R2 CW to illuminate I1 Rotate R2 fully CCW, I1 stays ON Place S2 to RESET, I1 goes out"], "jumps": []}, {"id": "P2280", "text": ["Is the SCR trigger circuit operating correctly?", "Is the SCR trigger circuit operating correctly?............"], "jumps": ["P2270"]}, {"id": "P2281", "text": [], "jumps": []}, {"id": "P2282", "text": ["The lamp did not illuminate, something is wrong in the circuit."], "jumps": []}, {"id": "P2290", "text": ["6.  Check that there is voltage applied to the load and to the gate        of SCR.", "6. Check that there is voltage applied to the load and to the gate of SCR.", "Normal Applied Voltages TP5, +12 VDC (voltage to load) TP2, - .7 to +.6 VDC (voltage to the gate, amount depends on R2 setting.)))))))))"], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["Are the input voltages correct?", "Are the input voltages correct?ed.........................."], "jumps": ["P2290"]}, {"id": "P2301", "text": [], "jumps": []}, {"id": "P2302", "text": ["The voltage on I1 is 12 VDC and voltage applied to the gate of the SCR is between -.7 and +.6 VDC. These are correct voltage levels."], "jumps": []}, {"id": "P2310", "text": ["7.  Turn the PC2 DC Power switch OFF.", "7. Turn the PC2 DC Power switch OFF. N FTR 0 F2 10 - Set the PC1 DC Switch to ON....", "The computer will again isolate the SCR.... agai isolate the SCR. - .7 to +.6 VDC(voltage to the gate, amout depeds on R2 setting.))"], "jumps": ["P2300"]}, {"id": "P2320", "text": ["8.  Check the SCR with a ohmmeter.\n     Is the SCR operating correctly?", "8. Check the SCR with a ohmmeter. Is the SCR operating correctly?"], "jumps": ["P2310", "P2325"]}, {"id": "P2321", "text": [], "jumps": []}, {"id": "P2322", "text": ["Notice that after the jumper is removed, the SCR turns OFF, high ohms. The SCR should have remained ON."], "jumps": []}, {"id": "P2323", "text": ["FORWARD BIAS, NO GATE APPLIED - Place the positive lead on the anode and the negative lead on the cathode."], "jumps": []}, {"id": "P2324", "text": ["FORWARD BIASED WITH GATE APPLIED Connect a jumper from the anode to the cathode. Place the positive lead on the anode and the negative lead on cathode."], "jumps": []}, {"id": "P2325", "text": ["1. Reverse biased, no gate current. 2. Forward biased, no gate current. 3. Forward biased, with gate current. 4. Forward biased after removing the jumper. 5. Forward biased after removing and reconnecting the positive meter lead.positive meter lead.meter lead."], "jumps": []}, {"id": "P2327", "text": ["FORWARD BIASED, REMOVED JUMPER - Remove the anode to cathode jumper, keeping the test leads in place."], "jumps": []}, {"id": "P2328", "text": ["FORWARD BIAS, DISCONNECTED AND RECONNECTED POSITIVE LEAD Disconnect and reconnect the positive test lead to the anode."], "jumps": []}, {"id": "P2329", "text": ["REVERSE BIASED NO GATE - Place the negative lead on the anode and the positive lead on the cathode."], "jumps": []}, {"id": "P2330", "text": ["In this case the anode of SCR1 is open. However, you did measure low ohms when the jumper was in place which indicates that the SCR's cathode is not open."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["But, with the jumper connected, an open anode is bypassed by the jumper and you measured the low resistance between the gate and cathode."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["When the jumper is removed the SCR should stay ON. Removing the jumper removed the low resistance path from the gate to the cathode."], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["The computer will now replace the SCR.", "The computer will now replace the SCR. ternal program = SCAN FTR 0 C1 00 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2340"]}, {"id": "P2370", "text": ["9.  Remove the multimeter from the circuit. \n10.  Turn the PC2 DC Power switch ON. \n11.  Check the operation of the SCR.", "9. Remove the multimeter from the circuit. 10. Turn the PC2 DC Power switch ON. 11. Check the operation of the SCR..", "Rotate R2 CW to illuminate I1 Rotate R2 fully CCW, I1 stays ON Place S2 to RESET, I1 goes out Place S2 to RESET, I1 goes out"], "jumps": ["P2360"]}, {"id": "P2380", "text": ["Are the input voltages correct?", "Are the input voltages correct?ed.........................."], "jumps": ["P2370"]}, {"id": "P2381", "text": [], "jumps": []}, {"id": "P2382", "text": ["The circuit should be operating correctly. Check that S2 is in the OPERATE position."], "jumps": []}, {"id": "P2385", "text": ["CONGRATULATIONS  \nYou have found the fault and verified correct operation after the repair.", "CONGRATULATIONS You have found the fault and verified correct operation after the repair."], "jumps": ["P2390", "P2380"]}, {"id": "P2390", "text": ["1.  Return the Test Console controls to the initial control settings.", "1. Return the Test Console controls to the initial control settings......."], "jumps": ["P2385"]}, {"id": "P2400", "text": ["2.  Turn the Test Console Power OFF.", "2. Turn the Test Console Power OFF.OFF...................."], "jumps": ["P2390"]}, {"id": "P2410", "text": ["3.  Disconnect all test equipment. \n4.  Carefully remove PC130-52A.\n5.  Return all equipment to its proper storage area.", "3. Disconnect all test equipment. 4. Carefully remove PC130-52A. 5. Return all equipment to its proper storage area."], "jumps": ["P2910", "P2400"]}, {"id": "P2910", "text": ["This completes the experiment on SCR TRIGGER CIRCUIT.", "This completes the experiment on SCR TRIGGER CIRCUIT......."], "jumps": ["P2001", "P2410"]}, {"id": "P3001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P3020", "text": ["The purpose of this experiment is to use an ohmmeter to check an SCR and then troubleshoot a faulted SCR power control circuit."], "jumps": ["P3030", "P3001"]}, {"id": "P3030", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "5. Nida Model 480 analog meter or Equivalent"], "jumps": []}, {"id": "P3040", "text": ["Pick up the PC130-52B card. The purpose of this card is to demonstrate troubleshooting SCR power control circuits."], "jumps": ["P3030"]}, {"id": "P3050", "text": ["Compare the components on PC130-52B to the schematic shown."], "jumps": ["P3040"]}, {"id": "P3060", "text": ["I1 is an incandescence lamp used as the load. Voltage measurements across the load do not have to be made, observe if the lamp is ON or  OFF.", "I1 is an incandescence lamp used as the load. Voltage measurements across the load do not have to be made, observe if the lamp is ON or OFF."], "jumps": ["P3040"]}, {"id": "P3070", "text": ["R2 and R3 form the input circuit."], "jumps": ["P3040"]}, {"id": "P3080", "text": ["R1 provides bias for the cathode of SCR1. Let's start the experiment."], "jumps": ["P3040"]}, {"id": "P3090", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P3040"]}, {"id": "P3100", "text": ["2.  Carefully plug PC130-52B into the Test Console PC1 position.  3.  Adjust R3 on PC130-52B fully CCW.", "2. Carefully plug PC130-52B into the Test Console PC1 position. 3. Adjust R3 on PC130-52B fully CCW. ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P3090", "P3105"]}, {"id": "P3105", "text": ["MEASUREMENT SETUP - Carefully rotate R3 fully CCW."], "jumps": []}, {"id": "P3120", "text": ["4.  Turn the PC1 AC Power switch ON. \n     The experiment card is now setup. Let's verify normal                      operation before inserting a fault.", "4. Turn the PC1 AC Power switch ON. The experiment card is now setup. Let's verify normal operation before inserting a fault.............."], "jumps": ["P3100"]}, {"id": "P3130", "text": ["1.  Slowly rotate R3 fully CW while observing the lamp.\n     Did the lamp intensity change from dim to bright?", "1. Slowly rotate R3 fully CW while observing the lamp. Did the lamp intensity change from dim to bright?"], "jumps": ["P3120"]}, {"id": "P3131", "text": [], "jumps": []}, {"id": "P3132", "text": ["The lamp should have changed intensity. R3 controls the trigger point to the SCR which controls the amount of power available to the load, I1. If unable to adjust the power to I1, check with your instructor."], "jumps": []}, {"id": "P3140", "text": ["The SCR power control circuit is operating correctly. Now, let's use the ohmmeter test to verify that the SCR is good. The computer will isolate the SCR for you."], "jumps": ["P3150", "P3130"]}, {"id": "P3150", "text": ["1.  Turn the PC1 AC switch OFF. \n     Remember, power must be OFF to the circuit when making             resistance measurements.", "1. Turn the PC1 AC switch OFF. Remember, power must be OFF to the circuit when making resistance measurements. CAN FTR 0 F1 07"], "jumps": ["P3140"]}, {"id": "P3160", "text": ["2.  Place the positive test lead (black lead on the Nida 480) to TP2      on PC130-52B, cathode of SCR1.  \n3.  Place the negative test lead (red lead on the Nida 480) to TP4         on  PC130-52B, anode of SCR1.", "2. Place the positive test lead (black lead on the Nida 480) to TP2 on PC130-52B, cathode of SCR1. 3. Place the negative test lead (red lead on the Nida 480) to TP4 on PC130-52B, anode of SCR1.."], "jumps": ["P3170", "P3150", "P3165"]}, {"id": "P3165", "text": ["MULTIMETER LEAD PLACEMENT - Carefully connect the positive test lead to TP2, and the negative test lead to TP4. Multimeter set to RX1."], "jumps": []}, {"id": "P3170", "text": ["The SCR is reverse biased with no gate signal applied.\nIs the multimeter reading high or low ohms?", "The SCR is reverse biased with no gate signal applied. Is the multimeter reading high or low ohms??"], "jumps": ["P3160"]}, {"id": "P3171", "text": [], "jumps": []}, {"id": "P3172", "text": ["You should NOT have measured low ohms when the SCR is reverse biased. Check your lead placement on the SCR and check on your meter which lead has the positive potential. The positive potential lead should be connected to TP2, cathode of the SCR.", "You should NOT have measured low ohms when the SCR is reverse biased. Check your lead placement on the SCR and check on your meter which lead has the positive potential. The positive potential lead should be connected to TP2, cathode of the SCR...."], "jumps": []}, {"id": "P3180", "text": ["4. Reverse the test leads that are on TP2 and TP4. This will                 forward bias the SCR.  \n    Do you now measure high or low ohms?", "4. Reverse the test leads that are on TP2 and TP4. This will forward bias the SCR. Do you now measure high or low ohms?"], "jumps": ["P3170"]}, {"id": "P3181", "text": [], "jumps": []}, {"id": "P3182", "text": ["You still should have measured high ohms. Even though the SCR is forward biased, there has been no current applied to the gate to turn the SCR ON."], "jumps": []}, {"id": "P3190", "text": ["5.  Place a jumper between TP4 and TP5 on the PC130-52B card.       This applies gate current to the SCR. Ensure the meter is still         connected. \n     Do you now measure high or low ohms?", "5. Place a jumper between TP4 and TP5 on the PC130-52B card. This applies gate current to the SCR. Ensure the meter is still connected. Do you now measure high or low ohms???"], "jumps": ["P3180", "P3195"]}, {"id": "P3191", "text": [], "jumps": []}, {"id": "P3192", "text": ["You should have measured a low resistance. The SCR is forward biased and the gate receives current flow from the jumper."], "jumps": []}, {"id": "P3195", "text": ["MEASUREMENT SETUP - Carefully connect the jumper between TP4 and TP5."], "jumps": []}, {"id": "P3200", "text": ["6.  Without removing the meter's test leads, remove the jumper           from TP4 to TP5. The meter should still measure low ohms.            Once the SCR is ON it stays ON until the anode current is                interrupted.", "6. Without removing the meter's test leads, remove the jumper from TP4 to TP5. The meter should still measure low ohms. Once the SCR is ON it stays ON until the anode current is interrupted..."], "jumps": ["P3210", "P3190"]}, {"id": "P3210", "text": ["7.  Disconnect the test lead from TP4.  \n8.  Reconnect the test lead to TP4. The meter should now                     measure high ohms. Removing the test lead broke the current       path through the SCR and the SCR turns OFF. Measuring the        resistance of an SCR when OFF measures high ohms.", "7. Disconnect the test lead from TP4. 8. Reconnect the test lead to TP4. The meter should now measure high ohms. Removing the test lead broke the current path through the SCR and the SCR turns OFF. Measuring the resistance of an SCR when OFF measures high ohms."], "jumps": ["P3220", "P3200"]}, {"id": "P3220", "text": ["Now, the computer will insert a fault into the SCR trigger circuit.", "Now, the computer will insert a fault into the SCR trigger circuit. ternal program = SCAN FTR 0 C1 00 External program = SCAN FTR 0 F1 10to ON........................................."], "jumps": ["P3210"]}, {"id": "P3230", "text": ["1.  Remove the multimeter from the circuit.\n2.  Turn the PC1 AC switch ON.", "1. Remove the multimeter from the circuit. 2. Turn the PC1 AC switch ON..."], "jumps": ["P3220"]}, {"id": "P3240", "text": ["3.  Check for normal operation of the SCR circuit.", "3. Check for normal operation of the SCR circuit..........", "Normal Operation Rotate R3 CW to illuminate I1..."], "jumps": ["P3250", "P3230", "P3245"]}, {"id": "P3245", "text": ["MEASUREMENT SETUP - Carefully rotate R3 CW, to illuminate I1."], "jumps": []}, {"id": "P3250", "text": ["Is the SCR power control circuit operating correctly?", "Is the SCR power control circuit operating correctly?......"], "jumps": ["P3240"]}, {"id": "P3251", "text": [], "jumps": []}, {"id": "P3252", "text": ["The lamp did not illuminate at all. Something is wrong in the circuit."], "jumps": []}, {"id": "P3260", "text": ["4.  Check that there is voltage applied to the load and the gate.           Use the oscilloscope to measure AC voltages.", "4. Check that there is voltage applied to the load and the gate. Use the oscilloscope to measure AC voltages.", "Applied Voltages TP3, 40 Vpp (voltage to the load). Tp5, .8 to 40 Vpp (voltage to gate depends on R3 settings.)"], "jumps": ["P3270", "P3250"]}, {"id": "P3270", "text": ["Are the input voltage , "P13040"]}, {"id": "P13060", "text": ["I1 is an incandescence lamp used as the load. Voltage measurements across the load do not have to be made, observe if the lamp is ON or OFF."], "jumps": ["P13070", "P13040"]}, {"id": "P13070", "text": ["R1 and R2 form the input circuit. R3, C1 and S2 form the reset circuit."], "jumps": ["P13080", "P13040"]}, {"id": "P13080", "text": ["S1 selects between a pulse trigger signal or a DC trigger signal. The DC signal is used in this experiment. Let's start the experiment"], "jumps": ["P13085", "P13040"]}, {"id": "P13085", "text": ["NOTE  \nOn some cards, resistor R4 is not present. Circuit operation is not affected, R4 is not in the circuit for this experiment.", "NOTE On some cards, resistor R4 is not present. Circuit operation is not affected, R4 is not in the circuit for this experiment."], "jumps": ["P13090", "P13040"]}, {"id": "P13090", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P13085"]}, {"id": "P13100", "text": ["2.  Carefully plug PC130-52A into the Test Console PC2 position. 3.  Set S1 on PC130-52A to the DC position and set S2 to                       OPERATE. .  \n4.  Adjust R2 on PC130-52A fully CCW.", "2. Carefully plug PC130-52A into the Test Console PC2 position. 3. Set S1 on PC130-52A to the DC position and set S2 to OPERATE. . 4. Adjust R2 on PC130-52A fully CCW..."], "jumps": ["P13110", "P13105"]}, {"id": "P13105", "text": ["MEASUREMENT SETUP - Set S1 to the DC position and carefully rotate R2 fully CCW."], "jumps": []}, {"id": "P13110", "text": ["5.  Press Enter to set: Positive Supply Voltage - 12", "5. Press Enter to set: Positive Supply Voltage - 122Voltage - 12.........."], "jumps": []}, {"id": "P13130", "text": ["The experiment card is now setup. Let's verify normal                      operation before inserting a fault. \n6.  Press Enter to set: PC2 DC Power Switch - ON", "The experiment card is now setup. Let's verify normal operation before inserting a fault. 6. Press Enter to set: PC2 DC Power Switch - ON"], "jumps": []}, {"id": "P13140", "text": ["1.  Rotate R2 fully CW. \n     Did the lamp illuminate?", "1. Rotate R2 fully CW. Did the lamp illuminate?......"], "jumps": []}, {"id": "P13141", "text": [], "jumps": []}, {"id": "P13142", "text": ["The lamp should have illuminated. R2 supplies current to the gate of the SCR. Check your card setup and if the lamp still does not illuminate, check with your instructor."], "jumps": []}, {"id": "P13150", "text": ["2.  Rotate R2 fully CCW. \n     Did the lamp extinguish?", "2. Rotate R2 fully CCW. Did the lamp extinguish?....."], "jumps": ["P13140"]}, {"id": "P13151", "text": [], "jumps": []}, {"id": "P13152", "text": ["The lamp should have stayed illuminated. Remember, once the SCR turns ON, the gate current is not needed to retain the SCR ON. Check with your instructor, you may have a faulted card."], "jumps": []}, {"id": "P13160", "text": ["3.  Place the Reset/Operate switch on PC130-52A to RESET and         back to OPERATE. \n     Did the lamp extinguish?", "3. Place the Reset/Operate switch on PC130-52A to RESET and back to OPERATE. Did the lamp extinguish?"], "jumps": ["P13150"]}, {"id": "P13161", "text": [], "jumps": []}, {"id": "P13162", "text": ["The lamp should have extinguished. Ensure that R2 is fully CCW and that you place S2 to reset. If the lamp still does not extinguish, check with your instructor."], "jumps": []}, {"id": "P13170", "text": ["The SCR trigger circuit is operating correctly. Now, let's use the ohmmeter test to verify that the SCR is good. The computer will isolate the SCR for you."], "jumps": ["P13180", "P13160"]}, {"id": "P13180", "text": ["Remember, power must be OFF to the circuit when making             resistance measurements. \n1.  Press Enter to set: PC2 DC Power Switch - OFF", "Remember, power must be OFF to the circuit when making resistance measurements. 1. Press Enter to set: PC2 DC Power Switch - OFF"], "jumps": ["P13170"]}, {"id": "P13190", "text": ["2.  Place the positive test lead (black lead on the Nida 480) to TP1      on PC130-52A, cathode of SCR1.   \n3.  Place the negative test lead (red lead on the Nida 480) to TP4         on PC130-52A, anode of SCR1.", "2. Place the positive test lead (black lead on the Nida 480) to TP1 on PC130-52A, cathode of SCR1. 3. Place the negative test lead (red lead on the Nida 480) to TP4 on PC130-52A, anode of SCR1...", "You need to pay close attention to your meter lead potential when measuring SCR resistance. All meters do NOT have the same lead potential. For example, the black lead of some multimeters is connected to the positive voltage source of the meter giving this lead the positive potential. Some meters have a polarity switch that can be used to changed the lead potential. your meter and know the lead potential."], "jumps": ["P13200", "P13195"]}, {"id": "P13195", "text": ["MULTIMETER LEAD PLACEMENT - Carefully connect the positive potential test lead to TP1, and the negative potential test lead to TP4. Multimeter set to RX1."], "jumps": []}, {"id": "P13200", "text": ["The SCR is reverse biased with no gate signal applied. \nIs the multimeter reading high or low ohms?", "The SCR is reverse biased with no gate signal applied. Is the multimeter reading high or low ohms?"], "jumps": ["P13190"]}, {"id": "P13201", "text": [], "jumps": []}, {"id": "P13202", "text": ["You should not have measured low ohms when the SCR is reverse biased. Check your lead placement on the SCR and check on your meter which lead has the positive potential. The positive potential lead should be connected to TP1, cathode of the SCR.", "You should not have measured low ohms when the SCR is reverse biased. Check your lead placement on the SCR and check on your meter which lead has the positive potential. The positive potential lead should be connected to TP1, cathode of the SCR..."], "jumps": []}, {"id": "P13210", "text": ["4.  Reverse the test leads that are on TP4 and TP1. This will                 forward bias the SCR. \n    Do you measure high or low ohms?", "4. Reverse the test leads that are on TP4 and TP1. This will forward bias the SCR. Do you measure high or low ohms?"], "jumps": ["P13200"]}, {"id": "P13211", "text": [], "jumps": []}, {"id": "P13212", "text": ["You still should have measured high ohms. Even though the SCR is forward biased, there has been no current applied to the gate to turn the SCR ON."], "jumps": []}, {"id": "P13220", "text": ["5.  Place a jumper between TP4 and TP2 on the PC130-52A card.       This applies gate current to the SCR. Ensure the meter is still         connected.\n     Is the resistance reading high or low?", "5. Place a jumper between TP4 and TP2 on the PC130-52A card. This applies gate current to the SCR. Ensure the meter is still connected. Is the resistance reading high or low???"], "jumps": ["P13210", "P13225"]}, {"id": "P13221", "text": [], "jumps": []}, {"id": "P13222", "text": ["You should have measured a low resistance. The SCR is forward biased and the gate receives current flow from the jumper."], "jumps": []}, {"id": "P13225", "text": ["MULTIMETER LEAD PLACEMENT - Carefully connect the jumper to TP2 and TP4."], "jumps": []}, {"id": "P13230", "text": ["6.  Without removing the meter's test leads, remove the jumper           from TP4 to TP2. The meter should still measure low ohms.            Once the SCR is ON it stays ON until the anode current is                interrupted.", "6. Without removing the meter's test leads, remove the jumper from TP4 to TP2. The meter should still measure low ohms. Once the SCR is ON it stays ON until the anode current is interrupted..."], "jumps": ["P13240", "P13220"]}, {"id": "P13240", "text": ["7. Disconnect the test lead from TP4. 8. Reconnect the test lead to TP4. The meter should now measure high ohms. Removing the test lead opened the current path through the SCR and the SCR turns OFF. Measuring the resistance of an SCR when OFF measures high ohms..."], "jumps": ["P13230"]}, {"id": "P13250", "text": ["Now, the computer will insert a fault into the SCR trigger circuit.", "Now, the computer will insert a fault into the SCR trigger circuit. ternal program = 130E FLT 0 F2 07 S"], "jumps": ["P13240"]}, {"id": "P13260", "text": ["1.  Remove the multimeter from the card.  \n2.  Rotate R2 on PC130-52A fully CCW.\n3.  Ensure that S2 on PC130-52A is set to operate. \n4.  Press Enter to set: PC2 DC Power Switch - ON", "1. Remove the multimeter from the card. 2. Rotate R2 on PC130-52A fully CCW. 3. Ensure that S2 on PC130-52A is set to operate. 4. Press Enter to set: PC2 DC Power Switch - ONNN"], "jumps": []}, {"id": "P13270", "text": ["5.  Check for normal operation of the SCR circuit.", "5. Check for normal operation of the SCR circuit..........", "Normal Operation of I1 Rotate R2 CW to illuminate I1 Rotate R2 fully CCW, I1 stays ON Place S2 to RESET, I1 goes out"], "jumps": ["P13280", "P13275"]}, {"id": "P13275", "text": ["NORMAL OPERATION OF I1 Rotate R2 CW to illuminate I1 Rotate R2 fully CCW, I1 stays ON Place S2 to RESET, I1 goes out"], "jumps": []}, {"id": "P13280", "text": ["Is the SCR trigger circuit operating correctly?", "Is the SCR trigger circuit operating correctly?............"], "jumps": ["P13270"]}, {"id": "P13281", "text": [], "jumps": []}, {"id": "P13282", "text": ["The lamp did not illuminate, something is wrong in the circuit."], "jumps": []}, {"id": "P13290", "text": ["6.  Check that there is voltage applied to the load and to the gate        of SCR.", "6. Check that there is voltage applied to the load and to the gate of SCR.", "Normal Applied Voltages TP5, +12 VDC (voltage to load) TP2, - .7 to +.6 VDC (voltage to the gate, amount depends on R2 setting.))"], "jumps": ["P13300", "P13280"]}, {"id": "P13300", "text": ["Are the input voltages correct?", "Are the input voltages correct?ed.........................."], "jumps": ["P13290"]}, {"id": "P13301", "text": [], "jumps": []}, {"id": "P13302", "text": ["The voltage on I1 is 12 VDC and voltage applied to the gate of the SCR is between -.7 and +.6 VDC. These are correct voltage levels."], "jumps": []}, {"id": "P13310", "text": ["7.  Press Enter to set: PC2 DC Power Switch - OFF.", "7. Press Enter to set: PC2 DC Power Switch - OFF. ernal program = 130E FLT 0 F2 10 S", "The computer will again isolate the SCR.... agai isolate the SCR. - .7 to +.6 VDC(voltage to the gate, amout depeds on R2 setting.))"], "jumps": ["P13300"]}, {"id": "P13320", "text": ["8.  Check the SCR with a ohmmeter. \n     Is the SCR operating correctly?", "8. Check the SCR with a ohmmeter. Is the SCR operating correctly?"], "jumps": ["P13325"]}, {"id": "P13321", "text": [], "jumps": []}, {"id": "P13322", "text": ["Notice that after the jumper is removed, the SCR turns OFF, high ohms. The SCR should have remained ON."], "jumps": []}, {"id": "P13323", "text": ["FORWARD BIAS, NO GATE APPLIED - Place the positive lead on the anode and the negative lead on the cathode."], "jumps": []}, {"id": "P13324", "text": ["FORWARD BIASED WITH GATE APPLIED Connect a jumper from the anode to the cathode. Place the positive lead on the anode and the negative lead on cathode."], "jumps": []}, {"id": "P13325", "text": ["1. Reverse biased, no gate current. 2. Forward biased, no gate current. 3. Forward biased, with gate current. 4. Forward biased after removing the jumper. 5. Forward biased after removing and reconnecting the positive meter lead.positive meter lead.meter lead."], "jumps": []}, {"id": "P13327", "text": ["FORWARD BIASED, REMOVED JUMPER - Remove the anode to cathode jumper, keeping the test leads in place."], "jumps": []}, {"id": "P13328", "text": ["FORWARD BIAS, DISCONNECTED AND RECONNECTED POSITIVE LEAD Disconnect and reconnect the positive test lead to the anode."], "jumps": []}, {"id": "P13329", "text": ["REVERSE BIASED NO GATE - Place the negative lead on the anode and the positive lead on the cathode."], "jumps": []}, {"id": "P13330", "text": ["In this case the anode of SCR1 is open. However, you did measure low ohms when the jumper was in place which indicates that the SCR's cathode is not open."], "jumps": ["P13340", "P13320"]}, {"id": "P13340", "text": ["But, with the jumper connected, an open anode is bypassed by the jumper and you measured the low resistance between the gate and cathode."], "jumps": ["P13350", "P13330"]}, {"id": "P13350", "text": ["When the jumper is removed the SCR should stay ON. Removing the jumper removed the low resistance path from the gate to the cathode."], "jumps": ["P13360", "P13340"]}, {"id": "P13360", "text": ["The computer will now replace the SCR.", "The computer will now replace the SCR. ternal program = 130E FLT 0 C S....."], "jumps": ["P13340"]}, {"id": "P13370", "text": ["9.  Remove the multimeter from the circuit. \n10.  Check the operation of the SCR. \n11.  Press Enter to set: PC2 DC Power Switch - ON", "9. Remove the multimeter from the circuit. 10. Check the operation of the SCR. 11. Press Enter to set: PC2 DC Power Switch - ON", "Rotate R2 CW to illuminate I1 Rotate R2 fully CCW, I1 stays ON Place S2 to RESET, I1 goes out Place S2 to RESET, I1 goes out"], "jumps": []}, {"id": "P13380", "text": ["Are the input voltages correct?", "Are the input voltages correct?ed.........................."], "jumps": []}, {"id": "P13381", "text": [], "jumps": []}, {"id": "P13382", "text": ["The circuit should be operating correctly. Check that S2 is in the OPERATE position."], "jumps": []}, {"id": "P13385", "text": ["CONGRATULATIONS  \nYou have found the fault and verified correct operation after the repair.", "CONGRATULATIONS You have found the fault and verified correct operation after the repair."], "jumps": ["P13380"]}, {"id": "P13400", "text": ["2.  Turn the Test Console Power OFF.", "2. Turn the Test Console Power OFF.OFF.FF................................."], "jumps": []}, {"id": "P13410", "text": ["3.  Disconnect all test equipment. \n4.  Carefully remove PC130-52A. \n5.  Return all equipment to its proper storage area.", "3. Disconnect all test equipment. 4. Carefully remove PC130-52A. 5. Return all equipment to its proper storage area."], "jumps": ["P13910", "P13400"]}, {"id": "P13910", "text": ["This completes the experiment on SCR TRIGGER CIRCUIT.", "This completes the experiment on SCR TRIGGER CIRCUIT......."], "jumps": ["P2001", "P13410"]}, {"id": "P14020", "text": ["The purpose of this experiment is to use an ohmmeter to check an SCR and then troubleshoot a faulted SCR power control circuit."], "jumps": ["P14030", "P3001"]}, {"id": "P14030", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P14040", "text": ["Pick up the PC130-52B card. The purpose of this card is to demonstrate troubleshooting SCR power control circuits."], "jumps": ["P14050", "P14030"]}, {"id": "P14050", "text": ["Compare the components on PC130-52B to the schematic shown."], "jumps": ["P14060", "P14040"]}, {"id": "P14060", "text": ["I1 is an incandescence lamp used as the load. Voltage measurements across the load do not have to be made, observe if the lamp is ON or OFF.", "I1 is an incandescence lamp used as the load. Voltage measurements across the load do not have to be made, observe if the lamp is ON or OFF.."], "jumps": ["P14070", "P14040"]}, {"id": "P14070", "text": ["R2 and R3 form the input circuit."], "jumps": ["P14080", "P14040"]}, {"id": "P14080", "text": ["R1 provides bias for the cathode of SCR1. Let's start the experiment"], "jumps": ["P14090", "P14040"]}, {"id": "P14090", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P14040"]}, {"id": "P14100", "text": ["2.  Carefully plug PC130-52B into the Test Console PC1 position. 3.  Adjust R3 on PC130-52B fully CCW. \n4.  Connect the alligator to alligator jumper from pin A to pin H on       PC130-52B.", "2. Carefully plug PC130-52B into the Test Console PC1 position. 3. Adjust R3 on PC130-52B fully CCW. 4. Connect the alligator to alligator jumper from pin A to pin H on PC130-52B..."], "jumps": ["P14120", "P14105"]}, {"id": "P14105", "text": ["MEASUREMENT SETUP - Due to the unique design of PC130-52B, a jumper is used to provide a ground reference for the load, lamp, I1."], "jumps": []}, {"id": "P14120", "text": ["The experiment card is now setup. Let's verify normal                      operation before inserting a fault. \n5.  Press Enter to set: PC1 AC Power Switch - ON", "The experiment card is now setup. Let's verify normal operation before inserting a fault. 5. Press Enter to set: PC1 AC Power Switch - ON"], "jumps": ["P14100"]}, {"id": "P14130", "text": ["1.  Slowly rotate R3 fully CW while observing the lamp. \n     Did the lamp intensity change from dim to bright?", "1. Slowly rotate R3 fully CW while observing the lamp. Did the lamp intensity change from dim to bright?"], "jumps": []}, {"id": "P14131", "text": [], "jumps": []}, {"id": "P14132", "text": ["The lamp should have changed intensity. R3 controls the trigger point to the SCR which controls the amount of power available to the load, I1. If unable to adjust the power to I1, check with your instructor."], "jumps": []}, {"id": "P14140", "text": ["The SCR power control circuit is operating correctly. Now, let's use the ohmmeter test to verify that the SCR is good. The computer will isolate the SCR for you."], "jumps": ["P14150", "P14130"]}, {"id": "P14150", "text": ["Remember, power must be OFF to the circuit when making             resistance measurements. \n1.  Press Enter to set: PC1 AC Power Switch - OFF", "Remember, power must be OFF to the circuit when making resistance measurements. 1. Press Enter to set: PC1 AC Power Switch - OFF"], "jumps": ["P14140"]}, {"id": "P14160", "text": ["2.  Place the positive test lead (black lead on the Nida 480) to TP2      on PC130-52B, cathode of SCR1. \n3.  Place the negative test lead (red lead on the Nida 480) to TP4         on PC130-52B, anode of SCR1.", "2. Place the positive test lead (black lead on the Nida 480) to TP2 on PC130-52B, cathode of SCR1. 3. Place the negative test lead (red lead on the Nida 480) to TP4 on PC130-52B, anode of SCR1..."], "jumps": ["P14170", "P14165"]}, {"id": "P14165", "text": ["MULTIMETER LEAD PLACEMENT - Carefully connect the positive test lead to TP2, and the negative test lead to TP4. Multimeter set to RX1."], "jumps": []}, {"id": "P14170", "text": ["The SCR is reverse biased with no gate signal applied. \nIs the multimeter reading high or low ohms?", "The SCR is reverse biased with no gate signal applied. Is the multimeter reading high or low ohms?"], "jumps": ["P14160"]}, {"id": "P14171", "text": [], "jumps": []}, {"id": "P14172", "text": ["You should NOT have measured low ohms when the SCR is reverse biased. Check your lead placement on the SCR and check on your meter which lead has the positive potential. The positive potential lead should be connected to TP2, cathode of the SCR.", "You should NOT have measured low ohms when the SCR is reverse biased. Check your lead placement on the SCR and check on your meter which lead has the positive potential. The positive potential lead should be connected to TP2, cathode of the SCR...."], "jumps": []}, {"id": "P14180", "text": ["4.  Reverse the test leads that are on TP2 and TP4. This will                 forward bias the SCR.\n     Do you now measure high or low ohms?", "4. Reverse the test leads that are on TP2 and TP4. This will forward bias the SCR. Do you now measure high or low ohms?"], "jumps": ["P14170"]}, {"id": "P14181", "text": [], "jumps": []}, {"id": "P14182", "text": ["You still should have measured high ohms. Even though the SCR is forward biased, there has been no current applied to the gate to turn the SCR ON."], "jumps": []}, {"id": "P14190", "text": ["5.  Place a jumper between TP4 and TP5 on the PC130-52B card.       This applies gate current to the SCR. Ensure the meter is still         connected.\n     Do you now measure high or low ohms?", "5. Place a jumper between TP4 and TP5 on the PC130-52B card. This applies gate current to the SCR. Ensure the meter is still connected. Do you now measure high or low ohms???"], "jumps": ["P14180", "P14195"]}, {"id": "P14191", "text": [], "jumps": []}, {"id": "P14192", "text": ["You should have measured a low resistance. The SCR is forward biased and the gate receives current flow from the jumper."], "jumps": []}, {"id": "P14195", "text": ["MEASUREMENT SETUP - Carefully connect the jumper between TP4 and TP5."], "jumps": []}, {"id": "P14200", "text": ["6.  Without removing the meter's test leads, remove the jumper           from TP4 to TP5. The meter should still measure low ohms.            Once the SCR is ON it stays ON until the anode current is                interrupted.", "6. Without removing the meter's test leads, remove the jumper from TP4 to TP5. The meter should still measure low ohms. Once the SCR is ON it stays ON until the anode current is interrupted...."], "jumps": ["P14210", "P14190"]}, {"id": "P14210", "text": ["7.  Disconnect the test lead from TP4.  \n8.  Reconnect the test lead to TP4. The meter should now                     measure high ohms. Removing the test lead broke the current       path through the SCR and the SCR turns OFF. Measuring the        resistance of an SCR when OFF measures high ohms.", "7. Disconnect the test lead from TP4. 8. Reconnect the test lead to TP4. The meter should now measure high ohms. Removing the test lead broke the current path through the SCR and the SCR turns OFF. Measuring the resistance of an SCR when OFF measures high ohms. S"], "jumps": ["P14200"]}, {"id": "P14220", "text": ["Now, the computer will insert a fault into the SCR trigger circuit.", "Now, the computer will insert a fault into the SCR trigger circuit. tern let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
