const book = {"title": "9395Z204", "pages": [{"id": "P10222a", "text": ["What is the purpose of this circuit in a pulse width modulated switching power supply?", "Protects the circuit from overcurrent conditions.", "Produces a differential signal between the reference and output voltage."], "jumps": []}, {"id": "PINFO", "text": ["04-24-00 Converted from SAM to toolbook. frieda 04-25-00 Text and Branching. frieda 05-01-00 Graphics by Chris 05-02-00 Review - Penny 05-03-00 Final Edit - Chris 05-03-00 Released - Penny 07-14-00 Converted to ToolBook 7.1 format. jay 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-12-02 review - rs 06-07-02 Interrupted save on last save, file corrupted. Ran repair utility and had to re-build P2325, P13280 and P13285. -Penny 07-09-02 Main Window Viewer, turned off system menu options and cleared menu bar. -PennyAM to toolbook. frieda 04-25-00 Text and Branching. frieda 05-01-00 Graphics by Chris"], "jumps": []}, {"id": "P8003", "text": ["PC130- 290 P2295, P13295 p3050, p3150, p3250, p13360, p13390, p13440, p13480, p14050, p14150, p14250 indicate the settings entered."], "jumps": []}, {"id": "P8002", "text": ["PC130- 85A P2285, P2325, P13285, P133255553250, p13360, p13390, p13440, p13480, p14050, p14150, p14250 indicate the settings entered."], "jumps": []}, {"id": "P8001", "text": ["PC130-290 P2030, P1303080, p3050, p3150, p3250, p13360, p13390, p13440, p13480, p14050, p14150, p14250 indicate the settings entered."], "jumps": []}, {"id": "P8000", "text": ["PC130-85A P2040, P1304080, p3050, p3150, p3250, p13360, p13390, p13440, p13480, p14050, p14150, p14250 indicate the settings entered."], "jumps": []}, {"id": "P13910", "text": ["This completes the experiment on PWM SWITCHING POWER SUPPLY."], "jumps": ["P13840", "P2001"]}, {"id": "P13840", "text": ["3. Remove the PC cards. 4. Return all equipment to the designated storage area."], "jumps": ["P13830", "P13910"]}, {"id": "P13830", "text": ["2. Place CONSOLE POWER to OFF.h to OFF.FF................................."], "jumps": []}, {"id": "P13810", "text": ["1. Remove the probes and turn off the oscilloscope.ngs...................."], "jumps": ["P13800"]}, {"id": "P13800", "text": ["7. Using the CH1 and CH2 probes, vary PC130-290 R1 to ensure that the power supply is now operational."], "jumps": ["P13810"]}, {"id": "P13790", "text": ["The computer will now remove the fault....................................."], "jumps": ["P13770"]}, {"id": "P13780", "text": ["With the correct voltage on TP5 (non-inverting input to the differential amplifier) and the signal on TP4 (output of differential amplifier) always around 15 volts, the amplifier is faulted."], "jumps": ["P13770", "P13790"]}, {"id": "P13770", "text": ["Congratulations, the problem is in the differential amplifier circuit."], "jumps": ["P13780", "P13760"]}, {"id": "P13765", "text": ["The power supply output is 15 volts, it should be 5 volts. There is a problem in the circuit."], "jumps": []}, {"id": "P13764", "text": ["The oscillator is not faulted due to the correct signals on TP7 and TP8."], "jumps": []}, {"id": "P13763", "text": ["The comparator could be at fault since the output is always HIGH and the sawtooth waveform input is correct. However, the non-inverting input is always around +15 volts and does not change, the input is incorrect...."], "jumps": []}, {"id": "P13762", "text": ["The regulator could be the problem since the output on TP6 and TP3 is maximum or around 15 volts. However, the input from the comparator (TP2) is always a HIGH which explains why the regulator output is 15 volts..............."], "jumps": []}, {"id": "P13761", "text": [], "jumps": []}, {"id": "P13760", "text": ["Which block is the most likely to have failed?............."], "jumps": ["P13740"]}, {"id": "P13750", "text": ["6. Use the CH2 probe to measure signals throughout the circuit and determine which block has failed. Don't forget to vary PC130-290 R1!"], "jumps": ["P13760"]}, {"id": "P13740", "text": ["The computer will now fault the power supply circuit on PC130-85A again."], "jumps": ["P13730"]}, {"id": "P13730", "text": ["5. Using the CH1 and CH2 probes, vary PC130-290 R1 to ensure that the power supply is now operational. If the power supply is not operating correctly, see your instructor."], "jumps": ["P13740"]}, {"id": "P13720", "text": ["The computer will now remove the fault....................................."], "jumps": ["P13700"]}, {"id": "P13710", "text": ["With the sawtooth present on the inverting input and a voltage on the non-inverting input, U1 should have been producing HIGH pulses and it is not."], "jumps": ["P13700", "P13720"]}, {"id": "P13700", "text": ["Congratulations, the problem is a failed comparator circuit."], "jumps": ["P13710", "P13690"]}, {"id": "P13695", "text": ["Measure the output voltage on TP3, there is no voltage. There is fault in the power supply."], "jumps": []}, {"id": "P13694", "text": ["The differential amplifier could cause the problem if the output is always 0 volts, this would cause the output of the comparator to always be LOW. However, the output of the differential amplifier is not zero volts as measured on TP4........"], "jumps": []}, {"id": "P13693", "text": ["The oscillator is not faulted, check the signals at TP7 and TP8. The correct waveforms are present."], "jumps": []}, {"id": "P13692", "text": ["The regulator could be the problem since the output voltage on TP6 and TP3 is zero. However, the input from the comparator (TP2) is always a LOW which explains why the regulator output is 0....."], "jumps": []}, {"id": "P13691", "text": [], "jumps": []}, {"id": "P13690", "text": ["Which block is the most likely to have failed?............."], "jumps": ["P13670"]}, {"id": "P13680", "text": ["4. Use the CH2 probe to measure signals throughout the circuit and determine which block has failed. Don't forget to vary PC130-290 R1!"], "jumps": ["P13690"]}, {"id": "P13670", "text": ["The computer will now fault the power supply circuit on PC130-85A..........."], "jumps": ["P13652"]}, {"id": "P13660", "text": ["If the circuit is not operating correctly, see your instructor."], "jumps": ["P13652", "P13670"]}, {"id": "P13652", "text": ["3. Vary PC130-290 R1 and verify that the power supply circuit is operating correctly, no change on the CH1 trace and a constant DC output at 5 volts."], "jumps": ["P13660", "P13640", "P13655"]}, {"id": "P13650", "text": ["3. Vary PC130-290 R1 and verify that the power supply circuit is operating correctly, no change on the CH1 trace and a constant DC output at 5 volts."], "jumps": ["P13655", "P13640", "P13660"]}, {"id": "P13640", "text": ["1. Remove the CH2 probe, keep the CH1 probe on PC130-85A TP3. 2. Change the source triggering to CH1. You are measuring the output of the power supply."], "jumps": ["P13650", "P13630", "P13645"]}, {"id": "P13630", "text": ["You have seen all the signals in the pulse width modulated power supply and determined that it is working correctly. Now, let's troubleshoot some faults."], "jumps": ["P13620", "P13640"]}, {"id": "P13620", "text": ["The action of R2, C5 and D2 changed the square wave into a sawtooth wave."], "jumps": ["P13630", "P13610"]}, {"id": "P13613", "text": ["Look at the rise and fall times. The wave is not a square wave."], "jumps": []}, {"id": "P13612", "text": ["Look at the rise and fall times. The wave is not a sine wave."], "jumps": []}, {"id": "P13611", "text": [], "jumps": []}, {"id": "P13610", "text": ["What is the basic waveform shown on CH2?..................."], "jumps": ["P13600"]}, {"id": "P13600", "text": ["12. Move the CH2 probe to TP8, change the coupling source to CH2 and adjust the triggering level."], "jumps": ["P13610", "P13590"]}, {"id": "P13590", "text": ["The signal on CH2 is the output of the oscillator constructed from U2E and U2F."], "jumps": ["P13600", "P13580"]}, {"id": "P13583", "text": ["Look at the rise and fall times. The wave is not a sawtooth wave."], "jumps": []}, {"id": "P13582", "text": ["Look at the rise and fall times. The wave is not a sine wave."], "jumps": []}, {"id": "P13581", "text": [], "jumps": []}, {"id": "P13580", "text": ["What is the basic waveform shown on the CH2 trace?........."], "jumps": ["P13570"]}, {"id": "P13570", "text": ["11. Move the CH2 probe to TP7............................."], "jumps": ["P13575", "P13560", "P13580"]}, {"id": "P13560", "text": ["You should be measuring about 10 volts. This is the applied voltage to R8."], "jumps": ["P13550", "P13570"]}, {"id": "P13550", "text": ["9. Return R8 for a 5 volt output as seen on the CH1 trace. 10. Move the CH2 probe to TP9 (DC voltage applied to the reference voltage circuit)."], "jumps": ["P13560", "P13530"]}, {"id": "P13540", "text": ["You should also see the output voltage (CH1 trace for TP3) change. Changing the reference voltage sets the power supply to produce a different output voltage."], "jumps": ["P13530", "P13550"]}, {"id": "P13530", "text": ["Varying R8 changes the reference voltage input to the differential amplifier. You should have seen the value change when viewing the CH2 trace."], "jumps": ["P13520", "P13540"]}, {"id": "P13520", "text": ["7. Move the CH2 probe to TP5. 8. Slightly vary PC130-85A R8."], "jumps": ["P13525", "P13500", "P13530"]}, {"id": "P13510", "text": ["When the output voltage changes, the output of U3 changes. The change in voltage is fed to the comparator so the power supply output remains unchanged, as seen on the CH1 trace."], "jumps": ["P13500", "P13520"]}, {"id": "P13500", "text": ["The differential amplifier subtracts the reference voltage from the sample of the output voltage."], "jumps": ["P13490", "P13510"]}, {"id": "P13492", "text": ["Look at the CH2 trace closely. You should have seen a very small voltage change."], "jumps": []}, {"id": "P13491", "text": [], "jumps": []}, {"id": "P13490", "text": ["\u0000\u0000\u0000incorrect1\u0000\u00001\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000[\u0001\u000f\u0000\u0000\u0000 \u0000\u0011\u0000remained the samee\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000{\u0001\u0010\u0000\u0000\u0000\u0002\u0000\u0002\u0000\u0000\u0000\u0001\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0001\u0000,\u0004\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0084\u0001\u0000\u0000\u00fc\u0000\u00be\u0004\u0012\u0002\u0091\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u00bb\u0001\u0012\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0014\u0000\u0013\u0000x\u001e\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00d3\u0001\u0013\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00e5\u0001\u0014\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000\u00ff\u0001\u0015\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000#\u0002\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00be\u0004\u0002\u0000\u0000\u0000\\\u0006\u0003\u0000\u0000\u0000|\u0007\u0000", "When the load on the power supply changed, what happened to the output of the differential amplifier?"], "jumps": ["P13480"]}, {"id": "P13480", "text": ["5. Move the CH2 probe to TP4 (output of differential amplifier). Change the input mode to DC. 6. Rotate R1 on PC130-290 clockwise and counterclockwise to change the load on the power supply."], "jumps": ["P13490", "P13410", "P13485"]}, {"id": "P13420", "text": ["With Q1 and Q3 varying the ON time, the average DC voltage output changes to compensate for increasing and decreasing loads as seen on CH1, a constant output voltage."], "jumps": ["P13410", "P13480"]}, {"id": "P13410", "text": ["When the load to the power supply changes, the output of the comparator changes which changes the ON time of Q1 and Q3."], "jumps": ["P13420", "P13400"]}, {"id": "P13402", "text": ["Look at the CH2 trace closely. You should have seen the pulse width changed as the load to the power supply changed."], "jumps": []}, {"id": "P13401", "text": [], "jumps": []}, {"id": "P13400", "text": ["\u0000\u0000\u0000incorrect1\u0000\u00001\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000[\u0001\u000f\u0000\u0000\u0000 \u0000\u0002\u0000Norst Choiceett\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000q\u0001\u0010\u0000\u0000\u0000\u0001\u0000\u0001\u0000\u0000\u0000,\u0004\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000z\u0001\u0000\u0000\u00fc\u0000\u00be\u0004\u0012\u0002\u0087\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u00b1\u0001\u0012\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0014\u0000\u0013\u0000x\u001e\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00c9\u0001\u0013\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00db\u0001\u0014\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000\u00f5\u0001\u0015\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0019\u0002\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00be\u0004\u0002\u0000\u0000\u0000\\\u0006\u0003\u0000\u0000\u0000|\u0007\u0000\u0000\u0000\u0000\u0000\u00003\u0002\u0017\u0000\u0000", "Did the pulse width of the signal seen on CH2 change when the power supply load was changed (rotation of PC130-290 R1)?"], "jumps": ["P13390"]}, {"id": "P13390", "text": ["4. While observing the two traces, rotate R1 on PC130-290 clockwise and counterclockwise. R1 changes the load on the power supply."], "jumps": ["P13400", "P13380", "P13395"]}, {"id": "P13380", "text": ["3. Place the CH2 probe on PC130-85A TP2. Set the oscilloscope input to AC and adjust the oscilloscope as necessary. Separate the two channels so that you can observe both traces. It may be necessary to change the triggering to CH2."], "jumps": ["P13385", "P13370", "P13390"]}, {"id": "P13370", "text": ["1. Keep the CH1 probe on PC130-85A TP3 (power supply output). 2. Set the oscilloscope to dual channel operation and a TIME/DIV setting of 2 microseconds."], "jumps": ["P13360", "P13380"]}, {"id": "P13360", "text": ["Now you know the power supply is operating correctly (no change in output voltage when the load changed). Let's measure the circuit's signals to confirm proper operation."], "jumps": ["P13350", "P13370"]}, {"id": "P13353", "text": ["Look closely at the oscilloscope, you should have not seen the output voltage decrease."], "jumps": []}, {"id": "P13352", "text": ["Look closely at the oscilloscope, you should have not seen the output voltage increase."], "jumps": []}, {"id": "P13351", "text": [], "jumps": []}, {"id": "P13350", "text": ["What was the effect on the power supply's output voltage when the load was increased and decreased?"], "jumps": ["P13340"]}, {"id": "P13340", "text": ["10. On PC130-290, rotate R1 clockwise and counterclockwise while observing the output voltage on the oscilloscope (TP3 on PC130-85A). Rotating R1 changes the load on the power supply."], "jumps": ["P13330", "P13350"]}, {"id": "P13330", "text": ["At this point, the power supply card is set to produce 5 volts to the PC130-290 load card. Let's see if the regulator circuit is operating correctly."], "jumps": ["P13320", "P13340"]}, {"id": "P13325", "text": ["EXPERIMENT CARD PC130-85A - Set S1 to DC and rotate R8 to mid position."], "jumps": []}, {"id": "P13320", "text": ["Display - CH1 Volts/Div - DC2 Coupling - + circuit. r instructor.", "Setting R8 changes the reference voltage to the regulator circuit. r instructor.", "8. Using the oscilloscope to measure DC voltage, measure the voltage on PC130-85A TP3 (power supply output). 9. On PC130-85A, set R8 for a 5 volt DC measurement. splay - CH1 Volts/Div - DC2 Coupling - + egulator circuit. Display - CH1 Volts/Div - DC2 Coupling - +"], "jumps": ["P13325", "P13330"]}, {"id": "P13310", "text": ["The LED just below R1 on the PC130-290 card should be illuminated. If not, see your instructor.", "Press Enter to Set: PC1 DC Power Switch - ON TE The LED just below R1 on the PC130-290 card should be illuminated. If not, see your instructor."], "jumps": []}, {"id": "P13300", "text": ["6. Press Enter to Set: Positive Supply Voltage - 15......................."], "jumps": ["P13290"]}, {"id": "P13295", "text": ["EXPERIMENT CARD PC130-290 - Set S1 and S2 up Set S5 through S9 down Set S3 to the left Set S4 to up (IN) Rotate R1 to mid position"], "jumps": []}, {"id": "P13290", "text": ["S1 down S2 up S3 to the left S4 to up or IN S5 through S9 down R1 to mid position n", "4. Insert PC130-290 into the PC2 position. 5. Set the card controls as follows: 1 Down S2 Up S3 to the left S4 to UP or IN S5 through S9 to down"], "jumps": ["P13295", "P13280", "P13300"]}, {"id": "P13285", "text": ["EXPERIMENT CARD PC130-85A - \"Set S1 to DC and rotate R8 to mid position.\""], "jumps": []}, {"id": "P13280", "text": ["2. Insert PC130-85A into the PC1 position. 3. Set S1 to DC and R8 to mid position on the card."], "jumps": ["P13290", "P13285"]}, {"id": "P13270", "text": ["1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13260"]}, {"id": "P13260", "text": ["Let's start the experiment.e..............................."], "jumps": ["P13250", "P13270"]}, {"id": "P13250", "text": ["L1 and C4 make up the filter (L1 is the large black component in the center of the card). The final output of the power supply is measured at TP3."], "jumps": ["P13255", "P13240", "P13260"]}, {"id": "P13240", "text": ["The filter circuit produces a pure DC output..............."], "jumps": ["P13250", "P13232"]}, {"id": "P13232", "text": ["The input is measured at TP2 and the output is measured at TP6. R12, Q2 and D7 make up the current protector circuit."], "jumps": ["P13240", "P13220", "P13235"]}, {"id": "P13230", "text": ["The input is measured at TP2 and the output is measured at TP6. R12, Q2 and D7 make up the current protector circuit."], "jumps": ["P13240", "P13220", "P13235"]}, {"id": "P13220", "text": ["In this regulator, Q1 and Q3 are used. Q3 is turned ON by the output of the comparator (low current device) which turns Q1 ON (higher current device)."], "jumps": ["P13230", "P13210", "P13225"]}, {"id": "P13210", "text": ["The regulator circuit produces the pulse width modulated signal. The current sensor circuit protects the regulator."], "jumps": ["P13220", "P13200"]}, {"id": "P13200", "text": ["U1 is the comparator and its output is measured at TP2. Locate U1 on the card."], "jumps": ["P13210", "P13190", "P13205"]}, {"id": "P13190", "text": ["The comparator compares the differential voltage to the sawtooth voltage which turns the regulator ON and OFF."], "jumps": ["P13200", "P13182"]}, {"id": "P13182", "text": ["D2 shorts R2 to produce the quick fall time when the square wave is zero. The sawtooth is measured at TP8."], "jumps": ["P13185", "P13150", "P13190"]}, {"id": "P13180", "text": ["D2 shorts R2 to produce the quick fall time when the square wave is zero. The sawtooth is measured at TP8."], "jumps": ["P13185", "P13172", "P13190"]}, {"id": "P13172", "text": ["R2 and C5 form a RC time constant that produces the rise time of the sawtooth. D2 is reverse biased when the square wave is positive."], "jumps": ["P13175", "P13150", "P13180"]}, {"id": "P13170", "text": ["R2 and C5 form a RC time constant that produces the rise time of the sawtooth. D2 is reverse biased when the square wave is positive."], "jumps": ["P13175", "P13162", "P13180"]}, {"id": "P13162", "text": ["U2E and U2F along with C2 and R4 make up a square wave oscillator. U2A through U2D are inverters being used as buffers. The square wave is measured at TP7."], "jumps": ["P13165", "P13150", "P13170"]}, {"id": "P13160", "text": ["U2E and U2F along with C2 and R4 make up a square wave oscillator. U2A through U2D are inverters being used as buffers. The square wave is measured at TP7."], "jumps": ["P13165", "P13150", "P13170"]}, {"id": "P13150", "text": ["U2 is a chip containing inverters which, along with other components, devise an oscillator."], "jumps": ["P13155", "P13140", "P13160"]}, {"id": "P13140", "text": ["The oscillator block produces the sawtooth wave............"], "jumps": ["P13150", "P13130"]}, {"id": "P13130", "text": ["U3 is the differential amplifier. The output is measured at TP4. Locate U3 on the card."], "jumps": ["P13140", "P13120", "P13135"]}, {"id": "P13120", "text": ["The differential amplifier inputs are a reference voltage and a sample of the circuit's output voltage."], "jumps": ["P13130", "P13110"]}, {"id": "P13110", "text": ["D3 is a voltage regulator and R8 sets the level for the reference voltage, measured at TP5. Locate R8 on the card."], "jumps": ["P13115", "P13100", "P13120"]}, {"id": "P13100", "text": ["The reference voltage block produces the reference voltage for the differential amplifier."], "jumps": ["P13110", "P13092"]}, {"id": "P13092", "text": ["D4 and D5 form a full wave rectifier when an AC input voltage is used. C8 is a filter capacitor, it is the large capacitor on the card, 1000 MFD."], "jumps": ["P13100", "P13080", "P13095"]}, {"id": "P13090", "text": ["D4 and D5 form a full wave rectifier when an AC input voltage is used. C8 is a filter capacitor, it is the large capacitor on the card, 1000 MFD.", "MEASUREMENT SETUP - Set the Input switch to DC"], "jumps": ["P13095", "P13080", "P13100"]}, {"id": "P13080", "text": ["You will use the DC input by setting the Input switch to DC. TP1 measures the DC input to the regulator which is +15 volts for this experiment."], "jumps": ["P13090", "P13050", "P13085"]}, {"id": "P13070", "text": ["The input circuit has both AC and DC inputs."], "jumps": ["P13080", "P13050"]}, {"id": "P13062", "text": ["Let's look at the schematic of each block. Compare the block, schematic and card."], "jumps": ["P13070", "P13050", "P13065"]}, {"id": "P13060", "text": ["Let's look at the schematic of each block. Compare the block, schematic and card."], "jumps": ["P13065", "P13050", "P13070"]}, {"id": "P13050", "text": ["The card has eight blocks that make up the circuit........."], "jumps": ["P13060", "P13040"]}, {"id": "P13040", "text": ["PC130-85A is the pulse width modulated power supply........"], "jumps": ["P13050", "P13030"]}, {"id": "P13030", "text": ["PC130-290 is used as a load to the power supply. The load can be varied so that you can see the action of the regulator."], "jumps": ["P13040", "P13020"]}, {"id": "P13020", "text": ["In this experiment you will study the operation of a pulse width modulated power supply using an oscilloscope."], "jumps": ["P13030", "P2001"]}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10229", "text": ["In this circuit for a pulse width modulated switching power supply, when will Q2 turn ON?", "When the current through R12 becomes excessive.", "When the frequency of the pulses becomes excessive.", "When the current stops flowing through Q1, Q3 and R12.", "When D7 becomes reversed biased due to a high output from the comparator."], "jumps": []}, {"id": "P10228", "text": ["Amplifying the difference between the sawtooth signal and reference signal.", "Amplifying the difference between the reference voltage and the output voltage.", "Determining the ON/OFF time of Q1. swer: C ]", "Low current device controlling a high current device, Q1.", "What is the purpose of Q3 in this circuit for a pulse width modulated switching power supply?"], "jumps": []}, {"id": "P10227", "text": ["Which components in this circuit change a square wave into a sawtooth wave for a pulse width modulated switching power supply?"], "jumps": []}, {"id": "P10226", "text": ["Compares the reference voltage to the output signal.", "Subtracts the reference voltage from the output signal.", "What is the purpose of U2E and U2F in this circuit for a pulse width modulated switching power supply?"], "jumps": []}, {"id": "P10225", "text": ["What is the purpose of this circuit in a pulse width modulated switching power supply?"], "jumps": []}, {"id": "P10224", "text": ["Produces a differential signal between the reference and output voltage. y", "Protects the circuit from over current conditions.", "What is the purpose of the Q2 circuit in a pulse width modulated switching power supply?"], "jumps": []}, {"id": "P10223", "text": ["What is the purpose of this circuit in a pulse width modulated switching power supply?", "Protects the circuit from overcurrent conditions.", "Produces a differential signal between the reference and output voltage."], "jumps": []}, {"id": "P10222", "text": ["Produces a differential signal between the reference and output voltage.", "Protects the circuit from overcurrent conditions.", "What is the purpose of this circuit in a pulse width modulated switching power supply?"], "jumps": []}, {"id": "P10221", "text": ["Produces a differential signal between the reference and output voltage.", "Protects the circuit from overcurrent conditions.", "What is the purpose of this circuit in a pulse width modulated switching power supply?"], "jumps": []}, {"id": "P10220", "text": ["In this circuit, part of a full pulse width modulated switching power supply, what is the purpose of R8?"], "jumps": []}, {"id": "P10219", "text": ["In this pulse width modulated switching power supply, if the output of U3 decreases, what happens to the output of U1?"], "jumps": []}, {"id": "P10218", "text": ["What type of signal is produced by the oscillator in the pulse width modulated switching power supply that is used?"], "jumps": []}, {"id": "P10217", "text": ["In this pulse width modulated switching power supply, if the regulated output voltage decreases, what happens to the ON time of Q1?"], "jumps": []}, {"id": "P10216", "text": ["In this pulse width modulated switching power supply, if the regulated output voltage increases, what happens to the ON time of Q1?"], "jumps": []}, {"id": "P10215", "text": ["In this pulse width modulated switching power supply, if the output voltage increases, what happens to the output of U3?"], "jumps": []}, {"id": "P10214", "text": ["What type of signal is applied to the base of Q1 in this switching power supply?"], "jumps": []}, {"id": "P10213", "text": ["What is the output of Q1 in this switching power supply?"], "jumps": []}, {"id": "P10212", "text": ["What is the purpose of Q1 in this switching power supply?"], "jumps": []}, {"id": "P10211", "text": ["Why can the components be smaller in a switching power supply's filter?"], "jumps": []}, {"id": "P10210", "text": ["What is the basic difference between a linear power supply and a switching power supply?", "The switching power supply does not use a filter.", "The switching power supply does not use a regulator. [", "The switching power supply does not use a rectifier.", "The switching power supply's regulator is turned ON and OFF. S"], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P2910", "text": ["This completes the experiment on PWM SWITCHING POWER SUPPLY."], "jumps": ["P2840", "P2001"]}, {"id": "P2840", "text": ["5. Remove the PC cards. 6. Return all equipment to the designated storage area."], "jumps": ["P2830", "P2910"]}, {"id": "P2830", "text": ["4. Place CONSOLE POWER to OFF.h to OFF...................."], "jumps": ["P2820"]}, {"id": "P2820", "text": ["3. Return the Test Console to the initial control settings................"], "jumps": ["P2810"]}, {"id": "P2810", "text": ["1. Remove the probes and turn off the oscilloscope. 2. Place the PC1 DC POWER switch to OFF."], "jumps": ["P2800"]}, {"id": "P2800", "text": ["7. Using the CH1 and CH2 probes, vary PC130-290 R1 to ensure that the power supply is now operational."], "jumps": ["P2810", "P2790"]}, {"id": "P2790", "text": ["The computer will now remove the fault.ault. the PC1 DC switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2770"]}, {"id": "P2780", "text": ["With the correct voltage on TP5 (non-inverting input to the differential amplifier) and the signal on TP4 (output of differential amplifier) always around 15 volts, the amplifier is faulted."], "jumps": ["P2770", "P2790"]}, {"id": "P2770", "text": ["Congratulations, the problem is in the differential amplifier circuit."], "jumps": ["P2780", "P2760"]}, {"id": "P2765", "text": ["The power supply output is 15 volts, it should be 5 volts. There is a problem in the circuit."], "jumps": []}, {"id": "P2764", "text": ["The oscillator is not faulted due to the correct signals on TP7 and TP8."], "jumps": []}, {"id": "P2763", "text": ["The comparator could be at fault since the output is always HIGH and the sawtooth waveform input is correct. However, the non-inverting input is always around +15 volts and does not change, the input is incorrect........"], "jumps": []}, {"id": "P2762", "text": ["The regulator could be the problem since the output on TP6 and TP3 is maximum or around 15 volts. However, the input from the comparator (TP2) is always a HIGH which explains why the regulator output is 15 volts..............."], "jumps": []}, {"id": "P2761", "text": [], "jumps": []}, {"id": "P2760", "text": ["Which block is the most likely to have failed?............."], "jumps": ["P2730"]}, {"id": "P2750", "text": ["6. Use the CH2 probe to measure signals throughout the circuit and determine which block has failed. Don't forget to vary PC130-290 R1!"], "jumps": ["P2730", "P2760"]}, {"id": "P2740", "text": ["The computer will now fault the power supply circuit on PC130-85A again. h to ON........................................."], "jumps": ["P2730"]}, {"id": "P2730", "text": ["5. Using the CH1 and CH2 probes, vary PC130-290 R1 to ensure that the power supply is now operational. If the power supply is not operating correctly, see your instructor."], "jumps": ["P2740", "P2720"]}, {"id": "P2720", "text": ["The computer will now remove the fault.ault. the PC1 DC switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2700"]}, {"id": "P2710", "text": ["With the sawtooth present on the inverting input and a voltage on the non-inverting input, U1 should have been producing HIGH pulses and it is not."], "jumps": ["P2700", "P2720"]}, {"id": "P2700", "text": ["Congratulations, the problem is a failed comparator circuit."], "jumps": ["P2710", "P2690"]}, {"id": "P2695", "text": ["Measure the output voltage on TP3, there is no voltage. There is fault in the power supply."], "jumps": []}, {"id": "P2694", "text": ["The differential amplifier could cause the problem if the output is always 0 volts, this would cause the output of the comparator to always be LOW. However, the output of the differential amplifier is not zero volts as measured on TP4......."], "jumps": []}, {"id": "P2693", "text": ["The oscillator is not faulted, check the signals at TP7 and TP8. The correct waveforms are present."], "jumps": []}, {"id": "P2692", "text": ["The regulator could be the problem since the output voltage on TP6 and TP3 is zero. However, the input from the comparator (TP2) is always a LOW which explains why the regulator output is 0......"], "jumps": []}, {"id": "P2691", "text": [], "jumps": []}, {"id": "P2690", "text": ["Which block is the most likely to have failed?............."], "jumps": ["P2670"]}, {"id": "P2680", "text": ["4. Use the CH2 probe to measure signals throughout the circuit and determine which block has failed. Don't forget to vary PC130-290 R1!"], "jumps": ["P2670", "P2690"]}, {"id": "P2670", "text": ["The computer will now fault the power supply circuit on PC130-85A.o ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2652"]}, {"id": "P2660", "text": ["If the circuit is not operating correctly, see your instructor."], "jumps": ["P2652", "P2670"]}, {"id": "P2652", "text": ["3. Vary PC130-290 R1 and verify that the power supply circuit is operating correctly, no change on the CH1 trace and a constant DC output at 5 volts."], "jumps": ["P2660", "P2640", "P2655"]}, {"id": "P2650", "text": ["3. Vary PC130-290 R1 and verify that the power supply circuit is operating correctly, no change on the CH1 trace and a constant DC output at 5 volts."], "jumps": ["P2655", "P2640", "P2660"]}, {"id": "P2640", "text": ["1. Remove the CH2 probe, keep the CH1 probe on PC130-85A TP3. 2. Change the source triggering to CH1. You are measuring the output of the power supply."], "jumps": ["P2650", "P2630", "P2645"]}, {"id": "P2630", "text": ["You have seen all the signals in the pulse width modulated power supply and determined that it is working correctly. Now, let's troubleshoot some faults."], "jumps": ["P2620", "P2640"]}, {"id": "P2620", "text": ["The action of R2, C5 and D2 changed the square wave into a sawtooth wave."], "jumps": ["P2610", "P2630"]}, {"id": "P2613", "text": ["Look at the rise and fall times. The wave is not a square wave."], "jumps": []}, {"id": "P2612", "text": ["Look at the rise and fall times. The wave is not a sine wave."], "jumps": []}, {"id": "P2611", "text": [], "jumps": []}, {"id": "P2610", "text": ["What is the basic waveform shown on CH2?..................."], "jumps": ["P2600"]}, {"id": "P2600", "text": ["12. Move the CH2 probe to TP8, change the coupling source to CH2 and adjust the triggering level."], "jumps": ["P2610", "P2590"]}, {"id": "P2590", "text": ["The signal on CH2 is the output of the oscillator constructed from U2E and U2F."], "jumps": ["P2580", "P2600"]}, {"id": "P2583", "text": ["Look at the rise and fall times. The wave is not a sawtooth wave."], "jumps": []}, {"id": "P2582", "text": ["Look at the rise and fall times. The wave is not a sine wave."], "jumps": []}, {"id": "P2581", "text": [], "jumps": []}, {"id": "P2580", "text": ["What is the basic waveform shown on the CH2 trace?........."], "jumps": ["P2570"]}, {"id": "P2570", "text": ["11. Move the CH2 probe to TP7............................."], "jumps": ["P2575", "P2560", "P2580"]}, {"id": "P2560", "text": ["You should be measuring about 10 volts. This is the applied voltage to R8."], "jumps": ["P2550", "P2570"]}, {"id": "P2550", "text": ["9. Return R8 for a 5 volt output as seen on the CH1 trace. 10. Move the CH2 probe to TP9 (DC voltage applied to the reference voltage circuit)."], "jumps": ["P2560", "P2530"]}, {"id": "P2540", "text": ["You should also see the output voltage (CH1 trace for TP3) change. Changing the reference voltage sets the power supply to produce a different output voltage."], "jumps": ["P2530", "P2550"]}, {"id": "P2530", "text": ["Varying R8 changes the reference voltage input to the differential amplifier. You should have seen the value change when viewing the CH2 trace."], "jumps": ["P2520", "P2540"]}, {"id": "P2520", "text": ["7. Move the CH2 probe to TP5. 8. Slightly vary PC130-85A R8."], "jumps": ["P2525", "P2500", "P2530"]}, {"id": "P2510", "text": ["When the output voltage changes, the output of U3 changes. The change in voltage is fed to the comparator so the power supply output remains unchanged, as seen on the CH1 trace."], "jumps": ["P2500", "P2520"]}, {"id": "P2500", "text": ["The differential amplifier subtracts the reference voltage from the sample of the output voltage."], "jumps": ["P2490", "P2510"]}, {"id": "P2492", "text": ["Look at the CH2 trace closely. You should have seen a very small voltage change."], "jumps": []}, {"id": "P2491", "text": [], "jumps": []}, {"id": "P2490", "text": ["\u0000\u0000\u0000incorrect1\u0000\u00001\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000[\u0001\u000f\u0000\u0000\u0000 \u0000\u0011\u0000remained the samee\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000{\u0001\u0010\u0000\u0000\u0000\u0002\u0000\u0002\u0000\u0000\u0000\u0001\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0001\u0000,\u0004\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0084\u0001\u0000\u0000\u00fc\u0000\u00ba\u0004\u0012\u0002\u0091\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u00bb\u0001\u0012\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0014\u0000\u0013\u0000x\u001e\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00d3\u0001\u0013\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00e5\u0001\u0014\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000\u00ff\u0001\u0015\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000#\u0002\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00ba\u0004\u0002\u0000\u0000\u0000V\u0006\u0003\u0000\u0000\u0000t\u0007\u0000", "When the load on the power supply changed, what happened to the output of the differential amplifier?"], "jumps": ["P2480"]}, {"id": "P2480", "text": ["5. Move the CH2 probe to TP4 (output of differential amplifier). Change the input mode to DC. 6. Rotate R1 on PC130-290 clockwise and counterclockwise to change the load on the power supply."], "jumps": ["P2490", "P2410", "P2485"]}, {"id": "P2420", "text": ["With Q1 and Q3 varying the ON time, the average DC voltage output changes to compensate for increasing and decreasing loads as seen on CH1, a constant output voltage."], "jumps": ["P2410", "P2480"]}, {"id": "P2410", "text": ["When the load to the power supply changes, the output of the comparator changes which changes the ON time of Q1 and Q3."], "jumps": ["P2420", "P2400"]}, {"id": "P2402", "text": ["Look at the CH2 trace closely. You should have seen the pulse width changed as the load to the power supply changed."], "jumps": []}, {"id": "P2401", "text": [], "jumps": []}, {"id": "P2400", "text": ["\u0000\u0000\u0000incorrect1\u0000\u00001\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000[\u0001\u000f\u0000\u0000\u0000 \u0000\u0002\u0000Norst Choiceett\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000q\u0001\u0010\u0000\u0000\u0000\u0001\u0000\u0001\u0000\u0000\u0000,\u0004\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000z\u0001\u0000\u0000\u00fc\u0000\u00ba\u0004\u0012\u0002\u0087\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u00b1\u0001\u0012\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0014\u0000\u0013\u0000x\u001e\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00c9\u0001\u0013\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00db\u0001\u0014\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000\u00f5\u0001\u0015\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0019\u0002\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00ba\u0004\u0002\u0000\u0000\u0000V\u0006\u0003\u0000\u0000\u0000t\u0007\u0000\u0000\u0000\u0000\u0000\u00003\u0002\u0017\u0000\u0000", "Did the pulse width of the signal seen on CH2 change when the power supply load was changed (rotation of PC130-290 R1)?"], "jumps": ["P2390"]}, {"id": "P2390", "text": ["4. While observing the two traces, rotate R1 on PC130-290 clockwise and counterclockwise. R1 changes the load on the power supply."], "jumps": ["P2400", "P2380", "P2395"]}, {"id": "P2380", "text": ["3. Place the CH2 probe on PC130-85A TP2. Set the oscilloscope input to AC and adjust the oscilloscope as necessary. Separate the two channels so that you can observe both traces. It may be necessary to change the triggering to CH2."], "jumps": ["P2385", "P2370", "P2390"]}, {"id": "P2370", "text": ["1. Keep the CH1 probe on PC130-85A TP3 (power supply output). 2. Set the oscilloscope to dual channel operation and a TIME/DIV setting of 2 microseconds."], "jumps": ["P2360", "P2380"]}, {"id": "P2360", "text": ["Now you know the power supply is operating correctly (no change in output voltage when the load changed). Let's measure the circuit's signals to confirm proper operation."], "jumps": ["P2350", "P2370"]}, {"id": "P2353", "text": ["Look closely at the oscilloscope, you should have not seen the output voltage decrease."], "jumps": []}, {"id": "P2352", "text": ["Look closely at the oscilloscope, you should have not seen the output voltage increase."], "jumps": []}, {"id": "P2351", "text": [], "jumps": []}, {"id": "P2350", "text": ["What was the effect on the power supply's output voltage when the load was increased and decreased?"], "jumps": ["P2340"]}, {"id": "P2340", "text": ["10. On PC130-290, rotate R1 clockwise and counterclockwise while observing the output voltage on the oscilloscope (TP3 on PC130-85A). Rotating R1 changes the load on the power supply."], "jumps": ["P2330", "P2350"]}, {"id": "P2330", "text": ["At this point, the power supply card is set to produce 5 volts to the PC130-290 load card. Let's see if the regulator circuit is operating correctly."], "jumps": ["P2320", "P2340"]}, {"id": "P2325", "text": ["EXPERIMENT CARD PC130-85A - Set S1 to DC and rotate R8 to mid position. Set S5 through S9 down Set S3 to the left Set S4 to up (IN) Rotate R1 to mid position"], "jumps": []}, {"id": "P2320", "text": ["Display - CH1 Volts/Div - DC2 Coupling - + circuit. r instructor.", "Setting R8 changes the reference voltage to the regulator circuit. r instructor.", "8. Using the oscilloscope to measure DC voltage, measure the voltage on PC130-85A TP3 (power supply output). 9. On PC130-85A, set R8 for a 5 volt DC measurement. R8 changes the reference voltage to the regulator circuit."], "jumps": ["P2325", "P2310", "P2330"]}, {"id": "P2310", "text": ["The LED just below R1 on the PC130-290 card should be illuminated. If not, see your instructor.", "7. Place the PC1 DC POWER switch to ON. The LED just below R1 on the PC130-290 card should be illuminated. If not, see your instructor."], "jumps": ["P2300"]}, {"id": "P2300", "text": ["6. Set the Voltmeter switch to Positive. Set the Positive Supply Voltage to 15. The Test Console's voltage meter should read 15 volts."], "jumps": ["P2290"]}, {"id": "P2295", "text": ["EXPERIMENT CARD PC130-290 - Set S1 and S2 up Set S5 through S9 down Set S3 to the left Set S4 to up (IN) Rotate R1 to mid position"], "jumps": []}, {"id": "P2290", "text": ["S1 down S2 up S3 to the left S4 to up or IN S5 through S9 down R1 to mid position", "4. Insert PC130-290 into the PC2 position. 5. Set the card controls as follows: S1 Down S2 Up S3 to the left S4 to UP or IN S5 through S9 to down ..."], "jumps": ["P2295", "P2280"]}, {"id": "P2285", "text": ["EXPERIMENT CARD PC130-85A - Set S1 to DC and rotate R8 to mid position."], "jumps": []}, {"id": "P2280", "text": ["2. Insert PC130-85A into the PC1 position. 3. Set S1 to DC and R8 to mid position on the card. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2285", "P2270"]}, {"id": "P2270", "text": ["1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2260"]}, {"id": "P2260", "text": ["Let's start the experiment.e..............................."], "jumps": ["P2250", "P2270"]}, {"id": "P2250", "text": ["L1 and C4 make up the filter (L1 is the large black component in the center of the card). The final output of the power supply is measured at TP3."], "jumps": ["P2255", "P2240", "P2260"]}, {"id": "P2240", "text": ["The filter circuit produces a pure DC output..............."], "jumps": ["P2250", "P2232"]}, {"id": "P2232", "text": ["The input is measured at TP2 and the output is measured at TP6. R12, Q2 and D7 make up the current protector circuit."], "jumps": ["P2240", "P2220", "P2235"]}, {"id": "P2230", "text": ["The input is measured at TP2 and the output is measured at TP6. R12, Q2 and D7 make up the current protector circuit."], "jumps": ["P2240", "P2220", "P2235"]}, {"id": "P2220", "text": ["In this regulator, Q1 and Q3 are used. Q3 is turned ON by the output of the comparator (low current device) which turns Q1 ON (higher current device)."], "jumps": ["P2230", "P2210", "P2225"]}, {"id": "P2210", "text": ["The regulator circuit produces the pulse width modulated signal. The current sensor circuit protects the regulator."], "jumps": ["P2220", "P2200"]}, {"id": "P2200", "text": ["U1 is the comparator and its output is measured at TP2. Locate U1 on the card."], "jumps": ["P2210", "P2190", "P2205"]}, {"id": "P2190", "text": ["The comparator compares the differential voltage to the sawtooth voltage which turns the regulator ON and OFF."], "jumps": ["P2200", "P2182"]}, {"id": "P2182", "text": ["D2 shorts R2 to produce the quick fall time when the square wave is zero. The sawtooth is measured at TP8."], "jumps": ["P2185", "P2150", "P2190"]}, {"id": "P2180", "text": ["D2 shorts R2 to produce the quick fall time when the square wave is zero. The sawtooth is measured at TP8."], "jumps": ["P2185", "P2172", "P2190"]}, {"id": "P2172", "text": ["R2 and C5 form a RC time constant that produces the rise time of the sawtooth. D2 is reverse biased when the square wave is positive."], "jumps": ["P2175", "P2150", "P2180"]}, {"id": "P2170", "text": ["R2 and C5 form a RC time constant that produces the rise time of the sawtooth. D2 is reverse biased when the square wave is positive."], "jumps": ["P2175", "P2162", "P2180"]}, {"id": "P2162", "text": ["U2E and U2F along with C2 and R4 make up a square wave oscillator. U2A through U2D are inverters being used as buffers. The square wave is measured at TP7. 7."], "jumps": ["P2165", "P2150", "P2170"]}, {"id": "P2160", "text": ["U2E and U2F along with C2 and R4 make up a square wave oscillator. U2A through U2D are inverters being used as buffers. The square wave is measured at TP7."], "jumps": ["P2165", "P2150", "P2170"]}, {"id": "P2150", "text": ["U2 is a chip containing inverters which, along with other components, devise an oscillator."], "jumps": ["P2155", "P2140", "P2160"]}, {"id": "P2140", "text": ["The oscillator block produces the sawtooth wave............"], "jumps": ["P2150", "P2130"]}, {"id": "P2130", "text": ["U3 is the differential amplifier. The output is measured at TP4. Locate U3 on the card."], "jumps": ["P2140", "P2120", "P2135"]}, {"id": "P2120", "text": ["The differential amplifier inputs are a reference voltage and a sample of the circuit's output voltage."], "jumps": ["P2130", "P2110"]}, {"id": "P2110", "text": ["D3 is a voltage regulator and R8 sets the level for the reference voltage, measured at TP5. Locate R8 on the card."], "jumps": ["P2115", "P2100", "P2120"]}, {"id": "P2100", "text": ["The reference voltage block produces the reference voltage for the Differential Amplifier."], "jumps": ["P2110", "P2092"]}, {"id": "P2092", "text": ["D4 and D5 form a full wave rectifier when an AC input voltage is used. C8 is a filter capacitor, it is the large capacitor on the card, 1000 MFD."], "jumps": ["P2100", "P2080", "P2095"]}, {"id": "P2090", "text": ["D4 and D5 form a full wave rectifier when an AC input voltage is used. C8 is a filter capacitor, it is the large capacitor on the card, 1000 MFD.", "MEASUREMENT SETUP - Set the Input switch to DC."], "jumps": ["P2100", "P2080", "P2095"]}, {"id": "P2080", "text": ["You will use the DC input by setting the Input switch to DC. TP1 measures the DC input to the regulator which is +15 volts for this experiment."], "jumps": ["P2090", "P2050", "P2085"]}, {"id": "P2070", "text": ["The input circuit has both AC and DC inputs."], "jumps": ["P2080", "P2050"]}, {"id": "P2062", "text": ["Let's look at the schematic of each block. Compare the block, schematic and card."], "jumps": ["P2070", "P2050", "P2065"]}, {"id": "P2060", "text": ["Let's look at the schematic of each block. Compare the block, schematic and card."], "jumps": ["P2065", "P2050", "P2070"]}, {"id": "P2050", "text": ["The card has eight blocks that make up the circuit........."], "jumps": ["P2060", "P2040"]}, {"id": "P2040", "text": ["PC130-85A is the pulse width modulated power supply........"], "jumps": ["P2030", "P2050"]}, {"id": "P2030", "text": ["PC130-290 is used as a load to the power supply. The load can be varied so that you can see the action of the regulator."], "jumps": ["P2020", "P2040"]}, {"id": "P2020", "text": ["In this experiment you will study the operation of a pulse width modulated power supply using an oscilloscope."], "jumps": ["P2030", "P2001"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1960", "P1001"]}, {"id": "P1990", "text": ["8. The time that U1 produces a HIGH determines how long Q1 is ON. This determines the level of the output voltage."], "jumps": ["P1999", "P1960"]}, {"id": "P1980", "text": ["7. The comparator compares a sawtooth signal with the differential signal. The output is HIGH only when the differential signal is larger than the sawtooth signal."], "jumps": ["P1960", "P1990"]}, {"id": "P1970", "text": ["6. The differential amplifier produces a voltage proportional to the difference between the reference voltage and the circuits output voltage."], "jumps": ["P1980", "P1960"]}, {"id": "P1960", "text": ["5. This circuit is an example of how an oscillator (U2), differential amplifier (U3) and comparator (U1) are used."], "jumps": ["P1970", "P1950"]}, {"id": "P1950", "text": ["4. By varying Q1's ON time, a constant output voltage is maintained."], "jumps": ["P1940", "P1960"]}, {"id": "P1940", "text": ["3. The basic switching regulator produces pulses with different widths to produce an average DC output."], "jumps": ["P1950", "P1920"]}, {"id": "P1930", "text": ["2. The rectifier and filter blocks use common circuits. The regulator circuit is different."], "jumps": ["P1920", "P1940"]}, {"id": "P1920", "text": ["1. The basic block diagram of a switching power supply is very similar to a linear power supply block diagram."], "jumps": ["P1001", "P1930"]}, {"id": "P1910", "text": ["This completes the information on PWM SWITCHING POWER SUPPLY."], "jumps": ["P1710", "P1001"]}, {"id": "P1720", "text": ["In fact, it is pretty easy once you know that Q1 is turned OFF and ON producing pulses which are filtered to a pure DC output voltage."], "jumps": ["P1710", "P1910"]}, {"id": "P1710", "text": ["As you have seen, the operation of a pulse width modulated power supply is not that complex."], "jumps": ["P1720", "P1620"]}, {"id": "P1700", "text": ["Diode D1 prevents the output of U1 from interfering with Q2 and keeps Q2 ON after Q1 is turned OFF."], "jumps": ["P1620", "P1710"]}, {"id": "P1690", "text": ["This action turns Q1 OFF. The regulator does not produce an output."], "jumps": ["P1620", "P1700"]}, {"id": "P1680", "text": ["When Q2 turns ON, the emitter to collector resistance becomes LOW and shorts Q1's emitter to base circuit."], "jumps": ["P1620", "P1690"]}, {"id": "P1670", "text": ["However, if the current in the circuit increases, the voltage drop across R3 becomes large enough to turn Q2 ON."], "jumps": ["P1620", "P1680"]}, {"id": "P1660", "text": ["In this condition, the regulator operates as described."], "jumps": ["P1620", "P1670"]}, {"id": "P1650", "text": ["Normally, the difference in potential across R3 is very small and does not bias Q2 ON."], "jumps": ["P1620", "P1660"]}, {"id": "P1640", "text": ["R3 is a current sensing resistor. It has a very low ohmic value, around 1 to 2 ohms."], "jumps": ["P1620", "P1650"]}, {"id": "P1630", "text": ["The purpose of the circuit is to protect the regulator from an overload current condition; such as a shorted load on the output."], "jumps": ["P1620", "P1640"]}, {"id": "P1620", "text": ["Finally, let's see how the R3, Q2 and D1 circuit operates.."], "jumps": ["P1630", "P1610"]}, {"id": "P1613", "text": ["An increase in output voltage increases the inverting input to U3 which decreases its output. However, a decreased input to U1's non-inverting input does not increase the HIGH output time or lengthen Q1's ON time........"], "jumps": []}, {"id": "P1612", "text": ["An increase in output voltage increases the inverting input to U3 which decreases its output. This does not increase the amount of time that U1 produces a HIGH output or lengthen Q1's ON time......"], "jumps": []}, {"id": "P1611", "text": [], "jumps": []}, {"id": "P1610", "text": ["U3 OUTPUT U1 HIGH TIME Q1 ON TIMEEE", "What is the result in the circuit if the output voltage increases? OUTPUT U1 HIGH TIME Q1 ON TIME"], "jumps": ["P1600"]}, {"id": "P1603", "text": ["A decrease in output voltage decreases the inverting input to U3 which increases its output. This does not decrease the amount of time that U1 produces a HIGH output or shorten Q1's ON time....."], "jumps": []}, {"id": "P1602", "text": ["A decrease in output voltage decreases the inverting input to U3 which increases its output. This does not decrease the amount of time that U1 produces a HIGH output....."], "jumps": []}, {"id": "P1601", "text": [], "jumps": []}, {"id": "P1600", "text": ["U3 OUTPUT U1 HIGH TIME Q1 ON TIMEEE", "Increases Increases Longer", "What is the result in the circuit if the output voltage decreases? OUTPUT U1 HIGH TIME Q1 ON TIME"], "jumps": ["P1572"]}, {"id": "P1590", "text": ["The regulator circuit maintains a constant output voltage by varying the ON time of Q1."], "jumps": ["P1600", "P1572"]}, {"id": "P1580", "text": ["With Q1 not ON as much, the average filtered DC voltage drops, compensating for the rise in output voltage."], "jumps": ["P1572", "P1590"]}, {"id": "P1575", "text": ["Inverting Input Non - inverting Input Turns Q1 on and off", "COMPARATOR OPERATION - The output of a comparator is HIGH only when the non-inverting input is higher than the inverting input. Since the inverting input is constant, it takes less time for the sawtooth signal to go above the non-inverting input voltage. This keeps the output of the comparator HIGH for a shorter period of time which decreases Q1's pulse width."], "jumps": []}, {"id": "P1572", "text": ["A decreasing signal to the non-inverting input of U1 causes the HIGH output time to decrease, shortening the ON time of Q1."], "jumps": ["P1580", "P1550", "P1575"]}, {"id": "P1570", "text": ["A decreasing signal to the non-inverting input of U1 causes the HIGH output time to decrease, shortening the ON time of Q1."], "jumps": ["P1580", "P1562", "P1575"]}, {"id": "P1565", "text": ["DIFFERENTIAL AMPLIFIER - A differential amplifier operates by subtracting the voltage on the inverting input from the voltage on the non-inverting input. If the voltage on the inverting input increases when the voltage on the non-inverting input stays the same, the output voltage decreases. A larger voltage is subtracted."], "jumps": []}, {"id": "P1562", "text": ["The increased inverting input causes the output of U3 to decrease."], "jumps": ["P1570", "P1550", "P1565"]}, {"id": "P1560", "text": ["The increased inverting input causes the output of U3 to decrease."], "jumps": ["P1565", "P1550", "P1570"]}, {"id": "P1550", "text": ["Now, if the output voltage increases due to a decreased load, the inverting input to U3 increases."], "jumps": ["P1560", "P1532"]}, {"id": "P1540", "text": ["With Q1 ON longer, the filtered output voltage increases, compensating for the decrease in output voltage."], "jumps": ["P1532", "P1550"]}, {"id": "P1535", "text": ["Inverting Input Non - inverting Input Turns Q1 on and off", "COMPARATOR OPERATION - The output of a comparator is HIGH only when the non-inverting input is higher than the inverting input. Since the inverting input is constant, it takes longer for the sawtooth signal to go above the non-inverting input voltage. This keeps the output of the comparator HIGH for a longer period of time which increases Q1's output pulse width."], "jumps": []}, {"id": "P1532", "text": ["This causes the output of U1 to remain HIGH longer (more of the sawtooth signal is below the non-inverting input value)."], "jumps": ["P1540", "P1512", "P1535"]}, {"id": "P1530", "text": ["This causes the output of U1 to remain HIGH longer (more of the sawtooth signal is below the non-inverting input value)."], "jumps": ["P1535", "P1512", "P1540"]}, {"id": "P1520", "text": ["The increasing voltage is applied to the non-inverting input of U1."], "jumps": ["P1530", "P1512"]}, {"id": "P1515", "text": ["DIFFERENTIAL AMPLIFIER - A differential amplifier operates by subtracting the voltage on the inverting input from the voltage on the non-inverting input. If the voltage on the inverting input decreases when the voltage on the non-inverting input stays the same, the output voltage increases. A smaller voltage is subtracted."], "jumps": []}, {"id": "P1512", "text": ["With the inverting input decreasing, the output of U3 increases."], "jumps": ["P1520", "P1490", "P1515"]}, {"id": "P1510", "text": ["With the inverting input decreasing, the output of U3 increases."], "jumps": ["P1515", "P1490", "P1520"]}, {"id": "P1500", "text": ["When the voltage from L1 and C1 decreases, the voltage to U3's inverting input decreases."], "jumps": ["P1490", "P1510"]}, {"id": "P1490", "text": ["Let's see what happens if the output voltage decreases due to a load increase."], "jumps": ["P1500", "P1460"]}, {"id": "P1480", "text": ["It is this signal (the difference between the reference voltage and the output voltage) that determines how long Q1 is ON or OFF (the pulse width output of Q1)."], "jumps": ["P1460", "P1490"]}, {"id": "P1470", "text": ["U3 takes the reference voltage and subtracts a sample of the output voltage."], "jumps": ["P1460", "P1480"]}, {"id": "P1460", "text": ["Notice that the output voltage of U3 determines the time that U1 produces a HIGH output."], "jumps": ["P1470", "P1360"]}, {"id": "P1450", "text": [], "jumps": ["P1360", "P1460"]}, {"id": "P1440", "text": ["When the rising voltage of the sawtooth wave exceeds the non-inverting input voltage, the output of U1 goes LOW."], "jumps": ["P1360", "P1450"]}, {"id": "P1430", "text": [], "jumps": ["P1360", "P1440"]}, {"id": "P1420", "text": ["As long as the non-inverting input to U1 is larger than the sawtooth wave on the inverting input, U1 produces a high output."], "jumps": ["P1360", "P1430"]}, {"id": "P1410", "text": ["The non-inverting input to U1 is from U3, a differential amplifier."], "jumps": ["P1360", "P1420"]}, {"id": "P1400", "text": ["It is important to note that a sawtooth wave has a slow rise time and a fast fall time."], "jumps": ["P1360", "P1410"]}, {"id": "P1390", "text": ["U2 is an oscillator circuit that produces a sawtooth wave which is applied to the inverting input of U1, a comparator."], "jumps": ["P1360", "P1400"]}, {"id": "P1380", "text": ["Q1 is turned on and off by the action of U1, U2 and U3."], "jumps": ["P1360", "P1390"]}, {"id": "P1370", "text": ["Q1 is turned ON and OFF producing pulses. The pulse width determines the average DC voltage through the filter circuit of L1 and C1."], "jumps": ["P1360", "P1380"]}, {"id": "P1360", "text": ["Let's look at the basic circuit used in the experiment....."], "jumps": ["P1370", "P1330"]}, {"id": "P1350", "text": ["To fully understand the operation, it's better to study a typical example of a discrete component circuit."], "jumps": ["P1330", "P1360"]}, {"id": "P1340", "text": ["This has increased their popularity and lowered the cost."], "jumps": ["P1330", "P1350"]}, {"id": "P1330", "text": ["Most pulse width modulated regulators are packaged in IC chips."], "jumps": ["P1340", "P1320"]}, {"id": "P1323", "text": ["The value of the output voltage alone does not set the ON/OFF time of Q1."], "jumps": []}, {"id": "P1322", "text": ["The value of the reference voltage alone does not set the ON/OFF time of Q1."], "jumps": []}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1320", "text": ["The difference between the reference voltage and the DC output voltage.", "What determines if Q1 is ON or OFF?........................"], "jumps": ["P1310"]}, {"id": "P1313", "text": ["Through the action of the filter, the output voltage will not stay the same if Q1 stays ON for a longer period of time."], "jumps": []}, {"id": "P1312", "text": ["Through the action of the filter, the output voltage will not decrease if Q1 stays ON for a longer period of time."], "jumps": []}, {"id": "P1311", "text": [], "jumps": []}, {"id": "P1310", "text": ["If Q1's ON time increases, what happens to the output voltage?"], "jumps": ["P1280"]}, {"id": "P1300", "text": ["This is regulation by pulse width modulation!"], "jumps": ["P1280", "P1310"]}, {"id": "P1290", "text": ["Q1 changes the pulse width of its output which changes the filter's average output voltage, compensating for any load changes."], "jumps": ["P1280", "P1300"]}, {"id": "P1280", "text": ["In other words, any increase in the load will try to lower the output voltage, which will increase the pulse width, bringing the voltage back up."], "jumps": ["P1290", "P1210"]}, {"id": "P1270", "text": ["With Q1 ON more of the time, the output voltage through the filter is raised."], "jumps": ["P1210", "P1280"]}, {"id": "P1260", "text": ["If the filtered DC voltage is less than the reference voltage, Q1 is ON more than it is OFF."], "jumps": ["P1210", "P1270"]}, {"id": "P1250", "text": ["With Q1 OFF more of the time, the output voltage through the filter is lowered."], "jumps": ["P1210", "P1260"]}, {"id": "P1240", "text": ["If the filtered DC voltage is the same or larger than the reference voltage, Q1 is turned OFF more than it is turned ON."], "jumps": ["P1210", "P1250"]}, {"id": "P1230", "text": ["In the switching circuit, the sample DC voltage is compared to a reference voltage which changes the ON time of Q1."], "jumps": ["P1210", "P1240"]}, {"id": "P1220", "text": ["A sample of the filtered DC voltage is applied to the switching circuit."], "jumps": ["P1210", "P1230"]}, {"id": "P1210", "text": ["Regulating the output voltage is also simple..............."], "jumps": ["P1220", "P1200"]}, {"id": "P1203", "text": ["When the pulse width decreases, the spacing between the pulses increases which effects the output voltage, it does not stay the same."], "jumps": []}, {"id": "P1202", "text": ["When the pulse width decreases, the spacing between the pulses increases which tends to lower the average voltage."], "jumps": []}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1200", "text": ["In a pulse width modulated regulator, as the pulse width decreases, what happens to the output voltage?"], "jumps": ["P1190"]}, {"id": "P1190", "text": ["In other words, the regulator operates using pulse width, this is where the name pulse width modulated regulator or power supply comes from."], "jumps": ["P1200", "P1180"]}, {"id": "P1180", "text": ["If Q1's output pulses are wide, the filtered DC voltage is HIGH, or the average voltage of the pulses produce a higher voltage."], "jumps": ["P1170", "P1190"]}, {"id": "P1170", "text": ["For example, if Q1's output pulses are narrow, the filtered DC voltage is LOW, or the average voltage of the pulses produce a low voltage."], "jumps": ["P1120", "P1180"]}, {"id": "P1160", "text": ["Which, in turn, depends on how long Q1 is ON. The switching circuit determines how long Q1 is ON (which sets the pulse width)."], "jumps": ["P1120", "P1170"]}, {"id": "P1150", "text": ["The voltage level of the filtered DC output depends on the pulse width of Q1's output."], "jumps": ["P1120", "P1160"]}, {"id": "P1140", "text": ["The resulting output pulses of Q1 are then filtered to produce a pure DC voltage. Filtering is easier because the pulses are switched at high frequencies."], "jumps": ["P1120", "P1150"]}, {"id": "P1130", "text": ["The operation is really quite simple, Q1 is turned on and off at a high frequency by the switching circuit."], "jumps": ["P1120", "P1140"]}, {"id": "P1120", "text": ["Now, let's look at a basic pulse width modulated switching regulator that uses a series voltage regulator, Q1."], "jumps": ["P1130", "P1110"]}, {"id": "P1113", "text": ["The component size does not relate to efficiency..........."], "jumps": []}, {"id": "P1112", "text": ["Although the components in a switching power supply are smaller, component size does not relate to efficiency."], "jumps": []}, {"id": "P1111", "text": [], "jumps": []}, {"id": "P1110", "text": ["The regulator transistor is either completely ON, or completely OFF.", "What makes a switching power supply more efficient?........"], "jumps": ["P1100"]}, {"id": "P1103", "text": ["The filter is not placed before the rectifier in any type of power supply."], "jumps": []}, {"id": "P1102", "text": ["A switching power supply does not have a filter after the rectifier."], "jumps": []}, {"id": "P1101", "text": [], "jumps": []}, {"id": "P1100", "text": ["In a switching power supply, where is the filter placed?..."], "jumps": ["P1080"]}, {"id": "P1090", "text": ["There are many types of switching regulators, but they all operate about the same. Pulse width modulated regulators are the type covered in this lesson."], "jumps": ["P1080", "P1100"]}, {"id": "P1080", "text": ["The regulator circuit of the switching power supply is not at all like the one in a linear power supply."], "jumps": ["P1060", "P1090"]}, {"id": "P1060", "text": ["The filter circuits used are standard circuits............."], "jumps": ["P1050", "P1080"]}, {"id": "P1050", "text": ["Standard circuits such as half wave, full wave and bridge circuits are used as the rectifier circuit."], "jumps": ["P1020", "P1060"]}, {"id": "P1040", "text": [], "jumps": ["P1020", "P1050"]}, {"id": "P1030", "text": ["The AC input voltage, usually 60 Hz, is applied to the rectifier."], "jumps": ["P1020", "P1040"]}, {"id": "P1025", "text": ["The only difference between them is the regulator switches ON and OFF, and the filter is placed after the regulator to produce a pure DC output."], "jumps": ["P1020", "P1030"]}, {"id": "P1020", "text": ["The basic block diagram of a switching power supply is very similar to that of a linear power supply."], "jumps": ["P1001", "P1025"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P480", "text": ["Let's begin the lesson on PWM SWITCHING POWER SUPPLY......................"], "jumps": ["P450"]}, {"id": "P470", "text": ["The regulator transistor dissipates less heat because it is either completely OFF (0 current, hence no power dissipation) or completely ON (low collector-emitter voltage, hence low power dissipation)."], "jumps": ["P450", "P480"]}, {"id": "P460", "text": ["The filter components used in the switching power supply are smaller and weigh less because of the higher frequency."], "jumps": ["P450", "P470"]}, {"id": "P450", "text": ["Switching power supplies use a regulator transistor that is switched completely ON and OFF at a high frequency."], "jumps": ["P460", "P430"]}, {"id": "P440", "text": ["The conduction of the regulator transistor in a linear power supply is varied to maintain a constant DC output voltage."], "jumps": ["P430", "P450"]}, {"id": "P430", "text": ["Because a linear power supply converts 60 Hz power to DC, the filter components are large. These components are compared to those used in a switching power supply."], "jumps": ["P440", "P400"]}, {"id": "P420", "text": ["They are more efficient, smaller in size and weigh less than linear power supplies."], "jumps": ["P400", "P430"]}, {"id": "P410", "text": ["Switching power supplies are one of the fastest growing methods of power conversion."], "jumps": ["P400", "P420"]}, {"id": "P400", "text": ["In this lesson you will learn the theory and operation of switching power supplies."], "jumps": ["P300", "P410"]}, {"id": "P331", "text": [], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P100", "text": ["w Describe a pulse width modulated switching power supply circuit. w Measure signals in a pulse width modulates switching power supply circui let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
