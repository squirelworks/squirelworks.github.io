orbs all energy from the transmitter so that it doesn't leave the antenna.", "This inductive load absorbs all energy from the transmitter so that it doesn't leave the antenna.", "This resistive load absorbs all energy from the transmitter so that it doesn't leave the antenna.", "This reactive load absorbs all energy from the transmitter so that it doesn't leave the antenna."], "jumps": []}, {"id": "P10224", "text": ["Theoretically, a waveguide of a specific width has no _______"], "jumps": []}, {"id": "P10223", "text": ["What is the point in a waveguide called where the metallic insulators become too large and eliminate the bus bar?"], "jumps": []}, {"id": "P10222", "text": ["What is the result of improper waveguide joining or obstructions in waveguides?"], "jumps": []}, {"id": "P10221", "text": ["Which dimension determines the power handling capability of a waveguide?"], "jumps": []}, {"id": "P10220", "text": ["What is the physical handling and installation of waveguides called? _"], "jumps": []}, {"id": "P10219", "text": ["Which dimension determines the frequency range of a waveguide?"], "jumps": []}, {"id": "P10218", "text": ["In a waveguide, as the frequency increases, the bus bar _______"], "jumps": []}, {"id": "P10217", "text": ["In a waveguide, as the frequency increases, the metallic insulator _______"], "jumps": []}, {"id": "P10216", "text": ["Which of the below statements is a disadvantage of a waveguide?"], "jumps": []}, {"id": "P10215", "text": ["What type of loss describes the effect of the heating of the insulator between conductors? u"], "jumps": []}, {"id": "P10214", "text": ["What type of loss describes the effect of current flowing only on the surface of the conductor?"], "jumps": []}, {"id": "P10213", "text": ["What type of loss describes electromagnetic energy escaping the conductor? e"], "jumps": []}, {"id": "P10212", "text": ["Which type of transmission line has the largest surface area given the same physical dimensions?"], "jumps": []}, {"id": "P10211", "text": ["difference in potential between two points"], "jumps": []}, {"id": "P10210", "text": ["A waveguide is defined as a system of material boundaries, capable of guiding _______"], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu..uuuu"], "jumps": []}, {"id": "P2984", "text": ["9. Slots, also known as windows or apertures, are an option when very loose coupling is required. Energy enters the waveguide through a small slot in the wall. The E-field expands into the waveguide. Minimum reflections occur provided the slot is tuned to the frequency of the energy."], "jumps": []}, {"id": "P2982", "text": ["8. Another way of injecting or coupling energy in a waveguide is by setting up an H-field. This is accomplished by inserting a small loop of wire that has a high current handling capacity into the waveguide."], "jumps": []}, {"id": "P2980", "text": ["7. The most efficient place to locate a probe is in the center of the A wall, 1/4 from the shorted end of the waveguide. At this point, the probe will couple the maximum strength of the E-field."], "jumps": []}, {"id": "P2970", "text": ["6. Combining the E-type and H-type T-junctions results in a hybrid junction called the Magic-T. The Magic-T is a balanced mixer found at the input of RADAR receivers."], "jumps": []}, {"id": "P2960", "text": ["5. In E-type, if two out-of-phase signals are applied, the third arm will produce an output equivalent to the summation of the two inputs. In-phase signals applied to any two arms will result in a cancellation of the two signals and the third arm will have no output."], "jumps": []}, {"id": "P2950", "text": ["4. A waveguide may also be terminated in a resistive load that is matched to the characteristic impedance of the waveguide. The resistive load is often called a dummy load because its only purpose is to absorb all the energy in the waveguide and prevent standing waves."], "jumps": []}, {"id": "P2940", "text": ["3. The impedance characteristics of a waveguide do not match the impedance of space (air) and any abrupt change in impedance causes standing waves. However, when the change is gradual at the end of a waveguide, no standing waves form."], "jumps": []}, {"id": "P2930", "text": ["2. Irises are used to provide impedance matching by introducing inductance or capacitance into the waveguide. An IRIS is a metal diaphragm located within the waveguide. It contains openings (called windows or apertures) through which waves may pass.ay pass.."], "jumps": []}, {"id": "P2920", "text": ["1. The maximum transfer of electrical energy takes place when the source impedance is matched to the load impedance. Impedance Matching is critical in waveguide applications to prevent standing waves.ng waves....."], "jumps": ["P2001"]}, {"id": "P2910", "text": ["This completes the information on WAVEGUIDE COMPONENTS....."], "jumps": ["P2650", "P2001"]}, {"id": "P2650", "text": ["Whenever a rectangular waveguide is connected to a rotating antenna, a rotating joint must be used. A circular waveguide is normally used in a rotating joint, as rotating a rectangular wave could cause field pattern distortions..."], "jumps": []}, {"id": "P2640", "text": ["The outer surfaces require even less maintenance. Just insure that the joints remain tight and that the waveguides are not damaged."], "jumps": ["P2612", "P1910"]}, {"id": "P2630", "text": ["Keep the inner surfaces clean and free from nicks, scratches and foreign objects. Also, keep the inner surfaces dry. Moisture can cause shorts."], "jumps": ["P2612", "P1690"]}, {"id": "P2620", "text": ["Once waveguides are installed, maintaining them is easy."], "jumps": ["P2612", "P1680"]}, {"id": "P2618", "text": ["The two signals (the incident wave (or original wave) and the reflected wave) combine to produce a wave that does not move, a standing wave. Standing waves can never be completely eliminated. However, low standing wave ratios can be achieved."], "jumps": []}, {"id": "P2617", "text": ["Standing waves are produced when part of the signal in the waveguide is reflected back to the source."], "jumps": []}, {"id": "P2616", "text": ["Standing waves reduce the output power that is delivered to the antenna and are measured in ratios. VSWR is voltage standing wave ratio, ISWR is current standing wave ratio, SWR is expressed as a ratio of the maximum value of the current or voltage in the standing wave. A ratio of 1 indicates no standing wave.o standing wave.............."], "jumps": []}, {"id": "P2615", "text": ["STANDING WAVES - Standing waves are produced by impedance mismatches between sections, obstructions in a waveguide, and misaligned waveguide sections."], "jumps": []}, {"id": "P2612", "text": ["The joining of waveguide sections is important. Improper joints, or obstructions in the waveguide, cause standing waves."], "jumps": ["P2600", "P2620"]}, {"id": "P2610", "text": ["The joining of waveguide sections is important. Improper joints, or obstructions in the waveguide, cause standing waves."], "jumps": ["P1650", "P2620"]}, {"id": "P2600", "text": ["They may be permanently joined by welding or semi-permanently joined by using nut and bolt sets."], "jumps": ["P1640"]}, {"id": "P2590", "text": ["These sections of waveguides, along with straight sections, are joined together into one piece."], "jumps": ["P2570"]}, {"id": "P2580", "text": ["They consist of a wound ribbon of conductive material. Power losses are high because the inner surfaces are not perfectly smooth."], "jumps": ["P1620"]}, {"id": "P2570", "text": ["Flexible waveguides allow special bends which may be required in some cases."], "jumps": ["P1610"]}, {"id": "P2560", "text": ["Twists should be at least 2 wavelengths long to prevent reflections.."], "jumps": ["P2540"]}, {"id": "P2550", "text": ["Reflections caused in the first 45 degree bend are cancelled out by reflections caused in the second. The net effect is the same as if no reflection had occurred at all."], "jumps": ["P1590"]}, {"id": "P2540", "text": ["If a sharp bend is required, it should be in two 45 degree bends, one quarter wavelength apart."], "jumps": ["P1580"]}, {"id": "P2530", "text": ["Bends may be in either the \"a\" dimension or the \"b\" dimension, as long as they are at least 2 in length."], "jumps": ["P2480"]}, {"id": "P2520", "text": ["Waveguide sections come in a variety of shapes to fit most needs. Bends, twists and flexible waveguide sections are the most common."], "jumps": ["P2480"]}, {"id": "P2510", "text": ["Waveguides must be connected together and must go around objects."], "jumps": ["P2480"]}, {"id": "P2500", "text": ["It is unlikely that a single piece of straight waveguide can be used to connect electronic circuits to the antenna."], "jumps": ["P2480"]}, {"id": "P2490", "text": ["Consequently, the bending, twisting, joining and installation of waveguides is commonly called waveguide plumbing."], "jumps": []}, {"id": "P2480", "text": ["The physical handling and installation of waveguides have many similarities to ordinary plumbing."], "jumps": []}, {"id": "P2470", "text": ["Slots, also known as windows or apertures, are an option when very loose coupling is required. Energy enters the waveguide through a small slot in the wall. The E-field expands into the waveguide. Minimum reflections occur provided the slot is tuned to the frequency of the energy..."], "jumps": ["P2430"]}, {"id": "P2460", "text": ["Increasing loop diameter will increase the power transfer capability and bandwidth.the magnetic field is greatest. When loose coupling is desired, the loop is rotated until it encircles a smaller number of H-field lines.s covered in another lesson.l and an IF of the opposite polarity across the other crystal..."], "jumps": []}, {"id": "P2450", "text": ["For the most efficient coupling, the loop is inserted at one of several points where the magnetic field is greatest. When loose coupling is desired, the loop is rotated until it encircles a smaller number of H-field lines.s covered in another lesson.l and an IF of the opposite polarity across the other crystal..."], "jumps": []}, {"id": "P2440", "text": ["A magnetic field of H-lines builds up around the loop and expands to the waveguide edges. If the frequency of the current in the loop is within the bandwidth of the waveguide, energy will transfer into the waveguide.tion is covered in another lesson.l and an IF of the opposite polarity across the other crystal..."], "jumps": []}, {"id": "P2430", "text": ["Another way of injecting or coupling energy in a waveguide is by setting up an H-field. This is accomplished by inserting a small loop of wire that has a high current handling capacity into the waveguide...."], "jumps": ["P2390"]}, {"id": "P2420", "text": ["The size and shape of the probe determines its frequency, bandwidth, and power-handling capability. As the diameter of the probe increases, the bandwidth of frequencies and power-handling increases...ive) tubes operation is covered in another lesson.l and an IF of the opposite polarity across the other crystal..."], "jumps": []}, {"id": "P2410", "text": ["The most efficient place to locate a probe is in the center of the \"A\" wall, 1/4 l from the shorted end of the waveguide. At this point, the probe will couple the maximum strength of the E-field..ceive) tubes operation is covered in another lesson.l and an IF of the opposite polarity across the other crystal..."], "jumps": []}, {"id": "P2400", "text": ["A probe, when inserted into a waveguide and supplied with microwave energy, acts similar to an antenna. Current flows in the probe and sets up the E-field. Note: Explanation of the TR (Transmit-Receive) tubes operation is covered in another lesson.l and an IF of the opposite polarity across the other crystal..."], "jumps": []}, {"id": "P2390", "text": ["Special devices are required to couple energy into and out of a waveguide. There are three devices commonly used for this purpose: Probes, Loops and Slots."], "jumps": ["P2380"]}, {"id": "P2384", "text": ["The hybrid ring is used as a duplexer in RADAR systems....."], "jumps": []}, {"id": "P2382", "text": ["The Magic-T MIXcombines the inputs from the local oscillator with the received echo signal.", "The Magic-T mixer, combines the inputs from the local oscillator with the received echo signal from the duplexer."], "jumps": []}, {"id": "P2381", "text": [], "jumps": []}, {"id": "P2380", "text": ["The balanced hybrid crystal (Magic-T) is found at the input of the RADAR _______ and is used as a _________", "transmitter, duplexerabsorbs some energy from the transmitter so that it doesn't leave the antenna."], "jumps": ["P2370"]}, {"id": "P2372", "text": ["The dummy load absorbs energy and dissipates it in the form of heat. A mixture of graphite, sand or a resistive rod is used for the dummy load."], "jumps": []}, {"id": "P2371", "text": [], "jumps": []}, {"id": "P2370", "text": ["This reactive load absorbs some energy from the transmitter so that it doesn't leave the antenna.", "This resistive load absorbs all energy from the transmitter so that it doesn't leave the antenna.", "This inductive load absorbs all energy from the transmitter so that it doesn't leave the antenna...", "This capacitive load absorbs some energy from the transmitter so that it doesn't leave the antenna.", "What is the purpose of the Dummy Load?....................."], "jumps": ["P2330"]}, {"id": "P2360", "text": ["During reception, the echo comes in at arm 1, splits and moves around the ring in both directions. As it reaches arems 2 and 4, the potential is insufficient to fire the TR tube therefore the signal passes to the receiver down those arms.ther lesson.l and an IF of the opposite polarity across the other crystal..."], "jumps": []}, {"id": "P2350", "text": ["As the high power signal passes arms 2 and 4 the TR tubes fire, preventing the transmit signal from taking that path and damaging the receiver. The signals meet out-of-phase at arm 1 and proceed to the antenna. operation is covered in another lesson.l and an IF of the opposite polarity across the other crystal..."], "jumps": []}, {"id": "P2340", "text": ["During the transmit cycle, energy from the transmitter enters arm 3 and is split; half the signal moves clockwise while the other half goes counterclockwise. Note: Explanation of the TR (Transmit-Receive) tubes operation is covered in another lesson.l and an IF of the opposite polarity across the other crystal..."], "jumps": []}, {"id": "P2330", "text": ["Another type of hybrid junction, principally used as a duplexer in high power RADAR systems, is the Hybrid Ring. Its operation is based on the E-type T-junction theory.esult in No Output from the third arm..."], "jumps": []}, {"id": "P2320", "text": ["When the two signals of different polarity from the crystal diodes are applied to the balanced output transformer, they will add. Outputs of the same polarity will cancel across the transformer.al (IF - 0.030 GHz) of one polarity across one crystal and an IF of the opposite polarity across the other crystal..."], "jumps": []}, {"id": "P2310", "text": ["Because of the phase relationships of the echo and local oscillator signals, one crystal diode will see two signals in-phase and the other will see two signal out-of-phase. This creates and IF signal (IF - 0.030 GHz) of one polarity across one crystal and an IF of the opposite polarity across the other crystal..."], "jumps": []}, {"id": "P2300", "text": ["Local Oscillator output (fo + IF - 8.030 GHz) enters the H-arm, splits into two in-phase signals and ends up at the crystal diodes.lanced transformer. The secondary of the transformer is tuned to the IF frequency (30 MHz or 60 MHz)..."], "jumps": []}, {"id": "P2290", "text": ["The crystals, located 1/4 l from their respective short-circuited waveguide ends, are at a point to provide maximum voltage to the balanced transformer. The secondary of the transformer is tuned to the IF frequency (30 MHz or 60 MHz)..."], "jumps": []}, {"id": "P2280", "text": ["A returning object echo (fo- 8.0 GHz) travels through the antenna, duplexer and waveguide to the E-plane arm of the Magic-T and encounter two crystal diodes. the waveguide with a graphite or sand mixture..."], "jumps": []}, {"id": "P2270", "text": ["Combining the E-type and H-type T-junctions results in a hybrid junction called the Magic-T. The Magic-T is a balanced mixer found at the input of a duplexer and at the input of RADAR receivers...e third arm..."], "jumps": []}, {"id": "P2260", "text": ["In H-type, if two in-phase signals are applied to any two arms the third arm produces an output. Out-of-phase signals applied to any two arms will cancel each other and result in no output from the third arm..."], "jumps": []}, {"id": "P2250", "text": ["With an input applied only at arm A or arm C an output will occur at the other two arms."], "jumps": []}, {"id": "P2240", "text": ["In-phase signals input to arms A and C combine and produce and output signal at arm B. Out-of-phase signals input to arms A and C cancel resulting in no output at arm B."], "jumps": []}, {"id": "P2230", "text": ["An H-type T-junction's name comes from the fact that the B arm extends from the waveguide parallel to the planes of the H-lines (magnetic). An input signal applied to arm B will produce equal amplitude in-phase outputs at arms A and C.."], "jumps": []}, {"id": "P2220", "text": ["In E-type, if two out-of-phase signals are applied, the third arm will produce an output equivalent to the summation of the two inputs. In-phase signals applied to any two arms will result in a cancellation of the two signals and the third arm will have no output..."], "jumps": []}, {"id": "P2210", "text": ["When a signal is applied to only one arm of an E-type junction, the result will be two out-of-phase signals at the other two arms."], "jumps": []}, {"id": "P2200", "text": ["When two out-of-phase signals are input to arms A and C, the boundary conditions necessary to produce and output from arm B is satisfied. The output will be a summation of the input signals at arm B...."], "jumps": []}, {"id": "P2190", "text": ["When two in-phase signals are input to arms A and C, the boundary conditions necessary to produce and output from arm B is not satisfied. Only positive potential is felt at arm B cancelling the two signals resulting in no output..."], "jumps": []}, {"id": "P2180", "text": ["An E-type T-junction's name comes from the fact that the B arm extends perpendicular to surface of the waveguide making it look like a T. An input signal applied to arm B will produce two out-of-phase signals at arms A and C..."], "jumps": []}, {"id": "P2170", "text": ["The operation of T-junctions is based upon the required boundary conditions and existence of electric fields generated by the input signals. Remember that H-lines or magnetic lines always accompany the electric lines or E-lines..."], "jumps": []}, {"id": "P2160", "text": ["Waveguide junctions are used to direct one RF signal to multiple components. T-Junctions are the simplest, of which there are two basic categories: E-Type and H-Type."], "jumps": ["P2120"]}, {"id": "P2150", "text": ["In some cases, all energy must be reflected from the end of the waveguide. The best method to accomplish this is to permanently weld a metal plate at one end of the waveguide.d in the center of the E-field to dissipate the energy as a power loss, in the form of heat."], "jumps": []}, {"id": "P2140", "text": ["When the RF energy fields enter the mixture, they induce a current flow in the mixture, which dissipates the energy as heat. Another method is to use a high resistance rod placed in the center of the E-field to dissipate the energy as a power loss, in the form of heat."], "jumps": []}, {"id": "P2130", "text": ["There is no place in a waveguide to connect a fixed termination resistor; therefore, several types of fixed devices are used. One method is to fill the end of the waveguide with a graphite or sand mixture..."], "jumps": []}, {"id": "P2120", "text": ["A waveguide may also be terminated in a resistive load that is matched to the characteristic impedance of the waveguide. The resistive load is often called a Dummy Load because its only purpose is to absorb all the energy in the waveguide and prevent standing waves..."], "jumps": []}, {"id": "P2110", "text": ["The E-plane sectoral horn changes the vertical plane and the H-plane sectoral changes the horizontal plane. The pyramid horn is a combination of the E-plane and the H-plane, changing both the vertical and horizontal planes."], "jumps": []}, {"id": "P2100", "text": ["Gradual terminating or ending the waveguide with a funnel-shaped HORN can obtain changes in impedance. The type of horn used depends upon the frequency and desired radiation pattern..."], "jumps": []}, {"id": "P2090", "text": ["The impedance characteristics of a waveguide do not match the impedance of space (air) and any abrupt change in impedance causes standing waves. However, when the change is gradual at the end of a waveguide, no standing waves form..."], "jumps": []}, {"id": "P2080", "text": ["The capactive-inductive iris forms an equivalent LC circuit across the line. At resonance, the iris places a high shunt resistance across the waveguide. Above or below resonance, the iris acts as a capacitive or inductive reactance..."], "jumps": []}, {"id": "P2070", "text": ["The capacitive iris, places a shunt capacitive reactance across the line. The wider the opening, the higher the capacitive reactance."], "jumps": []}, {"id": "P2060", "text": ["The Inductive Iris places a shunt inductive reactance across the line. The wider the opening, the higher the inductive reactance.."], "jumps": ["P2040"]}, {"id": "P2050", "text": ["Irises are used to provide impedance matching by introducing inductance or capacitance into the waveguide. An IRIS is a metal diaphragm located within the waveguide. It contains openings (called window or apertures) though which waves may pass..."], "jumps": []}, {"id": "P2040", "text": ["Impedance changing devices are introduced near the sources of reflected waves to match the Z to the Z . These devices produce a standing wave ratio (SWR) nearly equal to unity. is reflected back towards the transmitter.."], "jumps": []}, {"id": "P2030", "text": ["When a waveguide is not terminated in Z , the energy traveling from the transmitter to the antenna is not completely absorbed by the load (antenna). Energy not absorbed by the load is reflected back towards the transmitter.."], "jumps": []}, {"id": "P2020", "text": ["The maximum transfer of electrical energy takes place when the source impedance is matched to the load impedance. Impedance Matching is critical in waveguide applications to prevent damaging standing waves.."], "jumps": ["P2001", "P2030"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": []}, {"id": "P1990", "text": ["8. The maximum and most efficient transfer of electromagnetic energy takes place when the source impedance is matched to the load impedance. Impedance Matching is critical in waveguide applications to prevent standing waves."], "jumps": []}, {"id": "P1980", "text": ["7. Energy is transferred throughout the transmission line by electromagnetic fields. The interaction of the magnetic (H Field) and electric (E Field) fields causes energy to travel through the waveguide..............."], "jumps": []}, {"id": "P1970", "text": ["6. The \"a\" dimension determines frequency range and the \"b\" dimension determines power capability."], "jumps": ["P1960", "P1980"]}, {"id": "P1960", "text": ["5. Waveguides are basically a two wire transmission line that has an infinite number of quarter wave shorted insulators."], "jumps": ["P1970", "P1920"]}, {"id": "P1950", "text": ["4. Waveguides are not normally used for lower frequencies because of the size restrictions."], "jumps": ["P1920", "P1960"]}, {"id": "P1940", "text": ["3. Waveguides have the least amount of radiation, copper and dielectric losses which makes them well suited for conducting microwave frequencies."], "jumps": ["P1920", "P1950"]}, {"id": "P1930", "text": ["2. Waveguides are manufactured from conductive materials and may be rectangular, circular or elliptical in shape."], "jumps": ["P1920", "P1940"]}, {"id": "P1920", "text": ["1. A waveguide is defined as a system of material boundaries, capable of guiding electromagnetic energy."], "jumps": ["P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on WAVEGUIDE THEORY........."], "jumps": ["P1850"]}, {"id": "P1852", "text": ["Standing wave ratio is defined as the output divided by the input, or the Emax divided by the Emin."], "jumps": []}, {"id": "P1851", "text": [], "jumps": []}, {"id": "P1850", "text": ["The Voltage Standing Wave Ratio (VSWR) is the ratio of _______ voltage to ________voltage on a line."], "jumps": ["P1840"]}, {"id": "P1843", "text": ["The H-field is related to magnetic lines created by current passing through the conductor.", "Magnetic Fields On A Two Wire Line Half-Wave Frames"], "jumps": []}, {"id": "P1842", "text": ["The E-field is referenced to a difference in electrical potential."], "jumps": []}, {"id": "P1841", "text": [], "jumps": []}, {"id": "P1840", "text": ["The strength of the H-field is indicated by the number of H-lines in a given area and varies directly with the amount of _______"], "jumps": ["P1830"]}, {"id": "P1832", "text": ["The E-field is reference to the surface of the earth. Two conductors must be parallel to each other for an E-field to exist. E-lines are perpendicular to the conductors."], "jumps": []}, {"id": "P1831", "text": [], "jumps": []}, {"id": "P1830", "text": ["The E-field boundary states that for an electric field to exist at the surface of a conductor, it must be _______ to the conductor."], "jumps": ["P1820"]}, {"id": "P1820", "text": ["The Voltage Standing Wave Ratio (VSWR) is the ratio of maximum voltage to minimum voltage on a line. Since there is always a small loss on a line, the minimum voltage is never zero and the VSWR is always some finite value..."], "jumps": []}, {"id": "P1810", "text": ["The measurement of standing waves on a waveguide yields information about equipment operating conditions. Maximum power is absorbed by the load when Z = Z . If a line has no standing waves, the termination of the line is correct."], "jumps": []}, {"id": "P1800", "text": ["An excellent means of determining waveguide condition is to measure the Standing Wave Ratio (SWR) of the transmission line. Taking the ratio of maximum voltage to minimum voltage at any point on that line does this..."], "jumps": []}, {"id": "P1790", "text": ["When R is less than Z the termination appears as a short circuit. Notice the standing waves terminate in a current peak and a voltage minimum. The peak voltage and current values approach those for a shorted line as the value of R approaches zero."], "jumps": []}, {"id": "P1780", "text": ["When R is greater than Z the current is minimum (not zero) at the end of the line and maximum at the odd 1/4 , points. Since R consumes part of the power in the incident wave, the standing wave amplitude is less than the open-ended line.ed line..."], "jumps": []}, {"id": "P1770", "text": ["When R is greater than Z the end of the line is like an open circuit; that is, standing waves appear on the line. Voltage maximum appears at the end of the line and also at 1/2 intervals back from the end...the end..."], "jumps": []}, {"id": "P1760", "text": ["Whenever the termination is not equal to Z reflections occur on the line. For example, if the terminating element contains resistance it absorbs some energy, but if the resistive element does not equal Z of the line, some of the energy is reflected.."], "jumps": []}, {"id": "P1750", "text": ["In a line terminated in a short circuit, the voltage is zero at the end and maximum at 1/4 , from the end. The current is maximum at the end, zero at 1/4 , from the end, and alternately maximum and zero every 1/4 , thereafter.thereafter.thereafter.thereafter..."], "jumps": []}, {"id": "P1740", "text": ["In an open-circuited RF line, the voltage is zero at a distance of 1/4 , from the end of the line. This is true at any frequency. A voltage peak occurs at the end of the line, at 1/2 , from the end, and at each 1/2 , thereafter..thereafter....reafter.thereafter..."], "jumps": []}, {"id": "P1730", "text": ["In an open-circuited RF line, the voltage is maximum at the end, but the current is minimum. The distance between the two adjacent zero current points are 1/2 and the distance between alternate zero current points is 1 . symbol)ambda symbol)))"], "jumps": []}, {"id": "P1720", "text": ["If there are losses in the line, the amplitude of the voltage and current will diminish as they move down the line. The losses are due to DC resistance in the line itself."], "jumps": ["P1710", "P1730"]}, {"id": "P1710", "text": ["Termination in Z (Characteristic Impedance) will cause a constant reading on an AC meter when it is moved along the length of the transmission line provided there are no losses in the line.."], "jumps": ["P1700"]}, {"id": "P1708", "text": ["The two signals (the incident wave (or original wave) and the reflected wave) combine to produce a wave that does not move, a standing wave. Standing waves can never be completely eliminated. However, low standing wave ratios can be achieved."], "jumps": []}, {"id": "P1707", "text": ["Standing waves are produced when part of the signal in the waveguide is reflected back to the source."], "jumps": []}, {"id": "P1706", "text": ["Standing waves reduce the output power that is delivered to the antenna and are measured in ratios. VSWR is voltage standing wave ratio, ISWR is current standing wave ratio, SWR is expressed as a ratio of the maximum value of the current or voltage in the standing wave. A ratio of 1 indicates no standing wave.o standing wave.............."], "jumps": []}, {"id": "P1705", "text": ["STANDING WAVES - Standing waves are produced by impedance mismatches between sections, obstructions in a waveguide, and misaligned waveguide sections."], "jumps": []}, {"id": "P1700", "text": ["The maximum and most efficient transfer of electromagnetic energy takes place when the source impedance is matched to the load impedance. Impedance Matching is critical in waveguide applications to prevent Standing Waves..."], "jumps": ["P1710"]}, {"id": "P1690", "text": ["Since an E-field causes current flow that in turn produces an H-field, both fields always exist at the same time in a waveguide."], "jumps": []}, {"id": "P1680", "text": ["The H-field boundary states that for a varying magnetic field to exist, it must form closed loops in parallel with the conductors and perpendicular to the electric field."], "jumps": []}, {"id": "P1670", "text": ["Electromagnetic energy traveling through a waveguide must meet certain E-field and H-field boundary conditions. The E-field boundary states that for an electric field to exist at the surface of a conductor, it must be perpendicular to the conductor..."], "jumps": []}, {"id": "P1660", "text": ["A cross-sectional view of the magnetic field pattern in a waveguide indicates the field is strongest at the edges of the waveguide where the current is the highest. The minimum field strength occurs at the zero current points. Note: 95903301 Lsn 5, Fig 15 Page 5-1000", "Magnetic Field In A Waveguide Three Half Wavelengths Long"], "jumps": []}, {"id": "P1650", "text": ["H-lines will form complete loops at half-wave intervals with each group reversed in direction in a waveguide closed at both ends and three half-wave lengths long."], "jumps": []}, {"id": "P1640", "text": ["The current in the individual loops off the main line are opposite in direction. All around the framework the magnetic lines join to form a long single continuous loop. Note, no magnetic field exists outside of the waveguide because the loops cannot join together...", "Magnetic Fields On A Two Wire Line Half-Wave Frames"], "jumps": ["P1620"]}, {"id": "P1630", "text": ["At half-wave intervals on the main line, current will flow in opposite directions. This produces H-line loops having opposite directions. Current at the left end is opposite current at the right end..."], "jumps": []}, {"id": "P1620", "text": ["In a two-wire transmission line with quarter-wave length sections, the current direction produces the individual H-lines around each conductor. When multiple sections exist, the fields cancel between the sections but the directions are the same both inside and outside waveguide..", "Magnetic Fields On A Two Wire Line Half-Wave Frames"], "jumps": []}, {"id": "P1610", "text": ["All of the H-lines associated with current are collectively called a magnetic field or H-field. The strength of the H-field is indicated by the number of H-lines in a given area and varies directly with the amount of current...", "Magnetic Fields On A Two Wire Line Half-Wave Frames"], "jumps": ["P1590"]}, {"id": "P1600", "text": ["Magnetic Fields On A Two Wire Line Half-Wave Frames", "The magnetic field in a waveguide is made up of magnetic lines of force that are caused by current flowing through the conducting material of the waveguide. Magnetic lines of force, called H-lines, are continuous closed loops..."], "jumps": []}, {"id": "P1590", "text": ["Half-wave frame 2 has zero voltage and no E-field present. Frame 4, is located between the maximum and minimum voltage and shows a weak E-field."], "jumps": []}, {"id": "P1580", "text": ["The voltage across the two-wire line varies in a sine wave pattern and the density of the E-field also varies in a sine wave pattern. Half-wave frames 1 and 3 have the highest voltage and strongest E-field..."], "jumps": ["P1530"]}, {"id": "P1570", "text": ["mes 1 and 3 have the highest voltage and strongest E-field...", "The E-field in a waveguide can be illustrated by a two-wire transmission line separated by several, double quarter-wave length sections, called half-wave frames."], "jumps": ["P1530"]}, {"id": "P1560", "text": ["The evenly spaced arrows indicate that the field is evenly distributed. For ease of explanation, the electric field is abbreviated E field, and the lines of stress are called E lines."], "jumps": ["P1530"]}, {"id": "P1550", "text": ["Arrows that point from the positive toward the negative potential represent electric fields in a waveguide. The number of arrows indicates the relative strength of the field."], "jumps": ["P1530"]}, {"id": "P1540", "text": ["An electric field exists when a difference of potential causes stress in the dielectric between two points. The simplest electric field is the one that forms between to plates of a capacitor when one plate is more positive than the other..."], "jumps": []}, {"id": "P1530", "text": ["Energy is transferred throughout the transmission line by electromagnetic fields. The interaction of the magnetic (H Field) and electric (E Field) fields causes energy to travel through the waveguide..."], "jumps": []}, {"id": "P1522", "text": ["The \"b\" dimension determines the power handling capability."], "jumps": []}, {"id": "P1521", "text": [], "jumps": []}, {"id": "P1520", "text": ["Which dimension determines the frequency range in waveguides?"], "jumps": ["P1510"]}, {"id": "P1513", "text": ["The main difference between two-wire lines and coaxial lines is that the coaxial line has the second conductor surrounding the first conductor. This does not reduce dielectric losses.."], "jumps": []}, {"id": "P1512", "text": ["The main difference between two-wire lines and coaxial lines is that the coaxial line has the second conductor surrounding the first conductor. This does not reduce copper losses.."], "jumps": []}, {"id": "P1511", "text": [], "jumps": []}, {"id": "P1510", "text": ["Why are coaxial lines more efficient than two-wire lines?.."], "jumps": ["P1460"]}, {"id": "P1500", "text": ["Recall that the distance between the conductors determines the power handling capability. The \"b\" dimension is the distance between the conductors (bus bars) that are located in the \"a\" dimension."], "jumps": ["P1460", "P1510"]}, {"id": "P1490", "text": ["The other dimension determines the power handling capability of the waveguide. It is called the \"b\" dimension."], "jumps": ["P1460", "P1500"]}, {"id": "P1480", "text": ["Waveguide 1 operates at a higher frequency than waveguide 2. Remember, the higher the frequency, the smaller the wavelength and the \"a\" dimension."], "jumps": ["P1460", "P1490"]}, {"id": "P1470", "text": ["The width is called the \"a\" dimension. This dimension contains the conductors."], "jumps": ["P1460", "P1480"]}, {"id": "P1460", "text": ["As you have seen, the width of the waveguide is important. It determines the range of operating frequencies."], "jumps": ["P1400", "P1470"]}, {"id": "P1455", "text": ["Too low a frequency causes the bus bar to vanish and the RF energy is not passed down the waveguide. This is called the cutoff frequency."], "jumps": ["P1400", "P1460"]}, {"id": "P1450", "text": ["The lower frequency is passed down the waveguide."], "jumps": ["P1400", "P1455"]}, {"id": "P1440", "text": ["When the frequency decreases, the metallic insulators become larger. The bus bar becomes smaller."], "jumps": ["P1400", "P1450"]}, {"id": "P1435", "text": ["Theoretically, waveguides do not have an upper frequency limit. However, in practice, theoretical maximums cannot be achieved and there is an upper frequency limit.."], "jumps": ["P1400", "P1440"]}, {"id": "P1430", "text": ["The higher frequency is passed down the waveguide."], "jumps": ["P1400", "P1435"]}, {"id": "P1420", "text": ["As the frequency increases, /4 decreases. Since the waveguide has a fixed width, this effectively means that the bus bar becomes wider."], "jumps": ["P1400", "P1430"]}, {"id": "P1410", "text": ["Between the two metallic insulators is a section called the BUS BAR (similar to a conducting wire)."], "jumps": ["P1400", "P1420"]}, {"id": "P1400", "text": ["Part of the waveguide width is used as two metallic insulators that are one quarter wavelength."], "jumps": ["P1375", "P1410"]}, {"id": "P1390", "text": ["A waveguide has a bandwidth. Let's see how."], "jumps": ["P1375", "P1400"]}, {"id": "P1385", "text": ["The transmission line can pass more than just one frequency, reducing radiation, copper and dielectric losses."], "jumps": ["P1375", "P1390"]}, {"id": "P1380", "text": ["During the change from a two wire line to a waveguide, some of the characteristics of transmission are changed."], "jumps": ["P1375", "P1385"]}, {"id": "P1375", "text": ["A waveguide is like a two-wire transmission line with metallic insulators placed so closely that they are in contact, forming a continuous piece of metal."], "jumps": ["P1380", "P1350"]}, {"id": "P1370", "text": ["This limits the bandwidth, efficiency and application of this type of transmission line."], "jumps": ["P1350", "P1375"]}, {"id": "P1360", "text": ["The only disadvantage is that the quarter wave section is only an insulator at one specific frequency. It also has losses as described before."], "jumps": ["P1350", "P1370"]}, {"id": "P1350", "text": ["Metallic insulators may be placed anywhere along the two wire line, even on both sides of the same points."], "jumps": ["P1320", "P1360"]}, {"id": "P1340", "text": ["At microwave frequencies, the quarter wave section makes a good insulator..as long as the length of the insulator is 1/4 wavelength."], "jumps": ["P1320", "P1350"]}, {"id": "P1330", "text": ["The impedance of a shorted quarter wave section is very high at the open end junction, points A and B.", "IMPEDANCE OF A SHORTED TRANSMISSION LINE"], "jumps": ["P1320", "P1340"]}, {"id": "P1320", "text": ["Two-Wire Transmission Lineeeeeeeeeeeeeeee", "A better transmission system uses metallic insulators. A metallic insulator is a pair of sections of conductor that are / 4 (one quarter wavelength) long, connected directly to the transmission line on one end and shorted to each other on the other end."], "jumps": ["P1325", "P1270", "P1330"]}, {"id": "P1310", "text": ["At microwave frequencies, the transmission line, insulator and ground act as a capacitor with low impedance. Remember, as frequency increases, Xc decreases."], "jumps": ["P1270", "P1320"]}, {"id": "P1300", "text": ["Low impedance insulators would ground the signals on the transmission lines."], "jumps": ["P1270", "P1310"]}, {"id": "P1290", "text": ["From the view point of the line, the insulators must present a very high impedance to ground."], "jumps": ["P1270", "P1300"]}, {"id": "P1280", "text": ["This two-wire transmission line is supported on two insulators (plastic, porcelain or similar material)."], "jumps": ["P1270", "P1290"]}, {"id": "P1270", "text": ["The way that a waveguide works can be better understood by comparison with the way that a two wire transmission line works."], "jumps": ["P1260", "P1280"]}, {"id": "P1262", "text": ["Current does produce electromagnetic fields; however, the waveguide transfers electromagnetic energy or waves."], "jumps": []}, {"id": "P1261", "text": [], "jumps": []}, {"id": "P1260", "text": ["\u0000\u0000\u0000incorrect1\u0000\u0000/\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000Y\u0001\u000f\u0000\u0000\u0000 \u0000\u0007\u0000currenttoiceett\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000y\u0001\u0010\u0000\u0000\u0000\u0002\u0000\u0002\u0000\u0000\u0000\u0001\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0001\u0000,\u0004\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0082\u0001\u0000\u0000\u00fa\u0000\u00ba\u0004\u0012\u0002\u008f\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u00b9\u0001\u0012\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0014\u0000\u0013\u0000x\u001e\u0000\u0000\u0019\u0000\u001a\u0000\u00e5c\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00d1\u0001\u0013\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00e3\u0001\u0014\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000\u00fd\u0001\u0015\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000!\u0002\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00ba\u0004\u0002\u0000\u0000\u0000V\u0006\u0003\u0000\u0000\u0000t", "Waveguides allow what type of energy to be transferred from one point to another?"], "jumps": ["P1250"]}, {"id": "P1253", "text": ["Dielectric losses are due to heating of the insulator between conductors. Waveguides do not have a center conductor."], "jumps": []}, {"id": "P1252", "text": ["Copper losses are due to the small surface area of the conductor at high frequencies. Waveguides have large surface areas."], "jumps": []}, {"id": "P1251", "text": [], "jumps": []}, {"id": "P1250", "text": ["Which of the below is not an advantage of a waveguide?....."], "jumps": ["P1230"]}, {"id": "P1240", "text": ["The physical dimensions required of a waveguide make the use of this type of transmission line impractical below approximately 1 GHz."], "jumps": ["P1230", "P1250"]}, {"id": "P1230", "text": ["Velocity = 186,000 miles/sec or 983,196,000 ft/sec cccccccccccccccccccity/frequency) Velocity = 186,000 miles/sec or 983,196,000 ft/sec", "(velocity/frequency) Velocity = 186,000 miles/sec or 983,196,000 ft/secccccccccccc,000 miles/sec or 983,196,000 ft/sec", "Waveguide Width = l/2 (wavelength/2) Wavelength = V/", "(velocity/frequency) Velocity = 186,000 miles/sec or 983,196,000 ft/sec", "A waveguide used at 1 MHz would have to be about 490 feet wide. At 200 MHz its width would be 2 1/2 feet and at 10 GHz the width would be less than 1 inch wide."], "jumps": ["P1210", "P1240"]}, {"id": "P1220", "text": ["However, for proper operation of a waveguide, its width must be approximately half a wavelength."], "jumps": ["P1210", "P1230"]}, {"id": "P1210", "text": ["In view of the advantages of waveguide transmission lines, it would appear that the waveguide should be the only type of transmission line used."], "jumps": ["P1220", "P1190"]}, {"id": "P1200", "text": ["A waveguide with the same dimensions as a coaxial cable can handle more than twice the power."], "jumps": ["P1190", "P1210"]}, {"id": "P1190", "text": ["The power handling capabilities of a transmission medium are directly related to the distance between the conductors. In a coaxial cable, the distance is slightly less than half the diameter of the cable, while in a waveguide it is equal to the full width of the opening..Power is a function of E2/Zo and E is limited by the distance between conductors."], "jumps": ["P1170", "P1200"]}, {"id": "P1180", "text": ["Also, the power handling capability of a waveguide is greater than that of a two-wire line or coaxial cable.."], "jumps": ["P1170", "P1190"]}, {"id": "P1170", "text": ["Waveguides do not have a center conductor. This results in less dielectric loss...ses."], "jumps": ["P1180", "P1150"]}, {"id": "P1160", "text": ["The higher the frequency, the more heating and the more losses."], "jumps": ["P1150", "P1170"]}, {"id": "P1150", "text": ["Dielectric losses are due to the heating of the insulator between the conductors."], "jumps": ["P1140", "P1160"]}, {"id": "P1140", "text": ["Waveguides have a much larger surface area than two wire lines and coaxial cables, therefore, less copper losses."], "jumps": ["P1150", "P1120"]}, {"id": "P1130", "text": ["At microwave frequencies, the current tends to flow only on the outer surfaces of the conductor, reducing the area of the conductor. c"], "jumps": ["P1120", "P1140"]}, {"id": "P1120", "text": ["Copper losses depend on the conducting area of the transmission line. The more area, the less loss."], "jumps": ["P1080", "P1130"]}, {"id": "P1110", "text": ["However, other losses affect coaxial cables at microwave frequencies. These losses also affect two-wire transmission lines."], "jumps": ["P1080", "P1120"]}, {"id": "P1100", "text": ["End View of Two-Wire Transmission Linee", "The coaxial cable has one conductor in the center of the second conductor. This confines the electromagnetic energy between the conductors making coaxial cables more efficient."], "jumps": ["P1080", "P1110"]}, {"id": "P1090", "text": ["The electromagnetic field is not confined. It radiates in all directions which decreases the power available at the antenna."], "jumps": ["P1080", "P1100"]}, {"id": "P1080", "text": ["End View of Two-Wire Transmission Linee", "The two-wire transmission line used for lower frequencies has a high electromagnetic energy loss at microwave frequencies. As frequencies increase, the expanding and collapsing magnetic fields cannot fully return to the conductor, which causes the radiation loss."], "jumps": ["P1090", "P1070"]}, {"id": "P1070", "text": ["Due to the high frequency of microwaves, waveguides are the most effective, and therefore the preferred medium used to transfer microwave RF energy from one point to another."], "jumps": ["P1080", "P1040"]}, {"id": "P1060", "text": ["In this course, you will learn about and use the rectangular waveguide."], "jumps": ["P1040", "P1070"]}, {"id": "P1050", "text": ["Waveguides are manufactured from conductive materials and may be rectangular, circular or elliptical in shape."], "jumps": ["P1040", "P1060"]}, {"id": "P1040", "text": ["In other words, a waveguide is a hollow metal tube or pipe used as a transmission line for electromagnetic fields."], "jumps": ["P1050", "P1030"]}, {"id": "P1030", "text": ["Electromagnetic energy is the field that is produced by current flowing through a conductor."], "jumps": ["P1040", "P1020"]}, {"id": "P1025", "text": ["ELECTROMAGNETIC ENERGY - Electromagnetic energy is the energy associated with electric or magnetic fields. Common examples include radio or television transmissions, which consist of periodic fluctuations, or waves, in electromagnetic fields..."], "jumps": []}, {"id": "P1020", "text": ["A waveguide is defined as a system of material boundaries, capable of guiding electromagnetic energy."], "jumps": ["P1030", "P1001"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P440", "text": ["Let's begin the lesson on WAVEGUIDE THEORY................................"], "jumps": ["P420"]}, {"id": "P430", "text": ["This lesson gives you the basic theory of waveguide operation."], "jumps": ["P420", "P440"]}, {"id": "P420", "text": ["Waveguides must be used to efficiently transfer microwave RF energy."], "jumps": ["P430", "P410"]}, {"id": "P410", "text": ["Conventional methods of transferring RF energy from one point to another produce losses that make them impractical at microwave frequencies."], "jumps": ["P400", "P420"]}, {"id": "P400", "text": ["In this lesson, you will learn about the component that is a microwave conductor."], "jumps let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
