const book = {"title": "93953110", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: ELECTRON TUBE PRINCIPLESasd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": ["# #\" #& \"\"# &\"###2' &2#&.22&# 25--283-.#285255232/238882-.-5:38832222882282-213:22::82-22225:8-33-22282232.22258558.5822385:235:222283538::2585582::2:", "&&#&# #/2.#.& -8 \"#.-&23..22'/.#212&-2258\"588:52", "### ## /# #/&# \" \"/##\"#/&//..#/..&/28.&...&824/&.88-8588..2222858852.28:582228588358282228258.888:825:583.8828::8228828588828583:35558.555.85::88::85588:88:5555::38::85:::5:5:52::85::88::", ":85:855::83:5:5.5:55:855:52.5:5283822242348522...252...2..82/.4..22//2./..##/.8.#&./#&/..##// ##\",##/## #. / /& # ## ## ## ## ## \" #/# ## /# ## #.\" ./ #//###,//.&/#.\"#/.##/./#&/2.&/.../&//....//&2222.2/252.&28.8522582.824828828::255:::5:", "/,,,,,,,,,,,,,/, ,, ,,,,,,6, ,,,6,,, ,,,,,//6//6,,,,/6/,,,/,4/,,/6/4494,,494/6846446/4884664;44;889448489888<8648<<8;44;88988<88948;98<44<;:<44<<8;44<48<<8;48<48<88;48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Identify electron tube operation principles.", "w Identify electron tube configurations. w Identify characteristics of Cathode Ray Tubes CRT). w Identify Cathode Ray Tube (CRT) operating principles..................", "w Identify the purpose of electron tubes. w Describe types, symbols, and characteristics of vacuum tubes, and the function of their elements."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In electronics you have learned the basic laws of current and voltage.  You have learned that current flows in the conductor of a completed circuit.", "In electronics you have learned the basic laws of current and voltage. You have learned that current flows in the conductor of a completed circuit."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Vacuum Tubes seem to violate the basic laws of electronics because electrons flow across a gap, a break in the circuit in which there appears to be no conductor."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["A large part of electronics and the entire field of electron tubes is concerned with the flow and control of these electrons \"across the gap\"."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["Although vacuum tube use is decreasing in today's electronics world, you will still encounter tubes in audio amplifiers, televisions, video games, computer monitors, radar screens and test equipment.", "Although vacuum tube use is decreasing in today's electronics world, you will still encounter tubes in audio amplifiers, televisions, video games, computer monitors, radar screens and test equipment..."], "jumps": ["P440", "P410", "P"]}, {"id": "P440", "text": ["Let's begin the lesson on ELECTRON TUBE PRINCIPLES........................"], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1040", "text": ["Electron Tubes are classified according to the number of electrodes they contain. A diode (di = two, ode = electrode) tube is a two element tube. The electrodes are the cathode and plate. The heater is not counted when classifying an electron tube."], "jumps": ["P1050", "P1001"]}, {"id": "P1050", "text": ["In a diode tube, the two electrodes are the plate (anode) which receives the electrons, and the cathode, which emits the electrons. Even though the cathode voltage is positive, the plate is a larger positive value, allowing electron emission.", "In a diode tube, the two electrodes are the plate (anode) which receives the electrons, and the cathode, which emits the electrons. Even though the cathode voltage is positive, the plate is a larger positive value, allowing electron emission..."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["Under standard room temperature, cathode electrons are not free from the cathode itself."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["The cathode must be subjected to something which will release the free electrons into its surrounding space. The method we will discuss is called Thermal Emission."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["Thermal Emission: when materials are subjected to high temperatures, they are caused to emit electrons. By heating these materials more, the number of free electrons increases. Too much heat can damage a material.", "Thermal Emission: when materials are subjected to high temperatures, they are caused to emit electrons. By heating these materials more, the number of free electrons increases. Too much heat can damage a material..."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["The cathode needs to be made out of material that can handle the heat required to generate large quantities of free electrons. This material is normally Tungsten."], "jumps": ["P1100", "P1070"]}, {"id": "P1100", "text": ["The only problem with tungsten is that it requires too much heat to emit electrons. Tungsten is coated with Thorium oxide. This material not only adds to the life of the cathode, but makes it more efficient.", "The only problem with tungsten is that it requires too much heat to emit electrons. Tungsten is coated with Thorium oxide. This material not only adds to the life of the cathode, but makes it more efficient..."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["Now we require a heater filament to increase the temperature of the cathode. There are two types of heater filaments, directly heated cathode and indirectly heated cathode. The normal operating voltage for a heater is normally 6.3 to 12.6 VAC.", "Now we require a heater filament to increase the temperature of the cathode. There are two types of heater filaments, directly heated cathode and indirectly heated cathode. The normal operating voltage for a heater is normally 6.3 to 12.6 VAC..."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["The directly heated cathode has two major disadvantages. When using DC heater voltages, the potential in the wire is not consistent making the emission of electrons inconsistent. When using AC heater voltages, undesirable variations in emission current (hum) may occur.", "The directly heated cathode has two major disadvantages. When using DC heater voltages, the potential in the wire is not consistent making the emission of electrons inconsistent. When using AC heater voltages, undesirable variations in emission current (hum) may occur..."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["The indirectly heated cathode has a twisted or folded loop of insulated tungsten wire which is inserted into a thin walled, hollow, metal cylinder (which is normally made of nickel)."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["The cylinder, which is normally coated with the same oxide, can now emit electrons when heated. This method eliminates hum because only the heater has current flowing through it. The cathode has the same potential throughout.", "The cylinder, which is normally coated with the same oxide, can now emit electrons when heated. This method eliminates hum because only the heater has current flowing through it. The cathode has the same potential throughout..."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["Current flows from lower potential to higher potential, or cathode to plate. For this to occur, all of the components of the electron tube must be located within an envelope."], "jumps": ["P1170", "P1140"]}, {"id": "P1170", "text": ["An envelope is normally made of glass, or ceramic. The envelope has all of its air drawn out through a vacuum during construction, or replaced with another gas."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["If the air was left in the envelope, the electrons would collide with air molecules and become very inefficient. By drawing a vacuum, the number of collisions is drastically reduced. Also, the air would cause the heating element to burn up.", "If the air was left in the envelope, the electrons would collide with air molecules and become very inefficient. By drawing a vacuum, the number of collisions is drastically reduced. Also, the air would cause the heating element to burn up..."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["What are the two names of the electrodes in an electron tube diode?"], "jumps": ["P1170"]}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1192", "text": ["The Gate is not one of the electrodes of a diode, recall the two electrodes that any electron tube MUST have."], "jumps": []}, {"id": "P1193", "text": ["The Base is not one of the electrodes of a diode, recall the two electrodes that any electron tube MUST have."], "jumps": []}, {"id": "P1200", "text": ["The Triode is another type of electron tube. The triode is the same as the diode with the addition of a control grid. The purpose of the control grid is to control the amount of electron flow between the cathode and the plate.", "The Triode is another type of electron tube. The triode is the same as the diode with the addition of a control grid. The purpose of the control grid is to control the amount of electron flow between the cathode and the plate..."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["A small voltage on the control grid has a large effect on the current to the plate (anode). The control grid in effect controls the resistance of the tube."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["Adding another electrode to the triode would give you the tetrode. The screen grid is the fourth electrode, and it is placed between the plate and control grid."], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["Adding yet another electrode to the tetrode will give you the pentode. The pentode has a suppressor grid which is added between the screen grid and the plate."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["How many electrodes does a Tetrode have?", "How many electrodes does a Tetrode have?..................."], "jumps": ["P1230"]}, {"id": "P1241", "text": [], "jumps": []}, {"id": "P1242", "text": ["A diode has two electrodes.", "A diode has two electrodes................................."], "jumps": []}, {"id": "P1243", "text": ["A triode has three electrodes.", "A triode has three electrodes.............................."], "jumps": []}, {"id": "P1250", "text": ["Since electron tubes do not last as long as the equipment they are used in, they are normally mounted in sockets."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["These sockets are usually numbered in the manner presented below. If you are looking down at the tube, the pins are counted counterclockwise from the guide notch."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["The last type of tube that we are going to discuss is gas-filled tubes. A gas-filled tube has an inert gas injected into it after the air has been removed. When voltage is first applied the gas will oppose current. The dot inside of the schematic symbol indicates if an electron tube is gas-filled or not.", "The last type of tube that we are going to discuss is gas-filled tubes. A gas-filled tube has an inert gas injected into it after the air has been removed. When voltage is first applied the gas will oppose current. The dot inside of the schematic symbol indicates if an electron tube is gas-filled or not..."], "jumps": ["P1280", "P1250"]}, {"id": "P1280", "text": ["As soon as enough voltage is applied, the gas will begin to ionize.  Electrons are torn off the atoms of the gas by electrostatic pressure. These free electrons allow the tube to conduct current.  Because the electrons are not from the cathode, the cathode doesn't need to be heated.", "As soon as enough voltage is applied, the gas will begin to ionize. Electrons are torn off the atoms of the gas by electrostatic pressure. These free electrons allow the tube to conduct current. Because the electrons are not from the cathode, the cathode doesn't need to be heated..."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["As the current continues to increase, the resistance of the tube continues to decrease. This gives you a constant voltage drop. This type of tube is often referred to as a voltage regulator tube."], "jumps": ["P1300", "P1270"]}, {"id": "P1300", "text": ["When voltage is first applied to a gas-filled tube, the gas will _______", "When voltage is first applied to a gas-filled tube, the gas will _________"], "jumps": ["P1270"]}, {"id": "P1301", "text": [], "jumps": []}, {"id": "P1302", "text": ["If the cathode ignited then the electron tube wouldn't work. This would be an undesirable effect."], "jumps": []}, {"id": "P1303", "text": ["This will eventually happen in a gas-filled electron tube, but this isn't what happens when current is first applied."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on ELECTRON TUBES.", "This completes the information on ELECTRON TUBES.LE........"], "jumps": ["P1001", "P1300"]}, {"id": "P1920", "text": ["1.  Electron Tubes are classified according to the number of                 electrodes they contain. A diode (di = two, ode = electrode)             tube is a two element tube.", "1. Electron Tubes are classified according to the number of electrodes they contain. A diode (di = two, ode = electrode) tube is a two element tube."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  All electron tubes must have a plate (anode) and a cathode.            Current flows from the cathode to the plate.", "2. All electron tubes must have a plate (anode) and a cathode. Current flows from the cathode to the plate."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Most electron tubes are directly or indirectly heated. Electron         tube envelopes are either gas-filled or drawn to a vacuum.", "3. Most electron tubes are directly or indirectly heated. Electron tube envelopes are either gas-filled or drawn to a vacuum."], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["4.  A triode is a diode with a control grid added between the                 cathode and the plate (anode).", "4. A triode is a diode with a control grid added between the cathode and the plate (anode).."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  A tetrode is a triode with a screen grid added between the               control grid and the plate.", "5. A tetrode is a triode with a screen grid added between the control grid and the plate."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  A pentode is a tetrode with a suppressor grid added between         the plate and the screen grid.", "6. A pentode is a tetrode with a suppressor grid added between the plate and the screen grid."], "jumps": ["P1999", "P1960"]}, {"id": "P1999", "text": ["You have completed the Summary.  \nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1970"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2040", "text": ["The operation of electron tubes is quite similar to the way some solid state components operate, like the diode, transistor, and the JFET."], "jumps": ["P2050", "P2001"]}, {"id": "P2050", "text": ["Let's talk about the operation of each of the following electron tubes, and the advantages and disadvantages of their use."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["As with solid state diodes, in electron tube diodes current flows in one direction, cathode to plate (anode) or negative to positive. In fact, this type of diode was the first rectifier."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["With this basic understanding of the diode, we can move on to the other types of electron tubes. As you will see, each of the other types work off the principles of the diode with enhanced operation."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["Triode\n    \nAs you learned, the triode is a diode with another electrode added in between the cathode and the plate. This new electrode is called the control grid.", "Triode As you learned, the triode is a diode with another electrode added in between the cathode and the plate. This new electrode is called the control grid."], "jumps": ["P2090", "P2060"]}, {"id": "P2090", "text": ["The purpose of the control grid is to control the amount of electron flow between the cathode and the plate."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["Physically, the grid is much closer to the cathode than it is to the plate. Because of this, a small voltage on the control grid has a large effect on current to the plate."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["The control grid actually controls the resistance of the tube. By making the grid more negative, resistance to current is increased and current will decrease. Just the opposite happens if the grid is made more positive.", "The control grid actually controls the resistance of the tube. By making the grid more negative, resistance to current is increased and current will decrease. Just the opposite happens if the grid is made more positive..."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["In normal amplifier arrangement, the grid is negative with respect to the cathode. This is similar to the way a JFET is biased. The negative grid will repel electrons and keep them from getting to plate.", "In normal amplifier arrangement, the grid is negative with respect to the cathode. This is similar to the way a JFET is biased. The negative grid will repel electrons and keep them from getting to plate..."], "jumps": ["P2130", "P2100"]}, {"id": "P2130", "text": ["At some point of grid voltage the electron beam will be shut off. By varying the voltage level of the control grid, the output of the plate can be controlled, and even shut off."], "jumps": ["P2140", "P2100"]}, {"id": "P2140", "text": ["The major disadvantage of the triode is interelectrode capacitance. This is due to the wide surface areas of the plate and control grid. This is the major cause of loss of gain at high frequencies in amplifier operations.", "The major disadvantage of the triode is interelectrode capacitance. This is due to the wide surface areas of the plate and control grid. This is the major cause of loss of gain at high frequencies in amplifier operations..."], "jumps": ["P2150", "P2100"]}, {"id": "P2150", "text": ["The solid state component to replace the triode as an amplifier was the transistor, during the solid state revolution."], "jumps": ["P2160", "P2100"]}, {"id": "P2160", "text": ["A negative potential with respect to the cathode on the control grid will _______"], "jumps": ["P2150"]}, {"id": "P2161", "text": [], "jumps": []}, {"id": "P2162", "text": ["Remember, if the control grid is negative, and you know electrons have a negative charge, they will be repelled according to the potential difference of the control grid and cathode."], "jumps": []}, {"id": "P2170", "text": ["What component replaced the triode as an amplifier during the solid state revolution?"], "jumps": ["P2160"]}, {"id": "P2171", "text": [], "jumps": []}, {"id": "P2172", "text": ["Remember, it was the transistor which replaced the triode during the solid state revolution."], "jumps": []}, {"id": "P2180", "text": ["Tetrode\n   \nThis electron tube is similar to the triode with the addition of a  fourth electrode, called the screen grid.", "Tetrode This electron tube is similar to the triode with the addition of a fourth electrode, called the screen grid."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["The screen grid is located between the control grid and the plate.  This electrode reduces the amount of interelectrode capacitance.", "The screen grid is located between the control grid and the plate. This electrode reduces the amount of interelectrode capacitance."], "jumps": ["P2180"]}, {"id": "P2220", "text": ["By applying a more positive voltage potential to the screen grid we form two capacitors in series. One between the screen grid and the control grid, and the other between the screen grid and the plate."], "jumps": ["P2230", "P2190"]}, {"id": "P2230", "text": ["As you know total capacitance of two series capacitors is always lower than either of the two capacitors."], "jumps": ["P2240", "P2190"]}, {"id": "P2240", "text": ["Understand that the screen grid is not used to control current emission, just reduce undesirable effects of interelectrode capacitance in electron tubes."], "jumps": ["P2250", "P2190"]}, {"id": "P2250", "text": ["The major disadvantage of the tetrode is removed by the addition of  the fifth electrode in the pentode. We will discuss this disadvantage when we look at the pentode electron tube.", "The major disadvantage of the tetrode is removed by the addition of the fifth electrode in the pentode. We will discuss this disadvantage when we look at the pentode electron tube."], "jumps": ["P2260", "P2190"]}, {"id": "P2260", "text": ["The screen grid is located between which two electrodes?", "The screen grid is located between which two electrodes?..."], "jumps": ["P2190"]}, {"id": "P2261", "text": [], "jumps": []}, {"id": "P2262", "text": ["Remember, the screen grid is located between the control grid and  the plate to reduce the interelectrode capacitance.", "Remember, the screen grid is located between the control grid and the plate to reduce the interelectrode capacitance."], "jumps": []}, {"id": "P2270", "text": ["The purpose of the screen grid is to _______", "The purpose of the screen grid is to _______...............", "vary the current through the electron tube.", "provide more electrons for the electron beam.", "reduce the amount of interelectrode capacitance."], "jumps": ["P2260"]}, {"id": "P2271", "text": [], "jumps": []}, {"id": "P2272", "text": ["Remember, the screen grid is not used to control current. The  purpose for the screen grid is to reduce the amount of  interelectrode capacitance between the control grid and the plate.", "Remember, the screen grid is not used to control current. The purpose for the screen grid is to reduce the amount of interelectrode capacitance between the control grid and the plate."], "jumps": []}, {"id": "P2280", "text": ["Pentode     \n\nThis electron tube is similar to the tetrode with the addition of a fifth electrode called the suppressor grid.", "Pentode This electron tube is similar to the tetrode with the addition of a fifth electrode called the suppressor grid."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["The suppressor grid is located between the screen grid and the plate. This electrode reduces the disadvantages that the tetrode has. Let's look at this disadvantage."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["It was found that the velocity of the electrons in electron tubes as they hit the plate was knocking off other electrons known as secondary emission."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["With the screen grid being positive, this cloud of slow-moving electrons would move towards the screen grid."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["These slow-moving electrons would interfere with the electron beam, causing the electron tube to operate inefficiently."], "jumps": ["P2330", "P2300"]}, {"id": "P2330", "text": ["The suppressor grid, which should be negative with respect to the screen grid and the plate, will provide two advantages to the electron tube's operation."], "jumps": ["P2340", "P2300"]}, {"id": "P2340", "text": ["First, as with the screen grid, it will help to reduce the interelectrode capacitance by causing three capacitors to be in series."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["Second, it causes the electrode closest to the plate to have a  negative potential which will repel the secondary emission electrons back to the plate.", "Second, it causes the electrode closest to the plate to have a negative potential which will repel the secondary emission electrons back to the plate."], "jumps": ["P2360", "P2330"]}, {"id": "P2360", "text": ["Just as with the screen grid, the suppressor grid is not used to control current flow through the electron tube, but to remove undesired effects of its operation."], "jumps": ["P2370", "P2330"]}, {"id": "P2370", "text": ["The suppressor grid reduces the effects of?", "The suppressor grid reduces the effects of?................"], "jumps": ["P2330"]}, {"id": "P2371", "text": [], "jumps": []}, {"id": "P2372", "text": ["Remember, the suppressor grid is used to reduce the effects of  secondary emission.", "Remember, the suppressor grid is used to reduce the effects of secondary emission."], "jumps": []}, {"id": "P2380", "text": ["How many electrodes does the Pentode have?", "How many electrodes does the Pentode have?................."], "jumps": ["P2370"]}, {"id": "P2381", "text": [], "jumps": []}, {"id": "P2382", "text": ["The pentode has five electrodes, just as the name implies (pent = 5, ode = electrodes)."], "jumps": []}, {"id": "P2390", "text": ["Electron Tube Applications   \n\nLet's take a look at the most common triode electron tube application, amplifier operation.", "Electron Tube Applications Let's take a look at the most common triode electron tube application, amplifier operation."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["There are three different electron tube amplifier configurations: the common cathode, the common plate and the common grid. Each configuration has different operating characteristics that makes it useful for certain operations.", "There are three different electron tube amplifier configurations: the common cathode, the common plate and the common grid. Each configuration has different operating characteristics that makes it useful for certain operations..."], "jumps": ["P2420", "P2390"]}, {"id": "P2420", "text": ["The amplifier configuration can be identified by determining the electrode to which the input signal is applied and the electrode from which the output is taken."], "jumps": ["P2430", "P2400"]}, {"id": "P2430", "text": ["The electrode that has neither input nor output is the common lead. The input will never be applied to the plate, nor will an output ever be taken from the grid."], "jumps": ["P2440", "P2420"]}, {"id": "P2440", "text": ["The circuit below is a common cathode amplifier. The input is applied to the control grid with respect to ground. The output is taken from the plate with respect to ground."], "jumps": ["P2450", "P2420"]}, {"id": "P2450", "text": ["The cathode is connected to ground. The cathode is common to both the input and output and is the common electrode."], "jumps": ["P2460", "P2440"]}, {"id": "P2460", "text": ["C1 couples the AC input signal to the grid and blocks any DC voltage from the input. C2 maintains a constant DC voltage on the cathode by filtering out the AC cathode signals, which reduces negative feedback.", "C1 couples the AC input signal to the grid and blocks any DC voltage from the input. C2 maintains a constant DC voltage on the cathode by filtering out the AC cathode signals, which reduces negative feedback..."], "jumps": ["P2470", "P2440"]}, {"id": "P2470", "text": ["R1 develops the output voltage of the triode. R2 provides a DC path to ground for the small number of electrons intercepted by the control grid. R2 develops the input signal."], "jumps": ["P2480", "P2440"]}, {"id": "P2480", "text": ["R3 develops cathode self bias. The current flow through the circuit is from ground, through R3, V1 and R1 to B+. The current that flows in the cathode lead is referred to as cathode current (Ik)."], "jumps": ["P2490", "P2440"]}, {"id": "P2490", "text": ["The current that flows in the plate is referred to as plate current (Ip). Recall the control grid is normally at a negative potential and does not draw current. In this example, plate current is equal to cathode current.", "The current that flows in the plate is referred to as plate current (Ip). Recall the control grid is normally at a negative potential and does not draw current. In this example, plate current is equal to cathode current..."], "jumps": ["P2500", "P2440"]}, {"id": "P2500", "text": ["When no input signal is applied, the current through the tube is called STATIC CURRENT. As the input signal on the grid goes positive, bias decreases."], "jumps": ["P2510", "P2440"]}, {"id": "P2510", "text": ["When bias decreases, the resistance of V1 decreases. This means plate current increases and the voltage across R1 must increase. If VR1 increase, then the voltage across the tube decreases.", "When bias decreases, the resistance of V1 decreases. This means plate current increases and the voltage across R1 must increase. If VR1 increase, then the voltage across the tube decreases..."], "jumps": ["P2520", "P2440"]}, {"id": "P2520", "text": ["Likewise, as the input goes in the negative direction, bias  increases. This causes the resistance of V1 to increase and current through the plate load resistor to decrease and the voltage across V1 to increase.", "Likewise, as the input goes in the negative direction, bias increases. This causes the resistance of V1 to increase and current through the plate load resistor to decrease and the voltage across V1 to increase..."], "jumps": ["P2530", "P2440"]}, {"id": "P2530", "text": ["Some of the characteristics of the common cathode configuration are:  high input impedance and high interelectrode capacitance, highest gain of the configurations and the output is 180\u00b0 out of phase with the input signal.", "Some of the characteristics of the common cathode configuration are: high input impedance and high interelectrode capacitance, highest gain of the configurations and the output is 180"], "jumps": ["P2540", "P2440"]}, {"id": "P2540", "text": ["Shown below is the schematic symbol for a common plate configuration. Common plate configurations are normally referred to as a cathode follower amplifier."], "jumps": ["P2550", "P2440"]}, {"id": "P2550", "text": ["This type of configuration is normally used for impedance matching. The input is applied to the grid and the output is taken from the cathode. Since the plate is neither the input or the output, it is  common.", "This type of configuration is normally used for impedance matching. The input is applied to the grid and the output is taken from the cathode. Since the plate is neither the input or the output, it is common."], "jumps": ["P2560", "P2540"]}, {"id": "P2560", "text": ["The capacitor C1 is the coupling capacitor, R1 is the grid resistor and R2 is the cathode resistor. Notice that the input is applied to the grid and the output is off the cathode, this means that R2 is not only the bias resistor but is also the load resistor.", "The capacitor C1 is the coupling capacitor, R1 is the grid resistor and R2 is the cathode resistor. Notice that the input is applied to the grid and the output is off the cathode, this means that R2 is not only the bias resistor but is also the load resistor..."], "jumps": ["P2570", "P2540"]}, {"id": "P2570", "text": ["Comparing this circuit to the common cathode amplifier, we find the load resistor is not in the plate circuit but in the cathode circuit. The output is taken across the resistor, and there is no     phase shift across the amplifier.", "Comparing this circuit to the common cathode amplifier, we find the load resistor is not in the plate circuit but in the cathode circuit. The output is taken across the resistor, and there is no phase shift across the amplifier..."], "jumps": ["P2580", "P2540"]}, {"id": "P2580", "text": ["The positive alternation of the input signal causes bias to decrease, the resistance of V1 decreases and current increases. As current increases, the voltage drop across R2 (load/bias resistor) increases.", "The positive alternation of the input signal causes bias to decrease, the resistance of V1 decreases and current increases. As current increases, the voltage drop across R2 (load/bias resistor) increases..."], "jumps": ["P2590", "P2540"]}, {"id": "P2590", "text": ["During the negative alternation of the input, the opposite action occurs. We see that the output voltage is in phase with the input, or \"follows\" the input."], "jumps": ["P2600", "P2540"]}, {"id": "P2600", "text": ["Since the cathode resistor is not bypassed and the voltage across it follows the input, degeneration occurs. The signal developed on the cathode is in opposition to and subtracts from the input signal.", "Since the cathode resistor is not bypassed and the voltage across it follows the input, degeneration occurs. The signal developed on the cathode is in opposition to and subtracts from the input signal..."], "jumps": ["P2610", "P2540"]}, {"id": "P2610", "text": ["Because of this degeneration, the output will ALWAYS be less than the input (voltage gain is less than one)."], "jumps": ["P2620", "P2540"]}, {"id": "P2620", "text": ["Remember, the cathode follower is commonly used for impedance matching. It has a high input impedance and a low output impedance as compared to the common cathode."], "jumps": ["P2630", "P2540"]}, {"id": "P2630", "text": ["Shown below is the schematic symbol for a common grid configuration. This configuration is normally referred to as a grounded grid  amplifier.", "Shown below is the schematic symbol for a common grid configuration. This configuration is normally referred to as a grounded grid amplifier."], "jumps": ["P2640", "P2540"]}, {"id": "P2640", "text": ["The input is applied to the cathode and the output taken from the plate. This means the grid is the common element."], "jumps": ["P2650", "P2630"]}, {"id": "P2650", "text": ["When very high frequency signals are to be amplified, the grid to plate interelectrode capacitance drastically reduces the gain of the common cathode amplifier."], "jumps": ["P2660", "P2630"]}, {"id": "P2660", "text": ["The grounded grid amplifier (common grid) was developed to overcome this difficulty. The input signal cannot use the same path from grid to plate as it did with the common cathode circuit.", "The grounded grid amplifier (common grid) was developed to overcome this difficulty. The input signal cannot use the same path from grid to plate as it did with the common cathode circuit.I"], "jumps": ["P2670", "P2650"]}, {"id": "P2670", "text": ["The grid structure acts as a shield between the cathode and the plate. The input is applied to the cathode in series with the applied grid bias. The output is taken between the plate and ground.", "The grid structure acts as a shield between the cathode and the plate. The input is applied to the cathode in series with the applied grid bias. The output is taken between the plate and ground..."], "jumps": ["P2680", "P2660"]}, {"id": "P2680", "text": ["The positive alternation of the input will cause bias to increase, resistance of the tube increases and current through the tube decreases. The voltage across R1 will decrease and the output will increase.", "The positive alternation of the input will cause bias to increase, resistance of the tube increases and current through the tube decreases. The voltage across R1 will decrease and the output will increase..."], "jumps": ["P2690", "P2660"]}, {"id": "P2690", "text": ["The negative alternation of the input will cause the opposite action to occur. This also means that the input and output signals are in phase."], "jumps": ["P2700", "P2660"]}, {"id": "P2700", "text": ["This amplifier configuration is capable of a high gain, but not as high as the common cathode. The main disadvantage of the grounded grid configuration is that the input source must furnish an appreciable amount of power to the amplifier.", "This amplifier configuration is capable of a high gain, but not as high as the common cathode. The main disadvantage of the grounded grid configuration is that the input source must furnish an appreciable amount of power to the amplifier..."], "jumps": ["P2710", "P2660"]}, {"id": "P2710", "text": ["Today these amplifier configurations have been replaced with transistor based configurations. Even though their circuit characteristics are different, the basic function is still the same.", "Triode Electron Tubes Junction Field Bipolar Transistors Effect Transistor Common Cathode Common Source Common Emitter Cathode Follower Source Follower Emitter Follower Grounded Grid Common Gate Common Baseeeeeee"], "jumps": ["P2720", "P2660"]}, {"id": "P2720", "text": ["Which of the following electron-tube amplifier configurations provides a 180\u00ba phase-shift from the input to the output?", "Which of the following electron-tube amplifier configurations provides a 180", "phase-shift from the input to the output?"], "jumps": ["P2710"]}, {"id": "P2721", "text": [], "jumps": []}, {"id": "P2722", "text": ["Remember, the common cathode configuration provides high gain and phase shifting of 180\u00ba.", "Remember, the common cathode configuration provides high gain and phase shifting of 180"], "jumps": []}, {"id": "P2730", "text": ["In the next section we will look at the operations and uses of the cathode-ray tube. The CRT is the most popular electron tube still in use today."], "jumps": ["P2910", "P2720"]}, {"id": "P2910", "text": ["This completes the information on ELECTRON TUBE OPERATION.", "This completes the information on ELECTRON TUBE OPERATION...."], "jumps": ["P2001", "P2730"]}, {"id": "P2920", "text": ["1. Triode works the same as the diode with the addition of the             control grid which controls the current through the electron           tube.", "1. Triode works the same as the diode with the addition of the control grid which controls the current through the electron tube.."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2. The tetrode adds a fourth electrode to the electron tube which       reduces the amount of interelectrode capacitance between            the plate and control grid. This electrode is the screen grid.", "2. The tetrode adds a fourth electrode to the electron tube which reduces the amount of interelectrode capacitance between the plate and control grid. This electrode is the screen grid."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3. The pentode adds a fifth electrode which reduces the amount        of  secondary emission from the plate. This electrode is called       the suppressor grid.", "3. The pentode adds a fifth electrode which reduces the amount of secondary emission from the plate. This electrode is called the suppressor grid.."], "jumps": ["P2999", "P2930"]}, {"id": "P2999", "text": ["You have completed the Summary.  \nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2940"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3040", "text": ["You are probably more familiar with the Cathode-Ray tube (CRT) than you may realize. The picture tube of a television is a CRT."], "jumps": ["P3001"]}, {"id": "P3050", "text": ["But CRT's are used more than just in televisions, they are used in oscilloscopes, radar screens, video games and computer monitors just to name a few."], "jumps": ["P3040"]}, {"id": "P3060", "text": ["A CRT is a special type of electron tube that converts electrical signals into a visible image. These screens range anywhere from 2 inches to 40 inches in a multitude of shapes.", "'}:5 t0H( 9E}A9As5/GA}A;aEAA}EAKE;AAaAE;A}AEAU;aA};aEAEA;EAAAEA;E;AaA", "EUaa 555G7EEEa::Ts1TA;;AA;EEA;AAa9:AAE;E;;;UaAA;AEEA;aA};AA9aAA}}};E;AA9E}9AA;}AAEaaA;AEAEaAAEEaAAA9EEAAA}EAE;aEEEAU;EE;Ea;}", "EK,,L17;UT9;EK;,=17=9EK;AaTs a7(aEAEas5:9<5", "mzF(tt-FsFF-cmzssttst|t--yTmVstys|tytts sm t syst", ";EaTTy55F }Aaas= yjm;AEEAA T_}zc(GGFGVVVccVcVVlllGLVs-FFccclFm--jz5(-VFzmmm(ctmmlmzzzFFFFFzmmmctmFmsmmtcVmt5mzzl-zFmmFmtz", "KT[Qa9mFKKaa 5TL:EAa95 |9/:}EAEAALA_l>lz(lllFmV-V/czzFzFz/cVmcc--F(GlzFVllWmzzm(mzm(FzmpcF(zmFlzFmmlz-llplcmV-z-mcjsFV`zltmlzFVz-tVczFFtcmVmzlFz(mmzFmzFzmFl/VtmtVFmzmVcmmsVccFtsmmmmFFysGsV", "}9}AAK,,KKK/>V;U9a;EE;KTfV=:lFE;AaTTssc AA :: :9W5EAEEA-Es.>i?fodfi..r.l`(zlVclmlFzljlm", "K,EKK71CA;TU9;EKK:/H:ajlEaaaTa :G Eaa9sya9W", "iid>?>>viijVjcFGfmsG5ssTy|ymssmV5|Hsy5ysTTVsytmmV|t=sm55ms5VLmsH5sGc5m5m=VmmVmmmGmtymmls5j5mmmFV5spcmmmmV5mtt5Gmmmltsmmlmsmy5T5mssQtysFssmmmsmmtsmtsymmtss myy|s5|T5|ystsHa|s|", ",K,KK,,E,,E',EK'5@P=;''aaaT55 5GT;aA9AAOA;AA;AA:;Aa'", "aA 999a9=9}A:aa9=9aA 59O9a::A T:T:a: a=: } - aaaT :AA55:9:aa=Ta A::a aaa=:}AA } A"], "jumps": ["P3040"]}, {"id": "P3070", "text": ["CRT's fall into one of two basic types, electrostatic or electromagnetic. The method of beam deflection determines the type."], "jumps": ["P3060"]}, {"id": "P3080", "text": ["In the electrostatic type, deflection of the beam is accomplished electrostatically by means of deflecting electrodes within the envelope."], "jumps": ["P3070"]}, {"id": "P3090", "text": ["Electromagnetic CRT's use deflecting coils placed on the neck of the CRT. Let's talk about the different parts of the CRT and how they work together."], "jumps": ["P3080"]}, {"id": "P3100", "text": ["Electron Gun    \nThe electron gun introduces, accelerates, and focuses free electrons into a narrow beam. The essential parts of the electron gun are the cathode, control grid, focusing anode and accelerating anode.", "Electron Gun The electron gun introduces, accelerates, and focuses free electrons into a narrow beam. The essential parts of the electron gun are the cathode, control grid, focusing anode and accelerating anode."], "jumps": ["P3090"]}, {"id": "P3110", "text": ["The cathode is the element that supplies the electrons for CRT  operation. The electrons are attracted toward the focusing and accelerating anodes because the anodes are connected to very high positive voltage.", "The cathode is the element that supplies the electrons for CRT operation. The electrons are attracted toward the focusing and accelerating anodes because the anodes are connected to very high positive voltage..."], "jumps": ["P3100"]}, {"id": "P3120", "text": ["The control grid forms the emitted electrons into a beam and provides a means of controlling the number of electrons in the beam. The closed end of the grid has a hole through which electrons must pass.", "The control grid forms the emitted electrons into a beam and provides a means of controlling the number of electrons in the beam. The closed end of the grid has a hole through which electrons must pass..."], "jumps": ["P3100"]}, {"id": "P3130", "text": ["When the grid is made negative with respect to the cathode, an electrostatic field develops around the grid which forces electrons toward the opening in the end of the cylindrical grid."], "jumps": ["P3100"]}, {"id": "P3140", "text": ["The electrons follow a curved path when they leave the control grid.  Notice the beams cross at point X.", "The electrons follow a curved path when they leave the control grid. Notice the beams cross at point X."], "jumps": ["P3150", "P3130"]}, {"id": "P3150", "text": ["By changing the size of the electric field you can control where the beam will cross. By controlling this point you can change the intensity of the display."], "jumps": ["P3160", "P3130"]}, {"id": "P3160", "text": ["After converging at point X, the electrons in the beam begin to repel each other and start to spread out in different directions as they travel towards the screen."], "jumps": ["P3170", "P3130"]}, {"id": "P3170", "text": ["To reconverge and accelerate the beam of electrons, focusing and accelerating anodes are placed in the path of the beam."], "jumps": ["P3180", "P3160"]}, {"id": "P3180", "text": ["These two anodes are made positive with respect to the grid with the accelerating anode the most positive. The two anodes work together to make the beam electrons converge at a point on the screen known as the focal point.", "These two anodes are made positive with respect to the grid with the accelerating anode the most positive. The two anodes work together to make the beam electrons converge at a point on the screen known as the focal point..."], "jumps": ["P3190", "P3160"]}, {"id": "P3190", "text": ["The voltage on the focusing anode controls this point of  convergence. When the electrons converge at just the right point, the image on the screen appears sharp or \"in focus\".", "The voltage on the focusing anode controls this point of convergence. When the electrons converge at just the right point, the image on the screen appears sharp or \"in focus\"."], "jumps": ["P3200", "P3160"]}, {"id": "P3200", "text": ["Which component supplies the electrons for the electron beam?"], "jumps": ["P3160"]}, {"id": "P3201", "text": [], "jumps": []}, {"id": "P3202", "text": ["The cathode is the component which produces electrons when heated for the electron beam."], "jumps": []}, {"id": "P3210", "text": ["Screen   \n\nThis is the section of the CRT that the image is displayed on. The inside of the tube face (the screen) is coated with a material that emits light when struck by a stream of high velocity electrons.", "Screen This is the section of the CRT that the image is displayed on. The inside of the tube face (the screen) is coated with a material that emits light when struck by a stream of high velocity electrons."], "jumps": ["P3220", "P3200"]}, {"id": "P3220", "text": ["This emission of light is known as fluorescence. The amount of light emitted by a particular screen depends on the velocity and the number of beam electrons."], "jumps": ["P3230", "P3210"]}, {"id": "P3230", "text": ["CRT's used in test equipment, some computer displays, and radar typically have screens that illuminate white, green, or amber. These types of screens are called monochrome because the image can appear in only one color.", "CRT's used in test equipment, some computer displays, and radar typically have screens that illuminate white, green, or amber. These types of screens are called monochrome because the image can appear in only one color..."], "jumps": ["P3240", "P3210"]}, {"id": "P3240", "text": ["Some CRT's contain specially coated screens to provide images in full color such as those used in color TV sets and video games."], "jumps": ["P3250", "P3230"]}, {"id": "P3250", "text": ["What term is used to describe screens that produce only one color?"], "jumps": ["P3230"]}, {"id": "P3251", "text": [], "jumps": []}, {"id": "P3252", "text": ["The term for a screen that produces one color is monochrome, meaning that the images displayed are monochromatic."], "jumps": []}, {"id": "P3260", "text": ["Aquadag Coating   \n\nJust like the tetrode, the CRT has to worry about the problem of secondary emission. The Aquadag coating is a thin conductive (graphite) coating on the inside wall of the tube.", "Aquadag Coating Just like the tetrode, the CRT has to worry about the problem of secondary emission. The Aquadag coating is a thin conductive (graphite) coating on the inside wall of the tube."], "jumps": ["P3270", "P3250"]}, {"id": "P3270", "text": ["By connecting the Aquadag coating to a high positive potential, it will collect secondary electrons that are \"splashed\" out from the screen from the electron beam, and returns them to the power supply.", "By connecting the Aquadag coating to a high positive potential, it will collect secondary electrons that are \"splashed\" out from the screen from the electron beam, and returns them to the power supply..."], "jumps": ["P3280", "P3260"]}, {"id": "P3280", "text": ["If the secondary electrons were not collected, the screen would become highly negative and interfere with proper tube operation. In some tubes the aquadag is connected to the accelerating anode.", "If the secondary electrons were not collected, the screen would become highly negative and interfere with proper tube operation. In some tubes the aquadag is connected to the accelerating anode..."], "jumps": ["P3290", "P3260"]}, {"id": "P3290", "text": ["The aquadag coating returns the secondary electrons to the _______", "The aquadag coating returns the secondary electrons to the _________"], "jumps": ["P3260"]}, {"id": "P3291", "text": [], "jumps": []}, {"id": "P3292", "text": ["The Aquadag coating is attached to a high positive potential which collect the secondary electrons from the screen and returns them to the power supply."], "jumps": []}, {"id": "P3300", "text": ["Beam Deflection The purpose of the deflection system of a CRT is to accurately move the electron beam to any part of the screen. This is done by controlling the horizontal and vertical movement of the beam. Let's look at the Electrostatic and Electromagnetic beam deflection techniques.", "'}:5 t0H( 9E}A9As5/GA}A;aEAA}EAKE;AAaAE;A}AEAU;aA};aEAEA;EAAAEA;E;AaA", "EUaa 555G7EEEa::Ts1TA;;AA;EEA;AAa9:AAE;E;;;UaAA;AEEA;aA};AA9aAA}}};E;AA9E}9AA;}AAEaaA;AEAEaAAEEaAAA9EEAAA}EAE;aEEEAU;EE;Ea;}", "EK,,L17;UT9;EK;,=17=9EK;AaTs a7(aEAEas5:9<5", "mzF(tt-FsFF-cmzssttst|t--yTmVstys|tytts sm t syst", ";EaTTy55F }Aaas= yjm;AEEAA T_}zc(GGFGVVVccVcVVlllGLVs-FFccclFm--jz5(-VFzmmm(ctmmlmzzzFFFFFzmmmctmFmsmmtcVmt5mzzl-zFmmFmtz", "KT[Qa9mFKKaa 5TL:EAa95 |9/:}EAEAALA_l>lz(lllFmV-V/czzFzFz/cVmcc--F(GlzFVllWmzzm(mzm(FzmpcF(zmFlzFmmlz-llplcmV-z-mcjsFV`zltmlzFVz-tVczFFtcmVmzlFz(mmzFmzFzmFl/VtmtVFmzmVcmmsVccFtsmmmmFFysGsV", "}9}AAK,,KKK/>V;U9a;EE;KTfV=:lFE;AaTTssc AA :: :9W5EAEEA-Es.>i?fodfi..r.l`(zlVclmlFzljlm", "K,EKK71CA;TU9;EKK:/H:ajlEaaaTa :G Eaa9sya9W", "iid>?>>viijVjcFGfmsG5ssTy|ymssmV5|Hsy5ysTTVsytmmV|t=sm55ms5VLmsH5sGc5m5m=VmmVmmmGmtymmls5j5mmmFV5spcmmmmV5mtt5Gmmmltsmmlmsmy5T5mssQtysFssmmmsmmtsmtsymmtss myy|s5|T5|ystsHa|s|", ",K,KK,,E,,E',EK'5@P=;''aaaT55 5GT;aA9AAOA;AA;AA:;Aa'", "aA 999a9=9}A:aa9=9aA 59O9a::A T:T:a: a=: } - aaaT :AA55:9:aa=Ta A::a aaa=:}AA } A"], "jumps": ["P3310", "P3290"]}, {"id": "P3310", "text": ["Electrostatic CRT The electrostatic deflection system uses two pairs of metallic plates arranged so that the beam passes between each pair. One pair deflects the beam vertically while the other pair deflects the beam horizontally."], "jumps": ["P3320", "P3300"]}, {"id": "P3320", "text": ["By varying the voltage on the vertical and horizontal deflection plates, the beam is moved to different points on the screen."], "jumps": ["P3330", "P3310"]}, {"id": "P3330", "text": ["With all plates at the same potential there is no field to act on the beam, so the beam arrives at the center of the screen."], "jumps": ["P3340", "P3310"]}, {"id": "P3340", "text": ["When a positive potential is applied to one or more of the plates, the electron beam moves towards the plate or plates that have the positive voltage applied to it."], "jumps": ["P3350", "P3330"]}, {"id": "P3350", "text": ["The greater the voltage applied, the farther away from the center the beam moves. This method of beam positioning can very accurately position the electron beam on the screen."], "jumps": ["P3360", "P3330"]}, {"id": "P3360", "text": ["Which screen represents the screen of a CRT with the following potentials on the deflection plates?"], "jumps": ["P3330"]}, {"id": "P3361", "text": [], "jumps": []}, {"id": "P3362", "text": ["Remember that a positive potential will attract the electron beam towards it."], "jumps": []}, {"id": "P3370", "text": ["Electromagnetic CRT   \n\nInstead of using a set of internally mounted deflection plates, this type of CRT uses a set of deflection coils which are positioned on the outside neck of the tube.", "Electromagnetic CRT Instead of using a set of internally mounted deflection plates, this type of CRT uses a set of deflection coils which are positioned on the outside neck of the tube."], "jumps": ["P3380", "P3360"]}, {"id": "P3380", "text": ["There are two sets of deflection coils, one set controls the vertical deflection and the second set controls the horizontal deflection."], "jumps": ["P3390", "P3370"]}, {"id": "P3390", "text": ["The coils are normally an assembly which is called a yoke. The yoke is placed on the neck of the tube."], "jumps": ["P3400", "P3370"]}, {"id": "P3400", "text": ["The magnetic fields of the coils are used to deflect the beam. The magnetic fields are created by causing current to flow through the coils."], "jumps": ["P3410", "P3390"]}, {"id": "P3410", "text": ["Two of the coils are wired in series and produce a magnetic field whose lines of force run vertically through the neck of the tube.This vertical magnetic field causes horizontal deflection of the beam.", "Two of the coils are wired in series and produce a magnetic field whose lines of force run vertically through the neck of the tube.This vertical magnetic field causes horizontal deflection of the beam..."], "jumps": ["P3420", "P3400"]}, {"id": "P3420", "text": ["The other pair of coils are wired in series and mounted to produce a magnetic field whose lines of force run horizontally through the neck of the tube. This horizontal magnetic field causes vertical deflection of the beam.", "The other pair of coils are wired in series and mounted to produce a magnetic field whose lines of force run horizontally through the neck of the tube. This horizontal magnetic field causes vertical deflection of the beam..."], "jumps": ["P3430", "P3410"]}, {"id": "P3430", "text": ["The set of coils which produces a vertical magnetic field is used to deflect the beam?"], "jumps": ["P3410"]}, {"id": "P3431", "text": [], "jumps": []}, {"id": "P3432", "text": ["The set of coils which produces the vertical field lines will provide a horizontal deflection of the electron beam."], "jumps": []}, {"id": "P3440", "text": ["CRT Schematic Symbols  \n\nThe last thing that we will cover is the schematic symbols for both types of CRT deflection configurations.", "CRT Schematic Symbols The last thing that we will cover is the schematic symbols for both types of CRT deflection configurations...."], "jumps": ["P3450", "P3430"]}, {"id": "P3450", "text": ["Notice the difference between the two schematics, the electrostatic CRT schematic symbol has the deflector plates on the symbol whereas the electromagnetic doesn't."], "jumps": ["P3910", "P3440"]}, {"id": "P3910", "text": ["This completes the information on ELECTRON TUBE APPLICATION.", "This completes the information on ELECTRON TUBE APPLICATION.."], "jumps": ["P3001", "P3440"]}, {"id": "P3920", "text": ["1.  There are two main types of CRT's.", "1. There are two main types of CRT's. second line here...."], "jumps": ["P3930", "P3001"]}, {"id": "P3930", "text": ["2.  Electrostatic CRT's use deflection plates located inside the             envelope of the CRT to deflect the electron beam to desired           locations.", "2. Electrostatic CRT's use deflection plates located inside the envelope of the CRT to deflect the electron beam to desired locations."], "jumps": ["P3940", "P3920"]}, {"id": "P3940", "text": ["3.  Electromagnetic CRT' let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
