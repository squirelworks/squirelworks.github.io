ion."], "jumps": []}, {"id": "P420", "text": ["STEP 2 Check that all switches and controls are set properly."], "jumps": []}, {"id": "P430", "text": ["STEP 3 Calculate, measure and compare circuit values and identify the faulted component."], "jumps": []}, {"id": "P440", "text": ["STEP 4 Replace the faulted component, and recheck the circuit for normal operation."], "jumps": []}, {"id": "P450", "text": ["Troubleshooting is less puzzling when a logical procedure is followed."], "jumps": []}, {"id": "P460", "text": ["Let's begin the lesson on SERIES-PARALLEL CIRCUIT TROUBLESHOOTING EXPERIMENT."], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1040", "text": ["This experiment demonstrates how to troubleshoot a series-parallel circuit to identify an open component.", "GOOD COMPONENT resistance = ohmic valueeeeeeeeeeee", "STARTING TO OPEN resistance increasesssssssssssssssssss", "OPEN maximum resistance sss"], "jumps": []}, {"id": "P1045", "text": ["You learned that an open occurs when a component provides no path for current. This experiment demonstrates the effect of an open component in a series-parallel circuit."], "jumps": []}, {"id": "P1070", "text": ["Pick up the PC130- 9A card. You will use series-parallel circuit A."], "jumps": []}, {"id": "P1080", "text": ["Place switches S1, S2, and S3 on PC130- 9A to IN (Up), switches S4 and S5 to the OUT (Down) position."], "jumps": []}, {"id": "P1090", "text": ["This experiment follows the four step troubleshooting procedure. Let's begin."], "jumps": []}, {"id": "P1100", "text": ["Step 1: Analyze the circuit The series-parallel circuit is very simple. To determine normal operation, compare calculated to measure circuit values."], "jumps": []}, {"id": "P1105", "text": ["Let's start by calculating the current for circuit A."], "jumps": []}, {"id": "P1110", "text": ["Calculate total current for circuit A with an applied voltage of 12 V."], "jumps": []}, {"id": "P1111", "text": [], "jumps": []}, {"id": "P1112", "text": ["1. Calculate equivalent resistance for the parallel branch (Req). 2. Total resistance equals series resistance plus Req. 3. Use the formula for current.", "R1 x R2 Req = R1 + R2 R21 + R2 R1 + R2222", "Rt = Req + Series Resistance R21 + R2 R1 + R2222", "V It = Rt R21 + R2 R1 + R2222"], "jumps": []}, {"id": "P1115", "text": ["TOTAL CURRENT 1. Calculate equivalent resistance for the parallel branch (Req). 2. Total resistance equals series resistance plus Req. 3. Use the formula for current.", "R1 x R2 Req = R1 + R2 R21 + R2 R1 + R2222", "Rt = Req + Series Resistance R21 + R2 R1 + R2222", "V It = Rt R21 + R2 R1 + R2222"], "jumps": []}, {"id": "P1120", "text": ["Now, you need to measure the total current in circuit A to see if your calculations match the measured values."], "jumps": []}, {"id": "P1130", "text": ["1. Set the test console controls to the initial control settings."], "jumps": []}, {"id": "P1140", "text": ["2. Carefully plug PC130- 9A into the test console PC1 position. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON.........................................", "EXPERIMENT CARD PLACEMENT - PC130- 9A shown in PC1 position. Start second line here."], "jumps": []}, {"id": "P1150", "text": ["3. Set the Voltmeter Switch to Positive. 4. Set the Positive Supply Voltage to 12. The test console's Voltage Meter should indicate 12 volts."], "jumps": []}, {"id": "P1155", "text": ["TEST CONSOLE CONTROLS - Set the test console controls as indicated. Start second line here.", "If using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "1. Voltmeter Switch - Pos. 2. + Supply Control - 12 V 3. Voltmeter Switch - Neg. 4. - Supply Control - 12 VVVVVVVVVVVVVVVVVVVVVVVge -DC/+DC/AC Switch ........ +DC Red test Lead ................... V input jack Black test lead ................. COMM input jack COMM input jackM input jackack....... COMM input jackkkjackkkkkkkkkkkkkk"], "jumps": []}, {"id": "P1160", "text": ["5. Set your multimeter to measure DC current. 6. Turn PC1 DC Power switch to ON."], "jumps": []}, {"id": "P1165", "text": ["PC POWER SWITCHES - Set the PC1 Power switch to ON. Start second line here."], "jumps": []}, {"id": "P1180", "text": ["7. Place the negative test lead on TP3 and the positive test lead on TP2. Note that your meter is placed across switch S1."], "jumps": []}, {"id": "P1185", "text": ["TEST LEAD PLACEMENT - The negative test lead shown on TP3 and the the positive test lead shown on TP2."], "jumps": []}, {"id": "P1190", "text": ["8. Place switch S1 to the OUT (Down) position."], "jumps": []}, {"id": "P1195", "text": ["MEASUREMENT SETUP - S1 - OUT S4 - OUT S2 - IN S5 - OUT S3 - IN"], "jumps": []}, {"id": "P1200", "text": ["9. Measure the total current. What is the measured current in circuit A? Your answer must be in milliamps."], "jumps": []}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1203", "text": ["Your answer is not acceptable. ...................", "Check the following and take the measurement again: - Place PC1 DC Power switch ON. - Set multimeter to measure current. - Break Circuit A by placing S1 to OUT, S2 to IN, S3 to IN. - Disable Circuit B & C by placing S4 and S5 to OUT. - Check multimeter lead placement....."], "jumps": []}, {"id": "P1207", "text": ["Your answer is still incorrect. You should have measured approximately 3 mA."], "jumps": ["PutVar"]}, {"id": "P1210", "text": ["Comparing the calculated and measured values of circuit A shows that this circuit is operating properly."], "jumps": []}, {"id": "P1220", "text": ["The results indicate there is no fault in this circuit. Remember, step 1 of the troubleshooting procedure is the only step when no fault is indicated."], "jumps": []}, {"id": "P1230", "text": ["The computer will now open one of the components in circuit A."], "jumps": []}, {"id": "P1235", "text": ["Repeat step 1 of the troubleshooting procedure. Do not calculate the expected current again. You know it should be 3 mA. Current measurements determine if the circuit is faulted."], "jumps": []}, {"id": "P1250", "text": ["Step 1: Analyze the circuit 1. Check that the Positive Supply Voltage is set to 12 V."], "jumps": []}, {"id": "P1260", "text": ["2. Make sure that your multimeter is still set to measure DC current."], "jumps": []}, {"id": "P1270", "text": ["3. Check that PC1 DC Power Switch is ON."], "jumps": []}, {"id": "P1280", "text": ["4. Place the negative test lead on TP3 and the positive test lead on TP2."], "jumps": []}, {"id": "P1290", "text": ["5. Check that switch S1 is set to the OUT (Down) position."], "jumps": []}, {"id": "P1300", "text": ["6. Measure the total current. What is the measured current in circuit A? Your answer must be in milliamps."], "jumps": []}, {"id": "P1301", "text": [], "jumps": []}, {"id": "P1303", "text": ["Your answer is incorrect. Your answer is incorrect.", "Check the following and take the measurement again: - Place PC1 DC Power switch ON. - Set multimeter to measure current. - Break Circuit A by placing S1 to OUT, S2 to IN, S3 to IN. - Disable Circuit B & C by placing S4 and S5 to OUT. - Check multimeter lead placement....."], "jumps": []}, {"id": "P1307", "text": ["Your answer is still incorrect. You should have measured approximately 2.4 mA."], "jumps": ["PutVar"]}, {"id": "P1310", "text": ["Comparing the calculated and measured values of circuit A shows that this circuit is NOT operating properly."], "jumps": []}, {"id": "P1320", "text": ["This completes step 1 of the troubleshooting procedure. Let's go on to step 2."], "jumps": []}, {"id": "P1330", "text": ["Step 2: Check the setup Check that the Positive Supply Voltage is set to 12 V. Check your multimeter to be sure that you are reading DC current."], "jumps": []}, {"id": "P1340", "text": ["A check of the setup should indicate that everything is set properly. Proceed to step 3 of the troubleshooting procedure."], "jumps": []}, {"id": "P1350", "text": ["Step 3: Calculate & measure values You have determined that total circuit current has decreased. This eliminates the possibility that R1 is open. If R1 were open, total circuit current would be zero. The probable open is in the parallel components."], "jumps": []}, {"id": "P1360", "text": ["Make current readings for the components in each parallel branch of circuit A, to identify the branch with the fault."], "jumps": []}, {"id": "P1362", "text": ["Calculate the following for the parallel branch of circuit A."], "jumps": []}, {"id": "P1363", "text": [], "jumps": []}, {"id": "P1364", "text": ["Your 3 tries are finished. You should have calculated these circuit values...\"with \"OK\"te that your meter is placed across switch S2."], "jumps": []}, {"id": "P1365", "text": ["FORMULAS REQUIRED FORMULAS REQUIRED tart second line here.", "R1 x R2 Req = to calculate parallel resistance. R1 + R2 V It = to calculate total current. Rt V = It x Req to calculate parallel voltage. V I = to calculate current of parallel branch. RRRRRRRRRRRRRR"], "jumps": []}, {"id": "P1370", "text": ["1. Place the negative test lead on TP6 and the positive test lead on TP4. Note that your meter is placed across switch S2."], "jumps": []}, {"id": "P1375", "text": ["TEST LEAD PLACEMENT - The negative test lead is shown on TP6 and the positive test lead is shown on TP4."], "jumps": []}, {"id": "P1380", "text": ["2. Place switch S1 to the IN (Up) position and switch S2 to the OUT (Down) position."], "jumps": []}, {"id": "P1385", "text": ["MEASUREMENT SETUP - S1 - IN S4 - OUT S2 - OUT S5 - OUT S3 - IN"], "jumps": []}, {"id": "P1390", "text": ["3. Measure the current through R2. What is the measured current across R2 of circuit A? Your answer must be in milliamps."], "jumps": ["P1393"]}, {"id": "P1391", "text": [], "jumps": []}, {"id": "P1393", "text": ["Your answer is incorrect. ....................", "Check the following and take the measurement again: - Place PC1 DC Power switch ON. - Set multimeter to measure current. - Break Circuit A by placing S1 to IN, S2 to OUT, S3 to IN. - Disable Circuit B & C by placing S4 and S5 to OUT. - Check multimeter lead placement....."], "jumps": []}, {"id": "P1397", "text": ["Your answer is still incorrect. You should have measured approximately 2.4 mA."], "jumps": ["PutVar"]}, {"id": "P1400", "text": ["4. Place the negative test lead on TP6 and the positive test lead on TP5. Note that your meter is placed across switch S3."], "jumps": []}, {"id": "P1405", "text": ["TEST LEAD PLACEMENT - The negative test lead is shown on TP6 and the positive test lead is shown on TP5."], "jumps": []}, {"id": "P1410", "text": ["5. Place switch S2 to the IN (Up) position and switch S3 to the OUT (Down) position."], "jumps": []}, {"id": "P1415", "text": ["MEASUREMENT SETUP - S1 - IN S4 - OUT S2 - IN S5 - OUT S3 - OUT"], "jumps": []}, {"id": "P1420", "text": ["6. Measure the current through R3. What is the measured current across R3 of circuit A? Your answer must be in milliamps."], "jumps": ["P1423"]}, {"id": "P1421", "text": [], "jumps": []}, {"id": "P1423", "text": ["Your answer is incorrect. ...........", "Check the following and take the measurement again: - Place PC1 DC Power switch ON. - Set multimeter to measure current. - Break Circuit A by placing S1 to IN, S2 to IN, S3 to OUT. - Disable Circuit B & C by placing S4 and S5 to OUT. - Check multimeter lead placement....."], "jumps": []}, {"id": "P1427", "text": ["Your answer is still incorrect. You should have measured approximately 0 mA."], "jumps": ["PutVar"]}, {"id": "P1430", "text": ["Compare the individual branch currents. Note that the current through R3 indicates 0 mA.", "Term Calculated Measured AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "Ir2 2 mA Ir3 1 mA AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"], "jumps": []}, {"id": "P1440", "text": ["These results indicate that you have an open component in this circuit. Which component is open?"], "jumps": []}, {"id": "P1441", "text": [], "jumps": []}, {"id": "P1442", "text": ["An open component in a parallel circuit shows no current in that branch of the circuit."], "jumps": []}, {"id": "P1445", "text": ["CALCULATED AND MEASURED VALUES Start second line here.", "An open component provides NO path for current flow................................................ !%15 mA Ir3 1 mA !%16 mA An open component provides NO path for current flow....", "Term Calculated Measured AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "Ir2 2 mA Ir3 1 mA AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "0.0 mAmA AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"], "jumps": []}, {"id": "P1450", "text": ["In a series-parallel circuit: An open in a series component stops current flow in the entire circuit. An open in a parallel component decreases total current. Current will not flow in the branch that is open.", "In a series-parallel circuit: An open in a series component stops current in the entire circuit. An open in a parallel component decreases total current. There is no current in the open branch.", "In a series-parallel circuit: An open in a series component stops current flow in the entire circuit. An open in a parallel component decreases total current. Current will not flow in the branch that is open. is open."], "jumps": []}, {"id": "P1460", "text": ["In step 3 of the troubleshooting procedure you can make additional measurements to prove which component is faulted. Let's make resistance measurements to prove that R3 is open."], "jumps": []}, {"id": "P1470", "text": ["1. Turn PC1 DC Power switch to OFF. .."], "jumps": []}, {"id": "P1475", "text": ["PC POWER SWITCHES - Set the PC1 Power switch to OFF. Start second line here."], "jumps": []}, {"id": "P1480", "text": ["2. Set your multimeter to measure resistance."], "jumps": []}, {"id": "P1490", "text": ["3. Set switches S1, S2, and S3 to the OUT (Down) position. Check that S4 and S5 are also in the OUT (Down) position."], "jumps": []}, {"id": "P1495", "text": ["SWITCH POSITIONS - S1 - OUT S4 - OUT S2 - OUT S5 - OUT S3 - OUT"], "jumps": []}, {"id": "P1500", "text": ["4. Place the test leads on TP3 and TP5. Which resistor are you measuring?"], "jumps": []}, {"id": "P1501", "text": [], "jumps": []}, {"id": "P1502", "text": ["Look at the schematic of circuit A drawn on PC130- 9A card. Trace the line between TP3 and TP5. The resistor between the test points is the resistor you are measuring."], "jumps": []}, {"id": "P1505", "text": ["TEST LEAD PLACEMENT - The negative test lead shown on TP3 and the positive test lead shown on TP5."], "jumps": []}, {"id": "P1510", "text": ["5. Measure resistor R3. What is the resistance indicated on your multimeter? Your answer must be in ohms."], "jumps": ["P1514"]}, {"id": "P1511", "text": [], "jumps": []}, {"id": "P1512", "text": ["Your answer is incorrect. ......................", "Check the following and take the measurement again: - Place PC1 DC Power switch OFF. - Set multimeter to measure resistance. - Open Circuit A by placing S1 to OUT, S2 to OUT, S3 to OUT. - Disable Circuit B & C by placing S4 and S5 to OUT. - Check multimeter lead placement."], "jumps": []}, {"id": "P1514", "text": ["Your answer is not acceptable. The value entered is very close to the calculated value. The fault contained in this circuit will not provide an indication equal to the value entered. If your meter indicates infinity, type OL, MAX, or INF. Measure the resistance again!"], " k multimeter lead placement."], "jumps": []}, {"id": "P3207", "text": ["Your answer is still incorrect. You should have measured approximately 5 mA."], "jumps": ["PutVar"]}, {"id": "P3210", "text": ["Comparing the calculated and measured values of circuit C shows that this circuit is operating properly."], "jumps": []}, {"id": "P3220", "text": ["The results indicate there is no fault in this circuit. Remember, step 1 of the troubleshooting procedure is the only step when no fault is indicated."], "jumps": []}, {"id": "P3230", "text": ["The computer will now change a component value in circuit C."], "jumps": []}, {"id": "P3235", "text": ["Repeat step 1 of the troubleshooting procedure. Do not calculate the expected current again. You know it should be 5 mA. Current measurements determine if the circuit is faulted."], "jumps": []}, {"id": "P3250", "text": ["Step 1: Analyze the circuit 1. Check that the Positive Supply Voltage is set to 12 V."], "jumps": []}, {"id": "P3260", "text": ["2. Set your multimeter to measure DC current. 3. Ensure PC1 DC Power switch is set to ON."], "jumps": []}, {"id": "P3280", "text": ["4. Place the negative test lead on TP13 and the positive test lead on TP12."], "jumps": []}, {"id": "P3290", "text": ["5. Check that switch S5 is set to the OUT (Down) position."], "jumps": []}, {"id": "P3300", "text": ["6. Measure the total current. What is the measured current in circuit C? Your answer must be in milliamps."], "jumps": ["P3303"]}, {"id": "P3301", "text": [], "jumps": []}, {"id": "P3303", "text": ["Your answer is incorrect. .........................", "Check the following and take the measurement again: - Place PC1 DC Power switch ON. - Set multimeter to measure current. - Break Circuit C by placing S5 to OUT. - Disable Circuit A & B by placing S1, S2, S3 and S4 to OUT. - Check multimeter lead placement......nt.. and S5 to OUT. - Check multimeter lead placement."], "jumps": []}, {"id": "P3307", "text": ["Your answer is still incorrect. You xt": ["This experiment demonstrates how to troubleshoot a series-parallel circuit to identify an open component.", "GOOD COMPONENT resistance = ohmic valueeeeeeeeeeee", "STARTING TO OPEN resistance increasesssssssssssssssssss", "OPEN maximum resistance sss"], "jumps": []}, {"id": "P13045", "text": ["You learned that an open occurs when a component provides no path for current. This experiment demonstrates the effect of an open component in a series-parallel circuit."], "jumps": []}, {"id": "P13070", "text": ["Pick up the PC130- 9A card. You will use series-parallel circuit A."], "jumps": []}, {"id": "P13080", "text": ["Place switches S1, S2, and S3 on PC130 - 9A to IN (Up), switches S4 and S5 to the OUT (Down) position. 1"], "jumps": []}, {"id": "P13090", "text": ["This experiment follows the four step troubleshooting procedure. Let's begin."], "jumps": []}, {"id": "P13100", "text": ["Step 1: Analyze the circuit The series-parallel circuit is very simple. To determine normal operation, compare calculated to measured circuit values."], "jumps": []}, {"id": "P13105", "text": ["Let's start by calculating the current for circuit A."], "jumps": []}, {"id": "P13110", "text": ["Calculate total current for circuit A with an applied voltage of 12 V."], "jumps": []}, {"id": "P13111", "text": [], "jumps": []}, {"id": "P13112", "text": ["1. Calculate equivalent resistance for the parallel branch (Req). 2. Total resistance equals series resistance plus Req. 3. Use the formula for current.", "R1 x R2 Req = R1 + R2 R21 + R2 R1 + R2222", "Rt = Req + Series Resistance R21 + R2 R1 + R2222", "V It = Rt R21 + R2 R1 + R2222"], "jumps": []}, {"id": "P13115", "text": ["TOTAL CURRENT 1. Calculate equivalent resistance for the parallel branch (Req). 2. Total resistance equals series resistance plus Req. 3. Use the formula for current.", "R1 x R2 Req = R1 + R2 R21 + R2 R1 + R2222", "Rt = Req + Series Resistance R21 + R2 R1 + R2222", "V It = Rt R21 + R2 R1 + R2222"], "jumps": []}, {"id": "P13120", "text": ["Now, you need to measure the total current in circuit A to see if your calculations match the measured values."], "jumps": []}, {"id": "P13130", "text": ["1. Set the test console controls to the initial control settings."], "jumps": []}, {"id": "P13140", "text": ["2. Carefully plug PC130- 9A into the test console PC1 position.", "EXPERIMENT CARD PLACEMENT - PC130 - 9A shown in PC1 position. Start second line here."], "jumps": []}, {"id": "P13150", "text": ["3. Press Enter to set: Positive Supply Voltage - 122222................................."], "jumps": []}, {"id": "P13160", "text": ["4. Set your multimeter to measure DC current."], "jumps": []}, {"id": "P13170", "text": ["5. Press Enter to set: PC1 DC Power Switch - ONNNN.............................."], "jumps": []}, {"id": "P13180", "text": ["6. Place the negative test lead on TP3 and the positive test lead on TP2. Note that your meter is placed across switch S1."], "jumps": []}, {"id": "P13185", "text": ["TEST LEAD PLACEMENT - The negative test lead shown on TP3 and the the positive test lead shown on TP2."], "jumps": []}, {"id": "P13190", "text": ["7. Place switch S1 to the OUT (Down) position."], "jumps": []}, {"id": "P13195", "text": ["MEASUREMENT SETUP - S1 - OUT S4 - OUT S2 - IN S5 - OUT S3 - IN"], "jumps": []}, {"id": "P13200", "text": ["8. Measure the total current. What is the measured current in circuit A? Your answer must be in milliamps."], "jumps": ["P13203"]}, {"id": "P13201", "text": [], "jumps": []}, {"id": "P13203", "text": ["Your answer is not acceptable. ....................", "Check the following and take the measurement again: - Ensure that PC1 DC Power switch is illuminated. - Set multimeter to measure current. - Break Circuit A by placing S1 to OUT, S2 to IN, and S3 to IN. - Disable Circuit B & C by placing S4 and S5 to OUT. - Check multimeter lead placement. multimeter lead placement."], "jumps": []}, {"id": "P13207", "text": ["Your answer is still incorrect. You should have measured approximately 3 mA."], "jumps": ["PutVar"]}, {"id": "P13210", "text": ["Comparing the calculated and measured values of circuit A shows that this circuit is operating properly."], "jumps": []}, {"id": "P13220", "text": ["The results indicate there is no fault in this circuit. Remember, step 1 of the troubleshooting procedure is the only step when no fault is indicated."], "jumps": []}, {"id": "P13230", "text": ["The computer will now open one of the components in circuit A."], "jumps": []}, {"id": "P13235", "text": ["Repeat step 1 of the troubleshooting procedure. Do not calculate the expected current again. You know it should be 3 mA. Current measurements determine if the circuit is faulted."], "jumps": []}, {"id": "P13250", "text": ["Step 1: Analyze the circuit 1. Check that the Positive Supply Voltage is set to 12 V. The light next to 12 on the Positive Power Supply should be illuminated. ted."], "jumps": []}, {"id": "P13260", "text": ["2. Make sure that your multimeter is still set to measure DC current."], "jumps": []}, {"id": "P13270", "text": ["3. Check that PC1 DC Power switch is ON."], "jumps": []}, {"id": "P13280", "text": ["4. Place the negative test lead on TP3 and the positive test lead on TP2."], "jumps": []}, {"id": "P13290", "text": ["5. Check that switch S1 is set to the OUT (Down) position."], "jumps": []}, {"id": "P13300", "text": ["6. Measure the total current. What is the measured current in circuit A? Your answer must be in milliamps."], "jumps": ["P13303"]}, {"id": "P13301", "text": [], "jumps": []}, {"id": "P13303", "text": ["Your answer is incorrect. ........................", "Check the following and take the measurement again: - Check that PC1 DC Power switch is illuminated. - Set multimeter to measure current. - Break Circuit A by placing S1 to OUT, S2 to IN, and S3 to IN. - Disable Circuit B & C by placing S4 and S5 to OUT. - Check multimeter lead placement.k multimeter lead placement."], "jumps": []}, {"id": "P13307", "tex  ["Your answer is incorrect. ........................", "Check the following and take the measurement again: - Ensure PC1 DC Power switch is illuminated. - Set multimeter to measure current. - Break Circuit A by placing S1 to IN, S2 to IN, and S3 to OUT. - Disable Circuit B & C by placing S4 and S5 to OUT. - Check multimeter lead placement.Check multimeter lead placement."], "jumps": []}, {"id": "P13427", "text": ["Your answer is still incorrect. You should have measured approximately 0 mA."], "jumps": ["PutVar"]}, {"id": "P13430", "text": ["Compare the individual branch currents. Note that the current through R3 indicates 0 mA.", "Ir2 2 mA Ir3 1 mA AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "2.48 mAmA AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "0.0 mAmA AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "Term Calculated Measured AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"], "jumps": []}, {"id": "P13440", "text": ["These results indicate that you have an open component in this circuit. Which component is open?"], "jumps": []}, {"id": "P13441", "text": [], "jumps": []}, {"id": "P13442", "text": ["An open component in a parallel circuit shows no current in that branch of the circuit."], "jumps": []}, {"id": "P13445", "text": ["CALCULATED AND MEASURED VALUES AND MEASURED VALUES Start second line here.", "An open component provides NO path for current flow................................................ !%15 mA Ir3 1 mA !%16 mA An open component provides NO path for current flow....", "Term Calculated Measured AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "Ir2 2 mA Ir3 1 mA AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "2.48 mAmA AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "0.0 mAmA mA AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"], "jumps": []}, {"id": "P13450", "text": ["In a series-parallel circuit: An open in a series component stops current flow in the entire circuit. An open in a parallel component decreases total current. Current will not flow in the branch that is open.", "In a series-parallel circuit: An open in a series component stops current in the entire circuit. An open in a parallel component decreases total current. There is no current in the open branch."], "jumps": []}, {"id": "P13460", "text": ["In step 3 of the troubleshooting procedure you can make additional measurements to prove which component is faulted. Let's make resistance measurements to prove that R3 is open."], "jumps": []}, {"id": "P13470", "text": ["1. Press Enter to set: PC1 DC Power Switch - OFFFFF......................"], "jumps": []}, {"id": "P13480", "text": ["2. Set your multimeter to measure resistance."], "jumps": []}, {"id": "P13490", "text": ["3. Set switches S1, S2, and S3 to the OUT (Down) position. Check that S4 and S5 are also in the OUT (Down) position."], "jumps": []}, {"id": "P13495", "text": ["SWITCH POSITIONS - S1 - OUT S4 - OUT S2 - OUT S5 - OUT S3 - OUT"], "jumps": []}, {"id": "P13500", "text": ["4. Place the test leads on TP3 and TP5. Which resistor are you measuring?"], "jumps": []}, {"id": "P13501", "text": [], "jumps": []}, {"id": "P13502", "text": ["Look at the schematic of circuit A drawn on PC130- 9A card. Trace the line between TP3 and TP5. The resistor between the test points is the resistor you are measuring."], "jumps": []}, {"id": "P13505", "text": ["TEST LEAD PLACEMENT - The negative test lead shown on TP3 and the positive test lead shown on TP5."], "jumps": []}, {"id": "P13510", "text": ["Measure resistor R3. What is the resistance indicated on your multimeter? Your answer must be in ohms."], "jumps": ["P13514"]}, {"id": "P13511", "text": [], "jumps": []}, {"id": "P13512", "text": ["Your answer is incorrect. ...........", "Check the following and take the measurement again: - Place PC1 DC Power switch OFF. - Set multimeter to measure resistance. - Open Circuit A by placing S1 to OUT, S2 to OUT, and S3 to OUT. - Disable Circuit B & C by placing S4 and S5 to OUT. - Check multimeter lead placement..ck multimeter lead placement."], "jumps": []}, {"id": "P13514", "text": ["Your answer is not acceptable. The value entered is very close to the calculated value. The fault contained in this circuit will not provide an indication equal to the value entered. If your meter indicates infinity, type OL, MAX, or INF. Measure the resistance again!"], "jumps": []}, {"id": "P13517", "text": ["Your answer is still incorrect. You should have measured infinity W."], "jumps": ["PutVar"]}, {"id": "P13520", "text": ["Note, that your resistance measurement proves that R3 is open.", "Resistor Measured AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "R3 AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "1 ohmsms ohms AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"], "jumps": []}, {"id": "P13530", "text": ["6. Remove the printed circuit card PC130- 9A from the console and store store it in its designated area."], "jumps": []}, {"id": "P13540", "text": ["7. Shut off the multimeter. ....."], "jumps": []}, {"id": "P13560", "text": [], "jumps": []}, {"id": "P13570", "text": ["Step 3 of the troubleshooting procedure is complete. You have determined that R3 is open. You are ready to perform the final step of the troubleshooting procedure."], "jumps": []}, {"id": "P13580", "text": ["Step 4: Recheck the Circuit On the job you would replace R3 with a known good resistor and recheck the circuit for normal operation."], "jumps": ["P13590"]}, {"id": "P13590", "text": ["To verify your findings, redraw the circuit using the values of the faulted component."], "jumps": []}, {"id": "P13600", "text": ["Redrawing circuit A with R3 open verifies your measurements in step 3."], "jumps": []}, {"id": "P13910", "text": ["This completes the experiment on OPEN COMPONENTS."], "jumps": []}, {"id": "P14040", "text": ["This experiment demonstrates how to troubleshoot a series-parallel circuit to identify a shorted component.", "GOOD COMPONENT resistance = ohmic valueeeeeeeeeeee", "STARTING TO SHORT resistance decreasessssssssssssssssss", "SHORTED minimum resistance sss"], "jumps": []}, {"id": "P14045", "text": ["You learned that a shorted component occurs when there is no resistance to current. This experiment demonstrates the effect of a shorted component in a series-parallel circuit."], "jumps": []}, {"id": "P14070", "text": ["Pick up the PC130 - 9A card. You will use series-parallel circuit A."], "jumps": []}, {"id": "P14080", "text": ["Place switches S1, S2, and S3 on PC130 - 9A to IN (Up), switches S4 and S5 to the OUT (Down) position."], "jumps": []}, {"id": "P14090", "text": ["This experiment follows the four step troubleshooting procedure. Let's begin."], "jumps": []}, {"id": "P14100", "text": ["Step 1: Analyze the circuit The series-parallel circuit is very simple. To determine normal operation, compare calculated to measured c circuit values."], "jumps": []}, {"id": "P14105", "text": ["Let's start by calculating the current for circuit A."], "jumps": []}, {"id": "P14110", "text": ["Calculate total current for circuit A with an applied voltage of 12 V."], "jumps": []}, {"id": "P14111", "text": [], "jumps": []}, {"id": "P14120", "text": ["Now, you need to measure the total current in circuit A to see if your calculations match the measured values."], "jumps": []}, {"id": "P14130", "text": ["1. Set the test console controls to the initial control settings."], "jumps": []},
