er will now short one of the components in circuit A."], "jumps": []}, {"id": "P14235", "text": ["Repeat step 1 of the troubleshooting procedure. Do not calculate the expected current again. You know it should be 3 mA. Current measurements determine if the circuit is faulted."], "jumps": []}, {"id": "P14250", "text": ["Step 1: Analyze the circuit 1. Check that the Positive Supply Voltage is set to 12 V. The light next to 12 on the Positive Power Supply should be illuminated. ted."], "jumps": []}, {"id": "P14260", "text": ["2. Make sure that your multimeter is still set to measure DC current."], "jumps": []}, {"id": "P14270", "text": ["3. Check that PC1 DC Power switch is ON."], "jumps": []}, {"id": "P14280", "text": ["4. Place the negative test lead on TP3 and the positive test lead on TP2."], "jumps": []}, {"id": "P14290", "text": ["5. Check that switch S1 is set to the OUT (Down) position."], "jumps": []}, {"id": "P14300", "text": ["6. Measure the total current. What is the measured current in circuit A? Your answer must be in milliamps."], "jumps": ["P14303"]}, {"id": "P14301", "text": [], "jumps": []}, {"id": "P14303", "text": ["Your answer is incorrect. .......................", "Check the following and take the measurement again: - Place PC1 DC Power switch ON. - Set multimeter to measure Current. - Break Circuit A by placing S1 to OUT, S2 to IN, S3 to IN. - Disable Circuit B & C by placing S4 and S5 to OUT. - Check multimeter lead placement....."], "jumps": []}, {"id": "P14307", "text": ["Your answer is still incorrect. You should have measured approximately 6 mA."], "jumps": ["PutVar"]}, {"id": "P14310", "text": ["Comparing the calculated and measured values of circuit A shows that this circuit is NOT operating properly."], "jumps": []}, {"id": "P14320", "text": ["This completes step 1 of the troubleshooting procedure. Let's go on to step 2."], "jumps": []}, {"id": "P14330", "text": ["Step 2: Check the setup Check that the Positive Supply Voltage is set to 12 V. The light next to 12 on the Positive Power Supply should be illuminated. Check your multimeter to be sure that you are reading DC current."], "jumps": []}, {"id": "P14340", "text": ["A check of the setup should indicate that everything is set properly. Proceed to step 3 of the troubleshooting procedure."], "jumps": []}, {"id": "P14350", "text": ["Step 3: Calculate & measure values You know that total current increased. When a component shorts, total current increases because total resistance decreases."], "jumps": []}, {"id": "P14360", "text": ["Remember, if a parallel component shorts, the total resistance of the circuit decreases and the voltage drop across the parallel resistor equals zero."], "jumps": []}, {"id": "P14370", "text": ["If a series component shorts, the total resistance of the circuit decreases and the voltage drop across the series resistor equals zero."], "jumps": []}, {"id": "P14380", "text": ["Make voltage measurements to determine if a series or parallel component is at fault."], "jumps": []}, {"id": "P14384", "text": ["Calculate the following for the parallel branch of circuit A. EA = 12 V"], "jumps": []}, {"id": "P14385", "text": [], "jumps": []}, {"id": "P14386", "text": ["Your 3 tries are finished. You should have calculated these circuit values....K\" with \"OK\""], "jumps": []}, {"id": "P14390", "text": ["1. Set your multimeter to measure DC voltage."], "jumps": []}, {"id": "P14400", "text": ["2. Place switch S1, S2 and S3 to the IN (Up) position. Check that S4 and S5 are set to the OUT (Down) position."], "jumps": []}, {"id": "P14410", "text": ["3. Place the negative test lead on TP6 and the positive test lead on TP3. Note that your meter is placed across the parallel circuit of R2 and R3."], "jumps": []}, {"id": "P14420", "text": ["4. Measure the voltage drop in the parallel circuit. What is the measured voltage drop of R2 and R3? Your answer must be in volts."], "jumps": ["P14423"]}, {"id": "P14421", "text": [], "jumps": []}, {"id": "P14423", "text": ["Your answer is incorrect. ...........................", "Check the following and take the measurement again: - Ensure PC1 DC Power switch is illuminated. - Set multimeter to measure voltage. - Enable Circuit A by placing S1, S2 and S3 to IN. - Disable Circuit B & C by placing S4 and S5 to OUT. - Check multimeter lead placement............ - Check multimeter lead placement."], "jumps": []}, {"id": "P14427", "text": ["Your answer is still incorrect. You should have measured 0 V across R2 and R3."], "jumps": ["PutVar"]}, {"id": "P14430", "text": ["5. Place the negative test lead on TP2 and the positive test lead on TP1. Note that your meter is placed across the series resistor R1."], "jumps": []}, {"id": "P14440", "text": ["6. Measure the voltage drop. What is the measured voltage drop across R1? Your answer must be in volts."], "jumps": ["P14443"]}, {"id": "P14441", "text": [], "jumps": []}, {"id": "P14443", "text": ["Your answer is incorrect. ...........................", "Check the following and take the measurement again: - Place PC1 DC Power switch ON. - Set multimeter to measure voltage. - Enable Circuit A by placing S1, S2, S3 to IN. - Disable Circuit B & C by placing S4 and S5 to OUT. - Check multimeter lead placement.lacing S4 and S5 to OUT. - Check multimeter lead placement."], "jumps": []}, {"id": "P14447", "text": ["Your answer is still incorrect. You should have measured approximately 12 V."], "jumps": ["PutVar"]}, {"id": "P14450", "text": ["Compare the calculated and measured voltage drops.", "Term Calculated Measured AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "Vr2 & Vr3 6 V Vr1 6 V AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "0.0 V V AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "12.0 VV AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "The voltage drop of the series branch, R1, measures the applied voltage. The voltage drop of the parallel branch, R2 and R3, measures 0V..........."], "jumps": []}, {"id": "P14460", "text": ["These results indicate that either R1 is open or a component in the parallel branch is shorted."], "jumps": []}, {"id": "P14470", "text": ["Make resistance measurements to determine which component is faulted. Remember, if the shorted component is in the parallel branch, all parallel component resistances should be checked to determine which component is faulted and that only one component is faulted."], "jumps": []}, {"id": "P14490", "text": ["1. Press Enter to set: PC1 DC Power Switch - OFFFFFFF..........................."], "jumps": []}, {"id": "P14500", "text": ["2. Set your multimeter to measure resistance."], "jumps": []}, {"id": "P14505", "text": ["3. Set switch S1, S2 and S3 to the OUT (Down) position. Check that S4 and S5 are in the OUT (Down) position."], "jumps": []}, {"id": "P14510", "text": ["4. Place the multimeter test leads on TP1 and TP2. What is the measured resistance value of R1?"], "jumps": ["P14512"]}, {"id": "P14511", "text": [], "jumps": []}, {"id": "P14512", "text": ["Your answer is incorrect. ...............................", "Check the following and take the measurement again: - Ensure PC1 DC Power switch is NOT illuminated. - Set multimeter to measure resistance. - Open Circuit A by placing S1, S2, and S3 to OUT. - Disable Circuit B & C by placing S4 and S5 to OUT. - Check multimeter lead placement.. - Check multimeter lead placement."], "jumps": []}, {"id": "P14517", "text": ["Your answer is still incorrect. You should have measured approximately 2 kW across R1."], "jumps": ["PutVar"]}, {"id": "P14519", "text": ["The measured value of R1 shows that it is not an open component. The next step is to measure the resistance of the components in the parallel branch."], "jumps": []}, {"id": "P14520", "text": ["5. Place the multimeter test leads on TP3 and TP4. What is the measured resistance of R2?"], "jumps": ["P14522"]}, {"id": "P14521", "text": [], "jumps": []}, {"id": "P14522", "text": ["Your answer is incorrect. ..........................", "Check the following and take the measurement again: - Ensure PC1 DC Power switch is NOT illuminated. - Set multimeter to measure resistance. - Open Circuit A by placing S1, S2, and S3 to OUT. - Disable Circuit B & C by placing S4, and S5 to OUT. - Check multimeter lead placement.... - Check multimeter lead placement."], "jumps": []}, {"id": "P14527", "text": ["Your answer is still incorrect. You should have measured approximately 3 kW across R2."], "jumps": ["PutVar"]}, {"id": "P14529", "text": ["The measured value of R2 shows that it is not the shorted component. The next step is to measure the resistance of the other component in the parallel branch."], "jumps": []}, {"id": "P14530", "text": ["6. Place the multimeter test leads on TP3 and TP5. What is the measured resistance of R3? Your answer must be in ohms."], "jumps": ["P14532"]}, {"id": "P14531", "text": [], "jumps": []}, {"id": "P14532", "text": ["Your answer is incorrect. ........................", "Check the following and take the measurement again: - Ensure PC1 DC Power switch is NOT illuminated. - Set multimeter to measure resistance. - Open Circuit A by placing S1, S2, and S3 to OUT. - Disable Circuit B & C by placing S4, and S5 to OUT. - Check multimeter lead placement.... - Check multimeter lead placement."], "jumps": []}, {"id": "P14537", "text": ["Your answer is still incorrect. You should have measured approximately 0 W across R3."], "jumps": ["PutVar"]}, {"id": "P14540", "text": ["Notice that your resistance measurements prove R3 is shorted.", "Resistor Measurement AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "R1 R2 R3 AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "1.96 k ohms AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "2.96 k ohms AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "0.0 ohms AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"], "jumps": []}, {"id": "P14550", "text": ["7. Remove the printed circuit card PC130- 9A from the console and store it in its designated area. !"], "jumps": []}, {"id": "P14560", "text": ["8. Shut off the multimeter. ....."], "jumps": []}, {"id": "P14580", "text": [], "jumps": []}, {"id": "P14590", "text": ["Step 3 of the troubleshooting procedure is complete. You have determined that R3 is shorted. You are ready to perform the final step of the troubleshooting procedure."], "jumps": []}, {"id": "P14600", "text": ["Step 4: Recheck the circuit You have identified the faulted component. On the job you would replace R3 with a known good resistor and recheck the circuit for normal operation."], "jumps": ["P14610"]}, {"id": "P14610", "text": ["To verify your findings, redraw the circuit using the values of the faulted component."], "jumps": []}, {"id": "P14620", "text": ["Redrawing circuit A with R3 shorted shows that total resistance decreased to 2 k W, increasing total current to 6 mA. This verifies your measurements in step 3."], "jumps": []}, {"id": "P14910", "text": ["This completes the experiment on SHORTED COMPONENTS."], "jumps": []}, {"id": "P15040", "text": ["This experiment demonstrates how to troubleshoot a series-parallel circuit to identify a changed value component. Set Test Console main power ON.", "GOOD COMPONENT resistance = ohmic valueeeeeeeeeeee", "DECREASED RESISTANCE current increasessssssssss", "INCREASED RESISTANCE current decreases"], "jumps": []}, {"id": "P15045", "text": ["You learned that a changed value occurs when a component increases or decreases in ohmic value. This experiment demonstrates the effect of a changed value component in a series-parallel circuit."], "jumps": []}, {"id": "P15070", "text": ["Pick up the PC130- 9A card. You will use series-parallel circuit C."], "jumps": []}, {"id": "P15080", "text": ["Place switches S1, S2, and S3 and S4 on PC130- 9A to OUT (Down), S5 to the IN (Up) position."], "jumps": []}, {"id": "P15090", "text": ["This experiment follows the four step troubleshooting procedure. Let's begin."], "jumps": []}, {"id": "P15100", "text": ["Step 1: Analyze the circuit The series-parallel circuit is very simple. To determine normal operation, compare calculated to measured circuit values."], "jumps": []}, {"id": "P15105", "text": ["Let's start by calculating the current for circuit C."], "jumps": []}, {"id": "P15110", "text": ["Calculate total current for circuit C with an applied voltage of 12 V."], "jumps": []}, {"id": "P15111", "text": [], "jumps": []}, {"id": "P15120", "text": ["Now, you need to measure the total current in circuit C to see if your calculations match the measured values."], "jumps": []}, {"id": "P15130", "text": ["1. Set the test console controls to the initial control settings."], "jumps": []}, {"id": "P15140", "text": ["2. Carefully plug PC130- 9A into the test console PC1 position.", "EXPERIMENT CARD PLACEMENT - PC130- 9A shown in PC1 position. Start second line here."], "jumps": []}, {"id": "P15150", "text": ["3. Press Enter to set: Positive Supply Voltage - 12222...................................."], "jumps": []}, {"id": "P15160", "text": ["4. Set your multimeter to measure DC current."], "jumps": []}, {"id": "P15170", "text": ["5. Press Enter to set: PC1 DC Power Switch - ONNN.............................."], "jumps": []}, {"id": "P15180", "text": ["6. Place the negative test lead on TP13 and the positive test lead on TP12. Note that your meter is placed across switch S5."], "jumps": []}, {"id": "P15185", "text": ["TEST LEAD PLACEMENT - The negative test lead is shown on TP13 and the positive test lead is shown on TP12."], "jumps": []}, {"id": "P15190", "text": ["7. Place switch S5 to the OUT (Down) position."], "jumps": []}, {"id": "P15195", "text": ["MEASUREMENT SETUP - S1 - OUT S4 - OUT S2 - OUT S5 - OUT S3 - OUT"], "jumps": []}, {"id": "P15200", "text": ["8. Measure the total current. What is the measured current in circuit C? Your answer must be in milliamps."], "jumps": []}, {"id": "P15201", "text": [], "jumps": []}, {"id": "P15203", "text": ["Your answer is incorrect. .............................", "Check the following and take the measurement again: - Ensure PC1 DC Power switch is illuminated. - Set multimeter to measure current. - Break Circuit C by placing S5 to OUT. - Disable Circuit A & B by placing S1, S2, S3 and S4 to OUT. - Check multimeter lead placement............... - Check multimeter lead placement."], "jumps": []}, {"id": "P15207", "text": ["Your answer is still incorrect. You should have measured approximately 5 mA."], "jumps": ["PutVar"]}, {"id": "P15210", "text": ["Comparing the calculated and measured values of circuit C shows that this circuit is operating properly."], "jumps": []}, {"id": "P15220", "text": ["The results indicate there is no fault in this circuit. Remember, step 1 of the troubleshooting procedure is the only step when no fault is indicated."], "jumps": []}, {"id": "P15230", "text": ["The computer will now change a component value in circuit C."], "jumps": []}, {"id": "P15235", "text": ["Repeat step 1 of the troubleshooting procedure. Do not calculate the expected current again. You know it should be 5 mA. Current measurements determine if the circuit is faulted."], "jumps": []}, {"id": "P15250", "text": ["Step 1: Analyze the circuit 1. Check that the Positive Supply Voltage is set to 12 V. The light next to 12 on the Positive Power Supply should be illuminated. ted."], "jumps": []}, {"id": "P15260", "text": ["2. Make sure that your multimeter is still set to measure DC current."], "jumps": []}, {"id": "P15270", "text": ["3. Check that PC1 DC Power switch is ON."], "jumps": []}, {"id": "P15280", "text": ["4. Place the negative test lead on TP13 and the positive test lead on TP12."], "jumps": []}, {"id": "P15290", "text": ["5. Check that switch S5 is set to the OUT (Down) position."], "jumps": []}, {"id": "P15300", "text": ["6. Measure the total current. What is the measured current in circuit C? Your answer must be in milliamps."], "jumps": ["P15303"]}, {"id": "P15301", "text": [], "jumps": []}, {"id": "P15303", "text": ["Your answer is incorrect. ..................", "Check the following and take the measurement again: - Ensure PC1 DC Power switch is illuminated. - Set multimeter to measure current. - Break Circuit C by placing S5 to OUT. - Disable Circuit A & B by placing S1, S2, S3 and S4 to OUT. - Check multimeter lead placement............... - Check multimeter lead placement."], "jumps": []}, {"id": "P15307", "text": ["Your answer is still incorrect. You should have measured approximately 8 mA."], "jumps": ["PutVar"]}, {"id": "P15310", "text": ["Comparing the calculated and measured values of circuit C shows that this circuit is NOT operating properly."], "jumps": []}, {"id": "P15320", "text": ["This completes step 1 of the troubleshooting procedure. Let's go on to step 2."], "jumps": []}, {"id": "P15330", "text": ["Step 2: Check the setup Check that the Positive Supply Voltage is set to 12 V. The light next to 12 on the Positive Power Supply should be illuminated. Check your multimeter to be sure that you are reading DC current."], "jumps": []}, {"id": "P15340", "text": ["A check of the setup should indicate that everything is set properly. Proceed to step 3 of the troubleshooting procedure."], "jumps": []}, {"id": "P15350", "text": ["Step 3: Calculate & measure values You have determined that total current has increased. You can not determine which component is faulty because if any of the three resistors decreased in value, total current would increase."], "jumps": []}, {"id": "P15360", "text": ["You must make additional measurements to determine which component has changed value. Make resistance measurements of circuit C to identify the faulty component."], "jumps": []}, {"id": "P15365", "text": ["Calculate the resistance of series resistor R7 and the equivalent resistance (Req) of parallel resistors R8 and R9."], "jumps": []}, {"id": "P15366", "text": ["FORMULAS REQUIRED FORMULAS REQUIRED Start second line here."], "jumps": []}, {"id": "P15367", "text": [], "jumps": []}, {"id": "P15368", "text": ["Your 3 tries are finished. You should have calculated these circuit values... You have determined that total current has increased. You can not determine which component is faulty because if any of the three resistors decreased in value, total current would increase."], "jumps": []}, {"id": "P15370", "text": ["1. Press Enter to set: PC1 DC Power Switch - OFFFFF..............................."], "jumps": []}, {"id": "P15380", "text": ["2. Set your multimeter to measure resistance."], "jumps": []}, {"id": "P15390", "text": ["3. Check that switches S1, S2, S3, S4 and S5 are in the OUT (Down) position."], "jumps": []}, {"id": "P15400", "text": ["4. Place the test leads on TP11 & TP12. Which resistor are you measuring?"], "jumps": []}, {"id": "P15401", "text": [], "jumps": []}, {"id": "P15402", "text": ["Look at the schematic of circuit C drawn on PC130- 9A card. Trace the line between TP11 and TP12. The resistor between the test points is the resistor you are measuring."], "jumps": []}, {"id": "P15405", "text": ["TEST LEAD PLACEMENT - The black test lead is shown on TP11 and the positive test lead is shown on TP12."], "jumps": []}, {"id": "P15410", "text": ["5. Measure resistor R7. What is the resistance indicated on your multimeter? Your answer must be in ohms."], "jumps": ["P15414"]}, {"id": "P15411", "text": [], "jumps": []}, {"id": "P15412", "text": ["Your answer is incorrect. .....................", "Check the following and take the measurement again: - Ensure that PC1 DC Power switch is NOT illuminated. - Set multimeter to measure resistance. - Open Circuit C by placing S5 to OUT. - Disable Circuit A & B by placing S1, S2, S3 and S4 to OUT. - Check multimeter lead placement.."], "jumps": []}, {"id": "P15414", "text": ["Your answer is not acceptable. The value entered is very close to the calculated value. The fault contained in this circuit will not provide an indication equal to the value entered."], "jumps": []}, {"id": "P15417", "text": ["Your answer is still incorrect. You should have measured approximately 600 W ."], "jumps": ["PutVar"]}, {"id": "P15420", "text": ["6. Place the test leads on TP13 & TP14. Which resistor(s) are you measuring?"], "jumps": []}, {"id": "P15421", "text": [], "jumps": []}, {"id": "P15422", "text": ["Look at the schematic of circuit C drawn on PC130 - 9A card. Trace the line between TP13 and TP14. The resistors between the test points are the resistors you are measuring."], "jumps": []}, {"id": "P15423", "text": ["Look at the schematic of circuit C drawn on PC130 - 9A card. There are two resistors in parallel between TP13 and TP14. You are measuring the total resistance of these two resistors."], "jumps": []}, {"id": "P15425", "text": ["TEST LEAD PLACEMENT - The negative test lead is shown on TP13 and the positive test lead is shown on TP14."], "jumps": []}, {"id": "P15430", "text": ["7. Measure the resistance of R8 & R9. What is the resistance indicated on your multimeter? Your answer must be in ohms."], "jumps": ["P15432"]}, {"id": "P15431", "text": [], "jumps": []}, {"id": "P15432", "text": ["Your answer is incorrect. ..........................", "Check the following and take the measurement again: - Ensure PC1 DC Power switch is NOT illuminated. - Set multimeter to measure resistance. - Open Circuit C by placing S5 to OUT. - Disable Circuit A & B by placing S1, S2, S3 and S4 to OUT. - Check multimeter lead placement......... - Check multimeter lead placement."], "jumps": []}, {"id": "P15437", "text": ["Your answer is still incorrect. You should have measured approximately 900 W."], "jumps": ["PutVar"]}, {"id": "P15450", "text": ["Compare the calculated and measured values of circuit C resistors.", "Term Calculated Measured AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "R7 1.5 kW R8 & R9 0.9 kW AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "590.0 Ohms AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "880.0 Ohms AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"], "jumps": []}, {"id": "P15460", "text": ["These results indicate that you have a changed value component in this circuit. Which component has changed value?"], "jumps": []}, {"id": "P15461", "text": [], "jumps": []}, {"id": "P15462", "text": ["A changed value component increases or decreases in resistance. Compare your calculated and measured values and try the question again.", "Term Calculated Measured AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "R7 1.5 kW R8 & R9 0.9 kW AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "590.0 Ohms AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "880.0 Ohms AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"], "jumps": []}, {"id": "P15465", "text": ["CALCULATED AND MEASURED VALUES D MEASURED VALUES Start second line here.", "Term Calculated Measured AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "R7 1.5 kW R8 & R9 0.9 kW AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "590.0 Ohmss AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "880.0 Ohms AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"], "jumps": []}, {"id": "P15470", "text": ["8. Remove the printed circuit card PC130- 9A from the console and store it in its designated area."], "jumps": []}, {"id": "P15480", "text": ["9. Shut off the multimeter. ......"], "jumps": []}, {"id": "P15500", "text": [], "jumps": []}, {"id": "P15510", "text": ["Step 3 of the troubleshooting procedure is complete. You have determined that R7 changed value. You are ready to perform the final step of the troubleshooting procedure."], "jumps": []}, {"id": "P15520", "text": ["Step 4: Recheck the circuit You have identified the faulted component. On the job you would replace R7 with a known good resistor and recheck the circuit for normal operation."], "jumps": ["P15530"]}, {"id": "P15530", "text": ["To verify your findings, redraw the circuit using the values of the faulted component."], "jumps": ["P15540"]}, {"id": "P15540", "text": ["Redrawing circuit C with R7 changed value shows that total resistance decreased to .6 kW, increasing total current to 8 mA. This verifies your measurements in step 3."], "jumps": []}, {"id": "P15910", "text": ["This completes the experiment on CHANGED VALUE COMPONENT."], "jumps": []}, {"id": "P16040", "text": ["This experiment demonstrates how to troubleshoot a series-parallel circuit to identify an open component.", "GOOD COMPONENT resistance = ohmic valueeeeeeeeeeee", "STARTING TO OPEN resistance increasesssssssssssssssssss", "OPEN maximum resistance sss"], "jumps": []}, {"id": "P16045", "text": ["You learned that an open occurs when a component provides no path for current. This experiment demonstrates the effect of an open component in a series-parallel circuit."], "jumps": []}, {"id": "P16070", "text": ["Pick up the PC130 - 9A card. You will use series-parallel circuit A."], "jumps": []}, {"id": "P16080", "text": ["Place switches S1, S2, and S3 on PC130 - 9A to IN (Up), switches S4 and S5 to the OUT (Down) position. 1"], "jumps": []}, {"id": "P16090", "text": ["This experiment follows the four step troubleshooting procedure. Let's begin."], "jumps": []}, {"id": "P16100", "text": ["Step 1: Analyze the circuit The series-parallel circuit is very simple. To determine normal operation, compare calculated to measured circuit values."], "jumps": []}, {"id": "P16105", "text": ["Let's start by calculating the current for circuit A."], "jumps": []}, {"id": "P16110", "text": ["Calculate total current for circuit A with an applied voltage of 12 V."], "jumps": []}, {"id": "P16111", "text": [], "jumps": []}, {"id": "P16112", "text": ["1. Calculate equivalent resistance for the parallel branch (Req). 2. Total resistance equals series resistance plus Req. 3. Use the formula for current.", "R1 x R2 Req = R1 + R2 R21 + R2 R1 + R2222", "Rt = Req + Series Resistance R21 + R2 R1 + R2222", "V It = Rt R21 + R2 R1 + R2222"], "jumps": []}, {"id": "P16115", "text": ["TOTAL CURRENT 1. Calculate equivalent resistance for the parallel branch (Req). 2. Total resistance equals series resistance plus Req. 3. Use the formula for current.", "R1 x R2 Req = R1 + R2 R21 + R2 R1 + R2222", "Rt = Req + Series Resistance R21 + R2 R1 + R2222", "V It = Rt R21 + R2 R1 + R2222"], "jumps": []}, {"id": "P16120", "text": ["Now, you need to measure the total current in circuit A to see if your calculations match the measured values."], "jumps": []}, {"id": "P16130", "text": ["1. Set the test console controls to the initial control settings."], "jumps": []}, {"id": "P16140", "text": ["2. Carefully plug PC130- 9A into the test console PC position."], "jumps": []}, {"id": "P16150", "text": ["3. Press Enter to set: Voltage Select - 122222222222222................................."], "jumps": []}, {"id": "P16160", "text": ["4. Set your multimeter to measure DC current."], "jumps": []}, {"id": "P16170", "text": ["5. Press Enter to set: DC Power - ONNNNNNNNNNNNNNN.............................."], "jumps": []}, {"id": "P16180", "text": ["6. Place the negative test lead on TP3 and the positive test lead on TP2. Note that your meter is placed across switch S1."], "jumps": []}, {"id": "P16185", "text": ["TEST LEAD PLACEMENT - The negative test lead shown on TP3 and the the positive test lead shown on TP2."], "jumps": []}, {"id": "P16190", "text": ["7. Place switch S1 to the OUT (Down) position."], "jumps": []}, {"id": "P16195", "text": ["MEASUREMENT SETUP - S1 - OUT S4 - OUT S2 - IN S5 - OUT S3 - IN"], "jumps": []}, {"id": "P16200", "text": ["8. Measure the total current. What is the measured current in circuit A? Your answer must be in milliamps."], "jumps": ["P16203"]}, {"id": "P16201", "text": [], "jumps": []}, {"id": "P16203", "text": ["Your answer is not acceptable. ....................", "Check the following and take the measurement again: - Ensure that DC Power is illuminated. - Set multimeter to measure current. - Break Circuit A by placing S1 to OUT, S2 to IN, and S3 to IN. - Disable Circuit B & C by placing S4 and S5 to OUT. - Check multimeter lead placement............ multimeter lead placement."], "jumps": []}, {"id": "P16207", "text": ["Your answer is still incorrect. You should have measured approximately 3 mA."], "jumps": ["PutVar"]}, {"id": "P16210", "text": ["Comparing the calculated and measured values of circuit A shows that this circuit is operating properly."], "jumps": []}, {"id": "P16220", "text": ["The results indicate there is no fault in this circuit. Remember, step 1 of the troubleshooting procedure is the only step when no fault is indicated."], "jumps": []}, {"id": "P16230", "text": ["The computer will now open one of the components in circuit A."], "jumps": []}, {"id": "P16235", "text": ["Repeat step 1 of the troubleshooting procedure. Do not calculate the expected current again. You know it should be 3 mA. Current measurements determine if the circuit is faulted."], "jumps": []}, {"id": "P16250", "text": ["Step 1: Analyze the circuit 1. Check that the Voltage Select is set to 12 V. The light next to 12 should be illuminated. illuminated."], "jumps": []}, {"id": "P16260", "text": ["2. Make sure that your multimeter is still set to measure DC current."], "jumps": []}, {"id": "P16270", "text": [], "jumps": []}, {"id": "P16280", "text": ["4. Place the negative test lead on TP3 and the positive test lead on TP2."], "jumps": []}, {"id": "P16290", "text": ["5. Check that switch S1 is set to the OUT (Down) position."], "jumps": []}, {"id": "P16300", "text": ["6. Measure the total current. What is the measured current in circuit A? Your answer must be in milliamps."], "jumps": ["P16303"]}, {"id": "P16301", "text": [], "jumps": []}, {"id": "P16303", "text": ["Your answer is incorrect. ........................", "Check the following and take the measurement again: - Check that DC Power is illuminated. - Set multimeter to measure current. - Break Circuit A by placing S1 to OUT, S2 to IN, and S3 to IN. - Disable Circuit B & C by placing S4 and S5 to OUT. - Check multimeter lead placement............k multimeter lead placement."], "jumps": []}, {"id": "P16307", "text": ["Your answer is still incorrect. You should have measured approximately 2.4 mA."], "jumps": ["PutVar"]}, {"id": "P16310", "text": ["Comparing the calculated and measured values of circuit A shows that this circuit is NOT operating properly."], "jumps": []}, {"id": "P16320", "text": ["This completes step 1 of the troubleshooting procedure. Let's go on to step 2."], "jumps": []}, {"id": "P16330", "text": ["Step 2: Check the setup Check that the Voltage Select is set to 12 V. The light next to 12 should be illuminated. Check your multimeter to be sure that you are reading DC current. are reading DC current."], "jumps": []}, {"id": "P16340", "text": ["A check of the setup should indicate that everything is set properly. Proceed to step 3 of the troubleshooting procedure."], "jumps": []}, {"id": "P16350", "text": ["Step 3: Calculate & measure values You have determined that total circuit current has decreased. This eliminates the possibility that R1 is open. If R1 were open, total circuit current would be zero. The probable open is in the parallel components."], "jumps": []}, {"id": "P16360", "text": ["Make current readings for the components in each parallel branch of circuit A, to identify the branch with the fault."], "jumps": []}, {"id": "P16362", "text": ["Calculate the following for the parallel branch of circuit A."], "jumps": []}, {"id": "P16363", "text": [], "jumps": []}, {"id": "P16364", "text": ["Your 3 tries are finished. You should have calculated these circuit values...\"with \"OK\"te that your meter is placed across switch S2."], "jumps": []}, {"id": "P16365", "text": ["FORMULAS REQUIRED FORMULAS REQUIRED tart second line here.", "R1 x R2 Req = to calculate parallel resistance. R1 + R2 V It = to calculate total current. Rt V = It x Req to calculate parallel voltage. V I = to calculate current of parallel branch. RRRR"], "jumps": []}, {"id": "P16370", "text": ["1. Place the negative test lead on TP6 and the positive test lead on TP4. Note that your meter is placed across switch S2."], "jumps": []}, {"id": "P16375", "text": ["TEST LEAD PLACEMENT - The negative test lead is shown on TP6 and the positive test lead is shown on TP4."], "jumps": []}, {"id": "P16380", "text": ["2. Place switch S1 to the IN (Up) position and switch S2 to the OUT (Down) position."], "jumps": []}, {"id": "P16385", "text": ["MEASUREMENT SETUP - S1 - IN S4 - OUT S2 - OUT S5 - OUT S3 - IN"], "jumps": []}, {"id": "P16390", "text": ["3. Measure the current through R2. What is the measured current across R2 of circuit A? Your answer must be in milliamps."], "jumps": ["P16393"]}, {"id": "P16391", "text": [], "jumps": []}, {"id": "P16393", "text": ["Your answer is incorrect. ..........", "Check the following and take the measurement again: - Ensure DC Power is illuminated. - Set multimeter to measure current. - Break Circuit A by placing S1 to IN, S2 to OUT, and S3 to IN. - Disable Circuit B & C by placing S4 and S5 to OUT. - Check multimeter lead placement............ Check multimeter lead placement."], "jumps": []}, {"id": "P16397", "text": ["Your answer is still incorrect. You should have measured approximately 2.4 mA."], "jumps": ["PutVar"]}, {"id": "P16400", "text": ["4. Place the negative test lead on TP6 and the positive test lead on TP5. Note that your meter is placed across switch S3."], "jumps": []}, {"id": "P16405", "text": ["TEST LEAD PLACEMENT - The negative test lead is shown on TP6 and the positive test lead is shown on TP5."], "jumps": []}, {"id": "P16410", "text": ["5. Place switch S2 to the IN (Up) position and switch S3 to the OUT (Down) position."], "jumps": []}, {"id": "P16415", "text": ["MEASUREMENT SETUP - S1 - IN S4 - OUT S2 - IN S5 - OUT S3 - OUT"], "jumps": []}, {"id": "P16420", "text": ["6. Measure the current through R3. What is the measured current across R3 of circuit A? Your answer must be in milliamps."], "jumps": ["P16423"]}, {"id": "P16421", "text": [], "jumps": []}, {"id": "P16423", "text": ["Your answer is incorrect. ........................", "Check the following and take the measurement again: - Ensure DC Power is illuminated. - Set multimeter to measure current. - Break Circuit A by placing S1 to IN, S2 to IN, and S3 to OUT. - Disable Circuit B & C by placing S4 and S5 to OUT. - Check multimeter lead placement............Check multimeter lead placement."], "jumps": []}, {"id": "P16427", "text": ["Your answer is still incorrect. You should have measured approximately 0 mA."], "jumps": ["PutVar"]}, {"id": "P16430", "text": ["Compare the individual branch currents. Note that the current through R3 indicates 0 mA.", "Ir2 2 mA Ir3 1 mA AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "2.4 mAmA AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "0.0 mAmA AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "Term Calculated Measured AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"], "jumps": []}, {"id": "P16440", "text": ["These results indicate that you have an open component in this circuit. Which component is open?"], "jumps": []}, {"id": "P16441", "text": [], "jumps": []}, {"id": "P16442", "text": ["An open component in a parallel circuit shows no current in that branch of the circuit."], "jumps": []}, {"id": "P16445", "text": ["CALCULATED AND MEASURED VALUES AND MEASURED VALUES Start second line here.", "An open component provides NO path for current flow................................................ !%15 mA Ir3 1 mA !%16 mA An open component provides NO path for current flow....", "Term Calculated Measured AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "Ir2 2 mA Ir3 1 mA AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "2.4 mAmA AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "0.0 mAmA mA AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"], "jumps": []}, {"id": "P16450", "text": ["In a series-parallel circuit: An open in a series component stops current flow in the entire circuit. An open in a parallel component decreases total current. Current will not flow in the branch that is open.", "In a series-parallel circuit: An open in a series component stops current in the entire circuit. An open in a parallel component decreases total current. There is no current in the open branch."], "jumps": []}, {"id": "P16460", "text": ["In step 3 of the troubleshooting procedure you can make additional measurements to prove which component is faulted. Let's make resistance measurements to prove that R3 is open."], "jumps": []}, {"id": "P16470", "text": ["1. Press Enter to set: DC Power - OFFFFFFFFFFFFFFFF......................"], "jumps": []}, {"id": "P16480", "text": ["2. Set your multimeter to measure resistance."], "jumps": []}, {"id": "P16490", "text": ["3. Set switches S1, S2, and S3 to the OUT (Down) position. Check that S4 and S5 are also in the OUT (Down) position."], "jumps": []}, {"id": "P16495", "text": ["SWITCH POSITIONS - S1 - OUT S4 - OUT S2 - OUT S5 - OUT S3 - OUT"], "jumps": []}, {"id": "P16500", "text": ["4. Place the test leads on TP3 and TP5. Which resistor are you measuring?"], "jumps": []}, {"id": "P16501", "text": [], "jumps": []}, {"id": "P16502", "text": ["Look at the schematic of circuit A drawn on PC130- 9A card. Trace the line between TP3 and TP5. The resistor between the test points is the resistor you are measuring."], "jumps": []}, {"id": "P16505", "text": ["TEST LEAD PLACEMENT - The negative test lead shown on TP3 and the positive test lead shown on TP5."], "jumps": []}, {"id": "P16510", "text": ["Measure resistor R3. What is the resistance indicated on your multimeter? Your answer must be in ohms."], "jumps": ["P16514"]}, {"id": "P16511", "text": [], "jumps": []}, {"id": "P16512", "text": ["Your answer is incorrect. ...........", "Check the following and take the measurement again: - Place DC Power OFF. - Set multimeter to measure resistance. - Open Circuit A by placing S1 to OUT, S2 to OUT, and S3 to OUT. - Disable Circuit B & C by placing S4 and S5 to OUT. - Check multimeter lead placement.............ck multimeter lead placement."], "jumps": []}, {"id": "P16514", "text": ["Your answer is not acceptable. The value entered is very close to the calculated value. The fault contained in this circuit will not provide an indication equal to the value entered. If your meter indicates infinity, type OL, MAX, or INF. Measure the resistance again!"], "jumps": []}, {"id": "P16517", "text": ["Your answer is still incorrect. You should have measured infinity W."], "jumps": ["PutVar"]}, {"id": "P16520", "text": ["Note, that your resistance measurement proves that R3 is open.", "Resistor Measured AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "R3 AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "1 ohmsms ohms AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"], "jumps": []}, {"id": "P16530", "text": ["6. Remove the printed circuit card PC130- 9A from the console and store store it in its designated area."], "jumps": []}, {"id": "P16540", "text": ["7. Shut off the multimeter. ....."], "jumps": []}, {"id": "P16560", "text": [], "jumps": []}, {"id": "P16570", "text": ["Step 3 of the troubleshooting procedure is complete. You have determined that R3 is open. You are ready to perform the final step of the troubleshooting procedure."], "jumps": []}, {"id": "P16580", "text": ["Step 4: Recheck the Circuit On the job you would replace R3 with a known good resistor and recheck the circuit for normal operation."], "jumps": ["P16590"]}, {"id": "P16590", "text": ["To verify your findings, redraw the circuit using the values of the faulted component."], "jumps": []}, {"id": "P16600", "text": ["Redrawing circuit A with R3 open verifies your measurements in step 3."], "jumps": []}, {"id": "P16910", "text": ["This completes the experiment on OPEN COMPONENTS."], "jumps": []}, {"id": "P17040", "text": ["This experiment demonstrates how to troubleshoot a series-parallel circuit to identify a shorted component.", "GOOD COMPONENT resistance = ohmic valueeeeeeeeeeee", "STARTING TO SHORT resistance decreasessssssssssssssssss", "SHORTED minimum resistance sss"], "jumps": []}, {"id": "P17045", "text": ["You learned that a shorted component occurs when there is no resistance to current. This experiment demonstrates the effect of a shorted component in a series-parallel circuit."], "jumps": []}, {"id": "P17070", "text": ["Pick up the PC130- 9A card. You will use series-parallel circuit A."], "jumps": []}, {"id": "P17080", "text": ["Place switches S1, S2, and S3 on PC130- 9A to IN (Up), switches S4 and S5 to the OUT (Down) position."], "jumps": []}, {"id": "P17090", "text": ["This experiment follows the four step troubleshooting procedure. Let's begin."], "jumps": []}, {"id": "P17100", "text": ["Step 1: Analyze the circuit The series-parallel circuit is very simple. To determine normal operation, compare calculated to measured c circuit values."], "jumps": []}, {"id": "P17105", "text": ["Let's start by calculating the current for circuit A."], "jumps": []}, {"id": "P17110", "text": ["Calculate total current for circuit A with an applied voltage of 12 V."], "jumps": []}, {"id": "P17111", "text": [], "jumps": []}, {"id": "P17120", "text": ["Now, you need to measure the total current in circuit A to see if your calculations match the measured values."], "jumps": []}, {"id": "P17130", "text": ["1. Set the test console controls to the initial control settings."], "jumps": []}, {"id": "P17140", "text": ["2. Carefully plug PC130- 9A into the test console PC position."], "jumps": []}, {"id": "P17150", "text": ["3. Press Enter to set: Voltage Select - 122222222222222................................."], "jumps": []}, {"id": "P17160", "text": ["4. Set your multimeter to measure DC current."], "jumps": []}, {"id": "P17170", "text": ["5. Press Enter to set: DC Power - ONNNNNNNNNNNNNNN.............................."], "jumps": []}, {"id": "P17180", "text": ["6. Place the negative test lead on TP3 and the positive test lead on TP2. Note that your meter is placed across switch S1."], "jumps": []}, {"id": "P17190", "text": ["7. Place switch S1 to the OUT (Down) position."], "jumps": []}, {"id": "P17195", "text": ["MEASUREMENT SETUP - S1 - OUT S4 - OUT S2 - IN S5 - OUT S3 - IN"], "jumps": []}, {"id": "P17200", "text": ["8. Measure the total current. What is the measured current in circuit A? Your answer must be in milliamps."], "jumps": ["P17203"]}, {"id": "P17201", "text": [], "jumps": []}, {"id": "P17203", "text": ["Your answer is incorrect. ..............................", "Check the following and take the measurement again: - Place PC1 DC Power switch ON. - Set multimeter to measure current. - Break Circuit A by placing S1 to OUT, S2 to IN, S3 to IN. - Disable Circuit B & C by placing S4 and S5 to OUT. - Check multimeter lead placement....."], "jumps": []}, {"id": "P17207", "text": ["Your answer is still incorrect. You should have measured approximately 3 mA."], "jumps": ["PutVar"]}, {"id": "P17210", "text": ["Comparing the calculated and measured values of circuit A shows that this circuit is operating properly."], "jumps": []}, {"id": "P17220", "text": ["The results indicate there is no fault in this circuit. Remember, step 1 of the troubleshooting procedure is the only step when no fault is indicated."], "jumps": []}, {"id": "P17230", "text": ["The computer will now short one of the components in circuit A."], "jumps": []}, {"id": "P17235", "text": ["Repeat step 1 of the troubleshooting procedure. Do not calculate the expected current again. You know it should be 3 mA. Current measurements determine if the circuit is faulted."], "jumps": []}, {"id": "P17250", "text": ["Step 1: Analyze the circuit 1. Check that the Voltage Select is set to 12 V. The light next to 12 should be illuminated. illuminated."], "jumps": []}, {"id": "P17260", "text": ["2. Make sure that your multimeter is still set to measure DC current."], "jumps": []}, {"id": "P17270", "text": [], "jumps": []}, {"id": "P17280", "text": ["4. Place the negative test lead on TP3 and the positive test lead on TP2."], "jumps": []}, {"id": "P17290", "text": ["5. Check that switch S1 is set to the OUT (Down) position."], "jumps": []}, {"id": "P17300", "text": ["6. Measure the total current. What is the measured current in circuit A? Your answer must be in milliamps."], "jumps": ["P17303"]}, {"id": "P17301", "text": [], "jumps": []}, {"id": "P17303", "text": ["Your answer is incorrect. .......................", "Check the following and take the measurement again: - Place PC1 DC Power switch ON. - Set multimeter to measure current. - Break Circuit A by placing S1 to OUT, S2 to IN, S3 to IN. - Disable Circuit B & C by placing S4 and S5 to OUT. - Check multimeter lead placement....."], "jumps": []}, {"id": "P17307", "text": ["Your answer is still incorrect. You should have measured approximately 6 mA."], "jumps": ["PutVar"]}, {"id": "P17310", "text": ["Comparing the calculated and measured values of circuit A shows that this circuit is NOT operating properly."], "jumps": []}, {"id": "P17320", "text": ["This completes step 1 of the troubleshooting procedure. Let's go on to step 2."], "jumps": []}, {"id": "P17330", "text": ["Step 2: Check the setup Check that the Voltage Select is set to 12 V. The light next to 12 should be illuminated. Check your multimeter to be sure that you are reading DC current. are reading DC current."], "jumps": []}, {"id": "P17340", "text": ["A check of the setup should indicate that everything is set properly. Proceed to step 3 of the troubleshooting procedure."], "jumps": []}, {"id": "P17350", "text": ["Step 3: Calculate & measure values You know that total current increased. When a component shorts, total current increases because total resistance decreases."], "jumps": []}, {"id": "P17360", "text": ["Remember, if a parallel component shorts, the total resistance of the circuit decreases and the voltage drop across the parallel resistor equals zero."], "jumps": []}, {"id": "P17370", "text": ["If a series component shorts, the total resistance of the circuit decreases and the voltage drop across the series resistor equals zero."], "jumps": []}, {"id": "P17380", "text": ["Make voltage measurements to determine if a series or parallel component is at fault."], "jumps": []}, {"id": "P17384", "text": ["Calculate the following for the parallel branch of circuit A. EA = 12 V"], "jumps": []}, {"id": "P17385", "text": [], "jumps": []}, {"id": "P17386", "text": ["Your 3 tries are finished. You should have calculated these circuit values...... with \"OK\""], "jumps": []}, {"id": "P17390", "text": ["1. Set your multimeter to measure DC voltage."], "jumps": []}, {"id": "P17400", "text": ["2. Place switch S1, S2 and S3 to the IN (Up) position. Check that S4 and S5 are set to the OUT (Down) position."], "jumps": []}, {"id": "P17410", "text": ["3. Place the negative test lead on TP6 and the positive test lead on TP3. Note that your meter is placed across the parallel circuit of R2 and R3."], "jumps": []}, {"id": "P17420", "text": ["4. Measure the voltage drop in the parallel circuit. What is the measured voltage drop of R2 and R3? Your answer must be in volts."], "jumps": ["P17423"]}, {"id": "P17421", "text": [], "jumps": []}, {"id": "P17423", "text": ["Your answer is incorrect. ...........................", "Check the following and take the measurement again: - Ensure DC Power switch is illuminated. - Set multimeter to measure voltage. - Enable Circuit A by placing S1, S2 and S3 to IN. - Disable Circuit B & C by placing S4 and S5 to OUT. - Check multimeter lead placement..nt............ - Check multimeter lead placement."], "jumps": []}, {"id": "P17427", "text": ["Your answer is still incorrect. You should have measured 0 V across R2 and R3."], "jumps": ["PutVar"]}, {"id": "P17430", "text": ["5. Place the negative test lead on TP2 and the positive test lead on TP1. Note that your meter is placed across the series resistor R1."], "jumps": []}, {"id": "P17440", "text": ["6. Measure the voltage drop. What is the measured voltage drop across R1? Your answer must be in volts."], "jumps": ["P17443"]}, {"id": "P17441", "text": [], "jumps": []}, {"id": "P17443", "text": ["Your answer is incorrect. ...........................", "Check the following and take the measurement again: - Ensure DC Power switch is illuminated. - Set multimeter to measure voltage. - Enable Circuit A by placing S1, S2 and S3 to IN. - Disable Circuit B & C by placing S4 and S5 to OUT. - Check multimeter lead placement..nt............ - Check multimeter lead placement."], "jumps": []}, {"id": "P17447", "text": ["Your answer is still incorrect. You should have measured approximately 12 V."], "jumps": ["PutVar"]}, {"id": "P17450", "text": ["Compare the calculated and measured voltage drops.", "Term Calculated Measured AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "Vr2 & Vr3 6 V Vr1 6 V AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "0.0 V V AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "12.3 VV AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "The voltage drop of the series branch, R1, measures the applied voltage. The voltage drop of the parallel branch, R2 and R3, measures 0V..........."], "jumps": []}, {"id": "P17460", "text": ["These results indicate that either R1 is open or a component in the parallel branch is shorted."], "jumps": []}, {"id": "P17470", "text": ["Make resistance measurements to determine which component is faulted. Remember, if the shorted component is in the parallel branch, all parallel component resistances should be checked to determine which component is faulted and that only one component is faulted."], "jumps": []}, {"id": "P17490", "text": ["1. Press Enter to set: DC Power - OFFFFFFFFFFFFFFFFFF..........................."], "jumps": []}, {"id": "P17500", "text": ["2. Set your multimeter to measure resistance."], "jumps": []}, {"id": "P17505", "text": ["3. Set switch S1, S2 and S3 to the OUT (Down) position. Check that S4 and S5 are in the OUT (Down) position."], "jumps": []}, {"id": "P17510", "text": ["4. Place the multimeter test leads on TP1 and TP2. What is the measured resistance value of R1?"], "jumps": ["P17512"]}, {"id": "P17511", "text": [], "jumps": []}, {"id": "P17512", "text": ["Your answer is incorrect. ...............................", "Check the following and take the measurement again: - Ensure that the DC Power switch is NOT illuminated. - Set multimeter to measure resistance. - Open Circuit A by placing S1, S2, and S3 to OUT. - Disable Circuit B & C by placing S4 and S5 to OUT. - Check multimeter lead placement.- Check multimeter lead placement."], "jumps": []}, {"id": "P17517", "text": ["Your answer is still incorrect. You should have measured approximately 2 kW across R1."], "jumps": ["PutVar"]}, {"id": "P17519", "text": ["The measured value of R1 shows that it is not an open component. The next step is to measure the resistance of the components in the parallel branch."], "jumps": []}, {"id": "P17520", "text": ["5. Place the multimeter test leads on TP3 and TP4. What is the measured resistance of R2?"], "jumps": ["P17522"]}, {"id": "P17521", "text": [], "jumps": []}, {"id": "P17522", "text": ["Your answer is incorrect. ..........................", "Check the following and take the measurement again: - Ensure that the DC Power switch is NOT illuminated. - Set multimeter to measure resistance. - Open Circuit A by placing S1, S2, and S3 to OUT. - Disable Circuit B & C by placing S4, and S5 to OUT. - Check multimeter lead placement. Check multimeter lead placement."], "jumps": []}, {"id": "P17527", "text": ["Your answer is still incorrect. You should have measured approximately 3 kW across R2."], "jumps": ["PutVar"]}, {"id": "P17529", "text": ["The measured value of R2 shows that it is not the shorted component. The next step is to measure the resistance of the other component in the parallel branch."], "jumps": []}, {"id": "P17530", "text": ["6. Place the multimeter test leads on TP3 and TP5. What is the measured resistance of R3? Your answer must be in ohms."], "jumps": ["P17532"]}, {"id": "P17531", "text": [], "jumps": []}, {"id": "P17532", "text": ["Your answer is incorrect. ........................", "Check the following and take the measurement again: - Ensure that the DC Power switch is NOT illuminated. - Set multimeter to measure resistance. - Open Circuit A by placing S1, S2, and S3 to OUT. - Disable Circuit B & C by placing S4, and S5 to OUT. - Check multimeter lead placement. Check multimeter lead placement."], "jumps": []}, {"id": "P17537", "text": ["Your answer is still incorrect. You should have measured approximately 0 W across R3."], "jumps": ["PutVar"]}, {"id": "P17540", "text": ["Notice that your resistance measurements prove R3 is shorted.", "Resistor Measurement AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "R1 R2 R3 AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "1.96 k ohms AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "2.96 k ohms AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "0.0 ohms AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"], "jumps": []}, {"id": "P17550", "text": ["7. Remove the printed circuit card PC130- 9A from the console and store it in its designated area. !"], "jumps": []}, {"id": "P17560", "text": ["8. Shut off the multimeter. ....."], "jumps": []}, {"id": "P17580", "text": [], "jumps": []}, {"id": "P17590", "text": ["Step 3 of the troubleshooting procedure is complete. You have determined that R3 is shorted. You are ready to perform the final step of the troubleshooting procedure."], "jumps": []}, {"id": "P17600", "text": ["Step 4: Recheck the circuit You have identified the faulted component. On the job you would replace R3 with a known good resistor and recheck the circuit for normal operation."], "jumps": ["P17610"]}, {"id": "P17610", "text": ["To verify your findings, redraw the circuit using the values of the faulted component."], "jumps": []}, {"id": "P17620", "text": ["Redrawing circuit A with R3 shorted shows that total resistance decreased to 2 k W, increasing total current to 6 mA. This verifies your measurements in step 3."], "jumps": []}, {"id": "P17910", "text": ["This completes the experiment on SHORTED COMPONENTS."], "jumps": []}, {"id": "P18040", "text": ["This experiment demonstrates how to troubleshoot a series-parallel circuit to identify a changed value component. Set Test Console main power ON.", "GOOD COMPONENT resistance = ohmic valueeeeeeeeeeee", "DECREASED RESISTANCE current increasessssssssss", "INCREASED RESISTANCE current decreases"], "jumps": []}, {"id": "P18045", "text": ["You learned that a changed value occurs when a component increases or decreases in ohmic value. This experiment demonstrates the effect of a changed value component in a series-parallel circuit."], "jumps": []}, {"id": "P18070", "text": ["Pick up the PC130- 9A card. You will use series-parallel circuit C."], "jumps": []}, {"id": "P18080", "text": ["Place switches S1, S2, and S3 and S4 on PC130- 9A to OUT (Down), S5 to the IN (Up) position."], "jumps": []}, {"id": "P18090", "text": ["This experiment follows the four step troubleshooting procedure. Let's begin."], "jumps": []}, {"id": "P18100", "text": ["Step 1: Analyze the circuit The series-parallel circuit is very simple. To determine normal operation, compare calculated to measured circuit values."], "jumps": []}, {"id": "P18105", "text": ["Let's start by calculating the current for circuit C."], "jumps": []}, {"id": "P18110", "text": ["Calculate total current for circuit C with an applied voltage of 12 V."], "jumps": []}, {"id": "P18111", "text": [], "jumps": []}, {"id": "P18120", "text": ["Now, you need to measure the total current in circuit C to see if your calculations match the measured values."], "jumps": []}, {"id": "P18130", "text": ["1. Set the test console controls to the initial control settings."], "jumps": []}, {"id": "P18140", "text": ["2. Carefully plug PC130- 9A into the test console PC position."], "jumps": []}, {"id": "P18150", "text": ["3. Press Enter to set: Voltage Select - 12222222222222...................................."], "jumps": []}, {"id": "P18160", "text": ["4. Set your multimeter to measure DC current."], "jumps": []}, {"id": "P18170", "text": ["5. Press Enter to set: DC Power - ONNNNNNNNNNNNNN.............................."], "jumps": []}, {"id": "P18180", "text": ["6. Place the negative test lead on TP13 and the positive test lead on TP12. Note that your meter is placed across switch S5."], "jumps": []}, {"id": "P18185", "text": ["TEST LEAD PLACEMENT - The negative test lead is shown on TP13 and the positive test lead is shown on TP12."], "jumps": []}, {"id": "P18190", "text": ["7. Place switch S5 to the OUT (Down) position."], "jumps": []}, {"id": "P18195", "text": ["MEASUREMENT SETUP - S1 - OUT S4 - OUT S2 - OUT S5 - OUT S3 - OUT"], "jumps": []}, {"id": "P18200", "text": ["8. Measure the total current. What is the measured current in circuit C? Your answer must be in milliamps."], "jumps": []}, {"id": "P18201", "text": [], "jumps": []}, {"id": "P18203", "text": ["Your answer is incorrect. .............................", "Check the following and take the measurement again: - Ensure DC Power is illuminated. - Set multimeter to measure current. - Break Circuit C by placing S5 to OUT. - Disable Circuit A & B by placing S1, S2, S3 and S4 to OUT. - Check multimeter lead placement.......................... - Check multimeter lead placement."], "jumps": []}, {"id": "P18207", "text": ["Your answer is still incorrect. You should have measured approximately 5 mA."], "jumps": ["PutVar"]}, {"id": "P18210", "text": ["Comparing the calculated and measured values of circuit C shows that this circuit is operating properly."], "jumps": []}, {"id": "P18220", "text": ["The results indicate there is no fault in this circuit. Remember, step 1 of the troubleshooting procedure is the only step when no fault is indicated."], "jumps": []}, {"id": "P18230", "text": ["The computer will now change a component value in circuit C."], "jumps": []}, {"id": "P18235", "text": ["Repeat step 1 of the troubleshooting procedure. Do not calculate the expected current again. You know it should be 5 mA. Current measurements determine if the circuit is faulted."], "jumps": []}, {"id": "P18250", "text": ["Step 1: Analyze the circuit 1. Check that the Voltage Select is set to 12 V. The light next to 12 should be illuminated. illuminated."], "jumps": []}, {"id": "P18260", "text": ["2. Make sure that your multimeter is still set to measure DC current."], "jumps": []}, {"id": "P18270", "text": [], "jumps": []}, {"id": "P18280", "text": ["4. Place the negative test lead on TP13 and the positive test lead on TP12."], "jumps": []}, {"id": "P18290", "text": ["5. Check that switch S5 is set to the OUT (Down) position."], "jumps": []}, {"id": "P18300", "text": ["6. Measure the total current. What is the measured current in circuit C? Your answer must be in milliamps."], "jumps": ["P18303"]}, {"id": "P18301", "text": [], "jumps": []}, {"id": "P18303", "text": ["Your answer is incorrect. ..................", "Check the following and take the measurement again: - Ensure DC Power is illuminated. - Set multimeter to measure current. - Break Circuit C by placing S5 to OUT. - Disable Circuit A & B by placing S1, S2, S3 and S4 to OUT. - Check multimeter lead placement.......................... - Check multimeter lead placement."], "jumps": []}, {"id": "P18307", "text": ["Your answer is still incorrect. You should have measured approximately 8 mA."], "jumps": ["PutVar"]}, {"id": "P18310", "text": ["Comparing the calculated and measured values of circuit C shows that this circuit is NOT operating properly."], "jumps": []}, {"id": "P18320", "text": ["This completes step 1 of the troubleshooting procedure. Let's go on to step 2."], "jumps": []}, {"id": "P18330", "text": ["Step 2: Check the setup Check that the Voltage Select is set to 12 V. The light next to 12 should be illuminated. Check your multimeter to be sure that you are reading DC current. are reading DC current."], "jumps": []}, {"id": "P18340", "text": ["A check of the setup should indicate that everything is set properly. Proceed to step 3 of the troubleshooting procedure."], "jumps": []}, {"id": "P18350", "text": ["Step 3: Calculate & measure values You have determined that total current has increased. You can not determine which component is faulty because if any of the three resistors decreased in value, total current would increase."], "jumps": []}, {"id": "P18360", "text": ["You must make additional measurements to determine which component has changed value. Make resistance measurements of circuit C to identify the faulty component."], "jumps": []}, {"id": "P18365", "text": ["Calculate the resistance of series resistor R7 and the equivalent resistance (Req) of parallel resistors R8 and R9."], "jumps": []}, {"id": "P18366", "text": ["FORMULAS REQUIRED FORMULAS REQUIRED Start second line here."], "jumps": []}, {"id": "P18367", "text": [], "jumps": []}, {"id": "P18368", "text": ["Your 3 tries are finished. You should have calculated these circuit values... You have determined that total current has increased. You can not determine which component is faulty because if any of the three resistors decreased in value, total current would increase."], "jumps": []}, {"id": "P18370", "text": ["1. Press Enter to set: DC Power - OFFFFFFFFFFFFFFFF..............................."], "jumps": []}, {"id": "P18380", "text": ["2. Set your multimeter to measure resistance."], "jumps": []}, {"id": "P18390", "text": ["3. Check that switches S1, S2, S3, S4 and S5 are in the OUT (Down) position."], "jumps": []}, {"id": "P18400", "text": ["4. Place the test leads on TP11 & TP12. Which resistor are you measuring?"], "jumps": []}, {"id": "P18401", "text": [], "jumps": []}, {"id": "P18402", "text": ["Look at the schematic of circuit C drawn on PC130- 9A card. Trace the line between TP11 and TP12. The resistor between the test points is the resistor you are measuring."], "jumps": []}, {"id": "P18405", "text": ["TEST LEAD PLACEMENT - The black test lead is shown on TP11 and the positive test lead is shown on TP12."], "jumps": []}, {"id": "P18410", "text": ["5. Measure resistor R7. What is the resistance indicated on your multimeter? Your answer must be in ohms."], "jumps": ["P18414"]}, {"id": "P18411", "text": [], "jumps": []}, {"id": "P18412", "text": ["Your answer is incorrect. .....................", "Check the following and take the measurement again: - Ensure that the DC Power switch is NOT illuminated. - Set multimeter to measure resistance. - Open Circuit C by placing S5 to OUT. - Disable Circuit A & B by placing S1, S2, S3 and S4 to OUT. - Check multimeter lead placement.."], "jumps": []}, {"id": "P18414", "text": ["Your answer is not acceptable. The value entered is very close to the calculated value. The fault contained in this circuit will not provide an indication equal to the value entered."], "jumps": []}, {"id": "P18417", "text": ["Your answer is still incorrect. You should have measured approximately 600 W ."], "jumps": ["PutVar"]}, {"id": "P18420", "text": ["6. Place the test leads on TP13 & TP14. Which resistor(s) are you measuring?"], "jumps": []}, {"id": "P18421", "text": [], "jumps": []}, {"id": "P18422", "text": ["Look at the schematic of circuit C drawn on PC130 - 9A card. Trace the line between TP13 and TP14. The resistors between the test points are the resistors you are measuring."], "jumps": []}, {"id": "P18423", "text": ["Look at the schematic of circuit C drawn on PC130 - 9A card. There are two resistors in parallel between TP13 and TP14. You are measuring the total resistance of these two resistors."], "jumps": []}, {"id": "P18425", "text": ["TEST LEAD PLACEMENT - The negative test lead is shown on TP13 and the positive test lead is shown on TP14."], "jumps": []}, {"id": "P18430", "text": ["7. Measure the resistance of R8 & R9. What is the resistance indicated on your multimeter? Your answer must be in ohms."], "jumps": ["P18432"]}, {"id": "P18431", "text": [], "jumps": []}, {"id": "P18432", "text": ["Your answer is incorrect. ..........................", "Check the following and take the measurement again: - Ensure that the DC Power switch is NOT illuminated. - Set multimeter to measure resistance. - Open Circuit C by placing S5 to OUT. - Disable Circuit A & B by placing S1, S2, S3 and S4 to OUT. - Check multimeter lead placement.... - Check multimeter lead placement."], "jumps": []}, {"id": "P18437", "text": ["Your answer is still incorrect. You should have measured approximately 900 W."], "jumps": ["PutVar"]}, {"id": "P18450", "text": ["Compare the calculated and measured values of circuit C resistors.", "Term Calculated Measured AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "R7 1.5 kW R8 & R9 0.9 kW AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "590.0 Ohms AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "880.0 Ohms AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"], "jumps": []}, {"id": "P18460", "text": ["These results indicate that you have a changed value component in this circuit. Which component has changed value?"], "jumps": []}, {"id": "P18461", "text": [], "jumps": []}, {"id": "P18462", "text": ["A changed value component increases or decreases in resistance. Compare your calculated and measured values and try the question again.", "Term Calculated Measured AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
