ure voltage.", "Your measurements are not acceptable. Ensure you are measuring the correct test points and that your meter is set to measure voltage."], "jumps": []}, {"id": "P2365", "text": ["MEASUREMENT SETUP - S1 to UP position and S5 to POSITIVE. Measuring ER1 at TP6 and TP2. Measuring ED1 at TP1 and TP2."], "jumps": []}, {"id": "P2367", "text": ["Your answers are still incorrect.  You should have measured approximately 19 volts on ER1 and .3 volts on ED1.", "Your answers are still incorrect. You should have measured approximately 19 volts on ER1 and .3 volts on ED1."], "jumps": ["PutVar"]}, {"id": "P2370", "text": ["In this example the knee voltage is present, however in relationship to the applied voltage it is very small."], "jumps": ["P2380", "P2360"]}, {"id": "P2380", "text": ["When the applied voltage is above 6 volts, the knee voltage is unimportant to circuit calculations."], "jumps": ["P2390", "P2370"]}, {"id": "P2390", "text": ["1.  Set S1 to DOWN on PC130-22A.\n2.  Set PC1 DC Power to OFF.\n     You will now check the diode using an ohmmeter.", "1. Set S1 to DOWN on PC130-22A. 2. Set PC1 DC Power to OFF. You will now check the diode using an ohmmeter. ........................................................"], "jumps": []}, {"id": "P2400", "text": ["3.  If using an analog multimeter, set it to measure resistance .  If        using a digital multimeter set the function switch to the diode         test position.", "3. If using an analog multimeter, set it to measure resistance . If using a digital multimeter set the function switch to the diode test position...", "If using a multimeter with a range switch, place the range to 100X. A higher range could damage the diode due to the voltage produced by the multimeter....."], "jumps": ["P2401", "P2390"]}, {"id": "P2401", "text": ["Resistance Checks Only\nWhen making resistance measurements, check the meter's instruction manual to determine the polarity of the internal battery.  The internal polarity of the m
