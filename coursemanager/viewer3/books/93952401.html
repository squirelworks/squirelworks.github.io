."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Operation and characteristics of the capacitor are described in both AC and DC circuits."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Let's begin the lesson on INTRODUCTION TO CAPACITORS......................"], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": ["P430"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The capacitor is a component that has the ability to store an electrical charge."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["In this circuit the capacitor is able to store an electrical charge equal to the applied voltage."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The capacitor is constructed from two plates separated by a non-conducting dielectric."], "jumps": ["P1050", "P1020"]}, {"id": "P1043", "text": ["The capacitor is constructed from two plates separated by a non-conducting dielectric.", "The capacitor is constructed from two plates separated by a non-conducting dielectric.."], "jumps": ["P1050", "P1020"]}, {"id": "P1045", "text": ["DIELECTRIC - Dielectric is an insulating material used to separate the plates of a capacitor. This material cannot conduct but it can store an electric charge. Some materials used for a dielectric are glass, ceramics, mica, paper, teflon, oil, and air."], "jumps": ["P1043"]}, {"id": "P1050", "text": ["With the switch closed, current flows until the capacitor reaches a charge equal to the source voltage.  Let's look at this process step-by-step.", "With the switch closed, current flows until the capacitor reaches a charge equal to the source voltage. Let's look at this process step-by-step."], "jumps": ["P1061", "P1060", "P1043"]}, {"id": "P1060", "text": ["Electrons flow from the negative terminal of the battery to the negative plate of the capacitor."], "jumps": ["P1070", "P1043"]}, {"id": "P1061", "text": ["Charge flows from the positive terminal of the battery to the positive plate of the capacitor.", "Charge flows from the positive terminal of the battery to the positive plate of the capacitor.r."], "jumps": ["P1071", "P1043"]}, {"id": "P1070", "text": ["The positive terminal of the battery attracts electrons from the positive plate of the capacitor."], "jumps": ["P1080", "P1060"]}, {"id": "P1071", "text": ["The negative terminal of the battery attracts the charge from the positive plate of the capacitor.", "The negative terminal of the battery attracts the charge from the positive plate of the capacitor.."], "jumps": ["P1081", "P1061"]}, {"id": "P1080", "text": ["Electrons DO NOT travel through the capacitor.  The dielectric is an insulator that blocks electrons.", "Electrons DO NOT travel through the capacitor. The dielectric is an insulator that blocks electrons."], "jumps": ["P1090", "P1060"]}, {"id": "P1081", "text": ["Charge DOES NOT travel through the capacitor.  The dielectric is an insulator that blocks the charge.", "Charge DOES NOT travel through the capacitor. The dielectric is an insulator that blocks the charge."], "jumps": ["P1090", "P1061"]}, {"id": "P1090", "text": ["Electrons build up on the plate nearest the negative terminal and are repelled from the plate nearest the positive terminal.", "The charge builds up on the plate nearest the positive terminal and is repelled from the plate nearest the negative termianl.", "\"The charge builds up on the plate nearest", "Electrons build up on the plate nearest the negative terminal and are repelled from the plate nearest the positive terminal.."], "jumps": ["P1100", "P1061", "P1060"]}, {"id": "P1100", "text": ["The effect is one plate has a positive charge and the other plate has a negative charge."], "jumps": ["P1110", "P1061", "P1060"]}, {"id": "P1110", "text": ["An electrostatic field exists between the plates of the capacitor allowing the dielectric to store a charge."], "jumps": ["P1120", "P1061", "P1060"]}, {"id": "P1120", "text": ["Select the positive plate of the capacitor.", "Select the positive plate of the capacitor................."], "jumps": ["P1061", "P1060"]}, {"id": "P1121", "text": [], "jumps": ["P1120"]}, {"id": "P1122", "text": ["You selected the battery.  The battery is the main power source in this circuit.", "You selected the battery. The battery is the main power source in this circuit."], "jumps": ["P1120"]}, {"id": "P1123", "text": ["You selected the negative plate of the capacitor.  Remember, the plate closest to the positive terminal will have a positive charge.", "You selected the negative plate of the capacitor. Remember, the plate closest to the positive terminal will have a positive charge."], "jumps": ["P1120"]}, {"id": "P1124", "text": ["You selected the dielectric.  The dielectric is the insulating material between the two plates which can store an electric charge.", "You selected the dielectric. The dielectric is the insulating material between the two plates which can store an electric charge."], "jumps": ["P1120"]}, {"id": "P1125", "text": ["You did not select any part of the capacitor.  Remember, the plate closest to the positive terminal will have a positive charge.", "You did not select any part of the capacitor. Remember, the plate closest to the positive terminal will have a positive charge."], "jumps": ["P1120"]}, {"id": "P1130", "text": ["Let's enlarge the capacitor in this circuit and describe its operation in more detail."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["Closing the switch causes an electrostatic field to develop in the dielectric of the capacitor."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["The capacitor charges rapidly at first as shown on the graph.  Note the charge of this capacitor is non-linear.", "The capacitor charges rapidly at first as shown on the graph. Note the charge of this capacitor is non-linear..."], "jumps": []}, {"id": "P1152", "text": ["The capacitor charges rapidly at first as shown on the graph.  Note the charge of this capacitor is non-linear.", "The capacitor charges rapidly at first as shown on the graph. Note the charge of this capacitor is non-linear..."], "jumps": []}, {"id": "P1155", "text": ["NON-LINEAR - The graph on the left shows a linear charge. Linear charges are constant. The rate of charge is constant from 0 to 10 volts."], "jumps": []}, {"id": "P1156", "text": ["The graph on the right shows a non-linear charge.  Non-linear charges are not constant.  The rate of charge varies from 0 to 10 volts.", "The graph on the right shows a non-linear charge. Non-linear charges are not constant. The rate of charge varies from 0 to 10 volts."], "jumps": ["P1157", "P1155"]}, {"id": "P1157", "text": ["Notice that the non-linear voltage increases at a faster rate between 0 and 8 volts than from 8 to 10 volts.  At 8 volts the charging rate slows down.", "Notice that the non-linear voltage increases at a faster rate between 0 and 8 volts than from 8 to 10 volts. At 8 volts the charging rate slows down........................."], "jumps": ["P1155"]}, {"id": "P1160", "text": ["Charging is rapid initially and then slows as the capacitor reaches a voltage equal to the applied voltage."], "jumps": ["P1170", "P1152"]}, {"id": "P1170", "text": ["Current flow is initially high and as charging slows, current flow also slows, eventually reaching zero."], "jumps": ["P1180", "P1152"]}, {"id": "P1180", "text": ["The charged capacitor discharges through leakage or by applying a discharge circuit."], "jumps": ["P1190", "P1152", "P1185"]}, {"id": "P1185", "text": ["LEAKAGE - A capacitor is designed to hold a charge indefinitely. However, the dielectric material is NOT a perfect insulator. Some electrons flow across to the opposite plate. This electron flow is called Leakage.", "LEAKAGE - A capacitor is designed to hold a charge indefinitely. However, the dielectric material is NOT a perfect insulator. Some charge will flow across to the opposite plate. This flow is called Leakage."], "jumps": []}, {"id": "P1186", "text": ["The charged capacitor discharges through leakage or by applying a discharge circuit.", "The charged capacitor discharges through leakage or by applying a discharge circuit..."], "jumps": ["P1185", "P1190", "P1152"]}, {"id": "P1190", "text": ["To discharge the capacitor manually, a circuit path must exist between the two plates."], "jumps": ["P1200", "P1186"]}, {"id": "P1200", "text": ["The amount of time a capacitor holds a charge is determined by the quality of the dielectric."], "jumps": ["P1210", "P1186"]}, {"id": "P1210", "text": ["If an AC voltage is applied to a capacitor, the capacitor must change polarity as the applied voltage changes."], "jumps": ["P1220", "P1186"]}, {"id": "P1220", "text": ["The polarity of the capacitor changes at the same frequency as the applied voltage.", "+ +"], "jumps": ["P1210", "P1230"]}, {"id": "P1230", "text": ["There are three classifications of capacitors:", "There are three classifications of capacitors:............."], "jumps": ["P1240", "P1210"]}, {"id": "P1240", "text": ["Non-polarized capacitors are general purpose capacitors used to isolate one circuit from another, block unwanted signals, and produce wave shapes."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["The schematic symbol for a non-polarized capacitor shows no difference between the positive and negative plate."], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["The electrolytic capacitor is polarity sensitive.  A major use for this capacitor is filtering power supplies.", "The electrolytic capacitor is polarity sensitive. A major use for this capacitor is filtering power supplies."], "jumps": ["P1270", "P1230"]}, {"id": "P1270", "text": ["The schematic symbol for an electrolytic capacitor shows a difference between the positive and negative plates."], "jumps": ["P1280", "P1230"]}, {"id": "P1280", "text": ["The variable capacitor provides varying amounts of capacitance. Transmitters and receivers use variable capacitors.", "The variable capacitor provides varying amounts of capacitance. Transmitters and receivers use variable capacitors.."], "jumps": ["P1290", "P1230"]}, {"id": "P1290", "text": ["The schematic symbol for a variable capacitor contains an arrow indicating an adjustment."], "jumps": ["P1300", "P1230"]}, {"id": "P1300", "text": ["Which symbol represents an electrolytic capacitor?", "Which symbol represents an electrolytic capacitor?........."], "jumps": ["P1230"]}, {"id": "P1301", "text": [], "jumps": ["P1300"]}, {"id": "P1302", "text": ["You selected the schematic symbol for a non-polarized capacitor.  Remember, an electrolytic capacitor has the plates marked.", "You selected the schematic symbol for a non-polarized capacitor. Remember, an electrolytic capacitor has the plates marked.5"], "jumps": []}, {"id": "P1303", "text": ["You selected the schematic symbol for a variable capacitor.  Remember, an electrolytic capacitor has the plates marked.", "You selected the schematic symbol for a variable capacitor. Remember, an electrolytic capacitor has the plates marked."], "jumps": ["P1300"]}, {"id": "P1310", "text": ["Which symbol represents a variable capacitor?", "Which symbol represents a variable capacitor?.............."], "jumps": ["P1300"]}, {"id": "P1311", "text": [], "jumps": ["P1310"]}, {"id": "P1312", "text": ["You selected the schematic symbol for a non-polarized capacitor.  Remember, a variable capacitor is adjustable.", "You selected the schematic symbol for a non-polarized capacitor. Remember, a variable capacitor is adjustable."], "jumps": ["P1310"]}, {"id": "P1313", "text": ["You selected the schematic symbol for an electrolytic capacitor.  Remember, a variable capacitor is adjustable.", "You selected the schematic symbol for an electrolytic capacitor. Remember, a variable capacitor is adjustable."], "jumps": ["P1310"]}, {"id": "P1910", "text": ["This completes the information on THE CAPACITOR.", "This completes the information on THE CAPACITOR...CAPACITORS."], "jumps": [" let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
