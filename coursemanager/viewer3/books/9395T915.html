rce....... - CH1 Slope......................... - Positive Coupling.................. - AC Sweep Mode........... - Autouency modulated signals, the sidebands may contain more power than the carrier."], "jumps": ["P2250", "P2230"]}, {"id": "P2230", "text": ["This setup/assessment procedure should be performed anytime the system is going to be used.  It permits you to know that the system is operational.", "This setup/assessment procedure should be performed anytime the system is going to be used. It permits you to know that the system is operational.", "1. After installation of the circuit cards and the application of 15 VDC to the system, ensure the PLL Lock LED and the Channel Detect LED are illuminated. 2. Using an oscilloscope or multimeter, check the DC levels at TPB1 (D0-D3) or both circuit cards while exercising the dip switches to ensure they provide a logic high and low. 3. Set the mode switch, S1, on both cards to the opposite of their present setting and ensure the system still functions. 4. If the system is being tested with an injected signal from the generator, switch S2 on PC130-456 to the microphone position and test the system using voice. 5. On PC130-456, change S3 to a channel not being used by the receiver. On PC130-457, the Channel Detector LED should turn OFF."], "jumps": ["P2240", "P2220"]}, {"id": "P2220", "text": ["19.  At this time, a 1 kHz tone should be heard coming from the             Test Console's speaker.  If a tone is heard, the NBFM system          is operating correctly.", "19. At this time, a 1 kHz tone should be heard coming from the Test Console's speaker. If a tone is heard, the NBFM system is operating correctly."], "jumps": ["P2230", "P2200"]}, {"id": "P2210", "text": ["18.  Using a small flat-blade screwdriver, adjust R5 (Deviation               Adjust) until a fully symmetrical sine wave at maximum                     amplitude is achieved.  Then adjust the generator's                           amplitude control for a 0.4 vpp signal as measured on the               oscilloscope.", "18. Using a small flat-blade screwdriver, adjust R5 (Deviation Adjust) until a fully symmetrical sine wave at maximum amplitude is achieved. Then adjust the generator's amplitude control for a 0.4 vpp signal as measured on the oscilloscope."], "jumps": ["P2220", "P2200"]}, {"id": "P2200", "text": ["17.  Connect the oscilloscope probe to TP2 on PC130-456.  A                 sine wave should be seen on the oscilloscope.", "17. Connect the oscilloscope probe to TP2 on PC130-456. A sine wave should be seen on the oscilloscope."], "jumps": ["P2210", "P2190"]}, {"id": "P2190", "text": ["16.  Connect a X1/X10 oscilloscope probe to the oscilloscope.              Set the oscilloscope as follows:", "16. Connect a X1/X10 oscilloscope probe to the oscilloscope. Set the oscilloscope as follows:", "CH1 Volts/Div......... - 0.2V (X1) or 20 mV (X10) Vertical Mode.......... - CH1 Time/Div................... - 1 mS Trigger Source....... - CH1 Slope......................... - Positive Coupling.................. - AC Sweep Mode........... - Autouency modulated signals, the sidebands may contain more power than the carrier."], "jumps": ["P2200", "P2180"]}, {"id": "P2180", "text": ["15.  Connect a BNC to alligator cable from the function generator         to TP1 of PC130-456.  Set the generator as follows:", "15. Connect a BNC to alligator cable from the function generator to TP1 of PC130-456. Set the generator as follows:", "Range......... - 1 kHz Function..... - Sinewave Frequency.. - 1 kHz Attenuation - -20db Amplitude... - mid-position sidebands. 3. The greater the amplitude of the modulating signal, the more power produced in the sidebands. 4. In frequency modulated signals, the sidebands may contain more power than the carrier."], "jumps": ["P2190", "P2160"]}, {"id": "P2170", "text": ["14.  On PC130-456, set Input Select switch S2 to the \"EXT\"                      position.", "14. On PC130-456, set Input Select switch S2 to the \"EXT\" position."], "jumps": ["P2180", "P2160"]}, {"id": "P2160", "text": ["13.  Speak or whistle into the microphone.  The audio should be           reproduced at the receiver.  If it wasn't, recheck your switch           settings and ensure the volume control is turned up far                    enough.  If the problem persists, ask your instructor for                   assistance.", "13. Speak or whistle into the microphone. The audio should be reproduced at the receiver. If it wasn't, recheck your switch settings and ensure the volume control is turned up far enough. If the problem persists, ask your instructor for assistance."], "jumps": ["P2170", "P2150"]}, {"id": "P2150", "text": ["At this time, the Lock Detect LED on the transmitter and the Channel Detect LED on the receiver should be illuminated."], "jumps": ["P2160", "P2140"]}, {"id": "P2140", "text": ["12.  Set the PC1, PC3 DC and Speaker Power Switches to ON.", "12. Set the PC1, PC3 DC and Speaker Power Switches to ON.................."], "jumps": ["P2130"]}, {"id": "P2130", "text": ["10.  On PC130-457, set the Mode Select switch S1 to the \"B\"                   (base) position. \n11.  On PC130-457, set S2 (quad-dip switch pack) to the same               channel that the transmitter is set to.", "10. On PC130-457, set the Mode Select switch S1 to the \"B\" (base) position. 11. On PC130-457, set S2 (quad-dip switch pack) to the same channel that the transmitter is set to."], "jumps": ["P2140", "P2110"]}, {"id": "P2120", "text": ["8.  On PC130-456, set the Input Select switch S2 to the \"Mic\"               position. \n9.  Using the quad-dip switch pack S3 on PC130-456, select a             channel to transmit on using a binary count between 0 - 9.", "8. On PC130-456, set the Input Select switch S2 to the \"Mic\" position. 9. Using the quad-dip switch pack S3 on PC130-456, select a channel to transmit on using a binary count between 0 - 9."], "jumps": ["P2130", "P2110"]}, {"id": "P2110", "text": [ weep function is acceptable.", "RF Voltmeters are handy when testing filters, but they are not always available. Oscilloscopes can be used as a viable option. An RF generator with a sweep function is also desirable, but one without the sweep function is acceptable.", "62431 ACME ELECTRONICS P/N 6395-218 S/N 9293-44-1128-3B fc 455kHz Bw 1200 Hz"], "jumps": ["P485", "P470"]}, {"id": "P470", "text": ["Still, efficient use of the oscilloscope, function generator and counter will provide adequate measurements to conduct identification of faulted components."], "jumps": ["P480", "P460"]}, {"id": "P460", "text": ["The tools used to troubleshoot NBFM Communications systems are the same as used for any other radio format.  Spectrum Analyzers are highly useful; but the cost is significant, making their availability out of reach for many maintenance operations.", "The tools used to troubleshoot NBFM Communications systems are the same as used for any other radio format. Spectrum Analyzers are highly useful; but the cost is significant, making their availability out of reach for many maintenance operations."], "jumps": ["P470", "P450"]}, {"id": "P450", "text": ["This all is not problematic for the servicing technician, providing test equipment is available that can handle such a broad spectrum of frequencies."], "jumps": ["P460", "P430"]}, {"id": "P440", "text": ["The frequencies below are not all-inclusive.  Cordless phones have at least one additional band.  Some cellular telephones use NBFM (many operate with AM) and are normally somewhere above 900 MHz.  Additionally, the military has NBFM bands that it uses.", "The frequencies below are not all-inclusive. Cordless phones have at least one additional band. Some cellular telephones use NBFM (many operate with AM) and are normally somewhere above 900 MHz. Additionally, the military has NBFM bands that it uses."], "jumps": ["P450", "P430"]}, {"id": "P430", "text": ["This is not necessarily the case with narrowband FM communica
