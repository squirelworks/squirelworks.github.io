const book = {"title": "93958102", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: INTRODUCTION TO MICROWAVE SYSTEMS asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Identify various stages in a basic microwave communication system. w Describe the basic principle of multiplexing. w Describe the purpose of microwave repeater stations. w Identify basic microwave components and devices. omponents and devices. devices. devices.", "w Observe the effects of blocked microwave transmission signals and misaligned microwave antennas. w Become familiar with the Nida Model 330 Microwave Trainer. Microwave Trainer........"], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P301", "text": [], "jumps": []}, {"id": "P330", "text": [], "jumps": ["PPNLYUNA"]}, {"id": "P331", "text": [], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about a basic microwave communication system consisting of a transmitter and receiver."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["In basic terms, a communication system must have the ability to process, transmit, receive and interface information with a user.", "You are already familiar with forms of communication such as radio, telephone and television."], "jumps": ["P420", "P400", "P430"]}, {"id": "P430", "text": ["Microwave communications operate on the same basic principles as the other forms of communication, only the frequencies, configurations and types of components are different.", "Transmission Lineeeransmission Lineeeeeee"], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["Also in this lesson, you will become familiar with the Nida Model 330 Microwave Trainer."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["Let's begin the lesson on INTRODUCTION TO MICROWAVE SYSTEMS................."], "jumps": ["P440"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["A microwave system is designed for the purpose of communicating a message or a group of messages.", "Microwave Communication Systemmunication System"], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["The messages to be communicated are defined as information or data."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["This information or data could be in the form of voice, teletype, telemetry, video or any other form of coded intelligence."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The block diagram illustrates the major stages of a basic microwave communication system.  Let's discuss each stage.", "The block diagram illustrates the major stages of a basic microwave communication system. Let's discuss each stage."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["The input INFORMATION PROCESSOR functions to make the incoming information or data suitable for transmission."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["The processing can be as simple as coupling the information to the next block.  Or it can be as complex as coding or multiplexing the information.", "The processing can be as simple as coupling the information to the next block. Or it can be as complex as coding or multiplexing the information."], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["The OSCILLATOR AND MODULATOR are responsible for developing the carrier frequency and for putting the information or data on the carrier."], "jumps": ["P1100", "P1050"]}, {"id": "P1100", "text": ["The TRANSMITTER amplifies the modulated carrier for transmission.", "The TRANSMITTER amplifies the modulated carrier for transmission. tters are covered in lesson 3."], "jumps": ["P1110", "P1050"]}, {"id": "P1110", "text": ["The WAVEGUIDE acts like a conductor, routing the amplified modulated carrier to the antenna.", "The WAVEGUIDE acts like a conductor, routing the amplified modulated carrier to the antenna. aveguides act like conductors."], "jumps": ["P1130", "P1050"]}, {"id": "P1130", "text": ["The TRANSMIT ANTENNA directs the microwave energy towards the receive antenna.", "The TRANSMIT ANTENNA directs the microwave energy towards the receive antenna. Microwave antennas are covered in lesson 6."], "jumps": ["P1140", "P1050"]}, {"id": "P1140", "text": ["The RECEIVE ANTENNA picks up the direct wave microwave signals."], "jumps": ["P1150", "P1050"]}, {"id": "P1150", "text": ["The WAVEGUIDE routes the received signals to the receiver. Microwave receivers are covered in lesson 4."], "jumps": ["P1160", "P1050"]}, {"id": "P1160", "text": ["The RECEIVER boosts the strength of the microwave energy received by the antenna to overcome losses due to noise or other atmospheric conditions."], "jumps": ["P1170", "P1050"]}, {"id": "P1170", "text": ["Also, the modulated RF microwave signal is demodulated in the receiver."], "jumps": ["P1180", "P1050"]}, {"id": "P1180", "text": ["The output INFORMATION PROCESSOR decodes or demultiplexes the data, if necessary, and outputs the data to the user."], "jumps": ["P1190", "P1050"]}, {"id": "P1190", "text": ["As you have seen, a basic microwave communication system is very similar to an AM or FM radio communication system."], "jumps": ["P1200", "P1050"]}, {"id": "P1192", "text": ["As you have seen, a basic microwave communication system is very similar to an AM or FM radio communication system."], "jumps": ["P1200", "P1050"]}, {"id": "P1200", "text": ["Touch the stage that prepares information or data for transmission."], "jumps": ["P1192"]}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1202", "text": ["You did not touch the stage that prepares information or data for transmission."], "jumps": []}, {"id": "P1210", "text": ["Touch a stage that functions as a conductor."], "jumps": ["P1200"]}, {"id": "P1211", "text": [], "jumps": []}, {"id": "P1212", "text": ["You did not touch the stage that functions as a conductor.", "You did not touch the stage that functions as a conductor.."], "jumps": []}, {"id": "P1220", "text": ["There are three major differences between microwave communications and lower frequency communication systems.", "Multi-Channel Operation Repeater Stations Components and Devices"], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["Let's discuss multi-channel operation, or multiplexing, first.", "Multi-Channel Operation Repeater Stations Components and Devices"], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["Multiplexing is a method that allows several messages to be transmitted on one carrier frequency."], "jumps": ["P1250", "P1220"]}, {"id": "P1250", "text": ["Multiplexing was developed because the number of wires and radio frequency channels could not meet the demand for message transmission."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["The operation is quite simple, even though the circuits are complex."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["The multiplexer combines all incoming messages from users into one composite information signal."], "jumps": ["P1280", "P1240"]}, {"id": "P1280", "text": ["The one composite information signal is then used to modulate the carrier signal for transmission."], "jumps": ["P1290", "P1240"]}, {"id": "P1290", "text": ["At the receiver, the modulated carrier signal is demultiplexed, (the messages are separated)."], "jumps": ["P1300", "P1240"]}, {"id": "P1300", "text": ["Then each separate message is sent to the user.", "Then each separate message is sent to the user.."], "jumps": ["P1310", "P1240"]}, {"id": "P1310", "text": ["There are several different methods used to multiplex information."], "jumps": ["P1320", "P1240"]}, {"id": "P1320", "text": ["Repeater stations are required because microwave transmission is limited to line of sight.", "Repeater stations are required because microwave transmission is limited to line of sight. (Graphics Text)Multi-Channel Operation Repeater Stations Components and Devices", "Multi-Channel Operation Repeater Stations Components and Devices"], "jumps": ["P1330", "P1240"]}, {"id": "P1330", "text": ["Recall that microwave propagation is direct wave.", "Recall that microwave propagation is direct wave............."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["The range for microwave transmission is limited to approximately 25 to 50 miles due to the curvature of the earth."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["For communications over longer distances, repeater stations are used."], "jumps": ["P1360", "P1330"]}, {"id": "P1360", "text": ["Repeater stations are nothing more than a receiver and transmitter."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["The transmitted signal from the original transmitter or from another repeater station is received by the repeater's receiver and fed to the repeater's transmitter."], "jumps": ["P1380", "P1350"]}, {"id": "P1380", "text": ["The repeater's transmitter then transmits the signal to another repeater station or to the final destination."], "jumps": ["P1390", "P1350"]}, {"id": "P1390", "text": ["Repeater stations are equipped with signal monitoring devices, but there is no signal processing or modulating equipment."], "jumps": ["P1400", "P1350"]}, {"id": "P1400", "text": ["Also, in most cases, repeater stations are unattended."], "jumps": ["P1410", "P1350"]}, {"id": "P1410", "text": ["The last major difference in microwave communication systems involves the components and devices used.", "The last major difference in microwave communication systems involves the components and devices used. ics Text)Multi-Channel Operation Repeater Stations Components and Devices", "Multi-Channel Operation Repeater Stations Components and Devices"], "jumps": ["P1420", "P1350"]}, {"id": "P1420", "text": ["The high frequencies of the microwave region make it impractical for using ordinary components.", "Transmission Lineeeransmission Lineeeeeee"], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["The following is a list of devices and/or components designed for microwave systems."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["Vacuum Tube Devices \nA klystron tube is a special type of vacuum tube.  It is a source of  microwave frequency energy.  Klystrons also are used for amplifiers.", "There are other types of tubes such as the magnetron and the traveling wave tube.  Lesson 7 covers tube microwave generating devices in detail.", "Vacuum Tube Devices A klystron tube is a special type of vacuum tube. It is a source of microwave frequency energy. Klystrons also are used for amplifiers.", "There are other types of tubes such as the magnetron and the traveling wave tube. Lesson 7 covers tube microwave generating devices in detail."], "jumps": ["P1450", "P1420", "P1460", "P1440"]}, {"id": "P1460", "text": ["Semiconductor Devices\nIn the last few years, semiconductor microwave devices have been developed.", "Semiconductor Devices In the last few years, semiconductor microwave devices have been developed."], "jumps": ["P1470", "P1450"]}, {"id": "P1470", "text": ["Devices such as the tunnel diode, PIN diode, varactor, microwave transistors and crystal detectors are replacing tube devices."], "jumps": ["P1490", "P1460"]}, {"id": "P1490", "text": ["Waveguides\nWaveguides act like conductors, passing microwave frequencies from one point to another.", "Waveguides Waveguides act like conductors, passing microwave frequencies from one point to another."], "jumps": ["P1500", "P1460"]}, {"id": "P1500", "text": ["Waveguides are manufactured in various shapes and sizes, and for special purposes.  Terminators, bends, twists, connector tees, flanges, and rotary joints are some examples.", "Waveguides are manufactured in various shapes and sizes, and for special purposes. Terminators, bends, twists, connector tees, flanges, and rotary joints are some examples."], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["Waveguides are also used as tuners, impedance matching devices and attenuators."], "jumps": ["P1520", "P1490"]}, {"id": "P1520", "text": ["The following are some of the special waveguides used in microwaves."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["Dielectric Resonator Oscillator (DRO) is the unit that generates the microwave frequency.  It receives external power and a modulation signal.", "Dielectric Resonator Oscillator (DRO) is the unit that generates the microwave frequency. It receives external power and a modulation signal. M"], "jumps": ["P1540", "P1510"]}, {"id": "P1540", "text": ["The DRO outputs a modulated RF signal (10.5 GHz in the Model 330 Trainer) directly into the waveguide."], "jumps": ["P1550", "P1530"]}, {"id": "P1550", "text": ["The VARIABLE ATTENUATOR provides a convenient means of adjusting the waveguide power level."], "jumps": ["P1560", "P1530"]}, {"id": "P1560", "text": ["The attenuator consists of a slotted section of waveguide in which a matched resistive strip can be inserted to various depths."], "jumps": ["P1570", "P1550"]}, {"id": "P1570", "text": ["The amount of attenuation or energy absorption is dependent on the depth of the strip penetration into the waveguide."], "jumps": ["P1580", "P1550"]}, {"id": "P1580", "text": ["The CROSSGUIDE COUPLER is a section of waveguide with provisions for coupling two signals."], "jumps": ["P1590", "P1550"]}, {"id": "P1590", "text": ["One signal is for measuring the transmitter frequency through a wavemeter or a crystal detector."], "jumps": ["P1600", "P1580"]}, {"id": "P1600", "text": ["The other signal goes to a termination or dummy load, to prevent reflections on the waveguide system."], "jumps": ["P1610", "P1580"]}, {"id": "P1610", "text": ["A SLIDE SCREW TUNER is used for matching waveguides to other components."], "jumps": ["P1620", "P1580"]}, {"id": "P1620", "text": ["The tuner consists of a slotted section of waveguide on which is mounted an adjustable probe."], "jumps": ["P1630", "P1610"]}, {"id": "P1630", "text": ["The position and penetration of the probe may be varied to introduce an impedance discontinuity to cancel out existing mismatches elsewhere."], "jumps": ["P1640", "P1610"]}, {"id": "P1640", "text": ["Waveguide SLOTTED LINES are fundamental tools for the measurement of the magnitude and phase of standing waves (VSWR)."], "jumps": ["P1650", "P1610"]}, {"id": "P1650", "text": ["Such information may be transformed readily into impedance of the terminal load of the system or component."], "jumps": ["P1660", "P1640"]}, {"id": "P1660", "text": ["The slotted line may also be used to measure percentage of transmitted or reflected power."], "jumps": ["P1670", "P1640"]}, {"id": "P1670", "text": ["Its construction is similar to the slide screw tuner with a traveling probe carriage mounted on a slotted waveguide section."], "jumps": ["P1680", "P1640"]}, {"id": "P1680", "text": ["In the slotted line, the probe is used for sampling the electric field along the slot to permit precise plotting of variations along the length of the slot."], "jumps": ["P1690", "P1640"]}, {"id": "P1690", "text": ["The probe feeds a detector which produces a rectified output to operate a meter which indicates the relative voltage magnitude     resulting in a standing wave pattern.", "The probe feeds a detector which produces a rectified output to operate a meter which indicates the relative voltage magnitude resulting in a standing wave pattern."], "jumps": ["P1700", "P1640"]}, {"id": "P1700", "text": ["The measurement of the distance from minimum readings on the line is also used to determine frequency."], "jumps": ["P1710", "P1640"]}, {"id": "P1710", "text": ["A CRYSTAL DETECTOR is the simplest and most sensitive microwave energy detector."], "jumps": ["P1720", "P1640"]}, {"id": "P1720", "text": ["It consists of a silicon or germanium crystal placed in the microwave field.  The crystal acts as a current generator.", "It consists of a silicon or germanium crystal placed in the microwave field. The crystal acts as a current generator."], "jumps": ["P1730", "P1710"]}, {"id": "P1730", "text": ["When the microwave signal is applied across it, the rectified current output is proportional to the square of the applied voltage."], "jumps": ["P1740", "P1710"]}, {"id": "P1740", "text": ["The RESONANT CAVITY WAVEMETER is the most commonly used microwave frequency measuring device."], "jumps": ["P1750", "P1710"]}, {"id": "P1750", "text": ["It consists of a metal cylinder coupled to a waveguide.  The cavity within the cylinder is resonant at one frequency by virtue of its volume.", "It consists of a metal cylinder coupled to a waveguide. The cavity within the cylinder is resonant at one frequency by virtue of its volume."], "jumps": ["P1760", "P1740"]}, {"id": "P1760", "text": ["The frequency of the cavity wavemeter is adjusted by varying the position of one of the end plates with a micrometer screw."], "jumps": ["P1770", "P1740"]}, {"id": "P1770", "text": ["Thus, the micrometer reading at the point where loss occurs, resonance, will give the frequency of the energy in the waveguide."], "jumps": ["P1780", "P1740"]}, {"id": "P1780", "text": ["ANTENNAS mount directly to the waveguide. They are used to propagate signals from the waveguide into the air or from the air into the waveguide. ysical characteristics of the antenna, like its shape, help direct signals. nto the air. h creates standing waves)."], "jumps": ["P1790", "P1740"]}, {"id": "P1790", "text": ["Antennas channel the microwave RF energy so that it can be transmitted and/or received without large amounts of signal power loss.", "Antennas channel the microwave RF energy so that it can be transmitted and/or received without large amounts of signal power loss.or received without large amounts of signal power loss..."], "jumps": ["P1800", "P1780"]}, {"id": "P1800", "text": ["MICROWAVE DOWN CONVERTERS are used in the receive section of the waveguide."], "jumps": ["P1810", "P1780"]}, {"id": "P1810", "text": ["The received signal is processed by the converter."], "jumps": ["P1820", "P1800"]}, {"id": "P1820", "text": ["The types of components used depend on the type of microwave system."], "jumps": ["P1830", "P1800"]}, {"id": "P1830", "text": ["Which microwave component is used to generate the microwave carrier frequency?"], "jumps": ["P1820"]}, {"id": "P1831", "text": [], "jumps": []}, {"id": "P1832", "text": ["A variable attenuator is used to adjust the power level of the microwave transmitter."], "jumps": []}, {"id": "P1833", "text": ["A slide screw tuner is used to match the impedance of microwave components."], "jumps": []}, {"id": "P1840", "text": ["How is the range of microwave transmissions increased?", "How is the range of microwave transmissions increased?....."], "jumps": ["P1830"]}, {"id": "P1841", "text": [], "jumps": []}, {"id": "P1842", "text": ["Multiplexing allows transmission of more than one message on a signal carrier frequency."], "jumps": []}, {"id": "P1843", "text": ["Increasing the power would not increase the range of transmission.  Remember, microwaves travel in direct waves, or line of sight.", "Increasing the power would not increase the range of transmission. Remember, microwaves travel in direct waves, or line of sight."], "jumps": []}, {"id": "P1850", "text": ["What waveguide component would be used to match the impedance of an antenna to the impedance of the waveguide?"], "jumps": ["P1840"]}, {"id": "P1851", "text": [], "jumps": []}, {"id": "P1852", "text": ["The DRO is the Dielectric resonator oscillator.  It develops the microwave carrier frequency.", "The DRO is the Dielectric resonator oscillator. It develops the microwave carrier frequency.."], "jumps": []}, {"id": "P1853", "text": ["The variable attenuator is used to adjust the power level of the microwave system."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on BASIC MICROWAVE SYSTEMS.", "This completes the information on BASIC MICROWAVE SYSTEMS.."], "jumps": ["P1001", "P1850"]}, {"id": "P1920", "text": ["1.  Microwave communication systems are similar to other forms       of communications.", "1. Microwave communication systems are similar to other forms of communications."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  The basic microwave communication systems have the same       stages as any communications system.", "2. The basic microwave communication systems have the same stages as any communications system."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  In the transmitter, information is processed for transmission.", "3. In the transmitter, information is processed for transmission."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  In the receiver, the carrier frequency is removed and the data         is processed.", "4. In the receiver, the carrier frequency is removed and the data is processed."], "jumps": ["P1960", "P1930"]}, {"id": "P1960", "text": ["5.  The three major differences in microwave communications             are:", "5. The three major differences in microwave communications are:", "Multi-Channel Operation Repeater Stations Components and Devices"], "jumps": ["P1970", "P1930"]}, {"id": "P1970", "text": ["6.  Multi-channel operation uses multiplexing.", "6. Multi-channel operation uses multiplexing.ltiplexing..."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7.  REPEATER STATIONS are used to increase the range of                 microwave transmission.", "7. REPEATER STATIONS are used to increase the range of microwave transmission."], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["8.  Special components and devices are needed because of the         frequency of microwaves.", "8. Special components and devices are needed because of the frequency of microwaves.", "Transmission Lineeeransmission Lineeeeeee"], "jumps": ["P1999", "P1980"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1990"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["The purpose of this experiment is to familiarize you with a basic operating microwave system."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["Pick up circuit cards PC130-307 and PC130-308. These cards form the basic microwave transmitter and receiver."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["PC130-307 is the transmitter's power supply, modulator and audio oscillator."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["PC130-308 is the receiver, IF amplifier and FM discriminator."], "jumps": ["P2065", "P2050"]}, {"id": "P2065", "text": ["You have previously selected the dual trainer setup. You must exit and restart this lesson.", "Before we start the experiment, please choose the trainer configuration you will be using. If you are unsure, ask your instructor. Model 330 microwave trainer are given in HELP frames. Also, the Nida Model 130A Test Console's controls and settings are given in HELP frames."], "jumps": ["P2060"]}, {"id": "P2080", "text": ["Let's start the experiment.", "Let's start the experiment. raphics Text)NOTE The detailed instructions on how to assemble, configure and adjust the Nida Model 330 microwave trainer are given in HELP frames. Also, the Nida Model 130A Test Console's controls and settings are given in HELP frames.", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "The detailed instructions on how to assemble, configure and adjust the Nida Model 330 microwave trainer are optional selections... Red test Lead ............... V input jack Black test Lead ............ COMM input jackput jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk"], "jumps": ["P2085", "P2090", "P2065"]}, {"id": "P2085", "text": ["Ensure that the Receiver address is set to 2. If you are using one trainer for this experiment you need to exit and restart this lesson.", "Ensure that the Transmitter address is set to 1.", "1. Setup the Transmitter and Receiver Test Consoles for dual interface."], "jumps": ["P2100", "P2080"]}, {"id": "P2090", "text": ["1.  Set theTest Console to its Initial Control Settings.", "1. Set theTest Console to its Initial Control Settings. gnate one console as the transmitter console and the other the receiver console. DO NOT connect the computer's RS-232 cable to either Test Console at this time."], "jumps": ["P2080"]}, {"id": "P2100", "text": ["2.  Assemble the Nida Model 330 Microwave Trainer if not                     previously assembled.", "2. Assemble the Nida Model 330 Microwave Trainer if not previously assembled."], "jumps": ["P2110", "P2085", "P2090"]}, {"id": "P2110", "text": ["3.  Install PC130-307 into PC3 position.\n4.  Install PC130-308 into PC1 position.", "3. Install PC130-307 into PC3 position. 4. Install PC130-308 into PC1 position.of the Test Console.of the Test Console..y - Microwave connections - PC card alignment - Interface connection"], "jumps": ["P2120", "P2100"]}, {"id": "P2115", "text": ["3. Install PC130-307 into PC3 position on the Transmitter Test Console. 4. Install PC130-308 into PC1 position on the Receiver Test Console..Interface connection"], "jumps": ["P2122", "P2100"]}, {"id": "P2120", "text": ["5.  Set the Negative Supply Voltage to 15.\n6.  Set the Positive Supply Voltage to 15.\n     The Test Console's Voltage Meter should indicate 15 volts.", "5. Set the Negative Supply Voltage to 15. 6. Set the Positive Supply Voltage to 15. The Test Console's Voltage Meter should indicate 15 volts."], "jumps": ["P2110"]}, {"id": "P2122", "text": ["5. Set the Positive Supply Control to 15. Set the Negative Supply Control to 15. The Voltmeter on the Transmitter should indicate 15 Volts. 6. Set the Positive Supply Control to 15. Set the Negative Supply Control to 15. The Voltmeter on the Receiver should indicate 15 Volts."], "jumps": []}, {"id": "P2125", "text": ["7.  Set PC1 and PC3 DC power ON.", "7. Set PC1 and PC3 DC power ON. t the microwave trainer to the PC cards and make circuit alignments if required. Select one of the options below if you need alignment procedure instructions ."], "jumps": ["P2120"]}, {"id": "P2126", "text": ["7. Set the PC3 DC power switch of Transmitter Test Console and PC1 DC power switch of the Receiver Test Consol to ON......................"], "jumps": ["P2122"]}, {"id": "P2127", "text": ["8.  Connect the microwave trainer to the PC cards and make \n     circuit alignments if required.  Select one of  the options below \n     if you need alignment procedure instructions.", "8. Connect the microwave trainer to the PC cards and make circuit alignments if required. Select one of the options below if you need alignment procedure instructions. ocedure instructions ."], "jumps": ["P2125"]}, {"id": "P2130", "text": ["The experiment is now set up.  Let's observe basic microwave communications.", "The experiment is now set up. Let's observe basic microwave communications. e computer's RS-232 cable can be left disconnected or connected to either Test Console for this experiment."], "jumps": ["P2140", "P2127"]}, {"id": "P2140", "text": ["1.  Set the 3 position lever switch on PC130-307 to the SINE                 WAVE position.  In this position a 1 kHz audio signal is                     generated for the purpose of observing basic microwave                operation.", "1. Set the 3 position lever switch on PC130-307 to the SINE WAVE position. In this position a 1 kHz audio signal is generated for the purpose of observing basic microwave operation."], "jumps": ["P2143", "P2130"]}, {"id": "P2143", "text": ["2.  Set the oscilloscope controls as follows: \n     The Horizontal sweep of each channel should be adjusted to         view CH1 signal on the upper portion of the grid and CH2               signal on the lower portion.", "2. Set the oscilloscope controls as follows: The Horizontal sweep of each channel should be adjusted to view CH1 signal on the upper portion of the grid and CH2 signal on the lower portion. Div CH1 - 1 AC Sweep Mode - Auto Volts/Div CH2 - 1 AC Slope - + Vert Mode - Dual Coupling - AC Sweep Var - Fully CW Source - CH1 Time/Div - .5 mSec", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "Volts/Div CH1 - 1 AC Sweep Mode - Auto Volts/Div CH2 - 1 AC Slope - + Vert Mode - Dual Coupling - AC Sweep Var - Fully CW Source - CH1 Time/Div - .5 mSec"], "jumps": ["P2147", "P2140"]}, {"id": "P2147", "text": ["3.  Connect CH1 of the oscilloscope to the OUTPUT TP on                   PC130-307.  Adjust the output Gain control for a minimum               signal.  The internal 1 kHz signal is large and, even at the                 lowest settings, may cause distortion in the microwave                    receiver.", "3. Connect CH1 of the oscilloscope to the OUTPUT TP on PC130-307. Adjust the output Gain control for a minimum signal. The internal 1 kHz signal is large and, even at the lowest settings, may cause distortion in the microwave receiver."], "jumps": ["P2148", "P2143"]}, {"id": "P2148", "text": ["4.  Connect CH2 of the oscilloscope to the OUTPUT TP on\n     PC130-308.  Adjust the Gain control for the least amount of             distortion.", "4. Connect CH2 of the oscilloscope to the OUTPUT TP on PC130-308. Adjust the Gain control for the least amount of distortion."], "jumps": ["P2150", "P2147"]}, {"id": "P2150", "text": ["The presence of a waveform at the receiver demonstrates that the microwave system is operating.  By observing a signal on the receiver you can assume that the microwave transmitter, receiver and waveguides are functioning correctly.", "The presence of a waveform at the receiver demonstrates that the microwave system is operating. By observing a signal on the receiver you can assume that the microwave transmitter, receiver and waveguides are functioning correctly."], "jumps": ["P2180", "P2148", "P2155"]}, {"id": "P2155", "text": ["WAVEFORM - If you do not see the waveform, ensure that the test console and microwave trainer are setup correctly. Go back to step 1 and repeat the setup procedures. If you still do not see the waveform and you are sure your setup is correct, contact your instructor for assistance."], "jumps": []}, {"id": "P2160", "text": ["5.  Place a book or other dense object in front of the transmitter          horn.", "5. Place a book or other dense object in front of the transmitter horn. raphics Text) WARNING Never put any portion of exposed skin in front of an operating microwave transmitter. The power output from most microwave transmitters will cause serious burns or internal injury.", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "Never put any portion of exposed skin in front of an operating microwave transmitter. The power output from most microwave transmitters will cause serious burns or internal injury. ury. ut jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk"], "jumps": ["P2165", "P2180"]}, {"id": "P2165", "text": ["Notice the received signal (CH2 on the oscilloscope) is distorted. This proves the received signal is generated by the transmitter."], "jumps": ["P2170", "P2160"]}, {"id": "P2170", "text": ["6.  Remove the obstruction from the transmitter antenna horn.            Is the received signal present?", "6. Remove the obstruction from the transmitter antenna horn. Is the received signal present?"], "jumps": ["P2165"]}, {"id": "P2171", "text": [], "jumps": []}, {"id": "P2172", "text": ["You should see a signal on CH2 of the oscilloscope.  Ensure that you have removed the dense object from in front of the transmitter antenna horn.", "You should see a signal on CH2 of the oscilloscope. Ensure that you have removed the dense object from in front of the transmitter antenna horn...."], "jumps": []}, {"id": "P2180", "text": ["Remember, microwaves are line of sight waves and obstructions will stop the transmission."], "jumps": ["P2160", "P2150"]}, {"id": "P2190", "text": ["The received signal should again be visible on the oscilloscope.", "The received signal should again be visible on the oscilloscope....."], "jumps": ["P2200", "P2170"]}, {"id": "P2200", "text": ["7.  Position the 3 position lever switch on PC130-307 to the IN             position.  The received signal should stop.", "7. Position the 3 position lever switch on PC130-307 to the IN position. The received signal should stop."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["The 10.5 GHz carrier signal is still being transmitted to the receiver.  Only the internal information or data (1 kHz tone) has      been taken away.  The system is set to receive an external input of information or data.", "The 10.5 GHz carrier signal is still being transmitted to the receiver. Only the internal information or data (1 kHz tone) has been taken away. The system is set to receive an external input of information or data."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["The basic microwave system operates as follows.", "The basic microwave system operates as follows............."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["Experiment card PC130-307 contains the circuitry required to power and modulate the microwave carrier frequency.  This card includes an audio tone generator used to produce an information signal to be transmitted.", "Experiment card PC130-307 contains the circuitry required to power and modulate the microwave carrier frequency. This card includes an audio tone generator used to produce an information signal to be transmitted.", "H{__vvveeYsZZgSg;sgSgSggggAZgZgggZSV\\SVVd--WC-kBqSrlllldlZgSSSVq&/<;SZcgZSW00 .EpprnllnllZSZZAff_Hsa^@cZZa"], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["In future experiments you will investigate this circuit to learn how the microwave carrier is developed."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["The DRO, microwave oscillator on the waveguide, receives the audio signal and power from PC130-307.  The DRO contains the solid state circuitry required to develop the 10.5 GHz carrier signal.", "The DRO, microwave oscillator on the waveguide, receives the audio signal and power from PC130-307. The DRO contains the solid state circuitry required to develop the 10.5 GHz carrier signal.", "H{__vvveeYsZZgSg;sgSgSggggAZgZgggZSV\\SVVd--WC-kBqSrlllldlZgSSSVq&/<;SZcgZSW00 .EpprnllnllZSZZAff_Hsa^@cZZa"], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["The unit is sealed and requires no adjustments.  Special test equipment is required to measure frequencies in the GHz range. In this course, the carrier frequency will NOT be measured directly.  The standing wave ratio method will be used to determine carrier frequency.", "The unit is sealed and requires no adjustments. Special test equipment is required to measure frequencies in the GHz range. In this course, the carrier frequency will NOT be measured directly. The standing wave ratio method will be used to determine carrier frequency."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["The DRO is attached to the waveguide transmitter section.  The modulated carrier frequency is funnelled into the waveguide.", "The DRO is attached to the waveguide transmitter section. The modulated carrier frequency is funnelled into the waveguide."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["The signal horn is the last item on the transmitter waveguide.  It is the antenna used to direct or aim the radiated RF energy.", "The signal horn is the last item on the transmitter waveguide. It is the antenna used to direct or aim the radiated RF energy."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["The receiver waveguide system uses the same type of antenna. This antenna picks up the transmitted signal and directs it down the waveguide."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["The received signal is processed by the Down Converter and sent to PC130-308 where the information signal is separated from the carrier.  The Down Converter is sealed like the DRO.", "The received signal is processed by the Down Converter and sent to PC130-308 where the information signal is separated from the carrier. The Down Converter is sealed like the DRO."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["Experiment card PC130-308 contains the circuitry required to produce the IF frequency and separate the information signal from the carrier signal."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["In future experiments, you will investigate this circuit to learn how the IF signal is developed."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["8.  Place the 3 position lever switch on PC130-307 to the SINE             WAVE position.  The signal should be present.", "8. Place the 3 position lever switch on PC130-307 to the SINE WAVE position. The signal should be present."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["9.  Rotate the microwave receiver waveguide 45 degrees left or          right and up or down.  The signal should be very weak or stop      completely.", "9. Rotate the microwave receiver waveguide 45 degrees left or right and up or down. The signal should be very weak or stop completely."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["Remember, microwaves travel in line of sight.  Dense objects interfere with microwave transmission and so do antenna alignments.", "Remember, microwaves travel in line of sight. Dense objects interfere with microwave transmission and so do antenna alignments."], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["10.  Realign the microwave signal horns for a maximum signal. 11.  Then carefully rotate the receiver waveguide 90 degrees                  being sure to keep the antenna base in line.", "10. Realign the microwave signal horns for a maximum signal. 11. Then carefully rotate the receiver waveguide 90 degrees being sure to keep the antenna base in line."], "jumps": ["P2370", "P2350"]}, {"id": "P2370", "text": ["Again, the signal should stop.  This demonstrates that microwaves also travel on only one plane.", "Again, the signal should stop. This demonstrates that microwaves also travel on only one plane."], "jumps": ["P2380", "P2360"]}, {"id": "P2380", "text": ["In other words, if the microwave is transmitted on one plane, the receiver must be on the same plane to receive the signal. When the receiver was rotated 90\u00ba, it was no longer on the same plane as the transmitter.", "In other words, if the microwave is transmitted on one plane, the receiver must be on the same plane to receive the signal. When the receiver was rotated 90", ", it was no longer on the same plane as the transmitter."], "jumps": ["P2385", "P2370"]}, {"id": "P2385", "text": ["Realign the microwave antenna horns for a maximum strength signal."], "jumps": ["P2390", "P2380"]}, {"id": "P2390", "text": ["1.  Return the Test Console to its initial control settings.", "1. Return the Test Console to its initial control settings."], "jumps": ["P2385"]}, {"id": "P2395", "text": ["1. Return the Transmitter and Receiver Test Consoles to their initial control settings."], "jumps": ["P2385"]}, {"id": "P2400", "text": ["2.  Set the Test Console Power to OFF.", "2. Set the Test Console Power to OFF.t Consoles Power to OFF."], "jumps": ["P2390"]}, {"id": "P2405", "text": ["2. Set the Transmitter and Receiver Test Consoles Power to OFF."], "jumps": ["P2395"]}, {"id": "P2410", "text": ["3.  Carefully remove PC130-307 and PC130-308.  \n4.  Disassemble the Model 330 microwave trainer.\n5.  Return all equipment to its proper storage area.", "3. Carefully remove PC130-307 and PC130-308. 4. Disassemble the Model 330 microwave trainer. 5. Return all equipment to its proper storage area. semble the Model 330 microwave trainer. 6. Return all equipment to its proper storage area.", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "For convenience, the microwave trainer may remain assembled and configured throughout this course. ainer are given in HELP frames.. Red test Lead ............... V input jack Black test Lead ............ COMM input jackput jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk"], "jumps": []}, {"id": "P2910", "text": ["This completes the experiment on MICROWAVE SYSTEMS.", "This completes the experiment on MICROWAVE SYSTEMS........."], "jumps": ["P2001", "P2410"]}, {"id": "P9000", "text": ["1.  Locate the dielectric resonant oscillator (DR0).", "1. Locate the dielectric resonant oscillator (DR0)."], "jumps": ["P9010"]}, {"id": "P9010", "text": [], "jumps": ["P9020", "P9000"]}, {"id": "P9020", "text": ["3. Connect the waveguide to the DRO using four hand tightened nuts and bolts. Align the components as shown."], "jumps": ["P9030", "P9010"]}, {"id": "P9030", "text": [], "jumps": ["P9040", "P9020"]}, {"id": "P9040", "text": ["5. Connect the antenna horn to the waveguide with 4 hand tightened nuts and bolts. Align the components as shown."], "jumps": ["P9060", "P9030"]}, {"id": "P9060", "text": [], "jumps": ["P9070", "P9040"]}, {"id": "P9070", "text": ["7. Connect the Waveguide stand as follows: - Place the stand under the waveguide between the DRO and the antenna horn ensuring the system is balanced. - Locate a waveguide clamp, and secure the waveguide system to the stand using male screws."], "jumps": ["P9080", "P9060"]}, {"id": "P9080", "text": ["The assembly of the transmitter section is complete."], "jumps": ["P9070"]}, {"id": "P9220", "text": ["1. Locate the integrated down converter (IDC)."], "jumps": ["P9230"]}, {"id": "P9230", "text": [], "jumps": ["P9240", "P9220"]}, {"id": "P9240", "text": ["3. Connect the waveguide to the integrated down converter with four hand tightened nuts and bolts. Align the components as shown."], "jumps": ["P9250", "P9230"]}, {"id": "P9250", "text": [], "jumps": ["P9260", "P9240"]}, {"id": "P9260", "text": ["5. Connect the antenna horn to the end of the waveguide with four hand tightened nuts and bolts. Align the components as shown."], "jumps": ["P9270", "P9250"]}, {"id": "P9270", "text": [], "jumps": ["P9280", "P9260"]}, {"id": "P9280", "text": ["7. Connect the waveguide stand as follows: - Place the stand under the waveguide between the IDC and the antenna horn, ensuring the waveguide system is balanced. - Secure the waveguide stand with a waveguide clamp using male screws."], "jumps": ["P9290", "P9270"]}, {"id": "P9290", "text": ["The assembly of the receiver section is complete."], "jumps": ["P9280"]}, {"id": "P9600", "text": ["Do not adjust the \"Frequency Adjust\" potentiometer on the DRO or down converter, located on the rear of the transmitter antenna."], "jumps": ["P9610"]}, {"id": "P9610", "text": ["1. Ensure the PC1 DC Power is ON. 2. Connect the DRO coaxial cable to PC130-307 J1 OUTPUT connector. 3. Connect the DRO 2-wire cable to PC130-307 J2 connector.", "H{__vvveeYsZZgSg;sgSgSggggAZgZgggZSV\\SVVd--WC-kBqSrlllldlZgSSSVq&/<;SZcgZSW00 .EpprnllnllZSZZAff_Hsa^@cZZa"], "jumps": ["P9620", "P9600"]}, {"id": "P9620", "text": ["4. Set the 3-position level switch to the IN position."], "jumps": ["P9630", "P9610", "PPNLYUNA"]}, {"id": "P9630", "text": ["5. Connect multimeter probes to ground and DRO Voltage test point on PC130-307. 6. Adjust the DRO Volt. Adj. for a reading of 9 VDC."], "jumps": ["P9620", "PPNLYUNA"]}, {"id": "P9640", "text": ["7. Connect multimeter probes to ground and Output test point on PC130-307. 8. Adjust the DRO Offset for a reading of 3 VDC."], "jumps": ["P9650", "P9630", "PPNLYUNA"]}, {"id": "P9650", "text": ["8. Adjust the Function Generator for a 1 kHz, 2 Vpp sine wave output. Verify output with an oscilloscope. 9. Using a BNC to BNC cable, connect the function generator output to the PC1 input connector."], "jumps": ["P9660", "P9640"]}, {"id": "P9660", "text": ["10.  Connect CH1 of the oscilloscope to ground and Output test            point on PC130-307.  DO NOT REMOVE PROBE.\n11.  Adjust Output Gain on PC130-307 for 1.5 Vpp.", "10. Connect CH1 of the oscilloscope to ground and Output test point on PC130-307. DO NOT REMOVE PROBE. 11. Adjust Output Gain on PC130-307 for 1.5 Vpp."], "jumps": ["P9650"]}, {"id": "P9670", "text": ["Do not adjust the \"Frequency Adjust\" potentiometer on the IDC or down converter, located on the rear of the transmitter antenna."], "jumps": ["P9675"]}, {"id": "P9675", "text": ["1. Ensure the PC3 DC Power is ON. 2. Connect the IDC coaxial cable to PC130-308 J1connector. 3. Connect the IDC 3-wire cable to PC130-308 J2 connector. 4. Place the AFT/NML switch on PC130-308 to the NML position."], "jumps": ["P9680", "P9670"]}, {"id": "P9680", "text": ["5. Connect multimeter probes to ground and TP1 on PC130-308. 6. Adjust the AGC potentiometer for a reading of 1.5 VDC."], "jumps": ["P9690", "P9675"]}, {"id": "P9690", "text": ["7. Connect CH2 of the oscilloscope to ground and Out test point on PC130-308.", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "If some type of signal is present (even if it is severely distorted) touch next. If there is absolutely no output signal present touch HELP. LP. HELP. input jack Black test Lead ............ COMM input jackput jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk"], "jumps": ["P9700", "P9680", "P9695"]}, {"id": "P9695", "text": ["FM DISCRIMINATOR ALIGNMENT - No signal at the Out test point of PC130-308 indicates that the variable capacitor requires some adjustment. Follow these steps:", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "1. Set the AGC control to mid position. 2. Set the GAIN control to mid position. 3. Ensure that the AFT/NML switch is set to NML. 4. Adjust the variable capacitor (C15) next to IC3 for a sine wave output as seen on the oscilloscope. .. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk"], "jumps": ["P9690"]}, {"id": "P9700", "text": ["The amplitude of the two signals may vary; however, the shape of the sine waves should be the same. 8. Adjust the Gain potentiometer on PC130-308 until they are the same if different."], "jumps": ["P9710", "P9690"]}, {"id": "P9710", "text": ["9. Place AFT/NML switch on PC130-308 to the AFT position. 10. Adjust AFT potentiometer until CH1 and CH2 signals are the same.", "diubb+A77mCCIBm sC7]h]m ]@k/))6Gjh66e/Ydeedduuuh6h", "> d)h>e@>>6di`Z_^Y`_diiiYiddee/i?eeu6uhVV", "[6ABB7kk7ued?eiijuidhe66C_& 666))6au6)STrKR167k"], "jumps": ["P9720", "P9700"]}, {"id": "P9720", "text": ["11. Disconnect the multimeter, oscilloscope and function generator from the PC cards. The microwave connections and alignments are complete."], "jumps": ["P9710"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["What is the purpose of a microwave communication system?", "communicating a message or a group of messages", "transmitting messages over a long distance"], "jumps": []}, {"id": "P10211", "text": ["Which of the choices below best describes the form(s) of information or data used in microwave communication systems?", "voice, teletype, telemetry, video and coded intelligence"], "jumps": []}, {"id": "P10212", "text": ["The purpose of the input information processor is to _______", "generate and modulate the RF microwave frequency.", "make incoming data suitable for transmission.", "amplifies the microwave RF for transmission..."], "jumps": []}, {"id": "P10213", "text": ["The purpose of the transmitter is to _______", "generate and modulate the RF microwave frequency.", "make incoming data suitable for transmission.", "amplifies the microwave RF for transmission."], "jumps": []}, {"id": "P10214", "text": ["generate and modulate the RF microwave frequency", "make incoming data suitable for transmission", "amplifies the microwave RF for transmission"], "jumps": []}, {"id": "P10215", "text": ["What is the purpose of the oscillator and modulator?", "generate and modulate the RF microwave frequency", "make incoming data suitable for transmission", "amplifies the microwave RF for transmission"], "jumps": []}, {"id": "P10216", "text": ["Where would a multiplexed signal be separated into individual messages?"], "jumps": []}, {"id": "P10217", "text": ["Multiplexing is a method that allows _______", "several messages to be transmitted on one carrier frequency. -", "messages to be relayed to increase the range of transmission.", "increasing the transmitted signal strength for increased range."], "jumps": []}, {"id": "P10218", "text": ["How is the range of microwave signals increased?"], "jumps": []}, {"id": "P10219", "text": ["What makes ordinary components and devices impractical to use for microwave frequencies?"], "jumps": []}, {"id": "P10220", "text": ["measures the magnitude and phase of standing waves"], "jumps": []}, {"id": "P10221", "text": ["What is the purpose of the Slotted Line?", "measures the magnitude and phase of standing waves"], "jumps": []}, {"id": "P10222", "text": [ iliarize you with a basic operating microwave system."], "jumps": ["P13040", "P2001"]}, {"id": "P13040", "text": ["Pick up circuit cards PC130-307 and PC130-308. These cards form the basic microwave transmitter and receiver."], "jumps": ["P13050", "P13020"]}, {"id": "P13050", "text": ["PC130-307 is the transmitter's power supply, modulator and audio oscillator."], "jumps": ["P13060", "P13040"]}, {"id": "P13060", "text": ["PC130-308 is the receiver, IF amplifier and FM discriminator."], "jumps": ["P13065", "P13050"]}, {"id": "P13065", "text": ["You have previously selected the dual trainer setup. You must exit and restart this lesson.", "Before we start the experiment, please choose the trainer configuration you will be using. e, configure and adjust the Nida Model 330 microwave trainer are given in HELP frames. Also, the Nida Model 130A Test Console's controls and settings are given in HELP frames."], "jumps": ["P13060", "P"]}, {"id": "P13080", "text": ["Let's start the experiment.", "Let's start the experiment. raphics Text)NOTE The detailed instructions on how to assemble, configure and adjust the Nida Model 330 microwave trainer are given in HELP frames. Also, the Nida Model 130A Test Console's controls and settings are given in HELP frames.", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "The detailed instructions on how to assemble, configure and adjust the Nida Model 330 microwave trainer are optional selections... Red test Lead ............... V input jack Black test Lead ............ COMM input jackput jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk"], "jumps": ["P13081", "P13090", "P13065"]}, {"id": "P13081", "text": ["Ensure that the Receiver address is set to 2. If you are using one trainer for this experiment you need to exit and restart this lesson.", "Ensure that the Transmitter address is set to 1.", "1a. Set up the Transmitter and Receiver Test Consoles for dual interface."], "jumps": ["P13085"]}, {"id": "P13085", "text": ["1b. Press Enter to set the Transmitter and Receiver Test Consoles to their initial control settings."], "jumps": ["P13081"]}, {"id": "P13090", "text": ["1.  Set theTest Console to its Initial Control Settings.", "1. Set theTest Console to its Initial Control Settings. gnate one console as the transmitter console and the other the receiver console. DO NOT connect the computer's RS-232 cable to either Test Console at this time."], "jumps": ["P13080"]}, {"id": "P13100", "text": ["2.  Assemble the Nida Model 330 Microwave Trainer if not                     previously assembled.", "2. Assemble the Nida Model 330 Microwave Trainer if not previously assembled."], "jumps": ["P13110"]}, {"id": "P13110", "text": ["3.  Install PC130-307 into PC1 position.\n4.  Install PC130-308 into PC3 position.", "3. Install PC130-307 into PC1 position. 4. Install PC130-308 into PC3 position.st Console.position of the Test Console.ly - Microwave connections - PC card alignment - Interface connection"], "jumps": ["P13120", "P13100"]}, {"id": "P13115", "text": ["3. Install PC130-307 into PC3 position on the Transmitter Test Console. 4. Install PC130-308 into PC1 position on the Receiver Test Console..Interface connection"], "jumps": ["P13122", "P13100"]}, {"id": "P13120", "text": ["5.  Press enter to set: Negative Voltage - 15\n6.  Press enter to set: Positive Voltage - 15", "5. Press enter to set: Negative Voltage - 15 6. Press enter to set: Positive Voltage - 15..indicate 15 volts.e's Voltage Meter should indicate 15 volts............."], "jumps": ["P13110"]}, {"id": "P13122", "text": ["5. Press Enter to set Transmitter: Positive Supply Voltage - 15 Negative Supply Voltage - 15 6. Press Enter to set Receiver : Positive Supply Voltage - 15 Negative Supply Voltage - 15"], "jumps": ["P13115"]}, {"id": djusted to view CH1 signal on the upper portion of the grid and CH2 signal on the lower portion. Div CH1 - 1 AC Sweep Mode - Auto Volts/Div CH2 - 1 AC Slope - + Vert Mode - Dual Coupling - AC Sweep Var - Fully CW Source - CH1 Time/Div - .5 mSec", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "Volts/Div CH1 - 1 AC Sweep Mode - Auto Volts/Div CH2 - 1 AC Slope - + Vert Mode - Dual Coupling - AC Sweep Var - Fully CW Source - CH1 Time/Div - .5 mSec"], "jumps": ["P13147", "P13140"]}, {"id": "P13147", "text": ["3.  Connect CH1 of the oscilloscope to the OUTPUT TP on                   PC130-307.  Adjust the output Gain control for a minimum               signal.  The internal 1 kHz signal is large and, even at the                 lowest settings, may cause distortion in the microwave                    receiver.", "3. Connect CH1 of the oscilloscope to the OUTPUT TP on PC130-307. Adjust the output Gain control for a minimum signal. The internal 1 kHz signal is large and, even at the lowest settings, may cause distortion in the microwave receiver."], "jumps": ["P13148", "P13143"]}, {"id": "P13148", "text": ["4.  Connect CH2 of the oscilloscope to the OUTPUT TP on\n     PC130-308.  Adjust the Gain control for the least amount of             distortion.", "4. Connect CH2 of the oscilloscope to the OUTPUT TP on PC130-308. Adjust the Gain control for the least amount of distortion."], "jumps": ["P13150", "P13147"]}, {"id": "P13150", "text": ["The presence of a waveform at the receiver demonstrates that the microwave system is operating.  By observing a signal on the receiver you can assume that the microwave transmitter, receiver and waveguides are functioning correctly.", "The presence of a waveform at the receiver demonstrates that the microwave system is operating. By observing a signal on the receiver you can assume that the microwave transmitter, receiver and waveguides are functioning correctly."], "jumps": ["P13180", "P13148", "P2155"]}, {"id": "P13155", "text": ["WAVEFORM - If you do not see the waveform, ensure that the test console and microwave trainer are setup correctly. Go back to step 1 and repeat the setup procedures. If you still do not see the waveform and you are sure your setup is correct, contact your instructor for assistance."], "jumps": []}, {"id": "P13160", "text": ["5.  Place a book or other dense object in front of the transmitter          horn.", "5. Place a book or other dense object in front of the transmitter horn. raphics Text) WARNING Never put any portion of exposed skin in front of an operating microwave transmitter. The power output from most microwave transmitters will cause serious burns or internal injury.", "using an analog multimeter, the needle will move off scale to the left. Disconnect the test leads to ensure that the meter movement is not damaged. The voltage level IN THIS measurement is low and should not damage your multimeter.", "Never put any portion of exposed skin in front of an operating microwave transmitter. The power output from most microwave transmitters will cause serious burns or internal injury. ury. ut jack Black test lead ................. COMM input jackkkkkkkkkkkjackkkkkkkkkkkkkk"], "jumps": ["P13165", "P13180"]}, {"id": "P13165", "text": ["Notice the received signal (CH2 on the oscilloscope) is distorted. This proves the received signal is generated by the transmitter."], "jumps": ["P13170", "P13160"]}, {"id": "P13170", "text": ["6.  Remove the obstruction from the transmitter antenna horn.            Do you still hear the signal?", "6. Remove the obstruction from the transmitter antenna horn. Do you still hear the signal?"], "jumps": ["P13165"]}, {"id": "P13171", "text": [], "jumps": []}, {"id": "P13172", "text": ["You should see a signal on CH2 of the oscilloscope.  Ensure that you have removed the dense object from in front of the transmitter antenna horn.", "You should see a signal on CH2 of the oscilloscope. Ensure that you have removed the dense object from in front of the transmitter antenna horn...."], "jumps": []}, {"id": "P13180", "text": ["Remember, microwaves are line of sight waves and obstructions will stop the transmission."], "jumps": ["P13160", "P13150"]}, {"id": "P13190", "text": ["The received signal should again be visible on the oscilloscope.", "The received signal should again be visible on the oscilloscope..."], "jumps": ["P13200", "P13170"]}, {"id": "P13200", "text": ["7.  Position the 3 position lever switch on PC130-307 to the IN             position.  The received signal should stop.", "7. Position the 3 position lever switch on PC130-307 to the IN position. The received signal should stop."], "jumps": ["P13210", "P13190"]}, {"id": "P13210", "text": ["The 10.5 GHz carrier signal is still being transmitted to the receiver.  Only the internal information or data (1 kHz tone) has      been taken away.  The system is set to receive an external input of information or data.", "The 10.5 GHz carrier signal is still being transmitted to the receiver. Only the internal information or data (1 kHz tone) has been taken away. The system is set to receive an external input of information or data."], "jumps": ["P13220", "P13200"]}, {"id": "P13220", "text": ["The basic microwave system operates as follows.", "The basic microwave system operates as follows............."], "jumps": ["P13230", "P13210"]}, {"id": "P13230", "text": ["Experiment card PC130-307 contains the circuitry required to power and modulate the microwave carrier frequency.  This card includes an audio tone generator used to produce an information signal to be transmitted.", "Experiment card PC130-307 contains the circuitry required to power and modulate the microwave carrier frequency. This card includes an audio tone generator used to produce an information signal to be transmitted.", "H{__vvveeYsZZgSg;sgSgSggggAZgZgggZSV\\SVVd--WC-kBqSrlllldlZgSSSVq&/<;SZcgZSW00 .EpprnllnllZSZZAff_Hsa^@cZZa"], "jumps": ["P13240", "P13220"]}, {"id": "P13240", "text": ["In future experiments you will investigate this circuit to learn how the microwave carrier is developed."], "jumps": ["P13250", "P13230"]}, {"id": "P13250", "text": ["The DRO, microwave oscillator on the waveguide, receives the audio signal and power from PC130-307.  The DRO contains the solid state circuitry required to develop the 10.5 GHz carrier signal.", "The DRO, microwave oscillator on the waveguide, receives the audio signal and power from PC130-307. The DRO contains the solid state circuitry required to develop the 10.5 GHz carrier signal.", "H{__vvveeYsZZgSg;sgSgSggggAZgZgggZSV\\SVVd--WC-kBqSrlllldlZgSSSVq&/<;SZcgZSW00 .EpprnllnllZSZZAff_Hsa^@cZZa"], "jumps": ["P13260", "P13240"]}, {"id": "P13260", "text": ["The unit is sealed and requires no adjustments.  Special test equipment is required to measure frequencies in the GHz range. In this course, the carrier frequency will NOT be measured directly.  The standing wave ratio method will be used to determine carrier frequency.", "The unit is sealed and requires no adjustments. Special test equipment is required to measure frequencies in the GHz range. In this course, the carrier frequency will NOT be measured directly. The standing wave ratio method will be used to determine carrier frequency."], "jumps": ["P13270", "P13250"]}, {"id": "P13270", "text": ["The DRO is attached to the waveguide transmitter section.  The modulated carrier frequency is funnelled into the waveguide.", "The DRO is attached to the waveguide transmitter section. The modulated carrier frequency is funnelled into the waveguide."], "jumps": ["P13280", "P13260"]}, {"id": "P13280", "text": ["The signal horn is the last item on the transmitter waveguide.  It is the antenna used to direct or aim the radiated RF energy.", "The signal horn is the last item on the transmitter waveguide. It is the antenna used to direct or aim the radiated RF energy."], "jumps": ["P13290", "P13270"]}, {"id": "P13290", "text": ["The receiver waveguide system uses the same type of antenna. This antenna picks up the transmitted signal and directs it down the waveguide."], "jumps": ["P13300", "P13280"]}, {"id": "P13300", "text": ["The received signal is processed by the Down Converter and sent to PC130-308 where the information signal is separated from the carrier.  The Down Converter is sealed like the DRO.", "The received signal is processed by the Down Converter and sent to PC130-308 where the information signal is separated from the carrier. The Down Converter is sealed like the DRO."], "jumps": ["P13310", "P13290"]}, {"id": "P13310", "text": ["Experiment card PC130-308 contains the circuitry required to produce the IF frequency and separate the information signal from the carrier signal."], "jumps": ["P13320", "P13300"]}, {"id": "P13320", "text": ["In future experiments, you will investigate this circuit to learn how the IF signal is developed."], "jumps": ["P13330", "P13310"]}, {"id": "P13330", "text": ["8.  Place the 3 position lever switch on PC130-307 to the SINE             WAVE position.  The signal should be present.", "8. Place the 3 position lever switch on PC130-307 to the SINE WAVE position. The signal should be present."], "jumps": ["P13340", "P13320"]}, {"id": "P13340", "text": ["9.  Rotate the microwave receiver waveguide 45 degrees left or          right and up or down.  The signal should be very weak or stop      completely.", "9. Rotate the microwave receiver waveguide 45 degrees left or right and up or down. The signal should be very weak or stop completely."], "jumps": ["P13350", "P13330"]}, {"id": "P13350", "text": ["Remember, microwaves travel in line of sight.  Dense objects interfere with microwave transmission and so do antenna alignments.", "Remember, microwaves travel in line of sight. Dense objects interfere with microwave transmission and so do antenna alignments."], "jumps": ["P13360", "P13340"]}, {"id": "P13360", "text": ["10.  Realign the microwave signal horns for a maximum signal. 11.  Then carefully rotate the receiver waveguide 90 degrees                  being sure to keep the antenna base in line.", "10. Realign the microwave signal horns for a maximum signal. 11. Then carefully rotate the receiver waveguide 90 degrees being sure to keep the antenna base in line."], "jumps": ["P13370", "P13350"]}, {"id": "P13370", "text": ["Again, the signal should stop.  This demonstrates that microwaves also travel on only one plane.", "Again, the signal should stop. This demonstrates that microwaves also travel on only one plane."], "jumps": ["P13380", "P13360"]}, {"id": "P13380", "text": ["In other words, if the microwave is transmitted on one plane, the receiver must be on the same plane to receive the signal. When the receiver was rotated 90\u00ba, it was no longer on the same plane as the transmitter.", "In other words, if the microwave is transmitted on one plane, the receiver must be on the same plane to receive the signal. When the receiver was rotated 90", ", it was no longer on the same plane as the transmitter."], "jumps": ["P13385", "P13370"]}, {"id": "P13385", "text": ["Realign the microwave antenna horns for a maximum strength signal."], "jumps": ["P13380"]}, {"id": "P13400", "text": ["1.  Set the Test Console Power to OFF.", "1. Set the Test Console Power to OFF.t Consoles Power to OFF."], "jumps": []}, {"id": "P13405", "text": ["1. Set the Transmitter and Receiver Test Console Power to OFF."], "jumps": []}, {"id": "P13410", "text": ["2.  Carefully remove PC130-307 and PC130-308.  \n3.  Disassemble the Model 330 microwave trainer.\n4.  Return all equipment to its proper storage area.", "2. Carefully remove PC130-307 and PC130-308. 3. Disassemble the Model 330 microwave trainer. 4. Return all equipment to its proper storage area. semble the Model 330 microwave traine     box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
</body>
