is is the fourth line of text for the distractor. X", "Causes PFN to charge to twice the power supply potential. $C: Discharges PFN residual energy. m", "Reduces oscillations on the Modulated pulse.", "What is the function of the charging choke in the Line-Type Modulator?"], "jumps": []}, {"id": "P10211", "text": ["Which type of RADAR energy is not used for stationary objects? q"], "jumps": []}, {"id": "P10210", "text": ["What two types of energy transmission do RADAR systems employ? s"], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2920", "P2001"]}, {"id": "P2980", "text": ["7. The function of the Video Detector (2nd detector) is to convert the IF signal into a video signal which will be amplified by the Video Amplifier and processed and applied to the indicator display and target tracking circuits.."], "jumps": []}, {"id": "P2970", "text": ["6. Noise generated in the input IF Amplifier's first stage will be amplified by succeeding stages and may exceed the echo signal in strength. The echo would be hidden behind the noise on the RADAR's display."], "jumps": []}, {"id": "P2960", "text": ["5. A RADAR with frequency agility for each pulse repetition interval eliminates range ambiguities caused by target echoes returning after the next pulse interval begins.."], "jumps": []}, {"id": "P2950", "text": ["4. Most RADAR receivers use 30 MHz or 60 MHz intermediate frequencies. A major factor in RADAR receiver operation is the tracking stability of a local oscillator, which generates the frequency that beats with the incoming signal to produce the IF."], "jumps": []}, {"id": "P2940", "text": ["3. The following characteristics determine the design requirements of an effective receiver: Noise, Gain, Tuning, Distortion, and Blockingggg"], "jumps": []}, {"id": "P2930", "text": ["2. All modern RADAR receivers are of the Superheterodyne type. The components of a typical RADAR receiver are a mixer, local oscillator, IF amplifiers, video detector, video amplifiers, and output circuits to provide inputs to built-in or remote indicators."], "jumps": []}, {"id": "P2920", "text": ["1. The RF echo signals reflected by distant objects are similar to the transmitted signal, but they are considerably diminished in amplitude. A voltage amplification of 10 is required to produce a video pulse of sufficient amplitude to intensify the beam of an indicator's Cathode Ray Tube (CRT) ."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on RADAR RECEIVERS. ck: P2560"], "jumps": ["P2500", "P2001"]}, {"id": "P2500", "text": ["A Fast-Time-Constant (FTC) circuit is a short time constant differentiator circuit located between the Video Detector and the input to the first video amplifier. When a large block of video is applied to the FTC circuit, only the leading edge will pass..."], "jumps": ["P2910"]}, {"id": "P2490", "text": ["Gated AGC will not respond to jamming pulses that arrive outside the gating period. Without gated AGC, jamming signals would cause the AGC to follow the interfering signal rather than the real target signal return..."], "jumps": []}, {"id": "P2480", "text": ["Gated AGC and Fast-Time-Constant (FTC) circuits are used to overcome the effects of Electromagnetic Interference jamming. A gated AGC circuit permits signals that occur only in a very short time interval (gating period) to develop the AGC..."], "jumps": []}, {"id": "P2470", "text": ["STC decreases the amplitude of nearby object return signals, while IAGC decreases the amplitude of larger-than average return signals. Signal returns between the extremes are easily compensated for by the combination of STC and IAGC..."], "jumps": []}, {"id": "P2460", "text": ["At the end of the transmitted pulse, the STC voltage begins to rise, gradually increasing the receiver gain to maximum. The combination of STC and IAGC circuits result in better overall receiver performance..."], "jumps": []}, {"id": "P2450", "text": ["STC circuits apply a bias voltage that varies with time, to the IF Amplifiers in order to control receiver gain. When the transmitter fires, the STC circuit decreases the receiver gain to zero to prevent the amplification of any transmitter leakage energy and high-energy sea return.../"], "jumps": []}, {"id": "P2440", "text": ["The receiver gain for best visibility of nearby object return signals is not the best adjustment for distant object return signals. Sensitivity Time-Control (STC) circuits are used to adjust amplifier gain to time (range) during a single pulse repetition period."], "jumps": []}, {"id": "P2430", "text": ["The automatic gain control can be shutoff to allow an operator to manually adjust the receiver gain for the best reception of a particular signal."], "jumps": []}, {"id": "P2420", "text": ["Automatic Gain Control (AGC) and Instantaneous Automatic Gain Control (IAGC) circuits produce a voltage proportional to the average strength of the detected signal and noise. The gain of the IF amplifier automatically varies with changes in the RADAR return signal amplitude..."], "jumps": []}, {"id": "P2410", "text": ["RADAR receiver performance can be degraded due to unfavorable weather conditions, sea returns and Electromagnetic interference from external sources such as Electronic Counter Measures (ECM) jamming.g."], "jumps": []}, {"id": "P2400", "text": ["A Video Mixer may be used to combine the video signal and other RADAR information such as ship or aircraft heading markers and range markers."], "jumps": []}, {"id": "P2390", "text": ["The Video Processor is used to analyze and shape the video signal before it is applied to the other circuits. The Video Processor forces a received signal to meet certain requirements prior to its acceptance as a valid target return..."], "jumps": []}, {"id": "P2380", "text": ["The function of the Video Detector (2nd detector) is to convert the IF signal into a video signal which will be amplified by the Video Amplifier and processed and applied to the indicator display and target tracking circuits..."], "jumps": []}, {"id": "P2370", "text": ["Noise generated in the input IF Amplifier's first stage will be amplified by succeeding stages and may exceed the echo signal in strength. The echo would be hidden behind the noise on the RADAR's display...."], "jumps": []}, {"id": "P2360", "text": ["The most critical stage of a RADAR receiver's IF section is the input or first stage. The characteristics of this stage determine the noise figure and the sensitivity with respect to detecting small objects at long ranges..."], "jumps": []}, {"id": "P2350", "text": ["The IF amplifier determines the receiver's gain, signal-to-noise ratio, and effective bandwidth. The typical IF Amplifier contains three to ten amplifier stages each with sufficient gain to accommodate the expected echo signal power..."], "jumps": []}, {"id": "P2340", "text": ["The crystal rectifiers are nonlinear devices, and the output from each crystal is an IF signal equal to the difference between the local oscillator frequency and the incoming echo signal frequency..."], "jumps": []}, {"id": "P2330", "text": ["RADAR receiver Mixers, convert the received RF signal to a lower frequency IF signal without the loss of signal intelligence. The crystals inserted directly into the waveguide to monitor frequency differences and eliminates noise..se..ifferences and eliminates noise..."], "jumps": ["P2320"]}, {"id": "P2324", "text": ["The 3 kHz to 30 kHz is typically used in Very Low Frequency radios."], "jumps": []}, {"id": "P2323", "text": ["The 3 MHz to 6 MHz range is too low for a typical RADAR receiver IF frequency."], "jumps": []}, {"id": "P2322", "text": ["The transmitter frequencies used in RADAR systems fall into the 3 GHz to 30 GHz range."], "jumps": []}, {"id": "P2321", "text": [], "jumps": []}, {"id": "P2320", "text": ["What Intermediate Frequencies (IF) is normally used in RADAR receivers?"], "jumps": ["P2310"]}, {"id": "P2310", "text": ["Frequency Synthesizers provide the different base frequencies that can be individually selected, multiplied, and amplified for application to the transmitter and receiver circuits."], "jumps": []}, {"id": "P2300", "text": ["A RADAR with frequency agility for each pulse repetition interval eliminates range ambiguities caused by target echoes returning after the next pulse interval begins."], "jumps": []}, {"id": "P2290", "text": ["Newer RADAR systems replace the AFC system with a Coherent Frequency Generator system. The base frequency is much lower than the transmitted frequency and is multiplied and mixed at different levels. This allows frequency diversity and agility with each transmitted pulse..."], "jumps": []}, {"id": "P2280", "text": ["Receivers that use crystal mixers, require a Stable Local Oscillator (STALO) because of its ability to be tuned over a range of several megahertz. This compensates for changes in the transmitted frequency and in its own frequency..."], "jumps": []}, {"id": "P2270", "text": ["If the local oscillator frequency is 3 GHz (3000 MHz), a frequency shift of just 0.1 percent would be a 3 MHz frequency shift. This could equal the bandwidth of the receiver and cause considerable loss in gain..."], "jumps": []}, {"id": "P2260", "text": ["Most RADAR receivers use 30 MHz or 60 MHz intermediate frequencies. A major factor in RADAR receiver operation is the tracking stability of a local oscillator, which generates the frequency that beats with the incoming signal to produce the IF..."], "jumps": []}, {"id": "P2250", "text": ["The error voltage magnitude is proportional to the amount of deviation from the correct IF and the polarity determines the direction of the error. The error voltage corrects the frequency of the local oscillator common to both Receiver Mixer and AFC Mixer..."], "jumps": []}, {"id": "P2240", "text": ["If the transmitter and receiver are correctly in tune, the resultant difference frequency will be at the correct IF. Any deviation from the correct IF signal is detected by the AFC Frequency Discriminator, which generates an error voltage..."], "jumps": []}, {"id": "P2230", "text": ["The Automatic Frequency Control (AFC) System or difference frequency system, keeps the receiver in tune with the transmitter. A portion of the transmitter signal is coupled into the AFC Mixer and is heterodyned with the local oscillator signal..."], "jumps": []}, {"id": "P2220", "text": ["The low-impedance output of the emitter follower matches the impedance of the cable. The video pulses are coupled through the cable to the indicator for video display on the Cathode Ray Tube (CRT)..."], "jumps": []}, {"id": "P2210", "text": ["The output of the IF amplifiers is applied to the Second Detector. It is rectified and passed through one or more stages of amplification in the video amplifier(s). The output stage of the receiver is normally an emitter follower..."], "jumps": ["P2200"]}, {"id": "P2204", "text": ["The Magic-T is a type of receiver mixer that cancels local oscillator noise."], "jumps": []}, {"id": "P2203", "text": ["Most RADAR receivers us a 30 MHz to 60 MHz IF frequency. The local oscillator frequency is mixed with the incoming echo signal to produce the IF frequency.X"], "jumps": []}, {"id": "P2202", "text": ["The Unbalanced Crystal Mixer is the simplest type of mixer used in RADAR receivers."], "jumps": []}, {"id": "P2201", "text": [], "jumps": []}, {"id": "P2200", "text": ["What type of receiver is most often used in RADAR systems?."], "jumps": ["P2190"]}, {"id": "P2194", "text": ["Partially correct, the gain of the receiver must be very high to amplify the weak echo returns from objects.."], "jumps": []}, {"id": "P2193", "text": ["Blocking refers to a condition of the receiver in which the voltage pulse at the receiver input is too large. Small, nearby objects will be affected."], "jumps": []}, {"id": "P2192", "text": ["Partially correct, distortion will affect the range accuracy."], "jumps": []}, {"id": "P2191", "text": [], "jumps": []}, {"id": "P2190", "text": ["What is the greatest limiting factor in a receiver's maximum detectable range?"], "jumps": ["P2180"]}, {"id": "P2180", "text": ["Blocking occurs when the voltage pulse at the RADAR receiver input is too large or a portion of the transmit pulse leaks into the receiver input. As a result, the receiver for a short time, is insensitive to signals below a certain level and may not show small, nearby objects. The duplexer protects the receiver by isolating it during the transmitted pulse......"], "jumps": []}, {"id": "P2170", "text": ["If distortion occurs in a RADAR receiver, the time interval between the transmitted pulse and the received pulse changes, thereby affecting range accuracy."], "jumps": []}, {"id": "P2160", "text": ["RADAR receivers require a limited tuning range to compensate for transmitter and local oscillator frequency changes caused by variations in temperature and loading. Microwave RADAR receivers usually use automatic frequency control (AFC) circuits for this purpose..."], "jumps": []}, {"id": "P2150", "text": ["The Gain of a Radar receiver must be very high because the strength of the returned signal is at a level of microvolts and the required output to the indicator is several volts. Radar gain is roughly 10 to 10 . below the noise level. Try to minimize attenuation of the echo before it is amplified.level falls below the noise level. Try to minimize attenuation of the echo before it is amplified.t is amplified....."], "jumps": []}, {"id": "P2140", "text": ["In RADAR, noise voltages result in erratic, random deflection or intensity of the indicator sweep that can mask small return signals. The signal detection limit of a receiver is reached when the signal level falls below the noise level. Try to minimize attenuation of the echo before it is amplified...level falls below the noise level. Try to minimize attenuation of the echo before it is amplified.t is amplified....."], "jumps": []}, {"id": "P2130", "text": ["The following characteristics determine the design requirements of an effective receiver: Noise, Gain, Tuning, Distortion, Blocking."], "jumps": []}, {"id": "P2120", "text": ["After conversion to the intermediate frequency, the signal is amplified in several IF Amplifier stages. Most of the receiver gain is developed and the overall bandwidth is determined by the IF stages.s"], "jumps": []}, {"id": "P2110", "text": ["Heterodyning the returning RF signal echo with the local oscillator signal in a nonlinear device (mixer) and extracting the difference or Intermediate Frequency (IF) accomplish the conversion..."], "jumps": []}, {"id": "P2100", "text": ["Some receivers, send the antenna signal directly to the mixer, as shown by the dashed line. The Mixer, or first detector, converts the high frequency RF signal to a lower intermediate frequency signal, usually 30 or 60 MHz..."], "jumps": []}, {"id": "P2090", "text": ["Tunnel-diodes, Traveling Wave Tube's (TWT) and parametric microwave amplifiers are used as low-noise, high-gain RF Amplifiers. When external noise is negligible, the noise generated by the input stage of the receiver determines the receiver sensitivity..."], "jumps": []}, {"id": "P2080", "text": ["The echo signal enters the system by way of the antenna. It passes through the duplexer and is amplified by the low noise RF Amplifier. RF Amplifier design is critical because weak signals could be masked by noise generated by the components in the amplifier..."], "jumps": ["P2070"]}, {"id": "P2075", "text": ["SUPERHETERODYNE - A receiver in which the incoming modulated RF signals are amplified in a preamplifier and then fed into the mixer for conversion into a fixed, lower carrier frequency (called the intermediate frequency.)))))))"], "jumps": []}, {"id": "P2070", "text": ["All modern RADAR receivers are of the Superheterodyne type. The components of a typical RADAR receiver are a mixer, local oscillator, IF amplifiers, video detector, video amplifiers, and output circuits to provide inputs to built-in or remote indicators..."], "jumps": ["P2080"]}, {"id": "P2060", "text": ["The term Dynamic Range is applied to RADAR receivers. It identifies the difference, in decibels, between the largest signal the receiver can handle without saturating, and the minimum discernable signal it can detect..."], "jumps": []}, {"id": "P2050", "text": ["The receiver must be selective to the point that it amplifies only the echo signals generated from its associated transmitter. At the same time, the receiver must be able to accurately track the transmitter in frequency because drift would degrade echo reception..."], "jumps": []}, {"id": "P2040", "text": ["The RADAR receiver must accomplish this amplification with minimum introduction of noise voltages. In addition to having a high gain and low noise ratio, the receiver must provide sufficient bandwidth to pass the many harmonics contained in the echo signal..."], "jumps": []}, {"id": "P2030", "text": ["RADAR receivers are sensitive enough to accept signals in the order of picowatts and amplify them in many useful ways. The weaker the signal, which a receiver can accept and efficiently display, the greater the effective range of the RADAR..."], "jumps": []}, {"id": "P2020", "text": ["The RF echo signals reflected by distant objects are similar to the transmitted signal, but they are considerably diminished in amplitude. A voltage amplification of 10 is required to produce a video pulse of sufficient amplitude to intensify the beam of an indicators Cathode Ray Tube (CRT) ."], "jumps": ["P2001", "P2030"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1990", "P1001"]}, {"id": "P1990", "text": ["8. The Power-Amplifier Transmitter system does the same thing as the keyed-oscillator transmitter but with fewer stability problems. It generates, shapes, and amplifies pulses of RF energy for transmission."], "jumps": ["P1980", "P1999"]}, {"id": "P1980", "text": ["7. The discharge time of the PFN controls the time the transmitter tube generates an RF energy output. Therefore, PFN discharge time determines the Pulse Width (PW) of the RADAR......"], "jumps": ["P1970", "P1999", "PW"]}, {"id": "P1970", "text": ["6. During the discharge cycle, the PFN is waiting for the thyratron or SCR (switch) to turn on. The thyratron is usually filled with hydrogen gas because it ionizes rapidly, presents a very low impedance, and is capable of handling very large current flows."], "jumps": []}, {"id": "P1960", "text": ["5. During the charge cycle, as the power supply output begins to charge the PFN, the current flow causes a strong magnetic field in the charging choke. When the charge in the PFN approaches the power supply potential, current in the circuit begins to decrease....."], "jumps": []}, {"id": "P1950", "text": ["4. Modulators are pulsed DC power supplies. They rapidly and accurately switch their states using electronic components. The most common modulator in use by RADAR systems is the Line-Type Modulator......."], "jumps": []}, {"id": "P1940", "text": ["3. For efficient RADAR operation, a magnetron requires a modulator pulse that has a flat top and steep leading and trailing edges. An effective modulator pulse must meet the following requirements::::", "It must go from 0 volts to maximum voltage almost instantaneously.", "It must stay at this maximum voltage level throughout the pulse width (PW).", "At the end of the pulse, it must drop instantaneously from maximum voltage to 0 volts."], "jumps": ["PW"]}, {"id": "P1930", "text": ["2. Modulators are an integral component of any pulse RADAR system. Modulators ensure that the transmitter operates at the correct pulse repetition frequency (PRF) and pulse width (PW)........"], "jumps": ["PRF", "PW"]}, {"id": "P1920", "text": ["1. RADAR systems employ two basic types of energy transmission: Pulse and Continuous Wave (CW).)..."], "jumps": ["P1001", "P1930"]}, {"id": "P1910", "text": ["You have completed the information on RADAR TRANSMITTERS..."], "jumps": ["P1460", "P1001"]}, {"id": "P1460", "text": ["If the length of the synchronizer trigger pulse is 60 nsec, then the hard tube modulator will conduct for 60 nsec, and the transmitter will conduct for 60 nsec. The hard tube modulator and the transmitter will return to cutoff between synchronizer trigger pulses."], "jumps": ["P1910"]}, {"id": "P1450", "text": ["While V1 conducts, the plate voltage drops from 9 KV to 1 KV, which causes C1 to discharge from +9 KV to +1KV. Effectively, a negative 8 KV signal is sent from the hard tube modulator to trigger the transmitter.est, echo signals may be received..."], "jumps": []}, {"id": "P1440", "text": ["The purpose of the Acknowledge pulse, is to notify the indicator that the modulator has fired. Thus the Acknowledge pulse is used to synchronize the indicator to the transmitter.n which the transmitter is at rest, echo signals may be received..."], "jumps": []}, {"id": "P1430", "text": ["When V1 is conducting, current flows through VR1, which develops a + 14 V positive pulse the same duration as the Synchronizer pulse. This pulse is called the Acknowledge pulse.in which the transmitter is at rest, echo signals may be received..."], "jumps": []}, {"id": "P1420", "text": ["The Synchronizer sends a + 535 VDC trigger pulse to the control grid of V1. The static", "435 VDC is effectively raised to +100 VDC for the duration of the pulse. The resulting positive voltage on the control grid forces the vacuum tube (V1) into conduction."], "jumps": []}, {"id": "P1410", "text": ["When the hard tube modulator is cutoff, there will be 9 KVDC on the plate of the vacuum tube V1 and C1 will be charged to 9 KVDC. The cathode of V1 will have 0 VDC, because of no current flow through the zener diode VR1. The screen grid of V1 will have +800 VDC."], "jumps": []}, {"id": "P1400", "text": ["The Hard Tube Modulator is another type of high voltage modulator used in Radar systems. The Hard Tube is initially cutoff by having a", "435 VDC on the control grid, which allows vacuum tube (V1) to warm up.at rest, echo signals may be received..."], "jumps": []}, {"id": "P1390", "text": ["The Pulse Transformer is a special step-up transformer that matches the impedance of the PFN to the high-power tube. The core is composed of thin laminations of ferromagnetic material, usually silicon steel..."], "jumps": ["P1380"]}, {"id": "P1383", "text": ["The Charging Choke causes PFN to charge to twice the power supply potential."], "jumps": []}, {"id": "P1382", "text": ["The Pulse Transformer keeps same HV potential on both filament leads."], "jumps": []}, {"id": "P1381", "text": [], "jumps": []}, {"id": "P1380", "text": ["reduces oscillations on the Modulated pulse.", "causes PFN to charge to twice the power supply potential.", "keeps same HV potential on both filament leads.", "Damping Circuit _______ion is typed........................"], "jumps": []}, {"id": "P1372", "text": ["Stationary objects do not produce a difference frequency or Doppler effect and can't be detected by CW RADARs."], "jumps": []}, {"id": "P1371", "text": [], "jumps": []}, {"id": "P1370", "text": ["Which type of RADAR energy is not used for stationary objects?"], "jumps": ["P1360"]}, {"id": "P1363", "text": ["Partially correct most search RADARs are of the pulsed type."], "jumps": []}, {"id": "P1362", "text": ["Electrostatic and Electromagnetic are PFN forming methods.."], "jumps": []}, {"id": "P1361", "text": [], "jumps": []}, {"id": "P1360", "text": ["What two types of energy transmission do RADAR systems employ?"], "jumps": []}, {"id": "P1355", "text": ["The high voltage modulator pulse from the PFN is coupled through T1 to the Traveling Wave Tube (TWT) in the transmitter. The transmitter TWT generates an RF electromagnetic energy pulse, which is sent to the antenna via the duplexer and associated waveguide."], "jumps": []}, {"id": "P1350", "text": ["Additionally, the number of times the PFN discharges controls the number of times the transmitter transmits its pulse or Pulse Repetition Frequency (PRF). er, the Synchronizer's Mod Trigger signal closes the electronic switch, which discharges the PFN..FN..."], "jumps": ["PRF"]}, {"id": "P1340", "text": ["The discharge time of the PFN controls the time the transmitter tube generates an RF energy output. Therefore, PFN discharge time determines the Pulse Width (PW) of the RADAR."], "jumps": ["P1330", "PW"]}, {"id": "P1330", "text": ["With the load impedance closely matched to the PFN impedance, the voltage pulse that appears across the transformer primary equals one-half the voltage that was stored in the PFN and is of a duration equal to the PFN discharge time.."], "jumps": ["P1320"]}, {"id": "P1325", "text": ["Ringing- Shock-excited oscillations in the PFN after the discharge cycle. Damping circuits eliminate the oscillations."], "jumps": []}, {"id": "P1320", "text": ["At the end of the discharge cycle, the bypass circuit removes any residual energy and the damping circuit prevents ringing."], "jumps": ["P1330"]}, {"id": "P1310", "text": ["Once the voltage level caused by the PFN discharge drops at (Point E), ionization of the thyratron ceases. This opens the PFN discharge path stopping all current flow and in turn stopping T1 output, (Point F)..."], "jumps": ["Point"]}, {"id": "P1300", "text": ["The PFN discharges for a specified time (PW) dictated by the inductive and capacitive properties of the PFN. While the PFN continues to discharge through T1, the transmitter tube generates an RF output..."], "jumps": ["PW"]}, {"id": "P1290", "text": ["Impedance values of the PFN and the load are matched so when the discharge occurs at (Point B), voltage is equally distributed between the two (Points C and D)."], "jumps": ["Point", "Points"]}, {"id": "P1280", "text": ["The Mod Trigger signal from the synchronizer ionizes the thyratron, which creates a low impedance path for the PFN. The PFN immediately discharges through it and the load Transformer (T1)..."], "jumps": []}, {"id": "P1270", "text": ["Looking at the standard RADAR system waveforms diagram, everything is synchronized to the PRE TRIGGER pulse from the Synchronizer. The thyratron (switch) is waiting for the Mod Trigger pulse from the synchronizer..."], "jumps": []}, {"id": "P1260", "text": ["During the discharge cycle, the PFN is waiting for the thyratron or SCR (switch) to turn on. The thyratron is usually filled with hydrogen gas because it ionizes rapidly, presents a very low impedance, and is capable of handling very large current flows..."], "jumps": []}, {"id": "P1250", "text": ["Remember, the charging diode prevents the PFN from discharging through the power supply. Because there is currently no discharge path, the PFN will be held off, and maintain its charge (Point A) until a discharge path is presented..."], "jumps": ["Point"]}, {"id": "P1240", "text": ["As the magnetic field collapses, it adds another charge equal to 90% of the power supplies potential to the PFN. Thus, the PFN stores a charge equal to 180% (or 1.8 times) the total power supply potential..."], "jumps": []}, {"id": "P1230", "text": ["When the PFN reaches 90% of the power supply's potential, the reduced current can no longer maintain the magnetic field in the charging choke. Without current flow to sustain the field, it collapses..."], "jumps": []}, {"id": "P1220", "text": ["As the power supply output begins to charge the Pulse Forming Network (PFN), the current flow causes a strong magnetic filed in the charging choke. When the charge in the PFN approaches the power supply potential, current in the circuit begins to decrease..."], "jumps": ["PFN"]}, {"id": "P1210", "text": ["An electronic element, such as a thyratron or Silicon Controlled Rectifier (SCR) is used as a switch in pulsed RADARs. When the switch is closed, a low-impedance discharge path is provided for the storage device through the pulse transformer...."], "jumps": []}, {"id": "P1200", "text": ["The load for the modulator is a high-power transmitter tube (TWT). The modulator output is coupled to the load via a pulse transformer that compensates for impedance mismatches. The use of a pulse transformer allows the DC to charge the storage device..."], "jumps": []}, {"id": "P1190", "text": ["Damping circuits prevent oscillations called ringing after the PFN has discharged."], "jumps": []}, {"id": "P1180", "text": ["In the Bypass Circuit, resistor (R1) removes any remaining, or residual, charge from the PFN after it discharges. The Bypass Diode (CR2) prevents reverse charging of the PFN."], "jumps": []}, {"id": "P1170", "text": ["A charging choke aids the charging of the PFN and controls charge time. The charging diode prevents the PFN from discharging through the power supply and holds off the PFN discharge until the switch closes..."], "jumps": []}, {"id": "P1160", "text": ["The storage device is an inductive and capacitive circiut or combination circuit that stores electrical energy in the form of an electrostatic or electromagnetic field. The electrostatic storage method uses a Pulse Forming Network (PFN) to determine the pulse shape of the RADAR..the RADAR."], "jumps": ["PFN"]}, {"id": "P1150", "text": ["The power supply provides a source of DC power to charge the storage device."], "jumps": []}, {"id": "P1140", "text": ["Line-Type Modulators use several components to generate the high power DC pulse needed by a RADAR transmitter. NOTE: Position the mouse over each block for component descriptions."], "jumps": []}, {"id": "P1130", "text": ["Modulators, are pulsed DC power supplies. They rapidly and accurately switch their states using electronic components. The most common modulator in use by RADAR systems is the Line-Type Modulator......"], "jumps": []}, {"id": "P1120", "text": ["The characteristics of an efficient pulse require the power supply to be able to switch its state rapidly and with great accuracy. With a pulse repetition frequency (PRF) of 3 GHz, the power supply would have to switch on and off more than 3 billion times per second..."], "jumps": ["PRF"]}, {"id": "P1110", "text": ["A transmitted RF pulse with a steep trailing edge is essential for the detection of objects at short ranges. If the magnetron output voltage drops gradually from its maximum value to zero, it reduces power and effectively increases the PW..."], "jumps": []}, {"id": "P1100", "text": ["If a lower voltage than maximum is applied to a magnetron, the magnetron will produce a noise low voltage output instead of oscillations. If a modulator pulse builds up and decays slowly, noise is produced at both the beginning and end of the pulse..."], "jumps": []}, {"id": "P1090", "text": ["For efficient RADAR operation, a magnetron requires a modulator pulse that has a flat top and steep leading and trailing edges. An effective modulator pulse must meet the following requirements:::", "It must go from 0 volts to maximum voltage almost instantaneously.", "It must stay at this maximum voltage level throughout the pulse width (PW).", "At the end of the pulse, it must drop instantaneously from maximum voltage to 0 volts......"], "jumps": ["PW"]}, {"id": "P1080", "text": ["A Pulse RADAR requires its high voltage power source to switch on and off to accommodate the need for the transmitter tube output to pulse."], "jumps": []}, {"id": "P1070", "text": ["All transmitter tubes require a source of high voltage, whether they are operated in CW or pulsed mode. In CW RADAR, a high-voltage DC power supply is directly connected to the tube. Because the power supply is always on, the tube will constantly generate the RF signal..."], "jumps": []}, {"id": "P1060", "text": ["Modulators are an integral component of any pulse RADAR system. Modulators ensure that the transmitter operate with the correct pulse repetition frequency and pulse width (PW). (PW)."], "jumps": ["PW"]}, {"id": "P1050", "text": ["In CW RADAR, the transmitter sends out a continuous RF signal. Doppler effect is used to determine if an object is at rest or moving. Moving objects will produce a returned frequency that is different than the transmitted frequency. r New (Hebrew);Courier New (Arabic);Courier New Baltic;In CW Radar, the transmitter sends out a continuous RF signal. Doppler effect is used to determine if an object is at rest or moving. Moving objects will produce a returned frequency that is different than the transmitted frequency."], "jumps": []}, {"id": "P1040", "text": ["The round trip time for these RF pulses to travel out and return is used to determine the range of the object."], "jumps": []}, {"id": "P1030", "text": ["The basic principle of Pulsed RADAR is that the transmitter sends out radio waves in a series of short, powerful pulses with periods of rest between the pulses. During the period in which the transmitter is at rest, echo signals may be received..."], "jumps": []}, {"id": "P1020", "text": ["RADAR systems employ two basic types of energy transmission: Pulse and Continuous Wave (CW).6"], "jumps": ["P1001"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": ["1. RADAR Transmitters Transmitters ltic;Transmitters tic;Transmitters tic;Transmitters ransmitters Transmitters ;Transmitters ic;Transmitters c;Transmitters ic;Transmitters ic;Transmitters ic;Transmitters nsmitters ;Transmitters c;Transmitters c;Transmitters ;Transmitters c;Transmitters c;Transmitters ;Transmitters c;Transmitters"], "jumps": ["P450"]}, {"id": "P450", "text": ["Let's begin the lesson on RADAR Transmitters and Receivers. STEM.........."], "jumps": []}, {"id": "P440", "text": ["The RF echo signals reflected by distant objects are similar to the transmitted signal, but they are considerably diminished in amplitude. A voltage amplification of 10 is required to produce a video pulse of sufficient amplitude to intensify the beam of a CRT.."], "jumps": []}, {"id": "P430", "text": ["RADAR receivers require good stability and extreme sensitivity to detect amplify and identify the object from the weak returned RF echo.", "High-power magnetron oscillators have a tendency to drift in frequency because of temperature variations and changes in the modulating pulse. Receiver, Automatic Frequency Control (AFC) circuits are designed to compensate for frequency drift..."], "jumps": []}, {"id": "P410", "text": ["Search and weapons control RADARs require high-powered oscillators or amplifiers to produce the transmitted radio frequency (RF) signal to detect objects at extended ranges."], "jumps": []}, {"id": "P400", "text": ["This lesson will help you understand the function and operational characteristics of typical RADAR transmitters and receivers. ics of typical Radar transmitters and receivers. rew);Courier New (Arabic);Courier New Baltic;This lesson will help you understand the function and operational characteristics of typical Radar transmitters and receivers. ic);Courier New Baltic;This lesson will help you understand the function and operational characteristics of typical Radar trans let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
