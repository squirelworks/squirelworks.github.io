jumps": ["P400", "P420"]}, {"id": "P420", "text": [], "jumps": ["P400", "P430"]}, {"id": "P430", "text": ["In this lesson, the phase angle between voltage and current across an inductor is measured and the following relationship is proven."], "jumps": ["P400", "P440"]}, {"id": "P440", "text": ["Let's begin the lesson on RL SERIES CIRCUIT OPERATION....................."], "jumps": ["P430"]}, {"id": "P900", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": ["P440"]}, {"id": "P1015", "text": ["This experiment demonstrates the operation of RL series circuits. You will apply input voltages at different frequencies and measure circuit values with an oscilloscope.and multimeter."], "jumps": ["P1016"]}, {"id": "P1016", "text": ["Pick up the PC130-13 card. This card demonstrates resistive inductive circuits. You will use the R3, L1, and L2 series circuit in this experiment."], "jumps": ["P1015", "P1020"]}, {"id": "P1020", "text": ["1. Set the test console controls to their initial control settings."], "jumps": ["P1016"]}, {"id": "P1030", "text": ["2. Carefully plug PC130-13 into the test console PC position..2. Carefully plug PC130-13 into the test console PC1 position.", "EXPERIMENT CARD PLACEMENT - PC130-13 shown in PC1 position."], "jumps": ["P1020", "P1030"]}, {"id": "P1040", "text": ["3. Set PC130-13 switches S1, S2, S4, S5, and S6 DOWN. Set S3 UP. 4. Adjust PC130-13 R3 to 500 ohms using your multimeter. er."], "jumps": ["P1030"]}, {"id": "P1045", "text": ["MEASUREMENT SETUP - Set switches S1, S2, S4, S5 and S6 DOWN (open). Set switch S3 UP (open)."], "jumps": ["P1040"]}, {"id": "P1050", "text": ["5. Connect the function generator to the test console's Input BNC.", "BNC CONNECTION - Connect the function generator's Main Output BNC to the test console's Input BNC.", "Select your CAL output and the oscilloscope settings will be displayed here.", "Select a function generator to see its connection........ up will be displayed here. e displayed here.", "Select a function generator to see its connection..for the display will be shown. will be shown..........."], "jumps": ["P1060", "P1040", "P1050"]}, {"id": "P1060", "text": ["6. Set PC130-13 switch S2 UP (closed) and S3 DOWN (closed). This establishes a series circuit consisting of R3 and L1. S3 is DOWN (closed) and removes L2 from the circuit."], "jumps": ["P1050", "P1070"]}, {"id": "P1065", "text": ["SWITCH POSITIONS - S1, S4, S5, S6 - DOWN (open) S2 - UP (closed) S3 - DOWN (closed)"], "jumps": ["P1060"]}, {"id": "P1070", "text": ["7. Adjust the function generator frequency for a 20 to 22 kHz sine wave output. Adjust the output level for approximately 14 Vpp using the oscilloscope. TP1 using a multimeter.", "Select your CAL output and the oscilloscope settings will be displayed here.", "Select a function generator to see its settings........ up will be displayed here. e displayed here.", "Select a function generator to see its settings.gs.for the display will be shown. will be shown..........."], "jumps": ["P1060", "P1077", "P1070"]}, {"id": "P1077", "text": ["LEAD PLACEMENT - Using the oscilloscope adjust the function generator output amplitude control for 14 Vpp. djust the function generator output amplitude for a 5 VAC reading on the multimeter."], "jumps": ["P1070", "P1075"]}, {"id": "P1080", "text": ["8. Set the oscilloscope controls as follows:..............", "Trigger - CH1, AC, + slopeee", "Time/Div - Mid positionnnn", "Position - Mid positionnnn", "Select your CAL output and the oscilloscope settings will be displayed here.", "Select an oscilloscope to see its settings............. up will be displayed here. e displayed here.", "Select an oscilloscope to see its settings.ngs.ngs.for the display will be shown. will be shown..........."], "jumps": ["P1090", "P1070", "P1080"]}, {"id": "P1090", "text": ["9. Place CH1 probe on TP4 and CH2 probe on TP1. Use TP1 as oscilloscope ground.", "OSCILLOSCOPE CONNECTIONS - Set CH1 probe to TP4. Set CH2 probe to TP1."], "jumps": ["P1080", "P1100", "P1090"]}, {"id": "P1100", "text": ["Time/Div 4 or 5 msec Volts/Div CH1 2 V AC Volts/Div CH2 2 V AC (inverted) CH1 TP4 CH2 TP1 Display Mode ADD", "10. Adjust the Time/Div variable control to display one complete cycle. 11. Adjust the trigger level control so that T0 equals 0 volts."], "jumps": ["P1110", "P1090"]}, {"id": "P1105", "text": ["- that PC130-13 switch S2 is UP and S3 is DOWN.", "- that the oscilloscope is set to measure voltage drops, with CH1 on TP4 and CH2 on TP1.", "- that the function generator is set to 20 to 22 kHz.", "OSCILLOSCOPE SETUP - If the waveform can not be obtained check:::"], "jumps": ["P1100"]}, {"id": "P1110", "text": ["The experiment is now set up. Let's observe inductance phase relationship between voltage and current. Remember ELI."], "jumps": ["P1100", "P1120"]}, {"id": "P1120", "text": ["The waveform displayed on your oscilloscope is the voltage across L1. The oscilloscope trigger has been set so T0 equals 0 volts."], "jumps": ["P1100", "P1130"]}, {"id": "P1122", "text": ["Time/Div 4 or 5 msec Volts/Div CH1 2 V AC Volts/Div CH2 2 V AC (inverted) CH1 TP4 CH2 TP1 Display Mode ADD", "The waveform displayed on your oscilloscope is the voltage across L1. The oscilloscope trigger has been set so T0 equals 0 volts."], "jumps": ["P1130", "P1100"]}, {"id": "P1125", "text": ["VOLTAGE ACROSS L1 - CH1 monitors voltage at the top of L1. CH2 monitors voltage at the bottom of L1. Adding CH1 to an inverted CH2, produces a voltage signal that equals the voltage drop of L1."], "jumps": ["P1122"]}, {"id": "P1130", "text": ["Remember, in a series circuit current is the same at all points. Current and voltage are in phase across a resistor...", "On most oscilloscopes current can not be measured directly. Measuring the voltage across a resistor with an oscilloscope can be used to indicate the phase and value of current."], "jumps": ["P1122", "P1140"]}, {"id": "P1135", "text": ["MEASURING CURRENT - Some oscilloscopes have a special current probe. These are expensive and are not normally available to the technician for troubleshooting. It is useful to know how to measure current using the voltage drop across a resistor."], "jumps": ["P1130"]}, {"id": "P1140", "text": ["Time/Div 4 or 5 msec Volts/Div CH1 2 V AC Volts/Div CH2 2 V AC (inverted) CH1 TP5 CH2 TP3 Display Mode ADD", "1. Place CH1 probe on TP5 and CH2 probe on TP3. DO NOT change the triggering level.", "OSCILLOSCOPE CONNECTIONS - Set CH1 probe to TP5. Set CH2 probe to TP3."], "jumps": ["P1150", "P1130", "P1140"]}, {"id": "P1150", "text": ["500 4 mA peakode = ADDCH2 - TP3 Display Mode = ADDDDy Mode = ADDD = ADD", "This waveform is the voltage across the resistor R3, it shows the peak value of voltage. It can also show the peak value of current."], "jumps": ["P1140", "P1160"]}, {"id": "P1160", "text": ["This waveform indicates the phase of voltage across R3. Because voltage and current are in phase across a resistor it also indicates the phase of current. in phase across a resistor."], "jumps": ["P1140", "P1170"]}, {"id": "P1170", "text": ["Comparing the EL1 waveform (CH1 on TP4 and CH2 on TP1) to the IL1 (ER3) waveform (CH1 on TP5 and CH2 on TP3) shows the phase difference."], "jumps": ["P1140", "P1180"]}, {"id": "P1180", "text": ["When voltage is maximum, current is minimum and when voltage is minimum, current is maximum. Voltage leads current by 90 degrees."], "jumps": ["P1140", "P1190"]}, {"id": "P1190", "text": ["2. Disconnect oscilloscope probes. Now let's calculate and measure circuit values to determine how frequency effects voltage drops in a RL series circuit and that:"], "jumps": ["P1140", "P1200"]}, {"id": "P1200", "text": ["For an applied voltage of 5 VAC at 21 kHz, calculate this circuit's  voltage drops. Round off responses to the nearest tenth.", "For an applied voltage of 5 VAC at 21 kHz, calculate this circuit's voltage drops. Round off responses to the nearest tenth."], "jumps": []}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1205", "text": ["A. Solve for XL1: XL1 = 2p", "L = 6.28 x 21 kHz x 15 mH B. Solve for Rt: Rt = R3 C. Solve for Zt: Zt = Rt2 + XL12 = 5002 + XL12 E D. Solve for It: It = Zt E. Solve for ER3 & EL1: ER3 = It x R3 = It x 500 EL1 = It x XL1"], "jumps": ["P1200"]}, {"id": "P1210", "text": ["1. Connect the CH1 oscilloscope probe to TP5, negative lead to TP1. 2. Verify the output of the function generator is a 20 to 22 kHz sine wave at 14 Vpp."], "jumps": ["P1200", "P1220"]}, {"id": "P1215", "text": ["MEASUREMENT SETUP - Place the oscilloscope probe at TP5, negative lead at TP1. Adjust the function generator output to a 20 to 22 kHz sine wave at 5 VAC, which is 14 Vpp."], "jumps": ["P1210"]}, {"id": "P1220", "text": ["3. Set up the oscilloscope to measure voltage drops and measure the voltage drop of R3 with the CH1 oscilloscope probe at TP5 and the CH2 probe at TP3. Convert the peak-to- peak voltage to RMS and enter it below.w"], "jumps": ["P1210", "P1222"]}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1222", "text": ["- that the multimeter is placed across R3..oltage drops, with CH1 on TP4 and CH2 on TP1.", "- that Ea = 5 VAC at 21 kHz. nd S3 is DOWN.", "- that R3 is set to 500 W. r is set to 21 kHz sine wave.", "- that on PC130-13 S2 is UP and S3 is DOWN.oltage drops, with CH1 on TP4 and CH2 on TP1.", "Your voltage measurement is not acceptable. Check:........"], "jumps": []}, {"id": "P1225", "text": ["1. Set both CH1 and CH2 Volts/Div controls to the same setting.", "2. Set both channels to measure AC voltage. the same setting.", "3. Invert CH2.annels to measure AC voltage. the same setting.", "4. Select the ADD mode. measure AC voltage. the same setting.", "5. Adjust the Volts/Div and Time/Div controls as needed for an accurate reading.....", "MEASUREMENT SETUP - Below are the steps to set up the oscilloscope to measure AC voltage drops: Place the negative test lead to TP3.", "6. Convert the measured peak-to-peak AC voltage to RMS for calculations using this formula: AC RMS = Vpp / 2 x 0.707."], "jumps": ["P1220"]}, {"id": "P1227", "text": ["Your answer is still incorrect. The voltage drop across R3 should have measured approximately 1.2 V."], "jumps": ["P1230"]}, {"id": "P1230", "text": ["4. Set up the oscilloscope to measure voltage drops and measure the voltage drop of L1 with the CH1 oscilloscope probe at TP4 and the CH2 probe at TP1. Convert the peak-to- peak voltage to RMS and enter it below::::"], "jumps": ["P1220", "P1232"]}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1232", "text": ["- that the multimeter is placed across L1..oltage drops, with CH1 on TP4 and CH2 on TP1.", "- that Ea = 5 VAC at 21 kHz. nd S3 is DOWN.", "- that R3 is set to 500 W. r is set to 21 kHz sine wave.", "- that on PC130-13 S2 is UP and S3 is DOWN.oltage drops, with CH1 on TP4 and CH2 on TP1.", "Your voltage measurement is not acceptable. Check:........."], "jumps": []}, {"id": "P1235", "text": ["5. Adjust the Volts/Div and Time/Div controls as needed for an accurate reading.....", "6. Convert the measured peak-to-peak AC voltage to RMS for calculations using this formula: AC RMS = Vpp / 2 x 0.707.", "1. Set both CH1 and CH2 Volts/Div controls to the same setting.", "2. Set both channels to measure AC voltage. the same setting.", "3. Invert CH2.annels to measure AC voltage. the same setting.", "MEASUREMENT SETUP - Below are the steps to set up the oscilloscope to measure AC voltage drops: Place the negative test lead to TP1.", "4. Select the ADD mode. measure AC voltage. the same setting."], "jumps": ["P1230"]}, {"id": "P1237", "text": ["Your answer is still incorrect. The voltage drop across L1 should have measured approximately 4.8 V"], "jumps": ["PutVar"]}, {"id": "P1240", "text": ["Calculated Measured ER3 = 1.2 V EL1 = 4.8 V", "Notice that your calculated voltage drops match your measured voltage drops within"], "jumps": ["P1230", "P1250"]}, {"id": "P1250", "text": ["Also notice that ER3 + EL1 does not equal 5 volts. = 5 V You can not add voltage drops in a RL series circuit."], "jumps": ["P1240", "P1260"]}, {"id": "P1260", "text": ["Using this formula, the voltage drops equal 5 volts RMS (slightly more than 14 volts peak-to-peak)."], "jumps": ["P1250", "P1270"]}, {"id": "P1270", "text": ["Let's increase the frequency then calculate and measure circuit values. Remember, XL increases when frequency increases. 1. Set the function generator to 30 kHz. Ensure that the applied voltage is still 5 RMS.", "LEAD PLACEMENT - Set the oscilloscope to view only CH1 and connect the probe to TP5. Adjust the function generator to produce a 30 kHz, 14 Vpp sine wave."], "jumps": ["P1260", "P1280", "P1270"]}, {"id": "P1280", "text": ["Calculate voltage drops for an applied voltage of 5 VAC at 30 kHz., 789)....................."], "jumps": ["P1270"]}, {"id": "P1281", "text": [], "jumps": []}, {"id": "P1285", "text": ["A. Solve for XL1: XL1 = 2p", "L = 6.28 x 30 kHz x 15 mH B. Solve for Rt: Rt = R3 C. Solve for Zt: Zt = Rt2 + XL12 = 5002 + XL12 E D. Solve for It: It = Zt E. Solve for ER3 & EL1: ER3 = It x R3 = It x 500 EL1 = It x XL1"], "jumps": ["P1280"]}, {"id": "P1290", "text": ["2. Set up the oscilloscope to measure voltage drops and measure the voltage drop of R3 with the CH1 oscilloscope probe at TP5 and the CH2 probe at TP3. Convert the peak-to- peak voltage to RMS and enter it below:"], "jumps": ["P1280", "P1292"]}, {"id": "P1291", "text": [], "jumps": []}, {"id": "P1292", "text": ["- that the multimeter is placed across R3..oltage drops, with CH1 on TP4 and CH2 on TP1.", "- that Ea = 5 VAC at 30 kHz. nd S3 is DOWN.", "- that R3 is set to 500 W. r is set to 21 kHz sine wave.", "- that on PC130-13 S2 is UP and S3 is DOWN.oltage drops, with CH1 on TP4 and CH2 on TP1.", "Your voltage measurement is not acceptable. Check:........."], "jumps": []}, {"id": "P1295", "text": ["5. Adjust the Volts/Div and Time/Div controls as needed for an accurate reading.....", " ure AC voltage. the same setting."], "jumps": ["P1300"]}, {"id": "P1307", "text": ["Your answer is still incorrect. The voltage drop of L1 should have measured approximately 4.9 V."], "jumps": ["PutVar"]}, {"id": "P1310", "text": ["Calculated Measured ER3 = 0.9 V EL1 = 4.9 V", "Notice that your calculated voltage drops match your measured voltage drops within"], "jumps": ["P1300", "P1320"]}, {"id": "P1320", "text": ["21 kHz 30 kHz ER3 = EL1 = 4.9 V4.9 V V V", "Notice at a higher frequency XL increased causing the circuit to become more inductive. More of the voltage is now dropped across the inductor."], "jumps": ["P1310", "P1330"]}, {"id": "P1330", "text": ["Let's decrease the frequency then calculate and measure circuit values. Remember, XL will decrease when frequency decreases. 1. Set the function generator to 10 kHz. Ensure that the applied voltage is still 5 RMS (14 Vpp).", "LEAD PLACEMENT - Set the oscilloscope to view only CH1 and connect the probe to TP5. Adjust the function generator to produce a 10 kHz, 14 Vpp sine wave."], "jumps": ["P1320", "P1340", "P1330", "Pb", "PB"]}, {"id": "P1340", "text": ["Calculate voltage drops for an applied voltage of 5 VAC at 10 kHz., 789)....................."], "jumps": ["P1330"]}, {"id": "P1341", "text": [], "jumps": []}, {"id": "P1345", "text": ["A. Solve for XL1: XL1 = 2p", "L = 6.28 x 10 kHz x 15 mH B. Solve for Rt: Rt = R3 = 500 C. Solve for Zt: Zt = Rt2 + XL12 = 5002 + XL12 E D. Solve for It: It = Zt E. Solve for ER3 & EL1: ER3 = It x R3 = It x 500 EL1 = It x XL1 = It x XL11 XL11"], "jumps": ["P1340"]}, {"id": "P1350", "text": ["2. Set up the oscilloscope to measure voltage drops and measure the voltage rop of R3 with the CH1 oscilloscope probe at TP5 and the CH2 probe at TP3. Convert the peak-to- peak voltage to RMS and enter it below:::"], "jumps": ["P1352", "P1340"]}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1352", "text": ["- that the multimeter is placed across R3..oltage drops, with CH1 on TP4 and CH let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
