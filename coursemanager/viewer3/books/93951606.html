"text": ["Knowing how a good circuit operates will help you identify a circuit that is not operating properly.", "The functional test or operational test is used to help you check the circuit operation.  If the functional test indicates improper      results then the troubleshooting process begins.", "Normal Circuit Operation Required power is +5 V All switches closed DS1 is ON Any switch open DS1 is OFFFFFF", "Knowing how a good circuit operates will help you identify a circuit that is not operating properly. (GRAPHICS TEXT) Normal Circuit Operation Required power is +5 V All switches closed DS1 is ON Any switch open DS1 is OFF", "1. Analyze the circuit 2. Check the setup 3. Calculate & measure values 4. Check the results", "The functional test or operational test is used to help you check the circuit operation. If the functional test indicates improper results then the troubleshooting process begins. GRAPHICS TEXT) 1. Analyze the circuit 2. Check the setup 3. Calculate & measure values 4. Check the results"], "jumps": ["P410", "P300", "P420", "P400"]}, {"id": "P420", "text": ["The functional test will also help you recognize a symptom.  By recognizing and understanding the symptom you can effectively troubleshoot the fault.", "The functional test will also help you recognize a symptom. By recognizing and understanding the symptom you can effectively troubleshoot the fault."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["Let's begin the lesson on WIRE TROUBLESHOOTING............................"], "jumps": ["P410"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1040", "text": ["In this exercise we will use a multimeter to make voltage and resistance checks to isolate an open in a wiring circuit."], "jumps": ["P1001"]}, {"id": "P1080", "text": ["Let's discuss normal operation of the wiring and connector assembly used in this exercise."], "jumps": ["P1040"]}, {"id": "P1081", "text": ["The three PC positions are connected making a series circuit. The wiring is routed through four switches, any one of which can turn DS1 OFF.", "Let's discuss normal operation of the wiring and connector assembly used in this exercise."], "jumps": ["P1040", "P1100"]}, {"id": "P1091", "text": ["Let's examine the circuit.  The +5 VDC enters PC130-W1 and travels through a resistor, a light emitting diode, a switch (SPST) to the connector JA.  A coaxial cable then connects PC130-W1 to PC130-W2.", "The three trainers are connected making a series circuit. The wiring is routed and looped back through all three trainers.", "Let's examine the circuit. The +5 VDC enters PC130-W1 and travels through a resistor, a light emitting diode, a switch (SPST) to the connector JA. A coaxial cable then connects PC130-W1 to PC130-W2."], "jumps": ["P1100", "P1110"]}, {"id": "P1110", "text": ["Now that it has entered PC130-W2, it goes through the card and out a wire connected to PC130-W3.  The path then goes through S1 (PC130-W3) and all the way back to PC130-W1 through the wires, connectors and PCB solder runs.", "Now that it has entered PC130-W2, it goes through the card and out a wire connected to PC130-W3. The path then goes through S1 (PC130-W3) and all the way back to PC130-W1 through the wires, connectors and PCB solder runs."], "jumps": ["P1120", "PC130"]}, {"id": "P1120", "text": ["The path turns around goes through PC130-W1 JB1, through PC130-W2 JD2 and JE3 reenters PC130-W3 JF3.  Within \nPC130-W3 it goes through JG3 to S2.", "The path turns around goes through PC130-W1 JB1, through PC130-W2 JD2 and JE3 reenters PC130-W3 JF3. Within PC130-W3 it goes through JG3 to S2."], "jumps": ["P1130"]}, {"id": "P1130", "text": ["The same circuit path is repeated to the top of S3 (PC130-W3). After going through S3, current is routed all the way back to PC130-W1 and terminates at PC130-W1 JB5 (GND)."], "jumps": ["P1140", "PC130"]}, {"id": "P1140", "text": ["You can see that this wire assembly is a series circuit.  Let's start the experiment.", "You can see that this wire assembly is a series circuit. Let's start the experiment."], "jumps": []}, {"id": "P1145", "text": ["1. Set up the test consoles for multiple interface. Ensure that power to each console is NOT ON. ON."], "jumps": []}, {"id": "P1146", "text": ["2. Set Test Console 1 Power ON...N..each test console ON.... start the experiment."], "jumps": []}, {"id": "P1147", "text": ["2. Set Test Console 2 Power ON...N..each test console ON.... start the experiment."], "jumps": []}, {"id": "P1148", "text": ["2. Set Test Console 3 Power ON...N..each test console ON.... start the experiment."], "jumps": []}, {"id": "P1150", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": []}, {"id": "P1155", "text": ["1. Press enter to initialize the test consoles.initialize console........."], "jumps": []}, {"id": "P1160", "text": ["2.  Carefully plug the circuit cards into these Test Console \n     PC positions:", "PC130-W1 on the PC1 connectors PC130-W2 on the PC2 connectors PC130-W3 on the PC3 connectors PC130-W3 on the PC3 connectors PC130-W3 on the PC3 connectors", "2. Carefully plug the circuit cards into these Test Console PC positions: he PC1 connectors PC130-W2 on the PC2 connectors PC130-W3 on the PC3 connectors"], "jumps": ["P1165"]}, {"id": "P1161", "text": ["2. Carefully plug the circuit cards into the three Test Consoles.", "EXPERIMENT CARD PLACEMENT - PC130-W1 shown in PC1 position. PC130-W2 shown in PC2 position. PC130-W3 shown in PC3 position."], "jumps": []}, {"id": "P1168", "text": ["3.  Connect all the plugs into the jacks of the circuit cards,                     including the coaxial cable between PC130-W1 and\n      PC130-W2.  Ensure that S1 on PC130-W1 is to the left and\n      S1 through S3 on PC130-W3 are in the down position.", "3. Connect all the plugs into the jacks of the circuit cards, including the coaxial cable between PC130-W1 and PC130-W2. Ensure that S1 on PC130-W1 is to the left and S1 through S3 on PC130-W3 are in the down position."], "jumps": []}, {"id": "P1170", "text": ["4.  Set the Voltmeter Switch to Positive. \n5.  Set the Positive Supply Voltage to 5. \n      The Test Console's Voltage Meter should indicate 5 volts.         6.   Set PC1 DC Power Switch to ON.", "4. Set the Voltmeter Switch to Positive. 5. Set the Positive Supply Voltage to 5. The Test Console's Voltage Meter should indicate 5 volts. 6. Set PC1 DC Power Switch to ON."], "jumps": ["P1168"]}, {"id": "P1171", "text": ["For normal operation place the PC card switches in the following positions:      PC130-W1                     PC130-W3 \n                         S1 - Right (closed)      S1 - Up (closed) \n                                                                  S2 - Up (closed)\n                                                                  S3 - Up (closed)", "4. Press enter to set voltage to 5 volts on TecDec 1. 5. Press enter to apply DC Power on TecDec 1. 6. Set PC1 DC Power Switch to ON.", "For normal operation place the PC card switches in the following positions: PC130-W1 PC130-W3 S1 - Right (closed) S1 - Up (closed) S2 - Up (closed) S3 - Up (closed)"], "jumps": ["P1168", "P1190"]}, {"id": "P1190", "text": ["The function check is performed by opening and closing the switches in the wiring assembly circuit.  The LED, DS1, should illuminate on PC130-W1 when all the switches are closed. Placing any one of the switches open, should prevent DS1 from illuminating.", "The function check is performed by opening and closing the switches in the wiring assembly circuit. The LED, DS1, should illuminate on PC130-W1 when all the switches are closed. Placing any one of the switches open, should prevent DS1 from illuminating."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["Place S1 (PC130-W1) to the left (open).  The light, DS1, should be turned OFF.", "Place S1 (PC130-W1) to the left (open). The light, DS1, should be turned OFF."], "jumps": ["P1210", "P1180", "PC130"]}, {"id": "P1210", "text": ["Place S1 (PC130-W1) to the right (closed).  The light, DS1, should illuminate.", "Place S1 (PC130-W1) to the right (closed). The light, DS1, should illuminate."], "jumps": ["P1220", "P1180", "PC130"]}, {"id": "P1220", "text": ["Place S1 on PC130-W3 in the down (open) position. \nDS1 (PC130-W1) should turn OFF.", "Place S1 on PC130-W3 in the down (open) position. DS1 (PC130-W1) should turn OFF."], "jumps": ["P1221", "P1180", "PC130"]}, {"id": "P1221", "text": ["Place S1 on PC130-W3 in the up (closed) position and DS1 (PC130-W1) should turn ON."], "jumps": ["P1230", "P1180", "PC130"]}, {"id": "P1230", "text": ["Place S2 on PC130-W3 in the down position.  DS1 (PC130-W1) should turn OFF.", "Place S2 on PC130-W3 in the down position. DS1 (PC130-W1) should turn OFF."], "jumps": ["P1231", "P1180", "PC130"]}, {"id": "P1231", "text": ["Place S2 on PC130-W3 in the up position and DS1 should be ON."], "jumps": ["P1240", "P1180"]}, {"id": "P1240", "text": ["Place S3 on PC130-W3 in the down position.  DS1 (PC130-W1) should turn OFF.", "Place S3 on PC130-W3 in the down position. DS1 (PC130-W1) should turn OFF."], "jumps": ["P1241", "P1180", "PC130"]}, {"id": "P1241", "text": ["Place S3 on PC130-W3 in the up position and DS1 (PC130-W1) should turn ON."], "jumps": ["P1250", "P1180", "PC130"]}, {"id": "P1250", "text": ["Remember, that during your function check when ANY of the switches were open DS1 was OFF.  DS1 only illuminated when ALL the switches were closed.  This indicates normal circuit operation.", "In this wiring and connector assembly, since it is a series circuit, if an open occurs, it is like opening a switch, the lamp DS1 will      not illuminate.  The path to ground has been broken and current will not flow through the resistor or LED.", "Remember, that during your function check when ANY of the switches were open DS1 was OFF. DS1 only illuminated when ALL the switches were closed. This indicates normal circuit operation.", "In this wiring and connector assembly, since it is a series circuit, if an open occurs, it is like opening a switch, the lamp DS1 will not illuminate. The path to ground has been broken and current will not flow through the resistor or LED."], "jumps": ["P1260", "P1180", "P1280"]}, {"id": "P1280", "text": ["The computer will place a fault in the circuit when you continue. The functional test will help you find the problem.", "The computer will place a fault in the circuit when you continue. The functional test will help you find the problem. tch to ON........................................."], "jumps": ["P1260"]}, {"id": "P1300", "text": ["Check your set-up and perform the functional check.", "1. All cables are connected. 2. Positive DC Voltage is set to 5 VDC. 3. DC power is ON. 4. S1 (PC130-W1) is placed to the right. 5. S1 through S3 (PC130-W3) are placed to the up position.", "Check your set-up and perform the functional check. RAPHICS TEXT) 1. All cables are connected. 2. DC positive supply is set to 5 VDC. 3. PC1 DC power is ON. 4. S1 (PC130-W1) is placed to the right. 5. S1 through S3 (PC130-W3) are placed to the up position."], "jumps": ["P1310", "PC130"]}, {"id": "P1310", "text": ["Is the circuit operating correctly?", "Is the circuit operating correctly?........................"], "jumps": ["P1300", "P1315"]}, {"id": "P1311", "text": [], "jumps": []}, {"id": "P1312", "text": ["Check the following settings:", "1. All cables are connected. 2. DC positive voltage is set to 5 VDC. 3. DC power is ON. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up position.. the up position.", "Check the following settings: All cables are connected. 2. DC positive supply is set to 5 VDC. 3. DC power is on at the PC1 position. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up position."], "jumps": ["PC130"]}, {"id": "P1315", "text": ["Functional Check 1. Place switches to the following positions: S1 (PC130-W1) to the right, S1 (PC130-W3) up, S2 (PC130-W3) up, S3 (PC130-W3) up 2. Ensure that DC Power is ON. 3. DS1 (PC130-W1) should illuminate. 4. Check switch operation: S1 on PC130-W1 to the left should turn DS1 OFF. S1 on PC130-W1 to the right should illuminate DS1. S1, S2, or S3 on PC130-W3 placed down, turn DS1 OFF. S1, S2 and S3 on PC130-W3 are ALL placed up DS1 ON. N.", "SET-UP - Ensure that your equipment is set correctly then perform the functional check."], "jumps": ["PC130"]}, {"id": "P1320", "text": ["Since DS1 is off, completing the functional check is not necessary.  What is the most likely cause?", "Since DS1 is off, completing the functional check is not necessary. What is the most likely cause?"], "jumps": ["P1310"]}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1322", "text": ["Since DS1 (PC130-W1) is off, the circuit path to ground has been interrupted.", "Although the cause most likely is an open, we still need to verify the incoming voltage.  If it is good, we will need to check the resistor and diode.", "Although the cause most likely is an open, we still need to verify the incoming voltage. If it is good, we will need to check the resistor and diode."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["Set your multimeter to measure DC voltage.  Place the red lead to the +5 TP and the black lead to JB5 (PC130-W1).", "Set your multimeter to measure DC voltage. Place the red lead to the +5 TP and the black lead to JB5 (PC130-W1)."], "jumps": ["P1350", "P1330", "PC130"]}, {"id": "P1350", "text": ["What is your indication?", "What is your indication? is typed.........................."], "jumps": ["P1330"]}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1352", "text": ["Make sure everything is set-up properly.", "Now we know that the incoming voltage is present.  We can perform continuity measurements to check components and wires.", "1. All cables are connected. 2. DC positive voltage is set to 5 VDC. 3. DC power is ON. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up position. the up position.", "Make sure everything is set-up properly. All cables are connected. 2. DC positive supply is set to 5 VDC. 3. DC power is on at the PC1 position. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 position are in the up position.", "Now we know that the incoming voltage is present. We can perform continuity measurements to check components and wires."], "jumps": ["P1350", "P"]}, {"id": "P1370", "text": ["1.  Set the PC1 DC switch to OFF.", "1. Set the PC1 DC switch to OFF.trol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P1360"]}, {"id": "P1371", "text": ["2.  On PC-W1 set switch S1 to the left.  This will isolate the input\n     components from the rest of the circuit.", "1. Press enter to remove DC Power on TecDec 1.130A - Set the PC1 DC Switch to ON....", "2. On PC-W1 set switch S1 to the left. This will isolate the input components from the rest of the circuit. s s."], "jumps": ["P1360", "P1430"]}, {"id": "P1430", "text": ["Set your multimeter to measure resistance.  Place one multimeter lead on JA1 and the other on JB5.  This will check continuity through the whole connector wiring assembly.  We should read infinity because we already suspect an open.", "Set your multimeter to measure resistance. Place one multimeter lead on JA1 and the other on JB5. This will check continuity through the whole connector wiring assembly. We should read infinity because we already suspect an open."], "jumps": ["P1435", "P1380"]}, {"id": "P1435", "text": ["Leave one lead on JA1 (PC130-W1) and move the other to JB4 (PC130-W1) and check the resistance."], "jumps": ["P1440", "P1380", "PC130"]}, {"id": "P1440", "text": ["What is your resistance measurement?", "What is your resistance measurement?......................."], "jumps": ["P1380"]}, {"id": "P1441", "text": ["Ensure that you have your meter set to measure resistance and that you have the multimeter test leads on JA1 and JB4 of the PC130-W1 card.", "The high resistance measured between JA1 and JB4 indicate that the open is between JA1 and JB4.", "Ensure that you have your meter set to measure resistance and that you have the multimeter test leads on JA1 and JB4 of the PC130-W1 card....."], "jumps": ["P1455", "P1440"]}, {"id": "P1455", "text": ["Let's move up the circuit and make a continuity check between JA1 and JB3.  Place one meter lead on JA1 and the other on JB3.", "Let's move up the circuit and make a continuity check between JA1 and JB3. Place one meter lead on JA1 and the other on JB3."], "jumps": ["P1460", "P1450"]}, {"id": "P1460", "text": ["What resistance did you measure?", "What resistance did you measure?d.........................."], "jumps": ["P1450"]}, {"id": "P1461", "text": ["Ensure that you have the multimeter leads on JA1 and JB3. Check the multimeter and make sure that it is set to measure resistance.", "You have just sectionalized the circuit from the beginning through S1 (PC130-W3), S2 (PC130-W3) and back to the JB3.  The low resistance measured between JA1 and JB3 indicate that the open is after JB3.", "Now let's localize the problem.  Make a continuity check between JB3 and JB5.  Place one meter lead on JB3 and the other on JB5.", "You have just sectionalized the circuit from the beginning through S1 (PC130-W3), S2 (PC130-W3) and back to the JB3. The low resistance measured between JA1 and JB3 indicate that the open is after JB3.", "Now let's localize the problem. Make a continuity check between JB3 and JB5. Place one meter lead on JB3 and the other on JB5."], "jumps": ["P1475", "P1460", "P1480", "P1470"]}, {"id": "P1480", "text": ["What is your resistance measurement?", "What is your resistance measurement?......................."], "jumps": ["P1470"]}, {"id": "P1481", "text": ["Ensure that you have the multimeter leads on JB3 and JB4. Check the multimeter and make sure that it is set to measure resistance.", "The open is somewhere between JB3 and JB5.  Let's continue making continuity checks.  Place the meter leads between JB4 and JB5.", "The open is somewhere between JB3 and JB5. Let's continue making continuity checks. Place the meter leads between JB4 and JB5."], "jumps": ["P1486", "P1480"]}, {"id": "P1486", "text": ["What is your resistance measurement?", "What is your resistance measurement?......................."], "jumps": ["P1485"]}, {"id": "P1487", "text": ["Ensure that you have the multimeter leads on JB4 and JB5. Check the multimeter and make sure that it is set to measure resistance.", "Continuity or low resistance between JB4 and JB5 is a normal reading, this section of the circuit is good.", "Now let's isolate the problem.  We know by our resistance checks that the circuit is good before JB3 and after JB4.  Let's check the  resistance between JB3 and JB4 to see if the open is here.", "Now let's isolate the problem. We know by our resistance checks that the circuit is good before JB3 and after JB4. Let's check the resistance between JB3 and JB4 to see if the open is here."], "jumps": ["P1495", "P1486", "P1500", "P1490"]}, {"id": "P1500", "text": ["What is your resistance measurement?", "What is your resistance measurement?......................."], "jumps": ["P1490"]}, {"id": "P1501", "text": [], "jumps": []}, {"id": "P1502", "text": ["Continuity or low resistance indicates a short or that the circuit is operating correctly between these two points.", "Remove the multimeter leads from the circuit.  Now, that we have isolated the problem, let's jumper JB3 and JB4 positions and perform the functional check.  If this is the only open, the circuit should work properly.", "Remove the multimeter leads from the circuit. Now, that we have isolated the problem, let's jumper JB3 and JB4 positions and perform the functional check. If this is the only open, the circuit should work properly."], "jumps": ["P1500"]}, {"id": "P1520", "text": ["3.  Place S1 on PC130-W1 to the right (closed). \n4.  Set PC1 DC Power ON.", "3. Place S1 on PC130-W1 to the right (closed). 4. Set PC1 DC Power ON."], "jumps": ["P1510"]}, {"id": "P1521", "text": ["3. Place S1 on PC130-W1 to the right (closed). 4. Press enter to apply DC Power on TecDec 1."], "jumps": ["P1510"]}, {"id": "P1550", "text": ["Perform the functional check.  Does DS1 illuminate?", "Perform the functional check. Does DS1 illuminate?........"], "jumps": []}, {"id": "P1551", "text": [], "jumps": []}, {"id": "P1552", "text": ["Ensure the jumper wire is connected correctly and check the\nset-up.", "Now that you have found the problem, you would repair or replace the bad wire and perform the functional test.", "Place S1 on PC130-W1 to the left (open). Remove the jumper wire from JB3 and JB4 on PC130-W1.  When you continue the computer will repair the fault.", "1. All cables are connected. 2. DC positive voltage is set to 5 VDC. 3. DC power is ON. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up position. the up position.", "Ensure the jumper wire is connected correctly and check the set-up. All cables are connected. 2. DC positive supply is set to 5 VDC. 3. DC power is on at the PC1 position. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up position.", "Place S1 on PC130-W1 to the left (open). Remove the jumper wire from JB3 and JB4 on PC130-W1. When you continue the computer will repair the fault."], "jumps": ["P1570", "P1550", "P1560"]}, {"id": "P1580", "text": ["Perform the functional check.  Does the circuit operate correctly?", "Perform the functional check. Does the circuit operate correctly?"], "jumps": []}, {"id": "P1581", "text": [], "jumps": []}, {"id": "P1582", "text": ["Ensure that you have removed the jumper wire and check the set-up.", "Remember, an Open occurs when no path for current flow exists.  This fault is generally identified by an infinite resistance measurement.", "1. All cables are connected. 2. DC positive voltage is set to 5 VDC. 3. DC power is ON. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up position. the up position.", "Ensure that you have removed the jumper wire and check the set-up. . RAPHICS TEXT) 1. All cables are connected. 2. DC positive supply is set to 5 VDC. 3. DC power is on at the PC1 position. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up position.", "Remember, an Open occurs when no path for current flow exists. This fault is generally identified by an infinite resistance measurement."], "jumps": ["P1580"]}, {"id": "P1600", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": ["P1590"]}, {"id": "P1601", "text": ["1. Press enter to re-initialize the console.ntrol settings................"], "jumps": ["P1590"]}, {"id": "P1610", "text": ["2.  If training session is completed, remove the printed circuit              cards PC130-W1, PC130-W2 and PC130-W3 and store it in its         designated area.\n3.  Shut off the multimeter.", "2. If training session is completed, remove the printed circuit cards PC130-W1, PC130-W2 and PC130-W3 and store it in its designated area. 3. Shut off the multimeter."], "jumps": ["P1620"]}, {"id": "P1620", "text": ["4.  Set the Test Console Power OFF.", "4. Set the Test Console Power OFF. OFF...................."], "jumps": ["P1610"]}, {"id": "P1910", "text": ["This completes the experiment on OPEN WIRE.", "This completes the experiment on OPEN WIRE. 1 TITLE........"], "jumps": ["P1001", "P1620"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2040", "text": ["In this exercise we will use a multimeter to make voltage and resistance checks to isolate a short in a wiring circuit."], "jumps": ["P2001"]}, {"id": "P2050", "text": ["Let's discuss normal operation of the wiring and connector assembly used in this exercise."], "jumps": ["P2060", "P2040"]}, {"id": "P2051", "text": ["The three PC positions are connected making a series circuit. The wiring is routed through four switches, any one of which can turn DS1 OFF.", "Let's discuss normal operation of the wiring and connector assembly used in this exercise."], "jumps": ["P2040"]}, {"id": "P2061", "text": ["The three trainers are connected making a series circuit. The wiring is routed and looped back through all three trainers."], "jumps": []}, {"id": "P2070", "text": ["Let's examine the circuit.  The +5 VDC enters PC130-W1 and travels through a resistor, a light emitting diode, a switch (SPST) to the connector JA.  A coaxial cable then connects PC130-W1 to PC130-W2.", "Let's examine the circuit. The +5 VDC enters PC130-W1 and travels through a resistor, a light emitting diode, a switch (SPST) to the connector JA. A coaxial cable then connects PC130-W1 to PC130-W2."], "jumps": ["P2080"]}, {"id": "P2080", "text": ["Now that it has entered PC130-W2, it goes through the card and out a wire connected to PC130-W3.  The path then goes through S1 (PC130-W3) and all the way back to PC130-W1 through the wires, connectors and PCB solder runs.", "Now that it has entered PC130-W2, it goes through the card and out a wire connected to PC130-W3. The path then goes through S1 (PC130-W3) and all the way back to PC130-W1 through the wires, connectors and PCB solder runs."], "jumps": ["P2090", "PC130"]}, {"id": "P2090", "text": ["The path turns around goes through PC130-W1 JB1, through PC130-W2 JD2 and JE3 reenters PC130-W3 JF3.  Within \nPC130-W3 it goes through JG3 to S2.", "The path turns around goes through PC130-W1 JB1, through PC130-W2 JD2 and JE3 reenters PC130-W3 JF3. Within PC130-W3 it goes through JG3 to S2."], "jumps": ["P2100"]}, {"id": "P2100", "text": ["The same circuit path is repeated to the top of S3 (PC130-W3). After going through S3, current is routed all the way back to PC130-W1 and terminates at PC130-W1 JB5 (GND)."], "jumps": ["P2110", "PC130"]}, {"id": "P2110", "text": ["You can see that this wire assembly is a series circuit.  Let's start the experiment.", "You can see that this wire assembly is a series circuit. Let's start the experiment."], "jumps": []}, {"id": "P2115", "text": ["1. Set up the test consoles for multiple interface. Ensure that power to each console is NOT ON. ON."], "jumps": []}, {"id": "P2116", "text": ["2. Set Test Console 1 Power ON...N..each test console ON.... start the experiment."], "jumps": []}, {"id": "P2117", "text": ["2. Set Test Console 2 Power ON...N..each test console ON.... start the experiment."], "jumps": []}, {"id": "P2118", "text": ["2. Set Test Console 3 Power ON...N..each test console ON.... start the experiment."], "jumps": []}, {"id": "P2120", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": []}, {"id": "P2125", "text": ["1. Press enter to initialize the test consoles.initialize console........."], "jumps": []}, {"id": "P2130", "text": ["2.  Carefully plug the circuit cards into these Test Console PC              positions:", "PC130-W1 on the PC1 connectors PC130-W2 on the PC2 connectors PC130-W3 on the PC3 connectors PC130-W3 on the PC3 connectors PC130-W3 on the PC3 connectors", "2. Carefully plug the circuit cards into these Test Console PC positions: 130-W1 on the PC1 connectors PC130-W2 on the PC2 connectors PC130-W3 on the PC3 connectorsss"], "jumps": []}, {"id": "P2131", "text": ["2. Carefully plug the circuit cards into the three Test Consoles."], "jumps": []}, {"id": "P2138", "text": ["3.  Connect all the plugs into the jacks of th e path then goes through S1 (PC130-W3) and all the way back to PC130-W1 through the wires, connectors and Printed Circuit Board (PCB) solder runs.", "Now that it has entered PC130-W2, it goes through the card and out a wire connected to PC130-W3. The path then goes through S1 (PC130-W3) and all the way back to PC130-W1 through the wires, connectors and Printed Circuit Board (PCB) solder runs."], "jumps": ["PC130", "PCB"]}, {"id": "P3090", "text": ["The path turns around goes through PC130-W1 JB1, through PC130-W2 JD2 and JE3 reenters PC130-W3 JF3.  Within \nPC130-W3 it goes through JG3 to S2.", "The path turns around goes through PC130-W1 JB1, through PC130-W2 JD2 and JE3 reenters PC130-W3 JF3. Within PC130-W3 it goes through JG3 to S2."], "jumps": []}, {"id": "P3100", "text": ["The same circuit path is repeated to the top of S3 (PC130-W3). After going through S3, current is routed all the way back to PC130-W1 and terminates at PC130-W1 JB5 (GND)."], "jumps": ["PC130"]}, {"id": "P3110", "text": ["You can see that this wire assembly is a series circuit.  Let's start the experiment.", "You can see that this wire assembly is a series circuit. Let's start the experiment."], "jumps": []}, {"id": "P3115", "text": ["1. Set up the test consoles for multiple interface. Ensure that power to each console is NOT ON. ON."], "jumps": []}, {"id": "P3116", "text": ["2. Set Test Console 1 Power ON...N..each test console ON.... start the experiment."], "jumps": []}, {"id": "P3117", "text": ["2. Set Test Console 2 Power ON...N..each test console ON.... start the experiment."], "jumps": []}, {"id": "P3118", "text": ["2. Set Test Console 3 Power ON...N..each test console ON.... start the experiment."], "jumps": []}, {"id": "P3120", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": []}, {"id": "P3125", "text": ["1. Press enter to initialize the test consoles.initialize console........."], "jumps": []}, {"id": "P3130", "text": ["2.  Carefully plug the circuit cards into these Test Console PC              positions:", "PC130-W1 on the PC1 connectors PC130-W2 on the PC2 connectors PC130-W3 on the PC3 connectors PC130-W3 on the PC3 connectors PC130-W3 on the PC3 connectors", "2. Carefully plug the circuit cards into these Test Console PC positions: PC130-W1 on the PC1 connectors PC130-W2 on the PC2 connectors PC130-W3 on the PC3 connectors"], "jumps": []}, {"id": "P3131", "text": ["2. Carefully plug the circuit cards into the three Test Consoles."], "jumps": []}, {"id": "P3138", "text": ["3.  Connect all the plugs into the jacks of the circuit cards,                     including the coaxial cable between PC130-W1 and\n      PC130- W2.  Ensure that S1 on PC130-W1 is to the left and\n      S1 through S3 on PC130-W3 are in the up position.", "4.  Set your multimeter to measure resistance and place the leads\n     between JA1 and JB5.  You should measure continuity or a\n     low resistance of approximately 2 W.  This is the normal\n     resistance reading for the connector assembly.", "3. Connect all the plugs into the jacks of the circuit cards, including the coaxial cable between PC130-W1 and PC130- W2. Ensure that S1 on PC130-W1 is to the left and S1 through S3 on PC130-W3 are in the up position.", "4. Set your multimeter to measure resistance and place the leads between JA1 and JB5. You should measure continuity or a low resistance of approximately 2 W. This is the normal resistance reading for the connector assembly.. position."], "jumps": ["P3139", "P3138"]}, {"id": "P3140", "text": ["5.  Set the Voltmeter Switch to Positive. \n6.  Set the Positive Supply Voltage to 5. \n      The Test Console's Voltage Meter should indicate 5 volts.         7.  Set PC1 DC Power Switch to ON.", "5. Set the Voltmeter Switch to Positive. 6. Set the Positive Supply Voltage to 5. The Test Console's Voltage Meter should indicate 5 volts. 7. Set PC1 DC Power Switch to ON."], "jumps": ["P3139"]}, {"id": "P3141", "text": ["For normal operation place the PC card switches in the following positions:      PC130-W1                      PC130-W3\n                         S1 - Right (closed)      S1 - Up (closed)  \n                                                                  S2 - Up (closed)  \n                                                                  S3 - Up (closed)", "5. Press enter to set voltage to 5 volts on TecDec 1. 6. Press enter to apply DC Power on TecDec 1. 6. Set PC1 DC Power Switch to ON.", "For normal operation place the PC card switches in the following positions: PC130-W1 PC130-W3 S1 - Right (closed) S1 - Up (closed) S2 - Up (closed) S3 - Up (closed)"], "jumps": ["P1168", "P3160"]}, {"id": "P3160", "text": ["The function check is performed by opening and closing the switches in the wiring assembly circuit.  The LED, DS1, should illuminate on PC130-W1 when all the switches are closed. Placing any one of the switches open, should prevent DS1 from illuminating.", "The function check is performed by opening and closing the switches in the wiring assembly circuit. The LED, DS1, should illuminate on PC130-W1 when all the switches are closed. Placing any one of the switches open, should prevent DS1 from illuminating."], "jumps": ["P3170", "P3150"]}, {"id": "P3170", "text": ["Place S1 (PC130-W1) to the left (open).  The light, DS1, should be turned OFF.", "Place S1 (PC130-W1) to the left (open). The light, DS1, should be turned OFF."], "jumps": ["P3180", "P3150", "PC130"]}, {"id": "P3180", "text": ["Place S1 (PC130-W1) to the right (closed).  The light, DS1, should illuminate.", "Place S1 (PC130-W1) to the right (closed). The light, DS1, should illuminate."], "jumps": ["P3190", "P3150", "PC130"]}, {"id": "P3190", "text": ["Place S1 on PC130-W3 in the down (open) position.  DS1\n(PC130-W1) should turn OFF.", "Place S1 on PC130-W3 in the down (open) position. DS1 (PC130-W1) should turn OFF."], "jumps": ["P3191", "P3150", "PC130"]}, {"id": "P3191", "text": ["Place S1 on PC130-W3 in the up (closed) position and DS1 (PC130-W1) should turn ON."], "jumps": ["P3200", "P3150", "PC130"]}, {"id": "P3200", "text": ["Place S2 on PC130-W3 in the down position.  DS1 (PC130-W1) should turn OFF.", "Place S2 on PC130-W3 in the down position. DS1 (PC130-W1) should turn OFF."], "jumps": ["P3201", "P3150", "PC130"]}, {"id": "P3201", "text": ["Place S2 on PC130-W3 in the up position and DS1 should be ON."], "jumps": ["P3210", "P3150"]}, {"id": "P3210", "text": ["Place S3 on PC130-W3 in the down position.  DS1 (PC130-W1) should turn OFF.", "Place S3 on PC130-W3 in the down position. DS1 (PC130-W1) should turn OFF."], "jumps": ["P3211", "P3150", "PC130"]}, {"id": "P3211", "text": ["Place S3 on PC130-W3 in the up position and DS1 (PC130-W1) should turn ON."], "jumps": ["P3220", "P3150", "PC130"]}, {"id": "P3220", "text": ["Remember, that during your function check when ANY of the switches were open DS1 was OFF.  DS1 only illuminated when ALL the switches were closed.  This indicates normal circuit operation.", "In this wiring and connector assembly, since it is a series circuit, if there is a changed value, the lamp's intensity will either          increase or decrease.", "Remember, that during your function check when ANY of the switches were open DS1 was OFF. DS1 only illuminated when ALL the switches were closed. This indicates normal circuit operation.", "In this wiring and connector assembly, since it is a series circuit, if there is a changed value, the lamp's intensity will either increase or decrease."], "jumps": ["P3230", "P3150", "P3240"]}, {"id": "P3240", "text": ["If circuit resistance is increased DS1 becomes dim.  If resistance is decreased DS1 becomes brighter.", "If circuit resistance is increased DS1 becomes dim. If resistance is decreased DS1 becomes brighter."], "jumps": ["P3250", "P3230"]}, {"id": "P3250", "text": ["Let's use the functional test to help us detect a changed value."], "jumps": ["P3260", "P3230"]}, {"id": "P3260", "text": ["The computer will place a fault in the circuit when you continue.", "The computer will place a fault in the circuit when you continue.to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P3230"]}, {"id": "P3270", "text": ["Ensure that the following settings have been completed, then perform the functional check.", "1. All cables are connected. 2. Positive DC voltage is set to 5 VDC. 3. DC power is ON. 4. S1 (PC130-W1) is placed to the right. 5. S1 through S3 (PC130-W3) are placed to the up position. the up position.", "Ensure that the following settings have been completed, then perform the functional check. 1. All cables are connected. 2. DC positive supply is set to 5 VDC. 3. PC1 DC power is ON. 4. S1 (PC130-W1) is placed to the right. 5. S1 through S3 (PC130-W3) are placed to the up"], "jumps": ["P3280", "PC130"]}, {"id": "P3280", "text": ["Is the circuit operating correctly?", "DS1 stays on when any of the PC card switches are set to off (open))", "Is the circuit operating correctly?........................"], "jumps": ["P15270"]}, {"id": "P3281", "text": [], "jumps": []}, {"id": "P3282", "text": ["Check your set-up and perform the functional test again.", "After completing the functional test your indications were normal, however, DS1 is dimly lit.  Let's see what could cause this symptom.", "Functional Check 1. Place switches to the following positions: S1 (PC130-W1) to the right, S1 (PC130-W3) up, S2 (PC130-W3) up, S3 (PC130-W3) up 2. DC Power is on. 3. DS1 (PC130-W1) should illuminate. 4. Check switch operation: S1 (PC130-W1) left = DS1 off, then right = on S1 (PC130-W3) down = DS1 off, then up = on S2 (PC130-W3) down = DS1 off, then up = on S3 (PC130-W3) down = DS1 off, then up = onnnnnnnnnnnnnf, then up = onnnnnnn", "Check your set-up and perform the functional test again. RAPHICS TEXT) Functional Check 1. Place switches to the following position. S1 (PC130-W1) to the right, S1 (PC130-W3) up, S2 (PC130-W3) up, S3 (PC130-W3) up 2. Depress the DC Power button on the PC1 position. 3. DS1 (PC130-W1) should illuminate.", "After completing the functional test your indications were normal, however, DS1 is dimly lit. Let's see what could cause this symptom."], "jumps": ["P3300", "P3280"]}, {"id": "P3300", "text": ["An open or a short would give you a clear indication of the fault when making resistance measurements.  Changed values however, will increase or decrease resistance in the circuit.", "The first measurement we should make is to check the input voltage.  This is also the first step used when checking for opens.", "An open or a short would give you a clear indication of the fault when making resistance measurements. Changed values however, will increase or decrease resistance in the circuit.", "The first measurement we should make is to check the input voltage. This is also the first step used when checking for opens."], "jumps": ["P3310", "P3290", "P3311", "P3300"]}, {"id": "P3311", "text": ["Set your multimeter to measure DC voltage.  Place the red lead to the +5 TP and the black lead to JB5 (PC130-W1).", "Set your multimeter to measure DC voltage. Place the red lead to the +5 TP and the black lead to JB5 (PC130-W1)."], "jumps": ["P3320", "P3310", "PC130"]}, {"id": "P3320", "text": ["What is your indication?", "What is your indication? is typed.........................."], "jumps": ["P3310"]}, {"id": "P3321", "text": [], "jumps": []}, {"id": "P3322", "text": ["Make sure everything is set-up properly.", "Now we know that the incoming voltage is present.  We can perform continuity measurements to check components and wires.", "1. All cables are connected. 2. Positive DC voltage is set to 5 VDC. 3. DC power is ON. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up position.............................", "Make sure everything is set-up properly. RAPHICS TEXT) 1. All cables are connected. 2. DC positive supply is set to 5 VDC. 3. DC power is on at the PC1 position. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 position are in the up position.", "Now we know that the incoming voltage is present. We can perform continuity measurements to check components and wires."], "jumps": ["P3320", "P"]}, {"id": "P3340", "text": ["1.  Set the PC1 DC switch to OFF.", "1. Set the PC1 DC switch to OFF.trol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P3330"]}, {"id": "P3341", "text": ["2.  On PC-W1 set switch S1 to the left.  This will isolate the input\n      components from the rest of the circuit.", "1. Press enter to remove DC Power on TecDec 1.130A - Set the PC1 DC Switch to ON....", "2. On PC-W1 set switch S1 to the left. This will isolate the input components from the rest of the circuit.s s."], "jumps": ["P3330", "P3390"]}, {"id": "P3390", "text": ["Set your multimeter to measure resistance.  Place one multimeter lead on JA1 and the other on JB5.  This will check continuity through the whole connector wiring assembly.", "Set your multimeter to measure resistance. Place one multimeter lead on JA1 and the other on JB5. This will check continuity through the whole connector wiring assembly. ready suspect a changed value."], "jumps": ["P3400", "P3380"]}, {"id": "P3400", "text": ["What is the resistance measured between JA1 (PC130-W1) and JB5 (PC130-W1)?", "What is the resistance measured between JA1 (PC130-W1) and JB5 (PC130-W1)????"], "jumps": ["P3380", "PC130"]}, {"id": "P3401", "text": ["A high resistance such as infinity would indicate an open.  DS1 would not illuminate if there were an open.  Check your setup and measure resistance again.", "Continuity or a low resistance such as 2 W would indicate that there is no fault.  Check your setup and and measure resistance again.", "The measured resistance of 1500 W indicates that there is a changed value in the connector assembly.  Under normal conditions we would measure approximately 2 W.  Let's try to sectionalize the problem.", "A high resistance such as infinity would indicate an open. DS1 would not illuminate if there were an open. Check your setup and measure resistance again.", "Continuity or a low resistance such as 2 W would indicate that there is no fault. Check your setup and and measure resistance again. ......", "The measured resistance of 1500 W indicates that there is a changed value in the connector assembly. Under normal conditions we would measure approximately 2 W. Let's try to sectionalize the problem. W. Let's try to sectionalize the problem."], "jumps": ["P3408", "P3400"]}, {"id": "P3408", "text": ["Place one test lead on JA1 (PC130-W1) and the other on JB3 (PC130-W1)."], "jumps": ["P3410", "P3407", "PC130"]}, {"id": "P3410", "text": ["What is your resistance measurement?", "What is your resistance measurement?......................."], "jumps": ["P3407"]}, {"id": "P3411", "text": ["Ensure that you have the multimeter leads on JA1 and JB3. Check the multimeter and make sure that it is set to measure resistance.", "You should not have measured a changed value between these points in the circuit.  Ensure that you have the multimeter leads on JA1 and JB3.", "Since continuity was measured between JA1 and JB3, indicating that this portion of the connector assembly is good,  we know that the changed value is between JB3 and JB5.", "You should not have measured a changed value between these points in the circuit. Ensure that you have the multimeter leads on JA1 and JB3. Check the multimeter and make sure that it is set to measure resistance...", "Since continuity was measured between JA1 and JB3, indicating that this portion of the connector assembly is good, we know that the changed value is between JB3 and JB5. and JB5. ce the other lead on the terminals JG2 through JG6 in order."], "jumps": ["P3419", "P3410"]}, {"id": "P3419", "text": ["Place one
