]}, {"id": "P15491", "text": ["Ensure that the meter leads are between JD4 and JE5 on \nPC130-W2.", "Ensure that the meter leads are between JD4 and JE5 on PC130-W2."], "jumps": []}, {"id": "P15500", "text": ["Congratulations! You have just isolated the fault.  There is a changed value between JD4 and JE5.", "Congratulations! You have just isolated the fault. There is a changed value between JD4 and JE5."], "jumps": ["P15510", "P15490"]}, {"id": "P15510", "text": ["Now that you have found the problem, you would repair or replace the bad wire and perform the functional test."], "jumps": ["P15520", "P15500"]}, {"id": "P15520", "text": ["Remove the multimeter leads from the circuit and reconnect the circuit card cabling.  When you continue the computer will repair the fault.", "Remove the multimeter leads from the circuit and reconnect the circuit card cabling. When you continue the computer will repair the fault."], "jumps": ["P15500"]}, {"id": "P15523", "text": ["Remove the multimeter leads from the circuit and reconnect the circuit card cabling.  When you continue the computer will repair the fault.", "Remove the multimeter leads from the circuit and reconnect the circuit card cabling. When you continue the computer will repair the fault."], "jumps": []}, {"id": "P15525", "text": ["8.  Press enter to set: PC1 DC Power Switch - ON", "8. Press enter to set: PC1 DC Power Switch - ON..........................."], "jumps": []}, {"id": "P15530", "text": ["Perform the functional check.  Does the circuit operate correctly?", "Perform the functional check. Does the circuit operate correctly?"], "jumps": []}, {"id": "P15531", "text": [], "jumps": []}, {"id": "P15532", "text": ["Ensure that you're set-up is correct and perform the functional check.", "Remember, a Changed Value occurs when the circuit values are not correct.  This fault is generally identified by resistance            measurements of the wrong value.", "1. All cables are connected. 2. DC positive supply is set to 5 VDC. 3. DC power is on at the PC1 position. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up position...", "Ensure that you're set-up is correct and perform the functional check. (GRAPHICS TEXT) 1. All cables are connected. 2. DC positive supply is set to 5 VDC. 3. DC power is on at the PC1 position. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up", "Remember, a Changed Value occurs when the circuit values are not correct. This fault is generally identified by resistance measurements of the wrong value."], "jumps": ["P15530"]}, {"id": "P15560", "text": ["1.  Remove the printed circuit cards PC130-W1, PC130-W2 and           PC130-W3 from the console and store it in its designated area. 2.  Shut off the multimeter.", "1. Remove the printed circuit cards PC130-W1, PC130-W2 and PC130-W3 from the console and store it in its designated area. 2. Shut off the multimeter."], "jumps": ["P15570"]}, {"id": "P15570", "text": ["3.  Set the Test Console Power OFF.", "3. Set the Test Console Power OFF. OFF.FF................................."], "jumps": ["P15560"]}, {"id": "P15910", "text": ["This completes the experiment on CHANGED VALUE IN WIRING CIRCUIT."], "jumps": ["P3001", "P15570"]}, {"id": "P16040", "text": ["This exercise will introduce you to troubleshooting wiring and connector assemblies using voltage or current checks."], "jumps": ["P16050", "P4001"]}, {"id": "P16050", "text": ["Voltage and current checks may be performed without having to disconnect wiring assemblies.  If the voltage and current checks do not isolate the problem, it may lead to the sectionalization and localization of the fault.", "When used with the functional test and continuity checks, voltage and current checks may speed the troubleshooting process.", "Voltage and current checks may be performed without having to disconnect wiring assemblies. If the voltage and current checks do not isolate the problem, it may lead to the sectionalization and localization of the fault.", "When used with the functional test and continuity checks, voltage and current checks may speed the troubleshooting process. (GRAPHICS TEXT) Operation Required power is +5 V All switches closed DS1 is ON Any switch open DS1 is OFF", "Operation Required power is +5 V All switches closed DS1 is ON Any switch open DS1 is OFF"], "jumps": ["P16060", "P16040", "P16070", "P16050"]}, {"id": "P16070", "text": ["Remember to use a logical progression of sectionalizing, localizing and isolating when troubleshooting."], "jumps": ["P16080", "P16060"]}, {"id": "P16080", "text": ["Begin troubleshooting with a functional check.  If an open exists, current checks can be used to locate the problem.", "Begin troubleshooting with a functional check. If an open exists, current checks can be used to locate the problem."], "jumps": ["P16090", "P16060"]}, {"id": "P16090", "text": ["If a short or diminished indication is present, use voltage checks to locate the problem."], "jumps": ["P16100", "P16060"]}, {"id": "P16100", "text": ["Often a combination of the two methods will be used during the entire troubleshooting process.  Let's begin the experiment.", "Often a combination of the two methods will be used during the entire troubleshooting process. Let's begin the experiment."], "jumps": ["P16110", "P16060"]}, {"id": "P16110", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P16060"]}, {"id": "P16120", "text": ["2.  Carefully plug the circuit cards into these Test Console PC              positions:", "PC130-W1 on the PC1 connectors PC130-W2 on the PC2 connectors PC130-W3 on the PC3 connectors PC130-W3 on the PC3 connectors PC130-W3 on the PC3 connectors", "2. Carefully plug the circuit cards into these Test Console PC positions: he PC1 connectors PC130-W2 on the PC2 connectors PC130-W3 on the PC3 connectors"], "jumps": []}, {"id": "P16128", "text": ["3.  Connect all the plugs into the jacks of the circuit cards,                     including the coaxial cable between PC130-W1 and \n      PC130- W2.  Ensure that S1 on PC130-W1 is to the left and \n      S1 through S3 on PC130-W3 are in the down position.", "3. Connect all the plugs into the jacks of the circuit cards, including the coaxial cable between PC130-W1 and PC130- W2. Ensure that S1 on PC130-W1 is to the left and S1 through S3 on PC130-W3 are in the down position."], "jumps": ["P16130", "P16120"]}, {"id": "P16130", "text": ["4.  Press enter to set: Positive Supply Voltage  -  5 \n                                         PC1 DC Power Switch     - ON", "For normal operation place the PC card switches in the following positions:      PC130-W1                      PC130-W3\n                         S1 - Right (closed)      S1 - Up (closed)  \n                                                                  S2 - Up (closed)  \n                                                                  S3 - Up (closed)", "4. Press enter to set: Positive Supply Voltage - 5 PC1 DC Power Switch - ON", "For normal operation place the PC card switches in the following positions: PC130-W1 PC130-W3 S1 - Right (closed) S1 - Up (closed) S2 - Up (closed) S3 - Up (closed)"], "jumps": ["P16128"]}, {"id": "P16150", "text": ["The function check is performed by opening and closing the switches in the wiring assembly circuit.  The LED, DS1, should illuminate on PC130-W1 when all the switches are closed. Placing any one of the switches open, should prevent DS1 from illuminating.", "The function check is performed by opening and closing the switches in the wiring assembly circuit. The LED, DS1, should illuminate on PC130-W1 when all the switches are closed. Placing any one of the switches open, should prevent DS1 from illuminating."], "jumps": ["P16160", "P16140"]}, {"id": "P16160", "text": ["Place S1 (PC130-W1) to the left (open).  The light, DS1, should be turned OFF.", "Place S1 (PC130-W1) to the left (open). The light, DS1, should be turned OFF."], "jumps": ["P16170", "P16140", "PC130"]}, {"id": "P16170", "text": ["Place S1 (PC130-W1) to the right (closed).  The light, DS1, should illuminate.", "Place S1 (PC130-W1) to the right (closed). The light, DS1, should illuminate."], "jumps": ["P16180", "P16140", "PC130"]}, {"id": "P16180", "text": ["Place S1 on PC130-W3 in the down (open) position.  DS1\n(PC130-W1) should turn OFF.", "Place S1 on PC130-W3 in the down (open) position. DS1 (PC130-W1) should turn OFF."], "jumps": ["P16181", "P16140", "PC130"]}, {"id": "P16181", "text": ["Place S1 on PC130-W3 in the up (closed) position and DS1 (PC130-W1) should turn ON."], "jumps": ["P16190", "P16140", "PC130"]}, {"id": "P16190", "text": ["Place S2 on PC130-W3 in the down position.  DS1 (PC130-W1) should turn OFF.", "Place S2 on PC130-W3 in the down position. DS1 (PC130-W1) should turn OFF."], "jumps": ["P16191", "P16140", "PC130"]}, {"id": "P16191", "text": ["Place S2 on PC130-W3 in the up position and DS1 should be ON."], "jumps": ["P16200", "P16140"]}, {"id": "P16200", "text": ["Place S3 on PC130-W3 in the down position.  DS1 (PC130-W1) should turn OFF.", "Place S3 on PC130-W3 in the down position. DS1 (PC130-W1) should turn OFF."], "jumps": ["P16201", "P16140", "PC130"]}, {"id": "P16201", "text": ["Place S3 on PC130-W3 in the up position and DS1 (PC130-W1) should turn ON."], "jumps": ["P16210", "P16140", "PC130"]}, {"id": "P16210", "text": ["Remember, that during your function check when ANY of the switches were open DS1 was OFF.  DS1 only illuminated when ALL the switches were closed.  This indicates normal circuit operation.", "This wiring and connector assembly is a series circuit.  If an open occurs, it is like opening a switch, the lamp DS1 will not        illuminate.  The path to ground has been broke and current will not flow through the resistor or LED.", "Remember, that during your function check when ANY of the switches were open DS1 was OFF. DS1 only illuminated when ALL the switches were closed. This indicates normal circuit operation.", "This wiring and connector assembly is a series circuit. If an open occurs, it is like opening a switch, the lamp DS1 will not illuminate. The path to ground has been broke and current will not flow through the resistor or LED."], "jumps": ["P16220", "P16140", "P16230"]}, {"id": "P16230", "text": ["If DS1 is shorted directly to ground, the lamp will stay ON when any or all of the switches are open."], "jumps": ["P16240", "P16220"]}, {"id": "P16240", "text": ["If a portion of the connector assembly is shorted between wires, pins or to ground, DS1 (PC130-W1) will stay illuminated when the switches AFTER the short are opened."], "jumps": ["P16250", "P16220", "PC130"]}, {"id": "P16250", "text": ["A changed value will either increase or decrease the lamp's intensity."], "jumps": ["P16260", "P16220"]}, {"id": "P16260", "text": ["If circuit resistance is increased DS1 becomes dim."], "jumps": ["P16270", "P16220"]}, {"id": "P16270", "text": ["If resistance is decreased DS1 becomes brighter."], "jumps": ["P16280", "P16220"]}, {"id": "P16280", "text": ["Let's troubleshoot a fault now, remember to begin with the functional check.  The computer will place a fault in the circuit     when you continue.", "Let's troubleshoot a fault now, remember to begin with the functional check. The computer will place a fault in the circuit when you continue."], "jumps": ["P16220"]}, {"id": "P16290", "text": ["Ensure that the following settings have been completed, then perform the functional check.", "1. All cables are connected. 2. DC positive supply is set to 5 VDC. 3. PC1 DC power is ON. 4. S1 (PC130-W1) is placed to the right. 5. S1 through S3 (PC130-W3) are placed to the up position... the up position.........osition...", "Ensure that the following settings have been completed, then perform the functional check. (GRAPHICS TEXT) 1. All cables are connected. 2. DC positive supply is set to 5 VDC. 3. PC1 DC power is ON. 4. S1 (PC130-W1) is placed to the right. 5. S1 through S3 (PC130-W3) are placed to the up"], "jumps": ["P16300", "PC130"]}, {"id": "P16300", "text": ["Is the circuit operating correctly?", "No, S1 (PC130-W1) does not turn off DS1.", "Is the circuit operating correctly?........................"], "jumps": ["P16290", "PC130"]}, {"id": "P16301", "text": [], "jumps": []}, {"id": "P16302", "text": ["Notice that DS1 did not illuminate when the functional check was performed.  This is not normal circuit operation.  Check your set-up and perform the functional test again.", "Functional Check 1. Place switches to the following positions: S1 (PC130-W1) to the right, S1 (PC130-W3) up, S2 (PC130-W3) up, S3 (PC130-W3) up 2. Ensure PC1 DC Power is on. 3. DS1 (PC130-W1) should illuminate. 4. Check switch operation: S1 (PC130-W1) left = DS1 off, then right = on S1 (PC130-W3) down = DS1 off, then up = on S2 (PC130-W3) down = DS1 off, then up = on S3 (PC130-W3) down = DS1 off, then up = onff, then up = onnnnnnn", "Notice that DS1 did not illuminate when the functional check was performed. This is not normal circuit operation. Check your set-up and perform the functional test again. GRAPHICS TEXT) Functional Check 1. Place switches to the following position. S1 (PC130-W1) to the right, S1 (PC130-W3) up, S2 (PC130-W3) up, S3 (PC130-W3) up"], "jumps": ["PC130"]}, {"id": "P16310", "text": ["What type of fault would most likely keep DS1 from turning ON?"], "jumps": ["P16300"]}, {"id": "P16311", "text": [], "jumps": []}, {"id": "P16312", "text": ["Since DS1 (PC130-W1) is off, the circuit path to ground has been interrupted.", "n-in using current checks. Set your multimeter to measure current. Place the red test lead to JA1(PC130-W1) and the black test lead to JB5 (PC130-W1).", "Since we suspect an open, we can begin using current checks. Place S1 (PC130-W1) to the left (open). Set your multimeter to measure current. Place the red test lead to JA1(PC130-W1) and the black test lead to JB5 (PC130-W1). Place S1 (PC130-W1) to the right (closed)."], "jumps": ["P16330", "P16310", "PC130"]}, {"id": "P16330", "text": ["Does DS1 illuminate?", "Does DS1 illuminate?tion is typed.........................."], "jumps": ["P16320"]}, {"id": "P16331", "text": ["Check your setup, and ensure that you have the meter leads placed on the correct test points."], "jumps": []}, {"id": "P16340", "text": ["By placing the meter across the open, a path to ground is provided for current.  Since DS1 illuminated we can eliminate a few checks that would be necessary when using continuity checks to  troubleshoot.  We know that:", "- The applied voltage is good. - The resistor is not open. - DS1 is not open. - S1 on PC130-W1 is not open...30-W1) to the right, S1 (PC130-W3) up, S2 (PC130-W3) up, S3 (PC130-W3) up 2. Depress the DC Power button on the PC1 position. 3. DS1 (PC130-W1) should illuminate. 4. Check switch operation: S1 (PC130-W1) left = DS1 off, then right = on S1 (PC130-W3) down = DS1 off, then up = on S2 (PC130-W3) down = DS1 off, then up = on S3 (PC130-W3) down = DS1 off, then up = onnnnnnn", "By placing the meter across the open, a path to ground is provided for current. Since DS1 illuminated we can eliminate a few checks that would be necessary when using continuity checks to troubleshoot. We know that: GRAPHICS TEXT) - The applied voltage is good. - The resistor is not open. - DS1 is not open.", "Let's trace through the circuit and see if we can localize the problem. Before inserting meter leads place S1 (PC130-W1) to the left (open). Keep the red lead on JA1 (PC130-W1) and move the black lead to JG6 (PC130-W3). After meter leads are attached place S1 (PC130-W1) to the right (closed). moving meter leads reverse the p"], "jumps": ["P16341", "P16330", "P16350", "P16340", "PC130"]}, {"id": "P16350", "text": ["Move the black test lead up the card from JG6 to JG5, JG4, JG3, JG2 and JG1 until DS1 extinguishes. If the light stays on when we go from point to point, we know that we are bridging the open. Set S1 (PC130-W1) left (open) before attaching or removing meter leads. S1 (PC130-W1) right (closed ) for measurement........W1) to the right (closed). Reverse procedure"], "jumps": ["P16360", "P16341", "PC130"]}, {"id": "P16360", "text": ["At which point did DS1 turn off?", "At which point did DS1 turn off?d.........................."], "jumps": ["P16341"]}, {"id": "P16361", "text": ["Check your setup, and ensure that you move the black meter lead from JG6 to JG5, JG4, JG3 and then to JG2 on PC130-W3.", "We have sectionalized the circuit from the end to the top of S2 on PC130-W3.  Now, we can go toward PC130-W1 and find the point where DS1 turns off.", "We have sectionalized the circuit from the end to the top of S2 on PC130-W3. Now, we can go toward PC130-W1 and find the point where DS1 turns off."], "jumps": ["P16371", "P16360"]}, {"id": "P16371", "text": ["Move the black test lead through the test points moving from JG3 to JF3 through JE3, JD2, JB2 until DS1 extinguishes. Remember if the light stays on we know that we are bridging the open. Set S1 (PC130-W1) left (open) before attaching or removing meter leads. S1 (PC130-W1) right (closed ) for measurement."], "jumps": ["P16380", "P16370", "PC130"]}, {"id": "P16380", "text": ["At which point does DS1 turn off?", "At which point does DS1 turn off?.........................."], "jumps": ["P16370"]}, {"id": "P16381", "text": ["Check your setup, and ensure that you move the black meter lead from JG3 to JF3, JE3, JD2 and then to JB2 on the circuit cards.", "DS1 is not illuminated at JD2 or JB2 but these are not the first points where DS1 turns OFF.  Place the black meter lead from JG3 to JF3, JE3, JD2 and then to JB2 in this order.", "Congratulations! You have localized and isolated the open to be between JE3 and JF3.  Now let's verify that this is the only open in the circuit.", "DS1 is not illuminated at JD2 or JB2 but these are not the first points where DS1 turns OFF. Place the black meter lead from JG3 to JF3, JE3, JD2 and then to JB2 in this order....", "Congratulations! You have localized and isolated the open to be between JE3 and JF3. Now let's verify that this is the only open in the circuit."], "jumps": ["P16395", "P16380", "P"]}, {"id": "P16395", "text": ["5.  Press enter to set: PC1 DC Power Switch - OFF", "Remove the multimeter leads from the circuit. Now, that we have isolated the problem, let's jumper JE3 and JF3 positions and perform the functional check.  If this is the only open, the circuit should work properly.", "5. Press enter to set: PC1 DC Power Switch - OFF..........................", "Remove the multimeter leads from the circuit. Now, that we have isolated the problem, let's jumper JE3 and JF3 positions and perform the functional check. If this is the only open, the circuit should work properly."], "jumps": ["P16390", "P16410"]}, {"id": "P16410", "text": ["6.  Press enter to set: PC1 DC Power Switch - ON", "6. Press enter to set: PC1 DC Power Switch - ON..........................."], "jumps": ["P16400"]}, {"id": "P16440", "text": ["Perform the functional check.  Does DS1 illuminate properly?", "Perform the functional check. Does DS1 illuminate properly?"], "jumps": []}, {"id": "P16441", "text": [], "jumps": []}, {"id": "P16442", "text": ["Ensure the jumper wire is connected correctly and check the \nset-up.", "Now that you have found the problem, you would repair or replace the bad wire and perform the functional test.", "1. All cables are connected. 2. DC positive supply is set to 5 VDC. 3. DC power is on at the PC1 position. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up position.", "Ensure the jumper wire is connected correctly and check the set-up. RAPHICS TEXT) 1. All cables are connected. 2. DC positive supply is set to 5 VDC. 3. DC power is on at the PC1 position. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up position."], "jumps": ["P16460", "P16440", "P"]}, {"id": "P16455", "text": ["7.  Press enter to set: PC1 DC Power Switch - OFF", "7. Press enter to set: PC1 DC Power Switch - OFF.........................."], "jumps": ["P16450"]}, {"id": "P16460", "text": ["Place S1 (PC130-W1) to the left (open).  Remove the jumper wire from JE3 and JF3 on PC130-W1.  When you continue the computer will repair the fault.", "Place S1 (PC130-W1) to the left (open). Remove the jumper wire from JE3 and JF3 on PC130-W1. When you continue the computer will repair the fault."], "jumps": ["PC130"]}, {"id": "P16465", "text": ["8.  Press enter to set: PC1 DC Power Switch - ON", "8. Press enter to set: PC1 DC Power Switch - ON..........................."], "jumps": []}, {"id": "P16470", "text": ["Perform the functional check. Does the circuit operate correctly?"], "jumps": []}, {"id": "P16471", "text": [], "jumps": []}, {"id": "P16472", "text": ["Ensure that you have removed the jumper wire and check the set-up.", "Remember, an Open occurs when no path for current flow exists.  This fault is easily identified when a meter or jumper wire bridges over  the open portion of the circuit.", "Shorts or diminished indications are a little more troublesome, but they can be sectionalized or localized, using voltage checks.", "1. All cables are connected. 2. DC positive supply is set to 5 VDC. 3. DC power is on at the PC1 position. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up position.", "Ensure that you have removed the jumper wire and check the set-up. 1. All cables are connected. 2. DC positive supply is set to 5 VDC. 3. DC power is on at the PC1 position. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up position.", "Remember, an Open occurs when no path for current flow exists. This fault is easily identified when a meter or jumper wire bridges over the open portion of the circuit."], "jumps": ["P16490", "P16470", "P16500", "P16480"]}, {"id": "P16500", "text": ["Remembering the theory about voltage drops tells us that, the total voltage is equal to the sum of the individual voltage drops.", "While the circuit is functioning normally, set your meter to measure voltage and measure across the +5V TP and JA1 (PC130-W1).  Adjust the Positive Supply to obtain a 5 VDC on the meter.", "While the circuit is functioning normally, set your meter to measure voltage and measure across the +5V TP and JA1 (PC130-W1). Adjust the Positive Supply to obtain a 5 VDC on the meter."], "jumps": ["P16510", "P16490", "P16520", "P16500", "PC130"]}, {"id": "P16520", "text": ["We know that the total voltage drop across the resistor and the diode should equal the incoming voltage because the rest of the  circuit has no components that provide resistance to current, (no voltage drop).", "We know that the total voltage drop across the resistor and the diode should equal the incoming voltage because the rest of the circuit has no components that provide resistance to current, (no voltage drop)."], "jumps": ["P16530", "P16510"]}, {"id": "P16530", "text": ["Now, place the red test lead on JA1 (PC130-W1) and the black test lead on JB5 (PC130-W1)."], "jumps": ["P16540", "P16510", "PC130"]}, {"id": "P16540", "text": ["What is your measured voltage?", "What is your measured voltage?ped.........................."], "jumps": ["P16510"]}, {"id": "P16541", "text": [], "jumps": []}, {"id": "P16542", "text": ["Check the following settings:", "After S1 (PC130-W1), all the wiring to the end of the circuit should show a voltage drop of close to zero.", "1. All cables are connected. 2. DC positive supply is set to 5 VDC. 3. DC power is on at the PC1 position. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up position.", "Check the following settings: RAPHICS TEXT) 1. All cables are connected. 2. DC p let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
