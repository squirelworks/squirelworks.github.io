ad from JB4 to JF5 checking each test terminal in between. Check the multimeter and make sure that it is set to measure resistance......", "You should have measured the correct continuity reading before reaching JF5. Make your measurements again starting at JB4, moving one test point at a time towards JG5., s set to measure resistance......", "Now let's check the resistance between JD4 and JE5. Isolate PC130-W2 from the other cards by unplugging all cabling to and from PC130-W2.", "Place the meter leads between JD4 and JE5 on PC130-W2......"], "jumps": ["P3460", "P3440", "P3490", "P3450"]}, {"id": "P3490", "text": ["What is the indication between JD4 (PC130-W2) and JE5 \n(PC130-W2)?", "What is the indication between JD4 (PC130-W2) and JE5 (PC130-W2)?"], "jumps": ["P3460", "PC130"]}, {"id": "P3491", "text": ["Ensure that the meter leads are between JD4 and JE5 on \nPC130-W2.", "Ensure that the meter leads are between JD4 and JE5 on PC130-W2."], "jumps": []}, {"id": "P3500", "text": ["Congratulations!  You have just isolated the fault.  There is a changed value between JD4 and JE5.", "Congratulations! You have just isolated the fault. There is a changed value between JD4 and JE5."], "jumps": ["P3510", "P3490"]}, {"id": "P3510", "text": ["Now that you have found the problem, you would repair or replace the bad wire and perform the functional test."], "jumps": ["P3520", "P3500"]}, {"id": "P3520", "text": ["Remove the multimeter leads from the circuit and reconnect the circuit card cabling.  When you continue the computer will repair the fault.", "Remove the multimeter leads from the circuit and reconnect the circuit card cabling. When you continue the computer will repair the fault."], "jumps": ["P3500"]}, {"id": "P3525", "text": ["3.  Turn PC1 DC Power switch to ON.", "3. Turn PC1 DC Power switch to ON.ol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": []}, {"id": "P3526", "text": ["3. Press enter to apply DC Power on TecDec 1. 3. Press enter to apply DC Power on TecDec 1."], "jumps": ["P3520"]}, {"id": "P3530", "text": ["Perform the functional check.  Does the circuit operate correctly?", "Perform the functional check. Does the circuit operate correctly?"], "jumps": []}, {"id": "P3531", "text": [], "jumps": []}, {"id": "P3532", "text": ["Ensure that you're set-up is correct and perform the functional check.", "Remember, a Changed Value occurs when the circuit values are not correct.  This fault is generally identified by resistance            measurements of the wrong value.", "1. All cables are connected. 2. Positive DC voltage is set to 5 VDC. 3. DC power is ON. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up position..............................", "Ensure that you're set-up is correct and perform the functional check. (GRAPHICS TEXT) 1. All cables are connected. 2. DC positive supply is set to 5 VDC. 3. DC power is on at the PC1 position. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up", "Remember, a Changed Value occurs when the circuit values are not correct. This fault is generally identified by resistance measurements of the wrong value."], "jumps": ["P3530"]}, {"id": "P3550", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": ["P3540"]}, {"id": "P3551", "text": ["1. Press enter to re-initialize the console.ntrol settings................"], "jumps": ["P1590"]}, {"id": "P3560", "text": ["2.  If training session is completed, remove the printed circuit              cards PC130-W1, PC130-W2 and PC130-W3 from the console        and store it in its designated area.\n3.  Shut off the multimeter.", "2. If training session is completed, remove the printed circuit cards PC130-W1, PC130-W2 and PC130-W3 from the console and store it in its designated area. 3. Shut off the multimeter."], "jumps": ["P3570"]}, {"id": "P3570", "text": ["4.  Set the Test Console Power OFF.", "4. Set the Test Console Power OFF. OFF...................."], "jumps": ["P3560"]}, {"id": "P3910", "text": ["This completes the experiment on CHANGED VALUE IN WIRING CIRCUIT."], "jumps": ["P3001", "P3570"]}, {"id": "P4001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P4040", "text": ["This exercise will introduce you to troubleshooting wiring and connector assemblies using voltage or current checks."], "jumps": ["P4001"]}, {"id": "P4050", "text": ["Voltage and current checks may be performed without having to disconnect wiring assemblies.  If the voltage and current checks do not isolate the problem, it may lead to the sectionalization and localization of the fault.", "When used with the functional test and continuity checks, voltage and current checks may speed the troubleshooting process.", "Voltage and current checks may be performed without having to disconnect wiring assemblies. If the voltage and current checks do not isolate the problem, it may lead to the sectionalization and localization of the fault.", "Operation Required power is +5 V All switches closed DS1 is ON Any switch open DS1 is OFF", "When used with the functional test and continuity checks, voltage and current checks may speed the troubleshooting process. Operation Required power is +5 V All switches closed DS1 is ON Any switch open DS1 is OFFFF"], "jumps": ["P4040", "P4050"]}, {"id": "P4070", "text": ["Remember to use a logical progression of sectionalizing, localizing and isolating when troubleshooting."], "jumps": ["P4060"]}, {"id": "P4080", "text": ["Begin troubleshooting with a functional check.  If an open exists, current checks can be used to locate the problem.", "Begin troubleshooting with a functional check. If an open exists, current checks can be used to locate the problem."], "jumps": ["P4060"]}, {"id": "P4090", "text": ["If a short or diminished indication is present, use voltage checks to locate the problem."], "jumps": ["P4060"]}, {"id": "P4100", "text": ["Often a combination of the two methods will be used during the entire troubleshooting process.  Let's begin the experiment.", "Often a combination of the two methods will be used during the entire troubleshooting process. Let's begin the experiment."], "jumps": ["P4060"]}, {"id": "P4105", "text": ["1. Set up the test consoles for multiple interface. Ensure that power to each console is NOT ON. ON."], "jumps": []}, {"id": "P4106", "text": ["2. Set Test Console 1 Power ON...N..each test console ON.... start the experiment."], "jumps": []}, {"id": "P4107", "text": ["2. Set Test Console 2 Power ON...N..each test console ON.... start the experiment."], "jumps": []}, {"id": "P4108", "text": ["2. Set Test Console 3 Power ON...N..each test console ON.... start the experiment."], "jumps": []}, {"id": "P4110", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P4060"]}, {"id": "P4115", "text": ["1. Press enter to initialize the test consoles.initialize console........."], "jumps": []}, {"id": "P4120", "text": ["2.  Carefully plug the circuit cards into these Test Console PC             positions:", "PC130-W1 on the PC1 connectors PC130-W2 on the PC2 connectors PC130-W3 on the PC3 connectors PC130-W3 on the PC3 connectors PC130-W3 on the PC3 connectors", "2. Carefully plug the circuit cards into these Test Console PC positions: PC130-W1 on the PC1 connectors PC130-W2 on the PC2 connectors PC130-W3 on the PC3 connectors"], "jumps": []}, {"id": "P4121", "text": ["2. Carefully plug the circuit cards into the three Test Consoles."], "jumps": []}, {"id": "P4128", "text": ["3.  Connect all the plugs into the jacks of the circuit cards,                    including the coaxial cable between PC130-W1 and \n     PC130-W2.  Ensure that S1 on PC130-W1 is to the left and S1         through S3 on PC130-W3 are in the down position.", "3. Connect all the plugs into the jacks of the circuit cards, including the coaxial cable between PC130-W1 and PC130-W2. Ensure that S1 on PC130-W1 is to the left and S1 through S3 on PC130-W3 are in the down position."], "jumps": []}, {"id": "P4130", "text": ["4.  Set the Voltmeter Switch to Positive. \n5.  Set the Positive Supply Voltage to 5. \n     The Test Console's Voltage Meter should indicate 5 volts.          6.  Set PC1 DC Power Switch to ON.", "4. Set the Voltmeter Switch to Positive. 5. Set the Positive Supply Voltage to 5. The Test Console's Voltage Meter should indicate 5 volts. 6. Set PC1 DC Power Switch to ON."], "jumps": ["P4128"]}, {"id": "P4131", "text": ["For normal operation place the PC card switches in the following positions:      PC130-W1                      PC130-W3\n                         S1 - Right (closed)      S1 - Up (closed)  \n                                                                  S2 - Up (closed)  \n                                                                  S3 - Up (closed)", "4. Press enter to set voltage to 5 volts on TecDec 1. 5. Press enter to apply DC Power on TecDec 1. 6. Set PC1 DC Power Switch to ON.", "For normal operation place the PC card switches in the following positions: PC130-W1 PC130-W3 S1 - Right (closed) S1 - Up (closed) S2 - Up (closed) S3 - Up (closed)"], "jumps": ["P4128"]}, {"id": "P4150", "text": ["The function check is performed by opening and closing the switches in the wiring assembly circuit.  The LED, DS1, should illuminate on PC130-W1 when all the switches are closed. Placing any one of the switches open, should prevent DS1 from illuminating.", "The function check is performed by opening and closing the switches in the wiring assembly circuit. The LED, DS1, should illuminate on PC130-W1 when all the switches are closed. Placing any one of the switches open, should prevent DS1 from illuminating."], "jumps": ["P4140"]}, {"id": "P4160", "text": ["Place S1 (PC130-W1) to the left (open).  The light, DS1, should be turned OFF.", "Place S1 (PC130-W1) to the left (open). The light, DS1, should be turned OFF."], "jumps": ["P4140", "PC130"]}, {"id": "P4170", "text": ["Place S1 (PC130-W1) to the right (closed).  The light, DS1, should illuminate.", "Place S1 (PC130-W1) to the right (closed). The light, DS1, should illuminate."], "jumps": ["P4140", "PC130"]}, {"id": "P4180", "text": ["Place S1 on PC130-W3 in the down (open) position.  DS1 \n(PC130-W1) should turn OFF.", "Place S1 on PC130-W3 in the down (open) position. DS1 (PC130-W1) should turn OFF."], "jumps": ["P4140", "PC130"]}, {"id": "P4181", "text": ["Place S1 on PC130-W3 in the up (closed) position and DS1 (PC130-W1) should turn ON."], "jumps": ["P4140", "PC130"]}, {"id": "P4190", "text": ["Place S2 on PC130-W3 in the down position.  DS1 (PC130-W1) should turn OFF.", "Place S2 on PC130-W3 in the down position. DS1 (PC130-W1) should turn OFF."], "jumps": ["P4191", "P4140", "PC130"]}, {"id": "P4191", "text": ["Place S2 on PC130-W3 in the up position and DS1 should be ON."], "jumps": ["P4200", "P4140"]}, {"id": "P4200", "text": ["Place S3 on PC130-W3 in the down position.  DS1 (PC130-W1) should turn OFF.", "Place S3 on PC130-W3 in the down position. DS1 (PC130-W1) should turn OFF."], "jumps": ["P4201", "P4140", "PC130"]}, {"id": "P4201", "text": ["Place S3 on PC130-W3 in the up position and DS1 (PC130-W1) should turn ON."], "jumps": ["P4210", "P4140", "PC130"]}, {"id": "P4210", "text": ["Remember, that during your function check when ANY of the switches were open DS1 was OFF.  DS1 only illuminated when ALL the switches were closed.  This indicates normal circuit operation.", "This wiring and connector assembly is a series circuit.  If an open occurs, it is like opening a switch, the lamp DS1 will not        illuminate.  The path to ground has been broke and current will not flow through the resistor or LED.", "Remember, that during your function check when ANY of the switches were open DS1 was OFF. DS1 only illuminated when ALL the switches were closed. This indicates normal circuit operation.", "This wiring and connector assembly is a series circuit. If an open occurs, it is like opening a switch, the lamp DS1 will not illuminate. The path to ground has been broke and current will not flow through the resistor or LED."], "jumps": ["P4220", "P4140", "P4230"]}, {"id": "P4230", "text": ["If DS1 is shorted directly to ground, the lamp will stay ON when any or all of the switches are open."], "jumps": ["P4240", "P4220"]}, {"id": "P4240", "text": ["If a portion of the connector assembly is shorted between wires, pins or to ground, DS1 (PC130-W1) will stay illuminated when the switches AFTER the short are opened."], "jumps": ["P4250", "P4220", "PC130"]}, {"id": "P4250", "text": ["A changed value will either increase or decrease the lamp's intensity."], "jumps": ["P4260", "P4220"]}, {"id": "P4260", "text": ["If circuit resistance is increased DS1 becomes dim."], "jumps": ["P4270", "P4220"]}, {"id": "P4270", "text": ["If resistance is decreased DS1 becomes brighter."], "jumps": ["P4280", "P4220"]}, {"id": "P4280", "text": ["Let's troubleshoot a fault now, remember to begin with the functional check.  The computer will place a fault in the circuit     when you continue.", "Let's troubleshoot a fault now, remember to begin with the functional check. The computer will place a fault in the circuit when you continue."], "jumps": ["P4220"]}, {"id": "P4290", "text": ["Ensure that the following settings have been completed, then perform the functional check.", "1. All cables are connected. 2. Positive DC voltage is set to 5 VDC. 3. DC power is ON. 4. S1 (PC130-W1) is placed to the right. 5. S1 through S3 (PC130-W3) are placed to the up position............. position.........osition...", "Ensure that the following settings have been completed, then perform the functional check. 1All cables are connected. 2. DC positive supply is set to 5 VDC. 3. PC1 DC power is ON. 4. S1 (PC130-W1) is placed to the right. 5. S1 through S3 (PC130-W3) are placed to the up"], "jumps": ["P4300", "PC130"]}, {"id": "P4300", "text": ["Is the circuit operating correctly?", "No, S1 (PC130-W1) does not turn off DS1.", "Is the circuit operating correctly?........................"], "jumps": ["P4290", "PC130"]}, {"id": "P4301", "text": [], "jumps": []}, {"id": "P4302", "text": ["Notice that DS1 did not illuminate when the functional check was performed.  This is not normal circuit operation.  Check your set-up and perform the functional test again.", "Functional Check 1. Place switches to the following positions: S1 (PC130-W1) to the right, S1 (PC130-W3) up, S2 (PC130-W3) up, S3 (PC130-W3) up 2. DC Power ON. 3. DS1 (PC130-W1) should illuminate. 4. Check switch operation: S1 (PC130-W1) left = DS1 off, then right = on S1 (PC130-W3) down = DS1 off, then up = on S2 (PC130-W3) down = DS1 off, then up = on S3 (PC130-W3) down = DS1 off, then up = onnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn", "Notice that DS1 did not illuminate when the functional check was performed. This is not normal circuit operation. Check your set-up and perform the functional test again. RAPHICS TEXT ) Functional Check 1. Place switches to the following position. S1 (PC130-W1) to the right, S1 (PC130-W3) up, S2 (PC130-W3) up, S3 (PC130-W3) upppp"], "jumps": ["PC130"]}, {"id": "P4310", "text": ["What type of fault would most likely keep DS1 from turning ON?"], "jumps": ["P4300"]}, {"id": "P4311", "text": [], "jumps": []}, {"id": "P4312", "text": ["Since DS1 (PC130-W1) is off, the circuit path to ground has been interrupted.", "spect an open, we can begin using current checks. Set your multimeter to measure current. Place the red test lead to JA1(PC130-W1) and the black test lead to JB5 (PC130-W1).", "Since we suspect an open, we can begin using current checks. Place S1 (PC130-W1) to the left (open). Set your multimeter to measure current. Place the red test lead to JA1(PC130-W1) and the black test lead to JB5 (PC130-W1). Place S1 (PC130-W1) to the right (closed)."], "jumps": ["P4330", "P4310", "PC130"]}, {"id": "P4330", "text": ["Does DS1 illuminate?", "Does DS1 illuminate?tion is typed.........................."], "jumps": ["P4320"]}, {"id": "P4331", "text": ["Check your setup, and ensure that you have the meter leads placed on the correct test points."], "jumps": []}, {"id": "P4340", "text": ["By placing the meter across the open, a path to ground is provided for current. Since DS1 illuminated we can eliminate a few checks that would be necessary when using continuity checks to troubleshoot.  We know that:", "- The applied voltage is good. - The resistor is not open. - DS1 is not open. - S1 on PC130-W1 is not open...30-W1) to the right, S1 (PC130-W3) up, S2 (PC130-W3) up, S3 (PC130-W3) up 2. Depress the DC Power button on the PC1 position. 3. DS1 (PC130-W1) should illuminate. 4. Check switch operation: S1 (PC130-W1) left = DS1 off, then right = on S1 (PC130-W3) down = DS1 off, then up = on S2 (PC130-W3) down = DS1 off, then up = on S3 (PC130-W3) down = DS1 off, then up = onnnnnnn", "By placing the meter across the open, a path to ground is provided for current. Since DS1 illuminated we can eliminate a few checks that would be necessary when using continuity checks to troubleshoot. We know that: The applied voltage is good. - The resistor is not open. - DS1 is not open.....................", "it and see if we can localize the problem. Keep the red lead on JA1 (PC130-W1) and move the black lead to JG6 (PC130-W3).", "Let's trace through the circuit and see if we can localize the problem. Before inserting meter leads place S1 (PC130-W1) to the left (open). Keep the red lead on JA1 (PC130-W1) and move the black lead to JG6 (PC130-W3). After meter leads are attached place S1 (PC130-W1) to the right (closed)."], "jumps": ["P4341", "P4330", "P4350", "P4340", "PC130"]}, {"id": "P4350", "text": ["Move the black test lead up the card from JG6 to JG5, JG4, JG3, JG2 and JG1 until DS1 extinguishes. If the light stays on when we go from point to point, we know that we are bridging the open. Set S1 (PC130-W1) left (open) before attaching or removing meter leads. S1 (PC130-W1) right (closed ) for measurement."], "jumps": ["P4360", "P4341", "PC130"]}, {"id": "P4360", "text": ["At which point did DS1 turn off?", "At which point did DS1 turn off?d.........................."], "jumps": ["P4341"]}, {"id": "P4361", "text": ["Check your setup, and ensure that you move the black meter lead from JG6 to JG5, JG4, JG3 and then to JG2 on PC130-W3.", "We have sectionalized the circuit from the end to the top of S2 on PC130-W3.  Now, we can go toward PC130-W1 and find the point where DS1 turns off.", "We have sectionalized the circuit from the end to the top of S2 on PC130-W3. Now, we can go toward PC130-W1 and find the point where DS1 turns off....."], "jumps": ["P4371", "P4360"]}, {"id": "P4371", "text": ["Move the black test lead through the test points moving from JG3 to JF3 through JE3, JD2, JB2 until DS1 extinguishes. Remember if the light stays on we know that we are bridging the open. Set S1 (PC130-W1) left (open) before attaching or removing meter leads. S1 (PC130-W1) right (closed ) for measurement."], "jumps": ["P4380", "P4370", "PC130"]}, {"id": "P4380", "text": ["At which point does DS1 turn off?", "At which point does DS1 turn off?.........................."], "jumps": ["P4370"]}, {"id": "P4381", "text": ["Check your setup, and ensure that you move the black meter lead from JG3 to JF3, JE3, JD2 and then to JB2 on the circuit cards.", "DS1 is not illuminated at JD2 or JB2 but these are not the first points where DS1 turns OFF.  Place the black meter lead from JG3 to JF3, JE3, JD2 and then to JB2 in this order.", "Congratulations!  You have localized and isolated the open to be between JE3 and JF3.  Now let's verify that this is the only open in the circuit.", "DS1 is not illuminated at JD2 or JB2 but these are not the first points where DS1 turns OFF. Place the black meter lead from JG3 to JF3, JE3, JD2 and then to JB2 in this order....", "Congratulations! You have localized and isolated the open to be between JE3 and JF3. Now let's verify that this is the only open in the circuit."], "jumps": ["P4380"]}, {"id": "P4395", "text": ["1.  Set the PC1 DC switch to OFF.", "1. Set the PC1 DC switch to OFF.trol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P4390"]}, {"id": "P4396", "text": ["Remove the multimeter leads from the circuit.  Now, that we have isolated the problem, let's jumper JE3 and JF3 positions and perform the functional check.  If this is the only open, the circuit should work properly.", "1. Press enter to remove DC Power on TecDec 1.130A - Set the PC1 DC Switch to ON....", "Remove the multimeter leads from the circuit. Now, that we have isolated the problem, let's jumper JE3 and JF3 positions and perform the functional check. If this is the only open, the circuit should work properly."], "jumps": ["P4390"]}, {"id": "P4410", "text": ["2.  Set PC1 DC Power ON.", "2. Set PC1 DC Power ON.upply Control to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P4400"]}, {"id": "P4411", "text": ["2. Press enter to apply DC Power on TecDec 1. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P4400"]}, {"id": "P4440", "text": ["Perform the functional check.  Does DS1 illuminate properly?", "Perform the functional check. Does DS1 illuminate properly?"], "jumps": []}, {"id": "P4441", "text": [], "jumps": []}, {"id": "P4442", "text": ["Ensure the jumper wire is connected correctly and check the set-up.", "Now that you have found the problem, you would repair or replace the bad wire and perform the functional test.", "1. All cables are connected. 2. Positive DC voltage is set to 5 VDC. 3. DC power is ON. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up position...............................", "Ensure the jumper wire is connected correctly and check the set-up. 1. All cables are connected. 2. DC positive supply is set to 5 VDC. 3. DC power is on at the PC1 position. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up position.", "Now that you have found the problem, you would repair or replace the bad wire and perform the functional test.. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P4440"]}, {"id": "P4455", "text": ["3.  Set the PC1 DC switch to OFF.", "3. Set the PC1 DC switch to OFF.trol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P4450"]}, {"id": "P4456", "text": ["3. Press enter to remove DC Power on TecDec 1.130A - Set the PC1 DC Switch to ON...."], "jumps": ["P4450"]}, {"id": "P4460", "text": ["Place S1 (PC130-W1) to the left (open).  Remove the jumper wire from JE3 and JF3 on PC130-W1.  When you continue the computer will repair the fault.", "Place S1 (PC130-W1) to the left (open). Remove the jumper wire from JE3 and JF3 on PC130-W1. When you continue the computer will repair the fault. .............."], "jumps": ["PC130"]}, {"id": "P4465", "text": ["4.  Set the PC1 DC switch to ON.", "4. Set the PC1 DC switch to ON..trol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P4460"]}, {"id": "P4466", "text": ["4. Press enter to apply DC Power on TecDec 1. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P4460"]}, {"id": "P4470", "text": ["Perform the functional check.  Does the circuit operate correctly?", "Perform the functional check. Does the circuit operate correctly?"], "jumps": []}, {"id": "P4471", "text": [], "jumps": []}, {"id": "P4472", "text": ["Ensure that you have removed the jumper wire and check the set-up.", "Remember, an Open occurs when no path for current flow exists.  This fault is easily identified when a meter or jumper wire bridges over the open portion of the circuit.", "Shorts or diminished indications are a little more troublesome, but they can be sectionalized or localized, using voltage checks.", "1. All cables are connected. 2. Positive DC voltage is set to 5 VDC. 3. DC power is ON. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up position..............................", "Ensure that you have removed the jumper wire and check the set-up. 1. All cables are connected. 2. DC positive supply is set to 5 VDC. 3. DC power is on at the PC1 position. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up position.", "Remember, an Open occurs when no path for current flow exists. This fault is easily identified when a meter or jumper wire bridges over the open portion of the circuit."], "jumps": ["P4490", "P4470", "P4500", "P4480"]}, {"id": "P4500", "text": ["Remembering the theory about voltage drops tells us that, the total voltage is equal to the sum of the individual voltage drops.", "While the circuit is functioning normally, set your meter to measure voltage and measure across the +5v TP and JA1 (PC130-W1).", "While the circuit is functioning normally, set your meter to measure voltage and measure across the +5v TP and JA1 (PC130-W1). just the Positive Supply to obtain a 5 VDC on the meter."], "jumps": ["P4510", "P4490", "P4500", "PC130"]}, {"id": "P4520", "text": ["We know that the total voltage drop across the resistor and the diode should equal the incoming voltage because the rest of the  circuit has no components that provide resistance to current, (no voltage drop).", "We know that the total voltage drop across the resistor and the diode should equal the incoming voltage because the rest of the circuit has no components that provide resistance to current, (no voltage drop)."], "jumps": ["P4530", "P4510"]}, {"id": "P4530", "text": ["Now, place the red test lead on JA1 (PC130-W1) and the black test lead on JB5 (PC130-W1)."], "jumps": ["P4540", "P4510", "PC130"]}, {"id": "P4540", "text": ["What is your measured voltage?", "What is your measured voltage?ped.........................."], "jumps": ["P4510"]}, {"id": "P4541", "text": [], "jumps": []}, {"id": "P4542", "text": ["Check the following settings:", "After S1 (PC130-W1), all the wiring to the end of the circuit should show a voltage drop of close to zero.", "1. All cables are connected. 2. Positive DC voltage is set to 5 VDC. 3. DC power is ON. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up position..............................", "Check the following settings: All cables are connected. 2. DC positive supply is set to 5 VDC. 3. DC power is on at the PC1 position. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up position."], "jumps": ["P4560", "P4540", "PC130"]}, {"id": "P4560", "text": ["Now that you have seen and measured the voltage drops of the circuit under normal conditions the computer is going to insert a fault when you continue."], "jumps": ["P4550"]}, {"id": "P4570", "text": ["Perform the functional test on this circuit.  What is your indication?", "Perform the functional test on this circuit. What is your indication?"], "jumps": []}, {"id": "P4571", "text": [], "jumps": []}, {"id": "P4572", "text": ["Notice that DS1 is dimmer than normal.  Check your set-up and perform the functional test again.", "Measure across the resistor and diode to check their voltage drop as you did earlier.  Place the red meter lead on +5V and the black lead on JA1.", "Functional Check 1. Place switches to the following positions: S1 (PC130-W1) to the right, S1 (PC130-W3) up, S2 (PC130-W3) up, S3 (PC130-W3) up 2. DC Power ON. 3. DS1 (PC130-W1) should illuminate. 4. Check switch operation: S1 (PC130-W1) left = DS1 off, then right = on S1 (PC130-W3) down = DS1 off, then up = on S2 (PC130-W3) down = DS1 off, then up = on S3 (PC130-W3) down = DS1 off, then up = onnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn", "Notice that DS1 is dimmer than normal. Check your set-up and perform the functional test again. ctional Check 1. Place switches to the following position. S1 (PC130-W1) to the right, S1 (PC130-W3) up, S2 (PC130-W3) up, S3 (PC130-W3) up 2. Depress the DC Power button on the PC1 position.", "Measure across the resistor and diode to check their voltage drop as you did earlier. Place the red meter lead on +5V and the black lead on JA1."], "jumps": ["P4590", "P4570"]}, {"id": "P4590", "text": ["Was the voltage drop across the resistor and diode correct?"], "jumps": ["P4580"]}, {"id": "P4591", "text": ["Ensure that you have the meter leads placed on the correct test points and that your setup is correct.", "The voltage across the resistor and diode is half of the predicted value.  Let's check the voltage drop for the rest of the circuit.      Place your red test lead on JA1 (PC130-W1) and your black lead on JB5 (PC130-W1).  Under normal operation there was virtually no voltage drop measured between these points.", "The voltage across the resistor and diode is half of the predicted value. Let's check the voltage drop for the rest of the circuit. Place your red test lead on JA1 (PC130-W1) and your black lead on JB5 (PC130-W1). Under normal operation there was virtually no voltage drop measured between these points."], "jumps": ["P4610", "P4590", "PC130"]}, {"id": "P4610", "text": ["Was the voltage drop across JA1 and JB5 correct?", "Was the voltage drop across JA1 and JB5 correct?..........."], "jumps": ["P4600"]}, {"id": "P4611", "text": ["Ensure that you have the meter leads placed on the correct test points and that your setup is correct."], "jumps": []}, {"id": "P4620", "text": ["Leave your black test lead on JB5 (PC130-W1) and move your red test lead to JG1 (PC130-W3).  What is your measured voltage drop?", "Leave your black test lead on JB5 (PC130-W1) and move your red test lead to JG1 (PC130-W3). What is your measured voltage drop?"], "jumps": ["P4610", "PC130"]}, {"id": "P4621", "text": ["Ensure that you have the meter leads placed on the correct test points and that your setup is correct."], "jumps": []}, {"id": "P4630", "text": ["Now continue down the card from JG2 to JG3, JG4, JG5 and JG6 until no voltage drop is found. Where does the voltage equal zero volts?"], "jumps": ["P4620"]}, {"id": "P4631", "text": ["Ensure that you have the meter leads placed on the correct test points and that your setup is correct.  Move the red lead from     JG1 to JG2, JG3, JG4, JG5 and JG6.", "Since we have not found the ground (0 VDC), all of the wiring is good between the input of circuit and the bottom of S3\n(PC130-W3).", "Let's check the end of the circuit for a  ground.  Place the black lead on JB5 and move the red test lead from JG6 to JF6, JE6 and JD5.", "Ensure that you have the meter leads placed on the correct test points and that your setup is correct. Move the red lead from JG1 to JG2, JG3, JG4, JG5 and JG6.6..", "Since we have not found the ground (0 VDC), all of the wiring is good between the input of circuit and the bottom of S3 (PC130-W3).", "Let's check the end of the circuit for a ground. Place the black lead on JB5 and move the red test lead from JG6 to JF6, JE6 and JD5."], "jumps": ["P4645", "P4630", "P4650", "P4640"]}, {"id": "P4650", "text": ["Where does the meter reading indicate 0 VDC?", "Where does the meter reading indicate 0 VDC?..............."], "jumps": ["P4640", "PC130"]}, {"id": "P4651", "text": ["Ensure that you have the meter leads placed on the correct test points and that your setup is correct.  Move the black lead from     JF6 to JE6, JD5, and JB5.", "Congratulations!  You have localized and isolated the short to JD5.", "Ensure that you have the meter leads placed on the correct test points and that your setup is correct. Move the black lead from JF6 to JE6, JD5, and JB5..", "Congratulations! You have localized and isolated the short to JD5."], "jumps": ["P4680", "P4650"]}, {"id": "P4680", "text": ["Now that you have found the problem, you would repair or replace the bad wire and perform the functional test."], "jumps": ["P4690", "P4670"]}, {"id": "P4690", "text": ["When you continue the computer will repair the fault.", "When you continue the computer will repair the fault.1 DC switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P4670"]}, {"id": "P4700", "text": ["Perform the functional check.  Does the circuit operate correctly?", "Perform the functional check. Does the circuit operate correctly?"], "jumps": []}, {"id": "P4701", "text": [], "jumps": []}, {"id": "P4702", "text": ["Check your set-up and perform the functional test again.", "Remember, a Short occurs when there are extra or incorrect paths for current flow to follow.  This fault can be identified by making voltage measurements that indicate incorrect voltage drops.", "As you can see, there are advantages to using voltage or current checks.  They can speed the troubleshooting process considerably when you understand the circuit you are troubleshooting.", "Functional Check 1. Place switches to the following positions: S1 (PC130-W1) to the right, S1 (PC130-W3) up, S2 (PC130-W3) up, S3 (PC130-W3) up 2. DC Power ON. 3. DS1 (PC130-W1) should illuminate. 4. Check switch operation: S1 (PC130-W1) left = DS1 off, then right = on S1 (PC130-W3) down = DS1 off, then up = on S2 (PC130-W3) down = DS1 off, then up = on S3 (PC130-W3) down = DS1 off, then up = onnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn", "Check your set-up and perform the functional test again. nctional Check 1. Place switches to the following position. S1 (PC130-W1) to the right, S1 (PC130-W3) up, S2 (PC130-W3) up, S3 (PC130-W3) up 2. Depress the DC Power button on the PC1 position. 3. DS1 (PC130-W1) should illuminate.", "Remember, a Short occurs when there are extra or incorrect paths for current flow to follow. This fault can be identified by making voltage measurements that indicate incorrect voltage drops.", "Operation Required power is +5 V All switches closed DS1 is ON Any switch open DS1 is OFF", "As you can see, there are advantages to using voltage or current checks. They can speed the troubleshooting process considerably when you understand the circuit you are troubleshooting. Operation Required power is +5 V All switches closed DS1 is ON Any switch open DS1 is OFFFFF"], "jumps": ["P4710", "P4700", "P4705"]}, {"id": "P4720", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": ["P4705"]}, {"id": "P4721", "text": ["1. Press enter to re-initialize the console.ntrol settings................"], "jumps": ["P4710"]}, {"id": "P4730", "text": ["2.  If training session is completed, remove the printed circuit              cards PC130-W1, PC130-W2 and PC130-W3 from the console        and store it in its designated area. \n3.  Shut off the multimeter.", "2. If training session is completed, remove the printed circuit cards PC130-W1, PC130-W2 and PC130-W3 from the console and store it in its designated area. 3. Shut off the multimeter."], "jumps": ["P4740"]}, {"id": "P4740", "text": ["4.  Set the Test Console Power OFF.", "4. Set the Test Console Power OFF. OFF...................."], "jumps": ["P4730"]}, {"id": "P4910", "text": ["This completes the experiment on a VOLTAGE AND CURRENT CHECKS.", "This completes the experiment on a VOLTAGE AND CURRENT CHECKS.."], "jumps": ["P4001", "P4740"]}, {"id": "P13040", "text": ["In this exercise we will use a multimeter to make voltage and resistance checks to isolate an open in a wiring circuit."], "jumps": ["P13080", "P1001"]}, {"id": "P13080", "text": ["Let's discuss normal operation of the wiring and connector assembly used in this exercise.", "The three PC positions are connected making a series circuit. The wiring is routed through four switches, any one of which can turn DS1 OFF."], "jumps": ["P13090", "P13040", "P13100", "P13080"]}, {"id": "P13100", "text": ["Let's examine the circuit.  The +5 VDC enters PC130-W1 and travels through a resistor, a light emitting diode, a switch (SPST) to the connector JA.  A coaxial cable then connects PC130-W1 to PC130-W2.", "Let's examine the circuit. The +5 VDC enters PC130-W1 and travels through a resistor, a light emitting diode, a switch (SPST) to the connector JA. A coaxial cable then connects PC130-W1 to PC130-W2."], "jumps": ["P13110", "P13090"]}, {"id": "P13110", "text": ["Now that it has entered PC130-W2, it goes through the card and out a wire connected to PC130-W3.  The path then goes through S1 (PC130-W3) and all the way back to PC130-W1 through the wires, connectors and PCB solder runs.", "Now that it has entered PC130-W2, it goes through the card and out a wire connected to PC130-W3. The path then goes through S1 (PC130-W3) and all the way back to PC130-W1 through the wires, connectors and PCB solder runs."], "jumps": ["P13120", "P13090", "PC130"]}, {"id": "P13120", "text": ["The path turns around goes through PC130-W1 JB1, through PC130-W2 JD2 and JE3 reenters PC130-W3 JF3.  Within\nPC130-W3 it goes through JG3 to S2.", "The path turns around goes through PC130-W1 JB1, through PC130-W2 JD2 and JE3 reenters PC130-W3 JF3. Within PC130-W3 it goes through JG3 to S2."], "jumps": ["P13130", "P13090"]}, {"id": "P13130", "text": ["The same circuit path is repeated to the top of S3 (PC130-W3). After going through S3, current is routed all the way back to PC130-W1 and terminates at PC130-W1 JB5 (GND)."], "jumps": ["P13140", "P13090", "PC130"]}, {"id": "P13140", "text": ["You can see that this wire assembly is a series circuit.  Let's start the experiment.", "You can see that this wire assembly is a series circuit. Let's start the experiment."], "jumps": ["P13150", "P13090"]}, {"id": "P13150", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13090"]}, {"id": "P13160", "text": ["2.  Carefully plug the circuit cards into these Test Console PC             positions:", "PC130-W1 on the PC1 connectors PC130-W2 on the PC2 connectors PC130-W3 on the PC3 connectors PC130-W3 on the PC3 connectors PC130-W3 on the PC3 connectors", "2. Carefully plug the circuit cards into these Test Console PC positions: PC130-W1 on the PC1 connectors PC130-W2 on the PC2 connectors PC130-W3 on the PC3 connectors", "EXPERIMENT CARD PLACEMENT - PC130-W1 shown in PC1 position. PC130-W2 shown in PC2 position. PC130-W3 shown in PC3 position."], "jumps": ["P13168", "P13165"]}, {"id": "P13168", "text": ["3.  Connect all the plugs into the jacks of the circuit cards,                     including the coaxial cable b\u000f\u0000\u0005\u0000\u0016g\u0000\u0000T\u0000\u0000\u0000xcZ\u0000\u001e\u000b\u0000\u0000\u0092\u0002i\u0000\u001e\u000b\u0000\u0000X<y\u0000\u001e\u000b\u0000\u0000|\u00f7\u008e\u0000\u001e\u000b\u0000\u00006\u00af\u0090\u0000$\u000b\u0000\u0000\u00fe\u00ba\u0090\u0000\u00d4\u0005\u0000\u0000\u00d0\u0099\u009b\u0000 \u000b\u0000\u0000\u00b2\u00a5\u00a4\u0000 \u000b\u0000\u0000\u00feV\u00b5\u0000 \u000b\u0000\u0000l\u000f\u00c9\u0000 \u000b\u0000\u0000\u00f9\u00ff\u00cf\u0000\u00f0\f\u0000\u0000\u0085\u001e\u00d0\u0000\u0088\u0004\u0000\u0000\u00db/\u00d0\u0000z\t\u0000\u0000\u00ef\u0092\u00d0\u0000\u0011m/\u00ff\u00ef\u0092\u00d0\u0000\u0011m/\u00ff2001\\Lessons\\nc81base.sbk\u0000\u0000\u0000\u0000\u0000\u0000\u0000", "3. Connect all the plugs into the jacks of the circuit cards, including the coaxial cable b"], "jumps": ["P13170", "P13160"]}, {"id": "P13170", "text": ["4.  Press enter to set: Positive Supply Voltage -  5\n                                         PC1 DC Power Switch    -  ON", "For normal operation place the PC card switches in the following positions:      PC130-W1                     PC130-W3 \n                         S1 - Right (closed)      S1 - Up (closed) \n                                                                  S2 - Up (closed)\n                                                                  S3 - Up (closed)", "4. Press enter to set: Positive Supply Voltage - 5 PC1 DC Power Switch - ON", "For normal operation place the PC card switches in the following positions: PC130-W1 PC130-W3 S1 - Right (closed) S1 - Up (closed) S2 - Up (closed) S3 - Up (closed)"], "jumps": ["P13168", "P13190", "P"]}, {"id": "P13190", "text": ["The function check is performed by opening and closing the switches in the wiring assembly circuit.  The LED, DS1, should illuminate on PC130-W1 when all the switches are closed. Placing any one of the switches open, should prevent DS1 from illuminating.", "The function check is performed by opening and closing the switches in the wiring assembly circuit. The LED, DS1, should illuminate on PC130-W1 when all the switches are closed. Placing any one of the switches open, should prevent DS1 from illuminating."], "jumps": ["P13200", "P13180"]}, {"id": "P13200", "text": ["Place S1 (PC130-W1) to the left (open).  The light, DS1, should be turned OFF.", "Place S1 (PC130-W1) to the left (open). The light, DS1, should be turned OFF."], "jumps": ["P13210", "P13180", "PC130"]}, {"id": "P13210", "text": ["Place S1 (PC130-W1) to the right (closed). The light, DS1, should illuminate."], "jumps": ["P13220", "P13180", "PC130"]}, {"id": "P13220", "text": ["Place S1 on PC130-W3 in the down (open) position.  DS1 \n(PC130-W1) should turn OFF.", "Place S1 on PC130-W3 in the down (open) position. DS1 (PC130-W1) should turn OFF."], "jumps": ["P13221", "P13180", "PC130"]}, {"id": "P13221", "text": ["Place S1 on PC130-W3 in the up (closed) position and DS1 (PC130-W1) should turn ON."], "jumps": ["P13230", "P13180", "PC130"]}, {"id": "P13230", "text": ["Place S2 on PC130-W3 in the down position.  DS1 (PC130-W1) should turn OFF.", "Place S2 on PC130-W3 in the down position. DS1 (PC130-W1) should turn OFF."], "jumps": ["P13231", "P13180", "PC130"]}, {"id": "P13231", "text": ["Place S2 on PC130-W3 in the up position and DS1 should be ON."], "jumps": ["P13240", "P13180"]}, {"id": "P13240", "text": ["Place S3 on PC130-W3 in the down position.  DS1 (PC130-W1) should turn OFF.", "Place S3 on PC130-W3 in the down position. DS1 (PC130-W1) should turn OFF."], "jumps": ["P13241", "P13180", "PC130"]}, {"id": "P13241", "text": ["Place S3 on PC130-W3 in the up position and DS1 (PC130-W1) should turn ON."], "jumps": ["P13250", "P13180", "PC130"]}, {"id": "P13250", "text": ["Remember, that during your function check when ANY of the switches were open DS1 was OFF.  DS1 only illuminated when ALL the switches were closed.  This indicates normal circuit operation.", "In this wiring and connector assembly, since it is a series circuit, if an open occurs, it is like opening a switch, the lamp DS1 will      not illuminate.  The path to ground has been broken and current will not flow through the resistor or LED.", "Remember, that during your function check when ANY of the switches were open DS1 was OFF. DS1 only illuminated when ALL the switches were closed. This indicates normal circuit operation.", "In this wiring and connector assembly, since it is a series circuit, if an open occurs, it is like opening a switch, the lamp DS1 will not illuminate. The path to ground has been broken and current will not flow through the resistor or LED."], "jumps": ["P13260", "P13180", "P13280"]}, {"id": "P13280", "text": ["The computer will place a fault in the circuit when you continue. The functional test will help you find the problem."], "jumps": ["P13260"]}, {"id": "P13300", "text": ["Check your set-up and perform the functional check.", "1. All cables are connected. 2. DC positive supply is set to 5 VDC. 3. PC1 DC power is ON. 4. S1 (PC130-W1) is placed to the right. 5. S1 through S3 (PC130-W3) are placed to the up position.", "Check your set-up and perform the functional check. RAPHICS TEXT) 1. All cables are connected. 2. DC positive supply is set to 5 VDC. 3. PC1 DC power is ON. 4. S1 (PC130-W1) is placed to the right. 5. S1 through S3 (PC130-W3) are placed to the up position."], "jumps": ["P13310", "PC130"]}, {"id": "P13310", "text": ["Is the circuit operating correctly?", "Is the circuit operating correctly?........................"], "jumps": ["P13300", "P13315"]}, {"id": "P13311", "text": [], "jumps": []}, {"id": "P13312", "text": ["Check the following settings:", "1. All cables are connected. 2. DC positive supply is set to 5 VDC. 3. DC power is on at the PC1 position. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up position.", "Check the following settings: RAPHICS TEXT)1. All cables are connected. 2. DC positive supply is set to 5 VDC. 3. DC power is on at the PC1 position. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up position."], "jumps": ["PC130"]}, {"id": "P13315", "text": ["Functional Check 1. Place switches to the following positions: S1 (PC130-W1) to the right, S1 (PC130-W3) up, S2 (PC130-W3) up, S3 (PC130-W3) up 2. Ensure that PC1 DC Power is ON. 3. DS1 (PC130-W1) should illuminate. 4. Check switch operation: S1 on PC130-W1 to the left should turn DS1 OFF. S1 on PC130-W1 to the right should illuminate DS1. S1, S2, or S3 on PC130-W3 placed down, turn DS1 OFF. S1, S2 and S3 on PC130-W3 are ALL placed up DS1 ON.", "SET-UP - Ensure that your equipment is set correctly then perform the functional check."], "jumps": ["P13310", "PC130"]}, {"id": "P13320", "text": ["Since DS1 is off, completing the functional check is not necessary.  What is the most likely cause?", "Since DS1 is off, completing the functional check is not necessary. What is the most likely cause?"], "jumps": ["P13310"]}, {"id": "P13321", "text": [], "jumps": []}, {"id": "P13322", "text": ["Since DS1 (PC130-W1) is off, the circuit path to ground has been interrupte .", "5. Press enter to set: PC1 DC Power Switch - OFF..........................", "6. On PC-W1 set switch S1 to the left. This will isolate the input components from the rest of the circuit..s s s.", "Set your multimeter to measure resistance. Place one multimeter lead on JA1 and the other on JB5. This will check continuity through the whole connector wiring assembly. We should read infinity because we already suspect an open."], "jumps": ["P13360", "P13430", "P13370", "P13435", "P13380"]}, {"id": "P13435", "text": ["Leave one lead on JA1 (PC130-W1) and move the other to JB4 (PC130-W1) and check the resistance.", "Leave one lead on JA1 (PC130-W1) and move the other to JB4 (PC130-W1) and check the resistance. #"], "jumps": ["P13440", "P13430", "PC130"]}, {"id": "P13440", "text": ["What is your resistance measurement?", "What is your resistance measurement?......................."], "jumps": ["P13430"]}, {"id": "P13441", "text": ["Ensure that you have your meter set to measure resistance and that you have the multimeter test leads on JA1 and JB4 of the PC130-W1card.", "The high resistance measured between JA1 and JB4 indicate that the open is between JA1 and JB4.", "Ensure that you have your meter set to measure resistance and that you have the multimeter test leads on JA1 and JB4 of the PC130-W1card......"], "jumps": ["P13455", "P13440"]}, {"id": "P13455", "text": ["Let's move up the circuit and make a continuity check between JA1 and JB3.  Place one meter lead on JA1 and the other on JB3.", "Let's move up the circuit and make a continuity check between JA1 and JB3. Place one meter lead on JA1 and the other on JB3."], "jumps": ["P13460", "P13450"]}, {"id": "P13460", "text": ["What resistance did you measure?", "What resistance did you measure?d.........................."], "jumps": ["P13450"]}, {"id": "P13461", "text": ["Ensure that you have the multimeter leads on JA1 and JB3. Check the multimeter and make sure that it is set to measure resistance.", "You have just lead is placed on JF5 PC130-W3 or JF6 PC130-W3, the other lead is on JB5 (PC130-W1), S3 is down (open) and that you have disconnected all the cables and connectors.", "This reading tells us that the wires are not shorted to ground.", "Ensure that, your one lead is placed on JF5 PC130-W3 or JF6 PC130-W3, the other lead is on JB5 (PC130-W1), S3 is down (open) and that you have disconnected all the cables and connectors.../"], "jumps": ["P14450", "P14430"]}, {"id": "P14450", "text": ["Now that you have found the problem, you would repair or replace the bad wire and perform the functional test."], "jumps": ["P14460", "P14440"]}, {"id": "P14460", "text": ["Remove the multimeter leads from the circuit and reconnect all the circuit card cabling.  When you continue the computer will repair the fault.", "Remove the multimeter leads from the circuit and reconnect all the circuit card cabling. When you continue the computer will repair the fault."], "jumps": []}, {"id": "P14465", "text": ["6.  Press enter to set: PC1 DC Power Switch - ON", "6. Press enter to set: PC1 DC Power Switch - ON..........................."], "jumps": []}, {"id": "P14470", "text": ["Perform the functional check.  Does the circuit operate correctly?", "Perform the functional check. Does the circuit operate correctly?"], "jumps": []}, {"id": "P14471", "text": [], "jumps": []}, {"id": "P14472", "text": ["Ensure that you're set-up is correct and perform the functional check.", "Remember, a Short occurs when there are extra or incorrect paths for current flow to follow.  This fault is generally identified by resistance measurements that indicate continuity in places where there should not be continuity.", "1. All cables are connected. 2. DC positive supply is set to 5 VDC. 3. DC power is on at the PC1 position. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up position...", "Ensure that you're set-up is correct and perform the functional check. (GRAPHICS TEXT) 1. All cables are connected. 2. DC positive supply is set to 5 VDC. 3. DC power is on at the PC1 position. 4. Ensure that S1 (PC130-W1) is placed right and all the switches on the PC130-W3 are in the up", "Remember, a Short occurs when there are extra or incorrect paths for current flow to follow. This fault is generally identified by resistance measurements that indicate continuity in places where there should not be continuity."], "jumps": ["P14470"]}, {"id": "P14500", "text": ["1.  Remove the printed circuit cards PC130-W1, PC130-W2 and           PC130-W3 from the console and store it in its designated                area. \n2.  Shut off the multimeter.", "1. Remove the printed circuit cards PC130-W1, PC130-W2 and PC130-W3 from the console and store it in its designated area. 2. Shut off the multimeter."], "jumps": ["P14510"]}, {"id": "P14510", "text": ["3.  Set the Test Console Power OFF.", "3. Set the Test Console Power OFF. OFF.FF................................."], "jumps": ["P14500"]}, {"id": "P14910", "text": ["This completes the experiment on SHORTED WIRE.", "This completes the experiment on SHORTED WIRE.TITLE........"], "jumps": ["P2001", "P14510"]}, {"id": "P15040", "text": ["In this exercise we will use a multimeter to make continuity, voltage and resistance checks to isolate a changed value in a wiring circuit."], "jumps": ["P15050", "P3001"]}, {"id": "P15050", "text": ["Let's discuss normal operation of the wiring and connector assembly used in this exercise.", "The three PC positions are connected making a series circuit. The wiring is routed through four switches, any one of which can turn DS1 OFF."], "jumps": ["P15060", "P15040", "P15070", "P15050"]}, {"id": "P15070", "text": ["Let's examine the circuit.  The +5 VDC enters PC130-W1 and travels through a resistor, a light emitting diode, a switch (SPST) to the connector JA.  A coaxial cable then connects PC130-W1 to PC130-W2.", "Let's examine the circuit. The +5 VDC enters PC130-W1 and travels through a resistor, a light emitting diode, a switch (SPST) to the connector JA. A coaxial cable then connects PC130-W1 to PC130-W2."], "jumps": ["P15080", "P15060"]}, {"id": "P15080", "text": ["Now that it has entered PC130-W2, it goes through the card and out a wire connected to PC130-W3.  The path then goes through S1 (PC130-W3) and all the way back to PC130-W1 through the wires, connectors and Printed Circuit Board (PCB) solder runs.", "Now that it has entered PC130-W2, it goes through the card and out a wire connected to PC130-W3. The path then goes through S1 (PC130-W3) and all the way back to PC130-W1 through the wires, connectors and Printed Circuit Board (PCB) solder runs."], "jumps": ["P15090", "P15060", "PC130", "PCB"]}, {"id": "P15090", "text": ["The path turns around goes through PC130-W1 JB1, through PC130-W2 JD2 and JE3 reenters PC130-W3 JF3.  Within \nPC130-W3 it goes through JG3 to S2.", "The path turns around goes through PC130-W1 JB1, through PC130-W2 JD2 and JE3 reenters PC130-W3 JF3. Within PC130-W3 it goes through JG3 to S2."], "jumps": ["P15100", "P15060"]}, {"id": "P15100", "text": ["The same circuit path is repeated to the top of S3 (PC130-W3). After going through S3, current is routed all the way back to PC130-W1 and terminates at PC130-W1 JB5 (GND)."], "jumps": ["P15110", "P15060", "PC130"]}, {"id": "P15110", "text": ["You can see that this wire assembly is a series circuit.  Let's start the experiment.", "You can see that this wire assembly is a series circuit. Let's start the experiment."], "jumps": ["P15120", "P15060"]}, {"id": "P15120", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P15060"]}, {"id": "P15130", "text": ["2.  Carefully plug the circuit cards into these Test Console PC              positions:", "PC130-W1 on the PC1 connectors PC130-W2 on the PC2 connectors PC130-W3 on the PC3 connectors PC130-W3 on the PC3 connectors PC130-W3 on the PC3 connectors", "2. Carefully plug the circuit cards into these Test Console PC positions: PC130-W1 on the PC1 connectors PC130-W2 on the PC2 connectors PC130-W3 on the PC3 connectors"], "jumps": ["P15138"]}, {"id": "P15138", "text": ["3.  Connect all the plugs into the jacks of the circuit cards,                     including the coaxial cable between PC130-W1 and \n      PC130-W2.  Ensure that S1 on PC130-W1 is to the left and \n     S1 through S3 on PC130-W3 are in the up position.", "4. Set your multimeter to measure resistance and place the leads\n    between JA1 and JB5.  You should measure continuity or a\n    low resistance of approximately 2 W.  This is the normal\n    resistance reading for the connector assembly.", "3. Connect all the plugs into the jacks of the circuit cards, including the coaxial cable between PC130-W1 and PC130-W2. Ensure that S1 on PC130-W1 is to the left and S1 through S3 on PC130-W3 are in the up position.", "4. Set your multimeter to measure resistance and place the leads between JA1 and JB5. You should measure continuity or a low resistance of approximately 2 W. This is the normal resistance reading for the connector assembly...... position."], "jumps": ["P15139", "P15130", "P15140", "P15138"]}, {"id": "P15140", "text": ["5.  Press enter to set: Positive Supply Voltage  -  5 \n                                         PC1 DC Power Switch     - ON", "For normal operation place the PC card switches in the following positions:      PC130-W1                      PC130-W3\n                         S1 - Right (closed)      S1 - Up (closed)  \n                                                                  S2 - Up (closed)  \n                                                                  S3 - Up (closed)", "5. Press enter to set: Positive Supply Voltage - 5 PC1 DC Power Switch - ON", "For normal operation place the PC card switches in the following positions: PC130-W1 PC130-W3 S1 - Right (closed) S1 - Up (closed) S2 - Up (closed) S3 - Up (closed)"], "jumps": ["P15139", "P15160"]}, {"id": "P15160", "text": ["The function check is performed by opening and closing the switches in the wiring assembly circuit.  The LED, DS1, should illuminate on PC130-W1 when all the switches are closed. Placing any one of the switches open, should prevent DS1 from illuminating.", "The function check is performed by opening and closing the switches in the wiring assembly circuit. The LED, DS1, should illuminate on PC130-W1 when all the switches are closed. Placing any one of the switches open, should prevent DS1 from illuminating."], "jumps": ["P15170", "P15150"]}, {"id": "P15170", "text": ["Place S1 (PC130-W1) to the left (open).  The light, DS1, should be turned OFF.", "Place S1 (PC130-W1) to the left (open). The light, DS1, should be turned OFF."], "jumps": ["P15180", "P15150", "PC130"]}, {"id": "P15180", "text": ["Place S1 (PC130-W1) to the right (closed).  The light, DS1, should illuminate.", "Place S1 (PC130-W1) to the right (closed). The light, DS1, should illuminate."], "jumps": ["P15190", "P15150", "PC130"]}, {"id": "P15190", "text": ["Place S1 on PC130-W3 in the down (open) position.  DS1\n(PC130-W1) should turn OFF.", "Place S1 on PC130-W3 in the down (open) position. DS1 (PC130-W1) should turn OFF."], "jumps": ["P15191", "P15150", "PC130"]}, {"id": "P15191", "text": ["Place S1 on PC130-W3 in the up (closed) position and DS1 (PC130-W1) should turn ON."], "jumps": ["P15200", "P15150", "PC130"]}, {"id": "P15200", "text": ["Place S2 on PC130-W3 in the down position.  DS1 (PC130-W1) should turn OFF.", "Place S2 on PC130-W3 in the down position. DS1 (PC130-W1) should turn OFF."], "jumps": ["P15201", "P15150", "PC130"]}, {"id": "P15201", "text": ["Place S2 on PC130-W3 in the up position and DS1 should be ON."], "jumps": ["P15210", "P15150"]}, {"id": "P15210", "text": ["Place S3 on PC130-W3 in the down position.  DS1 (PC130-W1) should turn OFF.", "Place S3 on PC130-W3 in the down position. DS1 (PC130-W1) should turn OFF."], "jumps": ["P15211", "P15150", "PC130"]}, {"id": "P15211", "text": ["Place S3 on PC130-W3 in the up position and DS1 (PC130-W1) should turn ON."], "jumps": ["P15220", "P15150", "PC130"]}, {"id": "P15220", "text": ["Remember, that during your function check when ANY of the switches were open DS1 was OFF.  DS1 only illuminated when ALL the switches were closed.  This indicates normal circuit operation.", "In this wiring and connector assembly, since it is a series circuit, if there is a changed value, the lamp's intensity will either          increase or decrease.", "Remember, that during your function check when ANY of the switches were open DS1 was OFF. DS1 only illuminated when ALL the switches were closed. This indicates normal circuit operation.", "In this wiring and connector assembly, since it is a series circuit, if there is a changed value, the lamp's intensity will either increase or decrease."], "jumps": ["P15230", "P15150", "P15240"]}, {"id": "P15240", "text": ["If circuit resistance is increased DS1 becomes dim.  If resistance is decreased DS1 becomes brighter.", "If circuit resistance is increased DS1 becomes dim. If resistance is decreased DS1 becomes brighter."], "jumps": ["P15250", "P15230"]}, {"id": "P15250", "text": ["Let's use the functional test to help us detect a changed value."], "jumps": ["P15260", "P15230"]}, {"id": "P15260", "text": ["The computer will place a fault in the circuit when you continue.", "The computer will place a fault in the circuit when you continue..........."], "jumps": ["P15230"]}, {"id": "P15270", "text": ["Ensure that the following settings have been completed, then perform the functional check.", "1. All cables are connected. 2. DC positive supply is set to 5 VDC. 3. PC1 DC power is ON. 4. S1 (PC130-W1) is placed to the right. 5. S1 through S3 (PC130-W3) are placed to the up position. in the up position.", "Ensure that the following settings have been completed, then perform the functional check. (GRAPHICS TEXT)1. All cables are connected. 2. DC positive supply is set to 5 VDC. 3. PC1 DC power is ON. 4. S1 (PC130-W1) is placed to the right. 5. S1 through S3 (PC130-W3) are placed to the up"], "jumps": ["P15280", "PC130"]}, {"id": "P15280", "text": ["Is the circuit operating correctly?", "DS1 stays on when any of the PC card switches are set to off (open))", "Is the circuit operating correctly?........................"], "jumps": ["P15270"]}, {"id": "P15281", "text": [], "jumps": []}, {"id": "P15282", "text": ["Check your set-up and perform the functional test again.", "After completing the functional test your indications were normal, however, DS1 is dimly lit.  Let's see what could cause this symptom.", "Functional Check 1. Place switches to the following positions: S1 (PC130-W1) to the right, S1 (PC130-W3) up, S2 (PC130-W3) up, S3 (PC130-W3) up 2. Ensure PC1 DC Power is on. 3. DS1 (PC130-W1) should illuminate. 4. Check switch operation: S1 (PC130-W1) left = DS1 off, then right = on S1 (PC130-W3) down = DS1 off, then up = on S2 (PC130-W3) down = DS1 off, then up = on S3 (PC130-W3) down = DS1 off, then up = onff, then up = onnnnnnn", "Check your set-up and perform the functional test again. RAPHICS TEXT) Functional Check 1. Place switches to the following position. S1 (PC130-W1) to the right, S1 (PC130-W3) up, S2 (PC130-W3) up, S3 (PC130-W3) up 2. Depress the DC Power button on the PC1 position. 3. DS1 (PC130-W1) should illuminate.", "After completing the functional test your indications were normal, however, DS1 is dimly lit. Let's see what could cause this symptom."], "jumps": ["P15300", "P15280"]}, {"id": "P15300", "text": ["An open or a short would give you a clear indication of the fault when making resistance measurements.  Changed values however, will increase or decrease resistance in the circuit.", "The first measurement we should make is to check the input voltage.  This is also the first step used when checking for opens.", "An ope
