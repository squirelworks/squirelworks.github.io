<script>
const book = {"title": "93955602", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Title: DC SHUNT FIELD MOTORSdf asd fasfd asdf asdf sadf", "Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe the operating characteristics of a DC Shunt Field Motor. w Describe the effects of a load on a DC Shunt Field Motor. w Describe the methods used to control speed in a DC Shunt Field Motor.", "1. DC Shunt Field Motor Characteristics"], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about the DC Shunt Field motor."], "jumps": ["P301", "P410"]}, {"id": "P410", "text": ["You will learn how to calculate many DC shunt field motor circuit values."], "jumps": ["P400", "P420"]}, {"id": "P440", "text": ["Let's begin the lesson on DC SHUNT FIELD MOTORS..........................."], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The DC Shunt Field motor is generally used for industrial applications."], "jumps": ["P1001", "P1030"]}, {"id": "P1030", "text": ["In this lesson, you will explore the characteristics of this type of motor."], "jumps": ["P1020", "P1035"]}, {"id": "P1035", "text": ["As you know, all motors share certain characteristics......"], "jumps": ["P1020", "P1038"]}, {"id": "P1038", "text": ["Each of these characteristics can be measured or calculated."], "jumps": ["P1035", "P1040"]}, {"id": "P1040", "text": ["Let's begin by calculating torque in a shunt field motor..."], "jumps": ["P1035", "P1050"]}, {"id": "P1050", "text": ["I = Armature Current I = Field Coil Current K = Physical Characteristics", "There is a relatively simple formula for calculating the torque of a Shunt motor."], "jumps": ["P1040", "P1060"]}, {"id": "P1060", "text": ["The equation states that the output torque of a motor is the product of the armature current (I ), field coil current (I ) and the physical characteristics of the field (K)."], "jumps": ["P1050", "P1070"]}, {"id": "P1070", "text": ["Throughout this lesson and future lessons assume that K has a value of 1. This will simplify calculations."], "jumps": ["P1050", "P1080"]}, {"id": "P1080", "text": ["Meters depending on the system of measurement used."], "jumps": ["P1050"]}, {"id": "P1085", "text": ["Let's examine the effects of the second characteristic of DC shunt field motors, CEMF."], "jumps": ["P1510", "P1090"]}, {"id": "P1090", "text": ["As motor shaft speed increases, CEMF increases. They are directly proportional."], "jumps": ["P1085", "P1100"]}, {"id": "P1095", "text": ["The polarity of an induced electromagnetic force is such that it sets up a current, the magnetic field of which always opposes the change in the existing magnetic field.", "CEMF- CEMF is short for \"Counter Electromotive Force\" and is defined in terms of LENZ'S LAW. CEMF can best be visualized as an opposite polarity battery placed in series to the armature or in parallel to the armature voltage (V ) of a DC shunt field motor."], "jumps": []}, {"id": "P1100", "text": ["CEMF opposes the original applied voltage that induces motor action."], "jumps": ["P1090", "P1110"]}, {"id": "P1110", "text": ["CEMF acts as another voltage source opposing E .........."], "jumps": ["P1100", "P1120"]}, {"id": "P1120", "text": ["Because of CEMF, I does not equal the applied voltage divided by the resistance of the armature."], "jumps": ["P1110", "P1130"]}, {"id": "P1130", "text": ["I equals the applied voltage minus CEMF divided by the resistance of the armature."], "jumps": ["P1110", "P1140"]}, {"id": "P1140", "text": ["As stated before, measuring CEMF inside the motor is impractical."], "jumps": ["P1110", "P1520"]}, {"id": "P1150", "text": ["Power Out = Speed x Torque x (0.1047) = Ft Lbs Sec (RPM) x (Ft Lbs) x (constant) =====nt) ==========", "Output power is equal to speed times torque times the constant (0.1047)."], "jumps": ["P1160", "P1730"]}, {"id": "P1160", "text": ["Speed is easily measured and torque is calculated as before."], "jumps": ["P1150", "P1170"]}, {"id": "P1170", "text": ["Notice the formulas indicate that speed (RPM) and shaft rotation (Torque) must occur before a motor supplies mechanical power."], "jumps": ["P1160", "P1183"]}, {"id": "P1183", "text": ["What is the output power of this DC Shunt Motor?..........."], "jumps": ["P1186", "P1170"]}, {"id": "P1184", "text": [], "jumps": []}, {"id": "P1185", "text": ["Your answer is incorrect, remember the formula for Output Power is: Power Out = (Torque) (Speed) (0.1047)"], "jumps": []}, {"id": "P1186", "text": ["OUTPUT POWER (W)-To find output power, find torque first: Torque = I x I x K (Assume K = 1) After finding torque, multiply this value times the speed (RPM) and the constant (0.1047): Power Out = (Torque) (Speed) (0.1047)"], "jumps": []}, {"id": "P1190", "text": ["Motor speed and torque are inversely proportional. As a result, only one combination of the two will give maximum output power."], "jumps": ["P1183", "P1200"]}, {"id": "P1200", "text": ["Now, let's see the effects of a load on Power In and Power Out."], "jumps": ["P1190", "P1210"]}, {"id": "P1210", "text": ["As the load on a motor increases, the speed (RPM) decreases."], "jumps": ["P1200", "P1220"]}, {"id": "P1220", "text": ["As RPM decreases, CEMF also decreases. This relationship increases Torque as well as I ."], "jumps": ["P1210", "P1230"]}, {"id": "P1230", "text": ["Since I increases, I increases, power In also increases. Pin = E x I"], "jumps": ["P1220", "P1240"]}, {"id": "P1240", "text": [], "jumps": ["P1220", "P1245"]}, {"id": "P1245", "text": ["Also, since torque increases (even though RPM decreases), Power out increases. P = (Torque) (Speed) (0.1047) = Ft Lbs/Secc"], "jumps": ["P1220", "P1250"]}, {"id": "P1260", "text": ["Increased Load causes: RPM to. . . . . . . . . . . . . . . . . . . . .Decrease CEMF to . . . . . . . . . . . . . . . . . . . Decrease I to . . . . . . . . . . . . . . . . . . . . . . . Increase I & Torque to . . . . . . . . . . . . . . Increase Pin & Pout to . . . . . . . . . . . . . . . Increase", "Remember:iscussion text here..............................."], "jumps": ["P1220", "P1265"]}, {"id": "P1265", "text": ["The last important element of DC shunt motors is speed control."], "jumps": ["P1260", "P1270"]}, {"id": "P1270", "text": ["Varying applied voltage changes current through the armature and the field. This will cause RPM to change."], "jumps": ["P1265", "P1280"]}, {"id": "P1280", "text": [], "jumps": ["P1265", "P1290"]}, {"id": "P1290", "text": ["Resistors can also be used to lower the current through the field coil."], "jumps": ["P1265", "P1300"]}, {"id": "P1300", "text": ["This will decrease the strength of the field coil, decreasing RPM."], "jumps": ["P1290", "P1310"]}, {"id": "P1310", "text": ["This method is called shunt field control."], "jumps": ["P1290", "P1320"]}, {"id": "P1320", "text": ["In reference to the schematic, by increasing the resistance of R1, I will decrease. This will cause motor RPM to decrease."], "jumps": ["P1290", "P1330"]}, {"id": "P1330", "text": ["This can be seen by applying Ohms law to the circuit..."], "jumps": ["P1290"]}, {"id": "P1350", "text": ["What type of speed control is used in this DC Shunt Motor?."], "jumps": ["P1290"]}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1352", "text": ["Armature speed control is used, but how about the use of R1."], "jumps": []}, {"id": "P1353", "text": ["Shunt Field speed control is used, but how about the variable E supply.."], "jumps": []}, {"id": "P1400", "text": ["Calculating torque is accomplished by determining the currents in the armature and field circuits."], "jumps": ["P1080", "P1410"]}, {"id": "P1410", "text": ["One method is to measure current using an ammeter."], "jumps": ["P1400", "P1420"]}, {"id": "P1420", "text": ["What is torque in this DC Shunt motor?....................."], "jumps": ["P1400"]}, {"id": "P1421", "text": [], "jumps": []}, {"id": "P1422", "text": ["You added I and I . Torque is the product of coil currents."], "jumps": []}, {"id": "P1423", "text": ["You divided I by I . Torque is the product of coil currents.", "Since it is difficult to get inside most motor cases, measuring I and I is normally impractical.."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["An alternate method for determining I and I is to use Ohm's Law and measure applied voltage and total current."], "jumps": ["P1430", "P1450"]}, {"id": "P1450", "text": ["As you can see, E and I can be easily measured outside the motor."], "jumps": ["P1440", "P1460"]}, {"id": "P1460", "text": ["The field current can be calculated using the applied voltage and the resistance of the field coil."], "jumps": ["P1440", "P1470"]}, {"id": "P1470", "text": ["The resistance of the field coil is normally given in the motor's specifications. However, you will measure the resistance in the experiment."], "jumps": ["P1440", "P1480"]}, {"id": "P1480", "text": ["Ohm's Law can be applied because the Field Coil has no inductive reactance when DC voltage is applied."], "jumps": ["P1440", "P1490"]}, {"id": "P1490", "text": ["What is I in this DC Shunt motor?........................"], "jumps": ["P1440"]}, {"id": "P1491", "text": [], "jumps": []}, {"id": "P1492", "text": ["Remember Ohm's Law: E I = R................................"], "jumps": []}, {"id": "P1500", "text": ["The only other quantity needed to calculate torque is I . Remember, K is considered to be 1."], "jumps": ["P1490", "P1510"]}, {"id": "P1510", "text": ["You would think that I is calculated the same as I . However, because of CEMF, I is calculated differently."], "jumps": ["P1500", "P1085"]}, {"id": "P1520", "text": ["The method used to determine I , at a set RPM, is to subtract I from I ."], "jumps": ["P1530", "P1110"]}, {"id": "P1530", "text": ["I = I + I so I = I - IF", "Remember, Kirchhoff's current law states that total current equals the sum of the branch currents."], "jumps": ["P1520", "P1540"]}, {"id": "P1540", "text": ["What is I in this DC Shunt motor?........................"], "jumps": ["P1530"]}, {"id": "P1541", "text": [], "jumps": []}, {"id": "P1542", "text": ["I = I + I so I = I - IIF", "Remember, Kirchhoff's current law states that total current equals the sum of the branch currents."], "jumps": []}, {"id": "P1550", "text": ["I = = 0.24A I = I - I = 0.5 - 0.24 = 0.26 Torque = I x I x K = 0.24 x 0.26 x 1 = 0.0624 Ft", "lbs . Decrease IA to . . . . . . . . . . . . . . . . . . . . . . . Increase IT & Torque to . . . . . . . . . . . . . . Increase Pin & Pout to . . . . . . . . . . . . . . . Increase", "As you have seen, measuring E and I is all that is needed to calculate Torque.."], "jumps": ["P1540", "P1560"]}, {"id": "P1560", "text": ["The last basic characteristic of DC shunt field motors is Speed."], "jumps": ["P1550", "P1570"]}, {"id": "P1570", "text": ["Recall that as speed increases, CEMF increases and torque decreases."], "jumps": ["P1560", "P1580"]}, {"id": "P1580", "text": ["The effect speed has on torque can be easily seen using the DC Shunt Motor schematic."], "jumps": ["P1590", "P1570"]}, {"id": "P1590", "text": ["As speed increases, CEMF increases. As a result, I decreases...."], "jumps": ["P1580", "P1600"]}, {"id": "P1600", "text": ["Torque equals I x I x K. If speed increases then torque decreases due to I decreasing."], "jumps": ["P1580", "P1610"]}, {"id": "P1610", "text": ["In other words, as speed increases, I decreases."], "jumps": ["P1580", "P1620"]}, {"id": "P1620", "text": ["As speed decreases, Torque increases (due to I increasing as CEMF decreases) and I increases."], "jumps": ["P1580", "P1630"]}, {"id": "P1630", "text": ["In a DC shunt motor, I is not affected by changes in speed."], "jumps": ["P1580", "P1640"]}, {"id": "P1640", "text": ["This is why DC Shunt Motors have a higher torque value at faster RPM than Series DC Motors.", "Another factor affecting speed is the LOAD................."], "jumps": ["P1580", "P1650", "P1660", "P1640"]}, {"id": "P1660", "text": ["As a load increases, RPM decreases........................."], "jumps": ["P1650", "P1670"]}, {"id": "P1670", "text": ["As RPM decreases, CEMF decreases, increasing torque."], "jumps": ["P1660", "P1672"]}, {"id": "P1672", "text": ["The only new concept is the effect of a load on RPM. All other relationships remain the same."], "jumps": ["P1660", "P1675"]}, {"id": "P1680", "text": ["% Efficiency = x 100", "Now, let's talk about POWER. Remember: wer Out % Efficiency = x 100 Power In", "In a DC Shunt Motor, Power In is electrical................"], "jumps": ["P1660", "P1690", "P1700", "P1680"]}, {"id": "P1700", "text": ["Calculating Power In is done by multiplying E times I ."], "jumps": ["P1690", "P1710"]}, {"id": "P1710", "text": ["What is the input power to this DC Shunt Motor?............"], "jumps": ["P1690"]}, {"id": "P1711", "text": [], "jumps": []}, {"id": "P1712", "text": ["Remember, power equals voltage times current...............", "In a DC Shunt Motor, Power Out is mechanical..............."], "jumps": ["P1150", "P1710"]}, {"id": "P1910", "text": ["This completes the information on SHUNT FIELD CHARACTERISTICS."], "jumps": ["P1350", "P1001"]}, {"id": "P1920", "text": ["1. Speed and CEMF are proportional in a DC Shunt Filed motor."], "jumps": ["P1001", "P1930"]}, {"id": "P1930", "text": ["2. Torque is inversely proportional to both speed and CEMF."], "jumps": ["P1920", "P1940"]}, {"id": "P1940", "text": ["I = Armature Current I = Field Coil Current K = Physical Characteristics", "3. Torque can be expressed as the product of the armature and shunt field currents."], "jumps": ["P1930", "P1950"]}, {"id": "P1950", "text": ["4. Torque is calculated by measuring E and I and knowing R .."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["Pout = Speed x Torque x (0.1047) = Ft Lbs/Sec (RPM) x (Ft lbs) x (0.1047) = Ft Lbs/Sec", "Lbs/Sec. RPM is measurable and torque is calculated by I , I and 0.1047."], "jumps": ["P1950", "P1970"]}, {"id": "P1970", "text": ["6. Power In can be expressed in the following formula. E and I are measurable."], "jumps": ["P1960", "P1980"]}, {"id": "P1980", "text": ["Characteristics of all Loaded Motors (1) Torque increases and Speed decreases (2) Power Out increases (3) Power Input increases", "7. All loaded motors exhibit three fundamental characteristics. acteristics of all Loaded Motors (1) Torque increases and Speed decreases (2) Power Out increases (3) Power Input increases"], "jumps": ["P1970", "P1999"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1980", "P1001"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["In a Shunt Field motor, output power is equal to _______"], "jumps": []}, {"id": "P10211", "text": ["Torque is equal to the product of the field current and _______"], "jumps": []}, {"id": "P10212", "text": [], "jumps": []}, {"id": "P10213", "text": [], "jumps": []}, {"id": "P10214", "text": [], "jumps": []}, {"id": "P10215", "text": ["CEMF is an induced voltage that opposes _______"], "jumps": []}, {"id": "P10216", "text": ["If motor speed increases but the applied voltage remains constant, all of the following are affected except _______"], "jumps": []}, {"id": "P10217", "text": [], "jumps": []}, {"id": "P10218", "text": ["Input power is equal to the product of total input current and _______ ;"], "jumps": []}, {"id": "P10219", "text": ["For circuit analysis, the shunt field coil can be replaced by what?"], "jumps": []}, {"id": "P10220", "text": [], "jumps": []}, {"id": "P10221", "text": ["If the total circuit current of a shunt field motor is 1 A, the applied voltage is 10 V and shunt field resistance is 100 W, what is the armature current (I )?"], "jumps": []}, {"id": "P10222", "text": ["Torque in a shunt field motor _______ due to a decreasing CEMF."], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the d let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
