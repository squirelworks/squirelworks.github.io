]}, {"id": "P3240", "text": ["6. Adjust the Positive Supply switch until the meter indicates 3.5 volts."], "jumps": []}, {"id": "P3222", "text": ["There should be 2 medium graduations between 10 and the needle's position. +"], "jumps": []}, {"id": "P3221", "text": [], "jumps": []}, {"id": "P3220", "text": ["How many medium graduations are between the 10 and the needle's position? Count the graduation the needle is on."], "jumps": []}, {"id": "P3210", "text": ["Notice the needle is not pointing at a number. The needle is between the 10 and 15 on the meter's scale."], "jumps": []}, {"id": "P3205", "text": ["TEST CONSOLE CONTROLS - Set the test console controls as indicated. Start second line here..", "1. Voltmeter Switch - Pos. 2. + Supply Control - 5 V 3. PC1 DC Switch - OFF", "1. Voltmeter Switch - Pos. 2. + Supply Control - 12 V . PC1 DC Switch - OFF"], "jumps": []}, {"id": "P3200", "text": ["5. Set the Positive Supply Voltage to 12. The test console's Voltmeter should indicate 12 Volts."], "jumps": []}, {"id": "P3197", "text": ["Your answer is still incorrect. You should have entered a value of approximately 15."], "jumps": []}, {"id": "P3192", "text": ["Count the number of medium graduations between 0 and the needle."], "jumps": []}, {"id": "P3191", "text": [], "jumps": []}, {"id": "P3190", "text": ["What number is the needle pointing to? ..............."], "jumps": ["P3192"]}, {"id": "P3185", "text": ["TEST CONSOLE CONTROLS - Set the test console controls as indicated. Start second line here...", "1. Voltmeter Switch - Pos. 2. + Supply Control - 5 V 3. PC1 DC Switch - OFF", "1. Voltmeter Switch - Pos. 2. + Supply Control - 15 V . PC1 DC Switch - OFF"], "jumps": []}, {"id": "P3180", "text": ["4. Set the Positive Supply Voltage to 15. The test console's Voltage Meter should indicate 15 Volts."], "jumps": []}, {"id": "P3160", "text": ["The shorter lines divide each volt into 0.5 volts."], "jumps": []}, {"id": "P3150", "text": ["The longer of the two lines divide the space between 0 and 5 into five equal parts. Each part equals 1 volt."], "jumps": []}, {"id": "P3140", "text": ["Between the large graduations are two smaller sized graduation lines. For example: between 0 and 5 there is a total of 9 lines."], "jumps": []}, {"id": "P3130", "text": ["There are six large graduations labeled 0, 5, 10, 15, 20, and 25."], "jumps": []}, {"id": "P3125", "text": ["GRADUATIONS - The graduations on a meter scale are like the graduations on a ruler scale. On the meter, each division equals an amount of voltage. On a ruler, each division equals an amount of distance."], "jumps": []}, {"id": "P3122", "text": ["Look at the meter. Notice the space between each number is divided by several lines. These lines are called graduations. ......................................."], "jumps": []}, {"id": "P3120", "text": ["Look at the meter. Notice the space between each number is divided by several lines. These lines are called graduations."], "jumps": []}, {"id": "P3110", "text": ["Look at the voltmeter on the test console. The DC voltmeter's needle moved from 0 to 5. The meter indicates that the power supply is supplying 5 Volts."], "jumps": []}, {"id": "P3105", "text": ["TEST CONSOLE CONTROLS - Set the test console controls as indicated. Start second line here.", "1. Voltmeter Switch - Pos. 2. + Supply Control - 5 V 3. PC1 DC Switch - OFF"], "jumps": []}, {"id": "P3100", "text": ["2. Set the Voltmeter switch to positive. 3. Set the Positive Supply Voltage to 5. The test console's voltmeter should indicate 5 volts."], "jumps": []}, {"id": "P3080", "text": ["1. Set the test console to its initial control settings.", "The initial control settings are performed at the beginning of every experiment to insure that Test Console switches are set properly. All power supplies are set to OFF. Select HELP for specific settings.....HELP for specific settings.", "The initial control settings are performed at the beginning of every experiment to insure that test console switches are set properly. All power supplies are set to OFF. Select HELP for specific settings...........................HELP for specific settings."], "jumps": []}, {"id": "P3070", "text": ["Let's begin by measuring voltage levels on the test console and reading the value."], "jumps": []}, {"id": "P3060", "text": ["The test console's voltmeter indicates the value of voltage produced by the console's power supplies."], "jumps": []}, {"id": "P3040", "text": ["This experiment demonstrates how to read a value on an analog and a digital multimeter. The test console's voltage meter is used to familiarize you with reading a meter's scale in relation to the position of the meter's needle."], "jumps": []}, {"id": "P3001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": []}, {"id": "P2970", "text": ["6. The input jacks connect the multimeter to the circuit."], "jumps": []}, {"id": "P2960", "text": ["5. The zero adjustment is used to set the meter's needle to zero before making a measurement."], "jumps": []}, {"id": "P2950", "text": ["4. The range switch is used to set the upper limit of the quantity to be measured."], "jumps": []}, {"id": "P2940", "text": ["3. The function switch is used to tell the meter what quantity you want to measure."], "jumps": []}, {"id": "P2930", "text": ["2. The display provides the visual indication of the quantity measured."], "jumps": []}, {"id": "P2920", "text": ["1. There are several functional sections on the multimeter."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on FUNCTIONAL SECTIONS. .."], "jumps": []}, {"id": "P2354", "text": ["The range switch is used to set the upper limit of the quantity measured."], "jumps": []}, {"id": "P2353", "text": ["The function switch is used to tell the meter what quantity you want to measure."], "jumps": []}, {"id": "P2351", "text": [], "jumps": []}, {"id": "P2350", "text": ["Which functional section presets the meter's needle? ..."], "jumps": []}, {"id": "P2345", "text": ["The zero adjustment is used to set the meter's needle to zero before making a measurement."], "jumps": []}, {"id": "P2344", "text": ["The range switch is used to set the upper limit of the quantity measured."], "jumps": []}, {"id": "P2341", "text": [], "jumps": []}, {"id": "P2340", "text": ["Which functional section connects the circuit to the multimeter?"], "jumps": []}, {"id": "P2320", "text": ["Input jacks and test leads allow you to connect the multimeter to the circuit."], "jumps": []}, {"id": "P2310", "text": ["The black test lead is connected to the common jack. This jack is also called the ground or reference jack."], "jumps": []}, {"id": "P2300", "text": ["The red test lead is moved to the 10A jack when large amounts of current are measured."], "jumps": []}, {"id": "P2290", "text": ["The red test lead is connected to the voltage, ohms and milliamp jack to measure voltage, resistance and current."], "jumps": []}, {"id": "P2280", "text": [], "jumps": []}, {"id": "P2270", "text": ["The input jacks are used to connect test leads to the multimeter."], "jumps": []}, {"id": "P2260", "text": ["The last section is Input Jacks. .."], "jumps": []}, {"id": "P2250", "text": ["Zero adjustments are used to manually \"zero\" the display. display."], "jumps": []}, {"id": "P2240", "text": ["The zero adjustment sets the analog meter's needle to zero before you make a measurement."], "jumps": []}, {"id": "P2230", "text": ["The next section is the Zero Adjustment. A digital multimeter does not have a zero adjustment.justment. This is because a digital meter does not have a needle to zero."], "jumps": []}, {"id": "P2220", "text": ["Some digital multimeters have automatic range selection that senses the value being measured and automatically sets the range."], "jumps": []}, {"id": "P2200", "text": ["For example, if you expect to measure a quantity of 100, the range selected should be set to a range higher than 100."], "jumps": []}, {"id": "P2190", "text": ["The range switch tells the meter how large the measurement will be and is always set higher than the value to be measured."], "jumps": []}, {"id": "P2180", "text": ["The next section is the Range Switch. ......"], "jumps": []}, {"id": "P2165", "text": ["You selected the function that measures AC voltage. Notice the label AC V at this position."], "jumps": []}, {"id": "P2164", "text": ["You selected the function that measures batteries. Notice the label BAT at this position."], "jumps": []}, {"id": "P2163", "text": ["You selected the function that measures current. Notice the Ampere symbol (A)."], "jumps": []}, {"id": "P2162", "text": ["You selected the function that measures resistance. Notice the word \"OHMS\"."], "jumps": []}, {"id": "P2161", "text": [], "jumps": []}, {"id": "P2160", "text": ["Where should the function switch be placed to measure DC voltage?"], "jumps": []}, {"id": "P2150", "text": ["If you measure resistance, set the function switch to ohms or W."], "jumps": []}, {"id": "P2140", "text": ["If you measure current, set the function switch to mA or A."], "jumps": []}, {"id": "P2130", "text": ["Before measuring a quantity, you must set the function switch to the correct position."], "jumps": []}, {"id": "P2120", "text": ["The function switch is used to tell the meter which electrical quantity you want to measure."], "jumps": []}, {"id": "P2110", "text": ["The next section is the Function Switch. ..........."], "jumps": []}, {"id": "P2100", "text": ["The display provides a visual way to see the quantities in an electrical circuit."], "jumps": []}, {"id": "P2090", "text": ["When the quantity being measured is current, the display indicates the value of current. Digital mulitmeters that do not have a range switch for current will identify the current value as mA or A."], "jumps": []}, {"id": "P2080", "text": ["If 5 volts is measured in the circuit, that value is seen on the display."], "jumps": []}, {"id": "P2070", "text": ["The meter's display shows values of voltage, current, and resistance measured in a circuit."], "jumps": []}, {"id": "P2060", "text": ["Let's start by seeing how the multimeter's Display is used."], "jumps": []}, {"id": "P2050", "text": ["Not all multimeters have the same number of functional sections. For example, an analog meter has a zero adjustment and a digital multimeter does not; however, both meters still measure voltage, current, and resistance. , voltage and resistance.voltage and resistance.resistance. one has their own specific mulitmeter design. However, all meters make the same measurements."], "jumps": []}, {"id": "P2040", "text": ["As you become a seasoned technician you will surely see many different types of multimeters. This makes it important for you to recognize the functional sections of a multimeter and know how to use them."], "jumps": []}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": []}, {"id": "P1950", "text": ["4. The digital meter uses a digital readout to indicate the measured value."], "jumps": []}, {"id": "P1940", "text": ["3. The analog meter uses a needle to indicate the measured value."], "jumps": []}, {"id": "P1930", "text": ["2. Multimeters have two types of display: ............"], "jumps": []}, {"id": "P1920", "text": ["1. A multimeter is a tool used to measure electrical quantities of:", "* Voltage * Current * Resistance * Multimeterrrrrrrrrrrrrrrrrrrrrrrrrrrrrn"], "jumps": []}, {"id": "P1910", "text": ["This completes the information on THE MULTIMETER. ......"], "jumps": []}, {"id": "P1210", "text": ["No matter which multimeter you use, the three quantities you can measure are:", "* Voltage tance nce * Multimeterrrrrrrrrrrrrrrrrrrrrrrrrrrrr", "* Current tance nce * Multimeterrrrrrrrrrrrrrrrrrrrrrrrrrrrr", "* Resistance tance nce * Multimeterrrrrrrrrrrrrrrrrrrrrrrrrrrrr"], "jumps": []}, {"id": "P1200", "text": ["Some meters are large and require 120 VAC to operate. These meters are easier to use in the laboratory."], "jumps": []}, {"id": "P1190", "text": ["Some meters are small and battery powered. They are portable and handy for the technician to use."], "jumps": []}, {"id": "P1180", "text": ["Both types of multimeters vary in size, shape and power requirements."], "jumps": []}, {"id": "P1172", "text": ["You selected the analog multimeter. Remember the digital multimeter does not use a needle in the display."], "jumps": []}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1170", "text": [], "jumps": []}, {"id": "P1160", "text": ["You should learn to use both types of multimeters."], "jumps": []}, {"id": "P1150", "text": ["The digital display uses numbers to show the value measured by the meter, like the time on the clock."], "jumps": []}, {"id": "P1140", "text": ["The digital meter has a display like a digital clock."], "jumps": []}, {"id": "P1120", "text": ["The analog meter uses a needle to indicate the measured values. Console. 7"], "jumps": []}, {"id": "P1110", "text": ["The major difference between the two meters is the type of display. One meter uses a needle (pointer) and the other a digital readout."], "jumps": []}, {"id": "P1100", "text": ["There are two types of multimeters. ..........."], "jumps": []}, {"id": "P1092", "text": ["The multimeter will measure that electrical quantity, but it can also measure others."], "jumps": []}, {"id": "P1091", "text": [], "jumps": []}, {"id": "P1090", "text": ["What electrical quantities does a multimeter measure?"], "jumps": []}, {"id": "P1080", "text": ["However, with a multimeter the technician can measure any of the three quantities."], "jumps": []}, {"id": "P1070", "text": ["There are meters that only measure one of the three quantities.", "Ammeter Voltmeter Ohmeterrrr"], "jumps": []}, {"id": "P1060", "te let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
