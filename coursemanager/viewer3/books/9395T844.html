 of the connector with the numeral 1 or 2..", "CAUTION -400 card has its own chassis."], "jumps": ["P13100", "P13080"]}, {"id": "P13100", "text": ["5.  Press enter to set: Positive Supply Voltage -  5", "5. Press enter to set: Positive Supply Voltage - 5......................."], "jumps": ["P13090"]}, {"id": "P13110", "text": ["6.  Press enter to set: PC3 DC Power Switch - ON", "6. Press enter to set: PC3 DC Power Switch - ON..........................."], "jumps": []}, {"id": "P13115", "text": ["7.  Press enter to set: PC2 DC Power Switch - ON", "7. Press enter to set: PC2 DC Power Switch - ON..........................."], "jumps": []}, {"id": "P13120", "text": ["8.  Press enter to set: PC1 DC Power Switch - ON", "8. Press enter to set: PC1 DC Power Switch - ON..........................."], "jumps": []}, {"id": "P13130", "text": ["9. The microprocessor system is now assembled and operating. You should see the message \"NIDA Corporation Intel 8086 Vx.x NIDA:\" in the LCD display on the PC130-404 card. If the message is dim or blank, try adjusting the Display Intensity potentiometer R4 on the PC130-404 card using a small screwdriver. If you still cannot see the message, see your instructor for assistance.", "The \"Vx.x\" in the display of the LCD indicates the version of the monitor program you are using. This experiment is written for all versions of the monitor program. If, at any time during the experiment, you short some of the IC pins together while observing the signals, press the reset button. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run the program before proceeding with your measurements.ts."], "jumps": ["P13140"]}, {"id": "P13140", "text": ["The microprocessor setup is complete.  Let's inject a fault into the system and see if we can find where this fault is affecting the system.", "The microprocessor setup is complete. Let's inject a fault into the system and see if we can find where this fault is affecting the system."], "jumps": ["P13130"]}, {"id": "P13220", "text": ["Now let's check another section of the microprocessor system.    One of the utility routines available is the serial port test.", "Now let's check another section of the microprocessor system. One of the utility routines available is the serial port test.", "9. The microprocessor system is now assembled and operating. You should see the message \"NIDA Corporatio"], "jumps": ["P13230", "P13210"]}, {"id": "P13200", "text": ["At this point you should see a status bar on the LCD display.  The microprocessor is checking all memory locations.  So far, it seems as though the keyboard and display are working properly.", "At this point you should see a status bar on the LCD display. The microprocessor is checking all memory locations. So far, it seems as though the keyboard and display are working properly."], "jumps": ["P13210", "P13190"]}, {"id": "P13210", "text": ["Wait until the memory scanning utility has stopped.  No errors in memory should be indicated.  This program is a diagnostic routine written for a quick easy method for testing the system RAM.  Imagine testing all 64 thousand locations by hand!", "Wait until the memory scanning utility has stopped. No errors in memory should be indicated. This program is a diagnostic routine written for a quick easy method for testing the system RAM. Imagine testing all 64 thousand locations by hand!"], "jumps": ["P13220", "P13200"]}, {"id": "P13235", "text": ["12.  Press Enter.  The display indicates that the serial port test              failed.  If  a fault was not present the display would have                  indicated \"TEST PASS\".", "12. Press Enter. The display indicates that the serial port test failed. If a fault was not present the display would have indicated \"TEST PASS\".hile J3's are off, indicating a fault."], "jumps": ["P13240", "P13230"]}, {"id": "P13260", "text": ["13. The computer will now remove the fault. em is removed."]  the harder ones.", "Errors like this may go undetected for some time if that function of the microprocessor isn't utilized. With most possible faults, you would go through the list one by one, performing the easiest checks first before proceeding to the harder ones."], "jumps": ["P13290", "P13270"]}, {"id": "P13240", "text": ["The serial port test checks the transmit and receive functions throughout the system.  There could be many reasons why the serial port test failed: bad cabling between the cards, defective parts, parts failure, shorts between pins or solder runs or simply an IC not being fully seated.", "The serial port test checks the transmit and receive functions throughout the system. There could be many reasons why the serial port test failed: bad cabling between the cards, defective parts, parts failure, shorts between pins or solder runs or simply an IC not being fully seated."], "jumps": ["P13250", "P13235"]}, {"id": "P13330", "text": ["In this situation, the A1 line from the microprocessor has an open just before it reaches the display circuitry.  This causes the address values sent to the display circuitry to be incorrect.", "In this situation, the A1 line from the microprocessor has an open just before it reaches the display circuitry. This causes the address values sent to the display circuitry to be incorrect. i"], "jumps": ["P13340", "P13320"]}, {"id": "P13340", "text": ["Let's manually bypass this problem and see if it fixes the problem.", "Let's manually bypass this problem and see if it fixes the problem. fixes the problem."], "jumps": ["P13350", "P13330"]}, {"id": "P13350", "text": ["14.  Connect a jumper from the A1 test point (TPB4) on the                      PC130-410 card to the A1 test point (located to the right of               the display) on the PC130-404 card.", "14. Connect a jumper from the A1 test point (TPB4) on the PC130-410 card to the A1 test point (located to the right of the display) on the PC130-404 card. keyboard unit." s a burn-in.", "In some cases, in order to identify a fault or to ensure reliability, it may be necessary to leave the system on for an extended period of time. If the system does contain an itermittent fault, it will usually show up during this time. This is usually referred to as a burn-in. burn-in, to make sure some faults don't occur after the system has been on for long periods of time."], "jumps": ["P13390", "P13370"]}, {"id": "P13430", "text": ["1.  Set the Console Power Switch to OFF.", "1. Set the Console Power Switch to OFF...................................."], "jumps": []}, {"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-09-99 Converted to toolbook. frieda 08-10-99 Formatted lesson. frieda 08-11-99 Replaced Caution Text box. frieda 08-19-99 Test. debbie 08-26-99 Reviewed and changed. debbie 11-16-99 Changed steve's comments. debbie 11-18-99 Changes. frieda 01-05-00 Fixed P1341 thru P1348. debbie 06-02-00 Checked question format. -Penny 06-16-00 Quiz questions format - lisa 07-14-00 Converted to ToolBook 7.1 format. jay 07-21-00 Changed Book Script for Ctrl S schematic - lisa 10-27-00 Add Monitor Pro code to quiz pages. jay 12-05-00 Added HelpPage information and new random gen. script. -Penny 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-12-02 Checked for convertion errors. John Ayala 06-20-02 Review - lisa 07-09-04 P2910, P13910 added eox script - patty 03-", "07-29-99 Converted to new question format. jay 08-09-99 Converted to toolbook. frieda 08-10-99 Formatted lesson. frieda 08-11-99 Replaced Caution Text box. frieda 08-19-99 Test. debbie 08-26-99 Reviewed and changed. debbie 11-16-99 Changed steve's comments. debbie 11-18-99 Changes. frieda 01-05-00 Fixed P1341 thru P1348. debbie 06-02-00 Checked question format. -Penny 06-16-00 Quiz questions format - lisa 07-14-00 Converted to ToolBook 7.1 format. jay 07-21-00 Changed Book Script for Ctrl S schematic - lisa 10-27-00 Add Mon let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
